title: Senior Backend Engineer
company: Rain Technologies Inc.
location: New York, USA
work_type: FULL_TIME
company_size: 175 Employees
description: |
  Rain is the world's first AI Financial Health Platform,
  serving 3.5 million employees at leading organizations like
  McDonald's, Marriott, and T-Mobile. Rain works in the
  background to optimize every employee's financial life to
  prevent shortfalls and build long-term stability. Backed by
  top investors including QED and Prosus, Rain has raised
  $150M in venture funding to fuel our next stage of hyper
  growth.



  We are looking for a Senior Backend Engineer in NAMER. This
  position is hybrid in New York City. The candidate will be
  responsible for managing various areas of our backend
  platform, including API integrations with 3rd-party vendors
  and partners. As a Backend Engineer you will play a central
  role in making it easier for users to access Rain and build
  products that help users maintain positive cash
  availability. You will work with our international product
  and engineering teams to manage products in the interception
  of the banking, payroll and timekeeping domains. Our ideal
  candidate is excited to tackle tough technical challenges
  and looking for opportunities to contribute to our strategic
  thinking

  What You’ll Do:

  - Translate product requirements into robust technical
    solutions, recommend alternative approaches, and lead
    engineering efforts to meet ambitious targets
  - Design and implement reliable systems and applications in a
    fully distributed micro-services architecture
  - Build and maintain integrations with 3rd-party vendors and
    partners
  - Design and implement highly available RESTful APIs
    supporting user-facing web and mobile applications
  - Focus on creating reusable code and libraries that ensure
    scalability for future projects
  - Enforce observability best practices, leveraging tools like
    logging, metrics, and alerting systems
  - Create and maintain detailed technical documentation
    (architecture designs, APIs, workflows, and system
    configurations)
  - Continuously monitor systems for opportunities to maximize
    performance and scalability

  Who You Are:

  - You have at least 5 years of professional experience as an
    engineer
  - You have a strong ability to take ownership of projects,
    driving initiatives from concept to completion, while
    proactively identifying challenges and solutions
  - You have excellent cross-functional collaboration and
    communication skills
  - You’re familiar with complex large scale distributed systems

  Required Technical Qualifications:

  - Proficient in backend languages: Go/Golang
  - Strong expertise in designing and developing RESTful APIs
  - Expertise in SQL and NoSQL database technologies, including
    data model design and optimization
  - Proven experience at building reliable and scalable user-
    facing applications
  - Proficiency in message queuing systems such as Kafka
    (preferred), RabbitMQ, or Flink
  - Familiarity with Cloud technologies: AWS/Azure/GCP,
    serverless, Docker, Kubernetes, ECS among others
  - Effective release management experience for ensuring zero
    downtime and experience with CI/CD frameworks such as
    Gitlab CI and Github actions

  Compensation:

  $180,000 - $220,000

  Note this is a range and we take in a variety of factors
  when determining total compensation for the position.

  How we care for our team:

  Along with competitive salaries, Rain offers great benefits
  including:

  - Flexible PTO
  - Medical, Dental, Vision, Life, Disability coverage
  - Parental leave
  - Monthly stipend
  - Equity options

  Diversity, Equity and Inclusion Commitments

  As part of our dedication to the diversity of our workforce,
  Rain is committed to Equal Employment Opportunity and does
  not discriminate based on race, religion, color, national
  origin, ethnicity, gender, sex (including pregnancy),
  protected veteran status, age, disability, sexual
  orientation, gender identity, gender expression, or any
  unlawful criterion existing under applicable federal, state,
  or local laws. If you need assistance or accommodation due
  to a disability, you may contact us at Careers@rain.us.

  What’s Next

  Ensuring a smooth and enjoyable candidate experience is
  critical for us. Our interview process tends to take about 4
  weeks to complete, but may fluctuate depending on the role.
  Learn more about our hiring process here. Don’t be afraid to
  let us know if you need more flexibility.
