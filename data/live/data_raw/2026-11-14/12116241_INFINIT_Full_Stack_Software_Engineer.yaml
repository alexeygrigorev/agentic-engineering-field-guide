description: |
  Job Title: Full Stack Software Engineer

  Type: Full-time

  Location: London



  What about us?



  Launched in 2023, INFINIT is a fast-growing fintech scale-up
  operating in multiple countries across Europe and Americas.



  At INFINIT we are on a mission to reshape the future of SMEs
  with AI at the forefront. Our all-in-one operating system
  has banking at its core, and empowers small business owners
  and their teams to seamlessly manage and optimize every
  aspect of their business with AI agents.



  By focussing on specific industries, INFINIT delivers
  tailored, high-value solutions, while building innovative AI
  products to further unlock significant growth opportunities
  for our customers. INFINIT operates globally, with ambitions
  to further expand its footprint to redefine the fintech
  landscape for SMEs worldwide.



  Join us on the INFINIT journey as we revolutionise the SME
  economy and drive meaningful impact through innovation 🚀



  The Role



  We are hiring a Full Stack Software Engineer to drive our
  product development cycle. This role is built on the
  philosophy that the best engineers don't just write code,
  they build solutions. Your primary responsibility is to
  bridge the gap between business needs and technical
  execution, rapidly translating high-level goals into
  polished, shipped features.



  You will be expected to challenge requirements, bring a
  product-first mindset to the engineering team, and ensure
  every line of code adds tangible value. This role demands
  strong software engineering proficiency and acute product
  judgment to prioritize and ship high-impact features in a
  fast-paced environment.

  What do you need to be successful in this role?

  - Exceptional software engineering and system design
    capability, with proven experience designing, building,
    and shipping production-grade, scalable systems across the
    full stack (including C#, Python, and Typescript
    proficiency), always prioritizing technical clarity and
    maintainable architecture.
  - A "Product-First" Engineering Mindset, demonstrating the
    ability to analyze business needs and challenge
    assumptions. You don't just build what is asked; you build
    what is needed to move the needle for the product and the
    user.
  - End-to-end feature ownership, driving the entire development
    lifecycle from defining requirements to robust
    implementation, QA, deployment and monitoring, maintaining
    high accountability for the final user and business
    outcome.
  - Strategic communication skills, capable of seamlessly
    translating deep technical concepts for business
    stakeholders and, conversely, translating complex business
    objectives into prioritized, elegant engineering
    solutions.
  - High-velocity development, leveraging modern developer tools
    (such as agentic coding or advanced automation techniques)
    to achieve accelerated delivery while rigorously upholding
    code quality and architectural integrity.

  What will you find working at INFINIT?

  - Competitive Salary and Equity: We offer highly competitive
    salaries and a stake in our success with share options
    because we're building this together.
  - Diverse and Inclusive Team: Join a dynamic and international
    team in excess of 8 nationalities. You'll have the chance
    to work with experienced professionals from around the
    world, fostering a rich learning environment.
  - Inspiring Mission: We are dedicated to revolutionizing
    business financing and making a positive impact on the
    European economy. Your work at INFINIT will have a lasting
    effect on businesses and communities.
  - Flexible Benefits: Access Flexible Retribution benefits with
    Cobee through a convenient mobile app
  - Health and Well-being: Your health matters to us. You will
    have access to top-quality Medical & Mental Health
    Insurance and corporate gym discounts.
  - Quality Time Together: We foster a sense of community with
    annual gatherings and bi-weekly office team gatherings.
    You're more than welcome to join us for quality time.
  - Personal Time Off: Enjoy flexibility with your personal time
    off as well as your birthday off.
  - Flexibility and Ownership: We trust our team and we are
    goal-oriented. Enjoy the flexibility of hybrid working 3
    days a week in our London office and 2 days at home.

  Diversity and Inclusion



  INFINIT promotes an inclusive culture that seeks equity and
  values different perspectives. We are proud to be an equal
  opportunity employer and consider all qualified applicants
  for employment without regard to race, color, religion, age,
  sex, sexual orientation, gender, gender identity, national
  origin, disability, veteran status or any other legally
  protected characteristic.
