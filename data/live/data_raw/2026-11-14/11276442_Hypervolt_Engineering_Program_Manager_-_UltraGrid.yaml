description: |
  About Hypervolt Limited

  Hypervolt is at the forefront of the electric vehicle
  charging revolution, dedicated to providing innovative and
  reliable EV charging solutions. We launched in 2021 with the
  bold ambition to transform the EV charging space through a
  relentless focus on the customer experience, great software,
  and beautifully designed British hardware.

  In a short timeframe, we became Trustpilot's highest rated
  EV charging manufacturer in the industry. We are proud to
  have been named the third fastest growing company in the UK,
  as part of the Deloitte Fast 50, and 6th fastest growing
  company in EMEA, as part of the Deloitte Fast 500.
  Additionally, Hypervolt was voted DrivingElectric’s Home EV
  Charger of the Year 2023 & 2024, a testament to our focus on
  innovation and democratising EV ownership.

  What You’ll Do

  - Coordinate a Single-Track Roadmap: Serve as the primary
    point of contact between the UX team, engineering, product
    management, and other stakeholders, aligning everyone to
    one overarching roadmap.
  - Plan & Track with Jira: Use Atlassian Jira as the central
    project management tool, setting milestones, tracking
    progress, and ensuring on-time delivery.
  - Define Project Scope & Goals: Collaborate with leadership
    and stakeholders to clarify requirements, set objectives,
    and outline deliverables for each phase.
  - Risk Management & Problem-Solving: Identify potential
    bottlenecks, issues, or conflicts early, proposing
    solutions to maintain momentum.
  - Cross-Functional CollaborationCross-functional collaboration
  - Stakeholder Communication: Provide regular updates on
    project status, challenges, and successes to technical and
    non-technical stakeholders.
  - Mentor & Lead: Encourage best practices in project
    organization and teamwork, fostering an environment of
    ownership, accountability, and proactive problem-solving.

  Projects You’ll Work On

  As part of our User Experience team, you will focus on the
  most important family of products Hypervolt creates for its
  customers:

  - UltraGrid: Our core backend engine for serving hundreds of
    thousands of connected homes with real-time data.
    UltraGrid is a connectivity layer that facilitates grid
    balancing and integration with some of the world's largest
    VPPs and energy retailers.
  - Built to allow rebalancing the grid and sustain EV adoption
    at mass scale, UltraGrid aims to be a masterpiece of
    performance engineering, deeply focused on performance and
    cost, while streaming 100,000 telemtries daily from each
    connected household.

  What We’re Looking For

  - Experience at the Highest Level of Professional Software
    Development: While this is not a coding role, you should
    be able to collaborate closely with “super hardcore”
    engineering teams and navigate complex development
    projects.
  - Startup Background: Previous experience in a startup
    environment is highly valued; you should be comfortable
    operating with less structure than in a large corporate
    setting.
  - Tier-1 Software company background: Our engineers come from
    Tier 1 software companies, such as Google, Twitter, and
    Netflix, organisations where software quality and
    performance matter. You will need deep experience
    interacting with experienced engineers and complex
    requirements.
  - Consumer-Facing Products: A proven track record of
    successfully managing projects for products at scale
    (experience with large-scale consumer tech is a plus).
  - Technical & Customer Insight: You understand technology
    deeply and recognize what our customers want, translating
    user needs into actionable product goals.
  - Fast-Growing Environment: Ability to thrive in a rapidly
    scaling, fast-paced company, juggling multiple priorities
    and projects simultaneously.
  - Green Energy Enthusiasm: Bonus points if you’re passionate
    about electric cars, energy transition, or sustainability
    initiatives.

  Benefits

  - Competitive Salary & Generous Stock Options: Be rewarded for
    helping us grow and succeed.
  - Hybrid Working Policy: 3 days a week in our prime offices in
    Canary Wharf London, and flexibility to work from home the
    rest of the time.
  - Diverse International Environment: English is the company's
    primary language, and our team is spread across different
    countries and cultures.
  - Professional Growth: Career advancement and professional
    development opportunities in a fast-growing company.
  - Inclusive Environment: Join a diverse, inclusive team that
    values collaboration and innovation.

  Our ValuesBe persistent

  What we aim to do is not always going to be easy, and
  problem-solving, no matter how big or small, is essential if
  we are going to achieve our mission. Whether it be a
  technical challenge you are struggling to unblock, a new
  client you are trying to win or a logistical puzzle you need
  to solve, the only way we will grow as a company and as
  individuals is by being persistent in working things through
  to a solution. Success seldom comes from the first attempt,
  but it almost always comes from the 1000th, and the
  difference between success and failure often isn’t
  persistently or the aha moment or the brilliant idea: it’s
  having the perseverance to continue pushing and never giving
  in to failure.

  Be accountable

  We operate in a fast-paced, highly collaborative and
  increasingly autonomous environment at Hypervolt. We are on
  the journey from a scrappy startup to a true market
  contender, but no matter how big the company gets, treat it
  as your own. Be accountable for its progress, and look after
  it as you would your creation. If you know things can be
  improved, articulate them, say them, and don’t go along in
  the silence of knowing we could have done better. If we make
  a mistake, find a way to say it. There’s no value in keeping
  it to yourself; we will succeed or fail together.

  The ‘Ello Sir Ethos

  We should always aim to treat people the way they want to be
  treated and always remember the “voting” power of customers.
  They are the actual boss and real “employer”—the market.

  Dare to dream

  Every technological advancement we use today was once a
  crazy dream that a few persistent pioneers truly believed.
  “Most things have to be seen to be believed, but some things
  have to be believed to be seen!” – Steve Jobs, on building
  the Apple Mac, the best-selling computer of all time.

  Stay hungry, stay foolish.

  The hunger and ambition for continuous success are the
  orbital solar beam-powered reactor at the core of our
  success, and our ability to stay foolish and humble and
  continue to let ourselves be educated by our market will
  help us reach the full potential of our ambition. Only
  through the most selfless dedication to our dreams will we
  achieve the most selfish of successes.

  True Greatness is Blind

  Great ideas and execution can come from anyone and anywhere
  at any time.

  Apply now

  Cross-functional collaboration
