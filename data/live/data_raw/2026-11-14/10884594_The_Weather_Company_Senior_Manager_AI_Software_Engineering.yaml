description: |
  About The Weather Company:

  The Weather Company is the world’s leading weather provider,
  helping people and businesses make more informed decisions
  and take action in the face of weather. Together with
  advanced technology and AI, The Weather Company’s high-
  volume weather data, insights, advertising, and media
  solutions across the open web help people, businesses, and
  brands around the world prepare for and harness the power of
  weather in a scalable, privacy-forward way. The world’s most
  accurate forecaster globally, the company reaches hundreds
  of enterprise clients and more than 360 million monthly
  active users via its digital properties from The Weather
  Channel (weather.com) and Weather Underground
  (wunderground.com). AI is part of how we work: Human
  judgment, expertise, and creativity remain essential and are
  amplified by AI. We expect everyone in this role to use AI
  thoughtfully and proactively to accelerate their
  performance, improve the quality of their work, and explore
  new possibilities. We are looking for people who are
  curious, adaptable, and excited to help shape an AI-enabled
  culture that delivers better outcomes for our customers and
  our company.

  Job brief:

  The Senior Manager, AI Software Engineering is a pivotal
  leadership role responsible for guiding a high-performance
  team in the execution and deployment of cloud-native AI
  architectures. As a player-coach, you will balance strategic
  management with hands-on development, overseeing the full
  software lifecycle from requirements to deployment on AWS
  infrastructure. You will drive innovation by integrating
  emerging AI technologies—such as Claude, Gemini, and
  OpenAI—while ensuring operational excellence, effective
  resource allocation, and seamless collaboration between
  technical teams and business stakeholders to advance
  enterprise AI adoption.

  The impact you'll make:

  - Lead, mentor, and manage a team of software engineers
    focused on AI execution, fostering a collaborative and
    high-performance work environment.
  - Be a player/coach with 20% hands as part of your day to day
    responsibilities.
  - Conduct regular performance reviews, provide feedback, and
    create development plans to support career growth and
    skill development in cloud-native AI architectures.
  - Ensure effective resource allocation, team productivity, and
    project delivery within timelines and budget constraints.
  - Oversee the entire software and AI development lifecycle,
    from requirements gathering and design to implementation,
    testing, and deployment on Cloud infrastructure.
  - Ensure the team adheres to best practices in coding,
    testing, and documentation, maintaining high standards of
    software quality, and operational excellence.
  - Stay updated with emerging technologies and industry trends,
    and integrate them into the development process as
    appropriate.
  - Collaborate with product managers, stakeholders, and other
    departments to define project requirements, scope, and
    objectives for cloud-based AI solutions.
  - Communicate project status, issues, and risks to senior
    management and stakeholders, providing regular updates and
    reports on both model performance and cloud compute spend.
  - Contribute to the development of the software engineering
    strategy, aligning it with the overall business objectives
    for enterprise AI adoption.
  - Identify opportunities for process improvements, automation,
    and innovation to enhance productivity and efficiency.
  - Participate in long-term planning, including technology
    roadmaps and capacity planning to optimize AWS resource
    utilization for AI workloads.
  - Foster strong collaboration between engineering teams,
    product management, and other departments to ensure
    alignment and effective communication.
  - Act as a liaison between technical teams and non-technical
    stakeholders, translating technical concepts into business
    terms.
  - Other duties as assigned.

  What you've accomplished:

  - Must have: 8+ years of experience in software development,
    with at least 3 years in a leadership role.
  - Strong proficiency in software development methodologies,
    full-stack engineering, and languages (e.g., NodeJS,
    TypeScript, concurrency, JSON, REST, AI - Claude, Gemini,
    OpenAI, nice to have).
  - Demonstrated expertise in Fullstack development in a
    scalable NodeJS environment, Cloud infrastructure, and
    infrastructure as code.
  - Knowledge of DevOps practices, CI/CD pipelines, and
    automated testing
  - Excellent leadership, team-building, and interpersonal
    skills.
  - Ability to motivate and inspire a diverse team of engineers.
  - Strong problem-solving and decision-making abilities for
    evaluating trade-offs between design decisions.
  - Experience with agile development methodologies (e.g.,
    Scrum, Kanban).
  - Strong organizational skills and attention to detail.
  - Ability to manage multiple projects and priorities
    simultaneously.

  Base Salary: $199,800 - $235,000

  The base salary offered will take into account internal
  equity and may vary depending on the candidate’s geographic
  region of work premises, job-related knowledge, skills, and
  experience, among other factors.

  TWCo Benefits/Perks:

  - Flexible Time Off program
  - Hybrid work model
  - Variety of medical insurance options including a $0 cost
    premium employee coverage
  - Benefits effective day 1 of employment include competitive
    401K match with no vesting requirement, national health,
    dental, and vision plans
  - Progressive family plan benefits
  - An opportunity to work for a global and industry-leading
    technology company
  - Impactful work in a collaborative environment
