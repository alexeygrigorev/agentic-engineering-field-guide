description: |
  Company Overview

  At Motorola Solutions, we believe that everything starts
  with our people. We’re a global close-knit community, united
  by the relentless pursuit to help keep people safer
  everywhere. We build and connect technologies to help
  protect people, property and places. Our solutions foster
  the collaboration that’s critical for safer communities,
  safer schools, safer hospitals, safer businesses, and
  ultimately, safer nations. Connect with a career that
  matters, and help us build a safer future.

  Department OverviewMotorola Solutions’ Avigilon Alta Video
  brings cloud video security systems to the next level.
  Alta’s cloud-native video security platform delivers
  industry-leading analytics and exceptional operational
  insights to help organizations observe, oversee, and analyse
  their environments to protect people, property, and places
  in real time. The Alta Video Engineering Team injects
  intelligence into our approach to safety and across every
  solution we engineer. Our team designs, builds, and scales
  intelligent video microservices and distributed cloud
  infrastructure that empower human decision-makers at the
  centre, actively advancing our mission of "Solving for
  safer". Our engineering hub is based in Uxbridge, West
  London, operating under a purposeful hybrid model with two
  collaborative days together on-site each week. Job
  Description

  As a Senior Back End Software Engineer, you will contribute
  to the core ecosystem powering our next-generation Avigilon
  Alta Video platform. Our close-knit engineering team values
  curiosity, high technical ownership, and pragmatic problem-
  solving. In this role, you will design scalable
  microservices, expand analytical capabilities, and
  collaborate across disciplines to deliver cloud solutions
  that matter.

  We embrace an inclusive culture where every voice
  contributes to our collective impact. We recognize that
  talent takes many paths; candidates demonstrating equivalent
  practical experience alongside a strong track record of
  engineering delivery are encouraged to apply.

  Key Responsibilities

  System Architecture & Cloud Engineering

  - Design and implement high-throughput backend services and
    APIs that support real-time video management and
    intelligent analytics
  - Optimize distributed cloud architectures for resilience,
    scalability, low latency, and operational efficiency
  - Guide technical decisions across our service ecosystem,
    driving code quality and robust testing automation

  Feature Delivery & Assisted Intelligence Integration

  - Expand video intelligence pipelines, integrating "Priority
    Intelligence™" features to deliver an Assisted Experience
    that augments human decision-making
  - Develop end-to-end device integration workflows, supporting
    multi-camera configurations, sensor inputs, and advanced
    analytic rule processing
  - Implement reliable telemetry, logging, and operational
    instrumentation to observe and diagnose distributed cloud
    workloads

  Collaborative Ownership & Technical Leadership

  - Partner closely with frontend, firmware, QA, and product
    teams in an agile environment to shape technical roadmaps
    and feature delivery
  - Conduct structured code reviews and provide thoughtful
    engineering mentorship to uphold engineering standards and
    continuous team growth
  - Champion secure development lifecycles, helping to ensure
    that system designs align with modern enterprise
    cybersecurity baselines

  Basic Requirements

  You’re not expected to have all of the following skills, but
  they will be useful in performing your job.

  - Bachelor's Degree in Computer Science or Software
    Engineering
  - Substantial software development experience in backend
    engineering or distributed systems

  Technical Expertise

  - Programming Foundations to architect services in modern
    backend languages, with proficiency in Golang, Python, C,
    C++, Rust, or Java
  - Distributed Cloud Systems to design scalable, fault-tolerant
    microservices and RESTful or gRPC APIs
  - Automated Testing & CI/CD to build resilient test suites and
    maintain continuous integration pipelines
  - English Proficiency to articulate technical concepts and
    collaborate across cross-functional distributed teams

  Professional Experience

  - Technical Mentorship to conduct rigorous peer reviews and
    elevate team engineering practices
  - Agile Collaboration to partner across firmware, web, and
    infrastructure disciplines from design through delivery
  - Problem Solving to isolate and resolve performance
    bottlenecks across complex cloud video ecosystems

  Preferred Qualifications (Optional)

  - Hands-on development experience building production services
    in Go (Golang)
  - Familiarity with TypeScript and modern web architectures
  - Practical background working with video streaming, computer
    vision workflows, or containerized cloud deployments
    (Docker, Kubernetes)
  - Experience with Machine Learning, Computer Vision, AI
    technologies.

  The Avigilon Alta Video teams default to programming using
  Go for backend and Typescript for frontend, but also use a
  wide variety of different languages and frameworks. It is
  not expected that you would be familiar with Go (or any of
  the other languages we use) but you should be enthusiastic
  and willing to learn new things!

  We are looking for a team player who thinks holistically,
  enjoys solving complex problems and thrives in an agile,
  cross functional environment.

  We believe that a diverse and inclusive workplace spawns
  innovation – the more diverse our employees are, the more
  ideas and talents we have to excel as a leader in the
  technology sector. If you would like to be part of a dynamic
  team of people who are ambitious, focused, and hardworking
  then we look forward to meeting you!

  In return for your expertise, we’ll support you in this new
  challenge with coaching & development every step of the way.
  Also, to reward your hard work you’ll get:

  - Competitive salary and bonus schemes.
  - Two weeks additional pay per year (holiday bonus).
  - 25 days holiday entitlement + bank holidays.
  - Attractive defined contribution pension scheme.
  - Employee stock purchase plan.
  - Flexible working options.
  - Private medical care.
  - Life assurance.
  - Enhanced maternity and paternity pay.
  - Career development support and wide ranging learning
    opportunities.
  - Employee health and wellbeing support EAP, wellbeing
    guidance etc.
  - Carbon neutral initiatives/goals.
  - Corporate social responsibility initiatives including
    support for volunteering days.
  - Well known companies discount scheme.

