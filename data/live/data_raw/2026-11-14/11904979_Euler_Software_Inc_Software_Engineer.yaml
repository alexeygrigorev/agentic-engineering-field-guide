description: |
  Software Engineer

  Location: Remote (Must accommodate US East Coast working
  hours)

  About Us

  Partnerships are the future of go-to-market. They drive
  30-50% of company revenue, yet most partner teams are stuck
  with spreadsheets, email chains, and outdated CRMs, tools
  never built for partnerships at scale. The result? Wasted
  time, lost deals, and inefficiencies that kill growth.

  EULER is the AI-native PRM for modern partnership teams,
  built to replace manual work, eliminate partner friction,
  and turn partner activity into repeatable revenue and
  measurable ROI. We are not iterating on legacy PRM software.
  We are redefining what the category even is, and the market
  is taking notice.

  We grew 600% YoY in 2025 and serve industry leaders,
  consistently winning against legacy solutions in competitive
  deals. We move fast, build intentionally, and lead the
  market on innovation and AI. If you're excited to solve big
  problems, work with smart teammates, and shape the future of
  partner tech, we'd be glad to meet you.

  Role Overview

  As a Software Engineer, you will play a pivotal role in
  ensuring our clients achieve seamless integration with our
  platform, built on Bubble.io. This role requires a
  combination of technical expertise, problem-solving skills,
  and a deep understanding of Bubble.io. You will be
  responsible for crafting custom integration solutions,
  managing client onboarding, and supporting our users.

  Key Responsibilities

  - Develop and implement bespoke integration calls with
    customers, tailored to their specific needs.
  - Provide expert guidance on the capabilities and best
    practices of Bubble.io.
  - Build and maintain CRM integrations with Salesforce,
    HubSpot, and other platforms as required.
  - Utilize Python and Pandas for data manipulation tasks,
    ensuring data integrity and usability.
  - Design and deploy microservices on AWS using Lambda,
    enhancing our infrastructure's scalability.
  - Collaborate closely with our development team to innovate
    and refine our platform.

  What We're Looking For

  - Proven expertise in Bubble.io, with a strong portfolio of
    projects. Bubble.io certification is highly desirable.
  - Proficiency in Python, JavaScript, or Node.js.
  - Good English communication skills, mainly written.
  - Ability to work within US East Coast hours. Strong
    preference for candidates based in Brazil.
  - A proactive, problem-solving attitude, with ability to work
    independently and as part of a dynamic team.

  Nice to Have

  - Experience building microservices on AWS, particularly using
    Lambda.
  - Demonstrated ability to develop and maintain CRM
    integrations with Salesforce and HubSpot.
  - Fluency in English.

  Why Join Us

  - The opportunity to be part of an exciting startup journey,
    contributing directly to company growth.
  - A remote working environment with flexibility to work from
    anywhere.
  - A competitive salary.
  - A supportive and innovative team culture where your ideas
    and contributions are valued.
  - Opportunities for professional development and growth.
