description: |
  We’re seeking a future team member for the role of Director,
  Full-Stack Engineer to join our team. This role is located
  in Manchester or London.

  Role Summary:

  We are seeking a Full Stack Developer to join the Enterprise
  Transformation Hub and help accelerate the adoption of AI-
  enabled solutions across our engineering and transformation
  ecosystem. This role will bring end-to-end development
  expertise, spanning user experience, application logic,
  APIs, data integration, and AI solution delivery. The
  successful candidate will design and build scalable
  developer-focused solutions, connecting front-end
  experiences with data and context layers to enable
  practical, high-impact outcomes. Working across product,
  engineering, and platform stakeholders, they will help turn
  emerging AI opportunities into robust, usable capabilities
  that improve efficiency, insight, and delivery at scale.

  In this role, you’ll make an impact in the following ways:

  - Consult with IT and business managers on issues, questions,
    and problems related to area of expertise
  - Resolve highly complex problems that impact the
    corporation’s ability to conduct business
  - Write well-designed, testable, and efficient code, and
    develop flowcharts, layouts, and documentation to support
    requirements and solutions
  - Analyze, design, and develop tests and test automation
    suites, integrate software components into a fully
    functional software system, maintain software
    functionality and currency, and actively participate in
    code reviews
  - Apply security and privacy principles, leverage in-depth
    knowledge of technologies to influence broad-based
    technology strategy for large IT divisions, educate
    business leaders on IT strategies, advocate for innovative
    technology solutions, and mentor junior engineers
  - Use in-depth knowledge of multiple technologies to help
    shape and influence broad technology strategies for large
    IT divisions
  - Stay current on emerging technologies and actively engage in
    learning by completing required mandatory training and
    policy awareness curricula on time
  - Leverage learning tools such as Pluralsight to achieve
    recommended and aspirational goals outlined in personal
    development plans
  - Educate business leaders and prepare presentations on IT
    strategies to support informed decision-making
  - Advocate for innovative, creative technology solutions and
    mentor junior-level engineers to support their development

  To be successful in this role, we’re seeking the following:

  - Bachelor’s degree in computer science, engineering, or a
    related discipline, or equivalent work experience
    required; advanced degree is beneficial
  - Significant experience in software development required;
    experience in the securities or financial services
    industry is a plus
  - Prior experience using a specific application development
    toolkit, including Python, SQL, Java, JavaScript, JSON,
    and TypeScript
  - Strong communication, organization, teamwork, and
    interpersonal skills, including the ability to support
    mentoring
  - Demonstrated understanding of interdependencies and business
    impact of future IT plans
  - Extensive experience selecting and implementing vendor-
    specific methodologies and prior consulting experience
    with structured methodologies
  - Extensive experience developing and supporting mainframe
    applications required
  - Broad experience with multi-platform development tools and
    toolkits
  - Proficiency in multiple programming languages and
    frameworks, demonstrating expertise in full-stack
    development
  - Strong problem-solving skills and the ability to think
    critically and strategically

  About Us

  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

