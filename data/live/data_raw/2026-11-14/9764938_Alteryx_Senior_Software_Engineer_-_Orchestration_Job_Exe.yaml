  Senior Software Engineer - Orchestration & Job Execution
  (Cloud Platform)

  Alteryx is looking for a Senior Software Engineer to join
  our cloud platform engineering team. In this role, you will
  help design, build, operate, and evolve backend services
  that coordinate how work moves through Alteryx Cloud. You
  will work on platform capabilities related to orchestration,
  job execution, workflow runtime services, and reliable
  service-to-service coordination. This is a senior
  engineering role for someone comfortable owning complex
  production systems end to end. You should be able to reason
  about distributed systems, asynchronous processing,
  reliability, observability, failure modes, and operational
  tradeoffs. You will partner with platform, product,
  security, QE, and application teams to make cloud platform
  capabilities reliable, understandable, and safe to operate
  at scale. The role is backend-heavy and involves building
  APIs, services, workers, libraries, and runtime
  infrastructure. You will work with modern cloud-native
  systems and technologies such as TypeScript/Node.js,
  relational databases, messaging or queueing systems, event-
  driven architecture, containers, Kubernetes, and
  observability tooling.

  What You’ll Do

  - Design and deliver backend services, APIs, workers, and
    shared libraries that power cloud platform capabilities.
  - Build and improve systems for orchestrating work across
    services, including job submission, execution tracking,
    status propagation, retries, cancellation, results, and
    operational visibility.
  - Develop reliable asynchronous and event-driven systems using
    queues, messaging, background workers, and durable state.
  - Work on distributed execution flows across platform
    services, including service-to-service communication,
    routing, acknowledgements, and failure recovery.
  - Build and maintain cloud-native runtime infrastructure using
    containers, Kubernetes, deployment automation, and related
    platform tooling.
  - Integrate platform services with persistence layers, event
    streams, REST APIs, and internal service contracts.
  - Improve production reliability through metrics, tracing,
    structured logging, health checks, dashboards, alerting,
    runbooks, and incident follow-up.
  - Lead technical design for ambiguous or cross-service work,
    review code with a systems mindset, and mentor engineers
    on distributed-system and production-engineering
    practices.
  - Collaborate with partner teams to turn product requirements
    into incremental, testable, and operable platform
    capabilities.
  - Use AI and modern development tools to improve engineering
    productivity, code quality, and delivery speed.

  What We’re Looking For

  - 4+ years of professional software development experience,
    with meaningful ownership of production backend services,
    cloud platform capabilities, or distributed systems.
  - Strong experience building backend services, APIs, shared
    libraries, or long-running workers using TypeScript,
    Node.js, or comparable backend technologies.
  - Experience designing and operating asynchronous, queue-
    driven, or event-driven systems, including patterns such
    as retries, cancellation, idempotency, concurrency,
    ordering, timeouts, and failure handling.
  - Experience working with durable persistence, service
    contracts, RESTful APIs, and integrations across multiple
    services or platform components.
  - Experience with cloud-native production systems, including
    containers, Kubernetes or similar orchestration platforms,
    service health, scaling behavior, and operational
    debugging.
  - Strong production engineering practices, including testing,
    observability, structured logging, metrics, tracing,
    incident response, and continuous reliability improvement.
  - Ability to lead design discussions, communicate technical
    tradeoffs clearly, mentor other engineers, and drive
    cross-team work through ambiguity with an ownership-
    oriented mindset.

  Nice to Have

  - Experience with workflow engines, orchestration systems, job
    runners, task execution platforms, or runtime
    infrastructure.
  - Experience with Kubernetes deployment patterns, GitOps,
    multi-cluster environments, cloud platform operations, or
    infrastructure automation.
  - Experience with messaging systems, event contracts, schema
    management, asynchronous notification pipelines, or
    distributed service coordination.
  - Experience with real-time communication, long-lived
    connections, service-to-service messaging, or coordination
    across unreliable networks.
  - Experience with secure service-to-service authentication,
    token handling, secrets management, authorization
    boundaries, or customer-scoped execution contexts.
  - Experience with log collection, log streaming, distributed
    workload observability, operational dashboards, or
    production support tooling.
  - Bachelor’s degree in Computer Science, Engineering, or
    equivalent practical experience.

  Success Looks Like

  - Within 30–60 days, you understand the cloud platform
    architecture, can trace work across key services, and are
    shipping focused improvements with clear tests and
    operational awareness.
  - Within 90+ days, you are owning senior-level workstreams
    across service boundaries, improving reliability and
    debuggability, leading design decisions, and helping the
    team make platform behavior safer, clearer, and easier to
    operate.
  - Over time, you become a go-to engineer for distributed
    execution and orchestration patterns across Alteryx Cloud,
    raising the bar for platform correctness, production
    maturity, and cross-team delivery.

