description: |
  About Amperos

  Amperos is healthcare's first AI-native denial management
  and revenue recovery platform. Our agentic AI works claims
  end-to-end, from portal follow-ups and payor calls to
  appeals and medical records, so providers can resolve more
  denials, recover more revenue, and focus on what matters
  most: serving patients.

  We just closed a $16M Series A led by Bessemer Venture
  Partners, with continued participation from Uncork Capital
  and Neo. We're still small, still early, and going after a
  $260B+ problem that's only getting worse. If you want to
  work on hard problems that matter, alongside people who care
  deeply about the mission (and each other), we'd love to meet
  you.

  About the role

  We’re building an agentic platform to tackle administrative
  workflows for healthcare providers. This means everything
  from building a workflow platform, productizing AI agents,
  and thinking about how humans and AI interact within
  software. We are looking for full stack engineers to partner
  closely with our clients to solve some of their biggest RCM
  workflow inefficiencies.

  As an engineer at Amperos, you’ll get to work on frontier
  problems in AI and use the latest AI technology. You’ll work
  side by side with our customers to prototype end-to-end
  solutions to workflows and productize those prototypes.

  What you’ll do

  - Partner closely with customers to build end-to-end agentic
    workflows
  - Work on building voice AI, browser agents, and generative AI
    features
  - Build traditional full-stack features, tools, and
    automations to support these agentic products
  - Lead both 0-1 projects but also 1-X
  - Develop deep expertise in RCM workflows to be able to
    empathize with our users and make good engineering product
    decisions

  Who we’re looking for

  - Strong product minded full-stack engineers (backend
    expertise) that can build LLM products
  - Can work with customers directly to solve their problems
    rather than just following specs
  - Excited to build in an industry that is underserved by
    technology and immerse themselves in the world of
    healthcare billing and revenue cycle management
  - Willing to wear different hats and do whatever is necessary.
    No task is beneath us.
  - High agency. You don’t need much instruction to create
    results. You pride yourself on being able to just figure
    things out.
  - Great communicator both verbally and written. You
    proactively push necessary information to the team rather
    than the team needing to pull info from you.

  Perks & Benefits

  - In-person culture at our Flatiron office in NYC with paid
    lunch and dinner
  - Flexible hours and time off
  - Gym stipend
  - Commuter benefits
  - Health, dental, vision insurance
  - 401(k) with matching contribution
  - Annual offsite

  Our Values

  - Lead with Empathy - Great products and teams are built on
    empathy—whether for our customers, users, or team members.
    We take the time to walk in others' shoes, listen
    actively, and truly understand their challenges, needs,
    and perspectives.
  - Humbly Ambitious - We combine humility with ambition. No
    task is beneath us, and no challenge too big. Greatness
    comes from being willing to do whatever it takes, while
    having the courage to take bold risks and learn from
    failures.
  - Radical Agency - Own your domain. Drive initiatives with
    autonomy and accountability. Think deeply, communicate
    with the team, and maintain a bias for action.

  Amperos never asks candidates for money at any stage of the
  hiring process, including fees for interviews, processing,
  or recruitment. No one at Amperos, or acting on our behalf,
  is authorized to request payment. If you are asked for
  payment, please do not send any money and report it
  confidentially here: Report a Hiring Concern
