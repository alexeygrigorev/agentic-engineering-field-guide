title: Senior Frontend Software Engineer, Flights
company: Navan
location: New York, USA
work_type: FULL_TIME
company_size: 5,000 Employees
description: |
  Navan has transformed the corporate travel, payment, and
  expense landscape by relentlessly prioritizing the user
  experience. As a Senior Frontend Software Engineer in the
  Flights group, you will play an essential role in building
  and scaling Navan’s flagship product—a next-generation
  flight platform that drives global business growth and gets
  people where they need to be.

  This is a high-scale, highly complex engineering environment
  where your work will directly impact travelers worldwide.
  You will solve challenging architectural problems,
  collaborate with a global team of elite engineers, product
  managers, and designers, and write code that powers a
  platform trusted by the world's largest enterprises. If you
  are passionate about developer experience, system
  performance, and building flawless user interfaces, this is
  your place to build.

  What You’ll Do

  - Own the End-to-End Experience: Drive complex features from
    inception to launch. Partner closely with product and
    design to ship impactful features, monitor their real-
    world impact, and iterate based on data.
  - Architect for Scale: Lead application design and implement
    critical portions of our frontend architecture. You will
    translate complex business requirements into scalable,
    high-quality technical frameworks.
  - Champion Operational Excellence: Set the gold standard for
    frontend reliability, performance, and measurability. You
    will define the team's approach to application performance
    monitoring (APM) and continuously optimize the user
    experience.
  - Supercharge Developer Velocity: Build and refine internal
    frameworks and frontend pipelines that drastically improve
    developer experience (DX), code health, and time-to-ship
    for the entire engineering organization.
  - Mentor and Elevate: Establish credibility quickly through
    high-quality code and rigorous design reviews. You will
    mentor fellow engineers on best practices, modern design
    patterns, and system architecture.
  - Bridge the Stack: While this is a frontend-focused role, you
    will have the autonomy to work full-stack. A strong
    understanding of backend systems and APIs will allow you
    to drive holistic, cross-system improvements.

  What We’re Looking For

  - Deep Experience: 5+ years of dedicated UI/frontend
    development experience in high-growth, agile environments.
  - Technical Mastery: Expert-level proficiency in JavaScript
    and TypeScript, with strong hands-on experience in modern
    frontend frameworks, specifically React and Angular.
  - System-Level Thinking: A comprehensive understanding of the
    technical intricacies of large-scale frontend systems,
    with a sharp eye for identifying and executing
    architectural improvements.
  - Leadership & Influence: A proven track record of driving
    positive technical change within engineering
    organizations. You know how to motivate peers, instill
    technical accountability, and achieve measurable results.
  - Collaborative Spirit: A low-ego, high-impact approach to
    problem-solving. You communicate complex technical
    concepts clearly to both technical and non-technical
    stakeholders.

  The posted pay range represents the anticipated low and high
  end of the compensation for this position and is subject to
  change based on business need. To determine a successful
  candidate’s starting pay, we carefully consider a variety of
  factors, including primary work location, an evaluation of
  the candidate’s skills and experience, market demands, and
  internal parity. For roles with on-target-earnings (OTE),
  the pay range includes both base salary and target incentive
  compensation. Target incentive compensation for some roles
  may include a ramping draw period. Compensation is higher
  for those who exceed targets. Candidates may receive more
  information from the recruiter.

  Pay Range

  $113,400—$252,000 USD

  Navan uses AI-assisted Automated Employment Decision Tool
  (Metaview) to assist with evaluating resumes against job
  qualifications for this role. All final decisions are made
  by human recruiters and hiring managers.

  Human oversight: Metaview does not automatically reject
  candidates or make final hiring decisions. Our recruiters
  and hiring managers review all outputs and make the final
  hiring decision regarding every application.

  - Your rights: If you prefer to have your application reviewed
    without AI assistance, you may request a human evaluation
    by entering your email here. Your decision to do so will
    not affect how your candidacy is evaluated.

  Please refer to our Candidate Privacy Notice for more
  information about our processing of personal data, and your
  rights.
