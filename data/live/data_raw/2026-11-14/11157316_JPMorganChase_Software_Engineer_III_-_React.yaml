description: |
  Out of the successful launch of Chase in 2021, we’re a new
  team, with a new mission. We’re creating products that solve
  real world problems and put customers at the center - all in
  an environment that nurtures skills and helps you realize
  your potential. Our team is key to our success. We’re
  people-first. We value collaboration, curiosity and
  commitment.

  As a Software Engineer at JPMorgan Chase within the
  accelerator, you are the heart of this venture, focused on
  getting smart ideas into the hands of our customers. You
  have a curious mindset, thrive in collaborative squads, and
  are passionate about new technology. By your nature, you are
  also solution-oriented, commercially savvy and have a head
  for fintech. You thrive in working in tribes and squads that
  focus on specific products and projects – and depending on
  your strengths and interests, you'll have the opportunity to
  move between them.

  While we’re looking for professional skills, culture is just
  as important to us. We understand that everyone's unique –
  and that diversity of thought, experience and background is
  what makes a good team, great. By bringing people with
  different points of view together, we can represent everyone
  and truly reflect the communities we serve. This way,
  there's scope for you to make a huge difference – on us as a
  company, and on our clients and business partners around the
  world.

  Job responsibilities

  - Significant contributions to designing and building scalable
    and performant front-end solutions written in TypeScript
    using React
  - Working across B2C and B2B features
  - Maintaining high code quality and participating in a strong
    engineering culture.
  - Writing testable code, built for scalability, reliability
    and resilience.
  - Working as part of a cross-functional squad, taking
    ownership of issues and working together with necessary
    stakeholders to drive delivery.
  - An active participant in technical discussions, contributing
    with insightful and informed opinions to the decision
    making process.
  - Leverages enterprise-authorized AI coding assist tools
    within the work environment to improve code quality,
    delivery speed, and productivity across complex
    deliverables (e.g., code generation/refactoring, unit test
    creation, documentation), while validating outputs through
    peer review, automated testing, and secure coding
    standards; contributes learnings and reusable patterns to
    improve broader team effectiveness.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.

  Required qualifications, capabilities and skills

  - Formal training or certification on software engineering
    concepts and applied experience
  - Technical: Commercial experience with React with TypeScript,
    with a strong engineering-first mindset, an ability to
    solve problems elegantly with an emphasis on scalability
    and performance.
  - Adaptability: Thrive in an environment of uncertainty and
    rapid changes in direction.Collaborative Experience: A
    team player who thrives in working in cross-functional
    teams, driving things forward.
  - Quick Learner: Demonstrate a knack for rapid learning and
    possess an ambitious, results-driven personality.
  - Strong Communication: Excellent communication and
    organizational skills to work effectively within a fast-
    paced, high-performing team.
  - Team Player: Ability to excel as part of a cohesive team in
    a high-speed environment.
  - As our company continues to expand, you can expect new and
    exciting growth opportunities to arise swiftly.
  - Hands-on experience using enterprise-authorized AI-assisted
    software development tools within the work environment
    (e.g., for coding, test creation, troubleshooting, or
    documentation) with demonstrated ability to critically
    evaluate, validate, and refine AI-generated outputs for
    correctness, performance, and security.
  - Understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; ability to guide
    peers on safe and effective usage within team practices.

