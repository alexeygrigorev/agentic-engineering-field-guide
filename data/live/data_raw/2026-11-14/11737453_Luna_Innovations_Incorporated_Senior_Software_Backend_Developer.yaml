description: |
  Luna Innovations Location: Elstree, London, UK Contract
  Type: Permanent, Full-Time

  About Us

  Luna Innovations is a global leader in fibre-optic sensing,
  test and measurement technologies, delivering advanced
  monitoring solutions for critical infrastructure across the
  energy, transportation, security, and industrial sectors.

  Our Edge Platform team develops software systems that
  transform vast volumes of real-time sensor data into
  actionable intelligence. Deployed globally in demanding
  customer environments, our platform processes and analyses
  data from Distributed Acoustic Sensing (DAS) and Distributed
  Temperature Sensing (DTS) systems to help customers monitor
  assets, detect anomalies, and make informed operational
  decisions.

  As a Senior Software Backend Developer, you will play a key
  role in building and enhancing the backend services that
  power these solutions. Working with modern C++, distributed
  systems, data processing pipelines, containerised
  applications, and cloud-connected technologies, you will
  help solve complex technical challenges while contributing
  to products used by some of the world's leading energy and
  infrastructure organisations.

  We foster a collaborative and innovative engineering culture
  where developers are encouraged to take ownership, influence
  technical direction, and continuously improve both our
  products and development practices. Working closely with
  multidisciplinary teams in the UK, Germany, and the USA, you
  will have the opportunity to create technology that delivers
  real-world impact on a global scale.

  The Opportunity

  We are seeking a talented and experienced Senior Software
  Backend Developer to join our Edge Platform team based in
  Elstree, London.

  This is a hands-on engineering role where you will play a
  key part in designing, developing, and scaling the backend
  systems that power our next-generation sensing and
  monitoring platform. Your work will directly support the
  processing and analysis of live data from distributed
  sensing systems operating in some of the world's most
  challenging environments.

  As a senior member of the team, you will contribute to
  technical decision-making, drive engineering best practices,
  and collaborate with colleagues across multiple
  international locations to deliver solutions that are
  secure, scalable, and innovative.

  Key Responsibilities

  - Design, develop, and maintain high-performance data
    processing services using modern C++ (C++17 and above).
  - Build and enhance backend services responsible for sensor
    management, data ingestion, analytics, and API
    functionality.
  - Integrate scientific and analytical algorithms developed in
    Python into production-ready software solutions.
  - Develop, deploy, and support containerised applications
    using Docker and Podman across Linux and Windows
    environments.
  - Work collaboratively with software engineers, data
    scientists, product managers, and domain experts to
    deliver high-quality solutions.
  - Improve system performance, scalability, reliability, and
    maintainability across distributed deployments.
  - Contribute to software architecture discussions and
    influence technical direction and best practice adoption.
  - Support and enhance CI/CD pipelines, automated testing, and
    software delivery processes.
  - Implement and promote secure development practices,
    including vulnerability remediation and software
    hardening.
  - Take ownership of features throughout the full software
    development lifecycle, from design through to deployment
    and support.

  Essential Skills and Experience

  - Strong commercial experience developing software in modern
    C++ (C++17 or later).
  - Experience working with SQL databases, particularly
    PostgreSQL.
  - Knowledge of web technologies, including REST APIs and
    WebSockets.
  - Experience with distributed systems and microservices-based
    architectures.
  - Strong Linux development experience and familiarity with
    Windows-based environments.
  - Hands-on experience with container technologies such as
    Docker and Podman.
  - Experience developing and supporting data-intensive
    applications and processing pipelines.
  - Strong understanding of software engineering best practices,
    including Git, CI/CD, testing frameworks, issue tracking,
    and technical documentation.
  - Knowledge of software security principles and secure coding
    practices.
  - Excellent problem-solving skills with the ability to work
    independently and take ownership of technical solutions.
  - Strong communication and collaboration skills, with
    experience working within multidisciplinary teams.

  Desirable Skills and Experience

  The following would be advantageous but are not essential:

  - Experience within industrial monitoring, energy, utilities,
    or infrastructure sectors.
  - Knowledge of signal processing, scientific computing, or
    sensor-based technologies.
  - Familiarity with geophysics, seismic monitoring, or related
    analytical disciplines.
  - Experience working with front-end technologies such as
    Svelte or Angular.
  - Understanding of cybersecurity and industrial compliance
    frameworks, including IEC 62443 and the Cyber Resilience
    Act.
  - Experience implementing Role-Based Access Control (RBAC)
    models.
  - Knowledge of GPU computing or high-performance processing
    techniques.
  - Experience working with cloud-connected or hybrid edge
    computing platforms.

  Why Join Luna Innovations?

  Work on Meaningful Technology

  Your work will directly contribute to solutions that help
  organisations protect critical infrastructure, improve
  operational efficiency, and make data-driven decisions.

  Solve Complex Engineering Challenges

  Join a team building sophisticated distributed systems that
  process real-time sensor data at scale in demanding
  operational environments.

  Influence Technical Direction

  As a senior engineer, you will have the opportunity to shape
  architecture, mentor colleagues, and contribute to
  engineering best practices.

  Professional Growth

  Work alongside experienced engineers, scientists, and
  industry specialists while developing your expertise in
  advanced sensing technologies and modern software
  engineering.

  Collaborative International Team

  Partner with colleagues across the UK, Germany, and the USA
  on innovative projects with global impact.

  Flexible Working Environment

  We support flexible working arrangements and recognise the
  importance of maintaining a healthy work-life balance.

  Luna Innovations is committed to fostering a diverse and
  inclusive workplace. We welcome applications from all
  qualified candidates and are dedicated to creating an
  environment where everyone can thrive and contribute to our
  shared success.
