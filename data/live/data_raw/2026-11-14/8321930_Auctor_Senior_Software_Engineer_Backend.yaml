description: |
  Why Auctor

  Auctor is building the AI layer for professional services
  and software implementation. Think of us as the brain behind
  the best solution engineers, forward-deployed engineers, and
  onboarding teams— automating the documentation, the
  discovery, and the decision-making that powers $400B+ in
  services work. We’re going after one of the biggest software
  categories of the decade.

  The Opportunity

  As a Backend Software Engineer at Auctor, you will own and
  lead engineering projects across our software offerings. You
  will work closely with our operations, GTM, and deployed
  services teams to build state-of-the-art systems that
  provide value to our customers.

  We’re looking for people who want to do the most meaningful
  work of their career—people who are sharp, fast, and
  relentless. No fluff. Just speed, execution, and a shot to
  build something generational.

  This role is based in New York, NY, in person 5 days per
  week.

  What You'll Build

  - Retrieval over large corpora of enterprise documents
  - Backend infrastructure for AI-powered collaborative
    workflows
  - Building multi-step planning agents for enterprise project
    management
  - Enterprise-grade security for sensitive organizational data
  - Evaluating LLMs across document generation and synthesis
    tasks
  - Data ingestion pipelines from enterprise integrations
    (Confluence, Jira, SharePoint, etc.)

  What You Bring

  - 4+ years (post-BS/MS) of backend-focused software
    engineering experience on product-centric teams
  - Track record of building fast-growing SaaS products
  - Experience building backend platforms that can support
    multiple product lines
  - Strong programming skills and general Computer Science
    knowledge
  - Experience architecting scalable systems to support rapid
    growth and enterprise-level traffic
  - Grit - experience working at early-stage startups is a plus
