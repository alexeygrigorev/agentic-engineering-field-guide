description: |
  Assured is on a mission to modernize insurance. Claims
  processing (i.e. should we pay this claim?), while often
  overlooked, is the foundation of the entire industry. It’s
  currently highly manual, involving phone calls, faxes, and
  gut instinct, costing tens of billions of dollars a year. We
  can do better.

  At Assured, we provide large insurers with the software
  solutions they need to win in a modern, technology-driven
  world. From self-service claim-filing software to backend
  fraud detection, we’re the engine that powers claims
  processing for some of the largest insurers in the world.

  The challenges we face are deep and diverse, from creating
  digital experiences that provide comfort and clarity to
  claimants at their most stressed and vulnerable to
  orchestrating large-scale ML-driven decision-making on
  billions of dollars of claims payments, life at Assured is
  dynamic, collaborative, and rewarding.

  We’re looking for a Staff Full Stack Engineer to help define
  the future of our B2B SaaS platform, not just by building
  software, but by fundamentally improving how software gets
  built through AI-assisted engineering.

  This is a highly technical, high-ownership role for someone
  who operates comfortably across the stack, moves quickly
  from idea to production, and embraces modern AI tooling as a
  force multiplier for engineering velocity, product quality,
  and decision-making.

  You’ll architect systems, ship customer-facing experiences,
  mentor engineers, and help shape a culture where AI-native
  development workflows are the standard, not the exception.

  We want someone who thinks beyond tickets and implementation
  details, someone who can leverage AI to prototype faster,
  debug smarter, automate repetitive work, and accelerate the
  entire product development lifecycle.

  What You’ll Do

  🛠️ Build across the stack, from backend services and
  infrastructure to polished frontend experiences, owning
  features from concept through deployment and iteration.

  ⚡ Use AI-assisted development tools (e.g. Cursor, Claude
  Code, Copilot, ChatGPT, Devin, or similar) as part of your
  daily workflow to accelerate delivery, improve code quality,
  and increase engineering leverage.

  🤖 Identify opportunities to integrate AI into both our
  product and internal engineering processes, improving
  customer experience and team productivity.

  👩‍💻 Write high-quality, production-grade code that balances
  speed, maintainability, reliability, and scalability.

  🧠 Drive architectural decisions and platform improvements
  that enable faster product development and long-term
  technical flexibility.

  🗣️ Collaborate closely with product and design to turn
  ideas, customer feedback, and prototypes into intuitive user
  experiences.

  🤝 Mentor engineers and raise the technical bar across the
  organization through thoughtful leadership, feedback, and
  engineering excellence.

  ⚙️ Champion modern engineering practices, including
  automation, observability, AI-enabled workflows, and rapid
  experimentation.

  What You Bring

  📅 8+ years of hands-on software engineering experience,
  ideally within SaaS or large-scale web applications.

  🚀 Proven ability to design and ship complex systems end-to-
  end across frontend, backend, infrastructure, and data
  layers.

  🤖 Strong proficiency with modern AI engineering tools and
  workflows. You actively use AI to code, debug, research,
  prototype, document, and improve productivity.

  ⚡ A bias toward execution and iteration, you know how to
  move quickly without sacrificing quality.

  🎨 Strong product and UX instincts. You care deeply about
  building performant systems and delivering polished user
  experiences.

  🧩 Systems thinking and technical judgment. You can balance
  short-term pragmatism with long-term scalability and
  maintainability.

  💬 Collaborative and low-ego approach. You work effectively
  across engineering, product, and design and communicate
  complex ideas clearly.

  🔧 Adaptability over rigid specialization. We value engineers
  who learn quickly and leverage the right tools, including
  AI, to solve problems effectively.

  Benefits:

  🤑 Competitive Compensation: Competitive salary and equity
  packages for all employees

  🏥 Healthcare Plan: Platinum medical, dental, and vision

  🛡️ Free life insurance: Including long-term disability &
  short-term disability

  🏄 Unlimited PTO: Uncapped vacation days & paid holidays

  👶 Family Leave: Maternity & paternity

  📈 401(k) Contribution: Assured contributes 3% of your
  income, even if you don't contribute

  🏠 WFH Benefits: Lunch on us 2x/week, monthly phone stipend &
  other home office perks

  👪 Health FSAs & HSAs: Pre-tax accounts for out-of-pocket
  medical expenses

  🤝 Team events & Offsites: We're remote, but we regularly get
  together

  **We have been made aware of individuals falsely posing as
  recruiters from Assured Insurance Technologies Inc. Please
  note that we only contact candidates from official
  @assured.claims email addresses and all interviews are
  conducted through verified company channels. If you are
  unsure whether a message is legitimate, please contact us
  directly at recruiting-ops@assured.claims before sharing any
  personal information**

