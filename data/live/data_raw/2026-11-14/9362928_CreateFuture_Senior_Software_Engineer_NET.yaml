description: |
  Job Description

  Role: Senior Engineer (.NET, AWS & AI Engineering)

  Department: Engineering

  CreateFuture is an AI-native consulting partner where people
  do work that matters and are supported to do it well. We
  work side by side with our clients, challenging what’s not
  working and helping them to build the future.

  We work alongside organisations such as PayPal, adidas,
  NatWest, FanDuel, and Money Saving Expert, building digital
  products and services that make a difference while always
  putting people first. Our commitment to craft, quality, and
  culture has helped us scale to over 600 people in just a few
  years.

  About the role and team:

  We are seeking an experienced Senior Engineer with a strong
  background in .NET, AWS, and modern AI-assisted engineering
  practices to join a team delivering and modernising a broad
  range of business-critical applications and services. This
  role combines hands-on software engineering with technical
  leadership responsibilities, helping drive engineering
  quality, platform improvement, and modern development
  practices across a varied .NET landscape.

  The successful candidate will work across a diverse
  technology stack that includes legacy .NET Framework
  applications, WCF and WPF services, alongside modern
  applications being developed on the latest versions of .NET
  through to .NET 10. You will play a key role in building
  scalable cloud-native solutions, improving existing systems,
  and helping shape engineering standards and delivery
  practices.

  This role requires someone comfortable operating within
  challenging technical environments, able to work closely
  with engineering teams and stakeholders to simplify,
  improve, and evolve existing services. Strong communication
  and stakeholder management skills are essential, as many
  existing platforms and services have significant operational
  and organisational investment behind them.

  Key Responsibilities

  - Design, develop, and maintain applications and services
    using .NET technologies and AWS cloud platforms.
  - Work hands-on across a broad .NET technology landscape
    including .NET Framework, WCF, WPF, and modern .NET
    applications.
  - Contribute to the adoption of AI-assisted engineering
    practices and harness engineering approaches across the
    development lifecycle.
  - Identify opportunities to simplify, rationalise, and improve
    existing systems and services.
  - Design and implement Infrastructure as Code solutions using
    Terraform.
  - Support cloud-native engineering practices and platform
    improvements across AWS environments.
  - Contribute to frontend application development using Next.js
    or similar modern JavaScript frameworks.
  - Collaborate with engineering teams and stakeholders to
    deliver pragmatic technical solutions.
  - Promote best practices in software engineering,
    maintainability, scalability, and operational excellence.
  - Support teams through technical challenges and modernisation
    initiatives.

  Work effectively with stakeholders across the business,
  navigating complex and sensitive technical discussions where
  required.

  Required Experience

  - Strong experience as a Senior Software Engineer working
    within .NET environments.
  - Good experience across both modern .NET and legacy .NET
    Framework applications.
  - Strong experience with AWS cloud technologies.
  - Experience implementing Infrastructure as Code using
    Terraform.
  - Good understanding of AI-assisted development tooling and
    harness engineering concepts, with active engagement in
    the space.
  - Experience working within complex or evolving technical
    environments.
  - Frontend development experience using Next.js or similar
    JavaScript frameworks.
  - Strong communication and stakeholder management skills.
  - Comfortable working hands-on within challenging technical
    environments.

  Ability to work collaboratively across engineering and
  business teams.

  Nice to Have

  - Experience modernising legacy enterprise applications and
    services.
  - Exposure to WCF, WPF, and broader legacy Microsoft
    technology stacks.
  - Experience supporting platform consolidation or
    transformation initiatives.
  - Familiarity with CI/CD pipelines, DevOps practices, and
    engineering automation tooling.

  What we’ll offer you:

  We trust people to do their best work. That means
  flexibility over rigid rules, impact over activity, and real
  investment in your growth both professionally and
  personally. You’ll be part of a supportive, and friendly
  culture, surrounded by smart, curious people who care deeply
  about what they do. We offer flexible working, including
  hybrid and remote options. Our office hubs are located in
  Edinburgh, Leeds, Manchester, London and Bulgaria, with
  occasional travel to client sites or CreateFuture offices
  when needed.

  We trust you to manage your time balancing collaboration
  with client time and focused work. What matters is the
  impact you have, not how busy you look.

  Our hiring process

  We try to keep our hiring process clear, fair and respectful
  of your time. We aim to get back to everyone who applies and
  we will be upfront about where you are in the process.

  It usually looks like this:

  - Call with our Talent Acquisition Team
  - Role specific capability interview

  Depending on the role, we might also ask you to do a short
  presentation, a practical or technical task or have a values
  focused conversation. We will explain what is involved
  before anything happens.

  Inclusion at CreateFuture

  We believe diverse teams build better workplaces and better
  products. We want CreateFuture to be a place where people
  feel able to be themselves and do their best work.

  If you need any adjustments or support during the
  application process, just. We will do what we can to help.

  We look forward to your application!
