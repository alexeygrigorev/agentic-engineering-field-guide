description: |
  Get to Know Us

  Horizon3 is a fast-growing, remote cybersecurity company
  dedicated to the mission of enabling organizations to
  proactively find, fix and verify exploitable attack vectors
  before criminals exploit them. Our flagship product, the
  NodeZeroTM platform, delivers production-safe autonomous
  pentests and other key assessment operations that scale
  across the largest internal, external, cloud, and hybrid
  cloud environments. NodeZero has been adopted by
  organizations of all sizes, from small educational
  institutions to government agencies and Global 100
  enterprises. It is used by IT Ops/SecOps teams, consulting
  pentesters, and MSSPs and MSPs.

  We are a fusion of former U.S. Special Operations cyber
  operators, startup engineers & operators, and formerly
  frustrated cybersecurity practitioners. We're committed to
  helping solve our common security problems: ineffective
  security tools and false positives, resulting in alert
  fatigue, blind spots, "checkbox” security culture,
  cybersecurity skills shortage, and the long lead time and
  expense of hiring outside consultants. Collectively, we are
  a team of learn it alls, committed to a culture of respect,
  collaboration, ownership, and results.

  What You’ll Do

  We are looking for an engineering leader to own and scale
  the MSP/MSSP team at Horizon3. This leader will drive the
  platform capabilities that make NodeZero scalable and
  operationally excellent for Managed Service Providers (MSPs)
  and Managed Security Service Providers (MSSPs) — enabling
  partners to deliver NodeZero as a managed service to their
  customers at scale.

  You will:

  Lead the MSP/MSSP Engineering Team

  - Build, mentor, and grow a team of backend and full-stack
    engineers focused on multi-tenant platform capabilities
    for MSP and MSSP partners.
  - Drive the platform strategy for MSP and MSSP use cases,
    including multi-tenancy, parent and sub-client
    relationships, tenant allocation, partner administration,
    client management dashboards, co-branding, and white-
    labeling.
  - Establish and evolve the architecture for account
    hierarchies, delegated administration, tenant isolation,
    and partner-specific entitlement and licensing flows.

  Drive Engineering Excellence

  - Use design reviews, code reviews, and blameless
    retrospectives to drive a culture of quality and
    engineering excellence. Partner with Product, Customer
    Success, Partnerships, and Sales to align the team's
    roadmap with partner needs.

  People Leadership and Project Management

  - Balance partner support and operational needs while
    executing on a roadmap of platform improvements and new
    MSP/MSSP capabilities.
  - Hire and directly manage software engineers focused on
    multi-tenant and partner platform systems.
  - As a Manager, you will be responsible for:
    - Recruiting and onboarding talented individuals to support
      our organizational goals
    - Mentoring, coaching, equipping, and developing your team
    - Recognizing and retaining high performers
    - Leading horizontally with peer Management & Senior Leaders

  What You’ll Bring (Qualifications)

  Building and Leading Platform Teams

  - Demonstrated experience leading engineering teams building
    and operating multi-tenant SaaS platforms at scale.

  - Strong technical background in multi-tenancy, account
    hierarchies, tenant isolation, delegated administration,
    and parent/sub-client models.
  - Experience with partner or channel software models — MSP,
    MSSP, OEM, white-label, reseller, or co-branded platforms.
  - Proven track record of taking complex platform capabilities
    from design through production and at-scale operation.
  - Strong working knowledge of at least one major cloud
    provider (AWS, GCP, or Azure). Experience with identity
    and access management, RBAC, authorization models, and
    enterprise account structures. AWS preferred.

  Engineering Culture and Process

  - Experience driving architecture decisions through structured
    design reviews, RFCs, or similar frameworks — particularly
    for multi-tenant or partner-facing systems.
  - Able to write clear, durable process documentation that
    engineering teams can adopt.
  - Comfortable with modern backend languages such as Python or
    Go; able to engage meaningfully in technical discussions
    and code reviews with engineers.
  - Nice to Haves: background in cybersecurity or security
    platforms; experience with third-party risk management or
    compliance-adjacent capabilities; familiarity with
    licensing, entitlements, subscription management, or
    billing integrations.

  Leadership and People Management

  - Proven ability to hire, develop, and retain high-performing
    engineers in remote or distributed environments.
  - Strong communication skills across technical and non-
    technical audiences — able to partner effectively with
    Product, Partnerships, Customer Success, Finance, and
    Engineering leadership.
  - Demonstrated ability to balance strategic roadmap delivery
    against a competing stream of partner support and
    operational needs.
  - Proven ability to build, scale, and retain high-performing
    engineering teams in remote or distributed environments.

  Occasional Business Travel Required

  This position is remote, but this job may require up to 10%
  of travel to be successful.

  Compensation and Values

  At Horizon3, we believe that our people are our greatest
  asset, and our compensation philosophy reflects this core
  value. We are committed to fostering an environment where
  all employees feel valued, respected, and rewarded for their
  contributions. Our compensation structure is designed to be
  fair, competitive, and transparent, ensuring that every team
  member is recognized and compensated equitably across roles,
  levels, and locations.

  In accordance with various State’s transparency regulations,
  we provide the following salary range information for this
  position:

  - Base salary range: $260,000 - $280,000. The exact salary
    will be determined based on the selected candidate’s
    location, qualifications, experience, and relevant skills.
  - Additional compensation: All full-time roles are eligible
    for an equity package in the form of stock options and
    benefits.

  Perks of Horizon3

  - Inclusive Team: We value diversity and promote an inclusive
    culture where everyone can thrive.
  - Growth Opportunities: Be part of a dynamic and growing team
    with numerous career development opportunities.
  - Innovative Culture: Work in a collaborative environment that
    encourages creativity and out-of-the-box thinking.
  - Hybrid & Remote Work: We embrace a mix of remote and hybrid
    work models depending on role and location, including our
    Chicago office, where some roles require regular in-office
    presence.
  - Competitive Compensation: We offer competitive salary,
    equity and benefits. Our benefits include health, vision &
    dental insurance for you and your family, a flexible
    vacation policy, and generous parental leave.

  You Belong Here

  Horizon3 is not just an equal opportunity employer - we are
  a community that values diversity, equity, and inclusion as
  fundamental principles of our culture and success. We are
  dedicated to fostering a workplace where everyone feels
  welcome and respected, regardless of race, color, religion,
  sex, national origin, age, disability, veteran status,
  sexual orientation, gender identity or expression, genetic
  information, marital status, hair length or any other
  legally protected status by law.

  Our commitment to diversity and inclusion means we strive to
  attract, develop, and retain a workforce that reflects the
  varied communities we serve. We believe that diverse
  perspectives drive innovation and strengthen our ability to
  create cutting-edge cybersecurity solutions. At Horizon3,
  every team member is valued and supported in an environment
  that encourages personal and professional growth.

  We welcome candidates from all backgrounds and experiences,
  and we encourage all qualified individuals to apply. Come be
  a part of Horizon3, where your unique contributions are
  recognized, and your potential is limitless.

  Other Duties

  Please note this job description is not designed to cover or
  contain a comprehensive listing of activities, duties or
  responsibilities that are required of the employee. Duties,
  responsibilities, and activities may change at any time with
  or without notice.

  Application Note

  In any materials you submit, you may redact or remove age-
  identifying information such as age, date of birth, or dates
  of school attendance or graduation. You will not be
  penalized for redacting or removing this information.
