description: |
  At Bloomerang, we believe change happens on purpose. We
  champion the power and potential of nonprofits, igniting
  next-level impact with the team and technology built for
  purpose. Our powerful giving platform and stellar support
  enable tens of thousands of nonprofits to raise more,
  recruit more, and retain more, fueling maximum impact and
  raising the bar on what’s possible for the nonprofit sector.
  That's why, even as the nonprofit sector sees declines in
  giving, Bloomerang customers raise more year over year.

  We're also in the business of creating thriving employees.
  Join a mission-driven culture built on our core values of
  Simplify, Care and Act. We know our people are the key to
  our success, and we're proud to be home to some of the most
  innovative and skilled individuals in the workforce today.
  Come feel invigorated and unstoppable with us!



  The Role

  As a Software Engineer on Bloomerang's PDLC Operations team,
  you will build the internal integrations and automations
  that connect how we build product with the teams who bring
  it to customers. With our AI-driven product development
  lifecycle, we ship faster than ever, and the handoffs to
  Marketing, Enablement, Sales, and our Customer teams have to
  keep up. Your job is to build the product knowledge layer
  that gives those teams the context and content they need,
  when they need it.

  You'll report to the Sr. Manager, PDLC Operations, who sets
  the direction for our PDLC systems, and you'll turn that
  direction into working tools quickly. You'll build a
  version, put it in front of users, keep what works, and
  throw out what doesn't.



  What You Will Do

  - Build the capture and classification steps that take content
    from Jira, GitHub, Notion, Figma, Pendo, and our data
    platforms such as BigQuery and Databricks, and promote
    only what partner teams need
  - Design and maintain a product knowledge repository with
    typed, sourced, and versioned content that keeps verified
    facts, decisions, ideas, and internal-only detail apart
  - Design and build role-scoped delivery through our internal
    AI harness, so Marketing, Sales, Enablement, and Customer
    teams get launch messaging, battlecards, help content, and
    training from verified sources, including inside the tools
    they already use, such as Salesforce, Gainsight, and
    Intercom
  - Automate repetitive PDLC work, such as go-live checklists,
    release notifications triggered by deploys and feature
    flag changes, and status roll-ups, so program and product
    managers can spend their time on decisions instead of
    coordination
  - Prototype several approaches quickly, test them with the
    people who will use them, and iterate or discard based on
    what you learn
  - Extend and improve our internal apps and dashboards built on
    tools such as Replit, including portfolio and capacity
    planning and delivery health metrics
  - Build AI-assisted workflows, Claude skills, and Slack bots
    that answer questions about work in flight from the
    product knowledge repository
  - Work with Product, Engineering, Program Management, Product
    Analytics, and go-to-market teams to understand their
    needs and turn them into simple tools
  - Build securely and responsibly, respecting access controls,
    data handling standards, and audit requirements such as
    SOC 2 traceability between code and work items
  - Document what you build so others can use, support, and
    maintain it



  What You Need to Succeed

  - Experience building and maintaining web applications, APIs,
    and integrations in a modern language such as Python or
    TypeScript/JavaScript
  - Comfortability working with REST APIs, webhooks, and
    authentication for third-party tools
  - Solid software engineering fundamentals, including testing,
    debugging, and Git-based workflows with code review
  - Hands-on experience with AI coding tools and LLMs, such as
    Claude Code, and the ability to build and use agent
    harnesses and automated workflows to build and iterate
    quickly
  - A bias toward shipping: you're happy to build a quick first
    version, learn from it, and start over without attachment
    when a better approach appears
  - Curiosity about how teams work, and the habit of
    understanding the problem before building the solution
  - Clear communication with non-technical partners, including
    explaining tradeoffs in plain language
  - Effective collaboration with a manager who owns the vision,
    while bringing your own ideas and pushing back when
    something won't work
  - Ability to actively explore, learn, and responsibly
    integrate AI tools into daily tasks to drive efficiency
    and support Bloomerang's mission.
  - Experience with content models, metadata, or knowledge
    graphs, and with provenance and versioning of content in
    Git



  Nice to Haves But Not Required

  - Experience with LLM-assisted classification, and evaluation
    of AI answer quality
  - Familiarity Atlassian, GitHub, Notion, or Slack APIs;
    Salesforce, Gainsight, Intercom, or Pendo APIs
  - Previous experience with MCP servers; Replit; or SQL and
    data warehouses (BigQuery, Databricks, etc)

  Benefits

  Health + Wellness You’ll have access to generous health,
  vision, and dental insurance options as well as
  HealthiestYou, a healthcare service that offers convenient,
  confidential access to quality doctors 24/7, anytime,
  anywhere.

  Time Off You'll get a competitive PTO package that includes
  20 PTO days, 3 flex days, 4 optional volunteer days, 12 paid
  holidays, as well as paid parental leave. More is more!

  401k You'll receive a 401k match to help invest in your
  future.

  Equipment Everything you need to be successful, shipped
  right to your door. You got this. We got you.

  Compensation  The salary range for this position is $100,700
  - $167,800. You may also be eligible for a discretionary
  bonus. Actual compensation within the range will be
  dependent on your skills, experience, qualifications, and
  location, as well as applicable employment laws

  Location This is a permanent, full-time, fully remote
  position (within the U.S. and select Canadian Provinces
  only). Employees living in Indianapolis, IN are welcome to
  work from our company headquarters. We do not offer Visa
  sponsorship or relocation assistance at this time.

  Accommodations Applicants who require accommodations may
  contact careers@bloomerang.com to request an accommodation
  in completing an application.

  Bloomerang is an Equal Opportunity Employer. Individuals
  seeking employment at Bloomerang are considered without
  regard to race, color, religion, national origin, age, sex,
  marital status, ancestry, physical or mental disability,
  veteran status, gender identity, or sexual orientation.

  Bloomerang uses artificial intelligence (AI) tools to help
