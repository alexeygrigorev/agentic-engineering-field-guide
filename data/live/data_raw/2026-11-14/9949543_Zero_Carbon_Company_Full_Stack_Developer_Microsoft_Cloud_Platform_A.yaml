description: |
  About Us

  We’re building the UK hospitality and leisure sectors’ most
  intelligent and engaging sustainability platform - enabling
  both small and large businesses to measure, improve, and
  compete on their carbon performance.

  Our platform is powered by Microsoft’s Cloud ecosystem,
  integrating intelligent measurement, AI-guided action plans,
  and real-time engagement tools for cost and carbon
  reduction. Now, we’re seeking a technical builder who can
  help bring our architecture to life.

  What You’ll Be Doing

  - Design, develop, and maintain applications using the latest
    Microsoft Products (including Power Apps and Power Pages)
  - Manage secure user authentication and role-based access
    control across apps and dashboards using Entra ID
  - Architect and scale Azure backend services, including
    Functions, Logic Apps, and Blob storage
  - Build workflows using Azure Data Factory to ingest,
    transform, and expose data across the platform
  - Develop and manage APIs to connect front-end applications
    - Integrate external services and APIs (e.g. ThoughtSpot, GPT,
      or Procurement systems)
    - Develop and maintain data pipelines for LLMs to support
      intelligent outputs
  - Collaborate with customers via a highly active forum to turn
    complex business needs into streamlined applications
  - Ensure performance, security, and scalability across all
    services used

  You’ll Need Experience In

  - Microsoft Power Apps (Canvas & Model-Driven apps)
  - Microsoft Power Pages (formerly Power Apps Portals)
  - Azure App Services and Functions
  - Azure Data Factory and integration pipelines
  - Microsoft Entra ID (Azure AD) for authentication flows
  - Experience with Notification Hub
  - Proven experience with PowerBI and various reporting tools
  - Demonstrable API development skills using REST/GraphQL
    (ideally via Azure Functions)
  - Version control and CI/CD pipelines (e.g., GitHub Actions,
    Azure DevOps)
  - Strong working knowledge of Python, SQL, and Javascript

  Nice to Have

  - Experience with Snowflake integration
  - Knowledge of ThoughtSpot and Keboola
  - Familiarity with GPT/AI services
  - Experience working in sustainability or ESG tech
    environments
  - Understanding of data governance and privacy requirements
    (e.g., GDPR)
  - Working knowledge of HTML/CSS and Figma

  Why Join Us?

  - Join a mission-led company tackling climate change at scale
  - Build meaningful tools used by real businesses
  - Enjoy autonomy, flexibility, and a clear sense of purpose
  - Be part of a small, agile team building for long-term impact

  We want everyone in the team to get their work/life balance
  right. To feel valued. And to have fun whilst working.
  That’s why we’ve put this package of benefits in place:

  - 🕐 Finish Early Friday at lunchtime, one Friday a month: Fri-
    Yay!
  - 🎂 Your birthday off. Because who wants to work on their
    birthday?
  - 🏠 Flexible/Remote/Hybrid Working including an office space
    in London (next to The London Eye)
  - 🍺 Regular get-togethers, lunches and nights out, including
    Company review and night out every 6 months
  - 🚼 Generous maternity/paternity policy
  - 🧠 Mental/Physical health app subscription covered
  - 🏋️‍♂️ Allocated Training budget for each of us
  - 🚴 Cycle to Work scheme
  - 😎 Working with a group of cool people to change the world
    (what’s better than that?!)

  Plus the basics...

  - 💻 Laptop and WFH kit (monitor, mouse, keyboard)
  - 🏦 Pension (3% us, 5% you)
  - 🌴Time Off - 25 days + Bank Holidays
  - 🚄 We cover all travel and subsistence for company
    meetings/days
