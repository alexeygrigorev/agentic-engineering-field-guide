description: |
  🚀  What We’re Looking For

  You will be part of a close-knit founding team.  This is a
  rare opportunity where you’ll get to help shape the tech and
  culture of our growing team.  You’ll work hand in hand with
  our CEO, CTO and 4-5 other engineers to work on everything
  from product to development to testing.  You should feel at
  home on the frontend and be able to find your way around
  backend code as required.  Ultimately, you’ll be expected to
  jump around the stack with a can-do attitude if necessary.

  Your First 90 Days

  … will be a whirlwind.  Largely unstructured, you’ll bounce
  between defining product workflows, coding it up, and
  furiously shipping to production.  The first 90 days will
  likely not see live customers using the product, so ship
  quickly, and break things!  But seriously, we will want to
  put in place impeccable testing practices for when we do go
  live circa month 6.

  What Gets Us Excited

  * Early stage startup experience and proven ability to
  thrive in a fast-paced, continuously evolving environment *
  You are unfazed by ambiguous, open-ended problems * An
  uncanny ability to unblock yourself - you’re a resourceful
  problem solver that can break through barriers without
  needing oversight * Ability to communicate complex ideas
  succinctly * Demonstrated success building fast, efficient
  solutions to complex problems * Ability to think through
  short-term vs. long-term needs and trade-offs * Enjoy
  testing prototypes to validate assumptions * Experience with
  React / Typescript / Rest APIs / Redux * Nice to have:
  Postgres / AWS / Docker

  Why You May Love Us

  * Dynamic, fun environment with a highly talented team *
  Early-stage startup experience * An NYC Office where we can
  collaborate and hang out.  No requirement for in-office
  days. * No bureaucracy environment.  We do what is best for
  our customers & the company. * Series A salary with Seed
  stage Equity.  ‘Nuff said. * Fully covered medical, dental,
  vision for you * Flexible vacation

  What To Expect

  1. Intro call with CTO (30-45 min) - Let’s learn about each
  other 2. 1-2 live technical sessions (45-60 min each) 3.
  Call with CEO (45 min) - Ask us anything 4. References +
  Offer 5. Profit.

  💫  About Us

  Suno is a healthcare technology company based in New York
  City with a mission to enable 37 million+ Americans
  suffering from hearing issues to access medical treatment
  with ease and at affordable prices. Suno aims to do this by
  building intuitive end-to-end software for Audiology clinics
  which will help optimize their operations, decrease costs,
  and ultimately improve patient outcomes.
