description: |
  About the role: As a valuable addition to our dynamic team,
  you will collaborate closely with our VP of Engineering,
  along with a talented group of frontend and backend
  engineers, and dedicated product managers.

  In this pivotal role, you will play a crucial part in
  developing groundbreaking solutions for medical researchers
  while also contributing to the strategic direction and
  objectives of our product. We seek a candidate who can
  autonomously discern priorities among various features,
  tasks, and optimizations, ensuring optimal outcomes for our
  users and stakeholders.

  Our Stack:

  ● Frontend: ReactJS, Material-UI, JSS, GatsbyJS ● Backend:
  Python 3.10+, Django (RESTful APIs), PostgreSQL ● DevOps:
  Docker, Ansible, CircleCI ● GitHub, GCP, Netlify, CloudFlare

  We try to keep most of our stack on the latest stable
  releases to minimize technical debt.

  Responsibilities:

  ● Write scalable, testable, and maintainable code for the
  frontend and backend

  ● Work closely with customers and internal team to
  strategically prioritize features on the product roadmap

  ● Make critical architectural decisions. Research new
  technologies and understand complexity tradeoffs

  ● Build robust data pipelines to feed into machine learning
  algorithms

  ● Provide technical support to the internal team

  ● Handle automated deployments and maintenance for web
  servers.

  Requirements:

  ● 5+ years of experience in Django / Python.

  ● Reasonable experience with React or similar frontend
  framework.

  ● Experience with Google Cloud Platform or comparable cloud
  provider.

  ● Experience in full-stack web development, including front-
  end and back-end development

  ● Can help manage a team of external engineers

  ● Organized, manages complex workload well, and execution
  oriented

  ● Demonstrated leadership and capability to see projects
  through completion

  ● Effective technical communication skills to both technical
  and non-technical stakeholders

  ● Living in or willing to relocate to NYC to work in person
