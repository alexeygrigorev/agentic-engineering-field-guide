description: |
  What We Do

  Rillet serves accounting and finance teams, the financial
  brains of their companies. Our job is to help them run the
  numbers with impossible speed, accuracy, and insight.

  Rillet is the Agentic ERP built for modern finance teams. We
  help companies automate the most critical parts of finance,
  from closing the books and recognizing revenue to
  consolidating entities and reporting to investors. More than
  600 companies run on Rillet, including Mercor, Scribe, and
  Function Health, and we partner with leading accounting
  firms including EY and KPMG.

  We’re building in one of the largest software markets in the
  world, with the momentum to match. Rillet has raised more
  than $200M, is valued at $1B, and is backed by Sequoia,
  a16z, ICONIQ, Bain Capital Ventures, Oak HC/FT, and other
  leading investors. We’re using that backing to build the
  financial infrastructure for the next generation of
  companies and help every business run its numbers at the
  speed of AI.

  Who We Are

  Rillet’s pace is not for everyone. Intelligence is table
  stakes. To succeed here, you need extreme speed, agency, and
  flexibility.

  The people who thrive at Rillet do not wait for assignments.
  They internalize the mission, design a strategy, and bring
  back results that are better, faster, and more creative than
  a manager could have asked for.

  Our work revolves around our customers. The people who
  succeed here are energized by delivering what matters most,
  even when it was not part of the original plan.

  Rillet is built on deep accounting expertise, and it takes
  people from many disciplines to build a category-defining
  company. You do not need to be an accountant to thrive here.
  You do need to care deeply about the problems we solve and
  the impact our customers can create. Together, we combine
  the precision of accounting with the speed, creativity, and
  ambition of AI-native software to power the financial core
  of the world’s fastest-growing companies while redefining
  what finance teams should expect from their software.

  Who We Need

  Rillet is building a new financial system for modern
  companies, and we’re looking for Engineering Managers to
  help scale both the product and the team.

  Depending on your background, you could lead engineers
  building customer-facing experiences for finance and
  accounting teams, or work deeper in the stack on the
  platforms and systems that power them.

  We’re looking for leaders who care about both what we build
  and how we build it. You should be excited to stay close to
  the technical work, develop strong engineers, partner
  closely with Product and Design, and help shape how the team
  operates as we grow.

  We’re looking for teammates based near our New York City or
  San Francisco offices, or open to relocating. Our hybrid
  schedule brings the team together on Tuesdays and Thursdays,
  plus one additional flexible day each week.

  What You'll Do

  - Lead an engineering team responsible for an important part
    of Rillet, across either customer-facing product or the
    systems and platforms behind it.
  - Set direction across execution, technical decisions, hiring,
    and team development.
  - Partner closely with Product, Design, and accounting experts
    to shape what we build and how we build it.
  - Drive complex projects from early thinking through launch
    and iteration.
  - Develop a team that includes senior and Staff-level
    engineers, helping strong ICs take on more scope and
    responsibility.
  - Hire great engineers and build a team that moves quickly,
    takes ownership, and maintains a high bar.
  - Stay close to the technical work and help shape how the
    broader engineering organization evolves as we grow.

  Who We're Looking For

  - 4+ years of engineering management experience, ideally at a
    high-growth startup or technology company, with experience
    leading teams through a period of rapid growth and a
    strong background as a software engineer.
  - Experience leading a sizeable team that includes senior and
    Staff-level engineers.
  - A track record of developing experienced engineers and
    helping them grow into larger technical and organizational
    roles.
  - You’ve stayed technically close to the work and are
    comfortable getting into the codebase, debugging issues,
    reviewing architecture, and going deep with senior
    engineers when needed.
  - Strong technical and product judgment, including knowing
    when to move quickly and when quality or long-term
    scalability requires more investment.
  - You’re actively learning how AI is changing software
    development and thinking about how your team can use AI
    tools to move faster, improve quality, and spend more time
    on higher-value work.

  Bonus Points

  - Experience scaling or splitting engineering teams during
    periods of rapid growth.
  - Experience leading both product-facing and platform-oriented
    engineering teams.
  - Recent hands-on experience with Kotlin, Java, or TypeScript.
  - Strong understanding of CI/CD, observability, reliability,
    and modern software development practices.
  - Experience building complex B2B or enterprise software where
    reliability, security, and scale matter.
  - Background in fintech, ERP, accounting software, or other
    data-intensive products.

  Note: All official Rillet recruiting communications will
  come from an @rillet.com email address. If you’re contacted
  from another domain, please disregard the message and report
  it as spam.

  Life at Rillet

  - Grow with us. Take meaningful ownership, expand your scope,
    and make an impact as Rillet scales.
  - Competitive pay and meaningful equity. Be rewarded for the
    value you help create.
  - Benefits that support you. We offer competitive benefits
    designed to support your health, wellbeing, time away from
    work, family, and long-term financial goals.
  - Better together. We value collaboration, connection, and
    spending meaningful time together as a team. We regularly
    create opportunities to connect through team meals,
    events, and company gatherings.
