description: |
  Job Description – Manager, Enterprise Software Engineering

  Overview

  Wolters Kluwer Global Business Services is designed to
  provide services to the business units in the areas of
  technology, sourcing, procurement, legal, and event
  management services. These global centers promote team
  collaboration using best practices around a specific focus
  area to drive results and enhance operational efficiencies.
  There is a constant endeavor to benchmark against best-in-
  class industry standards to improve the quality of
  deliverables, increase cost savings, enhance productivity
  and reduce time to market for products and applications

  As an SAP Technical Manager, you will lead and manage a
  globally distributed SAP ABAP and Integration team
  responsible for delivering and supporting a highly
  integrated SAP platform. This role combines hands-on
  technical depth with people leadership, architecture
  ownership, and delivery accountability across global SAP
  initiatives including implementations, upgrades, and
  enterprise integrations.

  Key Responsibilities

  - Provide technical leadership and people management for a
    global SAP ABAP, PI/PO, BTP-IS teams, covering
    architecture, design, development, testing,
    implementation, and ongoing support across the SAP
    landscape.
  - Serve as the SAP Technical Architect and subject matter
    expert (SME), owning end-to-end technical solution design
    and complex problem resolution across a fully integrated
    SAP platform.
  - Lead SAP interface and integration execution for system
    migrations, upgrades, global rollouts, and performance
    optimization of background jobs and interfaces.
  - Drive end-to-end delivery of SAP ABAP and PI/PO solutions
    including requirements analysis, solution design,
    development, testing, implementation, documentation, and
    support for new initiatives and enhancements.
  - Hands on experience and proficiency with SAP interface and
    integration architecture and design, Specification
    writing, ABAP Code development, Middleware design and
    development, SAP table structure, SAP Query, LSMW and
    Fiori application development
  - Partner closely with SAP Business Analysts, Functional
    Consultants, Basis teams, software engineers, and external
    application teams to deliver integrated, scalable, and
    secure solutions.
  - Lead cross-functional design and requirements review
    sessions to identify and resolve impacts across SAP
    modules and integrated systems.
  - Coach, mentor, and develop team members (employees and
    contractors) across geographies, fostering technical
    excellence, delivery discipline, and continuous
    improvement.

  Core Technical Skills

  - SAP ABAP development expertise with strong command of SAP
    technical architecture and design.
  - SAP integration architecture and development experience,
    including PI/PO or equivalent middleware.
  - Hands-on experience leading multiple full-cycle SAP global
    implementations.
  - Experience with SAP upgrades and new functionality
    deployments.
  - Integration experience between SAP and third-party or
    enterprise applications with secure data exchange.
  - Leadership experience managing multi-track delivery across
    complex SAP landscapes.

  Minimum Qualifications

  - Master’s degree with a technology focus.
  - 6+ years of hands-on SAP ABAP development experience.
  - 8+ years in SAP Technical Architect roles, including at
    least 5 years leading and managing global SAP ABAP teams.
  - Proven experience managing geographically distributed teams
    of employees and contract resources.
  - Strong written/verbal communication skills

  Leadership & Work Environment

  - Direct Reports: Yes
  - Travel: Up to 25%, including international travel
  - Telecommuting: 0–40% of work week; role requires on-site
    presence
  - Location: 28 Liberty Street, New York, NY 10005
  - Division: Global Business Services

  Our Interview Practices

  To maintain a fair and genuine hiring process, we kindly ask
  that all candidates participate in interviews without the
  assistance of AI tools or external prompts. Our interview
  process is designed to assess your individual skills,
  experiences, and communication style. We value authenticity
  and want to ensure we’re getting to know you—not a digital
  assistant. To help maintain this integrity, we ask to remove
  virtual backgrounds and include in-person interviews in our
  hiring process. Please note that use of AI-generated
  responses or third-party support during interviews will be
  grounds for disqualification from the recruitment process.

  Applicants may be required to appear onsite at a Wolters
  Kluwer office as part of the recruitment process.

  Compensation:

  $128,900.00 - $226,050.00 USD This role is eligible for
  Bonus.

  Compensation range listed is based on primary location of
  the position.  Actual base salary offer is influenced by a
  wide array of factors including but not limited to skills,
  experience and actual hiring location. Your recruiter can
  share more information about the specific offer for the job
  location during the hiring process.

  Additional Information:

  Wolters Kluwer offers a wide variety of competitive benefits
  and programs to help meet your needs and balance your work
  and personal life, including but not limited to: Medical,
  Dental, & Vision Plans, 401(k), FSA/HSA, Commuter Benefits,
  Tuition Assistance Plan, Vacation and Sick Time, and Paid
  Parental Leave. Full details of our benefits are available
  upon request.
