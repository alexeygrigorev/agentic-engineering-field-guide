description: |
  Highbeam is building the future of business banking and cash
  management.

  Our platform combines AI agents, automated financial
  workflows, and integrated financial products that save
  brands time and money.

  Customers have generated billions in sales and include well-
  known brands such as Cuts, Tushy, Rocco, Sabah, Still Here,
  Alice Mushrooms, Original Grain, birddogs, and more.

  Our team includes alumni of Shopify, Square, Toast,
  Rippling, and McKinsey.

  We’ve raised $42M in equity from Acrew, FirstMark, Mayfield,
  and Two Sigma Ventures.

  About this role

  We’re looking for software engineers to join us in building
  the future of business banking and cash management. You’ll
  work closely with other engineers, product, and design to
  design, build, and iterate on core products used by
  businesses every day.

  You’ll own projects end-to-end: from scoping to building,
  testing, shipping, and refining based on real-world
  feedback.

  Our stack: Kotlin, TypeScript / React, PostgreSQL, Google
  Cloud. Check out our open-source Kotlin toolkit Kairo.

  On AI use

  A strong Highbeam engineer uses AI as a powerful tool — for
  exploration, design, and implementation — while maintaining
  full ownership of the outcome. AI can accelerate thinking
  and execution, but it does not replace judgment, taste, or
  accountability.

  We expect engineers to use AI extensively and still care
  deeply about code quality. That means reviewing outputs
  carefully, refining them, understanding the trade-offs, and
  ensuring the final result meets a high bar for clarity,
  correctness, and maintainability.

  Shipping working code is not enough. You should understand
  what you ship and be able to defend the decisions behind it.

  Qualifications

  - 4+ years of professional software engineering experience
    (startup or small-team experience is a plus)
  - Proven ability to lead and deliver technically challenging,
    cross-functional projects
  - Comfortable with designing APIs, debugging complex systems,
    and writing tests
  - Strong product sense and ability to make thoughtful
    tradeoffs in scope and functionality
  - Interest in (or willingness to learn) basic financial
    concepts relevant to small businesses

  You'll thrive at Highbeam if...

  - You love working in-person with a high-performing team
  - You enjoy working in an idea-meritocratic, low-ego
    environment
  - You are proactive and self-directed, and you excel in
    ambiguous, fast moving environments
  - You care about delivering a polished customer experience
  - Bonus: You have experience working in fintech, AI or early-
    stage startups

  What we offer

  - Competitive salary and meaningful equity
  - Comprehensive health & benefits package
  - Generous PTO
  - $1K/year stipend to purchase our customers' products
  - $100/mo wellness stipend
  - Yearly offsite—last year we went to Mexico City!
  - In-office perks: Commute covered and $20/day lunch stipend
  - Great location: Our NYC office is in NoHo, a short walk from
    the A,C,E · B,D,F,M · N,Q,R,W · 1 · 6 trains. Our Toronto
    office is downtown near St. Andrew Station.
