description: |
  WHO WE ARE

  Zeta Global (NYSE: ZETA) is the AI-Powered Marketing Cloud
  that leverages advanced artificial intelligence (AI) and
  trillions of consumer signals to make it easier for
  marketers to acquire, grow, and retain customers more
  efficiently. Through the Zeta Marketing Platform (ZMP), our
  vision is to make sophisticated marketing simple by unifying
  identity, intelligence, and omnichannel activation into a
  single platform – powered by one of the industry’s largest
  proprietary databases and AI. Our enterprise customers
  across multiple verticals are empowered to personalize
  experiences with consumers at an individual level across
  every channel, delivering better results for marketing
  programs. Zeta was founded in 2007 by David A. Steinberg and
  John Sculley and is headquartered in New York City with
  offices around the world. To learn more, go to
  www.zetaglobal.com.

  Role Overview

  We are hiring a hands-on Staff Software Engineer to provide
  technical leadership for our Forecasting and Recommendations
  platforms, with a strong focus on production-grade AI and
  agentic systems.

  This role centers on designing, building, and operating
  high-throughput, low-latency distributed systems that power
  forecasting, recommendations, and AI-driven decisioning at
  scale. You will work deeply in backend systems,
  infrastructure, and AI application architecture, while
  remaining accountable for reliability, observability, and
  operational excellence.

  We are looking for an engineer who can contribute
  immediately, has shouldered real production incidents, and
  brings strong judgment around building stable, observable,
  and scalable systems, including modern agentic and LLM-
  powered applications.

  What You'll Do

  - Design, build, and operate systems supporting forecasting,
    recommendations, and agentic AI workflows in production.

  - Write production-quality code daily; own services end-to-end
    from design through on-call and incident resolution.

  - Architect low-latency, high-throughput SaaS services,
    including APIs, data pipelines, model inference, and agent
    orchestration.

  - Build and maintain production-grade agentic applications,
    including tool-using agents, workflow orchestration, and
    guardrails.

  - Work fluently with foundational LLMs (e.g., GPT, Claude,
    Gemini Pro), selecting appropriate models and deployment
    patterns based on latency, cost, and reliability
    tradeoffs.

  - Use frameworks and tooling such as LangChain, voice agents,
    and related ecosystems to accelerate development—while
    enforcing production discipline.

  - Embrace AI-assisted development workflows (e.g., Cursor,
    GitHub Copilot, vibe coding paradigms) to move quickly
    without sacrificing quality.

  - Champion observability and reliability: metrics, logging,
    tracing, alerting, and post-incident analysis.

  - Lead and participate in production incident response,
    retrospectives, and systemic fixes.

  - Identify architectural risks early and make design decisions
    that prevent outages and scalability issues.

  - Reduce complexity across services, infrastructure, and
    processes to improve stability and team velocity.

  - Provide technical guidance across teams and participate in
    architectural reviews beyond your immediate domain.

  What We're Looking For

  - 12+ years of professional software engineering experience
    building and operating production-grade distributed
    systems.

  - A strong track record of hands-on ownership of business-
    critical services, including measurable improvements in
    latency, throughput, stability, or cost.

  - Deep expertise in systems design, including service
    boundaries, concurrency, data modeling, failure handling,
    and scalability tradeoffs.

  - Production experience supporting machine learning–driven
    systems (forecasting, recommendations, or similar), with
    emphasis on serving, pipelines, and infrastructure.

  - Expert-level experience with AWS, including designing,
    deploying, and operating large-scale cloud-native systems.

  - Strong hands-on experience with Kubernetes, containerized
    microservices, and modern CI/CD pipelines.

  - Experience operating software in both on-prem data center
    and AWS cloud environments.

  - Fluency with modern AI-assisted development tools (e.g.,
    Cursor, GitHub Copilot) and comfort working in “vibe
    coding”–style workflows that favor fast iteration, tight
    feedback loops, and continuous refactoring.

  - 2+ years of experience in Python and proficiency in one or
    more backend languages commonly used for large-scale
    systems (e.g., Python, Java, Go, Scala).

  - Bachelor’s or master’s degree in computer science,
    Mathematics, or a related field, or equivalent practical
    experience.

  Staff-Level Expectations

  - Be a prolific, hands-on contributor who raises the bar
    through example.

  - Own and deeply understand large portions of the codebase and
    system architecture.

  - Simplify complex systems to increase team velocity and
    reliability.

  - Balance technical, analytical, and product constraints to
    deliver pragmatic solutions.

  - Set short- to medium-term (6–12 month) technical direction
    for your domain.

  - Influence standards and architectural decisions across teams
    through credibility and collaboration.

  - Ship multiple large services, shared libraries, or major
    infrastructure improvements.

  Why Join This Team

  - Build and operate mission-critical systems that power
    forecasting and recommendations at scale.
  - Work in an environment that values execution, pragmatism,
    and modern engineering workflows.
  - Operate at true Staff scope with real architectural
    ownership and hands-on impact.
  - Solve hard systems problems with meaningful business
    outcomes.

  BENEFITS & PERKS

  - Unlimited PTO
  - Excellent medical, dental, and vision coverage
  - Employee Equity
  - Employee Discounts, Virtual Wellness Classes, and Pet
    Insurance and more!!

  SALARY RANGE

  The salary range for this role is $220,000 - $240,000,
  depending on location and experience.

  PEOPLE & CULTURE AT ZETA

  Zeta considers applicants for employment without regard to,
  and does not discriminate on the basis of an individual’s
  sex, race, color, religion, age, disability, status as a
  veteran, or national or ethnic origin; nor does Zeta
  discriminate on the basis of sexual orientation, gender
  identity or expression.

  We’re committed to building a workplace culture of trust and
  belonging, so everyone feels invited to bring their whole
  selves to work. We provide a forum for employees to
  celebrate, support and advocate for one another. Learn more
  about our commitment to diversity, equity and inclusion
  here:  https://zetaglobal.com/blog/a-look-into-zetas-ergs/

