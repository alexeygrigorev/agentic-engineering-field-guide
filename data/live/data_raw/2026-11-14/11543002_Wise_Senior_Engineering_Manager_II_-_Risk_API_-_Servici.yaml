  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role:

  We are looking for a highly accomplished Senior Engineering
  Lead to take the helm of our newly formed Risk API Team
  within the Servicing Platform Squad.

  This is a critical, high-impact leadership role where you
  will simultaneously drive architectural strategy and scale
  the team responsible for the real-time transaction and user
  behavior risk assessment platform.


  Key Leadership Focus

  - Architectural Ownership: You will be the technical authority
    responsible for the design, delivery, and operational
    excellence of the high-throughput Risk API.
  - Domain Bridge: You will operate as the primary technical
    interface between fast-moving Product teams and
    compliance-critical Financial Crime teams, ensuring clean,
    scalable API contracts and data governance.
  - Team Foundation & Growth: You will be instrumental in
    hiring, mentoring, and leading the team, defining the
    engineering standards and best practices that will serve
    as the foundation for the entire Risk Assessment Group.
  - Data Integrity & Scale: Your mandate includes enforcing
    robust Data Quality and Data Lineage standards across the
    platform, building solutions that can scale rapidly across
    multiple risk domains.



  You won't just be managing a platform; you'll be designing
  the core risk infrastructure and leading the team that
  protects the company and its customers on a massive scale.

  What You Will Be Working On

  As the Senior Engineering Lead for the Risk API team, your
  focus will be split between technical strategy,
  architectural delivery, and team scaling in a high-stakes,
  cross-functional domain.

  - Architecting the Risk Contract: Leading the design and
    implementation of the core Risk API. This involves
    defining robust API contracts and data schemas that serve
    as the critical interface between Product features and our
    FinCrime defense systems.
  - Defining the Risk Assessment Ledger: Formalizing technical
    frameworks for the immutable logging of all platform-wide
    risk evaluations. You will spearhead the delivery of high-
    fidelity data streams for diverse stakeholders, ensuring
    absolute auditability and transparency - from granular
    system debugging to the generation of rigorous external
    regulatory reports.
  - Scaling the Team and Culture: Actively managing and
    mentoring the current engineering team (IC2-IC4), while
    rapidly driving the recruitment strategy to grow the team.
    This includes defining clear roles, efficient processes,
    and a high-performance engineering culture.
  - Strategic Stakeholder Alignment: Serving as the key
    technical partner to Product, FinCrime, and other
    Engineering Leads. You will champion the architectural
    vision for the platform, ensuring technical decisions
    align with both business agility and security
    requirements.
  - Platform Resilience: Ensuring the platform is built for high
    availability, low latency, and massive scale, managing the
    operational health (SLAs/SLOs) of a critical, real-time
    risk service.

  What We Are Looking For

  - Strategic Autonomy and Ownership: Proven ability to define
    and fully own the architectural roadmap and delivery
    pipeline for a mission-critical platform. Must operate
    with a high degree of independence, translating ambiguous
    goals into concrete engineering plans.
  - Team and Process Scaling Acumen: Immediate capability to
    drive the full-cycle hiring process and define the core
    operating model, engineering standards, and performance
    culture necessary to scale a newly formed team rapidly (5+
    engineers).
  - Cross-Functional Decision Authority: The skill to step in as
    the primary technical decision-maker, swiftly resolving
    architectural conflicts and achieving alignment between
    demanding Product, FinCrime, and other engineering
    stakeholders.
  - Leveraging Platform Expertise: A clear demonstration of how
    their prior experience in building and operating scalable
    Product or Service Platforms will be immediately applied
    to solve complex, company-wide integration and governance
    challenges in the risk domain.

  Additional Information

  We’re people without borders — without judgment or
  prejudice, too. We want to work with the best people, no
  matter their background. So if you’re passionate about
  learning new things and keen to join our mission, you’ll fit
  right in. Also, qualifications aren’t that important to us.
  If you’ve got great experience, and you’re great at
  articulating your thinking, we’d like to hear from you. And
  because we believe that diverse teams build better products,
  we’d especially love to hear from you if you’re from an
  under-represented demographic. For everyone, everywhere.
  We're people building money without borders — without
  judgement or prejudice, too. We believe teams are strongest
  when they are diverse, equitable and inclusive. We're proud
  to have a truly international team, and we celebrate our
  differences. Inclusive teams help us live our values and
  make sure every Wiser feels respected, empowered to
  contribute towards our mission and able to progress in their
  careers. If you want to find out more about what it's like
  to work at Wise visit Wise.Jobs. Keep up to date with life
  at Wise by following us on LinkedIn and Instagram.



