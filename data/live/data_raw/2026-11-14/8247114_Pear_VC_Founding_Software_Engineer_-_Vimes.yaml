description: |
  Founding Software Engineer - Vimes

  👯 ABOUT US

  Vimes is building the universal operating system for
  government welfare, starting with child protection: our
  cross‑platform crisis‑intervention software replaces the
  paper trails and traditional email threads that slow
  schools, hospitals, police, and social‑services agencies.

  At it's core, we build software to save kids' lives and In
  12 months we launched a nationally adopted child‑risk
  metric, published an academically validated white paper, and
  cut average response times from 40 days to 12 hours for 18
  police departments covering 320K citizens. Having recently
  closed a $2.2M pre-seed, we envision becoming the universal
  system of record for all of public safety, becoming a
  central hub for data and communications for all vulnerable
  populations.

  We have a pipeline of 30+ cities, 15 states, and may cross
  $10M revenue barrier in the next 12 months. As we scale 10x
  and we’re looking for talented technical engineers to join
  us.

  🌱  THE ROLE

  We’re looking to bring on founding engineers, for an in-
  person position in New York City or Bay Area (open to hybrid
  or remote but MUST LIVE IN U.S.).

  As a small team, we work in a highly collaborative
  environment and you'll have the opportunity to participate
  in varying stages of the technical process, reporting to the
  CTO/CEO.

  ⚙️ WHAT WE’RE LOOKING FOR (non-exhaustive list)

  - Highly skilled in React/React Native, iOS/Android app
    development
  - Experience working with AWS-related services
  - Have a startup-y background or love bringing products from
    concept to reality: the 0 → 1 phase.
  - Plus for extensive experience in security engineering +
    compliance (SOC2, HIPAA, CJIS, StateRamp etc.)
  - Plus for experience at govtech startup
  - Plus for design experience!
  - Experience writing production code on shipped full-stack
    apps
  - Experience working with communication platforms
  - Experience with building no-SQL and SQL database schemas
  - Be able to learn new tech / anything relevant quickly

  📱  WHAT THINGS YOU (MIGHT) DO

  - App. You’ll be working with the team to build out our mobile
    and web app, laying the foundations for a large-scale
    government and social impact product and influencing
    direction of our stack.
  - Features. We’ve mastered our first product and system: child
    abuse data communication. As we expand, you will be
    rapidly building and testing new features like new
    communication methods, integrated database access, etc.;
    as well as new systems like domestic violence and gun
    violence frameworks.
  - Security. We have spent a lot of time building a secure
    system. You'll be helping us scale towards stateRAMP and
    fedRAMP compliance.
  - Data. You'll help in generating data-driven insights (ie.
    50-pg reports to police chiefs) AND working on integrating
    with current gov. databases to securely integrate our
    product
  - Managing. You will be placed in a unique position to have
    capable Stanford SWE interns at your disposal to
    streamline your efficiency and productivity. Working with
    the CTO, you will have the ability to build leadership and
    managerial skills working with our interns.
  - Building UI components. You will work closely with our
    designers to think deeply about optimizing user experience
    and streamlining how our users will interact with the
    tech.
  - Solving interesting technical problems. Bring your full
    creativity to solve any technical challenges along the
    way.

  💌  COMPENSATION

  You will be joining a small-team, high-velocity startup and
  thus will be compensated competitively. Some terms:

  - Competitive salary + offers equity
  - Performance bonus
  - Relocation compensation (if moving to the Bay Area / New
    York)
  - Monthly stipend for meals
  - Health insurance + 401K match

  In any case, we hope you’ll join us because you find a fast-
  paced production velocity exciting and fulfilling, and you
  want to help us prove what’s possible.
