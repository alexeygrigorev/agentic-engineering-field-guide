description: |
  About Telnyx

  Telnyx is an industry leader that's not just imagining the
  future of global connectivity—we're building it. From
  architecting and amplifying the reach of a private, global,
  multi-cloud IP network, to bringing hyperlocal edge
  technology right to your fingertips through intuitive APIs,
  we're shaping a new era of seamless interconnection between
  people, devices, and applications.

  We're driven by a desire to transform and modernize what's
  antiquated, automate the manual, and solve real-world
  problems through innovative connectivity solutions. As a
  testament to our success, we're proud to stand as a
  financially stable and profitable company. Our robust
  profitability allows us not only to invest in pioneering
  technologies but also to foster an environment of continuous
  learning and growth for our team.

  Our collective vision is a world where borderless
  connectivity fuels limitless innovation. By joining us, you
  can be part of laying the foundations for this
  interconnected future. We're currently seeking passionate
  individuals who are excited about the opportunity to
  contribute to an industry-shaping company while growing
  their own skills and careers.

  The Opportunity

  As an Elixir Telephony Engineer at Telnyx, you will create
  and deploy groundbreaking applications that are part of the
  Telnyx Telephony platform. Projects often start with a
  kickstart question and our Engineers lead the way in
  developing a solution, from high-level system design and
  prototyping to application development and data integration.
  As a Telnyx software engineer, you leverage everything
  around you: Telnyx products, open source technologies, and
  anything you and your team can build to drive real impact.

  AI-assisted engineering is an integral part of how we work.
  We actively use AI agents to accelerate software
  development, troubleshoot complex issues, and assist with
  deployments and operational workflows. We leverage our own
  Telnyx Inference product to power AI-driven engineering
  workflows, continuously exploring new ways to improve
  developer productivity, code quality, and operational
  efficiency.

  You work with users around the globe, where you help our
  customers by solving their communications challenges. Each
  mission presents different challenges, from the regulatory
  environment to the nature of the data to the user
  population. You will work to accommodate all aspects of an
  environment to drive real technical outcomes.

  You Will:

  - Design, build, and maintain APIs, services, and systems
    across Telnyx’s telephony engineering teams.
  - Work with engineers across the company to build new
    telephony features at large-scale.
  - Improve engineering standards, tooling, and processes.
  - Identify, optimize and resolve issues related to latency,
    scalability, and performance of core telephony
    infrastructure.

  What We're Looking For

  - Have 2+ years of professional software development
    experience with the Elixir programming language.
  - Have deep knowledge of microservice architecture patterns
    and anti-patterns.
  - Understand the challenges inherent in concurrent and
    distributed programming.
  - You take a thoughtful approach to decision making, knowing
    when to move fast and when to long-term optimize.
  - You want to work in a fast-paced, product-driven
    environment.
  - You keep up to date with the latest technologies and
    patterns, and enjoy sharing what you’ve learned.

  Bonus Points For

  - SIP and other VoIP related protocols and technologies like
    RTP, WebRTC, ICE, STUN, TURN
  - Consul, Docker, Kubernetes, Github Actions, Ansible,
    Grafana, Graylog, Prometheus
