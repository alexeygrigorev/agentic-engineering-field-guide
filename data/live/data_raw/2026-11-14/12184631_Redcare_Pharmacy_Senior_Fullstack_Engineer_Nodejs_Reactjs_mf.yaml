description: |
  Company Description

  About Redcare Pharmacy:

  As Europe’s No.1 e-pharmacy, Redcare Pharmacy is powered by
  passionate teams and cutting-edge innovation. We strive to
  create a healthy, collaborative work environment where every
  employee feels valued and inspired to contribute to our
  vision “Until every human has their health”. If you’re
  seeking a career that offers purpose and aligns with your
  values, join us and begin your #Redcareer today.

  As the Senior Fullstack Engineer (BE Focused)  (m/f/d), you
  are a highly experienced individual contributor within a
  cross-functional team, building performant, scalable, and
  customer-centric web applications used by millions across
  Europe.

  You drive complex feature development end-to-end and
  contribute to architectural decisions, while collaborating
  closely with peers and stakeholders. You elevate engineering
  quality through strong technical judgment and ownership.

  Our Tech Stack: React, Node.js, TypeScript, Next.js, NestJS,
  Java, Docker, Kubernetes, CI/CD, Google Cloud, RabbitMQ,
  MongoDB

  Job Description

  About the role:

  - Design and implement complex features across our web-shop,
    translating business requirements into scalable and
    maintainable solutions.
  - Extend and build backend services across domains, ensuring
    clean interfaces and well-defined API contracts.
  - Contribute to frontend development using ReactJS, with
    attention to performance and maintainability.
  - Create and consume APIs following contract-first principles
    and ensuring backward compatibility.
  - Implement scalable asynchronous communication patterns using
    RabbitMQ.
  - Identify and address performance bottlenecks, reliability
    gaps, and technical debt within your scope.
  - Take full ownership of your features: design,
    implementation, testing, deployment, and post-release
    monitoring.
  - Participate actively in code reviews and architectural
    discussions, contributing thoughtful technical input.
  - Support and mentor less experienced engineers through
    collaboration and example.
  - Contribute to the continuous improvement of development
    processes and engineering standards.

  Qualifications

  About You:

  - You demonstrate seniority through impact, ownership, and
    sound technical judgment.
  - You are comfortable working independently on complex tasks
    while aligning with the broader team architecture.
  - You have strong experience building and operating scalable
    services with Node.js and TypeScript.
  - You have solid expertise in RESTful API design, HTTP
    semantics, and distributed system fundamentals.
  - You understand asynchronous communication patterns and
    event-driven architecture.
  - You bring a DevOps mindset and are comfortable with Docker,
    Kubernetes, CI/CD pipelines, and production monitoring.
  - You proactively identify risks and trade-offs, and
    communicate them clearly.
  - You collaborate effectively with product, design, and other
    engineering teams.
  - You value open feedback, continuous learning, and shared
    ownership.

  Additional Information

  About your benefits: In order to provide you with the best
  possible support for your individual needs - whether it‘s
  living a healthy life, having enough time for your family,
  or developing your skills - we offer a wide range of
  different, site-specific benefits:

  - Welcome days: We want you to feel at home with us from the
    very first day. Therefore, we welcome you with our
    comprehensive onboarding program.
  - Personal development: Grow! We support and encourage your
    individual development through various in- and external
    trainings.
  - Work from Home: If your job does not require you to be
    present in the office, we can arrange the place you work
    from individually - even for up to 20 days a year anywhere
    in the EU.
  - Mental Health: Get quick and professional help from
    psychologists of nilo if you feel overwhelmed in private
    or professional life. Anonymous and free of charge.
  - Mobility: We provide our employees with a fully costed
    Deutschland Ticket which can be used at any time. Click
    here to learn more.
