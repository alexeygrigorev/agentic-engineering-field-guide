description: |
  We are seeking a Senior Embedded 5GC Software Development
  Engineer to drive innovation in 5G Core network functions.
  In this role, you will design and implement high-
  performance, 3GPP-compliant control-plane and user-plane
  functionality, focusing on ARM-based architectures. Your
  expertise will contribute to building robust, carrier-grade
  systems, ensuring optimal performance and reliability.

  Responsibilities

  - Develop embedded software for 5G Core network functions,
    including AMF, SMF, UPF, AUSF, UDM, PCF, and NRF.
  - Implement and maintain 5G protocols and procedures, such as
    NAS, NGAP, PFCP, and GTP-U.
  - Design and develop high-performance software using C, Go,
    and Rust.
  - Optimize software for Linux embedded systems on ARM-based
    platforms.
  - Create high-performance packet-processing components with
    DPDK.
  - Enhance system performance for latency, throughput, CPU
    usage, and memory efficiency.
  - Debug complex protocol, system, and performance issues using
    advanced tools.
  - Collaborate with cross-functional teams to ensure seamless
    integration.
  - Stay updated with the latest 5G Core technologies and
    industry trends.

  Qualifications

  - Extensive experience in 5G Core architecture and call flows.
  - In-depth knowledge of 3GPP procedures, including
    registration, mobility, and session management.
  - Strong programming skills in C, with experience in Go or
    Rust.
  - Proficiency in Linux system programming and embedded Linux
    development.
  - Experience with ARM-based systems and multi-threaded
    programming.
  - Solid understanding of networking fundamentals (TCP/IP, UDP,
    SCTP, HTTP/2).
  - Expertise in packet processing and performance tuning.
  - Familiarity with DPDK and its applications.
  - Preferred: Experience in implementing 5G Core network
    functions in production.
  - Strong debugging skills using tools like Wireshark, GDB, and
    tcpdump.
