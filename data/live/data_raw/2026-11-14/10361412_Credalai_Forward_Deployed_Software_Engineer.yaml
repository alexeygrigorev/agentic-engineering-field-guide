description: |
  About us

  Our mission at Credal is to harness frontier AI for everyone
  building a better future.

  We accelerate the most complex, sophisticated operations of
  the most impactful institutions, while weaving security and
  governance into every part of our product. Our customers
  include the U.S. Dept of Health and Human Services, MongoDB,
  Comcast NBC Universal, Lattice, Wise (Transferwise), Checkr,
  and incident.io among others.

  We’ve raised over $10m to date with a ton of runway. You’ll
  join a team of Thoughtful Doers™ from places like Palantir,
  Cruise, Meta, Uber, and Google.

  📍 Credal is in-person in our spacious NYC office with meals
  provided.

  About the role

  Forward Deployed Engineering (FDE) means embedding directly
  with organizations that rely on us, particularly those
  pursuing incredibly important missions in healthcare, tech,
  robotics, etc., to help them deliver critical outcomes and
  make our core product even better in the process.

  FDE responsibilities look similar to those of a small
  startup CTO: you’ll work independently or in small teams and
  own end-to-end execution of high stakes projects. By joining
  Credal as an FDE, you are leapfrogging your rate of learning
  and impact on the world.

  “Forward Deployed Engineering” was pioneered by Palantir:
  Credal’s founders and core team were top flight Palantir
  Forward Deployed Engineers and worked in some of the highest
  stakes engineering environments in the world (fun fact: our
  CTO wrote Palantir’s FDE job description!)

  About you

  - Much of Credal’s existing product has come out of learnings
    from customers! You think critically, creatively, and
    empathetically about what will really help our users and
    make our product better long term
  - You’re technical, curious, analytical, and love coming up
    with the right product for users’ problems
  - You’re a people person who loves working with leaders and
    end users alike, iterating on approaches and code to win
  - You embrace real world complexity, messiness and ambiguity,
    versus preferring being fed other peoples’ tidy Jira
    tickets
  - You believe technology is a tool to use to build, not an end
    unto itself

  Benefits and work environment

  - Opportunity to take ownership and accountability of major
    mission, business and technical outcomes from day one.
    Exercise your full capacity to create positive change in
    the world, rather than waiting for permission to advance
    to slightly less boring tickets or tasks.
  - High quality health coverage, including great mental health
    benefits, for you and your immediate family. This includes
    comprehensive and HSA options.
  - Industry-leading vision, dental, life, disability coverage.
  - Regular team activities & offsite events (last year we went
    to Turks and Caicos for a hackathon week!)
  - Unlimited PTO - and unlike some other companies, we're
    serious about you taking the time you need to recharge and
    be the best you can be! We also offer a guaranteed two
    weeks off during the last two weeks of December when the
    entire company goes on vacation!
  - A generous housing subsidy for those who choose to live
    close to the office.

  Interview process

  - Intro conversation with our leadership team
  - Virtual chat
  - Work trial to meet our team and CEO.
  - References (we check references on everyone at Credal to
    make sure all your future coworkers are world class and
    great to be around).

  More about us

  We’ve built the industry’s highest ceiling and most secure
  Action & Agent building platform for sticky, custom AI
  workflows. Use cases span countless domains, including: KYC,
  anti-money laundering, healthcare regulation, climate
  standards setting, cybersecurity, sales, people, IT, and
  customer support.

  - Cultural principles
  - Team of 13 with 9 engineers.
  - 7-figure ARR.
  - >100% NRR.
  - Product docs, case studies, blog, podcast
