description: |
  About Curotec: We are a globally leading software services
  company specializing in developing enterprise-level projects
  for clients worldwide. Our team is a unique blend of diverse
  skill sets, cultures, and backgrounds—a true melting pot of
  talent. One of the most rewarding aspects of working at
  Curotec is the opportunity to learn something new every day,
  not just about technology but also about our amazing team
  members. Visit our website to discover more about who we are
  and what we do.

  Job Description

  We are looking for a highly skilled Senior Full Stack
  Engineer with expertise in Node.js, NestJS, React, and
  Stripe to join our dynamic development team. The ideal
  candidate will be responsible for designing, developing, and
  deploying scalable web applications and APIs. Experience in
  payment integrations using Stripe and implementing secure,
  high-performance applications will be a huge plus!

  This is a remote position.

  Responsibilities

  - Develop and maintain scalable and secure web applications
    using Node.js and NestJS.
  - Build responsive and interactive front-end applications
    using React.js.
  - Design and develop RESTful and GraphQL APIs to support web
    and mobile applications.
  - Integrate and manage payment processing solutions using
    Stripe.
  - Optimize application performance and ensure security best
    practices are followed.
  - Collaborate with cross-functional teams, including UI/UX
    designers and DevOps engineers.
  - Write clean, maintainable, and well-documented code
    following best practices.
  - Implement CI/CD pipelines for continuous integration and
    deployment.
  - Monitor and troubleshoot system performance, logs, and
    errors.

  - Strong proficiency in Node.js and experience with NestJS.
  - Solid experience with React.js for front-end development.
  - Solid experience with Typescript.
  - Expertise in building and consuming RESTful and GraphQL
    APIs.
  - Experience integrating and managing Stripe payment
    processing solutions.
  - Proficiency in database management (PostgreSQL, MySQL,
    MongoDB).
  - Experience with Docker and containerized applications.
  - Familiarity with CI/CD tools (GitHub Actions, Jenkins,
    GitLab CI/CD, etc.).
  - Strong understanding of authentication, authorization, and
    security best practices (OAuth, JWT, CORS).
  - Knowledge of modern front-end development tools (Webpack,
    Babel, Redux, etc.).
  - Experience with unit testing and integration testing.
  - Strong problem-solving skills and the ability to work
    independently and collaboratively.

  Benefits Competitive salary Ability to grow and advance your
  career Attend virtual developer conferences Work on cutting-
  edge and exciting projects
