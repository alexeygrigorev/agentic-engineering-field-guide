  Drivetrain is a remote-first company headquartered in the
  San Francisco Bay Area. Founded in 2021 by a couple of ex-
  Googlers, Drivetrain is a fast-growing company on a
  trajectory for success with backing from leading venture
  capital firms.

  Drivetrain provides a great culture for its employees to
  thrive in and be happy.

  💜 Remote-friendly: Drivetrain brings together the best and
  the brightest, no matter where they are and provides them a
  great degree of autonomy. We trust our people.

  🗣️ Open & transparent:  We know that when our creators have
  access to all the information they need, their best work
