  is.

  About the role

  Drivetrain is looking for a Backend Engineer to join our
  team. The role involves working on challenging problems in
  backend application development, algorithms, system design,
  and serving in production.

  What you’ll be doing

  The underlying technical problems are challenging - how do
  you design abstractions that minimise custom code, as every
  business is a little different; how do you deal with data
  scattered across multiple systems and make sense of a large
  number of moving parts.

  You get to work on a cutting edge stack consisting of Java,
  Spring, Hibernate, Redis, Elasticsearch, PostgreSQL,
  BigQuery, and AWS.

  Determine operational feasibility by evaluating analysis,
  problem definition, requirements, solution development and
  proposed solutions.

  Take accountability for the quality, total cost of
  ownership, maintainability and security of the component
  developed. Review code developed by other developers and
  provide feedback to ensure best practices (e.g., style
  guidelines, checking code in, accuracy, testability, and
  efficiency).

  Contribute to existing documentation or educational content
  and adapt content based on product/program updates and user
  feedback.

  Seek out opportunities for innovation that can be shared
  between multiple teams that have a willingness to experiment
  as well as the courage to boldly confront problems of a
  large complexity and scope.

  As an early team member, you’ll help shape our company
  culture, engineering practices, and the product.

  Requirements

  A great problem solver and is passionate about the craft of
  building software.

  Has a deep understanding of algorithms, data structures, and
  distributed systems.

  Has at least 3 years of experience in software engineering.

  Experience with the above-mentioned stack would be helpful
  but is not necessary.

  Is aspirational, self-driven, and proactive.

  Has excellent communication skills.

  Sounds exciting? Apply at careers@drivetrain.ai. It may just
  be the next best decision you’ve ever made!
