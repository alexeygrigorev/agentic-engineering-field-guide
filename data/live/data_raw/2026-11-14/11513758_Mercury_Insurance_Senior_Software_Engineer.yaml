description: |
  Overview

  Join an amazing team that is consistently recognized for our
  achievements and culture, including our most recent Forbes
  award of being one of America's Best Midsize Employers for
  2026!

  Position Summary:

  As a Senior Software Engineer, you will play a crucial role
  in designing, developing, and maintaining complex software
  systems. This position involves leading agile teams or
  projects, mentoring junior engineers, and ensuring the
  delivery of high-quality software solutions.

  Geo-Salary Information

  An in-person interview may be required during the hiring
  process

  State specific pay scales for this role are as follows:

  $94,458 to $179,048  (CA, NJ, NY, WA, HI, AK, MD, CT, RI,
  MA)

  $85,871 to $162,771 (NV, OR, AZ, CO, WY, TX, ND, MN, MO, IL,
  WI, FL, GA, MI, OH, VA, PA, DE, VT, NH, ME)

  $77,3283 to $146,494  (UT, ID, MT, NM, SD, NE, KS, OK, IA,
  AR, LA, MS, AL, TN, KY, IN, SC, NC, WV)

  In CA: Typical hiring range is $123,078 to $170,941

  The expected base salary for this position will vary
  depending on a number of factors, including relevant
  experience, skills and location.

  Responsibilities

  Essential Job Functions:

  - Write high-quality code for complex scenarios with good test
    coverage.
  - Review and translate product requirements into robust
    designs to ensure high-quality distributed application
    systems that are modular, configurable, reusable, fast,
    effective, user-friendly, secure, compliant, scalable, and
    maintainable.
  - Lead design and code reviews of multiple applications to
    ensure best practices, adherence to Mercury standards, and
    high quality.
  - Lead the sprint team to deliver new or improved features,
    addressing any impediments to delivering high-quality
    solutions in the sprint backlog.
  - Collaborate with other teams and stakeholders to ensure
    successful delivery of intended functionality.
  - Mentor and provide technical guidance to other engineers on
    the team, fostering a culture of innovation and excellence
    within Mercury engineering.

  Qualifications

  Education:

  Minimum:

  - Bachelor’s Degree in Computer Science, Information Systems
    or other related fields Or equivalent combination of
    education and experience

  Preferred:

  - Master’s Degree in Computer Science.

  Experience:

  Minimum:

  - 5+ years software programming experience with 2+ years
    experience in Technologies used at Mercury, more than one
    years experience leading and mentoring engineering teams

  Preferred

  - Experience with RPA (Robotic Process Automation)
  - Experience with AI including prompt tuning, model
    evaluations, etc.
  - Experience working within the insurance domain

  Knowledge and Skills:

  - Proficient in programming in one or more industry-standard
    languages (e.g., Java, Python, Go, C++, JavaScript).
  - Experienced in leveraging various data structures,
    algorithms, and design patterns. Skilled in relational
    databases, NoSQL, and caching solutions.
  - Experienced in APIs using modern protocols like REST and
    gRPC. Proficient in message queuing, data streaming,
    workflow, and integration frameworks (such as Apache
    Kafka, Apache NiFi, Amazon SQS, MS MQ, Apache Camel,
    etc.).
  - Knowledgeable in microservices architecture.
  - Experienced in containerization technologies like Docker and
    Kubernetes.
  - Proficient in leveraging DevSecOps to improve engineering
    efficiency.
  - Experienced in designing and implementing high-quality
    distributed application systems that are modular,
    configurable, maximize reuse, and are fast, effective,
    user-friendly, secure, compliant, scalable, and
    maintainable. Skilled in leveraging analytics data and
    experimentation to design and improve systems for speed,
    scalability, and effectiveness. Strong problem-solving
    skills.
  - Excellent communication abilities. Strong ability to
    collaborate and influence cross-functional teams and
    stakeholders to address impediments and deliver desired
    results. Demonstrated leadership skills through mentoring
    and providing technical guidance to team members.
  - Experienced in driving technical strategy and vision for a
    team.
  - Preferred: Experience in cloud platforms such as AWS, Google
    Cloud, or Azure.

  About the Company

  Why choose a career at Mercury?

  At Mercury, we have been guided by our purpose to help
  people reduce risk and overcome unexpected events for more
  than 60 years. We are one team with a common goal to help
  others. Everyone needs insurance and we can’t imagine a
  world without it.

  Our team will encourage you to grow, make time to have fun,
  and work together to make great things happen. We embrace
  the strengths and values of each team member. We believe in
  having diverse perspectives where everyone is included, to
  serve customers from all walks of life.

  We care about our people, and we mean it. We reward our
  talented professionals with a competitive salary, bonus
  potential, and a variety of benefits to help our team
  members reach their health, retirement, and professional
  goals.

  Learn more about us here:
  https://www.mercuryinsurance.com/about/careers

