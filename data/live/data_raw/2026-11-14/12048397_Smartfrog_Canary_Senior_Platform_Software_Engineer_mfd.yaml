description: |
  A little bit about us:



  Smartfrog is an international IoT tech company focused on
  making everyday objects and places more intelligent and
  connected by enabling our users to access them from anywhere
  at any time. We want the latest technologies to be
  affordable and user-friendly so that our everyday lives
  become more comfortable, efficient, and secure. Are you the
  kind of person who gets excited by new challenges? Do you
  want to help us find innovative solutions to those
  challenges? If so, we look forward to hearing from you.



  To make our system work, we use a large-scale, massively
  concurrent, high-reliability cloud-based system. Our cloud
  system has multiple advanced segments – video streaming,
  analytics, big-data store, IoT communication pipelines, and
  more.

  What you'll be up to:



  As a Software Engineer on the Platform team, you’ll be at
  the heart of the platform team activities – growing,
  enhancing, and adding functionality to the cloud platform.
  Improving stability and scalability of the system while
  introducing new technologies and methods to the system.

  What you'll need to have:

  - BS/MS in Computer Science
  - 4+ years of work experience within a backend-focused
    software engineering team
  - Background in building distributed, scalable, and secure
    backend systems
  - Understanding of data streaming architectures and
    methodologies
  - Responsible AI tooling, discipline, and model integration
  - Proficiency in Python or Go
  - Experience working with the AWS stack, understanding of how
    the different services fit together, and when to use each
    one
  - Exposure to a diverse set of data stores such as Kafka,
    Scylla, Redis, MySQL, and DynamoDB
  - Experience designing RESTful APIs
  - Strong testing fundamentals
  - Good attitude



  Bonus points:

  - Passion for cybersecurity
  - Hands-on experience with K8S
  - Knowledge of data pipelines and warehousing
  - Interest in connected devices and home automation
  - Exposure to machine learning systems deployed at scale
  - Prior startup experience



  What can we give you:

  - An open, diverse, and truly collaborative team environment,
    in which we celebrate our progress together. We work hard.
    We have fun.
  - A dynamic office and team environment at an international
    tech company in the heart of Berlin
  - Hybrid or remote working model that allows for office and
    remote work, flexible working hours
  - The exciting chance to help build an international brand and
    to develop new exciting products and services that make a
    real, positive impact in people’s lives
  - Flexible, agile and young company with a flat hierarchy and
    the associated excellent developmental prospects
  - Constant focus on your personal & professional development
    (mentoring opportunities, constant career development
    discussions, instructor-led workshops and webinars)
  - Subsidy of language courses and participation in
    conferences, other educational materials
  - 27 days of paid vacation, educational leave, and the option
    of unpaid vacation
  - Free fruits, snacks, and beverages at our office
  - Team events, holiday and summer gatherings, birthday and
    anniversary recognition for our employees



  Location: Berlin / Remote

  Start Date: As soon as possible
