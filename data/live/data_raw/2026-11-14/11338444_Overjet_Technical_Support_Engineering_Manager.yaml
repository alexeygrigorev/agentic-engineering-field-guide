  Our Hybrid Workplace

  We have a unique hybrid workplace at Overjet — which
  combines the teamwork of meeting in person, with the
  flexibility of working from anywhere.

  Many of our positions are based in San Mateo, New York City,
  Boston, and Salt Lake City. The Jetters who live in these
  “geo-hubs” come to the office on Tuesdays and Wednesdays,
  while having the option to work from home the rest of the
  week.

  Our People Team is happy to answer any questions about what
  hybrid work means for your specific role!



