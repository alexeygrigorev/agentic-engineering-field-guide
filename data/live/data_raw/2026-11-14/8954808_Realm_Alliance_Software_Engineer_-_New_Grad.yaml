description: |
  Company Overview

  Realm builds AI for the mining industry. We integrate with
  existing mine infrastructure — cameras, SCADA systems,
  drones, and data repositories — to predict equipment
  failures, detect unsafe behaviors, and optimize operations.
  Our platform deploys intelligence in various ways to improve
  productivity and safety — monitoring PPE compliance via
  computer vision, optimizing froth flotation processes,
  analyzing longwall shearer performance, tracking MSHA
  citation patterns, and more.

  Our founders started their careers at Palantir before going
  on to build Blend Labs (publicly traded fintech, founded as
  CTO) and Even (acquired by Walmart). Our leadership team
  brings experience from Uber, Metropolis, and other high-bar
  organizations. We're a small, senior team that ships daily
  to production mines.

  AI isn't just our product — it's how we build. We're an AI-
  first engineering team that uses the latest models and
  tooling throughout our development process, moving faster
  and at higher quality than traditional teams our size.

  Our culture values high agency, deep ownership,
  collaboration, and autonomy across a fully remote workforce.
  Teams here move quickly and make meaningful contributions to
  a product that shapes global industrial outcomes.

  What You'll Do

  You'll work alongside senior engineers on real features that
  run at active mine sites — not internal tooling or throwaway
  projects. We expect new grads here to ramp quickly and take
  on meaningful ownership within their first few months.

  What We're Looking For

  Must-Have Qualifications

  - BS in Computer Science or a related field
  - Strong CS fundamentals — data structures, algorithms, and
    system design
  - Proficiency with agentic coding tools (Claude Code, Codex,
    or Cursor) and an AI-first development style
  - Comfort working across the stack
  - Ability to work independently and ramp without heavy hand-
    holding
  - US citizen or permanent resident, based in the US

  Nice-to-Have Qualifications

  - Prior internship experience working on a production codebase
  - Strong TypeScript proficiency
  - AI, computer vision, or ML experience
  - Startup or fast-paced team experience

  Why Realm?

  - Work on mission-critical problems at the intersection of AI,
    security, and global infrastructure
  - Shape the brand and product of a category-defining company
    from the ground up
  - High-ownership, high-impact role with direct influence on
    company growth
  - Competitive compensation with significant equity upside
  - Dynamic, remote work environment with global reach

  Interview Process

  - Engineering quiz (async, ~60 min) — A 8-question code
    reading and analysis assessment. No trick questions —
    we're testing how you think about real code.
  - Live coding interviews (3 x 1-hour sessions) — Algorithmic
    problem solving and a simulated development task.
  - Behavioral interview with senior leadership — Culture fit,
    working style, and past experience.
  - Reference checks

  Benefits/Perks

  🏥 Full medical, dental, and vision benefits

  🌴 Unlimited PTO

  💰401(k) with 4% safe-harbor match

  📈 Equity in an early-stage, fast-growing company

  💻 Home office allowance
