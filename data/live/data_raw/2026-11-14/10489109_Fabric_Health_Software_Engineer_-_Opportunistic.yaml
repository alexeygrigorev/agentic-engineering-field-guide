description: |
  About Fabric Health

  At Fabric Health, we are powering boundless care by solving
  healthcare’s biggest challenge: clinical capacity. We aren’t
  here to disrupt healthcare; we’re here to fix it. We unify
  the care journey from intake to treatment, using intelligent
  automation to remove administrative burdens and make care
  delivery 2-10x more efficient. Our technology empowers
  clinicians to move faster and focus on what matters most:
  the patient.

  We are a mission-driven team of brilliant minds trusted by
  leading organizations including Intermountain Health, OSF
  HealthCare, SSM Health, and MUSC Health. Our vision is
  backed by premier investors such as Thrive Capital, GV
  (Google Ventures), General Catalyst, and Salesforce
  Ventures. We move quickly for good reason, listen deeply to
  solve big challenges, and build products with the same care
  and quality we’d want for our own loved ones.

  Learn more: About Us | News & Press | LinkedIn | Careers

  About the Role

  The software behind Fabric carries real clinical weight. It
  decides how fast a patient reaches care, whether a clinician
  sees the right information at the right moment, and how
  safely 100+ million lives move through intake, triage,
  routing, and treatment. Engineering choices here are not
  abstract; they show up in someone's care. We want to stay in
  conversation with the senior-and-above engineers we would
  hire the day the right seat opens, which is why this
  pipeline exists.

  This is an evergreen posting, not a role with an immediate
  start date. It is how we build a bench of exceptional
  engineers ahead of need, so that when a team is ready to
  grow we are already having discussions with potential
  applicants. We are deliberately language agnostic: we care
  far more about the judgment you show, the systems you have
  built, and the problems you have owned than about any single
  language or framework on your resume. If you are a serious
  engineer who wants to build technology that makes healthcare
  work better, we want to know you.

  What You'll Do

  The exact scope depends on the level and team you join, but
  across every seat in this pipeline you can expect to do work
  like the following:

  - Design, build, and own production systems that are reliable,
    secure, and performant under real clinical load.
  - Make high-stakes technical decisions with incomplete
    information, weigh the tradeoffs explicitly, and stand
    behind them.
  - Raise the bar around you through code review, design
    guidance, and the standards you hold, whether or not you
    carry a formal leadership title.
  - Partner closely with product managers, designers, and
    clinical experts to turn ambiguous problems into clear,
    well-tested solutions.
  - Debug and harden complex systems, and put safeguards in
    place so the same failure cannot happen twice.
  - Contribute to the technical direction of your team and, at
    the staff and principal levels, help set the architectural
    direction for the platform.

  Why You Might Be a Good Fit

  - You are a mid level and above engineer with a track record
    of shipping and owning production software, not just
    contributing to it.
  - You are genuinely language agnostic yourself, able to point
    to real, recent professional work in whatever languages
    and frameworks the job called for.
  - You reason clearly about systems, tradeoffs, and failure
    modes, and you can explain the hardest decision you made
    and why.
  - You take ownership seriously, especially when your work
    touches something as consequential as a person's care.
  - You are motivated by the problem of fixing healthcare, and
    you want to be in the conversation for the right role when
    it opens.

  This Might Not Be The Right Fit If...

  - You are early in your career or looking for a first
    engineering role. This pipeline is for mid level and above
    only.
  - Your strongest examples are academic or from coursework
    rather than production systems you built and owned
    professionally.
  - You are attached to a single language or framework and are
    not comfortable working in whatever stack the problem
    requires.
  - You are looking for an immediate placement and are not open
    to an evergreen conversation ahead of a specific opening.
  - You are not interested in the specific stakes and
    constraints of building software in healthcare.

  Your Qualifications

  - 3+ Professional software engineering experience, with a
    clear record of building and owning production systems
    (level within the range is set by depth and scope).
  - Demonstrable, recent professional depth in one or more
    modern languages and frameworks, with the ability to name
    the systems you built and your role on them.
  - Strong fundamentals in system design, data modeling,
    testing, and building for reliability, performance, and
    security.
  - Experience collaborating across product, design, and domain
    experts to ship real software against ambiguous
    requirements.
  - Sound engineering judgment, especially about tradeoffs,
    failure modes, and the consequences of the systems you
    own.

  Bonus Points

  - Experience building software in healthcare, or in another
    high-stakes, highly regulated, or safety-critical domain.
  - A demonstrated ability to become productive in a new stack
    quickly.
  - Experience with conversational agents, real-time systems, or
    systems handling race conditions, locking, and other
    complex concurrency concerns.
  - A background in computer science or a related field.

  The national pay range for this role is $70,000.00 –
  $225,000.00 per year. Actual compensation will be determined
  by factors such as the candidate's geographic market,
  experience, skills, and qualifications. Certain roles may
  also be eligible for additional compensation, including a
