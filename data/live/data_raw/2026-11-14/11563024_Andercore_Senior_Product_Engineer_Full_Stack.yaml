description: |
  About Andercore

  Andercore is the AI-native supplier of industrial materials
  and goods for energy and infrastructure. We execute trade
  and distribution end-to-end, on our own account, at the
  speed of compute - and we are becoming the supplier of
  record for the entire industry.

  Industrial procurement is a €900B market in Europe alone and
  the largest manual market on earth. 95% of customers have no
  direct access to global supply chains. Materials pass
  through four or five intermediaries before they reach a
  site, and 40% of the margin evaporates on the way. For
  decades, the operating system of this industry was people:
  people to source, negotiate, finance, ship, and sell.

  We built the alternative from scratch. We are the supplier.
  We buy from global sources and sell to European customers on
  our own account. Our AI runs the full trade: sourcing,
  quality, pricing, sales, logistics, credit, and financing.
  One request. A firm quote in minutes. Delivered on time. For
  the customer, it feels like buying from their preferred
  local supplier. No warehouses. No fleet. No inventory risk.
  Every trade is pre-sold before it is bought.

  We are also the credit counterparty. Customers are scored
  and insured in minutes and get up to 60 days of payment
  terms priced into the quote itself. The working capital
  behind every trade is bank-funded, not equity-funded.

  Where we are today:

  - Strong triple-digit-million euro turnover run rate, the
    majority of it from repeat customers
  - Seven European markets live, sourced from suppliers across
    Asia and beyond
  - 80+ people across Berlin (HQ), London, and Shanghai
  - $90M raised in equity and debt, including our $40M Series B,
    from Atomico, Project A, Target Global, and Inven Capital
    - with working capital facilities from UniCredit and KfW

  The margin is in the bits. The moat is in the atoms. We are
  building the supplier of record for industrial materials -
  and redefining how global trade works in one of the largest
  and most essential industries on earth.

  About the role

  Andercore runs global trade end to end, from sourcing and
  pricing to sales, logistics and financing, and much of that
  work is done by AI agents. Agents are only as good as the
  product around them: reliable data, well-designed APIs, and
  interfaces where our team can review, correct and approve
  what an agent proposes before real money and real shipments
  move.

  As a Senior Product Engineer, you own business problems end
  to end. You talk to the people who use what you build,
  decide with Product what to solve, and ship the whole slice:
  data model, services, AI agents and the user interface. You
  work in a domain where prices and stock change daily,
  supplier data arrives in every possible format, and a wrong
  number costs money. You set the quality bar for the team and
  make the engineers around you better.

  Tech stack

  Java 21 and Spring Boot 3, Python, LangGraph and LLM APIs
  (OpenAI, Anthropic, Gemini), PostgreSQL, Kinesis, AWS with
  Terraform, GitHub Actions, and TypeScript with Node.js,
  Next.js and React. You don't need to know all of it on day
  one. We use AI coding tools heavily and expect you to pick
  up whatever part of the stack the problem needs.

  What you will do

  - Own a business problem from first conversation to production
    and beyond, for example making supplier pricing reliable
    from ingestion all the way to the quote a salesperson
    sends.
  - Build backend services for pricing, inventory, orders and
    the integrations that connect suppliers, customers and
    logistics partners.
  - Build our AI agents and the tools and APIs they use, and
    make their actions safe through idempotency, validation,
    audit trails and human review where it matters.
  - Design and build the interfaces where our commercial teams
    work with agents: reviewing proposals, correcting mistakes
    and approving decisions quickly.
  - Turn messy external data such as supplier price lists,
    datasheets and stock feeds into trustworthy data the rest
    of the business relies on.
  - Measure whether what you shipped works, including evaluating
    and monitoring LLM-driven workflows in production.
  - Lead technical decisions, write down the trade-offs, and
    mentor other engineers through code review, pairing and
    direct feedback.
  - Help us hire by running interviews and defining what good
    engineering looks like at Andercore.

  In your first six months, you might

  - Build a pricing engine that scales with our growing
    assortment and number of markets, and serves correct
    prices to sales, and later directly to customers, in
    milliseconds.
  - Automate procurement: turn supplier price lists, quotes and
    order confirmations into structured data, and let AI
    agents handle the manual steps between our buyers and
    suppliers.

  What you bring

  - At least 5 years of experience building and running software
    in production, with real users and real consequences when
    it fails.
  - Strong backend skills at production scale in Java or a
    comparable language such as Kotlin, C# or Go, and
    willingness to work in Java and Spring Boot. Experience
    designing distributed, event-driven systems, with a focus
    on data correctness and failure modes.
  - Solid command of PostgreSQL and hands-on experience with
    AWS.
  - Your depth is on the backend, but full-stack delivery is
    expected: you build frontends in TypeScript and React. You
    don't need to be a frontend specialist, but you can ship a
    good interface for the problem you own.
  - Product sense: you ask why before how, you talk to users,
    and you can turn a vague problem into a clear plan.
  - Experience in a fast-growing company, where priorities shift
    and you keep shipping while the business changes around
    you.
  - A track record of solving business problems, not only
    technical ones.
  - Experience building with LLMs or agent frameworks is a
    strong plus. Curiosity and good engineering judgment about
    them is a must.
  - You raise the level of the people around you, and you push
    back when something doesn't make sense.
  - Experience in trading, marketplaces, supply chain, fintech
    or other domains where data errors cost money is a bonus.

  Practical details

  - Location: Berlin, hybrid
  - Working language: English
  - A learning budget for your development
  - Start date: As soon as possible

  We are an equal-opportunity employer and welcome applicants
  from all backgrounds, regardless of race, ethnicity, gender
  identity or expression, sexual orientation, religion, age,
  disability, or any other characteristic. We believe that
  diversity drives innovation, creativity, and collective
  strength.
