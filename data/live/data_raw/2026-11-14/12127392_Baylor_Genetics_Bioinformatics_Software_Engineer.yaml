description: |
  JOB SUMMARY

  The Bioinformatics Software Engineer is responsible for
  developing and maintaining bioinformatics software,
  databases, and tools. They assist in the design and
  execution of data processing pipelines for genomic,
  transcriptomic, and proteomic data, collaborating with
  research and clinical review teams to analyze experimental
  data and interpret results. Additionally, they contribute to
  the integration of bioinformatics tools with other platforms
  and technologies, document and report on software
  development processes and data analyses and stay updated
  with the latest bioinformatics software and techniques.

  KEY RESPONSIBILITES

  - Develop and maintain bioinformatics software, databases, and
    tools.
  - Assist in the design and execution of data processing
    pipelines for genomic, transcriptomic, and proteomic data.
  - Collaborate with research and clinical review teams to
    analyze experimental data and interpret results.
  - Contribute to the integration of bioinformatics tools with
    other platforms and technologies.
  - Document and report on software development processes, data
    analyses, and results.
  - Participate in team meetings and provide insights and
    updates on project statuses.
  - Stay updated with the latest bioinformatics software and
    techniques.

  QUALIFICATIONS

  Required

  ·       Education: Bachelor's degree or higher in
  Bioinformatics, Computer Science, or a related field.

  ·       Experience: Proficiency in programming languages
  such as Python, R, or Java. Prior clinical lab experience
  preferred but not required

  COMPETENCIES

  - Experience in developing and maintaining bioinformatics
    software, databases, and tools.
  - Familiarity with data processing pipelines for genomic,
    transcriptomic, and proteomic data.
  - Strong analytical and problem-solving skills.
  - Ability to collaborate effectively with research and
    clinical review teams.
  - Knowledge of bioinformatics tools and techniques.
  - Excellent documentation and reporting skills.
  - Ability to stay updated with the latest advancements in
    bioinformatics software and techniques.
  - Experience with version control systems such as Git is a
    plus.

  PHYSICAL DEMANDS AND WORK ENVIRONMENT

  - Frequently required to sit, stand, utilize hand and finger
    dexterity, talk, or hear.
  - Frequently required to utilize visual acuity to operate
    equipment, read technical information, and/or use a
    keyboard.
  - Occasionally exposed to bloodborne and airborne pathogens or
    infectious materials.

