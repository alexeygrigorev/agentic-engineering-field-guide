description: |
  About the role:

  We are seeking passionate software engineers to join our
  Hydration Platform team and help build the foundation
  platform used by many engineering teams across Uber Eats.

  You will collaborate closely with Uber infrastructure teams
  and Uber Eats product engineering teams. You will have
  opportunities to work across product lines spanning across
  feed, search, storefront and checkout.

  About the Team:

  The Hydration Platform team operates at the heart of Uber
  Eats’s technology stack. We build high-throughput, low-
  latency distributed systems that serve store, item and user
  data to applications used by merchants, consumers and
  couriers in real time.

  Our team works closely with Uber infrastructure teams across
  storage, networking and developer platforms. We develop
  innovative engineering solutions for complex product
  challenges. Operating at a scale of tens of millions of
  requests per second, our platform directly powers core user
  experiences like home feed, search, storefront and checkout.

  Minimum qualifications:

  - Bachelor’s degree or equivalent in Computer Science,
    Engineering, Mathematics or related field OR 2-year full-
    time Software Engineering work experience, WHICH INCLUDES
    2-year total technical software engineering experience in
    one or more of the following areas:
  - Professional software engineering experience building and
    delivering production systems.
  - Proficiency in at least one programming language (e.g. C,
    C++, Java, Python, or Go).
  - Developing backend services, APIs, or distributed systems.
  - Understanding of core computer science concepts, including
    data structures, algorithms, concurrency, and system
    design.
  - Experience writing maintainable, well-tested production
    code.
  - Strong problem-solving skills and ability to collaborate
    effectively with engineers and cross-functional partners.

  - Note the 1-year total of specialized software engineering
    experience may have been gained through education and
    full-time work experience, additional training,
    coursework, research, or similar (OR some combination of
    these).  The year of specialized experience is not
    necessarily in addition to the years of Education & full-
    time work experience indicated.

  Technical skills:

  Preferred:

  - Experience building scalable, high-throughput, and low-
    latency backend systems.
  - Familiarity with micro service architecture and distributed
    system technologies such as Kafka, Redis, MySQL and
    Thrift.
  - Experience with performance optimization, monitoring,
    observability, and production debugging.
  - Experience in driving cross-team projects.At Uber, we ignite
    opportunity by setting the world in motion. We take on big
    problems to help drivers, riders, delivery partners, and
    eaters get moving in more than 600 cities around the
    world!We welcome people from all backgrounds who seek the
    opportunity to help build a future where everyone and
    everything can move independently. If you have a
    curiosity, passion and collaborative spirit, work with us,
    and let’s move the world forward together!Uber is proud to
