  Responsibilities

  For Canada-based roles: The base salary range for this role
  is CAD $144,000 per year - CAD $160,000 per year.

  For New York City, NY-based roles: The base salary range for
  this role is USD $171,000 per year - USD $190,000 per year.

  For San Francisco, CA-based roles: The base salary range for
  this role is USD $171,000 per year - USD $190,000 per year.

  For all US locations, you will be eligible to participate in
  Uber's bonus program, and may be offered an equity award &
  other types of comp. All full-time employees are eligible to
  participate in a 401(k) plan. You will also be eligible for
  various benefits.

