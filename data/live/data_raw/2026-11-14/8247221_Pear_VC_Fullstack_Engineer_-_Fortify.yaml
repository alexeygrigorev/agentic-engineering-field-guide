description: |
  Fortify is modernizing student financing.

  We're looking for a full-stack engineer who's excited about
  fintech, capital markets, and product to join us in opening
  up access to education.

  About us:

  Fortify helps students succeed by giving them more
  affordable ways to pay for their education, and then
  supporting them after they've graduated.

  Since COVID, access to credit has collapsed, and students at
  all kinds of schools - from at trade schools to major
  universities - need financing options to afford their
  tuition. Fortify exists to help educational institutions run
  these financing programs more effectively, handling
  everything from financial aid and scholarships to payment
  plans and institutional loans. We make student financing
  simple - but we also go beyond financing, to help our
  students be successful after they've graduated.

  We're building for those who have the ambition, motivation,
  and wherewithal to go to school, but are lacking the
  resources.

  Fortify is backed by Pear VC. We're a small, very well-
  capitalized company.

  You'll be joining a small team with a lot of expertise in
  fintech and lending: Both of our cofounders are second-time
  founders, having started two separate venture-backed
  companies in the space, and one was an early hire at SoFi.

  About this role:

  - You'll be a full-stack engineer building Fortify's core
    financing platform.
  - You'll be given significant autonomy over new products and
    will own major launches.
  - You'll work on a very small team, and have lots of
    opportunities to own design & product work if you like.
  - You'll help fulfill our mission of expanding access to
    education and promoting economic mobility.

  What you might work on:

  - Owning the architecture and launch of an entire new product,
    such as a financial aid tool to help students more easily
    apply for federal aid (FAFSA) or state aid.
  - Working on our online financing application for students who
    need loans, scholarships, or aid to make their experience
    smoother.
  - Building tools to help promote financial literacy for our
    students or to help them find job opportunities more
    easily after they graduate.

  Nice-to-haves:

  - You have had significant ownership over production code at a
    tech startup.
  - You have outstanding written communication skills and enjoy
    product work as well as coding.
  - You're excited about fintech and working on critical code
    that processes and moves money.
  - You have experience with our tech stack: React, Python, and
    Postgres.

  Growing at Fortify:

  If you're interested in fintech, this is a unique
  opportunity to learn about lending, capital markets, and
  payment processing.

  As always, there's lots of early-stage flexibility to create
  your own role and define what you'd like to work on. There
  will be lots of opportunity for you to own major new
  products, make key design decisions, to interview users &
  customers, and to grow into other areas of the business as
  we scale up rapidly.
