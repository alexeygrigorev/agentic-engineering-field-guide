description: |
  CIeNET is seeking a Senior Full Stack Software Developer to
  design, develop, and enhance a suite of web-based business
  applications. In this role, you will work closely with
  customer stakeholders, product owners and cross-functional
  engineering teams to clarify business requirements, define
  technical solutions, and build scalable, high-quality
  enterprise applications that improve operational efficiency
  and employee experience.

  The ideal candidate is a hands-on software engineer with
  strong system thinking, excellent communication skills, and
  the ability to own features from concept through production
  while collaborating effectively across business and
  engineering teams.

  Location: United States (East Coast & West Coast)

  Key Responsibilities

  - Design, develop, and maintain scalable full stack web
    applications, including frontend, backend services, APIs,
    databases, and system integrations.
  - Partner with customer stakeholders and product owners to
    clarify business requirements and translate them into
    technical solutions.
  - Drive technical discussions and collaborate with
    development, QA, and DevOps teams to resolve
    implementation, testing, environment, and data-related
    issues.
  - Modernize and enhance existing applications while
    maintaining legacy systems where appropriate.
  - Troubleshoot production issues, identify root causes, and
    improve system reliability and performance.
  - Participate in system design, architecture reviews, and code
    reviews to ensure scalable and maintainable solutions.
  - Continuously improve engineering practices, software
    quality, and development efficiency.
  - Take ownership of features throughout the software
    development lifecycle, from design to production support.

  Requirements

  - 3–7 years of professional software development experience
    building enterprise web applications.
  - Strong proficiency in Java; experience with Kotlin is
    preferred.
  - Experience with at least one modern frontend framework
    (React, Angular, Vue.js, or similar).
  - Experience developing RESTful APIs and database-driven
    applications.
  - Strong understanding of software architecture, system
    integration, and the software development lifecycle.
  - Ability to understand business workflows, communicate with
    customer stakeholders, and translate requirements into
    technical solutions.
  - Strong analytical, debugging, and problem-solving skills
    across application, database, and integration layers.
  - Excellent communication, collaboration, and ownership with
    the ability to deliver independently.

  Preferred Qualifications

  - Experience with Spring Boot or similar Java frameworks.
  - Experience with asynchronous processing, job scheduling, or
    workflow orchestration.
  - Experience with CI/CD, Docker, Kubernetes, or cloud-native
    application development.
  - Experience working with HR, ERP, CRM, or other enterprise
    business applications.
  - Experience working in Agile and globally distributed
    engineering teams.

  Education

  - Bachelor's degree in Computer Science, Software Engineering,
    Computer Engineering, or a related field.
  - Advanced degree or relevant technical certifications are
    considered a plus.

  Benefits

  - Medical, Dental, Vision, and Life Insurance
  - 401(k) Matching
  - Paid Time Off and Holidays
  - Career Growth Opportunities
  - Collaborative and Innovative Work Environment
