description: |
  Hi 👋 I’m Aidan, founder of Maple.

  At Maple, we’re building AI agents that work for
  restaurants. These agents answer calls, take orders, book
  appointments, and handle real customer interactions over
  natural voice.

  But our bigger mission goes deeper: we’re building automated
  ontologies that model how businesses actually operate —
  their services, workflows, constraints, and language — so
  our agents can adapt to them instantly. We meet businesses
  where they are, not where software wants them to be.

  We have many customers, strong revenue growth, years of
  runway, and backing from world-class investors. I’ll share
  more once we meet.

  About the role

  As a Full Stack Engineer, you’ll work across our entire
  stack, from real-time voice interactions to operational
  tooling and backend logic. You’ll help us build and scale
  the systems that power AI agents in the wild, working
  closely with product, infra, and design to deliver real
  value, fast.

  You’ll own features from end to end, touch everything from
  UIs to APIs, and help shape our internal architecture as we
  grow. You’ll be helping define how software represents real-
  world business logic at scale.

  We work in person, 5 days a week in our NYC office.
  Collaboration here is fast, noisy (in the best way), and
  high-trust. We move quickly, break things intentionally, and
  fix them just as fast.

  What you’ll do

  - Build and maintain full-stack features across our TypeScript
    monorepo
  - Work across frontend (React + Tailwind) and backend (Node.js
    + Postgres) systems
  - Build internal tooling, customer dashboards, and agent
    management interfaces
  - Design APIs and data models that reflect real-world
    workflows and logic
  - Collaborate closely with design and product to simplify
    complex problems
  - Help scale and harden core infrastructure as usage grows
  - Own projects end to end — from user need to shipped product

  What we’re looking for

  - Strong experience with TypeScript across both frontend and
    backend
  - Fluency with React, CSS, modern component libraries, and
    design systems
  - Experience designing and building APIs and data flows
  - A product mindset: you care about speed, clarity, and
    usability
  - Excitement about AI systems, voice interfaces, or modeling
    real-world logic
  - Bonus: experience with Postgres, LLMs, Twilio, Sync Engines,
    or WebSockets
  - 4–8+ years experience preferred, but we’re flexible for the
    right person

  How we work

  - We optimize for leverage. That means great internal tooling,
    fast CI/CD, and code that scales across many customer
    types
  - We believe in deep ownership. Engineers here talk to users,
    design features, and ship fast
  - We value clarity over process. You’ll spend most of your day
    building, not waiting on decisions
  - We move in person. We’re a tight-knit team that moves fast
    and solves problems together

  What we offer

  - Competitive salary + meaningful equity
  - A real product with real usage and growing revenue
  - Strong In-person culture, fast feedback loops, and zero
    bureaucracy
  - A small team that feels like a founding team
  - Full health, dental, vision, 401k, life insurance, and
    unlimited PTO
  - Tools budget, coffee budget, whatever-you-need-to-be-great
    budget

  Want to help reimagine how software works for real-world
  businesses? Let’s talk.
