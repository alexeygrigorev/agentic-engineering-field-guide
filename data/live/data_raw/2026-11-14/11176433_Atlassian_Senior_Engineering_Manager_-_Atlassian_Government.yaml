  Atlassians can choose where they work - whether in an
  office, from home, or a combination of the two. That way,
  Atlassians have more control over supporting their family,
  personal goals, and other priorities. We can hire people in
  any country where we have a legal entity. About the role
  Shipping software is the moment all of engineering's work
  becomes real for customers - and the moment risk is highest.
  We're looking for a Senior Manager to build and drive
  Atlassian Government Cloud platform components, especially
  building and maturing release components end to end! You'll
  lead a team of experienced software engineers who build the
  infra to support multiple product teams and hundreds of
  service teams, own the go/no-go decision framework, and
  drive our shift from continuous delivery to operator-
  approved releases. This is a hands-on leadership role:
  you'll set strategy and grow people, coach the direction and
  team, and you'll also be in the room for the hard launch
  calls. What you'll do Own the function

  - Own the release process for Government releases: planning,
    branch and versioning strategy, release readiness,
    cutover, verification, and rollback.
  - Run the release calendar and dependency map across teams;
    make the tradeoffs when timelines, quality signals, and
    commitments collide.
  - Own go/no-go decisions and the criteria behind them. Define
    what "ready to ship" means, in writing, and hold the bar.
  - Serve as the escalation point for release-impacting
    incidents, including out-of-hours for major launches.

  Lead and grow the team

  - Manage, coach, and hire a team of 10-15 software engineers;
    set clear expectations, run performance and career
    development, and build a healthy on-call and workload
    rotation.
  - Build bench strength so no release depends on one person's
    memory

  Drive the strategy

  - Define a multi-quarter roadmap to reduce release risk and
    cycle time: trunk-based development, feature flags,
    progressive rollout and canaries, automated release gates,
    and one-click rollback
  - Partner with other platform teams to adapt the tooling that
    makes the process scale, and retire toil and manual
    checklists.

  Partner broadly

  - Work with Engineering, Product, QA, SRE, Support, Security,
    Docs, Marketing, and Legal/Compliance to align release
    readiness with launch readiness.
  - Communicate status, risk, and decisions crisply to senior
    leadership
  - Run blameless post-release reviews and convert findings into
    process or tooling changes.

  Keep us compliant and auditable

  - Ensure releases meet change management, separation-of-
    duties, and audit requirements (e.g. SOC 2, ISO 27001,
    FedRAMP, PCI, or SOX as applicable) without turning
    delivery into paperwork.

