description: |
  Company Description

  We are a growing company with 7 years of experience and
  start-up character with a modern HQ in Grunewald, one of the
  greenest areas of Berlin. Our international team has
  a family atmosphere, great work-life balance and provides
  all what you need to become a champ. We provide tailor-made
  solutions for our customers; we offer optimal individual
  possibilities for the planning and realization of web and
  app projects. Due to the interdisciplinary fields of work,
  Bitlane offers an exciting work environment in various
  projects and tasks! We are searching for hands-on developers
  to join our growing team, who will have fun while accepting
  new challenges and elevate each-other to successfully reach
  company goals. We want to develop awesome projects alongside
  other talented developers and be a part of digitalization. 

  Job Description

  We are looking for a software engineer passionate about web
  development from front- to backend. You will be responsible
  for participating in our product development from ideation
  to deployment and beyond. The ideal candidate has a thorough
  understanding of software engineering and development
  standards and best practices. Also, you should be a problem-
  solver with an inquisitive and innovative mind to leverage
  your software development skills to help build new services.
  You will be responsible for backend and front-end
  development on a wide range of projects and will work
  together with our international team on the various layers
  of our applications. The complexity of these projects can
  vary from small apps, to e-commerce shop systems up to whole
  CRM Systems and gated company portals. If you recognize your
  skills in this job description, we would be happy to receive
  your application!

  Responsibilities:

  - Collaborate with our software team to design and launch new
    features
  - Improve our product and codebase with your analytical
    mindset
  - Develop and extend our existing web technology portfolio
  - Create and maintain tools to interact with the software and
    data
  - Support the test-driven development of the software stack
    (e.g. code reviews, unit tests, CI) and documentation
  - Defining a project scope together with a project manager
  - Communicating the status of your work and meeting deadlines
    defined by you and a project manager

  Qualifications

  - At least 3 years front- and backend experience
  - Solid understanding of backend development and AWS
    development best practices
  - Strong knowledge of two backend frameworks (Laravel is an
    advantage)
  - Skilled in frontend development with a focus on cross
    browser support
  - Strong knowledge of one modern Javascript frameworks
    (Angular, React, VUE)
  - Experience using CSS preprocessors like Sass, Less or Stylus
  - Team working with version control system like git or
    subversion
  - Experience with integrating third-party APIs
  - Experience in building mobile apps is a big advantage
  - Fluent English - German is a plus, but not necessary

  Additional Information

  - Detailed training with professional support
  - Permanent employment contract with home office options
  - Flat hierarchies and flexible working hours
  - Attractive remuneration
  - Regular further education offers
  - Coordinated team events
  - Fresh fruit, ice-cream, coffee, tea and cold drinks
  - High-quality office in the heart of the Grunewald

  Sounds like you? Great, we would love to hear from you!
  Please include your CV and a short cover letter explaining
  who you are, what is your superpower and your salary
  expectations. Feel free to send us something that shows us a
  little more about what you’re interested in - be it your
  account on GitHub, Twitter, Instagram, Medium or your blog.
