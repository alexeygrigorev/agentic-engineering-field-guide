  We foster a collaborative and innovative work environment
  where your ideas are valued and your contributions are
  recognized. Decisal Ltd is committed to providing a
  supportive and inclusive workplace that encourages growth
  and professional development.

  If you are a highly motivated individual with a strong
  background in C++ programming and a passion for creating
  high-quality software, we want to hear from you!

  Requirements

  - Design, code, test, and debug C++ applications, ensuring
    high level of quality and performance
  - Collaborate with customers to gather requirements and
    translate them into technical specifications
  - Maintain and improve existing software systems, applying
    best practices and making enhancements as requested
  - Troubleshoot and resolve software defects and issues in a
    timely manner
  - Stay up-to-date with industry trends and advancements in C++
    programming to continuously enhance skills and knowledge
