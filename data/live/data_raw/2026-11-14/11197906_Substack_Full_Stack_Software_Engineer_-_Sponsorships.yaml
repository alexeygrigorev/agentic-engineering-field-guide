description: |
  Full Stack Software Engineer - Sponsorships Substack is
  building a new economic engine for culture, giving the
  brightest, most interesting, and most creative people on the
  internet the power of their own publishing platform. The
  terms of our culture should not be set by gate-keeping
  legacy media or chaos-fueling social media, but by the
  people who actually make and participate in that culture.
  Substack’s model, based on direct subscriptions, has fueled
  an explosion of independent publishing. It empowers creators
  with economic autonomy, creative ownership, and a direct
  connection to their most engaged audiences.

  About the Sponsorships Team Our team’s goal is to augment
  our existing direct subscriptions model with paid
  sponsorships. Brands are interested in connecting with
  Substack creators, and Substack creators are interested in
  making more money, but we want to support this behavior in a
  way that doesn’t degrade the user experience or undermine
  trust in the platform. Everyone contributes to the product
  direction. Our team regularly brainstorms directly with
  leadership, and every engineer contributes ideas for new
  products and experiences. We also sometimes work directly
  with our Sponsorship partners (e.g. Polymarket) to develop
  new experiences. We’re a small team of generalists, so we
  especially value an interest in working across our tech
  stack, willingness to prototype, and product-mindedness.

  Responsibilities:

  - Build frontend and backend (and sometimes mobile) features
    that help creators take advantage of sponsorship
    opportunities
  - Collaborate with designers, writers, support staff, and many
    others. From product concept and research to
    implementation and deployment, we expect you to own your
    work and operate autonomously.
  - We work with TypeScript, especially Node/Express and React,
    and Postgres. It’s helpful if you know these technologies
    already; if not, we’ll be excited to help you learn.

  Requirements:

  - At least 5+ years of software engineering experience.
  - Independent and autonomous. We’re too small to micromanage,
    and expect that every person at the company owns their
    work and can be a leader.
  - Hold yourself and others to a high standard when working on
    production systems.
  - Take pride in building elegant and delightful product
    experiences. Substack works best when it gets out of the
    way so writers can focus on writing and connecting with
    their readers.
  - Enjoy collaboration with a diverse group of thinkers while
    bringing our own unique experience and background to the
    team.
  - Believe in Substack’s mission to build a better business
    model for writing.
  - Experience working with ML technology would be beneficial.
  - Experience at a fast-growing startup or working on a high-
    performing growth team is not required, but is a plus.

  Substack's compensation package includes a market
  competitive salary, equity for all full time roles, and
  exceptional benefits. Our cash compensation salary range for
  this role is $140,000 - $260,000. Final offer amounts are
  determined by multiple factors including candidate
  experience and expertise and may vary from the amounts
  listed above.

  Substack is an equal opportunity employer. All applicants
  will be considered for employment without regard to race,
  color, religion, sex (including pregnancy, sexual
  orientation, gender identity or transgender status), age,
  national origin, veteran or disability status. We’re seeking
  people passionate about enabling independent expression and
  building a better business model for creators. If you want
  to see what media, communities, and content can become when
  unmoored from advertising models, and you have the skills
  and experience to contribute, we’d love to meet you.

  Please see our Privacy Notice for details regarding
  Substack's collection and use of personal information
  relating to the application and recruitment process by
  clicking here.
