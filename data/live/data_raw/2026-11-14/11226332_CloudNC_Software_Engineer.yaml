description: |
  Who are CloudNC?

  CloudNC is transforming global manufacturing with AI that
  accelerates CAM programming, maximizes factory output, and
  empowers machinists to deliver more. Our core product, CAM
  Assist, speeds up CNC machining by tackling the most time-
  consuming and repetitive parts of the process, from
  machining strategy to toolpath generation. It enables
  machinists to create effective programs in minutes,
  unlocking their full potential and helping shops increase
  throughput and improve consistency. Today, CAM Assist is
  trusted by over 1,000 machine shops around the world to
  enhance their teams’ productivity, resolving skills
  shortages and helping them to deliver efficiently for their
  customers. Founded in 2015, CloudNC consists of a world-
  class team combining expertise in computer science and
  physical manufacturing, based in our headquarters in London
  and our factory in Chelmsford. The technology company is
  backed by leading venture capital firms Atomico and Episode
  1 Ventures, alongside Autodesk and Lockheed Martin as
  strategic partners.

  Why you?  You thrive on tackling new challenges in a fast-
  paced environment, combining curiosity, experimentation, and
  hands-on implementation to turn complex problems into
  solutions. Collaboration excites you—you enjoy bouncing
  ideas around with your team, exploring fresh approaches, and
  pushing the boundaries of what’s possible, all while staying
  aligned with our product vision and roadmap.

  Essential experience: Experience working in C++ (11 or more
  recent versions) Experience of working with UI frameworks
  (Typescript, Angular, React) Strong attention to detail and
  communication skills Confident in working with a fast paced
  environment

  Desirable Masters or PhD in Mathematics, Physics,
  Computational Geometry, Mechanical Engineering or another
  field closely related to our domain. On site training will
  be conducted to familiarise new starters with factory
  operations and software capabilities. We do not expect prior
  knowledge of the manufacturing industry. Benefits Stock
  Options Annual Performance Equity Award 36 days of annual
  leave including public holidays Leading medical plan Life
  Insurance 4 Weeks paid Sabbatical leave every 4 years
  Enhanced primary, secondary and adoption parental pay &
  leave (maternity/paternity) Monthly hackdays and quarterly
  hackathons and more... Equal Opportunities Statement We are
  proud to be an equal opportunity employer, valuing
  individuality and embracing all people. The success of
  CloudNC is a result of diversity of thought. We recognise
  this comes from people truly belonging. We encourage
  different perspectives and skills to collaborate towards our
  mission - disrupting the manufacturing industry. We
  celebrate diversity and continually improve our inclusivity
  efforts.
