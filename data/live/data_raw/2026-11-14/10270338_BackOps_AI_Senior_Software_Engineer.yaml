description: |
  About BackOps AI

  BackOps AI is transforming supply chain operations with
  agentic AI solutions that automate complex workflows,
  freeing operations teams to focus on what matters most.
  Headquartered in the San Francisco Bay Area with flexible
  remote-friendly options, we foster a culture of innovation,
  ownership, and measurable impact.

  Role Overview

  As Senior Software Engineer, you’ll be a core member of the
  team, architecting and implementing the end-to-end systems
  that power our agentic solutions. This is a full-time,
  hybrid role where you’ll:

  - Lead engineering efforts from design through production
  - Build scalable products
  - Collaborate closely with AI researchers, product, and
    operations teams to enrich business context for agents
  - Influence our technical roadmap, tooling choices, and best
    practices

  What You'll Do

  - Architect & Build: Design and develop robust, efficient
    systems that automate intricate supply chain workflows
  - POC Leadership: Own proof-of-concept projects define
    requirements, write core code, iterate rapidly, and
    validate success with stakeholders
  - Full-Stack Development: Implement new features across our
    React front end and Node.js/Python back end
  - AI Agents: Building vertical agents that solved high impact
    problems
  - Strategic Partnership: Shape product direction by providing
    architectural insights and technical feasibility
    assessments
  - Maintain the confidentiality, integrity and availability of
    the information systems and processes for which they are
    responsible in compliance with BackOps.ai policies on
    information security and privacy
  - Responsible for the development and deployment of secure
    code in accordance with BackOps.ai standards, policies and
    procedures
  - Leader of the Incident Response team, responsible for
    incident response, documentation and lessons learned
    process
  - Execution of customer data retention and deletion processes
    in accordance with company policy and customer
    requirements

  What We're Looking For

  - Experience: 5+ years of professional software development,
    with a track record of delivering production-scale web
    services
  - Startup DNA: Proven ability to thrive in early-stage
    environments comfortable with ambiguity, rapid pivots, and
    wearing multiple hats
  - POC Expertise: Demonstrated success leading proof-of-concept
    or pilot projects from zero to launch
  - Technical Mastery: Deep understanding of modern front-end
    frameworks, and back-end languages (Node.js, Python)
  - Problem Solver: Strong analytical skills and a bias for
    action able to break down complex problems and deliver
    pragmatic solutions
  - Communicator: Exceptional written and verbal skills to
    articulate architecture decisions and partner effectively
    with non-technical stakeholders

  What We Offer

  - Equity & Ownership: Generous equity packages so you grow
    alongside the company and share in our upside
  - Impact & Visibility: Direct access to co-founders and the
    ability to see your work drive real business results
  - Collaborative Culture: A small, tight-knit team of seasoned
    operators and AI experts
  - Flexible Work: Hybrid model with core Bay Area presence and
    remote flexibility
