description: |
  Who we are

  School scheduling is a hard problem, one that technology was
  meant to solve. Yet for decades, the master schedule has
  been built by hand, consuming educators’ valuable time while
  delivering a sub-optimal result for students. We started
  Timely to build the tool we wish we had when we were in
  schools. And today, we are changing how schools create high
  quality schedules for teachers and students. Timely combines
  groundbreaking AI technology with support from a team of
  expert school schedulers: saving schedulers’ time, and
  surfacing opportunities for leaders to unlock staff
  potential. Timely delivers optimized master schedules that
  are more efficient, accommodate diverse educator needs, and
  enable student access to courses and pathways that impact
  their lives.

  Our district and school partners agree: scheduling is a key
  opportunity for educational innovation, and that Timely is
  the indispensable partner in addressing the challenge. We’re
  experiencing exciting growth as a company, while doubling
  down on our mission and people-centered approach to
  leveraging powerful technology. We serve districts and
  charter school organizations across 20+ states, growing (and
  renewing) at rates that lead the education technology
  industry. This growth has been driven by our strong product-
  market fit, deep understanding of education, and commitment
  to customer success.

  About the role

  This role is a Senior Software Engineer position with a
  strong focus on platform and infrastructure development. You
  and your team will own outcomes around stability, quality,
  maintainability, and speed of development for the Timely
  technical platform, encompassing infrastructure, tooling,
  development patterns, and critical shared libraries or
  components. In addition to identifying and delivering on
  projects that have the highest benefit for engineering team
  productivity and quality, you will help to up-level and
  onboard the entire team to best practices and establish a
  strong technology culture at Timely.

  Key Responsibilities:

  - Identify, prioritize, design and deliver technical platform
    solutions spanning areas like cloud infrastructure, test
    infrastructure & patterns, shared product libraries,
    security practices, authentication platform and CI/CD
    tooling.
  - Engage with engineering stakeholders to understand pain
    points and opportunities to enable Timely to deliver value
    quickly while maintaining quality.
  - Drive the investigation and decisioning on key technology
    decisions impacting how Timely builds and maintains
    software.
  - Own production availability by implementing observability
    and recovery practices for Timely applications while
    providing periodic on-call support.
  - Uplevel the Timely engineering team on platform technologies
    and engineering patterns by maintaining documentation,
    presenting in different venues, providing cross-team
    design/code reviews, and mentoring team members.
  - Own the delivery of critical projects by defining scope,
    creating tickets, and managing delivery timelines.
  - Mentor and support junior engineers, promoting a culture of
    collaboration, knowledge-sharing, and continuous
    improvement.

  Required Qualifications

  - 3-5+ years of experience in infrastructure and platform
    engineering and comfort with the following (or equivalent)
    technologies: AWS, Terraform, MongoDB, Python, CI/CD via
    Github Actions.
  - Ability to design and develop solutions full-stack to
    deliver value for the engineering team and wider business,
    including in the Frontend when necessary.
  - Strong communication and collaboration skills, especially in
    cross-functional environments.
  - Commitment to continuous improvement: seeking out and
    welcoming code reviews, pairing, and collaborative
    problem-solving.
  - Experience working in agile environments and familiarity
    with testing frameworks (e.g., Jest, Pytest).
  - Experience and comfort operating in a fast startup
    environment and all that entails: strong ownership, self
    direction, prompt delivery of value to the customer &
    learnings for the business.
  - Scaling and cyber security experience is preferable.
  - Prior experience in EdTech is a plus but not required.
  - Fully remote role with a preference for candidates based in
    NY or Boston.

  Why Join Us

  - Work with an exceptional team tackling meaningful challenges
    in education.
  - Be part of a growing, financially healthy company with a
    proven product.
  - Enjoy comprehensive benefits, including health, dental,
    vision and life insurance, unlimited PTO, and professional
    development opportunities including free access to online
    learning programs
