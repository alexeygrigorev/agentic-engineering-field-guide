description: |
  NLPatent is an AI-driven patent search and analytics
  platform helping companies, law firms, and universities
  research patents through large language models and natural
  language search. Our work sits at the intersection of
  software engineering, AI, and information retrieval,
  building tools that make complex patent data more
  accessible, searchable, and useful for expert users.

  As a Senior Backend Software Engineer (Python), you will
  play an important role in shaping the systems behind our
  platform. You will help strengthen the backend architecture
  that supports scalable product development, working closely
  with cross-functional colleagues to improve performance,
  reliability, and technical direction. This is an opportunity
  to contribute to a platform applying modern AI technology to
  a highly specialized and meaningful domain.

  Requirements

  - Strong experience with Python web frameworks such as Django
    or Flask
  - Proficient with RESTful API design and implementation
  - Experience with SQL databases such as PostgreSQL
  - Familiarity with containerization technologies like Docker
    and orchestration tools
  - Experience working with cloud platforms such as AWS, GCP or
    Azure
  - Solid understanding of software engineering best practices
    including testing, code reviews, and CI/CD pipelines
  - Eligible to work in the UK

  Preferred qualifications:

  - 5+ years of professional experience in backend software
    development primarily using Python
  - Experience with NLP or semantic search systems
  - Knowledge of large language models (LLMs)
  - Experience with Terraform or cloud infrastructure management
  - Familiarity with frontend technologies such as React
  - Experience with Elasticsearch or Opensearch

  Benefits

  - Competitive salary of 70000-85000 GBP/year
  - Flexible working
  - Pension
  - Training & Development
  - Stock Option Plan
