  Staff Software Engineer - iOS Company Description

  Butterfly Network, Inc. (NYSE: BFLY) is driving a digital
  revolution in ultrasound imaging and sensing with its
  proprietary Ultrasound-on-Chip™ semiconductor technology and
  software solutions. Butterfly first proved its technology in
  the point-of-care ultrasound market – commercializing the
  world’s first single-probe, whole-body portable ultrasound
  device, which is now on its best-selling, third-generation:
  Butterfly iQ3™. The Company combines its advanced hardware
  with cloud software and AI, an enterprise workflow solution
  (Compass AI™) and other offerings to drive adoption of
  affordable, accessible ultrasound. Butterfly also enables
  third-party development of imaging AI apps through Butterfly
  Garden™, its software development kit and AI partnership
  initiative.

  In addition to its medical imaging products, Butterfly
  Embedded™ is the Company’s Ultrasound-on-Chip™ licensing and
  co-development program designed to enable a new wave of
  ultrasound-enabled technologies across non-competitive
  healthcare markets and beyond. Through Butterfly Embedded™,
  partners can build and scale novel ultrasound applications
  powered by Butterfly’s proprietary semiconductor chip and
  software platform. Butterfly’s innovations have been
  recognized by Prix Galien USA, Fierce 50, TIME’s Best
  Inventions and Fast Company’s World Changing Ideas, among
  other achievements.

  We’re a team of bold thinkers, problem-solvers, and
  innovators ready to shape the future of medical imaging.
  Let’s build something extraordinary together!

   Job Description

  As a Staff iOS Engineer at Butterfly, you will be
  responsible for building native iOS apps that reinvent the
  ultrasound user experience for the mobile age. You’ll be a
  champion for constantly improving the software architecture
  and team processes. You’ll collaborate with product managers
  and designers to deliver elegant solutions to complex
  problems. You’ll work alongside the hardware, cloud, machine
  learning, control software, and imaging science teams to
  integrate cross-cutting features. You’ll even participate in
  user research sessions to get a firsthand view into how the
  product you build is being used in the real world.

  As part of our team, your core responsibilities will be:

  - Collaborating and unboxing ambiguous requirements through
    iterative problem-solving sessions with Android and iOS
    developers.
  - Working alongside product managers, designers, and clinical
    professionals to break down requirements and develop new
    medical imaging experiences.
  - Producing high-quality, efficient, and well-tested modern
    Swift code.
  - Following established team architecture patterns and
    evolving the codebase with the team.
  - Working in a complex codebase with numerous internal swift
    packages managed by the iOS, Device Software, Imaging and
    AI teams.
  - Mentoring engineers at all levels.  We are all life long
    learners.
  - Working on advanced technologies such as deep learning
    applications, telemedicine and integration with our
    cutting edge Butterfly iQ device.
  - Leveraging modern technologies like Swift, SwiftUI, Reactive
    programming, and GraphQL.
  - Product managers write requirements, engineers write
    tickets. We know how to break down work that builds what
    they want.
  - Perform a broad variety of tasks in support of the role and
    responsibilities.

  Qualifications

  Baseline skills/experiences/attributes:

  - Bachelor of Science in Computer Science / Engineering or
    related field.
  - A track record of professional achievement and problem
    solving.
  - 5+ years of native iOS application development.
  - Strong grasp of Swift and reactive framework design pattern.
  - A strong grasp of SwiftUI and UIKit UI Design Development
  - A strong grasp of XCTest Unit Testing and knowledge of UI
    automation
  - A passion for creating something meaningful.

  Ideally, you also have these skills / experiences /
  attributes (but it’s ok if you don’t!):

  - Interest and experience working in complex application
    structures with internal libraries that have Obj-C
    bridging layers.
  - Experience with the Swift Package Manager and package
    creation.
  - Knowledge of graphics rendering and image processing
    (OpenGL, Vulken).
  - Python and C++ experience will help you collaborate with our
    Device Software and Imaging teams.

  Values

  Innovation is what we do. Our values are how we make it
  happen. Butterflies are and believe in…

  - Patient-Centric Innovators: Our mission is THE mission.
  - Empowered to Impact: Every voice matters.
  - One Team, One Goal: Unity fuels progress.
  - Growth Champions: We embrace challenges.
  - Action-Oriented Achievers: We follow through, every time.

  Location

  Butterfly offers a hybrid work model for most positions,
  with team members spending two or more days a week in the
  office. While flexibility is key, we value in-person
  connections that spark creativity and teamwork. Our offices
  are designed for collaboration, with comfortable workspaces,
  stocked kitchens, and opportunities to connect with peers.

  This role is a remote role.

  Benefits and Perks

  - Comprehensive health insurance, encompassing dental and
    vision coverage, is provided to all our employees. As a
    health-tech company, we prioritize the well-being of our
    teams. Additionally, employees have the option to buy up
    for enhanced health insurance coverage. We also contribute
    to Health Savings Account (HSA) accounts for all enrolled
    employees on an annual basis.
  - Comprehensive Employee Assistance Program - we provide
    access to tools and resources to support your emotional
    health and day-to-day needs.
  - 401k plan and match - we facilitate your retirement goals.
  - Eligible employees will have the opportunity to participate
    in Employee Stock Purchase Plan (ESPP)
  - Unlimited Paid Time Off + 10 Holiday Days a Year - recharge
    and come back ready to make an impact
  - Parental Leave - we want to make sure our employees have
    plenty of time with their growing families, and additional
    benefits for primary caregivers to help transition back to
    work after leave
  - Competitive salaried compensation - we value our employees
    and show it
  - Equity - we want every employee to be a stakeholder
  - The opportunity to build a revolutionary healthcare product
    and save millions of lives!

  Compensation

  Our estimated salary for this role based in NYC is between
  $165,000 - $180,000 + bonus + equity + benefits. Actual pay
  is determined by multiple factors such as skills,
  qualifications, experience and market demand.

  Candidates must be authorized to work in the United States.
  Butterfly Network will not provide immigration sponsorship
  of any kind for this position, including but not limited to
  H-1B, TN, O-1, L-1, or green card sponsorship (this includes
  applicants that are in the process of obtaining a
  greencard), now or in the future.

  Butterfly Network does not accept agency resumes.

  Butterfly Network is an E-Verify Company.

  Butterfly Network is an equal opportunity employer.
  Regardless of race, traits associated with race, color,
  ancestry, religion, gender, national origin, sexual
  orientation, age, citizenship, marital status, disability or
  Veteran status. All your information will be kept
  confidential according to EEO guidelines.

  Butterfly requires security adherence responsibilities from
  all employees. These include:  adhering to all company
  security policies and procedures, utilize provided company
  assets securely, and complete all required security
  awareness training programs. Safeguarding company data and
  systems from unauthorized access, modification, or
  destruction, contributing to the overall security posture of
  the organization. Immediately reporting any suspected or
  actual security incidents, including phishing attempts,
  malware infections, or unauthorized access, following the
  established incident response procedure

