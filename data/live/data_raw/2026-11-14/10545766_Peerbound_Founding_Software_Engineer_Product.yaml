description: |
  Why Peerbound

  Every B2B buyer wants to hear from a company's current
  customers before making a buying decision. As AI makes every
  market 10x more competitive, a company's ability to unlock
  and activate the voices of its happy customers isn't just a
  nice-to-have; it's the only moat. Peerbound makes this
  possible at scale.

  Today, we do this for leading B2B SaaS companies like
  AlphaSense, Braze, Canva, Databricks, and Gong. We have the
  rare opportunity to disrupt not just multiple old-school
  software vendors, but entire categories of software,
  services, and labor.

  Our core values are Dazzle Customers, Deliver Results, and
  Demand Excellence. We recruit people with a demonstrated
  track record of excellence and give them the room to do the
  best work of their lives. If this sounds like the
  environment where you do your best work, we invite you to
  build with us.

  We are proud to be an NYC company, working hard in-person at
  our office near Penn Station. Our founders helped build
  Braze and Datadog, two of the city's biggest IPOs, and we're
  backed by the venture investors behind Square, Instacart,
  Airtable, and Webflow.

  Why Now

  We've spent two years earning product-market fit the hard
  way: 30+ enterprise customers who pay us real money and keep
  doubling down. We just closed our seed round to scale the
  team and accelerate product development.

  You'll be early enough to shape how this company builds
  software and know everyone by name on Day 1. But you're not
  walking into a blank canvas, as we have paying customers, a
  working product, and a validated roadmap. The risk is low
  and the leverage is enormous. Simply put, you will learn and
  contribute so much at Peerbound that you will accelerate
  your career more here than anywhere else.

  Peerbound is a product-centered company. To create the most
  valuable product in the least time, we are dedicated to
  building an Engineering team of exclusively A-players,
  collaborating 4 days a week in our midtown Manhattan office.

  What You'll Do

  You'll own product features end-to-end, from schema to UI,
  and set the standard for how we build. You'll report to our
  Head of Engineering and work closely with our CEO, our
  designer, and our customers across every product surface:
  our web app, our GraphQL API, and embeddable components that
  run on high-traffic public sites.

  Ship constantly—Go from PRD to production every week. Design
  the schema, build the API, write the frontend, add the
  tests, and monitor how real users interact with what you
  shipped. Near-term roadmap includes a customer analytics
  dashboard, a chatbot interface, and an overhauled user
  management experience.

  Set the foundation—Establish the patterns the rest of the
  team will build on, across the stack: API and data-model
  design, a shared component library and design system with
  our in-house designer, and a testing framework that spans
  backend and cross-browser frontend. Own how we leverage AI
  tooling as a real force multiplier in day-to-day engineering
  and in engineering-product-design collaboration.

  Dazzle customers—Bring best practices into the product and
  be a thought partner to our Product Designer. Optimize
  performance relentlessly, from query plans to render times.
  The product is where customers feel our quality most, and
  you'll be accountable for how it feels.

  Who You Are

  5+ years building and shipping customer-facing products end-
  to-end, including 3+ years at a startup or scale-up. You
  know what good collaboration looks like and what bad
  architecture costs.

  You're fluent across the stack. On the frontend: TypeScript,
  React, GraphQL, Tailwind, Figma, and Storybook. On the
  backend: Python, FastAPI, Strawberry GraphQL, and Postgres.
  You're comfortable designing schemas and APIs the rest of
  the team will build on. You don't need to have used our
  exact tools. What matters is that you've shipped real
  products with a similar modern tech stack.

  Beyond the stack, you care about craft at every level, from
  the easing curve on a transition to the shape of a database
  schema to component and endpoint naming conventions. You
  ship fast, and what you ship is dazzling.

  Compensation

  $180,000 to $220,000/year plus meaningful equity and
  benefits (fully covered medical / vision / dental, 401K,
  flexible PTO). In-person in NYC, 4 days in-office.

  Note from the CEO

  This company represents my life's work. I've been part of
  two IPOs, and I want to build the kind of company at
  Peerbound where working here marks an inflection point in
  everyone's career, and leads to the kind of bonds that last
  a lifetime.

  This is our first dedicated frontend and product focused
  engineering hire and one of the most important hires we'll
  make, ever. You won't just build features; you'll define
  what quality means, across the stack, for every engineer,
  designer, and user.

  If you notice when a transition is 50ms too slow, get
  excited about designing a data model and the UI it powers
  from zero, and want to be somewhere early enough to put your
  fingerprints on everything, we'd love to meet you.
