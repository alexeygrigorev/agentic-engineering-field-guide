title: Engineering Manager, Risk Engineering
company: Two Sigma
location: London, GBR
work_type: FULL_TIME
company_size: 1,700 Employees
description: |
  Position Summary  Two Sigma is a leading quantitative
  investment management and trading firm. The company applies
  a scientific approach to investing, combining cutting-edge
  technology, artificial intelligence, data science, and
  quantitative research with rigorous human inquiry to
  capitalize on market opportunities and deliver alpha for
  investors. Our team of engineers, quantitative researchers
  and data scientists looks beyond the traditional to test
  hypotheses and develop creative solutions to some of the
  world's most complex economic problems. We're seeking
  someone to lead Risk Engineering in London. The team builds
  the platforms Two Sigma uses to oversee risk across all of
  its businesses. This is a senior technical leadership role
  accountable for the people management, strategy,
  architecture, and execution of these platforms. The
  successful candidate will own platforms across the firm's
  entire trading lifecycle, from input data and model
  forecasts to trade execution and PnL. They will partner
  closely with the Risk Management team, including the Chief
  Risk Officer, portfolio managers, traders and other
  engineering teams whose requirements are demanding, diverse,
  and constantly evolving. You will take on the following
  responsibilities:

  - Engineering Leadership: Build, mentor, and retain a high-
    caliber engineering team in London. Set technical
    standards, improve systems engineering quality, and
    develop the next layer of leadership. Conduct performance
    evaluations, provide feedback, and seek opportunities for
    team members' career growth
  - Stakeholder Management: Learn Two Sigma's business and core
    investment concepts. Partner with Risk analysts to turn
    requirements into solutions, communicate clearly, and
    manage competing priorities
  - Lead by example: Demonstrate technical quality through
    hands-on work, including design and development. Help
    colleagues tackle technical problems and architect robust
    solutions
  - Vision and Strategy: Develop the roadmap for Risk
    Engineering across all of its platforms, together with the
    New York leadership
  - Execution and Delivery: Convert strategy into results with
    clear milestones. Lead projects, assign work, and hold the
    team to a high quality bar.
  - Collaboration: Work closely with colleagues in the New York
    Risk Engineering team to ensure clear ownership of
    projects, tasks, and day-to-day issues

  You should possess the following qualifications:

  - A Bachelors with Honours in Computer Science or another
    technical subject area required
  - Minimum 7 years of experience required; 10+ years of
    experience preferred including at least 2 years of
    demonstrated success leading engineering teams including
    people management (performance evaluations, feedback, and
    career development)
  - Extensive experience collaborating directly with business
    stakeholders and working through sophisticated and varying
    user requirements
  - Expertise building business-critical, high-availability
    applications in Java or Python, with current hands-on
    programming and design experience
  - Experience building systems on relational databases and web
    services
  - Hands-on experience using AI coding agents to design and
    build software
  - Experience building applications that use large language
    models (LLMs) or agents at runtime to make decisions or
    take actions
