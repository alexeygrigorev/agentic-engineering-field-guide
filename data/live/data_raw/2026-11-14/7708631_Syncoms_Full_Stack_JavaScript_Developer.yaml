description: |
  Company Description

  COMPANY:

  At Printerpix, no day is the same. We are at the epicentre
  of the $600 Billion gifting experience. We help create
  lasting memories and see the whole world as our playground.
  We reward initiative and those that are courageous, take
  risk and live in excellence.

  If you are hungry to show the world that you are different,
  and you have the energy, passion, focus and experience to
  take on titans, then Printerpix is for you. Gifting is a
  generous and selfless act, one where only happiness for the
  recipient is achieved.

  What’s in it for you?

  Within a year of working with us, you will be
  entrepreneurial, confident in your area of expertise, be
  amongst the top of your game and the envy of your peers.
  Many of our colleagues have moved onto exceptional
  leadership positions leading innovative tech projects. Our
  people are always considered elitist in any social
  environment and represent their craft in the most
  exceptional way. We will train you in every aspect of your
  field and give you the autonomy to take risk, venture and
  create and challenge yourself. You’ll learn, grow and
  develop every day.

  We have a fun and inspiring work environment. With offices
  in Quintessential Ruislip, Opulent Moorgate, Sunny Orlando
  (Florida) and Seasoned Bangalore (India) – we provide
  exceptional opportunities to the best of our staff in all
  locations. This opportunity exists in our London UK offices.

  We have a tech oriented, relaxed and dynamic culture. In our
  games area, our teams get to engage with VR, IOT, AI, Big
  Data and other technologies that we are incubating. You’ll
  have the opportunity to work on any of these internal
  projects.

  We teach all our teams to be entrepreneurial, analytical and
  provide profound responsibilities from day one! We reward
  creativity, value ideas and reward the exceptional. The
  dynamism that is our company after all comes from our
  people.

  Job Description

  CANDIDATE PROFILE:

  We are looking for leaders with a passion for success,
  experts who are masters of their craft. Individuals with a
  desire to be excellent with an unyielding attitude. People
  who welcome new and more demanding challenges each and every
  single day. A dynamic, young and “hungry to learn” spirit
  exists, coupled with a positive, unstoppable, winning
  attitude.

  We are looking for a full stack JavaScript developer to work
  with our team of developers to develop, create, code and
  connect front-end logic and behaviour with backend services.

  Technical Skills:

  · Over 3 years’ experience coding in JavaScript with
  experience with JQuery |Knockout.js | Angular.js |Node.js
  (Ideally 5+ years)

  - Some DB knowledge of MongoDB
  - Microsoft Azure Knowledge or Cloud deployment knowledge is
    favourable
  - Front-end knowledge in areas including: HTML 5 | CSS3
  - Knowledge of Algorithms, object oriented programming
  - Some knowledge of React.js
  - Some working knowledge of SQL Server 2012 DB

  · UX /UI Principles desirable

  · Knowledge of good coding practices and standards

  · Proficient understanding of cross-browser compatibility
  issues and ways to work around such issues

  · Good understanding of browser rendering behavior and
  performance

  · E-commerce background preferred

  · Microsoft Certification is desirable

  · REST or Web Services experience desirable

  The role is primarily responsible for building
  personalisation tools using JavaScript libraries.

  Languages / Libraries: JavaScript | Augular.js | Node.js |
  HTML 5

  Bootstrap | Ajax | REST | JSON

  API’s: Various Web Services

  Cloud: Amazon S3 / EC2 & Microsoft Azure

  Frameworks: MVC

  DB’s: Ms SQL Server 2012 /MongoDb

  Testing: Jasmine

  Tools: Jira, Git and GitHub, Bitbucket, Stack Overflow,
  Visual Studio Team

  Practices: Agile Software Development, Scrum

  Responsibilities: -

  - Develop new user-facing features
  - Build reusable code and libraries for future use
  - Optimize applications for maximum speed and scalability

  What you'll be doing:

  Focusing on building, enhancing our browser based Java
  Script applications, which helps us to create, customise and
  produce personalised photo gifts. This role includes
  interacting with the front end and server side. Working on
  both Azure and AWS. Also, involves working with MongoDb as
  the backend database. Backend frameworks include ASP.Net and
  Node.JS.

  · Gain experience working in ecommerce, m-commerce, cloud
  architecture and train to become a JavaScript Ninja.

  · You’ll have an opportunity to work on innovative VR, IOT
  and AI Projects.



  Personal Skills Essential

  · The ability to present complex technical topics to a non-
  technical audience.

  · Experience and a willingness to work in a fast-paced Agile
  software development environment.

  · Demonstrates self-motivation, ability to learn quickly and
  to apply learnings to solutions.

  · Proven track record of being able to solve complex
  problems independently and to seek out and generate
  innovative solutions.

  · Bachelor’s degree of higher in Computer Science or
  Engineering Background – Preferred Self-taught also welcome.

  Desired Personal Skills

  · A high degree of coachability, flexibility and dynamism.

  · A problem solver, which is challenged and driven by
  intricate problems

  · Creative and Innovative mindset.

  · A risk taker, wanting to break out and be heard. Someone
  who always stands out from the crowd.

  · Strategic Thinker, always looking years ahead and focusing
  on a bigger game

  · Someone who wants to make a difference and wants to
  contribute to the transformation of life. A value giver and
  a generous Human Being.

  · A team player who wants to be part of a global company
  comprising over 300 global staff - working collaboratively
  to transform life.

  · A fast-paced individual who is keen to learn and hungry to
  contribute.

  · Analytical, energetic and passionate every day - driven by
  challenges and outcomes.

  · Opportunistic and competitive yet always emphatic to the
  needs of others.

  Additional Information

  About our Global Companies:

  Printerpix is part of a group of companies representing
  several eCommerce brands spanning USA and Europe. Our other
  international brands include Printerinks, Print Express and
  Clickinks. Our passion for technology has allowed us to take
  the eCommerce, photo-gifting, and print management markets
  by storm. We come to work to have fun and exert high energy
  and ambition each day, experimenting, being dynamic and
  fuelling our start-up culture.

  As a challenger brand, we act different and think different.
  Our success is driven by a collaborative culture that allows
  us to learn, take risks and try new things. We seek out
  innovative, creative people who desire to make an impact,
  belong, achieve and connect.
