description: |
  What Relocity is Doing

  Relocity is reimagining the global mobility experience. We
  enable enterprises to attract, retain, and engage talent
  globally. Powered by our AI-driven workforce mobility
  platform, we bring together local experts and insightful
  content in our native mobile app to deliver an excellent
  user experience for people on the move. Our core values
  drive us to focus on our customers, innovation, integrity,
  and excellence. Relocity serves hundreds of cities in more
  than 40 markets across the United States, Europe, Asia, and
  Australia. Learn more at www.relocity.com.

  What You’ll Do…

  As a remote Full-Stack Senior Software Engineer, you will
  report to the Engineering Manager and help continue to
  expand the Relocity Platform, which intelligently
  streamlines, enriches, and transforms the curated 'Personal
  Host' experience through a collection of applications and
  services.

  The ideal candidate should be a Laravel expert and Vue.js
  enthusiast who enjoys designing and building high-quality
  applications. Beyond strong technical expertise, you should
  bring a product-oriented mindset and curiosity about how AI
  can accelerate the way exceptional software is built. You’ll
  thrive here if you enjoy solving complex problems,
  collaborating across disciplines, and thinking beyond the
  immediate technical requirement to understand the user
  experience and business outcome behind what you’re building.

  How You’ll Do It…

  The scope of work may include but is not limited to the
  following:

  - Help develop and expand exceptional frontend and backend
    applications
  - Contribute to all aspects of the software process, including
    architecture, specification reviews, testing,
    implementation, code reviews, debugging, and documentation
  - Leverage modern AI tools and workflows to accelerate
    development, prototyping, and problem-solving while
    applying strong engineering fundamentals and judgment
  - Take ownership of complex technical problems and projects,
    working autonomously while collaborating closely with
    Engineering, Product, and Design
  - Bring a product and user-experience lens to development,
    considering not only how something should be built, but
    why it is being built and how it can create the best
    possible experience
  - Responsible for software testing (PHPUnit, Unit, E2E)
  - Work with the team to implement core features across our
    customers’ experiences
  - Analyze and troubleshoot complex problems in a timely and
    accurate manner

  What Past Experience and Current Skills Will Enable Your
  Success In This Role?

  - BS/MS degree or equivalent in Computer Science or equivalent
    work experience
  - Minimum 4 years experience working as a Laravel/PHP
    Developer
  - 3+ years of full-stack development experience using Laravel
    11.x+ framework and Vue.js 3.x (or other js, e.g. Angular
    or React)
  - ML/AI experience preferred; comfort leveraging AI-enabled
    development tools and workflows strongly valued
  - Strong understanding of core software engineering
    fundamentals, architecture, object-oriented programming,
    and database design and optimization
  - Strong REST API development experience
  - Familiarity with database technology such as MySQL
  - Hands-on experience with Docker and CI/CD pipelines in a
    collaborative engineering environment
  - Advanced knowledge in HTML, CSS, JavaScript
  - Strong critical thinking and problem-solving skills, with
    the ability to independently own complex work from problem
    through solution
  - Collaborative, product-minded approach with an interest in
    understanding user needs and business outcomes
  - Excellent verbal communication skills
  - Attention to pixel-perfect detail
  - Prior experience working in a startup or fast-moving, highly
    collaborative environment preferred
  - Prior experience working remotely preferred
  - Candidates must be authorized to work in the U.S. without
    sponsorship

  How We Support You and Work Life Balance…

  - Competitive Compensation
  - Paid Time Off
  - Paid Parental Leave
  - Remote Workplace
  - Flexible Work Schedules
  - Health, Dental, Vision, LTD Insurance
  - 401(k)

  Pay Range: $140,000-$160,000 + Bonus

  Relocity is an Equal Opportunity Employer and does not
  discriminate against any applicant on the basis of race,
  color, religion/creed, national origin, gender, or sex,
  marital status, age, disability, use of a guide dog or
  service animal, sexual orientation, military/veteran status,
  or any other status protected by Federal or State law or
  local ordinance. Relocity will only employ those who are
  legally authorized to work. Any offer of employment is
  conditioned on the successful completion of a background
  investigation, credit check and drug test.

