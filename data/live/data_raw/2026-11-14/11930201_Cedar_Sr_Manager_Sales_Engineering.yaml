description: |
  Our healthcare system is the leading cause of personal
  bankruptcy in the U.S. Every year, over 50 million Americans
  suffer adverse financial consequences as a result of seeking
  care, from lower credit scores to garnished wages. The
  challenge is only getting worse, as high deductible health
  plans are the fastest growing plan design in the U.S.

  Cedar’s mission is to leverage data science, smart product
  design and personalization to make healthcare more
  affordable and accessible. Today, healthcare providers still
  engage with its consumers in a “one-size-fits-all” approach;
  and Cedar is excited to leverage consumer best practices to
  deliver a superior experience.

  The Role

  The Senior Manager, Sales Engineering primary goal is to
  support Cedar’s sales teams during sales and upselling
  processes by educating and engaging prospective and current
  clients on topics including revenue cycle optimization,
  patient experience, financial ROI, product workflows, and
  technology details. The Senior Manager, Sales Engineering
  will report to the VP, Sales Engineering, and work with
  internal and external partners to deeply understand our
  prospective and current clients’ specific problems to
  collaboratively drive Cedar’s business growth.

  Our ideal candidate has the client-facing experience to
  drive the adoption of Cedar’s product and workflows in the
  marketplace, in addition to consulting, technology and
  healthcare experience. This is a role that requires high
  throughput and strong client-facing capabilities. Given our
  expanding client base, the ideal candidate must be
  comfortable operating independently in a fast-paced
  environment.

  Responsibilities

  - Work cross-functionally to support sales efforts with
    responsibilities including but not limited to ROI data
    collection and narrative crafting, discussing
    implementation and integration requirements, demoing
    products to show Cedar value, supporting RFPs, etc
  - Support processes for scaling commercialization of Cedar
    with product, marketing, commercial, and delivery teams.
    This includes but is not limited to positioning,
    messaging, material development, and support of strategic
    partnerships with vendors
  - Develop deep knowledge of Cedar’s product features,
    implementation methods and is able to tailor explanations
    based on provider type / EHR / strategic objectives
  - Develop subject matter expertise of Cedar’s core value
    proposition and competitive landscape
  - Own Sales Engineering activities end to end on deals from
    discovery to close
  - Build strong relationships with peers on the sales team to
    partner on opportunities
  - Participate on continuous improvement projects to improve
    the team’s productivity, efficiency and messaging
  - Exemplify Cedar’s values of focusing on our vision, using
    good judgment, applying a growth mindset, and rejecting
    mediocrity
  - Ability to travel domestically 10%-20%

  Required Skills & Experience

  - Client-facing experience and credibility with client
    counterparts
  - 6+ years of work experience as a sales engineer, solution
    engineer or solution consultant
  - Excellent listening and presentation skills (verbal and
    written) with the ability to translate data and insights
    into compelling, executive-facing narratives demonstrating
    Cedar’s value
  - Creative and resilient problem-solver; able to proactively
    anticipate and mitigate risks
  - An analytical attitude, extremely strong attention to
    detail, and passion for problem solving
  - Demonstrates a self-starter mentality and ability to thrive
    in an entrepreneurial environment
  - Excellence with Excel and Powerpoint (or Google Sheets and
    Slides)

  Preferred Skills & Experience

  - Healthcare and/or technology experience with Epic, Athena,
    Cerner or other EHR’s
  - Understanding of API’s and data integration methods
  - Prior experience in client management or sales (e.g.,
    management consulting, investment banking)

  Compensation Range and Benefits

  - Salary Range* in CA, NY, NJ, CT, WA: $115,600 - $136,000
  - Salary Range* NOT in CA, NY, NJ, CT, WA: $104,040 - 122,400
  - This role has a variable component of up to 25% of the base
    salary
  - This role is also equity eligible
  - This role offers a competitive benefits and wellness package

  *Subject to location, experience, and education

  #LI-REMOTE

  What do we offer to the ideal candidate?

  - A chance to improve the U.S. healthcare system at a high-
    growth company! Our leading healthcare financial platform
    is scaling rapidly, helping millions of patients per year
  - Unless stated otherwise, most roles have flexibility to work
    from home or in the office, depending on what works best
    for you
  - For exempt employees: Unlimited PTO for vacation, sick and
    mental health days–we encourage everyone to take at least
    20 days of vacation per year to ensure dedicated time to
    spend with loved ones, explore, rest and recharge
  - 16 weeks paid parental leave with health benefits for all
    parents, plus flexible re-entry schedules for returning to
    work
  - Diversity initiatives that encourage Cedarians to bring
    their whole selves to work, including three employee
    resource groups: be@cedar (for BIPOC-identifying Cedarians
    and their allies), Pridecones (for LGBTQIA+ Cedarians and
    their allies) and Cedar Women+ (for female-identifying
    Cedarians)
  - Competitive pay, equity (for qualifying roles), and health
    benefits, including fertility & adoption assistance, that
    start on the first of the month following your start date
    (or on your start date if your start date coincides with
    the first of the month)
  - Cedar matches 100% of your 401(k) contributions, up to 3% of
    your annual compensation
  - Access to hands-on mentorship, employee and management
    coaching, and a team discretionary budget for learning and
    development resources to help you grow both professionally
    and personally

  About us

  Cedar was co-founded by Florian Otto and Arel Lidow in 2016
  after a negative medical billing experience inspired them to
  help improve our healthcare system. With a commitment to
  solving billing and patient experience issues, Cedar has
  become a leading healthcare technology company fueled by
  remarkable growth. "Over the past several years, we've
  raised more than $350 million in funding & have the active
  support of Thrive and Andreessen Horowitz (a16z).

  As of November 2024, Cedar is engaging with 26 million
  patients annually and is on target to process $3.5 billion
  in patient payments annually. Cedar partners with more than
  55 leading healthcare providers and payers including
  Highmark Inc., Allegheny Health Network, Novant Health,
  Allina Health and Providence.
