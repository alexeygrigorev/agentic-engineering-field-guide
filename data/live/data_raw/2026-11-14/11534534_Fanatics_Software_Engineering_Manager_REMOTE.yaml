description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  Overview:

  As an Engineering Manager at Fanatics, you will be a
  technical leader with the ability to grow and scale
  engineering teams that can deliver business results and ship
  high-quality software for  customer-facing products and
  internal platforms.

  We own the Fanatics App, the mobile app at  Fanatics that
  encompasses elements from  all of our different brands and
  businesses. The Fanatics App brings together Free to Play
  games, live events, ecommerce, and new product experiences
  to deliver a best-in-class  Sports platform. Fundamentally,
  we are one team in everything we do, from the user
  experience to coding and architecture. We aim to deliver on
  our Customer Promise by delighting our millions of monthly
  active users.

  Responsibilities:

  - Provide leadership and technical expertise within your
    engineering vertical
  - Build and lead one or more teams that will deliver software
    while adhering (and contributing) to engineering best
    practices
  - Clarify technical requirements, negotiate priorities, and
    manage projects to deliver on time by leading daily scrum
    activities
  - Clears or escalates blockers to accelerate progress of
    delivery
  - Work closely with your product and design partners to create
    an ambitious, yet achievable roadmap that can be
    communicated to executives and stakeholders
  - Drive reliable and predictable team execution by setting
    clear objectives, using data and KPIs to drive
    transparency, and champion continuous improvement across
    engineering practices and systems
  - Provide clear updates (KPIs, status, metrics) to an
    executive audience and key stakeholders
  - Determine where to simplify, optimize, or extend solutions
    for the best outcomes
  - Help to recruit, assess and onboard a diverse group of
    talented engineers
  - Must be open to occasional travel to Fanatics offices and
    other locations for conferences, events, meetings, and
    team-building activities

  Required Qualifications:

  - 1+ years of experience managing an engineering team
  - 4+ years of experience building highly scalable and fault
    tolerant systems
  - You have knowledge of a broad range of design approaches and
    can deconstruct an architecture to be developed by
    different teams
  - Able to scope a project and with targeted dates to ensure
    they meet business needs
  - Knows how to discern which features are essential, can be
    triaged, or omitted and works to negotiate with Product
    Management
  - Able to effectively communicate complex technical subjects
    to a variety of audiences (engineers, technical leaders,
    marketing and operations teams, non-technical functional
    leaders)
  - Familiar with Agile software product delivery and SCRUM
    methodology
  - Excellent analytical and problem solving skills
  - Solid report writing skills with the ability to gather,
    evaluate and analyze relevant information while
    structuring material in a logical and coherent manner.
  - Thrives in an entrepreneurial, hyper-growth environment
    where priorities evolve regularly and decisions are made
    quickly
  - Team-first mentality, with a willingness to do what it takes
    to get the job done and a desire to strive for better
  - Able to effectively work cross-functionally within an
    enterprise environment

  Preferred Qualifications:

  - Experience working in a start-up environment
  - Strong mobile software engineering background
  - Experience working with Kotlin Multiplatform and/or Compose
    Multiplatform

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  #LI-AC2

