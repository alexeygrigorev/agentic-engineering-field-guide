description: |
  ABOUT US:

  LSEG (London Stock Exchange Group) is more than a
  diversified global financial markets infrastructure and data
  business. We are dedicated, open-access partners with a
  dedication to excellence in delivering the services our
  customers expect from us. With extensive experience, deep
  knowledge and worldwide presence across financial markets,
  we enable businesses and economies around the world to fund
  innovation, manage risk and create jobs. It’s how we’ve
  contributed to supporting the financial stability and growth
  of communities and economies globally for more than 300
  years. Through a comprehensive suite of trusted financial
  market infrastructure services – and our open-access model –
  we provide the flexibility, stability and trust that enable
  our customers to pursue their ambitions with confidence and
  clarity.

  LSEG is headquartered in the United Kingdom, with
  significant operations in 70 countries across EMEA, North
  America, Latin America and Asia Pacific. We employ 25,000
  people globally, more than half located in Asia Pacific.
  LSEG’s ticker symbol is LSEG.

  OUR PEOPLE:

  People are at the heart of what we do and drive the success
  of our business. Our culture of connecting, creating
  opportunity and delivering excellence shape how we think,
  how we do things and how we help our people fulfil their
  potential. We embrace diversity and actively seek to attract
  individuals with unique backgrounds and perspectives. We
  break down barriers and encourage teamwork, enabling
  innovation and rapid development of solutions that make a
  difference. Our workplace generates an enriching and
  rewarding experience for our people and customers alike. Our
  vision is to build an inclusive culture in which everyone
  feels encouraged to fulfil their potential.

  We know that real personal growth cannot be achieved by
  simply climbing a career ladder – which is why we encourage
  and enable a wealth of avenues and interesting opportunities
  for everyone to broaden and deepen their skills and
  expertise. As a global organisation spanning 70 countries
  and one rooted in a culture of growth, opportunity,
  diversity and innovation, LSEG is a place where everyone can
  grow, develop and fulfil your potential with meaningful
  careers.

  ROLE SUMMARY:

  We are looking for a Development Manager to lead the
  Software Development and Quality Engineering teams
  responsible for our FX Exchange applications across FX Spot,
  Swaps and NDF. You will have overall accountability for the
  people, technology, delivery and quality of the product
  area.

  You will work closely with Product to shape the roadmap,
  assess technical feasibility and turn business and customer
  priorities into secure, resilient and scalable solutions.
  This is a senior People Leader role that requires technical
  credibility. You will guide architecture and key engineering
  decisions while enabling teams to own detailed design,
  development, testing and production support. You will also
  build an inclusive environment where engineers can grow,
  collaborate and deliver their best work.

  WHAT YOU'LL BE DOING:

  Lead the engineering organisation

  Lead Software Development and Quality Engineering teams with
  shared accountability for delivery and product quality.

  - Lead Software Development and Quality Engineering teams with
    shared accountability for delivery and product quality.
  - Set clear technical direction, engineering standards and
    delivery expectations.
  - Coach engineers, support career development and build future
    technical and people leaders.
  - Plan the skills, capacity, hiring and organisational
    structure needed to deliver the product roadmap.
  - Create an inclusive environment that values different
    perspectives, open communication and continuous learning.
  - Lead distributed teams and work effectively with external
    technology partners.

  Partner with Product

  - Share accountability with Product for translating business
    strategy, customer needs and market opportunities into an
    achievable product roadmap.
  - Assess technical feasibility, dependencies, delivery options
    and engineering investment before roadmap commitments are
    made.
  - Balance functional delivery with resilience, security,
    regulatory obligations, technical debt and platform
    modernisation.
  - Provide clear estimates, delivery choices and trade-offs so
    Product can make informed priority decisions.
  - Use customer, operational and engineering data to measure
    outcomes and guide future investment.

  Own engineering delivery and quality

  - Be accountable for delivery from requirements and design
    through development, testing, deployment and production
    operation.
  - Establish a modern software development lifecycle based on
    automation, continuous integration and delivery, peer
    review, continuous testing, security, observability and
    operational readiness.
  - Make quality a shared responsibility across Development and
    Quality Engineering.
  - Lead functional, integration, performance, resilience and
    security testing for business-critical trading services.
  - Improve release confidence by automating repeatable checks,
    reducing manual hand-offs and addressing defects earlier.
  - Ensure technical debt, engineering risks and dependencies
    are visible, prioritised and managed.

  Provide technical leadership

  - Guide architecture and design for high-volume, low-latency
    and highly available trading systems.
  - Ensure solutions are scalable, secure, observable,
    supportable and aligned with the wider FX technology
    strategy.
  - Lead technical reviews and challenge designs constructively,
    while enabling teams to own implementation decisions.
  - Drive modernisation of legacy platforms, including
    modularisation, simplification and the adoption of
    reusable engineering patterns.
  - Maintain a strong understanding of Java, C++, Linux, event-
    driven architectures, distributed systems, messaging and
    performance engineering.
  - Lead the response to complex production issues and ensure
    learning is converted into lasting improvements.

  Embed AI and automation across engineering

  - Set expectations for responsible use of AI throughout the
    software development lifecycle, from requirements and
    design to coding, testing, documentation and production
    support.
  - Encourage teams to create and reuse AI skills and agents
    that automate repeatable engineering activities.
  - Use AI-assisted analysis and automation to improve quality,
    delivery speed and developer experience while protecting
    security, data and intellectual property.
  - Measure adoption and outcomes, share effective patterns and
    ensure appropriate human review and governance.

  Measure and improve performance

  - Define meaningful measures for delivery flow, quality,
    reliability and engineering effectiveness.
  - Use measures such as lead time, deployment frequency, change
    failure rate, recovery time, escaped defects, automation
    coverage, service availability and performance trends to
    identify improvements.
  - Build a culture of evidence-based decisions, experimentation
    and continuous learning rather than using metrics as
    individual performance targets.

  WHAT YOU'LL BRING:

  - Experience leading Software Development and Quality
    Engineering teams responsible for business-critical
    products.
  - Technical leadership experience in high-volume, low-latency
    or distributed systems, preferably within electronic
    trading or financial markets.
  - Depth in modern software architecture, Java engineering and
    performance optimisation, with a working understanding of
    C++ and Linux environments.
  - Experience leading large-scale technology transformation,
    modernising legacy platforms and improving engineering
    practices while sustaining live services.
  - Experience partnering with Product to shape roadmaps,
    evaluate options, prioritise investment and deliver
    customer and business outcomes.
  - Experience establishing modern SDLC, automated testing,
    CI/CD, secure engineering, observability and operational
    readiness practices.
  - Practical experience applying AI-assisted engineering,
    reusable skills or agents across requirements, development
    and testing.
  - Experience using engineering and operational measures to
    improve delivery, quality and service reliability.
  - Knowledge of FX Spot, Swaps or NDF, matching engines, FIX or
    comparable electronic trading platforms.
  - Ability to communicate clearly, influence senior
    stakeholders and lead teams through ambiguity and change.

  WHY JOIN US:

  You will lead a product area at the heart of global
  financial markets and help shape the next generation of FX
  trading technology. You will have the opportunity to develop
  people, influence product and technical direction, and
  improve how software is designed, built, tested and
  operated.

  We believe different perspectives strengthen our decisions
  and help us innovate. You will join an environment that
  values collaboration, learning, responsible experimentation
  and meaningful engineering outcomes.

  Career Stage:

  Manager

