  Senior RUST Developer / Senior Software Engineer - Platform
  (Remote USA)

  ***US Citizenship or Greencard is required due to US
  Government contract requirements***

  ***This role requires RUST programming language
  experience***

  Job Summary:

  As a Senior Software Engineer, you will play a key role in
  developing and maintaining the core infrastructure that
  underpins our AI platform. Your expertise in coding and
  architecture will be instrumental in building out core
  platform features, while your proficiency in Rust will
  enable you to contribute to the growth of our technology
  stack. Your experience with production support, Kubernetes,
  and Docker will ensure the platform's stability and
  reliability.

  Responsibilities:

  - Design and develop foundational components and frameworks
    that serve as the building blocks for our Agentic AI
    platform.
  - Collaborate with cross-functional teams to understand their
    needs and requirements, and create platform solutions that
    empower developers to build innovative applications on top
    of it.
  - Cultivate a growth mindset, constantly studying and staying
    current with design patterns, techniques, and technologies
    that attract developers to platforms and frameworks.
  - Work closely with machine learning engineers to build the
    infrastructure that supports ML workflows, ensuring
    seamless and efficient execution within enterprises.
  - Provide production support and troubleshooting expertise to
    ensure the platform's smooth operation and address any
    performance or scalability challenges.

  Required Skills and Qualifications:

  - US Citizenship or Greencard is required due to US Government
    contract requirements
  - Bachelor's degree in Computer Science, Software Engineering,
    or a related field or equivalent experience.
  - 5–8+ years of software and platform engineering experience,
    with a strong track record of designing and operating
    large-scale distributed systems.
  - Experience building platform infrastructure and backend
    systems that serve multiple products and engineering
    teams.
  - Experience in Rust, with expertise in designing and
    developing high-performance systems. All our performance-
    critical areas are developed in Rust.
  - Demonstrated expertise in database architecture and scalable
    data systems, including distributed databases, storage and
    indexing systems, data modeling and schema design, high-
    throughput and low-latency data access patterns.
  - Experience designing systems that support AI and machine
    learning workloads
  - Familiarity in workflow engines, execution runtimes, and AI
    orchestration frameworks
  - Growth mindset and low ego- you’re eager to pick up new
    tools and technologies, learn from others, and be open to
    changing course when it’s right.
  - Drive to foster a culture of collaboration, psychological
    safety, and technical excellence.
  - Strong advocate for inclusion in technical discussions at
    all levels.

  Preferred Qualifications:

  - Start-up experience or comfort in 0→1 product environments.
  - Familiarity with Kubernetes is a plus.
  - Understanding of DevOps practices and CI/CD pipelines for
    platform deployment.

  Compensation Information

  $170,000—$200,000 USD

