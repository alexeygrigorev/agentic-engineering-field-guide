description: |
  Software Engineer (Application Engineer or Cloud Engineer)

  Contributes significantly to the design, development,
  testing and operation of software systems, using AI-assisted
  and agentic engineering approaches where they improve
  delivery. This is a professional role for an experienced
  software engineer who can translate requirements into well-
  designed solutions, produce and review implementation work,
  and take responsibility for software quality.

  Location: United Kingdom (Hybrid – Winchester or London
  office 1–2 times a week)

  We offer:

  - Salary 41,600 to 62,400 dependent on experience
  - 6% pension contribution
  - Private Medical Insurance
  - 25 days annual leave
  - Access to flexible benefits including discounts on major
    brands, wellness programmes, gymflex, travel and dental
    insurance
  - A flexible and hybrid working culture

  Overview:

  Designs, builds, tests and supports secure, reliable
  software solutions as part of a cross-functional engineering
  team.

  This role uses modern software engineering practices,
  including AI coding assistants and agentic development
  tools, to accelerate delivery while maintaining strong human
  ownership of requirements, solution design, security,
  testing, quality and operational outcomes.

  We are looking for engineers who can translate business
  requirements into effective technical solutions, leverage
  AI-assisted development responsibly, and ensure that all
  delivered software meets high standards of quality,
  maintainability and reliability.

  We are recruiting for Full-Stack developers and DevOps/Cloud
  Engineering specialisms.

  Accountabilities:

  - Collaborate with stakeholders to define requirements,
    acceptance criteria and technical solutions.
  - Design, develop and deliver software features, enhancements
    and defect fixes.
  - Use AI-assisted and agentic development tools responsibly to
    improve engineering productivity.
  - Review and validate AI-generated and human-written outputs
    for quality, security and maintainability.
  - Build automated tests and verify solutions meet functional
    and non-functional requirements.
  - Participate in design reviews, code reviews and technical
    problem-solving activities.
  - Create and maintain clear technical documentation and
    operational guidance.
  - Contribute to continuous improvement of engineering
    practices, tooling and ways of working.

  Required Technical Skills:

  Full-Stack and Backend Developers

  - Proficiency and experience with Python
  - Experience designing and building APIs, services and
    integrations
  - Understanding of scalable and secure backend architectures

  Full-Stack and Frontend Developers

  - Proficiency and experience with JavaScript / TypeScript
  - Experience with React, Next.js or similar modern frontend
    frameworks
  - Understanding of modern frontend architecture and user
    experience principles

  DevOps / Cloud Engineers

  - Good working knowledge of AWS and cloud engineering
    practices
  - AWS certification desirable but not essential
  - Proficiency with Infrastructure as Code, ideally Terraform
  - Experience operating secure, reliable cloud-native platforms
  - Working knowledge of Kubernetes deployments.
  - Proficiency and experience with Python

  Skills Relevant Across All Specialisms

  - Experience using AI coding assistants and agentic
    development tools to support software delivery
  - Understanding of the strengths, limitations and risks of AI-
    generated code and artefacts
  - Experience validating software against requirements through
    automated and manual testing approaches
  - Understanding of CI/CD pipelines, Git-based workflows and
    Agile delivery practices
  - Familiarity with cloud-native development and modern
    software delivery practices
  - Knowledge of software security, observability and
    operational best practices

  Other Key Skills:

  - Strong software engineering fundamentals and problem-solving
    ability
  - Ability to analyse requirements and contribute to solution
    design
  - Critical thinking and sound engineering judgement when
    reviewing AI-generated outputs
  - Strong debugging and troubleshooting skills
  - Effective communication and collaboration within cross-
    functional teams
  - Ability to balance delivery speed with quality, security and
    maintainability
  - Experience working across the full software development
    lifecycle
  - Proven ability to deliver quality software solutions in a
    professional environment
  - Experience working within product, platform or engineering
    teams
  - Commitment to continuous learning and professional
    development

  Qualifications:

  - Degree in Computer Science or a related field, or equivalent
    industry experience

  Why Arqiva:

  We enable a switched-on world to flow. As the UK’s leader in
  TV and radio broadcast and the country’s top smart utilities
  platform, we are shaping the future of connectivity.

  Our infrastructure delivers media and data exactly where
  they’re needed - whether that’s bringing TV and radio to
  your home or sending smart meter data to your utility
  provider. Our technology works quietly behind the scenes,
  connecting millions every day.

  But it’s not just what we do, it’s how we do it. At Arqiva,
  you’ll find real connection: supportive teams, active
  colleague networks and plenty of ways to get involved and
  feel part of our community. We’ll give you the space and
  support to grow - whether that’s developing your skills,
  trying something new or taking on fresh challenges. And
  because there is more to life than work, our rewards and
  benefits are designed to support your wellbeing, your
  lifestyle and what matters most to you.

  Our commitment to Diversity & Inclusion

  At Arqiva, we’re committed to building a workplace where
  everyone feels valued, heard and empowered to succeed. We
  welcome applications from all backgrounds and experiences,
  and we work hard to remove barriers so every colleague can
  thrive. If you need any adjustments at any stage of the
  recruitment process, please reach out to talent@arqiva.com.

  If this sounds like the right next step for you, we’d love
  to hear from you!

