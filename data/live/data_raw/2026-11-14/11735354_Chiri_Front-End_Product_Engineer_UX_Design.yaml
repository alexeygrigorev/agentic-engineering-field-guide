description: |
  About Chiri

  Chiri collapses fragmented software into one governed
  operating layer for mid-sized businesses: companies with
  valuable workflows and real urgency, but no internal AI
  organization to take a use case to production.We combine our
  platform with forward-deployed expertise to connect
  customers' existing systems, build what they need, and
  operate it in production.Increasingly, buyers are asking
  ChatGPT, Perplexity, Gemini, Claude, and other AI systems
  what they should use. Chiri must be one of their top
  answers.

  Role Overview

  Chiri is building a governed AI operating system that
  connects human and digital workforces. Our platform, Chiri
  Brain, provides the underlying infrastructure for AI agents,
  integrations, security, governance, and business workflows.

  Now we're focused on making that power accessible through
  exceptional user experiences.

  We're looking for a Front-End Engineer with strong UX and
  visual design capabilities who can turn sophisticated AI
  technology into intuitive, beautiful, and highly functional
  applications.

  This is a hands-on engineering role for someone who thinks
  like a product designer. You'll help build Chiri Brain's
  user experience and create customizable front ends for our
  clients, ultimately enabling businesses to deploy tailored
  AI-powered applications without rebuilding the underlying
  technology.

  We want someone who can move fluidly from understanding a
  customer's needs to designing, prototyping, and shipping a
  working solution.

  Key Responsibilities

  - Build exceptional user experiences. Design and develop
    modern, polished, responsive interfaces that make
    sophisticated AI capabilities easy for everyday business
    users.
  - Own front-end design and development. Translate user needs
    into workflows, wireframes, interactive prototypes, and
    production-ready applications. You'll design the
    experience and write the code.
  - Create customizable interfaces. Help develop reusable
    components, templates, design systems, and configuration
    capabilities so different customers can tailor their
    interfaces while using the same Chiri Brain foundation.
  - Work directly with customers. Understand how people work,
    rapidly prototype solutions, gather feedback, and refine
    the experience without lengthy traditional development
    cycles.
  - Connect front ends to powerful back ends. Integrate
    interfaces with APIs, business data, agent workflows, and
    Chiri Brain's underlying security and governance
    capabilities.
  - Use AI to accelerate development. Leverage modern AI-
    assisted design and coding tools to deliver high-quality
    applications significantly faster than traditional
    approaches.
  - Help shape the product. Collaborate with engineering and
    company leadership to establish scalable patterns for
    delivering both Chiri's core product and client-specific
    applications.

  Required Skills and Experience

  - Strong professional experience building production web
    applications using React, TypeScript/JavaScript, and
    modern frameworks such as Next.js.
  - Demonstrated expertise in UX/UI design, including user
    flows, interaction design, visual hierarchy, responsive
    layouts, and usability.
  - Ability to create high-quality designs and prototypes using
    Figma or equivalent tools, and independently translate
    those designs into working software.
  - Strong command of HTML, CSS, modern styling frameworks, and
    reusable component architecture.
  - Experience building design systems and component libraries
    that support consistent, maintainable interfaces.
  - Ability to integrate front-end applications with REST APIs,
    authentication systems, and back-end services.
  - Understanding of secure application design, permissions, and
    the needs of multi-tenant business applications.
  - Hands-on experience with AI-assisted development workflows
    and the judgment to distinguish quickly generated code
    from production-quality software.
  - Strong communication skills and the ability to work directly
    with customers and nontechnical stakeholders.
  - A portfolio demonstrating both excellent visual design and
    hands-on engineering execution.

  Strong Plus

  - Experience with Python or C#/.NET back-end development.
  - Familiarity with Azure or AWS, SQL/PostgreSQL, and cloud
    application architecture.
  - Experience with Terraform, Docker, Git, CI/CD pipelines, and
    automated testing.
  - Experience with AI applications, LLM APIs, agent-based
    workflows, and conversational interfaces.
  - Experience building highly configurable or white-label SaaS
    products.
  - Experience with generative UI, AI-powered application
    builders, or tools such as Lovable, v0, and Cursor.
  - Experience establishing front-end architecture, design
    standards, or technical direction for a growing
    engineering team.

  How you work

  - Design matters. You care deeply about how software looks,
    feels, and functions.
  - You build, not just design. You're comfortable owning the
    entire journey from customer conversation to working
    application.
  - Move fast, iterate faster. You use AI and modern tools to
    accelerate delivery without sacrificing quality.
  - Think in systems. You look for reusable solutions rather
    than rebuilding the same functionality for every customer.
  - Customer-focused. You can translate business needs into
    simple, intuitive experiences without forcing users to
    become technical experts.
  - Ownership mentality. You thrive in a startup environment,
    take initiative, communicate clearly, and deliver results.

  To apply

  Show us what you've actually built.

  We're particularly interested in examples where you
  personally designed and engineered a polished application,
  improved an existing user experience, or turned complicated
  technology into something simple and intuitive.

  Include links to live products, portfolio examples, or
  relevant code, and explain what you personally owned.

  Our SCOUT Values

  Our values are not wall art. They describe how we expect
  people to operate.

  Seek to Understand

  Assume you might be wrong. Clarity before action.

  Call It Out

  See something, say something. Say the hard thing.

  Ownership Mentality

  "That's not my job" does not exist.

  Use Human Judgment

  Judgment, context, and care come from us. AI is a tool.

  Talk with Precision

  Concise. Intentional.
