description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  The  CrowdStrike Cloud Detection Engine (CDE) team is
  building a powerful, next-generation platform designed to be
  a force multiplier for security teams. Our platform empowers
  customers who leverage multiple Falcon products to create
  and manage advanced, unified detections and content. This
  core platform capability is a strategic imperative for
  CrowdStrike, aiming to provide a competitive advantage that
  is difficult to replicate, ensuring our customers have
  unparalleled detection and response capabilities across the
  entire Falcon ecosystem.

  We build the real-time data systems behind CrowdStrike's
  detection pipeline. Our team owns the streaming engine that
  processes all first-party sensor telemetry and maintains a
  petabyte-scale graph of real-time system activity, and the
  distributed correlation  engine that evaluates trillions of
  events a day to catch multi-stage attacks that no single
  event can surface. Both systems are at the core of how
  CrowdStrike finds adversaries.

  We're looking for someone who is excited about working in
  systems programming: custom query languages, graph
  databases, state machines, performance work where
  microseconds matter. We ship fast, we build with modern
  tooling including AI in our dev workflow, and own everything
  end to end from design to production

  This role is hybrid, requiring 2-3 days per week on-site at
  the posted location.

  About the Role: We are seeking a Senior Engineer II to  join
  the CDE Platform team. In this role, you will be
  instrumental in designing, building, and scaling the
  foundational services that orchestrate data, content, and
  execution logic across CrowdStrike’s products (e.g., NGSIEM,
  FCS, Endpoint). You will be a key driver in creating a
  highly performant, scalable, and resilient platform that
  processes internet-scale data streams and enables real-time
  detection generation.

  What You'll Do:

  - Lead backend engineering efforts from rapid prototypes to
    large-scale applications across CrowdStrike products
  - Leverage and build cloud-based systems to detect targeted
    attacks and automate cyber threat intelligence production
    at a global scale
  - Brainstorm, define and build collaboratively with members
    across multiple teams
  - Obsess about learning, and champion the newest technologies
    & tricks with others, raising the technical IQ of the team
  - Be mentored and mentor other developers on web, backend, and
    data storage technologies and our system
  - Constantly re-evaluate our product to improve architecture,
    knowledge models, user experience, performance and
    stability
  - Be given the autonomy to own your work in a high trust
    environment

  The technology stack you’ll use will include:

  - Go (Golang) or C++
  - AWS/GCP/Azure/Kubernetes
  - Kafka
  - GIT
  - Cassandra
  - Docker
  - Redis

  What You'll Need:

  - Degree in Computer Science (or professional experience in
    data structures/algorithms/distributed systems)
  - Understanding scalability and distributed systems i.e.
    sharding, partitioning, concurrency, etc
  - Being a team player
  - A thorough understanding of engineering best practices from
    appropriate testing paradigms to effective peer code
    reviews and resilient architecture.
  - The ability to thrive in a fast-paced, test-driven,
    collaborative and iterative programming environment.
  - The skills to meet your commitments on time and produce
    high-quality software that is unit tested, code reviewed
    and checked in regularly for continuous integration.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Contributions to the open-source community (GitHub, Stack
    Overflow, blogging)
  - Existing exposure to Go or C++, Scala, AWS, Cassandra,
    Kafka, Elasticsearch...
  - Prior experience in the cybersecurity or intelligence field
  - Experience in thinking about, designing, or implementing
    programming languages and/or compilers
  - Interesting hobbies

  #LI-SS1

