description: |
  bunch is building the backbone of private markets. We are
  enabling next-gen fund operations with one integrated system
  that combines secure data infrastructure, AI-powered
  workflows and expert fund services. If you value ownership,
  growth through real responsibility, and working with a
  thoughtful, ambitious team, this role might be for you.

  Following our $35 million Series B in May 2026, we are
  entering our next stage of growth. We are hiring an
  Engineering Manager to help scale our product development
  team, strengthen our technical foundations, and turn complex
  private-markets problems into reliable, intuitive solutions.

  Your primary responsibilities will be ensuring our
  engineering output delivers tangible customer value, setting
  technical and architectural direction, and developing the
  people and team capacity needed to deliver sustainably. You
  will help shape the next stage of our engineering
  organisation, with a focus on Product Excellence, clear
  ownership, and sustainable engineering processes.

  Your Role

  - You will be at the core of building the technology that
    powers bunch: secure, reliable infrastructure that makes
    private-market operations simpler and more efficient.
  - You will lead a team and have full accountability for
    delivering solutions that truly solve customer problems,
    connecting engineering decisions to product outcomes.
  - You will help us scale beyond our Series B by strengthening
    our architecture, growing our engineers, and building
    delivery practices that support long-term quality rather
    than short-term output alone.

  You will:

  - Collaborate with Product Management: Actively participate in
    problem discovery and solution creation, using your
    technical expertise to shape pragmatic solutions alongside
    Product and Design.
  - Own capacity management and delivery: Take a proactive role
    in planning, make priorities and trade-offs explicit, and
    own your team's output from discovery through release and
    follow-up. Balance customer impact, delivery
    predictability, and engineering quality.
  - Drive collaboration across teams: Work closely with other
    engineering teams and cross-functional partners to manage
    dependencies and ensure smooth delivery of new features
    and improvements.
  - Manage our architecture and technical debt: Guide system
    design, scalability, performance, and maintainability
    within your team's domain and across shared systems. Make
    deliberate investment decisions that keep our platform
    ready for growth.
  - Develop sustainable engineering practices: Establish clear
    quality standards and practical ways of working that help
    the team deliver reliably without adding unnecessary
    process.
  - Support team growth: Coach engineers through regular
    feedback and development conversations. Ensure they
    understand the core problems we are solving and how their
    day-to-day work contributes to customer outcomes and their
    own growth plans.

  About you

  To excel as a member of the Product Development team, you
  should combine a passion for technology with an
  entrepreneurial mindset and strong problem-solving skills.

  - 3+ years' experience leading engineering teams, with a track
    record of developing engineers and taking accountability
    for delivery.
  - A collaborative approach, strong work ethic, and excellent
    written and verbal communication skills.
  - A product-focused mindset: you care about understanding
    customer problems and can partner with Product and Design
    to turn them into effective technical solutions.
  - Development experience with TypeScript or another strongly
    typed language.
  - Experience with SQL databases and Nest.js or similar
    web/dependency management frameworks, such as Spring Boot
    or ASP.NET core
  - A strong understanding of system design principles,
    scalability, and performance tuning, with sound judgment
    about architectural trade-offs and technical debt.
  - The ability to create structure in a growing organisation
    while keeping processes pragmatic and focused on outcomes.
  - Experience with private markets, fintech, highly regulated
    industries, or document processing is a plus.

  Our tech stack

  - Frontend & Backend: TypeScript on both the frontend (Svelte
    but moving to React) and the backend (Node.js with
    Nest.js)
  - Database: MySQL
  - Infrastructure: Kubernetes (K8S) on top of AWS

  Workplace & Benefits

  - Customizable benefits package (wellbeing, sport, mobility,
    food, and more)
  - 28 days of vacation, plus 2 company days and local public
    holidays
  - Hybrid setup for Berlin-based teammates (3 days/week in
    office)
  - Up to 6 remote calendar weeks a year
  - A great tech and work setup
  - Work with a diverse team of 120+ bunchies from 40+
    countries, with leaders who are best-in-class in their
    domains

  Hiring process

  - First interview with the People team (30 min): get
    acquainted with the bunch and to understand if what we’re
    offering is what you’re searching for
  - Hiring Manager Interview (60 min): this conversation will
    cover product-focused culture and values, including
    collaboration, ownership, self-awareness, and quality
    standards.
  - Technical Interview (60 min): System Design technical
    conversation with two engineers, we will focus on
    collaborative problem-solving, starting with open-ended
    questions and progressing to more specific challenges
  - Leadership Case Interview (60 min): this interview with
    Product and Design focuses on leadership style, cross-
    functional collaboration, and delivering strategic impact
    in a scaling environment.
  - Final Round: Meet our VP of Engineering and VP of Product
    (60 min) to learn about ways of working, vision for bunch,
    and team culture.
  - Meet-and-Greet (Optional - 30 min) to meet a few members of
    your future cross-functional team.

  About bunch

  bunch is building the operating infrastructure for the next
  generation of private markets. We combine AI-powered
  automation with deep regulatory expertise to replace
  fragmented spreadsheets and manual processes with one
  integrated platform across the fund lifecycle, purpose-built
  for private markets heading toward $32 trillion in Assets
  Under Management.

  We've 4x our ARR in 2025, crossed 150 fund managers and
  12,000 LPs on the platform, and just closed our $35M Series
  B in May 2026. We're looking for ambitious people who want
  real ownership of hard problems, and who care about building
  infrastructure that actually matters to the people using it.

  ____ At bunch, we're committed to an inclusive environment
  where diversity is valued and celebrated. We provide equal
  opportunities to all qualified applicants.

  We process personal data in line with applicable laws
  (including GDPR). See our Privacy Policy for details on your
  rights and how to reach us.
