description: |
  Headquartered in Irvine, California, EBizCharge specializes
  in developing integrated payment solutions that facilitate
  electronic payment processing within ERP, CRM, Mobile, and
  eCommerce applications. Our applications are PCI compliant
  and fully integrated with major ERP/accounting systems,
  including QuickBooks, Sage, SAP Business One, Microsoft
  Dynamics, NetSuite, Epicor, Acumatica, and major online
  shopping carts, including Magento and WooCommerce.
  EBizCharge offers its employees tremendous learning
  opportunities, career growth potential, and a dynamic work
  environment.

  We are seeking a highly skilled and experienced Senior
  Salesforce Developer to lead the design, development, and
  implementation of Salesforce solutions tailored to business
  needs. The ideal candidate will have in-depth expertise in
  Accounting Seed, Experience Cloud, Commerce Cloud, and
  Lightning Web Components (LWC). This role requires a
  strategic thinker with a strong technical background to
  drive Salesforce enhancements, optimize business processes,
  and deliver user-friendly solutions.

  Responsibilities

  Salesforce Development and Implementation

  - Design, develop, and deploy Salesforce customizations and
    applications using Lightning Web Components (LWC), Apex,
    Visualforce, and declarative tools.
  - Design and implement custom e-commerce features and scalable
    digital storefronts using Salesforce Commerce Cloud
    (Demandware) architecture, JavaScript controllers, ISML
    templates, and reusable cartridges.
  - Build scalable and secure solutions on Experience Cloud and
    Commerce Cloud platforms.
  - Implement and optimize Accounting Seed to enhance and
    streamline financial operations.
  - Integrate payment gateways to ensure smooth and secure
    transaction processes.
  - Develop and maintain CPQ (Configure, Price, Quote) solutions
    to support pricing and quoting workflows.
  - Build custom components to meet unique business
    requirements.
  - Leverage expertise in the Salesforce Marketplace to design
    and deploy apps and solutions.

  Solution Architecture

  - Collaborate with business stakeholders to gather, analyze,
    and translate requirements into technical solutions.
  - Design solutions that align with business goals, Salesforce
    best practices, and scalable architectures.
  - Ensure seamless integration between Salesforce, third-party
    systems, and internal platforms.

  Team Leadership and Collaboration

  - Mentor and support junior developers, fostering their
    technical growth and development.
  - Collaborate with cross-functional teams, including UI/UX,
    support, and project managers, to deliver end-to-end
    solutions.
  - Conduct comprehensive code reviews and ensure adherence to
    coding standards and best practices.

  Maintenance and Optimization

  - Troubleshoot and resolve technical issues within the
    Salesforce platform to maintain reliability and
    performance.
  - Regularly refactor and optimize code to improve efficiency
    and scalability.
  - Stay current with Salesforce platform updates and implement
    new features to enhance system capabilities.

  Qualifications:

  - Minimum of 5-7 years of Salesforce development experience.
  - Hands-on experience with Accounting Seed configuration and
    customization.
  - Proficiency in Experience Cloud (formerly Community Cloud)
    and Commerce Cloud implementation and Salesforce Commerce
    Cloud (Demandware).
  - Expertise in building modern, reusable components using
    Lightning Web Components (LWC).
  - Strong skills in Apex, Visualforce, SOQL, and Salesforce
    declarative tools.
  - Experience with Salesforce APIs, including REST and SOAP for
    integrations.

  Preferred Skills

  - Salesforce certifications (e.g., Salesforce Platform
    Developer I/II, Salesforce Certified Experience Cloud
    Consultant, Commerce Cloud Developer).
  - Familiarity with CI/CD tools (e.g., GIT).
  - Knowledge of Agile development methodologies.
  - Experience with JavaScript frameworks and modern front-end
    development tools.
  - Knowledge of financial applications is preferred.

  Benefits

  - Employer paid benefits (including Medical, Dental, Vision, &
    life insurance) for selected plans for the employee.
  - Retirement 401(k) plan with company match.
  - Gym access, dry cleaners, car wash conveniently located
    within building.
  - Generous PTO plan with an additional 9 Days Company Paid
    Holidays per year.

  Job Type: Full-time

