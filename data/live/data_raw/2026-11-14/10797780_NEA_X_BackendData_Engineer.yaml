description: |
  Company Description

  As a part of the NEUMAN & ESSER GROUP, NEA X comprises
  various business and engineering backgrounds with a wide-
  ranging experience in different industrial sectors. With its
  digital mindset and startup mentality, the company bridges
  the gap between traditional engineering and the digital
  future.

  The NEA XPLORE team creates industrial IoT solutions that
  gather data from machines, push to cloud-based backends for
  analysis and visualisation. This enables our customers to
  gain real-time access to the performance of their
  production, making them faster and more precise in their
  decisions.

  Job Description

  As a Backend Engineer with the NEA XPLORE team, you will
  build the algorithms and data pipelines that enable the next
  industrial revolution for our customers. Your systems will
  ensure that that a multi-billion dollar industry is able to
  detect and respond to failures efficiently and with a
  targeted approach.

  What you’ll do

  - Create scalable backend functionalities and algorithms for
    our core products in the industrial IoT sector
  - Optimize and maintain the microservice-oriented architecture
  - Team up with Frontend and Backend Engineers in creating
    scalable and maintainable software solutions
  - Embrace the whole development cycle: From architecture and
    design to implementation and testing as well as the
    maintenance of our products
  - Ensure that our tech stack stays ahead of the curve by
    familiarizing yourself with new technologies and keeping
    an eye out for upcoming trends and their applicability to
    our site

  Qualifications

  What we’re looking for

  - Experience as a Software Engineer in building modern APIs
  - Experience with serverless / Lambda architectures
  - Experience with streaming platforms & engines (Apache Kafka,
    Spark etc.)
  - Proficiency with both SQL and NoSQL database technologies
  - Comfortable in a Unix/Linux environment
  - Ability to work comfortably with backend and DevOps
    technologies (Docker, Kubernetes, nginx etc.)
  - Excellent verbal and written communication skills in German
    and English

  Additional Information

  What we’re offering

  - A unique culture with a strong sense of community and an
    agile work environment
  - The opportunity for self-driven individuals to have a direct
    impact on the business
  - The chance to develop personally and professionally due to a
    strong feedback culture as well as access to training and
    workshops
  - The freedom to embrace small-scale failures as a path to
    large-scale success
  - Competitive salary, public transport discounts, great IT
    equipment, flexible working times and additional holidays
