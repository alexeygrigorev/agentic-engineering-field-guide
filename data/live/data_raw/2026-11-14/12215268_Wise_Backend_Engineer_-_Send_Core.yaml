title: Backend Engineer - Send Core
company: Wise
location: London, GBR
work_type: FULL_TIME
company_size: 9,000 Employees
description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We’re unable to support relocation or visa sponsorship for
  this role. Candidates will need to already be based in the
  UK (or able to work from the UK).

  We are looking for a Backend Engineer to join our Send Core
  team.

  We provide the critical infrastructure that every sending
  transaction flows through - from 10 pounds sent to a friend
  to a multi-million dollar business payment. We are on a
  mission to make sending money as easy and fast as paying for
  groceries with your card.

  Apart from keeping our core infrastructure in a good shape,
  we are building customer-facing products that power the
  customer's send journey.

  How we work:

  We believe that an engineer is more than just a coder. Our
  engineers are focused on improving our customers’ experience
  - and they see the impact of their work on millions of
  people every day.

  Wise is all about collaboration. You will be surrounded by
  passionate people and work together with them to progress
  our mission.

  What will you be working on?:

  - Shape our Products: Collaborate with product, design, and
    data teams to deliver best experience for our customers
  - Control Critical Infrastructure: Own the systems that every
    sending transactions depends on across the entire platform
  - Drive Technical Excellence: Make architectural decisions for
    the core send components, making them reliant and
    performant

  What do you need?:

  We understand that you may not have much experience in our
  stack, or you haven’t worked with the frontend for a while -
  and that’s fine! As long as you are willing to learn and
  have strong fundamentals - we want to hear from you.

  Technical excellence

  - Strong computer science fundamentals
  - Strong knowledge of the modern tech stack and design
    concepts
  - Ability to communicate complex technical concepts clearly
    and simply

  Product mindset

  - Focus on solving real customer problems with every change
    you made
  - Clear understanding of why we are building what we are
    building
  - Ability to think in product terms - not just on the code
    level

  Personal qualities

  - Passion to always learn and grow
  - Getting things done yourself, instead of waiting to be told
    what to do
  - Curiosity to explore ways to improve our products and your
    day-to-day work

  Interested? Find out more:

  - How we work – a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it's like to work at Wise London!
  - Our Engineering career map
  - Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £68,000 - £87,500
  - Wise Benefits

  #LI-AB3 #LI-Hybrid

  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
