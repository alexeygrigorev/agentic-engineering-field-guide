  Back End Developer (Temporary) - remote with occasional
  travel to Motorola offices.

  The role of the Software Engineer is to work as part of an
  agile delivery team to design and develop the software
  solutions. You will work closely with the other members of
  the development team, then Product Manager, and the Software
  Test Engineers.

  You'll be developing mission critical or supporting software
  to a high standard, including design, development, technical
  documentation, and testing.

  Our backend tech stack is C#.NET.

  Basic Requirements

  We are looking for someone who

  - Has experience as a Software Developer or significant
    experience as a Junior Software Developer
  - Has experience building backend systems in C# .NET,
  - Is passionate about writing high-quality code
  - Can demonstrate good technical ability
  - Understands modern software development practices and
    principles, such as SOLID
  - Understands modern development workflows, including agile
    process, Git repositories, pull requests



  Core Competencies:

  - 3+ years of hands-on back end software development using C#
    .NET.
  - Solid understanding of OOP, design patterns and software
    engineering principles.
  - Experience writing and maintaining meaningful automated
    tests.
  - Strong verbal and written communication and collaboration
    skills.



  Academic and Technical Qualifications:

  - You must either have NPPV3 clearance, or be willing to be
    cleared to this standard, which will involve background
    checks of you and potentially your family. To apply for
    NPPV3 clearance you must have been resident in the UK for
    a minimum of 3 years.
  - A formal qualification (Degree) in Computing Science or
    equivalent experience



  Preferred skills and qualifications:

  - UK Police Control Room experience / knowledge
  - SQL Server



