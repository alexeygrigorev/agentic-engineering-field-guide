description: |
  About Sandstone

  Sandstone is on a mission to elevate in-house legal from a
  support function into a true strategic partner. From day
  one, we’ve been clear about what we are—and are not. We are
  not replacing in-house legal teams. We are building a
  platform that amplifies them.

  Our platform enables modern legal teams to move at the speed
  of AI, deliver better outcomes, and create measurable
  business value. We unify legal data, power end-to-end
  workflows, and organize business context within the tools
  teams already use. Sandstone is the home for AI-native legal
  departments.

  Today, Sandstone is trusted by Fortune 500 companies and
  fast-growing innovators alike. We ship quickly, iterate
  relentlessly, and scale with intention.

  When you join Sandstone, you become part of a team that
  believes deeply in the compounding power of collaboration,
  rigorous problem-solving, and obsessive attention to detail.
  Our engineering team is elite, our lawyers ship code every
  day, and we are dedicated to building the most delightful
  product an in-house lawyer opens in the morning—and closes
  at the end of the day.

  We work five days a week out of our offices in the Lower
  East Side. Dogs welcome; shoes optional; chess encouraged.

  The Role

  We are inviting applications from engineers and builders -
  this is a generalist role for high-agency, versatile makers.

  At Sandstone, everyone wears multiple hats and contributes
  directly to our products and culture. “Ship relentlessly” is
  a core value of our team: we are all builders, and we expect
  you will be, too. You’ll not only execute as an engineer but
  also play a key role in shaping product thinking,
  implementing customer feedback, and collaborating across
  functions. You’ll touch multiple parts of the codebase and
  be hands-on with our products.

  We are predominantly looking for full-stack software
  engineers, but our needs are constantly evolving, and we
  will consider front-end or infrastructure engineers if they
  are truly exemplary.

  What You’ll Do

  - Collaborate cross-functionally to design, build, and iterate
    on core product features
  - Own projects end-to-end, from concept through implementation
    and launch
  - Communicate with customers and incorporate feedback directly
    into the product
  - Work flexibly on different challenges, sometimes outside
    your primary area of expertise
  - Contribute to a high-performing, supportive, and ambitious
    team culture

  What We Look For

  - 3-6+ years of experience as a full stack engineer or product
    engineer at a leading startup, growth stage, or big tech
    company
  - Demonstrated end-to-end ownership of major products or
    significant portions thereof
  - Exceptional analytical and problem-solving skills
  - High attention to detail and ability to juggle multiple
    workstreams
  - Strong ownership mindset and bias toward action
  - Former founder, side project builder, or hacker mentality
  - Excitement to code and "hack" for both product and internal
    use

  Working at Sandstone: Benefits & Perks

  - Comprehensive health, dental, and vision insurance; 401K
  - 12 weeks paid parental leave
  - Flexible time off (20+ days PTO)
  - Annual learning & development stipend
  - Technology stipend, including unlimited spend on AI tooling
  - Daily lunch for in-office team members

  At Sandstone, we value high ownership, flexibility, and
  curiosity. You'll have an outsized impact, work closely with
  ambitious colleagues, and help transform how legal teams
  work for the modern age.
