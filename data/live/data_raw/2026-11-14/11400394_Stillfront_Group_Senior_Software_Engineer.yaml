description: |
  We are looking for a Senior Software Engineer to develop
  features for our mobile games and maintain the quality and
  stability of our live products. This is a hands-on role
  working across game clients and backend services, with a
  focus on Unity/C# and Go.  You will be responsible for your
  features from implementation through testing and release.
  You will work directly with Product, Design, and Art teams
  to translate concepts into reliable, shippable features. You
  will report to our Director of Engineering and work as part
  of a small, hands-on engineering team. This is a senior,
  fully remote role, open to candidates based in selected US
  states.

  YOUR MISSION

  - Design and implement features across client-side gameplay
    and backend services.
  - Partner with Art, Design, and Product teams to translate
    creative requirements into technical implementations.
  - Diagnose and resolve issues in live products, including
    crashes, client-server integration failures, and
    performance bottlenecks.
  - Refactor existing code to improve maintainability and
    address recurring defects.
  - Participate in code reviews and contribute to technical
    design decisions.
  - Estimate development work and identify dependencies or
    technical risks before they affect delivery.
  - Maintain the health of content and build pipelines to ensure
    stable client and server deployments.
  - Validate your changes through automated tests, in-game
    testing, and release checks.
  - Support production releases and investigate regressions.

  YOUR BACKSTORY

  - 5+ years of professional software engineering experience, or
    equivalent practical experience.
  - Strong proficiency in C# and professional experience
    developing and shipping mobile games in Unity.
  - Strong understanding of software architecture patterns, data
    structures, and system design.
  - Strong debugging skills and experience diagnosing problems
    in established codebases.
  - Experience improving code quality and stability through
    automated testing, code reviews, and version control.
  - Ability to take a feature from implementation to production
    with limited supervision.
  - Strong cross-functional communication skills, conveying
    technical constraints, estimates, and solutions clearly to
    stakeholders and other departments.

  NICE TO HAVE

  - Experience with Go (Golang) for backend service development,
    including API design and database integration.
  - Understanding of the casual or mid-core mobile game market
    and mechanics.
  - Experience with the mobile release lifecycle, including
    CI/CD pipelines and App Store/Google Play submissions.
  - Experience writing native plugins for Unity using
    Objective-C/Swift (iOS) or Java/Kotlin (Android).
  - Familiarity with live analytics platforms or BI tools to
    support data-driven decisions.

  COMPENSATION

  For employees based in California, Washington or
  Massachusetts the annual base salary range for this position
  is $100,000 to $200,000. Salary ranges for other locations
  may differ. Actual compensation will depend on work
  location, relevant experience, skills, qualifications, and
  internal equity.

  REMOTE WORK

  This is a full-time, fully remote position open to
  candidates based in California (CA), Washington (WA), Oregon
  (OR), Nevada (NV), Connecticut (CT), Hawaii (HI), Arizona
  (AZ), or Massachusetts (MA). The role requires availability
  from 9:00 a.m. to 5:00 p.m. Pacific Time for team
  collaboration.

  ABOUT STORM8

  Founded in 2009, Storm8 is a remote working studio based in
  Palo Alto, CA, and has published over 45 games across a
  variety of genres - so there is something for everyone. With
  millions of players worldwide we continuously strive to find
  new ways to keep our audience coming back day after day.
  Storm8 is part of Stillfront Group, a global gaming company
  headquartered in Stockholm, Sweden, with a strong focus on
  long-term IP growth.
