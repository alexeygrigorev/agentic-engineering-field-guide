description: |
  Description

  MWDN is a global IT outstaffing company with 23+ years of
  experience that connects exceptional tech talent with
  leading companies across Israel, the USA, Great Britain, and
  Western Europe. We offer opportunities to work on
  international products in a stable and professional
  environment.

  Why does MWDN rock?

  Here’s what you can expect when you join MWDN:

  - Security: We carefully vet our clients to minimize risks and
    ensure reliability and timely payments—no fraud or
    unpleasant surprises.
  - Career support: If a project isn’t the right fit, we support
    you and actively help find new opportunities that match
    your skills and career goals.
  - Legal assistance: We provide guidance on legal matters,
    including opening and managing your independent contractor
    or sole proprietorship status, taxes, and related
    processes.
  - Professional development: We offer English courses and
    professional growth opportunities, as well as team-
    building events.

  Why choose us? MWDN is ranked among the top 5 IT employers
  in our region according to DOU. We take pride in our
  transparency and strong commitment to our team. Curious to
  learn more? See what our employees say about working with us
  on DOU.

  What is your new project?

  - Domain: Security
  - Location: Israel
  - Company size: 51-200 employees
  - Founded in: 2019

  What makes this project exciting?

  Are you ready to be part of a global force in cybersecurity
  that is redefining how organizations protect their
  endpoints?

  Modern platforms combine data security, network protection,
  and advanced threat prevention to safeguard every device
  within an organization. From office laptops to remote
  workstations across the world, these technologies ensure
  that sensitive information and critical systems remain
  secure.

  This is more than just working with security tools - it’s an
  opportunity to contribute to technologies that protect
  organizations from modern cyber threats.

  We are looking for a passionate and driven Customer Focus
  Developer Engineer to join our Backend development team.
  This unique role combines deep technical development work
  with direct customer engagement, giving engineers the
  opportunity to make a real impact on customer success and
  product quality.

  In this role, you will work closely with customers, Support,
  Product, QA, and Engineering teams to investigate complex
  technical issues, resolve production challenges, and improve
  the overall customer experience. You will gain deep exposure
  to enterprise environments, large-scale backend systems, and
  real-world security challenges while helping shape the
  future of our products.

  What makes you a great fit

  - Computer science/engineering degree or equivalent training
    in software development
  - 2+ years experience with Java, Node.js, TypeScript and
    React, with the ability to navigate and modify a large-
    scale codebase
  - Experience with Unix, bash
  - Deep understanding of server-side systems, distributed
    architectures, APIs, and database interactions
  - Experience with debugging tools, log analysis, performance
    profiling, and root-cause investigation
  - Familiarity with endpoint security concepts, network
    security fundamentals, and enterprise IT environments
  - Experience in CI/CD pipelines, version control (Git), and
    working in agile development environments
  - Ability to switch seamlessly between quick bug-fix tasks and
    longer, deep-investigation assignments
  - Collaborative team player who works well with Support, QA,
    Product, and Engineering teams
  - At least an upper-intermediate level of English

  Your day-to-day in this position

  - Participate in development of industry-leading security
    product
  - Influence product future and roadmap, based on gathered
    knowledge
  - Investigate issues and develop solutions to enterprise
    customers
  - Communicate and work with teams from all around the world
  - Innovate and provide new generations of security solutions
  - Develop your analysis and problem solving skills

  Why work with us?

  - People-first management with minimal bureaucracy
  - A friendly company culture, proven by employees who choose
    to return
  - Flexible working hours
  - 29 days of PTO (18 working days per year pluse all national
    holidays)
  - 10 paid sick days
  - Full financial and legal support for independent contractors
  - Free English classes, with native speakers or Ukrainian
    teachers
  - Dedicated HR support

  Our next steps

  ✅ Intro call with a Recruiter — ✅ Client tech interview — ✅
  2nd interview with Group lead— ✅ HR client interview — ✅
  Reference check — ✅ Offer
