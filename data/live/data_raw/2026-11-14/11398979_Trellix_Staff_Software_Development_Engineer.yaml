  Our Commitment to You:

  At Trellix, we are committed to creating a safe and
  trustworthy experience for our customers, employees, and
  candidates. Please be aware that fraudulent recruiting
  activity can occur through fake job postings or impersonated
  communications.

  Trellix conducts interviews through professional channels
  only and does not use text messages, instant messaging, or
  group chats for interviews. We will never request sensitive
  personal information—such as your date of birth, Social
  Security number, or national ID number—during the interview
  process.

  Trellix also does not require candidates to pay fees,
  purchase products or services, or process payments of any
  kind as part of the recruiting or hiring process. And
  Trellix will never keep any original work authorization
  documents that we may be required to review during the
  hiring process.
