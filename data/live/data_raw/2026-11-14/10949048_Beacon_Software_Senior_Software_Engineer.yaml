description: |
  About Us

  PowerUp Sports is a leading sports management software
  company and a key part of the Beacon Software family. Beacon
  Software acquires and supports exceptional software
  businesses, helping them preserve their legacy while scaling
  their ambitions. Beacon’s team includes seasoned
  professionals with experience at Silicon Valley giants,
  including Instacart and Sequoia Capital. With Beacon as
  PowerUp’s new holding company, we’re entering an exciting
  phase of growth and innovation.

  Job Description

  As a Senior Software Developer at PowerUp Sports, you will
  play a key role in the development and optimization of our
  sports management software. Working within a small, dynamic
  team, you’ll contribute to the product roadmap, introduce
  innovative features, and ensure the performance and
  scalability of our systems. This role provides an
  opportunity to work on impactful projects while
  collaborating with other talented developers in a supportive
  and entrepreneurial environment.

  Responsibilities

  • Develop and maintain robust software solutions for PowerUp
  Sports’ platform.

  • Collaborate with cross-functional teams to design,
  implement, and release new features.

  • Ensure the integration of new technologies while
  maintaining system reliability.

  • Optimize the performance of the PHP application hosted on
  Microsoft Azure.

  • Oversee the management and optimization of Microsoft SQL
  Server databases.

  • Participate in code reviews, mentor junior developers, and
  foster a culture of continuous learning.

  Requirements

  • 3-8 years of software development experience; strong
  background in PHP is a plus.

  • Proficiency with Microsoft SQL Server and Azure cloud
  services.

  • Proven ability to work in a collaborative, fast-paced
  environment.

  • Strong problem-solving skills and an eye for scalable
  architecture.

  • Excellent communication and interpersonal skills.

  Preferred Qualifications

  • Experience in mentoring team members or leading technical
  projects.

  • Familiarity with Agile methodologies and modern DevOps
  practices.

  Work Environment

  This role is based in downtown Toronto, with a hybrid setup
  requiring in-office presence three days a week. Enjoy a mix
  of collaborative office culture and remote flexibility.

  Compensation

  • Full-time salary

  • Annual performance bonus

  • Comprehensive benefits package (healthcare, vision,
  dental)

  Be part of a thriving software company with a legacy of
  innovation, now empowered by the expertise and resources of
  Beacon Software. Join us to help shape the future of youth
  sports!
