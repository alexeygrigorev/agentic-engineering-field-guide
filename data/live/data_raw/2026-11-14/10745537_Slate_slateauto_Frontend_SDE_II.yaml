description: |
  ABOUT SLATE

  At Slate, we’re building safe, reliable vehicles that people
  can afford, personalize and love—and doing it here in the
  USA as part of our commitment to reindustrialization. The
  spirit of DIY and customization runs throughout every
  element of a Slate, because people should have control over
  how their trucks look, feel, and represent them.

  WHO WE ARE LOOKING FOR We’re looking for a Frontend Software
  Development Engineer II to help define and build Slate’s
  digital customer experience. This is a hands-on engineering
  role for someone who enjoys solving real problems, building
  high-quality user interfaces, and owning systems end-to-end.

  You should be comfortable working in a startup environment
  where priorities evolve, requirements aren’t always fully
  defined, and thoughtful engineering judgment matters more
  than rigid process. If ambiguity energizes you rather than
  slows you down, you’ll thrive here.

  WHAT YOU GET TO DO

  - Design, build, and deliver customer-facing web/mobile
    experiences that are performant, reliable, and intuitive
  - Lead the implementation and evolution of frontend systems,
    including component design, state management, and UI
    architecture
  - Write clean, well-structured code and actively participate
    in code reviews and technical design discussions
  - Own code quality end-to-end, including testing, edge-case
    handling, and production readiness
  - Collaborate closely with Product, Design, and UX partners to
    translate customer needs into elegant technical solutions
  - Make thoughtful trade-offs between speed, quality, and long-
    term maintainability—and clearly communicate those
    decisions
  - Continuously simplify and improve systems, demonstrating
    strong judgment, creativity, and attention to detail
  - Mentor other engineers through example, feedback, and
    technical discussion, contributing to a strong engineering
    culture

  WHAT YOU BRING TO THE TEAM

  - Bachelor’s degree in Computer Science or equivalent
    practical experience
  - 4+ years of professional software engineering experience,
    with a strong emphasis on frontend or customer-facing web
    development
  - Strong proficiency in modern frontend languages, ideally
    TypeScript, React and JavaScript, with solid fundamentals
    in data structures, algorithms, and problem decomposition
  - Experience building and maintaining production UI systems,
    including performance optimization, accessibility, and
    cross-browser compatibility
  - 3+ years contributing to frontend architecture and design,
    including patterns for maintainability, reliability, and
    scalability
  - 3+ years working across the full software development
    lifecycle, including coding standards, code reviews,
    source control, build tooling, testing, and operational
    support
  - Familiarity working in cloud-backed environments (e.g.,
    integrating with APIs, CI/CD pipelines, AWS and/or Azure),
    with an understanding of how frontend systems behave in
    production
  - Strong communication skills: you ask clarifying questions,
    state assumptions, identify constraints, and explain your
    thinking clearly—especially when requirements are
    ambiguous

  Work Authorization Requirement Applicants must be authorized
  to work in the United States on a permanent basis. We are
  unable to offer visa sponsorship at this time.

  Salary Range

  The compensation  for this position is the range Slate
  reasonably and in good faith expects to pay for the position
  taking into account the wide variety of factors that are
  considered in making compensation decisions, including job-
  related knowledge; skillset; experience, education and
  training; certifications; work location; and other relevant
  business and organizational factors.

  Base Pay Range (Annual)

  119,662.00 - 179,493.00 USD Annual

  Additional Compensation and Benefits: Slate offers a wide
  range of competitive benefits, including medical, dental,
  vision, life insurance, disability insurance, vacation, and
  401k. The successful candidate may also be eligible to
  participate in the equity program and/or a discretionary
  annual incentive program, subject to the rules governing
  such programs.

  WHY JOIN TEAM SLATE?

  At Slate, we’re fueled by grit, determination, and attention
  to detail. The start-up spirit of ingenuity and
  resourcefulness move our business forward. Team Slate
  fosters a culture of excellence, innovation, and mutual
  respect, and is motivated by shared principles.

  - Safety First
  - Delight Customers
  - One Team
  - Relentless Improvement
  - Fast, Frugal, and Scrappy
  - Respectful Collaboration
  - Positive Legacy

  WE WANT TO WORK WITH PEOPLE THAT REFLECT THE COMMUNITIES IN
  WHICH WE OPERATE.

