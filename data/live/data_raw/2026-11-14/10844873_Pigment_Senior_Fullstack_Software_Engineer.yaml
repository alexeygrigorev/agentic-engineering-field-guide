description: |
  Join Pigment: Transforming Business Planning and Performance
  with AI



  Pigment is the AI-powered business planning and performance
  management platform built for agility and scale. We connect
  people, data, and processes in one intuitive platform, with
  AI agents that work alongside every team, from Finance to
  HR, to build, adapt, and align strategic plans in real time.
  Founded in 2019, Pigment is one of the fastest-growing SaaS
  companies globally, passing $100M in ARR in 2026 and
  doubling revenue for the second year in a row. Industry
  leaders like Unilever, Uber, Anthropic, Snowflake, and
  Siemens use Pigment every day to make better-informed
  decisions and navigate any scenario with confidence. In
  October 2026, we raised a $250M Series E at a $2.3B
  valuation, bringing our total funding to $650M+. Today we’re
  a growing team of 700+ across Paris, London, New York,
  Toronto, San Francisco, and Austin, and we’ve been named a
  Visionary in the Gartner® Magic Quadrant™ for Financial
  Planning Software two years running. At Pigment, we take
  smart risks, celebrate bold ideas, and challenge the status
  quo - all while working as one team. If you’re driven by
  innovation and ready to make an impact at scale, we’d love
  to hear from you.



  🚀 The Opportunity:



  As a Fullstack Software Engineer you’ll work on performance-
  critical systems that process and aggregate millions of
  records in real time, directly enabling our clients to make
  better, faster decisions. Your role will be mostly working
  on backend in C#, with some frontend in React.



  Here’s why this is an exciting opportunity:



  ✨ Work on the Core Engine: Contribute to the design and
  optimization of our proprietary formula and query engine.

  ⚙️ Solve Complex Problems: Tackle scalability and
  performance challenges across high-volume, real-time
  datasets.

  🧠 Shape the Product: Collaborate closely with frontend
  engineers and product managers to deliver impactful
  features.

  🚀 Own the Stack: Build and maintain backend services using
  modern technologies like .NET Core, PostgreSQL, React, and
  GCP.

  📈 Drive Innovation: Influence architecture decisions, test
  new ideas, and continuously improve performance and
  reliability.

  If you enjoy solving hard problems and building systems that
  scale, this is the perfect place to grow your career!



  Our Engineering team



  Our Engineering team is responsible for developing our SaaS
  platform and building a comprehensive and user-friendly
  product.



  Pigment engineers participate in the entire application
  development lifecycle, focusing on design, coding and
  keeping the production platform up and running. They can be
  specialized, but there is no strict separation between the
  backend and the frontend.



  We value user-centricity and pragmatism: we choose the most
  relevant tools for the problem we have to solve,
  understanding the strengths and constraints of each
  technology.



  Our engineering culture also values curiosity, humility,
  trust, ownership and team spirit.



  Our technical stack is C# on .NET Core Linux, React,
  TypeScript, PostgreSQL, Google Cloud Platform, Docker,
  Kubernetes, Terraform, RabbitMQ and Circle CI.



  Explore Our Tech Blog:

  If you're curious about the kind of challenges our
  engineering team tackles, our culture and our organization,
  we invite you to explore our Tech Blog!





  Who you are



  More than knowledge of a specific language or framework, we
  are looking for great software engineering skills: ability
  to translate functional requirements into an elegant and
  simple design, and then deliver the code.



  We are also looking for engineers who understand the product
  and the customer's needs in detail and can suggest
  innovative ideas: in the end, it's all about delivering
  value to end users.



  In any case, you have:

  - Proven experience designing object oriented software with
    languages such as C#, Java, C++, Golang, Rust, Python or
    Ruby (this list is not exhaustive).

  - Proven experience with JavaScript, CSS and JavaScript
    libraries or frameworks such as React, Vue.js or Angular.

  - Great team spirit with a problem-solving attitude.

  - A good dose of humility and the willingness to grow (no
    matter your seniority!).

  - A fluent level in English (French is not a must).



  Folks from underrepresented minorities: science shows that
  you are less likely to apply if you feel that you don’t have
  all the necessary prerequisites. If this description matches
  where you are now or what you'd like to grow into in your
  next position, we encourage you to apply.





  What you will get



  - Competitive salary

  - Equity

  - The best health insurance with Alan Blue entirely free for
    you and your family 💙

  - Trust and flexible working hours

  - Brand new offices in the heart of Paris, London, New-York
    and Toronto



