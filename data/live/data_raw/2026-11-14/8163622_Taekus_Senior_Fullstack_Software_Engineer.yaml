description: |
  Taekus is a profitable fintech and travel startup building a
  next-generation premium banking and rewards ecosystem for
  affluent customers. With $120M+ in annual revenue and $4B+
  in annual transaction volume, we’re entering a new stage of
  growth focused on scaling our core banking systems, rewards
  infrastructure, and partner integrations.

  We’re seeking a Senior Full-Stack Software Engineer to help
  design, build, and scale the core financial and loyalty
  platforms that power our products. This is a full-stack role
  with a back-end focus, focused on developing reliable, high-
  performance services, while occasionally contributing to
  full-stack features in close collaboration with frontend and
  mobile engineers.

  Join us as we tackle a $3.2T opportunity to redefine the
  super-premium financial services and rewards market—driving
  innovation beyond what’s existed since the inception of
  rewards credit cards

  Interview Process

  Candidates must be able to travel to San Francisco, New
  York, Chicago, or Austin for an onsite interview. All
  required travel will be paid for by Taekus.

  Your Responsibilities

  - Design, build, and maintain scalable backend services and
    APIs that support high-volume financial transactions and
    rewards workflows.
  - Own full feature delivery across core systems including
    payments, rewards, account services, and partner
    integrations.
  - Contribute to system architecture and technical design as
    the platform evolves and scales.
  - Collaborate with frontend and mobile engineers to support
    end-to-end feature development when fullstack work is
    required.
  - Improve reliability, performance, and observability across
    backend systems through testing, monitoring, and code
    quality practices.
  - Participate in sprint planning, technical reviews, and
    production support for mission-critical services.

  What We're Looking For

  - 6+ years of professional software engineering experience,
    with a strong backend focus.
  - Production experience building backend systems in Python,
    ideally using Django.
  - Experience designing APIs, data models, and services using
    PostgreSQL and AWS.
  - Working knowledge of frontend technologies such as
    TypeScript and React, with the ability to contribute when
    needed.
  - Comfort working in distributed systems and high-availability
    production environments.
  - Strong ownership mindset with the ability to take backend
    projects from concept through production.
  - Bachelor’s degree in Computer Science, Engineering, or
    equivalent practical experience.

  You’d Love This Job If

  - You enjoy contributing across the code base where needed.
  - You want to be in a scaling startup that is experiencing
    exponential growth.
  - You’re excited by building foundational work and enjoy
    making an impact.
  - Traveling is in your DNA and you get to apply your passion
    into your work.
  - You thrive in growing high-caliber teams and want to
    influence both technical and strategic direction.

  About Taekus

  Taekus is a 6-year-old luxury financial services company
  that offers travel rewards credit cards, debit cards, and
  other banking services for the affluent market. We currently
  process $4B+ annually in transactions and operate as a
  highly profitable company. With a lean team of 25 employees,
  we’re undergoing tremendous growth as we redefine the
  premium banking and rewards experience.



  What We Offer

  - Competitive salary and stock option plan
  - Medical, Dental, and Vision insurance
  - 401(k) plan with 5% company match
  - Flexible vacation policy
  - Fully remote work environment
