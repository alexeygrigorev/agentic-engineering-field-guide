description: |
  Overview

  Job Title: GIS Software Quality Assurance EngineerLocation:
  Remote

  Rivet Operations Company is seeking an experienced Senior
  GIS Software QA Engineer to support a U.S. Army program
  focused on improving the accuracy, reliability, and
  consistency of installation geospatial and Real Property
  data.

  This position is ideal for a hands-on software quality
  assurance professional with experience testing GIS
  applications, validating complex datasets, and ensuring that
  automated tools produce accurate, repeatable results.

  The role supports the development and testing of ArcGIS-
  based tools, GIS and Real Property data reconciliation
  workflows, automated validation processes, and geospatial
  web applications used by Army installation personnel.

  The ideal candidate combines strong software testing
  expertise with practical knowledge of Esri GIS technology,
  database validation, and test automation. They are
  comfortable investigating complex data issues, identifying
  the root causes of software defects, and working closely
  with GIS specialists, developers, and Real Property analysts
  to deliver reliable technical solutions.

  Key Responsibilities

  -Develop, document, and execute comprehensive software test
  plans, test cases, and testing procedures for GIS
  applications and automated workflows.-Perform functional,
  regression, integration, and data validation testing to
  identify software defects and determine their causes.-Test
  ArcGIS Pro tools, geoprocessing workflows, GIS data
  validation processes, and automated reporting
  solutions.-Validate the accuracy and integrity of spatial
  data, geodatabase attributes, field values, and
  relationships between GIS and Real Property records.-Test
  automated business rules designed to identify, correct, and
  flag inconsistencies in GIS datasets.-Verify the accuracy of
  automated Real Property Unique Identifier (RPUID)
  corrections, missing-attribute population, and exception
  reporting.-Test GIS–Real Property alignment tools, automated
  workbooks, reports, dashboards, and web mapping
  applications.-Use SQL, scripts, or other testing methods to
  compare source data with application outputs and confirm
  data accuracy.-Document defects with clear reproduction
  steps, expected results, actual results, and supporting
  evidence.

  Requirements

  Required Qualifications

  -Education: Bachelor of Science (B.S.) degree in a relevant
  field of study.-Software quality assurance: Experience
  developing and executing software test plans to identify
  software problems and their causes.-Technical expertise:
  Experience and knowledge across key technical tasks and
  high-impact assignments, with the ability to serve as a
  technical expert across multiple assignments.-Esri GIS
  knowledge: Understanding of Esri ArcGIS application
  software.-Army Real Property and GIS knowledge:
  Understanding of DoD and Army Real Property and Installation
  Geospatial Information and Services (IGI&S) policies and
  guidance.-GIS standards: Understanding of the most recently
  published DCS G-4 IGI&S Quality Assurance Plans (QAPs) and
  the current Spatial Data Standard for Facilities,
  Infrastructure and Environment (SDSFIE) Army Adaptation.-CAC
  eligibility: Ability to obtain a Department of the Army
  Common Access Card (CAC).-Hands-on experience testing
  software applications, including GIS-enabled applications,
  geospatial workflows, or spatial data processing
  tools.-Experience creating and executing test cases,
  documenting defects, conducting regression testing, and
  verifying software fixes.-Practical knowledge of ArcGIS Pro,
  ArcGIS Enterprise, ArcGIS Online, or comparable enterprise
  GIS environments.-Experience validating database records,
  application outputs, and complex datasets using SQL or
  equivalent data-querying methods.-Ability to test automated
  data transformations, business rules, field calculations,
  and reporting workflows.-Experience with automated testing,
  scripting, or repeatable data validation processes.-Strong
  analytical and troubleshooting skills, with the ability to
  distinguish software defects from source-data quality
  issues.

  Preferred Qualifications

  -Testing Esri ArcGIS applications, geoprocessing tools,
  Python/ArcPy scripts, or GIS automation workflows.Working
  with enterprise geodatabases, spatial databases,
  PostgreSQL/PostGIS, SQL Server, or Oracle.-Developing
  automated tests using Python, Selenium, pytest, Postman, or
  similar tools.-Testing APIs, ETL pipelines, system
  integrations, web GIS services, and dashboards.-Supporting
  Army installations, DPW, IGI&S, facilities management,
  infrastructure, or Real Property systems.-Familiarity with
  HQIIS, RPUID, GIS–Real Property reconciliation, and Real
  Property data quality requirements.-Experience testing
  applications where data accuracy, traceability, and
  compliance with defined business rules are critical.

  Benefits: Rivet offers a comprehensive benefits package
  including a liberal vacation plan, a matching retirement
  program, and competitive salaries commensurate with skills
  and experience. For more information about our organization,
  please visit our web site at www.rivetopsllc.com.

  Physical Requirements:Work may involve sitting or standing
  for extended periods of time. Position may require typing
  and reading from a computer screen. Must have sufficient
  mobility, including but not limited to bending, reaching,
  and kneeling to complete daily duties in a timely and
  efficient manner. There is a possibility that due to parking
  availability and location of work, walking moderate to long
  distance may be required. Possible lifting up to 25 lbs.

