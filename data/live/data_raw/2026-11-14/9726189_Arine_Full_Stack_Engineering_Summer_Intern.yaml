description: |
  Based in San Francisco, Arine is a rapidly growing
  healthcare technology and clinical services company with a
  mission to ensure individuals receive the safest and most
  effective treatments for their unique and evolving
  healthcare needs.

  Frequently, medications cause more harm than good. Incorrect
  drugs and doses costs the US healthcare system over $528
  billion in waste, avoidable harm, and hospitalizations each
  year. Arine is redefining what excellent healthcare looks
  like by solving these issues through our software platform
  (SaaS). We combine cutting edge data science, machine
  learning, AI, and deep clinical expertise to introduce a
  patient-centric view to medication management, and develop
  and deliver personalized care plans on a massive scale for
  patients and their care teams.

  Arine is committed to improving the lives and health of
  complex patients that have an outsized impact on healthcare
  costs and have traditionally been difficult to identify and
  address. These patients face numerous challenges including
  complicated prescribing issues across multiple medications
  and providers, medication challenges with many chronic
  diseases, and patient issues with access to care. Backed by
  leading healthcare investors and collaborating with top
  healthcare organizations and providers, we deliver
  recommendations and facilitate clinical interventions that
  lead to significant, measurable health improvements for
  patients and cost savings for customers.

  Why is Arine a Great Place to Work?:

  Outstanding Team and Culture - Our shared mission unites and
  motivates us to do our best work. We have a relentless
  passion and commitment to the innovation required to be the
  market leader in medication intelligence.

  Making a Proven Difference in Healthcare - We are saving
  patient lives, and enabling individuals to experience
  improved health outcomes, including significant reductions
  in hospitalizations and cost of care.

  Market Opportunity - Arine is backed by leading healthcare
  investors and was founded to tackle one of the largest
  healthcare problems today. Non-optimized medications
  therapies which cost the US 275,000 lives and $528 billion
  annually.

  Dramatic Growth - Arine is managing more than 18 million
  lives across prominent health plans after only 4 years in
  the market, and was ranked 236 on the 2024 Inc. 5000 list
  and was named the 5th fastest-growing company in the AI
  category.

  The Role:

  At Arine, we are transforming healthcare through AI-driven
  medication intelligence. Our platform helps health plans and
  care teams improve patient outcomes, reduce costs, and
  optimize medication therapies at scale.

  Our engineering organization is evolving toward an AI-native
  development model where engineers leverage AI agents,
  automation, and modern cloud-native architectures to
  accelerate delivery, improve quality, and scale engineering
  operations.

  We are seeking a highly motivated Full-Stack Software
  Engineering Intern with hands-on experience using AI-
  assisted and agentic development tools in real-world
  projects.

  What You’ll Do:

  - Build and enhance modern web applications and APIs
  - Develop frontend experiences using React and TypeScript
  - Implement backend services and integrations using Python
  - Work with PostgreSQL, DynamoDB, and distributed systems
  - Contribute to scalable, event-driven architectures
  - Use AI coding assistants and agentic development workflows
    as part of daily engineering work
  - Help prototype and improve AI-driven engineering workflows
  - Work with AWS cloud-native infrastructure
  - Participate in CI/CD and automated testing workflows

  Required Qualifications:

  - Currently pursuing a BS or MS in Computer Science, Software
    Engineering, or related field
  - Experience building full-stack applications or meaningful
    technical side projects
  - Experience with React or modern frontend frameworks
  - Experience with backend development using Python, Node.js,
    or similar languages
  - Familiarity with APIs, databases, and Git workflows
  - Hands-on experience using AI-assisted development tools such
    as GitHub Copilot, Cursor, Claude Code, ChatGPT, or
    Windsurf
  - Understanding of prompt engineering fundamentals
  - Ability to validate, debug, and improve AI-generated outputs
  - Strong communication and collaboration skills

  Preferred Qualifications:

  - Experience experimenting with agentic development workflows
  - Familiarity with LLM APIs, AI agents, MCP servers, or
    orchestration frameworks
  - Experience with AWS or cloud-native systems
  - Exposure to CI/CD pipelines and automated testing
  - Interest in healthcare technology and AI platforms

  Technologies You May Work With:

  - React
  - TypeScript
  - Python
  - AWS Lambda
  - API Gateway
  - S3
  - DynamoDB
  - PostgreSQL
  - Event-driven architectures
  - GitHub Actions and CI/CD

  What You’ll Gain:

  - Real-world experience building production healthcare
    software
  - Exposure to AI-native software engineering practices
  - Mentorship from experienced engineering leaders and
    architects
  - Opportunity to contribute meaningful production code
  - Hands-on exposure to scalable distributed systems

  Compensation Range: $25.00

  #LI- Remote

  Job Requirements:

  - Ability to pass a background check
  - Must live in and be eligible to work in the United States

