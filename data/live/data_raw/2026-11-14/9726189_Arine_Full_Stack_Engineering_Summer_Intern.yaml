  Information Security Management Program and undergo periodic
  training on Information Security Awareness and HIPAA
  guidelines. Each user is responsible to maintain a secure
  working environment and follow all policies and procedures.
  Upon hire, each person is assigned and must complete
  trainings before access is granted for their specific role
  within Arine.

  Arine is an equal opportunity employer. We are committed to
  creating a diverse and inclusive workplace where all
  employees are treated with fairness and respect. We do not
  discriminate on the basis of race, ethnicity, color,
  religion, gender, sexual orientation, age, disability, or
  any other legally protected status. Our hiring decisions and
  employment practices are based solely on qualifications,
  merit, and business needs. We encourage individuals from all
  backgrounds to apply and join us in our mission.

  Check our website at https://www.arine.io. This is a unique
  opportunity to join a growing start-up revolutionizing the
  healthcare industry!

  Job Offers: Arine uses the arine.io domain and email
