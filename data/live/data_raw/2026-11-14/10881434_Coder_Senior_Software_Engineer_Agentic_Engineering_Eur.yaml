description: |
  As a Senior Software Engineer on Coder’s Engineering team,
  you’ll build and evolve the systems behind our agentic
  development experience. You’ll work across the agent
  harness, integrations, and workflows that connect agents
  with real development environments.

  You’ll stay hands-on, solve complex technical problems, and
  work closely with Product, Design, and other engineers to
  ship reliable agentic experiences.

  What you’ll do here

  - Design and build production systems in Go, with work across
    React and TypeScript where needed.
  - Improve agent execution, tool use, context management,
    streaming, and long-running workflows.
  - Extend our provider-agnostic architecture as models and
    capabilities change.
  - Build reliable integrations between agents, workspaces,
    tools, and developer infrastructure.
  - Own projects from implementation through rollout and
    iteration.
  - Contribute to design reviews, code reviews, and technical
    discussions.
  - Partner with Product and Design to turn agent capabilities
    into useful developer experiences.
  - Improve the reliability, performance, and operability of
    agentic systems.

  What we’re looking for

  - Strong experience building and operating production software
    systems.
  - Hands-on experience with Go.
  - Experience with React and TypeScript.
  - Experience building systems around LLMs or agentic
    workflows.
  - Familiarity with model APIs, tool calling, context
    management, or agent loops.
  - Good understanding of distributed systems and production
    reliability.
  - Working knowledge of AWS.
  - Strong problem-solving skills and comfort working through
    technical ambiguity.
  - Someone who contributes beyond their own code through
    reviews, collaboration, and knowledge sharing.

  Bonus tacos if you have

  - Experience building coding agents, developer tools, or cloud
    development environments.
  - Experience with MCP, agent tools, or multi-agent systems.
  - Experience with remote execution, sandboxing, or isolated
    compute.
  - Experience building integrations across multiple model
    providers.
  - Experience with AWS, Kubernetes, Docker, or Linux.
  - Open-source contributions or experience working directly
    with customers.

  Our tech stack

  - Backend: Go, Postgres
  - Frontend: TypeScript, React
  - Infrastructure: AWS, Kubernetes
  - Observability: Prometheus, Grafana
  - CI/CD: GitHub Actions

  Coder’s agentic architecture is provider-agnostic. The
  foundation is built; this role helps extend it, improve it,
  and ship the next set of agentic capabilities.

  About Coder

  Coder is the leading platform for AI development
  Infrastructure, enabling enterprises to securely run human
  and AI-driven development workflows in consistent, governed
  environments. Coder provides self-hosted, agent-ready
  workspaces that unify developer productivity and platform
  governance. With Coder, enterprises can confidently evolve
  from human-only development to AI-assisted and autonomous
  workflows, without sacrificing security, compliance, or
  performance. Learn more at coder.com.

  Interview process

  We believe that the interview process should be transparent,
  consistent, and enjoyable. We value your time and hope to
  complete the interview process in two to four weeks, if
  schedules allow. Through your interviews, you will meet a
  mix of individual contributors, managers, and senior
  leaders.

  AI use during the interview process

  As an AI company, Coder embraces the use of AI tools, and we
  want to be transparent about our expectations as you
  navigate our interview process.

  Not permitted: Using AI assistance during conversational
  interviews.

  Permitted: Using AI tooling for take-home assessments.
  Please flag where and to what extent it was used in your
  take-home. Your submission will not be penalized for using
  AI as long as it is done honestly.

  Our use of AI in hiring

  We use AI tools to help manage our recruitment process
  efficiently and fairly. Specifically:

  - Ashby and Brainerr help us review inbound applications by
    surfacing candidates who best match the role requirements
    we've defined. This tool does not make hiring decisions;
    it helps our team prioritize which applications to review
    first.
  - Granola takes notes during our interview calls so our team
    can focus on the conversation with you.

  All hiring decisions are made by humans. Our team reviews
  applications, conducts interviews, and makes final
  selections. AI tools assist us but never replace human
  judgment, and these practices are conducted in compliance
  with applicable data protection, AI governance, and labor
  laws. Your data is not used to train AI models.

  In accordance with New York City Local Law 144, an
  independent bias audit has been conducted on "Automated
  Employment Decision Tools"; results are available for Ashby.

  If you're applying for a role at Coder and have questions
  about how we use AI in our process, or if you'd like to
  request information about the data we collect, please
  contact careers@coder.com.



  Coder is a proud Equal Opportunity Employer

  We are committed to providing equal employment opportunities
  to qualified applicants and do not discriminate on the basis
  of race, color, ancestry, religion, sex, pregnancy, gender,
  gender identity, gender expression, sexual orientation,
  national origin, age, marital status, genetic information,
  disability, protected veteran status or any other
  characteristic protected by federal, state, or local laws.
