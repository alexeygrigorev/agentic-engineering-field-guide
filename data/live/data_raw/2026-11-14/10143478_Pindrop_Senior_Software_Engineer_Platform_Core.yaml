description: |
  Who We Are

  Pindrop is a cybersecurity company delivering continuous
  identity verification across voice, video, and digital
  interactions. Powered by the Pindrop Intelligence Network,
  our unified trust platform helps enterprises answer three
  critical questions:

  Is this identity synthetic? Detect AI-generated and
  manipulated voice and video. Is this identity risky?
  Identify fraud, suspicious behavior, and other risk signals.
  Is this identity known? Authenticate identities using voice,
  device, behavioral, and other signals.

  Pindrop brings this intelligence together across purpose-
  built trust engines to help organizations make informed
  decisions in real time — protecting customers, workforce
  interactions, and emerging AI-driven interactions.

  Pindrop protects billions of high-risk interactions for
  enterprises, including leading financial institutions,
  insurers, and healthcare organizations. Its technology is
  informed by more than 8 billion real-world interactions
  annually and protected by 300+ patents.

  Recognized by TIME as one of the 10 Most Influential
  Software Companies of 2026 and by Inc. for Best in Business
  for Innovation, Pindrop is backed by leading investors
  including Andreessen Horowitz, IVP, and CapitalG.

  What you’ll do

  As a Senior Software Engineer on Platform Core, you will own
  and evolve high-scale backend and data-layer services that
  every Pindrop product depends on. Platform Core owns
  foundational services including IAM, Interaction Service,
  Data Lake, reporting, and admin services, and the team is
  responsible for keeping these systems fast, reliable, and
  SLA-compliant even on record call-volume days.

  More specifically, you will:

  - Design, build, test, and operate distributed backend
    services and APIs that support high-volume customer
    interactions.
  - Take end-to-end ownership of platform work, from framing
    ambiguous problems and shaping technical plans through
    implementation, rollout, and production support.
  - Improve reliability, scalability, latency, and cost across
    shared platform systems that serve teams across the
    business.
  - Partner closely with Product, SRE, and peer engineering
    teams to deliver platform improvements without
    destabilizing live traffic.
  - Participate in on-call, incident response, troubleshooting,
    and continuous improvement of alerting, runbooks,
    deployment quality, and capacity planning.
  - Raise engineering standards through code reviews, design
    reviews, pairing, documentation, and mentorship for other
    engineers on the team.

  Who you are

  - You are self-directed, accountable, and able to drive work
    forward with limited supervision.
  - You are calm under pressure and bring sound judgment during
    incidents, tradeoff discussions, and periods of ambiguity.
  - You are collaborative and communicate clearly across
    technical and cross-functional partners.
  - You are motivated by foundational platform work, shared
    infrastructure, and reliability-oriented backend
    engineering.
  - You have a mentorship mindset and raise team standards by
    example.

  Your skill-set

  Must-haves:

  - 5-7+ years of experience building backend services and APIs
    in production, or equivalent practical depth.
  - Strong hands-on experience with Python and/or Go.
  - Experience with distributed systems, concurrency, and cloud-
    native development on AWS and/or GCP using Kubernetes and
    Docker.
  - Proven production ownership, including deploying,
    monitoring, troubleshooting, and participating in on-call
    for high-scale services.
  - Strong experience with data and messaging technologies such
    as PostgreSQL or Aurora, Redis, and RabbitMQ, along with
    the ability to reason about reliability, performance, and
    scale tradeoffs.

  Nice-to-haves:

  - Experience with Redshift, Elasticsearch, DynamoDB, S3,
    Kinesis, or IAM.
  - Experience with infrastructure as code, especially
    Terraform.
  - Strong observability habits across metrics, logs, and
    traces.
  - Experience scaling or migrating databases, including read
    replicas, cluster mode, or engine migrations.

  What’s in it for you

  Platform Core is the backbone the whole product depends on.
  In this role, your decisions will directly influence
  latency, reliability, scale, and cost across the systems
  that process customer traffic every day. You will own
  meaningful distributed systems work end to end, help the
  team scale through peak and record-load events, and increase
  the amount of major platform work Core can take on in
  parallel without compromising production stability. You will
  also work alongside experienced engineers across Core and
  adjacent teams, with a clear path to grow from strong senior
  execution into broader technical leadership and Staff-level
  impact over time.

  What we offer

  As a part of Pindrop, you’ll have a direct impact on our
  growing list of products and the future of security in the
  voice-driven economy. We hire great people and take care of
  them. Here’s a snapshot of the benefits we offer:

  - Competitive compensation package, including RSUs (Restricted
    Stock Units) for all employees, so everyone shares in our
    long-term success.
  - Remote-first environment - giving you flexibility and
    autonomy in how you structure your day.
  - While we work flexibly, we prioritize meaningful in-person
    moments through regular team on-sites, company-wide
    events, and intentional gatherings that foster connection,
    collaboration, and shared success.
  - Unlimited Paid Time Off (PTO)
  - Generous health and welfare plans to choose from - including
    one employer-paid “employee-only” plan!
  - Best-in-class Health Savings Account (HSA) employer
    contribution
  - Low-cost vision and dental plans for you and your family,
    providing comprehensive coverage and peace of mind.
  - Paid Parental Leave - Including birth, adoptive & foster
    parents
  - One year of diaper delivery for your newest addition to the
    family! It’s our way of welcoming new Pindroplets to the
    family!
  - Recurring monthly phone and internet allowance to help cover
    essential connectivity costs and support flexible work.
  - Enhanced fertility and GLP-1 benefits to support family-
    building journeys and personalized health needs.
  - Annual Learning & Development stipend to support your
    professional growth, skill-building, certifications, and
    continued education.

  #LI-Remote #LI-HB1

  Please note that the base pay range is a general guideline
  only. Pindrop considers factors such as (but not limited to)
  scope and responsibilities of the position, a candidate's
  work experience, education/training, and key skills, as well
  as market and business considerations, when extending an
  offer.

  US Base Pay Range

  $130,000—$170,000 USD

  Not sure if this is you?

  We want a diverse, global team, with a broad range of
  experience and perspectives. If this job sounds great, but
  you’re not sure if you qualify, apply anyway! We carefully
  consider every application and will either move forward with
  you, find another team that might be a better fit, keep in
  touch for future opportunities, or thank you for your time.

  AI - A Transformative Force

  At Pindrop, we view artificial intelligence as a
  transformative force that, when harnessed responsibly, can
  unlock unprecedented value for our customers, partners and
  society and enable and empower us to continue to deliver
  cutting-edge technology to combat fraud and unblur the lines
  between what it means to be human versus machine.

  Pindrop may use AI tools to help prioritize job applications
  for human review. The AI tool may analyze your work
  experience and skills to assess fit for the role, but does
  not consider your name or contact details. Applications with
  the strongest match to job requirements are prioritized for
  human review; not all applications may be individually
  reviewed.

  Pindrop is an Equal Opportunity Employer

  Here at Pindrop, it is our mission to create and maintain a
  diverse and inclusive work environment. As an equal
  opportunity employer, all qualified applicants receive
  consideration for employment without regard to race, color,
  age, religion, sex, gender, gender identity or expression,
  sexual orientation, national origin, genetic information,
  disability, marital and/or veteran status.
