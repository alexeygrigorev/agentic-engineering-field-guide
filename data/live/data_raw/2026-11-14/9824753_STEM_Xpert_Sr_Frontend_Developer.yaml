description: |
  Company Description

  Position: Sr. Frontend Developer

  Location: NYC, NY

  Duration:  6+ months

  SKILLS & EXPERIENCE:

  - Have 5+ years of experience architecting and designing
    consumer focused based enterprise web applications
  - Strong knowledge of Java front-end technologies and
    frameworks
  - Excellent knowledge of HTML/CSS/Javascript, especially
    across all
  - Strong experiencing developing front end experiences across
    all devices especially mobile devices
  - Strong experience developing front end interfaces in a
    services oriented architecture
  - Excellent working knowledge of:
    - Front end application frameworks (e.g. backbone.js)
    - JQuery & JavaScript
    - HTML & CSS development (HTML5 and CSS3 preferred)
    - SASS experience
    - CSS Media Queries
  - Strong experience with UI data integration patterns,
    particularly AJAX and REST (JSON)
  - Solid Knowledge of HTML; HTML5, XHTML, HTML various modes
    and specifications, cross browser compatibility caveats,
    support and testing.
  - Knowledge of various HTML/HTML5 frameworks
  - Solid Knowledge of Web Styling using CSS3/CSS including
    knowledge of CSS frameworks e.g. SASS, LESS
  - Solid Knowledge of Client Side Web programming using
    JavaScript and Javascript MV* frameworks including

  - jQuery, jQueryUI, jQuery Mobile.

  - Experience in building jQuery Extensions is a plus
   - MV* Libraries and frameworks: AngularJS, Ember-JS,
     Sencha/Sencha-Touch, KendoUI, Backbone, Spine, etc.

  - Browser Testing and Debugging Tools: e.g. Charles, FireBug,
    WebKit/Chrome/FireFox Developer, Extensions etc.
  - Javascript Unit Testing and Frameworks: e.g. qUnit, jqUnit,
    JsUnit
  - Performance testing and tuning of web application:
    performance analysis tools e.g. ySlow and PageSpeed
  - Be able to do hands on development to build out development
    prototypes and reference applications
  - Experience with agile and scrum methodologies
  - Experience working with Continuous Integration and
    Continuous Deployment
  - e-Commerce development (Content and Catalog Management,
    Search, Shopping Cart, Wish List, Checkout)
  - Familiar with development in conjunction with an enterprise
    CDN (Akamai)
  - Be a self-starter that is outcome driven
  - Able to take the lead and display initiative
  - Experience with mobile web app development frameworks,
    wrappers and build systems: e.g PhoneGap and AppCelerator
  - Experience in developing enterprise grade mobile application
    front end is a big plus. Android and iOS development
    experience is a plus

  Skill and Role Summary:

  Responsive design enhancements to client’s current sites
  working with their in-house development and design team in a
  Scrum/agile fashion

  RESPONSIBILITIES:

  - Lead the mobile web and responsive design and development
    effort of UI / Web application architecture that is
    capable of supporting the latest mobile web development
    standards, frameworks and technologies
  - Help define mobile best practices from a front end
    standpoint
  - Help move existing code base to future friendly state
  - Ensure that all new projects are being designed and built
    with mobile as a core component
  - Lead the technical design and development of responsive web
    application that spans mobile, tablet, desktop and other
    digital form factor.
  - The Senior mobile developer / software engineer / web
    developer will be working on multiple projects and user
    interactions to mobile optimize existing ecommerce
    features as well as building out mobile optimized new site
    features/enhancements.
  - The Senior mobile developer will lead the technical design
    and build of Responsive web designs/applications with
    mobile-first/mobile-support best practices including
    caching, touch/gesture support and graceful degradation of
    design
  - The ideal candidate is someone who is passionate about
    beautiful interfaces, fluid UI, front-end web
    technologies, RESTful APIs

  Additional Information
