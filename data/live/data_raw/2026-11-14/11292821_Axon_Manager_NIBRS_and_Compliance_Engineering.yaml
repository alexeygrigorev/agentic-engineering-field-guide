description: |
  Join Axon and be a Force for Good.

  At Axon, we’re on a mission to Protect Life. We’re
  explorers, pursuing society’s most critical safety and
  justice issues with our ecosystem of devices and cloud
  software. Like our products, we work better together. We
  connect with candor and care, seeking out diverse
  perspectives from our customers, communities and each other.
  Life at Axon is fast-paced, challenging and meaningful.
  Here, you’ll take ownership and drive real change.
  Constantly grow as you work hard for a mission that matters
  at a company where you matter.

  Your Impact

  Axon's NIBRS and Compliance team is looking for an
  Engineering Manager who will lead a squad of software
  engineers. That squad builds, certifies, and continually
  improves NIBRS and other compliance reporting capabilities
  (e.g., crash, citation, and state supplemental reporting) in
  Axon's public safety records management and data platforms.
  This work automates officer workflows, delivers real-time
  validation, and enables agencies to submit state and federal
  crime reports as well as other compliance reporting
  requirements.

  Axon has led the global effort to protect life through
  electric weapons, body cameras, real-time sensors, public
  safety software products, and AI tools. Axon is uniquely
  positioned to tie together every aspect of an incident so
  agencies can prepare, respond, deliver justice, support
  officers, and increase community safety. As manager of this
  team, you will stay close to the work, raise the bar on how
  the team operates, grow the engineers who do it, and set a
  clear vision for the next generation of NIBRS and compliance
  engineering capabilities at Axon.

  What You'll Do

  Location: Remotely from the United States. Travel as needed
  to Axon hubs and customer/state program sites (typically up
  to 25%).

  Reports to: Senior Director, Productivity

  Direct Reports: 10 NIBRS/Compliance Engineers

  - Lead a squad of NIBRS and compliance engineers; stay close
    to current work, constraints, and customer/state program
    commitments so you can coach, unblock, and make sound
    tradeoffs.
  - Responsible for technical and domain details: NIBRS
    submission and validation frameworks, state-specific
    implementations, certification paths, and a high bar for
    quality, performance, and compliance accuracy on
    production systems.
  - Identify challenges, propose solutions, and seek feedback
    from leadership, R&D, and agency/state stakeholders.
  - Own and continually improve how the team operates: planning,
    execution, reviews, incident and certification follow-
    through, and processes that support deployment and
    evolution at scale.
  - Accountable to leadership for resource allocation, delivery,
    and team performance.
  - Mentor engineers on the team; set clear expectations, give
    frequent feedback, and grow the team as certification
    scope and product surface area expand.
  - Partner with R&D and Product Enablement so national and
    state compliance reporting requirements are implemented in
    Axon's records management system.
  - Define where the engineering team goes next (states, report
    types, automation, and platform capabilities) and
    translate that vision into a sequenced roadmap with
    leadership.

  What You Bring

  - Experience managing complex, multi-stakeholder programs from
    start to finish, including work that spans product,
    engineering, and external agencies or regulators.
  - Managerial experience with developing teams, and
    anticipating future demand.
  - Effective communication with both technical and non-
    technical people, including clients and internal leaders
  - Demonstrated ability to improve team operations, quality,
    and delivery.
  - Experience developing and/or maintaining production systems;
    familiarity with TypeScript/JavaScript, Python or similar.
  - NIBRS, UCR, and/or other compliance reporting (crash,
    citation, use of force, traffic stop, etc.) experience is
    strongly preferred.
  - Must pass a Criminal Justice Information Services (CJIS)
    background check and maintain confidential and highly
    sensitive information.

  Benefits that Benefit You

  - Competitive salary and 401k with employer match
  - Discretionary paid time off
  - Paid parental leave for all
  - Medical, Dental, Vision plans
  - Fitness Programs
  - Emotional & Mental Wellness support
  - Learning & Development programs
  - Employee Resource Groups (ERGs)
  - And yes, we have snacks in our offices

  Benefits listed herein may vary depending on the nature of
  your employment and the location where you work.

  Don’t meet every single requirement? That's ok. At Axon, we
  Aim Far. We think big with a long-term view because we want
  to reinvent the world to be a safer, better place. We are
  also committed to building diverse teams that reflect the
  communities we serve.

  Studies have shown that women and people of color are less
  likely to apply to jobs unless they check every box in the
  job description. If you’re excited about this role and our
  mission to Protect Life but your experience doesn’t align
  perfectly with every qualification listed here, we encourage
  you to apply anyways. You may be just the right candidate
  for this or other roles.

  Important Notes

  The above job description is not intended as, nor should it
  be construed as, exhaustive of all duties, responsibilities,
  skills, efforts, or working conditions associated with this
  job. The job description may change or be supplemented at
  any time in accordance with business needs and conditions.

  Some roles may also require legal eligibility to work in a
  firearms environment.

  We collect personal information from applicants to evaluate
  candidates for employment. You may request access, deletion,
  or exercise other CCPA rights at
  axongreenhousesupport@axon.com or via our Axon Privacy Web
  Form. For more information, please see the Your California
