description: |
  The Low-latency technology group is looking for an
  experienced Software Engineer and Integration specialist
  with experience in equities markets, connectivity, systems
  integration and automation to join our JISU COB team in
  London. The JISU COB Team is responsible for project
  delivery, including business analysis, project management,
  client onboarding, release management and plant management.
  In addition, the role will focus on streamlining end-to-end
  deliveries through automation of manual tasks and process
  improvement.

  Responsibilities:

  - You will participate in cross-functional requirements and
    implementation discussions to review the impact of
    application changes
  - Work with business and product teams to prioritize and
    communicate status and progress toward daily and weekly
    deliverables
  - Participate in estimating the effort and timelines for
    delivery
  - Develop functionality
  - Implement end-to-end setup for clients in the low-latency
    setup including rollout to production, and post-release
    checks
  - Ensure comprehensive integration testing coverage exists by
    understanding the test scope and approach
  - Spear-head automation and streamlining of deliveries working
    with Application Development and Business Analyst teams
  - Partner with Application Development and Business Analyst
    teams to participate in solution design and ensure
    testability of functions and application
  - Present and/or escalate project and technical needs
  - Excellent knowledge of S/W and H/W Client onboarding on
    Linux servers
  - Ensure quality delivery and stability

  Required Qualifications, Capabilities, and Skills:

  - Self-motivated, self-directed, and thrive in a fast-paced
    and high-visibility work environment.
  - Experience in equities, trading technologies, Financial
    Information eXchange (FIX)
  - Experience in Linux, Networks, FPGAs, Python, Shell
    scripting and other programming languages.

