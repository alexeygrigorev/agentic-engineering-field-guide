description: |
  hatch I.T. is partnering with Babel Street to find an
  Engineering Manager. Please see details below:

  About the Role

  Babel Street is seeking an experienced Engineering Manager
  to lead their Secure Access team. Secure Access is a Managed
  Attribution application that operates primarily on-premise,
  with one component residing in the cloud. The ideal
  candidate is a hands-on leader with engineering leadership
  experience who can work across infrastructure and
  application development while balancing reliability for
  existing customers with the delivery of new features.

  About the Company

  Babel Street is the trusted technology partner for the
  world’s most advanced identity intelligence and risk
  operations. They deliver advanced AI and data analytics
  solutions providing unmatched, analysis-ready data
  regardless of language, proactive risk identification,
  360-degree insights, high-speed automation, and seamless
  integration into existing systems. Babel Street empowers
  government and commercial organizations to transform high-
  stakes identity and risk operations into a strategic
  advantage.  The actionable insights we deliver safeguard
  lives and protect critical assets around the world.  Babel
  Street is headquartered in Reston, Virginia, with regional
  offices in Boston, MA and Cleveland, OH, and international
  offices in Australia, Canada, Israel, Japan, and the U.K.

  What you will do:

  - In this role, you will lead a team of Software and Platform
    Engineers responsible for the Secure Access application
    throughout its lifecycle, including its integration with
    our on-premises and cloud environments. You will set the
    technical direction, manage priorities and delivery, and
    mentor engineers across both disciplines.

