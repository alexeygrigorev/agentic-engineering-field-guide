title: "Section Manager - Gas Engineering Standards & Regulatory Issues"
company: Consolidated Edison Company Of Ny
location: Bronx, USA
work_type: FULL_TIME
company_size: 7,742 Employees
description: |
  Gas Engineering is seeking a highly motivated and dedicated
  candidate to join its team as a Section Manager. This
  individual will be responsible for providing guidance for
  the creation, review, and revision of Company
  specifications, drawings, bulletins and/or policies in
  conformance with PSC, DOT, OSHA and other laws and
  regulations. Provide interpretation of specifications and
  codes. Lead and/or support R&D projects and industry
  developments associated with gas construction, distribution
  and maintenance. Provide guidance on decisions on
  engineering problems associated with specification and
  procedure preparation. Effectively lead the communication of
  changes in specifications following a management of change
  protocol. The candidate must recognize the importance of
  personal responsibility, possess a commitment to achieving
  environmental and safety excellence, provide a superior
  level of leadership, and understand the vital importance of
  personal accountability.

  This position does not provide employment pursuant to the
  terms of a STEM OPT Training Plan.

  ResponsibilitiesCore Responsibilities

  - Lead and develop a team through coaching, performance
    management, and effective work assignment to drive aligned
    execution and business outcomes.
  - Supervise the preparation and revision of Company
    specifications in conformance with PSC, DOT, OSHA, and
    other applicable laws and regulations, and provide
    interpretation of specifications and codes.
  - Oversee support for R&D projects and industry developments
    related to gas construction, distribution, and maintenance
    specifications.
  - Supervise the development, preparation, and tracking of
    business plans, goals, rate case items, budgets, and
    related deliverables.
  - Ensure implementation of Company environmental, health, and
    safety programs for all employees under direct
    supervision.
  - Ensure safe work practices are followed, and the environment
    is fully protected, in accordance with Company policy and
    governmental regulations.

  QualificationsRequired Education/Experience

  - Bachelor's Degree in Engineering and a minimum of 8 years of
    full-time relevant work experience.

  Relevant Work Experience

  - A minimum of three years of supervisory experience,
    required.
  - Ability to foster a team-spirited work environment in
    support of Con Edisons Corporate Values and Mission
    Statement, required.
  - Proficient in Company computer applications, including
    Oracle and Microsoft Office, required.
  - Ability and willingness to learn new computer applications
    and adopt new technology, required.
  - Ability and willingness to present to senior leadership at
    meetings and conferences, required.
  - Knowledge of NYCRR Part 255 and DOT 49 CFR Part 192,
    preferred.
  - Financial, analytical, and project management skills,
    preferred.
  - Knowledge of, and experience using, Business Intelligence,
    Gas Central, eGIS ArcFM, and Synergi, preferred.

  Skills and Abilities

  - Ability to inspire and develop staff
  - Effective interpersonal skills
  - Develops and delivers effective presentations
  - Ability to drive multiple projects to successful completion

  Licenses and Certifications

  - Driver's License Upon Hire Required

  Physical Demands

  - Sit or stand to use a keyboard, mouse, and computer for the
    duration of the workday

  Additional Physical Demands

  - The selected candidate will be assigned a System Emergency
    Assignment (i.e., an emergency response role) and will be
    expected to work non-business hours during emergencies,
    which may include nights, weekends, and holidays.
  - Ability to travel within Company service territory, as
    needed.
  - No Take-Home vehicle associated with this position.

