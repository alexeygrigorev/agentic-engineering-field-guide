description: |
  About Vigil Markets

  Vigil Markets is on a mission to re-imagine how financial
  exchanges work from first principles to deliver fair order
  execution to the masses. We're building an exchange that
  lets our customers focus on their trades instead of focusing
  on the idiosyncrasies of the exchange.

  Founded by customer-obsessed engineers and researchers, we
  love tackling tough technical challenges. Our small,
  incredibly strong team thrives on solving impactful problems
  in a fast-paced environment.

  What you will do

  Our objective is to build a robust, high-throughput, low-
  latency exchange. Depending on your interests, you could be
  building our matching engine, trading APIs, or market data
  feeds.

  What we’re looking for

  We’re seeking exceptional people who:

  - Thrive in an in-person environment at our Flatiron office.
  - Possess T-shaped skills. Your deep technical expertise is
    complemented by broad domain knowledge, enabling you to
    champion diverse solutions.
  - Have a strong bias towards action. You prefer building demos
    and proof of concepts over lengthy documents.
  - Are performance-minded. You care deeply about code quality,
    pushing for robust, production-ready solutions beyond just
    passing unit tests.
  - Exhibit excellent communication and collaboration skills. We
    value teamwork and prefer working with talented
    contributors over working solo
  - Have experience with a systems programming language like C,
    C++, Go, or Rust

  Bonus Points

  - A deep passion for re-imagining exchanges
  - Experience with Go (our primary language) and/or building
    matching engines
  - Understanding of consensus protocols (e.g. Viewstamped
    Replication, Raft, Paxos)
  - Experience building multi-tenant, large-scale distributed
    systems
  - Track record of shipping high-quality products and leading
    large-scale projects
  - Open-source contributions or published work

  Benefits

  We're building a team of passionate, talented engineers who
  share our vision. To achieve this, we're creating a
  workplace where you're trusted, empowered, and well-
  compensated.

  - Location: Our Flatiron office offers free catered lunch
    daily. We're looking for NYC-based candidates or those
    willing to relocate (we cover costs). We also cover
    commuter expenses.
  - Compensation: Highly competitive salary with startup equity.
    The target compensation for this role is
    $225,000-$300,000, with the final offer amount potentially
    varying based on experience and job-related skills.
  - Time Off: Unlimited PTO with flexible sick, family, and
    mental health leave (minimum 4 weeks)
  - Healthcare: Comprehensive health, dental, and vision
    insurance

  Equal Opportunity Employer

  Vigil Markets, Inc. is an equal opportunity employer. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, veteran
  status, or any other protected characteristic.

  We comply with all applicable federal, state, and local laws
  governing nondiscrimination in employment. This policy
  applies to all terms and conditions of employment, including
  recruiting, hiring, placement, promotion, termination,
  layoff, recall, transfer, leaves of absence, compensation,
  and training.
