description: |
  Fresh Del Monte Produce Inc. is a global leader in the
  production, distribution, and marketing of fresh, value-
  added, and shelf-stable fruits and vegetables under our
  Fresh and Foods divisions. Our diverse product portfolio
  proudly bears the Del Monte® brand and also includes
  prepared fruits and vegetables, juices, beverages, snacks,
  and desserts - available in over 80 countries worldwide.
  With operations spanning more than 35 countries, we’ve
  proudly been nourishing families for over 135 years.

  Benefits We Offer Include:

  - Medical, Dental & Vision Insurance
  - 401(k) with company match
  - Employer-paid life & disability insurance
  - Flexible Spending Accounts (FSA)
  - Paid Time Off (PTO)
  - 7 Company Paid Holidays
  - 24/7 Telemedicine & Employee Assistance Program
  - Optional voluntary benefits (legal, accident, identity
    protection)
  - Eligibility on the first of the month following your hire
    date

  Purpose of Position:

  Del Monte Foods is the Foods Division of Fresh Del Monte, a
  global grower, producer and marketer of fresh, value-added,
  and shelf-stable produce. Del Monte Foods has a powerful
  portfolio of brands, including the iconic Del Monte®,
  Contadina® and S&W®.

  This position will support the Operations business units and
  facilities management as directed, leading the planning and
  execution of complex capital projects and engineering
  initiatives in support of plant operations, warehouse and
  R&D for the Foods Division of Del Monte Corporation.

  This position will independently collaborate with and
  influence cross-functional leaders from procurement,
  marketing, operations, and R&D to assess business
  opportunities, understand customer needs and develop capital
  cost structures and engineering solutions that contribute to
  broader operational and business objectives. Performance is
  measured on the ability to apply core company values to
  implement complex, cross-functional projects and initiatives
  on time within budget while working with other functions as
  a team.

  Location & Travel Requirements: This is a remote position
  requiring frequent travel to manufacturing facilities,
  distribution centers, and project sites. Candidates should
  be based in the Midwest region and reside within reasonable
  driving distance of a major commercial airport. Extensive
  travel is required to support plant operations and capital
  projects as business needs dictate.

  Accountabilities:

  - Engineer, design and specify equipment systems to meet needs
    and specifications of the department's customers. Provide
    structured planning, organization and lead complex
    projects and continuous improvement initiatives to
    completion within schedule, budget and scope for all
    assigned capital projects. Execute assigned capital
    projects continuous improvement strategies. Ensure
    shareholder expectations for results are met.
  - Monitor capital projects standards for cost control.
    Actively support company efforts to maximize plant
    efficiency, continually improving the use of capital.
    Deliver capital project completion (cradle to grave) to
    the plants on time and within budget using latest
    available and financially acceptable technologies.
  - Prepare well written clear studies/reports with accurate
    capital estimates and savings calculations with sufficient
    documentation to define project scope. Collaborate with
    internal stakeholders, distribution and operations for
    capital reduction and improvements with high economic
    return.
  - Embraces change and engages others to adopt new processes,
    solutions and plans while staying focused on goals and
    results. Utilize processes for repeatability and
    scalability to maximize efficiencies. Proactively find and
    promote business improvement opportunities such as
    projects with high economic return, quality or process
    improvement, capacity increase, etc.
  - Able to develop manufacturing site masterplan that
    incorporates business growth, modernization of plants and
    cost structure improvement.
  - Analyze all vendor/contractor proposals to assure they meet
    requested scope and are within project cost limits. Work
    with Legal team to assure vendor contracts are valid and
    protect the company with regards to the agreement. Manage
    all project related contractors and vendors associated
    with equipment and system installation, training and start
    up to assure contractual obligations are met within scope
    and timeline. Analyze and resolve project related problems
    or assist vendors/contractors in problem solving.
    Coordinates contractor/vendor work schedules with
    operations to assure food/employee safety conditions are
    met and work is done within the facilities operating
    schedule boundaries.
  - Able to visualize and execute proper flow of material and
    people during factory layout design and apply ergonomic
    principles to equipment design.
  - Develop and provide layouts of equipment or block flow
    diagrams to help operations understand floor space
    requirements and proper ergonomics for cost efficient
    operations. Determine appropriate equipment or design
    processes to match throughput.
  - Establishes clear plan and course of action to accomplish a
    specific goal. Improve individual and department
    credibility by maintaining honesty and engage in frequent
    communication with stakeholders.
  - Develop and disseminate appropriate engineering standards
    that can be used across the company to support
    standardized equipment selection, safety and meet sanitary
    construction guidelines.
  - Provide technical competency through the application of
    sound science, cost effective, general industrial practice
    or engineering-based solutions to meet customer
    requirements. Understand current government regulations as
    it applies to food processing and equipment.
  - Evaluates completed work and project outcomes to ensure
    quality, timeliness, standards as necessary.
  - Train, enable, and mentor engineering and production staffs.
  - Other duties as assigned.

  Minimum Skills Required:

  - Bachelor's Degree in Engineering discipline (Agricultural,
    Mechanical, Electrical, Food Science, Chemical, Civil
    Engineering.
  - Minimum 7 years' experience in Food Manufacturing
    engineering and technical operations, project management
    and environmental management responsibilities.
  - Proficient in CAD tools and Microsoft Office (Word, Excel,
    Project and Outlook.
  - A proven track record of managing several $5MM+ capital
    projects and a progression through multiple roles in the
    Food Manufacturing industry.
  - Demonstrated experience in engineering design and project
    management with respect to food manufacturing facilities
  - Formal project management training or certifications
    - Lean certification desired.
    - OSHA certifications desired -- safety and utilities.
  - Bilingual (English and Spanish), preferred



  ***Please note: This position does not qualify for
  relocation expenses.***

  Fresh Del Monte Produce Inc. is a global leader in the
  production, distribution, and marketing of fresh and fresh
  cut fruits and vegetables. Our diverse product portfolio
  also includes prepared fruits and vegetables, juices,
  beverages, snacks, and desserts—available in over 80
  countries worldwide. With operations spanning more than 35
  countries, we’ve proudly been nourishing families for over
  135 years.

  We are committed to maintaining a drug-free workplace and
  are proud to be an Equal Opportunity Employer. Fresh Del
  Monte and its affiliates do not discriminate based on race,
  color, religion, national origin, age, disability, gender,
  veteran status, or any other characteristic protected by
  applicable law. We also participate in E-Verify* where
  applicable, to ensure employment authorization eligibility.
  Driven by our core values - Excellence, Care, Passion,
  Trust, and Creativity - we invite you to explore our career
  opportunities and join our FRESH team.
