description: |
  Job Title

  Software Engineering – Full Stack Developer – Advanced

  Role Overview

  We are looking for an experienced Full Stack Developer to
  design, develop, and maintain scalable, high-performance web
  applications. The ideal candidate should have strong
  expertise across both frontend and backend technologies,
  experience working with APIs and databases, and the ability
  to collaborate effectively with cross-functional engineering
  teams.

  Key Responsibilities

  - Design, develop, test, and maintain end-to-end web
    applications.
  - Build responsive and scalable frontend applications using
    modern JavaScript frameworks.
  - Develop robust backend services, APIs, and microservices.
  - Integrate frontend applications with RESTful/GraphQL APIs
    and third-party services.
  - Design and optimize relational and NoSQL databases.
  - Write clean, maintainable, reusable, and well-tested code.
  - Perform code reviews and contribute to engineering best
    practices.
  - Troubleshoot, debug, and resolve application performance and
    production issues.
  - Collaborate with Product Managers, UX/UI Designers,
    Architects, QA, and DevOps teams.
  - Participate in architecture discussions and contribute to
    technical design decisions.
  - Implement secure coding practices, authentication,
    authorization, and data protection.
  - Support CI/CD, cloud deployments, monitoring, and production
    releases.
  - Mentor junior developers and provide technical guidance
    where required.

  Required Technical Skills

  - Frontend: React.js / Angular / Vue.js, JavaScript,
    TypeScript, HTML5, CSS3.
  - Backend: Java / Python / Node.js / .NET or equivalent
    backend technology.
  - Strong experience developing RESTful APIs and microservices.
  - Strong knowledge of SQL and relational databases such as
    PostgreSQL, MySQL, or Oracle.
  - Experience with NoSQL databases such as MongoDB, DynamoDB,
    or similar.
  - Strong understanding of object-oriented programming, data
    structures, algorithms, and design patterns.
  - Experience with Git and modern software development
    practices.
  - Knowledge of CI/CD pipelines and DevOps practices.
  - Experience with cloud platforms such as AWS, Azure, or GCP.
  - Understanding of application security, authentication,
    authorization, and API security.
  - Experience with unit testing, integration testing, and
    automated testing frameworks.

  Advanced-Level Expectations

  - Ability to independently own complex features from
    requirements through production deployment.
  - Strong understanding of system design, scalability,
    performance, and reliability.
  - Ability to troubleshoot complex technical issues across
    frontend, backend, database, and infrastructure layers.
  - Experience designing and implementing scalable microservices
    and distributed systems.
  - Ability to evaluate technology choices and recommend
    appropriate solutions.
  - Strong problem-solving, analytical, and debugging skills.
  - Ability to provide technical mentorship and influence
    engineering best practices.

  Preferred Skills

  - Experience with Docker and Kubernetes.
  - Exposure to event-driven architectures and messaging systems
    such as Kafka or RabbitMQ.
  - Experience with cloud-native application development.
  - Knowledge of application observability, logging, monitoring,
    and performance optimization.
  - Exposure to AI/ML or GenAI application integration is a
    plus.
  - Experience working in Agile/Scrum environments.

  Education & Experience

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field.
  - Typically 6–10+ years of professional software development
    experience, with significant hands-on Full Stack
    development experience.

  Key Competencies

  - Full Stack Application Development
  - Software Architecture & System Design
  - API & Microservices Development
  - Database Design & Optimization
  - Cloud & DevOps
  - Application Security
  - Performance Optimization
  - Problem Solving & Debugging
  - Technical Leadership & Mentoring
  - Agile Development & Cross-Functional Collaboration

  Compensation, Benefits and Duration

  Minimum Compensation: USD 48,000 Maximum Compensation: USD
  168,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full-time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
