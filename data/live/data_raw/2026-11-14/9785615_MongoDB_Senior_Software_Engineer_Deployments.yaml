description: |
  Platform Engineering is the department within SRE that is
  responsible for a range of critical infrastructure and
  operational functions that support the broader engineering
  organization. Among these are our multi-cloud-provider
  Kubernetes infrastructure, networking, load balancing
  (including our public-facing edge and internal service
  mesh), and observability and alerting systems.

  The Deployments team designs and maintains our continuous
  delivery infrastructure, ensuring reliable code deployment
  from development through production for all engineering
  teams. This infrastructure is primarily composed of Argo
  Workflows and ArgoCD. The team also provides tooling that
  enables clear system ownership and facilitates self-service
  onboarding for development teams.

  We are looking to speak to candidates who can work East
  Coast hours.

  The ideal candidate should

  - Have 6+ years of experience in software development and
    operating distributed systems
  - Proficiency in Python, Go, or a similar language
  - Proven experience building and operating large-scale
    continuous integration and continuous deployment (CI/CD)
    pipelines
  - Possess a customer-focused mindset
  - Value efficiency in processes and operations
  - Prefer automation over manual process (“allergic to ops
    work”). We are a small team of software engineers with a
    strong bias towards software solutions to avoid toil
  - Experience using and extending containerization
    technologies, particularly Kubernetes, to enhance
    application agility, optimize resource utilization, and
    accelerate time-to-market
  - Expertise in cloud infrastructure platforms, including AWS,
    Google Cloud Platform (GCP), or Azure
  - Understanding of Linux operating system internals and
    networking concepts (e.g., TCP/IP, DNS, TLS, routing)

  Expectations

  - Contribute to developing a world-class continuous deployment
    experience, enabling the rapid and reliable shipment of
    MongoDB products
  - Own the onboarding flow other engineering teams follow when
    launching a new product or service
  - Collaborate with other teams within Platform Engineering to
    ensure a consistent service-onboarding experience
  - Provide internal support for our deployment systems,
    including answering questions and addressing issues
  - Participate in a 24/7 on-call rotation to resolve issues
    involving the deployment infrastructure

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the database for the AI era, enabling innovators
  to create, transform, and disrupt industries with software.
  MongoDB’s unified database platform—the most widely
  available, globally distributed database on the market—helps
  organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  database and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and nearly 60,000 customers—including
  75% of the Fortune 100 and AI-native startups—relying on
  MongoDB for their most important applications, we’re
  powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

  To drive the personal growth and business impact of our
  employees, we’re committed to developing a supportive and
  enriching culture for everyone. From employee affinity
