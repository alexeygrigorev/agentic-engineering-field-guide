description: |
  Position: Software Engineer - Consumer Products

  Location: New York, NY (Remote)

  Department: Digital Experience

  About Lincoln Center: Lincoln Center for the Performing Arts
  is a global home for music, dance, theater, film, and
  culture. We steward a 16-acre campus in New York City,
  collaborate with leading resident arts organizations, and
  connect millions of people to the arts each year. We are
  building a modern digital foundation that expands access to
  culture, deepens relationships with audiences, and supports
  new creative frontiers.

  Role Overview: Lincoln Center is seeking a Software Engineer
  to join the Commerce team within the Digital Experience (DX)
  department. The DX department builds and operates a digital
  ecosystem that reflects the excellence of the art presented
  on our stages. Within DX, the Commerce team is responsible
  for building and scaling the systems that power ticketing,
  donations, memberships, and patron accounts.

  Reporting to the Tech Lead for Consumer Products, the
  Software Engineer will work closely with Product Managers to
  design, build, and maintain the core commerce experiences
  that drive revenue and audience engagement across Lincoln
  Center.

  This role focuses on delivering reliable, scalable, and
  high-performing systems that support how audiences discover
  events, complete transactions, manage their accounts, and
  engage over time. You will contribute to the development of
  modern, API-driven platforms that integrate with ticketing
  systems, CRM platforms, payment providers, and analytics
  tools.

  The ideal candidate is a strong engineer who cares about
  user experience, system reliability, and performance. This
  person brings technical rigor, attention to detail, and a
  collaborative mindset, with experience building or
  contributing to digital commerce systems. This role is
  highly cross-functional and sits at the intersection of
  digital experience, engineering, operations, and data.

  What you'll get to do here:

  - Build and maintain features that support ticketing,
    checkout, donations, memberships, and patron account
    experiences across web and mobile platforms.
  - Collaborate closely with Product Managers and Designers to
    translate business requirements into scalable technical
    solutions.
  - Develop and maintain integrations with ticketing systems,
    CRM platforms, payment processors, and third-party
    services.
  - Optimize performance and reliability across high-traffic
    commerce experiences, particularly during on-sale and peak
    demand periods.
  - Implement analytics tracking and instrumentation to support
    funnel analysis, experimentation, and continuous
    optimization.
  - Contribute to the design and evolution of API-driven
    architectures that enable flexibility, scalability, and
    reuse across systems.
  - Write clean, maintainable, and well-tested code, and
    participate in code reviews to uphold engineering
    standards.
  - Support debugging, troubleshooting, and resolution of
    production issues to ensure a stable and consistent patron
    experience.
  - Partner with cross-functional teams to improve system
    usability, reduce operational friction, and enhance
    internal workflows.
  - Help ensure all commerce experiences meet accessibility
    standards and deliver a seamless, intuitive user
    experience.

  You'll be a fit if you bring:

  - Experience in building or contributing to digital commerce
    systems such as ticketing, e-commerce, payments, or
    subscription platforms.
  - 3+ years of software engineering experience.
  - Proficiency in modern web development technologies such as
    JavaScript or TypeScript, and frameworks such as React or
    Next.js.
  - Experience working with backend systems and APIs, including
    REST or GraphQL services.
  - Familiarity with integrating external systems such as
    payment gateways, CRM platforms, or ticketing systems.
  - Experience working with cloud environments such as AWS, GCP,
    or Azure.
  - Understanding of modern software development practices,
    including version control, testing, and CI/CD pipelines.
  - Strong problem-solving skills and the ability to debug
    complex systems across multiple integrations.
  - Ability to collaborate effectively with product, design, and
    engineering stakeholders.
  - Clear communication skills and the ability to explain
    technical concepts to non-technical audiences.
  - Experience with analytics, experimentation, or performance
    optimization is a plus.

  What is Lincoln Center for the Performing Arts? 

  Lincoln Center for the Performing Arts, Inc. (LCPA) is a
  cultural and civic cornerstone of New York City. We believe
  the arts play an important role in our lives: they nourish
  our hearts and minds, teach us valuable lessons and critical
  skills, and help us create community. We invite you to
  consider joining our talented, multi-faceted team.

  We are:  

  1. The manager of the 16-acre Lincoln Center campus

  -We are one of eleven amazing resident arts organizations

  2. A leading Arts Presenter.   

  -We curate numerous programs and performances, showcasing
  music, dance, and more

  3. An Education Hub.   

  -We have reached 20 million students, educators, principals,
  and community members

  Who are our people?  

  LCPA is a team of dreamers, collaborators, and entrepreneurs
  who use unique platforms in the heart of New York City and
  beyond to advocate for the transformative impact of artistic
  experiences.

  Lincoln Center People imagine and create in concert with
  this mission by founding President John D. Rockefeller III -
  "The arts are not for the privileged few, but for the many.
  Their place is not on the periphery of daily life, but at
  its center."   

  We welcome applicants from all sectors who agilely solve
  problems, show up as they are, and can't stop innovating.

