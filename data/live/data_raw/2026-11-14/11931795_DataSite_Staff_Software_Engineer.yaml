description: |
  About us

  Datasite is the essential infrastructure for M&A. Also
  comprising Grata, Blueflame AI, and Sherpany, we help
  dealbreakers find opportunities, manage transactions, and
  make key decisions.

  Whatever your talents, you can find a place for them here.
  Get involved in some of the biggest business ventures today.
  Work with other gifted people around the world. Follow your
  ambitions, or discover a whole new path.



  Can you help us simplify the complex, create great
  experiences, and deliver better outcomes? Then let's talk.

  Job Description:

  Why Engineering at Datasite

  Datasite's engineering organization builds the software the
  world's dealmakers depend on to find, evaluate, negotiate,
  and close transactions: secure virtual data rooms and AI-
  assisted diligence, AI-native deal sourcing and relationship
  intelligence, and private-company search and market data.

  Our engineers play a critical role in producing high-quality
  software solutions to support the Datasite product lines.
  This position requires close collaboration with our
  Professional Services teams, Product teams, and other
  members of our Engineering team to develop and implement
  software components and ensure the reliability and
  performance of the platform.

  We're looking for a Staff Software Engineer with strong
  product-engineering judgment and a solid foundation in
  backend, platform, distributed systems, or full-stack
  development. You'll turn ambiguous problems into secure,
  reliable production software, make pragmatic architecture
  calls, and use AI-assisted and agentic development tools to
  create real leverage, without losing ownership of what
  ships.

  Location: We are hiring in New York City and Minneapolis.
  Datasite is a hybrid company, with in-office collaboration
  on Mondays, Tuesdays, and Thursdays.

  What You Will Do

  - Own outcomes for a product domain or platform area spanning
    multiple teams — defining technical strategy, success
    metrics, and roadmap, and driving measurable improvement
    over time.

  - Set the architecture for scalable APIs, services, data
    platforms, and event-driven systems across team
    boundaries, and lead the most complex performance,
    scalability, and reliability work.

  - Raise the engineering bar organization-wide: establish
    standards, reusable platforms and patterns, and
    documentation practices, and lead efforts to simplify
    systems and retire technical debt.

  - Make and communicate high-leverage technical decisions with
    organization-wide impact across architecture, security,
    performance, cost, and scalability — anticipating risk and
    designing safeguards before they become incidents.

  - Partner with Product, Design, Machine Learning, Client
    Success, and engineering leadership to shape strategy,
    translate ambiguous business goals into multi-quarter
    technical plans, and align teams on execution.

  - Define how the organization adopts AI-assisted and agentic
    development - setting guardrails for verification,
    security, and human ownership of production decisions -
    and measure the leverage they actually create.

  - Mentor and grow senior engineers, influence technical
    direction across the organization, lead architecture
    reviews, and stay hands-on in the highest-impact work.

  What You Bring

  - Seasoned software engineer with experience building,
    scaling, and operating production systems, and a track
    record of leading technical initiatives across multiple
    teams.

  - Deep expertise in backend, platform, distributed systems, or
    full-stack product engineering, with a demonstrated
    ability to design systems that scale with product and
    organizational growth.

  - Expert programming ability in Python, Java, TypeScript,
    Kotlin, or a comparable modern language, with the ability
    to work effectively in Python-based systems and set
    language and framework direction for teams.

  - Extensive experience architecting and operating production
    APIs, services, data platforms, distributed workflows, and
    event-driven architectures at enterprise scale, including
    leading responses to complex incidents.

  - Deep fluency with AI-assisted development tools and agentic
    coding workflows, with experience defining how teams adopt
    them safely and effectively.

  - Excellent product sense and technical judgment, with a track
    record of shaping technical strategy, influencing product
    roadmaps, and defending decisions under scrutiny from
    senior stakeholders.

  - Exceptional written and verbal communication, including the
    ability to influence senior stakeholders, write clear
    technical strategy documents, and align teams on decisions
    and trade-offs.

  Nice to Have

  - Experience with M&A, virtual data rooms, private-market
    intelligence, financial services, enterprise SaaS,
    regulated data environments, legal technology, or other
    document-heavy workflows.

  - Experience with MongoDB or a similar NoSQL database.

  - Experience with AWS, Azure, or Google Cloud.

  - Experience with AI-enabled product capabilities such as
    retrieval, workflow automation, structured outputs,
    evaluation frameworks, tool use, or human-in-the-loop
    review.

  The base salary range represents the estimated low and high
  end for this position based on a good faith assessment of
  the role and market data at the time of posting. Consistent
  with applicable law, each candidate’s compensation offer may
  vary and will be determined based on but not limited to,
  your geographic region, skills, qualifications, and
  experience along with the requirements of the position. This
  position may be eligible for bonuses, commissions, or
  overtime if applicable. Benefits include health insurance
  (medical, dental, vision), a retirement savings plan, paid
  time off, and other employee benefits. Specific details will
  be provided during the interview process. Datasite reserves
  the right to modify this pay range at any time.

  $170,000.00 - $297,200.00

