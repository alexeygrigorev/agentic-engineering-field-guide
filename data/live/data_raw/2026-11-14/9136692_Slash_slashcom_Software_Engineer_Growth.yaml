description: |
  About Slash

  Slash is building the future of business banking, one
  industry at a time. We believe businesses deserve financial
  infrastructure tailored to how they actually operate. That's
  why we're creating a new category of business banking. We
  combine the reliability of traditional banking (high yields,
  competitive rewards, and comprehensive security) with
  industry-specific features that make businesses more
  efficient, more competitive, and more profitable.

  Started in 2021, Slash is one of the fastest growing
  fintechs in the world and we power over ten billion dollars
  a year in business purchasing across numerous industries. We
  recently raised a $100M Series C led by Ribbit Capital with
  participation from Khosla Ventures, Goodwater Capital, NEA,
  and Y Combinator, accelerating our expansion into new
  markets and products.

  Slash is headquartered in San Francisco, and has a strong
  in-person culture.

  About the role

  This is a highly technical, high-velocity Software Engineer
  role on our growth team. This team is our PMF engine and is
  responsible for making bets and building features to break
  into new markets. You will build on top of our core platform
  and ship new features in hours to days, not weeks. Growth
  engineers at Slash deeply understand the business and work
  directly with customers every day. You will partner closely
  with our top AEs to build, iterate, and ship vertically
  integrated solutions for customers and prospects, then turn
  those into scalable platform features. You will also be
  joining a world-class growth org that has scaled to $300M+
  in revenue with a team of less than 10. Ultimately, we are
  looking for people with extreme drive, strong curiosity, and
  a bias toward action.

  What you'll do

  • Deliver end to end software solutions for our customers,
  understand pain points, scope product specs, and ship
  solutions that close deals and activate accounts •
  Generalize custom work into platform features, take a one-
  off integration or workflow and turn it into something
  thousands of Slash customers can use • Partner closely with
  Sales and Customer Success across the full lifecycle — from
  prospect to rollout to expansion

  We're looking for someone who

  • Moves fast and defaults to action • Is highly customer-
  oriented and excited to work directly with users • Has
  strong product + business intuition (cares about outcomes,
  not just code) • Brings intensity and hustle in a high-
  velocity environment • Has solid technical foundation and
  can ship end-to-end quickly • Thrives in ambiguity and takes
  full ownership

  What's in it for You:

  - Opportunity for high growth
  - High autonomy + ownership culture
  - Comprehensive health + benefits plan
  - Working out of our downtown San Francisco office space
  - Unlimited PTO
