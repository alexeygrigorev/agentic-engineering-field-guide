  About MoneyGram

  MoneyGram is a global payments network built to move money
  across borders with speed, simplicity and trust. Its
  omnichannel platform empowers consumers, developers and
  agents to transfer cash, fiat and stablecoin however it
  works best for them.

  The company serves over 50 million customers a year across
  200+ countries and territories, nearly half a million retail
  locations and a rapidly expanding digital ecosystem reaching
  billions of devices. As one of the most recognized and
  trusted names in global payments, MoneyGram continues to
  reinvent how money moves - helping people around the world
  support their loved ones and build better futures.

