  Senior Software Engineer - Backend



  About the Role

  We are looking for a highly motivated Senior Software
  Engineer to join the MoneyGram core transaction and API
  development team. You will play a key role in building
  scalable, high-performance, and secure services while
  mentoring junior engineers and influencing technical
  direction. The ideal candidate is a strong problem-solver
  with expertise in Java, distributed systems, APIs,
  databases, and cloud-native technologies.



  What you will do:

  - Lead the design and implementation of complex technical
    solutions, translating business requirements into scalable
    and maintainable architectures.

  - Contribute to and influence system architecture,
    microservices design, API design, event-driven
    architecture, and integration patterns.

  - Operate effectively across architecture, implementation,
    delivery, and operational excellence working as part of a
    team in an agile environment, providing extreme ownership
    in what you do.

  - Work closely with product managers, engineers, and QA to
    deliver end-to-end solutions.

  - Automating repeated test, build, and deploy procedures

  - Drive engineering best practices and coding standards.



  What we are looking for

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or equivalent experience.

  - 10+ years of backend engineering experience with a focus on
    Java.

  - Strong expertise in Spring Boot, RESTful services, SOAP,
    WebSphere and microservices architecture.

  - Experience with cloud platforms (AWS, GCP, or Azure).

  - Proficiency with CI/CD pipelines, Git, Docker, and
    Kubernetes.

  - Experience with messaging platforms (Kafka, RabbitMQ, etc.).

  - Experience with product management processes and tools
    (Agile methods, Kanban, etc.)

  - Problem solver who can tackle complex technical challenges

  - Experience using AI-assisted development tools such as
    Claude, Cursor or Augment AI to accelerate coding,
    testing, documentation and troubleshooting.

  - Experience leading the design, development and
    implementation of complex systems.

  - Experience with Unit Testing (JUnit, Mockito, Groovy)

  - Experience with Cloud Development, Deployment, and
    Maintenance (AWS, GCP)

  - Knowledge / Experience with Relational Database, NoSQL
    (Couchbase, Mongo) db and database optimization.

