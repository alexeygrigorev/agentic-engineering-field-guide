description: |
  About Nevis

  Nevis is building the world’s first AI wealth management
  platform. We are building the system financial advisors will
  run on for the next decade. Our AI completes work, automates
  workflows end to end, and frees advisors to spend more time
  with clients. In the future, every wealth management firm
  will run on Nevis.

  Nevis was founded by an exceptional team of ex-Revolut
  executives and has raised $110 million in just two years,
  including a $70 million Series B led by EQT Ventures &
  Growth, backed by world-leading investors including Sequoia
  Capital, ICONIQ, and Ribbit.

  The Role

  We are looking for a Software Engineer (Frontend) who
  obsesses over the details, who sees interfaces as craft, not
  just code.

  You’ll play a key role in designing and developing Nevis’
  core product – the world’s first AI-native wealth management
  platform – and will bring our intelligent workflows to life
  for financial advisors across the globe.

  You'll work closely with designers and backend engineers to
  bring ideas to life — fast. If you love modern web tech,
  care about design quality, and want to ship the product that
  matters, you'll thrive here.

  What You’ll Do

  - Collaborate with designers to build features that look and
    feel exceptional.
  - Turn complex AI and financial data into interfaces that just
    make sense.
  - Write clean, tested, reusable code – and help others do the
    same.
  - Shape our design system and raise the bar for frontend
    craft.
  - Prototype quickly, learn from feedback, and iterate.
  - Work with backend engineers to integrate APIs and bring data
    to life.
  - Obsess over performance, accessibility, and the details
    users notice.

  Who You Are

  - You have deep experience with TypeScript and understand how
    JavaScript really works
  - You have extensive experience with React and are eager to
    use cutting-edge features
  - You think deeply about component design: composable APIs,
    clear boundaries, and abstractions that other developers
    love to use
  - You understand the modern web: browsers, performance, and
    what makes interfaces feel fast
  - You're comfortable with modern tooling: Vite, SCSS,
    component libraries, monorepos
  - You know how to ship features from scratch and get apps live

  - You obsess over craft: clean code, polished UI, and
    experiences users love
  - You move fast, take ownership, and learn constantly
  - You make the team better: lifting others up while pushing
    for high standards
  - You leverage AI to work smarter and solve problems faster
  - You're a strong communicator, fluent in English and
    comfortable working async
  - You give and receive feedback with honesty and care

  Nice to Have

  - A portfolio or GitHub that shows what you've built.
  - Strong instincts for debugging and performance tuning.
  - Exposure to AI-powered interfaces or data-rich products.

  Why Join Nevis?

  - Work alongside a high-calibre founding team backed by some
    of the best investors in the world.
  - A fast-paced, high-growth environment with the opportunity
    to shape how the business operates.
  - Be part of a mission-driven company transforming the wealth
    management industry with huge potential for global impact.
  - 25 days’ annual leave.
  - Private medical insurance.
  - Competitive salary and benefits package, including company
    equity.
