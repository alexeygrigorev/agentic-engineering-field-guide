description: |
  About Mercor

  Mercor’s mission is to organize human intelligence for the
  AI economy. We build the infrastructure that enables
  frontier AI labs and enterprises to train, evaluate, and
  improve AI on real-world professional work. More than five
  million experts have joined our network, and we pay out over
  $5 million daily for their knowledge and expertise. We built
  our training and evaluation infrastructure alongside the
  world’s leading AI labs. Now, we’re bringing those
  capabilities to enterprises across industries, enabling them
  to train, evaluate, and improve AI using their own expertise
  and standards. Our APEX benchmarks measure how AI performs
  on economically valuable work, while our enterprise
  evaluations and post-training capabilities turn those
  insights into measurable improvements across real-world
  workflows. Our work sits at the intersection of frontier AI,
  human expertise, and real-world application. We’re solving
  problems few companies have encountered, with the
  opportunity to influence what the world’s most advanced AI
  systems become capable of doing. We’re looking for people
  who bring different perspectives, take ownership, exercise
  sound judgment, and hold themselves to an exceptionally high
  standard. You’ll have the opportunity to do consequential
  work alongside talented colleagues who challenge one
  another, collaborate openly, and share a commitment to
  excellence. Mercor is profitable and recently raised a $750
  million Series D at a $20 billion valuation. We work in
  person five days a week in San Francisco, New York, and
  London.

  We're building the infrastructure that powers one of the
  world's largest expert networks and delivers expert data at
  unprecedented scale. We're looking for exceptional
  engineering leaders to help us protect the integrity of that
  ecosystem — building the fraud, risk, and compliance systems
  that make a global expert marketplace trustworthy at scale.

  We value builders who have repeatedly chosen difficult
  problems, thrived in environments with high expectations,
  and can point to concrete examples where their leadership
  materially changed the trajectory of a team, product, or
  company.

  Why This Role

  We're still early.

  Fraud is one of Mercor's most important business challenges.
  Every day, we process enormous volumes of applications,
  assessments, identity verifications, and work activity
  across a global talent network. Protecting that ecosystem
  requires sophisticated systems that can identify fraudulent
  behavior, evaluate risk, and make accurate decisions at
  scale — and the playbooks for doing it on an AI-native
  expert marketplace don't yet exist.

  Fraud is an adversarial problem. The solutions that work
  today may not work six months from now. You'll lead
  engineering efforts focused on:

  - Fraud detection and platform integrity — identity
    verification, abuse prevention, risk scoring, and the LLM-
    powered decision engines and evaluation pipelines that
    catch fraudulent behavior as attackers adapt
  - Compliance and operational infrastructure — the reliability,
    scalability, and core foundations that allow Mercor to
    operate globally and meet the obligations of working with
    the world's leading AI organizations

  You'll be responsible for building systems that sit at the
  center of the AI ecosystem and protect the trust that makes
  expert knowledge usable at scale.

  What You'll Do

  - Lead and grow a high-performing team of engineers
    responsible for fraud detection, identity verification,
    abuse prevention, and platform integrity
  - Define and execute Mercor's fraud and compliance engineering
    roadmap in partnership with product, operations, and
    company leadership
  - Build systems that generate fraud signals, evaluate risk,
    make automated decisions, and continuously improve through
    human review and feedback loops
  - Drive the development of AI-powered detection systems,
    including LLM-based decision engines, scoring models, and
    review workflows
  - Establish rigorous evaluation frameworks to measure
    detection performance, confidence calibration, false
    positive/negative tradeoffs, and business impact
  - Recruit exceptional engineers and raise the talent bar
    across the organization
  - Partner closely with product, operations, and company
    leadership
  - Drive engineering excellence, velocity, and operational
    rigor in an adversarial, fast-moving domain

  Basic Qualifications

  - Educational Requirements: Bachelor’s Degree in Computer
    Science or a related technical degree such as Electrical
    Engineering, Physics, Mathematics or Statistics
  - 5+ years of backend software engineering experience building
    and operating production systems at scale
  - 3+ years of engineering management experience leading high-
    performing software engineering teams
  - Experience leading teams through periods of significant
    scale, ambiguity, or rapid change, with clear examples of
    the impact you've personally driven

  Nice-to Have Qualifications

  - 2+ years delivering infrastructure for fraud, trust &
    safety, risk, identity, payments, abuse prevention, or
    other adversarial domains
  - 2+ years working with machine learning, AI systems, decision
    engines, or risk-scoring platforms

  Benefits:

  - Generous equity grant vested over 4 years
  - Health, dental, and vision insurance
  - 401(k) with company match
  - Unlimited paid vacation and sick days
  - Parental leave for birthing and non-birthing parents
  - Free mental health services
  - $200 monthly wellness reimbursement
  - $1.5K monthly meal stipend
  - $200 monthly laundry reimbursement
  - Free Equinox membership
  - Up to $15K relocation bonus

