description: |
  About IMG Academy IMG Academy is the world’s leading sports
  education brand, providing a holistic education model that
  empowers student-athletes to win their future while
  preparing them for college and for life. IMG Academy has
  been nationally recognized by organizations including Sports
  Business Journal, USA Today, and the Best and Brightest
  Companies to Work For for its workplace culture, innovation,
  and commitment to developing people both on and off the
  field.



  IMG Academy provides growth opportunities for student-
  athletes and partners through an innovative suite of on-
  campus and online experiences:

  - Boarding school and camps, delivered on a state-of-the-art
    campus in Bradenton, Florida
  - Online coaching through IMG Academy+, focused on personal
    development through the lens of sport and performance
  - Online college recruiting through NCSA College Recruiting
    and SportsRecruits, providing industry-leading recruiting
    education, tools, and access to a network of more than
    40,000 college coaches for student-athletes, families,
    club coaches, and event operators
  - Elevate by IMG Academy, a performance and personal
    development solution that delivers mindset, leadership,
    and wellbeing programming to schools, colleges, and
    organizations through a combination of digital content and
    immersive experiences



  Position Summary:

  The Software Engineering Manager role is responsible for
  leading a team of software engineers working to implement
  features and functionality on our mobile application and
  supporting systems. In this role, you’ll combine strong
  technical judgment and hands on coding with a genuine
  passion for developing people - driving both engineering
  excellence and meaningful product outcomes that impact
  athletes’ futures. You will work closely with product to
  negotiate the scope and shape the features to deliver
  business value. Members of the team are responsible for the
  development, maintenance, and operation of our Reactive
  Native mobile application and its related service as well as
  administration web platform. Software developed by this team
  includes a React Native mobile application deployed to both
  the iOS and Android stores, as well as backend services in
  Typescript, Go or Python, deployed via Kubernetes to AWS
  infrastructure, and communicating with multiple backing
  services (PostgreSQL, Redis, OpenSearch. Kafka) and SaaS
  tools (Auth0, Shopify, Contentful).



  Position Responsibilities:

  People Management & Coaching

  - Lead, mentor, and grow a team of 4 - 6 software engineers
    across varying experience levels

  - Own the full employee lifecycle for your team: hiring,
    onboarding, performance management, career development,
    and retention

  - Conduct regular 1:1s and provide direct, actionable feedback
    that helps engineers grow

  - Work with other technical leaders to create a culture of
    innovation, quality, and continuous improvement.

  Technical Leadership

  - Work across engineering teams to set and uphold engineering
    standards for code quality, testing, security, and system
    design

  - Participate in and guide architectural decisions, ensuring
    solutions are scalable and maintainable

  - Stay technically engaged and meaningfully review design
    documents, unblock engineers, and assess trade-offs —
    without being in the critical path of delivery

  - Champion engineering best practices across the broader
    engineering organization

  - Drive reduction of technical debt and proactively manage
    platform health

  Delivery & Execution

  - Work with your engineers, in both a hands-on and leadership
    capacity, to develop loosely coupled, well tested, and
    maintainable code

  - Use AI tools such as Claude Code, Copilot or Cursor to
    accelerate development

  - Collaborate with the Product Management team to craft
    technical solutions that meet internal and external
    customer needs.

  - Collaborate with Infrastructure Engineering and Security
    teams to employ standard infrastructure components,
    release code with increasing volume and velocity in a
    self-service fashion and meet company security standard.

  - Identify and remove blockers, manage dependencies across
    teams, and escalate risks early.

  - Balance short-term delivery needs with long-term platform
    investments

  - Provide on-call support on a rotating basis with your team
    (roughly 1 week per month; very low incident rate).



  Knowledge, Skills and Abilities:

  - 5+ years minimum experience in React Native mobile
    engineering

  - Experience maintaining and extending mobile back-end or
    other API applications in an engineering management or
    tech lead role

  - Experience deploying binaries to the Google Play and iOS app
    stores. Experience using Expo built tool a plus

  - Experience with cloud-based development environments
    (primarily AWS)

  - Experience with 12-factor applications and modern
    development practices.

  - Experience with automated infrastructure provisioning and
    continuous deployment.

  - Familiarity with relational databases (e.g. Postgres) and
    non-relational data stores (e.g. Redis, OpenSearch)

  - Familiarity with event-driven application architecture
    concepts.

  - Familiarity with software monitoring, telemetry, and
    incident response handling

  - Excellent communication skills; able to translate technical
    concepts for non-technical stakeholders and business
    context for engineers

  - Experience with generative AI programming assistants

  - Experience working with and applying engineering metrics to
    increase the effectiveness of an engineering team

  - Experience working with product metrics to deliver business
    value

  - Ability to provide on-call support on a rotating basis is
    required.

  #LI-TR1

  Background Requirements:

  - Requires a background check upon offer

  Some positions, particularly those that have
  responsibilities working with student-athletes and
  supporting IMG Academy on campus with events involving
  minors, may require a L2 background screen. The requirement
  will be communicated during onboarding, and instructions for
  submission of level 2 backgrounds will be provided. Learn
  more about the screening process and requirements by
  visiting the Florida Care Provider Background Screening
  Education & Awareness website:
  https://info.flclearinghouse.com.



  Benefits:

  As a full-time member of our team, you will enjoy a
  comprehensive offering listed below. Connect with your
  talent acquisition specialist to learn more about benefits
  for our part-time roles.

  - Comprehensive Medical, Dental and Vision
  - Flexible Spending Account and Health Savings Account options
  - 401k with an Employer Match
  - Short Term and Long Term Disability
  - Group and Supplemental Life & AD&D
  - Gym Discount Program
  - Pet Insurance
  - Wellbeing Program
  - and more!

  Don’t meet every single requirement? We are dedicated to
  building a diverse, inclusive, authentic workplace, so if
  you’re excited about this role but your past experience
  doesn’t align perfectly with every qualification in the job
  description, we encourage you to apply anyway. You may be
  just the right candidate for this or other roles.



