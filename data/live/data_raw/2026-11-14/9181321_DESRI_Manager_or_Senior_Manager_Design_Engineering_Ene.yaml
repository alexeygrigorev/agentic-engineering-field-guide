description: |
  About DESRI

  DESRI (formerly D. E. Shaw Renewable Investments) is a
  market-leading owner and operator of renewable energy
  projects throughout the United States. We have acquired or
  developed approximately 13 gigawatts of contracted capacity
  across a portfolio of over 85 renewable energy projects in
  24 states.



  At DESRI, our culture is grounded in rigorous analytics and
  thoughtful risk-taking, with a strong emphasis on
  creativity, intellectual curiosity, and continuous
  improvement. We operate with lean teams that prioritize
  efficiency and minimize unnecessary bureaucracy, enabling
  individuals to take ownership and move quickly. We value
  open, constructive dialogue and believe it leads to better
  outcomes. Above all, we are driven to go the extra mile and
  support one another, fostering a collaborative environment
  built on accountability, integrity, and care.

  About the role

  DESRI is seeking a talented and highly motivated individual
  to join its Engineering and BESS team as a Manager or
  Director, Battery Engineer, title to be commensurate with
  experience. This individual will serve as a technical
  authority for battery energy storage system design,
  integration strategy, and engineering quality across the
  development, procurement, and execution of utility-scale
  BESS projects.

  The role offers the opportunity to shape how DESRI
  specifies, evaluates, and integrates battery storage systems
  across both fully integrated OEM solutions and DC block
  configurations where DESRI leads the integration strategy.
  You will work closely with procurement, pre-construction,
  construction, engineering, and external suppliers to ensure
  projects are technically sound, executable under EPC
  delivery models, and aligned with DESRI’s performance and
  reliability expectations.

  What you'll do

  You will lead the technical definition and engineering
  oversight of DESRI’s battery energy storage system balance
  of system scope from early development through turnover to
  operations. Responsibilities include defining technical
  standards, project design requirements, and specifications,
  reviewing EPC and OEM deliverables for compliance with
  project requirements, resolving interface issues, and
  supporting cost optimization efforts as the battery subject
  matter expert.

  Responsibilities include:

  - Establish technical standards, basis-of-design criteria, and
    specification packages for battery systems and related
    plant interfaces.
  - Define project-level BESS design criteria, including LV
    collection systems, inverter strategy, layout
    optimization, auxiliary power optimization, and key
    integration assumptions.
  - Translate and ensure compliance with project constraints,
    interconnection, offtaker, and AHJ requirements, and
    operating use cases into clear BESS plant design
    requirements.
  - Lead technical review of OEM proposals, design packages,
    exceptions, deviations, and submittals.
  - Define scope boundaries and interface matrices among OEM,
    EPC, SCADA/controls, and DESRI.
  - Support technical diligence for equipment selection, without
    owning commercial negotiations or sourcing process
    administration.
  - Partner with the BESS Procurement Engineer to ensure
    supplier technical schedules reflect DESRI’s design intent
    and interface requirements.
  - Serve as the technical escalation point for BESS-related
    RFIs, design clarifications, and field engineering issues.
  - Review supplier and EPC technical changes for consistency
    with design intent and project requirements.
  - Define the technical basis for (non-SCADA) commissioning and
    performance testing of the BESS package.
  - Support development and validation of test protocols,
    acceptance criteria, and performance verification logic.
  - Help translate operating lessons learned into updated
    specifications, design standards, and supplier
    requirements for future projects.

  Qualifications

  - An undergraduate degree in engineering, electrical
    engineering, power systems, or a related technical field.
  - Significant experience in utility-scale battery energy
    storage engineering, system integration, design review, or
    product engineering.
  - Candidates should have a strong technical foundation in
    battery energy storage systems and experience supporting
    the design, construction, operation, troubleshooting, or
    lifecycle management of complex power systems.
  - Strong working knowledge of, BMS architecture,
    PCS/inverters, EMS/plant controls, SCADA interfaces, fire
    safety systems, transformers, switchgear, and medium-
    voltage plant equipment.
  - Demonstrated experience developing technical specifications,
    reviewing OEM/EPC designs, and managing multi-disciplinary
    design compliance.
  - Experience with system integration across multiple suppliers
    and disciplines, particularly for utility-scale BESS
    projects.
  - Strong analytical skills, including the ability to assess
    technical submittals, test results, and performance data.
  - Excellent communication and documentation skills, with the
    ability to work effectively across development,
    procurement, construction, commissioning, and external
    vendors.

  Preferred Experience

  - Experience with both fully integrated BESS OEM offerings and
    DC block / split-package delivery structures.
  - Experience supporting FAT, SAT, commissioning, and
    performance testing for utility-scale battery projects.
  - Familiarity with project contracts and technical exhibits
    sufficient to support, but not lead, technical-commercial
    negotiations.
  - Experience with fire protection engineering deliverables,
    fire alarm design, NFPA 72 and NFPA 855 requirements for
    utility-scale BESS sites.

  At DESRI, we consider a wide range of factors to determine
  your compensation. We rely on market indicators and consider
  your specific job family, background, location, skills, and
  experience. The expected annual base salary for this
  position is $150,000 to $180,000. Our compensation and
  benefits package includes variable compensation in the form
  of a year-end bonus, guaranteed in the first year of hire,
  and benefits including medical and prescription drug
  coverage, 401(k) contribution matching, paid time off,
  wellness reimbursement, family building benefits, and a
  charitable gift match program.
