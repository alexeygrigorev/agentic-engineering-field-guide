description: |
  ⚖️ About Us

  DISCO is shaping the future of litigation with a unique
  combination of cutting-edge technology and expert
  professional services, designed to handle the most complex
  legal matters.

  Our award winning, cloud native platform empowers legal
  teams to instantly process, collect, and search through
  millions of documents for relevant case data. The documents
  are heterogeneous, comprising of email archives, chat
  exports, audio, video, and native office files. Our
  customers, often handling sensitive and privileged material,
  rely on us to deliver a platform with robust security
  controls, strict data privacy, and data residency guarantees
  that reflect the jurisdictions they operate in.

  Over 170 engineers make up our global engineering
  organisation, located in three technical hubs - India, UK
  and the US. Our engineers work collaboratively to solve
  complex technical challenges and enhance our platform, all
  with the purpose of improving our customers’ experience.

  💻 The Role

  We’re now expanding our UK hub and this is an exciting
  moment to join us as we grow our UK presence. You will join
  one of our UK-based teams working to enhance our platform.

  Day to day, you will own complex technical work end to end:
  breaking down ambiguous problems, making deliberate trade-
  off decisions, and shipping well-considered code that
  improves the outcomes of our customers. You will contribute
  to architectural design, keep an eye on the broader health
  of the systems you work on, and raise issues, in
  requirements, design, or code, before they become problems.

  You will also invest time in the people around you, whether
  that is through code review, pairing, or helping less
  experienced engineers grow. As well as working closely with
  other engineers in our UK hub, you will collaborate with
  your colleagues based in India and the US.

  We embrace AI-first development, using AI tooling throughout
  the engineering lifecycle to move faster and build better
  software. At the same time, our engineers own what they
  ship: every service running in production is the direct
  responsibility of the team behind it.

  🛠️ Our Stack:

  - AWS, PostgreSQL, Redis, Docker, Kafka, Temporal, Datadog,
    Terraform, gRPC, GraphQL, Kotlin

  📋 You should apply if you:

  - have strong demonstrable experience and passion for backend
    development
  - like working together in multidisciplinary teams to deliver
    solutions for customers
  - are proficient in designing and architecting microservices
    systems, including distributed data management and event-
    driven architectures
  - are skilled in designing and operating containerised
    software hosted in a Cloud Provider (AWS, Azure, or GCP)
  - have experience with cloud-based data storage, such as:
    Relational Databases, NoSQL Stores, data caches, etc
  - have experience writing strongly-typed languages in the Java
    family (Java, Scala, Kotlin)

  Tip for candidates: If you’re unsure whether to apply… do.
  We know great people don't always tick every box.

  ✨ Would be amazing if you have any experience:

  - with petabyte-scale, high-availability software systems
  - writing software for regulated industries

  🌟 What we can offer you:

  - £90 to £105 + performance related bonus + Equity
  - Two days per week, from our modern London office (we ❤ ️ the
    breakfast).
  - We also offer a fully remote working option for those who
    prefer it.
  - Opportunity to share in the success of the company with
    equity RSU grants
  - Your own personalised growth development plan
  - Benefits:

  Authorization to Work in the UK: Candidates must be legally
  authorized to work in the United Kingdom without sponsorship
  now or in the future. DISCO is not currently sponsoring
  visas.

  We are an equal opportunity employer and value diversity. We
  do not discriminate on the basis of race, religion, color,
  national origin, gender, sexual orientation, age, marital
  status, veteran status, or disability status.

  About DISCO

  DISCO provides a cloud-native, artificial intelligence-
  powered legal solution that simplifies ediscovery, legal
  document review and case management for enterprises, law
  firms, legal services providers and governments. Our
  scalable, integrated solution enables legal departments to
  easily collect, process and review enterprise data that is
  relevant or potentially relevant to legal matters.

  At DISCO, we believe AI is a core enabler of how work gets
  done. All employees are expected to proactively adopt and
  responsibly use AI tools to drive efficiency, improve
  outcomes, and continuously evolve how they operate in their
  role.

  Are you ready to help us fulfill our mission to use
  technology to strengthen the rule of law? Join us!

  We are an equal opportunity employer and value diversity. We
  do not discriminate on the basis of race, religion, color,
  national origin, gender, sexual orientation, age, marital
  status, veteran status, or disability status.
