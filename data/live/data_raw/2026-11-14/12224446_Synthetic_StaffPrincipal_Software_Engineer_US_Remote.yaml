description: |
  Staff/Principal Software Engineer (US Remote)

  About Synthetic



  Building a software product has never been easier. But
  running the business side is still tedious as hell.



  From contracts, to billing, to getting paid, to keeping the
  books, Synthetic handles the financial side of a software
  business from start to finish, so founders can get back to
  building.



  The software companies that we're selling to have intense
  accounting pain. They have a QuickBooks account, a Stripe
  account, and an unholy menagerie of spreadsheets and agent
  workflows holding it together.



  Instead of trying to throw an AI agent at broken software to
  try to fix it, we rebuilt all the software from the ground
  up. We rebuilt contracts, accounting, billing, invoicing,
  and payments. Then we wired up agents that do the busywork
  in between. The result is a tailor-made solution for
  software companies that "just works" out of the box. We can
  guarantee our customers that the numbers are correct,
  because we own every system that touches the numbers. And it
  looks visually stunning.



  You can read more about us here. We recently raised $10M
  from investors like Khosla Ventures and Tobi Lütke. We're
  here to build a company that wins big, which is why we work
  in-person in our San Francisco office 6 days a week. But we
  care about winning, not larping, so we're flexible on hours.

  About the role

  We'll be launching the product soon. We're hiring engineers
  to join our 7 person team to build faster. You'll report
  directly to the founder.

  We ship daily in TypeScript, on SvelteKit and Bun. You'll be
  expected to own new features from front to back (with help
  from a designer) and bring them to life directly with
  customers. Remote engineers also join us in person in San
  Francisco one week per month

  We have a high engineering bar and care a lot about systems
  design and code quality.

  Job requirements

  - 5+ years of software engineering experience
  - A pragmatic approach to building fast at an early-stage
    company

  Compensation

  - $250K – $300K salary
  - 0.7% – 1% fully diluted equity
  - Health benefits
  - This role requires US work authorization. We don't sponsor
    visas for this role. Check out our SF in-person role
    instead.
