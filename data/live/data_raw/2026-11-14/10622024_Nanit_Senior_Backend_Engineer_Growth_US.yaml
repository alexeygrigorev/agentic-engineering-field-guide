description: |
  Nanit is moving families beyond overwhelm by transforming
  how parents understand their baby's early years. We combine
  advanced AI, real-world data from billions of sleep hours,
  and clinical expertise to deliver the clarity and confidence
  every parent deserves. Trusted by over one million families
  and backed by $125M in funding, we're building an entirely
  new category: predictive parenting intelligence.

  Here, your work directly impacts millions of families. Our
  team of scientists, engineers, and parents is small but
  mighty - we share a mission to make early childhood easier,
  healthier, and more connected. If you want to work on
  technology that genuinely matters, join us.

  You'll be the founding backend engineer on a new Growth team
  - a cross-functional squad owning the full customer funnel,
  from a parent first considering Nanit through purchase,
  subscription, engagement, and eventually referring to us or
  buying again. You'll also be the first R&D engineer based at
  our US site, hybrid, with your manager and the rest of the
  team in a different time zone - so you'll need to hold
  context, make decisions, unblock yourself, and know when a
  question is worth raising rather than waiting on a sync.
  Your closest day-to-day partners will be mobile engineers
  and product managers

  What You'll Be Doing

  - Own the backend behind growth bets. Build and ship the
    services powering paywalls, subscription tiering,
    onboarding journeys, in-app messaging, referral mechanics,
    trial models, and checkout bundling.
  - Make growth measurable. Build and extend the experimentation
    and instrumentation layer - feature flags, experiment
    assignment, event tracking - so every bet the team makes
    can be evaluated on real data rather than opinion.
  - Work end to end across the funnel. Move between acquisition,
    activation, and retention work as the roadmap demands,
    rather than owning a single narrow surface.
  - Partner tightly with mobile and product. Most of what you
    build is consumed by our iOS and Android apps. You'll
    design API contracts in conversation with the engineers
    using them and with the PMs shaping the experiments.
  - Operate with high agency. Take ambiguous problems, decide on
    an approach, communicate it clearly in writing, and ship.
    Escalate deliberately, not by default.
  - Set the pattern for US engineering at Nanit. How you work -
    documentation, async communication, on-call, review habits
    - becomes the template for everyone who follows.
  - Anchor on-call coverage in your time zone. Be first
    responder for production alerts during your working hours,
    extending the backend group toward true follow-the-sun
    coverage. Triage, mitigate, escalate what you can't, and
    hand off open threads in writing.
  - Contribute to the backend guild. Help drive best practices,
    guidelines, and standards across R&D, and keep the US
    perspective represented in them.

  Qualifications

  - Professional Experience: 5+ years of backend software
    development with strong coding skills and solid experience
    in software design and architecture.
  - Proven Autonomy: Demonstrated success working with
    significant independence - ideally in a distributed team
    with limited timezone overlap with your manager or peers.
  - Written Communication: Excellent asynchronous communication.
    You write clearly enough that decisions and context
    survive without a meeting.
  - Product Mindset: Comfort with ambiguity and with shipping to
    learn. You care about the outcome metric, not only the
    ticket.
  - High-Scale Systems: Experience with critical production
    systems and techniques like load balancing, caching, and
    distributed systems.
  - Web Services: Proficiency designing and maintaining APIs
    consumed by mobile clients (REST, gRPC, WebSocket).
  - Experimentation and Analytics: Hands-on experience with A/B
    testing infrastructure, feature flags, and event
    instrumentation (e.g., Unleash, Mixpanel).
  - Testing: Solid experience in testing methodologies and test
    automation frameworks.
  - Monitoring and Observability: Proficient with tools like
    Grafana and Prometheus.
  - Delivery Track Record: Proven experience delivering backend
    projects successfully.
  - Agile Familiarity: Knowledge of Agile methodologies.
  - Containers and Orchestration: Hands-on experience with
    Docker and Kubernetes is an advantage.

  Preferred Skills

  - Experience with consumer subscription products - billing,
    plan tiering, App Store and Google Play in-app purchases,
    or Stripe.
  - Prior work on a growth, monetization, or lifecycle team.
  - Ability to independently take a concept from research to
    production.
  - Enthusiasm for new technologies and willingness to explore
    them.
  - Commitment to well-crafted and rigorously tested code.
  - Willingness to travel to Tel Aviv for onboarding and
    periodically thereafter.

  Why You’ll Love Working Here:

  - Hybrid in-office schedule
  - Remote work from home month in August
  - Flexible PTO (we trust you to take the time you need)
  - Equity options so you can share in our growth
  - Paid parental leave for all new parents
  - Employee discounts on Nanit products
  - Work from home stipend
  - Monthly team events

  What We Offer

  We provide an innovative and inclusive work environment,
  fostering a culture of continuous learning and growth. We
  believe in productivity rather than hours on the clock and
  value collaboration and innovative thinking. We take pride
  in our customer satisfaction and believe that our success
  comes from delivering exceptional value to our customers.

  EEO, Salary and Location:

  This is a hybrid role that will require prospective
  candidates to be in our NYC office 2-3 days per week.

  Salary Range: $180K to $210K base salary + equity and
  benefits. The base pay is one component of Nanit's total
  compensation package, which may also include access to
  healthcare benefits, a 401(k) plan, short-term and long-term
  disability coverage, and basic life insurance. Ultimately,
  in determining your pay, we'll consider your location,
  experience, and other job-related factors.

  We are proud to be an equal-opportunity employer. We provide
  employment opportunities without regard to age, race, color,
  ancestry, national origin, religion, disability, sex, gender
  identity or expression, sexual orientation, veteran status,
  or any other protected class.
