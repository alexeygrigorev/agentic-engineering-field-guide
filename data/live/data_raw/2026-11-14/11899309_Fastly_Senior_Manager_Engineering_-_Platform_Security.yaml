  Senior Engineering Manager, Platform Security

  The Platform Security function at Fastly plays a critical
  role in maintaining and evolving the platform that powers a
  significant portion of internet traffic worldwide. This
  function delivers tooling and PKI solutions across a global
  network that spans six continents and boasts over 353
  terabits per second of connected capacity.

  As the Senior Engineering Manager of the Platform Security
  team, you will oversee and scale the technical leadership
  across multiple engineering projects responsible for
  foundational infrastructure services. You will be
  responsible for defining the multi-year technical vision and
  ensuring strategic alignment with executive leadership. You
  will foster a culture of technical rigor, operational
  excellence, and innovation across the entire platform
  domain, moving beyond single-team execution to driving
  cross-organizational advancements.

  This is not a traditional "keep the lights on" operational
  role. Reliability is critical, but the real focus here is on
  innovation—driving strategic improvements, building
  foundational infrastructure for the future, and shaping how
  secure orchestration and trust services evolve at Fastly and
  beyond.

  What You'll Do:

  - Define the long-term strategic vision and multi-year
    technical roadmap for the Platform Security domain,
    ensuring these investments align with Fastly’s overall
    business and security objectives.
  - Oversee and develop a high-performing team that includes
    engineers and principal-level individual contributors,
    focusing on organizational structure, talent development,
    and scaling team capabilities to meet future demand.
  - Collaborate with cross-functional stakeholders using a
    product-owner mindset to define clear roadmaps and
    priorities.
  - Drive organizational-wide adoption of best practices for
    operational excellence, reliability, and security,
    establishing metrics and accountability across all
    platform services.
  - Clearly communicate the function’s strategy, progress, and
    risk profile to executive leadership and technical
    stakeholders across the company.
  - While you will not be expected to write code, you will need
    to leverage deep, related technical experience to succeed
    in this role

  What We're Looking For:

  - 4+ years of experience managing Platform or Site Reliability
    Engineering teams.
  - 10+ years of related technical experience with distributed
    systems and infrastructure as code.
  - Demonstrated ability to drive a durable technical roadmap
    and facilitate effective collaboration in cross-functional
    teams.
  - Experience with secrets and workload identity management,
    including using tools like SPIFFE, SPIRE, HashiCorp Vault,
    etc.
  - Experience building and automating large scale production
    infrastructure in public cloud and on-prem environments.
    Using TFE or similar technologies.
  - Extensive hands on experience working in a Linux environment
    with a solid understanding of system internals and
    performance optimization.

  We’ll be super impressed if you have experience in any of
  these:

  - Experience with Kubernetes, PKI, and configuration
    management tools like Chef.
  - Proficiency in Python or Go.
  - Migrating physical or cloud-based workloads to new hosting
    platforms.
  - Experience collaborating with compliance/security teams.

  Work Hours:

  This position will require you to be available during core
  business hours. It may also require occasional nights and
  weekends as necessary to support any on-call coverage.

  Work Location(s) & Travel Requirements:

  The preferred locations for this position are:

  - San Francisco, CA
  - Denver, CO
  - New York, NY

  Fastly currently embraces a largely hybrid model for most
  roles which allows employees flexibility to split their time
  between the office and home.

  There is a strong preference for Hybrid near a local office.
  However, we may be willing to consider exceptionally
  qualified remote candidates within the US.

  This position may require travel as required by your role or
  requested by your manager.

