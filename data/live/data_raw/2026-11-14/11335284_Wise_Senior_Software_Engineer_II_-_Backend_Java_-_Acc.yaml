description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We are looking for a Senior Backend Engineer to join the
  Account Sharing team within Wise’s Consumer Squad. The team
  is focused on building entirely new products in the shared
  finances space for consumers — including international joint
  accounts and kid accounts.

  Our mission is to make it easy for families, couples,
  friends, and flatmates across different countries to manage
  money together seamlessly through Wise. Unlike most existing
  solutions that are limited to domestic markets, we are
  building shared financial experiences that work globally.

  This is a highly product-oriented engineering role where
  you’ll help shape products from the ground up. You’ll work
  closely with Product Managers, Designers, Data Analysts, and
  User Researchers to deeply understand customer problems and
  turn ambiguous ideas into scalable financial products used
  by millions of customers worldwide.

  How we work

  For everything we build, we keep our customers at the center
  of decision-making. We prioritize work based on customer
  research, behavioral data, and direct feedback, and we
  iterate quickly based on what we learn.

  The Account Sharing team operates as a highly collaborative,
  cross-functional product team. Engineers are not expected to
  simply implement tickets — they are expected to contribute
  to product direction, challenge assumptions, influence
  technical strategy, and help shape the customer experience.

  The environment is greenfield and fast-moving. Requirements
  evolve quickly, and engineers are encouraged to take
  ownership, drive discussions, and work closely with
  stakeholders across engineering, product, design, and
  research.

  At Wise, we believe in autonomous teams where everyone
  contributes ideas, takes ownership, and helps define
  priorities together.

  Impact

  Your work will directly shape the future of shared finances
  at Wise.

  You’ll help build products that allow families, couples,
  flatmates, and friends across different countries to manage
  money together in ways that existing financial products
  often cannot support today.

  The systems and experiences you build will need to scale
  globally, support millions of customers, and navigate the
  complexities of international compliance, regulation, and
  financial infrastructure.

  This role offers the opportunity to influence both technical
  architecture and product direction while helping Wise expand
  into a strategically important area of consumer finance.

  What will you be working on?

  Key focus areas for the team are:

  - Building international joint accounts for globally
    distributed users
  - Expanding Wise kid accounts into additional markets
  - Creating shared finance experiences that work across borders
  - Designing scalable backend systems for high-growth consumer
    products
  - Developing features around shared spending,
    sending/receiving money, and account customization
  - Collaborating on customer discovery and product iteration
  - Scaling infrastructure and improving reliability across
    multiple markets
  - Building greenfield financial products from concept to
    production

  You’ll also have opportunities to work across multiple areas
  of the Wise ecosystem, including:

  - Send/receive money flows
  - Spend experiences
  - Authorization systems
  - FinCrime-related systems
  - Shared account infrastructure

  What do you need?

  - You know how to build scalable distributed systems and
    deliver customer-facing products used by millions of
    users.
  - You are proficient in backend programming languages such as
    Java, Kotlin, Python, or Go.
  - You have strong experience designing asynchronous, reliable,
    and scalable systems within microservice architectures.
  - You are comfortable working in greenfield environments where
    requirements evolve rapidly and ambiguity is part of the
    process.
  - You have a strong product mindset and enjoy collaborating
    closely with Product Managers, Designers, Analysts, and
    Researchers to shape solutions — not just implement them.
  - You care deeply about customer experience and understand how
    technical decisions impact end users.
  - You are comfortable contributing to architectural
    discussions, challenging assumptions, and influencing
    technical and product direction.
  - You write clean, maintainable, well-tested code and care
    about long-term scalability and reliability.
  - You are a strong communicator who can explain complex
    technical concepts clearly and collaborate effectively
    across teams.
  - You are comfortable operating independently while also
    contributing to a collaborative team culture.

  Nice to have

  - Experience building greenfield products from scratch
  - Experience working on international consumer products
  - Experience with payments, financial systems, or compliance-
    heavy environments
  - Experience building systems at global scale
  - Familiarity with event-driven architecture and messaging
    systems such as Kafka
  - Experience with customer-facing financial products
  - API-first development experience

