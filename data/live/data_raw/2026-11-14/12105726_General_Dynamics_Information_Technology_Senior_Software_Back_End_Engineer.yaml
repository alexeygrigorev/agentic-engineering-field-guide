  Job Description:

  SOFTWARE DEVELOPER SENIOR

  What You'll Do:



    - Work in a unique environment and stack, offering challenging
      problems and interesting opportunities

    - Deliver new features and improve reliability of our core
      services including the major read/write paths for
      customer intake, application screening, and information
      dissemination

    - Help identify system bottlenecks or flaws in business logic
      and work with the team to address them

    - Take ownership over product problems, develop solutions
      you're proud of, and prove through data that they
      deliver impact

    - Work across the stack to solve problems -- there is no
      reliance on another engineer or team to get something
      done for you

    - Mentor junior developers and contribute to the technical
      growth of the team

    - Communicate technical decisions and trade-offs effectively
      within your team



    What We're Looking For:



    Evidence of Engineering Accomplishment:

    - Demonstrated track record of delivering impactful,
      production ready, software solutions of varying
      complexity

    - Experience designing and implementing components of
      distributed systems (multi-tier architectures) including
      storage layers, caching layers, and application layers

    - Working experience with microservice architectures, with
      exposure to high-throughput systems

    - Familiarity with system transformation patterns and ability
      to contribute to modernization efforts



    Technical Excellence:

    - Strong proficiency in at least one modern programming
      language (Java, Python, or similar)

    - Solid understanding of cloud engineering paradigms,
      asynchronous systems, and service integration patterns

    - Working knowledge of design patterns, reliability, and
      scaling principles

    - Ability to contribute to architectural discussions and
      system design

  Ownership, Collaboration, & Communication:

    - Demonstrated propensity for taking ownership of problems and
      their solutions

    - Quality driven, owns their output from communication, to
      code, to documentation

    - Ability to communicate technical concepts clearly to
      teammates and stakeholders

    - Experience mentoring peers or junior developers

    - Willingness to advocate for sound engineering practices
      within your team



    Adaptability & Growth:

    - Track record of learning and adapting to new technologies,
      frameworks, and methodologies

    - Demonstrated embrace of AI and automation tools to enhance
      productivity and engineering outcomes

    - Comfort with ambiguity and willingness to venture into new
      problem domains



    Required:

    - Must be a US Citizen and able to obtain and maintain Public
      Trust 6C

    - Position is remote, with approximately 0-10% business travel

