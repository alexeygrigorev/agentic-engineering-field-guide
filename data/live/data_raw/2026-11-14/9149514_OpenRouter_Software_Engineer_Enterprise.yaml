description: |
  About OpenRouter

  OpenRouter is the leading AI routing and infrastructure
  layer that enterprises use to access, manage, and optimize
  the best large language models across providers—without
  lock-in, capacity constraints, or unnecessary cost. We power
  the most advanced AI teams in the world by giving them the
  flexibility to move fast, scale confidently, and stay
  future-proof as models evolve.

  As enterprise adoption of AI accelerates, OpenRouter sits at
  the center of how organizations operationalize LLMs across
  research, product, and production workloads.

  About the Role

  We're hiring Software Engineers for our Enterprise team to
  build the surfaces our customers depend on — dashboards,
  admin tooling, billing and spend management, analytics,
  onboarding, and many other user-facing features that turn
  OpenRouter into a platform. You'll be working closely with
  PMs and our designer to ship. We have a small team focused
  on this surface today, so you'll have room to own pieces of
  the product end to end.

  This role is ideal for engineers who love autonomy, value
  collaboration, and have a track record of shipping software
  that works. You’ll play a critical role in shaping our
  product as we scale, helping expand our platform’s features,
  and delivering exceptional experiences for our users.

  What You'll Do

  - Build and ship high quality customer-facing products and
    features.
  - Own products from concept to production, ensuring they are
    performant, reliable, and delightful for users. Make good
    product and design decisions, and be open to feedback and
    collaborative creation.
  - Bring a strong product instinct — push back when something
    doesn't make sense, and propose your own ideas to help
    make our product even better.
  - Partner with product and design teams to shape what we
    build, not just how we build it.
  - Identify bottlenecks, build great monitoring, propose
    solutions, and optimize performance across both frontend
    and backend systems.
  - Help raise the bar for product quality, design polish, and
    craft as the team grows.

  What We're Looking For

  - 4+ years of experience shipping external-facing products as
    a full-stack or product engineer with strong product taste
    and judgment.
  - Proficient in React, TypeScript, Next.js, and JS runtimes.
  - High agency and a bias toward action; you talk to users, you
    iterate, you ship.
  - AI-forward in your workflow. You use coding agents often,
    found interesting ways to automate your work, and have
    opinions about what works and what doesn’t
  - Comfortable in a small, fast-moving environment where
    boundaries between teams are intentionally fluid.
  - Strong written communication and a collaborative working
    style with PMs and designers.

  Nice to Haves

  - Prior experience at fast growing applied AI or product led
    companies
  - Experience building product in fast-moving, ambiguous
    industries.
  - Existing user of OpenRouter or active side projects in AI
    tooling.

  If you don't think you meet all of the criteria below but
  still are interested in the job, please apply. Nobody checks
  every box, and we're looking for someone who is excited to
  join the team.
