description: |
  Waracle are looking for a Senior Developer for an exciting
  new role joining our world-class digital technology
  consultancy and home to a diverse, smart, curious and
  ambitious community of specialists in technology-driven
  transformation.

  We work with ambitious clients to help them solve their
  biggest business and customer challenges. We help our
  clients to innovate and create intelligent digital products
  and services. We thrive on complex challenges and deliver
  business-critical IT transformation projects, moving
  seamlessly from strategy, design and delivery to operations.

  This is a Hybrid role working from the London office 2 days
  a week.

  As a Senior Developer at Waracle, you will play a pivotal
  role in shaping robust, scalable systems while fostering an
  inclusive environment where everyone can thrive. If you love
  solving complex technical puzzles, supporting peers through
  thoughtful mentorship, and balancing innovation with code
  quality, we would love to welcome you to our team.

  Key aspects of the role include

  - Architectural Delivery: Designing and building end-to-end
    backend subsystems using Go, ensuring our codebases remain
    modular, maintainable, and built to scale.
  - Quality & Security: Championing engineering excellence
    through constructive peer reviews and proactive defensive
    security measures.
  - Technical Guidance & Testing Strategy: Guiding unit,
    integration, and service-level testing strategies while
    exploring and introducing fresh industry ideas to our
    practice.
  - Consulting & Collaboration: Translating complex technical
    choices into clear, accessible language for client
    stakeholders and presenting confident, engaging solution
    demos.
  - Mentorship & Practice Growth: Mentoring and coaching
    colleagues to support their growth, sharing lessons
    learned, and continuously enriching Waracle's collective
    knowledge.
  - Balanced Delivery: Evaluating trade-offs thoughtfully
    between delivery pace and system health, taking shared
    accountability for successful feature launches.

  Research shows that underrepresented groups tend to only
  apply for roles that they believe they meet 100% of the
  criteria for. At Waracle, we want to buck that trend! We
  hire for passion, potential and mindset as much as
  credentials. If you think you'd be incredible in the role,
  then apply - even if you don't think you tick every box.

  What you'll bring

  - Core Backend Expertise: Proven hands-on experience building,
    scaling, and troubleshooting secure Go (Golang) systems
    and microservices in high-traffic environments.
  - Polyglot Mindset: Experience working with at least one other
    major programming language, giving you the flexibility to
    contribute across varied tech stacks and architecture
    patterns.
  - Cloud-Native Knowledge: Practical proficiency with
    Kubernetes and Helm to deploy and manage resilient,
    containerised applications.
  - Agile Execution: Strong experience navigating full Agile
    delivery lifecycles, turning designs into clean code, and
    working with Continuous Delivery (CD) pipelines.
  - Supportive Leadership: A passion for clean code,
    comprehensive testing, and uplifting colleagues through
    empathetic code reviews and ongoing mentorship.
  - Thoughtful Problem Solving: The ability to weigh technical
    trade-offs, balancing feature momentum with long-term
    system maintainability and performance.
  - Bonus if you have experience in Kubernetes, deployments with
    helm, Java Development, SQL databases and monitoring tools
    like SPLUNK

  What to expect from our hiring process

  - First Hello: An informal chat with your dedicated Talent
    Attraction Partner to talk about Waracle, what you want
    out of your next move, salary, benefits, and office hybrid
    working model.
  - Craft Showcase: A chance to demonstrate your real-world
    expertise. Depending on the role, this will be a focused
    take-home task (capped at 2–3 hours to respect your time).
  - Talking Impact: A collaborative deep dive into how you solve
    problems, work with others, and raise the bar, guided by
    our core values and competency framework.

  Your Talent Attraction Partner will be in your corner
  through every step right up to your Welcome Ritual on day
  one.

  Our Benefits

  We believe in supporting our team, inside and outside of
  work. Here's a glimpse of what you can expect:

  - Rest & Recharge: You'll receive 27 days of annual leave,
    plus 8 bank holidays, totaling 35 days of holiday to
    unwind and pursue your passions.
  - Financial Future & Security: Plan for retirement with our
    company-matched 5% pension contribution. For added peace
    of mind, we also offer a Death in Service benefit,
    providing 2 x your annual salary for your loved ones.
  - Health & Wellness: Our Medicash Health Cash Plans help cover
    everyday healthcare costs, complemented by an Employee
    Assistance Programme for confidential support, and Group
    Sickness Cover for peace of mind.
  - Flexible Working: We champion hybrid working, providing a
    home office setup budget to ensure you're comfortable and
    productive wherever you are.
  - Learning & Development: Invest in yourself with access to
    Udemy Business and a dedicated learning and development
    budget for continuous growth.
  - Lifestyle Perks: Make the most of our Cycle to Work Scheme,
    and enjoy exclusive gym and retail discounts.
  - Family First: Our enhanced parental leave policies include
    support for fertility journeys, recognising diverse family
    needs.
  - Community & Connection: We foster a vibrant culture with
    regular fun meet-ups and lunch on us in the office once a
    month. You'll also have the opportunity to make a local
    impact through Spirit of Waracle, our initiative for
    getting involved in charitable causes locally, building
    strong team bonds and giving back.

  We are an equal opportunities employer and welcome
  applications from all suitably qualified persons regardless
  of their race, gender, disability, religion/belief, sexual
  orientation or age.
