description: |
  Overview

  The Azure Blob Storage team is on a mission to build the
  data foundation that powers the AI revolution and we’re
  looking for visionary engineers to help lead the way. We’re
  seeking a Principal Software Engineer - Azure Blob Storage
  to design and build the next generation of intelligent
  storage systems purpose-built for the most demanding AI and
  ML workloads in the world.

  The landscape of computing is shifting. Massive foundation
  models, generative AI, and real-time inferencing are
  redefining how data moves, scales, and performs. Azure Blob
  Storage is evolving beyond traditional storage to become an
  AI-native platform, one that seamlessly supports the unique
  scale, throughput, and latency demands of modern AI. From
  high-bandwidth training pipelines to ultra-low-latency for
  model serving and inference, you’ll help architect systems
  that fuel innovation at zettabyte scale.

  This is a rare opportunity to work on one of the largest and
  most ambitious storage platforms on the planet, in close
  partnership with world leaders in AI. You’ll play a key role
  in designing distributed systems that deliver unmatched
  availability, durability, and performance unlocking new
  possibilities for AI applications running on Azure.

  As a Principal Software Engineer - Azure Blob Storage,
  you’ll lead from the front: shaping system architecture for
  the next era of AI storage, driving technical innovation
  across design, development, and operations, tackling
  complex, high-impact engineering challenges at hyperscale,
  and guiding and inspiring teams to build bold, high-quality
  solutions.

  We’re looking for engineers who love solving hard problems,
  thrive in dynamic environments, and are excited to build
  something that’s never been done before. If you’re ready to
  help define how storage powers AI at global scale, join us
  and help build the infrastructure that will shape the
  future.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others and collaborate to realize our shared goals. Each day
  we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Design and deliver next-generation distributed storage
    systems optimized for AI/ML workloads, from training to
    inferencing
  - Provide technical leadership across architecture,
    development, testing, and deployment at hyperscale
  - Drive innovations in scalability, performance, security, and
    efficiency to meet the demands of zettabyte-scale storage
  - Collaborate with cross-functional teams from AI researchers
    to cloud infrastructure engineers to ensure storage meets
    the needs of cutting-edge AI workloads
  - Mentor and guide other engineers, fostering a culture of
    technical excellence, innovation, and collaboration
  - Continuously evaluate emerging technologies and trends to
    anticipate the future of AI-native storage

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C++,
    C#, Java, or Python
    - OR equivalent experience

  Other Requirements:

  - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include, but are not limited to
    the following specialized security screenings:
    - Microsoft Cloud Background Check: This position will be
      required to pass the Microsoft Cloud Background Check
      upon hire/transfer and every two years thereafter

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 8+ years technical engineering experience with
    coding in languages including, but not limited to, C++,
    C#, Java, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 12+ years technical engineering
      experience with coding in languages including, but not
      limited to, C++, C#, Java, or Python
    - OR equivalent experience
  - Passion for distributed systems, large-scale storage, and
    solving complex systems problems
  - Experience with:
    - Storage system internals in areas such as availability,
      remote replication, durability schemes, and high-
      performance I/O
    - Database internals, indexing and search techniques, caching
      and data placement strategies
    - Metadata and namespace management at scale

