description: |
  Who We Are

  Maybern is transforming the way private fund managers
  effectively manage their funds through cutting edge
  technology: an operating system with deterministic guard
  rails underneath, agents on top. Maybern is founded by top
  engineering experts with deep knowledge of the fund
  management space.

  Private funds manage $15T in capital and are growing at 20%
  YoY, but with increasing regulatory scrutiny and investor
  demands for transparency, the need for more modern, fully
  agentic solutions to help private fund CFOs is crucial.

  This is where Maybern comes in.

  We are equipping fund managers with a fully agentic
  operating system for private fund management, enabling
  private investment managers to focus on what they do best:
  driving returns for their investors. We are backed by
  leading venture capital firms and a large number of
  strategic investors.

  Maybern is an NYC based company with a strong in-office
  culture to drive collaboration, and we are looking to make
  strong additions to our team.

  What We’re Looking For

  We are looking for product-focused engineers. These are
  engineers who work to deeply understand all aspects of the
  business problem they're solving in order to build better
  software, faster. The problems that we are solving at
  Maybern involve a massive amount of business logic
  complexity. In order to be successful in this role, you'll
  need to weigh in on the product roadmap while driving
  technical decisions. You'll also need a track record of
  building strong cross-functional relationships.

  What You'll Do

  To thrive in this role, you must be an entrepreneurial
  engineer who enjoys getting into the weeds.

  - Build: Build, test, and deploy software in a continuous
    manner
  - Lead: Architect, scope, and build core parts of our system
    from the ground up
  - Partner: Work closely with problem experts to design
    elegant, flexible solutions that solve our early clients'
    problems while being forward-thinking about future use
    cases

  This Could Be a Great Fit If You...

  - Are comfortable working with server-side languages and
    frameworks (we’re tech agnostic in interviews, but use
    Python and Django in practice)
  - Solid grasp of relational databases and transactions.
  - Knowledge of platform/cloud technologies and distributed
    systems. AWS experience is a bonus.
  - Are obsessed with details and excited to "get into the
    weeds"
  - Have excellent written and verbal communication skills
  - Capacity to work in high growth, fast-paced environments,
    and can adapt to change

  Benefits

  - We offer a competitive salary + equity package,
    comprehensive benefits, and a flexible family-friendly
    work environment. Some of our perks include:
    - Comprehensive healthcare benefits
      - Maybern covers 100% of medical, dental, and vision premiums
        for individuals
      - HSA & FSA plans
    - Family-Friendly policies
      - Paid parental leave
    - Flexible schedule
      - Flexible PTO / sick leave
      - WFH as needed to fit your needs
    - 401k
