description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role

  The Cloud Foundations team is responsible for building and
  maintaining the services that help ensure Wise’s cloud
  infrastructure meets all the necessary requirements for a
  growing FinTech business. To this end you will be working
  with us to develop tooling and provide hands-on technical
  expertise to design, deploy, and optimise our services in a
  compliant and cost-effective way on AWS and other major
  cloud providers.

  How we work

  We operate on a strong belief in automation, programmatic
  implementation, and reusable design. We’re looking for
  people who can step back and think holistically about the
  ecosystem, but also follow through and help implement the
  design; drawing on the resources across the rest of the
  platform tribe.

  As we grow, managing our cloud platform becomes increasingly
  complex at scale. We need to sustain this growth by
  continuously iterating on the services we run, with a focus
  on availability, security, and ease of use. We’re looking
  for an engineer with relevant experience who can analyse
  complex requirements and deliver simple solutions to help
  our teams achieve our mission with speed and confidence.

  What will you be working on?

  - Build, maintain, and support Wise’s cloud platform.
  - Design and implement scalable and secure cloud
    infrastructure solutions.
  - Collaborate with cross-functional teams to understand
    project requirements and deliver effective outcomes.

  What do you need?

  - Experience designing, building, and deploying scalable
    cloud-based solution architectures, preferably on AWS
    and/or GCP
  - Experience with IaC and automating infrastructure
    provisioning, developer operations, or continuous
    integration/deployment.
  - Strong knowledge of Golang and/or Python
  - Proficient in written and verbal communication skills with
    the ability to articulate concepts to users and
    stakeholders, as well as facilitate cross-team
    collaboration.

  Nice to Have

  - Understanding of Kubernetes operator pattern
  - Experience with networking within the cloud.
  - Experience with one or more observability platforms.
  - Knowledge of the financial services industry and/or other
    regulated industries.

  You get back

  - The ability to choose your own path to success – you’ll have
    the freedom to define the vision
  - The freedom to have real impact
  - The opportunity to inspire teams
  - A fun work environment with social activities and events.



  Interested? Find out more:

  - How we work – a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it's like to work at Wise London!
  - Our Engineering career map
  - Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £87,500 - £111,000 + RSUs
  - Wise Benefits

  Interested in more than one role?

  If you're interested in multiple roles, please apply for
  just one—the one you're most excited about. If you submit
  multiple applications requiring the same assessment, we'll
  continue your recruitment journey using your first
  application, and any duplicate applications will be
  automatically closed. This helps ensure a fair and
  consistent interview process. If another role feels like a
  better fit, you can discuss this with your recruiter during
  the process.



