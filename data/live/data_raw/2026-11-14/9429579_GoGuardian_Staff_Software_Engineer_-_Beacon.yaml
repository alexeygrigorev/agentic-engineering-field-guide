description: |
  What We Do



  At GoGuardian, we’re helping build a future where all
  learners are ready and inspired to solve the world’s
  greatest challenges. Our award-winning system of learning
  solutions is purpose-built for K-12 and trusted by school
  leaders to promote effective teaching and equitable
  engagement while helping empower educators to keep students
  safe.



  What It’s Like to Work at GoGuardian

  We are an outcomes-focused learning company with a steadfast
  focus on improving learning environments, one classroom at a
  time. Working with us means joining a remote team of
  diverse, committed, mission-driven employees who are
  inspired by our vision, dedicated to our customers, and
  ready to roll up their sleeves. Guardians put their heads
  together to solve problems, learn together from experiments
  that fail, and stand together by their work with full
  accountability. We balance our diligence with an inclusive
  culture that invites everyone to bring their whole self to
  work. Join us and learn why “I love the people here” is one
  of the most frequent comments we hear from Guardians.

  The Role

  We’re looking for a Staff Software Engineer to build new and
  maintain existing products in GoGuardian’s Safety product
  suite . In this role, you’ll contribute to the full software
  development lifecycle, from conception, research,
  definition, scoping, planning, implementation, and testing,
  to documentation, delivery and maintenance. This position
  sits on the Beacon Team, a team that creates solutions to
  the challenges schools face keeping children safe from
  threats and violence and providing insights and
  opportunities for interventions with students that need
  support. The ideal candidate is curious, able to manage
  risk, and driven to deliver quality software.

  What You'll Do

  - Collaborate with a cross-functional team toward feature
    delivery; Working both independently and in pairs/groups
    with others of varying skill levels
  - Leverage strong problem solving skills to apply existing
    knowledge and experience to new problems and creative
    solutions
  - Write production-grade code for well-scoped features with
    the help of code reviewers
  - Understand, implement and contribute to GoGuardian’s best
    practices, including style guides, standards, code
    reviews, documentation management, and operational
    workflows
  - Being generally available to work during standard working
    hours and to participate in an on-call rotation for
    production application support
  - Work closely with Product Management to create new features
    and products.
  - Lead the application architecture decision making process.
  - Spend time learning and experimenting with AI tools to
    improve our Customer Experience and Product Offering
  - Take part in short and long term planning.
  - Build & operate AWS infrastructure Monitor and track
    performance and reliability of our services and software
    to meet promised SLA
  - Mentor other developers to increase the overall performance
    of the team.

  Who You Are

  - 8+ years experience as a software engineer of SaaS
    applications  and or working on customer facing products
  - Competency in one or more languages. Experience with Go,
    Javascript, React, and MySQL preferred
  - Direct involvement in shipping at least one production
    application / product
  - Experience with monitoring, performance optimization,
    technical documentation, and unit / integration testing
  - Up-to-date knowledge of full stack web development
    languages, libraries, and technology
  - Writes production-grade code for well-scoped features;
    integrating feedback from code reviewers
  - Learns quickly, applies existing knowledge to new challenges
    and is building proficiency in relevant technical skills
  - Confident in making technical decisions and explaining the
    reasoning behind them
  - Have deployed software utilizing AWS, Terriform, Kubernetes,
    Docker, and/or other similar technology.
  - Can drive automation adoption and enhancement in areas such
    as Test Automation, Github Runners, CI/CD platforms, and
    other automation platforms
  - Can drive change beyond the scope of the team.

  Nice to Have

  - Experience with DataBricks
  - An interest in Machine Learning and AI technology

   What We Offer

  - Competitive pay, complete health insurance, 401(k) matching,
    and an employee equity plan.
  - Flexible time off, paid holidays, paid parental leave, and a
    paid year-end holiday break.
  - A robust catalog of benefits that support your professional
    growth and personal wellbeing, including work from home
    funds, fertility & adoption reimbursement, and more…

  Plus the intangible

  - A varied and challenging role in an innovative, global
    company.
  - Supportive, driven colleagues who have your back and share
    your passion.

  The typical base salary range for this position is $190,000
  - $220,000 per year. The range displayed on this job posting
  reflects the minimum and maximum target for new hire base
  pay for this position and your pay will be determined by a
  variety of factors, including your primary work location,
  skills, qualifications and experience. Additional benefits
  information is listed on our careers page

  Please share this with your friends or co-workers who may be
  interested in working at GoGuardian! We have multiple
  openings and are always looking for talented people.



