title: "Senior Microsoft Dynamics CRM Developer & Software Engineer"
company: Doran Jones
location: New York, USA
work_type: FULL_TIME
company_size: 52 Employees
description: |
  We are seeking a Senior CRM Solutions Developer & Software
  Engineer to design, develop, and enhance solutions across
  Microsoft Dynamics CRM and Dynamics 365 environments. This
  role will work across the full solution lifecycle—from
  requirements and architecture through development and
  deployment—supporting both legacy CRM systems and modern
  cloud platforms.

  The ideal candidate is a hands-on engineer who can build
  scalable CRM solutions, integrate enterprise systems, and
  contribute to the modernization of customer-facing platforms
  in a fast-paced Agile environment.

  Responsibilities

  - Design and develop solutions across Microsoft Dynamics CRM
    (On-Prem) and Dynamics 365 Online environments
  - Collaborate with architects, developers, and business
    stakeholders to deliver scalable CRM solutions
  - Build and customize CRM components, including plugins,
    workflows, Power Automate flows, PCF components, and
    integrations using Web API/SDK
  - Support deployments and environment management across CRM
    On-Prem and Dynamics 365 Online platforms
  - Participate in Agile sprint planning, effort estimation, and
    release delivery
  - Troubleshoot and resolve complex issues across CRM platforms
    and integrated enterprise systems
  - Mentor team members and promote best practices across CRM,
    DevOps, and CI/CD development processes
  - Contribute to broader engineering initiatives, including
    .NET services, Azure integrations, and enterprise
    applications

  Required Experience

  - 6+ years of Microsoft Dynamics CRM / Dynamics 365
    development experience
  - Strong hands-on experience with C#, ASP.NET, and .NET
    development frameworks
  - Experience developing CRM solutions using plugins,
    workflows, Power Automate, entities/tables, and custom
    integrations
  - Experience working with SQL Server and relational database
    design (T-SQL)
  - Experience using CRM SDK, Dataverse Web API, and modern
    integration approaches
  - Experience working within Agile environments with source
    control and CI/CD practices
  - Strong problem-solving skills with the ability to
    troubleshoot complex enterprise systems

  Preferred Experience

  - Experience supporting CRM On-Prem to Dynamics 365 migrations
    or upgrades
  - Familiarity with Power Platform components (Power Apps,
    Power Automate, custom connectors)
  - Experience working with Azure services and cloud
    integrations
  - Experience creating CRM reports using SSRS
  - Familiarity with JIRA or similar Agile project management
    tools

  Doran Jones Inc. (DJI) is the leading financial services
  Data Engineering and Application Development firm,
  specializing in Capital Markets, Risk, and Regulatory
  Compliance. We are US-based, helping our clients fill gaps
  in capacity and expertise, reduce risk, and accelerate
  change. Our leaders average over 25 years of experience in
  Financial Services and Technology. DJI is repeatedly engaged
  by the largest and most complex clients for our Agile
  transformation expertise and practical understanding of the
  critical relationship between data, architecture, and
  application development.



  DJI has a mission to place more people from non-traditional
  backgrounds into sustainable technology careers. Through
  partnerships with non-profit technology programs in
  underserved communities and Veteran organizations,
  candidates transition from tech training programs into real
  IT careers at DJI. Our unique recruitment policy allows us
  to create exceptional teams, bringing a broad spectrum of
  experience to our company and creating anything but a
  traditional consulting firm.



  DJI is a wholly-owned subsidiary of McLaren Strategic
  Ventures, a private equity firm, that invests in start-ups
  and scale-ups. They provide a full range of highly trusted
  domain consulting, advisory services, and innovative
  technologies globally. Doran Jones is able to offer a broad
  range of technology, deeper AI and machine learning tools,
  data intelligence, alternative resourcing capabilities, and
  capital access to invest and digitize at scale. Our clients
  benefit from this unique portfolio allowing them to
  accelerate the pace of their own digital transformations
  through innovative products and services designed around
  industry-wide issues.

  Visit  Doran Jones  to learn more!
