description: |
  Why Faculty?

  We established Faculty in 2014 because we thought that AI
  would be the most important technology of our time. Since
  then, we’ve worked with over 350 global customers to
  transform their performance through human-centric AI. You
  can read about our real-world impact here.

  We don’t chase hype cycles. We innovate, build and deploy
  responsible AI which moves the needle - and we know a thing
  or two about doing it well. We bring an unparalleled depth
  of technical, product and delivery expertise to our clients
  who span government, finance, retail, energy, life sciences
  and defence.

  Our business, and reputation, is growing fast and we’re
  always on the lookout for individuals who share our
  intellectual curiosity and desire to build a positive legacy
  through technology.

  AI is an epoch-defining technology, join a company where
  you’ll be empowered to envision its most powerful
  applications, and to make them happen.

  About the team

  In our Professional and Financial Services Business unit, we
  bring everything we have learned in more than a decade of
  Applied AI, and use it to help our clients navigate a
  rapidly changing landscape.

  We develop and embed AI solutions which help financial
  institutions become more efficient, enhance customer
  experience, and find the commercial upside in uncertain
  markets. Within the constraints of a highly regulated
  industry, we see so much opportunity for impactful
  innovation and are proud to set the gold-standard for
  marrying technical excellence with safe deployment.

  About the role

  As a Full Stack Software Engineer, you will collaborate with
  cross-functional teams to build and scale AI-powered systems
  that solve unique challenges for global clients.

  This is an opportunity to take ownership of the entire
  stack, turning sophisticated machine learning outputs into
  high-impact, production-ready solutions that drive real-
  world transformation.

  What you'll be doing:

  - Creating reliable, reusable, and scalable frontend and
    backend architectures to enable the seamless delivery of
    advanced AI systems.
  - Leading engineers within cross-functional teams—alongside
    Data Scientists and Product Managers—to deploy technically
    sophisticated, high-impact software.
  - Designing and architecting robust project frameworks that
    maintain a balance between rapid prototyping and long-term
    maintainability.
  - Acting as a technical authority for full-stack development
    within your delivery unit to ensure best practices are
    met.
  - Providing deep technical expertise to customers, helping
    them navigate complex requirements and architectural
    scoping.

  Who we're looking for:

  - You bring extensive experience in TypeScript and modern
    frontend frameworks like React or Vue, paired with a
    strong eye for intuitive UI/UX design.
  - You possess solid backend development skills in Python or
    TypeScript frameworks (such as FastAPI, Flask, or Django)
    and are comfortable managing the full application
    lifecycle.
  - You are experienced in deploying software within cloud
    environments like AWS, Azure, or GCP, ideally using
    containerisation tools like Docker.
  - You demonstrate a scientific and pragmatic mindset, testing
    assumptions and balancing big-picture vision with the
    technical details required for execution.
  - You thrive in autonomous, fast-paced environments where you
    can take full ownership of problems and collaborate
    directly with clients to define technical strategy.
  - You are a compelling communicator who enjoys working in a
    team-oriented culture and has a relentless drive to learn
    and apply novel technologies.

  Our Interview Process

  - Talent Team Screen (30 minutes)
  - Pair Programming Interview (90 minutes)
  - System Design Interview (90 minutes)
  - Commercial Interview (60 minutes)

  Our Recruitment Ethos

  We aim to grow the best team - not the most similar one. We
  know that diversity of individuals fosters diversity of
  thought, and that strengthens our principle of seeking
  truth. And we know from experience that diverse teams
  deliver better work, relevant to the world in which we live.
  We’re united by a deep intellectual curiosity and desire to
  use our abilities for measurable positive impact. We
  strongly encourage applications from people of all
  backgrounds, ethnicities, genders, religions and sexual
  orientations.

  If you don’t feel you meet all the requirements, but are
  excited by the role and know you bring some key strengths,
  please don't hesitate in applying as you might be right for
  this role, or other roles. We are open to conversations
  about part-time hours.

  A note on AI: we're happy for you to use it for research and
  interview prep, but please don't use it to generate answers
  during live interviews. We also use an AI note-taker
  (Metaview) in interviews so interviewers can stay present
  (which you can opt out of just let us know,) and every
  application is reviewed by a human, never decided by AI.
