description: |
  🟣 About Airgoods

  Airgoods is building the future of food and beverage
  distribution.

  Today, we help emerging brands (think Fishwife, Ghia, and
  David Protein) rapidly grow their wholesale business and
  earn placement into the nation’s best specialty food stores.

  We started in January 2023 and have since raised $7M from
  top investors like Y Combinator and Initialized Capital. We
  are a fully in-person company, with an office near Madison
  Square Park in New York City.

  👋 Who you’ll work with

  Paolo (co-founder and CTO): Paolo studied Computer Science
  and Economics at Yale. Previously worked as a software
  engineer at his brother’s startup Momence (YC S20). Grew up
  in Brazil before coming to the US for college. Played soccer
  at Yale and loves sports.

  Elian (co-founder and COO): Elian studied Economics at Yale,
  played on the soccer team alongside Paolo and captained the
  team for two years. He also worked with Aaron at an emerging
  VC fund for 1.5 years of his time at Yale. Grew up in Asia
  and Europe before moving to Milwaukee before college.

  Aaron (co-founder and CEO): Aaron studied Economics at Yale,
  where he met Elian and Paolo. After Yale, he worked at an
  emerging VC fund in New York with Elian; that fund would
  later write the first check into Airgoods. He grew up
  helping his dad run the wholesale side of a brick & mortar
  retail store in Portland, Maine.

  You’ll also be working alongside four fantastic engineers,
  Emilio, Sergio, Leck, and Steven, as well as Andrés and
  Pradnaya, who are part of the Growth & Ops team.

  🏗️ About the role

  Airgoods is seeking a driven infrastructure engineer. We are
  on a high-growth trajectory and we're looking for someone
  who wants to join us on the journey to building a billion-
  dollar company.

  This position will involve:

  - Building out Airgoods’ platforms to scale with growing
    traffic and a multitude of services (web, backend,
    internal, mobile app).
  - Build and maintain scalable, secure, and high-performing
    infrastructure to support product development and
    deployment.
  - Make local development delightful by creating seamless setup
    processes, fast build systems, and well-configured tooling
    that lets our engineers (and open-source contributors)
    focus on writing code instead of fighting their
    environment
  - Contribute to the whole product development process in
    collaboration with designers, engineers, and others. From
    product concept and research to implementation and
    deployment, we expect you to own your work and deliver
    high-quality solutions.
  - A role that balances scaling infrastructure, enabling
    development teams, internal tooling development, and
    driving performance improvements across all applications
  - Transforming the Airgoods codebase into an AI-native
    codebase where coding agents can build end-to-end.
  - Obsessing over how to improve Airgoods' software factory
    (development process) and how we can remove friction from
    each of the phases to ship faster for our customers.

  🚀 Who you are

  We are a young company of highly driven and passionate
  individuals building a billion-dollar business. To thrive in
  this environment, you’ll have the following characteristics:

  - You are driven with a strong work ethic - our team is
    committed to going the extra mile, even if it means
    working long nights and weekends to achieve our goals.
  - You prioritize speed and have a bias for action.
  - You strive for excellence in every aspect of your work - you
    take ownership of your outcomes and overdeliver on your
    goals.
  - You’re humble and eager to learn whatever it takes to help
    our team and our customers succeed.
  - You play for the front of the jersey.

  🛠️ What you bring

  Must-haves

  - Familiarity with our tech stack: Typescript, React,
    PostgreSQL, NodeJS, Express, BullMQ, Inngest, ClickHouse
    (Tinybird), Github Actions
  - Experience implementing modern observability solutions using
    industry tools (like Datadog, Prometheus, Grafana, Sentry,
    etc.) and/or architecting custom in-house observability
    systems spanning metrics, logs, and distributed tracing
    with demonstrated success in complex, high-throughput
    environments
  - Optimizing the latency of complex database queries in
    Postgres, Clickhouse, and/or Redis
  - Seen applications that experienced high growth and a large
    scale of usage.
  - Prior experience working with multi-application monorepos
    using Turborepo or similar technologies

  Bonus points:

  - Proven experience with distributed systems, real-time
    infrastructure, and infrastructure-as-code.
  - Experience with AI-powered code-review products or coding
    agents.
  - Prior work on B2B marketplaces, payments, or high‑volume
    e‑commerce back‑ends

  🎁 What we offer

  - $120k - $220k • 0.01% - 0.2%
  - Medical, dental, and vision insurance.
  - Unlimited PTO + two team offsites per year.
  - Expensed dinner in the office Monday - Thursday.
  - $400 / month wellness stipend to encourage you to invest in
    your health.
  - Commuter benefits to get you to and from the office.
  - Dedicated founders who are committed to building an amazing
    team and supporting you.

  Don’t see a perfect fit? Reach out anyway – exceptional
  talent always has a home at Airgoods.
