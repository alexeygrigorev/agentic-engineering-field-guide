description: |
  What We Do:

  Cybercrime is growing, and more businesses are getting hit
  by threats that used to target only the biggest
  organizations. That pushes defenders like us to operate at
  the highest level, and it deepens our need for good people
  who want to make a meaningful impact.

  Founded in 2015 by former NSA cyber operators, Huntress is a
  remote-first team working to make enterprise-grade
  cybersecurity accessible to businesses of all sizes. We work
  closely with security teams and service providers protecting
  complex environments, often without the time or headcount to
  handle it all. That’s why we build our technology in-house
  and back it with a 24/7 human-led Security Operations Center
  (SOC). As a result, our platform is never disconnected from
  the experts who manage it, ensuring our customers'
  protection.

  Huntress now secures more than 6M endpoints and 17M
  identities worldwide. Those numbers keep growing because
  more businesses rely on us to help carry the load and
  operate with more confidence. Every day, you can see that
  commitment in how we stand with our customers and how we
  show up for each other.

  Reports to: Engineering Manager

  Location: Remote US

  Compensation Range: $200,000 to $220,000 base plus bonus and
  equity

  What You’ll Do:

  Huntress is looking for a highly strategic and collaborative
  Staff Software Engineer to drive the technical vision and
  architectural evolution of the Huntress Core Platform.

  Our Core Platform contains the foundational components that
  power the entire Huntress product suite, including the
  notification system, onboarding, authentication,
  integrations, and APIs. While you will remain deeply hands-
  on developing the most complex features for the platform,
  your scope expands beyond standard delivery. You will act as
  the technical anchor for your team, solving our most complex
  scaling challenges and eliminating cross-team dependencies.
  You will design the systems that empower all other
  engineering teams to build faster and more securely, acting
  as a technical thought leader who ensures our architecture
  anticipates future growth as we scale to protect the 99%.

  Responsibilities:

  - Design, implement and mentor engineers on the most complex
    features the team builds
  - Partner directly with the Engineering Manager to steer the
    team’s technical direction, improve overall team function,
    and set the standard for engineering excellence
  - Take ownership of cross-team dependencies, actively
    collaborating with multiple engineering teams to eliminate
    roadblocks and ensure smooth feature delivery.
  - Drive the Architectural Decision Record (ADR) process for
    major technical changes that impact the wider codebase or
    require alignment across multiple functions
  - Focus on the entire lifecycle of the system, including
    evolution, configuration and technical risk management
  - Mentor and coach engineers across the team, acting as a
    positive role model who promotes collaboration and
    engagement

  What You Bring To The Team:

  - 10+ years of experience developing complex software
    products, with a proven track record of acting as the
    senior technical anchor for a team
  - 5+ years of programming in Ruby on Rails, ideally with
    experience managing and scaling large monoliths
  - Strong architectural experience, including a history of
    driving technical design decisions (ADRs) and managing
    system lifecycles, configuration and technical risk
  - Experience with AWS or other public cloud environments,
    Linux-based infrastructure and advanced database
    management at scale
  - Excellent technical, diagnostic, and troubleshooting skills

  - Ability to grasp new tools and technologies quickly
  - Ability to prioritize and execute multiple tasks at a time
    in a fast-paced environment, often operating independently
  - Demonstrated ability to take highly ambiguous requirements
    or multi-team initiatives and decompose them into
    actionable work for the team
  - Exceptional communication skills, with the ability to build
    strong relationships and coordinate smoothly across
    multiple teams, product managers, and leadership
  - Experience partnering directly with Engineering Managers or
    Product Leaders to set team-level technical strategy and
    balance tech debt with product delivery
  - Experience with AI coding tools and workflows, with the
    ability to help the wider team adopt them effectively,
    responsibly, and pragmatically

  What We Offer:

  - 100% remote work environment - since our founding in 2015
  - Generous paid time off policy, including vacation, sick
    time, and paid holidays
  - 12 weeks of paid parental leave
  - Highly competitive and comprehensive medical, dental, and
    vision benefits plans
  - 401(k) with a 5% contribution regardless of employee
    contribution
  - Life and Disability insurance plans
  - Stock options for all full-time employees
  - One-time $500 reimbursement for building/upgrading home
    office
  - Annual allowance for education and professional development
    assistance
  - $75 USD/month digital reimbursement
  - Access to the BetterUp platform for coaching, personal, and
    professional growth



  Huntress is committed to creating a culture of inclusivity
  where every single member of our team is valued, has a
  voice, and is empowered to come to work every day just as
  they are.

  We do not discriminate based on race, ethnicity, color,
  ancestry, national origin, religion, sex, sexual
  orientation, gender identity, disability, veteran status,
  genetic information, marital status, or any other legally
  protected status.

  We do discriminate against hackers who try to exploit
  businesses of all sizes.

