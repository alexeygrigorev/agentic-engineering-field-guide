description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  Our Staff Software Engineers lead strategically important
  technical work and deliver meaningful customer and business
  outcomes. They pair deep technical contribution with
  influence across teams: clarifying ambiguous problems,
  setting direction, and helping others build effectively.



  Vanta’s Growth group helps prospects evaluate and try Vanta,
  new customers reach value faster, and existing customers
  expand with confidence. We improve discovery, trials,
  onboarding, purchasing, upgrades, and renewals, including
  the path to a customer’s first compliance milestone. We also
  build the platform that lets other product teams own and
  improve their products’ customer journeys and growth. For
  customers, that means clearer next steps and less friction
  as their needs change. For Vanta, these experiences
  influence prospect-to-customer conversion, activation, time
  to value, retention, and expansion. Shared growth
  capabilities extend that impact across product areas while
  letting each team improve the journey it owns. We use
  customer feedback and product data to decide where changes
  will have the greatest impact.

  As a Staff Software Engineer in the Growth group, you’ll
  turn important customer and business goals into working
  product and platform capabilities. You’ll own technical
  direction for major initiatives, shape the architecture,
  scope, sequence, and dependencies, and align partners on
  goals and tradeoffs. You’ll lead multi-team work from
  problem framing through launch and adoption, build
  foundational pieces yourself, and give other engineers
  meaningful ownership so the results can keep improving after
  your initial ships.

  Visit our Vanta Engineering Blog to learn more about what
  our team is working on!

  What you’ll do as a Staff Software Engineer, Growth at
  Vanta:

  - Design, build, and evolve reliable customer-facing software
    and shared platform capabilities that other product teams
    can use to own and improve their customer journeys
    (TypeScript, React, Node.js).
  - Understand customer research and product analytics to find
    friction across evaluation, trials, onboarding, first
    value, purchasing, and expansion, then prioritize the
    changes most likely to improve customer outcomes.
  - Lead complex, multi-quarter initiatives from technical
    roadmap and architecture through delivery and adoption.
    Sequence work across teams and use measures such as
    conversion, activation, time to value, retention, and
    expansion to learn what drives the greatest impact.
  - Give engineers ownership of important work and coach them
    through scope, technical choices, and collaboration with
    partners.
  - Own technical direction for major Growth product and
    platform domains, making clear tradeoffs between customer
    value, delivery speed, reliability, and long-term
    flexibility.
  - Partner with Product, Design, Customer Success, Sales, and
    other engineering teams to connect customer needs to sound
    technical solutions.
  - Clarify decisions and dependencies across teams, resolve
    disagreements, and communicate the technical approach so
    others can build on it.

  How to be successful in this role:

  - Have demonstrated Staff-level technical leadership by
    turning ambiguous goals into shipped, adopted results
    across multiple teams. Show the technical decisions you
    owned, your hands-on contribution, and how the work
    continued to deliver value.
  - Bring strong product judgment and experience building
    customer-facing SaaS products, ideally across growth,
    onboarding, activation, or self-service journeys.
  - Use customer insight and quantitative signals to assess
    product outcomes and guide iteration.
  - Develop other engineers through ownership, coaching, and
    feedback so they can lead important work without relying
    on you for every decision.
  - Comfort working through ambiguity, learning unfamiliar
    domains, and making progress with a bias toward action.
  - Interest in learning about security and compliance is
    welcome; prior experience is not required.
  - Uses AI in day-to-day work to amplify their skills and
    strengthen their outcomes, applying it across routine
    workflows, actively building fluency through
    experimentation, and exercising sound judgment to ensure
    AI-assisted work meets a high quality bar.

  What you can expect as a Vanta’n:

  - Industry-competitive salary and equity
  - Comprehensive medical, dental, and vision coverage, with
    100% of employee-only benefit premiums covered for most
    medical plans
  - 16 weeks paid Parental Leave for all new parents
  - Health & wellness stipend
  - Remote workspace, internet, and cellphone stipend
  - Commuter benefits for team members who report to the SF and
    NYC office
  - Family planning benefits
  - Matching 401(k) contribution with immediate vesting
  - Flexible PTO policy, plus 80 hours of Sick Time
  - 11 company-paid holidays
  - Virtual team building activities, lunch and learns, and
    other company-wide events!
  - Offices in SF, NYC, London, Dublin, Tel Aviv, and Sydney

  To provide greater transparency to candidates, we share base
  pay ranges for all US-based job postings regardless of
  state. We set standard base pay ranges for all roles based
  on function, level, and country location, benchmarked
  against similar-stage growth companies. Final offer amounts
  are determined by multiple factors and may vary based on
  candidate location, skills, depth of work experience, and
  relevant licenses/credentials.

  #LI-remote

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
