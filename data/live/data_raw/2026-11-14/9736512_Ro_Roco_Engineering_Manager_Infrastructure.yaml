description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role

  We're looking for an Engineering Manager to lead Core
  Infrastructure.

  This role is for a hands-on engineering leader who can
  create leverage through managing people, own execution, and
  bring strong technical and operational judgment to
  production systems. You will own a portfolio and lead a team
  responsible for scaling Ro’s infrastructure for increasing
  scale and AI-driven engineering workflows, while reducing
  system surface area, eliminating legacy complexity, and
  improving reliability and cost efficiency.

  Infrastructure plays a foundational role in Ro’s ability to
  help patients reach their health goals by making the systems
  behind their care more reliable, scalable, secure, and
  efficient.

  The right person will help the team balance reactive support
  with durable systems ownership: solving common needs once,
  reducing operational drag, and creating a high-context,
  high-trust environment where engineers can do their best
  work.

  What You’ll Do

  - Lead and develop a Core Infrastructure team responsible for
    production-critical systems and foundational engineering
    capabilities.
  - Own execution across the team’s portfolio: clarify
    priorities, sequence work, manage tradeoffs, and ensure
    high-quality delivery.
  - Improve Ro’s infrastructure operating model by making
    ownership clearer, reducing recurring support burden, and
    converting operational pain into durable system
    improvements.
  - Advance Ro’s reliability, observability, and disaster
    recovery posture through better operational practices,
    clearer readiness expectations, incident learning, and
    resilient infrastructure patterns.
  - Partner with Product Engineering, Cyber, Data
    Infrastructure, and Infrastructure leadership to ensure
    Core Infrastructure work improves reliability, velocity,
    compliance, unit economics, and the systems that help
    patients access and stay engaged in care.
  - Create a high-context, high-trust team environment with
    clear expectations, strong feedback/accountability loops,
    and space for engineers to do their best work.

  What You’ll Bring

  - Experience leading infrastructure, platform, SRE, DevOps,
    backend, or production engineering teams in a cloud-native
    environment.
  - Strong technical judgment across production infrastructure
    systems such as AWS, Kubernetes, serverless/Lambda
    architectures, Cloudflare or edge infrastructure,
    observability platforms like Datadog, and infrastructure-
    as-code tools such as Pulumi or Terraform.
  - Experience improving operational systems such as on-call
    health, incident response, service ownership, reliability
    practices, disaster recovery readiness, documentation, and
    production support workflows.
  - Experience operating infrastructure in regulated
    environments is a plus, especially where reliability,
    security, auditability, and HIPAA-adjacent considerations
    shape technical decisions.
  - Comfort operating as a hands-on technical leader: close
    enough to architecture, incidents, reliability risks, cost
    drivers, and implementation tradeoffs to unblock decisions
    and raise the quality of execution.
  - A pragmatic, forward-looking approach to new technologies,
    including AI-assisted engineering and operations. You are
    willing to experiment with emerging approaches such as AI-
    directed SRE investigations, incident analysis,
    operational automation, and developer productivity
    improvements while maintaining appropriate judgment around
    safety, reliability, and governance.
  - Ability to convert ambiguous or recurring infrastructure
    problems into clear plans, scoped engineering work, and
    measurable outcomes.
  - A management style that combines high standards with high
    support: you create clarity, build trust, develop
    engineers, and hold the team accountable for outcomes.

  The target base salary for this position ranges from
  $227,800 to $270,000, in addition to a competitive equity
  and benefits package (as applicable). When determining
  compensation, we analyze and carefully consider several
  factors, including location, job-related knowledge, skills
  and experience. These considerations may cause your
  compensation to vary.

  Ro is consistently recognized as a top workplace in Health
  Care, in New York, and for Women and Parents—earning more
  than 20 honors from Fortune, Great Place to Work, and PEOPLE
  since 2021. In 2025 alone, we ranked top 5 among medium
  workplaces in Health Care and New York, and top 50
  nationwide.



