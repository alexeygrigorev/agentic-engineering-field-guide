title: VP, Software Developer - Prime Services Equity Technology / Risk (.Net)
company: Jefferies
location: New York, USA
work_type: FULL_TIME
company_size: 6,435 Employees
description: |
  As part of the Global Equities Prime Services Backoffice
  technology team, an opportunity exists for a senior level
  C#/SQL developer to work on the firm’s global equities
  trading systems. The system aims to develop the Jefferies
  Global Swap Desk platform and implement trade processing and
  clearing models in a highly moving infrastructure to trade
  and manage all aspect of trade processing globally across
  all product lines.

  We're looking for a mid to senior level software developer,
  with strong, recent working knowledge of C#, WPF, WinForms
  and SQL. Familiarity with test-driven development and the
  relevant tools is required. The candidate must have
  excellent communication skills, as he or she would in a
  client-facing role. Financial knowledge is helpful, but not
  mandatory.

  The position is a client-facing software development role
  for a prime brokerage within a mid-size investment bank. The
  role is roughly 30% support and 70% development. You would
  be joining a small team with ambitious objectives but a
  fairly relaxed working environment. The development will be
  focused on order management and real-time profit and loss
  systems. The role involves directly supporting internal and
  external clients. As such, excellent communication skills
  and a client-focused attitude are a must.

  Key Responsibilities:

  - Developing the global Backoffice system for the firm Prime
    Services Swaps Desk
  - Efficiently building out the various regions, product types
    for the Swaps platform
  - Day to day support of applications and the trading desks
  - Will have direct communication with Swaps, Operations,
    middle office, connectivity as well as various internal
    technology teams

  Qualifications:

  - Trading or order management systems
  - Experience with Trade Risk, Client vs Firm Risk
  - Experience and good understanding of various Asset Classes
    such as Equity, Options, Fixed Income and Swaps
  - Good Understanding of Margin rules and procedures
  - Working experience with equities and swaps
  - Solid experience with SQL and C#, Proficient in coding
    business logic in SQL stored procedures, functions and
    triggers
  - Minimum 10 years programming experience required.
  - Minimum 5 years of experience in financial industry
    required.
  - Strong knowledge of object-oriented programming and design
    patterns.

  Additional Skills:

  - Experience working with Market Data, Order Management
    Systems
  - Experience with Swaps, Buy Side Outsourced Trading concepts
    and Trade Settlement
  - Experience with Omgeo CTM
  - Bachelor’s degree required preferably in Computer Science.
    Advanced degree is a plus but not required.

  Primary Location Full Time Salary Range of $185,000 -
  $225,000.

