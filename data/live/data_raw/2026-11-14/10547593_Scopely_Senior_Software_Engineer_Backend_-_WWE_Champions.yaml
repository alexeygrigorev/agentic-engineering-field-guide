description: |
  Scopely is looking for a Senior Software Engineer (Gaming
  Backend) to join our WWE Champions team in the United States
  or Canada on a remote basis or Mexico City on a hybrid
  basis.

  At Scopely, we care deeply about what we do and want to
  inspire play every day - whether in our work environments
  alongside our talented colleagues or through our deep
  connections with our communities of players. We are a global
  team of game lovers who are developing, publishing and
  innovating the mobile games industry, connecting millions of
  people around the world daily.

  WWE Champions is our ultimate and unique RPG puzzle match
  game featuring WWE superstars and legends across mobile and
  PC platforms.  WWE Champions is the most downloaded WWE game
  to date, with a highly engaged and passionate community -
  who will remain undefeated?

  What You Will Do

  As a Senior Software Engineer, you will design, build, and
  evolve backend systems that power core gameplay and live-
  service operations at scale. You will take ownership to
  drive live-ops excellence through incident management and
  reliability improvements, enable cross-functional teams to
  deliver high-quality player experiences and technical
  roadmap for live mobile games. This role requires a balance
  of deep backend engineering expertise, support live-ops and
  design team pre and post releases and strong leadership to
  unblock technical challenges in a high-concurrency
  environment.

  - Actively support liveops initiatives and game design
    releases, providing comprehensive backend support both
    pre- and post-launch
  - Ensure seamless coordination with the design team throughout
    the lifecycle of game updates and content releases
  - Support live-service excellence by leading incident
    management, reliability hardening, and operational
    readiness for production systems
  - Drive the technical roadmap for our backend initiatives,
    ensuring scalable, high-performance architecture for live
    mobile games
  - Lead the design and delivery of high-impact features by
    bridging server-side logic with game client requirements
  - Act as a technical multiplier by unblocking cross-functional
    teams (Product, Design, QA, Analytics), facilitating
    design discussions, and providing mentorship
  - Contribute to hands-on feature development, ensuring code
    quality and maintainability across both client and server
    codebases
  - Identify and mitigate technical debt and operational
    bottlenecks to improve overall team velocity

  What We’re Looking For

  Experience & Technical Skills

  - 6+ years of professional software development experience in
    gaming or large-scale live-service applications
  - Deep expertise in backend engineering with high-level
    server-side languages and frameworks
  - Experience collaborating with game client engineers (e.g.,
    Unity/C#) to deliver integrated fullstack features
  - Proven track record of designing scalable systems and
    managing live-service operations
  - Familiarity with cloud infrastructure (AWS or equivalent)
    and modern CI/CD practices
  - Experience working with content pipelines and performance
    optimization

  Cross-Functional & Domain Knowledge

  - Experience building and supporting player-facing features
    (progression, social, live events, monetization)
  - Strong understanding of the interplay between backend
    services and Unity clients
  - Proven ability to lead technical planning and execution in
    complex, cross-functional environments
  - Experience managing technical roadmaps and balancing feature
    delivery with system health

  Soft Skills & Education

  - Bachelor’s degree in Computer Science or related field, or
    equivalent practical experience
  - Strong communication and leadership skills; ability to
    explain complex technical concepts to non-technical
    stakeholders
  - Collaborative and proactive mindset, focused on team success
    and mentorship
  - High ownership of technical outcomes and a pragmatic
    approach to problem-solving

  Please ensure that the résumé/CV you attach is written in
  English.

  For candidates in CA, CO, NJ, NY, and WA, the annual salary
  range is provided below. In addition to base pay, employees
  may be eligible for equity, bonuses, and a comprehensive
  benefits package, including healthcare benefits, retirement
  benefits, pet insurance, paid holidays, paid Scopely free
  days, and unlimited paid time off. Base pay offered may vary
  depending on job-related knowledge, skills, and experience.

  CA, CO, NJ, NY, and WA Annual Salary Range

  $145,000—$220,000 USD

  About Scopely

  Scopely is a leading video game and global interactive
  entertainment company, home to many of the world’s most
  beloved and enduring experiences, including two of the most
  successful mobile games of all-time “MONOPOLY GO!” and
  “Pokémon GO,” along with “Stumble Guys,” “Star Trek™ Fleet
  Command,” “MARVEL Strike Force,” “WWE Champions,” the
  Scrabble® franchise, “Yahtzee® With Buddies,” and many
  others. Across mobile, web, PC, and console, Scopely
  creates, develops, publishes, and live-operates one of the
  most diversified and award-winning portfolios in the games
  industry — bringing hundreds of millions of players together
  through a shared love of play.

  Founded in 2011, Scopely is powered by its exceptional team
  — including thousands of world-class gamemakers around the
  globe, a distinctive tenet-driven culture, and its
  proprietary technology platform, Playgami. Together, these
  strengths have fueled Scopely’s position as the #1 mobile
  games company in the U.S. and #2 globally, generating more
  than $10 billion in lifetime revenue. Whether building
  global sensations like “MONOPOLY GO!” from the ground up, or
  expanding through strategic acquisitions, including the
  FoxNext, GSN, and Scopely Explore games businesses — Scopely
  consistently delivers experiences players love today and
  return to for years to come.

  Recognized multiple times as one of the "100 Most
  Influential Companies in the World" by TIME magazine and one
  of Fast Company's "World's Most Innovative Companies" and
  “Best Workplaces for Innovators,” Scopely believes that
  video games can be a force for good — creating meaningful
  connections, vibrant communities, and making life better
  through play.

  Scopely has global operations and partners across four
  continents in more than a dozen countries worldwide. For
  more information, visit: https://www.scopely.com/.

  Notice to Candidates: Scopely will never request payment or
  financial information during the application or hiring
  process. Please apply only through our official website and
  verify that all Talent Partner communications come from an
  email address ending in @scopely.com.

  Should you have any questions or encounter any fraudulent
  requests/emails/websites, please immediately contact
  recruiting@scopely.com. Our job applicant privacy policies
  are available here: California Privacy Notice and EEA/UK
  Privacy Notice.

  Employment at Scopely is based solely on a person's merit
  and qualifications. Scopely does not discriminate against
  any employee or applicant because of race, creed, color,
  religion, gender, sexual orientation, gender
  identity/expression, national origin, disability, age,
  genetic information, veteran status, marital status,
  pregnancy or related condition (including breastfeeding), or
  any other basis protected by law. We also consider qualified
  applicants with arrest or conviction records, consistent
  with applicable federal, state and local law.
