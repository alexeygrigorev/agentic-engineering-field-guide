description: |
  About Judi Health

  Judi Health is a health technology company providing benefit
  administration solutions to employers, unions, health plans,
  and government entities. Judi Health replaces fragmented,
  outdated systems with the industry's first Unified Claims
  Processing™ architecture, seamlessly consolidating pharmacy
  and medical benefit administration on a single, secure
  platform. By delivering true price transparency, eliminating
  unnecessary middleman fees, and leveraging advanced AI-
  powered care delivery, Judi Health helps clients achieve
  unprecedented operational efficiency and service levels. At
  Judi Health, we're deploying the infrastructure our country
  needs to deliver the healthcare we all deserve. We are the
  intelligence platform powering benefits plans for millions
  of Americans and proudly leading the next generation of
  care. To learn more, visit www.judi.health.

  Location: Hybrid 3 days (offices in NYC, Denver, CO and
  Charlotte, NC area)

  Position Summary:

  Join our mission to transform our nation's healthcare system
  as a Senior Full-stack Software Developer. In this role you
  will assist in leading projects from design to delivery.
  Partner with product managers and designers to define
  requirements during discovery and planning. Collaborate with
  developers to deliver those requirements on time as new
  features or improvements to existing functionality.

  Why You’ll Love Working Here

  - You will make a tangible impact on society. Your code will
    directly improve healthcare experiences for millions.
  - We are a late-stage startup with stability. We have startup
    energy with a focus on delivery, but healthy processes
    with a strong financial outlook that provides a sense of
    security.

  Position Responsibilities

  In this role, you’ll combine technical leadership with
  hands-on coding to build scalable, high-impact healthcare
  technology. You will:

  - Exercise leadership over features from design to delivery.
  - Be a partner to product, design, and quality assurance team
    members.
  - Become a subject matter expert on your team’s products.
  - Provide technical support to cross-functional team members
    and stakeholders.
  - Expand Judi, our web-based enterprise health platform, using
    Python, AWS services, React/Typescript, and other
    technologies.
  - Work in an Agile/Scrum environment.

  Preferred Qualifications

  We’re looking for someone who brings a mix of technical
  expertise, problem-solving ability, and collaborative
  spirit:

  - 7+ years of job-related experience.
  - Desire to work at a health tech company.
  - Strong Python (Flask / SQLAlchemy) and React / Typescript
    experience.
  - Advanced PostgreSQL database knowledge (e.g., common table
    expressions, windowing functions, views, stored
    procedures, full-text or geospatial indexing).
  - Experience with infrastructure as code using AWS, Terraform,
    or similar technologies.
  - Experience writing unit and integration tests.
  - Git expertise and experience working in a mono repo.
  - Able to demonstrate agency, urgency, and ownership over
    delivering quality work.
  - Strong written and verbal communication skills.
  - Previous Pharmacy Benefits Manager (PBM) experience is a
    plus.

  This position description is designed to be flexible,
  allowing management the opportunity to assign or reassign
  duties and responsibilities as needed to best meet
  organizational goals.

  New York, NY Salary Range

  $139,600—$200,000 USD

  Denver, CO Salary Range

  $128,000—$185,000 USD

  Charlotte, NC Salary Range

  $116,400—$175,000 USD

