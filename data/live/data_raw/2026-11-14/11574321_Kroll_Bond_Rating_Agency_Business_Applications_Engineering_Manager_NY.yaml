description: |
  Position Title: Business Applications Engineering Manager

  Entity: KBRA Holdings, LLC

  Employment Type: Full-time

  Location: New York, New York

  Summary/Overview:

  KBRA is seeking an experienced, hands-on Business
  Applications Engineering Manager to lead, mature, and scale
  its Business Applications function.

  This role is responsible for leading and evolving KBRA's
  Business Applications practice and enterprise application
  portfolio. The position will own the strategy, governance,
  lifecycle management, and day-to-day operation of KBRA's
  SaaS and business application ecosystem, while serving as a
  key technology partner to business stakeholders across the
  firm.

  As KBRA continues to expand its SaaS footprint, the Business
  Applications function is expected to play an increasingly
  strategic role in evaluating, onboarding, integrating,
  governing, and optimizing enterprise applications across the
  organization. This role will establish Business Applications
  as KBRA's center of excellence for SaaS platforms,
  enterprise applications, identity integrations, and
  application governance while building the processes,
  operational visibility, and business partnerships necessary
  to support that growth.

  The Business Applications function is currently supported by
  a single Business Applications Engineer. Upon filling this
  position, the team will consist of two members, including
  the manager. As a result, this is a highly hands-on
  leadership role where the manager is expected to actively
  contribute to engineering, administration, troubleshooting,
  integrations, and project delivery while simultaneously
  driving strategy, governance, operational maturity, and team
  development.

  The ideal candidate is a proactive technical leader who does
  not wait for detailed direction, but instead assesses the
  environment, identifies priorities, creates plans,
  communicates clearly, and drives execution. This individual
  should be capable of building visibility into the team's
  work, developing operational metrics, creating technology
  roadmaps, and translating business needs into scalable
  technology solutions.

  This role will participate in team on-call rotations.
  Occasional travel to other KBRA offices may be required
  based on operational and project needs.

  About the Job:

  The Business Applications Engineering Manager will own and
  lead the management of KBRA's SaaS platforms and enterprise
  application ecosystem. This includes platforms such as
  Microsoft 365, Slack, Zoom, Box, Atlassian products,
  learning management systems, compliance and communication
  platforms, document and content management systems, and
  other business-owned or enterprise SaaS applications.

  The role will partner closely with business groups such as
  Legal, Compliance, Finance, Product, Information Security,
  Infrastructure Engineering, Endpoint Engineering, IT
  Support, and other stakeholders on application selection,
  onboarding, configuration, integration, governance,
  lifecycle planning, and long-term ownership strategies.

  Success in this role requires a leader who can balance
  strategic planning and people leadership with direct
  technical execution. This is not a role where
  responsibilities can be delegated entirely to others. The
  manager is expected to remain deeply involved in the
  technical and operational work of the team while helping
  build a mature, scalable Business Applications function.

  About You: Key Responsibilities:

  Leadership, Strategy, and Portfolio Management

  - Lead and evolve KBRA's Business Applications function,
    establishing the strategy, operating model, and roadmap
    for enterprise applications and SaaS platforms.
  - Own KBRA's enterprise application portfolio, including
    application inventory, ownership models, governance
    standards, lifecycle management, vendor relationships,
    operational risk oversight and opportunities for
    consolidation, rationalization, and modernization.
  - Develop and maintain roadmaps for SaaS governance, identity
    integrations, automation, operational maturity, and
    application modernization.
  - Establish operational metrics, reporting and portfolio
    insights that provide visibility into application health,
    team performance, project delivery, platform adoption,
    operational risks, and workload.
  - Mentor and develop team members while fostering a culture of
    accountability, ownership, collaboration, communication,
    and continuous improvement.

  Business Partnership and SaaS Enablement

  - Serve as a strategic technology partner to business leaders,
    helping evaluate solutions and align technology
    investments with business objectives.
  - Partner with stakeholders across Legal, Compliance, Finance,
    Product and other business groups to understand
    requirements, define ownership models, and support long-
    term application strategy.
  - Guide the evaluation, onboarding, adoption and governance of
    SaaS platforms and business applications.
  - Provide technical and operational guidance on application
    architecture, integrations, access models, governance,
    support strategies and lifecycle planning.
  - Identify opportunities to improve business processes through
    automation, application enhancements, integrations and
    better utilization of existing technology investments.

  SaaS Engineering, Governance, and Operational Excellence

  - Provide hands-on administration, configuration, support and
    troubleshooting across KBRA's SaaS and enterprise
    application ecosystem.
  - Configure and maintain SSO integrations for internally
    developed applications, third-party SaaS platforms, and
    enterprise systems using Microsoft Entra ID and related
    technologies.
  - Manage identity, access, provisioning, entitlement
    management and authentication services across enterprise
    applications.
  - Administer and support platforms such as Microsoft 365,
    Slack, Zoom, Box, Atlassian products, learning management
    systems, compliance platforms and other business-critical
    applications.
  - Lead enterprise application initiatives, including
    integrations, APIs, provisioning workflows, reverse proxy
    solutions, platform implementations and operational
    transitions from planning through ongoing support.
  - Own application governance, including onboarding standards,
    access reviews, testing, deployment coordination, upgrade
    planning, lifecycle management and retirement processes.
  - Partner with Information Security, Infrastructure
    Engineering, Endpoint Engineering and IT Support to ensure
    applications remain secure, compliant, supportable and
    aligned with enterprise standards.
  - Coordinate vendor relationships, technical escalations,
    platform reviews, renewals and optimization initiatives.
  - Act as the senior escalation point for complex application,
    integration, identity and access-related issues while
    driving automation, process improvements and service
    maturity across the function.

  Required Qualifications

  - 7+ years of experience supporting enterprise applications,
    SaaS platforms, identity management, business systems or
    related technology functions.
  - 2+ years of experience leading projects, mentoring
    engineers, managing technical teams or owning enterprise
    application initiatives.
  - Strong hands-on experience administering SaaS and enterprise
    application environments.
  - Strong experience with Microsoft 365 administration,
    configuration, governance and operational support.
  - Experience with Microsoft Entra ID, Azure/Entra enterprise
    applications, SSO, SAML/OIDC, access controls, identity
    integrations, and authentication troubleshooting.
  - Experience managing SaaS integrations, user provisioning,
    identity governance, entitlement models and access
    management.
  - Experience supporting or leading enterprise SaaS
    implementations and application modernization initiatives.
  - Experience developing technology roadmaps, operational
    metrics, governance processes or service maturity
    initiatives.
  - Experience partnering directly with business leaders to
    evaluate, implement and support technology solutions.
  - Strong understanding of application lifecycle management,
    change management, testing, deployment planning and
    operational support.
  - Strong communication, stakeholder management, project
    leadership, and cross-functional collaboration skills.
  - Ability to balance hands-on technical responsibilities with
    leadership, planning, mentoring and strategic ownership.
  - Bachelor's degree in Computer Science, Information
    Technology, or a related field or equivalent work
    experience.
  - Familiarity with Generative AI tools such as ChatGPT for
    research, data insights, and general productivity is a
    plus.

  Preferred Qualifications

  - Experience with platforms such as Slack, Zoom, Box,
    Atlassian products, CMS/DMS platforms, learning management
    systems, compliance platforms, vendor management
    platforms, asset management platforms, ERP systems and
    similar enterprise SaaS tools.
  - Experience supporting Microsoft 365 add-ins, application
    permissions, administrative controls and governance
    processes.
  - Experience with SaaS automation, scripting, APIs,
    provisioning workflows, reporting or operational
    automation.
  - Experience serving as a technology partner to business
    stakeholders for enterprise application selection,
    implementation and governance.
  - Experience building operational metrics, dashboards,
    roadmaps, standards or governance processes for an
    enterprise applications team.
  - Experience in financial services, regulated environments or
    organizations with strong compliance and security
    requirements.

  Salary Range:

  The anticipated annual base salary range for this full-time
  position is $130,000 to $160,000. Offer amounts are
  determined by factors such as experience, skills, geography,
  and other job-related factors.

  Benefits:

  - Competitive benefits and paid time off
  - Paid family and disability leave
  - 401(k) plan, including employer match (100% vested)
  - Educational and professional development financial
    assistance
  - Employee referral bonus program

  About Us:

  Kroll Bond Rating Agency, LLC (KBRA) is a full-service
  credit rating agency registered with the U.S. Securities and
  Exchange Commission as an NRSRO. Kroll Bond Rating Agency
  Europe Limited is registered as a CRA with the European
  Securities and Markets Authority. Kroll Bond Rating Agency
  UK Limited is registered as a CRA with the UK Financial
  Conduct Authority pursuant to the Temporary Registration
  Regime. In addition, KBRA is designated as a designated
  rating organization by the Ontario Securities Commission for
  issuers of asset-backed securities to file a short form
  prospectus or shelf prospectus. KBRA is also recognized by
  the National Association of Insurance Commissioners as a
  Credit Rating Provider.

  More Info:

  KBRA encourages applications from all qualified individuals
  without regard to race, color, religion, gender, sexual
  orientation, gender identity or expression, age, national
  origin, marital status, citizenship, disability, and veteran
  status or any other basis prohibited by federal, state or
  local law.

