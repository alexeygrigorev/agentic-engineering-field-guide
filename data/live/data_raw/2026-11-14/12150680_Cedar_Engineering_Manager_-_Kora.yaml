description: |
  Our healthcare system is the leading cause of personal
  bankruptcy in the U.S. Every year, over 50 million Americans
  suffer adverse financial consequences as a result of seeking
  care, from lower credit scores to garnished wages. The
  challenge is only getting worse, as high deductible health
  plans are the fastest growing plan design in the U.S.

  Cedar’s mission is to leverage data science, smart product
  design and personalization to make healthcare more
  affordable and accessible. Today, healthcare providers still
  engage with its consumers in a “one-size-fits-all” approach;
  and Cedar is excited to leverage consumer best practices to
  deliver a superior experience.

  Kora is Cedar’s conversational AI agent for medical billing,
  and we are expanding its ability to support patients across
  the healthcare financial journey. Kora is at the center of
  Cedar’s overall product strategy going into 2027 so we are
  looking for a hands-on Engineering Manager to help us grow
  its capabilities across voice, chat, and text modalities.
  This role provides a high visibility opportunity to directly
  impact Cedar’s business goals and our ability to help
  patients navigate their healthcare finances.

  In addition to building patient-facing capabilities, you
  will turn what you learn into reusable tools and systems
  that make it faster to develop and scale, including
  orchestration that helps Kora determine the most useful next
  action based on each patient’s context. You will help design
  reliable ways for Kora to work alongside call-center
  specialists, so automation handles routine work and people
  can focus on patients who need a personal touch.

  EMs at Cedar are responsible for their team’s success,
  balancing technical leadership with people development. You
  will lead technical design and contribute production-level
  code while guiding your team toward impactful results.
  You’ll partner with Product, Design, and Data Science to
  implement on product strategy and deliver a frictionless
  financial experience for patients.

  In this position you will:

  - Lead a team of 4-6 engineers, balancing hands-on technical
    leadership with people management.
  - Mentor, coach and develop engineers to support a high-
    performing and inclusive engineering culture.
  - Build, pilot, and scale new AI-powered experiences that help
    patients navigate financial tasks across their healthcare
    journey.
  - Use production behavior and client feedback to evaluate and
    improve the quality, reliability, and impact of AI-powered
    patient support experiences.
  - Collaborate with cross-functional partners to identify high-
    value problems, translate real-world workflows into
    product requirements, and guide build from concept through
    launch.
  - Guide your team into an AI-first software development
    lifecycle while maintaining quality and sound engineering
    judgment.

  What we look for in an ideal candidate:

  - 7+ years of professional software development experience
  - 1+ years of experience in engineering management or
    technical leadership.
  - A track record of shipping end-user products or capabilities
    with measurable customer or business impact.
  - Proactive communication and experience navigating ambiguity,
    tradeoffs, and competing priorities.
  - Experience growing engineers across junior to senior levels
  - You use AI in your day to day work, with a curiosity to
    explore and innovate, and you have experience upleveling
    engineers using AI across the development lifecycle
  - Interest in Cedar’s mission and commitment to improving the
    healthcare financial experience.

  Nice to have:

  - Experience building AI-powered products or agents.

  Applicants must be currently authorized to work in the
  United States on a full-time basis.

  Compensation Range and Benefits

  - Salary Range*: $195,500-$230,000
  - This role is also equity eligible
  - This role offers a competitive benefits and wellness package

  *Subject to location, experience, and education

  #LI-REMOTE #LI-DS

  What do we offer to the ideal candidate?

  - A chance to improve the U.S. healthcare system at a high-
    growth company! Our leading healthcare financial platform
    is scaling rapidly, helping millions of patients per year
  - Unless stated otherwise, most roles have flexibility to work
    from home or in the office, depending on what works best
    for you
  - For exempt employees: Unlimited PTO for vacation, sick and
    mental health days–we encourage everyone to take at least
    20 days of vacation per year to ensure dedicated time to
    spend with loved ones, explore, rest and recharge
  - 16 weeks paid parental leave with health benefits for all
    parents, plus flexible re-entry schedules for returning to
    work
  - Diversity initiatives that encourage Cedarians to bring
    their whole selves to work, including three employee
    resource groups: be@cedar (for BIPOC-identifying Cedarians
    and their allies), Pridecones (for LGBTQIA+ Cedarians and
    their allies) and Cedar Women+ (for female-identifying
    Cedarians)
  - Competitive pay, equity (for qualifying roles), and health
    benefits, including fertility & adoption assistance, that
    start on the first of the month following your start date
    (or on your start date if your start date coincides with
    the first of the month)
  - Cedar matches 100% of your 401(k) contributions, up to 3% of
    your annual compensation
  - Access to hands-on mentorship, employee and management
    coaching, and a team discretionary budget for learning and
    development resources to help you grow both professionally
    and personally

  About us

  Cedar was co-founded by Florian Otto and Arel Lidow in 2016
  after a negative medical billing experience inspired them to
  help improve our healthcare system. With a commitment to
  solving billing and patient experience issues, Cedar has
  become a leading healthcare technology company fueled by
  remarkable growth. "Over the past several years, we've
  raised more than $350 million in funding & have the active
  support of Thrive and Andreessen Horowitz (a16z).

  As of November 2024, Cedar is engaging with 26 million
  patients annually and is on target to process $3.5 billion
  in patient payments annually. Cedar partners with more than
  55 leading healthcare providers and payers including
  Highmark Inc., Allegheny Health Network, Novant Health,
  Allina Health and Providence.
