description: |
  Stora is building the operating platform for modern self-
  storage businesses.

  Our software helps operators manage bookings, payments,
  customers, facilities and day-to-day operations from one
  place, while automating much of the work that traditionally
  makes running a self-storage business unnecessarily
  complicated.

  In just over four years, we’ve helped more than 300
  operators process tens of millions in automated payments.
  We’re recognised as innovators in our space, and we’re a
  fast-growing, product-led team focused on making self-
  storage better for everyone.

  About the role

  We’re hiring a mid-level Software Engineer to join our
  growing product team.

  You’ll work alongside experienced engineers to build and
  improve our Rails-based platform, contributing to customer-
  facing features, internal tools and the ongoing stability
  and performance of the product.

  This role is well suited to someone with solid Ruby on Rails
  experience who is comfortable working across the stack,
  including JavaScript and CSS when needed.

  We work best with self-starting team players: people who
  take ownership, communicate clearly and enjoy working in
  small, focused teams. You’ll have support from senior
  engineers, but you should also be comfortable working
  independently on well-defined tasks.

  What you'll be doing

  - Build and maintain product features, taking ownership from
    initial discussion through to deployment.
  - Collaborate with Product and other stakeholders to define
    and refine the scope of new features.
  - Contribute to app maintenance. We aim to spend at least 20%
    of our time improving stability, performance and developer
    experience.
  - Write and maintain tests so we can confidently deploy to
    production multiple times per day.
  - Investigate, debug and resolve issues to keep the system
    stable as we scale.
  - Act on monitoring insights to keep the app performant and
    reliable.
  - Contribute to code reviews and team discussions.
  - Learn from senior engineers and continue developing your
    skills in a collaborative environment.

  Our technology stack

  Backend: Rails 7, PostgreSQL, Redis, Sidekiq Frontend:
  Hotwire/Turbo 8, targeted React, ViewComponents, Sass, BEM
  Testing: Minitest, Capybara, Selenium Payments: Stripe
  Connect and Billing Deployment: GitHub Actions, Heroku

  What we’re looking for

  - 3+ years of professional software development experience,
    including at least 2 years working with Ruby on Rails.
  - Solid understanding of Rails and its ecosystem, including
    ActiveRecord, background jobs and the request/response
    cycle.
  - Ability to work independently on well-defined tasks while
    collaborating effectively with the wider team.
  - Comfortable working across the stack, including JavaScript
    and CSS when needed.
  - Familiarity with writing tests using Minitest, RSpec or
    similar.
  - Comfortable debugging and troubleshooting production issues.
  - Good communication skills, with the ability to discuss
    technical challenges, trade-offs and blockers clearly.
  - Excited to work in a small, fast-moving product team
    alongside experienced engineers.

  Why join us?

  Stora offers a collaborative environment where you’ll have
  room to grow, contribute and do meaningful product work.

  We value honesty, humility and responsibility. We encourage
  everyone to contribute ideas, take ownership of their role
  and help us improve the way we build.

  As part of Stora, you’ll have the opportunity to make a
  direct impact on our product and play an important role in a
  rapidly evolving industry.



  Benefits and compensation

  - Competitive salary: From £50,000 (or Euro equivalent)
  - Remote work: Fully remote within the UK or EU. Candidates
    must be based in either the United Kingdom or the European
    Union.
  - Office access: Use of our Belfast office for those who live
    locally.
  - Health and wellness: Private health insurance for you and
    your family.
  - Retirement: Company pension plan.
  - Leave: 35 days paid annual leave inclusive of public
    holidays (dependent on location)
  - Professional growth: Share options, WFH budget and
    opportunities for in-person meetups.

  Next steps

  We’re actively reviewing CVs on an ongoing basis and will
  reach out if your profile feels like a good match for the
  role.

  Equality, diversity and inclusion

  At Stora, we’re committed to building a team where everyone
  feels welcome, respected and able to do their best work.

  We value different perspectives, backgrounds and
  experiences, and we’re committed to creating an inclusive
  environment for all employees and applicants.

  We welcome applications from people of all backgrounds,
  regardless of age, disability, gender identity, marital or
  family status, race, religion or belief, sex, sexual
  orientation or socio-economic background.
