description: |
  C.H Robinson is seeking a Senior Software Engineer on our
  Book-It-Now/Digital Negotiator Costing team where you will
  collaborate with our data science teams to costing
  automation and platforms to more efficiently find
  capacity/trucks to place shipments on. This role will focus
  on iterating and improving on machine-learning based pricing
  and costing solutions with a focus on experimentation and
  having a significant measurable impact. Help us take the
  system to the next level of uptime and data management
  (real-time/near real-time). In particular, this specific
  role will be focused on building harnesses to increase speed
  and correctness of AI and Human pricing and costing
  adjustments, including context management, building
  verification guardrails, and live
  experimentation/measurement of results, as well as
  contributing to the team’s AI coding harness and
  implementation.

  In this role, you will engage with your peers from the
  comfort of your own space, using cutting-edge tools to
  ignite creativity and deliver impactful results. Enjoy the
  flexibility and autonomy of a fully remote position, while
  still being an integral part of our dynamic team.

  Responsibilities:

  - Design, develop, and support scalable Python-based services,
    APIs, and event-driven solutions that power digital
    freight pricing, booking, and carrier experiences
  - Build intelligent platforms and experimentation frameworks
    that improve the speed, accuracy, and reliability of AI-
    driven and human-assisted pricing and costing decisions
  - Partner with data science teams to deploy, validate, and
    continuously optimize machine learning solutions that
    drive automation and measurable business impact
  - Develop real-time and near real-time systems that improve
    platform performance, data quality, observability, and
    operational excellence
  - Lead technical design discussions, translate complex
    business challenges into scalable solutions, and influence
    architecture decisions across multiple domains
  - Implement engineering best practices related to testing,
    security, monitoring, automation, and continuous delivery
    to ensure highly available and resilient systems
  - Mentor engineers, share technical expertise, and help
    elevate software development practices across the team
  - Collaborate closely with Product, Architecture, Revenue
    Management, Operations, and Engineering partners to
    deliver innovative customer-focused solutions
  - Contribute to AI-assisted engineering capabilities,
    including coding harnesses, validation guardrails, and
    productivity-enhancing development tools

  Required Qualifications:

  - 7+ years of professional software engineering experience
  - Expert-level Python development skills
  - Strong understanding of software architecture, distributed
    systems, and API design
  - Experience with AI-assisted development tools and modern
    engineering productivity practices, including coding
    agents and harnesses
  - Experience building and operating cloud-native applications
  - Experience with REST APIs, microservices, and event-driven
    architectures
  - Strong knowledge of SQL and NoSQL databases
  - Experience with automated testing frameworks and CI/CD
    pipelines
  - Proficiency with Git and Azure DevOps
  - Strong understanding of software security principles and
    secure development practices
  - Demonstrated ability to lead complex technical initiatives
    from concept through production

  Preferred Qualifications:

  - Experience with FastAPI, Flask, or similar Python frameworks
  - Experience with Azure cloud services, Kubernetes, and
    containerized workloads
  - Experience building highly transactional systems
  - Experience with pricing, booking, order management,
    logistics, transportation, or marketplace platforms
  - Experience working with data-intensive applications and
    real-time decisioning platforms
  - Experience improving the quality, reliability, and
    maintainability of large-scale software platforms

  We will review applications for this role on an ongoing
  basis and encourage all interested candidates to apply at
  their earliest convenience.

  Compensation Range

  $113,000.00 - $254,200.00

  The base pay range displayed on each job posting reflects
  the minimum and maximum base pay for the position across all
  U.S. locations. Your individual base pay within this range
  is determined by work location, which takes into account
  geographic cost of labor, and additional factors, including
  job-related skills, experience, and relevant education or
  training. Compensation details listed in this posting
  reflect the base pay only and do not include additional
  variable compensation.

