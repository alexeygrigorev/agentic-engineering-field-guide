description: |
  Overview: Founded in 1972, The Door empowers educationally
  and economically disadvantaged youth to reach their
  potential by providing a complete range of services all
  under one roof. Each year over 7,000 young people from all
  five New York City boroughs come to The Door for primary
  health care, reproductive care and health education, mental
  health counseling, legal services, supportive housing, GED,
  ESL, tutoring and homework help, college preparation and
  computer classes, career & education services, job
  placement, daily meals, cultural arts and services.
  Reporting directly to the Data Associate Director, the Data
  Services Manager is responsible for executing and
  maintaining the cross-program data needs for our
  organization along with team members.

  Position Summary

  The Data Systems & Solutions Manager serves as the agency's
  primary technical resource for data systems administration,
  database management, reporting infrastructure, system
  integrations, and Salesforce platform support. This role is
  responsible for ensuring the reliability, scalability,
  integrity, and usability of data systems that support
  program operations, compliance reporting, agency performance
  measurement, and strategic decision-making.

  The Manager works closely with program staff, agency
  leadership, and technical stakeholders to maintain and
  enhance the organization's data ecosystem, improve reporting
  capabilities, strengthen data quality practices, and support
  the effective use of technology across the agency. This
  position also supports monthly, quarterly, annual, and ad
  hoc reporting requirements, agency-wide dashboard metrics,
  and performance management initiatives. This role reports to
  the Assistant Director of Data Systems and Solutions

  Essential ResponsibilitiesData Engineering & Database
  Management

  - Develop, maintain, optimize, and troubleshoot SQL queries,
    reports, and database processes.
  - Manage and support relational databases, data warehouses,
    and reporting environments.
  - Maintain ETL/ELT processes and automated data pipelines to
    ensure reliable data movement across systems.
  - Monitor, troubleshoot, and resolve data integration
    failures, pipeline issues, and data quality concerns.
  - Import, transform, validate, and reconcile data from
    multiple source systems.
  - Support database administration activities, including field
    creation, schema updates, user access management, and
    system maintenance.
  - Identify and implement opportunities to automate reporting
    and improve data workflows.
  - Collaborate with stakeholders to define technical
    requirements and develop scalable data solutions.

  Systems Administration

  - Configure and maintain Salesforce and related case
    management systems that support program operations.
  - Manage system configurations, including layouts, fields,
    record types, workflows, reports, dashboards, and user
    permissions.
  - Troubleshoot technical issues and coordinate system
    enhancements and feature releases.
  - Ensure systems are configured to support operational needs,
    reporting requirements, and compliance standards.
  - Provide technical support and consultation to program staff
    and leadership.

  Analytics & Reporting

  - Support in the development and maintenance of dashboards,
    reports, and business intelligence solutions using
    Salesforce, SQL, Power BI, Tableau, or similar platforms.
  - Develop and maintain agency-wide performance metrics and
    dashboard reporting.
  - Produce recurring operational, compliance, funding, and
    leadership reports.
  - Develop automated reporting processes and performance
    measurement tools.
  - Analyze complex datasets and present findings, trends, and
    recommendations to both technical and non-technical
    audiences.
  - Support data-informed decision-making across programs and
    agency leadership.

  Data Governance & Documentation

  - Develop and maintain data dictionaries, system
    documentation, workflow documentation, metadata
    inventories, business process maps, and technical
    specifications.
  - Establish and promote data governance standards and best
    practices.
  - Support agency-wide data quality monitoring and continuous
    improvement efforts.
  - Document system configurations, integrations, reporting
    processes, and technical procedures.
  - Ensure compliance with organizational policies related to
    data security, privacy, retention, and governance.
  - Promote responsible use of AI technologies by ensuring
    alignment with organizational policies, data governance
    standards, privacy requirements, security practices, and
    applicable regulations, including HIPAA where appropriate.

  Training & Collaboration

  - Develop user guides, training materials, and standard
    operating procedures.
  - Conduct onboarding and training for staff on agency systems,
    reporting tools, and data collection processes.
  - Serve as a liaison between program teams and technical
    resources.
  - Partner with managers and leadership to identify system,
    reporting, and operational needs.
  - Support strategic initiatives focused on technology
    adoption, process improvement, and systems modernization.

  QualificationsEducation

  - Bachelor's degree in Computer Science, Information Systems,
    Data Analytics, Data Science, Engineering, Mathematics,
    Statistics, or a related field required.
  - An equivalent combination of education and relevant
    experience may be considered.
  - Salesforce, Microsoft, SQL, or related technical
    certifications are preferred.

  Required Qualifications

  - Four or more years in data systems administration, database
    management, data engineering, business intelligence,
    reporting, or a related technical role
  - Strong knowledge of SQL and relational database systems,
    such as Azure SQL, SQL Server Management Studio (SSMS), or
    similar platforms
  - A track record of maintaining data pipelines, automated
    workflows, and system integrations
  - Hands-on administration of CRM, case management, or program
    management systems
  - Skill in building reports, dashboards, and data
    visualizations
  - Ability to explain technical concepts clearly to non-
    technical stakeholders
  - Proven ability to produce technical documentation, workflow
    documentation, and user training materials
  - Ability to diagnose and resolve complex system, integration,
    reporting, and data quality issues
  - Strong analytical, critical-thinking, and problem-solving
    skills
  - Familiarity with HIPAA, data privacy, and information
    security best practices
  - Ability to work independently and collaboratively in a fast-
    paced, mission-driven environment

  Preferred Qualifications

  - Background in nonprofit, human services, youth development,
    education, healthcare, or related settings
  - Understanding of emerging AI technologies, with the ability
    to assess, implement, and monitor AI solutions in line
    with organizational policies, data privacy requirements,
    and responsible AI practices
  - Salesforce Administration expertise
  - Familiarity supporting integrations between Salesforce and
    systems like electronic medical records, Formstack, and
    School Information Systems
  - Working knowledge of API-based integrations and data
    exchange processes
