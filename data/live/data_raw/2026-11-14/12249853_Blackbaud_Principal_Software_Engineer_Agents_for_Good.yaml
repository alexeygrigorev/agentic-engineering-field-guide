description: |
  About the role:

  We're looking for a Principal Software Engineer to help lead
  the design and implementation of Blackbaud's agentic AI
  products, and the frameworks other teams use to build new
  agents as part of our Agents for Good team. This is a hands-
  on, high-impact technical role where you'll shape the
  architecture of agent features, mentor engineers, and guide
  the adoption of AI-native development practices that power
  innovation for social good.

  What you'll be doing:

  - Implement complex software systems integrating Generative AI
    and agentic capabilities

  - Design, build, and maintain efficient, scalable code for
    Blackbaud's AI agents and the shared frameworks used to
    build new agents

  - Lead cross-functional collaboration on technical solutioning
    and project delivery

  - Ensure performance, reliability, and security of AI-enabled
    and agentic features

  - Evaluate and improve prompt performance, agent
    orchestration, and AI-driven workflows

  - Champion AI-native development practices across Blackbaud's
    AI-native PDLC, from Specify to Release using tools like
    Claude Code, and help establish them as a team standard

  - Collaborate with product and UX teams to deliver accessible,
    user-friendly experiences

  - Serve as a subject matter expert for LLM and agent
    deployment, operation, and monitoring

  - Actively mentor and support the growth of other engineers

  - Maintain high quality development standards and practices

  - Contribute to the evolution of Blackbaud's AI and agent
    platform strategy

  What we'll want you to have:

  - 8+ years of experience in software engineering, including
    leadership in AI-related projects

  - Deep understanding of .NET Core, C#, and modern web
    technologies

  - Proficiency in Angular, JavaScript/TypeScript, CSS, and HTML

  - Proven success building and deploying Generative AI and/or
    agentic features

  - Experience with prompt engineering, agent orchestration, and
    optimizing LLM behavior

  - Hands-on experience with AI-native development processes,
    including AI coding assistants such as Claude Code,
    applied across Blackbaud's AI-native PDLC from Specify to
    Release

  - Familiarity with SQL Server, Cosmos DB, and RESTful API
    development

  - Experience with cloud-based AI infrastructure (Azure, AWS,
    GCP)

  - Strong grasp of Agile methodology and continuous delivery
    practices

  - Excellent communication and collaboration skills

  Stay up to date on everything Blackbaud, follow us on
  Linkedin, Twitter, Instagram, Facebook and YouTube

  Blackbaud powers social impact through purpose‑driven
  technology and responsible AI. Guided by our Intelligence
  for Good® vision, we’re building a culture where innovation,
  trust, and human expertise come together to help
  organizations make a greater difference in the world.

  Blackbaud is proud to be an equal opportunity employer and
  is committed to maintaining a diverse and inclusive work
  environment. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, gender, gender identity or expression, sexual
  orientation, national origin, physical or mental disability,
  age, or veteran status or any other basis protected by
  federal, state, or local law.

  The starting base pay is $133,700.00 to $173,800.00.
  Blackbaud may pay more or less based on employee
  qualifications, market value, Company finances, and other
  operational considerations.

  Benefits Include:

  - Medical, dental, and vision insurance
  - Remote-flexible workforce
  - Wellness Programs
  - 401(k) program with employer match
  - Flexible paid time off
  - Generous Parental Leave
  - Donations for Doers
  - Pet insurance, legal and identity protection
  - Tuition reimbursement program
