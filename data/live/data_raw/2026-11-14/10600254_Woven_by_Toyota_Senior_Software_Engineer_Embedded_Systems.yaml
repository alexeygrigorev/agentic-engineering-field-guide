description: |
  Woven by Toyota is enabling Toyota’s once-in-a-century
  transformation into a mobility company. Inspired by a legacy
  of innovating for the benefit of others, our mission is to
  challenge the current state of mobility through human-
  centric innovation — expanding what “mobility” means and how
  it serves society.

  Our work centers on four pillars: AD/ADAS, our autonomous
  driving and advanced driver assist technologies; Arene, our
  software development platform for software-defined vehicles;
  Woven City, a test course for mobility; and Cloud & AI, the
  digital infrastructure powering our collaborative
  foundation. Business-critical functions empower these teams
  to execute, and together, we’re working toward one bold
  goal: a world with zero accidents and enhanced well-being
  for all.

  TEAM

  Arene’s goal is to open vehicle programming to everyone by
  simplifying vehicle software development and increasing
  deployment frequency without compromising safety and
  security. This will create a whole new market of vehicle
  application developers who, through software, integrate a
  vehicle into our daily lives in novel ways. Arene aims to
  significantly improve how vehicles are designed and
  developed, and we’re working closely with Toyota to realize
  this goal in its next-generation vehicles.

  A major component of the Arene Engineering team’s mission is
  to streamline software delivery and enhance operational
  speed in the automotive industry by developing innovative
  test, emulation, and simulation systems. We aim to
  facilitate quicker software releases and elevate the overall
  quality of automotive solutions, maintaining an
  uncompromised commitment to safety. The Arene organization
  is growing and we are establishing an engineering center in
  London, UK to strengthen our global team.

  WHO ARE WE LOOKING FOR?

  We are looking for software engineers who are excited to
  help build a state-of-the-art automotive platform that is
  “software first”. We envision the Arene platform will change
  the way vehicles are made. The ideal candidate will have a
  passion for technology and thrive in a fast-paced
  environment. Our team is developing tools and systems using
  modern software techniques. We need software engineers who
  excel at building robust software systems to solve
  challenging problems at scale.

  The ideal candidate would have a considerable background in
  developing complex software with modern C++ over embedded
  systems.

