  Senior Software Engineer – Communications Platform

  Location: London Office (Hybrid: 4 days in-office / 1 day
  WFH)

  The Role

  We are seeking an exceptional Senior Software Engineer to
  join our Communications Platform team in London. As a Senior
  Engineer, you will take ownership of large, mission-critical
  services, products, and platforms from day one—deploying
  production code within your first week.

  We identify and nurture future technical leaders, offering
  an accelerated career progression path for engineers who
  demonstrate exceptional performance and aptitude.

  What You’ll Do

  - Architect & Build: Design, develop, test, and deploy high-
    quality, scalable software solutions for our global
    financial communications platform.
  - End-to-End Ownership: Take responsibility for the full
    software development lifecycle—from initial ideation and
    technical design to deployment and operational
    maintenance.
  - Technical Leadership: Lead architectural design reviews and
    technical discussions to shape the future of our tech
    stack and standardize communication patterns in a
    centralized architecture.
  - Engineering Excellence: Drive high standards through
    rigorous code reviews, automated testing, and CI/CD best
    practices.
  - Cross-Functional Collaboration: Partner closely with product
    managers, designers, and engineering teams to deliver
    robust features.
  - AI Integration: Leverage modern AI tools to augment your
    workflow and accelerate delivery, taking full ownership
    and understanding of the code you deploy.

  What We’re Looking For

  Qualifications & Experience

  - Technical Experience: Demonstrable track record writing
    production-grade code (typically around 7+ years of
    experience, but competency, aptitude, and impact matter
    more to us than years).
  - Education: Bachelor’s or Master’s degree in Computer
    Science, Software Engineering, or a related technical
    field (or equivalent practical experience).
  - Core Fundamentals: Deep understanding of computer science
    principles, including data structures, algorithms, system
    design, and complexity analysis.
  - Polyglot Engineering: Strong programming proficiency in at
    least one modern language (e.g., Python, Java, Go).
  - Problem-Solving & Communication: Analytical mindset with
    strong communication skills and a highly collaborative
    approach to teamwork.

  Nice-to-Haves / Desirable

  - Experience in FinTech or financial services.
  - Experience building scalable distributed systems integrated
    with communications providers (e.g., Twilio, SendGrid,
    Amazon SNS, Vonage, WhatsApp, Firebase).
  - Knowledge of domain-specific topics such as Sender ID
    verification, email reputation management, and intelligent
    message routing.
  - Exposure to Domain-Driven Design (DDD).
  - Hands-on experience with cloud platforms (AWS, GCP, Azure)
    and containerization (Docker, Kubernetes).
  - Open-source contributions or a personal portfolio showcasing
    technical curiosity.

  What We Offer

  - Competitive Compensation: Market-leading salary,
    performance-based bonus, and comprehensive benefits
    package.
  - Accelerated Growth: Structured career development path with
    dedicated mentorship from senior technical leaders.
  - High Impact: Opportunity to own complex, mission-critical
    projects that drive real business impact from day one.
  - Modern Culture: A dynamic, high-performance, and inclusive
    environment within a rapidly growing global leader.

  LI-AT1

  About us

  Ebury delivers sophisticated, integrated solutions —
  business accounts, hedging, and financing — on a single
  platform with a seamless workflow. Our success is built on a
  simple premise and singular purpose: To help businesses
  operate and scale globally.

  Since its founding in 2009, Ebury has always been a fast-
  growing leader in fintech. Today, we bring together 2000+
  Eburians across nearly 70 cities and we’re always looking to
  add to our team.

  At the heart of our offering is a proprietary platform,
  purpose-built to help businesses seamlessly streamline and
  manage global cash flow. We focus on continuous product
  evolution and innovation to build the infrastructure for
  borderless growth and help our clients scale at every stage.

  The opportunities at Ebury are as diverse as our people,
  ranging from business development to engineering roles
  across our tech pillars.

  We believe in inclusion. We stand against discrimination in
  all forms and are against the intolerance of differences
  that makes us a modern and successful organisation. At
  Ebury, you can be whoever you want to be and still feel a
  sense of belonging no matter your story.

