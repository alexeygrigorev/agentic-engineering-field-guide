description: |
  Join Axon and be a Force for Good.

  At Axon, we’re on a mission to Protect Life. We’re
  explorers, pursuing society’s most critical safety and
  justice issues with our ecosystem of devices and cloud
  software. Like our products, we work better together. We
  connect with candor and care, seeking out diverse
  perspectives from our customers, communities and each other.
  Life at Axon is fast-paced, challenging and meaningful.
  Here, you’ll take ownership and drive real change.
  Constantly grow as you work hard for a mission that matters
  at a company where you matter.

  About Axon 911

  Axon 911 brings together Prepared and Carbyne under Axon.
  Together, we are creating the only platform that combines
  modern 911 infrastructure with an AI intelligence
  layer—helping public safety agencies move faster, make
  better decisions, and deliver better outcomes in the moments
  that matter most. 911 is the backbone of public safety, yet
  the professionals behind it have long been held back by
  outdated technology. Axon 911 is here to change that.
  Joining this team means more than taking a job—it means
  helping shape the future of emergency response and building
  a safer, more connected world.

  Position Overview

  We are looking for an experienced platform engineer to join
  Prepared's platform engineering team under Axon 911. As a
  platform engineer, you’ll play a core role in continuing to
  define our infrastructure and overall developer platform, as
  well as contributing to core applications in collaboration
  with the broader software team. This is an opportunity to
  join a growing engineering org and make a large impact while
  operating with a high degree of autonomy and ownership.

  You will be responsible for designing, building, and
  maintaining the software and infrastructure that keep our
  software and the team that builds it running smoothly from
  development through to production. This role requires a
  blend of strategic vision and hands-on technical skills.

  This is a hybrid role, with an expectation of four days per
  week in our Manhattan office.

  Key Responsibilities

  - Design, build, and maintain scalable, reliable, and secure
    infrastructure to support Prepared’s platform.
  - Develop and implement best practices for software
    development, deployment, and monitoring.
  - Automate repetitive tasks to enhance the efficiency and
    reliability of the engineering team.
  - Help the team implement and define SLOs and report on
    customer SLAs.
  - Participate in architectural discussions and contribute to
    the long-term strategy of the platform.
  - Mentor junior engineers and help shape the engineering
    culture within the team.
  - Travel occasionally to support customer deployments and
    onsite implementations

  What Makes You a Great Fit

  - 5+ years of software engineering industry experience.
  - Proven capacity to operate in a platform engineering or
    similar role.
  - Experience with large-scale distributed systems.
  - Desire to work in a fast-paced and dynamic startup
    environment.
  - Strong knowledge of cloud platforms such as AWS, Google
    Cloud, or Azure.
  - Working knowledge of infrastructure-as-code tools like
    Terraform, Pulumi, or Crossplane.
  - Experience with containerization and orchestration
    technologies such as Docker and Kubernetes.
  - Solid understanding of CI/CD pipelines and tools like Github
    Actions, Drone CI, or Gitlab CI.
  - Proficiency in or eagerness to learn our backend stack (RoR,
    Go).
  - Familiarity with monitoring and logging tools and standards
    such as OpenTelemetry, Datadog, and the LGTM stack.
  - Strong communication skills and a love for both producing
    and consuming documentation.
  - Our team is leaning into agentic software development
    workflows, and we’re looking for engineers who have
    experimented with—or are enthusiastic about embracing—AI-
    augmented ways of building software.

  Bonus

  - Experience in an early-stage startup.
  - Knowledge of security and compliance best practices and
    experience implementing them in a fast-moving environment.
  - Expertise in Ruby on Rails, Golang, and/or IaC tools.

  Benefits that Benefit You

  - Competitive salary and 401k with employer match
  - Discretionary time off
  - Paid parental leave for all
  - Medical, Dental, Vision plans
  - Fitness Programs
  - Emotional & Development Programs
  - And yes, we have snacks in our offices

  The Pay: Axon is a total compensation company, meaning
  compensation is made up of base pay, bonus, and stock
  awards. The starting base pay for this role is between USD
  141,000 in the lowest geographic market and USD 216,600 in
  the highest geographic market. The actual base pay is
  dependent upon many factors, such as: level, function,
  training, transferable skills, work experience, business
  needs, geographic market, and often a combination of all
  these factors. Our benefits offer an array of options to
  help support you physically, financially and emotionally
  through the big milestones and in your everyday life. To see
  more details on our benefits offerings please visit
  www.axon.com/careers/benefits

