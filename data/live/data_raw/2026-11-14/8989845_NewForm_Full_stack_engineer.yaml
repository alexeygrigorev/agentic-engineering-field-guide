description: |
  About

  NewForm is building marketing tools for the new age of
  advertising. Most marketing analytics products are audience-
  focused and have become obsolete as platforms like Meta,
  Tiktok, etc move to a content-first philosophy. We are first
  and foremost a tech-enabled service, deploying our
  proprietary technology and service in tandem to drive
  outcomes for our clients.

  Our Products

  Our AI-powered suite of tools includes:

  - Framework: A proprietary statistical engine to test
    creatives 30% more efficiently than manual testing, saving
    budget and accelerating the finding of winners
  - WillBot: An AI-powered Slack chatbot that keeps teams
    connected to their marketing metrics in real-time
  - More: Custom-built solutions for reporting, dashboards, and
    media buying automation

  Our Impact

  We've partnered with innovative brands across industries,
  including Acorns, Bluechew, Found, Coffee Meets Bagel,
  RentApp, Western Union and more.

  Our Advantage

  What sets us apart is our unique combination of deep
  marketing expertise and cutting-edge AI technology. We are
  in the arena applying years of hands-on marketing experience
  to create solutions that deliver real-world results. Plus,
  we leverage a large list of existing client relationships to
  build more quickly and effectively.

  What you'll do in this role

  - You'll take ownership of projects from code to
    infrastructure. We're looking for someone who has set up
    production systems before and isn't afraid to build and
    deploy products from scratch.
  - You will operate autonomously, working closely with
    leadership to define product roadmap and deploy new
    feaures. We don't have product managers. You will be
    speaking to the internal team and our clients directly,
    building things that actually move the needle.
  - You're a full-stack engineer with robust LLM,
    Node/Typescript and React (Next.js) experience and a
    willingness to learn. Our current stack consists of a
    Typescript backend, Next.js frontend, and LLM API based
    chat and classifiers. As our product grows, you'll be
    ready to tackle challenges wherever they might come up. If
    a project requires working with something you're not
    familiar with, you'll take time to learn a new technology.

  Who you are

  - You have 3+ years of experience as a software engineer.
  - You're experienced with LLMs, Typescript & Next.js. You're
    familiar with building complex Typescript/Node backends,
    as well as with building modern React frontends that
    handle complex data visualizations. You also have some
    familiarity with leveraging LLM APIs like OpenAI,
    Anthropic and/or Gemini to build chatbots.
  - You're a full-stack generalist who loves a good challenge.
    You can build features end-to-end and reliably ship well-
    tested code, with an eye towards maintainability.
  - You love learning new technologies. Whether it's working
    with the newest o1 reasoning language model APIs, setting
    up Voice to Voice LLMs or interacting with a brand new
    APIs from partners, you’re excited about learning
    something new and quickly pick it up.
  - You have an entrepreneurial streak and/or demonstrated
    history of technical leadership. You've done cool things
    in the past, both at work and outside the office.

  Benefits

  - This is a full-time in-office position (NYC). Engineers are
    expected to be in office 3-4 days/week.
  - Competitive compensation (100-180k/yr base)
  - Competitive equity (.25%-1% at a company doubling YoY for
    the last two years)
  - Company-paid health, dental, and vision insurance
  - 300/mo commuter benefit
  - Annual team offsites (last two were Tulum, Mexico and
    Hokkaido, Japan)

  Work Authorization Requirement Candidates must be authorized
  to work in the United States without employer sponsorship,
  now or in the future. We are unable to provide visa
  sponsorship for this role, including in the future.
