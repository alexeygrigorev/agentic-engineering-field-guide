description: |
  Senior Software Engineer

  Regular Position, Full Time Bronx, NY | Irving, TX |
  Sacramento, CA

  If you are a forward-thinking engineering professional
  interested in embedded systems, software development, and
  solving complex technical challenges, then keep reading! We
  are searching for an experienced Senior Software Engineer to
  join our Engineering team at Vantage Elevation.

  You’ll play a hands-on role in the design, development,
  testing, and continuous improvement of embedded software for
  elevator control systems, helping deliver quality, safety,
  and reliability across our products.

  About Us

  Vantage Elevation, LLC is an independent, industry-leading
  manufacturer of elevator components and systems with a long
  history of innovation and reliability.

  Founded in 1899, Vantage employs over 1,000 people across
  manufacturing sites and offices in the United States,
  Canada, and the United Kingdom. Through its family of
  brands, GAL Manufacturing, GAL Canada, Hollister-Whitney,
  Elevator Controls, Courion, Bore-Max, Thames Valley
  Controls, and Vertical Dimensions, Vantage supports nearly
  every electro-mechanical device used in modern elevators.

  Vantage’s mission is to safely connect people and
  communities by providing reliable elevator solutions. We
  support our teams, work closely with our customers, and hold
  ourselves accountable for quality, safety, and integrity in
  everything we do.

  Requirements

  We are searching for a candidate with:

  - Bachelor’s degree in Electrical Engineering, Computer
    Engineering, or a related field (or equivalent experience)
  - Minimum of 10 years of experience in real-time embedded
    software engineering
  - Strong experience with C and C++ programming
  - Experience with embedded real-time operating systems
  - Strong embedded firmware development and troubleshooting
    skills
  - Familiarity with revision control systems such as Git
  - Excellent written and verbal communication skills
  - Self-motivated with the ability to manage multiple
    priorities with minimal supervision
  - Experience leading small projects and mentoring team members

  Preferred Qualifications:

  - Elevator industry experience and knowledge of elevator
    control systems
  - Experience with low-level device drivers
  - Experience with scripting tools such as Bash, PowerShell,
    Python, or Make/Cygwin
  - Experience with C#, PHP, JavaScript, HTML, and CSS

  Duties and Responsibilities

  A typical day may include:

  - Designing, developing, modifying, and maintaining embedded
    software using C and C++
  - Collaborating with field service, manufacturing, and
    engineering teams to resolve technical issues
  - Working closely with electrical and mechanical engineering
    teams on product development
  - Performing functional tests of software updates and
    enhancements
  - Documenting software functionality and system behavior
  - Mentoring junior engineers and providing technical guidance
  - Supporting the development of best practices, coding
    standards, and design processes
  - Participating in field testing or troubleshooting as needed
    (occasional travel)
  - Performing additional duties as assigned to support team and
    organizational goals

  Benefits of Working With Us

  - The anticipated base salary range for this position is
    $150,000–$170,000 annually. Placement within the range
    will be based on the candidate’s relevant experience,
    demonstrated capabilities, qualifications, and geographic
    location.
  - Paid Time Off and sick time
  - Medical, Dental, Vision, and Life Insurance
  - Health Savings Account (HSA)
  - 401(k) with Company Match and Non-Elective Contributions
  - Tuition Reimbursement opportunities
  - Employee Assistance Program (EAP)
  - Plum Benefits and additional employee discount programs
  - Opportunities for professional growth and development

  Position Details

  - Schedule: Generally Monday–Friday, 8:00 AM–4:30 PM local
    time
  - Location: This position may be based at Vantage Elevation's
    Bronx, NY; Irving, TX; or Sacramento, CA location.
  - Office-based engineering environment with frequent cross-
    functional collaboration
  - Occasional overtime may be required to meet project
    deadlines
  - Occasional travel for on-site testing and troubleshooting

  Equal Employment Opportunity

  Vantage Elevation, LLC provides equal employment
  opportunities to all employees and applicants for employment
  and prohibits discrimination and harassment of any type
  without regard to race, color, religion
