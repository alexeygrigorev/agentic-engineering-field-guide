  Engineers. This is a hands-on individual-contributor role
  for engineers who sit at the seam between deep technical
  craft and sharp product judgment. You'll own customer-facing
  products end to end across the full stack, shape what gets
  built rather than just how, and build the next generation of
  AI-native and agentic experiences used by teams all over the
  planet. In this role, you will:

  - Own customer-facing product experiences end to end across
    the full stack - taking ambiguous problems all the way to
    shipped, measured outcomes
  - Lead technical strategy and the implementation large-scale
    features and systems
  - Partner with product, design, data, and engineering to
    influence product strategy and direction
  - Evaluate trade-offs between correctness, robustness,
    performance, and customer impact to ensure we build the
    right solution
  - Contribute to system design, code reviews, documentation,
    and best practices with security, performance and
    reliability in mind
  - Mentor and level up the engineering organization by sharing
    your expertise

  - 10+ years of full stack experience in product and platform
    engineering
  - Proven ability to architect, build, and operate large-scale,
    distributed systems and user-facing applications
  - Extensive experience establishing operational excellence,
    automated testing strategies, production telemetry, and
    managing service reliability
  - Strong product and UX mindset
  - Exceptional communication and collaboration skills; able to
    influence and partner across teams and organizations
    towards business outcomes
  - Passion for innovation, continuous improvement, mentorship,
    and fostering an inclusive, high-performing engineering
    environment

