  Agent Verification builds systems that help Coinbase safely
  ship software in an AI-native development environment. The
  team develops automated code review, risk and policy
  evaluation, CI evidence, and merge controls that reduce
  routine manual work while preserving human judgment for
  higher-risk changes.

  As a Senior Software Engineer, you will design and build
  reliable backend services and integrations across source
  control, CI/CD, policy systems, and developer workflows. You
  will lead the adoption of a consistent and observable merge
  path, partner with Security, Compliance, Infrastructure, and
  product engineering teams, and improve how software changes
  are reviewed and shipped across Coinbase.

  We are looking for an experienced backend or platform
  engineer who has built distributed systems, developer
  infrastructure, CI/CD integrations, authorization or policy
  systems, or other high-reliability control planes.
  Experience with Go, GitHub integrations, AWS, Kubernetes,
  AI-assisted development, or policy-as-code is helpful.

  What you'll do:

  - Lead the design and delivery of Coinbase’s Unified Merge
    Gate, the system that determines whether a change can
    merge and explains what remains before it can proceed.
  - Integrate automated review findings, policy and risk
    assessments, CI results, identity and attestation
    evidence, and required human judgment into one merge
    decision.
  - Build reliable backend services and integrations across
    GitHub, CI and other Coinbase’s policy systems.
  - Migrate repositories from fragmented legacy controls to the
    Unified Merge Gate, with safe rollouts, observable
    decisions, and clear rollback paths.
  - Partner with Security, Compliance, Infrastructure, Codeflow,
    ZTSC, and repository owners to turn control requirements
    into usable developer workflows.
  - Measure the effect on human-review volume, time-to-merge,
    automated merge coverage, decision quality, and escaped
    defects.

  Required Skills and Experience:

  - 7+ years experience
  - Strong backend and distributed-systems experience in Go or a
    comparable language.
  - Experience designing APIs, durable state, failure recovery,
    observability, and safe rollout mechanisms.
  - Experience with CI/CD, source-control integrations,
    developer infrastructure, or another high-consequence
    control plane.
  - Strong security and authorization judgment. The engineer
    must understand why a technically convenient path may
    weaken a production gate.
  - Evidence of leading a cross-team technical project from
    design through migration and operational ownership.
  - Hands-on AI fluency. The candidate should know how to use
    and evaluate AI-assisted engineering workflows rather than
    discuss them only at a conceptual level.

