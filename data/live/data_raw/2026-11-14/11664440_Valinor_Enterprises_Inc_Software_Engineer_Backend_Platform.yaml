description: |
  Valinor is a new type of defense and government tech company
  focused on solving the problems others don't. Our unique
  model of centralized go-to-market and decentralized
  engineering allows us to move with unparalleled efficiency
  to identify unmet needs, build right-sized solutions, and
  get products where they matter most - in the hands of users.
  Unlike others in the space, who focus on the flashy
  problems, Valinor exists to solve the quiet, unaddressed
  problems-the small but significant ones that lead to cracks
  in the country's strength, stability, and security.

  Backed by General Catalyst, Founders Fund, and Friends &
  Family Capital, Valinor was founded in 2024 and has
  established strategic partnerships with Palantir, Anduril,
  and Helsing. We are building the dream team, and we want you
  on it.

  About The Role

  Valinor Streamline is looking for an experienced Software
  Engineer to help build and evolve the backend systems and
  foundational infrastructure behind our growing platform.
  You'll join a small, highly collaborative team with
  significant ownership over the technical foundation of the
  product and the decisions that shape it as we grow. We're
  looking for someone who has built software that real
  customers depend on and understands what it takes to improve
  and scale those systems while keeping them running. This
  role is ideal for a strong backend engineer who enjoys
  solving complex technical problems, isn't afraid to get into
  the weeds with infrastructure, and is excited to help shape
  a product at an early stage.



  What You'll Do

  - Design, build, and maintain the backend services and
    foundational platform components that power Streamline's
    products and enable other engineers to ship high quality
    software.
  - Own and execute complex migrations and architectural
    improvements to production systems while maintaining
    reliability and minimizing disruption to customers.
  - Identify and resolve performance bottlenecks across backend
    systems, improving how data is accessed, processed, and
    delivered as the platform scales.
  - Own technical problems end-to-end, from architectural design
    and implementation through deployment, monitoring, and
    ongoing optimization.
  - Work closely with a small engineering team to make pragmatic
    technical decisions, balance immediate product needs with
    long-term scalability, and help shape the technical
    direction of the platform.



  What We're Looking For

  - 6+ years of software engineering experience, with a strong
    foundation in backend development and a track record of
    building and operating production systems.
  - Deep understanding of backend architecture, distributed
    systems, databases, caching, and performance optimization.
  - Experience evolving complex production systems, including
    executing migrations and making architectural changes
    without compromising reliability or availability.
  - Experience working in engineering environments where
    scalability, performance, and reliability are critical,
    ideally at a growing startup or established technology
    company.
  - Strong programming skills and comfort working across backend
    services and infrastructure
  - Strong technical judgment and the ability to navigate
    complex codebases, design thoughtful abstractions, and
    evaluate tradeoffs between simplicity, performance, and
    maintainability.
  - A builder's mentality, intellectual curiosity, and comfort
    taking ownership in a fast-moving, entrepreneurial
    environment. Experience founding a company, building
    independent projects, or working at an early-stage startup
    is a plus.



  What Valinor Offers

  - Competitive salary, equity packages, and benefits, including
    health, dental, and vision insurance - fully covered for
    employees, 401(k), development stipends, among others.
  - Unlimited PTO and two-week company holiday at the end of
    every calendar year.
  - We are a pro-mental health and pro-family company - we
    actually encourage employees to spend time with themselves
    and their families. Valinor also provides fertility
    benefits to those just beginning that journey.
  - Fun work environment - we like to laugh and take care of
    each other, but we also deeply respect the mission in
    front of us.



  This role requires the candidate be eligible to obtain and
  maintain a U.S. security clearance. Active clearance
  preferred, but not required.



  Valinor is an equal-opportunity employer committed to
  creating a diverse and inclusive workplace. The Valinor team
  is made up of incredibly talented and unique individuals,
  who together are disrupting industry norms by creating new
  paths towards the future of defense and government
