  respect and receive equal consideration for employment
  without regard to race, color, creed, religion, sex, gender
  identity, sexual orientation, national origin, disability,
  uniform service, Veteran status, age, or any other protected
  characteristic per federal, state, or local law, including
  those with a criminal history, in a manner consistent with
  the requirements of applicable state and local laws,
  including the CA Fair Chance Initiative for Hiring
  Ordinance. We actively encourage members of recognized
  minorities, women, Veterans, and those with disabilities to
  apply, and we work to create a welcoming and supportive
  environment for all applicants throughout the interview
  process. If you are someone passionate about working on
  problems that have a real-world impact, we'd love to hear
  from you!
