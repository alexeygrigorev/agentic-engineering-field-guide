description: |
  Surescripts serves the nation through simpler, trusted
  health intelligence sharing, in order to increase patient
  safety, lower costs and ensure quality care. We deliver
  insights at critical points of care for better decisions —
  from streamlining prior authorizations to delivering
  comprehensive medication histories to facilitating messages
  between providers.


  We're always interested in connecting with exceptional
  talent. This evergreen posting allows us to identify and
  engage candidates who may be a fit for current or future
  opportunities as our business grows. While there may not be
  an active opening at the time of your application, we'd love
  to learn more about you.

  Please note: Because this is an evergreen posting, there may
  not be an immediate hiring timeline. Our recruiting team
  will reach out if your qualifications align with a current
  or upcoming opportunity.

  Job Summary

  Design, develop, assess, and troubleshoot software
  applications in an Agile environment for the one of the
  nation's largest and most trusted healthcare information
  network. Collaborate with architects, customers, product
  partners, and other engineers to solve complex engineering
  challenges by building high-volume applications that process
  millions of transactions a day, store multiple terabytes of
  data, and serve hundreds of thousands of customers.

  Senior Software Engineers are expected to use approved AI
  tools responsibly, lead by example, and help the company
  improve speed, quality, and outcomes while remaining fully
  accountable for results.

  Responsibilities

  - Lead the conceptualization, design, development, and
    troubleshooting of software applications, collaborating
    across disciplines to deliver secure, reliable solutions.
  - Provide technical leadership throughout the software
    development life cycle for epics, projects, features, and
    applications, including requirements, estimates, designs,
    tradeoffs, delivery, partner communication, and production
    support.
  - Lead design and code reviews; establish appropriate
    automated testing; validate acceptance criteria; monitor
    production systems; and investigate defects, incidents,
    and test-coverage gaps.
  - Promote shift-left quality practices that shorten feedback
    loops, reduce rework, prevent recurring defects, and
    improve release confidence.
  - Cultivate and share development, testing, troubleshooting,
    documentation, security, data privacy, observability, and
    Agile best practices through technical discussions,
    backlog reviews, retrospectives, and training.
  - Design and maintain AI-enabled components in accordance with
    architectural, security, privacy, governance, compliance,
    and quality standards, while identifying and mitigating
    associated risks.
  - Identify and implement responsible uses of AI and automation
    that improve productivity, quality, operational
    efficiency, and customer outcomes, measuring impact to
    guide continuous improvement.
  - Mentor team members, communicate technical ideas clearly,
    escalate complex issues, and create documentation that
    supports the team.

  QualificationsBasic Requirements:

  - Bachelor’s degree in software engineering, computer science,
    a related field, or equivalent experience.
  - 5+ years of experience in related, progressive software
    engineering roles.
  - Technical fluency in multiple programming languages, such as
    C#, Java, Groovy, Scala, Python, TypeScript, or
    JavaScript.
  - Technical fluency with current tools and platforms for
    developing, building, testing, deploying, and monitoring
    software systems.
  - Experience using modern AI-assisted software development
    tools to support coding, testing, debugging,
    documentation, analysis, and software delivery workflows.
  - Demonstrated ability to provide technical leadership,
    collaborate effectively, communicate clearly, work through
    ambiguity, and mentor or guide other engineers.

  Preferred Qualifications:

  - Experience with high-volume, data-intensive applications.
  - Experience building web services and distributed systems.
  - Hands-on software troubleshooting, root-cause analysis, and
    production support experience.
  - Familiarity with relational and non-relational database
    technologies.
  - Knowledge of application security, observability, data
    privacy, and responsible software delivery practices.
  - Healthcare technology industry experience.
  - Understanding of AI governance, security, privacy,
    compliance, quality, and responsible-use practices for
    software systems.
  - Experience effectively leveraging generative AI tools, such
    as GitHub Copilot, Claude, Gemini, ChatGPT, or similar
    tools, throughout the product delivery life cycle.

  Some of the technologies we use:

  - Languages: C#, Java, Groovy, Scala, Python, TypeScript,
    JavaScript
  - Frameworks: .NET Core, Spring/Spring Boot
  - Front-end technologies: Angular, Bootstrap, OpenID Connect
  - Infrastructure and data platforms: Kafka, Cassandra,
    InfluxDB, HashiCorp Consul, Docker, Jenkins, Ansible,
    Google Cloud Platform, BigQuery, Airflow, Composer, and
    Terraform

  Surescripts embraces flexibility through its Flexible Hybrid
  Work model for most positions. This model allows employees
  to work virtually while still utilizing our offices as
  collaboration centers. With alignment and agreement from
  your leadership, you can come and go from the office as
  needed.


  To be considered for employment, applicants must have a
  valid U.S. work authorization allowing work without
  restrictions with Surecripts in the U.S. At this time, we
  are unable to provide support or provide sponsorship for
  immigration benefits such as work visas. Additionally, we do
  not participate in academic training programs or work-study
  programs through an academic institution that require
  employer endorsement of F-1/CPT or F-1/STEM.

  Why Wait? Apply Now


  We’re a midsize company. This means you’re not just another
  employee ID number. Here, you can build real relationships
  and feel supported by truly awesome people with diverse
  backgrounds and talents in an innovative and collaborative
  work culture. We strive to create an environment where you
  can be yourself, share your ideas and work your way. We
  offer opportunities for employee development, as well as
  competitive compensation packages and extensive benefits.


  At Surescripts, base pay is one part of our Total Rewards
  Package (which may also include bonus, benefits etc.) and is
  determined within a range. The base pay range for this
  position is $142,700 - $174,500 per year. Your base pay may
  vary within or outside of this range depending on a number
  of factors, including (but not limited to) your
  qualifications, skills, experience, and location.

  Benefits include, but are not limited to, comprehensive
  healthcare (including infertility coverage), generous paid
  time off including paid childbirth and parental leave and
  mental health days, pet insurance, and 401(k) with company
  match and immediate vesting. To learn more, review the Keep
  You and Yours Healthy, Balancing Work and Life, and Where
  Talent Takes Shape links under the Better Benefits. Better
  Work. Better Life section of our careers site.


  Physical and Mental Requirements

  While performing duties of this job, an employee may be
  required to perform any, or all of the following: attend
  meetings in and out of the office, travel, communicate
  effectively (both orally and in writing), and be able to
  effectively use computers and other electronic and standard
  office equipment with, or without, a reasonable
  accommodation. Additionally, this job requires certain
  mental demands, including the ability to use judgement,
  withstand moderate amounts of stress and maintain attention
  to detail with, or without, a reasonable accommodation.

