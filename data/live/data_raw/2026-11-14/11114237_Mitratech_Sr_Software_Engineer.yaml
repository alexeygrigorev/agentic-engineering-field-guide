description: |
  Job Description

  At Mitratech, we are a team of technocrats focused on
  building world-class products that simplify operations in
  the Legal, Risk, Compliance and HR functions of companies
  the world over. We are a close-knit, globally dispersed team
  that thrives in an ecosystem that supports individual
  excellence and takes pride in its diverse and inclusive work
  culture centered around great people practices, learning
  opportunities and having fun! Our culture is the ideal blend
  of entrepreneurial spirit and enterprise investment,
  enabling the chance to move at a rapid pace with some of the
  most complex, leading-edge technologies available.

  Given our continued growth, we always have room for more
  intellect, energy and enthusiasm - join our global team and
  see why it's so special to be a part of Mitratech!

  The Senior Software Engineer is responsible for coding,
  testing and implementing products for our HRS Platform Team,
  which is increasingly focused on agentic and AI-driven
  engineering. This role is for engineers who have
  meaningfully adapted their day-to-day workflow (design,
  coding, testing and debugging) around AI-assisted and
  agentic development tools and who can bring that fluency to
  raise the bar for the broader team. Responsibilities include
  reviewing functional and technical requirements, performing
  research, designing solutions and developing code in a
  variety of programming languages for a Web + AI -based
  enterprise application.



  Essential Duties & Responsibilities:

  - Create code that meets design specifications, follows
    standards, is of high quality and is easy to maintain.

  - Integrate AI-assisted development tools (e.g., AI code
    generation, agentic coding assistants, AI-powered code
    review and test generation) into daily engineering work to
    materially increase velocity and quality.

  - Manage and leverage context engineering and harness
    engineering to get reliable, high-quality output from
    agentic development tools.

  - Work with various teams in the organization to ensure
    appropriate project requirements are met.

  - Perform unit, automation and peer testing to ensure that the
    product is fully tested.

  - Ensure that all work is properly documented.

  - Ability to carry out all policies and procedures as
    established by the team, department, or company at large.

  - Provide training, give project demos and other presentations
    as needed.

  - Voluntary mentoring of others, including on effective and
    responsible use of AI development tools.

  - Writing and/or contributing to design documents.

  - Perform code reviews.

  - Lead or co-lead projects and design efforts as needed.

  - Provide input and proposals/recommendations for code
    refactoring, process improvements, technologies and tools,
    including emerging AI-driven development practices.

  Requirements & Skills:

  - 7+ years job experience in a software development/software
    engineer role.

  - Ability to reason logically and provide innovative
    solutions.

  - Demonstrated, hands-on adoption of AI-assisted engineering
    tools (e.g., Claude Code, GitHub Copilot, Devin AI, or
    similar) as part of your regular workflow, able to speak
    concretely to how these tools have changed your approach
    to building software.

  - Understanding of how to properly manage agent instructions,
    skills and harnesses to get consistent, production-quality
    results from agentic tools.

  - Demonstrated proficiency with the following:

  - Modern languages/stacks (e.g., Python, Go, Java,
    TypeScript/Node, Vanilla JS/PReact)

  - Web Services + REST API Design and implementation

  - SQL

  - ORM frameworks

  - CSS

  - Cloud infrastructure (AWS preferred)

  - Authentication and Security protocols, including OAuth2 and
    OIDC protocols

  - Git

  - CI/CD

  - Predictable and quality delivery

  - Successful completion of projects where AI-assisted
    development tools were used to meaningfully accelerate
    delivery or improve quality.
  - Familiarity with SOP, AI orchestration/agent-harness
    framework, is a plus.

  Desired Skills:

  - Experience working in a Kanban environment.

  - Experience building or integrating LLM-powered features
    directly into a product (RAG, agents, tool use) and
    instrumenting them for observability.

  - Experience with infrastructure-as-code (Terraform) and
    platform engineering.

  - Bachelor's Degree in Computer Science.

  We are an equal opportunity employer that values diversity
  at all levels. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, gender, national origin, age, sexual orientation,
  gender identity, disability or veteran status.
