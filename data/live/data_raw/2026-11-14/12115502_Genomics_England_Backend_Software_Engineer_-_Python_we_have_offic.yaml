description: |
  Company Description

  Genomics England is a global leader in enabling genomic
  medicine and research, focused on creating a world where
  everyone benefits from genomic healthcare. Building on the
  100,000 Genomes Project, we support the NHS’s world-first
  national whole genome sequencing service and run the growing
  National Genomic Research Library, alongside delivering
  numerous major genomics initiatives. By connecting research
  and clinical care at national scale, we enable immediate
  healthcare benefits and advances for the future.

  Our mission is to provide the evidence and digital systems
  so that by 2035 genomics could play a role in up to half of
  all healthcare interactions, whilst securing the UK’s
  position as the best place to discover, prove and benefit
  from genomic innovations.

  We are accelerating our impact and working with patients,
  doctors, scientists, government and industry to improve
  genomic testing, and help researchers access the health data
  and technology they need to make new medical discoveries and
  create more effective, targeted medicines for everybody.

  Behind the Healthcare and Research outcomes, Genomics
  England delivers through designing, developing and operating
  complex healthcare software systems.

  We're on the cusp of big changes with the real prospect of
  genomics becoming the fabric of everyday healthcare through
  the lifetime – from birth to old age.

  Job Description

  Backend Software Engineer - Python

  Join Genomics England and use your backend engineering
  skills to make a difference in genomics and healthcare.
  We’re looking for an experienced Software Engineer with a
  demonstrable track record of delivering and owning backend
  software.

  The role

  You’ll use your Python expertise to design and develop
  scalable backend services, REST APIs and cloud-native
  applications on AWS. Working across databases, microservices
  and identity management solutions, you’ll deliver secure,
  reliable platforms.

  Your work will help build and evolve products that support
  genomic testing, clinical decision making and research at
  national scale. You’ll contribute to the systems and
  services that enable large-scale genomic research in a
  collaborative, supportive and empowering environment.

  Your team

  You’ll join the Interpretation Portal (IP) team and provide
  software engineering expertise for the Decision Support
  System (DSS). DSS is a key component of our Healthcare
  Genomics Service.

  Your responsibilities

  Backend development and feature ownership

  - Lead feature development across the team.

  - Design and develop scalable, high-quality Python software
    following best practices.

  - Design, develop and maintain REST APIs for internal and
    external integrations.

  Cloud infrastructure, data and identity

  - Design and maintain resources hosted on AWS, ensuring
    reliability and efficiency.

  - Work with relational databases, including AWS RDS and SQL-
    based solutions.

  - Support and integrate identity and access management
    solutions, including Okta and other Identity Providers
    (IdPs).

  Quality and troubleshooting

  - Build and enhance test automation frameworks to support
    robust, reliable applications.

  - Troubleshoot and help resolve issues during development and
    testing.

  Collaboration and continuous learning

  - Work closely with front-end developers, QA and Platform
    Engineers to create reliable, seamless solutions.

  - Use tools such as GitLab, Confluence and Jira to support
    collaborative development.

  - Collaborate with third-party suppliers to create technical
    specifications.

  - Stay informed about industry trends and embrace new
    technologies.

  Skills and experience for success

  - Python: expertise in developing scalable solutions.

  - AWS and architecture: experience with AWS services,
    including IAM, and microservice architectures.

  - Databases: experience with relational databases and SQL,
    ideally Postgres.

  - REST APIs: experience designing, developing and consuming
    APIs.

  - Identity and authentication: experience integrating with
    platforms such as Okta or similar Identity Providers
    (IdPs).

  - Development practices: familiarity with agile methodologies
    and test-driven development.

  - Teamwork and problem solving: a proactive, collaborative
    approach supported by collaborative tools.

  Additional skills we’d love to see

  - Experience with Amazon API Gateway, ECS, Fargate and Lambda.

  - Experience with test automation frameworks.

  - Familiarity with front-end React development, knowledge of
    JavaScript for front-end applications, or a willingness to
    learn.

  - A strong understanding of code review best practices.

  - Experience mentoring and/or coaching junior team members.

  Make a difference

  Use your Python and backend engineering skills to build the
  systems, services and platforms that enable genomic medicine
  and research at national scale. If you want your work to
  directly support life-changing genomic research and
  healthcare innovation, we’d love to hear from you.

  Qualifications

  BSc in Computer Science or equivalent experience

  Additional Information

  Closing date for applications: Friday 20th November at 23:00
  (UK time)

  Salary from: £73,500 per annum

  Please note: we are unable to offer visa sponsorship for
  this role.

  Being an integral part of such a meaningful mission is
  extremely rewarding in itself, but in order to support our
  people, we’re continually improving our benefits package. We
  pride ourselves on investing in our people and supporting
  them to achieve their career goals, as well as offering a
  benefits package including:

  - Generous Leave:  30 days’ holiday, plus bank holidays, plus
    additional leave for long service, and also the option to
    apply for up to 30 days of remote working abroad annually
    (approval required).
  - Family-Friendly: Blended working arrangements, flexible
    working, enhanced maternity, paternity and shared parental
    leave benefits.
  - Pension & Financial: Defined contribution pension (Genomics
    England double-matches up to 10%, however you can
    contribute more if you wish), Life Assurance (3x salary),
    an Electric Vehicle salary sacrifice scheme and a Give As
    You Earn scheme.
  - Learning & Development: Individual learning budgets, support
    for training and certifications, and reimbursement for one
    annual professional subscription (approval required).
  - Recognition & Rewards: Employee recognition programme and
    referral scheme.
  - Health & Wellbeing: Subsidised gym membership, a free
    Headspace account, and access to an Employee Assistance
    Programme, eye tests, flu jabs.

  Equal opportunities and our commitment to a diverse and
  inclusive workplace

  Genomics England is actively committed to providing and
  supporting an inclusive environment that promotes equity,
  diversity and inclusion best practice both within our
  community and in any other area where we have influence. We
  are proud of our diverse community where everyone can come
  to work and feel welcomed and treated with respect
  regardless of any disability, ethnicity, gender, gender
  identity, religion, sexual orientation, or social
  background.

  Genomics England’s policies of non-discrimination and equity
  and will be applied fairly to all people, regardless of age,
  disability, gender identity or reassignment, marital or
  civil partnership status, being pregnant or recently
  becoming a parent, race, religion or beliefs, sex or sexual
  orientation, length of service, whether full or part-time or
  employed under a permanent or a fixed-term contract or any
  other relevant factor.

  Genomics England does not tolerate any form of
  discrimination, harassment, victimisation or bullying at
  work. Such behaviour undermines our mission and core values
  and diminishes the dignity, respect and integrity of all
  parties. Our People policies outline our commitment to
  inclusivity.

  We aim to remove barriers in our recruitment processes and
  to be flexible with our interview processes. Should you
  require any adjustments that may help you to fully
  participate in the recruitment process, we encourage you to
  discuss this with us.

  Culture

  We have four key behaviours that represent what we would
  like Genomics England to feel like and the culture we want
  to encourage, in order for us to achieve our mission. These
  behaviours help us all work well together, deliver on our
  outcomes, celebrate our successes and share feedback with
  each other. You can read about these and other aspects of
  our culture here Culture | Genomics England

  Blended working model

  Genomics England operates a blended working model as we know
  our people appreciate the flexibility that hybrid working
  can bring. We expect most people to come into the office a
  minimum of 2 times each month. However, this will vary
  according to role and will be agreed with your team leader.
  There is no expectation that people will return to the
  office full time unless they want to, however, some of our
  roles require full time on site attendance e.g., lab teams,
  reception team.

  Our teams and squads have, and will continue to reflect on
  what works best for them to work together successfully and
  have the freedom to design working patterns to suit, beyond
  the minimum. Our office locations are: Canary Wharf,
  Cambridge and Leeds.

  Onboarding background checks

  As part of our recruitment process, all successful
  candidates are subject to a Standard Disclosure and Barring
  Service (DBS) check.  We therefore require applicants to
  disclose any previous offences at point of application, as
  some unspent convictions may mean we are unable to proceed
  with your application due to the nature of our work in
  healthcare.
