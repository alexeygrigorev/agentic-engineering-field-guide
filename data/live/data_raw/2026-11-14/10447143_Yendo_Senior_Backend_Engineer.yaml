description: |
  About Yendo

  Hi there, we're Yendo, and our vision is to empower everyday
  people to build a stronger financial future. In less than 2
  years, we’ve saved customers over $100 million in
  unnecessary interest and fees.

  We are using AI to unlock the $1.1 Trillion in vehicle
  equity trapped within cars owned by Americans in the form of
  a high limit, standard rate credit card for those
  traditionally excluded from mainstream financial offerings.

  Yendo Credit Cards have similar APRs to those issued for
  prime borrowers with no hidden fees or overdraft charges and
  help build their customers' credit score. Yendo's credit
  limits are 4x higher than cards typically available for non-
  prime borrowers.

  What we're looking for

  - Desire to work collaboratively. Engineers participate in the
    product development cycle from start to finish. We operate
    on the principle that the best products include input from
    our users and our engineering, product, and design teams.
  - Help with raising the bar! We strive to improve our customer
    experience, our hiring standards, and our engineering
    practices. As part of a small team, you can meaningfully
    contribute across all of these fronts.
  - Resiliency. We are not a “me too” product. This requires
    experimentation and grit to find solutions for our
    customers’ problems.

  Who you are

  - 5+ years of experience with backend or full stack solutions
    (e.g., Go (Preferred), TypeScript, Java, Python, or Ruby)
  - Prefer experience with Postgres, Redis, and AWS, but not
    required.
  - Enjoy thinking about systems — their life cycles, edge
    cases, interactions, and failure modes.
  - Self-starter and able to work independently.
  - Experience in fintech, payments, processing, card networks,
    banking, or early stage startup is helpful, but not
    required.
  - Passionate about financial inclusion and mobility.

  Why join us

  🤝 You can make a real impact to the lives of our customers.

  💳 100 million Americans lack access to sustainable credit
  and are forced to use predatory loans. Think 500%+ APR
  alternative financing options such as Auto Title, Payday,
  Pawn, and Personal Loans. Each year almost 25% of adults are
  excluded from the mainstream credit system, severely
  inhibiting their chances of accessing affordable borrowing,
  getting a mortgage, or even an auto loan.

  👨‍💼 Our executive team has multiple exits under their belts,
  having founded $100M+ revenue companies. Additionally, many
  executives have held leadership roles at public comapny and
  unicorn startups alike.

  🧠 We are backed by leading VCs, accomplished entrepreneurs,
  respected philanthropists, and founders from across the U.S.
  Our backers are the minds and investors behind the success
  of the Apple Card, Brex, Dave, Scribd, Parse, Canva,
  Robinhood, Flexport, Gusto, Reddit, Notion, LinkedIn, among
  others.

  Yendo is based in Dallas, Texas with a nationwide team. This
  role is remote or in our office in the Deep Ellum area of
  Dallas.

  💰 Competitive Compensation

  📈 Equity

  🍎 Insurance

  📊 401K

  🏝 Unlimited PTO

  Our core values

  - Our customers are our compass - We prioritize our customers'
    needs in every decision, guiding our work to solve real
    problems and create meaningful solutions. We make a
    positive impact by enhancing their experiences and
    addressing what truly matters to them.
  - Trust is earned, not assumed - We communicate openly,
    honestly, and with humility, earning trust through
    integrity and clarity in all interactions. By prioritizing
    straightforward communication and actions, we build strong
    relationships and ensure our intentions are always
    understood.
  - Diverse perspectives, stronger outcomes - We serve diverse
    customers and believe that different perspectives make us
    stronger. Committed to equity, we value each team member,
    ensuring all voices are heard and respected. By fostering
    an inclusive culture, we empower fair and meaningful
    contributions to drive our success.
  - Embrace Growth Together - We are drivers, we move with
    urgency, and we strive for excellence in everything we do.
    Our customers deserve the best, so we hold ourselves
    accountable to high standards. Through proactive
    ownership, thoughtful execution, and a commitment to
    bettering ourselves and our work every day, we deliver
    results that make a lasting impact.
  - Own every outcome - Rooted in expertise and creativity,
    innovation is at our core. We challenge norms, push past
    limitations, and seek to redefine boundaries. Yesterday’s
    plan may be outdated given today’s information and by
    questioning assumptions and challenging one another, we
    stay agile and open-minded, turning every situation into
    an opportunity to delight our customers.
  - Courage to challenge - Low ego, coaching, and mutual respect
    are the foundation of our teamwork. We empower each other
    and solve problems collaboratively without blame, creating
    a space for everyone to thrive and contribute to our
    collective success.
