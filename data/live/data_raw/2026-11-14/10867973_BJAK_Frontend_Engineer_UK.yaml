description: |
  About BJAK

  The original mission of BJAK is we believe people deserve
  smarter ways to plan, save and grow their money. This is the
  origin of our name. Started in 2019, we built the first
  mobile-first, insurance platform, enabling insurance to be
  accessible online by millions in the region. Today, its the
  leading insurance platform in Southeast Asia. Today, we are
  expanding ways to help people in the region — this includes
  spending, saving, investing, exchanging, travelling, and
  more. Our mission is help people get more from their money
  every day. We have teams working around the world, with over
  20 nationalities from our offices and remotely, who truly
  enjoys their work. We are looking for the most talented and
  driven people we can find. We are looking for people who
  work for their passion, not counting hours. Who loves
  building great next-generation products, not status quo. Who
  cares about redefining how everyone around us can get the
  best financial applications, not for an exclusive few. If
  you're this person, we'd love to talk to you.

  Your Mission

  Build modern frontend applications that power BJAK's AI-
  driven insurance automation platform. You'll create
  intuitive user experiences that help customers and internal
  teams manage quotations, policy issuance, claims and other
  insurance workflows.

  What they'll actually do

  - Build the multi-step question forms customers fill in to get
    a quote
  - Build the results and comparison pages where customers see
    and compare quotes
  - Build the marketing/landing pages

  Must-have skills

  - Strong React experience; ideally Next.js specifically
  - Experience building multi-step forms with validation
  - Experience building pages that need to load fast and rank
    well in search (SEO-aware development)
  - Awareness of accessibility standards (WCAG) — building it in
    from the start, not bolting it on later

  Strong nice-to-haves

  - Experience in e-commerce, comparison, or marketplace
    websites
  - Experience working from a design system / component library
  - Experience in a regulated or compliance-heavy industry
  - Experience embedding web analytics

  The Bar

  We are looking for engineers with real technology career
  highlights. A strong highlight is not just working at a
  famous company. A strong highlight means you personally
  helped build, ship or scale a serious product, platform or
  system.

  Location

  This role is remote, but candidates must be based in UK. We
  are hiring specifically for this market, so applicants
  should already be based in UK.

  Language

  English is our main working language across global teams.
  Strong English communication is required.

  Interview Process

  Our process is designed to move fast:

  1. Online assessment or practical task

  2. Technical interview

  3. CEO / final round

  For strong candidates, we aim to complete the process and
  make an offer within 1 week from the start of the interview
  process. Candidates who complete assessments quickly will be
  prioritized.
