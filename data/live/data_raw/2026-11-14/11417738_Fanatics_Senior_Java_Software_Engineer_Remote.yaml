description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  Job Summary

  Fanatics Betting & Gaming (FBG) is building the industry’s
  most trusted, scalable, and fan-centric sportsbook
  experience. Our Internal Platforms power critical systems
  that support customer operations, marketing, support, risk,
  and data—through a combination of Java backend services,
  APIs, event-driven systems, and Salesforce platform
  capabilities.

  We are seeking a Senior Java Software Engineer to build and
  maintain scalable services that power our internal
  platforms. This role is full stack focused, with
  opportunities to contribute to user-facing internal tools as
  needed.

  Experience with Salesforce development and integrations is a
  strong plus, as many of our systems interface directly with
  Salesforce for CRM, workflow automation, and customer
  operations. This is a hands-on engineering role for someone
  who enjoys owning features end-to-end, solving complex
  integration problems, and working closely with cross-
  functional partners.

  Key ResponsibilitiesFull Stack Engineering (Primary Focus)

  - Design, build, and maintain Java-based backend services
    (Spring Boot or similar frameworks).
  - Develop scalable, reliable, and well-tested services that
    integrate with Salesforce and other internal/external
    systems.
  - Participate in architecture and design discussions for APIs,
    data flows, and distributed systems.
  - Write high-quality, maintainable code with strong unit and
    integration test coverage.
  - Troubleshoot and resolve complex issues across services,
    integrations, and data pipelines.
  - Contribute to internal web applications and user interfaces
    backed by Java services.

  Internal UI & Application Development (Nice to Have /
  Secondary)

  - Collaborate with frontend or full-stack engineers to support
    internal users across Operations, Support, Marketing,
    Risk, and Data teams.
  - Partner with Product and UX (where applicable) to translate
    workflows into intuitive internal tools.
  - Collaborate with backend engineers to define clean API
    contracts between UI layers and services.
  - UI technologies may include Java-backed web apps, REST-
    driven front ends, or modern JavaScript frameworks
    consuming Java APIs.

  Note: This role does not require deep UI specialization, but
  comfort collaborating across UI and backend boundaries is
  valued.

  Salesforce & CRM Platform Integration (Secondary Focus)

  - Build and maintain integrations between Java services and
    Salesforce using REST APIs, events, or middleware.
  - Contribute to Salesforce development when needed, including
    Apex, Lightning Web Components, Flows, and configuration.
  - Partner with Salesforce-focused engineers to ensure clean
    integration patterns, data integrity, and platform
    scalability.
  - Help troubleshoot Salesforce-related issues tied to backend
    services, UI workflows, or integrations.

  Collaboration & Delivery

  - Work closely with Product Managers, Technical Program
    Managers, and cross-functional partners to translate
    requirements into technical solutions.
  - Collaborate with Marketing, Operations, Support, Risk, and
    Data teams to ensure systems meet business and regulatory
    needs.
  - Participate in sprint planning, estimation, and delivery,
    ensuring predictable and high-quality outcomes.
  - Communicate technical decisions, trade-offs, and
    implementation details clearly to stakeholders.

  Operational Excellence & Best Practices

  - Follow and help improve engineering best practices including
    CI/CD, code reviews, testing strategies, and
    observability.
  - Ensure services are performant, observable, and resilient,
    with appropriate logging, metrics, and alerting.
  - Contribute to documentation, runbooks, and long-term
    platform improvements.
  - Identify technical debt and propose pragmatic solutions.

  QualificationsRequired

  - 6+ years of professional software engineering experience
    with Java.
  - Strong experience building backend services in a production
    environment.
  - Experience developing APIs and integrating services with
    other systems.
  - Familiarity with distributed systems, data flows, and
    service-to-service communication.
  - Experience with Git-based workflows, code reviews, and CI/CD
    pipelines.
  - Strong problem-solving skills and ability to work
    independently on complex systems.
  - Excellent communication and collaboration skills.

  Preferred

  - Experience contributing to internal web UIs or tooling,
    including:
  - Experience working with Salesforce as an integration partner
    or platform:
  - Experience integrating Salesforce with Java-based services.
  - Experience with:
  - Experience working with AI model or agent platforms,
    including building on or integrating agents into
    production workflows. Familiarity with platforms such as
    Anthropic, OpenAI, Amazon Bedrock, LangChain, Google
    Vertex AI, Microsoft Copilot Studio, CrewAI, or AutoGen is
    a plus.
  - Familiarity using AI-powered coding assistants to design,
    build, and test new functionality from the ground up, with
    the ability to move quickly while maintaining high code
    quality and test coverage.
  - Interest in leveraging emerging tools and workflows to
    improve developer productivity and platform throughput.
  - Salesforce certifications (Administrator, Developer) are a
    plus, but not required.

  What We Value

  - Passion for building high-quality internal platforms that
    directly impact business outcomes.
  - Strong ownership mindset and commitment to engineering
    excellence.
  - Collaborative approach and desire to continuously learn and
    improve.
  - Comfort operating in a fast-paced, evolving environment.

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connection and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

  For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Ranges will change based on country and state of residence,
  which are reflected in Geographical Zones defined by
  Fanatics Betting and Gaming. The range incorporates all of
  our Geographical Compensation Zones and is subject to change
  as the Zone associated with the actual offer is confirmed.
  In addition to the base and bonus, full-time employment, and
  more. For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Salary Range

  $1—$1 USD

  By submitting your application, you agree to our terms of
  service and acknowledge you have read our Candidate Privacy
  Policy.

  Fanatics will never ask candidates for money, banking
  information, or other sensitive personal information as part
  of the interview process. If you receive a suspicious
  message claiming to be from Fanatics recruiting, please do
  not respond and report it here.
