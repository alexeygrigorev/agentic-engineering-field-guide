description: |
  About Sei Labs

  Sei Labs builds open sourced technology for the high-
  performance Sei Blockchain, the first parallelized EVM Layer
  1 blockchain designed to scale with the industry. The unique
  optimizations built into Sei enable Web3 applications to
  reach Web2 level scale and performance, driving the mass
  adoption of digital assets.

  Our teams are comprised of former Google, Goldman Sachs,
  Robinhood, Nvidia, and Databricks veterans dedicated to
  onboarding the next billion users onto a vibrant ecosystem
  of applications.

  Sei Labs has raised over $30M from top investors including
  Jump Crypto, Multicoin Capital, Coinbase Ventures,
  Distributed Global, Hudson River Trading, and Flow Traders.

  Check out our website and docs for more details.

  Protocol Engineering at Sei

  Sei Labs is looking for a Protocol Engineer to lead the
  development of core components of the Sei Blockchain. You'll
  work at the forefront of blockchain infrastructure,
  designing and optimizing the foundational layers of a high-
  performance, scalable decentralized network. You'll
  collaborate closely with our engineering team and ecosystem
  partners, constantly innovating to push the boundaries of
  blockchain technology. If you're passionate about low-level
  systems design, performance optimization, and shaping the
  future of decentralized networks, this is a rare opportunity
  to make a lasting impact in Web3.

  Responsibilities

  - Write code to build the core sei blockchain (consensus,
    state management, etc.)
  - Proactively identify and drive optimizations and
    improvements to the product.
  - Collaborate with our frontend team to fine tune our REST API
    to support our customers.
  - Take ownership over your work and the work of the team.



  Qualifications

  - 5+ years of infrastructure engineering experience.
  - Proven results in building or scaling Layer 1 blockchains
    performance.
  - A proven tech lead with experience planning and leading
    large projects with long-term impact on a single system or
    team.
  - Strong technical grasp and excellent judgment on task
    prioritizations.
  - Able to tackle complex engineering problems that deliver
    results.
  - History of creating and applying new processes and tooling
    to increase engineering efficiency.
