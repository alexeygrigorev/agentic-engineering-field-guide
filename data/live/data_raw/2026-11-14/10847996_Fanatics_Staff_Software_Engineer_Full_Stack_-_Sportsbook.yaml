description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About the Team

  Launched in 2021, Fanatics Betting and Gaming is the online
  and retail sports betting subsidiary of Fanatics, a global
  digital sports platform. The Fanatics Sportsbook is
  available to 95% of the addressable online sports bettor
  market in the U.S. Fanatics Casino is currently available
  online in Michigan, New Jersey, Pennsylvania and West
  Virginia. Fanatics Betting and Gaming operates twenty-two
  retail sports betting locations, including the only
  sportsbook inside an NFL stadium at Northwest Stadium.
  Fanatics Betting and Gaming is headquartered in New York
  with offices in Denver, Leeds and Dublin.

  As a Staff Software Engineer, you'll play a key leadership
  role within the Sportsbook team at FBG, driving the design
  and development of a highly scalable, fault-tolerant online
  sportsbook platform. You'll work on critical areas such as
  sportsbook market integration, risk management, tooling and
  other backed systems that deliver seamless customer
  experiences.

  In addition to hands-on technical contributions, you'll
  provide technical mentorship, guide architectural decisions,
  and analyze complex system challenges to ensure robust and
  efficient solutions. You'll collaborate across teams,
  influencing best practices and leading key projects that
  enhance the sportsbook experience within the broader
  Fanatics ecosystem.

  Responsibilities

  - Drive the development, testing, documentation, and
    deployment of high-quality, stable, scalable software into
    production
  - Develop a comprehensive understanding of the industry,
    product, and roadmap, leveraging this knowledge to shape
    team strategy and influence the direction of the
    organization
  - Lead the end-to-end technical execution of complex features
    and systems, from ideation and architecture to deployment
    and refinement
  - Align and streamline designs across your department,
    promoting clarity and simplicity in technical direction
    while upholding organizational goals.
  - Partner closely with product, design, and other stakeholders
    to make high-impact technical decisions that align with
    both business goals and long-term scalability
  - Lead incident resolution as part of the on-call rotation,
    ensuring swift diagnosis and remediation of critical
    software issues
  - Proactively identify and remove roadblocks, occasionally
    collaborating cross-team collaboration to maintain
    momentum on complex projects
  - Conduct and elevate code reviews, sharing expertise to
    enhance code quality
  - Steer team planning and design discussions, introducing
    innovative approaches to solve technical challenges and
    optimize design patterns
  - Champion improvements to software quality, testability,
    operational metrics, and team documentation, setting a
    higher standard for the organization
  - Mentor and coach engineers at all levels, fostering a
    culture of continuous learning and professional growth
    across the team
  - Be open to occasional travel to Fanatics offices and other
    locations for conferences, events, meetings, and team-
    building activities

  Required Qualifications

  - 7+ years of experience building highly scalable, performant
    and evolvable backend distributed systems; proficiency in
    Spring and Java is a must.
  - Demonstrated ability to drive best practices in backend
    development and mentor others in effective coding and
    architectural strategies, such as clean code, domain
    driven design and other design and architectural patterns
  - Knowledge of observability practices, including logging,
    monitoring, and tracing in distributed systems.
  - Expertise in Agile software delivery, with a track record of
    modeling and driving process improvements across teams,
    and ability to collaborate cross-functionally across
    diverse teams within large enterprise environments,
    driving alignment and shared success.
  - Excellent communication skills, capable of conveying complex
    technical concepts clearly and effectively to diverse
    audiences, including engineers, executives, and non-
    technical stakeholders.
  - Adaptable mindset, comfortable with shifting priorities and
    new initiatives in a fast-paced, evolving organization.
  - Team-first mentality, with a willingness to do what it takes
    to get the job done and a desire to strive for better.

  Preferred Qualifications

  - Strong Experience in the sports industry, gaming and content
    delivery
  - Highly effective with Java, Spring boot, React.
  - Expertise in messaging technologies such as Kafka with a
    solid understanding of event-driven architectures.
  - Comfortable working with Cloud Native and Infrastructure as
    Code, like Kubernetes, Helm and Terraform
  - Ability to work in diverse codebases, both legacy and
    greenfield, in different languages and environments
  - Background in startups or high-growth environments.

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connection and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

