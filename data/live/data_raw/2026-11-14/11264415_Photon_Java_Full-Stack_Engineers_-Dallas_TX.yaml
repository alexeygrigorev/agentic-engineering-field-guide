description: |
  Full Stack Engineer Experience



  5+ Years



  Job Title



  Full Stack Engineer



  Job Summary



  We are seeking a talented Full Stack Engineer to design,
  develop, and maintain scalable enterprise applications. The
  ideal candidate will possess strong expertise in modern
  backend and frontend technologies, distributed systems, API
  development, cloud-native architectures, and secure software
  engineering practices.



  This role requires a hands-on engineer who can contribute
  across the full software development lifecycle, from
  requirements analysis and solution design to development,
  testing, deployment, and production support. The successful
  candidate will collaborate with cross-functional teams to
  deliver reliable, secure, and high-performing applications
  that drive business value.



  Key Responsibilities



  - Design, develop, and maintain scalable full-stack
    applications using modern frontend and backend
    technologies.
  - Build robust backend services, microservices, and RESTful
    APIs using Java and Spring Boot.
  - Develop responsive, accessible, and user-friendly web
    applications using React and modern JavaScript frameworks.
  - Design and implement distributed systems capable of handling
    high-volume transactions and business-critical workloads.
  - Develop and maintain event-driven architectures and
    asynchronous processing solutions.
  - Collaborate with product owners, architects, QA teams, and
    business stakeholders to deliver high-quality software
    solutions.
  - Participate in architecture discussions, technical design
    reviews, and code reviews.
  - Implement secure coding practices and ensure application
    security requirements are met.
  - Create and maintain automated tests to ensure software
    quality and reliability.
  - Contribute to CI/CD pipeline implementation and deployment
    automation.
  - Monitor application performance, reliability, and
    observability metrics.
  - Support production deployments, troubleshooting, and ongoing
    application enhancements.
  - Mentor junior developers and promote engineering best
    practices across teams.



  Required Qualifications



  - Bachelor's degree in Computer Science, Engineering,
    Information Technology, or equivalent practical
    experience.
  - 5+ years of experience in software engineering with a focus
    on full-stack application development.
  - Strong proficiency in Java and Spring Boot development.
  - Hands-on experience building modern web applications using
    React or similar JavaScript frameworks.
  - Experience designing and developing RESTful APIs and
    microservices.
  - Strong understanding of distributed systems and scalable
    application architecture.
  - Experience implementing event-driven design patterns and
    messaging-based systems.
  - Strong understanding of software engineering principles,
    design patterns, and object-oriented programming.
  - Experience with automated testing, continuous integration,
    and continuous deployment practices.
  - Knowledge of secure software development practices and
    application security principles.
  - Experience working with relational and/or NoSQL databases.
  - Experience working in Agile, Scrum, or SAFe delivery
    environments.
  - Excellent communication, collaboration, and problem-solving
    skills.







   Compensation, Benefits and Duration

                    Minimum Compensation: USD 35,000

                    Maximum Compensation: USD 123,000

                    Compensation is based on actual experience
  and qualifications of the candidate. The above is a
  reasonable and a good faith estimate for the role.

                    Medical, vision, and dental benefits, 401k
  retirement plan, variable pay/incentives, paid time off, and
  paid holidays are available for full-time employees.

                    This position is not available for
  independent contractors

                    No applications will be considered if
  received more than 120 days after the date of this post
