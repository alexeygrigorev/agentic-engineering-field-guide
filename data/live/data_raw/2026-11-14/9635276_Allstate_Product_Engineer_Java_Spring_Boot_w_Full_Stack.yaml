description: |
  At Allstate, great things happen when our people work
  together to protect families and their belongings from
  life’s uncertainties. And for more than 90 years, our
  innovative drive has kept us a step ahead of our customers’
  evolving needs. From advocating for seat belts, air bags and
  graduated driving laws, to being an industry leader in
  pricing sophistication, telematics, and, more recently,
  device and identity protection.

  Job Description

  As a Product Engineer you will design, build, and support
  high quality digital products using modern engineering
  practices and tools. In this role, you will partner closely
  with product managers and fellow engineers to deliver
  scalable, cloud native, user-centered solutions. You will be
  accountable for the success of your digital product(s), from
  design and implementation through production support and
  performance management against pre-defined key metrics.

  Key Responsibilities

  - Design, build, and enhance full stack software products
  - Design and implement testing strategies to validate
    acceptance criteria
  - Practice pair programming and test-driven development (TDD)
    as part of daily engineering work
  - Establish and maintain CI/CD pipelines, supporting
    continuous integration, delivery, and deployment
  - Collaborate with the team on system and application design,
    selecting the simplest and most effective technical
    solutions
  - Participate in iteration planning, ensuring a shared
    understanding of backlog stories and technical
    requirements
  - Actively engage in daily standups, cross-site collaboration,
    and product team ceremonies
  - Contribute to and participate in retrospectives, identifying
    actionable improvements for the team and product
  - Provide production support for software products
  - Share knowledge and contribute to the growth of team and
    organizational engineering practices
  - Collaborate with other digital product teams and clearly
    communicate technical designs

  Experience

  - 3 + years experience in the below technologies

  Core Technologies & Frameworks

  - Strong proficiency in Java 17+ and Spring Boot 3.x+
  - [Required for full stack] Experience in frontend engineering
    – ReactJS/AngularJS/Typescript
  - [Required for full stack] Strong state management experience
    (Redux Toolkit or equivalent)
  - [Required for full stack] Experience building responsive,
    accessible, data-driven User Experiences [ Required for
    full stack]
  - [Preferred] Working knowledge of Python
  - [Preferred] Understanding of JVM and Application Performance
    Architecture/Management

  Architecture & System Design

  - Strong understanding of REST APIs and distributed systems
  - Experience building microservices and event-driven systems
    (Kafka preferred)
  - [Preferred] Understanding of cloud and hybrid
    environment(s), including Azure, AWS, and various on-
    premises systems

  Data Management

  - Experience with relational/NoSQL databases
  - Familiarity with schema standards (OpenAPI/JSON/AVSC)
  - [Preferred] Understanding of MongoDB Performance Tuning

  DevOps & Infrastructure

  - CI/CD experience (Jenkins/GitHub Actions), Docker,
    Kubernetes
  - Leverage Datadog or similar tools for application monitoring
    and troubleshooting

  Development Practices

  - Practice Test-Driven Development (TDD)
  - Strong understanding of secure development
  - Comfortable working in a pair-programming (XP) environment
  - [Preferred] Understanding and ability to leverage, and or
    build, generative and agentic AI tooling to build
    solutions

  #LI-JK1

  Skills

  AngularJS, Communication, Docker (Software), Java
  (Programming Language), Java Spring, Kubernetes,
  Microservices Architecture, Python (Programming Language),
  React.js, RESTful APIs, Software Development, Spring Boot

  Compensation

  Compensation offered for this role is 70,100.00 - 121,475.00
  annually and is based on experience and qualifications.

  The candidate(s) offered this position will be required to
  submit to a background investigation.

  Joining our team isn’t just a job — it’s an opportunity. One
  that takes your skills and pushes them to the next level.
  One that encourages you to challenge the status quo. One
  where you can shape the future of protection while
  supporting causes that mean the most to you. Joining our
  team means being part of something bigger – a winning team
  making a meaningful impact.

