description: |
  Alkami is the digital sales and service platform provider
  for U.S. banks and credit unions. Our unified Platform
  integrates onboarding, digital banking, and data and
  marketing—each solution can stand alone, but together they
  deliver more—to help institutions onboard, engage, and grow
  relationships. As the future shifts toward Anticipatory
  Banking, we help data-informed bankers meet the moment with
  technology that drives action.

  Founded in 2009, we continue to be recognized for our
  intentional culture and tremendous growth (Best Place to
  Work in Fintech; Best & Brightest to Work For Nationally;
  and Comparably’s Best Company Culture, Best Career Growth,
  Best Engineering Team, and Best Places to Work in Dallas,
  among others). We’re building a culture where each Alkamist
  can perform to their highest potential, and we’re always on
  the lookout for the best and brightest minds. If you’re
  ready to experience the power of alchemy - transforming the
  ordinary into the extraordinary - come join one of the
  fastest growing SaaS companies in the U.S.

  As a remote-first company, most of our positions can be
  remote in the US, except for key roles, which will be
  indicated in the Job Title.

  Follow us on Glassdoor and LinkedIn!

  Alkami is hiring an Engineering Manager for Partnerships to
  lead a team focused on delivering the integrations, identity
  verification, and account opening infrastructure that
  connects financial institutions with their members. This
  team's work spans the full application lifecycle — from OMB
  SSO and enrollment flows to KYC decisioning, funding
  pipelines, and a growing public API platform — requiring
  strong technical judgment across multiple product domains,
  close partnership with Implementation and Product, and a
  relentless bias toward shipping reliable software for
  clients in production. This is a hybrid player-coach role.
  The right person will lead through the work by setting
  direction, mentoring engineers, shaping architecture, and
  staying close enough to the code and systems to help the
  team make strong technical decisions. At Alkami, this type
  of engineering manager role is designed to combine technical
  leadership, people leadership, and hands-on problem solving
  rather than operating as a pure people manager.

  What You’ll Do

  Team Leadership & Engineering Excellence

  - Manage, mentor, and grow a team of full-stack and backend
    engineers across multiple product verticals
  - Run effective sprint ceremonies, backlog grooming, and
    planning rituals to keep the team moving with clarity and
    focus
  - Partner with Product to shape the roadmap, prioritize trade-
    offs, and define scope for quarterly planning
  - Champion engineering quality through code review culture,
    test coverage standards, and thoughtful incident
    retrospectives
  - Identify and remove blockers, resolve ambiguity, and shield
    the team from noise so they can do their best work

  Technical Delivery

  - Drive delivery across a broad set of domains, including:
    - Digital Self-Service Platform (DSSP) and the My Applications
      Hub integration with Alkami Online Banking
    - KYC & Identity Verification via Alloy, Effectiv, Socure, and
      AI-assisted decisioning
    - SSO & Authentication across SAML, OIDC, and enrollment
      integrations with partners
    - Online/Mobile Banking (OMB) configuration tooling and
      business enrollment flows
    - Public API Platform including CRUD endpoints, webhook
      support, and partner-facing documentation
    - Funding & ACH infrastructure including file generation,
      alerting, and self-service configuration
    - Third-Party Integrations with Plaid, Atomic, Segmint,
      BioCatch, and others
  - Hold the bar on system reliability, scalability, and
    security — especially for customer-facing and regulatory-
    adjacent workflows
  - Guide technical decision-making on architecture, platform
    migrations, and strategic spikes

  Stakeholder Partnership

  - Serve as the primary engineering point of contact for
    escalated customer issues, working with Implementation
    Managers and Customer Success to triage and resolve with
    urgency
  - Collaborate with the Alkami Better Together initiative to
    align platform investments with joint go-to-market
    priorities
  - Represent engineering perspective in cross-team planning,
    providing realistic estimates and risk assessments

  What We’re Looking For

  - 8+ years of software engineering experience with a strong
    hands-on technical foundation.
  - 2+ years of experience in a technology leadership role with
    a track record of building and leading strong teams.
  - Strong experience with modern software engineering across
    areas such as TypeScript, Node.js, Python, API
    development, event-driven systems, and relational
    databases such as Postgres.
  - Strong system design and architecture skills, with the
    ability to communicate technical tradeoffs clearly and
    guide teams through ambiguous problems.
  - Experience building backend services and APIs, with a solid
    understanding of REST APIs and microservice-style
    architectures.
  - A leadership style centered on raising the bar through code
    reviews, technical coaching, and thoughtful collaboration.
  - Strong written and verbal communication skills, including
    the ability to turn product asks into clear technical
    plans and align stakeholders around execution.
  - Comfort operating in an evolving environment where
    priorities can shift and the best leaders stay calm,
    adaptable, and execution-focused.

  About You

  - You lead through the work and enjoy being both a technical
    leader and a people leader.
  - You write clean, well-documented, well-tested code and care
    about long-term quality and performance.
  - You think carefully about error handling, logging, and edge
    cases instead of optimizing only for speed.
  - You enjoy breaking down complex product asks into elegant,
    maintainable solutions.
  - You are comfortable discussing architecture, advocating for
    sound technical decisions, and weighing tradeoffs
    thoughtfully.
  - You enjoy mentoring teammates and helping raise the quality
    of the broader team’s work.

