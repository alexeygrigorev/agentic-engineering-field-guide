title: Senior Software Implementation Engineer
company: Lumin Digital
location: USA
remote: true
work_type: FULL_TIME
company_size: 360 Employees
description: |
  The Senior Software Implementation Engineer plays a key role
  in the successful technical delivery of Lumin Digital’s
  digital banking platform. Acting as both a solutions
  engineer and technical consultant, this role is responsible
  for implementing  platform features, supporting data
  conversions, and working directly with clients from
  implementation kickoff through production launch. The Senior
  Engineer gathers requirements, scopes and develops custom
  solutions using the company’s SDK, and supports platform
  operations throughout the implementation lifecycle. This
  individual also contributes to internal documentation, best
  practice improvements, and team knowledge sharing while
  ensuring client satisfaction and a seamless technical
  onboarding experience.

  - Essential Functions and Responsibilities:Lead full-cycle
    technical implementations of the Lumin Digital banking
    platform for new clients, from initial kickoff and
    requirements discovery through configuration, testing, and
    production launch.
  - Serve as the primary technical point of contact for client
    stakeholders, translating business requirements into
    technical specifications and implementation plans.
  - Implement and configure Lumin Digital’s banking product
    components, including digital banking, mobile, and online
    banking modules according to client specifications.
  - Performing testing and validations of each product feature,
    third party integrations, and custom solutions implemented
    during the life cycle of the project.
  - Ensure client expectations are satisfied on the committed
    deliverables.
  - Manage client environments across, staging, pilot and
    production to support iterative testing and a smooth go-
    live transition.
  - Conduct working sessions to help clients understand product
    functionality  and to enable client teams to self-manage
    their application.
  - Develop and document custom solutions and integrations
    leveraging Lumin Digital’s SDK,APIs and available tooling
    to meet client-specific requirements.
  - Create and maintain project scope implementation details,
    data flow documentation, and integration specifications
    for each implementation.
  - Partner with Product, Engineering, Services, and Support
    teams to coordinate deliverables, resolve dependencies,
    and maintain alignment throughout the implementation
    lifecycle.
  - Communicate implementation status, risks, blockers, and
    milestones clearly to internal stakeholders, project
    managers, and client team.
  - Support data conversion and migration efforts associated
    with Projects.
  - Support load testing efforts and help fine tune any
    performance issues.
  - Proactively identify technical risks, implementation
    blockers, and timeline threats; develop and execute
    mitigation strategies to keep projects on track.
  - Troubleshoot and resolve technical issues across all phases
    of implementation, including root cause analysis,
    integration failures, environment issues, and post-launch
    incidents.
  - Identify opportunities to improve implementation
    methodologies, tooling, templates, and reusable
    components. Lead adoption of best practices across the
    technical delivery team.
  - Collaborate cross-functionally with Engineering, Product,
    Services, and Support teams to ensure cohesive delivery
    and rapid resolution of issues.
  - Provide post-launch support and contribute to Tier 2/Tier 3
    production support for live clients until the project is
    handed off to application support.
  - Continuously evaluate and improve implementation processes,
    reusable templates, and team best practices to increase
    delivery quality and efficiency.
  - Contribute to post-implementation retrospectives to capture
    lessons learned and drive continuous improvement in the
    delivery process.
  - Perform other duties as assigned



  Position Specifications

  Education:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field, or an equivalent combination of
    education and experience.

  Experience:

  - 5+ years of experience in software engineering, technical
    implementation, or systems integration roles.
  - Proven experience in digital banking, FinTech, or other
    regulated enterprise software environments.
  - Strong hands-on experience with SQL and relational databases
    for configuration and data migration.
  - At least 2 years of programming experience in languages such
    as C#, Java and Python
  - Proficiency with JIRA or similar Agile project management
    tools.

  Knowledge, Skills, & Abilities:

  - Advanced experience implementing or developing digital
    banking or financial services software products.
  - Experience with SDK or equivalent experience with financial
    technology platforms.
  - Knowledge of core banking system integrations (e.g., Fiserv,
    Jack Henry, FIS, Symitar) and standard data exchange
    formats (JSON, XML, REST, SOAP).
  - Familiar with cloud-native technologies including AWS,
    Docker, Kubernetes, and observability tools such as Kibana
    or Datadog.
  - Understanding of microservices architecture and RESTful API
    design principles.
  - Working knowledge with relational databases and SQL for data
    validation, mapping, and troubleshooting.
  - Familiarity with software development practices including
    version control (Git), CI/CD pipelines, and deployment
    automation.
  - Experience with JIRA or comparable agile project management
    tools for tracking tasks, issues, and milestones.
  - Excellent verbal and written communication skills; able to
    translate complex technical concepts for non-technical
    stakeholders.
  - Proven ability to build strong client relationships and act
    as a credible technical authority.
  - Collaborative team player who thrives in a fast-paced,
    cross-functional environment with ambiguity and change.
  - Strong analytical and critical thinking skills with a
    proactive approach to problem solving.
  - Demonstrated ability to lead, mentor, and influence peers
    and junior team members.

  Travel:

  - Minimal, generally 12 days or less per year, ~2X team get
    togethers a year

  Where the Role can Grow:

  - 30 Days: Gain a thorough understanding of the Lumin Digital
    platform, SDK, and implementation processes. Begin
    assisting with client implementations and resolving
    technical issues.
  - 90 Days: Take ownership of key configuration and data
    conversion tasks, proactively identifying risks and
    recommending solutions.
  - 1 Year: Lead complex client implementations, contribute to
    organizational best practices, and mentor junior team
    members.

  LIFE AT LUMIN DIGITAL

  Lumin Digital is a trailblazer in digital banking solutions,
  driven by a unique approach to technology, service, and
  people. We empower credit unions and banks by creating
  cutting-edge digital experiences that continuously serve,
  engage, and grow their membership base — and as a 100%
  cloud-native company, we're purpose-built to unlock the full
  advantages of the cloud for financial institutions and their
  users.

  At Lumin, we thrive on curiosity and innovation. Our culture
  is built on trust in our expertise and decisions, respect
  for diverse perspectives and talents, and boldness in
  pursuing new ideas. These values shape a workplace where
  collaboration thrives, ideas flourish, and new possibilities
  are discovered every day. We encourage our team to explore,
  experiment, and challenge the status quo — because
  continuous improvement isn't just a goal, it's how we
  operate.



  Benefits include: We take care of our people with medical,
  dental, and vision insurance, a 401(k) with company match,
  flexible PTO plus 12 paid holidays, paid sick leave, and
  paid parental and family leave. We also offer a lifestyle
  spending account, tuition reimbursement, and a cell phone
  stipend. Additional details are provided during the
  interview process.

  Lumin Digital is an equal opportunity employer. We consider
  all qualified applicants without regard to race, color,
  religion, sex, national origin, disability, protected
  veteran status, sexual orientation, gender identity, or any
  other legally protected basis. For more information, visit
  lumindigital.com.

