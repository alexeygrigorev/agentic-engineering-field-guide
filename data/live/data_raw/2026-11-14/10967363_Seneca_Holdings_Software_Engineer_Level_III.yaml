  About the Program

  The U.S. Army Communications-Electronics Command (CECOM)
  Software Engineering Center, Intelligence Electromagnetic
  Warfare and Sensors (IEW&S) Directorate, operates the Army
  Reprogramming Analysis Team (ARAT) at Aberdeen Proving
  Ground. ARAT builds, tests, and distributes mission software
  for fielded electromagnetic warfare systems, including the
  AN/APR-39 radar warning receiver family, the AN/APR-48A/B
  Modernized Radar Frequency Interferometer, the Aircraft
  Gateway Processor on the AH-64, and the AN/VLQ-12 CREW Duke.
  ARAT targets its mission software products to 14 geographic
  areas of responsibility across six combatant commands.

  The ARAT Innovation Initiatives effort modernizes that
  infrastructure: browser-based threat modeling in the Signal
  Modeling Framework, automated RF hardware-in-the-loop
  testing through the Unified Test Automation Suite and
  software-defined radios, an automated Air/Terrestrial
  Testbed, test data warehousing, automated mission data
  product generation, and the ASPEN software distribution
  portal across NIPR, SIPR, and JWICS. Work is executed in
  Agile sprints with DevSecOps practices in a Government-
  approved GitLab environment.

  Position Summary

  The Level III Software Engineer sets technical direction for
  assigned ARAT product baselines and leads integration of
  software into the classified APG laboratory where test
  software executes on a Windows Army Gold Master build. The
  role resolves cross-baseline architectural issues across
  SMF, UTAS, and ASPEN and ensures the contractor development
  environment stays compatible with the ARAT APG lab
  environment. It reviews the work of junior engineers and is
  accountable for the technical quality of delivered
  installation packages. The role also owns user-interface
  architecture across the SMF, TestNet, and ASPEN products,
  establishing the shared component library, interaction
  patterns, and accessibility standard the three browser-based
  interfaces inherit. The role is the contractor's senior
  technical authority across the entire delivery chain. It
  owns the secure delivery pipeline into the classified ARAT
  APG laboratory, leads ARAT-ICS coordination for the
  information assurance approval that gates every delivery
  under 4.2.7.2, and sets the STIG compliance and pipeline
  security standard the development teams inherit. It owns the
  architecture of the ARAT test data baseline and sets the
  analytics and model validation strategy for ASPEN. It also
  sets the cloud and network security architecture for ARAT
  enterprise services, defining the hosting, segmentation, and
  identity model that lets the ASPEN portal operate across
  NIPR, SIPR, and JWICS, and advises the Government on cloud
  investment and cross-domain distribution.

