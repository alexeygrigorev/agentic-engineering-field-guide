  Cloud, network, and security engineering

  - Set the cloud and network security architecture for ARAT
    enterprise services, principally the ASPEN portal that
    must operate across NIPR, SIPR, and JWICS under PWS 4.2.6.
  - Define the hosting, segmentation, and identity model that
    satisfies ARAT-ICS security requirements while meeting the
    portal's growth demands.
  - Advise the Government on cloud investment, cross-domain
    distribution, and the security architecture implications
    of the ASPEN optimization objectives.
  - Establish security architecture governance and RMF control
    inheritance for hosted ARAT services.
  - Perform cost and capacity optimization across hybrid on-
    premises and cloud environments.

