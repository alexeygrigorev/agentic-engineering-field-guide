description: |
  About Us:

  Future is building a personalized guidance system for
  lifelong health. We help people understand what to do next
  for their body, goals, and stage of life — then support them
  in turning those decisions into sustained behavior change.
  By combining AI, human expertise, personal health data, and
  accountability, Future helps members improve performance
  today while building the resilience, capacity, and
  healthspan they need for decades to come.

  About the Role:

  We’re hiring a Full-Stack Growth Engineer to build and
  maintain the product and systems that help more of the right
  people discover Future, convert into members, and reach
  their first moments of value.

  You’ll work across web and backend surfaces that power
  acquisition, signup and access, onboarding and activation,
  and early engagement. You’ll ship experiments end to end,
  instrument funnels carefully, and partner closely with
  product, design, data, and marketing on a small, senior
  team.

  This is a hands-on role. You’ll move between product
  judgment and system design, write production code, run
  trustworthy experiments, and turn learnings into durable
  product improvements — not one-off hacks.

  What You’ll Own:

  - Acquisition and Conversion: Build and improve the web and
    product surfaces that introduce Future to prospective
    members and turn interest into signup. These include
    landing experiences, checkout and plan selection flows,
    and the instrumentation that shows where people drop off.
  - Access and Onboarding: Simplify signup, login, account
    creation, and first-session activation. Remove friction,
    clarify value on Day 1, and help new members connect with
    coaching and get started quickly.
  - Experimentation Systems: Design, ship, and analyze A/B and
    multivariate tests across the funnel. Partner with data to
    define metrics, guardrails, and experiment hygiene so we
    learn fast without polluting the product.
  - Full-Stack Delivery: Implement features across frontend and
    backend — APIs, services, web UI, and the glue between
    growth surfaces and the core member product. Prefer clear
    ownership and fast iteration over brittle one-off paths.
  - Measurement and Insight: Instrument funnels, cohorts, and
    activation milestones. Use qualitative and quantitative
    signal to find leverage, prioritize work, and explain why
    experiments won or lost.
  - Reliability for Growth Paths: Keep high-traffic growth
    journeys fast, stable, and observable. Treat conversion-
    critical paths with the same engineering care as core
    product.
  - Cross-Functional Partnership: Work tightly with product,
    design, data, and marketing. Translate growth hypotheses
    into shippable product work and bring engineering judgment
    into roadmap tradeoffs.
  - AI-Assisted Development: Use coding agents and AI tools to
    speed up exploration, implementation, testing, and review.
    Apply engineering judgment to validate their output before
    it reaches members or prospects.

  Who You Are:Experience and Background

  - You have 6+ years of professional software engineering
    experience, including meaningful ownership of consumer
    growth, acquisition, activation, or conversion surfaces.
  - You are strong full-stack: comfortable across modern web
    frontend and backend services, and able to ship an
    experiment from UI through API and data without waiting on
    another team for every layer.
  - You have run growth experiments in production — A/B tests,
    funnel instrumentation, and iteration based on measured
    outcomes, not vibes alone.
  - You understand customer journeys: segments, touchpoints,
    dropoff analysis, and how product changes move activation
    and retention metrics.
  - You can debug across web UI, networking, backend services,
    analytics pipelines, and CI.
  - You have partnered with product, design, and data (or
    marketing) to take ambiguous growth problems from
    hypothesis to shipped learning.
  - You write clear, maintainable code and care about experiment
    integrity, observability, and long-term operability — not
    just shipping the next test.
  - You use AI coding tools in your development workflow and
    know how to verify their output.

  Domain Passion

  You care about health, fitness, and helping people start —
  and stick with — better habits. You’re motivated by the
  craft of turning curiosity into membership and first value.

  Working Style

  - You bias to action, then measure. You ship small, learn, and
    compound.
  - You raise concerns early and bring possible solutions when
    experiments or funnels look wrong.
  - You share context, invite feedback, and keep partners
    aligned on metrics and tradeoffs.
  - You take ownership from discovery through production support
    on the paths you ship.
  - You balance growth urgency with product quality and member
    trust.

  Nice to Have

  - Experience at a consumer subscription, marketplace, or
    membership product where acquisition and activation were
    core to the business.
  - Familiarity with HIPAA and other laws and regulations that
    apply to health products and services.
  - Experience with paid acquisition landing systems,
    attribution, SEO/organic surfaces, lifecycle messaging, or
    referral loops.
  - Experience building or evolving experimentation platforms,
    feature flags, or analytics instrumentation at scale.
  - Experience with fitness, health, coaching, or other
    personalized consumer products.
  - Prior work on expert tooling, internal operator workflows,
    or coach-facing surfaces that support member outcomes.

  Compensation, Benefits & Life at Future:

  - Salary range: $200,000 - 230,000 / year + equity. The salary
    range is set based on multiple considerations including
    business needs, market demands, talent availability,
    experience, and unique skills and attributes. The base pay
    range is subject to change and may be modified in the
    future.
  - Health coverage: All employees have access to comprehensive
    medical, vision, dental, and disability insurance + tax
    savings accounts
  - 401(k) plan
  - Flexible Paid Time Off
  - Future Membership: Enjoy our platform for free!
  - Health, Wellness & Development: Health and fitness monthly
    stipend contributes to our employees’ overall wellbeing,
    with access to a mental health platform, reimbursement for
    medical travel, and an annual learning & development
    stipend.
  - Remote First: Employment eligible to employees located
    anywhere in the continental US. No travel required.
  - Join a diverse, passionate & driven team of all backgrounds.



  Life at Future

  Equity: Meaningful equity package. Health Coverage: All
  employees who meet eligibility requirements receive
  comprehensive medical, dental, vision, and disability
  insurance, plus tax-advantaged savings accounts. Retirement:
  401(k) plan. Wellness: Monthly wellness stipend for fitness,
  recovery, and overall wellbeing, plus access to mental
  health resources and therapy support. Flexible Time Off:
  Flexible PTO so you can rest, recharge, and take care of
  life outside of work. Learning & Development: Annual budget
  for courses, conferences, coaching, and tools that help you
  grow in your craft. Future Membership: Enjoy our platform
  for free.

  Equal Employment Opportunities at Future

  We are committed to building a future where every member of
  our community, is healthy, cared for, and advancing forward
  together. Future is an equal opportunity employer. We do not
  discriminate based on gender, ethnicity, sexual orientation,
  religion, age, civil or family status, disability or race.
