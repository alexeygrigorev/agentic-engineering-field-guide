description: |
  About Gallatin

  At Gallatin, we are rebuilding logistics infrastructure for
  the national security missions of the United States and
  allied partners. We build AI systems that determine how
  logistics decisions are made — not just how they're
  executed. From factory to foxhole, we operate at the layer
  where data becomes decisions, and decisions make the
  advantage.

  About the Role

  We’re looking for a Backend Software Engineer to design,
  build, and scale the core systems that power our AI-driven
  logistics platform. This is a foundational role: you’ll own
  reliable, high-performance backend services, APIs, and data
  pipelines that our products depend on.

  What You'll Do

  - Backend Development & System Design
    - Create scalable, resilient backend services and APIs for our
      logistics solutions.
    - Own system architecture, balancing performance, scalability,
      and security.
    - Partner with front-end, AI/ML, and product teams to
      integrate services smoothly.
    - Drive high availability and reliability through proactive
      monitoring, logging, and alerting.
    - Build and maintain thorough testing strategies (unit,
      integration, and performance) to keep the platform
      stable.
  - Data Processing & Integration
    - Develop pipelines that ingest data from real-time, batch,
      structured, and unstructured sources.
    - Ensure data is consistent, reliable, and available through
      thoughtful schema design and database optimization.
  - Collaboration & Continuous Improvement
    - Contribute to code reviews, coding standards, best
      practices, and documentation.
    - Track backend development trends and introduce improvements
      to our stack where they make sense.
    - Support the onboarding and mentoring of new teammates as the
      team grows.



  What We’re Looking For

  - Strong Technical Background
    - Proficiency in one or more backend languages: Python,
      Node.js, Typescript or Java
    - Solid understanding of API design and implementation (REST,
      GraphQL).
    - Hands-on experience with relational and NoSQL databases such
      as PostgreSQL, MongoDB, DynamoDB, or Redis.
  - Cloud & Infrastructure Experience
    - Familiarity with cloud environments (AWS, GCP, Azure).
    - Experience deploying and running containerized applications
      with Docker and Kubernetes.
    - Understanding of infrastructure as code (Terraform,
      CloudFormation).
  - Software Best Practices
    - Experience with software testing methodologies (unit,
      integration, end-to-end testing).
    - A commitment to writing clean, maintainable, well-documented
      code.
  - Problem-solving & Communication
    - Excellent problem-solving skills with the ability to debug
      complex systems.
    - Strong collaboration skills, with the ability to work
      effectively across teams and explain technical concepts
      clearly.
  - Growth Mindset
    - Passion for continuous learning and staying current with the
      latest advancements in backend engineering, distributed
      systems, and cloud infrastructure, as well as a
      commitment to mentoring and teaching others.

  Bonus Points

  - Experience with building and integrating on Palantir Foundry
    and its various offerings
  - Knowledge of defense or logistics industries and legacy
    system modernization.
  - Contributions to open-source software or active engagement
    with the developer community.

  Mission and Identity

  We are building the system that enables faster, smarter
  logistics decisions in contested environments, and we're
  doing it with a team of seasoned entrepreneurs, operators,
  and technologists who have built and scaled solutions in
  this space before. We hold ourselves to an extremely high
  standard. We value clear thinking, direct communication, and
  the kind of ownership that doesn't stop until something
  actually works.

  Our mission is to create decision advantage when the stakes
  are the highest. If we succeed, the system doesn't just run;
  it gets smarter. We're not building AI for its own sake.
  We're building it because faster, smarter decisions in the
  most demanding environments on earth can't wait. If you want
  to work somewhere the stakes are real and the mission is
  urgent — you'll fit in here.

  Why Gallatin?

  The logistics infrastructure that supports America's
  warfighters and humanitarian disaster responders is overdue
  for transformation, and we are building it. From defense
  operations to disaster response, we're solving the hardest
  problems that keep missions moving when it matters most.
  Join a team where the mission is the point. Compensation:
  Gallatin offers competitive compensation commensurate with
  experience. Actual compensation may vary based on
  experience, skills, and location. In addition to base
  salary, we offer a generous equity grant, full healthcare
  coverage, 401k, unlimited PTO, and the perks of working in a
  high-caliber, mission-driven environment.

  Gallatin is an equal opportunity employer. We do not
  discriminate on the basis of race, color, religion, sex,
  national origin, age, disability, veteran status, sexual
  orientation, gender identity, or any other characteristic
  protected by applicable federal, state, or local law.

  This position may require the ability to obtain and maintain
  a U.S. government security clearance. The successful
  candidate must be able to work in a classified environment
  when necessary.

  We comply with the United States Department of Labor's Pay
  Transparency provision.

  Note: Due to the nature of certain government contracts held
  by this organization, U.S. citizenship is a requirement for
  all positions at Gallatin. Proof of citizenship will be
  required prior to employment if selected.
