description: |
  Are you passionate about helping engineers and employees
  unlock entirely new ways of working through generative AI,
  intelligent agents, and AI-native products?

  Do you enjoy building and leading exceptional engineering
  teams that create platforms and experiences employees rely
  on every day?

  Are you excited to define the future of work by building an
  internal AI platform that transforms how an entire company
  designs, builds, sells, and supports its products?

  If so, we invite you to be a part of our innovative team.

  At Ridgeline, the AI Leverage Engineering team serves as our
  Internal AI Platform organization, building AI-powered
  products, intelligent agents, and shared capabilities that
  amplify every employee's impact. As a Senior Engineering
  Manager, you'll lead a cross-functional engineering
  organization responsible for multiple AI leverage domains
  spanning Engineering, Product, Go-to-Market, Customer
  Experience, and Corporate Functions. Your organization owns
  Ridgeline's Internal AI Platform—a portfolio of AI products,
  shared services, and intelligent agents that power how the
  company operates every day. You'll partner closely with
  technical and business leaders to identify the highest-value
  opportunities for AI, translate rapidly evolving
  technologies into production-ready solutions, and build an
  AI-first engineering organization where success is measured
  by organization-wide adoption, productivity gains, and
  business impact—not simply the volume of software delivered.
  Our team of engineers are building with cutting-edge
  technologies—like Claude Code and Cursor—in a fast-moving,
  creative, progressive work environment.

  At Ridgeline, how we work matters as much as what we build.
  Ridgeliners act like owners, choose growth over comfort, and
  communicate with transparency. We assume positive intent,
  bias toward action, and bring solutions—not just problems.
  We celebrate wins, learn from setbacks, and thrive in a
  resilient, collaborative, high-performing culture. If this
  excites you, we'd love to meet you!

  You must be work authorized in the United States without the
  need for employer sponsorship.

  The impact you will have

  - Lead, coach, and grow a team of engineers building AI-
    powered products, intelligent agents, and automation
    platforms that increase productivity across Ridgeline.
  - Own the engineering strategy and execution across multiple
    AI leverage domains, delivering a cohesive Internal AI
    Platform that scales intelligent capabilities throughout
    the company.
  - Define and drive Ridgeline's internal AI roadmap, partnering
    with engineering and business leaders to prioritize
    investments that create the greatest organizational
    leverage.
  - Shape the long-term vision for Ridgeline's Internal AI
    Platform, enabling every employee to accomplish more
    through intelligent agents, automation, and AI-native
    workflows.
  - Build an AI-first engineering organization where engineers
    leverage LLMs throughout the software development
    lifecycle and continuously redefine how software is built.
  - Partner with leaders across Engineering, Product, Go-to-
    Market, Customer Experience, Operations, and Corporate
    Functions to deeply understand workflows, identify
    opportunities, and deliver AI products employees actively
    adopt because they meaningfully improve how work gets
    done.
  - Build a culture of experimentation that rapidly evaluates
    emerging LLM capabilities, AI frameworks, developer tools,
    and AI agents while maintaining exceptional engineering
    quality and operational excellence.
  - Guide the architecture and delivery of scalable, secure, and
    reliable AI systems that integrate seamlessly into
    employee workflows.
  - Establish engineering processes, metrics, and operational
    practices that enable teams to move quickly while
    delivering measurable business outcomes.
  - Measure success through employee adoption, productivity
    gains, operational leverage, and business impact,
    continuously evolving the team's roadmap based on real-
    world results.
  - Recruit, develop, and retain world-class AI and platform
    engineers, raising the technical and leadership bar while
    building an organization recognized for innovation and
    execution.
  - Mentor engineering leaders and individual contributors,
    helping them grow technically, expand their business
    impact, and achieve their career goals.
  - Drive technical decision-making across multiple workstreams,
    balancing long-term platform investments with immediate
    business priorities.
  - Foster a culture of AI adoption by helping teams rethink
    workflows, embrace AI-native ways of working, and
    continuously raise the productivity ceiling across
    Ridgeline.
  - Help define the future of work at Ridgeline by making AI a
    seamless, trusted, and indispensable part of every
    employee's daily experience.

  What we look for

  - 8+ years of software engineering experience, including
    significant experience leading and growing high-performing
    engineering teams.
  - Demonstrated success managing engineering managers and/or
    senior engineers while scaling organizations through
    periods of rapid growth and change.
  - Demonstrated passion for generative AI and a track record of
    applying LLMs, AI agents, and modern AI development
    practices to create meaningful business leverage.
  - Deep curiosity about the rapidly evolving AI landscape, with
    the ability to distinguish emerging technologies that
    deliver lasting business value from industry hype.
  - Experience building AI platforms, internal developer
    platforms, enterprise AI products, workflow automation
    solutions, or other highly leveraged internal products.
  - Strong technical judgment with the ability to guide
    architectural decisions and engineering strategy across
    multiple teams while empowering engineers to innovate.
  - Proven ability to partner with executive stakeholders and
    cross-functional leaders to identify opportunities,
    influence strategy, and deliver measurable business
    outcomes.
  - Track record of building products that drive organization-
    wide productivity, operational efficiency, and employee
    adoption.
  - Passion for hiring, developing, and retaining exceptional
    engineering talent while creating an environment where
    individuals and teams can do the best work of their
    careers.
  - Excellent communication and leadership skills with the
    ability to influence both technical and non-technical
    audiences.
  - A growth mindset, exceptional problem-solving ability, and a
    desire to build both people and technology.
  - Willingness to learn about emerging AI technologies while
    continuously expanding expertise in enterprise software,
    intelligent systems, and organizational productivity.

  Bonus

  - Experience building AI agents, copilots, RAG systems, or
    multi-agent platforms.
  - Hands-on experience with modern LLM platforms such as
    OpenAI, Anthropic, or Google Gemini.
  - Familiarity with AI evaluation frameworks, observability,
    prompt engineering, model orchestration, and agentic
    systems.
  - Experience leading platform engineering, internal developer
    productivity, or internal AI product organizations.
  - Experience introducing AI-enabled software development
    practices using tools such as Claude Code, Cursor, or
    similar AI-assisted engineering environments.
  - Experience building products that achieved broad internal
    adoption and transformed how

