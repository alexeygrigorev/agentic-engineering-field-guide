description: |
  Company Overview

  At Motorola Solutions, we believe that everything starts
  with our people. We’re a global close-knit community, united
  by the relentless pursuit to help keep people safer
  everywhere. We build and connect technologies to help
  protect people, property and places. Our solutions foster
  the collaboration that’s critical for safer communities,
  safer schools, safer hospitals, safer businesses, and
  ultimately, safer nations. Connect with a career that
  matters, and help us build a safer future.

  Department OverviewThe Motorola Solutions Glasgow software
  development centre is the leading developer of mobile
  workflow solutions for MSI Software Enterprise. We are
  developing CC Responder, a new handheld solution running on
  Android, iOS and Windows that provides record management,
  search and Command & Control capability integrating through
  the Azure Cloud Platform. The CC Responder Cloud services
  team are developing a number of microservices to run on the
  MSI Software Enterprise Azure Cloud Platform that will
  enable the CC Responder mobile applications. These
  microservices are typically written in Java and run in
  Docker containers, making use of Azure platform services
  such as Cosmos DB and Azure Service Bus. Job Description

  This role is primarily remote, however, there would be a
  benefit to be located closer to the Glasgow area.

  You will work as part of the CC Responder Cloud services
  team developing cloud-based microservices for CC Responder.
  As a Software Engineer in an agile Scrum team you will be
  involved in:

  - Working on the full software development life cycle for the
    new services - including design, development, testing, and
    documentation.
  - Working with other teams across Motorola Solutions to
    integrate CC Responder microservices with other Motorola
    Solutions software components, creating a richer, more
    powerful integrated solution.
  - Continuing to support our existing customers, adapting the
    product to meet their evolving needs.

  Basic Requirements

  Basic Requirements

  The Software Engineer will have the following skills &
  experience:

  - A formal qualification (Degree) in Computing Science or
    equivalent experience with a high level of academic
    achievement.
  - Experience developing server-side Java applications.
  - Good communication skills.

  Desired Requirements

  Ideally the Software Engineer will also have the following
  skills & experience:

  - Java SpringBoot, Kubernetes, Python and BDD testing
    frameworks.
  - Knowledge of Microsoft Azure or similar cloud technologies.

  In return for your expertise, we’ll support you in this new
  challenge with coaching & development every step of the way.
  Also, to reward your hard work you’ll get:

  - Competitive salary and bonus schemes.
  - Two weeks additional pay per year (holiday bonus).
  - 25 days holiday entitlement + bank holidays.
  - Attractive defined contribution pension scheme.
  - Employee stock purchase plan.
  - Flexible working options.
  - Private medical care.
  - Life assurance.
  - Enhanced maternity and paternity pay.
  - Career development support and wide ranging learning
    opportunities.
  - Employee health and wellbeing support EAP, wellbeing
    guidance etc.
  - Carbon neutral initiatives/goals.
  - Corporate social responsibility initiatives including
    support for volunteering days.
  - Well known companies discount scheme.

