description: |
  About Us:

  MCCi is a premier provider of intelligent business process
  automation solutions and a trusted partner to over 2,000
  organizations across state and local government, education,
  and select commercial entities throughout North America.
  Through our JustFOIA and GovBuilt software platforms, and as
  the world's largest Laserfiche solution provider, we
  prioritize service. Our solutions suite and commitment to
  client delight enable us to positively impact the lives of
  our clients and those they serve.

  About the role

  We are seeking an experienced Software Engineer to join our
  JustMeetings Product Development team. This role is ideal
  for a skilled full-stack developer who enjoys building
  scalable applications, solving complex technical challenges,
  and mentoring fellow engineers.

  The ideal candidate is passionate about software
  development, thrives in a collaborative Agile environment,
  and can balance hands-on development work with technical
  leadership responsibilities. You'll play a key role in
  designing, building, testing, supporting, and enhancing
  customer-focused software solutions while helping drive
  engineering best practices across the team.

  What you'll do

  - Design, develop, test, and support scalable web applications
    using Node.js, React, MongoDB, and API integrations
  - Collaborate with cross-functional teams to design, develop,
    and deploy software solutions that meet customer and
    business requirements
  - Write maintainable, testable, and scalable code while
    adhering to engineering best practices
  - Participate in code reviews and contribute to software
    quality standards across the development team
  - Troubleshoot production issues, identify root causes, and
    implement effective solutions
  - Lead implementation efforts for medium-complexity
    initiatives and sprint-level projects
  - Author technical design documentation and contribute to
    architectural discussions and technical decision-making
  - Monitor live environments and proactively reduce technical
    debt
  - Partner closely with QA and Support teams to resolve
    customer-impacting issues
  - Mentor Software Engineer I and II team members through code
    reviews, technical guidance, and knowledge sharing
  - Stay current on emerging technologies, trends, and best
    practices in software engineering
  - Participate in an on-call rotation supporting product
    rollouts and production environments

  What you'll need to be successful

  - 5+ years of software engineering experience
  - Strong proficiency with Node.js, React, MongoDB, and API
    communication
  - Experience working with SQL Server, MongoDB, and cloud
    hosting platforms such as AWS, Render, or similar
    technologies
  - Experience with Agile and Scrum development methodologies
  - Strong understanding of software engineering principles,
    design patterns, and best practices
  - Experience with Git, Jira, automated testing, CI/CD
    pipelines, and modern development workflows
  - Excellent analytical and problem-solving skills
  - Strong communication and collaboration skills
  - Ability to work independently and effectively within a team
    environment
  - Experience mentoring and developing less-experienced
    engineers

  Preferred Qualifications

  - Bachelor's or Master's degree in Computer Science or a
    related field
  - Experience with cloud services, CI/CD pipelines, and
    automated testing frameworks
  - Experience with Entity Framework Core
  - Experience monitoring applications with tools such as
    CloudWatch, Cloudflare, Pingdom, or similar platforms

  What you can expect from us

  We really ARE more than a company! We have a passion for
  growth and hitting goals, but we want to do it together as a
  team and enjoy the ride as we go.

  WE ARE APPROACHABLE.

  Want to talk to a member of management or leadership? Walk
  up and say hi.

  WE TRUST YOU.

  We don't have a million rules because we believe you will
  embrace our Culture Code and make good decisions.

  WE EMBRACE TECHNOLOGY.

  We love it, sell it, support it, use it, and need it.

  WE DRESS COMFORTABLY.

  We need you to work hard, not wear a tie.

  WE ARE KIND.

  Being kind, forgiving, empathetic, and respectful can change
  your life and everyone around you.

  WE ENJOY OUR TEAM.

  Use your webcam, collaborate, build relationships, and
  recognize others for doing a great job. You work a lot; make
  the most of your time here.

  WE VIRTUALIZE EVERYTHING.

  We strive for 100% inclusion of our remote teammates.

  MCCi is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
