description: |
  About Us: Founded 20 years ago and headquartered in Chicago,
  the DV Group of financial services firms has grown to more
  than 600 people operating throughout North America, Europe
  and Asia. Since spinning out of a large brokerage firm in
  2016, DV Trading has rapidly scaled as an independent
  proprietary trading firm utilizing its own capital, trading
  strategies, and risk management methodologies to provide
  liquidity to worldwide financial markets and hedging
  opportunities to commodity producers and users. Now, DV
  group affiliates include two broker dealers, a
  cryptocurrency market making firm, and a bourgeoning
  investment adviser.

  Overview: We are seeking a highly motivated, quick-learning
  student developer to join our equities desk for the 2027
  Summer Internship. You will gain hands-on experience
  developing components of our cutting-edge, low-latency
  trading platform. Working alongside experienced developers
  and traders, you'll contribute to real projects—whether it's
  optimizing exchange connectivity in C++ or building research
  pipelines in Python, depending on your primary skills and
  interests—while learning how technology drives competitive
  advantage in global financial markets.

  Responsibilities:

  - Based on your primary language, you will focus on either
    low-latency system components (C++) or data/backtesting
    tooling (Python), with opportunities to learn both over
    time
  - Assist in the design, development, and maintenance of low-
    latency trading system components using C++
  - Build tools and scripts in Python for data analysis,
    backtesting, and strategy research
  - Work alongside senior traders, quantitative researchers, and
    software developers to understand the full trading
    technology stack
  - Optimize and refactor existing code for performance and
    reliability
  - Participate in code reviews and team discussions,
    contributing fresh ideas and learning industry best
    practices
  - Further responsibilities may be driven by the individual’s
    interests and specific skills

  Requirements:

  - Currently pursuing a Bachelor’s or Master’s degree in
    Computer Science, Engineering, or a related field
  - Expected graduation date: 2027 or 2028
  - Strong proficiency in either C++ or Python (with some
    exposure to the other language through coursework,
    personal projects, or prior internships)
  - Solid understanding of data structures, algorithms, and
    object-oriented design
  - Familiarity with Linux/Unix environments and basic
    networking concepts
  - Detail-oriented with a strong work ethic and eagerness to
    learn quickly
  - Genuine interest in algorithmic trading and financial
    technology
  - Ability to work collaboratively in a fast-paced, team-
    oriented environment
  - Prior internship or project experience in low-latency
    systems, trading, or large-scale data processing is a plus
    but not required

  Compensation: $50.00 per hour

  DV is not accepting unsolicited resumes from search firms.
  Only search firms with valid, written agreements with DV
  should submit resumes in response to DV’s posted positions.
  All resumes submitted by search firms to DV via e-mail, the
  Internet, personal delivery, facsimile, or any other method
  without a valid written agreement shall be deemed the sole
  property of DV, and no fee will be paid in the event the
  candidate is hired by DV. DV is proud to be an equal
  opportunity employer and committed to creating an inclusive
  environment for all employees.
