description: |
  Banyan Software is the best permanent home for software
  businesses that serve specialized industries, their
  employees, and their customers. With a buy-grow-and-hold-
  for-life approach and a permanent capital base, Banyan
  acquires and grows companies worldwide, honoring founder
  legacies and helping portfolio companies modernize through
  shared AI expertise and operational discipline. Founded in
  2016, Banyan operates more than 120 portfolio companies
  across North and South America, Europe, and APAC, and has
  appeared on the Inc. 5000 list for six consecutive years.
  The Banyan Software Foundation, endowed with $100 million in
  Banyan stock, leverages technology to build a greener and
  more equitable world.

  Point & Click Solutions is seeking a Software Developer to
  build and maintain healthcare applications used by clinical
  and administrative teams. You will work across modern
  ASP.NET Core applications, established .NET systems, SQL
  Server databases, and patient-facing web experiences.



  Responsibilities

  - Develop and maintain applications using C#, ASP.NET Core,
    Razor, JavaScript, and SQL Server.
  - Design APIs, services, background jobs, database procedures,
    and responsive user interfaces.
  - Troubleshoot issues across application, database,
    integration, and deployment layers.
  - Write automated unit and browser-based integration tests.
  - Modernize legacy .NET and Windows components while
    preserving production reliability.
  - Build secure integrations using REST, SOAP, SFTP, XML, and
    healthcare data formats.
  - Participate in code reviews, technical design, testing, and
    release validation.
  - Protect sensitive healthcare data through secure coding and
    authorization practices.
  - Collaborate with product, support, QA, and implementation
    teams to translate operational needs into practical
    solutions.

  Required Qualifications

  - Professional experience with C# and .NET.
  - Experience developing web applications with ASP.NET Core or
    ASP.NET MVC.
  - Strong SQL Server and T-SQL skills, including stored
    procedures and query optimization.
  - Working knowledge of HTML, CSS, JavaScript, and common web
    development patterns.
  - Experience with Git, automated testing, debugging, and code
    review.
  - Ability to understand and improve an established, business-
    critical codebase.
  - Clear written and verbal communication skills.

  Preferred Qualifications

  - Experience with Dapper, Razor, jQuery, Bootstrap, or Entity
    Framework Core.
  - Experience with xUnit, NUnit, Playwright, or similar testing
    tools.
  - Familiarity with Quartz.NET, SignalR, OpenID Connect, IIS,
    and Windows services.
  - Experience modernizing legacy .NET Framework, VB.NET, COM,
    or desktop applications.
  - Knowledge of CI/CD pipelines, Gulp, Jenkins,
    Swagger/OpenAPI, or NLog.
  - Experience with healthcare software, HIPAA-sensitive data,
    patient portals, billing, scheduling, or clinical
    workflows.
  - Familiarity with multi-tenant applications and security-
    based data partitioning.

  What Success Looks Like

  A successful developer will produce clear, maintainable
  solutions; investigate problems across the full stack;
  balance modernization with compatibility; and steadily
  improve the reliability and usability of software that
  supports healthcare delivery.

