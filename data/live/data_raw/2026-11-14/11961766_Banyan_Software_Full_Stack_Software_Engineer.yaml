  Recruitment Notice

  Banyan Software may use artificial intelligence (AI) tools
  to assist in screening and/or assessing applicants during
  the recruitment process. All hiring decisions are made by
  our team. Personal information submitted through your
  application will be collected and used for recruitment
  purposes in accordance with applicable privacy laws. Contact
  us at any time with questions about our process or to
  request accommodation.

  Beware of Recruitment Scams

  We have been made aware of individuals fraudulently posing
  as members of our Talent Acquisition team and extending fake
  job offers. These scams may involve requests for personal
  information or payment for equipment.

  Protect yourself by following these steps:

  - Verify that all communications from our recruiting team come
    from an @banyansoftware.com email address.
  - Remember, employers will never request payment or banking
    information during the hiring process.
  - If you receive a suspicious message, do not respond —
    instead, forward it to careers@banyansoftware.com and/or
    report it to the platform where you received it.

  Your safety and security are important to us. Thank you for
  staying vigilant.
