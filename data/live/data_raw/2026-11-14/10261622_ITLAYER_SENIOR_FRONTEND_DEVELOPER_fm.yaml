description: |
  Company Description

  Are you tired of building trivial frontends? Looking for the
  challenge to build a complex, highly interactive user-
  interface with HTML5/JS?Are you fed up with ecommerce?Want
  to build something purposeful that has a positive impact on
  children’s life?

  Join us!

  We are a Berlin based EdTech startup which was founded in
  2008.Our goal is to improve math learning and teaching in
  schools worldwide.We offer an adaptive learning platform for
  highly interactive math books which enable students to learn
  from their mistakes.With our sodtware students solve
  millions of exercises each week and in doing so experience
  hundreds of thousands of aha! effects. We are looking for a
  Senior Frontend-Developer who will help us to rebuild our
  central Flex/Flash based component with HTML5/JS.

  Qualifications

  You should have

  - experience with SPAs (angular/react…). Knowledgable about
    pros/cons.
  - fluency with JavaScript, experience with at least one of
    TypeScript/ES6/CoffeeScript/... or another cross-platform
    language.
  - experience with cross-platform mobile development is a plus
    (PhoneGap, Ionic, …)
  - passion for design and user experience. Good understanding
    of CSS and tooling
  - desire for quality (TDD, ATDD,  BDD, ...)
  - willingness to work/learn fullstack in a cross-functional
    team, DevOps mindset

  Additional Information

  You will be part of a cross-functional, fully-empowered,
  self-organized team.

  We strongly believe in agile principles, value fast learning
  cycles and trust in continuous improvement.Expecting the
  same from you.
