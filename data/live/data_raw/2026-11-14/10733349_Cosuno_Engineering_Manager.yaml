description: |
  Your mission

  As Engineering Manager at Cosuno, you will lead a team of
  full stack engineers while staying deeply hands-on: you'll
  spend 60–80% of your time coding, reviewing, and shaping the
  architecture alongside your team. You are the kind of leader
  who elevates a team by example — writing code that sets the
  bar, and building an environment where great engineers do
  their best work.

  Your mission might include:

  - Leading a team of full stack and AI/ML engineers: coaching,
    regular 1:1s, growth plans, and hiring — while shipping
    product yourself every week.
  - Owning the delivery and technical quality of your team's
    roadmap, working closely with your Product Manager to
    plan, de-risk, and execute.
  - Contributing hands-on across our TypeScript stack (React +
    Node), from designing features to reviewing pull requests
    and tackling the hard problems yourself.
  - Raising the team's technical bar through code reviews,
    architectural guidance, and best practices — including
    driving the adoption of AI-assisted engineering workflows.
  - Partnering with engineering leadership on team topology,
    processes, and the technical direction of our platform.

  How We Build: Our Engineering Culture

  We believe in a calm, collaborative, and productive
  engineering environment. We trust our engineers and give
  them the autonomy to do their best work. Our approach
  includes:

  - Agile & Fast-Paced: We practice trunk-based development with
    daily releases to get value into our users' hands quickly.
  - Quality by Default: We maintain a comprehensive Cypress E2E
    test suite and enforce strict typing, linting, and
    formatting rules to keep our codebase clean and
    maintainable.
  - DevOps Mindset: Our well-oiled CI/CD pipeline deploys to AWS
    via Kubernetes, with our entire infrastructure managed as
    code using Terraform.
  - Collaboration & Transparency: We value open discussion,
    constructive code reviews, and a culture where the best
    idea wins, regardless of who it comes from.

  Your profile

  We're looking for a player-coach: a strong engineer who
  leads people without giving up the keyboard. You'll be a
  great fit if you have:

  - Extensive experience (typically 7+ years) in software
    engineering, with a proven track record of delivering
    complex, scalable web applications.
  - Strong expertise in our core technologies (TypeScript,
    Node.js, React) and the ability to reason about the entire
    stack, from the database to the browser — and you still
    use it daily.
  - Leadership experience — whether as an Engineering Manager or
    team lead with direct reports, or as a senior tech lead
    who has mentored engineers, led projects, and shaped how a
    team works.
  - A genuine desire to keep coding: this role is 60–80% hands-
    on by design, and that's what excites you about it.
  - A passion for growing people. You find joy in helping other
    engineers develop, in giving honest feedback, and in
    building a healthy, high-performing team.
  - Bonus, not required: a good understanding of building LLM-
    based applications or ML algorithms — your team includes
    AI/ML engineers, and being able to follow their work
    helps, though you won't need to be the expert.
  - Excellent communication skills in English, with the ability
    to articulate complex technical concepts to both technical
    and non-technical audiences.

  Why us

  - Competitive Compensation: A competitive salary above the
    market average.
  - Work-Life Balance: Choose to work 100% remotely or from our
    modern office in Berlin. We offer flexible working hours
    to fit your life.
  - Top-Notch Equipment: A new MacBook Pro to ensure you have
    the best tools for the job.
  - A Great Team: Regular company off-sites and team events that
    connect us as people, not just colleagues.
  - Job Security: A permanent contract in a stable, well-funded
    company.

  About us

  Cosuno – Revolutionizing construction through technology.

  We are Cosuno – a fast-growing tech startup that is making
  the construction industry more efficient and transparent
  with our digital platform for tenders and procurement
  processes. Our goal: to solve the most complex challenges in
  the industry with innovation and simplicity.

  Why Cosuno?

  Artificial intelligence is the key to our solution: it
  analyzes millions of price data points and helps
  construction companies create precise and efficient bids.
  This not only saves our customers time but also helps them
  avoid unnecessary costs.

  But for us, it's not just about technology – it's about the
  people who drive it. At Cosuno, you will work with creative
  minds who are reshaping the construction industry. We
  believe in diversity because we know that the best ideas
  come from different perspectives. An integrative and
  inclusive work environment is a matter of course for us.

  Join us – Build the future of construction.
