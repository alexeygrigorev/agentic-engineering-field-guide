description: |
  Why Sony Interactive Entertainment?

  Sony Interactive Entertainment isn’t just the Best Place to
  Play — it’s also the Best Place to Work. Sony Interactive
  Entertainment (SIE) is the company behind the PlayStation
  brand. As a subsidiary of Sony Group Corporation, we’re part
  of a proud legacy of innovation and excellence. SIE is a
  dynamic technology company, delivering cutting-edge hardware
  and network services to more than 100 million people and an
  entertainment leader, home to some of the most beloved and
  recognizable intellectual properties (IP) in the world. Our
  role at SIE is to create and nurture the experiences under
  the PlayStation brand, a name synonymous with entertainment
  excellence and creativity.

  PlayStation Studios is the game development division of Sony
  PlayStation, and is responsible for developing some of the
  most recognisable and ambitious console games and franchises
  on PlayStation, including The Last of Us, Horizon, Spider-
  Man, God of War, Helldivers and Gran Turismo.

  We work with some of the best game studios in the world, and
  use data to help them make their games even better. We
  provide end-to-end analytics services for PlayStation
  Studios and use data to help them in the game development
  lifecycle. We are looking for talented people to join us in
  pushing the boundaries of game analytics for PlayStation
  games.

  This role offers a flexible hybrid working arrangement, with
  most time spent working remotely unless you prefer to come
  into the office. We attend the office for key moments that
  matter, such as important team meetings, collaboration
  sessions and business activities where in-person engagement
  is beneficial.

  Role Overview:

  As a Lead Software Engineer with experience in data
  pipelines, you’ll work in our cross-disciplinary Data
  Platform team to develop integrations and APIs supporting
  our Data Platform. These will include working with our data
  pipelines. You’ll work closely with our Game Analytics data
  engineers, who process this data to gain valuable insights
  both during game development and post-launch. As a lead,
  you’ll scale our platform and help us define its technical
  direction, expand its reach, and help define and build the
  future of the data platform for PlayStation games.

  What you’ll be doing:

  - Own integrations with our data platform, including BI
    tooling, APIs, internal websites and other tooling
  - Drive improvements to achieve our technical and business
    goals
  - Enable studio self-service on our platform
  - Work closely with the Devops team, our data and frontend
    engineers, and stakeholders across the studio business
    group
  - Support our existing tooling, improving quality and
    documentation
  - Be a technical expert and share than knowledge with your
    colleagues

  What we’re looking for:

  - You have experience building data integrations between
    different platforms, including APIs and pipelines
  - You are adept at writing code in Go, or write Python with a
    willingness to learn Go
  - You are experienced in building robust, scalable, and
    resilient services
  - You can demonstrate measurable impact that you have made in
    your current and previous roles
  - You enjoy having primary ownership of parts of a platform
  - Experience with AWS services, such as Amazon S3, Lambda,
    Redshift, Kinesis, Data Firehose, Athena and AWS Glue

  Nice to have:

  - Has made use of AI during the development cycle, including
    use of Claude Code, Codex or other harnesses
  - Experience integrating with with Omni Analytics, or a
    similar BI tool (Looker, Tableau etc)
  - GitHub and GitHub Actions experience

  Please note, Sony Interactive Entertainment conducts
  background checks at the offer stage for all new employees
  (which may include criminal background checks for some
  roles) and will need to process personal information to
  support these checks.

  Please refer to our Candidate Privacy Notice (where
  applicable) for more information about what personal
  information we collect, how we use it, who we share it with,
  and your data protection rights.

  Equal Opportunity Statement:

  Sony is an Equal Opportunity Employer. All persons will
  receive consideration for employment without regard to
  gender (including gender identity, gender expression and
  gender reassignment), race (including colour, nationality,
  ethnic or national origin), religion or belief, marital or
  civil partnership status, disability, age, sexual
  orientation, pregnancy, maternity or parental status, trade
  union membership or membership in any other legally
  protected category.

  We strive to create an inclusive environment, empower
  employees and embrace diversity. We encourage everyone to
  respond.

  Sony Interactive Entertainment is a Fair Chance employer and
  qualified applicants with arrest and conviction records will
  be considered for employment.
