  Manager of Engineering Operations

  New York, New Jersey or Massachusetts



  Remedy is an independent, full-service healthcare real
  estate company providing acquisition, development, leasing,
  management, and strategy consulting services across the
  United States. Headquartered in Chicago, we are the largest
  private owner of healthcare properties in the country. Our
  national presence enables us to offer the right solutions in
  the right place. Our team is always thinking ahead. Real
  estate minds trained on where healthcare is going, with
  bright ideas on how to get our clients there. If you’re one
  of those bright minds, we’d like to meet you.



  Job Summary



  The Maintenance Operations Manager position encompasses a
  wide range of duties associated with the total care of the
  assigned assets that represent a major investment by the
  company. These responsibilities are continuous, 24 hours a
  day, 365 days a year.

  Responsible for the daily maintenance operations across
  multiple buildings including providing technical and
  building system guidance and training to building
  maintenance staff. Ensure all work is done in accordance
  with company maintenance policies, procedures and safe work
  practices and is consistent with service promise standards.
  Provide input on budgets, manage schedules of maintenance
  staff and be the technical bridge between Real Estate
  Managers and maintenance staff.



  Responsibilities:

  - Serve as the primary technical contact for local engineering
    teams; create relationships and maintain open
    communication with all local teams and provide
    professional support as needed.
  - Act as technical advisor on potential capital projects. Help
    local teams determine need for repairs versus replacement
  - Assist with capital budgets and future capital planning to
    help identify timelines for major equipment replacements.
  - Review property condition reports for new acquisitions and
    identify areas of concern
  - Assist local teams with coordination and oversight of
    outsourced/contracted vendor work/construction activities,
    ensuring economic, quality results are completed in a
    timely fashion. This includes the review and approval of
    scope of work, bidding, scheduling and supervision of all
    work through completion. As needed tour construction sites
    and participate in construction meetings
  - Assess properties and advise on potential loss prevention
    measures to be implemented both from a preventative
    maintenance perspective and weather events
  - Help develop general standards of maintenance to be
    implemented across portfolio (work order systems,
    preventative maintenance schedules, property inspection
    checklist, safety protocols, building procedures, etc.)
  - Be a resource to local teams with all building operations
    and help facilitate standards to ensure the teams operate,
    inspect, maintain, service and repair all mechanical
    (HVAC), electrical, lighting, plumbing, life safety and
    ancillary systems and equipment, safely and within
    intended designs, for the facilities and their structures
  - Be a resource to local teams with all operations of the
    building (HVAC, BAS, MEP, etc)
  - Coordinates, arranges and supervises or provides for the
    completion of corrective and preventive maintenance and/or
    repairs. Operate, program and maintain EMS and preventive
    maintenance systems for assigned properties. Initiates,
    implements and tracks special/service contracts
  - Work with local teams to maintain an adequate inventory of
    all parts, materials and supplies necessary for the
    operation of the facilities and their systems and
    equipment
  - Assure that proper tools, test equipment, safety/protective
    gear/equipment and technical literature are available to
    local teams and used to perform required tasks
  - Ensure local teams keep all mechanical and storage areas in
    a clean and orderly fashion
  - Responds and interacts with tenants as required to address
    and resolve any building issues. Interacts with
    subcontractors to ensure compliance with Remedy Building
    Rules, safety regulations and other contractual
    obligations
  - Walk buildings when needed (including vacant spaces) with
    local engineers and property managers and document
    building conditions and areas of improvement
  - Ensure local teams maintain the facilities’ compliance with
    governmental regulations (i.e. ADA, CFC, OSHA and OSHA
    training, etc.)
  - Assist in organizing continuing education and training
    opportunities for engineering teams
  - May perform other duties as assigned by Manager.

  Qualifications:

  - Ability to travel (20-30%) throughout United States required
  - 7+ years of direct or related experience and/or equivalent
    experience/education
  - Prior experience in leading personnel and work associated
    with the maintenance of commercial buildings is preferred
  - Prior experience working independently with little or no
    supervision preferred
  - Ability to handle multiple tasks, manage time effectively,
    establish workflow priorities and work independently
  - Able to physically perform duties at the speed, mobility,
    and force necessary to the task
  - Proficient in Microsoft based software

  - Excellent oral communication skills
  - Possess appropriate and competitive level of experience and
    education to perform job
  - Prior employment history that demonstrates the ability to
    work in a fast-paced, high-intensity environment while
    managing multiple tasks and priorities, producing accurate
    results in a highly organized manner



  Now is a great time to join our growing team at Remedy! You
  will work side-by-side with firm leadership to serve clients
  and build the business, having a direct impact on the firm’s
  success. We offer competitive health benefits: Medical,
  Dental, Vision, Life (including spouse & child), 401K,
  STD/LTD, Parental leave, AD&D, Tuition Reimbursement and
  Commuter benefits. We offer flexibility in how and where you
  get your work done and meaningful relationships with
  clients, teammates and leadership who truly care about you
  and your development.
