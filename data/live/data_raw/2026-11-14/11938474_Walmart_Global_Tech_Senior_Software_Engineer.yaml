description: |
  Position Summary...

  What you'll do...Role summary: As a Senior Software
  Engineer, you will lead the delivery of scalable software
  solutions by managing feature development, testing, and
  ongoing support within collaborative teams. This role
  requires expertise in software lifecycle execution,
  including coding, debugging, and continuous integration,
  while integrating AI/ML components to enhance platform
  capabilities. You will contribute to solution design,
  technical leadership, and stakeholder collaboration to
  ensure alignment with business objectives. Emphasizing
  quality, innovation, and operational excellence, you will
  drive continuous improvement and mentor peers to uphold
  engineering standards and deliver impactful results.

  About the team: The Membership Experience Engineering team
  at Walmart develops technology that enhances shopping
  journeys for millions of customers, supporting varied needs
  such as grocery shopping, home organization, and event
  planning. Focused on creating seamless experiences anytime
  and anywhere, the team pioneers innovations for Walmart+,
  shaping scalable platforms on mobile devices. This critical
  team collaborates across functions to design and deliver
  customer membership solutions, emphasizing quality,
  reliability, and continuous improvement. Members apply
  strong technical skills and a product-driven mindset to
  build and maintain impactful software systems that meet
  evolving customer expectations and business goals.

  What you'll do:

  - Own scoped feature and model delivery through collaborative
    engineering teams, managing implementation, iteration,
    testing, and support.
  - Write clean, efficient, and reliable code across multiple
    languages, driving full software development lifecycle
    including CI/CD and automated testing.
  - Integrate AI and ML components to enhance software.
  - Assist in converting high-level designs into detailed,
    scalable, and maintainable solutions aligned with platform
    objectives.
  - Conduct code reviews, debugging, and defect management to
    ensure software quality and performance.
  - Collaborate with stakeholders to translate business needs
    into technical requirements and measurable outcomes.
  - Monitor application performance and support CI and delivery
    practices.
  - Mentor peers, share knowledge, and promote engineering best
    practices for continuous improvement.

  What you'll bring:

  - Proven experience in designing and developing features for
    large-scale applications using Java- and Node.js-based
    services
  - Expertise in object-oriented programming and documentation-
    based coding practices.
  - Experience working with remote data via REST and GraphQL
    APIs, JSON, HTTP protocols
  - Strong technical acumen with experience in code review,
    debugging, and continuous development.
  - Demonstrated ability to deliver scoped features through
    iterative and incremental development.
  - Experience integrating AI/ML components and leveraging
    generative AI tools to enhance software solutions.
  - Skilled in designing scalable, secure, and maintainable
    software aligned with platform and business objectives.
  - Proficient in collaborating across teams to translate
    complex problems into actionable technical requirements.
  - Commitment to engineering excellence, continuous
    improvement, and mentoring peers.

  At Walmart, we offer competitive pay as well as performance-
  based bonus awards and other great benefits for a happier
  mind, body, and wallet. Health benefits include medical,
  vision and dental coverage. Financial benefits include
  401(k), stock purchase and company-paid life insurance. Paid
  time off benefits include PTO (including sick leave),
  parental leave, family care leave, bereavement, jury duty,
  and voting. Other benefits include short-term and long-term
  disability, company discounts, Military Leave Pay, adoption
  and surrogacy expense reimbursement, and more.

  You will also receive PTO and/or PPTO that can be used for
  vacation, sick leave, holidays, or other purposes. The
  amount you receive depends on your job classification and
  length of employment. It will meet or exceed the
  requirements of paid sick leave laws, where applicable.

  For information about PTO, see
  https://one.walmart.com/notices.

  Live Better U is a Walmart-paid education benefit program
  for full-time and part-time associates in Walmart and Sam's
  Club facilities. Programs range from high school completion
  to bachelor's degrees, including English Language Learning
  and short-form certificates. Tuition, books, and fees are
  completely paid for by Walmart.

  Eligibility requirements apply to some benefits and may
  depend on your job classification and length of employment.
  Benefits are subject to change and may be subject to a
  specific plan or program terms.

  For information about benefits and eligibility, see
  One.Walmart.

