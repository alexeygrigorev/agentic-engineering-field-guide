description: |
  About VillageSQL

  VillageSQL is bringing MySQL into the agentic era by
  building a community-driven version of MySQL with
  extensions. The extension framework turns MySQL into a
  platform for AI innovation, including a serverless, managed
  service for agents and long-tail developers (i.e. VillageSQL
  Cloud).

  The Opportunity

  We are seeking a highly skilled and passionate Software
  Engineer to join our core team. As you will play a pivotal
  role in shaping the architecture, development, and evolution
  of VillageSQL and the cloud service. You'll be instrumental
  in building the foundation of our database-as-a-service,
  working with cutting-edge technology, and contributing to a
  vibrant open-source community. If you have a deep passion
  for databases, experience programming in Go, working with
  Kubernetes, and a desire to be part of something
  groundbreaking, we want to hear from you.

  What You'll Do

  - Design, develop, and implement core database features for
    VillageSQL Cloud, with a strong emphasis on performance,
    stability, and scalability.
  - Utilize your strong Go and Kubernetes skills to write
    efficient, reliable, and maintainable code.
  - Collaborate closely with the founding team to define the
    technical vision, roadmap, and priorities for VillageSQL
    Cloud.
  - Engage with the open-source community, fostering
    collaboration, contributing code, and providing technical
    guidance.
  - Ensure the security and integrity of the VillageSQL Cloud
    service.
  - Participate in code reviews, contribute to architectural
    discussions, and promote best practices in software
    development.
  - Troubleshoot and resolve complex technical issues.

  What You'll Bring

  - 3+ years of professional software engineering experience
    with a strong focus on Go and Kubernetes development.
  - Proven ability to design, develop, and implement complex,
    distributed systems.
  - Familiarity with open-source development practices, version
    control systems (e.g., Git), and collaborative development
    workflows.
  - Excellent problem-solving, analytical, and debugging skills.
  - Strong communication, collaboration, and interpersonal
    skills.
  - Passion for open-source software and a desire to contribute
    to a community-driven project.
  - Bachelor's or Master's degree in Computer Science or a
    related field, or equivalent practical experience.

  Bonus Points For

  - Active contributions to open-source database projects.
  - Experience building distributed systems, specifically
    storage or database systems
  - Knowledge of cloud computing platforms (e.g., AWS, GCP,
    Azure).
  - Experience with other programming languages (e.g., C++,
    Rust) and scripting.
  - Familiarity with build systems and configuration management
    tools.
  - Deep understanding of relational database management systems
    (RDBMS) concepts and architecture, ideally with knowledge
    of MySQL internals.

  Why Join VillageSQL?

  - Shape the Future: Be a core contributor to a groundbreaking,
    community-driven database project.
  - Make a Significant Impact: Your work will directly influence
    the design and development of VillageSQL.
  - Work with Cutting-Edge Technology: Develop innovative
    solutions using the latest advancements in database
    technology.
  - Collaborative Culture: Join a passionate and talented team
    dedicated to building a world-class database service.

  The salary range for this position is $118,000 to $250,000.
  Salary ranges are determined by role, level, and location.
  The range for each posting reflects the minimum and maximum
  range for new hire salaries for the position across all US
  locations. Within the range, individual pay is determined by
  work location and additional factors, including job-related
  skills, experience, and relevant education or training. The
  position is also eligible for equity. We offer benefits,
  which include comprehensive health, dental and vision plans
  for you and your dependents or domestic partner. In
  addition, we provide a 401(k) plan, ample time off programs,
  generous paid parental leave, life insurance, disability
  insurance, a wellness program, flexible spending accounts,
  and a pretax commuter programs.

  If you are a talented engineer with a passion for databases
  and open source, we encourage you to apply and become a
  Software Engineer at VillageSQL!
