description: |
  We are seeking an experienced and highly motivated
  Engineering Manager to join our team. The ideal candidate
  will have a proven track record of leading and managing
  engineering teams in the tech domain. As an Engineering
  Manager, you will play a pivotal role in driving the
  technical direction of our projects and ensuring the
  successful delivery of our products.

  Key Responsibilities:

  - Lead, mentor, and manage a team of skilled engineers to
    achieve project goals and deliver high-quality software
    solutions.
  - Define and execute the technical strategy, architecture, and
    roadmap for the development team.
  - Collaborate with cross-functional teams, including product
    management, design, and quality assurance, to drive
    project success.
  - Champion best practices in software development, ensuring
    code quality, scalability, and maintainability.
  - Foster a culture of innovation, continuous improvement, and
    technical excellence within the engineering team.
  - Provide technical guidance and support to team members,
    assisting in problem-solving and decision-making.
  - Drive the recruitment and onboarding of top engineering
    talent.
  - Monitor project progress, identify risks, and implement
    effective mitigation strategies.
  - Keep abreast of emerging technologies and industry trends to
    ensure the team remains competitive and at the forefront
    of technology.

  Skills & Qualifications:

  - Bachelor's or Master's degree in Computer Science or a
    related field.
  - Should be from technical background.
  - A minimum of 15 years of experience in the tech domain, with
    a strong background in software engineering and
    development.
  - Proven experience in managing and leading engineering teams,
    with a focus on delivering high-impact projects.
  - Strong technical skills and the ability to provide technical
    leadership to the team.
  - Excellent problem-solving and decision-making abilities.
  - Strong communication, collaboration, and leadership skills.
  - Ability to work in a fast-paced, dynamic environment.
  - Familiarity with modern software development methodologies
    and tools.

  Benefits & Perks:

  - Competitive Salary
  - PTO and Paid Holidays
  - Medical PPO or HMO, Dental, and Vision Insurance

  About BrightEdge

  BrightEdge is widely recognized as a global leader in SEO
  and Digital marketing. The most innovative customers across
  more than 80 countries trust BrightEdge to modernize their
  Digital Marketing stack for today’s digital world. We are
  helping thousands of organizations, including many of the
  world’s largest companies, transform their businesses and
  drive more revenue.



  The continuous innovation of our product is supported by
  what we believe to be our most valuable assets: our people.
  Our employees are industry experts at the forefront of
  digital transformation. Come join us and help us share the
  future of SEO.
