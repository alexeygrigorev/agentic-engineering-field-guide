title: Senior Frontend Software Engineer
company: Raydar
location: New York, USA
work_type: FULL_TIME
company_size: 28 Employees
description: |
  About the company

  Our client is a fast-growing financial services company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and refine user-facing web applications and the shared
  component library behind them, working closely with product
  and operations to turn open-ended problems into shipped
  interface work. The role suits an engineer who can take an
  initiative from early scoping through to production with
  little direction.

  What you'll do

  - Build and evolve a shared component system and the frontend
    structure that supports it.

  - Work with product and operations colleagues on feature
    ideas, direction and the user experience.

  - Scope new problems, propose solutions and carry projects
    through to delivery.

  - Recommend and introduce improvements to frontend tooling.

  - Ship user-facing features that make the product easier to
    use for everyone involved.

  Requirements

  What we're looking for

  - Three to six years of hands-on experience shipping
    interfaces that end users interact with directly.

  - Strong hands-on skill with React, with TypeScript preferred
    and JavaScript acceptable.

  - A bachelor's degree in computer science or a related
    engineering field.

  - Experience at an early-stage or growth-stage startup.

  - Clear verbal and written communication with non-technical
    colleagues.

  - Previous frontend engineering at a widely recognised
    technology company known for strong engineering practice.
    Experience only at legacy enterprises, agencies or very
    small startups does not on its own meet this.

  Bonus points

  - Experience with Storybook or component-driven development.

  - Background in fintech or healthtech, such as payments,
    billing or claims systems.

  - Coding bootcamp graduates are welcome, though they are
    expected to have substantially more work experience.

  Benefits

  Compensation and benefits

  - Base salary: USD 160,000 to 225,000 per year

  - Equity

  - Health coverage with the employer covering 90% of medical
    premiums

  - Fully paid parental leave

  - Unlimited paid time off

  - Early-stage equity ownership opportunity

  Location and work model

  - New York, NY, United States or San Francisco, CA, United
    States

  - Hybrid, 3 days in-office, full-time
