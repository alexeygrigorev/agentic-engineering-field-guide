description: |
  This internship is based in London and is available
  throughout the year. Please indicate your preferred start
  month in the application questions.

  The minimum length of the Internship must be 12 weeks. 

  Squarepoint sits at the intersection of finance,
  mathematics, and technology. From petabyte-scale data
  platforms to ultra-low-latency trading systems, we build the
  infrastructure that powers systematic investing across every
  major asset class and market worldwide.

  We are looking for highly motivated students with a deep
  passion for technology and software development to join our
  Software Developer Internship program. As a participant in
  the internship program, you will work closely with
  experienced engineers to develop and deliver custom software
  solutions that solve complex problems. During your time with
  us, you will work in collaboration with your mentors on a
  project that has a visible impact on the business.

  We have internship opportunities across various teams
  including; Data Engineering, Risk, Market Data, Quant
  Development, Frontend and many more...

  Position Overview:

  - A fast-paced training program to give you an introduction to
    all technical facets of software development in the
    algorithmic trading industry

  - The software you build and the projects you work on will be
    leveraged to support active and ongoing trading with the
    markets

  - Independent programming projects in Python or C++

  - Intern social events to let you network with other
    Squarepoint employees and explore the city where you’re
    spending your internship

  Required Qualifications:

  - Pursuing a degree in Computer Science, Computer/Electrical
    Engineering, Mathematics or equivalent

  - Candidates must be in penultimate year of study

  - Knowledge of one or more of the following programming
    languages: Python, C++, Java, Rust, C

  - Knowledge of Unix systems

  - A deep passion for technology

  - Exceptional problem-solving skills and strong communication
    skills
