description: |
  You’re ready to gain the skills and experience needed to
  grow within your role and advance your career — and we have
  the perfect software engineering opportunity for you.

  As a Software Engineer II at JPMorganChase within the Trust
  & Security Team, you are part of an agile team that works to
  enhance, design, and deliver the software components of the
  firm’s state-of-the-art technology products in a secure,
  stable, and scalable way. As an emerging member of a
  software engineering team, you execute software solutions
  through the design, development, and technical
  troubleshooting of multiple components within a technical
  product, application, or system, while gaining the skills
  and experience needed to grow within your role.

  Job responsibilities

  - Executes standard software solutions, design, development,
    and technical troubleshooting
  - Leverages enterprise-authorized AI coding assist tools
    within the work environment to improve code quality,
    delivery speed, and productivity (e.g., code
    generation/refactoring, unit test creation,
    documentation), while validating outputs through peer
    review, automated testing, and secure coding standards.
  - Designs, develops, codes, and troubleshoots with
    consideration of upstream and downstream systems and
    technical implications
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation
  - Applies technical troubleshooting to break down solutions
    and solve technical problems of basic complexity
  - Gathers, analyzes, and draws conclusions from large, diverse
    data sets to identify problems and contribute to decision-
    making in service of secure, stable application
    development
  - Learns and applies system processes, methodologies, and
    skills for the development of secure, stable code and
    systems
  - Adds to team culture of diversity, opportunity, inclusion,
    and respect

  Required qualifications, capabilities, and skills

  - Formal training or certification in software engineering and
    2+ years of relevant experience.
  - Hands-on practical experience in system design, application
    development, testing, and operational stability
  - Experience in developing, debugging, and maintaining code in
    a large corporate environment with one or more modern
    programming languages and database querying languages
  - Hands-on experience using enterprise-authorized AI-assisted
    software development tools within the work environment
    (e.g., for coding, testing, troubleshooting, or
    documentation) with demonstrated ability to critically
    evaluate and validate AI-generated outputs.
  - Understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations.
  - Practical experience with Java, J2EE, Spring Boot, RESTful
    APIs, and microservices
  - Experience with AWS
  - Experience across the whole Software Development Life Cycle
  - Exposure to agile methodologies such as CI/CD, Application
    Resiliency, and Security

  Preferred qualifications, capabilities, and skills

  - Familiarity with modern front-end technologies
  - Experience with event-driven architecture

  About Us

  Chase is a leading financial services firm, helping nearly
  half of America’s households and small businesses achieve
  their financial goals through a broad range of financial
  products. Our mission is to create engaged, lifelong
  relationships and put our customers at the heart of
  everything we do. We also help small businesses, nonprofits
  and cities grow, delivering solutions to solve all their
  financial needs.

  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions.  We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.

