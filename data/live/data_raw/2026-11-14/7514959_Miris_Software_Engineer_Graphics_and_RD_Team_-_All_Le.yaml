description: |
  Building something ambitious requires focus, resilience, and
  a willingness to take on challenging work. At Miris, we
  believe that this work can be deeply meaningful when it is
  supported by a strong team, a clear sense of purpose, and a
  shared commitment to achieving important outcomes. We are
  looking for people who are energized by complex problems and
  the opportunity to make a meaningful impact.

  The Opportunity:

  Miris is seeking skilled Software Engineers to join our
  fully remote Graphics team. You will drive innovation in our
  immersive streaming platform by implementing and
  productionizing cutting-edge graphics and spatial computing
  research. The core of this role is creating custom radiance
  fields and rendering them in real-time on a wide variety of
  platforms. This hands-on role involves implementing
  research, pushing new techniques, and scaling them for real-
  world customer applications. You will collaborate with other
  research and rendering engineers to integrate the best ideas
  into the product.

  As a remote-first company with a globally distributed team,
  we value thoughtful collaboration, accountability, and
  trust. We also believe that every candidate should have an
  ownership mindset and the opportunity to share in the
  success they help create, which is why stock options are a
  significant portion of this role's compensation package.

  What You'll Do:

  - Build and productionize advanced techniques from graphics
    and computer vision research (e.g., Gaussian Splatting,
    radiance fields, compression, streaming).
  - Deliver efficient, optimized code across the rendering
    pipeline and wring out performance from desktop, mobile
    and VR hardware.
  - Collaborate with researchers, engineers, and cloud/content
    teams to design end-to-end streaming and rendering
    solutions.
  - Stay current with industry and academic advances, moving
    ideas quickly from concept to real-world deployment.
  - Contribute to scalable systems and our SDK, helping
    customers integrate our technology into their apps.

  What You'll Bring:

  - Strong technical skills, with proven experience delivering
    production-quality code in C++, Python related to 3d
    graphics and rendering
  - Demonstrated ability to implement research techniques or
    complex algorithms in real-world systems.
  - Ambition to succeed and make decisions that influence the
    outcomes of a startup in this crucial early period.
  - Collaborative mindset and ability to thrive in a remote
    startup environment, with ambitious R&D goals

  Target Base Salary Range

  $89,155—$287,488 USD

  About Us:

  Miris is a cutting-edge technology company building the
  future of 3D content delivery at global scale. Our mission
  is to empower creators and developers to deliver high-
  fidelity, photorealistic 3D experiences to billions of users
  instantly, seamlessly, and across all major platforms and
  devices. Backed by patented innovations, Miris leverages
  state-of-the-art advancements in neural rendering, including
  radiance fields, Gaussian splatting, and new AI-assisted
  graphics approaches. Our platform unlocks the ability to
  deliver complex digital scenes, anywhere and anytime,
  without making compromises on speed, cost, and scale.

  Compensation:

  At Miris, our compensation philosophy is designed to
  attract, motivate, and retain top talent. We offer fair pay
  that reflects the value of each role within our organization
  and the broader market. We believe that every employee who
  brings impact should share in our success with equity
  options as a key component of our compensation package. Base
  salary is influenced by several factors, including the
  scope, complexity, and responsibilities of the role,
  internal equity across similar roles, external market
  benchmarks for comparable positions, and the candidate’s
  job-related knowledge, skills, and experience.

  Benefits:

  - Comprehensive benefits including Medical, Dental, and Vision
  - Flexible Spending Account for medical and dependent expenses
  - Flexible working hours
  - Generous PTO Program
  - 401K plan
  - Technology stipend
  - Wellness stipend
  - Equity options

  Globally, benefits may vary depending on a candidate's
  location
