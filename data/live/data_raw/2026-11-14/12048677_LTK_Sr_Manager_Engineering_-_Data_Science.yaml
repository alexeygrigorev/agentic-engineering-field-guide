  About LTK

  Founded in 2011, LTK is the global technology platform
  purpose-built to empower lifestyle creators to monetize
  their content. The full-service platform connects brands,
  creators, and shoppers with a world-class shopping app and
  trusted tools and technology that make content instantly
  shoppable. Today, premium lifestyle creators in 160+
  countries drive more than $5 billion+ in annual retail sales
  through their LTK Shop profiles. More than 40 million
  consumers turn to LTK Shops in the LTK shopping platform
  each month to find inspiration and instantly shop the styles
  recommended by their favorite creators. More than 8,000
  retailers and 1M brands partner with LTK to gain access to
  its global creator network for content that converts against
  performance-driven, cross-channel KPIs. LTK is headquartered
  in Dallas, TX, and currently operates on five continents.

