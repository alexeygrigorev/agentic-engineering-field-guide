description: |
  🚀 We’re on a mission to make money work for everyone.

  We’re waving goodbye to the complicated and confusing ways
  of traditional banking.

  After starting as a prepaid card, our product offering has
  grown a lot in the last 10 years in the UK. As well as
  personal and business bank accounts, we offer joint
  accounts, accounts for 16-17 year olds, a free kids account
  and credit cards in the UK, with more exciting things to
  come beyond. Our UK customers can also save, invest and
  combine their pensions with us.

  With our hot coral cards and get-paid-early feature,
  combined with financial education on social media and our
  award winning customer service, we have a long history of
  creating magical moments for our customers!

  We’re not about selling products - we want to solve problems
  and change lives through Monzo ❤️

  Analytics Engineering Manager - Fincrime

  London/Cardiff/UK Remote | 💰£97,800-£125,000 + Incentive
  Awards tied to your performance and benefits | Hear from the
  team ✨

  ⭐Our Fincrime Analytics Engineering Team

  Our Financial Crime Collective helps keep Monzo and our
  customers safe. We build effective, proportionate controls
  to protect against financial crime while delivering great
  customer outcomes.

  Our Analytics Engineering discipline works in the
  intersection between data, engineering and our collectives -
  Core, Money, Borrowing, Operations and Financial Crime and
  beyond.

  The AE teams are responsible for building downstream data
  models from backend services with the desire to make our
  Data Warehouse a genuine competitive advantage for Monzo. We
  want a discipline capable of building a reliable and
  scalable Data Warehouse to support decision making in a cost
  effective and performant manner.

  Managers within Data have two primary responsibilities;
  people and technical products. Your focus will be on helping
  engineers with their personal and professional development,
  listening and guiding them through hard times and
  celebrating their successes. You will also be leading and
  participating directly in technical initiatives and helping
  Monzo shape its Data organisation, ensuring the team focuses
  on valuable work, shipping things with a level of care and
  attention to detail.

  There will be a strong focus on delivering best practice
  across our data discipline and helping bring a new level of
  maturity around Data Governance principles, working in
  collaboration with others to deliver this.

  🔑You’ll play a key role by...

  Working in a multi-disciplinary team, you will:

  - Be a hands-on leader in building a discipline of exceptional
    analytics engineers working to make Data at Monzo the gold
    standard within the industry
  - Nurture between 5 to 6 analytics engineers, supporting,
    coaching and developing high performing engineers through
    regular 1:1s, continuous feedback and relationships with
    others
  - Aid prioritisation of initiatives and projects, working
    closely with other leads for each of our Monzo collectives
  - Be hands on through participating in the review cycle,
    architecture and design leadership and development of your
    own changes to the pipelines
  - Be part of the hiring team within Analytics Engineering
  - Work closely with other leads to deliver a scalable,
    consistent approach to governance and best practices
  - Drive effective project management of central Analytics
    Engineering projects, ensuring they’re well scoped and
    delivered to deadlines
  - Establish yourself as a trusted partner to various
    collectives and the leadership team, with the capacity for
    getting things done, be it either hands-on or by leading
    others
  - We all own and support the pipelines we contribute to, and
    on call support out of hours will be expected from time to
    time as part of this role

  🤩We’d love to hear from you if…

  You have experience managing or mentoring the performance
  and development of high-performing engineers.

  - You have strong experience in data warehousing architecture
    at scale
  - You have experience and a passion for leading data
    warehousing, data visualisation, big data or ETL projects
    as an analyst, developer, designer or architect
  - You know what it takes to hire great engineers within the
    data space
  - You’re equally comfortable working hands on and leading a
    team

  Nice To Haves:

  - Any experience working within a finance or banking
    environment
  - Experience working in a highly regulated environment (e.g.
    finance, insurance, gaming, food, health care)
  - Experience with any of our stack of dbt, BigQuery and Looker

  Not ticking every box? That’s totally okay! Studies show
  that women and people of colour might hesitate to apply
  unless they meet every single requirement. At Monzo, we’re
  dedicated to creating a diverse and welcoming team. If
  you’re passionate about this role and keen to learn and grow
  with us, we encourage you to apply— even if you don’t have
  everything that’s listed just yet. Drop us your application,
  we’d love to hear from you!

  🙌What’s in it for you

  💰£97,800-£125,000 + Incentive Awards tied to your
  performance and benefits

  ✈️ We’ll help you relocate to the UK.

  ✅ We can sponsor your visa.

  📍This role can be based in our London office, but we're open
  to distributed working within the UK (with ad hoc meetings
  in London)

  ⏰We offer flexible working hours and trust you to work
  enough hours to do your job well, and at times that suit you
  and your team.

  📚£1,000 learning budget each year to use on books, training
  courses and conferences.

  🏡We will set you up to work from home; all employees are
  given Macbooks and for fully remote workers we will provide
  extra support for your work-from-home setup.

  ➕ Plus lots more! Read our full list of benefits.

  🌈 The application journey has 4 key steps

  - Recruiter Screening Call
  - Initial Call
  - Take Home Task
  - Final Loop (3 sessions - case study, collaboration and
    people  leadership)

  This process should take around 2-3 weeks - your schedule is
  really important to us, so we promise to be as flexible as
  possible!

  We have some guidelines on using Artificial Intelligence
  (AI) to ace an application and interview at Monzo. You can
  read them here.

  For more insight into the AE team at Monzo, check out our
  podcast with John Azzopardi one of our Senior Leaders in AE

  #LI-AS1 #LI-REMOTE

