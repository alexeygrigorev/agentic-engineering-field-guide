description: |
  Do you want to be part of the core team building truly AI-
  native helpful experiences across the consumer space? Do you
  want to be at the cutting edge of what is next in the AI
  space but apply it to something of true value in the real
  world?

  At Verneek, we are on a mission to build the most helpful AI
  that augments the knowledge of anyone, anywhere, at any
  time! As opposed to the mainstream, we believe that the way
  to bring domain-general AI to the masses is to apply it one
  domain at a time, through AIs with deep domain expertise. We
  were on this journey before it got the hottest thing on the
  face of the planet! Come join some OGs in this so-called
  "generative AI" space and invent what is yet to be the
  future!

  If you are craving to learn something new every day while
  working at the cutting edge of AI, Verneek could be a
  perfect opportunity for you: a deep-tech AI startup, where
  you'd get to learn, innovate, and leave your mark every
  single hour of every day.

  We are looking for a stellar & highly ambitious Software
  Engineer specializing in Go as a core employee to help build
  robust backend systems supporting the Verneek AI platform!
  You'll get to work on complex AI research problems, but all
  grounded on our proprietary AI platform. It is all much more
  rewarding and influential than working on beating AI
  benchmarks! :)

  Every day, you'll get to solve unique, highly complex, and
  socially impactful problems. This is an early-stage startup,
  so we'll be moving super-fast and there will be no legacy
  obstacles on your way to make a significant impact. Whatever
  you do every hour of every day counts!!

  Responsibilities

  - Design, implement, and maintain scalable backend services
    and APIs using Go
  - Collaborate with cross-functional teams to define system
    architecture and integration strategies
  - Troubleshoot and optimize existing backend systems for
    performance and reliability
  - Write clean, maintainable, and well-documented code with a
    strong emphasis on testing
  - Ensure system security, data protection, and adherence to
    compliance standards
  - Participate in code reviews and contribute to team knowledge
    sharing

  Requirements

  - Bachelor's degree in Computer Science or a related field
  - 3+ years of professional experience in developing backend
    systems using Go
  - Strong understanding of microservices architecture and
    RESTful API design
  - Experience with cloud services (AWS, Google Cloud, or Azure)
  - Familiarity with containerization technologies such as
    Docker and Kubernetes
  - Ability to work in an agile environment with rapid iteration
    cycles
  - Excellent problem-solving skills and a proactive approach to
    challenges

  Benefits

  Stellar medical, dental, vision, disability, and life
  insurance

  Daily private Chef lunch, curated to personal diets

  Transportation Benefits

  401K matching contributions Flexible PTO

  Visa/Green Card Sponsorship Career growth support through
  sponsoring learning opportunities and mentorship

  About Verneek

  Verneek is an early-stage deep-tech AI startup, based in the
  NYC area, founded by a team of leading AI research
  scientists and backed by a group of world-renowned business
  and scientific luminaries. Our mission is to build the most
  helpful AI for anyone, anywhere, at anytime. We are obsessed
  with what we do and we have fun doing it. Read more about
  verneek here: https://www.verneek.com/about-verneek and make
  sure to watch all our introductory videos and yearly recaps
  here: https://www.verneek.com/culture.

  Verneek Culture

  It’s often hard to put “culture” into words, perhaps you can
  get a visual sense of our culture here:
  https://www.verneek.com/culture. We all obsessively love
  what we do, care about each other, share all sorts of meals
  together, celebrate all kinds of events together, and work
  tirelessly with the excitement of making a difference
  through AI innovation. We are enjoying the journey, and
  going through all the ups and downs together.

  Although we have come a very long way in setting the
  foundations of our unique company, but we still have ways to
  go and you can help shape our culture! The core Verneek team
  plays a crucial role in further shaping the culture of the
  company moving forward. We are looking for highly ambitious
  and tremendously driven individuals who can take the lead in
  driving various aspects of the company, and help us shape
  its lasting impact.
