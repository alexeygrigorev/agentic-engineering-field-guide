description: |
  Company Intro:

  Our world is immersive and visceral. Content today is static
  and boring. We are Momenti, video that you interact with,
  bringing visceral experiences to all content. Build deeper
  connections and emotions with multi-dimensional video, and
  bring life to content by breaking the 4th wall. Join the
  content revolution! The world is alive, and so should your
  captured moments. Momenti is here.

  Job Summary:

  We are looking out for a Flutter Developer who will be
  running and designing product application features across
  various cross-platform devices. Just like Lego boxes that
  fit on top of one another, we are looking out for someone
  who has experience using Flutter widgets that can be plugged
  together, customized and deployed anywhere. Someone who is
  passionate about code writing, solving technical errors and
  taking up full ownership of app development.

  Key Responsibilities:

  • You will be building and shipping robust apps to Android/
  iOS devices using a single

  codebase.

  • You will be writing readable and clear code using Dart
  that will be extensively documented

  for future use and upgrades.

  • You will be sharing feedback and brainstorming ideas with
  teams to improve the

  development process.

  • Understand basic concepts of design for developing user-
  friendly applications.

  • Stay up to date with the latest technologies.

  Preferred Qualifications:

  • Experience with handling traditional media like photos or
  movies

  • Expert knowledge of object-oriented programming, design
  patterns, and mobile application

  development

  • Experience with hybrid mobile development frameworks such
  as React Native, Ionic, etc.

  Basic Qualification:

  • Bachelor's degree in Computer Science, Software
  Engineering, or a related field

  • 5+ years overall experience (3+ in iOS/Android/Web)

  • Fluent in flutter or positive attitude about learning it

  • Deep understanding of Frontend frameworks (not just using
  the libraries)

  • Willingness to learn and devote in facing challenges in a
  start-up environment

  • Good understanding of mobile device hardware capabilities
  and limitations

  • Strong communication and problem-solving skills

  • Ability to work independently and in a team environment

  • Ability to work in a fast-paced environment and meet tight
  deadlines

  • Ability to write robust, maintainable and reliable code

  Note: primary candidates only, no agencies, placement firms,
  or recruiters please
