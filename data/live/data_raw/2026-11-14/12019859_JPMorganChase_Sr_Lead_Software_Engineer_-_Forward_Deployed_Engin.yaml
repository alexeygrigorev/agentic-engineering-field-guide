description: |
  As a Senior Lead Software Engineer at JPMorganChase within
  the Payments and Global Banking, Commercial & Industrial
  Lending division, you are an integral part of an agile team
  that works to enhance, build, and deliver trusted market-
  leading technology products in a secure, stable, and
  scalable way. Drive significant business impact through your
  capabilities and contributions, and apply deep technical
  expertise and problem-solving methodologies to tackle a
  diverse array of challenges that span multiple technologies
  and applications.

  Job Responsibilities

  - Regularly provides technical guidance and direction to
    support the business and its technical teams, contractors,
    and vendors
  - Develops secure and high-quality production code, and
    reviews and debugs code written by others
  - Drives adoption and governance of approved AI-assisted
    engineering practices across teams to improve code
    quality, delivery speed, and operational outcomes (e.g.,
    AI-assisted code review/refactoring, test acceleration,
    release readiness, incident/root-cause analysis), while
    establishing measurable validation standards (secure
    coding, peer review, automated testing) and promoting
    reuse of proven patterns and automation within the
    SDLC/TLM toolchain.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including approved AI-assisted
    development and automation capabilities, to improve the
    value realized by automation at scale.
  - Drives decisions that influence the product design,
    application functionality, and technical operations and
    processes
  - Serves as a function-wide subject matter expert in one or
    more areas of focus
  - Actively contributes to the engineering community as an
    advocate of firmwide frameworks, tools, and practices of
    the Software Development Life Cycle

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Advanced in one or more programming language(s)
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment (e.g., for coding, code review, test
    acceleration, troubleshooting) with the ability to set
    team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers/leads on compliant usage patterns and
    controls.
  - Ability to tackle design and functionality problems
    independently with little to no oversight Practical cloud
    native experience

  Preferred qualifications, capabilities, and skills

  - Background in Data Science, Machine Learning, Statistics,
    Mathematics, Operations Research, or related field.
  - Strong interpersonal and communication skills, with the
    ability to partner effectively with bankers and translate
    complex technical concepts into compelling business
    narratives
  - Demonstrated storytelling and presentation skills, with
    experience communicating insights to both technical and
    non-technical audiences
  - Genuine curiosity and enthusiasm for AI and emerging
    technologies, including hands-on experience with
    generative AI tools and prompt engineering
  - Comfort leveraging AI-assisted development approaches,
    including rapid prototyping, AI-enabled coding workflows,
    and experimentation with new technologies

  About Us



    JPMorganChase, one of the oldest financial institutions,
  offers innovative financial solutions to millions of
  consumers, small businesses and many of the world’s most
  prominent corporate, institutional and government clients
  under the J.P. Morgan and Chase brands. Our history spans
  over 200 years and today we are a leader in investment
  banking, consumer and small business banking, commercial
  banking, financial transaction processing and asset
  management.




  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions. We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.





  We recognize that our people are our strength and the
