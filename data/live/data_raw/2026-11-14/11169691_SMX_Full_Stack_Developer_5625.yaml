description: |
  SMX is seeking a Full Stack Developer to design, develop,
  and maintain scalable web applications and cloud-native
  solutions. Under general supervision, you will perform code
  development tasks, develop APIs, and utilize open-source
  platforms and tools within an Agile methodology. The ideal
  candidate is passionate about staying current with new
  technologies and has experience working in a team
  environment to deliver high-quality software solutions.

  Essential Duties & Responsibilities:

  - Perform code development tasks using Java and the Angular
    framework, following established code quality standards.
  - Develop applications within a containerized environment
    using Docker.
  - Build and maintain backend services, APIs, and integrations
    with tools such as Kafka, Cognito, and Temporal.
  - Work with teams implementing applications in a Java stack,
    potentially with an Oracle database.
  - Utilize DevSecOps pipelines for continuous integration and
    delivery.
  - Collaborate with engineers, product owners, and stakeholders
    to deliver scalable and secure solutions.

  Required Skills & Experience

  - Bachelor's degree in information systems, computer science,
    or another related field.
  - 3 years of professional experience in full-stack software
    development.
  - Active Top Secret security clearance.
  - Experience in Java development and the Angular framework.
  - Proficiency with application containerization using Docker.
  - Familiarity with tools such as Kafka, Cognito, Temporal, and
    USGIS libraries.
  - Ability to work effectively as part of a team and multi-task
    in a dynamic environment.
  - Excellent written and verbal communication, interpersonal,
    and presentation skills.
  - AWS certification and Security+ Certification

  Desired Skills & Experience

  - Experience with Amazon Bedrock or other enterprise
    generative AI platforms
  - Experience implementing RAG architectures, AI agents, or
    orchestration frameworks
  - Familiarity with vector databases, embeddings, and AI
    evaluation techniques
  - Experience optimizing AI model usage for performance and
    cost efficiency
  - Familiarity with containerization and orchestration
    technologies
  - Experience supporting federal or DoD environments

  The SMX salary determination process takes into account a
  number of factors, including but not limited to, geographic
  location, Federal Government contract labor categories,
  relevant prior work experience, specific skills, education
  and certifications. At SMX, one of our Core Values is to
  Invest in Our People so we offer a competitive mix of
  compensation, learning & development opportunities, and
  benefits. Some key components of our robust benefits include
  health insurance, paid leave, and retirement.

  The proposed salary for this position is:

  $95,500—$159,100 USD

  At SMX®, we are a team of technical and domain experts
  dedicated to enabling your mission. From priority national
  security initiatives for the DoD to highly assured and
  compliant solutions for healthcare, we understand that
  digital transformation is key to your future success.

  We share your vision for the future and strive to accelerate
  your impact on the world. We bring both cutting edge
  technology and an expansive view of what’s possible to every
  engagement. Our delivery model and unique approaches harness
  our deep technical and domain knowledge, providing forward-
  looking insights and practical solutions to power secure
  mission acceleration.

  SMX is an Equal Opportunity employer including disabilities
  and veterans.

