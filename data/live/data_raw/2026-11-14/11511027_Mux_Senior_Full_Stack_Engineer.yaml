description: |
  About Mux

  Mux is video for developers and their agents. We handle the
  hard problems of video, like encoding, streaming, delivery,
  and monitoring, along with the hard problem of understanding
  it: turning raw footage into context, structure, and
  answers. Video is a huge part of people’s lives, and we want
  to help make it not just playable, but understandable.

  We’re committed to building a healthy team that welcomes a
  diverse range of backgrounds and experiences. We want people
  who care about our mission, are ready to grow, believe in
  our values (from Be Human to Turn Customers Into Fans), and
  want to make the people around them better.

  You’ll be joining a tight-knit team with experience at
  places like Google, YouTube, Twitch, Zencoder, Fastly, and
  more. Our founders previously started (and sold) Zencoder,
  an early leader in cloud video technology, and authored
  Video.js, the biggest HTML5 video player on the web. We
  organize Demuxed, the premiere conference for video
  engineers in the world.

  We’re backed by top investors like Coatue, Accel, Andreessen
  Horowitz, and Y Combinator. You’ll get to work with amazing
  companies: hundreds of startups, plus Patreon, Substack,
  Synthesia, and HubSpot. Customers large and small love
  working with us and love our team.

  We are building something big together. We’d love to hear
  from you!

  About the Role

  As a Senior Full Stack Engineer at Mux, you will build and
  manage scalable and highly available applications and
  services that can reliably support our products' feature
  development and growing traffic. The Platform Experience
  team is focused on providing a consistent, effective
  platform experience for customers. You will work on ensuring
  our customer-facing platform is resilient and will also be
  writing new application code to support product features.
  We’re looking for engineers that love both systems and
  application-level challenges across various teams, who will
  take on strong ownership of critical product infrastructure,
  and enjoy being part of an inclusive and creative
  Engineering team.

  What You'll Do

  - Work with your team to collaborate and execute on product
    goals and technical roadmap.
  - Develop user-facing, product-focused features in our Elixir
    and Go backend services and our React frontend.
  - Building and scaling our billing and usage platform that
    supports all Mux products.
  - Working on identity and account management product features.
  - Working on distributed notifications such as application
    webhooks and alerting features.

  Who You Are

  - We are hiring senior level software engineers (6+ years of
    experience).
  - You’re a strong engineer comfortable working across multiple
    platforms and environments.
  - Solid engineering fundamentals (CS degree a plus).
  - Track record of working on hard problems including job
    scheduling, concurrency, and scaling.
  - Experience in JavaScript/TypeScript and React.
  - Experience building REST APIs that people enjoy using.
    Elixir experience is a big plus, but Go, Python, Ruby,
    Node, or other general-purpose programming languages are
    also great.
  - Experience deploying complex applications on cloud platforms
    using a container orchestration platform, such as
    Kubernetes.
  - Experience working with SQL databases. ClickHouse experience
    is a plus.
  - You enjoy fast-paced, highly collaborative environments and
    working across many different areas.
  - Video experience is a plus but not required.

  We have a supportive culture that cares about both excellent
  work and work-life balance. We have office spaces in
  Downtown San Francisco, New York City, and London

  U.S. Benefits

  - Flexible vacation + 11 company holidays
  - Weekly no-meeting days + quarterly focus weeks
  - Competitive health, dental, and vision insurance, including
    fertility
  - FSA and HSA available
  - Short-term and long-term disability insurance
  - Group life insurance
  - Travel accident insurance
  - 401(k)
  - Paid parental leave
  - Professional Development program
  - Lunch, internet, & ancillary equipment reimbursements

  UK Benefits

  - Competitive annual leave policy (25 days annual leave plus 8
    public holidays)
  - Weekly no-meeting days + quarterly focus weeks
  - Private medical and dental insurance, and a vision stipend,
    including fertility
  - Short-term and long-term disability insurance
  - Group life assurance
  - Travel accident insurance
  - Matched Pension
  - Paid parental leave
  - Professional development program
  - Team social events
