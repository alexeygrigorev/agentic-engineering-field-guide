title: Regional Manager, Sales Engineering - Key Accounts (East)
company: Datadog
location: New York, USA
remote: true
work_type: FULL_TIME
company_size: 6,500 Employees
description: |
  As a Regional Manager, Sales Engineering, you will lead a
  team of Sales Engineers and frontline leaders, driving
  technical execution, operational excellence, and team
  development across your region.

  You’ll act as a force multiplier by owning team performance,
  shaping execution standards, and partnering closely with
  Sales leadership to influence strategy, improve outcomes,
  and scale impact beyond individual deals.

  What You’ll Do:

  - Lead, coach, and develop a team of Sales Engineers, driving
    performance, engagement, and long-term career growth
    through regular feedback and structured development
  - Partner confidently with senior Sales leadership on regional
    strategy, multi-quarter planning, annual capacity
    planning, and forecast alignment operating 2-3 quarters
    ahead to anticipate resourcing needs and business
    priorities
  - Own in-field execution at a regional level by taking an
    executive presence role in strategic and high-impact
    opportunities and providing senior-level stakeholder
    alignment and technical credibility alongside your team
  - Oversee consistent, high-quality delivery across technical
    sales cycles in the region, including evaluations,
    customer engagements, and deal progression

  - Hire and onboard top talent across ICs and manager-level
    roles, building a high-performing team and accelerating
    ramp through structured onboarding and enablement
  - Manage regional operations including resource allocation,
    utilization, KPI tracking, productivity, and skills
    development to ensure effective coverage across the
    territory
  - c cross-functionally with Sales, Product, Marketing,
    Enablement, and Support at a senior level to align on
    regional strategy, GTM execution, and customer experience
  - Drive operational excellence across the region by improving
    processes, maintaining data quality, scaling evaluation
    frameworks, and contributing to initiatives that improve
    team effectiveness and business impact

  Who You Are:

  - 3+ years of experience leading Sales Engineers and/or
    frontline leaders in a customer-facing technical
    organization with proven ability to manage team
    performance, develop team members, and scale high-
    performing teams
  - 7+ years of experience in Sales Engineering, Solutions
    Engineering, or a technical customer-facing role
  - Proven ability to partner with senior Sales leadership on
    regional strategy, long-range planning, and forecast
    alignment as a strategic peer
  - Ability to operate at both strategic and operational levels,
    balancing multi-quarter planning with day to day team
    execution and priorities
  - Strong cross-functional collaborator with the ability to
    influence across teams and at senior levels
  - Background in public cloud (AWS, Azure, GCP), Kubernetes,
    APM/tracing, security, developer experience, observability
  - Demonstrated capability of utilizing AI tooling and scaling
    it
  - Growth mindset of embracing change and being curious
  - Willingness to travel as needed to support customer
    engagements

  Datadog values people from all walks of life. We understand
  not everyone will meet all the above qualifications on day
  one. That's okay. If you’re passionate about technology and
  want to grow your skills, we encourage you to apply.

   Benefits and Growth:

  - Best-in-breed onboarding
  - Generous global benefits
  - Intra-departmental mentor and buddy program for in-house
    networking
  - New hire stock equity (RSUs) and employee stock purchase
    plan (ESPP)
  - Continuous professional development, product training, and
    career pathing
  - An inclusive company culture, able to join our Community
    Guilds and Inclusion Talks

  Benefits and Growth listed above may vary based on the
  country of your employment and the nature of your employment
  with Datadog.

  Datadog offers a competitive salary and equity package, and
  may include variable compensation. Actual compensation is
  based on factors such as the candidate's skills,
  qualifications, and experience. In addition, Datadog offers
  a wide range of best in class, comprehensive and inclusive
  employee benefits for this role including healthcare,
  dental, parental planning, and mental health benefits, a
  401(k) plan and match, paid time off, fitness
  reimbursements, and a discounted employee stock purchase
  plan.

  The reasonably estimated yearly salary for this role at
  Datadog is:

  $150,000—$200,000 USD

  About Datadog:

  Datadog is the leading observability and security platform
  for the AI era, providing businesses with unified visibility
  across the technology stack to manage complexity at scale.
  It brings applications, infrastructure, data, models, and
  security into one place, using AI to detect and resolve
  issues before they impact customers. Trusted globally by
  Fortune 500 companies and high-growth AI leaders, Datadog
  enables businesses to move faster with clarity and
  confidence. Learn more about #DatadogLife on Instagram,
  LinkedIn, and Datadog Learning Center.

