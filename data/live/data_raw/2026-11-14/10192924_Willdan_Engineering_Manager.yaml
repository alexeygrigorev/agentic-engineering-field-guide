description: |
  Willdan Lighting & Electric, a division of Willdan Group
  Inc., has an opening for an Engineering Lead. This role is
  responsible for managing the day-to-day operations of the
  Engineering team to ensure projects move through the
  engineering process efficiently and without unnecessary
  delays. They will oversee engineer workload, project
  assignments, review timelines, and contractor follow-up to
  ensure engineering activities support overall program
  delivery.

  The Engineering Lead also serves as the operational leader
  for the engineering team by proactively identifying
  bottlenecks, resolving project issues, driving
  accountability, and ensuring engineering reviews are
  completed accurately and on schedule.

  Essential Duties and Responsibilities

  - Team Leadership
    - Lead and supervise the Engineering team.
    - Assign projects to engineers based on workload, expertise,
      and program priorities.
    - Balance engineering workload to maximize efficiency and
      productivity.
    - Monitor engineer performance and provide coaching and
      guidance.
    - Conduct regular team meetings to review priorities,
      workloads, and project status.
  - Engineering Operations
    - Ensure engineering reviews are completed within established
      timelines.
    - Monitor engineering queues and aging reports daily.
    - Reassign work as needed to maintain service level
      agreements.
    - Identify projects at risk of delay and take immediate action
      to resolve issues.
    - Maintain visibility into all projects currently under
      engineering review.
  - Project Coordination
    - Track projects that are on hold due to contractor actions or
      missing information.
    - Proactively communicate with Account Managers, Project
      Managers, and contractors to obtain outstanding
      documentation or resolve technical issues.
    - Escalate unresolved issues promptly to program leadership
      when necessary.
    - Ensure projects do not remain idle due to lack of follow-up.
  - Process Management
    - Develop and implement standardized engineering workflows and
      procedures.
    - Continuously identify opportunities to improve engineering
      efficiency and turnaround times.
    - Monitor workflow metrics and recommend process improvements.
    - Eliminate bottlenecks that impact program delivery.
  - Quality & Compliance
    - Ensure engineering reviews comply with program requirements,
      technical standards, and utility guidelines.
    - Review engineering quality metrics and implement corrective
      actions where needed.
    - Support QA/QC activities and continuous quality improvement
      initiatives.
  - Report & Performance Management
    - Monitor engineering KPIs, including:
      - Project aging
      - Review turnaround times
      - Engineering workload
      - Projects on hold
      - Engineer productivity
    - Prepare weekly engineering status reports for program
      leadership.
    - Forecast engineering resource needs based on project
      pipeline.

  Job Requirements / Qualifications

  - Bachelor's degree in mechanical engineering, Electrical
    Engineering, Energy Engineering, Architectural
    Engineering, or a related discipline.
  - Minimum of 8 years of experience in energy efficiency,
    engineering consulting, or utility program implementation.
  - Minimum of 3 years of experience leading or supervising
    engineering teams.
  - Strong knowledge of multifamily building systems and energy
    efficiency measures.
  - Experience reviewing technical calculations and energy
    savings methodologies.
  - Excellent leadership, communication, and organizational
    skills.
  - Strong leadership and accountability.
  - Excellent organizational skills.
  - Ability to prioritize competing demands.
  - Process improvement mindset.
  - Effective communication with contractors and internal teams.
  - Data-driven decision making.
  - Strong sense of urgency.
  - Collaborative leadership style.
  - Preferred:
    - Professional Engineer (PE) license.
    - Certified Energy Manager (CEM) certification.
    - Experience with utility-sponsored energy efficiency
      programs.
    - Familiarity with New York State energy efficiency programs
      and Technical Resource Manuals (TRMs).
    - Experience with energy modeling software and building
      performance analysis.

