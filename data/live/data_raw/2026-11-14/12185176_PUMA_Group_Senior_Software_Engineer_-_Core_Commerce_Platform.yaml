  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Core Commerce Platform organisation
  responsible for delivering the omnichannel commerce
  capabilities that power the purchase journey, inventory
  availability, delivery promise, order processing &
  fulfilment and post-purchase experiences across channels.
  The organisation plays a critical role in ensuring products
  are available to buy, orders can be fulfilled reliably, and
  commitments made to consumers are delivered consistently.
  Through a portfolio of commerce platform capabilities, the
  organisation enables seamless omnichannel experiences while
  supporting efficient, scalable, and resilient commerce
  operations across the global digital ecosystem.

  As a Senior Software Engineer, you will design, build, and
  maintain production-grade backend services and omni-channel
  capabilities that power Basket, Cart, Pricing, Promotions,
  and Checkout experiences across digital commerce channels.
  You will work closely with Tech Leads, Product Owners,
  merchandising teams, and cross-functional engineering teams
  to deliver scalable, resilient, and low-latency commerce
  solutions that enable seamless customer shopping and
  checkout journeys.

  What you will do:

  - Design, develop, and maintain scalable services supporting
    Basket Management, Cart Operations, Pricing, Promotions,
    and Checkout capabilities.
  - Build and enhance API-first, event-driven, and SFCC-
    integrated solutions that enable seamless cart
    experiences, real-time pricing, promotion qualification,
    inventory validation, and checkout orchestration.
  - Support the delivery of seamless customer shopping
    experience and purchase experience by ensuring basket,
    cart, pricing, and checkout workflows operate consistently
    across channels, devices, and regions.
  - Integrate SFCC basket and checkout services with OMS,
    Commerce Platforms, ERP, inventory, customer, product, and
    fulfillment systems to enable seamless end-to-end commerce
    experiences.
  - Collaborate with Tech Leads and Product teams to deliver
    roadmap commitments.
  - Drive technical design discussions and contribute to
    architecture decisions within the team.
  - Ensure applications and services are production-ready
    through effective observability, monitoring, performance
    optimization, reliability engineering, and operational
    readiness practices.
  - Mentor junior engineers, perform code reviews, and help
    establish engineering standards and best practices.
  - Utilize AI-assisted engineering tools to accelerate
    development and strengthen code quality.

  YOUR TALENT

  - 7+ years of software engineering experience, with a strong
    track record of building and operating scalable, highly
    available, customer-facing digital commerce platforms.
  - Strong understanding of design patterns, data structures and
    algorithms, with practical experience applying them to
    real-world use cases.
  - Expertise in backend engineering, API design, microservices,
    event-driven architectures, and scalable integration
    patterns using Java, Spring Boot and related frameworks.
  - Working knowledge of React and modern frontend development
    practices sufficient to contribute to customer-facing
    applications.
  - Experience with observability, reliability engineering and
    performance optimisation.

  ·       Experience designing and implementing guest
  checkout, authenticated checkout, saved baskets, cart merge,
  multi-shipment, Click & Collect, and other omni-channel
  checkout journeys.

  ·       Experience designing and building high-throughput,
  low-latency services supporting basket operations, pricing,
  promotions, inventory validation, shipping selection, and
  checkout orchestration.

  ·       Experience designing graceful degradation and
  fallback mechanisms that help sustain basket and checkout
  journeys during downstream service disruptions.

  ·       Strong ability to mentor engineers, review
  integration designs, conduct code reviews, and drive sound
  technical decisions and engineering standards.

  ·       Experience using coding agents, LLMs, or AI-assisted
  engineering tools to improve software delivery, testing,
  code quality, and developer productivity.

  ·       Hands-on experience in building basket and checkout
  capabilities in SFCC is preferred.

