description: |
  Magna Legal Services is a trusted nationwide partner to law
  firms, corporations, insurance carriers, and government
  agencies, delivering comprehensive legal support at every
  stage of a case. From court reporting and record retrieval
  to jury consulting, investigations, litigation graphics, and
  language services, we help our clients navigate complex
  legal challenges with confidence. Our reputation is built on
  the expertise, dedication, and professionalism of our team,
  and we’re proud to foster a culture where talented people
  can do meaningful work and grow their careers.

  Magna Legal Services is seeking a talented and driven Senior
  Software Engineer to join our growing technology team. This
  role supports the technology platforms that power our
  Records business and is responsible for designing,
  developing, and maintaining secure, scalable applications
  that support both internal operations and client-facing
  solutions.

  The ideal candidate combines strong software engineering
  expertise with exceptional communication skills and a
  collaborative mindset. This role is not only responsible for
  building high-quality software, but also for partnering with
  business stakeholders, translating complex technical
  concepts into practical solutions, and helping guide
  technology decisions across the organization.

  We are committed to leveraging AI throughout our software
  development lifecycle. The ideal candidate embraces AI-
  assisted development tools as a core part of modern
  engineering, using them to improve productivity, code
  quality, and innovation while exercising sound engineering
  judgment.

  This is a fully remote role, offering the opportunity to
  make a direct impact on the technology that supports Magna's
  Records business. While this role is primarily focused on
  the Records business, our engineering team collaborates
  across the organization. Engineers regularly contribute to
  shared platforms, cross-functional initiatives, and projects
  supporting other business lines as business priorities
  evolve.

