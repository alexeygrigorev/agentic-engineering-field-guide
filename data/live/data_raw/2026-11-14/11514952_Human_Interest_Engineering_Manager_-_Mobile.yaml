description: |
  Human Interest is on a mission to ensure that people in all
  lines of work have access to retirement benefits.

  More than half of all working Americans are not saving
  enough for their future. Too often, it’s because they are
  employed by a company that doesn’t offer a retirement plan.
  Human Interest is changing that by making it affordable and
  accessible for small and medium-sized businesses to offer
  employees a path to financial independence through
  retirement savings.

  We’re a high-growth fintech company changing the retirement
  industry. We are backed by a number of investors. This
  includes funding from Marshall Wace and Baillie Gifford, as
  well as top investors such as BlackRock, TPG (The Rise
  Fund), SoftBank, Glynn Capital, NewView Capital, USVP, Wing,
  Uncork, and more.

  About the role

  This is a high-impact people leadership role managing
  engineers focused on a mission-critical domain: building the
  future of our mobile app experience. You will combine
  technical leadership with people management, driving both
  technical execution and a high-performance engineering
  culture for our mobile platforms.

  The team's scope is broad, spanning multi-persona mobile
  experiences, native & cross-platform architecture and
  release operations:

  - Multi-Persona Mobile Experience: Architecting client-side
    application flows for employees managing their retirement
    accounts, while expanding the platform to build future
    mobile experiences tailored for 401(k) company admins to
    manage plan administrative workflows on the go.
  - Native & Cross-Platform Architecture: Guiding evaluation and
    execution across native iOS (Swift) and Android (Kotlin)
    as well as cross-platform frameworks (React Native,
    Flutter), ensuring robust SDK integration, optimal runtime
    performance, and scalable application architecture.
  - Release Engineering & QA Infrastructure: Owning the complete
    mobile release lifecycle, including store deployments (App
    Store Connect, Google Play Console), CI/CD pipelines
    (Fastlane, Bitrise), device farm test automation, and
    mobile telemetry/analytics integrations (such as Braze and
    Firebase).

  This is a rare greenfield opportunity: you'll build this
  mobile team from the ground up, hiring the engineers who
  join it, and you'll have a blank slate to define how mobile
  engineering works at Human Interest. Build pipelines,
  release process, QA infrastructure, telemetry, the native-
  vs-cross-platform architecture itself; none of it exists
  yet, which means none of it is constrained by legacy
  decisions.

  You'll mentor the team you hire and work closely with
  Product and Design to ship it. Millions of employees and
  plan administrators will manage their financial future on
  what you build, and you'll own the outcomes that matter: app
  store ratings, crash-free sessions, release governance, and
  getting apps into people's hands reliably.

  What you get to do every day

  - Team Leadership and Development: Recruit and hire 3+ top
    mobile engineers. Develop and scale a high-performing team
    across iOS, Android, and cross-platform disciplines while
    eliminating platform silos.
  - Technical Vision and Execution: Drive the execution of
    mobile roadmaps across employee and company admin product
    surfaces, ensuring a smooth, responsive, and stable app
    experience for our customers. Provide technical leadership
    on mobile architecture, device fragmentation, and AI-
    assisted engineering tools.
  - Release Governance and Quality: Oversee release engineering
    practices, including pipeline management, build sign-offs,
    App Store/Play Store staged rollouts, feature flag
    rollouts, automated PR testing workflows, and cross-device
    QA verification.
  - Cross-Functional Collaboration: Partner with product
    management, UX design, operations, and backend teams for
    API contracts, backend-driven UI integrations,
    administrative security controls, and alignment on release
    schedules.
  - Mobile Telemetry & Metrics: Establish and maintain mobile
    observability using tools like Braze, Sentry, or Datadog
    to track app adoption, deep-linking performance, push
    engagement, and crash analytics.

  What you bring to the role

  Experience

  - 5+ years of experience leading software engineering teams,
    with a strong focus on mobile application delivery.
  - Proven track record of shipping production iOS, Android, or
    cross-platform (React Native/Flutter/Kotlin Multiplatform)
    apps across multiple store release cycles.
  - Experience managing complex, multi-persona mobile
    applications (e.g., consumer and enterprise/admin portal
    surfaces within mobile apps) is a strong plus.
  - Experience with mobile release operations, store submission
    guidelines, and feature flag management.
  - Experience with fintech, security-sensitive applications, or
    regulated domains is a plus.

  Technical Acumen

  - Deep technical background in mobile software engineering
    (Swift, Kotlin, React Native, Flutter, or Kotlin
    Multiplatform).
  - Understanding of mobile architecture trade-offs, device
    farms, automated UI testing (XCUITest, Espresso, Appium),
    client-side telemetry, and API contract design.

  Leadership Skills

  - Excellent communication (verbal and written), mentorship
    abilities, and experience fostering healthy, inclusive
    work environments.
  - Strong cross-functional collaboration skills to bridge
    mobile client constraints with backend teams and business
    leadership.

  Education

  - Bachelor's or Master's degree in Computer Science,
    Engineering, or a related field is strongly preferred.

  Why you will love working at Human Interest

  Human Interest is tackling one of our country's biggest
  challenges - closing the retirement gap. You'll be
  instrumental in architecting and scaling solutions that
  bring financial security to employees at small and medium-
  sized businesses nationwide. We’ve made significant
  progress, but there is still growth ahead, offering you a
  unique opportunity to solve complex problems, drive
  innovation, and advance your career alongside a dedicated,
  mission-driven team. We value hard work and recognize that
  our team's contributions are key to our continued success.

  Join Human Interest and make a lasting impact by shaping the
  future of retirement.

  Our operating principles define how we work together as a
  team. They reflect Human Interest’s unique view on what’s
  important and what’s right. Documenting this core aspect of
  our culture helps employees make good decisions on their
  own. It also helps candidates considering career
  opportunities critically evaluate whether they will thrive
  at Human Interest.

  - Customer obsession: We're all about creating amazing
    experiences for our customers. We put their needs first
    and go the extra mile to make them smile.
  - Long-Term Orientation: We're not just playing for today;
    we're building a legacy. We think big, plan strategically,
    and invest in our future.
  - Autonomous and Accountable Teams: We trust our team members
    to take ownership and make smart decisions. We empower you
    to be your best self!
  - An Escalating Bar for Talent and Performance: We're
    constantly raising the bar and challenging ourselves to be
    better. We believe in growth and continuous improvement.
  - Fundamental Optimism: We see the glass as half full (and
    then we fill it up with more amazing ideas!). We believe
    in the power of positivity and the potential for
    greatness.

  Compensation - At Human Interest, there are a number of
  factors that are used to determine the appropriate pay range
  for each position. We take into account the cost of labor
  for each position in various markets across the U.S. The
  base salary for this position spans $220,000 - $265,000 and
  represents the minimum in our lowest geographic region to a
  maximum in our highest geographic region. The salary we
  offer to a new employee within this range is based on their
  location within the U.S., their relevant job-related skills,
  and experience. At Human Interest, base salary is one
  component of the overall total rewards package. Depending on
  the position, additional compensation components such as
  bonuses, commissions, and equity may be offered. All of our
  employees are offered a robust suite of physical, financial,
  and mental wellness benefits. In compliance with applicable
  laws, we do not inquire about salary history, or about
  criminal history prior to a conditional offer of employment.

  Benefits -

  - A great 401(k) plan: Our own! Our 401(k) includes a dollar-
    for-dollar employer match up to 4% of compensation
    (immediately vested) and $0 plan fees
  - Top-of-the-line health plans, as well as dental and vision
    insurance
  - Competitive time off and parental leave
  - Addition Wealth:  Unlimited access to digital tools,
    financial professionals, and a knowledge center to help
    you understand your equity and support your financial
    wellness
  - Lyra: Enhanced Mental Health Support for Employees and
    dependents
  - Carrot: Fertility healthcare and family forming benefits
  - Candidly:  Student loan resource to help you and your family
    plan, borrow, and repay student debt
  - Monthly work-from-home stipend; quarterly lifestyle stipend
  - Engaging team-building experiences, ranging from virtual
    social events to team offsites, promoting collaboration
    and camaraderie.

  We’re a great place to work (but don’t take our word for it)

  Here’s a list of our awards and accolades:

  - Certified as a Great Place To Work® (2023-2025)
  - Fortune Best Place to Work in the Bay Area (2024)
  - Best Places to Work by Built In (2023-2024)
  - America’s Best Startup Employers by Forbes (2020-2022, 2024)
  - A Top Company by Y Combinator (2020-2023)
  - Inc. Fastest Growing Companies (2021)

