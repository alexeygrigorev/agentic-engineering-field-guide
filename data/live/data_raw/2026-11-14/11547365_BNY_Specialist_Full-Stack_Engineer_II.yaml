description: |
  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

  We’re seeking a future team member for the role of
  Specialist Full Stack Engineer to join our Finance Hub in
  New York, NY.  The role focuses on strong data analysis
  skills, logical thinking, problem solving, and system design
  to develop scalable solutions/ AI-enabled capabilities
  across data platforms and applications.

  The ideal candidate is comfortable working across the full
  lifecycle of software development - from gathering
  requirements, design, build & implement.

  In this role, you'll make an impact in the following ways:

  - Design and develop Regulatory / AI-powered solutions to
    solve complex enterprise data and analytics problems
  - Collaborate with platform, data, and product teams to design
    & develop solutions
  - Evaluate and experiment with emerging AI methodologies and
    frameworks to improve solution effectiveness
  - Document solution design, assumptions, and algorithms for
    enterprise adoption



  To be successful in this role, we're seeking the following:

  - Education: Degree in Computer Science, Mathematics, AI, Data
    Science, or related quantitative field
  - Experience: 2-5  years of software development; experience
    in the financial services industry is a plus
  - Skills:
  - Experience developing Front-End and Back-end.
  - Knowledgeable about cross-platform interoperability
    (multiple platforms i.e. NT, Intranet, etc.), major tools
    in a toolkit for a specific platform and features of
    multiple toolkits.
    - Strong logical reasoning and mathematical thinking
    - Experience translating business problems into algorithmic
      solutions
    - Ability to work with large and complex datasets
    - Strong written and verbal communication skills for
      explaining complex concepts

