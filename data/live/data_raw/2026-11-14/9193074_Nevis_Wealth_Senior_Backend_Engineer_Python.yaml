description: |
  About Nevis

  Nevis is building the world’s first AI wealth management
  platform. We are building the system financial advisors will
  run on for the next decade. Our AI completes work, automates
  workflows end to end, and frees advisors to spend more time
  with clients. In the future, every wealth management firm
  will run on Nevis.

  Nevis was founded by an exceptional team of ex-Revolut
  executives and has raised $110 million in just two years,
  including a $70 million Series B led by EQT Ventures &
  Growth, backed by world-leading investors including Sequoia
  Capital, ICONIQ, and Ribbit.

  The Role

  We are looking for an exceptional Software Engineer (Python)
  to help build the AI platform that powers intelligent
  workflows for the world’s top financial firms.

  In this role, you will design and implement the Python
  systems, services, and orchestration layers that accelerate
  AI development across Nevis. You’ll work across applied AI,
  data pipelines, model execution frameworks, agentic systems,
  retrieval infrastructure, and backend components that
  support our AI products.

  You’ll thrive here if you love building production-grade AI
  platforms, care about performance and reliability, and want
  to work on systems that move from idea to production in
  days. You’ll be joining a world-class engineering team with
  deep experience building AI systems at scale.

  What You’ll Do

  - Build and evolve Nevis’ Python-based AI platform, powering
    core workflows and agentic automation.
  - Develop model orchestration, data processing pipelines,
    retrieval systems, and execution runtimes for applied AI
    features.
  - Create scalable APIs, services, and internal tools enabling
    rapid development, evaluation, and deployment of AI
    systems.
  - Architect robust systems for model inference, prompt
    execution, vector retrieval, and multi-step agent
    reasoning.
  - Maintain high engineering standards through clean code,
    testing, observability, and CI/CD.
  - Collaborate closely with AI engineers, product managers, and
    designers to ship features used by thousands of clients.
  - Own greenfield AI platform components from architecture
    through production rollout.
  - Participate in design reviews, code reviews, and technical
    debates that shape the future of Nevis’ technical
    direction.

  Who You Are

  - 4+ years of experience in Python engineering, ideally
    building AI platforms, ML infrastructure, or applied AI
    products.
  - Deep expertise in Python, asynchronous programming, system
    design, and backend engineering fundamentals.
  - Hands-on experience building production systems involving:
    - LLM orchestration or agent frameworks (Pydantic, LangChain,
      custom orchestration).
    - Data pipelines, ETL, embeddings, or vector search
    - Retrieval-augmented generation (RAG) or model-backed
      workflows
    - High-performance APIs and distributed services
  - Strong understanding of modern cloud environments (AWS
    preferred).
  - Solid foundation in computer science, distributed systems,
    or related fields.
  - Fast learner with a bias for action and a strong ownership
    mindset.
  - Excellent communication and collaboration skills.
  - Comfortable operating in a fast-paced, high-growth
    environment.

  Nice to Have

  - Experience shipping applied AI or ML-powered products in
    production.
  - Knowledge of vector databases, feature stores, or streaming
    systems.
  - Background in fintech, financial services, wealth
    management, or startups.

  Why Join Nevis?

  - Work alongside a high-calibre founding team backed by some
    of the best investors in the world.
  - Build core systems at a hyper-growth AI startup redefining
    wealth management.
  - Fast-paced environment with huge scope for ownership,
    impact, and career growth.
  - Mission-driven culture with global industry-changing
    potential.
  - 25 days’ annual leave.
  - Private medical insurance.
  - Competitive salary and benefits, including company equity.
