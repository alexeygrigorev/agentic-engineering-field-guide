description: |
  Why loveholidays?

  We’re on a mission to open the world to everyone, giving our
  customers unlimited choice, unmatched ease and unmissable
  value for their next getaway.

  Our trailblaze together culture is what drives our success,
  powered by our people and the way they work. Using
  progressive technology, we drive cutting-edge innovation and
  improve how our customers discover, book and experience
  their holidays. You’ll have the opportunity to accelerate
  your growth through meaningful challenges, new experiences
  and the freedom to shape your own path. You’ll create impact
  for our future by taking ownership, contributing to shared
  goals and helping shape what comes next, all as part of our
  enhanced international community of talented, collaborative
  and passionate teams.

  Why Technology at loveholidays

  Technology at loveholidays underpins our vision to become
  the most loved OTA in Europe. We drive cutting-edge
  innovation and technical excellence to futureproof the
  business. Our systems process trillions of daily holiday
  offers, we deploy over a thousand times a month, serving
  thousands of requests per second. This is where you can
  accelerate your growth by solving complex challenges and
  broadening your skillset.

  Join us to create impact for our future in an exciting new
  chapter, owning your success and contributing to shared
  goals. We actively talk about technology and adhere to our
  key technology principles that have guided us this far. We
  are growing and have ambitious plans to expand across
  Europe, employing the best minds and technology to let us do
  this.

  The difference you’ll make

  You’ll sit in the Discover and Book team, reporting to the
  Lead Software Engineer. You’ll work closely with our product
  and design teams to help shape fast, accessible and reliable
  experiences for customers. You’ll work on high-impact
  journeys across search, discovery and booking, helping
  customers find and book their next holiday across web and
  mobile, while continuing to evolve our frontend platform and
  keep us at the forefront of modern web engineering.

  You’ll create polished, high-performing customer experiences
  that make finding and booking a holiday simple and
  trustworthy. You’ll bring strong product and engineering
  judgement to the team, balancing speed of delivery with
  accessibility, performance, consistency and long-term
  maintainability.

  Discover and Book sits within our Customer Platform
  function, which builds the technology and shared
  capabilities that power the loveholidays experience. By
  creating scalable products, systems and tools, Platform
  helps the wider organisation move faster, work more
  independently and deliver better outcomes for customers.

  You will:

  - Build modern, responsive web experiences that are fast,
    accessible, reliable and maintainable.
  - Work closely with Product and Design to turn customer
    problems into simple, intuitive journeys.
  - Raise the quality bar for UI by ensuring experiences are
    accessible, visually consistent and work well across
    devices, browsers, languages and European markets.
  - Build and evolve customer journeys that work seamlessly
    across the web and our iOS and Android app, accounting for
    the behaviours and constraints of each platform.
  - Evolve our design system, shared components and design
    tokens so teams can build consistent experiences quickly.
  - Improve web performance, including page load speed,
    rendering, bundle size and Core Web Vitals.
  - Use experimentation, analytics and customer insight to make
    informed product decisions.
  - Build well-tested, observable features and use production
    signals to continuously improve them.
  - Collaborate with backend engineers on APIs and data
    contracts, keeping data ownership clear and frontend
    integrations straightforward.
  - Mentor other engineers through pairing, code review and
    pragmatic technical guidance.
  - Contribute to our frontend migration, bringing customer
    journeys from our established application onto our modern
    shared frontend platform.

  Your day-to-day:

  - Deliver customer-facing features iteratively, using
    experimentation and customer insight to validate ideas and
    improve outcomes.
  - Partner with engineers, designers, product managers and
    analysts within and beyond your team.
  - Build and maintain reusable UI components, patterns and
    tooling.
  - Validate customer experiences across web, iOS and Android.
  - Make thoughtful technical decisions that support both
    immediate customer value and longer-term platform goals.
  - Ensure features are accessible, resilient and measurable.
    Investigate and resolve production issues using
    observability tools, analytics and customer feedback.
  - Leave the codebase, documentation and developer experience
    better than you found them.

  Your skillset:

  - Experience building server-rendered, performant web
    applications.
  - A strong understanding of HTML, CSS, responsive design and
    browser behaviour. A practical commitment to web
    accessibility and inclusive design.
  - Experience creating and maintaining component libraries or
    design systems.
  - Experience consuming and shaping APIs, ideally GraphQL and
    REST.
  - Strong testing habits across unit, integration and end-to-
    end testing. An understanding of performance, monitoring,
    reliability and observability in customer-facing web
    applications.
  - The ability to break down ambiguous problems, make sound
    trade-offs and deliver incrementally.
  - Takes ownership of outcomes, not just tasks. Proactively
    identifies opportunities to improve the customer
    experience and considers how their work supports our
    customer vision as we scale into new markets.
  - You can work effectively across frontend and backend
    boundaries, collaborating with teams to deliver end-to-end
    customer journeys.
  - Clear communication and a collaborative approach to working
    with Design, Product and Engineering colleagues.

  Our frontend tech stack

  Core: TypeScript · React/Preact · Vite · SSR · GraphQL ·
  Figma · Storybook · GitHub

  Other: Panda CSS · Design Tokens · Node.js · Vitest/Jest ·
  Playwright · Appium · Capacitor · OpenTelemetry · Sentry ·
  Feature Flags

  The interview journey:

  - Talent intro - 30 mins
  - 1st stage with two Software Engineers - 45 mins
  - Take-home challenge
  - Final stage with key stakeholders, in office - 3 hours
    - Challenge discussion - 1 hour
    - Reliability and Infrastructure - 45 mins
    - Tech and Product Culture - 45 mins

  Perks of joining us:

  - Company pension contributions at 5%
  - Individualised training budget for you to learn on the job
    and level yourself up
  - Discounted holidays for you, your family and friends
  - 25 days of holidays per annum (plus 8 public holidays)
    increases by 1 day for every second year of service, up to
    a maximum 30 days per annum
  - Ability to buy and sell annual leave
  - Access to our electric vehicle salary sacrifice scheme
  - Cycle to work scheme, season ticket loan and eye care
    vouchers



  Our commitment to inclusion

  At loveholidays, we focus on creating an inclusive
  environment where everyone can contribute, grow and succeed.
  We value the different perspectives, experiences and ideas
  each person brings, because they help us work better
  together, challenge our thinking and make stronger
  decisions.

  As we continue to grow and evolve, we want everyone to feel
  supported and able to do their best work. We’re also
  committed to making our hiring process accessible, so please
  let our Talent Acquisition team know if you need any
  adjustments at any stage.
