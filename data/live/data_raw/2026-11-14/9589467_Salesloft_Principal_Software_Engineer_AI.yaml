description: |
  Job Title: Principal Software Engineer, AI

  Location: Remote - US

  Salesloft is building the next era of enterprise revenue —
  one where teams make confident decisions powered by AI and
  real signals. By combining our scale, insights, and AI
  innovation, we're building the industry's first Predictive
  Revenue System, enabling humans and AI to work together to
  make smarter decisions and drive consistent growth.

  With thousands of customers using our platforms every day,
  we have an unmatched view into how revenue is actually won —
  the Revenue Context that reveals what happens, when, and
  with what outcome. This gives us a unique opportunity to
  transform an entire category and set a new benchmark for how
  modern revenue teams operate.

  Join us to help transform how companies around the world run
  revenue — and build the platform that will guide leading
  revenue teams into the future.

  THE OPPORTUNITY

  At Salesloft, our Principal Engineer for AI sets the
  technical direction for how machine intelligence works
  across our Predictive Revenue System. This is the most
  senior individual-contributor role on our AI engineering
  team: you will architect the systems that turn LLMs, machine
  learning models, and agentic workflows into production
  capabilities that thousands of enterprise revenue teams
  depend on.

  This is deep, ambiguous, frontier work. You will make the
  foundational architectural decisions for AI at Salesloft —
  how we serve models at scale, how we build reliable systems
  on top of non-deterministic components, how we evaluate and
  guardrail agentic behavior, and how we keep pace as the
  underlying foundation models evolve. You will set the
  standards other engineers build on and act as a technical
  multiplier across the AI organization.

  On a day-to-day basis, you will:

  - Set the technical architecture and direction for AI systems
    across the platform — model serving, LLM-powered features,
    agentic workflows, and the infrastructure beneath them.
  - Design production-grade systems that are reliable and
    observable despite being built on non-deterministic,
    probabilistic AI components.
  - Architect evaluation frameworks, guardrails, and quality
    systems that make AI behavior safe, measurable, and
    trustworthy at enterprise scale.
  - Lead the most complex AI engineering problems end to end —
    from research-adjacent prototyping through hardened
    production delivery.
  - Establish engineering standards and best practices for
    building AI-native systems, and mentor senior engineers
    across the org.
  - Keep the platform at the frontier by evaluating and
    integrating advances in foundation models, agent
    frameworks, and the modern AI stack.

  This role lives at the heart of how we Lead From the Front:
  you'll work at the edge of applied AI, prototype rapidly,
  and make architectural bets ahead of the field. And in the
  spirit of how we Make Your Mark, you'll set the AI
  engineering standards and systems that the entire
  organization builds on — engineered for scale, not for a
  demo.

  WHAT WE'RE LOOKING FOR

  We are looking for an engineer who operates at the highest
  level of technical authority in AI systems — someone who has
  architected and shipped production AI at scale and
  understands the deep challenges of building reliable systems
  on probabilistic foundations. You lead through technical
  credibility and make the engineers around you better.

  You embody what we call Evidence Over Ego — you make
  architectural decisions from evaluation data and evidence
  rather than hype, you invite rigorous challenge, and you
  change direction when the models or the data move. You bring
  systems thinking to a genuinely unsolved problem space and
  build for durability.

  This is the right role if you want to define how AI works on
  a platform at the center of enterprise revenue.

  THE TEAM

  The Salesloft AI Engineering organization builds the machine
  intelligence at the core of the Predictive Revenue System.
  The team works at the intersection of applied research and
  production engineering, in close partnership with Product,
  Data Science, and Data Platform Engineering.

  The team Moves as One — AI engineering, product, and data
  science share ownership of shipping trustworthy AI and make
  hard technical calls together. And we are relentlessly
  Customer Inspired: every AI capability is measured against
  whether it makes revenue teams genuinely more successful and
  more confident in the system.

  THE SKILL SET

  - Extensive experience building and architecting production
    software systems at scale, with significant depth in AI/ML
    systems.
  - Hands-on experience building production systems on top of
    LLMs or machine learning models — including designing for
    the challenges of non-deterministic behavior.
  - Deep expertise in distributed systems, model serving, and
    the infrastructure required to run AI reliably at scale.
  - Proven experience designing evaluation frameworks,
    guardrails, or quality systems for AI-driven features.
  - A track record of setting technical architecture and
    standards across teams and mentoring senior engineers.
  - Strong command of a major programming language (e.g.,
    Python, Java, or Go) and modern cloud infrastructure (AWS
    or GCP).
  - Hands-on experience with agentic systems — designing and
    hardening AI agents that take autonomous action in
    production.
  - Depth in the modern AI stack — retrieval-augmented
    generation, vector stores, agent frameworks, model
    orchestration, or evaluation tooling.

