description: |
  Software Engineer (Motorsport)DO YOU WANT TO WORK FOR THE
  WORLD LEADER IN ELITE SPORTS PERFORMANCE ANALYTICS?

  Catapult is a world leader in sports performance technology,
  serving over 5,000 teams across 40 sports. We improve many
  of your favorite athletes' performances with our wearable
  tracking technology, video and data analysis systems, and
  athlete management products. Our technology offers objective
  solutions to sport-based challenges and can be found
  throughout the NFL, NHL, NBA, AFL, NRL, Premier League,
  Bundesliga, La Liga and many more.

  In Motorsport, Catapult’s SBG race management and team
  strategy systems are the technology of choice for elite-
  level organisers and competitors around the world, including
  in Formula 1, Formula E, IndyCar, NASCAR, WEC/Le Mans and
  other worldwide endurance racing. Customers include the FIA,
  nine Formula 1 teams - including the 8-time World Champion
  Mercedes AMG Petronas F1 Team - the majority of Formula E
  teams, the winners of multiple Le Mans 24-hour races over
  the last 10 years - Audi, Porsche, and Toyota - and teams
  and organisers in both IndyCar and NASCAR.

  We have major offices in the UK (London and Leeds), USA
  (Boston) and Australia (Melbourne) as well as multiple
  smaller offices around the world.

  WE WANT PEOPLE WHO ARE PASSIONATE ABOUT SPORTS AND WANT TO
  WIN

  We are looking for a talented and enthusiastic Software
  Engineer (Motorsport) to grow our Motorsport development
  team as we expand our RaceWatch products into new series and
  tackle new challenges. Based in the London office (3 days a
  week), you will be a key player in developing new
  capabilities in RaceWatch, focussing on one or two racing
  series, and also contributing to the entire RaceWatch suite.
  We believe that our customers deserve the best platform, and
  we are on a mission to maximise and enhance their
  performance through delivering the highest quality
  experience. As a Software Engineer, you will help us drive
  our products and processes forward. You will be able to
  excel in a fast-paced environment with short project
  timelines from conception to deployment.

  WHAT YOU’LL DO

  - Lead the development of our RaceWatch software for one or
    more motorsport series.
  - Work with product managers and customers to design features
    and prioritise tasks.
  - Identify ways to add innovative new features to the
    software.
  - Design, build, and maintain efficient, reusable, and
    reliable code.
  - Contribute to code quality, organization, and best practices
    throughout the development process.
  - Maintain and enhance software reliability.

  WHAT YOU’LL NEED

  - Degree in computer science, or another scientific or
    technical subject.
  - A passion for sport.
  - 2+ years working in a fast-paced, technical environment,
    delivering software to customers.
  - A proven track record of building applications in C/C++, or
    another object-oriented language.
  - Experience developing products, scaling them, and supporting
    them throughout the entire lifecycle.
  - An aptitude for working with complex data.
  - Strong interpersonal skills and an ability to communicate
    effectively with technical and non-technical staff, both
    internally and when speaking to customers.
  - A willingness to go above and beyond for the customer.
  - Ability to help cover live motorsport events at weekends on
    a rotational basis with the rest of the team.
  - An ability to multi-task and thrive in a dynamic work
    environment with changing priorities.

  NICE TO HAVE

  - Experience developing Windows applications in Visual Studio.
  - Experience developing applications that process video.
  - Experience with ticketing and project management platforms,
    such as JIRA or Monday.
  - Prior experience working in motorsport is an advantage.

  WHY CATAPULT?

  - We have amazing people. We can promise you will work with
    some of the most ambitious and intelligent people in an
    exciting industry, and you will do some of the best work
    of your life.
  - We encourage our people to have constructive, open and
    honest communication; to make Catapult extraordinary;
    innovate and create smart solutions; establish a
    collaborative, yet challenging, environment to develop our
    performance and the performance of our customers.
  - Our workforce spans more than 20 countries so you’ll have
    the opportunity to work across multiple nationalities and
    cultures.
  - We value improvement and development. We are challenging
    ourselves to continuously grow and become a high-
    performance company. That means we maintain a growth
    mindset in everything we do, and our people are always
    looking for ways to do things better. There is unlimited
    opportunity to grow, do more, and do better.
  - We care about you. We offer outstanding paid maternity and
    paternity leave.

  Whether you are interested in sports or not, you’ll have the
  satisfaction of knowing your work is supporting some of the
  most successful teams, organisations and competitors on the
  planet! While we have access to many exciting opportunities,
  we also realize that we are here to do a very important job
  for our customers. As a result, we aim to work with purpose
  and intention. We look for people that fit into our team
  culture, those who actively contribute and individuals who
  are excited about what they do.

  In order to build the future of sports performance, we need
  the brightest talent. If you think you can contribute to the
  empowering, enjoyable and exciting Catapult environment,
  then we invite you to apply.

  All offers of employment are subject to Catapult's positive
  prehire check. To find out more, please contact the Talent
  Partner for this role.
