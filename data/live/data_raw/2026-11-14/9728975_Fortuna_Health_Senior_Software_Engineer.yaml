description: |
  About Fortuna Health

  We believe accessing healthcare should be as simple as doing
  your taxes on TurboTax. But for the millions on Medicaid,
  it’s not.

  People lose coverage because of administrative barriers—like
  missing a notice and incorrect documentation. 60–70% of
  disenrollments in Medicaid happen for these procedural
  reasons. These are avoidable errors caused by fragmented
  systems, not ineligibility.

  Fortuna Health is redefining the consumer experience for
  Medicaid. We’re helping millions navigate Medicaid end-to-
  end from eligibility and enrollment to renewing coverage.
  We're backed by a16z, BoxGroup, YC, and top healthcare
  angels.

  We believe this is a once in a lifetime opportunity to
  dramatically improve the human condition for 90M people, and
  we need the help of high-throughput, growth-minded builders
  to make it happen.

  About the role

  What you'll do

  As an early engineering hire at Fortuna, you'll play a huge
  role in shaping the direction and culture of the company. We
  work fully in-person 5 days a week out of our NYC office,
  and strongly believe in the value of a focused, supportive,
  and tight-knit team.

  Your primary duty will be to build the product, which will
  mostly entail fast-paced engineering work. Every engineer
  owns a slice of the product and is responsible for its
  success. We care about quality and UX, more-so than speed
  for its own sake, and we are always thinking about how to
  optimally use AI in the development and review process.

  What we're looking for

  Product Mindset Our philosophy is that engineers should lead
  product. We are fundamentally building a consumer product
  for the masses. As such, we are looking for an engineer who
  is more motivated by building a great consumer-first product
  than by deeply exploring interesting technology.

  Ownership There's plenty of greenfield, exploratory work to
  be done. We need someone to be able to take an ambiguous
  problem and run with it. As we gain traction with specific
  product ideas, we would want you to truly own the whole
  product, not just the code.

  Technical Velocity We are looking for a rockstar engineer,
  someone who is nimble and can move fast while maintaining a
  sufficiently high level of code quality so that things don't
  fall apart. It's important to understand best practices and
  technical end goals so that trade-offs can be appropriately
  weighed as we are building.

  Respectful Disagreement We believe it's crucial to be able
  to openly disagree with anyone on the team. We are looking
  for someone who doesn't shy away from conflict, but is
  respectful and empathetic in their approach and always open
  to different ideas.

  Humility It's important to be able to admit when you're
  wrong. We are looking for a low-ego teammate who is able to
  take failures in stride and grow from them.

  Requirements

  - 3+ years of engineering experience

  What we offer

  - Competitive salary and equity ownership in the company
  - Platinum health insurance plans
  - Free lunch every day
  - All commuter expenses covered
  - $100/month wellness benefit
  - Unlimited PTO
  - 401k plan with company match
