description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the Life

  Medtronic’s Surgical Operating Unit (SOU) is creating
  ambitious new products that bring connectivity, real-time
  guidance, and decision support to the operating room. To
  support this mission, we are developing high-performance
  systems that enable edge computing and connectivity.

  The Surgical AI Centre of Excellence works closely with
  teams across the SOU, to create a connected ecosystem and
  leverage state of the art data science and computer vision
  to provide the most comprehensive view of surgery. If you’re
  interested in using cutting-edge technology to improve the
  standard of care in surgery on a global scale, this could be
  the place for you.

  As a Senior Software Engineer working in our AI and Data
  Science Platform team, you will help design, build and
  maintain software solutions that Machine Learning Engineers
  and Data Scientists use to develop new products. You will
  use your skills to build software that empowers our teams to
  deliver rapidly and at scale.



  Responsibilities may include the following and other duties
  may be assigned:

  - Contribute to the design, development and maintenance of the
    SaaS tool (Python codebase) for project, data and
    annotations management used by internal stakeholder.
  - Work with data and platform engineers to develop efficient
    processes for accessing and handling increasing volumes of
    data.
  - Collaborate with internal stakeholders to define software
    requirements and validate features in a fast-paced,
    iterative environment driven by quality.

  Required Knowledge and Experience: 

  - BSc or MSc in relevant academic field.
  - Experience delivering and maintaining production quality
    code in an industry setting.
  - Strong experience with Python and best practices for
    delivering high-quality code.
  - Experience using version control (git) to contribute to
    production codebases.
  - Awareness of common DevOps tools and practices (CI/CD,
    Docker).
  - Awareness of cloud infrastructure and development (AWS, GCP
    etc.).
  - Must be willing to commute to London 2 days per week.

  Experience working in, collaborating with, or having direct
  exposure to Kanban and/or Scrum environments, along with
  experience developing SaaS features that leverage LLM agents
  is preferred. Familiarity with using LLM agents to
  accelerate software development, as well as experience or
  knowledge in machine learning, would be advantageous.
  Experience with infrastructure-as-code tools, such as
  Terraform, would also be a plus.

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

