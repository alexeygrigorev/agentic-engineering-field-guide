description: |
  Align Israel is looking for talented and creative web
  applications Senior software engineer. The successful
  candidate will join our SW engineering group as a full-time
  member and will participate in the development process for
  both the server and client sides of our web applications.

  Key Responsibilities

  - Review and understand current systems and products.
  - Participate and contribute to the system design and
    architecture, according to the product limitations, needs
    and roadmap.
  - Explore learn and recommend on new technologies practices
    and tools.
  - Develop technical documentation, standards, procedures and
    training materials.
  - Contribute to our roadmap and products by developing and
    maintaining well designed and efficient code.
  - Practice Agile as part of our SCRUM teams, working closely
    with co-team members, stakeholders, product owners,
    program managers and such.

  Skills, Knowledge & Expertise

  - Bachelor’s degree in computer science
  - 4-7 years of experience in Web development
  - 4-7 years of experience in C#
  - 3-5 years of experience in SQL
  - experience with NHibernate (or any other ORM system)
  - experience with Angular.js
  - Advantage: experience with JQuery
  - Advantage: experience with MVC
  - Advantage: experience with Spring.Net
  - Advantage: experience with Agile methodology

  We are looking for a candidate that:

  - Is a natural problem solver. Will turn complex problems into
    smaller feasible tasks.
  - Is a technical expert, a mentor, a go-to for business and
    technical questions.
  - Is able to use own initiative, work methodically and deliver
    to deadlines.
  - Is able to work independently and as a team player on the
    same time.
  - Is having high level of serviceability, is customer focused,
    and is responsible, supportive and patient.
  - Is self-motivated, detail-oriented and well organized.
  - Is having excellent communication (oral and written) whether
    interpersonal or organizational.

