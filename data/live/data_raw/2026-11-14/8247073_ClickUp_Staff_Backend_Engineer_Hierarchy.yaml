description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  Come join the Hierarchy Squad to build and optimize a set of
  tier 1 services that are at the core of ClickUp’s all-in-one
  productivity platform! Hierarchy owns the ClickUp filesystem
  that is at foundation of everything we build. We are
  searching for passionate engineers with exceptional critical
  thinking skills and technical prowess to help maintain,
  develop and scale high throughput services to support the
  company through accelerated growth. The ideal candidate will
  find the idea of architecting distributed systems that are
  reliable and highly performant exciting, has a knack for
  debugging and writing complex code and is excited by the
  challenge of building and maintaining a platform that every
  team in the company integrates with. Our key technologies
  include Typescript, Postgres, Kafka, NestJS running on
  Amazon Web Services. If this sounds interesting to you, we'd
  love to have you join our team!



  Responsibilities:



  - Develop and maintain robust, scalable backend systems using
    Node.js (Express and NestJS).

  - Collaborate with engineers, designers, and product managers
    to drive projects forward.

  - Tune and optimize database queries for maximum efficiency
    and performance.

  - Optimize and improve existing code for better performance
    and user experience.

  - Troubleshoot and debug issues, ensuring smooth operations.

  - Share your knowledge and expertise to foster a culture of
    learning and growth.



  Requirements:



  - 8+ years of professional experience building backend
    services for SaaS products.

  - Proven track record of building and scaling backend systems.

  - Expertise in relational database query optimizations (prefer
    PostgreSQL).

  - Extensive background working with databases (SQL and NoSQL)
    and data modeling.

  - Strong understanding of RESTful API design and
    implementation.

  - Experience with agile development methodologies (Scrum,
    Kanban, etc.).

  - Familiarity with version control systems like Git.

  - Excellent problem-solving skills and a passion for tackling
    challenges.

  - Strong communication skills, as collaboration is key to our
    success.

  - Experience with microservices architecture and
    containerization (Docker, Kubernetes).



  Preferred Qualifications:



  - Familiarity with frontend technologies (Angular, React,
    Vue).

  - Professional experience with NodeJs, Express, and NestJS



  What We Offer:



  - Competitive salary and benefits package.

  - Remote work options.

  - A supportive, dynamic, and fast-paced work environment.

  - The opportunity to make a meaningful impact on a rapidly
    growing company.

  - Opportunities for personal and professional growth.



