description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  As a Group Product Manager on the Financial Engineering team
  within Platform, you'll define how Coinbase's finance
  infrastructure scales to support hundreds of billions of
  dollars in annual transaction volume. This team empowers
  every finance function at Coinbase to operate with
  precision, agility, and foresight, and you'll own the
  product strategy for finance transformation, automation, and
  AI-driven tooling. This is a high-visibility role with
  direct exposure to Coinbase's Chief Accounting Officer, and
  you'll lead a team of PMs to deliver mission-critical
  systems across accounting, treasury, and financial
  reporting.

  What you'll do:

  - Own the product strategy and roadmap for finance
    transformation, including process automation, AI-driven
    insights, and system modernization, ensuring alignment
    with Finance leadership priorities and company-wide
    objectives.
  - Lead and develop a team of product managers, setting the bar
    for product craft, stakeholder management, and technical
    depth across the Financial Engineering organization.
  - Drive cross-functional execution of high-impact initiatives
    spanning reconciliation tooling, SOX-compliant change
    management for the financial reporting pipeline, new
    product finance onboarding, and self-serve tools for
    Accounting and Treasury.
  - Partner directly with senior leaders in Finance, Product,
    and Engineering to prioritize a portfolio of initiatives,
    communicating clearly on progress, risks, and trade-offs.
  - Shape the future-state finance technology landscape by
    identifying the highest-leverage opportunities for
    automation and tooling across crypto and fiat
    reconciliation, accounting pipelines, and treasury
    workflows.

  Required Skills and Experience:

  - 10+ years of product management experience, including 2+
    years managing other product managers, with a track record
    of delivering finance or enterprise infrastructure
    products at scale.
  - Deep knowledge of financial operations including accounting
    pipelines, financial reporting, treasury management, and
    reconciliation workflows.
  - Computer Science degree or hands-on software engineering
    experience, with the ability to engage meaningfully with
    engineers on system architecture and technical trade-offs.
  - Proven ability to influence senior stakeholders (CFO, CAO,
    VP-level Product and Engineering leaders) and align cross-
    functional teams toward a common vision.
  - Familiarity with crypto asset types, on-chain transaction
    flows, and how they intersect with traditional financial
    record-keeping.
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $243,865—$286,900 USD

