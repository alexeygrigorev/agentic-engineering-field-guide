description: |
  This is a Full Time (not contract/C2C), 100% remote position
  for mainland US "onshore" only.

  Important: Please complete the survey in its entirety. We
  personally read and review all applications and the survey
  enables us to understand the context of your resume.
  Incomplete surveys with incomplete answers are automatically
  rejected.

  About the Role

  We are seeking a Full-Stack Developer with strong expertise
  in Angular, NestJS, PHP, and MySQL. The ideal candidate will
  have a proven track record of building and maintaining
  scalable, high-performance applications across the full
  stack, while being comfortable working with both modern
  JavaScript frameworks and established PHP systems.
  Familiarity with Spring Boot is considered a plus.

  While your primary responsibility will be software
  development, this role also involves considerable client-
  facing interaction. Our developers often communicate
  directly with clients in a light project management
  capacity. For larger projects, dedicated project managers
  take the lead, but developers remain actively involved in
  client interactions. We find this rewarding because it gives
  you the opportunity to connect with the people who actually
  use the applications you build.

  You will also be involved with the co-creation of project
  plans and pre-sales activities (information architecture,
  estimates, scope, schedule, risks, etc.).

  A passion for problem solving and self management is a
  necessity.

  Prior experience working in a digital agency and interacting
  with end clients is a strong plus.

  - We are a small company with heavy hitting clients
  - Training is limited - you must be able to hit the ground
    running
  - We are often hired to solve problems that cannot be solved
    by our clients’ internal teams
  - Interruptions and client management is part of Agency life
  - Accountability, independence, and self improvement are keys
    to being successful
  - Clear and concise verbal and written communication are musts
    - we anticipate and provide client solutions proactively
  - Following security and compliance best practices are
    essential

  Note: Our organization deals with client IP and very
  sensitive data. We prohibit use of AI-generated code or
  third-party code suggestions in production systems unless
  explicitly approved.

  Responsibilities

  - Design, develop, and maintain web applications using Angular
    (frontend) and NestJS/PHP (backend). We are in the process
    of migrating PHP applications to a new stack, so PHP 7 / 8
    experience is a must.
  - Manage and optimize MySQL databases, ensuring reliability
    and scalability.
  - Contribute to the design and implementation of RESTful APIs
    and backend services.
  - Support and maintain existing PHP applications, while
    contributing to new feature development in NestJS.
  - Write clean, maintainable, and testable code in TypeScript,
    JavaScript, and PHP.
  - Collaborate with cross-functional teams (design, QA, product
    management) to deliver high-quality features.
  - Participate in code reviews, testing, and deployment
    pipelines.
  - Create and maintain technical documentation and best
    practices.

  Required Qualifications

  - Proven experience as a Full-Stack Developer or in similar
    roles.
  - Proficiency in Angular (v12+), NestJS, and PHP (7.x/8.x).
  - Strong understanding of TypeScript, JavaScript (ES6+), and
    OOP principles.
  - Hands-on experience with MySQL/Postgres database schema
    design, optimization, and query performance tuning.
  - Experience building and consuming RESTful APIs.
  - Familiarity with Git-based workflows and CI/CD pipelines.

  Nice to Have

  - Experience with Spring Boot and Java ecosystems.
  - Familiarity with containerization (Docker, Kubernetes).
  - Exposure to cloud environments (AWS, GCP, or Azure).
  - Experience with GraphQL or microservices.
  - Knowledge of Agile/Scrum methodologies.

  Compensation & Benefits

  $100,000 - $130,000. Individual compensation varies based on
  job related factors, including business needs, experience,
  level of responsibility, and qualifications.

  Includes:

  - Health and 401(k) plans with employer match
  - Paid time off for vacation, sick and personal days
  - Remote work from anywhere in the continental U.S.A. (in a
    private, not shared secure location, i.e. home office)

  About Nylon Technology (www.nylontechnology.com)

  Nylon Technology is a custom software development firm
  founded in 1997. We have delivered more than a thousand
  projects for businesses ranging from startups to large
  enterprises. Our services span the full software lifecycle,
  including strategy and analysis, application development,
  integrations, data management, hosting, infrastructure, and
  ongoing maintenance and support. We work closely with
  clients as long-term partners.

  Legal authorization to work in the U.S. is required.

  We are an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, national origin,
  disability, age, or any other legally protected status.
