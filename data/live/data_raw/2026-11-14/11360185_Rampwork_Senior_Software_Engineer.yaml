description: |
  Job Summary

  We’re looking for experienced Backend Software Engineers to
  contribute to a project focused on training and improving
  next-generation AI systems.

  You’ll apply your software engineering expertise to create
  realistic, challenging coding tasks for AI models to solve.
  These tasks may involve implementing features, fixing bugs,
  debugging complex systems, improving performance, and
  working with existing codebases.

  You’ll also design and implement deterministic verifiers
  that can reliably distinguish reasonable, valid solutions
  from incorrect ones.

  No prior AI experience is required — your software
  engineering expertise is what matters.

  What You’ll Do

  - Create realistic and challenging coding tasks involving
    feature implementation, debugging, and bug fixes.
  - Design tasks that reflect real-world backend engineering
    problems.
  - Implement deterministic verifiers that accept valid
    solutions and reject incorrect solutions.
  - Analyze and work with complex codebases across different
    technologies.
  - Debug software issues and identify root causes of bugs and
    performance bottlenecks.
  - Review and improve code for correctness, maintainability,
    performance, and reliability.
  - Build and optimize scalable backend services and APIs.
  - Refactor existing code and implement complex features.
  - Apply strong software engineering and code review practices
    to ensure high-quality technical output.
  - Provide detailed technical reasoning and feedback to help
    improve AI model performance.

  What We’re Looking For

  - Strong backend development experience with one or more of:
    - Java
    - Node.js
    - Go
    - Rust
    - TypeScript
    - Python
    - C++
    - or similar languages
  - Proven experience building scalable services and APIs.
  - Strong debugging and problem-solving skills.
  - Experience with performance optimization and automated
    testing.
  - Strong code review instincts and attention to software
    quality.
  - Experience working with complex or large-scale codebases.
  - Strong understanding of algorithms, data structures, and
    core computer science concepts.
  - Excellent analytical and technical communication skills.

  Cybersecurity Experience — A Plus

  A background in cybersecurity or SecOps is highly valuable,
  particularly experience with:

  - Secure coding practices
  - Application security (AppSec)
  - Penetration testing
  - Vulnerability assessment
  - Security-focused code reviews
  - OWASP / CWE
  - Secure software development
  - Vulnerability remediation

  Cybersecurity experience is not mandatory, but candidates
  who can combine strong backend engineering skills with
  security expertise are encouraged to apply.

  Preferred Qualifications

  - Proven track record delivering high-quality, performant
    backend systems.
  - Experience identifying and resolving software bugs and
    system bottlenecks.
  - Experience refactoring legacy or complex codebases.
  - Experience implementing complex features in large-scale
    applications.
  - Strong understanding of algorithms, data structures, and
    software engineering fundamentals.
  - Ability to reason through unfamiliar technical problems
    independently.
  - Excellent written and verbal English communication skills.

  Engagement

  - Contract position
  - Remote
  - 15–20 hours/week
  - $50–$90/hour, depending on experience
  - Flexible schedule

  Selection Process

  - Application & Screening Questions
  - AI Interview – approximately 30 minutes
  - Technical Assessment – tentative
  - Hiring Manager Review
  - Project Onboarding

  Important Note About the Process

  Our interview and assessment stages are designed to
  understand how you think and solve problems independently.
  Candidates are expected to complete these stages without
  outside assistance.

  The same principle applies once you join the project: the
  quality of the work depends on your own technical judgment,
  reasoning, and expertise.
