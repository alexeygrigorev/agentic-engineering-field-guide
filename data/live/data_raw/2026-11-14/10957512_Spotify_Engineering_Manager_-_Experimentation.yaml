description: |
  Think it, build it, ship it, tweak it" is at the core of
  Spotify's product development approach. In the
  Experimentation product area we are providing Spotify and
  external customers with Confidence, our platform to quickly
  and safely iterate through ideas, learn from them and make
  informed decisions for better products.

  At Spotify, experimentation touches almost all of our
  functions from marketing via content management to consumer
  products, and we’re running several thousands of tests every
  year. Through confidence, we 're sharing all our findings
  and practices with more companies as a commercial SaaS
  product.

  The team you will manage is a skilled and highly engaged
  group of engineers that are distributed over Europe. As an
  Engineering manager, you will coach them individually and as
  a team, maintaining their strong team culture and helping
  them thrive and and grow. Your technical experience provides
  mentorship and guidelines to the team, which ensures quality
  and timeliness of your deliveries. Your leadership promotes
  creativity, collaboration and courage, which forms a kind
  and productive team with a high bar for quality and pace of
  delivery.

