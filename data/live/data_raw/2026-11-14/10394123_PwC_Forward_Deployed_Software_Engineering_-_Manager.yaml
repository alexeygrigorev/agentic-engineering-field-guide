description: |
  The Opportunity As a Forward Deployed Software Engineering -
  Manager, you will be at the forefront of developing
  innovative software solutions to drive digital
  transformation and enhance business performance. Within our
  Tax practice, you will combine technical experience with
  creative thinking to deliver software products that
  revolutionize industries and provide exceptional user
  experiences. As a Manager, you will lead teams and manage
  client accounts, focusing on strategic planning and
  mentoring junior staff. You are accountable for project
  success and maintaining standards. Enhancing your leadership
  style, you motivate, develop, and inspire others to deliver
  quality. You are responsible for coaching, leveraging team
  members' unique strengths, and managing performance to
  deliver on client expectations. With your growing knowledge
  of how business works, you play an important role in
  identifying opportunities that contribute to the success of
  our Firm. You are expected to lead with integrity and
  authenticity, articulating our purpose and values in a
  meaningful way. You embrace technology and innovation to
  enhance your delivery and encourage others to do the same.
  In this role, you will take ownership of projects,
  confirming their successful planning, budgeting, execution,
  and completion. You will also address conflicts or issues,
  engaging in conversations with clients, team members, and
  other stakeholders, escalating where appropriate.
  Responsibilities
  - Leading the development and deployment of innovative
    software solutions to drive digital transformation
  - Managing software engineering projects, including planning,
    budgeting, execution, and completion
  - Guiding teams in designing, coding, and testing applications
    to enhance user experiences
  - Utilizing technical skills in API management, application
    development, and software design to deliver exceptional
    solutions
  - Overseeing the integration of enterprise applications and
    confirming seamless functionality across systems
  - Analyzing and identifying system interactions to optimize
    software performance and reliability
  - Mentoring team members to develop their skills and
    encouraging continuous learning and growth
  - Collaborating with client support teams to address and
    resolve software-related issues effectively
  - Implementing continuous integration and delivery practices
    to streamline software development processes
  - Promoting the adoption of innovative technologies and
    methodologies within the software engineering team
  What You Must Have
  - At least a Bachelor's degree
  - At least 4 years of experience
  What Sets You Apart
  - Excelling in API Management and Application Development
  - Demonstrating proficiency in Continuous
    Integration/Continuous Delivery (CI/CD)
  - Utilizing Python and JavaScript for software engineering
    projects
  - Embracing microservices architecture and object-oriented
    design principles
  - Managing enterprise application integration and solution
    architecture
  - Leading software project planning and strategic questioning
    initiatives
  - Mentoring teams in software development methodologies and
    quality assurance testing
  The salary range for this position is: $99,000 - $266,000.
