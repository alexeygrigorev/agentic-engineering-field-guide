description: |
  We're looking for a Lead Full Stack Engineer to join us in
  London

  You will join Liberty Global's AI Platform team in London,
  working directly with the VP Software Engineering to build
  and evolve the next generation platforms that power AI
  driven experiences across our business.

  This is a hands on technical leadership role for someone who
  enjoys solving complex engineering challenges and
  influencing how platforms are designed and built. As one of
  the most senior engineers in the team, you will help shape
  architectural decisions, define engineering standards and
  build production software that operates securely and
  reliably at enterprise scale.

  You will work across the full technology stack, from
  customer-facing experiences and APIs through to cloud
  infrastructure and platform services. Alongside designing
  and building critical capabilities, you will lead technical
  discussions, review engineering decisions and help ensure
  the solutions we create are scalable, maintainable and ready
  to support millions of customers across multiple markets.

  This is an opportunity to have a genuine impact on a
  strategic AI platform while remaining close to the
  technology, the architecture and the code. The platform you
  help build will support some of Liberty Global's most
  important future capabilities.

  What will you be doing?

  - Design, build and own critical platform capabilities across
    frontend applications, backend services, APIs and cloud
    infrastructure
  - Lead architecture reviews and technical design sessions,
    ensuring solutions are scalable, secure and maintainable
  - Deliver production quality software from concept through to
    deployment and operational support
  - Evaluate complex technical challenges and recommend
    solutions that balance performance, reliability,
    scalability and long term platform health
  - Review and challenge technical designs and code produced by
    delivery partners, identifying risks and opportunities for
    improvement
  - Champion engineering excellence across code quality,
    testing, continuous delivery, security, observability and
    platform reliability
  - Collaborate closely with AI, Machine Learning, Product,
    Infrastructure and DevOps teams to deliver integrated
    platform capabilities and share knowledge across the
    engineering organisation

  We tend to look for people with:

  - Deep expertise across full stack software engineering,
    including frontend technologies, backend services, APIs,
    databases and infrastructure as code
  - Strong knowledge of distributed systems and cloud native
    architectures
  - Experience designing and delivering complex platforms
    operating at enterprise scale
  - Strong cloud engineering experience within AWS, Azure or GCP
    environments
  - Experience working with Kubernetes and modern platform
    engineering practices
  - Strong architecture review and code review capability, with
    the ability to provide constructive technical guidance
  - Ability to translate complex architectural requirements into
    practical engineering solutions
  - Experience working with delivery partners, vendors or
    systems integrators
  - Strong communication and collaboration skills, with the
    ability to influence technical decisions across teams
  - Experience building or contributing to AI and Machine
    Learning platforms
  - Experience integrating large language models, speech
    technologies or multimodal AI solutions into production
    environments
  - Familiarity with AI orchestration frameworks, intelligent
    workflows and emerging AI technologies
  - Experience with data platforms and infrastructure that
    support AI workloads
  - Knowledge of monitoring, observability and continuous
    delivery practices
  - Experience within telecommunications or other large scale
    customer facing digital platforms

  What's in it for you?

  - Competitive salary and bonus, where applicable
  - 25 days annual leave with the option to purchase 5
    additional days
  - Access to wellbeing and mental health benefits, including
    the Calm app, personal medical cover, critical illness
    cover and dental insurance
  - Matched pension contribution up to 10% for UK employees
  - 24 hours of paid Volunteer Time Off
  - Discounted gym and wellness memberships
  - Access to our car benefit scheme
  - Access to our online learning platform to continue
    developing your career
  - The opportunity to join an innovative, collaborative and
    highly skilled technology team

  Who we are:

  Join Liberty Global and Shape Tomorrow’s Connections Today!

  Liberty Global is a team of experienced operators and
  investors across telecom, media, and tech. We create value
  through the strategic management of two core platforms:
  Liberty Telecom and Liberty Growth.

  Liberty Telecom is a world leader in converged broadband,
  video and mobile communications, providing approximately
  80 million fixed and mobile connections across Europe
  through leading brands, such as Virgin Media O2,
  VodafoneZiggo, and Telenet.

  Liberty Growth invests in scalable businesses across the
  technology, media, sports, and infrastructure sectors, with
  a portfolio of around 70 companies, including ITV, Formula
  E, AtlasEdge, and Egg.

  If you're entrepreneurial and thrive on challenges, join our
  high-performing team and Grow with Us. Liberty Global is an
  equal opportunity employer committed to creating an
  inclusive workplace where everyone can succeed. We welcome
  people from all backgrounds and encourage those who bring
  fresh perspectives, diverse experiences and bold ideas to
  apply.
