description: |
  To get the best candidate experience, please consider
  applying for a maximum of 3 roles within 12 months to ensure
  you are not duplicating efforts.

  Job Category

  Software Engineering

  Job Details

  About Salesforce

  Salesforce is the #1 AI CRM, where humans with agents drive
  customer success together. Here, ambition meets action. Tech
  meets trust. And innovation isn’t a buzzword — it’s a way of
  life. The world of work as we know it is changing and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI, driving innovation, and
  keeping Salesforce's core values at the heart of it all.

  Ready to level-up your career at the company leading
  workforce transformation in the agentic era? You’re in the
  right place! Agentforce is the future of AI, and you are the
  future of Salesforce.

  The Experience: Slack is looking for a seasoned engineering
  leader to join our Backend and Frontend Client
  Infrastructure teams within the Architecture and Systems
  organization. These teams are responsible for building core
  modules and APIs that power the Slack client, and
  maintaining code health and the foundation which Slack’s
  webapp developers use to build and ship features. As a Sr
  Engineering Manager, this person will lead two teams of
  skilled and high performing engineers focused on
  contributing to high impact Slack business objectives while
  advocating for and maintaining a clear roadmap and vision
  for the team. This person should have a backend or full-
  stack technical background. A key part of this role will be
  to develop relationships with stakeholders including
  engineers, engineering managers, and product managers in
  order to weigh in and make trade offs against existing
  business priorities as well as champion team interests which
  may include maintaining momentum for large scale, multi-
  quarter initiatives. What You'll Actually Be Doing:

  - Collaborate with the team to set the long term vision and
    execution strategy by utilizing your technical knowledge
  - Define, monitor, and report against quarterly measures for
    team deliverables
  - Represent the team in planning, product, and leadership
    meetings within the organization and across Slack
    engineering
  - Regularly connect with cross functional partners across
    Slack engineering to drive alignment and execute against
    business goals
  - Understand opportunities and tradeoffs to including members
    of the team within product engineering owned initiatives
  - Represent and evangelize the opportunities to improve
    productivity, performance, and code health through a
    consistently evolving and modern frontend infrastructure
  - Mentor, teach, and coach the team while supporting and
    advocating for the career development and interests of the
    individuals on the team, including driving promotion
    readiness and calibration
  - Be a key stakeholder and strategic partner in business
    critical project areas such as security and product
  - Champion AI-assisted development practices across the team,
    and identify opportunities to apply them to both
    engineering and operational workflows

  You're Our Person If...

  - Experience coaching and mentoring a team of high performing
    and skilled engineers
  - Experience designing, scaling, and operating backend
    services and distributed systems that power high-traffic
    client applications
  - Deep knowledge of API design principles that support long-
    lived client contracts
  - Deep knowledge of browsers and frontend technologies
  - High resilience towards uncertainty, ambiguity, and
    operating with high stakes, occasionally with conflicting
    priorities and stakeholders
  - The ability to understand and explain the technical trade-
    offs and complexities regarding concepts like the service
    worker, boot frameworks, and web sockets.
  - The ability to weigh several - often conflicting -
    constraints and make rapid technical decisions in a fast
    moving environment.

  Unleash Your Potential

  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.

  Accommodations

  If you need a reasonable accommodation during the
  application or the recruiting process, please submit a
  request via this Accommodations Request Form.

  Please note that Salesforce uses artificial intelligence
  (AI) tools to help our recruiters assess and evaluate
  candidates’ resumes and qualifications throughout the
  recruiting process. Humans will always make any candidate
  selection and hiring decisions. Please see our Candidate
  Privacy Statement for more information about how we use your
  personal data and your rights, including with regard to use
  of AI tools and opt out options.

