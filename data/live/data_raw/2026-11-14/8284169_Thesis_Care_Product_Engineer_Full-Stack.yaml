description: |
  About us

  Thesis is building the AI-powered care team platform for
  infinitely scalable clinical capacity. We radically increase
  access and improve quality of care by combining AI agents
  with clinical experts to take on high-impact clinical
  operations and care management activities for healthcare
  organizations.

  We’re based in NYC, are growing rapidly, and are backed by
  $60 million in funding from Oak HC/FT, CRV, Black Opal
  Ventures, and experienced C-level healthtech angel
  investors.

  About the role

  We are looking for a product-minded Full-Stack Software
  Engineer to help design, build, and scale Thesis’s core
  platform. This is a broad-scope, hands-on engineering role
  for a creative builder who cares deeply about product
  quality, user experience, and technical rigor. As an early
  member of the engineering team, you will play a foundational
  role in shaping Thesis’s product, systems, and engineering
  culture.

  Responsibilities:

  - Own core systems: Architect, implement, and maintain
    business-critical components that define and power
    Thesis’s product, including frontend experiences, backend
    services, and data flows.
  - Build end-to-end features: Lead the full lifecycle of
    feature development, from greenfield technical design
    through production deployment and iteration.
  - Partner cross-functionally: Collaborate closely with
    founders, product, and design to translate user, clinical,
    and business needs into scalable technical solutions.
  - Continuously evolve the platform: Improve system
    architecture, scalability, developer experience, and
    operational excellence as the company grows.
  - Build hands-on with AI/ML: Dive into our AI/ML codebase
    (agents, LLM/RAG systems, evaluation, and supporting
    pipelines) to design, implement, and iterate on product
    features that measurably improve user experience and
    outcomes.

  We expect you to have:

  - Technical depth: 2+ years of professional experience as a
    full stack software engineer delivering high-quality,
    production-grade software.
  - Full-stack expertise: Strong experience across the stack,
    with deep strength in either frontend or backend technical
    design and implementation.
  - Modern engineering toolkit: Hands-on experience with
    technologies such as TypeScript, Node.js, React, Next.js,
    Postgres, RPC-based architectures, and cloud platforms
    like AWS.
  - Product and UX mindset: A strong belief in great design and
    user-centered problem solving, with experience building
    intuitive, polished user experiences.
  - AI fluency: Familiarity with modern AI technologies and an
    interest in applying LLMs and automation to development
    processes and real-world product challenges.
  - Healthcare awareness: Experience building systems that work
    with sensitive data and regulated environments, or a
    strong interest in learning healthcare workflows and
    constraints.
  - Clear communication: Ability to explain complex technical
    concepts clearly to both technical and non-technical
    stakeholders.
  - NYC-based: You are based in New York and excited to be in-
    office ~3 days per week.

  Target compensation for this role is $170-$220k, plus equity
  and a generous benefits package.

  Thesis Care is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, genetics, disability,
  age, or veteran status.
