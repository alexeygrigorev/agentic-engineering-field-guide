description: |
  About the Role

  We're looking for an Android Software Engineer to help build
  and improve a mobile app used by millions of people
  worldwide. You'll work with product, design, and fellow
  engineers to ship polished, high-performing features. You'll
  also help keep the app stable, accessible, and a pleasure to
  use.

  Key Responsibilities

  - Design, build, and ship new features for a large-scale
    consumer Android app
  - Write clean, well-tested, maintainable code in Kotlin
  - Collaborate with designers to deliver smooth, accessible,
    and visually polished experiences
  - Monitor and improve app performance, stability, and crash
    rates
  - Partner with back-end engineers on APIs and data flows that
    power mobile features
  - Take part in code reviews and help maintain strong
    engineering standards

  Qualifications

  Required

  - 4+ years of professional Android development experience
  - Strong proficiency in Kotlin and the Android SDK
  - Experience with modern Android architecture patterns and
    Jetpack libraries
  - Experience shipping and maintaining apps in production on
    the Google Play Store
  - Familiarity with automated testing for mobile apps

  Preferred

  - Experience with Jetpack Compose
  - Experience with large, modular codebases and multi-team
    development
  - Background in consumer, marketplace, or travel apps

  Key Details

  - Start Date: Flexible
  - Duration: Long-term contract (length to be confirmed)
  - Location: Remote (within the U.S.)
  - Work Schedule: Full-time, 40 hours/week, Monday-Friday
  - Pay Rate: $65-$73/hour
  - Employment Type: W-2 (no C2C or 1099)
  - Work Authorization: Must be authorized to work in the U.S.
    without sponsorship.
  - Engagement: Contract role through Maleda Tech.
