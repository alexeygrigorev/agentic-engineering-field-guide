description: |
  Why Socure?

  Socure is building the identity trust infrastructure for the
  digital economy — verifying 100% of good identities in real
  time and stopping fraud before it starts. The mission is
  big, the problems are complex, and the impact is felt by
  businesses, governments, and millions of people every day.

  We hire people who want that level of responsibility. People
  who move fast, think critically, act like owners, and care
  deeply about solving customer problems with precision. If
  you want predictability or narrow scope, this won’t be your
  place. If you want to help build the future of identity with
  a team that holds a high bar for itself — keep reading.

  About the Role

  DocV Solution Engineering is part of the Product Engineering
  organization and plays a critical role in accelerating
  customer adoption, enabling the field, and improving system
  reliability. We are seeking a Senior Manager to lead the
  DocV Solution Engineering team and partner closely with
  Customer Success, Commercial, Product, and Engineering
  teams.

  This role focuses on short-term, high-impact technical work
  that enables revenue, accelerates rollout of new DocV
  features, and improves platform stability—while core backend
  and frontend teams remain focused on long-term product
  roadmap delivery.

  What You’ll Do

  - Build and lead a Solution Engineering team embedded within
    Product Engineering.
  - Partner closely with Customer Success and Commercial teams
    to unblock implementations and accelerate customer
    outcomes.
  - Deliver short-term technical initiatives that enable field
    teams and support active customer engagements.
  - Collaborate directly with customers on complex DocV
    integrations and deployment challenges.
  - Develop targeted features, prototypes, and integrations that
    accelerate adoption of new DocV capabilities.
  - Identify and address integration-related technical debt to
    improve reliability, stability, and operational
    robustness.
  - Establish a strong feedback loop between customers, Customer
    Success, Product, and Engineering teams.
  - Collaborate with Backend and Frontend teams to transition
    validated solutions into the core product roadmap where
    appropriate.
  - Anticipate recurring customer and field needs and drive
    scalable, repeatable solutions.

  What You Bring

  - 8+ years of engineering, solutions engineering, or technical
    consulting experience.
  - At least 3 years of experience leading customer-facing or
    hybrid engineering teams.
  - Strong understanding of APIs, SDKs, and enterprise
    integration patterns.
  - Ability to deliver production-quality solutions in fast-
    paced, ambiguous environments.
  - Strong communication skills and experience working across
    technical and non-technical stakeholders.

  Socure is an equal opportunity employer that values
  diversity in all its forms within our company. We do not
  discriminate based on race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status. If you need an
  accommodation during any stage of the application or hiring
  process—including interview or onboarding support—please
  reach out to your Socure recruiting partner directly.

