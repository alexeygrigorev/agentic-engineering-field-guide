description: |
  At Protegrity, we lead innovation by using AI and quantum-
  resistant cryptography to transform data protection across
  cloud-native, hybrid, on-premises, and open source
  environments. We leverage advanced cryptographic methods
  such as tokenization, format-preserving encryption, and
  quantum-resilient techniques to protect sensitive data. As a
  global leader in data security, our mission is to ensure
  that data isn’t just valuable but also usable, trusted, and
  safe.

  Protegrity offers the opportunity to work at the
  intersection of innovation and collaboration, with the
  ability to make a meaningful impact on the industry while
  working alongside some of the brightest minds. Together, we
  are redefining how the world safeguards data, enabling
  organizations to thrive in a GenAI era where data is the
  ultimate currency. If you're ready to shape the future of
  data security, Protegrity is the place for you.

  Protegrity is seeking a passionate and talented Senior
  Manager of Engineering to join our Engineering organization.
  This position is a remote role.

  Role Overview

  You enjoy leading teams that ship customer-facing product
  experiences at scale. You bring strong front-end engineering
  depth, pair it with pragmatic people leadership, and love
  building reusable platform capabilities that help multiple
  product teams move faster.

  In this role you’ll lead 2–3 product teams (including the
  core UI team), set technical direction for a micro-frontend
  architecture and shell SDK, and stay close to the
  code—especially when a problem needs hands-on help. You’ll
  also champion AI-assisted development practices to
  accelerate delivery while keeping quality, security, and
  accessibility bar-high.

  What You’ll Do

  - Lead 2–3 product engineering teams (including the core UI
    team), providing day-to-day management, coaching,
    mentoring, and performance support while maintaining a
    strong technical presence.
  - Set technical direction for the UI platform: micro-frontend
    architecture, React/TypeScript standards, shell SDK
    interfaces, module contracts, and shared design-
    system/theming patterns.
  - Drive engineering execution: sprint planning, technical
    prioritization, code reviews, and hands-on contributions
    to unblock delivery and improve reliability.
  - Establish and evolve CI/CD for independently deployable
    front-end modules, including build pipelines, artifact
    management, automated testing, and safe rollout practices.
  - Ensure reusable UI and service capabilities are well-
    designed and documented (including company-wide ‘skills
    files’/patterns), and guide integration with supporting
    backend services such as user management and
    authorization.
  - Partner closely with Product Management to define roadmap,
    scope features, and deliver high-impact product outcomes.
  - Define and maintain clear module contracts, API descriptors,
    and SDK interfaces to enable independent development
    across teams.
  - Promote scalable integration patterns including event-driven
    communication and shared state approaches across modules
    and services.
  - Drive engineering best practices across teams including
    coding standards, testing strategies, and development
    workflows (including AI-assisted tools where appropriate).

  What You’ll Need

  - 8+ years of software engineering experience with 3+ years
    leading and managing engineers (or equivalent combination
    of education and experience).
  - Strong React 18+ expertise (hooks, Suspense, StrictMode,
    error boundaries, lazy loading) and modern TypeScript
    patterns.
  - Deep experience with Webpack 5 and Module Federation or
    similar approaches to modular front-end architecture.
  - Experience designing and operating micro-frontend systems or
    other independently deployable UI architectures.
  - Solid experience integrating or developing backend services,
    including API design and microservices-based
    architectures.
  - Familiarity with event-driven communication patterns
    (pub/sub) and cross-module state management approaches.
  - Experience implementing or working with authentication and
    authorization patterns (e.g., JWT, RBAC).
  - Experience with CI/CD pipelines and modern development
    practices including testing and code quality standards.
  - Strong collaboration skills with product, design, and
    engineering teams, with the ability to balance technical
    decisions and delivery outcomes.

  Nice to have

  - Experience with containerization and Kubernetes or similar
    cloud-native deployment models.
  - Strong understanding of UI architecture concepts such as
    design systems, theming, and responsive design.
  - Experience with accessibility standards (WCAG 2.1) and
    building inclusive user experiences.
  - Exposure to AI/LLM-powered UI experiences or developer
    productivity tools.

  Should you accept this position, you must consent to and
  pass a Background Investigation, which includes (subject to
  country law), extended education, and additional criminal
  and civil checks.

  We offer a competitive salary and comprehensive benefits
  with generous vacation and holiday time off. All employees
  are also provided access to ongoing learning & development.



  Ensuring a diverse and inclusive workplace is our priority.
  We are committed to an environment of acceptance where you
  are free to bring your full self to work. All qualified
  applicants and current employees will not be discriminated
  against on the basis of race, color, religion, sex, sexual
  orientation, gender identity, age, national origin,
  disability or veteran status.



