description: |
  Why Socure?

  Socure is building the identity trust infrastructure for the
  digital economy — verifying 100% of good identities in real
  time and stopping fraud before it starts. The mission is
  big, the problems are complex, and the impact is felt by
  businesses, governments, and millions of people every day.

  We hire people who want that level of responsibility. People
  who move fast, think critically, act like owners, and care
  deeply about solving customer problems with precision. If
  you want predictability or narrow scope, this won’t be your
  place. If you want to help build the future of identity with
  a team that holds a high bar for itself — keep reading.

  About the Role

  Socure is seeking a highly skilled and experienced Staff
  Backend Engineer to join our dynamic engineering team within
  the Technology Center of Excellence. In this critical role,
  you will be a technical leader, driving the design,
  development, and deployment of innovative software solutions
  that help eliminate identity fraud. You will work closely
  with cross-functional teams, mentor junior engineers, and
  ensure the delivery of high-quality, scalable, and secure
  products. At Socure, we value teamwork, outcome-driven
  development, and a commitment to best-in-class technology
  experiences.

  What you will do:

  In this role, you will provide technical leadership by
  designing and implementing complex core components and
  distributed systems, while architecting solutions for
  scalability, security, modularity, and long-term
  maintainability. You will conduct code and architecture
  reviews to ensure alignment with Socure’s standards and
  industry best practices. As a Staff Backend Engineer you
  will drive the planning, execution, and delivery of large,
  complex initiatives, coordinating work across a small team
  of engineers and effectively managing scope, timelines, and
  resources. You will also play a key role in team
  collaboration and mentorship by providing technical
  guidance, supporting system design efforts, and fostering a
  culture of engineering excellence and continuous
  improvement. Additionally, you will contribute to innovation
  and impact by proactively proposing new projects,
  identifying opportunities to enhance platform performance,
  reliability, and developer productivity, and helping evolve
  Socure’s engineering practices and standards.

  What you bring:

  - Bachelor’s degree in Computer Science or a related field, or
    equivalent practical experience
  - 8–12 years of professional software engineering experience
  - Proven experience leading complex, large-scale engineering
    projects
  - Expert-level programming skills and mastery of software
    engineering principles
  - Strong experience designing and building scalable,
    distributed systems
  - Ability to develop complex systems while guiding
    architectural decisions for a team
  - Deep understanding of system design, performance
    optimization, and reliability

