description: |
  🌎 About Us

  TeamSnap is made up of innovators, technologists, builders,
  and problem-solvers shaping the future of youth sports.
  We’ve been setting the standard in youth sports technology
  since we were founded in 2009.

  We hire for big ideas and tiny egos — which is part of how
  we landed on Outside Magazine's Best Places to Work, Built
  In's 100 Best Remote-First Places to Work and, for several
  years running, Sports Business Journal’s Best Places to Work
  in Sports.



  TeamSnap is seeking a Staff Software Engineer, Backend, to
  join our fully distributed engineering team and help us
  continue scaling systems that serve millions of daily users
  and tens of thousands of amateur sports organizations. Our
  primary backend stack includes Node and TypeScript,
  alongside Elixir, SQL, cloud-based services, event-driven
  systems, queues, background jobs, caching layers, and
  observability tooling.

  We are looking for a hands-on Staff Backend Engineer with
  deep, meaningful production Node experience who can build
  and improve APIs and services, reason through production
  issues across the system, lead technical design in ambiguous
  areas, mentor engineers, and raise the quality bar across
  the team. This person should bring strong systems thinking
  that connects application architecture with infrastructure,
  platform, data, security, and other adjacent domains,
  bringing those teams into architecture and solutioning
  conversations early without being expected to own those
  functions directly.

  As an engineering team, we architect and build scalable
  systems using service-oriented and event-driven
  architecture. This role will help shape the technical
  foundation behind TeamSnap’s product experience, with a
  focus on backend systems, APIs, services, data performance,
  reliability, observability, and production quality.

