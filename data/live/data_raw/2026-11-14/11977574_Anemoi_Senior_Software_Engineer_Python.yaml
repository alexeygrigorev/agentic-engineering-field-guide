description: |
  Senior Software Engineer (Python)

  About Anemoi Marine Technologies

  At Anemoi, we’re on a journey to shake up the maritime
  industry with cutting-edge Rotor Sail technology. From our
  headquarters in the UK and production base in China, we’re
  developing and delivering advanced, automated wind-assisted
  propulsion systems that help shipowners and operators reduce
  fuel consumption and emissions… propelling the shipping
  industry toward a more sustainable, decarbonised future.

  Our goal is ambitious yet simple: save 1,000 tonnes of CO2
  per day by installing 500 Rotor Sails by 2030. Picture
  fleets of ships sailing world’s oceans with our Rotor Sail
  technology, harnessing renewable wind power to get the job
  done cleaner and more efficiently. We’re making that happen,
  one ship at a time.

  We take ground breaking science and real-world engineering
  and turn it into products that work operationally at sea.
  Our diverse and collaborative teams work side by side, and
  around the globe, driven by a passion for sustainability and
  a relentless pursuit of technical excellence.

  The mission, should you choose to accept, is to protect the
  maritime environment by harnessing the power of wind!

  About the Role

  Contract Length: 3 to 6 months

  Location: London

  We are looking for an experienced Software Engineer to build
  on and lead the hands-on development of Anemoi's existing,
  early-stage scientific and engineering software for a
  defined period.

  You will work closely with Anemoi's engineers and analysts
  to turn established and evolving technical methods into
  dependable software. You may also contribute to other
  Python, data, and scientific-software projects where your
  experience can add value.

  This role combines delivery with technical leadership. You
  will make pragmatic architectural decisions, establish
  effective development practices, and leave the software in a
  state that a permanent engineer can confidently maintain and
  extend. A successful handover - including documentation,
  automated checks, clear technical decisions, and knowledge
  sharing - is therefore a core part of the assignment.

  You do not need previous experience in Anemoi's technical
  domain, but you should be comfortable learning unfamiliar
  engineering concepts and working closely with subject-matter
  experts.

   Outside IR35 contract option may be considered for suitably
  experienced candidates.

  What you will do

  Lead the design, development, testing, and delivery of
  scientific and engineering software.

  Work with engineers and analysts to turn technical methods
  and business needs into clear requirements and dependable
  software.

  Make pragmatic architectural decisions that balance current
  delivery with long-term maintainability.

  Establish and embed practical standards for development,
  testing, documentation, version control, code review,
  continuous integration, and releases.

  Ensure scientific calculations and results are appropriately
  reproducible, traceable, and verified.

  Document the software, share knowledge, and provide a
  structured handover to its long-term owner.

  Contribute to other scientific and engineering software
  projects where required.

  What we are looking for

  Essential

  Professional software development experience, typically four
  or more years, with evidence of leading the delivery of non-
  trivial software.

  Advanced Python skills and strong judgement in software
  architecture, modularity, error handling, and the design of
  clear, maintainable Python interfaces.

  Experience designing, building, testing, packaging, and
  releasing reusable Python libraries or applications.

  Experience establishing effective engineering practices,
  including automated testing, code review, documentation,
  dependency management, continuous integration, and version
  control with Git.

  Experience with numerical, scientific, engineering, or data-
  intensive software, including appropriate verification of
  calculations and edge cases.

  The ability to understand an unfamiliar method, identify
  ambiguity, and work with subject-matter experts to define
  precise, testable behaviour.

  Working knowledge of SQL, including writing queries to
  retrieve, filter, join, and aggregate data.

  A pragmatic approach to technical leadership, with the
  ability to set direction and raise standards while
  continuing to deliver working software.

  Strong written and verbal communication, including
  experience documenting technical decisions, sharing
  knowledge, and handing over software to other engineers.

  The ability to become productive quickly, work with a high
  degree of independence, and deliver effectively within a
  time-limited engagement.

  Desirable

  A degree or equivalent experience in computer science,
  engineering, mathematics, physics, or another quantitative
  discipline.

  Experience with scientific and data tools such as NumPy,
  SciPy, pandas or Polars, Pydantic, Plotly, or equivalent
  technologies.

  Experience with time-series or sensor data, data validation,
  numerical optimisation, simulation, statistics, or
  uncertainty analysis.

  Familiarity with typed Python, developer and user
  documentation, linting and formatting tools, and modern
  Python project tooling.

  Experience verifying scientific software against analytical,
  experimental, or independently produced reference results.

  Experience taking ownership of an early-stage codebase and
  preparing it for continued development by another engineer
  or team.

  Experience working in an engineering-led or renewable-energy
  business.

  Experience handling commercially sensitive or customer-
  supplied technical data.

  We do not expect one person to arrive with every desirable
  skill. If the core role appeals to you and your experience
  is transferable, we encourage you to apply.

   Why join Anemoi?

  Apply software engineering to a tangible technology that can
  reduce fuel use and emissions from global shipping.

  Take ownership of an important scientific-software project
  and make a visible impact within a defined engagement.

  Establish an engineering foundation that will continue to
  benefit the team after your handover.

  Work on technically interesting problems with engineers,
  analysts, and maritime specialists.
