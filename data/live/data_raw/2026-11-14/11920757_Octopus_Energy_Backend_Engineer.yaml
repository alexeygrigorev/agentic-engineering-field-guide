description: |
  We're making energy fair, clean, and simple for all using
  technology.  Octopus Energy started with a bold idea: to
  build Britain’s first truly digital energy supplier. By
  combining world-class tech with brilliant humans who care
  deeply about customers and driving the renewable energy
  transition, we made it happen and in 2025, we became
  Britain’s largest energy supplier. Octopus Energy Group is a
  global energy transition collective. 10 businesses working
  across 4 continents to tackle energy transformation at
  nearly every front. And we constantly push to make energy
  better. Tirelessly campaigning for fair protections for
  customers. And building innovative technologies that forge a
  path to a green energy system. We’re made up of 10,000+
  authentic, committed people working around the world on
  stuff you'd never expect. We're united by a shared goal: to
  drive the global green energy revolution. Read our Spotlight
  series to meet some of the team. About the role At Octopus
  Tech, you’ll have real ownership, variety, and the chance to
  shape products that make a tangible difference in people’s
  lives - lowering bills, enabling greener living, and
  delivering experiences customers genuinely love. You’ll work
  side by side with teams across marketing, operations, and
  data, and see the impact of your work in the real world,
  fast.



  We embrace flat hierarchies and an open, agile culture that
  fosters innovation, flexibility, and creativity.

  We don’t hang our personalities up with our coats and nor
  should you. At Octopus, we hire great people who get stuff
  done, all whilst being themselves.

  If this sounds exciting, we’d love to chat.

  What you'll have

  We would prefer someone who can work in our London office
  but will consider remote candidates. However, you do need to
  be able to work in the UK.



  Why else you'll love it here

  • Wondering what the salary for this role is? Once you're in
  the interview process with one of our recruiters, it's
  something we always cover as we genuinely want to match your
  experience with the correct salary. The reason why we don't
  advertise is because we honestly have a degree of
  flexibility and would never want salary to be a reason why
  someone doesn't apply to Octopus - what's more important to
  us is finding the right octofit!

  • Octopus Energy Group is a unique culture. An organisation
  where people learn, decide, and build quicker. Where people
  work with autonomy, alongside a wide range of amazing co-
  owners, on projects that break new ground. We want your hard
  work to be rewarded with perks you actually care about! We
  were named the UK's top company to work for in 2025, and we
  ranked in the top ten in the Sunday Times Best Places to
  Work 2026. Our Group CEO, Greg has recorded a podcast about
  our culture and how we empower our people. We’ve also been
  placed in the top 10 companies for senior leadership

  • Visit our UK perks hub - Octopus Employee Benefits



  If this sounds like you then we'd love to hear from you,
  tell us what you care about, why Octopus feels right and
  most importantly, bring us the real you! Applying for jobs
  can be a bit scary so have a nose through some of our tips
  first 🚀



  P.S. Our process usually takes up to 4 weeks, but we’ll
  always do our best to flex around what works for you. Along
  the way, you’ll chat with our recruitment team and your
  Recruiter will help you throughout different stages. Got any
  burning questions before then? Drop us a message at
  talent@octoenergy.com and we’d love to help!



  Are you ready for a career with us? We want to ensure you
  have all the tools and environment you need to unleash your
  potential. Need any specific accommodations? Whether you
  require specific accommodations or have a unique preference,
  let us know, and we'll do what we can to customise your
  interview process for comfort and maximum magic!



  Studies have shown that some groups of people, like women,
  are less likely to apply to a role unless they meet 100% of
  the job requirements. Whoever you are, if you like one of
  our jobs, we encourage you to apply as you might just be the
  candidate we hire. Across Octopus, we're looking for
  genuinely decent people who are honest and empathetic. Our
  people are our strongest asset and the unique skills and
  perspectives people bring to the team are the driving force
  of our success. As an equal opportunity employer, we do not
  discriminate on the basis of any protected attribute. Our
  commitment is to provide equal opportunities, an inclusive
  work environment, and fairness for everyone.
