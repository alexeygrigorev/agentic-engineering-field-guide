description: |
  Position Overview: TruTechnologies is seeking a senior-level
  frontend/full-stack engineer to join our small, but growing
  team. You must have extensive experience with modern
  frontend development frameworks, tools, and full-stack
  integration. The ideal candidate is a technical leader who
  thrives in unstructured environments, takes extreme
  ownership, and bridges the gap between UX design, frontend
  implementation, and backend architecture. This role offers a
  unique opportunity to drive our frontend strategy, architect
  full-stack solutions, and mentor developers while directly
  impacting product success.

  What You'll Do:

  - Lead frontend development using modern frameworks (React,
    Angular, or Vue) and state management solutions
  - Architect and implement full-stack features, integrating
    seamlessly with backend APIs, databases, and cloud
    services
  - Drive technical strategy for frontend performance,
    accessibility, responsive design, and developer experience
  - Evaluate and implement appropriate rendering strategies
    (CSR, SSR, SSG, or hybrid) to optimize performance, and
    user experience
  - Collaborate closely with product managers, UX designers, and
    backend engineers to translate business requirements into
    polished user experiences
  - Effectively manage multiple concurrent initiatives,
    proactively setting priorities and communicating progress
  - Lead architecture sessions, conduct high-impact code
    reviews, and establish engineering standards across
    frontend and full-stack domains
  - Mentor mid- and junior-level developers, fostering a culture
    of ownership, accountability, and continuous learning
  - Identify and execute enhancements to internal- and external-
    facing product offerings

  What You'll Need:

  - 7+ years of professional software development experience,
    with a strong focus on frontend frameworks and full-stack
    integration
  - Proficiency in modern frontend ecosystems (JS/TS,
    React/Angular/Vue, Webpack/Vite, testing frameworks)
  - Solid backend experience (APIs, databases, server-side
    logic, and cloud deployment)
  - Strong understanding of client-side rendering (CSR), server-
    side rendering (SSR), and hybrid approaches, including
    architectural trade-offs and performance implications
  - Deep understanding of system architecture, frontend
    performance optimization, and scalable full-stack patterns
  - Proven track record of technical leadership, cross-
    functional collaboration, and mentoring engineering teams
  - A passion for building user-centric software that solves
    real-world problems
  - Highly adaptable, feedback-driven, and comfortable
    navigating ambiguous or chaotic project environments
  - Exceptional communication skills and a collaborative, team-
    first mindset
  - Experience with Ruby on Rails is preferred
  - Bachelor's degree in Computer Science is preferred, but not
    required
