description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.

  As a Lead Software Engineer at JPMorgan Chase within the
  Commercial & Investment Bank you are an integral part of an
  agile team that works to enhance, build, and deliver trusted
  market-leading technology products in a secure, stable, and
  scalable way. As a core technical contributor, you are
  responsible for conducting critical technology solutions
  across multiple technical areas within various business
  functions in support of the firm’s business objectives.

  Working within the Data Analytics team you will be are
  responsible for applications that store large amounts of
  cross asset market data using KDB technology for real-time
  and historical access. This is an exciting time as we
  migrate to AWS, re-architect our applications and build-out
  greenfield projects.

  Job responsibilities

  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems
  - Develops secure high-quality production code, and reviews
    and debugs code written by others
  - Identifies opportunities to eliminate or automate
    remediation of recurring issues to improve overall
    operational stability of software applications and systems
  - Leads communities of practice across Software Engineering to
    drive awareness and use of new and leading-edge
    technologies
  - Adds to team culture of diversity, equity, inclusion, and
    respect
  - Develop core systems and frameworks based on KDB.
  - Lead team members via book of work management. Improve team
    through SDLC, testing and continuous improvement of coding
    standards.
  - Develop scalable real-time processing solutions using agile
    methodology.
  - Partner with stakeholders to capture requirements and
    deliver solutions.
  - Partner with the application support teams to maintain and
    support the platform.

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and advanced applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Proficiency in automation and continuous delivery methods
  - Proficient in all aspects of the Software Development Life
    Cycle
  - Advanced understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security
  - Development lead experience: requirements capture, task
    decomposition, time and effort estimation, delivery
    planning, testing, user acceptance testing.
  - Deep understanding of KDB technology and Q language. At
    least 7 years of professional experience using KDB. With
    at least an additional 2 years as a Lead.
  - Deep understanding of KDB+tick design and data organization,
    performance implications of different approaches.
  - Practical experience developing/running large datasets and
    optimizing query performance.
  - Practical experience scaling and load-balancing of KDB
    applications.
  - Practical experience building resilient and high-
    availability KDB applications.

  Preferred qualifications, capabilities, and skills

  - Experience with market data venue and vendor data platforms.
  - AWS Experience.
  - Experience in Terraform and Kubernetes from managing

