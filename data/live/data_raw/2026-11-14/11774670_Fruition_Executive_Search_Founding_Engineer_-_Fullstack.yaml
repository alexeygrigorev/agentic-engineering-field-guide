description: |
  Founding Engineer — Fullstack

  On behalf of our client · New York, NY, hybrid · Full-time

  The build: Our client is hiring a founding engineer to build
  the core platform that powers AI agents in supply chain
  operations. You'll own the data pipelines, integrations,
  APIs, and operator console that connect AI to real-world
  systems — ERPs, 3PLs, retailers, and freight partners. This
  is infrastructure work with direct impact: the scaffolding
  you build determines whether customers can trust their AI to
  handle shipments, inventory, and operations reliably.

  What you'll do

  - Take
       customer-facing features from concept to production —
  talk to users, design, build, and observe real usage.
  - Design
       secure, auditable data models and event-driven
  pipelines that power agent workflows.
  - Develop
       internal and external APIs and a real-time operator
  console giving customers full visibility into operations.
  - Build
       first-party integrations with ERPs, 3PLs, retailers,
  and freight partners, plus a resilient sync layer that keeps
  everything in lockstep.
  - Establish
       observability, SLOs, and on-call practices for mission-
  critical workflows where downtime means missed shipments and
  chargebacks.
  - Work
       across the full stack — backend, data engineering,
  frontend — wherever the highest-leverage problem lives.

  Requirements

  What we're looking for

  - 5+
       years building production platforms or infrastructure
  at scale, ideally at startups.
  - Strong
       proficiency in TypeScript/Node, Postgres,
  queues/streams, and cloud (AWS or GCP).
  - Systems
       thinking + product intuition; you care equally about
  developer and operator experience.
  - Versatility
       across backend, data engineering, and frontend — you
  don't wait for someone else to build the other half.
  - Genuine
       interest in hard infrastructure problems with direct,
  measurable business impact.

  Logistics: New York, NY, hybrid — no sponsorship.
