description: |
  Cresta unlocks the true potential of the customer
  experience, turning every conversation into a competitive
  advantage. Cresta’s unified AI platform combines
  conversational AI agents, real-time human agent
  augmentation, and comprehensive conversation intelligence to
  drive revenue and efficiency gains across every channel. The
  world’s leading companies, including United Airlines, Cox
  Communications, and Marriott, use Cresta to power world-
  class customer experiences every day.

  Born from the Stanford AI Lab, Cresta has raised more than
  $270 million from the world’s leading investors, including
  a16z, Greylock, and Sequoia. Cresta’s leadership includes
  some of the leading minds in AI today. Our CEO, Ping Wu,
  founded and led Google's Contact Center AI and Vertex AI
  platforms before joining Cresta to build the future of AI-
  driven customer experiences.

  Over the next few years, AI is going to redefine how people
  all over the world interact with businesses every day. Come
  build that future at Cresta.

  About the role:

  The QM & Coaching Team at Cresta is vital for our post-call
  intelligence products. Our core mission is to utilize Large
  Language Models (LLMs) and advanced AI techniques to
  transform conversations into actionable intelligence,
  streamlining the process of agent performance review and
  coaching. We build systems that deeply analyze agent
  behaviors, delivering structured insights into their
  performance and pinpointing critical areas for improvement.
  Through AI-powered exploration and interactive workflows,
  our work empowers organizations to leverage data-driven
  decisions and enhance the overall customer experience.

  As a Senior Fullstack Engineer, you’ll play a key role in
  building and scaling the no-code platform that powers
  Cresta’s processing capabilities. This platform empowers
  non-technical users to configure conversation workflows,
  apply automation without writing code. You will work across
  the stack—from building intuitive UIs to robust backend
  services—enabling customers to unlock value from
  conversations quickly and flexibly.

  You’ll partner with designers, product managers and AI/ML
  teams to turn complex requirements into delightful and
  performant product experiences. You’ll also help shape the
  future of our no-code architecture, ensuring it scales with
  our product and customer base.

  Responsibilities

  - Design, develop, and maintain end-to-end features for
    Cresta’s no-code processing platform.
  - Build intuitive UI components and visual editors for
    configuring conversation logic and workflows.
  - Architect and implement backend services and APIs to power a
    dynamic no-code interface.
  - Work closely with ML engineers to expose conversation
    intelligence in an accessible and configurable way.
  - Develop data models and storage layers using Postgres,
    ClickHouse, and Elasticsearch.
  - Identify areas for performance improvements and scalability
    in both frontend and backend systems.
  - Ensure reliability, security, and maintainability across the
    full technology stack.
  - Participate in design discussions, code reviews, and
    continuous integration processes.

  Qualifications

  - Proven experience as a Fullstack Engineer, with strong
    frontend and backend contributions to no-code or low-code
    platforms.
  - Deep understanding of modern frontend technologies (React,
    TypeScript, etc.) and design patterns for building complex
    UIs.
  - Backend expertise in Python, Go, or similar languages;
    experience with RESTful APIs and microservices
    architecture.
  - Strong foundation in database systems and data modeling;
    hands-on experience with Postgres, ClickHouse, or
    Elasticsearch is a plus.
  - Experience building platforms or tools for non-technical
    users, especially in AI/ML, automation, or workflow
    spaces.
  - Familiarity with managing state, execution logic, or visual
    programming paradigms is a bonus.
  - Strong collaboration and communication skills—able to work
    effectively across product, design, and engineering teams.
  - Passion for building systems that simplify complex problems
    and empower users.

  Perks & Benefits:

  - Comprehensive medical, dental, and vision coverage with
    plans to fit you and your family
  - Flexible PTO to take the time you need, when you need it
  - Paid parental leave for all new parents welcoming a new
    child
  - Retirement savings plan to help you plan for the future
  - Remote work setup budget to help you create a productive
    home office
  - Monthly wellness and communication stipend to keep you
    connected and balanced
  - In-office meal program and commuter benefits provided for
    onsite employees

  Compensation for this position includes a base salary,
  equity, and a variety of benefits. Actual base salaries will
  be based on candidate-specific factors, including
  experience, skillset, and location, and local minimum pay
  requirements as applicable. We are actively hiring for this
  role in the US and Canada. Your recruiter can provide
  further details.

  This posting will be used to fill a newly-created role.

  Our use of AI in recruiting: We may use AI tools in our
  recruiting process, which require human review and
  oversight. If you have questions about our use of AI or wish
  to opt out, please contact recruiting@cresta.ai (if you are
  opting out, please use the subject ‘Opt-Out’ in your email).

  Recording & AI transcription: We do not authorize candidates
  to record or use AI transcription of any interview by phone,
  notetaker app, AI glasses, or other device. Candidates may
  request an exception or accommodation for review during the
  interview process as needed.

  Recruiting impersonation scams: We have noticed a rise in
  recruiting impersonations across the industry, where
  scammers attempt to access candidates' personal and
  financial information through fake interviews and offers.
  All Cresta recruiting email communications will always come
  from the @cresta.ai domain. Any outreach claiming to be from
  Cresta via other sources should be ignored.
