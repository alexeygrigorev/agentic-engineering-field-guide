description: |
  Data is the foundation of every trading decision we make.
  From financial instruments and corporate actions to market
  calendars, counterparty data, and alternative datasets, the
  breadth and complexity of reference data continues to grow
  alongside the increasing sophistication and interconnected
  nature of global markets. We are looking for a Software
  Engineer to join our Global Data Engineering team to expand
  the coverage, quality, and robustness of our reference data
  products, which power low, medium, and high frequency
  trading strategies across the firm.

  What you'll do:

  - Establish vision and technical direction for major
    initiatives across our reference data platform
  - Expand and harden existing reference data products —
    improving coverage across asset classes and datasets,
    raising data quality, and increasing operational
    robustness
  - Design, develop, support, and maintain critical components
    of our data infrastructure that traders and researchers
    rely on every day
  - Ensure new and existing programs adhere to our coding,
    architectural, and operational standards
  - Develop a deep understanding of trading, exchanges, and the
    diverse data domains that underpin them
  - Collaborate deeply with traders, engineers, and researchers
    to identify gaps, prioritise improvements, and deliver
    datasets that meet the bar of a top-tier trading firm

  What you'll need:

  - Strong engineering instincts and a deep understanding of
    computer science fundamentals
  - Experience writing software in C++, C, C# and/or Python
  - Innovative, big-picture thinking grounded in real-world
    pragmatism
  - Desire to continuously improve in a rapidly evolving
    environment
  - Readiness to set technical direction, promote engineering
    principles, and do the right things

  Who we are

  At Optiver, our mission is to constantly improve the market
  by injecting liquidity, providing accurate pricing,
  increasing transparency and acting as a stabilizing force no
  matter the market conditions. With a focus on continuous
  improvement, we participate in the safeguarding of healthy
  and efficient markets for everyone who participates. As one
  of the largest market making institutions, we are a trusted
  partner of 70+ exchanges across the globe.

  What you'll get

  You’ll join a culture of collaboration and excellence, where
  you’ll be surrounded by curious thinkers and creative
  problem solvers. Motivated by a passion for continuous
  improvement, you’ll thrive in a supportive, high-performing
  environment alongside talented colleagues, working
  collectively to tackle the toughest problems in the
  financial markets.

  In addition, you’ll receive:

  - A performance-based bonus structure, enabling all of our
    employees to benefit from our global profit pool.
  - 27 paid vacation days plus all UK public holidays.
  - Daily breakfast and lunch, along with support on commuting
    expenses.
  - Private medical insurance, pension scheme, and ClassPass
    fitness membership.
  - Training and continuous learning opportunities, including
    access to conferences and tech events.
  - International transfer opportunities for global career
    growth.

  How to apply

  Are you interested in furthering your career on one of the
  most dynamic and exciting trading floors in Europe?  Apply
  directly via the form below. If you have any questions feel
  free to contact our Recruitment team via our recruitment
  inquiry form.

  Please note:

  - We do not require any assistance from third-parties
    including agencies in the recruitment of this role
  - We cannot accept applications via email

  Diversity statement

  Optiver is committed to diversity and inclusion.
