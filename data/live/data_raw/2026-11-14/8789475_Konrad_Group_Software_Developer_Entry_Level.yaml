description: |
  Who We Are

  Konrad is a next generation digital consultancy. We are
  dedicated to solving complex business problems for our
  global clients with creative and forward-thinking solutions.
  Our employees enjoy a culture built on innovation and a
  commitment to creating best-in-class digital products in use
  by hundreds of millions of consumers around the world. We
  hire exceptionally smart, analytical, and hard working
  people who are lifelong learners.

  About The Role

  As an entry level Software Developer you'll be tasked with
  working on either mobile or web applications. Working within
  the software development team, your duties will require you
  to assist in the development of consumer and enterprise
  applications. This role is ideal for entry level developers
  who feel confident in their technical ability and want to be
  a part of the highly-skilled development team at Konrad.

  What You’ll Do

  - Write maintainable, testable, and performant software in
    collaboration with our world class team.
  - Participate in code review and perform extensive testing to
    ensure we deliver high quality software.
  - Research new technology and tools and share those findings
    with the team.
  - Communicate clearly and effectively with all members of our
    team.

  Qualifications

  - Strong command of important programming and computer science
    concepts.
  - Understanding of how web applications are built from end-to-
    end.
  - Fundamental knowledge of core web principals (HTTP, the DOM,
    SSL, web servers).
  - Great interpersonal skills - we work very closely together
    as a team and require a lot of communication.
  - A proactive personality, and a desire to deliver your best
    work.
  - A love for improving software development workflows and
    processes.

  Nice to have

  - If more interested in web application development,
    experience working with one or more of: JavaScript, React,
    Node.js, Python or Java.
  - If more interested in mobile development, experience working
    with one or more of: iOS development in Swift or
    Objective-C, Android development in Kotlin or Java.

  Perks and Benefits

  - Comprehensive Health & Wellness Benefits Package
  - Socials, Outings & Retreats
  - Retirement Planning
  - Parental Leave Program
  - Culture of Learning & Development
  - Flexible Working Hours
  - Work from Home Flexibility
  - Service Recognition Programs

  Konrad is committed to maintaining a diverse work
  environment and is proud to be an equal opportunity
  employer. All qualified applicants, regardless of race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, genetics, disability,
  age, or veteran status will receive consideration for
  employment. If you have any accessibility requirements or
  concerns regarding the hiring process or employment with us,
  please notify us so we can provide suitable accommodation.

  While we sincerely appreciate all applications, only those
  candidates selected for an interview will be contacted.

