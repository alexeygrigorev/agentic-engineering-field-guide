description: |
  Company Description

  Founded and headquartered in Switzerland, Avaloq is
  continuously expanding its global footprint with around
  2,500 colleagues in 12 countries, and more than 170 clients
  in 35 countries. We are an industry-leading provider of
  wealth management technology and services for financial
  institutions around the world, including private banks and
  wealth managers, investment managers, as well as retail and
  neo banks. Our research led approach and continual
  innovation is powered by the passion and creativity of our
  colleagues. We are always looking for talented people to
  join us on our mission to orchestrate the financial
  ecosystem and democratize access to wealth management.
  Avaloq offers the opportunity to work closely with some of
  the world’s leading financial institutions as we jointly
  develop and shape careers. Championing a collaborative,
  supportive and flexible work environment empowers our
  colleagues to reach their full potential.

  Job Description

  You will join an international and dynamic team responsible
  for ensuring the stability, reliability, and continuous
  improvement of Avaloq’s Web & Mobile Banking platform.

  In this role, you will act as a Software Engineer, working
  at the intersection of development and operations. You will
  drive automation, enhance system resilience, and support
  mission-critical production environments.

  Your Responsibilities

  - Deliver high-quality, scalable, and reusable code
  - Implement and support the successful delivery of new
    features, product enhancements, and existing functionality
    improvements
  - Manage tickets end-to-end, including triage, impact
    analysis, troubleshooting, and resolution
  - Collaborate with cross-functional teams to resolve complex
    issues and improve services
  - Support CI/CD pipelines and deployment processes
  - Communicate effectively with stakeholders and manage
    expectations
  - Ensure the stable and efficient operation of Web & Mobile
    Banking and Crypto solutions and related third-party
    applications
  - Support the onboarding of new banking services into service
    delivery and operational support
  - Support testing activities, including functional validation
    and User acceptance testing (UAT)
  - Maintain clear documentation and actively promote knowledge
    sharing and best practices within the team

  Qualifications

  - Proven experience in software engineering, DevOps,
    application support, and production operations
  - Strong understanding of web and mobile application
    architectures and coding, including APIs and
    frontend/backend integrations
  - Knowledge of web infrastructure and security components such
    as DNS, firewalls, WAF, authentication, and identity
    management solutions
  - Experience with mobile application development lifecycle and
    third-party integrations using REST APIs, SDKs, and
    libraries
  - Solid understanding of production environments, monitoring,
    incident management, troubleshooting, and log analysis
  - Hands-on experience with Unix/Linux environments, scripting
    (Python, Bash, Groovy), and related command-line tools
  - Familiarity with CI/CD pipelines, automation frameworks, and
    DevOps best practices
  - Experience with development and deployment tools such as
    Jenkins, Gradle, Artifactory, Elasticsearch, and related
    ecosystems
  - Knowledge of cloud-native technologies, containerization,
    and orchestration platforms including Docker, Kubernetes,
    and OpenShift
  - Degree in Computer Science, Engineering, or a related field,
    with professional proficiency in English and working
    knowledge of Oracle SQL/PL/SQL

  It would be a real bonus if you have

  - Experience in banking and financial services, including
    payment processing, settlement, cut-off times, and
    currency management
  - Proven expertise in mobile application development (iOS
    and/or Android) using technologies such as Kotlin, Kotlin
    Multiplatform, Swift, or Objective-C
  - Strong knowledge of Avaloq Core (ASM and ABRs), ideally
    supported by relevant certifications.
  - Familiarity with the Ergon Product Suite and digital banking
    platforms

  Additional Information

  We realize that managing work life balance is a challenge we
  all face in our daily lives and in order to support with
  this we are pleased to offer hybrid and flexible working for
  most of our Avaloqers to maintain work life balance and
  still continue our fantastic Avaloq culture in our global
  offices.

  In Avaloq we are proud to embrace diversity and understand
  the success of our business is built on the power of
  different opinions, we are whole heartedly committed to
  fostering an equal opportunity environment and inclusive
  culture where you can be your true authentic self.

  We hire, compensate and promote regardless of origin, age,
  gender identity, sexual orientation or any other fantastic
  traits that make us all unique, we have done our best to
  write this advert in an inclusive and neutral way.

  Please be aware that we will not accept speculative CV
  submissions for any of our roles from recruitment agencies,
  and any unsolicited candidate submissions will be exempt
  from any payment expectations.



