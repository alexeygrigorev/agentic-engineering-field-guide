description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  As part of CrowdStrike's Risk Analytics team, you'll be at
  the forefront of cybersecurity innovation, elevating our
  industry-leading "stopping breaches" mission to
  unprecedented levels of sophistication and visibility.
  You'll architect and build the foundational risk
  intelligence platform that powers next-generation security
  insights. Leveraging advanced algorithms and AI, you’ll
  deliver comprehensive visibility into risk compounding,
  attack path analysis, and posture scoring across the entire
  attack surface.

  This is a hybrid role requiring 2-3 days/week in our
  Midtown, Manhattan Office.

  Technical Excellence & Innovation:

  In this pivotal role, you'll harness cutting-edge
  technologies to engineer robust backend services that
  seamlessly analyze massive data streams, execute complex
  risk calculations, and deliver intelligent remediation
  automation. Working primarily with Golang microservices
  architecture and multiple database ecosystems, you'll build
  scalable solutions that protect organizations worldwide from
  evolving cyber threats.

  Leadership & Impact:

  As a technical leader, you'll drive end-to-end product
  delivery, architect scalable solutions, and collaborate with
  cross-functional stakeholders to define priorities and
  scope. Your expertise will directly influence the
  cybersecurity landscape, protecting organizations from
  sophisticated threats while advancing the state of the art
  in exposure management.

  What You'll Do:

  - Backend Architecture: Design and develop scalable backend
    services powering both internal and customer-facing web
    applications with focus on performance and reliability
  - Developer Tools: Create intuitive command-line utilities and
    APIs that integrate seamlessly with our platform ecosystem
  - Infrastructure Design: Architect supporting systems
    including databases, real-time data pipelines, and
    monitoring solutions
  - Cross-team Collaboration: Partner with UX/UI, Sensors, and
    other teams to deliver integrated solutions with
    comprehensive documentation
  - Operational Excellence: Configure advanced monitoring,
    alerting, and maintain high availability for production
    services
  - Continuous Innovation: Drive architectural improvements,
    optimize performance, and enhance user experience through
    iterative refinement
  - Technical Mentorship: Guide junior engineers and contribute
    to technical decision-making processes
  - Service Reliability: Ensure robust, healthy service
    operations with proactive maintenance and incident
    response capabilities

  What You'll Need:

  - 8-10 years of production experience building, delivering,
    and maintaining large-scale distributed systems processing
    high-volume data
  - Experience developing robust, distributed systems using
    frameworks like Apache Spark, Apache Flink, and Kafka to
    handle high-velocity streaming events and large-scale
    batch ETL workloads.
  - Advanced programming expertise in object-oriented languages
    with strong typing (we primarily use Golang and
    Python—we'll help you master our stack!)
  - Proven microservices experience with designing scalable REST
    APIs and distributed communication patterns
  - Strong cloud infrastructure knowledge with major providers
    (AWS preferred, plus Azure and GCP) for provisioning,
    monitoring, and optimization
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.
  - System troubleshooting expertise for complex distributed
    architectures with focus on performance and reliability
  - Engineering best practices experience including testing
    strategies, code reviews, and resilient architecture
    design
  - Collaborative technical skills with ability to mentor junior
    engineers and contribute to technical decisions
  - Bachelor's degree in Computer Science/Engineering or
    equivalent professional experience
  - Strong foundation in algorithms, data structures, and system
    design principles

  Bonus Points:

  - Expertise in tuning and managing batch processing (Spark)
    and/or streaming processing (Flink, Spark Streaming) at
    scale
  - Graph database knowledge and experience with graph
    structures (nodes, edges, relationships)
  - Cassandra and CQL experience with wide-column databases
  - Cybersecurity industry experience or relevant certifications
  - Docker and Kubernetes experience
  - Open source contributions or technical community involvement

  #LI-JC1

