  keep the world moving safely. 

  Entrust's values are a cornerstone of who we are, our future
  business growth and how our people grow through it. We model
  our values by demonstrating that Customer Trust Is Earned,
  moving with purpose because Speed Is Intentional, taking
  accountability because We Own the Outcome, and building a
  collaborative culture where One Entrust Wins Together.



  Get to Know Us 

  Headquartered in Minnesota, Entrust is an industry leader in
  identity-centric security solutions, serving over 150
  countries with cutting-edge, scalable technologies. But our
  secret weapon? Our people. It’s the curiosity, dedication,
  and innovation that drive our success and help us anticipate
  the future. 

  Locations:

  - Portugal - Remote (anywhere in Portugal) or Hybrid (office
    in Lisbon)
  - London, UK - Hybrid, 3 days onsite

  Position Overview:

  As Mobile Engineer at Entrust, you will help our R&D
  organisation build and operate resilient, scalable and
  delightful experiences for our customers. At Entrust, you'd
  be joining a talented and friendly team which loves to
  delight its customers with quality and robust code. We care
  about user and developer experience, and we work in an agile
  way to regularly ship code to production. We're currently
  looking for an iOS Engineer for the Document Experience
  group. The Document Experience owns the end user experience
  of capturing documents. We develop the camera capabilities,
  on device image processing and machine learning to support
  getting a great image while delighting the end user. This is
  delivered through five SDKs (Android, iOS, React Native,
  Flutter & Web), which are embedded into customer
  applications to help users prove their identity. They care
  deeply about image capture quality, accessibility,
  customisation and reducing friction for end-users.

  Responsibilities:

  As an iOS Engineer you will:

  - As an iOS Engineer at Entrust, you will focus on being a
    technical expert in your field and build new products and
    expend on existing products while working with the team to
    further improve our SDK document capture experience
  - Design and deliver solutions that will scale with
    significant volumes, be highly available, performant and
    resilient. We’re on a rapid growth trajectory and have
    interesting problems to solve to ensure our service stays
    robust and delivers good service to our customers.
  - Work closely with product designers, product managers, and
    other engineers to deliver great experiences to our
    customers and their users, leveraging your strong
    understanding of the iOS SDK, API design and mobile
    engineering good practice.
  - Working within the team, prototype and iterate until the
    solutions are impactful and well-polished, supporting
    multiple devices and meeting our accessibility standards.
    Use Swift to develop novel solutions that allow our
    customers to integrate the iOS SDK easily within their
    application, contributing with your knowledge of iOS best
    practices to make their life easier.
  - Improve the reliability and safety of our continuous
    delivery by contributing to our test automation and CI/CD
    pipelines.
  - Contribute to fostering a culture of psychological safety,
    inclusivity, collaboration and continuous improvement
    within the team through participation in retrospectives
    and feedback.

  Basic Qualifications:

  - Proven iOS Experience: 3+ years of hands-on iOS development
    experience
  - UI/UX Best Practices: Good understanding of Apple’s design
    guidelines, mobile user experiences principles, and best
    practices for building intuitive and responsive
    interfaces.
  - API Integration: Proven ability to design and integrate
    RESTful APIs, third-party libraries, and back-end services
    to enhance app functionality.
  - Must have strong experience with Test automation and CI/CD
    pipelines

  Preferred Qualifications:

  - iOS: A portfolio of published apps on the App Store
  - iOS SDK: SDK development experience
  - React Native and Flutter experience

