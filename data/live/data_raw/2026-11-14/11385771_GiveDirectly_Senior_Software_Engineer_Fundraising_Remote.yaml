  Commitment to Safeguarding

  As a global organization working with communities to
  eliminate extreme poverty, GiveDirectly takes the
  safeguarding of its recipients, staff, and partners
  seriously. To that end, GiveDirectly is a member of the
  Misconduct Disclosure Scheme, and will systematically check
  with previous employers about any abuse or misconduct
  related matters involving potential new hires. We may also
  employ other robust pre-hire screens, including in-depth
  reference checks, criminal background checks, and sanctions
  screens.

  These efforts help us continue to build and maintain trust
  with the communities we work with, and prevent abuse to our
  recipients and staff.

  **GD is committed to observing all local, national and
  international laws that protect people and basic human
  rights of all. GD is committed to a policy of “zero
  tolerance when it comes to preventing,  reporting, or
  responding to any form of abuse or  exploitation.” and
  expects anyone who works for GD to uphold the protection and
  safeguarding of our recipients as a priority.**

  Reasonable Accommodations

  We are committed to fostering an inclusive and accessible
  work environment. If you require any accommodations during
  the application or interview process, or to perform the
  essential functions of the role, please email us at
  careers@givedirectly.org with the email subject
  “Accommodation Needed”. We will work with you to ensure
  reasonable accommodations are made to support your needs.

  Want to put your best foot forward on your GiveDirectly
  application? Take a look at our Candidate Application Prep
