description: |
  PTP is a fast-growing system integrator that offers
  strategic Customer Experience (CX) solutions to our clients.
  We are looking for a Senior Front-End Developer to help us
  develop CX solutions that provide our clients with customer
  journeys that achieve results. At PTP we value aptitude and
  creativity as well as experience. We are a diverse
  organization and are looking for bright, passionate, and
  committed professionals who strive to be the best at what
  they do.

  Responsibilities

  - Develop and maintain user interface elements in web
    applications
  - Use Vaadin to develop and maintain applications
  - Work with and help train other members on front-end
    development

  Requirements

  In addition to excellent communication and client
  interaction skills you should have at least 5 years
  experience with:

  - User interface fundamentals including Fitts’ law
  - Refactoring enterprise web applications
  - Expertise in the following technologies
    - HTML
    - CSS and Sass
    - JavaScript
    - Java Servlets
    - AJAX
    - GWT
    - jQuery
    - React,
    - Bootstrap

  Salary is DOE and is extremely competitive. We are a growing
  company with a solid customer base, excellent compensation
  and benefits, and a collaborative yet flexible work
  environment.
