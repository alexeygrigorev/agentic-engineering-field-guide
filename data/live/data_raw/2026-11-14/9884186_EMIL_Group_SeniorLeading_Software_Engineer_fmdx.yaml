description: |
  YOUR ROLE We are building a cloud-native insurance platform
  designed for a future where humans and AI collaborate to
  create, configure, and operate insurance products. Insurance
  systems are traditionally complex, rigid, and difficult to
  change. Our mission is to make them structured, versioned,
  and programmable so that product teams, engineers, and
  eventually AI systems can work with them safely and
  efficiently. As a __Senior / Leading Software Engineer
  (f/m/d/x) AI-Enabled Insurance Platform__, you will help
  design and build the core platform capabilities that power
  this vision. You will work on distributed systems, platform
  architecture, and developer tooling that enable teams and
  customers to build insurance products faster while
  maintaining correctness, transparency, and reliability. This
  role sits at the intersection of platform engineering,
  domain modeling, and AI-enabled software development. WHAT
  YOU WILL BE CHALLENGED WITH * Design and build core platform
  services for a cloud-native insurance system * Architect
  scalable, reliable microservices running on AWS container
  infrastructure * Design APIs, metadata models, and workflows
  that support complex insurance products * Help shape systems
  that are structured and versioned, enabling safe automation
  and future AI-assisted workflows * Use modern AI-assisted
  development tools to accelerate design, coding, and testing
  * Collaborate with Product, Customer Delivery, and Solution
  Architects to turn complex business requirements into robust
  platform capabilities * Review code and mentor other
  engineers, contributing to a culture of strong engineering
  fundamentals and continuous learning * Continuously improve
  our platform architecture, infrastructure, and developer
  productivity WHAT WE ARE LOOKING FOR * Strong experience
  building complex production systems or platform services *
  Comfort designing distributed systems and service
  architectures * Experience with Golang, Python, and/or
  Node.js / TypeScript * Hands-on experience running systems
  on modern cloud infrastructure (AWS or similar) *
  Familiarity with microservices, containers, and CI/CD
  pipelines * A strong focus on system design, data modeling,
  and long-term maintainability * Regular use of AI tools as
  part of the engineering workflow, while maintaining full
  ownership of system correctness * Clear communication and a
  collaborative mindset when working with engineering,
  product, and customer teams * Curiosity and enjoyment in
  tackling complex problems without predefined playbooks Nice
  to Know: Our Tech-Stack: * AWS cloud infrastructure *
  Containerized microservices architecture * gRPC and event-
  driven communication * Golang, Python, Node.js / TypeScript
  * React-based administrative interfaces WHAT WE OFFER * An
  attractive salary package based on your experience,
  qualifications and responsibilities * A remote-friendly
  working model with occasional trips to our Berlin office *
  30 days of holiday leave, plus extra half-days off on 24 and
  31 December * A personal training budget of at least €500,
  or more if necessary, which we will invest together in your
  further development * Exciting opportunities for internal
  development through a fixed role development model, fixed
  feedback cycles and performance reviews. * A company subsidy
  for Urban Sports Club membership to support your well-being
  outside of work * A generously subsidised company pension
  scheme, which we use to work together to make optimal
  provisions for your future * A VSOP programme that lets you
  benefit from the company's success additionally * We provide
  you with modern hardware; you decide whether you want
  Windows or iOS * With weekly company lunches and a well-
  stocked snack bar, everything you need for a quick bite to
  eat is right there * As part of a dynamic and motivated team
  of experts, you benefit directly from the knowledge of your
  colleagues, because team spirit and mutual support are an
  essential part of our culture WHAT'S NEXT? If you
  application impresses us, we will contact you to arrange an
  initial interview with our HR manager.
