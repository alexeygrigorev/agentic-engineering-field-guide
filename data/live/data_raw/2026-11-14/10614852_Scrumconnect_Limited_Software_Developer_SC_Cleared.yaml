description: |
  About Scrumconnect

  Scrumconnect delivers innovative digital solutions that help
  organisations modernise services, improve user experiences,
  and accelerate transformation through agile delivery and
  engineering excellence.

  Role Overview

  We are seeking Software Engineers and Senior Software
  Engineers to support the delivery of secure, scalable, and
  resilient digital services.

  You will contribute to the design, development, testing, and
  deployment of software solutions while collaborating with
  multidisciplinary teams in an agile environment.

  Senior Software Engineers will also provide technical
  leadership, guide engineering standards, and support
  architecture and design decisions across programmes.

  Key Responsibilities

  - Design, develop and maintain software applications and
    services.
  - Build and integrate secure APIs and backend services.
  - Participate in solution design and technical discussions.
  - Support testing, deployment and operational activities.
  - Follow secure software development and DevOps practices.

  Essential Skills & Experience (Must Have)

  - Java
  - Spring Boot
  - Kafka
  - MongoDB
  - API development and integration
  - Basic understanding of Docker images and containers
  - Unit Testing/TDD
  - Gherkin-style BDD testing, preferably using Cucumber
  - CI/CD experience (GitLab, Jenkins or GitHub Actions)
  - Agile delivery experience (Scrum/Kanban)

  Desirable Skills

  - AWS services (SQS, S3, SNS and/or KMS)
  - GitLab CI/CD
  - Gatling or K6 load testing
  - Kubernetes or Amazon ECS

  Senior-Level Experience

  - Experience designing large-scale software solutions
  - Strong understanding of system architecture and data
    modelling
  - Experience working with high-volume production systems
  - Proven ability to mentor engineers and lead technical
    initiatives
  - Strong stakeholder management and communication skills

  Additional Information

  - SFIA Level: 4 & 5
  - Security Clearance: Active SC Clearance required

  Diversity & Inclusion

  Scrumconnect is an equal opportunity employer and is
  committed to creating an inclusive environment for all
  employees. We welcome applications from individuals of all
  backgrounds, experiences and communities, and we are
  dedicated to building diverse teams that reflect the people
  and organisations we serve.
