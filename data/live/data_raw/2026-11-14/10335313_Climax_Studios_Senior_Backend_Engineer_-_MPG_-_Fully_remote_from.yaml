description: |
  At The Multiplayer Group (MPG), we create world-class
  multiplayer experiences through Co-Dev and Full-Dev
  partnerships. Our people-first culture supports a diverse,
  global team in a welcoming and flexible work environment.
  With teams spread worldwide, we prioritise connection—both
  online and in person. Giving back is central to who we are,
  with a focus on local communities, education, and
  sustainability.

  We are looking for a deeply talented, fully remote Senior
  Backend Engineer. You’ll be UK or EU based and you’ll be
  working in a team of backend engineers across MPG. We
  deliver, deploy and help integrate backend services
  alongside external co-dev clients as part of industry
  leading game projects, and collaborate to define solutions
  and implement features on time and to a high standard.

  We’re also growing our pool of AWS Certified engineers - and
  we encourage you to study for the certification using your
  Learning & Development budget when you join us.

  Requirements

  - Experience in game development and having worked on at least
    two game titles in a commercial setting developing server
    backends for AAA games, free-to-play (mobile) games,
    casino apps or similar
  - Experience releasing at least two backend services with a
    large number of concurrent users
  - Production experience with at least one of Java, Golang, C#,
    C++, Kotlin; experience with Python, Node.js and React is
    desirable
  - Experience with cloud platforms: Amazon Web Services, Google
    Cloud and Microsoft Azure; having an AWS Certification
    (Associate or above) would be advantageous

  - Experience with infrastructure as code tools, e.g. Terraform
  - Ability to create supporting documentation, designs,
    comments, etc
  - Ability to discuss technical and production matters
  - Excellent time management and ability to work autonomously
  - Experience building distributed applications
  - Attention to detail with ability to comprehend and follow
    direction
  - Clear communicator with the ability to verbalise conceptual
    thoughts and the willingness to accept constructive
    critique
  - Experience with Git or Perforce, or other source control
    software
  - Ability to adapt to new tools, languages, and concepts as
    required by the project

  - Knowledge of Microservices and Service Oriented
    Architectures (SOA), especially Kubernetes and Docker
  - Experience building a CI/CD pipeline to validate and test
    code
  - Awareness of security/cheating implications of technology
    choices
  - Experience using Gen AI for code generation

  Beneficial

  - Demonstrable database experience with both SQL and NoSQL
  - Understanding of how a backend service integrates with the
    game - experience with Unreal or Unity would be useful but
    not required
  - Experience with high-scale distributed applications with a
    concurrent user base ranging in the hundreds of thousands,
    with high uptime, and performant services
  - An understanding of how to use LLMs to process and query
    structured and unstructured data

  Responsibilities

  - Individual contribution: construct systems, write code,
    deployments, etc.
  - Work with the team lead and stakeholders to estimate and
    prioritise work
  - Work alongside peers to iterate on solutions that fit
    requirements
  - Keep the project lead and producer apprised of revised
    estimates and delivery times
  - Promote and maintain high standards and process: tests,
    CI/CD, documentation
  - Help and support team members in day-to-day work
  - Understand, maintain and expand existing code and develop
    new features or systems

  Benefits

  Please don’t forget to include your CV, a cover letter, and
  links to your GitHub, website or portfolio.

  Our Benefits

  Flexible working: Remote-friendly long before it was the
  norm, with core hours that support both great work and real
  life. Support & wellbeing: Mental health first-aiders,
  therapy and coaching via Myndup, plus private medical
  insurance to help you stay healthy and supported. Pension &
  life cover: A strong pension plan and life insurance to
  support your future and protect your family. Time for you:
  Minimum 25 days’ holiday, a paid winter break, and 3
  volunteering days each year to give back to causes you care
  about. Parental leave: Family-first policies that support
  parents and caregivers with flexibility and balance.
  Levelling up: Annual L&D budget, expert talks, game jams,
  and mentoring opportunities to help you grow your skills and
  career.

