description: |
  Are you passionate about low-level system performance,
  reliability, and security?

  Can you lead a team of world-class engineers delivering
  Linux kernel to a planetary-scale fleet of servers?

  Join our team

  Our team is part of the Cloud Platform Infrastructure Group,
  providing Linux kernel for Akamai's Compute, Delivery, and
  AI platforms. At the core of Akamai infrastructure, we work
  on complex systems that are available 24/7. We focus on
  developing, testing, and optimizing custom Linux kernel
  infrastructure to ensure performance, reliability, and
  security of the Akamai platform.

  Partner with the best

  You will lead an engineering team building, maintaining, and
  testing Akamai's custom Linux kernel. You will guide system
  performance, reliability, and security strategies for a key
  component underpinning Akamai's global platform. You should
  be willing and able to provide hands-on technical
  contributions when needed.

  As an Engineering Manager, you will be responsible for:

  - Leading an engineering team to design, build, and scale
    custom Linux kernel solutions
  - Driving team execution on new feature development,
    performance tuning, vulnerability management, and new
    hardware support
  - Guiding engineers in debugging, isolating, and resolving
    low-level system issues across complex environments
  - Mentoring team members, setting quality standards, and
    fostering continuous career growth
  - Collaborating with cross-functional technical teams and
    open-source communities to deliver results

  Do what you love

  To be successful in this role you will:

  - Have 8 years of relevant experience and a Bachelor's degree
    in Computer Science or related field
  - Have experience managing or leading technical teams within C
    development or Linux kernel environments
  - Possess a solid understanding of Linux kernel internals
    including KVM, network stacks, memory management, and file
    systems
  - Have understanding of vulnerability management, performance
    benchmarking, and kernel debugging tools
  - Demonstrate effective communication, technical leadership,
    and collaborative problem-solving skills

