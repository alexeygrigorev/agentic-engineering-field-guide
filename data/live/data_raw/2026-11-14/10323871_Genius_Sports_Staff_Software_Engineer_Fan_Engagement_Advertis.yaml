description: |
  By bringing together next-gen technology and the finest live
  data available, Genius Sports is enabling a new era of
  sports for fans worldwide, delivering experiences that are
  more immersive, interactive and personalized than ever
  before. Learn more at geniussports.com

  We're upfront about where we use AI in our hiring process.
  Our guidelines cover our approach to the use of AI, as well
  as what you can expect during the interview process. Read
  our full guidelines here. The Role – Staff Software
  Engineer, Fan Engagement & Advertising

  We are looking for a staff software engineer to work on the
  systems and applications that power our Fan Engagement and
  Advertising products. These products harness the power of
  GeniusIQ to create important game insights in real time,
  connect fans to brands and advertisers, deliver and measure
  advertising experiences, and produce differentiated next
  generation content. This role favours engineers who can
  bring a diverse experience and perspective to modern
  technology challenges, and engineers who favour
  collaborative environments.

  What You'll Do

  - Provide guidance and direction to product to help translate
    ideas into practical technical solutions.
  - Design and develop systems and applications, across backend
    services and frontend interfaces, that power our
    automated, real-time Fan Engagement and Advertising
    products.
  - Lead technical discussions, drive architectural decisions,
    and identify opportunities to improve scalability,
    automation, and operational efficiency.
  - Provide mentorship and leadership in our local (in-office)
    and broader engineering community.
  - Introduce and curate controls in code repositories to
    improve outcomes when using software agents to write code.


  What You’ll Bring:

  - Experience building real-time systems and distributed
    services.
  - Experience designing APIs and integrating services.
  - Experience managing relational databases.
  - Experience using messaging systems.
  - Experience building interactive web frontends, ideally with
    modern frameworks such as React and TypeScript.
  - Bachelor’s degree in Computer Science or equivalent
    experience.


  It’ll be a bonus if you know:

  - Cloud hosting and containerization (AWS, Kubernetes, Docker)
  - Building and using design systems
  - Production workflows for content creation (Photoshop,
    content management, and digital asset management)

  The salary for this role is based on an annualized range of
  $240,000 - $255,000 USD. This role will also be eligible to
  take part in Genius Sports Group's benefits plan.

  We enjoy an ‘office-first’ culture and maximize
  opportunities to collaborate, connect and learn together.
  Our hybrid working models differ depending on your role and
  location. Occasional travel may be required.

  As well as a competitive salary and range of benefits, we’re
  committed to supporting employee wellbeing and helping you
  grow your skills, experience and career. Learn more about
  how rewarding life at Genius can be at Reward | Genius
  Sports.

  One team, being brave, driving change 

  We strive to create an inclusive working environment, where
  everyone feels a sense of belonging and the ability to make
  a difference. Learn more about our values and culture at
  Culture | Genius Sports.

  Let us know when you apply if you need any assistance during
  the recruiting process due to a disability.
