description: |
  BeyondTrust is a place where you can bring your purpose to
  life through the work that you do, creating a safer world
  through our cybersecurity SaaS portfolio.

  Our culture of flexibility, trust, and continual learning
  means you will be recognized for your growth, and for the
  impact you make on our success. You will be surrounded by
  people who challenge, support, and inspire you to be the
  best version of yourself.

  The Role

  BeyondTrust is seeking a Sr Software Development Engineer
  with a passion for developing robust software and building
  reliable, scalable, and efficient cloud-based services. As
  part of the Platform Core Services team, you will be
  instrumental in designing and maintaining foundational
  platform capabilities that support multiple product lines,
  including authentication & authorization (AuthN/AuthZ),
  onboarding, RBAC, reporting, auditing, notifications, and
  platform APIs. This role presents an exciting opportunity to
  solve cloud-scale challenges, define best practices, and
  shape the way we build, test, and deliver a world-class
  identity security platform with high reliability and
  performance. Previous experience working on platform, core,
  or shared services teams is highly desired.

  What You’ll Do

  - Develop and Maintain Core Platform Services - Design, build,
    and maintain highly scalable and resilient microservices
    supporting platform-wide capabilities. Ensure our cloud
    platform is modular, extensible, and meets the needs of
    multiple product teams.
  - Enhance System Reliability & Observability - Implement and
    manage robust monitoring and alerting systems using
    Datadog to ensure operational visibility and proactive
    issue resolution. Drive best practices for logging,
    tracing, and monitoring across platform services.
  - Infrastructure as Code & Cloud Automation - Utilize
    Infrastructure as Code (IaC) tools such as Terraform and
    Terragrunt to automate and streamline cloud infrastructure
    provisioning and management. Optimize deployment pipelines
    to improve reliability and developer efficiency.
  - Technical Leadership & Cross-Team Collaboration - Provide
    technical leadership in system design, architecture, and
    best practices for building scalable services. Collaborate
    with product managers, engineers, and other teams to align
    platform capabilities with business needs.  Act as a
    connector across teams, fostering collaboration and
    ensuring smooth integrations.
  - Operational Excellence & Continuous Improvement -
    Participate in operational reviews, post-mortems, and
    reliability initiatives to enhance system stability.
    Create follow-up actions for incident resolution and
    continuously work to improve system reliability and
    scalability.  Drive efforts to reduce technical debt and
    improve engineering efficiency through automation and best
    practices.

  What You’ll Bring

  - Software Development Experience - Proven track record of
    delivering enterprise-ready, cloud-based systems with a
    focus on performance, security, and scalability.
  - Modern Software Practices - Strong proficiency in one or
    more programming languages: C#, Go, or Java. Experience
    with API services, distributed systems, and microservice
    architectures.
  - Cloud & Site Reliability Engineering (SRE) Skills - Deep
    understanding of AWS, Google Cloud, or Azure with hands-on
    experience designing for scalability, observability, and
    reliability. Knowledge of Kubernetes (EKS/GKE), Docker,
    and cloud-native application design.
  - Infrastructure Automation & DevOps - Experience with
    Infrastructure as Code (Terraform, AWS CDK, Terragrunt).
    Proficiency in CI/CD tooling such as GitHub Actions,
    ArgoCD, or Jenkins.
  - Observability & Monitoring - Hands-on experience with
    Datadog, Prometheus, or similar monitoring tools to drive
    operational excellence.
  - Cross-Team Collaboration & Business Focus - Ability to work
    effectively across teams, communicate clearly, and drive
    alignment with multiple stakeholders. A strong
    understanding of customer needs and how technical
    solutions align with business objectives.
  - Platform/Core Services Experience (Highly Desired) - Prior
    experience working on platform, core, or shared services
    teams is highly desirable. Experience building
    foundational services that support multiple product lines
    and teams.

  Who You Are

  - A strong team player who values open and constructive
    feedback and fosters a culture of learning.
  - Someone who communicates value, risks, tradeoffs, and
    recommended direction effectively.
  - Adaptable and flexible, ready to navigate changing
    priorities with a positive mindset.
  - Proactive in identifying and solving problems, with
    persistence and coordination to overcome challenges.
  - Able to balance speed with risk, making data-driven
    decisions while ensuring long-term sustainability.
  - Committed to mentorship and lifting others up, fostering
    shared growth and excellence across the team.

  Better Together

  Diversity. Inclusion. They’re more than just words for us.
  They are the guiding values of how we build our teams,
  cultivate leaders, and create a culture where people feel
  connected.

  We take care of our employees so they can take care of our
  customers. Customers who come from all walks of life just
  like us. We hire incredible people from diverse backgrounds
  because when we are different together, we are stronger
  together.

  About Us

  BeyondTrust is the global identity security leader
  protecting Paths to Privilege™. Our identity-centric
  approach goes beyond securing privileges and access,
  empowering organizations with the most effective solution to
  manage the entire identity attack surface and neutralize
  threats, whether from external attacks or insiders.

  BeyondTrust is leading the charge in transforming identity
  security to prevent breaches and limit the blast radius of
  attacks, while creating a superior customer experience and
  operational efficiencies. We are trusted by 20,000
  customers, including 75 of the Fortune 100, and our global
  ecosystem of partners.

  Learn more at www.beyondtrust.com.

