description: |
  About Vercel:

  Vercel is the agentic infrastructure company, freeing people
  and agents to ship what's next. For more than a decade we've
  helped builders move from idea to production with speed,
  security, and exceptional developer experience.

  Now we're scaling our products for both agents and people to
  ship and run software, built in the open and trusted by
  OpenAI, PayPal, Ramp, Supreme, and millions of developers
  worldwide.

  About the role:

  As an Engineering Manager on the Next.js team, you’ll help
  build and lead the team behind the open source framework
  that powers millions of applications. This is a hands-on
  player/coach role: you’ll be an engineer first and a manager
  second, spending most of your time on technical leadership
  and engineering execution. You’ll guide the evolution of
  Next.js across rendering, caching, routing, build systems,
  and developer tooling, working with Product, Design, and
  engineers across Vercel. This is a hybrid role with 3 in-
  office days per week in San Francisco or New York City.

  What you'll do:

  - Write production code, review pull requests, and debug
    difficult production issues and performance regressions,
    contributing directly to the framework and its supporting
    systems
  - Lead major technical initiatives from exploration through
    architecture, implementation, rollout, and production
    follow-through
  - Set technical direction across rendering, caching, routing,
    build systems, runtime behavior, and developer tooling,
    and raise the bar for code quality, testing, performance,
    and reliability
  - Coach engineers through pairing, design reviews, and code
    reviews, set clear expectations, support career
    development, and take part in hiring
  - Work in public with open-source contributors and partner
    with Product, Design, Infrastructure, and Developer
    Experience teams, so framework changes integrate cleanly
    with the Vercel platform

  What you need:

  - 8+ years of software engineering experience
  - Led engineers or small technical teams as a team lead, tech
    lead, staff engineer, engineering manager, or founder
  - Recent experience writing, reviewing, and shipping
    production code
  - Technical depth in React, framework architecture, or the
    systems behind a large-scale open source project,
    including rendering, caching, routing, build tooling, and
    runtime behavior
  - Built products or infrastructure for developers
  - Use AI tools in your own engineering workflow

  Compensation & Benefits:

  - Competitive compensation package, including equity.
  - Inclusive healthcare package.
  - Learning and growth support, including mentorship and
    opportunities to attend events that build your network and
    skills.
  - Flexible time off.
  - The equipment you need to do your role, plus a work-from-
    home budget to outfit your space.

  The San Francisco, CA base pay range for this role is
  $230,000 to $340,000. Actual salary will be based on job-
  related skills, experience, and location. Compensation
  outside San Francisco may be adjusted based on employee
  location.

  The total compensation package may include benefits, equity-
  based compensation, and eligibility for a company bonus or
  variable pay program, depending on the role. Your recruiter
  can share more details during the hiring process.

  Disclosures:

  - Privacy: Please review our Job Applicant Privacy Policy for
    more information on how we handle your data.
  - Equal Opportunity: Vercel is committed to fostering and
    empowering an inclusive community within our organization.
    We do not discriminate on the basis of race, religion,
    color, gender expression or identity, sexual orientation,
    national origin, citizenship, age, marital status, veteran
    status, disability status, or any other characteristic
    protected by law. Vercel encourages everyone to apply for
    our available positions, even if they don't necessarily
    check every box on the job description.
