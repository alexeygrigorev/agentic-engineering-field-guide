description: |
  About the Role

  Uber Marketplace is at the heart of Uber’s business, with
  Rider Pricing playing a critical role by setting prices and
  targeting promotions for Uber riders. Our team’s mission is
  to drive revenue growth, ridership growth and Uber’s
  profitability through advanced machine learning and data
  science. We build reliable, scalable platforms that optimize
  rider pricing in both real-time and offline systems,
  including baseline trip pricing and targeted discounts.

  The Rider Pricing team is a fast-moving, high-opportunity
  space where you’ll have the chance to make a significant
  impact on the business. On this team, your work will affect
  over 95% of Uber’s mobility business revenue. You’ll work on
  the rider pricing optimization algorithms and systems, to
  build better pricing algorithms, optimization algorithms and
  models.

  In this role, you'll apply advanced machine learning
  technologies, including deep learning, generative AI for
  causal modeling, representation learning and
  personalization, to optimize Uber’s pricing. You will also
  work with serving infrastructure and product teams to design
  and evolve the rider pricing systems to support new product
  and algorithm evolutions and drive Uber’s top-line rider and
  revenue growth.

  What You’ll Do

  - Develop and implement machine learning and optimization
    solutions to solve critical business challenges, including
    rider pricing, discounts, promotion targeting, and
    personalized messaging.
  - Build and scale models and systems for real-time and offline
    promotions, as well as rider pricing.
  - Collaborate with cross-functional teams to ensure alignment
    and drive measurable business outcomes.
  - Work on and have the opportunity to set technical directions
    for key ML, serving, and optimization system components
    that directly impact Uber’s growth.

  Basic Qualifications

  - Bachelor’s degree or equivalent in Computer Science,
    Engineering, Mathematics or related field, with 3+ years
    of full-time engineering experience.
  - 2+ years of ML experience and building ML models
  - Experience working with multiple multi-functional
    teams(product, science, product ops etc).
  - Expertise in one or more object-oriented programming
    languages (e.g. Python, Go, Java, C++).
  - Experience with big-data architecture, ETL frameworks and
    platforms.
  - Solid understanding of latest ML technologies, and
    libraries.
  - Proven track records of being a fast learner and go-getter,
    with willingness to get out of the comfort zone.

  Preferred Qualifications

  - Experience with the design and architecture of ML systems
    and workflows.
  - Experience with building algorithmic solutions in
    production, making practical tradeoffs among algorithm
    sophistication, compute complexity, maintainability, and
    extensibility in production environments.
  - Experience with taking on vague business problems,
    translating them into ML + Optimization formulation,
    identifying the right features, model structure and
    optimization constraints, and delivering business impact.
  - Experience with optimizing Spark queries for better CPU and
    memory efficiency.
  - Experience owning and delivering a technically challenging,
    multi-quarter project end to end

  Responsibilities

  For New York City, NY-based roles: The base salary range for
  this role is USD $171,000 per year - USD $190,000 per year.

  For San Francisco, CA-based roles: The base salary range for
  this role is USD $171,000 per year - USD $190,000 per year.

  For Sunnyvale, CA-based roles: The base salary range for
  this role is USD $171,000 per year - USD $190,000 per year.

  For all US locations, you will be eligible to participate in
  Uber's bonus program, and may be offered an equity award &
  other types of comp. All full-time employees are eligible to
  participate in a 401(k) plan. You will also be eligible for
  various benefits.

