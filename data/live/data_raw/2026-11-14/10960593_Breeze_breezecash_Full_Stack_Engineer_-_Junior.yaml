description: |
  At Breeze, we're building the AI-powered infrastructure
  layer for global commerce, making it radically simpler for
  businesses to sell, get paid, and operate across markets.

  We go far beyond traditional payment processing. Breeze
  combines global payments, AI, stablecoins, and a Merchant of
  Record-like model to take on the complexity businesses
  typically manage themselves, including compliance, risk,
  fraud, chargebacks, reconciliation, and customer support.

  Our goal is simple: let businesses focus on building and
  selling great products while Breeze handles the complexity
  behind getting paid.

  Backed by Sequoia Capital, Multicoin Capital, and The
  Chainsmokers, Breeze is a successful, rapidly growing, and
  exceptionally well-capitalized company. We have the runway
  to think long term while remaining early enough that every
  person joining today can have a meaningful impact on what we
  build.

  Overview

  We are hiring a Junior Full Stack Engineer. You’ll work
  across the stack to help design, build, and ship user-facing
  payment products, turning complex financial workflows into
  experiences that feel simple, fast, and reliable.

  This is a hands-on, product-focused role where you’ll
  contribute to meaningful projects from day one. You’ll write
  production code, solve real customer problems, use AI tools
  to accelerate how you build and learn, and gain exposure to
  the full product development lifecycle.

  You’ll work closely with experienced engineers and partner
  with Product, Design, Operations, Risk, and Compliance,
  giving you the opportunity to learn how great products are
  built in the complex world of payments.

  If you’re curious, eager to learn, love building, and want
  to grow alongside a fast-moving startup, we’d love to meet
  you.

  What You'll Do

  - Build and scale user-facing fintech products that power
    Breeze's payments platform.
  - Use AI tools (Claude Code and similar) as a core part of
    your workflow to scope, plan, and execute large projects
    across a large, multi-service codebase.
  - Independently break down ambiguous, multi-week projects into
    shippable milestones and manage your own execution.
  - Own features end to end, from technical design and
    implementation through iteration based on user feedback.
  - Work in a full stack environment using React.js and
    TypeScript on the frontend, and Node.js and TypeScript on
    the backend.
  - Partner closely with Product and Design to shape product
    requirements, UX decisions, and technical tradeoffs.
  - Design systems that are secure, scalable, and performant in
    a payments and financial context.
  - Collaborate with Risk, Compliance, and Operations teams to
    ensure product workflows meet regulatory and operational
    needs.
  - Communicate clearly with stakeholders and contribute to
    product planning and prioritization.
  - Participate in our on-call and engineering runner rotations,
    triaging production alerts and merchant-facing issues and
    closing them out end to end.

  What We're Looking For

  - Bachelors Degree in Computer Science
  - 2+ years of professional software engineering experience,
    ideally in fintech, payments, or fast-paced startup
    environments.
  - Experience building product-driven, user-facing
    applications.
  - Fluent with AI coding tools; you know how to use them to
    scope work, understand unfamiliar parts of a large
    repository, and ship faster without sacrificing quality.
  - Familiarity with tools that power AI: agent tooling, RAG
    pipelines, prompt engineering, etc.
  - Solid full stack experience with React.js, Node.js, and
    TypeScript, or similar modern frameworks.
  - Product mindset, with genuine care for usability, customer
    experience, and business impact.
  - Strong problem-solving skills and the ability to own
    features from concept to launch. You can take a loosely
    defined project, scope it, sequence it, and deliver it
    with minimal supervision.
  - Excellent communication skills and comfort working cross-
    functionally with non-engineering partners.
  - Familiarity with building scalable, reliable systems and
    modern web architectures.
  - Bachelor's degree or equivalent practical experience.
  - Comfortable operating in fast-moving environments without an
    established playbook.
  - A builder mentality with a strong bias toward action.
  - Comfortable getting into the details and doing the work,
    regardless of seniority.

  Nice to Have

  - Experience at an early-stage or high-growth startup.
  - Exposure to payments, financial APIs, risk systems, or
    crypto and blockchain products.
  - Experience working in large, established codebases or multi-
    service architectures.

  Our Compensation Philosophy!

  The annual base salary range for this role is $115,000 -
  $135,000 in New York. This range represents the minimum and
  maximum annual base salary that Breeze, in good faith,
  expects to pay for this position at the time of posting.
  Actual compensation will be determined based on factors
  including a candidate’s experience, skills, and
  qualifications.

  For candidates outside of New York, compensation will be
  based on the applicable market and location-based pay range.

  The base salary range listed excludes commission (if
  applicable), equity, and benefits.

  Benefits & Perks

  - Health coverage: Breeze covers 100% of employee premiums on
    our competitive base plan and 75% of dependent premiums.
  - PTO: 21 days, plus applicable company holidays.
  - 401(k): Breeze covers all plan administration fees.
  - Equity: Meaningful ownership in the company you're helping
    build.
  - Equipment: A new MacBook Air and whatever else you need to
    do your best work.
  - Office & education allowance: An annual budget for your
    workspace, tools, and professional development.
  - Wellness: A monthly reimbursement to support your well-
    being.
  - Annual global offsite: We bring the global Breeze team
    together every year. Previous destinations include Bali
    and Singapore, with Japan coming next.

  Breeze is an equal opportunity employer. We are committed to
  providing equal employment opportunities to all applicants
  and employees without regard to race, color, religion or
  creed, national origin, ancestry, citizenship or immigration
  status, sex, pregnancy, sexual orientation, gender, gender
  identity or expression, age, marital or partnership status,
  caregiver status, disability, genetic information, military
  or veteran status, height or weight, sexual and reproductive
  health decisions, status as a victim of domestic violence,
  sexual violence, or stalking, or any other characteristic
  protected by applicable federal, state, or local law.

  Breeze considers qualified applicants with criminal
  histories in accordance with applicable federal, state, and
  local laws, including the New York City Fair Chance Act,
  where applicable.

  Why Join Breeze

  - Make an outsized impact: We're successful and still early,
    with meaningful traction and strong financial foundations.
    Lean teams, few layers, and direct access to decision-
    makers mean you'll have real ownership and the autonomy to
    make things happen.
  - Solve hard, meaningful problems: Work at the intersection of
    AI, payments, stablecoins, risk, compliance, financial
    infrastructure, and global commerce as we build an
    intelligent infrastructure layer that goes far beyond
    payments.
  - Build AI-first: AI isn't an add-on. It's central to how
    we're building our products and how our teams operate.
    You'll experiment with new tools, automate the repetitive,
    and continuously rethink how to work smarter.
  - Work with an exceptional team: Join ambitious, curious, low-
    ego people who move quickly, hold a high bar, and care
    deeply about what they build.
  - Grow with Breeze: As Breeze grows, strong performers can
    quickly expand their scope and take on bigger problems.
  - Build for the long term: Backed by Sequoia Capital,
    Multicoin Capital, and The Chainsmokers, we're
    exceptionally well-capitalized with the runway to think
    big.

  In-Office Expectations

  Employees based in our New York City, NY office follow a
  hybrid work model and are expected to work from the office
  three days per week. Employees based in our Singapore office
  are expected to work on-site five days per week.

  In-office expectations may vary slightly depending on role,
  team, and business needs. Certain roles that require closer
  cross-functional collaboration or operational support may
  have additional requirements, which will be discussed during
  the interview process.

  Our approach is designed to support meaningful in-person
  collaboration, team building, and real-time decision-making
  while providing flexibility where applicable. We believe
  this structure enables strong execution, close
  collaboration, and effective teamwork across our global
  offices.

  Come Build With Us!

  We offer a rare combination: the ownership and speed of an
  early-stage company with the traction, backing, and
  financial foundations of a successful business.

  We're building at the convergence of AI, payments,
  stablecoins, financial infrastructure, and global commerce.
  The opportunity is much bigger than building another payment
  processor.

  We're building the intelligent infrastructure layer for
  global commerce, and there's still an enormous amount left
  to build.

  If you want meaningful ownership, hard problems, exceptional
  teammates, and the opportunity to help define what comes
  next, we'd love to hear from you!
