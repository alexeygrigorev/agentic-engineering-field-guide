description: |
  ABOUT RETOOL

  Nearly every company in the world runs on custom software
  for critical operations like tracking performance metrics,
  handling support workflows, building admin dashboards, and
  countless processes you might never have thought of. But
  most companies don't have the resources to properly invest
  in these tools, leading to a lot of old, clunky internal
  software, or worse, teams still stuck in manual and
  spreadsheet workflows.

  AI has changed who gets to build software. The definition of
  "developer" now includes analysts, operators, and domain
  experts creating solutions directly—and the tools they reach
  for are multiplying by the week. That's both an opportunity
  and a challenge: as more people build with more AI tools,
  the risk of shipping ungoverned software into production
  grows just as fast.

  At Retool, we're building the platform that makes all of it
  safe to ship. Build with any AI tool you want, then deploy
  into one place that connects to your real business data,
  enforces enterprise policies automatically, and lets teams
  create once and reuse everywhere with shared, trusted
  components. The cost of building software has collapsed. The
  cost of governing it hasn't—and that's the problem we solve.

  Developers and domain experts have already automated over
  100 million hours of work on our platform, freeing them to
  focus on creative problem-solving and strategic work that
  drives real business value. The people closest to the
  problem can now build the software to solve it, safely, and
  within enterprise guardrails.

  Let's build the future together.

  WHY WE'RE LOOKING FOR YOU:

  Retool is in an exciting hyper-growth phase and we need
  infrastructure engineers to tackle our rapid scaling
  challenges. These scaling challenges are unique both in
  scope and in technical complexity as we scale both the
  company and the product.

  As a member of the Cloud Platform team, you will build and
  automate foundational systems for reliability, security,
  performance, developer velocity, and scale. Whether you’re
  interested in wide breadth or deep depth, there are both
  opportunities for both. You will work cross functionally,
  supporting the engineering, product, design, customer
  success, support, and sales functions.

  IN THIS ROLE, YOU'LL:

  - Scale Retool’s core cloud platform for high availability and
    performance globally
  - Work collaboratively with the rest of the engineering team
    to deliver infrastructure for core and emerging products
  - Evolve our backend architecture/infrastructure for both
    cloud and on-premise deployments
  - Work with the team to set and prioritize our roadmap to
    maximize customer impact
  - Define and automate developer process/workflow
  - Support our systems in production
  - Develop new data solutions
  - Build monitoring and observability for production systems

  THE SKILLSET YOU'll BRING:

  - You have a track record of delivering engineering projects
    and process improvements
  - You have experience scaling cloud infrastructure
  - You enjoy building and productionizing developer
    productivity tools, frameworks, and other aspects of
    platform engineering
  - You have experience with inner workings of Linux, containers
    (Docker, containerd), and container orchestration
    technologies (e.g. docker-compose, Kubernetes)
  - You have a track record of building productive,
    collaborative relationships, both within an engineering
    org and across the broader company
  - You enjoy the ambiguity and high-ownership culture of early-
    stage startups
  - You are pragmatic, solution-oriented, and scrappy
  - You enjoy working collaboratively with a broad range of job
    functions and roles
  - You have experience with our tech stack: Node, Postgres,
    Docker, Kubernetes
  - You have experience scaling relational databases (Postgres
    preferred)
  - You have good knowledge of cloud, on-prem, traffic routing,
    service architecture in multi-region setup.



  For candidates based in the United States, the pay range(s)
