description: |
  THE ROLE & THE TEAM

  Join us to help drive the development of the ZMS
  advertisement platform that strives to inspire, engage, and
  inform Zalando shoppers through unparalleled brand-curated
  and highly relevant advertising experiences, seamlessly
  supporting our customers' shopping journey by empowering our
  partners to promote their brands, stories, and products.

  As a Software Engineer in the content team, you will join a
  team of six engineers responsible for the content that
  Zalando partners (brands, retailers, etc.) show in Zalando,
  including organic and sponsored content. You will own both
  the look and feel of the different formats, like Boards,
  Landing Pages, and Showstopper Ads, as well as the Content
  Studio tooling that partners use to upload their assets and
  compose these formats. The role is mainly backend focused,
  but there will be multiple instances where some frontend
  capabilities will come into play.

  INCLUSIVE BY DESIGN

  At Zalando, our vision is to be the starting point for
  fashion - one that is inclusive by design. We only assess
  candidates based on qualifications, merit, and business
  needs. We welcome applications from people of all gender
  identities, sexual orientations, personal expressions,
  racial identities, ethnicities, religious beliefs, and
  disability statuses. We only want to know why you’re great
  for this role, so please avoid including your picture, age,
  and marital status in your CV as well.

  We want to provide you with a great candidate experience.
  Please feel free to inform us of any accommodations you may
  need, so we can best support and assist you throughout the
  hiring process.

  do.BETTER - our diversity & inclusion strategy:
  https://corporate.zalando.com/en/diversity-inclusion

  Our employee resource groups:
  https://corporate.zalando.com/en/diversity-inclusion/our-
  employee-resource-groups

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

  - Build and Improve: Build and improve our Content Studio
    toolkit that enables our fashion brands to directly plan,
    execute, and monitor advertising campaigns on Zalando's
    advertisement platform
  - Deliver Features: Decompose epics into manageable tasks,
    owning the execution from requirement refinement through
    to deployment and production operations
  - Maintain Engineering Excellence: Elevate our codebase
    through readable, testable, and maintainable code, writing
    automated tests and defining clear acceptance criteria
  - Collaborate and Share Knowledge: Actively participate in
    team discussions, help skill up your peers, and
    collaborate effectively with business stakeholders,
    product managers, and engineering peers
  - Operate What You Build: Deliver the supporting operational
    elements (metrics, alerting, graphs, tracing) to monitor
    performance and assist in root-cause analysis during
    production incidents

  WE'D LOVE TO MEET YOU IF

  - You’re proficient with 3+ years of experience in a Java-
    based language (e.g., Java, Kotlin, Scala) and can quickly
    learn new technologies. Knowledge of JavaScript is a plus,
    but not required.
  - You have experience in developing backend applications,
    designing and developing APIs, and event-driven services
  - You have solid knowledge of operational excellence and
    cloud-oriented infrastructure (AWS, Kubernetes, etc.)
  - You collaborate with product teams to understand user needs,
    call out conflicting requirements, and understand the core
    business KPIs your system impacts
  - You deconstruct complexity when faced with a set of
    requirements, methodically breaking them down into small,
    safe deployment iterations while navigating technical
    constraints

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - Employee shares program
  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Zalando Lounge, discounts from external
    partners
  - 2 paid volunteering days a year
  - Hybrid working model, with flexible hours and up to 60%
    remote per week, actual practice is up to each team to
    best support their collaboration
  - Work from abroad for up to 30 working days a year
  - 27 days of vacation a year to start
  - Relocation assistance available (subject to prior agreement)
  - Family services, including counselling and support
  - Health and wellbeing options (including Gympass)
  - Mental health support and coaching available

  ABOUT ZALANDO & ZALANDO MARKETING SERVICES

  It’s the perfect time to join Zalando’s journey, from being
  a pioneer in the world of e-commerce, to becoming the
  Starting Point for Fashion in Europe. We connect customers,
  brands, and partners across 25 markets.

  Help us drive digital and sustainable solutions for fashion,
  logistics, advertising, and research, bringing head-to-toe
  fashion to more than 49 million active customers.

  Zalando Marketing Services (ZMS) is the 360° marketing unit
  of Europe's leading online platform for fashion and
  lifestyle, Zalando. We work with the world’s largest fashion
  and lifestyle brands and provide them with impactful
  solutions across all marketing touchpoints, access to
  relevant audiences and in-depth data knowledge, as well as
  inspiring creation and content.

  At ZMS we create meaningful connections between brands and
  consumers through a deep understanding of their
  personalities. We work with brands, agencies, and publishers
  from fashion and beyond to produce innovative, impactful
  campaigns that reach the right audience at the right moment.
  Thanks to its holistic mix of cutting-edge and privacy-
  compliant technology, in-depth audience insights, expansive
  reach, and compelling content, brands produce successful
  campaigns across multiple digital marketing channels.

