description: |
  About OUTFRONT

  We are one of North America’s most innovative media
  companies.  We leverage the power of creative excellence,
  unbeatable locations and smart audience data to change the
  game for advertisers.  Our purpose as a company is to help
  people, places and businesses grow stronger.  To do this, we
  make meaningful connections between brands and people when
  they are outside of their homes through one of the largest
  and most diverse sets of out-of-home assets including
  billboards, transit and mobile displays across the U.S.  We
  connect diverse audiences across over 150 markets and
  conduct our business considering all our stakeholders, from
  clients and employees, to the communities where we operate.
  We are committed to creating a diverse and inclusive work
  environment that promotes the growth of our people.  Come
  join our industry-leading team!

  What We Offer

  OUTFRONT offers a comprehensive benefits program including:

  - Medical, Dental, Vision (including same and opposite-sex
    domestic partners)
  - HSA and FSA plans, Family Benefits, Pet Benefits
  - 401(k) Plan with an Employer Match
  - Paid Time Off, Commuter Benefits, Educational Assistance
  - Robust Diversity, Equity and Inclusion program including 7
    Employee Resource Groups (ERGs)

  Role Overview

  We’re seeking a Senior Software Engineer with deep backend
  expertise and enterprise experience to lead the development
  of multiple products and services within our modern
  advertising platform. This role requires strong technical
  ownership, hands-on coding, and a passion for mentoring
  junior engineers.



  You’ll work across a remote-first engineering team to design
  and deliver scalable, secure, and modular systems that
  integrate third-party SaaS solutions with proprietary APIs
  and microservices in an AWS environment. Your leadership
  will help shape the technical direction of the platform,
  elevate team capabilities, and contribute to a high-quality
  engineering culture.

  Key Responsibilities

  - Design, build, and maintain scalable APIs and microservices
    across multiple products and services, including pre-
    sales, contract, inventory, order, creative,
    planning/delivery, billing/revenue recognition, and
    reporting

  - Lead the integration of third-party SaaS platforms and data
    providers into our AWS ecosystem

  - Architect distributed systems for high availability,
    modularity, and fault tolerance

  - Define and enforce service contracts and communication
    protocols (REST, gRPC, GraphQL)

  - Mentor and upskill junior engineers through code reviews,
    pair programming, and knowledge sharing

  - Collaborate with cross-functional teams to align on
    technical strategy and product goals

  - Assist with system design and architecture and contribute to
    long-term platform vision and decision-making

  - Help maintain high standards for interviewing, hiring, and
    onboarding processes

  - Ensure observability, CI/CD best practices, and compliance
    with data privacy regulations (e.g., GDPR, CCPA)

  - Promote engineering excellence through documentation,
    testing, and continuous improvement

  Minimum Qualifications

  - 7–12+ years of software engineering experience, including
    enterprise-scale systems

  - Proven experience owning and delivering multiple backend
    services or products

  - Proficient in modern backend languages (e.g., Java, Go,
    Scala, Python, TypeScript)

  - Deep understanding of distributed systems, microservices,
    and event-driven architecture

  - Experience with cloud-native platforms (e.g., AWS/GCP/Azure,
    Docker, Kubernetes)

  - Strong knowledge of API design, authentication/authorization
    (OAuth, JWT), and versioning

  - Demonstrated ability to mentor junior engineers and foster
    team growth

  - Excellent communication skills in remote-first environments

  Preferred Qualifications

  - Master’s degree or higher in Computer Science, Software
    Engineering, or a related field

  - Prior experience in ad tech, martech, or related industries

  - Familiarity with OpenRTB, VAST, and programmatic advertising
    concepts

  - Exposure to large-scale data pipelines (Kafka, Spark,
    Airflow)

  - Experience working in regulated environments (e.g., data
    privacy, audit compliance)

  Tech Stack Highlights

  - REST/gRPC APIs, API gateways

  - Microservices architecture

  - Kubernetes, AWS Lambda

  - Cloud-native databases, security best practices

  - Modern programming languages and frameworks

  Why Join Us?  Join a fast-paced, collaborative environment
  where your leadership and technical expertise will shape the
  future of advertising technology. OUTFRONT Media offers the
  opportunity to drive innovation at scale and make a lasting
  impact.

  For New York and California, the salary range for this role
  is $150,000-$185,000 per year.  Compensation is determined
  during our interview process by assessing a candidate’s
  experience and skills relative to internal peers and market
  benchmarks evaluated for the scope and responsibilities of
  the position.  Please note that the foregoing compensation
  information is a good-faith assessment associated with this
  position only and is provided pursuant to the New York City
  Salary Transparency Law and California Salary Transparency
  Law.

  To all Recruitment Agencies: OUTFRONT Media LLC does not
  accept agency and unsolicited resumes. Please do not forward
  resumes to our OUTFRONT Media employees or any other company
  location.

  OUTFRONT Media is not responsible for any fees related to
  unsolicited resumes.

  OUTFRONT Media Is An Equal Opportunity Employer

  All applicants shall receive equal consideration without
  regard to race, color, religion, gender, marital status,
  gender identity or expression, sexual orientation, national
  origin, age, veteran status or disability. Please refer to
  the OUTFRONT Media Affirmative Action policy statement.
