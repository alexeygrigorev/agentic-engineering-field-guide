description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  We are seeking an Engineer III to be part of the Data
  Onboarding Team under NG-SIEM. The group focuses on enabling
  3rd party data ingestion and onboarding experience for NG-
  SIEM customers, ingesting several petabytes of data per day
  across multiple regions from 100+ 3rd party data sources.

  Data Onboarding is the first  critical step for a customer’s
  journey into NG-SIEM and data volume directly correlates
  with our ability to detect and hunt threats effectively. Our
  platform is growing to include all  1st and 3rd party data-
  sources and needs to scale to support unlimited data
  ingestion and enable customers to ingest all data.

  You will be part of a team and enable our vision to achieve
  a frictionless onboarding experience across hundreds of
  different data sources, including leveraging AI to build
  autonomous agents that facilitate seamless data onboarding
  for our customers.

  You will be contributing to key product initiatives that
  will require you to collaborate with team members on
  platform-level initiatives, with opportunities to contribute
  and grow into leading cross-team platform initiatives across
  CrowdStrike. This role is hybrid, requiring 2-3 days per
  week on-site at the posted location.

  What You'll Do:

  - Work on enabling data onboarding so customers can ingest
    petabyte-scale at millions of events per second at sub-
    second latencies.
  - Work as part of a cross-functional team including UI, UX and
    Data Scientists
  - Solve hard problems in distributed systems, including high
    availability, reliability, performance and cost
    optimizations
  - Develop systems in Go
  - Support globally available, multi-region systems in
    production
  - Lead and participate in cross-team platform-level
    initiatives and projects

  What You'll Need:

  - Must be a U.S. Citizen or US Permanent Resident.
  - Bachelor’s or Master’s degree in Computer Science or related
    field or equivalent work experience.
  - 7+ years of experience designing, implementing, and
    maintaining multiple software products/systems/releases,
    preferably in a SaaS delivery model, across all phases of
    the development lifecycle.
  - Fluency in at least one programming language, preferably Go.
  - Experience in large-scale (distributed) system architecture,
    high scalability and availability, and optimization
  - Can-do attitude, and that you thrive collaborating in a team
    and are not afraid of taking on responsibilities.
  - Product focus mindset and strong ownership based on the
    mindset “you built it, you own it”
  - Experience with streaming systems like apache kafka,
    transaction db’s, docker and k8s
  - Strong communication skills; working collaboratively and
    confidently with internal stakeholders.
  - Proven ability to prioritize and deliver across multiple
    concurrent workstreams without sacrificing quality.
  - Work in a team of friendly, trustworthy and knowledgeable
    colleagues.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Experience or interest in driving agentic-AI projects
  - Experience with Commercial clouds (GCP, AWS or Azure)
  - Prior experience in Cybersecurity
  - Experience mentoring or informally guiding other engineers
    on technical design or code quality

