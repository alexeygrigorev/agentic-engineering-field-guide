description: |
  About Tavily

  We're building the infrastructure layer for agentic web
  interaction at scale. Our API is designed from the ground up
  to power Retrieval-Augmented Generation (RAG) and real-time
  reasoning in AI systems. By connecting LLMs to high-quality,
  trustworthy web content, we help developers build agents
  that are not only intelligent - but also informed.

  We work with some of the most innovative teams in AI - from
  small startups shaping the ecosystem to the largest
  enterprises deploying AI at scale. Whether it’s powering
  sales assistants, research copilots, or internal knowledge
  tools, we’re the missing link between LLMs and the real
  world.

  The Role: Front-End Engineer

  We’re looking for a Front-End Engineer to own and evolve the
  developer and customer-facing experience at Tavily. You’ll
  build performant, scalable applications that make
  interacting with complex AI infrastructure intuitive and
  seamless.

  You will work primarily in a modern TypeScript/React/Next.js
  stack and collaborate closely with backend, product, and
  design to ship fast and thoughtfully. This role is ideal for
  someone who values clean architecture, strong UX
  fundamentals, and high ownership in a fast-moving
  environment.

  What You'll Do

  - Build and maintain production-grade features using
    TypeScript, React, and modern hooks-based patterns
  - Integrate with RESTful API routes built in Next.js and
    backend services powered by MongoDB and Snowflake
  - Implement secure authentication and authorization flows
    using Auth0, JWTs, and RBAC patterns (Owner/Admin/Member)
  - Develop billing and subscription experiences integrated with
    Stripe

  What You Bring

  - 2–5 years of professional front-end engineering experience
  - Experience building and maintaining applications in Next.js
    (SSR, API routes, routing patterns)
  - Experience integrating authentication systems (Auth0 or
    similar) and implementing RBAC
  - Experience working with production deployment workflows and
    Git-based environments
  - Strong product intuition and attention to detail
  - Ability to thrive in a fast-paced startup environment with
    high ownership
  - Based in NYC or open to relocating

  Nice To Have

  - Experience working with MongoDB, Snowflake, or analytics-
    heavy applications
  - Familiarity with Stripe billing flows and subscription
    management
  - Experience with cookie consent or compliance tooling (e.g.,
    OneTrust)
  - Experience with sanity

  ✨ Perks & Benefits

  Full-time employees at Tavily enjoy:

  🤝 A young, open, and inclusive culture where everyone has
  real impact from day one

  🧠 The chance to build alongside a fast-moving team at the
  forefront of agentic AI

  🍽 Daily team lunches + fully stocked snacks to keep you
  energized

  🦷 Full medical, dental, and vision insurance to keep you
  feeling your best

  🌱 A deep-work culture that values curiosity, creativity, and
  continuous learning

  🏙 Hybrid-friendly setup with offices in New York and Tel
  Aviv

  🛫 Generous time off to rest, recharge, and explore
