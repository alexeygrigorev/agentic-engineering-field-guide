description: |
  Who We Are:

  Harvest Hosts is a high-growth RV travel technology company
  and the largest private RV camping network in North America.
  We manage a portfolio of well-established brands across
  North America and Europe, offering a comprehensive suite of
  products designed to streamline and elevate the RV travel
  experience.

  Our portfolio includes:

  - Harvest Hosts – offering unique overnight stays at ~6,000
    wineries, breweries, distilleries, golf courses, museums,
    and other small businesses across North America
  - Boondockers Welcome – a community-driven platform connecting
    RVers with over 3,000 private property hosts
  - Escapees RV Club – one of the largest and most established
    RV clubs, offering resources, education, events and
    community for all RVers
  - Brit Stops – a UK and Ireland-based membership connecting
    motorhomers with ~1,500 small businesses that allow
    overnight stopovers
  - CampScanner – an alert service that notifies users of open
    campsites at sold-out State and National Parks

  The company’s mission is to advance the technology and
  accessibility of the RVing and campground industry, making
  traveling while supporting national parks, local small
  businesses, and communities easier than ever.

  Who You Are

  We're looking for a senior engineer to help build great
  experiences for our members and hosts, across new features,
  our core membership products, and our mobile apps.

  You have strong engineering fundamentals and recent hands-on
  work in modern front-end technologies. You're comfortable in
  a fast-moving environment where priorities shift, and you
  wear multiple hats. You think about problems and solutions
  with a long-term view while making the practical trade-offs
  that help the company move quickly.

  This is a high-impact role on a small, growing team. You'll
  have real influence over what we build and how we build it,
  and your work will reach a large and active member base.

  If you want to make a meaningful contribution at a company
  with a clear vision, we'd love to hear from you.

  What You Bring

  - Strong fundamentals and architectural depth — 3+ years of
    writing clean, maintainable, well-tested code, with recent
    hands-on work in modern JS frameworks (React/Next.js). You
    care about how systems are structured, not just how
    features look, and can make sound architectural trade-offs
    as the product scales.
  - Mobile development — You've built and shipped React Native
    and Expo apps. Familiarity with automated app testing
    (e.g., Maestro) is a plus.
  - Builds with AI — You use AI to work faster and build
    smarter, from AI-assisted coding to prototyping and
    shipping AI-powered features into the product.
  - Ownership, end-to-end — You own features from problem to
    production: shaping requirements, making the call on how
    to build, and shipping. You work directly with product,
    marketing, customer service, and finance to prioritize and
    refine as you go.
  - Product sense — You help own the customer experience and can
    identify insights, opportunities, and requirements for new
    features.
  - Curiosity — You'll dig into unfamiliar territory, try a new
    technology, or build a proof of concept for a promising
    idea.

  What We Bring to the Table:

  Harvest Hosts is a fully remote company with team members
  located across the United States and Europe. Compensation
  for this role ranges from $130,000 - $150,000 annually.
  Benefits include unlimited PTO, health, dental and vision
  insurance, 401(k) with employer match, and most of all, a
  fun work environment. Remote applicants must be based in the
  United States and may not work from the following states:
  CA, HI or AK. Harvest Hosts appreciates your interest in our
  company as a place of employment. It is Harvest Hosts policy
  to provide equal opportunity for employment to all qualified
  employees and applicants, regardless of race, religion,
  religious affiliation, ancestry, citizenship status, marital
  status, familial status, sexual orientation, gender
  identity, color, creed, national origin, sex, age,
  disability, or veteran status or any other characteristic
  protected by local, state or federal law. This policy
  applies to all areas of employment, including recruitment,
  placement, training, transfer, promotion, termination, pay,
  and other forms of compensation and benefits. Harvest Hosts
  will provide reasonable accommodations to qualified
  individuals.
