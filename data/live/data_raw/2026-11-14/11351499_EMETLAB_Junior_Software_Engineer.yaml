description: |
  About the Job

  The Opportunity

  As a Junior Software Engineer at Emetlab, you will
  contribute to building the technology infrastructure behind
  elite AI training data that powers frontier models
  worldwide. Emetlab is an AI data infrastructure company
  delivering expert-produced, rigorously validated datasets
  and end-to-end AI solutions to laboratories, Fortune 500
  enterprises, ambitious startups, and sovereign AI programmes
  across the globe.

  In this role, you will work alongside senior engineers to
  develop, test, and ship features across our data platform,
  contributor tools, and client-facing systems. You will gain
  hands-on experience with large-scale data pipelines, quality
  assurance automation, and the infrastructure that enables
  over 5,000 domain experts across 120+ countries to produce
  world-class training data. You will be trusted with
  meaningful work from day one, not sidelined with tasks that
  don't matter.

  This is a rare opportunity to begin your engineering career
  at the intersection of AI and data infrastructure, where
  your contributions will be visible, valued, and directly
  tied to the quality of datasets that train the next
  generation of intelligent systems.

  What You'll Do

  Write clean, well-tested code that contributes to Emetlab's
  core platform, data pipelines, and internal tooling.
  Collaborate with senior engineers on the design and
  implementation of new features across our contributor
  platform, quality assurance systems, and client delivery
  infrastructure. Participate in code reviews, giving and
  receiving feedback that elevates the quality of the entire
  team's work. Assist in debugging, troubleshooting, and
  resolving issues across the platform with attention to
  detail and persistence. Contribute to building and improving
  automation that supports our multi-stage quality assurance
  processes and 98%+ accuracy benchmarks. Learn and grow
  rapidly by engaging with modern tools, frameworks, and AI-
  adjacent technologies in a production environment.

  What You'll Need to Succeed

  A degree in Computer Science, Software Engineering, or a
  related discipline, or equivalent practical experience
  through bootcamps, self-directed learning, or personal
  projects. Foundational knowledge of at least one programming
  language such as Python, C#, TypeScript, or JavaScript.
  Familiarity with web development fundamentals including
  APIs, databases, and version control with Git. A genuine
  desire to learn, improve, and take ownership of your growth
  as an engineer. Strong communication skills and a
  collaborative disposition, comfortable working within a team
  and asking thoughtful questions. Genuine interest in AI,
  data systems, or machine learning infrastructure is highly
  valued.

  Role Details

  Employment Type: Full-Time and Part-Time positions available
  Location: Fully Remote Stage: Growth stage, operational

  About Emetlab

  Emetlab is an AI data infrastructure company built on a
  single conviction: the quality ceiling of any AI system is
  determined by its training data, not its architecture or
  compute. We produce expert-crafted, rigorously validated
  training datasets across 12 specialised domains, delivered
  by a global network of over 5,000 vetted domain specialists
  spanning 100+ languages and 50+ specialisations. Beyond
  datasets, we offer end-to-end AI solutions including Fine-
  Tuning, RLHF & Alignment, Red Teaming, Model Evaluation,
  Data Annotation, Synthetic Data Generation, and Pre-Training
  Data Pipelines.

  We are not a crowd-sourcing platform. We are the data
  partner that matches the ambition of the teams building the
  next generation of AI, delivering measurable results: 42%
  accuracy improvements, 3x faster time-to-production, and
  99.4% regulatory precision.

  Equal Opportunity

  Emetlab is an equal opportunity employer. We welcome
  dedicated individuals regardless of gender, race, ethnicity,
  national origin, age, disability, religion, sexual
  orientation, gender identity or expression, or veteran
  status. We believe that extraordinary products are built by
  extraordinary teams, and extraordinary teams are built on
  inclusion, respect, and the understanding that brilliance
  has no single origin.

  If you require accommodation during the application or
  interview process, please reach out to our team and we will
  ensure your needs are met with care.

  Let's build the future of AI training data, together.
