description: |
  🟣 About Airgoods

  Airgoods is building the future of food and beverage
  distribution. Helping independent retailers succeed and
  compete with the largest chains.

  Today, we help emerging brands (think Fishwife, Ghia, and
  David Protein) rapidly grow their wholesale business and
  earn placement into the nation’s best specialty stores.

  We started in January 2023 and have since raised $7M from
  top investors like Y Combinator and Initialized Capital. We
  are a fully in-person company, with an office near Madison
  Square Park in New York City.



  👋 Who you’ll work with

  Paolo (co-founder and CTO): Paolo studied Computer Science
  and Economics at Yale. Previously worked as a software
  engineer at his brother’s startup Momence (YC S20). Grew up
  in Brazil before coming to the US for college. Played soccer
  at Yale and loves sports.

  Elian (co-founder and COO): Elian studied Economics at Yale,
  played on the soccer team alongside Paolo, and captained the
  team for two years. He also worked with Aaron at an emerging
  VC fund for 1.5 years of his time at Yale. Grew up in Asia
  and Europe before moving to Milwaukee before college.

  Aaron (co-founder and CEO): Aaron studied Economics at Yale,
  where he met Elian and Paolo. After Yale, he worked at an
  emerging VC fund in New York with Elian; that fund would
  later write the first check into Airgoods. He grew up
  helping his dad run the wholesale side of a brick-and-mortar
  retail store in Portland, Maine.

  You’ll also be working alongside our three fantastic
  engineers, Emilio, Steven, Evan, and Andrés, Pradnaya, and
  Tomas on the Growth & Ops team!



  🏗️ About the role

  Airgoods is seeking a driven full-stack engineer. We are on
  a high-growth trajectory, and we're looking for someone who
  wants to join us on the journey to building a billion-dollar
  company.

  This position will involve:

  - Engaging deeply from concept to launch in the development of
    our product. From ideation, through design and
    implementation, to the final stages of release and
    iteration.
  - Being obsessed with building beautiful products that create
    value for our users.
  - Being scrappy and ready to jump in wherever needed to
    provide the best experience for our users.
  - Full-stack development of our web-app and mobile app.



  🚀 Who you are

  We are a young company of highly driven and passionate
  individuals building a billion-dollar business. To thrive in
  this environment, you’ll have the following characteristics:

  - You are driven with a strong work ethic - our team is
    committed to going the extra mile, even if it means
    working long nights and weekends to achieve our goals.
  - You prioritize speed and have a bias for action.
  - You strive for excellence in every aspect of your work - you
    take ownership of your outcomes and overdeliver on your
    goals.
  - You’re humble and eager to learn whatever it takes to help
    our team and our customers succeed.
  - You play for the front of the jersey.



  🛠️ What you bring

  Must-haves

  - Production-level experience building full-stack
    applications.
  - Proficient in Typescript to power our frontend React app,
    and NodeJS and Express backend.
  - Expertise in relational databases, preferably PostgreSQL.
  - Attention to detail and passion for building beautiful
    software.
  - Previous experience shipping production-level code using our
    tech stack or similar technologies.

  Bonus points

  - Experience at a start-up or building products from scratch
    and bringing them to market.
  - Experience with advanced front-end technologies such as
    Redux for state management, or modern CSS frameworks like
    Tailwind CSS.
  - Experience in mobile app development, either through native
    development (iOS/Android) or cross-platform frameworks
    like React Native.
  - Expertise in NextJS or other server-side JS frameworks.
  - Experience with monorepos using build systems like
    Turborepo.
  - Experience building scalable backend systems to support
    high-growth products.



  🎁 What we offer

  - $120k - $220k • 0.05% - 0.2%
  - Medical, dental, and vision insurance.
  - Unlimited PTO + two team offsites per year.
  - Expensed dinner in the office Monday - Thursday.
  - $400 / month wellness stipend to encourage you to invest in
    your health.
  - Commuter benefits to get you to and from the office.
  - Dedicated founders who are committed to building an amazing
    team and supporting you.



  Don’t see a perfect fit? Reach out anyway – exceptional
  talent always has a home at Airgoods.
