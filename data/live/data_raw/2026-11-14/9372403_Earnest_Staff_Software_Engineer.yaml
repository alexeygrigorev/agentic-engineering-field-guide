description: |
  Earnest empowers ambitious professionals to make confident
  financial decisions and build the life they envision.

  Earnies are committed to helping borrowers move forward with
  confidence by offering smarter borrowing options with a
  clearer path to taking control of their debt. If you’re as
  passionate as we are about our mission, read more below, and
  let’s build something great together.

  Earnest LLC – Oakland, CA

  Title: Staff Software Engineer

  Duties:

  - The Staff Software Engineer (Multiple Positions Open) at
    Earnest LLC in Oakland, CA willdrive the technical
    strategy and execution for our engineering teams.
  - Lead the development of a scalable, high-performance lending
    ecosystem from customer onboarding to checkout.
  - Architect and build customer-centric financial products,
    ensuring a frictionless and optimized user experience
    andorchestrating large-scale financial transactions.
  - Define and execute the technical vision and best practices
    for a high-performing engineering team. Lead architectural
    decisions to enhance scalability,reliability, and
    efficiency of the lending platform.
  - Collaborate with Product, UX, and Business teams to align
    technology with strategic goals. Design, build, and
    maintain customer-facing lendingapplications using
    Node.js, TypeScript, React/Redux, Angular, Sequelize,
    PostgreSQL, and Docker.
  - Develop and optimize high-quality, testable code,
    implementing unit and integration tests with Mocha, Chai,
    Sinon, and Sequelize.
  - Ensure performance, security, and scalability through best-
    in-class software engineering practices.
  - Identify and resolve defects through debugging, profiling,
    logging, log analysis, tracing, and FullStory session
    replays.
  - Oversee code deployment to Staging and Production
    environments.
  - Partner with Quality Engineers to address issues found in
    testing and improve automated testing coverage.
  - Lead and participate in Agile ceremonies. Break down product
    requirements into engineering deliverables in Jira.
  - Review and provide critical feedback on Product Requirements
    Documents, Epics, and User Stories, influencing the
    technical and business roadmap.
  - Recommend alternative technical solutions to optimize
    delivery speed, enhance customer experience, and reduce
    costs.
  - Maintain technical documentation.
  - Contribute to Earnest’s DevOps culture and participate in
    rotating on-call support for production applications.
  - Position is 100% remote. Salary: $207,585 per year.

  Requirements:

  - Bachelors degree in Computer Science, Software Engineering,
    or a closely relatedfield, plus 3 years of software
    development experience.
  - The 3 years of experience must include 3 years of experience
    with each of the following:
    - building highly distributed micro services;
    - SQL databases, including PostgreSQL, and caching,
      performance, monitoring, and scalability;
    - server-side technologies, including Node.js, Typescript, and
      Javascript;
    - client-side technologies, including React Native and
      Angular.
    - Must include two years of experience with: AWS or similar
      cloud-based infrastructure; and leading the
      architecture, design, development, anddeployment of
      large-scale projects.

  This notice is subject to Earnest LLC's employee referral
  program.

  Interested candidates can online at www.earnest.com/careers
  [earnest.com] or send a resume to
  directrecruiting@earnest.com and reference job code 058.
  Contact Chayna Eno at people@earnest.com if you have
  questions or need information about this application.

