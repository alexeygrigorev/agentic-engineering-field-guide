  What Makes an Earnie:

  At Earnest, our people bring our cultural principles to
  life. These principles define how we work, how we win, and
  what we expect of ourselves and each other:

  - Every Second Counts: Speed is our competitive advantage. Our
    customers need better solutions, and the faster we
    execute, the greater our chance of success.
  - Choose To Do Hard Things: We win by tackling the hard things
    that others avoid, fueled by grit and resilience.
  - Pursue Excellence: Great companies, teams, and individuals
    never settle and are proud of the work that they do.
    What’s good enough today won’t be good enough tomorrow.
    Excellence isn’t a destination; it’s a mindset of
    continuous improvement.
  - Lead Together: Our success comes from how we work together.
    Leadership is not about titles—it is about action. We take
    ownership, drive results, and move forward as a team.
  - Don’t Take Yourself Too Seriously: We take our work
    seriously, not ourselves. The stakes are high, but a sense
    of humor keeps us grounded, creative, and resilient.

  At Earnest, we are committed to building an environment
  where our employees feel included, valued, and heard. Our
  belief is that a strong commitment to diversity, inclusion,
  equity, and belonging enables us to move forward with our
  mission. We are dedicated to adding new perspectives to the
  team and encourage anyone to apply if your experience is
  close to what we are looking for.

  Earnest provides equal employment opportunities (EEO) to all
