description: |
  You are a Senior Fullstack Engineer (m/f/d) with in-depth
  Frontend knowledge driving the end-to-end development of our
  online services. While your primary focus is delivering
  high-performance web-based interfaces, you possess the
  technical depth to navigate our Backend and Mobile ecosystem
  end-to-end. You’ll maintain architectural oversight across
  the entire solution, collaborating with team members to
  engineer holistic technical solutions that translate into
  global well-being. Are you excited to build interfaces that
  impact millions of users? Then apply now as Senior Fullstack
  Engineer (m/f/d) for our team in Berlin. Your daily workout

  - Feature Ownership: You will lead the development of
    customer-facing features, guiding them from initial
    concept and UX testing to full implementation
  - Operational Excellence: You will facilitate engineering best
    practices within our monorepo setup and participate in our
    Communities of Practice to drive platform wellness and
    technical ownership across the organization
  - Technical Leadership: You will provide direction to the
    team, helping define the technical roadmap, system
    architecture, and development processes
  - AI-Enhanced Workflow: You will leverage AI-assisted coding
    tools to accelerate development, improve code consistency,
    and focus on solving high-level architectural challenges
  - Frontend Excellence: You will create complex user interfaces
    with a deep focus on interaction design, clean code and
    testability using industry best practices
  - Cross-Functional Collaboration: You will communicate
    effectively across teams to unblock challenges and design
    scalable solutions that work across the entire EGYM
    ecosystem

  Your fitness level

  - Frontend Mastery: You have at least 7 years of hands-on
    experience in frontend development and operating
    professional web services
  - Web Expert: You possess advanced knowledge of TypeScript,
    React, and are comfortable solving complex UI challenges
  - State & API Management: You are experienced in integrating
    APIs and managing application state using TanStack Query,
    Jotai, or similar modern state managers
  - Backend Literacy: You can comfortably read and reason about
    backend code in our stack (Java/Go), follow data flows
    across microservices, understand service boundaries and
    dependencies, navigate SQL database structures, and
    diagnose the root cause of issues
  - Modern Tooling: You have experience working with design
    systems and a strong commitment to unit, integration, and
    end-to-end testing
  - CI/CD & DevOps: You have a solid understanding of CI
    pipelines and the principles of end-to-end continuous
    delivery
  - Bonus Points: You have experience with web-to-native bridges
    like Ionic, Capacitor, or React Native is a big plus

  Your training goals for the first 6 months

  - Ownership: You take full ownership of your work,
    understanding its architecture and delivering on product
    requirements while improving testability
  - Ecosystem Integration: You become familiar with the EGYM
    ecosystem and the roles of various teams within the
    software engineering department
  - Codebase Proficiency: You contribute effectively and
    confidently to our shared codebase

  The equipment we provide

  - Learning time: Use 10% of your time on learning topics of
    your choice (conferences, hackathons, internal and
    external events, videos, books or innovation projects)
  - Continuous Development: Develop your skills with varied,
    challenging tasks and regular feedback to benefit from a
    steep learning curve
  - Tech Stack: Work with our modern tech-stack such as: Go,
    Kubernetes, Prometheus, Grafana, Terraform, gRPC or
    PubSub. Curious? Then see all the technologies we use
    here: https://tech-radar.co.ts.egym.com
  - Dynamic & International: Be part of a motivated, ambitious
    and international team that uses English as a working
    language - get some team insights
  - Work-Life-Balance: Enjoy a hybrid workplace model, lots of
    flexibility and 30 days of vacation
  - Fit & healthy: Train for free with EGYM Wellpass in several
    thousand sports and health facilities across Germany
    and/or use our in-house gym with EGYM products
  - Flex Budget: Use €60 per month flexibly for public
    transportation and a meal subsidy
  - Mentoring Program: Exchange knowledge and grow together
    across teams and locations through our self-organized
    mentoring platform
  - Discounts: Get a variety of great discounted offers, from
    fashion to leisure, through our employee benefits portal
  - Bike Leasing: Stay active and use our leasing bike offer for
    your way to work or in your spare time
  - Subsidized Pension: Profit from our employer-subsidized
    pension

  Contact Information

  Apply with your documents (CV, salary expectations and
  earliest possible start date) and specify the job ID #2067.
  Contact: Sven Bunkus For further information:
  https://career.egym.com

  About EGYM

  Warning regarding phishing emails: Please be aware that all
  official EGYM recruitment communication is sent exclusively
  from jobs@egym.com. If you receive a suspicious message from
  any other domain, please ignore it and do not share personal
  information if in doubt. EGYM is a global fitness technology
  leader, providing fitness and health facilities with
  intelligent workout solutions. EGYM makes exercising smarter
  and more efficient with its comprehensive suite of connected
  gym equipment and digital products that integrate seamlessly
  with 3rd-party-hard- and software. The result is a fully
  connected training experience that drives measurable
  business and health outcomes on and off the training floor.
  EGYM also offers subscription-based corporate fitness- and
  wellness solutions built on a combination of gym-access and
  EGYM fitness programs that directly target costly chronic
  conditions and boost employee health, leading to higher
  productivity and well-being. EGYM's global headquarters are
  in Munich, Germany, with North American offices in Denver,
  Colorado. EGYM is an equal opportunity employer. All aspects
  of employment including the decision to hire, promote,
  discipline, or discharge, will be based on merit,
  competence, performance, and business needs, regardless of
  race, gender, religion, sexual orientation, age or any other
  aspect of an individual's identity.
