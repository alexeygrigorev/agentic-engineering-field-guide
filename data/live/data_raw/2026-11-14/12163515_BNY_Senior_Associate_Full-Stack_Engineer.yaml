description: |
  Senior Associate, Full-Stack Engineer  At BNY, our culture
  allows us to run our company better and enables employees’
  growth and success. As a leading global financial services
  company at the heart of the global financial system, we
  influence nearly 20% of the world’s investible assets. Every
  day, our teams harness cutting-edge AI and breakthrough
  technologies to collaborate with clients, driving
  transformative solutions that redefine industries and uplift
  communities worldwide. Recognized as a top destination for
  innovators and champions of inclusion, BNY is where bold
  ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary. We’re seeking a future team member for the
  role of Senior Associate, Full-Stack Engineer to join our
  Wealth Services Team in the development and enhancement of
  Investment Analytics applications and capabilities. This
  role is located in Jersey City, NJ or New York, NY. In this
  role, you’ll make an impact in the following ways:

  - Design, implement, and maintain Java & Angular based
    applications that can be high-volume & low-latency.
  - Leads the technical design, development and documentation of
    cross-functional, multi-platform application systems.
  - Providing technical leadership on the implementation of
    application front-ends and user interfaces across the
    group and application portfolio
  - Engage with Product Owners and Business Analysts to
    understand platform requirements.
  - Actively participate in code reviews. Integrate software
    components into a fully functional software system.
  - Apply security and privacy design principles.
  - Ensures that expected application performance levels are
    achieved by coordinating, coding, testing, implementation
    and documentation.

  To be successful in this role, we’re seeking the following:

  - Bachelor's degree in computer science or related discipline,
    or equivalent work experience required.
  - 3-4 years of experience as Java & Angular
    developer/programmer, with specific proficiency in backend
    and frontend development coding languages (Java, Spring ,
    Spring boot , Angular, html, css, NodeJs, Nvm, Json)
  - Must have thorough and demonstrative knowledge on or both
    the user-side frontend of a website, as well as the
    backend, server-side that powers the user-side.
  - Understanding of Micro frontend framework, easily adaptable
    to customized frontend frameworks
  - Understanding of RDBMS (DB2, Oracle), SQL, No-SQL or
    unstructured database will be a plus.
  - Understand nuances of architecture; Familiarity with
    different design and architectural patterns like MVC
    (Model-View-Controller) Pattern, JDBC (Java Database
    Connectivity)
  - Must have RESTful web service experience.
  - Experience with microservices based scalable architectures
  - Understanding of on-prem, container-based cloud frameworks
  - Strong experience in SDLC, DevOps processes – CI/CD tools,
    Git, etc.
  - Experience with event-driven patterns (Kafka, RabbitMQ), and
    distributed caching (Redis, Hazelcast).
  - Familiarity with OAuth2/OIDC/JWT security models.
  - Capable of investigating and resolving production issues by
    checking code & Splunk logs

