title: Engineering Manager (NYC)
company: Raydar
location: New York, USA
work_type: FULL_TIME
company_size: 28 Employees
description: |
  Our client is a fast-growing, AI-native enterprise software
  company rebuilding core financial infrastructure for mid-
  market and public companies. The platform combines AI
  agents, real-time accounting workflows, and rapid ERP
  migrations to replace manual finance operations at scale.
  Founded in 2024 by two entrepreneurs who previously built a
  $100M-revenue business, the company has raised more than
  $100M from leading technology investors, has grown to
  approximately 90 employees, and plans to scale beyond 200
  people.

  This is a hands-on Engineering Manager role reporting to the
  Head of Engineering. You will initially lead 20 to 30 remote
  engineers across Eastern Europe and South America while
  building the managerial systems for a rapidly growing
  engineering organization.

  What you will do

  • Build performance reviews, feedback loops, reporting
  structures, hiring processes, pod organization, and delivery
  metrics.

  • Partner with Product on roadmap planning, prioritization,
  and execution.

  • Make architecture decisions and contribute production code
  in a high-velocity environment.

  • Guide a major infrastructure migration from AWS Fargate
  toward Kubernetes.

  • Hire, coach, and develop strong backend and full-stack
  engineers across multiple time zones.

  • Balance product speed with durable systems, operational
  reliability, and clear ownership.

  Requirements

  • 5 or more years of backend-heavy software engineering
  experience with progression from a strong individual
  contributor into hands-on management.

  • A record of building and scaling an engineering team
  through meaningful growth.

  • Strong Python experience and the ability to write and ship
  production code regularly.

  • Experience making architecture decisions across cloud
  infrastructure, containers, databases, and distributed
  systems.

  • Experience with Kubernetes and AWS or a comparable cloud
  platform.

  • Familiarity with Django, PostgreSQL, Redis, GitHub
  Actions, React, and TypeScript or adjacent technologies.

  • Product-company ownership in a fast-paced startup or high-
  growth environment with rapid deployment cycles.

  • High agency, low ego, and the ability to make fast
  decisions, admit mistakes, and pivot quickly.

  • Bachelor's degree in computer science or an equivalent
  technical discipline.

  • Ability to work on-site five days per week at 7 World
  Trade Center in New York City or willingness to relocate.

  Benefits

  • $250,000 to $375,000 base salary.

  • Approximately $100,000 to $120,000 in competitive equity
  value.

  • Visa sponsorship and existing visa transfers, including
  OPT, H-1B, and TN, may be considered.

  • High-impact leadership ownership in a rapidly scaling
  engineering organization.
