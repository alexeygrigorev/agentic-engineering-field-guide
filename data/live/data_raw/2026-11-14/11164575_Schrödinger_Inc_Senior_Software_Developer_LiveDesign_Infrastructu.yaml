title: Senior Software Developer, LiveDesign Infrastructure
company: Schrödinger, Inc.
location: New York, USA
work_type: FULL_TIME
company_size: 885 Employees
description: |
  Schrödinger seeks a Senior Software Developer to join us in
  our mission to transform the discovery of therapeutics and
  materials.

  As a member of the LiveDesign team, you’ll join a group of
  passionate engineers and scientists in their efforts to
  develop a rich web application that allows scientists to
  leverage the power of Schrödinger’s software platform. Using
  your love for software development and eye for coding
  quality, you will play an essential role in revolutionizing
  the design of novel therapeutics and materials.

  Please note that we expect this hire to work from our New
  York City office on Tuesdays and Wednesdays.

  Who will love this job:

  - A skilled software engineer who’s excited to develop and
    deploy web services with containerization technologies
    (specifically Docker, Kubernetes, Helm, and Tilt)
  - A modern infrastructure operations/automation tools expert
    who enjoys server virtualization, deployment automation,
    and continuous integration and testing
  - A passionate Linux system operator who understands process
    limits, devices, networking, and systems administration
  - A security-minded professional who thinks about ways to
    build systems to harden our infrastructure
  - A problem-solver who enjoys Capture the Flag or other
    technical puzzles
  - An excellent verbal and written communicator

  What you’ll do:

  - Work with various application teams to develop and automate
    the systems that build, test, deploy, and monitor our
    development and production environments
  - Assist in troubleshooting infrastructure-related issues that
    come up "in the wild"
  - Design and develop our internal infrastructure services
    using Terraform, GitHub Actions, python, and bash
  - Exercise your own judgment (along with support from
    teammates) to architect and implement robust, secure, and
    maintainable solutions

  What you should have:

  - Over five years of experience in development,
    infrastructure, and/or systems administration
  - Over two years of experience working with container
    technologies such as Docker and Kubernetes
  - Familiarity with scripting languages such as Python, Ruby,
    Bash, etc.

  Pay and perks:

  Schrödinger understands it’s people that make a company
  great. Because of this, we’re prepared to offer a
  competitive salary, equity-based compensation, and a wide
  range of benefits that include healthcare (with dental and
  vision), a 401k, pre-tax commuter benefits, a flexible work
  schedule, and a parental leave program. We have a company
  culture that is relaxed, but engaged, and over a month of
  paid vacation time.  Our Office Management team also plans a
  myriad of fun company-wide events. New York is home to our
  largest office, but we have teams all over the world.
  Schrödinger is honored to have been included in Crain's New
  York Best Places to Work, BuiltIn's NYC Best Place to Work,
  and Newsweek's list of America's 100 Most Loved Workplaces.



  Estimated base salary range: $155,000 - $270,000. Actual
  compensation package is dependent on a number of factors,
  including, for example, experience, education, degrees held,
  market data, and business needs. If you have any questions
  regarding the compensation for this role, do not hesitate to
  reach out to a member of our Strategic Growth team.



  Sound exciting? Apply today and join us!



