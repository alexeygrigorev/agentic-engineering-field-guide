description: |
  Who We Are:

  Galaxy Digital Inc. (Nasdaq: GLXY) is a global leader in
  digital assets and data center infrastructure, growing the
  economy that runs on code. Galaxy delivers the onchain
  infrastructure that connects institutions to digital assets,
  including trading, advisory, asset management, staking,
  self-custody, and tokenization. Galaxy also develops and
  operates data center infrastructure to power AI and HPC
  workloads. Anchored by its Helios campus in Texas, Galaxy is
  building a multi-gigawatt pipeline of more than 5.7 GW of
  potential capacity, positioning it among the largest and
  fastest-growing data center developers in North America.

  The Company is headquartered in New York City, with offices
  across North America, Europe, the Middle East, and Asia.

  Additional information about Galaxy's businesses and
  products is available on www.galaxy.com.

  What We Value:

  We are a diverse team of free thinkers, and fast movers
  united to help investors and creators energize the global
  economy. We are looking for individuals who thrive in a
  culture of builders and overachievers and embrace high
  performance, transparent feedback, and a mission-first
  approach. Our culture shapes our way of working and gets us
  where we want to be.

  - Seek Excellence.
  - Be Selective To Be Effective.
  - Be Highly Aligned, Loosely Coupled.
  - Disagree Transparently.
  - Encourage Independent Decision-Making.
  - Build Dream Teams.

  Who You Are:

  You'll design and build backend systems powering blockchain
  infrastructure and staking products across Galaxy — spanning
  Ethereum-based systems, staking infrastructure (native and
  liquid), and blockchain data systems and APIs. Liquid
  Collective is one of several key initiatives you'll
  contribute to.

  This is a hands-on role with significant ownership and
  influence. You'll play a key part in shaping architecture,
  development practices, and engineering culture — not just
  building features, but raising the bar on how the team
  works. You'll own systems end-to-end, from architecture
  through to observability, and you'll operate in a spec-first
  development environment that increasingly leverages AI-
  assisted workflows.

  Typical time allocation: roughly 60% building systems and
  features, 20% code review and mentorship, 20% design,
  architecture, and product collaboration.

  What You’ll Do:

  - Build and own backend systems
    - Design and build APIs, services, Ethereum data pipelines and
      indexers, staking and validator infrastructure
      integrations, and monitoring and operational tooling.
    - Own system design end-to-end: architecture, implementation,
      testing, deployment, and observability.
    - Work across the Ethereum stack, integrating with both
      execution layer and consensus layer clients.
    - Contribute to Liquid Collective alongside other staking and
      blockchain infrastructure projects across Galaxy.
  - Define and uphold engineering standards
    - Set and maintain the bar on API design, testing strategies
      for distributed systems, reliability and fault
      tolerance, and security and key management practices.
    - Operate in a spec-first development environment — translate
      product and protocol requirements into clear technical
      specs before building.
    - Leverage AI-assisted development workflows (e.g. Claude
      Code) and work with emerging paradigms like MCP (Model
      Context Protocol) and agent-based tooling.
  - Collaborate and contribute to engineering culture
    - Work cross-functionally with protocol, product, and
      infrastructure teams.
    - Mentor engineers through code review, design feedback, and
      raising the overall quality of what the team ships.
    - Contribute to how the team evolves its practices — not just
      executing within the current system, but improving it.
  - Embrace and champion the thoughtful adoption of AI to
    improve team performance and business outcomes.
  - Leverage AI tools (e.g., generative AI, automation
    platforms, data copilots) to improve productivity,
    decision-making, and output quality in your day-to-day
    work.

  What We’re Looking For:

  - 7+ years of professional software engineering experience.
  - Strong experience building backend systems in Golang.
  - Deep understanding of distributed systems. Experience
    working with blockchain systems, preferably Ethereum —
    including familiarity with execution vs consensus layers,
    node operation, and data flow.
  - Experience with cloud-native infrastructure: AWS,
    Kubernetes, Helm, GitOps (e.g. Flux).
  - Strong testing practices for complex and stateful systems.
  - Experience working in remote, asynchronous teams.
  - High agency, low ego — you own your work end-to-end and hold
    yourself accountable for quality.

  Bonus Points:

  - Hands-on experience with Ethereum nodes (execution and/or
    consensus clients) or validator and staking
    infrastructure.
  - Understanding of proof-of-stake mechanisms.
  - Experience building blockchain indexers, data pipelines,
    dApps, or smart contracts (Solidity).
  - Familiarity with AI-assisted development workflows: spec-
    driven development, code generation tools, MCP, or agent-
    based paradigms.
  - Contributions to open-source projects.
  - Experience with Rust.

  What We Offer:

  - Competitive base salary and discretionary bonus
  - Hybrid/Flexible Working Arrangements
  - Flexible Time Off (paid)
  - 3% 401(k) company contribution
  - Company-paid health and protective benefits for employees,
    partners, and other dependents
  - Generous paid Parental Leave
  - Competitive family planning benefits for US employees
  - Opportunities to learn about the Crypto industry
  - Smart, entrepreneurial, and fun colleagues
  - Free daily snacks and weekly breakfasts/lunches
  - Employee Resource Groups
  - Free coaching and counseling sessions through Headspace

  Apply now and join us as we grow the economy that runs on
  code.

  Galaxy respects diversity and seeks to provide equal
  employment opportunities to all employees and job applicants
  for employment without regard to actual or perceived age,
  race, color, creed, religion, sex or gender (including
  pregnancy, childbirth, lactation and related medical
  conditions), gender identity or gender expression (including
  transgender status), sexual orientation, marital or
  partnership or caregiver status, ancestry, national origin,
  citizenship status, disability, military or veteran status,
  protected medical condition as defined by applicable state
  or local law, genetic information or predisposing genetic
  characteristic, or other characteristic protected by
  applicable federal, state, or local laws and ordinances.

  We will endeavor to make a reasonable accommodation to the
  known limitations of a qualified applicant with a disability
  unless the accommodation would impose an undue hardship on
  the operation of our business. If you believe you require
  such assistance to complete the application process or to
  participate in an interview, please contact
  careers@galaxy.com.
