  Recruiting Scams and Fraud

  We at AlphaSense have been made aware of fraudulent job
  postings and individuals impersonating AlphaSense
  recruiters. These scams may involve fake job offers,
  requests for sensitive personal information, or demands for
  payment. Please note:

  - AlphaSense never asks candidates to pay for job
    applications, equipment, or training.
  - All official communications will come from an @alpha-
    sense.com email address.
  - If you’re unsure about a job posting or recruiter, verify it
    on our Careers page.

  If you believe you’ve been targeted by a scam or have any
  doubts regarding the authenticity of any job listing
  purportedly from or on behalf of AlphaSense please contact
  us. Your security and trust matter to us.
