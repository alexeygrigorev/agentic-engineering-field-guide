description: |
  QRT is a global quantitative and systematic investment
  manager, operating across all liquid asset classes. We are a
  data- and technology-driven organisation applying scientific
  methods to investing. Our collaborative culture and focus on
  innovation enable us to solve complex challenges and deliver
  high-quality returns for our investors.

  The HR Technology Team builds the applications and
  integrations that connect QRT’s core HR systems with the
  wider business, improving the employee experience and
  streamlining HR operations.

  Your future role within QRT

  We are seeking a Full Stack Developer to build scalable,
  cloud-native tools across QRT’s HR technology stack. You
  will deliver custom applications and integrations from
  conception through to production, with a strong focus on
  tested, observable and reliable automation. The role is
  expected to involve the following activities:

  - Design, build and deploy full-stack internal tools that
    address HR requirements beyond standard platform
    configuration.
  - Develop front-end interfaces using React, Python Dash or
    similar technologies.
  - Build secure APIs and middleware connecting HR systems with
    other corporate tools.
  - Create scalable data pipelines using AWS services including
    S3, ECS and Lambda.
  - Automate manual HR processes using Python and Kotlin.
  - Implement testing, error handling, logging and monitoring
    across applications and integrations.
  - Translate HR requirements into technical specifications and
    work with stakeholders to improve employee lifecycle
    processes.
  - Document solutions and ensure compliance with GDPR, data
    privacy requirements and financial services security
    standards.

  Your present skillset

  - A degree in a numerate, scientific or computing discipline.
  - Strong Python skills and a good understanding of object-
    oriented design.
  - Experience with Kotlin or another statically typed JVM
    language.
  - Front-end experience across JavaScript, HTML and CSS, with
    familiarity with React, Bootstrap or Python Dash.
  - Hands-on experience with AWS, including S3, Lambda and ECS.
  - Strong knowledge of REST and SOAP APIs, JSON and XML.
  - Experience with data modelling and SQL for transactional
    applications and analytical reporting.
  - Strong analytical and communication skills, including
    explaining technical concepts to non-technical HR
    stakeholders.

  Desirable to have experience or a willingness to learn in
  the following areas

  - CI/CD pipelines and Git.
  - Infrastructure as code using Terraform or similar tools.
  - HR platforms such as Workday or Greenhouse, HR KPIs or
    employee lifecycle data.
  - Integrating LLMs or AI agents into workflows, including HR
    ticketing or data categorisation.

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
