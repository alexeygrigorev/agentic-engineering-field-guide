description: |
  About Ting Labs

  We’re on a mission to save lives and property, leading the
  next wave in smart home technology and fire prevention with
  Ting. This intelligent sensor and concierge service monitors
  a home’s electrical network to detect electrical hazards
  that often lead to the most devastating and catastrophic
  fires. While on the job preventing fires inside a home, Ting
  also helps monitor the electrical grid, contributing to
  increased community fire safety and reduced environmental
  impact that comes with fire reduction. We’re steadfastly
  addressing the long-underserved realm of electrical fire
  prevention with leading-edge technology and embarking on the
  next stage of our growth. Visit tingfire.com for more
  information.

  About the Role

  Ting Labs is seeking a Senior Software Engineer to join our
  team, extracting insights from electrical networks. This
  team is responsible for advancing Ting Lab’s infrastructure
  and technology to detect early warning signs of electrical
  fires in homes, preventing one of the deadliest types of
  fires. The role will primarily focus on our software and
  systems supporting a fleet of hundreds of thousands of IoT
  sensors reporting high-speed, real-time electrical sensor
  data.

  Our ideal candidate brings an energetic, creative approach
  to solving complex technical challenges. You are excited to
  develop highly reliable, scalable, and fault-tolerant
  systems. You are comfortable working in a fast-paced
  environment, tackling unfamiliar problems, expanding your
  skills as you go, and collaborating across teams to deliver
  impactful solutions. Most importantly, you are eager to
  contribute to a mission-driven product that has a
  substantial, positive impact on people’s lives.

  What You'll Do

  - Main activities include full lifecycle development
    activities across the organization to support the
    following:
    - Core API and Database Development to support IoT Fleet
      Management and Business Operations.
    - Development of user interfaces and dashboards for internal
      and partner use.
    - Working with business partners on API interfaces and data
      feeds for consuming and sharing data.
  - Supporting activities may include:
    - Data Engineering in support of data science team.

  Required Skills & Experience

  - A degree in Computer Science, Mathematics, Science, or an
    Engineering Field
  - 7+ years of hands-on experience as a software developer
    designing, coding, and testing.
  - Coding experience in C#, Python, SQL
  - Experience in ASP.NET Core, MVC, REST API, etc.
  - Experience with cloud ecosystems (e.g. AWS, Azure, etc.)
  - Familiar with network protocols (TCP/IP, UDP, HTTP etc.)
  - Experience with signal processing and real-time processing
    of high-velocity time series data a plus

  Why Join Us?

  By joining our team, you will have the opportunity to be a
  part of a groundbreaking technology that is creating a new
  category while helping to protect families, homes, and
  communities from the devastating impacts of electrical
  fires. We are a passionate team, dedicated to
  revolutionizing fire prevention to make the world a safer
  place. Our pace and growth trajectory offer exceptional
  opportunities for professional development, and we offer
  competitive compensation and comprehensive benefits. If you
  want to take ownership, shape strategy, and drive meaningful
  change, you’ll love Ting Labs.

  Ting Labs is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability, or protected
  veteran status.
