description: |
  Employer: EverCommerce Solutions Inc.



  Headquarters Address: 3601 Walnut Street, Suite 400, Denver,
  CO 80205



  Worksite Address: This is a fully remote position. Work from
  home benefit provided. Worksites are unanticipated.

  Job Title: Lead Software EngineerSalary: $203,798.00 per
  yearJob Duties:

  ·       Build and evolve a healthcare electronic health
  record (EHR) technology platform to enable medical practices
  of all sizes to deliver more informed, personalized,
  interactive, and adaptable care.

  ·       Design, develop, and maintain high-traffic,
  scalable, secure full-stack applications supporting
  healthcare or regulated environments, including HIPAA-
  compliant systems and patient data management using modern
  web technologies.

  ·       Develop and maintain backend services, APIs, and
  data models supporting application functionality and
  integrations using relational databases including MySQL, or
  PostgreSQL, or MariaDB.

  ·       Develop frontend applications using
  JavaScript/TypeScript frameworks including React, ensuring
  responsive and accessible web applications.

  ·       Maintain and migrate legacy frontend systems built
  using the Elm language and framework.

  ·       Develop and maintain server-rendered web
  applications using Python, Django and Django template
  frameworks, supporting dynamic user interfaces and business
  logic.

  ·       Design and implement RESTful APIs, GraphQL APIs, and
  service-oriented architectures supporting internal platform
  services and external partner integrations.

  ·       Collaborate with software engineers, product
  managers, and quality assurance teams within Agile
  development environments to deliver reliable and high-
  quality software features.

  ·       Provide technical leadership, mentor engineers, and
  contribute to software architecture and system design.

  ·       Determine and implement engineering best practices
  and contribute to technical standards across multiple
  engineering teams, including coding standards, architectural
  patterns, and development workflows.

  ·       Design and implement reusable software components
  and shared libraries to improve maintainability and
  development efficiency across the platform.

  ·       Participate in technical design discussions and
  documentation to support scalable and maintainable system
  architecture.

  ·       Design, implement, and maintain continuous
  integration and continuous deployment (CI/CD) pipelines
  using Docker, Git, CircleCI, and GitHub Actions.

  ·       Identify opportunities to improve system
  performance, reliability, scalability, and engineering
  productivity through improvements in tooling, processes, and
  platform architecture.

  ·       Troubleshoot and resolve production issues in
  complex software systems reported by internal teams
  including Quality Assurance and Customer Support.

  ·       Participate in code reviews and technical planning
  to ensure consistent engineering practices and software
  quality.

  ·       Implement automated testing practices including unit
  and integration testing.

  ·       This is a fully remote position. Work from home
  benefit provided. Worksites are unanticipated.

  Degree Requirement: Bachelor’s degree in Computer Science,
  Software Engineering, or a closely related field.

  Experience Required: Five (5) years of experience as a
  Software Engineer, or closely related occupation.

  Special Requirements:

  Demonstrable ability and prior experience in:

  ·       Providing technical leadership, mentoring engineers,
  and contributing to software architecture and system design;

  ·       Developing full-stack applications supporting
  healthcare or regulated environments, including HIPAA-
  compliant systems;

  ·       Working with one of the following relational
  databases: MySQL, or PostgreSQL, or MariaDB;

  ·       Developing frontend applications using
  JavaScript/TypeScript frameworks including React;

  ·       Working with the Elm language and framework,
  including maintaining and migrating legacy frontend systems
  built using Elm;

  ·       Developing and maintaining server-rendered web
  applications using all of the following: Python, Django, and
  Django template frameworks;

  ·       Designing and implementing RESTful APIs, GraphQL,
  and service-oriented architectures;

  ·       Working with all of the following CI/CD development
  tools: Docker, Git, CircleCI, and GitHub Actions;

  ·       Implementing automated testing practices including
  unit and integration testing;

  ·       Determining and implementing engineering best
  practices and contributing to technical standards across
  engineering teams;

  ·       Troubleshooting and resolving production issues in
  complex software systems.

  Travel Requirements: None.



