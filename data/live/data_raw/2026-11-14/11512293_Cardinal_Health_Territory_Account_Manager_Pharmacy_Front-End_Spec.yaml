description: |
  Pharmacy Front-End Specialist (PFS)

  ** This territory will cover Long Island and Queens**

  Job Overview:

  Responsible for successfully managing customer relationships
  within an assigned set of existing customers to achieve the
  goals and objectives of both Cardinal Health and the
  Customer.

  Demonstrating the value of the Cardinal Health pharmacy
  front-end suite of tools, while building long- term
  relationships with existing customers, establishing a “True
  Solutions Expert” to support our customers and the Sales
  Team. The Complexity of the solution, product or services
  offered is varied can range from reasonably straightforward
  to moderately complex selling environment.

  Main Job Responsibilities & Accountabilities:

  - Assess, analyze and consult with our existing customers
    about their business needs and plans in order to determine
    the appropriate front-end and Consumer Health solutions
    needed & optimal timing to assist each customer in
    maximizing efficiencies and improving margins.
  - Results outcome of customer analysis and determination of
    timing to construct a plan & recommendation to influence
    the decision making of the owner/customer using fact base,
    thorough objective data that supports recommendations,
    cultivating a vision that resonates with our customers.
  - Utilize the Pharmaceutical Supply Chain disciplined selling
    process/tools, leads project activities coordination of
    front-end solution implementation once sold, properly
    recording all activities, notes, etc…within appropriate
    CRM system for ISF.
  - Drives improved operating efficiencies within assigned
    customer based by utilizing the appropriate front-end
    solution selection to benefit our customers and Cardinal
    Health.
  - Established front-end solution suite “expert” and primary
    customer contact for front-end solution suite selection
    and support.
  - Works collaboratively with entire selling team & internal
    support functions to accomplish objectives, assists in
    assuring entire sales team meets their objectives.
  - Assess, analyze/consult with customers on their front-end
    product business needs, influences decisions made on
    planogram changes and successfully ensures new business
    customers are transitioned to Cardinal Health effectively
    & efficiently.
  - Actively engaged as a key member of the selling team,
    participating in customer calls, leading internal
    calls/meeting discussions for the benefit of our customer,
    team validating the overall suite of solutions toolkit
    utilization.
  - Prepares reports, written communication, presentations and
    other material as requested by sales management.

  Qualifications:

  - Min Bachelor’s degree preferred
  - Min 2 years work experience in a consultative environment
    preferred but not required
  - Strong business acumen preferred but not required
  - Technical skills & acumen needed, proficient in MS Word,
    Excel, PowerPoint – preferred
  - Strong Communication skills both written & verbal, ability
    to face complex situations, assess, analyze, utilize good
    decision/action skills.
  - Ability to work independently with minimal supervision,
    self-motivated is a must.
  - Valid driver’s license required
  - Ability to travel more than 75% of time to include some
    overnight travel required.

  Anticipated pay range: $96,900-115,400 (includes targeted
  variable pay)

  Bonus eligible: Yes

  Benefits: Cardinal Health offers a wide variety of benefits
  and programs to support health and well-being.

  - Medical, dental and vision coverage
  - Paid time off plan
  - Health savings account (HSA)
  - 401k savings plan
  - Access to wages before pay day with myFlexPay
  - Flexible spending accounts (FSAs)
  - Short- and long-term disability coverage
  - Work-Life resources
  - Paid parental leave
  - Healthy lifestyle programs

  Application window anticipated to close: 12/05/2026 *if
  interested in opportunity, please submit application as soon
  as possible

  The salary range listed is an estimate. Pay at Cardinal
  Health is determined by multiple factors including, but not
  limited to, a candidate’s geographical location, relevant
  education, experience and skills and an evaluation of
  internal pay equity

