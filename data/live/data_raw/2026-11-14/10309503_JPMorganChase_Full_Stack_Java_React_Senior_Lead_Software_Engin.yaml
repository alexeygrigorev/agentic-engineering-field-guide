description: |
  Be an integral part of an agile team that's constantly
  pushing the envelope to enhance, build, and deliver top-
  notch technology products.

  As a Full Stack Java / React Senior Lead Software Engineer-
  Highbridge Capital Management at JPMorganChase within the
  Asset and Wealth Management Technology Organization-
  Highbridge Capital Management, you are an integral part of
  an agile team that works to enhance, build, and deliver
  trusted market-leading technology products in a secure,
  stable, and scalable way. Drive significant business impact
  through your capabilities and contributions, and apply deep
  technical expertise and problem-solving methodologies to
  tackle a diverse array of challenges that span multiple
  technologies and applications.

  Highbridge Capital Management, LLC, a subsidiary of
  JPMorganChase, is a leading global alternative asset
  management firm established in 1992. With a focus on credit
  and volatility, Highbridge operates a diversified investment
  platform that includes hedge funds, traditional investment
  management products, and committed, closed-end vehicles
  designed for longer-term holding periods. Managing $4
  billion in capital, we aim to deliver attractive risk-
  adjusted returns for a prestigious clientele, including
  institutional investors, public and corporate pension funds,
  sovereign wealth funds, endowments, foundations, and family
  offices. Our headquarters are in New York, with an
  additional office in London.

  Job responsibilities



  - Directly engages with business users to gather and refine
    requirements
  - Designs, implements, and supports critical financial
    applications using Java and Python
  - Quickly understands and provides support for existing
    services and codebases
  - Quickly understands and supports the AWS Cloud
    Infrastructure platform used by the firm
  - Develops a comprehensive understanding of existing data
    models
  - Drives adoption and governance of approved AI-assisted
    engineering practices across teams to improve code
    quality, delivery speed, and operational outcomes (e.g.,
    AI-assisted code review/refactoring, test acceleration,
    release readiness, incident/root-cause analysis), while
    establishing measurable validation standards (secure
    coding, peer review, automated testing) and promoting
    reuse of proven patterns and automation within the
    SDLC/TLM toolchain
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including approved AI-assisted
    development and automation capabilities, to improve the
    value realized by automation at scale
  - Collaborates with third-party vendor systems for
    integration, upgrades, and ongoing issue resolution
  - Operates in a fast-paced, test-driven, agile development
    environment
  - Regularly provides technical guidance and direction to
    support the business and its technical teams, contractors,
    and vendors
  - Drives decisions that influence the product design,
    application functionality, and technical operations and
    processes; Actively contributes to the engineering
    community as an advocate of firmwide frameworks, tools,
    and practices of the Software  Development Life Cycle;
    Influences peers and project decision-makers to consider
    the use and application of leading-edge technologies



  Required qualifications, capabilities, and skills



  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Demonstrated robust programming experience in Java/Python
    and React JS
  - Experience with AWS Public Cloud Technologies and Terraform.
  - Proficient in Database technologies such as RDS Oracle and
    RDS SQL Server, with strong SQL query skills
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment (e.g., for coding, code review, test
    acceleration, troubleshooting) with the ability to set
    team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers/leads on compliant usage patterns and
    controls.
  - Ability to tackle design and functionality problems
    independently with little to no oversight
  - Exceptional problem-solving and debugging skills across
    full-stack applications and a strong passion for coding
    and technology
  - Flexibility to handle various roles from technical business
    analysis and development to DevOps, covering all aspects
    of the software development lifecycle.
  - Experience in Computer Science, Computer Engineering,
    Mathematics, or a related technical field

  Preferred qualifications, capabilities, and skills



  - Hedge Fund, Asset Management, and Investment Banking
    experience
  - Familiarity with Snowflake, Arcesium, Eze, and Bloomberg

  About Us



    JPMorganChase, one of the oldest financial institutions,
  offers innovative financial solutions to millions of
  consumers, small businesses and many of the world’s most
  prominent corporate, institutional and government clients
  under the J.P. Morgan and Chase brands. Our history spans
  over 200 years and today we are a leader in investment
  banking, consumer and small business banking, commercial
  banking, financial transaction processing and asset
  management.




