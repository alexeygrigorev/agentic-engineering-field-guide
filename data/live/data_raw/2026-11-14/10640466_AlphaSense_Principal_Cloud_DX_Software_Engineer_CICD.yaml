description: |
  About AlphaSense:

  AlphaSense is the AI platform redefining market intelligence
  and workflow orchestration, trusted by thousands of leading
  organizations to drive faster, more confident decisions in
  business and finance. The platform combines domain-specific
  AI with a vast content universe of over 500 million premium
  business documents — including equity research, earnings
  calls, expert interviews, filings, news, and internal
  proprietary content. Purpose-built for speed, accuracy, and
  enterprise-grade security, AlphaSense helps teams extract
  critical insights, uncover market-moving trends, and
  automate complex workflows with high-quality outputs. With
  AI solutions like Generative Search, Generative Grid, and
  Deep Research, AlphaSense delivers the clarity and depth
  professionals need to navigate complexity and obtain
  accurate, real-time information quickly. For more
  information, visit www.alpha-sense.com. Come join us.

  About the Role:

  The Cloud DX team owns the outer loop of software
  development at AlphaSense, everything from the moment code
  is pushed to source control to the moment it reaches
  production, for ~400 engineers distributed across the globe.

  We've built a strong delivery foundation with automated
  pipelines, GitOps workflows for both code and
  infrastructure, and a self-service developer platform that
  hundreds of engineers ship through every hour. Now we're
  taking it to a new scale. Our next ambitious goals take us
  from dozens of production systems to hundreds, running
  hundreds of microservices across hundreds of Kubernetes
  clusters.

  This is the role for the person who architects that next
  generation. We're looking for a Principal Engineer to work
  with our team to shape and deliver the architecture for how
  AlphaSense builds, configures, and safely ships software
  into a growing fleet of independent production environments
  expanding into new regions and isolated deployments without
  multiplying operational cost or slowing product teams down.
  Progressive delivery, canary deployments, automated
  rollbacks, trunk-based development, and GitOps are the
  direction we're actively building; at Principal level you'll
  define what best-in-class looks like here and bring dozens
  of teams with you.

  This is a hands-on role with organisation-wide influence. It
  requires deep operational and software engineering skill,
  and the ability to set technical direction across timezones
  with Engineering leaders, Security, and very senior
  engineers across many teams. You'll shape the engineering
  practices a global organisation depends on.

  We're looking for someone who genuinely embraces AI tooling
  in their day-to-day work, appreciates the productivity value
  it brings, and is motivated to push that further both in
  their own practice and by helping embed AI-assisted
  workflows into the SDLC for the wider engineering
  organisation.

  What You'll Do:

  - Own the CI/CD and configuration management architecture
    across our production fleet
  - Make spinning up a new production environment a templated
    operation, not a project
  - Define reference architectures with performance profiles
    tuned per target cluster scale
  - Solve version skew and release cadence across environments
    moving at different speeds
  - Set the progressive delivery standard: canary, automated
    rollback, safe-by-default releases
  - Build the paved paths that let product teams ship anywhere
    without platform knowledge
  - Own delivery end-to-end and drive pipeline reliability,
    speed, and predictability
  - Evolve our Internal Developer Portal and the self-service
    experience around it
  - Partner with Cloud Platform, Security, and Compliance on the
    controls delivery must satisfy
  - Set technical direction across the org and mentor Staff and
    Senior engineers
  - Embed AI tooling into delivery workflows for lasting
    productivity gains

  Who You Are:

  - Experience in Platform Engineering focused on CI/CD at
    companies with 250+ engineers
  - Experience owning and operating a CI/CD platform at admin
    and architecture level, including security, configuration,
    and enablement
  - Fluent in GitOps and declarative configuration at scale
  - Proven ability to design and operate delivery systems at
    large scale
  - Hands-on production-quality software development experience
  - Passion for progressive delivery practices: canary
    deployments & automated rollbacks
  - Experience with cloud-native architectures and Kubernetes-
    based platforms
  - Passion for using AI to improve engineering velocity,
    quality, and developer experience
  - Strong collaboration skills and ability to influence across
    teams

  Nice to have:

  - Stood up a new production regions or isolated deployments
    end-to-end
  - Background in both product software engineering and platform
    engineering
  - Working knowledge of RBAC, OAuth, and compliance (SOC 2, ISO
    27001, GDPR)

  For base compensation, we set standard ranges for all roles
  based on function and level benchmarked against similar
  stage growth companies and internal comparables. In order to
  be compliant with local legislation, as well as to provide
  greater transparency to candidates, we share salary ranges
  on all job postings regardless of desired hiring location.
  Final offer amounts are determined by multiple factors
  including candidate experience/expertise and may vary from
  the amounts listed below.

  You may also be offered a performance-based bonus, equity,
  and a generous benefits program.

  Base Compensation Range

  $246,000—$339,000 USD

