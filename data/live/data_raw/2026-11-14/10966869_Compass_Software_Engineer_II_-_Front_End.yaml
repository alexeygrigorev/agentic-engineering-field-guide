title: Software Engineer II - Front End
company: Compass
location: New York, USA
work_type: FULL_TIME
company_size: 4,000 Employees
description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  As a Software Engineer II in the Transaction Journey (TJ)
  organization, you will use your Frontend web expertise to
  build products that deliver high business impact to our
  customers. You will contribute to the design and development
  of a collaborative transaction management platform that
  streamlines the process of buying and selling homes,
  specifically working across key products such as:
  transaction forms and eSign. You will work with your team to
  deliver features that make it easier for agents to work with
  clients and other parties to complete critical tasks
  throughout the transaction, so that they can spend less time
  managing it, and more time with their clients, and building
  their business. You will collaborate cross-functionally with
  multiple teams as well as with our product and design teams
  to identify and deliver the right solutions for our
  customers and support the growth of the world’s most
  scalable brokerage.

  You are an engineer who is passionate about creating great
  products that are easy to use. You feel it is critical that
  your voice is heard in product and business decisions. You
  love to learn, and equally love to share your knowledge with
  others. You are a great communicator and you take care to
  understand before making yourself understood.

  At Compass, You Will:

  - Develop core Frontend components: Contribute to the frontend
    development of user interfaces (using modern frameworks
    such as React) by design, implementing, and maintaining
    frontend components across the Forms and eSign products.
  - Drive Quality and Testing: Write high-quality, maintainable
    code with minimal defects. Create comprehensive tests to
    prevent regressions and generate small to no technical
    debt.
  - Enhance Operational Excellence: Improve operational metrics,
    enhance system monitoring, and participate in team on-call
    rotations to ensure the reliability and stability of our
    Forms and eSign platform.
  - Deliver Features End-to-End: Work independently to deliver
    small to mid-sized components and collaborate with senior
    engineers to implement more complex technical designs,
    ensuring code is secure, stable, and testable.
  - Act as a Component SME: Become a subject matter expert on
    specific internal components or tools, serving as a go-to
    resource for your peers.
  - Collaborate in Agile Workflows: Participate actively in code
    reviews, team planning, and design discussions, providing
    constructive feedback and continuously learning the
    broader business context of your team's software.

  What We Look For:

  - BS in Computer Science, Software Engineering or equivalent
    practical experience
  - 2-4 years of software engineering experience developing
    well-tested, high-performance applications.
  - 2+ years of experience with Typescript, Javascript, and
    HTML/CSS.
  - 2+ years of experience with React and NodeJS.
  - Solid understanding of data structures, algorithms, and
    implementation trade-offs.
  - A sheer eye for design and attention to detail, the products
    you build should not merely be functional but should take
    in context and anticipate our customer’s needs in a
    beautiful way.
  - Dedication to software testing best practices using tools
    such as Cypress and Jest.
  - A collaborative mindset with a track record of independent
    execution on straightforward technical problems and an
    eagerness to seek guidance when facing ambiguity.
  - Practical experience or strong interest in using AI-assisted
    development tools (like ClaudeCode or GitHub Copilot) in
    real delivery environments.
  - Nice to have: Experience with backend programming experience
    using languages such as Java, Golang, or Python.
  - Nice to have: Familiarity with AWS/cloud technologies,
    event-driven systems (e.g., Kafka), and modern CI/CD
    tooling is a strong plus.

  If you're passionate about shaping the future of real estate
  technology and possess the skills and experience we're
  seeking, we encourage you to join our dynamic team at
  Compass. Together, we'll continue to transform the industry.

  Compensation: The base pay range for this position is
  $126,990-$141,100; however, base pay offered may vary
  depending on job-related knowledge, skills, and experience.
  Bonuses and restricted stock units may be provided as part
  of the compensation package, in addition to a full range of
  benefits. Base pay is based on market location. Minimum wage
  for the position will always be met.

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



  Do your best work, be your authentic self.

  At Compass, we believe that everyone deserves to find their
  place in the world — a place where they feel like they
  belong, where they can be their authentic selves, where they
  can thrive.  Our collaborative, energetic culture is
  grounded in our Compass Entrepreneurship Principles and our
  commitment to diversity, equity, inclusion, growth and
  mobility. As an equal opportunity employer, we offer
  competitive compensation packages, robust benefits and
  professional growth opportunities aimed at helping to
  improve our employees' lives and careers.

  Notice for California Applicants

