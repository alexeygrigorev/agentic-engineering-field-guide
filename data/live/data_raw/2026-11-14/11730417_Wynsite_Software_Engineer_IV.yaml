description: |
  Overview

  About Us

  Daifuku Intralogistics America Corporation is a leading
  provider of intelligent material handling systems. With
  hundreds of engineers in-house, the company designs,
  manufactures, integrates, and installs a full spectrum of
  intralogistics solutions to meet client needs. These include
  leading-edge conveyor and sortation systems, voice- and
  light-directed order fulfillment equipment, a suite of
  warehouse controls & execution software, robotics, Automated
  Storage and Retrieval Systems (AS/RS), mezzanines, and
  structures, all backed by critical round-the-clock service
  and support.

  If you want to join a team of industry leading experts who
  want to create an impact on the future of material handling
  solutions, we want to hear from you!

  Job Summary

  The Software Engineer IV will be responsible for building
  custom software solutions of high-quality while following
  the coding standards and technical design.

  Please Note: This is a Softwre Engineer IV role, you must
  have at least 8yrs. software development experience. The
  ideal candidate will have experience in the material
  handling industry as well.  Lastly, but most importantly,
  this role requires the candidate to be authorized to work in
  the U.S. without employer sponsorship. Please assure to
  answer application questions openly and honestly. Any
  misrepresentation will results in withdrawal from
  consideration.

