description: |
  Unleash AI Innovators, Securely

  Software is being rewritten in real time. AI agents are
  starting to write more code than humans do, at a speed no
  security team has ever had to match, and that single shift
  is opening up the biggest opportunity our industry has seen
  in a decade. We're not bracing for it, we're building the
  company that owns it.

  Snyk is building the next generation security platform where
  security isn't a set of tools people operate. It's a team of
  security agents working alongside your engineers, finding,
  fixing, and governing risk at the speed software is now
  built. These agents work alongside both the company build
  and the agents they adopt. Security stops being a queue of
  work waiting for people, and becomes a coordinated workforce
  companies direct and trust.

  Job Summary: Snyk's Core R&D organization builds the
  infrastructure, platform, and shared systems that every
  product team at Snyk depends on. As a Senior Software
  Engineer, you'll take on complex, ambiguous problems end to
  end: designing the solution, building it, and owning it in
  production. This is a role for someone who wants real
  technical ownership and a direct hand in mentoring the
  engineers around them, at a company where AI agents are
  rewriting how software gets built and security has to keep
  pace.

  About the Team: You'll join one of Snyk's Core R&D
  engineering teams, the group responsible for the shared
  infrastructure and platform capabilities that power Snyk's
  products. The team partners closely with product engineering
  across the company, and reports up through R&D engineering
  leadership.

  What You'll Do:

  - Lead key efforts from idea to execution, demonstrating end
    to end ownership of complex technical problems.
  - Analyze, design, and implement high-quality, well-tested
    solutions to problems with real ambiguity.
  - Mentor and coach junior engineers, helping grow the next
    generation of engineering talent at Snyk.
  - Build systems with a long-term mindset: strong design,
    robust testing, and scalability from day one.
  - Collaborate cross-functionally to ensure the infrastructure
    you build is adopted broadly and used consistently.
  - Resolve critical bugs and customer support escalations to
    protect a high-quality user experience.

  What you'll bring:

  - At least 7 years of commercial experience as a Software
    Engineer.
  - Expertise in large-scale software systems design and a solid
    grounding in fundamental computer science concepts.
  - Experience of using AI throughout the software development
    lifecycle, using agent skills and workflows to maximise
    efficiency within a team setting.
  - Proficiency in at least one of Snyk's core languages: Go,
    TypeScript, or Python.
  - Experience building highly reliable, scalable systems,
    whether microservice back-ends, web UIs, or platform
    automation tools.
  - A strong commitment to code quality and to giving and
    receiving direct feedback.
  - Clear, effective communication and comfort working through
    ambiguity.
  - Nice to have: experience on early-stage products and direct
    customer problem-solving, comfort with a hybrid, in-person
    team schedule, and a sense of humor about a mission you
    still take seriously.

  About Snyk

  Snyk is committed to creating an inclusive and engaging
  environment where our employees can thrive as we rally
  behind our common mission to make the digital world a safer
  place. From Snyk employee resource groups, to global
  benefits that help our employees prioritize their health,
  wellness, financial security, and a work/life blend, we aim
  to support our employees along their entire journeys here at
  Snyk.

  Equal Employment Opportunity

  Snyk is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability, or status as a
  protected veteran.
