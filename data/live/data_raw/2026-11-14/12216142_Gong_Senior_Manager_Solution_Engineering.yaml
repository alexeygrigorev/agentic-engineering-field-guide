description: |
  Gong harnesses the power of AI to transform how revenue
  teams win. The Gong Revenue AI Operating System unifies
  data, insights, and workflows into a single, trusted system
  that observes, guides, and acts alongside the world’s most
  successful revenue teams. Powered by the Gong Revenue Graph,
  AI-powered intelligence, specialized agents, and trusted
  applications, Gong helps more than 5,000 companies around
  the world deeply understand their teams and customers,
  automate critical sales workflows, and close more deals with
  less effort. For more information, visit www.gong.io.

  At Gong, you will join a company built on innovative
  products, ambitious goals, and passionate people. We are
  shaping the future of revenue intelligence and we want
  people who are excited to build what comes next. You will
  work with a team that dreams big, moves fast, and cares
  deeply about the craft and about each other. Here,
  transparency and trust are core to how we operate, and every
  person has the opportunity to make a visible impact. If you
  want to grow, stretch, and do work that truly matters, Gong
  is the place to do the best work of your career.

  The mission of our Solution Engineering team at Gong is to
  serve as trusted partners, advising on complex workflows and
  guiding customers toward an AI-first approach to their go-
  to-market strategy, ultimately helping them achieve their
  desired business outcomes.

  As a senior manager on our Solution Engineering team, you
  will be instrumental in building and leading a team of
  Solution Engineers dedicated to our East Strategic
  Enterprise business unit. You will work closely with cross-
  functional stakeholders and guide the team in solution-based
  selling of our industry-leading Revenue AI platform.

  Location: This position is a hybrid-based role (office and
  remote).

  RESPONSIBILITIES

  - Build & lead a customer-focused, high-performing team that
    effectively communicates the business outcomes and value
    customers can achieve using our Gong platform.
  - Recruit, mentor, and empower Sales Engineers to maximize
    their potential and contribute effectively to team and
    company goals.
  - Play an active role in training team members on new
    features, processes, and collateral, fostering continuous
    learning and development.
  - Foster a culture of collaboration within the Sales
    Engineering team and establish strong partnerships with
    Sales counterparts to drive revenue growth.
  - Develop and implement streamlined processes and create
    impactful collateral to support the team and enhance
    stakeholder engagement.
  - Optimize existing workflows and eliminate bottlenecks by
    collaborating cross-functionally with Sales, Customer
    Success, Support, and Product teams, ensuring smooth deal
    execution.
  - Build and maintain strong relationships with Product
    Marketing, Sales Enablement, Sales Operations, and
    Product/Engineering teams, leveraging sound judgment to
    meet and exceed business objectives.
  - Be a steward of our company culture and actively enforce our
    Operating Principles by embodying them in daily practices
    and team interactions.

  QUALIFICATIONS

  - A proven track record of building and managing high-
    performing sales engineering teams for 3+ years.
  - 10+ years of relevant sales engineering experience.
  - Demonstrated ability to lead a customer-facing team;
    including strong people management skills, and a
    commitment to mentoring, coaching, and employee
    development.
  - Proven experience in building a successful team from the
    ground up, with a readiness to roll up your sleeves and
    engage directly on deals, embodying our #no-royalty
    leadership principle.
  - Ability to foster trust and collaboration among team members
    and cross-functional stakeholders.
  - Strong business acumen with a deep understanding of key
    personas and workflows within a GTM organization.
  - Experience with sales technology: CRMs, cloud architecture,
    or telephony / web conference systems.
  - Familiarity with data flows, AI and machine learning
    concepts, analytics, APIs/webhooks, and JSON.
  - Understanding of security and privacy considerations related
    to SaaS systems.
  - Exceptional verbal and written communication skills, with
    the ability to convey complex ideas clearly and
    persuasively.
  - Strong interpersonal and teamwork skills, with a
    collaborative approach to problem-solving.

  PERKS & BENEFITS

  - We offer Gongsters a variety of medical, dental, and vision
    plans, designed to fit you and your family’s needs.
  - Wellbeing Fund - flexible wellness stipend to support a
    healthy lifestyle.
  - Mental Health benefits with covered therapy and coaching.
  - 401(k) program to help you invest in your future.
  - Education & learning stipend for personal growth and
    development.
  - Flexible vacation time to promote a healthy work-life blend.
  - Paid parental leave to support you and your family.
  - Company-wide recharge days each quarter.
  - Work from home stipend to help you succeed in a remote
    environment.

  The target OTE for this position is $255,000-$300,000 USD.

  Compensation is based on factors unique to each candidate,
  including, but not limited to, job-related skills,
  qualification, education, experience, and location. At Gong,
  we have a location-based compensation structure, which means
  there may be a different range for candidates in other
  locations. The total compensation package for this position,
  in addition to base compensation, may include incentive
  compensation, bonus, equity, and benefits. Some of our sales
  compensation programs also offer the potential to achieve
  above targeted earnings for those who exceed their sales
  targets.

  We are always looking for outstanding Gongsters! So if this
  sounds like something that interests you regardless of
  compensation, please reach out. We may have more roles for
  you to consider and would love to connect.

  We have noticed a rise in recruiting impersonations across
  the industry, where scammers attempt to access candidates'
  personal and financial information through fake interviews
  and offers. All Gong recruiting email communications will
  always come from the @gong.io domain. Any outreach claiming
  to be from Gong via other sources should be ignored.

  Gong is an equal-opportunity employer. We believe that
  diversity is integral to our success, and do not
  discriminate based on race, color, religion, age, sex,
  sexual orientation, gender identity, national origin,
  disability, military status, genetic information, or any
  other basis protected by applicable law.

  To review Gong's privacy policy, visit
  https://www.gong.io/gong-io-job-candidates-privacy-notice/
  for more details.
