description: |
  Meet Eloquent AI

  At Eloquent AI, we’re building the next generation of AI
  Operators—multimodal, autonomous systems that execute
  complex workflows across fragmented tools with human-level
  precision. Our technology goes far beyond chat: it sees,
  reads, clicks, types, and makes decisions—transforming how
  work gets done in regulated, high-stakes environments.

  We’re already powering some of the world’s leading financial
  institutions and insurers, fundamentally changing how
  millions of people manage their finances every day. From
  automating compliance reviews to handling customer
  operations, our Operators are quietly replacing repetitive,
  manual tasks with intelligent, end-to-end execution.

  Headquartered in San Francisco with a global footprint,
  Eloquent AI is a fast-growing company backed by top-tier
  investors. Join us to work alongside world-class talent in
  AI, engineering, and product as we redefine the future of
  financial services.

  Your Role

  As a Front-End Engineer at Eloquent AI, you’ll play a
  central role in shaping the interfaces that connect humans
  and AI in high-stakes enterprise environments. You’ll work
  closely with our product designers, AI engineers, and
  backend developers to build clean, fast, and intuitive UIs
  for our AI agents and dashboards.

  This role is ideal for someone who thrives in fast-moving,
  design-conscious environments, is excited by the challenge
  of creating seamless user experiences for complex AI
  workflows, and who brings technical excellence and a deep
  attention to detail.

  You will:

  - Build beautiful, performant UIs that make AI-powered tools
    intuitive and powerful for enterprise users.
  - Work on CUI (Conversational User Interface) design, agent
    dashboards, and visualisation tools that communicate
    complex AI outputs clearly.
  - Collaborate cross-functionally with design, backend, and ML
    teams to turn product ideas into polished, functional
    front-end implementations.
  - Create modular, scalable components with a strong foundation
    in design systems and accessibility.
  - Optimise for performance and responsiveness across browsers
    and devices.
  - Continuously iterate on design and UX through testing,
    feedback, and usage data.

  Requirements:

  - 7+ years of experience in front-end development, preferably
    building SaaS or AI-powered applications.
  - Proficiency in React, TypeScript, HTML, and CSS.
  - Experience working with design systems (e.g., Storybook,
    Figma handoff, Tailwind, or similar).
  - Strong product and design sense—you care about details,
    polish, and usability.
  - Familiarity with component-driven development and modern
    front-end tooling.
  - A collaborative mindset and comfort working with cross-
    functional teams.

  Bonus Points If…

  - You’ve built interfaces for AI or data-intensive
    applications.
  - You have experience working with real-time systems or
    dynamic visualisations (e.g., charts, streaming data).
  - You have worked in a startup or fast-paced product
    environment.
  - You’ve worked on CUI interfaces, voice, or chat-based UX.
  - You’re comfortable working across the stack or contributing
    to backend APIs.
