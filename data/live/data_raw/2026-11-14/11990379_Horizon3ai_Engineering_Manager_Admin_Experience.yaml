description: |
  Location Specific: United States (Remote)

  Get to Know Us

  Horizon3 is a fast-growing, remote cybersecurity company
  dedicated to the mission of enabling organizations to
  proactively find, fix and verify exploitable attack vectors
  before criminals exploit them. Our flagship product, the
  NodeZeroTM platform, delivers production-safe autonomous
  pentests and other key assessment operations that scale
  across the largest internal, external, cloud, and hybrid
  cloud environments. NodeZero has been adopted by
  organizations of all sizes, from small educational
  institutions to government agencies and Global 100
  enterprises. It is used by IT Ops/SecOps teams, consulting
  pentesters, and MSSPs and MSPs.

  We are a fusion of former U.S. Special Operations cyber
  operators, startup engineers & operators, and formerly
  frustrated cybersecurity practitioners. We're committed to
  helping solve our common security problems: ineffective
  security tools and false positives, resulting in alert
  fatigue, blind spots, "checkbox” security culture,
  cybersecurity skills shortage, and the long lead time and
  expense of hiring outside consultants. Collectively, we are
  a team of learn it alls, committed to a culture of respect,
  collaboration, ownership, and results.

  What You’ll Do

  As the Manager of the Admin Experience engineering team,
  you’ll lead the backend work that helps NodeZero customers
  administer their organizations securely and with confidence.
  The team’s domain includes user access, parent-child account
  controls, account settings, and evolving administration
  capabilities such as roles, access controls, and audit logs.
  You’ll set team direction and create the conditions for
  engineers to deliver useful customer features while
  maintaining reliable production services. You’ll partner
  closely with Product and adjacent engineering teams to turn
  customer needs into a clear roadmap, and balance delivery
  with operational ownership and longer-term platform health..

  Responsibilities

  - Lead, coach, and grow the Admin Experience engineering team;
    establish clear ownership, goals, priorities, and feedback
    practices.
  - Partner with Product and cross-functional stakeholders to
    shape the roadmap for user access, account hierarchies,
    account settings, and administration workflows.
  - Guide technical direction for backend services, APIs, data
    models, and authorization boundaries; help the team make
    sound tradeoffs.
  - Balance feature delivery with production support, on-call
    responsibilities, and investment in platform reliability
    and maintainability.
  - Set expectations for quality and operational readiness,
    including tests, safe rollout practices, observability,
    design documentation, runbooks, and support materials.
  - Recruit, onboard, and develop engineers; support effective
    collaboration and accountability across the team.
  - Coordinate with partner teams so administration workflows
    remain secure and consistent across NodeZero.

  As a Manager, you will be responsible for:

  - Recruiting and onboarding talented individuals to support
    our organizational goals
  - Mentoring, coaching, equipping, and developing your team
  - Recognizing and retaining high performers
  - Leading horizontally with peer Management & Senior Leaders

  What You’ll Bring

  - Ability to set clear priorities, manage concurrent
    initiatives, and guide a team through ambiguity and
    changing needs.
  - A coaching-oriented leadership style that supports hiring,
    onboarding, feedback, and engineer growth.
  - Sound judgment balancing customer impact, security, delivery
    speed, reliability, and longer-term technical health.
  - Strong communication and collaboration skills with Product,
    engineering, and customer-facing partners.
  - A hands-on, quality-focused approach to design reviews,
    production operations, and technical documentation.

  Required Education / Experience

  - Bachelor’s degree in Computer Science, Computer Engineering,
    or a related field, or equivalent practical experience.
  - Experience leading software engineers delivering production
    backend services or SaaS platform capabilities.
  - Strong technical background in backend architecture, APIs,
    data modeling, and production operations, with the ability
    to engage meaningfully in design and code reviews.
  - Experience with identity, access control, multi-tenant
    systems, account hierarchies, or comparable administration
    capabilities.
  - Experience hiring, onboarding, coaching, and developing
    engineers.

  Required Tech Stack Experience

  - Experience guiding teams that build backend services in a
    modern language such as Python, Go, Java, or TypeScript.
  - Working knowledge of SQL and relational data stores, API
    design (REST or GraphQL), and cloud-hosted services.
  - Familiarity with containerized applications such as Docker
    and with production engineering practices including
    automated testing and observability.
  - Experience with every example technology is not required;
    relevant depth and the ability to guide sound technical
    choices are important.

  What Sets You Apart?

  - Experience with RBAC, SSO, audit logs, delegated
    administration, or customer-facing admin consoles.
  - Experience with AWS, PostgreSQL, Kubernetes, feature flags,
    and observability tools such as Datadog, Prometheus, or
    OpenTelemetry.
  - Experience in cybersecurity or another technically complex,
    customer-facing SaaS environment.

  Travel Required

  We are a fully remote company, and this job may require up
  to 10% of travel to be successful.

  Compensation and Values

  At Horizon3, we believe that our people are our greatest
  asset, and our compensation philosophy reflects this core
  value. We are committed to fostering an environment where
  all employees feel valued, respected, and rewarded for their
  contributions. Our compensation structure is designed to be
  fair, competitive, and transparent, ensuring that every team
  member is recognized and compensated equitably across roles,
  levels, and locations.

  In accordance with various State’s transparency regulations,
  we provide the following salary range information for this
  position:

  - Base salary range: $225,000 - $265,000 annually. The exact
    salary will be determined based on the selected
    candidate’s location, qualifications, experience, and
    relevant skills.
  - Additional compensation: All full-time roles are eligible
    for an equity package in the form of stock options.

  Perks of Horizon3

  - Inclusive Team: We value diversity and promote an inclusive
    culture where everyone can thrive.
  - Growth Opportunities: Be part of a dynamic and growing team
    with numerous career development opportunities.
  - Innovative Culture: Work in a collaborative environment that
    encourages creativity and out-of-the-box thinking.
  - Hybrid & Remote Work: We embrace a mix of remote and hybrid
    work models depending on role and location, including our
    Chicago office, where some roles require regular in-office
    presence.
  - Competitive Compensation: We offer competitive salary,
    equity and benefits. Our benefits include health, vision &
    dental insurance for you and your family, a flexible
    vacation policy, and generous parental leave.

  You Belong Here

  Horizon3 is not just an equal opportunity employer - we are
  a community that values diversity, equity, and inclusion as
  fundamental principles of our culture and success. We are
  dedicated to fostering a workplace where everyone feels
  welcome and respected, regardless of race, color, religion,
  sex, national origin, age, disability, veteran status,
  sexual orientation, gender identity or expression, genetic
  information, marital status, hair length or any other
  legally protected status by law.

  Our commitment to diversity and inclusion means we strive to
  attract, develop, and retain a workforce that reflects the
  varied communities we serve. We believe that diverse
  perspectives drive innovation and strengthen our ability to
  create cutting-edge cybersecurity solutions. At Horizon3,
  every team member is valued and supported in an environment
  that encourages personal and professional growth.

  We welcome candidates from all backgrounds and experiences,
  and we encourage all qualified individuals to apply. Come be
  a part of Horizon3, where your unique contributions are
  recognized, and your potential is limitless.

  Other Duties

