description: |
  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

  BNY | Wealth Services Platform, a business unit within BNY,
  is a leading provider of financial business solutions for
  Wealth Managers / RIAs.  We offer industry-leading custody,
  advisory, portfolio management, trading and banking services
  as a white labeled software platform for our clients to
  serve their clients. Our commitment to excellence and
  innovation drives our mission to empower our clients with
  cutting-edge technology and services.

  We are looking to hire multiple Full-Stack Engineers. These
  roles are location is New York City, Pittsburgh, PA and Lake
  Mary, FL.

  Key Responsibilities

  - Serve as a hands-on full stack developer, directly
    designing, building, testing, and deploying applications
    aligned with business needs.
  - Write high-quality, maintainable code across the front end
    and back end, actively contributing to core project
    deliverables.
  - Collaborate with cross-functional teams including product,
    operations, and security to deliver practical, scalable
    solutions.
  - Lead by example through technical execution, driving best
    practices in coding, testing, debugging, and deployment to
    ensure high-quality software delivery.
  - Explore and implement opportunities to streamline the
    software development lifecycle through automation, modern
    engineering practices, and intelligent tooling.
  - Participate actively in code reviews, troubleshooting, and
    debugging efforts, helping resolve complex technical
    issues quickly and effectively.
  - Contribute to architectural decisions and technology
    strategy with a pragmatic, builder-focused mindset
    grounded in hands-on development experience.
  - Mentor and guide junior developers through day-to-day
    technical leadership, pairing, code review, and knowledge
    sharing.
  - Ensure applications meet security, compliance, performance,
    and reliability standards.
  - Help manage project timelines and deliverables in
    partnership with stakeholders, while remaining deeply
    involved in execution.
  - Balance leadership responsibilities with direct technical
    contribution, operating as a doer who helps move work
    forward.

  Qualifications

  - Bachelor’s degree in computer science, Engineering, or
    related field
  - 7+ years of experience in full stack software development
    required.
  - Finance domain experience is preferred
  - Extensive hands-on experience in full stack development,
    with strong proficiency in modern front-end frameworks
    (e.g., Angular, React, Flutter, Dart) and back-end
    technologies (e.g., Java, Spring Framework, Oracle,
    MongoDB, SQL).
  - Strong understanding of REST APIs, cloud platforms, DevOps
    practices, and modern software development lifecycle
    processes.
  - AI Agentic process engineering & skills
  - Demonstrated ability to contribute directly in code,
    troubleshoot issues, and deliver production-ready software
    in a fast-paced environment.
  - Experience with or strong interest in leveraging AI-assisted
    development tools, automation, and engineering
    productivity practices to improve SDLC efficiency and
    delivery outcomes.
  - Excellent problem-solving, communication, and collaboration
    skills.
  - Ability to work effectively in a fast-paced, agile
    environment with a strong sense of ownership and
    execution.

  About BNY

  BNY is a global investments company dedicated to helping its
  clients manage and service their financial assets throughout
  the investment lifecycle. Whether providing financial
  services for institutions, corporations, or individual
  investors, BNY delivers informed investment and wealth
  management and investment services in 35 countries. As part
  of our team, you will be encouraged to innovate and
  collaborate to drive new ideas and opportunities for our
  business and clients.

  BNY is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability, or veteran
  status.

  BNY assesses market data to ensure a competitive
  compensation package for our employees. The base salary for
  this position is expected to be between $136,500 and
  $220,000 per year at the commencement of employment.
  However, base salary if hired will be determined on an
  individualized basis, including as to experience and market
  location, and is only part of the BNY total compensation
  package, which, depending on the position, may also include
  commission earnings, discretionary bonuses, short and long-
  term incentive packages, and company- sponsored benefit
  programs.

  This position is at-will and the Company reserves the right
  to modify base (as well as any other discretionary payment
  or compensation) at any time, including for reasons related
  to individual performance, change in geographic location,
  Company or individual department/team performance and market
  factors.

