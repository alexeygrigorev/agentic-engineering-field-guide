description: |
  Phantom is on a mission to connect the world to the freedom
  of open markets. Tens of millions of people all over the
  world use Phantom to access global markets that never close,
  including perpetuals, prediction markets, tokenized assets,
  stablecoins and memes. Phantom users are able to discover
  the markets that matter and the cultural moments that shape
  them, building conviction through real-time data and the
  verified performance of top traders. With self-custody and
  access to open networks at its core, Phantom lets them
  control their financial moves in the same app they use to
  safely store or spend money worldwide.

  Phantom has reached #1 in Google Play's finance category and
  consistently ranks in the top 50 apps across all categories.
  Check out our Forbes Fintech 50 and CNBC and Statista's
  World's Top Fintech Companies 2026!

  We are around 180 people, fully remote, backed by a $150M
  Series C investment from a16z, Sequoia Capital and Paradigm.

  Role Description

  As a core member of Phantom’s Data Platform team, you will
  design, build, and optimize our streaming blockchain data
  platform to enable high-quality, scalable ingestion,
  transformation, and delivery of token, price and spam data.
  As an owner of a critical platform function, you’ll empower
  other product engineering teams at Phantom by providing
  access to rich, accurate, realtime on-chain data.

  Responsibilities

  - ETL & Data Pipeline Design: Develop, maintain, and optimize
    scalable ETL pipelines using our modern data stack. You’ll
    be responsible for sourcing, transforming, and integrating
    data from on-chain sources.
  - Data Quality & Observability: Drive initiatives to implement
    data quality frameworks and observability solutions that
    ensure the accuracy, freshness, and reliability of data
    across all pipelines.
  - Architect for Scalability & Performance: Build systems
    capable of handling millions of requests per day, with a
    focus on high availability, low latency, and strong fault
    tolerance, in service of other engineering teams’ data
    access needs at Phantom.
  - Data Modeling & Schema Design: Design and maintain efficient
    data models and schemas that underpin our efforts.
  - Cross-Functional Collaboration: Partner closely with
    product, design, and other engineering teams to translate
    business requirements into scalable backend platform
    solutions.
  - Team building: Work with the team to create and foster a
    culture of raising the bar with each new hire.

  Qualifications

  - 5+ Years of Backend Experience: Demonstrated success in
    building large-scale, high-availability systems.
  - Deep experience building and optimizing modern ETL pipelines
    and data engineering solutions in high-growth
    environments.
  - Experience with the languages/frameworks in our stack (e.g.
    Go, Node.js, TypeScript, NestJS, Kafka, redis, PostgreSQL)
  - Demonstrated experience implementing data quality frameworks
    along with observability and monitoring solutions.
  - Web3/Crypto Knowledge: Familiarity with on-chain data,
    wallet integrations, or decentralized application patterns
    is strongly preferred.
  - Ability to work both independently and collaboratively
    within a lean team structure.

  Why Work with Us

  We are a team of experienced builders in the blockchain and
  crypto industry. Our journey began from users seeking an
  easy, seamless path to accessing the crypto ecosystem. This
  passion fueled our exponential growth, allowing us to
  onboard over 16M+ active users in just over three years;
  with our user base growing weekly. Our dedication to a
  secure and seamless user experience has made us the leading
  wallet on Solana as well as our multi-chain approach
  enhances our platform's versatility, meeting the needs of a
  diverse and growing user base. By staying at the forefront
  of technology and user expectations, we continue to innovate
  and set industry standards on self-custodial crypto wallets.

  There has never been a better time to work in crypto to help
  shape the future of innovation with a focus around the
  wallet experience!

  - First impressions matter: Wallets are responsible for a
    users first impression with crypto and onboarding new
    users into crypto. By ensuring that a user has a great
    first-time experience with crypto, we can help supercharge
    the growth of the entire ecosystem.
  - Make crypto easier to navigate: There is no easy way for a
    user to discover and navigate all that crypto has to
    offer. Wallets have a unique opportunity to help users not
    only onboard to crypto but also stay retained by exploring
    new things to do.
  - We live in a multi-chain world: We currently support Solana,
    Ethereum, Polygon and Bitcoin with more networks to come
    in the new future. We are focused on creating a unified,
    multi-chain crypto experience for users.

  Benefits

  - Competitive salary and equity
  - Comprehensive insurance (medical/dental/vision) 100% covered
  - Stipend for your ideal remote set-up
  - Flexible hours and a supportive remote environment
  - Unlimited vacation: Take time when you need it (and we
    really mean it!)
  - 401(k) retirement plan
  - Monthly wellness benefit
  - Weekly meal benefit
  - Global off-sites

  We strongly encourage candidates of all different
  backgrounds to apply. We believe that our work is stronger
  with a variety of perspectives, and we’re eager to further
  diversify our company. If you have a background that you
  feel would make an impact at Phantom, please consider
  applying. We’re committed to building an inclusive,
  supportive place for you to do the best work of your career.

  Why Work With Us

  Phantom's journey to becoming a global trading app began
  with making crypto easier to use. Today, we’re building on
  that foundation to help people discover the markets that
  matter, make informed financial moves, and safely store or
  spend their money worldwide. Joining Phantom means helping
  shape that next chapter: building products that bring the
  freedom of open markets to more people.



  - Build for global impact: Create products used by tens of
    millions of people, making innovative financial markets
    more accessible to users around the world.
  - Make complexity feel simple: Solve meaningful challenges
    across design, engineering, and user experience to make
    discovering markets and managing money seamless.
  - Put users in control: Help build a future where people have
    greater freedom over their assets and financial decisions,
    with security and self-custody at the foundation.

  Benefits (only available to full-time employees)

  - Competitive salary and equity
  - Comprehensive insurance (medical/dental/vision): base plan
    100% covered
  - Flexible hours and a long-standing, supportive remote
    environment
  - Unlimited vacation: Take time when you need it (and we
    really mean it!)
  - 401(k) retirement plan
  - Wellness stipend
  - Weekly meal stipend
  - Learning & Development stipend
  - Remote / WFH set-up stipend

  We strongly encourage candidates of all backgrounds to
  apply. We believe that our work is stronger with a variety
  of perspectives, and we’re eager to further diversify our
  company. If you have a background that you feel would make
  an impact at Phantom, please consider applying. We’re
  committed to building an inclusive, supportive place for you
  to do the best work of your career.

