description: |
  Do you want to play a key role in designing and developing
  Software solutions that enables Medical Insights using the
  latest technologies and contributing to improvements in Pet
  Health? Do you want to be part of a high-functioning Scrum
  team with a strong business partnership and a drive to do
  great work?

  Our team would like to meet you!

  IDEXX is seeking a Senior Software Developer to design,
  build and manage applications and integrations for digital
  medical imaging conforming to DICOM standards. You will join
  a team of talented software and QA engineers, collaborating
  with product owners, and driving innovation in veterinary
  care. If you enjoy complex software and challenges, consider
  this role!

  The ideal candidate will have the ability to work in a
  hybrid capacity onsite 2x per week or 8x per month.

  In this Role:

  - You will be a senior member of a highly effective Agile team
    delivering industry leading capabilities, participating in
    business planning and technical strategy
  - Innovate in technology, team process and development
    practices.
  - You will practice Scrum development, and interacts with
    other Agile development frameworks, so experience and
    desire to work in Agile teams is a must!
  - You will work with a close-knit team of Developers, QA
    Engineers, DevOPS, Product Owners and SRE’s- excellent
    communication, collaboration and interpersonal skills are
    important for team success.
  - You will have the support to learn new skills; access to a
    network of professionals; and exchange knowledge with
    peers through mentorship and coaching opportunities.
  - You will explore opportunities to apply AI and machine
    learning- including computer vision, GenAI, and LLM-based
    tools- to imaging diagnostics, workflow automation, and
    developer productivity.

  What you need to succeed:

  - Proficiency designing, building and deploying web
    applications, APIs, Micro Services
  - Proficiency with Git
  - Proficiency with Java, Spring boot, .NET, C#
  - Proficiency with front end technologies Angular, AngularJS,
    HTML, CSS, React
  - Proficiency with SQL and NoSQL databases
  - Proficiency with one or more major cloud providers (e.g.,
    AWS)
  - Proficiency with IOT services
  - Experience with AWS Lambdas, Batch jobs
  - Experience with building continuous integration and
    deployment (CI/CD) systems (e.g., Jenkins)
  - Experience with SSO (e.g., OAuth)
  - Experience with cloud object storage (e.g., S3)
  - Familiarity with Java Swing
  - Familiarity with Java profiler tools (e.g., YourKit)
  - Familiarity with Python
  - Experience or strong interest in applying AI/ML (e.g.,
    computer vision, deep learning) to medical imaging or
    diagnostic data
  - Familiarity with integrating AI and Generative AI
    capabilities (e.g., LLMs, RAG, ML APIs) into software
    products and services
  - Experience using AI-assisted development tools (e.g., GitHub
    Copilot, Claude Code) to accelerate delivery and improve
    code quality
  - Familiarity with ML frameworks such as PyTorch, TensorFlow,
    or scikit-learn

  What you can expect from us:

  - Salary: $120000 / year
  - Opportunity for annual cash bonus and merit increase
  - Health / Dental / Vision benefits starting Day-One
  - 5% matching 401k
  - Additional benefits including financial support, pet
    insurance, mental health resources, volunteer paid days
    off, employee stock program, foundation donation matching,
    and more

  Why IDEXX: We’re proud of the work we do, because our work
  matters. An innovation leader in every industry we serve
  since 1983, our team members help pet owners worldwide keep
  their companion animals healthy and happy, ensure safe
  drinking water for billions, and help farmers protect
  livestock and poultry from disease.

  We have customers in over 175 countries and a collaborative
  global workforce. Our culture is one that embraces
  challenges and encourages learning and discovery. At IDEXX,
  you’ll be supported by competitive compensation, incentives,
  and benefits while enjoying purposeful work that drives
  improvement.

  Knowing our work makes a meaningful impact on the health and
  well-being of pets and people is what motivates us every
  day. If meaningful work and a sense of purpose are at the
  top of your list, you’ll find it here.


  IDEXX values a diverse workforce and workplace and strongly
  encourages women, people of color, LGBTQ+ individuals,
  people with disabilities, members of ethnic minorities,
  foreign-born residents, and veterans to apply.


  IDEXX is an equal opportunity employer. Applicants will not
  be discriminated against because of race, color, creed, sex,
  sexual orientation, gender identity or expression, age,
  religion, national origin, citizenship status, disability,
  ancestry, marital status, veteran status, medical condition,
  or any protected category prohibited by local, state, or
  federal laws.

