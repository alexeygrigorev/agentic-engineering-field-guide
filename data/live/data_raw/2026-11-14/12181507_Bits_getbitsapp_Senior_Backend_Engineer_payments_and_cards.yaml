description: |
  What Bits is Bits helps people in the UK build their credit
  with a subscription and a credit card. It is regulated by
  the FCA, has tens of thousands of paying members, and is run
  by a team of fewer than 20 people. Every engineer works with
  Claude Code every day. The job You own the code that moves
  the money: subscriptions and billing on Stripe (two
  accounts), the card with our card processor, the store and
  gift cards, pushes to members, the reporting data behind
  them, and our USA site. You take over these systems and make
  them better. You work beside our lead backend engineer, w ho
  owns payments, Stripe, infrastructure and the web today, and
  directly with the CEO. Your first 90 days

  - Take over the subscription, billing and store services end
    to end, with a writtenmap of what runs where, whatalarms
    exist, and what fails silently today.
  - Ship the top change the CEO picks
  - Take one job a person does by hand today, in finance,
    support or collections, and automate it.

  How we work A small, excellent team, paid well on standard
  terms. No custom deals and no managers for their own
  sake.Smart people get a mandate, not instructions. You get
  the problem and you own the answer.n estimate before
  anything starts, and the work fits the time agreed.You test
  it and read every word before it ships. “It should work” is
  not done.S hip small, measure, then decide. Something
  customers can see every week. One source of truth per topic,
  written down. Manual work is never a reason not to do
  something. We automate it. Fewer cancellations, more revenue
  and less bad debt come first. Anything that moves none of
  them waits.
