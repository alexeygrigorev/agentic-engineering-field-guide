description: |
  About Wolt

  At Wolt, we create technology that brings joy, simplicity
  and earnings to the neighborhoods of the world. In 2014 we
  started with delivery of restaurant food. Now we’re building
  the delivery of (almost) everything and you’ll find us in
  over 500 cities in 30 countries around the world. In 2022 we
  joined forces with DoorDash and together we keep on dreaming
  big and expanding across the globe. Working at Wolt isn’t
  always easy, but it’s definitely exciting. Here you’ll learn
  more, build more, and ship more than in most other
  companies. You’ll be challenged a lot, but also have a lot
  of fun on the way. So, if you’re a self-starter with drive
  and entrepreneurial spirit, this could be the ride of your
  life.

  About the Role

  We’re building a new Feature Engineering Platform that will
  be the front door to ML development at global scale. As a
  Software Engineer on this team, you’ll help build a seamless
  experience for ML practitioners across the company — from
  experimentation and exploration to deployment and
  monitoring.

  Our mission is to make machine learning accessible and
  intuitive without compromising on power or performance.
  You’ll work on a layered platform that supports both high-
  level declarative workflows and lower-level imperative APIs,
  all integrated into the environments our users already work
  in (like notebooks and internal sandboxes).

  What You’ll Do

  - Build and evolve APIs, SDKs, and platform integrations that
    power feature engineering workflows.
  - Help shape user-facing tools to make the platform
    approachable for all skill levels.
  - Collaborate across the ML lifecycle — from data ingestion to
    feature serving — and integrate tightly with our central
    Data Control Plane.
  - Contribute to platform reliability, testing, observability,
    and operational excellence.

  Qualifications

  - Solid engineering background, ideally in platform, data, or
    ML-adjacent teams.
  - Comfortable working with backend systems, APIs, and ideally
    some exposure to distributed compute (e.g. Spark, Flink).
  - Empathy for users and interest in building abstractions that
    remove friction.
  - Curious and collaborative mindset — eager to learn from
    others and contribute broadly.
  - Experience with ML tooling, or data pipelines is a plus.

  The successful candidate's starting pay will fall within the
  pay range listed below and is determined based on a number
  of job-related factors including, but not limited to,
  skills, experience, qualifications, work location, and
  market conditions.

  This position would be eligible for consideration for an
  equity award grant of restricted stock units on commence and
  during the annual pay review cycle. Upon commencement of
  employment, you would be eligible to be considered for a
  grant. Thereafter, any further grants would be at the
  Company's discretion.

  Pay Range:

  €7.102—€8.878 EUR

  Our Commitment to Diversity and Inclusion

  We’re committed to growing and empowering a more inclusive
  community within our company, industry, and cities. That’s
  why we hire and cultivate diverse teams of people from all
  backgrounds, experiences, and perspectives. We believe that
  true innovation happens when everyone has room at the table
  and the tools, resources, and opportunity to excel.

  Beware of recruitment scams: DoorDash, Deliveroo, and Wolt
