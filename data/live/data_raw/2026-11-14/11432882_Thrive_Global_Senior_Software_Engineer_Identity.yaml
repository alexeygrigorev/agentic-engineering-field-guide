description: |
  Founded by Arianna Huffington in 2016, Thrive Global is a
  leading behavior change technology company with the mission
  to improve productivity and health outcomes – one Microstep
  at a time. Thrive helps individuals and organizations
  improve well-being, performance and mental resilience with
  its AI-powered behavior change technology platform. Thrive’s
  Microsteps – small, science-backed steps to improve health
  and productivity – have been adopted by employees at more
  than 230 organizations in over 160 countries, from frontline
  and call center workers to executives at multinational
  companies. For more information, visit www.thriveglobal.com.

  This is a high-impact role for a senior engineer who wants
  real ownership from day one. As a Senior Software Engineer
  on the Identity team, you will design, build, and operate
  the systems that underpin sign-up, authentication, and
  identity across every Thrive product. When an employee at
  one of our 200+ enterprise customers signs in, your work is
  the front door. This is a fast-moving, lean environment. We
  are looking for someone who brings the pragmatism of a
  startup, a bias to ship and iterate quickly, paired with the
  craft of an engineer who has seen the long-term cost of
  shortcuts.

  How You'll Contribute

  - Own and evolve the enterprise identity platform end-to-end —
    Design, build, and ship  the software that onboards,
    authenticates and authorizes users to the entire Thrive
    ecosystem. Partner with internal teams to provide the
    tools & systems to manage a users’ identity and enable the
    mission of Thrive.
  - Independently scope and deliver medium-to-large projects —
    take an ambiguous problem, break it into well-sized
    workstreams, sequence the work, and drive it to completion
    with minimal hand-holding.
  - Partner closely with Product and stakeholders — translate
    business requirements into technical plans, surface trade-
    offs early, and keep cross-functional partners informed
    throughout delivery.
  - Set a high bar for quality without sacrificing pace — bring
    a bias to ship and iterate fast, balanced with the craft
    and judgment to avoid costly shortcuts.
  - Support reliability and incident response — provide on-call
    and incident support during US working hours to keep the
    platform healthy and customers supported.

  Who You Are

  - A self-directed senior engineer who thrives with ownership
    and minimal oversight, and knows which decisions warrant a
    stakeholder check-in.
  - A pragmatic builder who blends startup speed with
    engineering craft — you ship and iterate, but you don't
    accumulate avoidable debt.
  - A clear communicator who surfaces trade-offs and risks early
    and keeps cross-functional partners aligned.
  - Energized by ambiguity — you can take a loosely defined
    problem and turn it into a sequenced, deliverable plan.
  - Reliable under pressure, with the judgment to keep systems
    stable and respond effectively when incidents arise.
  - Quality-obsessed without being precious — you set a high bar
    and still move the work forward.
  - Hands-on experience with standards-based identity protocols:
    OAuth 2.0, OIDC, SAML, and SCIM provisioning.
  - Experience integrating with enterprise identity providers
    (Okta, Entra ID, Ping or similar) and debugging customer
    SSO configurations in production.
  - Familiarity with session management, token lifecycle, and
    secure credential handling at scale.
  - Experience building software in security-sensitive or
    regulated environments (SOC 2, HIPAA, or equivalent).

  Qualifications & Skills

  - Bachelor’s degree from an accredited college or university
    required

  - Senior-level engineering experience with a track record of
    owning production systems end-to-end.
  - Strong Java/Kotlin, ideally full-stack with TypeScript, with
    experience balancing sustaining engineering (reliability,
    scalability, technical debt) against net-new feature
    delivery.
  - Experience building and supporting B2B / enterprise-facing
    software.
  - Demonstrated ability to independently scope and deliver
    medium-to-large projects, from ambiguous problem to
    shipped solution.
  - Experience with on-call rotations and incident response.
  - Meaningful daily overlap with US Eastern business hours,
    plus availability for overlap with our Ireland-based team.

  ✨ What We Offer:

  - 🌍 Mission-Driven Impact: Be part of a company that’s truly
    making a difference in people’s lives around the world.
  - 🚀 Career Growth: Develop within the company and help shape
    our growth strategy.
  - 💙 Human-Centric Culture: Thrive in a supportive environment
    with a range of wellness perks and benefits.
  - 💰 Competitive Compensation: Enjoy a comprehensive and
    rewarding total compensation package.
  - 🩺 Health & Financial Benefits: Medical, dental, and vision
    coverage plus a 401(k) program with company match.
  - 🌴 Time to Recharge: Generous paid time-off programs designed
    to help you rest, reset, and recharge — including Thrive
    Time, a benefit unique to Thrive that gives employees
    additional paid time off after major projects or intense
    periods of work to truly recharge and recover.

  Compensation:

  Base compensation for this role will likely fall in the
  $170,000-$200,000 range.

  - Please note: We provide a competitive mix of salary,
    performance bonus, and equity. The final offer amount will
    depend on factors like experience, expertise, and may
    differ from the range above. This range also excludes
    additional benefits, such as 401(k), and medical, dental,
    or vision insurance.

