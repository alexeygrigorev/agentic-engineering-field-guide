  Company Statement

  We know that the best innovation happens when diverse people
  with different perspectives and skills work together in an
  inclusive atmosphere. That's why we're building a culture
  where everyone plays a part in making people feel welcome,
  ready and willing to contribute. TP ICAP Accord - our
  Employee Network - is a central to this. As well as
  representing specific groups, TP ICAP Accord helps increase
  awareness, collaboration, shares best practice, and holds
  our firm to account for driving continuous cultural
  improvement.

  Location

  USA - 200 Vesey Street - New York, NY
