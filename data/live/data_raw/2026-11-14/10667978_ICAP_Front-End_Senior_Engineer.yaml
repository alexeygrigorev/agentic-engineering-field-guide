description: |
  Group Overview

  The TP ICAP Group is a world leading provider of market
  infrastructure.

  Our purpose is to provide clients with access to global
  financial and commodities markets, improving price
  discovery, liquidity, and distribution of data, through
  responsible and innovative solutions.

  Through our people and technology, we connect clients to
  superior liquidity and data solutions.

  The Group is home to a stable of premium brands.
  Collectively, TP ICAP is the largest interdealer broker in
  the world by revenue, the number one Energy & Commodities
  broker in the world, the world’s leading provider of OTC
  data, and an award winning all-to-all trading platform.

  Founded in London in 1866, the Group operates from more than
  60 offices in 27 countries. We are 5,200 people strong. We
  work as one to achieve our vision of being the world’s most
  trusted, innovative, liquidity and data solutions
  specialist.

  Role Overview

  The Front-End Senior Engineer will play a key role in
  designing and implementing user-facing features for
  enterprise-grade applications. This position requires strong
  technical expertise, a passion for creating intuitive
  interfaces, and the ability to collaborate effectively with
  cross-functional teams. The role involves driving best
  practices in front-end development, mentoring junior
  engineers, and contributing to architectural decisions that
  shape the future of our products.

  Role Responsibilities

  - Design, develop, and maintain high-quality front-end
    applications using modern frameworks.
  - Collaborate with UX/UI designers to implement responsive and
    accessible interfaces.
  - Optimize application performance for speed and scalability.
  - Ensure code quality through best practices, including
    testing and code reviews.
  - Work closely with back-end engineers to integrate APIs and
    services.
  - Troubleshoot and resolve front-end issues across multiple
    browsers and devices.
  - Contribute to architectural decisions and technical strategy
    for front-end development.
  - Mentor junior developers and promote knowledge sharing
    within the team.
  - Stay updated on emerging front-end technologies and industry
    trends.

  Experience / Competences

  Essential

  - Proven experience developing desktop user interfaces using
    Java Swing.
  - Working knowledge of the Spring Boot framework.
  - Working knowledge of the JDBC API for database interaction.
  - Experience or familiarity with the Solace Event Broker.
  - Familiarity with RESTful APIs and system integration
    practices.
  - Experience with build and dependency management tools such
    as Apache Maven.
  - Understanding of version control systems (e.g., Git).
  - Experience using feature and bug tracking tools such as
    Jira.
  - Strong problem-solving and debugging skills.
  - Strong communication and collaboration abilities.

  Desired

  - Experience in front-end development using frameworks such as
    React, Angular, or Vue.js.
  - Experience with TypeScript and modern state management
    libraries (e.g., Redux).
  - Experience with responsive design and cross-browser
    compatibility.
  - Knowledge of performance optimization techniques for web
    applications.
  - Experience working with modern AI-assisted development tools
    (e.g., Kiro, Amazon Q, or similar) to improve developer
    productivity.
  - Exposure to CI/CD pipelines and automated testing
    frameworks.
  - Knowledge of accessibility standards and best practices.
  - Familiarity with cloud platforms and containerization (e.g.,
    AWS, Docker).
  - Understanding of security principles in front-end
    development.
  - Experience working in Agile environments.
  - Ability to contribute to design discussions and propose
    innovative solutions.

  Role Band & Level

  - Manager, 6

  Salary

  - $136,000 to $175,000
  - Commensurate with experience

  #LI-ASO

