description: |
  (This role is based in Trepp's NYC office and follows a
  hybrid work schedule)

  Trepp has multiple opportunities for individuals with strong
  backgrounds in programming to undertake challenging projects
  in our Technology department.  We provide a collaborative
  team environment where our technologists work closely with
  product and subject matter experts in addition to other
  technology team members and are empowered to impact the
  organization through leadership, creativity, and innovation.

  The Full Stack Group at Trepp is responsible for creating
  and developing our suite of software products. Being a
  member of the Full Stack Group allows you the flexibility to
  learn and hone your skills on a number of various tools and
  technologies. You’ll have the experience to work with and
  create services based on data lakes, caching
  infrastructures, and container-based applications. Our
  products focus on data and analytics in the structured
  finance, commercial real estate, and banking verticals. This
  team works closely with our Product Groups to always refine
  our product and feature sets, improve overall user
  experience, along with creating new Product Workflows.

  We encourage our developers to continue to focus on the
  developer experience in addition to the user experience.
  Engineers are encouraged to provide enhancements to internal
  tooling as well as other technology improvements. We want
  our apps to be fun to develop while being easy to use for
  our clients. The Full Stack Group is working to build modern
  foundation of APIs, Services, and data sets to create
  powerful applications.

  We value being able to think up new solutions to problems
  and be able to develop prototypes and POCs to validate ideas
  quickly. You will be challenged to think creatively for the
  best solutions to any given project.

  Responsibilities:

  - Knowledge of software engineering best practices across the
    development lifecycle, including agile methodologies,
    coding standards, source management, and testing.
  - Thinking like a user of our products to ensure optimal user
    experiences and keeping an eye to simplicity, despite
    working with large and complicated data sets.
  - Comfortable being given clear project goals & objectives,
    and being empowered for discovering optimal solutions.
  - Experience thinking about performance engineering and
    performance within the Browser and API servers.
  - Comfortable with acting as a technical leader when needed
    and able to context switch between projects in a fast-
    paced environment.

  Required Skills:

  - Bachelor’s Degree in Computer Science or equivalent.
  - 5+ years of professional programming experience working in
    full stack engineering departments developing in
    JavaScript/Typescript, React, Node.js, or equivalent.
  - Strong knowledge of various RESTful API patterns and the
    trade-offs between each.
  - Uphold our high engineering standards and bring consistency
    to the many codebases and processes you will encounter.
  - Fundamental understanding of modern testing practices in
    full stack applications. You know how to add quality
    automated testing and can differentiate the
    responsibilities between unit, integration and e2e tests
    in client-focused applications.
  - Strong documentation skills (Markdown, you like GitHub
    READMEs), generating architecture design documents, and
    the ability to communicate requirements to other team
    members and project stakeholders.

  Preferred Skills:

  - A drive to work on financial data systems & pipelines and
    improve them through the usage of Cloud Architectures.
  - Deep experience with React, related frameworks and recent
    implementation patterns (think hooks, global state
    management, NextJS, React Query, Tailwind, etc).
  - Experience developing APIs and Services running on cloud
    technologies utilizing docker and container strategies
    such as ECS.
  - Comfort for being self-sufficient within your tech stack.
    Being able to build and maintain terraform configurations,
    docker containers, Github Actions, etc on top of your own
    application itself.
  - Expertise in building and maintaining the correct sets of
    automated tests for a given project.
  - You have worked with product stakeholders to create
    actionable engineering work and complete it through
    iterative delivery.
  - Expertise in utilizing AI assistance to amplify your
    personal contributions in addition to the team’s output.
    For instance, we want to see that you understand the
    difference between using an agent in your personal
    workflow and identifying when there is a process that can
    be improved through an agentic workflow.

  Salary Range:

  - Base salary starting from $165k plus bonus eligible

  Benefits and Perks:

  - Base + target bonus compensation structure
  - Medical, Dental, Vision insurance
  - 401K (with employer match)
  - Life insurance, long term disability, short term disability
    all covered by the company
  - Flexible paid time off (PTO)
  - Sixteen (16) weeks paid primary caregiver leave (Biological,
    adoptive, and foster parents are all eligible)
  - Four (4) weeks paid parental leave
  - Wellness subsidy
  - Pet insurance
  - Laptop + WFH equipment
  - Career progression plan
  - Pre-tax commuter benefit with company subsidy (For NYC-
    office based employees only)
  - Fun company events and volunteering opportunities

  Applicants for employment in the US must have work
  authorization that does not now or in the future require
  sponsorship of a visa for employment authorization in the
  United States and with Trepp (i.e., H1-B visa, F-1 visa
  (OPT), TN visa or any other non-immigrant status).

  Workplace Policy:

  NYC, PA, and London office-based positions: Trepp’s offices
  follow a 3-2 hybrid working policy with the expectation of
  in-office work on Tuesday through Thursday and the option to
  work from home on Monday and Friday.
