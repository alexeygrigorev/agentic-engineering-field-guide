description: |
  About GameChanger:

  We believe in the life-changing impact youth sports have on
  and off the field because they encourage leadership,
  teamwork, responsibility, and confidence—important life
  lessons that have the power to propel our youth toward
  meaningful futures. We recognize that without coaches,
  parents, and volunteers, organized youth sports could not
  exist. By building the first and best place to experience
  the youth sports moments important to our community, we are
  helping families elevate the next generation through youth
  sports.

  So if you love sports and their community-building
  potential, or building cool products is your sport,
  GameChanger is the team for you. We are a remote-first,
  dynamic tech company based in New York City, and we are
  solving some of the biggest challenges in youth sports
  today.

  The Position:

  As a Staff Software Engineer, you will lead the technical
  design and delivery of integrations and APIs built and
  operated as products. You will help turn GameChanger’s
  capabilities and domain expertise into secure, reliable,
  scalable, and intuitive experiences that developers and
  partners can build on with confidence.

  This is a hands-on technical leadership role. You will work
  directly with engineers to design, build, and operate
  integrations and APIs, making key architectural decisions
  and establishing practical engineering patterns. You will
  bring experience building developer-facing products and
  guide decisions across API contracts, authentication and
  authorization, versioning, documentation, observability,
  reliability, support, and developer experience.

  Your impact will extend across the teams and services that
  support these products. You will identify cross-system
  dependencies and risks, establish reusable patterns, and
  help engineers build backend and integration expertise. You
  will partner closely with Engineering, Product, Data,
  Design, and Business Development to translate developer and
  partner needs into technical plans, align with GameChanger’s
  broader architecture, and deliver a cohesive integration
  experience. This role will report to a Sr Engineering
  Manager.

  What You’ll Do:

  - Lead the technical design and delivery of integrations and
    API products, partnering with Engineering and Product
    leaders to shape their technical roadmaps.
  - Work hands-on with engineers to design, build, launch, and
    operate these products, owning critical implementation
    work and balancing near-term learning with a durable long-
    term foundation.
  - Establish and apply clear standards and reusable patterns
    for API contracts, authentication and authorization,
    versioning, rate limiting, error handling, webhooks,
    documentation, and developer experience.
  - Lead system design for integrations and APIs across
    GameChanger services and external systems, working with
    service owners to address dependencies, failure modes, and
    tradeoffs involving performance, security, reliability,
    maintainability, cost, and future use cases.
  - Work with the team to define and implement reliability,
    observability, support, incident-response, and service-
    health practices for integration and API products,
    including meaningful SLIs, SLOs, and operational metrics.
  - Partner with Product and business stakeholders to clarify
    partner needs, inform product decisions, and prioritize
    technical investments that create customer and business
    impact.
  - Serve as a technical bridge across the teams responsible for
    backend services, infrastructure, data, and client
    applications that contribute to the integration and
    developer experience.
  - Evaluate build, buy, and integration options, clearly
    communicating tradeoffs and recommendations to technical
    and non-technical stakeholders.
  - Identify architectural risks within integrations, APIs, and
    their dependencies, and drive practical improvements to
    scalability, resilience, security, and ease of evolution.
  - Use and improve lightweight practices for design reviews,
    technical proposals, API lifecycle decisions, and
    documenting architectural tradeoffs across your projects.
  - Mentor engineers, including senior engineers, deepen backend
    and API expertise across the teams you work with, and
    raise the technical bar through pairing, design reviews,
    code reviews, and knowledge sharing.
  - Build trusted relationships across Engineering, Product, and
    business functions; surface areas of disagreement early
    and drive decisions to clear outcomes.
  - Participate in an occasional on-call rotation and model
    strong ownership of production systems.

  Who You Are

  - You are a hands-on technical leader who can connect product
    goals to system architecture, break complex initiatives
    into deliverable milestones, and work through
    implementation details.
  - You have strong product judgment and understand that
    successful integrations and API products include
    contracts, documentation, developer workflows, operations,
    and support—not only endpoints.
  - You are comfortable taking ownership of an ambiguous, high-
    impact space, clarifying the most important problems, and
    creating a path forward without detailed direction.
  - You decompose complex problems that span teams and services,
    clarify dependencies and ownership, and help teams deliver
    toward a shared outcome.
  - You reason clearly about tradeoffs and design systems for
    both immediate needs and plausible future use cases.
  - You build trust with technical, product, and business
    partners and adapt your communication to create clarity
    and alignment.
  - You lead through influence, direct contribution, and follow-
    through, and you take accountability for outcomes rather
    than stopping at recommendations.
  - You invest in other engineers and create reusable guidance,
    tools, and practices that improve quality and decision-
    making across the teams you work with.

  Experience

  - 8+ years of professional software development experience,
    including hands-on technical leadership on complex,
    business-critical systems.
  - Demonstrated experience building and operating integrations
    or developer-facing APIs as products.
  - Deep knowledge of API design and lifecycle management,
    including authentication and authorization, versioning,
    backwards compatibility, rate limiting, documentation, and
    developer experience.
  - Experience designing and evolving distributed, high-scale
    production systems with strong security, reliability,
    observability, and performance characteristics.
  - Experience leading the technical design and delivery of
    substantial initiatives that span multiple teams or
    services, from problem definition through production
    operation.
  - Experience defining production-readiness standards, service
    health metrics, incident practices, and longer-term
    reliability investments.
  - A track record of aligning technical and non-technical
    stakeholders, resolving cross-team ambiguity, and
    connecting technical decisions to customer and business
    outcomes.
  - Experience mentoring engineers, including senior engineers,
    and improving engineering practices across your team and
    closely collaborating teams.
  - Experience working with third-party developers, strategic
    partners, API consumers, or platform ecosystems is
    strongly preferred.
  - Experience with TypeScript, Node.js, AWS, Redis, and
    PostgreSQL is preferred.

  Perks:

  - Work remotely throughout the US* or from our well-furnished,
    modern office in Manhattan, NY.
  - Unlimited vacation policy.
  - Paid volunteer opportunities.
  - Technology stipend - $4,000 every 2 years after your start
    to make sure you have the latest and greatest technology.
  - WFH stipend - $500 annually to make your WFH situation
    comfortable.
  - Monthly physical, mental, wellness & learning stipend
    offered through Holisticly.
  - Monthly lifestyle stipend offered through Fringe.
  - Full health benefits - medical, dental, vision,
    prescription, FSA, HRA, HSA, and coverage for
    family/dependents.
  - Retirement savings - Traditional and Roth 401K plans are
    offered through Vanguard, with an immediate company match.
  - Life insurance - basic life, supplemental life, and
    dependent life.
  - Disability leave - short-term disability and long-term
    disability.
  - Company paid parental leave - up to 20 weeks for birthing
    parents and up to 12 weeks for non-birthing parents.
  - Family building benefits offered through Progyny.
  - DICK'S Sporting Goods and their family of brands teammate
    discount.

  The target salary range for this position is between
  $169,000 and $185,000. This is part of a competitive total
  rewards package that includes incentive, equity, and
  benefits for eligible roles. Individual pay may vary from
  the target range and is determined by a number of factors
  including experience, location, internal pay equity, and
  other relevant business considerations. We review all
  teammate pay regularly to ensure competitive and fair pay.

  DICK’S Sporting Goods has company-wide practices to monitor
  and protect the company from significant compliance and
  monetary implications as it pertains to employer state tax
  liabilities. Due to said guidelines put in place, we are
  unable to hire in AK, DE, HI, IA, LA, MS, MT, OK, and SC.

  We are an equal opportunity employer and value diversity in
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  Our Interview Process & AI

  We recognize that AI has become a common part of everyday
  life and professional work, and its use continues to evolve
  rapidly. Our perspective on AI in the hiring process will
  evolve as well. At this time, we ask that candidates please
  refrain from using AI tools during interviews and
  assessments, as we want to see your authentic self. We will
  clearly indicate if and when AI use is acceptable in the
  process. If you have any questions or need accommodations,
  we're here to help. Thanks for helping us keep the process
  fair and secure for everyone!

  IMPORTANT NOTICE: All official recruitment communications
  from GameChanger will come from an email address ending in
  @gc.com or no-reply@ashby.hq.com. If you receive
  communication from any other domain, please be cautious, as
  it is likely fraudulent.
