description: |
  Company & Mission Overview:

  Our mission: We exist to connect climate and financial risk.

  Who we are: First Street is the standard for Climate Risk
  Financial Modeling. For over a decade, we’ve been
  translating climate risk into decision-useful financial
  outcomes for investors, businesses, communities, and
  property owners worldwide. With backing from world-class
  firms, including Innovation Endeavors, Galvanize, General
  Catalyst, and others, our team has raised millions to change
  how the global economy thinks about climate change.

  Read more about our culture here and see what Climate Risk
  Financial Modeling is all about here.

  Our data: We’ve assembled leading climate scientists and
  economists to develop transparent, peer-reviewed
  methodologies to calculate the past, present, and future
  climate risk for properties and asset classes spanning real
  estate, infrastructure, and companies. Using physics-based
  deterministic models, we predict the likelihood of floods,
  wildfires, hurricanes, and other hazards at any location on
  Earth, along with associated damage and downtime.

  Our customers: We aim to incorporate climate risk data into
  every financial decision made today. We are relied on every
  day by:

  - Institutional investors like Norges Bank Investment
    Management and Blackstone.
  - Banking enterprises, including Bank of America and Fifth
    Third.
  - Government bodies ranging from Fannie Mae to the US State of
    Connecticut.
  - Millions of everyday users on Zillow, Redfin, Realtor.com,
    Homes.com, and more.

  Come join us and use your talents to change the world.

  Team & Role Overview

  The engineering team at First Street is the backbone of our
  mission: using technology and data to help the world
  understand and adapt to climate risk. We’re an AI-native
  team building the systems that power our global
  products—tools relied on by customers to make informed,
  climate-aware decisions.

  As a Software Engineering Manager, you will primarily be a
  hands-on individual contributor responsible for architecting
  and delivering end-to-end features across frontend and
  backend systems, while also providing technical leadership
  and management for a small team of engineers. You will spend
  the majority of your time on software execution, working
  closely with product managers, designers, and data partners
  to translate complex climate data into performant,
  accessible, and intuitive user experiences.

  This role is ideal for an engineer with strong frontend
  fundamentals who is comfortable working across the stack and
  collaborating deeply with cross-functional partners.

  What You’ll Do

  - Serve as a lead individual contributor, personally building
    and shipping critical product features across the frontend
    and backend.
  - Develop user-facing experiences with attention to UI
    architecture, performance, and accessibility.
  - Integrate frontend applications with backend APIs and
    services (primarily written in Go).
  - Collaborate closely with product managers and designers,
    actively contributing ideas, tradeoffs, and technical
    perspectives.
  - Debug and reason about issues across the stack, including
    identifying whether problems originate in the frontend,
    backend, or underlying data.
  - Work with platform engineers and data partners to ensure
    product behavior aligns with real-world data and customer
    expectations.
  - Drive high standards for code quality, documentation, and
    engineering excellence through direct technical
    contribution and mentorship.
  - Deliver reliable, maintainable software that advances First
    Street’s mission to connect climate and financial risk

  Technologies We Use

  Our stack includes (but is not limited to): AWS, Go, Linux,
  Kubernetes, MySQL, PostgreSQL (+ PostGIS), Elasticsearch,
  Redis, Git, Docker, JavaScript, Node.js, React, GraphQL,
  REST, and Python.

  What You’ll Need

  - Professional experience working as a software engineer on
    production systems.
  - Strong frontend fundamentals, including UI architecture,
    performance optimization, and accessibility.
  - Experience building and integrating with APIs.
  - Comfort working across the stack, even if your background
    leans frontend or backend.
  - Experience collaborating with cross-functional partners such
    as product managers and designers.
  - Ability to debug complex systems and reason about issues
    across frontend, backend, and data layers.
  - Bachelor’s degree or equivalent practical experience in
    Engineering, Computer Science, or a related field.

  What Will Make You Stand Out

  - Experience working and managing engineering teams.
  - Experience working in product-driven engineering
    environments.
  - Familiarity with GraphQL and modern frontend data-fetching
    patterns.
  - Experience debugging or working with data-heavy or
    geospatial systems.
  - Prior experience in roles that required close collaboration
    with non-engineering stakeholders.

  Our anticipated US base salary compensation range for this
  role is $140,000-190,000 plus stock options and a
  competitive benefits package, which includes equity, 401(k),
  paid time off, paid parental leave, and comprehensive health
  benefits. Actual compensation will vary depending on factors
  such as work location as well as additional factors such as
  a candidate’s qualifications, skills, experience,
  competencies, and relevant education. Your recruiter can
  share more about the specific salary range for your location
  during the hiring process.

  How we work:

  - Impact: We only focus on things that move the needle
  - Drive: We are driven by the role we play in connecting
    climate change to financial risk
  - Ownership: This is our company and we act accordingly
  - Urgency: We move quickly because the world depends on it
  - Resilience: We have a growth mindset in all that we do

  What we offer:

  - Competitive salary commensurate with experience
  - Ownership interest in the company via Employee Stock Option
    Plan
  - Hybrid Schedule with in-office work days on Monday,
    Wednesday and Thursday
  - 15 vacation days along with 8 statutory company holidays, 5
    days for winter break office closure, and 10 sick days
  - Healthcare monthly premium covered at 100% for employee or a
    significant contribution for family plans
  - Vision and dental benefits with partial employee
    contribution
  - 12 weeks of paid parental leave
  - Access to One Medical, Teledoc, HealthAdvocate, Kindbody,
    and Talkspace
  - Company 401k program
  - Commuter benefits
  - Life Insurance
  - Tech startup environment
  - Weekly team meals and an office stocked with coffee and
    snacks
  - Working on the world’s biggest issue with other passionate
    professionals

  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. Once you've applied, please be sure to
  check your spam folder, as emails from our recruiting team
  are sometimes rerouted.
