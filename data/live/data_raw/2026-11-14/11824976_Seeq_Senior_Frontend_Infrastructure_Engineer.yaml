description: |
  This is a frontend system engineering role focused on
  evolving Seeq’s frontend React infrastructure, state
  management, design system, and building reusable application
  patterns for a complex enterprise product. You will shape
  not just UI primitives, but the broader frontend foundations
  that teams use to build clear, consistent, high-quality
  experiences across data-dense workflows.

  Passionate about crafting exceptional software, you revel in
  writing code with elegance, extensibility, and
  maintainability as your guiding principles.

  What You Will Do

  You will lead the evolution of Seeq’s frontend system,
  improving component quality, consistency, usability, and
  developer experience across the product.

  You understand that AI is not only changing product
  interfaces but also how they are built. You have experience
  or are interested in building systems that set up AI-driven
  development for success by codifying best practices that are
  easy for agents to follow.

  You know how to leverage the best of the open-source
  ecosystem rather than building everything from scratch. You
  can leverage systems like Zustand, TanStack Query, and
  StyleX with taste and judgment, extending and adapting them
  where needed to fit Seeq’s product, standards, and
  workflows.

  You will also help ensure that refactors to bring in new
  patterns or libraries are done with an exceptionally high
  bar for quality and completeness since these changes can
  have a far-reaching impact for the teams that use them.
  You’ll partner closely with the teams who rely on our
  infrastructure to roll out changes smoothly.

  What We’re Looking For

  You are an exceptional frontend engineer with strong product
  sense, visual taste, and systems thinking. You have real
  experience creating, evolving, and shipping design systems
  or component libraries used in production applications.

  You are highly effective in React and Typescript and have
  had exposure to some of the popular ecosystem libraries like
  Zustand, StyleX, or TanStack Query. You know how to build
  frontend systems that are composable, accessible, robust,
  and ergonomic for other engineers. You think carefully about
  component APIs, styling architecture, responsiveness,
  usability, and long-term maintainability. You understand and
  resolve the root causes for defects instead of patching the
  symptom.

  You collaborate effectively through code review, pairing,
  and clear communication. You are product- and user-focused —
  you engage with customers or other teams and can articulate
  the rationale behind features and pain points to your fellow
  engineers.

  You have strong written and verbal communication skills. You
  care about documentation and clear conventions as much as
  implementation quality. You can help others understand the
  rationale behind design decisions and create systems that
  teams can adopt effectively.

  You bring strong ownership and agency. You do not wait to be
  told where the gaps are. You find them, make good judgments
  about where to focus, and drive improvements through to
  completion.

