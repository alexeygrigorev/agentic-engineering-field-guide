description: |
  Full Stack Developer/Sr. Software Developer – IRS

  Level: Senior

  Location: Remote

  Job Type: Full-time

  Clearance: IRS Minimum Background Investigation (MBI),
  moderate-risk public trust, favorably adjudicated and
  associated with an IRS contract within the past 24 months

  *All candidates must already have the above clearance
  listed. All candidates must be able to obtain and maintain
  their current clearance and any clearance level designated
  by Montcure at any given time, during their employment.

  Montcure, LLC is a Service-Disabled Veteran-Owned Small
  Business (SDVOSB) founded with a vision to revolutionize
  consulting and advisory services through innovative, data-
  driven solutions. The Montcure team recognizes the unique
  challenges faced by organizations and governments in today’s
  rapidly evolving business environment.

  Description

  We are seeking a highly skilled Full-Stack Developer to
  design, develop, and maintain enterprise-level applications
  in a mission-critical environment. The ideal candidate will
  bring deep expertise in Java Spring Boot microservices-based
  development, strong SQL skills for Oracle Exadata database
  integration, and hands-on experience deploying and managing
  applications in Red Hat OpenShift container platforms.

  Key Responsibilities:

  - Conduct analysis of legacy source code (C/C++, Oracle) as
    required to assist in decomposing high-level business
    requirements into user stories (technical requirements)
  - Conduct full-lifecycle implementation (design, development,
    unit test, system test) efforts to implement high-quality
    code that meets approved user stories / acceptance
    criteria
  - Design, develop, and maintain full-stack web applications
    using Java Spring Boot, RESTful APIs, and modern front-end
    frameworks (React, Angular, or similar).
  - Develop efficient SQL queries, stored procedures, and
    performance-tuning strategies for Oracle Exadata.
  - Build, deploy, and manage microservices in Red Hat
    OpenShift, leveraging CI/CD pipelines for automated builds
    and deployments.
  - Participate in solution design, code reviews, and
    architectural discussions to ensure scalable and secure
    applications.
  - Collaborate with cross-functional teams in an Agile/Scrum
    environment, contributing to sprint planning, estimation,
    and backlog refinement.
  - Implement best practices for application monitoring,
    logging, and performance optimization.


  Disclaimer "The responsibilities and duties outlined in this
  job description are intended to describe the general nature
  and level of work performed by employees within this role.
  However, they are not exhaustive and may be subject to
  change or modification at any time to meet the evolving
  needs of the organization

  Requirements

  Minimum Required Qualifications:

  · IRS Minimum Background Investigation (MBI), moderate-risk
  public trust, favorably adjudicated and associated with an
  IRS contract within the past 24 months. This is a
  requirement of the IRS contract. Candidates must be able to
  provide documentation or contractor references that allow
  the status to be verified through the contracting officer's
  representative (COR) and IRS Personnel Security.

  · Position requires immediate access to sensitive
  information systems; therefore, a current Tier 2
  investigation must be active and transferable. Mandatory for
  this position.

  · 5+ years of professional software development experience,
  including at least 3+ years of full-stack development

  · 5+ years of professional full lifecycle software
  development experience using Java Spring Boot, RESTful APIs
  and/or modern front-end frameworks (React, Angular or
  similar)

  · 5+ years of professional experience with big-data
  migration efforts that include development of efficient
  complex SQL queries, PL/SQL, stored procedures and
  performance-tuning strategies for Oracle Exadata.

  · 5+ years of professional experience in development of
  microservices within an OpenShift / Kubernetes environment
  leveraging Jenkins, Git, Maven or similar technologies

  · 5+ years of hands-on experience with OpenShift or other
  Kubernetes-based platforms (containerization, pod
  management, CI/CD pipelines).

  · Exceptional communication and stakeholder engagement
  skills — able to explain complex technical issues clearly to
  both developers and non-technical audiences

  ·U.S. Citizenship required due to highly sensitive federal
  client responsibilities.

  Education and Certifications Required :

  BS degree in Computer Science, Information Systems, or
  related field (or equivalent experience )

  Preferred Qualifications:

  - Experience analyzing Pro*C, COBOL, or other legacy
    languages.
  - Experience with microservices architecture and cloud-native
    development
  - Knowledge of Oracle PL/SQL and database-driven applications.
  - Prior experience with federal IT modernization programs.
  - Familiarity with BPMN and business process reengineering.

  Status: Contingency – This work is contingent upon award.

  Salary Description: $140,000 - $145,000

  Montcure, LLC is an Equal Opportunity Employer. Montcure,
  LLC does not discriminate on the basis of race, religion,
  color, sex, gender identity, sexual orientation, age, non-
  disqualifying physical or mental disability, national
  origin, veteran status or any other basis covered by
  appropriate law. All employment is decided on the basis of
  qualifications, merit, and business need.
