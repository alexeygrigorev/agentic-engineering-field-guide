description: |
  About ParetoHealth

  ParetoHealth is redefining the way employers fund
  healthcare. As the largest and fastest-growing benefits
  captive in the United States, we help thousands of small and
  midsize employers take control of healthcare costs through a
  smarter, more sustainable model.

  Our mission is simple: give small and midsize employers the
  scale and protection they need to eliminate volatility and
  lower healthcare costs.

  By combining data-driven insights, innovative risk
  management, and the collective purchasing power of our
  community, we enable employers to reduce volatility, improve
  long-term outcomes, and reinvest savings into their
  businesses and their people.

  Headquartered in Philadelphia, ParetoHealth is growing
  rapidly and transforming one of the country's largest
  industries. Our success is fueled by talented people who are
  united by our four core values: Fire in the Belly, For the
  Greater Good, See the Field, and Get It Done Right. These
  values shape how we innovate, collaborate, make decisions,
  and deliver exceptional results for our clients and one
  another.

  If you're energized by solving complex challenges, thrive in
  a high-growth environment, and want to help reshape the
  future of healthcare, we'd love to meet you.

  Please note that ParetoHealth does not provide employment
  visa sponsorship for this position. Candidates must be
  authorized to work in the United States without sponsorship
  both now or in the future.

  Position Summary:

  The Senior Software Engineer owns full-stack solutions from
  design through production operation, building TypeScript
  services and user experiences on AWS serverless
  technologies. The role leads technical decisions for GraphQL
  APIs, business logic libraries, Lambda-based services
  deployed with the AWS CDK, and responsive Angular/Ionic
  applications. The engineer partners with Product,
  management, and business analysts to turn business needs
  into maintainable solutions, and is accountable for their
  reliability, security, HIPAA compliance, and ongoing
  improvement. The role also uses approved AI tools to
  accelerate engineering work while independently validating
  results and helping the team establish effective AI-assisted
  practices.

  Key Responsibilities:

  - Lead technical design and implementation for complex full-
    stack features, including GraphQL APIs, TypeScript
    business logic, AWS Lambda services, and Angular/Ionic
    user interfaces; explain trade-offs and surface risks
    early.
  - Own assigned services and features through testing, CDK-
    based deployment, production monitoring, incident
    response, and follow-up improvements.
  - Build and maintain reusable TypeScript business logic
    libraries and APIs with appropriate automated tests,
    documentation, and security controls.
  - Develop and deploy AWS Lambda functions and supporting
    infrastructure using established AWS CDK patterns;
    automate jobs and data workflows using AWS Glue where
    appropriate.
  - Improve reliability, performance, security, and
    maintainability using production evidence such as service
    metrics, incidents, and user feedback.
  - Raise engineering quality through design and code reviews,
    mentoring, and reusable patterns for testing, deployment,
    observability, and operational readiness.
  - Own and improve engineering delivery practices in
    partnership with the team, including CI/CD pipelines, Git
    workflows, coding standards, and developer tooling.
  - Use approved AI tools to accelerate design, implementation,
    testing, troubleshooting, and documentation; independently
    validate AI-generated code and designs for correctness,
    security, and production readiness; and help teammates
    adopt effective AI-assisted engineering practices.

  Required Qualifications / Skills:

  - Excellent communication and collaboration skills.
  - Experience building AWS cloud-based serverless solutions.
  - Experience developing APIs (e.g., GraphQL, REST).
  - Experience with SQL/NoSQL databases and data modeling.
  - Experience creating responsive PWA or mobile applications
    using Ionic, Angular, or a similar framework.
  - Experience with the software development lifecycle and test
    methodologies.
  - Experience leading technical design decisions and owning
    software through production operation, including
    monitoring, troubleshooting, and improving reliability or
    performance.
  - Ability to mentor engineers and raise engineering quality
    through constructive design and code review.
  - Follows security best practices and policies for developing
    HIPAA-compliant software.
  - Experience with CI/CD software and processes.
  - Hands-on experience using AI coding assistants or similar
    tools in day-to-day engineering, including framing
    problems with clear context and constraints, breaking work
    into verifiable steps, and critically reviewing and
    testing generated output; understands the data-handling
    boundaries for using AI tools with sensitive healthcare
    and financial data.
  - Experience with AWS networking technologies (Route 53, VPCs,
    Security Groups, CloudFront, etc.) is a plus.

  Minimum Requirements:

  - Bachelor’s degree in Computer Engineering, Computer Science,
    or a related discipline, or equivalent practical
    experience.
  - 7+ years of hands-on full-stack development experience.
  - 2+ years of experience developing in TypeScript/JavaScript,
    with demonstrated ownership of production software.
  - Preferred: AWS certification(s).

  Perks & Benefits:

  - Fully paid medical, dental, and vision benefits.
  - Flexible PTO
  - 401k company contribution
  - Tuition reimbursement
  - Professional development allowance
  - Transportation allowance and daily parking reimbursement
  - Engaging hybrid work environment

  We are guided by our values:

  Fire in the belly

  The drive to learn, to improve, and to deliver outstanding
  value every day.

  See the field

  The ability to see the big picture and prepare to meet
  tomorrow’s needs.

  Get it done right

  The passion to produce at higher rates and to the highest
  standards.

  For the greater good

  A united community creating better health benefit solutions
  for all.

