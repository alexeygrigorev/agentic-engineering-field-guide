description: |
  Healthcare is complex. We’re here to change that.

  RVO Health is a health technology company on a mission to
  make health easier to navigate, more accessible, and more
  affordable for everyone.

  Here, you'll help over 40 million people every month, with a
  team that genuinely cares about the work and each other.

  AT A GLANCE

  The Software Engineer is a crucial role within our
  organization, requiring work in various capacities and
  adaptation to different work arrangements based on the needs
  set by the business. The successful candidate will be
  responsible for fulfilling their job duties in the following
  work situations:

  What You’ll Do

  - Lead the end-to-end design, development, and implementation
    of sophisticated software applications and systems aligned
    with business goals.
  - Collaborate closely with stakeholders including product
    managers, designers, and other engineers to gather
    requirements and translate them into robust technical
    designs and solutions.
  - Write high-quality, efficient, maintainable, and scalable
    code adhering to best practices and company standards.
  - Debug, analyze, and resolve complex software defects and
    performance bottlenecks to ensure optimal system
    reliability and user experience.
  - Conduct comprehensive testing and validation including unit,
    integration, and performance testing to guarantee software
    quality.
  - Mentor and provide technical guidance to junior and mid-
    level engineers, fostering professional growth and
    knowledge sharing.
  - Perform thorough code reviews to maintain high code quality,
    enforce coding standards, and promote best practices
    across the team.
  - Continuously improve software development processes, tools,
    and methodologies.
  - Stay updated on emerging technologies, frameworks, and
    industry trends to inform technology strategy and
    innovation.
  - Collaborate effectively with cross-functional teams to meet
    project deadlines and deliverables.

  What We’re Looking For

  Required:

  - Bachelor's degree in computer science, software engineering,
    a related field; or equivalent experience
  - 3+ years experience in software development, with a focus on
    large-scale applications.
  - 2+ years of expert level experience with Go and hands-on
    experience with other programming languages such as Python
    and Typescript
  - 2+ years of experience with event driven architecture such
    as Kafka; Datastores such as Postgres, Dynamo, Nebula; as
    well as working knowledge of CI/CD and Infrastructure as
    code (IaC)
  - Deep understanding of software development methodologies and
    best practices.
  - Strong problem-solving and analytical skills. Even stronger
    interpersonal and communication skills.
  - Experience with software testing.
  - Experience using AI for code generation.

  Preferred:

  - Master’s degree in computer science, software engineering, a
    related field, or equivalent experience.
  - Previous experience with healthcare regulations and
    compliance requirements.
  - Previous experience with Customer Data Platforms
  - Full stack programming experience using modern technologies
    including Node.js + TypeScript, RBDs such as Postgres,
    REST APIs, NoSQL, etc.

