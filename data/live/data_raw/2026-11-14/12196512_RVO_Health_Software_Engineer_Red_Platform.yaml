  THIS POSTING IS FOR A CURRENT VACANCY AND THE EMPLOYER
  INTENDS TO FILL THIS POSITION BY FEBRUARY 9, 2027.

  Who We Are:

  Founded in 2022, RVO Health is a new healthcare platform of
  digital media brands, services and technologies focused on
  building relationships with people throughout their health &
  wellness journey. We meet people where they are in their
  personal health journeys and connect them with both the
  information and the care they need. RVO Health was created
  by joining teams from both Red Ventures and UnitedHealth
  Group’s Optum Health. Together we’re focused on delivering
  on our vision of a stronger and healthier world.

  RVO Health is comprised of Healthline Media (Healthline,
  Medical News Today, Psych Central, Greatist and Bezzy),
  Healthgrades, FindCare and PlateJoy; Optum Perks, and the
  virtual coaching platforms Real Appeal, Wellness Coaching,
  and QuitForLife.

  We offer competitive salaries and a comprehensive benefits
  program for full-time employees, including medical, dental
  and vision coverage, paid time off, life insurance,
  disability coverage, employee assistance program, 401(k)
  plan and a paid parental leave program.

