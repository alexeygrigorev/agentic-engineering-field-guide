  Job Description

  This individual will be part of an autonomous, cross-
  functional team that will typically include a product owner
  (team lead); a scrum master (agile methods lead); an
  information architect; a content lead; a social business
  manager; a designer; one or more developers; and a metrics
  analyst. Applicants should be detail-oriented, self-
  motivated, highly organized, and able to work in a team
  environment.

  Responsibilities

  • Integration of enterprise APIs to build a world class
  digital presence

  • Seamless back-end integration of social tools, feeds,
  interfaces for an enterprise web presence

  Skills

  • Background in highly scalable and/or highly reliable
  systems is strongly preferred

  • Experience building distributed systems in Java

  • Strong competency in Object Oriented Programming

  • Experienced in building RESTful web services

  • Experience with Agile Methodologies, preferably Scrum

  • J2EE, XML processing, XSL, Java Design Patterns, SVN,
  jUnit, Ant, AJAX, JQuery, Dojo, Web Services

  • Experienced on AIX and Linux

  • Cross-browser knowledge

  • Rational Application Development IDE experience

  • At least 5 years of practical software development
  experience on a commercial project

  Education

  • Bachelor’s degree or equivalent work experience

