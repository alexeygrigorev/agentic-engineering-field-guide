description: |
  Founding Engineer – Akomi

  Akomi is looking for a Founding Engineer to join our early-
  stage team. You’ll work closely with the founders to shape
  and implement features end-to-end. This role is ideal for
  engineers who value craft, quality, and want to deliver
  modern AI products in healthcare.

  What You’ll Do

  - Collaborate directly with co-founders to take features from
    idea to production.
  - Design, develop, and deploy full-stack solutions that scale
    to hundreds of providers.
  - Orchestrate long-running AI agent tasks with reliable
    execution and retries.
  - Build systems to submit clinical information via numerous
    website portals, using hybrid LLM + computer-use
    techniques.
  - Create tools to audit patient clinical documentation against
    payer-specific guidelines with inventive LLM engineering.
  - Implement user-facing features with modern web development
    patterns and best practices.

  Who You Are

  - A skilled software engineer with 2–10 years of experience.
  - Proficient in system design and full-stack development.
  - Comfortable working across the stack, taking on new
    challenges outside your comfort zone, and thriving in
    ambiguity.
  - Experienced with Next.js, React, and TypeScript.
  - Hands-on experience with LLMs in agent workflows (structured
    outputs, function calling, etc.).
  - Passionate about the craft of software engineering and
    building high-quality products.
