description: |
  Staff Full-Stack Engineer (Message Delivery & Dispatch) As a
  Staff Engineer at Capital One, you will be part of a
  community of technical experts working to define the future
  of banking in the cloud. You will work alongside our
  talented team of developers, machine learning experts,
  product managers and people leaders. Our Staff Engineers are
  leading experts in their domains, helping devise practical
  and reusable solutions to complex problems. You will drive
  innovation at multiple levels, helping optimize business
  outcomes while delivering strong technology solutions. At
  Capital One, we believe diversity of thought strengthens our
  ability to influence, collaborate and provide the most
  innovative solutions across organizational boundaries. You
  will promote a culture of engineering excellence and strike
  the right balance between lending expertise and providing an
  inclusive environment where the ideas of others can be heard
  and championed. You will lead the way in creating next-
  generation talent for Capital One Tech, mentoring engineers
  and actively recruiting to keep building our community.
  Staff Engineers are expected to lead through technical
  contribution. You will operate as a trusted advisor for our
  key technologies, platforms and capability domains, creating
  clear and concise communications, code samples, blog posts
  and other materials to share knowledge both inside and
  outside the organization. You will specialize in a
  particular subject area, but your input and impact will be
  sought and expected throughout the organization. What You'll
  Do:

  - Architect at Scale: Own the end-to-end architecture for
    delivery across all our properties (site, emails, SMS,
    push notifications, messages, AdTech ecosystems, and
    inbound channels) enabled by AI. You will ensure a well-
    managed, highly resilient architecture capable of handling
    billions of messages a month with zero downtime.
  - Governance & Compliance Stewardship: Serve as the primary
    technical authority on email governance and evolving
    regulatory standards, including UDAAP and state-specific
    regulations such as the FCCPA. Because dispatch is the
    last mile delivery before reaching customers, you will
    design and enforce safety protocols to protect the brand,
    LOBs, and customers, ensuring all communications adhere to
    enterprise compliance and risk frameworks. You will bring
    a cyber-security perspective to the delivery architecture.
  - Drive Message Delivery Platform Convergence: Lead the
    technical strategy to modernize legacy messaging systems
    into a unified Enterprise Message Delivery platform. Drive
    the initiative to migrate off legacy systems, architect
    vendor-agnostic 'Built and Bought' solutions, and scale
    the orchestration layer to handle enterprise-scale
    traffic, AdTech pipeline integration, and B2B2C partner
    messaging (dealer-to-customer).
  - Build Automations: Implement automations across various
    workflows to avoid expensive migrations and establish
    engineering standards.
  - Vendor strategy: Help drive decision making around vendor
    strategy for build vs. buy.
  - Cross-Functional Leadership & Mentorship: Act as the
    technical leader for engineering teams (Message Delivery,
    Orchestration, Integration) in the dispatch domain. Help
    Senior and Lead ICs and other developers grow by providing
    them with ample scope and guiding them through complex
    technical challenges in a highly regulated, high-
    availability environment.
  - Stay current with industry trends and bring best practices
    and recommendations to drive innovation.
  - Data Product Competency & Observability: Drive a data-first
    approach to platform health by treating delivery metrics
    as a first-class product. You will architect robust
    telemetry and analytics pipelines that enable real-time
    observability, predictive performance tuning, and data-
    driven optimization of delivery pathways, ensuring high-
    fidelity insights that directly improve operational
    efficiency and customer experience

  Basic Qualifications:

  - At least 7 years of experience in software engineering and
    solution architecture
  - At least 7 years of experience in Enterprise architecture
    and design patterns
  - At least 2 years of experience of deploying and delivering
    platforms within cloud environments
  - At least 1 year of hands-on experience with LLM systems,
    including RAG or embeddings, prompt or plan tooling, and
    model governance.

  Preferred Qualifications:

  - Master's Degree in Computer Science or Software Engineering
  - 10+ years of experience in all of the following:
    - Software engineering and solution architecture
    - Enterprise architecture and design patterns
    - Web technologies (JavaScript, TypeScript and SPA frameworks)
    - Designing and building distributed HPC and ML systems
    - Cloud computing (AWS, Microsoft Azure, Google Cloud)
    - Data architecture
  - 10+ years of professional experience coding in commonly used
    languages like Go, Java, JavaScript/Typescript, Python,
    Rust, C#, Scala
  - 8+ years of experience with database and database management
    systems
  - 10+ years of professional experience in the full lifecycle
    of system development, from conception through
    architecture, implementation, testing, deployment and
    production support
  - 5+ years of experience with public cloud platforms (AWS,
    GCP, Azure), cloud-based productivity tools, or
    virtualization technologies
  - 10+ years of experience with Networking protocols and
    integration with third party distributed systems
  - 5+ years of experience mentoring senior engineers and
    driving professional development within technical teams
  - 2+ years of experience leading cross-domain architectural
    reviews and establishing coding and design standards
  - Expertise in the strategic application of agentic AI coding
    tools to solve systemic development challenges

   Capital One will consider sponsoring a new qualified
  applicant for employment authorization for this position.
