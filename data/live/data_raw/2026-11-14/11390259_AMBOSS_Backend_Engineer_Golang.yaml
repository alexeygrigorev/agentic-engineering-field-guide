description: |
  Hi! We are AMBOSS and we are looking for a Backend Engineer
  (Golang) to join our Shop team, and shape the future of
  medical education with us! About AMBOSS

  AMBOSS is a dynamic learning and clinical decision support
  tool committed to empowering physicians globally to deliver
  optimal care. Since our inception in 2012, we've harnessed
  cutting-edge technology to transform the way physicians
  acquire and apply scientific knowledge. Each AMBOSSian is
  passionate about being the champion of clinicians today -
  this motivates and unites us each day towards success. And
  what does success look like? When a clinician or med student
  tells us, “AMBOSS makes practicing medicine easier and
  enjoyable. I love what I do, and a big part is because of
  AMBOSS.” Why can this position be exciting for you?

  We are AMBOSS, and we’re looking for a Backend Engineer in
  the Shop team. Engineers at AMBOSS are at the forefront of
  shaping user experience for doctors and students, helping
  them make critical decisions, ultimately impacting the
  healthcare of billions of people worldwide. We are looking
  for someone with a passion for technology who wants to keep
  growing their engineering craft while helping the team raise
  its bar. We work AI-first: agentic tools like Claude Code
  are part of our daily engineering workflow, and we are
  looking for someone excited to help shape how software gets
  built in this new era. Join our agile team on a mission to
  build and run the gateway that lets medical students and
  clinicians around the world access the AMBOSS platform If
  you’d like to learn more about our unique culture, check out
  this video.

  You will:

  - Actively contributing to engineering projects within our
    Shop domain, from conception to completion.
  - Apply best practices in code health, testing, and
    maintainability, and help us improve them.
  - Use AI and agentic tools (like Claude Code) across the
    development lifecycle, from exploration and implementation
    to testing and code review.
  - Help implement the team's technical vision, and take part in
    the strategy conversations behind it. Understanding why a
    given technology choice matters, not just what it is.
  - Participate in incident resolution, get to root causes and
    build the preventative measures that stop a repeat.
  - Collaborate with cross-functional teams to refine project
    requirements and specifications.
  - Address Ad-Hoc requests from customer support channels.
  - Share your knowledge within the AMBOSS community,
    contributing to a culture of continuous learning and
    growth.

  You bring:

  - 3+ years of solid hands-on experience with Golang, plus
    MySQL or NoSQL.
  - Solid experience using AI coding tools such as Claude Code
    (or similar), and exposure to agentic engineering
    workflows.
  - Experience across the web development lifecycle, including
    coding, testing, deployment, and maintenance; exposure to
    requirements analysis and system design is a plus.
  - Experience building and integrating APIs (GraphQL and/or
    RESTful) and working with relational database design.
  - Familiarity with SOLID principles, clean code, and common
    design patterns, and interest in applying them in day-to-
    day work.
  - Proficient in using Git for version control, including
    branching, merging, and code review processes.
  - Good to have experience with payment processing solutions
    like Stripe, Chargebee etc.
  - Good problem-solving and analytical skills, and the ambition
    to take on increasingly complex technical challenges.
  - Good verbal and written communication skills in English,
    able to explain technical concepts clearly to different
    stakeholders.
  - Good collaborative instinct to build real working
    relationships, help resolve team-level friction through
    clear communication, and step in when a teammate needs
    support.
  - Curiosity, being interested in optimizing processes,
    learning domain’s ins and outs.
  - Taking initiatives, having analytical mindset, being
    proactive and solution-oriented.
  - A sense of ownership and the drive to see topics through.

  Benefits:

  AMBOSSians tell us that innovative work keeps them
  energized, and employee benefits help them to feel
  appreciated and empowered. We invest in every AMBOSSians
  with our employee benefits package, crafted to support
  financial, physical, and mental health and work-life
  harmony. Check out all of our employee benefits below:

  https://go.amboss.com/the-amboss-prescription-de

  We believe that diversity is a powerful driver of innovation
  and progress. That’s why we are committed to fostering an
  inclusive, respectful, and supportive environment where
  everyone—regardless of gender, age, ethnic or cultural
  background, religion, disability, sexual orientation, gender
  identity—is valued and given equal opportunity to thrive. We
  warmly welcome people of all backgrounds to help us fulfil
  our mission: empowering all medical professionals to provide
  the best possible care .

  Even if you don’t meet every single point in the job
  description, we still encourage you to apply. We’d love to
  hear from you!
