description: |
  Job Title: Full Stack Developer

  Location: NYC, hybrid

  Position Type: Full-Time

  About us

  Wayward is a well-funded, high-growth startup with proven
  product-market fit (3x YoY growth and still early days). Our
  mission is to build a marketplace that transforms editorial
  and creator content into ad inventory, providing brands with
  a scalable new channel for deploying budgets. By converting
  content into media, we are reshaping performance marketing
  and creating an entirely new path for global ad spend.

  We are a small, tight-knit team where every individual
  significantly impacts the product and business. Our culture
  is fast-moving, ambitious, and ownership-driven. We operate
  with urgency, leverage AI to accelerate our work, and expect
  everyone to strive for the highest level of quality. If you
  thrive in an environment where focus and creativity
  converge, and you want to help define both a product and a
  category, you will fit right in.

  Why Join Us

  - The chance to be an early engineer at a rocketship startup
    reshaping a trillion-dollar industry
  - Big vision, massive traction, and still small enough that
    every new hire shapes the culture, the product, and the
    category we’re building
  - Work with a team that values speed, ownership, and
    innovation above all else

  What We’re Seeking

  - A highly driven builder who thrives in fast-paced, high-
    impact environments
  - Exceptional written and verbal communication skills
  - Ability to work hybrid from our NYC office
  - Curious and adaptive, leveraging AI tools to enhance output,
    not replace critical thinking
  - Entrepreneurial mindset, eager to shape not just code, but
    the company's direction
  - A strong sense of ownership
  - Product-minded with good taste
  - 2-5 years of minimum work experience

  Responsibilities

  As a Software Engineer on our early team, you’ll own
  projects end-to-end - from architecture and implementation
  to deployment and iteration. You’ll use AI daily to
  supercharge your workflow, whether that’s writing code,
  debugging, or optimizing systems. You’ll move fast, shipping
  features that power our platform and directly impact how
  brands deploy budgets into publisher and creator content.
  This role demands extreme ownership: identifying problems
  before they surface, proposing solutions, and driving them
  to execution at startup speed. You’ll collaborate closely
  with founders and cross-functional partners, helping to
  shape not just the product, but the technical direction of
  the company itself.

  We believe in finding the right tool for the job and hiring
  flexible learners. Our current tech stack includes:

  - Typescript
  - React
  - GCP: BigQuery, Cloud Run, GCS
  - Postgres, MySQL
  - Redis
  - Elasticsearch
  - Git
  - Terraform, Pulumi
  - Docker
