description: |
  Camunda is the enterprise platform for agentic
  orchestration, enabling organizations to coordinate AI
  agents, people, and systems across complex, end-to-end
  business processes. With built-in governance, auditability,
  and human oversight, Camunda gives enterprises the control
  they need to move AI from pilots to production — safely and
  at scale. Trusted by over 700 organizations worldwide,
  including 9 of top 10 US banks, Camunda helps enterprises
  boost operational efficiency, accelerate time-to-value, and
  deliver better customer experiences. Fully remote and
  global, we are in the middle of something bigger:
  transforming into an AI-first organisation, built on our own
  platform. We use Agentic AI to automate, orchestrate
  intelligent processes, and elevate human contribution across
  every team. Named GP Bullhound’s Top 100 Next Unicorn list,
  2025 Great Place to Work certified. Visionary in 2025
  Gartner® Magic Quadrant™ for Business Orchestration and
  Automation Technologies. ranked 3rd in Flexa's 2026 Most
  Flexible Companies, We’re growing fast and looking for top
  talent to join our team. If you want meaningful work,
  visible impact and put something genuinely rare on your CV,
  keep reading.

  About the Role:

  Camunda runs on trusted data for people and agents. The
  Holistic Data Platform (HDP) is how we get there: a data
  warehouse, consumption layer, and a context layer that
  agents use to answer questions about pipeline, bookings, ARR
  and product usage. We are hiring a Data Engineer who builds
  that platform and also cares whether the numbers are right,
  whether the business uses them, and whether an agent gives a
  correct answer on top of them. You will work directly with
  Corporate Strategy, Finance, Sales, Product, and Marketing
  leaders. What you'll be doing:

  - Data Engineering:
    - Agent reliability. Build evals for the agents that sit on
      HDP. Review their answers, find the wrong ones, and fix
      the cause in the data, the docs, or the prompt context.
    - Pipelines and platform. Ingestion, orchestration, dbt,
      CI/CD, and cost control.
  - Machine Learning:
    - Help us figure out where customers are getting stuck and how
      we can better support them.
  - Analytics Engineering
    - Product Telemetry: Working with our product team to make
      sense of telemetry and build a better product for our
      customers.
    - Data quality as a product. Define what “correct” means for
      each important metric, test for it, monitor it, and tell
      us fast when it breaks. Reconcile HDP against data
      sources.
    - Enablement. Make it easy for analysts and business owners to
      get answers without you.

  What you bring:

  - We’re looking for an experienced data engineer with ML/AI
    experience who’s comfortable working in an AI-native
    environment
  - Ability and/or willingness to use Camunda’s product
  - 5+ years of Data Engineering or ML experience
  - Strong data modeling skills and several years of experience
    with dbt.
  - Ownership mindset: we’re a small team and proud of our
    accomplishments
  - Experience in deploying, operating, and evolving data
    pipelines in the cloud (batching and streaming)
  - Knowledge of Infrastructure as code tools such as Terraform
  - Strong communication skills, enjoys sharing knowledge and
    learning collaboratively
  - Passion for clean code, adept at writing automated tests to
    maintain codebase quality and product excellence

  This role is an existing vacancy

  #LI-JS1 #LI-DNI

  What We Have to Offer:

  Compensation

  We offer competitive, fair, and transparent compensation.
  Salary ranges are location-based, with Standard and Major
  markets (global tech hubs) reflecting local competition.

  The Annual Total Target Cash (base salary + 100% variable
  target, where applicable) shown below spans from the minimum
  in a Standard market to the maximum in a Major market. Final
  offers depend on skills, experience, and location, and we
  typically hire in the first half of the range to allow room
  for growth:

  - United States: $143,800.00 to $231,900.00
  - United Kingdom: £90,300.00 to £148,500.00
  - Singapore: S$178,600.00 to S$267,900.00

  If you’re based elsewhere, you’ll be hired via Remote.com
  (our global employer partner), and your Talent Acquisition
  Partner will provide a personalized Total Rewards Calculator
  after your first interview.

  Equity: We also offer equity (where applicable) through our
  Virtual Stock Option Plan (VSOP).

  Benefits & Perks

  We invest in your wellbeing, growth, and ability to connect,
  along with perks that support you no matter where you’re
  based. Our benefits are globally designed and locally
  delivered where applicable.

  - Remote & Flexible: Work from anywhere with the setup that
    suits you, home office budget, co-working space support,
    and flexible time off to recharge when you need it.
  - In Person Connection: We invest in meaningful face time
    through our Annual Kickoff (Vienna in 2025, Madrid in
    2026!), team offsites, and Camundi Connection Budgets,
    including contributing to meetups while travelling,, and
    local gatherings with fellow Camundi.
  - Health & Wellbeing: Access locally tailored healthcare,
    Modern Health for global mental wellbeing, and our Live
    Well Lifestyle Spending Account (LSA), a flexible, global
    benefit that puts you in control of your whole life, not
    just work, from: staying active, to caring for family,
    exploring personal passions, meaningful experiences, and
    investing in your financial wellbeing. The Live Well
    program launches in 2026 and scales to €1,000 annually
    from 2027.
  - Financial Security: Retirement and pension plans (often with
    company contributions), plus life and disability insurance
    where relevant.
  - Professional Growth: Up to $/€/£1,000 per year for self-
    driven learning: courses, certifications, books, you
    decide!

