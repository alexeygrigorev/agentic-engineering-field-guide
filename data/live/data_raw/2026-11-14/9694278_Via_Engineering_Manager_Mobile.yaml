description: |
  Via is on a mission to create public transportation systems
  that provide far greater access to jobs, healthcare, and
  education. Our platform serves as the technology backbone
  for modern transit networks, transforming antiquated and
  siloed public transportation systems into smart, data-
  driven, and efficient digital networks. With hundreds of
  agency partners around the world, Via is recognized as the
  leading transportation technology and service provider
  globally.

  As an Engineering Manager, Mobile at Via, you’ll own a key
  product line and lead a team building mobile apps that power
  reliable, equitable and sustainable transit for communities
  worldwide. You’ll pair strategic leadership with end-to-end
  execution, shaping product direction, scaling core
  experiences, and driving meaningful real-world impact by
  building from the ground up on Via’s established platform.

  About the Role:

  - Lead the development of key mobile initiatives, such as
    improving rider/driver app performance, reliability, and
    user experience across iOS and Android
  - Own and execute a roadmap focused on scalability (e.g.
    handling peak demand, optimizing app responsiveness, and
    reducing latency across core user flows)
  - Drive cross-functional projects with Product, Design, and
    Backend teams to launch new features end-to-end, from
    concept through production
  - Improve engineering quality and velocity by introducing
    better development practices, strengthening code review
    standards, and evolving mobile architecture
  - Build and grow a high-performing team by hiring, mentoring,
    and supporting engineers across different levels
  - Identify and lead improvements to team processes (e.g.
    release cycles, CI/CD, testing frameworks) to increase
    efficiency and reduce friction
  - Contribute to broader mobile initiatives, such as aligning
    on shared tooling, frameworks, and long-term platform
    strategy

  About You:

  - 7+ years of experience building mobile applications (iOS or
    Android), including experience working on production-scale
    apps
  - Proven experience leading engineering teams and delivering
    complex projects end-to-end
  - Strong understanding of mobile architecture, performance
    optimization, and modern development practices (e.g.
    CI/CD, testing, MVVM)
  - Comfortable working across mobile, backend, and product
    domains to deliver cohesive solutions
  - Collaborative and pragmatic, able to balance speed with
    quality and make thoughtful trade-offs
  - Hands-on and detail-oriented when needed, while still
    operating effectively at a leadership level
  - Clear communicator who builds trust across teams and creates
    a positive, inclusive team environment

  Compensation and Benefits

  - Final salary will be determined by the candidate’s
    experience, knowledge, and skills. Salary reflected does
    not include equity or variable pay, where applicable
  - Salary Range: $215,000 - $265,000
  - We are proud to offer a generous and comprehensive benefits
    package, including free medical plans and 401K matching.

  We’re Via, and we build technology that changes the way the
  world moves. We’re driven by a simple mission: to create
  modern and efficient public transportation systems that
  provide far greater access to jobs, healthcare, and
  education. With our best in class suite of products, we make
  transit thrive.

  Our teams of worldclass engineers, data-scientists, product
  managers, operations specialists, marketers, transit experts
  and more bring cutting-edge AI-powered software and
  innovative technology-enabled operations to our partners
  across the globe. Founded in 2012, Via builds solutions to
  digitize, automate, and enable data-driven decision making
  for entire transportation networks; fixed-route buses,
  microtransit, paratransit, school buses, autonomous
  vehicles, and more.

  If you’re excited to be at the forefront of modernizing the
  future of transportation, are up for solving tough problems,
  and willing to become/already are a transit nerd, we are the
  place for you. Even if your past experience doesn’t align
  perfectly with every qualification in the job description
  for this role, we encourage you to apply. You may be just
  the right candidate for this or other opportunities.

  Ready to join the ride?

  Via is an equal opportunity employer.
