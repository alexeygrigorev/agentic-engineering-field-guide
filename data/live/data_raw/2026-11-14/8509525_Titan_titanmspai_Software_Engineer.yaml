description: |
  About Titan:

  Titan is building the AI workforce for IT. We deploy AI
  agents across our portfolio of Managed Service Providers and
  enterprise customers: agents that monitor, triage, and
  resolve work across the service desk, infrastructure,
  security, identity, endpoint, and application operations.
  The result is faster resolutions, better uptime, and more
  proactive, personalized support, delivered 24/7.

  In under a year we've raised over $100M from General
  Catalyst, 8VC, and CalPERS, acquired market-leading MSPs
  like RFA, and put agents into production in large
  enterprises. We've automated 100K+ tickets across 400+
  customers. Our tech team has talent from Scale AI,
  CoreWeave, Vanta, Dropbox, Meta, FiveRings, TwoSigma,
  Amazon, Harvard, Stanford, and MIT.

  Joining Titan means helping redefine how work gets done in
  IT services, and building a $100B company.

  About The Role:

  As a Software Engineer at Titan, you’ll play a pivotal role
  in shaping the future of AI-powered IT service delivery.
  You’ll work across the stack to build intuitive, high-impact
  products that blend human expertise with autonomous AI
  agents, transforming how managed service providers (MSPs)
  operate. This is an opportunity to join an early-stage team,
  have meaningful product ownership, and help define the
  engineering culture as we scale.

  What You Will Do:

  - Design, build, and maintain scalable backend systems that
    power AI-driven automation.

  - Develop APIs and services that integrate AI models into
    customer-facing applications.
  - Drive technical decisions around system architecture,
    scalability, and best practices as we scale.
  - Ship fast and iterate, balancing speed with quality in a
    fast-paced, startup environment.

  Who You Are:

  - 3+ years of software engineering experience, with expertise
    in building and scaling web services.
  - Strong proficiency in Python, Node.js, or Go, with
    experience in cloud-based architectures (AWS, GCP, or
    Azure).
  - Familiarity with AI/ML-driven systems or real-time data
    processing is a plus.
  - User-focused builder - you care deeply about the customer
    experience and sweat the details.
  - Startup mindset - comfortable with ambiguity, eager to take
    ownership, and ship quickly.
  - Bonus: Experience integrating LLMs, AI-powered automation,
    or observability tools is a plus, but not required.
