description: |
  We are seeking a Principal Software Engineer to join our
  Corporate Credit Derivative technology team based in London.
  The successful candidate will own the design, development,
  and deployment of solutions. This requires working closely
  with the business, including trading, strats and coo as well
  as other important stake holders across the many business
  and technology areas. The tools the team deliver cover
  pricing, risk, price distribution as well as many other
  critical trading capabilities. Understanding the why as well
  as the what, you will work to deliver functionality that
  helps to increase trader efficiency, improve the platform
  performance and stability, and reduce time to market for
  change.  Engineering best practices are at the core of
  everything we do and bringing thought leadership together
  with a collaborative approach to design and delivery will be
  a recipe for success.

  The Fixed Income Division (FID) Credit team is focused on
  delivering the technology that allows Morgan Stanley to
  continue to grow its highly successful corporate credit
  trading business – a key growth area for the Firm. Latest
  initiatives in this space include continued
  electronification and automation of the flow businesses, as
  well as enhancing and renovating our suite of internally
  built trading systems. This will allow the firm to take
  advantage of market opportunities and drive revenue.

  We adopt the latest in Frontier AI tools to help ensure that
  we build systems in the most efficient way possible.
  Understanding how to leverage the latest in Frontier models
  and Agentic tooling, the successful candidate will not only
  use that knowledge to deliver capabilities efficiently but
  will also be a thought leader as the ecosystem evolves and
  the technology becomes further integrated into the systems
  themselves. In the Technology division, we leverage
  innovation to build the connections and capabilities that
  power our Firm, enabling our clients and colleagues to
  redefine markets and shape the future of our communities.
  This is a Software Engineer position at Vice President
  level, which is part of the job family responsible for
  developing and maintaining software solutions that support
  business needs. Since 1935, Morgan Stanley is known as a
  global leader in financial services, always evolving and
  innovating to better serve our clients and our communities
  in more than 40 countries around the world. What you'll do
  in the role:

  - You will own capabilities from initial requirements
    gathering, to implementation, deployment and subsequent
    support.
  - You should be a practical technologist, who can show
    excellent problem-solving skills and enjoys all aspects of
    software development.
  - You will work closely with several global teams within the
    technology department as well as interacting directly with
    the Corporate Credit business unit to translate business
    needs into technical projects.
  - You will be expected to take on management responsibility
    for developers and contractors as opportunities arise.

  What you'll bring to the role:

  - At least 8+ years' relevant experience would generally be
    expected to find the skills required for this role’,
    working with Java/.Net working experience in the industry.
  - Experience with using AI for support, development, and
    design.
  - Development experience in object-oriented programming and
    working with mixture of new and legacy systems.
  - Ability to work in a globally distributed team effectively.
  - Demonstrate some ability to work with latest AI agents.
  - Data structures, design patterns and collections
  - Multi-threaded programming
  - Proven track record of delivery, technical leadership and
    software project management
  - Self-driven problem solver with good attention to detail.
  - Preferred Scala and Python knowledge.
  - Preferred hands on experience with Agentic/ Frontier tools
    for software development (e.g. Claude Code, Co Pilot
    and/or Sourcegrapgh AMP)

