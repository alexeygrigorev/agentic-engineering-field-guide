description: |
  🏢 Who we areA team from Germany with the vision to make
  advanced network security accessible for everyone

  We are a software company developing an open source zero-
  trust network security platform that is both easy to use and
  affordable for teams of all sizes and budgets. Our mission
  is grounded in a simple yet powerful belief: secure private
  networking is a fundamental right of every modern company.

  Since our launch on GitHub in 2021, we have gained trust
  among thousands of companies seeking secure and seamless
  solutions for connecting remote employees and
  infrastructure. By replacing traditional centralized VPNs,
  NetBird has become a trusted choice for modern network
  security, connecting today hundreds of thousands of users
  and machines worldwide. Our open source, community-driven
  approach has been a key driver of our success. We listen to
  our users, and their input helps us make network security
  better for everyone.

  Want to see what we're working on? Check out our GitHub repo
  at https://github.com/netbirdio/netbird or
  https://netbird.io/knowledge-hub

  ✏️ What you will do

  As a Software Engineer (Frontend), you will play a key role
  in evolving NetBird’s product by designing and developing
  intuitive and responsive user interfaces. Your work will
  directly impact the usability, accessibility, and overall
  user experience of our platform, making it accessible to a
  broader audience. Specifically, you will:

  - Lead frontend development efforts, creating user-friendly
    web interfaces that align with our product vision and user
    needs.
  - Take a holistic approach to the product lifecycle, from
    concept and coding to deployment, monitoring, and
    refinement.
  - Collaborate with backend engineers, designers, and product
    managers to implement features and enhancements.
  - Ensure the performance, quality, and responsiveness of
    applications across various devices and browsers.
  - Stay updated with the latest industry trends and
    technologies to bring innovative solutions to the
    platform.

  If you read this far and think: "that's me!" — You probably
  won't need to read any further, and we should have a
  conversation. But if you doubt the type of experience we
  expect you to have, the following should help clarify.



  🔎 What we are looking for

  We’re looking for someone who thrives in a collaborative
  environment and loves helping customers succeed.

  Must-Haves

  - 3+ years of professional software engineering experience,
    with a focus on frontend development.
  - Strong proficiency in JavaScript, HTML5, CSS3, and modern
    frontend frameworks such as React and Next.js.
  - Understanding of UI/UX design principles and the ability to
    translate user needs into functional interfaces.
  - Strong experience with unit and integration testing of
    frontend components.
  - Excellent collaborative skills, the ability to work
    independently, and adaptability in a fast-paced startup
    environment.
  - Proficiency in English with excellent communication skills.

  Nice-to-Haves

  - Familiarity with build tools and version control systems
    like Webpack, Babel, and Git.
  - Experience in optimizing applications for speed and
    scalability.
  - Knowledge of web accessibility standards and best practices.
  - Contributions to open source projects.
  - Experience working in cloud environments.



   😌 What’s in for you

  We know that happy and supported team members build the best
  products. That’s why we offer:

  - Comprehensive compensation package: Receive a competitive
    base salary and equity incentives.
  - Hybrid work environment: Enjoy the flexibility of working
    both from our centrally located Berlin office and
    remotely.
  - Diverse and collaborative team: Join a team that values
    fast, clean shipping and works together to achieve great
    results.
  - High level of independence: This is not a strict 9-to-6
    role. We focus on outcomes, not the appearance of work.
  - Growth opportunities: Be part of a rapidly growing company
    at the forefront of the Zero Trust security revolution.
