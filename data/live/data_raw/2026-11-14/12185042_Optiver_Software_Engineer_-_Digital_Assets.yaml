title: Software Engineer - Digital Assets
company: Optiver
location: London, GBR
work_type: FULL_TIME
company_size: 1,600 Employees
description: |
  Optiver is looking for a Software Engineer to join our
  Digital Assets Team in London. In this role, you’ll build
  and evolve trading systems for cryptocurrency markets,
  working closely with traders and researchers to deliver
  solutions in a fast-moving and constantly changing
  environment.

  You’ll play a key role in building out our digital assets
  platform, helping shape both the technology and engineering
  practices from the ground up. You’ll work side-by-side with
  traders and researchers, iterating quickly on ideas and
  translating market insights into production systems. From
  integrating with major centralised exchanges to improving
  system reliability in real-world conditions, your work will
  directly impact how we trade in this rapidly growing space.

  What you’ll do

  - Design and build trading systems for digital asset markets
  - Develop and manage connectivity to centralised exchanges
    such as Binance, Deribit, and OKX
  - Work directly with traders and researchers to prototype and
    iterate on trading strategies
  - Improve system reliability through automation, monitoring,
    and robust recovery mechanisms
  - Troubleshoot issues across trading systems and exchange
    integrations
  - Contribute to architecture and help shape the digital assets
    platform
  - Take ownership of production systems and drive continuous
    improvements

  Who you are

  - Experience building high-performance, reliable systems
    ideally involving exchange connectivity, market data,
    trading infrastructure or other real-time applications -
    experience with cryptocurrency exchanges, trading
    protocols or digital asset markets would be desirable.
  - A solid understanding of software architecture, networking,
    distributed systems and failure handling.
  - Beneficial to have C++ development skills, with experience
    building reliable production systems
  - Beneficial to have hands-on experience integrating with
    centralised cryptocurrency exchanges (e.g., Binance,
    Deribit, OKX)
  - Beneficial to have experience working with cloud
    technologies (e.g., AWS, GCP, or similar)
  - Strong problem-solving skills and an interest in tackling
    complex technical challenges in fast-paced environments
  - A collaborative mindset with the ability to take ownership
    and partner closely with traders and researchers.
  - Able to translate ambiguous trading requirements into
    practical engineering solutions
  - Ownership-driven mindset with a focus on building resilient
    systems

  Who we are

  At Optiver, our mission is to continuously improve the
  market. By providing liquidity and accurate pricing in
  various financial instruments, to multiple exchanges across
  the world, we participate in the safeguarding of healthy and
  efficient markets.

  What you’ll get

  You’ll join a culture of collaboration and excellence, where
  you’ll be surrounded by curious thinkers and creative
  problem solvers. Motivated by a passion for continuous
  improvement, you’ll thrive in a supportive, high-performing
  environment alongside talented colleagues, working
  collectively to tackle the toughest problems in the
  financial markets.

  In addition, you’ll receive:

  - A performance-based bonus structure, enabling all of our
    employees to benefit from our global profit pool.
  - 27 paid vacation days plus all UK public holidays.
  - Daily breakfast and lunch, along with support on commuting
    expenses.
  - Private medical insurance, pension scheme, and ClassPass
    fitness membership.
  - Training and continuous learning opportunities, including
    access to conferences and tech events.
  - International transfer opportunities for global career
    growth.

  How to apply

  Apply directly via the form below. If you have any questions
  feel free to contact our Recruitment team via
  recruitment@optiver.com.

  Please note:

  - We do not require any assistance from third-parties
    including agencies in the recruitment of this role
  - We cannot accept applications via email

  Diversity statement

  Optiver is committed to diversity and inclusion.
