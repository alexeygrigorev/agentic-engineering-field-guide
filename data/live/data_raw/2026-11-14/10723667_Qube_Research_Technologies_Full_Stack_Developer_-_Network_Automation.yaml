description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology- and
  data-driven group implementing a scientific approach to
  investing. Combining data, research, technology, and trading
  expertise has shaped our collaborative mindset, which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high-quality returns for our investors.

  The Network Automation team builds reliable, scalable tools
  that simplify network operations and improve engineering
  efficiency. We partner with our expert network engineers,
  infrastructure teams and business stakeholders to turn
  operational workflows into production-grade applications and
  intuitive user experiences.

  In this role you will work across the full development
  lifecycle, contributing to backend services, frontend
  interfaces, testing, deployment and observability. You will
  help shape technical decisions, improve engineering
  practices and build tools that make network operations
  safer, faster and more reliable.

  Prior networking experience is useful but not essential;
  curiosity about infrastructure automation and a willingness
  to learn the domain are highly valuable.

  Your Future Role within QRT

  - Design, build and maintain scalable network automation
    applications.
  - Develop and drive the design of reliable backend services
    and APIs, as well as contribute to modular frontend UIs.
  - Work closely with network engineers, infrastructure teams
    and stakeholders to understand requirements and translate
    them into practical solutions.
  - Build systems that are observable, testable, maintainable
    and well documented.
  - Contribute to code reviews, testing practices, CI/CD
    pipelines and deployment processes.
  - Build on and improve our agentic development workflows, to
    enable us to
  - Help the team adopt effective tooling, modern engineering
    practices and responsible AI-assisted development
    workflows.

  Your Present Skillset

  - Strong production experience in at least one of Go, Python,
    plus working knowledge of React/TypeScript.
  - Willingness and ability to work across backend and frontend
    codebases.
  - Experience analysing complex problems and building robust,
    maintainable systems.
  - Ability to communicate technical decisions, progress and
    risks clearly to both technical and non-technical
    audiences.
  - Experience working in Agile delivery environments, including
    planning, estimation and iterative releases.
  - Desirable
    - Experience working with cloud environments, preferably AWS.
    - Experience with structured data and relational databases
      such as SQL/PostgreSQL.
    - Experience with observability tools such as Prometheus,
      Alertmanager and Grafana.
    - Experience in network automation, infrastructure automation,
      NetDevOps or operational tooling.
    - Knowledge of automated testing, CI/CD, DevOps practices and
      infrastructure-as-code tooling such as Terraform.
    - Knowledge of network inventory, configuration management,
      IPAM, monitoring or provisioning systems.

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
