description: |
  Our Future Health is an ambitious collaboration between the
  public, charity and private sectors, designed to help people
  live healthier lives for longer through better prevention,
  earlier detection and improved treatment of diseases. We
  will speed up the discovery of new methods of early disease
  detection, and the evaluation of new diagnostic tools, to
  help identify and treat diseases early, when outcomes are
  usually better. With over 2.8M volunteers across the UK,
  we’re now the world’s biggest health research programme of
  its kind, and our volunteer group is also more diverse than
  other, similar health research programmes.

  Technology and data are central to our mission. Our systems
  power web sites, clinics across the UK, secure analytics and
  research systems, pipelines that process highly sensitive
  health and genetic data, and we are continuing to grow our
  engineering capability to support this ambition.

  We are hiring a backend leaning full-stack focused Senior
  Software Engineer to join our Research Enablement squad.
  This squad sits on the intersection of the Trusted Research
  Environment (TRE) and our bespoke security tooling and
  assets. Our squad vision is to create a secure, trusted and
  state of the art research environment to empower Researchers
  with their health research. We work closely with some of our
  internal operational teams as well as external partners, and
  are solving lots of rare but exciting problems.

  Our engineers are full-stack, handling frontend, backend and
  infrastructure in a total ownership model - squads build and
  run it. The work is usually more back-end leaning involving
  event driven services, APIs and bespoke security checks, but
  front-end work is also a critical part of the overall
  service.

  Our core tech-stack includes Typescript, Node.JS,
  PostgresSQL, WebAssembly, Terraform (IaC), running in Azure
  / Kubernetes.

  If you are passionate about your work, develop consistently
  high-quality code, and are adept at identifying, preventing,
  and troubleshooting problems we would love to hear from you.

  This role will be fully hybrid with the expectation we get
  together in our Holborn, London office at least once per
  month.

  Requirements

  We welcome applications from all who may not feel they match
  the full criteria, so if you have most of the below, we'd
  like to hear from you: 

  Technical Skills

  - Experience of building cloud-hosted applications, using
    Typescript and Node.JS in a start-up, public service, or
    charitable setting
  - Experience with GraphQL, React, WebAssembly and Python would
    be a nice to have
  - Prior experience with Azure (ideally), AWS or GCP
  - Comfortable working with Infrastructure as Code, ideally
    Terraform
  - Knowledge of good data modelling and design patterns; in-
    depth knowledge of relational databases (e.g. PostgreSQL)
    and familiarity other types of data stores
  - Good experience in using modern, agile development practices
    like code review, TDD, CI/CD and pairing using tools like
    Git and GitHub
  - Experience of operationally managing software components
    once live, including; observability, logging, metrics,
    error reporting, debugging and live incident management
  - Experience of working with sensitive personal data

  Competencies

  - Experience working in/with cross-functional teams consisting
    of e.g. engineers, product, security and non-technical
    stakeholders
  - Ability to communicate with stakeholders and audiences
    outside your own team
  - Experience working in small, growing organisations with a
    high degree of ambiguity, where flexibility is valued
  - Strong understanding of software quality principles and
    practices
  - Comfortable in mentoring and coaching less experienced
    engineers
  - Comfortable in taking part in and sometimes facilitating
    technical discussions

  Hiring Process

  We feel hiring should be transparent and give you a real
  sense for what Our Future Health is like. Here's what you
  can expect:

  - Initial chat with our Talent team (30 min) to get to know
    each other, discuss the role, and answer any questions you
    have.
  - 1st interview with our Head of Engineering (30 min) - this
    is an opportunity to meet your potential line manager and
    for you both to align on role expectations.
  - Technical interview with 2-3 members from our engineering
    team (90 min). This will include a short task you’ll need
    to prepare in advance of the interview and is designed to
    get a sense for how you'd approach the real-world
    responsibilities of this role.
  - Final stage competency interview (60 min) with a small
    cross-functional panel of your potential new colleagues.
    This will focus on how you collaborate, work with
    stakeholders, and navigate ambiguity and challenges in
    real-world projects.

  Benefits

  - Competitive base salary from £88,000
  - Generous Pension Scheme – We invest in your future with
    employer contributions of up to 12%
  - 30 Days Holiday pro rata + Bank Holidays – Enjoy a generous
    holiday allowance with the flexibility to take bank
    holidays when it suits you
  - Enhanced Parental Leave – Supporting you during life’s
    biggest moments
  - Cycle to Work Scheme – Save 25-39% on a new bike and
    accessories through salary sacrifice
  - Home & Tech Savings – Get up to 8% off on IKEA and Currys
    products, spreading the cost over 12 months through salary
    sacrifice
  - EV Scheme – Save up to 40% on a brand new electric vehicle
    all-inclusive package through salary sacrifice
  - £1,000 Employee Referral Bonus – Know someone amazing? Get
    rewarded for bringing them on board!
  - Wellbeing Support – Access to Mental Health First Aiders,
    plus 24/7 online GP services and an Employee Assistance
    Programme for you and your family
  - A Great Place to Work – We have a lovely Central London
    office in Holborn, and offer flexible and remote working
    arrangements

  Join us - let’s prevent disease together.

  We recommend you apply as soon as possible as occasionally
  due to high volumes of applications, we need to close our
  postings early.

  At Our Future Health, we recognise the importance of having
  a diverse workforce and ensuring that all candidates,
  regardless of their background, have equitable access to our
  application process. We proactively encourage applicants who
  identify as having a disability, neurodiversity, or long-
  term health conditions to let us know if they require any
  reasonable adjustments as part of their application process.

  If you do require any reasonable adjustments, please email
  us at talent@ourfuturehealth.org.uk
