  of employment without regard to race, ethnicity, color,
  religion, sex, sexual orientation, gender identity, gender
  expression, familial status, age, disability and/or any
  other legally protected classification protected by federal,
  state, or local law.



  Ro is committed to providing reasonable accommodations for
  qualified individuals with disabilities in our application
  and interview process. If you require a reasonable
  accommodation in the application or interview process,
  please contact us at talent@ro.co.



