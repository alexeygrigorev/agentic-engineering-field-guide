description: |
  If you are an experienced engineer who enjoys building,
  solving difficult problems and helping others deliver better
  software, we have an opportunity for you.

  As a Senior Lead Software Engineer at JPMorganChase within
  Asset & Wealth Management’s International Private Bank
  Technology organisation, based in London, you will design,
  build and improve scalable client-facing capabilities for
  J.P. Morgan Online International. You will bring advanced
  technical expertise, own complex engineering solutions and
  make implementation decisions within the agreed technical
  direction.

  This is a hands-on technical leadership role. You will
  contribute directly to production code, solve difficult
  design and operational problems, and guide other engineers
  through substantive technical feedback. Working with
  engineering leadership, business and Product partners, you
  will translate client and financial workflows into reliable
  software, use enterprise-authorised coding agents
  effectively and demonstrate curiosity beyond routine
  delivery. You will lead through technical contribution and
  mentoring, rather than departmental resource or people-
  management ownership.

  Job responsibilities

  - Designs and develops secure, high-quality production code
    for scalable client-facing applications, APIs and
    services; reviews, debugs and improves code written by
    others.
  - Drives design and implementation decisions for assigned
    capabilities, balancing data integrity, performance,
    security, reliability, maintainability and operating cost
    within the agreed technical direction.
  - Provides technical guidance to engineering and business
    partners, acting as a subject matter expert in relevant
    application, service or integration domains.
  - Leads the technical delivery of complex changes through
    implementation, testing, integration, controlled
    migration, release readiness and operational support.
  - Applies enterprise-authorised coding agents and automation
    across design, implementation, testing, review and
    troubleshooting, creating reusable context, tools and
    workflows.
  - Drives effective team adoption of approved AI-assisted
    engineering practices, validating generated changes
    through peer review and independent tests for correctness,
    performance and security, and coaching others on safe use.
  - Works closely with business, Product, Design, web and mobile
    partners to clarify client needs, interpret financial
    workflows and translate agreed requirements into practical
    technical solutions.
  - Improves engineering standards, automation, observability
    and resilience for owned services, escalating material
    risks and cross-domain decisions to the appropriate
    engineering or control owner.
  - Mentors engineers through code and design reviews, shares
    reusable patterns and knowledge, and contributes to a
    culture of curiosity, technical excellence and continuous
    improvement.

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and advanced Java applied experience.
  - Advanced hands-on practical experience delivering system
    design, application development, testing and operational
    stability for scalable client-facing applications.
  - Strong Java/JVM, API, distributed-systems and data-modelling
    skills, with practical experience of reliable service
    integration and robust failure handling.
  - Ability to solve complex design and functionality problems
    independently with limited oversight, explain technical
    trade-offs and recognise when wider decisions require
    alignment or escalation.
  - Practical cloud native experience on AWS or a comparable
    platform, including automated delivery, testing,
    observability and production support.
  - Demonstrated effective use of enterprise-authorised coding
    agents beyond basic code completion, with concrete
    examples of implementation, review, test acceleration or
    troubleshooting and how outputs were verified.
  - Strong understanding of responsible AI use in engineering,
    including sensitive-data handling, secure development,
    resiliency, human review and independent validation;
    ability to guide peers on compliant practices.
  - Expertise in Computer Science, Computer Engineering,
    Mathematics, or a related technical field.
  - Public GitHub repositories or substantive open-source
    contributions demonstrating your own hands-on engineering
    work, with the ability to explain relevant code, design
    decisions, testing and outcomes.
  - Evidence of curiosity and self-directed learning beyond
    routine delivery, demonstrated through prototypes, open-
    source work, technical experiments or reusable engineering
    tools.
  - Effective technical leadership, mentoring and business
    communication, with the ability to understand client and
    financial workflows and work constructively across teams
    and locations.

  Preferred qualifications, capabilities, and skills

  - CFA charterholder status, progress through the CFA Program,
    or equivalent professional experience demonstrating strong
    knowledge of financial markets, investment products,
    portfolio management or private banking.
  - Experience in International Private Banking, wealth or asset
    management, digital banking, trading or other transaction-
    sensitive client platforms.
  - Native iOS and/or Android application development
    experience, with the ability to partner effectively with
    specialist mobile teams on end-to-end client journeys.
  - Experience creating reusable coding-agent workflows,
    engineering skills, context libraries, test harnesses or
    evaluation tools that improve team delivery and quality.
  - Full-stack web or cloud-native modernisation experience that
    complements strong back-end engineering and reduces
    integration complexity and operational cost.

