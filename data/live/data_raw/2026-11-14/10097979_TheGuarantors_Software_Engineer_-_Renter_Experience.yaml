description: |
  TheGuarantors is a fintech company helping multifamily
  owners and operators mitigate leasing risk while expanding
  access for renters. With a deep understanding of owner,
  operator, and renter needs, we believe renters deserve
  better access to the home of their choice and operators
  deserve greater protection and growth opportunities. That’s
  why we’re leveraging our real estate expertise and using AI-
  driven renter underwriting to help operators qualify renters
  faster while mitigating the financial risk of renter
  default. With $7B+ in lease value protected, we work with 9
  of the country’s top 10 operators, are the #1 lease
  guarantee provider nationwide, and have consistently been
  named one of Inc. 5000’s fastest-growing companies, one of
  Forbes’ Best Startup Employers, and one of Deloitte’s
  Technology Fast 500

  The Role

  The Software Engineer is responsible for owning a slice of
  the renter acquisition channel application and services,
  where most of our renter customers are onboarded. This role
  supports nearly every other technology team, as well as our
  operations and analytics teams by onboarding renters as
  smoothly as possible, while also maintaining data and
  process integrity for downstream teams.

  The ideal candidate will bring a high degree of ownership, a
  keen sense for user experience, and persistent quality
  technical output. This candidate will be expected to
  translate abstract business requirements from multiple
  parties, operate within a thorough ownership environment,
  and strive to create the best possible outcome for all
  stakeholders.

  Location This is a hybrid role based in NYC

  What You’ll Do

  - Own a slice of the renter onboarding and overall experience,
    from requirements, to development, through QA, deployment
    to production, and maintenance.
  - Execute day-to-day responsibilities related to developing
    new app/service features with accuracy, timeliness, and
    consistency.
  - Analyze, review, or maintain codebases, data models, and
    technical documentation to support business needs.
  - Partner with product, design, operations, analysts, and
    fellow engineers to support development priorities and
    ensure alignment.
  - Communicate updates, risks, blockers, and recommendations
    clearly and proactively.
  - Identify opportunities to improve team process and output,
    as well as stakeholder and user experience.
  - Use data, judgment, and business context to inform decisions
    and recommendations.
  - Manage assigned work independently and follow through on
    commitments, deadlines, and deliverables.
  - Ensure work is completed in accordance with applicable
    policies, procedures, standards, and regulatory
    requirements.
  - Perform other role-related responsibilities as assigned and
    aligned with business needs.

  Requirements

  - 5+ years of relevant production work experience in back-end
    web development, preferably using Go and/or Typescript
  - 5+ years of relevant production work experience in front-end
    web development, preferably using React
  - Experience with large, interdependent codebases while
    maintaining business continuity.
  - Strong understanding of REST API concepts and designs.
  - Understanding of system design, data structures, and
    algorithms, and experience creating and evaluating
    technical design documents
  - Demonstrated ability to manage engineering tasks, partner
    with product and design, and deliver high-quality work in
    a dynamic business environment.
  - Bachelor’s degree / Master’s degree in Computer
    Science/Engineering, or equivalent practical experience.

  Nice to Have

  - Experience working in a fast-paced and cross functional
    environment.
  - Experience using Material UI’s component library.
  - Experience using GraphQL
  - Familiarity with modern web infrastructure components (e.g.
    caching, serverless, API gateways, etc) and how to manage
    them.

  Benefits

  - Opportunities to make an impact within a fast growing
    company
  - Medical, dental, & vision insurance, beginning day one
  - Health savings account with employer contribution
  - Generous PTO and paid holidays
  - Flexible working hours
  - 401(k)
  - Paid parental leave
  - Company sponsored short and long term disability
  - Flexible spending accounts (healthcare, dependent care,
    commuter)
  - Competitive salary

  Base Salary

  This is an individual contributor role, internally leveled
  as IC4 or IC5.

  The annual U.S. base salary range is $170,000–$220,000. Base
  salary does not include other forms of compensation or
  benefits. Individual pay is determined by work location,
  skills, experience, and other job-related factors, which
  will be discussed during the hiring process.

  Stay in Touch

  Does this role not quite match your skills, but you’re still
  interested in what we're doing? Stay In Touch and apply to
  our Dream Job to be one of the first to hear about future
  opportunities!

  TheGuarantors is an Equal Opportunity Employer. We celebrate
  diversity and are committed to an inclusive environment for
  all.
