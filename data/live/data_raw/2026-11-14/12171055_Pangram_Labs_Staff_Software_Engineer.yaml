description: |
  A Note on applying to Pangram:

  At Pangram, we firmly believe that genuine human expression,
  and our ability to communicate with each other online and
  through the written word, is a fundamental right- and a
  value worth preserving. Please don't use AI to answer any of
  the questions as part of your application - we want to hear
  from you!


  About Pangram Labs

  Pangram Labs’ mission is to protect authenticity and
  preserve human connection in the context of the generative
  AI era. We build the world’s best AI detection systems. We
  publish research on state-of-the-art AI detection techniques
  and algorithms and build products to bring our technology
  into people's daily lives. We provide tools for individuals,
  institutions and companies to detect the use of AI in
  written content.

  Pangram is a recognized thought leader in the space of AI
  detection. Our CEO & Co-founder Max Spero has been named as
  one of Time Magazine’s 100 Most Influential People in AI and
  Pangram has been named one of Time’s Best Inventions of
  2026.

  We are looking for high agency, mission-driven, and
  passionate builders to join our team!

  About the Role

  As a Staff Software Engineer at Pangram, you will build
  great product experiences for our users - both individuals
  and large organizations. You’ll work on a variety of
  different projects, from owning the product lifecycle from
  end-to-end to launching new features to designing, building,
  and scaling the production systems that serve our core
  technology to a rapidly growing user base. At Pangram, staff
  engineers are highly autonomous and are expected to take on
  ambitious levels of scope and ownership. Staff engineers at
  Pangram own major technical decisions, tackle our hardest
  scaling problems, and help shape the vision of our product
  and our infrastructure. This is also a hands-on, IC role,
  getting your hands dirty building software from end-to-end.

  This is a full-time role, office-based in our Brooklyn
  office (5 days per week), reporting to our CTO.

  What You'll Do

  - Own and ship product features end-to-end in both consumer
    and B2B verticals.
  - Work closely with GTM, Product, and Research functions to
    bring Pangram’s machine learning technology to polished
    user experiences
  - Own the reliability, performance, and observability of
    production systems
  - Turn design specs and prototypes into shippable, working
    products
  - Review code and raise the quality bar for code across the
    company
  - Establish and improve engineering best practices across the
    stack

  Qualifications:

  You are a strong fit for this role if you have:

  - 8+ years of professional software engineering experience
    delivering exceptional impact as an IC engineer across a
    wide range of product and engineering needs
  - Strong Engineering experience in our technology stack:
    - Python
    - Front-End: Modern front-end frameworks (e.g. React, Next.js,
      Typescript)
    - Back-End: Proficiency in Python and Django (or comparable
      Python web frameworks); RESTful API design, relational
      databases, message queues, caching strategies, and
      asynchronous task processing
    - Hands-on experience with AWS services (e.g., EC2, ECS/EKS,
      RDS, S3, SQS, CloudFront, Lambda)
  - Comfort across the stack: front-end and back-end, with
    strength in either and at minimum comfort in the other.
  - Fluency and comfort with AI coding tools and thoughtfulness
    around their use
  - A strong sense of taste and craftsmanship, bias towards
    action, and clear communication skills
  - Interest in AI, machine learning, and LLMs; including AI
    safety and responsible AI

  Nice to Have

  - Experience working at an early stage startup
  - Experience with browser extensions
  - Experience with mobile apps
