description: |
  We’re a fast-growing tech scale-up with $36M in funding,
  revolutionizing the modern internet with cutting-edge
  solutions that drive mass-adoption. We already work with
  major brands such as Uber, Amazon, North Face, Temu, Lego,
  BMW, North Face and 100’s more. Our secret? Removing all
  blockchain and crypto complexities that are barriers to
  creating user-friendly applications solving real-world use-
  cases. Our investors include Multicoin, Circle Ventures,
  Animoca, Valor, Alliance DAO, and more. With a community of
  over 1M followers across all socials and a CEO who has been
  featured on the NYSE and NASDAQ, we believe we are only at
  the beginning of making XION a global brand.

  -- -- -- -- -- -- -- --

  We are looking for a high-functioning psychopath to help
  bring the next wave of hybrid web2/3 applications.

  You will be joining a team of top-tier self-selected sado-
  masochists, who work here because they can’t really work
  anywhere else. We value rapid communication and direct
  feedback, both internal and external. Breakneck pace
  shipping, autonomy and ownership, and constant
  experimentation are table stakes. Apologies in advance.

  What Sparks Your Enthusiasm

  - Shipping nonsense to billions of users
  - That point of a futile debugging session where you start to
    question your sanity and everything becomes hilarious
  - Finding interesting/troubling ways to solve engineering
    problems
  - “Huh, that’s weird”, gives you a sense of giddy panic
  - A constant feeling like your spinal column has been struck
    by lightning

  What Turns You Away

  - “It works on my machine”
  - “The user should be able to figure it out”
  - “That isn’t my problem”
  - Feeling generally calm and in control of the situation

  Requirements:

  - Typescript
  - React
  - Self-destructive tendencies
  - CSS Frameworks (Tailwind, MUI, etc.)
  - Medically significant but non-terminal caffeine addiction
  - Experience with Git/Github in a distributed team
  - Experience integrating with REST/GraphQL/GRPC APIs
  - Security Minded
  - Comfort in a young, chaotic, rapidly evolving small team
    startup environment
  - Ability to pick up and learn new stacks and tools on zero
    notice

  Nice to haves:

  - Cosm.js or Web3.js experience, general experience developing
    with crypto focused javascript libraries.
  - Experience with NPM release best practices
  - Experience working with and configuring bundlers (Webpack,
    Vite, etc.)
  - Experience with browser and mobile data storage, ie
    LocalStorage, SQLite
  - Performance conscious development, as the majority of the
    global user base is on mobile phones
  - Integration and unit testing experience

  Day-to-Day Responsibilities:

  Actual:

  - Desperate banging on keyboard
  - Ripping hair out over encoding errors
  - Not learning from previous mistakes about encoding errors
  - Ripping hair out over encoding errors

  Formal:

  - Design Implementation: Work closely with the design team to
    bring concepts to life, using provided designs as a
    foundation while exercising autonomy in execution.
  - Feature Development: Take ownership of features from
    planning to release, including scoping, task management,
    and prioritization.
  - Documentation Analysis: Research and review available
    documentation to guide development, navigating and
    interpreting scarce or ambiguous resources.
  - Testing and Debugging: Conduct thorough testing and
    extensive debugging to ensure high-quality deliverables,
    iterating through multiple cycles as needed.
  - Collaboration: Engage with the protocol team to facilitate
    smooth integration of features, providing technical
    guidance and feedback.
  - Continuous Improvement: Participate in the release process,
    ensuring stability and performance, and contribute to
    ongoing improvements and refinements.

  Cultural:

  - Take on new features or bug fixes, with full ownership
  - Scoff at the lack of documentation in our field
  - “Reverse engineer” protocol level … stuff… to integrate into
    client
  - Debug, debug, debug
  - Release and iterate
