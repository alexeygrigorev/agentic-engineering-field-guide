description: |
  GiveCampus is the world's leading fundraising platform for
  non-profit educational institutions. Trusted by millions of
  donors and 1,300+ colleges, universities, and K-12 schools,
  our mission is to help advance the quality, the
  affordability, and the accessibility of education. At our
  current pace, we will facilitate $100 billion in charitable
  giving over the next decade–enough money to send more than 1
  million students to college, tuition-free.

  GiveCampus is backed by leading investors including Y
  Combinator, but we’re also practitioners of Sustainable
  Growth: we’ve made the Inc. 5000 list of America's fastest-
  growing private companies each of the last five years and
  we’ve been profitable nine of the last 10. In 2025, we
  celebrated a $140 million growth investment that included a
  major liquidity event for GiveCampus employees–the second in
  less than three years.

  Our purpose-driven team of 130+ is located in 30+ states
  across the US: team members work from anywhere they choose.
  We have a beautiful 12,000sf office in Washington, DC that
  is available for people to use whenever they want, and we
  regularly organize team meet-ups, visit partner
  institutions, and host retreats in various locations.

  While we operate at meaningful scale, we’re still small
  relative to the commercial and social good opportunities in
  front of us. Every GiveCampus employee plays a meaningful
  role in shaping what comes next, and we're growing the team
  in support of our ambitious plans–including a $100 million
  investment in AI product development. If you believe in the
  transformative power of education and want to join a fast-
  growing, mission-driven company, you’ll fit right in.

  Location: This is a remote-first role based in the U.S.
  While we embrace flexible, distributed work, we also value
  in-person connection. Team members are expected to attend
  multiple company-wide and team-specific onsites throughout
  the year.

  About the role

  We're looking for brilliant, energetic software engineers to
  help us take the GiveCampus platform to the next level.
  You'll make technical decisions that shape what we build,
  ship features that fundraisers use every day, and see the
  impact of your work in the money schools raise.

  We hire engineers at a range of levels, from mid-level
  through senior, and we'll work with you to find the pod
  where your strengths and interests land. Whatever the level,
  the expectation is the same: you love to brainstorm, write
  code, create new features, and own what you ship.

  We're a fully remote workforce, so this role is open
  anywhere in the United States.

  What you'll do

  - Work across the full stack, from UI elements to backend
    services—including database tuning and performance.
  - Build features from start to finish and back end to front
    end, covering architecture design, coding, automated
    testing, and supporting each implementation in production.
  - Iterate quickly and adapt, working closely with your
    teammates in a fast-paced, agile environment—both within
    your pod and across Engineering as a whole.
  - Tackle a wide variety of technical issues throughout our
    stack and contribute to every part of the code base and
    our shared documentation.
  - Contribute to team-wide initiatives including coding
    standards, technical debt refinement, and system security
    monitoring.
  - Share what you know—through code review, pairing, and
    mentoring engineers earlier in their careers.
  - Participate in interviewing and onboarding new teammates,
    and help us refine how we interview.
  - Support the platform on a rotational basis (team-based
    support and a paired 24/7 on-call rotation).

  Where this role can grow

  As you build depth in our stack, there's an opportunity to
  take on a Tech Lead role, which includes:

  - Working closely with the PM on implementation tradeoffs and
    work breakdown for new projects.
  - Proposing, refining, and validating the technical
    implementation for a pod's roadmap work.
  - Assisting the PM with schedules and milestones, and holding
    accountability for the pod shipping.
  - Helping other engineers on the team grow in their craft.

  What we're looking for

  - Three or more years of hands-on, professional development
    experience. More senior candidates will bring
    correspondingly more scope and ownership.
  - Functional, real-world programming experience (vs.
    theoretical) in one of the following: Ruby, Python, or
    JavaScript/Node.js.
  - Experience with MVC frameworks such as Rails, Django, or
    Pyramid.
  - The ability to hold your own on the front end and the back
    end.
  - Experience with modern front-end frameworks like React and
    Vue.js.
  - SQL database experience (PostgreSQL, MySQL, SQLite).
  - Experience with deployments to Heroku, AWS, or similar.
  - Good judgment about balancing swift delivery against long-
    term code maintainability.
  - Clear, proactive communication—you ask questions early and
    share progress often.

  Nice to have

  - System design experience, with a focus on architecting
    solutions that can be implemented incrementally while
    keeping an eye toward scale and resilience.
  - Deep expertise with Ruby/Ruby on Rails and RSpec.
  - Experience with Postgres database administration.
  - Shipped code that has supported tens of thousands of users,
    including enterprise and business customers.
  - Operations experience and how it pertains to site
    reliability and speed.
  - Familiarity with networking, caching, and databases, and how
    to triage performance and stability issues.
  - Experience working on a fundraising or crowdfunding
    platform.
  - Experience working on a fintech or payments technology
    product.
  - A good eye for intuitive, user-friendly front-end design.

  What you'll get

  - Real ownership of production work, with the support and code
    review to back it up.
  - A say in the technical decisions that shape the platform,
    not just the tickets that come out of them.
  - A fully remote team that's built for remote work, not
    retrofitted for it.
  - The chance to help schools raise money that changes
    students' lives.

  Ready to apply?

  Be sure to keep an eye on your spam and promotions boxes in
  case our emails end up there!

  At GiveCampus, we value diversity and we pledge to foster an
  environment of support, inclusivity, and learning, both on
  the job and throughout the application process. In this
  spirit, we encourage candidates of all backgrounds to apply.

  GiveCampus is an Equal Opportunity Employer. Applicants and
  employees are not discriminated against because of race,
  color, creed, sex, sexual orientation, gender identity or
  expression, age, religion, national origin, citizenship
  status, disability, ancestry, marital status, veteran
  status, medical condition or any protected category
  prohibited by local, state or federal laws.

  If you feel like you don't meet all of the requirements for
  this role, please apply anyways. We know confidence gaps and
  imposter syndrome often get in the way of connecting with
  incredible people, and we don't want them to prevent us from
  meeting you.
