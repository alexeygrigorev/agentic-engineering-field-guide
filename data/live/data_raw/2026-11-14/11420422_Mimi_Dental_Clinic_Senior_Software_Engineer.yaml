description: |
  About the Job

  The Opportunity

  As a Senior Software Engineer at Mimi Dental Clinic, you
  will design and build the digital systems that power
  Ibadan's premier dental practice, serving over 15,000
  patients with world-class care across more than two decades
  of continuous operation. Mimi Dental Clinic is a leading
  dental healthcare provider delivering exceptional, patient-
  centred care with warmth, precision, and integrity, backed
  by nearly 2,000 Google reviews and a 4.9-star rating.

  In this role, you will take ownership of critical technology
  systems, from our patient-facing mobile application and
  online booking platform to electronic health records, clinic
  operations infrastructure, and data-driven patient
  engagement tools. You will lead technical initiatives, make
  architectural decisions that directly improve patient
  outcomes and operational efficiency, and ensure that our
  digital experience reflects the same standard of excellence
  our patients have trusted for over 20 years.

  This is an opportunity to do meaningful engineering work at
  the intersection of healthcare and technology, where the
  systems you build will shape how thousands of patients
  access, experience, and benefit from premium dental care.

  What You'll Do

  Design, build, and maintain scalable applications, APIs, and
  services that power Mimi Dental Clinic's patient-facing
  platforms and internal clinical operations. Develop and
  optimise our mobile application and web-based booking
  systems to deliver a seamless, refined patient experience
  from appointment scheduling through post-treatment follow-
  up. Own features and systems end-to-end, from technical
  design and implementation through to testing, deployment,
  and monitoring. Lead architectural decisions that ensure
  platform reliability, security, and compliance with
  healthcare data protection standards as our patient base and
  service offerings grow. Architect and maintain integrations
  between clinical systems, patient management tools, and
  third-party healthcare platforms. Implement robust data
  security practices that protect sensitive patient health
  information and maintain the trust our community has placed
  in us. Collaborate cross-functionally with clinical,
  operations, and patient experience teams to deliver
  technology that enhances the quality and accessibility of
  our care. Contribute to infrastructure and DevOps practices
  including CI/CD pipelines, cloud deployment, and system
  monitoring to ensure continuous uptime and performance.

  What You'll Need to Succeed

  4+ years of professional software engineering experience,
  with strong proficiency in one or more languages such as
  Python, C#, Java, TypeScript, or Go. Proven experience
  designing and building production-grade APIs, mobile
  applications, and services that operate reliably at scale.
  Familiarity with cloud platforms (AWS, GCP, or Azure),
  containerisation (Docker, Kubernetes), and modern deployment
  practices. Experience working with databases (relational
  and/or NoSQL), caching layers, and data management systems,
  with particular attention to data integrity and security. A
  strong engineering mindset, comfortable navigating
  ambiguity, making pragmatic trade-offs, and delivering with
  quality under pace. Understanding of healthcare data privacy
  principles and secure software development practices is
  highly valued. A collaborative disposition, comfortable
  working cross-functionally with clinical staff, operations,
  and product teams in an environment where technology serves
  patient care. Genuine interest in healthcare technology,
  patient experience systems, or digital health innovation is
  highly valued.

  Role Details

  Employment Type: Full-Time and Part-Time positions available
  Location: Fully Remote Stage: Established, 20+ years
  operational

  About Mimi Dental Clinic

  Mimi Dental Clinic is Ibadan's premier dental practice,
  founded in 2004 with a singular vision: to deliver world-
  class dental care with warmth, precision, and integrity. For
  over two decades, we have been the trusted choice for
  individuals and families seeking exceptional oral healthcare
  in a refined, comfortable setting. We provide a
  comprehensive suite of dental services including general
  dentistry, cosmetic dentistry, orthodontics, dental
  implants, oral surgery, paediatric dentistry, and emergency
  care.

  We are not simply a dental clinic. We are the standard that
  others aspire to, serving over 15,000 satisfied patients
  with a 99% satisfaction rate, investing continuously in
  advanced technology, and building digital experiences that
  reflect the same commitment to excellence that defines every
  aspect of our care.

  Equal Opportunity

  Mimi Dental Clinic is an equal opportunity employer. We
  welcome dedicated individuals regardless of gender, race,
  ethnicity, national origin, age, disability, religion,
  sexual orientation, gender identity or expression, or
  veteran status. We believe that exceptional care is
  delivered by exceptional teams, and exceptional teams are
  built on inclusion, respect, and the understanding that
  brilliance has no single origin.

  If you require accommodation during the application or
  interview process, please reach out to our team and we will
  ensure your needs are met with care.

  Let's build the future of dental healthcare, together.
