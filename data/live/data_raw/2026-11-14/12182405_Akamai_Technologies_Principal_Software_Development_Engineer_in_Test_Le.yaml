description: |
  Does building and validating a large-scale, high-performance
  compute storage platform excite you?

  Do you love leading and motivating successful teams?

  Join our Storage Team!

  The Object Storage team in Cloud Technology Group
  prioritizes performance, scalability, and usability across a
  globally distributed platform. The infrastructure supports
  demanding workloads, including media delivery, data
  processing, AI training, and inferencing. Collaboration,
  inclusivity, and creativity drive continuous improvement.
  The mission is to provide a reliable storage platform that
  customers trust and consistently choose for their needs.

  Shape the future of our Object Storage Platform

  Apply large-scale testing expertise to uphold platform
  quality and reliability across functional and non-functional
  areas. Collaborate with teams to enhance automation,
  streamline test suite repeatability, and implement
  innovative validation methods for efficient and secure
  progress.

  As a Principal Software Development Engineer in Test, you
  will be responsible for:

  - Driving the testing strategy for Object Storage, ensuring
    test suites address customer usage and global operational
    management comprehensively.
  - Establishing an efficient mechanism for detecting and
    remediating test flakes, such that we ensure our coverage
    at all times
  - Ensuring the platform's non-functional areas meet capacity,
    performance, and resiliency requirements while enabling
    clear communication about these commitments.
  - Tracking test planning for new features and additions to the
    system and ensuring quality of new tests
  - Overseeing a small team of experienced engineers, guiding
    them as necessary to ensure excellent execution of all
    related tasks.

  Do what you love

  To be successful in this role you will:

  - Have relevant experience and an education in a Computer
    Science or related field.
  - Possess extensive expertise as an SDET, testing software
    within distributed microservices environments, utilizing
    Python and Golang effectively for development.
  - Have fluency in Python and Golang, with C++.
  - Have prior experience of working in a Kubernetes environment
  - Have prior experience in building and maintaining fully
    automated testing frameworks, which would include
    observability and reporting on execution of these

