job_id: 11965321
title: Engineering Manager, Developer Environments
company: Lyft
location: New York, USA
work_type: FULL_TIME
company_size: 22,282 Employees
description: |
  At Lyft, our purpose is to serve and connect. We aim to
  achieve this by cultivating a work environment where all
  team members belong and have the opportunity to thrive.

  Lyft’s engineering team is growing rapidly, and we are
  looking for engineering managers to help us scale. Our
  engineers are smart, flexible, and love solving difficult
  challenges.  Our engineers are smart, flexible, and love
  solving difficult challenges. They look to their managers
  for organizational transparency, career development,
  mentorship, and honest feedback. They move fast and ship
  code to production continuously, relying on their leadership
  to increase productivity by removing obstacles and keeping
  processes lean. Our engineering managers are people with
  diverse technical backgrounds and interests. As managers it
  is our job to remain curious and continuously deliver impact
  by driving our team’s technical direction and vision. We
  build teams that are inclusive, helpful, and have a strong
  sense of ownership for the things they build.

  Lyft’s Infrastructure teams are responsible for building the
  foundational systems that engineers rely on in order to
  build stable, scalable, and efficient services. We build
  scalable infrastructure that helps software developers move
  fast, while still providing them with the flexibility they
  need to innovate within their teams. We are looking for
  experienced leaders to guide these teams as they create an
  exceptional development experience for all of Lyft. These
  are high leverage roles, as your work will have a
  multiplicative effect across Engineering, and contribute
  directly to Lyft’s overall stability.

  As the Engineering Manager for the Developer Environments
  team, you will lead a talented group of engineers
  responsible for building and maintaining critical
  infrastructure that enhances developer productivity and
  system reliability. The team builds and supports the
  environments where developers work and test as well as
  simulation systems and tools. Some of these systems are
  critical to the SDLC of engineers at Lyft, others ensure
  Lyft’s production services can handle the load of customer
  demand during peak events like New Years Eve, while
  optimizing for efficiency throughout the remainder of the
  year. You will play a key role in shaping the team’s vision,
  supporting their growth, and delivering impactful solutions
  for engineers throughout the organization.

  Read more about some of the projects this team has worked
  on:

  - Extending our Envoy mesh with staging overrides
  - Gating Deploys with Automated Acceptance Tests
  - How Lyft uses load testing to ensure reliable service during
    peak events

  Responsibilities:

  - Lead Infrastructure Engineering teams responsible for
    maintaining and improving our infrastructure
  - Balance feature development speed and reliability with
    service-level objectives
  - Mentor and guide the professional and technical development
    of your team members. Help develop their careers, and
    assign them to projects tailored to their skill levels,
    personalities, work styles, and professional goals
  - Build teams that are collaborative, inclusive, and
    respectful of each other
  - Provide continuous feedback, support individuals on
    improving or optimizing their performance, and recognize
    the strengths and contributions of your team members
  - Create plans for prioritizing technical and resourcing
    challenges in your organization
  - Maintain a balance between building sustainable, high-impact
    projects and shipping things quickly
  - Instill a spirit of continuous improvement in the team’s
    code, architecture, and processes
  - Work closely with the Lyft recruiting team to hire high
    potential candidates from diverse backgrounds
  - Work with your engineers and stakeholders to maintain a
    prioritized backlog and create short term and long term
    goals
  - Own your team’s deliverables and ensure we continue to ship
    scalable, highly-available products that delight our
    passengers and drivers

  Experience:

  - 2+ years of experience as an Engineering Manager. Previous
    experience managing Infrastructure teams a bonus
  - You have a technical background and are able to contribute
    to planning and design discussions
  - You are proficient in one or more high-level programming
    language, such as Python, Go, Rust, or Javascript
  - Experience working on teams responsible for maintaining and
    operating production software and infrastructure at a
    large-scale
  - You are steadfastly focused on your customers, whether they
    are drivers, passengers, or other Lyft employees
  - Experience leading a team of engineers and supporting them
    through career development
  - You have built teams and products that scale with a
    company’s evolving needs
  - You enjoy working in a collaborative environment, and you’re
    committed to driving projects to completion
  - You have built teams that are motivated and value a strong
    sense of ownership
  - Experience supporting teams through planning,
    prioritization, and execution of work

  Benefits:

  - Great medical, dental, and vision insurance options with
    additional programs available when enrolled
  - Mental health benefits
  - Family building benefits
  - Child care and pet benefits
  - 401(k) plan with company match to help save for your future
  - In addition to 12 observed holidays, salaried team members
    have discretionary paid time off, hourly team members have
    15 days paid time off
  - 18 weeks of paid parental leave. Biological, adoptive, and
    foster parents are all eligible
  - Subsidized commuter benefits
  - Monthly Lyft credits and complimentary Lyft Pink membership

  Lyft is an equal opportunity employer committed to an
  inclusive workplace that fosters belonging. All qualified
  applicants will receive consideration for employment without
  regards to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability status,
  protected veteran status, age, genetic information, or any
  other basis prohibited by law. We also consider qualified
  applicants with criminal histories consistent with
  applicable federal, state and local law.

  Lyft highly values having employees working in-office to
  foster a collaborative work environment and company culture.
  This role will be in-office on a hybrid schedule — Team
  Members will be expected to work in the office 3 days per
  week on Mondays, Wednesdays, and Thursdays. Lyft considers
  working in the office at least 3 days per week to be an
  essential function of this hybrid role. Your recruiter can
  share more information about the various in-office perks
  Lyft offers. Additionally, hybrid roles have the flexibility
  to work from anywhere for up to 4 weeks per year. #Hybrid

  The expected base pay range for this position in the New
  York City area is $176,000 - $220,000, not inclusive of
  potential equity offering, bonus or benefits. Salary ranges
  are dependent on a variety of factors, including
  qualifications, experience and geographic location. Your
  recruiter can share more information about the salary range
  specific to your working location and other factors during
  the hiring process.
