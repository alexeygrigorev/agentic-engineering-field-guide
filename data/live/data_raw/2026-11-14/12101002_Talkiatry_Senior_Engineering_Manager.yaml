description: |
  We're seeking an experienced Engineering Manager to lead our
  Data Engineering team. The team is responsible for the
  entire data platform: ingestion from our EHR and partner
  feeds, the Snowflake environment itself, orchestration and
  CI/CD, and the outbound integrations that deliver data to
  our partner and vendor systems. Our analytics engineering
  team builds the reporting and analytics logic on top of it,
  and you'll work closely with them.

  The team's output reaches almost every part of the business,
  including billing, clinical operations, patient
  communications, marketing, and our partner integrations.
  You'll be accountable for its reliability. Our data product
  manager brings forward the problems our stakeholders need
  solved, and you'll partner with them to turn those into
  technical plans the team can execute.

  We are hiring this role in advance of scaling up the team to
  help the company expand into new lines of business next
  year.

  We pride ourselves on our strong management culture and
  talented engineering teams.

  About Talkiatry:

  Talkiatry is transforming mental health care by making high-
  quality psychiatry more accessible, human, and sustainable
  for both patients and clinicians. Co-founded by a patient
  and a triple-board-certified psychiatrist, we were built to
  solve one of healthcare’s most urgent challenges: millions
  of people struggle to access mental health care, while
  clinicians face growing administrative burden and burnout.
  Through our technology-powered, in-network platform, we’re
  changing that, creating a better experience for patients and
  empowering clinicians to focus on delivering exceptional
  care.

  Today, Talkiatry is the largest dedicated psychiatry
  practice in the U.S., with 750+ psychiatrists, 250+
  therapists, and more than two million patient visits
  delivered nationwide. At our scale, every innovation has
  real impact. Every workflow we improve, every technology
  solution we build, and every patient experience we redesign
  helps thousands of clinicians provide better care to
  hundreds of thousands of patients. We’re not just growing
  quickly — we’re redefining how behavioral healthcare is
  delivered in America.

  Joining Talkiatry means joining a mission-driven team that
  is solving complex problems at scale, driving meaningful
  change in healthcare, and building the future of mental
  health care with compassion, innovation, and purpose.



  You will:

  - Lead and develop a team of engineers working on our
    foundational data processing platform
  - Drive technical strategy and execution across our Snowflake
    platform, dbt project, our Python services on AWS (Lambda,
    ECS), and our Airflow orchestration layer
  - Own the Snowflake environment: access and permissions,
    warehouse configuration, and cost management
  - Own the reliability of these systems: on-call readiness,
    incident triage, and post-mortems, with escalation to
    engineering leadership
  - Collaborate with product, business, and other engineering
    teams to create high impact solutions. Work closely with
    analytics engineering on schema and platform changes, and
    with our DevOps team on the cloud infrastructure and
    deployment pipelines the platform depends on.
  - Establish robust engineering practices and technical
    standards across code review, testing, documentation, and
    CI/CD
  - Set clear goals, prioritize effectively, and ensure timely
    delivery of high-quality solutions
  - Mentor team members and foster their professional growth
  - Contribute to Talkiatry’s engineering and management culture



  You have:

  - 6+ years of data engineering experience
  - 2+ years of engineering management experience
  - Strong technical background with hands-on development
    experience with Snowflake, dbt, Python and SQL
  - Experience administering a cloud data warehouse, not only
    building in one: access control, cost management, and
    environment and release processes
  - Comfortable running production services in a cloud
    environment, ideally AWS: containerized workloads and
    serverless functions
  - Experience owning production data systems: orchestration
    tooling such as Airflow, monitoring and alerting, and
    incident response
  - Experience applying CI/CD and automated testing to data
    pipelines
  - Excellent communication skills with both technical and non-
    technical stakeholders
  - Track record of delivering complex software projects on time
  - Ability to balance business needs with technical excellence

  Nice to have:

  - Experience working with data in a HIPAA-compliant
    environment
  - Experience building and maintaining integrations with third-
    party systems and APIs
  - Working knowledge of dimensional modeling and warehouse
    design tradeoffs
  - Experience consolidating fragmented scheduling onto a single
    orchestration platform
  - Experience with Fivetran or similar ELT tooling
  - Familiarity with Terraform or other infrastructure as code
    (our DevOps team owns most of this)



  Why Talkiatry:

  - Top-notch team: we're a diverse, experienced group motivated
    to make a difference in mental health care
  - Collaborative environment: be part of building something
    from the ground up at a fast-paced startup
  - Excellent benefits: medical, dental, vision, effective day 1
    of employment, 401K with match, generous PTO plus paid
    holidays, paid parental leave, and more!
  - Grow your career with us: hone your skills and build new
    ones with our Learning team as Talkiatry expands
  - It all comes back to care: we’re a mental health company,
    and we put our team’s well-being first



