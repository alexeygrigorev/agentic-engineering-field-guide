description: |
  This is a remote position.



  The software world is changing, and the future of custom-
  developed software depends on software development experts
  equipped with the best skills, tools, and processes. We are
  committed to Microsoft and C#, equipped with Visual Studio
  2026 and GitHub Copilot, integrated with tools from
  JetBrains, Octopus Deploy, Redgate, and other best-of-breed
  tools.



  In this job, you will:



  - Learn and evaluate the full breadth of available Microsoft
    and complementary technologies and make choices for the
    benefit of our clients.
  - Develop custom software (yep, lots of coding - C#,
    JavaScript, SQL, and whatever other languages that come
    and go)
  - Leverage your professional network to get things done (a
    large LinkedIn network indicates you already do this)



  Here are some traits that will be expected:



  - Humble, generally nice person, servant attitude, earning the
    trust of clients and everyone you meet.
  - You want the best thing for the client, even if the best
    thing is to end our project with them.
  - You have just as much passion for their business objectives
    as you do about the technology used to achieve them.
  - You are a passionate, voracious continuous learner.  You
    naturally have kept up with the latest trends,
    technologies and tools in the industry.
  - You naturally find yourself teaching others (blogging,
    speaking, mentoring, giving advice on twitter, etc)
  - Programming is your career as well as hobby.
  - Continuous professional networking.








   Finally, this position needs an ambitious, talented, and
  experienced professional.  Even so, this position is a
  tremendous opportunity for professional growth.  There will
  be constant change, but one thing is certain.  You will
  learn faster at Clear Measure than you will anywhere else.









   Buzzword bingo:  C#, .Net, AI-driven development (AIDD),
  Copilot, GitHub, DevOps, Blazor, SQL Server, ReSharper, CI,
  DI, IoC, SOLID, DDD, architecture, design patterns,
  continuous integration, CI/CD, Azure, cloud, AWS, TDD,
  Agile, mobile, iOS, Android, Entity Framework, Docker,
  Kubernetes, containers, .NET 10, Visual Studio 2026.









