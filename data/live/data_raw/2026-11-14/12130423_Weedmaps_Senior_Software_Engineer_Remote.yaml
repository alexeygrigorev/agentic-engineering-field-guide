description: |
  Senior Software Engineer (Remote)

  Overview:

  Weedmaps is hiring a Senior Software Engineer to build the
  products our consumers and clients use every day, working
  AI-first. You will ship features across our marketplace, our
  Admin tools for dispensaries and brands, and the services
  behind them, using coding agents such as Claude Code and our
  in-house agent, Rhizome, to move several times faster than a
  traditional team while owning the quality of everything that
  goes out. You will turn ambiguous product problems into
  clear plans, break work into pieces agents can take on,
  review and own the results, and help the engineers around
  you work the same way. Success means more meaningful
  features shipped, higher quality, and a team that levels up
  by working alongside you. This role sits on a product
  engineering team and partners with Product, Design and our
  AI Platform team, which builds the shared agent tooling you
  will use.

  The impact you'll make:

  - Ship end-to-end product features across our consumer
    marketplace (web and React Native), our Admin tools for
    dispensaries and brands, and the Node.js and Rails
    services behind them.
  - Work AI-first every day: use Claude Code, shared skills and
    our autonomous coding agent to plan, write, test and
    review code, and judge when a task needs your own hands on
    the keyboard.
  - Own the quality of everything you ship, whether you or an
    agent wrote it: clear designs, solid tests, careful
    review, and telemetry that shows whether a change worked.
  - Break epics into well-scoped tickets that agents and
    teammates can pick up, and write the specs and context
    that make agent output reliable.
  - Partner with Product and Design to turn ambiguous problems
    into clear plans, push back with data, and focus on
    outcomes rather than tickets closed.
  - Help modernize our stack as you build: move features from
    our Rails monolith and legacy Elixir services into Node.js
    microservices and React Native, behind feature flags and
    gradual rollouts.
  - Build AI into the product where it helps users, such as
    search, recommendations and catalog data quality, working
    with the AI Platform and Data teams.
  - Raise the bar for the team: share your workflows and skills,
    pair with engineers who are newer to AI tools, and
    contribute improvements back to the shared agent platform.
  - Take part in on-call for the services you own, and fix
    problems at the root.

  What you've accomplished:

  - Bachelor's degree or equivalent practical experience.
  - Minimum of 6 years of professional software development
    experience, including shipping customer-facing product
    features end to end.
  - Daily, hands-on use of AI coding tools (such as Claude Code,
    Cursor or Copilot) on production work, with concrete
    examples of how they changed your output and how you keep
    quality high.
  - Strong proficiency in TypeScript and React.
  - Experience designing and building APIs and services, ideally
    Node.js, with good testing practices, and comfort working
    across a polyglot codebase that includes Ruby.
  - Experience with a major cloud platform (AWS preferred),
    CI/CD that deploys straight to production, and
    observability tooling.
  - A track record of measuring what you build: A/B tests,
    product metrics or clear before/after results.

  Bonus points:

  - React Native or mobile app development.
  - Building LLM-powered product features such as search,
    recommendations or data extraction.
  - Two-sided marketplace or e-commerce experience, including
    cart, checkout or payments.
  - Feature flags, gradual rollouts and ephemeral environments.
  - Mentoring engineers or leading projects across several
    teams.
  - Ruby on Rails or Elixir, or experience moving features out
    of a monolith.
  - Experience at a marketplace, e-commerce or regulated-
    industry company.

  The base pay range for this position is $162,276 - $207,690
  per year, and a competitive bonus

   2026 US Benefits for Full Time, Regular Employees:

  - Physical Health (Medical, Dental & Vision)
  - 401(k) Retirement Plan (employer will match contribution up
    to 3.5% of employee contribution)
  - Basic Life, Voluntary Life and AD&D Insurance options
  - Supplemental, voluntary benefits
  - PTO, paid sick leave, and company holidays (including a 2026
    holiday shutdown)
  - Paid parental leave

  Why Work at Weedmaps?

  Life at Weedmaps means innovation and heart. Come join us if
  you care about the plant, the people who love it, and are
  ready to let your talent shine. We foster a bustling and
  collaborative culture that revolves around an environment
  that focuses on the benefits of weed, and the community that
  supports it.

  You too can have a hand in shaping the industry’s future;
  ready to roll with us?

  See how we’ve grown—our journey, leadership team, and what’s
  next at Weedmaps.com/corporate

  About Weedmaps:

  Founded in 2008, we’ve grown from a small startup to a
  global leader in the cannabis industry.  Our dedication to
  transparency, education, and community has set us apart, and
  today, we proudly serve cannabis to consumers and businesses
  in the U.S. and worldwide.

  “Freedom to choose. Freedom to access. Freedom to enjoy.”

