description: |
  Tech Lead/ Full Stack Developer  Location: Berlin, Germany
  Company Overview Outcomes4Me is on a mission to democratize
  healthcare and improve outcomes by empowering every cancer
  patient, whomever and wherever they are, with the tools and
  resources that enable them to take a proactive approach to
  their care. Founded in 2017, our award-winning AI-driven
  platform provides personalized evidence-based treatment
  options and resources to cancer patients across the globe in
  real-time. Our global headquarters are based in Boston, MA -
  the global epicenter of healthcare innovation and delivery.
  In 2025, Outcomes4Me acquired the Mika App and established
  Outcomes4Me GmbH, a fully owned subsidiary of Outcomes4Me
  Inc., headquartered in Berlin, Germany. Hear directly from
  patients how we have helped them here. You can also find our
  most recent awards and recognition here and learn about our
  business model here. Outcomes4Me is an exciting health
  technology company transforming cancer care with AI and
  playing a central role in health equity within oncology. Our
  agentic platform analyzes clinical guidelines and patient
  data to provide personalized cancer treatment options,
  clinical trial matches, and symptom information to empower
  patients and support their care team. We won’t rest until we
  end cancer as we know it! One of our core values is do well
  while doing good. Even if you don't check off all the boxes
  below, if you are passionate about doing well while doing
  good, we encourage you to apply. Outcomes4Me is full of
  exceptional people that don't fit a mold but we are all
  united by our passion to transform healthcare and help
  patients.  Join us! Position Overview We are seeking a
  mission-oriented experienced Full Stack Tech Lead &
  Developer to take full ownership of our Python Django and
  NodeJS backend, iOS and Android App, scale our AWS
  infrastructure, and build robust native mobile apps. If
  you’re passionate about building scalable, high-impact
  health tech and mobile apps, this role is for you. Key
  Responsibilities


  - Lead development of our backend and technical architecture
    based on Python Django and NodeJS.
  - Design and build scalable, secure APIs for our native iOS,
    Android and ReactNative apps.
  - Knowledge of Typescript, ReactJS, ReactNative and NextJS
    preferred.
  - Experience with ML and GenAI technologies like OpenAI,
    Anthropic, Bedrock, and Agentic development is a plus.
  - Optimize and manage our AWS infrastructure, ensuring
    performance and reliability.
  - Maintain and enhance our Wagtail CMS for content delivery.
  - Implement error tracking & monitoring.
  - Oversee CI/CD pipelines and GitLab repository management.
  - Work closely with the regulatory and product teams to ensure
    compliance and audit readiness.

  Qualifications: About you: Moving at our pace brings a lot
  of change, complexity, and ambiguity—and a little bit of
  chaos. Our team members thrive on that and are comfortable
  being uncomfortable. That means Outcomes4Me is not the right
  place for everyone. Before you apply, consider if you:

  - Care deeply about what you do and about transforming cancer
    care.
  - Have a passion for healthcare, life sciences, data and
    analytics, and technology.
  - Have a sincere interest in working at a fast-paced
    engineering and product-led startup, and the ability to
    scale with the organization as it grows and its needs
    change over time.
  - Excel by seeking professional and personal hypergrowth.
  - Keep up with an unrelenting pace (the week, not the
    quarter).
  - Are resilient and resourceful in face of ambiguity and
    thrive on (rather than endure) change.
  - Bring critical thought and opinion.
  - Embrace differences and disagreement to get things done and
    move forward: we will only succeed if we make the
    impossible possible.

  To be successful in this role, you must possess strong
  technical and leadership skills. The successful candidate
  will be a detailed and results-oriented individual, deeply
  resourceful and at the forefront of technology who loves
  experimenting with new ways to bring solutions to patients.
  You have:

  - 5+ years of experience in backend development, with strong
    Python Django and NodeJS skills.
  - Deep understanding of development of mobile apps (iOS and
    Android, and React Native).
  - Experience with AWS (Lambda, ECS, RDS, API Gateway, IAM,
    etc.) and using IaC tools like Terraform or Pulumi.
  - Strong database skills, ORM and SQL expertise, tuning for
    performance desired.
  - Good understanding of security best practices in software
    design and development.
  - Strong knowledge of CI/CD pipelines, GitLab, Docker.
  - Experience in mentoring developers and leading technical
    decisions.
  - Fluent in English (German is a plus).
  - Flexibility to work with both Germany and US based teams.

  What we offer:


  - High impact mission-driven work using cutting-edge tech for
    good: Be at the vanguard of AI healthcare innovation.
  - Comprehensive package: Competitive salary, benefits package,
    and equity.
  - Inclusive Culture: A diverse and welcoming work environment
    where everyone’s voice is heard.

  What unites us is our Values and the passion we share to
  live by them:


  - Patients first
  - Data driven
  - Relentless with a sense of urgency
  - Results through teamwork
  - Equity
  - Do well while doing good

  Outcomes4Me is an equal opportunity employer that values
  diversity and is committed to fostering an environment where
  everyone feels included. Join us in transforming healthcare
  and ending cancer as know it.
