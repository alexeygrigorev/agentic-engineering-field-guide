description: |
  Who are we?

  At Finastra, we’re a global leader in financial services
  software, dedicated to expanding access to financial
  services and shaping what’s next for the industry. Our
  technology powers mission‑critical solutions across Lending,
  Payments and Universal Banking, supporting over 7,000
  customers, including 80% of the world’s top 50 banks, in
  more than 110 countries.

  As a Senior Software Engineer, you will play a key role in
  the design, development, and delivery of high-quality
  software solutions for our e-billing and payments platforms.
  This is a full-stack position that requires strong Python
  expertise, a collaborative approach, and a passion for
  tackling complex technical challenges in a fast-paced,
  dynamic environment.

  Responsibilities & Deliverables

  Your deliverables will include, but are not limited to, the
  following:

  - Produce software that meets pre-defined requirements and
    quality standards.
  - Design, develop and implement high-quality, testable code
    and oversees team members performing these functions.
  - Produce detailed specifications in addition to supporting,
    maintaining, and documenting software functionality.
  - Work and lead others to adhere to defined project plans and
    timescales in a fast-paced environment.
  - Make independent decisions and provide guidance on the
    technologies and approaches to be used for each task.
  - Participate in detailed system design and architecture
    discussions to determine technical requirements.
  - Work with internal stakeholders to understand and resolve
    software problems independently without supervision.
  - Participate in the conception, design, and implementation of
    modern web-applications for financial messaging.
  - Support and develop junior/mid-level engineers and be an
    active team player in an Agile development environment.

  What will work well with our team?

  - We take a pragmatic approach to our work in an environment
    that blends fun with professionalism.
  - Good communication skills (English language skills) and
    easy-going manner.
  - Amenable character with good attitude.
  - Comfortable working under pressure to firm deadlines in an
    agile and lean way.
  - Working with Scrum in a multiple scrum team environment.
  - Positive attitude with a genuine passion and interest for
    software development.
  - Understanding of FinTech environment/software products.

  Required Experience

  - Education to degree level in Computer Science or other
    technical related field, or equivalent professional
    experience.
  - The ideal candidate should typically have professional
    experience in full-stack software development, or
    equivalent capabilities.
  - Proficiency in the core technologies used; Python, Django,
    JavaScript (jQuery), MySQL, Linux (Red Hat), Version
    Control (Git).
  - Ability to work as a full stack developer using a range of
    technologies; proficient with front end languages and UI
    design (HTML, CSS).
  - Proficient in leveraging AI tools such as Copilot to improve
    development efficiency and streamline workflows.
  - Excellent knowledge and implementation of software
    development best practices, methodologies, processes, and
    tools.
  - Excellent technical, analytical, and problem-solving skills
    with the ability to lead others to effect problem
    resolution.
  - Effective leadership, organizational, communication and
    reporting skills with attention to detail.
  - Nice to have experience with payment systems or
    banking/financial services domain experience.

  We are proud to offer a range of incentives to our employees
  worldwide. These benefits are available to everyone,
  regardless of grade, and reflect the values we uphold:

  - Flexibility: Enjoy unlimited vacation, based on your
    location and business priorities. Hybrid working
    arrangements, and inclusive policies such as paid time off
    for voting, bereavement, and sick leave.
  - Well-being: Access Confidential one-on-one therapy through
    our Employee Assistance Program, find support from our
    network of Wellbeing Champions and Gather Groups, and a
    calendar of monthly events and initiatives designed to
    help you thrive - Inside and Outside of work.
  - Medical, life & disability insurance, retirement plan,
    lifestyle and other benefits*
  - ESG: Benefit from paid time off for volunteering and
    donation matching.
  - DEI: Participate in multiple DE&I groups for open
    involvement (e.g., Count Me In, Culture@Finastra,
    Proud@Finastra, Disabilities@Finastra, Women@Finastra).
  - Career Development: Access online learning and accredited
    courses through our Skills & Career Navigator tool.
  - Recognition: Be part of our global recognition program,
    Finastra Celebrates, and contribute to regular employee
    surveys to help shape Finastra and foster a culture where
    everyone is engaged and empowered to perform at their
    best.

  *Specific benefits may vary by location.

  At Finastra, each individual is unique, bringing their own
  ideas, thoughts, cultural beliefs, backgrounds, and
  experiences together. We learn from one another, embrace and
  celebrate our differences, and create an environment where
  everyone feels safe to be themselves.

  Be unique, be exceptional, and help us make a difference at
  Finastra!

