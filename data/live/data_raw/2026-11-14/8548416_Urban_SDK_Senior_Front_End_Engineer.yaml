description: |
  About Urban SDK

  Urban SDK is shaping the Future of Smart Cities. We are
  pioneers in geospatial AI technology, providing public
  leaders with insights and automation for mission-critical
  decisions. We equip critical public services with geospatial
  AI, enabling precise, data-driven decisions with efficiency
  and confidence.

  Our Commitment to People

  We are committed to aligning business growth with
  professional outcomes for every employee. Our commitment has
  been recognized by Jacksonville Business Journal and Will
  Reed as a noted Best Places to Work.

  About the role

  We are hiring a Senior Front End Engineer to lead the
  development of rich, interactive web applications built with
  React, Chakra UI, Mapbox, and modern data visualization
  using Plotly and ApexCharts. You will play a key role in
  shaping the user experience for data-heavy products,
  translating complex datasets into intuitive, high-
  performance interfaces.

  Responsibilities

  - Design, build, and maintain complex front-end applications
    using React
  - Create accessible, responsive UI components using Chakra UI
  - Implement interactive map-based experiences using Mapbox GL
    JS
  - Build interactive data visualizations and dashboards using
    Plotly and ApexCharts
  - Optimize performance for large datasets, maps, and real-time
    updates
  - Collaborate with product managers, designers, and backend
    engineers to define and deliver features
  - Establish and enforce front-end best practices
    (architecture, testing, accessibility, performance)
  - Lead code reviews and mentor other engineers
  - Contribute to technical planning and architectural decisions
  - Ensure cross-browser compatibility and responsive behavior

  Required Qualifications

  - 5+ years of professional front-end development experience
  - Strong expertise in JavaScript (ES6+) and TypeScript
  - Deep experience with React and modern React patterns (hooks,
    context, memoization)
  - Production experience with Chakra UI or similar component
    libraries
  - Hands-on experience with Mapbox (layers, sources,
    interactions, performance tuning)
  - Experience building data visualizations using Plotly and/or
    ApexCharts
  - Solid understanding of HTML, CSS, responsive design, and
    accessibility (WCAG)
  - Experience consuming REST and/or GraphQL APIs
  - Strong debugging, performance optimization, and problem-
    solving skills

  Nice to Have

  - Experience with Next.js or similar React frameworks
  - Familiarity with geospatial concepts (GeoJSON, projections,
    tilesets)
  - Experience working with large or real-time datasets
  - Knowledge of front-end testing tools (Jest, React Testing
    Library, Cypress)
  - Experience in data, analytics, mapping, or visualization-
    heavy products
  - Prior experience leading projects or acting as a technical
    owner

  Compensation

  - Location: Jacksonville, FL (Town Center Area) or Remote
  - Type:  Full-time
  - Reports to: Director of Engineering
  - Salary Based on Experience
  - Annual Bonus
  - Medical, Vision, Dental, 401(k)
  - 21 Days Vacation
  - Office Lunch provided Daily
