description: |
  Intro _For this position we are only looking for candidates
  located in Greece, Germany or Austria._ Nairon GmbH is a
  Swiss startup building AI voice agents that answer and make
  phone calls for businesses. Our platform runs real-time
  conversations over the phone and on the web, connected to
  our customers' telephony and business tools. We value clear
  communication, thoughtful engineering, and a collaborative
  approach to problem-solving. Join us as we continue to
  develop tools that make a difference. Tasks As a Full-Stack
  & Mobile Engineer at Nairon GmbH, you will build our product
  on the web and on the phone in the customer's hand. Your
  responsibilities will include: * Designing, developing and
  maintaining our web application with _Next.js, React,
  Tailwind CSS_ and _TypeScript_: the flow editor, call
  analytics, billing and partner tools. * Building our native
  companion app with _Expo / React Native_ or _Swift_. *
  Building features across the stack, from the user interface
  to the database with _Prisma_ and PostgreSQL, and the
  _Python_ services behind them. * Owning features end to end:
  turning customer needs into requirements, shipping them and
  checking that they help. * Applying DevOps practices to
  support development and deployment, including _Docker_ and,
  when appropriate, _Kubernetes_. * Participating in technical
  discussions, code reviews and architectural planning.
  Requirements Experience: Any relevant experience in web or
  mobile development is welcome; we are open to junior, mid-
  level and senior candidates who demonstrate strong practical
  skills and a willingness to learn. Technical Skills:
  Required: * Proficiency with _Next.js_, _React_ and
  _TypeScript_. * Experience building mobile apps with _Expo /
  React Native_, _Swift_ or a comparable stack. Nice to have:
  * _Tailwind CSS_, _Prisma_, PostgreSQL or _Supabase_. *
  _Python_ and _FastAPI_ for backend services. * _Docker_ and
  _Kubernetes_ basics; experience with real-time features,
  audio or AI products. Communication: * _English proficiency
  is essential, both written and spoken, as it is the working
  language for all positions._ * German is a plus. Soft
  Skills: * Ability to work independently and as part of a
  distributed team. * Product sense: you ask why before you
  build. * Willingness to take ownership of features and
  contribute to team discussions. Benefits * Flexible Work
  Setup: Work fully remotely or from a co-working space —
  whichever suits you best. * Equipment Provided: Company
  laptop and phone provided for all employees. * Collaborative
  Environment: Join a small, agile team where your
  contributions have a direct impact. * Growth Opportunities:
  Web, backend and mobile in one role, with the chance to
  expand into AI-related work over time. Closing If you're
  excited about building a product people use on the web and
  on their phones, we'd love to hear from you.
