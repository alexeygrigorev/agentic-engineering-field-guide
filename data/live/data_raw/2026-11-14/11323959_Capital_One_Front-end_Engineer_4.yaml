description: |
  Front-end Engineer 4 Do you love building and pioneering in
  the technology space? Do you enjoy solving complex business
  problems in a fast-paced, collaborative, inclusive and
  iterative delivery environment? At Capital One, you'll be
  part of a big group of makers, breakers, doers and
  disruptors who solve real problems and meet real customer
  needs. We are seeking Front-end Software Engineers who are
  passionate about leveraging cutting-edge open source
  frameworks and emerging technologies. In this role, you'll
  be at the forefront of driving a major transformation across
  Capital One. About the Team: The Travel App Platform Team
  builds and maintains the cross-platform, shared architecture
  and services that power Capital One Travel products,
  including flights, hotels, rental cars, vacation rentals,
  activities and cruises. We develop the foundational platform
  in pursuit of enabling rapid development and high
  customizability in the Capital One Travel Portal. You will
  partner closely with product engineering teams across
  Capital One Travel to identify shared needs, shape platform
  direction, and drive adoption of common patterns and
  services. What You'll Do:

  - Partner with Software Engineers, Designers, and Product
    Managers to deliver high-performing, quality features for
    100M+ customers that are engaging, purposeful and powerful
    in their simplicity
  - Provide technical leadership for front-end architecture and
    design patterns, acting as a multiplier for your team's
    impact
  - Mentor other engineers, fostering their growth through
    thoughtful feedback, code reviews, and sharing of best
    practices for AI-assisted development, while helping to
    identify and clear technical obstacles
  - Grow and provide subject matter expertise in key platform
    areas (e.g., performance, accessibility, architecture)
  - Contribute to front-end architecture decisions, API design
    reviews, and reusable component development
  - Lead the design and development of client Backend-for-
    Frontends (BFFs) and micro frontend (MFE) or federated
    application architectures to deliver scalable and flexible
    product experiences
  - Lead the implementation and refinement of well-managed
    engineering practices, defining best practices for feature
    flags and canary rollouts to improve product delivery and
    quality
  - Champion the adoption of agentic AI tools, mentoring
    engineers in AI-native development practices to increase
    team velocity
  - Apply mastery of the modern web ecosystem (including PWAs,
    Wasm, mobile web, and Service Workers) to make complex,
    high-leverage, hands-on technical contributions
  - Drive a culture of quality, performance, accessibility, and
    customer empathy, establishing high standards for coding,
    testing, and user experience

  Basic Qualifications:

  - Bachelor's Degree or higher in Computer Science or a related
    quantitative field (Statistics, Economics, Operations
    Research, Analytics, Mathematics, Engineering)
  - At least 4 years of professional software engineering
    experience (internship experience does not apply)
  - At least 3 years of experience developing applications using
    TypeScript, HTML, CSS and modern web frameworks (React,
    Angular, Vue, Svelte)

  Preferred Qualifications:

  - Proven experience with TypeScript and JavaScript
  - Proven experience with modern web frameworks (e.g., React,
    Angular, Vue, Svelte), HTML and CSS
  - Demonstrated experience with automated testing frameworks
    (e.g., Jest, Cypress, Playwright) and web performance
    tuning
  - Demonstrated experience designing scalable front-end
    architectures and reusable component libraries
  - Experience implementing and maintaining comprehensive
    automated testing
  - Demonstrated experience designing and developing client
    Backend-for-Frontends (BFFs) to orchestrate data using
    technologies like GraphQL and efficient networking
    protocols (e.g., gRPC/Protobuf)
  - Demonstrated experience with micro frontend (MFE)
    architectures or federated architectural patterns
  - Demonstrated experience in metrics-driven canary release and
    feature flag strategies
  - Expertise with agentic AI coding tools and AI-assisted
    workflow patterns

  At this time, Capital One will not sponsor a new applicant
  for employment authorization, or offer any immigration
  related support for this position (e.g. H1B, F-1 OPT, F-1
  STEM OPT, F-1 CPT, J-1, TN, E-3, and O-1, or any other forms
  of work authorization that require immigration support from
  an employer).  The minimum and maximum full-time annual
  salaries for this role are listed below, by location. Please
  note that this salary information is solely for candidates
  hired to perform work within one of these locations, and
  refers to the amount Capital One is willing to pay at the
  time of this posting. Salaries for part-time roles will be
  prorated based upon the agreed upon number of hours to be
  regularly worked. McLean, VA: $197,300 - $225,100 for Front-
  end Engineer 4 New York, NY: $215,200 - $245,600 for Front-
  end Engineer 4 Candidates hired to work in other locations
  will be subject to the pay range associated with that
  location, and the actual annualized salary amount offered to
  any candidate at the time of hire will be reflected solely
  in the candidate's offer letter. This role is also eligible
  to earn performance based incentive compensation, which may
  include cash bonus(es) and/or long term incentives (LTI).
  Incentives could be discretionary or non discretionary
  depending on the plan. Capital One offers a comprehensive,
  competitive, and inclusive set of health, financial and
  other benefits that support your total well-being. Learn
  more at the Capital One Careers website . Eligibility varies
  based on full or part-time status, exempt or non-exempt
  status, and management level. This role is expected to
  accept applications for a minimum of 5 business days. No
  agencies please. Capital One is an equal opportunity
