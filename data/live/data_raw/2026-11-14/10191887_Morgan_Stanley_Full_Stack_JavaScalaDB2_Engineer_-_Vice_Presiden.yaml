description: |
  In the Technology division, we leverage innovation to build
  the connections and capabilities that power our Firm,
  enabling our clients and colleagues to redefine markets and
  shape the future of our communities. This is a Software
  Engineering position at the Vice President level, which is
  part of the job family responsible for developing and
  maintaining software solutions that support business needs.

  Morgan Stanley is an industry leader in financial services,
  known for mobilizing capital to help governments,
  corporations, institutions, and individuals around the world
  achieve their financial goals.

  Interested in joining a team that’s eager to create,
  innovate and make an impact on the world? Read on.

  Company Profile  Morgan Stanley is a leading global
  financial services firm providing a wide range of investment
  banking, securities, investment management and wealth
  management services. The Firm's employees serve clients
  worldwide including corporations, governments, and
  individuals from more than 1,200 offices in 43 countries. As
  a market leader, the talent and passion of our people is
  critical to our success. Together, we share a common set of
  values rooted in integrity, excellence, and strong team
  ethic. Morgan Stanley can provide a superior foundation for
  building a professional career—a place for people to learn,
  to achieve and grow. A philosophy that balances personal
  lifestyles, perspectives and needs is an important part of
  our culture.

  Liquidity Planning fleet, building a globally consistent
  liquidity reporting and risk-management platform via the
  strategic 6G implementation. It integrates regulatory
  calculators (LCR, NSFR, GSIB, FINRA SLS) with stress-testing
  and migrates liquidity calculations to strategic platforms.

  What you’ll do in the role:

  - Design and deliver scalable, maintainable software solutions
    using strong object-oriented design principles.
  - Develop and maintain data ingestion platform (ETL/Streaming)
    for large scale data warehousing.
  - Build and enhance automation tools and scripts to support
    development and operational workflows.
  - Contribute to CI/CD pipelines, improving release reliability
    and deployment efficiency.
  - Apply Test-Driven Development (TDD) practices to ensure
    quality, testability, and long-term maintainability.
  - Collaborate with cross-functional teams and communicate
    effectively with technical and non-technical stakeholders.
  - Troubleshoot and debug applications in UNIX/Linux
    environments.

  What you’ll bring to the role:

  - 10+ years of relevant hands on software development
    experience, with demonstrated good ownership and
    independent delivery.
  - Strong DB2 database admin experience and project exposure
    for real time solutions in tunning of database
    performances including (not limited to) stored procs,
    views, MQTs.
  - Hands-on experience with RDBMS and SQL, such as DB2,
    PostgreSQL, or Sybase.
  - Good programming skills in Scala, Java & Python with
    understanding of Object-Oriented Programming (OOP).
  - Proficiency in Linux/UNIX, including command-line usage and
    shell scripting for automation.
  - Practical experience with CI/CD pipelines and TDD.
  - Experience working in modern SDLC environments, including
    Agile methodologies.
  - Strong written and verbal communication skills.

  Preferred (Nice-to-Have) Qualifications:

  - Exposure towards Spark architecture.
  - Exposure to Snowflake and/or other cloud technologies
  - Experience with Big Data and non-relational platforms (e.g.,
    Hadoop, MongoDB).
  - Familiarity with DevOps tooling and automated change
    management processes.
  - Experience with scheduling/automation tools and scripting
    such as AutoSys, UNIX shell, or Perl for DevOps
    automation.
  - Background in computer science fundamentals, including
    complexity analysis and computational optimization.
  - Experience in the financial services industry, particularly
    accounting/finance-related domains.
  - Knowledge of business reporting concepts, data design, and
    data science fundamentals.

  WHAT YOU CAN EXPECT FROM MORGAN STANLEY:

   At Morgan Stanley, we raise, manage and allocate capital
  for our clients – helping them reach their goals. We do it
  in a way that’s differentiated – and we’ve done that for 90
  years.  Our values - putting clients first, doing the right
  thing, leading with exceptional ideas, committing to
  diversity and inclusion, and giving back - aren’t just
  beliefs, they guide the decisions we make every day to do
  what's best for our clients, communities and more than
  80,000 employees in 1,200 offices across 42 countries. At
  Morgan Stanley, you’ll find an opportunity to work alongside
  the best and the brightest, in an environment where you are
  supported and empowered. Our teams are relentless
  collaborators and creative thinkers, fueled by their diverse
  backgrounds and experiences. We are proud to support our
  employees and their families at every point along their
  work-life journey, offering some of the most attractive and
  comprehensive employee benefits and perks in the industry.
  There’s also ample opportunity to move about the business
  for those who show passion and grit in their work.

  To learn more about our offices across the globe, please
  copy and paste https://www.morganstanley.com/about-
  us/global-offices into your browser.

