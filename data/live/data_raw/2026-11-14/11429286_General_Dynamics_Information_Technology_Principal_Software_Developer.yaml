  Job Description:

  Principal Software Developer

    We value:

    - Writing code rather than documents

    - Shipping products rather than talking about roadmaps

    - Big features rather than changing button colors

    If this sounds like you, let's talk.



  WHO YOU ARE:

  - We're looking for engineers of accomplishment who are
    passionate about our mission and have a strong desire to
    make a meaningful impact. You should be able to
    demonstrate the tangible value you've delivered in
    previous roles.

  - The ideal candidate will be proficient in Python/Java or
    similar language, an expert in the majority of language
     constructs, and able to apply them fluently to solve
    complicated and complex problems

  - You thrive in environments that demand continuous learning
    and adaptation, embracing new technologies and approaches
    as the software engineering landscape evolves. You're not
    afraid to venture into uncharted territory and actively
    leverage AI tools to amplify your engineering capabilities
    and deliver greater impact.



  WHAT YOU'LL DO:

  - Work in a fast-paced, collaborative environment where ideas
    are discussed and challenged openly

  - Deliver new features and improve reliability of our core
    services including the major read/write paths for customer
    intake, application screening, and information
    dissemination

  - Identify major system bottlenecks or flaws in business
    logic, and proactively address them

  - Take ownership over core product problems, develop solutions
    you're proud of, and prove through data that they deliver
    impact at scale

  - Work across the stack to solve problems -- there is no
    reliance on another engineer or team to get something done
      for you

  - Lead a team of Developers to engineer and develop software
    to solve complex user problems

  - Communicate technical decisions and trade-offs effectively
    to both technical and non-technical stakeholders



  WHAT WE'RE LOOKING FOR:

    Evidence of Engineering Accomplishment:

  - Demonstrated track record of delivering high-impact software
    solutions in professional settings

  - Proven ability to design and implement distributed systems
    (multi-tier architectures) including storage layers,
     caching layers, application layers, with understanding of
    failure modes

  - Verifiable experience with microservice architectures,
    especially in high-throughput and low-latency systems

  - Portfolio of work showing expertise with system
    transformations (e.g., applying strangler patterns to
    evolve  monoliths to microservices)

  - Experience with complex systems migrations involving
    multiple phases (dark reads, dark writes, light reads,  
    light writes)

    Technical Excellence:

  - Expert-level proficiency in at least one modern programming
    language (Java, Python, or similar)

  - Expert-level proficiency in cloud engineering paradigms,
    especially high-scale asynchronous systems and secure
    service integration patterns

  - Deep understanding of design patterns, reliability, and
    scaling principles

  - Strong architectural and system design capabilities

    Leadership & Communication:

  - Demonstrated ability to communicate complex technical
    concepts to non-technical audiences

  - Experience mentoring engineers, leading technical teams, or
    serving as a tech lead

  - Ability to influence technical direction and advocate for
    sound engineering practices

    Adaptability & Growth:

  - Track record of learning and adapting to new technologies,
    frameworks, and methodologies

  - Demonstrated embrace of AI and automation tools to enhance
    productivity and engineering outcomes

  - Comfort with ambiguity and willingness to venture into new
    problem domains

  Note: We value demonstrated accomplishment and impact over
  years of experience. If you can show us the value you've
  created, the problems you've solved, and your ability to
  grow with the evolving demands of modern software
  engineering, we want to hear from you.

  GDIT IS YOUR PLACE

  At GDIT, the mission is our purpose, and our people are at
  the center of everything we do. ● Growth: AI-powered career
  tool that identifies career steps and learning opportunities
  ● Support: An internal mobility team focused on helping you
  achieve your career goals ● Rewards: Comprehensive benefits
  and wellness packages, 401K with company match, and
  competitive pay and paid time off ● Flexibility: Full-flex
  work week to own your priorities at work and at home ●
  Community: Award-winning culture of innovation and a
  military-friendly workplace

  OWN YOUR OPPORTUNITY Explore a career in software
  development at GDIT and you’ll find endless opportunities to
  grow alongside colleagues who share your dedication to
  advancing innovation.

  The likely salary range for this position is $187,000 -
  $253,000. This is not, however, a guarantee of compensation
  or salary. Rather, salary will be set based on experience,
  geographic location and possibly contractual requirements
  and could fall outside of this range.

