description: |
  About the role

  We're looking for a Mid-Level Software Engineer who combines
  strong engineering fundamentals with sound technical
  judgment. Someone who can translate requirements into
  practical solutions, anticipate challenges and work
  independently while contributing to the wider team's
  success.

  This is a full-stack position with a strong backend focus
  (approximately 75% server-side C#/.NET and 25% frontend
  across our WPF desktop and React web applications).

  You'll play an important role in delivering the technology
  behind that transformation.

  What you'll be doing

  - Take component ownership: Design, implement and maintain key
    areas of the platform, making considered architectural
    decisions and ensuring your work remains dependable as the
    product evolves.

  - Deliver end to end: Turn product requirements into well-
    planned technical solutions, accounting for dependencies
    such as database migrations, testing, documentation and
    deployment.

  - Champion engineering quality: Develop meaningful automated
    tests, validate functionality against real-world client
    scenarios and address underlying causes rather than
    temporary fixes.

  - Manage change with confidence: Introduce feature flags and
    safe deployment strategies, planning database changes that
    minimise disruption and support continuous delivery.

  - Work across teams: Partner with Product and Support to
    understand client needs, challenge unnecessary complexity
    and identify improvements that deliver lasting value.

  - Raise engineering standards: Contribute thoughtful code
    reviews, share technical knowledge and support colleagues
    in strengthening their engineering practices.

  What makes you a great fit

  - Proven experience designing, developing and shipping
    production software.

  - Strong proficiency in at least one statically typed
    programming language, with the ability to apply sound
    engineering principles. Our primary stack is C#/.NET.

  - Strong SQL skills, including data modelling, query
    optimisation and investigating performance issues in
    production environments.

  - Demonstrated responsibility for features or components
    beyond initial release, including maintenance and ongoing
    improvements.

  - A disciplined approach to testing, covering edge cases and
    real-world scenarios, with the judgment to critically
    assess and validate AI-generated code.

  - The ability to communicate technical decisions clearly
    through pull requests, design documentation and
    engineering discussions.

  - A proactive mindset, with the confidence to challenge
    assumptions, identify potential issues and recommend
    practical solutions.

  Bonus points if you bring

  - Commercial C#/.NET development experience.

  - Knowledge of fund accounting, financial services, fintech or
    other data-intensive industries where accuracy and
    reconciliation are essential.

  - Familiarity with cloud-hosted SaaS platforms, CI/CD
    pipelines and container technologies.

  - Experience establishing monitoring, logging and alerting
    standards for production services.

  - Frontend development knowledge, particularly WPF or React.

  - Exposure to agentic workflows or integrating AI-driven
    capabilities into software products.

  - Previous experience in an early-stage or high-growth
    technology business.

  Equal Opportunity Employer

  LemonEdge is an Equal Opportunity Employer committed to fair
  and equitable hiring practices. All employment decisions are
  based on business needs, job requirements and individual
  qualifications, without regard to race, color, religion,
  sex, sexual orientation, gender identity, national origin,
  age, disability or any other characteristic protected by
  applicable law.
