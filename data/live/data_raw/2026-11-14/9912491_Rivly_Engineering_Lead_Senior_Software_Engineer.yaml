description: |
  Who We AreStory

  Rivly is an ecommerce marketplace (like Amazon) that was
  founded in 2020 with a mission to enable American businesses
  to succeed. We watched as the current leaders have become
  increasingly dominated by sellers based overseas, while
  consumer data shows that American shoppers increasingly
  prefer to buy from U.S.-based businesses.

  Rivly gives American shoppers what they’ve been asking for:
  a marketplace that aggregates the best U.S. businesses in a
  truly unique and engaging shopping experience.

  Shopping on Rivly means you are choosing to support your
  neighbor, local businesses, and the push for “Made in USA.”
  It means you care about the environment, you care about
  giving back to the community, and you care about the future
  of our country.

  Brands: 12,000+Funding: $1.4M (Pre-Seed)What We Value

  - Pursue growth and learning with humility
  - Deliver "kind candor" for feedback
  - Energy is contagious, choose positivity
  - Deliver a "wow" experience through service
  - Listen first, then listen more
  - Show gratitude
  - Live smarter, not harder
  - Make time to reflect

  Who You Are

  We are seeking an experienced engineering lead to join our
  team! As an engineering lead, you will play a crucial role
  in overseeing the development and implementation of our
  software solutions. With your coding abilities, technical
  expertise and leadership skills, you will get the
  opportunity to lead and grow a team of engineers while
  ensuring the successful delivery of our products.

  What You'll Do

  - Spend some of your time hands-on coding with complex
    features while also managing and growing a team of
    engineers
  - Providing guidance and support to ensure delivery of high-
    quality software solutions
  - Collaborate with cross-functional teams to define project
    requirements and ensure alignment with business goals
  - Develop and implement software development strategies,
    processes, and best practices
  - Conduct code reviews, identify areas for improvement, and
    address any technical challenges
  - Drive innovation by staying up-to-date with emerging
    technologies and industry trends
  - Provide technical guidance and mentorship to team members,
    fostering their professional growth
  - Coordinate with project stakeholders to establish project
    timelines, milestones, and deliverables

  What You'll Need

  - Minimum of 7 years of experience in software development,
    with at least 2 years in a leadership role
  - Strong technical background with expertise in software
    development and architecture
  - Required proficiency:
    - 5+ years PHP with specific Laravel experience, or
    - 10+ years PHP
  - Experience with Jira and Agile development methodologies
  - Proven track record of successfully delivering software
    projects on time

  What Will Set You Apart

  - Live near Tampa Bay, FL or Boston, MA (or would consider
    relocating)
  - Worked at a VC-backed startup with 11-100 employees
  - Specific ecommerce and/or marketplace technology expertise
  - Experience with other parts of our tech stack:
    - Javascript
    - Node.js
    - Vue.js
    - Nuxt.js
    - MySQL
    - MongoDB
    - Google Cloud Platform
    - Amazon Selling Partner API
    - Stripe
    - Plaid

  Location

  In-office (Tampa, FL) and/or remote (United States)

  Compensation

  - Salary: $119,000 - $171,000
  - Equity: 0.37%

  Benefits

  - Unlimited paid time off
  - Flexible working hours
  - Remote or hybrid working environment
  - Choose any medical, dental, and/or vision plan with any
    carrier
  - Healthcare reimbursement for out-of-pocket qualified medical
    expenses (co-pays, prescriptions, etc.) up to monthly
    limit
  - Free swag
  - Annual home office upgrade reimbursement
  - Volunteer time for any registered non-profit organization

  How to Apply

  If you meet the above requirements and are excited about the
  opportunity to join our mission to support U.S.-based
  businesses, please submit your information and resume for
  our team to review.

  Role DisclaimersEEO Statement

  At Rivly, we don’t just accept differences — we celebrate
  them, we support them, and we thrive on them for the benefit
  of our employees, our products, and our community. Rivly is
  proud to be an equal opportunity workplace.

  Pay Transparency

  Rivly compensation is based on various factors including but
  not limited to job location, a candidate's education,
  training, experience, expected quality and quantity of work,
  required travel (if any), external market and internal value
  analysis including seniority and merit systems, as well as
  internal pay alignment. Annual salary is just one component
  of Rivly's total compensation package. Compensation ranges
  may differ based on contract value but will be commensurate
  with job duties and relevant work experience. An applicant's
  salary history will not be used in determining compensation.

  Reasonable Accommodations

  Rivly is committed to providing access, equal opportunity
  and reasonable accommodation for individuals with
  disabilities in employment, its services, programs, and
  activities. To request reasonable accommodation, please
  contact us via website.

  Additional Notice

  Please note that this job description is only a summary of
  the typical functions of the job, not an exhaustive or
  comprehensive list of all possible responsibilities, tasks,
  and duties.
