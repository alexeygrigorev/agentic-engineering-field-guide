  mental disability, genetic information, veteran status,
  gender identity or expression, sexual orientation, or other
  applicable legally protected characteristics. We are
  committed to providing reasonable accommodations for
  qualified individuals with disabilities in our job
  application procedures. If you need assistance or an
  accommodation due to a disability, you may contact us at
  recruiting@clubhouse.com.
