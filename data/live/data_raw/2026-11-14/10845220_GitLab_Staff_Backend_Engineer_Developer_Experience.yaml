description: |
  GitLab is the intelligent orchestration platform for
  DevSecOps. GitLab enables organizations to increase
  developer productivity, improve operational efficiency,
  reduce security and compliance risk, and accelerate digital
  transformation. More than 50 million registered users and
  more than 50% of the Fortune 100* trust GitLab to ship
  better, more secure software faster.

  The same principles built into our products are reflected in
  how our team works: we embrace AI as a core productivity
  multiplier, with all team members expected to incorporate AI
  into their daily workflows to drive efficiency, innovation,
  and impact. GitLab is where careers accelerate, innovation
  flourishes, and every voice is valued. Our high-performance
  culture is driven by our values and continuous knowledge
  exchange, enabling our team members to reach their full
  potential while collaborating with industry leaders to solve
  complex problems. Co-create the future with us as we build
  technology that transforms how the world develops software.

  *Fortune 500® is a registered trademark of Fortune Media IP
  Limited, used under license. Claim based on GitLab data.
  Fortune 100 refers to the top 20% ranked companies in the
  2025 Fortune 500 list, published in June 2025. Fortune and
  Fortune Media IP Limited are not affiliated with, and do not
  endorse products or services of GitLab.

  As a Staff Backend Engineer in the Developer Experience
  group, you’ll work cross-functionally to help us identify
  and improve the engineering experience across GitLab’s
  internal engineering teams. We’re at a pivotal time in
  transforming our testing approach and development experience
  to enable engineers to deliver high-quality code efficiently
  and with confidence.

  Developer Experience currently has six, globally distributed
  teams of Backend Engineers and Software Engineers in Test.
  This role will work across the entire group to help us
  identify and remove the biggest points of friction that
  affect development at GitLab. Expect to split your time
  between hands-on coding in Ruby and Go, designing scalable
  solutions and helping every team deliver.  You’ll be
  instrumental in shaping our engineering culture across
  GitLab.

  This is a highly visible role with strong company-wide
  support. You’ll be instrumental in shifting our culture and
  practices toward a cohesive Developer Experience Platform
  strategy—backed by buy-in and appetite for change.

  Some examples of our projects

  - Project ExamplesIn this role, you may lead projects such as:
    - Internal developer platform adoption: Build and evolve
      platform capabilities that make it easier for
      engineering teams to create, deploy, operate, and scale
      services on Kubernetes.
    - Kubernetes-based service onboarding: Define reusable service
      templates, deployment workflows, configuration patterns,
      and operational guardrails for teams adopting the
      platform.
    - Developer workflows and test environments: Build
      development, CI, and test environments that reflect
      production Kubernetes behavior — including third-party
      operators and the custom resources services depend on —
      sequencing CRD establishment, controller readiness, and
      dependent workloads so engineers get a working
      environment rather than a partially reconciled one,
      across both local and remote clusters.
    - Platform reliability and observability: Partner with
      infrastructure and service teams to improve rollout
      safety, troubleshooting, service health, resource
      management, and operational visibility across Kubernetes
      workloads.

  The base salary range for this role’s listed level is
  currently for residents of the United States only. This
  range is intended to reflect the role's base salary rate in
  locations throughout the US. Grade level and salary ranges
  are determined through interviews and a review of education,
  experience, knowledge, skills, abilities of the applicant,
  equity with other team members, alignment with market data,
  and geographic location. The base salary range does not
  include any bonuses, equity, or benefits. See more
  information on our benefits and equity. Sales roles are also
  eligible for incentive pay targeted at up to 100% of the
  offered base salary.

