description: |
  MetTel is a global communications solutions provider with
  the most complete suite of fully managed services that focus
  on secure connectivity, and network and mobility services.
  We simplify communications and networking for business and
  government agencies. Our customers include many of the
  Fortune 500, and Gartner recognizes us as an industry
  leader. We have the broadest portfolio of technology and
  integrated partnerships, as well as our private network,
  which we use to create tailored solutions design,
  deployment, and ongoing management, driving cost savings,
  efficiency, innovation, and the ability to focus on core
  objectives.

  We believe that each team member is a key to the success and
  sustainability of the group. In order to achieve this, we
  offer an environment where all professionals can grow and
  develop their skills and competencies, collaborate with
  diverse professionals, share knowledge and enjoy a rewarding
  career.

  We are seeking a Senior Software Engineer – Front-End to
  join a new Bruin Platform Modernization team in NYC!

  Bruin is MetTel's mission-critical operations platform — 15
  years in production, deeply embedded in how MetTel and its
  customers run. Key responsibilities of this role include
  building high-profile, highly interactive, extremely fast,
  client-facing web and mobile applications, evolving Bruin
  portal to be best-in-class, AI-first user interface,
  establishing a design system and shared component library
  that will standardize UI for Bruin and other applications.

  ROLE AND RESPONSIBILITIES

  - Own front-end work end to end, from feature delivery to
    foundational initiatives such as the shared component
    library, or application rebranding, operating with a high
    degree of autonomy and minimal supervision. Proactively
    identify improvements, apply engineering best practices,
    and drive projects from concept through production.
  - Front-End Architecture: Design, develop, and maintain the
    responsive, high-performance front-end for the modernized
    Bruin portal, including its AI-assisted customer-facing
    surfaces. Establish the architecture patterns, state
    management approach, build tooling, and testing strategy
    the modernized Bruin.
  - Design System & Component Library (Cross-Application):
    Establish and own a standardized, versioned component
    library that implements the design system published by our
    UX team. Establish Storybook as the published, single
    source of truth for the component library. Drive adoption
    across multiple product and engineering teams so
    components, patterns, and design tokens are reused
    everywhere instead of re-built per team.
  - Cross-Team Collaboration: Work closely with product
    managers, designers, back-end engineers, and other teams
    contributing to the AI portal evolution. Define clean
    front-end contracts and component boundaries across
    multiple contributors and time zones.
  - UI/UX, Accessibility & Performance: Implement best practices
    in UI/UX, accessibility (WCAG), and performance
    optimization. Own front-end performance metrics for the
    surfaces you ship.
  - Modern Web Capabilities: Apply modern front-end technologies
    (React, Next.js, TypeScript) to deliver experiences that
    feel fast, responsive, and reliable.
  - API & Microservices Integration: Integrate front-end
    applications with the Bruin SDK, public APIs, and back-end
    microservices. Partner with the Integration Engineer on
    the developer experience surfaces.
  - AI-Augmented Engineering: Use AI-assisted engineering tools
    as a primary part of your workflow - directing them to
    generate, refactor, and validate code while applying
    judgment to review output and make design and
    architectural decisions.
  - Code Quality & Mentorship: Participate in code reviews,
    ensure high standards for quality, security, and
    maintainability. Guide collaborating junior and mid-level
    engineers.
  - Prototyping & MVP Development: Contribute to rapid
    prototyping and MVP development as the modernized Bruin
    experience takes shape

  DESIRED QUALIFICATIONS:

  - 5+ years of professional software engineering experience,
    with strong focus on front-end development.
  - Deep expertise in React, Next.js, TypeScript, and modern web
    frameworks.
  - Strong understanding of responsive design, accessibility
    standards and front-end performance optimization.
  - Experience integrating front-end applications with APIs and
    microservices.
  - Demonstrated experience building customer-facing or
    developer-facing UIs as product — not just internal
    tooling. You can describe the design decisions, the trade-
    offs, and what you would do differently.
  - Hands-on experience building and maintaining a shared design
    system or component library used across multiple
    applications or teams.
  - Proficiency with Storybook (or an equivalent component
    workshop) for component development, documentation, and
    testing.
  - Solid background in agile methodologies and DevOps
    practices.
  - Excellent communication skills and ability to work
    effectively with distributed, cross-functional teams.

  NICE TO HAVE:

  - Experience publishing a design system as canonical, AI-
    consumable context that AI dev tools and agents can
    reference (e.g., Chromatic for publishing, MCP-based
    tooling).
  - Front-end work on AI-powered applications — chat interfaces,
    agentic UIs, streaming responses, or tool-use surfaces.
  - Background in enterprise software, telecommunications, or
    B2B tech.
  - Experience building developer documentation sites, API
    reference UIs, or interactive playgrounds (Docusaurus,
    Mintlify, Nextra, or similar).
  - Familiarity with cloud platforms (AWS, Azure, or GCP).
  - Familiarity with modern web capabilities (PWAs, Server
    Components, edge rendering).
  - Track record of successful product launches.

  *The salary range reflected is a good faith estimate of base
  pay for the primary location of the position. Our
  compensation reflects the cost of labor across several U.S.
  geographic markets, and we pay differently based on those
  defined markets. The U.S. pay for this position ranges from
  $150,000.00 to $165,000.00 annually. Pay varies by work
  location and may also depend on job -related knowledge,
  skills, experience and abilities of the successful
  candidate. Your recruiter can share more about the specific
  salary range for the job location during the hiring process.

