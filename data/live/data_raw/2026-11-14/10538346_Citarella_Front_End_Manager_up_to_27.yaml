description: |
  Led by dynamic owner Joe Gurrera (and his commitment to
  superior quality) Citarella has grown from a respected NYC
  fish market into a full-scale, Ultimate Gourmet Market with
  locations across New York City, the Hamptons, and Greenwich,
  Connecticut.

  A family-run business, we’re driven by a passion for great
  food. We delight customers with the finest selection of
  fresh seafood, prime, dry-aged beef, chef-prepared
  specialties and handcrafted pastries, international cheeses,
  imported groceries, and more. Join our team of seasoned
  professionals and become a part of the fabric of the New
  York food scene.

  Role and Responsibilities

  As the Front-End Department Manager, you are a key player in
  overseeing and managing all aspects of the cashier
  department including but not limited to; department
  profitability, assisting our guests with urgency and leading
  the team to successfully drive business/sales. Our guest is
  the heart of our business. As the Front-End Department
  Manager, you will be responsible for providing every guest
  with an exceptional shopping experience, listening and
  responding to their needs and being the subject matter
  expert of your department. All Front-End Department Managers
  are required to be hospitality driven, display positive
  energy, be dependable, possess basic math skills and
  excellent communication skills.

  - Protection of company assets.
  - Ensure compliance to company policies and procedures
    including proper handling of all transactions and
    corresponding documentation (i.e. refunds, check approval,
    employee discounts, price overrides and any other
    transactions requiring head cashier/management
  - Always maintain possession of the register key while on
    duty. Including throughout the entirety of all
    transactions that include the use of the key and code
    authorization.
  - Must take full responsibility, and knowledgeable of all
    transactions that require key holder involvement including
    but not limited to voids, refunds of any type, and
    associate discounts.
  - Observe transactions requiring override in their entirety
    (including voids, refunds, associate discounts) for
    accuracy and proper procedure.
  - Timely communication to store management of all issues.
  - Be cognizant to all front-end associate discrepancies
    including frequent/patterned or multiple voids, register
    discrepancies, cash shortage/overage and communicate to
    management immediately.
  - Training and supervision of all front-end associates on all
    front-end policies and procedures.
  - Establish and maintain a professional environment, ensuring
    the best possible experience for customers and associates.
  - Scheduling to ensure proper coverage at the front end
    (including proper daily break coverage)
  - Maintain neat, clean, organized, and safe front end area.
  - Returns and credits are handled daily according to company
    procedures.
  - Duties assigned by Manager on Duty.
  - Drive guest engagement programs to meet and exceed the
    Ultimate Gourmet Experience.
  - Exhibit professionalism when handling all guest relations.
    Including effective service recovery when needed.
  - Direct and supervise all front end and assigned department
    activities including but not limited to; monitoring guest
    traffic, and service level, coordinate and implement front
    end and service program, ensure cleanliness, overall
    safety of Front End, monitor inventory, order Front End
    supplies.
  - Establish and maintain a professional environment, ensuring
    the best possible experience for guests and associates.
  - Assist with interviewing and hiring of department/store
    associates.
  - Monitor overall department performance. Communicate to
    management when employment status changes are warranted
    and/or corrective actions.
  - Drive results through motivation, team building and follow
    up of staff members.



  Minimum Requirements:

  - Minimum of 3 years’ experience managing a front-end/cashier
    department in a grocery store environment.
  - Flexibility schedule including nights, weekends and
    holidays.
  - Ability to perform physical requirements of job including
    standing during scheduled hours, kneeling, stooping, using
    stairs, lifting, push and pull items of usually 20-50
    pounds.
  - Ability to work in a temperature-controlled environment.
  - Ability to show initiative, work with limited supervision,
    and are self-motivated.
  - Ability to hire, train, inspire and develop a team.
  - Team builder and brand ambassador.
  - Excellent interpersonal communication and organizational
    skills.
  - Proficient computer knowledge and skills; Microsoft Outlook,
    Word, Excel



  IN RETURN, WE OFFER!

  Competitive Wages, Medical/Dental/Vision/ Company sponsored
  life insurance benefits, Flexible Spending Accounts,
  Employee Discounts, Paid Time Off, 401k Retirement Savings
  Plan with Company Match!

  Citarella is an Equal Opportunity Employer (EOE)
