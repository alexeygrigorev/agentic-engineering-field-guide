description: |
  Senior Data Scientist - Full Stack

  Please note visa sponsorship is not currently available for
  this position.

  We are looking for a Senior Full Stack Data Scientist to
  join our Data & Analytics team at ClearScore. Data
  Scientists play a key role in our business, driving strategy
  and decision-making at all levels, which ultimately benefits
  our users, partners, and other teams across the
  organisation. We are seeking a proactive, outcomes-oriented
  individual, ready to take on broad ownership of a range of
  initiatives, to join our growing Global Targeting team.
  Working to enhance the ClearScore user experience through
  improved dynamic content targeting and prioritisation, you
  will take end-to-end ownership of data science and machine
  learning solutions across a variety of use cases, business
  areas, and markets. You’ll bring the knowledge and expertise
  required to evaluate transformative new approaches in
  machine learning and AI against our current implementations,
  applying your judgement and craft to incorporate these where
  they can add real value. Your contributions will directly
  support the Global Targeting mission, enabling the
  organisation to realise its overall strategy and goals.

  ClearScore is both a free credit score and report service
  and the UK's leading consumer credit marketplace. ClearScore
  has an amazing analytical community which includes Data
  Analysts, Scientists and Engineers. The community works
  collaboratively, sharing knowledge, tools, and best
  practice, to ensure a landscape in which team members can
  develop their full potential and deliver maximum positive
  business impact.

  What you’ll be doing

  - Leading the end-to-end development of data science and
    machine learning solutions - from business concept through
    to impact evaluation - to enable a better user experience
    through data-driven Targeting
  - Working closely with cross-functional stakeholders to shape
    how Data Science and the broader Targeting initiative can
    effectively support business needs to drive maximum impact
  - Keeping our modelling practice at the cutting-edge: building
    a deep understanding of new developments in ML and AI,
    like Foundation Models, testing these rigorously against
    our production systems, and leading our adoption of those
    that prove their value to drive better outcomes for our
    users and business
  - Helping to set the quality bar for what we put into
    production: scrutinising data, features and model
    behaviour, and surfacing problems in our data and
    processes before they reach our users
  - Identifying and implementing improvements and optimisations
    in our model development and management processes, driving
    more efficient and standardised ways of working, leading
    by example in what you deliver
  - Driving the strategic utilisation of model outputs for
    decision making, working with the Global Targeting squad
    to use model outputs to change what users see

  What you’ll need to succeed in the role

  - A self-starter mindset: curious, collaborative, and
    committed to continuous learning - including the adoption
    of new tools as they emerge. You stay abreast of advances
    in ML and AI, demonstrating the judgement required to
    assess when newer techniques will outperform conventional
    ones and when they won’t
  - A desire to deeply understand a problem and its importance
    to the business before attempting to solve it, and being
    comfortable proactively seeking that context rather than
    waiting for it
  - A strong ability to think critically about, and reason
    concisely with, data. A drive to understand our users,
    products, and how users interact with them, and to build
    an advanced knowledge of our data assets and how these
    connect to our users’ financial wellbeing through the
    product experience
  - Advanced Python and SQL skills, and a strong understanding
    of dbt and Analytics Engineering for feature engineering.
    In-depth knowledge of varied statistical and machine
    learning techniques. You're capable across the full model
    lifecycle, including how models get deployed and
    maintained effectively in a production environment
  - Demonstrable experience of using business-domain knowledge
    to drive model development or derive insights from data
  - The ability to explain the key findings from complex
    analysis and modelling exercises to both technical and
    non-technical audiences. You feel at home interacting with
    stakeholders from across different specialisms around the
    organisation

  We’d especially love to hear from you if you have

  - Experience using AI tools as part of your everyday workflow,
    with the judgement to know what to trust, what to verify,
    and when the output isn't good enough. We’re increasingly
    adopting AI tools as part of our development cycle, so an
    interest and knowledge of harnessing these effectively
    would be highly valued
  - Hands-on experience developing and delivering solutions
    based on emerging ML/AI approaches in Deep Learning, such
    as representation learning, sequence models, transformer-
    based modelling, or foundation models
  - Experience developing or working on real-time / near real-
    time inference solutions and the infrastructure to support
    them
  - Experience working with and deploying solutions into
    Databricks
  - Experience working in a product-focussed environment,
    partnering closely with cross-functional teams to build
    and iterate quickly
  - A good understanding of consumer lending and the key drivers
    of credit and affordability strategies, as well as
    familiarity with credit bureau data and its effective
    utilisation for building predictive ML models
  - A postgraduate degree or equivalent qualification in a STEM
    field

  Why ClearScore?

  ClearScore is the UK's #1 credit score and report app. We
  are also present in South Africa, Australia and Canada, with
  more than 20 million users globally and growing fast.
  Someone joins ClearScore every 20 seconds. We have
  established relationships with over 50 of the main lenders
  in the U.K., and have been a trusted tool for customers to
  manage their credit and make better financial decisions.

  Since October 2016 we have helped 1.8 million users take out
  a new credit card or loan. We are user-centric at our core
  and we believe in leveraging technology to enable positive
  financial choices. We are design-led and data-driven and we
  embed these behaviours in everything we do.

  Our company culture is a fundamental part of all we have
  achieved. We believe in hiring smart, driven, passionate and
  diverse people who are keen on having a real impact in our
  organisation. We trust you to manage your own time so we
  offer flexible work and no fixed desk hours. We don't
  micromanage and we believe in measuring outcomes rather than
  effort. We have an inclusive culture where all, regardless
  of seniority, are encouraged to contribute with their ideas,
  look after their wellbeing and actively seek opportunities
  for career growth.

  If you feel like this could be the place for you, apply and
  our Talent team will be happy to share more.

  Benefits:

  - 25 paid holidays and a “duvet day” on your birthday
  - Hybrid Work Environment
  - Private health and dental cover - including mental health
    support through Bupa
  - GP office visits
  - Life assurance scheme
  - Up to 6% matched pension
  - Regular Lunch and Learns with guest speakers
  - Dog-friendly office
  - Daily breakfast and free snacks
  - Access to discounts via Cobens Extras
  - Free sports and social clubs
  - Continued investment into learning and development
  - Leadership-led training
  - In-house psychotherapist
  - Financial coach to help you plan and achieve your goals
  - No clock-watching culture
  - Generous maternity and paternity plans
  - Culture and inclusion representatives
  - Transparent pay structure and a career growth plan

  Equal Opportunities

  ClearScore is committed to providing equal employment
  opportunities to all qualified individuals. As an equal
  opportunity employer, we are able to make reasonable
  adjustments to accommodate individuals with disabilities
  during the recruitment and selection process. If you require
  accommodation, please inform us in advance, and we will work
  with you to meet your needs.

  Our Hybrid Model



  We embrace a dynamic hybrid work environment that balances
  flexibility with collaborative in-person experiences. Our
  approach is designed to foster innovation, team connection,
  and individual productivity.

  - Levels 1-5: Minimum 2-3 days per week in-office
  - Level 6 and above: Minimum 3 days per week in-office

  We believe this structure offers the best of both worlds -
  the flexibility of remote work and the synergy of face-to-
  face collaboration. Our office days are carefully
  coordinated to maximise team interactions and learning/
  mentorship opportunities.

  What This Means for You:

  - Flexibility to manage your work and life
  - Dedicated in-office days for team building and collaborative
    projects
  - Office facilities (with plants!) designed for productive
    interactions
  - Clear expectations and support for maintaining our hybrid
    schedule

  We’re committed to creating an inclusive environment that
  accommodates diverse needs while maintaining our
  collaborative culture. Join us in shaping the future of
  work!

  Note: While we offer flexibility, commitment to our hybrid
  schedule is an important aspect of our team culture and
  performance expectations.

  Inclusion Policy

  We are always looking for talented individuals to join
  ClearScore. We are an equal opportunity employer. We
  celebrate diversity and are committed to creating an
  inclusive environment for our people. Please see our People
  Policy Notice at https://www.clearscore.com/people-notice.
