description: |
  Orion Innovation is a premier, award-winning, global
  business and technology services firm.  Orion delivers game-
  changing business transformation and product development
  rooted in digital strategy, experience design, and
  engineering, with a unique combination of agility, scale,
  and maturity.  We work with a wide range of clients across
  many industries including financial services, professional
  services, telecommunications and media, consumer products,
  automotive, industrial automation, professional sports and
  entertainment, life sciences, ecommerce, and education.

  Summary:

  We are seeking a highly experienced Senior Full Stack .NET
  Developers. This role involves leveraging expertise in C#,
  .NET, Angular, and cloud technologies like Azure to deliver
  innovative solutions that align with business goals. The
  focus is on ensuring seamless project execution while
  maintaining high-quality standards.

  Key Responsibilities:

  - Lead the design, development, and implementation of full-
    stack applications using .NET and Angular.
  - Collaborate with cross-functional teams to gather and
    analyze requirements, ensuring technical feasibility.
  - Ensure the security, performance, and scalability of
    applications deployed on Azure cloud solutions.
  - Implement best practices for code versioning and
    collaboration using Git.
  - Manage databases effectively with SQL Server to support
    application development efforts.
  - Provide technical guidance and mentorship to team members,
    fostering a culture of excellence.
  - Stay updated on emerging technologies to enhance team
    capabilities and project outcomes.

  Required Skills and Experience: Mandatory:

  - Proficiency in C# and .NET framework.
  - Strong expertise in Angular for frontend development.
  - Solid experience with Azure cloud services.
  - Hands-on knowledge of Git for version control.
  - Experience with SQL Server for database management.
  - Minimum 8 years of overall development experience in
    relevant technologies.

