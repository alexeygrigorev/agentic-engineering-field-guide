description: |
  Why loveholidays?

  We’re on a mission to open the world to everyone, giving our
  customers unlimited choice, unmatched ease and unmissable
  value for their next getaway.

  Our trailblaze together culture is what drives our success,
  powered by our people and the way they work. Using
  progressive technology, we drive cutting-edge innovation and
  improve how our customers discover, book and experience
  their holidays. You’ll have the opportunity to accelerate
  your growth through meaningful challenges, new experiences
  and the freedom to shape your own path. You’ll create impact
  for our future by taking ownership, contributing to shared
  goals and helping shape what comes next, all as part of our
  enhanced international community of talented, collaborative
  and passionate teams.

  Why Technology at loveholidays?

  Technology at loveholidays underpins our vision to become
  the most loved OTA in Europe. We drive cutting-edge
  innovation and technical excellence to futureproof the
  business. Our systems process trillions of daily holiday
  offers, we deploy over a thousand times a month, serving
  thousands of requests per second. This is where you can
  accelerate your growth by solving complex challenges and
  broadening your skillset.

  Join us to create impact for our future in an exciting new
  chapter, owning your success and contributing to shared
  goals. We actively talk about technology and adhere to our
  key technology principles that have guided us this far. We
  are growing and have ambitious plans to expand across
  Europe, employing the best minds and technology to let us do
  this.

  The impact you’ll have:

  You’ll join our Web Infrastructure team, reporting to the
  Senior Lead Engineer. The team builds the shared foundations
  behind loveholidays’ customer experiences, spanning our web
  and app platforms, design system, edge computing and
  experimentation.

  You’ll help shape these foundations by:

  - Building platforms that enable market-leading web
    performance and accessibility by default, giving product
    teams the foundations to deliver fast, inclusive customer
    experiences.
  - Evolving our design system to help engineers, designers and
    AI agents deliver consistent, high-quality experiences.
  - Improving developer experience and reliability through
    faster builds, actionable error reporting and tools that
    make systems easier to develop and operate.
  - Owning problems from discovery through delivery by working
    directly with internal customers to identify priorities
    and validate that solutions meet their needs.

  Your skillset:

  - Strong frontend engineering and performance skills – you
    have deep experience with a modern frontend framework (we
    use Preact), TypeScript and CSS, and can diagnose
    performance bottlenecks and measure how architectural and
    implementation changes affect Core Web Vitals and real-
    world performance.
  - Experience building shared frontend foundations – you’ve
    built and maintained robust and reusable design systems
    and developer tooling – managing governance, compatibility
    and providing clear documentation and migration paths for
    adopting teams.
  - Accessibility engineering – you have experience embedding
    automated accessibility checks into component tests and
    CI, preventing regressions, and complementing automation
    with keyboard and assistive technology testing.
  - Infrastructure ownership – you have experience operating
    production infrastructure through infrastructure as code
    tools, such as Terraform, with attention to safe changes,
    observability and reliability.
  - Building systems for AI agents – you understand how clear
    interfaces, reusable capabilities, machine-readable
    context and automated validation help agents work reliably
    within defined constraints.
  - Product engineering mindset – you’re comfortable with
    ambiguous problems, can challenge proposed solutions and
    weigh trade-offs, and use research, adoption metrics and
    performance data to guide decisions.

  The interview journey:

  - TA screening - 30 mins
  - 1st stage interview with the Hiring Manager - 45 mins
  - Tech challenge - you can choose between a live and take home
    option
  - Final stage - consisting of discussions around three key
    areas

  Perks of joining us:

  - Company pension contributions at 5%.
  - Individualised training budget for you to learn on the job
    and level yourself up.
  - Discounted holidays for you, your family and friends.
  - 25 days of holidays per annum (plus 8 public holidays)
    increases by 1 day for every second year of service, up to
    a maximum 30 days per annum.
  - Ability to buy and sell annual leave.
  - Cycle to work scheme, season ticket loan and eye care
    vouchers.

  Our commitment to inclusion

  At loveholidays, we focus on creating an inclusive
  environment where everyone can contribute, grow and succeed.
  We value the different perspectives, experiences and ideas
  each person brings, because they help us work better
  together, challenge our thinking and make stronger
  decisions.

  As we continue to grow and evolve, we want everyone to feel
  supported and able to do their best work. We’re also
  committed to making our hiring process accessible, so please
  let our Talent Acquisition team know if you need any
  adjustments at any stage.
