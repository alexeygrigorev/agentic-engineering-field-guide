description: |
  OVERVIEW

  This position can be based out of San Francisco, New York,
  or remote (we accept candidates from the following states:
  AZ, CA, CO, CT, FL, GA, HI, IL, MA, MI, MN, MT, NC, NJ, NV,
  NY, OH, OK, OR, PA, TN, TX, UT, WA, WI).

  We're looking for Full-Stack Software Engineers who want to
  help businesses of any size move money worldwide. You will
  contribute to APIs, banking infrastructure and financial
  workflows that ensure our customers can adopt and scale with
  Modern Treasury.

  Whereas most SaaS companies move data, we move money. Our
  systems must scale to high volumes, with high accuracy and
  high reliability. Engineers at Modern Treasury design
  thoughtful design APIs, implement resilient processes, and
  choose infrastructure that prioritizes fault tolerance and
  long-term maintainability over chasing latest trends.

  Our application is powered by Ruby on Rails, Postgres, Redis
  and ParadeDB. As of today, we are on the latest version of
  each technology. Github and typical CI/CD automation is used
  for deployments to AWS. While engineers have specialties,
  engineers can easily contribute to all layers and components
  of the application without friction.

  ABOUT MODERN TREASURY

  Modern Treasury provides trusted infrastructure for money
  movement. The company helps teams launch and scale payment
  experiences in days, not months. With best-in-class
  developer tools and a single API for fiat and
  stablecoins—plus built-in compliance, ledgering, and
  reporting— Modern Treasury enables businesses to move money
  instantly, reliably, and at scale.

  $750T+ moves across the bank rails each year. However,
  despite this incredible volume, the technology powering
  these rails has not kept pace with digital transformation in
  other industries. With the significance and scale of this
  opportunity in mind, Dimitri, Matt, and Sam founded Modern
  Treasury in 2018 to support the world's largest industries
  and money movers. Today, the company has grown to serve
  companies in the economy's most important sectors, from
  real-estate, healthcare, and insurance, to education and
  financial services.

  WHAT YOU’LL DO

  - Build end-to-end features individually or in small teams
  - Iterate and ship code frequently
  - Participate in maintenance and ownership of a core component
  - Learn the payments space and shape projects before
    development
  - Be mentored and eventually become a mentor

  MINIMUM REQUIREMENTS

  - 2+ years of professional software engineering experience
  - Interested in full-stack development, including backend
    jobs, DBs and frontend UX
  - A history of collaborating with a team to ship a major
    feature

  PREFERRED REQUIREMENTS

  - Experience with Ruby on Rails, React & Postgres
  - Experience with financial software for banks, credit card
    processing or cryptocurrencies.
  - Ability to thrive in autonomous, engineer driven environment

