description: |
  We are Rokt.  We are the global leader in ecommerce, on a
  mission to make every transaction more relevant. We’ve built
  our business around the Transaction Moment™, the span from
  cart to confirmation where customer attention and intent
  peak, and where more than 90% of a business's ancillary
  revenue potential sits untapped.

  The Rokt Brain leverages advanced machine learning to
  determine the next best action for every customer in real
  time across the Rokt Network, powering 13 billion
  transactions a year for brands like: Live Nation, Fanatics,
  Macy's, AMC Theatres, PayPal, Uber, Hulu, Albertsons and
  more. Since 2012 we've grown from a Sydney startup, to a
  $3.5B company with 700+ Rokt'stars across eight offices and
  15 markets, sustaining a Compound Annual Growth Rate of 40%+
  for over a decade. At Rokt, we practice transparency in
  career paths and compensation, which is why we have a well-
  defined career ladder with clear compensation and career
  paths based on competency and ability. Compensation for this
  role is ~$50.48/hour. In addition, you will receive a
  generous technology allowance to spend on a Macbook Pro M5 +
  accessories: yours to keep after the residency.

  If you secure a full-time offer post-residency, total target
  compensation will be $127,000, including a fixed annual
  salary of $120,000, employee equity plan grant (RSUs), and
  world-class benefits.

  This is the expected pay for the role. Final compensation is
  determined by the level assessed through the interview
  process and based on how your experience and skills map to
  our career ladder.

  About the role:

  The Rokt Residency is an 18 week, full-time, paid early-
  career program for software engineers working out of our
  office in New York City . This cohort of residencies will
  run from January 12th 2027 through to May 14th 2027.
  Residents will have the opportunity to receive full-time
  offers to join Rokt as Builders on the completion of their
  residency. How your future team uses AI:

  We are an AI-first company. We’re a team of builders. That
  means the person who spots the problem is usually the person
  who fixes it, and “someone should build a tool for that” is
  treated as a volunteer sign-up sheet. We use AI and
  automation tools to move faster, and expect you to figure
  things out when the path isn’t obvious. If you prefer
  established processes and clearly defined lanes, you
  probably won’t like it here. Rokt Builders use AI coding
  agents to write, test, and review code, which means a small
  team ships what used to take a large one. Teams use AI to
  investigate production issues, generate test coverage, and
  prototype new features in hours instead of weeks. Residents
  get the same enterprise AI tools from day one and are
  expected to use them to build faster.

  How you will contribute:

  - Build and deploy production services and features on a Rokt
    engineering team, from prototype through to release.
  - Use AI tools and automation to speed up coding, testing, and
    deployment.
  - Find performance bottlenecks and use data to improve systems
    that run at the scale of billions of transactions.
  - Work with product managers, designers, and senior Builders
    to ship features that drive revenue for Rokt and its
    partners.
  - Deliver measurable contribution to your team by the end of
    the Residency.

  Requirements

  What you bring:

  - Software engineering experience, including internships,
    personal projects, open-source work, or hackathons.
  - Strong computer science fundamentals: data structures,
    algorithms, and how to write clean, tested code
  - Proficiency in at least one programming language, such as
    Python, Go, TypeScript, Java, or C#
  - Evidence that you have built and shipped something real,
    such as a project, product, or tool that other people use
  - Hands-on experience using AI coding tools to build software
  - Ability to work in fast-paced teams
  - Constantly looking for new ways to improve and accelerate a
    function
  - Availability to work full time in the office in New York,
    for the full 18 weeks.

  Benefits

  About Rokt’stars:

  We move fast and decide with incomplete information, because
  a good decision this week can lead to a perfect one next
  quarter. We work as one team, which means the best idea wins
  regardless of who raised it or what level they are. We hire
  people who are brilliant and humble and who are obsessed
  with making the customer successful.

  Benefits from Day One

  - Every employee has enterprise access to leading AI tools
    with generous usage limits, building AI fluency as a core
    skill.
  - Catered lunch every day and a fully stocked pantry
  - Dog-friendly offices so you can bring your best friend to
    work
  - Generous Required Technology Allowance

  Permanent employment benefits:

  - Fully funded insurance (Medical, Dental, Vision)
  - Dollar-for-dollar 401K matching plan (up to 4% of fixed
    annual salary)
  - Fully funded life, short term, and long term disability
    insurance
  - Equity in a profitable, fast-growing company approaching $1
    Billion in revenue
  - Monthly Wellness and Cell Phone Allowances
  - Quarterly performance reviews for most roles, so feedback
    and promotion decisions don’t wait
  - Extra leave (bonus annual leave, sabbatical leave etc.)
  - Work in the office with your team at least 4 days a week,
    because we believe we are better together.

  We believe we’re better together. Most teams are in the
  office minimum 4 days per week.

  At Rokt, we choose to create a company that is as diverse
  and inclusive as the world we live in by attracting, growing
  and keeping the best talent. Equal employment opportunities
  are available to all applicants without regard to race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  We build with AI every day, and our hiring process is no
  exception. We use AI tools to help review applications and
  assess qualifications throughout the recruiting process. AI
  helps our Talent team move faster and focus on what matters
  most: getting to know you. Hiring decisions at Rokt are made
  by people.

  Rokt only contacts candidates from @rokt.com addresses. We
  never request payment, bank details, or identity documents
  before a written offer, and we never interview solely over
  chat apps. Verify any role at rokt.com/careers if you're
  unsure.

  If this sounds like a role you’d enjoy, apply here, and
  you’ll hear from our recruiting team.

  Note: The first stage of the recruitment process for this
  role is to complete a 15-minute online aptitude test, which
  will be sent out to your application email. Successful
  candidates will be contacted to discuss next steps.
