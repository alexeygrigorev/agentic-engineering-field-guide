description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role: CrowdStrike is looking for a Software
  Development Engineer II to join our growing Production
  Services team. As a software engineer, you will contribute
  to the design and creation of tools to enhance the
  automations that deploy and manage CrowdStrike's cloud-based
  infrastructure. The candidate will play a role in
  implementing and supporting a stable yet flexible production
  environment. If you are interested in working on a high-
  performing team with interesting problems to solve, this is
  the job for you!

  As a software engineer, you will contribute to the research,
  development, and deployment of systems that power cost
  attribution and cloud efficiency across the CrowdStrike
  ecosystem. The ideal candidate will play a role in not only
  authoring systems but also creating AI agents and models
  that will help us multiply our impacts on the bottom-line
  for CrowdStrike. If you are interested in working on a high-
  performing team applying your knowledge and expertise to
  real-world cost optimization and financial accountability
  problems, this is the job for you!

  What You'll Do:

  - Be an energetic self-starter with the ability to take
    ownership and be accountable for deliverables, both
    individually and as part of a team
  - Collaboratively brainstorm, define, and build software
    solutions
  - Work with internal business partners and senior engineers to
    analyze requirements and craft elegant, robust, and
    reliable solutions to technical problems
  - Contribute to raising the technical IQ of the team by
    staying curious and sharing new technologies & tricks with
    others
  - Contribute to architectural and automation strategies under
    the guidance of senior team members
  - Report regularly on the status of assigned projects

  What You'll Need:

  - US Citizen or Green Card holder
  - 5+ years of experience
  - Excellent written and verbal communication skills
  - Experience working in a production environment and
    developing applications with cross-functional teams
  - Experience writing systems/applications for automation,
    tools, dashboards, and alarms with the Go programming
    language or other object-oriented languages
  - Familiarity developing and integrating APIs using REST,
    GraphQL, or SOAP
  - Familiarity designing schemas and writing SQL queries for
    RDBMS such as Postgres or MySQL
  - Hands-on experience working with LLMs, and building and
    deploying AI agents in production environments
  - Eagerness to learn from and collaborate with senior
    engineers
  - Demonstrate a passion for learning new systems and
    methodologies
  - Solid attention to detail and the ability to make good,
    timely decisions
  - Experience writing automated unit/acceptance tests
  - Strong focus on security when developing or reviewing code
    or systems
  - Must work effectively and professionally with cross-
    functional groups as part of a worldwide team

  Bonus Points:

  - Understanding of container systems such as Docker and
    Kubernetes
  - Experience with CI/CD systems such as GitLab CI/CD, Jenkins,
    or Bamboo
  - Exposure to authentication or authorization systems
  - Exposure to tracing and metrics within systems using
    OpenTracing and Prometheus
  - Exposure to large-scale bare-metal hardware environments
  - Experience with machine learning (model development,
    training, or deployment)

  #LI-LY1

