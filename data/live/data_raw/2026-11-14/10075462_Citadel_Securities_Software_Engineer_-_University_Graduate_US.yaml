description: |
  Job Description At Citadel Securities, our engineers work in
  small teams to turn the best ideas into high-performing and
  resilient technology. With short development cycles, work
  rapidly goes into production. As an engineer, you can create
  system architectures, develop platforms and build web
  frameworks. You'll have access to state-of-the-art tools and
  apply innovative techniques including distributed computing,
  natural language processing, machine learning and more. Your
  Objectives:

  - Create technological tools that bring trading strategies to
    life
  - Develop high-performance, large data research platforms
  - Work in small teams to build the future of finance

  Your Skills & Talents:

  - Bachelor's, master's or PhD in Computer Science, Computer
    Engineering or related fields
  - Exceptional programming and design skills
  - Strong analytical skills and familiarity with probability
    and statistics
  - Ability to communicate effectively in a collaborative,
    complex and highly technical team environment
  - Intellectual curiosity and passion for solving challenging
    problems using technology

  Opportunities available in Miami and New York. In accordance
  with applicable law, the base salary range for this role is
  $235,000 to $300,000. In addition, the employee who fills
  this role will be eligible to participate in a discretionary
  incentive compensation program, as well as a wide array of
  benefit programs, such as medical and life insurance,
  retirement and tax-free savings plans, and access to other
  healthcare programs. About Citadel Securities Citadel
  Securities is a technology-driven, next-generation global
  market maker. We provide institutional and retail investors
  with world-class liquidity, competitive pricing and seamless
  front-to-back execution in a broad array of financial
  products. Our teams of engineers, traders and researchers
  harness leading-edge quantitative research and the
  accelerating power of compute, machine learning and AI to
  power our analytics and tackle the market's and our clients'
  most critical challenges. Together, we are forging the
  future of capital markets. For more information, visit
  citadelsecurities.com .
