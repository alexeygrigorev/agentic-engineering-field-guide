description: |
  Are you ready to make a difference and shape the future of
  technology? At JPMorganChase, you’ll be part of a dynamic
  team that thrives on innovation and collaboration. You’ll
  have the opportunity to grow your career, expand your
  skills, and work on projects that matter. We value your
  expertise and encourage you to push boundaries as you help
  deliver market-leading products. Experience a culture that
  celebrates diversity, inclusion, and respect.

    As a Senior Lead Software Engineer in the PTT team, you
  will play a pivotal role in enhancing, building, and
  delivering trusted technology products in a secure, stable,
  and scalable way. You will leverage your deep technical
  expertise and problem-solving skills to address challenges
  across multiple technologies and applications. You will help
  shape the team culture, drive business impact, and
  contribute to our engineering community. Your work will
  influence product design, application functionality, and
  technical operations.

  Job Responsibilities:

  - Provide technical guidance and direction to support business
    and technical teams, contractors, and vendors
  - Develop secure, high-quality production code and review and
    debug code written by others
  - Drive decisions that influence product design, application
    functionality, and technical operations
  - Serve as a subject matter expert in one or more areas of
    focus
  - Advocate firmwide frameworks, tools, and practices of the
    Software Development Life Cycle
  - Influence peers and project decision-makers to adopt
    leading-edge technologies
  - Contribute to a team culture of diversity, opportunity,
    inclusion, and respect

  Required Qualifications, Capabilities, and Skills:

  - Formal training or certification in software engineering
    concepts
  - Hands-on experience in system design, application
    development, testing, and operational stability
  - Advanced working experience with Java, Spring Boot, React,
    and Kubernetes
  - Proficiency in automation and continuous delivery methods
  - Skilled in all aspects of the Software Development Life
    Cycle
  - Advanced understanding of agile methodologies, including
    CI/CD, application resiliency, and security
  - Demonstrated proficiency in software applications and
    technical processes within a technical discipline (such as
    cloud, artificial intelligence, machine learning, or
    mobile)
  - In-depth knowledge of the financial services industry and IT
    systems
  - Practical cloud native experience

  Preferred Qualifications, Capabilities, and Skills:

  - Experience with Java and Oracle
  - Familiarity with messaging platforms such as RMQ and Kafka
  - Expertise in Kubernetes
  - Proficiency in ReactJS and JavaScript
  - Functional knowledge of FX or Dervis Settlements domain

  If you’re looking for a place where your skills are valued
  and your contributions make a real impact, join us at
  JPMorganChase and be part of a team that’s redefining what’s
  possible.

