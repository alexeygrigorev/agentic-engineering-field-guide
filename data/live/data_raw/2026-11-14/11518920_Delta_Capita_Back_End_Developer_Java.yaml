description: |
  Location: London or Ipswich, UK (Hybrid) Employment Type:
  Permanent, Full-Time

  About Mach:

  MACH is Delta Capita's proprietary Distributed Ledger
  Technology (DLT) and workflow orchestration platform,
  developed to help financial institutions modernise post-
  trade, collateral, regulatory and operational processes. As
  part of Delta Capita's Technology & Solutions business, MACH
  combines blockchain, workflow automation and enterprise
  integration capabilities to deliver scalable solutions to
  global financial services clients.

  Job Description:

   As a Back End Developer at MACH, you will be instrumental
  in designing and implementing the backend architecture for
  blockchain and Distributed Ledger Technology (DLT) solutions
  aimed at financial services clients. Working closely with
  blockchain architects, front-end developers, and other
  stakeholders, you will develop secure, scalable, and high-
  performance backend systems that enable seamless integration
  with MACH’s cutting-edge solutions. Expertise in backend
  development, API design, and blockchain technologies will be
  critical to your success.



  Responsibilities include:

  - Design, develop, and maintain robust backend systems for
    MACH’s blockchain/DLT solutions.
  - Build and optimise APIs, microservices, and other system
    integrations to support workflow orchestration, front-end
    applications and blockchain interactions.
  - Work closely with blockchain architects to implement smart
    contract integration and other blockchain-specific backend
    components.
  - Ensure backend systems meet performance, scalability, and
    security requirements.
  - Develop database schemas, manage migrations, and optimise
    queries for efficient data storage and retrieval.
  - Troubleshoot and resolve backend issues to maintain system
    reliability.
  - Implement and maintain CI/CD pipelines to streamline
    development workflows.
  - Stay informed about emerging trends in backend and
    blockchain development to ensure MACH remains at the
    forefront of innovation.
  - Collaborate with cross-functional teams to ensure a seamless
    user experience and end-to-end system functionality.
  - Document technical specifications, processes, and system
    designs to maintain clear and comprehensive records.

   As an experienced Back End Developer, you will have:

  - Strong experience in backend Java development.
  - Proficiency in developing and maintaining RESTful APIs and
    microservices architectures.
  - Experience working with databases and optimising query
    performance.
  - Familiarity with authentication, encryption, and other
    security practices for backend systems.
  - Hands-on experience with containerisation tools (e.g.,
    Docker) and orchestration platforms (e.g., Kubernetes).
  - Strong problem-solving skills and the ability to
    troubleshoot complex backend issues.
  - Excellent communication skills and a collaborative approach
    to working in cross-functional teams.
  - A proactive mindset with the ability to deliver high-quality
    solutions in a fast-paced environment.

  Desirable:

  - Understanding of blockchain/DLT platforms (e.g., Ethereum,
    Hyperledger, or Corda) and their backend integration.
  - Hands-on experience with blockchain-specific backend
    frameworks or libraries (e.g., Web3j).
  - Familiarity with financial services applications and
    industry requirements.
  - Experience in implementing event-driven architectures and
    message brokers (e.g., Kafka, RabbitMQ).
  - Knowledge of DevOps practices and tools for infrastructure
    automation and monitoring.
  - Understanding of Agile development methodologies and best
    practices.
  - Experience with Camunda and Activiti



