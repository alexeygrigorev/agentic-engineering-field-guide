description: |
  About On Me

  Humans have given each other gifts since the dawn of time.
  For gratitude, for friendship, and for love. In today’s
  society, gifting has become harder and much more wasteful,
  as it’s become nearly impossible to know exactly what
  someone wants, when you just want to show that you care.

  On Me is revolutionizing gifting by rebuilding it for the
  mobile and Instagram era. Traditional gift cards are
  impersonal and rigid, usually sold by an old and wealthy
  megacorp. We make it easy to send a personalized, media-rich
  gift that’s spendable across brands, fits someone’s hobbies,
  and drops straight into their mobile wallet for tap‑to‑pay.
  Check out our live experience at onme.com.

  We’re a small startup from Google, Apple, and Stripe moving
  fast on a massive category and have raised $8M from top‑tier
  investors like NFX, Lerer Hippeau, Focal VC, and Mastercard.
  Since launching in November 2024, On Me has been featured in
  Tech Crunch, Fortune, and The Wall Street Journal. In 2025,
  we sustained over 40% growth month over month throughout the
  year, and the trend shows no sign of stopping.

  In 2026, we're doubling down on making every gift feel
  magical end‑to‑end and building an amazing consumer product.
  You'll help us build world-class iOS and Android apps that
  people love. If you want meaningful ownership, clear
  consumer product impact, and the chance to set engineering
  standards early, this is it.

  Who you are

  You're perfect for this role if you're a mobile engineering
  expert who wants to own the native app experience end to
  end. You love crafting polished, performant iOS and/or
  Android apps that delight real users. You care deeply about
  the quality and craft of what you build, and why you build
  it.

  What you’ll do

  As a mobile software engineer, you'll be the fourth engineer
  at a tiny startup, working closely with the whole team to
  design and build the native mobile experiences that power
  our gifting platform. You'll own our iOS and/or Android apps
  from architecture to pixel‑perfect UI, building polished,
  performant experiences backed by clean API integrations.
  Your work will include thinking through user journeys, edge
  cases, loading and error states, and optimizing for
  performance across devices. You'll have end-to-end ownership
  of critical mobile surfaces, driving both product and
  engineering decisions that shape the future of digital
  gifting.

  Key Responsibilities

  - Design, implement, and ship native iOS and/or Android
    features using Swift and Kotlin.
  - Build high-quality, fluid mobile UIs with attention to
    polish, animation, responsiveness, loading, and error
    states.
  - Architect and evolve our mobile codebases for
    maintainability, testability, and performance.
  - Integrate with backend APIs and collaborate on API design to
    support mobile use cases.
  - Collaborate with product, design, and the rest of the team
    to translate fuzzy goals into concrete flows and shipped
    features.
  - Drive mobile architectural decisions to support scaling to
    hundreds of thousands of users.
  - Set up and evolve crash reporting, performance monitoring,
    and release tooling for our mobile apps.

  Requirements

  - 5+ years of experience building and shipping native mobile
    apps.
  - Proficiency in Swift (iOS) and/or Kotlin (Android), with
    strong experience in at least one and working knowledge of
    the other.
  - Strong product and UX mindset: you think from the user's
    point of view and care about end‑to‑end flows, not just
    screens.
  - Deep understanding of mobile platform conventions, lifecycle
    management, and performance optimization.
  - Experience with mobile CI/CD, automated testing, and release
    management (TestFlight, Play Console).
  - Solid understanding of API integration, data modeling, and
    how systems fail in practice.
  - Ability to take ownership of projects from vague problem →
    design → implementation → launch and iteration.
  - Strong communication and collaboration skills in a fast-
    paced startup environment.

  Bonus points

  - Some experience with modern web stacks (React, Next.js,
    TypeScript) — enough to contribute to web features when
    needed.
  - Experience with frontend development for consumer products.
  - Experience with Google Cloud Platform (Cloud Run, Pub/Sub,
    Firestore, BigQuery).
  - Experience working with payments, financial transactions, or
    other high‑value data systems.
  - Experience with mobile wallet integrations (Apple Wallet,
    Google Wallet).

  What We Offer

  - A competitive salary and meaningful early employee equity.
  - A dynamic, collaborative, balanced, and inclusive work
    culture.
  - The opportunity to deeply shape the company’s tech stack and
    engineering culture.
  - Hybrid office in SF with a fully stocked gym, or hybrid
    office in NYC.
  - Unlimited paid time off.
  - Medical, dental, and vision insurance.
  - 401k

  Who You’ll Work With

  At On Me, you’ll join a small, elite team of builders from
  Google and Apple who move fast and care deeply about product
  quality. You’ll collaborate daily with:

  - Darragh Meaney, CEO — Formerly at Google Ads and YouTube
  - Sitar Harel, CTO — Formerly at Google Maps and Google Photos
  - Daniel Li, Founding Engineer — ex-Apple, WWDC session
    speaker and Cornell AppDev alum
  - Neil Shankar, Founding Designer — previously Senior Designer
    at Google and Block (formerly Square)

  We combine big-tech craft with startup speed—and we’re just
  getting started.

  Join Us

  Become a part of On Me’s story, and play an integral role in
  our journey to strengthen relationships through magical
  gifting experiences. If you're ready to contribute to a team
  that values ambition, collaboration, and the joy of tackling
  exciting challenges, we’d love to hear from you.
