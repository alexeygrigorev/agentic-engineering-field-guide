  Are you ready to make your mark?

  About the Role  In this role, you will design and build the
  backend services and capabilities that enable users to
  create, configure, test and deploy. You will work closely
  with frontend engineers, AI/ML engineers, product managers,
  UX designers, and platform teams to bring Agent Studio
  capabilities from concept through production. You will
  develop the services behind agent configuration,
  orchestration, integrations, testing, deployment, and
  lifecycle management while ensuring the platform meets
  enterprise expectations for performance, reliability,
  security, and scalability. This is a great opportunity for
  an experienced backend engineer who enjoys solving complex
  technical problems, building extensible products, and
  creating intuitive ways for users.

  What You Will Be Doing

  • Design, develop, test, and maintain scalable backend
  services and APIs

  • Build capabilities that enable users to create, configure,
  test and deploy.  • Build APIs and service interfaces that
  enable intuitive user experiences and reliable interaction
  between frontend and backend services. • Develop mechanisms
  for managing configurations, versions, state, context,
  tools, permissions, and other runtime components. • Build
  services that enable to securely interact with Intermedia
  products, enterprise applications, APIs, data sources, and
  external services. • Collaborate closely with frontend
  engineers and UX teams to translate complex capabilities
  into intuitive product experiences. • Work with product
  managers to translate customer needs and requirements into
  scalable technical solutions. • Contribute to technical
  design decisions for agent orchestration, configuration
  management, workflow execution, integrations, and supporting
  backend services. • Build capabilities that allow users to
  test, evaluate, troubleshoot, and refine before and after
  deployment. • Develop reliable mechanisms for handling
  execution, errors, retries, timeouts, and other runtime
  conditions. • Design appropriate controls for
  authentication, authorization, permissions, and secure
  access to tools, models, services, and data. • Design for
  scalability, reliability, performance, observability, and
  fault tolerance across services. • Write high-quality,
  readable, testable code that follows established engineering
  standards and best practices. • Participate in code and
  design reviews and contribute to strong engineering and
  quality practices across the team. • Troubleshoot and
  resolve complex issues across backend services, workflows
  and integrations. • Build monitoring, logging, testing, and
  observability into production services to support reliable
  agent execution and product operations. • Collaborate with
  DevOps, and infrastructure teams to support reliable
  deployment and operation. • Stay current with emerging
  technologies and engineering approaches related backend
  engineering, and distributed systems. • Participate in
  continuous improvement initiatives that enhance product
  quality, reliability, developer productivity, and
  engineering efficiency.

  What You Will Bring to the Role

  Bachelor's degree in Computer Science, Software Engineering,
  or a related technical field, or equivalent practical
  experience. • 4–7 years of professional software engineering
  experience, with demonstrated experience developing backend
  applications and services. • Strong proficiency in one or
  more backend programming languages and associated
  frameworks. • Experience designing and developing RESTful
  APIs, microservices, or other serviceoriented applications.
  • Solid understanding of software design principles, data
  structures, algorithms, and distributed systems concepts. •
  Experience working with relational and/or NoSQL databases. •
  Experience building and supporting scalable, reliable
  production applications. • Experience integrating
  applications with internal and external APIs, services, and
  data sources. • Experience designing backend services that
  support complex, interactive product experiences. • Working
  knowledge of cloud platforms such as AWS or Azure and cloud-
  native application architectures. • Familiarity with
  automated testing, CI/CD, source control, and modern
  software development practices. • Understanding of
  monitoring, logging, observability, and production support
  practices. • Strong problem-solving skills and the ability
  to independently investigate and resolve complex technical
  issues. • Ability to work effectively in an environment
  where technologies, product requirements, and technical
  approaches are evolving rapidly. • Strong communication and
  collaboration skills with the ability to work effectively
  across backend, frontend, AI/ML, Product, UX, and platform
  teams. • Working understanding of Agile development
  methodologies and frameworks.

