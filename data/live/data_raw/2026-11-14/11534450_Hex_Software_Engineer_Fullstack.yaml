description: |
  About Hex

  Hex is growing our team of builders on a mission to make
  everyone a data person. Our platform solves key pain points
  with today’s data and analytics tooling, and empowers anyone
  to explore data using natural language, with or without
  code, on trusted context. Thousands of customers like Ramp,
  Figma, Stubhub, Anthropic, and Gamma love Hex for our
  beautiful UI, agentic superpowers, and boundless
  flexibility.

  Hex has raised over $100M from leading investors like
  Sequoia, a16z, Snowflake and Amplify. With office hubs in
  San Francisco and New York, as well as remote team members
  throughout the US and UK, we’re a high-agency team that
  ships fast and has fun doing it. Check out our Intro to Hex
  video and employee handbook to learn more about what it’s
  like to work at Hex.

  About the role

  At Hex we are using AI to reinvent how business users
  interact with data, enabling rich data exploration using
  natural language. Our team of fullstack engineers are
  responsible for the critical workflows that our customers
  use to monitor and govern these AI agents, so that users
  receive answers that are consistently accurate, trustworthy,
  and grounded in truth. And you’ll work across the full stack
  to shape the core user experience of Hex

  Our vision is to be the control center for AI agents within
  the modern data stack, sitting at the nexus of AI
  engineering, workflow design, and data modeling to keep up
  with a fast-moving space.

  What you will do

  As a software engineer you'll work across the full stack,
  from complex user-facing interfaces and browser-based IDEs
  to backend language parsers and SQL generation.

  Specifically, you will:

  - Build observability tools that provide data teams with
    critical control and visibility, surfacing agent
    performance, usage metrics, and conversational audit
    trails for AI-driven insights.
  - Design and implement AI context systems, managing structures
    for diverse inputs such as free-form rules, certified SQL
    queries, and deterministic semantic models.
  - Create robust, full-stack workflows that allow data teams to
    effectively govern, debug, and curate the Hex agent’s
    knowledge, ensuring the reliability and trustworthiness of
    AI-generated answers across the entire organization.
  - Tackle challenging back-end problems related to SQL
    compilation, semantic model development, and serializing
    database context to ensure deterministic and accurate AI
    outputs.
  - Solve complex front-end UX challenges to present a large
    volume of technical information in an actionable, clear,
    and intuitive user interface.

  About You

  - 4+ years of experience as a full-stack software engineer,
    comfortable navigating the entire application stack and
    building full-stack applications with React, Typescript,
    and/or Python.
  - You have a strong understanding of front-end and back-end
    development principles, with an appreciation for both
    elegant user experiences and robust, scalable service
    architecture.
  - You have empathy for data teams and understand the
    challenges involved in answering complex data questions
    and working with modern data warehouses.
  - You are excited by the opportunity to work at the forefront
    of AI development, tackling novel problems in agentic
    reliability, governance, and model curation.
  - You are pragmatic and action-oriented, focused on delivering
    high-quality solutions that directly contribute to
    business-critical features.

  This role will be hybrid (2 days per week in office) based
  out of our NYC or SF offices.

  Our stack

  Our product is a web-based notebook and app authoring
  platform. Our frontend is built with Typescript and React,
  using a combination of Apollo GraphQL and Redux for managing
  application state and data. On the backend, we also use
  Typescript to power an Express/Apollo GraphQL server that
  interacts with Postgres, Redis, and Kubernetes to manage our
  database and Python kernels. Our backend is tightly
  integrated with our infrastructure and CI/CD, where we use a
  combination of Terraform, Helm, and AWS to deploy and
  maintain our stack.

  The salary range for this role is: $198,750 - $295,000

  In addition to our unique culture, Hex proudly offers a
  competitive total rewards package, including but not limited
  to, market-benched salary & equity, comprehensive health
  benefits, and flexible paid time off.

  The salary range shown may be a reflection of additional
  factors such as geographical location and skill
  ranges/levels we’re open to. Placement in the salary range
  will be decided upon completion of the interview process,
  taking into account factors like leaving room for growth,
  internal fairness & parity, your demonstrated skills, and
  the depth of your experience. Our Recruiting team will be
  able to provide more details during the interview process.

  By submitting an application the candidate consents to the
  use of their personal information in accordance with the Hex
  Privacy policy: https://learn.hex.tech/docs/trust/privacy-
  policy.
