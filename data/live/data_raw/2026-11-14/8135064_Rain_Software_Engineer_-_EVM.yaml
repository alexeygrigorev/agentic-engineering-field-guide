description: |
  About the Company

  Rain is the global stablecoin payments platform for
  enterprises, neobanks, platforms, developers, and AI agents.
  Our technology allows partners to move, store, and use
  stablecoins instantly and compliantly through global payment
  cards, rewards, on/offramps, wallets, and cross-border
  rails. As both a Visa and Mastercard Principal Member, Rain
  issues cards that work at more than 175 million merchant
  locations in over 220 countries and territories. Built
  natively for stablecoins and trusted by more than 100
  organizations worldwide, Rain delivers secure, scalable
  infrastructure that makes money move freely and instantly
  around the world.

  You will have the opportunity to deliver massive impact at a
  hypergrowth company backed by some of the top investors in
  fintech, crypto, and SaaS. In January 2026, we closed a
  $250M Series C led by ICONIQ, valuing Rain at $1.95B, with
  Sapphire Ventures, Dragonfly, Bessemer Venture Partners,
  Galaxy Ventures, FirstMark, Lightspeed, Norwest, and
  Endeavor Catalyst also participating. If you're curious,
  bold, and excited to help shape a borderless financial
  future, we'd love to talk.

  Our Ethos

  We believe in an open and flat structure. You will be able
  to grow into the role that most aligns with your goals. Our
  team members at all levels have the freedom to explore ideas
  and impact the roadmap and vision of our company.

  About the Role

  You'll design, build, and maintain EVM smart contracts and
  the backend services that integrate with them, while
  contributing to shared infrastructure across EVM, Solana,
  and Stellar. Our platform powers crypto-backed card products
  — processing high transaction volumes, continuously
  ingesting on-chain data, and navigating the unique
  complexity of each chain, with scalability and reliability
  engineered in from day one.

  What you'll do

  - Own and evolve EVM smart contracts end-to-end — from
    development through deployment and maintenance
  - Build robust, scalable backend services that interact with
    EVM, Solana, and Stellar networks
  - Scale our on-chain infrastructure to support millions of
    users globally — powering transactions, data ingestion,
    and real-time processing
  - Play a central role in shaping the technical and product
    roadmap
  - Drive architectural decisions in a fast-moving, rapidly
    evolving product
  - Ship new capabilities quickly and iteratively to our
    customers

  What we're looking for

  - Deep expertise in the EVM ecosystem, including smart
    contract development, tooling, and best practices
  - Strong proficiency in Solidity
  - Experience with development frameworks such as Hardhat or
    Foundry
  - Solid understanding of smart contract security patterns,
    common vulnerability classes, and gas optimization
  - Experience with Node.js and backend systems
  - 2–10+ years of engineering experience; compensation will be
    calibrated accordingly

  Nice to have, but not mandatory

  - Fintech experience — neobank or card issuing background gets
    extra brownie points
  - Experience deploying across multiple EVM-compatible chains
    (Ethereum, Arbitrum, Base, Polygon, etc.)
  - Familiarity with upgradeable contract patterns and proxy
    architectures

  Things that enable a fulfilling, healthy, and happy
  experience at Rain:

  Unlimited time off 🌴 Unlimited vacation can be daunting, so
  we require Rainmakers to take 10 days minimum for
  themselves.

  Flexible working ☕ We support a flexible workplace – work
  from home, come into an office, or both. We want everyone to
  work in an environment where they're their most confident
  and productive selves. New Rainmakers receive a stipend to
  set up a comfortable home workspace.

  Easy to access benefits 🧠 For US Rainmakers, we cover 95% of
  your health, dental, and vision plan costs and 90% for your
  dependents, plus a 100% company-subsidized life insurance
  plan.

  Retirement goals💡 Plan for the future with confidence. We
  offer a 401(k) with a 4% company match.

  Equity plan 📦 Every Rainmaker gets an equity option plan so
  we all benefit from our success.

  Health and Wellness 📚 High performance begins from within.
  Rainmakers receive a monthly stipend to be used for eligible
  health and wellness spending like gym memberships/fitness
  classes, massages, acupuncture - whatever recharges you!

  In-office meals 🍜 Rainmakers working from the office enjoy
  lunch and dinner on us, covered with a DoorDash credit.

  Team summits ✨ Summits play an important role at Rain. Time
  together helps us build relationships and a common destiny.
  Expect team and company offsites, both domestic and
  international.
