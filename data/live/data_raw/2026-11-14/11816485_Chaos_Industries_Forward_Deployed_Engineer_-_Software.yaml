description: |
  CHAOS Industries is redefining modern defense with
  omniscient systems purpose-built for today’s realities.
  Designed and built by top U.S. military veterans and Silicon
  Valley innovators, CHAOS Industries’ products are powered by
  Coherent Distributed Networks (CDN™), empowering
  warfighters, commercial air operators, and border protection
  teams to act faster, adapt rapidly, and stay ahead of
  evolving threats. In a world where technological threats
  move at unprecedented speed, CHAOS Industries delivers
  advanced sensing and detection solutions that give the
  ultimate advantage: time.

  CHAOS Industries was founded in 2022 and has raised $1B in
  total funding from leading investors including 8VC, Accel,
  and NEA. The company is headquartered in Los Angeles, with
  offices in Washington, D.C., San Francisco, and London. For
  more information, please visit www.chaosinc.com.

  Role Overview

  With a deep understanding of our engineering, technology,
  and customers’ missions, Mission Engineers drive the
  successful deployment of CHAOS capabilities directly into
  the hands of users. Mission Engineers design and implement
  new software from the ground up, integrate and analyse data
  from our edge sensors, apply and develop machine learning
  and AI solutions to real-world challenges, and test and
  refine CHAOS products in customer environments. Throughout,
  Mission Engineers deliver vital feedback to help shape
  product direction and ensure our technology evolves in
  lockstep with real-world mission needs.

  Responsibilities

  - Test, deploy, and troubleshoot CHAOS products in the field.
  - Understand customer workflows and translate them into clear
    product and technical requirements.
  - Collaborate with core engineering teams to prioritise
    feedback, shape product direction, and drive delivery.
  - As an early engineer on a growing team, design and build new
    software products that bridge the gap between CHAOS
    capabilities and customer mission needs.
  - Integrate data from CHAOS edge sensors into customer
    systems.
  - Apply and develop machine learning and AI solutions to
    applied problems, using analysis of sensor data to iterate
    and improve performance.
  - Travel (typically up to 25%, with flexibility for higher
    travel periods when needed) to customer sites and our
    offices in LA & Washington DC.

   Minimum Requirements

  - Strong technical foundation, ideally with a background in
    Computer Science, Software Engineering, Data Science,
    Mathematics, Physics, Aerospace Engineering, or a related
    field.
  - Proven programming skills, with proficiency in languages
    such as Python, TypeScript/JavaScript, or similar
    technologies.
  - Ability and interest to travel (typically up to 25%, with
    flexibility for higher travel periods when needed) to
    customer sites and our offices in LA & Washington DC.

  Preferred Requirements

  - At least one year of relevant work experience, especially in
    a defence context.
  - Familiarity with core technical concepts – such as data
    structures, storage systems, cloud infrastructure, and
    modern front-end frameworks.
  - Confidence working in a command-line environment, with
    familiarity using tools like Git, SSH, and Linux-based
    systems.
  - Experience applying machine learning or AI techniques to
    real-world or customer-facing problems.
  - Thoughtful about how technical choices shape user
    experience, and comfortable managing internal and external
    stakeholders with a mix of technical insight and common
    sense.
  - Demonstrated ability to learn new concepts quickly and adapt
    in a fast-paced, dynamic environment.
  - Comfortable working both autonomously and within teams that
    include both technical and non-technical members.
  - Existing UK security clearance, or eligibility to obtain it.

  Why CHAOS?

  - Health Benefits: Medical, dental, and vision benefits 100%
    paid for by the company
  - Additional benefits: 401k (+ 50% company match up to 6% of
    pay), FSA, HSA, life insurance, and more
  - Our Perks: Free daily lunch, ‘No meeting Fridays’, unlimited
    PTO, casual dress code
  - Compensation Components: Competitive base salaries, generous
    pre-IPO stock option grants, relocation assistance, and
    (coming soon!) annual bonuses
  - Team Growth: 200 employees and counting across 5 global
    offices

