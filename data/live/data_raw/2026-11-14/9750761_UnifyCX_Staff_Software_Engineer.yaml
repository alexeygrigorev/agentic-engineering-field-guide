description: |
  STAFF SOFTWARE ENGINEER

  Location: Remote (US) Team: Product Engineering Reports to:
  Director of Engineering

  About UnifyCX

  UnifyCX is redefining the intersection of technology and
  human-centric service. Founded by a team with a history of
  successful IPOs, we deliver real-world AI solutions that
  transform the customer experience (CX) landscape. Our
  approach combines cutting-edge artificial intelligence with
  a human touch, empowering small and medium-sized businesses
  to deliver scalable and efficient services.

  About the Role

  As a Staff Software Engineer at UnifyCX, you will lead the
  design and development of enhancements to our next-
  generation AI Agent platform. You will tackle a broad
  problem space, focusing on extensibility, configurability,
  and open APIs. Your work will involve applying AI
  thoughtfully to automate and optimize complex processes,
  making them faster, more reliable, and less error-prone. You
  will help build scalable and robust systems that power
  millions of customer interactions and support hundreds of
  clients.

  Responsibilities:

  - Serve as a subject matter expert in both business and
    technical domains.
  - Lead the planning, execution, and delivery of complex
    technical projects, including ownership of large features
    and infrastructure initiatives from design through
    completion.
  - Collaborate with partners, product managers, and designers
    to solve challenging, high-impact problems.
  - Mentor and guide engineers and engineering teams, promoting
    best practices and helping set overall team direction.
  - Ensure the delivery of large or complex technology
    capabilities—spanning multiple components or
    services—within and across engineering domains.
  - Foster a collaborative engineering culture, proactively
    identifying and mitigating risks to ensure on-time
    delivery of cross-team projects.
  - Contribute significantly to functional and organizational
    objectives, driving outcomes for key projects.
  - Partner with leadership to prioritize technical roadmaps and
    influence product and process enhancements across the
    organization.
  - Identify and reduce failure domains, building resilient
    software that minimizes business impact during maintenance
    or incidents.
  - Guide the development and monitoring of Service-Level
    Objectives (SLOs) for critical systems.
  - Ensure compliance with all applicable laws and regulations.
  - Perform other duties as assigned.

  Qualifications:

  - 7+ years of professional software engineering experience.
  - 5+ years leading cross-team or cross-company initiatives.
  - 5+ years leading technical contributions and elevating the
    quality of team outputs.
  - 5+ years applying core computer science concepts in
    practical, production environments.
  - 5+ years setting and upholding standards for stable,
    maintainable, and correct code.
  - 5+ years leading, mentoring, and training technical teams
    and junior engineers.
  - Deep proficiency in one the following programming languages
    Java, Go, Rust
  - Deep expertise in designing scalable, reliable distributed
    systems (bonus: experience with AI/ML platforms or
    customer experience domains).
  - Strong communication skills and a track record of driving
    alignment across technical and non-technical stakeholders.
  - Experience with open API development and platform
    extensibility is highly desirable.
