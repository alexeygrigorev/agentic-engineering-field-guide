description: |
  At JP Morgan Chase, we understand that customers seek
  exceptional value and a seamless experience from a trusted
  financial institution. That's why we launched Chase UK to
  transform digital banking with intuitive and enjoyable
  customer journeys. With a strong foundation of trust
  established by millions of customers in the US, we have been
  rapidly expanding our presence in the UK and soon across
  Europe. We have been building the bank of the future from
  the ground up, offering you the chance to join us and make a
  significant impact.

  As a Software Engineer III at JPMorgan Chase within the
  International Consumer Bank, you will play a crucial role in
  this initiative, dedicated to delivering an outstanding
  banking experience to our customers. You will work in a
  collaborative environment as part of a diverse, inclusive,
  and geographically distributed team. We are seeking
  individuals with a curious mindset and a keen interest in
  new technology. Our engineers are naturally solution-
  oriented and possess an interest in the financial sector and
  focus on addressing our customer needs. We work in teams
  focused on specific products and projects, providing
  opportunities to engage in areas such as fraud & financial
  crime prevention, identity services, money transfers, card
  payments, lending, customer onboarding, core banking,
  insurance products, rewards campaigns, and servicing
  innovations.

  Job responsibilities

  - Contribute to end-to-end solutions in the form of cloud-
    native microservices architecture applications leveraging
    the latest technologies and the best industry practices
  - Use domain modelling techniques to allow us to build best in
    class business products.
  - Structure software so that it is easy to understand, test
    and evolve.
  - Build solutions that avoid single points of failure, using
    scalable architectural patterns.
  - Develop secure code so that our customers and ourselves are
    protected from malicious actors.
  - Promptly investigate and fix issues and ensure they do not
    resurface in the future.
  - Make sure our releases happen with zero downtime for our
    end-users.
  - See that our data is written and read in a way that's
    optimized for our needs.
  - Keep an eye on performance, making sure we use the right
    approach to identify and solve problems.
  - Ensure our systems are reliable and easy to operate.
  - Keep us up to date by continuously updating our technologies
    and patterns.
  - Support the products you've built through their entire
    lifecycle, including in production and during incident
    management

  Required qualifications, capabilities & skills

  - Formal training or certification on software engineering
    concepts and applied experience
  - Recent hands-on professional experience as a back-end
    software engineer
  - Experience in coding in a recent version of the Java
    programming language
  - Experience in designing and implementing effective tests
    (unit, component, integration, end-to-end, performance,
    etc.)
  - Excellent written and verbal communication skills in English
  - Understanding of cloud technologies, distributed systems,
    RESTful APIs and web technologies
  - Familiarity with relational data stores

  Preferred qualifications, capabilities & skills

  - Experience in working in a highly regulated environment /
    industry
  - Knowledge of messaging frameworks
  - Familiarity with cloud-native microservices architecture
  - Understanding of AWS cloud technologies  #ICBEngineering
    #ICBCareers

  About Us



    JPMorganChase, one of the oldest financial institutions,
  offers innovative financial solutions to millions of
  consumers, small businesses and many of the world’s most
  prominent corporate, institutional and government clients
  under the J.P. Morgan and Chase brands. Our history spans
  over 200 years and today we are a leader in investment
  banking, consumer and small business banking, commercial
  banking, financial transaction processing and asset
  management.




  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
