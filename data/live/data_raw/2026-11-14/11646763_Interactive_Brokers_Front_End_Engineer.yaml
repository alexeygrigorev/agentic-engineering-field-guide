description: |
  About the Company



  Interactive Brokers Group, Inc. (NASDAQ: IBKR), a member of
  the S&P 500, is a global financial services company
  headquartered in Greenwich, Connecticut, with offices in
  over 15 countries. Through its affiliates, Interactive
  Brokers provides automated trade execution and custody of
  securities, commodities, foreign exchange, and prediction
  markets on over 170 markets in numerous countries and
  currencies.



  For more than four decades, Interactive Brokers has focused
  on technology, automation, and innovation to provide clients
  worldwide with a sophisticated, unified platform to manage
  their investment portfolios. We serve individual investors,
  hedge funds, proprietary trading groups, financial advisors,
  and introducing brokers.



  Our culture is driven by problem-solving, efficiency, and
  continuous improvement. We look for individuals who are
  intellectually curious, collaborative, and motivated to
  contribute to technology that helps simplify and enhance
  access to global financial markets. Interactive Brokers has
  consistently been recognized as a top broker by respected
  industry sources including Barron’s, Investopedia,
  Stockbrokers.com, and others.



  Covestor Limited (doing business as Interactive Advisors
  ("IA")) are part of the IBKR group. We are an online robo-
  advisor and investing platform, offering clients in the USA
  a variety of portfolios. This role will be permanent with
  IA, and working with us you will get exposure to Interactive
  Advisors work streams but also many projects working with
  the wider IBKR group.



  We're looking for a talented Front-End Engineer to take a
  hands-on delivery role across our most critical platform
  initiatives — continuously improving our trading UIs in Vue.



  You'll be working on technically demanding challenges:
  building and adapting high-performance JavaScript/TypeScript
  libraries for real-time browser connectivity, low-latency
  data parsing, robust error handling, and more. If you're
  excited by the intersection of complex financial data and
  exceptional user experience, this role is for you.



  We are also open to strong server-side engineers with a
  genuine interest in front-end technologies who are looking
  to cross-train into a full-stack role — we'll invest in
  helping you get there.



  We currently operate a hybrid working model at IBKR, and so
  you will be able to commute to our fantastic central London
  office (The Walkie Talkie Building) 4 days per week, where
  you will be pleased to hear we offer lunch every day you are
  in the office from a selection of vendors.



  Responsibilities

  - Design and build scalable web applications within the VueJs
    ecosystem (VueJs, Vuex, Pinia, Vite, Cypress, webpack)

  - Owning and building high-traffic applications with a focus
    on speed and user experience

  - Proactively identifying and implementing improvements to
    architecture, performance and code quality

  - Collaborating with colleagues and peers to ideate, plan, and
    organize large-scale projects

  - Contribute and help maintain our company-wide Vue UI
    Component Library

  - Set direction and partner with other frontend engineers to
    implement new technologies

  Requirements

  Technical

  - 5+ years of commercial software development experience, with
    a strong emphasis on single-page application (SPA)
    development

  - Deep, production-level experience with at least one major
    JavaScript framework — Vue3 (ideally), Angular or React;
    experience with more than one is a strong plus

  - Strong TypeScript skills; able to design and build robust,
    well-typed libraries and components

  - Solid command of HTML5 and CSS3, including responsive
    design, accessibility and cross-browser compatibility

  - Experience with modern front-end tooling: build systems
    (Vite, rollup), testing frameworks (Vitest, Playwright)
    and CI/CD pipelines

  - Familiarity with AI concepts and tooling — including AI-
    assisted development, LLM integration in web applications;
    practical experience is a strong plus

  - A solid grounding in core computer science fundamentals:
    data structures, algorithms and system design

  - Experience with real-time data (WebSockets, SSE or similar)
    is a significant advantage in this role

  - Good to have experience with AG Grid, Prime Vue, UI state
    management systems such as Pina, Redux, and UI design
    systems.

  Soft Skills & Ways of Working

  - Strong communicator, equally comfortable in a detailed
    technical discussion with senior engineers and a user-
    centred design discussion with product experts

  - Able to pick up new business domains quickly, asking sharp
    questions and building understanding fast

  - Demonstrates strong personal integrity and accountability

  - Open to and actively seeks constructive feedback

  Academic

  - A degree in Computer Science, Engineering or a related STEM
    discipline; a postgraduate qualification is a plus



  Personal Attributes

  - A passionate advocate for clean, concise and maintainable
    code

  - A natural technical leader who earns the trust and
    confidence of peers

  - A collaborative team player — confident enough to admit
    mistakes, comfortable leading and following in equal
    measure, always willing to learn as well as teach

  - Someone who thrives in a fast-paced, high-energy environment
    and takes genuine ownership of outcomes



  Location:

   20 Fenchurch Street, London, EC3M 3BY

  9am – 6pm, Monday – Friday



  Benefits:

  - Career support and development
  - Salary commensurate with experience
  - Performance based discretionary cash bonus scheme
  - Discretionary stock grant
  - Group Life Assurance cover
  - Group Income Protection
  - Occupation pension scheme based on Gross earnings
  - Hybrid working model
  - Above statutory annual leave, increasing with service
  - Daily company-paid lunch and healthy snack options
    throughout the day (when working from the office)
  - Access to Private Medical Insurance, Dental Plan and / or
    Health Cash Plan*
  - Corporate events
  - Travel season ticket loans*
  - Cycle to work scheme*
  - Fitness subsidisation

  *on successful completion of the probation period
