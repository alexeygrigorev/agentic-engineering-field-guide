description: |
  Kensho is S&P Global's hub for AI innovation and
  transformation. With expertise in machine learning, natural
  language processing, and data discovery, we develop and
  deploy novel solutions to innovate and drive progress at S&P
  Global and its customers worldwide. Kensho's solutions and
  research focus on business and financial generative AI
  applications, agents, data retrieval APIs, data extraction,
  and much more. At Kensho, we hire talented people and give
  them the autonomy and support needed to build amazing
  technology and products. We collaborate using our teammates'
  diverse perspectives to solve hard problems. Our
  communication with one another is open, honest, and
  efficient. We dedicate time and resources to explore new
  ideas, but always rooted in engineering best practices. As a
  result, we can innovate rapidly to produce technology that
  is scalable, robust, and useful. Kensho's Applications group
  develops the web apps and APIs that deliver Kensho's AI
  capabilities to our customers. Our teams are small, product-
  focused, and intent on shipping high-quality code that best
  leverages our efforts. We're collegial, humble, and
  inquisitive, and we delight in learning from teammates with
  backgrounds, skills, and interests different from our own.
  Our App Experiences team focuses on breathing life into
  novel ML capabilities, translating them into valuable and
  intuitive end-user experiences. We collaborate closely with
  our Product and Design teams to understand user needs,
  looking for creative applications and delivery mechanisms of
  our technology. We demo early and often, and we keep a tight
  iteration loop. We sweat the details when it comes to UX. As
  a Senior Full-Stack Software Engineer, you will build AI-
  centric web applications in TypeScript ranging from
  experimental POCs to full-fledged product offerings. You'll
  have significant autonomy over technical and architectural
  choices, and be responsible for managing short- and long-
  term trade-offs. The ideal candidate loves product and views
  technology as a means, not an end, and is excited to
  collaborate across all aspects of the software development
  lifecycle. Kensho states that the anticipated base salary
  range for the position is 150k-225k. In addition, this role
  is eligible for an annual incentive bonus and equity plans.
  At Kensho, it is not typical for an individual to be hired
  at or near the top of the range for their role and
  compensation decisions are dependent on the facts and
  circumstances of each case. What You'll Do:

  - Build full-stack and SPA TypeScript applications ranging
    from experiments to flagship products
  - Collaborate on product decisions and communicate technical
    constraints and considerations
  - Own and collaborate on technology/architecture decisions and
    conventions
  - Teach and learn from the team and the broader organization
    via mentorship, code review, knowledge sharing, etc.
  - Self-sufficiently manage project priorities, estimates, and
    deliverables

  What You'll Need:

  - At least five years of direct experience building commercial
    web applications in JavaScript/TypeScript
  - At least three years of that experience working directly on
    web UIs in a modern framework
  - At least one domain of deep technical expertise (e.g., web
    performance, design systems, framework knowledge, etc.)
  - Product sense, or a strong interest in developing it
  - Kind, thoughtful, and high-signal communication skills for
    both technical and non-technical audiences
  - Ability to translate ambiguous needs and constraints into
    clear technical requirements

  Technologies & Tools We Use:

  - Development: TypeScript, React, Next.js, Tailwind,
    LangGraph, AI SDK, Drizzle
  - Ops: Git, GitHub, Amazon EKS, AWS, Sentry, Langfuse,
    Prometheus

  At Kensho, we pride ourselves on providing top-of-market
  benefits, including:

  - Medical, Dental, and Vision insurance
  - 100% company paid premiums
  - Unlimited Paid Time Off
  - 26 weeks of 100% paid Parental Leave (paternity and
    maternity)
  - 401(k) plan with 6% employer matching
  - Generous company matching on donations to non-profit
    charities
  - Up to $20,000 tuition assistance toward degree programs,
    plus up to $4,000/year for ongoing professional education
    such as industry conferences
  - Plentiful snacks, drinks, and regularly catered lunches
  - Dog-friendly office (CAM office)
  - Bike sharing program memberships
  - Compassion leave and elder care leave
  - Mentoring and additional learning opportunities
  - Opportunity to expand professional network and participate
    in conferences and events

   Recruitment Fraud Alert:  If you receive an email from a
  spglobalind.com domain or any other regionally based
  domains, it is a scam and should be reported to
  reportfraud@spglobal.com . S&P Global never requires any
