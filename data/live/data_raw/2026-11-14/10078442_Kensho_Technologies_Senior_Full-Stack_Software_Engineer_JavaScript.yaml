  offer letters, "pre-employment training" or for
  equipment/delivery of equipment. Stay informed and protect
  yourself from recruitment fraud by reviewing our guidelines,
  fraudulent domains, and how to report suspicious activity
  here . We are an equal opportunity employer that welcomes
  future Kenshins with all experiences and perspectives.
  Kensho is headquartered in Cambridge, MA, with an additional
  office location in New York City. All qualified applicants
  will receive consideration for employment without regard to
  race, color, religion, sex, sexual orientation, gender
  identity, or national origin. Job ID: 324984 Posted On:
