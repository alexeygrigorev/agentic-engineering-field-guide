description: |
  About Faraday

  Faraday is automating the back office for the $600B home
  services industry (think HVAC, plumbers, electricians).
  Contractors are buried in essential paperwork - like
  permits, warranties, and rebates. Our AI agents take on
  these complex workflows so projects stay on track,
  contractors get paid faster, and homeowners get a smoother
  experience.

  In the past 9 months, we’ve grown 300% and partnered with
  some of the leading US home service brands. Backed by top-
  tier VCs, we’re growing our low ego, high-output team in
  Chinatown, NYC.

  What you'll do

  - Build and scale our AI agent platform and internal tools
  - Work closely with customers to prioritize feature
    development
  - Ship new features end-to-end
  - Own backend services, APIs, and integrations with CRMs like
    ServiceTitan

  Who you are

  - 5+ years of work experience in full-stack development (we
    know great early stage engineering can come from a variety
    of backgrounds)
  - Proficient in TypeScript/JavaScript and experience with
    cloud platforms (e.g., AWS, GCP, Azure, etc)
  - Strong familiarity with AI, LLMs, or AI-assisted systems -
    or a willingness to learn fast
  - Experience and desire to be in startup environments, either
    as a founder or an early-stage engineer
  - Eagerness to work in person with us in NYC full time

  Benefits

  - 160,000 - 200,000, depending on experience, plus meaningful
    seed stage equity
  - Work on cutting-edge AI with massive real-world impact
  - Work from an amazing office in NYC
  - Medical, dental, and vision benefits
  - Take what you need vacation policy

  Compensation

  The base pay range for this role is $160,000 – $200,000 per
  year.
