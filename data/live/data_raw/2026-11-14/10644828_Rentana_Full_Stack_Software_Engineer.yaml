description: |
  Full-Stack Software Engineer

  Company Overview

  The built world generates more data than almost any other
  industry. Almost none of it is being used. Rentana is
  changing that, building the AI copilot for real estate that
  distills billions of real-world signals into revenue
  intelligence, so operators can optimize every lever across
  their portfolio and actually talk to their data.

  ‍

  Our founding team has built four multi-billion dollar
  software companies and two proptech exits, including Dynasty
  (sold to AppFolio) and Urbandoor (sold to Airbnb). Our
  founding engineers include the first engineer at Airtable
  and the engineer who led the largest code migration in
  Stripe's history.

  ‍

  Customers love Rentana: we are the top-rated revenue
  management platform on Revyse, with NMHC Top 50 real estate
  owners and operators on the platform within 1 year of public
  launch.

  Job Summary

  Rentana is looking for a talented Software Engineer to join
  our small but dynamic team. In this role, you will focus on
  designing and implementing greenfield projects. This would
  include designing systems to normalize and scale messy
  third-party data and contributing to analytical and machine-
  learning models. You’ll collaborate closely with the CTO,
  CEO and CPO to create solutions that elevate the UI/UX of
  our platform and streamline our backend infrastructure. If
  you have a passion for data and a knack for building
  scalable, user-focused solutions, we’d love to hear from
  you.

  Key Responsibilities

  - Work with the team to design and implement backend systems
    that manage and organize data efficiently.
  - Develop and maintain data pipelines that support the
    platform’s data-driven features.
  - Design and implement intuitive solutions through
    collaborative and autonomous workflows
  - Analyze current and potential metrics, helping to determine
    which ones are most valuable to track and optimize.
  - Collaborate with the team to establish features that guide
    product development and user engagement strategies.
  - Participate in both front-end and back-end development to
    support our customers and customer success team.
  - Design database systems using our existing SQL database and
    graphql API that perform at scale.
  - Continuously improve the performance, scalability, and
    reliability of our systems.
  - Implement best practices for data security and integrity
    throughout the development process.
  - Work closely with the team to iterate on solutions that meet
    company goals and user needs.
  - Collaborate across teams to ensure that data-driven features
    are aligned with the overall product vision.

  Nice to Have

  - Experience building ML models.
  - Experience in multi family real estate.
  - Experience with statically typed programming languages.
  - Experience writing unit, integration and end-to-end tests.

  What We Offer

  - The opportunity to be part of a pioneering team in a high-
    growth industry, shaping the future of AI in real estate.
  - Direct collaboration with the startup’s top leadership,
    offering a unique insight into business management and
    strategic decision-making.
  - A competitive salary with equity options.
  - Comprehensive benefits package including health, dental, and
    vision insurance.
  - Flexible working conditions with the option to work
    remotely.
  - A dynamic, innovative, and supportive work environment.

  Company Values

  - Fast and Transparent: Speed is a competitive advantage --
    but only when paired with transparency. We bias toward
    action, share information openly, and never let slowness
    become a default
  - Solve It: We don't hand problems back. We take ownership,
    figure it out, and deliver. Excellence is at the core of
    everything we do.
  - Customer Obsessed: Our customers are the reason we build
    what we build. We listen closely and let real problems
    drive our product.
  - Candid but kind: We say what we mean, directly and with
    care. Feedback is a gift. We have the hard conversations,
    because glossing over the truth doesn't serve anyone.‍
  - Win Together: We share credit, support each other, and leave
    the ego at the door. The best idea wins, regardless of who
    had it. When things go wrong, we fix it together -- no
    blame, just learning.
