description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Intelligence & Engagement
  organisation responsible for delivering the intelligence and
  engagement capabilities that enable more relevant and
  personalised consumer experiences across digital channels.
  The organisation plays a key role in how consumers discover
  products, engage with content, and elevate experiences
  through membership & loyalty. Through capabilities such as
  personalisation, recommendations, consumer intelligence,
  experimentation, and AI-driven decisioning, the organisation
  helps deliver more contextual, data-driven interactions
  across the consumer journey.

  As a Senior Software Engineer (Backend), you will design,
  build, and maintain production-grade backend services and
  web applications that power personalisation and
  recommendation capabilities. You will work closely with Tech
  Leads, AI/ML Engineers, Product Owners, and Data Engineering
  teams to deliver reliable, scalable, and low-latency
  services.

  What you will do:

  - Design and build scalable APIs, microservices, and
    integration services that power AI-driven product
    discovery, search, recommendation, and personalization
    experiences.
  - Lead the technical design and delivery of complex features
    and services, ensuring high quality, scalability, and
    maintainability.
  - Partner with AI/ML Engineers and Data Engineers to design
    and integrate GenAI, recommendation, personalization, and
    search capabilities into consumer-facing applications.
  - Drive the implementation and optimization of search
    experiences using technologies such as Elasticsearch,
    OpenSearch, and vector search platforms.
  - Build and operate event-driven solutions using technologies
    such as Kafka and cloud-native architectures.
  - Drive improvements in performance, reliability,
    observability, security, and operational excellence across
    owned domains.
  - Mentor engineers, contribute to technical design reviews,
    and promote engineering best practices across the team.
  - Collaborate with product, engineering, and external
    technology partners to deliver business outcomes and
    accelerate innovation.
  - Leverage AI-assisted engineering tools and practices to
    improve productivity, code quality, and delivery
    effectiveness.

  YOUR TALENT

  - 7+ years of experience designing, building, and operating
    large-scale web applications and distributed systems.
  - Strong expertise in Java, Spring Boot, API design, and
    microservices architecture.
  - Experience designing and operating scalable, highly
    available, and resilient backend systems in production
    environments.
  - Hands-on experience with search technologies such as
    Elasticsearch, OpenSearch, Azure AI Search, or similar
    platforms.
  - Experience working with SQL/NoSQL databases, caching
    technologies such as Redis, and event streaming platforms
    such as Kafka.
  - Experience building and operating cloud-native applications
    on Azure, AWS, or GCP.
  - Strong understanding of distributed systems, system design,
    observability, performance optimization, and operational
    excellence.
  - Experience leading technical initiatives and collaborating
    across engineering, product, data, and AI teams.
  - Experience mentoring engineers and driving engineering best
    practices.
  - Exposure to AI/ML, Generative AI, LLMs, RAG-based
    applications, or AI-powered consumer experiences is highly
    desirable.

