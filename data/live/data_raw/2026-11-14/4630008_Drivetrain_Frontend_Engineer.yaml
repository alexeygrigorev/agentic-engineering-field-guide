  👥 Customer-centric:  We follow a product-led growth
  strategy, continuously  learning from our customers and
  collaborating to build the amazing software that Drivetrain
  is.

  About the role

  Drivetrain is looking for a Frontend Engineer to join our
  team. You will closely interact with designers, product
  owners, and other engineers and implement the user
  interfaces that define our core platforms.

  What you’ll be doing

  Work closely with design, product and engineering teams to
  create elegant, accessible, responsive and interactive
  interfaces.

  Handcraft UI/UX designs into prototypes, create awesome
  interactions, write reusable components and address
  performance issues of the product.

  Work on complex yet performant, deep yet elegant frontend
  components like a data visualisation system to create
  beautiful charts/tables and a spreadsheet-inspired business
  modelling system.

  Help set up processes to guarantee the long-term success of
  Drivetrain's engineering team.

  Requirements

  1 to 3 years of relevant work experience as a web, UI,
  JavaScript or frontend engineer with sound knowledge in
  Javascript, HTML and CSS, and a strong eye for design, with
  experience debugging using browser console.

  ReactJS and Data structure skills are important.

  Be able to write clean and maintainable code with attention
  to performance, but also be able to ship quickly.

  An ability to perform well in a fast-paced environment and
  bring in optimal flow for rapidly changing design.

  Java and AWS experiences are a plus although not mandatory.

