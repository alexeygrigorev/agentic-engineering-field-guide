description: |
  Availity delivers revenue cycle and related business
  solutions for health care professionals who want to build
  healthy, thriving organizations. Availity has the powerful
  tools, actionable insights and expansive network reach that
  medical businesses need to get an edge in an industry
  constantly redefined by change.

  At Availity, we're not just another Healthcare Technology
  company; we're pioneers reshaping the future of healthcare!
  With our headquarters in vibrant Jacksonville, FL, and an
  exciting office in Bangalore, India, along with an
  exceptional remote workforce across the United States, we're
  a global team united by a powerful mission. We're on a
  mission to bring the focus back to what truly matters –
  patient care. As the leading healthcare engagement platform,
  we're the heartbeat of an industry that impacts millions.
  With over 2 million providers connected to health plans, and
  processing over 13 billion transactions annually, our
  influence is continually expanding. Join our energetic,
  dynamic, and forward-thinking team where your ideas are
  celebrated, innovation is encouraged, and every contribution
  counts. We're transforming the healthcare landscape, solving
  communication challenges, and creating connections that
  empower the nation's premier healthcare ecosystem.

  Reporting to the Manager, Software Engineering the Software
  Engineer IV will build network messaging software for
  Availity’s Auth FHIR teams. This team’s work is mostly back-
  end, using .NET and Azure, and occasional front-end projects
  using Vue.js.

  Sponsorship, in any form, is not available for this
  position.

  Location: Remote, US

  What makes this team special:

  - Modern Engineering Experience The product ecosystem where
    our engineers contribute is designed with Azure in mind.
    There is a lot of freedom to be creative, explore new
    ideas, experiment, and contribute to cutting-edge
    solutions using the latest tools and software.
  - Experience and Expertise This high-performing team has an
    array of diverse experiences. You will learn a lot from
    us, and we also want to learn from you.
  - Engineering Focus Our culture and roots are centered around
    engineers. Most of your leadership chain are former
    Software Engineers who love to engage in technical
    conversations while also giving you and your team a
    significant amount of autonomy.
  - Positive Work Culture The team promotes a positive and
    inclusive work culture, prioritizing work-life balance,
    employee well-being, and fostering a sense of community
    and belonging.
  - Growth Opportunities Working on this team provides numerous
    opportunities for professional and personal growth through
    challenging projects, mentorship, and continuous learning.

  Role qualifications (must-have):

  - Bachelor’s degree in computer science or related field or
    equivalent experience
  - 5+ years of experience developing C# .NET software
  - Experience in a leadership capacity on a self-organizing
    team with other Software Engineers
  - Experience managing expectations with stakeholders to
    deliver timely solutions that satisfy customers
  - Experience building and consuming RESTful APIs
  - Strong understanding of SOLID OO design principles
  - Understanding of database design principles and SQL
  - Experience implementing unit and integration tests, and
    knowledge about what makes software testable
  - High comfort level with distributed source control tools
    like GIT
  - Willingness to take on complex projects with many unknowns
  - Adherence to engineering best practices
  - Awareness of what causes technical debt and how to keep it
    in check
  - Maintenance of composure and professionalism during high-
    pressure situations
  - Initiative and ownership of the work that needs to be done
  - Ability to manage multiple and changing priorities/tasks

  Bonus qualifications (nice-to-have):

  - Experience in Healthcare information technology,
    particularly with FHIR and/or X12 messaging
  - Experience configuring and deploying software to Azure
  - Experience using Azure DevOps to create pipelines for builds
    and deployments
  - Experience in the capacity of a tech lead, team lead,
    manager, and/or mentor.

  What you will be doing:

  - Designing and building DaVinci Prior Auth networking
    solutions in the healthcare space.
  - Developing mostly C# .NET software, with other languages
    where appropriate.
  - Building web services for both internal and external use.
  - Mapping message structures, mostly utilizing DaVinci FHIR.
  - Reading and understanding specifications for healthcare
    messaging standards.
  - Writing unit tests to maintain high coverage percentages.
  - Collaborating within your team and across teams.
  - Reviewing pull requests from others on your team and
    providing feedback in a constructive manner.
  - Configuring and deploying software to Azure.
  - Troubleshooting issues in production.
  - Keeping our code to a very high standard.
  - Learning and developing yourself.
  - Mentoring junior Software Engineers.
  - Innovating and sharing ideas to improve products and
    processes, big and small.
  - Improving and shortening the prior authorization process for
    patients across the US.

  Availity culture and benefits:

  - Availity is a certified “Great Place to Work”, a “Best
    Workplaces for Technology Companies”, a “Best Workplaces
    for Women” and a “Best Workplaces for Millennials”!
  - Culture is important to us and there are many ways for you
    to make your mark here!
  - We have several Diversity & Inclusion teams and various ways
    to engage with fellow Availity associates. “AvaiLadies”,
    “Beyond Black”, “HOLA”, “Availity Pride”, “VetAvaility” a
    Young Professionals Group and “She Can Code IT” a group
    for women in tech are some of the groups you can get
    involved in.
  - Availity is a culture of continuous learning. We have many
    resources and experts in our tech stack and in our
    industry that can help get you there too!
  - We offer a competitive salary, bonus structure, generous HSA
    company contribution, healthcare, vision, dental benefits
    and a 401k match program that you can take advantage of on
    day one!
  - We offer unlimited PTO for salaried associates + 9 paid
    holidays. Hourly associates start at 19 days of PTO and go
    up from there with all the same holiday benefits.
  - Interested in wellness? We allow our associates to reimburse
    up to $250/year for gym memberships, participation in
    racing events, weight management programs, etc.
  - Interested in furthering your education? We offer education
    reimbursement!
  - Availity offers Paid Parental Leave for both moms and dads,
    both birth parents and adoptive parents.
  - Want to work for an organization that gives back to the
    community? You’re at the right place! Availity partners
    with various organizations, both locally and nationally,
    to raise awareness, funds and morale as our staff members
    volunteer their time and funds to engage the organizations
    campaign.

  Next steps:

  After you apply, you will receive text/email messages
  thanking you for applying and then you will continue to
