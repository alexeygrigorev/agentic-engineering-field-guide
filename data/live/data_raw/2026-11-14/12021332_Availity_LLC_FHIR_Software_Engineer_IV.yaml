  Interview process:

  - Recruiter resume review
  - Manager resume review
  - Recruiter video interview
  - Technical assessment
  - Manager video interview
  - Panel video interview
  - Leadership video interview

  Video Camera Usage:

  Availity fosters a collaborative and open culture where
  communication and engagement are central to our success.  As
  a remote first company, we are also camera-first and provide
  all associates with camera/video capability to simulate the
  office environment. If you are not able to use your camera
  for all virtual meetings, you should not apply for this
  role.

  Having cameras on helps create a more connected,
  interactive, and productive environment, allowing teams to
  communicate more effectively and build stronger working
  relationships.  The usage of cameras also enhances security
  and protects sensitive company information. Video
  participation is required to ensure that only authorized
  personnel are present in meetings and to prevent
  unauthorized access, data breaches, preventing social
  engineering, or the sharing of confidential information with
  non-participants.

