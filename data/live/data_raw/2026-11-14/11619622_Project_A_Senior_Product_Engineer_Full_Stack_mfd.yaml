description: |
  About the Job

  As a key growth accelerator, A11 partners with Europe’s most
  ambitious startups and scaleups, corporates and SMBs to
  connect them with top-tier talent ready to make an impact.

  We're looking for an ownership-driven Senior Product
  Engineer (Full Stack) for the engineering team at one of our
  Ecosystem Companies. You won't just ship tickets: you own
  business problems end to end, from the first conversation to
  production, working with Product on what to build and
  delivering across data, services, AI agents, and UI.

  Join the A11 Ecosystem – a next-generation supply chain
  platform redefining how one of the world's largest
  industries sources, distributes, and finances materials.
  Engineered to unlock the full potential of global trade, it
  harnesses agentic AI and workflow automation to provide
  seamless, high-efficiency access to premium materials at
  scale. Since its commercial rollout, the platform has fueled
  exponential growth, optimizing procurement for thousands of
  businesses while setting new benchmarks for speed,
  transparency, and efficiency. Its competitive edge lies in
  full digitization and AI-driven supply chain management
  automation, eliminating inefficiencies and creating a
  direct, intelligent bridge between suppliers and buyers.
  With a team of 80+ FTEs across Europe (Berlin HQ), China,
  and India, the company is rapidly scaling toward
  profitability, driving triple-digit million GMV, and setting
  new industry standards in autonomous, AI-powered supply
  chain orchestration.

  In this role, you’ll:

  Own business problems end to end

  - Take a problem from first conversation through production
    and ongoing operation, for example making supplier pricing
    reliable from ingestion to the final quote
  - Work with Product to decide what to build and why
  - Measure whether shipped work performs, including monitoring
    and evaluating LLM-driven workflows in production

  Build the platform and AI agents

  - Build backend services for pricing, inventory, orders, and
    integrations with suppliers, customers, and logistics
    partners
  - Build AI agents, their tools, and APIs, with safeguards such
    as idempotency, validation, audit trails, and human review
  - Turn messy external data (price lists, datasheets, stock
    feeds) into reliable data for the wider business
  - Design interfaces where commercial teams can review agent
    proposals, correct errors, and approve decisions quickly

  Raise the engineering bar

  - Make and document technical decisions and their trade-offs
  - Mentor other engineers through reviews, pairing, and
    feedback
  - Help hire by running interviews and defining engineering
    standards

  Your Profile:

  - 5+ years building and running production software with real
    users and real consequences for failure
  - Strong backend skills at production scale in Java or a
    comparable language (Kotlin, C#, Go), and willingness to
    work with Java and Spring Boot
  - Experience with distributed, event-driven systems, with a
    focus on data correctness and failure modes
  - Solid PostgreSQL skills and hands-on AWS experience
  - Full-stack delivery ability: backend depth plus capable
    TypeScript/React work on the problems you own
  - Strong product sense: you ask why before how, talk to users,
    and turn vague problems into clear plans
  - Sound engineering judgment on LLMs and agent frameworks;
    hands-on experience is a strong plus
  - Experience in trading, marketplaces, supply chain, fintech,
    or other domains where data errors cost money is a bonus
  - Working language is English
  - Current stack: Java 21, Spring Boot, Python, TypeScript,
    React, Next.js, LangGraph, PostgreSQL, AWS, Terraform. You
    don't need to know all of it on day one.

  Please note that this position is based in Berlin

  Benefits and Perks:

  - Fulfil a role with entrepreneurial freedom and help scale a
    high-impact business model
  - Join an experienced founding team of serial and 2nd-time
    founders
  - Attractive base and bonus compensation program
  - Collaboration with top-tier investors and angels (incl.
    various unicorn founders) as well as leading market
    experts

  If you’re eager to join the A11 Ecosystem and shape what’s
  next, we want to hear from you!

  Our Commitment to Diversity and Inclusion

  A11 is committed to diverse and equal opportunities hiring
  for all – applicants, candidates, and employees alike. We
  value humans – with all our glorious multifaceted
  backgrounds, perspectives, and experiences – and look
  forward to your application.
