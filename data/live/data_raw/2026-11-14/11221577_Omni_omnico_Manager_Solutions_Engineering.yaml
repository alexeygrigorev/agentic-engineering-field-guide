description: |
  About Omni

  Omni is the AI analytics platform that turns company data
  into a trusted source of truth for AI. Built on a semantic
  model, Omni gives teams a governed context graph, so
  everyone gets the same trusted answer. Ask in plain English,
  refine in workbooks, or bring your data into tools like
  Claude, ChatGPT, Cursor, and Slack. Our team has spent
  decades building data platforms, and we started Omni to fix
  problems we saw firsthand. Today, we help customers like
  Condé Nast, BambooHR, and Synthesia get better answers from
  their data. We're headquartered in San Francisco and have
  raised $217M from top investors including ICONIQ, Theory
  Ventures, and Redpoint Ventures. Our latest $120M Series C
  valued us at $1.5B. If you like helping people get more from
  their data, come build with us. We’d love to hear from you.

  About the Role

  We're looking for a Solutions Engineering Manager to lead
  and grow our pre-sales Solutions Engineering team across
  North America. In this role, you'll build on Omni's high-
  touch, customer-first model. You’ll be coaching a team of
  Solutions Engineers, partnering closely with Sales
  leadership, and ensuring every prospect gets a best-in-class
  technical evaluation experience. You'll serve as both a
  hands-on technical leader and a strategic bridge between the
  field and our Sales, Product and Engineering teams.

  Responsibilities

  - Hire, ramp, and coach a team of Solutions Engineers,
    providing regular feedback, career development, and
    technical mentorship.
  - Partner with Sales leadership to plan resourcing and
    prioritize coverage across the team's pipeline of
    technical evaluations.
  - Stay close to the field — join key discovery calls, demos,
    and POCs to model best practices and unblock deals when
    needed.
  - Build and refine the team's playbook for discovery, demos,
    and POCs, driving consistency and quality across the org.
  - Own team-level metrics (POC win rates, demo conversion, ramp
    time, etc) and report on team performance to Sales and SE
    leadership.
  - Synthesize patterns and feedback from the field into
    actionable input for Product and Engineering roadmap
    discussions.
  - Represent the Solutions Engineering team in strategic,
    executive-level customer conversations as needed.

  About You

  - 3+ years of pre-sales experience (Solutions Engineering,
    Sales Engineering, or Solutions Architecture) specifically
    within business intelligence or analytics software — this
    refers to domain-specific experience, not total years in
    the field overall.
  - 2-3+ years of team leadership experience, including direct
    people management.
  - Strong SQL skills and hands-on familiarity with the modern
    data stack (e.g. Snowflake, BigQuery, Databricks,
    Redshift, dbt).
  - Proven track record leading technical discovery, demos, and
    POCs with technical and executive stakeholders at
    enterprise accounts.
  - Experience coaching, hiring, and developing technical
    talent.
  - Exceptional communication skills, comfortable moving between
    technical, non-technical, and executive audiences.
  - Prior experience with BI and/or enterprise data analytics
    tools (such as Looker, Omni, Tableau, Power BI, Mode,
    Sisense, etc).
  - High agency and comfort driving results within fast-paced,
    Series A–D environments.

  Location

  This is a fully remote role open to candidates based
  anywhere in the US, with a preference for candidates based
  in the Central or Eastern time zones.

  Why Join Us

  - Passionate, supportive team with extensive experience in the
    space (including founders from Looker and Stitch Data) all
    working together to win as a team
  - Fully paid medical insurance for employees, plus vision and
    dental coverage
  - 401(k) Plan
  - Flexible PTO

  Omni is an equal opportunity employer. We value diversity
  and encourage you to apply even if you don’t check every
  single box. Please, let us know if you need any reasonable
  accommodations during the interview process.
