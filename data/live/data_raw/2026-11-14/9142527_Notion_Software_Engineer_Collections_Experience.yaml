description: |
  Who We Are

  Notion is the collaborative AI workspace where teams and
  agents think together. We're building one place where your
  knowledge, projects, meetings, and AI tools live side by
  side, so work is faster, clearer, and less fragmented.
  Millions of individuals, small teams, and large companies
  run their work on Notion.

  Notinos (our employees) are customer zero in bringing this
  future of work to life. We care about craft, building things
  that last, and the belief that great work is still
  fundamentally human. Our goal isn’t to ship the next
  feature. Each and every team of Notinos is working to set
  the standard for how humans work together in the AI era.
  From building a business’s system of record to making and
  managing AI agents to automating away the busy work, we care
  deeply about giving our customers more time for their life’s
  work.

  About the Role

  Collections Experience owns the product experience for
  Notion’s database block and everything on top of it:
  properties, views, forms, permissions, and many more
  features. If you’ve ever typed /database in a Notion page,
  you’ve already used something our team built.

  We’re hiring an experienced software engineer to accelerate
  our mission to build a flexible, reliable, and intuitive
  primitive that gives everyone the power to model their work
  exactly as they imagine— from simple lists to the most
  complex workflows.

  We’re 8+ engineers, designers, and PMs across SF and NYC.
  You’ll work across the stack in TypeScript, ship features
  that touch both the data model and the UI, and help shape
  where the database block goes next.

  What You'll Achieve

  - Design and ship new database properties and views that
    expand what people can model in Notion
  - Design permission models that hold up at the scale of our
    largest customers
  - Partner with the Agent team to grow what Notion Agent can do
    with databases, from tool development to eval-driven
    iteration
  - Collaborate closely with product and design on features that
    are ambiguous up front and require strong technical
    judgment to scope
  - Raise the bar on code review, testing, and technical design
    across the team

  Skills You'll Need to Bring

  - 10+ years shipping production software, with a strong track
    record of owning features end-to-end
  - Fluency with TypeScript across both backend and frontend
  - Strong product instincts: you can take a vague problem,
    propose a solid technical approach, and know when to cut
    scope
  - Experience on systems where data model decisions have long-
    lived consequences (databases, permissions, collaborative
    editing, or similar)
  - You don’t need to be an AI expert, but you’re curious and
    willing to adopt AI tools to work smarter and deliver
    better results.

  Nice to Haves:

  - Experience building database, spreadsheet, or workflow tools
  - Background in permissions or authorization systems at scale
  - Familiarity with AI/agent tooling, evals, or LLM-driven
    product experiences

  Notion is committed to providing highly competitive cash
  compensation, equity, and benefits. The compensation offered
  for this role will be based on multiple factors such as
  location, the role’s scope and complexity, and the
  candidate’s experience and expertise, and may vary from the
  range provided below. For roles based in San Francisco or
  New York City, the estimated base salary range for this role
  is $213,000 - $320,000 per year.

  By clicking “Submit Application”, I understand and agree
  that Notion and its affiliates and subsidiaries will collect
  and process my information in accordance with Notion’s
  Global Recruiting Privacy Policy and NYLL 144.

  #LI-Onsite

  A Note on AI

  You don’t need deep AI expertise for every role, but we do
  expect every Notino to be intellectually curious, drawn to
  tinkering and discovery, and excited to use AI as a real
  collaborator in their work. For some roles, AI fluency is a
  core requirement — when that’s the case, we'll say so
  explicitly in the qualifications. People who thrive here
  don’t treat AI as a novelty. They use it to think better,
  and make their work easier for others to build on.

  Equal Opportunity & Accommodations

