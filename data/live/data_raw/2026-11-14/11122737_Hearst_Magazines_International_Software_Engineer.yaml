description: |
  Be Part of What's Next

  At Bring a Trailer, you’ll help shape the future of one of
  the world's most passionate automotive communities by
  building cloud-native technology that powers exceptional
  user experiences. As a Software Engineer, you'll play a key
  role in modernizing our platform, delivering scalable
  solutions that directly impact buyers, sellers, and internal
  teams while helping drive the evolution of our engineering
  architecture.

  About Hearst Magazines (Why Us?)

  Bring a Trailer is part of the Hearst Autos family. BaT
  Auctions are the best way to buy and sell classic,
  collector, and enthusiast vehicles. We curate vehicles
  submitted by our audience and craft transparent auction
  listings that present the vehicles as they are—without
  superlatives or dubious used-car-lot language. BaT's ever-
  growing community of knowledgeable users vets each listing
  so potential buyers can bid with confidence.

  Key Responsibilities (What You Are Doing)

  - Design, build, test, and maintain cloud-native
    microservices, APIs, and event-driven workflows using AWS
    serverless technologies including Lambda, DynamoDB, API
    Gateway, EventBridge, and SQS in TypeScript.
  - Develop modern features that integrate seamlessly with
    existing WordPress and PHP systems while supporting the
    ongoing migration to a serverless architecture.
  - Build secure, scalable API endpoints, event handlers,
    synchronization services, and background processing
    workflows that deliver reliable customer and internal
    experiences.
  - Collaborate with Product, Design, Quality Assurance, and
    Engineering partners during six-week development cycles to
    deliver high-quality software solutions.
  - Practice Spec-Driven Development (SDD) by translating
    product requirements into well-defined technical
    specifications, automated tests, and measurable outcomes.
  - Leverage AI coding agents effectively by providing clear
    guidance, critically reviewing generated code, validating
    edge cases, and ensuring production-quality
    implementations.
  - Troubleshoot production issues across cloud services and
    legacy integration points, identify root causes, and
    implement automated testing to prevent regressions.
  - Participate in code reviews, contribute to engineering
    documentation, infrastructure as code, observability
    improvements, and the team's on-call rotation to maintain
    platform reliability.

  Qualifications (What We're Looking For)

  - 3+ years of experience developing production software, or
    equivalent practical experience.
  - Strong experience building backend services, APIs, and
    asynchronous applications using TypeScript and Node.js.
  - Hands-on experience developing cloud-native applications
    using AWS Lambda, DynamoDB, API Gateway, EventBridge, SQS,
    and related serverless services.
  - Working knowledge of PHP and familiarity reading and
    understanding WordPress applications, plugins, REST APIs,
    and data models.
  - Understanding of database design, DynamoDB data modeling,
    and relational databases such as MySQL.
  - Experience writing clean, maintainable, well-tested code
    with strong debugging and problem-solving skills.
  - Ability to communicate effectively within a remote,
    collaborative engineering team and work successfully
    across technical and non-technical partners.
  - Preferred experience with Infrastructure as Code (AWS CDK,
    Terraform, SAM, or Serverless Framework), CI/CD pipelines,
    event-driven architectures, observability tools, React, or
    AI-assisted development workflows.
  - This is a remote role and may be performed from one of the
    following states: CA, CO, DE, FL, IL, IN, MD, MI, MN, NY,
    NC, OH, PA, RI, TX, VA, WA, or WI. Applicants must be
    authorized to work for any employer in the U.S. We are
    unable to sponsor or take over sponsorship of an
    employment visa.

  Benefits (What We Offer)

  - Work with the Best: Collaborate with top-tier professionals
    across media, advertising, tech, fashion, lifestyle, and
    publishing, shaping the future of these dynamic
    industries.
  - Grow Your Skills: Unlock your potential with access to
    innovative training programs, immersive workshops, and
    exclusive industry events.
  - Work-Life Harmony: Enjoy the flexibility of hybrid work,
    empowering you to balance professional success with
    personal priorities.
  - Foster Connection & Belonging: Join our Employee Resource
    Groups and help create a welcoming workplace where
    everyone feels valued and empowered.
  - Wellness First: Prioritize your well-being with a
    comprehensive benefits package that includes medical,
    dental, and vision insurance from Day 1.
  - Plan for Your Financial Future: Enjoy competitive financial
    perks, including a 401(k) plan with a generous company
    match.

  The base salary range for this role is $116,000-$125,000.
  This position is not eligible for bonus or commission
  compensation. Actual compensation will be determined based
  on experience, skills, qualifications, and location.

  Hearst Magazines is an Equal Opportunity Employer. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, protected veteran status, or any other
  characteristic protected by law.
