description: |
  Blockchain is connecting the world to the future of finance.
  As the most trusted and fastest-growing global crypto
  company, it helps millions of people worldwide safely access
  cryptocurrency. Since its inception in 2011, Blockchain has
  earned the trust of over 90 million wallet holders and more
  than 40 million verified users, facilitating over $1
  trillion in crypto transactions.

  We are looking for a Front-End Engineer to join our
  Institutional team in our London office. Blockchain.com is a
  high-performance culture marked by fearlessness and hyper
  productivity. You are a hardworking team player with a
  desire to learn and grow with us, someone who can work
  harder, faster, and smarter to deliver tangible results and
  process improvements.

  WHAT YOU WILL DO

  - Build out a new set of UIs for the institutional team, with
    deep consideration for UX and performance.
  - Develop innovative visualizations of the user portfolio and
    responsive UIs.
  - Work closely with our traders through implementation to
    build optimized and efficient internal tools.
  - Write well-tested, reliable code for use by trading,
    operation and support teams with large amounts of data and
    live updates.
  - Proactively collaborate with team members, ensuring the
    sharing of knowledge and efficient division of labor.
  - Work on the most interesting and challenging problems in the
    cryptocurrency space.
  - Get exposure to the latest technologies and developments in
    a technology and product driven company.
  - Work on an industry-leading product with millions of users.

  WHAT YOU WILL NEED

  - The foremost quality for this position or any position at
    Blockchain.com is integrity.
  - At least 2 years of experience working with JavaScript and
    client-side web applications preferred.
  - Experience building innovative data visualizations.
  - You thrive on learning new technologies and don’t believe in
    one-size-fits-all solutions. That being said, you can
    expect to work with React, TypeScript, NextJS, Styled
    Components
  - You have experience with AI-assisted development tools like
    Cursor to enhance productivity and streamline coding
    workflow.
  - You have experience interacting with crypto apps.
  - You have experience working with Front-End architecture,
    testing and state management solutions.
  - You should be able to adapt easily to meet the needs of our
    massive growth and rapidly evolving business environment.
  - You rely on others' candid feedback for continuous
    improvement.
  - You understand requirements beyond the written word and have
    a sharp eye.
  - Strong analytical and problem solving skills.

  COMPENSATION & PERKS

  - Full-time salary based on experience and meaningful equity
    in an industry-leading company
  - This is a role based in our London office, with a mandatory
    in-office presence four days per week.
  - Work from Anywhere Policy: You can work remotely from
    anywhere in the world for up to 20 days per year.
  - ClassPass
  - Unlimited vacation policy; work hard and take time when you
    need it
  - Apple equipment
  - The opportunity to be a key player and build your career at
    a rapidly expanding, global technology company in an
    emerging field
  - Flexible work culture

  Blockchain is committed to diversity and inclusion in the
  workplace and is proud to be an equal opportunity employer.
  We prohibit discrimination and harassment of any kind based
  on race, religion, color, national origin, gender, gender
  expression, sex, sexual orientation, age, marital status,
  veteran status, disability status or any other
  characteristic protected by law. This policy applies to all
  employment practices within our organization, including
  hiring, recruiting, promotion, termination, layoff, recall,
  leave of absence, and apprenticeship. Blockchain makes
  hiring decisions based solely on qualifications, merit, and
  business needs at the time.

  The personal data you provide will be used by Blockchain to
  process your application. To learn more about your rights,
  see our Applicant Privacy notice.
