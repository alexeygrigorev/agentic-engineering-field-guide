description: |
  About the Role

  Abnormal AI is looking for a Software Engineer to join the
  Portal Platform team.

  Our team’s mission is to uplevel the architecture across our
  different portals here at Abnormal:

  - Customer Portal -  a gateway our customers use to interact
    with Abnormal
  - End User portal - functionality for the users inside the
    companies that have purchased our product
  - Demo portal - a tool to help showcase different combinations
    of our product by GTM teams

  Main themes include helping reach and maintain enterprise
  grade stability, security & usability for our customers
  while enabling application teams to easily develop & deploy
  their frontend components utilising AI-driven workflows.

  This role offers an exciting opportunity to join an AI-
  native company. You will own truly impactful, platform-level
  work, driving cross-functional influence that spans across
  product development and enabling our go-to-market teams.

  You'll join a team of experienced engineers, collaborating
  with them to design components &  drive execution. The ideal
  candidate is comfortable working with a distributed team &
  has worked in a full-stack capacity before in enterprise
  environments.

  What you will do

  - Design and execute platform-level software projects from
    conception through launch, collaborating with senior
    engineers across the organization.
  - Build and maintain backend services and APIs that power our
    portal experiences
  - Build reusable frontend libraries, design systems, and
    developer tooling that accelerate feature delivery across
    product teams
  - Own infrastructure concerns, including CI/CD pipelines,
    deployment automation, and observability for portal
    applications.
  - Drive frontend performance, accessibility, and quality
    standards across our portal applications.
  - Raise the bar of excellence in engineering, actively
    contributing to knowledge sharing within the team, and
    participating in professional development activities.
  - Provide guidance and mentorship for junior members of the
    team
  - Help accelerate the teams with their changes across
    different realms of front-end development

  Must Haves

  - 6+ years of experience as a software engineer, with a track
    record of owning and delivering complex, cross-team
    projects end-to-end
  - Deep expertise in React and modern frontend architecture
    (state management, performance tuning, build tooling,
    design systems)
  - Strong backend proficiency in Python (Django) or TypeScript,
    with experience designing APIs and data models for scale
  - Experience with cloud infrastructure (AWS, Kubernetes,
    CI/CD) and comfort operating production systems
  - Demonstrated ability to influence technical direction —
    you've driven RFCs, architecture decisions, or platform
    migrations
  - Experience mentoring engineers and raising the technical bar
    through code reviews, documentation, and knowledge sharing
  - Strong communication skills, especially in distributed/async
    environments — you write clearly and proactively
  - Proven ability to balance technical debt with feature
    delivery at the platform level
  - You’re growth driven looking to increase impact and
    responsibility over time
  - Strong fundamentals in computer science, data structures,
    and performance optimization.
  - BS degree in Computer Science, Applied Sciences, Information
    Systems or other related engineering field

  Nice to Have

  - Familiarity with our stack (AWS, K8, Python/Django, React,
    Postgres)
  - Experience and eagerness to leverage AI development tools
  - Experience with large scale web frontend applications
  - Experience with front end build tools
  - Experience with micro-frontend architecture patterns
  - Experience with web security (eg. OWASP top 10)

