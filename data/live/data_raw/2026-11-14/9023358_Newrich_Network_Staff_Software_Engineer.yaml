  Company Overview

  Come and Join The New Rich!

  The economic inequality crisis is one of the most defining
  challenges of our time. It’s also the greatest opportunity
  for innovation, and a challenge we’re proud to take on. At
  Newrich, we’re harnessing cutting-edge technology to better
  connect coaches with their communities and help them further
  spread their educational knowledge to their students and
  followers.

  We believe that the key to making the world a better and
  more equal place starts with the empowering the individual.
  And from there- the individual can inspire and empower the
  people around them one by one.

  We all know the old way of living and the old institutions
  that we all used to depend on are slowly crumbling - and a
  new way of life is taking it's place - at a quicker pace
  than ever before.

  The world is changing at a very rapid pace. When all is said
  and done - the world will look a lot different than it looks
  today.

  And we believe that education, inspiration, and motivation
  are the only way to create economic opportunity, alleviate
  poverty and end economic suffering for everyone.

  One of the leading causes of economic inequality and
  suffering? It's not "being born into wealth" or " being in a
  special club". It's a lack of knowledge and skills to
  control your own financial destiny.

  That’s where we come in. At Newrich, we are building the
  next generation creator platform and software tools to not
  only enable business, health, and wellness coaches to more
  efficiently and cost effectively run their creator business
  - but also to grow their audiences with improved visibility
  and algorithmic ranking on our social learning platform.

  We empower digital entrepreneurs to turn their dreams into
  reality. Our mission is simple yet bold: to help people
  create a balanced, fulfilling lifestyle – while building
  wealth and independence along the way.

  Our team spans the Americas and Europe, and we work with
  utility partners across the Americas and beyond. We’re
  outdoor enthusiasts, musicians, artists, athletes, parents,
  and adventurers—4 nationalities strong and growing. What
  unites us is a passion for solving complex problems, a
  commitment to action on economic inequality, and the belief
  that technology should be a force for good.

  We’re a fast-growing team driven by one vision: a world
  where anyone can work remotely, chase their passion, and
  live life on their own terms.

  Our platform combines SaaS tools, e-learning programs, and a
  supportive social network – a one-stop ecosystem designed
  for creators, entrepreneurs, and dreamers who want more than
  just a career.

  We are looking for a Staff Software Engineer who can
  contribute across the product — building new features,
  improving existing systems, and helping the team work more
  efficiently. This is a hands-on role for someone who thrives
  in a dynamic environment and takes ownership of getting
  things done.

  This role is not just about shaping our product - it's also
  about shaping our culture as well.

  You will work across our stack (PHP 8.2 / Laravel 10),
  Node.JS, Golang, and React frontend (React 18 + TypeScript +
  Vite), and AWS infrastructure, contributing directly to
  production code while helping improve workflows,
  documentation, and processes. We hire for attitude and
  ownership over perfect technical mastery.

  We believe fulfilling work and a healthy work-life balance
  is key to living a NewRich Lifestyle.

  If you’re motivated, ambitious, and ready to grow with us,
  we want to hear from you!

  Requirements

  - Tech Stack (Current & Evolving)
  - • Backend: Laravel (PHP), moving toward TypeScript / Go
    services
  - • Database: MySQL (with future evolution toward more
    scalable architectures)
  - • Infrastructure: AWS
  - • Realtime / Messaging: In-house systems (moving away from
    third-party dependencies)
  - • WebRTC, FFMPEG, HLS, SRT, RTMP, DRM.
  - • Node.js/Express, GitHub Actions.
  - • NoSQL (PostgreSQL, Redis).
  - • Experience in a multi-service/microservices-style
    architecture
  - • Familiarity with AWS services such as ECS/ECR, RDS, S3,
    CloudFront, Redis, Amazon MQ, and Lambda
  - • Experience with Infrastructure as Code (especially
    CloudFormation-style templates and environment
    parameterization)
  - • Experience improving GitHub Actions workflows and CI/CD
    pipelines
  - • Familiarity with automated testing and quality tooling
    (Pest/PHPUnit, Vitest, Playwright, ESLint/Prettier, Pint,
    Psalm)Nice to have:
  - You can demonstrate experience scaling large distributed
    architectures.
  - You have experience in working in a remote-first
    environment.
  - You have worked with social media, fintech, or messaging
    applications before.

   Personal qualities:

  Responsibilities:

  - Develop and maintain server-side applications (PHP 8,
    Laravel 10, Node.JS, Golang, MySQL).
  - Build and optimize APIs, ensure performance, scalability,
    and security.
  - Implement front-end features with React.js (18.2).
  - Work with CI/CD pipelines, automated testing, and code
    reviews.
  - Collaborate with cross-functional teams, mentor juniors.
  - Manage integrations between systems and cloud services
    (AWS).
  - Maintain documentation, database schemas, and ensure
    security best practices.

  What Makes This Role Different

  - What You Get

  Compensation

  - Competitive Salary (combination of base + equity + annual
    bonus) (based on location, experience, and company
    performance)
  - Meaningful equity package (early-stage upside)
  - Flexible work environment

  Who You Should Be

  You’re not just a coder—you think in systems.

  You’ve built things that broke at scale—and learned how to
  fix them.

  You care about performance, reliability, and long-term
  architecture, but you also know how to ship fast when it
  matters.

  If you want to help build the infrastructure powering the
  next generation of online businesses, we’d love to talk.

  About Our Team

  We work remotely from 4 different countries and we are
  looking for candidates that are also living and working in
  one of these countries: United States, Canada, Brazil,
  Poland, . We meet up once a year in-person for our
  unforgettable team gathering event. We also offer the option
  to occasionally meet up for in-person collaboration.

  Diversity & Inclusion

  We place enormous value on diversity and inclusion and
  strive to continually bring in people of all genders, races,
  creeds, ethnicities, abilities and backgrounds. We believe
  that the best ideas emerge when people with different
  perspectives and approaches work together on a problem.

  Our values

  Tackling the economic inequality cris is our greatest
  mission.

  We act with urgency.

  Our curiosity fuels our growth.

  We recognize that change is constant, and we find joy and
  power in exploration.

  We’re rooted in diversity.

  Just as ecosystems need biodiversity to thrive, our
  resiliency comes from our differences.

  We Care For Each Other.

  We love the power of machines but we nurture each other as
  humans.

  Trust is fundamental.

  We assume the best in everyone, and we share ideas openly so
  that we have a positive impact.

  Join us to help us build a more resilient world together.

  Benefits

  - Paid Adventure Time – Take an all-expenses-paid remote
    working trip for 3 weeks to a destination of your choice
    with one of our remote work-trip partners. On top of that,
    you’ll have “Me-Days” – flexible personal days you can
    take whenever you need a reset.
  - Fast Growth, Big Upside – We’re a small, ambitious team.
    That means more ownership, faster learning, and a real
    chance to shape the future of our company (and your
    career).
  - Equity + Bonus - Take some early equity and grab a piece of
    our future success. Bonuses paid out based on company
    hitting specific milestones and KPIs.
  - Unlimited Learning – You’ll get full access to every course
    and program on our NewRich platform. We invest in your
    growth because your growth fuels ours.
  - Home Office Stipend – Your setup matters. We’ll support you
    with a budget to create your ideal workspace and provide
    you with a new MacBook to power your productivity.
  - Annual Retreat – Work remote, but meet the team IRL. Every
    year we gather in amazing locations – next stop: Colombia.

