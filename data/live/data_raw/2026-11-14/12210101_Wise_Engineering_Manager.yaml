description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role:

  We’re looking for an Engineering Manager to join the Send
  for Partners team - the team that empowers banks and
  enterprises to leverage Wise’s infrastructure to offer their
  customers world class payments products through their own
  channels.

  You’ll be joining a team that sits at the intersection of
  product innovation and global partnerships, working closely
  with Solutions Engineering, Implementation Success and
  Business Development teams, building scalable and robust
  systems that power our global payment network with partner
  banks and enterprises across the world.

  This is a hands-on leadership role. You’ll be guiding
  engineers, driving technical decision-making, collaborating
  with the team’s Product Manager to deliver reliable,
  scalable systems that power the future of Wise’s payment
  platform.

  What You’ll Be Doing

  - Lead and coach engineers, own hiring, mentoring and
    performance to grow technical capability and delivery
    impact.
  - Translate product strategy into technical roadmaps that move
    KPIs
  - Guide architecture and technical design decisions, ensuring
    we build systems that scale globally.
  - Collaborate with cross-functional teams to support bank
    integrations and expand our payment network.
  - Drive engineering excellence through code reviews, mentoring
    and adoption of best practices.
  - Understand and contribute to team systems deeply enough to
    be hands-on when needed.
  - Identify opportunities to improve the Send product,
    balancing short-term delivery with long-term technical
    health.
  - Have an overview of the broader Wise Platform squad, sharing
    learnings and shaping how we build software company-wide.

  Qualifications

  What You’ll Need to Succeed

  We are fully aware that it is uncommon for a candidate to
  have all skills required and we fully support everyone in
  learning new skills with us. So if you have some of those
  listed below and are eager to learn more, we do want to hear
  from you!

  - Proven experience leading and mentoring high-performing
    engineering teams and growing senior ICs.
  - Technical leadership & system design expertise: strong grasp
    of scalable, distributed systems, event-based
    architectures and microservices; able to make high-impact
    architectural decisions.
  - Product mindset — you think about customer impact, not just
    technical implementation.
  - Leadership through empowerment by providing context, trust
    and clear direction
  - Following and advocating best coding practices, continuous
    delivery and code reviews.
  - Ability to communicate technical concepts clearly across
    teams and stakeholders.
  - Bias to action and comfort with ambiguity — able to move
    quickly while maintaining quality and compliance.
  - Experience with JVM platform (Java/Kotlin/Spring Boot).

  Additional Information

  Interested? Find out more:

  - How we work - a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it’s like to work at Wise London
  - Our engineering career map

  Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £106,000 - £135,000 + RSUs
  - Wise Benefits

