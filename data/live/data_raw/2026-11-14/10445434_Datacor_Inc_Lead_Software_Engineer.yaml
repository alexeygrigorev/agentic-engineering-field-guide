description: |
  About Us:

  Datacor is the leading provider of software solutions,
  including ERP, CRM, Asset Tracking, Simulation and
  Formulation, to the process manufacturing space. We are on a
  mission to better equip the industry with software solutions
  and move it forward by building thoughtful, intuitive
  products that solve our customers’ most difficult problems.

  We are passionate about serving our customers and helping
  them use data as a competitive advantage. Our customers make
  products that extend and sustain lives by sanitizing,
  fertilizing, beautifying, cleaning, and recycling the world
  we live in. We at Datacor help our customers make those
  products you use every day more safely, cost effectively and
  more efficiently through our technology platforms and
  applications.

  GoldSim, a Datacor company, is the world leader in dynamic
  simulation software for water resources, environmental
  systems, and complex engineering problems. Our customers use
  GoldSim to model some of the most challenging questions in
  engineering and science from managing critical water
  supplies to assessing the long-term safety of environmental
  systems.

  We are looking for a Lead Software Engineer who brings deep
  technical expertise, strong initiative, and a passion for
  building software that lasts. In this role you will help
  shape the next generation of our simulation platform and
  push the boundaries of what engineering simulation can do.

  The Role

  As a Lead Software Engineer, you will provide technical
  leadership across the core subsystems of our simulation
  platform. You will guide architectural decisions, champion
  modern engineering practices, lead the delivery of complex
  features, and safeguard the long-term health of the
  codebase. You will operate with significant autonomy and act
  as a trusted expert in your domain.

  What You'll Do

  Architecture & Modernization

  - Shape the architecture of core platform subsystems,
    including UI frameworks, calculation engines, file
    systems, APIs, and licensing.

  - Evaluate design options, weigh trade-offs, and ensure long-
    term performance, scalability, security, and
    maintainability.

  - Drive consistency in design patterns and engineering
    standards across the codebase.

  Execution & Delivery

  - Own the technical delivery of features from initial design
    through release.

  - Translate business and product requirements into technical
    specifications.

  - Lead investigations into complex bugs, performance issues,
    and cross-module interactions.

  Quality & Support

  - Conduct code reviews and coach engineers on writing
    maintainable, scalable code.

  - Partner with QA on test strategy and provide technical
    analysis during triage.

  - Serve as an escalation point for the Support team on
    advanced technical issues.

  Collaboration & Knowledge Sharing

  - Contribute technical input during roadmap planning and
    surface technical-debt concerns.

  - Collaborate on QA automation efforts and CI/CD pipeline
    improvements.

  - Document designs and share knowledge across the team.

  - Partner with the founding engineer to document and scale
    institutional knowledge to enable future team growth

  What You'll Bring

  Required

  - Bachelor's degree in Computer Science or a related field, or
    equivalent practical experience.

  - 5+ years of experience in desktop software development.

  - Proficiency in modern C++ (C++14 or later).

  - Experience developing Windows applications with Visual
    Studio (2019 or later).

  - Experience working in large, legacy codebases with
    established patterns.

  - Strong debugging and critical-thinking skills for complex,
    multi-module systems.

  - Ability to communicate technical concepts clearly to Product
    Managers, QA, Support, and engineering peers.

  - Experience with AI-assisted development tools (Claude Code,
    Cursor, Copilot)

  Preferred

  - Familiarity with Microsoft Foundation Classes (MFC) for
    Windows UI development.

  - Experience with large, multi-component build systems and
    automation.

  - Experience with modern licensing platforms (e.g., FlexNet).

  - Experience with modern numerical libraries.

  - Understanding of Windows system administration and desktop
    deployment.

  - Experience porting C/C++ code to modern C++ and 64-bit and
    other major modernization projects.

  - Experience with object serialization and structured data
    formats (e.g., XML, JSON).

  - Understanding of COM, including interfaces, IDL, COM DLLs,
    and registration.

  - Experience with relational databases (e.g., ODBC).

  - Interest in applying ML to simulation

  Why GoldSim

  Join a team where your work directly shapes software that
  engineers and scientists rely on around the world. You'll
  take on meaningful technical challenges, enjoy real
  autonomy, and help define the future of a product with a
  global reputation for excellence. We have offices across the
  US where you have the opportunity to come in as you would
  like including one in Seattle.

  The anticipated base salary range for this role is $98,000
  to $157,000 per year. Actual compensation will be determined
  based on factors including prior experience, education, and
  geographic location.

  Why you will love working with us:

  - Flexible time off (FTO) policy

  - Paid parental leave
  - Remote-first work environment
  - 401(k) with company contribution
  - Premier medical, vision, and dental insurance with company-
    funded HRA
  - Competitive pay and bonus programs
  - Employee assistance program
  - A culture of rewards and recognition

  EOE Statement:

  Datacor is an Equal Opportunity Employer and does not
  discriminate on the basis or race, color, religion, sex,
  national origin, age, disability, veteran status, or any
  other protected characteristic.

  Use of AI During Interviews:

  At Datacor, we value thoughtful problem-solving and
  authentic perspectives. To ensure a fair and consistent
  evaluation process, we ask that candidates do not use
  generative AI tools or outside assistance during live
  interviews unless explicitly stated otherwise. We're
  interested in hearing your experience, your approach, and
  how you think through challenges.
