description: |
  Founding Software Engineer at Ameba

  Engineering at Ameba is a rare opportunity to build cutting-
  edge software in a traditional industry, while being
  generously rewarded for your contributions. If you’ve never
  considered working in supply chains before, everything
  around you, including the device you're reading this on, has
  a story of how it got there. Raw material to finished
  product, that story is the supply chain. If the unseen
  machinery of the world sparks something in you, we'd love to
  talk!



  We're a startup made up of former founders and builders (ex-
  Palantir, Microsoft, Imperial, ETH Zurich). We have big
  ambitions and are backed by some of the most successful
  investors in Europe. We’ve raised over $9M to date.



  Your Role as a Founding Software Engineer

  As a Founding Software Engineer, you'll help build the next
  generation of AI agents for the physical world. We're
  building systems that turn unstructured emails, documents,
  messages and enterprise data into reliable, autonomous
  workflows that take actions on behalf of our customers.
  Working at a startup so early, it's common to kick off a
  feature on Monday, and have users use it on Friday. You
  should be comfortable working with these tight feedback
  loops and long to build a product that users love. Don't
  worry if you lack experience in any of these areas - your
  application is still welcome!



  We're an AI-native engineering team, both in what we build
  and how we build. We believe the best engineers are
  increasingly those who can combine strong technical
  fundamentals with AI tools to build at a pace that wasn't
  possible a few years ago. We expect engineers to be power
  users of AI coding tools (such as Pi, Claude Code,
  Conductor, Cmux etc), to constantly experiment with new
  workflows, and to push the boundaries of what a small team
  can accomplish. We're looking for people who are genuinely
  excited about this shift, not just willing to adopt it.



  In addition to core engineering responsibilities, engineers
  at Ameba spend around 10% of their time on the road,
  visiting our customers’ warehouses, factories, ports, and
  offices to get their hands dirty and ensure our software
  delivers as much value as possible for them!



  Life at Ameba

  We pride ourselves on providing top-of-market salaries and
  generous equity packages to all employees. We're assembling
  a lean team of exceptionally talented individuals and aim to
  reward them accordingly.

  - We enjoy collaborating together in the office, five days a
    week, for easy, high-bandwidth conversations. While we
    provide flexibility to work from home when necessary, our
    primary focus at this early stage is creating a strong
    office-first experience.
  - We offer 28 holiday days per year, and we shut down entirely
    over the holiday season for 2 weeks, allowing everyone to
    disconnect completely.
  - We provide four months of maternity and paternity leave at
    100% salary.
  - We offer comprehensive healthcare and dental cover.
  - The salary range for this role is £100,000-£130,000 +
    generous equity. The salary for this position is
    determined by several factors, such as experience,
    relevant skills, business needs, or market demands.



  Qualifications

  Essential:

  - Strong product intuition. You can deeply understand customer
    problems, identify what matters most, and translate
    ambiguous needs into simple, impactful product
    experiences.
  - 3+ years of experience shipping production software, with
    strong proficiency in React/TypeScript and an OOP language
    (Kotlin, Java, Python, C#).
  - High agency, you should be comfortable owning features end-
    to-end, making technical decisions and shipping fast.
  - Deep experience with AWS, Terraform, CI/CD, observability,
    and building scalable, reliable production systems.



  Desirable

  - Harness engineering experience.
  - Experience with OpenAPI, gRPC/Protocol Buffers.
  - Previous early-stage startup experience.
