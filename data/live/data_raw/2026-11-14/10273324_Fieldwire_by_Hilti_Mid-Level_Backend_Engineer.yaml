description: |
  Who we’re looking for

  Have you ever found yourself feverishly working with an
  Engineering team to solve a complex problem--and found that
  after what had felt like an hour had only been 10 minutes?
  If so, we’re looking for hardworking and passionate
  engineers like yourself to join our Backend team at
  Fieldwire!  You will be one of the engineers behind our
  backend--focusing with your team on your common interest in
  distributed backend systems, their scalability (we’re
  growing!), as well as their continued development.  Your
  work building our core platform features and services will
  directly impact all of our nearly million end users and
  4,000 companies who rely on Fieldwire for their Construction
  Management needs.  If you have strong experience in keeping
  apps secure, scalable, and performant--then click the Apply
  Now button today to speak with one of our amazing recruiting
  coordinators!

  What you’ll be doing

  The primary responsibilities of our next Mid-Level Backend
  Engineer will be to:

  - Build and maintain our production services at scale
  - Develop new features to support internal & external
    customers
  - Debug production issues across services and multiple levels
    of the stack
  - Develop seamless integrations between Fieldwire and external
    services and partners to delight our customers
  - Improve engineering standards, tooling, and processes
  - Releasing a rapidly growing API while ensuring 100% backward
    compatibility
  - Building services with efficient auto-scaling to handle both
    peak and non-peak loads
  - Participate in on-call rotation

  At Fieldwire, we’re looking for our next Mid-Level Backend
  Engineer to have the following skills and experiences:

  - Bachelor’s or Master’s degree in Computer Science or
    equivalent work experience
  - 3+ years experience in a Backend role
  - Experience with modern web application development and
    relational databases
  - Known for writing the cleanest, most well-tested, and
    modular code on the block
  - Understanding of algorithms and data structures

  And if you have any of the following, we REALLY want you to
  apply today!

  - Experience with Ruby on Rails or Rust
  - Have previously worked on high-traffic web applications and
    services
  - Working knowledge of Docker and containerization
  - Experience with AWS

  Compensation:

  The estimated pay ranges for this role are as follows:
  $145,000.00 - $170,000.00

  The salary range represents the low and high end of the
  salary range for this job in the US. Minimums and maximums
  may vary based on location. The actual salary offer will
  carefully consider a wide range of factors such as your
  skills, qualifications and experience. In addition to the
  salary you may be eligible for a corporate bonus which can
  range up to 30%.

  Why Fieldwire?

  The field-first construction platform for less busywork and
  more building. Trusted on 4M+ projects worldwide, Fieldwire
  by Hilti gives crews reliable access to plans, tasks, and
  updates on one simple platform. It unites the field and
  office around a single, transparent source of truth, keeping
  teams aligned from start to finish. Designed for easy
  adoption, crews gain real-time visibility into progress,
  clear ownership of work, and the context to make confident
  decisions. As part of the Hilti Group, Fieldwire combines
  deep construction expertise with modern digital innovation
  to deliver better outcomes on every job. Learn more at
  Fieldwire.com.

  Where is the job located?

  This role is fully remote within the United States. Our
  headquarters are based in beautiful San Francisco and our
  office is centrally located right off of Embarcadero Bart
  station.

