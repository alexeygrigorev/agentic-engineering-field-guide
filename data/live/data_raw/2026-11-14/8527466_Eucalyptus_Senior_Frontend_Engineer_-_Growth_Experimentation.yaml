description: |
  We're the world's leading consumer healthcare platform,
  supporting millions of patients across the US, Australia,
  the UK, Germany, Japan, Spain and Canada.

  We're driven by the belief that good health should last a
  lifetime, and that to get there we need to deliver the
  personalised, high quality and empathetic care that the
  traditional system cannot support.

  You'll partner with our care teams of prescribers, nurses,
  health coaches, pharmacists and dietitians to support
  patients across preventative health, weight management and
  specific women's and men's health conditions.

  We joined Hims & Hers so that you can do all of the above on
  a bigger scale, with more ambition, a stronger global brand
  and the resources to deliver care to patients in dozens of
  countries.

  We're looking for people who appreciate and are excited by
  the enormity and uniqueness of this challenge, and want to
  work in the most ambitious, smart, fast moving and positive
  sum environment of their lives to transform how healthcare
  is delivered globally.

  We hope that's you.

  Own our Frontend Web, run growth experiments, and shape
  product impact

  At Eucalyptus, we’re on a mission to make healthcare
  simpler, safer, and more accessible. Patients face friction
  when navigating care, and the Growth squad focuses on
  building frontend web experiences that directly move key
  metrics—retention, engagement, and conversions—while shaping
  the overall patient experience.

  One of the key initiatives you’ll contribute to is
  experimentation across the frontend platform, designing and
  testing features that influence how patients engage with our
  services. This is a chance to drive measurable impact and
  shape best practices for the platform used across the
  business.

  Our stack: React, React Native, GraphQL Federation, Go,
  TypeScript, gRPC, Pub/Sub, Kubernetes, GCP.

  The impact you will have

  - Take ownership of the frontend web platform, ensuring
    scalable, polished, high-performance experiences
  - Design and deliver growth-focused experiments that improve
    retention, engagement, and conversions
  - Collaborate closely with product and marketing to translate
    insights into actionable features
  - Influence frontend best practices across the team and mentor
    teammates

  Who succeeds here

  You’ll likely succeed if you:

  - Have strong React & TypeScript experience, with full
    ownership of web products
  - Are experienced working on frontend platforms or product-
    facing web apps
  - Have a commercial mindset, understanding how features and
    experiments impact business metrics
  - Thrive in autonomous, senior-level roles, able to take
    ownership end-to-end

  You don’t need to tick every box — if this role excites you,
  we’d still love to hear from you.

  Nice to haves

  - Growth-focused engineering experience
  - Experience with GraphQL

  This is a senior, high-autonomy role where engineers get to
  own the frontend experience, define best practices, and
  directly influence growth metrics. You’ll work in a team
  that values experimentation, collaboration, and measurable
  impact, shaping features that truly move the needle for
  patients and the business.

  If driving growth through product engineering and shaping
  high-impact patient experiences sounds exciting, we’d love
  to hear from you.



  At Eucalyptus, we value individuals from all backgrounds,
  experiences, and perspectives, and we embrace the unique
  qualities each person brings. When you apply, please let us
  know of any reasonable adjustments you may need during the
  interview process. We use AI-assisted tools across our
  business to help our teams work more efficiently, including
  within our recruitment process. These tools support our team
  — all hiring decisions are made by real people, and every
  application is reviewed by a member of our recruitment team.
