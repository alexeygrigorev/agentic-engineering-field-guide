  Job Description:

  We are seeking a highly skilled Senior Developer with over
  10 years of experience in software development, specializing
  in Node.js, Micro-Service architecture, and Cloud
  Development. The ideal candidate will have a strong
  background in designing and implementing complex workflow
  systems, and experience integrating client application with
  back-end storage system in the cloud. Extensive hands-on
  experience with cloud platforms such as Azure and AWS.
  Proficiency with ETL tools is essential for this role. This
  position offers an exciting opportunity to lead and
  contribute to the development of scalable and innovative
  solutions in a dynamic environment.

  We are looking for a Senior Developer who is passionate
  about leveraging cutting-edge technologies to build scalable
  and innovative solutions. Join us in driving forward our
  mission to deliver exceptional products and services through
  advanced software development practices.

  Key Responsibilities:

  - Design and develop scalable and secure applications using
    Node.js and Micro-Service architecture principles.
  - Deploy and manage applications on cloud platforms, primarily
    Azure and AWS.
  - Design and implement data processing and integration
    solutions using ETL tools.
  - Collaborate with cross-functional teams (including UI/UX
    designers, product managers, and other developers) to
    deliver high-quality solutions.
  - Optimize applications for performance, scalability, and
    cost-efficiency in cloud environments.
  - Ensure adherence to security and compliance best practices
    throughout the development lifecycle.
  - Write clean, maintainable, and testable code.
  - Provide technical leadership, mentorship, and code reviews
    to junior developers.

  Qualifications:

  - 10+ years of experience in developing IT solutions and cloud
    infrastructures.
  - Bachelor's degree in Computer Science, Computer Programming,
    Computer Engineering, UI/UX Design or relevant computer-
    based major.
  - Experience in software engineering and design architectures.
  - Experience and understanding of best practices regarding
    system security measures.
  - Experience with building and migration software and IT
    services to align to strategic business needs and goals.
  - Experience in conducting research for advanced technologies
    to determining how IT can support business needs
    leveraging software, hardware, or infrastructure.
  - Excellent problem-solving skills and ability to troubleshoot
    complex issues.
  - Strong communication and interpersonal skills, with a
    collaborative mindset.
  - Ability to articulate design concepts and decisions to
    stakeholders.
  - Ability to work effectively in a fast-paced environment.
  - Proven track record of delivering scalable and reliable
    software solutions.

  Must Have:

  - Minimum of 7 years of professional experience in software
    development with expertise in Node.js and Micro-Service
    architecture.
  - Extensive experience implementing authentication and
    authorization protocols (e.g., OAuth2.0)
  - Extensive experience developing RESTful APIs and event-
    driven architecture.
  - Experience working with API Documentation and Design tools
    (e.g., Swagger)
  - Strong knowledge of Cloud Development principles and
    practices, with hands-on experience in Azure.
  - Experience developing application using serverless
    architecture and/or containerization (e.g., Azure
    Functions, Docker, Kubernetes).
  - Experience developing complex workflow systems leveraging
    cloud technologies.
  - Experience integrating a client application with a back-end
    storage system (e.g., DocumentDB, SQL, CosmosDB).
  - Experience developing unit tests and provide code coverage.
  - Experience with version control systems (e.g., Git) and
    CI/CD pipelines.
  - Excellent problem-solving skills and ability to troubleshoot
    complex issues.
  - Proven track record of delivering scalable and reliable
    software solutions.
  - Experience working in an Agile development environment using
    DevSecOps principles and tools.

  Nice to Have:

  - Associate or Professional level certifications in one or
    more cloud platforms (e.g., Azure, AWS, GCP, OCP).
  - Proficiency in ETL tools for data integration and
    transformation (e.g., Azure Data Services).
  - Knowledge of multiple cloud platforms and services.
  - Experience implementing Case Management Systems.
  - Experience with ReactJS development.
  - Experience with Databricks and/or Snowflake

  Communication and Organizational

  - Excellent presentation and communication (oral and written)
    skills.
  - Consultant mindset with the ability to work with high level
    customer stakeholders and build excellent customer
    relationship.
  - Experience identifying and applying industry tools,
    solutions, methods best practices, and emerging
    technologies.
  - Strong analytical skills and problem-solving skills with the
    ability to formulate and communicate recommendations for
    improvement.
  - Experienced with process design and documentation
    methodologies, and design and production of quality
    deliverables, process and use case modeling, business case
    development.
  - Demonstrated ability to work effectively, independently, and
    as part of a team.
  - Strong project management, leadership & meeting facilitation
    skill with knowledge of Project Life Cycle

