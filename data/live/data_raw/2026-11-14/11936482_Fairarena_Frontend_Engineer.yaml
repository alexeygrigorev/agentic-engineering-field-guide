description: |
  About the Role

  We're looking for a Frontend Engineer to build intuitive,
  high-performance interfaces that make managing cloud
  workspaces effortless. You'll work on the core developer
  experience, from workspace creation and management to real-
  time resource monitoring and interactive development tools.

  What You'll Do

  - Build responsive, high-performance web applications using
    React and Next.js.
  - Develop intuitive interfaces for cloud workspaces, resource
    management, and billing.
  - Integrate frontend applications with backend APIs and real-
    time services.
  - Improve application performance, accessibility, and
    usability.
  - Collaborate with backend engineers and product teams to
    deliver new features.

  What We're Looking For

  - Strong skills in JavaScript/TypeScript, React, and modern
    frontend development.
  - Experience with Next.js, CSS, and responsive UI design.
  - Understanding of REST APIs, state management, and frontend
    architecture.
  - Ability to build clean, maintainable, and reusable
    components.
  - Strong problem-solving skills and attention to detail.

  Nice to Have

  - Experience with Tailwind CSS and data visualization
    libraries.
  - Familiarity with WebSockets and real-time interfaces.
  - Experience building dashboards, developer tools, or SaaS
    applications.

  Why Join Velocity?

  - Build interfaces used by developers working with cloud
    infrastructure.
  - Solve real-world challenges in developer experience and
    application performance.
  - Take ownership of features and contribute to product
    decisions.
  - Work with a team building modern cloud development tools.
