description: |
  About Redesign Group

  The Redesign Group is a global technology and cybersecurity
  Solution Provider leveraging design thinking, interdependent
  subject matter expertise, and emerging technology solutions
  to help organizations achieve meaningful transformation. Our
  globally diverse team members, partnerships with strategic
  technology manufacturers, and cybersecurity services
  position us to be a business partner that’s ready for what’s
  next.

  We live by our core values of operating in the service of
  others, being problem solvers, and focusing on long term
  partnerships. You’ll excel at Redesign if you thrive in a
  rewarding environment that moves quickly, challenges you to
  grow and fosters collaboration. We seek candidates with a
  hands-on customer-first approach, robust interpersonal and
  communication skills, strong work ethic and excellent time
  management. While teamwork is expected, the ability to work
  independently in a fast-paced environment is crucial.

  Job Description

  The Redesign Group is seeking a Solution Engineering Manager
  to lead our Specialty Sales Practice. This role combines
  hands-on technical leadership with people management,
  overseeing a team of Solution Engineers who support a broad
  datacenter portfolio spanning data protection, storage,
  compute, and networking.

  The ideal candidate is a well-rounded datacenter generalist
  with a strong understanding of data protection, storage
  (e.g., PowerStore, PowerVault, Unity, PowerScale), compute
  (Hyper-V, VMware, VCF, and other hypervisors), and
  networking fundamentals, including firewalls, L2/L3
  switching, routing and switching, and site-to-site IPSec/VPN
  connectivity.

  This is a remote, U.S.-based role reporting to the Director
  of Solution Engineering.

  Key Responsibilities

  - Lead, coach, and develop a team of approximately five
    Solution Engineers supporting the Specialty Sales
    Practice.
  - Partner with the sales team to scope, design, and present
    multi-discipline datacenter solutions spanning data
    protection, storage, compute, and networking.
  - Provide hands-on technical expertise across storage
    platforms (e.g., PowerStore, PowerVault, Unity,
    PowerScale), compute and virtualization (Hyper-V, VMware,
    VCF, and other hypervisors), and core networking
    (firewalls, L2/L3 switching, routing and switching, and
    site-to-site IPSec/VPN).
  - Serve as a technical escalation point for complex, multi-
    product specialty opportunities.
  - Ensure accurate technical scoping and a smooth handoff from
    pre-sales to delivery and professional services teams.
  - Build and maintain reference architectures, demo
    environments, and enablement content across specialty
    product lines.
  - Recruit, hire, and manage the performance and development of
    Solution Engineers within the practice.
  - Track and report on team pipeline support metrics, win
    rates, and technical win/loss themes.
  - Stay current on the evolving specialty product portfolio and
    competitive landscape.
  - Collaborate cross-functionally with the VCF Practice and
    other technical teams on multi-practice opportunities.

  Required Skills & Experience

  - 5–8 years of experience in enterprise IT with broad, hands-
    on datacenter exposure across data protection, storage,
    compute, and networking.
  - Working knowledge of data protection and backup solutions.
  - Hands-on experience with enterprise storage platforms such
    as PowerStore, PowerVault, Unity, PowerScale, or
    equivalent.
  - Solid understanding of compute and virtualization
    technologies, including Hyper-V, VMware, VCF, and other
    hypervisors.
  - Solid networking fundamentals, including firewalls, L2/L3
    switching, routing and switching, and site-to-site
    IPSec/VPN connectivity.
  - Prior experience managing, mentoring, or informally leading
    a technical team.
  - Proven ability to translate complex technical concepts for
    both technical and business audiences.
  - Strong communication, collaboration, and organizational
    skills.
  - Ability to operate effectively in a remote, distributed team
    environment.

  Preferred Qualifications

  - Vendor certifications across storage, compute, or networking
    disciplines.
  - Experience with cyber recovery and ransomware resilience
    solutions.
  - Familiarity with SOW-based professional services engagements
    and delivery handoff processes.
  - Prior people-management experience within a pre-sales or
    solution engineering organization.
  - Experience selling or supporting multi-product datacenter
    modernization deals.

  Background

  - Bachelor’s degree in a related technical field or equivalent
    practical experience.
  - 5–8 years of experience in enterprise IT, with broad
    exposure across datacenter disciplines rather than deep
    specialization in a single area.
  - Demonstrated track record supporting complex, multi-
    stakeholder infrastructure sales cycles.
  - Experience within a solution provider, VAR, or systems
    integrator environment is a plus.

  Additional Compensation: This position is eligible for
  discretionary incentive compensation and/or bonus
  opportunities based on individual and company performance.

  Benefits

  We offer a comprehensive benefits package which may include:

  - Medical, Dental, and Vision Insurance
  - 401(k) retirement plan with company match (annual dollar cap
    applied)
  - Flexible time off plan
  - 15 paid holidays
  - Sick leave (amount varies by state requirements and is at
    least the minimum required by any state)
  - Short-term and long-term disability
  - Life insurance
  - Paid parental leave

  We’re an Equal Opportunity and Affirmative Action Employer
  and welcome applicants from all backgrounds. We consider
  qualified candidates without regard to any legally protected
  status. This role is subject to applicable employment laws
  based on work location. In compliance with pay transparency
  laws, the compensation range for this role is included, with
  final pay based on experience, skills, and location. We
  participate in E-Verify to confirm employment eligibility
  and are happy to provide reasonable accommodations
  throughout the hiring process—just let us know how we can
  help.
