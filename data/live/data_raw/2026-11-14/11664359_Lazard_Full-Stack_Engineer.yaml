description: |
  Lazard is one of the world’s preeminent financial advisory
  and asset management firms. Our people and culture make the
  difference. While global in presence and reach, ours is a
  close, collaborative community of just over 3,000
  professionals. Lazard is a place of continuous knowledge
  sharing, skill development and relationship building, where
  professionals grow and succeed together. Our entrepreneurial
  culture, flat structure and embrace of individual
  differences, allow creative ideas, original concepts, and
  unique perspectives to drive our business forward — and for
  careers to take flight.


  We’ll trust you to:

  - Lead the design, build, and maintenance of production-grade
    full stack applications supporting investments and
    distribution
  - Own architecture and technical design decisions for backend
    services and APIs built in Python and modern frameworks
  - Build and guide the development of front-end components and
    user interfaces for internal business users
  - Work across the full stack, with a strong emphasis on
    backend engineering and data-driven applications
  - Deploy and operate applications using modern engineering
    practices, including infrastructure as code,
    observability, and resilience
  - Embed AI and ML capabilities into business workflows, taking
    models from prototype to monitored production services
  - Collaborate with engineers, data specialists, and business
    stakeholders to deliver scalable solutions
  - Set engineering standards through code reviews, design
    reviews, and CI/CD and testing best practices

  You’ll need to have:

  - 5-10 years of professional software engineering experience
  - Bachelor’s or advanced degree in Computer Science, Data
    Science, or a related field
  - Prior experience in asset management, investment management,
    or a closely related part of financial services (e.g.,
    wealth, institutional, or fund distribution)
  - Proven experience building and running production
    applications, not research or purely experimental
    environments
  - Strong backend development experience using Python
    Experience working across the full stack, including modern
    front‑end frameworks (e.g., React or similar)
  - Experience building APIs and working with relational
    databases (SQL)
  - Experience deploying applications in cloud environments,
    preferably Microsoft Azure Experience
  - Demonstrated success in delivering AI solutions with
    measurable business impact
  - Hands-on experience in machine learning algorithms and
    productionizing AI models
  - Demonstrated success delivering AI solutions with measurable
    business impact
  - Strong communication skills and the ability to influence
    technical and non-technical stakeholders

  It’s a bonus to have:

  - Familiarity with investment data and distribution analytics
    (e.g., flows, AUM, sales and engagement data, product and
    performance data)
  - Experience supporting sales, marketing, or client-facing
    platforms
  - Experience working alongside data science and analytics
    teams on data-driven applications
  - Experience with data platforms and pipelines (e.g.,
    Databricks, Snowflake, Azure Data Factory)

  What we offer:

  We strive to enhance the total health and well-being of our
  employees through comprehensive, competitive benefits. Our
  goal is to offer a highly individualized employee experience
  that enables you to balance your commitments to career,
  family, and community. When you work for Lazard, you are
  working for an organization that cares about your unique
  talents and passions, and will continue to invest in the
  development of your career.

  We expect the base salary range for this role to be
  approximately $170,000 - $200,000 USD. Various factors
  contribute to determining the actual base compensation
  offered, including but not limited to the applicant’s years
  of relevant experience, career tenure, qualifications, level
  of education attained, certifications or other professional
  licenses held, and relevant skills for the role. Base salary
  is one component of Lazard’s compensation package, which
  also includes comprehensive benefits and may include
  incentive compensation.



  Does this sound like you?

  Apply! We’ll get in touch on the next steps.


  Representation at Lazard

  Lazard is an intellectual capital business committed to
  delivering the best advice and solutions to clients. To
  achieve these objectives, we focus on attracting, developing
  and retaining the best talent. We believe that a workforce
  comprised of people who represent a wide array of
  backgrounds, experiences and perspectives creates a rich
  variety of thought that empowers us to challenge
  conventional wisdom, solve problems creatively and make
  better decisions.

  Lazard was built on the premise that a multicultural firm
  can best serve a global clientele. As a global firm that has
  grown organically from local roots in different countries,
  we have a deep tradition of respecting and appreciating
  individual differences. Doing so has been core to our
  success for over 175 years. We are committed to sustaining
  an environment where every colleague is supported in their
  professional pursuits, can maximize their individual
  potential and contribute to our collective success.

