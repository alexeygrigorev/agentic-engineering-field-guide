description: |
  About Us

  Rivian and Volkswagen Group Technologies is a joint venture
  between two industry leaders with a clear vision for
  automotive’s next chapter. From operating systems to zonal
  controllers to cloud and connectivity solutions, we’re
  addressing the challenges of electric vehicles through
  technology that will set the standards for software-defined
  vehicles around the world.

  The road to the future is uncharted. By combining our
  expertise across connectivity, AI, security and more, we’ll
  map a new way forward. Working together, we’ll create a
  future that’s more connected, more intelligent, more
  sustainable for everyone.

  Role Summary

  At Rivian and Volkswagen Group Technologies we have the
  exciting challenge of building and integrating a core
  technology platform into multiple brands across many
  different regions. Critical to the success of this endeavor
  are the software integration engineers who serve as our
  critical interface and system advocate with domain teams
  across the vehicle. As a software integration engineer you
  will be the go-to person for system understanding, issue
  triage, system development, and escalation and as a result
  have opportunities to work across the entire vehicle system.
  This role is based in our Berlin office and requires a
  minimum of three days per week onsite, with occasional
  travel to other company and partner sites as needed.

  Responsibilities

  - Directly support bring up of new platforms and software
    integration from the prototype stage all the way through
    production
  - Drive development, integration and delivery of new system
    features, filling in wherever necessary technically to
    achieve system goals
  - Drive necessary test automation and fleet monitoring tools
    to ensure persistent quality of vehicle features
  - Collaborate cross-functionally with feature partners and
    domain teams to improve system design, test coverage, and
    resolve issues
  - Perform fleet-level analysis of system performance to drive
    development and integration priorities
  - Travel as necessary to work with domain counterparts and
    grow your own understanding of vehicle systems and tools.

  Qualifications

  Minimum Qualifications:

  - Bachelor of Science in Computer Science, Computer
    Engineering, Electrical Engineering, Software Engineering,
    or a related field
  - Experience developing in Python (preferred), Rust
    (preferred), C, C++,, Golang, or
  - Experience with systems engineering and analysis
  - Experience working on complex, cross-functional, distributed
    embedded systems
  - Excellent communication and cross-functional collaboration
    skills

  Preferred Qualifications

  - Experience working in a continuous integration environment
  - Experience with networked embedded systems (CAN, Ethernet,
    LIN, DOIP, ISOTP)
  - Experience with embedded flashing protocols (UDS, XCP)
  - Familiarity with vehicle diagnostics and common UDS services
  - Familiarity with cybersecurity concepts
  - Experience with TCP/IP systems, IPv4/6, HTTP/Rest, gRPC
  - Experience with systems engineering analysis tools (FMEA,
    DFMEA, HARA)
  - Experience with industry tools such as Canalyzer, PCAN-
    Explorer, Wireshark

  Total Rewards

  We build the exceptional — and we believe the people doing
  that work should be rewarded accordingly. In addition to a
  competitive base salary, full-time positions may be is
  eligible to participate in our annual company performance
  bonus program.

  Payments are discretionary and not guaranteed; actual
  amounts depend on company results and the terms of the plan
  in effect, and require active employment at the time of
  payout. This role is also eligible for equity in the form of
  Restricted Stock Units (RSUs), subject to board approval and
  the terms of our equity incentive plans, including
  applicable vesting requirements.

  In addition to our compensation programs, we invest in our
  people with a comprehensive benefits package designed to
  support the health, wellbeing, and financial future for
  full-time employees — including health coverage, retirement
  savings, time off, and family planning programs. Offerings
  vary by country. Learn more about our global benefit
  programs.

  External candidates can apply for this role through the
  Rivian and Volkswagen Group Technologies careers site
  (https://rivianvw.tech/#careers). If you are a current
  employee, please apply through our internal job board.

  Equal Opportunity

  Rivian and Volkswagen Group Technologies is committed to
  creating a diverse environment and is proud to be an equal
  opportunity employer. All qualified applicants will receive
  consideration for employment without regard to race, color,
