description: |
  At Garten, we are pioneering a modern approach to health and
  wellbeing in the workplace, because we know that a team that
  is filled with inspiration and equipped to face the day can
  change the world.

  Born from a desire to democratize wellness, we set the
  standard for healthier living in today’s workplace. Through
  curated nutrition to proprietary data analysis, we transform
  the way our client partners support their most important
  asset, their employees.

  In many areas of Garten, engineers have developed a deep
  understanding of the field operations and management it
  takes to deliver healthy food and beverage to our clients’
  offices. In this next era, we're at a much earlier stage in
  the evolution of our products. That means unprecedented
  challenges — and abundant opportunities to make far-reaching
  impact with our clients nationwide. Our vision is to set a
  new benchmark for the industry—driving innovation beyond the
  breakroom.

  We are in search of creative and experienced engineering
  leaders. We embrace entrepreneurs as well as those who come
  from more established organizations. Software Engineering
  Managers are clearly characterized by progressive technical
  experience and demonstrated progression in management
  responsibility. You have also kept your coding skills sharp
  and bring an unwavering passion for managing the dynamics of
  a fast-paced environment.

  Specifically, you will

  - Be a combination of a highly-technical hands-on software
    engineer and an effective people manager.
  - Recruit, inspire, and develop team members.
  - Drive technical discussions, be a subject matter expert, and
    have strategic influence.
  - Communicate cross-functionally across various teams,
    organizations and internal and external stakeholders to
    drive engineering efforts.
  - Work together with product management and UX design teams to
    design and develop front-end interfaces, underlying APIs
    and backend systems across different programming
    languages.
  - Encourage a data-driven culture to improve the efficiency,
    scalability, stability and security of business
    applications and in-house systems to help scale the
    company.

  About You

  - You have a passion for, and experience in solving large-
    scale distributed systems challenges. You have had a
    demonstrated success as an engineer/architect of complex
    distributed systems prior to transitioning into manager.
  - You are experienced using technologies in cloud-based
    deployments (AWS preferred)
  - You are equally passionate about working with engineering
    and non-engineering stakeholders. A strong partner, who
    can collaborate effectively and selflessly.
  - You are a strong communicator, with the ability to share
    technical ideas and direction across the organization and
    a proven ability to influence decision making at all
    levels within the organization and in a variety of
    contexts.
  - You have experience in building and leading a talent dense
    team of senior engineers, and are comfortable delivering
    and accepting candid feedback.
  - You are great at strategizing vision, evolving roadmaps
    based on changing business needs and motivating teams to
    execute on them

  Garten’s  mission is to empower people to live healthful and
  blissful lives.  Through our platform and services, we're
  building a different kind of company that connects employers
  to their employees. We focus on three core beliefs:

  - Work is changing, so must the workplace
  - Food is the foundation
  - Inspired employees radiate energy and drive creativity
