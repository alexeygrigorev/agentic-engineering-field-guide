description: |
  THE ROLE & THE TEAM

  As a Software Engineer in the Transport Planning
  Optimization team within the Logistics Technology
  department, you will design and implement crucial systems
  that power the efficient delivery of millions of items to
  our customers.

  Our Berlin-based team is dedicated to building and
  continuously improving a robust Transport Management System.
  Your work will focus on creating intelligent, scalable
  solutions that optimize transport plans, from initial
  forecasts and scheduling to final execution and settlement,
  leveraging real-time data and advanced algorithms.

  You will have a huge impact on the performance and cost-
  effectiveness of Zalando's Logistics while continuously
  growing your fullstack skillset in a collaborative,
  learning-focused environment.

  Find out more about our Software engineer team:
  https://jobs.zalando.com/en/what-we-do/software-engineering

  INCLUSIVE BY DESIGN

  If you think you have what it takes, we encourage you to
  apply even if you don't meet every single requirement. You
  may just be the right candidate for this or other roles!

  At Zalando, our vision is to be the leading pan-European
  ecosystem for fashion and lifestyle e-commerce – one that
  thrives on diversity and is truly inclusive by design. We
  believe that diverse teams fuel innovation and creativity,
  and we actively seek out talent from all backgrounds.

  We actively seek to reduce bias in our hiring and employment
  processes, focusing on your qualifications, skills, and
  contributions. To support this, we kindly ask that you
  refrain from including personal details such as your photo,
  age, or marital status in your CV, ensuring a fair and
  equitable evaluation based solely on your abilities and
  potential.

  We are committed to providing an exceptional and accessible
  candidate experience for everyone. If you require any
  accommodations to support you throughout the hiring process,
  please let us know – we are here to assist you.

  Discover more about our commitment to creating a diverse and
  inclusive workplace: https://jobs.zalando.com/en/our-
  culture/diversity-and-inclusion

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

  - Designing, developing, deploying, operating, and improving
    performant, fullstack software solutions using Kotlin for
    the backend and TypeScript with React for the frontend,
    directly impacting the efficiency and cost of the
    transport planning optimization processes at Zalando
    Logistics
  - With your expertise, help plan our sprints and roadmaps by
    breaking down new and existing feature requests into
    manageable stories and tasks. Implement and fully test new
    features before deploying them to production using a
    continuous delivery model of deployment
  - Collaborating with other teams and stakeholders to align on
    timelines and priorities of new features to ensure smooth
    and uninterrupted operations
  - Continuously improving the code base and your skillset as a
    software engineer, as well as helping your colleagues to
    do so

  WE’D LOVE TO MEET YOU IF

  - You have proven professional experience as a software
    engineer in JVM-based languages, with proven proficiency
    in Kotlin, and an understanding of SQL and high-
    performance database architectures.
  - You have some experience with modern frontend development
    using TypeScript and React.
  - You not only have proven experience with integrating APIs
    but also in designing and implementing them as part of a
    microservice landscape deployed on cloud
    architectures/platforms
  - You have a strong sense of reliability, of responsibility,
    and ownership. Entrepreneurial & analytical thinking add
    to your excellent communication skills and willingness to
    share knowledge
  - You have experience in all parts of the software development
    life-cycle, from understanding the requirements to
    software development, build, test, deployment, and
    operations

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - 27 days of holiday a year to start for full-time employees
    (+1 day for every calendar year up to 30 days)
  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Lounge by Zalando, discounts from
    external partners
  - Family support, including counselling and dedicated services
    for parents and carers
  - Company pension scheme
  - Employee shares programme
  - Health and wellbeing options, including Wellhub
  - Mental health support and coaching
  - Development through our training platform and biannual peer-
    to-peer review
  - 2 paid volunteering days a year
  - Relocation assistance (subject to prior agreement)
