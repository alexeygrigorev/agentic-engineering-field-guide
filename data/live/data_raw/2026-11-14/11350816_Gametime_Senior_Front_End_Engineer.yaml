description: |
  About Us:

  Live experiences help people cross today’s digital divide
  and focus on what truly connects us – the here, the now,
  this once-in-a-lifetime moment that’s bringing us together.
  To fulfill Gametime’s mission of uniting the world through
  shared experiences, we make it easy for people to discover
  and access the live experiences that matter most.



  With platforms on iOS, Android, mobile web and desktop
  supporting more than 60,000 events across the US and Canada,
  we are reimagining the event ticket industry in order to
  move at the speed of life.

  Engineering at Gametime

  Join a team where you can move fast, own meaningful
  problems, and see your work impact millions of users.

  At Gametime, engineers take end-to-end ownership across
  product, platform, and infrastructure. We value strong
  technical judgment, high standards and a collaborative
  culture built around shipping, learning, and continuous
  improvement.

  We're also investing heavily in AI. From internal
  engineering tools and agentic systems to building an AI-
  ready marketplace and platform. Engineers who are excited to
  experiment, automate, and help shape how AI transforms our
  products and workflows will have the opportunity to
  influence the future of the company.

  The Opportunity

  We’re hiring Senior Front End Engineers at Gametime to help
  build and scale the systems, applications, and experiences
  that power Gametime for millions of users. You’ll own a
  significant surface area of our consumer-facing web and
  mobile web experience—the product millions of fans use to
  discover events, find the best seats, and complete purchases
  in seconds. You’ll work closely with Product, Design, and
  backend engineers to ship features that move core metrics,
  and you’ll raise the bar on craft, performance, and
  reliability across the team.

  This is a high-ownership role on a small, focused team.
  You’ll be expected to drive technical decisions, mentor
  other engineers, and partner directly with stakeholders to
  define how features get built—not just implement what’s
  handed to you.

  Level Expectations

  Senior Engineer – Typically 6+ years of experience. Delivers
  complex solutions independently and contributes to technical
  decisions.

  We hire based on impact and capability, not just years of
  experience. We encourage you to apply and your level will be
  fully determined and agreed in the interview process.

  What You’ll Do

  - Own high quality end-to-end delivery of major consumer-
    facing features—from technical design through launch,
    experimentation, and iteration.
  - Drive frontend architecture decisions: component design,
    state management, data-fetching patterns, and performance
    budgets.
  - Build and optimize conversion-critical flows (event
    discovery, seat selection, checkout) with a relentless
    focus on speed, reliability, and UX quality.
  - Design, instrument, and interpret A/B experiments in
    partnership with Product and Data; use results to validate
    and sharpen product decisions.
  - Instrument frontend observability—error tracking,
    performance monitoring, real-user metrics—and act on what
    you find.
  - Contribute to design-system components and front-end
    standards that accelerate the whole team.
  - Mentor junior and mid-level engineers through code review,
    pairing, and technical leadership on shared initiatives.
  - Collaborate with mobile, backend, and platform teams to
    deliver cohesive cross-platform experiences.

  What You’ll Bring

  - Experience with React Native and TypeScript or cross-
    platform mobile development.
  - Familiarity with Next.js or similar SSR/SSG frameworks and
    edge-rendering patterns.
  - Proficient with modern state management (Zustand, Redux
    Toolkit, React Query, or similar) and REST/GraphQL data-
    fetching patterns.
  - Strong UI engineering fundamentals, including
    responsive/adaptive design, accessibility (WCAG 2.1 AA),
    cross-browser and cross-platform compatibility, and
    thoughtful use of motion and animation.
  - Comfortable with frontend testing: unit, integration, and
    end-to-end (Jest, React Testing Library, Playwright or
    Cypress).
  - Experience building or maintaining a shared design system or
    component library at team scale.
  - Contributions to open-source projects or public technical
    writing that demonstrates depth of craft.
  - Exposure to web3 or digital-goods purchasing flows (not
    required—but we’re curious).
  - Demonstrated ownership of consumer-facing products at a
    meaningful scale of millions of users or transactions..
  - Experience with experiment-driven product development, using
    A/B testing and quantitative analysis to validate
    hypotheses and guide iteration.
  - AI curiosity and fluency with tools like Cursor, Claude, or
    ChatGPT is a plus.
  - Collaborative mindset with a passion for solving problems
    and building great products.
  - Prior work in a two-sided marketplace, ticketing, or high-
    transaction-volume e-commerce product is preferred.

  What We Offer:

  - Flexible PTO
  - Competitive salary & equity package
  - Monthly Gametime credits for any event ($1,200/yr)
  - Medical, dental, & vision insurance
  - Life insurance and disability benefits
  - Diverse Family-forming benefits through Carrot Fertility
  - 401k, HSA, pre-tax savings programs
  - Company off-sites and meet-ups
  - Wellness programs
  - Tenure recognition

  At Gametime pay ranges are subject to change and assigned to
  a job based on specific market median of similar jobs
  according to 3rd party salary benchmark surveys. Individual
  pay within that range can vary for several reasons including
  skills/capabilities, experience, and available budget.

  United States - Pay Range

  $170,925—$240,000 USD

