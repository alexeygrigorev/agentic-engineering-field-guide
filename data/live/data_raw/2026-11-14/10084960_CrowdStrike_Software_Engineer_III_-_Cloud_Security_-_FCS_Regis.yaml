description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  Falcon Cloud Security (FCS) is a key product area for
  CrowdStrike. We’re extending CrowdStrike’s mission of
  “stopping breaches” into the public cloud and cloud-native
  workloads. CrowdStrike’s FCS Cloud Security Posture
  Management (CSPM) offering provides visibility into your
  entire cloud infrastructure, continuous monitoring for
  misconfigurations, and proactive threat detection. As a
  member of the Falcon Horizon control plane group, you will
  be part of a fast-paced team taking on cloud-scale
  challenges and raising the bar on Cloud Security Posture
  Management.

  This role is hybrid, requiring a minimum of 3 days per week
  on-site from our New York City office.

  What You’ll Do:

  - Develop Go-based microservices to support new and existing
    features which help detect cyber attacks, as well as
    RESTful APIs to support and expand our industry leading
    CSPM platform.
  - Take end-to-end ownership, both individually, and as part of
    a team, for the delivery of projects of increasing
    complexity.
  - Relentlessly pursue quality by following engineering best
    practices including: Appropriate testing paradigms,
    effective peer code reviews, logging, monitoring, and
    resilient architecture patterns.
  - Utilize Kafka for event-driven workflows; and Cassandra,
    ElasticSearch, or PostgreSQL for data storage.
  - Provide on-call monitoring and operational & customer
    support for production services owned by our team.
  - Reflect thoughtfully to improve architecture, models, user
    experience, performance, and stability following rapid
    prototyping and fast-paced decision making.
  - Ultimately, develop a platform to help secure the entire
    lifecycle of cloud workloads for CrowdStrike customers.

  What You’ll Need:

  - U.S. citizen or Permanent Resident and work solely from U.S.
    soil
  - Experience programming in at least one object-oriented
    programming language, featuring strong types. We write
    code in Golang. Learn it on the job with us!
  - Experience developing and consuming RESTful API web
    services.
  - Experience working with cloud providers such as AWS, Azure,
    GCP, and Oracle Cloud.
  - Experience with infrastructure-as-code tools such as
    CloudFormation, Terraform and Azure Templates.
  - Hands-on experience deploying, configuring, and using Docker
    containers in Kubernetes environments with Helm.
  - Experience using a message queue. We use Kafka and SQS.
    (e.g., defining messages, estimating message sizes and
    rates, monitoring lag)
  - Experience using RDBMS databases, and accompanying knowledge
    of SQL, such as Postgres.
  - Strong debugging skills: ability to spot design flaws, race
    conditions and performance bottlenecks in complex
    architectures.
  - Bachelor's degree or equivalent work experience. Proficiency
    with common algorithms, data structures, code
    whiteboarding.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Prior industry experience or certification related to CNAPP,
    CSPM or Cloud Security.
  - Experience with application observability incl. Prometheus
    metrics, Splunk logging, Grafana dashboards, and PagerDuty
    alerts.
  - Experience handling production challenges related to
    Postgres, Kubernetes, and Kafka.
  - Understanding data structures and various APIs, for full-
    text search of application logs and event data in
    Elasticsearch.
  - Experience with Cassandra, CQL, and its wide-column store
    database.
  - Experience using graph structures (ie. nodes, edges), graph
    data, and graph databases.

  #LI-JC1

  This role will require the candidate to periodically undergo
  and pass additional background and fingerprint check(s)
  consistent with government customer requirements.

