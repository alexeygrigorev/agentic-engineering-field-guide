description: |
  We’re looking for a Senior Software Engineer to join a
  supportive, multidisciplinary team developing AI/ML systems
  to solve critical Defence and National Security challenges.
  In this role, you’ll work alongside talented software
  engineers, scientists, designers, and product specialists to
  build elegant, maintainable, and impactful data-centric
  solutions. You'll join one of our product teams, helping
  design and deliver AI-powered software to support user
  adoption and deployment of our product. You’ll work closely
  within a multidisciplinary team to deliver high-quality,
  impactful technology that blends innovation with real-world
  value.

  Mind Foundry is at an exciting stage of growth, with
  increasing demand for AI-enabled capability across our
  markets. We specialise in helping customers make sense of
  the ever-increasing volumes of data collected by sensors,
  platforms and systems at the speed of relevance. We often
  find ourselves working at the edge in complex environments
  where power, compute, and bandwidth are in short supply. As
  a Software Engineer, you’ll work on problems that are
  technically challenging, operationally important and
  genuinely meaningful. You will help turn advanced AI and ML
  approaches into deployable capability that can support
  better, faster decision-making in demanding real-world
  environments. What makes the work distinctive is the
  combination of technical depth, practical engineering and
  responsible delivery. This is an opportunity to innovate at
  the forefront of applied machine learning, tackle high-
  impact real-world problems, grow your technical skills, and
  shape the way AI/ML solutions are delivered to critical
  operational environments.

  Because of the nature of this work:

  - You will be required to travel to and work from client sites
    and partner locations. When not working onsite, this role
    can be office-based or hybrid from our Summertown, Oxford
    office.
  - You will need to hold existing or be eligible for UK
    Security Vetting (SC), details of which can be found on
    the Gov UK website.

  Key day-to-day activities

  - Design, build, and maintain scalable web applications using
    modern technologies.
  - Collaborate cross-functionally with engineers, designers,
    and scientists to deliver new product features and client
    solutions.
  - Own technical delivery, managing development tasks from
    design through to deployment.
  - Contribute to architectural decisions that shape the
    direction of our platforms and consulting projects.
  - Champion software quality, implementing best practices for
    testing, documentation, and CI/CD.
  - Participate in Agile development, contributing to sprint
    planning, reviews, and retrospectives.
  - Foster continuous learning, knowledge sharing, and technical
    excellence across the team.

  Core Skills & Experience:

  - At least five years of commercial software engineering
    experience.
  - Expertise in at least one high-level programming language
    (e.g., Python, JavaScript/TypeScript) and familiarity with
    several others.
  - A degree in a technical discipline (e.g., Computer Science,
    Mathematics, Physics) or equivalent experience.
  - Experience working in an iterative Agile environment with a
    strong understanding of DevOps tools and culture, and a
    proven track record of improving software delivery
    processes.
  - Experience architecting and designing complex distributed
    systems for both cloud and on-premise environments, with
    knowledge of architectural patterns and best practices for
    secure and scalable systems.
  - Motivation to mentor and develop less experienced engineers
    and contribute to team growth.
  - Broad technical competence across areas such as systems
    integration, scripting, CI/CD, UI/UX design, and
    databases.
  - Experience collaborating directly with users and clients to
    define and deliver high-impact solutions.
  - Strong communication skills and the ability to explain
    technical ideas clearly to diverse audiences.



  Our Core Technology Stack:

  - Frontend: React, TypeScript
  - Backend: Python (Machine Learning)
  - Databases: PostgreSQL
  - Infrastructure: Kubernetes, Cloud-native environments

  Nice to have:

  - Knowledge of Kubernetes, Helm and Docker/containerisation
    concepts, with hands-on experience designing, deploying,
    and maintaining Kubernetes environments in production.
  - Broader software engineering experience such as scripting,
    UI/UX, design, or data engineering.
  - Experience working directly with clients or end users to
    gather requirements and deliver tailored solutions.
  - Experience developing embedded software, FPGA's or C/C++.
  - Understanding of Machine Learning, AI, or Data Science,
    including experience deploying ML in production or
    commercial applications.
  - Experience integrating software with external APIs and
    systems, including network configuration.
  - Experience deploying in the field, and working independently
    on site with remote support



  While we think the above experience is important, we’re keen
  to hear from people that believe they have valuable skills,
  ideas, or perspectives that will make an impact in this
  role. If our team and mission resonate with you, but you do
  not necessarily meet all our requirements, we still
  encourage you to apply.



  Why Mind Foundry? 

  At Mind Foundry, people have the opportunity to work on
  problems that are technically challenging,
  operationally important and genuinely meaningful. We are a
  close-knit, multidisciplinary team working on complex
  problems where advanced AI has the potential to make a
  meaningful difference in the real world. Our work sits at
  the intersection of research, engineering, product,
  customer need and operational impact, which means everyone
  can contribute beyond their job title. 

  What makes Mind Foundry different is the way we combine
  technical excellence with pragmatism, responsibility and
  partnership. We are ambitious about what AI can achieve, but
  thoughtful about how it should be designed, deployed and
  trusted. Our teams work closely together, challenging ideas
  constructively, learning quickly and staying focused on
  building capability that is useful, credible and
  operationally relevant. 

  As a growing business, we offer the opportunity to have
  visible impact. You will be close to the customers, the
  technology and the decisions that shape our direction. We
  value people who ask good questions, bring others with them,
  and take ownership. 

  This is an exciting time to join Mind Foundry. Demand for
  trusted, deployable AI capability is increasing, our
  products and partnerships are maturing, and our work is
  helping to shape how advanced machine learning can support
  Defence and National Security in challenging operational
  environments. If you are motivated by meaningful work,
  collaborative teams and the chance to help build something
  with real-world importance, Mind Foundry is a place where
  you can make a genuine contribution.  

  Our Values

  - We are one team: We share goals, responsibility and success.
    We support one another, value what fuels people and ensure
    no one is left behind.

  - We work with purpose: We focus our effort where it matters
    most, we work hard, think smart and deliver meaningful
    results for our team, shareholders and customers.

  - We laugh: We protect a positive environment. We have fun,
    feel safe, learn, grow and achieve more together.

  - We move forward: We learn from setbacks and frustration, we
    support each other, solve problems together and don’t
    dwell on the past.

  - We act with integrity: We hold ourselves to the highest
    standards and are trusted, discreet and reliable. We
    represent our clients with the same care as we represent
    ourselves.



  What do we offer? 

  We believe in investing in our people by encouraging career
  and personal development that aligns with your goals and
  ambitions. We make sure all staff have the tools, time and
  support they need to shape their own professional
  development. We want to help you excel at what you do and
  support your growth within the company. 

  You’ll enjoy a competitive compensation package and great
  benefits such as: 

  - EMI options scheme
  - 25 days of annual leave plus Bank Holidays
  - Salary Sacrifice Pension scheme
  - Private Healthcare (including dental and optical cover)
  - Group Life Cover at three times your annual salary
  - Enhanced Parental and Sickness Leave
  - Workplace Nursery Scheme
  - Volunteering days
  - UK Armed Forces Reservist Policy
  - Pet friendly office
  - Professional and personal development

  For more information, please visit our
  website www.mindfoundry.ai or
  email recruitment@mindfoundry.ai 



  Interview Process:  

  - Initial discussion with the People team
  - TestDome coding exercise
  - 60 minute interview with two members of the Science &
    Engineering Team
  - 2 hour coding exercise & 45 minute architecture exercise
  - In person meet the team at our Summertown, Oxford office
