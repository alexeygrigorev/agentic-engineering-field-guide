description: |
  Overview Corporate Tools is hiring a Software Engineer. You
  will be a traditional company employee. This is a remote
  position, but if you're near one of our local offices,
  you're welcome to come hangout with us in-office as well.
  Our main offices are in Post Falls, ID, and Spokane, WA; we
  also have satellite offices in Austin, TX, and Salt Lake
  City, UT. You'll be working 40 hours a week and, of course,
  enjoy great company benefits. At Corporate Tools, you'll
  join a tight-knit crew of engineers with wildly different
  backgrounds, experiences, and superpowers. Some of us spend
  our days crafting shiny new Rails applications, while others
  enjoy spelunking through legacy Rack apps and uncovering the
  hidden gems of Plain Old Ruby. We love trying new tools,
  technologies, and ideas-but we're not chasing trends for the
  sake of it. If it solves a real problem and helps the
  business, we're interested. We're looking for someone who's
  excited to learn, eager to share what they know, and
  comfortable owning a project from start to finish. Our team
  knows that great engineers aren't all built from the same
  template. Some are CI/CD fanatics, some can make SQL sing,
  and some are happiest writing elegant Ruby all day long.
  While we all work across the stack, we also embrace the fact
  that everyone has their favorite corner of the playground.
  One thing you'll learn quickly: we're nimble. Priorities can
  shift, new opportunities pop up, and sometimes the most
  important problem today wasn't even on the radar yesterday.
  We don't see that as chaos-we see it as an opportunity to
  make a real impact. If you enjoy variety, adapting on the
  fly, and tackling whatever challenge is most valuable in the
  moment, you'll fit right in. Bring your strengths, grow your
  skills, and help us build great software alongside people
  who genuinely enjoy solving hard problems together. What's
  in a title? At Corporate Tools, we don't put much stock in
  titles. They're helpful for job postings, but once you're
  here, what matters is your impact, growth, and the unique
  strengths you bring to the team. We use levels instead of
  traditional titles because they give us more flexibility to
  support career development without forcing people into rigid
  boxes. Through regular conversations, you'll have clear
  expectations, opportunities to grow, and ongoing discussions
  about challenging work, progression, and compensation. Our
  goal is simple: create an environment where talented people
  can keep learning, taking on new challenges, and building a
  career that's meaningful to them. And if you'd like a
  traditional title for LinkedIn, post away. Wage $90,000 to
  $140,000 / year depending on experience Benefits

  - 100% employer-paid medical, dental & vision Full coverage
    for employees - nothing comes out of your paycheck. Plus
    an annual review with a raise option.
  - Time off that grows with you 22 days PTO + 4 holidays to
    start. After 3 years it bumps to 29 days, and after 5
    years you move to flexible time off - not accrued, not
    capped. Take time off when you want.
  - Parental leave & 401(k) match Paid parental leave, plus up
    to 6% company 401(k) matching with no vesting period -
    it's yours from day one.
  - Quarterly allowance Spend it on whatever makes work better:
    a comfier remote setup, continuing-education classes, a
    plant for your desk, coffee for a coworker, a massage for
    yourself... really, whatever.
  - No dumb perks (and a trail mix bar) No weekend dog-walking
    gimmicks that look cool but cost nothing because nobody
    uses them. We spend on benefits you'll actually use - an
    open-concept office, friendly coworkers, a creative
    environment, and yeah... a trail mix bar.


  Responsibilities

  - Be a good human
  - Develop Software with Ruby, Javascript, and willing to learn
    and help out with our AWS infrastructure
  - Learn Ruby and Rails
  - Help us consistently release high-end software
  - Contribute with bugs, and smaller parts of large projects
  - Help design and build high traffic applications in Ruby on
    Rails
  - Help peel off monolith Plain Old Ruby code into well-
    organized Ruby on Rails code
  - Help design and build novel systems from scratch
  - Have a Growth Mindset, not a Fixed Mindset


  Requirements

  - BS in Computer Science or relevant experience
  - 2-4 years professional experience with full stack
    application development
  - 2+ years experience with front-end web development, HTML,
    CSS, Javascript
  - 2+ years experience with Vue, Angular or React
  - 2+ years experience with another web frameworks like Rails,
    Laravel, Django, Express, Ember, Backbone etc
  - Exposure to cloud infrastructure and relational databases in
    production environment
  - Experience with CI/CD, Docker, or similar tools
  - You bring some weird or quirky new aspect of living and
    humanity to our workforce
  - Experience being project/tech lead as well as mentoring
    other engineers
  - 4-5 years experience with designing, building, and
    maintaining Web application, preferably the front-end and
    back-end
  - Experience building, scaling, and optimizing cloud
    infrastructure and relational databases in production
    environment. Preferably with AWS: ECS, EC2, ECR, S3, RDS
    and Route53
  - 2+ years experience with CI/CD, Docker, or similar tools
  - Able to work in an agile environment with a focus on
    continuous integration and continuous development
  - Strong grasp of security principles and how they apply to
    e-commerce applications


