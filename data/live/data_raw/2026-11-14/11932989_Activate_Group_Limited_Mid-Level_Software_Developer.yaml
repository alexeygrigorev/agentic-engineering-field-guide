description: |
  Mid-Level Software Developer

  Location: Remote

  Department: IT

  Contract type: Permanent / Full-time

  About the role

  We’re looking for an experienced Full Stack Mid-Level
  Software Developer to join our IT department.

  Activate Group is a growing UK business with 1,000+ team
  members nationwide. This is an exciting opportunity to build
  a long-term career with a company that values its people and
  offers genuine development and progression opportunities.

  Key responsibilities

  - Application Development: Design, develop, and maintain web
    applications using C# & ASP.NET Core.
  - Front-end Development: Build dynamic user interfaces with
    React 19, Next.js (App Router), TypeScript and Material
    UI, with SignalR for real-time updates, ensuring
    responsiveness, accessibility and a seamless user
    experience.
  - Back-end Development: Develop server-side logic, services,
    and APIs using .NET 8, ensuring high performance and
    responsiveness of applications.
  - Database Integration: Implement and maintain database
    solutions using MySQL, SQL Server, MongoDB and Entity
    Framework as well as using Stored Procedures where
    required.  Some Query optimization, data modelling, and
    performance tuning would be desirable
  - API Development and Integration: Create and consume RESTful
    APIs and integrate third-party services.
  - Code Reviews and Best Practices: Participate in peer code
    reviews to ensure high code quality, performance, and
    adherence to best practices and coding standards.
  - Testing and Debugging: Write unit and integration tests to
    ensure the reliability of applications. Identify and fix
    bugs to maintain a stable codebase.
  - Documentation: Produce clear and concise technical
    documentation for development processes, APIs, and system
    architecture.
  - Collaboration: Work with cross-functional teams including
    designers, product managers, and QA to deliver high-
    quality solutions in an Agile environment.
  - Continuous Improvement: Stay updated with the latest
    developments in .NET and Blazor, proposing and
    implementing improvements to the codebase and development
    process.

  Skills and experience

  - Full-Stack Development: Proven experience in full-stack web
    development, building both front-end interfaces and back-
    end services.
  - Web Application Deployment: Experience with the full
    software development lifecycle, including deploying
    applications to production environments.
  - 3+ years of hands-on experience in software development with
    proficiency in C# and .NET: Strong experience in
    developing applications using C#, with in-depth knowledge
    of .NET Core and .NET Framework.
  - React and Next.js: Solid experience building web
    applications using React (or similar) with TypeScript,
    ideally with Next.js and component libraries such as
    Material UI, plus unit testing with Jest and React Testing
    Library.
  - Front-end Technologies: Familiarity with HTML5, CSS3 and
    modern JavaScript/TypeScript, with a good understanding of
    responsive design principles, state management patterns
    and consuming REST APIs.
  - Database Skills: Experience working with relational
    databases using Entity Framework and experience with
    databases such as MySQL, SQL Server and MongoDB, including
    database design, query optimization, and stored
    procedures.
  - API Development: Experience in creating and consuming
    RESTful APIs, along with working knowledge of protocols
    like JSON and XML.
  - Version Control: Proficiency in Git for version control,
    including branching, merging, and pull requests.
  - Problem-Solving and Debugging: Strong problem-solving skills
    and ability to debug and troubleshoot across various
    layers of the application stack.

  Desirable (but not essential):

  - CI/CD: Experience with continuous integration and delivery
    pipelines, automating build, test, and deployment
    processes.
  - Security Best Practices: Understanding of secure coding
    practices, authentication, and authorization (OAuth, JWT).
  - Agile Development: Experience working in Agile/Scrum teams,
    with an ability to collaborate effectively in sprints and
    participate in ceremonies like stand-ups and
    retrospectives.

  Benefits

  We believe in rewarding our people for the great work they
  do. When you join Activate Group, you can expect:

  - 33 days holiday, including bank holidays
  - Personal health cash plan – claim back the cost of everyday
    healthcare such as dental and optical check-ups
  - Enhanced maternity, paternity, adoption and shared parental
    pay
  - Life assurance at three times your basic salary
  - Free breakfasts and fresh fruit
  - A birthday surprise for everyone

  What you can expect from us

  At Activate Group, we want everyone to have the tools and
  support they need to do their best work. We’re an innovative
  business that continuously reviews and improves our systems,
  processes and ways of working, making sure they support our
  teams to do their jobs effectively.

  Every role at Activate Group is aligned to our wider
  business vision and purpose – making someone’s bad day
  better. You’ll understand how your role contributes to the
  bigger picture and how your work helps deliver excellent
  outcomes for customer and partners.

  We believe work should be enjoyable. We make time to
  celebrate success, recognise achievements and bring people
  together at team events and company-wide celebrations. We’ll
  also support your ongoing development through regular
  feedback and career planning.

  Whether you’re based in one of our contact centres in
  Halifax, Peterborough or Huddersfield, working at an
  Activate Accident Repair (AAR) site, or working from home,
  you’ll be part of a supportive culture where people are
  encouraged to succeed.

  A bit about us

  Activate Group is a fast-growing business approaching 1,000
  team members nationwide.

  We work with some of the UK’s largest fleets and insurance
  companies, supporting drivers that have been involved in
  road incidents through our contact centres in Halifax,
  Peterborough and Huddersfield.

  We manage every step of the repair journey - repairing
  vehicles at our own Activate Accident Repair (AAR) body
  shops, as well as through a UK-wide network of trusted
  independent repair partners.

  We also work with the UK’s largest vehicle manufacturers,
  supporting their approved repair programmes, and deliver
  innovative technology solutions to fleets, vehicle repair
  centres and dealerships.

  Our purpose & values

  Our purpose underpins everything we do: Make someone’s bad
  day better

  Our values define how we work with our team members,
  customers and suppliers:

  - Make it happen – Be accountable. Take the initiative, work
    fast, and do a great job.
  - Strive for better – Be bold. Challenge the norm - make small
    improvements often.
  - Win together – Be a team player. Win together, learn
    together, respect each other.
