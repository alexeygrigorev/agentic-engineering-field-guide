description: |
  Associate Software Engineer

  This role is eligible for our hybrid work model: Two days
  in-office.

  Our Technology team is the backbone of our company:
  constantly creating, testing, learning and iterating to
  better meet the needs of our customers. If you thrive in a
  fast-paced, ideas-led environment, you’re in the right
  place.

  Why this job’s a big deal:

  Join an Agile team of professionals that are instrumental in
  building the next generation of travel applications. We
  constantly explore new technologies and engineer better
  solutions for ever demanding user needs.

  You will play a pivotal role in transforming complex AI
  models into intuitive, user-friendly experiences that engage
  and empower users. This position gives you the chance to
  directly shape how AI enhances digital interactions by
  designing and developing cutting-edge solutions that bring
  advanced AI capabilities seamlessly into users' travel
  tasks. You’ll work at the heart of innovation, pushing
  boundaries in both applied AI and UX to create impactful,
  real-world applications. If you're passionate about creating
  meaningful, user-centered AI experiences, this role offers
  an unparalleled opportunity to lead in a dynamic, forward-
  thinking environment.

  In this role you will get to:

  ·        Participate in mission critical projects with
  direct impact on the evolution of Priceline's business.

  ·        Be part of a cross-functional agile team that
  continuously experiments, iterates and delivers on new
  product objectives.

  ·        Showcase your development skills of Core Java or
  similar programming languages.

  ·        Apply your programming skills towards building low
  latency and high throughput transactional services with
  continuous integration and automation testing.

  ·        Implement SQL composition skills that collects and
  queries data for investigation and analysis in real time
  from our applications.

  ·        Utilize your knowledge to understand our codebase,
  systems and business requirements to effectively make
  changes to our applications.

  ·        Effectively collaborate and engage in team efforts,
  speak up for what you think are the best solutions and be
  able to converse respectfully and compromise when necessary.

  ·        Design, develop, and optimize sophisticated
  Generative AI-driven applications that enhance user
  experiences and streamline interactions across platforms.

  ·        Collaborate with cross-functional teams, including
  software engineers of various disciplines, UX designers, and
  product managers to define user needs and translate them
  into effective AI solutions.

  ·        Join in and propose some of the architecture and
  implementation of applied generative AI models, ensuring
  they are seamlessly integrated into user interfaces and
  enhance the overall functionality of the platform.

  ·        Conduct testing and performance optimization to
  ensure high-quality and responsive user experiences,
  including troubleshooting and debugging as necessary.

  ·        Work with developers and contribute to the
  development of best practices within the team, fostering a
  culture of continuous improvement and innovation.

  ·        Stay ahead of industry trends in AI and UX,
  bringing new ideas and techniques to the team to ensure we
  remain competitive and at the cutting edge of technology.

  Who you are:

  ·        Bachelor’s degree or higher in Computer Science or
  related field.

  ·        1+ year of experience in software engineering and
  development.

  ·        Illustrated history of living the values necessary
  to Priceline: Customer, Innovation, Team, Accountability and
  Trust.

  ·        Strong coding experience  in JavaScript/TypeScript
  and corresponding tooling, NodeJS, HTML, CSS and React or
  equivalent frameworks are a must.

  ·        Strong understanding of UX principles and user-
  centered design.

  ·        You have hands-on experience with applied
  generative AI development using tools like the Langchain
  suite, Vercel AI, Mastra AI, Spring-AI or model provider
  APIs.

  ·        Knowledge or experience with GraphQL is a strong
  bonus.

  ·        Experience developing in Docker and Cloud
  environments, especially GCP and AWS is nice to have.

  ·        You excel in cross-functional environments,
  effectively communicating complex technical concepts to both
  technical and non-technical stakeholders.

  ·        You have strong analytical skills, able to
  troubleshoot and refine algorithms and code for optimal
  performance.

  ·        You’re passionate about exploring new technologies
  and approaches in AI and UX, eager to bring fresh ideas to
  your projects.

  ·        The Right Results, the Right Way is not just a
  motto at Priceline; it’s a way of life. Unquestionable
  integrity and ethics is essential.

  #LI-JB1 #LI-Hybrid

  There are a variety of factors that go into determining a
  salary range, including but not limited to external market
  benchmark data, geographic location, and years of experience
  sought/required. In addition to a competitive base salary,
  certain roles may be eligible for an annual bonus and/or
  equity grant.

  The salary range for this position is $100,000 – 125,000
  USD.

  Who We Are

  WE ARE PRICELINE.

  Our success as one of the biggest players in online travel
  is all thanks to our incredible, dedicated team of talented
  employees. Priceliners are focused on being the best travel
  deal makers in the world, motivated by our passion to help
  everyone experience the moments that matter most in their
  lives. Whether it’s a dream vacation, your cousin’s
  graduation, or your best friend’s wedding - we make travel
  affordable and accessible to our customers.

  Our culture is unique and inspiring (that’s what our
  employees tell us). We’re a grown-up, startup. We deliver
  the excitement of a new venture, without the struggles and
  chaos that can come with a business that hasn’t stabilized.

  We’re on the cutting edge of innovative technologies. We
  keep the customer at the center of all that we do. Our
  ability to meet their needs relies on the strength of a
  workforce as diverse as the customers we serve. We bring
  together employees from all walks of life and we are proud
  to provide the kind of inclusive environment that stimulates
  innovation, creativity and collaboration.

  Priceline is part of the Booking Holdings, Inc. (Nasdaq:
  BKNG) family of companies, a highly profitable global online
  travel company with a market capitalization of over $80
  billion. Our sister companies include Booking.com,
  BookingGo, Agoda, Kayak and OpenTable.

  If you want to be part of something truly special, check us
  out!

  Flexible work at Priceline

  Priceline is following a hybrid working model, which
  includes two days onsite as determined by you and your
  manager (ideally selecting among Tuesday, Wednesday, or
  Thursday). On the remaining days, you can choose to be
  remote or in the office.

  Perks & Benefits at Priceline

  Our benefits are designed to support your health, wellbeing,
  and life inside and outside of work. Eligible Priceliners
  have access to:

  Health & wellness coverage including medical, dental,
  vision, and mental health resources

  Generous time off including PTO, holidays, a company-wide
  Priceline Pause reset week, and paid volunteer days

  Work/life support including the ability to work up to 4
  weeks per year from anywhere, parental leave, dependent care
  and family support resources, Summer Fridays, and office
  perks like stocked kitchens and catered meals (varies by
  location)

  Financial security programs such as retirement plans with
  company contributions, life and disability coverage, and
  tax-advantaged accounts

  Signature travel perks including employee-only discounts on
  hotels and flights, VIP deals, and Big Deal Bucks credits

  Additional perks & discounts like travel and partner
  discounts, tuition support, legal support, and pet benefits

  A people-first culture with Employee Resource Groups (ERGs),
  social events, recognition programs, and service awards that
  help you connect, grow, and celebrate together

  Specific benefits and programs vary by location.

  Inclusion is a Big Deal!

  To be the best travel dealmakers in the world, we believe
  our team should reflect the broad range of customers and
  communities we serve. We are committed to cultivating a
  culture where all employees have the freedom to bring their
  individual perspectives, life experiences, and passion to
  work.

  Priceline is a proud equal opportunity employer. We embrace
  and celebrate the unique lenses through which our employees
  see the world. We’d love for you to join us and help shape
  what makes our team extraordinary.

  Applying for this position

  We're excited that you are interested in a career with us.
  For all current employees, please use the internal portal to
  find jobs and apply.

  External candidates are required to have an account before
  applying. When you click Apply, returning candidates can log
  in, or new candidates can quickly create an account to
  save/view applications.
