title: Engineering Manager (m/f/d)
company: JOIN
location: Berlin, DEU
work_type: FULL_TIME
company_size: 177 Employees
description: |
  Why this role matter JOIN helps thousands of businesses find
  the right people – faster, fairer, and with less friction.
  Our platform handles millions of candidate interactions, and
  our clients praise JOIN’s attention to detail and unmatched
  user experience. We’re looking for an Engineering Manager to
  join our office in Berlin. You’ll step into a mature,
  integrated team and help it grow even stronger: guiding
  engineers, improving delivery, strengthening our technical
  foundations, and creating the conditions for teams to ship
  high-quality features that tens of thousands of users rely
  on every day. Tasks What you’ll be doing Your leadership
  will directly impact how our teams deliver software that
  powers hiring for thousands of companies. Here’s what that
  looks like: * Lead and manage a team of engineers in
  developing and delivering high-quality software solutions. *
  Guide cross-functional and distributed teams to deliver
  results within tight deadlines. * Foster a culture of
  mentoring, innovation, and skill development across your
  team. * Set and articulate clear objectives that align with
  broader organizational goals. * Support your team through
  One-on-Ones, ensuring alignment, performance, and personal
  growth. * Ensure projects are delivered on time, within
  budget, and with a strong focus on quality and customer
  satisfaction. * Drive a culture of continuous learning,
  improvement, and collaboration. * Actively participate in
  interviewing and hiring engineers from diverse backgrounds.
  * Share your knowledge, grow expertise in our product, and
  develop yourself alongside your team. Who you’ll work with
  You’ll join a diverse and growing engineering organization,
  collaborating closely with cross-functional teams across
  Product, Platform, and Design. As part of JOIN’s leadership
  group, you’ll play a key role in shaping the culture of our
  Berlin hub while staying connected with colleagues across
  Europe. Requirements What we’re looking for We don’t believe
  in checklists – but if most of these apply, we’d love to
  talk: ✔ Minimum 5 years of experience in software
  engineering. ✔ Proven track record in leading and managing
  engineering teams. ✔ Strong understanding of software
  development processes and methodologies. ✔ Basic knowledge
  in one or more of the following: Node.js, React.js, SQL,
  Kubernetes, GraphQL, Docker, gRPC, Pub/Sub. ✔ Familiarity
  with SaaS platforms and cloud technologies. ✔ Experience in
  hiring, mentoring, and developing technical talent. ✔
  Excellent communication and interpersonal skills. ✔
  Bachelor’s or Master’s degree in Computer Science,
  Engineering, or a related field. Our Values ❤️ People First
  – We put humans at the heart of hiring. 🚀 Own It – We take
  initiative and solve problems independently. 🛠 Work Smarter
  – Efficiency beats effort. 💡 Be Bold – Challenge the status
  quo and push boundaries. At JOIN, we thrive in a fast-
  moving, collaborative environment, and we’re looking for
  people who do too. That means: * We follow a hybrid model (3
  days office, 2 remote) to promote collaboration. * We adapt
  quickly and embrace change. * We continuously challenge
  ourselves and each other to improve. This role might not be
  ideal if: * You prefer a highly structured environment. *
  You want a fully remote position. * You prefer minimal
  change and a slower pace. * You’re not excited about
  ownership and growth. Benefits What’s in it for you? 🖥 Apple
  hardware – The best tools for the job (M3 Pro MacBook Pro).
  🏆 Team events – Brunches, sports activities, and quarterly
  gatherings in Berlin. 🌍 Productivity from Everywhere – 104
  days per year remote (post-probation), following our hybrid
  policy. 🏦 Competitive salary – Tailored to align with your
  experience level. 🏠 Relocation support – Assistance with
  paperwork, travel, and one month of furnished accommodation.
  🧑‍💻 Play a defining role in shaping our Berlin hub and
  engineering culture. What to expect from the hiring process
  We respect your time and keep things transparent: 1️⃣ Intro
  call (\~30 min) – Let’s see if we’re a good match. 2️⃣
  Hiring Manager Review – Your profile is assessed for
  technical and team fit. 3️⃣ Hiring Manager Interview (\~45
  min) – Dive into expectations and leadership style. 4️⃣
  Technical Interview (\~60–120 min) – Show us your technical
  knowledge and leadership approach. 5️⃣ Meet the Team
  (Optional) – Connect with your future colleagues. You’ll
  always know where you stand – no black holes, no ghosting.
  We welcome applications from individuals of all ages,
  abilities, genders, religions, and diverse backgrounds. If
  you need assistance during the hiring process or in the
  workplace, let us know! Don’t meet every requirement? No
  problem! We’re always open to exceptional candidates and
  value diversity in all forms. 📩 Apply now – We’d love to
  connect with you!
