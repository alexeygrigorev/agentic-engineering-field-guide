description: |
  Job Responsibilities: You’ll be a core part of a high-trust
  team that builds mission-critical systems at breakneck
  speed. Expect real ownership, end-to-end product impact, and
  a seat at the architecture table from day one. In this role,
  you will:

  - Build full-stack features across our three flagship
    products—Angular, Node.js, React, AWS (serverless).
  - Own projects end-to-end, from product definition through
    backend/frontend, QA, deployment, and beyond.
  - Collaborate closely with clinicians, ML researchers, and
    engineers to ship high-impact features in fast iteration
    cycles.
  - Work with GraphQL APIs, reinforcement learning models, and
    real-world data pipelines to drive patient outcomes.
  - Continuously improve developer experience, system stability,
    and CI/CD workflows.
  - Join customer calls to deepen understanding of user needs
    and shape product direction.
  - Drive engineering culture, mentor junior developers, and
    help scale the team’s impact over time.Job Requirements:
  - 5–15 years of professional experience as a full-stack
    engineer, with proven product ownership.
  - Expertise in JavaScript/TypeScript, with strong command of
    Angular, React, and Node.js.
  - Fluency with AWS serverless architecture: Cognito, Lambda,
    DynamoDB, AppSync, CloudFormation, etc.
  - Experience building end-to-end products (not just infra or
    microservices), ideally at fast-scaling, VC-backed
    startups (Series A–C).
  - Strong product sensibility—you're a T-shaped engineer who
    obsesses over both code quality and user experience.
  - Long tenures (2+ years per role) with clear growth
    trajectory.
  - Degree in CS or equivalent from a top-tier university (e.g.
    MIT, Stanford, CMU, ETH, Toronto, Oxford, etc.).
  - Experience integrating GraphQL, ML models, or agentic AI
    systems.
  - Background in healthcare, life sciences, or climate tech.
  - Prior role as a founding engineer, CTO, or technical co-
    founder.
  - Hacker mindset—relentless problem-solver, resourceful,
    autonomous.
  - Mission-driven—deep desire to build for the real world and
    do work that saves lives.
  - Thrives in high-intensity, ambiguous, and fast-paced
    environments.
  - Cares about shaping engineering culture and empowering
    others.
