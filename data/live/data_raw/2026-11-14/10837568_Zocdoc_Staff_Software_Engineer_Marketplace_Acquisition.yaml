description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission

  As a Staff Software Engineer on the Marketplace Acquisition
  team at Zocdoc, you'll turn ideas into reality fast —
  prototyping, iterating, and shipping high-impact experiences
  that help patients discover and access care. You'll own the
  systems behind Zocdoc's patient acquisition and engagement,
  keeping everything at the top of the funnel stable,
  scalable, and fast. That means driving the evolution of our
  SEO infrastructure, which powers thousands of patient-facing
  pages; iterating on provider profile and practice page
  designs to create seamless, trustworthy experiences; and
  building the APIs and services that make patient-facing data
  fast and reliable at scale.

  You'll also shape how we build. Zocdoc is making a company-
  wide push to drive engineering through the lens of AI, and
  you'll be an active participant in it — bringing AI into
  your day-to-day development, contributing to the standards,
  guardrails, and review practices the organization is
  building, and raising the ceiling on what a small team can
  ship. Multiplying the output of the engineers around you is
  as much a part of this role as the code you write yourself.

  You'll work closely with Design, Product, and Marketing to
  align on strategy and deliver measurable impact, all while
  fostering a culture of technical excellence, mentorship, and
  innovation that keeps Zocdoc at the forefront of healthcare
  technology.

  You’ll enjoy this role if you are…

  - Driven by the opportunity to impact healthcare positively,
    our mission is to create a seamless, efficient, and deeply
    human experience
  - Product-driven with a relentless focus on user needs; you’re
    excited to partner closely with cross-functional teams,
    leading projects beginning from the early ideation phase
  - Passionate about engineering excellence, with a strong focus
    on promoting best practices in code quality, testing, and
    long-term maintainability across teams and the
    organization
  - An entrepreneur with strong ownership who can thrive in an
    ambiguous and fast-changing environment

  Your day to day is…

  - Leading the technical direction of Zocdoc’s acquisition
    platform, enhancing system stability and user experience.
    Guiding technical discussions, ensuring decisions are
    scalable and dependable, and aligning infrastructure with
    the team’s broader mission
  - Building scalable APIs and microservices that power
    frictionless data access and informed patient decision-
    making
  - Collaborating with design counterparts to iterate on user
    experiences and improve the overall customer journey
  - Proactively engaging with product counterparts to align on
    vision, strategy, and execution, ensuring projects stay on
    track and deliver business value
  - Mentoring engineers and driving team excellence through
    coding standards, automation, and continuous improvement
  - Leading bold innovation initiatives centered on AI,
    leveraging emerging data sources and cutting-edge
    architectures to position Zocdoc as a leader in healthcare
    technology

  You’ll be successful in this role if you have…

  - Owned and evolved complex, user-facing platforms end-to-end,
    balancing rapid delivery with long-term technical vision
    to ensure scalable, maintainable, and impactful
    experiences
  - Designed and built performant systems with search engine
    optimization (SEO) and page speed as top priorities,
    ensuring fast, reliable, and discoverable patient
    experiences at scale
  - Architected full-stack solutions spanning backend APIs, AWS-
    based infrastructure, and React systems that are modular,
    reusable, and leveraged across teams
  - Integrated with third-party data sources and content
    management systems, such as Contentful, to deliver
    dynamic, flexible, and content-rich user experiences
  - Leveraged large language model (LLM) systems to transform
    raw user data into actionable insights, powering
    intelligent and personalized features
  - Driven engineering excellence through best-in-class
    practices in testing, CI/CD, observability, and system
    performance optimization
  - Mentored and collaborated across distributed teams,
    promoting strong technical foundations, clear
    communication, and an inclusive, innovative engineering
    culture

  Benefits

  - Flexible work environment
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging

  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
  with market data. Base salary offered is determined by a
  number of factors including the candidate’s experience,
  qualifications, and skills. Certain positions are also
  eligible for variable pay and/or equity.

  Remote Base Salary Range

  $180,000—$265,000 USD

  About us Zocdoc is the country’s leading digital health
  marketplace that helps patients easily find and book the
  care they need. Each month, millions of patients use our
  free service to find nearby, in-network providers, compare
  choices based on verified patient reviews, and instantly
  book in-person or video visits online. Providers participate
  in Zocdoc’s Marketplace to reach new patients to grow their
  practice, fill their last-minute openings, and deliver a
  better healthcare experience. Founded in 2007 with a mission
  to give power to the patient, our work each day in pursuit
  of that mission is guided by our six core values. Zocdoc is
  a private company backed by some of the world’s leading
  investors, and we believe we’re still only scratching the
  surface of what we plan to accomplish.

  Zocdoc is a mission-driven organization dedicated to
  building teams as diverse as the patients and providers we
  aim to serve. In the spirit of one of our core values -
  Together, Not Alone, we are a company that prides itself on
  being highly collaborative, and we believe that diverse
  perspectives, experiences and contributors make our
  community and our platform better.  We’re an equal
  opportunity employer committed to providing employees with a
  work environment free of discrimination and harassment.
  Applicants are considered for employment regardless of race,
  color, ethnicity, ancestry, religion, national origin,
  gender, sex, gender identity, gender expression, sexual
  orientation, age, citizenship, marital or parental status,
  disability, veteran status, or any other class protected by
