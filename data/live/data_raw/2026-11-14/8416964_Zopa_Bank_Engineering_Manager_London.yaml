description: |
  Our Story



  Hello there. We’re Zopa.



  We started our journey back in 2005, building the first ever
  peer-to-peer lending company. Fast forward to 2020 and we
  launched Zopa Bank. A bank that listens to what our
  customers don’t like about finance and does the opposite.
  We’re redefining what it feels like to work in finance. Our
  vision for a new era of banking puts people front and centre
  — we’ve built a business that empowers everyone to aim high,
  every day, to move finance forward. Find out more about our
  fantastic offerings at Zopa.com!



  We’re incredibly proud of our achievements and none of it
  would be possible without the amazing team here. It’s not
  just industry awards we’re winning, we’ve also been named in
  the top three UK’s Most Loved Workplaces.



  If you embrace unconventional challenges, are unafraid to
  think differently and are driven to make an outsized impact,
  you’ll thrive here at Zopa, so join us, and make it count.
  Want to see us in action? Follow us on Instagram @zopalife

  The role



  At Zopa, Engineering Managers shape how our people grow,
  leading teams of talented Engineers working on products used
  by millions of customers.



  You’ll help raise the bar for how we deliver, not just what
  we ship.



  This is a role for an experienced people manager who enjoys
  taking ownership and making things better. You will work
  closely with Product and other partners to plan ahead,
  navigate trade offs and tackle challenges early. Engineering
  Managers at Zopa drive change beyond formal authority by
  building coalitions, shaping thinking across functions, and
  using insight and influence to move the organisation
  forward. When things are ambiguous, you bring clarity by
  making decisions, setting priorities, and helping teams move
  together.



  We’re looking for Engineering Managers who don’t wait to be
  told where the problems are. You’ll use customer feedback
  and service data to spot opportunities, improve quality and
  reliability, and help your team deliver confidently through
  complexity.



  The team



  We’re growing across several product-engineering tribes at
  Zopa, including Current Account, Product Enablement and
  Operational Efficiency. Each team works on different
  problems, but they’re all united by a shared belief in
  ownership, collaboration and thoughtful challenge. You’ll
  join a supportive community of Engineering Managers who care
  deeply about people, impact and continuous improvement.
  During the interview process, you’ll meet Zopians from
  across the business so we can find the team where you’ll
  have the biggest impact.



  We work in a hybrid way, with this role spending a minimum
  of three days a week in our London office.

  About you:

  - As an experienced Engineering Manager, of at least two years
    in a leadership role, you’re someone who naturally:
  - Owns outcomes. You look for problems to solve, not just
    tasks to complete, and you’re comfortable leading through
    uncertainty.
  - Is self-driven and proactive. You work with minimal
    direction while helping others find clarity and focus.
  - Brings strong opinions, held thoughtfully. You challenge
    ideas, influence decisions and stand your ground when
    needed, while staying open to learning and changing your
    mind.
  - Learns quickly from mistakes. You reflect openly on what
    didn’t work and using that insight to do better next time.
  - Cares deeply about people. You bring proven experience
    supporting engineers’ development, performance and
    progression.
  - Keeps a strong technical bar. You’ve helped build, run and
    improve production systems, and you treat quality as a
    first-class concern across the SDLC
  - Communicates clearly and empathetically. You engage with
    engineers, product partners and stakeholders, explaining
    not just what you’re doing, but why.

  At Zopa, we value experience, and we’re just as interested
  in mindset, judgement and potential. We want to meet
  Engineering Managers who bring curiosity, conviction and
  care to their work, and who want to maintain and evolve a
  culture where both people and products can thrive.



  #LI-JA1

  At Zopa we value flexible ways of working.

  We value face-to-face collaboration and a good work-life
  balance. This hybrid role requires you to come to our London
  office 2-3 days a week.

  You'll also have the option of working from abroad for up to
  120 days a year!* But no matter where you are, we’ll make
  sure you’ve got everything you need to thrive, both in your
  work and home life, from day one.

  *Subject to having the right to work in the country of
  choice

  Diversity Statement

  Zopa is proud to offer a workplace free from discrimination.
  Diversity of experience, perspectives, and backgrounds leads
  to better products for our customers and a unique company
  culture for our people. We are made up of nearly 50
  nationalities, have a DE&I forum made up of Zopians wanting
  to make a difference and we are proud of our culture where
  everyone can bring their full self to work. Our approach to
  DE&I is reflected in our hiring process so please let us
  know if you require any reasonable adjustments.

  Our approach to AI in interviews

  At Zopa, AI isn't something we're testing out — it's part of
  how we work every day. As a proud partner of Jobs 2030,
  we're committed to building AI fluency across our workforce,
  and we expect Zopians to use AI as part of how they do their
  jobs.

  Because of that, we want to be transparent about how we
  think about AI use during our hiring process.

  Behavioural and competency-based interviews: please don't
  use AI. These conversations are designed to understand you —
  your experiences, your judgment, and how you've approached
  real situations. An AI-generated answer can't tell us that.
  What it can do is get in the way of us finding out whether
  we're the right fit for each other.

  Technical interviews: it depends on the role. Some technical
  stages actively welcome AI use, others don't. Your Talent
  Partner will let you know what's expected at each stage.
  Where AI is part of the assessment, we'll be interested not
  just in the outcome, but in how you used it – the tools you
  chose, your reasoning, and the decisions you made along the
  way.
