description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  Our Senior Software Engineers lead and mentor engineers,
  delivering high-value products for our customers and
  infrastructure that enables our business to scale.

  As a Senior Software Engineer, you'll be responsible for
  setting technical direction to enable our product and
  infrastructure to scale with our business, driving complex
  projects across our technical stack, and mentoring our
  talented engineering team. Your past experience will be
  leveraged to enable and accelerate Vanta's growth.

  Our business has found incredible product-market fit and has
  monetized effectively since the day we signed our first
  customer. We're growing at a blistering pace, which presents
  career-defining opportunities for engineers to accelerate
  their growth and to contribute to a rapidly-scaling company.

  Visit our Vanta Engineering Blog to learn more about what
  our team is working on!

  Every company Vanta serves connects the tools it already
  uses: cloud providers, identity systems, HR platforms, code
  repositories. Vanta Tests are the automated checks that run
  continuously against that data to confirm security controls
  are actually in place, and they are how customers earn and
  prove trust. The Authoring Experience team owns how Vanta
  Tests are built, deployed, and surfaced to customers, from
  the APIs and services underneath to the product experiences
  on top. As a Senior Fullstack Engineer on this team, you
  will own the services and public-facing customer APIs that
  turn Vanta's automation platform into products customers
  touch directly, stitching together systems across the
  platform to serve them well.

  What you’ll do as a Senior Fullstack Software Engineer at
  Vanta:

  - Own the architecture and rollout strategy for critical
    platform services, from initial design through large-scale
    rollout and migration.
  - Set the technical bar for how we design, publish, and
    maintain customer-facing APIs while owning things like
    security, reliability, and developer experience.
  - Stitch together services across Vanta's platform to serve
    customer-facing use cases, designing clear service
    boundaries and partnering closely with our data-platform
    teams on access patterns.
  - Raise the written design bar: drive RFCs and decision
    records that make architectural decisions durable and
    shared across the team.
  - Act as a force multiplier: mentor engineers up to your own
    level, expand the team's review capacity, and partner with
    your EM on team health and culture.
  - Build with TypeScript and Node.js on the backend, contribute
    to customer-facing experiences in React, and use AI tools
    to accelerate development and workflows.

  How to be successful in this role:

  - 8+ years of backend development building reliable, scalable,
    fault-tolerant systems.
  - You've designed and shipped external or public product APIs:
    contracts, versioning, authentication, and the developer
    experience around them.
  - You think in service boundaries and system design rather
    than any single layer of the stack, with enough data-layer
    fluency to partner well with dedicated platform teams.
  - You're comfortable working in a modern frontend codebase (we
    use React); you don't need to be an expert, but building
    product end to end is part of the day-to-day here.
  - Track record driving complex, ambiguous, multi-quarter
    initiatives to completion, directly and through others.
  - Experience rolling out or deprecating major systems safely
    at scale.
  - Strong written design communication and demonstrated
    mentorship; you multiply the engineers around you.
  - Open to using AI to amplify their skills and strengthen
    their work - demonstrating curiosity, a willingness to
    learn, and sound judgment in applying AI responsibly to
    improve efficiency and impact.

  Bonus: startup or bias-for-action environments, MongoDB at
  scale, prior work in security or compliance products.

  Requirements

  - Physical location: you must reside in, and perform all work
    exclusively from within, the United States, accessing
    systems only from U.S. locations.
  - Work Authorization Requirements: You must be authorized to
    work in the United States without the need for employer
    sponsorship

  What you can expect as a Vanta’n:

  - Industry-competitive salary and equity
  - Comprehensive medical, dental, and vision coverage, with
    100% of employee-only benefit premiums covered for most
    medical plans
  - 16 weeks fully-paid Parental Leave for all new parents
  - Health & wellness stipend
  - Remote workspace, internet, and cellphone stipend
  - Commuter benefits for team members who report to the SF and
    NYC office
  - Family planning benefits
  - Matching 401(k) contribution with immediate vesting
  - Flexible PTO policy, plus 80 hours of Sick Time
  - 11 company-paid holidays
  - Virtual team building activities, lunch and learns, and
    other company-wide events!
  - Offices in SF, NYC, London, Dublin, Tel Aviv, and Sydney

  To provide greater transparency to candidates, we share base
  pay ranges for all US-based job postings regardless of
  state. We set standard base pay ranges for all roles based
  on function, level, and country location, benchmarked
  against similar-stage growth companies. Final offer amounts
  are determined by multiple factors and may vary based on
  candidate location, skills, depth of work experience, and
  relevant licenses/credentials.

  #LI-remote

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
