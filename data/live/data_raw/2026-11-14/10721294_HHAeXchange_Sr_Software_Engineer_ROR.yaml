description: |
  HHAeXchange is the leading technology platform for home and
  community-based care. Founded in 2008, HHAeXchange was born
  out of an idea to create a fully comprehensive end-to-end
  homecare solution to help people who are aging or have
  disabilities thrive in their homes and communities. Our
  employees are passionate about transforming the healthcare
  space by building the only homecare ecosystem that fully
  connects patients, personal care providers, managed care
  organizations, and states.

  Build technology that helps people receive the care they
  need — where they need it most: at home. We’re looking for a
  Senior Software Engineer to help scale our platform, drive
  feature delivery, and support both legacy modernization and
  new product growth. You’ll work across our Rails, AWS, and
  Kubernetes-based stack to power critical workflows that
  improve lives every day.

  To perform this job successfully, an individual must be able
  to perform each essential job duty satisfactorily with or
  without reasonable accommodation. Reasonable accommodations
  may be made to enable individuals with disabilities to
  perform the essential functions.

  This is a remote opportunity with candidates located within
  the EST or CST time zones within the United States.

