description: |
  COMPANY: Canoe Intelligence, A Bloomberg Company WEBSITE:
  https://canoeintelligence.com/ TITLE: Engineering Manager,
  Client Delivery LOCATION: New York City SALARY = 160,000 -
  180,000 USD Annual + Benefits + Bonus The Role: We're
  looking for an Engineering Manager to lead our Data Delivery
  Guild, responsible for getting extracted, validated data out
  of Canoe to clients and downstream systems - reliably, on
  time, and in the right format. This is a contributing
  manager role: you'll combine day-to-day people leadership
  with hands-on IC work, staying close enough to the code and
  the delivery pipelines to unblock your team and make sound
  technical calls, not just manage from a distance. You'll own
  data delivery and the surrounding systems that support it,
  with real room to shape the guild's backlog, process, and
  working rhythm as it takes shape. It's a chance to lead a
  team with clear, high-visibility ownership over an outcome
  clients feel directly - and to do it in a way that's still
  hands-on and technical, close to the work rather than
  removed from it. What You'll Do:

  - Lead a team of engineers responsible for data delivery and
    the systems that support it.
  - Balance hands-on IC contribution with management duties -
    this role is expected to stay technical, not step fully
    out of the codebase.
  - Drive execution against the guild's backlog and priorities
    as set by Product and senior leadership - proactively
    identifying issues, unblocking your team, and improving
    process and sequencing along the way rather than waiting
    to be told what needs attention.
  - Help shape the guild's approach to agent-augmented
    development - supporting how the team builds and maintains
    domain-specific AI agents for extract logic and delivery
    integrations as a productivity multiplier.
  - Own clear, proactive communication - with your team, with
    other engineering teams, with Product on backlog
    prioritization, and with stakeholders on delivery risk and
    status.
  - Keep a backlog that spans many concurrent integrations and
    delivery channels organized and visible, so work stays on
    track without operational fires dictating the roadmap.
  - Ensure engineers remain accountable for the correctness of
    what actually reaches clients, even as agent-assisted
    tooling accelerates the work.
  - Get up to speed quickly on the team's existing work and
    priorities, and build trust with your engineers early on.

  What We're Looking For:

  - Strong initiative and a sense of ownership - a bias for
    action, someone who instinctively works to fix problems
    rather than waiting to be told what to do, and holds
    themselves and their team accountable for outcomes, not
    just outputs.
  - Genuine enthusiasm for AI-assisted development - you
    actively use coding agents such as Claude Code or
    equivalent tools and advocate for their adoption within
    your team.
  - Real curiosity and a drive to keep learning - you seek out
    new tools and approaches rather than defaulting to what's
    familiar, and bring your own ideas to team process and
    tooling.
  - 3+ years in a leadership capacity - either as a
    technical/team lead or in formal engineering management -
    with direct experience guiding the work of other
    engineers.
  - Genuinely excited about coaching and mentoring engineers,
    invested in their growth and career development.
  - Excellent communication skills - able to represent the guild
    clearly to Product, peer teams, and leadership.
  - Well-organized and methodical - able to manage a busy
    backlog and keep a broad, multi-integration workload on
    track.
  - Comfortable operating in a hands-on, contributing-manager
    capacity - willing to write code and debug delivery
    issues, not just manage.
  - Experience with data integration/delivery patterns (APIs,
    file-transfer protocols, scheduled exports, third-party
    system integrations) is a strong plus given the guild's
    mandate.
  - Bachelor's degree in Computer Science, Engineering, or a
    related field (or equivalent experience).

  Preferred:

  - Experience integrating with external enterprise or financial
    software systems.
  - Background in reliability-focused or delivery/integration-
    heavy engineering roles rather than purely feature-
    development roles.
  - Hands-on technical experience working in large, enterprise-
    scale monolithic codebases - comfortable navigating and
    debugging in a mature, complex system rather than only
    greenfield or microservice environments.
  - Working proficiency in PHP and Vue, since you'll be expected
    to contribute code directly, not just review or direct it.

  What You'll Get: We offer one of the most comprehensive and
  generous benefits plans available and offer a range of total
  rewards that may include merit increases, incentive
  compensation (exempt roles only), paid holidays, paid time
  off, medical, dental, vision, short and long term disability
  benefits, 401(k) +match, life insurance, and various
  wellness programs, among others. The Company does not
  provide benefits directly to contingent workers/contractors
  and interns. Our Values:

  - Client First -> Listen, and deliver client-centric solutions
  - Be An Owner -> Take initiative, improve situations, drive
    positive outcomes
  - Excellence -> Always set the highest standard for yourself
    and others
  - Win Together -> 1 + 1 = 3

  Who We Are: Canoe Intelligence ("Canoe"), a Bloomberg
  Company, is the data management and intelligence platform
  powering how the world invests in alts. Our AI-native
  platform automates the manual data processing, cutting
  operational costs and risk while future-proofing alts
  infrastructure for long term growth. Timely, accurate, and
  comprehensive data arms investment teams to act with the
  decisiveness of public markets. Canoe's AI-driven platform
  was initially incubated in 2013 for Portage Partners LLC, a
  private multi-family office investment firm, and launched
  commercially in 2017. In October 2026, Canoe became a part
  of Bloomberg, combining our private markets data expertise
  with Bloomberg's technology, data management capabilities,
  and global scale. Together, we're building a connected
  experience across public and private markets, and investing
  in the Canoe platform, people, and dedicated client service
  that got us here. With Canoe, it's all about making Alts,
  smarter. Canoe is an equal opportunity employer and
  prohibits discrimination in employment. It is Canoe's policy
  to provide equal opportunity and access for all persons, and
  the Company is committed to attracting, retaining,
  developing, and promoting the most qualified individuals
  without regard to age, ancestry, color, gender identity or
  expression, genetic predisposition or carrier status,
  marital status, national or ethnic origin, race, religion or
  belief, sex, sexual orientation, self-identified or
  perceived sex, sexual and other reproductive health
  decisions, parental or caring status, physical or mental
  disability, pregnancy, childbirth or related medical
  conditions, or parental leave, protected veteran status,
  status as a victim of domestic violence, or any other
  classification protected by applicable law (each, a
  "Protected Characteristic").Canoe prohibits treating
  applicants or employees less favorably in connection with
  the terms and conditions of employment, in all phases of the
  employment process, because of one or more Protected
  Characteristics.
