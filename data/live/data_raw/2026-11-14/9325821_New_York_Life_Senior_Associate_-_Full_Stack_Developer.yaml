description: |
  Location Designation: Hybrid - 3 days per week  About New
  York Life At New York Life, we value career development,
  collaboration, innovation, and inclusiveness. Our culture
  supports both virtual and in-person engagement, providing
  opportunities for personal and professional growth. Join a
  company committed to doing the right thing and making a
  positive impact. Role Overview As a Full Stack Developer on
  the Client Central team, you will play a key role in
  building and integrating modern, cloud-native applications.
  This role focuses on microservices architecture, scalable
  APIs, and event-driven systems deployed on AWS. You will
  collaborate with cross-functional teams to design, develop,
  and deliver high-quality solutions that are resilient,
  scalable, and aligned to business needs. This is an
  opportunity to work on impactful, enterprise-scale platforms
  while continuously growing your technical expertise. What
  You'll Do: Application Design & Development: Design and
  develop scalable microservices-based solutions aligned with
  business and technical requirements; build and deploy cloud-
  native applications using AWS services (EKS, MSK, etc.);
  develop and maintain RESTful and GraphQL APIs using Spring
  Boot and related frameworks; design and implement event-
  driven architectures using messaging platforms such as AWS
  MSK (Kafka); develop full-stack solutions using React.js and
  backend services (Node.js, Java/Spring). DevOps & Cloud
  Engineering: Implement CI/CD pipelines using GitHub and
  Infrastructure as Code (Terraform); automate deployments and
  improve development lifecycle efficiency; manage and
  optimize cloud infrastructure for performance, scalability,
  and cost efficiency. Platform Reliability & Optimization:
  Monitor system performance and troubleshoot issues through
  root cause analysis; implement logging, monitoring,
  alerting, and cost management best practices; ensure
  applications are highly available, resilient, and scalable.
  Collaboration & Delivery: Partner with Business Analysts,
  Architects, Engineers, and DBAs to deliver end-to-end
  solutions; participate in agile ceremonies and planning
  sessions, including periodic on-site collaboration;
  contribute to continuous improvement of development
  practices and team processes. Support & Operations:
  Participate in Level 3 on-call support rotation; provide
  ongoing support and enhancements for production systems.
  What You'll Bring:

  - 5+ years of experience in full stack or backend development
  - Strong experience with microservices architecture and
    distributed systems
  - Hands-on experience building cloud-native applications on
    AWS
  - Proficiency in Java (Spring Boot) and/or Node.js
  - Experience with React.js or similar frontend frameworks
  - Experience developing RESTful and/or GraphQL APIs
  - Experience with containerization and Kubernetes (EKS
    preferred)
  - Experience with messaging systems such as Kafka / AWS MSK
  - Strong SQL skills (PostgreSQL or similar databases)
  - Experience with CI/CD pipelines and Infrastructure as Code
    (Terraform preferred)
  - Strong problem-solving, debugging, and analytical skills
  - Ability to work effectively in a collaborative, fast-paced
    environment
  - Strong written and verbal communication skills

  Preferred:

  - Experience with MuleSoft or other iPaaS integration
    platforms
  - AWS certifications or other relevant industry credentials
  - Experience in financial services or insurance domain

  Education:

  - Bachelor's degree in Computer Science, Engineering, MIS, or
    related field (or equivalent experience)

