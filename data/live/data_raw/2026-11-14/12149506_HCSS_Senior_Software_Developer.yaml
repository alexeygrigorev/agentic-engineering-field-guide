description: |
  We are HCSS. For the last 40 years, we have been developing
  software to help construction companies streamline their
  operations. Based in Sugar Land, TX, our mission is helping
  customers achieve excellence through our proven customer-
  centric, end-to-end solutions and exceptionally helpful
  service, while providing a great life for our employees.
  With this mission at the core of everything we do, HCSS is a
  pioneer and leader in the construction software space and a
  consistently recognized employer. We have earned Best
  Companies to Work for in Texas honors for 18 consecutive
  years and have been named a USA Today Top Workplace. HCSS
  has also been recognized by Built In as a Best Place to Work
  in Greater Houston and by Construction Executive for our
  technology innovation, reflecting our strong culture,
  industry leadership, and commitment to excellence.

  WHO WE NEED:

  We are looking for a Senior Software Developer with deep
  internationalization (i18n) and testing expertise to scale
  our global platforms. If you're a fit, the following things
  should sound like you:

  Qualifications:

  - 5+ years of development experience in .NET using object
    oriented programming
  - Expert knowledge of Azure cloud concepts such as: App
    Services, Azure Functions, App Insights, and app service
    plans (scaling)
  - Expert knowledge of CI/CD concepts such as: Build and
    release pipelines, infrastructure-as-code, and slot-based
    deployment
  - Strong knowledge of .NET 4.0+, .NET Core, C#, ASP.NET MVC,
    Javascript, Typescript, CSS, and React.JS
  - Solid working knowledge of SQL and associated database
    concepts (DB design and architecture, stored procedures,
    and basic TSQL queries)
  - Experience designing RESTful APIs
  - Experience with ORM such as Entity Framework or Dapper

  Bonus Qualifications:

  - Internationalization (i18n) Expertise: Proven track record
    architecting software for multi-locale, multi-currency
    applications, with deep knowledge of CLDR (Common Locale
    Data Repository), Unicode standards, and standard i18n
    libraries (such as Intl, i18next, or backend equivalents).
  - Testing Rigor: Hands-on experience building automated test
    suites (unit, integration, regression) with dedicated
    coverage for pseudo-localization, locale fallbacks, and
    boundary-condition test cases.
  - Architecture & Mentorship: Ability to guide engineering best
    practices around string extraction, translation key
    management, and CI/CD localization pipelines.

  Role Responsibilities:

  - Implement culturally and regionally accurate formatting for
    currencies, numbers, percentages, timezones, and calendars
    (e.g., ISO-8601, CLDR standards, pluralization rules, and
    RTL layouts).
  - Analyzing your assigned HCSS product(s), database schema,
    and architecture for improvements that can increase value
    (ROI, benefit to team, etc.)
  - Implementing features for your assigned HCSS product that
    are significant in scope.
  - Working closely with other developers to enhance
    infrastructure, improve reliability, and efficiency.
  - Sharing best practices at team planning, retrospective, and
    daily standup meetings.
  - Lead code reviews and mentor junior developers in best
    practices for software design, development, and testing.

  Travel Requirements:

  - Occasional travel to our office may be requested up to once
    or twice a year

  BENEFITS & PERKS:

  Part of our mission is to provide a great life for our
  employees. We believe that when our people are happy, they
  do their best work. Some of the benefits and perks we offer
  include:

  - Flexibility to work Remotely
  - Medical, dental, and vision coverage with company-paid and
    employee-paid options
  - Paid holidays, sick days, and personal time off
  - Employee Resource Groups (ERGs) that foster connection and
    inclusion
  - On-site amenities including a covered basketball court,
    soccer field, track, pickleball/tennis courts, gym, etc.
  - Dog-friendly campus and WiFi-accessible courtyards
  - 401(k) with a 5% company match
  - Coverage for employee professional development and wellness
  - And more!
