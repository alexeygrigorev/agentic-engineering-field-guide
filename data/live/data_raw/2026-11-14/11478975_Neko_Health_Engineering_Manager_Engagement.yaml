description: |
  Mission

  Neko is redefining what prevention means, from treating
  illness when it arrives, to sustaining health before it's
  ever at risk. Our mission: make data-driven, preventative
  care accessible to more people, before symptoms appear.  In
  a single, non-invasive visit under an hour, proprietary
  technology and direct clinical care combine to deliver
  personalised, actionable insights. It's a team that thinks
  in 10x, not 10%. Every role here plays a part in building a
  world where prevention is the norm, and where your work
  genuinely helps people live longer, healthier lives.

  Role Purpose

  We are looking for an Engineering Manager for Engagement: a
  building leader who has shipped consumer apps people love
  and wants to stay deep in the work. You lead a pod of four
  to six engineers, spending most of your time building and
  delivering, and the rest setting technical direction, owning
  quality and raising the bar for the people around you.

  Engagement owns the Neko app on iOS, Android and web, and
  everything around it: wearables, notifications, and the
  screens members meet during the scan and the debrief with
  their doctor. Members trust us with their health, and every
  interaction either deepens that trust or loses it. You
  obsess over creating an experience members love, come back
  to and share with their friends.

  What You'll Deliver in the First 6–12 Months

  - Ship the Engagement roadmap on time and at quality, building
    alongside the pod on the app, wearables, notifications and
    clinic screens (Impact, not activity).
  - Set the technical direction for the app at Neko: the native
    platform, health data from wearables and phones, and
    notifications, built so the app is worth opening every
    day, and a scan turns into a relationship that lasts
    (Chase 10X, not 10%).
  - Own quality: crash-free rate, performance, release cadence,
    app store standards, and clinic screens built with the
    same craft as the app (Member-first, always).
  - A pod that gets better every quarter: hiring, mentorship,
    direct feedback, and AI tools in every engineer's loop
    (Tech-enabled, human-centered).
  - Know what is really going on, in the code and in the
    numbers, and say so (Optimistic truth seeking).

  Minimum Qualifications

  - Deep experience building consumer products across the stack,
    including native mobile at scale: React Native, with Swift
    or Kotlin where needed, and web.
  - You have owned a retention or engagement metric in a
    consumer product and moved it.
  - You have owned an app store release process and a crash-free
    number.
  - You have led engineers as a tech lead or equivalent and
    raised a team's standards and judgment. Direct, low-ego,
    high expectations.
  - Daily use of AI coding tools, and you can show what you have
    shipped with them.

  Preferred Qualifications

  - Health, fitness, or behavioral products where engagement
    made a real difference to people's lives.
  - On-device health data (HealthKit, Health Connect), wearables
    or notifications at scale.
  - A strong eye for motion, animation, and the details that
    make an app feel great.

  Our Stack

  - Frontend: React, React Native, TypeScript, Swift and Kotlin
    where needed
  - Backend: C#, Node, Cosmos DB
  - Design: Figma
  - Tooling: Azure DevOps, Claude Code
