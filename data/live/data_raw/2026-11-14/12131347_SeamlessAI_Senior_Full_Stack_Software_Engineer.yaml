description: |
  About Seamless

  Seamless is building the future of AI-powered revenue
  generation.

  Sales professionals use our platform to identify prospective
  buyers, improve contact and company data, and create
  pipeline more efficiently. By combining proprietary data,
  artificial intelligence, and modern go-to-market technology,
  Seamless helps organizations connect with the right people
  and accelerate revenue growth.

  We are continuing to invest in our platform, our AI
  capabilities, and the team required to define the next
  generation of sales technology.

  Equal Employment Opportunity

  Seamless is an equal opportunity employer. We do not
  discriminate on the basis of race, religion, color, national
  origin, sex, gender, sexual orientation, age, marital
  status, veteran status, disability, or any other
  characteristic protected by applicable law.

  Visa sponsorship is not included in our hiring package.
  Applicants must be authorized to work in the United States.

  Why Seamless

  Seamless is building the future of AI-powered sales and
  revenue technology.

  Our platform brings together real-time B2B data, artificial
  intelligence, sales engagement, enrichment, automation,
  buyer signals, AI agents, APIs, integrations, and workflow
  capabilities to help revenue teams find the right buyers,
  improve contact and company data, personalize outreach,
  create pipeline, and convert more opportunities into
  revenue.

  As a Senior Full Stack Software Engineer at Seamless, you
  will have the opportunity to:

  - Own meaningful features from concept through production,
    with a direct impact on the experience of our users.
  - Build scalable, high-performing applications and services
    that support our data search engine and social profiling
    platform.
  - Work across our web application, Chrome extension, and
    connected services rather than being limited to one part
    of the stack.
  - Shape technical solutions with autonomy, collaborating
    closely with product managers and a lean remote
    engineering team.
  - Ship quality code iteratively, solve customer problems, and
    help evolve a platform that handles large volumes of data
    and concurrent requests.

  At Seamless, you’ll work with a team that values simple
  solutions, thoughtful engineering, strong ownership, and the
  ability to deliver meaningful results.

  The Opportunity

  You’ll join Seamless’s Technology organization as part of a
  lean, full stack engineering team. Your work will help
  advance our data search engine and social profiling
  platform, supporting the tools customers use to find and
  connect with the right buyers.

  You’ll take ownership of features from early requirements
  through deployment and post-launch improvement. Our
  architecture includes a customer-facing web application, a
  Chrome extension, and connected services, giving you the
  opportunity to contribute across the product and its
  underlying systems.

  You’ll build responsive interfaces with React and modern
  JavaScript while designing scalable backend services that
  handle large datasets and concurrent requests. You’ll
  collaborate with product and engineering partners, make
  sound technical decisions, and ship practical solutions
  without unnecessary complexity.

  What You’ll Own

  - Own full stack projects and deliverables from concept
    through production.
  - Build scalable, performant user interfaces using React,
    ES6/7 JavaScript, Webpack, HTML, CSS, and related modern
    tools.
  - Design, develop, and implement microservices that handle
    large volumes of concurrent requests and data.
  - Create JSON schemas and user experience workflows that
    support business processes involving hundreds of millions
    of records.
  - Translate customer requirements into practical technical
    solutions that address user needs.
  - Ship high-quality, finished code frequently through
    iterative development and MVP delivery.
  - Develop complete features with substantial autonomy while
    communicating clearly with remote teammates.
  - Drive end-to-end development from initial brief through
    post-launch analysis in partnership with product managers
    and technical stakeholders.
  - Support and improve experiences across web applications,
    browser extensions, and mobile platforms.

  What You’ll Bring

  Required Qualifications:

  - Ideally 5+ years of experience building high-quality, cloud-
    based web applications.
  - 5+ years of expertise in modern frontend technologies,
    including React, ES6/7 JavaScript, Webpack, HTML, and CSS.
  - 2+ years of experience with backend technologies including
    Node.js, Express, Postgres, and AWS.
  - Experience working with large datasets using S3, Athena,
    OpenSearch, or similar services.
  - Strong SQL skills and an analytical approach to problem-
    solving.
  - Experience working with internal APIs and integrating third-
    party APIs.
  - Experience with React Hooks and other modern React features.
  - Ability to create clear documentation for new and existing
    features and functionality.
  - Experience developing software using AI-assisted tools such
    as Claude and Cursor.

  Preferred Qualifications:

  - Bachelor’s degree.
  - UI/UX design specialization.
  - Experience developing Chrome extensions.
  - Experience with web scraping.

  Benefits

  At Seamless, we invest in our employees by offering a
  comprehensive benefits package designed to support health,
  financial well-being, work-life balance, and professional
  growth. Eligible employees have access to benefits that
  currently include:

  - Medical, dental, and vision insurance
  - Health Savings Account and Flexible Spending Account options
  - 401(k) retirement plan with company matching contributions
  - Company-paid life insurance, accidental death and
    dismemberment, and short-term disability coverage
  - Voluntary supplemental insurance options
  - Employee Assistance Program
  - Annual wellness reimbursement
  - Paid time off, company holidays, and paid parental leave for
    birthing and non-birthing parents
  - Remote-first work environment
  - Employee discount and perks program
  - Professional development, ongoing learning, coaching, and
    career-growth opportunities

  Benefits are subject to eligibility requirements and
  applicable plan documents and may be modified by Seamless at
  any time.
