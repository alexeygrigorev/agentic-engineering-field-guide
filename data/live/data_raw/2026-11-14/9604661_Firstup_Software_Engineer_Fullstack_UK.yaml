  Who We Are

  At Firstup, our mission is to improve the employee
  experience at every moment that matters, large and small. As
  the communication pipeline for the world's workforce, we now
  serve 40 of the Fortune 100 companies, reaching and
  connecting more than 17 million employees daily.

  Our employees are experts in the employee experience,
  workforce communications and technology.

  Joining Firstup means joining a movement to make work better
  for every worker. As the world’s first intelligent
  communication platform, Firstup meaningfully engages
  employees at every moment from hire to retire, and delivers
  engagement insights to help companies support, promote and
  retain their talent. Our movement has taken root and is
  evident in our world-class customer base. Now we need your
  help. Ready to make a difference in the world?

  Job Summary



  The Software Engineer will join the team responsible for
  Firstup's public APIs, Agentic tools, third-party
  integrations with enterprise systems such as HRIS platforms,
  and shared platform services. You will deliver innovative,
  scalable solutions while constantly improving our approach
  to architecture, scale, availability, and fault-tolerance.
  You are an active user of Generative AI tools and coding
  agents, applying them daily to accelerate delivery and
  improve code quality.

