description: |
  Location

  Remote (Candidates must be located at GMT+8 timezone)

  About Us

  Terminal 3 is revolutionizing digital identity with a strong
  emphasis on privacy. To date, we have issued over 6 million
  decentralized profiles for clients worldwide. Our holistic
  and functional identity solutions address the limitations
  and risks of traditional single-purpose systems, tackling
  challenges such as verification inefficiencies and fraud.

  Founded on the belief that every human should own and
  control their digital data and identity, Terminal 3 wants to
  empower a more equitable digital future, where users and
  enterprises have equal rights and protections across all
  platforms. Backed by global VCs like Illuminate Financial,
  CMCC Titan Fund, Progression Fund, IDG Blockchain, Cherubic
  Ventures, 500 Global, Consensys Mesh, BlackPine, Bixin
  Ventures, Hard Yaka, AVID3, and Bored Room Ventures,
  Terminal 3 makes fully private data freely composable,
  securing the world's most important asset while realizing
  its full value.

  Led by repeat founders and corporate executives from Google,
  Spotify, Uber, Skillshare, and SCMP, Terminal 3 is built on
  the belief that ‘good people make great teams that change
  the world’. Join us and empower a more equitable digital
  future.

  About The Role

  We are looking for a talented Frontend Software Engineer to
  join us for a focused, 3-month contract engagement. As our
  Frontend Software Engineer working on client integrations,
  you will work closely with other Engineers, Product Manager,
  Product Designers, and cross-functional teams to build the
  UI and integrations with our T3 Network for client-facing
  cybersecurity use cases.

  What You Will Do

  - Build the frontend, user-facing User Interfaces (UIs) for
    our custom cybersecurity-related integrations.
  - Collaborate with product managers and designers to deliver
    valuable features and products with high precision and
    velocity.
  - Ensure our features meet the high standards for quality,
    security, performance, scalability, cross-platform
    compatibility, reliability, etc.

  What You Need To Succeed

  - 4+ years of experience and proven track record shipping
    applications at scale
  - Expert in Typescript
  - Expert in a modern Web framework (Nextj.s preferred)
  - Proficient in using AI — especially agentic systems — for
    coding, code reviews, testing, and documentation while
    being responsible for the quality of what gets deployed.
  - Strong familiarity with the modern TypeScript web ecosystem:
    Turborepo, Vite, Turbopack, Vitest, Playwright, TanStack
    Query, Zod, tRPC, Prisma/Drizzle, etc.
  - Experience building and maintaining design systems or
    component libraries using Tailwind, shadcn/ui, Radix UI,
    React Aria, or similar tools.
  - Experience with automated testing (e.g. unit testing, UI
    testing, functional testing)
  - Great knowledge of coding design patterns and best
    practices.
  - Keen eye for design and usability.

  Would Be Awesome If You Have

  - Ability to problem-solve creatively and pragmatically
  - An appreciation for the importance of good documentation
  - Effective written and verbal English communication
  - Attention to detail
  - An entrepreneurial mindset, and the ability to thrive in a
    startup environment.

  Terminal 3 Principles

  Our day-to-day work and operations are guided by the
  following principles:

  - Ownership Over Authority
  - Transparency Over Power
  - Collaborators Inform, Experts Decide
  - Debate and Commit
  - Learn to Move Forward
  - Change Is the Indicator of Growth
  - DEI (Diversity, Equity, Inclusion) Is the Start, Not the
    Finish
  - Joy Is a Base Expectation

  How To Apply

  - Apply now on LinkedIn, and our talent acquisition team will
    review your application.
  - Submit your resume in PDF format to preserve the layout.

  We are remote-friendly with our HQ in Hong Kong and team
  members globally distributed in places such as Vietnam,
  Singapore, Taiwan, and Europe.

  Terminal 3 is an equal opportunity workplace, welcoming
  candidates regardless of race, sex, color, religion,
  disability, national origin, or age.
