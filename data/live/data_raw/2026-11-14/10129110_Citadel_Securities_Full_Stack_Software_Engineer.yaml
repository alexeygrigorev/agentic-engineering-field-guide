description: |
  Job Description Role Overview: Options market making
  presents a unique challenge in combining massive scale with
  complex financial workflows. Every day, Citadel Securities
  processes billions of market events across more than a
  million listed options while delivering pricing, execution,
  and risk management with extremely low latency. The Options
  Trading Workflow Team builds the applications and services
  that power how traders price, manage, and execute options
  trading strategies. We develop the next generation of high-
  touch trading and pricing tools that sit at the intersection
  of sophisticated backend systems and intuitive user
  experiences, enabling traders to make faster, smarter
  decisions in real time. This role offers the opportunity to
  work directly with the hiring manager on a new global OTC
  Options initiative supporting Citadel Securities'
  Institutional Derivatives, PSG, and Structured Products
  businesses. You'll help define the technology strategy for
  new products and workflows while building systems that
  enable the firm to expand into new markets and option
  instruments around the world. If you're excited by solving
  challenging distributed systems problems while creating
  high-performance user experiences that directly impact
  trading, this is an opportunity to shape the future of one
  of the world's leading market makers. Opportunities may be
  available from time to time in any location in which the
  business is based for suitable candidates. If you are
  interested in a career with Citadel, please share your
  details and we will contact you if there is a vacancy
  available. Responsibilities:

  - Help define and build the next generation of high-touch
    pricing and trading workflow tools for Options traders.
  - Partner directly with traders, quantitative researchers,
    sales teams, and business leaders to design workflows that
    improve pricing, execution, and risk management.
  - Build full stack applications spanning modern web frontends,
    backend services, APIs, and distributed systems.
  - Develop intuitive, high-performance user interfaces that
    enable traders to research, monitor, price, and execute
    trades in real time.
  - Design scalable backend services that support pricing,
    workflow orchestration, market data, and trading
    operations.
  - Build systems to support markets and option instruments
    Citadel Securities has never traded before.
  - Gain exposure to multiple global markets while helping
    expand Citadel Securities' Options platform
    internationally.
  - Prototype new ideas quickly while evolving them into robust
    production systems.
  - Analyze complex business and technical problems and deliver
    elegant software solutions across the firm.
  - Continuously improve performance, scalability, stability,
    and usability of mission-critical trading applications.
  - Collaborate across engineering, quantitative research, and
    trading teams to translate complex financial concepts into
    intuitive software.

  Qualifications:

  - 3+ years of professional software engineering experience
    building complex applications.
  - Strong experience building full stack applications using
    modern frontend and backend technologies.
  - Proficiency with TypeScript and React
  - Experience designing scalable backend services using
    languages C++ or Python
  - Experience building distributed systems and service-oriented
    architectures.
  - Experience developing real-time, high-performance
    applications.
  - Strong understanding of API design, asynchronous systems,
    and event-driven architectures.
  - Passion for creating intuitive user experiences through
    thoughtful interaction design and rapid prototyping.
  - Strong analytical and problem-solving skills with the
    ability to solve open-ended technical challenges.
  - Excellent communication and collaboration skills.
  - Bachelor's or Master's degree in Computer Science or
    equivalent practical experience.

  Nice to Have

  - Experience working with trading systems, financial markets,
    or capital markets technology.
  - Knowledge of options, derivatives, OTC products, or market
    structure.
  - Experience building visualization tools for complex
    datasets.

  Why This Role Is Unique

  - Define the next generation of high-touch pricing technology
    used by Options traders globally.
  - Work on a greenfield global OTC Options initiative with
    significant visibility across the business.
  - Build technology supporting Institutional Derivatives, PSG,
    and Structured Products trading desks.
  - Help launch entirely new products, markets, and trading
    capabilities.
  - Collaborate daily with world-class engineers, traders, and
    quantitative researchers.
  - Own projects that have immediate impact on global trading
    operations.

  In accordance with applicable law, the base salary range for
  this role is $175,000 to $350,000.  In addition, the
  employee who fills this role will be eligible to participate
  in a discretionary incentive compensation program, as well
  as a wide array of benefit programs, such as medical and
  life insurance, retirement and tax-free savings plans, and
  access to other healthcare programs. About Citadel
  Securities Citadel Securities is a technology-driven, next-
  generation global market maker. We provide institutional and
  retail investors with world-class liquidity, competitive
  pricing and seamless front-to-back execution in a broad
  array of financial products. Our teams of engineers, traders
  and researchers harness leading-edge quantitative research
  and the accelerating power of compute, machine learning and
  AI to power our analytics and tackle the market's and our
  clients' most critical challenges. Together, we are forging
  the future of capital markets. For more information, visit
  citadelsecurities.com .
