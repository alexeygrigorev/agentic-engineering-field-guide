description: |
  Join us in building a better financial system. Wealthfront
  is continuing to grow and needs managers who are excited to
  lead talented teams of engineers to improve and expand our
  products, while maintaining a commitment to high engineering
  quality standards.



  Engineering managers at Wealthfront have a solid background
  as hands-on engineers and have realized that they can have
  more impact through their organizations as leaders. The
  largest impact you will have will be through identifying,
  developing, and coaching “whole engineers” who take
  ownership of their projects. With guidance from you, the
  engineers on your team will take full responsibility for
  their work, which may include working with cross functional
  stakeholders directly, authoring their own engineering
  designs, performing and overseeing their implementations,
  and taking full responsibility for their code running in
  production. Along the way, you will also help us develop the
  engineering organization, taking a first principles approach
  to problems like hiring, performance reviews and project
  management.



  About Wealthfront Engineering

  Wealthfront’s culture centers around continuous learning,
  innovation, and quality-driven software development. With
  high quality software as our ultimate engineering objective,
  our key tactic is automation:



  • Wealthfront software automates the financial services we
  provide to our clients, and within these services we
  automate the collection of data that we learn from on our
  way to making our services even better.



  • Wealthfront engineers function as builder/operators, with
  dual responsibility for building the system and operating it
  in production. Any toil that this brings about is automated
  away by engineers. This investment in automation is
  expected, and the prioritization of it is always built into
  our planning and execution.



  • Wealthfront engineers automate our development processes.
  For example, Wealthfront engineers automate all of our
  testing. Manual testing is not part of the software
  development lifecycle at Wealthfront.



  • Wealthfront engineers automate observability in case of
  failure. If something is up, our systems inform engineers
  appropriately. If our systems are quiet, they are healthy.

  Responsibilities:

  - Lead a team of 6-10 engineers in execution and operational
    excellence
  - Collaborate with the tech leads and other functions (product
    management, design, product support, brokerage operations)
    to understand and respond to changing priorities
  - Monitor and improve team productivity, remove roadblocks,
    identify and implement improvements to our process, and
    act as scrum master for the team
  - Facilitate the exchange of information among all Wealthfront
    employees in a systematic manner
  - Lead or contribute to effective organizational improvement
    within the engineering organization or Wealthfront
  - Combine data-driven process and human empathy to iteratively
    develop and assess our collective teams and individual
    team members
  - Evaluate technical abilities of individual engineers, in
    order to match them with projects which demonstrate their
    strengths and stretch them to grow
  - Partner with Recruiting to build well-rounded, effective,
    and inclusive engineering teams

  Requirements:

  - B.S. or M.S. in Computer Science or equivalent experience
  - 4+ years as a software engineer developing and operating
    systems within the core business
  - 1+ years engineering management experience
  - Track record of leading productive engineering teams
  - Experience hiring, mentoring, coaching and developing
    engineers into top performers
  - Understanding of successful team dynamics and how your role
    as a manager fits into this process
  - Passionate about collaborative problem solving
  - Eagerness to solve challenging problems

  Estimated annual salary range: $208,000 - $260,000 plus
  generous equity and a discretionary bonus.

  Benefits include medical, vision, dental, 401K matching,
  Employee Stock Purchase Plan, generous time off, parental
  leave, wellness reimbursements, professional development,
  employee investing discount, and more!

  About Wealthfront

  Here at Wealthfront, our mission is to create a financial
  system that favors people, not institutions. We do this by
  leveraging technology to build powerful, low-cost, and easy-
  to-use financial products that help modern investors grow
  and manage their money.

  We started with the ambition to transform the investment
  advisory industry when we pioneered automated investing in
  2011. By automating strategies typically reserved for the
  wealthy, we unlocked access to high quality investment
  advice for a digitally-native generation that was
  underserved by traditional institutions. Since then, we've
  expanded to a full suite of products designed to help our
  clients save, spend, invest, and borrow for all of their
  goals, including:

  •A Cash Account that, through our program banks, offers one
  of the highest annual percentage yields on uninvested cash
  in the industry, while providing instant and secure access
  to your money with no account fees and a full suite of
  checking features.

  • Multiple automated investing portfolios managed for you
  and tailored for long-term wealth building across various
  financial needs, including general investing, retirement,
  family wealth management, and more. Our taxable investing
  accounts are designed to unlock tax savings through
  sophisticated strategies like fixed income, tax-loss
  harvesting, and direct indexing—which we offer at industry-
  leading low costs and accessible minimums.

  • A zero-commission Brokerage Account with 8000+ stocks and
  ETFs that’s designed to give DIY investors an incredibly
  easy way to get started investing. Plus, with our Cash
  Account, they can earn a high yield (from program banks)
  until the minute they’re ready to invest.

  • A digital-first mortgage experience designed to reduce
  costs, remove unnecessary friction, and aim to offer rates
  consistently below the national average.

  Our award-winning products have attracted over 1.5 million
  funded clients who trust us with more than $100 billion of
  their hard earned savings on our platform—and we're far from
  done. If you’re inspired to help us reshape the financial
  industry as we create our next chapter, let’s talk!

