description: |
  Ohme is on a mission to accelerate the global transition to
  clean, affordable energy. We do that by serving as an
  integrated hardware and software smart-grid platform,
  focused on the residential EV charging market.

  The worlds of energy, transport and artificial intelligence
  are colliding and Ohme is at the heart of this new era. By
  using technology and data integrations to connect cars,
  chargers, people, energy providers and more, Ohme has a
  powerful platform that puts the consumer at the core.

  Ohme has been selling its chargers to consumers since mid
  2019 and has had exponential growth since. We are now
  operating in multiple countries and have partnerships with
  the likes of VW Group, Hyundai, Volvo, Octopus Energy, and
  other innovative brands.

  We are scaling up the business and are building out the team
  for rapid growth. If you’re interested joining a fast-
  growing cleantech venture on a data and AI-first journey to
  speed up the global transition to clean, affordable energy,
  read on!

  We're looking for a curious Product Manager to join our
  Product team in London: keeping firmware delivery on track
  across our charger range and helping bring our products to
  new markets. Working closely with our firmware leads, you
  will own feature scope, coordinate releases, and define how
  we measure that features work once they are in the field.
  This is a great opportunity for someone who enjoys sitting
  at the intersection of product and embedded engineering in a
  fast-growing cleantech business.

  You will work from our London office 3 days a week.

  Responsibilities

  - Work closely with HW / BE / FE / Mobile and other
    stakeholders to define requirements, create a roadmap and
    manage sprints.
  - Own feature development end to end, from scoping and feature
    design through to delivery.
  - Define success metrics for features and firmware releases,
    and oversee the testing, rollout and monitoring plans.
  - Coordinate firmware releases across our charger range, from
    readiness and sign-off through to rollout across multiple
    variants and markets.
  - Support new-region launches by translating local market
    requirements into firmware scope.

  Who you are

  Live our values: Customer Obsessed, Collaboration,
  Progressive, Brave, Do Good. Be a team player with creative
  opinions, focused on driving solutions. Always look forward
  and learn from mistakes.

  - Strong communicator: Able to align engineers, QA and
    commercial stakeholders around a shared plan.
  - Pragmatic: You thrive in a fast-moving scale-up, balancing
    rigour with momentum.
  - Technically fluent: Comfortable working closely with
    firmware engineers and translating technical detail into
    clear product decisions.
  - Delivery-focused: You keep teams on track, surface blockers
    early, and drive roadmaps through to completion.
  - Detail-oriented: You write clear, unambiguous feature
    specifications and define what good looks like before work
    begins.
  - Data-driven: You define the metrics and signals that prove a
    feature is behaving correctly in the field.
  - Excited for AI: You understand how to leverage technology/AI
    in streamlining your process and workflow, and you are
    able to evangelise this with your peers

  Required Experience:

  - Likely you will have 4+ years of work experience in a
    product-first tech industry, with 1+ year of experience in
    product management.
  - Experience in managing product delivery across an
    engineering team – if you have managed a firmware team
    this is a bonus!
  - Experience supporting multi-market or multi-variant launches
    is a plus, along with a passion for clean technology, EVs,
    or the energy transition.

  Our benefits:

  - Competitive salary and bonus
  - Hybrid office
  - Private Health Insurance
  - Aegon Pension Scheme
  - Life Assurance Scheme with death in service benefit of 4x
    salary
  - Income Protection Scheme for long term illness
  - Ride to Work Scheme
  - Payroll Giving Scheme
  - Season Ticket Loan to spread cost of travel over 12 months
  - Eye Test every 2 years

  Ohme is an equal opportunity employer. Diversity, Equity and
  Inclusion are at the heart of what we do and we encourage a
  culture where everyone can be themselves at work. We
  actively seek out a diverse range of talent and our policies
  ensure that every job application and employee is treated
  fairly, with equal opportunity to succeed and to feel
  included.
