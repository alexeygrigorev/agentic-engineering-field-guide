description: |
  Tremendous is the global platform built for businesses to
  send payouts - gift cards and money - to anyone, anywhere,
  instantly. We're trusted by 20,000+ organizations, from
  startups to giants like Google, GitHub, and Notion, to reach
  millions of recipients worldwide.

  We're profitable and growing without outside investors.
  We're fully remote, with a high-documentation, low-meeting
  culture that leaves more time for the work that matters -
  and for your life outside it. Our employee NPS sits in the
  80s.

  About the role

  What we work on: Customers can send thousands of payouts in
  a few clicks, but making that simple takes complex
  engineering. We move billions of dollars through our
  platform, manage a catalog of 2,500+ redemption options, and
  deliver to recipients in 200+ countries. Our work spans the
  whole experience: helping businesses get started, giving
  large organizations the tools to manage their payouts,
  expanding what customers and recipients can do with
  Tremendous, and building the platform that supports it all.

  How we build: Engineers drive projects end to end, from
  helping shape what gets built to measuring whether it
  worked. We work async, so writing is how work gets done
  here. Projects start with a tech brief, and we document
  decisions so teammates can catch up without another meeting.
  We use AI throughout to write and review code, explore
  unfamiliar parts of the codebase, and pressure-test ideas.

  What we value: We’re deliberate about which tech debt we
  tackle and when, prioritizing work that unblocks development
  and strengthens our infrastructure. When incidents happen,
  we respond, conduct a blameless post-mortem, and address the
  underlying causes - whether they’re in our systems,
  processes, or application security. We work through problems
  openly, seek input from people who know the problem best,
  and change our minds when someone has a better answer.

  What you’ll do

  - Architect, build, and test substantial features across the
    stack. Choose technical approaches that balance delivery
    speed, reliability, and maintainability.
  - Work with PMs and designers to scope projects, estimate
    effort, surface complexity and tradeoffs early, and keep
    everyone in the loop as things change.
  - Make the team around you faster and better through
    documentation, tooling, code review, and mentorship.
  - Own what you ship in production: monitor releases and debug
    what breaks.

  What you’ll bring

  - Experience building complex web applications with
    demonstrated ownership across the stack. You write
    correct, maintainable, secure code and choose solutions
    that fit the problem.
  - Deep expertise with a modern web framework, ideally Ruby on
    Rails or React. Our stack also includes TypeScript,
    PostgreSQL, and Google Cloud.
  - Independence. You thrive with autonomy. You break big,
    ambiguous problems into shippable pieces, unblock
    yourself, and adapt to whatever a project needs.
  - Product sense. You care about why you’re building something,
    not just how. You ask questions that clarify the user’s
    problem and use that understanding to make sensible
    tradeoffs.
  - Strong written communication. You write concise,
    constructive technical briefs, code reviews, and project
    updates.
  - Curiosity. You enjoy digging into unfamiliar domains and
    figuring out problems without an obvious playbook. You
    seek feedback and use what you learn to become a better
    engineer.
  - Effective use of AI. You use AI heavily to accelerate your
    work while remaining accountable for every line you ship.
    You review, test, and refine AI output with the judgment
    of an experienced engineer building a product we’ll
    maintain for years.

  What's cool about the role

  - Competitive pay and equity. Base salary for this role:
    $150,000 - $280,000.
  - Comprehensive benefits. 100% covered health (US), unlimited
    PTO, 12-16 weeks paid parental leave. Read more about our
    benefits here.
  - We invest in your tools. Everyone has a $5k/month budget for
    AI tools.
  - Fully remote. Work from anywhere in the Americas.
  - Great culture. Read more about how we work in our public
    handbook.
