description: |
  Are you ready to make an impact at DTCC?

    Do you want to work on innovative projects, collaborate
  with a dynamic and supportive team, and receive investment
  in your professional development? At DTCC, we are at the
  forefront of innovation in the financial markets. We are
  committed to helping our employees grow and succeed. We
  believe that you have the skills and drive to make a real
  impact. We foster a thriving internal community and are
  committed to creating a workplace that looks like the world
  that we serve.


    The Information Technology group delivers secure, reliable
  technology solutions that enable DTCC to be the trusted
  infrastructure of the global capital markets. The team
  delivers high-quality information through activities that
  include development of essential, building infrastructure
  capabilities to meet client needs and implementing data
  standards and governance.





  Pay and Benefits:




  - Competitive compensation, including base pay and annual
    incentive
  - Comprehensive health and life insurance and well-being
    benefits, based on location
  - Pension / Retirement benefits
  - Paid Time Off and Personal/Family Care, and other leaves of
    absence when needed to support your physical, financial,
    and emotional well-being.
  - DTCC offers a flexible/hybrid model of 3 days onsite and 2
    days remote (onsite Tuesdays, Wednesdays and a third day
    unique to each team or employee).



   The Impact you will have in this role:

   The Development family is responsible for creating,
  designing, deploying, and supporting applications, programs,
  and software solutions. May include research, new
  development, prototyping, modification, reuse, re-
  engineering, maintenance, or any other activities related to
  software products used internally or externally on product
  platforms supported by the firm. The software development
  process requires in-depth subject matter expertise in
  existing and emerging development methodologies, tools, and
  programming languages. Software Developers work closely with
  business partners and / or external clients in defining
  requirements and implementing solutions. The Software
  Engineering role specializes in planning, documenting
  technical requirements, designing, developing, and testing
  all software systems and applications for the firm. Works
  closely with architects, product managers, project
  management, and end-users in the development and enhancement
  of existing software systems and applications, proposing and
  recommending solutions that solve complex business problems.

  About the Role

  We are seeking a highly motivated senior level Appian
  Developer to join our technology team and build scalable,
  enterprise-grade workflow and case management solutions on
  the Appian platform. This role requires strong hands-on
  development expertise, integration experience, and the
  ability to collaborate closely with business and technology
  stakeholders to deliver high-quality digital solutions.

  What We're Looking for

  A hands-on technical leader who is passionate about building
  scalable solutions, driving engineering excellence, and
  partnering effectively across business and technology teams
  to deliver measurable business value. The ideal candidate
  brings a strong ownership mindset, enjoys solving complex
  business problems, and thrives in a collaborative Agile
  environment.




  Your Primary Responsibilities:




  - Design, develop, test, and deploy Appian applications,
    including process models, records, interfaces, reports,
    business rules, and integrations.
  - Develop and support integrations with enterprise systems
    using REST/SOAP APIs and modern authentication mechanisms.
  - Collaborate with business stakeholders, product owners,
    architects, and development teams to deliver innovative
    business solutions.
  - Drive application quality through code reviews, adherence to
    best practices, and reusable design patterns.
  - Support CI/CD processes, production deployments,
    troubleshooting, and operational excellence.
  - Contribute to solution design discussions and continuously
    improve application performance, scalability, and
    maintainability.
  - Act as a technical expert on one or more applications
    utilized by DTCC
  - Work with the Business System Analyst to ensure designs
    satisfy functional requirements
  - Partner with Infrastructure to identify and deploy optimal
    hosting environments
  - Tune application performance to eliminate and reduce issues
  - Research and evaluate technical solutions consistent with
    DTCC technology standards
  - Align risk and control processes into day to day
    responsibilities to monitor and mitigate risk; escalates
    appropriately
  - Apply different software development methodologies dependent
    on project needs
  - Contribute expertise to the design of components or
    individual programs, and participate in the construction
    and functional testing
  - Support development teams, testing, troubleshooting, and
    production support
  - Create applications and construct unit test cases that
    ensure compliance with functional and non-functional
    requirements
  - Work with peers to mature ways of working, continuous
    integration, and continuous delivery
  - Aligns risk and control processes into day to day
    responsibilities to monitor and mitigate risk; escalates
    appropriately



  Qualifications:



  - 7+ years of Appian/BPM development experience delivering
    enterprise applications.
  - Strong expertise in Appian Process Models, SAIL,
    Records/Data Fabric, Security, Reports, Rules, and
    Integrations.
  - Experience with REST APIs, SQL, relational databases, and
    Agile development methodologies.
  - Strong analytical, problem-solving, and communication
    skills.
  - Appian Certified Senior Developer (or higher) preferred.
  - Experience building workflow, case management, or process
    automation solutions.
  - Experience integrating Appian with enterprise applications
    and cloud-based platforms.
  - Exposure to AI-enabled automation, analytics, and modern
    DevOps practices.
  - Financial Services or regulated industry experience is a
    plus.



  Talents Needed for Success:



  - Fosters a culture where honesty and transparency are
    expected.
  - Stays current on changes in his/her own specialist area and
    seeks out learning opportunities to ensure knowledge is
    up-to-date.
  - Invests effort to individually coach others.
  - Builds collaborative teams across the organization.
  - Communicates openly keeping everyone across the organization
    informed.


  The salary range is indicative for roles at the same level
  within DTCC across all US locations. Actual salary is
  determined based on the role, location, individual
  experience, skills, and other considerations. We are an
  equal opportunity employer and value diversity at our
  company. We do not discriminate on the basis of race,
  religion, color, national origin, sex, gender, gender
  expression, sexual orientation, age, marital status, veteran
  status, or disability status. We will ensure that
  individuals with disabilities are provided reasonable
  accommodation to participate in the job application or
  interview process, to perform essential job functions, and
  to receive other benefits and privileges of employment.
  Please contact us to request accommodation.

