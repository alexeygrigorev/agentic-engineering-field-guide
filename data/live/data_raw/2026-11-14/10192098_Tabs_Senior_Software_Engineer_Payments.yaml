description: |
  Tabs is the AI Operating System for Revenue, built for
  modern finance and accounting teams. It combines deep
  revenue and accounting expertise with the agents and
  applications needed to run revenue work end to end. Tabs
  understands customer and contract context, applies
  accounting logic, and executes critical workflows with built
  in controls, auditability, and human oversight. With Tabs,
  finance teams can move from manually managing revenue
  workflows to directing outcomes while the system executes
  the work.

  About the Role

  Tabs is seeking a Senior Software Engineer specifically
  focused on building out custom payments workflows and
  integrations with payment service providers. As a member of
  our early-stage startup, you’ll have the opportunity to
  shape the direction of the company and make a meaningful
  impact on our success.

  How We Work

  - We work hard. Two-week sprints based on defined goals with
    short feedback cycles. Built around intra-month product
    releases.
  - We work smart. Get in front of the customer, use both data
    and customer feedback to drive decisions, while keeping
    the bigger picture in mind. Hash out your ideas with other
    smart engineers who are dedicated to coming up with great
    solutions.
  - We work together. In-office culture with people you want to
    work with. Lots of whiteboard space. Expense lunch and
    dinner when in the office, and bagel Fridays!

  What You'll Do

  - Be our payments expert as we build out systems that support
    multiple PSPs and other exciting similar payment
    opportunities. There are a lot of moving pieces that have
    to line up and you’ll own and drive significant projects
    that make it work.
  - Work closely with other engineering teams to make sure the
    entire revenue lifecycle delivers a frictionless billing
    and payment experience for our merchants and their
    customers.
  - Put AI to work everywhere it can move the needle, whether
    it’s product automation, business process improvement, or
    the team’s day-to-day workflow. We're dealing with our
    customers' revenue, so we use AI aggressively while also
    getting the numbers exactly right.
  - Level up the engineers around you. The team's about 30 today
    with a good range of experience and backgrounds, and we’re
    growing fast. You'll be someone people look up to as you
    set the technical bar, mentor and learn from those around
    you, and shape the kind of culture we want as we get
    bigger.

  About You

  - You’ve been building software professionally for 5+ years
    and shipped high-impact products with a specialization in
    building payments systems with at least a couple of
    Payment Processors.
  - You've led big, complex system design before, ideally
    somewhere that was moving and growing fast.
  - You're hands-on with modern languages and frameworks. You
    still like being in the code, not just talking about it.
  - You've got a strong grip on the fundamentals like
    algorithms, data structures, and distributed systems. You
    know how to apply them where they actually matter.
  - You’re genuinely excited about AI, already using it, testing
    its limits, and keeping up with the latest advancements.
  - Ambiguity doesn't slow you down. You thrive in the early,
    undefined stage of a problem where you get to shape the
    answer rather than follow a spec.
  - You're the kind of engineer other engineers want to learn
    from, and you truly enjoy that aspect of the role.
  - Not sure you tick every box? Apply anyway. If you're excited
    about what we're building, we want to hear from you.

  Tech & Tools

  - Day to day, you'll be in Next.js, Nest.js, TypeScript, and
    React.
  - You'll have a wide range of GenAI systems and tooling to
    build with, and a lot of freedom in how you use them.
  - We run on AWS and Vercel, with Datadog and Sentry for
    observability, and Stripe and Plaid powering payments.
  - For everything else, we use modern tools like Slack, Notion,
    Linear, and Google Workspace.

  Location: NYC, 5 days onsite

  Perks and Benefits (Full-time Employees)

  - Competitive compensation and equity
  - Unlimited PTO
  - Up to 100% employer covered monthly healthcare premium
    (medical, dental, vision)
  - Lunch provided via Sharebite, plus dinner for any later in
    office days.
  - Parental leave up to 12 weeks
  - Tax free commuter and parking benefits
  - Voluntary insurances (Life, Hospital, Critical Illness,
    Accident)
  - Employee Assistance Program (Rightway)
  - Free One Medical Membership
  - 401k

  Tabs is an equal opportunity employer. We welcome teammates
  of all identities and do not discriminate on the basis of
  race, ethnicity, religion, gender identity, sexual
  orientation, age, disability, veteran status, or any other
  protected characteristic. We’re committed to creating an
  environment where everyone can grow, contribute, and feel
  comfortable being themselves.
