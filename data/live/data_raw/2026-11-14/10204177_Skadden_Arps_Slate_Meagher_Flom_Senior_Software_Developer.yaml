description: |
  We invite you to review our current business services
  professionals openings to learn about the opportunities
  available across the firm.

  About Us

  Skadden, Arps, Slate, Meagher & Flom LLP has forged a
  reputation as one of the most prestigious law firms in the
  world. Relying on innovation, intellect, teamwork and
  tenacity, our lawyers deliver the highest quality advice and
  novel solutions to our clients’ legal issues. We are known
  for handling the most complex transactions,
  litigation/controversy issues, and regulatory matters, as
  well as for the strong partnerships we build with clients
  and each other. Our attorneys, who reflect a broad range of
  experiences and perspectives, work together seamlessly
  across 50-plus practices and 21 offices in the world’s major
  financial centers.

  The Opportunity

  We are seeking two Senior Software Developers to join our
  Firm. This position will be based in our White Plains or New
  York office (remote, with on-site presence 1-2 times per
  month). The Senior Software Developers will work as members
  of a multidisciplinary project team responsible for
  designing, developing and supporting integrated applications
  for the Firm. Application categories include Business
  Process, HR self-service, Finance, Business Development,
  Marketing, Knowledge Management, and Client Relationship
  Management. Provides senior-level technical expertise across
  the Firm’s application portfolio and plays a key role in the
  design and implementation of complex enterprise solutions.
  Participates in the development of modern full-stack
  applications and AI-enabled services built on technologies
  including .NET, React, and Python. Serves as a senior
  engineering contributor responsible for translating business
  requirements into scalable technical solutions, contributing
  to architecture decisions, and ensuring high standards of
  code quality, performance, and maintainability.

  ESSENTIAL FUNCTIONS:

  - Designs and develops complex application components
    including APIs, application logic, database structures,
    system integrations, and modern web-based user interfaces.
  - Participates in the architecture and design of modern
    enterprise applications utilizing technologies such as
    .NET, React, Python, and AI-enabled services.
  - Contributes to the development of AI-powered application
    capabilities including integration with large language
    models (LLMs), semantic search, and Retrieval-Augmented
    Generation (RAG) patterns where appropriate.
  - Leads implementation of complex development tasks and
    supports architectural initiatives across multiple
    application workstreams.
  - Develops production-quality code using C#, .NET, Python, and
    modern JavaScript frameworks including ReactJS and
    TypeScript.
  - Works closely with development teams to ensure adherence to
    established engineering standards, development patterns,
    and best practices.
  - Participates in technical design discussions and contributes
    to system architecture decisions.
  - Supports debugging, performance optimization, and
    modernization of existing Firm applications.
  - Creates and maintains technical documentation including
    system designs, technical specifications, architecture
    diagrams, and operational procedures.
  - Participates in code reviews and provides mentorship and
    technical guidance to junior developers.
  - Works with data architects, programmers and database
    administrators to assure adherence to development
    standards including code reviews, iterative quality
    assurance (QA) testing, interoperability testing and post
    implementation monitoring strategies.
  - Collaborates with product owners, data teams and business
    stakeholders to translate business requirements into
    technical solutions.
  - Works with DevOps and infrastructure teams to support CI/CD
    pipelines, deployment strategies, and application
    lifecycle management.
  - Keeps current on relevant industry trends, methodologies and
    technologies including modern development frameworks and
    AI-enabled application platforms.

  EDUCATION AND EXPERIENCE:

  - Bachelor's degree in Computer Science or related field
  - Minimum of five years' of related technical experience in a
    professional services environment or enterprise
    application development environment

  Culture & Life at Skadden

  What makes Skadden special is our people and the culture,
  community and spirit of collaboration we have created. We
  believe in teamwork and inspiring each other to be our best
  in an atmosphere that promotes professionalism and
  excellence in all that we do. We know that inclusion and
  drawing on the strength of a wide spectrum of talent only
  make us better and is vital to the firm's success. Our goal
  is for everyone at the firm to enjoy a challenging career
  with opportunities for development and growth and to support
  the well-being of our attorneys and business services
  professionals.

  Benefits

  The overall well-being of our team is important to us. We
  offer generous benefits to help you achieve wellness in all
  areas of your life.

  - Competitive salaries and year-end discretionary bonuses.
  - Comprehensive health care (medical, dental, vision), savings
    plan/401(k) and voluntary benefits.
  - Generous paid time off.
  - Paid leave options, including parental.
  - In-classroom, remote, and on-demand learning and
    professional development opportunities.
  - Robust well-being classes and programs.
  - Opportunities to give back and make an impact in local
    communities.

  For further details, please visit:
  https://www.skadden.com/careers/staff/employee-benefits

  The starting base salary for this position is expected to be
  within the range listed under Salary Details.  Actual salary
  will be determined based on skills, experience (to the
  extent relevant) and other-job related factors, consistent
  with applicable law.

  Salary Details

  $160,000 - $180,000

