  Atlassians can choose where they work - whether in an
  office, from home, or a combination of the two. That way,
  Atlassians have more control over supporting their family,
  personal goals, and other priorities. We can hire people in
  any country where we have a legal entity. Atlassian's
  Trusted Data Platform (TDP) provides secure, reliable, and
  scalable data-storage capabilities used by Atlassian product
  and platform teams. It helps those teams manage persistent
  customer data while meeting complex enterprise requirements,
  including data residency, encryption, regulatory compliance,
  backup and recovery, and operation across multiple cloud
  environments. TDP SQL is Atlassian's managed relational
  database platform. It gives engineering teams a supported
  way to build applications on relational databases without
  having to manage the underlying infrastructure,
  availability, security, scaling, and enterprise controls
  independently. We are looking for a Senior Engineering
  Manager to lead the TDP SQL engineering team. This leader
  will be accountable for the team's people, strategy,
  execution, and operational outcomes. They will partner with
  senior engineers, product and program leaders,
  infrastructure teams, security specialists, and Atlassian
  product organizations to evolve TDP SQL as a dependable,
  easy-to-adopt internal platform. Success in this role means
  building a strong engineering organization, operating a
  highly reliable platform, and translating complex customer
  and infrastructure requirements into a clear and executable
  roadmap. Team and organizational leadership

  - Lead, coach, and develop engineering managers and engineers,
    establishing clear expectations and accountability.
  - Build an inclusive, high-performing team through effective
    hiring, onboarding, talent development, and succession
    planning.
  - Develop senior technical and leadership talent by delegating
    meaningful ownership to managers and senior engineers.
  - Establish operating practices that support good decisions,
    predictable execution, and continuous improvement.
  - Manage capacity across strategic investments, customer
    commitments, operational work, and technical debt.

  Strategy and execution

  - Define and execute the TDP SQL strategy and roadmap in
    alignment with Atlassian's broader data-platform and
    cloud-infrastructure goals.
  - Translate enterprise, product, and platform requirements
    into measurable outcomes, milestones, and engineering
    plans.
  - Surface delivery risks, cross-team dependencies, capacity
    constraints, and required trade-offs early.
  - Establish clear ownership and decision-making
    responsibilities across TDP SQL and its partner teams.
  - Increase platform adoption by reducing integration
    complexity and delivering well-supported, production-ready
    capabilities.

  Reliability and customer trust

  - Own the operational health of TDP SQL, including
    availability, durability, performance, security,
    compliance, and recoverability.
  - Establish service-level objectives, operational indicators,
    review mechanisms, and sustainable on-call practices.
  - Lead the response to material incidents and ensure that
    lessons produce durable technical and organizational
    improvements.
  - Ensure the platform supports enterprise needs such as data
    residency, encryption, backup and recovery, disaster
    recovery, and regulated environments.
  - Maintain clear visibility into customer commitments and
    intervene when delivery or reliability risks threaten
    those outcomes.

  Technical and platform leadership

  - Partner with senior technical leaders to establish
    architectural direction and make high-quality technical
    decisions.
  - Guide the platform's evolution across multiple cloud
    providers and specialized operating environments.
  - Ensure designs account for scalability, tenant isolation,
    migration safety, security, operability, and
    reversibility.
  - Balance near-term delivery with platform simplification,
    lifecycle management, and reduction of operational burden.
  - Establish clear technical and operational contracts with
    dependent infrastructure and customer teams.

  Cross-functional leadership and economics

  - Build trusted partnerships across product, engineering,
    security, compliance, reliability, infrastructure, and
    customer-facing teams.
  - Resolve cross-organizational dependencies through explicit
    owners, acceptance criteria, and delivery dates.
  - Represent TDP SQL in engineering reviews, leadership forums,
    operational reviews, and portfolio planning.
  - Own the platform's cost posture, including infrastructure
    efficiency, demand forecasting, unit economics, and cost
    attribution.
  - Make investment decisions that prioritize customer trust,
    strategic platform value, and sustainable cost efficiency.

