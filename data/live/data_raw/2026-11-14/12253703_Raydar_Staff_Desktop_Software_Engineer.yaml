description: |
  About the company

  Our client is an AI company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Own the architecture, reliability and native feel of a
  desktop client application for a personal computer platform,
  and build system-level features that read screen context and
  handle device input. The role pairs senior client
  engineering with close attention to how the application
  behaves across a wide range of machines.

  What you'll do

  - Own the architecture and reliability of a desktop
    application built with Electron.

  - Make the application feel native across the full range of PC
    hardware it runs on.

  - Build system-level features that interact with on-screen
    context and device control.

  - Guide the design of shared client foundations that other
    developers rely on.

  Requirements

  What we're looking for

  - Hands-on experience building desktop software for a personal
    computer platform, or extensive client-side development
    alongside a clear drive to specialize in that platform.

  - Routine personal use of the desktop operating system the
    role targets.

  - Past work on a consumer-scale product with a broad audience.

  - Familiarity with platform interface guidelines, including
    tray icon and taskbar behavior, hotkeys, and building
    interfaces that feel like the operating system's own apps.

  - A track record of creating foundational software layers that
    a team of developers later relied on, rather than only
    extending code someone else structured.

  - Based in a US time zone.

  Bonus points

  - Exposure to system-level integration work, such as assistive
    technology interfaces, reading on-screen content or
    driving input programmatically.

  - Experience with the Electron framework.

  Benefits

  Compensation and benefits

  - Base salary: USD 270,000 to 350,000 per year

  - Equity

  - Health, dental and vision coverage

  - Parental leave

  - Flexible time off

  - Retirement plan with employer match

  - Commuter benefits

  - Relocation assistance

  Location and work model

  - Remote (US)

  - Remote, full-time
