description: |
  Layer Health was founded in 2023 by leading machine learning
  researchers from MIT and Harvard Medical School. We are
  building an AI layer that can accurately and scalably
  synthesize information from medical records, with the
  mission to reduce friction everywhere in healthcare. Our
  LLM-powered platform is solving chart review once and for
  all, across use cases. For health systems, our first product
  dramatically accelerates clinical registry abstraction in
  areas ranging from surgery and cardiology, to oncology. Our
  long term vision is for our AI layer to safely transform
  patient care and minimize unnecessary heartbreak. Layer
  Health’s diverse founding team brings expertise across
  machine learning, UI/UX, large language models, and
  medicine.

  Here’s a collection of articles about our product, mission,
  recent funding round, etc.

  We’re seeking exceptional engineers to join our seed-stage
  company as early members. Together, we will create the AI
  layer that will redefine healthcare for the better.

  Job Description

  We’re hiring an experienced product-minded full stack
  engineer to join our team. In this role, you will own the
  end to end development of new features and product
  experiences to supercharge Layer Health’s internal and
  customer facing applications.

  You can expect to:

  - Design, build, and maintain scalable and performant APIs and
    web applications.
  - Speak with customers to understand their needs and design
    solutions to address them.
  - Collaborate on a cross-functional team to design and ship
    new product features/experiences.
  - Cultivate a robust engineering and product culture that
    drives the company forward.
  - Work closely with Layer’s engineers to design highly
    scalable, fast, and secure applications deployed in
    critical healthcare environments.

  We look for:

  - 7+ years of experience in full stack software development,
    with the ability and flexibility to traverse the stack
    when necessary.
  - Fluency in Typescript, React, and other modern web
    technologies (we use React).
  - Fluency in one or more backend languages (we use Python).
  - A strong communicator who thrives in a customer-focused,
    fast-paced environment.
  - A proactive problem-solver with a strong sense of ownership
    and the ability to work independently.
  - An excited and adaptable team player who wants to disrupt
    the healthcare industry with AI/ML, alongside an awesome
    team.
  - We are a Boston-based company, and expect engineers to meet
    regularly in-person in Boston (engineers from Boston, NYC,
    or east coast are welcome).

  Join us and help us transform healthcare with AI.

  Layer Health is committed to foster an environment of
  inclusion that is free from discrimination.  We are an Equal
  Opportunity Employer where employment is decided on the
  basis of qualifications, merit, and business need. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, protected Veteran status, or any other
  characteristic protected by law.

  Expected compensation range for this role is
  $180,000-220,000 for Boston and NYC-based candidates; range
  may vary for candidates outside of the Boston/NYC metro
  area. Compensation is dependent on experience, overall fit
  to our role, and candidate location. Expected compensation
  ranges for this role may change over time. If your
  compensation requirement is greater than our posted salary
  ranges, please still consider applying to our role. We will
  make a determination as to whether an exception can be made.
