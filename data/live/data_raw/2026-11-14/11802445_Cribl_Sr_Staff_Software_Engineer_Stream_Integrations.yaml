description: |
  Join the company that’s building the telemetry
  infrastructure for the AI era. At Cribl, we partner with IT
  and Security teams at many of the world’s biggest
  enterprises, including half of the Fortune 100, to bridge
  the gap between AI ambition and infrastructure reality. As
  the AI Platform for Telemetry, we give customers the choice,
  control, and flexibility to manage and analyze telemetry for
  both humans and agents, so they can build what’s next.

  We’re one of the fastest‑growing private companies and a
  leading player in a massive, fast‑moving market. With a
  global workforce, we’re remote‑first and grounded in a
  simple idea: software is a people business. Cribl is the
  place where curious, collaborative people can do their best
  work, grow fast, and bring their full selves to the herd.

  Why You'll Love This Role

  Cribl’s Stream unlocks the value of all machine data in ways
  that were previously not possible by providing users a new
  level of observability, intelligence and control over their
  real-time data.  We are looking for a Sr Staff Engineer to
  help build our core data platform which ingests, enriches,
  transforms, shapes, and routes data from and to numerous
  types of third party systems.  Some may say Cribl’s greatest
  accomplishment thus far is having our software deployed in
  some of the largest organizations in the world processing up
  to petabytes of IT & Security data.  Others may attribute
  that to our massive amount of goat gifs that we’ve harvested
  from the Internet.  It’s difficult to know for sure.

  As a Sr Staff Engineer at Cribl, you will help set the
  technical direction for Stream Integrations. You would
  partner with a team of skilled engineers committed to
  shipping the highest quality software and ensuring our
  customers’ satisfaction. Additionally, you will provide
  thought leadership to the team in order to continually
  improve our technologies, tools, and processes. This role is
  equal parts research and development.  If you enjoy the
  challenges of building scalable, robust, and high performing
  distributed systems which process large data sets in real
  time, this position may be right for you.

  This is a fully remote role and Cribl is a remote first
  company.  Our culture embraces the diversity of team members
  spread all across the globe.

  As An Active Member Of Our Team, You Will ...

  - Develop features that integrate Cribl’s data stream
    processing engine with data systems such as Splunk,
    Elastic Search, Kafka, AWS S3, Azure Blob Storage, Google
    Cloud Storage.
  - Rapidly develop subject matter expertise in a diverse set of
    third party technologies by provisioning, building, and
    configuring all necessary systems and/or accounts
    necessary in facilitating the R&D process.
  - Provide technical and thought leadership to the products and
    tools that we deliver
  - Mentor and coach junior engineers on the team
  - Contribute to the technical roadmap by partnering with PM
    and Eng leaders
  - Introduce performance and efficiency improvements across our
    products and processes
  - Champion teamwork, engineering best practices, and a
    customer focused mindset
  - Take lead on feature development while balancing the
    responsibilities of high quality software development with
    those of evangelism and coaching of others on the team
  - Design, develop, test, and maintain clear, concise, and
    robust code that achieves the desired outcomes for our
    customers
  - Develop expert level knowledge of software development using
    Node.js, JavaScript/TypeScript, Docker, and Git
  - Ensure our features work as expected by creating robust test
    plans paired with comprehensive automated tests
  - Collaborate with other engineers, product managers, UX
    designers, and business teams to translate feature
    specifications into implementable code
  - Work closely with peers on your team by providing feedback
    on feature design and code reviews
  - Engage our users by contributing to internal and external
    blogs related to the products that you help develop
  - Help maintain and support our SaaS products including
    periodic participation in our 24x7 on-call rotations
  - This position will require stand-by, on-call, or off-hours
    duties

  If You Got It - We Want It

  - BS in CS/EE with 12+ years of experience or MS with 8+
    years.
  - Expert knowledge of building products that leverage large
    scale data sets
  - Excellent communication skills, both verbal and written;
    able to explain complex technical topics to both internal
    and external stakeholders with ease and in
    remote/distributed environments
  - Self driven and motivated with demonstrated ability to learn
    new technologies and develop prototypes quickly.
  - Expert knowledge of data structures, algorithms, operating
    systems, and distributed systems
  - Strong experience with performance optimization of complex
    systems
  - Expert knowledge of designing, implementing, and interfacing
    with REST APIs
  - Experience with Agile processes and rapid iterative
    development
  - Excellent ability to maintain focus on outcomes without
    getting bogged down
  - Experience using services from cloud based platforms such as
    AWS, Azure, and GCP
  - Strong sense of ownership with focus on high quality and
    high performing deliverables
  - Expert knowledge of Linux systems
  - Working knowledge of Docker and k8s
  - Experience with authorization and authentication standards
    such as Oauth2, OpenID Connect, LDAP and SAML is a plus
  - Experience with Microsoft Office 365 APIs is a plus

  #LI-EL1 #LI-Remote

  The salary for this role is dependent on geographic location
  and will be based on the individual candidate's job-related
  knowledge, skills, and experience. In addition to base
  salary, for sales and some sales-adjacent roles, employees
  are eligible to earn incentive compensation (commission).
  For all other roles, employees are eligible to participate
  in the Cribl Corporate Bonus Program. In addition to a
  competitive salary, Cribl also offers a generous benefits
  package which includes health, dental, vision, short-term
  disability, and life insurance, paid holidays and paid time
  off, a fertility treatment benefit, 401(k), and equity.

  Base Salary Range

  $230,000—$280,000 USD

  Bring Your Whole Self

  Diversity drives innovation, enables better decisions to
  support our customers, and inspires change for the better.
  We’re building a culture where differences are valued and
  welcomed, and we work together to bring out the best in each
  other. All qualified applicants will receive consideration
  for employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or any
  other applicable legally protected characteristics in the
  location in which the candidate is applying.

  Interested in joining the Cribl herd? Learn more about the
  smartest, funniest, most passionate goats you’ll ever meet
  at cribl.io/about-us.
