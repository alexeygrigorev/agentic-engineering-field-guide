description: |
  Senior Front End Engineer (Design-Focused)

  About the Role

  We're looking for a senior frontend developer who lives at
  the intersection of engineering excellence and exceptional
  design. You'll be building mobile experiences that users
  genuinely love to interact with—apps that feel alive,
  responsive, and meticulously crafted down to the last pixel
  and animation curve.

  This isn't a role for someone who just makes things work. We
  need someone who makes things feel right.

  What You'll Do

  - Own and ship major features end-to-end with minimal
    oversight
  - Build fluid, performant animations that elevate the user
    experience
  - Collaborate closely with design to translate vision into
    polished, production-ready code
  - Think holistically about how your work fits into the broader
    system—anticipating edge cases, dependencies, and
    unintended side effects before they become problems
  - Establish and evolve testing practices that give the team
    confidence to ship quickly
  - Maintain and improve a mature, complex codebase that's been
    in active development for years

  What We're Looking For

  Experience

  - 5+ years of professional frontend development experience
    (candidates with 10+ years are strongly preferred)
  - 2+ years at a creative design agency building sophisticated,
    client-facing mobile applications
  - Deep experience with large, mature codebases that have been
    under active development for 2+ years

  Technical Skills

  - Expert-level proficiency with React Native and Expo
  - Strong TypeScript skills across React Native and ReactJS
    projects
  - Strong command of React Native Reanimated for complex
    gesture-driven and physics-based animations
  - Solid ReactJS experience with animation libraries like
    Motion and GSAP
  - Comfortable working in both Expo-managed workflows and bare
    React Native when needed
  - Experience writing automated tests and building out test
    coverage incrementally

  Design Sensibility

  - An eye for design and strong opinions about interaction
    patterns, timing, and polish
  - Ability to identify when something looks "off" and the
    skills to fix it
  - Experience collaborating with designers and translating
    high-fidelity mockups into pixel-perfect implementations

  Work Style

  - Self-directed and comfortable operating with limited
    oversight
  - Ships complete, well-tested features—not prototypes that
    need cleanup
  - Systems thinker who considers how a feature interacts with
    the rest of the codebase
  - Balances big-picture architecture decisions with meticulous
    attention to detail
  - Tests their own work extensively before considering it
    "done"

  Nice to Have

  - Familiarity with backend concepts (APIs, databases,
    authentication flows)
  - Contributions to open-source projects or a portfolio of
    published apps

  What Success Looks Like

  In this role, you'll know you're succeeding when:

  - Features you ship require minimal bug fixes after release
  - Other engineers trust the patterns and code you introduce
  - Users notice the quality—even if they can't articulate why
    the app feels so good
  - You're anticipating problems before they happen, not just
    reacting to them

  About Us

  Matter is redefining healthy eating and nutrition. We
  combine a science-backed AI-powered platform with a chef-
  driven restaurant to create meals tailored to your health,
  flavor and performance needs. We’re building the future of
  personalized nutrition at scale, and we're on a mission to
  empower people to use food to help achieve their metabolic
  health goals.

  We are 100% Gluten and Seed-Oil free. We never use ultra-
  processed ingredients and actively minimize our exposure to
  microplastics. We serve sustainably raised proteins, such as
  100% Grass-Fed Grass-Finished Beef, Wild-Caught Seafood and
  Antibiotic-Free Chicken. We prioritize healthy fats such as
  Single-Origin EVOO. Our menu also features organic produce
  and a wide variety of supplemental add-ins like protein,
  creatine, collagen and adaptogens.
