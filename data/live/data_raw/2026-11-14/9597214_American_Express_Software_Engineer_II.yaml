description: |
  The American Express payment network processes and
  authorizes millions of card transactions daily, this network
  is the critical backbone for all American Express payment
  transactions and is built upon real time, low latency &
  highly available components. These customer facing
  capabilities integrate with the payment network to power the
  American Express brand to enable key spending channels like
  mobile payments and e-commerce. We design, develop & deliver
  secure services for both the core payment platforms &
  customer facing services.

  Responsibilities

  As a Software Engineer, you’ll help to build world class
  software through consistent development practices (tools,
  common components, and documentation). You’ll contribute to
  the design, development, troubleshooting, debugging,
  evaluation, modification, deployment, and documentation of
  software and systems that meet the needs of customer-facing
  applications, business applications, and/or internal end
  user applications.

  Qualifications

  Minimum:

  - Building software to expected quality and standards using
    distributed enterprise frameworks.
  - Participating in code, test & other quality reviews
  - Debugging basic software components and identify code
    defects for remediation.
  - Enabling the deployment, support, and monitoring of software
    across test, integration, and production environments
  - Automating deployments in test and production environments
  - Scaling applications based on demand projections



  Preferred:

  - Proven years of software development experience in a
    professional environment and/or comparable experience with
    the following:
  - Hands on Java application design, software development and
    automated testing (Java 11 and higher)
  - Intermediate knowledge of basic infrastructure technologies
    and components
  - Familiarity with application containers based on spring,
    Vert.X or equivalent
  - Familiarity with Cloud services including DevOps concepts
    and CI/CD tools
  - Experience with Event-driven/Micro-services architecture for
    high-availability/distributed systems
  - Experience using Spring Framework, Junit, GitHub,
    Microservices, Splunk and API’s
  - Experience with Test driven development and unit testing
    frameworks
  - Proficient understanding of code versioning tools (Git) and
    build toolings Maven or Gradle

  Employment eligibility to work with American Express in the
  UK is required as the company will not pursue visa
  sponsorship for these positions.

  About Us

  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. From delivering
  differentiated products to providing world-class customer
  service, we operate with a strong risk mindset, ensuring we
  continue to uphold our brand promise of trust, security, and
  service.

  As part of Team Amex, you’ll experience our powerful backing
  with comprehensive support for your holistic well-being and
  many opportunities to learn new skills, develop as a leader,
  and grow your career. Here, your voice and ideas matter,
  your work makes an impact, and together, you will help us
  define the future of American Express.

  About the Team

  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:

  - Competitive base salaries
  - Bonus incentives
  - Support for financial-well-being and retirement
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits (depending on location)
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - Generous paid parental leave policies (depending on your
    location)
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities



  Offer of employment with American Express is conditioned
  upon the successful completion of a background verification
  check, subject to applicable laws and regulations.
