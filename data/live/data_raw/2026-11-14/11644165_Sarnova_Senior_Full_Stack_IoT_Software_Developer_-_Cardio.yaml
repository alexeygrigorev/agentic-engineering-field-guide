description: |
  We are seeking a talented and passionate Full Stack IoT
  Software Developer to join our team. In this role, you will
  play a key part in developing firmware, backend systems, and
  essential tooling for cutting-edge cellular IoT products.
  You will have the opportunity to work hands-on with devices
  throughout the entire development cycle, including debugging
  and testing. While focused on software development, there is
  opportunity to expand into electronics design, mechanical
  design, and manufacturing disciplines.



  Cardio Partners, a division of Sarnova, is a national leader
  in emergency prevention and an ardent advocate in the fight
  against Sudden Cardiac Arrest (SCA). Cardio Partners offers
  complete cardiac solutions to our customers including
  equipment, consultation, end-to-end training, and program
  management. As an authorized master distributer of all FDA-
  approved defibrillator devices, the company provides
  customers the best-in-class value for new and recertified
  equipment. Customers’ emergency preparedness needs are met
  via Cardio Partners’ nationwide CPR training courses and
  state-of-the-art program management services.



  For Non-Central Ohio based candidates this is a remote
  opportunity. Candidates must reside in the United States and
  be willing to work EST hours.  Candidates who require visa
  sponsorship/transfer now or in the future cannot be
  considered.



  Summary:



  We are seeking a talented and passionate Full Stack IoT
  Software Developer to join our team. In this role, you will
  play a key part in developing firmware, backend systems, and
  essential tooling for cutting-edge cellular IoT products.
  You will have the opportunity to work hands-on with devices
  throughout the entire development cycle, including debugging
  and testing. While focused on software development, there is
  opportunity to expand into electronics design, mechanical
  design, and manufacturing disciplines.



  Organizational Impact:



  This role is instrumental in advancing Sarnova’s technology
  capabilities in the IoT space. By driving the development of
  intelligent, connected devices, the Senior Full Stack IoT
  Developer directly supports strategic initiatives in product
  innovation, operational efficiency, and customer experience.
  The solutions built in this role will enhance Sarnova’s
  ability to deliver data-driven healthcare technologies and
  maintain a competitive edge in the market.



  Essential Duties and Responsibilities:

  - Design, implement, and maintain firmware, backend, and
    tooling solutions for cellular IoT devices
  - Develop and optimize embedded software using C for STM32
    microcontrollers, ensuring performance and reliability
  - Integrate and manage embedded AI models to enhance device
    capabilities
  - Collaborate closely with hardware, electronics, and
    manufacturing teams to bring innovative products to life
  - Work directly with physical devices for hands-on
    development, troubleshooting, and validation
  - Ensure efficient cellular communication and low power
    operations within device ecosystems
  - Contribute to backend and tooling development using Python
    and Ruby on Rails
  - Stay current with emerging IoT technologies and recommend
    innovations that align with business goals
  - Additional job duties as assigned

  Skills/Experience Required:

  - Education: Bachelor’s degree in Computer Science, Electrical
    Engineering, or related field
  - Minimum 7+ years of professional experience in software
    development, with a strong focus on embedded systems and
    full stack development
  - Proven expertise in C programming for microcontrollers
    (preferably STM32), and experience with cellular
    communication protocols
  - Proficiency in backend development using Python and Ruby on
    Rails
  - Experience integrating AI models into embedded systems is
    highly desirable
  - Strong understanding of hardware/software integration and
    low-power design principles
  - Demonstrated ability to work independently and lead complex
    development initiatives
  - Excellent problem-solving skills and a proactive approach to
    innovation
  - Strong communication and collaboration skills across
    technical and non-technical teams
  - Ability to independently manage all aspects of the job role
    including required goals and business practices in a
    remote environment

  Sarnova is an Equal Opportunity Employer. We offer a
  competitive salary, commensurate with experience, along with
  a comprehensive benefits package, including 401(k) Plan.
  EEO/M/F/Veterans/Disabled.  Our mission is to be the best
  partner for those who save and improve patients’ lives.
  Excellence in delivering upon our mission is dependent upon
  having a diverse team that is empowered to bring their full,
  authentic self to work each day.  We strive to create a
  workplace that reflects the communities we serve, and we are
  passionate about creating an inclusive workplace that
  promotes and values diversity.



