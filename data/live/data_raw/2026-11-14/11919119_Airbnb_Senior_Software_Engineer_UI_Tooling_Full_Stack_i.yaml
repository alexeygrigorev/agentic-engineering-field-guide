description: |
  Airbnb was born in 2007 when two hosts welcomed three guests
  to their San Francisco home, and has since grown to over 5
  million hosts who have welcomed over 2 billion guest
  arrivals in almost every country across the globe. Every
  day, hosts offer unique stays and experiences that make it
  possible for guests to connect with communities in a more
  authentic way.

  The Community You Will Join:

  The UI Foundation team has a deep history at Airbnb,
  responsible for the design system, accessibility, motion,
  and the tooling that connects how Airbnb designs and builds
  products. Within UI Foundation, the UI Tooling team is the
  connective tissue between Airbnb's Design Language System
  and the day-to-day workflows of hundreds of designers,
  engineers, and product managers across the company.

  UI Tooling owns the platforms, integrations, and tooling
  that power how designers, engineers, and product managers
  work - spanning design tooling, UI engineering workflow
  tooling, collaboration platforms, and increasingly, AI-
  powered workflows across all three. As AI enablement for
  designers and engineers accelerates, this team sits at the
  center of some of Airbnb's most strategic infrastructure
  investments.

  The Difference You Will Make:

  As a Senior Software Engineer on the UI Tooling team, you
  will help drive the technical direction of AirChatUI, our AI
  Prototyping harness and native MacOS app. You will drive
  implementation and scaling of a system that generates
  thousands of internal product feature prototypes, internal
  tools, and data visualizations.

  You will own the strategy and execution across 4 key areas:

  - Web Prototyping experience - AirChatUI features and user
    experience
  - iOS Prototyping experience - Native iOS prototyping
    capabilities, and iOS prototype app deployments.
  - AI Integration - Development of skills and agents to assist
    in product feature prototyping as well as support for
    AirChat CLI and AirChat Remote, Airbnb’s coding harness
    and remote agent execution environment.
  - Integration into Kyber, our web-based prototyping and rapid
    deployment platform.

  A Typical Day:

  - Setting technical direction for the AirChatUI, making
    architectural decisions for the systems that enable rapid
    development of product feature prototypes, internal tools,
    and data visualizations.
  - Design and build macOS and iOS features using modern,
    declarative UI and unidirectional state architecture.
  - Contribute to web-based prototyping functionality in Kyber
    to support AirChatUI features.
  - Write and review code hands-on and with AI coding agents,
    demonstrating standards for quality, availability and
    system health across the platform.
  - Partner with Infrastructure, Product, Security, and Design
    to translate cross-organizational objectives into platform
    capabilities.
  - Advance the capabilities for Product Managers, Designers,
    and other non-technical builders to build rich product
    feature prototypes that translate to features in our
    production applications.
  - Learn from and collaborate with other senior engineers on
    the team, and contribute to shared iOS patterns and best
    practices as the team scales.

  Your Expertise:

  - 5-9+ years of industry experience, ideally within fast-paced
    environments, with a track record of shipping features in
    large-scale consumer applications.
  - Full-stack engineering capability, with the confidence
    working across backend, frontend, mobile, APIs and system
    architecture as technical challenges require.
  - Proficiency in Swift and modern iOS architecture, including
    declarative UI (e.g., SwiftUI), unidirectional state
    management (MVI/MVVM/Redux-style), and dependency
    injection
  - Proven experience building customer-facing products from
    zero to one, contributing to product definition, technical
    architecture, development and launch.
  - Solid understanding of mobile app performance,
    accessibility, and release/CI practices for large-scale
    consumer apps.
  - A product-first engineering mindset, with an understanding
    that technical decisions are in service of the products we
    provide to our customers.
  - Strong communication and collaboration skills, with
    experience driving initiatives that span across teams,
    departments and leadership.
  - Bonus: Experience with modern web development tooling
    including Typescript, React, etc.

  Your Location:

  This position is US - Remote Eligible. The role may include
  occasional work at an Airbnb office or attendance at
  offsites, as agreed to with your manager. While the position
  is Remote Eligible, you must live in a state where Airbnb,
  Inc. has a registered entity. Click here for the up-to-date
  list of excluded states. This list is continuously evolving,
  so please check back with us if the state you live in is on
  the exclusion list. If your position is employed by another
  Airbnb entity, your recruiter will inform you what states
  you are eligible to work from.

  Our Commitment To Inclusion & Belonging:

  Airbnb is committed to working with the broadest talent pool
  possible. We believe diverse ideas foster innovation and
  engagement, and allow us to attract creatively-led people,
  and to develop the best products, services and solutions.
  All qualified individuals are encouraged to apply.

  We strive to also provide a disability inclusive application
  and interview process. If you are a candidate with a
  disability and require reasonable accommodation in order to
  submit an application, please contact us at:
  reasonableaccommodations@airbnb.com. Please include your
  full name, the role you’re applying for and the
  accommodation necessary to assist you with the recruiting
  process.

  We ask that you only reach out to us if you are a candidate
  whose disability prevents you from being able to complete
  our online application.

  Equal Employment Opportunity:

  Airbnb values diversity & belonging and is proud to be an
  Equal Employment Opportunity employer. All individuals
  seeking employment at Airbnb are considered without regard
  to race, color, religion, national origin, age, gender, sex,
  marital status, ancestry, physical or mental disability,
