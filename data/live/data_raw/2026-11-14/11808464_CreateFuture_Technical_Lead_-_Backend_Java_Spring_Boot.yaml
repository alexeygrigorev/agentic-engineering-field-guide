description: |
  Who we are

  CreateFuture is fast becoming the UK’s most recognisable
  digital consultancy, with years of experience building
  digital products and services for major organisations whilst
  putting our people first. We have offices in the centre of
  Edinburgh, Leeds, Manchester, and London as well as remote
  employees located throughout the country.

  We are a team of creators - whether that’s code, project
  plans, go to market strategies, culture initiatives,
  marketing campaigns, large language models or people
  policies. And together, with our clients, we create the
  future. This has seen us collaborate and partner across a
  multitude of industries and sectors, with the likes of
  PayPal, Adidas, NatWest, FanDuel and Money Saving Expert to
  name just a few.

  Our reputation as a partner determined to deliver high-
  quality, robust and thoughtful products has enabled us to
  scale to over 500 people in the last couple of years, and it
  is our amazing people - along with the safe, supportive and
  friendly culture we have built - that makes CreateFuture a
  great place to work. Don’t just take our word for it though,
  we have been recognised by Best Workplaces UK multiple years
  in a row - across a number of categories - and our employee
  exit rate is astonishingly low.

  Join us on our journey… Let’s create something awesome,
  together, today.

  About the role and team:

  This is a senior, hands-on technical leadership role. You
  will be embedded in a team delivering for a client in a
  fast-paced, product-led environment, and you will be
  accountable for how your workstream is delivered, not just
  the code you write. You lead from the front: still close
  enough to the technology to make the call, and senior enough
  to own the outcome. You set the technical direction, keep
  the delivery signal honest, and grow the engineers around
  you. We work at pace. Priorities move, requirements are
  rarely perfect on day one, and we value people who can bring
  order to ambiguity rather than wait for it to clear.

  How we work with AI:

  AI-assisted development is core to how we build, not a side
  experiment. We use modern AI coding agents to remove the
  drudgery so engineers can focus on the high-value decisions:
  architecture, trade-offs, and getting the right thing built.
  Humans own every change, and quality is held by review and
  ownership, not by the tool. As a Tech Lead you will help
  raise the quality and consistency of how the team uses AI:
  knowing the domain and the codebase well enough to steer the
  tools, avoid reinventing what already exists, and articulate
  intent clearly so the AI accelerates good engineering rather
  than multiplying mediocre code.  Our tech stack Core: Java
  (with Spring Boot) A roughly even split of RESTful Java APIs
  and Kafka / event-driven services CI/CD pipelines AWS
  (including S3, Lambda, ECS, EKS, MSK) Broader ecosystem you
  will get your hands on: Kubernetes and containerisation
  Infrastructure as code AI integrations and agentic
  development workflows Strong security practices across the
  stack Full DevOps ownership ("you build it, you run it")

  You will not need all of this from day one, but these are
  the tools, systems and practices you will work with.

  What you'll be doing:

  Technical: Building Java services across REST APIs and Kafka
  / event-driven pipelines (roughly an even split), with a
  focus on readable, maintainable and well-tested code Writing
  tests as part of development (TDD approaches are encouraged)
  Integrating with third-party APIs (for example payment
  gateways and suppliers) Defining and overseeing technical
  implementations: shaping how things are built, not just
  writing code Championing AI-assisted ways of working and
  lifting the bar on quality, consistency and reuse across the
  team  Leading the workstream: Owning your workstream end to
  end: you can always answer what you own and who covers it
  when you are out, whether you are on track for the next
  milestone, what is blocked or at risk, and what decision is
  needed and who needs to know Driving the dates: actively
  managing delivery rather than passively reporting it, and
  spotting risk early enough to act before dates slip Getting
  ahead of the next thing: shaping and estimating upcoming
  work with product and delivery before it hits the team, so
  the team drives the work rather than inheriting it
  Communicating before you are chased, and working in the open
  (visible progress in shared channels, feedback captured
  where it belongs) Identifying and removing bottlenecks in
  delivery Handling difficult client conversations
  professionally when needed, with support from your
  colleagues Spotting knowledge gaps and offering mentoring,
  pairing and coaching to grow the engineers around you



  We'd love to talk to you if:

  - You have strong Java and Spring Boot, across both REST APIs
    and event-driven / Kafka systems
  - You care about engineering quality: code reviews, automated
    tests, and maintainability
  - You lead in the open, share knowledge, and actively raise
    the bar for the team
  - You are comfortable driving delivery and, with support,
    handling client conversations
  - You embrace AI-assisted development: using modern AI tools
    to go faster while owning the quality and knowing when to
    trust them and when not to
  - You thrive in a fast-paced environment and can bring
    structure to ambiguity
  - You are familiar with cloud services and CI/CD, or excited
    to learn more
  - You want to build more than boilerplate APIs: solving real
    problems, with proper ownership

  What we'll offer you:

  At CreateFuture, we challenge ourselves to go beyond the
  obvious and we care deeply about our craft and customers.
  With us, you’ll have ambitious projects to sink your teeth
  into and plenty of opportunities to learn and grow. You’ll
  be part of our safe, supportive and friendly culture - that
  looks after you - and join our team of genuinely great
  people.

  Our benefits include:

  - Total 35 days holiday (we have flexible bank holidays)
  - Comprehensive private medical insurance
  - Enhanced parental and adoption leave
  - Pension - matched up to 5%

  View our complete list of benefits here.

  As this is a hybrid role, we’re looking for people within a
  commuting distance of our Edinburgh office and who are
  flexible to travel to client sites and CreateFuture UK
  regional offices. We are very flexible and trust you to
  manage your own schedule to balance face-to-face time with
  clients, colleagues and working from home.

  We create and reinforce a culture that rewards employees’
  impact, not just activity. We trust our employees to work
  autonomously and promote ownership across all levels.

  Next steps:

  Our Talent team aims to respond to all applications within a
  reasonable timeframe, regardless of whether or not we
  progress your application.

  Our interview process:

  - 30-minute call with one of our Talent Acquisition Team.
  - 90-minute Technical Consultancy Interview.
  - 60-minute People Leadership & Values interview.

  Our interview process is designed as an opportunity both for
  our interviewers to learn about your expertise, interests
  and motivations and for you to gain insights into the role,
  team and business as a whole, so throughout the process,
  you’ll meet a few people from our team as well as others
  from across the business to help you get a well-rounded view
  of the role and life at CreateFuture. We believe that
  representative teams made up of people with different
  backgrounds, skills, and points of view help us build the
  best workplace possible, and enable us to create genuinely
  innovative, broadly useful products.

  What we’ll offer you:

  We trust people to do their best work. That means
  flexibility over rigid rules, impact over activity, and real
  investment in your growth both professionally and
  personally. You’ll be part of a supportive, and friendly
  culture, surrounded by smart, curious people who care deeply
  about what they do. We offer flexible working, including
  hybrid and remote options. Our office hubs are located in
  Edinburgh, Leeds, Manchester, London and Bulgaria, with
  occasional travel to client sites or CreateFuture offices
  when needed.

  We trust you to manage your time balancing collaboration
  with client time and focused work. What matters is the
  impact you have, not how busy you look.

  Our hiring process

  We try to keep our hiring process clear, fair and respectful
  of your time. We aim to get back to everyone who applies and
  we will be upfront about where you are in the process.

  It usually looks like this:

  - Call with our Talent Acquisition Team
  - Role specific capability interview

  Depending on the role, we might also ask you to do a short
  presentation, a practical or technical task or have a values
  focused conversation. We will explain what is involved
  before anything happens.

  Inclusion at CreateFuture

  We believe diverse teams build better workplaces and better
  products. We want CreateFuture to be a place where people
  feel able to be themselves and do their best work.

  If you need any adjustments or support during the
  application process, just. We will do what we can to help.

  We look forward to your application!
