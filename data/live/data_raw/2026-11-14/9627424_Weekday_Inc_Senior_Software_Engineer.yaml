description: |
  This role is for one of the Weekday's clients

  Min Experience: 6 years

  Location: London

  JobType: full-time

  We are seeking a highly skilled and experienced Senior
  Software Engineer with deep expertise in Python to join our
  growing engineering team. In this role, you will be
  responsible for designing, developing, and maintaining
  scalable, high-performance applications while playing a key
  role in shaping technical architecture and mentoring junior
  engineers.

  RequirementsKey Responsibilities

  - Design, develop, and maintain robust, scalable backend
    systems and APIs using Python.
  - Lead end-to-end development of complex software solutions,
    from concept to deployment.
  - Write clean, efficient, and reusable code following best
    practices and coding standards.
  - Collaborate with cross-functional teams including product
    managers, designers, and DevOps to deliver high-quality
    features.
  - Optimize application performance, reliability, and
    scalability.
  - Participate in architectural discussions and contribute to
    technical decision-making.
  - Conduct code reviews and ensure adherence to quality
    standards.
  - Troubleshoot, debug, and resolve production issues in a
    timely manner.
  - Mentor junior developers and contribute to building a strong
    engineering culture.

  Required Skills & Qualifications

  - 6–11 years of professional software development experience
    with strong expertise in Python.
  - Solid understanding of Python frameworks such as Django,
    Flask, or FastAPI.
  - Experience in building RESTful APIs and microservices
    architecture.
  - Strong knowledge of data structures, algorithms, and object-
    oriented programming.
  - Hands-on experience with databases such as PostgreSQL,
    MySQL, or MongoDB.
  - Familiarity with asynchronous programming and performance
    optimization techniques.
  - Experience with cloud platforms (AWS, GCP, or Azure) and
    containerization tools like Docker.
  - Knowledge of CI/CD pipelines and version control systems
    such as Git.
  - Strong problem-solving skills and the ability to work in a
    fast-paced environment.

  Preferred Qualifications

  - Experience working with distributed systems and event-driven
    architectures.
  - Exposure to data processing frameworks or background job
    systems (Celery, Kafka, etc.).
  - Familiarity with testing frameworks and test-driven
    development (TDD).
  - Understanding of security best practices in application
    development.
  - Prior experience in leading small teams or projects is a
    plus.

  Soft Skills

  - Excellent communication and collaboration skills.
  - Strong ownership mindset with attention to detail.
  - Ability to work independently and manage multiple
    priorities.
  - Passion for learning new technologies and continuous
    improvement.
