description: |
  Scribd, Inc. is on a mission to advance human understanding.
  Our four products — Scribd®, Slideshare®, Everand™, and
  Fable — help billions of people across the globe move beyond
  access and into insight, application, and expertise.

  Culture at Scribd, Inc.

  We support a culture where our employees can be real and be
  bold; where we debate and commit as we embrace plot twists;
  and where every employee is empowered to take action as we
  prioritize the customer.

  We believe the best work happens when individual flexibility
  is balanced with meaningful community connection. Scribd
  Flex empowers employees to choose the workstyle and location
  that support their best performance, while committing to
  intentional in-person moments that strengthen collaboration
  and culture. Occasional in-person attendance is required for
  all Scribd, Inc. employees, regardless of location.

  So what are we looking for in new team members? At Scribd,
  Inc., we hire for “GRIT.” Traditionally defined as the
  intersection of passion and perseverance toward long-term
  goals, GRIT reflects the mindset we expect from every
  employee. For us, it also serves as a practical framework
  for how we work: setting and achieving Goals, delivering
  Results within your role, contributing Innovative ideas and
  solutions, and strengthening the broader Team through
  collaboration and attitude.

  This posting reflects an approved, open position within the
  organization.

  About Our Team

  The Growth Platform team is the infrastructure squad for
  Growth at Scribd. We build the shared services and tooling
  that the other Growth teams build on, and we empower
  marketers, lifecycle teams, and partner channels by
  delivering MarTech solutions that drive efficiency, data-
  informed decisions, and scalable user acquisition across our
  brands: Scribd, Everand, Slideshare, and Fable.

  Our work spans self-service tooling, experimentation
  infrastructure, acquisition tracking and attribution, and
  integrations that share customer and event data with third-
  party platforms. Because we're a platform team, a lot of
  what we build ships through other teams' products, so we
  care about reliability and scalability, and about making our
  systems easy for others to build on. The team values
  collaboration, pragmatic problem-solving, and a culture of
  technical excellence.

  About the Role

  We are seeking a determined Fullstack Software Engineer to
  join our Growth Platform team. In this role, you will
  design, build, and scale the shared systems that power
  Growth at Scribd, from self-service tooling and
  experimentation infrastructure to the data integrations
  behind our lifecycle marketing.

  You will partner closely with marketers, data analysts,
  lifecycle teams, and the other Growth engineering teams to
  deliver high-quality solutions that enhance cross-channel
  marketing effectiveness, attribution accuracy, and customer
  engagement. You’ll participate in technical design, code
  reviews, and best practice implementation while identifying
  opportunities to improve systems and processes.

  Key areas of responsibility include:

  - Building intuitive, performant self-service tools that let
    marketers and other teams move without engineering help.
  - Building and maintaining integrations that share customer
    and event data with third-party platforms, including our
    lifecycle marketing tools.
  - Ensuring scalability, testability, and maintainability
    throughout the development process.
  - Collaborating across teams to drive impactful projects
    forward.
  - Staying proactive by proposing innovative solutions to
    technical challenges.

  What We’re Looking For

  - A passionate engineer who takes pride in writing clean,
    maintainable, and scalable code.
  - Someone who thrives in both backend system design and
    frontend feature development.
  - A strong communicator and collaborator who enjoys working
    with marketers, data scientists, product managers, and
    engineers across the Growth Pillar to develop high-
    leverage, self-service tools and data activation
    workflows.
  - An engineer who stays current with industry trends and
    technologies.
  - A pragmatic problem-solver who balances technical rigor with
    business needs.

  Required Qualifications

  - 3+ years of professional software development experience.
  - Proficiency with TypeScript, JavaScript, and modern
    frameworks like React.
  - Familiarity with Ruby on Rails and its ecosystem.
  - Understanding of database systems (SQL and NoSQL) and
    architectural tradeoffs.
  - Experience designing and consuming APIs (REST, GraphQL a
    plus).
  - Understanding of experimentation, A/B testing,
    personalization systems, and the MarTech landscape.
  - Communicates clearly and frequently with cross-functional
    partners, influencing through technical depth and
    collaborative decision-making.
  - Strong problem-solving skills and attention to detail.

  Nice to Have

  - Experience with instrumenting and working on data
    integration projects, such as event tracking, data
    pipelines, or syncing user data between internal systems
    and third-party platforms.
  - Have worked in a Growth Engineering or Growth Platform team
    at a product-led company.
  - Experience with backend technologies like Redis, Kafka,
    MySQL, and Terraform.
  - Knowledge of GraphQL and Next.js.
  - Familiarity with migrating monolithic architectures to
    microservices/frontends.

  At Scribd, Inc., your base pay is one part of your total
  compensation package and is determined within a range. Our
  pay ranges are based on the local cost of labor benchmarks
  for each specific role, level, and geographic location. San
  Francisco is our highest geographic market in the United
  States.



  In the state of California, the reasonably expected salary
  range is between $132,500 [minimum salary in our lowest
  geographic market within California] to $184,000 [maximum
  salary in our highest geographic market within California].



  In the United States, outside of California, the reasonably
  expected salary range is between $103,000 [minimum salary in
  our lowest US geographic market outside of California] to
  $175,000 [maximum salary in our highest US geographic market
  outside of California].



  In Canada, the reasonably expected salary range is between
  $132,000 CAD[minimum salary in our lowest geographic market]
  to $165,000 CAD[maximum salary in our highest geographic
  market].



  We carefully consider a wide range of factors when
  determining compensation, including but not limited to
  experience; job-related skill sets; relevant education or
  training; and other business and organizational needs. The
  salary range listed is for the level at which this job has
  been scoped. In the event that you are considered for a
  different level, a higher or lower pay range would apply.
  This position is also eligible for a competitive equity
  ownership, and a comprehensive and generous benefits
  package.

  Working at Scribd, Inc.

  Are you currently based in a location where Scribd, Inc. can
  employ you?  Employees must have their primary residence in
  or near one of the following cities. This includes
  surrounding metro areas or locations within a typical
  commuting distance:

  United States:

  Atlanta | Austin | Boston | Dallas | Denver | Chicago |
  Houston | Jacksonville | Los Angeles | Miami | New York City
  | Phoenix | Portland | Sacramento | Salt Lake City | San
  Diego | San Francisco | Seattle | Washington D.C.

  Canada:

  Ottawa | Toronto | Vancouver

  Mexico:

  Mexico City

