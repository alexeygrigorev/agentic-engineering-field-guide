description: |
  Who we are:

  Tria Federal delivers digital services and technology
  solutions that support the health and safety of veterans,
  service members and civilians. For two decades, federal
  agencies have relied on Tria companies to advance their
  critical missions and modernize their systems, so that they
  can uphold their commitment to the American people. Today,
  we are pushing the boundaries of possibility through
  partnerships and investments in artificial intelligence and
  emerging technologies, developing solutions for the biggest
  challenges that government will face tomorrow.

  We are proud to employ and support military veterans who
  bring mission-first mindset, technical expertise, and
  leadership qualities that strengthen our work. Veterans,
  transitioning service members, and military spouses are
  strongly encouraged to apply.

  Job Description:

  We are looking for a Senior Full Stack Developer with strong
  experience with modern web application development using
  React and React ecosystem, Kubernetes and AWS, who will be
  part of a collaborative and agile team that supports and
  delivers enterprise solutions.

  Basic Requirements:

  - Ability to successfully obtain a U.S. Federal Position of
    Trust (Entry on Duty) clearance designation.
  - Must reside in and be able to perform work in the United
    States.
  - Must possess a bachelor’s degree.
  - 8+ years of progressive experience as developer building UI
    for large-scale enterprise applications.
  - 5+ years of experience with front-end technologies like
    React, HTML5, Typescript, JavaScript, Bootstrap, CSS to
    bring concepts to life.
  - Three (3) or more years of experience building modular API-
    based microservices using Java (8, 21, or later), Spring
    Framework, and Spring Boot.
  - Experience developing modular, test first, mobile first,
    reusable components and web apps with React.
  - Experience developing modern front-end applications
    including migration of legacy web applications developed
    using Angular to React.
  - Experience applying object-oriented design (OOD) principles
    and developing clean, well-architected, secure, scalable,
    and maintainable code.
  - At least four (4) years working as a developer on all phases
    of the Agile software development lifecycle.
  - Demonstrated experience working, collaborating and
    communicating with software development teams,
    stakeholders, and vendors.
  - Excellent written and verbal communication skills, including
    the ability to effectively convey complex technical
    concepts through presentations, technical documentation,
    architecture diagrams, UML models, and direct stakeholder
    engagement.
  - Two (2) or more years of experience supporting Federal IT
    projects; other government contract project experience
    will be considered.

  Additional Qualifications (Preferred):

  - Experience with cloud-native application development and
    deployment, preferably on AWS, including services such as
    EC2, EKS/ECS, RDS, S3, Lambda, Secrets Manager, and
    CloudWatch.
  - Experience with source control and DevSecOps tooling,
    including Git/GitHub, GitHub Actions, Harness, Jenkins,
    ArgoCD, SonarQube, Checkmarx, Twistlock, and CI/CD
    pipeline implementation.
  - Experience using modern build and dependency management
    tools, including Gradle, npm, webpack, gulp, grunt, or
    similar technologies.
  - Experience with containerization and orchestration
    technologies, including Docker and Kubernetes, in
    production environments.
  - Experience with observability and monitoring platforms such
    as Splunk and New Relic.
  - Experience designing and operating event-driven and message-
    based architectures using technologies such as Apache
    ActiveMQ and Apache Kafka.
  - Experience working with data technologies, including SQL or
    similar query languages, relational databases (PostgreSQL,
    MySQL, AWS Aurora, or similar), and data formats such as
    XML and JSON.
  - Understanding of software testing methodologies, including
    functional, SOA, integration, and performance testing.
  - Experience designing, developing, and consuming web
    services, APIs, using REST, SOAP, and related
    technologies.
  - Experience building modular API-based microservices using
    Java (8, 21, or later), Spring Framework, and Spring Boot.
  - Experience implementing modern technology stacks including
    Java, AWS, Docker, Node.js, React, Python, PostgreSQL (or
    other enterprise RDBMS platforms such as Oracle or SQL
    Server), Kafka, and related technologies.
  - Experience working with NoSQL data stores such as MongoDB,
    DocumentDB, DynamoDB, or similar platforms.
  - Expertise in translating business and user needs into
    technical solutions, requirements documentation, product
    roadmaps, implementation plans, and delivery timelines
    using tools such as Jira and Confluence.
  - Experience working with Agile delivery teams and applying
    Agile methodologies, such as Scrum, to support iterative
    software development and successful project execution.
  - Demonstrated ability to support design and documentation of
    large-scale enterprise systems.
  - Experience working on digital transformation initiatives
    involving cloud modernization, process automation, system
    modernization, and adoption of emerging technologies.
  - Hands-on experience with software quality engineering
    practices, including unit, integration, and performance
    testing, as well as automated testing frameworks such as
    Chai, Jest, Jasmine, Karma, Cypress, or similar tools.
  - Experience with cloud-native technologies, including AWS
    certifications, Infrastructure as Code frameworks
    (Terraform, AWS CloudFormation, AWS CDK, Pulumi, or
    similar), containerized platforms, and advanced AWS
    services such as EMR and SageMaker.
  - Familiarity with multi-cloud environments, including AWS,
    Azure, and Google Cloud Platform (GCP).
  - In-depth knowledge of USCIS systems, processes,
    applications, databases, and electronic submission
    protocols is highly desirable.

  Responsibilities:

  - Work as a Full-Stack React developer with a team of 5–9
    full-stack developers, fostering a culture of continuous
    learning, collaboration, accountability, and professional
    growth.
  - Analyze complex business and technical challenges, evaluate
    impacts across interconnected systems, and develop
    scalable, user-centered solutions that align with
    enterprise objectives.
  - Define, communicate, and champion solution visions,
    architectures, technical roadmaps, and implementation
    strategies in collaboration with solution architects,
    product managers, and stakeholders.
  - Design and document modern application architectures,
    including web applications, microservices, APIs, data
    platforms, and cloud-native solutions using scalable,
    open-source technologies and design tools such as
    Lucidchart, Mural, or similar platforms.
  - Communicate complex technical concepts, architectural
    decisions, and solution approaches effectively to
    technical and non-technical stakeholders with diverse
    backgrounds and skill sets.
  - Perform end-to-end business process analysis to identify
    gaps, modernization opportunities, and improvements that
    enhance system performance and user experience.
  - Identify root cause analysis efforts by leveraging
    monitoring and observability tools, critical thinking, and
    cross-functional collaboration to resolve production and
    operational issues.
  - Collaborate across teams to design, develop, review, and
    deliver product features, proof-of-concepts, frameworks,
    and reusable solutions using iterative and incremental
    delivery approaches.
  - Champion modern software engineering practices, including
    code quality, architecture standards, technical
    excellence, and Agile delivery methodologies.
  - Represent engineering teams in client engagements, technical
    demonstrations, design reviews, and stakeholder
    presentations.

  Public Trust Clearance:

  Many of our roles require the hired candidate to go through
  public trust clearance.

  Work Location:

  Headquartered in Arlington, VA, we also have a primary
  office in Baltimore, MD for those who prefer to work on-
  site. However, with employees spread across 40+ states, we
  have many remote roles

  with employees spread across 40+ states, we have many remote
  roles.

  Why Tria? What defines the Tria brand is more than just our
  dedication to excellence in our craft; it’s our incredible
  team of dedicated, talented, and passionate people that make
  Tria so exceptional. As people powering possible, we are all
  partners in our team’s shared success.

  As a company that cares about people, we seek to cultivate a
  culture in which all can thrive personally and
  professionally. We offer a top-tier benefits package to
  invest in your physical, mental, and financial health and
  wellness so that you can be your best self - at work and in
  life. At Tria, we are growth-minded, entrepreneurial in
  spirit, and committed to fostering a culture of inclusion
  and opportunity for all. Whatever your background, your
  role, your department, or stage in your professional
  journey, here you will have opportunities to learn new
  skills, seize new challenges, and advance your career as we
  grow.

