description: |
  About us

  GoCardless, a Mollie company, is a global leader in bank
  payments. Over 100,000 businesses, from start-ups to
  household names, use GoCardless to collect, manage and send
  bank payments through Direct Debit, real-time payments and
  open banking. With US$130bn+ processed annually across 30+
  countries, we handle recurring and one-off payments without
  the chasing, stress, or expensive fees. Our end-to-end
  payment platform also features AI-powered solutions to
  improve payment success and reduce fraud, alongside
  connections to over 350 platforms businesses use everyday.
  We are headquartered in the UK, with teams and operations
  spanning North America, Europe and Asia-Pacific.  For more
  information, please visit www.gocardless.com and follow us
  on LinkedIn @GoCardless. Mollie is the leading payments and
  financial services partner for business, rooted in Europe,
  with global reach.

  The role

  Payment Success helps merchants get paid and keep their cash
  flow reliable. We predict which payments are likely to fail,
  recover the money when they do, and protect merchant cash
  flow across our payment rails.

  As Engineering Manager, you will lead a cross-functional
  team of engineers, a designer and data scientists, building
  intelligent products that use machine learning and AI.

  You will take ownership of the payment intelligence products
  we have already built, and work with your team and product
  manager to decide what we build next. We give teams problems
  to solve rather than tasks to complete, so you and your team
  will own what gets built, how it gets built and how success
  is measured.

  You will be accountable for the quality, delivery and
  operation of everything the team ships, and you will look
  after your people through 1:1s, feedback and career
  development. You'll step in wherever the team needs you, and
  earn credibility with senior engineers and data scientists
  within the team and across product development.

  What excites you

  - Shipping stuff: you’ll work with your team to support
    changes to completion, delivering consistent positive
    impact across your product area. Being comfortable
    delivering a range of projects: from MVP experiments
    testing a hypothesis to a new feature
  - Developing talent: You hire and grow engineers into being
    the best engineers they can be, while maintaining a
    supportive and engaging team culture
  - Raising the technical bar: You insist on high standards of
    technical design and implementation and ensure your
    systems are operationally excellent
  - Deliver project work while managing the expectations of your
    stakeholders
  - Plan and prioritise impactful technical investment
    initiatives for your teams
  - Be a reflection of the GC Values that help us work with one
    another effectively

  What excites us

  - Professional experienced in coding - with Python and Ruby on
    Rails for backend and JavaScript/React on frontend, and a
    commitment to building reliable, well-tested systems
  - Enthusiastic about working in a strong culture of
    experimentation, testing and learning - to help us in
    experimenting ways to grow our product!
  - Someone excited about supporting and growing a group of
    engineers, helping them become the best engineers they can
    be
  - Somebody able to effectively communicate - mainly technical
    topics to technical and non-technical audiences
  - Collaboration and cross-functional work - we have a Product
    Manager, Designer and Data Scientists as part of our team
    and work with a lot of other commercial teams across the
    business
  - High agency: We’re after people who aren’t afraid of a
    challenge and will take ownership of problems they come
    across, help to resolve them and adapt to a constantly
    changing environment

  Base salary range: £101,600 - £152,400

  Base salary ranges are based on role, job level, location,
  and market data.  Please note that whilst we strive to offer
  competitive compensation, our approach is to pay between the
  minimum and the mid-point of the pay range until performance
  can be assessed in role. Offers will take into account level
  of experience, interview assessment, budgets and parity
  between you and fellow employees at GoCardless doing similar
  work.

  (some of) The good stuff

  - Wellbeing - stay healthy with dedicated support and medical
    cover
  - Lunch- based on the location, you either get a meal voucher
    or a paid lunch when working from the office
  - Work away scheme - gives you the option to work away from
    your country of residence for up to 20 working days in any
    12-month period
  - Adaptive Working - allows you to work flexibly, around your
    lifestyle
  - Parental leave - to suit everyone embarking on life's great
    adventure
  - Learning Budget - lead your own development with an annual
    learning budget
  - Time off - generous holiday allowance + volunteer days for
    ERG events + one day off if you need to move house

  Life at GoCardless

  We're an organisation defined by our values; We start with
  why before we begin any project, to ensure it’s aligned with
  our mission. We make it happen, working with urgency and
  taking personal accountability for getting things done. We
  act with integrity, always. We care deeply about what we do
  and we know it's essential that we be humble whilst we do
  it. Our Values form part of the GoCardless DNA, and are used
  to not only help us nurture and develop our culture, but to
  deliver impactful work that will help us to achieve our
  vision.

  Diversity & Inclusion

  As of April 2025, we had 806 employees (GeeCees) globally,
  with 524 based in the UK, 163 based in Latvia and 119 across
  our other offices.

  To ensure that we're representative of the world around us -
  and to be able to review relevant benchmarks - we ask
  GeeCees to voluntarily disclose diversity data. This year,
  the proportion of GeeCees providing data increased to 88%
  (up from 79% in 2024). With regards to diversity within
  GoCardless, we can see GeeCees identifying as:

  Asian, Black, Mixed or Other — 25%

  Neurodiverse — 9%

  LGBTQIA+ — 9%

  Disabled — 1%

  Average age — 33

  Female — 45%

  Male —  55%

  We’re rooting for you during your application and GoCardless
  aims to provide reasonable adjustments to make our
  recruitment process as remarkable and accessible as we can.
  Please speak to your Talent Partner if you need extra
  support.

  If you want to learn more, you can read about our Employee
  Resource Groups and objectives here Sustainability We’re
  committed to reducing our impact on the environment, leaving
  a more sustainable world for future generations. Check out
  our sustainability action plan here.

  Find out more about Life at GoCardless via Twitter,
  Instagram and LinkedIn.
