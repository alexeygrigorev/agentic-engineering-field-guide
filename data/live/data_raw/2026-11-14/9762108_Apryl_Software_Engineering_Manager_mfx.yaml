description: |
  About Us We are Progyny Global, the international arm of
  Progyny Inc. - the leading fertility and family-building
  benefits provider in the US. Our shared mission? To make
  fertility and family-forming care accessible everywhere,
  breaking down barriers so that anyone can start a family, no
  matter where they are. With Progyny’s support, we're set to
  amplify our impact globally, reaching more individuals and
  families than ever before. Come and join us for a diverse
  and inclusive workplace and use “Tech for Good”! About the
  Role We’re looking for a hands-on Engineering Manager to
  lead one of our cross-functional teams focused on building
  scalable health tech solutions. This is a strategic and
  technical leadership role where you'll work closely with our
  VP of Product & Engineering. You’ll combine your technical
  expertise in Python and cloud-based systems with people
  leadership to improve delivery, engineering processes, and
  team health. You won’t just manage, you’ll contribute code,
  shape architectural decisions, and lead by example. Tasks
  What You’ll Do * Lead and mentor a cross-functional team of
  frontend and backend engineers * Stay hands-on and
  contribute to code reviews, technical decisions, and
  critical development tasks * Improve software delivery
  processes, including estimations, quality, and velocity *
  Collaborate with Product, Design, and stakeholders to
  execute on our roadmap * Contribute to architectural
  decisions and scaling strategies * Help scale engineering
  culture and contribute to hiring and onboarding Requirements
  What You’ll Need * 7+ years of software engineering
  experience, including 2+ years in a team lead or engineering
  manager role, leading cross-functional agile teams * Strong
  experience in Python * Solid understanding of AWS
  infrastructure and CI/CD workflows * Proven ability to lead
  in agile, fast-paced environments * Exceptional
  communication and collaboration skills * Fluent in English
  Nice-to-Haves * Experience with modern frontend technologies
  such as React and TypeScript * Experience in health tech,
  AI/ML, or DevOps * Experience working in a startup or
  scaling product team * Background in building customer-
  facing platforms Benefits * 💰 Annual gross base salary
  range: €85,000–100,000 * 🎯 Performance bonus & equity
  program * 👶 Fertility & family-building benefits via Progyny
  platform (€5,000 benefit budget) * 🧠 Mental health support
  via Nilo Health (1:1 therapy + tools) * 🚲 Mobility benefit
  (e-bike subscription or BVG pass) * 🏡 Hybrid work (up to 2
  days from home/week) * ✈️ Remote work up to 8 weeks/year * 🌍
  Work on meaningful products that create global social impact
  We believe in equal opportunities. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees.
