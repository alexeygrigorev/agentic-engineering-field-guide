description: |
  At Zone 5 Technologies, we're redefining what's possible in
  precision weapons and unmanned aircraft systems (UAS). Our
  team of engineers and innovators are developing cutting-edge
  autonomous solutions to deliver affordable and scalable
  precision weapons, interceptors, and UAS.

  We're building the next generation of munitions and unmanned
  systems for the United States and its allies. If you're
  driven by hard problems, energized by rapid innovation, and
  ready to make an impact on defense technology, you belong
  here.

  Are you C# software engineer looking to make a meaningful
  impact in the development of complex, high-reliability
  software systems for safety-critical applications with the
  aerospace and defense industry? Zone 5 Technologies is
  seeking a highly skilled and motivated Software Engineer to
  join our team. The ideal candidate is a strong programmer
  with experience across the software development lifecycle,
  embedded systems, and modern development practices.

  Key Responsibilities:

  - Collaborate with cross-functional teams to develop utilities
    and application-level software solutions

  - Design, implement, test, and maintain software for high-
    reliability systems in safety-critical environments

  - Create sustainable, reusable, modular tools that can be used
    for multiple purposes

  - Utilize Git and GitHub for version control, code reviews,
    and collaborative development

  - Support build automation, system integration, and testing
    through scripting and command-line tools
  - Contribute to CI/CD pipelines using GitHub Actions and
    assist in deploying software to cloud environments,
    particularly AWS

  Qualifications:

  - 3–7 years of professional experience in software application
    development, ideally in aerospace, defense, or safety-
    critical industries

  - Proficiency in one or more programming languages: C#,
    Python, Java, javascript, etc.

  - Hands-on experience with Git, GitHub, and Visual Studio or
    similar development environments

  - Special bonus experience would be modern web full-stack
    development and languages (node.js, react, vue, angular,
    etc.)

  - Familiarity with Bash or PowerShell for scripting and
    automation tasks

  - Experience with CI/CD practices and tools, particularly
    GitHub Actions, and exposure to AWS infrastructure

  Compensation:

  Level III - $135k - $167k

  Level IV - $167k - $192k

  To ensure you've read this description, please start your
  cover letter or the 'summary' section of your application
  with the phrase: [Favorite Tool] Specialist found.
  Applications without this phrase will not be reviewed.

  Pay range for this role

  $135,000—$192,000 USD

  What's in it for you:

  Benefits:

  - Competitive total compensation package
  - Comprehensive benefit package options include medical,
    dental, vision, life, and more.
  - 401k with company-match
  - 3 weeks of paid time off each year
  - 40 hours of sick time
  - 12 annual company holidays

  Why Join Zone 5 Technologies?

  - Innovative Environment: Work on cutting-edge technology that
    is shaping the future of defense and aerospace.
  - Collaborative Culture: Join a team of passionate
    professionals dedicated to pushing the boundaries of
    what’s possible.
  - Career Growth: Opportunities for professional development
    and career advancement.

  If you are passionate about unmanned aircraft technology and
  want to be a part of a dynamic and growing company, we would
  love to hear from you. Apply today and join the Zone 5
  Technologies team!

