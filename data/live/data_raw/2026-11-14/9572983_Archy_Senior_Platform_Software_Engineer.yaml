description: |
  About Archy

  Smile! Those teeth you are showing deserve the best care you
  can give them, yet the status quo of the software your
  dentist uses today is outdated.

  Archy is a Series C vertical SaaS solution revolutionizing
  the dental practice management space — giving dental
  providers AI agents and software that lets them do what they
  do best (be dentists!) while we handle the more technical
  sides of running their practice business.

  Job Description:

  Join Archy as a Senior Platform Software Engineer and help
  revolutionize dental practice management with our cutting-
  edge SaaS solution. You’ll work with our Java Spring Boot
  backend to deliver reliable, scalable systems that empower
  dental professionals to focus on patient care.

  We are looking for a driven Senior Platform Engineer to join
  our growing team. You’ll thrive in our environment, where
  flexibility, adaptability, and initiative are key. You’ll
  have the opportunity to architect and scale our cloud
  infrastructure, collaborate with a mighty team, and see your
  work have a direct impact on the stability and velocity of
  our entire engineering organization.

  Job Responsibilities:

  - Own and evolve our cloud infrastructure and CI/CD pipelines,
    driving projects from inception to deployment.
  - Gain deep knowledge of our backend stack (Java Spring Boot)
    and partner with engineers to optimize system reliability,
    scalability, and deployment workflows.
  - Expected to actively adopt and integrate AI tools into day-
    to-day workflows to enhance productivity, decision-making,
    and overall impact.
  - Automate infrastructure provisioning and monitoring,
    ensuring our platform meets high-quality and security
    standards through rigorous testing and documentation.
  - Participate in code and architecture reviews, providing and
    receiving constructive feedback to help the team
    continuously improve.
  - Identify opportunities for improving developer productivity
    and system observability, and work to implement those
    improvements.
  - Estimate and plan infrastructure development efforts,
    ensuring timely and high-quality delivery of platform
    features.

  Job Requirements:

  - Bachelor’s degree in Engineering, Computer Science, or
    equivalent experience.
  - 6+ years of experience as a Platform, DevOps, or Site
    Reliability Engineer, with a strong emphasis on
    Infrastructure as Code (IaC) and automation.
  - Experience with cloud providers (AWS/GCP/Azure) and
    container orchestration (Kubernetes/Docker).
  - Leverages AI tools and automation in everyday work to move
    faster, improve outcomes, and continuously raise the bar
    on how we operate.
  - A deep focus on stability, performance, and security to
    ensure our platform remains rock-solid for our users.
  - A customer-centric mindset — understanding that both our
    internal developers and dental practices rely on our
    platform to run smoothly.
  - Strong collaboration and communication skills, with an
    openness to feedback and a respect for the diverse voices
    and talents on our team.

  What We Offer:

  - Health & Wellness: Comprehensive medical, dental, and vision
    coverage for you and your family, plus Spring Health and
    One Medical access.
  - Competitive Compensation: Base pay and equity, 401(k) with
    company match, and performance-based incentives (bonus or
    commission eligibility by role).
  - Flexibility & Remote Support: A remote-friendly culture that
    values flexibility and time to rest and recharge, with
    home office support and time-off benefits varying by role.
  - Team Connection: Annual all-company offsites to collaborate
    and connect in person.
