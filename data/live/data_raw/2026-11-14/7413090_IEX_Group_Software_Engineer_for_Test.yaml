description: |
  Software Engineer for Test


  About IEX

  At IEX, we’re passionate about building technology that
  moves industries forward. Our story began when we built a
  stock exchange designed to deliver high-performance results
  for all investors. Our belief is that technology should
  level the playing field so that opportunity is equitable. We
  are applying what we learned from building a high-
  performance stock exchange to build technology that solves
  for complexity and accelerates growth in other areas. We
  aspire to build a trusted, disciplined, and diversified
  business. Our goal is to build transformative technology
  without ever compromising our integrity - and we’re just
  getting started!

  Software Engineer for Test

  We are currently looking for a Software Engineer for Test
  who plays key role in supporting all phases of SDLC and also
  testing trading applications. You will be joining a lean QA
  team, and will have the ability to work across the entire
  technology organization to make a significant impact. To be
  successful in this role, you should have a keen eye for
  details, excellent communication skills along with Java
  programming and Linux experience and excellent business
  knowledge.

  If you’re up for working in a fast-paced environment and
  with a highly collaborative FinTech team changing Wall
  Street for the better – join us!

  What You’ll Do:

  - Review and analyze requirement specifications.
  - Collaborate with Product and Project managers to develop
    effective test strategies and test plans.
  - Write, Execute and Automate test scenarios and report bugs.
  - Work in close collaboration with development team to help
    reproduce the reported bugs and be able to retest
  - Participate in code reviews
  - Conduct End to End Integration testing and Implementation
    testing
  - Work with cross functional teams to ensure quality
    throughout the SDLC.
  - Troubleshoot production issues and support deployments.

  You Have:

  - 5+ years of experience working as a QA engineer or similar
    role.
  - Experience with Trading Systems and FIX protocol a big plus
  - Experience in project management and QA methodology
  - 3+ years of Linux/Unix experience
  - Beginner to intermediate knowledge in C++/Java and python
  - Working knowledge of test management software
  - Excellent written and verbal communication skills
  - Strong analytical and problem-solving skills
  - Bachelors/Master’s in Computer Science, Engineering or a
    related field.

  Why You Should Apply:

  - Comprehensive Benefits
  - New hire stock equity (RSUs)
  - 401K employer match
  - Unlimited PTO
  - 100% coverage for medical, dental, and vision
  - OneMedical membership
  - 16 weeks parental leave
  - Wellness Benefits
  - Flexible workplace
  - Employer charity match
  - Learning stipend
  - Commuter benefits
  - Jump Start onboarding program
  - Internal mentor program cross-departmentally
  - Friendly and inclusive workplace culture

  Our job titles may span more than one career level. The
  starting annual base pay is between $175,000 and $200,000
  for this NY-based position. The actual base pay is dependent
  upon many factors, such as: training, transferable skills,
  work experience, business needs and market demands. The
  annual base pay range is subject to change and may be
  modified in the future. This role is eligible for bonus and
  equity.

  Here at IEX, we are dedicated to an inclusive workplace and
  culture. We are an Equal Opportunity Employer that does not
  discriminate on the basis of actual or perceived race,
  color, creed, religion, alienage or national origin,
  ancestry, citizenship status, age, disability or handicap,
  sex, marital status, veteran status, sexual orientation,
  genetic information or any other characteristic protected by
  applicable federal, state or local laws. This policy not
  only complies with all applicable laws and protects workers'
  rights but is vital to IEX’s overall mission and values.
