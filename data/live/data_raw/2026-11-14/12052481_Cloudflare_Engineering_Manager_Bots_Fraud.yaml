description: |
  About Us  At Cloudflare, we are on a mission to help build a
  better Internet. Today the company runs one of the world's
  largest networks that powers millions of websites and other
  Internet properties for customers ranging from individual
  bloggers to SMBs to Fortune 500 companies. Cloudflare
  protects and accelerates any Internet application online
  without adding hardware, installing software, or changing a
  line of code. Internet properties powered by Cloudflare all
  have web traffic routed through its intelligent global
  network, which gets smarter with every request. As a result,
  they see significant improvement in performance and a
  decrease in spam and other attacks. Cloudflare was named to
  Entrepreneur Magazine's Top Company Cultures list and ranked
  among the World's Most Innovative Companies by Fast Company.
  At Cloudflare, we're not looking for people who wait for a
  polished roadmap; we're looking for the builders who see the
  cracks in the Internet that everyone else has simply learned
  to live with. We value candidates who have the instinct to
  spot a "normalized" problem and the AI-native curiosity to
  create a solution using the latest tools. Our culture is
  built on iteration, leveraging AI to ship faster today to
  make it better tomorrow, while ensuring that every
  improvement, no matter how small, is shared across the team
  to lift everyone up. If you're the type of person who values
  curiosity over bureaucracy, and that AI is a partner in
  solving tough problems to keep the Internet moving forward,
  you'll fit right in. Available Locations: Austin, TX;
  Denver, CO; Washington D.C.; New York City About the Team
  Our team builds the products that answer "Can we trust this
  traffic?" Knowing who's human, who's an agent, and who's a
  malicious actor is core to Cloudflare's strategy, and one of
  the primary values we deliver to our customers. Our products
  address a broad and evolving range of traffic integrity
  challenges. Examples include managing unwanted scraping,
  controlling access for bots and AI agents, and identifying
  fraud and abuse while minimizing friction for legitimate
  users. Our products make probabilistic decisions in an
  adversarial environment, using Cloudflare's global network
  signals, threat intelligence, and machine learning. We turn
  those signals into analytics and controls that customers can
  understand, trust, and act on. These are challenging
  engineering problems at the intersection of distributed
  systems, data, security, and customer experience. Who You
  Are

  - You have a track record of leading engineering teams,
    including hiring, onboarding, coaching, and supporting
    professional growth. Your past teams respect you as both a
    technical leader and a people manager.
  - You have a strong foundation in software engineering, with
    experience designing, building, and operating large-scale
    distributed systems and services.
  - You have taken projects from inception to production and
    overseen execution to meet commitments in a fast-paced,
    iterative engineering environment.
  - You connect business goals with technical decisions, explain
    both the "why" and the "how," and make thoughtful
    tradeoffs when requirements are uncertain.
  - You work effectively across Product, Engineering, and other
    functions to align priorities, remove blockers, and
    deliver shared outcomes.
  - You communicate clearly with engineers, customers, and
    senior leadership, adapting the level of technical detail
    to your audience.
  - You use AI fluently in engineering workflows and have the
    judgment to know where it accelerates the work and where
    it falls short.
  - You are curious about web security, bot management, fraud
    and abuse, and the evolving role of AI agents on the
    Internet. You do not need to know our exact stack, but you
    should be eager to go deep in the domain.

   What You'll Do  We are looking for an Engineering Manager
  to lead a team building and scaling Cloudflare's products
  for bot management, fraud detection, and abuse mitigation.
  You will recruit, mentor, and grow talented engineers,
  provide technical leadership, and partner closely with
  Product Management to shape and deliver the engineering
  roadmap. You will partner with detection and research teams
  to turn their signals into reliable, performant, and easy-
  to-use customer solutions. Our systems span real-time
  services running across Cloudflare's global network, APIs
  and configuration, and high-volume data and analytics
  pipelines. You will collaborate across engineering and
  product teams to bring new capabilities into production and
  continuously improve the customer experience. Key
  responsibilities:

  - Lead and grow the team. Hire, mentor, and empower engineers
    through clear feedback, thoughtful career development, and
    a culture of ownership and technical excellence.
  - Shape and deliver the engineering roadmap. Partner with
    Product Management to translate customer problems into
    incremental deliverables, balancing new capabilities with
    reliability, performance, and maintainability.
  - Provide technical leadership. Participate in design
    discussions and guide decisions about scalable distributed
    services, product integrations, APIs, and analytics.
  - Turn detection signals into customer capabilities. Partner
    with detection and research teams to deliver actionable
    analytics and configurable controls, helping customers
    balance security, user experience, and privacy.
  - Measure and improve customer outcomes. Work with Product and
    detection partners to use feedback and production data to
    improve effectiveness, reduce unnecessary friction, and
    make products easier to adopt.
  - Own operational health. Ensure your team's services have
    effective observability, safe releases, incident response,
    and follow-through on improvements.
  - Drive cross-team execution. Resolve dependencies, align
    priorities across teams, and work with customer-facing
    partners to address recurring product problems at their
    roots.

   Additional Experience We Value

  - Experience building bot management, fraud detection,
    application security, or other products that make
    decisions in an adversarial environment.
  - Familiarity with HTTP, browser technologies, JavaScript, and
    the tradeoffs between security, privacy, and user
    experience.
  - Experience integrating machine learning models into
    production systems or partnering closely with data science
    and machine learning teams.
  - Experience with high-volume data pipelines, analytics
    services, or columnar databases such as ClickHouse.
  - Experience with technologies used in our systems, such as
    Go, Rust, Python, Kafka, Kubernetes, and PostgreSQL.


  Compensation Compensation may be adjusted depending on work
  location.

  - For Washington D.C. & New York City based hires: Estimated
    annual salary of $190,000 - $261,000
  - For Denver based hires: Estimated annual salary of $170,000
    - $233,000


  Applications will be accepted until November 30, 2026.
  Equity This role is eligible to participate in Cloudflare's
  equity plan. Benefits Cloudflare offers a complete package
  of benefits and programs to support you and your family. Our
  benefits programs can help you pay health care expenses,
  support caregiving, build capital for the future and make
  life a little easier and fun! The below is a description of
  our benefits for employees in the United States, and
  benefits may vary for employees based outside the U.S.
  Health & Welfare Benefits

  - Medical/Rx Insurance
  - Dental Insurance
