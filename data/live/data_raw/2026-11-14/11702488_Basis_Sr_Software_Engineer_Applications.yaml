  Integrity in Hiring

   At Basis, integrity is at the core of how we hire. To
  protect our candidates and our company, we verify identity,
  education, and employment history for all hires. Some roles
  may also require onsite or in-person interviews as part of
  the process. Any misrepresentation of identity, experience,
  or skills may result in removal from the hiring process or
  termination of employment. We value transparency and
  authenticity and expect the same from every applicant.

  Anything Else?

  Don’t have every skill listed? No problem! We know
  experience can be built in many ways. If you have relevant
  skills that aren't reflected in your resume, we encourage
  you to share them in an optional cover letter.

  Life With Basis

  We’re committed to our people’s growth and well-being
  because our success is tied to theirs. That’s why we’ve
  earned recognition as a top workplace, including: Ad Age, #1
  Best Places to Work, WorkLife's #1 Most Committed to Work
  Life Balance, and the Chicago Tribune's Top Workplaces in
  Chicago. We offer competitive perks, including a flexible
  work week, 401k/RRSP matching, mental health support, paid
  sabbaticals, generous parental leave, flexible work options,
  and more.

  Basis is proud to be an equal-opportunity employer. We
  celebrate all team members regardless of gender identity,
  sexual orientation, race or cultural background, religion,
  disability, age, and beyond.

  If you need assistance with interview accessibility, please
  contact talent.acquisition@basis.com. Your privacy is
  important to us, view our policy here.
