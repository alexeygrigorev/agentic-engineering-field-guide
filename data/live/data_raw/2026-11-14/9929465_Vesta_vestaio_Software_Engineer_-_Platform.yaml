description: |
  What we're doing

  Owning a home is a foundational part of building financial
  security and wealth in America. However, the tools and
  technology that support homeownership are antiquated,
  dependent on things like fax machines, handwritten
  documentation, and hours of manual review.



  We're here to change it.



  Vesta was founded to rebuild the mortgage LOS from the
  ground up. Our founding belief is that the future of
  mortgage lending will be a fully automated process. Today,
  our AI augmented platform makes that a reality. Our mission
  has been to build a platform where AI isn’t just an add-on,
  but the core engine that transforms how a loan is actually
  manufactured.



  Who we are

  Our founding team is no stranger to the complexities of the
  financial industry. As early employees at Blend, they spent
  years together focused on creating modern cloud
  infrastructure for banks. Now, with Vesta, they are
  transforming the mortgage industry by creating the most
  flexible, open, and automated origination experience,
  benefitting financial institutions and their customers.



  And, we're not alone.



  We've raised $85M from top tier investors, including
  Andreessen Horowitz, Bain Capital Ventures, Conversion
  Capital, Zigg Capital, and Index Ventures.



  We believe that our team is our greatest competitive
  advantage and take pride in having a team of exceptional
  humans. As a team, we value humility, empathy, self-
  awareness, and an orientation towards action. If this sounds
  like you and you're excited by the idea of getting in at the
  ground level to be part of building the infrastructure that
  will power the future of the finance industry, we would love
  to hear from you!



  Who you are

  Vesta is building out its early engineering team with well-
  rounded, resourceful engineers who want to create a product
  literally from the ground up. An ideal candidate for this
  role is a senior+ engineer that has deep experience scaling
  distributed systems, is not afraid to work on any part of
  the stack, and is excited about the breadth of
  responsibility and autonomy. You are someone who people can
  depend on to get things done and take responsibility for
  your commitments. You love working alongside smart and
  talented people who are execution oriented.



  About your role

  Your work will likely span our entire codebase, but your
  primary focus will be on scaling and maturing our platform
  to handle the entire mortgage market. In addition to
  development, you'll be responsible for helping set the
  guidelines and frameworks for our engineering organization
  in the years ahead, including both technical tooling and
  organizational growth.



  Working at an early-stage startup means there is a strong
  sense of ownership across the team. While we support
  flexible schedules and trust people to manage their time,
  there will be moments when mission-critical work requires
  extra effort outside of typical working hours. We’re looking
  for teammates who are comfortable with that reality and who
  care deeply about the success of the product and the team.



  The responsibilities of this role are open-ended, but we're
  looking for someone with deep experience in at least one,
  but ideally all of the following:

  - Comfortable working in an early-stage startup environment
    where mission-critical work may occasionally require
    effort outside typical working hours.
  - Deep experience scaling distributed systems with complex
    data dependencies
  - Performance engineering in any of the following domains:
    AWS, Kubernetes, Kafka, PostgreSQL or similar relational
    database, Redis, Elasticsearch
  - Strong proficiency with C# or other statically typed
    languages such as Kotlin, Go, or Java.
  - Familiarity with observability tools (Datadog) and
    infrastructure as code (Terraform)



  Perks & Benefits

  - Robust medical, vision, & dental coverage (~100% of employee
    premiums are covered)
  - FSA plan offering
  - 401(K) plan offering
  - Meaningful parental leave - 16 weeks fully paid for all new
    parents, birthing & non-birthing parents (applies to
    adoptions as well!)
  - Remote-first culture with a physical hub in the bay area!
  - Generous Work From Home & Wellness Benefits
  - Monthly cell & wifi stipend
  - Monthly Doordash benefits
  - Open & encouraged flexible time off
  - Company offsites to get to know the team!

  Our cash compensation amount for this role is targeted at
  $200,000 - $275,000. Final offer amounts are determined by
  multiple factors including candidate experience and
  expertise and may vary from the amounts listed above.

  At Vesta, we believe that the only way we can tackle the
  challenging problems in front of us is by having diverse
  perspectives and an environment that promotes inclusivity.
  We’re committed to equal opportunity regardless of race,
  color, ancestry, religion, gender, gender identity, parental
  or pregnancy status, national origin, sexual orientation,
  age, citizenship, marital status, disability, or veteran
  status. Pursuant to the San Francisco Fair Chance Ordinance,
  we will consider for employment qualified applicants with
  arrest and conviction records. As part of our onboarding
  process, we participate in the E-Verify program.
