description: |
  Disclaimer and Fraud Alert:
  https://www.ihealthwellness.org/job-openings

  We are an 'early stage' pre-money nonprofit/ tech startup
  preparing for a proof-of-concept launch / seed-raise looking
  to recruit VOLUNTEERS (unpaid) as an EPIC Interface/
  Integrations Specialist who will help us with signing and
  implementing integration solutions between EPIC and other
  systems.

  Responsibilities

  - Design and implement integration solutions between EPIC and
    other systems
  - Be involved in the full life cycle of interface development
    including requirements gathering, building, testing, go-
    live, and production support
  - Provide integration environment technical knowledge and
    experience during the planning, execution, and management
    of integrating new applications into the existing
    environment
  - Identify and resolve system integration issues and assist
    with problem determination and resolution efforts when
    operational issues with integration solutions arise
  - Develop standards, processes, and documents to support and
    facilitate integration projects and initiatives

  Require Experience

  - 3+ years of experience in computer programming and analysis
    in the Healthcare field
  - EPIC Bridges certification preferred
  - Experience with multiple software applications, systems
    analysis/design, Integration/design, or web
    applications/design
  - Strong verbal and written communication, interpersonal, and
    organizational skills
  - Excellent critical thinking and analytical skills, with a
    passion for solving problems and creating solutions
  - Bachelor's degree in Computer Science, Information
    technology, or related field
  - Previous experience at a startup, consulting, or HealthTech
    company is a plus
  - Ability to commit to a minimum of 4+ hour work weeks
  - Ability to attend weekly standup meetings (conference call
    with desktop/ laptop access for screen sharing)
  - Fluent in English

  NOTE: Your first assignment will involve launching a
  fundraising campaign. iHealth will provide comprehensive
  guidance and resources to help ensure your fundraiser is
  both quick and successful.

  Please note that candidates actively seeking CPT/Internships
  are ineligible for this particular volunteer position.
  Through your pro-bono work, you will not only continue to
  demonstrate your current skills while gaining some new ones,
  practice teamwork, make new friends, and develop
  professional connections in a professional setting, but you
  will also have the opportunity to demonstrate what companies
  value in ways other than paid employment: ability to get
  things done and ability to work as a team. Join us, you win,
  we both win!!

  Disclaimer and Fraud Alert

  At iHealth and Wellness, we are deeply committed to
  transparency and integrity in our recruitment process.
  Please note that all current opportunities within our
  organization are volunteer roles.

  We ensure every volunteer candidate is thoroughly screened
  and personally reviewed by our Founder and CEO to align with
  our mission and values. To avoid misinformation or potential
  scams, we encourage applicants to apply exclusively through
  our designated platforms.

  Thank you for your interest in the volunteer role with
  iHealth and Wellness! Please continue if you have 3+ years
  of relevant experience. This is an unpaid position until the
  organization generates revenue (don’t have an ETA at this
  time as to when funding will be secured), and successful
  applicants are required to attend a weekly 30-minute to
  1-hour meeting, held Monday to Wednesday between 12 PM and
  5:30 PM ET.

  Fraud Warning

  Beware of fraudulent activities where bad actors may
  impersonate iHealth and Wellness using fake domain names or
  email addresses. All official recruitment communications
  will come from domain name @ihealthwellness.org.

  To protect yourself:

  - Ensure all emails are sent from domain name
    @ihealthwellness.org.

  - Verify the authenticity of emails and job postings.

  - Remember, we will never request payment, banking
    information, or sensitive personal details as part of the
    application process.

  If you come across suspicious communications or have
  concerns, please contact us immediately at .

  Thank you for helping us maintain a safe and trustworthy
  recruitment process.

