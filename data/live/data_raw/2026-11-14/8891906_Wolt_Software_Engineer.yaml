description: |
  About Wolt

  At Wolt, we create technology that brings joy, simplicity
  and earnings to the neighborhoods of the world. In 2014 we
  started with delivery of restaurant food. Now we’re building
  the delivery of (almost) everything and you’ll find us in
  over 500 cities in 30 countries around the world. In 2022 we
  joined forces with DoorDash and together we keep on dreaming
  big and expanding across the globe. Working at Wolt isn’t
  always easy, but it’s definitely exciting. Here you’ll learn
  more, build more, and ship more than in most other
  companies. You’ll be challenged a lot, but also have a lot
  of fun on the way. So, if you’re a self-starter with drive
  and entrepreneurial spirit, this could be the ride of your
  life.

  What we’re looking for

  We’re looking for a Backend Engineer to join the Wolt AdTech
  & Promotions team.

  This role is best suited for someone who is strongly
  backend-oriented, thrives in ambiguity, and can take
  ownership of large, cross-functional initiatives from
  planning to delivery.

  You might be a great fit if you

  - Are a strong backend engineer, ideally with Golang
    experience
  - Have experience building and operating scalable backend
    systems
  - Are comfortable working in high-ambiguity environments and
    bringing structure where needed
  - Can independently lead large initiatives across team
    boundaries, from problem definition and planning to
    stakeholder alignment and on-time delivery
  - Communicate clearly and effectively, and know how to gather,
    process, and act on feedback
  - Can build strong working relationships with stakeholders and
    keep multiple parties aligned around shared goals
  - Have hands-on experience with AI-assisted engineering
    workflows, including tools like Codex, Claude, and agent-
    based development approaches
  - Bring experience with NoSQL databases such as Cassandra,
    MongoDB, or similar technologies

  Requirements

  - Backend engineering experience
  - Strong preference for Golang
  - Proven ability to take ownership of complex, cross-team
    projects in ambiguous environments
  - Strong stakeholder management, planning, and delivery skills
  - Excellent communication and alignment-building skills
  - Extensive experience with AI-assisted development, including
    tools such as Codex, Claude, and agentic workflows
  - Experience with NoSQL databases such as Cassandra, MongoDB,
    or similar is a plus

  Our Commitment to Diversity and Inclusion

  We’re committed to growing and empowering a more inclusive
  community within our company, industry, and cities. That’s
  why we hire and cultivate diverse teams of people from all
  backgrounds, experiences, and perspectives. We believe that
  true innovation happens when everyone has room at the table
  and the tools, resources, and opportunity to excel.

  Beware of recruitment scams: DoorDash, Deliveroo, and Wolt
  will never ask you to pay money or share sensitive financial
  information during hiring — learn more about our legitimate
  recruiting process at Recruitment Scam Awareness - DoorDash
  .
