description: |
  We’re on a mission to back the UK’s small businesses like no
  one else 🚀

  Small businesses are the backbone of the economy, and we’re
  here to help them win. We’ve built a platform that uses
  clever data to get them the funding they need in minutes,
  not weeks.

  At Funding Circle, we have the restless energy of a fintech
  start-up with the stability of a public company. It’s a
  unique mix that gives Circlers the autonomy to take
  ownership and the scale to make an impact that truly counts.

  We’re a high-performing team that chooses to lift each other
  up. We challenge, we champion, and we have each other’s
  backs - because we know that when we stand together, we move
  faster and build better.

  The impact is real: Last year alone, the businesses on our
  platform generated £7.2bn for the UK economy 📈 Come and join
  a mission that matters!

  [Read our Impact Report] | [See our Trustpilot]

  The role ⚡

  📍 London (Hybrid) | 🤝 2 days in the office | 💰 Competitive
  Salary + Benefits

  We are looking for an experienced Staff Engineer with an
  excellent track record of technical leadership for our
  Product Engineering team.

  The role sits within our Multi-Product Experiences
  Engineering Group, providing technical leadership for the
  area responsible for the multi-product capabilities used by
  internal and external customers to browse, apply for and
  manage Funding Circle’s class-leading credit products. Staff
  Engineers are amongst the most senior leaders we have within
  our Technology function and as such are responsible for
  raising the bar and enabling us to achieve the incredible.

  As a Staff Engineer within our MPX domain you’ll:

  - Collaborate with product leadership early to understand the
    business goals and shape the technical direction to
    deliver on it. You translate this into a target system and
    data architecture with clear milestones to iterate towards
    it
  - Have strong technical documentation skills and are able to
    write clear and thorough technical designs and standards
  - Have high standards, drive continuous improvement, and take
    others on the journey to be even better
  - Proactively identify and leverage the latest Generative AI
    tools and techniques to drive innovation and transform our
    engineering processes, helping the organisation become
    fully "AI Native."
  - Actively coach Lead Engineers, giving them feedback on their
    solutions, and guardrails for making decisions. You play
    an important part in their personal development through
    mentorship and are a role model for aspiring Staff
    Engineers
  - Perform deep-dives and troubleshoot issues in a hands-on
    capacity, but seek to enable the teams rather than
    becoming a dependency for future issues.
  - Interact with different stakeholders and present technology
    solutions, risks and tradeoffs to any audience across
    Funding Circle, demonstrating the ability to influence
    without requiring reporting authority to do so
  - Take accountability for high-level solution design and
    technology decisions within your Group
  - Have sound commercial acumen and a solid understanding of
    how tech drives the top and bottom line. Your impact is
    connected to customer and commercial outcomes
  - Represent Funding Circle externally at events, leveraging
    your network to share industry trends and insight, as well
    as attracting talent to Funding Circle.

  What we’re looking for 🌱

  - A curious mindset and an ability to continuously improve the
    Technology function
  - An engineering leader who can lead on solving high-level
    problems, whilst also deep-diving into technical
    challenges in a hands-on capacity
  - Strong technical documentation skills
  - Strong communication skills
  - Experience in at least one major Programming language (e.g.
    Python, Ruby, Java)
  - A strong fundamental programmer (data structures,
    algorithms)
  - Familiar with developing on Unix/Linux
  - Knowledgeable of Agile, Scrum, BDD, TDD and CI/CD
  - Experienced in delivering mission-critical, high-value
    products, and services
  - A strong passion for and proven experience in adopting and
    applying emerging technologies, particularly Generative
    AI, to solve complex engineering challenges and drive
    transformational change across an organisation.

  We’re building a place where everyone truly feels they
  belong. Even if your past experience doesn't align perfectly
  with every requirement, we'd still love to hear from you.

  Why join us? 💜

  We back you to build an incredible career and by joining us,
  you'll be part of one of The Sunday Times Best Companies to
  Work For 2026! As a flexible-first employer, we use a "best
  of both" approach. We’ll see you in our London office to
  collaborate – with barista coffee and subsidised Just Eat
  lunches on us!

  Our Circler Proposition focuses on five areas:

  - Flexibility: We provide a benefit allowance you can tailor
    to your own life and family.
  - Health: This includes private medical and dental, health
    assessments, and access to a digital GP.
  - Wealth: We offer life assurance, share schemes, and
    financial coaching.
  - Development: You get a dedicated annual learning allowance
    to help you level up.
  - Lifestyle: We have electric car and cycle-to-work schemes,
    plus season ticket loans.

  We also have award-winning parental leave policies. We're
  here to support you through the big life moments, from
  fertility treatments to new additions to the family.

  Ready to join a mission that matters? We’d love to chat!
