description: |
  About Glean:



  Glean is the Work AI platform that helps everyone work
  smarter with AI. What began as the industry’s most advanced
  enterprise search has evolved into a full-scale Work AI
  ecosystem, powering intelligent Search, an AI Assistant, and
  scalable AI agents on one secure, open platform. With over
  100 enterprise SaaS connectors, flexible LLM choice, and
  robust APIs, Glean gives organizations the infrastructure to
  govern, scale, and customize AI across their entire business
  - without vendor lock-in or costly implementation cycles.



  At its core, Glean is redefining how enterprises find, use,
  and act on knowledge. Its Enterprise Graph and Personal
  Knowledge Graph map the relationships between people,
  content, and activity, delivering deeply personalized,
  context-aware responses for every employee. This foundation
  powers Glean’s agentic capabilities - AI agents that
  automate real work across teams by accessing the industry’s
  broadest range of data: enterprise and world, structured and
  unstructured, historical and real-time. The result:
  measurable business impact through faster onboarding, hours
  of productivity gained each week, and smarter, safer
  decisions at every level.



  Recognized by Fast Company as one of the World’s Most
  Innovative Companies (Top 10, 2025), by CNBC’s Disruptor 50,
  Bloomberg’s AI Startups to Watch (2026), Forbes AI 50, and
  Gartner’s Tech Innovators in Agentic AI, Glean continues to
  accelerate its global impact. With customers across 50+
  industries and 1,000+ employees in more than 25 countries,
  we’re helping the world’s largest organizations make every
  employee AI-fluent, and turning the superintelligent
  enterprise from concept into reality.



  If you’re excited to shape how the world works, you’ll help
  build systems used daily across Microsoft Teams, Zoom,
  ServiceNow, Zendesk, GitHub, and many more. You'll be deeply
  embedded where people get things done. You'll ship agentic
  capabilities on an open, extensible stack, with the craft
  and care required for enterprise trust, as we bring Work AI
  to every employee, in every company.

  About the Role:

  Glean is seeking a talented Solutions Engineering Manager to
  lead and develop a team of Solutions Engineers supporting
  our Enterprise segment within the Central region. In this
  role, you will guide technical strategy across prospect and
  customer engagements, helping organizations understand how
  Glean’s Work AI platform can address their needs and deliver
  business value. You will lead and improve pre-sales
  work—including technical discovery, tailored demonstrations,
  use-case workshops, and pilot engagements—and partner across
  Glean to support customer adoption and growth.

  You will:

  - Lead, coach, and develop a high-performing team of Solutions
    Engineers through clear expectations, regular feedback,
    career development, talent planning, and performance
    management.
  - Establish and apply a strong regional operating rhythm in
    partnership with Sales leadership, including account
    planning, pipeline and deal inspection, technical
    qualification, coverage planning, and prioritization of
    strategic opportunities.
  - Set the standard for how the team leads technical discovery,
    connects customer priorities to business outcomes, designs
    solutions, delivers demonstrations, facilitates use-case
    workshops, and structures pilots.
  - Coach the team on how to apply sales methodologies such as
    Command of the Message and MEDDPICC to improve
    qualification, deal strategy, mutual action planning, and
    outcome delivery.
  - Build repeatable plays, enablement, and inspection
    mechanisms that raise the quality and consistency of SE
    execution across the region.
  - Coach and guide account teams to identify opportunities to
    expand Glean adoption within customer organizations and
    align technical plans, priorities, and expectations with
    customers and internal partners.
  - Partner with Sales, Applied AI / Post-Sales, Product
    Management, PMM, and Engineering to resolve and escalate
    technical issues, improve customer outcomes, and
    communicate field needs and product opportunities.
  - Contribute to hiring strategy, capacity planning,
    organizational design, and the broader development of
    Glean’s Solutions Engineering discipline.
  - Represent Glean’s technical point of view with customers and
    in the broader technical community, sharing best practices
    and strengthening our industry presence.

  About you:

  - You are an experienced people leader with a track record of
    hiring, developing, coaching, and retaining Solutions
    Engineers or comparable customer-facing technical talent.
  - You know how to lead through others: setting direction,
    creating clarity, giving candid feedback, and building a
    culture of accountability, learning, and high performance.
  - You bring a player-coach mindset. You are willing to roll up
    your sleeves and get directly involved in important
    customer and deal situations, but your primary measure of
    success is the performance and growth of your team.
  - You have led complex enterprise opportunities and can coach
    teams through technical discovery, solution strategy,
    executive presentations, demonstrations, workshops, and
    pilots.
  - You bring strong business acumen and can connect technical
    decisions to customer outcomes, sales strategy, and
    company priorities.
  - You have sufficient technical fluency in APIs, integrations,
    cloud architecture, security, networking, and SaaS or
    hybrid environments to guide your team and build
    credibility with technical stakeholders.
  - You bring strong AI fluency and can help both customers and
    account teams identify practical applications of
    generative AI, evaluate AI solutions, and navigate
    considerations around data, security, governance, and
    adoption.
  - You have hands-on familiarity with one or more major cloud
    platforms, such as Google Cloud Platform (GCP), Amazon Web
    Services (AWS), or Microsoft Azure. Experience with
    information security, cloud security, or audit frameworks
    is valuable.
  - You communicate technical concepts clearly to both technical
    and non-technical stakeholders and can deliver polished
    presentations.
  - You are organized, proactive, and data-informed; you can
    plan and execute projects, balance competing priorities,
    and identify opportunities to improve.
  - You bring strong listening and interpersonal skills, sound
    judgment, and a customer-focused, adaptable startup
    mindset—including a willingness to do whatever it takes
    (DWIT) to help the team succeed.

  Location:

  - This role is remote based out of the Central Region

  Compensation & Benefits:

  The standard on-target earnings (OTE) range for this
  position is $250,000–$330,000 annually. Compensation offered
  will be determined by factors such as location, level, job-
  related knowledge, skills, and experience. Certain roles may
  be eligible for equity and benefits.

  We offer a comprehensive benefits package including
  competitive compensation, Medical, Vision, and Dental
  coverage, generous time-off policy, and the opportunity to
  contribute to your 401k plan to support your long-term
  goals. When you join, you'll receive a home office
  improvement stipend, as well as annual education and
  wellness stipends to support your growth and wellbeing. We
  foster a vibrant company culture through regular events, and
  provide healthy lunches daily to keep you fueled and
  focused.

  We are a diverse bunch of people and we want to continue to
  attract and retain a diverse range of people into our
  organization. We're committed to an inclusive and diverse
  company. We do not discriminate based on gender, ethnicity,
  sexual orientation, religion, civil or family status, age,
  disability, or race.

  #LI-REMOTE



  AI-First Mindset at Glean:



  At Glean, AI fluency is core to how we work and we're
  committed to ensuring every new hire feels confident
  integrating AI into their everyday work. As part of the
  interview process, you'll complete a brief AI-focused
  exercise or discussion so we can understand how you think
  about, design, and use AI to drive impact in your role. Feel
  free to reference any tools, platforms, or workflows you use
  today — prior Glean experience isn't required.



