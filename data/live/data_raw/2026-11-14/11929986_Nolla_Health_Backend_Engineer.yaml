description: |
  New York City · Full-time

  Help build the backend that makes better healthcare
  possible.

  At Nolla Health, we’re building AI-powered healthcare that
  connects understanding a patient’s needs with actually
  delivering care. That takes more than a capable model: it
  takes software that brings together patient information,
  clinical decisions, and the systems needed to act on them.

  We’re looking for an experienced engineer to build and own
  that foundation. You’ll develop the services behind our
  patient apps and clinical workflows, connect healthcare
  systems, and build the infrastructure that lets AI agents
  work securely and reliably alongside clinicians.

  This is a hands-on role with room to shape the architecture,
  engineering practices, and team as we grow. We welcome
  senior and staff engineers, early startup engineers, and
  former founders who want broad ownership and close
  involvement in the product.

  What you'll do

  - Build the APIs and backend services powering our patient
    apps and clinical workflows.
  - Develop the systems that connect AI agents to patient
    information, clinical tools, and actions involved in
    delivering care.
  - Build tools that help clinicians review cases and care for
    patients.
  - Integrate with electronic medical records and other
    healthcare systems.
  - Own cloud infrastructure, deployments, monitoring, and
    production reliability.
  - Design secure systems for sensitive patient data, including
    access controls and audit trails.
  - Work with product, clinical, and AI teammates to take
    features from an idea through launch and ongoing
    operation.
  - Improve how we build software through automation, thoughtful
    tooling, and effective use of AI coding tools.
  - Help hire and mentor engineers as the team grows.

  What you bring

  - Substantial experience building and operating production
    backend systems, typically six or more years.
  - Experience building at an early-stage startup, shipping with
    a small team and owning multiple parts of the stack.
  - Strong judgment about APIs, data models, databases,
    background jobs, and integrations.
  - The ability to own cloud infrastructure and operate the
    services you build.
  - A practical understanding of security, reliability, and
    handling sensitive data.
  - Product judgment: you can work through an ambiguous problem,
    understand what users need, and choose an approach that
    gets useful software into their hands.
  - Effective use of AI coding tools, with the judgment to
    review, test, and maintain what they produce.
  - A desire to stay hands-on while taking responsibility for
    technical decisions and outcomes.

  We care about what you’ve built, how you think, and the
  responsibility you’ve taken on. You should bring strong
  engineering practices and know how to apply them in a small
  team.

  Bonus points

  - Backend systems for consumer or mobile products.
  - AI agents, tool integrations, or AI-powered features in
    production.
  - Healthcare software, clinical workflows, EMR integrations,
    or HIPAA requirements.
  - Hiring or mentoring engineers.

  Healthcare experience is welcome, but it isn’t required. An
  interest in making healthcare better is.

  Your work will support both patients seeking care and the
  clinicians providing it. You’ll help decide how AI becomes
  part of a working healthcare service, from the information
  an agent can access to how a clinical workflow moves
  forward.

  You’ll have a direct say in how Nolla’s backend is built and
  how the engineering team works. As we grow, there’s room to
  take on technical leadership and help build the team while
  staying close to the code.

  This role is based in New York City. We’re open to
  candidates willing to relocate.

  Compensation

  Salary: $180,000–$220,000+, based on experience.
