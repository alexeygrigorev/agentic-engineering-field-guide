description: |
  Company Description

  Today, when you go to your doctor and get referred to a
  specialist, your doctor sends out a referral and tells you,
  “They’ll be in touch soon.” So you wait. And wait. Sometimes
  days, weeks, or even months. Why? Because too often
  providers are overwhelmed with the painstakingly tedious
  work required to get paid by insurance companies. Powered by
  proprietary models, Tennr handles the complex paperwork that
  gets patients through the door and providers paid, helping
  operators get patients the right care, at the right time, in
  the right setting.

  Role Description

  We’re looking for a high-agency Senior Backend Engineer to
  bridge the gap between cutting-edge ML research and real-
  world product delivery. You’ll design and build agentic
  workflows that power complex healthcare processes to solve
  hairy infrastructure, workflow, and UX challenges in U.S.
  healthcare.

  This role involves creating data pipelines, evaluation
  harnesses, and scalable production-grade agentic systems.
  You’ll be responsible for researching the right tools and
  models, ensuring we always use the best-fit technology for
  each workflow..

  As part of our ML team, you’ll work hand-in-hand with
  researchers to translate new techniques and insights into
  production-ready systems. The ideal candidate has full-stack
  engineering experience, hands-on expertise with LLM APIs,
  and a proven track record of deploying AI systems into
  production. You’ll work across the stack - from data
  collection to training pipelines to AI agent orchestration
  to frontend integration - bringing cutting-edge AI solutions
  to life in real-world healthcare environments.

  Responsibilities

  As a Senior Backend Engineer on the ML team at Tennr, you’ll
  bridge the gap between cutting-edge ML research and real-
  world product delivery. You’ll help build agentic systems
  that use LLMs, and vision models, and structured automation
  to solve hairy infrastructure, workflow, and UX challenges
  in U.S. healthcare.

  - Ship full-stack AI systems end-to-end
  - Design resilient systems for model deployment, evaluation,
    and monitoring that stay reliable as traffic grows.
  - Go from ideation to code within hours; iterate quickly on
    experiments and data.
  - Collaborate with ML engineers, backend engineers, and cross-
    functional teams to integrate models cleanly with data
    pipelines and product

  Qualifications

  - Proficiency in full-stack development, with a strong
    understanding of system design, backend engineering, and
    observability infrastructure.
  - A track record of working through the full lifecycle of
    building, testing, deploying, scaling, and monitoring LLM-
    centered software architectures.
  - Excellent communication and collaboration skills: aligning
    on interfaces, navigating tradeoffs, and driving cross-
    team execution.

  Why Tennr?

  - Drive Impact: one of our company values is Cowboy, meaning
    you set the pace. You won’t just talk about things, you’ll
    get them done. And feel the impact.
  - Develop Operational Expertise: learn the inner workings of
    scaling systems, tools, and infrastructure
  - Innovate with Purpose: we’re not just doing this for fun
    (although we do have a lot of fun). At Tennr, you’ll join
    a high-caliber team maniacally focused on reducing patient
    delays across the U.S. healthcare system.
  - Build Relationships: collaborate and connect with like-
    minded, driven individuals in our Hudson Square office 4
    days/week
  - Free lunch! Plus a pantry full of snacks.

  Benefits

  - Beautiful new office at 345 Hudson Street
  - Unlimited PTO
  - 100% paid employee health benefit options
  - Employer-funded 401(k) match
  - Competitive parental leave
