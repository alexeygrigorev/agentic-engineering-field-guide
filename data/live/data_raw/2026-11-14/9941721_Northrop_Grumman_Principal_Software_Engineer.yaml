description: |
  UK CITIZENSHIP REQUIRED FOR THIS POSITION: Yes

  RELOCATION ASSISTANCE: Relocation assistance may be
  available

  TRAVEL: Yes, 10% of the Time

  Define Possible at Northrop Grumman UK

  What’s your possible?

  At Northrop Grumman UK, you are part of a team driving
  innovation where it matters most – solving tomorrow’s
  challenges and shaping the technology solutions of the
  future. We call it Defining Possible.

  This mindset goes beyond our customer solutions; it’s the
  foundation for your career development and the impact we
  have within the community.

  Salary: £80,200 - £120,400

  The Opportunity

  This is more than just a job; it’s a mission.

  As a Principal Software Engineer, you will play a pivotal
  role in designing, developing, and maintaining the critical
  infrastructure that powers our services. You will work on a
  variety of unique and complex projects, delivering core
  solutions that have real impact.

  You will bring strong technical leadership, guiding teams
  through both technical and delivery challenges while shaping
  solutions that meet customer needs.

  “My purpose is to lead a team of engineers, rise to the
  challenges presented, push the boundaries and define
  possible together.” – Principal Software Manager, Northrop
  Grumman UK

  What You’ll Do

  - Take ownership of multiple teams’ deliverables and work with
    technical leads to define a path that meets customer
    requirements.
  - Represent Northrop Grumman UK as the prime technical contact
    for your area.
  - Collaborate with senior external partners and customers,
    often coordinating between organisations.
  - Mentor and guide engineers to support skills development and
    overall team growth.
  - Contribute to high‑quality technical design, development,
    and delivery planning.

  What We’re Looking For

  - Experience as a Software Engineer with strong capability in
    one or more of the following:
    - Backend development (Java Spring Boot, Maven, Python)
    - Frontend development (JavaScript/TypeScript, React, npm)
  - Proven experience designing, developing, and deploying
    scalable backend systems.
  - Familiarity with DevOps, CI/CD and containerisation
    technologies (Jenkins, Kubernetes, Docker, AWS).
  - Strong communication, collaboration, and problem‑solving
    skills, ideally within an agile environment.

  If you don’t meet every requirement, we still encourage you
  to apply. Talent, mindset, and potential matter to us.

  Security Clearance

  Due to the nature of our work, you must be British National
  for this clearance type. You must currently hold the Highest
  Level of  UK Government security clearance.

  Our recruitment team is on hand to support you and guide you
  through the process: talentenquiries@uk.ngc.com

  Benefits

  - Flexible working options, including an optional compressed
    fortnight
  - Private healthcare
  - Cash health plan
  - Holiday buy/sell scheme
  - Career development programmes and ongoing specialist
    training
  - Performance‑based bonuses
  - A range of wellbeing, financial, and lifestyle benefits

  Why Join Us?

  A Mission to Believe In

  Every day, we contribute to building a more secure and
  connected world across land, sea, air, space, and
  cyberspace. The work we do together matters.

  A Place to Belong and Thrive

  Every voice matters. We are proud of our inclusive community
  and our partnerships with organisations championing
  diversity, mental health, and veteran careers. You can bring
  your authentic self to work and thrive here.

  Your Career, Your Way

  Shape your career with diverse opportunities, mentoring,
  training programmes, and the flexibility to balance work and
  life. Your professional growth and wellbeing are at the
  heart of our culture.

  Ready to Apply?

  Yes – Submit your application online. Possibly – Contact our
  team to learn more: talentenquiries@uk.ngc.com No – Explore
  other opportunities with us. We’re growing across the UK.

  #SOFT-ENG-DEVOPS

  Northrop Grumman is committed to hiring and retaining a
  diverse workforce, and encourages individuals from all
  backgrounds and all abilities to apply and consider becoming
  a part of our diverse and inclusive workforce.
