description: |
  About Scrumconnect Consulting

  Scrumconnect Consulting is a multi-award-winning digital
  consultancy, recognised for delivering impactful and
  innovative technology solutions across UK government
  departments. Our work has positively influenced the lives of
  over 40 million UK citizens.

  We are passionate about user-centred design, agile delivery,
  and building digital services that make a real difference.
  Our teams work at the forefront of innovation, helping
  organisations transform and deliver high-quality, scalable
  solutions that truly matter.

  We are looking for a Junior Power Platform Developer to
  build prototype components during a short discovery. Working
  with the lead developer and technical architect, you will
  create reusable, testable features for service-desk and
  chatbot demonstrations.

  What you will do

  - Build Power Apps, Power Automate flows, Dataverse tables,
    forms, views and dashboards to the agreed design.
  - Configure request capture, assignment, queue management,
    status changes, service levels and escalation workflows.
  - Develop chatbot topics, questions, branching logic and
    validation responses.
  - Implement the agreed content and request quality checks.
  - Configure notifications, approvals, audit information and
    dashboard data.
  - Prepare mock data and demonstration scenarios without using
    unnecessary personal or sensitive information.
  - Produce component-level designs and keep build documentation
    up to date.
  - Carry out unit testing, defect fixing and regression
    testing.
  - Take part in peer reviews and act on feedback.
  - Support stakeholder demonstrations and make controlled
    changes based on feedback.
  - Identify technical constraints, defects and dependencies
    early and escalate them.
  - Support the packaging, deployment and handover of prototype
    assets.
  - Contribute to the assessment of what production would need
    and future effort estimates.

  What you will bring

  - Practical experience building apps and workflows on
    Microsoft Power Platform.
  - Strong knowledge of Power Apps, Power Automate and
    Dataverse.
  - Experience configuring forms, tables, views, business logic,
    security roles and automated workflows.
  - Understanding of APIs, connectors, JSON and integration
    principles.
  - Experience with unit testing, defect management and
    technical documentation.
  - Ability to work well in an architecture-led,
    multidisciplinary agile team.
  - Strong problem-solving skills and the ability to deliver
    usable components to short deadlines.
  - Understanding of accessibility, security, data protection
    and audit requirements.

  Desirable

  - Experience with Microsoft Copilot Studio, Dynamics 365
    Customer Service, Power BI or Power Pages.
  - Familiarity with Power Platform ALM and source control.
  - Microsoft PL-400 or PL-200 certification, or equivalent
    experience.
  - Public sector or regulated environment experience.

  Diversity and Inclusion

  At Scrumconnect Consulting, we believe that diversity drives
  innovation and better outcomes. We are committed to
  fostering an inclusive environment where every individual is
  valued, respected, and supported.

  We welcome applications from candidates of all backgrounds
  and actively encourage individuals from underrepresented
  groups, including women, people with disabilities, and
  diverse communities, as well as those seeking flexible
  working arrangements.

  As a Disability Confident Level 1 employer, we are committed
  to providing reasonable adjustments throughout the
  recruitment process and during employment to ensure equal
  opportunities for all.
