description: |
  About the company

  Our client is a healthcare technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Join a small engineering team as one of its first hires and
  take ownership of product features from initial definition
  through release. The role is mostly hands-on coding, paired
  with real input into product direction and design decisions.

  What you'll do

  - Take features from early definition and design through
    backend build and release.

  - Build and expand core server-side systems from the ground
    up.

  - Work day to day with the technical lead to plan and deliver
    rapidly rising priorities.

  - Split time roughly evenly between writing code and shaping
    product direction, using AI tools to increase output.

  Requirements

  What we're looking for

  - 1 to 3 years of professional software engineering
    experience.

  - A bachelor's degree in computer science or a related field.

  - Very strong backend engineering skills, with a record of
    owning systems end to end and shipping production code
    quickly.

  - Hands-on experience building product features powered by AI
    or large language models.

  - Comfort taking broad ownership of a product, including
    design, product decisions and customer conversations.

  Bonus points

  - Prior startup experience.

  - Experience building and growing personal projects or side
    products to meaningful revenue.

  - An undergraduate computer science or electrical engineering
    degree from a leading university.

  Benefits

  Compensation and benefits

  - Base salary: USD 160,000 to 220,000 per year

  - Equity

  Location and work model

  - New York, NY, United States

  - On-site, 5 days in-office per week

  - Full-time
