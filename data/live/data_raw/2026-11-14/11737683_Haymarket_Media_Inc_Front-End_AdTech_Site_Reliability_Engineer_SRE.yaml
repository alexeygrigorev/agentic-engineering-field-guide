description: |
  Front-End & AdTech Site Reliability Engineer (SRE)

  Haymarket Media, Inc. is seeking a Front-End & AdTech Site
  Reliability Engineer (SRE) to join the Engineering team.
  This position is located in our New York, NY office; three
  (3) days in office depending on business needs.

  Job Overview:

  A Haymarket Front-End & AdTech Site Reliability Engineer
  (SRE) is a specialized engineer who bridges the gap between
  high-performance client-side code and modern cloud
  infrastructure. In this role, you will own the reliability
  and performance of our user-facing Vue 3 applications,
  headless WordPress architectures, and complex AdStack,
  balancing programmatic monetization via Prebid.js against
  Core Web Vitals. In this hands-on role you will ensure our
  web ecosystem is fast, resilient, and optimized at the edge.

  Responsibilities:

  Lead development team initiatives to:

  - Architect and maintain Cloudflare CDN capabilities (Cache
    Rules, WAF, Page Rules) to maximize cache-hit ratios.
  - Build and deploy serverless solutions using Cloudflare
    Workers for edge routing and asset optimization.
  - Own zero-downtime CI/CD pipelines (e.g., GitHub Actions,
    GitLab CI) for Vue 3 applications and WordPress.
  - Manage GCP infrastructure (Cloud Run, GKE) to ensure
    scalability and cost-efficiency.
  - Optimize client-side monetization architecture (Prebid.js)
    to minimize bundle size and auction latency.
  - Implement OpenTelemetry (OTel) for end-to-end tracing and
    monitoring of core performance metrics (LCP, INP, CLS).
  - Lead blameless post-mortems for performance degradations and
    outage incidents.

  Skills and Requirements:

  Qualifications include:

  - Minimum of 3+ years, but ideally 6+ years of experience in
    SRE, DevOps, or Performance-focused Engineering.
  - Proficiency in Vue 3 (Composition API) and build tools like
    Vite.
  - Deep understanding of WordPress architecture and the WP REST
    API/GraphQL.
  - Hands-on experience managing Cloudflare (including Workers
    for senior roles).
  - Comfort with GCP (Cloud Run, Storage, GKE) and Terraform.
  - Practical experience with Prebid.js and Google Ad Manager
    (GAM).
  - Familiarity with OpenTelemetry for distributed tracing.
  - Bachelor’s degree in a related field

  Nice To Have Skills

  - Experience with hybrid bidding strategies or Prebid Server
    migration.
  - Advanced Linux system administration.
  - Experience mentoring teams on performance culture.

  Special Instructions:

  - A cover letter and code samples are required

  What We Offer:

  - A competitive compensation package
  - The salary range for this position is $150,000 to $160,000.
    Compensation will be commensurate with experience, skill
    level, functional and/or industry knowledge, education
    level, certifications, as well as other qualifications.
  - Paid annual vacation, holiday and sick time off
  - Comprehensive health plans including medical, dental and
    vision
  - Competitive 401(k) investment options and generous company
    matching program
  - Life insurance
  - Commuter benefits
  - Employee referral awards
  - Tuition reimbursement
  - Training opportunities through industry-recognized programs
  - A creative and passionate workplace and a fun, collaborative
    team environment
  - Three Week “Work from Anywhere” benefit, to ensure work life
    balance

