description: |
  AHEAD builds platforms for digital business. By weaving
  together advances in cloud infrastructure, automation and
  analytics, and software delivery, we help enterprises
  deliver on the promise of digital transformation.



  At AHEAD, we prioritize creating a culture of belonging,
  where all perspectives and voices are represented, valued,
  respected, and heard. We create spaces to empower everyone
  to speak up, make change, and drive the culture at AHEAD.



  We are an equal opportunity employer, and do not
  discriminate based on an individual's race, national origin,
  color, gender, gender identity, gender expression, sexual
  orientation, religion, age, disability, marital status, or
  any other protected characteristic under applicable law,
  whether actual or perceived.



  We embrace all candidates that will contribute to the
  diversification and enrichment of ideas and perspectives at
  AHEAD.

  AHEAD is on the hunt for an exceptional Senior Software
  Engineer to help build Hatch, our flagship platform. We’re a
  leading IT services provider, trusted by some of the world’s
  largest companies to design, build, run, and modernize their
  most important technology across cloud, data, AI, and
  security.

  Hatch is an advanced platform for IT lifecycle management,
  renewal, procurement, and logistics, giving enterprises
  real-time visibility and control over their IT assets,
  orders, contracts, and inventory across thousands of sites.
  Unity, its sibling platform, extends those capabilities to
  streamline our own operations and service delivery. You’ll
  join a progressive engineering team that lives on the
  forefront of technology. We build real products, adopt new
  tools early, sweat the details, and trade ideas constantly.
  You will learn here, and you’ll have the autonomy to make a
  visible impact fast.

  We’re far less interested in the languages on your résumé
  than in how you think. You’ll own meaningful problems end to
  end, starting from the user and the business outcome. You’ll
  design, build, and ship full-stack solutions, make sound
  architectural calls, and stay accountable for quality from
  first commit to production. Our stack today is Elixir and
  Phoenix, but we care far more that you can pick up whatever
  a problem demands and bring strong engineering judgment to
  it.

