description: |
  Who we’re looking for

  As a Senior Backend Engineer, you’ll be joining an impactful
  team of highly skilled engineers who are building the core
  platform features and services to fuel our rapidly growing
  company! As a team, we are always working to continuously
  improve both our product and our craft. The Backend team
  will focus on developing world-class services and
  integrations, all the while ensuring to keep our apps
  secure, high-performing, and most importantly scalable
  (we’re growing!). We’re looking for our next Sr. Backend
  Engineer to come in and be excited to take the lead in
  planning and developing the architecture for future critical
  systems to the Fieldwire Platform, while keeping our current
  customers in production happy!

  What you’ll be doing

  The primary responsibilities for our Sr. Backend Engineers
  are to:

  - Design, build, and maintain our production services at scale
  - Debug production issues across services and multiple levels
    of the stack to deliver an amazing user experience
  - Develop seamless integrations between Fieldwire and external
    services and partners to allow our customers to get the
    most out of our platform
  - Lead technical architecture discussions and help drive
    technical decisions for the team
  - Leverage your senior experience to mentor other engineers on
    best practices
  - Improve Fieldwire’s engineering standards, tooling, and
    processes
  - Release a rapidly growing API while ensuring 100% backward
    compatibility
  - Build services with efficient auto-scaling to handle both
    peak and non-peak loads
  - Architect end to end systems to enable syncing large volumes
    of data in real time

  At Fieldwire, we’re looking for our Sr. Backend Engineers to
  have the following skills and experiences:

  - Bachelor’s or Master’s degree in Computer Science or
    equivalent work experience
  - 5+ years of production web application experience
  - Expert at modern web application development and relational
    databases
  - Writing clean, well-tested, and modular code that you know
    your colleagues can also own, understand, and maintain
  - Deep understanding of algorithms and data structures

  And if you have any of the following, we REALLY want you to
  apply today!

  - Experience with Ruby on Rails and its ecosystem
  - Previously have worked with high-traffic web applications
    and services
  - Well-versed with Docker and containerization
  - Familiarity with AWS

  Compensation:

  The estimated pay ranges for this role are as follows:
  $170,000.00 - $195,000.00

  The salary range represents the low and high end of the
  salary range for this job in the US. Minimums and maximums
  may vary based on location. The actual salary offer will
  carefully consider a wide range of factors such as your
  skills, qualifications and experience. In addition to the
  salary you may be eligible for a corporate bonus which can
  range up to 30%.

  Why Fieldwire?

  The field-first construction platform for less busywork and
  more building. Trusted on 4M+ projects worldwide, Fieldwire
  by Hilti gives crews reliable access to plans, tasks, and
  updates on one simple platform. It unites the field and
  office around a single, transparent source of truth, keeping
  teams aligned from start to finish. Designed for easy
  adoption, crews gain real-time visibility into progress,
  clear ownership of work, and the context to make confident
  decisions. As part of the Hilti Group, Fieldwire combines
  deep construction expertise with modern digital innovation
  to deliver better outcomes on every job. Learn more at
  Fieldwire.com.

  Where is the job located?

  This role is fully remote within the US or in beautiful San
  Francisco, CA. Our office is located right off of Montgomery
  Bart station. Easily accessible by all forms of public
  transportation.

