description: |
  About us:

  ether.fi is one of the largest crypto companies in the
  world. We have over $5B in assets under management and a
  team of 30 almost all technical staff. We’ve been profitable
  day one and are focusing on building real consumer
  applications.

  The future we envisage is true on-chain banking. Our current
  products; Stake, Liquid, and Cash enable users to earn yield
  in a variety of DeFi strategies, and spend their assets in
  the real world with our credit cards. You can view public
  analytics on Dune for Cash and Stake.

  Position overview:

  As an Senior Frontend Engineer, you will form a key part our
  engineering team focusing on shaping the parts of our
  platform users rely on every day. You’ll be working directly
  with our designers to go from Figma to clean UX for our
  users.

  What you’ll do:

  - Work alongside other engineers to ship high quality code and
    ensure engineering excellence
  - Plan out complex front-end components and maintain our core
    products
  - Build DeFi integrations to allow users to sign transactions
    and manage their funds client-side
  - Ensure security best practice on our front-end codebase,
    assist with large refactor efforts

  What we are looking for:

  - Strong fundamentals in software engineering and problem
    solving
  - Taste, and an eye for detail.
  - You have shipped impressive products with thousands of real
    users
  - 3+ years of professional coding experience
  - Drive, willingness to work hard and go the extra mile. We
    are a highly ambitious, driven team with audacious goals,
    and we work very hard to make them a reality
  - Plus if you are experienced in web3

  Perks and benefits:

  - Competitive salary, performance-based incentives, and token
    allocation grant
  - Opportunity to work on multi-billion dollar products as part
    of a small team
  - Health, dental, and vision insurance plans
  - Global team with opportunity for travel and working out of
    our 3 offices around the world
  - 4 weeks work from anywhere
  - Exciting company events and team-building off-sites
