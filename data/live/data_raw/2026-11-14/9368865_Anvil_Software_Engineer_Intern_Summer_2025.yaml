  founding team (ex-Google, YC) on everything from frontend UX
  to backend services and AI features. You'll ship fast, learn
  a ton, and help shape a new category.

  What We're Looking For

  - Strong CS fundamentals
  - Experience with Java and TypeScript
  - Prior internship at a FANG company or Series B+ startup
  - Willingness to work hard and own real product
  - Code quality matters to you

  Nice to Have

  - Familiarity with React and Spring Boot
  - Interest in AI, LLMs, or SEO

  What You’ll Get

  - Mentorship from ex-Google founders
  - Hands-on experience across the stack
  - A fast-moving, high-bar environment
  - A shot to build something foundational in a brand new space

  Logistic

  - Pay range is $30 - $40 an hour
  - Must be in New York City
  - Dates are mid June to end of August, flexible.
