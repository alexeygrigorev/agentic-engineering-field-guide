description: |
  About Scrumconnect Consulting

  Scrumconnect Consulting is a multi-award-winning digital
  consultancy, recognised for delivering impactful and
  innovative technology solutions across UK government
  departments. Our work has positively influenced the lives of
  over 40 million UK citizens.

  We are passionate about user-centred design, agile delivery,
  and building digital services that make a real difference.
  Our teams work at the forefront of innovation, helping
  organisations transform and deliver high-quality, scalable
  solutions that truly matter.

  We are looking for a Power Platform Software Developer to
  lead the build of prototypes and proofs of concept during a
  short discovery. You will turn discovery findings and
  architecture decisions into working service-desk and chatbot
  demonstrations, and guide a more junior developer.

  What you will do

  - Lead the design, configuration and development of the
    discovery prototypes.
  - Turn prioritised requirements and architecture decisions
    into a focused technical backlog.
  - Design the prototype's solution structure, data model,
    components and development standards.
  - Build or direct the build of a structured request intake
    form; service-desk queues, agent views and request
    statuses; service level and deadline tracking; dashboards
    and reporting; approval and escalation workflows; and a
    chatbot or guided interaction for a document submission
    scenario.
  - Implement automated checks for content quality and
    submission completeness, such as formatting errors,
    missing source data, raw links, incomplete footnotes and
    deadlines below the agreed standard.
  - Apply security roles, error handling, auditability and
    configuration management.
  - Work with the architect to validate integration, security,
    deployment and support assumptions.
  - Provide technical direction, quality assurance and peer
    review for the junior developer.
  - Demonstrate progress at the end of weeks two and three, and
    incorporate stakeholder feedback.
  - Document prototype limitations, technical debt, reusable
    components and what is needed to move to production.
  - Contribute to effort estimates, implementation phases and
    the recommended future delivery team.

  Expected outputs

  - A working or demonstrable service-desk prototype.
  - A working or demonstrable chatbot scenario.
  - Configured workflow, status, service level, escalation and
    dashboard examples.
  - Technical build documentation and demonstration material.
  - An assessment of prototype limitations and what production
    would need.
  - Development estimates and implementation recommendations.

  What you will bring

  - Strong hands-on experience building solutions on Microsoft
    Power Platform.
  - Advanced knowledge of Power Apps, Power Automate and
    Dataverse.
  - Experience building workflow, case management, request
    management or service-desk solutions.
  - Experience building chatbot capabilities, ideally with
    Microsoft Copilot Studio.
  - Strong understanding of data modelling, connectors, APIs,
    security roles, solution layering and environment
    management.
  - Ability to balance delivery speed with enough technical
    quality for a credible proof of concept.
  - Experience leading developers, setting standards, running
    reviews and resolving blockers.
  - Ability to demonstrate solutions clearly to product,
    operational and senior stakeholders.
  - Experience documenting the gap between a prototype and a
    secure, supportable live service.

  Desirable

  - Experience with Dynamics 365 Customer Service, Power Pages,
    Power BI, SharePoint, Azure Functions or Azure API
    Management.
  - Knowledge of Power Platform ALM, including managed
    solutions, pipelines, connection references and
    environment variables.
  - Microsoft PL-400 (Power Platform Developer Associate)
    certification.
  - Experience delivering within a UK government department.

  Diversity and Inclusion

  At Scrumconnect Consulting, we believe that diversity drives
  innovation and better outcomes. We are committed to
  fostering an inclusive environment where every individual is
  valued, respected, and supported.

  We welcome applications from candidates of all backgrounds
  and actively encourage individuals from underrepresented
  groups, including women, people with disabilities, and
  diverse communities, as well as those seeking flexible
  working arrangements.

  As a Disability Confident Level 1 employer, we are committed
  to providing reasonable adjustments throughout the
  recruitment process and during employment to ensure equal
  opportunities for all.
