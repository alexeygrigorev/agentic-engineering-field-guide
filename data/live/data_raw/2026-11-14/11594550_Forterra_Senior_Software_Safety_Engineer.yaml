description: |
  About Forterra At Forterra, we are unleashing autonomy at
  scale to transform the battlefield. Our mission is to build
  the foundational platforms that enable an intelligent
  ecosystem to coordinate, adapt, and execute with speed and
  precision even in the uncertainty and disruption of modern
  conflict. In an era marked by rapid technological change and
  evolving threats, we design for flexibility, survivability,
  and operational dominance.

  Forterra delivers weapons, sensors, and battlefield effects
  through integrated autonomous networks reaching operational
  areas faster, safer, and without placing human lives at
  risk. Our systems operate with distributed control, dynamic
  routing, and real-time responsiveness, enabling sustained
  advantage across complex mission environments.



  About the role

  At Forterra, we're developing the future for Ground Based
  Autonomy. Forterra is seeking a Senior Software Safety
  Engineer to join our Safety team and drive efforts in the
  development of safety-critical autonomous systems. This role
  is crucial in evolving our Software Development Assurance
  process, focused on advanced technologies to support our
  safety assured solutions.

  As a Senior Software Safety Engineer, you will be a part of
  the Core Systems & System Safety team. Our Team is
  responsible for architecting systems which support safety-
  critical functions, establishing development methodologies
  for new technologies, and applying cutting edge hazard
  analysis techniques.

  As part of an experienced multi-disciplinary team, you will
  contribute to expanding ground based autonomous operational
  and functional capabilities. Your professional experience in
  software engineering and system safety will further
  strengthen the team's ability to support the Warfighter. You
  will collaborate with members from other groups within
  Forterra to ensure the safety of innovative solutions for
  uncrewed ground vehicle operation

  What you'll do

  In your role as a Senior Software Safety Engineer, you will
  contribute to the development and architectural design
  supporting the delivery of prototypes and safety-critical
  ground based autonomous solutions. You will be responsible
  for performing analyses for hazard identification,
  evaluation and control using quantitative and qualitative
  analysis techniques based on the Software System Safety
  Program Plan and Software Development Plan. You will:

  - Work across Forterra to ensure software development
    processes include safety considerations into our
    autonomous vehicle systems from the ground up – focusing
    on defense applications which follow a MIL-STD-882E
    process.
  - Tackle the topics of functional safety, AI/machine learning,
    embedded systems and software development in a complex
    system environment.
  - Work to define software architecture, safety concepts and
    derive requirements from safety analyses.
  - Incorporate Model-based Safety solutioning across the
    Forterra ecosystem of software solutions.
  - Perform Hazard Analyses within a Model-based Safety
    environment.
  - Perform safety analyses such as:
    - Software Functional Hazard Analysis (FHA),
    - Software Failure Modes and Effect Analysis (FMEA),
    - Failure Modes, Effects, and Criticality Analysis (FMECA),
    - Fault Tree Analysis (FTA),
    - Modes, States and Transitions Hazard Analysis, and
    - Robotic Behavior/Capability Assessments
  - Communicate design considerations and progress with respect
    to software safety across the engineering organization.
  - Develop and refine safety concepts including architectural
    design, safety mechanisms, and Level of Rigor.
    verification activities, to ensure robust safety
    performance.
  - Collaborate with cross-functional teams to develop test
    cases for safety-critical software.
  - Stay informed about industry trends and advancements in
    software safety.
  - Participate in trade studies and testing activities to
    ensure software requirements are met.
  - Participate in Systems Engineering Technical Reviews (SRR,
    PDR, CDR, etc.).
  - Participate in Software System Safety Technical Review Panel
    (SSSTRP), Working Groups and Level of Rigor Audits.
  - Other duties as assigned.

  Minimum Qualifications

  - Bachelor’s degree in Electrical, Software, Systems or
    related Engineering discipline, Computer Science, or a
    related technical field; Master's Degree Preferred.
  - 5-10+ years of work experience as a Software Safety
    Engineer, System Safety engineer or related role focused
    on autonomous or safety critical systems.
  - Specific experience with MIL-STD 882E, JSSSEH, AOP-52 or a
    related software safety standards (e.g., DO-178C, ISO
    26262).
  - Specific experience with Software Development Processes such
    as ASPICE and coding standards (MISRA).
  - Experience with managing requirements (Jama, Doors,
    Polarion) and issue tracking (JIRA).
  - Familiar with the technical principles behind autonomous
    vehicles perception, prediction, path planning, and
    control.
  - Strong analytical skills in linear algebra, geometry, and
    probability.
  - Experience analyzing C/C++ software or other software based
    tools (e.g., SCADE, Simulink) developed for complex
    ecosystems such as RTOS, Complex Microprocessors,
    Hypervisors, etc.
  - Experience supporting and guiding teams through Unit
    Testing, SW Integration Testing, and Embedded SW Testin.g
  - Strong communication skills and the ability to communicate
    complex engineering issues to a diverse team.

  Preferred Qualifications

  - Software or Safety Certifications (ASPICE) or equivalent.
  - Experience with robotics, AI and/or machine learning.
  - Direct experience in the design and development of safety-
    critical software, autonomous vehicles or advanced ADAS
    applications.

  US Salary Range $135,000 - $175,000

  Location

  Remote with up to 25% travel required.



