description: |
  About Axio

  Axio is a growing startup working at the intersection of
  cybersecurity and insurance. The Axio360 platform is a
  decision-making engine for holistic cyber risk management,
  including cybersecurity assessments, cyber risk
  quantification (CRQ),  and cyber insurance analysis.  Axio
  enables enterprises to focus on the most significant risks
  so they can budget wisely, improve cyber resilience, and
  demonstrate duty of care.  Axio raised its Series B funding
  in August 2022.

  We operate under a hybrid model, with approximately 50% of
  the time expected in our NYC office with the specifics to be
  determined in conjunction with your manager.

  Axio does not sponsor applicants for works visas or legal
  permanent residence.

  About the role

  We are looking for a Senior Software Engineer to help with
  our growth in the cyber risk modeling and quantification
  space. Efforts will include building on our core platform to
  support users in quantifying their cyber risk, assessing the
  status of their cybersecurity programs, and analyzing their
  insurance policies.

  What you'll do

  - Guide the architectural decisions and design of software
    solutions, ensuring they are scalable, maintainable, and
    align with business needs.
  - Design, code, and review complex components or features,
    ensuring they meet business requirements.
  - Mentor junior developers, guiding them in their professional
    growth and helping them navigate technical challenges.
  - Collaborate with Product Managers, Designers, and your
    fellow Engineers to refine requirements, aligns goals, and
    deliver a seamless user experience.
  - Focus on developer experience and find automated and non-
    automated solutions to enable the team to ship better
    software.
  - Lead new efforts with a balance of technical expertise and
    on-time delivery.
  - Monitor application health, addressing any issues that
    arise, and ensuring high system uptime.
  - Act as a bridge between technical and non-technical
    stakeholders, communicating complex concepts clearly and
    effectively.

  Qualifications

  - Strong proficiency in web application development, with a
    minimum of 7 recent years of experience
  - 3+ years in a senior engineering role
  - Strong experience with TypeScript and/or JavaScript
  - Familiarity with the React framework
  - Experience with SQL and no SQL Database
  - Experience work on iterative development processes with
    continuous delivery
  - Knowledge of design patterns and system architecture
  - Python experience is a plus

  Required general skills:

  - Self-motivated problem solver
  - Strong communication and collaboration skills
  - Able to work collaboratively on a team including Product
    Managers, Engineers, and Designers
  - Adaptability in a growing and evolving company
  - Dedication and ownership with a solution-oriented mentality

  Benefits

  - Flexible work schedule
  - Hybrid work model with up to 50% of time required in office
  - Target compensation based on experience
  - Equity for well-qualified candidates
  - Comprehensive medical, dental, and vision insurance
  - 401k with employer match
  - Flexible time off policy

  Target Salary Range

  The New York based salary for this full-time position is
  between $110K-$180K. Your exact starting salary is
  determined by a number of factors such as your experience,
  skills, and qualifications. In addition to base salary, we
  also offer a flexible work schedule, competitive equity
  program, a comprehensive benefits package including a 401k
  with employer match, and a flexible time off policy.
