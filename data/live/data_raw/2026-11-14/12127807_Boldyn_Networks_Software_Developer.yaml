description: |
  Greater software infrastructure across the country. Deliver
  the change today.



  Software Developer

  Remote in the US



  About the role



  Passionate about software design? Your next role could
  deliver the software that powers a smart, inclusive, and
  sustainable future for higher education. We’re on the
  lookout for an enthusiastic and personable Software
  Developer who can help us build, support, and enhance the
  software that our college and university customers rely on
  every day.



  What you’ll be doing



  As part of the Managed IT Services team, you’ll be involved
  in the design, development, and support of software
  solutions used across a variety of higher education use
  cases. It’s a role with a lot of variety, and day-to-day,
  you’ll mainly be involved with:

  - Building and maintaining integrations between data systems,
    typically connecting ERP/SIS platforms with SaaS
    applications
  - Developing custom web applications that support specific
    college and university business needs
  - Creating software and solutions that monitor and automate
    our managed hosting services
  - Developing identity management and user provisioning
    automation
  - Supporting, troubleshooting, and enhancing existing
    applications and integrations throughout the software
    development lifecycle
  - Building and maintaining CI/CD pipelines and infrastructure
    as code to deploy solutions across AWS, OCI, Azure, and
    Kubernetes environments
  - Using AI-assisted development tools to improve the speed and
    quality of delivery

  What you’ll bring



  Think you could make a difference here? We’re looking for a
  developer who takes pride in building reliable, well-
  designed software and wants to make an impact from day one.
  You’ll have solid, hands-on experience across the following:

  - Bachelor’s degree from an accredited university in Computer
    Science, Information Technology, or a related field (or
    equivalent experience), with a minimum of 3-5 years of
    experience in professional software development.
  - Strong understanding of the software development lifecycle
    (SDLC).
  - Proficiency in programming and scripting languages: Python,
    Java, SQL, Bash, and PowerShell.
  - Experience with version control using Git.
  - Experience with CI/CD platforms and build and deployment
    automation.
  - Experience developing for the cloud on AWS, OCI, or Azure,
    including containerized workloads on Kubernetes.
  - Experience with infrastructure as code tools: AWS
    CDK/CloudFormation and Terraform.
  - Experience using AI-assisted software development tools.

  The following experience is preferred:

  - Experience in higher education, and working with ERP/SIS
    platforms such as Ellucian Banner.
  - Experience with web development and user interface design,
    including frameworks such as React.



  About us

  At Boldyn Networks, we’re reimagining the future of
  interconnectivity. Our network solutions are solving some of
  tomorrow’s greatest challenges. We are one team across the
  globe. Always listening. Learning. We value different
  perspectives and challenge each other to be our best. Here,
  you can change lives today and create a better tomorrow.

  Why work with us?



  We’re large enough to deliver and maintain large-scale
  operations, giving you the opportunity to work on exciting
  projects and expand your skills. You’ll be surrounded by
  talented colleagues who thrive on solving problems, just
  like you. Together, you’ll make your mark on projects that
  matter and find new strengths along the way.

  We also offer:

  - Salary: $110,000 - $130,000 per year

  - Annual bonus
  - Learning Development Opportunities
  - Flexible working opportunities
  - Competitive benefit packages
  - Paid Parental Leave
  - Vacation starting at 15 days and increasing with length of
    service
  - 10 days paid sick leave
  - 4 days off each year to volunteer



  Ready to apply?



  Are you ready to create an impact that will last for
  generations? Join us at Boldyn Networks today. Hit apply and
  follow the instructions to get started.



  Diversity & Inclusion



  We celebrate diversity in all its forms. Our backgrounds,
  perspectives, and experiences make us stronger. We welcome
  applications from all individuals regardless of race, age,
  gender, background, or religion. Together, we’ll solve
  customer challenges in the smartest ways possible.
