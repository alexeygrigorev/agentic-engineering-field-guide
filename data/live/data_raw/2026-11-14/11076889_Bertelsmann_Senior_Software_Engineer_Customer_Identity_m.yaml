description: |
  Company Description

  Everyone’s story matters. Come shape your story with us at
  Riverty. But where does that take you?

  To one of our 30 hybrid workspaces – designed for exchanging
  ideas, learning from others, and shaping the way we work. An
  international community of over 4,000 people, representing
  almost 80 nationalities across 12 countries. United by one
  mission: Combining empathy, advanced technology and data-
  driven insights to keep people and businesses in flow. With
  payments made for them. So that they don’t have to worry
  about it.

  And there’s more. We are part of the family-owned
  Bertelsmann group. Established. Corporate. In a fast-paced
  industry. We enable flexible payments in various industries,
  simplifying the financial management of known brands and
  helping people repay debt to build financial confidence. In
  short: shaping FinTech.



  Job Description

  We are looking for a

  (Senior) Software Engineer (m/f/d)

  (unlimited, full-time) to join our team located in Tallinn,
  Berlin or Stockholm



  In this role, you will be a software development expert in
  an agile product development team, building and maintaining
  Riverty's Customer Identity Platform.

  The Customer Identity Platform enables millions of consumers
  to securely use Riverty products, while providing seamless
  technical integration and frictionless user experience.
  Customer Identity Team is responsible for identifying or
  authenticating good consumers while recognizing and blocking
  bad actors to protect our consumers, merchants, partners,
  and Riverty from fraud.



  On a daily basis you will

  - Design, develop, test, document, and operate robust,
    maintainable software for the Customer Identity Platform.
  - Participate in the end-to-end product development process
    and help the team ensure value, usability, feasibility,
    and viability.
  - Collaborate as needed with product managers, designers,
    architects, and other roles to discover the right
    solutions.
  - Monitor system health and application metrics for our live-
    critical platform. Investigate and resolve incidents as
    needed.
  - Identify issues, suggest improvements to new and existing
    features, and present ideas for solutions. Take initiative
    to improve quality across accessibility, performance,
    consistency, maintainability, and robustness.
  - Seek out, evaluate, and recommend new technologies and
    concepts, helping bring industry standards and best
    practices into our codebase and architecture.



  Qualifications

  You will be a strong fit if you have

  - At least 5 years of professional experience with .NET/C#
    development.
  - Strong expertise in RESTful APIs and backend service design.
  - Experience with microservices architecture, distributed
    systems, and asynchronous/event-driven communication.
  - Solid knowledge of application and information security.
  - Hands-on experience with Azure Cloud, Docker, CI/CD
    pipelines (Azure DevOps), and modern deployment practices;
    familiarity with Kubernetes, MongoDB, and Infrastructure
    as Code is a plus.
  - Hands-on experience with front-end technologies including
    TypeScript (React is a plus), or a strong willingness to
    work full-stack.
  - Openness to participating in on-call rotations.
  - Experience with identity and access management technologies,
    including OAuth, OpenID Connect, Auth0, and PingOne AIC.



  As a person you are

  - Self-driven, proactive, and solution-oriented.
  - Confident in communicating with both business and technical
    stakeholders.
  - Fluent in English.
  - Empathetic, collaborative, and receptive to giving and
    receiving feedback.



