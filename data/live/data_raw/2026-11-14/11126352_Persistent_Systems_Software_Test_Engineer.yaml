description: |
  Job Description & Responsibilities

  Persistent Systems is seeking a Software Test Engineer who
  will be responsible for software testing for our Wave Relay®
  products. This includes providing special analysis required
  for initial software testing, quality assurance, and
  regression testing. The Software Test Engineer will be
  responsible for ensuring that our products meet customer and
  management requirements, as well as Persistent Systems'
  quality standards.



  Position Responsibilities

  - Testing of the software on the entire range of Wave Relay®
    products
  - Development implementation and maintenance of wide range of
    testing such as automated regression and performance
    testing for low-level software, application software and
    hardware development
  - Supporting in-house and in-the-field engineering activities
    including R&D activities and travel to customer sites
  - Integrating other systems, sensors, and components with
    the Wave Relay® system
  - Creating test plans for manual and automated testing

  Job Qualifications & Experience

  Minimum Qualifications

  - Bachelor’s Degree in Computer Science or a related field or
    equivalent experience
  - 2+ years of experience in functional automated testing
  - 2+ years of experience in software development using one or
    more of PERL, Python, Shell Script or similar programming
    languages
  - Strong working knowledge of Linux operating systems,
    command-line interfaces, and scripting
  - Experience participating in software test requirements and
    building software test plans including regression,
    functional, performance, and stress testing
  - Experience with process improvement, including driving and
    enhancing data and process quality
  - Experience with creating test procedures, test plan
    proposals, and generating test result reports
  - Experience with building automated tests, fixed and
    variable, in order to facilitate repeatable, efficient
    software test life
  - Knowledge of wireless communication and networking systems
  - Ability to obtain a US security clearance or already have
    one



  Preferred Qualifications

  - Experience with Cisco and enterprise networking
  - ISO9001:2008 quality system experience

  The base pay for this role can vary from $106,000 to
  $133,000 a year based on individual qualifications.
  Eligibility for yearly discretionary bonus. Persistent
  Systems, LLC offers a comprehensive benefits package
  including medical, dental, vision, life, and disability
  insurance; paid time off (sick time and vacation time);
  flexible spending accounts; 401(k) plan with company match;
  fitness membership reimbursement; tuition assistance; mental
  health benefits; and pet discounts. We will accept
  applications on a rolling basis until the role is filled.

  Company Overview

  Persistent Systems, LLC, a leader in defense technology, has
  been engineering secure Mobile Ad Hoc Networking (MANET)
  solutions since 2007, enabling joint forces and
  multinational coalitions to communicate, collaborate, and
  achieve mission success. Persistent created the Wave Relay®
  Ecosystem, a unified data network for unmanned systems,
  sensors, and software, empowering warfighters to accomplish
  tactical objectives across the operational area.  Built on
  the company’s Wave Relay MANET and Cloud Relay™
  technologies, this ecosystem delivers a global data fabric
  for military, first responders, and commercial users.
  Persistent has offices in New York City, Colorado, North
  Carolina, Montana, North Dakota, and Wyoming.
