description: |
  Beacon is building the essential technology infrastructure
  for the everyday economy: the businesses, organizations, and
  services that make real life work, and that mainstream tech
  has largely left behind. We acquire, operate, and grow
  vertical market software companies. They are niche, founder-
  built businesses serving industries that are often
  overlooked and too profitable to ignore.

  Our model is simple: we seek out founders who have built
  their business by spending years understanding their market
  and prioritizing their customers' specific needs. We buy
  great businesses, invest in their continued growth, and hold
  them permanently, accelerating that growth with an AI-native
  platform built specifically for vertical market software. No
  mandate to cut, flip, or roll up into something
  unrecognizable.

  We are not a financial firm. We are technology entrepreneurs
  and operators who believe the most important businesses in
  the world are already running quietly in industries most
  people never think about. Our job is to find them, support
  the people who built them, and make them better.

  Beacon is backed by a diverse base of investors, with $750M+
  raised to date, including D1 Capital Partners L.P., General
  Catalyst, HarbourVest Partners, Lightspeed and Canada’s
  Intrepid Growth Partners, the family offices of the founders
  of Stripe, DoorDash, and Ramp, and evergreen funds built for
  the long game.

  The Role:

  The companies we own are profitable and their engineering
  teams are small. Two or three people who know the product
  cold and have never had the headroom to move faster.

  You work alongside those companies, in their codebase, with
  their engineers. Not as a consultant, not as a contractor.
  You bring agentic development to teams, you weigh in on the
  decisions that matter, and you leave each team faster than
  you found it. You will carry two or three companies at a
  time.

  What You'll Do:

  - Show a team how to ship a feature in days instead of weeks,
    and stay until they can do it without you.
  - Work a production incident with the team. Find the root
    cause, then fix whatever let it happen.
  - Review the design for the next big piece of work before
    anyone writes code.
  - Interview candidates for a company that has never run a
    hiring process.
  - Find the manual process eating a GM's week and automate it
    away.

  What We Are Looking For:

  - 5+ years of experience across several stacks. Religious
    about none of them.
  - Judgment that does not need a committee. You are often the
    only Beacon person in the room.
  - A nose for what matters. You can tell which roadmap item
    pays for the other nine.
  - Initiative. Nobody hands you a backlog. You find the work.
  - Comfort with context switching - you may work with 3+
    companies in a given week.
  - Easy to work with. The engineers you support do not owe you
    their trust. You earn it.
  - Daily use of AI coding tools, and the ability to teach them
    to someone else.

  Our Values at Beacon Software

  - Humility: We acknowledge that the path to getting to the
    right answer involves being wrong along the way. We have
    strong beliefs which are weakly held. We actively seek new
    ideas and believe we can learn from anyone at any time.
  - Honesty: We are truth seeking in our approach to business
    problems. Business is a repeat game and we believe that
    human relationships generate alpha. We understand that
    trust is earned over a lifetime and can be lost in an
    instant.
  - Hunger: We play to win. We hold ourselves to high standards
    and will not be outworked. We take pride in having a deep
    sense of responsibility to ourselves, each other, our
    partners, and our customers. We believe to whom much is
    given much is expected.
  - Horizon: We seek to build a generational software company.
    This will take decades. We manage our expectations and
    those of our partners to take advantage of the 8th wonder
    of the world - compounding growth.

  How We Use AI in Our Hiring Process: To ensure transparency,
  we want candidates to know that Beacon Software uses
  Artificial Intelligence and AI-enabled tools to assist with
  screening, reviewing, organizing and highlighting profiles
  and applications that match the key requirements for each
  role.



  AI does not make hiring decisions: Every application is
  reviewed by a member of our team, and all decisions
  throughout the process are made by humans. We use AI to
  support efficiency and consistency, not to replace human
  judgment. We are committed to a fair, thoughtful, and
  equitable experience for every candidate.
