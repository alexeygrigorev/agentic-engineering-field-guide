description: |
  Location: Remote – Latin America (Open to applicants located
  anywhere in the LATAM region)

  Fueled is a leading digital strategy, design, and
  engineering agency. We are a 300+ person team that has
  designed and built hundreds of digital products and
  experiences for brands like Google, Apple, The New York
  Times, ESPN, Victoria's Secret, MGM Resorts, Albertsons, and
  CLEAR.

  As a Full Stack Web Engineer at Fueled, your mission is to
  turn well-defined tickets and user stories into clean,
  production-ready code that powers large-scale digital
  experiences. Working within enterprise WordPress
  engagements, you'll build and deliver features end-to-end,
  from the frontend experience to modern PHP, JavaScript, and
  Gutenberg blocks in React.js. You'll bring designs and
  requirements to life within themes and plugins, moving
  quickly and confidently by pairing your own craft with AI-
  assisted workflows, thorough documentation, and the support
  of senior engineers who review and elevate your work.

  This is a role for engineers who love the craft: you write
  code you're proud of, you welcome sharp code review, and you
  treat AI tools as a force multiplier, not a substitute for
  understanding. You should be comfortable taking a feature
  from requirements through implementation, making sound
  decisions along the way, and delivering a polished,
  production-ready result. Your work will ship to platforms
  serving millions of visitors, alongside a team recognized as
  one of the top enterprise WordPress practices in the world.

  Intentionally remote, our team thrives in a culture that
  values flexibility, creativity, and cutting-edge technology.
  For engineers in Latin America, that means real-time
  collaboration with US-based teams during your normal working
  day, compensation in USD, and a seat at the table on
  projects for globally recognized brands – all from wherever
  you work best. Together, we're shaping the future of digital
  experiences.

  What you will do:

  - Build features for enterprise-level WordPress solutions –
    custom Gutenberg blocks in React.js, plugins, and themes
    using modern HTML/CSS and well-structured PHP.
  - Own tickets end-to-end: understand the requirements, make
    sound decisions when details are incomplete, and deliver
    reviewable pull requests with clear summaries of your
    approach, assumptions, and testing.
  - Bring designs and user experiences to life by translating
    Figma designs and other project requirements into
    polished, responsive features and reusable components
    within WordPress themes and plugins.
  - Leverage AI tools as a core part of your daily workflow to
    accelerate implementation and debugging while critically
    validating every output before it reaches a pull request.
  - Iterate on code review feedback from senior and lead
    engineers, absorbing patterns and best practices that
    sharpen your craft with every merge.
  - Collaborate proactively and asynchronously in English with
    distributed teammates across engineering, design, and
    delivery.

  What you will achieve:

  - Within your first month, you'll have shipped merged,
    production-ready pull requests on a live client project,
    demonstrating that you can take written direction and run
    with it.
  - By the 3-month mark, you'll be independently owning tickets
    from requirement to release, with review cycles getting
    shorter as your grasp of our conventions deepens.
  - Your AI-assisted workflow will have measurably accelerated
    delivery on your project – without ever compromising the
    quality bar our clients expect.
  - You'll have earned the trust of your engineering leads as a
    dependable contributor whose PRs are a pleasure to review.
  - By the end of your contract, you'll have a portfolio of
    enterprise-grade work, sharpened skills, and a standing
    invitation for future collaboration.

  About you:

  - You have solid agency or consultancy experience building
    WordPress solutions for large-scale, enterprise projects –
    high-traffic sites, demanding clients, real deadlines.
  - You're comfortable working across the web stack, including
    HTML, CSS, modern PHP, JavaScript, and the Gutenberg
    ecosystem, including building custom blocks with React.js.
    Bonus points if you've worked with our open-source tools,
    like ElasticPress or ClassifAI – tell us about it in your
    application.
  - AI tools are already part of how you work: you use them to
    move faster, and you know exactly when they're wrong.
  - You're passionate about sharpening your craft – you read
    best practices for fun, seek out code review, and never
    ship code you don't understand.
  - You communicate clearly in English, both written and spoken,
    and can confidently walk a reviewer through your
    decisions, assumptions, and tradeoffs.
  - You're based in Latin America, and thrive on a distributed
    team, collaborating in real time with US time zones from
    the remote location of your choice.

  Contractor Fee

  Compensation is determined based on a variety of factors
  including relevant experience, projects, geographic
  location, and business needs. Contractor fees are paid in
  USD.

  Join our Contractor Pool

  This role is designed as a contract position, offering you
  the opportunity to experience our team and culture while
  showcasing your contributions. When the fit and business
  needs align, some contractors are invited to explore a
  transition into full-time roles.

  If you are passionate about Fueled's mission and think you
  have what it takes to be successful in this role, even if
  you don't check all the boxes – please apply. We'd
  appreciate the opportunity to review your application.
  Everyone gets a response.

  Upon meeting the necessary criteria, you'll join the Fueled
  contractor network, granting you access to project
  invitations tailored to your expertise and availability when
  they arise.

  Any data provided will be processed in accordance with
  applicable law and our privacy policy. Curious about what to
  expect during our talent process? Check it out here.
