description: |
  About Us:

  Foundation AI is the only AI Native documents intake
  automation platform serving the claims and litigation
  industries. Founded in 2019 by a team of lawyers and data
  scientists, Foundation AI processes millions of documents
  each month for hundreds of US law firms, including many of
  the largest and most respected plaintiff and injury law
  firms in the country. Find out more at www.foundationai.com.



  Job Overview:

  We're looking for a Senior Software Engineer to join a
  rapidly growing SaaS company that is building next-
  generation, AI-driven platforms. In this role, you'll
  combine hands-on coding with technical leadership, mentoring
  other engineers and shaping the direction of complex, highly
  scalable systems.

  You'll work cross-functionally with Product, Design, and
  DevOps teams to deliver secure, reliable, and performant
  features while fostering a culture of innovation and
  engineering excellence.

  Key Responsibilities:

  - Backend Development: Design, develop, and maintain high-
    performance, scalable backend applications using Python.
  - Technical Leadership: Mentor engineers, promote continuous
    learning, and establish engineering best practices.
  - System Architecture: Define and implement scalable,
    maintainable, and reliable system architectures.
  - Performance Optimization: Identify and resolve application
    and infrastructure bottlenecks to improve performance.
  - Code Quality & Testing: Champion code reviews, automated
    testing, code coverage, security standards, and clean
    coding practices.
  - Cross-functional Collaboration: Partner with Product,
    Design, and DevOps teams to deliver features through Agile
    development cycles.
  - CI/CD & Automation: Improve CI/CD pipelines, deployment
    processes, and automation to enable faster and more
    reliable releases.
  - Documentation: Maintain technical documentation covering
    system architecture, services, and key engineering
    decisions.

  Responsibilities may be tailored based on the candidate’s
  experience and proficiency.



  Skills and Tools:

  - Experience: 5+ years of software development experience,
    with strong hands-on backend engineering expertise.
  - Programming & Development: Strong proficiency in Python and
    modern frameworks such as Flask, FastAPI, and Django;
    experience building scalable backend applications and REST
    APIs.
  - Cloud & Infrastructure: Hands-on experience with AWS, GCP,
    or Azure; proficiency in Docker, Kubernetes, and Git.
  - Databases & Messaging: Strong knowledge of PostgreSQL or
    relational databases; experience with messaging and
    asynchronous systems such as RabbitMQ, Kafka, or similar.
  - Architecture & System Design: Experience designing scalable,
    distributed, and maintainable systems with a focus on
    performance, reliability, and security.
  - Testing & Code Quality: Experience implementing unit and
    integration testing frameworks, code coverage, automated
    testing, and quality standards.
  - DevOps & CI/CD: Experience building and improving CI/CD
    pipelines, deployment automation, and release management
    processes.
  - Observability & Monitoring: Familiarity with monitoring,
    logging, and observability tools to identify and
    troubleshoot system issues.
  - Problem-Solving & Performance Optimization: Strong debugging
    skills and the ability to identify bottlenecks and
    optimize application and infrastructure performance.
  - Collaboration & Leadership: Experience mentoring engineers,
    conducting code reviews, and working in Agile/Scrum
    environments.
  - Additional Skills: Exposure to workflow orchestration tools,
    asynchronous task processing, and distributed system
    monitoring is an added advantage.



  Our Commitment:

  Foundation AI is an equal opportunity employer committed to
  diversity and inclusion in the workplace. We prohibit
  discrimination and harassment of any kind based on race,
  color, sex, religion, sexual orientation, national origin,
  disability, genetic information, pregnancy, or any other
  protected characteristic. Our hiring decisions are based
  solely on qualifications, merit, and business needs at the
  time.

  For any feedback or inquiries, contact us at:
  careers@foundationai.com Learn more about us:
  www.foundationai.com
