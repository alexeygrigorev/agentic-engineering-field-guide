description: |
  About Avoca

  Avoca is transforming how home service companies engage with
  their customers. Our AI-powered conversational agents handle
  every high-value inbound call, from booking jobs, qualifying
  leads, and driving higher revenue, all at a speed and
  consistency unmatched by human call centers.

  We're a Series B startup backed by Kleiner Perkins, Meritech
  Capital, General Catalyst, and other top-tier investors,
  with $125M raised and a $1B valuation. We grew 10x in 2025
  and have scaled to 170+ employees in under two years across
  our NYC headquarters and Santa Barbara office.

  In a $1T+ market where 85% of missed calls go to
  competitors, we're building the category-defining platform
  for AI-driven customer engagement, serving the largest
  brands in home services. With high-energy, in-office teams
  in both locations, every hire here has an immediate and
  visible impact.

  About the Role

  We’re looking for Product Engineers who thrive at the
  intersection of engineering and product thinking. You’ll own
  features end-to-end—design, build, launch, and iterate—while
  obsessing over the customer experience and measurable
  outcomes. Your work will directly shape how thousands of
  customers interact with our AI-powered customer service
  platform.

  What You’ll Do

  - Own feature development from backend services to AI-powered
    user experiences.
  - Turn customer feedback into product improvements through
    rapid iteration and experimentation.
  - Collaborate closely with Product, Customer Success, and GTM
    teams to align engineering decisions with business
    outcomes.
  - Hold a high bar for code quality testing, monitoring, and
    reliability are second nature.
  - Prioritize ruthlessly and navigate changing requirements
    with autonomy.

  What You'll Bring

  - 2+ years of full-stack engineering experience. We are open
    to hiring mid-level, senior-level and staff-level
    candidates for this role.
  - Computer Science, Computer Engineering, Electrical
    Engineering degree or equivalent experience.
  - Strong familiarity with AI, LLMs, or AI-assisted systems or
    a willingness to learn fast.
  - Outcome-driven mindset: you measure success in impact, not
    just shipped features.
  - Comfortable collaborating across engineering, product, and
    customer-facing teams.
  - Low ego, high energy, resilient in a fast-paced environment.
  - Bonus: prior startup, hacker, or founder experience.
  - Eagerness to work in person with us in NYC full time.

  Benefits

  - Comprehensive medical, dental, and vision insurance
  - Company-sponsored 401(k) through Vestwell
  - Flexible PTO plus U.S. federal holidays
  - Monthly wellness stipend
  - Daily in-office lunch through Parkday
  - Dinner covered when working late
  - Commuter benefits
  - Standing desks and workspace accommodations available on
    request
  - All core tools and software provided

  Why Avoca

  At Avoca, you’ll be part of a team that’s building a
  category-defining company at the center of a massive market
  opportunity. We’re a fast-moving, collaborative team with a
  culture designed for builders who thrive on speed,
  iteration, and impact.

  Avoca provides equal employment opportunities to applicants
  and employees without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  protected veteran status, or disability.
