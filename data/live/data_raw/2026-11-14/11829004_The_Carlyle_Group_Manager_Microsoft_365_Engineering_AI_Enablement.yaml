description: |
  Company Profile

  The Carlyle Group (NASDAQ: CG) is a global investment firm
  with $485 billion of assets under management, across 678
  investment vehicles as of June 30, 2026. Founded in 1987 in
  Washington, DC, Carlyle has grown into one of the world's
  largest and most successful investment firms, with more than
  2,500 professionals operating in 28 offices in North
  America, Europe, the Middle East, Asia and Australia.

  Carlyle’s purpose is to connect people, ideas, and capital
  to fuel growth for companies and performance for investors,
  which range from public and private pension funds to wealthy
  individuals and families to sovereign wealth funds, unions
  and corporations. Carlyle invests across three segments –
  Global Private Equity, Global Credit and Carlyle AlpInvest –
  and has deep expertise across industries, markets, and
  geographies.

  At Carlyle, we believe that a wide spectrum of experiences
  and viewpoints drives performance and success. Our CEO,
  Harvey Schwartz, has stated that, "To build better
  businesses and create value for all of our stakeholders, we
  are focused on assembling leadership teams with the
  strongest insights from a range of perspectives." Reflecting
  this view, emphasis is placed on development, retention and
  inclusion through our internal processes and seven Employee
  Resource Groups (ERGs). We cultivate a culture where ideas
  are openly shared and challenged, connecting diverse
  expertise and perspectives to drive enduring value.

  Position Summary

  We are seeking a hands-on, technical Microsoft 365 engineer
  that can evaluate, design, deliver, and operate secure,
  scalable solutions across Microsoft 365 and Power Platform.
  Reporting to the Head of M365 Engineering, the role leads
  defined workstreams and projects from design through
  adoption, builds automation and AI-enabled solutions that
  improve employee productivity and platform operations, and
  partners closely with Cloud, Enterprise AI, Security, IAM,
  Legal & Compliance, and business technology teams.

  In-Office Requirement: 4 days per week

  Primary Responsibilities

  Microsoft 365 Engineering & Delivery

  - Design, configure, administer, and continuously improve
    Microsoft 365 services, including Exchange Online, Teams,
    SharePoint Online, OneDrive, Copilot for Microsoft 365,
    and related capabilities across Intune, Defender, and
    Purview.
  - Lead Microsoft 365 and Power Platform projects and
    workstreams end-to-end, including requirements, solution
    design, planning, stakeholder communication, testing,
    rollout, adoption, operational readiness, and post-launch
    support.
  - Engineer Microsoft 365-related identity and access
    integrations using Entra ID, Conditional Access, role-
    based access, application integrations, guest access, and
    hybrid identity touchpoints, in partnership with IAM.
  - Partner with Security, IAM, Cloud, and Legal & Compliance
    teams to ensure Microsoft 365, Power Platform, Azure, and
    AI configurations meet the firm's security, privacy,
    records, and data protection standards.
  - Develop and maintain solution designs, architecture and
    configuration standards, support models, runbooks, and
    knowledge articles; serve as an escalation point for
    complex Microsoft platform issues and lead root-cause
    analysis and service-health improvements.
  - Evaluate Microsoft roadmap features, platform changes,
    licensing impacts, and emerging capabilities, and
    recommend adoption paths based on business value,
    technical fit, risk, supportability, and cost, working
    with Microsoft and third-party partners as needed.



  Automation & AI Enablement

  - Design, build, and govern business solutions using Power
    Apps, Power Automate, Dataverse, Copilot Studio, AI
    Builder, standard and custom connectors, and approved
    APIs.
  - Establish supportable Power Platform and automation
    practices for environments, data loss prevention,
    application lifecycle management, monitoring, source
    control, and repeatable deployment; build reusable
    integrations using PowerShell, Microsoft Graph, Power
    Automate, APIs, and other approved tools.
  - Leverage Azure services where needed to support Microsoft
    365 and Power Platform integrations, automation,
    monitoring, security, and identity requirements.
  - Partner with the Enterprise AI team on M365-based AI use
    cases, including Copilot adoption, Copilot Studio agent
    development, and integration of AI tools with SharePoint,
    Teams, and Exchange data.
  - Help evaluate and pilot new AI capabilities as they are
    released into the M365 ecosystem, assessing fit, risk, and
    rollout approach.
  - Create reusable patterns, guidance, demonstrations, and
    documentation that help teams adopt Microsoft AI and
    automation capabilities safely and effectively, in
    alignment with security and governance requirements.



  Requirements

  Education & Certificates

  - Bachelors Degree, required
  - Concentration in Information Technology, Computer Science,
    or a related field, preferred



  Professional Experience

  - Minimum of 5+ years of overall relevant technical
    experience, required
  - 3+ years of relevant hands-on experience engineering and
    administering Microsoft 365 in an enterprise environment,
    including Exchange Online, SharePoint Online, Teams, and
    OneDrive.
  - Hands-on Power Platform experience, including Power Apps and
    Power Automate, with practical exposure to Dataverse,
    Copilot Studio, AI Builder, environment management,
    solution deployment, or data loss prevention policies.
  - Working knowledge of Entra ID, Conditional Access, identity
    and access concepts, and Microsoft security and compliance
    capabilities relevant to Microsoft 365.
  - Demonstrated experience owning or leading Microsoft 365 or
    Power Platform changes and projects, including feature
    rollouts, migrations, integrations, or automation
    initiatives.
  - Experience with Microsoft Purview, Defender, and Intune for
    information protection, compliance, endpoint management,
    and security controls.
  - Experience with Azure integration patterns and/or governed
    AI solutions using Copilot Studio, Microsoft Foundry,
    Azure AI services, AI Builder, or approved large language
    model APIs.
  - Relevant Microsoft certifications across Microsoft 365,
    Power Platform, Azure, or AI are a plus.



  Competencies & Attributes

  - Demonstrated experience owning or leading Microsoft 365 or
    Power Platform changes and projects, including feature
    rollouts, migrations, integrations, or automation
    initiatives.

  - Ability to build and maintain scripts, integrations, and
    automations using PowerShell, Microsoft Graph, Power
    Automate, APIs, or similar technologies.

  - Practical experience applying enterprise AI capabilities to
    real workflows, with exposure to Copilot, Copilot Studio,
    Microsoft Foundry, Azure AI services, or comparable
    tooling, along with clear written and verbal communication
    across technical and non-technical audiences.

  - Sound judgment and independent ownership, with the ability
    to make day-to-day engineering decisions and recognize
    when architecture, security, risk, or investment decisions
    require senior coordination.

  - Pragmatic solution design, with good judgment on when a
    lightweight automation is appropriate versus a larger
    platform investment.

  - Proactive and curious, staying current on Microsoft
    platform, automation, and AI capabilities and identifying
    opportunities to improve the environment before issues
    become requests.

  - Strong documentation discipline, attention to detail, and a
    collaborative approach to sharing knowledge and supporting
    adoption.

  Benefits/Compensation

  The compensation range for this role is specific to
  Washington, DC and takes into account a wide range of
  factors including but not limited to the skill sets
  required/preferred; prior experience and training; licenses
  and/or certifications.

  The anticipated base salary range for this role is $160,000
  to $180,000.

  In addition to the base salary, the hired professional will
  enjoy a comprehensive benefits package spanning retirement
  benefits, health insurance, life insurance and disability,
  paid time off, paid holidays, family planning benefits and
  various wellness programs.  Additionally, the hired
  professional may also be eligible to participate in an
  annual discretionary incentive program, the award of which
  will be dependent on various factors, including, without
  limitation, individual and organizational performance.

  Due to the high volume of candidates, please be advised that
  only candidates selected to interview will be contacted by
  Carlyle.







  Who We Are

  When people, ideas, and capital come together, opportunity
  expands across private markets. At Carlyle, this belief has
  shaped how we invest for decades, fueling growth for
  companies and delivering performance for investors.

  Visit our website to learn more about our firm and the ways
  our platform is shaping private markets.
