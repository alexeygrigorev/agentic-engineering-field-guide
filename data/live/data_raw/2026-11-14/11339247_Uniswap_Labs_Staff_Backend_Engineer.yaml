description: |
  Uniswap Labs is a core contributor to the Uniswap Protocol,
  the world’s largest DEX, with over $4 trillion in volume
  across 17 chains. It builds products that help millions
  access the protocol, including the Uniswap Web App, Wallet,
  and Trading API. Uniswap Labs is also the primary technical
  provider for Unichain, a DeFi-native Ethereum Layer 2 built
  to be the home for liquidity across chains.

  When you join Uniswap, you become part of a team that's
  reshaping the way value flows on the internet.

  As a Staff Backend Engineer, you will play a pivotal role in
  shaping the architecture and strategy of our systems. This
  is a unique opportunity to lead technical initiatives, drive
  innovation, and ensure Uniswap remains at the forefront of
  crypto.

  What You'll Do

  - Drive end to end execution of technical projects, from
    ideation and design to deployment.
  - Design and build resilient, large-scale systems from the
    ground up with a focus on reliability, scalability, and
    performance.
  - Write high quality and well tested code, and review code
    from other team members.
  - Provide thought leadership and guide peers in navigating
    complex architectural and coding decisions.
  - Champion best practices and technical excellence across the
    engineering organization.
  - Spearhead strategic technical initiatives that impact
    multiple engineering pods and deliver organization-wide
    improvements.

  What You'll Bring

  - 10+ years of hands-on experience building and maintaining
    large-scale, production-level systems.
  - Experience as a Technical Lead or in a similar leadership
    capacity.
  - Exceptional coding skills, with expertise in cloud
    architecture, distributed systems, and algorithms.
  - Proven ability to independently lead projects, including
    requirement gathering, system design, implementation,
    testing, and deployment.
  - A track record of mentoring and guiding engineers to achieve
    their potential.
  - A 0→1 mindset with the ability to build systems and
    processes from scratch.
  - Deep interest in modern development practices and a passion
    for shaping the future of crypto technology.

  Nice to Have

  - Prior work with time-series based monitoring and
    observability systems.
  - Knowledge of TypeScript, Go, GraphQL, and AWS
  - A degree in Computer Science or a related field.
  - A love for unicorns

  Minimum full-time salary of $207,000-$259,000. Disclosure in
  accordance with New York City's Pay Transparency Law. Full
  Time employees at Uniswap Labs are also eligible for other
  compensation elements, including tokens, and benefits,
  dependent on the position type.

  Uniswap Labs' Full-Time employee benefits include company-
  paid medical, dental, & vision for you and your dependents,
  wellness offerings including a partnership with Equinox
  Fitness Clubs, 401(k) with 4% employer contribution, annual
  $1,500 education stipend, unlimited and encouraged time off,
  up to 16 weeks paid parental leave, home office setup
  stipend for remote employees and daily lunches at NY
  headquarters (all benefits are subject to applicable taxes
  and based on eligibility).

