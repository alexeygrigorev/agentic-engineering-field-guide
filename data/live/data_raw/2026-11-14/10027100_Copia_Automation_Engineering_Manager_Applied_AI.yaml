  About Copia Automation

  Copia Automation is the first and only Git-powered platform
  built for industrial automation. We help engineering teams
  collaborate, scale, and maintain complete control over every
  version of their PLC and HMI code — tracking every change,
  preventing costly downtime, and keeping a full audit trail
  for compliance.

  We integrate with the industrial control systems and
  applications engineers actually use, including Rockwell
  Automation, Siemens, Beckhoff, Wago, Codesys, Lenze,
  Schneider Electric, and ABB. Our customers are some of the
  largest and most innovative manufacturers in the world.

  Equal opportunity

  Copia is an equal opportunity employer. We are committed to
  building a diverse team and an inclusive culture, and we
  welcome applicants from all backgrounds. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability, veteran
  status, or any other characteristic protected by law.
