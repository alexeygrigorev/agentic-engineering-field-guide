description: |
  About Copia

  Copia Automation builds the version control and change
  management platform for industrial automation. Our customers
  are in oil & gas, manufacturing, and critical
  infrastructure: environments where the code running on PLCs,
  SCADA systems, and HMIs have direct safety implications. We
  bring modern software engineering practices to operational
  technology teams that have been underserved by tooling for
  decades.

  We’re a well-funded startup growing fast, with enterprise
  customers deploying Copia across hundreds of facilities. Our
  headquarters is in New York City.

  The Role

  We’re hiring an Engineering Manager to lead our Applied AI
  team. This team’s mandate is to bring cutting-edge AI into
  the hands of industrial automation engineers — designing,
  building, and owning the GenAI-powered capabilities that
  make Copia’s products dramatically more useful, from the
  Copia Copilot to AI features woven throughout our Source
  Control and DeviceLink products.

  Reporting into the VP of Engineering, you will lead a group
  of full-stack software engineers who build AI-enabled
  tooling end to end, and partner closely with the Product,
  Design, and other Engineering leaders who depend on what you
  ship. You’ll support, mentor, and grow your team while
  staying close enough to the technology to provide meaningful
  architectural input, code review, and the occasional pull
  request. You’ll also help set the bar for how the broader
  engineering organization adopts AI coding tools and
  integrates GenAI responsibly into a safety-critical domain.

  This role is a great fit for a hands-on line manager who is
  energized by a fast-moving field, comfortable making
  product-shaping decisions about where AI adds real leverage
  versus hype, and excited to set direction in an area that is
  still being defined. You must be comfortable collaborating
  through ambiguity, while supporting your team to drive
  predictable velocity as we continue to scale the
  organization.

