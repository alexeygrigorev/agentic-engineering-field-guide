description: |
  Recognized in Gartner’s inaugural 2026 Magic Quadrant™ for
  AI Agent Management Platforms and named a Leader in the
  Gartner® Magic Quadrant™ for API Management for three
  consecutive years, Gravitee brings AI agents and the APIs
  they rely on under one unified control plane.

  We deliver the industry’s most advanced platform for Any
  API, Any Event, and Any AI Agent, trusted by global leaders
  like Michelin, Roche, and Blue Yonder.

  Why join us?

  - The Mission: We are the first to bridge traditional API
    Management with the new frontier of AI Agent Security
  - The Momentum: A high-growth Leader - combining market
    credibility with startup speed
  - The DNA: We hire people who Hold Nothing Back - passionate
    builders who want to redefine digital infrastructure

  Don’t just watch the AI revolution. Build the infrastructure
  that controls and secures it.

  The Role

  We’re hiring a Senior Software Engineer to join us as a
  Product Engineer. You’ll help build how enterprises secure,
  govern and control AI agents. That covers two areas: the
  Agent Gateway, which governs agent-to-agent (A2A)
  communication, and the LLM control layer, which gives
  enterprises one central point of control over every LLM
  their agents call.

  Our Product Engineers don’t wait for specs. You’ll own one
  area of the Agent Gateway or LLM control roadmap, chosen to
  fit your strengths and interests, and take it from idea to
  production yourself. You’ll follow the market closely (new
  protocols, new standards, what competitors are doing), turn
  ideas into PRDs and working prototypes, and make the case
  for them to product leadership. Once an idea is approved,
  you build it. There’s no handoff in the middle.

  What You’ll Be Doing

  At Gravitee, impact isn’t abstract,  it’s visible. In this
  role, you will:

  - Own a meaningful slice of the Agents or LLM control roadmap,
    from customer conversations through shipping and iterating
    on the result.
  - Build features for the Agent Gateway and A2A protocol
    support, or for multi-LLM routing, cost control, and
    reliability – depending on your pod – working closely with
    Product Management and Design.
  - Use AI-assisted development tools as a core part of your
    workflow to move faster from idea to shipped feature.
  - Dig into usage data and customer feedback to help decide
    what to build next, not just how to build it.
  - Prototype quickly, test with real users, and be willing to
    change course when something isn't landing.
  - Partner with Staff Engineers and other pods where the Agents
    surface touches LLM control, MCP, or the core API gateway
    – and vice versa.

  Your impact will be visible, measurable, and felt by every
  enterprise trusting agents with real access to their
  systems, and every customer routing traffic through
  Gravitee's LLM control layer.

  Essential Skills

  - 4+ years of software engineering experience, ideally in a
    product-facing or full-stack role.
  - Current backend experience in Java
  - Solid understanding of authentication/authorization flows
    (OAuth2/OIDC or similar) and how identity and permissions
    propagate through a distributed system
  - Hands-on experience with AI coding assistants (Cursor,
    Claude Code, GitHub Copilot or similar) as part of daily
    work.
  - Strong fundamentals in API design and distributed systems.
  - A bias toward shipping and iterating over building the
    theoretically perfect solution.

  Desired Skills

  - Familiarity with the A2A protocol or agent-to-agent
    communication patterns.
  - Experience with API gateways or API management platforms.
  - Exposure to LLM-based products or agentic workflows.
  - Experience integrating multiple LLM providers into a single
    product surface.
  - Experience with cost or usage governance for AI and LLM
    systems.
  - Familiarity with the Model Context Protocol (MCP) or similar
    orchestration standards.
  - Experience working in a fast-moving, ambiguous product
    environment.
  - Experience with containerized deployment and CI/CD pipelines
    (Docker, Helm, Kubernetes)
  - Familiarity with NoSQL/document databases (e.g. MongoDB)

  Who Thrives at Gravitee

  At Gravitee, our growth is powered by people who bring
  passion to what they build, act with professionalism in how
  they work, and hold nothing back in their commitment to
  doing things well.

  You’ll do well here if you:

  - Care deeply about quality, clarity, and impact
  - Are curious, adaptable, and excited by emerging technologies
    like AI
  - Take ownership and follow through
  - Value collaboration, openness, and continuous improvement

  Bonus points if you’ve worked with APIs, cloud-native
  platforms, AI-enabled systems, or open source, but curiosity
  matters most.

  Life at Gravitee

  At Gravitee, we invest in humans, not just roles.

  You’ll get:

  - Competitive medical coverage
  - Pension / 401k program options
  - Stock options - you build it, you own it
  - 25 days holiday + in-country national holidays
  - 3 mental health days + wellness allowance
  - Your birthday off 🎉
  - Professional development budget to fuel your growth
  - Hybrid work culture with hubs across regions
  - Quarterly team events + annual offsite at an exciting
    location
  - A meaningful, progressive, global company culture that is as
    fun as it is hardworking
  - Endless growth opportunities

  At Gravitee, we believe diverse perspectives make better
  products and stronger teams.

  At Gravitee, no employee or applicant will be treated less
  favorably on the grounds of sex, marital status, race,
  color, nationality or ethnic or national origin, disability,
  gender, sexual orientation, gender identity, age, pregnancy
  or maternity, marital or civil partner status, or religion
  or belief.

  By clicking submit below, you consent to allow Gravitee to
  store and process the personal information submitted above.
