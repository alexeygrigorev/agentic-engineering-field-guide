description: |
  Job Summary & Responsibilities

  The Senior Regional Engineering Manager provides strategic
  leadership, operational oversight, and technical expertise
  for engineering, facilities operations, maintenance, and
  infrastructure management across a portfolio of critical
  client sites within a designated region. This senior
  leadership role is accountable for ensuring operational
  excellence, regulatory compliance, asset reliability,
  financial performance, and customer satisfaction while
  supporting business growth objectives.

  The Senior Regional Engineering Manager serves as a trusted
  advisor to executive leadership and key client stakeholders,
  driving regional engineering strategy, capital planning,
  workforce development, sustainability initiatives, and
  continuous improvement programs. This position leads
  multiple site engineering teams and is responsible for
  standardizing best practices, optimizing facility
  performance, and implementing innovative solutions that
  enhance operational efficiency and service delivery.

  Key Responsibilities

  Strategic Leadership & Regional Operations

  - Provide strategic direction and leadership for engineering,
    maintenance, and facilities operations across a multi-site
    regional portfolio.
  - Develop and execute regional engineering strategies aligned
    with organizational objectives, client expectations, and
    business growth initiatives.
  - Either an existing network of clients and industry
    relationships that could create opportunities for UG2 or
    direct business development experience with a proven
    history of identifying, pursuing, and winning new
    accounts.
  - A mindset that extends beyond operations—someone who is
    comfortable meeting with prospects, developing strategic
    relationships, identifying opportunities in the market,
    and partnering with our sales team to accelerate growth.
  - Serve as the senior engineering representative for regional
    operations, partnering with executive leadership and key
    stakeholders.
  - Establish a culture of accountability, safety, operational
    excellence, innovation, and continuous improvement.
  - Drive organizational change initiatives and operational
    transformations across multiple facilities.

  Leadership & Talent Development

  - Lead, mentor, and develop a team of Regional Engineering
    Managers, Chief Engineers, Facility Managers, Engineers,
    Maintenance Technicians, and support personnel.
  - Build succession planning programs and talent development
    strategies to strengthen regional leadership capabilities.
  - Foster employee engagement, professional development, and
    technical competency advancement.
  - Establish performance expectations and accountability
    measures through regular coaching, evaluations, and
    development planning.

  Engineering Operations & Asset Management

  - Oversee the operation, maintenance, and reliability of
    critical building systems, including HVAC, electrical,
    plumbing, life safety, utility systems, automation
    controls, and specialized infrastructure.
  - Implement enterprise-level preventive, predictive, and
    reliability-centered maintenance programs to maximize
    asset performance and lifecycle value.
  - Develop and standardize engineering operating procedures,
    maintenance standards, and operational best practices
    across all regional sites.
  - Ensure operational readiness and reliability of mission-
    critical systems supporting life sciences, pharmaceutical,
    medical, research, and commercial environments.

  Client Relationship Management

  - Serve as the primary engineering liaison for executive
    client stakeholders and strategic accounts.
  - Build and maintain strong client relationships through
    proactive communication, operational transparency, and
    service excellence.
  - Participate in client business reviews, strategic planning
    sessions, and operational performance discussions.
  - Support contract retention, account growth, and new business
    development opportunities through technical expertise and
    operational leadership.

  Capital Projects & Program Management

  - Lead regional capital planning initiatives, facility
    upgrades, infrastructure modernization programs, and major
    construction projects.
  - Oversee project execution across multiple locations,
    ensuring alignment with scope, schedule, budget, quality,
    and operational objectives.
  - Collaborate with clients, property management teams,
    architects, consultants, and contractors throughout
    project lifecycles.
  - Identify and prioritize capital investments that improve
    reliability, efficiency, sustainability, and operational
    resilience.

  Financial & Business Management

  - Develop and manage regional operating budgets, capital
    expenditure plans, and long-range asset investment
    strategies.
  - Drive financial performance through cost optimization,
    resource allocation, productivity improvements, and
    operational efficiencies.
  - Analyze regional performance metrics and financial data to
    identify opportunities for continuous improvement.
  - Support contract profitability while maintaining exceptional
    service delivery and compliance standards.

  Vendor & Contract Administration

  - Establish strategic partnerships with regional and national
    service providers.
  - Lead vendor selection, contract negotiations, performance
    management, and service-level compliance activities.
  - Ensure consistency in service quality, safety standards, and
    operational outcomes across all contracted services.
  - Evaluate vendor performance through KPI-driven assessments
    and continuous improvement initiatives.

  Safety, Risk Management & Compliance

  - Champion a proactive safety culture across all regional
    operations.
  - Ensure compliance with OSHA, EPA, NFPA, Joint Commission,
    local building codes, and all applicable regulatory
    requirements.
  - Develop regional emergency preparedness, business
    continuity, and incident response programs.
  - Conduct audits, risk assessments, and compliance reviews to
    identify and mitigate operational risks.
  - Lead incident investigations and corrective action
    initiatives when necessary.

  Sustainability, Innovation & Continuous Improvement

  - Lead regional sustainability initiatives focused on energy
    management, carbon reduction, environmental stewardship,
    and resource conservation.
  - Identify and implement emerging technologies, smart building
    platforms, predictive analytics, and automation solutions.
  - Utilize data-driven decision-making to improve asset
    reliability, operational performance, and customer
    experience.
  - Promote innovation and operational excellence through
    benchmarking, process optimization, and best practice
    implementation.

  Key Interactions

  - Executive Leadership Team
  - Regional and Site Operations Leadership
  - Clients and Strategic Stakeholders
  - Property Management Teams
  - Engineering and Facilities Personnel
  - Vendors, Contractors, and Service Providers
  - Regulatory Agencies and Inspectors

  Qualifications

  Education

  - Bachelor's degree in Engineering, Facilities Management,
    Construction Management, or a related technical discipline
    required.
  - Master's degree in Engineering, Business Administration
    (MBA), Facilities Management, or related field preferred.

  Certifications (Preferred)

  - Professional Engineer (PE)
  - Certified Facility Manager (CFM)
  - Certified Healthcare Facility Manager (CHFM)
  - LEED Accredited Professional (LEED AP)
  - Project Management Professional (PMP)
  - Certified Energy Manager (CEM)

  Experience

  - Minimum of 12-15 years of progressive facilities engineering
    and operations experience.
  - Minimum of 7-10 years of senior leadership experience
    overseeing multi-site or regional engineering operations.
  - Experience supporting life sciences, pharmaceutical,
    healthcare, medical, laboratory, research, mission-
    critical, or complex commercial facilities strongly
    preferred.
  - Demonstrated success managing large-scale regional
    portfolios, capital programs, and operational budgets.
  - Proven track record of building high-performing teams and
    driving organizational performance improvements.

  Knowledge, Skills & Abilities

  - Advanced knowledge of building systems, infrastructure,
    asset management, and facility operations.
  - Strong business acumen with expertise in budgeting,
    forecasting, contract management, and financial analysis.
  - Exceptional leadership, communication, negotiation, and
    stakeholder management skills.
  - Strong strategic planning, organizational development, and
    change management capabilities.
  - Expertise in CMMS platforms, building automation systems,
    analytics tools, and facility technologies.
  - Ability to influence executive stakeholders and drive
    results in complex, matrixed environments.
  - Demonstrated critical thinking, decision-making, and
    problem-solving abilities in high-pressure situations.

  Working Conditions

  - Frequent travel throughout the assigned region (up to 50%).
  - Availability to respond to critical facility emergencies
    outside normal business hours.
  - Periodic site visits requiring exposure to active mechanical
    spaces, rooftops, construction zones, and operational
    facilities.
  - Ability to navigate industrial environments and perform site
    inspections as required.
  - Reasonable accommodations may be made to enable individuals
    with disabilities to perform essential job functions.

  About UG2

  Founded in 2012 and headquartered in Boston, Massachusetts,
  UG2 is a privately held facilities services company
  recognized for delivering innovative, client-focused
  solutions that elevate operational performance and service
  excellence.

  At UG2, our people are our greatest asset. We empower
  leaders to challenge convention, drive innovation, and
  create exceptional experiences for our clients. Through
  collaboration, accountability, and continuous improvement,
  we are redefining what world-class facility services look
  like across every market we serve.

