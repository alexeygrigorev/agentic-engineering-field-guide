description: |
  We are looking for candidates from all levels of experience

  Fully Remote or Hybrid options available

  About Us

  At Prophet Security, we're not just building a platform that
  automates complex security tasks – we're building a company
  where every team member has a direct impact on customer
  success. As a member of our team, you'll have the unique
  opportunity to work closely with our customers, understand
  their needs, and see firsthand how your work is making a
  difference.

  If you're passionate about building impactful products,
  working in a collaborative environment, and gaining valuable
  experience in a fast-growing startup, we encourage you to
  apply.

  Prophet Security’s founding team brings over 30 years of
  cybersecurity experience from leading companies including
  Abnormal Security, Expel, Mandiant, McAfee, Oracle, Red
  Canary, Red Hat, Riverbed, and Symantec. We are now focused
  on disrupting the $400B security labor market by building
  the future of automated security operations.

  What Our Platform Does

  Our platform analyzes alerts, develops and executes
  investigation plans, and provides detailed findings and
  actionable recommendations. Analysts review these
  investigations, adding context and feedback that are
  continuously incorporated into future automation.

  The Impact You’ll Have

  We are looking for Software Engineers who will own and
  evolve the core backend systems that power Prophet’s
  platform. You will be responsible for designing, building,
  and scaling the services that ingest, process, and reason
  over large volumes of security data, where some example
  projects might include:

  - Integration at scale: Designing extensible frameworks that
    make it easy to add and operate integrations with third-
    party security systems (e.g., SIEMs, EDR/XDR, identity
    providers, cloud and SaaS logs).
  - Proof-of-Value (PoV) pipelines: Building performant,
    reliable backends that enable fast customer onboarding and
    compelling PoV experiences, from data ingestion through
    actionable insights.
  - Security data platforms: Designing storage, indexing, and
    access patterns for highly dimensional, time-oriented
    security data to support real-time analysis and historical
    investigation.

  You will write production code, lead technical design,
  mentor engineers, and partner closely with Product, ML, and
  Security domain experts to solve complex distributed‑systems
  problems.

  Our tech stack: AI-powered agents, data synthesis and
  correlation, security tool integration, Python, Go, React,
  and Typescript.

  Required Qualifications

  - 2+ years of software engineering experience.
  - A passion for building high-quality products and a strong
    customer focus.
  - Bachelor's degree in Computer Science, Engineering, or a
    similar.
  - Experience building and deploying scalable Backend Services.
  - Strong understanding of software engineering principles and
    best practices.

  - Proficiency in one or more relevant languages (e.g., Go,
    Python).
  - Excellent problem-solving abilities and a detail-oriented
    mindset.
  - Strong communication skills
  - Ability to collaborate effectively within a team.

  Our Culture

  Our employees are recognized as our top asset and we provide
  great benefits, meaningful equity participation, as well as
  a fun and inspiring environment to create and collaborate.

  - Customer Centricity: Focus on exceeding customer
    expectations and placing them at the core of decisions
  - Practicality over Perfection: Emphasis on efficient
    solutions and agile decision-making
  - Strive for Excellence: Commitment to high standards and
    continuous improvement
  - Transparent Communication: Encouragement of open, honest
    dialogue and collaborative trust
  - Unwavering Resilience: Determination to overcome challenges
    and persist in achieving goals
  - Have Fun: Foster a positive work environment that balances
    hard work with enjoyment and creativity

  Environment

  Prophet Security takes pride in being an equal opportunity
  employer. We value a diverse and global talent pool and the
  collaboration that results from having a diverse and
  inclusive team. All applicants will be considered for
  employment without attention to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  veteran or disability status. Our hiring decisions are based
  exclusively on merit, qualifications and business needs.
