description: |
  About Concurrence

  Concurrence (formerly Amigo) is building the platform
  healthcare organizations use to build their own clinical AI
  agents. Our mission is to make excellent care accessible to
  every patient, not rationed by the limits of clinician time.

  Underneath our platform is the Health World Model, which
  unifies a health system’s data into a living, event-level
  record of every patient’s care. On top of it, agents handle
  work across the patient journey, from intake and scheduling
  to medication management and clinical decision support.

  Our agents have supported more than 10 million patient
  encounters and are on track to grow tenfold this year. We
  run natively on Databricks, integrate with every major EHR,
  and are backed by Madrona, General Catalyst, and Optum
  Ventures. We’re about 35 people, working in person in New
  York and San Francisco.



  About this role

  As a Staff Full Stack Engineer at Concurrence, you'll build
  the applications that clinical teams, researchers, and
  customers use every day: real-time oversight of live agent
  conversations, natural language research over healthcare
  data, and tools for designing agent behavior without code.
  You'll own features end to end, from the database to the UI,
  in systems that handle sensitive patient data. The bar for
  correctness and reliability is high.



  What you'll do

  - Building real-time interfaces for clinical oversight of live
    agent conversations
  - Owning a feature end to end, from schema to API to UI
  - Designing tools that let non-engineers shape agent behavior
    safely
  - Making healthcare data explorable through natural language
  - Hardening the reliability and performance of applications
    clinicians depend on
  - Working with designers, clinicians, and customers to get the
    details right



  What we're looking for

  - You've shipped production full-stack features end to end and
    owned the outcome
  - You're strong across the stack, from data modeling and APIs
    to modern front-end work
  - You sweat correctness and reliability, especially where
    sensitive data is involved
  - You have good product instincts and care how things feel to
    use
  - You're low ego, direct, and hold yourself to a high bar
  - You can work on site in New York City or San Francisco



  Nice to have

  - Experience in a regulated or critical, low margin for error
    domain (healthcare, finance, legal)
  - Experience and familiarity with WebSockets, SSE client and
    server implementations
  - Background with design systems or complex UI state
  - Experience with production AI or ML products



  Benefits (available to Full-Time Employees) Health &
  Wellness

  - Comprehensive health, dental, and vision insurance
  - Daily catered lunch and dinner
  - Mental health support and wellness coaching
  - Flexible wellness stipend for fitness, therapy, or personal
    growth

  Growth & Development

  - Annual learning budget for courses, books, or conferences
  - Conference attendance budget for professional development
  - Annual team offsite
  - Academic collaboration opportunities
  - Unlimited PTO

  Our Core Values

  - Patients Win, We WinIf patients aren't getting better care,
    we haven't earned the right to scale. Every internal
    decision gets pressure-tested: does this make patients'
    lives better? If we can't draw the line, we question why
    we're doing it.
  - High Standards, High CareWe hold a high bar for the team
    because patients are counting on us to get this right. But
    high standards only work with genuine investment in each
    other. You can take risks, admit mistakes, and challenge
    ideas. Not despite our standards, but because of them.
  - Thoughtful UrgencyWe move fast by default, but speed without
    judgment is recklessness. The discipline is knowing which
    decisions are reversible vs. not. In healthcare AI, the
    companies that win will be fast everywhere they can be and
    careful everywhere they must be. We build the muscle to do
    both.
  - Intensely MeasuredWe instrument patient outcomes, provider
    ROI, system performance, and clinical accuracy. But data
    without action is surveillance. Every metric should have
    an owner, a threshold, and a response plan. If we're
    measuring something but never acting on it, we stop
    measuring it.

  Who Builds With Us

  - Low ego: Politics and territory don't interest you. The best
    ideas win, regardless of who has them.
  - Direct: You say the hard thing, challenge ideas openly, and
    commit fully once decided.
  - High agency: You thrive on trust rather than instruction.
    When you see something is broken, you fix it. You don’t
    file tickets and wait for someone else.
  - Bar of excellence: You hold yourself to a bar most people
    wouldn't, and you want teammates who do the same.
  - Skeptical: You push back on rules that don’t make sense and
    question assumptions that haven’t earned their place.
