description: |
  Company Description

  SCAYLE is one of the fastest-growing enterprise commerce
  platforms in the world, enabling brands and retailers to
  realize their D2C ambitions. SCAYLE stands for innovation,
  international collaboration, and a strong focus on data. We
  believe that stepping outside of our comfort zone and making
  bold decisions is key to growing both professionally and
  personally. Instead of seeing problems as obstacles, we
  approach them as opportunities to find better solutions. We
  work in an environment that encourages flexibility,
  creativity, and continuous development. What drives us is
  the shared motivation to make an impact and actively shape
  the future of eCommerce.

  Job Description

  We are now looking for a Senior Frontend Developer to join
  our fast-paced engineering team. In this role, you’ll take
  ownership of high-traffic enterprise e-commerce platforms
  for client projects, drive architectural decisions alongside
  our Tech Lead, and continuously push the boundaries of
  modern frontend development.

  - Build clients' high-traffic user interfaces for enterprise
    e-commerce platforms using JavaScript, TypeScript, Vue 3,
    and Nuxt 3.
  - Implement high-leverage frontend features focused on
    optimizing user experience and conversion rates.
  - Collaborate with developers, product managers and QA
    engineers to ship modern design systems and features.
  - Work with the Tech Lead to draft architectural decisions and
    evaluate new web technologies.
  - Maintain high code quality through close collaboration, code
    reviews, automated and manual testing as well as active
    involvement in team retrospectives.
  - Develop new shop features and designs within an agile Scrum
    environment, primarily utilizing Nuxt 3 and Tailwind CSS.
  - Ensure end-to-end quality assurance and pixel-perfect design
    implementation using testing frameworks like Vitest and
    Playwright.
  - Participate in knowledge sharing and engage with the
    internal engineering tech community.

  Qualifications

  - At least 5 years of professional experience and fundamental
    knowledge in frontend development.
  - Good grasp of accessibility and performance optimisation.
  - Professional experience with TypeScript and Vue 3.
  - Strong command of core web technologies including HTML,
    JavaScript, and CSS.
  - Hands-on experience with Tailwind CSS and a keen eye for
    accurate UI design implementation.
  - Background in high-traffic B2C domains like e-commerce,
    gaming, or similar.
  - Experience working within a fast-paced boutique agency
    environment, or even a freelance work background.
  - Practical knowledge of automated testing tools such as
    Playwright, Jest, or Vitest.
  - Excellent communication skills in English and a strong
    ability to adopt different perspectives.



  Nice to Haves

  - Experience with Redis is a plus.
  - A passion for performance and accessibility
  - Initial knowledge of Vue Storefront and Scayle is an
    advantage

