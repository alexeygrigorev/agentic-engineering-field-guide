  About PartnerAlly

  PartnerAlly is an AI-native risk and compliance platform
  helping fintech startups achieve and maintain compliance.
  We're a small, focused team building something new in a
  space that desperately needs innovation.

  The Role

  As our second engineer, you'll work directly with our
  Founding Engineer and CTO to build and scale the platform.
  We're past the initial prototype phase and need someone who
  can take ownership of significant features and ship
  independently.

  This is a high-impact role on a small team where your work
  matters immediately.

  What You'll Do

  - Build new features across the full stack
  - Own specific product areas end-to-end
  - Improve platform reliability, performance, and developer
    experience
  - Collaborate closely with customers to understand their needs
  - Participate in architecture decisions and code review
  - Help establish engineering best practices as we grow

  What We're Looking For

  - 3-5 years of software engineering experience
  - Solid full-stack fundamentals (React/Next.js,
    Node/TypeScript, SQL)
  - Experience shipping features in a production environment
  - Good judgment about tradeoffs between speed and quality
  - Clear communicator who works well asynchronously
  - Curious and willing to learn new domains (compliance, AI)

  Nice to Have

  - Experience with AI/LLM integrations
  - Background in security, compliance, or fintech
  - Familiarity with our stack (Next.js, Supabase, Vercel)
  - Previous startup experience
