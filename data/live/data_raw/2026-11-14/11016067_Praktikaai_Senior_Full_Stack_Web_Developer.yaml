description: |
  We are hiring for this position to be based in Europe

  Praktika is an AI-native education company on a mission to
  deliver efficient, engaging language learning to billions of
  people worldwide. We're bridging the gap between traditional
  learning apps and human tutors through a fully automated
  tutorship experience powered by generative AI avatars.

  Since launching our mobile apps in 2023, we've grown to over
  2 million monthly active users, become one of the world's
  top-4 learning apps, and recently closed a $30M Series A to
  accelerate our roadmap. We're a fully distributed team of
  ~50 people across 4 continents and 15+ countries, working
  asynchronously to ship fast and operate at a high bar.

  We're hiring a Senior Full-Stack Engineer to own and evolve
  every web-facing surface at Praktika; onboarding flows,
  landing pages, customer portals, our web app, and internal
  tools. This is a full-cycle product engineering role: you'll
  shape product direction, design and run experiments, ship
  features end-to-end, and measure their impact on conversion,
  retention, and learner experience.

  You'll partner closely with Product, Marketing, and Growth,
  and your work will directly influence how tens of millions
  of learners discover and engage with Praktika.

  What you'll do

  - Own the entire web stack: marketing site, onboarding
    funnels, customer portals, web app, and internal tools.
  - Lead architecture, development, experimentation, and
    operations across all web applications.
  - Drive product decisions: contribute to the vision, design
    and run A/B tests, analyze results, and iterate quickly.
  - Build adaptive, animated, mobile-first experiences that
    convert and delight users.
  - Integrate with backend services (via Swagger docs),
    authentication providers (Google/Apple SSO), and payment
    gateways (Stripe, PayPal, RevenueCat).
  - Set up and optimize analytics, tracking, and conversion
    funnels in collaboration with Growth and Marketing.
  - Ship production-ready code end-to-end; from idea through
    deployment to monitoring.

  What we're looking for

  We're looking for outstanding engineers who thrive in a
  challenging environment, bring a growth mindset, and operate
  with a high degree of agency, devotion, and autonomy.

  Required

  - Product-first mindset: you think in user problems and
    business outcomes, not just code.
  - Extensive experience with TypeScript, React (hooks, context,
    state management), and Node.js.
  - Proficiency across modern full-stack tooling: Next.js (or
    equivalent), CSS-in-JS or Tailwind.
  - Hands-on experience integrating auth providers (Firebase,
    Auth0), payment systems (Stripe, RevenueCat, PayPal),
    feature-flag platforms (LaunchDarkly, Flagsmith), and
    analytics tools (Amplitude, PostHog).
  - Strong UI/UX sensibility; you care about animation, micro-
    interactions, and conversion details.
  - Comfortable working with RESTful APIs and collaborating
    closely with backend teams.
  - Data-driven approach with proven experience in A/B testing,
    funnel optimization, and analytics.
  - Ability to thrive in an async, distributed, written-first
    culture.

  Bonus

  - A portfolio of high-quality web projects and successful
    conversion experiments.
  - Prior experience at an early-stage or high-growth consumer
    product company.

  How we work

  - Mission-driven: we're building the #1 language learning app
    and competing to win.
  - AI-native; AI isn't a feature; it's how we think, build, and
    scale.
  - Extreme ownership; every project has a clear owner who
    drives it to success.
  - Less meetings, more outputs; async first; meetings are a
    last resort.
  - Speed & excellence; move fast without compromising quality.
  - Truly all-in: Impactful work, full commitment, real rewards.
  - Data-driven; decisions are based on evidence, not opinion.
  - User-obsessed; If it doesn't improve the learner experience,
    it doesn't matter.

  What we offer

  - Equity that grows with your impact (stock options).
  - 26 days of holiday plus bank holidays (34 days per year
    total).
  - Annual company off-site (last year: Dubai).
  - Health and wellness benefits via SafetyWing.
  - Full AI toolkit access: Claude, Cursor, Codex, and other
    productivity tools.
  - $1,000 annual education and learning budget.
  - Fully remote — work from wherever you do your best work

  Why should you join Praktika:

  We expect dedication and hard work, but we also believe in
  rewarding it. Our compensation reflects the effort and
  results you bring to the table.

  - Top-tier salary to match your top-tier skills
  - Equity that grows with your impact: Equity growth via stock
    options
  - 26 days holidays plus bank holidays. (34 days per year)
  - Yearly off-sites: Last year was in Dubai!
  - Health and wellness benefits to support your overall well-
    being through Safetywing
  - Access to an AI toolkit including ChatGPT, Copilot, and
    other productivity tools
  - Annual educational budget of up to $1,000
  - Interview Process:

  We will provide you with feedback throughout the interview
  process.

  Join Praktika and lead the charge in driving exponential
  growth and innovation. Apply now to be part of a team that
  is redefining language learning for millions of users
  worldwide.
