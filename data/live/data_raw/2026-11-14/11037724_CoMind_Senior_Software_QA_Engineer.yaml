title: Senior Software QA Engineer
company: CoMind
location: London, GBR
work_type: FULL_TIME
company_size: 61 Employees
description: |
  At CoMind, we are developing a non-invasive neuromonitoring
  technology that will result in a new era of clinical brain
  monitoring. In joining us, you will be helping to create
  cutting-edge technologies that will improve how we diagnose
  and treat brain disorders, ultimately improving and saving
  the lives of patients across the world.

  The Role

  You will build the platform that transforms raw neuro-
  signals into longitudinal patient insights, effectively
  defining the new standard of care in neuro-critical
  settings. As a Software Test Engineer for the CoVision
  project, you will be co-responsible for the safety and
  effectiveness of our medical devices through comprehensive
  Verification and Validation (V&V) processes. You will work
  throughout the entire Software Development Life Cycle
  (SDLC), focusing on software and integration testing for
  both products and internal tools.

  At CoMind, all team members work at least 4 days per week
  from our new Kings Cross office, plus a flexible work-from-
  home day. Responsibilities:

  - Compliance-as-Code: Build workflows that map verification
    evidence to regulatory standards and generate that
    evidence automatically.
  - Testing Strategy: Own comprehensive test plans, protocols
    and execution reports for medical device software.
  - V&V Leadership: Drive formal software verification and
    validation, ensuring adherence to IEC 62304 (Class C) and
    ISO 14971.
  - Process Automation: Push test automation, CI/CD pipelines
    and new testing techniques forward, including LLM-assisted
    quality gates.
  - Hardware Integration: Work with systems engineers to test
    multi-tasking systems and signal-processing applications
    on real hardware.

  Skills & Experience:

  - 5+ years in software testing, particularly for complex or
    safety-critical systems.
  - Proficiency in Python.
  - Experience in highly regulated industries, preferably
    medical device development.
  - Strong hands-on background in CI/CD, test automation, and
    build systems.
  - Strong hands-on experience with Test-Driven Development
    (TDD) and Behaviour-Driven Development (BDD).

  Benefits:

  - Company equity plan so all employees share in the success of
    the company
  - Salary-sacrifice pension scheme
  - Private medical, dental and vision insurance (medical
    history disregarded)
  - Group life insurance at 4x annual income
  - Comprehensive mental health support, including unlimited
    access to 1:1 sessions with trained professionals
  - Unlimited holiday allowance (+ bank holidays) and one week
    of remote working per quarter
  - Lunch voucher (£10) every day for JustEat and free dinner on
    those days where you need to work later
  - Twice weekly deliveries of fresh fruit and an extensive
    selection of snacks and drinks
  - YuLife subscription, allowing you to turn your daily steps
    and meditation into discounts at a range of stores

  Disclaimer - We use Granola, an AI notetaker, throughout our
  interview process to help capture notes. It's used only for
  note-taking during the conversation. Transcripts aren't
  saved to shared drives or stored externally. Let us know if
  you'd prefer we don't.
