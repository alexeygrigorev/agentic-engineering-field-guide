description: |
  iT1 Nucleos was formed when iT1 acquired Nucleos Inc.,
  uniting iT1's enterprise scale with Nucleos's mission to
  promote a more just society through education and training.

  Nucleos started in 2017 as a public benefit corporation,
  backed by the National Science Foundation, on a simple
  conviction: education and training are the most reliable
  engines of dignity and mobility, and their benefits should
  reach the people who have the least access to them. Not only
  in a classroom or a facility, but everywhere people learn,
  work, and achieve their goals.

  Today iT1 Nucleos delivers AchieveDXP, hardware, services,
  and managed deployments as a single, accountable program,
  from initial procurement through every learner outcome, for
  agencies, schools, colleges, and workforce partners alike.
  AchieveDXP is the accountable learning platform for K-12,
  adult education, workforce, independent learners, and
  corrections, purpose-built for the most security-sensitive
  learning environments in the country.

  iT1 brings more than twenty years of government technology
  delivery, ISO 9001:2015 certification, and a repeat place on
  the CRN Solution Provider 500. That gives us the stability
  of an established parent company alongside the pace of a
  small team.

  The role

  We are hiring a senior software engineer to build and own
  significant parts of our platform, and to grow into an
  engineering leadership role as the team and the company
  scale. This is a hands-on role first. You will be one of our
  strongest individual contributors, in the codebase every
  week and shipping production features end to end. The team
  is small and experienced, so there is real room to take on
  more scope over time, mentor other engineers, and move into
  leadership as we grow.

  You will work across the full stack, own meaningful parts of
  the architecture from design through delivery, and help keep
  the platform reliable inside tightly controlled
  environments.

  AI is central to where the product is going. We are looking
  for an engineer who already works this way: someone who has
  shipped LLM-powered features to production, who can judge
  where AI belongs in a product and where it does not, and who
  knows how to evaluate and constrain it so it is safe to put
  in front of education and corrections users.

  What you'll do

  - Build across the stack. Ship production features end to end,
    from the user interface through the API and the data
    layer.
  - Ship AI features. Help shape how AI shows up in the product,
    along with the evaluation and guardrails that make it
    appropriate for education and corrections use.
  - Own work end to end. Take meaningful parts of the platform
    and own them from design through delivery and ongoing
    reliability, including how they run across our multi-
    tenant, per-customer deployments.
  - Solve integration problems. Bring the learning applications
    and content providers our customers rely on into one
    coherent experience, including systems that were never
    designed to be integrated.
  - Grow into leadership. Mentor engineers, help set our
    engineering standards and code review culture, and grow
    into an engineering leadership role as we scale.
  - Help scale the product. Contribute to a ground-up product
    redesign and to scaling the platform as we expand into
    adult education and workforce development.

  Compensation

  $160,000-$180,000 base. Final offer depends on experience
  and location.

