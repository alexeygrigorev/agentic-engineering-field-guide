description: |
  About Arondite

  Arondite enables organisations to wield autonomy, data and
  AI at scale. We equip operators with the foundational
  software to orchestrate their mix of platforms and
  capabilities, and then take mission-critical decisions
  faster than their adversaries.

  We exist to ensure the UK and its allies out-think, out-pace
  and out-adapt those who seek to threaten our values and way
  of life. Our technology is designed for deployment in the
  world’s most austere environments, and is relied upon by the
  world’s most demanding operators. We deploy alongside them,
  bringing our technical expertise wherever it is needed.

  You will join Arondite at a pivotal moment in the company’s
  journey. We are ambitious, building for the long-term and
  backed by globally renowned investors including Index
  Ventures (Anthropic, Wiz, Figma, Revolut). Our company is
  being built by exceptional engineers - people who find high-
  impact and technically challenging work engaging and
  exciting, and who consistently deliver outsized impact. You
  will collaborate with other brilliant minds to solve some of
  the world’s hardest and most important problems.

  You will have ownership and autonomy from Day One. There is
  no corporate ladder at Arondite. From your first day, you
  will directly influence the design, functionality, and
  direction of Arondite’s product offering. We hire the best
  people and give them extremely high levels of autonomy; the
  sky is the limit for an individual with the right ambition.

  If you are motivated by our mission and if you want to be
  part of a growing team of outstanding people, then we want
  to hear from you.

  About the role

  As Lead Software Engineer at Arondite you will be
  responsible for the success of an area of our enterprise
  software product, Cobalt. The role gives you the opportunity
  to combine software development with leadership of highly
  talented engineers and designers. You will divide your time
  between architecting and writing software yourself, and
  supporting and mentoring other engineers. You will also be
  able to influence the product roadmap and help scale our
  world-class engineering function.

  You will need to understand how our enterprise software
  product is used by people (and with hardware) in the real
  world. There are opportunities at Arondite covering front-
  end, back-end and full-stack. Wherever you focus, you will
  work closely with product managers, product designers, other
  engineers and team leads to meet important customer
  deadlines for our mission critical software.

  Your responsibilities will include:

  - Collaborating with product managers, designers and engineers
    leads to deliver high quality and well tested features
  - Driving the personal development of members of the team by
    giving suitable support and training
  - Conducting code reviews and give feedback to other engineers
  - Owning technical decisions for the area of the product
  - Writing production code for complex and high-impact features
  - Adhering to and promoting internal security policies
    throughout the development lifecycle in order to build a
    secure and reliable product
  - Contributing to planning and roadmap discussions
  - Communicating status, risks, and tradeoffs to stakeholders

  Requirements

  We are looking for candidates with experience across the
  development stack, from frontend UX experts who delight in
  producing a polished and beautiful experience, to networking
  maestros who understand and optimise the complex topology
  required to support our platform (and everything in-
  between).

  Arondite aims to bring together individuals from diverse
  backgrounds and with different perspectives. We therefore
  don’t expect people to have experience across every area of
  the requirements. Please apply even if you only partially
  fulfil the following lists.

  You should have:

  - A degree in Computer Science, Engineering, or a related
    technical/scientific subject (or equivalent experience)
  - Strong core programming skills in either (or both!):
  - Several years of software engineering experience in industry
  - Some history of managing other engineers
  - A forward-leaning and pragmatic approach to using AI coding
    tools

  Ideally, you would also have:

  This is not an additional list of requirements; this
  reflects the tech stack currently used at Arondite; any
  experience in these areas is a bonus

  - Understanding of working on embedded / resource constrained
    devices
  - Experience with Kubernetes
  - Experience with SQL databases such as PostgreSQL
  - Experience of machine learning applications
  - Knowledge of application security best practices and secure
    coding principles (e.g., OWASP Top 10)

  Right to Work

  We require that all candidates have an existing Right to
  Work in the UK at the time of application.

  Security clearance

  We believe in working closely with defence customers. As a
  result, this role will require the individual to hold a
  clearance or be willing to undergo UK security vetting to
  Security Check (SC) or above. This normally requires having
  continuous residency in the UK for at least 5 years.

  Office vs Hybrid working

  We are focused on building a positive, collaborative
  engineering-driven culture. We therefore believe in making
  the office a friendly, comfortable and fun place to be, and
  we try to work from the office where possible. Of course,
  there are times when it makes sense for you to work from
  home and that's OK. You may also need to travel to visit
  customers, depending on your role. But in general you should
  only apply to join Arondite if you're excited to come into
  the office and work in person by default.

  Application process

  Following a welcome call with the Talent team, our interview
  process for this role is typically:

  - Technical screening (30-45 mins)
  - Leadership assessment call (30 minutes)
  - In-person technical interview (1.5 hours)
  - Final interview with one of Arondite’s Founders (30 mins)

  Benefits

  - Highly competitive base salary
  - Generous equity in EMI share options in a well-funded and
    growing startup
  - 7% employer pension contribution
  - Free meals in the office every day
  - Private health and dental insurance, with opt-in cover for
    dependents
  - Cycle to work scheme
  - Relocation support
  - Access to any resources, equipment and training that you
    need to do your job in a world-class way
