description: |
  Join the team bringing autonomy to the built world

  At Bedrock, we're moving AI out of the lab and onto real job
  sites. Our team includes veterans who helped launch Waymo,
  scaled Segment to a $3.2B acquisition, and grew Uber Freight
  to $5B in revenue. We retrofit the heavy equipment
  contractors already own, starting with excavators, so
  experienced crews can safely take on more projects and
  deliver more of the critical infrastructure our society
  needs. In August 2026, Bedrock-equipped excavators began
  doing fully autonomous, paid work on live commercial job
  sites. We've more than doubled our customer base since 2025,
  and our machines now work with contractors across the South,
  Midwest, and Mid-Atlantic In October 2026, we raised a $600M
  Series C co-led by CapitalG and Emergence Capital, bringing
  our total funding to nearly $1B. We're using it to put more
  autonomous machines to work, build the field and operations
  teams behind every deployment, and expand into new machine
  types and job-site tasks. This is where algorithms meet
  steel-toed boots. You'll work alongside construction
  veterans and world-class engineers to solve physical-world
  problems that simulations can't touch. If you're ready to do
  meaningful work on hard problems, we'd love to have you join
  us.

  The Mission:

  We’re looking for exceptional Software Engineers to build
  and scale our robotics simulation environment. Simulation is
  a critical foundation for autonomy at Bedrock - it allows us
  to validate end-to-end systems, evaluate complex and unsafe
  scenarios, and run testing at massive scale.

  Our autonomy stack is deeply machine-learning–driven, and
  closing the sim-to-real gap is a core focus of this role.
  The simulator must accurately represent real-world physics -
  including terrain deformation for digging and earthmoving -
  while remaining efficient enough to support thousands of
  simulation runs. High-quality simulation directly
  accelerates robotics development, making this work central
  to our success.

  What You’ll Do:

  - Build and scale high-fidelity simulation environments for
    autonomous construction machines
  - Develop simulation systems that support ML-based autonomy,
    evaluation, and safety validation
  - Improve realism and performance to better reflect real-world
    behavior
  - Help guide our strategy in scene generation and neural
    rendering techniques
  - Write production-quality, hands-on code and build real
    simulation content—not just prototypes

  Who You Are:

  Simulation spans many disciplines, and we don’t expect one
  person to do everything. Strong candidates typically bring:

  - A passion for large-scale, realistic simulation systems
  - Experience with advanced 3D simulation software
  - Experience evaluating systems and improving realism to
    support autonomy stacks
  - A hands-on mindset and enthusiasm for building core
    simulation algorithms and content

  What We’re Looking For:

  - Engineering, math, or physics degree, or computer science
    background with demonstrated interest and strength in math
    and physics
  - 4+ years of professional experience in software engineering,
    with proven track record of building modular,
    maintainable, production-quality software systems in C++
  - 2+ years of experience with one or more 3D engines or
    simulation frameworks, such as: Unreal Engine, Unity,
    Godot, Blender, Gazebo, Isaac Sim, Omniverse

  Preferred Qualifications:

  - Experience with Rust or interest in learning it
  - Robotics simulation background
  - Experience with neural rendering techniques (Gaussian
    splats, NeRFs)

  Bedrock Robotics is an Equal Opportunity Employer

  We’re committed to building a diverse and inclusive
  workplace. We consider all qualified applicants for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  ancestry, age, disability, veteran status, genetic
  information, or any other protected characteristic.

  Reasonable Accommodations

  We want our hiring process to be accessible to everyone. If
  you need an accommodation to participate in the application
  or interview process, please let your recruiter know so we
  can support you.
