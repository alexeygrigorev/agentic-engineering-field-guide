description: |
  At Playlist, life's richest moments happen when people step
  away from screens to move, connect, explore, and play. We're
  building the definitive platform for intentional living,
  connecting people with inspiring experiences in fitness,
  wellness, and beyond. With popular brands like Mindbody and
  ClassPass, Playlist empowers businesses and individuals,
  making it effortless for aspirations to become actions. Join
  us in reshaping technology's role to foster meaningful,
  real-world connections.

  ClassPass offers thousands of fitness and wellness
  experiences worldwide, helping people lead active, balanced
  lifestyles. Our platform makes discovering and enjoying
  activities simple, personalized, and joyful—whether it's
  fitness classes, self-care sessions, a healthy lunch, or a
  new adventure. Join us in shaping healthier, more vibrant
  communities around the globe.

  Experience You Bring

  - Collaborating closely with product & design, shipping early
    and often.
  - Providing leadership and mentorship for junior engineers
    through thoughtful code reviews, pairing, and technical
    discussions.
  - Seeking feedback because it you know has the ability to turn
    good work into great work.
  - Writing clear and concise technical documents.
  - Keeping up to date with the latest technologies and industry
    trends, and sharing them with the team.
  - Track record of shipping successful iOS apps to the App
    Store.
  - Proven analytical abilities and propensity for problem
    solving.
  - Initiative to identify process and systems improvements and
    to take ownership of implementation.
  - Bias for action, driving impact, and initiating ideas.

  Technologies you could be working with

  - Swift, SwiftUI and iOS development.
  - Experience working on a large modular codebase that was
    started a decade ago and needs to be well architected for
    the next decade of growth.
  - React Native experience is a plus!

