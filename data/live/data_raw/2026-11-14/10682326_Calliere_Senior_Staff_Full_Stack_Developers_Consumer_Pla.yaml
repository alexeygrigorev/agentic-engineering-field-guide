title: "Senior & Staff Full Stack Developers (Consumer Platform)"
company: Calliere
location: New York, USA
work_type: FULL_TIME
company_size: 3 Employees
description: |
  Join a high-growth, product-driven company that is
  redefining how modern consumers discover, plan, and manage
  complex real-world experiences. This is an opportunity to
  work on a platform that blends marketplace dynamics, rich
  user interaction, and sophisticated integrations—at
  meaningful scale.

  As a Senior or Staff Full Stack Engineer, you will play a
  central role in shaping the core user-facing experience. You
  will collaborate closely with product and design to build
  elegant, high-performance applications that power a rapidly
  expanding ecosystem of users, partners, and service
  providers.

  This role is ideal for engineers who enjoy ownership, thrive
  in ambiguity, and want to build products that combine
  thoughtful UX with robust technical foundations.

  What You’ll Work On

  - Designing and building a sophisticated web platform used by
    a distributed network of professional users managing
    client interactions, transactions, and workflows.
  - Developing features that support onboarding, search,
    booking/ordering flows, and ongoing lifecycle management
    of customer engagements.
  - Creating seamless integrations with external partners,
    third-party systems, and APIs.
  - Contributing to both frontend architecture and backend
    services to deliver end-to-end solutions.
  - Partnering with product and design to influence roadmap
    decisions and elevate the overall user experience.
  - Taking ownership of projects from concept through deployment
    and iteration.

  Why This Role Stands Out

  - You’ll work on a product that sits at the intersection of
    marketplace, SaaS, and consumer experience—offering
    meaningful technical challenges.
  - High ownership: engineers here influence product direction,
    not just implementation.
  - Real impact: your work directly shapes how thousands of
    users run and grow their own businesses.
  - Strong emphasis on modern engineering practices, data-driven
    decisions, and continuous improvement.

  RequirementsWhat You Bring

  - 5+ years of experience building modern web applications.
  - Strong expertise with at least one major frontend framework
    (React, Vue, or Angular).
  - Experience developing stateful, event-driven user
    interfaces.
  - Solid backend development experience, including working with
    APIs and relational databases.
  - Familiarity with ORMs and scalable data models.
  - A strong testing mindset and commitment to code quality.
  - Ability to operate autonomously while collaborating
    effectively across teams.
  - An entrepreneurial approach—you’re comfortable building in
    fast-moving environments.

  BenefitsCompensation & Benefits

  - Competitive salary range: $160,000–$220,000 USD with a VERY
    healthy work / life balance.
  - Meaningful equity participation.
  - Flexible paid time off.
  - Comprehensive health, dental, and vision coverage (including
    fully covered options).
  - Retirement savings plan with employer match.
  - Wellness and lifestyle benefits.
  - Commuter support and additional insurance options.

  Work Environment

  - Hybrid work model based in a major U.S. tech hub, with
    structured in-office collaboration days and flexibility
    for remote work.
  - High-trust, low-ego culture focused on building exceptional
    products and supporting one another.
