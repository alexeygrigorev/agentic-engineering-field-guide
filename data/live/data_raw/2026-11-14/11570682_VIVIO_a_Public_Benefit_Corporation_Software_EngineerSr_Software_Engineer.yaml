description: |
  Company Description

  About VIVIO

  VIVIO Health, a Public Benefit Corporation, is
  revolutionizing pharmacy benefits management through data
  and technology. Our foundational principle - "The Right Drug
  for the Right Person at the Right Price" - drives everything
  we do. Since 2016, our evidence-based approach has delivered
  superior health outcomes while reducing costs for self-
  insured employers and health plans. By ensuring each patient
  receives the most appropriate medication for their specific
  condition at a fair market price, we're replacing the
  obsolete PBM Model with innovative solutions that work
  better for everyone.

  Why Join VIVIO?

  - Innovation: Challenge the status quo and shape healthcare's
    future
  - Impact: Directly influence patient care and help change
    healthcare delivery
  - Collaboration: Work with passionate teammates dedicated to
    making a difference
  - Culture: Enjoy autonomy and reliability in a
    micromanagement-free environment
  - Growth: Expand your opportunities as we expand our business

  Job Description

  Position Overview

  We're seeking a mission-aligned Software Engineer to help
  build and improve our products. You'll build and support the
  Python services that run our business: pharmacy claims
  processing, medical claims processing, batch data pipelines,
  and internal web applications. You'll take ownership of real
  features early and learn the pharmacy benefits domain by
  building in it.

  This role can be hybrid (minimum 3 in-office days per week)
  from our Hayward, CA office, or fully remote for candidates
  outside the Bay Area. Remote team members maintain core
  overlaps with Pacific Time hours and join periodic team
  onsites in Hayward.

   Key Responsibilities:

  - Build and maintain Python services: REST APIs (FastAPI),
    batch jobs, and shared libraries
  - Implement features in our claims, eligibility, and drug-
    pricing workflows
  - Ensure high-quality deliverables through well-designed,
    maintainable, and unit-tested code
  - Write and tune SQL against our MySQL databases: queries,
    reports, and stored procedures
  - Participate in the full application lifecycle: design, code
    review, deployment, and production support
  - Collaborate across departments to align technical solutions
    with business goals
  - Use AI-assisted development tools to accelerate delivery
    while owning the correctness, testing, and review of your
    work

  Qualifications

  Required Qualifications:

  - BS or advanced degree in Computer Science or equivalent
    practical experience
  - 3+ years of hands-on Python development experience
  - Solid computer science fundamentals: data structures,
    testing, and version control (git)
  - Care and discipline working with sensitive data; HIPAA/PHI
    experience is a plus
  - Experience with relational databases and SQL (MySQL
    preferred)
  - Experience building RESTful APIs in Python (FastAPI,
    preferred)
  - Experience with Atlassian toolset and Agile development
    methodologies
  - Comfort working in Linux environments; AWS exposure is a
    plus
  - Healthcare industry experience is a plus, not a requirement;
    we will teach you the pharmacy benefits domain
  - Experience working with AI coding tools (Claude Code,
    ChatGPT, Cursor, or similar), including judgment about
    when to trust their output and when not to

  Key Attributes:

  - Active problem solver with a "figure it out" mindset
  - Clear and proactive communicator
  - Exceptional attention to detail
  - Eagerness to learn a complex, regulated business domain
  - Openness to feedback and collaborative code review

  VIVIO does not provide employer support or sponsorship for
  any immigration related employment benefit for this role.

  Applicants must be currently authorized to work in the
  United States on a fulltime basis without the need for
  employer support, visa transfer support, DSO documentation
  or sponsorship now or in the future. This includes having
  the legal right to work in the United States without the
  need for VIVIO support or sponsorship for any immigration
  related employment authorization (e.g., H1B, O1, E3, H1B1,
  TN, F1 OPT, F1 STEM OPT, F1 CPT, E-2, E-3 etc.) now or in
  the future.

  Additional Information

  Compensation and Benefits:

  - The anticipated salary range for this position is
    $120,000–$170,000 per year. The actual salary offered will
    be determined by a variety of factors, including the
    candidate’s qualifications, experience, and the position's
    geographic location.
  - Bonus Eligible
  - Comprehensive Benefits Package:
  - Medical, Pharmacy, Dental, Vision
  - Life Insurance
  - Stock Options
  - 401(k) with Company Match
  - PTO
  - Full-time position
  - Dynamic, collaborative work environment
  - Opportunity to make a real impact at a growing Public
    Benefit Corporation

  VIVIO Health is an Equal Opportunity Employer. All
  information will be kept confidential according to EEO
