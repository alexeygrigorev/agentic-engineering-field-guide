description: |
  About the Job

  The Opportunity

  As a Junior Software Engineer at Mimi Dental Clinic, you
  will contribute to building the technology that powers
  Ibadan's premier dental practice, serving over 15,000
  patients with world-class care across more than two decades
  of continuous operation. Mimi Dental Clinic is a leading
  dental healthcare provider delivering exceptional, patient-
  centred care with warmth, precision, and integrity, backed
  by nearly 2,000 Google reviews and a 4.9-star rating.

  In this role, you will work alongside senior engineers to
  develop, test, and ship features across our patient-facing
  platforms, clinical operations tools, and internal systems.
  You will gain hands-on experience with mobile application
  development, healthcare data systems, and the infrastructure
  that enables thousands of patients to access premium dental
  care seamlessly. You will be trusted with meaningful work
  from day one, not sidelined with tasks that don't matter.

  This is a rare opportunity to begin your engineering career
  at the intersection of healthcare and technology, where your
  contributions will be visible, valued, and directly tied to
  the quality of experience that patients receive at one of
  Nigeria's highest-rated dental practices.

  What You'll Do

  Write clean, well-tested code that contributes to Mimi
  Dental Clinic's core platforms, patient-facing applications,
  and internal tooling. Collaborate with senior engineers on
  the design and implementation of new features across our
  mobile application, booking systems, and clinical operations
  infrastructure. Participate in code reviews, giving and
  receiving feedback that elevates the quality of the entire
  team's work. Assist in debugging, troubleshooting, and
  resolving issues across the platform with attention to
  detail and persistence. Contribute to building and improving
  automation that supports our patient scheduling, follow-up,
  and engagement workflows. Learn and grow rapidly by engaging
  with modern tools, frameworks, and healthcare technology in
  a production environment.

  What You'll Need to Succeed

  A degree in Computer Science, Software Engineering, or a
  related discipline, or equivalent practical experience
  through bootcamps, self-directed learning, or personal
  projects. Foundational knowledge of at least one programming
  language such as Python, C#, TypeScript, or JavaScript.
  Familiarity with web development fundamentals including
  APIs, databases, and version control with Git. A genuine
  desire to learn, improve, and take ownership of your growth
  as an engineer. Strong communication skills and a
  collaborative disposition, comfortable working within a team
  and asking thoughtful questions. Genuine interest in
  healthcare technology, patient experience systems, or
  digital health innovation is highly valued.

  Role Details

  Employment Type: Full-Time and Part-Time positions available
  Location: Fully Remote Stage: Established, 20+ years
  operational

  About Mimi Dental Clinic

  Mimi Dental Clinic is Ibadan's premier dental practice,
  founded in 2004 with a singular vision: to deliver world-
  class dental care with warmth, precision, and integrity. For
  over two decades, we have been the trusted choice for
  individuals and families seeking exceptional oral healthcare
  in a refined, comfortable setting. We provide a
  comprehensive suite of dental services including general
  dentistry, cosmetic dentistry, orthodontics, dental
  implants, oral surgery, paediatric dentistry, and emergency
  care.

  We are not simply a dental clinic. We are the standard that
  others aspire to, serving over 15,000 satisfied patients
  with a 99% satisfaction rate, investing continuously in
  advanced technology, and building digital experiences that
  reflect the same commitment to excellence that defines every
  aspect of our care.

  Equal Opportunity

  Mimi Dental Clinic is an equal opportunity employer. We
  welcome dedicated individuals regardless of gender, race,
  ethnicity, national origin, age, disability, religion,
  sexual orientation, gender identity or expression, or
  veteran status. We believe that exceptional care is
  delivered by exceptional teams, and exceptional teams are
  built on inclusion, respect, and the understanding that
  brilliance has no single origin.

  If you require accommodation during the application or
  interview process, please reach out to our team and we will
  ensure your needs are met with care.

  Let's build the future of dental healthcare, together.
