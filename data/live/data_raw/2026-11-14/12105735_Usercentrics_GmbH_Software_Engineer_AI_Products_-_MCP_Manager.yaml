description: |
  Location

  Hybrid: New York, NY (2-3 days per week in office). The
  office is located in Midtown West, less than a 10-minute
  walk from Port Authority and under 5 minutes from Penn
  Station and Herald Square.

  SHAPE THE FUTURE OF AI GOVERNANCE WITH USERCENTRICS

  Usercentrics is a global leader in consent management, and
  now we're bringing that same mission of trust and control
  into the AI era. MCP Manager (MCPM) is our newest product: a
  governance and management platform for Model Context
  Protocol (MCP), the emerging standard that connects AI
  agents to business systems like Salesforce, Confluence,
  Slack, and GitHub.

  As AI adoption accelerates, enterprises face a new and
  urgent challenge: how do you give teams the power of AI
  agents while maintaining visibility, security, and control
  over what those agents can access and do? MCP Manager is the
  answer, serving as the trust and control layer for AI agent
  connections.

  This is a category-creation opportunity. MCP is being
  compared to the invention of the USB connector for AI: a
  universal standard that changes everything. We're looking
  for a Software Engineer who wants to be on the ground floor
  of defining that category and to build the product
  enterprises rely on to govern their AI agents.

  THE ROLE

  As a Software Engineer on the MCP Manager team, you will
  build the features customers use to govern their AI agents,
  such as gateway configuration, identity and access policies,
  and audit logging. You will split your time evenly between
  our Vue.js front end and our Python/Django and TypeScript
  back end, all running on Google Cloud Platform. You will
  work closely with our Product Manager, our designer, and
  your fellow engineers to take features from spec to
  production, and you will own the quality of what you ship.

  You will join a small, high-ownership engineering team that
  operates like a startup inside a larger company, with a
  short path from customer feedback to shipped code. The role
  exists now because buyers are moving from AI experiments to
  production agent rollouts, and they need the governance
  layer beneath those agents to keep pace with new MCP
  servers, clients, and security requirements.

  YOUR TASKSFeature Development

  - Design, build, and ship features across the full stack, from
    Vue.js interfaces to Python/Django and TypeScript
    services.
  - Turn product specs and designs into working software,
    raising questions and tradeoffs early with product and
    design.
  - Design clear APIs and data models that other engineers can
    understand and extend.

  Quality & Reliability

  - Write automated tests alongside your code and help keep the
    test suite fast and reliable.
  - Review teammates' pull requests thoughtfully and respond
    constructively to feedback on your own.
  - Investigate and fix bugs, including issues escalated from
    customers, by tracing problems across the front end, back
    end, and infrastructure.

  AI-Assisted Development

  - Use Claude Code and other AI coding assistants every day to
    plan, write, test, and review code, while taking full
    ownership of everything you ship.
  - Share techniques that make the team faster and help refine
    how we use AI tooling in our engineering practices.

  Collaboration & Growth

  - Contribute to planning and technical discussions with honest
    estimates and early warnings about risk.
  - Build a working understanding of MCP and of how enterprises
    connect AI agents to their business systems.
  - Document what you build so that teammates and future
    engineers can pick it up quickly.

  Requirements

  - 3 or more years of professional software engineering
    experience building and shipping production web
    applications.
  - Strong proficiency in TypeScript and experience with a
    modern front-end framework, ideally Vue.js.
  - Experience building back-end services and APIs in Python,
    ideally with Django.
  - A solid understanding of relational databases, schema
    design, and query performance.
  - Experience deploying and operating software in a cloud
    environment, ideally Google Cloud Platform.
  - Daily, hands-on use of Claude Code and other AI coding
    assistants, with the judgment to review, test, and stand
    behind AI-generated code.
  - Ideally, experience with the Model Context Protocol, AI
    agent tooling, or AI gateways, or a background in
    developer tools, security, or governance software.
  - Comfort operating in an early-stage, category-creation
    environment where the playbook is still being written.
  - Clear written and spoken communication in English, and a
    habit of giving and asking for feedback directly.

  Benefits

  - 401(k) plan contribution with employer match
  - Commuter allowance (transit stipend)
  - 18 paid vacation days (PTO)
  - Health insurance
  - Personal development budget for every employee
  - Hybrid workplace
  - Online wellness sessions
  - Team events including team buildings, happy hours, company
    breakfasts/lunches, in-person and virtual
  - Refreshments: snacks, fruit, coffee, and drinks in the
    office

  Salary Range: $170,000 - $185,000

  The annual base salary range is determined based on a
  variety of factors, including geographic location, role-
  specific skills, relevant experience, and internal equity.
  Usercentrics is committed to transparent and equitable
  compensation practices.

  Don't meet every single requirement? Studies have shown that
  women and people of colour are less likely to apply to jobs
  unless they meet every single qualification. At Usercentrics
  we are dedicated to building a diverse, inclusive and
  authentic workplace, so if you're excited about this role
  but your past experience doesn't align perfectly with every
  qualification in the job description, we encourage you to
  apply anyway. You may be just the right candidate for this
  or other roles.

  WHY JOIN USERCENTRICS?

  - Joining Usercentrics means becoming part of a fast-growing,
    diverse, and international team of tech enthusiasts and
    entrepreneurially-minded people who build our success
    story together.
  - Company culture is important to us. We strive to
    continuously develop a positive, vibrant, and inspiring
    environment that enables everyone to thrive both
    personally and professionally.
  - Get involved! We have plenty of initiatives and love seeing
    people from all departments enthusiastically participating
    in cross-department projects and shaping our future.
  - Your work-life balance matters. We offer flexible working
    hours, hybrid working, and the possibility of workcations
    (in accordance with our company policy).
  - We always remember to have fun, both in our day-to-day work
    and at our regular team events in our offices across
    Munich, Prague, Lisbon, Copenhagen, Odense, Buenos Aires,
    and New York, or online.
  - You are our most valuable asset. We offer a personal
    development budget, job-related language courses, and much
    more to support your wellbeing and growth.
