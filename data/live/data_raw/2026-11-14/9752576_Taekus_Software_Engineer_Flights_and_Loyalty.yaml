description: |
  Taekus is a fintech and travel startup building a next
  generation premium financial services brand. As a profitable
  fintech with a $120M revenue/yr and new carrier
  partnerships, we’re entering a new stage of
  growth—significant expansion of our loyalty engine.

  We’re seeking a flights focused full-stack or backend
  engineer to help scale our flight routing & booking engine.
  This includes working with airline loyalty programs to build
  our partnerships out for flight search and booking. You will
  be joining our resident flights expert in shaping the
  Flights & Loyalty team.

  Help us tackle this $3.2T opportunity to innovate in the
  true super-premium market since the inception of rewards
  credit cards.

  Interview Process

  Candidates must be able to travel to San Francisco, New
  York, Chicago, or Austin for an onsite interview. All
  required travel will be paid for by Taekus.

  Your Responsibilities

  - Driving Core Feature Delivery: Taking ownership of major
    feature releases across the entire flight booking funnel,
    from flight search to booking creation and post-booking
    fulfillment.
  - Building logic for award ticket inventory pricing & point
    transferring to our partners.
  - Integrating with external airlines and GDS partners and
    navigating their complex communication protocols and data
    schemas.

  What You Bring to the Table

  - 6+ years of engineering experience, most recently writing
    production-grade Python
  - Experience with GDS systems, such as Amadeus or Sabre
  - Technical experience in: Python / Django, TypeScript, React,
    PostgreSQL, AWS.
  - You’re into credit card points/travel hacking and book
    yourself many flights with points — and you can play all
    those pesky airline rewards search engines like an
    instrument.
  - You’ve considered building your own flight inventory
    scrapers, have multiple credit cards, and have history
    with FlyerTalk

  You'd Love This Job If

  - You want to be in a scaling startup that is experiencing
    exponential growth.
  - You’re excited by building foundational work and enjoy
    making an impact.
  - Traveling is in your DNA and you get to apply your passion
    into your work.
  - You thrive in growing high-caliber teams and want to
    influence both technical and strategic direction.

  About Taekus

  Taekus is a 6-year-old luxury financial services company
  offering premium checking, credit, and debit accounts—paired
  with an exclusive travel rewards ecosystem. We serve an
  affluent, global customer base that expects excellence in
  both experience and execution. With $4B+ in annual
  transaction volume and strong profitability, we’re
  redefining what it means to bank beautifully.

  What We Offer

  - Competitive salary and stock option plan
  - Medical, Dental, and Vision insurance
  - 401(k) plan with 5% company match
  - Flexible vacation policy
  - Fully remote work environment
