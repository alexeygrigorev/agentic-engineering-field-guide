description: |
  At JP Morgan Chase, we understand that customers seek
  exceptional value and a seamless experience from a trusted
  financial institution. That's why we launched Chase UK to
  transform digital banking with intuitive and enjoyable
  customer journeys. With a strong foundation of trust
  established by millions of customers in the US, we have been
  rapidly expanding our presence in the UK and soon across
  Europe. We have been building the bank of the future from
  the ground up, offering you the chance to join us and make a
  significant impact.

  As a Principal Software Engineer at JPMorgan Chase within
  the International Consumer Bank, you will play a crucial
  role in this initiative, dedicated to delivering an
  outstanding banking experience to our customers. You will
  work in a collaborative environment as part of a diverse,
  inclusive, and geographically distributed team. We are
  seeking individuals with a curious mindset and a keen
  interest in new technology. Our engineers are naturally
  solution-oriented and possess an interest in the financial
  sector and focus on addressing our customer needs.

  Job responsibilities

  - Creates complex and scalable coding frameworks using
    appropriate software design frameworks.
  - Develops secure and high-quality production code, and
    reviews and debugs code written by others.
  - Architects and governs agentic AI-enabled engineering
    workflows (using enterprise-authorized tools within the
    work environment) to improve delivery speed, code quality,
    and operational outcomes at scale — including AI-driven PR
    review assistance, test generation and maintenance,
    release readiness checks, and incident triage and root-
    cause acceleration — while defining guardrails for
    validation, security, resiliency, and reuse across teams.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realised by automation at scale.
  - Serves as the function’s go-to subject matter expert.
  - Contributes to the development of technical methods in
    specialised fields in line with the latest product
    development methodologies.
  - Creates durable, reusable software frameworks that are
    leveraged across teams and functions.
  - Influences leaders and senior stakeholders across business,
    product, and technology teams.
  - Leads the design and delivery of consumer-facing financial
    product features, ensuring high availability, low latency,
    and resilient architecture for millions of end users.
  - Partners with Product, Design, and Compliance teams to ship
    customer-centric features that meet regulatory standards
    without compromising user experience.
  - Drives engineering best practices for rapid, safe iteration
    on consumer products, including feature flagging, A/B
    testing frameworks, and progressive rollout strategies.

  Required Qualifications, Capabilities and Skills

  - Formal training or certification on software engineering
    concepts and advanced applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability.
  - Expert proficiency in one or more programming languages.
  - Demonstrated experience designing and leading the adoption
    of agentic AI-enabled development practices (using
    enterprise-authorized tools within the work environment)
    across teams, including setting standards for human-in-
    the-loop validation, auditability and traceability of
    changes, and secure handling of sensitive data.
  - Strong understanding of responsible AI use and control
    expectations in engineering workflows, including security
    and resiliency implications, data sensitivity, and risk-
    based governance; ability to influence senior technical
    leaders on safe scaling patterns and reuse.
  - Experience applying expertise and new methods to determine
    solutions for complex technology problems across one or
    more technical disciplines.
  - Sound understanding of the business context and commercial
    drivers underpinning technology decisions.
  - Practical cloud-native experience.
  - Demonstrated experience launching and scaling consumer-
    facing financial products — ideally lending
  - Proven track record of owning end-to-end delivery of high-
    traffic, customer-facing systems with a focus on
    reliability, performance, and security at scale.
  - Experience navigating the intersection of consumer product
    velocity and financial services compliance, including
    fraud prevention, data privacy, and auditability
    requirements.

