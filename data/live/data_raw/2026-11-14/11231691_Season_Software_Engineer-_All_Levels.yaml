description: |
  About Season

  At Season Health, we're revolutionizing healthcare through
  our innovative telehealth platform. We connect patients with
  expert clinicians, including one of the largest networks of
  registered dietitians nationwide, to help them achieve
  meaningful health outcomes. Our integrated approach combines
  personalized clinical care with a curated marketplace
  featuring national and local vendors, all enhanced by our
  proprietary AI technology. By bridging the gap between
  medical guidance and daily decisions, we're empowering
  individuals and families to make sustainable health choices
  that demonstrably improve both clinical outcomes and quality
  of life.

  We are fortunate enough to be backed by top healthcare and
  consumer VCs such as LRVHealth, 8VC, and Andreessen
  Horowitz.

  About the role As part of the product engineering team at
  Season, you'll build products that bridge the gap between
  expert clinical guidance and patients' daily choices.
  Success in this role requires understanding two key
  perspectives: the clinicians using our platform to provide
  care, and the patients making real choices for themselves
  and their families.

  Our mature and stable platform enables our clinicians to
  deliver telehealth care to their patients, augmented by our
  AI powered engine to both improve their own workflows but
  also close the gap and provide support to patients in their
  day to day lives, in between their clinical visits.

  You will work across the stack on a multi-disciplined team
  to deliver a world class experience that helps people
  achieve their goals, easily.

  What you'll do

  - You'll work across our stack to build features that
    measurably improve our users' lives. This means:
    - Building and iterating on products based on real user
      behavior and outcomes
    - Collaborating with our clinical team to understand user
      needs and translate them into technical solutions
    - Using data to validate assumptions and measure the impact of
      your work
    - Contributing to our AI-powered features by:
      - Building applications that leverage LLMs to provide
        personalized patient support
      - Creating intuitive interfaces that make AI capabilities
        accessible to clinicians
      - Implementing and testing prompt engineering strategies
      - Integrating AI services to enhance healthcare delivery
      - Working with our broader tech team to translate clinical
        insights into user-facing features
    - Improving core user flows like signup, scheduling, chat,
      discovering food options, and telehealth visits
    - Making the healthcare ops side of the platform more
      efficient - from eligibility and benefits checking to
      billing claims

  Our Stack

  - Modern typed languages and frameworks across our full-stack
    web and mobile applications
  - Robust data infrastructure supporting analytics, ML model
    training, and production AI services
  - Production-grade AI/ML infrastructure for LLM fine-tuning
    and deployment
  - Healthcare-compliant cloud infrastructure with industry-
    standard monitoring and DevOps practices
  - Emphasis on developer experience with modern CI/CD, testing,
    and deployment workflows

  About you

  You should have

  - Proven experience building and shipping products in fast-
    paced startup environments
  - Track record of using data to drive product decisions and
    measure impact
  - Strong full-stack engineering capabilities and comfort
    learning new technologies as needed
  - Passion for understanding user behavior and business
    outcomes, not just technical elegance
  - Experience collaborating closely with product and business
    stakeholders to deliver valuable solutions
  - Drive to pragmatically balance speed, quality, and user
    value
  - Comfortable diving into things we don’t know how to do, and
    trust in yourself and your team to help get us to a
    solution
  - Data analysis ability and a desire to inform yourself and
    the company on what we should start, keep, or stop doing

  What You Get

  - A full-time role at a competitive wage with significant
    equity (compensation commensurate with level and
    experience)
  - Medical, dental, and vision benefits provided to you and
    your dependents at no cost
  - Option to participate in 401k plan
  - Flexible work arrangements, including unlimited PTO
  - Training, mentorship, and ability to learn in a fast-paced,
    high-growth environment
  - An opportunity to use your skills to help improve people’s
    lives at a mission-driven company

  Interested? How to Apply:

  To apply, please send us your resume (no cover letter is
  required). If selected, you will engage in multiple rounds
  of interviews to assess more in-depth your technical skill,
  knowledge, and working style.

  More about Season

  Season recruits, employs, compensates, and promotes
  regardless of race, religion, sex, national origin,
  ethnicity, gender identity, disability, age, veteran status
  and other protected status as required by applicable law and
  as a matter of our company ethics.
