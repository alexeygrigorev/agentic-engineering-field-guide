description: |
  About Life360

  Life360’s mission is to keep people close to the ones they
  love. Our category-leading mobile app, Tile tracking
  devices, and Pet GPS tracker empower members to protect the
  people, pets, and things they care about most with a range
  of services, including location sharing, safe driver
  reports, and crash detection with emergency dispatch.
  Life360 serves approximately 107.7 million monthly active
  users (MAU), as of September 30, 2026, across more than 180
  countries.

  Life360 delivers peace of mind and enhances everyday family
  life with seamless coordination for all the moments that
  matter, big and small. By continuing to innovate and deliver
  for our customers, we have become a household name and the
  must-have mobile-based membership for families (and those
  friends who are basically family).

  Life360 has more than 500 (and growing!) remote-first
  employees. For more information, please visit life360.com.

  Life360 is a Remote First company, which means a remote work
  environment will be the primary experience for all
  employees. All positions, unless otherwise specified, can be
  performed remotely (within the US and Canada) regardless of
  any specified location above.

  We are AI Native

  We are building an AI native company where AI is an integral
  part of how we build and operate. AI tool usage during
  interviews varies by role. You may be asked to demonstrate
  proficiency with AI tools, discuss how you leverage AI, or
  complete interview exercises without AI assistance. Your
  Recruiter will provide clear guidance as you move through
  the interview process.

  Undisclosed use of AI not previously discussed with or
  approved by your Recruiter may impact your candidacy.

  About The Team

  This role sits on the Verticals team within Life360 — the
  group building the next frontier of meaningful connection
  beyond the core family circle. This role's initial focus is
  Aging in Place: helping aging parents stay safely
  independent while giving the families around them real peace
  of mind. Over time, this role may flex to support other
  emerging verticals — Things (Tile, connected trackers) or
  Pets — as priorities shift, so we're looking for someone who
  wants to help define the pattern for new member segments,
  not just ship one feature set.

  We are a product-minded, AI-Native engineering team. That
  means AI isn't just a tool we use — it's how we work. We've
  redesigned our team workflows around AI, treating it as a
  first-class collaborator at every stage: ideation, coding,
  testing, review, and iteration. We ship faster and go deeper
  because of it, and we're looking for someone who wants to
  help define what that looks like at scale.

  About the Job

  Life360 is hiring an AI Native Senior Software Engineer — a
  senior engineer who doesn't just use AI tools, but thinks
  natively in them. You'll be central to how the Verticals
  team builds products.

  You'll design and build features that serve one of our most
  important and fastest-growing member segments: aging parents
  who want to stay safely connected with, and independent
  from, the families who care about them. As priorities
  change, you may also apply these same patterns to Things
  (connected trackers) or Pets.

  You will take full ownership of what you build from the
  first line of code through production, on-call, and the
  member impact it has. You obsess over the humans on the
  other end of the product, not just the ticket.

  Full-stack experience is required for this role — you should
  be comfortable moving between backend services and the
  mobile surfaces that expose them. Our stack spans Spring
  Boot microservices, Java, Kafka, and Kafka Streams on the
  backend, a modern cloud-native platform on AWS, and native
  iOS (Swift) and Android (Kotlin) apps on the client side.

  In your first year, success looks like having shipped end-
  to-end features serving the Aging in Place member segment
  and establishing at least one AI-native workflow the broader
  team adopts.

  For candidates based in the US, the salary range for this
  position is $103,500 to $192,000 USD. For candidates based
  out of Canada, the salary range for this position is 149,500
  to 177,500 CAD. Note: Please be aware that the job title for
  positions in Canada will be "Developer" in lieu of
  "Engineer." We take into consideration an individual's
  background, job-related knowledge, skills, and experience in
  determining final salary. Base pay may also vary based on
  geographic location, with US work locations falling into one
  of three geographic tiers.

  Total compensation is inclusive of equity compensation in
  the form of Restricted Stock Units (RSUs), as well as a
  comprehensive benefits package, including medical, dental,
  vision, financial, and other benefits.

  What You’ll Do

  - Ship end-to-end across the stack — from backend services and
    APIs through to the iOS and Android surfaces members use,
    serving tens of millions of users — moving between layers
    as the feature demands.
  - Work with AI (Claude Code) as a first-class collaborator —
    orchestrate agents to create specs, generate code, and
    perform reviews, moving faster without sacrificing
    quality.
  - Define and codify AI-Native engineering practices for the
    Verticals team, establishing playbooks the broader org can
    adopt.
  - Collaborate closely with product managers and designers to
    turn complex user problems into scalable engineering
    solutions.
  - Contribute to architectural decisions, code reviews, and a
    culture of craft and continuous improvement.
  - Participate in on-call rotation and incident response.
  - Mentor team members and contribute to team processes and
    technical standards.
  - Support performance, reliability, and accessibility across
    the features you own.
  - Adapt patterns and services built for Aging in Place to
    future verticals (Things, Pets) as team scope expands.

  What We’re Looking For

  - 4+ years of experience building and operating high-quality,
    consumer-scale services.
  - 1+ years of hands-on experience prompting, evaluating, and
    building with LLMs.
  - Full-stack proficiency spanning backend services (Java,
    Spring Boot, Kafka) and mobile client development (Swift
    for iOS and/or Kotlin for Android), with the versatility
    to work across the whole stack as needed.
  - Hands-on experience with agentic workflows, prompt
    engineering, context window management, and MCP/function
    calling.
  - A track record of using AI tooling to multiply your own
    output — not just as autocomplete, but as a development
    partner.
  - A strong sense of ownership — you don't wait to be told what
    to fix, and you follow through past "it works on my
    machine" to "it works for the member, in production, at
    scale."
  - Strong communication and collaboration skills — you work
    well with product, design, and platform engineers.
  - Excitement for defining what it means to be AI-Native —
    you're not waiting for the playbook, you want to write it.
  - Empathy for the humans behind the product — an aging parent
    trying to stay independent, or a family member trying to
    help from afar.
  - Bachelor's Degree in a Technical field, or equivalent
    experience.

  Nice-to-Have

  - Experience with IoT, telematics, or embedded/hardware-
    adjacent systems.
  - Familiarity with Kafka, Kinesis, or other high-throughput
    streaming platforms.
  - Background with observability tooling (Prometheus, Grafana,
    OpenTelemetry, DataDog).

  AI-Native Expectations

  We use AI coding tools as a professional standard on this
  team. Here's what that means in practice:

  - Daily use: You use AI coding assistants (we support Claude
    Code, Cursor, and GitHub Copilot) for real, substantive
    tasks: analysis, coding, refactoring, testing, navigating
    codebases, and documentation. Not just research or
    autocomplete but as a development partner.
  - Judgment and ownership: AI-generated code gets the same
    review you'd give any PR. You are accountable for
    everything you ship.
  - Velocity: We expect senior engineers who use AI well to
    operate with meaningful leverage — doing more with the
    same time, taking on problems that would otherwise require
    a larger team.
  - Team leadership: You share what works. You automate
    prompting strategies that others can build on and help
    teammates earlier in their AI workflow adoption get up to
    speed.
  - Continuous learning: The tooling is changing fast. You stay
    current and bring recommendations to the team when
    something would meaningfully improve how we work.

  Our Benefits

  - Medical, dental, vision, life and disability insurance plans
    (100% paid for US employees). We offer life and disability
    as well as supplemental plans for medical and dental for
    Canadian employees.
  - 401(k) plan with company matching program in the US and RRSP
    with DPSP plan for Canadian employees.
  - Paid parental leave.
  - Mental Wellness Program & Employee Assistance Program (EAP)
    for mental well-being.
  - Generous time off: flexible PTO, companywide holidays
    throughout the year plus summer and winter shutdowns.
  - Learning & Development programs.
  - Equipment, tools, and reimbursement support for a productive
    remote environment.
  - Free Life360 Platinum Membership and Tile trackers.

  AI Usage: We use AI to help make our hiring process
  efficient. That said, every hiring decision is made by real
  Life360 hiring teams

  Life360 Values

  Our company’s mission-driven culture is guided by our shared
  values to create a trusted work environment where you can
  bring your authentic self to work and make a positive
  difference

  - Be a Good Person - We have a team of high integrity people
    you can trust.
  - Be Direct With Respect - We communicate directly, even when
    it’s hard.
  - Members Before Metrics - We focus on building an exceptional
    experience for families.
  - High Intensity, High Impact - We do whatever it takes to get
    the job done.

  Our Commitment to Belonging

  Life360 is an equal opportunity employer. We don’t
  discriminate on the basis of race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, disability status, or any other legally
  protected status. We believe diverse perspectives make us
  better, and we’re building a workplace that reflects the
  communities we serve. Don’t meet every qualification? Apply
  anyway.

