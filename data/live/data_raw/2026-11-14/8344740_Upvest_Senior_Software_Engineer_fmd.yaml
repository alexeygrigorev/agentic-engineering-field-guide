description: |
  At Upvest, we are on a mission to make investing as easy as
  spending money. Upvest empowers businesses to offer a wide
  range of investment products and the best experience in the
  field of capital market investment and retirement planning.
  Upvest’s Investment API is easy to integrate so that
  fintechs and financial institutions can save resources and
  fully focus on their core business.

  We are proud to partner with Europe’s leading Fintechs and
  financial institutions such as DKB, Revolut, N26 and Raisin.
  Founded in 2017 by Martin Kassing, Upvest now brings
  together over 270 talented professionals from more than 70
  nationalities. Upvest is backed by €280M in total funding
  from world-class investors, including BlackRock, Tencent,
  Sapphire Ventures, and Bessemer Venture Partners, Earlybird,
  Notion Capital, and Motive. Our latest €105M funding round
  in March 2026 - led by Sapphire and Tencent - serves as a
  massive catalyst for our growth, allowing us to offer
  premier investment experience.

  About the role:

  Our hubs are in Berlin, London and Tallinn, but we are open
  to hire remotely from Europe and United Kingdom.

  What you’ll do:

  - Make an impact in a true product team with a large ownership
    scope.

  - Work with cutting-edge technologies (Go is the primary
    language; it’s okay if you’re willing to switch from
    another language) without a legacy codebase.
  - Work on improving the reliability of our API.
  - Deliver fast and often. We embrace an agile methodology with
    a retrospective and demo at the end of the two-week cycle.
  - Design, build and own event-driven, fault-tolerant,
    horizontally scalable distributed systems using a
    Microservice architecture powered by Docker, Kubernetes,
    Kafka and PostgreSQL.

  It’s great if you have:

  - Experience with Investment products or the Fintech domain,
    in general.
  - Experience in event-driven architectures, event streaming,
    and event sourcing systems.
  - Experience with operating services in a decoupled, event-
    driven system, leveraging modern observability tooling
    (e.g. monitoring and tracing).

  You’re likely to be successful in this role if:

  - You're excited about fintech and building the financial
    infrastructure of tomorrow.
  - You work with the customer in mind.
  - You are a true team player and feel energized in diverse
    teams.
  - You're hungry to learn and eager to grow quickly.

  How we Upvest in you:

  - Best-in-class AI tools: Every Upvenger has €20,000 per year
    to spend on the best AI tools available — so you're always
    working with the most powerful models and tooling on the
    market.
  - Impact-driven work: We’re building the infrastructure that
    will power the future of investing in Europe. It’s
    complex, ambitious, and meaningful. You’ll work with
    modern technologies and create something entirely new. No
    legacy systems, no limits.
  - Wellbeing: Recharge with 30 days of annual leave and
    maintain a healthy lifestyle with sports benefits. Access
    confidential professional coaching and enjoy the
    flexibility to work remotely abroad for up to 183 days a
    year. Recharge with UpRest, a one-month fully paid
    sabbatical after every 4 years of working at Upvest.
  - Development: Growth is in our DNA. Each Upvenger has access
    to a personal development budget and the freedom to decide
    how to use it.
  - Compensation and equity: We believe that all Upvengers
    contribute to our success and deserve a competitive,
    above-market salary and a participation in our employee
    equity program.
  - Team celebrations: Participate in company-wide events, such
    as UpFest, dinners, offsites and our Holiday party, to
    connect with colleagues and celebrate our achievements.
  - Inclusion: We’re committed to a culture where everyone
    belongs and thrives. Our Employee Resources Groups foster
    inclusion and connection, like Upfem for our female
    Upvengers, or UpVergent supporting neurodivergent
    Upvengers and allies.

  Our Values:

  - Make it easy for others. We simplify the complex and act
    with the best intentions
  - Own the outcome. We are proactive, fast and confident to get
    the job done, valuing progress over perfection.
  - Rise to the challenge. We aim high and push the boundaries.
    We stay curious, learn and celebrate our wins together.
  - Tell the story. We start with the Why to align on purpose.
    We are transparent and share knowledge to empower and
    inspire others.

  Upvest is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
