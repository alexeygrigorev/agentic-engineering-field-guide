description: |
  About Nayya

  Founded in 2019, Nayya is on a mission to connect people’s
  most important information, so they can thrive in their
  health and wealth. Powered by AI and advanced analytics,
  Nayya’s platform transforms complex benefits experiences
  into intuitive, seamless, and ongoing interactions—meeting
  people's real world needs. As a trusted platform and partner
  to leading employers, benefits solutions, and HR tech
  providers, Nayya unlocks long-term value through helping
  employees live more resilient lives. Backed by strategic
  investors like ICONIQ, Felicis Ventures, SemperVirens,
  Workday Ventures, MetLife Nextgen Ventures, and ADP
  Ventures, Nayya is ushering in the future of health and
  wealth for all.



  About the team

  Northstar is a comprehensive financial wellness platform
  that helps employees make confident decisions about their
  money. It combines personalized digital tools with access to
  financial advisors, supporting needs such as budgeting,
  retirement and equity planning, student loans, home buying,
  investing, and estate planning. The engineering team behind
  Northstar builds the tools that make that guidance possible
  - the adviser workflows that support planning and client
  management, and the client-facing experiences people use to
  understand their finances and take action.

  You'd be joining as the senior engineer on a full-stack
  team, working across the entire Northstar product: from the
  backend services and data models that power financial
  planning, to the interfaces advisers and clients use every
  day.

  What you'll do

  - Build and own full-stack features across the Northstar
    product - from Rails/Python/TypeScript services to React
    front ends
  - Identify, propose, and execute architecture changes to the
    Northstar system, including where new technologies or new
    uses of existing tools make sense
  - Design data models and workflows that support financial
    planning, adviser-client relationships, and sensitive
    financial information
  - Proactively identify technical debt before it becomes a
    long-term problem, and help the team build habits that
    keep it in check
  - Partner directly with Northstar's advisers and product team
    to translate real adviser workflows into software, and
    take nebulous problems from requirements through
    implementation and release
  - Identify security concerns in code review and partner with
    the security team on remediation
  - Evaluate new AI libraries and tools for the codebase,
    weighing application security and long-term maintenance,
    and ensure AI tool usage holds to Nayya's data privacy and
    security standards - especially with sensitive client data
  - Own services end-to-end - from design through deployment,
    monitoring, and on-call
  - Mentor other engineers on the team, weigh in on decisions
    that affect other teams, and help raise the bar on design
    and code review
  - Communicate clearly and confidently with advisers, clients,
    and executives, and build the cross-team buy-in needed to
    see larger initiatives through

  What we're looking for

  - 5+ years of professional software engineering experience,
    with real depth in full-stack development
  - Strong production experience with Rails, React, Python, and
    TypeScript
  - Comfort working with relational databases (Postgres) and
    cloud infrastructure (AWS, Heroku)
  - Experience owning services in production - monitoring, on-
    call, and incident response (we use Datadog)
  - A track record of taking ownership of features end-to-end,
    from ambiguous problem to production, including judgment
    about which decisions need more deliberation and which can
    move fast
  - Working knowledge of application security practices and
    experience raising security concerns in code review
  - Excellent written and verbal communication - you can work
    directly with advisers, product, and non-engineering
    stakeholders, and build buy-in across teams
  - Comfort working with sensitive data and an instinct for
    building things responsibly

  Nice to have

  - Experience in fintech, wealth management, insurance, or
    another regulated industry
  - Familiarity with HIPAA, SOC 2, or similar compliance
    frameworks
  - Experience evaluating or integrating AI tooling into a
    production codebase with data privacy and security in mind
  - Experience building tools for a small, specialized user
    group (e.g., internal tools, adviser/agent-facing
    software)
  - Experience participating in technical recruiting or outreach

  Why Nayya

  - Direct impact on a problem that touches almost every working
    American
  - A team that takes ownership seriously and ships reliably and
    with urgency

  The salary range for New York based candidates for this role
  is $188,000- $230,000. We use a location factor to adjust
  this range for candidates that are located outside of
  geographic region of our New York office. Placement within
  the salary band is determined based on experience.

  Nayya is proud to be an Equal Employment Opportunity
  employer. We do not discriminate based upon race, religion,
  color, national origin, gender (including pregnancy,
  childbirth, or related medical conditions), sexual
  orientation, gender identity, gender expression, age, status
  as a protected veteran, status as an individual with a
  disability, or other applicable legally protected
  characteristics
