description: |
  We’re looking for a Senior Software Engineer to play a
  pivotal role in evolving M&S’s Payments Platform. This team
  provides the critical software capabilities that power
  online payments across the business, enabling millions of
  customers to complete purchases securely, reliably, and
  seamlessly across all M&S digital channels.

  Your “customers” are product teams, engineers, business
  stakeholders, and ultimately millions of M&S customers — and
  your mission is to make them faster, more effective, and
  more confident through scalable services, resilient
  integrations, and exceptional engineering practices.

  This is a role for an engineer who is excited by building
  high-volume transactional systems, solving complex payment
  challenges, and modernising technology platforms that sit at
  the heart of M&S’s online growth ambitions.

  About the Team

  Our engineering teams enable product, engineering, and
  business teams to deliver customer experiences with speed
  and confidence. We create reliable, scalable, and secure
  platforms rooted in strong engineering standards,
  automation, and continuous improvement.

  You will join the Payments team, helping to modernise and
  evolve critical payment capabilities.

  The Payments team plays a critical role in supporting M&S’s
  online growth strategy, ensuring customers can purchase with
  confidence through secure, scalable, and reliable payment
  experiences.

  What You'll Do

  Your key accountabilities will include:

  · Design, build, and evolve payment services and
  capabilities that enable seamless customer transactions
  across M&S digital platforms.

  · Develop resilient backend services, APIs, and integrations
  that support millions of customer payment journeys every
  year.

  · Own features end-to-end, taking responsibility for
  solution design, development, testing, deployment, and
  production support.

  · Help shape the technical direction of the Payments
  platform, balancing performance, scalability, resilience,
  security, and cost through modern engineering practices.

  · Champion engineering excellence through clean,
  maintainable, and well-tested code, helping establish best
  practices across engineering teams.

  · Drive operational excellence by designing systems with
  observability, monitoring, resilience, and supportability at
  their core.

  · Utilise tools such as Dynatrace to improve platform
  visibility, monitoring, alerting, and service reliability.

  Who You Are

  · A senior backend software engineer with deep experience
  designing and delivering scalable, resilient systems in
  complex enterprise environments.

  · Strong Java engineering expertise with experience building
  enterprise services, APIs, and integrations across
  distributed systems.

  · Knowledge in designing systems that serve large customer
  populations while maintaining high availability,
  performance, and security.

  · Work with ecommerce platforms, payment services, or highly
  transactional systems is advantageous.

  · Passionate about software quality, testing,
  maintainability, and engineering best practices.

  · Strong understanding of CI/CD, observability, production
  support, and operational excellence.

  What’s in it for you

  Being a part of M&S is exactly that – playing your part to
  bring the magic of M&S to our customers every day. We’re an
  inclusive, dynamic, exciting, and ever-evolving business
  built on doing the right thing and bringing exceptional
  quality, value, service to every customer, whenever,
  wherever, and however they want to shop with us.

  Here are some of the benefits we offer that make working for
  M&S just that little bit more special…

  · 20% colleague discount across M&S products and selected
  third-party brands.

  · Competitive holiday entitlement with the potential to buy
  extra holiday days.

  · Discretionary bonus schemes awarded based on personal and
  business performance.

  · A generous Defined Contribution Pension Scheme and Life
  Assurance.

  · A tailored induction and extensive learning and
  development opportunities.

  · Amazing perks and discounts via the M&S Choices platform,
  including GymSave and the opportunity to become an M&S
  Shareholder.

  · A dedicated charity volunteer day to support a cause
  you're passionate about.

  · Access to a fantastic range of wellbeing support,
  including a 24/7 Virtual GP and wellbeing services.

  Everyone’s Welcome

  We are ambitious about the future of retail. We’re
  disrupting, innovating, and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet.

  Marks & Spencer strives to be an inclusive organisation,
  trusted and admired by our colleagues, customers, and
  suppliers.

  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and win
  together.

  If you’d benefit from any support or reasonable adjustments
  during any stage of the recruitment process, please let us
  know when completing your application.

