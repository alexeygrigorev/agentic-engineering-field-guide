description: |
  The Opportunity As a Tax Innovation - Software Engineering
  Manager you will lead software engineering work that
  supports tax technology solutions, using your technical
  background to guide design, coding, testing, and delivery
  across client support workstreams within our Tax practice.
  As a Manager you will coach team members, manage
  performance, and bring a practical approach to planning,
  prioritization, and issue resolution while supporting client
  expectations and firm objectives. In this role at PwC, you
  will help shape software products and applications that
  support digital transformation, collaborate across technical
  and tax-focused teams, and contribute to work that connects
  innovation with business needs. Responsibilities
  - Leading tax innovation software engineering workstreams from
    planning through delivery
  - Managing client-facing engagement activities and translating
    tax requirements into technical solutions
  - Guiding teams through application design, coding, testing,
    and deployment of software products
  - Reviewing system architecture, functional requirements, and
    code changes to validate alignment with solution goals
  - Overseeing continuous integration and continuous delivery
    activities across development pipelines
  - Applying C#.NET, React Native, and application lifecycle
    management skills to build and maintain applications
  - Using analytical thinking and AI fluency to identify process
    improvements and automation opportunities
  - Coaching team members on code review practices,
    troubleshooting issues, and technical development
  - Collaborating across tax innovation and software engineering
    teams to deliver scalable digital solutions
  - Maintaining alignment with professional standards, code of
    conduct, and independence requirements
  What You Must Have
  - At least a Bachelor's degree
  - At least 4 years of experience
  What Sets You Apart
  - Leading software engineering teams delivering tax innovation
    solutions
  - Managing project scope, budgeting, timelines, and
    deliverables
  - Mentoring junior engineers and coaching performance
    development
  - Applying CI/CD, application lifecycle management, and code
    review
  - Translating functional requirements into scalable
    architecture decisions
  - Using AI fluency and analytical thinking in delivery
