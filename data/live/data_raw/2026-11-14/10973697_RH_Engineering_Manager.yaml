description: |
  RH at its core is about taste, and we believe the idea of
  scaling taste is large and far-reaching.

  The RH brand attracts the best designers, artisans,
  manufacturers, and talent in our industry, scaling and
  rendering their work more valuable across our integrated
  platform, enabling us to curate the most compelling
  collection of luxury home furnishings in the world. We are
  moving the brand beyond curating and selling products to
  conceptualizing and selling spaces by building an ecosystem
  of products, places, services, and spaces that elevates and
  establishes the RH brand as a global thought leader, taste,
  and place maker.

  At RH we believe deeply that the "right" people are our
  greatest asset. We value people with high energy, who
  possess the ability to energize others. People who are
  smart, creative, and have a point of view. People who see
  the answer in every problem, versus those who see the
  problem in every answer. People who are driven, determined,
  and won't take "no" for an answer. We value team players,
  people who are more concerned with what's right, rather than
  who's right.

  The Guesthouse Engineer is a visionary, responsible for
  physical building and IT operations at RH Guesthouse. The
  ideal candidate is a seasoned and highly intelligent
  hospitality professional with expertise spanning: building
  engineering, restaurant equipment, and information
  technology.

  YOUR RESPONSIBILITIES

  - Live Our Vision, Values and Beliefs every day
  - Consistently deliver world-class service to both internal
    and external partners
  - Ensure the highest level of privacy, security, and safety
    for all associates and guests
  - Demonstrate exceptional communication and complex problem-
    solving skills
  - Proactively oversee the development and standards of all
    facilities-related operations
  - Support Guesthouse Leader with attracting, retaining,
    coaching, and developing a team of associates who don’t
    know what can’t be done

  OUR REQUIREMENTS

  - 7 - 10 years experience in the hospitality industry,
    including 5+ years leading a building facilities team
  - A luxury hospitality experience is strongly preferred
  - Certified Chief Engineer
  - Preferred certifications; NYS Certified Pool Operator, FDNY
    Fire Life and Safety, HVAC, Electrical and Plumbing
  - Expertise in hotel information technology
  - Available to work when needed, including weekends, holidays,
    and nights and travel occasionally
  - Multilingual candidates are desired

  PHYSICAL REQUIREMENTS

  - Must be able to work standing and walking for extended
    periods of time
  - Must be able to lift 50 lbs

  About UsRH is an equal opportunity employer and does not
  discriminate against any applicant on the basis of race,
  color, religion, national origin, gender, marital status,
  age, disability, sexual orientation, military/veteran
  status, or any other status protected by federal or state
  law or local ordinance.



    At RH, we are committed to promoting pay equity. Rate of
  pay is determined based on each individual's experience,
  qualifications, and the geographic location of the role.
