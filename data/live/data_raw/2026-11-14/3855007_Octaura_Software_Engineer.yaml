description: |
  Come build what the market has been missing.

  Octaura is a technology company transforming how some of the
  world’s largest, least digitized markets operate. In loans
  and CLOs, trillions of dollars still move through phones,
  emails, and PDFs because the right infrastructure hasn’t
  existed — until now.

  We’re applying AI, real-time data, and modern software
  design to asset classes long overlooked by fintech. Our
  platforms turn fragmented information into intelligence,
  manual workflows into automation, and legacy conventions
  into scalable market infrastructure.

  You’ll join a high-impact, collaborative team building the
  systems these markets need to become more transparent,
  efficient, and connected.



  The role in a nutshell

  Octaura is building out our tech team and we’re looking for
  Software Engineers interested in building high performance,
  next generation technology that will revolutionize the loans
  industry. This is an environment for those seeking to drive
  innovation and get charged up working with top engineering
  talent. We are looking for results-oriented developers who
  thrive in a fast-paced, collaborative environment, and enjoy
  solving challenging and complex customer problems.



  This is an exciting time for Octaura as we are rapidly
  growing and are looking for energetic, collaborative and
  driven thinkers to join us! Please note this role is based
  out of our NYC office (at 5 Penn Plaza, 6th Floor, New York,
  NY 10001) and our current structure is 4 days in the office
  (Monday-Thursday), 1 day from home (Friday).



  Core responsibilities

  - Work with a team of smart and passionate engineers to build
    and maintain our proprietary electronic trading platform
  - Use modern tools and methods to expand the capabilities of
    our cloud-based application
  - Help to transition development of our platform to our in-
    house team
  - Collaborate with product teams to develop solutions for
    current and future customers

  Desired experience

  - 8+ years of experience software engineering and data-related
    technologies
  - Bachelor’s degree in computer science, engineering, or
    related field
  - Experience in Java (strongly preferred) or other Object-
    Oriented languages
  - Experience in React, TypeScript desirable
  - Experience in CSS, State Management (Redux / Context API),
    WebSockets desirable
  - Experience with Multithreading Design Patterns
  - Experience with relational databases and SQL
  - Experience building cloud-based applications
  - Effective communication, organizational, and analytical
    skills

  The base pay range for this position in New York is $180,000
  - $200,000 annually. Pay may vary depending on job-related
  knowledge, skills, and experience. Equity and year-end bonus
  may be provided as part of the compensation package, in
  addition to a full range of medical, financial, and other
  benefits, dependent on the position offered. Applicants
  should apply via Octaura's internal or external careers
  site.

  Octaura Work Perks

  At Octaura, our people are our most valuable asset, and we
  are pleased to offer the following benefits to all full-time
  employees:

  - Competitive compensation and equity
  - Flexible Paid Time Off
  - Competitive Parental Leave
  - Daily breakfast, coffee and snacks in the office
  - 90% company-paid healthcare
  - Onsite gym & discounted membership

  We’re committed to equal opportunity employment

  Octaura is committed to a diverse and inclusive workplace.
  We are an equal opportunity employer and do not discriminate
  on the basis of race, national origin, gender, gender
  identity, sexual orientation, protected veteran status,
  disability, age, or other legally protected status.
