description: |
  CyberSheath Services International LLC is a rapidly growing
  Managed Services Provider primarily focused on providing
  Cybersecurity services to the Defense Industrial Base (DIB).
  We are excited to be expanding our staff due to our growth
  and are looking to add to our team!

  CyberSheath integrates compliance and threat mitigation
  efforts and eliminates redundant security practices that
  don’t improve and, in fact, may weaken an organization’s
  security posture. Our professionals tell clients where to
  stop spending, where to invest, and how to take what they
  are already doing and integrate it in a way that delivers
  improved security.

  Successful candidates for CyberSheath are self-motivated,
  think out of the box, work, and solve issues independently.
  Additionally, our most successful people are self-starters
  and willing to put on many hats in order to succeed.
  CyberSheath is fast-growing and seeks candidates who want to
  be part of our upward trajectory.

  Job Overview

  The Manager of IT Engineering is a leadership role
  responsible for overseeing the strategy, development,
  delivery, and performance of all engineering operations
  within the CyberSheath. This position ensures that
  infrastructure, cloud, and compliance engineering teams
  deliver scalable, secure, and high-quality technology
  solutions that meet client requirements while driving the
  company’s long-term technical vision. The Manager of IT
  Engineering will collaborate closely with executive
  leadership, technical teams, and clients to align
  engineering initiatives with business growth and operational
  efficiency.

  Key Responsibilities

  - Strategic Leadership
  - Engineering Management
  - Operations and Service Excellence
  - Innovation and Continuous Improvement
  - Client and Stakeholder Engagement

  Qualifications

  - Bachelor’s degree in Computer Science, Information Systems,
    Engineering, or equivalent experience.
  - 10+ years of progressive IT infrastructure and engineering
    experience, with at least 3 years in a leadership capacity
    within a managed service provider or consulting
    environment.
  - Proven expertise in managing large-scale enterprise
    environments, hybrid cloud solutions, and security
    frameworks.
  - Strong technical depth in Microsoft technologies (M365 GCC
    and GCC High, Entra ID, Intune, Azure IaaS including in
    Azure Gov), virtualization (VMware, Hyper-V), networking,
    and cybersecurity.
  - Experience with ITIL principles, change management, and
    process improvement initiatives.
  - Excellent business acumen, ability to translate client needs
    into technical solutions, and strong communication skills
    across all levels.

  Work Environment

  - A virtual work environment

  CyberSheath is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, gender identity,
  national origin, age, protected veteran status, among other
  things, or status as a qualified individual with a
  disability.

  Budgeted Pay Range

  $155,000—$175,000 USD
