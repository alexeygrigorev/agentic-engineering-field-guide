description: |
  Title: Senior Software Engineer

  Location: Remote (HQ in Columbia, MD)

  Position Type: Full-Time, Non-Contract position (Corporate
  Position)

  Must be willing to submit for a security clearance. U.S.
  Citizenship is required.

  The Opportunity

  Are you creative, detail-oriented and love to create quality
  products? Do you enjoy working in an agile, collaborative
  environment? If so, we encourage you to apply! TeamWorx
  Security is seeking a Senior Software Engineer to join our
  growing team! As the Senior Software Engineer, you will help
  us expand and build our platform and products. It’s all
  about creation and innovation!

  You will be involved in all aspects of the development
  process ranging from backend and front-end engineering,
  deploying our machine learning and AI solutions, and
  deploying our cloud-based systems. Working with a dynamic,
  innovative team, your fast-paced and thorough approach will
  directly influence engineering and product decisions. Your
  expertise and commitment to ship product will deliver
  business-critical functionality and the development of new
  features.

  Our Ideal Candidate:

  - Innovative
  - Insatiably curious

  - Loves to find smart solutions to challenges
  - Likes to work in a team-oriented environment

  - Take ownership of projects and drive them to completion.

  - Possession of excellent analytical skills
  - Great attitude!

  Key Responsibilities:

  - Drive next generation of software products
  - Innovate and identify opportunities
  - Participate in defining team culture and product vision
  - Develop efficient, reliable, testable code
  - Mentor team members through the product engineering
    lifecycle

  - Collaborate with business partners to build and launch new
    features
  - Exploring, learning, and building cool technologies, making
    mistakes, and learning along the way.

  Minimum Requirements:

  - Bachelor’s degree in computer science, Engineering,
    Mathematics or similar, and 5 years of technical
    experience
  - OR 8 years of technical experience (we count Military
    experience too!)
  - Minimum of 5 years’ experience as a Full Stack Developer or
    similar role
  - Must have experience with React and Node.js or similar
    technologies
  - Experience using and integrating AI and ML technologies into
    application products
  - US citizenship required and willing to submit for a DoD
    security clearance (if you already hold one, even better!)

  What's in it for you?

  No more bullet points for starters. We pay higher than
  industry standards! Also, these awesome perks: Comprehensive
  Health, Dental, & Vision Insurance, Short-Term Disability &
  Life Insurance, Matching 401(k) Contributions, Paid Time Off
  including 11 Holidays and your Birthday, Parental Leave,
  Professional Development, Fitness Membership, and Home
  Office allocations, Performance Bonuses & Profit Sharing, &
  Employee Referral Bonuses. But wait, there's more: TeamWorx
  Security is committed to our teammates and their
  professional goals. Being a small but growing company
  affords us the opportunity to work WITH YOU to reach your
  full potential.

  A Little About Us and Our Team

  We love to be inspired. We started TeamWorx Security to
  build, create, and dream about what inspires us, and because
  of this, our Maryland startup is quickly growing. We are a
  team of data scientists, software engineers, researchers,
  product developers, and operation-minded folks who
  specialize in developing applications and products that our
  customers love. Our mission is to reinvent the way technical
  and non-technical people work with technology. We believe in
  creating harmonious, automated solutions designed to improve
  our customers’ daily workflow, allowing them to act quickly
  and decisively about what matters most. We are looking for
  critical thinkers who excel at solving problems and have a
  passion for what they do to help us move our mission
  forward. This is our story; come tell us yours.

  At TeamWorx Security, Inc., we hold our values as guiding
  principles in all that we do and encourage our community to
  embrace and embody them. Our core values are putting our
  people first, being curious, being authentic, being scrappy,
  and honoring those who serve. These values drive our company
  culture, decision-making, and operations.

  Commitment to Equal Opportunity

  All qualified applicants will receive consideration for
  employment without regard to sex, race, ethnicity, age,
  national origin, citizenship, religion, physical or mental
  disability, medical condition, genetic information,
  pregnancy, family structure, marital status, ancestry,
  domestic partner status, sexual orientation, gender identity
  or expression, veteran or military status, or any other
  basis prohibited by law. TeamWorx Security will also
  consider the employment of qualified applicants with
  criminal histories, consistent with relevant laws.
