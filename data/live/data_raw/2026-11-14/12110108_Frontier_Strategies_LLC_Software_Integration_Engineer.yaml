description: |
  This is a remote position.



  Software Integration Engineer





   Location: Remote





   Schedule: Monday–Friday, 8:00 a.m.–5:00 p.m. Eastern Time





   Employment Type: Full-Time





   Category: Defense Health IT



  Provide technical leadership and hands-on support for the
  integration, sustainment, enhancement, testing, and
  deployment of the Database System, E-file, and associated
  production and pre-production environments.




  The position supports an Entellitrak-based case-management
  solution using Java and Java Enterprise Edition
  technologies. The Software Integration Engineer will develop
  and integrate system components and interfaces, resolve
  complex production issues, maintain database schemas,
  support Agile software releases, and ensure solutions comply
  with DoW technical, cybersecurity, configuration-management,
  and testing requirements.




  Key Responsibilities



  - Analyze, design, develop, integrate, test, deploy, and
    sustain software solutions.
  - Develop and maintain system interfaces, application
    components, database schemas, scripts, APIs, web services,
    and integration workflows.
  - Support Entellitrak, Java/JEE applications, Microsoft SQL
    Server, and related commercial off-the-shelf products.
  - Apply DoD Agile acquisition and development practices,
    including backlog refinement, sprint planning, user-story
    execution, code reviews, demonstrations, and release
    planning.
  - Investigate and resolve Tier III trouble tickets, software
    defects, production incidents, interface failures, and
    application-performance issues.
  - Conduct root-cause analyses and recommend improvements to
    system reliability, availability, maintainability,
    security, and performance.
  - Develop code fixes, enhancements, architectural updates,
    code refactoring, database modifications, and reporting
    solutions.
  - Maintain system and database compliance with Military Health
    System data standards.
  - Support monitoring dashboards, system alerts, log analysis,
    performance testing, database tuning, and proactive issue
    identification.
  - Perform development integration testing, smoke testing,
    regression testing, and troubleshooting during Government
    system integration and independent verification and
    validation testing.
  - Develop test procedures, test scripts, test reports, release
    documentation, version descriptions, installation
    instructions, and technical implementation materials.
  - Ensure software changes, patches, upgrades, and
    configuration updates are fully tested and approved before
    deployment to production.
  - Follow DoW configuration, change, requirements, release, and
    source-code management processes.
  - Deliver complete source code, executable code, libraries,
    build instructions, database files, API documentation, and
    supporting technical documentation.
  - Support authentication modernization, including the
    transition from ForgeRock Policy Agent to SAML-based
    authentication.
  - Implement cybersecurity requirements, including Risk
    Management Framework controls, DISA STIGs, NIST standards,
    vulnerability remediation, access controls, audit logging,
    PKI, and secure coding practices.
  - Participate in weekly technical meetings, Agile ceremonies,
    test-status meetings, release activities, and ad hoc
    Government technical reviews.
  - Support occasional evening or weekend production
    deployments, emergency operations, and incident-response
    activities.


    Requirements






  - Bachelor’s degree in Computer Science, Information Systems
    Management, Mathematics, Engineering, or a related field;
    equivalent directly relevant work experience may be
    accepted.
  - Minimum of 10 years of IT experience, including system
    integration and system-interface development.
  - Minimum of 10 years of technical experience related to
    Health IT.
  - Demonstrated experience developing DoD systems using the
    DoDI 5000.02 Agile development process.
  - Knowledge of computer concepts and techniques used to
    develop automated solutions for engineering, scientific,
    business-data acquisition, or data-management
    requirements.
  - Demonstrated experience designing and implementing database
    schemas.
  - Experience with Java, Java Enterprise Edition, relational
    databases, web applications, APIs, and enterprise-system
    integration.
  - Experience troubleshooting production applications and
    performing root-cause analysis, defect correction,
    testing, and release support.
  - Understanding of software configuration management, source-
    code control, change management, and technical-
    documentation requirements.
  - Strong analytical, technical-writing, communication, and
    problem-solving skills.
  - Must be legally authorized to work in the United States.



  - Experience with Entellitrak or a comparable case-management
    or workflow platform.
  - Experience with Microsoft SQL Server, ServiceNow, SAML,
    ForgeRock, web services, XML, SOAP, application servers,
    and milCloud environments.
  - Experience supporting DHA, the Military Health System, or
    another DoD Health IT program.
  - Familiarity with DoD RMF, DISA STIGs, NIST controls,
    Authority to Operate sustainment, PKI, vulnerability
    management, and incident response.
  - Experience with Agile, DevSecOps, CI/CD pipelines, automated
    testing, configuration management, and release automation.
  - Security+, Java, Microsoft, AWS/Azure, Scrum, SAFe, or
    comparable technical certification.







    Benefits

  401k matching, health, vacation, sick and others
