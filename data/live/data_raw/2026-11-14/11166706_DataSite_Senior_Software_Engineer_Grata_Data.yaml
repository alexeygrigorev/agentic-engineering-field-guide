description: |
  About us

  Datasite is the essential infrastructure for M&A. Also
  comprising Grata, Blueflame AI, and Sherpany, we help
  dealbreakers find opportunities, manage transactions, and
  make key decisions.

  Whatever your talents, you can find a place for them here.
  Get involved in some of the biggest business ventures today.
  Work with other gifted people around the world. Follow your
  ambitions, or discover a whole new path.



  Can you help us simplify the complex, create great
  experiences, and deliver better outcomes? Then let's talk.

  Job Description:

  We are looking for a Sr Backend Engineer (Python) to join
  our team! The ideal candidate is a passionate and
  experienced professional with a strong track record of
  developing efficient, high-performance technologies.

  You'll bring your expertise in engineering principles,
  exceptional system design skills, and a product-focused
  mindset to enhance our data systems and applications,
  delivering even greater value to our enterprise users. If
  you're excited about contributing to a cutting-edge private
  company search engine, we want to hear from you!

  This is a hybrid position in NYC with 3 days in office on
  Mondays, Tuesdays and Thursdays.

  What You Will Do:

  - Craft high-quality code that meets our internal standards
    for style, maintainability, and best practices for
    scalable software systems. Uphold and advocate for these
    standards during code review.
  - You will work closely with a Full Stack team to deliver new
    user experiences
  - Drive improvements to product quality, security, and
    performance that impact your team
  - Optimize the runtime of our distributed system, including
    AWS services, databases, and our search engine. Your goal
    will be to achieve ambitious performance targets at all
    levels of our architecture, from the customer-facing API
    down to the lowest layer.
  - Collaborate with Machine Learning Engineers to develop new
    AI-powered features.
  - Design and deploy scalable data infrastructure within a
    distributed event-driven architecture.
  - Prototype and experiment with new technologies and tools as
    part of ongoing innovation efforts.

  What we are looking for:

  - Minimum of 5+ years experience as a Software Engineer.
  - A Bachelor's degree in Computer Science/Engineering or
    equivalent work experience.
  - Solid experience with Python.
  - Strong understanding of Data Structures and Algorithms.
  - You have excellent communication and collaboration skills.
  - Experience working with and building user facing features.
  - Familiarity with AWS and its suite of services.
  - Experience working with event-driven microservice
    architectures in production environments.
  - Demonstrated experience in collaboration on features from
    the conceptual phase through to release.
  - Bonus points if you have experience with ElasticSearch or
    MongoDB

  The base salary range represents the estimated low and high
  end for this position based on a good faith assessment of
  the role and market data at the time of posting. Consistent
  with applicable law, each candidate’s compensation offer may
  vary and will be determined based on but not limited to,
  your geographic region, skills, qualifications, and
  experience along with the requirements of the position. This
  position may be eligible for bonuses, commissions, or
  overtime if applicable. Benefits include health insurance
  (medical, dental, vision), a retirement savings plan, paid
  time off, and other employee benefits. Specific details will
  be provided during the interview process. Datasite reserves
  the right to modify this pay range at any time.

  $118,800.00 - $207,200.00

