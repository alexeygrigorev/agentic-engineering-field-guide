description: |
  SailPoint’s Cybersecurity organization is seeking a Security
  Software Engineer with a passion for cybersecurity and
  protecting the organization. As an integral member of
  SailPoint’s Security Architecture and Engineering team, you
  will take on a challenging and highly impactful role that
  goes far beyond out-of-the-box vendor capabilities. We are
  looking for an API-first problem-solver to write the custom
  code and tool-agnostic middleware necessary to bridge our
  diverse security stacks. By building these advanced
  integrations, you will unlock maximum value and next-level
  security controls from our existing investments, giving you
  the unique opportunity to directly shape the future of our
  technical defenses and drive the execution of our
  overarching security program.

  You will join a highly capable team of emerging and
  established talent, collaborating across Security
  Operations, IT, and Engineering to serve as a technical
  ambassador for the Cyber organization. We need a builder who
  naturally embodies SailPoint’s 4 I’s (Individual, Impact,
  Innovation, and Integrity) - someone who eagerly embraces
  complex challenges and acts as a positive, driving force
  within our thriving work culture. Ultimately, your
  innovative solutions will not only secure our enterprise but
  contribute meaningfully to the broader cyber ecosystem.

  This position can be remote or based in Austin, TX.

  Responsibilities:

  - Develop, test, and maintain robust, scalable custom security
    tools, middleware, and automation scripts that integrate
    isolated security platforms (e.g., Identity/Entra ID,
    MDM/Intune, EDR, SIEM, and SaaS apps)
  - Utilize API methodologies (REST, GraphQL, Webhooks) to
    create tool-agnostic data flows, enabling automated
    enforcement and telemetry sharing across the security
    stack
  - Assist in identifying limitations in out-of-the-box vendor
    capabilities (such as custom mobile application management
    enforcement or complex access workflows) and contribute to
    building custom software to close those gaps
  - Develop and support intuitive user interfaces (UIs) and
    dashboards for internal security tools, ensuring they are
    accessible and highly usable for Security Operations and
    business personnel
  - Support and help maintain automated deployment pipelines for
    security controls, incident response playbooks (SOAR), and
    continuous monitoring workflows
  - Work with internal stakeholders to understand requirements,
    translating security policies into automated, code-driven
    solutions
  - Ensure custom development follows strict information
    security, secure coding (SSDLC), and compliance standards
    (e.g., ISO, NIST, SOX, etc.)

  Background & Experience:

  - 2-4 years of experience in software engineering, security
    automation, or DevOps, specifically focused on building
    internal tools or integrations
  - Experience with full-stack development, including working
    knowledge of modern frontend frameworks (e.g., React, Vue,
    or Angular) to build responsive web applications
  - Solid proficiency in languages suited for API integration
    and automation (e.g., Python, Go, or Node.js)
  - Hands-on experience working with APIs, OAuth/OIDC
    authentication flows, webhooks, and building integration
    layers
  - Familiarity with hosting custom tooling in cloud
    environments (preferably AWS), utilizing serverless
    architectures (Lambda) or containerization
    (Docker/Kubernetes)
  - Solid understanding of foundational enterprise security
    concepts, particularly Identity & Access Management (IAM),
    Zero Trust, and Endpoint/Mobile Security (MAM/MDM)
  - Experience or familiarity with CI/CD release automation
    (Jenkins, GitLab CI, GitHub Actions), Infrastructure as
    Code (Terraform), and system debugging
  - Strong interpersonal and teaming skills - ability to work
    collaboratively within cross-functional teams
  - Ability to operate in an agile, fast-paced environment

  Benefits and Compensation listed vary based on the location
  of your employment and the nature of your employment with
  SailPoint.

  As a part of the total compensation package, this role may
  be eligible for the SailPoint Corporate Bonus Plan or a
  role-specific commission, along with potential eligibility
  for equity participation. SailPoint maintains broad salary
  ranges for its roles to account for variations in knowledge,
  skills, experience, market conditions and locations, as well
  as reflect SailPoint’s differing products, industries, and
  lines of business. Candidates are typically placed into the
  range based on the preceding factors as well as internal
  peer equity. We estimate the base salary, for US-based
  employees, will be in this range from (min-max, USD):

  $69,200 - $116,584.00

  Base salaries for employees based in other locations are
  competitive for the employee’s home location.

  Benefits Overview

  1. Health and wellness coverage: Medical, dental, and vision
  insurance

  2. Disability coverage: Short-term and long-term disability

  3. Life protection: Life insurance and Accidental Death &
  Dismemberment (AD&D)

  4. Additional life coverage options: Supplemental life
  insurance for employees, spouses, and children

  5. Flexible spending accounts for health care, and dependent
  care; limited purpose flexible spending account

  6. Financial security: 401(k) Savings and Investment Plan
  with company matching

  7. Time off benefits: Flexible vacation policy

  8. Holidays: 8 paid holidays annually

  9. Sick leave

  10. Parental support: Paid parental leave

  11. Employee Assistance Program (EAP) and Care Counselors

  12. Voluntary benefits: Legal Assistance, Critical Illness,
  Accident, Hospital Indemnity and Pet Insurance options

  13. Health Savings Account (HSA) with employer contribution

