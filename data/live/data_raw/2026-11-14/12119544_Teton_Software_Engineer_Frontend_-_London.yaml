description: |
  About Us

  Teton is redefining the role of healthcare workers through
  cutting-edge AI technology and a great product experience.
  As populations get older and staff shortages grow,
  healthcare systems are under pressure. Our mission is to
  decrease the cost of healthcare while improving the quality
  of care.

  Our product enables care teams to intervene, prevent and
  operate more efficiently. Our ambient sensors in resident
  rooms capture activity, sleep, respiration, gait and more.
  These signals are used both to react fast to risk events,
  like falls, and for long-term health analysis that care
  teams can act on.

  Teton is scaling fast, operating in the Nordics, UK, DACH
  and US. We recently raised a $20M Series A. Expect travel to
  the US to meet users and team members.

  We focus relentlessly on product excellence and user
  experience, deploying solutions at speed that make a
  tangible difference for carers. We are an aspiring
  meritocracy biased towards action, always striving to raise
  the bar. If you are driven by impact, speed and leveling up,
  this might be the place for you.

  If you are looking for a 9-17 job, perform best with
  structure and struggle dealing with unknowns, this is not
  for you. We believe close collaboration between a hard-
  working, high-agency team enables the fastest and most
  efficient iteration cycles, helping us build an impactful
  product that healthcare professionals truly love to use.

  The Job

  We're looking for an experienced Frontend Engineer to own
  customer-facing features from the first conversation with a
  care team to the feature running in production. Care workers
  rely on our product during every shift and care managers use
  it to follow up on their residents, on mobile and on the
  web. This isn't a ticket-taking role. You'll talk to users,
  cut scope, build the features, and check afterwards whether
  what you shipped actually made a shift easier. Alongside
  that, you'll help own the quality of how we build: the
  tests, pipelines and guardrails that let us ship fast
  without breaking what care teams depend on.

  In this role, you will focus on:

  - Feature Development: Own features end-to-end, from design
    discussions through implementation to production rollout
    across multiple markets and languages, on the web app, the
    mobile app and the APIs behind them.
  - Customer Insight: Talk to care staff and our customer
    success team every week, visit care facilities, and turn
    what you hear into clearly scoped product changes. Come
    with ideas, sketch the solution, and push it forward.
  - Code Quality & Guardrails: Help own code quality across the
    frontend. Improve our CI/CD pipelines and automated tests,
    keep the infrastructure scalable, and build the guardrails
    that let AI coding agents contribute safely.
  - Backend & APIs: Work with the APIs, data models and services
    your features need. You will not just consume APIs, you
    will help shape, improve and fix the systems behind them.
  - Quality, Privacy & Safety: Ship with care for health data:
    sensible access control, auditability and privacy by
    default. Use staged rollouts so new features never get in
    the way of the alerts care teams depend on.

  Qualifications

  - Several years of experience building production web
    applications.
  - Strong TypeScript skills: this is the language for
    everything we build.
  - Solid production experience with React on the web and/or
    React Native.
  - Experience with CI/CD and automated testing, and a strong
    sense of what good code quality looks like.
  - Great product taste and a keen eye for UX. You work well
    with designers and can make sensible design decisions
    yourself when needed.
  - Comfortable talking directly with non-technical users and
    turning messy feedback into concrete decisions.
  - Previous startup experience and/or shipping a product where
    you owned the outcome, from idea to adoption.X
  - Strong problem-solving skills and the ability to work both
    independently and in a team.

  Nice to Have

  - Experience with React Native and Expo in production.
  - Experience working with AI coding agents in a real codebase.
  - AWS or equivalent cloud platform experience.
  - Familiarity with TanStack, real-time systems or push
    notifications.
  - Experience with health data or other regulated, privacy-
    sensitive domains (e.g. GDPR).

  What We Offer

  - Participation in our warrant program (stock options).
  - A small team where your decisions directly shape the
    product.
  - A Copenhagen-based office with close collaboration, no
    async-only culture.
  - Work on software that healthcare workers depend on every
    day, the impact is tangible and immediate.

  Join Our Team

  We're looking for individuals who share our vision and value
  ownership and entrepreneurship over a conventional job.

  At Teton, you'll have the chance to make a real impact with
  your work.

  If you're ready for more than just a job, come aboard and be
  part of our mission to transform healthcare.
