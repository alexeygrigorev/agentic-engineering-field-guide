description: |
  ABOUT SLATE

  At Slate, we’re building safe, reliable vehicles that people
  can afford, personalize and love—and doing it here in the
  USA as part of our commitment to reindustrialization. The
  spirit of DIY and customization runs throughout every
  element of a Slate, because people should have control over
  how their trucks look, feel, and represent them.

  Who we are looking for:

  Slate is looking for a Senior Software Development Engineer
  to design and build features and services for our digital
  platform. We’re building a direct-to-consumer EV brand from
  the ground up, and our software connects customers to their
  Slate at every step, from discovering and customizing their
  vehicle to managing their ownership journey.

  You’ll own the design and delivery of complex features and
  services, work closely with product and UX, and see your
  work shape the customer experience.

  You’re comfortable when the path is not always defined. You
  enjoy solving complex problems, making sound decisions with
  incomplete information, and balancing speed with long-term
  quality. At Slate, there is no distance between what you
  build and the impact it creates. Your work will help define
  how customers experience an entirely new automotive brand.

  What you get to do:

  - You design, build, and deliver complex features and
    services, and you decide the technical approach on new
    assignments.

  - You code and test system components and give thoughtful,
    constructive code and design reviews.

  - You own end-to-end quality for your work, including unit,
    functional, and integration tests.

  - You simplify where you can, bringing creativity and good
    judgement to complex problems with many variables.

  - You work with UX and product teams to turn customer needs
    into solution.

  - You are a trusted technical resource and make sound trade-
    off decisions in your area.

  - You understand how your technical choices affect customers
    and the business, and you raise risks early.

  - You build relationships outside your immediate area,
    coordinate the work of others, and mentor and support your
    team.

  What you bring to the team:

  - 6+ years of professional software development experience
    building customer-facing software systems.

  - Experience owning the design and delivery of complex
    features or services, and making sound technical trade-
    offs.

  - Experience building reliable, scalable web services and
    APIs, with working knowledge of cloud infrastructure.

  - Ability to solve complex problems, simplify where possible,
    and deliver high-quality work with minimal direction.

  - Experience integrating third-party services through APIs,
    events, or webhooks.

  - Experience with ecommerce or marketplace systems is a plus.

  WORK AUTHORIZATION

  Applicants must be authorized to work in the United States
  on a permanent basis. We are unable to offer visa
  sponsorship at this time.

  SALARY RANGE

  The compensation for this position is the range Slate
  reasonably and in good faith expects to pay for the position
  taking into account the wide variety of factors that are
  considered in making compensation decisions, including job-
  related knowledge; skillset; experience, education and
  training; certifications; work location; and other relevant
  business and organizational factors.

  155,854.00 - 233,781.00 USDUSD Annual Base

  ADDITIONAL COMPENSATION AND BENEFITS

  Slate offers a wide range of competitive benefits, including
  medical, dental, vision, life insurance, disability
  insurance, vacation, and 401k. The successful candidate may
  also be eligible to participate in the equity program and/or
  a discretionary annual incentive program, subject to the
  rules governing such programs.

  WHY JOIN TEAM SLATE?

  At Slate, we’re fueled by grit, determination, and attention
  to detail. The start-up spirit of ingenuity and
  resourcefulness move our business forward. Team Slate
  fosters a culture of excellence, innovation, and mutual
  respect, and is motivated by shared principles.

  - Safety First
  - Delight Customers
  - One Team
  - Relentless Improvement
  - Fast, Frugal, and Scrappy
  - Respectful Collaboration
  - Positive Legacy

  WE WANT TO WORK WITH PEOPLE THAT REFLECT THE COMMUNITIES IN
