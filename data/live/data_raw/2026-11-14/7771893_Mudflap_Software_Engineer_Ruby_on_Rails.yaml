description: |
  At Mudflap, we're modernizing the $1 trillion trucking
  industry, the backbone of the U.S. economy. By helping over
  100,000 underserved small businesses save over $1.5 billion
  on fuel, Mudflap has quickly grown into a profitable fintech
  platform that processes billions in annual payment volume.
  Work Location: This can be a fully remote position. While we
  operate across multiple time zones, most collaboration
  happens during Pacific Time working hours. Candidates should
  be able to work a schedule aligned with the PT time zone.

  To support our team, we offer:

  - Commuter benefits to ease your travel
  - Lunches and snacks to keep you fueled
  - A collaborative, high-growth environment where you’ll work
    closely with talented teammates across the company

  Expectations (In this role, you will):

  Depending on your experience level, you’ll:

  - Build and scale production-grade web applications and APIs
    using Ruby on Rails.
  - Collaborate cross-functionally with product, design, and
    business teams to deliver impactful solutions.
  - Own features end-to-end — from technical design and
    implementation to deployment and monitoring.
  - Design and evolve architecture to ensure scalability,
    reliability, and performance.
  - Create clean, well-tested, maintainable code, with
    thoughtful attention to detail and edge cases.
  - Mentor teammates, conduct code reviews, and elevate
    engineering standards (for senior and staff levels).
  - Contribute to technical strategy and system design for key
    initiatives (for staff and team leads).
  - Continuously improve processes and tools to enable faster,
    higher-quality development.

  Experience (What we look for):

  We hire talented engineers across experience levels. Here’s
  how we think about it:

  Software Engineer (1+ years)

  - Professional experience building web applications or APIs.
  - Familiarity with Ruby on Rails or similar frameworks.
  - Solid understanding of SQL databases (we use Postgres/AWS
    Aurora).
  - Comfortable with Git, testing, and debugging.
  - Curious, eager to learn, and passionate about growing your
    skills.

  Senior Software Engineer (4+ years)

  - Deep experience building scalable production systems in Ruby
    on Rails.
  - Strong understanding of API design, database schema design,
    and integrations.
  - Ability to take ownership of complex features and projects.
  - Excellent communication skills and a desire to mentor
    others.
  - Pragmatic problem-solver who balances speed, quality, and
    long-term sustainability.

  Staff / Team Lead Engineer (8+ years)

  - Proven technical leadership experience in designing large-
    scale systems.
  - Expertise in Ruby on Rails and backend architecture.
  - Track record of mentoring, influencing technical direction,
    and driving key initiatives.
  - Strong sense of ownership and accountability for outcomes.
  - Strategic thinker who can simplify complex problems for
    others.
  - For Team Lead candidates, experience managing 2+ full-time
    employees.

  Our Tech Stack

  - Backend / API: Ruby on Rails
  - Database: Postgres / AWS Aurora
  - Web: Vue.js + REST
  - iOS: Native (Swift)
  - Android: Native (Kotlin)
  - Infrastructure: AWS (ECS), CircleCI for CI/CD

  Perks and Benefits (What we offer):

  - Competitive salary and equity in a high-growth startup
  - Multiple health benefit options
  - Responsible Time Off
  - 401(k) matching
  - Opportunities and support for major career growth
  - Annual Company offsite event (Mudfest!)

  The salary range for this role is $150,000 - $295,000. This
  information reflects a base salary range for this position
  based on current market data, which may be subject to change
  as new market data becomes available. The candidate's
  skills, experience, location, and other relevant factors
  will determine the exact compensation.

  Company Overview (Who we are):

  Mudflap is on a mission to transform the trucking and
  logistics industry by leveling the playing field for owner
  operators and small fleets. Backed by top-tier venture
  investors, including QED, Matrix Partners, Commerce
  Ventures, NFX, and 500 Startups and included in the Forbes
  Fintech 50 list, Mudflap offers fleet fuel management
  solutions. Our core team hails from Disney, Uber, Procore,
  DoorDash, Google, Meta, Capital One, Affirm and Brex.

  Here are the core values that we believe in and look for in
  new teammates:

  - Be Customer Obsessed: We deeply understand customer needs
    and put our customers at the center of everything we do
  - Make it Count: Act like an owner by focusing on the impact
    of your work
  - Find a Way: Be a creative problem solver who pushes past
    roadblocks to win for our customers and our teammates
  - Sweat the Details: We keep our standards high and achieve
    them by paying attention to every detail
  - Be Curious: Use a growth mindset to question assumptions,
    take calculated risks and stretch the boundaries of what’s
    possible
