description: |
  Company Overview Join our innovative team at RECAP, a
  startup revolutionizing the real estate investment
  landscape. We are looking for a motivated Junior Full Stack
  Developer to be an integral part of our team, with
  opportunities for learning and growth in a dynamic
  environment.

  Job Description As a Junior Full Stack Developer at RECAP,
  you will assist in the development and maintenance of our
  software applications. This role is ideal for someone who
  has foundational knowledge in full stack development and is
  eager to gain hands-on experience in both front-end and
  back-end technologies.

  Responsibilities

  - Assist in developing and maintaining software applications
    across the full stack.
  - Collaborate with senior developers and cross-functional
    teams to implement new features.
  - Write clean and efficient code under the guidance of senior
    developers.
  - Troubleshoot and debug applications with support from the
    team.
  - Participate in code reviews and adhere to best practices.
  - Continuously learn and stay updated with emerging trends and
    technologies in software development.

  Requirements

  - Basic experience as a Full Stack Developer or similar role
    through internships, academic projects, or early job
    experience.
  - Familiarity with front-end frameworks, particularly Vue.js.
  - Basic understanding of back-end development using PHP and
    Laravel.
  - Foundational knowledge of databases, particularly MySQL.
  - Understanding of software development lifecycle and best
    practices.
  - Strong problem-solving skills and attention to detail.
  - Good communication and teamwork abilities.

  Qualifications

  - 0-2 years of experience in full stack development.
  - Experience with front-end build tools and task runners is a
    plus.
  - Eagerness to learn modern front-end development workflows
    and tools.
  - Familiarity with cloud services (e.g., AWS, Azure) is a
    plus.
  - Willingness to learn about CI/CD pipelines.

  Why Join Us

  - Be part of a small, fast-paced team working closely with
    experienced developers and founders.
  - Significant opportunities for professional growth and
    development.
  - Gain hands-on experience with cutting-edge technologies and
    real-world projects.
  - Competitive entry-level salary with potential for growth.

  How to Apply If you are passionate about software
  development and eager to kick-start your career with new
  challenges, we invite you to join us in revolutionizing the
  real estate investment industry. Please submit your resume
  and a cover letter outlining your qualifications and why you
  are a good fit for the role at RECAP.
