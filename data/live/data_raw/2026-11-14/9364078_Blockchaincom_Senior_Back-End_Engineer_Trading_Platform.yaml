title: Senior Back-End Engineer, Trading Platform
company: Blockchain.com
location: London, GBR
work_type: FULL_TIME
company_size: 911 Employees
description: |
  Blockchain is connecting the world to the future of finance.
  As the most trusted and fastest-growing global crypto
  company, it helps millions of people worldwide safely access
  cryptocurrency. Since its inception in 2011, Blockchain has
  earned the trust of over 90 million wallet holders and more
  than 40 million verified users, facilitating over $1
  trillion in crypto transactions.

  We are looking to hire a Senior Software Engineer to join
  our Institutional team in our London office. Blockchain.com
  is a high-performance culture marked by fearlessness and
  hyper productivity. You are a hardworking team player with a
  desire to learn and grow with us, someone who can work
  harder, faster, and smarter to deliver tangible results and
  process improvements.

   WHAT YOU WILL DO

  - Build low latency, scalable and highly performant trading
    services in RUST including Order Management System (OMS),
    exchange gateways, risk management systems, etc.
  - Enhance and maintain OMS functionality, ensuring efficient
    order execution, routing, and management in a high-
    frequency trading environment.
  - Be a part of a  fast-paced dedicated engineering team
    committed to constantly improving and iterating on cutting
    edge systems
  - Be at the forefront of the cryptocurrency exchange ecosystem
    building out a new set of financial services, systems and
    architecture.
  - Gain exposure to an array of low latency, high throughput
    techniques and algorithms.
  - Ensure security is at the forefront of everything you do,
    employing advanced encryption schemes to secure user and
    company data.
  - Work closely with the other tech teams to seamlessly deliver
    the highest quality products and improve performance
    across the board

  WHAT YOU WILL NEED

  - You possess an innate curiosity, and thrive on learning new
    technologies.
  - Extensive experience in C++ and/or Rust
  - Experience with Python and SQL.
  - Experience in one or more of the following programming
    areas:

  - Multithreading
  - Network programming, including multicast
  - Performance benchmarking and tuning

  - Extreme interest in delivering high quality software. This
    means that testing is embedded in the development process
    from the very beginning, from coding stage (unit testing),
    to integration testing (local and end to end integration
    testing), to performance (load and capacity) testing and
    finally, to failure recovery testing. Software engineers
    are fully involved in the testing process, driving much of
    the testing at all stages.
  - Experience in trading systems architecture: Familiarity with
    Order Management Systems (OMS), exchange gateway
    connectivity, market data ingestion and processing, as
    well as high-throughput, low-latency systems.
  - You take a pragmatic approach to developing clean solutions
    to complex problems.
  - Basic understanding of algorithms, data structures,
    databases and distributed systems is must.

  COMPENSATION & PERKS

  - Full-time salary based on experience and meaningful equity
    in an industry-leading company
  - Role based in our London office, with a mandatory in-office
    presence four days per week
  - Work from Anywhere Policy: You can work remotely from
    anywhere in the world for up to 20 days per year.
  - ClassPass
  - Budgets for learning & professional development
  - Unlimited vacation policy; work hard and take time when you
    need it
  - Apple equipment
  - The opportunity to be a key player and build your career at
    a rapidly expanding, global technology company in an
    emerging field
  - Flexible work culture

  Blockchain is committed to diversity and inclusion in the
  workplace and is proud to be an equal opportunity employer.
  We prohibit discrimination and harassment of any kind based
  on race, religion, color, national origin, gender, gender
  expression, sex, sexual orientation, age, marital status,
  veteran status, disability status or any other
  characteristic protected by law. This policy applies to all
  employment practices within our organization, including
  hiring, recruiting, promotion, termination, layoff, recall,
  leave of absence, and apprenticeship. Blockchain makes
  hiring decisions based solely on qualifications, merit, and
  business needs at the time.

  The personal data you provide will be used by Blockchain to
  process your application. To learn more about your rights,
  see our Applicant Privacy notice.
