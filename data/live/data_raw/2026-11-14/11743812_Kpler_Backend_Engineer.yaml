description: |
  At Kpler, we are dedicated to helping our clients navigate
  complex markets with ease. By simplifying global trade
  information and providing valuable insights, we empower
  organisations to make informed decisions in commodities,
  energy, and maritime sectors.



  Since our founding in 2014, we have focused on delivering
  top-tier intelligence through user-friendly platforms. Our
  team of over 850 experts from 69 countries works tirelessly
  to transform intricate data into actionable strategies,
  ensuring our clients stay ahead in a dynamic market
  landscape. Join us to leverage cutting-edge innovation for
  impactful results and experience unparalleled support on
  your journey to success.



  About the Role

  As an Engineer II within our Engineering Maritime &
  Logistics division, you will play a pivotal role in
  designing, building, and operating high-throughput data
  processing and API distribution systems. You will take end-
  to-end ownership of real-time streaming applications,
  backend services, and reliable pipelines that deliver
  critical maritime intelligence to global consumers via
  Kafka, Flink, and Snowflake. By maintaining platform
  resilience and scaling event-driven architectures, your work
  directly powers the actionable insights our clients rely on
  to navigate complex global trade.

  Key Responsibilities

  Experience & Background

  - 3+ years of professional software engineering experience
    delivering backend microservices and data pipelines in
    production.
  - Strong proficiency and hands-on expertise in Java, Scala,
    and Python.
  - Practical experience building and operating event-driven
    applications or data pipelines in cloud environments
    (AWS).
  - Direct experience operating containerized services on
    Kubernetes and delivering changes using Docker and GitOps
    workflows.
  - Solid background in SQL, relational database design, data
    modeling, and distributed system fundamentals.
  - Familiarity with geospatial and location-based datasets,
    including their structures and common use cases. Hands-on
    experience with geospatial technologies and tools such as
    GeoServer, PostGIS, WKT, S2, or H3.
  - Exposure to Test-Driven Development (TDD) and modern
    observability stacks (Datadog, OpenTelemetry, metrics,
    tracing).
  - Experience working on high-throughput, low-latency streaming
    systems where data freshness is critical.

  We are a dynamic company dedicated to nurturing connections
  and innovating solutions to tackle market challenges head-
  on. If you thrive on customer satisfaction and turning ideas
  into reality, then you’ve found your ideal destination. Are
  you ready to embark on this exciting journey with us?



  We make things happen

  We act decisively and with purpose, going the extra mile.



