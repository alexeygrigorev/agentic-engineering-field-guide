description: |
  About Staffbase

  We inspire people to achieve great things together. Our
  mission is to help organizations unlock the power of
  inspirational communication with the first AI-native
  Employee Experience Platform. Our industry-leading and
  award-winning agentic AI communications channels - intranet,
  employee app and email solutions - create engaging
  experiences that connect and empower employees.

  Headquartered in Chemnitz, Germany and New York City, with
  offices in Berlin, London, Sydney, Tokyo, Prague, and
  Minneapolis–St. Paul, our diverse team of 550+ employees
  supports 1,500+ customers—reaching over 14 million
  employees—in transforming their employee experience. We are
  proud to be a Unicorn company—privately valued at over $1
  billion—demonstrating strong growth, innovation, and lasting
  impact in our industry. Together, we’re shaping the future
  of workplace communication.

  As a Fullstack Staff Engineer on the Actions team, you'll
  take on one of our most important platform challenges:
  defining how extensibility works across Staffbase. Today,
  extensions power everything from HR integrations to the
  actions our AI assistant, Navigator, performs on a user's
  behalf — but there's no single, easy way to build and
  extend. That's what you'll design.

  Your north star is a framework that our engineers, our Labs
  team, and eventually customers themselves can use to build
  their own extensions, whether that's a one-off integration
  for a single customer or a tier-one capability used across
  our entire base. You'll build the core, define the
  standards, and make the calls on where we standardise versus
  where we stay flexible, all on a mature, multi-tenant
  platform.

  This is a role for someone who wants to drive, not just
  deliver, shaping the direction of a genuinely open-ended
  problem and setting the technical foundations others will
  build on.

  As part of our tech stack, we are using: React.js,
  JavaScript, TypeScript, Tailwind CSS, Kotlin, Go, Java,
  MongoDB, Terraform, Docker and Playwright, to name a few.

  Our environment

  - Working with skilled and like-minded professionals in a team
    that values diversity and inclusivity
  - We aim to create a flexible and agile work environment that
    promotes the well-being and work-life balance of our
    employees
  - We believe that team events during working hours play a
    vital role in building an exceptionally effective team,
    and we encourage them
  - We are enthusiastic about technology and committed to using
    it to improve the world
  - We follow the “You build it, you run it” approach and take
    pride in it

  The Team

  The Actions team sits at the heart of Staffbase's AI
  ambitions. We're the team that gives Navigator — our AI
  assistant and the main entry point into Staffbase — the
  ability to actually do things: submit a form, complete a
  task inside an integration, or take an action on a user's
  behalf through the agent. If Navigator is the brain, we
  build the hands.

  That means two big things. First, we enrich what the AI can
  see and act on, our plugins, our widgets and the wider
  Staffbase platform so the assistant can do real work, not
  just talk about it. Second, we build the extensions that
  connect to the tools people already use, like Workday,
  Personio, ServiceNow and Microsoft.   We're not just
  shipping features, though. A core part of our mission is
  building the extensibility framework that lets others build
  too.

  Our environment

  - Working with skilled and similar-minded professionals in a
    team that values diversity and inclusivity.
  - We aim to create a flexible and agile work environment that
    promotes the well-being and work-life balance of our
    employees.
  - We are enthusiastic about technology and committed to using
    it to improve the world.
  - We follow the "You build it, you run it" approach and take
    pride in it.

  What you'll be doing

  - Define and drive Staffbase's extensibility strategy,
    designing the framework, SDK and standards that let our
    teams and customers build their own extensions and
    integrations
  - Build the core systems that enable our AI assistant to take
    action across Staffbase and connect to external providers.
  - Lead technical strategy and architecture
  - Influence technical decisions and their documentation,
    driving long-term sustainable solutions to accommodate
    future growth and requirements
  - Continuously improve and refine our development processes,
    CI/CD pipeline, and automation practices to foster a
    productive development experience
  - Take ownership of major technical decisions, proactively
    addressing system bottlenecks and ensuring product quality
  - Contribute to and maintain technical roadmaps with
    engineering leadership to align project priorities and
    business goals
  - Manage and prioritize projects and initiatives across
    multiple teams
  - Foster a culture of ownership, technical excellence and
    continuous improvement within the team
  - Role modeling and developing others in the craft of Product
    Software Engineering
  - Mentor and guide engineers, providing leadership, feedback
    and fostering growth through code reviews and technical
    discussions

  What you need to be successful

  - Proven track record as a Staff Engineer or Technical Lead
    with strong leadership and problem-solving skills
  - Proven experience designing and building extensibility
    within a B2B / enterprise platform, SDKs, plugin systems,
    or extension frameworks that let internal teams and
    external customers build on top of a core product, with
    the judgment to define what "good" extensibility looks
    like from the ground up
  - Deep understanding of multi-tenant architecture, with strong
    judgment on where to standardise versus where to stay
    flexible in platform design
  - Extensive experience with Java/Kotlin or Go on the backend
    and React on the frontend
  - Knowledge of architecture and design patterns
  - Strong problem-solving skills and ability to work
    collaboratively in a fast-paced, dynamic environment
  - Ability to drive technical direction, including making
    decisions on architectural trade-offs and evaluating the
    long-term impact of technical choices
  - Experience managing architecture projects across multiple
    development teams, aligned with their roadmaps and
    stakeholders
  - Strong communication skills with the ability to articulate
    complex technical concepts to various stakeholders, both
    technical and non-technical
  - Previous experience working alongside Product and Design
    Leaders to deliver customer value in an Agile environment
  - Passion for building high-quality software
  - Passion for diversity and inclusion, and the ability to
    foster a culture where the team can move forward at speed
    while ensuring that everyone's voice is heard and they can
    contribute their best

  What you'll get

  - Competitive Compensation - we offer attractive salary
    packages including LTIP (unit-based Long Term Incentive
    Plan)
  - Flexibility - we offer flexible working time models and the
    option of hybrid work, and support this with a yearly flex
    work allowance of €1560
  - Recharge - with 31 vacation days annually (incl. one
    floating holiday), plus pro rata fully paid Fridays off
    during August
  - Support - we offer offering a company pension scheme
  - Volunteers Day - you’ll get one day off per year for
    supporting a social project
