description: |
  Teamwork makes the stream work. Roku is changing how the
  world watches TV

  Roku is the #1 TV streaming platform in the U.S., Canada,
  and Mexico, and we've set our sights on powering every
  television in the world. Roku pioneered streaming to the TV.
  Our mission is to be the TV streaming platform that connects
  the entire TV ecosystem. We connect consumers to the content
  they love, enable content publishers to build and monetize
  large audiences, and provide advertisers unique capabilities
  to engage consumers.

  From your first day at Roku, you'll make a valuable - and
  valued - contribution. We're a fast-growing public company
  where no one is a bystander. We offer you the opportunity to
  delight millions of TV streamers around the world while
  gaining meaningful experience across a variety of
  disciplines.

  About the team

  Are you passionate about building and evolving large-scale
  observability platforms? Do you want to work on a system
  that processes terabytes of data daily and supports hundreds
  of millions of active series? Are you excited about using AI
  to change how engineers build, operate, and debug systems at
  scale? If so, this role is for you!

  The Observability team is part of Roku's Cloud Technology
  Infrastructure organization. We ensure the services and
  workloads running on our platform have robust observability.
  We are a high-performing, fast-moving international team
  that thrives on taking ownership, communicating effectively,
  and iterating quickly to deliver impactful engineering
  solutions.

  Our mission is to advance Roku's observability platform,
  which ingests terabytes of data daily and manages hundreds
  of millions of active series. We don't just deploy off-the-
  shelf tools: we use Go and Rust to build our own world-class
  metrics stack on top of open-source technologies, and we
  tailor it to Roku's scale and needs. We work closely with
  the Cloud Platform team to support Roku's shift toward a
  unified, cloud-agnostic infrastructure where every team
  benefits from a common framework with out-of-the-box
  features. Together, we build and scale both the foundational
  infrastructure (Kubernetes, Istio, Envoy, operators, and
  more) and the observability layer (built on OSS/CNCF-
  supported observability projects).

  AI is part of how we work. We use AI tools and agents
  throughout our engineering lifecycle: to design, write,
  review, and test code; automate operational work; and speed
  up troubleshooting and incident response. We continuously
  refine these workflows as a team. We bring the same mindset
  to the platform, where we provide AI-assisted capabilities
  to the engineers who rely on our observability stack.

  What sets us apart is our results-driven culture rooted in
  ownership, accountability, and fast iteration. We prioritize
  solving meaningful engineering problems over process for
  process's sake, and focus our time and energy on high-impact
  work. Collaboration and open communication are core to how
  we operate. We share ideas freely and make decisions with
  purpose. We're continuously improving, not just the systems
  we build, but how we grow and work as a team.

   About the role

  As a Senior Software Engineer on the Observability team,
  you'll help design, develop, and scale the platform used
  across Roku engineering teams to alert and monitor thousands
  of services. You'll write Go and Rust to build and evolve
  our own metrics stack on top of open-source technologies,
  and you'll work hands-on with tools such as Prometheus,
  Grafana, Thanos, Loki, Tempo, and OpenTelemetry, optimizing
  them for performance, reliability, and usability. AI is
  central to how you'll work: you'll use AI tools and agents
  daily to build, test, and operate our systems, and help the
  team keep improving how we engineer with AI. You'll
  collaborate with infrastructure and platform teams, automate
  deployment and configuration, and contribute improvements
  back to the open-source community. This role is ideal for an
  engineer who's passionate about systems programming,
  observability at scale, and AI-driven engineering.

  For California Only - The estimated annual salary for this
  position is between $251,000 - $403,750 annually.
  Compensation packages are based on factors unique to each
  candidate, including but not limited to skill set,
