description: |
  Alloy is where you belong!

  Alloy is the AI-powered identity and fraud prevention
  platform that accelerates onboarding, stops fraud, and
  scales compliance across the customer lifecycle so financial
  organizations can grow without limits. More than 900 of the
  world's leading financial institutions and fintechs trust
  Alloy for smarter risk management that drives growth.
  Through our values: Be Bold, Go Fast, Collaborate, and
  Celebrate Our Differences, we are creating a workplace where
  you can grow, thrive, and belong. See how we’ve been
  continuously recognized and named one of Inc. Magazine’s
  Best Workplaces, Forbes America’s Best Startup Employers,
  Best Fintech to Work for by American Banker, year after
  year. Check out our investors and read more about us here.

  About the team

  The Data Platform team sits within Alloy's Intelligence
  vertical and owns the infrastructure that powers how data is
  modeled, governed, and delivered — both internally and to
  customers. We work at the intersection of data engineering
  and analytical depth, with a stack built around dbt,
  Snowflake, and Artie, and a growing investment in our
  semantic layer.

  This is an early but high-leverage moment for Analytics
  Engineering at Alloy. We have the tooling, the data, and the
  leadership experience to build this function the right way —
  and this role is central to that effort. The person who
  joins will help establish the patterns, standards, and
  culture of Analytics Engineering here.

  The strategic stakes are real: native warehouse data
  delivery is becoming a core part of how we serve customers,
  agentic workflows depend on a well-maintained semantic
  layer, and OLAP infrastructure is increasingly woven into
  our product stack. Analytics Engineering sits at the center
  of all three.

  Alloy operates in a hybrid-work environment. We look to
  foster collaboration and community by having our local
  employees onsite three days a week.

  What you'll do

  You'll manage the Data Platform team: hire for it, grow the
  people on it and set its direction. This is a player-coach
  role. Roughly half your time goes to hands-on work on the
  platform, and the other half to leading the team.

  - Lead a team of two engineers. Set clear direction, run one-
    on-ones and performance reviews, give direct feedback and
    coach each person toward work that stretches them
  - Hire as the team grows. Define the roles, run the interview
    loops and decide who joins
  - Own the data platform end to end: ingestion and change data
    capture, the Snowflake warehouse, dbt and the semantic
    layer, and the tooling that internal and customer-facing
    analytics run on
  - Ship native warehouse data sharing into customers' own
    environments, including the schema contracts customers
    will build on for years
  - Design how sensitive customer data is handled across
    analytics and BI, so teams get the answers they need and
    customer data stays protected
  - Set the team's technical standard for modeling, testing,
    documentation and code review, and meet it in your own
    code
  - Work with Product, Compliance and other engineering teams to
    decide what data we expose, to whom and under what
    constraints. Make the platform good enough that teams
    choose it over building their own

  What we're looking for

  You want both halves of this job. You'd be unhappy in a role
  that took you away from building, and just as unhappy in one
  where nobody grew because of you.

  - Deep analytics engineering and data systems experience.
    Strong SQL, dbt and a cloud data warehouse (Snowflake
    preferred), with real depth in data modeling: grain,
    slowly changing dimensions and what makes a model
    trustworthy
  - Experience owning architecture from ingestion through the
    warehouse to delivery, including ingestion and change data
    capture tools (Artie or similar) and how they fail: late-
    arriving data, schema drift, out-of-order events
  - A record of leading people. You've set direction others
    followed, grown someone on purpose, given feedback that
    was hard to give and raised a team's standard. Formal
    management experience is not required. We care about what
    you did, not the title you held
  - Good judgment about sequencing. Given more good ideas than
    quarters, you pick what comes first and can explain why
    the rest wait
  - Experience getting other teams to adopt something you built,
    or agreeing a constraint with a function that had reasons
    to resist, with the relationship intact afterwards
  - Based in the New York City area and able to work from our
    Union Square office Tuesday through Thursday

  Nice-to-haves:

  - Experience with native warehouse data delivery, such as
    Snowflake Data Sharing or Marketplace
  - Background in fintech, financial services or another
    regulated industry, especially handling PII in analytics
  - Experience building a semantic or metrics layer and
    connecting it to BI tools
  - Exposure to agentic or LLM-based workflows and the data
    infrastructure behind them

  We're a lean team, so your impact will be felt immediately,
  and opportunities will grow as the company scales up. If
  this all sounds like a good fit for you, why not join us?

  Alloy is committed to fair and equitable compensation
  practices. Below is the anticipated starting base
  compensation range for this role; however, pay may vary
  depending on job-related knowledge, in-demand skills,
  relevant experience, and/or geography. In addition to a
  competitive base salary, this position is also eligible for
  equity awards in the form of stock options (ISOs) as well as
  a competitive total benefits package. Your recruiter will be
  happy to walk you through the details and what compensation
  could look like for you specifically!

  This position has a salary range of $255,000 - $295,000.

  Benefits and Perks

  We invest in your health, your financial future, and your
  growth. Here's what you can expect:

  - Medical, dental, and vision coverage from the first of the
    month after you join, including $0 employee-only premium
    options, plus FSA options and an Alloy-funded HSA with our
    high-deductible plan
  - Healia: if your spouse or partner has health insurance
    through their employer, Alloy may cover up to 100% of your
    family's costs on their plan
  - Alloy-paid One Medical membership, Spring Health therapy and
    coaching, Superpower advanced lab testing, and ClassPass
    credits
  - Stock options for every full-time employee
  - 401(k) with a 100% match up to 4% of pay, vested
    immediately, plus a mega backdoor Roth option
  - Free, unlimited 1:1 financial planning through Addition
    Wealth
  - Unlimited PTO plus company holidays
  - 16 weeks of fully paid parental leave for eligible birthing,
    non-birthing, adoptive, and foster parents
  - Annual learning and development stipend, plus a home office
    stipend to set up your workspace
  - Hybrid work environment: most team members work from our HQ
    in Union Square, Manhattan, Tuesday through Thursday, with
    in-office expectations that vary by role. Catered lunches
    from a variety of local restaurants and frequent employee-
    organized cultural events bring energy to the office. On
    Mondays and Fridays, many employees work remotely, while
    some take advantage of the quieter office.

