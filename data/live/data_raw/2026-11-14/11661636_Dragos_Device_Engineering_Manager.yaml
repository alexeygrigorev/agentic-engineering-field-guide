description: |
  At Dragos, the mission is personal. The systems we protect
  deliver the water you drink, power your home, and keep the
  hospitals your community depends on running. Those critical
  infrastructure systems that power our civilization around
  the world are under attack every day by adversaries. When
  those systems fail, people are immediately at risk. We are
  the global leader in xOT cybersecurity, combining
  technology, threat intelligence, and expert services. The
  people here chose this work because they understand what is
  at stake. Here, you will find a remote-first mission-driven
  team across North America, Europe, the Middle East, and APAC
  built on authenticity, transparency, and trust. If
  safeguarding the systems that protect your family, friends,
  and community is the kind of work that matters to you, you
  are in the right place.

  About the Role:

  We are looking for a Device Engineering Manager to lead the
  team that builds our device intelligence: the scanning and
  fingerprinting that discovers and classifies every asset on
  a customer network, the profiles and probes that pull
  information off those devices, and the actions we take on
  them, including credential rotation, firmware updates,
  certificate management, and configuration change control.

  A core part of this team is device reverse engineering.
  These engineers work out how a device actually communicates
  when there is no documentation to rely on and turn that
  understanding into automated, supported product
  capabilities. You will set the direction for where that
  reverse engineering investment goes and hold the
  documentation and test standards that make it reusable
  rather than one-off.

  Responsibilities:

  - Lead and mentor a team of device engineers and reverse
    engineers, driving their technical growth and professional
    development through regular 1:1s and continuous career
    coaching.
  - Drive hiring and team growth to scale with roadmap demands.
  - Own the technical strategy for device coverage: prioritize
    which devices and protocols get reverse engineering
    investment, and make sure new device work moves the module
    boundary forward instead of adding to what we will have to
    unwind later.
  - Set and hold the standards for reverse engineering output,
    including protocol and device documentation others can
    build from, fingerprints and profiles, and automated tests
    that protect the boundary as code generation gets cheaper.
  - Champion automation of the repeatable work the team does by
    hand today, from device-model and profile authoring to
    firmware and vulnerability data collection to capture-
    based test replay.
  - Champion the adoption of AI-assisted development tools and
    workflows.
  - Collaborate with product management and tech leads to define
    scope, sequence device support, and resolve blockers.
  - Work across security research, threat research, and
    customer-facing teams to translate field needs into
    engineering outcomes.
  - Own production support for fielded deployments, including
    customer-operated and on-prem environments, and
    participate in incident response.
  - Foster the device engineering and reverse engineering skill
    communities across the organization, regardless of
    reporting structure.
  - Maintain your core technical competency: read code, review
    designs, and debug production issues directly.

  Qualifications:

  - 7+ years of engineering management experience.
  - Management experience with Agile and working in cross-
    functional Product Teams.
  - Strong technical background in software that interacts with
    network-connected devices across embedded, IoT, and OT/ICS
    endpoints.
  - Prior experience as an engineer with some combination of
    Node.js, TypeScript, Go, Python, relational databases,
    Docker, and Unix/Linux systems-level debugging.
  - Direct experience leading or working closely with reverse
    engineers on protocol or firmware analysis
  - Solid understanding of network transport and application
    layer protocols (TCP/IP, TLS, HTTP, common auth schemes,
    and common embedded and industrial protocols).
  - Experience shipping software onto customer-managed or on-
    prem infrastructure.
  - Hands-on daily use of AI-assisted development tools, and
    judgment about when not to trust them.
  - Comfortable reading code and debugging production issues
    directly.
  - Cybersecurity, OT/ICS, or xIoT device security experience is
    strongly preferred.

  Compensation:

  - Salary:  $220,000
  - Competitive Equity Package
  - Comprehensive Benefits Plan



