description: |
  SONIFI is known around the world as the best guest
  technology provider in hospitality, and it’s all because of
  the people behind the technology. For more than 45 years,
  SONIFI has been where employees thrive on collaboration and
  curiosity, helping hotels solve challenges with patented
  innovations that shape technology experiences for staff,
  guests, and the best companies in the industry. For the next
  step in your career, it’s time to set a new standard with
  SONIFI.



  SONIFI is seeking a Manager, Network Engineering to lead the
  team responsible for post-sales network configuration,
  implementation, and validation for our Managed Wi-Fi Network
  Solutions business. Reporting to the Sr. Director, Internet
  Services, this remote, player-coach role leads a team of
  10–20 employees while balancing deployment schedules,
  technical quality, resource capacity, customer requirements,
  and financial objectives. Approximately 20% of your time
  will be dedicated to hands-on network engineering, depending
  on business needs. The position requires approximately 10%
  travel throughout the United States, Canada, and Mexico.

   What you’ll do

  - Lead, develop, and manage the Network Engineering team,
    setting goals and expectations, assigning and prioritizing
    work, monitoring progress and quality, providing timely
    coaching and feedback, completing performance reviews,
    managing performance issues, and serving as a role model
    for SONIFI’s Core Values and Leadership Success Drivers.
  - Establish and monitor metrics for configuration accuracy,
    rework, engineering productivity, backlog, and resource
    utilization, using the results to identify delivery risks,
    guide coaching, and prioritize process improvements.
  - Serve as a player-coach, dedicating approximately 20% of
    your time to hands-on network engineering, including the
    design, configuration, installation, turn-up, and
    validation of hospitality network deployments. This
    percentage may vary based on team and business needs.
  - Champion process, system, and automation improvements by
    gathering requirements, submitting them through the
    development process, partnering with Product Management to
    prioritize them, and driving adoption within the Network
    Engineering team.
  - Plan and allocate resources to meet productivity and quality
    goals while improving the team’s processes, procedures,
    skill sets, speed, efficiency, and output.
  - Support the department’s operational, budgetary, and
    financial responsibilities, making financially
    responsible, justifiable, and defensible business
    decisions in accordance with organizational policies and
    procedures.
  - Collaborate across internal organizations to identify
    business requirements, communicate capabilities, deliver
    new products and services, and lead complex implementation
    and customer escalations through closure, ensuring root
    causes, corrective actions, and lessons learned are
    documented and incorporated into engineering standards,
    training, and processes.
  - Help create and maintain training, support documentation,
    and network configuration guidelines for subcontractors,
    Field Service, and the Technical Assistance Center
    covering site surveys, installation, configuration, and
    support best practices.

  What you’ll need

  - A four-year degree in a related technical field and six or
    more years of technical experience, or an equivalent
    combination of education and experience.
  - At least three years of leadership experience.
  - Demonstrable knowledge of IP-based network engineering,
    configuration, and deployment, including TCP/IP
    addressing, subnetting, LAN/WAN configuration, and network
    installation support.
  - Knowledge of network distribution technologies, including
    switched Ethernet, G.hn, Wi-Fi, and active and passive
    optical solutions, along with switches, routers, access
    points, network controllers, firewalls, data cabling,
    cross-connects, RF cabling, wireless communication
    protocols, and network management software.
  - Hands-on technical proficiency to support complex
    deployments, resolve escalations, validate engineering
    practices, and coach team members while maintaining
    accountability for team leadership, workload allocation,
    and overall delivery.
  - Working knowledge of vendor solutions deployed in SONIFI’s
    target markets, including Aruba Networks, Ruckus Networks,
    Meraki, Fortinet, and Palo Alto.
  - The ability to balance hands-on project work with team
    leadership, apply business concepts at tactical and
    strategic levels, stay current with changing technology
    and industry trends, and work independently with strong
    initiative, organization, and follow-through.
  - Excellent verbal, electronic, and written communication
    skills, including the ability to explain technical
    concepts to nontechnical audiences, plus proficiency with
    Ekahau Survey Pro, Microsoft Word, Excel, Outlook,
    PowerPoint, and standard office equipment and tools.

  Preferred:

  - Supervisory or managerial experience.
  - Ekahau, CWNA, or vendor-specific certifications for Aruba,
    Meraki, Ruckus, Fortinet, Palo Alto, or Nomadix.

  Together, we can build your future!

  We offer a competitive compensation package including
  health, dental, vision, 401(k) with employer match, paid
  time off (PTO), flexible work arrangements, professional
  development opportunities, pet insurance, and on-demand pay.

  Compensation for this position generally starts at $100,000
  to $130,000 annually and varies based on experience,
  education, specialty, training, and geographic location.



