description: |
  We Are:

  Accenture is a global professional services company with
  leading capabilities in digital, cloud, and security.
  Combining unmatched experience and specialized skills across
  more than 40 industries, we offer Strategy and Consulting,
  Technology and Operations Services, and Accenture Song, all
  powered by the world's largest network of Advanced
  Technology and Intelligent Operations centers. Our 700,000+
  people deliver on the promise of technology and human
  ingenuity every day, serving clients in more than 120
  countries. We embrace the power of change to create value
  and shared success for our clients, people, shareholders,
  partners, and communities. Visit us at accenture.com.

  You Are:

  As a Data Engineering, Management & Governance professional,
  you will play a pivotal role in building data solutions for
  ingestion, transformation, and structuring data, utilizing
  both vendor and open-source tools for building, migrating,
  and deploying data pipelines.

  The Work:

  - Apply data engineering principles to create reusable
    workflows for data ingestion, quality assurance,
    transformation, and optimization.
  - Design, Build and test scalable data pipelines using
    extract, transform, and load tools.
  - Document requirements and technical design documents.
  - Deploy solutions to production environments using CICD dev
    ops and cloud architecture principles.
  - Migrate data from legacy data warehouses and enterprise
    systems (e.g., ERP, finance, CRM platforms) using cloud
    architecture principles
  - Automate the flow of data for consumption (e.g., financial
    and management reporting, operational analytics, AI use
    cases).
  - Build business processes that enable data governance.
  - Design and advise on data quality rules (e.g., completeness,
    validity, and reconciliation to financial control totals)
    and set up effective data compliance policies.

  Travel may be required for this role.  The amount of travel
  will vary from 0 to 100% depending on business need and
  client requirements.

  What you need:

  - Minimum of 5 years of hands-on experience on Cloud and Big
    Data technologies such as serverless data processing,
    Spark/SparkSQL, batch and streaming services, event-driven
    data pipelines, cloud databases, and programming languages
    such as Python, SQL, and Node.js
  - Minimum 5 years of experience in following:
    - Cloud data storage, data management and data services
    - Data supply chain including streaming pipelines to help
      address the challenges of acquiring data, evaluating its
      value, .
    - Examine data from multiple sources, and share insights which
      provide competitive advantage
  - Minimum 5 years of experience with:
    - Devops and CI/CD processes
    - Scheduling and orchestration
  - Bachelor's degree or equivalent (minimum 12 years) work
    experience. (If Associate’s Degree, must have minimum 6
    years work experience)

  Preferred Requirements:

  - Experience in large-scale data integration and data
    warehouse solutions, Databricks & Snowflake.
  - Ability to lead and effectively facilitate design sessions
    with business customers and the BI team to derive data
    requirements and data design information
  - Cloud (e.g. AWS) data path certifications
  - Business acumen and domain knowledge (e.g., Finance, Supply
    Chain, Customer) to catch nuances in the meaning of the
    data (such as how revenue or cost is defined differently
    across systems)
  - A good understanding of governance and security best
    practices as well as their organization’s policies,
    procedures, and protocols to maintain the required
    regulatory and privacy compliance.
  - Basic knowledge of machine learning (ML) and models and
    statistical analysis to better collaborate with data
    scientists and business leaders
  - Demonstrable knowledge in artificial intelligence, machine
    learning, data science, and other relevant technical
    domains

