description: |
  Looking for a Principal Full-Stack Engineer with a passion
  for crafting and delivering software solutions to be part of
  its diverse, globally distributed team of IT professions
  responsible for the development and maintenance of IWMS
  client platforms and offerings.

  In this role you will use your knowledge of software
  development, platform integration, and cloud computing to
  modernize a diverse suite of applications that support our
  intermediary (clearing and custody) business! You will be a
  member of our team collaborating with product management,
  architecture, engineering, and technology partners to
  innovate, design, and deliver highly scalable applications
  and platforms using Agile methodologies.

  The Expertise We’re Looking For

  - Bachelor’s Degree in Computer Science, Information Systems,
    or related field
  - Solid foundation in Computer Science, with competencies in
    data structures, algorithms, and software design
  - 10+ years of development experience with strong working
    knowledge of Java/JEE, Spring/Springboot, RESTful
    Services, Cloud (AWS), SQL, NoSQL, Python, Test and
    Deployment technologies, Kubernetes
  - Strong experience with web services (JSON, XML, REST, SOAP,
    YAML, etc.)
  - Conversant in REST API authentication including OAuth, SAML
    and JWT
  - Deep understanding of API design, including versioning,
    isolation, micro-services, and experience in detailing
    APIs using an API documentation framework (Swagger)
  - • Cloud skills working with AWS EKS/ECS and AWS handled
    solutions such as Lambda, SQS, EC2, S3, CloudWatch and IAM
    roles/polices
  - Strong knowledge in application development with micro
    architectures.
  - Strong knowledge of API gateways such as Stratum, WSO2, and
    Tomcat
  - Experience with test automation and frameworks like
    Cucumber, Karate, Bruno
  - Knowledge of logging and observability concepts and the
    usage of tools such as Datadog and Splunk
  - Proven experience in building and deploying software
    solutions using public cloud provider services like AWS
    and Azure using Continuous Integration/Continuous
    Deployment (CI/CD) tools like Terraform, Jenkins
  - Exposure to domain design, micro services architecture, data
    aggregation, service integration
  - Ability to understand and adapt to changing business
    priorities and technology advancements
  - Knowledge of end-to-end DevSecOps automation with CI and CD
    pipelines including Unit, Component, Functional,
    Performance, and Security test automation
  - Certifications in, and working experience with, AWS
  - Perform troubleshooting and triaging in Assist in production
    and nonproduction environment
  - Standout colleague, self-starter, collaborative, innovative
    and eager to learn every day.
  - Excellent communication and documentation skills.
  - Ability to multi-task within various initiatives if needed
  - 2-3 years of experience in Agile development
  - Experience with Jira

  The Purpose of Your Role

  This role will focus on the design and development of our
  Institutional products and services platform. The candidate
  will work with project managers, systems analysts, offshore
  resources, tech leads, quality assurance, and architects to
  build solutions that meet critical business needs. You
  should possess problem solving skills and be able to
  translate application storyboards and use cases into
  functional applications.

  The Skills You Bring

  - Initiative and self-motivation
  - Formal project life cycle methodology experience – waterfall
    and agile
  - Organizational and presentation skills
  - Willingness to explore and learn new technologies
  - Understanding of building net new UI’s as well as
    integrating with other applications and services
  - Help maintain code quality, security, organization, and
    automation

  The Value You Deliver

  - Design and implementation of software solutions that meet
    requirements and are aligned to the project/program
    strategic direction
  - Adhere to engineering best practices and participate in
    design and code reviews
  - Develop and maintain partnerships across the organization
  - Working as part of a team in a collaborative environment to
    deliver an exceptional experience for our clients
  - Expert understanding of the software development process
    including analysis, design, coding, system and user
    testing, problem resolution and planning
  - Identify creative ways to drive desired outcomes and promote
    culture of innovation by setting examples
  - Collaborate with peers through code reviews, pair
    programming or interactive discussions daily
  - Work across multiple squads and are adaptable to change
  - Follow outstanding software engineering practices and always
    looking to improve your engineering skills and industry
    knowledge
  - Bring a data-driven and team approach to decision making,
    both in day-to-day work and in making strategic trade-offs
  - Comfortable working with and communicating to all levels of
    the organization including technology leadership and
    business partners regarding technology design and
    rationale
  - Familiarity with delivering solutions to the market and
    having them scale for product growth with recognition of
    technology trends in implementing business applications
  - Collaboration with business and technology partners to
    define and deliver our strategy and roadmap based upon
    business requirements
  - Engage with distributed team of developers in leading
    standard methodologies for software engineering











  Compensation, Benefits and Duration



  Minimum Compensation: USD 39,000 Maximum Compensation: USD
  137,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
