description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do

  You’ll join CoreWeave’s IaaS organization as the Engineering
  Manager for the Launch & Sandboxes team. The team owns two
  connected areas: Sandboxes, cloud execution environments
  that let practitioners run code in isolated, GPU-enabled
  containers, and Launch, the services and integrations that
  support job submission, compute orchestration, and HPC
  schedulers.

  You’ll lead the engineering work that connects developer
  workflows to the compute where AI workloads run. The systems
  span Kubernetes clusters, HPC nodes, and cloud virtual
  machines, and are designed to make it easier for customers
  to launch, manage, and scale workloads across CoreWeave’s
  infrastructure.

  About the role

  As the Engineering Manager for Launch & Sandboxes, you'll be
  involved in the full product lifecycle, from ideation and
  roadmap shaping through delivery and being available for
  customers. Your day-to-day will involve partnering with
  product management to prioritize across competing
  initiatives, unblocking your engineers on cross-team
  dependencies, and ensuring the team ships reliably while
  managing technical debt. You'll need to be technically
  fluent enough to participate in architecture discussions
  around container orchestration, distributed authentication,
  and billing infrastructure, and you're not afraid to get
  your hands dirty when the team needs it.

  At the same time, your primary focus is growing your
  engineers into autonomous leaders and technical decision-
  makers. We're an AI-forward organization that embraces LLM-
  based coding tools and agentic workflows to accelerate
  development, and we'd expect you to champion that culture
  within your team. This role carries a heavy customer and
  user focus: you'll stay close to how ML practitioners use
  the product and make sure that perspective drives your
  team's priorities.

  Like any role at a hyperscaler, this comes with high
  accountability and ownership. You'll own your team's
  outcomes end-to-end, from roadmap commitments through
  production reliability. We expect engineering managers to
  make hard prioritization calls, hold the bar on engineering
  quality, and build teams that operate with autonomy and
  urgency.

  Who You Are

  - 3+ years of engineering management experience, with a track
    record of shipping infrastructure or platform products
  - 5+ years of software engineering experience prior to
    management, with backend systems depth
  - Technical fluency in Go, Python, and Kubernetes (you won't
    write code daily, but you need to review PRs, unblock
    architectural decisions, and understand production
    incidents)
  - Experience managing teams that own distributed systems in
    production
  - Demonstrated ability to balance product delivery with
    technical health (managing tech debt, reliability, on-
    call)
  - Experience partnering with product managers to shape and
    prioritize a roadmap
  - Track record of growing engineers across levels
  - Strong communication skills with both engineering and non-
    engineering stakeholders
  - Comfortable operating in ambiguity, especially in newer
    product areas where scope is still being defined

  Preferred

  - Experience with ML infrastructure, ML platforms, or
    developer tools for data scientists
  - Familiarity with compute orchestration, job scheduling, or
    container isolation technologies
  - Experience managing teams through a product area transition
    (e.g., early-stage to growth, or post-acquisition
    integration)
  - Background in HPC or scientific computing environments
  - Experience with billing systems, metering, or usage-based
    pricing infrastructure
  - Founding experience or early-stage background where you took
    a product from idea to the hands of users

  Wondering if you're a good fit?

  We believe in investing in our people, and value candidates
  who can bring their own diversified experiences to our
  teams, even if you aren't a 100% skill or experience match.
  Here are a few qualities we've found compatible with our
  team. If some of this describes you, we'd love to talk.

  - You're energized by building a team around a product area
    that is still finding its shape, not just maintaining
    something mature.
  - You care about developer experience and understand that
    infrastructure teams succeed when their users actually
    love the tools.
  - You've managed through organizational complexity before and
    you're comfortable navigating cross-team dependencies and
    shifting priorities.

  Why Us?

  We work hard, have fun, and move fast! We’re in an exciting
  stage of hyper-growth that you will not want to miss out on.
  We’re not afraid of a little chaos, and we’re constantly
  learning. Our team cares deeply about how we build our
  product and how we work together, which is represented
  through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and provides the opportunity to
  develop innovative solutions to complex problems. As we get
  set for takeoff, the growth opportunities within the
  organization are constantly expanding. You will be
  surrounded by some of the best talent in the industry, who
  will want to learn from you, too. Come join us!

  The base pay and target total cash for this position range
  from $165,000.00 - $242,000.00, accordingly. Pay is based on
  a number of factors including market location and may vary
  depending on job-related knowledge, skills, and experience.
  This position includes a discretionary bonus, equity, and a
  comprehensive benefits package.

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

