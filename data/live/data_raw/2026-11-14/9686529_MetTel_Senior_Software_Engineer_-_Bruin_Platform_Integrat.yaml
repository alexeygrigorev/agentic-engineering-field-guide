description: |
  MetTel is a global communications solutions provider with
  the most complete suite of fully managed services that focus
  on secure connectivity, and network and mobility services.
  We simplify communications and networking for business and
  government agencies. Our customers include many of the
  Fortune 500, and Gartner recognizes us as an industry
  leader. We have the broadest portfolio of technology and
  integrated partnerships, as well as our private network,
  which we use to create tailored solutions design,
  deployment, and ongoing management, driving cost savings,
  efficiency, innovation, and the ability to focus on core
  objectives.

  We believe that each team member is a key to the success and
  sustainability of the group. In order to achieve this, we
  offer an environment where all professionals can grow and
  develop their skills and competencies, collaborate with
  diverse professionals, share knowledge and enjoy a rewarding
  career.

  We are seeking a Senior Software Engineer – Integration to
  join a new Bruin Platform Modernization team in NYC.

  Bruin is MetTel's mission-critical operations platform — 15
  years in production, deeply embedded in how MetTel and its
  customers run. This role owns the customer integration
  experience end-to-end: designing and delivering the Bruin
  SDK, public APIs, and developer experience portal that make
  integrating with Bruin feel effortless for our customers,
  partners, and internal teams; and building out the Bruin
  Integration Marketplace — the catalog of connectors that
  lets Bruin plug into customer environments across HR,
  ticketing, MDM, SSO, zero-touch provisioning, mobile threat
  defense, and business intelligence systems.

  You will partner with our Principal Software Architect and
  senior technical leadership on architectural direction, and
  operate as the senior owner of Bruin's integration
  experience. You will use AI-assisted engineering tools as a
  core part of your workflow.

  ROLE AND RESPONSIBILITIES

  - SDK & Public API Ownership: Own the design, delivery, and
    evolution of the Bruin SDK and Bruin's public APIs end-to-
    end. Own contract design, versioning strategy, pagination,
    error handling, authentication, rate limiting, and
    idiomatic ergonomics per language.
  - Developer Experience Portal: Own the Bruin developer portal
    as a product — quickstart guides, API reference, code
    samples, interactive playground, SDK changelog, and the
    documentation pipeline that keeps it all in sync with the
    code. Treat documentation as a first-class engineering
    deliverable.
  - Bruin Integration Marketplace: Lead the design and expansion
    of the Bruin Integration Marketplace — the catalog of
    connectors that lets Bruin integrate into customer
    environments. Own the connector framework, certification
    model, secrets management, observability, and the request-
    access and onboarding experience. Lead delivery of
    foundational connectors across ticketing (e.g.,
    ServiceNow, Jira, Zendesk, Freshservice, BMC), HR feeds,
    MDM, SSO, zero-touch provisioning, mobile threat defense,
    and BI tools.
  - Enterprise Integration Patterns: Apply established patterns
    for webhook delivery and retry, eventual consistency,
    schema evolution, idempotency, replay, and observability
    across heterogeneous customer systems. You know where
    integrations go wrong in production and design to prevent
    it.
  - AI-Native Integration Patterns: Design the integration
    experience so it is consumable by modern AI agents and AI-
    native applications — clear tool semantics, well-described
    capabilities, and patterns that allow Bruin's AI-first
    user experience to operate against the platform safely and
    effectively.
  - Customer & Partner Collaboration: Engage directly with
    customer engineering teams during marketplace onboarding
    and early adopter programs. Bring real-world integration
    feedback back into SDK, API, and connector design.
  - Code Quality: Conduct code reviews, write well-tested
    maintainable code, and contribute to a high engineering
    bar across the team. Mentor collaborating junior and mid-
    level engineers as needed.

  DESIRED QUALIFICATIONS:

  - Must be a strong engineer with a track record of shipping
    developer-facing surfaces — SDKs, public APIs, or platform
    products that external developers integrate against.
  - 7+ years of professional software engineering, with
    significant time spent on SDK / public API / platform
    engineering.
  - Demonstrated ownership of a developer-facing SDK or public
    API at production scale — you can describe the design
    decisions, the trade-offs, and what you would do
    differently.
  - Strong proficiency in at least two modern programming
    languages, with TypeScript/JavaScript and Node.js
    preferred, plus working knowledge of multiple language
    ecosystems (e.g., .NET, Python, Go, Ruby, Java) and the
    SDK conventions and developer experience expectations
    specific to each. Great SDKs feel native to their host
    ecosystem — you understand what that means in practice.
  - Experience designing APIs and SDKs optimized for developer
    discovery — predictable naming conventions, strong type
    definitions, rich inline documentation, and progressive
    disclosure patterns that work well with modern IDEs and
    agentic coding tools (autocomplete, type inference, AI
    assistants using the SDK as context).
  - Experience building or significantly contributing to a
    developer portal or documentation site — docs-as-code
    workflows, OpenAPI specifications, generated SDKs and
    reference content, or similar.
  - Hands-on experience with enterprise integration concerns:
    OAuth 2.0 / OIDC, SAML, SCIM, webhooks, REST, GraphQL,
    retry and idempotency patterns, and schema versioning.
  - Hands-on experience with containerized deployment
    (Kubernetes, Docker), and comfort with CI/CD pipelines.
  - Familiarity with cloud platforms (AWS, Azure, or GCP) as
    adjacent experience — many of the patterns transfer to our
    on-premise environment.
  - Demonstrated proficiency with AI-assisted development tools
    (Claude Code, Copilot, Cursor, or similar) as a core part
    of your engineering workflow.
  - Strong written communication — you can write SDK
    documentation, API design docs, and customer-facing
    integration guides that engineers actually use.
  - Customer empathy — you have worked directly with developers
    integrating against your product and let that feedback
    shape the design.

  NICE TO HAVE:

  - Experience designing APIs or SDKs for AI agents and AI-
    native applications — tool-use interfaces, Model Context
    Protocol (MCP), function-calling patterns, or similar.
  - Prior experience at an iPaaS or at a B2B SaaS company with a
    published SDK and a partner connector ecosystem.
  - Direct experience integrating with ServiceNow, Jira,
    Workday, Okta, or similar enterprise systems at scale.
  - Familiarity with telecom, mobile device management, or
    network monitoring protocols (SNMP, syslog, MDM APIs, or
    vendor APIs for Meraki, Cisco, Zebra, or similar).
  - Previous developer advocacy, DevRel, or technical writing
    contributions.
  - Telecom, managed services, or B2B platform domain
    experience.

  *The salary range reflected is a good faith estimate of base
  pay for the primary location of the position. Our
  compensation reflects the cost of labor across several U.S.
  geographic markets, and we pay differently based on those
  defined markets. The U.S. pay for this position ranges from
  $145,000.00 to $165,000.00 annually. Pay varies by work
  location and may also depend on job -related knowledge,
  skills, experience and abilities of the successful
  candidate. Your recruiter can share more about the specific
  salary range for the job location during the hiring process.

