description: |
  The Opportunity As an AI Engineering Lead, you will play a
  pivotal role in transforming raw data into actionable
  insights, enabling informed decision-making and driving
  business growth. Within our Advisory practice, you will
  leverage advanced technologies and techniques to design and
  develop robust data solutions for clients. As a Senior
  Manager, you will apply your skills and professional network
  to deliver quality results, motivating and coaching teams to
  solve complex problems. You will navigate through ambiguity,
  demonstrating composure and applying sound judgment to drive
  project success. In this role at PwC, you will focus on
  building and deploying AI and Machine Learning solutions at
  scale. Your work will involve designing AI systems, data
  wrangling, and software implementation to enable scalable AI
  models. You will craft and convey clear, impactful messages,
  validate outcomes with clients, and act on feedback to
  enhance solutions. Your ability to develop and sustain
  diverse and inclusive teams contributes to the overall
  success of our firm, fostering a culture of continuous
  improvement and innovation. Responsibilities
  - Leading the design and development of AI systems to
    transform raw data into actionable insights
  - Managing the deployment of scalable AI and Machine Learning
    solutions for client projects
  - Overseeing data wrangling and software implementation to
    enhance AI model utility and scalability
  - Guiding teams in applying advanced data engineering
    techniques to drive business growth
  - Utilizing programming languages such as Python and C++ to
    develop robust data solutions
  - Implementing data integration and modeling strategies to
    support AI initiatives
  - Directing complex data analysis to identify opportunities
    for innovation and improvement
  - Collaborating with stakeholders to validate outcomes and
    incorporate client feedback
  - Promoting the use of open-source software and machine
    learning libraries like TensorFlow and Scikit-Learn
  - Coaching and motivating diverse teams to solve complex
    problems and achieve project success
  What You Must Have
  - At least a Bachelor's degree
  - At least 7 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Computer Science/Information
    Systems, Engineering
  - At least one of the following: Certifications aligned to
    data engineering, machine learning, and cloud platforms,
    including AWS, Google Cloud, Microsoft Azure, Databricks,
    Snowflake, or related data and AI credentials
  - Demonstrating advanced skills in AI implementation and
    machine learning libraries
  - Utilizing programming languages such as Python, Java, and
    C++
  - Excelling in complex data analysis and data modeling
    techniques
  - Innovating with open-source software and rapid
    experimentation
  - Leading teams through ambiguity with sound judgment and
    strategic advising
