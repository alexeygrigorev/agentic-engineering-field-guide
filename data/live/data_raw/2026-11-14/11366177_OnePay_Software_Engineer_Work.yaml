description: |
  About OnePay

  OnePay is the consumer fintech trusted by millions of
  Americans to make money better.

  Our financial system is broken. High fees, low rates, and
  too few ways to actually grow your money. We’re fixing it.
  And we’re moving fast.

  We’re an all-in-one financial services platform that brings
  together banking, high-yield savings, credit cards, point-
  of-sale lending, investing, and crypto in one place. We also
  partner with employers, HCM providers, gig platforms, and
  others to deliver embedded financial services to millions of
  employees and frontline workers.

  We’re backed by Walmart, the world’s largest retailer, and
  Ribbit Capital, one of fintech’s most respected investors,
  giving us rare scale, distribution, and the opportunity to
  build something truly category-defining.

  But what really sets OnePay apart is how we move. Our
  customers don’t have time to wait… and neither do we. This
  place moves fast, and we’re looking for people who are:

  - Ready to run
  - Hungry and driven by urgency
  - Exceptional at what they do, with low ego
  - Comfortable operating in motion

  The Role

  The @Work team is responsible for OnePay's employer benefit
  features, including Instapay, savings, and budgeting. As a
  Full Stack Engineer at OnePay, you will build simple and
  beautiful experiences for people's crucial daily
  interactions with their money, earnings, and pay schedules.

  What You’ll Do

  - Lead technical design and implementation for projects
    powering our @work platform
  - Set architectural standards and ensure best practices in
    code quality, performance, and scalability
  - Partner closely with product, design, and operations to
    shape and deliver @Work product strategy
  - Oversee optimization of systems for reliability, security,
    and scalability
  - Own technical decision-making, balancing rapid delivery and
    sustainable solutions

  You Bring

  - 7+ years of experience building and scaling distributed
    systems, high-throughput APIs, or data-intensive services
  - Solid hands-on full-stack engineering skills, with
    proficiency in backend architecture and modern frontend
    frameworks
  - Experience designing or working on reliable, secure, and
    high-performance systems -ideally in payments, EWA, or
    other regulated consumer finance domains
  - Clear communication skills and a collaborative working style
  - Initiative and growth mindset - eager to learn and
    contribute as a team player

  Tools We Use

  We use Typescript front to back, with node and NestJS
  frameworks for server code and React Native for our iOS,
  Android, and Web clients. We run on a highly distributed
  cloud-native stack with Kubernetes and AWS, and scale and
  resiliency are at the heart of everything we build. We also
  embrace agentic development, so engineers have their choice
  of a variety of models and agent harnesses, including Claude
  Code, Cursor, Codex, and more to fit their workflow. While
  you don't need experience with our exact stack, familiarity
  with modern software engineering practices will help you
  ramp up quickly.

  What We Offer

  - Competitive base salary, stock options, and health benefits
    from Day 1
  - 401(k) plan with company match
  - Remote-friendly (US), flexible time off (FTO), and
    opportunities for growth
  - A high-growth, mission-driven, inclusive culture where your
    work has real impact

  Standard Interview Process

  Our process varies by role. Most candidates go through:

  - AI-assisted initial screen
  - Interview with Talent Partner
  - Technical or Hiring Manager Interview
  - Team Interview
  - Executive Interview
  - Offer!

  Equal Employment Opportunity

  To build technology and products that are used and loved by
  people and solve real-world problems, we need to build a
  team with many different perspectives and experiences. We
  are an equal opportunity employer. We do not discriminate on
  the basis of race, religion, color, national origin, gender,
  sexual orientation, age, marital status, veteran status, or
  disability status. We encourage candidates from all
  backgrounds to apply. Applicants in need of special
  assistance or accommodation during the interview process or
  in accessing our website may contact us at
  talent@onepay.com.
