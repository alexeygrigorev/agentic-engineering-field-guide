description: |
  Basic Function

  The Software Implementation Engineer is responsible for the
  technical onboarding of clients onto Lumin Digital’s digital
  banking platform. This includes configuring platform
  features, supporting data conversion, and working with
  clients to customize the platform using the company’s SDK.
  From implementation kickoff through production launch, this
  role collaborates with both clients and internal teams to
  ensure high-quality, timely deployments. The Software
  Implementation Engineer plays a key role in troubleshooting,
  supporting production operations, and helping ensure long-
  term platform reliability and client satisfaction.

  Essential Functions, Responsibilities,

  - Configure platform features during and after implementation
    to meet client-specific requirements and support smooth
    transitions to production.
  - Serve as a technical advisor during the implementation
    lifecycle, working closely with internal teams and client
    stakeholders to provide best practice guidance and
    technical expertise.
  - Support and execute data conversion tasks, including
    transformation, validation, and import activities for
    client launches, vendor transitions, or M&A integrations.
  - Troubleshoot and resolve implementation-related technical
    issues, ensuring minimal impact to timelines and
    production stability.
  - Collaborate cross-functionally with Engineering, Product,
    Services, and Support to address integration concerns,
    client feedback, and solution alignment.
  - Contribute to production operations, investigating and
    resolving client-reported issues post-deployment to ensure
    platform reliability.
  - Write clean, maintainable, and testable code using internal
    SDK tools to support customizations, configuration
    scripts, and data workflows.
  - Maintain accurate implementation documentation, including
    task tracking, configuration details, and operational
    handoffs.
  - Participate in continuous improvement initiatives, sharing
    insights and suggesting enhancements to tools, processes,
    and standards.
  - Perform other duties as assigned

  Physical Demands:

  - While performing the duties of this Job, the employee is
    regularly required to sit; use hands to type, handle, or
    feel and talk or hear
  - Specific vision abilities required by this job include close
    vision
  - Ability to occasionally lift/move up to 25 pounds
  - Individuals with a disability who are otherwise able to
    perform the essential functions of the job may request
    reasonable accommodation through the Human Resources
    department
  - Other physical activities may be required to support
    business operations.

  Position Specifications

  Education:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field, or an equivalent combination of
    education and experience.

  Experience:

  - At least 3 years of professional software engineering,
    backend development, or related technical engineering
    experience.
  - At least 1 year of technical software implementation
    experience preferred, ideally within digital banking,
    FinTech, or SaaS environments.
  - Hands-on experience with SQL and relational databases for
    data transformation and system configuration.

  Knowledge, Skills, & Abilities:

  - Familiarity with cloud-native technologies including AWS,
    Docker, Kubernetes, and Kibana.
  - Understanding of microservices architecture and its
    application in scalable enterprise platforms.
  - Strong problem-solving and analytical skills, especially in
    time-sensitive client environments.
  - Excellent written and verbal communication skills; capable
    of working with both technical and non-technical
    stakeholders.
  - Ability to work independently, prioritize competing demands,
    and manage multiple client projects simultaneously.
  - Adaptable in dynamic environments and comfortable with
    ambiguity, shifting timelines, or evolving client
    requirements.

  Travel:

  - Minimal, generally 12 days or less per year, ~2X team get
    togethers a year.

  LIFE AT LUMIN DIGITAL

  Lumin Digital is a trailblazer in digital banking solutions,
  driven by a unique approach to technology, service, and
  people. We empower credit unions and banks by creating
  cutting-edge digital experiences that continuously serve,
  engage, and grow their membership base — and as a 100%
  cloud-native company, we're purpose-built to unlock the full
  advantages of the cloud for financial institutions and their
  users.

  At Lumin, we thrive on curiosity and innovation. Our culture
  is built on trust in our expertise and decisions, respect
  for diverse perspectives and talents, and boldness in
  pursuing new ideas. These values shape a workplace where
  collaboration thrives, ideas flourish, and new possibilities
  are discovered every day. We encourage our team to explore,
  experiment, and challenge the status quo — because
  continuous improvement isn't just a goal, it's how we
  operate.

  Benefits include: We take care of our people with medical,
  dental, and vision insurance, a 401(k) with company match,
  flexible PTO plus 12 paid holidays, paid sick leave, and
  paid parental and family leave. We also offer a lifestyle
  spending account, tuition reimbursement, and a cell phone
  stipend. Additional details are provided during the
  interview process.

  Lumin Digital is an equal opportunity employer. We consider
  all qualified applicants without regard to race, color,
  religion, sex, national origin, disability, protected
  veteran status, sexual orientation, gender identity, or any
  other legally protected basis. For more information, visit
  lumindigital.com.
