description: |
  The Frontend Developer will play a key role in building
  intuitive, scalable, and high-performance user interfaces
  for modern web applications. This role requires a strong
  foundation in frontend technologies along with the ability
  to collaborate closely with product managers, designers, and
  backend teams to deliver seamless user experiences.



  You will be responsible for developing and maintaining
  responsive, accessible, and user-friendly applications while
  leveraging modern frameworks and tools. The role also
  involves working with AI-assisted development tools to
  improve productivity, generate code, and streamline
  development workflows.



  The ideal candidate is passionate about clean UI/UX,
  performance optimization, and building reusable components
  while ensuring consistency across applications.



  Key Responsibilities:



  UI Development: Develop responsive, scalable, and high-
  quality user interfaces using modern frontend frameworks



  Application Modernization: Contribute to both greenfield
  development and enhancement of existing (legacy) frontend
  applications



  Code Quality & Best Practices: Follow coding standards,
  perform code reviews, and maintain clean, testable, and
  efficient code



  AI-Assisted Development: Leverage tools like GitHub Copilot,
  ChatGPT, or similar to accelerate development, code
  generation, and documentation



  LLM Interaction: Effectively prompt and refine LLM outputs
  for coding tasks, debugging, refactoring, and improving
  productivity



  Required Skills & Qualifications:



  - 3–5 years of experience in frontend development with strong
    understanding of modern web technologies
  - Proficiency in TypeScript, JavaScript, HTML, and CSS
  - Hands-on experience with modern frontend
    frameworks(Angular).
  - Experience working with design systems and building
    consistent UI components across applications
  - Familiarity with AI-powered development tools (GitHub
    Copilot, ChatGPT) and ability to integrate them into
    workflows
  - Strong understanding of LLM prompting techniques for code
    generation, refactoring, and documentation
  - Experience in building responsive and accessible
    applications
  - Familiarity with state management, API integration, and
    frontend architecture patterns
  - Strong understanding of cross-browser compatibility and
    performance optimization techniques
  - Experience working in collaborative environments with
    designers, product managers, and accessibility teams
  - Proficiency in version control systems (Git) and development
    workflows
  - Understanding of testing frameworks and debugging techniques







  Compensation, Benefits and Duration

  Minimum Compensation: USD 33,000 Maximum Compensation:
  USD116,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
