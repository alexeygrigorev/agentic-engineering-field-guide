description: |
  About Nuvo

  We’re Redefining the $11T B2B Commerce and Payments Market

  Nearly everything you buy, from food to medicine, from
  building materials to auto parts, passes through a chain of
  businesses before it reaches your hands. But every handoff
  between them still runs on paperwork, phone calls, and
  spreadsheets. Nuvo is building the agentic commerce network
  to bring global trade online: shared infrastructure for
  everything from verification to invoicing to payment, with
  AI agents that can automate routine tasks so humans can
  focus on judgment. With 200k+ businesses already run on the
  Nuvo network today, and backed by $45M from Sequoia, Spark,
  Founders Fund, and Index, we're building the operating
  system for global commerce.

  About the role

  Nuvo’s product and platform have grown 3x year on year. As
  we scale up our technologies to connect the world’s
  businesses and enable them to trade on the internet, we are
  looking to bring in an Engineering Manager. As an
  Engineering Manager at Nuvo, you will build, lead, and grow
  a team of engineers to build Nuvo’s technical platforms. You
  will work closely with our founders, product, and customer
  go-to-market teams to deliver compelling product
  experiences.

  You’ll lead and grow one of our core engineering teams,
  owning delivery, quality, and team health, and partner
  closely with product and design to bring bold ideas to life.
  You’ll also help set the foundation for how we scale: our
  culture, our systems, and our standards of technical and
  operational excellence.

  What you'll do

  - Own technical product areas and delivery across our current
    Onboarding Product, Platform, Infra, AI and new products.
  - Lead and mentor a team of world-class engineers to ensure
    high performance, well-being, and growth.
  - Set technical direction for several engineering-driven
    initiatives as Nuvo scales to over 1M businesses on
    network.
  - Help us recruit technically gifted engineers and establish
    an extremely high talent density on the team.
  - Bring to life new products that build on top of our existing
    distribution.
  - Work closely with our customers, go-to-market, and product
    teams.
  - Set a high standard for velocity and code quality.
  - Shape culture: Foster a team environment grounded in
    ownership, speed, and empathy for each other and for our
    users.
  - Leverage cutting edge technologies where possible to
    maximize throughput and discover new product surfaces.

  Who you are

  - You have 8+ years of professional experience and have
    managed and hired teams of engineers.
  - You are a first principles-oriented engineer who prioritizes
    high throughput code output while balancing rigor and
    correctness.
  - You’ve shipped high quality code under tight feedback loops
    and limited resources.
  - You've worked in quickly scaling environments and guided
    engineering success at different stages of a company's
    growth.

  Expected Compensation Range $200,000-$300,000
