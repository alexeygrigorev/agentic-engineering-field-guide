description: |
  The best bit about Red Badger is, of course, the team. We’ve
  been around for 12+ years now and we are over 120 strong. We
  are really proud of our people; we support and learn a lot
  from each other; we work really hard but have fun doing it.
  We are a diverse group made up of 22 different
  nationalities, speaking 17 different languages.

  The Role

  We are looking for a senior, hands-on software engineer with
  a slight front-end lean. The role combines polished React
  interface development with the API, integration, data and
  back-end work required to bring services across the business
  into one client-facing platform. We want someone who
  understands the product problem, contributes ideas and helps
  shape the technical solution, rather than only coding
  against a finished specification.

  - Build production features using React and Next.js, working
    directly with designers in Figma and maintaining reusable
    components through Storybook.
  - Develop Node.js services and REST APIs; work with C#/.NET
    services, Microsoft SQL, Azure SQL and high-volume
    transactional data.
  - Integrate internal and external services through APIs,
    webhooks and SFTP, including platforms comparable to
    Stripe and Royal Mail.
  - Implement secure identity and access management using Auth0
    or comparable authentication and authorisation platforms.
  - Contribute to architecture, code review, secure engineering,
    testing, CI/CD and releases through Azure DevOps.

  How we work We work in an agile, product-led Kanban
  environment managed through Jira. Product owns and
  prioritises user stories, with delivery broken into
  engineering subtasks. Engineers pick up and complete these
  tasks while contributing earlier through discovery, idea
  mapping, requirements scoping, feasibility assessment and
  scope definition. Technical environment React; Next.js;
  Node.js; Storybook; Figma; REST APIs and webhooks; Auth0;
  C#/.NET; Microsoft SQL and Azure SQL; Azure; Azure DevOps;
  Jira; data-lake and warehouse tooling; SFTP; HL7; and SOAP.
  Synapse is API-first and supports both its user interface
  and third-party integrations. Candidate requirements and
  agency shortlisting steer Prioritise engineers from
  established digital product teams who have built and
  operated high-value client-facing web applications, consumer
  services or enterprise-grade SaaS products at scale. We are
  particularly interested in people from highly regulated but
  rapidly transforming organisations who have modernised
  client services while integrating with complex legacy
  technology in large, established blue-chip environments.

  - Strong commercial React, Next.js and Node.js experience,
    with clear evidence of polished, client-facing UI
    delivery.
  - Hands-on collaboration with designers in Figma and
    experience building reusable component libraries in
    Storybook.
  - REST API development and third-party integrations across
    payment, logistics, delivery or comparable external
    services.
  - C#/.NET, Azure, Azure DevOps, Microsoft SQL or Azure SQL,
    secure development and ownership of live production
    applications.
  - Auth0 or comparable authentication and authorisation
    experience in production web applications.
  - High-velocity agile delivery: responding to epics and
    backlog priorities, completing engineering subtasks and
    picking up tickets through Jira.
  - Valuable experience includes API-first or headless
    platforms, high-volume data, webhooks, SFTP, SOAP, HL7,
    data lakes or warehouses, CI/CD and partner-facing API
    documentation.

  Diversity & Inclusion:



  Red Badger is committed to creating a diverse and inclusive
  environment, and is proud to be an equal opportunity
  employer. We hire, employ, train, promote and compensate
  regardless of gender, gender identity, race, disability,
  sexual orientation, age, creed and colour. We are fully
  focused on equality, and it is our fundamental belief that
  the fascinating characteristics that make us all different
  enable us to continue to do amazing work for our clients.
