description: |
  A Software Engineer (TypeScript) in UNiDAYS is a hands-on
  software development role focused on building innovative
  solutions to delight our members and drive product success
  in a fast-paced company. It’s more than just lines of code;
  we are looking for a commercially-minded TypeScript Engineer
  who can bridge the gap between user needs and business
  goals. You will have the ability to build resilient, cost-
  effective solutions and navigate evolving market demands.
  You will be working in one of our product, delivery, and
  engineering teams, defining, refining, building, and
  measuring the impact of the solutions you implement. Our
  Marketplace and Identity products are key to everything we
  do, enabling our users (students and graduates) to access a
  wide range of learning, earning, and retail experiences with
  some of the top brands on the planet. Job requirements You
  must have experience and practical knowledge in:

  - TypeScript
  - Next.js and React
  - Unit testing with libraries like Jest, React Testing
    Library, or vitest
  - e2e testing tools like Cypress or Playwright
  - Strong problem - solving skills and attention to detail
  - A passion for engineering craft - you practise writing
    maintainable code, reviewing code, pair programming at
    times, and writing tests
  - Excellent communication and collaboration skills
  - A desire to build systems that are stable, scalable, secure,
    observable, and performant
  - You seek to understand how your work aligns with business
    goals and maximise the impact

  You might also have an awareness of:

  - Web best practices like:
    - Accessibility
    - Core web vitals
    - Observability
    - Performance
    - SEO
  - Agile methodologies such as Scrum, Kanban etc. and the
    adaptability to respond to the needs of the business

  Definitely not required but you could also be interested in
  learning or have experience with:

  - React Native (our app is built on React Native!)
  - C# and .net (most of our back-end services are .net)

  Job responsibilities

  - Contributing to the team's goal of delivering our next
    generation market place and identity products

  - Deliver impactful features with a pragmatic approach
  - Proactively contributing to the betterment of other
    engineers in the company by providing constructive, candid
    feedback
  - Work closely with engineering leaders to build modern and
    scalable technical solutions
  - Work closely with product managers and product owners in
    creating relevant and performant features for our users
  - Assist in the communication of solutions/risks of technical
    problems to non technical stakeholders.
  - Pragmatic use of AI in delivering solutions
  - Support with ensuring high availability of our critical
    systems and being proactively involved in monitoring and
    incidents

  Benefits This is your opportunity to Join the world’s
  largest student verification network and help shape the
  future of how brands connect with the next generation. We
  engage a community of 23M+ verified students and graduates
  across 115 markets, making us a truly global platform. Our
  brand is a powerhouse in the UK, and we’re rapidly
  accelerating our presence worldwide—especially in the US,
  Germany, India, France, Canada, and Australia. We partner
  with 850+ of the world’s biggest brands, bringing their
  products and services to the hearts and minds of tomorrow’s
  professionals—driving engagement, building affinity, and
  delivering real results. We offer a fast-paced, fun, and
  social working environment where you can truly make an
  impact. We believe work should enhance and complement your
  life, which is why we provide a hybrid working model. You
  will work together in person a minimum of 2 days per week
  and work from home for up to 3 days a week. We work hard at
  UNiDAYS, and we believe in fair compensation for that hard
  work. That’s why we’re proud to offer all employees full
  access to our comprehensive benefits package. Our perks
  include: 25 days holiday per year increasing with length of
  service, plus bank holidays Competitive salaries 4pm
  finishes every Friday Company pension scheme Private health
  insurance (BUPA) Dental Insurance (BUPA) Income protection
  policy Life assurance policy Employee Assistance Program
  Enhanced parental leave pay Regular team building activities
  £150 pounds towards your home office set up We are an equal
  opportunity employer and value diversity at our company. We
  do not discriminate on the basis of race, religion, colour,
  national origin, gender, sexual orientation, age, marital
  status, veteran status or disability status.
