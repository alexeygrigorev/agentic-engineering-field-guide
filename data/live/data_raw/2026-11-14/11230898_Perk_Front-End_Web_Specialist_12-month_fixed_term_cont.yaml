description: |
  About Us Perk (formerly TravelPerk) is the intelligent
  platform for travel and spend management. Built to tackle
  the time-consuming, manual work that gets in the way of real
  work, our tools automate everything from travel bookings to
  expenses, invoice processing, and more. By eliminating this
  shadow work that wastes hours, erodes morale, and saps
  innovation, we're on a mission to power real work, with real
  impact. We're trusted by more than 12,000 companies
  worldwide, including Bolt, GoCardless, and Fabletics, and
  we're tackling the 7 hours of lost productivity per employee
  each week, a $1.7 trillion problem. Founded in 2015, Perk
  has grown into a global company of more than 1,800 people
  across 12 offices globally, with headquarters in London and
  Boston. We combine innovation, control, and simplicity to
  transform how businesses work and how people feel at work.
  At Perk, we're driven by our values, like being an owner,
  delivering a 7-star experience, and working as one team. We
  value curiosity, purpose, and mindset, not just knowledge,
  to unlock the power in your potential. Our talent team
  brings together leading minds from the travel, fintech, and
  SaaS industries, representing over 70 countries. If you're
  excited about having a real impact and shaping how millions
  of people experience work, we'd love you on the team. Visit
  www.perk.com to learn more.

  About the Role

  As a Front-End Web Specialist, you’ll be the connective
  tissue between our web team and the rest of the business.
  This role exists because great websites aren’t just built —
  they’re coordinated, prioritised, and protected from chaos.
  Sitting at the intersection of Marketing and Web
  Development, you’ll own the intake and lifecycle of web
  requests, ensure every project is properly scoped before it
  touches the dev queue, and support the team in delivering an
  ambitious web roadmap.

  But this role doesn’t stop at coordination. You’ll also be
  hands-on in the quality of what we ship — reviewing copy and
  UX before pages go live, supporting CRO initiatives, and
  acting as a critical second pair of eyes on every
  significant release. You care as much about whether a page
  converts as whether it launches on time.

  If you’re someone who thrives on bringing order to
  complexity, understands how a website is actually built, and
  can hold your own in a room with developers, designers, and
  marketers alike, this is your role.

  What You’ll Do

  Technical Ownership & QA

  - Build and ship pages/components directly in Storyblok CMS:
    component configuration, staging, QA, and production
    deployment across market versions
  - QA every release technically — rendering, functionality, and
    cross-browser/device behaviour, not just copy and visual
    polish
  - Use AI tools as a core part of daily production work
    (drafting, layout variants, QA support), and know where AI
    output still needs a human check, particularly around
    localisation nuance and experiment validity

  Request Triage & Scoping

  - Own intake for web requests: qualify, triage, and estimate
    technical complexity and dependencies before anything is
    scoped or scheduled
  - Enforce briefing standards and know enough technically to
    explain why a brief is incomplete
  - Decide what can be handled directly vs. what needs to go to
    the development team, and write specs the team can act on
    without excessive clarification

  Project Coordination

  - Act as day-to-day PM between the development team and
    business stakeholders: track scope, delivery, and risk
  - Maintain the web backlog and sprint board with clear status,
    ownership, and blockers
  - Support CRO initiatives: help build A/B test setups,
    document hypotheses, and track experiment results

  Process & Reporting

  - Maintain intake templates, briefing standards, and triage
    criteria
  - Produce regular status updates and pipeline reports for the
    Head of Web and wider leadership

  What We’re Looking For

  Must-haves

  - 2 to 4 years in a web operations, technical/digital project
    management, or web production role, ideally with hands-on
    CMS or front-end exposure — not purely marketing
    coordination
  - Working technical literacy: solid HTML/CSS fundamentals,
    understanding of how a CMS is structured (Storyblok,
    Contentful, Webflow or similar), staging vs. production
    workflows, and what a QA process actually checks
  - Comfortable using AI tools hands-on in production (prompting
    for drafts, QA’ing AI output) and able to articulate where
    AI isn’t reliable enough to trust unsupervised
  - Product/project-management instincts: can scope a request,
    size complexity, sequence competing priorities, and brief
    external developers with minimal hand-holding
  - Confident translating between technical and non-technical
    stakeholders, and comfortable pushing back on a brief or a
    deadline when needed
  - Strong written communication: a clear brief, a precise QA
    note, a concise status update

  Nice to have

  - Hands-on experience with Storyblok or a comparable headless
    CMS
  - Familiarity with web analytics or conversion tracking
    concepts
  - Exposure to A/B testing/CRO tools, or basic SQL
  - Experience briefing or QA’ing a development team
  - Basic understanding of Core Web Vitals / page performance
  - Familiarity with SEO fundamentals as they intersect with web
    production

  What We Offer

  - Receive competitive compensation and equity ownership in
    Perk
  - Rest and recharge with 25 days of annual leave plus bank
    holidays
  - Take control of your physical health with private medical
    cover and voluntary dental insurance from Bupa, and
    discounted gym memberships with GymFlex
  - Plan for your future with our qualifying earnings company
    pension plan with Aviva
  - Know that your loved ones are protected financially through
    your Life Insurance if the worst were to happen
  - Rest assured that you’re covered by income protection in
    case you experience a long-term sickness or absence
  - Leverage tax-efficient cycle and electric car schemes with
    Cycle2Work & Octopus
  - Join our unforgettable Perk events, including our
    spectacular annual summer party
  - Always feel supported with Spring Health, our market-leading
    wellbeing partner, providing fast, comprehensive access to
    12x therapy and 12x coaching sessions for you and your
    loved ones
  - Focus on your family with 12–16 weeks’ paid parental leave
  - Contribute to your community with 16 paid hours per year to
    spend volunteering for your dearest charitable causes
  - Broaden your horizons with up to 20 “Work from Anywhere”
    days per year
  - Stay savvy with access to a wide variety of discounts and
    rewards
  - Follow your passions and take a four-week, fully paid
    sabbatical once you reach 5 years
  - Let us help you move to one of our hubs with relocation
    support

  AI at Perk AI is embedded in how we work across every
  function. The tools you'll use day-to-day are AI-enabled so
  you can move faster and spend more time on the work that
  matters. In practice, that means using AI to research and
  prioritise accounts, draft and refine outreach, handle
  customer interactions more effectively, synthesise
  information, and cut through shadow work - the invisible
  tasks that pull people away from the work only they can do -
  so you can focus on relationships and outcomes.

  How We Work

  At Perk, we take an IRL-first approach to work, where our
  team works together in-person 3 days a week. As such, this
  role requires you to be based within commuting distance of
  our hubs. We fundamentally believe in the value of meeting
  in real life to improve connectivity, productivity,
  creativity and ultimately making us a great place to work.

  For certain roles, we can help with relocation from anywhere
  in the world, English is the official language at the
  office. Please submit your resume in English if you choose
  to apply. Do not forget to submit an updated portfolio
  and/or resume.

  Perk is a global company with a diverse customer base, and
  we want to make sure the people behind our product reflect
  that. We’re an equal opportunity employer, which means
  you’re welcome at Perk regardless of how you look, where
  you’re from, or anything else that makes you, well, you.

  Protect Yourself from Recruitment Scams

  All official communication from Perk will always come from
  email addresses ending in @perk.com or @externalperk.com,
  our verified social media channels, or recruiters listed on
  our official LinkedIn page. We will never ask you to pay for
  equipment, training, or fees, request sensitive personal
  information such as bank details early in the process, or
  communicate through unofficial apps like WhatsApp, Telegram,
  or Signal. If you receive a message claiming to be from Perk
  that seems suspicious, please do not respond. Forward it to
  security [at] perk .com, and we will confirm whether it is
  legitimate. #LI-Hybrid
