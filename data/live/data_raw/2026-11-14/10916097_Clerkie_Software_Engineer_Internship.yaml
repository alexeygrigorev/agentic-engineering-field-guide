description: |
  A note before you apply

  We’re hiring Software Engineering Interns! This is a full-
  time (40+ hours a week) salaried 12 month internship where
  you’ll work closely with our Engineering, Product, and
  Design teams to build real features, solve real problems,
  and contribute to products that make a difference.

  This listing represents multiple openings and for standout
  interns our goal is to convert this into a full-time
  engineering role at the end of the program.

  About Clerkie

  Clerkie is a fintech startup on a mission to democratize
  financial wellness using the power of artificial
  intelligence. Launched in 2018, Clerkie began with an app,
  aiming to help the nearly 123 million underserved Americans
  in need of financial guidance. Since its inception, the
  company has expanded its services and now pairs consumer
  guidance with cutting-edge B2B software. By pairing the two
  through the Clerkie network, these tools have become the go-
  to resource for creditors looking to manage loan losses
  while simultaneously helping millions of borrowers get out
  of debt.

  Clerkie is a remote-first company, with over 40 employees
  spanning 4 time zones across the United States. To date, the
  company has raised $41 million, including a $33 million
  Series A round in early 2023. Investors include leading
  financial and venture institutions, including Citi Ventures,
  Left Lane Capital, Wellington Ventures, Flourish Ventures,
  and Vestigo Ventures.

  About the internship

  As the newest addition to Team Clerkie, this Software
  Engineer Intern will work across our Engineering function to
  contribute to Clerkie Fiber, our B2B CRM, designed to
  transform the debt industry.

  This full-time 12 month paid internship is designed for
  soon-to-be or recent graduates who are excited to kickstart
  their career in software engineering. You’ll work across the
  full stack, collaborating with engineers on frontend,
  backend, and infrastructure projects. Whether you're
  optimizing APIs, refining user interfaces, or contributing
  to our architecture, your work will have a direct impact.

  This isn’t just another internship - it’s an investment in
  your growth. The ideal Clerkie team member is curious,
  collaborative, and eager to grow in a fast-paced
  environment. Clerkie’s culture values a customer-first
  mindset and a bias for action - we’re looking for someone
  who’s excited to dive in and learn.

  While this opportunity is remote-first, Clerkie offers the
  option to visit or work from our SF HQ at any time.

  Here’s what you will do

  - Develop and maintain Clerkie Fiber, our flagship B2B CRM,
    collaborating closely with backend, frontend, product, and
    design teams
  - Work across the full tech stack, from frontend interfaces
    (Next.js, Tailwind CSS) to backend services (Node.js, AWS,
    MongoDB)
  - Build robust and scalable APIs to support our platform’s
    growing user base
  - Optimize performance and ensure a seamless, user-friendly
    experience
  - Write clean, well-structured, and maintainable code with a
    strong emphasis on scalability and security
  - Contribute to system architecture decisions, helping shape
    the future of Clerkie’s technology

  Minimum qualifications

  - A soon-to-be or recent graduate (class of 2024 or 2025
    preferred) with a degree in Computer Science, Software
    Engineering, or a related field
  - Proficiency in JavaScript/TypeScript and experience with
    React.js, Next.js, or Node.js
  - Comfortable working with databases (SQL or NoSQL, e.g.,
    PostgreSQL, MongoDB)
  - Ability to manage project priorities, meet deadlines, and
    deliver results independently
  - Excitement for being part of a small, fast-moving team where
    every day brings new challenges and opportunities to learn
    and grow

  Preferred qualifications (ranked by priority and not
  required):

  - Personal or school projects involving full-stack development
  - Exposure to AWS, Docker, or CI/CD pipelines
  - Experience with testing frameworks (Jest, Mocha)
  - Interest in fintech or financial literacy

  Other adds

  - Passion for our mission
  - Experience building and scaling products
  - Proactive team player who can work with others towards a
    common goal
  - Extreme focus on the user with a healthy obsession for
    solving their needs
  - Committed to being a part of something bigger than yourself

  Our salary range

  - 💰 Salary range: $80 - 100k
  - 💻 Remote-first role (US only)
  - 🧘 Medical, dental, and vision insurance
  - 📈 401(k) + retirement benefits
  - 🌴 Paid time off + annual company retreat
  - 💻 Company laptop + home office stipend
  - 💙 Collaborative, values-driven culture

  Our Process

  Our hiring process is intentionally designed for you to
  interview Clerkie as much as our team is interviewing you.
  We've built a 5-step process that allows for a two-way
  assessment across skills, behaviors, values, technical
  ability, ways of working, and adaptability in a lean startup
  environment.

  - Application & Coderbyte (async candidate time)
  - Intro Screen w/ People team (20-30 minutes via Google meet)
  - Take-Home Challenge & Live Review w/ Sr. Engineer (challenge
    is async candidate time, live review is 45 mins via Google
    meet)
  - Live Coding Challenge w/ another Sr. Engineer (90 minutes
    via Google meet)
  - Final Management Meeting w/ SLT (45 minutes via Google meet)

  Before we extend any offers, all candidates must
  successfully complete a standard background check in
  addition to a reference check. These checks are conducted in
  tandem to ensure a safe, secure, and compliant environment
  for all Clerkie team members and stakeholders.

  AI & Interview Assessments

  At Clerkie, we embrace AI and use it throughout our day-to-
  day work. We value people who thoughtfully leverage modern
  tools to learn, build, and solve problems more effectively.

  Our interview process is designed to evaluate each
  candidate's own technical thinking, communication, and
  problem-solving approach. To help ensure every candidate is
  assessed fairly, consistently, and under the same
  conditions, we ask candidates not to use external problem-
  solving resources during live interviews or technical
  assessments unless we explicitly state otherwise. This
  includes AI assistants, interview assistants, search
  engines, and other third-party resources. You're welcome to
  reference any documentation or materials that we provide as
  part of the interview.

  This expectation does not apply to approved interview
  accommodations or assistive technologies. If you require a
  reasonable accommodation at any stage of our hiring process,
  please let us know. We're committed to providing an
  accessible and equitable interview experience for all
  candidates.

  If this interview expectation is not followed, we may
  conclude the assessment and discontinue the interview
  process.
