description: |
  Engineering

  About Us

  Turnkey is revolutionizing key management with an API
  designed for unparalleled security, flexibility, and ease of
  use in the Web3 ecosystem. Founded by the leaders who scaled
  Coinbase Custody to over $100M+ ARR, we are rebuilding
  crypto infrastructure from the ground up, tackling
  foundational security challenges to empower developers.

  Much like AWS transformed computing with the advent of the
  cloud, Turnkey is building the trustless, transparent, and
  decentralized infrastructure that will unlock the next wave
  of mass-market crypto applications, solving the critical
  challenge of secure, flexible key management.

  We are looking for talented engineers who are excited by the
  radical potential of crypto to change the world for the
  better. We are generalist engineers and constantly solving
  new problems and challenges. We are language-agnostic,
  though we do use Go, Typescript, and Rust in production and
  while we don't expect you to have a background in every
  technology we use, we do expect strong fundamentals and
  experience building scalable infrastructure.

  What You'll Do

  - Design and build systems from the ground up without cutting
    corners on security or usability
  - Develop signing infrastructure and applications to run
    inside secure computing environments
  - Collaborate effectively across the company to design and
    deliver the core product
  - Write internal product specifications, external developer
    documentation, whitepapers, etc.
  - Design and build new product features end-to-end driven by
    customer requests
  - Assist in scaling out a world-class engineering team
  - Develop thoughtful deployment processes and infrastructure
    to reduce the risks inherent in the software development
    lifecycle

  What We're Looking For

  - 5+ years of production engineering experience
  - Experience with one of the following languages: Go,
    Typescript, or Rust
  - Experience working with AWS, GCP, or other other cloud
    providers
  - An understanding of modern application architectures with
    opinions on how they should be developed and deployed
  - Experience building and operating large-scale, mission-
    critical infrastructure
  - A healthy amount of paranoia:)
  - People who have experience building scaled crypto products

  Style Points

  - Experience developing against TEEs, HSMs, and other secure
    computing environments
  - A deep understanding of the Linux operating system and how
    to reduce the surface area of applications deployed on top
    of it
  - Expertise in threshold signing systems and a desire to stay
    on the cutting edge of production-grade cryptography
  - Actively tracking developments in the crypto ecosystem and
    opinionated on where it is going

  What We Offer

  - Full benefits, including medical, dental, vision, life,
    disability, HSA/FSA, 401(k) - detailed benefits overview
    available as we get further in the process
  - Paid parental leave
  - Unlimited PTO (and we will force you to take time off!)
  - $3,000/yr learning and development budget to attend industry
    conferences
  - Multiple team offsites per year
  - Lunch stipend (for those physically in the New York City
    office)

  Please note that while the team is remote, we are only
  considering candidates who are physically based in the
  United States and Canada at the current time.

  Turnkey is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, protected
  veteran status, or any other characteristic protected by
  law. We encourage individuals of all backgrounds to apply.
