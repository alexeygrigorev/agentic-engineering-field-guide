description: |
  About the company

  Our client is an education technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Deliver full-stack product work from early discovery through
  release, partnering with designers and colleagues outside
  engineering in small project groups. The position combines
  hands-on development with product judgment, architectural
  decision-making and a turn in the on-call schedule.

  What you'll do

  - Take full-stack features from initial discovery through
    scoping, technical specification, implementation and
    refinement based on feedback.

  - Collaborate in small project groups with engineers,
    designers and program staff to launch new pilots and user-
    facing experiences.

  - Offer product suggestions and weigh technical tradeoffs,
    with guidance from more senior engineers.

  - Write clean, maintainable code across the stack and review
    teammates' code.

  - Take part in an on-call rotation and help improve platform
    operations and internal tooling.

  Requirements

  What we're looking for

  - 3 to 6 years of professional software engineering
    experience.

  - A history of releasing full-stack features for a consumer-
    facing product.

  - Background in a small, fast-moving startup environment.

  - Working knowledge of a typed language and a relational
    database, such as TypeScript and Postgres, or a comparable
    stack.

  - Familiarity with a major cloud provider such as AWS or GCP.

  - Comfort translating user pain points into written
    specifications and partnering closely with both non-
    technical users and senior engineers.

  - Motivation to do work that has a positive social effect.

  - Based in the US and available during US working hours.

  Bonus points

  - Prior exposure to consumer platforms involving live
    sessions, two-sided marketplaces or safety tooling.

  Benefits

  Compensation and benefits

  - Base salary: USD 167,000 to 177,000 per year

  - Unlimited paid time off

  - Health, dental and vision coverage

  - Professional development budget

  - Flexible working hours

  Location and work model

  - Remote (US)

  - Full-time
