description: |
  Omada Health is on a mission to bend the curve of chronic
  disease.Job Overview:

  We are hiring a Staff Software Engineer to help expand
  Omada’s footprint in cardiometabolic care and physical
  activity. This is early-stage, high-ownership work: you’ll
  shape how we build new member- and care team-facing
  experiences in this space and set the technical foundation
  for where we take it next.

  You’ll operate primarily in the backend while bringing the
  adaptability to work across the stack when the problem calls
  for it. You should be comfortable learning new systems
  quickly, using modern engineering and AI-assisted tools
  thoughtfully, and making pragmatic technical choices in
  ambiguous spaces.

  You’ll own architecture end to end, set the quality bar, and
  help other engineers make better technical decisions while
  turning complex product opportunities into shipped, reliable
  systems.

  About you:

  You work with empathy for your coworkers, stakeholders and
  users. You are excited to work cross-functionally with a
  variety of people and ideas. You work directly with
  stakeholders to design solutions and drive the technical
  decisions for delivery.  You proactively keep up with
  technology trends and can assess technical trade-offs
  between solutions across service boundaries.  You care about
  writing quality software and recognize that there are often
  many right answers. You are excited about the challenge of
  learning new technologies and context. Above all, you are
  enthusiastic about providing the best possible care for our
  members.

  What you’ll be doing:

  - Partner with product, clinical, and cross-functional teams
    to turn vision into shipped product.
  - Own architecture and technical direction end to end for new
    member- and care team-facing experiences.
  - Apply broad technical judgment across languages, frameworks,
    and systems, using modern engineering and AI-assisted
    tools to quickly build context, evaluate tradeoffs, and
    guide delivery.
  - Set the quality bar: clean, well-tested, scalable code
    others build on.
  - Lead and multiply the team—mentor engineers, remove
    ambiguity, ship fast.
  - Set 6–12 month technical direction and spot high-value work
    before it’s on the roadmap.

  What you need for this role:

  - 10+ years of experience writing readable, tested, and
    efficient code
  - A polyglot builder mindset: strong in at least one of our
    modern backend languages but able to move fluidly across
    the stack optimizing for shipping the right solution
  - Experience with Ruby on Rails
  - Experience with a relational database (PostgreSQL, MySQL)
  - Experience with designing scalable, maintainable and secure
    APIs
  - Experience with CI/CD pipelines
  - Familiarity with LLMs and GenAI best practices
  - Proven experience using AI-assisted development workflows to
    move quickly from ambiguity to shipped, resilient product
    experiences
  - Familiarity with cloud infrastructure (AWS preferred), and
    deployment tools (Kubernetes, Docker)
  - Understanding of logging, monitoring and telemetry
  - Understanding of DevOps concepts and principles
  - Interest in learning new tools, languages, workflows, and
    philosophies to grow
  - Excellent communication and collaboration skills (verbal and
    written)

  Technologies we use:

  Ruby on Rails, React, AWS (RDS with PostgreSQL, SQS),
  GraphQL, Docker, Kubernetes

  Benefits:

  - Competitive salary with generous annual cash bonus
  - Equity grants
  - Remote first work from home culture
  - Flexible Time Off to help you rest, recharge, and connect
    with loved ones
  - Generous parental leave
  - Health, dental, and vision insurance (and above market
    employer contributions)
  - 401k retirement savings plan
  - Lifestyle Spending Account (LSA)
  - Mental Health Support Solutions
  - ...and more!

  It takes a village to change health care. As we build
  together toward our mission, we strive to embody the
  following values in our day-to-day work. We hope these hold
  meaning for you as well as you consider Omada!

  - Cultivate Trust. We listen closely and we operate with
    kindness. We provide respectful and candid feedback to
    each other.
  - Seek Context. We ask to understand and we build connections.
    We do our research up front to move faster down the road.
  - Act Boldly. We innovate daily to solve problems, improve
    processes, and find new opportunities for our members and
    customers.
  - Deliver Results. We reward impact above output. We set a
    high bar, we’re not afraid to fail, and we take pride in
    our work.
  - Succeed Together. We prioritize Omada’s progress above team
    or individual. We have fun as we get stuff done, and we
    celebrate together.
  - Remember Why We’re Here. We push through the challenges of
    changing health care because we know the destination is
    worth it.

  About Omada Health: Omada Health (Nasdaq: OMDA) is reverse
  engineering the way healthcare is delivered in America,
  putting the space between doctor visits–where health is won
  or lost–at the center of care. Today's healthcare system
  poorly serves chronic conditions that require ongoing
  support outside of the exam room, like obesity, diabetes,
  hypertension, cholesterol, and musculoskeletal conditions.
  Omada’s virtual-first model combines human-led care teams,
  connected devices, and AI-enabled technology to deliver
  personalized care at scale, including support for GLP-1
  therapy. Omada has served more than two million members
  since launch across 2,000+ employers, health plans, pharmacy
  benefit managers, and health systems. Learn more at
  omadahealth.com.

