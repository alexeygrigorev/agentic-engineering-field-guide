description: |
  👋 Welcome to Glide!

  At Glide we’re reimagining the banking experience for the
  modern world. Our embedded fintech platform empowers legacy
  financial institutions, like community banks and credit
  unions, to pioneer novel digital experiences for their
  customers.

  You’ll be joining an all-star team with engineering,
  product, and growth experience from Stripe, Google, and
  Amazon. We’re looking for a talented early career Fullstack
  Engineer to help us build our platform. We’re bringing a new
  perspective to the decades-old financial world, and we’re
  hoping you can help us do that!

  Why You’ll Love This Role (Especially if you’re a new grad):

  - A unique opportunity to work side-by-side with Glide’s
    founders and senior engineers, learning directly from
    industry veterans.
  - Gain hands-on, end-to-end experience across the full stack:
    from architecture design to deployment.
  - Be part of a small, fast-moving startup, where your code has
    immediate impact.
  - Get mentorship and exposure to real-world engineering best
    practices, product development, and startup culture.

  Your Responsibilities:

  - Move seamlessly between frontend and backend to build a
    well-tested, secure frontend for our core web product.
  - Create trustworthy, safe user experiences by building
    interfaces that are simple, reliable, and performant using
    tools like Typescript, React, Node.js and NextJS.
  - Design a scalable architecture that can serve hundreds of
    thousands of end users.
  - Bring designs to life through beautifully-crafted code.
  - Articulate a long-term technical direction and vision for
    maintaining and scaling our web product suite.
  - Lead frontend and backend infrastructure & tooling for an
    ambitious product roadmap.

  Need-to-Haves:

  - Experience with Javascript and tools like Typescript, React,
    Node.js and NextJS.
  - Experience with modern, responsive HTML & CSS.
  - Experience using data fetching libraries like React
    Query/Tanstack or tRPC to synchronize client and server
    data.
  - Excellent understanding of software engineering best
    practices (architecture, test-driven development,
    component libraries).
  - Excellent understanding of security in software engineering
    and of how to build secure, unassailable systems.
  - Experience with automated testing frameworks.
  - Experience with CI/CD, Version Control, and DevOps tools
    like Amazon Web Services, Git and Docker.
  - Experience working in agile development teams.

  Nice-to-Haves:

  - 2-5 years of full-time software engineering experience.
  - Thrives in a fast-paced environment and seeks to learn from
    and collaborate with a team of all-star senior engineers.
  - A desire to own a product end-to-end, from conception to
    design to technical specification to implementation to
    delivery.
  - A collaborative, entrepreneurial spirit.

  Perks and Benefits:💸 Competitive Compensation:

  You’ll receive a competitive salary and a generous equity
  package for joining us at Glide.

  ❤️ Wellbeing Credits (for US employees)

  Besides stellar health, dental, and vision insurance, we
  offer a generous health and wellness stipend, so you can
  stay healthy and active.

  🥗 Lunch on us (for US employees)

  We love food. Every member of the Glide team gets free
  lunch, every day. No one goes hungry around here :)

  💻 Best Tools

  We want you to be happy at work. You'll get a full equipment
  upgrade - from a top-of-the-line computer to your preference
  on keyboard, mouse, and accessories.
