description: |
  About the Role



  Uncountable is looking for an Engineering Manager to lead
  our Implementations Software Engineering team. In this role,
  you’ll collaborate directly with both internal engineers and
  external stakeholders at some of the world’s leading
  materials and chemical companies. You will guide your team
  in building scientific applications and integrating
  enterprise systems with Uncountable’s platform, helping
  customers transform how R&D gets done. You’ll be at the
  intersection of leadership, technical architecture, and
  customer engagement—contributing to Uncountable’s mission of
  accelerating innovation across industries like chemicals,
  coatings, pharma, and more.





  Why Uncountable?



  Uncountable was founded by a team of Stanford and MIT
  engineers who believed that R&D teams deserved better
  software. Today, we’re building a platform that helps
  customers like Sika, Clariant and Mondelez drive innovation
  faster than ever before.Join us if you’re passionate about
  impactful software, world-class science, and empowering
  teams to push the boundaries of innovation.

  By applying for this role, your personal data will be
  processed in accordance with our Privacy Policy.
