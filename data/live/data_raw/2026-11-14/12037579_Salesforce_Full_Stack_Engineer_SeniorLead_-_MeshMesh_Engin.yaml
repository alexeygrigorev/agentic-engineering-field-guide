  Job Details

  About Salesforce

  Salesforce is the #1 AI CRM, where humans with agents drive
  customer success together. Here, ambition meets action. Tech
  meets trust. And innovation isn’t a buzzword — it’s a way of
  life. The world of work as we know it is changing and we're
  looking for Trailblazers who are passionate about bettering
  business and the world through AI, driving innovation, and
  keeping Salesforce's core values at the heart of it all.

  Ready to level-up your career at the company leading
  workforce transformation in the agentic era? You’re in the
  right place! Agentforce is the future of AI, and you are the
  future of Salesforce.

  The Experience As a Full Stack Engineer on MeshMesh, you
  will build features end-to-end, from backend services to the
  customer-facing experience, helping bring our mesh
  networking platform to life for customers. What You'll
  Actually Be Doing

  - Build and maintain services and APIs that power the MeshMesh
    platform.
  - Develop customer-facing features across the full stack.
  - Collaborate with product and design partners to translate
    requirements into working software.
  - Write clean, tested, maintainable code and participate in
    code reviews.

  You're Our Person If...

  - You have 4-8 years of experience.
  - You have experience building production software across both
    backend and frontend layers.
  - You are proficient in modern web frameworks and backend
    languages.
  - You have experience designing and consuming APIs.
  - You are an Agentic Engineer - you build with Claude and
    similar AI coding tools, using agent loops, tool use, and
    well-grounded context engineering to ship code fast.

  Even Better If...

  - You have experience with networking or real-time systems.
  - You have contributed to a product from early stage through
    scale.
  - You experience in DevOp, Security, or Architecture.

  Unleash Your Potential

  When you join Salesforce, you’ll be limitless in all areas
  of your life. Our benefits and resources support you to find
  balance and be your best, and our AI agents accelerate your
  impact so you can do your best. Together, we’ll bring the
  power of Agentforce to organizations of all sizes and
  deliver amazing experiences that customers love. Apply today
  to not only shape the future — but to redefine what’s
  possible — for yourself, for AI, and the world.

