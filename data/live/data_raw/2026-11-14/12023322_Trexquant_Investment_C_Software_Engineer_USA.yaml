description: |
  Trexquant is a growing systematic fund at the forefront of
  quantitative finance, with a core team of highly
  accomplished researchers and engineers. We are continuously
  optimizing and reimagining our trading infrastructure to
  keep pace with our expanding business. To support our rapid
  growth, we are seeking a talented C++ Software Engineer to
  join our technology team and help build and enhance the
  systems that power our quantitative trading platform.

  As a C++ Software Engineer, you will work closely with our
  engineering teams to design, develop, and optimize high-
  performance trading systems infrastructure. Your
  responsibilities will span multiple greenfield areas,
  including order management systems (OMS), market data,
  trading infrastructure, and data platforms. The ideal
  candidate will have strong modern C++ fundamentals,
  experience with distributed systems, and a demonstrated
  ability to write performant, memory-efficient code.

  Responsibilities

  - Design, develop, and maintain high-performance C++
    infrastructure supporting our trading systems, including
    order management systems (OMS), market data, and data
    platforms.
  - Build and optimize scalable, distributed systems with a
    focus on execution speed, memory efficiency, reliability,
    and throughput.
  - Collaborate closely with engineering teams and quantitative
    researchers to develop innovative technical solutions,
    improve existing systems, and contribute to new
    infrastructure initiatives across the firm's trading
    platform.

  Requirements

  - Degree in Computer Science or a related field, with 1–3+
    years of software engineering experience or equivalent
    experience through advanced academic research (MS/PhD).
  - Strong proficiency in modern C++ (C++17/20/23), with a deep
    understanding of data structures, algorithms, memory
    management, multithreading, and concurrency.
  - Demonstrated ability to write efficient, production-quality
    C++ code, with an emphasis on execution speed and memory
    optimization.
  - Experience designing and developing distributed systems,
    with a solid understanding of networking fundamentals.
  - Experience developing software in a Linux environment.
  - Experience with trading systems, market data, or financial
    technology is a plus, but not required.

  Benefits

  - Competitive salary plus bonus based on individual and
    company performance.
  - Collaborative, casual, and friendly work environment.
  - PPO Health, dental and vision insurance premiums fully
    covered for you and your dependents.
  - Pre-tax commuter benefits.
  - Weekly company meals.

  Applications are open for both Stamford, CT and New York
  City offices.

  The base salary range is $175,000 to $200,000 depending on
  the candidate’s educational and professional background.
  Base salary is one component of Trexquant’s total
  compensation, which may also include a discretionary,
  performance-based bonus. This position is classified as
  overtime-exempt.

  Trexquant is an Equal Opportunity Employer.
