description: |
  About Us

  We’re Dayshape—an award-winning software scale-up with big
  ambitions and the momentum to match. Trusted by Big Four and
  many other top professional services firms globally, our AI-
  powered resource management platform is helping
  organisations to achieve extraordinary results. 

  Our platform stands apart as the only solution that
  combines advanced AI, real-time project financials, and
  firm-wide insights to elevate resource management to a
  strategic function. By driving profitable growth, powering
  confident decisions, and ensuring satisfied clients
  and teams—we're helping our customers build strong
  organisations and careers for the long term.

  Why our customers love Dayshape:

  - We help professional firms optimise margins and increase
    revenue, unlocking access to more profitable work.

  - We provide complete operational visibility today and the
    tools to confidently predict tomorrow.

  - We empower firms to become the places where top talent wants
    to work - and the best clients want to work with.

  Recognised as Scotland’s fastest-growing tech company in the
  Deloitte Technology Fast 50 for three consecutive years and
  more recently as the Enterprise Digital Tech Business of the
  Year at the 2024 ScotlandIS awards, we’ve consistently
  proven our ability to innovate and deliver real impact—and
  we’re always looking for like-minded people to join us.

  At Dayshape, our purpose is to improve people's working
  lives, and our culture is an important driving force in
  helping us to do just that. We're a friendly, inclusive, and
  ambitious team—driven by our values and a shared commitment
  to success. If you’re ready to join a fast-growing, high-
  impact company that’s reimagining resource management, then
  let’s talk.

  About the role

  We've come a long way in a short time, but there's still so
  much more we can do. We have grand ambitions to make
  Dayshape the most scalable, flexible and rapid to deploy
  solution on the market, and we’re not there yet. That’s
  where you come in.

  As part of our Engineering team, your key areas of focus
  will be enhancing product scalability and usability, helping
  consistently deliver features that support our customers'
  success. As a senior engineer, you will work collaboratively
  with the rest of our cross-functional team to plan and
  deliver new features and enhancements. You will take
  ownership of features and technical initiatives and make
  sure they are successful, while keeping an eye on UX,
  accessibility and aesthetics.

   What you’ll do

  - Support our product and engineering managers in
    prioritisation, scoping and leading delivery of product
    features

  - Write complex, performant frontend business logic in
    JavaScript

  - Write and upgrade UI components using JavaScript and Vue.js

  - Write automated tests to assure quality (unit and end-to-end
    testing)

  - Support, mentor and coach other members of the team

  - Work with the rest of our engineering team to enhance
    scalability, performance and maintainability

  - Support our culture of learning, development and teamwork

  - Be involved in the entire life-cycle of features, including
    idea creation, deployment, and longer term updates and
    enhancements

   About you

  - A confident and highly experienced senior JavaScript
    developer, writing both vanilla JS and modern frameworks
    (Vue.js in particular)

  - Experienced working in Agile teams as part of a product
    development environment

  - Comfortable writing unit tests and end-to-end automated
    tests

  - Able to zero-in on bugs without looking at the code, based
    on your experience and intuition

  - Passionate about shipping a product you can be proud of

  - Comfortable challenging and raising issues at any level

  - Well-informed on good software development principles, and
    able to implement them pragmatically

  - Knowledgeable about a range of technologies, and quick to
    learn others

  - An excellent and kind communicator, able to raise awkward
    questions kindly, and to recognise when you need help

  - Experienced in collaborating with others - you will be
    working closely with engineering, product and QA
    colleagues

  - Adaptable, and motivated to try/learn new things

  - Great at breaking down large tasks into manageable chunks

  - Able to see the Big Picture - how your decisions affect your
    colleagues and your users

  Bonus points if you have

  - Experience working with complex web interfaces with large
    DOM views

  - Experience writing tests in Jest, Cypress or Playwright

  - Experience with the rest of our stack: C#, .Net (+Core), SQL
    Server, and/or Microsoft Azure

  - Experience working in (or with) the Professional Services
    industry

   What you’ll get

  - Starting salary between £50,000 and £60,000, depending on
    experience

  - Earning potential in the Software Engineer salary band up to
    £63,650

  - At least £1,000 per year to spend on professional and
    personal development

  - 33 days' holiday per year (including bank holidays),
    increasing by 1 day each year to a maximum of 40 days

  - Paid four week sabbatical in your fifth anniversary year on
    top of your holiday entitlement

  - Enhanced family leave policies
  - Private medical insurance, including dental and vision
    benefits
  - Income protection and death in service cover

  - Matched 5% auto-enrolment workplace pension scheme

  - Access to wellbeing offerings, such as our Employee
    Assistance Programme and a dedicated counselling service
  - Volunteering time – up to 20 hours a year to participate in
    volunteer work

  - Regular All Hands meeting for inspiration and over-
    communication

  - Time out of the working week for team socials each month,
    with a mix of in-person and virtual options: past events
    include hiking, family BBQs, board games and at-home
    cocktail classes!

  - Genuinely nice, smart people to work with, who are excited
    about growing our company

  Working Details

  This is a full-time role (37.5 hours per week). We typically
  work from 09:00 - 17:30 from Monday to Friday, though we can
  be flexible around this, just let us know.

  This role can be done fully remotely, as long as you are
  based in the UK. We have an office in Haymarket, Edinburgh,
  and you’re always welcome to join us there, but there are no
  required office days. Our team works closely together, so we
  collaborate day to day through regular video calls and team
  chat.

  Join the team!

  Equality of opportunity is more than just a responsibility:
  we believe it’s a huge advantage to welcome a variety of
  experiences and perspectives into the team. Diversity is a
  great asset and, as such, we strongly encourage applications
  from any background.

  This is your opportunity to really influence how we get
  things done, and how our product develops to meet our
  customer’s needs. We're doing well, but there's lots more to
  do in order to maintain the high bar and pace that we've
  set.

  If your experience isn't an exact match for this job
  description, but you have transferrable skills/experience
  that you think would be a great fit, please outline this in
  a cover letter. Everyone here is growing personally as the
  company grows, so if that sounds like something you’d like
  to be part of, we’d love to see your application.

  *Please note the successful candidate for this role will be
  subject to background checks and will have an opportunity to
  declare anything to us beforehand*
