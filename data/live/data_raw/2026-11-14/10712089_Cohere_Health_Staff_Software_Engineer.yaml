description: |
  Opportunity Overview:

  We are seeking a Staff Software Engineer to join our
  Engineering department. In this role, you will direct a
  fast-paced, collaborative, agile team of software engineers
  in the design, development, and scaling of highly available
  AI healthcare products on the Cohere platform. You'll set
  the technical direction for how the platform evolves —
  owning architecture and design decisions that span multiple
  teams and outlive any single release. This is an opportunity
  to drive technical excellence, define customer-
  configurability capabilities, and establish patterns other
  teams build on at the intersection of healthcare
  interoperability and modern distributed systems.

  This is a remote-first role that may require travel to
  Boston, MA for new hire onboarding and occasional in-person
  team meetings and company events.

  What you’ll do:

  - Technical Leadership: Provide technical leadership across
    architecture, system design, and mentor junior engineers
    for building scalable SaaS products.
  - Platform Ownership: Lead the development and enhancement of
    Cohere’s AI-powered  applications and platforms, ensuring
    that it is highly configurable, and optimized for
    performance.
  - Data & Retrieval Architecture: Design data and retrieval
    architectures that give AI agents the right context,
    across diverse healthcare sources.
  - Hands-On Engineering: Design, review, and own high-quality
    production code — actively contributing alongside the
    team, leading releases, production deployments, reducing
    developer development friction and on-call support.
  - NFR, Security & Compliance:  Drive technical strategy to
    ensure the team's designs consistently address non-
    functional requirements — observability, instrumentation,
    performance, and operational readiness that incorporate
    security and privacy regulations
  - Cross-Functional Collaboration: Work closely with ML/DS
    teams, product teams, and architects to understand
    requirements and ensure systems meet business needs.
  - Agile Development: Contribute to sprint planning, execution,
    and retrospectives, driving efficiency and velocity within
    the engineering team and collaborating closely with
    stakeholders to align with product goals and business
    priorities.

  What you’ll need:

  - 12+ years in the software development lifecycle, with
    progression to complex, high-impact cloud-native system
    design
  - Expertise in auth/authz frameworks, secure API design,
    access control, and automated testing
  - Strong system design, observability, and production
    operations skills
  - Fullstack expertise in modern languages, event-driven
    systems, and CI/CD; IaC a plus
  - Experience designing data systems/pipelines for analytical
    and AI workloads, with strong data modeling fundamentals
  - Track record shaping engineering standards, mentoring
    engineers, and communicating strategy across technical and
    non-technical audiences
  - AI architectures (multi-agent, RAG, evaluation frameworks) a
    plus
  - Healthcare tech, health plan, or Payment Integrity
    experience a plus; Healthcare interoperability standards
    and clinical ontologies a plus
  - Bachelor's degree in Computer Science, Software Engineering,
    or related field

  Pay & Perks:

  💻 Fully remote opportunity with about 5% travel

  🩺 Medical, dental, vision, life, disability insurance, and
  Employee Assistance Program

  📈 401K retirement plan with company match; flexible spending
  and health savings account

  🏝️ Flex Time Off + company holidays

  👶 Up to 14 weeks of paid parental leave

  🐶 Pet insurance 

  The salary range for this position is $185,000 to $225,000
  annually; as part of a total benefits package which includes
  health insurance, 401k and bonus. In accordance with state
  applicable laws, Cohere is required to provide a reasonable
  estimate of the compensation range for this role. Individual
  pay decisions are ultimately based on a number of factors,
  including but not limited to qualifications for the role,
  experience level, skillset, and internal alignment.

  Interview Process*:

  - Connect with Talent Acquisition for a Preliminary Phone
    Screening
  - Meet your Hiring Manager!
  - Live System Design
  - Project Discussion
  - Cross Functional Interview

  *Subject to change

  About Cohere Health:

  Cohere Health’s clinical intelligence platform and agentic
  AI-powered solutions connect health plans’ strategic goals
  and providers’ needs, optimizing the speed, cost, and
  quality of care. With an enterprise approach that
  streamlines payer-provider decision-making across the care
  continuum–including policy, prior authorization, payment
  accuracy, and more–the company improves collaboration and
  reduces burden, resulting in up to 8x ROI and 94% provider
  satisfaction.

  With the acquisition of ZignaAI, we’ve further enhanced our
  platform by launching our Payment Integrity Suite, anchored
  by Cohere Validate™, an AI-driven clinical and coding
  validation solution that operates in near real-time. By
  unifying pre-service authorization data with post-service
  claims validation, we’re creating a transparent healthcare
  ecosystem that reduces waste, improves payer-provider
  collaboration and patient outcomes, and ensures providers
  are paid promptly and accurately.

  Cohere Health’s innovations continue to receive industry
  wide recognition. We’ve been named to the 2025 Inc. 5000
  list and in the Gartner® Hype Cycle™ for U.S. Healthcare
  Payers (2022-2025), and ranked as a Top 5 LinkedIn™ Startup
  for 2023 & 2024. Backed by leading investors such as
  Deerfield Management, Define Ventures, Flare Capital
  Partners, Longitude Capital, and Polaris Partners.

  The Coherenauts, as we call ourselves, who succeed here are
  empathetic teammates who are candid, kind, caring, and
  embody our core values and principles. We believe that
  diverse, inclusive teams make the most impactful work.
  Cohere is deeply invested in ensuring that we have a
  supportive, growth-oriented environment that works for
  everyone.

  We can’t wait to learn more about you and meet you at Cohere
  Health!

  Equal Opportunity Statement:

  Cohere Health is an Equal Opportunity Employer. We are
  committed to fostering an environment of mutual respect
  where equal employment opportunities are available to all.
  To us, it’s personal.

