description: |
  Who We Are

  Decisionly is building AI-powered dispute decisioning for
  card issuers, eliminating cost and enabling compliant,
  scalable card operations. Decisionly automates complex
  manual workflows end-to-end, modernizing payment
  infrastructure and generating unique first-party fraud
  insights for fintechs, processors and banks.

  Our founding team has a strong track record and unique
  founder-market fit. We founded Chargehound (backed by Y
  Combinator, Khosla), the first automated dispute solution
  for merchants like Airbnb, Uber and Doordash. PayPal
  acquired Chargehound in 2021 for $XXXM.

  Decisionly is growing rapidly, has strong market validation,
  and is backed by Fika Ventures, Vesey Ventures, Dash Fund,
  and angels from top fintechs including Stripe and Plaid. We
  are a remote company.

  As an early hire, you'll play a critical role in shaping our
  product development.

  The Role

  We're looking for a high-agency software engineer who
  thrives in a greenfield environment and likes building
  simple solutions for complex problems. As an engineer at
  Decisionly, you'll work directly with the CTO to shape the
  product and refine our technical vision. You'll be an early
  hire at a fast-growing fintech startup, working across the
  stack and taking ownership of key projects as we scale our
  product and acquire customers.

  What You'll Do

  - Research and develop new features across our product and
    infrastructure
  - Build and maintain secure, scalable APIs for our service
  - Incorporate compliance and security considerations into our
    tech stack
  - Design and deploy infrastructure using Terraform and modern
    DevOps practices
  - Integrate with third-party APIs to expand product footprint
  - Act as a technical point of contact for customers

  Who You Are

  - 3+ years of backend development experience (within the
    payments industry is a plus)
  - Experience working with clients
  - Experience with Node and/or TypeScript
  - Experience with PostgreSQL or equivalent database
  - Able to tackle legacy systems or dense technical
    documentation with persistence and a sense of humor
  - Experience deploying LLMs to production environments
  - Familiarity with AWS, and preferably Terraform
  - A fast learner who thrives in a dynamic, unstructured
    environment
  - Experience in high-growth startups, fintech, enterprise
    SaaS, or regulated industries is a plus

  Additional Info

  - Competitive compensation and equity package
  - Candidates must be authorized to work in the U.S. without
    sponsorship
  - We are a remote-first team, but candidates must be based in
    the U.S.
