description: |
  About Air Apps

  At Air Apps, we believe in thinking bigger - and moving
  faster. We’re a family-founded company on a mission to
  create the world’s first AI-powered Personal &
  Entrepreneurial Resource Planner (PRP), and we need your
  passion and ambition to help us change how people plan,
  work, and live. Born in Lisbon, Portugal, in 2018 - and now
  with offices in both Lisbon and San Francisco - we’ve
  remained self-funded while reaching over 100 million
  downloads worldwide.

  Our long-term focus drives us to challenge the status quo
  every day, pushing the boundaries of AI-driven solutions
  that truly make a difference. Here, you’ll be a creative
  force, shaping products that empower people across the
  globe.

  Join us on this journey to redefine resource management -
  and change lives along the way.

  The Role

  As a DevOps Engineer – Backend, you will play a key role in
  designing, automating, and maintaining the infrastructure
  that powers our backend systems. You’ll work closely with
  developers to streamline deployments, improve scalability,
  and ensure our services are reliable, secure, and cost-
  effective. By building efficient CI/CD pipelines, managing
  cloud environments, and enforcing infrastructure best
  practices, you’ll enable our teams to deliver high-quality
  features quickly and confidently.

  - This is a fully onsite position, based at our office in
    Lisbon, where you will collaborate closely with cross-
    functional teams in person and contribute to a dynamic and
    fast-paced environment. We are open to support with
    relocation efforts.

  Responsibilities

  - Design, implement, and maintain CI/CD pipelines to automate
    build, test, and deployment processes.
  - Manage and optimize cloud infrastructure on AWS, Azure, or
    Google Cloud Platform (GCP).
  - Implement Infrastructure as Code (IaC) using tools like
    Terraform, CloudFormation, or Pulumi.
  - Deploy and manage containerized applications using Docker
    and Kubernetes.
  - Monitor system performance, identify bottlenecks, and
    improve infrastructure reliability.
  - Establish and enforce security best practices, including
    identity management, logging, and vulnerability
    management.
  - Work with development teams to improve deployment efficiency
    and troubleshoot infrastructure issues.
  - Optimize cloud resource utilization to ensure cost-
    effectiveness and scalability.
  - Automate infrastructure provisioning, configuration
    management, and system maintenance.
  - Stay up-to-date with emerging DevOps technologies, tools,
    and best practices.

  Requirements

  - Around 3+ years of experience in DevOps, Site Reliability
    Engineering (SRE), or Cloud Engineering.
  - Strong expertise in CI/CD tools (Jenkins, GitHub Actions,
    GitLab CI, CircleCI, ArgoCD).
  - Experience with cloud services (AWS, Azure, or GCP) and
    serverless computing.
  - Proficiency in Infrastructure as Code (IaC) tools like
    Terraform, CloudFormation, or Pulumi.
  - Hands-on experience with containerization and orchestration
    (Docker, Kubernetes, Helm).
  - Strong knowledge of Linux-based systems, networking, and
    security best practices.
  - Scripting skills in Bash, Python, or Go for automation.
  - Experience with monitoring and logging tools (Prometheus,
    Grafana, ELK, Datadog).
  - Understanding of cloud cost optimization, scalability, and
    high-availability architectures.
  - Strong problem-solving skills and ability to work in an
    agile, fast-paced environment.

  What benefits are we offering?

  - Apple hardware ecosystem for work.
  - Annual Bonus
  - Top-tier Health and Life Insurance for peace of mind.
  - Transportation Budget to support your commute needs.
  - Coverflex benefits package for meal allowances, well-being,
    and more.
  - Childcare support.
  - Air Conference - an opportunity to meet the team,
    collaborate, and grow together.
  - Pension Fund to support your long-term financial planning.
  - Urban Sports Club membership to keep you active.
  - Meals 100% free at the hub.

  Diversity & Inclusion

  At Air Apps, we are committed to fostering a diverse,
  inclusive, and equitable workplace. We enthusiastically
  welcome applicants from all backgrounds, experiences, and
  perspectives. We celebrate diversity in all its forms and
  believe that varied voices and experiences make us stronger.

  Application Disclaimer

  At Air Apps, we value transparency and integrity in our
  hiring process. Applicants must submit their own work
  without any AI-generated assistance. Any use of AI in
  application materials, assessments, or interviews will
  result in disqualification.

  Important Notice

  Air Apps does not partner with nor is represented by any
  recruiting agencies, staffing firms, or third-party
  recruiters in connection with our hiring efforts. All
  legitimate communication regarding Air Apps opportunities
  will come exclusively from an official @airapps.com email
  address. Additionally, all open positions are published only
  through our official careers platform, Ashby. If you are
  contacted by anyone claiming to represent Air Apps from a
  different email domain, through a recruiting agency, or via
  a job posting source other than Ashby, please exercise
  caution. We do not accept unsolicited candidate submissions
  from agencies, and any such submissions will not be
  considered.
