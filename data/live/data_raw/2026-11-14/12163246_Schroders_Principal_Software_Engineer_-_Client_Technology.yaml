title: Principal Software Engineer - Client Technology
company: Schroders
location: London, GBR
work_type: FULL_TIME
company_size: 5,387 Employees
description: |
  Who we're looking for

  We are looking for an experienced Full Stack Developer with
  strong expertise in both front-end and back-end technologies
  to work with our Web development team. You will lead and
  contribute to all aspects of solution design, technical
  development, testing and implementation of high-quality
  platforms that are easy to maintain and extend.  It's an
  exciting time to join Schroders with significant steps being
  taken to transform our technology landscape and ways of
  working. We’re looking for someone who is passionate about
  driving change and prepared to face challenges head on to
  achieve improved outcomes for our engineering practice. You
  will be responsible for:

  - Building web applications with TypeScript, Next.js and
    React, HTML5, CSS3 and responsive design.
  - Maintaining the team’s component library and design system
    using Storybook.
  - Building backend services and APIs with Node.js (Express)
    and Azure Functions, integrating with Contentstack.
  - Delivering and running services on Azure (App Service,
    Functions, Storage, event hubs etc) using Terraform and
    Github Actions CI/CD.
  - Leading all aspects of software delivery in terms of design,
    development, testing and implementation.
  - Using AI-assisted development tools and helping to explore
    AI capabilities on the platform.
  - Collaborating with business stakeholders and agile analysts
    to effectively translate features and user stories into
    working software that is fit for purpose.
  - Working with Engineering Lead to implement the Technology
    roadmap.
  - Working with Delivery Lead to prioritize backlog and ensure
    technical debt is being tracked, logged, and mitigated in
    a timely manner.
  - Working with our UX Design team to deliver the best user
    experience for our customers.
  - Articulating technical solutions to non-technical and
    business stakeholders.
  - Working with colleagues from other teams to identify and
    resolve dependencies.
  - Providing technical guidance, conducting code reviews,
    ensuring adherence to software standards and policies, and
    mentoring team members where required.
  - Contributing to agile planning and ceremonies including
    story refinement, demos, and retrospectives.
  - Contributing to the Enterprise Engineering community through
    discussion on technology trends, innovative ideas and
    sharing of solutions to common issues.
  - Maintenance, support and innovative development of a complex
    Digital platform to drive positive value-based outcomes
    for the business and our clients.

  The role requires a structured, creative individual who can
  support our growing demand for web development on a global
  level. It is a senior development position and strong
  technical skills are required.

  About Schroders

  Schroders is a global investment manager which provides
  active asset management, wealth management and investment
  solutions. We aim to provide excellent investment
  performance to clients through active management. We serve a
  diverse client base that includes pension schemes, insurance
  companies, sovereign wealth funds, endowments, foundations,
  high net worth individuals, family offices, as well as end
  clients through partnerships with distributors, financial
  advisers, and online platforms.

  Established in 1804, we have around 5,500 people across 36
  global locations. Schroders' success can be attributed to
  its diversified business model, spanning different asset
  classes, client types and geographies.

  Technology at Schroders

  There's a huge amount of change going on at Schroders.
  Technology shapes our business, so there are many
  opportunities waiting to be grabbed.  And because we're a
  big financial player, we can put hefty backing behind good
  ideas.

  We're a serious business and have enormous responsibilities
  to our clients and shareholders. However, our tech teams are
  friendlier and more informal than you might expect.

  The base

  We moved into our new HQ in the City of London in 2018.
  We’re close to our clients, in the heart of the UK’s
  financial centre. And we have everything we need to work
  flexibly.

  The team

  You will work in an Agile development team within Schroders
  Digital Department, part of the Global Technology function.
  You will be gathering, understanding and providing
  technology solutions across the wider Schroders business in
  an iterative and fast moving environment.

  The technology stack is based on Next.js, Node.js,
  TypeScript, Azure, GraphQL, Terraform, Contentstack and
  Algolia.

  The Global Technology vision is to ensure a stable operating
  environment that can leverage Agile to effectively deliver
  enhanced business benefits focused on value delivered to our
  external and internal customers. With a culture of
  excellence through collaboration, innovation and continuous
  improvement, Global Technology will enable Schroders to
  deliver the best outcomes for our clients.

  The knowledge, experience and qualifications you need

  - Excellent software design principles and patterns, designing
    code for readability and re-usability, scalability, and
    maintainability.
  - Excellent experience of state of the art test automation
    approaches including TDD and other Shift Left approaches
    to ensure highest quality engineering practices.
  - Experience in engineering practices that enable high-quality
    rapid delivery such as trunk based development, pairing,
    test automation and the concepts of DevSecOps.
  - Experience developing web applications using front-end
    technologies including React, TypeScript, Next.js, HTML5,
    CSS3 and responsive design, including component libraries
    and design systems.
  - Experience developing backend services and APIs using
    Node.js (Express) and serverless technologies such as
    Azure Functions.[TM3]
  - Ability to translate business requirements to high-quality
    working software.
  - Familiarity with AI-assisted development tools (desirable).
  - Demonstrable background in stakeholder and relationship-
    management to successfully manage a diverse network of
    relationships, both internal and external.
  - Strong understanding and experience applying Agile
    principles.
  - Good DevOps experience including continuous integration and
    automated deployment. Knowledge of Git and Github Actions
    essential.
  - Experience using cloud platform, ideally Azure.[TM4]
  - Experience working with Terraform.
  - Experience working with global colleagues and stakeholders
    across different time zones, understanding cultural
    differences.
  - Excellent command of the English language, both written and
    spoken.

  What you'll be like

  - Having a passion for keeping up to date with the latest
    industry trends in web technologies, demonstrating thought
    leadership and coaching to other team members.
  - Value clean code and the continuous learning culture.
  - Passionate about what you do, detail-orientated, always
    striving for excellence and proactively seeking for areas
    to improve.
  - Able to prioritize work and limit work in progress in order
    to achieve optimal flow.
  - Friendly, approachable, collaborative and enjoy working with
    people across teams and functions[TM5] .
  - Have a continuous improvement mind-set, challenging status
    quo and seeks self-improvement.

  We Recognise Potential, Whoever You Are

  Our purpose is to deliver excellent investment performance
  to clients through active management. We believe diverse
  perspectives and an inclusive culture help us make better
  decisions and achieve better outcomes for our clients.
  That's why inclusion is a strategic priority for us, and we
  are an equal opportunities employer. You are welcome here,
  regardless of your age, disability, gender identity,
  religious beliefs, sexual orientation, socio-economic
  background, or any other protected characteristic.

  We will consider flexible working arrangements for all roles
  and provide reasonable accommodations to support applicants
  and employees, including those with neurodiversity,
  disability, or physical and mental health needs. For more
  information, please visit our FAQs.

  About Us

   We're a global investment manager. We help institutions,
  intermediaries and individuals around the world invest money
  to meet their goals, fulfil their ambitions, and prepare for
  the future.



   We have around 6,000 people on six continents. And we've
  been around for over 200 years, but keep adapting as society
  and technology changes. What doesn't change is our
  commitment to helping our clients, and society, prosper.
