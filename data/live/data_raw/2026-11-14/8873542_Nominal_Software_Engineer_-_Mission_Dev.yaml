description: |
  About Nominal

  Engineers today are building some of the most ambitious
  machines humanity has ever seen. They should have AI that’s
  purpose-built for them.

  Nominal is building the Hardware Intelligence Platform that
  gives engineers increased visibility into complex physical
  systems, helps them make better decisions, and ultimately
  gets their products into the real world faster. It brings
  together the systems, data, intelligence, and applications
  hardware engineering requires to meet the AI moment.
  Hardware engineering teams use Nominal to simulate, test,
  manufacture, and operate the physical systems that keep the
  world moving, from spacecraft and autonomous vehicles to
  next-generation energy systems and robotics.

  Our customers span aerospace, defense, manufacturing,
  transportation, energy, and robotics. They include Anduril,
  Shield AI, Wisk Aero, Pratt Miller Motorsports, Antares, and
  Shinkei Systems, amongst others, alongside programs within
  the U.S. Air Force and Navy. Our team draws from SpaceX,
  Palantir, Anduril, Applied Intuition, Tesla, and other
  leading companies, united by a common mission: giving
  hardware engineers the tools to build the future with speed,
  safety, and confidence. We're a fast-moving team that owns
  problems end-to-end, works across disciplines, and thrives
  at the intersection of hardware and software.

  Some of the world’s leading technology investors, including
  Sequoia, Lightspeed, Founders Fund, General Catalyst, Lux
  Capital, and Insight Partners, are backing Nominal’s
  ambition to change how machines are built and operated.
  We’re looking for engineers who want to take on hard
  problems and help make a new generation of world-changing
  hardware possible.

  The Mission Dev Team

  The Mission Dev team operates at the intersection of
  cutting-edge software engineering and critical customer
  missions. As a Software Engineer on Mission Dev, you won’t
  just support customers — you’ll embed with them to solve
  their hardest data challenges head-on.

  Think like a startup cofounder or an early-stage CTO: you’ll
  dive into ambiguous problem spaces, own solutions end-to-
  end, and iterate rapidly to deliver impactful results. This
  role demands grit, strong engineering foundations,
  creativity, and the ability to thrive in dynamic
  environments where you’ll be responsible for everything from
  understanding core user needs to writing code for data
  integrations and custom applications.

  You’ll be a pivotal force within Nominal’s Mission
  organisation, directly applying your technical expertise to
  ensure our customers succeed with the platform and achieve
  their mission objectives. If you’re a builder who loves
  solving complex problems, seeing your code directly shape
  mission outcomes, and forging paths in new territory, this
  is where you’ll excel.

  🫡 About the role

  - Build and deploy custom applications, scripts, and
    extensions to meet specific customer requirements and
    unlock new capabilities — with a bias towards action and
    rapid prototyping.
  - Design and implement resilient data pipelines and
    integration workflows to connect diverse customer systems
    with Nominal’s offerings, often in complex or novel
    environments.
  - Work closely with our Sales and Mission Ops teams to ensure
    seamless customer handoffs, provide deep technical
    expertise during pre-sales conversations, and scope
    customer engagements effectively.
  - Gather customer feedback and insights from the field to
    inform product development, influence Nominal’s roadmap,
    and improve our offerings.
  - Contribute to team growth by sourcing, interviewing, and
    onboarding new engineers.

  🎯 What we’re looking for

  - Experience designing, building, and shipping software in
    fast-changing or ambiguous environments.
  - Excellent problem-solving and analytical skills with a
    proactive, “get things done” mindset.
  - A customer-centric approach and genuine passion for solving
    real-world problems with technology.
  - Excitement to be an early, foundational member of the team
    building software tools for exceptional hardware
    engineering teams.
  - Ability and willingness to travel up to 25–50% to spend time
    with end users on-site (e.g., rocket test stands,
    spacecraft clean rooms, automated manufacturing
    facilities).

  ⚡ Skills that supercharge us

  - Solution-oriented: Experience collaborating directly with
    customers to solve complex, technical challenges.
  - Adaptability: Previous experience in startup or
    entrepreneurial environments where agility, problem-
    solving, and ownership are key.
  - [Bonus] Security clearance: Active or eligible to obtain UK
    SC/DV clearance (or equivalent).

  ✨ Benefits/Perks

  - 🏖️ Unlimited PTO and sick leave
  - 🍽️ Free lunch, snacks, and coffee
  - 🚀 Professional Development Stipend
  - ✈️ Annual company retreat
  - 🛠️ Hardware sensor stipend
  - 📈 Employee-friendly equity terms
  - 🏢 In-office 5 days per week

  All qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, or national origin.
