description: |
  Overview

  At ITA International, we’re a tech-enabled professional
  services company. Headquartered in Newport News, Virginia,
  we leverage subject matter expertise, data analytics and
  technology to challenge boundaries and transform
  possibilities.

  With a global presence and a passionate team of over 200
  ITAers, we’re driven by mission success for our customers,
  “In The Arena.” Our expertise spans Operations, Training,
  Engineering, Nanotechnology, Statistics, Machine Learning
  and Software Engineering – enabling data and tech-enabled
  solutions that deliver real value.

  Join our impactful journey at ITA International. As Theodore
  Roosevelt said, “The credit belongs to the man who is
  actually in the arena.” We’re here, standing beside our
  customers, ready to serve and succeed.

  ITA is seeking a Mid-Level Software Developer to join the
  team.

  This position is contingent upon successful contract award,
  expected by early 2027.

  Responsibilities

  The Mid-Level Software Developer supports the design,
  development, integration, and implementation of data-driven
  applications, automated workflows, AI-enabled capabilities,
  and decision-support tools. Working with multidisciplinary
  teams, this individual develops and maintains software
  solutions that integrate enterprise data and analytical
  capabilities, support rapid prototyping, and improve
  decision-making for government and commercial customers.

  Responsibilities:

  - Design, develop, test, deploy, and maintain software
    applications, database solutions, and digital tools
    supporting data-driven decision-making and business
    operations.

  - Collaborate with senior developers, project managers, and
    other stakeholders to design, develop, test, and deploy
    software solutions

  - Build and enhance data pipelines, transformations, and
    automated processes to consolidate data from disparate
    sources into reliable, usable formats.

  - Support integration of data from enterprise systems,
    databases, and application programming interfaces (APIs),
    including Microsoft 365, Microsoft Azure, and SharePoint
    where applicable.

  - Assist in data validation, cleansing, and transformation
    activities to ensure data quality and reliability.

  - Modify and enhance existing software and/or database
    products.

  - Write and perform unit tests and peer reviews of technical
    products.

  - Troubleshoot, correct, and test code defects.

  - Develop and enhance software modules and features based on
    established requirements.

  - Implement best practices for software coding and design.

  - Collaborate with team members during code reviews and
    contribute feedback.

  - Support rapid prototyping, demonstrations, and iterative
    testing of software capabilities.

  - Integrate existing analytical or AI-enabled services into
    software applications under the guidance of senior
    technical staff.

  - Produce technical documentation for software components and
    design decisions.

  - Participate in application testing, troubleshooting, and
    issue resolution.

  - Support deployment activities and assist with user
    acceptance testing (UAT).

  - Work closely with project teams, customers, and stakeholders
    to ensure solutions meet business requirements.

  - Participate in Agile ceremonies, project meetings, and
    design reviews.

  - Provide responsive customer support for deployed
    applications and workflows

  - Demonstrate intellectual curiosity, initiative, and a
    results-oriented mindset, with the ability to rapidly
    develop new knowledge, adapt to unfamiliar subject matter,
    and independently identify and pursue opportunities to
    deliver meaningful results.

  Qualifications

  Minimum Qualifications:

  - Bachelor's degree in Computer Science, Information Systems,
    Software Engineering, Data Analytics, Engineering, or a
    related field, or equivalent professional experience.

  - 3–10 years of experience in in software or application
    development.

  - Familiarity with Power BI, Dataverse, SQL, or SharePoint
    Online.

  - Experience with at least one programming language, such as
    Python, C#, JavaScript, or Java

  - Familiarity with databases, SQL, APIs, or data integration.

  - Basic understanding of software design, testing, and
    workflow automation concepts.

  - Strong analytical, problem-solving, and organizational
    skills.

  - Ability to communicate effectively with both technical and
    non-technical stakeholders.

  - Ability to obtain and maintain a U.S. Government security
    clearance if required by the assigned program.

  Desired Qualifications:

  - Understanding of Agile development methodologies.

  - Experienced in applying DevSecOps principles throughout the
    software development lifecycle, including automated code
    analysis, security scanning, continuous integration,
    continuous delivery (CI/CD), and configuration management

  - Experience supporting government software development,
    prototyping, or research and development programs.

  - Familiarity with cloud development, version control, or
    automated testing.

  - Microsoft Power Platform Fundamentals (PL-900) certification
    or willingness to obtain within the first year of
    employment.
  - Active U.S. secret security clearance.

  Benefit and Compensation Transparency

  ITA International proudly complies with all federal and
  state benefit and pay transparency laws. Employees of ITA
  can expect a robust benefit package, including:

  - Medical, dental and vision plans
  - Life Insurance
  - Short Term Disability insurance (where applicable)
  - Voluntary ancillary benefit options
  - 401k retirement benefits with employer matching
    contributions

  Pay range for this position is $90,000 - $128,000 annually

  This position has a broad compensation range due to the
  complexities of government contracting, including contract
  pricing, labor category requirements, funding parameters,
  and varying levels of candidate experience and
  qualifications.

  Application and Employment at ITA International

  ITA International is an Equal Opportunity Employer and all
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  national origin, disability status, protected veteran
  status, or any other characteristic protected by law.

  In compliance with the ADA Amendments Act (ADAAA), ITA
  International would like to ensure that your application
  process goes as smoothly as possible. If you would like to
  preview the physical requirements for this position, or if
  you have a disability and would like to request an
  accommodation in order to apply for a currently open
  position with ITA, please contact us by phone at
  757-246-6781 or email us at HR@ita-intl.com.
