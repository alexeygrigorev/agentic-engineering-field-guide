description: |
  About us

  At Trainline, our purpose is to empower greener travel
  choices, connecting people and places. Trainline enables
  millions of travellers to find and book the best value
  tickets across carriers, fares, and journey options through
  our highly rated mobile app, website, and B2B partner
  channels.

  Great journeys start with Trainline 🚄

  We’re Europe’s leading independent rail platform, helping
  millions of travellers find and book the best-value rail and
  coach journeys across our app, website and partner channels.

  Our job is to make the green travel choice the best choice.
  By building a better train travel experience, we help more
  people choose rail - creating a positive impact for
  customers, our business and the planet.

  We’re a team of more than 1,000 Trainliners from over 50
  nationalities, working across London, Paris, Barcelona,
  Milan, Edinburgh and Madrid. Now is a brilliant time to join
  us and help shape the future of travel.

  Introducing the Trainline Customer Growth Team 👋

  We're looking for a Senior Engineering Manager to lead
  engineering within our Customer Growth pillar, on the Value
  and Growth side of the business. You'll oversee an
  organisation comprising Engineering Managers and multiple
  fullstack squads, spanning web, backend and mobile, our
  current focus is across railcards growth, railcards
  retention and adoption, subscriptions, and customer value
  exchange, which shapes how we structure and present our
  offering to customers.

  You'll partner closely with Product, Design, Data and
  Commercial to align technical delivery with business
  outcomes and play a key role in how Trainline communicates
  value and pricing to customers. We're looking for a leader
  who can bring together several distinct but connected
  domains, empower their teams, and balance commercial impact
  with customer-first thinking.

  In this role as the Senior Engineering Manager, you will...
  🚄

  - Lead multiple squads and their Engineering Managers,
    supporting career development through coaching and
    performance conversations
  - Own end-to-end delivery across your squads, helping ensure
    projects are planned, executed and delivered to a high
    standard and on time
  - Partner closely with Product, Design, Data and Commercial to
    align technical delivery with business outcomes, using
    domain expertise to guide teams toward high-impact
    opportunities
  - Guide technical direction and architecture across fullstack
    web, backend and mobile squads, without needing to be
    deeply hands-on with code
  - Bring coherence across distinct areas, railcards growth and
    retention, subscriptions and customer value exchange,
    ensuring technical strategy connects them where it matters
  - Champion engineering best practices across teams, promoting
    quality and a culture of technical innovation
  - Drive operational excellence, ensuring teams have robust
    monitoring, alerting and incident management processes in
    place

  We'd love to hear from you if you have... 🔍

  - Experience leading engineering teams and delivering complex,
    multi-team initiatives
  - A strong track record of developing people, building high-
    performing teams and growing future leaders
  - The ability to inspire trust and autonomy at all levels,
    fostering a positive, inclusive and high-performing team
    culture
  - Comfort operating across multiple, distinct product domains
    and connecting them into a coherent technical strategy
  - Enjoyment working in a dynamic, collaborative and highly
    cross-functional environment
  - Strong written and verbal communication skills, with the
    ability to influence at all levels of the organisation
  - Confidence leading through ambiguity, creating clarity and
    momentum in complex or uncertain situations

  More information:

  Enjoy fantastic perks like private healthcare & dental
  insurance, a generous work from abroad policy, 2-for-1 share
  purchase plans, an EV Scheme to further reduce carbon
  emissions, extra festive time off, and excellent family-
  friendly benefits.

  We prioritise career growth with clear career paths,
  transparent pay bands, personal learning budgets, and
  regular learning days. Jump on board and supercharge your
  career from day one!

  We're operating a hybrid model and ask that Trainliners work
  from the office a minimum of 60% of their time over a
  12-week period. We also have a 28-day Work from Abroad
  policy.

  Our values represent the things that matter most to us and
  what we live and breathe everyday, in everything we do:

  - 💭 Think Big - We're building the future of rail
  - ✔️ Own It - We focus on every customer, partner and journey
  - 🤝  Travel Together - We're one team
  - ♻️ Do Good - We make a positive impact

  We know that having a diverse team makes us better and helps
  us succeed. And we mean all forms of diversity - gender,
  ethnicity, sexuality, disability, nationality and diversity
  of thought. That's why we're committed to creating inclusive
  places to work, where everyone belongs and differences are
  valued and celebrated.

  Interested in finding out more about what it's like to work
  at Trainline? Why not check us out on LinkedIn, Instagram
  and Glassdoor!
