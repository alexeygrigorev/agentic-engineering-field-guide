description: |
  Social Discovery Group (SDG) is a group of social discovery
  companies. SDG solves the problems of loneliness, isolation,
  and disconnection - transforming virtual intimacy into the
  new normal. SDG’s products redefine the way people interact
  and connect with one another.

  Our portfolio includes social entertainment platforms
  designed to connect people online across different cultures
  and regions of the world.

  We bring together a team of like-minded people and IT
  professionals who specialize in creating and developing
  globally impactful social discovery products. Our
  international team of digital nomads works remotely from all
  over the world.

  We’re proud to be a two-time “Great Place to Work” winner
  (USA & Japan, 2024–2025) and a Top-5 Company for Work-From-
  Anywhere Jobs (FlexJobs, 2025).

  We are looking for a Team Lead Software Engineer (.NET).

  Your main tasks will be:

  - Own delivery of the monolith-to-microservices modernization
    end-to-end — from legacy analysis through production
    release — with full visibility into pipeline status and
    risk.
  - Partner with Product and Architecture to review specs, map
    legacy dependencies, and turn that into estimates the team
    can actually hit.
  - Guide architectural decisions across .NET Core services,
    databases (SQL/NoSQL), and frontend integrations, and be
    the go-to for the hardest backend, data migration, and
    production incident calls.
  - Sharpen how the team works day-to-day — tighter task
    tracking in Jira, more accurate estimation, and a QA
    partnership that keeps bugs resolved fast and production
    stable.
  - Run regular 1-on-1s tied to real career goals, and drive the
    feedback and process changes that keep the team improving
    and engaged.

  We expect from you:

  - Solid .NET engineering background with deep expertise in C#,
    .NET 8, and ASP.NET Core.
  - Deep understanding of web application architecture, REST
    APIs, the microservices pattern, message brokers
    (RabbitMQ), and database design (PostgreSQL, MS SQL
    Server, Redis).
  - Practical experience with legacy system modernization,
    monorepo-to-microservices refactoring, and
    containerization (Docker, Kubernetes).
  - Ability to act as the technical escalation point for complex
    implementation, data migration, or performance issues.
  - Proven experience managing engineering teams — running
    1-on-1s, performance reviews, and objective evaluations.
  - Strong track record in delivery management: task tracking in
    Jira, process discipline, and hitting internal deadlines
    with predictable releases.
  - Experience reviewing business specs, assessing technical
    feasibility, and providing high-level estimates —
    partnering closely with PM and product to keep engineering
    output aligned with product goals.

  What do we offer:

  - REMOTE OPPORTUNITY to work full-time;
  - The initial pay level or pay range for this role will be
    shared with candidates during the recruitment process and
    before the commencement of employment;
  - Vacation 28 calendar days per year;
  - 7 wellness days per year (time off) that can be used to deal
    with household issues, to lie down and recover without
    taking sick leave;
  - Bonuses up to $5000 for recommending successful applicants
    for positions in the company;
  - 50% payment for professional training, international
    conferences, and meetings;
  - Corporate discount for English lessons;
  - Health benefits. According to the paychecks, if you are not
    eligible for corporate medical insurance, the company will
    compensate you with up to $ 1,000 gross per year per
    employee. This can be spent on self-purchase of health
    insurance or on doctor’s fees for yourself and close
    relatives (spouse, children);
  - Workplace organization. The company provides all employees
    with an equipped workplace and all the necessary equipment
    (table, armchair, wifi, etc.) in our offices or co-working
    locations. In the other locations, the company provides
    reimbursement of workplace costs up to $ 1000 gross once
    every 3 years, according to the paychecks. This money can
    be spent on the rent of the co-working room, on equipping
    the working place at home (desk, chair, Internet, etc.)
    during those 3 years;
  - Internal gamified gratitude system: receive bonuses from
    colleagues and exchange them for our merchandise, team
    building activities, massage certificates, etc.

  Sounds good? Join us now! The initial pay level or pay range
  for this role will be shared with candidates during the
  recruitment process and before the commencement of
  employment.
