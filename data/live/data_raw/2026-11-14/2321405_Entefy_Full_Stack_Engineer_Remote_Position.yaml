  - 4+ years of relevant backend and web experience
  - Deep knowledge in Node.js and SQL
  - Strong working knowledge of front-end JavaScript and modern
    libraries, ideally React.js and Next.js
  - Proven track record in architecting and building scalable
    systems
  - ETP (Exceptional Technical Prowess)
  - Courage to innovate and fail
  - Strong collaboration and communication skills
  - Experience with large distributed data systems
  - Ability to build highly performant APIs to power data
    visualizations
  - Experience dealing with scalability requirements and
    performance improvements
  - Know-how dealing with building and maintaining complex
    event-driven systems is a plus (i.e. Kafka)
  - Prior experience with Continuous Integration and test-driven
    development is a plus
  - Startup experience is a plus

  Visit www.entefy.com and www.entefy.com/blog
