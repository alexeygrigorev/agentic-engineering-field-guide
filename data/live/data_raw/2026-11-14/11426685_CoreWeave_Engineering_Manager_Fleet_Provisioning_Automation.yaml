description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do:

  CoreWeave’s Fleet Provisioning Automation (FPA) team is
  responsible for the automated provisioning and lifecycle
  management of CoreWeave’s rapidly growing fleet of hardware
  nodes and node types. The team streamlines and coordinates
  node bring-up and configuration, node delivery, health
  monitoring, and failure-response automation into a cohesive,
  high-reliability engine of fleet management. This group sits
  at the intersection of hardware, data center operations, and
  platform engineering, building the software that keeps our
  global fleet healthy and ready for customer workloads.

  About the Role:

  We are seeking an Engineering Manager for the Fleet
  Provisioning Automation team who can manage and grow our
  team of developers. This individual will facilitate
  development by supporting the team in process,
  communication, and accountability across the team’s domain,
  and champion reliability and results.

  In this role, you will:

  - Lead and grow a team of talented and dedicated Go developers
    in the US and EU.
  - Provide prioritization, direction, and support to software
    engineers developing Kubernetes operators and custom
    resource definitions (CRDs) to automate node provisioning
    and lifecycle management of CoreWeave’s entire server
    fleet.
  - Collaborate closely with fleet operations, hardware
    engineering, and Kubernetes infrastructure teams to design
    solutions to problems of scale for managed Kubernetes and
    bare metal deployments and the operation of CoreWeave’s
    global hardware fleet.
  - Develop a program of onboarding, documentation, enablement,
    and performance management to help your team members
    achieve new heights of personal growth and capability.
  - Set the culture and tone for how your team works together —
    both in how they communicate with and support each other,
    and in how they enable the rest of CoreWeave.

  Who You Are:

  - 7+ years of experience in software or infrastructure
    engineering, including 3+ years in a leadership capacity.
  - Experience guiding teams to create test plans, deployment
    automation, and supporting tooling that enable safe
    rollouts and continuous improvement of fleet provisioning
    services.
  - A background that includes the knowledge and practice of SRE
    fundamentals, incident management, blameless culture,
    observability, and change management.

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You believe in the value of automation and will champion
    practices that drive reliability, reduce the need for
    manual operations, and drive the adoption of cross-team
    processes and tooling.
  - You love helping people on their journeys to become their
    best selves and are comfortable extending your influence
    to partners, peers, and senior leadership.
  - You’re comfortable building and leading a global team of
    high-performing, diverse engineers.

  The base salary range for this role is $165,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

