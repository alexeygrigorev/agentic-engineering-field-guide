  Required Qualifications, Capabilities, and Skills:



  - Formal training or certification in software engineering
    concepts
  - Advanced hands-on experience with Java and Spring Boot in a
    microservices architecture
  - Practical experience with AWS cloud-native patterns: Lambda,
    Step Functions, Terraform-managed infrastructure, and
    relational databases at scale
  - Working knowledge of event-driven systems, including Kafka
    producers/consumers and consumer groups
  - Demonstrated experience leading effective use of approved
    AI-assisted development tools, with strong validation
    skills for AI output
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity and secure handling
  - Proficient across the full SDLC, with advanced understanding
    of agile delivery, CI/CD, application resiliency, and
    security practices
  - In-depth knowledge of financial services IT systems, ideally
    wealth/advisory data



  Preferred Qualifications, Capabilities, and Skills:



  - Experience with Snowflake or other enterprise data
    mesh/warehouse platforms
  - Python for data and Lambda workloads alongside a primarily
    Java stack
  - Exposure to React/TypeScript for full-stack context on
    services with UI consumers
  - Experience diagnosing production data-consistency issues
    across multiple source-of-truth systems



