description: |
  Introductory Marketing Language: Are you ready to make a
  difference in Wealth Management technology? At Connect
  Wealth’s Portfolio Insights Construction team, you’ll help
  build platforms that empower advisors and clients. You’ll
  work with cutting-edge tools, collaborate with talented
  colleagues, and drive meaningful change across the firm’s
  advisory business. We value creativity, inclusivity, and
  your unique perspective. Discover a place where your skills
  and ideas can thrive.

  Job Summary: As a Lead Software Engineer in Connect Wealth’s
  Portfolio Insights Construction team, you will play a
  pivotal role in developing and maintaining platforms that
  serve position and account data for Wealth Management
  advisors. You will collaborate with cross-functional teams
  to deliver real-time alerting, portfolio analytics, and
  client-facing dashboards. You’ll help shape the team
  culture, drive technical excellence, and ensure the
  platform’s reliability and impact. Your contributions will
  directly influence how advisors and clients experience our
  services.

  Job Responsibilities:

  - Execute creative software solutions across ingestion,
    resolution, and serving layers of the platform
  - Design, develop, and troubleshoot technical challenges,
    breaking down complex data-reconciliation problems
  - Develop secure, high-quality production code in Java/Spring
    Boot and Python/Java Lambdas
  - Review and debug code, including cross-service and cross-
    repo changes
  - Drive adoption of enterprise-authorized AI-assisted
    engineering practices and establish validation standards
    for AI-generated code
  - Apply SDLC toolchain and AI-assisted development
    capabilities to improve delivery velocity
  - Identify and automate remediation of recurring operational
    issues to enhance platform stability
  - Lead evaluation of architectural approaches for data-
    platform challenges and drive technical discussions with
    internal teams





