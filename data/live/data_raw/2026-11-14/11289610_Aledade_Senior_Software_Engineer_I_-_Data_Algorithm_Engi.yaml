description: |
  As a Senior Software Engineer I at Aledade, we maintain,
  improve, and expand our data models and Databricks
  pipelines. We're looking for engineers who know that writing
  new code is not always the solution to a problem, but when
  technological changes are needed they create secure,
  maintainable, performant, correct, scalable, and stable
  solutions to the complex and unique challenges in our corner
  of the healthcare industry.

  The Patient Domain Team is responsible for turning complex
  health care data into well-defined insights about our
  patients that describes who they are and how they interact
  with the health care system. We are responsible for telling
  our partner practices more about who their patients are and
  how to ensure they receive the care they need. We are also
  responsible for figuring out how to monitor and observe our
  models in action to ensure they are driving impact across
  the company.

