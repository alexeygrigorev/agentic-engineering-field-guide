description: |
  About Artian

  Artian AI is building agentic AI automation for financial
  services. Our platform enables reliable, autonomous AI
  agents to execute business-critical workflows across
  regulated enterprise environments.

  We are an in-person team in New York, building at the
  intersection of AI, enterprise software, workflow
  automation, and financial services. We move with urgency,
  take ownership, communicate transparently, and care deeply
  about doing excellent work. We are looking for people who
  are grounded under pressure, learn quickly, earn trust with
  teammates and customers, and want to help define how AI
  agents are deployed safely and effectively in the
  enterprise.

  About the Role

  Artian AI is looking for a Software Engineer - Solutions to
  help turn customer workflows into production AI automation.
  You will work directly with enterprise customers, product
  teams, and engineering teams to understand operational
  problems, design technical solutions, build prototypes, and
  support successful deployments.

  This role is ideal for an engineer who enjoys writing code,
  working with customers, solving ambiguous business problems,
  and operating at the intersection of product, engineering,
  and go-to-market.

  What You’ll Do

  - Work with enterprise customers to understand workflows, data
    environments, integration needs, and success criteria.
  - Build prototypes, demos, internal tools, integrations, and
    implementation accelerators.
  - Partner with product and engineering to translate customer
    requirements into scalable platform capabilities.
  - Support deployment of Artian’s agentic AI platform in
    complex enterprise environments.
  - Debug technical issues across customer workflows,
    integrations, data pipelines, and platform behavior.
  - Create documentation, implementation playbooks, and
    repeatable patterns for customer deployments.
  - Serve as a technical bridge between customers, sales,
    product, and engineering.

  What We’re Looking For

  - Strong software engineering skills, especially in Python.
  - Experience building integrations, APIs, scripts, backend
    services, demos, or customer-facing technical solutions.
  - Ability to understand customer workflows and translate
    business requirements into technical designs.
  - Strong communication skills and comfort working directly
    with technical and non-technical stakeholders.
  - Ability to operate in ambiguity, move quickly, and maintain
    high standards.
  - Interest in AI, automation, financial services, and
    enterprise software.

  Nice to Have

  - BS in Computer Science, Engineering or a closely related
    engineering discipline, or equivalent industry experience.
  - Experience in solutions engineering, sales engineering,
    implementation engineering, technical consulting, or
    customer-facing engineering.
  - Experience with enterprise SaaS deployments, data
    integrations, workflow automation, or AI/ML products.
  - Experience in financial services, insurance, banking, risk,
    operations, or compliance workflows.
  - Experience building LLM-powered prototypes, agent workflows,
    or automation demos.

  Why Join Artian

  - Work directly with customers on high-value enterprise AI
    deployments.
  - Build technical solutions that influence product direction
    and accelerate revenue.
  - Operate across engineering, product, and go-to-market in a
    high-ownership environment.
  - Help define what successful agentic AI deployment looks like
    in financial services.
