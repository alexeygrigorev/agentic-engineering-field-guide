description: |
  “I can be myself at work.”

  You are more than a job title. We want you to feel
  comfortable doing great work and bringing your best,
  authentic self to everything you do. We value your talents,
  traditions, and uniqueness—and we’re committed to fostering
  a strong sense of belonging in a respectful workplace.

  We intentionally seek diverse perspectives, experiences, and
  backgrounds, investing in a culture designed to celebrate
  differences. We believe that belonging leads to better
  outcomes and a stronger community of associates united by
  our mission. At Capital, we live our core values every day:
  Integrity, Client Focus, Diverse Perspectives, Long-Term
  Thinking, and Community.



  “I can influence my income.”



  You want to feel recognized at work. Your performance will
  be reviewed annually, and your compensation will be designed
  to motivate and reward the value that you provide. You’ll
  receive a competitive salary, bonuses and benefits. Your
  company-funded retirement contribution will factor in salary
  and variable pay, including bonuses.



  “I can lead a full life.”



  You bring unique goals and interests to your job and your
  life. Whether you’re raising a family, you’re passionate
  about where you volunteer, or you want to explore different
  career paths, we’ll give you the resources that can set you
  up for success.

  - Enjoy generous time-away and health benefits from day one,
    with the opportunity for flexible work options
  - Receive 2-for-1 matching gifts for your charitable
    contributions and the opportunity to secure annual grants
    for the organizations you love
  - Access on-demand professional development resources that
    allow you to hone existing skills and learn new ones

  As a Software Engineer within the Investment Group
  Technologies organization, you will build systems, services
  and tools that improve the lives of tens of millions of
  people every single day. The Investment Group Technologies
  organization applies software and data engineering, as well
  as data science to long-term fundamental investing at > $2
  trillion scale. In the Software Engineer role, you will work
  with experienced software engineers while making technical
  decisions around how best to serve our customers. If you are
  looking to join a team that offers autonomy, plenty of space
  to run with new ideas, working in a nurturing environment,
  and challenging problems to solve at a significant scale,
  this might be the job for you!

  Capital Group’s mission since 1931 has been to improve our
  customers’ lives through successful long-term investing.
  Looking to the future, we are in a unique position to make
  an even bigger difference to these investors, harnessing our
  distinctive investment research process, built on 8 decades
  of proprietary data and research insights, and coupled with
  our data-grounded and customer-focused approach to building
  software. The ideal candidate for this role will be
  passionate about our mission, driving for superior long-term
  investment results through the application of modern
  engineering and analytical methods.

  What you’ll be doing:

  ● Writing Code (TypeScript, Python, Java, etc) in support of
  Investment Portfolio Management and Construction

  ● Utilizing AWS technologies such as Lambda, API Gateway,
  DynamoDB, S3, Glue, Redshift, EMR, Sagemaker, EKS/ECS.

  ● Working in a team with experienced software engineers to
  identify great projects and features that will help you grow
  in your career.

  ● Building relationships with your customers, partner teams
  and the engineers on your team.

  ● Measuring the quality of your software and systems via
  instrumentation, observability, and customer usage patterns.

  ● Influence your team’s technical decisions by making
  insightful contributions to team priorities and approach.

  ● Leverage AI in your daily work and delivery AI enabled
  insights and analytics to customers.

  ● Help in identifying and solving ambiguous problems, or
  areas where your team’s software bottlenecks the innovation
  of other teams.

  Your background and who you are:

  ● You have a background in software engineering and a
  passion to learn.

  ● You've made mistakes in the past and have learned a lot
  from them. You apply this learning regularly.

  ● You are well versed in software engineering fundamentals
  and love to apply that craft towards data-centric
  applications.

  ● You believe there are generally multiple ways to solve a
  technical problem, each with different trade-offs.

  ● You approach projects, tasks, and unknowns with curiosity,
  and enjoy sharing what you know and learn with the people
  around you.

  ● You believe that a team is strongest when it is diverse
  and includes multiple perspectives.

  ● You are able to put yourself into your customer's shoes.
  You frequently immerse yourself in the customer experience
  to understand how you can better serve them.

  Qualifications:

  ● BS in Computer Science or related field, or an equivalent
  in relevant work experience.

  ● Experience in software development, including experience
  with at least one modern language such as Python, Java, C++,
  or C# including object-oriented design with an understanding
  of advanced design patterns.

  ● Experience in cloud-first design, preferably AWS
  (Serverless infrastructure, dynamic autoscaling, container
  orchestration, etc.).

  ● Experience in data architecture, databases (e.g.,
  PostgreSQL, MySQL, Oracle), SQL and DDD/ER/ORM design.

  ● Interest and curiosity in emerging technologies on the web
  like GraphQL, web assembly, Lambda functions, MLaaS etc.

  ● Knowledge of software engineering practices & best
  practices for the software development life cycle, including
  coding standards, code reviews, source control management,
  build processes, testing, and operations.

  “I can apply in less than 4 minutes.”



  You’ve reviewed this job posting and you’re ready to start
  the candidate journey with us. Apply now to move to the next
  step in our recruiting process. If this role isn’t what
  you’re looking for, check out our other opportunities and
  join our talent community.



  “I can learn more about Capital Group.”



  At Capital Group, the success of the people who invest with
  us depends on the people in whom we invest. That’s why we
  offer a culture, compensation and opportunities that empower
  our associates to build successful and prosperous careers.
  Through nine decades, our goal has been to improve people’s
  lives through successful investing. We know that our history
  is a testament to the strength of the people we hire. More
  than 9,000 associates in 30+ offices around the world help
  our clients and each other grow and thrive every day. Find
  us on LinkedIn, Instagram, YouTube and Glassdoor.‎

