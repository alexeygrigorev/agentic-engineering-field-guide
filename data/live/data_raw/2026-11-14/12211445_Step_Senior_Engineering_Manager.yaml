description: |
  About Step

  Step's mission is to improve the financial future of the
  next generation. Millions of people use our banking and
  borrowing products to manage, build, and grow their money.
  Now that we're part of Beast Industries – the company behind
  MrBeast – we're poised for a new phase of growth to deliver
  financial literacy and tools at massive scale.

  The Role

  Step is looking for an experienced Senior Engineering
  Manager to lead and grow a high-performing engineering team
  building products used by millions of customers.

  As a Senior Engineering Manager, you'll combine strong
  technical judgment with people leadership to help Step move
  quickly without compromising quality. You'll work closely
  with Product, Design, Data, Risk, Operations, and other
  engineering leaders to turn ambitious product goals into
  reliable, scalable systems and exceptional customer
  experiences.

  You'll have broad impact across Step's mobile, web, backend,
  and machine learning platforms, while helping establish the
  technical strategy, engineering practices, and team culture
  that enable us to scale.

  What You'll Do

  - Lead and grow engineering teams: Build, mentor, and retain a
    world-class team of engineers, creating an environment
    where people can do their best work and grow their
    careers.
  - Own execution: Partner with Product and Design to translate
    company and product priorities into clear engineering
    plans, balancing speed, quality, and technical investment.
  - Set technical direction: Guide architecture and technical
    strategy across backend, mobile, web, data, and ML
    systems, making pragmatic decisions that support Step's
    growth.
  - Deliver end-to-end: Ensure teams own features throughout
    their life cycle, from technical discovery and planning
    through production, measurement, and iteration.
  - Raise the engineering bar: Establish strong practices around
    code quality, testing, observability, reliability,
    security, and operational excellence.
  - Build for scale: Help evolve Step's technology platform to
    support rapidly growing customers, products, and
    transaction volumes while maintaining a fast development
    cadence.
  - Stay technically engaged: Contribute to architecture
    discussions, design reviews, incident response, and
    complex technical decisions without becoming a bottleneck
    for the team.
  - Develop engineering leaders: Coach senior and staff-level
    engineers and help create a strong pipeline of technical
    leadership across the organization.
  - Partner cross-functionally: Work closely with Product,
    Design, Data Science, Risk/Fraud, Operations, and Growth
    to solve complex problems and deliver meaningful customer
    outcomes.
  - Move with urgency: Help the team make thoughtful decisions
    quickly, remove obstacles, and continuously improve how we
    build and ship software.
  - Champion the customer: Keep the needs of Step's customers at
    the center of technical and product decisions,
    particularly as we build financial products for the next
    generation.

  What We're Looking For

  - 8+ years of software engineering experience, with
    significant experience leading engineering teams.
  - Proven experience as an Engineering Manager, Senior
    Engineering Manager, or equivalent engineering leadership
    role.
  - Strong Computer Science and software engineering
    fundamentals.
  - Experience building and operating scalable, reliable
    production systems.
  - Demonstrated ability to lead engineers across multiple
    disciplines, such as backend, mobile, web, data, or ML.
  - Strong technical judgment and the ability to make
    architectural decisions in complex, distributed systems.
  - Track record of delivering products from inception through
    production in a fast-moving environment.
  - Experience hiring, mentoring, developing, and retaining
    high-performing engineering teams.
  - Excellent communication skills, with the ability to
    communicate effectively with both technical and non-
    technical audiences.
  - Strong product sense and an ability to connect technical
    decisions to customer and business outcomes.
  - Passion for software quality, operational excellence, and
    continuous improvement.
  - Ability to balance long-term technical strategy with the
    urgency of a rapidly evolving business.

  Nice to Have

  - Experience building consumer financial products, fintech,
    banking, lending, payments, risk, or fraud systems.
  - Experience operating highly scalable distributed systems and
    cloud infrastructure.
  - Experience with mobile-first consumer products.
  - Experience working with machine learning, data science, or
    real-time risk and fraud systems.
  - Experience in a high-growth startup or similarly fast-paced
    environment.
  - Experience leading teams through significant organizational
    or product growth.
  - Familiarity with technologies such as Kotlin, React Native,
    TypeScript, Python, gRPC, Protocol Buffers, Postgres,
    BigQuery, Kubernetes, and Terraform.

  How we're different

  We stand for the side hustlers, the creators, the
  freelancers, and the investors — people who are not afraid
  to take on challenges, especially when it comes to their
  finances. Step is focused on disrupting the banking industry
  by delivering a differentiated, mobile-first consumer
  experience, and we operate like the customers we serve:
  customer obsessed, acting as owners, moving with urgency,
  and breaking the norm.

  Step is a wholly owned subsidiary of Beast Industries, the
  media and entertainment company founded by Jimmy Donaldson
  (MrBeast), the most-watched person in the world. Beast
  Industries spans digital media, consumer products,
  philanthropy, and new ventures, with an audience reach no
  consumer company has ever had — and Step is tasked with
  turning that reach into financial literacy and tools for the
  next generation at massive scale. With Beast's distribution
  and brand behind it, Step is positioned to scale
  significantly over the next 12 months, and joining now means
  helping shape that trajectory from the inside.

  Come work with us!

  Step is a remote-first company building banking for the next
  generation. We offer competitive compensation and stock
  options, generous medical, dental, vision, and company-paid
  life insurance, a 401k plan with Safe Harbor company
  matching, a flexible vacation policy and paid company
  holidays, 12 weeks paid parental leave with flexible return
  to work, and a company-provided technology package. If
  you're looking to join a fast-growing company with a strong
  mission and vision that puts people first, we want to meet
  you!

  Step is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, age, disability, veteran status, or any
  other status protected by applicable federal, state, or
  local law.

  Step is committed to providing reasonable accommodations to
  qualified individuals with disabilities throughout the
  application and interview process. If you need an
  accommodation, please let us know at people@step.com and
  we'll work with you to provide appropriate support.
