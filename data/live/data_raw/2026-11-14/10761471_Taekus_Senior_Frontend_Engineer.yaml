description: |
  Taekus is a profitable fintech and travel startup building a
  next-generation premium banking and rewards ecosystem for
  affluent customers. With $120M+ in annual revenue and $4B+
  in annual transaction volume, we’re entering a new stage of
  growth focused on scaling our core banking systems, rewards
  infrastructure, and partner integrations.

  Join us as we tackle a $3.2T opportunity to redefine the
  super-premium financial services and rewards market—driving
  innovation beyond what’s existed since the inception of
  rewards credit cards

  Your Responsibilities

  As a Senior Frontend Engineer at Taekus, you will be
  responsible for taking designs from the design team and
  bringing them to life in React.

  We care deeply about the sleekness and usability of our web
  portal -- that’s one of the key ways we stand out against
  the bigger banks with travel rewards. After all, one of the
  reasons that traditional credit card rewards are so hard to
  maximize and use properly is a convoluted user interface.

  We want to deliver a travel rewards credit card experience
  that is intuitive and actually helpful to the user so they
  never have to worry about whether they're getting the best
  points deal.

  The role will require you to:

  - Collaborate with designers & engineers to scope out features
    and product direction
  - Participate in code and design reviews to ensure quality and
    good architecture
  - Write maintainable, clear, well-architected code, tests, and
    documentation
  - Discuss and set architecture standards and patterns for our
    frontend which will be adopted by others as we scale
  - Make direct technical contributions as well as provide
    guidance to team members

  What We're Looking For

  - 6+ years of professional software engineering experience,
    preferably at a startups or big tech company
  - Experience building production-grade software in our tech
    stack: React/Typescript/Redux
  - Experience building very aesthetic UI with high-quality UX.
  - Experience interacting with databases, directly with SQL and
    through APIs

  Nice-to-Have's

  - You have a love of travel (hacking) and credit card rewards
  - You have experience leading engineering teams and setting
    design standards and patterns in code
  - You have experience with Django, Python, Expo Go, and
    Postgres
  - You have experience writing code in a heavily regulated
    industry like financial services

  You’d Love This Job If

  - You enjoy contributing across the code base where needed.
  - You want to be in a scaling startup that is experiencing
    exponential growth.
  - You’re excited by building foundational work and enjoy
    making an impact.
  - Traveling is in your DNA and you get to apply your passion
    into your work.
  - You thrive in growing high-caliber teams and want to
    influence both technical and strategic direction.

  About Taekus

  Taekus is a 6-year-old luxury financial services company
  that offers travel rewards credit cards, debit cards, and
  other banking services for the affluent market. We currently
  process $4B+ annually in transactions and operate as a
  highly profitable company. With a lean team of 25 employees,
  we’re undergoing tremendous growth as we redefine the
  premium banking and rewards experience.





  What We Offer

  - Competitive salary and stock option plan
  - Medical, Dental, and Vision insurance
  - 401(k) plan with 5% company match
  - Flexible vacation policy
  - Fully remote work environment
