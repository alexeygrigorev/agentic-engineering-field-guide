description: |
  Fuse Energy is an energy startup on a mission to make energy
  abundant and affordable, fast. We combine first-principles
  thinking with cutting-edge technology to build a radically
  better energy system.

  We've raised over $200M from top-tier investors including
  Balderton, Lakestar, Accel, Creandum, Lowercarbon, Ribbit,
  20VC, Hummingbird and Collaborative Fund, alongside
  strategic angels including Nico Rosberg and GPs behind Meta,
  Revolut, Spotify and Uber.

  We're building a fully integrated energy company: developing
  our own solar, batteries and other generation projects,
  building our own hardware, improving and developing grid
  infrastructure, trading power in real time, using AI across
  the business, and installing distributed energy in homes. By
  selling directly to consumers we cut out the middleman,
  lower costs and pass the savings on to our customers.

  We're hiring a Senior Front-End Engineer to build the
  consumer and internal products that power a next-generation
  energy company.

  Responsibilities

  - Build and maintain responsive, performant web applications
    using React, TypeScript, Next.js, and modern front-end
    practices
  - Collaborate with backend engineers to implement APIs and
    ensure smooth data integration
  - Work closely with product and design teams to deliver
    intuitive, user-friendly experiences
  - Participate in prototyping and experimentation to test and
    validate new features
  - Dig into data, validate ideas, and help define the product
    roadmap
  - Contribute to our broader product direction and help shape
    the future of clean energy tech

  Requirements

  - Bachelor’s degree in a technical or analytical field, or
    equivalent practical experience
  - 5+ years of hands-on experience developing web applications
    with TypeScript, React, HTML, CSS, and Next.js
  - Proven experience building and shipping consumer-facing
    products
  - Strong communication skills and ability to collaborate
    effectively with cross-functional teams
  - Understanding of performance optimization techniques for
    modern web applications

  Benefits

  - Competitive salary and eligibility for equity
  - Biannual bonus scheme
  - Fully expensed tech to match your needs
  - Private health insurance
  - Breakfast and dinner allowance for office-based employees

  As we hire globally, benefits vary by location.
