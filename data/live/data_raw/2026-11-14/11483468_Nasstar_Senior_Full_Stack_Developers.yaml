description: |
  We are seeking highly skilled multiple Senior Full Stack
  Developers to join our team in a high-impact, client-facing
  capacity. You will be instrumental in architecting and
  deploying robust, scalable applications for a diverse range
  of clients across the UK and EMEA.  Initially will be
  embedded directly within the innovation team of an exciting
  enterprise client, helping them pioneer ground-breaking
  products and shape their future tech stack. This isn't just
  a coding role; you are a consultative partner—capable of
  translating complex business requirements into secure,
  serverless architectures and presenting best-practice
  improvements directly to customer stakeholders. The role is
  on a permanent basis, however we can consider applicants who
  are available on a 6 month contract basis. The role is
  remote but the successful person must be based in the United
  Kingdom.

  Key Responsibilities

  - Cloud-Native Development: Architect and build high-
    performance web applications using React, Node.js, and
    TypeScript. You will own the full lifecycle, from frontend
    UI components to backend business logic.
  - Infrastructure as Code (IaC): Lead the implementation of
    cloud environmentsusing Terraform. You will treat
    infrastructure as a first-class citizen, ensuring all
    client environments are reproducible, version-controlled,
    and secure.
  - Serverless Architecture: Design and deploy event-driven
    solutions leveraging AWS Lambda and other AWS services.
    You are expected to be adept at managing serverless state,
    permissions (IAM), and performance tuning.
  - AI-Accelerated Workflow: Proactively utilise AI-assisted
    development tools (e.g., GitHub Copilot, Cursor, Claude)
    to accelerate delivery, automate testing, and refactor
    legacy code, while maintaining strict manual oversight for
    security and quality.
  - Automation & CI/CD: Build and manage automated pipelines
    that bridge the gap between application code and
    infrastructure deployment, ensuring a seamless "push-to-
    deploy" experience.
  - Consultative Leadership: Act as a subject matter expert in
    client "pods" mentoring junior engineers and confidently
    presenting architectural roadmaps to customer
    stakeholders.

  Skills, Knowledge and Expertise

  - Proven commercial experience within a Full Stack Development
    role.
  - Highly experienced in event driven architectures.
  - Strong In-depth knowledge and hands-on experience with React
    Native, React, Node.js, Typescript and Angular.
  - Experience of engineering for Mobile to create modular,
    reusable components.
  - Strong experience of AWS Infrastructure as Code (IaC) using
    tooling such as Terraform as well as AWS Serverless e.g
    Lambda.
  - Strong experience of automation, CI/CD principles and
    experience with tools like Jenkins, Github Actions, GitLab
    CI, or AWS CodePipeline.
  - Experience of RestAPI’s as well as wider 3rd Party API’s.
  - Experience using GraphQL.
  - Strong working knowledge of containerisation technologies
    (Docker) and orchestration platforms (Kubernetes, ECS).
  - Automated Test experience.
  - Excellent communication and interpersonal skills, with a
    proven ability to engage with technical and non-technical
    stakeholders.
  - A consultative mindset with strong problem-solving and
    analytical skills and ability to communicate technical
    concepts to non-technical stakeholders.
  - Comfortable working in agile, client-facing environments
    with autonomy and ownership.
  - Able to commute when required for client or team sessions
    (occasional).

  Benefits

  - Remote-first working with flexibility around client needs.
  - Private Medical Insurance.
  - Opportunity to work on meaningful projects across multiple
    industries.
  - A collaborative culture focused on learning, excellence and
    continuous improvement.
  - Competitive salary with clear progression pathways.

  About We are passionate about helping businesses navigate
  the rapidly changing and complex world of emerging
  technologies. We create well-structured, secure, scalable
  solutions at speed to provide the foundation for
  groundbreaking change.
