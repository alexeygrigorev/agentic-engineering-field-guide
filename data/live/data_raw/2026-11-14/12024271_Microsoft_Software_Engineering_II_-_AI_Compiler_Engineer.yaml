description: |
  Overview

  The AI Frameworks team at Microsoft develops the AI software
  used to train and deploy the world’s most advanced AI
  models. We build software for Microsoft’s next-generation
  supercomputers and the Maia-200 AI accelerator, working
  closely with hardware architects, platform engineers,
  researchers, and ML developers. Our interdisciplinary team
  operates at the intersection of AI, compiler engineering,
  systems software, and high-performance computing. We have a
  collaborative and inclusive culture and participate in the
  open-source community.

  We are seeking a Software Engineer II - AI Compiler Engineer
  to join the Maia Code-gen team. You will work on the
  fundamental mechanisms for building and deploying
  application code to Microsoft AI accelerator devices. This
  includes analyzing and modifying code through the LLVM IR
  API, implementing dynamic code-generation and JIT-
  compilation features, and developing system and runtime
  components for dynamic-code deployment. This is a hands-on
  technical role for someone who enjoys solving difficult
  engineering problems, takes initiative, and wants to help
  build an end-to-end AI software stack.

  At Microsoft, our mission to empower every person and every
  organization on the planet to achieve more guides how we
  partner with customers to deliver trusted, impactful
  solutions. With a growth mindset culture, we innovate
  responsibly and measure success by shared progress people,
  teams, and customers. Join us to do meaningful work that
  changes the world and helps shape what’s next for everyone. 

  Responsibilities

  - Design and implement robust, maintainable software
    architectures and components for dynamic code generation
    and deployment.
  - Analyze and transform code using LLVM IR and develop
    advanced JIT-compilation features.
  - Build system and runtime components that support deploying
    application code to AI accelerator devices.
  - Develop software in C/C++, Python, and other languages as
    appropriate.
  - Collaborate across disciplines, from hardware architects to
    ML developers.
  - Identify requirements, scope solutions, estimate work, and
    plan deliverables.
  - Contribute to sound engineering practices and an inclusive,
    collaborative team culture.

  Qualifications Required/minimum qualifications

  - Bachelor's Degree in Computer Science or related technical
    field AND 2+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, or Python OR equivalent experience.

  Other Requirements:

  - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include but are not limited to
    the following specialized security screenings: Microsoft
    Cloud Background Check: This position will be required to
    pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred qualifications

  - Bachelor’s degree in computer engineering, computer science,
    or a related technical field, or equivalent experience.
  - 2+ years of software development experience.
  - 1+ years of experience with C/C++
  - 1+ years of experience developing software for GNU/Linux or
    another Unix-like platform.
  - 1+ years of experience with optimized systems‑level
    programming.
  - Experience building compilers or other tooling using
    compiler frameworks like LLVM.

