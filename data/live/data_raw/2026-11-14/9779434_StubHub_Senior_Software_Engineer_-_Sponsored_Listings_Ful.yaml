description: |
  StubHub is on a mission to redefine the live event
  experience on a global scale. Whether someone is looking to
  attend their first event or their hundredth, we’re here to
  delight them all the way from the moment they start looking
  for a ticket until they step through the gate. The same goes
  for our sellers. From fans selling a single ticket to the
  promoters of a worldwide stadium tour, we want StubHub to be
  the safest, most convenient way to offer a ticket to the
  millions of fans who browse our platform around the world.

  StubHub is seeking Senior Software Engineers to design and
  develop next-generation technologies and complex features
  that transform the way millions of users explore, interact
  with, and participate in live events worldwide. As a Senior
  Software Engineer, you will be an integral part of
  developing the team's commercial and product strategy. You
  will be expected to be equally focused on user needs and to
  exercise sound commercial judgment (not just technical
  judgment). Our Senior Software Engineers are essential to
  our company’s success, so they must demonstrate initiative
  and enthusiasm in solving the problems they encounter.
  StubHub is committed to being a phenomenal and inclusive
  workplace. We expect you to also serve as an advocate and
  mentor for your team members, demonstrating leadership
  qualities and setting an example for those around you.



  Location: Hybrid (3 days in office/2 days remote) – New
  York, NY



  About the Team: The Sponsored Listings team's mission is to
  enhance the discovery experience on the platform by
  advertising high quality, relevant products in context
  throughout the product. We're building StubHub's ad platform
  engine - spanning real-time bidding, auction mechanics,
  ranking and relevance models, pacing algorithms, and
  inventory-quality controls - all operating at marketplace
  scale. Join us to help drive a strategic initiative for
  StubHub and shape a greenfield platform from the ground up.

  What You'll Do:

  - Design, develop, test, deploy, and maintain impactful
    improvements that cross the frontend and backend code
    across all StubHub’s platforms and products, resulting in
    high-quality outcomes
  - Collaborate with team members to ensure best practices
    across our code
  - Manage individual initiative priorities, deadlines, and
    deliverables with your technical expertise
  - Mentor other team members and help many increase their
    technical capabilities, fostering a culture of inclusion,
    results-oriented execution, open innovation, and limitless
    creativity

  What You've Done:

  - 5-6+ years of professional experience in product-facing
    software development
  - 4+ years of in-depth experience with React and relevant
    toolsets/framework ecosystems
  - Extensive experience developing robust, mission-critical
    systems using multiple general-purpose programming
    languages (e.g., Java, C#)
  - Demonstrated expertise in building software with one or more
    of the following: Produce-facing Software Development,
    Distributed Systems
  - Previous experience designing and developing solutions to
    complex problems with significant business impact
  - A strong understanding of how their systems interact with
    the broader production environment, including dependencies
    and platform primitives
  - Proven ability to learn other coding languages, platforms,
    frameworks, and tools
  - Experience owning projects from the initial idea all the way
    to production
  - Experience mentoring junior engineers

  What We Offer:

  - Accelerated Growth Environment: An environment designed for
    swift skill and knowledge enhancement, where you have the
    autonomy to lead experiments and tests on a massive scale.
  - Top Tier Compensation Package: Competitive base, equity, and
    upside that tracks with your impact.
  - Flexible Time Off: Enjoy unlimited Flex Time Off, giving you
    the flexibility to manage your schedule and take time to
    recharge as needed.
  - Comprehensive Benefits Package: Prioritize your well-being
    with a comprehensive benefits package, featuring 401k, and
    premium Health, Vision, and Dental Insurance options.

  The anticipated gross base pay range is below for this role.
  Actual compensation will vary depending on factors such as a
  candidate’s qualifications, skills, experience, and
  competencies. Base annual salary is one component of
  StubHub’s total compensation and competitive benefits
  package, which includes equity, 401(k), paid time off, paid
  parental leave, and comprehensive health benefits.

  Salary Range

  $200,000—$250,000 USD

  About Us

  StubHub is the world’s leading marketplace to buy and sell
  tickets to any live event, anywhere. Through StubHub in
  North America and viagogo, our international platform, we
  service customers in 195 countries in 33 languages and 49
  available currencies. With more than 300 million tickets
  available annually on our platform to events around the
  world -- from sports to music, comedy to dance, festivals to
  theater -- StubHub offers the safest, most convenient way to
  buy or sell tickets to the most memorable live experiences.
  Come join our team for a front-row seat to the action.



