description: |
  What is the role?

  MerusCase offers a versatile, easy-to-use, cloud-based
  practice management solution for law firms. We are looking
  for a Software Engineer to join our MerusCase team. We are
  looking for PHP engineers who are interested in modernizing
  our tech stack to the latest serverless backend technologies
  along with React UI components.

  In this role, you will:

  - Develop new software product features and enhancements using
    SOLID design principles
  - Produce clean, efficient, and maintainable code based on
    specifications
  - Collaborate and partner with cross-functional teams such as
    Product Management and Customer Success to understand
    their needs and to come up with the best outcome
  - Troubleshoot systems and customer issues and help in
    resolving those by identifying short-term and long-term
    solutions
  - Increase the coverage of unit testing and automate the
    manual tasks whenever possible
  - Actively participate in code reviews and create technical
    documentation
  - Champion and demonstrate the best practices in day-to-day
    activities
  - Lead various technical projects to elevate current products
    to the next level to handle the upcoming growth
  - Support and develop software engineers by providing advice,
    coaching, and educational opportunities
  - Other duties as assigned

  Qualifications

  - 3+ years' experience developing SaaS and/or eCommerce web
    applications
  - BS in Computer Science or equivalent
  - Proficiency with modern multi-paradigm languages; knowledge
    of PHP (preferred), Ruby, Java, Python, etc.
  - Demonstrable experience with ES6 and Typescript
  - Knowledge of modern browser-based UI development with
    frameworks such as React and/or Angular
  - Experience of any cloud environment (AWS preferred)
  - Experience in a relational database management system (MySQL
    preferred) and data modeling
  - Experience with professional software engineering best
    practices for the full software development cycle,
    including coding standards, code reviews, source control
    management, build processes, testing, and operations

  Who is the ideal candidate?

  - Self-motivated and passionate about learning
  - Solid written and verbal communication skills
  - Growth mindset, desire to learn and adopt new technologies
  - Excellent analytical and problem-solving skills
  - Great team player and able to work efficiently with minimal
    supervision

  Benefits

  - Competitive salary
  - Paid vacation + sick and parental leave
  - Remote working flexibility
  - Company culture that encourages work / life balance
  - 100% paid PPO medical, dental, and vision insurance, 401k
    matching, equity grants
