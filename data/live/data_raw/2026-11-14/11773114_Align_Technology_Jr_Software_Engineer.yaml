description: |
  This position is ideal for a junior level developing
  software engineer with interest in the manufacturing
  industry to join the Global Manufacturing Applications team
  as a Jr. Software Engineer supporting Align’s global
  manufacturing operations. Partnering with global product and
  process engineering teams, you’ll leverage technical
  software engineering and analytical skills to enable high
  tech manufacturing and operational improvements. This role
  is vital in implementing Align Technology’s manufacturing
  software CI/CD strategy and overall operational success.

  Key Responsibilities

  - Develop reliable, scalable and performant MES application
    and reporting solutions using Rockwell FTPC and other
    emerging technologies as needed, primarily using Java,
    SQL, PNuts and potentially other programming languages.
  - Develop CI/CD pipeline solutions for the MES platform in
    collaboration with DevOps engineers.
  - Support MES integrations using Kafka, Rockwell FTPC, SAP Mii
    and other event-driven approaches.
  - Seek opportunities for system and process improvement and
    share your ideas with the team.
  - Troubleshoot multi-tiered and highly-integrated software
    systems and perform root-cause analysis.
  - Ensure that solution implementation notes and deployment
    work instructions are documented and stored in a common
    place.
  - Maintain knowledge and seek mastery of the appropriate
    technical skills at the highest level.
  - Collaborate with a diverse group of end-users, SMEs and
    other cross-functional team members.
  - Connect with other team members, through Scrum and other
    means, and share your experience and knowledge in all
    things related to manufacturing software development.
  - Celebrate in your successes and those of your team members.
  - This position does not supervise others.

  Skills, Knowledge & Expertise

  - Bachelor or Master’s Degree in Computer Science, Engineering
    or related field.
  - 2+ years of experience in software development &
    implementation with 1+ years of hands-on software
    development experience within a Manufacturing Operations
    environment.
  - Familiarity with multi-tiered and MVP software
    architectures.
  - Intermediate Core Java and OO Design/Development skills.
  - Ability to work both independently and collaboratively.
  - Security, performance, scalability and usability mindset.
  - SDLC and DevOps familiarity.
  - Excellent presentation and communication skills

  Complementary skills

  - Experience with Rockwell FTPC Modular Framework or Vaadin
    framework.
  - Experience with synchronous and asynchronous MES
    integrations using message brokers.
  - Knowledge about shop floor/manufacturing processes.
  - RESTful API and Web Services development.
  - Experience in working with the Medical Device industry.
  - Experience with global product labelling needs in a Medical
    Device company.

