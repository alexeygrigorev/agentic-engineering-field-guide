description: |
  About Nuvo

  We’re Redefining the $11T B2B Commerce and Payments Market

  Nearly everything you buy, from food to medicine, from
  building materials to auto parts, passes through a chain of
  businesses before it reaches your hands. But every handoff
  between them still runs on paperwork, phone calls, and
  spreadsheets. Nuvo is building the agentic commerce network
  to bring global trade online: shared infrastructure for
  everything from verification to invoicing to payment, with
  AI agents that can automate routine tasks so humans can
  focus on judgment. With 200k+ businesses already run on the
  Nuvo network today, and backed by $45M from Sequoia, Spark,
  Founders Fund, and Index, we're building the operating
  system for global commerce.

  About the Role

  We are looking for smart engineers to help build category-
  defining products. Our problems span multi-party workflow
  automation, identity, risk, and large scale data. You'll
  partner with our engineering, design and product teams to
  help shape the roadmap, solve real world problems and build
  our 0-1 products. Your work will have huge impact: on team
  culture, on our customers and on the economy.

  What You’ll Do:

  - Write & review high-quality, clean and performant code.
  - Collaborate with the team to implement intuitive
    experiences.
  - Play an active role in shaping the engineering culture,
    establishing best practices, and contributing to the
    growth of the team.
  - Use the best tools for the job — we’ve used technologies
    like Vue, graphql, and even built our own DSL for defining
    roles and permissions. What matters most is the impact you
    create, not the specific tools you use.

  What You Bring:

  - 2+ years prior experience in building and shipping user
    facing products from start to finish
  - Strong problem-solving skills and the ability to communicate
    technical solutions clearly.
  - A passion for internet technologies and knowledge of trends
    in modern software engineering.
  - Experience working in an early-stage engineering team or a
    fast growing company solving hard ambiguous problems with
    a strong bias for action.

  Expected Compensation Range $135,000-$300,000
