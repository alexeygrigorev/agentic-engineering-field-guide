description: |
  Southern New Hampshire University is a team of innovators.
  World changers. Individuals who believe in progress with
  purpose. Since 1932, our people-centered strategy has
  defined us — and helped us grow a team that now serves over
  180,000 learners worldwide.

  Our mission to transform lives is made possible by talented
  people who bring diverse industry experience, backgrounds
  and skills to the university. And today, we're ready to
  expand our reach. All we need is you.

  Make an impact — from near or far

  At SNHU, you'll have the option to work remotely in the
  following states: Alabama, Arizona, Arkansas, Delaware,
  Florida, Georgia, Hawaii, Idaho, Indiana, Iowa, Kansas,
  Kentucky, Louisiana, Maine, Maryland, Massachusetts,
  Michigan, Mississippi, Missouri, Nebraska, New Hampshire,
  New Mexico, North Carolina, North Dakota, Ohio, Oklahoma,
  South Carolina, South Dakota, Tennessee, Texas, Utah,
  Vermont, Virginia, West Virginia, Wisconsin and Wyoming.

  We ask that our remote employees have access to a reliable
  internet connection and a dedicated, properly equipped
  workspace that is free of distractions. Employees must
  reside in, and work from, one of the above approved states.

  The opportunity

  The Modern Workplace Engineering Manager is a technical
  people-leader responsible for the daily operation,
  engineering, and continuous improvement of Southern New
  Hampshire University's Modern Workplace services. In this
  role, you will lead a team of engineers and administrators
  while remaining actively engaged in technical design,
  troubleshooting, implementation, and escalation support
  across Microsoft 365, endpoint management, collaboration,
  identity, automation, and related technologies.

  You will translate departmental strategy into technical
  execution ensuring work is properly prioritized and
  delivered. You will develop the capabilities of the team,
  and provide hands-on technical leadership for complex or
  high-impact initiatives. The position requires a strong
  balance of people leadership, operational discipline, and
  current technical expertise. You will report to the Director
  of Modern Workplace Engineering. #LI-Remote

  What you'll do:

  - Lead, coach, and develop a team of Modern Workplace
    engineers and administrators.
  - Provide hands-on technical leadership across Microsoft 365,
    endpoint management, collaboration, identity, security,
    automation, and device-management technologies.
  - Serve as a senior escalation point for complex technical
    incidents, service disruptions, implementation challenges,
    and architectural decisions.
  - Participate directly in technical discovery, solution
    design, configuration, testing, deployment,
    troubleshooting, and documentation when needed.
  - Review technical designs, implementation plans, scripts,
    configurations, and operational procedures for quality,
    security, scalability, and supportability.
  - Manage work intake, prioritization, resource assignment,
    execution, and follow-through across operational and
    project-based work.
  - Translate departmental strategy and institutional
    requirements into technical roadmaps, delivery plans, and
    team assignments.
  - Establish clear technical standards, engineering practices,
    documentation requirements, and accountability
    expectations.
  - Conduct regular one-on-one meetings, performance
    discussions, technical coaching, and professional-
    development planning.
  - Identify skill gaps and create opportunities for cross-
    training, knowledge sharing, mentoring, and technical
    growth.
  - Partner with the Director on platform strategy,
    architecture, workforce planning, budgeting, vendor
    management, and service improvement.
  - Coordinate technical delivery across Microsoft 365, Intune,
    Windows, macOS, MECM, Autopilot, Teams, SharePoint,
    OneDrive, Entra ID, Power Platform, Copilot, and related
    technologies.
  - Work with Information Security, Infrastructure, Enterprise
    Applications, Service Management, and other ITS teams to
    design and deliver secure, reliable solutions.
  - Support incident, problem, change, request, release, and
    configuration-management practices.
  - Evaluate emerging technologies and recommend improvements to
    the Modern Workplace environment.
  - Develop automation and encourage the use of scripting,
    standardization, and repeatable engineering practices.
  - Monitor service performance, technical debt, workload
    distribution, platform health, and delivery outcomes.
  - Communicate technical risks, dependencies, status, resource
    needs, and recommendations to leadership and stakeholders.
  - Represent Modern Workplace Engineering in technical reviews,
    governance forums, project meetings, and operational
    discussions.
  - Other responsibilities as assigned

  What we're looking for:

  - Seven or more years of progressive experience in Microsoft
    365, endpoint engineering, infrastructure, systems
    administration, Modern Workplace technologies, or a
    related technical field.
  - Three or more years of formal people-management,
    supervisory, technical-leadership, or team-leadership
    experience.
  - Bachelor's degree or equivalent years of experience in lieu
    of degree acceptable
  - Strong hands-on experience with Microsoft 365 administration
    and at least two major Modern Workplace disciplines, such
    as endpoint management, collaboration, identity,
    automation, messaging, or device engineering.
  - Experience troubleshooting complex technical issues and
    guiding engineers through resolution.
  - Experience designing, implementing, and supporting
    enterprise-scale technology solutions.
  - Experience reviewing technical designs, scripts,
    configurations, implementation plans, and operational
    documentation.
  - Demonstrated experience coaching technical employees,
    managing performance, and supporting career development.
  - Experience managing competing operational priorities,
    escalations, projects, and technical resources.
  - Working knowledge of IT service-management, security,
    governance, and change-management practices.
  - Strong communication, decision-making, organizational, and
    stakeholder-management skills.

  We believe real innovation comes from inclusion - where
  different experiences, perspectives and talents are
  celebrated. So if you're wondering whether SNHU is right for
  you, take the leap and apply. You might be just the person
  we're looking for.

  If you have a disability and require a reasonable
  accommodation to fully engage in any part of the application
  or hiring process, please complete the Accommodation Request
  form or contact us at 603-626-9447. A member from the
  Employee Accommodation Support Center will be in contact
  with you within two business days to discuss your request.

  Compensation

  The annual pay range for this position is $96,954.00 -
  $155,153.00. Actual offer will be based on skills,
  qualifications, experience and internal equity, in addition
  to relevant business considerations. We expect this position
  to be hired in the following target hiring range $107,132.00
  - $144,945.00.

  Exceptional benefits (because you’re exceptional)

  You’re the whole package. Your benefits should be, too. As a
  full-time employee at SNHU, you’ll get:

  - High-quality, low-deductible medical insurance
  - Low to no-cost dental and vision plans
  - 5 weeks of paid time off (plus almost a dozen paid holidays)
  - Employer-funded retirement
  - Free tuition program
  - Parental leave
  - Mental health and wellbeing resources
