description: |
  About LineLeap

  LineLeap is the leading platform for LDA+ consumers. More
  than 2 million people use the LineLeap app to skip the line,
  pay cover, and buy tickets at 850+ bars and venues across
  the country. We sit at the center of the game days,
  birthdays, and nights out that define our customers’ young
  adult lives. For our venue partners, LineLeap is essential
  software that allows them to market to their customers and
  open up new revenue streams. For brands, we create on-
  premise connections with customers in ways never before
  possible - partnering with the world’s leading BevAlc
  companies to deliver impactful experiences right where it
  matters the most. The business already generates tens of
  millions of dollars in annual revenue, but we are still only
  scratching the surface of LineLeap’s potential impact. We
  are building on this foundation to make LineLeap the must-
  have rewards app for the college experience and beyond. By
  combining access to top venues with points, games, and
  offers, we are giving people a fun reason to use LineLeap
  every day. Users can now earn rewards from brands and
  businesses they already love, discover new ones, and turn
  those rewards into more great experiences with friends.

  About the Role

  LineLeap has over five hundred thousand monthly active app
  users and we are a lean team building new products for that
  audience while scaling the core systems behind our high-
  traffic business.

  You will work on both sides of that challenge. You may take
  a greenfield product from idea to implementation and through
  to launch. You may have to diagnose issues in production
  with a core service handling bursty, unpredictable traffic.
  Sometimes you will do both on the same day.

  This is a high-ownership, hands-on senior individual
  contributor role with no people management. We give
  engineers broad context, real influence over product
  decisions, and room to choose how they execute. You do not
  need to have held a Senior Software Engineer title before;
  we care more about what projects you have owned and how you
  operate in production.

  What You Will Work On

  Build and ship high-impact product features. You will
  design, implement, and iterate on products that reach a
  large existing audience. You will take ideas from concept to
  production and own what happens after launch.

  Solve hard scaling and reliability problems. You will
  improve critical services as traffic grows, plan for sharp
  and unpredictable peaks, and build experiences that remain
  useful when a customer’s mobile connection does not.

  Shape product direction with the team. You will work with
  engineers and product partners to turn broad goals into
  clear plans. You will have a real say in scope, product
  decisions, and technical direction.

  Move quickly without lowering the bar. You will balance
  speed, reliability, performance, and code health. Good
  judgment here includes knowing what needs to be built well
  now, what can improve later, and what should not be built at
  all.

  What Success Looks Like

  - You are viewed as a high-leverage engineer who consistently
    delivers.
  - You ship new product capabilities that customers use and
    that move the business forward.
  - You improve the reliability, performance, and operability of
    systems under peak load.
  - You turn broad direction into well-scoped work, communicate
    tradeoffs clearly, and carry projects through with strong
    agency

  How You Work

  - You care deeply about bringing a high standard of craft and
    pushing others to do the same.
  - You are organized and self-directed. You can plan, manage,
    and deliver your own projects.
  - You want a role with real responsibility, hard problems, and
    room to grow.
  - You are pragmatic about engineering decisions, with a strong
    intuition for simplicity.
  - You are energized by ambiguous problems and know how to
    define them before solving them.
  - You are direct and constructive, hold a high bar, and help
    teammates do their best work.
  - You love the craft: you care about your tools, learn
    quickly, and share what you learn with the team.
  - You value freedom and accept the responsibility that comes
    with it. You surface risks early, ask for help when
    needed, and own outcome

  Skills & Experience

  - 4+ years of experience writing high-quality production code.
  - 2+ years of on-call experience for critical production
    services.
  - Demonstrated ability to work independently and own large
    pieces of work.
  - Experience building or scaling high-traffic services where
    uptime matters.
  - Sound and pragmatic technical judgment around architecture
    and tradeoffs.
  - Clear communication with both technical and non-technical
    teammates.
  - Comfort moving across a modern full-stack environment; you
    may work in Terraform one day and Flutter the next.

  Our Stack

  Experience using our stack is not necessary for this role,
  but you are expected to have worked on consumer products
  with a modern frontend and backend. That said, here is what
  we use:

  - Mobile: Flutter + Dart
  - Web: Next.js + React, TypeScript
  - Backend: Node.js, TypeScript running on GCP (Cloud Run,
    Cloud Functions)
  - Databases: Firestore and Postgres
  - Platform: pnpm + Nx monorepo, Terraform, Datadog

  Compensation & Benefits

  - Base salary of $200,000 to $300,000 per year, depending on
    experience
  - Competitive stock option package, depending on experience
  - 401(k) plan
  - Benefits package including medical, dental, vision, short-
    term/long-term disability, and life insurance
  - Unlimited PTO
  - Hybrid in New York City or San Francisco preferred; remote
    candidates considered on a case-by-case basis
  - You must be authorized to work in the United States
  - #LI-Remote

  You Do You

  - LineLeap is an equal opportunity employer. All qualified
    applicants will receive consideration for employment
    without regard to race, color, religion, gender, gender
    identity or expression, sexual orientation, national
    origin, genetics, disability, age, or veteran status.
  - Employment is contingent upon successful completion of Form
    I-9 verification of identity and authorization to work in
    the United States. We do not currently offer visa
    sponsorship for this position.
