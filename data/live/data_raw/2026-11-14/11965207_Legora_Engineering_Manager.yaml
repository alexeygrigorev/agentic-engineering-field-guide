description: |
  About Us

  Legora is redefining how legal work gets done. Not built for
  lawyers, built with them. We work alongside the world’s best
  legal teams, who expect excellence, precision, and speed,
  and we hold ourselves to the same bar. Our AI-native
  workspace lets legal professionals move faster, think more
  clearly, and operate with sharper precision. By analysing
  thousands of documents in minutes and powering end-to-end
  workflows, we cut through complexity, teams can focus on
  what matters: judgment, strategy, and outcomes. 2,100+
  customers across 80+ countries trust us, including Cleary
  Gottlieb, Goodwin, Linklaters, White & Case, Dentons, and
  Barclays. We’ve scaled to $200M+ in ARR, with teams across
  Europe, North America and APAC, and continue to expand
  through acquisitions including Qura, Walter AI, Graceview,
  Cadastral, and Wexler. We partner with world-class
  performers: including Aaron Judge and the New York Yankees,
  Ludvig Åberg (and his caddie), and campaigns featuring Jude
  Law. Joining Legora means three things.

  - We lean in: ownership over titles, outcomes over intentions.
  - We fight for excellence: high standards, direct, ego-free
    feedback.
  - We grow together: as a team and with our customers.

  Mission before ego. Everyone contributes. No one coasts.

  If you’re driven by impact, pace, and raising the bar. This
  is the place.

  About the Role

  As an Engineering Manager at Legora, you'll lead by example:
  hands-on in the code while guiding a talented team of
  engineers. You'll architect and deliver features that make
  legal professionals' lives easier, drive technical
  excellence, and help shape a product used by forward-
  thinking law firms around the world. This is a role for
  someone who loves to build, mentor, and scale both people
  and systems.

  What You'll Do

  - Build end-to-end features across our fullstack platform
  - Stay hands-on in the codebase while growing your team
  - Lead architecture and technical decisions, holding a high
    bar for quality, security, and performance
  - Partner with Product and Design to ship value quickly and
    reliably
  - Review code and mentor engineers at all levels
  - Champion best practices in development, DevOps, and
    continuous improvement
  - Work with Node.js, React, Azure, AWS and Kubernetes
  - Keep your team healthy and efficient

  Who You Are

  - A seasoned fullstack or backend engineer with 1-3 years of
    leadership experience
  - Comfortable being hands-on while also setting technical
    direction
  - Skilled in building scalable products and owning complex
    systems end-to-end
  - Strong communicator who leads with empathy and clarity
  - Passionate about mentoring others and helping teams grow
  - Confident working across backend, frontend, and
    infrastructure
  - Curious, pragmatic, and always looking for smarter ways to
    build and deliver
  - But most importantly, you are someone who:
    - "Gets stuff done" and understands building a successful
      company isn't always glamorous and takes hard work and
      long hours
    - Proactively and independently solves the most burning
      problems
    - Thrives in a fast-paced environment where the answers aren't
      always clear and processes are few

  *Candidates will go through the same interview process as
  software engineering candidates (including a coding task and
  a technical interview), with additional interview steps at
  the end designed for the engineering manager role.

  *This is a New York City-based, 5-day in-office role, we
  believe building together in person drives better outcomes.
  What’s In It For You

  - Global collaboration: Partner with teams and clients
    domestically and internationally.
  - Competitive package: Comprehensive salary, benefits, and
    tools for success.
  - Meaningful work: Your efforts shape how thousands of lawyers
    use AI daily.
  - In-person environment: Union Square office designed for
    ambitious builders.
  - Benefits & Perks: We invest in our people with a
    comprehensive, thoughtfully designed benefits
    package:Medical, Dental & Vision
    - Multiple medical plan options through Aetna and Kaiser
      Permanente
    - HSA or Healthcare FSA (based on plan selection)
    - Dental plans via MetLife
    - Vision plans via Vision Care

  Legora is an Equal Opportunity Employer

  At Legora, we believe great teams are built on diversity of
  thought and experience. We’re proud to be an equal
  opportunity employer and committed to creating an inclusive,
  high-performance culture where everyone can do their best
  work. We welcome people of all backgrounds and don’t
  discriminate based on race, color, religion, national
  origin, gender, gender identity or expression, sexual
  orientation, age, disability, veteran status, or any other
  characteristic protected by law.
