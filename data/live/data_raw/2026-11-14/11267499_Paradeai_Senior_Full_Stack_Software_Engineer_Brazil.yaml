description: |
  We are building essential tools specifically designed for
  every logistics team

  Founded in 2015, Parade's mission is to democratize the best
  software and tools, at scale, for the logistics teams moving
  trade.

  Today, we power $7B+ in freight under management, and our
  AI-driven automation has delivered 40–100% profit increases
  for some of the industry's largest and most innovative
  freight brokers. With 44+ integrations across TMS platforms,
  load boards, and carrier networks, Parade has become the
  infrastructure of trust for the freight industry.

  By uniting fragmented systems into a single, AI-powered
  capacity management layer, Parade is transforming how
  freight is booked, matched, and executed.

  Why we need you

  We're scaling quickly and looking for a Senior Fullstack
  Engineer (backend-focused) to help us build and scale the
  core systems that power truckload freight across the United
  States.

  This isn't just another engineering role:

  - You'll be working on backend systems that handle millions of
    carrier quotes and thousands of automated transactions
    weekly
  - You'll contribute to infrastructure that enables freight
    brokers to achieve 50%+ digitization of loads,
    fundamentally reshaping the $800B+ U.S. trucking industry
  - You'll have the chance to directly influence Parade's
    product roadmap as we build out next-generation AI tools
    like CoDriver, our GenAI-powered suite that automates
    carrier sales and email operations, accelerating
    automation from weeks to days
  - You'll own critical architectural decisions that impact our
    ability to scale from Series B to market leadership

  We need strong backend engineering leadership to ensure our
  systems scale reliably, securely, and elegantly while
  maintaining the speed that sets us apart.

  Who are you?

  - You thrive in backend-heavy environments but are comfortable
    across the stack
  - You collaborate closely with product and engineering
    leadership to design features that bring tangible value to
    customers
  - You drive innovative technical solutions while mentoring and
    leveling up engineers around you
  - You communicate effectively across teams and make thoughtful
    trade-offs balancing scale, performance, and customer
    impact
  - You're excited about AI's potential to transform logistics
    and want to be at the forefront of that change

  Qualifications

  - 5+ years professional software development experience, with
    strong backend depth
  - Proficiency in Python3 and microservice architectures;
    experience with Django/Django Rest Framework/FastAPI is a
    plus
  - Solid experience designing and scaling distributed systems
    and APIs
  - Familiarity with relational (PostgreSQL) databases and data
    modeling at scale
  - Proficient and excited about using AI-powered coding tools
    (e.g., ClaudeCode, GitHub Copilot) to accelerate
    development and improve code quality
  - Comfortable contributing across the stack, but energized by
    backend challenges
  - Strong communication and mentorship skills
  - Bonus: Experience with freight/logistics or B2B SaaS
    platforms

  About Our Stack

  - Backend: Python3, Django, Django Rest Framework, FastAPI for
    AI services
  - Frontend: React/NextJS/Typescript, MUI
  - Infrastructure: Kubernetes on GCP, event-driven architecture
  - Databases: PostgreSQL (PostGIS), BigQuery, Redis

  Why Parade?

  - Be part of a small but mighty team (<30 people across the
    U.S. & Brazil) where your impact is immediately felt
  - Work on industry-defining technology: Parade invented the
    category of Capacity Management and is now leading with AI
    automation
  - Help scale systems trusted by 75,000 weekly active users and
    150,000+ carriers
  - Join a team that customers love: Parade's tools routinely
    deliver 20–50% profit lifts and dramatically reduce
    operating costs
  - Thrive in a culture of autonomy, impact, and growth - we
    move fast, debate openly, and commit fully
  - Work directly with the founding team and have a voice in
    product strategy

  Benefits

  - Fully remote, with annual company offsites at fun locations
  - Competitive compensation with meaningful equity
  - Generous PTO and sick leave

  About Us

  Parade builds tools that logistics planners and enterprises
  use to move millions of shipments every year. With Parade,
  teams create digital booking experiences that increase
  efficiency, improve decision-making, and unlock automation
  at scale.

  Parade's AI platform is already changing the game - enabling
  brokers to automate entire workflows that previously
  required teams of people. This is your chance to shape the
  future of U.S. truckload freight.
