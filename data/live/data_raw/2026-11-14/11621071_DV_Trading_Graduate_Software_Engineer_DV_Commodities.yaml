description: |
  About Us: Founded more than 20 years ago and headquartered
  in Chicago, the DV Group of financial services firms has
  grown to more than 600 people operating throughout North
  America and in Europe. Since spinning out of a large
  brokerage firm in 2016, DV Trading has rapidly scaled as an
  independent proprietary trading firm utilizing its own
  capital, trading strategies, and risk management
  methodologies to provide liquidity to worldwide financial
  markets and hedging opportunities to commodity producers and
  users. Now, DV group affiliates include two broker dealers,
  a cryptocurrency market making firm, and a bourgeoning
  investment adviser. DV Commodities is a division within DV
  Group that specializes in trading commodities markets,
  including crude oil, refined products, natural gas, power,
  emissions, metals, softs, and agriculture. DV Commodities'
  risk management, world-class technology, and talented
  traders have enabled it to become one of the world’s largest
  liquidity providers and risk allocators in the energy and
  commodities spaces. DV Commodities currently has over 35
  desks, with traders and staff located in London, New York,
  Chicago, Houston, and Dubai.

  Responsibilities:

  - Build and improve a variety of proprietary trading tools to
    support the trading desks across the business
  - Collaborate with other developers, tech leaders, traders,
    and researchers to outline the technical needs for each
    trading application
  - Work with technology and business stakeholders in iterative
    fashion to deliver platform functionality
  - Architect greenfield solutions to address business needs,
    and work with equal confidence in established codebases:
    quickly building context in unfamiliar systems, extending
    them safely, and improving them as you go
  - Use AI to accelerate development while taking full ownership
    of your code: apply engineering judgment across the entire
    lifecycle, from design and edge case handling through
    deployment and production support

  Requirements:

  - Expected to graduate with a degree in Computer Science,
    Computer Engineering, or related field by December
    2026/January 2027
  - Experience programming in either C++ and/or Python in Linux
    environments, ideally on quantitative or latency-sensitive
    problems
  - Accelerate development with AI tools while fully owning your
    code from verification through edge case handling
  - Excellent listening, interpersonal, written, and oral
    communication skills
  - Excellent analytical and creative problem-solving skills
  - Ability to work onsite at our London office 5 days a week

  DV is not accepting unsolicited resumes from search firms.
  Only search firms with valid, written agreements with DV
  should submit resumes in response to DV’s posted positions.
  All resumes submitted by search firms to DV via e-mail, the
  Internet, personal delivery, facsimile, or any other method
  without a valid written agreement shall be deemed the sole
  property of DV, and no fee will be paid in the event the
  candidate is hired by DV. DV is proud to be an equal
  opportunity employer and committed to creating an inclusive
  environment for all employees.
