description: |
  Synergy Business Innovation & Solutions is a premier
  implementer of cutting-edge software solutions. Synergy
  brings the experience and expertise necessary to deliver
  capability that provides tangible ROI to our customers. Our
  core areas of expertise are in the fields of Digital
  Transformation, Cloud Solutions, SaaS and Low-Code/No-Code
  Solutions, Emerging Technologies, Data Analytics and
  Visualization, Information Assurance, and Business Process
  Re-Engineering.

  Synergy offers its employees a generous portfolio of core
  and voluntary benefits including: group medical, dental, and
  vision insurance, company paid life, short-term, and long-
  term disability insurance, HSA, FSA, 401(k) with company
  match, PTO & Bonus Leave, 11 paid federal holidays, parental
  leave, tuition and training reimbursement, a referral bonus
  program, and well-being programs.

  At Synergy, you’ll be challenged and given the opportunity
  to grow in your career path. In fact, growth is such a big
  deal to us that we have career mentors available for every
  employee, company-funded certification opportunities,
  education reimbursement, and a general open-door policy so
  that you have support when you need it. Our team is eager to
  learn, fast-paced, and quality-driven. If that sounds like
  you, Synergy has a position for you!

  This position is designated as work from home.

  About the Role:

  - Seeking an experienced Full Stack Developer to code,
    enhance, and support enterprise applications in an AWS
    cloud environment. This position requires full stack
    development skills across user interfaces, backend
    services, APIs, integrations, and relational databases.
  - The ideal candidate is a hands-on developer who can solve
    complex technical problems, contribute to technical design
    decisions, and collaborate effectively with Product, QA,
    Cloud/DevOps, and other engineering teams.

  Primary Responsibilities:

  - Design, develop, test, deploy, and maintain full stack
    enterprise applications.
  - Develop and enhance front-end applications, backend
    services, APIs, integrations, and database components.
  - Participate in application architecture, technical design,
    and implementation decisions.
  - Troubleshoot complex application, integration, performance,
    and production issues.
  - Participate in code reviews and follow development
    standards, secure coding practices, and high-quality
    solutions.
  - Collaborate with Product, QA, Cloud/DevOps, and other
    engineering teams throughout the development lifecycle.
  - Support automated testing, CI/CD, deployment, and production
    readiness activities.
  - Participate in estimation, refinement, planning, and other
    Agile team activities.

  Required Qualifications:

  - 3-6 years of professional software development experience,
    including 3+ years of full stack development.
  - Strong development experience with Java, Angular,
    TypeScript/JavaScript, and Node.js.
  - Experience developing modern, maintainable web applications
    and reusable front-end components.
  - Experience designing and developing REST APIs, web services,
    and enterprise integrations.
  - 1+ years of experience developing and supporting
    applications in cloud environments, including cloud-based
    application architecture, deployment, integration and
    troubleshooting.
  - Strong relational database and SQL experience, preferably
    with PostgreSQL.
  - Experience developing and supporting enterprise Java
    applications using JBoss or comparable application
    platforms.
  - Experience with Git/Bitbucket, Maven, CI/CD pipelines, and
    modern software development practices.
  - Familiarity with Linux-based application environments.
  - Strong understanding of application architecture, object-
    oriented design, secure coding, performance, and
    maintainability.
  - Experience working in Agile development teams.

  Preferred Qualifications:

  - Experience with large-scale enterprise or federal government
    applications, AWS cloud modernization, and applications
    operating within formal security and compliance
    environments.
  - Experience with micro service architecture and supporting
    cloud technologies.

  Education Requirements:

  - Preferred: Bachelor’s degree in Computer Science, Software
    Engineering, Information Technology, or related field, or
    equivalent professional experience.

  Citizenship & Clearance Requirements:

  - Required: U.S. citizenship required.
  - Required: Ability to obtain a Federal Government Position of
    Trust. Must pass a background investigation.

  Target Salary Range

  Compensation for roles at Synergy is determined by a variety
  of factors including, but not limited to, the requirements
  of the role; level of experience; education and
  certifications; the individual’s combination of knowledge,
  skills, and abilities; as well as alignment with market
  data, federal and state laws, and other business and
  contract considerations. The estimated pay range for this
  position is: $79,922.00 – $114,174.00. The disclosed range
  has not been adjusted for the applicable geographic
  differential associated with the location at which the
  position may be filled. It is not typical for an individual
  to be hired at or near the top of the range for their role,
  and compensation decisions are dependent on the facts and
  circumstances of each case and represent just one component
  of Synergy’s total compensation package for employees.

  Candidate AI Policy

  Synergy is committed to the responsible and ethical use of
  AI tools. However, we want to ensure a fair candidate
  evaluation process based on your own skills and knowledge.
  As part of this commitment, the use of artificial
  intelligence (AI) or other tools to assist with responses
  during interviews (whether in-person or virtual) is
  prohibited unless permission is explicitly granted. You are
  expected to be on camera during interviews and assessments.
  We reserve the right to take your picture to verify your
  identity and prevent fraud.

  Synergy is an equal opportunity employer and does not
  discriminate against applicants for employment or its
  employees on the basis of age, race (including hair
  texture/style), creed, color, religion, religious creed,
  ancestry, national origin, ethnic origin, sexual
  orientation, gender identity or expression, military or
  veteran status, sex, medical condition, pregnancy
  (childbirth, breastfeeding, and related medical conditions),
  physical or mental disability, personal appearance, organ
  donation and hair length associated with race, genetic
  information or characteristics, family responsibilities,
  familial status, marital status, citizenship or immigration
  status, status as a victim of domestic violence, a sexual
  offense, or stalking, political affiliation, arrest records
  and criminal convictions, credit information, matriculation,
  homeless status, or any other characteristic protected by
  federal, state and local law. Discrimination or harassment
  based upon these protected categories is expressly
  prohibited. This policy applies to all aspects of
  employment, including job selection, assignment, promotion,
  compensation, benefits, training, discipline, and
  termination.

