description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  Overview

  As a Senior Software Engineer - Mobile at Fanatics Betting &
  Gaming (FBG), you'll be joining our dynamic mobile
  engineering teams, contributing to the rapidly growing
  Fanatics Sportsbook app ecosystem. You'll work across
  various product areas, developing features that enhance
  customer experience and drive business growth.

  As a Senior Software Engineer at FBG, you are a fundamental
  problem solver and growing contributor, known for your
  ability to think critically and adapt to new technologies.
  You combine strong programming fundamentals with a
  willingness to learn our technology stack, delivering
  results across mobile platforms. You play an important role
  in implementing features and solutions while continuously
  developing your technical expertise and engineering skills.

  We embrace principles of data-driven development,
  operational excellence, and continuous process optimization
  to deliver a stable, scalable platform. Central to our
  strategy is Kotlin Multiplatform, which empowers us to
  deliver high-quality features quickly and consistently
  across multiple ecosystems. By focusing on object-oriented
  design, modern coding practices, open-source frameworks, and
  third-party platform integrations, we continuously innovate
  and deliver at speed in this exciting and fast-moving
  market.

  Responsibilities

  - Develop, test, document, and deploy high quality software
    into production
  - Develop a fundamental understanding of our industry,
    product, feature set and roadmap
  - Implement new features from functional requirements to logic
    and UI with guidance
  - Learn and follow the principles, guidelines, and best
    practices of our engineering strategy
  - Work closely with our product team, design, and other
    internal stakeholders to understand technology decisions
    that grow and improve our products
  - Participate in an on-call rotation to address urgent issues
    outside business hours and contribute to app enhancements
    and operational efficiency (OE) by troubleshooting and
    resolving application-related problems
  - Escalate when tasks or projects hit roadblocks and seek
    guidance when needed
  - Participate in code reviews to maintain code quality and
    learn from senior team members
  - Contribute to team planning and design discussions, building
    expertise around design approaches
  - Impact software quality and customer experience of product
    features
  - Learn about testability, operational excellence metrics, and
    team documentation practices
  - Collaborate effectively with team members and contribute to
    a positive team culture
  - Be open to occasional travel to Fanatics offices and other
    locations for conferences, events, meetings, and team-
    building activities

  Required Qualifications

  - 5+ years of development experience
  - Strong programming fundamentals in any language with
    demonstrated problem-solving abilities
  - Willingness and eagerness to learn Kotlin as the primary
    development language
  - The bulk of our business logic strategy relies on Kotlin
    Multiplatform (KM). You should be comfortable learning and
    developing business logic within this ecosystem
  - Mobile development experience with modern UI frameworks
    (SwiftUI, Jetpack Compose, or similar)
  - Team-first mentality, with a willingness to do what it takes
    to get the job done and a desire to strive for better
  - Able to articulate your thinking process and explain your
    reasoning when working through problems
  - Demonstrates initiative and independent problem-solving
    skills while knowing when to seek guidance
  - Demonstrates logical reasoning when working through
    technical challenges
  - Comfortable with ambiguity and changing requirements in a
    fast-paced environment
  - Familiar with or willing to learn Agile software product
    delivery and SCRUM methodology
  - Thrives in a high-growth environment where priorities evolve
    regularly and decisions are made quickly
  - Able to work cross-functionally within an enterprise
    environment

  Preferred Qualifications

  - Experience with mobile development (Android or iOS)
  - Exposure to modern development tools and frameworks
  - Understanding of basic software engineering principles and
    best practices
  - Experience working in collaborative development environments
  - Familiarity with version control systems and development
    workflows
  - Interest in learning additional languages like Swift when
    needed for cross-platform work

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  Ranges will change based on country and state of residence,
  which are reflected in Geographical Zones defined by
  Fanatics Betting and Gaming. The range incorporates all of
  our Geographical Compensation Zones and is subject to change
  as the Zone associated with the actual offer is confirmed.
  In addition to the base and bonus, full-time employment, and
  more. For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Salary Range

  $1—$1 USD

