description: |
  Location: Remote, collaboration primarily during EST hours

  About the company

  Cake is on a mission to make cutting-edge AI accessible to
  enterprise teams.

  Enterprises want to move faster with AI, but are constrained
  by infrastructure complexity, high operating costs, and the
  governance required to run AI systems safely at scale. Cake
  removes those barriers, enabling teams to deploy and operate
  AI/ML platforms 10x faster and 10x cheaper than traditional
  approaches—without sacrificing reliability or control. Cake
  runs inside the customer’s own VPC, giving enterprises full
  ownership of their data, security, and operations.

  Cake solves the full infrastructure problem across 4 layers:
  compute infrastructure management, open-source ML
  components, common integrations, and pre-built project
  components. Built-in security, monitoring, and governance
  ensure clean ownership, enforce guardrails, and provide a
  dependable path from experimentation to production at scale.

  Backed by top investors, Cake is seeing strong adoption and
  is positioned for rapid growth in the next 12 months. Our
  culture emphasizes ownership, clear communication, and
  collaboration, with a high bar for operational excellence
  and production-ready systems.

  What you’ll do

  As a Staff Software Engineer, you will play a critical
  leadership role in building and operating the infrastructure
  that powers Cake’s AI platform. This is a high-ownership
  role for an engineer who thrives at the intersection of
  distributed systems, cloud infrastructure, and developer
  experience.

  You’ll design and operate the ML platform foundations that
  both internal teams and customers rely on, owning systems
  end-to-end from architecture to production. You’ll work
  closely with customers to translate real-world ML use cases
  into reliable, scalable platform capabilities.

  This role is ideal for someone who wants to be a technical
  owner, not just an implementer, someone who cares deeply
  about system quality, operational excellence, and clear
  communication.

  You will:

  - Build Enterprise-Scale Infrastructure
  - Sustain Platform Health and Performance
  - Enable Teams and Customers to Move Faster
  - Lead Through Influence

  Requirements

  - Core Experience
  - Technical Strength
  - Ownership & Communication
  - Mindset

  Why Join Cake

  - High impact, high ownership: You’ll own foundational systems
    that directly power customer success.
  - Small, senior team: Your work won’t get lost—you’ll shape
    the platform and engineering culture.
  - Real customers, real problems: You’ll build systems used in
    production by growing companies.
  - Autonomy and trust: We hire experienced engineers and give
    them room to operate.

  Benefits

  - Competitive cash compensation alongside above-market equity
    upside
  - Top-tier fully covered medical, dental, and vision insurance
  - Life insurance
  - 401k program

  Additional Perks

  - Unlimited PTO
  - Monthly half day
  - Citi Bike membership
  - Monthly wellness stipend
  - Office equipment stipend, including reimbursement for
    approved disability-related accommodations
  - Investment in employee learning and growth opportunities

  Cake is committed to providing equal employment
  opportunities to all employees and job seekers regardless of
  race, color, religion, national origin, sexual orientation,
  gender, gender identity, marital status, disability, veteran
  status, or any other legally protected category. As an equal
  opportunities employer, we value diversity and its positive
  impact on our culture.

  Cake also complies with the Americans with Disabilities Act
  (ADA). We are dedicated to working with and providing
  reasonable accommodation to job applicants with physical or
  mental disabilities. If you require accommodation, please
  email us at accommodationrequests@cake.ai and we will
  promptly address your request.
