description: |
  At Hudl, we build great teams. We hire the best of the best
  to ensure you’re working with people you can constantly
  learn from. You’re trusted to get your work done your way
  while testing the limits of what’s possible and what’s next.
  We work hard to provide a culture where everyone feels
  supported, and our employees feel it—their votes helped us
  become one of the Top 100 Inspiring Workplaces. We think of
  ourselves as the team behind the team, supporting the
  lifelong impact sports can have: the lessons in teamwork and
  dedication; the influence of inspiring coaches; and the
  opportunities to reach new heights. That’s why we help teams
  from all over the world see their game differently. Our
  products make it easier for coaches and athletes at any
  level to capture video, analyze data, share highlights and
  more. Ready to join us?

  Your Role

  We're hiring an Engineer II to join one of our cross-
  functional product teams in our Athlete Performance group,
  which is focused on building cutting-edge solutions for
  athletes and sports teams that directly impact how they
  train, compete and achieve peak performance.

  In this role, you'll focus on building high-performance
  mobile applications and core data services across iOS and
  Android. You will help build and maintain hardware-agnostic
  communication interfaces to stream live sensor and optical
  tracking data to the cloud and mobile clients. You'll work
  on translating complex physical and biomechanical data into
  clear, digestible metrics that support real-time decision-
  making for elite coaches, athletes, and medical teams.

  In this position, you'll:

  - Work with a cross-functional team. You'll collaborate with
    Engineering, Quality Assurance, Product, Design and Scrum
    disciplines to deliver feature-rich mobile and the back-
    end services that power them.
  - Develop and deliver. You'll take ownership of specific
    features, defining low-latency communication interfaces
    across the stack and building user-facing application
    features that turn complex sensor data into clear,
    actionable insights.
  - Test new ideas. At Hudl, we iterate rapidly, deploying
    changes to the product hundreds of times daily across our
    Engineering team. You'll write high-quality code, conduct
    code reviews, and help solve well-defined technical
    problems using modern mobile and cloud development best
    practices.
  - Grow your skills. You'll collaborate with senior engineers
    and tech leads to refine your technical architecture
    skills, learning to navigate trade-offs in system
    performance, real-time data streaming, and application
    responsiveness.

  Time spent collaborating with your teammates in-office will
  be a regular part of how you work. We're currently
  considering applicants within commuting distance of London.
  You'll be expected to work more days in-office than remote,
  but will have the freedom to coordinate your specific in-
  office schedule with your team.

  Must-Haves

  - Mobile experience. Hands-on experience developing native or
    cross-platform mobile applications, ideally with React
    Native (iOS and Android).
  - Systems mindset. You have experience working with different
    API styles, communication patterns for streaming data
    across mobile clients and back-end systems.
  - A team player. You understand that problem-solving is a team
    effort and enjoy collaborating with peers to learn, share
    knowledge, and build great software together.
  - User-focused. You're excited to build intuitive interfaces
    that translate complex physical or optical sensor data
    into digestible information for real-world users.
  - Willingness to learn. You have solid core engineering skills
    and are excited to dive into mobile frameworks, time-
    series data streams, or cloud architecture as needed

  Nice-to-Haves

  - Backend & Cloud Architecture knowledge: Hands-on experience
    with modern cloud infrastructure (AWS/GCP), microservice
    architectures, time-series databases, and CI/CD deployment
    pipelines.
  - Domain & Data Streaming experience: Background working with
    real-time video, wearable devices, or streaming
    optical/sensor data, ideally within sports technology or
    performance analytics.
  - Mobile CI/CD.Experience with mobile build and release
    pipelines (GitHub Actions), distribution platforms
    (TestFlight, Firebase App Distribution), and testing
    frameworks such as Jest and Detox.

  Our Role

  - Champion work-life harmony. We'll give you the flexibility
    you need in your work life (e.g., flexible vacation time
    above any required statutory leave, company-wide holidays,
    remote work options and more) so you can enjoy your
    personal life too. Plus, every five years, we give you a
    paid sabbatical to unplug and recharge.
  - Guarantee autonomy. We have an open, honest culture and we
    trust our people from day one. Your team will support you,
    but you'll own your work and have the agency to try new
    ideas.
  - Encourage career growth. We're lifelong learners who
    encourage professional development. We'll give you tons of
    resources and opportunities to keep growing.
  - Provide an environment to help you succeed. We've invested
    in our offices, designing incredible spaces with our
    employees in mind. But whether you're at the office or
    working remotely, we'll provide you the tech you need to
    do your best work.
  - Support your wellbeing. Depending on location, we offer
    medical and retirement benefits for employees—but no
    matter where you're located, we have resources like our
    Employee Assistance Program and employee resource groups
    to support your mental health.

  Compensation

  The base salary range for this role is displayed
  below—starting salaries will typically fall near the middle
  of this range.

  We make compensation decisions based on an individual's
  experience, skills and education in line with our internal
  pay equity practices.

  Base Salary Range

  £51,000—£86,000 GBP

