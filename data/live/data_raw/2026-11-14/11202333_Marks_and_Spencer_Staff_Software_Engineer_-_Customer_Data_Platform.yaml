description: |
  What you’ll do



  Your key accountabilities will include:



  - Build and maintain high-quality, reliable software in the
    cloud, embracing a 'you build it, you run it' mindset.
  - Lead delivery of complex features and backlog items within
    your team, from design to production, ensuring smooth
    rollout and minimal operational disruption.
  - Own technical delivery within your team, helping break down
    ambiguous problems into clear, executable plans.
  - Design and implement solutions that align with existing
    architecture and contribute meaningfully to team-level
    technical direction.
  - Write, review, and release well-tested, maintainable code
    that ensures confidence in shipping high-quality software.
  - Improve code quality and consistency by setting standards
    through PR reviews and best practices.
  - Partner closely with Product and Design, collaborating to
    deliver meaningful customer outcomes.
  - Work with adjacent teams when needed to align on shared
    components and dependencies.
  - Actively participate in on-call support, contributing to
    operational stability, observability, and performance.
  - Coach and support other engineers through pairing, reviews,
    and mentoring, helping raise the team’s overall
    capability.
  - Contribute to team OKRs and actively support planning,
    refinement, and roadmap discussions.
  - Champion secure coding, reliability, and sustainable
    engineering practices within your team.



  Who you are

  - You own delivery of complex features end-to-end, ensuring
    quality, performance, and reliability — not just
    completion.
  - You can take ambiguous problems and turn them into clear
    technical plans for the team to execute.
  - You design solutions that balance speed, maintainability,
    and long-term scalability.
  - You actively identify technical debt, risks, or
    inefficiencies and take action to address them.
  - You use observability and metrics to validate behavior,
    debug issues, and improve system health.
  - You regularly support and unblock teammates, helping them
    deliver more effectively.
  - You contribute to design discussions, clearly communicating
    trade-offs, and influencing decisions within your team.
  - You help the team operate effectively in production,
    supporting incidents, and driving improvements after
    failures.
  - You can debug complex issues across multiple components, not
    just your own code.
  - You proactively improve testing strategies and code quality,
    ensuring long-term confidence in releases.
  - You introduce improvements to tooling, CI/CD, or workflows
    that increase team productivity.



  Tech Stack

  M&S utilizes a variety of technologies within the Customer
  Data Platform including:

  - Front-end: React, Next.js, TypeScript
  - Back-end: Java, Node.js, GraphQL, REST APIs
  - Cloud & Infrastructure: Azure Kubernetes Service (AKS),
    mParticle, Salesforce Marketing Cloud, Salesforce Data360
  - Observability & Monitoring: Dynatrace, PagerDuty
  - Quality & Testing: JUnit, Jest, Playwright
  - Security & Scanning: Snyk, Semgrep, SonarCloud
  - Experimentation & Analytics: Optimizely, Adobe, Tealium



  What’s In It For You



  Working at M&S means being part of something bigger -
  helping to deliver quality, value and service to millions of
  customers every day. We’re inclusive, fast-moving and always
  evolving, with a strong sense of purpose and a focus on
  doing the right thing.



  Here are just a few of the benefits that make working here
  even more rewarding:



  - 20% colleague discount on all M&S products and many third-
    party brands for you and someone in your household,
    available once you’ve completed your probation
  - Competitive holiday allowance with the option to buy more
  - Discretionary bonus schemes linked to your performance and
    ours
  - Strong pension and life assurance to help plan for the
    future
  - Tailored induction and training to support your development
    from day one
  - Exclusive perks and savings through our M&S Choices portal
  - Market-leading family policies, including parental, adoption
    and neonatal leave
  - 24/7 wellbeing support, including virtual GP access and
    mental health services
  - One paid volunteer day a year to support a cause that
    matters to you

  Everyone’s Welcome



  We are ambitious about the future of retail. We’re
  disrupting, innovating and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet. Marks & Spencer strives to be an
  inclusive organisation, trusted and admired by our
  colleagues, customers and suppliers. Join us and make change
  happen.



  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and work
  together to win together.



  If you feel you'd benefit from any support or reasonable
  adjustments during any stage of the recruitment process,
  please don’t hesitate to let us know when completing your
  application. This information will be picked up by our team,
  so we can try and put steps in place to help you be at your
  best through this process.



