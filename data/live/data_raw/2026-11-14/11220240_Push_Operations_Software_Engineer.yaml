description: |
  Description

  The Company:

  Push is an all-in-one platform that helps businesses grow
  and scale their companies by simplifying HR, payroll, time
  tracking, and scheduling. Our purpose is to help our
  customers free up their time by making people management
  ridiculously easy, so they can focus on their passion.

  Our customer base includes some of the biggest brands, such
  as Earls Restaurant, Cactus Club, Crumbl Cookies and more.

  The Team:

  We're a group of competitive, dedicated people who place a
  high priority on competence and efficiency, but an even
  higher stock in engaged and passionate team members who
  contribute to our culture and make an impact. As part of our
  rapidly growing team you will play an important and unique
  role in working towards our mission to help 1 million people
  do what they love.

  Take a look at a day in the life of our team: Behind the
  Scenes with our Software Engineers

  The Role

  We’re looking for a Full Stack Developer who is comfortable
  building across the stack—front end, back end, and mobile.
  You’ll be developing core features that power Push
  Operations’ workforce management platform, collaborating
  closely with product, design, and AI teams to deliver
  intuitive user experiences and scalable backend systems.
  Proficiency in React and/or Native (or related cross-
  platform frameworks) is an important part of this role, as
  our mobile apps are central to how customers interact with
  Push. Kindly note this position is for an existing role
  which we are actively hiring for.

  Location:

  Recently the world has changed so we are changing with it.
  We’re embracing new ways of working and are constantly
  adapting our practices to ensure that wherever you are
  working from, you feel a part of the team and have
  everything you need to work comfortably. We are a remote-
  first company, Pushies can choose to work remotely or from
  our Downtown Vancouver office.

  We are considering eligible candidates for this role from
  any location across Canada with a sufficient time zone
  overlap with our Vancouver team.

  Job Duties:

  - Design, build, and maintain features across the full stack
    built using a variety of languages and technologies
  - Front-end: React/React Native web and mobile applications
  - Back-end: PHP (and related frameworks), Node.js, RESTful
    APIs, microservices
  - Data: database schemas, integrations, and optimization
  - Level up our existing systems by contributing to incremental
    modernization efforts
  - Level up production code by diagnosing and resolving issues,
    balancing against new feature delivery
  - Collaborate with designers and product managers to turn
    requirements into elegant, user-friendly solutions
  - Ensure high performance, security, and scalability across
    systems
  - Build mobile experiences with React Native or related
    technology, ensuring smooth integration with backend
    services
  - Write clean, maintainable, and well-tested code; participate
    in code reviews and knowledge sharing
  - Troubleshoot, debug, and optimize performance issues across
    web, mobile, and back-end layers
  - Stay current with evolving tools, frameworks, and best
    practices for full stack and mobile development

  Why Push?

  - Do what you love! It’s the key to happiness. That’s why at
    Push we aim to create a supportive environment to help
    foster your passion for work, and keep you feeling
    energized and happy so you can do more of what you love.
  - Grow Yourself. We want to see you win in all areas. At Push,
    our mantra is: you will grow professionally and
    personally. We drive conversations around your personal
    and professional goals. Let’s crush it together.
  - Make an Impact. At Push, we believe everyone is born a
    genius, and our responsibility is to develop that genius
    within. Impact is our key metric - that’s why we challenge
    Pushies to show up as their authentic selves while
    creating a legacy.

  Check out our About Us video:
  https://www.pushoperations.com/careers

  Additional Information

  At Push, we place value on different types of experiences.
  If your experience looks a little different from what we’ve
  listed but you think you’re a good fit, we would still love
  to hear from you.

  We celebrate diversity and promote equal opportunity. We
  appreciate what makes each of our team members different and
  encourage you to apply, no matter who you are or how you
  identify.

  Push Operations welcomes and encourages applications from
  people with disabilities. Accommodations are available upon
  request for candidates participating in all aspects of the
  recruitment and selection process.

  Please note that we use AI to screen and assess applicants
  for this position. Human oversight is maintained throughout
  the hiring process.

  ﻿Salary: $90,000 - $130,000 CAD annually

  Requirements

  - 3–5 years of professional experience as a Full Stack
    Developer
  - This is an individual contributor role focused on hands-on
    execution rather than architecture ownership, though we're
    open to expanding scope and ownership as you grow with the
    team
  - Proficiency with JavaScript/TypeScript and modern frameworks
    (React, React Native, Node.js)
  - Proficiency with PHP or a related backend framework
    (Laravel, Symfony, or equivalent)
  - Strong understanding of RESTful APIs, microservices, and
    database systems (SQL/NoSQL)
  - Experience integrating frontends and mobile apps with back-
    end APIs
  - Familiarity with mobile-specific challenges (app store
    deployments, push notifications)
  - Solid grasp of testing (unit, integration, end-to-end) and
    CI/CD pipelines
  - Experience with cloud platforms (AWS, GCP, or Azure) is an
    asset
  - Excellent collaboration and communication skills
  - A passion for solving real-world problems with technology
    that makes a difference in people's lives
  - Proficiency with modern AI-driven tools such as Claude Code

  ﻿Bonus Skills and Qualifications:

  - Experience with mobile analytics (Firebase, LogRocket,
    Mixpanel)
  - Familiarity with workforce management, HR compliance, or
    payroll systems
  - Knowledge of accessibility standards for both web and mobile
