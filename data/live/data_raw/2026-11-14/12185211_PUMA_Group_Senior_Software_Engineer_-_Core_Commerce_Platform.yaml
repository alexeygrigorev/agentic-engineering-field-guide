  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Core Commerce Platform organisation
  responsible for delivering the omnichannel commerce
  capabilities that power the purchase journey, inventory
  availability, delivery promise, order processing &
  fulfilment and post-purchase experiences across channels.
  The organisation plays a critical role in ensuring products
  are available to buy, orders can be fulfilled reliably, and
  commitments made to consumers are delivered consistently.
  Through a portfolio of commerce platform capabilities, the
  organisation enables seamless omnichannel experiences while
  supporting efficient, scalable, and resilient commerce
  operations across the global digital ecosystem.

  As a Senior Software Engineer, you will design, build, and
  maintain production-grade backend services for payment
  capabilities that power payment processing, authorization,
  tokenization, fraud prevention, and transaction
  orchestration across digital commerce channels. You will
  work closely with Tech Leads, Product Owners, Payment
  Service Providers (PSPs), Risk & Compliance teams, and
  cross-functional engineering teams to deliver secure,
  scalable, resilient, and low-latency payment solutions that
  enable seamless, reliable, and compliant customer checkout
  experiences..

  What you will do:

  - Design, develop, and maintain scalable services supporting
    payment authorization, capture, refunds, tokenization,
    fraud prevention, and transaction lifecycle management
    across digital commerce channels.
  - Build and enhance API-first, event-driven, and SFCC-
    integrated payment solutions that enable secure
    transaction processing, payment gateway integrations,
    token management, fraud detection, and real-time payment
    status updates.
  - Support the delivery of seamless and secure customer payment
    experiences by ensuring payment workflows operate
    consistently across channels, devices, regions, and
    currencies.
  - Integrate SFCC payment services with payment gateways, PSPs,
    OMS, ERP, fraud platforms, tax services, customer systems,
    and other enterprise applications to enable seamless end-
    to-end payment processing.
  - Collaborate with Tech Leads, Product teams, and payment
    partners to deliver roadmap commitments.
  - Drive technical design discussions and contribute to
    architecture decisions within the team.
  - Ensure applications and services are production-ready
    through effective observability, monitoring, performance
    optimization, reliability engineering, security
    compliance, and operational readiness practices.
  - Mentor junior engineers, perform code reviews, and help
    establish engineering standards and best practices.
  - Utilize AI-assisted engineering tools to accelerate
    development and strengthen code quality.
  - Support PCI-compliant payment architectures, security
    controls, tokenization strategies, and fraud mitigation
    capabilities to protect customer transactions and
    sensitive payment data.

  YOUR TALENT

  ·       7+ years of software engineering experience, with a
  strong track record of building and operating scalable,
  highly available, customer-facing digital commerce and
  payment platforms.

  ·       Strong understanding of payment capabilities,
  including payment authorization, capture, refunds, voids,
  tokenization, payment instruments, and transaction lifecycle
  management.

  ·       Strong understanding of design patterns, data
  structures and algorithms, with practical experience
  applying them to real-world use cases.

  ·       Solid knowledge of payment processing workflows,
  including payment authorization, settlement, refunds,
  partial captures, chargebacks, token management, and
  transaction reconciliation.

  ·       Expertise in backend engineering, API design,
  microservices, event-driven architectures, and scalable
  integration patterns using Java, Spring Boot and related
  frameworks.

  ·       Familiarity with Payment Service Providers (PSPs)
  and payment gateway integrations such as Adyen, Cybersource,
  Stripe, Worldpay, PayPal, or equivalent enterprise payment
  solutions.

  ·       Strong hands-on software engineering experience with
  modern microservices architectures using Java and Spring
  Boot.

  ·       Experience designing and building high-throughput,
  low-latency services supporting payment authorization,
  transaction processing, tokenization, refunds, fraud checks,
  and settlement workflows.

  ·       Experience with performance engineering, load
  testing, and capacity planning for mission-critical payment
  services, particularly during peak sales events and seasonal
  trading periods.

  ·       Experience designing graceful degradation and
  fallback mechanisms that help sustain payment processing
  continuity during third-party provider outages or downstream
  system disruptions.

  ·       Strong observability and operational excellence
  practices, including monitoring, distributed tracing,
  alerting, log analysis, and root-cause analysis for payment
  failures, authorization latency, transaction declines,
  settlement issues, and fraud alerts.

  ·       Strong ability to mentor engineers, review payment
  integration designs, conduct code reviews, and drive sound
  technical decisions and engineering standards.

  ·       Experience using coding agents, LLMs, or AI-assisted
  engineering tools to improve software delivery, testing,
  code quality, and developer productivity.

