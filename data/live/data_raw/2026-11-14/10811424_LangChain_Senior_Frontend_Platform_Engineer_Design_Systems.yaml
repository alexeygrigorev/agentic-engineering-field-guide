description: |
  About Us

  At LangChain, our mission is to enable every company to own
  its intelligence. We believe agents will transform how
  companies operate, and we're building the foundation to make
  that future possible. Our open-source harnesses and
  LangSmith platform give developers and enterprises the
  infrastructure to run, improve, and govern agents at scale.

  We've raised $460M to date, with our most recent funding
  round valuing the company at $3B, backed by leading
  investors including Sequoia, Benchmark, IVP, and CapitalG.
  As we continue to expand our platform and tackle some of the
  hardest challenges in agent engineering, every team member
  has the opportunity to make a meaningful impact and help
  shape both our technology and the future of the industry.

  More than 7,000 organizations rely on LangSmith, from fast-
  growing startups to Fortune 500 enterprises, including
  NVIDIA, Bridgewater, LinkedIn, Workday, and Rippling. We're
  just getting started on making high-performing agents easier
  to build and manage at scale.

  About the Role:

  This role can be based remotely in the U.S. Ideally SF, NYC,
  or Boston.

  LangChain is building the infrastructure that powers the
  next generation of AI applications. Our tools are used by
  thousands of developers and teams to build, debug, and ship
  production-grade LLM-powered products.

  As our product surface area grows, so does the need for a
  cohesive, scalable, and high-quality UI foundation. That’s
  where Design Systems comes in. We’re looking for a Design
  Systems Engineer to help build, own, and evolve LangChain’s
  component library—the foundation that our frontend teams
  rely on to ship fast without sacrificing quality,
  accessibility, or consistency.

  This role sits at the intersection of Design and
  Engineering. You’ll work closely with designers, product
  engineers, and platform teams to turn design intent into
  robust, reusable components and tooling that scale across
  the product.

  You’ll have ownership, influence, and your work will be
  directly consumed across LangChain’s products.



  What You'll Do:

  - Build out LangChain’s component library
    - Design and implement reusable, composable React components
      that are flexible, accessible, and production-ready
    - Partner closely with designers to translate design systems,
      tokens, and interaction patterns into code
  - Build reliable UI quality systems
    - Develop design system tooling and improve workflows around
      theming, tokens, versioning, testing, and component
      discovery (e.g. Storybook)
    - Make thoughtful architectural decisions that enable
      accessibility, performance, consistency, and
      maintainability across LangChain’s UI stack
  - Improve UI build and test workflows
    - Optimize build performance, bundling strategy, and package
      versioning for the component library
    - Maintain tooling for testing, dependency management of the
      UI app

  What You'll Bring:

  - Extensive experience building modular, composable, and well-
    documented component libraries and/or design systems
  - Deep knowledge of React, TypeScript, HTML, and CSS,
    familiarity with: styling approaches (CSS Modules, CSS-in-
    JS, Tailwind, Sass, etc.) and design system toolings
    (Storybook, Chromatic, tokens pipelines, etc.)
  - Experience collaborating closely with designers and non-
    engineering partners
  - Strong attention to detail and a high bar for craft and
    genuine passion for accessibility and inclusive design
  - Familiarity with testing UI components and visual regression
    testing

  Annual salary range: $180,000 - $240,000

  Compensation Philosophy:

  We offer competitive compensation that includes base salary,
  variable compensation for relevant roles, meaningful equity,
  benefits, and perks.

  We are hiring for this role across a range of scope, and the
  compensation band reflects that. Your offer depends on what
  we learn about your impact, craft, leadership, and
  communication during the interview process. We will tell you
  early where you’re tracking and talk comp with you before
  offer stage. Team members in the EU, UK, and APAC receive
  locally competitive benefits aligned with regional norms and
  regulations.

  Benefits

  Benefits include medical, dental, and vision coverage,
  flexible vacation, a 401(k) plan, meals on in-office days in
  the US and more.
