  Senior Backend Engineer - Fully Remote

  We are looking for an experienced Senior Backend Engineer to
  join our fast-paced, fully remote team. You will work
  directly with experienced Tech Leads to architect and build
  scalable data and cloud infrastructure for world-class
  startups.

  We recruit generalist who has extensive experience in
  backend and expertise in either

  - Data Engineering: Architect high-availability
    batch/streaming data pipelines and scalable data models.
  - DevSecOps / SRE: Architect secure, scalable cloud
    infrastructure (IaC). Own and optimize CI/CD, monitoring,
    and alerting.

  Requirements

  3-8+ years in a Backend, Data, DevOps or SRE role.

  - Proficient in TypeScript/Node.js and Python
  - Extensive experience with a major cloud provider (AWS, GCP,
    or Azure).
  - Production-level experience with Docker, CI/CD, and
    SQL/NoSQL databases.
  - High autonomy: Proven ability to take full ownership in a
    fully remote environment.

  Strongly Preferred (Bonus Points)

  - Experience with Apache Kafka (especially Confluent Cloud).
  - Deep expertise with IaC tools (Terraform, Pulumi) and
    DevSecOps workflow
  - Advanced knowledge of Kubernetes (K8s).
  - Experience building infrastructure for MLOps / AI Evals
    pipelines
