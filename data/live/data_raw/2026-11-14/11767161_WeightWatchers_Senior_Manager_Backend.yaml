  RECRUITMENT SECURITY & FRAUD PREVENTION

  At WeightWatchers, we prioritize the security of our
  candidates. To ensure you are communicating with a
  legitimate representative of our team, please keep the
  following security standards in mind:

  - Verified Email Domain: All official correspondence from our
    recruiting team will originate from an @ww.com email
    address.
  - Live Engagement: Our hiring process requires live
    interaction. We do not conduct interviews or extend
    employment offers solely through text message, chat apps,
    or automated email-only exchanges.
  - Financial Integrity: WeightWatchers will never ask for any
    form of payment from a candidate. We will never send you a
    check with instructions to purchase equipment or "start-up
    kits" on our behalf.
  - Secure Data Collection: Sensitive personal information (such
    as banking or identity tax info) is only requested through
    our official, secure onboarding portal after a formal
    offer has been extended, never during the interview phase.

  Stay Vigilant: If you are contacted by someone claiming to
  represent WeightWatchers and the process deviates from these
  standards, please do not share any personal information. You
  can verify any open position by visiting our official
  careers page at https://job-boards.greenhouse.io/ww
