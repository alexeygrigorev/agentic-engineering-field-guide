description: |
  About N1:

  N1 is the first hyper-performant and horizontally scalable
  blockchain network designed to enable trustless computing at
  internet scale.

  N1 is comprised of a team spanning backgrounds from Harvard,
  CMU, DFINITY, VMWare, Galaxy Digital, and more, and is
  backed by top-tier institutions like Founders Fund, Kraken
  Ventures, SALT, Amber Group, and more.

  Position Overview: We’re looking for a sharp, design-minded
  frontend engineer to take ownership of crafting delightful,
  high-performance user experiences across our web interfaces.
  You’ll be joining a fast-moving team building blockchain
  products and your work will directly impact how users
  interact with our technology. This role is ideal for someone
  who’s scrappy, product-obsessed, and has strong visual
  instincts for design.

  Requirements:

  - Strong frontend development experience with modern web
    stacks (React, TypeScript, Next.js)
  - An exceptional eye for design—whether self-taught or shaped
    by experience working closely with great designers
  - A portfolio, GitHub, or personal side projects that
    demonstrates your taste and execution
  - Experience in fast-paced engineering environments (startups,
    top tech companies, etc.)
  - Familiarity with design systems, component libraries, and
    user flows
  - Scrappy, product-driven mindset—you’re excited to wear
    multiple hats and ship fast
  - Interest or experience in crypto/web3/blockchain is a plus

  The base salary range for this full-time position is $100K-
  $180K. The range displayed on each job posting reflects the
  minimum and typical maximum target for new hire salaries for
  the position of a candidate based in New York at any level.
  We do hire exceptionally talented professionals with decades
  of experience in their field. As such, our range may be
  higher than what is displayed. Our base salary ranges are
  determined by experience and location, and we hire at all
  levels for multiple roles. Within the range, individual pay
  is determined by work location, job-related skills
  demonstrated during the interviews, working experience, and
  relevant education or training. Please note that the
  compensation details listed in role postings reflect the
  base salary only and do not include equity, tokens, or
  benefits.
