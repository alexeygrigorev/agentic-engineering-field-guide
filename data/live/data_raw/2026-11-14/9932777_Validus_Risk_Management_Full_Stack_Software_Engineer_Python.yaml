description: |
  We are looking for a Python Software Engineer to join our
  Client Success Team.

  The vision of the Client Success Team is to establish a
  proactive, client-aligned feedback loop that accelerates
  high-impact feature delivery for the Validus Horizon
  platform. By doing so, the team enhances internal efficiency
  and delivers greater external client value. This positions
  the Client Success Team not just as a support function, but
  as a strategic driver of product evolution, revenue
  enablement, and client engagement.

  As a Senior Developer within this team, you will take
  ownership of small-to-medium scope enhancements from idea to
  production, driving measurable business impact. You will
  work cross-functionally with business leads, tech teams, and
  clients to translate complex financial and operational
  requirements into robust, scalable solutions. You will also
  play a leadership role within CST initiatives, ensuring
  delivery of results, high accountability, and technical
  quality.

  Key Responsibilities:

  - Lead the end-to-end delivery of high-impact features and
    enhancements for Validus Horizon, from technical design
    through deployment and post-release feedback.
  - Own multiple concurrent CST initiatives, ensuring timely
    execution with clear stakeholder communication and
    transparency.
  - Design and implement full stack solutions (backend services,
    APIs, data pipelines, and frontend components) aligned
    with Horizon architecture and best practices.
  - Build and maintain robust ETL processes (data ingestion,
    validation, transformation, reporting, SFTP/API
    integrations) to enhance data availability, and client
    workflows.
  - Collaborate closely with business stakeholders to refine
    requirements, define acceptance criteria, and quantify
    business value.
  - Contribute to technical scoping and effort estimation as
    part of the CST ranking and prioritisation process.
  - Improve system performance, reliability, and scalability
    across Horizon components (e.g., RiskView, TradeView,
    PortfolioView).
  - Act as a technical mentor within the CST, promoting high
    standards in code quality, documentation, testing, and
    delivery.
  - Support stakeholder and client meetings by presenting
    technical solutions, trade-offs, and implementation
    roadmaps.

  Requirements

  - 3–5 years of professional software development experience.
  - Strong academic background in a quantitative discipline
    (Mathematics, Physics, Financial Engineering, Computer
    Science, etc.).
  - Strong experience in Python or a similar backend language
    used for data processing and financial applications.
  - Full stack development experience (backend services, APIs,
    databases, and modern frontend frameworks).
  - Experience designing and maintaining data pipelines and
    integrations (APIs, SFTP, structured market/portfolio
    datasets).
  - Proven ability to lead small-to-medium scale projects with
    high accountability and ownership.
  - Strong interest in financial markets, with exposure to FX
    and interest rate products.
  - Ability to communicate complex technical and financial
    concepts clearly to both technical and non-technical
    stakeholders.
  - Strong attention to detail, prioritisation skills, and
    ability to manage multiple parallel initiatives.

  Preferred Qualifications:

  - Experience working with financial risk management software
    or platforms.
  - Experience in market data integration, trade lifecycle
    systems, or portfolio analytics.
  - MSc degree in a STEM field.
  - Understanding of risk modelling, pricing, or financial
    analytics concepts.
  - Experience working in client-facing or consultative
    technology roles.

  Benefits

  Validus Risk Management is an independent technology-enabled
  advisory firm specialising in the management of FX, interest
  rate and other market risks. We work with institutional
  investors, fund managers, and portfolio companies to design
  and implement strategies to measure, manage and monitor
  financial market risk, using a market-tested combination of
  specialist consulting services, trade execution and
  innovative risk technology.

  Working at Validus can offer an exciting opportunity for
  both personal development and professional growth. Share in
  our mission to become the largest and most respected
  specialist provider of financial market risk services in the
  world. Notable benefits include a competitive remuneration
  package (salary + bonus), health care, retirement plans, and
  financial support towards professional qualifications.

  Our Core Values

  - Accountability – Getting it done and owning the result.
  - Teamwork – We succeed by helping others succeed.
  - Integrity – We serve our clients; the responsibility is
    sacrosanct.
  - Diversity – Diversity boosts creativity – creativity is our
    edge.
  - Kaizen – Strive to do things better. Innovation kills
    complacency.

  Validus is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
