description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About the Team

  Every time a fan places a bet, earns a reward, or checks out
  on Fanatics — Fanatics Core made that possible. We build the
  shared foundations — identity, payments, loyalty, wallet,
  data, and platform — that power sports betting, ecommerce,
  collectibles, and beyond. We supercharge the business by
  providing products and capabilities so that teams can focus
  on what matters most: building delightful experiences for
  the fans.

  Fanatics is uniquely positioned at the intersection of
  sports commerce, betting, and collectibles, and Fanatics ONE
  is the loyalty and identity program that ties it all
  together.

  Overview

  As a Senior Software Engineer at Fanatics, you will design,
  build, and operate the platforms and services that power the
  Fan Ecosystem — the systems that connect fans to every
  Fanatics product and experience. You will own significant
  technical surface area end to end, set the technical
  direction for projects that span multiple services and
  teams, and raise the engineering bar for those around you
  through mentorship, design leadership, and hands-on
  delivery.

  This is a hands-on, full-stack role with a backend center of
  gravity. The majority of your work will be building high-
  throughput, high-availability services in Go, with
  meaningful contributions to the TypeScript/React front ends
  those services support.

  Responsibilities

  - Design, build, test, document, and operate high-quality,
    production-grade software with a focus on Go services and
    APIs
  - Own the technical design of medium-to-large features and
    systems: define the approach, weigh trade-offs, document
    decisions, and drive them to completion
  - Break down ambiguous problems into well-scoped, deliverable
    work for yourself and other engineers on the team
  - Lead and participate in design and architecture reviews;
    provide clear, constructive feedback that improves both
    the design and the designer
  - Set the standard in code reviews — for correctness,
    readability, testability, and operational safety
  - Mentor and grow engineers on the team; onboard new hires and
    act as a technical point of contact for your systems
  - Participate in and improve the on-call rotation: instrument
    your services, drive incident response, and lead blameless
    postmortems that result in real fixes
  - Improve reliability, performance, and cost of the systems
    you own; define and act on SLOs and operational excellence
    metrics
  - Identify and pay down technical debt, and make the case for
    the investments worth making
  - Partner closely with product managers, designers, and
    stakeholders to shape the roadmap and make technology
    decisions that grow the business
  - Influence and help define the principles, guidelines, and
    best practices of our engineering strategy — then hold the
    team to them
  - Develop deep understanding of our industry, product, feature
    set, and roadmap, and use it to make better technical
    decisions

  Required Qualifications

  - 5+ years of professional software engineering experience
    building and operating production systems
  - Strong, demonstrated proficiency in Go (Golang) — required.
    You have built and shipped production services in Go and
    can speak to concurrency patterns, error handling,
    testing, profiling, and performance tuning in the language
  - Proven experience designing, building, and scaling backend
    services and APIs (REST and/or gRPC) in a distributed,
    microservices environment
  - Demonstrated proficiency in JavaScript or TypeScript, and
    experience with React or another modern front-end
    framework
  - Solid grounding in data stores and messaging: relational
    and/or NoSQL databases, caching, and event streaming (e.g.
    Kafka, SQS/SNS)
  - Experience with cloud infrastructure (AWS, GCP, or Azure),
    containers, CI/CD, and infrastructure-as-code
  - Strong operational instincts: observability, monitoring,
    alerting, debugging production issues under pressure
  - Track record of leading projects with multiple contributors
    and delivering them on time without sacrificing quality
  - Familiar with Agile software product delivery and SCRUM
    methodology
  - Able to effectively work cross-functionally within an
    enterprise environment

  Preferred Qualifications

  - Experience building or integrating with identity and access
    management systems — authentication, authorization, SSO,
    and account lifecycle
  - Hands-on familiarity with identity standards and protocols:
    OAuth 2.0, OpenID Connect, SAML, JWT, MFA, session and
    token lifecycle management
  - Experience with identity providers and CIAM platforms (e.g.
    Okta, Auth0, ForgeRock, AWS Cognito, Ping) or with
    building an in-house identity platform
  - Experience with account security, fraud prevention, PII
    handling, or regulatory/compliance-driven engineering
    (KYC, GDPR, CCPA)
  - Experience designing systems that serve high-traffic,
    consumer-facing products with spiky, event-driven load
  - Experience with platform or shared-services work where your
    consumers are other engineering teams
  - Experience working in a start-up environment
  - Experience in sports, commerce, media, or another consumer-
    scale domain

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connection and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

  For information about our benefits, please visit
  https://benefitsatfanatics.com/

