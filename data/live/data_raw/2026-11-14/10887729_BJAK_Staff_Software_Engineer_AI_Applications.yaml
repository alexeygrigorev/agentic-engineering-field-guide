description: |
  About Act

  There are over 5 billion users using basic applications
  today such email, notes, tasks, calendar and they're not AI-
  native. Our mission is to build proactive applications for
  anyone in the world, who are not used to complex prompting.
  We aim to bring intelligence to conversations, errands,
  organising and workflows, with minimal to no prompting.

  Our first application is an agent-first mobile communication
  app. We believe building applications that users use daily
  for communication, coordination and collaboration needs will
  help integrate AI into their lives. The net effect is to
  eliminate misinformation, achieve low coordination costs,
  enable high quality tasks and collaboration at scale with
  minimal or little prompting.



  Role

  - Lead application architecture and engineering across
    backend, mobile and desktop platforms
  - Design systems for AI-powered workflows, including
    orchestration, state management, retries and failure
    recovery
  - Build and review backend services, APIs and integrations
    that connect AI systems with product features
  - Make technical decisions on system design, performance,
    reliability, security and infrastructure
  - Lead a small team of senior engineers through technical
    design, code reviews and engineering guidance
  - Work with ML and product teams to integrate AI capabilities
    into production applications
  - Improve system performance, monitoring, testing and
    production reliability



  Requirements

  - 8+ years of software engineering experience, including
    technical leadership of production applications
  - Strong backend engineering expertise, including APIs,
    databases, distributed systems and cloud infrastructure
  - Experience designing and scaling systems across multiple
    services or application platforms
  - Hands-on experience integrating LLMs or AI-powered features
    into production applications
  - Ability to make architecture decisions, review code and
    resolve difficult engineering problems
  - Experience leading senior engineers through technical
    design, code reviews and mentorship
  - Strong understanding of system performance, concurrency,
    reliability and production monitoring



  Nice to Have

  - Experience building AI agents, orchestration systems or
    multi-step workflows
  - Experience developing applications across web, mobile and
    desktop platforms
  - Experience with messaging, email, collaboration or
    productivity applications
  - Experience leading engineering teams in early-stage
    technology companies
