description: |
  Snap Inc is a technology company. We believe the camera
  presents the greatest opportunity to improve the way people
  live and communicate. Snap contributes to human progress by
  empowering people to express themselves, live in the moment,
  learn about the world, and have fun together.

  The Company operates Snapchat, a visual messaging app that
  enhances your relationships with friends, family, and the
  world, and Specs Inc., a wholly-owned subsidiary dedicated
  to making computing more human, in addition to Bitmoji,
  Saturn, and other digital services.

  We’re looking for a Staff Software Engineer to join the Ad
  Signals and Measurement team at Snap. Signals and
  measurement team’s mission is to power Snap’s monetization
  ecosystem by delivering high-quality, reliable, and privacy-
  safe signals that enable smarter decision-making and
  measurable advertiser success. We steward the full lifecycle
  of third-party signals, from ingestion and matching to
  activation across downstream systems, ensuring integrity,
  scalability, and compliance at every step. In parallel, we
  build industry-leading measurement solutions that provide
  clear, actionable insights into advertiser ROI, empowering
  partners to understand the true value of their investment on
  Snapchat. What you’ll do:

  - Build the next generation of signals and measurement systems
    for Snap’s ad platform
  - Work end-to-end across stack innovating on novel product or
    infrastructure ideas experimentation, analysis and
    optimization
  - Work across teams to understand product requirements,
    evaluate trade-offs, and deliver the solutions needed to
    build innovative products or services
  - Work with cross-functional partners and advertisers to
    ensure 3p signals are fully utilized in delivering ROI,
    and help measure the impact
  - Advocate for and apply best practices when it comes to
    availability, scalability, operational excellence, and
    cost management
  - Provide technical direction that influences the entire
    company
  - Work across teams to understand product requirements,
    evaluate trade-offs, and deliver the solutions needed to
    support Snap’s performance advertising suite
  - Technical influence that spans the entire company
  - Utilize AI tools and high velocity engineering workflows to
    design and ship scalable services while upholding rigorous
    standards for code correctness, security, and production
    ready quality code

  Knowledge, Skills & Abilities:

  - Excellent programming and software design skills, including
    debugging, performance analysis, and test design
  - Proven track record of operating highly-available systems at
    scale
  - Ability to proactively learn new concepts and technology and
    apply them at work
  - Skilled at solving ambiguous problems
  - Strong collaboration and mentorship skills
  - Ads domain expertise and a strong interest in Ads
  - Adaptability in learning and applying evolving AI systems
    and tools to remain at the forefront of engineering trends
    and modern development practices

  Minimum Qualifications:

  - Bachelor’s degree in a technical field such as Computer
    Science or equivalent practical experience
  - 9+ years of software development experience; or Master’s
    degree with 8+ years of experience; or PhD with 5+ years
    of experience
  - Experience as a technical lead, domain expert or owner of
    complex technical initiatives

  Preferred Qualifications:

  - Deep subject matter expertise in advertising technology,
    specifically focusing on signal ingestion, identity
    matching, and measurement frameworks
  - Experience in building high-available and high-throughput
    and low-latency data pipelines
  - Experience collaborating closely with machine learning teams
  - Experience with backend services or distributed systems

  If you have a disability or special need that requires
  accommodation, please provide us some information.

