  Compensation

  In the United States, work locations are assigned a pay zone
  which determines the salary range for the position. The
  successful candidate’s starting pay will be determined based
  on job-related skills, experience, qualifications, work
  location, and market conditions. The starting pay may be
  negotiable within the salary range for the position. These
  pay zones may be modified in the future.

  Zone A (CA, WA, NYC):

  The base salary range for this position is $229,000-$343,000
  annually.



  Zone B:

  The base salary range for this position is $218,000-$326,000
  annually.

  Zone C:

  The base salary range for this position is $195,000-$292,000
  annually.

  This position is eligible for equity in the form of RSUs.

