description: |
  Discover your future at Citi

  Working at Citi is far more than just a job. A career with
  us means joining a team of more than 230,000 dedicated
  people from around the globe. At Citi, you’ll have the
  opportunity to grow your career, give back to your community
  and make a real impact.

  Job Overview

  Engineer the future of global finance. At Citi, our Tech
  team doesn’t just support finance – we are helping to
  redefine it. Every day, $5 trillion crosses through our
  network. We do business in 180+ countries operating at a
  scale few can match. From deploying advanced AI to helping
  shape global markets, we build systems that matter. Look to
  join a team where your work helps influence economies, your
  ideas can drive innovation and outcomes, and your growth is
  backed by mentorship, continuous learning and flexibility
  with potential hybrid work opportunities. Help solve real-
  world challenges that touch millions and get the opportunity
  to build the future of finance with Citi Tech.

  Citi's Equities Technology organization is seeking a Lead
  Software Engineer to join the Equities Electronic- Execution
  (Electronic Trading) technology team. The person in this
  role will be responsible for the design, development, and
  delivery of Citi's next-generation low-latency execution
  platform. This platform encompasses critical components
  including Algorithmic Trading, Smart Order Routing (SOR),
  Dark Pool & Internalization engines, Low latency Client &
  Exchange Connectivity, and high-throughput market data
  processing.

  In this role, you will collaborate with a cross-functional
  team of developers and work closely with product
  development, quantitative research, technology
  infrastructure, production support and QA teams. Close
  alignment with the global strategy and cross-regional
  delivery is a key aspect of this role.

  Responsibilities

  - Core Development: Design, development and maintenance of
    high-performance, low-latency electronic execution systems
  - Product Collaboration: Partner with traders, quant
    researchers, and clients to understand their needs and
    translate them into innovative product features and
    enhancements — including execution performance
    improvements, new liquidity sources, and DMA capabilities.
  - Testing: Continuously improve and maintain testing
    frameworks, development tools, and environments to ensure
    platform reliability and performance at scale.
  - AI-Powered SDLC: Leverage Citi's suite of AI-powered
    development tools throughout the Software Development Life
    Cycle (SDLC) to enhance productivity, code quality, and
    innovation.
  - Agile & CI/CD: Contribute to and champion Agile development
    practices and Continuous Integration/Continuous Delivery
    (CI/CD) processes with a focus on shift-left testing and
    accelerated release cycles.
  - Platform Support & Enhancement: Build and maintain common
    solutions for trading platform monitoring, trade
    reconciliation, application recovery, and other essential
    support functions.

  Qualifications

  - Strong technical knowledge and expertise in Low latency Java
    and Rust.
  - Prior experience in developing electronic trading platforms
    in a global financial institution or equivalent
    environment.
  - Strong understanding of automated testing techniques and
    quality engineering practices.
  - Solid understanding of Agile methodologies and Continuous
    Integration processes.
  - Familiarity with low-latency system design, including
    performance optimization, concurrency, and high-throughput
    architecture.
  - Ability to prioritize multiple tasks, set goals, and meet
    deadlines in a fast-paced, globally distributed
    environment.
  - Excellent communication skills with a demonstrable ability
    to present and grasp complex concepts in a multicultural,
    cross-regional environment.
  - Knowledge of regional exchange microstructure and regulatory
    regimes.
  - Knowledge of C++ would be an advantage
  - Prior experience in managing small teams is a plus.

  Education

  - Bachelor's degree / University degree in Computer Science,
    Engineering, or a related field, or equivalent
    professional experience.

  What we’ll provide you

  By joining Citi, you will not only be part of a business
  casual workplace with a hybrid working model (up to 2 days
  working at home per week), but also receive a competitive
  base salary (which is annually reviewed), and enjoy a whole
  host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources

  Visit our Global Benefits page to learn more.

  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

