description: |
  We're Scan.com. We're building America's national imaging
  network: the infrastructure that connects patients,
  providers, and payers to faster, better-value diagnostic
  imaging. Thousands of patients move through our platform
  every day, and each is a real person waiting for an answer
  to a healthcare concern. We exist to get them that answer
  faster.

  We manage the medical imaging pathway end-to-end. Providers
  order through a single point of entry, and from there, we
  run the entire medical diagnostic pathway. Managing the full
  pathway, rather than brokering pieces of it, is what lets us
  deliver imaging faster, at higher quality, and at a lower
  cost than the fragmented status quo.

  We're looking for a Software Engineer, Integrations, at an
  exciting time. We've raised over $200m in funding to date,
  reached profitability, and are growing 100% year on year.

  Millions of people wait too long for a diagnosis. Come help
  us fix that.

  WHAT YOU WILL BE GETTING INVOLVED IN

  Scan.com's integration layer is mission-critical
  infrastructure. We interface with hundreds of imaging
  centers and health systems operating disparate, often
  decades-old systems — RIS platforms built on legacy
  protocols, HL7 v2 feeds with idiosyncratic vendor dialects,
  and hardware gateways running in constrained clinical
  environments. On the demand side, we connect to modern EHR
  APIs, third-party referral networks, and portal integrations
  that must work reliably at scale.

  As a Software Engineer, Integrations, you will architect and
  build the systems that make the demand-side connections
  robust, observable, and extensible. This problem area
  requires genuine passion for system integration patterns,
  message transformation pipelines, and the operational
  discipline to maintain high-reliability infrastructure in
  the face of real-world entropy.

  As a scale-up business, you can expect your role to develop
  over time. Here are some of the types of things you could be
  getting involved in:

  - Build and maintain integration connectors for modern and
    legacy EHR systems to retrieve physician referrals and
    relevant patient documentation.
  - Architect a fault-tolerant message queuing and delivery
    infrastructure for inbound and outbound HL7 and API
    traffic.
  - Build and maintain REST API integrations with third-party
    referral sources, attorney platforms, and demand
    aggregators.
  - Own the observability layer for the integration
    infrastructure: structured logging, alerting on message
    processing latency/failures, and dashboards that surface
    issues before they reach the operations teams.

  THE TOP 5 THINGS WE WANT YOU TO ACHIEVE IN YOUR FIRST YEAR

  - Deep domain ownership. Within 90 days, you have a complete
    mental model of our integration workflows — every active
    connector, its transport mechanism, its failure modes, and
    its monitoring coverage.
  - Resilience uplift. You have identified and remediated the
    most critical reliability gaps in our referral pipeline.
    There is a measurable reduction in integration-related
    operational escalations.
  - Scalable transformation architecture. You have designed or
    materially evolved our data workflows such that onboarding
    a new demand-side source is a simple choice from a menu of
    robust technical options.
  - Observability in production. Every integration has
    structured alerting and a clear SLA. The operations team
    can self-serve integration health for routine issues
    without engineering involvement.
  - Shipped meaningful capability. At least two significant
    referral integration improvements. This can be new
    connectors that significantly increase referral volume,
    automations that improve quality, or infrastructure
    improvements. These improvements are live in production
    and have measurably increased referral volume, improved
    connection optionality, operational efficiency, and
    reduced error rates.

  WHAT YOU MIGHT BRING TO THE TABLE

  You don't need to tick all the boxes to apply for this role.
  Whether it's your first role or your fifth, we believe
  everyone can add value, learn, and grow. However, these
  might be some of the ways you are currently adding value:

  - Proven ability to integrate with legacy systems that were
    not designed for modern interoperability. For example,
    aging RIS platforms in radiology, core banking systems in
    fintech, or equivalent legacy infrastructure in another
    vertical. The underlying pattern of bridging old and new
    matters more than the specific domain.
  - Proficiency in at least one backend language used in high-
    reliability integration contexts (Python, Ruby, Java, C#
    are all relevant; language is less important than
    architectural rigor).
  - Familiarity with RESTful API integration patterns, including
    schema versioning, backward compatibility, and API
    contract management
  - Strong operational instincts: you instrument what you build,
    you think about failure modes before they happen, and you
    treat on-call escalations as a signal about systemic gaps
  - Bias for innovation: You care about questioning the ‘why’
    behind every system, and have a strong desire to build the
    next generation of products you work on.
  - Experience in healthcare is a plus, but not required. We
    care far more about your engineering depth and API design
    fluency than your industry background

  OUR VALUES

  Always Play Offense

  If we're not growing, we're dying. Everyone needs a bias for
  action. Speed and momentum, combined with quality execution,
  propel our business forward.

  - You don't quit on hard problems. Fail fast, dust off, go
    again.
  - You celebrate wins, then seek the next opportunity.
  - You see it, you fix it. No task is beneath you, at any
    level.

  Build with the Best

  The company we build is the team we build. If we don't have
  the right people in the right seats, doing the right things,
  we will fail.

  - Talent recognizes talent. You actively bring quality hires
    into the business.
  - You trust your colleagues to deliver.
  - You open-source your knowledge. You're never a single point
    of failure.

  Care Deeply, Challenge Directly

  Care enough to have the hard conversations, and don't dwell
  on them. Don't go up the chain to communicate. Go straight
  to the person.

  - Strong opinions, weakly held. You welcome challenge and
    feedback.
  - You get to the point: direct challenge plus an alternative
    solution.
  - You ask "why". Before calling something bad, understand why
    it exists.

  Embrace Growth, Be Curious

  Push the limits of your understanding and potential and you
  will be supported to get better.

  - You proactively seek feedback, whatever your level.
  - You invest in understanding our business: teams, customers,
    processes.
  - You invest in your own growth and are willing to unlearn.

  We're a high-performing team with low ego. We hire people
  who are brilliant and kind, who give it straight, back it up
  with evidence, and change their mind when the facts change.
  We'll give you real ownership early, the tools to do the
  best work of your career, and colleagues who raise your
  game. In return, we ask for high standards, genuine care for
  patients and each other, and the drive to leave things
  better than you found them. If that sounds like you, let’s
  talk!

  HOW WE WILL INTERVIEW YOU

  We keep our interview process short and sweet, and we're a
  nimble team that can progress at pace. Here are the stages
  you can expect, but we might switch up the order of each
  step depending on team availability:

  - Introductory call/interview with our Senior Talent Partner.
    The call is via telephone and will last around 30 minutes.
  - Should it feel like there is an initial fit for all, we will
    invite you to a video call with the hiring manager for
    around 45 minutes. This is a more structured interview
    that will deep-dive into the role and technical needs.
  - 'Scan Standard' interview, where our panel screens for
    values alignment and the success factors that matter at
    Scan.com. You will also be assessed on your AI fluency at
    the stage and depth relevant to your role (see AI
    Requirements above).
  - Meet the founders and/or other team members. Again, length
    varies depending on how many people and whether in person
    or via video call.
  - Offer!

  WHAT WE OFFER

  We go beyond the basics with our benefits package. We
  believe great work starts with supporting our people. Here's
  what you can expect from us:

  - Salary range of $180,000 - $200,000
  - Flexible remote or hybrid work options
  - Dedicated personal development budget
  - Medical, vision, and dental coverage
  - 28+ days of paid time off across PTO and wellbeing days, so
    you can show up at your best
  - Paid parental leave
  - 401k retirement plan
  - All the equipment you need to do your best work
  - Inclusive, people-first policies designed by our team, for
    our team

  DIVERSITY AT SCAN.COM

  Scan.com is committed to eliminating discrimination and
  encouraging diversity within our team. We strive to provide
  equality and fairness for all job applicants and employees
  and never discriminate on the basis of gender, marital
  status, age, race, ethnicity, religion, or physical
  differences.

  We are opposed to all forms of unlawful treatment and
  discrimination.

  Our ambition is for our team to be representative of
  society's diversity, and for every employee to feel
  respected and able to bring their best selves to work.

  If you need an accommodation to apply or interview, contact
  us at people@scan.com.

  We look forward to receiving your application!
