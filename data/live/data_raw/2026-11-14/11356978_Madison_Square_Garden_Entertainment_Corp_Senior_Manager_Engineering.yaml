description: |
  Madison Square Garden Entertainment Corp. (MSG
  Entertainment) is a leader in live entertainment, delivering
  unforgettable experiences while forging deep connections
  with diverse and passionate audiences. The Company’s
  portfolio includes a collection of world-renowned venues –
  New York’s Madison Square Garden, Infosys Theater at Madison
  Square Garden, Radio City Music Hall, and Beacon Theatre;
  and The Chicago Theatre – that showcase a broad array of
  sporting events, concerts, family shows, and special events
  for millions of guests annually. In addition, the Company
  features the original production, the Christmas Spectacular
  Starring the Radio City Rockettes, which has been a holiday
  tradition for more than 90 years. More information is
  available at www.msgentertainment.com.

  Who are we hiring?

  This position helps with overseeing the engineering
  department, assuring the necessary preventive maintenance of
  all mechanical, plumbing, refrigeration, and life safety
  systems to provide a safe and comfortable environment for
  employees and guests. The Senior Manager, Engineering will
  be one of the key management contacts in the engineering
  department during events and will play a critical role
  directing union staff for all emergencies and/or unforeseen
  critical situations during these event times. This position
  will schedule and oversee project & emergency work within
  the Engineering Department. The Engineering department
  operates 24/7, comprised of three shifts a day.

  What will you do?

  - Manage the implementation and ongoing administration of the
    preventive maintenance system (CAFM) for the department.
    Maintain equipment records, spare parts inventories,
    maintenance procedures, shop drawings, O&M manuals, and
    related documentation to support an effective preventive
    maintenance program.
  - Supervise, coach, and develop Engineering team members at
    Madison Square Garden and the Beacon Theatre. Support
    hiring, onboarding, training, and performance management
    while ensuring compliance with departmental policies, work
    rules, and applicable labor agreements.
  - Maintain a safe, clean, and comfortable environment for
    employees, guests, and visitors by ensuring the reliable
    operation of building systems and responding promptly to
    operational needs.
  - Ensure day-to-day compliance with applicable city, state,
    federal, fire, building, and safety codes, regulations,
    and company policies.
  - Oversee the union staff to assure all mechanical systems are
    maintained as well as proper planning for preventative
    maintenance and repairs for HVAC Systems (chillers,
    cooling towers, heat exchangers, pumps, variable frequency
    drives, water treatment systems, controls & automation)
    plumbing, refrigeration, building mechanical systems and
    fire protection/fire safety systems (including smoke
    control, pressurization & purge systems).
  - Coordinate and deliver training to Engineering staff to
    ensure the safe and effective operation, maintenance, and
    troubleshooting of facility equipment and systems.
  - Oversee the operation, maintenance, and repair of water
    supply and waste systems, including domestic hot and cold
    water, chilled water, heating water, condenser water, and
    brine systems.
  - Manage the operation, inspection, testing, and maintenance
    of fire life safety systems, including fire alarm systems,
    fire pumps, sprinklers, standpipes, kitchen hood
    suppression systems, smoke control systems, purge fans,
    dampers, and associated equipment.
  - Help plan and coordinate the maintenance of the hockey ice
    plant and all associated equipment and systems (Including
    Cooling towers, VFD’s, Heat Exchangers etc.); track and
    manage in game ice conditions assuring full compliance
    with NHL specifications and procedures for ice maintenance
  - Oversee the operation and maintenance of heating,
    ventilation, and air conditioning (HVAC) systems,
    including steam supply, hot water systems, packaged air
    conditioning units, and cooling towers.
  - Partner with leadership and Capital Projects team to support
    facility infrastructure projects by providing operational
    expertise, coordinating departmental resources, and
    ensuring successful implementation with minimal
    operational disruption.
  - Manage the maintenance and repair of food and beverage
    refrigeration equipment, including walk-in refrigerators
    and freezers, under-counter and upright refrigeration
    units, and ice machines.
  - Oversee the maintenance and reliability of supplemental HVAC
    systems supporting critical IT and telecommunications
    rooms to ensure continuous operation.
  - Provide exceptional experiences for our guests, partners,
    and team members, including by adhering to our appearance
    and presentation guidelines while on-site.

  What do you need to succeed?

  - 7-10 years of experience as a building manager or engineer -
    operation and maintenance of large complex facility or
    arena/entertainment/theatrical building required
  - Must have a strong technical background
  - Engineering degree is strongly preferred
  - Familiarity with NYC Building and Fire codes
  - Ability to directly manage a staff of union mechanics, and
    operating engineers
  - Must hold a valid NYC Refrigeration Operators Certificate or
    qualification to obtain year 1
  - Must hold a valid NYC Fire Safety Directors Certificate or
    obtain certificate within one year of employment.
  - Must hold a valid NYC Sprinkler/Standpipe Certificate or
    qualification to obtain year 1
  - Ability to read technical drawings
  - Should hold OSHA & Hazmat Certifications
  - Familiarity with operation & Maintenance of all ice making
    equipment (Zamboni, chillers, ice edger)

  Special Requirements

  - Lifting 25 lbs., standing for long periods and walking long
    distances.
  - Ability to work a flexible schedule including nights,
    weekends, holiday, and split days off; willing to travel
    to other venues as needed.

  Pay Range

  $96,000—$155,000 USD

  At MSG, we recognize the importance of upskilling employees’
  talents and strengths so they can drive their careers
  forward. We are proud to offer a robust set of tools and
  resources to help employees understand their interests and
  purpose, harness their talents and obtain the skills they
  need to reach the next step in their careers. Growth and
  longevity for our employees are top priorities here.

