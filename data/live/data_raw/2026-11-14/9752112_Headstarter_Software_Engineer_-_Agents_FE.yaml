description: |
  About this Role

  As founding engineer at Headstarter, you are a full-stack
  generalist, meaning you’ll get a chance to work across the
  entire stack (frontend, backend, AI infrastructure, classic
  ML, devops). Given the compound nature of our product, we
  also tend to form short-lived teams around specific
  projects.

  About Headstarter

  Nearly all software engineering jobs will be impacted by AI
  during our lifetimes. At the same time, being able to speak,
  sell and code brilliantly is quickly becoming a must-have
  for employers.There has never been a better time to disrupt
  cs education from its core.

  At Headstarter, we are building the “one-stop shop”
  ecosystem to boost every aspect of broken, archaic CS
  programs globally — cataloging top CS projects,
  leaning/upskilling new technologies, job/internship
  guarantees, interview preparation, industry mentors, team
  projects, networking, resume experience, support/debug,
  structure/environment, accountability — just to name a few.
  We are starting with an “accelerator” that spans 4-months
  and an AI recruiter that is working for over 30 startups
  hire for 100+ engineering roles.

  Ultimately, our mission is to give future tech leaders
  direction, standardization, consistency and transparency.

  We’re a lean, aggressive team of founders set on building a
  new generational incumbent in learning and recruiting. We’ve
  raised substantial funding from the best investors in our
  field such as the first software engineer at Applovin who
  worked there for 13 years (fastest growing public stock this
  year: 10x’d).

  About the Team

  Headstarter was founded by Yasin Ehsan and Faizan Ahmed—
  Capital One/6x overall hackathon winner and Amazon/published
  ML paper at age 19— alongside advisors like founders of
  Duolingo, Foursquare, CS 50 (David Malan) etc

  We are nearing product-market fit and are building out our
  founding team very quickly. Reasons to join:

  - We have incredible market pull with summer fellowship “test”
    getting 60,000 applications from 135 countries in 5-weeks
  - We’re solving a difficult technical and “human” problem,
    which unlocks a massive market opportunity and enormous
    impact once solved
  - You’ll get to define the future of the company from the
    ground floor, alongside a world-class team
  - We work hybrid with offices in NYC/SF, but we hire from
    anywhere. We’ll pay to relocate you

  Role responsibilities

  - Outlining the 0-to-1 of project requirements, goals, and
    roadmaps from customer problems
  - Wrangling a wide variety of cutting-edge agentic AI
    infrastructure
  - Leading end-to-end implementation to deliver fast, high-
    quality iterations to customers

  Nice to Haves

  - Competing offers at other startups or 1-3 years experience
    working at startups full-time
  - Shipping a product to production gaining quick traction i.e
    $1000 dollars or 1000 users in 7 days
  - Understanding of UI/UX and obsessing over details in front-
    end and human empathy
  - Interest in re-defining cs curriculum and pedagogy with
    "super network" for gen-z

  Tech stack

  TypeScript / JS, Python (optional), React (optional)

  Employee benefits

  Medical / Dental Insurance

  Interview process

  - Intro call
  - Take home git repo
  - Founder call
  - Power day
  - Investor call
