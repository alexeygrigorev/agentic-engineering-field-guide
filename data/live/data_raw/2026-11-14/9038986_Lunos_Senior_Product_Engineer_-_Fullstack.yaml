description: |
  Payments might seem slick for consumers, but $100tn of
  Global B2B commerce still runs on the manual labor of
  millions of people in finance teams around the world. It’s
  been this way forever. Despite software, APIs and new
  payment methods. That’s because it’s not a payments problem.
  It’s a communication and negotiation problem. One that
  computers couldn’t solve. Until now.

  Lunos is replacing this with a network of AI agents,
  starting with accounts receivable. We offer an AI partner
  that ensures businesses get paid by managing their
  receivables (what they are owed) just like a human would.
  Well, how they would if they worked on it 24/7, never forgot
  anything and read every message ever sent to them.

  We’re a small team with big ambitions, backed by top-tier
  VCs who were early backers of companies like Stripe and
  Airbnb. We’re building in a modern stack (TypeScript,
  Next.js, Vercel, Supabase/Postgres, Tailwind), blending
  powerful agentic AI architectures, curated LLM pipelines,
  quantitative methods and robust SaaS foundations.

  We’re looking for Senior Product Engineers who:

  - Are deeply curious and passionate about building products
    users truly love

  - Get frustrated when things don’t move fast enough

  - Want their voice to shape product decisions, tech choices,
    and company culture

  - Enjoy the freedom and challenge of working across the stack,
    from intuitive UX and robust API design to AI
    architectures and prompt engineering

  - Believe AI is fundamentally reshaping the world - and want
    to be part of it

  Sound like your kind of adventure? Let’s talk. 🚀
