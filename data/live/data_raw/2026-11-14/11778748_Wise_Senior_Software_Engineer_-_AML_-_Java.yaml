description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the AML Risk team

  Instant, low cost, and convenient are three guiding
  principles for the products Wise offers its customers. These
  same benefits can also appeal to people who seek to misuse
  financial services for money laundering and other financial
  crimes.

  IMF estimates that up to 5% of World GDP is laundered each
  year.

  The AML Risk team, within the AML Squad at Wise, builds
  systems and controls that detect money laundering and
  terrorist financing risks. Our work covers Wise’s products
  and regions.

  We use data and our knowledge of criminal activity to create
  effective detection controls and useful alerts. Criminal
  activity changes quickly. We improve our controls as new
  risks appear. We aim to detect more real risk, reduce false
  alerts, and avoid unnecessary friction for legitimate
  customers.



  What will you be working on?

  AML Squad is looking for an experienced Engineer to help
  shape how Wise detects money laundering and terrorist
  financing risk.

  You will own large, impactful projects and their technical
  roadmaps. You will work with engineers, product managers,
  data scientists, analysts, and AML subject matter experts.

  What will you be doing?



  - Design and build AML detection controls that can evolve and
    scale.
  - Own large projects, their technical roadmaps, and their
    delivery.
  - Shape product decisions and explain the customer problem and
    expected impact.
  - Improve reliability, security, and technical quality.
  - Mentor engineers and share knowledge across the team.



  The technology you’ll work with

  Our primary technology stack is Java, Spring Boot, and
  Kafka. You’ll work with distributed services, asynchronous
  processing and data at scale.

  We design for scalability, observability, privacy, security,
  reliability, and cost.

  Qualifications

  What are we looking for?

  - You are an expert in your technical discipline.
  - You understand your team’s technical and business domain.
  - You design systems with long-term change and scale in mind.
  - You mentor and coach other engineers.
  - You have 5+ years of experience building backend systems,
    distributed systems, or data-intensive systems.
  - Experience with AML or financial crime is preferred, but not
    required.
  - Experience running machine learning or large language models
    in production is preferred, but not required.



  Impact

  Your work will improve how Wise detects financial crime. You
  will help detect more real risk, reduce false alerts, and
  avoid unnecessary friction for legitimate customers.

  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
