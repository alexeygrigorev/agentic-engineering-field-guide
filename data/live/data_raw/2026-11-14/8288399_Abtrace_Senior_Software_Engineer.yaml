description: |
  Abtrace is transforming primary care by enabling proactive,
  preventative healthcare at scale. We support 500+ practices
  and 4.5M patients across the UK, helping teams identify risk
  earlier, act sooner, and deliver care efficiently - without
  extra burden.

  Our Engineering team builds robust, scalable, and high-
  impact software that drives real outcomes. As we scale,
  we're evolving our culture to move fast, raise the bar, and
  deliver at startup speed.

  The Role

  Join our fast-growing team to deliver high-quality, well-
  engineered solutions that improve patient outcomes and
  primary care efficiency. You'll work in a cross-functional
  squad, collaborating with Product, Design, and Engineering
  to ship impactful features and iterate quickly. You'll also
  help shape our culture, raise standards, and scale both our
  tech and our team.

  What You'll Do

  - Own delivery: Lead technical planning and execution,
    shipping reliable, scalable software.
  - Collaborate: Work with stakeholders to refine requirements,
    solve real problems, and communicate progress.
  - Raise the bar: Champion rigorous testing, code quality, and
    pragmatic trade-offs.
  - Drive impact: Set new standards, mentor teammates, and help
    scale our team and processes.

  What We're Looking For

  - Proven experience leading and growing engineering teams.
  - Relentless focus on product delivery and outcomes.
  - Pragmatic approach to balancing speed, quality, and
    technical debt.
  - Track record of raising standards and driving improvement.
  - Strong hands-on technical skills (Python, TypeScript, React,
    AWS, DevOps, etc.).
  - Excellent communicator, able to explain complex ideas
    simply.
  - Ownership mindset - comfortable with ambiguity and end-to-
    end responsibility.
  - Excited to work closely with Product and Design as true
    partners.
  - 3+ years' recent experience in relevant technologies.
  - Bonus: Healthcare or B2B SaaS experience.

  Who This Role Isn't For

  - Not motivated by product outcomes.
  - Prefer only early-stage or PoC work.
  - Want narrowly defined, low-ambiguity roles.
  - Not interested in leadership or raising the bar.

  Benefits

  - Private Pension
  - Share Options scheme
  - Generous sick and maternity/paternity leave
  - As much freedom and independence as you earn, and a chance
    to grow rapidly as the company does.
  - Flexi and hybrid working
  - Company's office in Paddington - easy commute and
    comfortable surroundings
  - Motivated, highly functioning, multi-disciplinary team
