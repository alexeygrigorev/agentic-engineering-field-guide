description: |
  About Pinterest:

  Millions of people around the world come to our platform to
  find creative ideas, dream about new possibilities and plan
  for memories that will last a lifetime. At Pinterest, we’re
  on a mission to bring everyone the inspiration to create a
  life they love, and that starts with the people behind the
  product.

  Discover a career where you ignite innovation for millions,
  transform passion into growth opportunities, celebrate each
  other’s unique experiences and embrace the flexibility to do
  your best work. Creating a career you love? It’s Possible.

  At Pinterest, AI isn't just a feature, it's a powerful
  partner that augments our creativity and amplifies our
  impact, and we’re looking for candidates who are excited to
  be a part of that. To get a complete picture of your
  experience and abilities, we’ll explore your foundational
  skills and how you collaborate with AI.

  Through our interview process, what matters most is that you
  can always explain your approach, showing us not just what
  you know, but how you think. You can read more about our AI
  interview philosophy and how we use AI in our recruiting
  process here.

  We’re looking for a Staff Software Engineer to provide
  technical leadership for a team transforming how merchants
  onboard and activate through agent enabled experiences. You
  will partner with Product and engineering leaders to shape
  the roadmap, prototype innovative ideas and deliver reliable
  systems that use merchant signals and personalized
  recommendations to create measurable business impact.

  What you’ll do:

  - Lead the architecture and delivery of scalable, MCP first
    systems for merchant onboarding, activation and growth
    experiences.
  - Partner with Product to shape a growth roadmap, identify
    high value opportunities and convert the strongest
    concepts into production experiences.
  - Design integrations that apply high quality merchant signals
    and personalized recommendations across Pinterest surfaces
    and approved external agent ecosystems.
  - Build agent enabled experiences that improve merchant
    readiness and campaign creation, with clear measurement of
    their contribution to business impact.
  - Use AI to accelerate prototyping, analysis and iteration
    while applying judgment and verification to ensure
    quality, reliability and user trust.
  - Improve the team's AI harness across development, testing,
    quality validation and service operations.
  - Raise the technical bar through clear technical direction,
    design reviews and coaching that helps engineers make
    thoughtful decisions and deliver with strong ownership.

  What we’re looking for:

  - Experience leading architecture and delivery for complex
    software systems spanning product surfaces, backend
    services, data signals and external integrations.
  - Experience designing agent enabled systems and MCP based
    integrations, with strong judgment around reliability,
    security, data quality and user trust.
  - Experience partnering with Product to shape roadmaps,
    prototype new ideas and make technical tradeoffs that
    support growth goals.
  - Experience in experimentation, measurement and causal
    thinking, with the ability to connect product and
    technical decisions to business impact.
  - Experience improving the effectiveness of an AI first
    engineering team through technical direction, design
    reviews, coaching and practical improvements to AI
    assisted development, testing and operations.
  - Demonstrated ability to use AI to improve speed and quality
    in your day to day workflow for relevant outputs, while
    critically evaluating and verifying AI assisted work.
  - Bachelor's degree in computer science or equivalent work
    experience

  Relocation Statement

  - This position is not eligible for relocation assistance.
    Visit our PinFlex page to learn more about our working
    model.

  In-Office Requirement Statement

  - At Pinterest, We recognize that the ideal environment for
    work is situational and may differ across departments.
    What this looks like day-to-day can vary based on the
    needs of each organization or role.
  - This role will need to be in the office for in-person
    collaboration 1 time per week and therefore needs to be in
    a commutable distance from one of the following offices
    San Francisco, Palo Alto, Seattle, New York City or Los
    Angeles.

