description: |
  Join our Network Infrastructure Optical Systems and
  Networking R&D team as an R&D Software Optical Designer! In
  this hybrid role, you'll collaborate in our state-of-the-art
  lab equipped with cutting-edge communications and next-gen
  R&D tools. Your work will focus on enhancing subsea
  communications by developing intelligent optical systems
  that optimize performance during commissioning and predict
  potential degradation to recommend timely remediation
  actions.

  You'll engage with cross-functional teams, including DSP,
  Systems, and SW engineers, while directly interfacing with
  customers. Enjoy the benefit of contributing to innovative
  projects encompassing customer commissioning software, cloud
  tools, R&D simulations, and design aspects of subsea
  communication.

  Be self-motivated and thrive in a highly innovative
  environment, where your contributions genuinely impact our
  advancements in the field. Embrace this opportunity to shape
  the future of communication technology with us at Nokia!


  Responsibilities

  Design and develop innovative software solutions to optimize
  subsea optical links for enhanced performance, reliability,
  and operational efficiency.

  Leverage modern AI-assisted development tools to rapidly
  prototype, build, test, and maintain software applications
  that address real-world customer and network challenges.

  Create intuitive, user-focused applications and interfaces
  that simplify the commissioning and operation of EDFA and
  Raman backhaul systems.

  Develop intelligent analytics and decision-support
  algorithms to assess cable aging, recommend retesting
  strategies, and streamline cable recommissioning activities.

  Design automation and optimization solutions that enable
  upgrades of existing cable systems while minimizing
  operational impact and maintaining service continuity.

  Build simulation, modeling, and data-analysis capabilities
  to support cable commissioning, network optimization, and
  predictive performance assessments.

  Collaborate closely with optical, systems, and software
  engineers to translate complex technical requirements into
  practical software solutions.

  Use AI-powered development platforms and data-analysis tools
  to accelerate innovation, improve software quality, and
  increase engineering productivity.

  Participate in customer demonstrations and proof-of-concept
  activities, communicating technical concepts clearly and
  showcasing software capabilities in a hands-on environment.

  Join a multidisciplinary team focused on transforming subsea
  communications infrastructure through software, automation,
  artificial intelligence, and advanced analytics.


  Qualifications

  Deep knowledge of submarine optical communication systems,
  including wet plant and dry plant architectures,
  transmission engineering, system commissioning, capacity
  upgrades, and lifecycle management of subsea cable networks.

  Demonstrated ability to use modern AI-assisted development
  platforms and coding agents to create, test, debug, and
  maintain software solutions.

  Experience leveraging generative AI tools to rapidly
  prototype applications, automate workflows, analyze data,
  and solve complex engineering problems.

  Strong understanding of optical power flow analysis and the
  ability to apply analytical tools and AI-assisted techniques
  to model and optimize optical networks.

  Knowledge of Raman and EDFA amplification systems, including
  their operational characteristics, control strategies, and
  performance optimization.

  Familiarity with GN models, optical system simulation, or
  related analytical frameworks, with the ability to use AI
  and software tools to develop, interpret, and enhance such
  models.

  Proven ability to evaluate AI-generated code and algorithms
  for correctness, performance, scalability, and
  maintainability.

  Strong systems-thinking, troubleshooting, and technical
  communication skills, with the ability to bridge domain
  expertise and software-enabled solutions.
