description: |
  We're looking for engineers to upgrade the patient
  experience.

  The software you experience at the doctor's office is often
  dated and terrible, but our software can plug into the
  doctor's legacy system and provide a modern experience:
  online scheduling, paperless check-in, interactive
  reminders, automated waitlist, payments, and more.

  Patients get a great experience and the practices have less
  busy-work.

  We're just 40 people, but we're the top-rated solution in
  our space and used by thousands of offices across the
  country.

  We do things differently than most: we're smaller (by
  choice), and self-funded. This allows us to stay focused on
  our practices instead of trying to impress VCs.

  As an engineer joining the team, this means greater
  ownership.

  About the role

  We're looking for full-stack engineers capable of making
  meaningful contributions to best-in-category features.

  Since we’re a small team, we’ll strive to make you the go-to
  person for a slice of the product, and you’ll work with
  others on our team to gather feedback that drives continual
  improvement.

  You’ll join the occasional client call to gather feedback on
  your features and hear about their challenges first-hand.

  In this role, you’ll be supported by the co-founders, a
  product manager, a graphic designer, and other experienced
  engineers.

  Health care experience is not needed. We'll teach you what
  you need to know about how a doctor's office works.

  Our tech stack is Python, JavaScript and Postgres on Linux,
  with AI growing in importance.

  Things we'll be looking for:

  - Track record of making significant contributions in past
    products
  - A start-up friendly temperament (comfortable with ambiguity
    and rapid change)
  - 7-ish or more years of experience

  Perks of working at NextPatient:

  - Freedom to work from home
  - We encourage everyone to take a real 2-week vacation each
    year to somewhere amazing.
  - A year-end company-wide trip where you can get to know
    everyone in the company (Past years: Park City, Miami,
    Austin)
  - A mid-year team-wide trips with +1s, so your partner can
    meet the people you're always talking about (Chicago, SF,
    Vegas)
  - Comprehensive Health, dental, vision insurance
  - 401k with match
  - Generous PTO policy
  - 11 federally recognized holidays that we also observe
  - Fully paid Parental leave offered after 12 months tenure

  Salary Range for this position: $225,000-$265,000 Equity
  Offered
