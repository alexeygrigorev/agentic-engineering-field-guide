description: |
  Propr.xyz is building a new Operating System for prop firms,
  helping them leverage blockchain technology to make them
  more efficient. We enable prop firms to leverage perpetual
  futures on Hyperliquid, prediction markets, and spot assets.
  We are actively deploying our technologies to the largest
  prop firms in the world. The pace is intense, but the
  journey is exciting. We only hire A-players. You need to be
  exceptional.

  Responsibilities

  - Design and implement backend services across the trading
    domain.
  - Own features end to end: schema, API, tests, UI integration.
  - Contribute to real time infrastructure and client facing
    APIs.
  - Write integration tests against real dependencies.

  Requirements

  - 5+ years production backend experience.
  - Strong TypeScript or other strongly typed language
    background.
  - Experience with trading systems, financial infrastructure,
    or exchange adjacent domains.
  - Distributed system and transaction knowledge.
  - Modern Node.js backend framework (NestJS preferred; Spring /
    FastAPI / similar acceptable).
  - SQL and a production ORM (preferably TypeORM).
  - Arbitrary precision decimal arithmetic in financial
    contexts.
  - Integration first testing discipline.
  - Able to ship React / Next.js features to completion.

  Bonus

  - Event sourcing experience.
  - Crypto exchange experience.
  - Direct experience with major exchange APIs (REST +
    WebSocket).
  - AWS (ECS, Aurora, ElastiCache etc.), Terraform.
  - Monorepo tooling (Turborepo, Nx).
  - KYC / compliance workflows.
  - Crypto native.

  How to apply
