description: |
  We Do Consulting Differently

  Second Sight Solutions, a subsidiary of Berkeley Research
  Group (BRG), is a health technology company, and our
  innovative technology reimagines how drug discount data is
  exchanged, establishing new connections and improving
  transparency for drug manufacturers and their customers. Our
  customers and partners trust us to deliver reliable, first-
  to-market solutions and safeguard the data we receive. We
  trust our employees, and our culture gives them the freedom
  to create, collaborate, and grow. Our leaders are industry
  experts, creative, unafraid to challenge the status quo, and
  the pioneers of market-changing solutions.

  We are currently seeking a Senior Engineering Manager who is
  passionate about solving challenging problems. The ideal
  candidate will combine strong managerial expertise with
  solid hands-on technical capabilities and an eye for
  scalable design and architecture. You will manage multiple
  teams of up to 15 software engineers taking part in creating
  some of the most innovative software solutions in the
  dynamic and fascinating field of healthcare analytics.

  Responsibilities:

  - Lead, coach and grow a passionate team of 10-15 software
    engineers.
  - In this management role, you will work with leadership and
    key business stakeholders to prioritize and drive the
    development and support of applications.
  - Aid in development and execution of the application roadmap,
    ensuring alignment with charter, business priorities, and
    customer needs.
  - Ensure applications are designed for scale, performance, and
    maintainability.
  - Have a passion for quality and reach for quality-driven
    outcomes as aligned with customer obsession and timeline
    pressure.

  Technical Skill Set:

  - 7+ years of software development experience in one or more
    of the following programming languages: React, TypeScript,
    JavaScript, Ruby, Ruby on Rails, and/or Golang.
  - Experience with Agile SDLC methodology, Jira, GitHub, and
    working in a CI/CD environment.
  - Experience with one or more of the following: Kubernetes,
    Postgres, Docker, AWS and/or Microsoft Azure is a plus.



  Requirements:

  - 7+ years of solid software development experience.
  - 3-5+ years of direct experience working in an engineering
    manager role, leading a team of at least 10 engineers.
  - Bachelor’s degree in Computer Science, Information
    Technology or a related field
  - Proven track record of building diverse technical teams,
    promoting collaborative culture, and supporting career
    growth of teams.
  - Strong problem-solving and analytical skills, with the
    ability to make quick decisions in a fast-paced
    environment with complete ownership.
  - Experience with code quality, continuous delivery, and
    automated testing.
  - Comfortable working in an agile environment and challenging
    yourself and your team to improve their ways of working.
  - Experience building scalable, user-friendly web
    applications.
  - Great written and verbal communication skills; experience
    presenting to leadership.
  - Champion adoption of AI-enabled development tooling via
    local and SOTA models to improve engineering velocity,
    code quality, and developer experience.

  Hybrid role out of the DC or NYC office.

  Salary Range: $200,000 - $250,000 per year.

  Candidate must be able to submit verification of their legal
  right to work in the U.S., without company sponsorship

  About BRG

  BRG combines world-leading academic credentials with world-
  tested business expertise and purpose-built emerging
  technologies. Our culture centers on agility and
  connectivity which sets us apart and gets you ahead.

  At BRG, our professionals include specialist consultants,
  industry experts, renowned academics, and leading-edge data
  scientists. Together, they bring a diversity of real-world
  experience, data, and human and artificial intelligence, to
  economics, disputes, and investigations; corporate finance;
  and performance improvement services that address the most
  complex challenges facing organizations across the globe.

  Our unique structure nurtures the interdisciplinary
  relationships that give us the edge, laying the groundwork
  for more informed insights and more original, incisive
  thinking.  When paired with our global reach and resources,
  our diverse perspectives and technical capabilities make us
  uniquely capable to address our clients’ challenges. We get
  results because we know how to apply our thinking to your
  world.

  At BRG, we don’t just show you what’s possible. We’re built
  to help you make it happen.

