description: |
  About the company

  Our client is a consumer technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Join a small engineering team to build and ship features
  across the web frontend and backend services of a consumer
  application. The work spans scalable infrastructure, data
  pipelines, experimentation and recommendation features, in a
  fast-paced and experimental setting.

  What you'll do

  - Scale backend infrastructure to keep pace with rapidly
    growing user data and image volume.

  - Build polished, responsive frontend experiences in React and
    Next.js.

  - Ship features through an A/B testing and experimentation
    pipeline.

  - Develop data pipelines for ingesting and processing large
    third-party catalogs, including ETL and orchestration.

  - Contribute to ranking and recommendation systems, including
    personalization and suggestions.

  - Deliver end-to-end features quickly in a highly experimental
    environment, working closely with the founder and a small
    group of engineers.

  Requirements

  What we're looking for

  - 2 to 5 years of experience as a full stack engineer.

  - Prior experience at a startup or a notable technology
    company.

  - Proficiency in React, Next.js and Python.

  - A computer science degree from a top-ranked U.S. program.

  - Working understanding of AI models, including computer
    vision and recommendation systems.

  Bonus points

  - Experience building consumer-facing products at scale.

  - A design and product-focused mindset with a drive to build
    functional, attractive interfaces.

  - Customer focus and enthusiasm for turning user feedback into
    code.

  - Experience with Swift and iOS development.

  Benefits

  Compensation and benefits

  - Base salary: USD 175,000 to 250,000 per year

  - Equity

  Location and work model

  - New York, NY, United States

  - On-site, 5 days per week in the office

  - Full-time
