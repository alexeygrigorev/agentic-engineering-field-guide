description: |
  Salary range is:

  $136,885.10 - $210,000.00

  This position is bonus and/or commission eligible.

  CCC Intelligent Solutions Inc. (CCC) is a leading cloud
  platform for the multi-trillion-dollar insurance economy,
  creating intelligent experiences for insurers, repairers,
  automakers, part suppliers, and more. At CCC, we’re making
  life just work by empowering more than 35,000 businesses
  with industry-leading technology to get drivers back on the
  road and to health quickly and seamlessly. We’re pushing
  boundaries with innovative AI solutions that simplify and
  enhance the claims and repair journey. Through purposeful
  innovation and the strength of its connections, CCC
  technologies empower the people and industry relied upon to
  keep lives moving forward when it matters most. Learn more
  about CCC at www.cccis.com.



  The RoleWe are seeking a Senior Manager to lead our Full
  Stack Engineering team in Subrogation. This role is critical
  to delivering high-quality, scalable web applications and
  APIs that power our product offerings. As a technical and
  people leader, you will be responsible for providing end-to-
  end ownership of technical product and solution design while
  building and mentoring a multi-level team of full stack
  engineers.



  Key Responsibilities:

  Responsibilities:

  - Provide technical leadership and people leadership to a team
    of full stack engineers, establishing standards for
    software development and deployment

  - Own end-to-end technical product and solution design,
    ensuring alignment with business objectives and technical
    excellence

  - Partner with product managers, UX designers, and business
    stakeholders to define technical goals and outcomes for
    the engineering team

  - Coordinate cross-functional collaboration and delivery for
    engineering initiatives, managing timelines, deliverables,
    and stakeholder communication

  - Lead the team to deliver scalable performant web
    applications and APIs

  - Build and manage relationships with stakeholders in
    engineering, business, and sales

  - Establish and maintain technical architecture standards,
    ensuring scalability, security, and performance



  Requirements:

  Required Experience:

  - 8+ years in software engineering, with 3+ years managing
    engineering teams

  - Deep understanding of full stack software development:
    frontend, backend APIs, databases, and cloud
    infrastructure

  - Expertise in technical architecture and solution design for
    web applications and SaaS products

  - Proficiency with AWS cloud services (Lambda, API Gateway,
    SQS, S3, IAM) and serverless architectures

  - Strong experience with modern web technologies: React.js,
    TypeScript/JavaScript, Python, Node.js - Experience with
    Python or Node.js for backend services required

  - Experience with database design and optimization (MongoDB or
    other NoSQL databases preferred)

  - Strong software engineering fundamentals and best practices
    (CI/CD, Automation Testing, Infrastructure as Code)

  - Proven ability to build, mentor, and scale high-performing
    technical teams

  - Experience translating business objectives into technical
    roadmaps and deliverables

  - Ability to balance technical excellence with business
    priorities and timelines

  - Strong experience with task estimation, prioritization, and
    escalation in alignment with engineering processes

  - Excellent communication skills; ability to explain complex
    technical concepts to non-technical stakeholders

  - Strong stakeholder management and cross-functional
    collaboration skills

  - Experience managing teams through subordinate supervisors or
    directly, with responsibility for results, costs, methods,
    and staffing



  Preferred Qualifications:

  - Experience in financial services including banking,
    insurance, or an equivalent industry

  - Experience managing teams of 10+ engineers

  - Experience applying generative AI technologies, including
    prompt engineering, to software products, engineering
    workflows, or business solutions.

  - Experience with microservice and microfrontend development
    (modular component design)

  - Background in customer-facing product development and
    support

  - Experience with performance optimization and scalability
    challenges in production environments



  Interview Policy & Privacy Notice:

  A video interview is required for this position. Video
  interviews are transcribed. Transcriptions are retained and
  may be reviewed by CCC and our recruiters. Candidates are
  not permitted to use generative AI or automated assistance
  during the interviews unless explicitly allowed by the
  interview team for a specific exercise. Our Job Applicant
  Privacy Notice is available HERE.

