  Israeli Intelligence units. We are looking for a hands-on
  Founding Backend Engineer(Go) for a hybrid role based in
  central of Berlin. If you are passionate about cybersecurity
  and AI tech, thrive in fast-paced startup environments, and
  enjoy building complex platforms from the ground up, this is
  an opportunity to make a real impact. We’re building a next-
  generation cyber risk platform that helps enterprises
