  experience * Hands-on coding mentality; can build things
  from scratch and familiar with different architectures *
  Hands-on experience with Docker, Kubernetes (EKS) and
  containerized workloads * Experience designing RESTful and
  gRPC APIs and using frameworks like Gin * Hands-on
  experience with messaging systems (e.g., SQS, Kafka) *
