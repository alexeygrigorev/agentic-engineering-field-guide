  Job Description Python Software Engineers design and build
  the applications, platforms, and infrastructure that power
  every aspect of our investment process, from research and
  analysis to trading, risk management, funding, and
  settlement. Our engineers tackle complex technical
  challenges spanning distributed systems, data platforms,
  developer tooling, automation, financial systems, and
  applications used by investment and enterprise teams. Key
  Responsibilities:

  - Design, develop, test, deploy, and maintain high-quality
    Python applications and services
  - Build scalable systems, platforms, APIs, libraries, and
    tools supporting research, trading, risk, data, and other
    critical investment and business workflows
  - Partner directly with investment professionals, quantitative
    researchers, and engineers to understand requirements and
    translate them into effective technical solutions
  - Contribute to architectural decisions and engineering best
    practices across teams
  - Solve complex and often ambiguous problems in a fast-moving,
    collaborative environment
  - Learn from industry leaders, distinguished engineers, and
    investment professionals

  Qualifications:

  - Minimum of a Bachelor's degree in Computer Science, or a
    related STEM discipline, or equivalent experience
  - Exceptional Python programming skills and a strong
    understanding of computer science fundamentals, data
    structures, algorithms, and software design
  - Excellent written and verbal communication skills and an
    ability to explain technical concepts and results to a
    range of stakeholders
  - Strong entrepreneurial spirit, ownership mindset, and the
    ability to adapt to changing requirements and technologies
  - Ability to manage multiple priorities in a demanding and
    dynamic environment
  - Intellectual curiosity and an interest in learning about
    financial markets

  Opportunities may be available from time to time in any
  location in which the business is based for suitable
  candidates. If you are interested in a career with Citadel,
  please share your details and we will contact you if there
  is a vacancy available.  To be eligible for UK postings, you
  must have or be able to obtain UK work authorization. For
  our privacy policy, go to https://www.citadel.com/privacy.
  In addition, the employee who fills this role will be
  eligible to participate in a discretionary incentive
  compensation program, as well as a wide array of benefit
  programs, such as medical and life insurance, retirement and
  tax-free savings plans, and access to other healthcare
  programs. In accordance with applicable law, the base salary
  range for this role is $200,000 to $3,000,000. In addition,
