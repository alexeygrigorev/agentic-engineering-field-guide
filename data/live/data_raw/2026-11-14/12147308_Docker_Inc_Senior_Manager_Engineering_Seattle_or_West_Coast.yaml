description: |
  About Docker

  Docker has been one of the most loved brands in developer
  tooling, trusted by more than 20 million monthly users and
  over 20 billion container image pulls. From solo founders to
  the world's largest companies, developers rely on Docker to
  build, share, and run their applications across our suite of
  products including Docker Desktop, Docker Hub, and Docker
  Scout. We are a globally distributed, remote-first team
  building the tools that define how software gets built and
  delivered. As AI agents redefine software development,
  Docker is at the center of that shift, providing the
  sandboxed environments, verified images, and secure
  infrastructure that make autonomous workflows trustworthy by
  default.

  ____________________________________________________________
  ___________

  The Role

  As AI agents redefine software development, Docker is at the
  center of that shift, providing the local and cloud
  sandboxed environments that make interactive and autonomous
  agentic workflows trustworthy by default. At the heart of
  our trust model is the fact that user credentials and other
  sensitive secrets are injected at the sandbox layer and
  never exposed to an agent. An agent can never leak secrets
  it never sees. The Secrets team builds the software that
  makes that possible, from easy-to-use SDKs to secure cloud
  services. We operate at the intersection of the developer
  experience, enterprise governance, and security—delivering
  core security features that make Docker sandboxes the best
  way to run agents and other workloads safely. In this role,
  you would manage this team, owning its technical direction
  and delivery and being accountable for its operational
  excellence.

  The successful candidate is a hands-on engineer at heart.
  They have built secure software and scale-out cloud
  services, and they use that experience to guide their team
  to sound architectural decisions and a high security bar.
  They think naturally about isolation and trust boundaries
  and understand the tradeoffs of running untrusted or semi-
  trusted workloads. They are skilled at growing and retaining
  senior individual contributors and thrive in a remote-first
  environment. They stay close to customers, because the gap
  between a strong security model and something people
  actually adopt is where the real work happens.

  ____________________________________________________________
  ___________

  Responsibilities

  - Lead a team of engineers building Docker's shared Secrets
    platform and own its technical direction.
  - Partner closely with product management to align the team
    with business and product goals.
  - Lead through influence across the teams that adopt the
    platform, making it their default way to handle
    credentials.
  - Ensure predictable delivery and operational excellence, and
    own the team's on-call rotation and incident response.
  - Hold a high bar for security and engineering excellence,
    partnering with Security on design reviews and threat
    models.
  - Hire and retain top engineering talent.
  - Facilitate communication across teams and provide status
    reporting for critical projects.

  ____________________________________________________________
  ___________

  Qualifications

  - 5+ years experience managing high-performing engineering
    teams.
  - 5+ years of hands-on experience building secure software and
    scale-out cloud services.
  - Strong grounding in security fundamentals: authentication
    and authorization, secret and key management, and threat
    modeling.
  - Experience reasoning about isolation and security boundaries
    for untrusted or semi-trusted workloads.
  - Experience building platforms, SDKs, or shared services that
    other teams adopt, including enterprise requirements like
    audit and policy.
  - Strong verbal and written communication skills.
  - Comfortable with a high degree of autonomy and the ability
    to work remotely across time zones.

  ____________________________________________________________
  ___________

  What to Expect First 30 Days

  - Understand the group and team missions.
  - Meet the team along with peers across the group and the
    company.
  - Build relationships with the teams that depend on the
    Secrets platform.
  - Start line managing reports and building a rapport.
  - Gain a high-level understanding of the Secrets platform and
    how it fits into the sandbox products.
  - Participate in status reporting and reliability reviews.

  First 90 Days

  - Work with the team to align on goals and measures of
    success.
  - Start career discussions with reports.
  - Work with the team to improve processes and remove blockers.
  - Contribute technical input to roadmap and architectural
    decisions.
  - Oversee the delivery of a change or feature.
  - Start hiring for the team.

  One Year Outlook (First Year)

  - Drive the long-term technical direction of the platform.
  - Have had a sustained, positive impact on the growth and
    performance of your reports.
  - Have the platform adopted by multiple Docker products.

  Visa sponsorship: Docker considers visa sponsorship on a
  case-by-case basis based on business needs.

  ____________________________________________________________
  ___________

  Compensation & Equity

  All full-time roles include equity. Final compensation is
  determined on factors including but not limited to
  experience, skills, qualifications, and location.



  Canada: CA$276,050– CA$441,650 base

  United States: $197,650 – $318,450 base

  ____________________________________________________________
  __________

  Posting Information

  - Open vacancy: This posting is for an existing open role.
  - AI in hiring: Docker may use AI-assisted tools during our
    recruiting process.
  - Interview recordings: Candidates will be invited to opt in
    to interview recordings to support interviewer calibration
    and consistent evaluations. Recordings are optional and
    require explicit consent.

  ____________________________________________________________
  __________

  Perks & Benefits

  - Remote-first by design – Work from your home, with offices
    in Seattle and Paris for connection and collaboration.
  - Flexibility that fits your life – We trust you to manage
    your schedule while delivering great work.
  - Time to recharge – Generous PTO, designated quarterly
    Whaleness Days, and a designated end-of-year Whaleness
    break.
  - Home office support – Set up your workspace for comfort and
    success.
  - Technology stipend – Equivalent to US$100 net per month to
    help support your work.
  - Learning & development – Annual stipend for conferences,
    courses, certifications, and continued learning.
  - Parental leave – 16 weeks of paid parental leave after six
    months of employment.
  - Equity for all full-time employees – Share in Docker's long-
    term success as we continue to grow.
  - Comprehensive benefits – Medical, retirement, and paid
    holidays vary by country.
  - Docker swag – Because representing the whale never gets old.

  Docker is proud to be an equal opportunity employer. We are
  committed to building a team that reflects a broad range of
  backgrounds, experiences, and perspectives. We believe
  diverse teams build better products, make better decisions,
  and better serve our global community.

