description: |
  About On Me

  Humans have given each other gifts since the dawn of time.
  For gratitude, for friendship, and for love. In today’s
  society, gifting has become harder and much more wasteful,
  as it’s become nearly impossible to know exactly what
  someone wants, when you just want to show that you care.

  On Me is revolutionizing gifting by rebuilding it for the
  mobile and Instagram era. Traditional gift cards are
  impersonal and rigid, usually sold by an old and wealthy
  megacorp. We make it easy to send a personalized, media-rich
  gift that’s spendable across brands, fits someone’s hobbies,
  and drops straight into their mobile wallet for tap‑to‑pay.
  Check out our live experience at onme.com.

  We’re a small startup from Google and Apple moving fast on a
  massive category and have raised $8M from top‑tier investors
  like NFX, Lerer Hippeau, Focal VC, and Mastercard. Since
  launching in November 2024, On Me has been featured in Tech
  Crunch, Fortune, and The Wall Street Journal. In 2025, we
  sustained over 40% growth month over month throughout the
  year, and the trend shows no sign of stopping.

  In 2026, we’re doubling down on making every gift feel
  magical end‑to‑end and building an amazing consumer product.
  You’ll help us build a world-class web platform and mobile
  apps that people love. If you want meaningful ownership,
  clear consumer product impact, and the chance to set
  engineering standards early, this is it.

  Who you are

  You’re perfect for this role if you want to own your work
  end to end and make company-wide decisions across product,
  frontend, and backend. You love working on features that
  touch real users, from the pixels and flows they see to the
  systems and data powering everything underneath. You care
  about the quality and craft of what you do, and why you do
  it.

  What you’ll do

  As a full stack software engineer, you’ll be the fourth
  engineer at a tiny startup, working closely with the whole
  team to design and build the end‑to‑end product experiences
  that power our gifting platform. You’ll own projects that
  span our web app, iOS and Android Apps, and the backend
  services behind them. You’ll be responsible for building
  polished, performant UIs; designing clean APIs; and wiring
  everything up to resilient systems that can safely handle
  millions of dollars in transactions. Your work will include
  thinking through user journeys, edge cases, loading and
  error states, while also architecting systems for
  availability, performance, and security. You’ll have end-to-
  end ownership of critical product surfaces, driving both
  product and engineering decisions that shape the future of
  digital gifting.

  Key Responsibilities

  - Design, implement, and ship full stack product features on
    web, iOS, and Android
  - Build high-quality, interactive UIs with attention to
    polish, responsiveness, loading, and error states.
  - Design and maintain clean, pragmatic APIs that connect our
    frontend experiences to backend systems.
  - Collaborate with product, design, and the rest of the team
    to translate fuzzy goals into concrete flows and shipped
    features.
  - Drive architectural and product decisions to support scaling
    to hundreds of thousands of users and transactions.
  - Set up and evolve monitoring, logging, and alerting to
    maintain system health and performance.

  Requirements

  - 5+ years of experience as a full stack engineer building
    user-facing products.
  - Strong product and UX mindset: you think from the user’s
    point of view and care about end‑to‑end flows, not just
    endpoints.
  - Strong foundations in modern web stacks (React, Next.js,
    TypeScript, Node.js / Express).
  - Experience with native iOS development in Swift or native
    Android development in Kotlin.
  - Experience shipping high-quality, interactive web UIs to
    production.
  - Solid understanding of API design, data modeling, and how
    systems fail in practice.
  - Experience designing and building APIs.
  - Knowledge of scalability, caching, and fault-tolerance
    patterns.
  - Experience with CI/CD pipelines, monitoring, and
    observability tools.
  - Ability to take ownership of projects from vague problem →
    design → implementation → launch and iteration.
  - Strong communication and collaboration skills in a fast-
    paced startup environment

  Bonus points

  - Experience with frontend development for consumer products.
  - Experience with Google Cloud Platform (Cloud Run, Pub/Sub,
    Firestore, BigQuery).
  - Experience working with payments, financial transactions, or
    other high‑value data systems.

  What We Offer

  - A competitive salary and meaningful early employee equity.
  - A dynamic, collaborative, balanced, and inclusive work
    culture.
  - The opportunity to deeply shape the company’s tech stack and
    engineering culture.
  - Hybrid office in SF with a fully stocked gym, or hybrid
    office in NYC.
  - Unlimited paid time off.
  - Medical, dental, and vision insurance.
  - 401k

  Who You’ll Work With

  At On Me, you’ll join a small, elite team of builders from
  Google and Apple who move fast and care deeply about product
  quality. You’ll collaborate daily with:

  - Darragh Meaney, CEO — Formerly at Google Ads and YouTube
  - Sitar Harel, CTO — Formerly at Google Maps and Google Photos
  - Daniel Li, Founding Engineer — ex-Apple, WWDC session
    speaker and Cornell AppDev alum
  - Neil Shankar, Founding Designer — previously Senior Designer
    at Google and Block (formerly Square)

  We combine big-tech craft with startup speed—and we’re just
  getting started.

  Join Us

  Become a part of On Me’s story, and play an integral role in
  our journey to strengthen relationships through magical
  gifting experiences. If you're ready to contribute to a team
  that values ambition, collaboration, and the joy of tackling
  exciting challenges, we’d love to hear from you.
