description: |
  🚀 Founding Fullstack Engineer (3–8 Years Experience)

  New York City (5 days on-site) · Top of market + equity +
  benefits

  TL;DR: Build the product that nuclear operators depend on
  daily. Own features end-to-end. High-leverage IC role with
  founding-level impact.

  The Mission

  Everstar builds the intelligence layer that makes nuclear
  power actually deployable—collapsing regulatory workflows
  from months to days. Gordian already powers engineering and
  compliance work for utilities, advanced reactor companies,
  and hyperscalers. We pair deep nuclear domain expertise with
  world-class product execution and move with startup speed.

  Now we need a Founding Fullstack Engineer to turn complex
  engineering and regulatory workflows into intuitive,
  production-grade software.

  You'll be joining the Apollo Team of Nuclear. You'll build
  alongside engineers from Tesla, SpaceX, Lockheed Martin,
  Google, and Microsoft. You'll learn from nuclear and
  national security experts who cut their teeth at the Nuclear
  Regulatory Commission, CIA, and NuScale.

  The Role (reporting to the CEO)

  Not a contractor. Not a feature factory. This is an
  ownership-first role.

  You'll architect and ship product features end-to-end—from
  database design to API contracts to pixel-perfect UI. Think
  60% frontend / 40% backend with the autonomy to make
  technical decisions and the accountability to own outcomes.

  Most weeks you'll be designing new flows, implementing
  features, and refactoring systems—then immediately seeing
  customers use what you shipped.

  You will:

  - Build user-facing features: translate messy regulatory
    workflows into clean, intuitive UI/UX that nuclear
    professionals actually want to use.
  - Own the stack: design APIs, optimize queries, implement
    frontend interactions, and debug production
    issues—whatever it takes to ship.
  - Set product standards: you're early enough to define how we
    think about code quality, design systems, testing, and the
    entire product development process.
  - Collaborate with domain experts: work directly with nuclear
    SMEs and AI engineers to understand complex requirements
    and ship solutions that actually solve problems.
  - Balance speed and craft: know when to optimize for polish
    and when to ship fast; make tradeoffs consciously and
    communicate them clearly.
  - Lead by example: as the team scales, you'll mentor other
    engineers—but first, you'll prove the playbook yourself.

  A sample week: ship new document collaboration feature;
  refactor search results to improve load time by 40%; pair
  with AI engineer to integrate new model output; design
  mockups for compliance workflow redesign; debug production
  issue reported by customer; review two PRs.

  What You've Done

  - 3–8 years fullstack experience building production web apps.
    You've shipped features users depend on daily and owned
    parts of the product top to bottom.
  - Strong frontend chops: expert-level TypeScript/React, deep
    understanding of modern frontend patterns, and genuine
    care about UI/UX details.
  - Solid backend fundamentals: comfortable with APIs,
    databases, auth, and backend architecture. You can debug
    performance issues and design scalable systems.
  - Product sense: you think about business outcomes, not just
    code. You ask "why are we building this?" and "how will
    users actually use it?"
  - Ownership DNA: you've led projects, made technical
    decisions, and been accountable for outcomes—not just
    tickets.
  - Bonus points: experience with technical SaaS, regulated
    industries, or you have strong design taste and can mockup
    flows in Figma.

  No nuclear background required—only the drive to build
  products that matter.

  Who You're Building For

  Our customers are the critical operators in the nuclear
  industry—the professionals keeping 20% of U.S. electricity
  safe and reliable. They're:

  - Overworked and under-resourced: carrying the weight of the
    grid on their backs
  - Navigating byzantine regulations: decades-old processes that
    slow everything down
  - Desperate for modern tools: they deserve software as good as
    what consumer tech gets

  The products you build will help them:

  - Onboard and train faster—reducing time-to-productivity from
    months to weeks
  - Execute safety-critical workflows—with confidence, speed,
    and audit trails
  - Keep vital infrastructure safe—because "good enough" isn't
    good enough in nuclear

  This is meaningful work in the truest sense—you're giving
  frontline professionals the tools they need to secure the
  energy backbone of our society.

  What's at Stake

  - 🔥 If we succeed: Operators get world-class tools, nuclear
    scales to meet exploding energy demand, and we power the
    AI era with clean energy. The products you build directly
    accelerate deployment.
  - ❄️ If we fail: Nuclear remains stuck in red tape, operators
    stay overworked without modern tools, and humanity misses
    a once-in-a-generation chance to solve climate.

  What Success Looks Like (90 days)

  - Shipped ≥3 major features to production that customers
    actively use.
  - Product quality standards you set (testing, code review,
    design patterns) are now team norms.
  - Customer-reported bugs down ≥50% because you improved
    monitoring, testing, or reliability.
  - You've owned a critical system—search, document viewer,
    compliance workflow, or core infrastructure—that other
    engineers depend on.
  - At least one product decision you made (architecture, UX
    flow, or technical tradeoff) is now the way we do things
    at Everstar.

  Growth Path

  Strong founding fullstack engineers typically grow into Head
  of Engineering, Product Lead, or CTO-track roles as the
  company scales.

  First, you'll prove you can own product features and set the
  bar for execution.

  Why Everstar

  - Work with the best: high-caliber, wartime team that builds
    things that scale
  - Build shit that matters: products that keep the grid safe
    and accelerate the clean energy future
  - Top of market base + meaningful equity in a fast-growing
    company; standard benefits (health/dental/vision, FSA,
    wellness stipend)
  - IRL in NYC (midtown/Bryant Park). Occasional travel to
    nuclear power plants and conferences.

  How to Apply (show, don't tell)

  Submit application with:

  - Resume AND LinkedIn profile
  - Portfolio or GitHub: show us something you built (side
    project, open-source work, or product you're proud of)
  - 200 words: "What excites you most about building products
    for nuclear deployment?"
  - 150 words: "Describe a product/feature you owned end-to-end.
    What were the hardest product tradeoffs and how did you
    resolve them?"

  We respond to strong submissions within one week.

  Let's build.
