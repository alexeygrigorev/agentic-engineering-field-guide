description: |
  At Allstate, great things happen when our people work
  together to protect families and their belongings from
  life’s uncertainties. And for more than 90 years, our
  innovative drive has kept us a step ahead of our customers’
  evolving needs. From advocating for seat belts, air bags and
  graduated driving laws, to being an industry leader in
  pricing sophistication, telematics, and, more recently,
  device and identity protection.

  Job Description

  The Control Integration Engineering (CIE) organization
  accelerates consistent adoption, integration and measurement
  of enterprise security capabilities across Allstate and its
  subsidiary Market Facing Businesses (MFBs). We are seeking
  an experienced Digital Product Manager specializing in
  Integration Product Management to own the security-control
  integration and adoption journey for an assigned MFB
  portfolio.  The DPM understands each MFB's technology
  landscape, security posture, priorities and constraints, and
  works with MFB teams, control owners, Product Security, CIE
  engineering, architecture, risk and governance to turn them
  into a prioritized integration roadmap, reusable patterns
  and measurable adoption outcomes. Rather than managing a
  traditional security product, this role productizes the
  integration experience, making enterprise security
  capabilities easier, faster and more consistent to consume.
  It owns the product strategy, roadmap, prioritization and
  outcomes for integrating these capabilities into the
  assigned MFB portfolio.

  Integration Strategy, Roadmap & Prioritization

  - Own the integration product strategy and multi-quarter
    adoption roadmap for assigned MFBs, aligned to enterprise
    security priorities and MFB needs. Prioritize CIE
    investment by security value, adoption impact, effort,
    dependencies and reuse potential, sequencing adoption
    where capabilities add the most value.

  - Define outcomes, milestones and acceptance criteria with CIE
    engineering, reassessing priorities as needs, capacity and
    results change.

  - Manage competing demand and make transparent recommendations
    when demand exceeds CIE capacity.

  Customer Discovery & MFB Partnership

  - Treat MFBs as CIE's internal customers; run structured
    discovery with their security, engineering, cloud,
    infrastructure and architecture leaders.

  - Understand their capabilities, patterns and constraints;
    identify adoption friction and separate legitimate
    requirements from unnecessary divergence.

  - Represent MFB needs within CIE and enterprise security,
    influencing capabilities before designs become difficult
    to change.

  Productize Integration

  - Spot recurring requirements across MFBs so CIE solves each
    integration problem once, turning successful
    implementations into reusable patterns, playbooks,
    blueprints and automation with Managing and Product
    Engineers.

  - Feed recurring needs back to product and control owners, and
    ensure clear transitions to sustainable operational
    ownership.

  Adoption & Outcome Management

  - Define adoption measures and track posture, gaps, blockers
    and divergence across assigned MFBs, using evidence to
    shape roadmap priorities.

  - Support enterprise reporting with control, measurement and
    governance teams, and communicate outcomes, trends, risks
    and opportunities to CIE and security leadership.

  The DPM is accountable for whether adoption actually
  happened, measured by adoption velocity, coverage, time-to-
  integrate, reduced friction and variation, pattern reuse and
  sustainable operational transition, not stories completed,
  meetings held or projects closed.

  Cross-Functional Leadership & Delivery

  - Lead initiatives spanning MFBs, Product Security, control
    owners, CIE engineering, architecture, risk and enterprise
    technology, influencing without direct authority.

  - Communicate trade-offs to senior leadership in business
    terms, surface unresolved dependencies and keep control,
    MFB risk and operational ownership with the appropriate
    organization.
  - Translate priorities into epics and requirements with
    Managing Engineers, keeping a backlog with outcome-based
    acceptance criteria; treat Agile as a means, not the
    purpose of the role.

  Essential Skills

  Integration Product Management

  Demonstrated ability to develop product strategy and
  roadmaps through customer and technical discovery,
  prioritize across competing needs and dependencies,
  translate complex requirements into outcomes, define product
  and adoption measures, manage complex internal portfolios
  and influence direction without authority.

  Technical & Security Acumen

  Enough technical depth to work credibly with security
  architects and engineers. The DPM need not be the solution
  architect, but must question assumptions, recognize
  integration complexity and translate constraints into
  product decisions. Experience in several of these areas is
  preferred: cybersecurity controls; cloud security
  (AWS/Azure/GCP); identity and privileged access; application
  and API security; DevSecOps; vulnerability management;
  endpoint and network security; data protection; security
  architecture, platforms and tooling; and enterprise
  infrastructure.

  Enterprise Integration Leadership

  Experience leading platform adoption, integration,
  modernization or transformation across federated
  enterprises, working with engineering and architecture
  teams, managing senior stakeholders and competing
  priorities, and translating between business, security,
  product and engineering audiences. Subsidiary, acquisition
  or independent business-unit experience is highly desirable.

  Qualifications

  Essential

  - 5+ years in Product, Technical Product, Security Product or
    Platform Product Management, or comparable technology
    leadership roles.

  - Experience owning complex technology products, platforms,
    integrations or adoption initiatives, including strategies
    and roadmaps.

  - Strong analytical, prioritization, problem-solving and
    communication skills, with proven ability to lead through
    influence.

  Desirable

  - Cybersecurity experience, including control frameworks and
    integrating cloud and security platforms across
    heterogeneous environments.

  - M&A technology integration or subsidiary/business-unit
    experience.

  - Relevant security, product or cloud certifications.

  Supervisory Responsibilities

  This position does not have direct supervisory
  responsibilities.

  #LI-JB2

  Skills

  Business, Business Case Analyses, Cross-Functional Teamwork,
  Cybersecurity, Enterprise Technologies, Product Knowledge,
  Product Management, Product Roadmapping, Product Strategies,
  Strategic Roadmaps, Systems Thinking, Waterfall Model

  Compensation

  Compensation offered for this role is 120,000.00 -
  193,725.00 annually and is based on experience and
  qualifications.

  The candidate(s) offered this position will be required to
  submit to a background investigation.

  Joining our team isn’t just a job — it’s an opportunity. One
  that takes your skills and pushes them to the next level.
  One that encourages you to challenge the status quo. One
  where you can shape the future of protection while
  supporting causes that mean the most to you. Joining our
  team means being part of something bigger – a winning team
  making a meaningful impact.

