description: |
  About the company

  At Aligned, our mission is to accelerate companies with
  meaningful missions by providing subscription-based access
  to elite product and engineering teams. We build tight-knit
  communities of aligned, mission-driven people who create
  meaningful software that makes a positive impact in the
  world. Our internal team members have the chance to work
  with like-minded top talent in a collaborative environment,
  offering community, learning opportunities, and meaningful
  missions. Our core values guide us in this mission:

  - Start with Why: Before we build anything, we understand why
    it matters — to the partner, to the team, and to us.
    Clarity of purpose isn't a nice-to-have; it's the
    foundation every decision gets built on.
  - Put People First: People over profits. People over
    platforms. People over shortcuts. This is the lens through
    which we make every decision — how we design technology,
    structure partnerships, and run our business. Putting
    people first is the foundation of a resilient, abundant
    business.
  - Grow People, Grow Leaders: Exceptional work comes from
    individuals who are thriving personally and
    professionally. We create space for people to show up as
    their full, honest selves, and then actively invest in
    growing them into the next generation of product,
    engineering, and design leaders. When one person grows,
    everyone benefits.
  - Raise the Bar: We choose the longer path of learning over
    the quicker path of completion. Mastery isn't a
    destination; it's the daily discipline of going deeper,
    staying curious, and resisting the easy route. We invest
    in getting better because that's what makes everything
    else we believe in possible.
  - Bias to Ownership & Action: We don't wait for permission or
    instructions. We take grounded, healthy ownership of our
    work and our impact, and we prove it by moving. When
    people are empowered with clear goals, trusted expertise,
    and real autonomy, they don't just execute; they lead.
  - Clear is Kind: Trust isn't assumed; it's built through
    radical transparency and the courage to speak truth, even
    when it's uncomfortable. We make the implicit explicit,
    default to openness, and earn the right to challenge by
    showing up honestly and lovingly every time.

  Aligned is seeking a talented, driven Senior Software
  Engineer - Full Stack to join our dynamic team in support of
  our exciting start-up clientele.

  As a senior member of the team, you’ll take ownership across
  the stack—from architecting backend services to refining
  front-end experiences—while collaborating closely with
  product managers, designers, and fellow engineers. This is a
  role for someone who thrives in fast-moving environments,
  leads with curiosity, and cares deeply about writing clean,
  maintainable code that drives real-world impact. In this
  role, you will have the opportunity to work on cutting-edge
  projects, collaborate with cross-functional teams, and
  contribute to the development of innovative solutions that
  enhance user experiences.

  What you'll be doing:

  - Be part of a growing distributed team, which means you are
    remote 100% of the time
  - Implementing new features, redesigning or removing existing
    ones, and fixing bugs
  - Working on missions for our clients to help improve product
    velocity and build impactful products
  - Collaborate and communicate with your squad members on a
    daily basis to share knowledge and expertise
  - Contribute to a fast moving startup and help have a
    meaningful, direct impact
  - Be a part of a team that values and is interested in the
    professional and personal progression of one another

  What we are looking for:

  - +6 years experience with software development lifecycles,
    agile or lean environments
  - +6 years with at least one programming language like Python,
    Javascript, Go or an equivalent
  - +6 years with writing code in a backend framework like
    Django or the equivalent
  - +6 years with writing code in a frontend framework like
    ReactJS or the equivalent
  - Flexible and efficient at learning and picking up new
    languages, frameworks, libraries, and tools
  - Excellent written and verbal communication
  - Passionate about our values with a strong desire to grow
  - Self-starter, team player and independent — you can manage
    yourself efficiently
  - No degree required

  Salary: $160-200k DOE and location

  Please note that this is an evergreen posting. We’re always
  looking to connect with great candidates for this role, and
  while there may not be an immediate opening, we’ll review
  applications on a rolling basis and reach out as
  opportunities arise. We welcome candidates seeking FTE,
  contractor, or fractional roles.

  What We Offer

  - Competitive compensation
  - 100% remote work
  - Internal company events like meditations, yoga, and panels
  - Most of our positions are flexible for 1099 or W2 positions.
    If you are a W2 employee, we offer the following benefits:
    - Generous PTO accrual
    - Paid holidays
    - Parental leave
    - FSA and HSA
    - Medical, Dental and Vision insurance, with options for Life
      insurance and more
