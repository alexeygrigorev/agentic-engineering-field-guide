description: |
  Your daily workout

  As a Fullstack Engineer (m/f/d) - Berlin for our online
  services you are involved in all parts of the product life
  cycle: enjoy working on end-to-end product development,
  bringing in your backend experience and helping to improve
  our frontend applications. Are you up for that new
  challenge? Then we would like to welcome you to our team in
  Berlin!

  - Feature Development: You drive the development of customer-
    facing features, from idea over user experience tests to
    implementation
  - Microservices Implementation: You work as part of a team to
    implement new software projects in microservices to
    provide API
  - Code Quality: You write well-designed, testable, efficient
    code by using the best software development practice
  - Frontend Tools: You create web-based user interfaces and
    tools and help us build our frontend tech stack
  - Scalable Applications: You and your team are responsible for
    designing scalable mobile web applications using Docker,
    Kubernetes, and Google Container Engine

  Your fitness level

  - Professional Experience: You are a professional Software
    Engineer (m/f/d) with at least 4 years of experience, who
    can write clean and effective code
  - Language Flexibility: You should be open to writing code in
    Golang and Java as we work with both languages
  - Frontend Experience: You have some frontend development
    experience (Typescript, React and Ionic is a plus)
  - Cloud Expertise: You understand the requirements of cloud
    applications and have a deep understanding of Event-Driven
    Architectures, Docker and Kubernetes
  - Technology Exposure: You will work with many tools and
    technologies, although we do not require you to be
    familiar with all of them: Java, Spring, Go, Event-Driven
    Architecture (e.g. Google PubSub), Linux, Docker,
    Kubernetes, gRPC, GCP, etc
  - Adaptability: You are comfortable working in a fast-paced
    environment and constantly revising assumptions in
    response to new information

  Your training goal for your first 6 months

  - Ownership: You take ownership of the work you do, you are
    able to understand its architecture and deliver on product
    requirements and features as well as improving testability
    and functionality
  - EGYM Knowledge: You are familiar with the EGYM ecosystem and
    the role of the different teams in the software
    engineering department
  - Cultural Fit: You blend with the team and the company
    culture
  - Codebase Familiarity: You are comfortable working with our
    codebase

  The equipment we provide

  - Learning time: Use 10% of your time on learning topics of
    your choice (conferences, hackathons, internal and
    external events, videos, books or innovation project
  - Modern Tech Stack & AI Evolution: We don't just maintain; we
    evolve. Explore our Tech Radar to see our stack, and join
    us in building an AI-agentic, iterative, and incremental
    product culture where AI is a core accelerator of our
    development lifecycle
  - Choose Your Equipment: Use state-of-the-art laptops (MacOS,
    Linux, Windows? Choose your weapon! Also choose your
    Distro!)
  - International Team: Join our diverse and international team
    to collaborate with talented professionals from around the
    world - get some team insights
  - Work-Life-Balance: Benefit from flexible working hours, home
    office possibilities and 30 days of vacation per year
  - Fit and Healthy: Train for free with EGYM Wellpass in
    several thousand sports and health facilities across
    Germany and/or alternatively use our in-house gym with
    EGYM products
  - Discounts: Get a variety of great discounted offers, from
    fashion to leisure, through our employee benefits portal
  - Bike Leasing: Stay active and use our leasing bike offer for
    your way to work or in your spare time
  - Flex Budget: Use €60 per month flexibly for public
    transportation and a meal subsidy

  Contact Information

  Apply now with your documents in english (CV, salary
  expectations, and earliest possible start date) and specify
  the job ID #1846.

  Contact: Alex Berwanger For further information:
  https://career.egym.com

  About EGYM

  Warning regarding phishing emails: Please be aware that all
  official EGYM recruitment communication is sent exclusively
  from jobs@egym.com. If you receive a suspicious message from
  any other domain, please ignore it and do not share personal
  information if in doubt. EGYM is a global fitness technology
  leader, providing fitness and health facilities with
  intelligent workout solutions. EGYM makes exercising smarter
  and more efficient with its comprehensive suite of connected
  gym equipment and digital products that integrate seamlessly
  with 3rd-party-hard- and software. The result is a fully
  connected training experience that drives measurable
  business and health outcomes on and off the training floor.
  EGYM also offers subscription-based corporate fitness- and
  wellness solutions built on a combination of gym-access and
  EGYM fitness programs that directly target costly chronic
  conditions and boost employee health, leading to higher
  productivity and well-being. EGYM's global headquarters are
  in Munich, Germany, with North American offices in Denver,
  Colorado. EGYM is an equal opportunity employer. All aspects
  of employment including the decision to hire, promote,
  discipline, or discharge, will be based on merit,
  competence, performance, and business needs, regardless of
  race, gender, religion, sexual orientation, age or any other
  aspect of an individual's identity.
