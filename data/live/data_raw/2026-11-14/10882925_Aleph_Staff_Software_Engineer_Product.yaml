description: |
  About Aleph

  Aleph is an AI-native platform for Financial Planning &
  Analysis (FP&A), an established software category with a
  multi-billion market but no clear winner. We’re trying to
  solve a problem many finance teams are super familiar with:
  data scattered across a million systems, endless
  spreadsheets and way too much time spent getting numbers to
  line up instead of actually using them to make decisions.

  Aleph was founded by Albert Gozzi and Santiago Perez De
  Rosso, two technical founders with backgrounds from Stanford
  and MIT and experience working at top-tier companies such as
  Google, Microsoft and Bain & Company. We’re backed by top
  VCs (Khosla Ventures, Bain Capital Ventures, YC, Picus
  Capital), and work with customers like Webflow, Notion,
  Zapier, Y Combinator and many others.

  We are hiring remotely across the Americas (United States,
  Canada, LATAM).

  The charter

  Own and lead major product surfaces across Aleph's product
  lines. FP&A software is an unusual full-stack problem:
  dense, fast UIs that finance teams work in all day, data
  models that have to stay correct across actuals, forecasts,
  and scenarios, and integrations with the systems of record a
  business runs on. You'll take projects from conception
  through launch and iteration, working directly with
  customers and the rest of the company.

  What you'll do

  - Own features end to end across product lines, from
    understanding the problem with stakeholders through launch
    and iteration
  - Build performant, spreadsheet-grade UIs over large financial
    datasets
  - Design data models and APIs that hold up across multiple
    product lines, including streaming results and long-
    running processes
  - Build AI-native product features - orchestration, tool
    calls, retrieval
  - Raise the engineering bar through excellent code, thoughtful
    reviews, and clear communication

  What we're looking for

  - You've shipped highly intuitive products and sweat the
    details that make them feel that way
  - You've built across the stack in ways that supported more
    than the feature in front of you
  - Comfortable working directly with customers to understand
    problems before writing code

  What we expect from all Staff+ Engineers

  - Adoption: teams you don't manage have picked up systems you
    built - because they were that good
  - Strong fundamentals: you can trace requests from UI to data
    store and make good technical decisions at every layer
  - High agency: background as a founder, engineering lead, or
    startup builder. You have a builder's mindset and find
    creative ways to ship
  - Pragmatism: you choose the fewest and simplest tools that
    will actually work
  - Craft: you care deeply about code quality and write code
    that's correct and easy to understand
  - Communication: clear, direct, and persuasive across
    technical and non-technical audiences
  - Experience: you've built complex B2B products, ideally from
    scratch

  While this is a remote-first opportunity, we're focusing on
  candidates within the Americas to better align with our
  working hours as a team.

  Aleph is an equal opportunity employer that is committed to
  diversity and inclusion in the workplace. We prohibit
  discrimination and harassment of any kind based on race,
  color, sex, religion, sexual orientation, national origin,
  disability, genetic information, pregnancy, or any other
  protected characteristic as outlined by federal, state, or
  local laws.

  This policy applies to all employment practices within our
  organization, including hiring, recruiting, promotion,
  termination, layoff, recall, leave of absence, compensation,
  benefits, training, and apprenticeship. Aleph makes hiring
  decisions based solely on qualifications, merit, and
  business needs at the time.
