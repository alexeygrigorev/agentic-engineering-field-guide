title: Engineering Manager
company: Fundment
location: London, GBR
work_type: FULL_TIME
company_size: 50 Employees
description: |
  Job Description

  Fundment is a fast-growing wealth infrastructure company
  transforming the £3 trillion UK wealth management industry.
  Our modern investment platform is becoming the platform of
  choice for financial advisers and their clients. We’re
  building high-performance tools with modern technology to
  create a better investment experience.

  About the Role

  We’re looking for an experienced Engineering Manager to lead
  one of our product engineering pods. You’ll spend around 70%
  of your time hands-on – designing, reviewing, and building
  production systems in Python – while also setting technical
  direction, mentoring engineers, and owning delivery of key
  projects.

  You’ll work closely with Product, Infrastructure, and
  Application Support teams to shape, deliver, and operate
  solutions that have real business impact. This role is ideal
  for someone who combines technical excellence with sound
  judgement and thrives in a fast-paced environment where
  impact, clarity, and quality matter.

  What You’ll Be Doing

  - Lead and grow a small engineering pod – providing technical
    direction and mentoring
  - Contribute hands-on – designing solutions, reviewing code,
    and writing scalable backend systems
  - Drive delivery of technical projects from design through
    deployment and monitoring
  - Act as L2 escalation point for production issues – bringing
    urgency and technical judgement where needed
  - Collaborate with Product and Operations to turn real-world
    problems into pragmatic technical solutions
  - Champion engineering standards through architecture reviews,
    design discussions, and peer feedback
  - Stay current with modern technologies and help foster a
    culture of technical curiosity and improvement

  Tech Stack

  - Python 3.x with FastAPI, Pydantic, SQLAlchemy, Pandas, and
    NumPy
  - Databases: MySQL, PostgreSQL, Redis
  - Cloud: GCP (Pub/Sub, Cloud Run, GCE, Cloud Logging)
  - Infra: Docker, Kubernetes, GitLab CI/CD
  - Environments: Linux-based systems

  What We’re Looking For

  - Proven experience as a senior engineer or technical lead,
    including 2+ years mentoring or leading others
  - Deep Python expertise, with strong knowledge of modern
    frameworks and async APIs
  - Experience designing and delivering robust systems in fast-
    paced product teams
  - Comfortable working across infrastructure, observability,
    and deployment pipelines
  - Strong communicator who works well across engineering,
    product, and operational teams
  - Track record of delivering reliable, maintainable software
    with a bias for impact
  - (Bonus) Experience working in a regulated or financial
    services environment

  Our Values

  - Collaborative – We solve problems together, with empathy and
    respect
  - Innovative – We challenge assumptions and rethink what’s
    possible
  - Supportive – We help each other grow and succeed
  - Flexible – We adapt and evolve quickly as we scale
  - Trustworthy – We deliver on our promises

  Company Benefits

  - Be part of a modern, inclusive, high-trust engineering
    culture
  - Take ownership and ship code that directly improves client
    outcomes
  - Work with a smart, friendly team that values balance,
    growth, and support
  - Pension 6% employer contribution, minimum 2% employee
    contribution.
  - BUPA Private Health Insurance – fully paid for by the
    company, for you and your immediate family.
  - Medicash Cashplan – fully paid for by the company, for you
    and your immediate family.
  - Travel insurance – fully paid for by the company, for you
    and your immediate family.
  - Life Assurance – 4 x base salary.
  - Employee Assistance Programme
  - 28 days annual leave plus bank holidays.
  - Paid compassionate leave – up to 5 days per year.
  - Enhanced paternity/maternity/adoption leave – 16 weeks at
    full pay after 12 months of service.
  - Jury service – 10 days at full pay.
  - Hybrid working arrangements – 3 days per week in the
    Fitzrovia office.
  - Coaching&Counselling sessions
  - Training Budget
  - Annual pay review
  - Annual training budget
