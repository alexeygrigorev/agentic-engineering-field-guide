description: |
  Lithic is the modern card issuing and processing platform
  empowering ambitious financial companies to build the future
  of payments.

  Our infrastructure powers card programs for 100+ innovative
  clients, from fintechs reimagining credit and digital
  banking to platforms transforming disbursements and spend
  management. Companies like Mercury, Flex, and Novo rely on
  Lithic's developer-friendly APIs, direct network
  connections, and flawless reconciliation to launch and scale
  card programs in weeks, not years.

  We're building a future where access to better financial
  products materially improves people's lives, free from the
  constraints of 30-year-old mainframes and legacy processors.
  We're proud to be backed by world-class investors who share
  that vision, including Bessemer Venture Partners, Index
  Ventures, Spark Capital, Stripes, and Mastercard, along with
  many others.

  We're a team of 170+ across 26 states and 7 countries,
  headquartered in New York City.

  We are hiring a Senior Software Engineer for the Product
  Platform team, which owns the foundational layer of our API
  that all other Lithic products build on top. The team’s
  mission is to make Lithic's API the best in fintech —
  reliable, consistent, and a joy to integrate with. This
  includes API Gateway, Events Platform, API key management
  and authorization, audit logging, or API norms and
  versioning strategy.

  What you'll do:

  - Write reliable, secure, and scalable code for Lithic's
    product platform with minimal tech debt
  - Improve the reliability of systems in team’s scope and
    participate in the team on-call rotation
  - Own projects from planning to launch, spanning areas like
    API key management, reliability, audit logging, or search,
    keeping stakeholders informed and aligned along the way
  - Lead efforts to improve systems and processes within the
    team

  What you'll bring:

  - 4+ years building production backend systems, ideally
    including public-facing APIs at scale
  - Experience in or desire to learn Rust; ability to understand
    Lithic’s system written in other programming languages
    (Python, Java)
  - Interest and experience in leveraging AI tools to enhance
    productivity
  - Ability to navigate ambiguity, align diverse perspectives,
    and drive toward practical solutions
  - Experience with API design fundamentals and product
    thinking: versioning, backward compatibility, schema-
    driven development, and weighing tradeoffs from the
    customer's perspective
  - Comfort with designing systems from scratch and owning the
    product development process end-to-end
  - Strong written communication skills and experience working
    in a remote, async-first team that’s spread across time
    zones

  The annual US salary range for this role is $160,000 to
  $200,000 plus equity. This salary range may be inclusive of
  several career levels at Lithic and will be narrowed during
  the interview process based on the candidate’s experience
  and qualifications.

  This is a remote position. However, candidates must be
  located in the United States, Canada (Ontario or British
  Columbia), Netherlands, Poland, or Czech Republic. We do not
  offer visa sponsorship or assistance.

