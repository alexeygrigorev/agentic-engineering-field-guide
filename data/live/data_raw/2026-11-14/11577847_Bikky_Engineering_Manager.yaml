description: |
  About Bikky

  Restaurants are the heart of our communities - where we go
  to celebrate life’s memorable moments with those we love,
  and find comfort and familiarity in the world. But while the
  digital and data revolutions have transformed other parts of
  commerce and hospitality, restaurants haven’t had the same
  opportunity. The result has been an industry that’s - on
  average - had their profit margins shrink by 5x over the
  past 20 years.

  Bikky was founded on the belief that restaurants deserve the
  same access to data as the largest, most sophisticated
  businesses in the world. We believe that data can
  fundamentally transform the economic model of the entire
  restaurant industry - producing better businesses, more
  jobs, and stronger communities.

  Bikky is based in New York City and has raised over $26
  million in funding to date, most recently with a Series B in
  2026. We’re proud to serve thousands of restaurant locations
  across the U.S., including major brands like Bojangles,
  Dave’s Hot Chicken, and Long John Silver’s.

  About the role

  As Engineering Manager at Bikky, reporting to our co-founder
  and CTO, you’ll lead a senior engineering team responsible
  for customer-facing products, AI-powered analytics, and
  infrastructure.

  This is a hands-on leadership role. In an increasingly AI-
  driven world, a single engineer can accomplish what once
  required an entire team. Your job is to create the
  environment where exceptional engineers can do their best
  work, stay highly engaged, and continue to grow.

  We want to be at the frontier of what modern engineering
  looks like. You’ll help us rethink how software gets built,
  develop the systems and practices to support it, and explore
  what becomes possible as AI fundamentally changes software
  development.

  About you

  Our engineering culture is pragmatic and low ego, with a
  high bar for the quality of our work. We’re looking for a
  leader who is as strong an engineer as anyone on the team,
  takes real ownership, and brings clear thinking and sound
  judgment to complex problems.

  The ideal candidate will have:

  - 8+ years of professional software engineering experience,
    including experience leading engineers.
  - A track record of leading strong, senior engineers in a high
    trust environment.
  - Strong technical judgment and the ability to make decisions
    across architecture, product, and execution.
  - Hands-on experience using AI to improve how software is
    built, and a point of view on where it can meaningfully
    increase engineering leverage.
  - A bias toward action and the ability to operate effectively
    with a high degree of autonomy.
  - Experience with our stack (Python, Django, React) is a plus
    but not required.

  Why us

  At Bikky, you'll work on challenging problems that matter to
  real businesses while building a product used by some of the
  best-known restaurants in the country. Restaurant operators
  have been underserved by the technical community and deserve
  better tools.

  You'll lead a fully senior/staff-level team with deep
  experience in their domains. We're low drama and high
  productivity. Many of us are startup veterans, and we feel
  we're working at an "adult's startup": all the benefits of
  an early-stage company without the chaos. You'll also get to
  define what engineering leadership looks like in an AI-
  native company, rather than inherit someone else's playbook.

  Perks and Benefits

  - Competitive cash compensation
  - Generous equity compensation
  - Top-tier health insurance including medical, vision, and
    dental
  - Ability to participate in a 401k
  - Hybrid working environment. For candidates in New York City,
    our team works from the office 3 to 4 days per week.
  - Flexible vacation policy
