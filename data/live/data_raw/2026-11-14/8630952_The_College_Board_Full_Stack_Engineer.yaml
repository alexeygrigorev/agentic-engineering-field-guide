description: |
  Full Stack Engineer

  College Board – Technology

  Location: This is a remote role. Candidates who live near CB
  offices have the option of being fully remote or hybrid
  (Tuesday and Wednesday in office). All CB employees are
  required to occasionally travel to meet in person for
  business purposes.

  Type: This is a full-time position



  About Technology at College Board

  We are a mission-driven engineering team building and
  evolving the technology that powers and protects the future
  of learning. Our systems support highly trusted education
  programs used by millions of students each year, operating
  at significant scale and public responsibility. Today, we
  are focused on designing and delivering a critical new
  initiative that extends our platform in meaningful ways:
  blending foundational system work with thoughtful
  experimentation as we adapt to emerging technologies and new
  learner needs. We combine modern, cloud-native engineering
  practices with years of platform modernization, security
  hardening, and large-scale digital delivery, operating as an
  experiment factory that tests assumptions and iterates based
  on evidence rather than tradition. What makes this team
  distinct is the rare combination of meaningful public
  impact, platform-scale technical challenges, and the freedom
  to shape how mission-critical systems are built and evolved.



  About the Team

  The Core Assessment Platform is a group of cross-functional
  teams responsible for building and evolving shared platform
  capabilities that support assessment-related systems used by
  institutions at scale. The work spans a range of assessment
  contexts, from routine evaluation to more complex, high-
  stakes environments, where accuracy, consistency, and trust
  are essential. Teams collaborate across engineering,
  product, design, data, and operations to build reliable
  capabilities that can be reused and adapted over time. What
  makes this group special is its focus on continuous
  learning, experimentation, and steady improvement, with
  success driven by thoughtful collaboration, iteration, and
  careful decision-making in environments where reliability
  and quality matter.



  About the Opportunity  

  As a Full Stack Engineer, this role plays a key part in
  building and evolving shared platform capabilities within
  Core Assessment Platforms. Engineers at this level work
  across the stack to design, implement, and improve systems
  that must balance experimentation with reliability at scale.
  You’ll collaborate closely with other engineers and cross-
  functional partners to make sound technical decisions in
  complex, often ambiguous problem spaces. The position offers
  the opportunity to influence architecture, engineering
  standards, and technical direction while continuing to grow
  as a builder. Success comes from strong execution,
  thoughtful tradeoffs, and a willingness to learn and adapt
  as systems and requirements evolve.



  In this role, you will:

  Design & Implementation (50%)

  - Deliver transformative software solutions using modern
    technologies, building component-driven, scalable, secure,
    and cost-effective systems that elevate our product
    ecosystem and accelerate innovation.

  - Champion engineering excellence by collaborating closely
    with product owners, architects, and stakeholders to
    ensure our systems and services meet the highest standards
    of quality and reliability.

  - Translate new product capabilities into actionable
    engineering work, breaking down complex ideas into clear,
    testable, functional components.

  - Drive best-in-class delivery by applying Agile, CI/CD, and
    DevOps practices to create solutions that are robust,
    maintainable, and built for continuous improvement.



  Team Operations & Success (25%)

  - Lead and contribute to Agile ceremonies, from sprint
    planning to daily stand-ups, to help your team align,
    deliver, and continuously improve.

  - Elevate team performance by participating in (and sometimes
    leading) peer reviews that strengthen code quality,
    architecture, and engineering rigor.

  - Support production excellence by helping diagnose and
    resolve issues quickly and effectively.

  - Uphold and evolve engineering standards, ensuring compliance
    with security and development best practices.

  - Embrace CI/CD culture, continuously refining pipelines and
    delivery workflows to ship high-quality code with speed
    and confidence.

  - Invest in your own growth by continually expanding your
    skills to thrive in a collaborative, poly-skilled Agile
    environment.



  Software Solutioning & Design (25%)

  - Deeply understand customer needs and business processes,
    ensuring every solution delivers tangible value and aligns
    with real-world workflows.

  - Collaborate with architects, lead engineers, and data
    partners to evaluate new features, estimate complexity,
    and shape sprint plans.

  - Contribute to a culture of thoughtful design and technical
    excellence by conducting and participating in peer design
    and code reviews.



  About you, you have:

  - 4+ years of production level software development experience
    managing the entire lifecycle of features, including
    design, development, documentation, and deployment, with a
    focus on clear and accurate interfaces and integrations.

  - Proficiency in reviewing and improving code structure and
    architecture for testability, maintainability, and
    scalability, with hands-on experience in modern coding
    frameworks (JavaScript/TypeScript, React, Node.js), and
    AWS Serverless technologies.

  - Strong problem-solving skills, working collaboratively with
    team members to identify and resolve issues, and
    partnering with Product Owners to prioritize backlog.

  - Proven ability to pitch new ideas and implement improved
    systems and processes, delivering excellent results.

  - Effective communicator and team lead, able to provide
    actionable feedback, mentor team members, and participate
    in interviews to evaluate engineering talent.

  - Ability to travel 3-5 times a year to our NYC or Reston, VA
    office.

  - Authorization to work in the United States.



  All roles at College Board require:

  - A passion for expanding educational and career opportunities
    and mission-driven work

  - Authorization to work in the United States for any employer

  - Curiosity and enthusiasm for emerging technologies, with a
    willingness to experiment with and adopt new AI-driven
    solutions and a comfort learning and applying new digital
    tools independently and proactively.

  - Clear and concise communication skills, written and verbal

  - A learner's mindset and a commitment to growth: welcoming
    diverse perspectives, giving and receiving timely,
    respectful feedback, and continuously improving through
    iterative learning and user input.

  - A drive for impact and excellence: solving complex problems,
    making data-informed decisions, prioritizing what matters
    most, and continuously improving through learning, user
    input, and external benchmarking.

  - A collaborative and empathetic approach: working across
    differences, fostering trust, and contributing to a
    culture of shared success.



  About Our Process 

  - Application review will begin immediately and will continue
    until the position is filled. This role is expected to
    accept applications for a minimum of 5 business days.

  - While the hiring process may vary, it generally includes:
    resume and application submission, recruiter phone/video
    screen, hiring manager interview, performance exercise, a
    panel interview, a conversation with leadership and
    reference checks.



  What We Offer

  At College Board, we offer more than just a paycheck, we
  provide a meaningful career, a supportive team, and a
  comprehensive package designed to help you thrive. We’re a
  self-sustaining nonprofit that believes in fair and
  competitive compensation, grounded in your qualifications,
  experience, impact, and the market.



  A Thoughtful Approach to Compensation

  - The hiring range for this role is $128,000 - $183,000

  - Your exact salary will depend on your location, experience,
    and how your background compares to others in similar
    roles at the College Board.

  - We aim to make our best offer upfront—rooted in fairness,
    transparency, and market data.

  - We adjust salaries by location to ensure fairness, no matter
    where you live.



  You’ll have open, transparent conversations about
  compensation, benefits, and what it’s like to work at
  College Board throughout your hiring process. Check out our
  careers page for more.

