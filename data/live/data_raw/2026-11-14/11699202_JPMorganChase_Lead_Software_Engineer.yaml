description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.
  As a Lead Software Engineer at JPMorganChase within the
  Cybersecurity and Technology Controls line of business, you
  are an integral part of an agile team that works to enhance,
  build, and deliver trusted market-leading technology
  products in a secure, stable, and scalable way. As a core
  technical contributor, you are responsible for conducting
  critical technology solutions across multiple technical
  areas within various business functions in support of the
  firm’s business objectives. Job responsibilities

  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    breakdown technical problems
  - Develops secure and high-quality production code, and
    reviews and debugs code written by others
  - Drives team adoption of enterprise-authorized AI-assisted
    engineering practices within the work environment to
    improve code quality, delivery speed, and operational
    outcomes (e.g., AI-assisted code review/refactoring, test
    strategy acceleration, incident/root-cause analysis
    support), while establishing consistent validation
    standards (secure coding, peer review, automated testing)
    and promoting reuse of effective patterns across the team.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.
  - Identifies opportunities to eliminate or automate
    remediation of recurring issues to improve overall
    operational stability of software applications and systems
  - Leads evaluation sessions with internal teams to drive
    outcomes-oriented probing of architectural designs,
    technical credentials, and applicability for use within
    existing systems and information architecture
  - Designs and evolves platform components and data pipelines
    leveraging technologies such as Apache Flink, ClickHouse,
    Trino, dbt, Kestra, Apache Iceberg, and PostgreSQL, with a
    strong focus on resiliency, observability, and secure-by-
    design implementation. Builds and integrates micro front-
    ends and user interfaces to deliver usable workflows and
    interfaces for internal stakeholders.

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 5+ years applied experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Advanced in one or more programming language(s)
  - Demonstrated experience leading effective use of approved
    AI-assisted software development tools (e.g., for coding,
    code review, test acceleration, troubleshooting) with the
    ability to set team expectations for validating AI outputs
    for correctness, performance, and security.
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    engineers on safe, compliant adoption within delivery
    practices
  - Proficient in all aspects of the Software Development Life
    Cycle
  - Advanced understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security

  Preferred qualifications, capabilities, and skills

  - Experience operating distributed data platforms in
    production (e.g., Apache Flink, Trino), including
    reliability, performance tuning, and operational support.
  - Experience designing and building data pipelines and data
    models with strong data quality, lineage, and
    recoverability patterns; familiarity with orchestration
    solutions, dbt, and lakehouse table formats such as Apache
    Iceberg.
  - Experience delivering solutions across hybrid environments
    (on‑premises and public cloud), including secure
    connectivity patterns, observability, access controls, and
    cost/performance considerations.
  - Strong backend engineering experience (e.g., Java for
    platform services and Python for automation/integration).
  - Experience building modern user interfaces and micro-
    frontends with JavaScript or TypeScript and frameworks
    such as React or Angular.
  - Strong ability to work independently to identify problems
    end to end and deliver solutions - applying design
    thinking and troubleshooting to drive issues to root cause
    and resolution.

