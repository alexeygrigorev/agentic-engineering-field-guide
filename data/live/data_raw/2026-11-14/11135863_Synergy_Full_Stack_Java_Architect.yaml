description: |
  Synergy Business Innovation & Solutions is a premier
  implementer of cutting-edge software solutions. Synergy
  brings the experience and expertise necessary to deliver
  capability that provides tangible ROI to our customers. Our
  core areas of expertise are in the fields of Digital
  Transformation, Cloud Solutions, SaaS and Low-Code/No-Code
  Solutions, Emerging Technologies, Data Analytics and
  Visualization, Information Assurance, and Business Process
  Re-Engineering.

  Synergy offers its employees a generous portfolio of core
  and voluntary benefits including: group medical, dental, and
  vision insurance, company paid life, short-term, and long-
  term disability insurance, HSA, FSA, 401(k) with company
  match, PTO & Bonus Leave, 11 paid federal holidays, parental
  leave, tuition and training reimbursement, a referral bonus
  program, and well-being programs.

  At Synergy, you’ll be challenged and given the opportunity
  to grow in your career path. In fact, growth is such a big
  deal to us that we have career mentors available for every
  employee, company-funded certification opportunities,
  education reimbursement, and a general open-door policy so
  that you have support when you need it. Our team is eager to
  learn, fast-paced, and quality-driven. If that sounds like
  you, Synergy has a position for you!

  Description:

  - This position is responsible for the full life cycle
    software architecture design and development software
    products that enable change, growth, and flexibility. We
    are seeking an experienced hands-on full-stack software
    architect/engineer. The Java/JavaScript Architect will be
    a customer-facing technical leader of development, will
    function within a team and work in cross-functional groups
    with the ability to thrive in a scaled agile environment.

  Essential Functions & Duties:

  - Full stack developer:  JavaScript, Java, Postgres
  - Develops and supports complex Spring and OSGI java software
    assets
  - Develops and supports complex browser single-page
    applications using ExtJs, Material UI and custom
    JavaScript
  - Expert in JavaScript and Java
  - Experience with Angular
  - Experience with Maven or Gradle
  - Expert with RDBs and SQL, Postgres or Oracle a plus
  - Develops and supports complex Atlassian
    Jira/Confluence/Crowd Plugins
  - Expert using web APIs, REST, SOAP and custom
  - Experienced using web security patterns like OAuth and CAS
  - Expert in using Git
  - Experienced using Jira and Confluence
  - Advisor for patterns, templates, practices, coding standards
    and metrics for their application area(s).
  - Manages adherence to non-functional requirements for their
    application(s).
  - Owns the as-built catalog of how the system is built, and
    what behavior it is responsible for.
  - Drives the vision and roadmap regarding architectural design
    of the application(s).
  - Ensure application(s) can respond to scale and avoid
    dependency blocking by applying SOLID design principles.
  - Designs software solutions to fulfill requirements gathered
    from the customer using class diagrams, component
    diagrams, and entity relationship diagrams.
  - Coordinates with Technical Leads on technology choices and
    pattern adoption.
  - In coordination with the Technical Leads and Scrum Master
    drives the application of the technology to the current
    business challenges.
  - Become intimately familiar with our business model and
    processes to influence the strategy and direction of
    product development.
  - Ability and desire to interact daily with coworkers and
    leadership.
  - Exhibit excellent problem solving and data analysis skills
  - Proven ability to work independently and collaboratively
  - Work at the highest technical level in all phases of
    application development, systems analysis, and data
    manipulation
  - Exceptional communication skills
  - Work well with an established team
  - Excel in rapidly changing environments
  - Ability to analyze and assume ownership of someone else’s
    code
  - Discipline to document code
  - Ability to manage multiple tasks with varying priorities
  - Ability to communicate ideas in a variety of formats
  - Experience with BPM frameworks (Appian, JBoss BPM, etc.)
  - Experience with SCRUM/Agile development, including working
    on a distributed team
  - Experience using SoapUI, Postman or similar tool for testing
    web services
  - Web accessibility knowledge WCAG 2.0/Section 508

  Skills, Qualifications and Certifications of Best
  Candidates:

  - The ideal candidate will be accustomed to working in a very
    fast paced team environment. Must be decisive, drive
    results through others and offer constructive criticism
    when appropriate. Additional attributes needed:
  - 9+ Years - Experience in Java, JavaScript and Database
    software design, implementation, and deployment preferred
  - Experience planning, leading, and executing software and IT
    projects across a wide range of size, complexity, and
    technologies.
  - Advanced knowledge in Java application technology including
    Linux, Spring boot, Maven, IntelliJ, Eclipse
  - Basic Bash and SSH experience on RHEL

  Citizenship or Work Authorization Required:

  - Ability to obtain and maintain Federal Government Position
    of Trust
  - Must be a U.S. citizen.
  - Must pass a background investigation.

  Preferred Education & Experience:

  - Bachelor’s degree in Computer Science or Engineering or
    related field
  - 8750 Compliant Security Certification (CASP CE, CISSP)

  Target Salary Range

  Compensation for roles at Synergy is determined by a variety
  of factors including, but not limited to, the requirements
  of the role; level of experience; education and
  certifications; the individual’s combination of knowledge,
  skills, and abilities; as well as alignment with market
  data, federal and state laws, and other business and
  contract considerations. The estimated pay range for this
  position is: $133,000.00 – $190,000.00. The disclosed range
  has not been adjusted for the applicable geographic
  differential associated with the location at which the
  position may be filled. It is not typical for an individual
  to be hired at or near the top of the range for their role,
  and compensation decisions are dependent on the facts and
  circumstances of each case and represent just one component
  of Synergy’s total compensation package for employees.

