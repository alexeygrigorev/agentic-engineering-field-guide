description: |
  About Liberate

  Liberate is the System of Action for Insurance. We build
  insurance-native AI agents that resolve customer requests
  end to end across sales, service and claims for P&C
  carriers, agencies, MGAs and TPAs. Our voice-first agent,
  Nicole, answers customers instantly, completes the work
  inside the core systems insurers already run, and brings in
  a person with full context when a conversation needs one.
  Today Liberate supports insurance operations representing
  over $100B in premium volume.

  We have raised $72M to date, including a $50M Series B led
  by Battery Ventures in October 2025, with participation from
  Redpoint Ventures, Eclipse, Canapi Ventures and Commerce
  Ventures. Marcus Ryu, former CEO of Guidewire, sits on our
  board.

  The role

  As Solutions Engineering Manager, you are a player/coach on
  our go-to-market team. You carry your own deals as a sales-
  oriented technical consultant, owning the technical side of
  the pre-sale process from first discovery through signature.

  On top of your own deals, you manage a small team of
  Solutions Engineers. You set the standard for how we run
  technical discovery, demos and scoping, and you coach the
  team to meet it. Expect to do both every week: you will be
  in front of customers as much as you are leading the team.

  What you'll do

  Your own deals

  - Run technical and security discovery, build and deliver
    tailored demos, and help define the fit and scope of each
    solution with the customer.
  - Lead functional and technical workshops, and own the
    solution design and statement of work through approval and
    signature.
  - Own responses to RFPs, procurement and security
    questionnaires, along with integration and architecture
    documentation.
  - Hand each signed deal to the Deployment team, and scope new
    use cases and later phases with the account owner.

  Team management

  - Coach your Solutions Engineers on discovery, demos and the
    quality of their scoping work.
  - Set the team's standard for technical discovery.
  - Own the interview bar and screening process for Solutions
    Engineering candidates.
  - Run the team's operating cadence.

  Coverage

  - Balance deal coverage across the team and raise capacity
    issues early.

  What you'll bring

  Must have

  - 7 to 10+ years in solutions engineering or solutions
    consulting, including experience leading or managing
    Solutions Engineers while carrying your own deals.
  - Experience with CCaaS, UCaaS or voice AI platforms.
  - Hands-on experience with LLMs.
  - Executive presence and a consultative approach to discovery
    with business and IT stakeholders.
  - The ability to build and run demos yourself.
  - Working knowledge of APIs and integration patterns.
  - High ownership, urgency and comfort with the pace of a
    growing startup.

  Nice to have

  - Experience with insurance core systems such as Guidewire,
    Duck Creek or agency management systems.
  - Knowledge of P&C workflows across claims, sales and service.

  Compensation: $210,000 - $240,000 Base + Variable + Equity
