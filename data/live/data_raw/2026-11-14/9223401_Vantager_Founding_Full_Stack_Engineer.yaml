description: |
  About Vantager

  At Vantager, we're shaping the future of global capital
  allocation. We're building an AI-native platform that
  redefines how investors interact with private market
  financial data, areas traditionally challenged by
  unstructured data and limited regulation. We're on a high-
  growth trajectory, VC backed by world-class investors and
  unicorn fintech founders. Our platform is already empowering
  over 20 investment firms, collectively managing more than
  $100B in assets, to work faster through workflow automation
  and make smarter, data-driven decisions.

  Our mission is bold, our technology cutting-edge, and our
  team is the driving force behind our success. We believe in
  the power of innovation, the importance of integrity, and
  the necessity of a collaborative environment. Our culture
  fosters creativity and encourages each individual to take
  ownership of their work. Here, every idea matters, and every
  contribution counts.

  What we're looking for

  Vantager is seeking a passionate and experienced Founding
  Full Stack Engineer. This role is perfect for a self-driven
  software engineer who's excited about building intuitive
  user interfaces and robust backend systems for AI-native
  applications. At Vantager, you'll work alongside some of the
  brightest minds in the industry, tackling challenging
  problems and making a real impact.

  If you're passionate about creating seamless user
  experiences, working with cutting-edge tech, and eager to
  grow in a dynamic environment, Vantager is the place for
  you. We're looking for independent and ambitious talent who
  are ready to push the boundaries of what's possible and
  redefine the investment landscape. Join us, and together,
  let's build something extraordinary.

  Responsibilities

  - Design and implement intuitive user interfaces for our
    platform using Next.js (React)

  - Architect and develop robust backend systems to support our
    AI-native platform

  - Take ownership of critical system components, from frontend
    to backend

  - Implement advanced data tables, charting, and text streaming
    functionality

  - Iterate on customer feedback to continuously improve user
    experience

  - Integrate and optimize interactions with large language
    model APIs

  Qualifications

  - 3+ years of software engineering experience, with strong
    proficiency in our tech stack: TypeScript, Next.js
    (React), Python, FastAPI, and relational databases
    (MySQL/Postgres)

  - Demonstrated expertise in building and deploying full-stack
    web applications

  - Strong understanding of frontend design principles and
    modern UI/UX best practices

  - Experience working with RESTful APIs and integrating third-
    party services

  - Familiarity with AI concepts, including LLMs, RAG systems,
    and vector databases

  - Self-motivated with excellent problem-solving and
    communication skills

  Bonus Points

  - Degree from a top-tier university in Computer Science or a
    related field

  - Experience in the finance, trading, or investment sectors

  - Knowledge of data visualization libraries and techniques

  - Contributions to open-source projects or personal side
    projects

  - Experience with cloud platforms (AWS), serverless
    architecture, and Docker

  - Previous experience at a startup or small-mid sized company

  Compensation

  - $100k - $180k salary

  - 0.5% - 1.5% equity
