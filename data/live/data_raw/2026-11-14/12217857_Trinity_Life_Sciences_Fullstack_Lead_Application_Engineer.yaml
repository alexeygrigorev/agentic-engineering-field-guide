description: |
  Hybrid (NYC or Waltham)

  We are seeking a full stack Lead Application Engineer to
  join Trinity’s dynamic software development team in enabling
  novel applications that are revolutionizing the life
  sciences commercial model through technology and AI.

  Trinity’s product development efforts are focused on
  creating transformative products that address our
  biotechnology and pharmaceutical clients’ most challenging
  problems in commercializing novel therapeutics. Our
  solutions are shaped in conjunction with Trinity’s expert
  strategic advisors, who are thought leaders shaping the
  industry’s trajectory. Our team has a culture of high-
  velocity and high-quality work, while maintaining a
  collaborative and supportive environment where curiosity and
  innovation is highly valued.

  The ideal candidate is a highly technical, hands-on
  developer with a passion for new technologies and a
  willingness to take ownership of their work product and
  timelines, including constantly learning about the latest
  advancements and new technologies.

  This individual will be expected to exhibit a high degree of
  autonomy and creative problem solving in their work, but
  will also have access to guidance and mentorship from
  engineering and technology leaders with experience across
  both start-ups and larger organizations.

  Position Responsibilities

  Build, release, and iterate on new products/features that
  meet user requirements in collaboration with Product, UI/UX,
  and Data Science:

  - Take ownership in building and/or refining a vertical of the
    technology product, setting direction in alignment with
    Engineering leadership
  - Demonstrate self-sufficiency in scoping, managing timelines,
    and deciding the technical approach for multi-faceted new
    product features
  - Build a strong quality assurance practice that includes
    manual and automated testing
  - Support the design and development of AI-powered agents and
    agentic workflows for life sciences use cases
  - Serve as a go to expert for more junior team members and
    peers



  Qualifications

  Education: Bachelor's or master's degree in computer
  science, or equivalent practical experience

  Work Experience:

  - Serve as a go to expert for more junior team members and
    peers

  Other Qualifications:

  - Agile development experience in fast-paced team environments
  - Full stack development abilities, including experience with
    the following:
    - Typescript/Node.js APIs (must-have)
    - Python
    - React (TSX, CSS)
    - SQL and ORMs (ideally PostgreSQL)
  - Proficiency with tools such as Claude Code, Copilot, Cursor
    for agentic programming
  - Strong skills in troubleshooting and debugging enterprise
    codebases
  - A track record of success in developing, launching, and
    scaling impactful software applications in past/current
    work experience
  - Passion for emerging technologies, database architecture,
    and knowledge of engineering best practices
  - Strong communication, analytical and presentation skills;
    Ability to build credibility with cross-functional teams
    through clear and detailed communication of technical
    concepts, and ability to shape ambiguity
  - Team player who is committed to team success and is willing
    to help fill gaps that arise

  About Trinity

  Trinity powers the future of life sciences commercialization
  through the fusion of human and artificial intelligence. By
  blending deep therapeutic expertise and trusted human
  ingenuity with a purpose-built technology platform, Trinity
  accelerates clarity and confidence at every step of the
  commercialization journey—from pre-launch to scale to loss
  of exclusivity. For more than 30 years, the world’s leading
  pharmaceutical, biotech, and medtech companies have relied
  on Trinity’s foresight, execution, and partnership to
  deliver confident product launches, decisive market
  advantage, and measurable patient impact. During that time,
  Trinity expanded from its first office in Waltham, MA to
  1,300 professionals across 14 offices and five continents,
  setting new industry standards in quality, responsiveness,
  and client partnership. For more information, visit Trinity
  at www.trinitylifesciences.com.

  Trinity’s salary bands account for a wide range of factors
  that are considered in making compensation decisions
  including but not limited to skill sets and market demand
  for skills; level of experience and training; specific
  qualifications, performance, time in role/company,
  geographic location, and other business and organizational
  needs. A reasonable estimate of the current salary range is
  $148,000 - $203,500. In addition to your base salary, you
  will also be eligible for an annual discretionary
  performance bonus.

