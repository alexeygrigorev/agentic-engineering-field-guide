description: |
  SS&C is a leading provider of mission-critical, AI-powered
  technology and services empowering financial services and
  healthcare organizations to work smarter, faster, and
  securely. Founded in 1986, SS&C is headquartered in Windsor,
  Connecticut, and has offices worldwide. More than 23,000
  financial services and healthcare organizations, from the
  world's largest companies to small and mid-market firms,
  rely on SS&C for expertise, scale, and technology.

  Job Description

  Job Title: Staff Full Stack Software Engineer

  Location: San Francisco, CA, Jacksonville, FL, New York, NY,
  Dallas, TX



  About the Role

  The Geneva Web Development team at SS&C Advent is
  modernizing Geneva, our award-winning portfolio management
  and accounting platform used by investment firms around the
  world. We build scalable, modular full-stack applications
  using React, TypeScript, Java, and Spring Boot on a cloud-
  native microservices architecture. As part of the team,
  you'll help shape presentation-layer standards and best
  practices while solving complex distributed-systems problems
  for the global investment management industry.

  Why Join SS&C

  SS&C combines proprietary technology with deep industry
  expertise to support complex financial and health care
  operations. Our teams design, implement, and operate
  solutions that help clients manage data, automate processes,
  and scale their businesses with confidence.



  You will work with industry experts, modern platforms, and
  evolving technologies, gaining exposure to real-world
  operational challenges and large-scale enterprise
  environments.



  How You Will Make an Impact

  - Develop modular and scalable code for front-end applications

  - Work in all phases of software development lifecycle
    including design, research, development, code reviews,
    deployment, and testing.

  - Provide a great user experience for our end users.

  - Work effectively with User Experience, Business Analyst and
    QA teams.

  - Contribute to presentation-layer standards and best
    practices.



  Required Experience

  - 10+ years of professional software engineering experience.

  - 5+ years of frontend development experience, including
    significant hands-on expertise with React, TypeScript,
    JavaScript, HTML, and CSS.

  - 5+ years of backend development experience using Java and
    Spring / Spring Boot.

  - Strong experience designing and developing Single Page
    Applications (SPAs) and integrating them with backend
    services.

  - Strong experience developing REST and/or gRPC APIs.

  - Strong understanding of API design, error handling,
    resiliency, and service-to-service communication.

  - Experience with relational and/or NoSQL databases, including
    query performance and transaction management.

  - Experience with microservices architecture and distributed
    application development.

  - Strong foundation in Computer Science fundamentals,
    including data structures, algorithms, networking,
    operating systems, concurrency, and distributed systems
    concepts.

  - Strong understanding of concurrency, multithreading,
    synchronization, and asynchronous programming

  - Experience with Containers, Kubernetes, and containerized
    application environments.

  - Strong understanding of testing, debugging, performance,
    security, and production support across the full
    application stack.

  - Strong software engineering practices including code
    reviews, automated testing, CI/CD, and maintainable
    application design.



  What Sets You Apart ( qualifications)

  - Experience with messaging and event-driven systems such as
    Kafka, NATS, RabbitMQ, or equivalent.

  - Experience with observability, including logging, metrics,
    tracing, and production diagnostics.

  - Experience with OAuth 2.0, OpenID Connect (OIDC), and
    enterprise identity providers

  - Experience with Jenkins, GitHub Actions, or similar CI/CD
    automation platforms.

  - Experience using AI-assisted software development tools and
    workflows.

  - Experience in Agile development methodologies, Scrum
    preferred.

  - Experience in wealth management or financial services.



