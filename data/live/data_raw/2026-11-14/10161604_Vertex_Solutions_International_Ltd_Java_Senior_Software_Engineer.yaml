  Job Description

  We’re Looking for Java Developer for one of the most
  exciting Financial Service projects that we know of in
  London.

  We ideally need someone who is experienced in Java
  development in Banking/Finance.

  You will get to be a massive part of the development of a
  brand new digital bank! Great opportunity to see something
  coming to life from a clean sheet design!

  You will work in an innovative, High paced environment with
  an opportunity to develop on a new platform from scratch.

  - You should have experience with either Java or Scala or
    Kotlin in your projects Plus high level engineering skill,
    database development, distributed systems design
    capabilities and good engineering mindset

  This would be a 6 Month Rolling contract position – Let's
  have a call to understand more?

