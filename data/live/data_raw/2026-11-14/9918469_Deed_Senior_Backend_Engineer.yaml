description: |
  JOB PURPOSE – WHAT WILL YOU DO:

  The Senior Backend Engineer will work with a team of
  talented engineers to develop scalable and high-performance
  core platform services in a predominantly Spring framework.
  The role focuses on hands-on programming and architecture
  contributions while interfacing with engineering and design
  teams, and quality for our products with an emphasis on
  iteratively learning actions.

  KEY RESPONSIBILITIES – WHAT YOU WILL BE RESPONSIBLE FOR:

  - Assists in defining software architectures – Collaborates
    with leads to explore existing systems, determines areas
    of complexity, potential risks to successful
    implementation, learns the applications capabilities
  - Builds software applications primarily for the JVM platform
    – Follows coding standards, has a great programming
    discipline.
  - Maintain and enhance distributed applications.
  - Maintain and enhance backend and middleware services (micro-
    services style)
  - Build a healthy team environment via professional
    collaboration.
  - Enjoy working in a fast paced and challenging environment.
    Just like a visionary startup.
  - Ownership and responsibility of work.
  - Bring professional attitude at work and belief in team
    effort

  SKILLS/COMPETENCIES REQUIRED – WHAT YOU WILL NEED:

  - Passionate, energetic, driven to achieve progress and growth
    by thinking above and beyond
  - Always hustling and ready to take on big bold bets
  - Customer obsessed, earning their trust and solving their
    problems
  - Results driven, effectively overcoming obstacles and
    challenging the status quo
  - Can act as one team. Able to work with and contribute to a
    team environment towards a shared vision and mission
  - Strong communication and soft skills, able to motivate,
    mentor and help fellow developers as well as communicate
    complex ideas effectively
  - Detail-oriented and exceptional organizational skills
  - Excellent verbal and written communication skills with the
    ability to interact at all levels of the organization
  - Exercises independence and self-motivation while still being
    able to work with others collaboratively
  - Ability to thrive in a fast-paced, entrepreneurial, high-
    energy environment
  - Self-motivated with positive energy

  JOB PREREQUISITES (EDUCATION, PREVIOUS EXPERIENCE ETC)

  - 6+ years of professional experience
  - Bachelor's in Computer Science / Engineering or related
    field
  - Strong proficiency in Java, Spring framework technologies
    and Spring cloud services
  - Deep functional knowledge or hands-on experience in
    Microservices development is a must.
  - Understanding fundamental design principles behind scalable
    applications.
  - Ability to multitask, recommend and enforce industry best
    practices and patterns.
  - Strong understanding the nature of transactional and
    asynchronous programming across microservices topology.
  - Strong understanding of security standards, such as Oauth2
  - Strong experience in SQL/noSQL programming, such as MySQL,
    Elasticsearch
  - Strong experience in Docker containerization
  - Strong experience in Amazon web services
  - Strong understanding of code versioning tools / Source Code
    Management (Git, GitHub, Bitbucket)
  - Ability to operate effectively both independently as well
    and within a team using Agile methodology.
  - Ability to use, track, and respond to all work assignments
    using JIRA based ticketing system
