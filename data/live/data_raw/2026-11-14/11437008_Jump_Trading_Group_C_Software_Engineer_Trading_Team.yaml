description: |
  Jump Trading Group is committed to world class research. We
  empower exceptional talents in Mathematics, Physics, and
  Computer Science to seek scientific boundaries, push through
  them, and apply cutting edge research to global financial
  markets. Our culture is unique. Constant innovation requires
  fearlessness, creativity, intellectual honesty, and a
  relentless competitive streak. We believe in winning
  together and unlocking unique individual talent by incenting
  collaboration and mutual respect. At Jump, research outcomes
  drive more than superior risk adjusted returns. We design,
  develop, and deploy technologies that change our world, fund
  start-ups across industries, and partner with leading global
  research organizations and universities to solve problems.

  Our trading teams are each comprised of a dynamic group of
  traders, quantitative researchers, and engineers who work
  together to examine the global markets, seeking to
  understand the complexities of various traded products and
  exchanges. They leverage their impeccable statistical
  analysis and data mining skills, using the results of their
  research to make forecasts and develop profitable predictive
  trading models.

  What You'll Do:

  - Design, implement, and optimize trading algorithms
  - Collaborate closely with team members to brainstorm,
    experiment, and execute innovative trading strategies
  - Perform comprehensive testing to ensure accuracy, stability,
    and minimize financial risk
  - Continuously improve our trading platform's performance with
    a focus on resource efficiency and hardware optimization
  - Foster a positive working environment and maintain strong
    relationships within the team
  - Other duties as assigned or needed

  Skills You'll Need:

  - Bachelor's or Master's degree in Computer Science,
    Engineering, or a related field
  - 5+ years of experience in C++ development, with expertise in
    algorithmic trading systems
  - Track record of developing, deploying, and maintaining
    market order execution algorithms
  - Experience designing and implementing large-scale data
    processing and modeling systems on high-performance
    computing clusters
  - Exceptional problem-solving skills and an analytical mindset
  - Detail-oriented with a strong commitment to testing and
    quality assurance
  - Excellent communication and interpersonal skills, with a
    humble and cooperative attitude
  - Team player who values collaboration and shared success
  - Reliable and predictable availability

  Benefits include:

  - Private Medical, Vision and Dental Insurance
  - Travel Medical Insurance
  - Group Pension Scheme
  - Group Life Assurance and Income Protection Schemes
  - Paid Parental Leave
  - Parking and Commuter Benefits
