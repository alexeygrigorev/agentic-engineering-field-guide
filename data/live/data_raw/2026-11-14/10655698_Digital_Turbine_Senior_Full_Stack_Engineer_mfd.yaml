description: |
  DT (NASDAQ: APPS) is unifying the full mobile experience.
  Our growth platform powers the mobile ecosystem by bringing
  together advertisers, app developers, and device partners,
  to create a unique and premium value exchange, that results
  in a personalized and seamless mobile device experience.

  At DT, we move fast, think big, and build collaboratively.
  We believe great ideas can come from anywhere, and we trust
  our teams to take ownership, challenge convention, and make
  an impact from day one.

  Here, you’ll have the opportunity to grow your career while
  contributing to products and experiences used by millions
  around the world.

  With us, you will enjoy competitive compensation, equity
  awards, and a comprehensive benefits package designed to
  invest in your total well-being, all within a hybrid and
  flexible work environment.

  We’re always on the lookout for great engineering talent!We
  want to learn about your passion and skills, and find the
  best match for you. Join our talent community by applying
  here, and let’s stay connected for active and future
  roles.The Role

  Digital Turbine runs on small, autonomous pods that own an
  outcome and a roadmap end to end. We hire engineers, not
  language specialists: we care that you can reason about
  systems, pick the right tool for the problem, and ship
  reliable software across the stack.

  As a Senior Full Stack Engineer, you'll build the product
  surfaces that bring our marketplace together — campaign
  management and creation, unified dashboards and reporting,
  audience and asset tooling, and the APIs that connect demand
  to supply. You'll work across front-end, back-end, and data,
  contributing to the unified product architecture at the
  heart of our FY27 roadmap. The underlying platform requires
  heavy back-end engineering, low-latency optimization, and
  algorithmic problem-solving to manage massive throughput and
  real-time marketplace dynamics.

  About the Senior Full Stack Engineer Role

  - Design and build full-stack features — from responsive web
    front-ends to back-end services and APIs — that power
    campaign management, reporting, and marketplace
    optimization
  - Choose the right language and tools for each problem (we run
    a polyglot stack), and keep the front end lightweight by
    pushing complex computational logic, data modeling, and
    heavy algorithmic weight into robust, scalable back-end
    services
  - Build and consume well-designed APIs that integrate DT
    products into a unified architecture rather than isolated
    silos
  - Own your services in production: testing, observability,
    performance, and on-call, treating quality as a whole-team
    responsibility
  - Collaborate directly with product leads and stakeholders,
    contributing to scoping, estimation, and technical
    decisions within your pod
  - Mentor teammates and raise engineering standards through
    code review, automation, and pragmatic architecture

  About You as the Senior Full Stack

  - 8+ years building and shipping production platforms, with a
    heavy skew toward backend architecture, system design, and
    code optimization
  - Strong algorithmic fundamentals, data structures, and a
    proven track record of solving complex data-processing or
    resource optimization problems
  - Demonstrated ability to be effective in more than one
    language/ecosystem (e.g., TypeScript/JavaScript, Java,
    Kotlin, Python, Go, Scala, or C++) — you optimize for the
    problem, not a single tool
  - Solid command of modern front-end frameworks (e.g., React)
    and back-end service design, plus relational and/or
    distributed data stores (MySQL, PostgreSQL, and similar)
  - Strong fundamentals in API design, data modeling, testing,
    and system design
  - Comfort operating in a fast-paced, agile, ownership-driven
    environment with limited hand-holding

  Nice to have

  - Experience with cloud platforms (AWS or GCP), containers,
    and CI/CD
  - Exposure to AdTech, dashboards/BI surfaces, or high-
    throughput data-driven products
  - Experience integrating ML or data services into product
    workflows

  DT (NASDAQ: APPS) is a mobile growth platform that powers
  superior experiences and outcomes for advertisers, app
  developers, carriers, OEMs, and publishers worldwide.

  Our technology connects brands and apps with consumers
  across devices, apps, and mobile environments — helping
  partners drive awareness, acquisition, engagement, and
  monetization through intelligent, integrated experiences.

  Headquartered in Austin, Texas, DT operates globally across
  North America, EMEA, APAC, and LATAM.

  DT is an equal opportunity employer committed to fostering
  an inclusive and diverse workplace. We welcome people of
  different backgrounds, experiences, abilities, and
  perspectives, and believe teams with different points of
  view build better products, ideas, and experiences.
