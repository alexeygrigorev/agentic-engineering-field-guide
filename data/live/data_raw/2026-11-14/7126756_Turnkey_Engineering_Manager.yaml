description: |
  Engineering Manager

  Turnkey is a key management API optimized for security,
  flexibility, and ease-of-use. Founded by the leaders who
  scaled Coinbase Custody from 0 to a $100M+ ARR business,
  Turnkey is rewriting the rules of crypto infrastructure by
  tackling core security at its foundational level. We are
  building a platform that empowers developers to unlock the
  next wave of mass-market crypto applications, solving the
  challenge of secure, flexible key management.

  Much like AWS transformed computing with the advent of
  cloud, Turnkey is the trustless, transparent, and
  decentralized infrastructure that will transform development
  in crypto.

  We are seeking an Engineering Manager to drive growth
  throughout our engineering organization. If you’re excited
  about the potential that web3 has to radically change the
  world for the better and have a sincere desire to help
  facilitate that change, join us as we redefine decentralized
  development.

  What You’ll Do:

  Strategic Vision and Leadership

  - Develop and articulate the overarching engineering strategy
    and technical vision
  - Manage a high-performing engineering team and guide the
    development of Turnkey’s product and infrastructure
  - Identify and evaluate emerging technologies and trends in
    web3 and guide their integration into our product and
    infrastructure

  - Collaborate with leadership to drive recruitment and
    onboarding of top engineering talent
  - Contribute to overall strategic planning and technical
    decision making

  Architectural Oversight & Technical Direction

  - Provide strategic technical guidance and leadership,
    ensuring intelligent architectural decisions that support
    our long-term goals

  - Oversee the design and implementation of modern application
    architectures, optimized for the unique challenges of web3
  - Ensure the scalability, security, and reliability of our
    infrastructure, addressing the complexities of
    decentralized systems
  - Contribute to defining and delivering processes that drive
    quality & consistency to our product & infrastructure
    development

  What We’re Looking For:

  - Previous managerial experience

  - An understanding of modern application architectures and
    ability to lead in-depth discussions on how they should be
    developed and deployed
  - Excellence at holding a high-bar on software and the
    requisite engineering processes
  - A healthy amount of paranoia:-)

  Style points

  - Prior experience working in fast-paced technology companies
  - Actively tracking developments in the crypto ecosystem and
    opinionated on where it’s going

  What We Offer

  - Full benefits, including medical, dental, vision, life,
    disability, HSA/FSA, 401(k) - detailed benefits overview
    available as we get further in the process
  - Paid parental leave
  - Unlimited PTO (and we will force you to take time off!)
  - $3,000/yr learning and development budget to attend industry
    conferences
  - Multiple team offsites per year
  - Macbook Pro laptop
  - Lunch stipend (for those physically in the New York City
    office)

  Please note that while the team is remote, we are only
  considering candidates who are physically based in the
  United States and Canada at the current time.

  Turnkey is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, protected
  veteran status, or any other characteristic protected by
  law. We encourage individuals of all backgrounds to apply.
