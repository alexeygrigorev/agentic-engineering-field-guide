description: |
  About LemonEdge

  Private markets run on numbers that have to be right. Yet
  much of the industry still relies on spreadsheets and manual
  processes to manage increasingly complex financial
  operations.

  LemonEdge is building the next generation of accounting
  technology to change that. Our platform helps fund
  administrators and asset managers automate complexity,
  improve accuracy, and scale with confidence.

  The engineering challenge is significant: building software
  that makes complex financial processes simpler, more
  reliable, and more transparent. Every calculation matter,
  and every feature needs to stand up to real-world scrutiny.

  What We're Looking for

  We’re looking for a Junior Software Engineer ready to take
  ownership of meaningful work, from the first conversation in
  refinement through development, testing, and production.

  At LemonEdge, you won’t just be picking up tasks and passing
  them along. You’ll own your stories end to end, make
  thoughtful engineering decisions, and grow toward taking
  responsibility for an entire component.

  This is a full-stack engineering role with a strong backend
  focus: approximately 75% server-side development in C# /
  .NET and 25% frontend across our WPF desktop application and
  React web application.



  What You'll Do

  - Own your work end to end. Take stories from refinement
    through design, development, testing, and production
    deployment. Follow through to make sure your changes work
    as expected in a live environment.

  - Build for accuracy. Validate outputs against expected
    results, investigate discrepancies, and test edge cases
    rather than relying solely on happy-path scenarios.

  - Make thoughtful engineering decisions. Work within our
    existing architecture and modules, write maintainable
    code, and understand and communicate the trade-offs behind
    your approach.

  - Use AI thoughtfully. Leverage AI-assisted development tools
    where they add value, while applying appropriate scrutiny,
    testing, and verification based on the risk and complexity
    of each change.

  - Take responsibility for what you ship. Participate in a
    light on-call rotation, using established runbooks and
    working alongside experienced engineers when issues need
    escalation.

  - Bring clarity to complexity. Ask questions, engage the right
    stakeholders, and turn ambiguous requirements into well-
    defined, actionable work.

  What You'll Bring

  - Professional experience developing and shipping software,
    with evidence that you can take work from start to finish
    with limited supervision.

  - Proficiency in at least one statically typed programming
    language, such as C#, Java, Go, or TypeScript. Our primary
    technology stack is C# / .NET.

  - Solid SQL skills, including working with relational data
    models, writing queries, and understanding query execution
    plans.

  - A strong testing mindset, with an appreciation for edge
    cases, validation, and the importance of verifying AI-
    generated code.

  - An understanding of secure development fundamentals,
    including input validation and protecting sensitive
    information in code, logs, and application workflows.

  - A structured approach to debugging: forming hypotheses,
    using debuggers and logs to investigate issues, and
    understanding why problems occur rather than simply fixing
    symptoms.

  - Clear, proactive communication skills, including writing
    useful pull request descriptions, responding
    constructively to feedback, and raising blockers early.

  Bonus Points If You Bring

  - Professional experience with C# / .NET.

  - Experience integrating with external services, including
    appropriate use of timeouts, retries, and idempotency.

  - Experience writing reversible database migrations and
    validating them against realistic data.

  - Familiarity with cloud-hosted SaaS applications, CI/CD
    pipelines, or containerized environments.

  - Exposure to finance, accounting, or another domain where
    accuracy, consistency, and reconciliation are critical.

  - Frontend development experience, particularly with WPF or
    React.

  - Hands-on experience with agentic AI workflows or building
    AI-powered capabilities into a product.

