description: |
  About the company

  Our client is a fast-growing technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Take ownership of the browser-based side of a consumer
  product, setting its technical direction and shaping the
  user experience from the ground up. Partner closely with the
  founders to influence both product and engineering
  priorities as an early hire.

  What you'll do

  - Lead the design and build of a consumer-facing web product.

  - Craft responsive, intuitive screens for transactions and
    account overviews.

  - Set frontend architecture direction, including state
    handling and live data updates.

  - Help shape APIs and transaction flows that link backend
    systems to a smooth user experience.

  - Work side by side with the founders on the product and
    engineering roadmap.

  - Help foster a culture of ownership and quick delivery as one
    of the first engineers.

  Requirements

  What we're looking for

  - 2 to 8 years of frontend experience, or full-stack
    experience with a frontend emphasis.

  - Background at a fintech, trading or crypto technology
    company.

  - Proven history of launching refined web products for
    everyday consumers.

  - Strong React skills.

  - Solid grasp of speed, stability and managing intricate
    client-side state.

  - Good product sense, caring about how a product behaves and
    feels as well as how it looks.

  - Enjoys working in a lean, rapidly moving environment.

  - Able to work from the office 4 to 5 days per week.

  - Non-traditional learning paths, such as bootcamps or self-
    study, are welcome.

  Bonus points

  - Prior work on trading or fintech products.

  - Experience with live data feeds and charting.

  Benefits

  Compensation and benefits

  - Base salary: USD 175,000 to 225,000 per year

  - Equity

  - Health insurance

  Location and work model

  - New York City, NY, United States

  - On-site, 4 to 5 days per week in office

  - Full-time
