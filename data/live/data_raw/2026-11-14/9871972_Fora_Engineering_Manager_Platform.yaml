description: |
  About Fora

  Fora is the modern travel agency, empowering the next
  generation of entrepreneurs to build thriving travel
  advisory businesses. We're modernizing the $100B+ travel
  industry with AI woven through every part of the advisor's
  workflow, plus global supplier relationships, personalized
  training, and a vibrant community, all in one place. That's
  what lets advisors build businesses that scale, while their
  taste and service create trips no algorithm alone could
  plan. At the heart of it all is our mission: to help the
  next generation of travel entrepreneurs turn their love for
  travel into a fulfilling career, whether full-time or part-
  time.

  We're mission-driven and obsessed with our customers, and we
  believe humans and AI are both essential: the best work here
  comes from people and technology at their best, together.
  That's not just a philosophy about our product, it's how we
  build our team. Everyone at Fora gets hands-on with frontier
  AI tooling as part of the job. At Fora, you'll learn to be
  AI-fluent, with real experience applying AI to solve
  problems day to day, wherever you sit in the company.

  Founded in 2021, Fora has grown to a team of 250+ full-time
  employees based in downtown New York City. In 2026, we
  closed a $60 million Series D led by Forerunner and Tactile
  Ventures, with continued backing from Thrive Capital,
  Insight Partners, and Heartcore Capital. We've been named a
  LinkedIn Top Startup (2024), one of Fast Company's Most
  Innovative Companies (2023 and 2025), and one of TIME's 100
  Most Influential Companies (2026).

  Come build something that hasn't existed before.

  Engineering Manager, PlatformAbout The Role

  Fora Travel is seeking an Engineering Manager to lead and
  grow the Platform Team, the foundational engineering group
  responsible for the reliability, scalability, and developer
  experience that powers Fora's entire product suite. Our
  platform spans cloud infrastructure, CI/CD pipelines,
  observability systems, security, and the core tooling that
  lets every engineering team at Fora move fast and ship with
  confidence.

  You will manage a team of talented engineers and work
  closely with Engineering leadership and cross-functional
  stakeholders to set the technical direction of our platform,
  drive meaningful improvements to developer productivity, and
  ensure our systems are built to scale with the business.
  This role is for someone who is equally energized by
  developing people and staying close to the architecture.

  Key Responsibilities

  - Lead and grow a cross-functional platform team, managing
    day-to-day execution, setting clear priorities, and
    maintaining sustainable, high-quality engineering
    practices.
  - Stay hands-on with architecture and technical decisions,
    providing meaningful guidance on infrastructure design,
    platform scalability, and engineering standards across the
    team's scope.
  - Own the roadmap for foundational platform capabilities
    including CI/CD pipelines, cloud infrastructure,
    observability, secrets management, and database
    reliability.
  - Partner with engineering teams across Fora to establish
    SLOs, support reliability targets, and ensure platform
    systems meet the demands of a growing product
    organization.
  - Coach and develop engineers through regular feedback,
    mentorship, and career development, with a commitment to
    building a motivated and high-performing team.
  - Oversee relationships with contractors and embedded vendor
    resources, ensuring work is well-scoped, integrated
    effectively, and held to Fora's engineering standards.
  - Collaborate with security-focused engineering efforts to
    ensure the platform reflects strong security and
    compliance practices, including network segmentation,
    secrets management, and access controls.
  - Foster a collaborative and inclusive team environment that
    reflects Fora's commitment to building diverse, high-
    performing engineering teams.
  - Contribute to recruiting by evaluating engineering
    candidates effectively and representing Fora positively
    throughout the process.

  Requirements

  - 4+ years of experience in engineering management with a
    proven track record of successful delivery and team
    growth.
  - 8+ years of experience in software or infrastructure
    engineering, with meaningful depth in platform, DevOps, or
    infrastructure domains.
  - Strong technical acumen, with the ability to engage deeply
    in architecture decisions, infrastructure design, and
    engineering fundamentals rather than managing from a
    distance.
  - Solid understanding of cloud infrastructure (AWS preferred),
    container orchestration, CI/CD systems, observability
    tooling, and database reliability at scale.
  - Demonstrated ability to mentor engineers, manage performance
    thoughtfully, and build teams that are engaged and
    growing.
  - Exceptional project management and organizational skills,
    including the ability to break down complex infrastructure
    work, anticipate risks, and deliver consistently high-
    quality outcomes.
  - Excellent communication skills, with the ability to
    translate complex infrastructure and platform concepts
    clearly to both technical and non-technical stakeholders.
  - Proven recruiting experience, including the ability to
    evaluate engineering candidates and represent the company
    well.
  - A collaborative, empathetic leadership style grounded in
    humility, accountability, openness to feedback, and a
    genuine investment in the people around you.
  - Entrepreneurial mindset and comfort working in an early- to
    mid-stage startup environment where ambiguity and pace are
    part of the fun.
  - First-principles thinker who carefully evaluates each
    problem and thoughtfully chooses between established best
    practices and bespoke solutions, especially when designing
    team processes and technical standards.

  Strongly Preferred

  - Experience with high-traffic B2B2C platforms or marketplace
    architectures.
  - Familiarity with Kubernetes, Terraform, PostgreSQL
    administration, and message queue systems such as RabbitMQ
    or Celery.

  Compensation

  Compensation for this role varies based on experience, with
  an indicative range of $210k–$235k + equity. Additional
  benefits include:

  - Unlimited vacation
  - Health Insurance (including an option completely covered by
    Fora HQ)
  - Dental & Vision Insurance
  - Wellhub Memberships
  - 401k plan with company match
  - Commuter Benefits
  - Supplemental Life Insurance
  - Stock Options

  This role is based in our New York City office in
  Tribeca/Fidi, a space with lots of natural light and great
  views.

  Our Values

  We’re forging our own path

  Fora has always been about driving change within the
  industry. We’re not interested in maintaining the status
  quo.

  We’re stronger together

  Community is our cornerstone and collective power is our
  strength. We believe we can all go further when we operate
  together, using our combined leverage to unlock better
  opportunities and outcomes for our advisors, partners, and
  travelers.

  We believe in technology

  We believe technology is an answer to some of the most
  fundamental challenges the travel industry faces. We believe
  advancements in AI, bold investments in our platforms, and a
  world-class data infrastructure will transform the work of
  our advisors and our partners, while creating better travel
  experiences for travelers.

  We’re here to serve

  We operate in service of our community and believe that when
  they’re empowered to focus on what they do best, we all win.
  It’s why we relentlessly advocate for our advisors and
  prioritize their best interest every step of the way.

  We mean business

  Fora is equal parts fun, meaningful work and serious travel
  business. We’re unlocking opportunities for thousands of
  travel entrepreneurs, delivering a stream of high-quality
  guests at scale for our partners, and providing a superior
  travel experience for our travelers. It’s a better equation
  for the future of our industry.

  WORK AUTHORIZATION

  Authorization to work in the United States is required for
  full-time roles based in our New York City office. Fora is
  unable to sponsor or assist with U.S. work authorization.
  Roles based outside of the United States are not subject to
  this requirement.

  EQUAL OPPORTUNITY

  Fora is committed to an equitable hiring process and an
  inclusive work environment. BIPOC and traditionally
  underrepresented candidates are strongly encouraged to
  apply. We will not discriminate and will take action to
  ensure against discrimination in employment, recruitment,
  advertisements for employment, compensation, termination,
  upgrading, promotions, and other conditions of employment
  against any employee or job applicant on the bases of race,
  color, gender, national origin, age, religion, creed,
  disability, veteran's status, sexual orientation, gender
  identity, gender expression or any other characteristic
  protected by law.
