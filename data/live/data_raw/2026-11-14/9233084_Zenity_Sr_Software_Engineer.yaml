description: |
  Description

  About Us:

  Zenity is the leader in AI Agent Security and the first
  company to bring an agent-centric security platform to
  market. As enterprises accelerate AI agent adoption, we are
  establishing the security framework for how AI agents are
  secured and governed at enterprise scale.

  We deliver full-lifecycle visibility, governance, detection,
  prevention, and response for AI agents from build time to
  runtime, across SaaS, home-grown platforms, and end-user
  devices. Backed by $180M+ in total funding, including a
  $125M Series C led by Norwest, with participation from
  SoftBank Vision Fund 2 and Microsoft's M12, Zenity is
  trusted by Fortune 500 and Global 2000 enterprises
  worldwide.

  join us in shaping how AI agents are secured at enterprise
  scale.

  About the Role & Hiring Manager (Jonathan Naor):

  I joined Zenity for the opportunity to be at the forefront
  of securing AI agents at scale. As a leader, I value
  ownership and transparent, cross-functional collaboration.
  We move at startup speed with high technical standards, so I
  look for people who are proactive, customer-obsessed, and
  unafraid to challenge the status quo - while still keeping
  the journey fun. This role plays a critical part in our next
  phase of growth. You'll join a new team responsible for the
  company's enterprise readiness and partner integrations,
  directly influencing how large enterprises secure and govern
  AI agents.

  This role requires up to 3 days in the office in NYC.

  What You’ll Do

  Responsibilities:

  - Assume ownership of existing features and make them
    enterprise ready.
  - Build GenAI & Copilots security solutions for enterprise
    customers.
  - Collaborate cross-functionally with product, engineering,
    sales, and customer teams.
  - Contribute to scaling Zenity's platform, processes, and
    customer success.

  Requirements

  Requirements:

  - 5+ years of experience, with proven ability to build - not
    just maintain - systems, processes, and relationships, and
    an ownership mindset with accountability for outcomes.
  - Expertise with modern programming languages such as
    Python/C#/Java/Go/TypeScript/JavaScript.
  - Experience working on large-scale services based on
    AWS/Azure/GCP.
  - Advanced proficiency with AI coding agents, including
    skills, rules, etc.
  - Comfort operating in evolving, fast-moving, high-growth or
    venture-backed startup environments.
  - Strong communication and collaboration skills, and a
    passionate team player.

  Interview Process

  Our interview process is designed to be transparent,
  conversational, and focused on real-world experience.

  - Recruiter Screen (30 minutes) -An introductory phone
    conversation to learn more about Zenity, the role, and
    your background.
  - Assessment: Problem Solving Question
  - Hiring Manager Interview (60 minutes) – A deeper discussion
    about your technical background. The conversation will be
    about system design and the problem solving question you
    completed.
  - Director of Engineering Interview (30–45 minutes)- Zoom
    interview discussion focused on technical depth and
    expertise.
  - VP of R&D Interview (30 minutes)- Zoom interview to align on
    expectations and execution.
  - People Team Interview (30 minutes) – A Zoom conversation
    focused on collaboration, work style, and alignment.

  Compensation

  The expected base salary range for this role is $180,000 -
  $250,000, depending on experience, skills, and location. In
  addition to base compensation, this role may be eligible for
  equity and performance-based incentives.
