description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Manage a backend engineering group while staying close to
  the technical work, splitting time between coaching people
  and shaping system design. Set the direction for server-side
  services and work with colleagues in product, data,
  infrastructure and front-end functions.

  What you'll do

  - Lead, coach and grow a group of backend engineers.

  - Run planning, prioritization and delivery with a focus on
    dependable, scalable systems.

  - Set the technical direction for backend services and
    interfaces so they remain secure, fast and easy to
    maintain.

  - Turn product needs into sound backend designs alongside
    product and front-end partners.

  - Work with data scientists to deploy models and connect
    decisioning logic into services and workflows.

  - Partner with infrastructure engineers on reliability,
    monitoring and developer tooling.

  - Guide architecture choices and the long-term evolution of
    the platform.

  - Set expectations for code quality, testing and operational
    discipline.

  - Take part in incident response and make sure services meet
    agreed performance commitments.

  - Recruit, mentor and develop engineers while keeping hiring
    standards high.

  - Encourage a culture of ownership, accountability and steady
    improvement.

  - Step in on code and technical problem-solving when the team
    needs it.

  Requirements

  What we're looking for

  - A strong engineering background with hands-on experience
    building customer-facing, API-based business software at
    scale.

  - Capacity to lead a large team that includes senior technical
    staff, spending about half your time on people management
    and half on technical work such as reviews and design.

  - Several years of experience as an engineering manager for
    backend or platform teams, including setting strategy and
    roadmaps.

  - A record of taking on difficult problems and growing teams
    and systems in early-stage or scaling companies.

  - Excellent communication, with the ability to discuss
    technical topics in depth and explain them plainly to non-
    technical colleagues.

  - A steady career history, with roles typically lasting around
    2.5 years or longer.

  - Comfort with Golang or Python and a relational database such
    as PostgreSQL.

  Bonus points

  - Experience in companies where data is the main offering.

  - Background in financial technology.

  - Exposure to security or fraud prevention products.

  - Prior experience as a founder or senior technology leader in
    a small organization.

  Benefits

  Compensation and benefits

  - Base salary: USD 200,000 to 260,000 per year

  - Equity

  - Health insurance for you and your dependents

  - Retirement plan with employer match

  - Flexible paid time off

  Location and work model

  - Remote (US)

  - Full-time
