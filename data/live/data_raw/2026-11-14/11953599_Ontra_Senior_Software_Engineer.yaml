  Benefits Snapshot

  - Twice yearly team offsites for in-person collaboration
  - Paid flexible time off policy
  - Paid parental leave and benefits
  - Employer-supported retirement contributions, varying by
    country
  - Monthly phone and internet reimbursement
  - Company-sponsored learning and development resources,
    department budgets for professional development, and a
    robust onboarding program
  - Various options for medical, dental, and vision insurance

  Travel

  Occasional travel is required for Ontra employees, including
  typically at least twice per year to attend team and larger
  group off-sites for in-person collaboration. For some roles,
  additional travel may be required based on the requirements
  of the role and business need.

  Inclusivity

  Ontra is committed to the full inclusion of all qualified
  individuals. As part of this commitment, Ontra will ensure
  that persons with disabilities are provided reasonable
  accommodations. If reasonable accommodation is needed to
  participate in the job application or interview process, to
  perform essential job functions, and/or to receive other
  benefits and privileges of employment, please contact
  people@ontra.ai.

  Personnel Privacy Notice: View here.

  Note on Employment Verification: All employees hired will be
