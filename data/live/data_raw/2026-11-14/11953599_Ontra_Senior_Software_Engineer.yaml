description: |
  About Ontra Ontra is the leader in AI-powered solutions for
  the private markets. Powered by industry-leading AI, data
  from over 2 million contracts, and a global network of legal
  professionals, Ontra automates critical private market
  workflows across the fund lifecycle. Ontra’s solutions
  transform unstructured data trapped in static documents into
  actionable intelligence, enabling firms to accelerate
  contracts, streamline compliance, and automate entity
  management. Trusted by more than 1,000 global GPs,
  investment banks, law firms, and advisors – including nine
  of the top ten PEI-ranked firms worldwide – Ontra helps
  firms focus on what’s important.

  Our Culture Ontra is built for people who want real
  ownership from day one in an environment that’s built to
  support it. Our customers are sophisticated, and our work
  reflects that. AI is engrained in how we work, and curiosity
  about it is part of who we are. Ontranauts are sharp,
  genuinely collaborative, and invested in each other's
  success. They are excellent at what they do and even better
  to work with. That combination is rare, and we don't take it
  for granted. Learn more about our values.

  For this job, we are currently only hiring candidates based
  in New York and require on-site work at our New York office
  three days per week. For more information on where we
  employ, please see below.

  About the Role

  Ontra is seeking a Senior Software Engineer reporting to one
  of our Engineering Managers.

  We’re looking for someone excited to design innovative
  prototypes, develop intuitive user experiences, and
  collaborate with cross-functional teams. We're looking for
  someone who thrives in ambiguity: you can take a loosely
  defined problem, figure out the right approach, make smart
  trade-offs, and ship something that works well for users and
  the business. You’ll have practical experience with AI and
  LLMs, both as tools in your own workflow and in building
  product features.

  If you are an independent, self-motivated innovator with a
  sense of ownership, someone who thrives in developing
  iterative solutions and can work either solo or
  collaboratively with one other engineer to deliver
  continuous improvements, we’d love to get to know you!

  What You’ll Do

  - Build with AI: Ship AI-powered product features and use AI
    tools across your own workflow, from prototyping to code
    review.
  - Develop and Scale: Build, implement, and maintain a web-
    based application from the frontend to the backend using
    Ruby on Rails and React.
  - Ownership and Accountability: Take full responsibility for
    the progress and success of the project, driving key
    decisions and problem-solving independently or with
    minimal guidance.
  - Iterative Improvement: Continuously ship and improve code by
    seeking stakeholder feedback, responding effectively to
    suggestions, and implementing changes rapidly.
  - Stakeholder Engagement: Actively engage with stakeholders to
    understand their needs, gather insights, and incorporate
    feedback into the product development process.
  - Collaboration: Work closely with cross-functional teammates
    to align on development strategies, ensuring seamless
    integration of ideas and efforts in building the
    prototype.

  What You’ll Bring

  - Experience: 5+ years as a full-stack software engineer
    working with MVC frameworks (e.g., Ruby on Rails, Python
    with Flask, Java with Spring).
  - AI Fluency: Daily use of AI coding tools is required, along
    with the ability to review, verify, and reject AI output
    and to know when not to trust it. Preferred depth includes
    having built LLM features in production (RAG, agents,
    prompting, evals).
  - Project Development: Demonstrated history of successfully
    building projects from inception to completion.
  - Independence: Capable of working solo or with one other
    engineer, showcasing a strong sense of ownership and
    accountability for the project.
  - Iterative Approach: Skilled in developing iteratively,
    incorporating stakeholder feedback to refine and improve
    the product continuously.

