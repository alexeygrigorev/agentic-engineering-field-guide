description: |
  We live in a world where technology is rapidly changing the
  educational experiences of students and teachers everywhere,
  and we have the opportunity to shape how this change takes
  place. Kira's mission is to harness transformative AI
  technologies to make world-class personalized teaching and
  learning accessible to everyone. We are a rapidly growing
  startup backed by top-tier Venture Capital funds including
  New Enterprise Associates (NEA), Andrew Ng's AI Fund, and
  Primavera.

  As an Engineering Manager, you will lead a team responsible
  for significant product and platform capabilities. You are
  accountable for the people on your team, the technical
  quality and reliability of what they build, and whether the
  work reaches useful outcomes for real classrooms.

  This is a deeply technical management role. We expect
  Engineering Managers to have the judgment of a strong senior
  or staff-level engineer: able to challenge system designs,
  review consequential code, debug production issues, reason
  about performance and failure modes, and coach engineers
  from concrete experience. You should still write code when
  it is the highest-leverage thing to do, but your success is
  measured by the capability and output of your team, not your
  personal commits.

  You will work closely with Product, Design, QA, and
  engineering leaders to turn ambiguous goals into clear
  problems, pragmatic plans, and reliable software. Kira’s
  environment includes a large monorepo spanning frontend,
  backend, AI services, and real-time collaboration; multiple
  platform generations; complex education workflows; and teams
  distributed across the US and APAC. Ramping takes time, and
  we plan accordingly. This role requires flexibility with
  work hours and occasional availability outside regular
  business hours, and is based in San Francisco or New York
  City, working from the office four days per week (Wednesdays
  WFH).

  What You'll Do

  - Turn company priorities into clear problems, ownership, and
    honest milestones; find the critical path, surface risk
    early, test assumptions, and cut scope intelligently.
  - Stay close enough to the architecture, codebase, and
    production systems to evaluate technical decisions
    independently; review consequential work and coach
    engineers on system design, data modeling, debugging,
    performance, reliability, code quality, and security.
  - Give people meaningful ownership, coach them through
    increasing ambiguity, and develop senior engineers and
    technical leads by delegating consequential decisions.
  - Set expectations early, give feedback in the moment,
    recognize strong performance, and address gaps before
    review time.
  - Ensure the team designs for realistic failure modes and peak
    load, operates what it ships, responds effectively to
    incidents, and turns failures into durable improvements.
  - Partner closely with Product and Design — help define the
    problem instead of accepting requirements, and make sure
    what ships works in real classrooms, not just in demos.
  - Establish clear ownership and decision rights; invite
    disagreement, challenge weak reasoning, resolve conflict,
    and make important decisions and their rationale clear.
  - Maintain a high hiring bar based on demonstrated judgment
    and outcomes, not pedigree or output volume; onboard
    people thoughtfully and contribute credible signal to
    leveling and calibration.
  - Be fluent with modern AI development tools and help the team
    use them well across planning, implementation, testing,
    debugging, and review — while maintaining independent
    engineering judgment and watching for review-cost transfer
    such as sloppy AI-generated code.
  - Communicate clearly across functions and time zones, writing
    concisely and creating enough shared context that teams
    can operate without constant synchronous coordination.

  What We're Looking For

  - Bachelor's or Master's degree in Computer Science, or
    equivalent technical experience.
  - 8+ years professional engineering experience, including
    designing, shipping, and operating consequential
    production systems.
  - 2+ years managing mid, senior and lead level software
    engineers
  - Technical depth comparable to a strong Senior or Staff+
    Software Engineer, with recent hands-on experience to
    review substantive changes, investigate production
    behavior, and write targeted code when useful.
  - Strong system design and debugging skills across
    architecture, APIs, data models, distributed systems,
    performance, and failure modes.
  - A track record of developing engineers into more independent
    owners, including senior engineers or technical leads.
  - Experience giving difficult feedback, managing
    underperformance, recognizing strong performance, and
    running substantive career conversations.
  - Strong execution judgment — framing ambiguous problems,
    sequencing work, managing dependencies, reducing scope
    intelligently, and operating without heavy process.
  - Experience owning production reliability and incident
    response, including systemic follow-through.
  - Strong product judgment and experience shaping scope with
    Product and Design.
  - High familiarity with AI-assisted software development and a
    clear view of both its leverage and failure modes.
  - Clear written and verbal communication across technical and
    non-technical audiences.
  - A low-ego leadership style with a strong sense of
    responsibility for the quality of the team's work.

  Preferred:

  - Kotlin, Python, React, TypeScript, MySQL, and AWS
  - Operating high-traffic applications and diagnosing
    application, database, or infrastructure bottlenecks under
    production load.
  - Managing full-stack teams while maintaining strong backend
    or systems depth.
  - LLM-backed product capabilities, including evaluation,
    observability, latency, cost, and failure handling.
  - Leading teams across regions and time zones.
  - Education technology or another environment where
    reliability and usability directly affect large numbers of
    users.

  What We Offer

  - Competitive compensation and equity. Salary range for this
    role is $215K–$260K+ depending on relevant experience and
    skill set.
  - Medical, dental, vision and life insurance, including a
    medical insurance plan with 100% coverage of employee
    premiums.
  - Flexible PTO policy and company holidays.
  - DoorDash credit for lunch daily.
  - Wellhub Membership: 100% company-paid access to premium gym
    networks (Orangetheory, SoulCycle), 60+ wellness apps
    (Headspace, MyFitnessPal, Apple Fitness+), and 1:1
    coaching sessions spanning fitness, mental health,
    nutrition, and sleep.
  - 401(k) matching.
  - Dog friendly office 🐶.

