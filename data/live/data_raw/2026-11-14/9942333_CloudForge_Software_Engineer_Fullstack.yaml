description: |
  About the Role

  We're looking for a Founding Engineer to help build our
  next-generation AI Sales Co-Pilot and CRM for the industrial
  distribution and steel industry. This role blends modern
  SaaS development with AI-driven automation to transform how
  industrial distributors manage relationships, communication,
  and sales workflows.

  Location: New York (3-5 days per week in-office)About
  CloudForge

  CloudForge is building the modern software stack for the
  industrial economy. We’ve raised $4M from Zero Infinity
  Partners, Resolute Ventures, and Bienville Capital, and
  we’re scaling quickly with the launch of our AI-native
  platform.

  The market pull is intense. We’re closing six-figure and
  high five-figure deals, onboarding customers in as little as
  seven days, and the demand is outpacing our ability to ship.
  We need engineers who can build fast, think clearly, and
  handle real scale under real pressure.

  CloudForge AI is an AI-powered digital sales rep, CRM, and
  proprietary prospecting database built specifically for
  metal service centers and industrial distributors. We
  combine structured industry data with large language models
  to help distributors increase revenue and expand customer
  relationships.

  With CloudForge AI, distributors can:

  - Find new high-fit customers based on what they actually sell
  - Manage prospect and customer outreach through integrated
    call and email workflows
  - Turn inventory into revenue using AI-driven product-to-
    prospect matching
  - Manage customers and tasks with a CRM designed for
    industrial workflows

  Our mission is simple: increase revenue and profit for
  industrial distributors.

  What You’ll Build:

  You’ll work across our end-to-end Sales Co-pilot platform,
  integrating deeply with email, telephony, and LLM-based
  automation.

  Tech Stack:

  - Python, Django, Graphene/GraphQL
  - TypeScript, React
  - Kubernetes
  - Generative AI and LLM integrations
  - Email, telephony, and third-party APIs

  Key Responsibilities:

  - Design and implement features across our full-stack CRM
    including AI features
  - Build and maintain integrations with ERPs, email, phone
    systems, and external APIs normalization tools.
  - Develop GraphQL APIs with Graphene
  - Integrate and optimize LLM-powered automation features
  - Deploy and manage applications in Kubernetes environments
  - Collaborate with product and sales teams to understand user
    needs

  What We’re Looking For:

  - 5+ years of professional software engineering experience
  - Strong sense of product ownership, advocate for best
    possible features
  - Strong proficiency in Python and Django
  - Experience with TypeScript and React
  - Familiarity with GraphQL (Graphene is a plus)
  - Understanding of Kubernetes deployment and orchestration
  - Experience building APIs and integrating external services
  - Experience with generative AI and LLM applications
  - Comfortable working in our New York office 3-5 days a week
  - Strong problem-solving skills and attention to detail
