description: |
  G MASS are currently looking for an experienced Software
  Engineer to join a leading Investment Manager client. This
  role sits within a core engineering team at the centre of a
  highly quantitative investment environment, supporting the
  technology and data platforms that underpin systematic
  trading strategies and advanced research.

  You will be working in a fast-paced, data-driven environment
  where engineering plays a critical role in enabling
  investment teams to access, process and utilise large
  volumes of market and research data.

  Responsibilities

  - Design, develop and enhance large-scale data and
    infrastructure platforms supporting trading and research.
  - Build and maintain systems capable of processing large
    volumes of data from numerous global sources.
  - Work closely with researchers, traders and engineers to
    ensure platforms effectively support investment workflows.
  - Contribute to improving the scalability, performance and
    reliability of distributed systems.
  - Develop and maintain services primarily using Java and
    Python.
  - Work across modern data and messaging technologies including
    Kafka, ArcticDB and MongoDB.

  Requirements

  - Degree in a quantitative/technical field (e.g. Computer
    Science, Mathematics, Engineering or Physics)
  - 5+ years’ software engineering experience using Java or
    Python
  - Strong Linux and Git knowledge
  - Experience with modern databases (e.g. Postgres, MongoDB or
    similar)
  - Strong problem-solving skills and attention to detail
  - Able to work independently and collaborate with stakeholders

  Nice to have

  - Exposure to distributed systems
  - Open-source contributions
  - Familiarity with LLMs / AI tooling

  Benefits

  Salary: up to £100k

  Permanent contract.
