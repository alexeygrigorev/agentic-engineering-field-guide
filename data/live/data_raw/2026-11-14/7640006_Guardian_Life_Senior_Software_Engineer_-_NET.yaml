description: |
  We are actively seeking a proactive, creative Senior
  Software Engineer who will be responsible for architectural
  design and implementation of Guardian's next-generation web
  self-service platforms APIs using .Net Core, C#. You will:

  - Design, develop, and deploy high-volume, high-usage self-
    service web portals APIs, utilizing .Net Core, C#.
  - Collaborate with Technical Teams, Technical Manager, Project
    Manager and subject matter experts from businesses and
    work closely with SMEs to understand, plan and implement.
  - Ensure compliance with security, privacy, legal,
    infrastructure, and administrative/corporate processes and
    policies.
  - Lead code reviews and administer paired programming.
  - Provide unique insight into the analysis of customer
    business requirements that may cross multiple functional
    areas and/or multiple technical platforms and understand
    the broad strategic implications.
  - Act independently and as part of a team to translate
    business and technical requirements into well-engineered,
    tested, and deployed applications.
  - Jump in and hit the ground running with a positive attitude.

  You have:

  - 5+ years of experience successfully developing APIs using
    C#, .NET Core.
  - Strong .NET & C# expertise on backend services with async
    programming and memory management.
  - Experienced in object-oriented programming and design
    patterns
  - 5+ years working with Web API (.NET core), REST Services,
    WCF or SOAP Services.
  - 4+ years of experience in database principles, such as SQL
  - Working experience with Splunk (logging), AppDynamics,
    JSON/XML, Caching, Performance Analysis & Profiling,
  - Experience resolving code smells, vulnerabilities, and
    application security flaws.
  - Experience with source code repositories tools, BitBucket,
    GitHub.
  - Professional experience with CI/CD pipelines, Aws, ECS,
    Docker and Kubernetes
  - Ability to interact and communicate successfully with
    business partners and technology teams.
  - Strong knowledge of release/build/configuration management
    practices.
  - Strong understanding of software best-practices as it
    applies to web and business application development with
    hands on architecture design and development experience
    required in building APIs for large scale applications.
  - Demonstrable understanding of object-oriented
    design/development, functional programming, and service-
    oriented architecture.
  - Ability to prioritize and manage work, adhering to critical
    and aggressive project timelines in a fast-paced
    environment.
  - Extensive experience in Software Development Life Cycle
    Management using Kanban, Scrum, or Scaled Agile is
    required.
  - Experience working in a rapid and agile development
    environment with frequent deliveries.

  Location:

  - Three days a week at a Guardian office in Holmdel, NJ,
    Bethlehem, PA or New York, NY.

  #LI-AL1

  Salary Range:

  $93,080.00 - $152,915.00

  The salary range reflected above is a good faith estimate of
  base pay for the primary location of the position. The
  salary for this position ultimately will be determined based
  on the education, experience, knowledge, and abilities of
  the successful candidate. In addition to salary, this role
  may also be eligible for annual, sales, or other incentive
  compensation.

