description: |
  Job Description At Citadel Securities, our engineers work in
  small teams to turn the best ideas into high-performing and
  resilient technology. With short development cycles, work
  rapidly goes into production. As an engineer, you can create
  system architectures, develop platforms and build web
  frameworks. You'll have access to state-of-the-art tools and
  apply innovative techniques including distributed computing,
  natural language processing, machine learning and more. As
  an intern, you'll get to challenge the impossible in
  technology through an 11-week program that will allow you to
  collaborate and connect with senior team members. In
  addition, you'll get the opportunity to network and
  socialize with peers throughout the internship. Your
  Objectives:

  - Create technological tools that bring trading strategies to
    life
  - Develop high-performance, large data research platforms
  - Work in small teams to build the future of finance

  Your Skills & Talents:

  - Bachelor's, master's or PhD in computer science, computer
    engineering or related fields
  - Exceptional programming and design skills
  - Strong analytical skills and familiarity with probability
    and statistics
  - Ability to communicate effectively in a collaborative,
    complex and highly technical team environment
  - Intellectual curiosity and passion for solving challenging
    problems using technology

  Opportunities available in Miami and New York. In addition
  to weekly pay, interns may be eligible for a highly
  competitive sign-on bonus, housing stipend or covered living
  accommodations, company-sponsored travel, and a variety of
  on-site benefits, including access to on-site fitness and
  wellness amenities, catered meals, and social and networking
  events. In accordance with applicable law, the base salary
  range for this role is $4,500 to $5,800 per week. About
  Citadel Securities Citadel Securities is a technology-
  driven, next-generation global market maker. We provide
  institutional and retail investors with world-class
  liquidity, competitive pricing and seamless front-to-back
  execution in a broad array of financial products. Our teams
  of engineers, traders and researchers harness leading-edge
  quantitative research and the accelerating power of compute,
  machine learning and AI to power our analytics and tackle
  the market's and our clients' most critical challenges.
  Together, we are forging the future of capital markets. For
  more information, visit citadelsecurities.com .
