description: |
  Who We Are

  At Apartment List, we’re transforming how people rent—making
  it smarter, easier, and a lot less frustrating. Our platform
  has already matched over 1.4 million renters with their next
  home, while helping properties fill units with the right
  residents. Backed by strong growth and a big vision, we’re
  building the future of renting—and inviting bold thinkers to
  help us shape it!

  About the Role

  As a Software Engineer on the Marketplace team, you’ll work
  at the intersection of full-stack product engineering and
  machine learning operations—helping power the systems that
  match renters to homes across ApartmentList.com and
  Sunny.com. You’ll contribute to a range of work: building
  and maintaining the backend which powers search, supporting
  ML pipelines and model serving infrastructure, and
  collaborating closely with data scientists and engineers to
  bring ML capabilities into production.

  This is a blended role for an engineer who is comfortable
  context-switching between product feature work and ML
  infrastructure, and who is excited to grow their depth in
  both areas. You’ll work closely with your Engineering
  Manager, product partners, and a globally distributed team.

  What You’ll Do

  - Build and maintain full-stack features across our
    marketplace products, including search, ranking, and
    renter-facing UI
  - Support and extend ML Ops infrastructure including model
    deployment pipelines, feature stores, and monitoring -
    primarily on Chalk and Vertex AI
  - Collaborate with data scientists to bring models into
    production reliably and at scale
  - Write clean, well-tested code and participate actively in
    code reviews
  - Contribute to technical planning and help break down complex
    problems into well-scoped, executable work
  - Identify and address performance, reliability, and
    scalability issues in existing systems
  - Communicate progress clearly and surface blockers early

  What You’ll Bring

  Required

  - 5+ years of professional software engineering experience,
    with meaningful work in backend or full-stack development
  - Proficiency in at least one backend language (We use
    Typescript, Python, Go, Ruby)
  - Exposure to ML concepts and an interest in working at the
    boundary of software engineering and machine learning—you
    don’t need to be a data scientist, but you should be
    comfortable in that world.
  - Experience with a balanced approach using AI tools –
    improving workflows, reducing feedback loops
  - Experience working in cloud environments (GCP preferred; AWS
    or Azure also considered)
  - Excellent communication skills as well as debugging
    instincts with an ownership mindset
  - Ability to collaborate effectively across time zones and
    with cross-functional partners
  - Mentorship experience for other engineers

  Nice to Have

  - Hands-on experience with ML Ops tooling - Vertex AI, MLflow,
    Kubeflow, or similar
  - Familiarity with feature pipelines, model deployment, or A/B
    experimentation infrastructure
  - Experience with search or recommendation systems
  - Experience working in an online marketplace

  Here's the Pay Range:

  At Apartment List, we carefully consider a variety of
  factors to determine compensation for each position,
  including the role, level, and work. The US Total Target
  Compensation (TTC) for this position is:

  - Zone 1: $210,000 - $255,000 TTC (including $189,000 -
    $229,000 base salary) + equity
  - Zone 2: $194,000 - $236,000 TTC (including $175,000 -
    $212,000 base salary) + equity
  - Zone 3: $179,000 - $217,000 TTC (including $161,000 -
    $195,000 base salary) + equity

  This reflects the compensation target for new hire salaries
  for the position across all US locations. Please note, the
  compensation details provided do not include benefits and
  perks that we offer.

  We also rely on market indicators along with considering
  your work location, job related skills, experience and
  relevant education and training, to determine compensation
  that is fair and competitive for you. Apartment List will
  consider paying compensation near the higher of the range in
  exceptional circumstances, where candidates have the
  experience, credentials or expertise that would warrant such
  consideration. It is always our goal to hire exceptional
  talent and we would be happy to share more about
  compensation during the hiring process.

  Here's what's in it for you (full-time US based employees
  only; does not apply to contract roles):

  - Competitive Compensation: Including annual salary, pre-IPO
    stock options, and other financial compensation (if
    applicable)
  - Medical, Dental, and Vision Coverage: 100% of premiums
    covered for you AND all of your dependents
  - Unlimited Flexible Time Off: Unlimited FTO in addition to 12
    company holidays per year, quarterly “recharge” days, and
    a week-long holiday break
  - Home Office Reimbursement: To cover home office furniture
    and supplies, monthly home internet, and monthly cell
    phone (if applicable)
  - Health & Wellness Reimbursement: To cover monthly gym
    membership or other qualifying expenses
  - Parental Support: Generous parental and family leave,
    fertility benefits, and employer-sponsored stipends
    towards family forming services
  - 401k Plan: To support you in your individual retirement
    goals
  - Homeownership & Mortgage Savings: Access exclusive mortgage
    rates up to 1% below retail lenders and free 1:1 expert
    guidance.
  - Team Events: Frequent team-building events, fun team off-
    sites, and bi-annual company meetups
  - Commitment to DEI: To prioritize Diversity, Equity, and
    Inclusion within our workplace and to stay true to our
    values and mission
  - Mentorship and Training: To get you onboard quickly, learn
    new professional skills, and invest in your career
    development
  - Impact and Visibility: To expose you to and provide the
    opportunity to work on highly strategic initiatives that
    will transform the business
  - Encouragement and Empowerment: To explore and adopt new
    technologies and drive meaningful decisions and outcomes
  - At Apartment List we believe that everyone deserves a home
    they love AND a career they love. We strive to build a
    diverse team that is a reflection of the people we serve;
    this is made possible through our commitment to fostering
    a culture of diversity, inclusion, equity, and
    connectedness.

  As a proud equal opportunity employer, we celebrate the
  collection of individual differences, life experiences,
  ideas, perspectives, knowledge, and talent. We hire
  candidates of any race, color, ancestry, religion, sex,
  national origin, sexual orientation, gender identity, age,
  marital or family status, disability, Veteran status, and
  any other status. #LIRemote
