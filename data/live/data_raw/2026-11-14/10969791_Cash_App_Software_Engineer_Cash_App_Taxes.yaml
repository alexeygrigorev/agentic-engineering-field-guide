description: |
  It all started with an idea at Block in 2013. Initially
  built to take the pain out of peer-to-peer payments, Cash
  App has gone from a simple product with a single purpose to
  a dynamic ecosystem, developing unique financial products,
  including Afterpay/Clearpay, to provide a better way to
  send, spend, invest, borrow and save to our 50+ million
  monthly active customers. We want to redefine the world's
  relationship with money to make it more relatable, instantly
  available, and universally accessible. Today, Cash App has
  thousands of employees working globally across office and
  remote locations, with a culture geared toward innovation,
  collaboration and impact. We've been a distributed team
  since day one, and many of our roles can be done remotely
  from the countries where Cash App operates. No matter the
  location, we tailor our experience to ensure our employees
  are creative, productive, and happy. The Role Cash App is
  offering a better way to file your taxes as an alternative
  to traditional online DIY tax preparation systems. As a
  Software Engineer on our Tax Engine Server Engineering team,
  you will build and enhance the codebase that powers our tax
  filing experience. You will translate complex tax
  requirements into seamless software solutions that help
  millions of users confidently navigate and complete their
  returns with ease. You will collaborate closely with product
  managers, tax experts on our Tax Product Specialist team,
  and other cross-functional teams to ensure our platform
  remains accurate, reliable, and easy to use. If you are a
  skilled engineer who thrives on solving complex problems and
  wants to make a direct impact on a transformative product
  within a rapidly growing company, this role is for you. You
  Will

  - Design, build, and own high-quality features and systems
    that power the Cash App Taxes filing experience, from
    federal and state form logic to e-file submission.
  - Translate complex tax rules and requirements into clean,
    maintainable, and well-tested code in close partnership
    with Tax Product Specialists.
  - Build tools and guardrails that enable non-technical
    contributors to make code changes safely that maintain our
    quality standards.
  - Drive architectural and design decisions, ensuring our tax
    software remains scalable, secure, and maintainable.
  - Write reliable, well-tested code and establish best
    practices for coding, testing, deployment, and
    documentation.
  - Collaborate cross-functionally with Quality Assurance, Tax
    Product Specialists, Cloud Platform, Design, Product,
    Customer Care, and other teams to deliver cohesive
    solutions.
  - Proactively identify and resolve issues related to accuracy,
    reliability, and performance, balancing new feature
    development with ongoing maintenance.
  - Stay informed about emerging technologies and industry best
    practices to continually refine our development processes.
  - Apply an AI-first mindset in your everyday work, raising the
    bar of AI application on our team


  You Have

  - 4+ years of professional software development experience,
    preferably in a fast-paced or product-centric environment.
    Experience in the tax industry is a major plus.
  - Strong technical skills in backend development, including
    system design, architecture, and object-oriented
    programming.
  - A track record of delivering reliable, high-quality software
    solutions on schedule.
  - Excellent communication skills with the ability to
    collaborate effectively with both technical and non-
    technical stakeholders.
  - Strong problem-solving skills with attention to detail and a
    methodical approach to debugging and implementation.
  - A Bachelor's degree in Computer Science, Engineering, or a
    related field (or equivalent experience).
  - Passion for building innovative software that simplifies
    complicated processes for everyday users.


  Technologies We Use and Teach

  - Java / Kotlin
  - iBatis / SQL Relational Databases
  - Logging & monitoring tools - Datadog, Splunk, New Relic
  - GCP / AWS
  - GitHub
  - HTTP, JSON, gRPC, Protocol Buffers
  - Okta
  - Linear
  - AI Coding Agents (Claude, Codex, etc.)


