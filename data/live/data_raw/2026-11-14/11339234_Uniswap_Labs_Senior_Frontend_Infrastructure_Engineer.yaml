description: |
  Uniswap Labs builds products that help millions of people
  access DeFi simply and securely — from the Uniswap Web App
  and Wallet to crypto infrastructure like the Uniswap Trading
  API, and Unichain. Uniswap Labs also contributes to the
  development of the Uniswap Protocol, which has processed
  over $2.9 trillion in volume across thousands of tokens on
  Ethereum and 12+ other chains.

  When you join Uniswap, you become part of a team that's
  reshaping the way value flows on the internet.

  The Apps Infra team is the horizontal foundation that every
  product team at Uniswap builds on. We own the data layer,
  design systems, release and QA automation, UI libraries, and
  shared frontend services. We're product-centric at our core
  — the infra we build is always in service of the user
  experience, and we regularly contribute to product and
  design engineering work alongside our tooling and platform
  responsibilities. We also contribute heavily to AI-powered
  internal tools and automations that help the engineering org
  ship faster. We're looking for a senior engineer who goes
  deep: someone who can drive a large-scale migration one
  week, build an AI-powered CLI tool the next, and ship a
  polished UI component the week after that. You'll have
  strong opinions on tooling, care about developer experience,
  and treat product quality as the backbone of everything you
  build.

  Responsibilities

  - Own and evolve Uniswap's shared frontend infrastructure —
    design systems, UI component libraries, data-fetching
    layers (React Query), and notification systems — across
    web and mobile
  - Contribute to product and design engineering work, keeping
    the team closely connected to what users experience
  - Build and contribute to AI-powered internal tools and
    automations — changelog builders, cherry-pick automations,
    CLI tools, and workflows that use LLMs like Claude to
    accelerate development
  - Lead large-scale migrations (e.g., Tamagui → Tailwind) with
    strong opinions on tooling choices and a plan that other
    teams can follow
  - Build and improve release automation, CI/CD pipelines, and
    QA tooling to increase reliability and developer velocity
  - Drive performance improvements across the all of our apps
  - Maintain backend-for-frontend services that support multiple
    product teams
  - Produce high-quality, well-tested code and thoughtful
    architecture docs; set the bar on PR reviews
  - Mentor engineers across teams through code review,
    documentation, and establishing best practices where none
    exist

  Requirements

  - 5+ years of software engineering experience
  - Deep experience with both React and React Native; comfort
    working across web and mobile from a single codebase
  - Strong track record building developer tooling, design
    systems, or shared infrastructure — with a product
    sensibility that keeps you connected to what users
    actually touch
  - Opinions on frontend architecture, styling systems, data-
    fetching patterns, and build tooling — and the ability to
    back them up
  - Experience owning and delivering large, ambiguous projects
    end-to-end with minimal direction
  - Comfort with automation: CI/CD, release engineering, testing
    frameworks
  - Eager to push the boundaries of AI-assisted development —
    not just using the tools, but exploring what's newly
    possible
  - A desire to keep up with modern best practices in web and
    mobile development

  Nice to Have

  - Active open source contributions — especially to projects
    like wagmi, viem, Next.js, React Router, TanStack, or
    similar frontend/tooling ecosystems
  - Experience building AI-powered developer tools, CLI tools,
    or internal automations with LLMs
  - Experience with Swift/Kotlin or native mobile development
  - Familiarity with crypto features and concepts — candidates
    with no crypto experience are still welcome (encouraged!)
    to apply
  - Experience at companies that value this kind of
    infra/platform/DX role (e.g., Shopify, Vercel, Replit,
    Phantom, Coinbase)
  - Degree in computer science
  - Love for unicorns:)

  Minimum full-time salary of $180,000-$226,000. Disclosure in
  accordance with New York City's Pay Transparency Law. Full
  Time employees at Uniswap Labs are also eligible for other
  compensation elements, including tokens, and benefits,
  dependent on the position type.

  Uniswap Labs' Full-Time employee benefits include company-
  paid medical, dental, & vision for you and your dependents,
  wellness offerings including a partnership with Equinox
  Fitness Clubs, 401(k) with 4% employer contribution, annual
  $1,500 education stipend, unlimited and encouraged time off,
  up to 16 weeks paid parental leave, home office setup
  stipend for remote employees and daily lunches at NY
  headquarters (all benefits are subject to applicable taxes
  and based on eligibility).

  Uniswap Labs is committed to diversity in our workforce and
  is proud to be an Equal Opportunity Employer (EEO). We
  provide employment opportunities without regard to age,
  race, color, ancestry, national origin, religion, disability
  (including gender dysphoria and similar gender-related
  conditions), sex, gender identity or expression, sexual
  orientation (including actual or perceived heterosexuality,
  homosexuality, bisexuality, and asexuality), veteran status,
  military status, domestic violence victim status,
  reproductive health decision making or any other protected
  category. In addition, Uniswap Labs participates in
  E-Verify. You can view the E-Verify poster here and the
  Right to Work poster here.
