description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About the Team

  Every time a fan places a bet, earns a reward, or checks out
  on Fanatics — Fanatics Core made that possible. We build the
  shared foundations — identity, payments, loyalty, wallet,
  data, and platform — that power sports betting, ecommerce,
  collectibles, and beyond. We supercharge the business by
  providing products and capabilities so that teams can focus
  on what matters most: building delightful experiences for
  the fans.

  Fanatics is uniquely positioned at the intersection of
  sports commerce, betting, and collectibles, and Fanatics ONE
  is the loyalty and identity program that ties it all
  together. As part of the Loyalty SDK team at Fanatics, we
  build the technology that powers how fans see and interact
  with FanCash across the entire company. Our SDKs and
  services sit at the heart of the customer journey, enabling
  every brand and product team to deliver consistent and
  seamless loyalty experiences.

  Overview

  As a Staff Engineer on our Partnerships Engineering team, a
  critical part of Fanatics Core, you will own the systems and
  platforms that bring new operating companies and external
  partners into the Fanatics ONE ecosystem, spanning identity
  provider integrations, loyalty program onboarding, account
  linking, and the infrastructure that makes it fast and
  reliable to connect partners to our platform.

  This is a staff-level role: you will be a technical leader
  and hands-on builder. You'll drive architecture and design
  decisions, set engineering standards, and work across the
  full stack to deliver systems that are reliable, scalable,
  and built to grow with an expanding partner ecosystem.
  You'll collaborate closely with product, engineering leads
  across Identity, Loyalty, and SDK, and directly with
  external partners to solve complex integration challenges.

  Responsibilities

  - Lead the technical design and delivery of partner onboarding
    systems, integration platforms, and APIs that connect
    external partners to Fanatics ONE
  - Architect and build the Account Linking Platform, enabling
    fans to seamlessly connect external partner accounts to
    their Fanatics ONE identity
  - Drive identity provider integrations, ensuring partners can
    connect to Fanatics Identity reliably and securely at
    scale
  - Build loyalty program integration systems that allow
    partners to participate in FanCash, Tier Point, and One
    Credit earning & redemption without requiring bespoke
    integrations for each partner
  - Own technical quality across the team, establishing
    patterns, reviewing code, setting standards, and ensuring
    systems are observable, testable, and maintainable
  - Partner with Identity, Loyalty, and SDK engineering teams
    within Fanatics Core to align on shared APIs, contracts
    and integration patterns as well as architecture and
    development patterns
  - Engage directly with external partners and their technical
    teams to understand integration requirements and translate
    them into scalable platform solutions
  - Identify and drive improvements to developer experience,
    including tooling, documentation, and self-service
    capabilities that reduce partner integration time
  - Mentor engineers across the team, raising the technical bar
    through pairing, design reviews, and engineering culture

  Required Qualifications

  - 8+ years of software engineering experience, with 2+ years
    in a staff-level or equivalent technical leadership role
  - Strong full stack engineering background, comfortable across
    backend services, APIs, and frontend tooling
  - Deep experience designing and building integration
    platforms, partner APIs, or developer-facing systems
  - Proven experience with OAuth 2.0, OpenID Connect, SAML, and
    identity provider integrations
  - Track record of architecting distributed systems that
    operate reliably at scale
  - Strong written and verbal communication skills, with the
    ability to drive alignment across engineering, product,
    and external stakeholders
  - Experience working in a multi-tenant or multi-opco
    environment

  Preferred Qualifications

  - Experience working with GO and Typescript/React
  - Experience with loyalty, rewards, or payments platforms
  - Familiarity with event-driven architectures (Kafka or
    similar)
  - Experience building account linking or federation systems
  - Prior experience at a sportsbook, fintech, or regulated
    industry

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connection and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

  For information about our benefits, please visit
  https://benefitsatfanatics.com/

