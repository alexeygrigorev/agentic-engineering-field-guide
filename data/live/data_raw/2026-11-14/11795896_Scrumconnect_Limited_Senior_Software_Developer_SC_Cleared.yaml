description: |
  About Scrumconnect Consulting

  Scrumconnect Consulting is a multi-award-winning digital
  consultancy, recognised for delivering impactful and
  innovative technology solutions across UK government
  departments. Our work has positively influenced the lives of
  over 40 million UK citizens.

  We are passionate about user-centred design, agile delivery,
  and building digital services that make a real difference.
  Our teams work at the forefront of innovation, helping
  organisations transform and deliver high-quality, scalable
  solutions that truly matter.

  Overview

  We're looking for a Senior Software Developer to move a
  digital and cyber playbook for councils from its current
  build to an in-house service. The playbook gives councils
  practical guidance, tools and case studies for the digital,
  data, technology and cyber sides of local government
  reorganisation. It currently runs on WordPress, and the
  target platform isn't confirmed, so you'll need to be
  confident on WordPress and adaptable if the decision
  changes. You'll build a secure, accessible and maintainable
  product that councils can contribute to after publication.

  Key Responsibilities

  - Build and ship the rebuilt playbook in iterative phases.
  - Implement the features that user research and sector
    engagement have prioritised, including decision-support
    tools, adaptable frameworks and a way for councils to
    contribute their own learnings.
  - Develop and customise on WordPress, including themes,
    templates, blocks, plugins and content structures, working
    closely with the interaction designer and content
    designer.
  - Help the team assess the target platform, and apply GOV.UK
    Frontend and Design System patterns where the chosen
    platform allows.
  - Build security in, including secure configuration, plugin
    and dependency management, and evidence for assurance
    reviews and testing.
  - Set up and maintain automated tests (unit, integration,
    accessibility) and a repeatable deployment pipeline.
  - Take part in code reviews and sprint ceremonies, working
    with the architect, delivery manager and product manager.
  - Write clear documentation and run handover sessions so the
    client's permanent team can maintain and extend the
    product.

  What We're Looking For Essential

  - SC cleared or active SC.
  - Strong commercial experience developing on WordPress,
    including theme and plugin development (PHP), custom post
    types and content structures.
  - Experience securing and maintaining WordPress sites,
    including updates, plugin management, hardening and
    backups.
  - Experience building accessible interfaces that meet WCAG 2.2
    AA.
  - Experience with secure development practice, such as OWASP,
    authentication, and secrets and dependency management.
  - Experience with CI/CD pipelines and automated testing.
  - Experience working in agile, multidisciplinary teams, with
    clear written communication.

  Desirable

  - Experience with GOV.UK Frontend, the GOV.UK Design System
    and the Prototype Kit.
  - Experience delivering digital services in UK central or
    local government, including service assessments.
  - Experience with content-driven or CMS-style products, or
    user-contributed content with moderation.
  - Experience migrating a site or content between platforms.
  - Experience handing a product over to a permanent in-house
    team.
  - Familiarity with the GOV.UK Service Standard and the
    Technology Code of Practice.



  Our Commitment to Diversity & Inclusion

  At Scrumconnect Consulting, we believe diversity drives
  innovation. We are committed to fostering an inclusive
  workplace where everyone feels respected, valued, and
  supported.

  We actively encourage applications from women, people with
  disabilities, individuals from under-represented
  communities, and those seeking flexible working
  arrangements.

  As a Disability Confident Level 1 employer, we provide
  reasonable adjustments throughout the recruitment process
  and employment to ensure equal opportunity for all.
