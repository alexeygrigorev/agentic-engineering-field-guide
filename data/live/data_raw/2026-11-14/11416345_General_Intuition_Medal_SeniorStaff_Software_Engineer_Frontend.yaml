description: |
  About The Company

  General Intuition is the frontier lab for acting in space
  and time. We build large action models and world models that
  can perceive, predict, and act across virtual and physical
  environments. General Intuition builds on the strength of
  Medal, the world's largest and fastest-growing platform for
  gaming clips, where millions of gamers capture, share, and
  discover new games every year. We've raised over $650M from
  Khosla, GC, Valor, and Point72 since October 2025, and
  recently closed our latest round at a $6.2B valuation.

  The Role

  You'll join a talented team of engineers experienced with
  large-scale applications, helping scale the platform to 100+
  million users by building high-quality features that
  creators love and creating new experiences for the next
  generation of gamers. Most of your work will be in React on
  our Electron app, where you'll iterate quickly to see which
  features stick, working directly with leadership and our
  community to ship features regularly.

  What We're Looking For

  - 5+ years of frontend engineering experience
  - Experience with React, Redux, Node, and Electron: You'll
    spend most of your time building things with React and
    will need to understand modern React practices and
    JavaScript in general
  - Bonus to have full-stack XP: including Java, C#, and C++
  - In-person: Looking to hire in NYC to contribute alongside
    the product team. 5 days in the office
  - Ownership & attention to detail: You see things through, and
    can be responsible for end-to-end quality of complex
    features
  - Code Performance: Excellent understanding of code
    performance implications in production and confident with
    profiling tools
  - Be result-driven: Everything we do is driven by the metrics
    and performance of the feature. We move fast and ship
    regularly
  - Measuring with metrics: Comfort with A/B testing and
    measuring results with usage metrics
  - Gaming: A passion for games and the gaming communities, and
    a user of Discord and other gaming-adjacent products. XP
    working on gaming-related projects is a plus

  Our Stack

  Electron, React, Redux, Styled Components & other modern
  web-based technologies C# and C++ for native Windows
  recording & more Swift for iOS, Kotlin for Android Java,
  Redis, RabbitMQ, Kubernetes for backend Terraform, Salt,
  GitHub Actions, CircleCI for IaC and CI/CD
