description: |
  About Us

  Ivanti empowers organisations to manage and secure
  technology smarter through our AI‑powered Ivanti Neurons
  platform. We help IT and Security teams reduce complexity,
  work proactively, and deliver better outcomes at scale for
  customers around the world.

  Ivanti helps organisations work smarter through Autonomous
  Endpoint Management powered by our AI‑driven Ivanti Neurons
  platform—delivering better outcomes for our customers by
  reducing complexity and enabling proactive IT and security
  operations.

  Role mission

  Build, optimize, and scale the digital experiences that help
  customers discover, evaluate, and engage with Ivanti.

  As a Full Stack Web Developer, you’ll turn marketing
  strategy and creative ideas into fast, secure, accessible,
  and high-performing web experiences used across Ivanti’s
  global digital presence.

  What to expect

  We’re looking for a hands-on Full Stack Web Developer with
  strong front-end expertise to help evolve ivanti.com and the
  digital experiences that support our customers throughout
  their journey.

  You’ll work across the full web stack, from polished front-
  end experiences and interactive content to C#/.NET
  applications, CMS functionality, APIs, SQL Server,
  integrations, and deployment pipelines.

  This is a great opportunity for someone who enjoys building
  things that people actually see and use, while also being
  comfortable getting under the hood to solve complex
  technical problems. You’ll partner closely with Creative and
  Marketing teams and have the autonomy to take work from
  concept and implementation through launch and production
  support.

  You don’t need to come from a perfectly modern tech stack.
  We’re looking for someone who can work pragmatically across
  established, legacy, and modern technologies while helping
  us continuously improve how we build for the web.

  What you’ll do

  - Build experiences: Develop responsive, accessible, high-
    quality website experiences using C#, ASP.NET, MVC, Razor,
    JavaScript, HTML, CSS/SCSS, APIs, and SQL Server.
  - Bring creative ideas to life: Partner closely with Creative
    to turn approved designs into polished, responsive, cross-
    browser experiences.
  - Create reusable solutions: Build components, templates,
    campaign pages, interactive tools, and major website
    experiences that scale beyond one-off projects.
  - Develop rich interactions: Create engaging web experiences
    using JavaScript and GSAP, including responsive animations
    and scroll-based interactions.
  - Own the full web stack: Work across CMS configuration,
    application code, APIs, databases, forms, integrations,
    routing, caching, redirects, and third-party services.
  - Support our digital ecosystem: Help integrate analytics,
    Google Tag Manager, browser data layers, consent and
    privacy tooling, and other marketing technologies.
  - Ship confidently: Contribute to Git-based development, code
    reviews, Azure DevOps pipelines, testing, releases,
    launches, and production support.
  - Solve complex problems: Diagnose issues across front-end
    code, .NET applications, databases, APIs, IIS, Azure
    services, Cloudflare, caching, integrations, and traffic
    routing.
  - Own your work: Take projects from investigation and
    estimation through implementation, testing, deployment,
    and production support, communicating risks and
    dependencies along the way.
  - Build smarter with AI: Use tools such as GitHub Copilot to
    accelerate development, debugging, documentation,
    refactoring, and code review while ensuring quality,
    security, performance, and maintainability.

  What you’ll bring

  We’re looking for someone who combines strong web
  development fundamentals with curiosity, ownership, and a
  practical approach to solving problems.

  - Professional experience building and supporting production
    websites or web applications in a full-stack development
    role.
  - Strong experience with C#, ASP.NET, ASP.NET MVC, Razor,
    JavaScript, HTML, CSS/SCSS, and SQL Server.
  - Strong front-end skills, particularly responsive
    development, accessibility, cross-browser compatibility,
    and translating designs accurately into code.
  - Experience working with a CMS or content-managed website
    environment. Experience with Kentico Xperience is a plus.
  - Confidence working across multiple layers of a web
    application, from CMS configuration and browser code
    through APIs, application logic, and databases.
  - Experience with APIs, integrations, forms, HTTP behavior,
    caching, Git, deployment pipelines, and production
    releases.
  - Strong debugging and problem-solving skills, including the
    ability to get up to speed quickly with unfamiliar
    systems.
  - Clear communication skills and the ability to explain
    technical considerations and trade-offs to non-technical
    partners.
  - Experience using GitHub Copilot or another AI coding
    assistant as part of a professional development workflow.
  - Bachelor’s degree in Computer Science, Software Engineering,
    a related field, or equivalent practical experience.

  Nice to have

  You don’t need to check every box, but experience in any of
  the following would be valuable:

  - ASP.NET Web Forms
  - Kentico Xperience 13 or Xperience by Kentico
  - Vue, Nuxt or TypeScript
  - Tailwind CSS, jQuery, vanilla JavaScript or GSAP
  - Visual Studio, Visual Studio Code and GitHub
  - Azure DevOps, IIS, Azure Functions or Azure Storage
  - Cloudflare, CDN configuration, caching or traffic routing
  - Technical SEO, website performance and accessibility
  - Consent management, analytics or tag management
  - B2B, enterprise technology or marketing-focused websites

  Why this role matters

  The corporate website sits at the center of Ivanti’s digital
  presence, connecting customers with our products, content,
  campaigns, and brand.

  In this role, you’ll help us move faster, build better
  experiences, and strengthen the technical foundation behind
  our digital marketing ecosystem. Your work will improve
  website performance and reliability, expand reusable
  capabilities for Marketing, and help us deliver secure,
  accessible, engaging experiences at scale.

  Why Ivanti?

  - Friendly flexible working model: Empower excellence whether
    you’re at home or in the office and support work-life
    balance.
  - Competitive compensation & total rewards: Including health,
    wellness, and financial plans tailored for you and your
    family.
  - Global, diverse teams:Collaborate with talented people from
    23+ countries.
  - Learning & development:Grow your skills with access to best-
    in-class learning tools and programs.
  - Equity & belonging:We value every voice. Your story helps
    inform our solutions for a changing world.

  What drives us

  Ivanti’s mission is to elevate human potential within
  organizations by managing, protecting and automating
  technology for continuous innovation.

  It is through diverse and inclusive hiring, decision-making,
  and commitment to our employees and partners that we will
  continue to build and deliver world-class solutions for our
  customers.

  To learn more about Ivanti’s Mission and Core Values.

  Inclusion at Ivanti

  Ivanti is proud to be an Equal Opportunity Employer. We’re
  committed to building a diverse team and fostering an
  inclusive environment where everyone belongs. We welcome
  applicants from all backgrounds and walks of life. Need
  adjustments during the process? Reach out to
  talent@ivanti.com we’re happy to help.

