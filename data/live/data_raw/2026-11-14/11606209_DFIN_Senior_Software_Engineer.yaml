description: |
  Join a dynamic team at the pulse of global markets, where we
  deliver innovative software and service solutions for
  essential financial reporting and capital markets
  transactions. At DFIN, we are a values-driven organization
  that empowers you to build a fulfilling career while
  bringing your authentic self to work every day. Our "Win as
  One" mentality ensures that our team's success is directly
  linked to Client, Shareholder and Employee Satisfaction.  In
  2026, DFIN was named #1 on the 2026 Top 100 Global Most
  Loved Workplaces® by Best Practice Institute. We have also
  been recognized as one of America's Most Loved Workplaces®
  for five consecutive years and a Built In Best Place to Work
  for six years, reflecting our continued commitment to
  supporting employees' total well-being. Enjoy competitive
  compensation, a flexible workplace, comprehensive benefits,
  and opportunities for professional growth. Bring your
  passion and talents to DFIN - because being YOU thrives
  here. Summary: We are looking for technical team members at
  all levels who want to push themselves to deliver best in
  market SaaS solutions. We offer a challenging environment
  where you will have to grow, adapt and use your skills
  consistently. Our customers rely on us in the moments that
  matter. Engineering delivers on that promise. You can read
  the bullets below. But they almost always look the same,
  right? Here is the deal - being a senior engineer here at
  DFIN means helping us deliver SaaS software solutions for
  our customers that primarily work with the SEC or other
  global regulating bodies. Our products are in demand because
  we solve regulatory problems for our customers. As a senior
  engineer, you'll contribute to projects end to end, write
  code that less senior engineers can emulate, understand how
  we operate our systems and help make sure our technology
  grows and doesn't become a big pile of tech debt.
  Responsibilities:

  - Be a key contributor to our development practice: design,
    full-stack development and testing.
  - Write concise, clear, well-tested and well-documented code
    with quality that adheres to industry best practices.
  - Optimize code for quality, performance, scalability,
    efficiency and security; through testing, code scanning,
    refactoring and monitoring.
  - Analyze, design and build solutions that solve the problems
    we have, not the problems that we think we may have one
    day.
  - Build software with people. Product managers, other
    developers, SRE, junior engineers, senior engineers,
    offshore. Construct software that matters.
  - Understands that systems are to be operated and monitoring
    and metrics are important.
  - Engineer for simplicity, reliability, manageability,
    scalability, extensibility, reusability and performance.
  - Makes sure to constantly address technical debt. Shine a
    light on it, even when it hurts.

  Qualifications:

  - Be committed to your development, the products you work on
    and the firm.
  - Experience designing services based and/or tiered web and
    mobile applications.
  - At least 6 years of experience designing and building
    scalable data-driven software applications.
  - Experience developing secure code meeting security standards
    and willing to participate in financial systems security
    practices.
  - Experience in Java, .Net, React, Spring, PostgreSQL, SQL
    Server, CI/CD, GitHub. Generally adaptable across the
    stack.
  - Optional, Azure, AKS, Docker
  - BS in Computer Science or equivalent work experience.

