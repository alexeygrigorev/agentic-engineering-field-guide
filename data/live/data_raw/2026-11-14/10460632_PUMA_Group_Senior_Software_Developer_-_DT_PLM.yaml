description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  - Design and implement robust software solutions that align
    with our business goals and technology strategy.
  - Collaborate with development teams through the entire
    software development lifecycle, ensuring best practices
    and quality standards are met.
  - Support on operational tasks including system monitoring,
    deployment automation, and CI/CD pipeline maintenance,
    with a focus on integrating DevOps practices into
    development workflows.
  - Collaborate with stakeholders to understand requirements and
    translate them into effective software designs.
  - Drive feature development and coordinate enhancements in
    collaboration with cross-functional teams.
  - Stay abreast of emerging technologies and industry trends
  - Ensure the scalability, security, and performance of our
    software systems.
  - Conduct code reviews and provide constructive feedback to
    ensure high-quality code delivery.

  YOUR TALENT

  - Bachelor's or Master's degree in Computer Science,
    Information Technology, or a related field.
  - Minimum of 5 years of experience in software development
  - Very good knowledge of software patterns and best practices.
  - Proficiency in the JAVA programming language and frameworks.
  - Experience with cloud platforms, microservices, and
    containerization technologies.
  - Excellent problem-solving, analytical, and technical skills.
  - Strong communication and interpersonal skills
  - Experience and Knowledge of software architecture patterns
    and best practices
  - Self-reliant and able to make independent decisions.

