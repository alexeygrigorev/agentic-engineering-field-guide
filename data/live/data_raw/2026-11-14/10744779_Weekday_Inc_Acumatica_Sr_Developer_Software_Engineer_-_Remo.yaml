description: |
  This role is for one of Weekday’s clients

  Min Experience: 3+ years Location: USA JobType: full-time

  We are seeking an experienced Acumatica Senior Developer /
  Software Engineer to design, develop, and support customized
  ERP solutions that address complex business requirements.
  This role is ideal for a technically strong developer who
  enjoys working closely with business analysts, clients, and
  cross-functional teams to transform operational needs into
  scalable and effective Acumatica solutions.

  You will work extensively with the Acumatica Cloud xRP
  Platform, C#.NET, T-SQL, APIs, integrations, workflows,
  dashboards, and reporting, while contributing to projects
  across multiple business environments.

  RequirementsKey Responsibilities

  - Translate business requirements into detailed technical
    specifications and scalable Acumatica solutions.
  - Design, develop, customize, and maintain solutions using the
    Acumatica Cloud xRP Platform, C#.NET, and T-SQL.
  - Develop and manage REST API integrations between Acumatica
    and third-party applications.
  - Configure and enhance Acumatica workflows, Generic
    Inquiries, dashboards, and reports.
  - Conduct unit, workflow, regression, and integration testing
    for new and upgraded customizations.
  - Support internal testing and user acceptance testing while
    resolving issues efficiently.
  - Troubleshoot technical problems and collaborate with clients
    and internal teams to identify and implement solutions.
  - Maintain clean source-control practices using GitHub or
    equivalent platforms.
  - Create comprehensive technical documentation covering
    development, configuration, and implementation activities.
  - Participate in project planning, technical discussions, and
    regular coordination meetings.
  - Stay current with Acumatica's development framework, product
    releases, technical standards, and best practices.
  - Provide technical guidance and contribute to continuous
    improvement of development processes.

  Professional Expectations

  - Communicate clearly and professionally with clients,
    business analysts, project managers, and technical teams.
  - Manage multiple development assignments, priorities, and
    deadlines effectively.
  - Maintain accurate project documentation, task updates, and
    support case records.
  - Take ownership of assigned technical deliverables and ensure
    timely completion.
  - Continuously strengthen Acumatica and related development
    expertise through certifications and ongoing learning.
  - Work collaboratively while being capable of operating
    independently when required.

  Required Skills & Qualifications

  - Strong hands-on knowledge of Acumatica Developer Tools and
    the Cloud xRP Platform.
  - Proficiency in C#.NET and Microsoft Visual Studio.
  - Experience with ASP.NET (Classic UI) and TypeScript (Modern
    UI).
  - Strong knowledge of T-SQL and Microsoft SQL Server.
  - Experience developing REST APIs and integrating Acumatica
    with external systems.
  - Experience with GitHub or comparable version-control
    systems.
  - Working knowledge of Microsoft IIS.
  - Familiarity with Microsoft 365 applications including Excel,
    Word, Outlook, Teams, and SharePoint.
  - Strong analytical, troubleshooting, and problem-solving
    capabilities.
  - Excellent communication and stakeholder-management skills.
  - Strong understanding of ERP workflows, business processes,
    and customization principles.
  - Ability to manage multiple priorities while maintaining
    quality and attention to detail.

  Experience & Education

  - 3+ years of professional software development experience
    with Acumatica Cloud xRP, C#.NET, and T-SQL.
  - Demonstrated experience developing, customizing,
    integrating, and supporting Acumatica solutions.
  - Experience working across industries such as distribution,
    manufacturing, construction, or professional services is
    advantageous.
  - Understanding of accounting principles and business
    processes is preferred.
  - Bachelor's degree in Computer Science, Software Engineering,
    Information Technology, or a related discipline, or
    equivalent professional experience.
  - Current Acumatica Application Developer Certification is
    required.
  - Acumatica Integration Developer Certification is preferred.
  - Acumatica Mobile Developer Certification is a plus.

  Work Arrangement

  Remote | Full-Time

  Must-Have Skills

  - Acumatica
  - C#.NET
  - T-SQL
  - Acumatica Cloud xRP
  - ERP Customization

  Good-to-Have Skills

  - Acumatica Integration
  - REST APIs
  - SQL Server
  - TypeScript
  - GitHub
