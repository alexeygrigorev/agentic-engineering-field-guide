description: |
  What We Do:

  Cybercrime is growing, and more businesses are getting hit
  by threats that used to target only the biggest
  organizations. That pushes defenders like us to operate at
  the highest level, and it deepens our need for good people
  who want to make a meaningful impact.

  Founded in 2015 by former NSA cyber operators, Huntress is a
  remote-first team working to make enterprise-grade
  cybersecurity accessible to businesses of all sizes. We work
  closely with security teams and service providers protecting
  complex environments, often without the time or headcount to
  handle it all. That’s why we build our technology in-house
  and back it with a 24/7 human-led Security Operations Center
  (SOC). As a result, our platform is never disconnected from
  the experts who manage it, ensuring our customers'
  protection.

  Huntress now secures more than 6M endpoints and 17M
  identities worldwide. Those numbers keep growing because
  more businesses rely on us to help carry the load and
  operate with more confidence. Every day, you can see that
  commitment in how we stand with our customers and how we
  show up for each other.

  Reports to: Engineering Manager

  Location: Remote US

  Compensation Range: $200,000 - $220,000 base plus bonus and
  equity

  What We Do:

  Cybercrime is growing, and more businesses are getting hit
  by threats that used to target only the biggest
  organizations. That pushes defenders like us to operate at
  the highest level, and it deepens our need for good people
  who want to make a meaningful impact.

  Founded in 2015 by former NSA cyber operators, Huntress is a
  remote-first team working to make enterprise-grade
  cybersecurity accessible to businesses of all sizes. We work
  closely with security teams and service providers protecting
  complex environments, often without the time or headcount to
  handle it all. That’s why we build our technology in-house
  and back it with a 24/7 human-led Security Operations Center
  (SOC). As a result, our platform is never disconnected from
  the experts who manage it, ensuring our customers'
  protection.

  Huntress now secures more than 5M endpoints and 11M
  identities worldwide. Those numbers keep growing because
  more businesses rely on us to help carry the load and
  operate with more confidence. Every day, you can see that
  commitment in how we stand with our customers and how we
  show up for each other.

  What You’ll Do:

  The Huntress team seeks a Staff Software Engineer to join
  our SOC Experience team. This team builds the human-analyst
  side of Huntress’ SOC platform: the investigation and triage
  experience analysts use to work a case, the remediation
  actions they take, the queues that route and prioritize
  incoming work, and the customer-facing reporting that closes
  the loop with customers. Your contributions will help
  Huntress improve analyst efficiency, reduce toil, and drive
  customer outcomes as we scale protection for the 99%.

  As a Staff Software Engineer, you’ll provide technical
  leadership across this surface area: shaping architecture
  and design direction, converting ambiguous requirements into
  functional workflows and data models, raising the bar on
  code quality and testing, and mentoring engineers across the
  team. You’ll partner closely with Product, UX, and SOC
  stakeholders to turn operational pain points into reliable,
  auditable systems, and you’ll go deep in the code yourself.
  This is a full-stack role with real front-end weight: the
  analyst experiences you’ll build are data-dense, interactive
  interfaces, and you’ll set the bar for front-end quality as
  well as the back end.

  Responsibilities:

  - Provide technical leadership across the SOC Experience
    surface area: investigation and triage experience,
    remediation actions, queues, and customer-facing
    reporting.
  - Lead and develop high-quality software, software designs,
    and architecture
  - Design and build analyst-facing interfaces end to end, from
    data model to browser, and set the standard for front-end
    quality (usability, performance, accessibility, reusable
    patterns) in partnership with UX
  - Set the standard for engineering excellence on the team
    through code review, test plan review, and hands-on
    pairing
  - Lead security-by-design reviews of designs and code
  - Focus on the full lifecycle of the systems you build,
    including evolution, configuration, and risk management,
    not just initial delivery
  - Share ownership of delivery, reliability, and uptime for the
    features you build, with observability and test automation
    built in
  - Mentor engineers across the team to help them grow into
    harder problems
  - Balance technical rigor with pragmatism: push back when a
    shortcut creates real risk, and push back on over-
    engineering when the goal is discovery or speed
  - Partner with Product, UX, and SOC stakeholders to turn
    operational pain points into reliable, auditable systems

  What You Bring To The Team:

  - 10+ years of experience developing complex software products
  - 5+ years of programming in Ruby on Rails
  - Strong front-end fundamentals (JavaScript, HTML, CSS) and
    experience building complex interactive UIs with modern
    component-based frameworks; today’s stack is Hotwire,
    Turbo, and Stimulus, but you can reason outside that box
  - Experience with AWS or other public cloud environments, and
    Linux-based infrastructure
  - Experience with relational databases such as Postgres
  - Experience with AI coding tools, such as Claude Code

  Preferred Qualifications:

  - Experience with ClickHouse
  - Experience building cybersecurity products, or
    building/operating a SOC platforms
  - Experience with Hotwire, Stimulus, Turbo

  What We Offer:

  - 100% remote work environment - since our founding in 2015
  - Generous paid time off policy, including vacation, sick
    time, and paid holidays
  - 12 weeks of paid parental leave
  - Highly competitive and comprehensive medical, dental, and
    vision benefits plans
  - 401(k) with a 5% contribution regardless of employee
    contribution
  - Life and Disability insurance plans
  - Stock options for all full-time employees
  - One-time $500 reimbursement for building/upgrading home
    office
  - Annual allowance for education and professional development
    assistance
  - $75 USD/month digital reimbursement
  - Access to the BetterUp platform for coaching, personal, and
    professional growth



