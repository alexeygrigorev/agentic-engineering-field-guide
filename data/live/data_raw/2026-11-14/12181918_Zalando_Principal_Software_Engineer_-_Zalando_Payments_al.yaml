title: Principal Software Engineer - Zalando Payments (all genders)
company: Zalando
location: Berlin, DEU
work_type: FULL_TIME
company_size: 10,000 Employees
description: |
  THE ROLE & THE TEAM

  Reporting directly to the Director, you will move beyond a
  single team’s scope to provide hands-on technical leadership
  for the entire department while also influencing engineering
  strategy, technical standards, and culture at the
  organizational level. You will be responsible for the
  architecture of the systems built within this area, serving
  as a key partner for Product and Engineering Management to
  ensure technology enables departmental objectives and
  business value. You will play a pivotal role in driving
  project delivery with an "agent-augmented delivery" concept,
  shaping how our engineering teams integrate autonomous
  agents into the software development lifecycle.As a
  Principal Software Engineer, you own and drive technical
  design creation for mid-to-large scale projects, factoring
  in scale, reliability, and architectural constraints. You
  are a proactive member of the Principal Engineering
  Community, leveraging insights from across Zalando to set
  technical direction and raise the bar for engineering
  excellence within your department.

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

  - Own technical design and end-to-end delivery of departmental
    projects. Drive the creation of robust technical designs
    for mid-to-large scale initiatives and maintain direct
    ownership of the implementation phase, taking an active,
    hands-on part in the development bearing sometimes full
    responsibility for implementation and delivery of robust,
    high-quality solutions across the entire project
    lifecycle.
  - Partner with leadership to drive hands-on product solutions.
    Act as the primary technical point of contact for Product
    and Engineering Management, translating departmental
    objectives into concrete, deliverable software solutions
    through active participation in the development lifecycle.
  - Execute through high-impact, hands-on engineering. Tackle
    the toughest engineering problems via significant code
    contributions, prototyping, and deep-dive troubleshooting
    to de-risk complex product features and maintain codebase
    mastery.
  - Lead "agent-augmented delivery" through practical
    implementation, ensuring the successful integration of
    autonomous agents and AI-assisted workflows directly into
    our engineering teams' daily delivery cycles.
  - Strengthen departmental expertise through coaching and
    paired delivery. Onboard and mentor engineers by working
    alongside them on critical paths, acting as a Talent
    Champion while ensuring technical excellence in shared
    codebases.
  - Drive operational excellence through active systems
    improvement. Proactively lead improvements in systems and
    processes, moving beyond reviews to implement enhancements
    that bolster production readiness and architectural
    scalability.
  - Drive cross-departmental and organizational initiatives:
    Collaborate with other Principal Engineers and leadership
    to shape technical strategy, standards, and engineering
    culture at the organizational level.

  WE’D LOVE TO MEET YOU IF

  - You are comfortable taking end-to-end ownership of mission-
    critical engineering initiatives and building a deep
    understanding of departmental domains quickly.
  - Customer focus drives your problem solving approach. Your
    deep understanding of engineering excellence required in
    building customer-facing products at scale enables you to
    guide delivery, unblock projects through hands-on work.
  - Experience in agentic systems, AI-driven SDLC, or autonomous
    agent integration within engineering organizations.
  - You are a proactive technical leader who builds deep
    understanding of new domains quickly and brings others
    along. You embrace end-to-end ownership and have guided
    teams through mission-critical engineering initiatives,
    creating clarity and enabling others to do their best
    work.
  - You have exceptional leadership and communication skills,
    with clear proof points for inspiring teams and
    influencing technical and non-technical stakeholders at
    all levels.
  - You have shaped and contributed to company-wide strategy and
    led teams through the aligned change management journey.
  - AI is more than a buzzword to you, backed by concrete
    examples of how you leveraged new tools and methods to
    take delivery, quality, or engineering excellence to the
    next level.
  - Proven experience developing solutions for regulated
    financial institutions or the payments/fintech space.
  - You have a proven track record of reporting to a Head of
    Engineering (or higher) and initiating impactful technical
    improvements across a department.

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - 27 days of holiday a year to start for full-time employees
    (+1 day for every calendar year up to 30 days)
  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Lounge by Zalando, discounts from
    external partners
  - Family support, including counselling and dedicated services
    for parents and carers
  - Company pension scheme
  - Employee shares programme
  - Health and wellbeing options, including Wellhub
  - Mental health support and coaching
  - Development through our training platform and biannual peer-
    to-peer review
  - 2 paid volunteering days a year
  - Relocation assistance (subject to prior agreement)

  INCLUSIVE BY DESIGN

  If you think you have what it takes, we encourage you to
  apply even if you don't meet every single requirement. You
  may just be the right candidate for this or other roles!At
  Zalando, our vision is to be the leading pan-European
  ecosystem for fashion and lifestyle e-commerce – one that
  thrives on diversity and is truly inclusive by design. We
  believe that diverse teams fuel innovation and creativity,
  and we actively seek out talent from all backgrounds.We
  actively seek to reduce bias in our hiring and employment
  processes, focusing on your qualifications, skills, and
  contributions.

  To support this, we kindly ask that you refrain from
  including personal details such as your photo, age, or
  marital status in your CV, ensuring a fair and equitable
  evaluation based solely on your abilities and potential.We
  are committed to providing an exceptional and accessible
  candidate experience for everyone. If you require any
  accommodations to support you throughout the hiring process,
  please let us know – we are here to assist you.Discover more
  about our commitment to creating a diverse and inclusive
  workplace: https://jobs.zalando.com/en/our-
  culture/diversity-and-inclusion
