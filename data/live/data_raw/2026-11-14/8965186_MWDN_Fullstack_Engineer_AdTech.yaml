description: |
  Description

  MWDN is an international recruitment and outstaffing company
  with 23+ years of experience connecting exceptional tech
  talent with leading companies across Israel, the USA, Great
  Britain, and Western Europe. In this role, MWDN acts as the
  recruitment partner, and the selected candidate will work
  directly with the client’s team on their product in an
  international environment.

  Why does MWDN rock?

  Here’s what you can expect when you join MWDN:

  - Security: We carefully vet our clients to minimize risks and
    ensure reliability and timely payments—no fraud or
    unpleasant surprises.
  - Career support: If a project isn’t the right fit, we support
    you and actively help find new opportunities that match
    your skills and career goals.
  - Legal assistance: We provide guidance on legal matters,
    including opening and managing your independent contractor
    or sole proprietorship status, taxes, and related
    processes.
  - Professional development: We offer English courses and
    professional growth opportunities, as well as team-
    building events.

  Why choose us? MWDN is ranked among the top 5 IT employers
  in our region according to DOU. We take pride in our
  transparency and strong commitment to our team. Curious to
  learn more? See what our employees say about working with us
  on DOU.

  What is your new project?

  Domain: Data Infrastructure & Analytics / AdTech

  Client Location: Israel

  Company size: 11–50

  Founded in: 2025

  A fast‑growing ad‑tech company building next‑generation
  programmatic advertising infrastructure. The team focuses on
  high‑performance systems, real‑time bidding, and AI‑driven
  optimization. The environment is fast, product‑focused, and
  highly collaborative, with strong engineering leadership and
  a culture of ownership.

  What makes this project exciting?

  We're looking for a Senior Full Stack Developer to join our
  engineering team and help shape the future of programmatic
  advertising. You'll architect and build high‑performance
  systems that process millions of ad transactions in real
  time, while leveraging cutting‑edge AI technologies to
  optimize outcomes for our partners.

  This role sits at the intersection of ad‑tech and AI,
  working with massive‑scale systems and sub‑millisecond
  latency requirements. You’ll own the full development
  lifecycle from architecture to deployment, collaborating
  with a modern, high‑performing engineering team.

  What makes you a great fit

  - 7+ years of professional software development experience
  - 3+ years working in programmatic advertising or ad-tech
  - Strong proficiency in JavaScript/TypeScript, React, Node.js,
    and Python
  - Hands-on experience with Prebid.js, Prebid Server, or
    similar header bidding solutions
  - Working knowledge of OpenRTB protocol and bid stream
    mechanics
  - Experience integrating with ad servers (Google Ad Manager,
    custom ad servers) and SSP/DSP platforms
  - Understanding of auction dynamics, floor pricing, and yield
    optimization strategies
  - Familiarity with video advertising (VAST, VPAID) and CTV/OTT
    environments is a plus

  Ad-Tech Stack:

  - SSP/DSP platforms: Magnite (Rubicon), PubMatic, Index
    Exchange, Xandr (AppNexus), OpenX, Amazon TAM
  - Header bidding: Prebid.js, Prebid Server, Amazon TAM/UAM,
    Google Open Bidding
  - Ad servers: Google Ad Manager (GAM/DFP), custom ad serving
    solutions
  - Protocols: OpenRTB 2.5/2.6, VAST 4.x, VPAID, ads.txt,
    sellers.json, SupplyChain Object
  - Privacy/Consent: TCF 2.2, GPP, CMP integration, GDPR/CCPA
    compliance Development Stack:
  - Frontend: React, TypeScript, Next.js
  - Backend: Node.js, Python, FastAPI, Express
  - Data: PostgreSQL, Redis, Kafka, ClickHouse
  - Infrastructure: AWS, Kubernetes, Terraform, Cloudflare
    Workers

  Nice to Have

  - Experience building or contributing to ad server platforms
  - Familiarity with AI/ML applications in ad-tech (bid
    optimization, contextual targeting)
  - Background in publisher-side monetization or ad ops
  - Experience with mobile advertising SDKs and in-app
    monetization
  - Knowledge of identity solutions (UID2, ID5, LiveRamp) and
    cookieless targeting

  Your day-to-day in this position

  - Design and develop full-stack applications for programmatic
    advertising workflows using React, Node.js, and Python
  - Build and maintain integrations with major SSPs (Magnite,
    PubMatic, Index Exchange, Xandr, OpenX) and DSPs
  - Implement and optimize Prebid.js and Prebid Server
    configurations for header bidding
  - Develop OpenRTB-compliant bid request/response handling and
    auction logic
  - Build ad serving infrastructure including VAST/VPAID video
    ad implementations
  - Create publisher-facing dashboards for yield management,
    analytics, and reporting
  - Implement ads.txt, sellers.json, and supply chain
    transparency tools
  - Ensure compliance with privacy frameworks (GDPR, CCPA, TCF
    2.2) and consent management
  - Collaborate with product, partnerships, and data teams to
    deliver end-to-end solutions

  Why work with us?

  - People-first management with minimal bureaucracy
  - A friendly company culture, proven by employees who choose
    to return
  - Flexible working hours
  - 29 days of PTO (18 working days per year pluse all national
    holidays)
  - 10 paid sick days
  - Full financial and legal support for independent contractors
  - Free English classes, with native speakers or Ukrainian
    teachers
  - Dedicated HR support

