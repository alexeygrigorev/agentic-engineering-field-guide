description: |
  What we’re building and why we’re building it.

  Fetch helps people live rewarded every day, with a vision to
  become the rewards destination for everyone. We turn
  everyday activities into meaningful rewards, whether it’s
  grocery shopping, grabbing a quick meal, or playing a
  favorite mobile game. To date, we’ve awarded more than $1
  billion in Fetch Points to our users.

  Each day, more than 13 million receipts are submitted on
  Fetch, providing visibility into over $212 billion in gross
  merchandise value. This creates the largest retail-agnostic,
  SKU-level view of household spending, powering Fetch as an
  outcomes-based advertising platform that helps brands
  acquire and retain lifelong consumers.

  The Fetch app is available on the App Store and Google Play,
  with more than 6 million five-star reviews from a highly
  engaged and loyal user base.

  It’s not just our users who believe in Fetch: with
  investments from Softbank, ICONIQ, DST, Greycroft, and
  partnerships ranging from challenger brands to Fortune 500
  companies, Fetch is reshaping how brands and consumers
  connect in the marketplace. When you work at Fetch, you play
  a vital role in a platform that drives brand loyalty and
  creates lifelong consumers with the power of Fetch points.
  User and partner success are at the heart of everything we
  do, and we extend that same commitment to our employees.

  At Fetch, we value curiosity, adaptability, and the
  confidence to explore new tools, especially AI, to drive
  smarter, faster work. You don’t need to be an expert, but
  you should be ready to learn quickly and think critically.
  We welcome learners who move fast, challenge the status quo,
  and shape what’s next, with us.  Ranked as one of America’s
  Best Startup Employers by Forbes for two years in a row,
  Fetch fosters a people-first culture rooted in trust,
  accountability, and innovation. We encourage our employees
  to challenge ideas, think bigger, and always bring the fun
  to Fetch.

  About the Role

  We are hiring a Senior iOS Software Engineer to help build
  high-quality mobile experiences used by millions of users.
  In this role, you will work closely with cross-functional
  partners and other mobile engineers to design, build, and
  improve product features across the iOS app.

  You’ll contribute throughout the development lifecycle, from
  technical design and implementation to testing, release, and
  iteration. We’re looking for an engineer who is comfortable
  working in a modern iOS codebase, collaborating across
  teams, and making thoughtful technical decisions that
  improve both the user experience and the maintainability of
  the product.

  You’ll work with a modern iOS stack that includes Swift,
  SwiftUI, async/await, Combine, dependency injection, and
  modular architecture, along with strong tooling for testing,
  observability, and delivery.

  What You’ll Do

  - Build, ship, and maintain user-facing iOS features in
    collaboration with product, design, and engineering
    partners
  - Contribute to the technical design and implementation of
    scalable, reliable mobile functionality
  - Write clean, maintainable Swift code using modern iOS
    patterns and frameworks
  - Work across the app to improve performance, quality, and
    overall user experience
  - Build reusable components and shared abstractions that
    support faster feature development
  - Use modern concurrency patterns to manage asynchronous
    workflows and keep the app responsive
  - Partner with teammates on code reviews, technical
    discussions, and architecture decisions
  - Debug production issues, identify root causes, and deliver
    thoughtful fixes
  - Contribute to testing strategy, release readiness, and
    ongoing product iteration
  - Evaluate new tools, frameworks, and engineering approaches
    that improve development velocity and product quality

  Minimum Qualifications

  - 5+ years of experience developing and shipping iOS
    applications
  - Strong proficiency in Swift and core iOS development
    fundamentals
  - Experience building features with SwiftUI and working in
    mixed SwiftUI/UIKit environments
  - Solid understanding of modern concurrency in iOS, including
    async/await, task management, and main-thread/UI
    coordination
  - Familiarity with Combine and asynchronous data flow patterns
  - Experience with common iOS architecture patterns such as
    MVVM, dependency injection, and modular design
  - Strong debugging and problem-solving skills in production
    mobile environments
  - Experience integrating APIs, modeling data, and handling
    network-driven application flows
  - Ability to work effectively on cross-functional product
    teams and communicate clearly with engineering and non-
    engineering partners
  - High degree of ownership and comfort driving work from
    implementation through release
  - Proficiency in AI-assisted development tools and practical
    uses of new engineering workflows
  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field, or equivalent experience

  Preferred Qualifications

  - Product and Innovation mindset geared to pushing boundaries
    of what’s possible
  - Experience designing reusable UI components, embedding
    animations, or shared feature foundations
  - Experience building complex, consumer-facing mobile features
    at scale
  - Strong understanding of performance optimization, app
    responsiveness, and memory management on iOS
  - Familiarity with automated testing strategies for iOS
    applications
  - Experience with CI/CD workflows and mobile release processes
  - Exposure to large, modular codebases with multiple
    contributors
  - Experience mentoring other engineers or helping guide
    technical design decisions

  Compensation:

  At Fetch, we offer competitive compensation packages
  including base, equity, and benefits to the exceptional
  folks we hire. The base salary range for this position is
  [$162,198 - $190,800]. Discover our benefits and how our
  employees live rewarded at https://fetch.com/careers.

  At Fetch, we'll give you the tools to feel healthy, happy
  and secure through:

  - Equity: We offer full-time employees equity in Fetch, so
    that everyone can benefit from Fetch’s growth.
  - 401(k): Fetch will match your contributions dollar for
    dollar, up to 4% of your eligible pay.
  - Benefits for humans and pets: We offer comprehensive
    medical, dental, and vision plans for everyone, including
    your pets.
  - Continuing Education: Fetch provides ten thousand per year
    in education reimbursement.
  - Employee Resource Groups: Take part in employee-led groups
    that are centered around fostering a diverse and inclusive
    workplace through events, dialogue, and advocacy. The ERGs
    participate in our Inclusion Council with members of
    executive leadership.
  - Paid Time Off: On top of our flexible PTO, Fetch observes 9
    paid holidays, as well as our year-end week-long break.
    (Holidays will vary for Canada-based roles)
  - Robust Leave Policies: 14 weeks of fully paid parental leave
    for all employees, plus 6 additional weeks of paid
    childbirth recovery leave for birthing parents, and a
    flexible return-to-work schedule.
  - Calvin Care Cash: Employees who are welcoming new family
    members will also receive a one-time $2,000 incentive to
    assist employees with covering the cost of childcare,
    clothing, diapers, and much more!
  - Flexible Work Environment: Collaborate with your team in one
    of our stunning offices, or you can work fully remotely
    from anywhere in the US for US-based roles. We’ll ensure
    you are equally equipped with the hardware and software
    you need to get your job done in the comfort of your home.
    (applicable for most roles)

