description: |
  Compensation:

  Pay Range: $85,000.00 - $130,000.00 USD

  Responsibilities:

  Our software engineers design and develop custom software,
  systems, and integrations. You will have the opportunity to
  work with a team of fellow software engineers, QA engineers,
  and business systems analysts in an agile/scrum process to
  deliver enhanced product value. In addition to writing code,
  the successful candidate will design technical solutions
  with IT operations teams, participate in scrum ceremonies,
  and work with stakeholders to understand workflows and
  requests. They are also expected to complete tasks assigned
  to them but are also expected to utilize critical thinking
  to identify design issues and propose technical or
  functional enhancements.

  Location: Remote - U.S.

  Required Skills:

  - A minimum of three (3) years experience in Python within a
    professional environment.
  - Python development interfacing with various databases (RDS
    and NoSQL).
  - Design and develop software according to ticket
    specifications
  - Participate on both sides of code review – giving and
    receiving feedback
  - Participate in scrum ceremonies, including backlog grooming,
    sprint planning, and daily standups
  - Meet with stakeholders to understand workflows
  - Help leads and systems analysts curate tickets, providing
    workflow analysis
  - Monitor process and log information and troubleshoot
    problems identified
  - Develop, maintain, and enhance Python applications with a
    focus on scalability, performance, and security.
  - Experience with Flask and/or Django.
  - Experience working in various frameworks.
  - Experience with frontend web development using HTML, CSS,
    and JavaScript
  - Strongly recommend experience with frontend frameworks like
    ReactJS
  - Good understanding of relational databases, ex: MySQL.
  - Must be able to confidently write and optimize complex
    queries involving multiple tables.
  - Experience with using non-relational databases, ex: MongoDB.
  - Ability to programmatically read and write a variety of
    structured and unstructured formats, such as JSON, CSV,
    and XML
  - Experience with production and consumption of web services
    (ex: REST, SOAP, AMQP)
  - Basic understanding and usage of Docker containers
  - Competency in translating functional requirements into
    technical requirements, highlighting complexity and
    problematic areas.
  - Knowledge of, or interest in learning lab processes,
    protocols and data structures

  Preferred Experience:

  - Bachelor’s in Computer Science or related discipline is
    recommended, but not required
  - Experience with and/or certifications in AWS or other cloud
    technologies is a plus

