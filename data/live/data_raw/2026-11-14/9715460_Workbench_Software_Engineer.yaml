description: |
  Company Overview

  Workbench is a San Francisco based company that develops a
  platform to connect students with craft shops, trade
  schools, and makerspaces to learn hands-on skills, while
  providing businesses with powerful tools for class
  management, scheduling, payments, and reporting. We are
  dedicated to creating cutting-edge software solutions that
  empower small businesses to achieve their goals. As an
  early-stage company, we offer a unique opportunity for
  employees to make a significant impact and grow with us.

  Job Title

  Software Engineer

  Job Location

  United States (Remote)

  Years of Experience

  2-5

  Job Description

  We are seeking a talented and motivated software engineer to
  join our team as a full stack developer. As an early
  employee at Workbench, you will have the opportunity to work
  on a variety of projects and contribute to the development
  of our core products. You will collaborate closely with our
  team to design, develop, and deploy high-quality software
  solutions.

  Responsibilities

  - Design, develop, and maintain web applications and services
  - Collaborate with cross-functional teams to define, design,
    and ship new features
  - Write clean, maintainable, and efficient code
  - Participate in code reviews and provide constructive
    feedback
  - Troubleshoot and debug applications
  - Stay up-to-date with the latest industry trends and
    technologies

  Required Skills

  - Proficiency in JavaScript, Python, Java, HTML/CSS, and
    TypeScript
  - 2 - 5 years experience as a software engineer
  - Full stack development capabilities
  - Ability to thrive in a startup environment
  - Strong problem-solving skills
  - Excellent communication and teamwork abilities
  - Bachelors in Computer Science or equivalent

  Why Workbench?

  At Workbench, we value innovation, collaboration, and
  personal growth. As an early employee, you will have the
  chance to shape the future of our company and grow your
  career in a supportive and dynamic environment. Join us and
  be part of a team that is passionate about making a
  difference.
