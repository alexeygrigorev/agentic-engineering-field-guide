description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Backend Engineering Intern to join Bask
  Health's engineering team and gain hands-on experience
  building software for our telehealth platform.

  You'll work alongside experienced engineers on backend
  services, APIs, databases, and internal tools that support
  patient experiences, clinical workflows, pharmacy
  operations, and merchant-facing applications.

  This internship is designed for students and early-career
  developers who have a foundation in programming and want to
  learn how professional engineering teams design, build,
  test, and maintain production software.

  Our engineering stack includes TypeScript, Node.js, AWS,
  SST, and SQL databases, with technologies such as Prisma,
  Drizzle, and tRPC used across the platform.

  You'll receive guidance through code reviews and technical
  discussions while contributing to well-defined projects with
  practical outcomes.

  We don't expect you to know every technology in our stack
  before joining. We're looking for someone who is curious,
  enjoys writing code, asks thoughtful questions, and wants to
  improve through real engineering work.

  You'll have opportunities to see how backend systems connect
  to the rest of our platform and develop a stronger
  understanding of software architecture, testing, security,
  and deployment.

  What You'll Do

  - Contribute to backend development projects under the
    guidance of experienced engineers.
  - Build and improve small APIs, backend services, and
    application features using TypeScript and Node.js.
  - Work with SQL databases to retrieve, update, and organize
    application data.
  - Assist with backend functionality supporting patient
    experiences, clinical workflows, pharmacy operations, and
    merchant tools.
  - Help develop and maintain integrations between internal
    services and third-party APIs.
  - Learn how Bask uses AWS and SST to build and deploy
    serverless applications.
  - Assist with writing database queries, updating data models,
    and implementing application logic.
  - Write automated tests to verify backend functionality and
    help prevent regressions.
  - Investigate bugs, reproduce issues, and work with engineers
    to identify solutions.
  - Participate in code reviews and learn how to improve code
    quality, readability, and maintainability.
  - Collaborate with engineers to understand technical
    requirements and break work into manageable tasks.
  - Help maintain documentation for APIs, backend features, and
    development workflows.
  - Use AI-assisted development tools such as Cursor and Claude
    Code to support coding, debugging, testing, and learning
    while reviewing generated code carefully.
  - Learn how authentication, authorization, and application
    security are implemented in production systems.
  - Assist with monitoring, logging, and troubleshooting backend
    services.
  - Contribute to improving existing code, simplifying
    workflows, and reducing repetitive engineering tasks.
  - Work on clearly defined projects with measurable outcomes
    and feedback from an engineering mentor.
  - Learn how changes are tested, reviewed, deployed, and
    monitored in a production environment.
  - Participate in engineering discussions, ask questions, and
    share ideas.
  - Develop practical experience with Git, collaborative
    development, and professional software engineering
    practices.
  - Build confidence in independently completing smaller
    engineering tasks while learning from the team.

  Requirements

  - Currently pursuing a degree in Computer Science, Software
    Engineering, Computer Engineering, or a related technical
    field, or developing equivalent skills through self-study,
    bootcamps, or practical projects.
  - Basic programming experience with JavaScript, TypeScript, or
    another modern programming language.
  - Familiarity with programming fundamentals, data structures,
    and basic software design principles.
  - Experience building software through coursework, personal
    projects, internships, or open-source contributions.
  - Basic understanding of how web applications, APIs, and
    backend services work.
  - Familiarity with relational databases or introductory SQL
    concepts.
  - Basic experience with Git or another version control system.
  - Ability to write readable code and explain your approach to
    solving programming problems.
  - Willingness to learn backend development using TypeScript
    and Node.js.
  - Interest in cloud infrastructure, APIs, databases, and
    production software development.
  - Ability to debug basic programming issues and seek guidance
    when needed.
  - Willingness to learn automated testing and software quality
    practices.
  - Interest in using AI-assisted development tools while
    understanding and validating the code they produce.
  - Strong curiosity, initiative, and attention to detail.
  - Ability to communicate clearly, ask questions, and
    incorporate feedback.
  - Comfortable collaborating with engineers and working on
    assigned projects.
  - Willingness to learn unfamiliar technologies and development
    workflows.
  - No previous professional engineering or healthcare
    experience required.

  Nice to Have

  - Coursework or personal projects involving backend
    development.
  - Experience building applications with JavaScript,
    TypeScript, or Node.js.
  - Familiarity with REST APIs or other web service
    technologies.
  - Experience using PostgreSQL, MySQL, SQLite, or another
    relational database.
  - Exposure to AWS, SST, or other cloud platforms.
  - Familiarity with Prisma, Drizzle, or tRPC.
  - Experience building full-stack applications using React or
    Next.js.
  - Experience deploying a personal project or application.
  - Familiarity with automated testing frameworks.
  - Experience integrating third-party APIs.
  - Basic understanding of authentication, authorization, and
    application security.
  - Familiarity with serverless applications, background jobs,
    or asynchronous programming.
  - Experience contributing to open-source projects or
    participating in hackathons.
  - A GitHub profile or portfolio demonstrating technical
    projects.
  - Experience using Cursor, Claude Code, or similar AI-assisted
    development tools.
  - Interest in healthcare technology, SaaS platforms, or
    e-commerce systems.
