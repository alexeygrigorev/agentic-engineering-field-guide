description: |
  Fullstack Engineer

  About Hipp

  Hipp is an AI-native healthcare platform built to modernize
  operations for non-hospital healthcare providers. We partner
  closely with ABA, behavioral health, and therapy
  organizations to streamline clinical workflows, billing, and
  revenue cycle operations — so providers can focus on
  delivering care.

  Our platform combines EMR, billing infrastructure, and
  operational workflows with AI-driven automation, helping
  providers run more efficient practices and improve patient
  outcomes.

  We’re building the next generation of healthcare
  infrastructure and are looking for thoughtful, product-
  minded engineers who want to build real systems, move
  quickly, and take ownership in a fast-moving startup
  environment.

  Role Overview

  As a Fullstack Engineer at Hipp, you will design, build, and
  ship production features across the Hipp platform. You’ll
  work across backend services, APIs, and frontend systems
  that power core clinical, operational, and billing workflows
  for healthcare providers.

  This role is ideal for an engineer with 3–4 years of
  experience who enjoys working across the stack, shipping
  quickly, and owning meaningful product and technical
  problems from idea to production. You’ll collaborate closely
  with engineers, product managers, and designers to build
  scalable systems that directly impact the day-to-day
  operations of healthcare organizations.

  What You’ll Do

  - Build and ship production features used by healthcare
    providers every day
  - Work across backend services, APIs, and frontend systems
    throughout the Hipp platform
  - Design and implement scalable systems supporting Hipp’s AI-
    native EMR, billing, and operational workflows
  - Partner closely with product, design, and engineering to
    deliver high-quality, user-facing features
  - Take ownership of projects from early design through
    implementation, testing, launch, and iteration
  - Write clean, maintainable, and well-tested code
  - Participate in code reviews, technical discussions, and
    architectural decisions
  - Help improve developer workflows, system reliability, and
    engineering quality as the platform scales

  What We’re Looking For

  - 3–4 years of software engineering experience building
    production applications
  - Strong foundation in software engineering fundamentals, data
    structures, and system design
  - Experience building across the stack, including both backend
    systems and user-facing product features
  - Proficiency in at least one backend language such as Python,
    Go, Java, or Node.js / TypeScript
  - Experience with modern frontend development using React,
    TypeScript / JavaScript, and APIs
  - Experience designing and consuming REST APIs or other
    service interfaces
  - Strong product sense and ability to translate requirements
    into reliable, scalable software
  - Comfort working in a collaborative, fast-paced environment
    with a high degree of ownership
  - Curiosity, pragmatism, and a willingness to learn new tools
    and technologies quickly

  Nice to Have

  - Experience with cloud platforms such as AWS, GCP, or Azure
  - Familiarity with distributed systems, asynchronous
    workflows, or microservices
  - Experience with databases such as PostgreSQL, MySQL, or
    NoSQL systems
  - Startup experience or experience working on small, fast-
    moving engineering teams
  - Exposure to healthcare technology, EMR / EHR systems,
    billing workflows, or revenue cycle operations
  - Interest in AI systems, workflow automation, or data-
    intensive products

  Why Join Hipp

  - Build real production systems used by healthcare providers
    every day
  - Join Hipp’s early engineering team and help shape the
    architecture, systems, and product foundations of the
    company
  - Work at the intersection of AI, healthcare infrastructure,
    billing, and modern software systems
  - Own meaningful product and technical problems with a high
    degree of autonomy
  - Move quickly, ship often, and have a direct impact on how
    the company and product evolve
  - Help modernize healthcare operations for providers
    delivering critical care to patients
