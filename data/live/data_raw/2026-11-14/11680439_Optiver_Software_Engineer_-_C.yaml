description: |
  Optiver is looking for Software Engineers to join our High-
  Frequency Trading (HFT) team in New York City. Our HFT team
  is comprised of software engineers and researchers who
  design, improve and execute fully automated trading
  strategies using machine learning. As a software engineer,
  you’ll work on complex technical projects, help shape the
  direction of our trading infrastructure, and work closely
  with teams to share knowledge and drive technical progress.

  Our software engineers work on some of the most challenging
  algorithmic problems in the world. The team owns the problem
  end to end, from data to simulation to the execution of
  orders in production. The system is built to be robust,
  enabling research at scale while running complex machine
  learning models with low latency across thousands of
  financial instruments.

  What you’ll do

  - Partner deeply with researchers to solve complex, high-value
    business problems specific to our equity and ETF systems
  - Build and maintain end-to-end trading infrastructure, from
    research to production execution
  - Push frequent, impactful code changes to the production
    environment
  - Contribute to the Optiver stack and our pricing, research
    and trading models from ideation through to implementation
  - Ensure new and existing programs adhere to our coding,
    architectural, and operational standards
  - Develop a deep understanding of trading and exchanges

  What you’ll get

  You’ll join a culture of collaboration and excellence,
  surrounded by curious thinkers and creative problem-solvers.
  Motivated by a passion for continuous improvement, you’ll
  thrive in a supportive, high-performing environment
  alongside talented colleagues, collectively tackling some of
  the toughest challenges in the financial markets.

  In addition, you’ll receive:

  - The opportunity to work alongside best-in-class
    professionals from over 40 different countries
  - A highly competitive compensation package
  - Global profit-sharing pool and performance-based bonus
    structure
  - 401(k) match up to 50%
  - Comprehensive health, mental, dental, vision, disability,
    and life coverage
  - 25 paid vacation days alongside market holidays
  - Extensive office perks, including breakfast, lunch and
    snacks, regular social events, clubs, sporting leagues and
    more

  Who you are

  - Strong engineering instincts and a deep understanding of
    computer science fundamentals
  - 2+ years preferred of C++ experience in low-latency systems
    like market data ingestion, order routing, execution
    performance, or simulation frameworks
  - Expertise in C++ is strongly preferred; experience with C,
    Python or Linux is a plus
  - Innovative, out-of-the-box thinking grounded in real-world
    pragmatism
  - Desire to continuously improve in a rapidly evolving
    environment
  - Readiness to set technical direction, promote engineering
    principles, and do the right thing

  Who we are

  Optiver is a global market maker driven by technology. Our
  mission is to improve the market by injecting liquidity,
  providing accurate pricing, increasing transparency and
  stabilizing the market no matter the conditions. With a
  focus on continuous improvement, we prioritize safeguarding
  the health and efficiency of the markets for all
  participants. As one of the largest market making
  institutions, we are a respected partner on 100+ exchanges
  across the globe.

  We value in-person collaboration across disciplines, and
  this role is based on-site at our New York City office.

  Applicants may submit up to three applications per calendar
  year across all open roles.

  Our differences are our edge. Optiver does not discriminate
  on the basis of race, religion, color, sex, gender identity,
  sexual orientation, age, physical or mental disability, or
  other legally protected characteristics.

  Below is the expected base salary for this position. This
  position will also be eligible for a discretionary bonus and
  Optiver’s benefits package with the benefits listed above.

  Base Salary Range

  $200,000—$200,000 USD
