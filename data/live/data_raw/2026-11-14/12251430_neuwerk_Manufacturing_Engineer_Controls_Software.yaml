description: |
  Designs, develops, and supports industrial control systems
  with a focus on PLC, HMI, and robotics programming. Provides
  technical support for industrial communication networks
  (e.g., EtherCAT) and contributes to the expansion and
  maintenance of data acquisition systems through software
  development and system integration.

  Responsibilities

  - Provide technical support for maintenance and production,
    focusing on PLCs, robotics, and automation systems
  - Specify, acquire, and develop programmable controls for new
    equipment, product launches, and process improvements
  - Identify and resolve control system issues impacting
    equipment reliability and performance
  - Support FMEA development and maintenance as a
    software/controls resource
  - Conduct time studies and drive efficiency improvements
    (cycle time, material usage, process stability)
  - Troubleshoot and modify PLC, HMI, and industrial
    communication systems
  - Program and troubleshoot robotics for new product and
    tooling introductions
  - Support and expand digitalization / Industry 4.0
    initiatives, including developing new use cases

  Qualifications

  - BS Electrical or Computer Engineering. Other engineering
    degrees may be considered dependent on software
    experience.
  - 2+ years’ experience engineer in automated manufacturing
  - 1+ years’ experience in database systems
  - 1+ years’ experience in project management
  - Technical Skills:
    - Knowledge of industrial control system programming
    - Knowledge of HMI programming
    - Knowledge of Hydraulics and Pneumatics
    - Knowledge of Robotics programming
    - Knowledge of factory digitalization devices and software
      (ie. Edge devices, sequel server)
    - Knowledge of industrial controls networks (ie EtherCat)
    - Knowledge Microsoft office
  - Relocation benefits would be offered for this job opening
  - Legal authorization to work in the U.S. is required. We will
    not sponsor individuals for employment visas, now or in
    the future, for this job opening.
