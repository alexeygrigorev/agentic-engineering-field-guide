description: |
  Job Summary:

  JOB DESCRIPTION – Senior Software Engineer- Platform

  Location: Remote, United Kingdom, with travel to London for
  meetings when required.

  Division: Ticketmaster

  Contract Terms: Permanent, Full-time

  THE TEAM

  You will be joining the diverse Global Ticketmaster Platform
  Engineering team. As a Senior Software Engineer at
  Ticketmaster, you will be responsible for analyzing, coding,
  and maintaining the next generation of fan-facing services
  for Ticketmaster, the global leader in ticket management for
  large-scale sports and entertainment. You will work closely
  with other engineers, product owners and managers, and
  representatives from the business, to deliver unique, high
  quality, efficient, maintainable, and easy to use services.
  The software you will work on will be used by millions of
  people worldwide.

  A career at Ticketmaster will challenge and engage you. We
  support the creators and producers of shows and live
  performances while connecting more passionate fans to these
  events. As a global and growing business, we can truly offer
  a world of opportunities to expand your skills and develop
  your career. Visit any of our offices, and you'll find a
  diverse mix of passionate employees, helping fans around the
  globe connect with the artists, teams and events they love.
  It truly is a unique and rewarding environment.

  THE JOB

  In the role of Senior Software Engineer, you’ll guide the
  development and delivery of our Global Platform which drives
  over 10 billion dollars of revenue annually. You will be
  accountable for delivering high quality, maintainable and
  performant solutions. You must think about solving complex
  technical problems and the long-term maintenance and cost of
  change of software solutions.

  You will mentor and elevate engineers through technical
  leadership, code reviews, and engineering best practices to
  deliver the best ticketing experience across the globe.
  You’ll help teams fulfil technical, operational, and
  business requirements by putting yourself in the trenches.

  You will emphasise collaboration and mutual support –
  sharing project workflow with globally distributed teams,
  contributing code to core global services and applications,
  and cultural exchange between development groups. It is an
  exciting time to join Ticketmaster as we are working towards
  aligning our technologies and products globally.

  Because our business is online 24/7, you may on occasion be
  required to work out of hours or provide on-call duty on a
  rota basis.

  WHAT YOU WILL BE DOING

  - Contribute to and collaborate on development work across
    globally distributed software teams, driving alignment on
    shared components and standards.
  - Ensure applicability of global applications to global
    markets.
  - Ability to organize, prioritise; multitask while
    coordinating team efforts, reporting to stakeholders and
    management on the progress of goals.
  - Connect with a series of stakeholders in order to gather as
    much information as possible regarding the problem at hand
    and implement short-mid term strategies to evolve products
    for future success.(UX / Design / Product…etc.).
  - Objectively explore multiple approaches and recommend the
    best technical direction including logic and reasoning.
  - Meaningful participation in web, native app and service
    layer architecture design.
  - Spike and prototype.
  - Write exemplary code.
  - Own the full development and deployment cycle for your
    software.
  - Proactively identify and reduce technical debt, ensuring
    long-term maintainability of platform services.
  - Design and advocate for clean, well-structured, and secure
    APIs, ensuring consistency, usability, and resilience
    across services.
  - Evaluate and select appropriate cloud services and
    infrastructure patterns, considering scalability,
    operational overhead, and cost implications for platform
    components.
  - Encourage and grow developers in their craft.
  - Debug and triage production application issues, often not
    your own.
  - Automate testing, deployments, performance, and recovery.
  - Leverage AI-assisted development tools to improve
    engineering productivity, while evaluating AI
    applicability for software solutions.
  - Participate in on-call rotations, lead incident resolution,
    and contribute to post-incident reviews.

  WHAT YOU NEED TO KNOW (or TECHNICAL SKILLS)

  - 5+ years of professional software engineering experience,
    with demonstrated ownership of major software components
  - Experience with Agile methodologies
  - Strong backend development skills
  - Proven ability to design and implement clean, scalable and
    well-structured APIs
  - Java21/25 programming language experience or of other JVM
    languages
  - Experience with modern frameworks such as Springboot
  - Test-Driven Development experience
  - Understanding of Continuous Integration practices
  - Knowledge of current software architectural trends and
    practices
  - Previous experience with Design Patterns and SOLID
    principles
  - Experience working with AWS or other Cloud Provider
  - Experience with observability tooling (Prometheus, Grafana,
    Splunk, or ELK stack)
  - Experience with distributed systems
  - Knowledge of best practices and IT operations in an always-
    up, always-available services
  - Understanding of secure coding practices and common
    vulnerability patterns (e.g., OWASP Top 10)
  - Awareness of cloud service trade-offs, including scalability
    constraints, operational complexity, and cost implications
    when selecting infrastructure components.
  - Familiarity with AI-assisted development tools and their
    appropriate application
  - Experience with CI/CD servers (Gitlab/Jenkins)
  - Experience with Docker and Kubernetes or other
    orchestration/scheduling framework
  - Experience working in an SOA development environment
  - Working knowledge of one or more database products (e.g.
    Oracle, MySQL, PostgreSQL)
  - Strong communication skills and the ability to collaborate
    closely with remote team members

  Nice to have

  - Experience in DevOps
  - Experience with GraphQL and Apollo Studio
  - Experience working with Terraform
  - Experience with Helm package manager
  - Ability to clearly communicate technical topics to non-
    technical people
  - Demonstrated ability to work well in a fast-paced,
    multidisciplinary team environment

  It is ok if you lack some of the skills listed above, the
  single most important skill is being able to learn quickly.
  We believe that a motivated, team-oriented professional will
  always succeed in mastering a new toolset when a need
  arises.



  YOU (BEHAVIOURAL SKILLS)

  - Reliability: You consistently deliver to defined quality
    standards even under competing priorities. You proactively
    communicate progress and blockers, often alongside
    proposed solutions or alternatives.
  - Ownership: You take full ownership of your deliverables --
    from design througη production. You handle setbacks
    constructively, learning from them and adapting your
    approach.
  - Impact: You consider both short- and long-term effects of
    technical decisions. You align your work with team and
    business goals, and actively seek opportunities to improve
    processes, reduce waste, and simplify systems.
  - Collaboration: You mentor peers through code reviews,
    pairing, and knowledge sharing. You build effective
    working relationships across distributed teams and adapt
    your communication style to different audiences --
    technical and non-technical alike.

  ·       Growth mindset: You continuously sharpen your own
  skills and actively help others develop theirs. You stay
  curious about emerging technologies and practices, and bring
  that learning back to the team.

  LIFE AT TICKETMASTER

  We are proud to be a part of Live Nation Entertainment, the
  world’s largest live entertainment company.

  Our vision at Ticketmaster is to connect people around the
  world to the live events they love. As the world’s largest
  ticket marketplace and the leading global provider of
  enterprise tools and services for the live entertainment
  business, we are uniquely positioned to successfully deliver
  on that vision.

  We do it all with an intense passion for Live and an
  inspiring and diverse culture driven by accessible leaders,
  attentive managers, and enthusiastic teams. If you’re
  passionate about live entertainment like we are, and you
  want to work at a company dedicated to helping millions of
  fans experience it, we want to hear from you.

  Our work is guided by our values:

  Reliability - We understand that fans and clients rely on us
  to power their live event experiences, and we rely on each
  other to make it happen.

  Teamwork - We believe individual achievement pales in
  comparison to the level of success that can be achieved by a
  team

  Integrity - We are committed to the highest moral and
  ethical standards on behalf of the countless partners and
  stakeholders we represent

  Belonging - We are committed to building a culture in which
  all people can be their authentic selves, have an equal
  voice and opportunities to thrive

  EQUAL OPPORTUNITIES

  We are passionate and committed to our people and go beyond
  the rhetoric of diversity and inclusion. You will be working
  in an inclusive environment and be encouraged to bring your
  whole self to work. We will do all that we can to help you
  successfully balance your work and homelife. As a growing
  business we will encourage you to develop your professional
  and personal aspirations, enjoy new experiences, and learn
  from the talented people you will be working with. It's
  talent that matters to us and we encourage applications from
  people irrespective of their gender, race, sexual
  orientation, religion, age, disability status or caring
  responsibilities.



  HIRING PRACTICES

  The preceding job description has been designed to indicate
  the general nature and level of work performed by employees
  within this classification. It is not designed to contain or
  be interpreted as a comprehensive inventory of all duties,
  responsibilities, and qualifications required of employees
  assigned to this job.

  Ticketmaster recruitment policies are designed to place the
  most highly qualified persons available in a timely and
  efficient manner. Ticketmaster may pursue all avenues
  available, including promotion from within, employee
  referrals, outside advertising, employment agencies,
  internet recruiting, job fairs, college recruiting and
  search firms. Ticketmaster may use artificial intelligence
  (AI) tools to support application screening and assessment.
  All hiring decisions are made with human review.

  #LI-JCK #LI-Remote

  Live Nation Entertainment will never request payment or
  equipment purchases as part of the hiring process.
  Recruiters will only contact candidates from official Live
  Nation or affiliated brand email domains.
