description: |
  Hi, we're Brigit! A holistic financial health company
  helping everyday Americans build a brighter financial
  future. With a business model that is aligned with our
  customers, we create transparent, fair, and simple financial
  products that put money back in the hands of our members,
  help them spend wisely, avoid unfair fees and build their
  credit quickly. If autonomy, ownership, and having
  meaningful input at the company you work for is important to
  you, come join our growing team!

  Brigit is doing innovative and exciting work, but don’t just
  take our word for it, our work is being recognized by
  others:

  - Built In's 2026 Best Midsize Companies to Work For in New
    York City
  - Built In's 2025 Best Places to Work For In New York City
  - Built In’s 2024 & 2025 Best Startups to Work For In the U.S.
  - Built In’s 2023 - 2025 Best Startups to Work For In New York
    City
  - Fast Company’s Most Innovative Companies of 2022
  - Business Insider’s Most Promising Consumer Startups 2022
  - Forbes Fintech 50 2022

  Role Overview:

  Brigit is looking for fullstack engineers to help us scale
  our next-generation consumer finance platform to millions of
  users in the next year. We’ve found tremendous traction
  helping low income Americans make ends meet; now is the time
  to scale. We’ve built a mobile/web app on React and React
  Native with Typescript, and a backend of Java services in
  Google Cloud. It’s served us well so far, but we need help
  making it even better.

  Our team has two main goals:

  - Feature development supporting numerous external and
    internal applications. The next generation of our product
    may look nothing like it does today - and we welcome that!
    The degree to which we implement new user flows, compute
    our proprietary algorithms, integrate with 3rd party APIs,
    store data, and serve traffic will make or break our
    success.
  - Scalability of our customer-facing applications. Growing
    from 100k to 10 million users presents unique technical
    challenges. The efficiency and reliability of both our
    customer-facing and internal tools needs to improve. We
    have fun Data Engineering tasks, automation procedures,
    and availability/monitoring problems to tackle. We also
    have many user-facing projects, including the creation and
    upkeep of components and libraries, GraphQL API design,
    testing and QA processes, and CI/CD enhancements.

  Our team is small and nimble; you'll be given an
  extraordinary amount of autonomy and ownership. More
  importantly, you have a large say in the direction of the
  company -- both in terms of our technology and our product.

  Recent accomplishments of our team are:

  - Building a Payments API platform that moves millions of
    dollars on a daily basis
  - Implementing the advanced mathematical processes behind our
    proprietary risk algorithm
  - Normalizing relational database schema to optimize for
    performance for over 1 million users
  - Allowing users to connect their Payroll as an income source
  - End to end User notification (via SMS, Email, Push)
    capabilities
  - Building internal tools that enable our Customer Support
    Specialists to help our customers ASAP

  One of our greatest strengths is the speed at which we move.
  If you want to propose a new way of doing things, we are all
  ears. If you have an idea for a new feature, we'll be open
  to it. A new design paradigm? Bring it on.

  At Brigit you can enjoy a mature CI/CD platform with
  automated deployment processes, an easy-to-use
  local/staging/production development environment, and
  teammates willing to fill in the gaps. We automate manual
  things so we can focus on thinking and building something
  that helps people.

  As a fullstack engineer we’re looking for someone with
  experience owning a feature from start to finish on both the
  frontend and backend. We don’t expect everyone to know
  everything in our stack, but having one side of overlap
  (frontend/backend) that you feel very comfortable with will
  set you up for success here.

  We are ideally looking for NYC-based folks who can join us
  in the office 2–3 days a week. However, we're open to remote
  candidates! If you are applying remotely, please note that
  we are only considering candidates located in the EST or CT
  time zones who can work East Coast hours.

  What You'll Be Doing:

  - A/B testing and optimizing features that help our users and
    our business
  - Optimizing queries and relational database schema to ensure
    speedy response times
  - Implementing algorithms related to monetary transaction
    evaluation, risk management, income verification, and
    other predictive models
  - Integrating with new 3rd party APIs to serve millions of
    customers
  - Decreasing our customer service workload by building
    improvements to the product or improving our internal
    automations
  - Implementing interaction and motion design for more
    delightful user experiences
  - Automating visual testing & visual regression detection
    processes
  - Creating new mobile & web clients for upcoming products
  - A/B testing and optimizing features that help our users and
    our business

  What you have:

  - 4+ years of industry experience as a software engineer
  - Experience using AI tooling efficiently, familiar with best
    practices
  - Experience building REST based services and API development,
    ideally in Java
  - Experience building UI/UX for new features from end-to-end
    using React or React Native
  - GraphQL experience a plus
  - Up-to-date grasp of the constantly evolving JS language
    standards, ES6 and beyond (we use Typescript)
  - Experience with SQL databases, constructing schemas,
    performing migrations and writing analytical queries
  - Kubernetes, Docker or other container system experience is a
    plus
  - Quantitative skills, knowledge or experience in Finance is a
    plus

  The Interview Process

  - Get to Know You - 30 mins - Intro call - Come prepared to
    answer a few questions relevant to your experience,
    interests, and the role at Brigit. This helps us get to
    know you better and go beyond your resume or other
    application materials.
  - Technical Interview, Java, Testing and Debugging - 60 mins -
    Pair program with an engineer using HackerRank. This
    interview will be in Java and is an exercise meant to show
    off your fundamental coding skills. In this session,
    you’ll work with an engineer to test, debug, and fix a
    faulty data structure implementation.
  - Team Behavioral + Take Home Project
    - Team Behavioral - 60 mins - Meet with one of our Engineering
      Managers to discuss your approach to collaboration,
      communication, and alignment with our team values and
      culture.
    - Take Home Project, React - (2-4 hours total, on your own
      time) - You will be asked to re-create a simple game of
      Black Jack. This is an opportunity to showcase your
      process and approach for creating a working realish-
      world feature/product in a React environment.
  - Final Panel Interview
    - Technical Interview, System Design - 60 mins - Meet with an
      engineer and work through API-related business problems.
    - Take Home Follow-Up - 60 mins - In this interview, the team
      will walk through your initial Blackjack assessment with
      you. They’ll review the overall structure, discuss any
      bugs or issues they’ve identified, and work with you to
      add additional functionality or enhancements to the
      project.
    - Technical Interview, Service Architecture - 60 mins - Meet
      with one last engineer for a conversational interview
      around your architecture-related experience.

  The anticipated annual base salary for this position is
  $155,000 - $170,000. This range does not include any other
  compensation components or other benefits for which an
  individual may be eligible. The actual base salary offered
  depends on a variety of factors, which may include as
  applicable, the qualifications of the individual applicant
  for the position, years of relevant experience, specific and
  unique skills, level of education attained, certifications
  or other professional licenses held, and the location in
  which the applicant lives and/or from which they will be
  performing the job.

  Our Benefits & Team

  - Medical, dental, and vision insurance
  - Flexible PTO Policy
  - 401k plan
  - Paid Parental Leave
  - Physical and mental wellbeing benefits including Wellhub for
    access to virtual workouts and discounted gym memberships,
    and Headspace for covered virtual therapy sessions and
    unlimited on demand health support
  - Monthly reimbursements to use against wifi and cell phone
    bills
  - Annual reimbursement for Learning & Development
  - Help hard working Americans build a brighter financial
    future
  - High-growth company at an early stage
  - A dynamic, flexible and collaborative start-up work
    environment with a highly talented team

