description: |
  Senior Software Engineer

  Location: New York

  Type: Full-time, Hybrid

  Job Summary

  Join the eClerx US AI Organization to build and deploy AI-
  enabled software for clients in financial services and other
  industries. You will design agentic workflows, turn
  successful demonstrations and MVPs into production-ready
  software, and build what large organizations need to see
  before rollout: secure identity and access, protected
  credentials, dependable integrations, observable operations,
  and a clear deployment path. You will own the engineering
  work from build through handoff to an industry specific
  product team.

  Once you are integrated into the team, there will be client-
  facing work and opportunities depending on your team
  placement, including discovery sessions, technical
  presentations, and solution design with client stakeholders

  Responsibilities

  - Design, build, and evaluate agentic workflows and
    integrations, and move strong demonstrations toward
    production.
  - Assess demos and MVPs against client deployment
    requirements, then lead the full-stack work to close the
    gaps, including features, APIs, user workflows, and
    integrations with enterprise data environments.
  - Design production architecture for resilience, covering
    retries, idempotency, queues, failure isolation, and
    scaling, and run performance and load testing with cost in
    mind.
  - Build in identity and security from the start: SSO with the
    client's identity provider (SAML or OIDC), OAuth2, role-
    or attribute-based access control, secrets management,
    privacy, auditability, and data handling.
  - Own infrastructure as code and CI/CD, including environment
    promotion, containers, and repeatable deployments.
  - Build observability: structured logging, metrics, tracing,
    alerting, and runbooks.
  - Coordinate with domain specialists, solution builders, and
    the product team, documenting decisions for an operational
    handoff.
  - Guide junior engineers to choose optimal solutions while
    following industry guidelines.
  - Stay current with developments in AI and in the industries
    you serve.

  Eligibility Requirements

  - Bachelor's or master's degree in computer science or
    software engineering.
  - 5–8 years of full-stack engineering experience and evidence
    of products reaching real customers.
  - Proficiency in Python (or a comparable language) and at
    least one modern backend stack.
  - Hands-on experience building agentic workflows, including
    tool use, orchestration, multi-step reasoning, and human-
    in-the-loop review.
  - Practical AI application experience, including evaluation
    and an understanding of failure modes.
  - Depth in AWS, the ability to work in GCP and Azure, and
    experience with Databricks, Snowflake, or a comparable
    data platform.
  - Experience taking early software to production, including
    identity, credentials, security, deployment, and
    reliability.
  - Experience guiding junior engineers through design decisions
    and code review.
  - Judgment about security and compliance controls in regulated
    and enterprise environments; high agency, proactive
    problem solving, and clear cross-team communication.

  Preferred Qualifications

  - Familiarity with Docker and DevOps practices, including
    CI/CD pipelines, environments, and release processes.
  - Familiarity with fine-tuning models and with up-to-date AI
    models and their capabilities.
  - Experience supporting a client security audit or penetration
    test.
  - Client-facing experience, including technical discovery or
    presentation.
  - Exposure to financial services, including financial crime
    and compliance (FCC), know your customer (KYC), or anti-
    money laundering (AML); or to communications, media,
    telecommunications, finance and accounting industries.
  - Startup or early-stage product experience.
  - Publications in top journals, teaching or mentoring
    experience, or open source contributions.

  In the US, the target base salary for this role is
  $150,000-$200,000. Compensation is based on a range of
  factors that include relevant experience, knowledge, skills,
  other job-related qualifications, and geography. We expect
  the majority of candidates who are offered roles at our
  company to fall throughout the range based on these factors

  About eClerx

  eClerx is a leading provider of productized services,
  bringing together people, technology and domain expertise to
  amplify business results. The firm provides business process
  management, automation, and analytics services to a number
  of Fortune 2000 enterprises, including some of the world’s
  leading financial services, communications, retail, fashion,
  media & entertainment, manufacturing, travel & leisure, and
  technology companies. Incorporated in 2000, eClerx is traded
  on both the Bombay and National Stock Exchanges of India.
  The firm employs more than 19,000 people across Australia,
  Canada, France, Germany, Switzerland, Egypt. India, Italy,
  Netherlands, Peru, Philippines, Singapore, Thailand, the UK,
  and the USA.

