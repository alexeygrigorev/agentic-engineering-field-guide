description: |
  About Us

  Sydecar is on a mission to transform the world of private
  markets. Our goal is to make these markets more accessible,
  transparent, and liquid, and we're achieving this by
  revolutionizing the way investment vehicles are created and
  executed.

  At Sydecar, we're not just a platform; we're a trusted
  partner in venture capital. We're dedicated to simplifying
  and standardizing the private investing experience,
  empowering capital allocators to discover and support
  visionary entrepreneurs who are shaping the future.

  Our platform is designed with ease and efficiency in mind.
  We take care of all the behind-the-scenes tasks, from
  automating banking, ensuring compliance, handling contracts,
  managing taxes, to streamlining reporting. This leaves
  investors the freedom to concentrate on what matters most:
  making valuable deals and nurturing meaningful
  relationships.

  Join us at Sydecar, as we lead the charge in revolutionizing
  private investing.

  About our Engineering Teams

  We’re hiring across multiple teams and are excited to match
  engineers with roles that align with their interests and
  strengths. Whether you’re full stack, front end–focused, or
  more backend–oriented, we have opportunities that fit your
  skill set and where you want to grow.

  Our software development is AI-centric and requires
  demonstrated experience leveraging agentic software
  development workflows This is a hybrid role based in San
  Francisco or New York City with in-office attendance of
  three days per week.

  Our Tech Stack

  - Frontend: TypeScript and React in a mono-repo structure
  - Backend: TypeScript, using NestJS and Prisma
  - Database: PostgreSQL
  - Testing & Code Quality: Jest and linted/auto-formatted with
    ESLint/Prettier
  - Design: Wireframes and prototypes crafted in Figma
  - Infrastructure: Maintained as Infrastructure as Code (IaC)
    using Terraform

  What You Will Do

  As a Staff Software Engineer, you are the archetype for the
  engineering organization. You are comfortable leading large
  project teams or working on complex projects few others in
  the organization can take on. You leverage business and
  organizational awareness to outline quarter-long technology
  strategies and drive implementation across the organization,
  elevating the quality, functionality, and potential of
  Sydecar's core product. You are a Product engineer first,
  helping our core applications team improve the experience
  for deal organizers and investors, who combine to close
  hundreds of millions of dollars in venture funding annually.

  - Lead large/complex projects.
  - Outline technology strategies with a 1-2 quarter time
    horizon.
  - Cultivate the growth of talented full stack engineers
    through mentorship.
  - Help shape the product and design roadmaps.
  - Drive end-to-end the architectural decisions, scalability
    planning, and long-term strategic vision for these key
    components.
  - Collaborate across functions with Product and Design, Legal,
    Compliance, and Customer Experience and other engineering
    leaders to deliver cohesive, platform-wide solutions.

  What We’re Looking For

  - 8+ years of professional experience as a software engineer,
    with a proven track record of technical leadership and
    driving org-wide impact.
  - Expertise in building large-scale, high-reliability,
    distributed backend systems, ideally in the fintech or
    payments space.
  - Strong proficiency in JavaScript/TypeScript is highly
    preferred.
  - Experience managing the complete project lifecycle,
    transforming intricate ideas and ambiguous requirements
    into successful launches independently.
  - Deep expertise in system architecture, data modeling, and
    building core services with clean interfaces.
  - Product sense and a passion for advocating for the customer,
    with experience building robust systems that directly
    impact business-critical flows.
  - Outstanding capacity to convey intricate technical concepts
    clearly and precisely, both in writing and verbally, to
    diverse functional teams.
  - Ability to work independently and take ownership of
    projects, while also thriving in a team environment, often
    guiding the work of several other engineers across
    multiple projects.
  - Ability to implement and influence engineering best
    practices.

  Sydecar’s values

  Our values are important to the way we live and work at
  Sydecar. They guide our priorities, behaviors and
  interactions.

  Be Committed

  As a team, we rise to meet challenges and recognize that we
  become stronger and develop character when facing adversity.

  Be Excellent

  We measure our success not just by what we achieve, but by
  how we achieve it—through integrity, creativity, elegance,
  and a commitment to continuous improvement. Excellence is
  not just doing things well—it's looking for ways to do them
  better.

  Be Humble

  Humility is our key to personal and professional growth. We
  appreciate that great ideas can come from anywhere,
  regardless of seniority, pedigree, or experience. We care
  more about collective outcomes than who gets credit or who
  does what. We try to not let our ego cloud our judgment.

  Win Together

  Winning is no accident. It is the result of collective hard
  work, perseverance, sacrifice, and most of all, loving what
  we do. Winning requires that we give extra—sometimes winning
  calls for late nights or extra effort, and we show up for
  clients and each other with urgency and heart. While
  excellence is a journey, winning is a destination.

  Sydecar is committed to the principle of equal employment
