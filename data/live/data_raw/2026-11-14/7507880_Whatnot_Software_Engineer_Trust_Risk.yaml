description: |
  🚀 Join the Future of Commerce with Whatnot!

  Whatnot is the largest livestream shopping platform in North
  America and Europe to buy, sell, and discover the things you
  love. Whether it's trading cards, fashion, electronics, or
  live plants, our sellers are building real businesses across
  hundreds of categories. We're building live commerce at a
  scale that's never been done in the West, and there's no
  playbook to copy. The people here are shaping how an
  entirely new industry develops.

  As a remote co-located team, we're inspired by our values
  and anchored in hubs across the US, UK, Ireland, Poland,
  Germany, and Australia. We move fast, stay close to our
  users, and focus on the work that drives the most impact.

  We're one of the fastest growing marketplaces and were
  recently named the #1 Best Startup Employer in America by
  Forbes. Check out the latest Whatnot updates on our news and
  engineering blogs and join us as we enable anyone to turn
  their passion into a business and bring people together
  through commerce.

  💻 Role

  The Trust and Risk, Fraud, and Integrity teams at Whatnot
  are responsible for building systems that help set clear
  expectations, encourage good behavior, and address issues
  fairly and efficiently. By combining proactive detection
  with transparent enforcement, we ensure Whatnot remains a
  safe and trustworthy place for both buyers and sellers..

  We focus on:

  - Policy enforcement and dispute resolution: Designing systems
    that set clear behavioral expectations, detect and address
    policy violations, and resolve disputes efficiently.
  - Reusable, high-performance platforms: Building and
    maintaining scalable infrastructure that powers internal
    operations, automated and manual actioning systems, and
    advanced detection capabilities.
  - Intelligent detection and prevention: Leveraging machine
    learning, behavioral analysis, and real-time interventions
    to stay ahead of evolving abuse patterns and protect both
    buyers and sellers.
  - Continuous improvement: Using feedback loops and monitoring
    systems as managed assets for ongoing quality assurance
    and for strengthening algorithms, methodologies, and
    operational processes.

  Together, these teams ensure Whatnot remains a trusted,
  safe, and thriving marketplace for all users.

  What you'll do:

  - Design and develop systems to protect the platform: Build
    and iterate on production algorithms and infrastructures
    that mitigate systemic risks and safeguard buyers,
    sellers, and the broader Whatnot community.
  - Balance risk and user experience: Proactively monitor the
    impact of protective systems on trusted users, ensuring
    interventions deliver more value than friction.
  - Respond in real time to threats: Architect event-driven
    pipelines and detection frameworks that enable near real-
    time responses to high-risk user behavior.
  - Contribute across the full development lifecycle: Engage in
    ideation, scoping, prototyping, load testing, deployment,
    and monitoring to deliver resilient and scalable
    solutions.
  - Drive cross-team initiatives: Collaborate across multiple
    product surfaces and operational teams, surfacing insights
    to leadership and stakeholders through dashboards,
    notebooks, and clear written documentation.
  - Continuously evolve defenses: Stay ahead of emerging abuse
    patterns, abuse vectors, and account integrity risks by
    iterating quickly and rigorously testing solutions.

  We offer flexibility to work from home or from one of our
  global office hubs, and we value in-person time for
  planning, problem-solving, and connection. Team members in
  this role must live within commuting distance of our
  Seattle, New York City, San Francisco, or Los Angeles hub.

  👋 You

  People who do well at Whatnot tend to be comfortable
  figuring things out as they go, biased toward action, and
  genuinely curious about what they're building. They care
  more about outcomes than credit and stay close to the
  product and the people using it.

  As our next Software Engineer you should have 7+ years of
  total software engineering experience, plus:

  - Bachelor’s degree in Computer Science, Statistics, Applied
    Mathematics, Economics, a related technical field, or
    equivalent work experience.
  - 4+ years of software engineering experience building for
    consumer-scale loads.
  - 1+ years of experience writing production code in Python.
  - 1+ years of experience in Trust and Risk or Integrity or
    Fraud domains preferred.
  - Business intuition & a data-driven mindset that enables you
    to think critically about the growth headwinds abuse
    prevention systems can create. Explicit data science or
    machine-learning experience is a huge plus.
  - Obsession with impact. You are focused on driving value for
    users & have a track record of deploying simple solutions
    wherever feasible. You move as fast as possible without
    sacrificing quality.
  - Relentnessness & entrepreneurship. You prioritize your work
    ruthlessly & run through walls to get things done. Your
    curiosity drives you to dig into user problems & craft
    suggestions on how we can address them.
  - Ability to work autonomously and lead initiatives across
    multiple product areas and communicate findings with
    leadership and product teams.
  - Comfortability with data warehouses and transformation tools
    such as Snowflake, dbt, Dagster.
  - Professionalism around collaborating in a remote working
    environment and well tested reproducible work.
  - Above average documentation and communication skills.

