title: Senior Software Engineer
company: Goodie AI
location: New York, USA
work_type: FULL_TIME
company_size: 20 Employees
description: |
  About Goodie AI:

  Goodie helps leading brands win AI search. As billions of
  people use ChatGPT, Perplexity, Gemini, and other AI systems
  to discover products and make buying decisions, brands need
  a way to understand and influence how they’re represented.

  Goodie gives teams a full AI control plane: real-time
  visibility into how AI models speak about their brand and
  products, how competitors show up, and an optimization
  engine to improve visibility and performance. This category
  didn’t exist two years ago - we were early, and we’re
  defining it.

  We’re backed by strong investors, trusted by category-
  leading customers, and scaling fast. We’re hiring curious,
  ambitious builders to help shape the future of AI search.

  What we are looking for:

  We're seeking an exceptional Senior Software Engineer to
  join our rapidly growing AI Lab. You will play a critical
  role in driving and accelerating the development of cutting-
  edge AI use cases, working closely with our Product Lead,
  Designers and Machine Learning Engineers to design and build
  scalable, industry-leading AI solutions.

  What you'll do:

  - Lead the development of our AI platform, focusing on
    scalability, speed, and user experience.
  - Architect and develop front-end solutions using React to
    create smooth, engaging, and intentional user experiences.
  - Implement back-end infrastructure with a focus on speed,
    scalability, security, and seamless integration with
    various platforms via robust API connections.
  - Utilize DevOps practices to manage the deployment pipeline,
    ensuring efficient, reliable, and secure software
    delivery.
  - Collaborate with UX/UI Designers to translate web designs
    into functional, intuitive user interfaces.
  - Work closely with Data Scientists to ensure accurate data
    collection, analysis, and application within the platform.
  - Participate in the entire application lifecycle, from coding
    to debugging and testing, with an emphasis on quality and
    performance.
  - Maintain and optimize the performance of existing
    applications.
  - Stay up-to-date with emerging technologies and explore
    potential integrations to enhance our operations.

  What you have:

  - 5+ years of full-stack development experience with a proven
    track record of building high usage B2B software
    applications.
  - Proficiency in React for front-end development, with a
    strong understanding of how to build responsive, high-
    performance web applications.
  - Experience with server-side languages such as Python,
    Node.js, or Java.
  - Strong understanding of DevOps practices and experience in
    software deployment, including CI/CD pipelines,
    containerization (e.g., Docker), and cloud infrastructure
    (AWS, Google Cloud, or Azure).
  - Solid knowledge of database management systems (e.g., MySQL,
    PostgreSQL, MongoDB).
  - Experience with RESTful APIs, API integration, and data
    exchange formats (JSON, XML).
  - Familiarity with software development best practices,
    including version control (Git), testing, and continuous
    integration/deployment (CI/CD).
  - Excellent problem-solving skills and the ability to debug
    complex systems.
  - Strong leadership and communication skills, with the ability
    to collaborate effectively with cross-functional teams.
  - Passion for ad tech and a desire to work in a fast-paced,
    innovative startup environment.
  - BS in Computer Science, Engineering, or a relevant field.

  Benefits & Perks Of Becoming a Goodie:

  - Earn More, Together: Base Pay + Equity
  - Health First: Premium Medical, Dental & Vision Coverage
  - Flex Work Environment: Hybrid at HQ and Remote Globally
  - Set Up Shop: Home Office Stipend
  - Recharge Anytime: Unlimited PTO Plan
  - Family First: Paid Parental Leave Plan
  - Secure Your Future: 401(k) Plan with Employer Matching
  - Level Up: Mentorship & Career Growth Support
  - Always Be Learning: Access to Top-tier Resources & Industry
    Experts
  - Work Hard, Play Harder: Quarterly Team Trips (Onsite and
    Offsite)
  - Mind & Body Wellness: Gym, Wellness, and Access to Mental
    Health Plans
  - Fuel Your Day: Free Lunch, Snacks, Cold Brew, & Happy Hours
  - Grow With Us: Endless Opportunities to Lead & Succeed
  - Keep on Shining: Ongoing Employee Development Programs

  EEO & Compensation Transparency:

  Goodie AI is committed to pay transparency and equity among
  all employees and provides employees an environment where
  pay transparency and dialogue on compensation are allowed.
  Goodie AI complies with federal, state, and local laws on
  compensation, pay transparency, and pay equity. We take
  factors including geographic location, education, training,
  skillset, market rates, certifications, and more into
  consideration when constructing pay ranges for new and
  existing roles within our organization. The compensation
  range for this position is $130,000 - $180,000.

  At Goodie AI, we understand that diversity in the workplace
  is vital to a company’s success and growth. We strive to
  make sure that our team members are included and have a
  sense of belonging that makes us a great company to work
  with and a great company to work for. To that end, Goodie AI
  is committed to Equal Opportunity Employment and comply with
  all Equal Opportunity Employment laws. We will consider all
  qualified applicants without regard to race, religion,
  color, national origin, sex, gender identity, gender
  expression, sexual orientation, age, marital status, veteran
  status, or disability status. We will work to make
  reasonable accommodations available in the job application
  and interview process, to perform essential duties of the
  job function, and to retrieve other benefits and privileges
  of employment with our organization.

  BEWARE OF FRAUD! Please be aware of potentially fraudulent
  job postings or suspicious activity by persons that are
  posing as Goodie team members, recruiters, and HR employees.
  Our team will contact you regarding job opportunities from
  email addresses ending in @nogood.io or @higoodie.com.
  Additionally, we do utilize our ATS- Ashby- to help us
  schedule initial screening calls. Job seeking is hard- we’re
  sorry that scammers have added this element to your search
  for something new. Stay vigilant out there!
