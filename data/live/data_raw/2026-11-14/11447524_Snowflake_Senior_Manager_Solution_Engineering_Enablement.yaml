description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  There is only one Data Cloud. Snowflake's founders started
  from scratch and designed a data platform built for the
  cloud that is effective, affordable, and accessible to all
  data users. But it did not stop there. They engineered
  Snowflake to power the Data Cloud, where thousands of
  organizations unlock the value of their data with near
  unlimited scale, concurrency, and performance. This is our
  vision: a world with endless insights to tackle the
  challenges and opportunities of today and reveal the
  possibilities of tomorrow.

  Snowflake, the company that delivers the Data Cloud to
  Mobilize the World's Data, is actively seeking a Manager,
  Sales Engineering Enablement Business Partners. In this
  leadership role, you will lead, coach, and grow a team of
  three Sales Engineering Enablement Business Partners who
  serve as the voice of enablement across regional and
  specialized technical segments worldwide. You will be
  accountable for ensuring this team equips our global Sales
  Engineering organization with the technical mastery, domain
  knowledge, and enablement programs needed to secure the
  technical win. You will partner directly with senior Sales
  Engineering leadership and cross functional teams across
  Product, Marketing, and Sales Operations to shape our global
  enablement strategy and drive measurable field impact.

  In this role, you will:

  - Lead, mentor, and inspire a team of Sales Engineering
    Enablement Business Partners, each embedded within a
    regional or specialized segment, ensuring they are
    positioned as trusted extensions of their respective SE
    leadership teams.
  - Partner with senior Sales Engineering executives and cross
    functional leadership to define the overarching technical
    enablement charter, strategic priorities, and regional
    delivery models.
  - Establish clear operating mechanisms for intake,
    prioritization, and resource allocation so your Business
    Partners can effectively manage competing regional and
    global enablement demands.
  - Drive operational excellence across the team in designing,
    localizing, and delivering segment specific enablement
    assets, technical curriculums, hands on workshops, Sales
    Kickoff sessions, and continuous learning programs.
  - Ensure your team coordinates and delivers seamless ongoing
    enablement activities, and field communication campaigns
    in alignment with the global enablement plan.
  - Champion rigorous metrics and business impact measurement,
    tracking enablement effectiveness and field readiness
    across all segments your team supports.
  - Foster tight alignment between Enablement, Product
    Management, Product Marketing, and Solutions Architecture
    to ensure the technical field stays ahead of product
    releases and industry trends.
  - Guide your team in standardizing best practices, scalable
    frameworks, and asset sharing across theaters to maximize
    velocity and consistency while honoring regional nuances
    and localization needs.
  - Act as an executive sponsor and escalation point for
    critical enablement initiatives, regional escalations, and
    executive stakeholder alignment.
  - Cultivate an inclusive, collaborative, and high trust
    culture centered on continuous growth, domain mastery, and
    empathy for the technical field.

  Required Skills:

  - 8+ years of relevant experience in sales engineering,
    technical enablement, solutions architecture, or technical
    consulting within high growth enterprise SaaS companies,
    with a deep understanding of the data analytics ecosystem.
  - 3+ years of direct people management experience leading
    technical enablement specialists, sales engineers, or
    technical business partners.
  - Deep understanding of the data cloud, modern analytics
    ecosystems, enterprise architectures, and complex
    technical sales cycles, processes, and methodologies.
  - Proven track record of designing, executing, and scaling
    enablement programs that demonstrably accelerate technical
    ramp and win rates.
  - Exceptional executive presence and relationship building
    skills, with demonstrated success influencing senior
    sales, engineering, and product leadership.
  - Strong strategic thinking, operational discipline, and
    analytical problem solving skills to manage global
    resource allocation and measure business impact.
  - Ability to thrive, provide clarity, and drive execution in a
    fast paced, dynamic environment.
  - Bachelor degree in Computer Science, Engineering, Business,
    or equivalent practical experience.
  - Ability to travel periodically as required.

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
