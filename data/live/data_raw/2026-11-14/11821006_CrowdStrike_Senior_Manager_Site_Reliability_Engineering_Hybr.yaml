description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  At CrowdStrike, Site Reliability Engineering (SRE) is
  fundamental to the reliability and scalability of our cloud-
  native security platform. Recently we introduced adaptive
  concurrency to our core kafka library which implements flow
  control to protect database performance and are presently
  making large-scale automations around how we build new
  clouds. The overarching aim has been to build out the next-
  generation infrastructure and security platform for
  CrowdStrike, which includes an application and service
  delivery platform, massively scalable distributed data
  storage and replication systems, and a cutting-edge search
  and distributed graph system.  We're now launching a new
  offshoot from our Core SRE group that will embed into
  specific product arms and further help us scale
  CrowdStrike’s infrastructure and products to handle massive
  growth in traffic and data as we continue to experience
  dramatic growth in the usage of our products. Crowdstrike
  Falcon is THE industry standard in cloud-native cyber
  security and threat hunting, processing Trillions of
  events/day.

  As a Senior SRE Manager, you'll build and lead high-
  performing engineering teams beginning with this new
  addition to SRE, while fostering a culture of collaboration,
  innovation, and continuous improvement. You'll work across
  organizational boundaries to drive platform resiliency and
  partner with peer leaders and executives to align strategic
  initiatives and technical directions.

  What You'll Do:

  Key Leadership Responsibilities:

  - Build and develop cohesive, high-performing teams through
    mentorship, coaching, and career development
  - Drive cross-functional collaboration between SRE,
    Development, Security, and Operations teams to enhance
    system resilience
  - Partner with executive leadership to define and execute
    strategic reliability initiatives
  - Establish and maintain strong relationships with peer
    leaders to ensure alignment on technical direction and
    operational priorities
  - Lead organizational change management efforts to improve
    processes and drive engineering excellence

  Technical Responsibilities:

  - Guide architectural decisions that impact system reliability
    and scalability
  - Drive adoption of SRE best practices across multiple teams
  - Oversee implementation of reliability metrics and SLOs
    Champion automation and infrastructure-as-code initiatives

  What You'll Need:

  - Proven track record of building, developing, and retaining
    high-performing engineering teams
  - 10+ years of software engineering experience with 5+ years
    in leadership roles
  - Demonstrated success in working across organizational
    boundaries to drive complex technical initiatives
  - Solid design and problem solving skills with demonstrated
    passion for engineering excellence, quality, security and
    performance
  - Strong executive presence and communication skills for
    effective partnership with senior leadership
  - Experience leading distributed teams in a remote-first
    environment
  - Proficiency in cloud environments (e.g. AWS, Azure, GCP,
    OCI)
  - Deep understanding of distributed systems and reliability
    engineering principles
  - Bachelor's degree in Computer Science or related field, or
    equivalent experience.

  Bonus Points:

  Leadership Competencies:

  - Strategic thinking and ability to translate business
    objectives into technical roadmaps
  - Excellence in stakeholder management and executive
    communication
  - Track record of successful cross-functional collaboration
  - Strong change management and organizational development
    skills
  - Ability to build consensus and drive decisions across
    multiple teams

