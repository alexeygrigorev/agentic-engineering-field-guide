description: |
  ABOUT THE TEAM

  The Mural Compose team is ambitious and fast-moving. We are
  passionate builders who love to experiment and iterate. Our
  project is seeking to leverage the latest technology in AI
  to acquire new customers and expand our revenue base as
  broadly as possible. This team is at the front of our
  product strategy and future growth.



  YOUR MISSION

  You'll lead the team behind one of Mural's most important
  bets. In the near term, you'll take our AI native product
  from early access to a product that customers rely on every
  day, raising quality, reliability, and speed as more users
  come on board.

  Expect a very hands-on role. You'll review PRs, set the
  technical standards the team builds to, and stay close to
  the code and architecture decisions. You'll also keep the
  team's pace high and sustainable while building a high-
  performing team in a remote-first way.



  WHAT YOU'LL DO

  - Lead, hire, and grow a team of full-stack engineers through
    regular 1:1s, clear expectations, coaching, and
    performance management.
  - Own delivery end to end with a fast, experimental loop: ship
    early to real users, measure what works, and iterate
    quickly without losing reliability.
  - Partner with Product and Design as co-owners of the Compose
    roadmap, using customer feedback and usage data to decide
    what to build, cut, or double down on.
  - Raise engineering craft across testing, observability, and
    AI-assisted development, and model Mural's remote-first,
    work-in-public culture at a sustainable pace.

  WHAT YOU'LL BRING

  - 2+ years managing software engineers directly, with
    responsibility for hiring, coaching, and performance
    management.
  - 5+ years of prior experience as a software engineer building
    and operating production applications, with hands-on
    technical work in the last 3–4 years.
  - A solid technical foundation, enough to lead architecture
    discussions and review code with credibility.
  - A bias for experimentation: you make sound calls quickly,
    learn from data, and change course when the evidence says
    so.
  - A people-first approach: you lead with empathy, listen
    first, and build the trust and psychological safety that
    help each person do their best work.
  - Excellent communication skills, including explaining
    technical tradeoffs clearly to product, business, and
    customer stakeholders.

  - Experience leading a team that shipped LLM-powered features
    to production, including evaluation, quality monitoring,
    and cost management.
  - Experience building AI agents, retrieval systems, knowledge
    graphs, or familiarity with Model Context Protocol (MCP).

  Our Stack

  Azure OpenAI, React, Node, MongoDB

  Equal Opportunity

  We will ensure that individuals with disabilities are
  provided reasonable accommodation to participate in the job
  application or interview process, to perform essential job
  functions, and to receive other benefits and privileges of
  employment. Please contact us to request accommodation.
