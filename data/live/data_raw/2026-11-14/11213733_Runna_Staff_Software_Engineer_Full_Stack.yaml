description: |
  We're putting together a talented team to build the #1
  training platform for Runners

  We help everyday runners become outstanding by building an
  incredible app providing world-class training, coaching and
  community for everyone, whether you're improving your 5k
  time or training for your first marathon.

  We’re growing extremely fast! In November 2023 we closed a
  $6.5M funding round led by JamJar with participation from
  Eka Ventures, Venrex and Creator Ventures. In 2024, we were
  selected by Apple as one of three global finalists for the
  iPhone app of the year, reflecting the innovation and impact
  of what we’ve built & in 2025 we were acquired by Strava!

  Our ambition is huge: to become the go-to global leading
  training platform for millions of runners everywhere. We’re
  growing with purpose and looking for people who want to
  build something meaningful with lasting impact. With the
  recent acquisition by Strava accelerating our journey, now
  is a really magical time to join. 🚀

  The team you’ll join

  We’re looking for a Staff Software Engineer (Full Stack) to
  play a pivotal role in driving the technical success of
  Runna. This is a hands-on role where you’ll work across
  multiple squads, providing architectural direction, ensuring
  engineering excellence, and enabling the successful delivery
  of features across the entire Runna platform. We have a jam
  packed roadmap, with countless opportunities to champion new
  technologies, work on meaningful problems that impact
  millions of runners, and improve existing architecture to
  elevate the whole of our engineering team.

  We follow a flexible hybrid model that translates to more
  than half of your time on-site – 3 days per week in Runna's
  office based in London, UK.

  What you’ll be doing

  You’ll be a multiplier for the engineering team; mentoring
  developers, improving processes, and guiding the evolution
  of our systems as we scale. We’re looking for someone who is
  not only technically excellent, but also a creative problem
  solver and collaborative leader who brings energy and
  clarity to fast-paced environments.

  - Lead the architectural design and technical strategy across
    multiple product teams, ensuring scalable, secure, and
    maintainable solutions.
  - Champion how we adopt AI across our SDLC, from agentic
    workflows and automated code review through to the tooling
    and guardrails that help the wider team ship faster
    without lowering the bar.
  - Drive the end-to-end delivery of key initiatives, working
    hands-on to build, test, and ship features across the full
    stack (mobile, backend, integrations).
  - Coach and support engineers by providing technical guidance,
    mentorship, and code reviews without creating bottlenecks.
  - Collaborate with Product, Design, and Engineering Leads to
    define the best solutions for user experience, balancing
    speed, quality, and long-term technical goals.
  - Own the release process and support a culture of reliable,
    continuous deployment—while enabling teams to ship
    confidently and independently.
  - Maintain and grow a high-performing engineering culture
    based on ownership, knowledge-sharing, and continuous
    improvement.

  What you’ll bring to the team:

  - 6+ years of professional experience in software engineering,
    with a focus on technical leadership and driving projects
    end-to-end.
  - Deep expertise in TypeScript/JavaScript, with a strong
    foundation across the full stack.
  - Hands-on experience putting AI to work in a real engineering
    organisation, whether that’s agentic workflows, automated
    code review, or internal agents. You have a clear view of
    where it pays off and where it doesn’t.
  - Familiarity shipping LLM-backed features to production,
    including prompt and context design, in a user facing
    product.
  - Broad AWS experience across serverless (Lambda, API Gateway,
    AppSync), containers (ECS/EKS) and managed services, with
    no strong attachment to one deployment model.
  - Skilled in defining and delivering features from initial
    architecture and design through to release, testing, and
    production support.
  - Able to thrive in a highly skilled, fast-paced engineering
    team. So far in 2026, we shipped:
    - 49 mobile app releases (iOS and Android)
    - 878 API releases
    - 552 modelling backend releases
  - Proven ability to mentor engineers, support team growth, and
    guide complex projects from design to release.
  - Comfortable with Infrastructure as Code tooling like
    Terraform, CDK, or CloudFormation.
  - Able to thrive in autonomous roles, taking ownership without
    heavy direction.

  Bonus points if you have:

  - Experience working with cross-platform frameworks, such as
    React Native
  - Have hands-on experience with SwiftUI or native mobile
    development.
  - Are confident working with and improving CI/CD pipelines,
    release cycles, and deployment processes.

  Our Tech Stack

  Below you can find a small reflection of our current tech
  stack:

  Frontend:

  - React Native (iOS and Android)
  - Typescript
  - GraphQL (Apollo Client)
  - Fastlane
  - SwiftUI (Apple Watch)
  - Maestro E2E tests

  Backend:

  - AWS (Serverless/Terraform)
  - Lambdas (NodeJS & Python)
  - ECS
  - AppSync, DynamoDB, S3, SQS, SNS, EventBridge
  - Snowflake

  All the other good stuff:

  - Sentry
  - GitHub Actions
  - Intercom, Mixpanel
  - RevenueCat
  - App Store Connect / Play Store

  Salary and Benefits

  We’re offering a salary of £110,000 - £131,000 per year,
  depending on experience, plus participation in Strava's
  long-term incentive (stock) programs. Overview of our
  benefits is below:

  We’re also committed to continually evolving our benefits to
  support you as we grow. Here is a brief overview what we
  currently offer in the UK 🇬🇧

  - 🏢 Flexible working – we typically spend 3 days a week
    together in our Vauxhall office
  - 🏝️ 25 days holiday, plus bank holidays
  - 📱Free Runna & Strava subscriptions for you and 3 of your
    friends (get ready to be your friends fave person or save
    them for holiday presents!)
  - 🧘 Headspace membership
  - 💸 Money every year to spend on gear, events and the gym!
  - 🏥 Private health insurance with Bupa and workplace pension
    scheme
  - 💖Modern Health is a mental wellness platform and app that
    combines technology with professional support to improve
    mental well-being and reduce stress
  - 🥕Carrot fertility support - this benefits provider can
    provide inclusive fertility, hormonal health, and family-
    forming benefits to our global employee population and
    takes the burden off what we know can be a stressful
    process.
  - 🐣 Parenthood is an exciting, challenging and beautiful
    thing. Our Family Care Leave is here to support parents as
    they welcome their new arrival. In line with our
    commitment to inclusivity, we provide leave to parents
    irrespective of gender or path to parenthood (e.g. natural
    childbirth, surrogacy or adoption).

  Please see more info on our amazing benefits here: Benefits
  at Runna

  Our Interview Process:

  Our aim is to keep the interview process as straightforward
  and enjoyable as possible, and will consist of the following
  stages:

  - Screening call with Talent team (30 minute video call)
  - Getting to Know You + Live Coding (45-minute video call,
    first 25 mins will be an introductory chat followed by two
    live coding exercises from https://leetcode.com/)
  - Take home technical task (max 1-2 hours to complete, or if
    you have something interesting you recently built and
    would like to showcase then that's perfectly OK)
  - 1.5-hour technical interview (the first half of the call
    will be used to discuss the take-home technical task from
    the previous stage and the second half will consist of
    system design and some general architecture/tech
    questions)
  - Meet the team (in-person chat with founder(s) and rest of
    the team)

  Please let us know if there’s anything we can do to better
  accommodate you throughout the interview process - this can
  be from scheduling interviews around childcare commitments
  to accessibility requirements. We want you to show your best
  self in the process, so please speak to your Talent Partner

  How to Apply:

  Please apply through this link (this will take you to our
  Ashby career hub). Please note, we are unable to accept any
  applications outside of Ashby. If you have any questions
  regarding the status of your application, please email
  careers@runna.com

  Still have questions or want to know more? Check out our
  Careers Page ✨

  🌎 We’re unfortunately unable to sponsor for this role
