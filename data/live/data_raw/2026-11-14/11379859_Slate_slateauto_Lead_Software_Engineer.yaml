description: |
  ABOUT SLATE

  At Slate, we’re building safe, reliable vehicles that people
  can afford, personalize and love—and doing it here in the
  USA as part of our commitment to reindustrialization. The
  spirit of DIY and customization runs throughout every
  element of a Slate, because people should have control over
  how their trucks look, feel, and represent them.

  WHO WE ARE LOOKING FOR

  Slate runs lean by design. Every dollar we spend has to earn
  its place on the truck, and the same philosophy applies to
  our enterprise systems. We are looking for a Sr. full stack
  engineer who understands that good software architecture is
  a manufacturing advantage, not an IT overhead.

  This is a developer role. You will build the digital
  backbone that connects functional teams across the
  enterprise: operations, supply chain, commercial, and
  digital. You've spent your career at the intersection of
  cloud infrastructure, full-stack development, and enterprise
  integration, and you know how to build platforms that scale
  without bureaucracy.

  You will report to the Head of Enterprise Systems
  Engineering and partner closely with Product, Operations,
  and Supply Chain leadership to ensure our systems evolve
  with the business.

  WHAT YOU GET TO DO

  - Lead Enterprise Solution Strategy: Define and drive the
    technical vision for enterprise applications, integration
    platforms, and digital capabilities that support
    operations and supply chain transformation. Align
    technology investments with business objectives while
    ensuring solutions scale across multiple functions and
    geographies.

  - Architect Scalable and Resilient Platforms: Establish
    architectural standards, reference patterns, and
    engineering best practices for enterprise systems. Lead
    the design of resilient, scalable, and secure platforms
    that support increasing operational complexity, business
    growth, and evolving supply chain demands.

  - Drive Enterprise Integration Excellence: Partner with Supply
    Chain, Finance, Operations, and business stakeholders to
    define integration strategies across critical business
    processes. Champion API-first, event-driven, and data-
    centric architectures that enable seamless connectivity,
    interoperability, and real-time business insights across
    the enterprise.

  - Influence Strategic Technology Decisions: Serve as a trusted
    technical advisor to engineering leadership, architects,
    and business partners by evaluating emerging technologies,
    SaaS platforms, and integration capabilities. Guide
    technology selection and investment decisions to ensure
    alignment with enterprise architecture, security, and
    operational objectives.

  - Raise Engineering Quality and Operational Excellence:
    Establish and promote standards for software quality,
    reliability, security, observability, and maintainability.
    Drive engineering excellence through scalable development
    practices, automation, governance frameworks, and
    continuous improvement initiatives that reduce operational
    risk and accelerate delivery.

  - Mentor and Amplify Organizational Impact: Provide technical
    leadership across teams by mentoring engineers, fostering
    architectural alignment, and enabling knowledge sharing.
    Influence engineering culture, improve developer
    productivity, and lead initiatives that strengthen the
    organization's technical capabilities and execution
    effectiveness.

  WHAT YOU BRING TO THE TEAM

  - 12+ years in software engineering, preferably in automotive,
    e-commerce, or manufacturing-adjacent environments.

  - Proven Full-Stack Engineering Caliber: Hands-on background
    in React.js, microservices/serverless, Kubernetes,
    PostgreSQL, MongoDB, and AWS. Unblock the team while
    simultaneously driving architectural direction and
    engineering strategy.

  - Enterprise Systems Depth: Meaningful experience delivering
    supply chain, procurement, or e-commerce systems at OEM or
    Tier-1 scale -- understanding how data flows from supplier
    portal to factory floor to customer.

  - Cloud-Native Fluency: Deep familiarity with AWS services,
    infrastructure-as-code, and cloud-native design patterns;
    experience operating systems at production scale with real
    SLAs.

  - Integration Architecture: Strong grasp of API design, event-
    driven messaging, EDI integration patterns, and how to
    stitch together heterogeneous enterprise systems without
    creating a ball of mud.

  - CRM and ERP Integration: Familiarity with CRM and ERP
    platforms and the integration patterns that connect them
    to custom-built operational applications -- understanding
    where commercial systems end and custom engineering
    begins.

  - Startup Orientation: Demonstrated ability to operate in
    fast-moving, resource-constrained environments -- you know
    how to ship, how to cut scope without cutting corners, and
    how to rebuild while the plane is flying.

  - Communication and Influence: Ability to translate technical
    complexity into business outcomes for non-technical
    stakeholders; comfortable presenting to executive
    leadership and board-level audiences.

  SALARY RANGE

  The compensation  for this position is the range Slate
  reasonably and in good faith expects to pay for the position
  taking into account the wide variety of factors that are
  considered in making compensation decisions, including job-
  related knowledge; skillset; experience, education and
  training; certifications; work location; and other relevant
  business and organizational factors.

  Base Pay Range (Annual)

  $141,807.00 - $212,710.00 USD Annual

  Additional Compensation and Benefits: Slate offers a wide
  range of competitive benefits, including medical, dental,
  vision, life insurance, disability insurance, vacation, and
  401k. The successful candidate may also be eligible to
  participate in the equity program and/or a discretionary
  annual incentive program, subject to the rules governing
  such programs.

  WHY JOIN TEAM SLATE?

  At Slate, we’re fueled by grit, determination, and attention
  to detail. The start-up spirit of ingenuity and
  resourcefulness move our business forward. Team Slate
  fosters a culture of excellence, innovation, and mutual
  respect, and is motivated by shared principles.

  - Safety First
  - Delight Customers
  - One Team
  - Relentless Improvement
  - Fast, Frugal, and Scrappy
  - Respectful Collaboration
  - Positive Legacy

  WE WANT TO WORK WITH PEOPLE THAT REFLECT THE COMMUNITIES IN
  WHICH WE OPERATE.

