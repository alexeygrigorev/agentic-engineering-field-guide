description: |
  About Decagon

  Decagon is the leading conversational AI platform empowering
  every brand to deliver concierge customer experiences.

  Our technology enables industry-defining enterprises like
  Avis Budget Group, Block’s Cash App and Square, Chime, Oura
  Health, and Hunter Douglas to deploy AI agents that power
  personalized, deeply satisfying interactions across voice,
  chat, email, SMS, and every other channel.

  We’re building a future where customer experiences are being
  redefined from support tickets and hold music to faster
  resolutions, richer conversations, and deeper relationships.
  We’re proud to be backed by world-class investors who share
  that vision, including a16z, Accel, Bain Capital Ventures,
  Coatue, and Index Ventures, along with many others.

  We’re an in-office company, driven by a shared commitment to
  excellence and velocity. Our values — Just Get It Done,
  Invent What Customers Want, Winner’s Mindset, and The
  Polymath Principle — shape how we work and grow as a team.

  About the Team

  The Agent Engineering team at Decagon deploys mission-
  critical AI agents to our customers that impact millions of
  users and directly drive Decagon’s growth. You will build on
  our industry-leading AI agent platform, collaborate directly
  with customers and use your own creativity to devise long-
  term, scalable solutions.

  Our mission is to deliver magical support experiences — AI
  agents working alongside human agents to help users resolve
  their issues.

  About the Role

  On the Agent Engineering team, you’ll have complete
  ownership and autonomy in building and shipping best-in-
  class AI agents, from initial implementation through
  continuous iteration. You’ll work directly with leaders
  across industries like finance, healthcare and hospitality,
  solving their users’ needs with reliable and intuitive AI
  agents.

  Engineers here own their work end-to-end and are trusted to
  make a real impact. This role is for someone who dives deep
  into complex system challenges and builds elegant solutions
  that scale to millions of users.

  In this role, you will

  - Design and build AI agents that outperform human agents in
    managing complex customer interactions and driving
    customer retention
  - Identify cross-customer trends that guide the evolution of
    Decagon’s agent building platform and research efforts
  - Experiment with and run evaluations on the latest text and
    voice models, then integrate them at scale with large
    enterprise-grade customers

  Your background looks something like this

  - Have 3+ years of industry experience in software engineering
  - Proficiency with Python, Typescript and asynchronous
    programming
  - A high degree of comfort digging into system failures within
    deep technology stacks using any tool necessary

  Even better

  - Prior experience working with multi-modal models

  Benefits

  - Medical, dental, and vision benefits
  - Generous time off, including 25 days annual leave, 8 UK
    public holidays, and a company-wide holiday break
  - Daily lunches, dinners and snacks in the office to keep you
    at your best

  Compensation

  £125,000 – £180,000 + Offers Equity

  Benefits

  We proudly offer the following benefits for our full-time
  employees:

  - Medical, Dental, and Vision benefits for you and your family
  - Life Insurance and Disability Benefits
  - Retirement Plan (e.g., 401K, pension)
  - Parental Leave
  - Fertility and family building benefits through Carrot
  - Monthly stipend to support your wellness, lifestyle, and
    work-life balance
  - Daily lunches and snacks in the office to keep you at your
    best
  - Take what you need vacation policy (subject to local
    requirements; UK employees receive 25 days of statutory
    leave)

  Decagon offers a competitive benefits package that varies by
  country and complements local statutory benefits. Details
  for this location will be provided during the recruitment
  process.
