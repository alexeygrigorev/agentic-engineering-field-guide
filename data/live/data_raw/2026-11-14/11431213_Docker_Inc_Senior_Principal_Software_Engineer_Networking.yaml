description: |
  About Docker

  Docker has been one of the most loved brands in developer
  tooling, trusted by more than 20 million monthly users and
  over 20 billion container image pulls. From solo founders to
  the world's largest companies, developers rely on Docker to
  build, share, and run their applications across our suite of
  products including Docker Desktop, Docker Hub, and Docker
  Scout. We are a globally distributed, remote-first team
  building the tools that define how software gets built and
  delivered. As AI agents redefine software development,
  Docker is at the center of that shift, providing the
  sandboxed environments, verified images, and secure
  infrastructure that make autonomous workflows trustworthy by
  default.

  ____________________________________________________________
  ___________

  The Role

  The Senior Principal Software Engineer is responsible for
  shaping and evolving the company’s technical landscape. In
  addition to designing, developing, and maintaining core
  systems, the Senior Principal Software Engineer provides
  strategic guidance to align technology initiatives with
  business goals. This role is vital in ensuring that the
  platform is secure, scalable, and performant—capable of
  supporting rapid growth and driving innovation.

  ____________________________________________________________
  ___________

  ResponsibilitiesTechnical Strategy & Architecture

  - Define and drive the overarching technical vision, ensuring
    the platform meets current and future scalability,
    performance, and security needs
  - Evaluate and select tools, frameworks, and architectures to
    maintain a state-of-the-art technology stack

  Leadership & Mentorship

  - Provide technical leadership and guidance to the engineering
    organization, setting best practices and standards.
  - Coach and mentor engineers, fostering a culture of
    continuous learning and collaboration

  Innovation & Research

  - Investigate emerging technologies, frameworks, and best
    practices
  - Lead prototyping initiatives and proof-of-concepts that can
    transform the platform’s capabilities

  Scalability & Performance

  - Ensure the platform is designed for high performance and can
    seamlessly handle increasing user loads
  - Oversee performance optimization, load balancing, and
    capacity planning strategies

  Reliability & Availability

  - Design fault-tolerant, highly available systems that
    minimize downtime and deliver a seamless user experience
    Infrastructure Automation
  - Advocate for and implement Infrastructure as Code (IaC)
    principles, CI/CD pipelines, and automation best practices
  - Continuously refine deployment, testing, and operations
    processes to improve efficiency

  Security & Compliance

  - Collaborate with security experts to ensure platform
    integrity, compliance with industry standards, and
    protection of sensitive data
  - Proactively address security vulnerabilities and champion
    secure coding practices

  Cross-Functional Collaboration

  - Work closely with product managers, designers, and other
    stakeholders to ensure technical initiatives support
    business objectives
  - Drive alignment between engineering roadmaps and product
    strategies

  Technical Problem-Solving

  - Tackle complex architectural and technical issues, providing
    clear direction and innovative solutions
  - Serve as an escalation point for critical system challenges

  Code Quality & Reviews

  - Uphold coding standards through thorough code reviews,
    ensuring high-quality, maintainable codebases
  - Establish and enforce best practices around testing,
    documentation, and version control

  Documentation & Knowledge Sharing

  - Produce comprehensive technical documentation, including
    architectural diagrams, design guidelines, and operational
    runbooks
  - Promote a transparent engineering culture by sharing
    insights and successes across the organization
  - Take part in on-call rotation for your team, respond to
    incidents, debug production issues, and drive continuous
    improvement of system reliability

  ____________________________________________________________
  ___________

  Qualifications

  ● 12+ years of software engineering experience with
  demonstrated expertise across multiple domains (SDLC, AI
  engineering, corporate systems, etc)

  ● Extensive software engineering experience, with a track
  record in designing and implementing large-scale,
  distributed systems

  ● Deep technical expertise: Proficiency in multiple
  programming languages, cloud platforms (e.g., AWS, Azure,
  GCP), and modern development frameworks

  ● Leadership acumen: Demonstrated ability to lead diverse
  engineering teams, inspire innovation, and drive successful
  outcomes

  ● Architectural vision: Proven skill in defining and driving
  architectural roadmaps that align with evolving business
  needs.

  ● Problem-solving ability: Expertise in diagnosing complex
  system issues and designing robust, scalable solutions

  ● Communication skills: Excellent written and verbal
  communication skills, capable of influencing both technical
  and non-technical stakeholders.

  ● Security conscious: Solid understanding of security best
  practices, compliance standards, and data protection

  ● Continuous improvement mindset: Passion for optimizing
  processes, toolchains, and workflows

  ● Bachelor’s degree in Computer Science, Engineering, or a
  related field, or equivalent practical experience

  As a Senior Principal Software Engineer, you will not only
  architect innovative solutions but also shape the technical
  culture. Your leadership and expertise will be pivotal in
  building a resilient, cutting-edge platform that supports
  rapid growth and drives long-term success.

  Visa sponsorship: Docker considers visa sponsorship on a
  case-by-case basis based on business needs.

  ____________________________________________________________
  ___________



  Compensation & Equity

  All full-time roles include equity. Final compensation is
  determined on factors including but not limited to
  experience, skills, qualifications, and location.

  United States: $219K – $352K base

  ____________________________________________________________
  __________

  Posting Information

  - Open vacancy: This posting is for an existing open role.
  - AI in hiring: Docker may use AI-assisted tools during our
    recruiting process.
  - Interview recordings: Candidates will be invited to opt in
    to interview recordings to support interviewer calibration
    and consistent evaluations. Recordings are optional and
    require explicit consent.

  ____________________________________________________________
  __________

  Perks & Benefits

  - Remote-first by design – Work from your home, with offices
    in Seattle and Paris for connection and collaboration.
  - Flexibility that fits your life – We trust you to manage
    your schedule while delivering great work.
  - Time to recharge – Generous PTO, designated quarterly
    Whaleness Days, and a designated end-of-year Whaleness
    break.
  - Home office support – Set up your workspace for comfort and
    success.
  - Technology stipend – Equivalent to US$100 net per month to
    help support your work.
  - Learning & development – Annual stipend for conferences,
    courses, certifications, and continued learning.
  - Parental leave – 16 weeks of paid parental leave after six
    months of employment.
  - Equity for all full-time employees – Share in Docker's long-
    term success as we continue to grow.
  - Comprehensive benefits – Medical, retirement, and paid
    holidays vary by country.
  - Docker swag – Because representing the whale never gets old.

  Docker is proud to be an equal opportunity employer. We are
  committed to building a team that reflects a broad range of
  backgrounds, experiences, and perspectives. We believe
  diverse teams build better products, make better decisions,
  and better serve our global community.

