  will be considered for employment regardless of race, color,
  age, genetics, religion, gender, sexual orientation, gender
  identity, national origin, disability or protected veteran
  status and any other characteristic protected by federal,
  state or local laws. ComPsych Corporation maintains a drug
  free workplace.

  ComPsych Corporation and its affiliates is committed to the
  responsible and transparent handling of your personal data.
  Information collected during the recruitment process will be
  used to assess your application and, where applicable, to
  prepare and administer an offer of employment. Your personal
  data will be processed in accordance with the privacy laws
  applicable in your country or jurisdiction of residence,
  which may include the California Consumer Privacy Act
  (CCPA), the EU General Data Protection Regulation (GDPR),
  Canada's Personal Information Protection and Electronic
  Documents Act (PIPEDA) and applicable provincial privacy
  legislation, and other applicable national or local privacy
  laws. For full details on what personal data we collect, how
  we use it, your rights as an Applicant, and how to contact
  us with privacy-related questions, please review the
  relevant Applicant Data Privacy Notices: US Applicant Data
  Privacy Notice & Canada Data Privacy Notice.
