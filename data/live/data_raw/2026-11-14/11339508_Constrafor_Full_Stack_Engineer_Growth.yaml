description: |
  Constrafor is rebuilding the financial infrastructure behind
  one of the largest industries on the planet and we're doing
  it fast! Construction moves trillions of dollars a year, yet
  it still runs on outdated processes, cash flow guesswork,
  and paperwork chaos. We're the SaaS and fintech platform
  fixing that, giving General Contractors and Subcontractors
  the tools to manage procurement and financial transactions
  the way modern companies actually operate. Backed by $30M+
  in VC funding and scaling fast, we're not just building
  software, we're building the operating system for
  construction finance. If you want your work to have real,
  tangible impact on an industry that touches literally
  everything around you, this is that opportunity.

  We’re seeking an exceptional Full Stack Engineer to join our
  Growth team and own the product experiences that turn users
  into active, retained, and expanding customers. In this
  role, you’ll collaborate closely with the CTO, Product,
  Design, Sales, and Marketing to build and ship the features
  that drive acquisition, activation, conversion, and
  retention across our platform. As a technical member of the
  team, you’ll take on high impact projects that sit at the
  intersection of engineering, data, and business outcomes,
  where strategic thinking, technical depth, and strong
  product sensibility matter just as much as shipping speed.
  This position offers the opportunity to directly shape how
  Constrafor grows. If you’re a seasoned engineer who loves
  running experiments, digging into funnel metrics, and
  building seamless user experiences in a fast-paced startup
  environment, we’d love to hear from you.

  📝 What You'll Do:

  - Lead the design and development of high quality software
    across the full stack, ensuring scalability, performance,
    and maintainability.
  - Build and optimize user facing applications while seamlessly
    integrating them with robust backend services.
  - Collaborate with sales and product teams to prioritize and
    deliver features that directly impact revenue growth and
    customer success.
  - Implement best practices for security, testing, and
    deployment across both backend and frontend systems.
  - Engage with customers and internal stakeholders to
    understand their needs and translate them into elegant
    technical solutions.
  - Share knowledge across the team and contribute to a culture
    of technical excellence.

  📈 What You Bring:

  - 5+ years of experience developing and scaling full stack web
    applications in a fast paced environment.
  - Proficiency in Python, Django, Postgres, and AWS, with solid
    experience in front-end frameworks such as React or
    Next.js.
  - Deep understanding of RESTful APIs, modern web architecture,
    and performance optimization.
  - Proven experience building and maintaining complex SaaS
    products with strong attention to usability and
    scalability.
  - Strong communication skills, with a track record of owning
    projects from concept to completion.
  - A passion for clean code, and continuous learning.

  💼 What We Offer:

  - Competitive Salary: $180k-200k DOE.
  - Equity ownership within Constrafor.
  - Hybrid office schedule (3 days out of our Hudson Yards
    office)
  - Medical, dental & vision insurance coverage offered for you
    and your dependents.
  - Generous PTO Plan.
  - A collaborative and innovative work culture that values your
    input.
  - Opportunity to make a significant impact in a growing tech
    company.

  Compensation

  The base pay range for this role is $180,000 – $200,000 per
  year.
