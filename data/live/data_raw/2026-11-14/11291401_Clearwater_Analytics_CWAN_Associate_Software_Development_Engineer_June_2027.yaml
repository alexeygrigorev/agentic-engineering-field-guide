description: |
  Job Summary:

  The Software Development Engineer role at Clearwater
  Analytics spans a spectrum of responsibilities with a focus
  on designing, implementing, and managing software systems.
  The role requires continuous learning and application of new
  technologies and trends. Engineers at entry-level work on
  coding, debugging, and learning new software technologies.
  With progression in this track, the responsibilities expand
  to include leading teams, designing complex software
  systems, providing mentorship, and managing cross-functional
  integration. The more senior roles are responsible for
  defining the company's technological vision, making
  strategic decisions, driving innovation, and setting new
  industry standards. Across all levels, a successful software
  development engineer will demonstrate strong problem-solving
  skills, clear communication, excellent coding abilities, a
  keen understanding of the software ecosystem, and a
  cooperative team player attitude. - Please note this role
  starts in June 2027.

  Responsibilities:

  - Develop fundamental software engineering skills.
  - Successfully collaborate with peers in all aspects of
    software development.
  - Complete simple coding deliverables with minimal
    supervision.
  - Positively incorporate feedback from manager and mentor(s).
  - Learn the team’s business domain.

  - Take initiative to ask questions to clarify understanding.
  - Actively and constructively participate in submitting code
    for review.
  - Any other reasonable activity required by management.

  Required Skills:

  - Fundamental understanding of data structures, algorithms,
    and object-oriented design.

  - Basic programming skills in any modern language.
  - Enthusiasm for software work in a software-as-a-service
    company.
  - Driven by client satisfaction.
  - Strong teamwork skills.
  - Ability to manage own time and deliver expected results on
    time.

  - Commitment to continuous learning and improvement.
  - Exceptional analytical skills.
  - Strong computer skills, including proficiency in Microsoft
    Office.
  - Excellent attention to detail and strong documentation
    skills.
  - Outstanding verbal and written communication skills.

  - Strong organizational and interpersonal skills.
  - Exceptional problem-solving abilities.

  Education and Experience:

  - Degree in Computer Science or related field.

  - a plus
