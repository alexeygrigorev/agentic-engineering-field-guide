description: |
  We're hiring a Senior Frontend Engineer to help build and
  scale the app that thousands of sports fans use every day.
  You'll work across our React Native mobile app and React web
  surfaces, shaping the product experience as we grow from a
  fast-moving startup into the home for sports betting.

  About Pikkit

  At Pikkit, we're building the home for sports betting.

  Today, we're a social sports betting app with over 1 million
  users, 20,000+ five-star reviews, and more than $30B in
  legal U.S. sports wagers tracked through our app. We're
  featured in industry reports from Citizens Bank, Houlihan
  Lokey, SBC, and more, and backed by top-tier VCs including
  Founder Collective, Baukunst, and Matrix.

  We're a team of ~15, all in-person at our Flatiron NYC
  office. We move fast, ship high-quality product, care deeply
  about sports fans, and don't take ourselves too seriously. 😊

  About the Role

  This role owns how Pikkit looks, feels, and performs for our
  users. You'll take ownership across our React Native mobile
  app and React web app, building polished, fast, delightful
  interfaces that scale with a rapidly growing user base.

  The unifying thread is product craft: writing clean,
  maintainable frontend code, but also having the judgment to
  know what to build, how to architect it, and how to tell if
  it's working. We don't expect deep experience in our exact
  stack, but we do expect strong engineering fundamentals and
  a genuine interest in reliability, scalability, and product
  experience.

  This is a very hands-on, senior role. You'll be writing
  code, shaping component and page architecture, instrumenting
  what you build, and partnering closely with product and
  design to compound our velocity. We're a small, AI-leveraged
  team, so you should be comfortable using AI tools like
  Claude Code and Cursor as part of your everyday workflow,
  not just curious about them.

  What You'll Do

  As Frontend Engineer, you will:

  - Build and scale core features across our React Native mobile
    app and React web app
  - Own frontend architecture decisions, from component design
    to page structure, that keep our codebase fast,
    maintainable, and easy for the team to work in
  - Translate product and design vision into polished,
    performant user interfaces, with strong instincts for what
    will actually work for users
  - Instrument what you build with analytics, and use that data
    to inform what to build next
  - Improve app performance, from load times to animation
    smoothness to overall responsiveness
  - Identify bottlenecks in how we ship frontend features and
    remove them
  - Set the standard for frontend quality and craft at a small,
    fast-moving team

  What We're Looking For

  - 4+ years of software engineering experience building at the
    product/application layer, with a focus on frontend
    engineering
  - Deep experience with React and/or React Native; experience
    with Expo is preferred, and comfort with Node, AWS,
    MongoDB is a plus
  - A strong product mind and good user intuition, someone who
    can push back on a spec, not just implement one
  - A good sense of component design and page architecture, and
    how to keep a growing codebase clean
  - Experience adding analytics/instrumentation and using it to
    drive product decisions
  - Comfortable owning a domain end-to-end and thriving in
    ambiguity, startup or significant personal project
    experience is a major plus
  - AI-forward: you actively use AI coding tools in your day-to-
    day work and want to keep pushing on how AI can make you
    faster and better
  - Interest in sports or sports betting is a plus

  Benefits

  - Competitive salary and equity
  - Health, dental, and vision insurance
  - Unlimited vacation
  - Generous budget for laptop and equipment
  - Fun in-person team events
  - Office in Flatiron, NYC
