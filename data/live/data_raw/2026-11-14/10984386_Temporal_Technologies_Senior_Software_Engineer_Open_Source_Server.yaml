description: |
  Role Summary

  Temporal is looking for a Senior Software Engineer to join
  the Open Source Server team.

  This team builds and maintains the core Temporal server. Its
  scope is broad, including Matching, Applications,
  Foundations, task processing, quotas and throttling,
  visibility, developer-facing primitives such as standalone
  activities, schedules, and streaming, and workflow
  experience improvements such as Continue-As-New, pause, and
  reset.

  We do not expect one person to cover all of these areas.
  We're looking for an engineer who is excited to learn the
  system, contribute across the codebase, and help improve the
  reliability, performance, operability, and developer
  experience of Temporal.

  This is a hands-on engineering role where you'll collaborate
  with experienced engineers to design, build, and operate the
  core of Temporal's distributed systems platform.

  What You'll Do

  - Design, implement, and ship features for the Temporal
    server.
  - Solve distributed systems challenges across areas such as
    task matching, scheduling, workflow execution, visibility,
    quotas, throttling, persistence, developer primitives, and
    workflow lifecycle features.
  - Make thoughtful engineering tradeoffs across developer
    experience, performance, and operability requirements.
  - Partner with engineers, product managers, cloud teams, and
    customer-facing teams to build scalable technical
    solutions.
  - Improve the reliability and operability of the server
    through testing, observability, dashboards, alerts,
    runbooks, and documentation.
  - Participate in design discussions and code reviews to help
    maintain a high-quality codebase.
  - Contribute to improving the developer experience for both
    open source users and enterprise customers.
  - Mentor junior engineers and share knowledge with teammates.

  What You'll Bring

  - 5+ years of experience building and operating production
    distributed systems.
  - Strong fundamentals in distributed systems, concurrency,
    fault tolerance, scheduling, and performance.
  - Solid computer science fundamentals in distributed systems
    concepts including multi-threading and concurrency.
  - Experience writing concurrent code in production with
    languages like Go or Java or other applicable languages
    with skill level as "high end of Intermediate" and/or
    "Advanced" or "Expert" levels.
  - Experience building high-scale or performance-sensitive
    backend services, such as request-serving systems, task
    queues, scheduling systems, streaming or replication
    pipelines, rate limiting, sharding, load balancing,
    workflow engines, or orchestration systems.
  - Strong debugging, troubleshooting, and operational skills
    with a focus on reliability and observability.
  - Experience designing and building backend APIs or platform
    services.
  - Ability to work collaboratively across engineering teams and
    contribute to technical discussions.
  - Experience with open source software or communities is a
    plus.
  - Experience with AWS, Azure, or GCP is a plus.
  - Experience with technologies such as Elasticsearch,
    OpenSearch, ClickHouse, Cassandra, PostgreSQL, or MySQL is
    a plus.
  - Experience with Kubernetes, CRDs, KEDA, or Argo is a plus.

  What Makes You a Good Fit

  - You enjoy solving challenging distributed systems problems
    while keeping the developer experience in mind.
  - You like learning large codebases and making meaningful
    technical contributions over time.
  - You take ownership of your work and collaborate well with
    teammates.
  - You enjoy balancing technical depth with practical
    engineering decisions.
  - You don't need prior Temporal experience, but you're excited
    to work on the core of a distributed system used by a
    large open source community and enterprise customers.

