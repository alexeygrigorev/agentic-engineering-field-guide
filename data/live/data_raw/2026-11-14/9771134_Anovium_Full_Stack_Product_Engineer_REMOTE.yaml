description: |
  About Anovium

  Anovium is a technology consultancy that transforms
  operations through intelligent innovation. We specialize in
  helping logistics, transportation, and distribution
  companies modernize their operations while building
  foundations for future growth. By combining deep industry
  expertise with technical innovation, we deliver practical
  solutions that drive measurable business outcomes.

  » Our Approach

  We believe in the power of practical innovation. We focus on
  real results - helping traditional industries embrace modern
  technology without disrupting what makes them successful.
  Our approach is rooted in understanding your business first,
  then applying technology to solve real challenges.

  » Our Culture

  At Anovium, we're building a team of experts who understand
  both technology and industry. We value:

  - Deep expertise paired with continuous learning

  - Practical innovation over theoretical possibilities

  - Long-term partnerships built on measurable results

  - Balance of technical excellence and human understanding

  » Who We're Looking For

  We seek professionals who combine technical expertise with
  industry understanding. The ideal Anovium team member:

  - Thrives on transforming complex business challenges into
    elegant solutions

  - Values both technical excellence and practical business
    outcomes

  - Brings a partnership mentality to client relationships

  - Has a genuine interest in logistics, transportation, or
    healthcare technology

  - Embraces our philosophy of sophisticated innovation with
    practical impact

  Our team members don't just implement technology – they help
  traditional industries embrace the future while
  understanding their foundations. If you're excited about
  bringing meaningful technological transformation to
  established industries, we want to talk to you.

  Full Stack Product Engineer

  TL/DR: You're responsible for shipping amazing products.
  You're a wizard at your craft, while also being a team
  player that can guide the team to successful deliveries.

  The Opportunity

  We are looking for strong developers to augment our growing
  team and maintain our high standards of quality in delivery.

  Examples of projects you might work on include: med tech
  solutions, digital consumer aid products, legal tech
  products, productivity solutions, web3, etc.

  What You'll Do

  - Ship Value Fast. You’ll move fast, constantly shipping value
    consisting of clean, empathetic, efficient code. Bugs
    happen - own them; fix them.
  - Contribute Broadly. You’ll work with and contribute to
    product, design, engineering and architecture, applying
    your skills and insights to plan, develop, and own new
    tasks.
  - Own the Process. You’ll own responsibility for your delivery
    and execution. You’ll forge new paths forward while not
    waiting to be handheld.
  - Improve and Grow. You’ll be learning, improving, and
    teaching alongside others who love to do the same. You’ll
    lead and give constructive feedback. You’ll challenge both
    yourself and your team as they challenge you.
  - Make an Impact. You’ll be working with small teams. The
    things you do will have a large impact on shaping the
    delivery of products and features.

  Who You Are

  - You love to build and deliver. You’re obsessed with creation
    and delivery of value.
  - You are a wizard. You have end-to-end experience building
    out web and/or mobile applications. Others look up to and
    respect your technical skill sets. Your past experiences
    will help guide you and your team through challenges.
  - You thrive in fast-paced environments. This is an
    environment of high iteration. There is constant change
    and sometimes little guidance. You aren’t held back by the
    fear of being wrong or making a mistake.
  - You are empathetic for developers and consumers. You build
    with future and current developers in mind – making it
    easy for others (or even yourself!) to pick up where you
    left off. You also build with your consumer in mind.
  - You diagnose problems. You challenge prevailing assumptions
    and dig to the root of issues. You solve problems rather
    than treat symptoms.
  - You’re a strong leader. You’re passionate. You take pride in
    your craftsmanship and are passionate about quality
    software engineering.
  - You are candid. You’re candid, but respectful. You share
    pertinent information, even when difficult. You admit
    mistakes. You openly disagree and explain why.

  What You Have

  - Experiences:
  - 4+ years of building and shipping production-quality
    software systems
  - Backend technologies like Node.js, Go, C#/.Net, or
    Java/Spring
  - Frontend technologies like React.js or Vue.js
  - TypeScript
  - Building human-centered user experiences
  - Working cross-functionally with managers, designers, and
    engineers
  - Creating self documenting, modular, testable, performant
    code.
  - Deep understanding of the whole engineering stack, from
    database, servers, to UI
  - Experience with React Native, GraphQL, DevOps, or CI/CD.
  - Knowledgeable in web3.

  Ecosystems You May Work In

  - Different projects have a different combination of the
    following:
  - General. JavaScript (specifically, we favor TypeScript)
  - Front End. React.js, Vue.js
  - Back End. Node.js, Go, C#/.Net, Java/Spring
  - Mobile. React Native
  - Desktop. Electron
  - DB. MySQL, MongoDB
  - API. REST, GraphQL
  - Other. Python, LookML, Docker & more

  Excited but Not a 100% Fit?

  We are committed to building a diverse and inclusive
  workforce. If you’re excited about this role, but do not
  meet 100% of the qualifications listed above, we encourage
  you to apply.

  Excited but Not  a 100% Fit?

  We are committed to building a diverse and inclusive
  workforce. If you're excited about this role and have a
  strong background in sales, business development, or account
  management, but do not meet 100% of the qualifications
  listed above, we encourage you to apply. We value diverse
  perspectives and varied experiences that contribute to our
  team's success.
