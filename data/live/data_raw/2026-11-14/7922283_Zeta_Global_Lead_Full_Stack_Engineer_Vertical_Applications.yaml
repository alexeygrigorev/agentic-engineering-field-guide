description: |
  WHO WE ARE

  Zeta Global (NYSE: ZETA) is the AI-Powered Marketing Cloud
  that unifies identity, intelligence, and omnichannel
  activation into a single platform – powered by trillions of
  consumer signals and one of the industry’s largest
  proprietary databases. Our enterprise clients use the Zeta
  Marketing Platform (ZMP) to personalize experiences at the
  individual level across every channel.

  THE ROLE

  Our Vertical Applications team builds web applications that
  bring the power of ZMP to specific industries – Healthcare,
  Political, Retail, and more. Every vertical comes with its
  own fascinating challenges: unique compliance requirements,
  distinct data models, and workflows that genuinely matter to
  the people using them. It’s the kind of work where you get
  to learn new domains, solve real problems, and see your
  applications make a tangible impact.

  You’ll own applications end-to-end: partner with product
  owners to define the problem, architect the backend,
  integrate with Zeta’s core platform, build the frontend,
  ship to production, and ensure operational excellence. We
  value clean, simple architectures, test-first development,
  and continuous delivery. AI-assisted development with tools
  like Cursor, Claude Code, Gemini and Codex is embedded in
  our everyday workflow, and we’re excited about what agentic
  engineering unlocks for both development velocity and
  software quality.

  What You’ll Do

  - Own vertical web applications from idea to production –
    working closely with product owners, designing the
    architecture, building it, shipping it, and running it.

  - Architect backend services (Python, Java, Ruby, Node.js)
    with a focus on simplicity and reusability across
    verticals, so good patterns compound over time.

  - Build polished frontend experiences in React/TypeScript/Ant
    Design System that connect seamlessly with backend APIs
    (REST, Thrift).

  - Ship continuously and confidently through CI/CD, with
    observability, resilience and reliability built in from
    the start.

  - Use AI-assisted development tools as a natural part of your
    workflow to move faster while keeping quality high.

  - Weave AI/LLM capabilities into vertical applications,
    opening up new possibilities for each domain.

  - Collaborate across teams – mentor fellow engineers, lead
    technical initiatives, and bring clarity to complex
    decisions for both technical and non-technical audiences.

  What We’re Looking For

  7+ years of software engineering with a history of owning
  and operating the systems you build. You’re deeply
  proficient in at least two of Python, Java, Ruby, or
  Node.js, with solid React/TypeScript skills on the frontend.
  Continuous delivery, test-driven development, agile and
  shift-left are things you genuinely practice – not just
  checkboxes on a process document.

  You’re comfortable building and operating scalable,
  distributed, high performant systems and navigating multi-
  tenant, compliant environments. You’re already using AI-
  assisted coding tools (Cursor, Claude Code, Gemini, Codex,
  or similar) and you’re curious about pushing those workflows
  further.

  You’re a strong communicator who enjoys working directly
  with product owners, proposing architectures, building
  consensus across teams, and then making it happen. You’re
  energized by learning new domains and collaborating with
  people who care about their craft.

  Nice to Have

  - MarTech or AdTech experience (DSPs, bid stream processing,
    data-intensive platforms).

  - Domain knowledge in Healthcare, Political, or Retail
    verticals.

  Tech Stack

  Backend

  Python, Java, Ruby, Node.js

  Frontend

  React, TypeScript, Ant Design System, Playwright

  APIs

  REST, Thrift

  Infrastructure

  AWS, Kubernetes (EKS), EC2, S3, API Gateway, SQS, Kafka,
  GitLab, Grafana, Loki, Honeycomb, Statsig Feature Flags

  Data

  MySQL, Redis, Snowflake, Aerospike, DynamoDB, ScyllaDB

  AI Tooling

  Cursor, Claude Code, Gemini, Codex, AI Skills, MCP, Agentic
  Teams

  Practices

  CI/CD, Spec driven development, TDD, Agile, You Build It You
  Run It

  Why You’ll Love It Here

  - Interesting problems across diverse verticals – Healthcare,
    Political, Retail – on a platform processing trillions of
    consumer signals. You’ll never be bored.

  - AI-native engineering culture – agentic development isn’t a
    side experiment, it’s how we build. You’ll be at the
    forefront of how software teams work in the future.

  - Real ownership and autonomy. We trust our engineers to make
    great decisions and give them the space to do it.
  - Collaborative, low-ego team that genuinely enjoys working
    together and learning from each other.
  - Public company (NYSE: ZETA) with strong growth, competitive
    compensation, equity, and comprehensive benefits.

  BENEFITS & PERKS

  - Unlimited PTO
  - Excellent medical, dental, and vision coverage
  - Employee Equity
  - Employee Discounts, Virtual Wellness Classes, and Pet
    Insurance And more!!

  SALARY RANGE

  The salary range for this role is $180,000 - $200,000,
  depending on location and experience.

  PEOPLE & CULTURE AT ZETA

  Zeta considers applicants for employment without regard to,
  and does not discriminate on the basis of an individual’s
  sex, race, color, religion, age, disability, status as a
  veteran, or national or ethnic origin; nor does Zeta
  discriminate on the basis of sexual orientation, gender
  identity or expression.

  We’re committed to building a workplace culture of trust and
  belonging, so everyone feels invited to bring their whole
  selves to work. We provide a forum for employees to
  celebrate, support and advocate for one another. Learn more
  about our commitment to diversity, equity and inclusion
  here:  https://zetaglobal.com/blog/a-look-into-zetas-ergs/

  ZETA IN THE NEWS!

