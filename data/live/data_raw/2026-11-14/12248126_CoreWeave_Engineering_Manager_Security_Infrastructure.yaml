description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do:

  The Security Infrastructure organization at CoreWeave is
  responsible for several critical infrastructure and services
  that help Information Security Organization and CoreWeave
  teams to keep the essential cloud and its infrastructure
  secure.

  This team owns the Security Data Layer there by collecting
  the essential information from other systems and
  infrastructure across the company, making it queryable,
  understandable and relatable to security risks, controls and
  outcomes. This team owns the SIEM and  continuous control
  monitoring platforms.

  CoreWeave continues to scale, so does the data we need to
  understand, and the rich security context we need to offer
  as a service that will be critical for various security
  outcomes across the company.

  In this critical role, you will lead 8 to 10 senior
  engineers who will be developing, deploying and scaling the
  relevant critical systems.

  About the role: CoreWeave is seeking a Manager, Security
  Infrastructure to lead a team responsible for building,
  scaling, and operating security systems that acquire
  metrics, logs, traces, through telemetry pipelines, and make
  the data queriable, with augmented context and intelligence
  to derive security risks. In this role, you will define
  strategy and roadmap, drive platform reliability and
  performance improvements, and guide architectural decisions
  across security infrastructure. You will partner closely
  with infrastructure, platform, security, and application
  engineering teams to improve coverage and reliability . This
  role combines technical leadership, operational ownership,
  and team management to ensure security infrastructure scale
  with business and customer needs.

  Who You Are:

  - 5+ years of software engineering experience with production
    systems at scale
  - 2+ years of engineering management experience leading senior
    engineers and technical leads
  - Experience building and operating security or observability
    platforms across logs, metrics, traces, or alerting in
    distributed systems
  - Knowledge of reliability engineering concepts including
    SLOs, SLIs, incident management, error budgets, and fault-
    tolerant design
  - Experience scaling telemetry systems including storage
    backends, and query layers
  - Experience with distributed systems, performance
    engineering, and trade-offs involving scale, resilience,
    and cost
  - Experience partnering with infrastructure, security, and
    application engineering teams to drive platform adoption
  - Experience hiring and managing engineering teams

  Preferred:

  - Experience with Data Pipelines including distributed event
    streaming platforms, Elastic, Grafana, Prometheus-
    compatible systems, log aggregation, and distributed
    tracing tools
  - Experience operating cloud-native infrastructure, including
    Kubernetes environments
  - Experience supporting large-scale cloud, developer
    platforms, or AI/ML infrastructure
  - Familiarity with capacity planning for high-ingest telemetry
    systems
  - Experience scaling platforms in high-growth environments

  The base salary range for this role is $182,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

