description: |
  D.A. Davidson Companies is an independent, employee-owned
  company with a rich history spanning 90 years. We are
  dedicated to conducting our business in accordance with the
  highest standards of integrity and ethics, and delivering
  outstanding service to our clients and each other. We
  support a friendly, open and supportive culture, and
  encourage candid communication and productive engagement
  that make our companies and each of us better. Just as we
  work to improve our clients’ financial well-being, we also
  work to strengthen local communities—and giving back is one
  of our core values. You can learn more about our company
  culture and impact in our latest annual report.

  Summary/Function:

  Lead and execute complex software development initiatives
  with a strong emphasis on front-end and back-end engineering
  using ReactJS, NodeJS and TypeScript frameworks. Collaborate
  with cross-functional teams, including Data Engineers, to
  deliver scalable, secure, and high-performance applications.
  Responsibilities include architecture design, full-stack
  development, integration, testing, and adherence to D.A.
  Davidson’s SDLC standards.



  Qualifications:

  • College diploma or university degree in Computer Science.

  • 7+ years of experience in React, TypeScript, and
  JavaScript development.

  • Proven experience building and scaling applications using
  technologies such as Node.js and Express.

  • Experience with CI/CD pipelines, source control (Git), and
  modern JS build tooling (Yarn/NPM)

  • Strong understanding of REST APIs, frontend performance,
  accessibility, and responsive design.

  • Experience working with Agile frameworks.

  • Good knowledge of the Software Development Lifecycle
  (SDLC).

  • Experience working with Object-oriented analysis and
  design.

  • Experience leading feature delivery cycles in
  collaboration with cross-functional teams.

  • Strong interpersonal and oral communication skills.

  • Highly self-motivated and directed with a keen attention
  to detail.

  • Work with third-party vendors while managing aggressive
  timelines.

  • Ability to maintain regular, predictable attendance.



  Duties:

  • Lead the development and support of business-critical
  applications, focusing on scalable architecture and
  maintainable codebases using ReactJS for dynamic user
  interfaces and NodeJS for robust server-side logic.

  • Design, develop, and enhance complex applications based on
  detailed specifications, ensuring optimal performance and
  maintainability.

  • Conduct thorough code reviews for off-shore development
  teams to ensure adherence to internal coding standards,
  architectural guidelines, and security best practices.

  • Review and provide constructive feedback on code submitted
  by internal developers, promoting continuous improvement and
  knowledge sharing.

  • Approve completed development work by other team members,
  ensuring it meets functional requirements, performance
  benchmarks, and quality standards before deployment.

  • Write clean, efficient, and well-documented code; perform
  rigorous testing and debugging to ensure high-quality
  deliverables.

  • Participate in scrum events: Sprint Planning, Daily Scrum,
  Sprint Review, and Sprint Retrospective

  • Operate with a bias for action and take initiative to
  solve problems across the stack

  • Expectation to provide production support during weekend
  and off-hours.

  • Willing to periodically work flexible hours to work with
  resources in global time zones.

  • Have a strong sense of ownership over application uptime,
  security, and customer experience



  What we offer:

  Competitive base salary and performance related bonuses plus
  excellent benefits and perks including, but not limited to:

  • Medical, Dental and Vision

  • Company 401(k) and profit-sharing contributions

  • Generous sick, vacation, and maternity/parental leave

  • Paid holidays

  • Professional Development Opportunities

  • Tuition Reimbursement ($15,000 lifetime cap)

  • Discounted personal insurance including home, auto and
  recreational vehicles

  • Charitable gift-matching program

  • Davidson Day of Giving – Our tradition of positively
  impacting communities in which we live and work



  The potential base pay hiring range for this role is $95,000
  - $110,000. The compensation offered will be determined on a
  case-by-case basis considering a variety of factors
  including, but not limited to, the skills, relevant work
  experience, and geographic location of each specific
  candidate. This role is eligible to participate in
  applicable D.A. Davidson variable compensation programs.



