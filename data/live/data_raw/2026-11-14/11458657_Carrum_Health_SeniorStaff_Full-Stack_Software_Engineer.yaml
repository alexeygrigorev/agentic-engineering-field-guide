description: |
  At Carrum Health, we have built a unique marketplace for
  specialty care with unparalleled patient experience

  Since 2014, we have been rewiring a fundamentally broken
  healthcare system. By connecting large employers directly
  with the nation's top-tier providers, our platform replaces
  a flawed fee-for-service model with one that actually works.
  If you are passionate about solving complex economic
  problems, driving systemic change in our healthcare system,
  and thriving in a people-first culture, we want you on our
  team. As a high-growth health tech company, we are seeking
  high-performing, exceptional talent to scale our platform
  and ensure that anyone in the country facing a specialty
  procedure has access to the life-changing Carrum benefit.

  Our marketplace creates massive value for all stakeholders:

  - For Employers (Demand): Predictable, transparent pricing
    that slashes specialty care costs by up to 45% and
    eliminates waste
  - For Providers (Supply): Ability to gain market share while
    reducing administrative burden, empowering top-tier
    doctors to focus completely on delivering optimal care.
  - For Members (Users): A life-changing benefit with dedicated
    concierges, VIP access to the nation's best specialists,
    and little-to-no out-of-pocket costs.

  As a Senior or Staff Software Engineer,  you will take a
  hands-on leadership role in shaping the design, development,
  and optimization of both our web and mobile applications.
  Working primarily with Ruby on Rails in a Service-Oriented
  Architecture (SOA), you will support the creation of
  scalable, high-performance APIs and services, while
  contributing to and integrating with frontend components
  built with React and React Native. You will drive
  improvements in system architecture and performance through
  active leadership in code reviews, design sessions, and the
  continuous evolution of our development processes. You will
  work closely with our Data teams to design data models that
  meet both operational and analytical requirements. You will
  partner with the DevOps team to leverage AWS for simple and
  cost-effective cloud infrastructure deployment, ensuring
  that systems are both performant and resilient. A key
  responsibility will be implementing comprehensive monitoring
  and observability practices to guarantee the high
  availability, security, and scalability of our services.

  You will collaborate closely with product teams to define
  project timelines, influence technical direction, and guide
  the team through complex design and architectural
  decisions—all while ensuring the highest standards of code
  quality and continuous improvement in our development
  practices.

  This is a full time position, the salary range for this role
  is $160,000 - $230,000, plus equity and a 15% annual bonus,
  depending on level of experience and geographic location.
  This compensation range spans multiple levels. Final
  leveling will be determined at the end of the interview
  process.

  You’re excited about this opportunity because you will...

  - Have a direct impact on the technical direction and product
    roadmap of the company.
  - Collaborate with your product manager to seamlessly execute
    on value delivery of exceptional products through
    repeatable and iterative software development lifecycles
  - Work with other frontend/mobile engineers to build out
    technical roadmaps for the shared codebase that powers our
    mobile and web-based patient applications
  - Take ownership of the architecture and code you develop and
    release it frequently into the production environment.
  - Hold yourself and others accountable to spending that extra
    10% on a project to deliver great documentation in
    addition to the functionality itself
  - Relish working with a diverse and cross-functional group of
    people from a wide variety of backgrounds to solve
    problems that impact our patients

  We’re excited about you because…

  - You have 8+ years of experience in full-stack software
    development in a robust, highly available and performant
    multi-service ecosystem
  - You have production experience in our core technologies:
    Ruby on Rails (distributed architecture), React, Docker
  - You have strong experience using Postgresql SQL and NoSQL
    features to build out great and flexible data models
  - You have expertise in building software on top of the core
    AWS Services (ECS, RDS, S3, etc)
  - You enjoy technical leadership through code reviews and
    system design sessions
  - You possess good communication and collaboration skills in
    order to drive alignment and increase effectiveness on
    delivery across teams
  - You have strong expertise in designing simple and
    supportable software through monitoring, alerting and
    performance tuning
  - You enjoy mentoring engineers in building simple, scalable
    and reusable software and impart best practices to the
    team
  - Are passionate about building great user experiences that
    are accessible to a wide variety of users.
  - You have interpersonal skills and don’t have a hard time
    being empathetic, courteous, and friendly.
  - You are entrepreneurial and resourceful — As a member of a
    startup, we need people who can find creative ways to make
    a big impact quickly and without much direction.
  - You have experience handling deadlines, keeping many balls
    in the air, and prioritizing work in a fast-paced, dynamic
    environment.
  - Note that we left out all of the other nonsense and standard
    gibberish you see in every JD, so please tell us you read
    this far.  You will get points for it.  Seriously.

  Why you’ll love working with us...

  - We’re a hard-working, humble, and compassionate group
    motivated to solve the hard problems in healthcare today.
    You’ll work with talented, experienced co-workers from
    companies like Booz & Company, Teladoc, Hinge Health,
    Accolade, Angi, and Optum.
  - We champion a collaborative environment where team members
    can be autonomous, receive support and healthy feedback,
    and bring their authentic selves to work.
  - We carve out time to celebrate our successes and have fun.
    We’re a remote-first company with employees all over the
    United States. We offer holistic employee support with
    flexible working hours, generous time off, paid parental
    leave, opportunities to connect virtually and in-person,
    and more.
  - We embrace our team’s diversity of thought, experience, and
    interests and know that doing so makes us stronger as a
    company. Carrum has an active employee-led Diversity,
    Equity, Inclusion, and Justice (DEIJ) committee alongside
    several employee resource groups (ERGs) that support
    parents, women, and various underrepresented groups.
  - You’ll feel proud that the work you do each day directly
    impacts people’s lives in big and meaningful ways.
  - Carrum is remote-first, but we believe the best work often
    happens in person. This role may include occasional travel
    for team offsites, client events, or company gatherings.

  Other benefits:

  - Stock option plan and performance bonus for eligible
    employees
  - Flexible schedules and remote work
  - Chicago and San Francisco offices available as an option
  - Flexible PTO, within reason
  - Summer Fridays (sign off @ 1pm local time)
  - 15+ paid holidays, including Juneteenth, World Mental Health
    Day, and Carrum Health Day
  - Annual holiday shutdown in December
  - Paid parental leave
  - Health, vision, and dental insurance
  - Employee Assistance Programs (EAP)
  - 401K retirement plan

  About Carrum

  Carrum Health’s mission is to change how we pay for and
  deliver specialty care. We offer self-insured employers and
  plan sponsors a value-based specialty care platform that
  connects their members with a rigorously vetted network of
  specialty care providers. Carrum’s transparent, all-
  inclusive bundled pricing, award-winning technology, and
  dedicated care navigation team help lower costs for both
  members and employers while delivering a superior member
  experience. Carrum is independently validated to reduce
  unnecessary procedures by as much as 30%, lower readmissions
  by 80%, and save employers up to 45% per episode of surgical
  care. Learn more at carrumhealth.com.

  Since launching in 2014, we’ve partnered with top-quality
  providers across the nation including Cleveland Clinic,
  Johns Hopkins, Mayo Clinic, Stanford Health Care, and a
  growing network of 1,400+ COEs. We serve hundreds of self-
  insured employers including Fortune 50 companies, such as
  United Airlines, US Foods, and Prudential, and public sector
  clients such as the States of Maine, Nevada, Tennessee, and
  Self-Insured Schools of California.

  The impact of our platform has been validated by a landmark
  RAND Corporation study, honored with prestigious awards from
  institutions like Harvard Business School & Harvard Medical
  School, and featured as a Harvard Business School case
  study.

  As a recognized digital health leader, Carrum is frequently
  covered by national media, including Bloomberg, Fast
  Company, Fierce Healthcare, Fortune, Los Angeles Times,
  Reuters, TechCrunch, and U.S News & World Report. Backed by
  $96M from top-tier investors including OMERS, Tiger Global
  Management, Revelation Partners and Wildcat Ventures, we’re
  only scratching the surface of our opportunity. Come join
  us.

  Carrum Health is an equal opportunity employer and
  encourages all applicants from every background and life
  experience.

  A Note on Recruitment Safety: To protect yourself against
  recruitment fraud, please note that Carrum Health will only
  communicate via an @carrumhealth.com email address. We do
  not conduct interviews via text or messaging apps, nor do we
  ever request financial information or fees during the hiring
  process. All authentic job openings are posted at
  carrumhealth.com/careers. If you are unsure about the
  legitimacy of a communication, please verify it via
  talent@carrumhealth.com.
