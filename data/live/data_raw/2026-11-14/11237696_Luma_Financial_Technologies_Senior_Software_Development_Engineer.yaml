description: |
  About Luma Financial Technologies

  Founded in 2018, Luma Financial Technologies (“Luma”) has
  pioneered a cutting-edge fintech software platform that has
  been adopted by broker/dealer firms, RIA offices, and
  private banks around the world. By using Luma, institutional
  and retail investors have a fully customizable, independent,
  buy-side technology platform that helps financial teams more
  efficiently learn about, research, purchase, and manage
  alternative investments as well as annuities. Luma gives
  these users the ability to oversee the full, end-to-end
  process lifecycle by offering a suite of solutions. These
  include education resources and training materials; creation
  and pricing of custom structured products; electronic order
  entry; and post-trade management. By prioritizing
  transparency and ease of use, Luma is a multi-issuer, multi-
  wholesaler, and multi-product option that advisors can
  utilize to best meet their clients’ specific portfolio
  needs. Headquartered in Cincinnati, OH, Luma also has
  offices in New York, NY, Miami, FL, Zurich, Switzerland and
  Lisbon, Portugal. For more information, please visit Luma’s
  website.

  About the role

  We are seeking a highly skilled and adaptable Software
  Development Engineer to design and implement integrations
  with our platform. In this role, you will collaborate with
  engineers, product owners, and business teams to understand
  requirements, design scalable and maintainable solutions,
  and ensure security by design. Performance is critical to
  providing a seamless user experience, and we expect you to
  optimize for efficiency and speed.



  The ideal candidate will ensure timely delivery of high-
  quality solutions. A strong focus on code test coverage,
  CI/CD best practices, and production support is essential.
  Given our decentralized team structure, the ability to work
  effectively across multiple time zones is required.

  What you'll do

  Key Responsibilities & Opportunities

  - Design and implement scalable SPA based on microservice
    architecture
  - Develop and maintain high-performance React and Spring Boot
    applications
  - Involve in making technical decisions to design and optimize
    system architecture with a focus on scalability,
    maintainability and reliability
  - Design data models in both relational and non-relational
    databases
  - Design and implement comprehensive testing strategies
  - Design and implement robust monitoring and alerting
    solutions
  - Collaborate with cross-functional teams to refine and drive
    technical solutions
  - Work in a fast-paced environment with shifting priorities
  - Stay up to date with emerging technologies, architectures,
    and coding best practices and apply them in software
    development
  - Mentor junior team members with the best AI-DLC practices

  Qualifications

  - Bachelor’s degree or above in Computer Science, Engineering,
    or a related field
  - Minimum 7 years of professional software development
    experience
  - Excellent communication and teamwork
  - Proven experience working and striving in a fast pace and
    agile framework
  - Proven record of designing large scale, secure, high traffic
    and distributed software system
  - Proven record of writing high-quality, scalable and
    maintainable code
  - Strong expertise in React and Angular frontend applications
  - Strong expertise in Java and Spring Boot framework
  - Strong experience in relational and non-relational databases
  - Strong experience of Microservices architecture and design
    patterns
  - Experience working with internal and external stakeholders
    to build end to end solutions
  - Hands-on experience with cloud computing (AWS preferred)
  - Hands-on experience with all aspects in AI-DLC
  - Experience of mentoring and providing guidance to junior
    engineers
  - Comprehensive experience in agentic coding with AI tools
    like Claude Code and AWS Kiro

  Luma Financial Technologies is unable to sponsor work visas
  or provide employment-based immigration sponsorship for this
  position, now or in the future. Applicants must be legally
  authorized to work in the country they are employed without
  current or future sponsorship from Luma.

  Any misrepresentation, including regarding work
  authorization or sponsorship needs during the application or
  interview process will result in disqualification from
  consideration for this role or termination of employment.

