description: |
  Job Description:

  Software Engineer III's design, code, test, and debugs
  programs; maintain and document program changes. They
  competently perform work in complex sections of at least one
  major CSI application, with a strong emphasis on backend
  development using Node.js and TypeScript. They maintain and
  document program changes, working on complex sections of
  major applications, particularly focused on scalable
  services, APIs, and data processing. This role requires use
  of imagination, originality, and ingenuity to uphold high
  programming standards and make a significant impact.

  Responsibilities:

  - Project Leadership: Take ownership of the development and
    rollout of entire backend systems, services, or large-
    scale projects.
  - Standards and Practices: Enforce department coding standards
    and best practices, with emphasis on TypeScript usage,
    code quality, and backend architecture patterns.
  - Project Management: Demonstrate effective and efficient
    project management skills in delivering backend-focused
    initiatives.
  - Technical Specifications: Write technical specifications for
    backend systems and identify project and programming
    risks, including performance and scalability
    considerations.
  - Coaching and Mentorship: Champion processes and technologies
    (Agile, CI/CD) while coaching colleagues in Node.js and
    TypeScript best practices.
  - Expertise and Innovation: Showcase expertise in Software
    Engineering skills, with deep knowledge of backend
    development and emerging technologies in the Node.js
    ecosystem.
  - Programming Knowledge: Apply strong knowledge of Node.js,
    TypeScript, asynchronous programming, API design, and data
    modeling, along with other programming languages as
    needed.
  - Thought Leadership: Provide proactive investigation,
    problem-solving, and thought leadership, particularly in
    backend system design and optimization.
  - Mentorship: Offer coaching and mentorship to less
    experienced Software Engineers, especially in backend
    engineering practices.

  Requirements:

  - Accredited university, college or trade school education and
    training in applicable technology, advanced degrees or
    certifications preferred
  - 7+ years of experience with Node.js and TypeScript,
    including backend architecture patterns, asynchronous
    programming, scalable service design, and code quality
    best practices.
  - Experience designing, coding, testing, debugging,
    maintaining, and documenting programs and program changes.
  - Strong understanding of API design, data modeling,
    performance optimization, and scalability considerations.
  - Demonstrated ability to take ownership of backend systems,
    services, or large-scale projects from development through
    rollout.
  - Ability to enforce coding standards and software engineering
    best practices, particularly around TypeScript usage,
    backend architecture, and maintainable development
    patterns.
  - Experience with Agile processes, CI/CD practices, and modern
    software delivery workflows.
  - Ability to investigate complex technical problems, propose
    effective solutions, and provide thought leadership in
    backend system design and optimization.
  - Demonstrated imagination, originality, ingenuity, and sound
    technical judgment in upholding high programming
    standards.
  - Ability to coach and mentor less experienced Software
    Engineers in Node.js, TypeScript, backend engineering
    practices, and related technologies.

