description: |
  Why Harvey

  At Harvey, we’re transforming how legal and professional
  services operate. By combining frontier agentic AI, an
  enterprise-grade platform, and deep domain expertise, we’re
  reshaping how critical knowledge work gets done for decades
  to come.

  This is a rare chance to help build a generational company
  at a true inflection point. We have strong product-market
  fit and world-class investor support. We’re scaling fast and
  defining a new category in real time. The work is ambitious,
  the bar is high, and the opportunity for growth — personal,
  professional, and financial — is unmatched.

  Our team moves fast, takes ownership, and is deeply
  committed to the mission — operating with intensity, staying
  close to our customers, and pushing each other for
  excellence. We live by three values: Decisiveness,
  Simplicity, and Job's Not Finished. We act quickly on clear
  judgment over perfect information, we believe simplicity is
  what scales, and we're never satisfied with where we are. If
  you want to do the best work of your career alongside people
  who share that drive, we'd love to build with you.

  At Harvey, the future of professional services is being
  written today — and we’re just getting started.

  Role Overview

  As a Software Engineer on the Product Engineering team at
  Harvey, you will own and lead engineering projects across
  our various product lines. You will work closely with our
  AI, Legal, and GTM teams to build secure systems that
  deliver value to our customers. We are looking for
  individuals who have worked across the stack on incredible
  products across consumer, enterprise, and various industries
  and who are excited about building the future of application
  layer and genAI products.

  This role is based in New York City. We use an in-person
  work model and offer relocation assistance to new employees.

  What You'll Do

  - Scale document ingestion and processing that is growing at
    10x every 6 months
  - Design massive data collection from over 50+ legal
    jurisdictions
  - Build government-level security for top governments and
    firms
  - Lead projects that delight customers in bringing AI to web,
    desktop, mobile, Google Docs, MS Word, and API
    experiences.
  - Build AI-platform and AI-native features like agentic
    orchestration layers, tool calls, and retrieval systems.
  - Ship across the full stack—leveraging React and TypeScript
    on the frontend alongside Python and Postgres on the
    backend—to architect intuitive UX and robust APIs for
    streaming results, long-running processes, and complex
    tool-calling workflows.

  What You Have

  - 10+ YoE (post-BS/MS) in a product focused full-stack
    software engineering role.
  - Experience with React, Typescript, CSS (we use TailwindCSS),
    Python, or related.
  - Track record of building fast-growing SaaS products.
  - Track record of shipping highly intuitive products, strong
    attention to detail.
  - Experience building scalable and extensible solutions across
    the stack that can support multiple product lines.
  - Strong programming skills and general Computer Science
    knowledge.
  - Grit - experience working at early-stage startups is a plus.

  Compensation

  $231,000 - $340,000 USD

  Harvey is an equal opportunity employer and does not
  discriminate on the basis of race, gender, sexual
