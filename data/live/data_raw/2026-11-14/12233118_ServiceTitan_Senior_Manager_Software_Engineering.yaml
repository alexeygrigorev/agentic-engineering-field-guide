description: |
  Ready to be a Titan?

  Homh is ServiceTitan's new consumer brand connecting
  homeowners with vetted, high-quality contractors for home
  service and improvement projects. We're building a look-and-
  book experience: homeowners request a service, get matched
  with top contractors (often same-day, within a 3-4 hour
  window), and can easily rebook people they trust. This is a
  0-to-1 build inside an established company, a startup with
  ServiceTitan's resources behind it.

  We're looking for a seasoned engineering leader to run a
  small, senior-heavy team, including staff engineers,
  shipping this product from the ground up. You'll need
  technical depth across mobile, backend, and frontend to make
  and defend architecture calls, and review hard design
  decisions. You'll work directly alongside the exec team,
  product, and design.

  What you'll do:

  - Drive technical direction across the full stack, mobile app,
    backend services, and frontend, including geolocation-
    based matching logic and other core product systems
  - Set the bar on architecture and design decisions as a
    credible technical counterpart to a team that includes
    staff-level engineers
  - Own and communicate the team's roadmap, balancing fast
    iteration (this is early-stage, trial and error is
    expected) against a coherent long-term technical vision
  - Partner closely with B2B engineering teams to ensure Homh's
    architecture works well with ServiceTitan's existing
    contractor-side tools and systems
  - Champion AI tooling across the team's workflow, pushing for
    leverage in how the team builds, researches, and ships
  - Take accountability for delivery through discovery and
    implementation, including technical tradeoffs under
    ambiguity
  - Set development plans, run 1:1s, and assess progress, with
    an emphasis on technical mentorship and unblocking over
    process-building
  - Build team cohesion, celebrating wins and solving problems
    together
  - Partner with Recruiting on interviewing, sourcing, and
    screening to help build out the team
  - Communicate clearly and directly with engineers, product,
    design, and leadership in a fast-moving, cross-functional
    org

  What you'll bring:

  - 7+ years managing software engineering teams, including
    experience managing senior or staff-level engineers
    directly
  - Hands-on technical background as a senior or staff engineer
    designing APIs, systems, and abstractions used by other
    engineers
  - Ability to go deep enough on architecture across frontend,
    backend, and mobile to make credible calls with a team
    that doesn't need hand-holding technically
  - Comfort with ambiguity and fast iteration on an early-stage
    product without settled processes
  - Strong communication and technical writing skills

  Ideal candidates also have experience with:

  - Our stack: React, TypeScript, C#/.NET, Next.js, Tailwind,
    Vite, Azure (Container Apps, Functions, Service Bus),
    PostgreSQL, Snowflake, LangGraph, MCP, Kafka
  - Consumer-facing (B2C) product experience, ideally 0-to-1 or
    early-stage
  - Mobile app development
  - Managing a team through a period of headcount growth (this
    role is expected to grow into an org with M1s reporting up
    as the team expands)
  - B.S., M.S., or PhD in Computer Science, Engineering, or a
    related technical field

  Be Human With Us: Being human isn’t about checking every box
  on a list. It’s about the experiences we have, people we
  meet, and the perspectives we share. So, if you have the
  skills but are hesitant to apply because of your background,
  apply anyway. We need amazing people like you to help us
  challenge the conventional and think differently about the
  problems that we’re solving. We’re in this together. Come be
  human, with us.

  Use of AI Technology:

  We use technology, including automated and AI-assisted
  tools, to support certain aspects of our recruitment
  process. These tools are designed to improve efficiency and
  enhance the candidate experience. AI tools are not used to
  make hiring decisions; all hiring decisions are made by our
  hiring teams.

  What We Offer:

  When you join our team, you’re not just accepting a job.
  You’re making a career move. Here’s how we’ll support you in
  doing some of the most impactful work of your career:

  - Flextime, recognition, and support for autonomous work:
    Flexible time off with ample learning and development
    opportunities to continue growing your career. We offer a
    comprehensive onboarding program, leadership training for
    Titans at all levels, and other programs and events. Great
    work is rewarded through Bonusly, peer-nominated awards,
    and more.
  - Holistic health and wellness benefits: Company-paid medical,
    dental, and vision (with 100% employer paid options and
    90% coverage for dependents), FSA and HSA, 401k match, and
    telehealth options including memberships to One Medical.
  - Support for Titans at all stages of life: Parental leave and
    support, up to $20k in fertility services (i.e. IUI and
    IVF), surrogacy, and adoption reimbursement, on demand
    maternity support through Maven Maternity, free breast
    milk shipping through Maven Milk, pet insurance, legal
    advisory services, financial planning tools, and more.

  At ServiceTitan, we celebrate individuality and uniqueness.
  We believe that the convergence of fresh perspectives and
  experiences from all walks of life is what makes our product
  and culture so great. We strongly encourage people from
  underrepresented groups to apply. We do not discriminate
  against employees based on race, color, religion, sex,
  national origin, gender identity or expression, age,
  disability, pregnancy (including childbirth, breastfeeding,
  or related medical condition), genetic information,
  protected military or veteran status, sexual orientation, or
  any other characteristic protected by applicable federal,
  state or local laws.

  ServiceTitan is committed to fair and equitable compensation
  for all of our employees. We thoughtfully consider a wide
  range of factors when determining individual compensation,
  which may change over time. We comply with all applicable
  minimum wage laws. For candidates in the United States, the
  good faith salary ranges estimate for this role is

  Zone 1: $218,300 USD - $327,500 USD Applicable for: CA, CT,
  DC, MD, MA, NJ, NY, VA, and WA

  Zone 2: $204,000 USD - $306,000 USD Applicable for: All
  other US locations.

  International Compensation for candidates residing outside
  the United States will vary by location and will be
  discussed during the hiring process. Actual compensation
  within a range is determined by factors including relevant
  experience, skill set, qualifications, and performance. In
  addition to base salary, our total compensation package
  includes an annual bonus, equity, and a holistic suite of
  benefits.
