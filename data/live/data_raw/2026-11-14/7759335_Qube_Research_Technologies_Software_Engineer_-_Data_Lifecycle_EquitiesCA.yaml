description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology and data
  driven group implementing a scientific approach to
  investing. Combining data, research, technology, and trading
  expertise has shaped our collaborative mindset, which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high quality returns for our investors.

  Your future role at QRT:

  We are looking for an exceptional Software Engineer to be an
  integral member of the Data and Lifecycle team. We work
  closely with trading and research functions to provide trade
  and position lifecycle automations (corporate actions,
  expiries, coupon payments, etc), maintain reference data,
  handle internal and external reporting and generate reports
  for Front office use across different teams.

  This position has a specialized focus as an SME for
  Equities, ETFs Reference Data and Corporate Actions. This
  high-visibility position will directly impact trading and
  business operations by providing expert guidance on equity-
  related reference data, events and automating complex
  lifecycle processes.

  Your responsibilities will include:

  - Be involved in the design and implementation of scalable,
    high-performance solutions for trade and position
    lifecycle automations for corporate actions, ensuring
    accuracy and operational efficiency.
  - Ensure the availability and quality of reference data for
    diverse asset types, with a particular emphasis on
    equities and corporate actions.
  - Partner closely with a variety of stakeholders and maintain
    alignment with business needs.
  - Validate systems and procedures related to reference data
    and corporate actions, ensuring robust trade/position
    checks and alignment with brokers and fund administrators.

  Your present skillset:

  - Deep understanding of equities, ETFs and their derivatives
    with regards to reference data and corporate actions
  - Advanced Python programming, design, and architecture.
  - Familiarity with SQL and relational databases.
  - Experience with C# is a plus
  - Knowledge of testing as part of continuous delivery and
    integration pipelines.
  - Excellent communication skills, and ability to collaborate
    effectively in a small, close-knit team.
  - Fluency in English, both written and verbal communication
    skills

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
