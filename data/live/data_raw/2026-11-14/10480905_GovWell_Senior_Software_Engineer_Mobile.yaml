description: |
  🏛️ About GovWell

  We the people — and the taxpayers — deserve good government.
  Yet today, interacting with government services is often
  frustrating and inefficient. GovWell is building the AI
  operating system transforming how governments serve
  communities, starting with local agencies.

  GovWell replaces legacy software for municipalities and
  counties, empowering public servants to radically streamline
  public services and cut internal processing time for permits
  and licenses by up to 95%.

  Founded in 2023, GovWell powers 5,000+ mission-critical
  processes for agencies in 35+ states serving millions of
  residents. The company has raised $35M in funding from
  Insight Partners, Work-Bench, and Bienville Capital, and the
  team works in person at GovWell HQ in New York City. Read
  more about our founding story in TechCrunch.

  🌟 Role overview

  Millions of Americans don't have reliable access to a laptop
  or desktop — for a lot of the country, a phone is the only
  way they'll ever interact with government services.
  GovWell's mobile presence is still early: real, in the hands
  of real users, but small enough that most of what it becomes
  is still being figured out.

  GovWell is hiring a Mobile Engineer to join Zach, who's been
  building GovWell's mobile foundation, and help take it from
  early to real scale. You'll work on both sides of mobile at
  GovWell: giving government staff and field workers a faster,
  more reliable way to do their jobs, and giving residents a
  simple, direct way to interact with their local government
  from their phone.

  This role reports directly to our CTO and Co-Founder, Ben
  Cohen.

  We have a hybrid work culture that combines regular in-
  person collaboration at our New York City office (3+ days
  per week) with flexibility to work remotely.

  ☀️ Why GovWell?

  - A mission that matters: Building AI-powered products to fix
    outdated government systems isn’t just a technical
    challenge—it’s a historic opportunity to improve our
    foundational relationship with government and ensure
    trillions of tax dollars result in high quality services.
    WATCH: Mission & Vision with CEO & Co-Founder Troy LeCaire
  - Real-world impact: GovWell’s product is the system of record
    for government services that affect millions of Americans.
    From streamlining permitting for small businesses to
    accelerating affordable housing development, your work
    will make an immediate difference.
  - Join a startup in hyper-growth: We’ve found product-market
    fit and are scaling the business very quickly (4X ARR
    growth in the last year). As an early team member, you’ll
    learn what it takes to build a successful startup. You’ll
    work closely with the founders while enjoying exceptional
    autonomy and ownership over your work.



  💻 What you’ll do

  - Build the field experience GovWell staff actually want to
    use — fast, reliable, and built for real conditions, not a
    scaled-down version of the web product.
  - Make sure the work doesn't stop just because the signal
    does. Field staff should never lose progress or have to
    re-do something because they lost connectivity.
  - Put permitting and licensing directly in residents' hands —
    simple enough that checking a permit status or submitting
    an application feels as easy as anything else on their
    phone.
  - Help define what native mobile craft looks like at GovWell —
    this is a young product, and the standard you set now is
    the standard the product grows into.
  - Shape what's next as mobile matures: new workflows, new
    capabilities, and how the staff and citizen experiences
    evolve relative to each other.

  🧠 Who you are

  - Real experience shipping production mobile apps on iOS
    and/or Android.
  - Comfortable owning ambiguous, early-stage decisions on a
    product that's growing quickly
  - You think about speed and friction obsessively — tap counts,
    load times, and the assumption your user might be standing
    outside, one-handed, in a hurry.
  - Product instincts: you can help decide what to build next
    and why, not just execute a fully-specified ticket.
  - You align closely with our Core Values.

  🖥️ Our tech stack

  - Native iOS (Swift, SwiftUI) and Android (Kotlin, Jetpack
    Compose)
  - React, TypeScript, Node.js, GraphQL, PostgreSQL, RedwoodJS,
    AWS (core platform, for API/backend context)
  - OpenAI API

  💸 Compensation and benefits

  Compensation within the posted salary band will be
  commensurate with experience. All offers will include:

  - Competitive base salary.
  - Equity / stock options.
  - Medical, dental, and vision insurance.
  - 401(k) program.
  - Flexible PTO.



