  Our Calibration Solutions portfolio uses the principles of
  advanced metrology to enable customers to measure and
  calibrate critical parameters in applications such as
  Environmental and Process Monitoring, Dialysis, Gas Flow,
  Air Quality, and Torque Testing.

  Job Summary

  The Software Development Engineer (SDE) responsible for
  designing, developing, testing, and maintaining software
  applications and systems that drive the business forward.
  Works collaboratively with cross-functional teams to deliver
  innovative solutions, ensuring high-quality code,
  scalability, and performance.

  Duties/Responsibilities

  Software Design & Development

  - Develop, test, and maintain software applications and
    systems, following best practices in coding, design
    patterns, and software architecture.
  - Collaborate with other engineers and product teams to
    understand requirements and translate them into technical
    solutions.
  - Write clean, maintainable, and efficient code in Go, Python,
    JavaScript, and TypeScript.
  - Design, develop, and maintain RESTful APIs, backend
    services, and distributed applications.
  - Design and implement software features, modules, and APIs to
    meet functional and non-functional requirements.
  - Design and optimize PostgreSQL and TimescaleDB database
    schemas, SQL queries, indexes, and data models.
  - Develop software capable of processing real-time and time-
    series data while ensuring scalability, reliability, and
    performance.

  Collaboration & Teamwork

  - Work closely with product managers, designers, and other
    stakeholders to define software specifications and
    features.
  - Participate in code reviews, providing constructive feedback
    to peers while maintaining high-quality coding standards.
  - Collaborate with cross-functional teams to integrate
    software with various systems and services.
  - Leverage AI-assisted development tools such as Claude,
    GitHub Copilot, ChatGPT, or similar large language model
    (LLM) tools to improve productivity while ensuring all
    generated code is reviewed, tested, and meets engineering
    quality standards.

  Testing & Quality Assurance

  - Write unit tests, integration tests, and end-to-end tests to
    ensure the quality, reliability, and performance of
    software applications.
  - Participate in debugging, troubleshooting, and resolving
    software defects and performance issues.
  - Ensure that software is scalable, secure, and optimized for
    performance.
  - Develop automated API and integration tests and participate
    in continuous integration testing.

  Software Optimization & Maintenance

  - Continuously improve software performance, efficiency, and
    user experience.
  - Monitor production systems, diagnose issues, and implement
    necessary fixes and improvements.
  - Perform regular code refactoring and software upgrades as
    needed.
  - Optimize database performance, application responsiveness,
    and cloud resource utilization.

  Documentation

  - Create and maintain clear, comprehensive documentation for
    both developers and end-users.
  - Document software design, code changes, and testing
    procedures to ensure knowledge transfer within the team.
  - Create and maintain API documentation, architecture
    documentation, and technical implementation guides.

  Research & Innovation

  - Stay up to date with emerging trends in software
    development, tools, and technologies.
  - Propose new techniques, tools, and best practices to improve
    software development processes and productivity.
  - Evaluate emerging AI development tools, frameworks, and
    automation technologies to improve engineering efficiency
    and software quality.

  Agile Development

  - Participate in agile development cycles, including sprint
    planning, daily standups, and retrospectives.
  - Work within defined timelines and milestones, managing tasks
    and priorities effectively.
  - Collaborate with DevOps and QA teams to support continuous
    integration and continuous delivery (CI/CD) practices.

  Experience/Education

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field.
  - Minimum of 2 years in software development, working with
    modern software engineering practices.
  - Experience developing commercial software applications using
    Go, Python, JavaScript, TypeScript, or comparable modern
    programming languages is preferred.

  Knowledge & Skillsets Required

  - Proficiency in software engineering principles including
    algorithms, data structures, object-oriented design, and
    design patterns.
  - Strong understanding of software development methodologies
    (Agile, Scrum, etc.) and version control systems (e.g.,
    Git).
  - Experience developing software using Go, Python, JavaScript,
    and TypeScript.
  - Experience designing and consuming RESTful APIs.
  - Experience with PostgreSQL, SQL development, database
    design, and query optimization.
  - Experience with TimescaleDB or other time-series databases
    is preferred.
  - Experience with cloud computing platforms (e.g., AWS, Azure,
    Google Cloud) is a plus.
  - Familiarity with containerization technologies (e.g.,
    Docker, Kubernetes) is a plus.
  - Knowledge of CI/CD processes and tools (e.g., Jenkins,
    GitLab CI).
  - Experience using AI-assisted software development tools such
    as Claude, GitHub Copilot, ChatGPT, or similar LLM-based
    coding assistants.
  - Strong analytical and problem-solving skills.
  - Excellent communication skills, with the ability to convey
    complex technical concepts to non-technical stakeholders.
  - Ability to work collaboratively in a fast-paced, team-
    oriented environment.
  - Strong attention to detail and the ability to prioritize
    tasks effectively.

