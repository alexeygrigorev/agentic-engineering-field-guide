description: |
  Frontend Software Engineer — Secure Mission Systems

  Location: Mainly remote, with onsite work in Laurel,
  Maryland, typically one day approximately every six weeks
  for team-wide sprint planning Clearance: Active final DoD
  Secret clearance required

  Build Secure Software for High-Impact Defense Missions

  Build secure, interactive software that helps users
  understand complex information, evaluate options, and
  support mission-planning decisions.

  As a Frontend Software Engineer at Rackner, you will develop
  modern application features for secure mission-planning and
  decision-support software. You will build responsive user
  interfaces using React and TypeScript, support geospatial
  visualization using Cesium, and connect frontend components
  to services built with FastAPI and Flask.

  This role gives you broader ownership than isolated
  interface tickets. You will contribute across application
  development, API integration, automated testing, secure
  software delivery, documentation, and technical reviews
  while working with experienced software, AI/ML, security,
  platform, and customer engineering teams.

  This position is contingent upon contract award and final
  customer approval.

  What You’ll Do

  - Design, develop, test, and integrate frontend software
    features.
  - Build responsive user interfaces using React and TypeScript.
  - Develop map-based and geospatial visualization features
    using Cesium.
  - Connect frontend components to APIs and services built with
    FastAPI and Flask.
  - Turn complex mission and technical information into clear,
    usable workflows.
  - Present application data and AI-enabled outputs in ways
    users can understand and use.
  - Work within GitLab and OpenShift-based development
    environments.
  - Apply secure software-development practices throughout
    implementation and testing.
  - Write and maintain automated unit and integration tests.
  - Participate in code reviews, technical reviews, and design
    discussions.
  - Document application workflows, design decisions,
    interfaces, and test results.
  - Collaborate with backend, AI/ML, security, platform,
    DevSecOps, and customer engineering teams.

  What You’ll Bring

  - Bachelor’s degree in Computer Science or a related field.
  - At least four years of professional software-development
    experience.
  - Hands-on experience building frontend applications with
    React and TypeScript.
  - Using Cesium or CesiumJS for map-based or geospatial
    application features.
  - Working with FastAPI and Flask in support of frontend-to-
    backend integration.
  - Experience working with GitLab-based development workflows.
  - Developing or deploying software in OpenShift environments.
  - Understanding of secure software-development lifecycle
    practices.
  - Writing and maintaining automated tests.
  - Ability to write clear, maintainable, and testable code.
  - Clear technical documentation and communication skills.

  Experience That Can Strengthen Your Fit

  Experience with several of the following can improve
  alignment, but deep expertise in every area is not expected:

  - Cesium, CesiumJS, or another geospatial or mapping framework
  - Map-based, spatial, or data-visualization applications
  - OpenShift, Kubernetes, or another containerized environment
  - GitLab and secure CI/CD workflows
  - FastAPI, Flask, Python, or API development
  - Automated testing and vulnerability remediation
  - Defense, aerospace, command-and-control, or mission-planning
    software
  - Frontend integration of AI-assisted recommendations or
    decision-support capabilities

  Why Rackner

  At Rackner, you will have the opportunity to build secure
  technology that supports critical defense and public-sector
  missions.

  You will work on more than isolated frontend requirements.
  This role brings together hands-on software development,
  interactive data experiences, secure delivery, API
  integration, and close collaboration across frontend,
  backend, AI/ML, security, platform, and mission-focused
  teams.

  Rackner has delivered more than $30 million in recent
  federal awards and supports mission-critical work across
  defense, civilian, and public-sector environments. We are
  looking for a Frontend Software Engineer who can build on
  that momentum by making complex information easier to
  understand, navigate, and act on.

  Benefits & Professional Growth

  - Competitive compensation
  - Company-supported certifications aligned with current and
    future program work
  - 401(k) with 100% company match up to 6%
  - Medical, dental, vision, life, and disability coverage
  - Paid time off and company holidays
  - Remote-work support and home-office equipment plan
  - Fitness and wellness reimbursement
  - Weekly pay schedule
  - Professional-development and future growth opportunities

  Apply

  If you are a frontend engineer who wants to expand your
  impact across secure software, modern React and TypeScript
  development, data-rich interfaces, and mission-focused
  applications, we would like to hear from you.
