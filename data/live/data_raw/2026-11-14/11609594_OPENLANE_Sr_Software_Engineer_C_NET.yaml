description: |
  Who We Are:

  At OPENLANE we make wholesale easy so our customers can be
  more successful.

  We’re a technology company building the world’s most
  advanced—and uncomplicated—digital marketplace for used
  vehicles.

  We’re a data company helping customers buy and sell smarter
  with clear, actionable insights they can understand and use.

  And we’re an innovation company accelerating the future of
  wholesale remarketing through curiosity, collaboration, and
  an entrepreneurial spirit.

  Our Values:

  Driven Waybuilders. We pursue challenges that inspire us to
  build, create, and innovate.

  Relentless Curiosity. We seek to understand and improve our
  customers’ experience.

  Smart Risk-Taking. We transform risk into progress through
  data, experience, and intuition.

  Fearless Ownership. We deliver what we promise and learn
  along the way.


  Location: Remote-North America (EST preferred)

  We’re Looking For:

  We are seeking a Sr. Software Engineer with experience in
  building scalable, cloud-native APIs with .NET, preferably
  Core / Java / Kotlin. You will be part of an Enterprise
  Technology Services team responsible for constructing and
  maintaining high-value core system components. You will be
  involved in the continuous improvement of core offerings,
  leading technical discussions on software architecture and
  testing, and collaborating with cross-functional teams. In
  this role, you will have the opportunity to use your
  experience in application development, front-end JavaScript
  frameworks, telemetry, and performance tuning. The ideal
  candidate will have 5+ years of experience in relevant
  areas.

  You Are:

  - Detail-oriented. You will ensure the quality of the product
    through code reviews and a high level of unit and
    functional test coverage.
  - Relentlessly Curious. You are constantly learning and
    seeking ways to improve yourself and the processes around
    you.
  - Supportive. You enjoy mentoring and supporting other team
    members by conducting code reviews and applying your
    experience in process and technical leadership.
  - Confident. You not only love to code, but you're also
    excellent at it!

  You Will:

  - Continuously work on enhancing core offerings.
  - Lead technical discussions on software architecture and
    testing to ensure that we do not compromise on quality and
    performance.
  - Collaborate with cross-functional teams to construct and
    maintain high-value core system components, leveraging
    multiple technology stacks.

  Core Tech Stack:

  - .NET Core
  - PostgreSQL
  - Kubernetes in AWS
  - OpenTelemetry

  Must Have’s:

  - 5+ Years of experience building scalable, cloud-native APIs
    with .NET
  - University degree or advanced diploma in a software
    engineering-related discipline, preferably in Computer
    Science, or equivalent experience.
  - Experience with telemetry and performance tuning leveraging
    modern APM tooling.
  - A strong understanding of application development, including
    development and testing methodologies.

  Nice to Have’s:

  - Experience with Amazon Web Services (AWS).
  - Experience with Kubernetes and OpenTelemetry
  - Experience building cloud-native APIs with Java
  - Experience with Azure Cloud Services

  What We Offer:

  - Competitive pay
  - Medical, dental, and vision benefits with employer HSA
    contributions (US) and FSA options (US)
  - Immediately vested 401K (US) or RRSP (Canada) with company
    match
  - Paid Vacation, Personal, and Sick Time
  - Paid maternity and paternity leave (US)
  - Employer-paid short-term disability, long-term disability,
    life insurance, and AD&D (US)
  - Robust Employee Assistance Program
  - Employer paid Leap into Service Day to volunteer
  - Tuition Reimbursement for eligible programs
  - Opportunities to expand your skill set and share your
    knowledge across a publicly traded, global organization
  - Company culture of internal promotions, diverse career
    paths, and meaningful advancement

  Sound like a match? Apply Now - We can't wait to hear from
  you!


  Compensation Range of

  Annual Salary: $112,000.00 - $155,000.00

  (Depending on experience, skill set, qualifications, and
  other relevant factors.)
