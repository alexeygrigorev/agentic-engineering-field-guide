description: |
  The Mission 💪

  Our mission is to ensure that no one in the world has to
  suffer from a treatable skin disease because of an access
  issue ever again.

  About Honeydew 👋

  Honeydew is building a platform for hundreds of millions of
  people globally to access expertise and science-backed skin
  treatments, from prescription to retail. Our tech-forward
  dermatology experience helps people with chronic skin
  conditions access licensed specialists, FDA-approved
  treatment, and ongoing support in record time. Honeydew is
  the future of skin health — digitally native, scientifically
  rooted, integrated end-to-end, and powered by AI.

  The Opportunity 📈

  Honeydew's Operations Experience engineering team has more
  to build than it can ship today, because the person leading
  it is also doing the work. As Engineering Manager, you'll
  take ownership of the team's plans, delivery, and people — a
  tech lead, engineers, and contractors — so the team can ship
  more, predictably, against our 2027 objectives. You'll also
  shape what the team becomes: its structure, its headcount,
  and its hiring plan.

  What You'll Build (Your First 6 Months) 🛠

  - Team ownership: 1:1s with every team member by day 15,
    ownership of the team's planning and delivery by day 60,
    and a written growth plan for each engineer by day 90
  - Better delivery: baseline cycle time, throughput, and
    deployment frequency by day 60, then improve at least two
    of them by 20% or more by day 180, while hitting roadmap
    commitments each quarter
  - A vision for the team through 2027: by day 120, an inventory
    of planned operations projects and the capacity they need;
    by day 180, a written vision covering team structure,
    headcount, and hiring plan

  How You'll Make an Impact

  Lead the team. You'll manage the Operations Experience
  engineering team, including contractors, running regular
  1:1s, giving direct feedback, and growing each person.

  Own delivery. You'll own the team's plans, efforts, and
  outputs, take part in all agile ceremonies and the planning
  and design sessions for operations feature work, and keep
  the team shipping predictably, surfacing risks and tradeoffs
  early.

  Partner across the company. You'll work with other
  Engineering Managers, Product Managers, and Product and
  Engineering leadership on feature plans and execution.

  Shape what's next. You'll plan how the team grows through
  2027, from structure to hiring.

  What We're Looking For

  The Non-Negotiables:

  - People management and hard conversations — a proven track
    record of giving direct feedback, managing performance
    (including underperformance), and growing engineers,
    across seniority levels and employment models, from a tech
    lead to contractors, with clear communication up and down
  - Delivery ownership — you turn priorities into a plan, keep
    the team shipping predictably, and surface risks and
    tradeoffs early, so the team is never the bottleneck
  - Cross functional collaboration — you can work across
    multiple teams and verticals to drive results
  - Technical depth — enough to understand our systems, judge
    the tradeoffs in technical plans, hold the quality bar,
    and earn the respect of senior engineers; you don't need
    to be the best coder on the team

  The Nice-to-Haves:

  - 3+ years of experience managing an engineering team
  - Experience with our tech stack. React, Node, AWS, SQL
  - Player coach mentality, willing to roll up sleeves and code

  You'll Thrive Here If…

  - You give direct feedback, and you receive it well
  - You keep a team shipping without becoming its bottleneck
  - You can say no to work the team doesn't have the capacity to
    take on
  - You grow people deliberately, with a plan, not by accident
  - You partner easily with Product and leadership, and know
    when to push back, rather than working in a silo

  Why Honeydew?

  Real Ownership:

  You'll own a team's plans, delivery, and people — this isn't
  a role where accountability disappears into a committee.

  Mission-Critical Work:

  The faster your team ships, the sooner the tools our
  operations teams rely on get better, and the sooner patients
  get care.

  Total Rewards:

  Competitive pay, equity, health benefits, and a fully remote
  role, plus employee perks and recognition programs.
