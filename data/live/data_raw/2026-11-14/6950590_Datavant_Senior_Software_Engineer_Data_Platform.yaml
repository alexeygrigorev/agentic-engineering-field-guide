description: |
  Datavant is a data platform company and the world’s leader
  in health data exchange. Our vision is that every healthcare
  decision is powered by the right data, at the right time, in
  the right format.

  Our platform is powered by the largest, most diverse health
  data network in the U.S., enabling data to be secure,
  accessible and usable to inform better health decisions.
  Datavant is trusted by the world’s leading life sciences
  companies, government agencies, and those who deliver and
  pay for care.

  By joining Datavant today, you’re stepping onto a high-
  performing, values-driven team. Together, we’re rising to
  the challenge of tackling some of healthcare’s most complex
  problems with technology-forward solutions. Datavanters
  bring a diversity of professional, educational and life
  experiences to realize our bold vision for healthcare.

  What We’re Looking For

  At Datavant we are excited to meet engineers who problem
  solve, build, and understand the methodologies and
  underlying concepts of software engineering. As an
  experienced leader of projects, teams and initiatives, you
  will join the team with the autonomy and decision rights to
  immediately begin shaping our healthcare data ecosystem for
  our clients. Our goal is to connect the world’s health data
  and as a Senior Software Engineer you will work on the
  architecture and design level solutioning of our product
  while also driving implementation and helping to mentor
  other team members. If you are looking for a rapidly growing
  engineering team focused on delivering meaningful impact
  through innovative technology solutions, this is the team
  and role for you!

  What You Will Do

  - Lead design, implementation and own end to end development
    of your products
  - Guide and mentor other engineers while developing cutting-
    edge solutions for our health data ecosystem
  - Own multiple projects, conduct code reviews, translate
    product requirements to the team, and act like an owner
  - Drive innovation and deliver valuable data solutions for our
    clients
  - Work with our modern tech stack including Python, Java,
    Spark, AWS and more
  - Help contribute to our awesome tech blog - click here to
    check it out!

  What You Need to Succeed

  - 6+ years of experience writing production-ready code,
    performing code reviews, and working on full stack design
    and architecture of applications
  - Experience with Java
  - Experience with AWS tech stack, Kafka, SQL, Cassandra, Redis
    or similar technologies.
  - Experience with Scala and Big data technologies (Spark,
    Delta) would be a plus
  - Experience with Databricks would be a plus.
  - Exceptional ability to write production-ready code and build
    scalable data flows
  - Readiness to thrive and communicate with your team and
    collaborate with others in a fast-paced environment
  - Demonstrated experience owning projects, migrations, and
    leading from the front
  - Excitement, passion and curiosity about our mission of
    connecting the world’s health data and improving patient
    outcomes

