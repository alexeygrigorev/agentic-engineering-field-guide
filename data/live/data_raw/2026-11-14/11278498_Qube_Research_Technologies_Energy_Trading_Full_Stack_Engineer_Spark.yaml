description: |
  QRT is a global quantitative and systematic investment
  manager, operating across all liquid asset classes. We are a
  data- and technology-driven organization applying scientific
  methods to investing. Our collaborative culture and focus on
  innovation enable us to solve complex challenges and deliver
  high-quality returns for our investors. The Spark Team
  builds and supports the energy trading business, which is
  active globally across gas, power and emissions markets. The
  Spark platform encompasses the purchase and sale of physical
  commodities and associated derivatives, the nomination of
  volumes to pipelines and transmission networks, and the
  ongoing management of the resulting positions and risk.

  Your future role within QRT We are seeking a Full Stack
  Engineer to work in close collaboration with the trading
  desk and wider business, translating requirements into
  delivered functionality across the full breadth of the Spark
  platform. The successful candidate will assume
  responsibility for work from end to end. The role is
  expected to involve the following activities:

  - Engage directly with traders, operations staff and other
    business users to understand their requirements and shape
    them into deliverable work.
  - Implement features end to end across the Spark platform,
    encompassing interfaces, data models and the screens upon
    which users depend.
  - Extend the platform to support new trading locations,
    markets and products as the business expands.
  - Maintain and improve the existing estate as a long-lived
    production system.
  - Contribute alongside colleagues to the platform’s technical
    direction and the standard of the codebase.
  - Take genuine ownership of work from the first conversation
    through to production.
  - Work within a small team that maintains high engineering
    standards, with limited process between the engineer and
    deployment.

  Your present skillset

  - Substantial commercial experience in the design and delivery
    of full stack applications.
  - Strong command of programming and computer science concepts,
    preferably in a low-level language.
  - Proficiency in modern browser-based JavaScript, including ES
    modules, web components and data-intensive interfaces.
  - Sound working knowledge of SQL and relational and analytical
    databases.
  - Demonstrable ability to work directly with non-technical
    colleagues and translate an imprecise request into a clear
    and testable requirement.

  Desirable to have experience or a willingness to learn in
  the following areas

  - Python, Rust, JavaScript and HTML.
  - AWS and the deployment of distributed environments.
  - ClickHouse or another columnar or analytical database.
  - AG Grid or comparable data-grid technologies.
  - Front-end frameworks, including Alpine.js and FAST Element
    web components.
  - Commodities, energy or financial markets. Prior exposure is
    advantageous but not required, as the domain can be
    taught.

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
