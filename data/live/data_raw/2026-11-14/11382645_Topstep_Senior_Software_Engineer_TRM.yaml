description: |
  Summary As a Senior Software Engineer on Topstep's TRM
  Engineering team, you'll build the products funded traders
  and our internal teams use every day: the trader-facing web
  experience, account and onboarding flows, payments and
  payouts, and the internal tooling the business runs on. We
  help new and experienced traders through training, insights
  into their trading patterns, and a smooth path to their
  payouts, and the systems behind that experience need to be
  reliable, secure, and easy to change as we grow.

  You'll work primarily in TypeScript across Node.js and
  React, building cloud-native applications on AWS. Beyond
  shipping features, you'll own work end to end from design
  through production, raise the bar on code quality and
  engineering patterns across the team, and help make sure our
  systems scale safely as usage and complexity increase.

  This role is ideal for an engineer who wants real ownership
  of systems that directly shape the trader experience, and
  who cares as much about how software runs in production as
  how it's written.

  Key Responsibilities

  - Design, build, and operate full stack features end to end,
    from technical design through deployment and production
    support, with an emphasis on reliability, safe
    deployments, and operational simplicity.
  - Partner with Product and Design during discovery to shape
    scope, surface technical trade-offs early, and provide
    credible estimates.
  - Write technical designs for significant work and guide
    architecture decisions within your area, in partnership
    with your Engineering Manager and fellow senior engineers.
  - Build automated testing, observability, and operational
    ownership into every stage of delivery.
  - Raise the team's engineering bar through thoughtful code
    review, mentoring, and contributing to shared standards
    and patterns.
  - Proactively identify and resolve issues across the stack,
    keeping our systems stable, performant, and ready to grow.
  - Participate in the on-call rotation and incident follow-
    through, turning production issues into lasting fixes.
  - Use AI-assisted development tools effectively and
    responsibly, within Topstep's standards for AI-built
    software.

  Required Qualifications and Key Competencies

  - 5+ years of experience building and operating production-
    grade systems with user-facing APIs, with demonstrated
    impact on scalability and reliability.
  - Strong full stack foundation: backend development in
    TypeScript and Node.js with solid API design (REST,
    GraphQL), and modern frontend development in React and
    Next.js.
  - Experience designing and operating distributed systems,
    including event-driven architectures, message queues,
    eventual consistency, and concurrency and race-condition
    handling, with a strong focus on performance, security,
    and maintainability.
  - Strong database fundamentals with PostgreSQL or SQL Server,
    including schema design, migrations, indexing, and query
    optimization.
  - A production mindset and bias toward action, embracing
    metrics, logging, tracing, on-call participation, and end-
    to-end ownership of delivery.
  - Excellent communication skills, with the ability to explain
    complex technical concepts to a range of audiences and
    work well with Product, Design, and QA.

  Preferred Qualifications

  - Background in financial technology or highly regulated
    spaces where precision, traceability, and regulatory
    standards drive engineering decisions.
  - Practical expertise with payment gateways, billing
    infrastructures, or authentication and user identity
    services.
  - Hands-on familiarity with AWS services, container
    orchestration (Docker, Kubernetes), and modern deployment
    pipelines using Argo CD or GitHub Actions.
  - Proven capability leveraging AI developer tooling
    effectively while upholding rigorous standards for code
    health and maintainability.
  - Track record of delivering high-scale, end-user applications
    with a sharp focus on intuitive product design.

  Company Culture & Perks

  - Topstep is an engaging working environment which ranges from
    fully remote to hybrid. We foster a culture of
    collaboration with cameras on during meetings and a robust
    Slack environment for communication.
  - Seven Company-paid Holidays and generous Family Leave. Paid
    time off is front-loaded.
  - Competitive 401(k) matching, health, dental, and vision
    insurance is offered for full time employees.
  - Vacations are encouraged with a bonus for taking 5
    consecutive days. Employee referrals are bonused. Topstep
    offers a food and groceries budget and contributes towards
    health and wellness.

  New Hire Base Salary Range

  - $155,000 - $200,000k annually.
  - Bonus: This position is eligible for a performance-based
    bonus as provided by the plan terms and governing
    documents.
  - The compensation offered will take into account internal
    compensation structure and may vary depending on the
    candidate's geographic region, job-related knowledge,
    skills, and experience among other factors.

  Equal Opportunity Employer

  Topstep is an Equal Opportunity Employer. We are committed
  to fostering an inclusive environment where all employees
  and applicants are valued. All qualified candidates will
  receive consideration for employment without regard to race,
  color, religion, gender, gender identity or expression,
  sexual orientation, national origin, age, disability, or
  veteran status, in compliance with applicable federal,
  state, and local laws.

