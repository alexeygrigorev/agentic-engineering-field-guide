description: |
  At Rula, we are a remote-first company that believes mental
  health is just as important as physical health. We recognize
  that mental health issues can be complex and multifaceted,
  and we are dedicated to treating the whole person, not just
  the symptoms.

  We aim to create a world where mental health is no longer
  stigmatized or marginalized, but rather is embraced as an
  integral part of one's overall well-being.

  We believe that by providing quality care that is both
  evidence-based and compassionate, we can empower individuals
  to take charge of their mental health and achieve their full
  potential. We are passionate about making a positive impact
  on the lives of those struggling with mental health issues
  and we strive to be a force for positive change in the field
  of mental healthcare.

  About the Role

  As a Fullstack Senior Software Engineer at Rula, you'll
  spend your days designing and scaling robust systems within
  an autonomous, cross-functional team that values high
  ownership, rapid iteration, and technical excellence.
  Joining the Partnerships org, whose mission is to drive
  patient starts through strategic collaborations with payers,
  providers, health systems, PCPs, employers, brokers, and
  other partners, you'll report to an Engineering Manager and
  build software that expands our addressable population,
  enables seamless access to care, and positions Rula as a
  differentiated strategic partner to the employers and EAPs
  we work with.

  The Employer & EAP team owns the technology behind two of
  Rula's fastest-growing channels: direct-to-employer mental
  health benefits and Employee Assistance Programs (EAP). On
  the employer side, you'll build and scale the Employer
  Portal — the self-service product that lets HR and benefits
  leaders launch awareness campaigns, manage rollouts, and
  track utilization for the mental health benefit they've
  extended to their employees. On the EAP side, you'll work
  across the patient and provider experience to support
  employer-funded, short-term therapy benefits — session
  eligibility, authorization, and billing — so members can
  access free, pre-authorized care without friction. This is a
  unique opportunity to own a full-stack product surface end
  to end, from employer-facing tools to the patient and
  provider flows that deliver on the benefit, with a direct
  and measurable impact on how many people get connected to
  care.

  Required Qualifications

  - 5+ years of professional software development experience,
    with a proven track record of building and scaling web
    applications in a production environment.
  - Proven experience leading high-priority technical projects
    from conception to delivery, including the ability to
    navigate trade-offs and align stakeholders.
  - A passion for fostering a high-performing engineering
    culture through code reviews, technical documentation, and
    mentoring peers.
  - Deep expertise in modern full-stack technologies—ideally
    TypeScript, React, and Node.js—along with a strong grasp
    of functional and object-oriented programming.
  - Proficiency in leveraging AI-assisted development tools
    (e.g., Claude Code, Cursor, or GitHub Copilot) to
    accelerate delivery velocity, automate boilerplate, and
    enhance code quality.
  - Demonstrated ability to design and implement complex,
    distributed systems that are scalable, maintainable, and
    secure.

  Preferred Qualifications

  - 4-6 nice-to-have qualifications that will make candidates
    stand out, they can be subjective. Remember, these are
    attributes that are not mandatory but would be beneficial
    to the individual’s success in the role. All
    qualifications must be assessable in an interview process
    at Rula..
  - Hands-on experience developing or integrating LLM-based
    features or agentic workflows into production
    applications.
  - Strong familiarity with cloud-native infrastructure
    (AWS/GCP), containerization (Docker/Kubernetes), and CI/CD
    pipeline optimization.
  - Previous experience thriving in a fast-paced, high-growth
    startup environment where you’ve helped scale an
    engineering organization.
  - Advanced knowledge of database design and performance tuning
    for both relational (PostgreSQL) and non-relational data
    stores.

  We're serious about your well-being! As part of our team,
  full-time employees receive:

  - 100% remote work environment: Working hours to support a
    healthy work-life balance, ensuring you can meet both
    professional and personal commitments (must be based in
    United States, currently not hiring in Hawaii)
  - Attractive pay and benefits: Full transparency of pay ranges
    regardless of where you live in the United States
  - Comprehensive health benefits: Medical, dental, vision,
    life, disability, and FSA/HSA
  - 401(k) plan access: Start saving for your future
  - Generous time-off policies: Including 2 company-wide
    shutdown weeks each year for self-care (for most
    employees)
  - Paid parental leave: Available for all parents, including
    birthing, non-birthing, adopting, and fostering
  - Employee Assistance Program (EAP): Supporting your mental
    and physical health
  - Quarterly department stipend: Fun team-building activities
    or in-person gatherings
  - Community and employee resource groups: Participate in
    groups that celebrate employee identity and lived
    experiences, fostering a sense of community and belonging
    for all
  - Home office stipend: New hire home office stipend & $50
    monthly stipend to help cover internet or cell phone
    expenses
  - Wellness at Rula program: Year-round wellness initiatives
    and a $50/month wellness stipend

  Our team

  We believe that diversity, equity, and inclusion are
  fundamental to our mission of making mental healthcare work
  for everyone.  We are dedicated to having a culture of
  inclusion that will support our employees in feeling safe,
  seen, heard, and valued.
