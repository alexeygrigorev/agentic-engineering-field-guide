description: |
  Software Engineers at QuantCo will build robust and scalable
  solutions with tangible impact. With full ownership, they
  will design end-to-end solutions that integrate our
  industry-leading models into our clients’ businesses. As
  owners of the process and the code base, they will be
  responsible for the whole engineering project cycle from
  high-level system design and prototyping to application
  development and data integration. In this role, they will
  bridge the worlds of IT infrastructure and data science.
  They will work with our clients to understand their
  technical setups and solicit constant feedback from both
  clients and colleagues to improve our products with rapid
  iteration cycles. As such, they will ensure that our
  solutions provide continuous value to our clients.

  We are looking for team players with an entrepreneurial
  mindset and:

  - Ability to write clean, effective, and production-ready code
  - Expert-level proficiency with developing services in Python
  - Familiarity with backend frameworks like Django / Flask /
    FastAPI, and packaging these services in the Python
    ecosystem
  - In-depth knowledge of SQL with brief experience in polars or
    pandas
  - Experience with OS-independent, cross-platform development,
    and deployment by using modern CI/CD techniques
  - Passion to work effectively in interdisciplinary teams of
    technical and non-technical individuals with different
    cultural backgrounds on health-related (business) problems
  - Business proficiency in English. Conversational proficiency
    in German is beneficial, but not required
  - Understanding of how technical decisions impact end-users
  - Willingness to travel when necessary

  What we offer



  You will be part of a smart, motivated, and driven team that
  revels in working on challenging problems and finding novel
  solutions; values our customers and users; and strives to
  deliver thoughtful and impactful products. You will be
  surrounded by people that respect each other and the
  contributions each of us brings. We offer a generous
  compensation package that includes a base salary, bonus,
  stock options, and relocation support along with additional
  location-based benefits.

  About QuantCo

  At QuantCo, we leverage expertise in data science,
  engineering, and economics to help organizations turn data
  into decisions. Started by 4 PhDs from Harvard and Stanford,
  we are now more than 180 professionals with extensive
  quantitative, engineering, and business experience. We are
  globally distributed with offices in Berlin, Boston,
  Cologne, Karlsruhe, London, Munich, San Francisco, and
  Zurich.



  Our solutions include algorithmic pricing, data-driven
  claims management, and high-dimensional forecasting systems.
  Our customers include some of the largest financial, retail,
  and healthcare organizations in the US and Europe. We impact
  core business processes and decisions by combining advanced
  data-driven insights with scalable engineering solutions.



  We are excited about writing mission-critical code that
  affects millions of people and impacts billions of dollars.
  If you feel the same way, we look forward to hearing from
  you.
