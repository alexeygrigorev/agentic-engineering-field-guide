description: |
  HHAeXchange is the leading technology platform for home and
  community-based care. Founded in 2008, HHAeXchange was
  created to build a complete, end-to-end homecare solution
  that helps people who are aging or have disabilities live
  well in their homes and communities. Our employees work to
  transform healthcare by building one homecare platform that
  connects patients, personal care providers, managed care
  organizations, and states.

  The Staff Software Engineer is an experienced, hands-on
  full-stack engineer who leads technical work within one team
  or one service area. This role does not manage people. It
  leads through strong engineering, clear design documents,
  and mentoring.

  The engineer designs, builds, tests, and supports features
  across the application: C# and .NET services and APIs,
  TypeScript and Angular user interfaces, and relational
  database work on SQL Server and PostgreSQL. The software
  runs on Amazon Web Services (AWS) and exchanges healthcare
  data using industry standards. The engineer works in a
  regulated environment and protects protected health
  information (PHI) in all of their work.

  To perform this job successfully, an individual must be able
  to perform each essential job duty satisfactorily.
  Reasonable accommodations may be made to enable individuals
  with disabilities to perform the essential functions.

  This position is open to candidate located only within the
  EST or CST time zones within the US.

