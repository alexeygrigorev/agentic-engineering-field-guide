description: |
  Anrok is the leading tax automation platform enabling
  businesses to expand globally without compliance complexity.

  As the digital economy has grown 6x over the last decade,
  software businesses have gone from not worrying about sales
  tax to needing to monitor exposure, calculate rates, and
  file returns across 50 US jurisdictions and 100+ countries.
  This creates a critical bottleneck for companies that should
  be able to transact with customers everywhere.

  Anrok eliminates this complexity by connecting with billing
  and payment systems to automate tax monitoring,
  calculations, and filing end-to-end. Our unified platform
  handles the ever-changing maze of tax laws at municipal,
  state, and federal levels—so companies can focus on growth,
  not compliance.

  Our customers include:

  - 40% of Forbes Top 50 AI companies
  - 20% of Forbes Top 100 Cloud companies
  - Top companies like Notion, Anthropic, and Cursor

  We're making compliant digital commerce a reality for
  companies big and small, backed by over $100M from leading
  investors including Sequoia, Spark, Index, and Khosla
  Ventures.

  As the Engineering Manager for our Product and Agentic
  Platform team, you'll own the shared systems and AI
  infrastructure on which the rest of Anrok builds on. As we
  grow, well-designed platform spanning authn and authz, RBAC,
  FGAC, audit trails and more, along with AI infrastructure is
  the backbone that lets every other team move fast without
  compromising the compliance workflows our customers depend
  on.

  You have the opportunity to drive execution and strategy for
  an exceptional team, help shape the product roadmap, and
  coach and develop senior engineers. We work primarily in
  TypeScript and React, but prior experience is not required.



  In this role, you will

  - Hire, manage, and grow a talented team building the platform
    and AI infrastructure that powers Anrok's product.
  - Set the product and technical strategy, while driving
    processes for high quality execution.
  - Write and review code alongside the engineers on the team as
    needed.
  - Foster a collaborative and healthy culture of feedback,
    opportunity, and growth for the team.
  - Contribute to the Anrok engineering culture and initiatives.
  - Find appropriate uses of AI in both the creation of
    automations or as the automation itself.
  - Help grow the team—mentoring engineers, contributing to
    technical culture, and raising the bar on how we build.

  What excites us

  - 3+ years of experience managing engineering teams, with
    significant experience as a software engineer.
  - Track record of figuring out how to set individuals and
    teams up for success.
  - You enjoy coding and have strong technical acumen to guide
    the team through product and technical decisions.
  - Experience building AI infrastructure—you've built and
    operated the systems beneath LLM-powered or agentic
    products in production, and you understand firsthand what
    makes them reliable and maintainable at scale.
  - A track record of building shared services and components
    that support internal engineering teams—the foundational
    primitives and tooling that the rest of the org builds on,
    designed to make every other team faster.
  - You’re curious and motivated to learn new tools — you've
    experimented with AI in your work or on your own, you're
    excited about what's possible, and you've built something
    with it (an application, a workflow, a creative solution
    to a real problem) that you can walk us through.

  What we offer

  - The equity upside of an early-stage startup with the
    product-market fit of a later-stage company.
  - Daily lunch and snacks for those working out of our office
    hubs.
  - Medical, dental, and vision insurance covered 100%.
  - One Medical membership covered, flexible sick benefits, and
    more.
  - Annual learning and development stipend for books, online
    courses, and conferences, as well as a curious team to
    share your learnings with.
  - Annual team off-sites and in-person opportunities around our
    growing Anrok hubs.
  - Home office setup stipend to ensure you have the equipment
    you need to thrive at work.

  At Anrok, we embrace a dynamic and flexible hybrid work
  environment based out of our growing office hubs - San
  Francisco, New York City, and Salt Lake City where we
  collaborate in-person 3 days per week.

  Please be aware, job-seekers may be at risk of targeting by
  malicious actors looking for personal data. Anrok recruiters
  will only reach out via LinkedIn or email with an anrok.com
  domain. Any outreach claiming to be from Anrok via other
  sources should be ignored.
