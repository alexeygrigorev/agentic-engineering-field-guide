description: |
  About OWL

  Old Well Labs is a Charlotte-based financial intelligence
  startup used by leading allocators and the fund managers
  they invest with. Our platform turns billions of disclosures
  into structured data on 20,000+ funds, 1.4M people, and
  10,000+ LPs — helping customers discover managers, monitor
  their moves, and connect with the right partners.

  About the Role

  We're hiring a Senior Full Stack Engineer to build product
  features end to end as we evolve OWL from a data
  intelligence layer into a network platform, one that sits on
  top of the industry's best dataset and connects the top
  allocators and hedge funds in the world. Each new customer
  makes the network more valuable to the next, and your work
  will directly shape that flywheel.

  You'll work across our React frontend and backend services,
  owning features from idea through production. That means
  understanding the user problem, designing the solution,
  building it, and iterating based on feedback.

  We're also big proponents of using AI to do our best work.
  If you have an idea for a new tool or workflow, we'll move
  quickly to get it on the roadmap. Using AI well across the
  development lifecycle is something we're continuing to get
  better at, and we value everyone's contribution to that
  effort.

  What You’ll Do

  Build the Network Layer

  Design and ship the tooling that turns OWL from a data
  platform into a network: the search, connection, and
  collaboration surfaces that let allocators and managers find
  and engage with each other.

  Own and Deliver Product Features

  Take problems from ambiguous requirements through design,
  implementation, and production across the stack.

  Move Quickly in a Changing Environment

  Work on evolving systems with shifting priorities while
  maintaining a high bar for quality

  Work with Data and Systems that Scale

  Build features on top of large, structured datasets while
  improving performance and reliability as the product grows

  What We’re Looking For

  - 5+ years of experience building production software
  - Strong backend experience in Python (and/or Node.js)
  - Strong frontend experience in React + TypeScript
  - Experience building APIs (REST and/or GraphQL)
  - Solid understanding of relational databases (Postgres) and
    data modeling
  - Experience working in fast-moving or early-stage
    environments with evolving systems and priorities
  - Ability to take ownership and deliver without heavy
    direction

  Tech Stack

  - Languages: Python, Node.js, TypeScript
  - Frontend: React
  - Backend: FastAPI, GraphQL APIs
  - Database: Postgres
  - Infrastructure: AWS
  - DevOps & Tooling: Terraform, GitHub, Datadog
  - AI: OpenAI, Claude, LangSmith

  Location

  Charlotte (Hybrid: Tuesday–Thursday in office)

  Compensation

  - Competitive salary + equity

  Work Authorization

  At this time, OWL is not able to sponsor employment visas.
  Candidates must be authorized to work in the United States
  without sponsorship now or in the future.

  Benefits

  - 100% medical, dental & vision coverage
  - 401k
  - Flexible PTO
  - Parental leave
  - Office in South End
  - Bagel Thursdays
