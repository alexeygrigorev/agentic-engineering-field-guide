description: |
  Software Engineer Location: Remote Position Type: Full-
  Time/Exempt Compensation:  $110,000-$120,000

  Summary BetterRX is a growing software-as-a-service (SAAS)
  company in the healthcare industry looking for a Software
  Engineer to join our Engineering Team! BetterRX is an AI
  forward organization. Many roles will have access and
  responsibilities that are benefitted by AI tools. We use AI
  wherever we can safely and responsibly do so to improve the
  speed and quality of our work. In this role, you will be an
  integral member of a development team building top notch
  software. We are a people-obsessed company on a mission to
  end needless suffering caused by medication delays through
  innovative software solutions that connect every member of
  the patient’s care team. Ideal Candidate You are self-
  motivated, dedicated, and take pride in your code.   You are
  known as a team player, strategic thinker, and an executor.
  You have a gift for building and solving complex problems
  and helping others succeed. Primary Responsibilities

  - Serve as an engineering member on our development (scrum)
    team.
  - Development of new features and improvements to existing
    applications.
  - Participate in code reviews  following our coding standards.
  - Always be learning and improving.
  - Actively participate in refinement and technical meetings.
  - Take pride and ownership of your code.

  Skill Requirements

  - 3 years PHP experience on a professional software
    development team using applicable toolsets
  - Experience using Laravel Framework (Livewire is a plus)
  - 3 years database experience (MySQL preferred)
  - 3 Years JavaScript experience
  - Strong analytical and problem-solving skills
  - Experience Integrating with 3rd party APIs
  - Experience using AI tools for generating code, debugging,
    performing code reviews and testing features.

  Other Requirements

  - Minimum 3+ years of programming experience
  - Ability to effectively work 100% remotely
  - Ability to occasionally travel for internal company summits
    at various locations in the US
  - Occasional customer support escalations require customer and
    vendor communication.
  - BS Degree or equivalent experience preferred.

  Benefits

  - 100% Remote Environment
  - Medical, Dental, Vision, Accidental
  - Company paid: Short Term Disability, Long Term Disability
    and Life Insurance
  - 401k Match after 1 year of tenure (4%)
  - 3 weeks of PTO
  - 5 Wellness Days
  - Closed for 15 Holidays



  Position will be posted until November 30, 2026 or until
  filled.
