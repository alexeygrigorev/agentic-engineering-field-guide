description: |
  About Us

  We're living through a fundamental shift in how people
  discover, evaluate, and purchase products. The next
  generation doesn't respond to traditional marketing -- they
  build relationships with brands through authentic social
  interactions, seek recommendations from communities they
  trust, and expect personalized experiences that feel human,
  not corporate.

  At Nectar, we're building the AI-native social operating
  system that enables this new era of commerce. We believe
  every social interaction should deepen the relationship
  between brands and their communities while creating genuine
  value for both sides.

  Founded by ex-Meta product and engineering leaders, we've
  raised over $30M in total capital from investors including
  GV and True Ventures. We work with brands like Oura Health,
  Caraway, e.l.f. Cosmetics, Kosas, OLIPOP, and many more.
  We're building the future of social commerce -- where
  community, conversation, and commerce converge.

  Who we’re looking for

  We’re hiring a video editor and content producer who can
  originate ideas, build on a rough concept, and carry it
  through to a polished short-form video. Your strengths are
  content ideation, storytelling, and editing, with the taste
  and initiative to shape the hook, script, and final cut
  without needing a fully built-out brief. You can also shoot
  when the idea calls for it.

  Reference Videos

  (we want narrative driven videos like this going out on a
  regular, consistent basis (i.e. 1x/week)

  - https://x.com/a16z/status/2093330303242965464?s=20

  - https://www.vetted.cv/projects/cmnqn2khy000604iccs2pp756
  - https://www.vetted.cv/projects/cmmra2f0w000p04jrax73crtz
  - https://www.instagram.com/reel/Dasqd_YNqhf/?stkn=MWJwOGJlbTl
    kano5cw==

  What you’ll work on

  - Pitch fresh content ideas, develop hooks and scripts, and
    turn loose briefs into clear stories and practical
    production plans.
  - Own the edit from raw material through pacing, color, sound,
    captions, graphics, feedback, and final delivery for
    social, launches, and brand campaigns.
  - Create short-form videos from scripted scenes, case studies,
    interviews, product moments, office content, and existing
    footage.
  - Help plan footage capture when needed, including simple
    camera, lighting, and audio guidance and remote direction
    for the team or filming partners.
  - Combine live action with product captures, screen
    recordings, typography, and motion graphics where they
    strengthen the story.
  - Build repeatable formats and alternate hooks or cuts so we
    can test ideas and improve quickly.

  What you’ll bring

  - A portfolio of strong short-form edits, including work you
    took from a loose idea to a finished video.
  - The ability to generate original content ideas and develop a
    clear angle, hook, and story from limited direction.
  - Comfort shooting on a phone when it’s right for the idea.
    You choose the setup that serves the content.
  - Strong visual storytelling, pacing, comedic timing, sound,
    and instincts for social formats.
  - Confidence directing non-actors, organizing footage and
    project files, and delivering polished work in Premiere
    Pro, DaVinci Resolve, or Final Cut.
  - Proficiency in AI-powered creative workflows and a strong
    working understanding of Higgsfield, including integrating
    AI-generated visuals with live-action footage and using AI
    throughout concepting, preproduction, and postproduction.
  - Deep understanding of short-form video best practices,
    including strong opening hooks, retention-focused pacing,
    platform-native framing, captions, sound, and testing
    different cuts.
  - Advanced motion graphics experience and After Effects
    proficiency, with the ability to create polished
    typography, transitions, compositing, and product
    animations that integrate naturally with live-action
    footage.
  - Bonus: advanced camera and lighting skills, scripted comedy,
    or experience creating for technology brands.
