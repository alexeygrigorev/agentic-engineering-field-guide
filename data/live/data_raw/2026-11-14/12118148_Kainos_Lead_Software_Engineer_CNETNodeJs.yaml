description: |
  Join Kainos and Shape the Future

  At Kainos, we’re problem solvers, innovators, and
  collaborators - driven by a shared mission to create real
  impact. Whether we’re transforming digital services for
  millions, delivering cutting-edge Workday solutions, or
  pushing the boundaries of technology, we do it together.

  We believe in a people-first culture, where your ideas are
  valued, your growth is supported, and your contributions
  truly make a difference. Here, you’ll be part of a diverse,
  ambitious team that celebrates creativity and collaboration.

  Ready to make your mark? Join us and be part of something
  bigger.

  MAIN PURPOSE OF THE ROLE & RESPONSIBILITIES IN THE BUSINESS:
  As a Lead Software Engineer (Consultant) in Kainos, you’ll
  be responsible for leading teams and developing high quality
  solutions which delight our customers and impact the lives
  of users worldwide. It’s a fast-paced environment so it is
  important for you to make sound, reasoned decisions. You’ll
  do this whilst learning about new technologies and
  approaches, with talented colleagues that will help you to
  learn, develop and grow. You’ll manage, coach and develop a
  small number of staff, with a focus on managing employee
  performance and assisting in their career development.
  You’ll also provide direction and leadership for your team
  as you solve challenging problems together. As the technical
  leader in the team, you will also interact with customers,
  share knowledge and mentor those around you.

  MINIMUM (ESSENTIAL) REQUIREMENTS:

  • Expertise in designing, building, testing and maintaining
  modern software applications

  • Technical leadership of teams building and testing modern,
  scalable, secure, performant applications in line with
  software development principles, practices and patterns e.g.
  XP, TDD

  • Experience of technical ownership for a product/software
  project, including architecture, estimation, product
  planning and user story/requirement creation

  • Expertise in software design and development across all
  layers of an application

  • We are passionate about developing people – a demonstrated
  ability in managing, coaching and developing junior members
  of your team and wider community.

  • Experience with the latest Continuous Integration and
  Continuous Delivery techniques

  DESIRABLE:

  • Good communication skills, with the ability to communicate
  issues to technical and non-technical people.

  • Active participation in knowledge sharing activities, both
  within the team and at a wider capability level and
  externally where appropriate.

  • Experience of debugging and troubleshooting live
  applications

  • Experience of multiple programming languages and data
  storage technologies

  • Knowledge of public cloud platforms, such as AWS and
  Azure, including SaaS and PaaS offerings

  Embracing our differences  

  At Kainos, we believe in the power of diversity, equity and
  inclusion. We are committed to building a team that is as
  diverse as the world we live in, where everyone is valued,
  respected, and given an equal chance to thrive.   We
  actively seek out talented people from all backgrounds,
  regardless of age, race, ethnicity, gender, sexual
  orientation, religion, disability, or any other
  characteristic that makes them who they are.   We also
  believe every candidate deserves a level playing field.

  Our friendly talent acquisition team is here to support you
  every step of the way, so if you require any accommodations
  or adjustments, we encourage you to reach out.

  We understand that everyone's journey is different, and by
  having a private conversation we can ensure that our
  recruitment process is tailored to your needs.
