description: |
  Fospha is the measurement system enterprise retail and
  ecommerce brands run their business on. We give marketing
  teams one clear, daily view of what's actually working —
  across every channel and everywhere they sell, from their
  website to Amazon and TikTok Shop — down to the level of a
  single ad or piece of creative. It replaces guesswork and
  gut feel with a number marketing, finance and agencies can
  all trust and act on.

  Brands including Dyson, Gymshark, Adanola and Huel use
  Fospha up to 25 times a day to decide where budget should
  move next. We've spent over a decade building this, with
  more than $40 billion in marketing spend now optimised
  through the platform — and we're scaling fast across London,
  Mumbai and Austin.

  About the role

  Fospha's measurement products run on data pipelines that
  process marketing spend and performance data for brands
  you'll recognise. You'll get exposure across our core data
  engineering workstreams: large-scale SQL/dbt transformation
  pipelines, data ingestion services, and pipelines that turn
  aggregated data into insights served through APIs. You'll
  work alongside data engineers, analysts, and AI agents as
  part of our AI-first operating model, with senior engineers
  supporting you as you build real ownership.

  This role suits a recent graduate (or someone with a strong
  personal/academic project record) who's curious about data
  pipelines and wants to learn by shipping real, production
  code from day one.

  What you'll do

  - Write and maintain dbt models and SQL as part of our
    production data engineering pipelines, learning the
    transformation patterns we build on
  - Help build and maintain Python-based data ingestion
    services, with guidance from senior engineers
  - Contribute to pipelines that move data from ingestion
    through transformation to the APIs that serve it
  - Write clean, tested code and get comfortable with code
    review from both sides — giving and receiving feedback
  - Debug data quality issues systematically, learning to trace
    problems back through the pipeline
  - Get exposure to our cloud infrastructure and understand how
    it supports the pipelines you work on
  - Work with AI agents as part of our AI-first operating model,
    learning to write clear specifications that shape high-
    quality, AI-assisted engineering work
  - Collaborate with data engineers, analysts, and product
    stakeholders to understand what the data needs to support

  The Centre of Excellence

  The Centre of Excellence is Fospha's early-careers programme
  that develops ambitious, high-performing talent through
  focused training, hands-on experience and cross-functional
  exposure. Starting in Data Engineering, you'll gain
  foundational experience while being prepared for future
  opportunities across the organisation. The programme
  operates on the following principles:

  - Individual Responsibility from the Get-go: You will quickly
    be responsible for the success of your work, able to make
    an individual impact early in your career
  - Work alongside SLT at Leading Businesses: You will be
    engaging with Senior Leadership and C-Level executives at
    the leading retail brands, getting exposure to how the top
    companies operate
  - Cross-Functional Exposure: we offer unique opportunities to
    learn from and collaborate with every department in the
    business — many daily
  - Comprehensive Training: In addition to the extensive on-the-
    job learning opportunities, you'll receive a broad and
    blended in-person training curriculum covering essential
    topics such as Business Storytelling, Account Management,
    Market Research & Product and Financial Management
  - Real Mentorship: Regular one-to-ones, feedback, and career
    conversations with people invested in your progression,
    not just your output
  - Career Development: High performers have clear opportunities
    to quickly advance their careers at Fospha — whether
    progressing within Data Engineering toward senior
    technical and/or leadership roles or moving into other
    departments that align with their skills and interests
  - Modern Tools: Hands-on exposure to Gen AI tooling and AI-
    assisted coding (we use Claude Code day-to-day), so you're
    building modern, AI-fluent ways of working rather than
    legacy processes

  What we're looking forEssential

  - A relevant degree (Computer Science, Data Engineering,
    Mathematics, or similar), or equivalent experience through
    internships/placements/personal projects
  - Some experience with SQL and Python
  - Genuine curiosity about how data pipelines work end-to-end,
    not just the code but why the data looks the way it does
  - Comfortable being reviewed and iterating quickly on feedback
  - Confident asking questions and pushing for clarity rather
    than staying blocked

  Nice to have

  - Exposure to dbt or another SQL transformation framework
  - Familiarity with Git/GitHub and PR-based workflows
  - Some exposure to AWS or another cloud environment
  - Experience writing or maintaining automated tests
  - Interest in AI-assisted coding tools (we use Claude Code
    day-to-day)
  - Any exposure to marketing, ecommerce, or advertising data

  What we can offer you

  - Salary: Competitive + bonus
  - A £1,000/year flexible benefits allowance to put towards
    private medical insurance, dental cover, a health cash
    plan, gym membership, extra holiday, or a pension top-up —
    whatever suits you
  - Access to Wellhub, giving you one membership across gyms,
    boutique studios, and wellbeing apps
  - 25 days' annual leave plus 8 UK bank holidays, an extra day
    off for your birthday, and more holiday the longer you
    stay (26 days after 3 years, 27 after 6)
  - Regular socials, free weekly snacks, and Lunch & Learn
    events at our Scale Space office, plus access to the wider
    Blenheim Chalcot community
  - Opportunities to travel — including to our India and North
    America offices
  - Life assurance worth 4x your annual salary

  Why Fospha

  - Real production impact from day one. The pipelines you help
    build feed measurement products used to make real budget
    decisions.
  - A published career framework. No guessing what the next
    level requires or when you'll get there.
  - A team that reviews each other's work properly. Code review
    from people who care about getting the data right.
  - An AI-first operating model where lean, high-autonomy teams
    ship fast and learn faster — with structured mentorship
    from senior engineers as you build that fluency yourself.

  Our Values and Principles

  You will be able to demonstrate examples of our core
  principles:

  - Seek inclusion & diversity: We create an environment where
    everyone feels welcome, and people are encouraged to speak
    and be heard
  - Work Hard, Work Well, Work Together: We take responsibility
    for making things happen, independently and together; we
    help colleagues in need and close loops, making sure our
    work is complete and has lasting impact
  - Grow: We are proactive, curious and unafraid of failure
  - Customer at the heart: We care about the customer, feel
    their pain and love building product that solves their
    biggest problems
  - Candour with caring: We deliver candid feedback with
    kindness and receive it with gratitude

  By submitting your CV you understand that we have a
  legitimate interest to use your personal data for the
  purposes of assessing your eligibility for this role.  This
  means that we may use your personal data to contact you to
  discuss your CV or arrange an interview, or transfer your CV
  to the hiring manager(s) of the role you have applied for.
  You can ask us at any time to remove your CV from our
  database by emailing recruitment@blenheimchalcot.com – but
  please note that this means we will no longer consider you
  for the role you have applied for. You can review our
  privacy policy here.
