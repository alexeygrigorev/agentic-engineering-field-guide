description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We are looking for a passionate Senior Backend Software
  Engineer to join the Personal & Business Pricing Team.

  Pricing is core to Wise's mission of transparency. This role
  offers an opportunity to have a direct and measurable impact
  on a domain that is central to Wise's growth. Personal &
  Business Pricing sits at the intersection of nearly every
  product launch and promotion at Wise. We build the
  infrastructure and tooling for pricing across Wise products.
  You'll work in a highly collaborative environment and gain
  exposure to a wide range of domains while helping to shape
  the team's technical direction. You'll partner closely with
  global and regional product teams to enable new product
  features and experiments while ensuring our pricing
  infrastructure remains scalable, reliable and accurate.

  What will you be working on?

  - Design and build features end-to-end across our pricing
    services.
  - Contribute to architectural decisions and code reviews,
    raising the bar on quality, reliability and observability.
  - Drive initiatives to improve the reliability and scalability
    of our services, improving the reliability and flexibility
    of our pricing products.

  Qualifications

  What we're looking for

  Technical Excellence

  - Strong background in software engineering, with a track
    record of contributing significantly to large, impactful
    projects in a complex production domain.
  - Experience with Java or similar OOP language.
  - Expert in your technical discipline, with the ability to
    design for long-term iteration and scale.
  - You own the availability, reliability and security of the
    systems you build following engineering best practises.
  - You make sensible trade-offs between speed, scalability and
    risk, and optimise for a predictable, regular cadence of
    delivery.

  Ownership & Product Mindset

  - You own the technical roadmap and deliverables of your
    projects end-to-end, embracing long-term ownership .
  - You can always explain why something is being built, what
    customer problem it's solving, and what impact is
    expected.
  - You take a leading role in incident resolution and post-
    incident review for both minor and major incidents.
  - Experience engaging with product, compliance and stakeholder
    teams to shape requirements and priorities.

  Collaboration, Communication & Growth

  - Clear communication with both technical and non-technical
    audiences.
  - You give and receive feedback well, and contribute to a
    supportive environment that helps the team grow.
  - You mentor and coach other engineers, and own the onboarding
    of new joiners into the team.
  - You promote a culture of collaboration that minimises
    duplicate or wasted work, and pull other teams in the
    right direction.

  Nice to haves

  - Experience in payments, fintech, or another related domain.
  - Prior experience working on a team with a global,
    distributed setup.
  - Experience with systems that involve compliance, audit, or
    regulatory requirements (SOX, fee disclosure, tax).
  - Familiarity with configuration-heavy domains where business
    logic is encoded in data as well as code.



