description: |
  At Curana Health, we're on a mission to radically improve
  the health, happiness, and dignity of older adults—and we're
  looking for passionate people to help us do it.

  As a national leader in value-based care, we offer senior
  living communities and skilled nursing facilities a wide
  range of solutions (including on-site primary care services,
  Accountable Care Organizations, and Medicare Advantage
  Special Needs Plans) proven to enhance health outcomes,
  streamline operations, and create new financial
  opportunities.

  Founded in 2021, we've grown quickly—now serving 200,000+
  seniors in 1,500+ communities across 32 states. Our team
  includes more than 1,000 clinicians alongside care
  coordinators, analysts, operators, and professionals from
  all backgrounds, all working together to deliver high-
  quality, proactive solutions for senior living operators and
  those they care for.

  Ranked #147 on the Inc. 5000 list of America's fastest-
  growing private companies, we're just getting started. If
  you're looking to make a meaningful impact on the senior
  healthcare landscape, you're in the right place—and we look
  forward to working with you.

  For more information about our company, visit
  CuranaHealth.com.

  Summary

  We’re looking for an experienced AI Software Engineer II to
  design, develop, and deploy intelligent solutions that
  transform care delivery, streamline operations, and enhance
  resident experiences in senior healthcare settings.

  You’ll work closely with clinicians and operations teams to
  build AI-driven tools that automate processes, provide AI-
  driven recommendations, and support personalized care.

  Essential Duties & Responsibilities

  - Build and deploy AI solutions that reduce administrative
    burden, elevate care management, and balance patient
    demand with staffing availability.
  - Implement intelligent automation for scheduling, care plan
    updates, and post-visit tasks.
  - Integrate AI solutions with existing EHR and resident
    management systems.
  - Analyze structured and unstructured healthcare data to
    uncover trends and improve clinical decision-making.
  - Continuously monitor, optimize, and ensure compliance of AI
    models for accuracy, scalability, and regulatory
    standards.
  - Collaborate with cross-functional teams to translate
    business needs into technical solutions.
  - Maintain strict adherence to HIPAA and healthcare data
    security requirements.

  Qualifications

  Required Qualifications

  - 2–5+ years of AI & SWE experience, ideally in healthcare or
    life sciences.
  - Proficiency in Python and frameworks such as Scikit-learn,
    TensorFlow, or PyTorch; experience with Azure ML SDK.
  - Strong data engineering skills (SQL, Pandas, ETL
    frameworks).
  - Hands-on experience with LLMs and agentic frameworks
    (LangChain, LangGraph, LlamaIndex).

  Preferred Qualifications

  - Familiarity with Azure services (Azure Machine Learning,
    Azure AI Foundry, Cognitive Services) is a plus.
  - Knowledge of healthcare data standards (FHIR, HL7) and EHR
    integration is a plus.
  - Solid understanding of HIPAA and secure handling of PHI/PII
    is a plus.
  - Experience with observability tools (Azure Monitor,
    Application Insights).
  - Cloud certifications (Azure, AWS, GCP) in AI/ML or
    architecture.
  - Education or experience in health informatics or public
    health.

  Soft Skills

  - Strong analytical and problem-solving abilities.
  - Excellent communication skills for working with non-
    technical stakeholders.
  - Passion for leveraging technology to improve senior care.

  We’re thrilled to announce that Curana Health has been named
  the 147th fastest growing, privately owned company in the
  nation on Inc. magazine’s prestigious Inc. 5000 list. Curana
  also ranked 16th in the “Healthcare & Medical” industry
  category and 21st in Texas.

  This recognition underscores Curana Health’s impact in
  transforming senior housing by supporting operator stability
  and ensuring seniors receive the high-quality care they
  deserve.
