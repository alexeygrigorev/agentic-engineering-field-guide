description: |
  SentiLink helps institutions and protects customers by
  accurately resolving identities and flagging fraud risk.
  Each day, we verify more than 3 million identities, flagging
  150k+ fraud attempts in the process. The problems we work on
  are challenging, and solving them takes deep domain
  expertise, rigorous analysis, and a willingness to dig into
  the details.

  At SentiLink, you'll work alongside smart, highly
  collaborative colleagues who respect each other's time and
  judgment, take ownership, and follow through on their
  commitments. Together, we do truly meaningful work
  protecting the identities of innocent consumers and flagging
  the fraudsters attempting to exploit them.

  We're well capitalized and growing quickly. We already serve
  13 of the top 15 U.S. banks, we're expanding into new
  markets, and we're backed by Craft Ventures, Andreessen
  Horowitz, NYCA, and Max Levchin. We've been named to the
  Forbes Fintech 50 and as a 2026 FICO Industry Vanguard
  Decision Award Winner. We were also the first company to go
  live with the electronic Consent Based Social Security
  Number Verification (eCBSV) service, and we've testified
  before the U.S. Congress on the future of identity.

  We want SentiLink to be the best place you've ever worked.
  We offer generous benefits and support a range of working
  arrangements, from fully remote to in-office. We are a
  digital-first company with strong collaboration across the
  U.S. and India, and we meet in person regularly to build
  relationships. We have offices in Austin, San Francisco, New
  York City, Seattle (Bellevue), Los Angeles, and Chicago in
  the U.S., and in Gurugram (Delhi) and Bengaluru in India.

  About the Opportunity:

  As a Senior Software Engineer at SentiLink, you will build
  and enhance an API platform that powers our products. You
  will work with product, engineering, and security teams
  across the company to deploy the features and underlying
  systems to make our products scalable, maintainable, and
  extremely secure. You have outstanding programming skills,
  you are proficient in our technology stack, and you can pick
  up new technologies quickly as we evolve.

  This is a remote, US-based role.

  Technologies:

  Golang, Python, PostgreSQL (RDS), OpenSearch, Docker, AWS
  technologies (Lambda, Cognito and other standard
  technologies).

  Responsibilities:

  - You are the owner of one large section of our codebase
  - Lead the technical direction provide guidance and set the
    technical direction for our team, ensuring alignment with
    project goals and industry best practices
  - Design and build a suite of API-based decisioning products
  - Code, test, debug, document, and maintain products and
    platform using established coding standards and
    methodologies
  - Partner with product management to drive agile delivery of
    both existing and new products based on project
    requirements.
  - Ensure new software meets quality standards by writing unit,
    dependency, integration and end-to-end automated tests
  - Troubleshoot, debug, and resolve product issues as they
    arise
  - Ensure platform and services meet SLA requirements; on call
    rotation for production issues, along with the rest of
    engineering

  Requirements:

  - 6+ years of software development experience building
    enterprise or consumer facing products
  - Experience with building API based products using Python,
    Golang, or similar technologies
  - Excellent analytical and problem solving skills,
    interpersonal skills, and a sense of humor (enjoy the
    journey)
  - Familiarity with: RDBMS (e.g. postgres) and ability to write
    efficient queries with optimal structures; Docker and AWS
    technologies; fintech or financial services; scrum / agile
    development environment
  - Proficiency with using an AI tool such as Claude Code,
    ChatGPT/Codex, Cursor or another similar tool
  - Candidates must be legally authorized to work in the United
    States and must live in the United States

  Compensation:

  - $170,000/year - $230,000/year + equity + benefits

  Note: This salary range may be inclusive of multiple career
  levels, and the actual base salary within that range will be
  determined by several components including but not limited
  to the individual's experience, skills, and
  qualifications.Perks:

  - Employer paid group health insurance for you and your
    dependents
  - 401(k) plan with employer match (or equivalent for non US-
    based roles)
  - Flexible paid time off
  - Regular company-wide in-person events
  - Home office stipend, and more!

  Corporate Values:

  - Follow Through
  - Deep Understanding
  - Whatever It Takes
  - Do Something Smart
