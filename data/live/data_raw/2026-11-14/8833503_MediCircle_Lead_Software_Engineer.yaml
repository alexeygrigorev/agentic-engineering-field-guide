description: |
  About MediCircle

  MediCircle is building the national infrastructure to make
  prescription drugs affordable. Today, billions of dollars of
  perfectly usable medications go unused, while patients are
  forced to skip or abandon life-saving treatments due to
  cost. We exist to change that.

  MediCircle reclaims unused medications, recertifies their
  quality using our patented process, and redistributes them
  through our licensed pharmacy. In doing so, we provide
  patients with medications at zero out-of-pocket cost, while
  generating savings for our payer, plan sponsor, and value-
  based care clients.

  We are a VC-backed, early-stage healthcare technology
  company with a proven model and accelerating growth:

  - $65M+ in medications reclaimed to date
  - Active partnerships with market-leading customers, including
    national VBCs, PBMs, and regional health systems
  - Rapidly expanding demand across enterprise and government
    channels

  If our mission resonates with you, you are interested in
  joining a high-growth healthcare company, and you are
  energized by directly impacting the lives of millions of
  patients who can no longer access or afford their
  medications, we would love to hear from you.

  Role Overview

  You will work directly with MediCircle’s Head of Technology
  to architect, build, and scale the technical foundation
  powering our national medication redistribution platform.

  As MediCircle’s Lead Software Engineer, you will own end-to-
  end product development, taking ownership of system
  architecture and backend development while remaining hands-
  on across the full stack. You will design the core services,
  data models, infrastructure, and workflows that power
  complex pharmacy and patient operations in a highly
  regulated environment.

  Beyond writing code, you will play a foundational role in
  defining MediCircle’s product roadmap and long-term
  technical strategy. You will also help identify and
  implement emerging technologies, such as AI-driven tools and
  automation, that improve system performance, development
  velocity, and operational efficiency.

  The ideal candidate thrives on ownership, can operate across
  the full software stack, ships quickly without sacrificing
  quality, enjoys translating complex operational challenges
  into user-centric software, and takes pride in building
  systems that are elegant, durable, and capable of operating
  at national scale.

  Responsibilities

  - Architecture & Backend Ownership: Lead the design and
    evolution of MediCircle’s backend architecture and core
    infrastructure. Build systems that remain reliable,
    secure, and compliant as the platform scales nationally.
  - Full Stack Product Development: Build and ship end-to-end
    features across backend and frontend systems. Work
    primarily in Python/Django on the backend and
    TypeScript/React on the frontend.
  - AI-Native Engineering: Evaluate and integrate AI tools and
    workflows into development processes and product
    capabilities to improve operational efficiency, decision-
    making, or product functionality
  - Infrastructure & DevOps: Design and maintain deployment
    pipelines, infrastructure, and observability tools. Ensure
    high availability, system reliability, and data integrity
    across production systems. Troubleshoot production issues
    quickly and methodically
  - Product & Systems Thinking: Collaborate across teams to
    build user-centric, scalable systems that account for
    compliance, auditability, and data integrity requirements
  - Engineering Leadership: Help shape MediCircle’s engineering
    culture and standards as the team grows. Contribute to
    hiring, onboarding, and mentoring while helping build
    practices that support a high-performing, mission-driven
    team.

  Requirements

  - Software Engineering Experience: You have 3-6+ years of
    software engineering experience, including experience
    building and operating complex production platforms.
  - Builder DNA: You have built and scaled real systems from
    scratch — APIs, data models, backend services, and
    production infrastructure
  - Architecture & Backend Expertise: Strong experience
    designing backend systems and scalable architectures
  - AI Fluency: Actively stay on top of emerging AI technologies
    and how they can improve engineering productivity or
    product capabilities
  - Full Stack Ownership: Proficient across the stack, ideally
    including: Python (Django preferred), TypeScript / React,
    and REST APIs
  - Product-Minded Engineer: You think beyond code and deeply
    care about how software impacts real users. You design
    systems with usability, reliability, and operational
    realities in mind
  - Execution Engine: You can take loosely defined problems and
    turn them into shipped production systems. You move
    quickly while maintaining strong engineering discipline
  - Software development experience: You have at least two years
    of experience in a software development role
  - Leadership Experience: Experience leading technical projects
    or managing engineering teams. You’ve helped take a
    product from 0 → scale
  - DevOps Fluency: Comfortable owning the full deployment
    lifecycle - CI/CD pipelines, containerized deployments,
    infrastructure as code (AWS CDK preferred), and production
    observability.

  Preferred Qualifications

  - You have healthcare/pharmacy exposure and familiarity with
    regulated ops (clinical, pharmacy, payer/PBM, or
    analogous); if not, you have previously worked and/or
    currently work in regulated or compliance-heavy
    environments
  - You have early-stage startup experience or similar
    experience in fast-paced, high-growth environments
