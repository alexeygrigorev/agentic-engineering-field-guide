  Engineering Manager - Data Intelligence





  About trawa



  European energy costs are 2x compared to US and China.
  Electricity demand is expected to double by 2050. Market
  price volatility & complexity are here to stay. The backbone
  of Europe's industrial economy is at risk and companies need
  to act now.

  trawa is building the solution: the first integrated B2B
  energy platform that orchestrates procurement, energy
  management, and flexibility steering in one product. Supply,
  Manage, and Flex combined. That integration unlocks up to
  30% in recurring electricity cost savings, all while helping
  companies switch to renewable energy.

  We're the fastest-growing B2B energy platform in Europe.
  Active in Germany and Austria now, and expanding operations
  to a third market in 2027. We're on the road to European
  scale and move fast, the market window is open and we intend
  to own it.

  trawa is a scale-up based in Berlin with ~100 FTE, ~30 of
  whom work in Product & Tech. We've raised over €35M to date,
  including a €24M Series A in May 2025, backed by Balderton,
  Headline, Speedinvest, AENU, Magnetic, and Tiny VC. All
  three founders are on board and 100% committed to build the
  utility of the future







  About the Role



  Data is the heartbeat of trawa. It is the foundation and
  lifeblood of our product, the core that unlocks the power of
  the energy markets for our customers, turning a complex
  challenge into a source of savings and sustainability.

  We are looking for an Engineering Manager to lead our Data
  Intelligence team. This high-impact team builds and operates
  the utility backbone of our energy platform, combining
  expertise in data platforms, data engineering, and business
  intelligence. You will own the technical direction for these
  critical systems, which include everything from metering
  data management to our invoicing and billing services.

  You'll shape a team culture grounded in trust,
  collaboration, and continuous learning, creating an
  environment where engineers thrive and do their best work.
  Reporting to the Director of Engineering, you will lead an
  established and growing group of talented engineers.

  At trawa, our culture is generally "office-first with
  flexibility", where most of us are in our beautiful Berlin
  office the majority of the week, with room to occasionally
  work from home when needed. The Tech team follows a more
  hybrid rhythm, spending minimum 3 days a week in the office.





  What You'll Do



  You'll drive the evolution of these areas:

  - Own the roadmap for our central data warehouse and the data
    platform that our products are built on
  - Build a scalable data backend for the key processes of an
    energy provider including timeseries data management,
    invoicing and billing services.
  - Lead the design and operation of critical data pipelines,
    data quality standards, observability practices and
    platform infrastructure on AWS

  Our tech stack

  - Postgres, ClickHouse, Metabase, DBT
  - Python (pandas, polars)
  - AWS, Terraform, Docker, GitHub Actions







  Your First 90 Days



  After 6 Weeks (Onboarding):

  - Establish strong relationships with your direct reports,
    peers and stakeholders
  - Understand the team’s current OKRs and how they impact the
    organisation
  - Gain a comprehensive understanding of the current data
    architecture, including core databases, pipelines, and key
    data sources

  Month 3 (Ramp-Up):

  - Conduct a review of the team's operational health and
    technical debt, presenting a prioritized plan for
    improvement in areas like observability, data health, and
    platform scalability
  - Define and share a clear vision and strategic roadmap for
    the Data Intelligence team
  - In partnership with key stakeholders across the business,
    define and finalize the team's roadmap for the upcoming
    quarter, aligning it with company OKRs and communicating
    the plan broadly





  What We're Looking For

  - You have at least two years of experience in a technical
    leadership role with people management responsibilities,
    ideally in a fast-moving startup environment.
  - You know how to lead teams, balance competing priorities,
    and create an environment where engineers do their best
    work.
  - You have hands-on experience building or leading a scalable
    data platform, and can confidently drive architecture
    decisions around pipelines, data modelling, and analytics
    infrastructure.
  - Clear communicator who builds trust and fosters
    collaboration across teams and with non-technical
    stakeholders.Inclusive leader who creates an environment
    where engineers of diverse backgrounds and experiences can
    thrive.

  Don’t meet every single requirement? We still encourage you
  to apply!

  At trawa, we’re dedicated to building a diverse, inclusive,
  and authentic workplace. If you’re excited about this role
  but your experience doesn’t align perfectly, we encourage
  you to apply – you may be the right fit for this or another
  opportunity.







  Why Join Us



  Real impact - At trawa, you will be part of a team that is
  dedicated to making a positive impact on the world. We value
  creativity, collaboration, and diverse perspectives.



  Responsibility and Support - As a member of our small, agile
  team, you will have real ownership and the autonomy to shape
  how we build and scale our engineering foundations. We are
  committed to your success through weekly one‑on‑ones with
  your manager, skip‑level sessions with the CTO, and regular
  peer meetings with other Engineering Managers. You will also
  take part in cross‑department leadership development
  initiatives that help you collaborate, learn and grow
  alongside other leaders across trawa. You will be supported
  by experienced mentors and colleagues who want to see you
  succeed and make a meaningful impact across the
  organisation.



  Ownership - We empower our team members to take ownership of
  their work and drive results, regardless of background or
  experience level.



  Learning and Growth - We provide an annual budget and
  dedicated time for professional development. You’ll have
  opportunities for mentorship, learning, and career
  progression.



  Inclusive by design - We’re an equal opportunity employer,
  and our team reflects that. Our tech organisation brings
  together over 15 nationalities, contributing a variety of
  languages, experiences, and perspectives. At trawa, we’re
  family-friendly with parents across all levels, and our
  diversity is represented throughout the company, including
  leadership. We’re committed to an inclusive environment
  where everyone can do their best work.



  Package and Benefits - We offer a competitive compensation
  package including salary and stock options, 30 days of
  vacation, and a range of benefits including subsidies for
  home internet and lunches, a Sports Club membership, a
  productivity budget for work essentials (e.g., headphones,
  monitor), dedicated learning days with an annual learning
  budget, plus a weekly team lunch and regular team events.
