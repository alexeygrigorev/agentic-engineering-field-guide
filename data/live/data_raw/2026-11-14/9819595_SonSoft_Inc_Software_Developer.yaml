  - At least 3 years of relational database experience with an
    understanding of SQL – MS SQL / ORACLE.
  - At least 2 year of experience developing Web UIs, using
    JavaScript/JQuery, HTML and CSS.
  - At least 4 years of experience in software development life
    cycle.
  - At least 4 years of experience in Project life cycle
    activities on development and maintenance projects.
  - At least 4 years of experience in Design and architecture
    review.
  - Ability to work in team in diverse/ multiple stakeholder
    environment
  - Experience to Financial Services, Investment domain
  - Analytical skills

  Qualifications

  - Bachelor’s degree or foreign equivalent required from an
    accredited institution. Will also consider three years of
    progressive experience in the specialty in lieu of every
    year of education.
  - At least 4 years of experience with Information Technology

  Additional Information

  ** U.S. citizens and those authorized to work in the U.S.
  are encouraged to apply. We are unable to sponsor at this
