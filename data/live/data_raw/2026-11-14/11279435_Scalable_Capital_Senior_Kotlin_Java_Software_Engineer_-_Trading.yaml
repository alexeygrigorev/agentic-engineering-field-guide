description: |
  Company Description

  Scalable Capital is a leading digital investment and banking
  platform with a full banking licence, empowering people
  across Europe to shape their own finances. Scalable Broker
  makes it easy and affordable for clients to invest
  professionally in stocks, ETFs, cryptocurrencies, and
  derivatives, as well as set up savings plans. Scalable
  Wealth, the digital wealth management service, offers
  clients professional investment in ETF portfolios, and is
  also adopted as a white-label solution by banks and other
  B2B partners. The company’s offerings are rounded off by
  attractive interest rates, loans, and private equity. With
  the European Investor Exchange, Scalable Capital offers an
  exchange specifically for retail investors. Over one million
  clients have already entrusted more than €50 billion to the
  platform.

  Founded in 2014, Scalable Capital now employs over 700
  people across Munich, Berlin, Vienna and Milan. Together
  with the founding and management team, including Erik
  Podzuweit and Florian Prucker, they are working on a new
  generation of financial services.

  Visit our finance blog or check out our Social Media
  channels to find out what our Expert Teams have to say.

  Our Company Values guide us every day in how we work and
  collaborate. To learn more about them, you can find our
  values here (English).

  We are looking for experienced backend developers to work on
  our brand new banking platform!

  Job Description

  - Be part of a highly motivated, cross-functional team
    building and operating Scalable Capital’s Trading
    Platform.
  - Design, build, and evolve business-critical services
    supporting the trading lifecycle—from order intake and
    validation through execution, status updates and post-
    trade processing.
  - Develop reliable, scalable, and observable backend services
    using Kotlin, Java, and Spring Boot in a distributed,
    event-driven environment.
  - Work with product, operations, risk, and other engineering
    teams to translate complex trading processes into clear,
    resilient software models and APIs.
  - Build integrations with internal platforms and external
    trading venues, ensuring robust processing of time-
    sensitive financial data.
  - Take ownership from idea to production: contribute to
    architecture, implementation, testing, deployment,
    monitoring, and continuous improvement.
  - Help ensure the platform meets high standards for
    correctness, performance, availability, security, and
    auditability.
  - Work in an autonomous agile team using modern software-
    development practices, including code reviews, automated
    testing, continuous integration and delivery, cloud-based
    infrastructure, and infrastructure as code.
  - Raise engineering standards by improving reliability,
    automation, observability, developer experience, and
    operational processes.

  Qualifications

  - A university degree in computer science, engineering or a
    comparable qualification.
  - Strong professional experience building production backend
    services with Kotlin or Java and Spring Boot.
  - Experience designing and operating distributed, event-
    driven, high-availability systems with clear API and
    service boundaries.
  - Solid understanding of Domain-Driven Design and the ability
    to model complex business workflows in maintainable
    software.
  - Demonstrated ability to work on latency-sensitive, high-
    throughput systems, including performance analysis,
    monitoring, capacity considerations and failure-mode
    design.
  - Experience designing, operating and optimising data
    persistence for backend services, including relational
    databases such as PostgreSQL/MySQL and NoSQL databases
    such as DynamoDB.
  - A strong engineering-quality mindset: clean, secure,
    testable, documented, maintainable code and ownership of
    services in production.
  - Familiarity with cloud-native development and operations,
    ideally AWS, Docker, Terraform, CI/CD pipelines,
    monitoring, and observability tooling.
  - Strong analytical skills and clear, audience-appropriate
    communication with engineering, product, operations and
    business stakeholders.
  - Experience with designing and operating gRPC services,
    including protobuf-based API design, backward-compatible
    schema evolution, error handling and observability, is a
    plus.
  - Experience with financial-market systems requiring strict
    operational controls and auditability is a strong plus.

  Additional Information

  - Be part of one of the fastest-growing and most visible
    Fintech startups in Europe, creating innovative services
    that have a substantial impact on the lives of our
    customers
  - Work with an international, diverse, inclusive, and ever-
    growing team that loves creating the best products for our
    clients
  - Be productive with the latest hardware and tools
  - Learn and grow by joining our in-house knowledge sharing or
    career development sessions and spending your individual
    Education Budget
  - Learn and experience German culture first hand by joining
    our free German language classes
  - International relocation support is provided if required
  - Opportunity to work from abroad
  - Benefit from an attractive compensation package and from the
    company pension scheme
  - Monthly contribution of 50% for the ‘Deutschland Jobticket’
  - Say goodbye to order commissions and say hello to your
    complimentary subscription of Scalable Capital's PRIME+
    Broker
  - Enjoy flexible and discounted sports activities with Urban
    Sports Club
