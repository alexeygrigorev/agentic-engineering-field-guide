description: |
  Senior Full-stack Engineer (Agentic Experience)

  As a Senior Engineer on our Platform Infrastructure team,
  you will lead the design and governance of our Agentic
  Solutions. You will bridge the gap between innovative AI
  agents and production-grade software, ensuring our platform
  provides safe, reliable, and intelligent automation for the
  world’s biggest brands. You’ll work across the stack to
  connect agents to our ecosystem via APIs and custom MCP
  servers, while ensuring safety and enterprise-grade
  guardrails are in place.

  In this role, you’ll get to:

  - Architect and Govern Agentic Solutions: Develop platforms
    that run AI agents, integrating them with CreatorIQ via
    data connectors like our APIs and custom MCP servers
  - Implement Safety & Governance: Design and maintain
    guardrails to ensure our agents are secure, reliable, and
    compliant for use by global enterprise clients
  - Agent Discovery: Build systems and interfaces that enable
    users to discover, evaluate, and select the right AI
    agents for their unique business workflows
  - Build Scalable Agentic-Ready Systems: Develop frontend
    interfaces (React/TS) and backend services
    (Node.js/Python) that power these agentic experiences
  - Support Client Engagements: Participate and process client-
    facing technical discussions, feedback sessions, and real-
    user monitoring results, as needed to demonstrate
    solutions and gather implementation feedback.
  - Drive Innovation: Advise on cloud infrastructure (AWS/GCP)
    and database strategies to support our long-term roadmap.

  Who you are and what you’ll need for this position:

  - 7+ years of professional software engineering experience,
    including experience building full-stack applications and
    distributed systems.
  - 2+ years designing or deploying AI-powered applications,
    using widely adopted one or more agent frameworks
    (Langchain, LangGraph, CrewAI, MS semantic kernel, or
    OpenAI agent SDK, etc.)
  - Intelligent AI Agents in production: You have practical
    experience building and deploying AI agents at scale and
    in production, including deploying MCP servers as
    enablement layers for Agents in production. You understand
    the complexities and are passionate about implementing
    necessary safety and governance guardrails.
  - Backend & API Expertise: You are proficient in Node.js and
    Python, with a strong background in building reliable APIs
    and integrating data connectors.
  - Full-Stack Fluency: You have strong experience with React
    and TypeScript, allowing you to build intuitive UIs that
    let users interact seamlessly with AI agents.
  - Infrastructure & Cloud Knowledge: You have a solid grasp of
    cloud infrastructure, and you are proficient at managing
    the environments where these agents live.

  Confidence can sometimes hold us back from applying for a
  job. But there's no such thing as a 'perfect' candidate.
  Have 50% of the criteria? Excited about this opportunity?
  Interested about what we do at CreatorIQ? Please apply!

  What you will get from us:

  - People: Work with talented, collaborative, and friendly
    people who love what they do.
  - Guidance: Utilize our learning platform to fully get the
    training and tools you'll need to become successful here
    from your first day with us.
  - Work/life harmony: 15 days of vacation, floating and company
    holidays, wellness benefits, and paid parental leave.
  - Whole Health Package: Comprehensive medical, dental, vision,
    life, and disability insurance, plus additional wellness
    benefits.
  - Planning for the future: A 401(k) plan to help you plan
    ahead.
  - Work from home stipend: To assist you in setting up a home
    office that works for you.

  Compensation, benefits, and beyond:

  We know that benefits play a significant role in your
  overall compensation. We invite you to review our benefits
  and perks.

  Who we are:

  CreatorIQ is enterprise infrastructure for creator
  marketing, trusted by more than 1,300 of the world's leading
  brands and agencies, including Beiersdorf, Delta Air Lines,
  Dentsu, Google, Nestlé, and Wella. Powered by the Creator
  Graph®, CreatorIQ's proprietary AI and intelligence
  foundation grounded in over 11 years of data, it’s built for
  teams, agents, and the entire enterprise tech stack. With
  headquarters in Los Angeles and offices in Austin, London,
  Manila, New York, San Francisco, and Warsaw, CreatorIQ’s
  global team moves quickly and deliberately because we're
  setting the pace for an industry that's still being defined.

  Learn more at www.creatoriq.com and follow us on LinkedIn
  and Instagram.

  At CreatorIQ, different perspectives make our work better.
  The people we hire come from different backgrounds and think
  in different ways — and that's exactly what helps us connect
  with each other, and with the customers and creators we
  serve.We are committed to fostering an inclusive, equitable,
  and empowering work environment where everyone can thrive,
  regardless of race, ethnicity, gender, sexual orientation,
  age, religion, disability, or any other characteristic that
  makes us unique. By embracing our core values of being
  intentional, pursuing excellence every day, embracing the
  journey together, and being a good human, we create an
  atmosphere that promotes collaboration and growth. Join us
  to celebrate differences, innovate together, and be a part
  of a business that is disrupting the marketing industry.

  AI Transparency Notice

  We may use artificial intelligence (AI) tools to support
