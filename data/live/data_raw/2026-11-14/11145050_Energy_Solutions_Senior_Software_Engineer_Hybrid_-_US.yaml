description: |
  Interested in joining a growing company where you will work
  with talented colleagues, enhance a supportive and energetic
  culture, and be part of the climate solution? At Energy
  Solutions, we focus on the big impacts. And we believe that
  market-based programs can be a powerful force to deliver
  large-scale energy, carbon, and water-use savings. Since
  1995, we’ve harnessed that power to offer proven,
  performance-based solutions for our utility, government, and
  institutional customers.

  Energy Solutions is seeking a Senior Software Engineer to
  provide technical direction and establish complex software
  solutions that support critical business applications and
  long-term technology objectives. As a senior individual
  contributor, this role leads software architecture,
  technical design, and engineering decisions that other teams
  and projects utilizing the Mendix platform rely on.
  Solutions must be scalable, maintainable, secure, and
  aligned with business and client needs.

  Operating with a high degree of independence, the Senior
  Software Engineer evaluates technical requirements, sets
  direction on solution alternatives, and contributes to
  technical strategy within their domain.  In addition, this
  role will mentor junior-level engineers through code
  reviews, technical guidance, solution design discussions,
  and knowledge sharing, while supporting engineering best
  practices, technical standards, and continuous improvement
  initiatives across the development team.

  This is a hybrid work opportunity. ES has offices in
  Oakland, CA; Orange, CA; New York, NY; Portland, OR;
  Chicago, IL; and Boston, MA.

  Responsibilities include but are not limited to:

  - Lead the design and development of complex software systems,
    features, services, and integrations across all projects
    and multiple teams utilizing the Mendix platform.
  - Design scalable, secure, modular, and maintainable software
    solutions that support current and anticipated business
    and client needs.
  - Develop full-stack software solutions and technical designs
    that align with platform architecture, engineering
    standards, and business requirements.
  - Serve as a technical subject matter expert and escalation
    point for complex software engineering questions and
    decisions across multiple teams utilizing the Mendix
    platform.
  - Mentor and coach engineers across multiple teams and Mendix
    projects through technical guidance, solution design
    discussions, pair programming, code reviews, and
    constructive feedback.
  - Lead technical strategy within their domain and establish
    engineering standards, technical approaches, and system
    design decisions adopted across multiple projects and
    shared technology platforms.
  - Lead cross-functional initiatives spanning multiple teams
    involving system integration, APIs, data exchange,
    platform modernization, and performance optimization.
  - Lead the Identification and communication of technical
    risks, dependencies, trade-offs, and mitigation strategies
    to project teams, engineering leads, and senior leadership
    as needed.
  - Lead incident response, root-cause analysis, and
    implementation of sustainable corrective actions across
    teams.
  - Evaluate application performance, reliability, scalability,
    capacity, and operational effectiveness and lead the
    implementation of proactive improvements.
  - Ensure software systems and changes align with established
    security, privacy, data protection, and compliance
    requirements.
  - Lead automation, monitoring, and operational improvements
    that reduce recurring issues and strengthen system
    resilience across teams.

  Minimum Qualifications:

  - Bachelor’s degree in Software Engineering, Computer Science,
    Information Systems, Computer Engineering, or a related
    technical field.
  - 10 years of experience developing, supporting, and enhancing
    complex software systems and applications.
  - Advanced proficiency in full-stack software development and
    one or more programming languages or technologies such as
    Java, Python, JavaScript, C#, SQL, HTML, CSS, or
    equivalent technologies.
  - Advanced knowledge of software architecture, system design,
    design patterns, data structures, algorithms, APIs,
    integration practices, and application modernization
    techniques.
  - Strong understanding of cloud platforms, deployment
    practices, CI/CD pipelines, monitoring, automation, and
    production support.
  - Experience contributing to architectural and technical
    design decisions across applications, systems, platforms,
    or codebases.
  - Experience evaluating technical trade-offs and recommending
    solutions that balance business requirements, delivery
    timelines, scalability, and long-term maintainability.
  - Experience collaborating with engineering teams and
    stakeholders to support technical direction across
    multiple projects or shared technology platforms.
  - Experience mentoring engineers through code reviews,
    technical guidance, solution design discussions, and
    knowledge sharing.
  - Experience partnering with Product, Quality Assurance,
    Project Management, DevOps, business stakeholders, and
    cross-functional teams to deliver software solutions.
  - Strong written and verbal communication skills, with the
    ability to communicate technical concepts to technical and
    non-technical audiences.
  - Strong mentoring, coaching, collaboration, and technical
    leadership skills.
  - Ability to manage multiple technical priorities and operate
    effectively in complex and evolving environments.
  - Ability to work independently while maintaining alignment
    with established engineering standards, architectural
    direction, and organizational objectives.

  The salary range for this role is $140,000 -
  $175,000/annually with a target compensation of $140k -
  $157,500 based on experience and qualifications.

  Compensation is commensurate with experience and includes a
  generous retirement package. Energy Solutions provides an
  excellent benefits package including medical, dental and
  vision insurance, other pre-tax contribution plans and an
  Employee Stock Ownership Plan (ESOP).

  AI Use

  At Energy Solutions we believe in the importance of
  authentic interactions and equitable opportunities. We base
  our candidate selection on one’s own skills, knowledge, and
  experience. To ensure the integrity and fairness of our
  interview process, the use of artificial intelligence (AI)
  tools (including Generative AI) or other means to generate
  or assist with responses during interviews is strictly
  prohibited. This practice supports our commitment to create
  a transparent and equitable space where skills, knowledge
  and experience can truly shine.

  Equal Opportunity Employer

  Energy Solutions is an affirmative action-equal opportunity
  employer and prohibits discrimination and harassment of any
  type. We afford equal employment opportunities to employees
  and applicants without regard to race, color, religion, sex,
  sexual orientation, gender identity or expression,
  pregnancy, age, national origin, disability status, genetic
  information, protected veteran status, or any other
  characteristics protected by law. Energy Solutions conforms
  to the spirit as well as to the letter of all applicable
  laws and regulations.

  Office Locations and a Remote Workforce

  Energy Solutions operates as a predominantly remote
  workforce with offices in  six different locations.
  Employees who reside within 40 miles of an office (except
  New York) will be assigned to that location, though in-
  office attendance requirements may vary by team. At this
  time, we are not accepting applications from candidates
  residing in the following states: Delaware, Kentucky,
  Mississippi, Montana, Nebraska, and North Dakota.

  Background Check Information

  Information will be requested to perform the compulsory
  background check. A drug screen and authorization to work in
  the U.S. indefinitely are preconditions of employment.
  Energy Solutions is an equal opportunity employer.

  Reasonable Accommodations

  Energy Solutions is committed to providing access and
  reasonable accommodation for individuals with disabilities.
  If you require accommodations in completing this
  application, interviewing, and/or completing any pre-
  employment testing, or otherwise participating in the
  employee selection process, please email
  accommodation@energy-solution.com.

