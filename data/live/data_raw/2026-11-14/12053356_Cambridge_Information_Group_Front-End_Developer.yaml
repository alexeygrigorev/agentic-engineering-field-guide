description: |
  Job Title: Front-End Developer Location: Fully Remote (US)
  Department: Global Enrollment Marketing and Sales Reports
  to: Director of Web Development Classification: Regular,
  Full-time FLSA Status: Exempt Prepared by: Global Head of
  Creative Prepared Date: 10/1/26 Salary range:
  $85,000–$100,000

  About Edconic

  Edconic is a leading player in the alternative, experiential
  education space. We partner with the world's largest and
  most well-known brands to create and run schools that
  capture the legacy and value of each brand. Our students get
  truly unique, once-in-a-lifetime experiences that help shape
  their future and give them the skills they need to reach
  their goals.

  The Role

  We're looking for an experienced Front-End Developer to join
  our web team, which owns every Edconic digital property –
  from our school websites to landing pages and email
  templates. You'll work alongside designers, IT, and MarTech
  to build solutions that serve real business needs while
  protecting each brand's unique identity.

  You'll be one of two developers on the team, working
  directly with our lead developer. That means real ownership
  of your work, a genuine voice in how we build, very little
  process overhead, and a codebase that is actively moving
  toward a modern, standardized WordPress stack. We value
  craft: fast pages and code that the next developer can read.

  What You'll Do

  - Build and maintain public-facing websites, micro-sites, and
    landing pages in collaboration with our lead developer,
    IT, and MarTech.
  - Work with UX/UI designers to confirm the technical
    feasibility of designs, then translate them into polished,
    responsive pages that stay true to each brand.
  - Build and maintain custom WordPress themes across both of
    our stacks: modern block-based builds (ACF Blocks, core
    blocks, block patterns, theme.json) and established
    classic themes built on PHP templates, Advanced Custom
    Fields, and Sass.
  - Collaborate with our lead developer to shape the team's
    coding standards, tooling, and workflow, and help migrate
    our existing sites toward our new modern stack.
  - Stay current on emerging web standards and bring ideas to
    the table where they genuinely fit.

  What You Bring

  - 4+ years of front-end web development experience, with
    strong skills in semantic HTML, CSS, JavaScript, PHP, and
    WordPress.
  - The ability to build a custom WordPress theme from scratch
    using PHP templates and Advanced Custom Fields.
  - Strong CSS skills across Sass and modern native CSS (custom
    properties, nesting), and solid vanilla JavaScript.
  - Comfort working in Git/GitHub with pull requests and code
    reviews, and with npm-based build tools and the command
    line.
  - A habit of writing semantic, well-structured HTML that
    covers accessibility basics, with an eye for reuse, cross-
    browser compatibility, performance, and SEO.
  - Experience building and testing HTML emails.
  - Strong UX/UI sensibilities and a desire to sweat the small
    stuff.
  - A proactive, self-directed working style – you can run with
    a project independently and prioritize across several at
    once.
  - Excellent written and verbal communication – you're
    positive, collaborative, objective, and solution-oriented.

  Bonus Experience

  - Modern WordPress block development: ACF Blocks, block.json,
    theme.json, and block patterns.
  - Composer, Bedrock or other Roots tooling (Sage/Blade,
    Trellis), Vite, or CI/CD with GitHub Actions.
  - Deeper accessibility experience (WCAG, ARIA, assistive-
    technology testing).
  - CRM and marketing automation integration (Salesforce,
    Pardot/Account Engagement).
  - Multilingual WordPress sites.
  - A modern JavaScript framework such as React or Vue.
  - UX or UI design, and design tools such as Figma and Adobe
    Creative Suite.

  How We Use AI

  AI-assisted development is a new and evolving part of our
  workflow. We use AI coding tools to speed up research,
  scaffolding, review, and routine work, and you're welcome to
  do the same.

  AI is a tool here, not a substitute for expertise. You are
  accountable for every line of code that you ship, which
  means you must be able to write, review, debug, and explain
  production code entirely on your own. Expect to demonstrate
  those skills without AI assistance during the interview
  process.

  Location, Travel & Eligibility

  - Fully remote within the United States. Occasional travel to
    our New York office may be required.
  - Must be legally authorized to work in the US.
  - Bachelor's degree preferred (Computer Science, Interaction
    Design, Graphic Design, Communications, or a related
    field); equivalent professional experience is equally
    welcome.

  Our Commitment

  Edconic supports and embraces diversity and inclusiveness,
  and we encourage candidates from all backgrounds to apply,
  even if you don't meet every requirement listed here.
  Reasonable accommodations are available to enable
  individuals with disabilities to perform the essential
  functions of the role and to participate in the interview
  process.

  The above statements describe the general nature and level
  of work for this position. They are not an exhaustive list
  of all duties, responsibilities, and skills. Edconic
  reserves the right to modify this job description at its
  sole discretion.
