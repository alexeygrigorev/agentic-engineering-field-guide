description: |
  Job Description

  The IB Tech & CRM/Analytics team is a highly strategic and
  cross-functional team responsible for leading the firm’s
  global digitalization effort. This initiative, spanning all
  client-facing business units and corporate functions, will
  drive innovation and strategic change through technology,
  data science, and deep analytics. The team partners with key
  business leaders and industry experts to build
  transformational technology to drive revenue, maximize
  efficiency, and optimize the allocation of resources. The IB
  Tech & CRM/Analytics team is at the forefront of Jefferies’
  cloud initiative, leveraging best-in-class cloud-based
  technologies to replace legacy on-premises solutions to
  provide intelligent trend insights, actionable
  opportunities, decision support, and transparency into all
  client and business-related activities.

  Job Highlights:

  - Exciting and unique opportunity to be a member of our
    corporate IB Tech & CRM/Analytics Team, tackling our
    toughest and most exciting data engineering challenges
    across multiple divisions in Jefferies.
  - Modern, fully cloud-native, tech stack that leverages
    several AWS products to orchestrate an event driven data
    distribution platform.
  - Collaborate with our team of passionate and innovative data
    specialists, application developers and product managers.

  Key Responsibilities:

  - Contribute to the end-to-end SDLC process on high-impact
    Madison projects, from conception for new –maintenance for
    existing, design, implementation, testing, release, and
    support.
  - Facilitate alignment across IB Tech & CRM/Analytics teams on
    goals, outcomes, priorities, deadlines, and deliverables.
  - Write readable, testable, and maintainable code
  - Drive innovation of new technologies

  Experience Needed:

  - Bachelor's Degree or Master’s degree in computer science,
    Engineering or related
  - Excellent written and verbal communication skills with the
    ability to present complex technical solutions in a clear
    and concise manner
  - 8+ years of hands on experience designing, developing, and
    delivering Java-based APIs (GraphQL/OpenAPI/gRPC) and
    Microservices using Spring Boot and AWS products
    (ECR/EKS/EC2/Beanstalk)
  - Experience with Streaming Technologies like Kafka, including
    designing and developing complex, scalable, and high-
    performance applications. Proven track record of
    delivering robust and efficient solutions in a fast-paced
    environment.
  - Experience in working with SQL building Stored Procedures,
    Functions and Data Warehousing solutions.
  - Strong problem-solving skills and design skills with focus
    on distributed, highly available, and fault tolerant
    systems
  - Experience in developing TDD/BDD unit-tests and work with
    Quality Assurance team members on defect triage and
    resolution.
  - Proactively participates in Agile Ceremonies like Sprint
    Planning, Backlog Grooming etc., and experience in working
    with virtual teams.
  - In-depth knowledge of Kafka and its ecosystem, with prior
    experience in event-driven architecture. Ability to design
    and develop robust data pipelines and streaming
    applications.
  - Experience with AWS EKS (Elastic Kubernetes Service),
    including deploying and managing containerized
    applications. Strong understanding of CI/CD pipelines and
    containerization technologies such as Docker and
    Kubernetes.
  - Strong multi-tasking skills and able to learn new
    technologies quickly

  Good to Have:

  - Exposure to Front-End web development
    (Angular/React/JavaScript/Typescript)
  - Exposure to Financial Services & Investment Banking business
    domain.
  - Exposure to Salesforce or similar CRM Eco-System.
  - Exposure to Business Intelligence tools (Tableau CRM,
    Cognos, PowerBI, etc.).
  - Exposure to ETL & Data Engineering tools like Mulesoft,
    StreamSets & Databricks.

  Primary Location Full Time Salary Range of $180,000 -
  $220,000.

  About Us







  Jefferies is a leading global, full-service investment
  banking and capital markets firm that provides advisory,
  sales and trading, research, and wealth and asset management
  services. With more than 40 offices around the world, we
  offer insights and expertise to investors, companies, and
  governments.



  At Jefferies, we are committed to building a culture that
  provides opportunities for all employees regardless of our
  differences and supports a workforce that is reflective of
  the communities where we work and live. As a result, we are
  able to pool our collective insights and intelligence to
  provide fresh and innovative thinking for our clients.



  Jefferies is committed to creating and sustaining a
  workforce that welcomes individuals from all backgrounds to
  apply. Our employment decisions are made without regard to
  race, creed, color, national origin, ancestry, religion,
  pregnancy, age, medical condition, physical or mental
  disability, marital status, domestic partner status, sex,
  sexual orientation, gender, gender identity or expression,
  veteran or military status, genetic information,
  reproductive health decisions, or any other factor protected
  by applicable law. We are committed to hiring the most
  qualified applicants and complying with all federal, state,
  and local equal employment opportunity laws. As part of this
  commitment, Jefferies will extend reasonable accommodation
  to individuals with disabilities, as required by applicable
  law.





  The salary offered will take into consideration an
  individual’s experience level and qualifications. In
  addition to salary, Jefferies Financial Group is proud to
  offer a comprehensive benefits package to eligible, full-
  time employees or part-time employees, who are scheduled to
  work at least 30 hours or more per week, including an annual
  discretionary incentive and retention bonus, competitive
  employee benefits, including: medical, dental & vision
  coverage; 401(k); life, accident, and disability insurance;
  and wellness programs. Jefferies also offers paid time off
  packages that include planned time off (e.g., vacation),
  unplanned time off (e.g., sick leave), and paid holidays,
  and for full-time employees, paid parental leave.
