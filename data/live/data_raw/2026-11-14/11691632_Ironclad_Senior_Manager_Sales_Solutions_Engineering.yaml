description: |
  Ironclad is the leading AI contracting platform that
  transforms agreements into assets. Contracts move faster,
  insights surface instantly, and agents push work forward,
  all with you in control. Whether you’re buying or selling,
  Ironclad unifies the entire process on one intelligent
  platform, providing leaders with the visibility they need to
  stay one step ahead. That’s why the world’s most
  transformative organizations, from Rivian to the World
  Health Organization and the Associated Press, trust Ironclad
  to accelerate their business.

  We’re consistently recognized as a leader in the industry: a
  Leader in the Forrester Wave and Gartner Magic Quadrant for
  Contract Lifecycle Management, a Fortune Great Place to
  Work, and one of Fast Company’s Most Innovative Workplaces.
  Ironclad has also been named to Forbes’ AI 50 and Business
  Insider’s list of Companies to Bet Your Career On. We’re
  backed by leading investors including Accel, Y Combinator,
  Sequoia, BOND, and Franklin Templeton. For more information,
  visit www.ironcladapp.com or follow us on LinkedIn.

  The Technical PreSales team at Ironclad collaborates closely
  with prospective customers and Ironclad’s Sales,
  Implementation, and Product teams, forming a critical
  technical overlay to the solution evaluation process. As the
  Senior Manager of Solutions Engineering, you will play a
  pivotal role in driving the success of our sales efforts.
  You will lead a team of highly skilled Solutions Engineers
  (SEs) and will be responsible for enabling them to support
  Enterprise Account-sized deal cycles effectively. The ideal
  candidate will have a deep understanding of AI and SaaS
  sales cycles as well as Ironclad products and services,
  extensive experience in solution sales and a proven track
  record of building and leading successful solutions
  engineering teams.

  What You Will Be Doing:

  - Build, lead, and mentor a high-performing Enterprise
    solutions engineering team.
  - Foster a collaborative and innovative team culture which is
    positive, motivating, and performance-driven.
  - Serve as a subject matter expert in supporting the
    Enterprise Sales team throughout the sales cycle, ensuring
    technical alignment with customer needs.
  - Work closely with Sales leadership to understand business
    goals and develop a strategy for solutions engineering
    support in deal cycles.
  - Empower your team with scalable systems and repeatable
    processes to increase SE’s skills, product, industry
    knowledge, and professional habits.
  - Track and report key growth metrics to assess individual and
    team performance, and find innovative and creative ways to
    improve and increase performance.
  - Collaborate with cross-functional teams to align SE efforts
    with overall business objectives and company priorities.
  - Foster strong collaboration with other departments,
    including Product Management, Engineering, and Customer
    Success, to drive a unified customer experience.
  - Bring actionable insights back to Ironclad’s Product Team to
    help us evolve our platform.
  - Help Ironclad scale through external and internal education
    and enablement efforts. Share your knowledge!

  Key Skills: • Excellent communication and presentation
  skills. • Proven track record of successfully supporting
  deal cycles through to close-won. • Strong understanding of
  current AI technology as well as the current CLM, CRM and
  ERP software landscape. • Experience hiring, motivating, and
  developing a team. • 2+ years of experience leading an
  Enterprise solutions engineering team, preferably in an AI
  or B2B SaaS setting. • Proven ability to work with technical
  and non-technical teams, and ability to translate technical
  concepts into business value. • Strong listening and ability
  to understand customers' needs. You think outside the box to
  solve their challenges and deliver a solution that will
  drive value for the customer. OTE Range: $220,000 - $280,000
  (70/30 split) (base + variable) +equity

  The OTE range represents the minimum and maximum of the OTE
  range for this position based at our San Francisco
  headquarters. The OTE offered for this position will depend
  on numerous factors, including individual proficiency,
  anticipated performance, and the location of the selected
  candidate. Our OTE is just one component of Ironclad’s
  competitive total rewards package, which also includes
  equity awards (a new hire grant, along with opportunities
  for additional awards throughout your tenure), competitive
  health and wellness benefits, and a commitment to career
  growth and development. Pursuant to the San Francisco Fair
  Chance Ordinance, we will consider for employment qualified
  applicants with arrest and conviction records.

  US Full-Time Employee Benefits at Ironclad:

  - 100% health coverage for employees (medical, dental, and
    vision), and 75% coverage for dependents with buy-up plan
    options available
  - Market-leading leave policies, including gender-neutral
    parental leave and compassionate leave
  - Family forming support through Maven for you and your
    partner
  - Paid time off - take the time you need, when you need it
  - Monthly stipends for wellbeing, hybrid work, and (if
    applicable) cell phone use
  - Mental health support through Modern Health, including
    therapy, coaching, and digital tools
  - Pre-tax commuter benefits (US Employees)
  - 401(k) plan with Fidelity with employer match (US Employees)
  - Regular team events to connect, recharge, and have fun
  - And most importantly: the opportunity to help build the
    company you want to work at

  **UK Employee-specific benefits are included on our UK job
  postings

  Pursuant to the San Francisco Fair Chance Ordinance, we will
  consider for employment qualified applicants with arrest and
  conviction records.
