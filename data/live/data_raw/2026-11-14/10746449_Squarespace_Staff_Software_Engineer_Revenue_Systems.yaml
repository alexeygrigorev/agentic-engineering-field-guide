description: |
  Squarespace is seeking a talented Staff Software Engineer to
  support and evolve the systems at the core core of our
  monetization platform: billing, payments and orders. In this
  role, you will provide technical oversight over the critical
  monetization machinery that accepts orders, processes
  payments and bills subscriptions. You will regularly
  collaborate with engineering leadership and key product,
  strategy and finance stakeholders to align technical
  strategy with Squarespace’s business objectives. This is an
  opportunity to take on IC technical leadership
  responsibilities and own system architecture for high-
  visibility initiatives tied directly to Squarespace's core
  businesses.

  This role is open to remote or hybrid working from our NYC
  office 3 days per week. You will report to the Director of
  Revenue Systems.

  You'll Get To...

  - Own system architectural vision and design for critical
    areas of our business.
  - Transform high-level system vision into estimated project
    plans for initiatives central to Squarespace’s strategy.
  - Serve as technical lead and cross-functional liaison on
    business-critical projects, making and defending
    engineering decisions key to the success of the business.
  - Mentor engineers on the team to deliver ever greater quality
    with ever growing autonomy.
  - Drive best practices for engineering excellence and
    technical leadership, influence design reviews, question
    assumptions, point out pitfalls and foster shared
    understanding
  - Set the engineering quality bar for the team through
    regular, high-quality code contributions across billing,
    orders and payments.

  Who We're Looking For

  - 10 or more years experience specifying, delivering and
    maintaining complex distributed backend services.
  - Significant experience with multiple programming languages
    (especially Java) and a broad range of tools like
    Springboot, hibernate, databases, etc.
  - Demonstrated experience leading system architecture
    decisions across multiple teams or initiatives
  - Proven ability to serve as a technical lead on cross-
    functional projects, aligning engineering and business
    goals without sacrificing engineering quality
  - Experience working with billing, orders or payment systems
    at scale

  Benefits & Perks

  - A choice between medical plans with an option for 100%
    covered premiums including medical, dental, and vision
  - Supplemental Life and Disability Insurance plans
  - Fertility and adoption benefits
  - Headspace mindfulness app subscription
  - Global Employee Assistance Program
  - Retirement benefits with employer match
  - Flexible paid time off
  - 12 weeks paid parental leave and family care leave
  - Pretax commuter benefit
  - Education reimbursement
  - Employee donation match to community organizations
  - 7 Global Employee Resource Groups (ERGs)
  - Dog-friendly workplace
  - Free lunch and snacks
  - Private rooftop
  - Hack week twice per year

  Cash Compensation Range: $170,000 - $299,000 USD

  The base salary for this position will vary based on job-
  related criteria including relevant skills, experience, and
  location, among other factors.

  In addition to the cash compensation above (which includes
  base salary and, where applicable for eligible roles, may
  include overtime pay), Squarespace employees are eligible to
  be granted an option to purchase our common stock. Sales
  positions generally offer a competitive On Target Earnings
  (OTE) incentive structure in addition to base salary.

  About Squarespace

  Squarespace is a design-driven platform helping
  entrepreneurs build brands and businesses online. We empower
  millions of customers in more than 200 countries and
  territories with all the tools they need to create an online
  presence, build an audience, monetize, and scale their
  business. Our suite of products range from websites,
  domains, ecommerce, and marketing tools, as well as tools
  for scheduling with Acuity and creating and managing social
  media presence with Bio Sites and Unfold. Our team of more
  than 1,700 is headquartered in New York City, with offices
  in Dublin, Ireland, and Aveiro, Portugal. For more
  information about our company, visit
  https://www.squarespace.com/about/careers.

  Our Commitment

  Today, more than a million people around the globe use
  Squarespace to share different perspectives and experiences
  with the world. Not only do we embrace and celebrate the
  diversity of our customers, but we also work toward the same
  in our employees. At Squarespace, we are committed to equal
  employment opportunity regardless of race, color, ethnicity,
  ancestry, religion, national origin, gender, sex, gender
  identity or expression, sexual orientation, age,
  citizenship, marital or parental status, disability, veteran
  status, or other class protected by applicable law. We are
  proud to be an equal opportunity workplace.

