description: |
  We are Builders FirstSource, America’s largest supplier of
  building materials, value-added components and building
  services to the professional market. You’ll feel proud of
  the work you do here every day to transform the future of
  home building and help make the dream of home ownership more
  achievable. At BFS, we believe building a successful career
  is not solely defined by a degree. Your experience, skills,
  and passion are just as important, if not more so. As such,
  we are committed to creating a diverse and inclusive
  workplace that welcomes candidates from all backgrounds and
  experience levels.



  PURPOSE

  Builders FirstSource (BFS) is embarking on a multi-year
  business transformation that will enable us to outperform
  our competition and enable industry transformation.  In
  connection with this initiative, BFS will harmonize our core
  operations on SAP S/4HANA Private Cloud.



  The Lead Engineer of SAP S/4HANA Financials serves as the
  functional and technical lead and subject matter expert for
  Record to Report (RTR), with a concentration on the COPA
  (Controlling/Profitability Analysis) sub-workstream. In this
  role, you will set workstream direction, coordinate cross-
  functional delivery, mentor team members, and drive high-
  quality solutions while influencing stakeholders within and
  outside the IT department and making a significant impact on
  our business.



  The candidate will be responsible for the design,
  configuration, implementation, testing and control of the
  financial systems and applications.   While the focus is on
  COPA, responsibilities could involve other areas of RTR
  including the following: Accounts Payable, Accounts
  Receivable, Treasury, General Ledger, Fixed Assets,
  Financial Planning & Analysis (FP&A), Tax (Vertex),
  Portfolio & Project Management (PPM), and Project Systems.





  ESSENTIAL DUTIES AND RESPONSIBILITIES



  - Typically leads SAP Financial SAP S/4HANA projects from end-
    to-end through delegation, review, and driving results
    holistically; leads medium complexity features from
    technical design through completion.
  - Owns the RTR workstream delivery plan, establishes
    priorities and milestones, coordinates dependencies,
    identifies resource needs, and drives timely resolution of
    risks, issues, and decisions.
  - Provides day-to-day functional leadership to employees,
    contractors, and implementation partners by assigning
    work, clarifying expectations, monitoring progress, and
    holding contributors accountable for quality and delivery
    commitments.
  - Leads solution design reviews and serves as the escalation
    point for complex SAP Financials decisions, ensuring
    designs are scalable, supportable, compliant with
    enterprise standards, and aligned with the S/4HANA
    roadmap.
  - Facilitates alignment across Finance, IT, process teams, and
    business stakeholders; communicates status, tradeoffs,
    risks, and recommendations to leadership and drives
    decisions to closure.
  - Reviews and approves functional specifications,
    configuration, test strategies, defect resolutions,
    cutover activities, and support-readiness deliverables for
    the assigned workstream.
  - Coaches and mentors functional and technical team members,
    promotes knowledge transfer and consistent delivery
    practices, and supports capability development across the
    SAP Financials team.
  - Provides analysis of SAP Financial processes, including
    configuration, integration, customization, master data,
    and reporting with an emphasis on asset accounting, cost
    element accounting, cost center accounting, activity-based
    accounting, product cost controlling, profitability
    analysis, and profit center accounting.
  - Contributes to documentation and sharing of knowledge and
    best practices across teams, both informally and formally
    (e.g., ad-hoc basis, internal presentations, blogs,
    newsletters).
  - Manages and partners with third party providers/ vendors/
    contractors to ensure project delivery maintains the
    quality and timeliness standards.
  - Collaborates with business stakeholders to ensure smooth
    integration of SAP FICO with other enterprise systems.
  - Implements and tests complex design changes to fix
    identified defects in existing software products.
  - Adds enhancements to new/future software releases to SAP
    S/4HANA; and assists in developing design solutions.
  - Identifies and recommends improvements to the software
    development lifecycle and best practices in agile
    engineering.
  - Apply design thinking and/or process redesign principles to
    develop innovative solutions that enhance the end-user
    experience across financial solutions, incorporating user
    feedback and insights to ensure a user-centered approach.
  - Perform business process analysis and translate business
    requirements into workable SAP solutions and/or functional
    designs for specific projects and changes, including
    development.
  - Write functional analyses for programs. Develop and execute
    functional (integration) test scripts.
  - Work closely with process teams to facilitate project
    progress and ensure integrated system solutions.
  - Collaborates with other cross functional leaders on
    business-driven IT initiatives, including enhancements and
    technical upgrades
  - Provide implementation support, preparing the business for
    system solutions.
  - Provide guidance to businesses on the appropriate use of the
    SAP system.







  SUPERVISORY RESPONSIBILITIES



  This job has no direct supervisory responsibilities. The
  role provides functional leadership for employees,
  contractors, and implementation partners, including work
  assignment, coaching, coordination, quality oversight, and
  accountability for workstream deliverables.





  MINIMUM REQUIREMENTS

  To perform this job successfully, an individual must be able
  to perform each essential duty satisfactorily. The
  requirements listed below are representative of the
  knowledge, skill, and/or ability required.



  - Bachelor’s degree in Finance, Accounting, Computer Science,
    or related field.
  - 5-7 years of experience of overseeing configuration of SAP
    Financials including FI & CO
  - Multiple full-life cycle SAP implementations (ECC 6.0 or
    S/4HANA)
  - Strong experience with designing, configuring and supporting
    following RTR areas within SAP is a must
    - Product costing (Master data set up, Costing variants,
      Costing run, templates & overheads, Variance
      calculations, WIP, Settlements, Actual & Alternate
      valuation, PUP calculation…)
    - COPA (Operating Concern, COPA structure, mapping, derivation
      rules, valuation strategy, integration of Product
      costing to COPA, COPA assessments…)
    - Fixed Assets (Org Structure, Charts of Depreciation,
      Depreciation Keys, Assets transactions…)
  - Knowledge of integration with other SAP modules (MM, SD….)
    is a must
  - Experience with Project Systems configuration will be a plus
  - Or equivalent combination of education and experience.





  COMPETENCIES



  - Evaluates Problems: Evaluates and analyzes different types
    of information objectively to identify appropriate
    solutions; writes fluently, establishing the key facts
    clearly and interprets numerical data effectively.
  - Technical Communication/ Presentation: Communicates with
    clarity and precision, presenting complex information in a
    concise format that is audience appropriate.
  - Adjusting and Driving Change: Takes a positive approach to
    tackling work and embraces change; invites feedback
    relating to performance and deals constructively with
    criticism. Identifies the need for and drives change when
    required to achieve objectives.
  - Focuses on Customers: Understands and anticipates customer
    needs and takes action to provide high-quality products
    and services to exceed expectations.
  - Demonstrates Business Acumen: Demonstrates working knowledge
    of market, economic, legal, and regulatory environments
    and how they impact the business.
  - Agile Best Practices: Understands how agility is leveraged
    in IT ways of working. Adopts agile best practices as
    appropriate throughout the assigned work lifecycle.
    Responds to feedback quickly based on comments of internal
    and external customers and needs of the market.
  - Bias for Action: Takes initiative and identifies what needs
    to be done and acts without waiting to be asked. Executes
    work in a timely manner. Suggests improvements to current
    ways of working.





  BFS COMPETENCIES



  - Business and Financial Acumen
    - Demonstrates depth of understanding for the P&L and
      financial analysis
    - Teaches business and financial acumen to others.
    - Understands KPIs and how BFS makes money.
    - Knows the different business segments and how they relate to
      one another.
    - Understands customer sales and engagement.
    - Demonstrates functional and/or technical expertise.
    - Understands complex issues and demonstrates problem solving
      skills.
    - Understands how to maximize business results regardless of
      industry cycle.
  - Results Driven
    - Holds self and others accountable.
    - Communicates and sets clear goals with plans to deliver.
    - Manages competing priorities effectively.
    - Demonstrates appropriate urgency.
    - Drives to exceed expectations in alignment with our BFS
      SPICE values.
    - Embraces and follows best practices.
    - Demonstrates self-starter, can-do attitude.
  - Strategic Thinking and Decision Making
    - Leverages resources and teams around them to solve problems
      and create mutually beneficial outcomes.
    - Demonstrates willingness and courage to make tough decisions
      in a timely manner.
    - Balances short-and-long term priorities
    - Demonstrates proactive versus reactive thinking.
    - Asks questions to identify root cause and analyze situations
      more accurately.
  - Servant Leadership
    - Demonstrates humility by putting others first.
    - Builds trust-based relationships.
    - Leads by example with kindness and respect.
    - Collaborates well across all areas of the business.
    - Advocates for others
    - Actively listens to understand the meaning and intent of
      what the other person is communicating.
    - Demonstrates authenticity and encourages others to do the
      same.
  - Emotional Intelligence
    - Demonstrates situational awareness – knows when and how to
      adjust leadership style in different situations.
    - Demonstrates self-awareness – understands strengths and
      weaknesses.
    - Demonstrates empathy – puts themselves in other’s shoes.
    - Assumes positive intent.
  - Develops and Leads Others
    - Drives alignment through clear communication of vision,
      goals, and expectations.
    - Invests time on a regular basis in performance feedback and
      developmental conversations.
    - Fosters a respectful and inclusive environment.
    - Empowers, motivates, and inspires others.
    - Coaches and mentor others for their development.
    - Guides and persuades others to deliver positive outcomes.
  - Growth Mindset
    - Demonstrates a growth mindset; takes appropriate risks,
      fails fast and forward, learns from mistakes.
    - Perseveres and champions growth, even in the face of
      resistance, ambiguity, or possible failure.
    - Thinks like an owner with an entrepreneurial spirit.
    - Demonstrates and encourages intellectual curiosity.
    - Continuous learner; seeks opportunities and knowledge for
      personal and professional growth.
    - Sees possibilities over problems – actively seeks solutions.
  - Innovation
    - Encourages out-of-the box thinking to create new ways of
      doing things.
    - Continuously seeks to improve and simplify pain points in
      the business.
    - Anticipates, embraces, and leads change.
    - Develops and executes breakthrough strategies.
  - Integrity
    - Does the right thing even under challenging circumstances?
    - Communicates with honesty.
    - Consistently treats others fairly and equitably.
    - Demonstrates reliability and does what they say they will
      do.
    - Conducts tough conversations and delivers difficult messages
      with kindness and respect.



  WORK ENVIRONMENT / PHYSICAL ACTIVITY

  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.



  - Subject to both typical office environment and outside
    locations with temperature and weather variations.
  - Must be able to lift and carry up to 25 pounds.
  - Ability to travel up to 40% during the multi-year business
    transformation, will likely shift down to 20% after
    initial business transformation is complete.



