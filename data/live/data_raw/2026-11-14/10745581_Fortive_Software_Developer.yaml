description: |
  Our Developers bring passion, craftsmanship and innovation
  to the development and delivery of Intelex’s software
  products, with the objective of delighting our customers and
  empowering them with industry-leading capabilities and UX.
  They collaborate with their peers within an agile (Scrum /
  Kanban) practice. Our team is moving toward a continuous
  integration / continuous deployment (CI/CD) model and DevOps
  as a culture. We work with a range of web applications
  technologies, including JavaScript frameworks (ReactJS /
  Webpack) as well as Microsoft technologies (C#, Azure, .NET,
  SQL)

  Responsibilities and Deliverables

  - Design and develop new features and solutions that support
    customer use cases in existing and new software products.

  - Work in an agile team environment that practices continuous
    improvement when planning, estimating and building
    software.

  - Deliver on sprint commitments by working proactively with
    stakeholders to identify and navigate obstacles.

  - Build high-performing software with an evolving set of tools
    across several technology stacks and participate in the
    stewardship of our development process.

  - Collaborate with cross-functional project teams including
    Architects, QA, Product Management, and others to delight
    our clients.

  Skills & Work Traits

  - Passionate about understanding our clients.

  - Proactive, creative and self-directed with a commitment to
    excellence.

  - Committed to continuous learning and the craft of software
    development.

  - Effective analysis and troubleshooting skills, and
    persistence in solving problems.

  - Active interest and participation in DevOps as a culture.

  - Excellent written and oral communication skills, and
    participation in a culture of writing things down.

  - Committed to building high quality, secure, performant
    product and willing to pursue new learning in these areas.

  Technical Competencies

  - Experience developing large scale web applications.

  - Full stack development across different technical stacks
    including React, Typescript, Node.js and cloud (AWS) or
    equivalent.

  - Experience with NoSQL database like MongoDB.

  - A solid understanding of user interface (UI) and user
    experience (UX) principles.

  - A solid understanding of object-oriented programming.

  - Self-guided learning of new tools, technologies and stacks.

  Experience

  - Three or more years of professional web application
    development experience for intermediate candidates.
  - Professional experience within an agile development
    practice.

  Education

  Bachelor’s Degree or College Diploma in Computer Science,
  Information Systems or equivalent experience.

  Preferred:

  Master’s Degree and/or vendor certifications (such as
  Microsoft Certified Professional) valued.

  Other Requirements

  Please note that this role requires a satisfactory Criminal
  Background Check and Public Safety Verification

  About Us

  Fortive Corporation Overview

  Fortive’s essential technology makes the world stronger,
  safer, and smarter. We accelerate transformation across a
  broad range of applications including environmental, health
  and safety compliance, industrial condition monitoring,
  next-generation product design, and healthcare safety
  solutions.

  We are a global industrial technology innovator with a
  startup spirit. Our forward-looking companies lead the way
  in software-powered workflow solutions, data-driven
  intelligence, AI-powered automation, and other disruptive
  technologies. We’re a force for progress, working alongside
  our customers and partners to solve challenges on a global
  scale, from workplace safety in the most demanding
  conditions to groundbreaking sustainability solutions.

  We are a diverse team 18,000 strong, united by a dynamic,
  inclusive culture and energized by limitless learning and
  growth. We use the proven Fortive Business System (FBS) to
  accelerate our positive impact.

  At Fortive, we believe in you. We believe in your
  potential—your ability to learn, grow, and make a
  difference.

  At Fortive, we believe in us. We believe in the power of
  people working together to solve problems no one could solve
