  At Fortive, we believe in growth. We’re honest about what’s
  working and what isn’t, and we never stop improving and
  innovating.

  Fortive: For you, for us, for growth.

  About the Team

   About Intelex



   Trusted Since 1992, Intelex Technologies, ULC. is a global
  leader in the development and support of software solutions
  for Environment, Health, Safety and Quality (EHSQ) programs.
  Our scalable, web-based software provides clients with
  unprecedented flexibility in managing, tracking and
  reporting on essential corporate information. Intelex
  software easily integrates with common ERP systems like SAP
  and PeopleSoft creating a seamless solution for enterprise-
  wide information management. Intelex’s friendly,
  knowledgeable staff ensures our almost 1400 clients and over
  3.5 million users from companies across the globe get the
  most out of our groundbreaking, user-friendly software
  solutions. Visit www.intelex.com to learn more.



