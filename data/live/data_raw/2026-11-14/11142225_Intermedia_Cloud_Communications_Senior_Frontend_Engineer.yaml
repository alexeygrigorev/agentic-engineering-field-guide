description: |
  About Intermedia Are you looking for a company where YOUR
  VOICE is heard? Where can you MAKE A DIFFERENCE? Do you
  THRIVE in a FAST-PACED work environment? Do you wake every
  morning EXCITED to work with GREAT PEOPLE and create SUCCESS
  TOGETHER? Then Intermedia is the place for you. Intermedia
  has established itself as a leading provider of cloud
  communications and collaboration tech that allows companies
  to connect better. We have a strong track record of growth,
  profitability, and creating an environment where everyone
  matters. Everyone. While we are fast-paced and admittedly a
  bit intense, we promise that you won’t be bored. You will
  find Intermedia is a place where you can indulge your
  passion for creating and supporting great cloud technology.
  What’s more, we always look to promote from within and have
  many employees who have been with us 10, 15, and 20+ years!
  Culture at Intermedia is built on teamwork and transparency.
  We hold each other accountable and always have each other’s
  back! While primarily remote, this role requires occasional
  visits to the Bristol office or London.

  Are you ready to make your mark?

  About the Role  In this role, you will solve challenging
  frontend engineering problems involving real-time
  conversations, dynamic interactions and embedded
  experiences. As a senior technical contributor, you will
  influence frontend architecture and technical direction,
  lead complex initiatives from design through production, and
  help establish engineering standards and patterns that can
  scale across Intermedia's digital channels.

  What You Will Be Doing

  • Design, develop, test, and maintain high-quality web
  applications and frontend capabilities that power
  interactions. • Develop reusable web components and frontend
  capabilities that allow digital experiences to be embedded
  across Intermedia products and customer-facing websites. •
  Build responsive experiences for real-time including
  streaming responses, typing and processing states, long-
  running operations, errors, and interruptions. • Develop
  user experiences that clearly communicate actions, status,
  results, limitations, and requests for additional
  information. • Build interaction patterns that support rich
  conversational experiences beyond text, including structured
  content, forms, actions, links, files, and other interactive
  elements. • Develop experiences that support effective
  transitions and handoffs. • Partner with ML and backend
  engineers to define APIs, events, data contracts, and
  interaction patterns required to support digital
  experiences. • Collaborate closely with Product and UX to
  translate customer needs and design into intuitive product
  experiences. • Help define frontend architecture and
  reusable patterns digital experiences across web channels. •
  Design solutions that support configuration and
  customization of digital experiences while maintaining
  consistent engineering and UX standards. • Optimize
  applications for performance, responsiveness, scalability,
  and reliability across browsers, devices, network
  conditions, and customer environments. • Ensure digital
  experiences meet appropriate accessibility and inclusive
  design standards. • Design frontend applications with
  appropriate consideration for authentication, authorization,
  privacy, security, and protection of sensitive information.
  • Build appropriate analytics, telemetry, monitoring,
  logging, and observability into digital experiences. • Use
  product and operational data to identify performance issues
  and opportunities to improve the user experience. • Lead
  technical design discussions and provide guidance on complex
  frontend engineering decisions. • Conduct code and design
  reviews and help establish strong standards for frontend
  architecture, code quality, testing, performance, and
  maintainability. • Troubleshoot complex production issues
  spanning frontend applications, APIs, real-time
  interactions, and enabled experiences. • Mentor and coach
  engineers and contribute to raising frontend engineering
  capabilities across the team. • Lead complex frontend
  initiatives from concept and technical design through
  implementation, deployment, and continuous improvement. •
  Stay current with emerging technologies and engineering
  approaches related to frontend development and
  conversational interfaces.

  What You Will Bring to the Role

  • Bachelor's degree in Computer Science, Software
  Engineering, or a related technical field, or equivalent
  practical experience. • 8+ years of professional software
  engineering experience, with significant experience
  developing sophisticated frontend applications. • Deep
  proficiency in JavaScript and/or TypeScript and modern
  frontend frameworks such as React or Angular. • Strong
  knowledge of HTML, CSS, responsive design, browser
  technologies, and modern web application architecture. •
  Demonstrated experience designing and building complex,
  interactive web applications used in production
  environments. • Strong understanding of frontend
  architecture, component design, state management,
  application performance, and maintainability. • Experience
  designing reusable frontend components, libraries, or
  application frameworks. • Experience integrating frontend
  applications with RESTful APIs, asynchronous services, and
  distributed backend systems. • Experience building real-
  time, asynchronous, or event-driven user experiences. •
  Strong understanding of automated frontend testing and
  modern software engineering practices. • Experience
  designing applications for performance, scalability,
  reliability, and production support. • Strong understanding
  of web accessibility, responsive design, browser
  compatibility, and frontend security. • Experience with
  CI/CD, source control, code reviews, observability, and
  modern software delivery practices. • Demonstrated ability
  to independently lead complex technical initiatives from
  design through production. • Strong problem-solving skills
  and the ability to navigate ambiguous and evolving technical
  requirements. • Experience providing technical guidance,
  code review, or mentorship to other engineers. • Strong
  communication and collaboration skills with the ability to
  influence technical decisions and work effectively across
  Product, UX, frontend, backend, ML, and platform teams. •
  Working understanding of Agile development methodologies and
  frameworks.

