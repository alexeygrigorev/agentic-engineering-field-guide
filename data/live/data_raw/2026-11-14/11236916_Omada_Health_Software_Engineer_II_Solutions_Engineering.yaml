description: |
  Omada Health is on a mission to bend the curve of chronic
  disease.

  Job overview:

  Omada Health is a digital care provider that empowers people
  to achieve their health goals through sustainable behavioral
  change.

  We’re looking for a software engineer to join our Solutions
  Engineering Team. Our primary function is to understand
  customer challenges, design tailored technical solutions
  using Omada's products and systems, and demonstrate the
  value and feasibility of those solutions.

  Your Impact:

  - Build to eliminate the toil. Design, build, and ship home-
    grown and integrated tooling that removes repetitive,
    manual work — file processing, migrations,
    eligibility/contracting/billing edge cases, and the
    “papercuts” that slow the team down. You’ll own
    enhancements and moderate-complexity features within our
    automations and integrations, partnering with commercial,
    product, and engineering stakeholders along the way. For
    work that requires deep architectural change or spans many
    systems, you’ll work alongside the senior engineers and
    system owners driving that design.
  - See the pain, then help fix it. Sit close enough to
    implementations and escalations to understand root causes,
    and contribute to root-cause investigations — flagging
    when a fix should prevent the fire rather than just put it
    out.
  - Build with reuse in mind. Use and extend the team’s existing
    templates, standards, and automation rather than
    defaulting to one-off customization.
  - Use AI to move faster. Use AI-assisted development and
    modern automation in your day-to-day work to deliver
    solutions more quickly.
  - Grow your craft. Pair with more senior engineers to build
    proficiency across SET’s varied stack, and treat feedback
    on scope, design, and code quality as a core part of how
    you improve.
  - Participate in our on-call rotation; triage and address
    issues that come up supporting members, ensuring timely
    resolutions and assisting internal teams in their
    investigations.

  About you:

  - 3–5 years writing readable, tested, and efficient production
    code
  - We primarily use Ruby on Rails and are especially interested
    in candidates with strong Rails experience, but we're also
    open to exceptional backend engineers in other languages
    who are excited to ramp quickly on Rails.
  - Experience with a relational database (PostgreSQL)
  - Experience building and consuming APIs and integrations
    across service boundaries
  - Fluency with AI-assisted development — you use AI coding
    assistants in your day-to-day work and have a thoughtful,
    quality-conscious point of view on where they help and
    where they don't
  - Experience with workflow-automation platforms (e.g., Tines,
    n8n, or similar) and building API-driven automation
    workflows
  - A track record of shipping measurable improvements to well-
    defined problems, with the communication skills to
    translate between business needs and technical reality
  - Solid debugging and optimization skills
  - Strong grasp of SDLC processes and frameworks
  - Comfort ramping onto unfamiliar codebases with support, and
    the judgment to know when to consult the engineers who own
    a system.

  Bonus Points for:

  - Experience with a modern front-end framework (React, Vue)
  - Healthcare or other regulated / data-sensitive domain
    experience
  - Exposure to a solutions engineering, implementation, or
    customer-facing technical environment (internship,
    rotation, or project work counts)

  Benefits:

  - Competitive salary with generous annual cash bonus
  - Equity grants
  - Employee stock purchasing plans (ESPP)
  - Remote first work from home culture
  - Flexible Time Off to help you rest, recharge, and connect
    with loved ones
  - Generous parental leave
  - Health, dental, and vision insurance (and above market
    employer contributions)
  - 401k retirement savings plan
  - Lifestyle Spending Account (LSA)
  - Mental Health Support Solutions
  - ...and more!

  It takes a village to change health care. As we build
  together toward our mission, we strive to embody the
  following values in our day-to-day work. We hope these hold
  meaning for you as well as you consider Omada!

  - Cultivate Trust. We listen closely and we operate with
    kindness. We provide respectful and candid feedback to
    each other.
  - Seek Context. We ask to understand and we build connections.
    We do our research up front to move faster down the road.
  - Act Boldly. We innovate daily to solve problems, improve
    processes, and find new opportunities for our members and
    customers.
  - Deliver Results. We reward impact above output. We set a
    high bar, we’re not afraid to fail, and we take pride in
    our work.
  - Succeed Together. We prioritize Omada’s progress above team
    or individual. We have fun as we get stuff done, and we
    celebrate together.
  - Remember Why We’re Here. We push through the challenges of
    changing health care because we know the destination is
    worth it.

  About Omada Health: Omada Health (Nasdaq: OMDA) is reverse
  engineering the way healthcare is delivered in America,
  putting the space between doctor visits–where health is won
  or lost–at the center of care. Today's healthcare system
  poorly serves chronic conditions that require ongoing
  support outside of the exam room, like obesity, diabetes,
  hypertension, cholesterol, and musculoskeletal conditions.
  Omada’s virtual-first model combines human-led care teams,
  connected devices, and AI-enabled technology to deliver
  personalized care at scale, including support for GLP-1
  therapy. Omada has served more than two million members
  since launch across 2,000+ employers, health plans, pharmacy
  benefit managers, and health systems. Learn more at
  omadahealth.com.

