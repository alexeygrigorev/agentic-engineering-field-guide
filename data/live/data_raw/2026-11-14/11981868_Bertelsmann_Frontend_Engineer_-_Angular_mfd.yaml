description: |
  Company Description

  Everyone’s story matters. Come shape your story with us at
  Riverty. But where does that take you?

  To one of our 30 hybrid workspaces – designed for exchanging
  ideas, learning from others, and shaping the way we work. An
  international community of over 4,000 people, representing
  almost 80 nationalities across 11 countries. United by one
  mission: Combining empathy, advanced technology and data-
  driven insights to keep people and businesses in flow. With
  payments made for them. So that they don’t have to worry
  about it.

  And there’s more. We are part of the family-owned
  Bertelsmann group. Established. Corporate. In a fast-paced
  industry. We enable flexible payments in various industries,
  simplifying the financial management of known brands and
  helping people repay debt to build financial confidence. In
  short: shaping FinTech.



  Job Description

  We are looking for a

  Frontend Engineer (Angular) (m/f/d)

  (unlimited, full-time contract) Join our team at our
  location in Berlin to build the next generation fintech.

  Hybrid working conditions available.



  Work together with our skilled design, product and backend
  colleagues with the common goal to deliver a truly unique
  customer and merchant experience that people will love. You
  will be part of a new and quickly growing product & tech
  organisation, having the opportunity to shape our new teams
  as well as build the next revolutionary products.

  We have a strong commitment to building the future of
  FinTech — human-centric and sustainable. With investments to
  back it up.



  Your key responsibilities:

  - You design, build and maintain ambitious web applications as
    part of a cross-functional team, located at our European
    sites
  - You participate to design, build, and maintain a company-
    wide platform for interface design and development
  - You are part of a cross functional product team and
    therefore attend regular scrum ceremonies
  - You adapt new technical trends in web application to support
    product’s quality
  - You take initiative to improve quality across different
    aspects of frontend: accessibility, performance,
    consistency, maintainability, robustness, etc.



  Qualifications

  What you bring:

  - 4+ years of professional experience in frontend development,
    with strong hands-on experience in Angular and TypeScript.
  - Experience building scalable, responsive web applications
    and reusable UI components.
  - Good understanding of Angular architecture, component-based
    development, and reactive programming.
  - Experience integrating frontend applications with backend
    APIs.
  - Familiarity with frontend testing, debugging, and code
    quality practices.
  - Understanding of web performance, accessibility, and cross-
    browser compatibility.
  - A collaborative mindset, ownership of your work, and an
    interest in continuously improving how we build software.
  - Hands-on experience with AI-assisted development tools such
    as Claude, Cursor, or GitHub Copilot, and sound judgement
    about reviewing and testing what they produce.
  - Fluent English; German is a plus.



  Please note: you need to have EU citizenship or a valid work
  permit for Germany.



  Additional Information



  Disclosure requirements pertaining to the collection of your
  personal data:

  Responsible for processing the information provided in your
