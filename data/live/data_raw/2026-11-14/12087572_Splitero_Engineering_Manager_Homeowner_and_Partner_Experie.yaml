description: |
  About the Job

  As the Engineering Manager for Homeowner and Partner
  Experiences at Splitero, you will lead the team responsible
  for the systems our homeowners and partners interact with,
  from marketing through origination, in a fintech and
  proptech ecosystem. You will report to our Director of
  Engineering and manage a team of full-stack engineers,
  including a technical lead who partners with you on day-to-
  day technical decisions. You will work closely with product,
  QA, our Salesforce team, and our offshore engineering team.

  In this role, you'll split your time roughly 70/30 between
  hands-on engineering and people management. Your hands-on
  focus leans toward the foundation: cloud infrastructure, AWS
  CDK, security, and observability, making sure our systems
  are scalable, maintainable, and ready for where the business
  is going, not just where it is today. We're actively shaping
  what AI-first engineering looks like for this team, and this
  role will have a direct hand in defining it. You'll help us
  find the right balance between what LLMs do well and the
  quality, review, and maintainability standards a regulated
  fintech business requires. We care about what ships, and we
  care nearly as much about the systems that produce it.

  - Own the architecture and evolution of our AWS infrastructure
    using AWS CDK, making sure our systems scale well beyond
    today's business needs.
  - Drive security, observability, and reliability across our
    systems, including logging, monitoring, alerting, and
    incident response practices.
  - Optimize AWS services for performance, cost, and
    scalability, including serverless applications built on
    AWS Lambda.
  - Help define and roll out AI-first engineering practices for
    the team: the tooling, context, conventions, guardrails,
    and review processes that let engineers build with AI
    tools reliably and at scale.
  - Build internal tools and workflows that reduce manual
    engineering effort and help the team get consistent, high-
    quality output from AI-assisted development.
  - Contribute to product development across our homeowner and
    partner experiences using Node.js, TypeScript, PostgreSQL,
    and a modern React ecosystem (Next.js, Tailwind, Vercel).
  - Partner with your technical lead to guide technical
    decisions, making sure tradeoffs are well understood and
    documented across product and engineering.
  - Improve engineering lifecycle standards across the team,
    including code review, testing, deployment, documentation,
    and knowledge sharing.
  - Manage and develop a team of full-stack engineers through
    regular 1:1s, feedback, goal setting, and performance
    management.
  - Partner with product leads to plan work, set priorities, and
    deliver on a consistent and predictable pace.
  - Partner with the Salesforce team on the data sync between
    Salesforce and our consumer applications to support GTM
    initiatives.
  - Coordinate with our offshore engineering team and its
    technical lead to keep handoffs clean and work aligned
    with our standards.
  - Partner with Engineering Leadership and People Operations to
    hire, onboard, and grow the engineering team.

  The salary range for this position is $160,000 - $180,000.
  Within the range, individual pay is determined by job-
  related skills, experience, and relevant education or
  training.

  About You

  - 8+ years of experience as a full-stack or platform engineer
    with a strong focus on back-end and cloud infrastructure
  - 3+ years managing engineers directly while remaining hands-
    on
  - Deep experience with AWS, including production
    infrastructure built and maintained with AWS CDK
  - Strong background in cloud security, observability, and
    building systems that scale and stay maintainable over
    time
  - Strong proficiency in TypeScript and Node.js, with
    experience in PostgreSQL and database design
  - Working experience with a modern React ecosystem (Next.js,
    Tailwind, Vercel)
  - Demonstrated experience leading AI-first engineering
    practices on a team, not just using AI tools individually.
    You know where LLMs speed up the work, where they need
    guardrails, and how to keep quality high as output
    increases.
  - Experience building internal tooling, automation, or
    developer workflows that help teams work more effectively
    with AI
  - Strong technical judgment, with the ability to zoom in or
    out on projects and make decisions to keep work moving
  - A track record of giving direct feedback and supporting
    engineers in their growth and performance
  - Clear communication with product, QA, and non-technical
    stakeholders
  - Experience working with offshore or distributed teams across
    time zones is a plus
  - Experience with Salesforce platforms or integrations is a
    plus
  - Candidates must be located in the United States. Working
    timezone in PST or MST preferred.
  - Desire to participate in fast-paced early-stage startup
  - Adaptability: Embraces changing circumstances with
    resiliency and positivity
  - Team-Oriented: Prioritizes collaboration, inclusivity, and
    teammate support

  About Us

  Millions of homeowners in today’s economy are sitting on
  substantial home equity they are unable to access due to
  rising interest rates and strict qualification requirements
  of traditional lenders. That means millions of homeowners
  can’t convert their hard-earned equity into cash to pay off
  debt, start a home renovation, or pad their retirement to
  better their lives.

  Splitero co-founders Michael Gifford and David Zvaifler
  witnessed the problem firsthand throughout their real estate
  careers. They set out to create a win-win product that could
  help those homeowners access their home equity but not make
  monthly payments like traditional financing options. And
  thus, Splitero was born.

  As part of our team, you will join our quest to
  revolutionize the real estate industry while helping
  families in need. We offer a suite of benefits designed to
  help you thrive in all areas of life.

  - OneTeam Culture - We foster a culture of transparency,
    innovation, and inclusivity, where every voice is heard
    and every team member is valued. We believe in celebrating
    our successes, doing the right thing, and helping each
    other so we grow as a team and as individuals.
  - Generous Resources - We want to ensure you are set up to do
    your best work. In addition to a solid tech stack, and
    access to any WeWork location, you will receive a monthly
    cell and internet stipend.
  - Premium Healthcare - We offer comprehensive healthcare plans
    for you and your family, which employees are eligible for
    on their first day.
  - Flexible PTO and Parental Leave - We offer a generous PTO
    and encourage employees to take time off to recharge.
    We're proud to offer a parental leave policy that allows
    you to welcome your new addition without worry.

  We are a workforce composed of individuals with diverse
  backgrounds, abilities, minds, and identities. In keeping
  with our commitment to inclusion, we will ensure that people
  with disabilities are provided reasonable accommodations. If
  reasonable accommodations are required when applying,
  interviewing, or performing the essential functions of this
  position, please contact People Operations, at
  peopleops@splitero.com.
