description: |
  Who We Are

  Popl is defining a new category we call In-Person Go-To-
  Market.

  We help revenue teams turn real-world interactions — trade
  shows, conferences, field events, and meetings — into
  measurable pipeline and revenue. Our AI-native platform
  powers event lead capture, enrichment, and real-time CRM
  sync, transforming every badge scan into a high-quality,
  actionable lead.

  In a world where digital channels are saturated, we're
  building the infrastructure that makes in-person GTM
  measurable, scalable, and revenue-driving. Our mission is
  simple: help companies around the world turn in-person
  events into a measurable & scalable growth channel.

  About the Role

  As a Senior Backend Engineer at Popl, you will help build
  and scale the systems that power our platform. You’ll write
  high-quality backend code, support APIs, and ensure our
  infrastructure is reliable, secure, and performant.

  You’ll take ownership of backend services, proactively
  identifying issues and opportunities for improvement while
  collaborating closely with other engineers. This role is
  ideal for a self-starter who enjoys building scalable
  systems and growing alongside a fast-moving team.

  What You’ll Do

  - Write and push code for the Popl Backend
  - Work with other engineers on using APIs, documentation and
    tests
  - Monitor logs and resolve any issues quickly
  - Collaborate with the team regarding infrastructure decisions
  - Attend daily stand ups with the engineering team (We promise
    we are fun:))
  - Learn a lot and grow with us

  What We’re Looking For

  - 4+ years of Backend Experience
  - Stack: Node.js, Typescript, AWS / Google Cloud, SQL &
    Restful APIs
  - High attention to detail
  - Experience building scaled software systems
  - Being detail oriented is a must, include “detail oriented”
    in your application
  - Excellent written and verbal communication skills.

  Nice to Haves

  - Truly enjoys writing high quality, bug free code
  - Loves meeting new people
  - Familiarity with conferences

  Why join us?

  - Be part of a rocket-ship startup redefining how
    professionals connect and grow.
  - Work closely with experienced leaders and cross-functional
    teams to shape our financial strategy.
  - Make a measurable impact in a role critical to our long-term
    success.
  - Fully remote
  - Competitive salary
  - Meaningful equity
  - Full insurance & benefits
  - Unlimited PTO
  - $150 monthly wellness credit
  - Constant daily learning

  Popl is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. We do not discriminate on the
  basis of race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, veteran
  status, or any other protected characteristic.
