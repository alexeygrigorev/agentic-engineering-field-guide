description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  *Please note, we are open to remote candidates for this
  role.

  Your Impact on our Mission

  Zocdoc's most important asset is our people. As a Staff
  Software Engineer on the Spend Management team, you will be
  the technical anchor for the platform that gives healthcare
  practices the confidence and control to spend on the Zocdoc
  Marketplace. You'll lead the architecture and development of
  flexible, self-service spend controls — moving providers off
  manual, support-mediated budget administration and onto a
  product they manage directly, with full visibility into
  their spend and ROI. This is a money-moving system, so
  correctness, reliability, and trust are at the heart of
  everything we build, directly impacting provider trust,
  marketplace spend, and a practice's ability to maximize
  their return on Zocdoc.

  You'll enjoy this role if you are…

  - Personally motivated by building systems where accuracy
    matters — where a bug isn't just a ticket, it's someone's
    money and their trust.
  - Autonomous, urgent, and creative. You genuinely love owning
    a problem end-to-end, from architectural design to launch.
  - Energized by turning a manual, internal process into a self-
    service product that customers control themselves.
  - Passionate about mentorship and leveling up the engineers
    around you.
  - A strong collaborator who can work with Product, Design,
    Analytics, and Sales to build a unified vision.
  - The kind of person who thrives on a small, focused team with
    a clear, high-impact mission.
  - Serious about your work, but not about yourself. Let's face
    it - the way things are going, you kind of need a sense of
    humor.

  Your day to day is…

  - Full ownership of the technical strategy for the self-
    service spend management platform.
  - Architecting and writing code for key roadmap initiatives —
    flexible budget controls, the Budget Settings experience,
    and cross-channel (Marketplace + SPO) spend strategy.
  - Building and fostering relationships with engineers on your
    team and partners in Product, Design, and Analytics to
    refine and execute the product vision.
  - Safeguarding the accuracy and reliability of a system that
    moves money — spend tracking, budget enforcement, and the
    guardrails that keep them correct.
  - Mentoring engineers through code reviews, design
    discussions, and 1:1 pairing.
  - Working with cutting-edge GenAI tools and technology, with
    an eye toward future goals like spend recommendations and
    AI-assisted budget insights.

  You'll be successful in this role if you have…

  - An unrelenting desire to build more equitable, inclusive and
    diverse workplaces.
  - You view this role as an opportunity to create positive
    change.
  - Meaningful (2+ years) experience in .NET and AWS or
    equivalent cloud technology.
  - *Required* The ability to integrate generative AI tools into
    daily workflows to automate tasks, foster innovation, and
    maximize productivity.
  - A fundamental understanding of building and scaling
    business-critical back-end services, with the front-end
    skills to make them usable.
  - A bias toward correctness and reliability, with the instinct
    to build observability and guardrails into money-moving
    systems from the start.
  - The mentality of an entrepreneur/owner and a strong bias to
    action.
  - Superb communication skills! You believe in keeping all of
    your stakeholders in the loop and know that multiple
    mediums of communication are the key to success.
  - Humility. You believe in treating all people with dignity
    and respect, regardless of title or tenure.

  Benefits:

  - Flexible work environment
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Corporate wellness programs with Headspace and Peloton
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified

  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
  with market data. Base salary offered is determined by a
  number of factors including the candidate’s experience,
  qualifications, and skills. Certain positions are also
  eligible for variable pay and/or equity; your recruiter will
  discuss the full compensation package details.

  NYC Base Salary Range

  $176,000—$264,000 USD

  About us Zocdoc is the country’s leading digital health
  marketplace that helps patients easily find and book the
  care they need. Each month, millions of patients use our
  free service to find nearby, in-network providers, compare
  choices based on verified patient reviews, and instantly
  book in-person or video visits online. Providers participate
  in Zocdoc’s Marketplace to reach new patients to grow their
  practice, fill their last-minute openings, and deliver a
  better healthcare experience. Founded in 2007 with a mission
  to give power to the patient, our work each day in pursuit
  of that mission is guided by our six core values. Zocdoc is
  a private company backed by some of the world’s leading
  investors, and we believe we’re still only scratching the
  surface of what we plan to accomplish.

  Zocdoc is a mission-driven organization dedicated to
  building teams as diverse as the patients and providers we
  aim to serve. In the spirit of one of our core values -
  Together, Not Alone, we are a company that prides itself on
  being highly collaborative, and we believe that diverse
  perspectives, experiences and contributors make our
  community and our platform better.  We’re an equal
  opportunity employer committed to providing employees with a
  work environment free of discrimination and harassment.
  Applicants are considered for employment regardless of race,
  color, ethnicity, ancestry, religion, national origin,
  gender, sex, gender identity, gender expression, sexual
  orientation, age, citizenship, marital or parental status,
  disability, veteran status, or any other class protected by
