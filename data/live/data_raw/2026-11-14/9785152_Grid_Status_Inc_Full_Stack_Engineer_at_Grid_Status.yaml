description: |
  About us

  Grid Status is revolutionizing the energy industry with a
  modern and open data analytics platform. Our mission is to
  provide accessible, actionable energy data to accelerate the
  energy transition.

  In just two years, we've grown from zero to over 20,000
  monthly active users across all facets of the energy sector.
  Our data has been featured in reporting and analysis by The
  Wall Street Journal, The New York Times, and the Federal
  Reserve. Thousands of users rely on our products monthly,
  including renewable developers, asset operators, utilities,
  energy traders, and innovative startups.

  What we're looking for

  As an early member of our engineering team, you will have a
  hand in both defining and implementing the product we
  deliver to customers. We take pride in building not only
  great products but also robust systems that allow for rapid
  development to meet our customers' needs. The ideal
  candidate will enjoy taking on high-impact projects and
  executing them with an eye for user experience and design.

  No experience in the energy industry is necessary—just a
  strong eagerness to learn. Our team’s passion and expertise
  will help you quickly get up to speed. To help us identify
  applicants who have reviewed the full posting, please
  include the word "transmission" somewhere in your free-
  response answer.

  Location: Remote (USA) / Hybrid (Chicago)

  Products you’ll work on

  You will work on all aspects of our web application building
  highly-interactive and data-intensive new products that
  surface energy markets data while also extending features
  for existing products including:

  - Live Market Pages
  - Nodal Price Map
  - Insights
  - and many more

  What you’ll do

  - Architect and implement major product features for our API
    and web app
  - Design intuitive interfaces for our data-intensive product,
    backed by maintainable Pydantic models that validate
    FastAPI responses, which serve Postgres data accessed via
    SQLAlchemy
  - Flex up and down the stack in order to take projects to the
    finish line
  - Optimize application for speed and scalability across
    various devices and browsers
  - Implement and maintain quality assurance processes,
    including testing
  - Regularly participate in code reviews and help maintain high
    standards of code quality
  - Continuously refine existing UX implementations to improve
    performance and usability as the product scales
  - Develop and uphold best practices, coding standards, and
    engineering processes for the team

  Who you are

  - You are willing to dive into problems and solve them
    yourself — as one of our early engineers, you won’t have
    anyone to delegate to
  - You are proficient at communicating asynchronously through
    writing, minimizing the need for disruptive meetings
  - Experience building complex single-page applications;
    experience working on UI/UX for data-intensive software is
    a big plus.
  - You’ve successfully built and evolved systems to meet
    production SLAs at meaningful scale
  - You thrive working on small teams and being given a lot of
    autonomy
  - You are willing to dive into whatever layer of the stack is
    necessary to solve the problem the right way
  - Legal right to work in the United States

  Technical skills and tools

  - Languages: TypeScript, Python
  - Frontend Stack: React, ECharts, React Query, Mapbox
  - Backend Stack: FastAPI, Postgres, Snowflake, Stripe, Clerk,
    AWS, Render
  - Tooling: GitHub, Sentry, Better Stack

  Not sure if you meet all of the qualifications? We value
  eagerness to learn and grow more than having checked every
  box.

  Compensation and benefits

  - $135k–$235k plus equity
  - Health insurance with 100% premium covered
  - 401(k) plan with employer match
  - PTO and sick leave

  A standout candidate who is real and aware of the
  pervasiveness of LLMs in
industries:
  - Software
  - Analytics
  - Energy
  - Big Data Analytics
