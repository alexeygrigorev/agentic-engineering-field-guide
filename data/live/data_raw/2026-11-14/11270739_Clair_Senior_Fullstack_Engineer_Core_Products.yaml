description: |
  About Clair

  If you can send your friends money in seconds, why does it
  still take your employer two weeks to send your paycheck?

  At Clair, we are on a mission to create financial freedom
  for America's workers by giving them a digital banking
  platform that allows them to get paid as soon as they clock
  out of work. But we're not just another digital bank or on-
  demand pay provider. We meet Americans at their place of
  work by embedding our products within the scheduling,
  workforce management, and payroll apps they already use
  every day.

  Learn more about us at getclair.com/about

  Who We Are Looking For

  At Clair, we are building technology that transforms how
  people access their pay. As a Senior Software Engineer on
  the Core Products team, your job extends well beyond
  converting tickets into pull requests. We are looking for an
  engineer who operates like a Product Manager: someone who
  takes full ownership of the feature lifecycle, obsessively
  measures post-launch business outcomes, and designs systems
  with downstream impacts—like data pipelines and analytics—in
  mind.

  You will lead the adoption of AI-native engineering
  practices across the team, leveraging state-of-the-art
  models, building autonomous agents, and embedding agentic
  workflows into both our core product architecture and
  internal development processes.

  We operate at the intersection of fintech, embedded finance,
  and real-time payroll systems—building products that handle
  millions of transactions with sub-second performance. Your
  work will directly enable millions of hourly workers to
  access financial freedom.

  If you are a problem solver who loves technical challenges,
  is passionate about performance optimization, security, and
  scalable architecture, and wants to influence key product
  decisions, you’ll love working with us.

  What You’ll Do

  - End-to-End Product Ownership: Partner directly with design,
    product, and data teams to define technical strategy,
    question assumptions, and evaluate product trade-offs
    before writing a line of code.
  - Build with AI & Agents: Architect and deploy features
    utilizing AI models and autonomous agentic workflows.
    Drive the integration of modern AI tools to accelerate
    team velocity and enhance user experience.
  - System-Wide Architecture: Design resilient systems
    considering latency, scale, downstream data consumers, and
    telemetry, ensuring data pipelines receive clean,
    actionable events.
  - Measure Business Impact: Own features after launch.
    Instrument key metrics, monitor performance dashboards,
    investigate post-release gaps, and iterate based on real
    user behavior and business outcomes.

  What We're Looking For

  - Technical Excellence: Deep experience building, deploying,
    and maintaining production-grade applications in cloud-
    native environments.
  - Agentic Workflows & AI Native: Demonstrated experience
    leveraging AI-assisted workflows for rapid, high-quality
    code generation.
  - Product & Business Acumen: A track record of prioritizing
    user impact over technical cleverness and holding yourself
    accountable to business metrics (conversion, retention,
    operational cost).
  - Systems & Data Mindset: Strong understanding of event-driven
    architectures and how core transactional systems feed
    analytical data engineering pipelines.
  - Fullstack Development: Ability to work across the stack
    comfortably, fully owning a product or feature.
    - Frontend – React.js, TypeScript, JavaScript (ES6+), and Expo
      (React Native) – Expertise with these is necessary.
    - Backend – Laravel (PHP) – Some experience is ideal, but not
      a necessity as long as you have demonstrable expertise
      building performant backend systems at scale.
    - Databases – PostgreSQL
    - Infrastructure – AWS
  - Collaboration & Communication: Exceptional communication
    skills. Clair is a fast-paced, highly collaborative
    environment. Whether on calls or in writing, we value
    clarity of communication and precision in what we say very
    highly.
  - Travel: Occasional travel for company onsites and project
    planning, typically 2-4 trips per year, but can vary as
    needed.

  Nice to Have

  - Experience working with financial technology platforms and
    payroll systems.
  - Specific experience in lending, payments, BNPL, ACH, etc is
    highly valued.

  Why Join Us

  - Massive impact: Your work will empower millions of workers
    to access their wages instantly.
  - Challenging, meaningful work: We are solving hard fintech
    problems at scale.
  - Autonomy & ownership: Engineers own features end-to-end and
    influence architecture and product decisions.
  - Top-tier teammates: Work with elite engineers who are
    passionate about high-performance, scalable systems.
  - Fast-moving culture: We prioritize execution, technical
    excellence, and customer impact.
  - Growth opportunities: Lead projects, mentor others, and grow
    into a Staff to Principal Engineer. As Clair continues
    quickly scaling, management opportunities may also open
    up.
  - Flexible work & perks: Competitive salary, equity, unlimited
    PTO, conference stipends, and top-tier benefits.

  Additional Details

  Location: Remote with occasional travel for company onsites
  or project planning .

  The actual base pay within this range depends on many
  factors, such as education, skills, and experience. Base pay
  is only one part of our competitive total compensation
  package, which includes benefits, perks, and equity. The
  base pay range is subject to change and may be modified in
  the future.

  Clair will only contact candidates from @getclair.com email
  addresses. We will never ask for payments or sensitive
  personal information during the hiring process. If you
  happen to receive anything suspicious, please ignore it.

  Need more convincing?

  Apart from getting to work with our incredible team, here
  are some of the benefits you can expect when you join Clair:

  - Medical, Dental, & Vision Coverage, with option to extend to
    your family
  - Fully-paid parental leave
  - Company-sponsored 401k, HSA, and FSA
  - Unlimited vacation for salaried roles, generous PTO for
    hourly roles
  - Work from home setup allowance
  - Access to your earnings every day on Clair
  - Company-sponsored short-term and long-term disability
    insurance

  Equal Opportunity Employer Information

  Clair is an equal opportunity employer and we value
  diversity at our company. We actively seek a diverse
  applicant pool and do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  For questions, please email us at careers@getclair.com
