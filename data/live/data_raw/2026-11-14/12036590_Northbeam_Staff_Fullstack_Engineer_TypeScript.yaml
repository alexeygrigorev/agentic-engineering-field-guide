description: |
  About Northbeam

  Northbeam is building the world's most advanced marketing
  intelligence platform, providing top eCommerce brands a
  unified view of their business data through powerful
  attribution modeling and customizable dashboards. Our
  technology helps customers accurately track ad spend,
  understand the full customer journey, and drive profitable
  growth. Machine learning has been at the heart of Northbeam
  since day one: our full suite of measurement, spanning
  multi-touch attribution, MMM+, and incrementality, is built
  on it, along with laser-accurate first-party data. Now we're
  taking that foundation further, using AI to help brands
  operationalize their data and turn Northbeam insights into
  automated decisions.

  We're experiencing rapid growth, have strong product-market
  fit, and are looking for the right people to help us scale.
  This is a rare chance to make a meaningful impact at a fast-
  moving, high-growth company. At Northbeam, you'll join a
  team of driven, collaborative, and talented individuals who
  value personal growth and excellence. We'd love for you to
  be part of our journey.

  We're a remote-friendly company with physical offices in San
  Francisco and Los Angeles.

  About the Role

  As a Staff Fullstack Engineer at Northbeam, you will play a
  critical role in designing, developing, and delivering high-
  quality fullstack web solutions that support our business.
  You will own major product features across the stack from
  design to launch. You'll have close feedback loops with
  users, Product Managers, and our Customer Success team. You
  will work closely with a cross-functional team of engineers
  and domain experts to build a scalable product, implement
  robust software components, and ensure the reliability and
  performance of our platform. Your technical expertise,
  communication skills, and problem-solving ability will
  contribute to the success of our company and shape the
  future of our technology stack.

  Curiosity, willingness to do the hard thing, attention to
  developer ergonomics, and an enjoyment of a startup pace of
  development  will be the key to success in this role.

  Your Impact

  You can expect to work on the following:

  - Identify and solve complex, high-impact problems, leading
    projects with multiple stakeholders and engineers to
    deliver significant impact to our business
  - Help set technical direction impacting our engineering team
  - Work with product managers, our customer success team, and
    customers to scope projects and build solutions
  - Build the Northbeam dashboard, where we surface core
    marketing analytics
  - Own and build features end-to-end yourself from idea to
    production-ready solution, as well as with engineers
    across the company
  - Optimize our web application for best-in-class speed of
    development and time to render
  - Contribute to the development of standardized, technical
    documentation for internal and external stakeholders

  What you bring

  - 5+ years of expertise in building frontend and backend
    systems with TypeScript
  - 3+ years of expertise with modern component-based libraries
    such as React
  - Experience handling creating API services using REST and
    GraphQL
  - Proficiency in SQL and BigQuery
  - Be independent, dedicated, and able to deliver production-
    ready code with high autonomy and minimal guidance
  - Ability to drive rapid development while ensuring
    maintainability, balancing short-term delivery needs with
    long-term systems design.
  - Passion for continuous learning and professional growth
  - Proven interest and ability to mentor other engineers on the
    team

  Nice to have

  - Proficiency in Python
  - Experience building design systems
  - Experience optimizing frontends for large amounts of data
    and time spent loading
  - Experience working with data visualization
  - Experience working in marketing, e-commerce, or ad-tech

  Values

  These are the values we share as the Northbeam community:

  - Growth mindset - we’re always learning and growing
  - Customer focus - we want to make the customer happy with our
    product
  - Ownership mentality - we think like owners in the business
  - Radical candor - we’re transparent and give direct feedback
    to one another

  Base Salary Range

  $190,000—$240,000 USD

  Actual compensation may vary based on experience, skills,
  and location.

  In addition to your base salary, we offer an equity package,
  comprehensive healthcare benefits (medical, dental, and
  vision), and a 401(k) plan. Our team enjoys a flexible PTO
  policy, 12 company-paid holidays, and 12 weeks of paid
  parental leave. We also provide a $500 work-from-home
  stipend to support your remote setup.

  Interview Process The interview process varies by role but
  typically begins with a 30-minute interview with a Northbeam
  recruiter, followed by a video interview with the hiring
  manager. Next, candidates complete a role-specific video
  interview followed by video or onsite interviews with
  several team members. The final step is a video interview
  with our CEO/Co-founder. The entire interview process is
  usually 5-7 interviews total and requires around 5-8 hours
  of your time.

  We accept applications on an ongoing basis.
