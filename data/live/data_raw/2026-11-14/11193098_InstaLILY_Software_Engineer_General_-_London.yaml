description: |
  About InstaLILY

  InstaLILY is an AI products and infrastructure company that
  puts execution at the frontier of enterprise AI. That work
  begins with Lily™, the world's first AI Forward Deployed
  Engineer, which learns how a business works, builds the
  software it needs, and goes live in days. It does not leave
  when the work ships; it stays and keeps the software working
  as the business changes. Lily runs wherever the work
  happens, in the cloud, on-premise, or at the edge, through
  InstaLILY's Small Data Center, built with NVIDIA technology.
  Founded in 2023 by Amit Shah and Sumantro Das, InstaLILY has
  raised nearly $100 million from Energize Capital, Insight
  Partners, and Home Depot Ventures. Headquartered in New
  York, with offices in San Francisco, London, and Toronto,
  InstaLILY serves leading companies across construction,
  industrial distribution, logistics, healthcare, and other
  operationally intensive industries. Learn more at
  https://instalily.ai/.

  The Traction

  Revenue grew 5x over the past year, and Lily has driven over
  $200M in new annual sales for a single customer. We serve
  some of the largest operators in our industries, including
  SRS Distribution (part of The Home Depot family), United
  Rentals, and Henry Schein, and we work closely with the
  Google DeepMind and NVIDIA ecosystems.

  How We Work

  We work in small teams with real ownership: clear problems,
  direct access to the customers whose work you're changing,
  and room to ship. Your code runs in live production systems
  inside billion-dollar operations, so you see your impact
  directly. People who do well here want that proximity to the
  work. We're growing fast, and the people who join now shape
  what this company becomes. Everything runs on three
  principles: Customers, Culture, and Code.

  Responsibilities

  - Continue to develop the core AI platform and drive technical
    excellence throughout the organization.
  - Work closely with cross-functional teams (product, UI/UX,
    business development) to design and implement new features
    and capabilities.
  - Rapidly learn into the expected quality and reliability of
    the platform through comprehensive testing and continuous
    integration/continuous delivery (CI/CD) practices.
  - Build a rapport with the Lead Software Engineer and Head of
    Product while fostering a culture of continuous learning
    and improvement.
  - Collaborate with the product and design teams to deliver
    high-quality products that meet customer needs.
  - Stay up-to-date with the latest AI and software engineering
    trends and technologies.

  Requirements

  - Bachelor's degree in computer science, engineering,
    Mathematics, Physics or a related field.
  - First Class degree preferred.
  - 0 to 2 years of experience as a software engineer (prior
    software engineering internships and experience/projects a
    significant plus).
  - Passion for understanding AI and machine learning
    technologies.
  - Experience with Python, JavaScript, and other programming
    languages.
  - Understanding of cloud computing technologies OR experience
    with AWS, Azure, or GCP.
  - Excellent problem-solving and analytical skills.
  - Track record of delivering successful products / working in
    a collaborative, fast-paced environment is a plus.

  What You'll Get

  - Real traction: The product works, customers are live, and
    we've already driven over $200M in incremental revenue for
    customers — this isn't a bet on an unproven thesis.
  - Deep partnerships: Backed by Insight Partners with deep
    ecosystem partnerships across Google, NVIDIA, and
    Microsoft. InstaLILY's architecture has been featured in
    Google DeepMind's case study showcase.
  - Customer impact: You'll drive measurable operational change
    inside the customers you own.
  - Stage: Early enough to shape how InstaLILY runs customer
    relationships and expansion at scale.
  - Culture: Offices in New York, San Francisco, and London —
    sharp, low-ego team moving fast.
  - Growth: The learning curve is steep

  Compensation and Benefits

  - Salary Range: £54,000–£62,000 per year, commensurate with
    experience
  - Equity: Generous stock options awards, and refreshers for
    top performers
  - Benefits: Supplemental benefits, pension contribution, in-
    office Lunch reimbursement, Wellbeing Stipend, Generous
    Parental leave, PTO and UK National Holidays, and more!

  Quality Over Quantity

  To ensure a focused, high-quality hiring experience, we
  kindly ask candidates to limit their applications to 3 open
  requisitions at any given time. Applying strategically to
  roles that best align with your skills and career goals
  gives you the highest chance of standing out. Have you
  interviewed with us in the past 12 months? We encourage you
  to reach out directly to your previous interviewer rather
  than submitting a new application.

  InstaLILY is committed to providing an inclusive and
  barrier-free recruitment process. If you require an
  accommodation, please let us know, and we will work with you
  to meet your needs.

  We use AI to assist with parts of our application review
  process. If you’d like to opt out, please contact our
  recruiting team (lily.hiring@instalily.ai).
