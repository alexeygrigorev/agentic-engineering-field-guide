description: |
  Company Description

  About Redcare Pharmacy:   As Europe’s No.1 e-pharmacy,
  Redcare Pharmacy is powered by passionate teams and cutting-
  edge innovation. We strive to create a healthy,
  collaborative work environment where every employee feels
  valued and inspired to contribute to our vision “Until every
  human has their health”. If you’re seeking a career that
  offers purpose and aligns with your values, join us and
  begin your #Redcareer today.

  About the role: As an Engineering Manager (m/f/d), you will
  lead multiple cross-functional engineering teams responsible
  for customer-facing products and internal platforms. You
  will provide clear direction, empower teams to take
  ownership, and ensure that engineering priorities translate
  into reliable delivery and measurable impact. Working
  closely with Product and business stakeholders, you will
  help shape solutions that create customer and business
  value.

  About the tech landscape: Our teams build and operate cloud-
  native, microservice-based applications following a “you
  build it, you run it” approach. Cross-functional product
  teams have end-to-end ownership and use modern engineering
  practices, automation, observability, and data to
  continuously improve their products and services.

  Job Description

  About your tasks:

  - Lead, hire, coach, and develop multiple engineering teams,
    fostering an inclusive and psychologically safe culture of
    ownership, accountability, and continuous improvement.
  - Establish a clear engineering agenda based on an
    understanding of the teams’ strengths, challenges, and
    opportunities.
  - Partner with Product Managers to shape priorities and
    balance customer value, business needs, delivery
    commitments, and technical excellence.
  - Create clarity around priorities and ownership, proactively
    manage risks, communicate them early, and ensure reliable
    follow-through on commitments.
  - Support engineers through regular feedback, career
    development, mentoring, and performance management.
  - Provide technical direction, help teams address root causes,
    and steer them towards simple, maintainable solutions
    without acting as an individual contributor.
  - Collaborate with engineering leaders and stakeholders,
    addressing conflicts constructively and driving cross-team
    initiatives.
  - Use data and measurable outcomes to improve delivery,
    reliability, cost efficiency, team effectiveness, and
    customer impact.

  Qualifications

  About you:

  - Experience leading multiple engineering teams in a product-
    oriented environment.
  - A strong track record of creating direction, driving
    execution, and achieving measurable outcomes.
  - A passion for coaching, mentoring, and helping engineers
    grow.
  - Sufficient technical depth to recognize what good looks
    like, challenge constructively, and guide teams towards
    sound decisions.
  - A proactive, structured leadership style with strong
    ownership and follow-through.
  - Strong communication skills and the ability to build trust
    and effective partnerships across Engineering, Product,
    Design, Data, and Business.
  - Familiarity with cloud-native architectures, modern software
    engineering practices, and agile product development.
  - Experience in e-commerce is a plus, but not required.

  Additional Information

  About your benefits:

  In order to provide our employees with the best possible
  support for their individual needs, we offer a wide range of
  benefits:

  - Sports: Stay healthy. Profit from a membership (M) package
    at Urban Sports Club, so that you can take advantage of a
    huge variety of sport offers.
  - Mental Health: Get quick and professional help from
    psychologists of Likeminded if you feel overwhelmed in
    private or professional life. Anonymous and free of
    charge.
  - Work from Home: If your job does not require you to be
    present in the office, we can arrange the place you work
    from individually - even for up to 20 days a year anywhere
    in the EU.
  - Mobility: We provide our employees with a fully costed
    Deutschland Ticket which can be used at any time. Click
    here to learn more.
  - Personal development: Grow! We support and encourage your
    individual development through various in- and external
    trainings.
  - And many more:)
