description: |
  Company Description

  ONDA is a network of extraordinary people, places and
  experiences.

  Our goal is to empower people with shared interests by
  building real human connections, accessing intimate
  communities, and unlocking events and experiences across the
  world.

  People from diverse backgrounds join the ONDA network as
  members to access private spaces for work and play. These
  spaces are currently composed of a curated collective of
  premium workspaces and members clubs around the world with
  respective experiences, networks and events. These members
  are passionate individuals including entrepreneurs,
  travelers, artists, professionals, and more.

  Our offices are located in London, but our customer base and
  collection of spaces span across the world.

  Job Description

  We are looking for a Senior Front-End Engineer (or Full-
  Stack with strong frontend skills) whose primary
  responsibility is to further build our web app and mobile
  apps. This role is key to delivering ONDA’'s product to many
  users and organizations across the world and is foundational
  for ONDA. You will be reporting directly to the CEO and COO,
  with the possibility to build the engineering team from the
  beginning.

  We have a hybrid work model for candidates in London and
  NYC. We also believe talent can be found in other places, so
  we are open to candidates between +3 GMT (Moscow, Istanbul)
  and -5 GMT (US East Coast).

  You will be responsible for:

  - Playing an active role in the shaping of the future of the
    product, providing input into the strategic direction and
    owning the technical decisions.
  - Building the product from conception to deployment and
    testing. Deliver the product to the hands of real users to
    test and iterate the business concept quickly
  - Making decisions on development practices, system
    architecture, coding patterns and frameworks used
  - Improve and iterate on existing features through A/B
    testing, plus user and team feedback
  - Providing the engineering perspective on the user needs,
    pain points and effort of features
  - Working with the product team, leadership and other
    stakeholders on deciding key product roadmap milestones
    and providing technical input on feasibility, effort, etc
  - Knowing the ONDA app across platforms inside out and point
    out any potential bottlenecks in terms of technology
    decisions, scalability, or edge cases that may affect the
    user experience and operations

  Qualifications

  - You have proven production experience (i.e., launched
    products to real users) with one or more of the following
    technologies:
    - HTML/CSS/Javascript/Node/Typescript
    - React Native/Redux
    - Native development on iOS and/or Android (Swift, Java)
    - Figma
    - Netlify
    - Python
  - Degree in Computer Science, similar technical field of study
    or equivalent practical experience
  - Interest and ability to learn other coding languages as
    needed
  - You love problem solving — especially debugging hard
    problems at every level of the stack (i.e. you can debug a
    web application problem single-handedly all the way from
    the browser, through the transport, through the
    application and servers and databases and asynchronous
    queues)
  - You’ve had experience working in an agile development
    environment a small team to deliver a product from start
    to finish
  - Thrive in uncertainty and speed - ideally with experience in
    a startup environment (we are moving quickly!)
  - Have an eye for quality assurance
  - You are passionate about building a world class lifestyle
    network

  Additional Information

  Our Culture

  Our goal is to mitigate the online and offline disconnect,
  bringing people with shared values together to share
  meaningful experiences at select places.

  As one of the first hires for our engineering team, you will
  have a unique opportunity to shape the direction of the
  platform and ultimately change how communities network
  across the world.

  We are looking for someone sharing that belief and is
  willing to impact our mission.

  Perks / Benefits

  If you're looking to be part of the founding team of an
  early-stage business that is fundamentally changing how we
  bring experiences to our network, then we can offer you:

  - Permanent full-time role
  - Remote work with the option to travel to London and NY
  - Salary is market competitive
  - Benefit to access ONDA’s collection of spaces and network
    across the globe
  - Early stage share options equity
  - The opportunity to build a beautiful and world class user
    experience
  - Ownership around developing the product experience with the
    CEO

  We are committed to building a diverse culture and are eager
  to receive applications from all backgrounds. All applicants
  will receive consideration for employment without
  discrimination.
