description: |
  Cloaked is a consumer privacy and identity platform on a
  mission to give people back control of their personal data.
  We let anyone generate unlimited identities - masked emails,
  phone numbers, and payment cards - scrub their information
  off data-broker sites, and shield themselves from spam,
  scams, and breaches, all from one app. Backed by a $375M
  Series B, we've protected 10M+ identities and removed 1B+
  records from the data brokers who profit off personal
  information. Now we're building the AI-native future of
  privacy: autonomous agents that monitor, manage, and defend
  your digital footprint for you.

  About the Role

  We're looking for a Staff Software Engineer, Full Stack to
  build across Cloaked's privacy platform - the identity,
  data-removal, and payments products (including Cloaked Pay)
  that millions of people trust to take back control of their
  personal data. 10M+ identities protected and 1B+ records
  removed to date.

  You'll work across the stack on systems that scale to
  millions of users, backed by our zero-knowledge, end-to-end-
  encrypted architecture - and contribute wherever the hardest
  problems are as we build AI-native consumer products at
  scale.

  What will you do?

  - Lead the roadmap and implementation of the features you own,
    identifying improvements that will enable new
    functionality for existing and new products
  - Take ownership of new greenfield products and gain valuable
    experience in building new products
  - Collaborate with cross-functional groups - frontend,
    backend, design, etc., leading to innovation and growth
  - Seamlessly move across the stack from frontend to backend
    building new features and delighting our customers
  - Tackle challenging problems in a collaborative environment
    as we continue to scale our customer base 10x.
  - Elevate the team with your ability to connect the front and
    backend teams

  What we’re looking for

  - Significant experience building and shipping production
    software end-to-end, ideally at a consumer or growth-stage
    company
  - Strong front-end fundamentals, with experience building
    high-quality, responsive user interfaces (we care more
    about the fundamentals than any specific framework)
  - Proficiency in Python or a similar object-oriented language,
    with experience building scalable backend systems
  - AI-forward: you use AI tooling (Claude, ChatGPT, and others)
    fluently to ship faster, and you're excited to build in a
    product org where AI is core to what we make. Experience
    shipping AI-powered features is a plus, not a requirement
  - Experience designing and deploying secure, production-grade
    APIs
  - Strong understanding of databases, ORMs, and backend
    architecture patterns
  - A track record of owning end-to-end systems and delivering
    high-quality, scalable software, with sound architectural
    and system-design judgment
  - Familiarity with modern tooling, testing, and CI/CD
    practices

  What do we like?

  - A get-it-done mindset. Our team is driven to create new
    solutions and resolve problems in a fast-paced environment
  - Comfort working with various teams across the org to
    determine the best solution
  - Passion for security and internet ethics
  - Startup or growth-stage company experience
  - Interest in data and analytics
  - Care and respect for our customers' privacy as if it were
    your own

  What we offer

  Cloaked is a well-funded Series B startup based out of NYC.

  Although we are a distributed team, the NYC team operates
  with a hybrid model. The office building is home to several
  amenities, including a gourmet cafe, cocktail bar, and a
  rooftop work area.

  We have a fully built out kitchen packed with drinks and
  snacks. The Cloaked team has diverse interests and so we
  frequently embark on team outings and go out for socials!



  Compensation and Benefits

  We offer above market rate pay and equity based off of the
  market’s best commercially available data. Your compensation
  will be a combination of salary, bonus and equity.

  Cloaked employees have 401K, as well as top of the line
  Health, Dental, and Vision benefits.

  We offer flexible work arrangements and the ability to work
  remotely as needed. Cloaked provides a home office stipend
  in addition to a new company laptop (and other tech
  depending on the role).



  Perks

  🌴 Competitive PTO: We encourage employees to take a minimum
  # of vacation per quarter. We see PTO as a preventative
  burnout measure and are committed to changing the industry
  standard.

  🤸 Monthly health stipend: Used for any kind of physical,
  mental or emotional care you’d like to take for yourself, be
  it a gym membership, a meditation app, or time with a
  personal trainer.

  🥗 Late Night Meals: We understand that sometimes work can
  get in the way of meal prep. In response to that, we offer
  employees a monthly meal stipend to be used when they don’t
  have time to get a home cooked meal going!

  🧠 Professional Growth: Opportunities for career development
  and personal growth are provided to all employees who seek
  to further their knowledge and capabilities through an
  unlimited professional development fund. Additionally team
  members are encouraged to regularly attend conferences and
  industry events.

  We are really excited about having you join our mission-
  driven team and help us build the future of online privacy!
