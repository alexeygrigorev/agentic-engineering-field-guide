description: |
  At Rula, we are a remote-first company that believes mental
  health is just as important as physical health. We recognize
  that mental health issues can be complex and multifaceted,
  and we are dedicated to treating the whole person, not just
  the symptoms.

  We aim to create a world where mental health is no longer
  stigmatized or marginalized, but rather is embraced as an
  integral part of one's overall well-being.

  We believe that by providing quality care that is both
  evidence-based and compassionate, we can empower individuals
  to take charge of their mental health and achieve their full
  potential. We are passionate about making a positive impact
  on the lives of those struggling with mental health issues
  and we strive to be a force for positive change in the field
  of mental healthcare.

  About the Role

  We are looking for a Staff Software Engineer to join Rula’s
  Provider Growth, Acquisition & Supply Management team. Our
  goal is to ensure that Rula has the right providers to meet
  patient demand. Access to care is fundamentally a supply
  problem, and our team is here to solve that by driving
  meaningful impact on how providers find Rula, onboard, and
  build sustainable and flexible practices on our platform.
  Our work sits at the intersection of provider experience and
  marketplace dynamics, increasing supply where it matters and
  reducing friction in how providers deliver care – so
  patients can find help quickly.

  As a Staff Software Engineer, you’ll play a central role in
  shaping this direction by bringing order to ambiguity,
  designing robust systems, and delivering software that
  directly impacts the provider experience. We’re looking for
  product-minded engineers who see problems, move quickly, and
  help the team build the right solution.

  Required Qualifications

  - 8+ years of related professional software engineering
    experience building scalable distributed systems
  - Strong full-stack engineering experience building and
    maintaining production web applications, with depth in
    modern frontend frameworks, backend APIs, data modeling,
    and distributed systems
  - Experience leading initiatives across multiple teams and
    influencing technical strategy without direct authority
  - Hands-on experience using AI-assisted software development
    tools (such as Claude Code) as part of regular engineering
    workflows
  - A passion for fostering a high-performing engineering
    culture through code reviews, technical documentation, and
    mentoring junior engineers
  - Strong communication skills with the ability to align
    technical and non-technical stakeholders around a shared
    vision

  Preferred Qualifications

  - Experience building AI-powered engineering workflows,
    tooling, or automation that was adopted by others and
    measurably improved development speed or quality
  - Experience driving projects end-to-end, from discovery and
    design through implementation, launch, and post-launch
    support
  - Experience with Node.js, React, Typescript, Kafka, AWS,
    Docker, Kubernetes
  - Previous experience thriving in a fast-paced, high-growth
    startup environment where you’ve helped scale an
    engineering organization

  We're serious about your well-being! As part of our team,
  full-time employees receive:

  - 100% remote work environment: Working hours to support a
    healthy work-life balance, ensuring you can meet both
    professional and personal commitments (must be based in
    United States, currently not hiring in Hawaii)
  - Attractive pay and benefits: Full transparency of pay ranges
    regardless of where you live in the United States
  - Comprehensive health benefits: Medical, dental, vision,
    life, disability, and FSA/HSA
  - 401(k) plan access: Start saving for your future
  - Generous time-off policies: Including 2 company-wide
    shutdown weeks each year for self-care (for most
    employees)
  - Paid parental leave: Available for all parents, including
    birthing, non-birthing, adopting, and fostering
  - Employee Assistance Program (EAP): Supporting your mental
    and physical health
  - Quarterly department stipend: Fun team-building activities
    or in-person gatherings
  - Community and employee resource groups: Participate in
    groups that celebrate employee identity and lived
    experiences, fostering a sense of community and belonging
    for all
  - Home office stipend: New hire home office stipend & $50
    monthly stipend to help cover internet or cell phone
    expenses
  - Wellness at Rula program: Year-round wellness initiatives
    and a $50/month wellness stipend

  Our team

  We believe that diversity, equity, and inclusion are
  fundamental to our mission of making mental healthcare work
  for everyone.  We are dedicated to having a culture of
  inclusion that will support our employees in feeling safe,
  seen, heard, and valued.
