description: |
  #LI-EU #LI-MP

  YOU ARE

  You lead a significant knowledge engineering scope and
  function within a large program; actively contribute to
  thought leadership. You shape how a substantial body of work
  formulates real-world problems into scalable AI and KG
  solutions, and set the technical direction for that scope.
  You lead a team and guide exploration and implementation of
  new methodologies, model building techniques, and cutting-
  edge algorithms. You remain at the forefront and drive
  innovation by applying these techniques to new business
  problems, use cases, and scenarios. You design, evaluate,
  and maintain ontologies, and establish the standards others
  follow. You justify the value to business and technology
  stakeholders, and construct the methodologies and data
  architectures that demonstrate it. You publish or present
  perspective beyond the immediate project. You work across
  business and technical teams to drive end-to-end delivery
  for their scope.

  THE WORK

  - Leads the build of Knowledge Graph solutions that transform
    a client's data architecture within program scope.
  - Directs the design, development, and implementation of AI
    and semantic solutions, ensuring all the pieces work
    together seamlessly.
  - Works with project leaders, delivery leads, and client
    stakeholders to create stand-out, graph-powered Data & AI
    offerings.
  - Develops strong client relationships and earns the trust of
    key advisors.
  - Makes the business case for the semantic layer solution
    recommended to the client.
  - Contributes meaningfully to Accenture sales and pre-sales
    efforts.
  - Provides thought leadership on technology trends, new
    opportunities, innovations, and foreseeable limitations,
    risks, and concerns.

  EDUCATION

  - Bachelor's degree or equivalent

  BASIC (REQUIRED) QUALIFICATION

  - Bachelor's degree or equivalent, plus at least 4 of the
    following:
  - Experience with Knowledge Graph technologies (RDF, SPARQL,
    LPG, SHACL)
  - solid experience in schema design, ontology management, and
    KG curation
  - Proven experience in designing and developing KG solutions
    and graph-based ML models (functional + technical)
  - Experience with end-to-end data pipeline implementations for
    AI applications (esp. LLMs), with hands-on design and
    configuration
  - Strong knowledge/working experience of relational databases,
    object stores, graph databases (Stardog, Neo4J, Amazon
    Neptune), and vector databases

  About Accenture

  Accenture is a leading global professional services company
  that helps the world’s leading businesses, governments and
  other organizations build their digital core, optimize their
  operations, accelerate revenue growth and enhance citizen
  services—creating tangible value at speed and scale. We are
  a talent- and innovation-led company with approximately
  791,000 people serving clients in more than 120 countries.
  Technology is at the core of change today, and we are one of
  the world’s leaders in helping drive that change, with
  strong ecosystem relationships. We combine our strength in
  technology and leadership in cloud, data and AI with
  unmatched industry experience, functional expertise and
  global delivery capability. Our broad range of services,
  solutions and assets across Strategy & Consulting,
  Technology, Operations, Industry X and Song, together with
  our culture of shared success and commitment to creating
  360° value, enable us to help our clients reinvent and build
  trusted, lasting relationships. We measure our success by
  the 360° value we create for our clients, each other, our
  shareholders, partners and communities.

  Visit us at www.accenture.com

