description: |
  About Us:

  Grow was born to tackle a critical challenge: making mental
  health care more effective and accessible for everyone.
  Since launching in 2020, 15 million sessions have started on
  Grow, and we've barely scratched the surface. We do it
  through a three-sided marketplace that empowers providers,
  augments insurance payors, and serves patients. Every
  solution we build reveals ten more waiting to be delivered,
  and that's just what gets us going. We've backed that
  ambition with more than $328M in funding, including our
  Series D at a $3B valuation from Sequoia Capital,
  Transformation Capital, TCV, SignalFire, Menlo Ventures,
  Goldman Sachs Alternatives, and others.

  Your Impact at Grow:

  At Grow, the work you do can literally change someone's
  life. Your work here doesn't stay on a screen; it impacts
  whether someone can find, afford, and access quality care.
  That ambition sets us apart, and offers you an endless
  runway to impact one of the world's most urgent issues. We
  don’t have passenger seats here. Everyone is driving
  something that matters.

  This work deserves real commitment. So if you thrive on
  meeting problems head on, untangling serious complexity, and
  working at pace with the sharpest yet kindest people around,
  you've come to the right place.

  The Opportunity:

  We’re looking for an Engineering Manager to lead Momentum,
  the team that builds the experiences supporting our clients
  in their mental health journey outside of active care: the
  167 hours a week they’re not in a session. Momentum owns
  what a client experiences between sessions and Grow’s mobile
  apps end to end, including session recaps, Intentions
  (commitments clients set with their therapist and carry into
  the week), and the consumer mobile experience we’re building
  around them.

  You’ll lead a full-stack team of backend and iOS engineers
  from 0 to 1 as we learn what clients need, then from 1 to
  100. The team is forming now and works with a dedicated
  product manager and designer, so you’ll have real influence
  over its technical foundation, culture, and product
  direction.

  What You’ll Be Doing:

  - Lead a full-stack team of backend and iOS engineers, hiring
    and growing them as the team scales its product from 0 to
    1 to 100.
  - Own the roadmap with your product manager and designer, from
    hypothesis through shipped experiment, and own the metrics
    that show whether it worked.
  - Make the technical calls that shape Momentum’s foundation:
    what we build natively in the iOS app, what we ship as an
    experiment, what we instrument, and how backend services
    are shaped.
  - Raise and maintain a high technical bar by reviewing code,
    driving architecture decisions, and contributing hands-on
    when needed.
  - Help define Grow’s inter-session strategy with Product,
    working out what clients need between sessions.
  - Use data and client insight to guide decisions, measure
    impact, and adjust course quickly as we learn.
  - Build and coach a high-performance team and a culture with
    operational rigor suited to a team finding product-market
    fit: hire, develop, and promote engineers, and make the
    hard calls when needed.
  - Represent Momentum and its work to the broader engineering
    organization alongside peer engineering managers and
    leaders.

  What You’ll Bring:

  - You have 3+ years of experience as an engineering manager
    leading a product team, plus 6+ years as a hands-on
    engineer in backend, full-stack, or iOS engineering.
  - You’ve led a team that included iOS or mobile engineers and
    can engage credibly with their work. A native iOS
    engineering background is not required.
  - You’ve shipped consumer products that people use regularly,
    with outcomes you owned and metrics you moved.
  - You bring technical depth as a leader: you review code,
    drive architecture decisions, reason through system design
    tradeoffs for a mobile and backend product, and get hands-
    on when the team needs it.
  - You have strong product sense, can articulate a vision and
    drive it to execution, and work with product and design as
    peers.
  - You’ve delivered complex programs in ambiguous environments.
  - You make decisions with data.
  - You’ve built high-performance teams: hiring, developing, and
    promoting engineers, and handling performance.
  - You communicate well and lead cross-functionally.
  - You have a founder’s mindset: ownership, speed, scrappiness,
    and problem-solving.

  Nice to have:

  - You have a native iOS engineering background, or current
    fluency with Swift and SwiftUI.
  - You have experience with growth or experimentation-driven
    consumer products, or with products used by patients,
    clinicians, or other healthcare professionals.
  - You’ve had a start-up, incubation, or 0-to-1 chapter.

  Exemption Status: Exempt

  The base compensation for this role will vary depending on
  several factors, including relevant experience,
  qualifications, and the candidate’s working location.
  General Information About Working at Grow The information
  below provides an overview of work arrangements and full-
  time employee benefits at Grow. Applicability varies by
  role, employment type, and location; please refer to the job
  description above for this role’s work arrangement.

  Work Location & Travel:

  Hybrid Roles are onsite from a listed Hub location three
  days per week ( Tuesday, Wednesday, Thursday), unless
  otherwise specified in the above job description. The hybrid
  arrangement will include travel 2–3 times per year (e.g.,
  company and department offsites).

  Remote roles are fully remote within the United States. The
  remote arrangement will include travel 2–3 times per year
  (e.g., company and department offsites).

  Full Time Employee Benefits:

  - Health Benefits: Comprehensive medical, dental, vision,
    life, and disability coverage.
  - Grow for Grow: No cost access to therapy through the Grow
    platform (available to US employees)
  - Financial Wellness: Retirement savings programs and equity
    opportunities to help you invest in your future.
  - Flexible Time Off, Paid Holidays & Winter Break: Flexible
    time off, company paid holidays (which vary by country),
    and a full company wide Winter Break to rest and recharge
  - Parental Leave: Up to 18 weeks of paid parental leave to
    support you and your growing family and a new child
    stipend.
  - Mental Health Mornings/Afternoons: Dedicated weekly flexible
    time for self care, whether that's therapy, exercise,
    journaling, time with family, or simply taking a break.
  - Wellness & Development Stipend: Annual stipend to support
    your personal wellbeing and professional growth, from
    fitness and education to books and learning resources.
  - Commuter Benefits: Pre tax commuter benefits to support
    teammates working from one of our hub locations.
  - Home Office & Meals: Support for your home workspace plus
    meal benefits, with offerings tailored to both remote and
    hub based employees.
  - Additional Perks: A variety of wellbeing benefits, including
    wellness memberships, virtual care, pet insurance
    discounts (where available), and global travel assistance.

  Research shows that some groups hesitate to apply unless
  they meet every qualification. If you’re excited about this
  role but don’t check every box, we encourage you to apply.
  At Grow, we value diverse experiences, transferable skills,
  and the unique strengths each person brings.

  Grow Therapy is proud to be an equal opportunity workplace
  and is an affirmative action employer. We are committed to
  equal employment opportunity regardless of race, color,
  ancestry, religion, sex, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  gender identity or Veteran status. We also consider
  qualified applicants regardless of criminal histories,
  consistent with legal requirements.

  Use of AI Tools: We use certain AI and automated tools to
  support recruitment. These tools help our team review
  applications, organize interviews, detect potential
  application integrity issues, and maintain interview
  records; they do not make final hiring decisions.

  Application Review: Ashby's AI-Assisted Application Review
  helps review application materials against role-specific
  criteria and may flag potential fraud or integrity issues
  for recruiter review. All advancement decisions are made by
  our human recruiting team after independent review. See
  Ashby's AI Bias Audit Report.

  Interview Recording: We use BrightHire to record interviews,
  supporting note-taking and consistency across candidates.
  Learn more. Interviews are confidential; you may ask your
  interviewer to stop recording anytime, or opt out in
  advance. Choosing not to be recorded will not, by itself,
  affect your candidacy.

  AI-Assisted Recruiter Screen: For select roles, BrightHire's
  AI features may help structure initial recruiter screens and
  organize interview notes. All responses are reviewed by our
  recruiting team; no hiring decisions are made by AI alone.

  State-specific notices: Depending on your location, you may
  have additional rights. Illinois: If AI analyzes a video
  interview, we'll provide notice, explain how it works and
  what it evaluates, and obtain consent beforehand. New York
  City: Where required, we'll provide at least 10 business
  days’ notice before using an automated employment decision
  tool and explain how to request an alternative process.
  Maryland: We do not use facial recognition to create facial
  templates during interviews unless required notice and
  written consent are obtained.

  Questions, accommodation requests, requests for an
  alternative selection process, objections to recording, or
  concerns about AI use? Contact talentops@growtherapy.com.
  We’re happy to help or offer an alternative way to
  participate.
