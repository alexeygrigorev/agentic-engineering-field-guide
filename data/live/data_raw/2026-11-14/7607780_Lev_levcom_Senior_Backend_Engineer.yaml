description: |
  About Lev

  Lev is transforming the $600B commercial real estate
  financing space. We have built a platform that uses AI to
  match brokers and borrowers with the best-fit lenders for
  their deals, and automate the most time-consuming parts of
  the financing process.

  We are the first company to be tackling this problem at
  scale, which is why top-tier VCs and a who’s who of
  financial companies have invested more than $100M to help us
  grab this massive opportunity.

  The Role

  We are looking for a passionate problem solver to join our
  engineering team.  In this role, you’ll get to wear many
  hats and be responsible for multiple projects including our
  proprietary digital financing platform.  You’ll also work
  directly with our CTO by constantly discussing,
  architecting, developing new features/products, and making
  sure they are delivered on time while functioning properly.

  Our current stack consists of: Python, Flask, GraphQL, and
  Postgres on the backend and React.js on the Front-end. We
  also have some services written in Python with FastAPI, such
  as our AI Service and our Email Service.

  What You'll Do

  - Write beautiful Python code focused on scalability,
    testability, and maintainability.
  - Maintain and improve our core Flask API as well as our AI
    Service and other Microservices written in FastAPI.
  - Architect, design, and implement a plethora of
    features/products we have in the pipeline.
  - Collaborate closely with product, design, marketing, and
    engineering teams on building features and functionality.
  - Perform code reviews with your teammates.
  - Discuss, implement, and document subjects like Engineering
    processes, best practices, code quality, testing,
    continuous integration/deployment, and more.
  - Foster a culture of excellence, velocity, and collaboration.
  - Recruit, interview, and help improve our interview
    processes.

  The Must Haves

  - Have a B.S. in Computer Science or equivalent with 5+ years
    of experience.
  - Have demonstrable experience building Python APIs in Flask
    or FastAPI..
  - A desire to work in a fast-paced environment, hone your
    skills, and grow professionally.
  - A willingness to take business ideas from the whiteboard to
    production deployment.

  Bonus points if you have:

  - Experience with LLM’s and building agentic AI applications.
  - Experience with GraphQL.
  - Experience with projects handling complex workflows.
  - Worked in a high-growth company.

  The Nitty Gritty

  - This is an office-based role in NYC (4 days in office)
  - Unlimited PTO
  - Excellent health insurance for you and your dependents
  - Generous stock incentive plan
  - Daily DoorDash credit for lunch and plenty of in-office
    snacks
  - Subsidized access to Gympass for health and wellness

  Lev is an equal opportunity employer committed to creating a
  culture of diversity, equity and inclusion. Here, each and
  every employee is recognized for their unique experiences,
  skills and perspectives. We view these dynamic qualities as
  an asset to solving some of the most complex business
  problems within commercial real estate. All qualified
  applicants will be considered for employment regardless of
  gender, gender identity, sexual orientation, race,
  ethnicity, disabled or veteran status, or any other
  characteristic protected by law.
