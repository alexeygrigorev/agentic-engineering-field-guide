description: |
  CentralReach is a leading provider of autism and IDD care
  software for Applied Behavior Analysis (ABA),
  multidisciplinary therapy, and special education. Trusted by
  more than 200,000 users, we enable therapy providers,
  educators, and employers to scale the way they deliver ABA
  and related therapies with innovative technology, market-
  leading industry expertise, and world-class customer
  satisfaction.

  Responsibilities

  - Lead the development of robust, scalable, and maintainable
    software solutions.
  - Design and implement responsive user interfaces using React
    and TypeScript.
  - Build and optimize high-performance backend services using
    C# .NET and Node.js.
  - Manage infrastructure using Terraform across many AWS PaaS.
  - Architect complex database schemas and optimize queries in
    MSSQL.
  - Collaborate with cross-functional teams to define
    requirements and project roadmaps.
  - Champion best practices in code quality, testing, and CI/CD
    automation.

  Required Qualifications

  - 5+ years of professional software engineering experience.

  - Fluent in React, TypeScript, and Material UI for modern
    frontend development.

  - Strong proficiency in C# .NET backend services.

  - Hands-on experience with MSSQL, including design and
    performance tuning.

  - Proven experience with AWS services (or comparable cloud
    services provider).

  - Competency with IaC using Terraform.

  - Strong understanding of modern software architecture and
    RESTful API design.

  - Excellent problem-solving skills and a collaborative
    mindset.

  - Proficiency with generative AI tools and coding agents

  Preferred Qualifications

  - Experience with containerization (Docker/Kubernetes).

  - Familiarity with serverless computing patterns.

  - Strong background in unit testing, integration testing, and
    e2e test frameworks.

  - Experience with CI/CD tooling and scripting

  #LI-Remote

  Base Salary Range

  $140,000—$180,000 USD

  Backed by Roper Technologies, Inc. (Nasdaq: ROP),
  CentralReach is entering an exciting phase of growth,
  innovation, and scale.

  Recognized as one of the best places to work over 10 times
  by organizations such as Inc, Built In, and NJBIZ, our
  culture is centered around impact, inclusion, and
  flexibility. As a hybrid company with collaborative offices
  in Ft. Lauderdale, FL; Holmdel, NJ; and Verona, Italy, we
  foster a workplace where top talent can thrive and make a
  real difference in the lives of those we serve. We offer
  competitive compensation, comprehensive health benefits,
  generous PTO, 401(k) matching, and paid parental leave to
  our full-time employees. Our team members also enjoy hybrid
  work schedules, career development support, wellness
  programs, and opportunities to give back through CR Cares™,
  our community engagement initiative.

  Be part of a market leader driving the future of care.
  Explore opportunities at centralreach.com/careers.

