description: |
  About Lev

  Lev is transforming the $600B commercial real estate
  financing space. We have built a platform that uses AI to
  match brokers and borrowers with the best-fit lenders for
  their deals, and automate the most time-consuming parts of
  the financing process.

  We are the first company to be tackling this problem at
  scale, which is why top-tier VCs and a who’s who of
  financial companies have invested more than $100M to help us
  grab this massive opportunity.

  The Role

  We’re looking for a Senior Frontend Engineer to help us
  build and scale our next-generation digital financing
  platform. You’ll be a key contributor to our product
  development efforts, delivering intuitive, performant, and
  visually polished user interfaces that power the core
  workflows of borrowers, brokers, and lenders.

  You’ll collaborate closely with product, design, and backend
  engineering to bring complex workflows to life in a fast-
  moving, AI-native startup environment.

  Our frontend stack is built with React.js, Typescript, using
  GraphQL to communicate with our Backend services.

  What You'll Do

  - Design and develop responsive, component-driven UIs in
    React.js that serve our borrower and lender users.
  - Collaborate cross-functionally to implement new products and
    features, from concept to release.
  - Integrate with our GraphQL API layer to build fast,
    reliable, and maintainable data flows.
  - Partner with designers to translate wireframes and
    prototypes into pixel-perfect frontend experiences.
  - Continuously improve performance, usability, and
    accessibility across the platform.
  - Write robust tests and maintain frontend reliability as the
    product scales.
  - Participate in code reviews, architecture discussions, and
    team rituals to raise the bar on engineering quality.
  - Contribute to shaping frontend best practices, tooling, and
    UI component systems.
  - Embrace and experiment with AI-native developer tools like
    Cursor and GitHub Copilot to move faster and smarter.

  The Must Haves

  - 5+ years of experience building modern web applications with
    React.js or similar frameworks.
  - Strong understanding of component architecture, state
    management, and performance optimization.
  - Experience working with GraphQL, REST APIs, or similar data
    fetching patterns.
  - Deep appreciation for clean, maintainable, and testable
    code.
  - High ownership mentality – you take initiative and drive
    projects to completion.
  - Comfort working in fast-paced, ambiguous environments with
    tight feedback loops.
  - Excellent communication and collaboration skills.

  Bonus points if you have:

  - Experience working closely with backend engineers and
    product designers.
  - Familiarity with AI-first product interfaces or agent-based
    tools.
  - Experience with tools like Replit, Cursor, Figma, or AI code
    assistants.
  - Exposure to building multi-step workflows or B2B SaaS
    applications.

  The Nitty Gritty

  - This is an office-based role in NYC (4 days in office)
  - Unlimited PTO
  - Excellent health insurance for you and your dependents
  - Generous stock incentive plan
  - Daily DoorDash credit for lunch and plenty of in-office
    snacks
  - Subsidized access to Gympass for health and wellness

  Lev is an equal opportunity employer committed to creating a
  culture of diversity, equity and inclusion. Here, each and
  every employee is recognized for their unique experiences,
  skills and perspectives. We view these dynamic qualities as
  an asset to solving some of the most complex business
  problems within commercial real estate. All qualified
  applicants will be considered for employment regardless of
  gender, gender identity, sexual orientation, race,
  ethnicity, disabled or veteran status, or any other
  characteristic protected by law.
