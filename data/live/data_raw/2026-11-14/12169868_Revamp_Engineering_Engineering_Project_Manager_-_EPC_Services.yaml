description: |
  Role Summary

  Revamp is seeking an Engineering Project Manager to lead
  engineering delivery for EPC clients building utility-scale
  solar PV and BESS projects. Every project you manage brings
  more clean power to the grid, and your leadership determines
  how smoothly it moves from design to construction. You will
  run several projects at once with full ownership of their
  outcomes, and clients and our engineering teams will rely on
  you for clear direction on scope and next steps. You will
  bring our civil, electrical, structural, and power systems
  engineers together around a shared plan and earn client
  confidence through sound judgment and transparent
  communication.



  You will join a mission-driven team accelerating the energy
  transition, where collaboration and trust shape how we work
  with clients and with each other. As an employee-owner, you
  will share directly in the success of the firm and the
  projects you help deliver.

  Duties & Responsibilities

  Project Delivery & Execution

  - Own project scopes, schedules, and budgets from kickoff
    through closeout.
  - Manage multiple smaller projects or several complex projects
    simultaneously.
  - Coordinate and manage internal discipline teams and external
    subconsultants to ensure timely and accurate deliverables.
  - Prepare, track, and submit monthly project invoicing.
  - Monitor project performance and proactively identify and
    resolve risks, scope changes, and schedule impacts.
  - Ensure projects comply with client requirements, contractual
    obligations, and Revamp quality standards.
  - Prepare and review project scopes, budgets, schedules, and
    work plans.
  - Review complete project documents for conformity, quality
    assurance, and contractual compliance.
  - Apply standard project management procedures and criteria
    with independent judgment.

  Client & Stakeholder Coordinations

  - Serve as a primary point of contact for clients on assigned
    projects.
  - Lead and participate in project meetings with clients,
    internal teams, and subcontractors.
  - Present project status, risks, and key issues clearly and
    confidently to stakeholders.
  - Review client standards, best practices, and project-
    specific requirements and ensure alignment across teams.
  - Assist with proposal development, including scope
    definition, budgeting, and scheduling inputs.

  Collaboration & Team Support

  - Assign tasks to and direct discipline team members to
    complete project assignments.
  - Plan and coordinate detailed aspects of engineering work in
    collaboration with technical leads.
  - Provide mentoring and guidance to less experienced project
    and engineering staff.
  - Support a collaborative, accountable, and transparent
    project team environment.

  Additional Responsibilities

  - Perform essential duties including meeting project
    deliverables and deadlines.
  - Perform additional related duties as assigned or directed.

  Experience, Knowledge, Skills, & Abilities

  Required

  - Bachelor’s degree in engineering, Construction Management,
    or a closely related field or an associate’s degree in a
    related field plus substantial relevant industry
    experience.
  - Minimum 5+ years of project management experience in an
    engineering consulting environment, renewable energy, or
    similar industry.
  - Demonstrated experience managing project scopes, schedules,
    budgets, and invoicing.
  - Ability to independently evaluate, select, and apply
    standard project management procedures.
  - Strong verbal and written communication skills.
  - Proven ability to identify, analyze, and solve complex
    project issues.
  - Strong organizational skills with the ability to manage
    multiple concurrent projects.
  - Detail-oriented with a high standard for accuracy and
    quality.

  Preferred

  - Substantial experience in renewable energy engineering,
    development, or construction environments.
  - Familiarity with the renewable energy project development
    lifecycle.
  - Experience coordinating multidisciplinary engineering teams
    and subconsultants.

  Benefits for Full-Time Positions

  - Participation in Revamp’s Employee Ownership ESOP program
  - Competitive compensation with bonus.
  - Full benefits package including 99% employer-paid health,
    vision, life, and dental insurance.
  - Medical, dependent care, and commuter FSA.
  - Monthly health and wellness stipend.
  - Attractive vacation, sick, and holiday pay.
  - Paid parental leave.
  - 401(k) savings plan with 100% match up to 6%, vested
    immediately.
  - Paid volunteer time off and charitable donation matching.

  About Revamp

  Founded in 2016, Revamp is the premier employee-owned
  engineering design firm dedicated to advancing large-scale
  renewable energy projects. Our team is united by a shared
  commitment to accelerating the global energy transition and
  creating a workplace where talented people can make a
  tangible impact in the fight against climate change.

  As employee-owners, we take pride in building a culture of
  collaboration, innovation, and accountability where every
  individual’s contribution drives both company success and
  personal growth. Revamp engineers have supported the design
  of more than 10% of the utility-scale solar generation
  capacity in the us since 2020, contributing directly to the
  renewable energy transformation.

  So much more than just an engineering firm; we are a
  diverse, international team of immigrants, singers, dancers,
  pastry chefs, outdoor enthusiasts, animal lovers, travelers
  and problem-solvers who bring curiosity and creativity to
  everything we do. For more information, visit www.revamp-
  eng.com

