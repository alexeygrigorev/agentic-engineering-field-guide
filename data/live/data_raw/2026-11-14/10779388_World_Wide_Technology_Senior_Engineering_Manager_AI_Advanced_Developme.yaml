description: |
  Job Summary & Responsibilities

  Required Qualifications

  - Strong software engineering background with the ability to
    build working systems yourself, not only direct others to
    build them.
  - Demonstrated experience building AI-native applications —
    LLM integration, agents, retrieval, evaluation harnesses,
    and automation workflows.
  - Track record of moving from an ambiguous question to a
    defensible technical recommendation on a short timeline.
  - Experience leading senior engineers, including hiring,
    setting technical direction, and holding a high bar.
  - Demonstrated judgment about when a technology is ready and
    when it is not — including examples of work you stopped,
    and why.
  - Proficiency with modern backend and cloud technologies
    (e.g., Python and/or JavaScript/TypeScript, APIs, event-
    driven systems, containerized deployment).
  - Experience designing evaluations for non-deterministic
    systems, and comfort reasoning about cost, latency, and
    failure modes.
  - Exceptional written and verbal communication skills, with
    demonstrated experience presenting directly to executive
    leadership and defending a recommendation under scrutiny.
  - Ability to structure and communicate technical tradeoffs
    clearly to senior, non-technical audiences, and to state
    uncertainty plainly rather than hiding it.
  - High tolerance for ambiguity, and the discipline to time-box
    work rather than let it expand.
  - Willingness to hand work away once the question is answered,
    and to let another team own the outcome.
  - Solid understanding of Agile and iterative delivery models.
  - Deep alignment with and commitment to the WWT Core Values.
  - Bachelor’s degree in Computer Science, Engineering, or a
    related field preferred; equivalent experience will be
    considered.

  Certain states and localities require employers to post a
  reasonable estimate of the salary range. A reasonable
