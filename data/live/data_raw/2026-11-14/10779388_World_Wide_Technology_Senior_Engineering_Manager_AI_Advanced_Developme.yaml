  Preferred Qualifications

  World Wide Technology (WWT) strives to make a new world
  happen. WWT's work benefits clients and partners as much as
  it does its people and community across the globe.

  Founded in 1990, WWT brings together strategy, deep
  technical expertise and world-class partnerships to help
  public and private sector organizations design, build and
  scale intelligent AI, digital, cybersecurity, cloud and
  infrastructure solutions. Through its Advanced Technology
  Center (ATC)—a collaborative ecosystem featuring state-of-
  the-art hardware and software—WWT enables clients and
  partners to conceptualize, test and validate innovative
  technology and then deploy solutions at scale using its
  global integration and distribution capabilities.

  With more than 14,000 team members and over 60 locations
  globally, WWT's culture—grounded in core values and
  leadership philosophies—has been recognized by Fortune® and
  Great Place to Work for its commitment to innovation, trust
  and creating a great place to work for all. WWT provides
  products and services to large enterprise, global service
  provider and public sector clients in up to 130 countries
  across six continents. Softchoice, a World Wide Technology
  company, supports commercial and SMB markets in the U.S. and
  Canada.

  Want to work with highly motivated individuals on high-
  performance teams? Join WWT today!

  What is the Internal WWT IT Team, and why join?

  The Internal WWT IT team is the backbone of our company’s
  technological infrastructure, ensuring seamless operations
  and continuous innovation. Our team is dedicated to managing
  and supporting the company’s technology infrastructure,
  ensuring the smooth operation of hardware, software,
  networks, and data systems, while providing top-notch
  technical support to employees.

  By joining the Internal WWT IT team, you will play a crucial
  role in maintaining the efficiency and security of our IT
  environment, enabling the company to achieve its strategic
  goals. The Internal IT team offers the opportunity to work
  in a dynamic and collaborative environment, where your
  contributions will have a direct impact on the company’s
  success. If you are passionate about technology and eager to
  take on new challenges, we encourage you to apply and join
  our team.

  What will you be doing?

  As a Senior Engineering Manager – AI Advanced Development
  you will lead a new, deliberately small team that answers
  the AI questions nobody else in the organization owns.
  Executive asks and emerging technology come to this team;
  you take them, prove out in weeks what is real and what is
  not, and hand the answer to the team that will run it — or
  kill the bet and say clearly why.

  This team does not run anything in production and does not
  own long-term support. That constraint is the point: it is
  what allows the team to move at the speed of the technology.
  Your job is to make sure every piece of work ends in a
  decision rather than a demo.

  This is a hands-on role. You will manage the team and still
  build — writing code, running evaluations, and pressure-
  testing your engineers’ conclusions yourself rather than
  relying on status reports. You are the first hire on the
  team, and you will hire Applied AI Engineers who join you.

  Exceptional communication is a core requirement of this
  role, and you will present findings and recommendations
  directly to executive leaders — often without an
  intermediary and often when the answer is not the one they
  were hoping for. You must be able to take a technically
  complex, uncertain result and give a senior audience a clear
  recommendation, the reasoning behind it, and an honest
  account of what you do not yet know.

  Responsibilities

  - Take executive and stakeholder asks about emerging AI
    capability and turn them into scoped, time-boxed
    investigations that produce a defensible recommendation.
  - Run experiments to a decision in weeks - building the
    smallest credible thing that answers the question and
    resist the pull toward polish.
  - Kill bets early and publicly, with a clear, written
    rationale that the organization can learn from and reuse.
  - Package accepted work for handoff: reference implementation,
    evaluation results, known limits, operating assumptions,
    and a receiving team that has agreed to take it.
  - Stay hands-on — build, prototype, and evaluate alongside the
    team, targeting roughly 60% of your time in the work
    itself.
  - Maintain a working point of view on the frontier of applied
    AI: models, agent frameworks, retrieval and context
    strategies, evaluation methods, and tooling — and know
    when each is genuinely ready.
  - Design and run evaluations that separate real capability
    from demo-quality results, including cost, latency,
    reliability, and failure-mode analysis.
  - Partner with platform, product, security, and data teams
    early so that anything handed off can operated by the team
    receiving it.
  - Say no to work that belongs elsewhere — production
    ownership, long-term support, and steady-state feature
    delivery — and route it to the right team.
  - Present findings, tradeoffs, and recommendations directly to
    executive leadership — in writing and in the room —
    including the conclusions that are unwelcome.
  - Write clearly and concisely for a senior audience: short,
    decision-oriented documents that stand on their own
    without a walkthrough.
  - Coach and develop senior engineers through clear
    expectations, direct feedback, and servant leadership.

  How this role is measured

  Success in this role is not measured in shipped features or
  systems under management. It is measured by decisions made,
  bets killed early, and handoffs accepted by the teams that
  receive them. If you need production ownership to feel that
  your work matters, this is the wrong role.
