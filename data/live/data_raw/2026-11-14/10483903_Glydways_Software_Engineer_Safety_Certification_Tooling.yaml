description: |
  Who we are:

  Glydways is reimagining what public transit can be. We
  believe that mobility is the gateway to
  opportunity—connecting people to housing, education,
  employment, commerce, and care. By making transportation
  more accessible, affordable, and sustainable, we empower
  communities to thrive and unlock economic and social
  prosperity.

  Our mission is to revolutionize transit with a solution that
  delivers high capacity, exceptional user experiences,
  unmatched affordability, and minimal environmental impact.

  The Glydways system is a groundbreaking network of carbon-
  neutral, interconnected transit pathways powered by
  standardized autonomous vehicles on dedicated roadways.
  Operating 24/7 with on-demand access, it offers personalized
  and efficient mobility—without the burden of heavy upfront
  infrastructure costs or ongoing taxpayer subsidies.

  With Glydways, we’re building more than a transportation
  system; we’re creating a future where everyone, everywhere,
  has the freedom to move.

  Meet the team:

  The Developer Platform team as a part of Software
  Foundations and Architecture is responsible for building and
  maintaining the infrastructure that enables all developers
  to track, build, deploy and operate our software.  From the
  build system everyone uses, to AI and local developer tools,
  to the tools used to submit and deploy changes, to the cloud
  infrastructure they use to operate it - we support the
  entire development experience.  The Developer Platform team
  forges the tools that empower the entire software
  engineering organization while working with engineers from
  almost every team.

  Glydways vehicles carry passengers, so a meaningful part of
  our codebase is safety-critical and must be developed to
  SIL-4 under the CENELEC railway standards (EN 50128 / EN
  50716). Our job is to develop the tools and processes that
  make that provable. This role builds those mechanisms,
  working closely with our Safety and Systems teams to turn
  certification requirements into automation.

  Roles & Responsibilities:

  - Design, build, and launch the tooling that keeps our SIL-4
    code classified, reviewed, and provably signed off.
  - Develop lightweight web-based applications and reports that
    show our safety posture to engineers and auditors.
  - Maintain and improve our Bazel build system, working with
    team members to keep it fast, reliable, and easy to use.
  - Maintain and enhance developer workflows, including build,
    lint, code coverage, and testing support for C++, Python,
    and Go languages.
  - Collaborate closely with software engineering teams to
    identify and implement improvements in the continuous
    integration (CI) system, utilizing AWS and Buildkite.
  - Develop, deploy, and support automation tools to streamline
    common developer workflows, such as change submission,
    integration testing, and dependency management.
  - Design and implement basic monitoring services to track the
    performance and stability of internal processes and
    systems.
  - Participate in the team's support and on-call rotation,
    responding to issues and keeping shared developer
    infrastructure healthy.

  Knowledge, Skills and Abilities:

  - Experience building software in a regulated or safety-
    critical domain, with working familiarity of a functional
    safety standard such as EN 50128 / EN 50716, IEC 61508, or
    ISO 26262.
  - Practical understanding of what certification evidence
    requires: traceability, tool qualification, and an
    auditable record of review and approval.
  - Experience integrating static analysis or coding-standard
    enforcement (MISRA, Parasoft, Coverity, clang-tidy) into
    CI.
  - Strong knowledge of build systems and other tools in the
    software development cycle, like: git, linting, GitHub,
    code review, testing frameworks and deployment frameworks.
    Direct Bazel experience is a significant plus.

  - Strong knowledge of CI/CD best practices and principles,
    with bonus points for direct experience with Buildkite.
  - Familiarity with front-end web development (for example
    HTML, CSS, JavaScript, or a modern framework) sufficient
    to build and maintain simple internal tools and
    dashboards.
  - Experience developing tools and services in Python or Go.
  - Experience with Linux operating systems in both day-to-day
    development and operational environments.
  - Knowledge of AWS or other similar cloud platforms.
  - Knowledge of on-call support processes, incident management
    and monitoring tooling.

