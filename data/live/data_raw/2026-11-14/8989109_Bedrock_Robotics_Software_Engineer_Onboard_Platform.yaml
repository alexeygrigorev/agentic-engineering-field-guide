description: |
  Join the team bringing autonomy to the built world

  At Bedrock, we're moving AI out of the lab and onto real job
  sites. Our team includes veterans who helped launch Waymo,
  scaled Segment to a $3.2B acquisition, and grew Uber Freight
  to $5B in revenue. We retrofit the heavy equipment
  contractors already own, starting with excavators, so
  experienced crews can safely take on more projects and
  deliver more of the critical infrastructure our society
  needs. In August 2026, Bedrock-equipped excavators began
  doing fully autonomous, paid work on live commercial job
  sites. We've more than doubled our customer base since 2025,
  and our machines now work with contractors across the South,
  Midwest, and Mid-Atlantic In October 2026, we raised a $600M
  Series C co-led by CapitalG and Emergence Capital, bringing
  our total funding to nearly $1B. We're using it to put more
  autonomous machines to work, build the field and operations
  teams behind every deployment, and expand into new machine
  types and job-site tasks. This is where algorithms meet
  steel-toed boots. You'll work alongside construction
  veterans and world-class engineers to solve physical-world
  problems that simulations can't touch. If you're ready to do
  meaningful work on hard problems, we'd love to have you join
  us.

  The Role

  The Onboard Infrastructure team builds the software
  foundation Bedrock's autonomous machines run on, the layer
  giving Bedrock the ability to scale across multiple
  machines, variations, models and environments. Our software
  keeps every machine working reliably hours from the nearest
  engineer, in harsh environments and on lossy connectivity,
  doing real work on billion-dollar projects.

  We're looking for Senior and Staff Software Engineers to
  architect, build, and own major areas of our onboard
  platform, from the OS, drivers, and system services up
  through the runtime frameworks our autonomy stack is built
  on. You'll take these systems from first bring-up through
  reliable operation in the field, keeping the platform fast,
  secure, and dependable at fleet scale.

  In this role, you will:

  - Bring up next-generation compute and sensors as we expand to
    new machine types
  - Develop the core system services that keep a fleet running
    reliably: software updates, lifecycle management, data
    logging, health monitoring, and connectivity
  - Architect and develop the onboard runtime and middleware for
    execution, communication, configuration, and observability
    that let autonomy teams move fast and ship to multiple
    machine types
  - Optimize and benchmark onboard system performance across
    CPU, GPU, and memory for mixed-criticality, real-time
    workloads
  - Expand diagnostics and observability across the onboard
    stack, enabling a small team to keep a growing fleet
    healthy
  - Build internal tools, frameworks, and test infrastructure
    that accelerate development and validation across
    engineering
  - Lean into AI and agents, from automating development
    workflows to fleet analysis, triage, troubleshooting, and
    more.

  Required Qualifications

  - Experience building and shipping embedded systems in
    robotics, automotive, drones, or other high-performance
    embedded contexts
  - Strong programming skills in a systems language such as C++
    or Rust, plus fluency in Python for scripting and analysis
  - Solid foundation building software on Linux-based systems,
    with the versatility to work up and down the stack, from
    services and applications to performance tuning and system
    internals
  - Comfortable developing, automating, and debugging across the
    hardware/software boundary
  - Track record of leading projects, driving design decisions,
    and working effectively across hardware, autonomy, and
    platform teams

  Preferred Qualifications

  - Hands-on work with real-world sensing systems, including
    cameras, lidar, GPS/GNSS, IMUs, radar, or other fielded
    sensors
  - Background in OTA, security, connectivity, telemetry,
    diagnostics, or other production-hardening areas for
    connected fleets
  - Familiarity with the NVIDIA Jetson ecosystem, including
    optimizing ML inference and other GPU workloads on
    embedded compute (e.g., CUDA, TensorRT)
  - Experience with Rust in production or performance-critical
    systems
  - Prior work on safety-critical systems

