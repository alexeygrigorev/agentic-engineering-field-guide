description: |
  Responsibilities:

  - Guide your team on its journey to create innovative digital
    banking products
  - Partner with business, UX design, application, Cloud, QA,
    and InfoSec teams to create world-class customer
    experiences for the online channel using Agile development
    methodologies
  - Gather requirements, design and develop the custom
    applications and integrate with 3rd party products
  - Collaborate with other developers on solutions and mentor
    junior developers
  - Enforce secure coding standards through peer code reviews
    and automated testing
  - Guide development teams to review business requirements,
    design documents, test plans/test cases and performance
    testing plans
  - Effectively communicate technical solutions and
    recommendations to senior level management
  - Expedite the speed of development cycle from month to week
    and ensure that the developers have the
    knowledge/experience of accelerating the DESIGN-to-CODE to
    quickly move from low/high fidelity prototypes to actual
    interactive UIs

  Requirements:

  - Bachelor's degree in Engineering / science, or an equivalent
    combination of experience and education
  - Demonstrated ability in all phases of SDLC and ownership
    delivering at least 2 projects from design to deployment
  - Strong understanding of software design patterns and
    enterprise application architecture
  - 4+ years of experience with web API (.Net core) as well as
    some/many of the following: ASP.Net MVC, HTML, CSS,
    Angular or React or similar framework
  - Experience with writing high-quality, semantic, testable,
    maintainable, and well-documented code
  - Strong understanding of microservice architecture. Ability
    to design, develop and implement scalable and distributed
    microservice based platforms.
  - Experience with GitLab/Azure DevOps CI/CD pipelines a plus
  - Experience working with Microsoft Azure native services--
    Azure Functions, App Services, API gateway, App Insights,
    Key Vault
  - Excellent communication skills at all levels, from team
    members to senior management
  - Experience working in a diverse and distributed team
    environment
