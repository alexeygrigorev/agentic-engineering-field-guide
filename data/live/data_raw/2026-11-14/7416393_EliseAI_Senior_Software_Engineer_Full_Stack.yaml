description: |
  About EliseAI

  At EliseAI, we're improving the industries that matter most:
  housing and healthcare. Everyone needs a place to live and
  access to quality healthcare, yet both are often harder to
  secure than they should be.  By integrating AI agents deeply
  into existing workflows, we make them more efficient, reduce
  costs, and improve the experience for everyone.

  - Housing: We simplify how renters tour apartments, sign
    leases, submit maintenance requests, and stay connected
    with their property team—bringing everything they need for
    their home into one place.

  - Healthcare: We make it easy to schedule appointments,
    complete intake forms, and we help patients communicate
    with providers, so everyone can focus on health instead of
    paperwork.

  With EliseAI, organizations reduce manual work, improve
  accessibility, and deliver a seamless experience across
  essential services. We recently raised a $350 million
  funding round at a $4 billion valuation led by Andreessen
  Horowitz (a16z) and Bessemer Venture Partners to accelerate
  this mission.

  About The Role

  As a Full Stack Software Engineer at EliseAI, you won't just
  write code; you'll build software that improves business
  operations and makes a real impact on people's lives.
  Instead of following a playbook, you’ll be creating it.
  Every single day you will be challenged to identify how we
  can scale and execute on it. You’ll work on a small team
  with other top Engineers, and you'll take on significant
  ownership, lead projects, and see your ideas come to life -
  you’ll essentially operate like a small startup within a
  startup.

  Key Responsibilities

  - Work in a cross-functional team with frontend, backend,
    machine learning engineers and product managers to build
    and deliver compelling user-facing products and features,
    and expand existing ones
  - Play a crucial role in accelerating our product expansion by
    leading the launch of beta products and actively
    collaborating with clients to gather feedback and iterate
    on products for continuous improvement
  - Build frontend solutions for a complex set of functionality
    with a strong focus on user experience
  - Emphasize the creation of modular components that can be
    reused across different parts of our application (both
    frontend and backend). This approach is key to building a
    scalable and maintainable codebase, reducing duplication,
    and enhancing development efficiency
  - Design, develop, and maintain robust and scalable APIs.
    Ensure that our APIs are optimized for performance,
    security, and scalability

  Move at rocket speed, build something massive.

  We’re scaling fast, solving real client problems with
  precision and ambition. Here, you own your impact; full
  autonomy, no micromanagement, no fluff.

  We hire the best, expect the best, and give you the
  masterclass of your career. It’s hard, it’s intense, and
  it’s the most rewarding work you’ll ever do. If you’re
  hungry, driven, and ready to build something massive, climb
  aboard.

  Requirements

  - 2+ years of Javascript, Typescript, and React experience
  - Affinity for good UX and passion for good UX experiences
  - Experience building, maintaining, and monitoring APIs
  - Embodies a startup mentality, demonstrates ownership, and
    effectively balances high-quality output with a keen sense
    of urgency
  - Great at solving problems with little guidance and has a
    strong bias for action
  - Willingness to work in person at our office 4-5 days a week

  Nice to have

  - 2+ years of Python experience
  - AWS experience
  - Experience working with Relational databases

  Benefits

  In addition to the growth and impact you’ll have at EliseAI,
  we offer competitive salaries along with the following
  benefits:

  - Unlimited tokens
  - Equity in the company
  - Medical, Dental and Vision premiums covered at 100%
  - Fully paid parental leave
  - Commuter benefits
  - 401k benefits
  - Fitness & home services stipend to cover part of your
    expenses so you can focus on what matters
  - A collaborative in-office environment with an open floor
    plan, fully stocked kitchen, and all meals covered in the
    office
  - Unlimited vacation and paid holidays
  - We'll cover relocation packages and make the move exciting,
    not painful!

  Job Compensation Range

  The salary range for this role is $230,000 - $270,000.
  EliseAI offers a competitive total rewards package which
  includes base salary, equity, and a comprehensive benefits &
  perks package. Exact compensation inclusive of salary and
  any bonuses is determined based on a number of factors
  including experience and skill level, location and
  qualifications which are assessed during the interview
  process. Additional details about total compensation and
  benefits will be provided by our Recruiting Team during the
  hiring process.

  EliseAI provides equal employment opportunities to all
  employees and applicants for employment and prohibits
  discrimination and harassment of any kind without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetic information, protected veteran status,
  sexual orientation, gender identity or expression, or any
  other characteristic protected by applicable federal, state,
  or local law. Employment with EliseAI is on an “at-will”
  basis, meaning that either the employee or the company may
  terminate the employment relationship at any time, with or
  without cause or notice, subject to applicable law. Pursuant
  to the San Francisco Fair Chance Ordinance, we will consider
  for employment qualified applicants with arrest and
  conviction records. We will also consider qualified
  applicants in accordance with the Austin Fair Chance Hiring
  Ordinance. If you need assistance or a reasonable
  accommodation during the application or recruiting process
  due to a disability, please contact us at
  interview.accommodations@meetelise.com.
