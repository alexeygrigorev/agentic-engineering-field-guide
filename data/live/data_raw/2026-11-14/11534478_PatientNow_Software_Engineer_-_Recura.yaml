description: |
  Company Overview:

  Designed for beauty, built for growth, PatientNow brings
  clinical-grade EMR with intuitive charting, smart AI
  automation, advanced photography, marketing, patient
  engagement, and seamless practice management into one
  elegant system. Everything works together naturally, helping
  clients create a smooth, intentional patient experience from
  consultation to checkout. Supported by a U.S.-based team
  that understands the pace and artistry of aesthetics,
  PatientNow provides the technology and partnership to scale
  with confidence.

  This role will focus on the Recura product line, a newly
  integrated part of PatientNow.

  Vision: Empowering practices and businesses to improve
  health and wellness worldwide by helping their clients look
  and feel their best.

  Mission: PatientNow is elevating businesses focused on
  beauty, wellness and medical aesthetics with innovative,
  all-in-one software and consulting service solutions. People
  who partner with us stand out in the industry with strong
  market differentiation, while streamlining operations for
  long term success and sustainable growth.

  Values:

  - We deliver simplicity - We take complex problems and make
    them clear, actionable, and easy to understand. We avoid
    over-engineering and focus on what truly matters for our
    customers and our teams. Simplicity is not about doing
    less — it’s about removing friction and delivering
    clarity.
  - We set the pace - We take full responsibility for results,
    not just our tasks. We act with both urgency and accuracy.
    We follow through, solve problems, and step in when
    something needs to be done with appropriate pace. This
    means being accountable, proactive, and committed to
    delivering outcomes that accelerate our customers'
    business and our industry.
  - We act with intention - We are thoughtful in how we work,
    communicate, and make decisions. We act with purpose,
    prioritize effectively, and consider the impact of our
    actions on customers, teammates, and the business. We
    don’t operate on autopilot — we choose how we show up.
  - We practice precision - We hold ourselves and each other to
    a high standard. We take pride in our work, pay attention
    to details, and continuously look for ways to improve.
    Quality is not optional — it’s how we build trust with our
    customers and each other.

  Position Summary:

  The Fullstack Engineer builds customer-facing communication
  features on top of Recura’s messaging and voice
  infrastructure. This role focuses on turning carrier and
  system events into usable product experiences such as
  inboxes, automations, templates, and workflows.

  You will work across backend and frontend surfaces, shipping
  features that customers interact with daily. This role is
  ideal for an engineer who enjoys product ownership, fast
  iteration, and building clear abstractions over complex
  systems

  Essential Duties and Responsibilities:

  - Build and maintain fullstack features for messaging and
    communication workflows.
  - Implement inbox functionality, message threading, and
    conversation state.
  - Develop automation triggers and responses based on
    communication events.
  - Integrate backend services with frontend user experiences.
  - Collaborate closely with infrastructure and product-focused
    engineers.
  - Ensure reliability and correctness in event-driven user
    flows.
  - Participate in on-call and incident response as needed.

  Competencies: To perform the job successfully, an individual
  should demonstrate the following.

  - Adaptability - Demonstrates persistence and overcomes
    obstacles. Measures self against standard of excellence.
    Recognizes and acts on opportunities. Sets and achieves
    challenging goals. Takes calculated risks to accomplish
    goals.
  - Business Ethics – Inspires the trust of others. Keeps
    commitments. Treats people with respect. Upholds
    organizational values. Works with integrity and ethically.
  - Communications - Exhibits good listening and comprehension.
    Expresses ideas and thoughts in written form. Expresses
    ideas and thoughts verbally. Keeps others adequately
    informed. Selects and uses appropriate communication
    methods.
  - Continuous Learning - Assesses own strengths and weaknesses.
    Pursues training and development opportunities. Seeks
    feedback to improve performance. Shares expertise with
    others. Strives to continuously build knowledge and
    skills.
  - Problem Solving - Develops alternative solutions. Gathers
    and analyzes information skillfully. Identifies problems
    in a timely manner. Resolves problems in early stages.
    Works well in group problem solving situations.
  - Teamwork - Balances team and individual responsibilities.
    Contributes to building a positive team spirit. Exhibits
    objectivity and openness to others' views. Gives and
    welcomes feedback. Puts success of team above own
    interests.

  Education/Experience:

  - 3+ years of experience as a fullstack or backend engineer.
  - Demonstrates consistent, hands-on GitHub activity, including
    regular code contributions, pull requests, and
    participation in code reviews and repository
    collaboration.
  - Experience building SaaS products with real-time or event-
    driven behavior.
  - Comfort working across frontend and backend codebases.
  - Prior startup experience (required).
  - Familiarity with TypeScript, Postgres, and modern web
    frameworks, preferred.
  - Familiarity with CPaaS concepts (SMS, voice, messaging),
    preferred.

  Why You’ll Thrive Here:

  In this role, you’ll get to:

  - Work at the intersection of innovation and impact, helping
    real-world practices grow and thrive in a rapidly
    expanding market;
  - Collaborate with a talented, curious team that values
    experimentation, learning, and customer empathy;
  - Be empowered to lead with autonomy while supported by strong
    leadership and product discipline; and
  - Help modernize aesthetics software in an industry that’s
    ripe for transformation through innovative, AI-native
    technology.

  Physical Demands: The physical demands described here are
  representative of those that must be met by an employee to
  successfully perform the essential functions of this job.
  Reasonable accommodations may be made to enable individuals
  with disabilities to perform the essential functions.

  While performing the duties of this job, the employee is
  regularly required to sit at a desk and work on a computer
  for prolonged periods.

  The above job description is not intended to be an all-
  inclusive list of duties and standards of the position.
  Incumbents will follow any other instructions, and perform
  any other related duties, as assigned by their supervisor.

  Employment may be contingent on a background check conducted
  at the stage permitted by applicable law. Applicants will
  receive any required disclosures and notices separately.
  PatientNow participates in E-Verify to confirm employment
  eligibility after hire.

  Note: PatientNow jobs are listed on our careers page
  patientnow.com/careers and select job boards. We will never
  ask for payment or sensitive info. Official emails come from
  @patientnow.com, @recura.ai or mail@ats.rippling.com
