description: |
  Job Description Overview Citadel Securities is a leading
  global market maker across a broad array of fixed income and
  equity securities. Our world-class capabilities position us
  to meet the liquidity demands of our diverse group of
  institutional clients in all market conditions. In
  partnering with us, our clients, including asset managers,
  banks, broker-dealers, hedge funds, government agencies and
  public pension programs are able to gain a powerful trading
  advantage and are better positioned to meet their investment
  goals. In our mission to be the most successful investment
  team in the world, we hire the brightest minds in
  technology, research, and finance to create innovative
  solutions that impact the financial markets and take data
  analysis to new levels. Software Engineers create next
  generation software solutions to support business areas
  across the firm. Software Engineers work closely with
  business leaders to develop and deliver custom software
  solutions that optimize performance and efficiency.
  Opportunities may be available from time to time in any
  location in which the business is based for suitable
  candidates. If you are interested in a career with Citadel,
  please share your details and we will contact you if there
  is a vacancy available. Responsibilities • Design, develop,
  test, and deploy elegant software solutions across the firm
  • Partner with business leaders to define priorities and
  deliver custom technology solutions • Analyze complex
  business and technical problems • Make sound decisions
  proactively and in a self-directed manner • Provide timely
  systems support for trading activities Skills and
  Qualifications • A deep passion for technology and software
  development • In-depth experience working in Python • The
  ambition to solve open-ended problems using analytical
  methods • Knowledge of Linux systems • Strong scripting
  experience with an ability to integrate various components
  and systems (in-house and third party) • Professional
  experience working with distributed systems • Knowledge of
  SDLC methodologies • Strong communication and interpersonal
  skills applicable to a dynamic trading environment • Minimum
  Bachelor's degree in Computer Science or related field
  Preferred Qualifications • Experience with proprietary
  trading and market making • Experience with ML techniques
  and statistical methods • Experience with C++, kdb, and SQL
  In accordance with applicable law, the base salary range for
  this role is $125,000 to $350,000. In addition, the employee
  who fills this role will be eligible to participate in a
  discretionary incentive compensation program, as well as a
  wide array of benefit programs, such as medical and life
  insurance, retirement and tax-free savings plans, and access
  to other healthcare programs. About Citadel Securities
  Citadel Securities is a technology-driven, next-generation
  global market maker. We provide institutional and retail
  investors with world-class liquidity, competitive pricing
  and seamless front-to-back execution in a broad array of
  financial products. Our teams of engineers, traders and
  researchers harness leading-edge quantitative research and
  the accelerating power of compute, machine learning and AI
  to power our analytics and tackle the market's and our
  clients' most critical challenges. Together, we are forging
  the future of capital markets. For more information, visit
  citadelsecurities.com .
