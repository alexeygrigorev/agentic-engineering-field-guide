description: |
  🪐 Discover our galaxy



  Join the Future of Work ! Malt is Europe's leading freelance
  marketplace, connecting over 1,000,000 talented freelancers
  with 100,000+ companies. Founded in 2013, we're transforming
  how work gets done through our tech-powered, human-centered
  platform. What makes us different:

  - A diverse team of 600 Malters across 6 European countries
  - A culture that champions equality (50% of our Comex are
    women) and inclusive growth
  - Backed by top investors including ISAI, Serena Capital,
    Eurazeo Growth, Goldman Sachs, and BPI
  - A mission to give everyone the freedom to work differently

  Ready to help shape the future of work? Your next chapter
  starts here! 🪐

  At Malt we believe that Ambition is the Way, so all lists of
  missions and responsibilities are non-exhaustive.

  Explore your future career  🔭

  We are looking for a Senior Engineering Manager to lead the
  Compliance strategy for our product engineering team. In
  this role, you will be the leader overseeing the delivery,
  performance, and people management for our Compliance
  squads, composed of 8–15 engineers. You are in charge of the
  performance, productivity, and innovation within this scope,
  ensuring that how clients and freelancers connect on Malt
  remains secure and trustworthy. Today, our compliance
  ecosystem relies on robust KYC flows; tomorrow, we aim for a
  full AI-driven compliance experience. You play a crucial
  role in defining and implementing our technical strategy,
  driving project timelines, and fostering a high-performing
  and collaborative engineering environment. This is a hands-
  on leadership role where you are shaping the safety and
  integrity of the product experience that hundreds of
  thousands of freelancers rely on.



  Key responsibilities ✨

  - Lead and inspire a high-performing teamYou will directly
    manage 1-2 cross-functional squads (8 to 15 engineers),
    ensuring a high-trust environment where talent thrives.
    This is a direct leadership role not a manager-of-managers
    position focused on setting clear direction, establishing
    strong team rituals, and maintaining high morale and
    engagement.
  - Co-build product and technical strategyPartner closely with
    the Product Director and Design Lead to co-create the
    long-term vision for the Compliance domain. You will
    translate complex regulatory requirements into a seamless
    user experience, ensuring that security measures never
    compromise platform usability. Together, you will balance
    technical debt, innovative features, and high-stakes
    roadmap priorities to deliver maximum value to our users.
  - Raise the bar on delivery and engineering excellenceOwn the
    delivery lifecycle by setting and tracking KPIs for
    velocity and quality. You’ll master the art of the trade-
    off, strategically balancing rapid delivery with long-term
    architectural health. By aligning team output with company
    strategy, you ensure every engineering effort drives
    maximum impact and scale.
  - Knowledge multiplier You will also contribute to the
    Engineering Manager Guild to scale these best practices
    and strategic frameworks across the entire organization
  - Own our compliance ecosystemYou’ll be the primary tech point
    of contact for our external partners, from PSPs to legal
    data providers. You’ll ensure smooth integration,
    operational reliability, and long-term scalability in this
    core part of Malt’s product.

  About you 🧑‍🚀

  - Hands-on Manager: You maintain your “technical mentorship”
    through code reviews and architecture discussions. You
    likely have a strong backend foundation (ideally in
    java/Kotlin) and a passion for engineering excellence.
  - Systems Thinker: You thrive in fast-paced, evolving
    environments and excel at managing technical migrations or
    structural shifts without losing focus on the mission.
  - Compliance Domain experience: You have a deep background in
    scaling compliance or fintech systems. You understand the
    unique constraints of high-security environments and how
    to navigate them without slowing down.
  - Strategic Risk Manager: You are comfortable at the
    intersection of tech and regulation. You know how to make
    high-impact decisions that protect the business while
    enabling product growth
  - Impactful Communicator: Fluent in English (French is a
    bonus), you can distill complex technical or AI concepts
    into clear, actionable insights for stakeholders at any
    level.
  - Technical watch: You keep an eye on emerging tech,
    especially around AI. You don’t need to be an expert, but
    you’re eager to explore how it can help your team deliver
    more value, faster.

  How to join the mission? 🚀

  - First call with Alex, our Talent Acquisition Business
    Partner, to better understand your background,
    aspirations, and answer any questions you may have. (45
    minutes)
  - Interview with your future manager, Jean (VP engineering),
    to delve into your experience and the specifics of the
    role. (60 minutes)
  - Product case and debrief with PM, Design & EM to explore how
    you collaborate with stakeholders, manage conflicts,
    delivery, and innovation
  - Technical case and debrief with staff engineers to validate
    your mastery of technical and architectural subjects
  - Final interview with Claire (CTO) to discuss Malt’s long-
    term vision (interview at the Paris office)

  Life on planet Malt is the perfect space to thrive
  personally and professionally 💫



  🤝 Onboarding: Before easing into your new role, you’ll spend
  your first week learning about our culture, products, and
  services with other onboardees at our office in Paris.

  💻 Remote work: Hybrid remote policy - 3 days office / 2 days
  home-office.

  🏖️ Annual leave: 30 days/year.

  📆 Sabbatical: 1 month paid sabbatical once you've been with
  Malt for 3 years.

  📈 Stock options: Every Malter is entitled to stock options.

  🩺 Private health insurance: Rewarded for healthy living by
  our UK provider Bupa.

  🚴 Cycle to work scheme: Save on a bike and equipment.

  🚊 Season ticket loan: Save on public transport.

  💸 Pension: Malt contributes 5% through Aviva.

  🐶 Dog friendly office: In the heart of London!

  📚 Free books: If you’re interested in learning more about
  any topic relevant to your career, just tell us the books
  you’d like to read, and we’ll order them for you—without any
  questions asked or approval processes to follow.



  Ready? Get your ticket to Malt 🪐



  At Malt, we are committed to fostering an inclusive and
  diverse workplace. We recruit based on skills, experience,
  and potential, without any form of discrimination related to
  age, gender, sexual orientation, ethnicity, religion, or
  disability. Our mission is to create a work environment
  where everyone feels valued, respected, and safe to thrive.



  Your profile may be subject to background screening. For
  more information see our candidate privacy policy.
