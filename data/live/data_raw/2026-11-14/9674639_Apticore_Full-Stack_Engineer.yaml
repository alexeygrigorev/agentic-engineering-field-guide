description: |
  We are Cyber Health, a powerful cyber security for
  individuals.

  About Us

  The Cyber Health Company empowers individuals with products
  and professional services to improve their cybersecurity,
  digital privacy and digital hygiene. We unapologetically
  offer human customer service. We believe that in 2025,
  cybersecurity and digital privacy are not features but a
  primary value proposition.

  We work directly with individuals and families but are often
  sponsored by companies to support their senior team’s
  personal cybersecurity outside the corporate environment.
  Similar to covered healthcare, we are paid for by an
  employer but privacy-preserving with each executive.

  We are based in New York and raised capital from CEOs of
  unicorns and top-tier venture capital funds who seeded
  Square, AirBnb, Uber, Masterclass, Thumbtack and OpenDoor.
  We are passionate about building a meaningful technology
  company here.

  About You

  - ‘Cyber Health first’ - you already make decisions with Cyber
    Health in mind. You think about cyber security, privacy,
    and digital hygiene as you interact with others and
    navigate the online world throughout the day.
  - Startup mentality - Startups are underdogs and being an
    early employee in a start-up company is hard. Hard work,
    agility and scrappiness are necessary conditions to
    achieve the impossible. You are a self-starter and are
    self-motivated.
  - Super organized - startups are in constant growth mode,
    putting out fires left and right. You are detail-oriented
    and can remain organized as a calm in the storm.
  - Empathy for others - you enjoy resolving technical issues
    for others and have empathy for people with less technical
    skills than yourself
  - All things tech - you have a proven ability to master new
    apps, software, and operating systems in support of our
    members’ needs

  Requirements

  - 3+ years of experience as a Full-Stack Software-Engineer,
    preferably including prior startup experience
  - Experience developing in TypeScript for both the backend
    (Node) and frontend (React)
  - Experience deploying and supporting applications in a public
    cloud environment, such as
  - AWS or GCP
  - Experience designing and maintaining a database schema,
    preferably for a document-based database like MongoDB
  - Experience assessing and consuming 3rd party APIs

  Nice To Have

  - Experience with web automation, preferably utilizing
    Puppeteer
  - Experience developing and deploying an Electron application

  What we offer

  - A chance to define Cyber Health for the world and positively
    impact the cybersecurity, digital privacy and digital
    hygiene of millions
  - Proximity to the customer. You are not in the back office,
    you are on the front lines delivering Cyber Health to
    people who need it most
  - Access to product market fit. We need to hire because we
    cannot support existing demand.
  - An opportunity to sharpen your skills alongside a qualified,
    motivated team
  - Competitive salary, founding team equity, and health
    benefits.
  - Stock options in a high-growth company consummate with being
    an early employee
