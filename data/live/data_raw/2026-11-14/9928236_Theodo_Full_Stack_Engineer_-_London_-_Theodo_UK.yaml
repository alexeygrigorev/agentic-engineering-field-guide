description: |
  Role Mission

  From day one, you will be given the opportunity to engage
  directly with clients including CEO’s and co-founders to
  understand their needs and deliver bespoke solutions.
  You’ll dive straight into hands-on learning, guided by
  experienced developers who will mentor you and set you up to
  manage your own projects.  As you grow, you’ll take on more
  responsibility, mentor junior developers and become an
  essential technical advisor within your team.  You’ll thrive
  on solving complex problems, continuously expanding your
  technical skills and tackling new challenges.



  You will work as a Full Stack Developer working on creating
  innovative web and mobile applications for our clients,
  working as part of a small, dynamic team of developers.
  You’ll collaborate closely with agile and technical coaches
  to build scalable solutions using cutting edge technologies.



  Skills

  * React.JS or React Native

  * Node.Js (javascript/Typescript) or Python Proven

  * Ability to work directly with stakeholders

  * Strong communication skills and comfortable working in
  cross-functional teams

  * Stem or Computer Science Degree or comparative experience



  Advantageous Skills

  * Nest.js

  * AWS

  * Expo

  * Experience working in an Agile environment



  What we Offer

  Alongside a competitive salary, we also offer:



  * 25 Days annual leave

  * Learning and Development Support throughout your career at
  Theodo

  * Private Health Insure Via Vitality

  * 3 week work from anywhere policy

  * Equipment budget for your tech set up

  * Company pension

  * Monthly Socials

  * A Slack network of 600+ engineers across our extended
  ecosystem — ask questions, share patterns, or troubleshoot
  obscure bugs with some of the sharpest devs out there.

  * You'll work on a hybrid basis from our office based in
  London.



  Who are we

  Theodo UK is a software consultancy specialising in full-
  stack development, mobile and web applications and cloud
  solutions.   We are a 70-person team based in the UK and
  South Africa, and we’re growing quickly.Theodo UK operates
  with the entrepreneurial drive, agility and ownership
  mindset of a start-up, but with the financial stability,
  global reputation and technical depth of the wider Theodo
  Group behind us. This unique position allows our team to
  innovate quickly, take smart risks, and build real value for
  clients—without compromising on quality. We follow Lean and
  Kaizen principles to continuously improve and deliver high-
  quality digital products at speed.



  While headquartered in the UK, our reach is global.
  Supported by our South African team, we manage projects
  across English-speaking markets worldwide.



  Values

  Team Spirit

  Our team has a natural ability to work together to achieve a
  common goal.  Taking on the role of a good teammate requires
  courage; it means challenging and giving each other
  feedback. Its key to our teams succeeding

  Pragmatism

  Achieving effective results by utilising resources
  efficiently and avoiding unnecessary waste of time, energy
  and money.  Emphasising agile practives, employing concise
  and direct interactions and engaging in firsthand
  experiences to challenge beliefs

  Willingness to Improve

  Actively identifying areas for improvement rather that
  tolerating good enough, promptly learning from problems and
  embracing challenges outside of one’s comfort sone.  These
  are all skills we promote in our team to benefit themselves,
  fellow Theodoers, Theodo and the wider community
