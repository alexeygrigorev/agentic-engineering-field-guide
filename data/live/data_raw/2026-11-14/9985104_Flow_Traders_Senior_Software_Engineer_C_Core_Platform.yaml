description: |
  Flow Traders is looking for Senior C++ Software Engineers to
  join our growing team in Amsterdam. Software Engineers at
  Flow Traders provide us with our competitive edge, equipping
  Researchers and Traders with the information and
  capabilities that they need to make sound business
  decisions. C++ plays a critical role in our event-driven
  trading systems, which are designed to reliably handle vast
  amounts of data at ultra-low latencies.

  As a C++ Engineer, you will build systems used to analyze
  and trade tens of thousands of products across hundreds of
  global trading venues every day. Working closely with
  Technologists, Quantitative Researchers, and Traders, you’ll
  guide the development of our in-house trading technology and
  optimize it to achieve market-leading performance and
  reliability. Our proprietary trading platform includes
  everything from venue connectivity (feed handlers and
  ordering gateways) to trading engines to shared platforms
  that enable us to work quickly and efficiently - we are
  proud of our open and collaborative culture, so you’ll have
  plenty of opportunity to find what fits you best.

  Teamwork is one of our most important firm values, and end
  users are never more than a short walk away, guaranteeing
  short feedback loops and immediate insight into the value
  that your code provides. To foster collaboration and
  innovation, we maintain shared libraries, encourage code re-
  use, and continuously evolve our views on application
  architecture.

  What you will do:

  Main technical activities include:

  For all C++ openings:

  - Lead the development and global rollout of our Core platform
    used in multiple business/focus groups (Market data,
    Quantitative research, Pricing, Strategies)
  - Be involved in the development process, which will be a
    fast-paced iterative process where you deploy your
    deliverables and validate them yourself and/or together
    with traders or quants
  - Develop tools/frameworks to deliver capabilities for
    tuning/develop data-driven systematic pricing and trading
    strategies
  - Work together with focus group engineers, Quants and
    Technical traders to refine requirements, collect
    feedback, and iterate on design and implementation of
    platform requirements

  Exchange Connectivity:

  - Write software that communicates with exchanges through
    their APIs, receiving market data and sending orders over
    the network in different protocols, such as FIX, Websocket
    or HTTP requests
  - Ensure quality of software based on a set of testing suites,
    which you are expected to use, maintain and extend
  - Optimize exchange communication through kernel bypass,
    optimizing TLS or the connection handling to an exchange
  - Research exchange behavior in detail to align our behavior
    to that of an exchange
  - Implement these solutions using the provided exchange SDKs
    in different languages such as C++, Rust, Python,
    Typescript

  Trading Strategies:

  - Implement trading algorithms based on requirements provided
    by traders and quants
  - Acquire and develop the necessary trading knowledge to
    successfully translate the requirements into actual
    software implementation
  - Continuously improve the stability, reliability, and
    performance of the trading engine
  - Enhance monitoring and observability in collaboration with
    the Trading Operations team
  - Investigate and resolve production issues such as crashes,
    unexpected business logic behavior, and performance
    bottlenecks
  - Prepare for releases and deployments of new trading engine
    versions

  What you need to succeed

  - BSc, MSc, or PhD in Computer Science, Mathematics or
    equivalent
  - 5+ years post-graduation professional C++ software
    development experience (proprietary trading industry
    preferred)
  - Ability to write clean, reliable, and highly scalable code
  - Good knowledge of algorithms and data structures
  - Experience in parallel, asynchronous, and multithreaded
    programming
  - Interest in achieving maximum performance from available
    hardware and software
  - Ability to communicate with technical and non-technical
    business colleagues

  What we offer

  At Flow Traders, we create the conditions for hard‑working,
  high‑performing people to do their best work. From a
  thorough onboarding and ongoing access to Flow Academy, to
  latest technology and a collaborative, non‑hierarchical
  culture, we give you the tools, ownership, and support to
  move fast and drive outcomes. We keep a close‑knit,
  small‑company feel while offering competitive salary, annual
  discretionary profit share, and comprehensive benefits, so
  talent can grow here, and stay here. See our benefits below:

  - Flow Academy and opportunities to attend domain-related
    conferences
  - Daily catered lunch, great coffee, and a fully stocked
    kitchen and snack bar
  - In-house Bar and Lounge with arcade, table tennis,
    billiards, and game consoles
  - Company boat
  - In-house gym and sessions with our nutritionist or personal
    trainer
  - Bi-weekly massages
  - Annual company trip and a variety of events throughout the
    year, such as the New Years Event
  - Global rotations across our offices worldwide
  - and more

  Flow Traders does not accept unsolicited resumes from any
  professional staffing or search firms. All resumes, and any
  other information identifying potential candidates,
  submitted to any employee at Flow Traders via email, the
  Internet or directly without a valid and signed search
  agreement will be deemed free to contact by Flow Traders
  without any restrictions and no placement fee of any kind
  will be paid in the event the candidate is hired by Flow
  Traders
