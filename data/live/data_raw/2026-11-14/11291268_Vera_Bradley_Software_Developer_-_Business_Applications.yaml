description: |
  This position is based in Fort Wayne, IN or New York, NY.
  FUNCTION This role is responsible for developing and
  supporting solutions within Microsoft Dynamics 365 Finance
  and Operations, as well as building integrations and cloud-
  based applications that extend and connect enterprise
  business systems. They have a deep understanding of
  Microsoft technologies such as .NET framework, SQL Server,
  and Azure, and are skilled in programming languages such as
  X++, C#, ASP.NET, and JavaScript. They are eager to learn
  other software and work collaboratively with other team
  members to analyze business requirements, design solutions,
  and develop high-quality software that meets user needs.
  They are also responsible for ensuring software quality
  through testing, debugging, and documentation, and keeping
  up to date with the latest Microsoft technologies and
  trends.

  ESSENTIAL DUTIES & RESPONSIBILITIES (Note: Other duties may
  be assigned)

  To perform this job successfully, an individual must be able
  to perform each essential duty satisfactorily. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.

  - Work with cross-functional teams to identify and understand
    business needs and requirements in the retail industry
  - Develop, design, and maintain software applications,
    Dynamics 365 Finance & Operations customizations and
    extensions, integrations, and Azure-based solutions using
    technologies including Azure, C#, X++, and SQL Server.
  - Design and support integrations between Dynamics 365 Finance
    & Operations and internal or third-party systems using
    Azure services, APIs, and event-driven architectures.
  - Collaborate with the data engineering and data science teams
    to ensure that software applications are integrated with
    data pipelines and analytics processes appropriately
  - Create and maintain technical documentation to ensure that
    software applications are consistent and scalable
  - Work with product managers and stakeholders to identify and
    manage project requirements, timelines, and risks
  - Stay up-to-date with industry trends and best practices in
    software development, Microsoft technologies, and cloud
    computing on the Azure platform.
  - Support ongoing technology maintenance, such as upgrades and
    updates, across platforms
  - Mentor team members and share knowledge

  EDUCATION AND/OR EXPERIENCE

  - At least 3 years of experience in software development using
    Microsoft technologies including Azure, C#, X++, and SQL
    Server and other platforms
  - Bachelor's or Master's degree in Computer Science,
    Information Technology, or a related field

  KNOWLEDGE, SKILLS, AND ABILITIES

  The requirements listed below are representative of the
  knowledge, skills, and/or abilities required to perform each
  essential duty satisfactorily. Reasonable accommodations may
  be made to enable individuals with disabilities to perform
  the essential functions.

  - Experience in the retail industry, especially with regards
    to software applications and business operations preferred
  - Strong knowledge and experience in software development
    practices including Agile frameworks like Scrum and Kanban
  - Strong analytical and problem-solving skills with the
    ability to design, build, and maintain scalable and
    reliable software applications
  - Strong communication and collaboration skills with the
    ability to work effectively in a team environment
  - Experience in cloud computing on the Azure platform,
    especially with regards to software development and
    deployment
  - Excellent PC skills utilizing Microsoft Office software
  - Proven problem solving and analytical skills
  - Detail oriented with the ability to manage multiple tasks
    simultaneously
  - Excellent organization and follow through skills
  - Excellent interpersonal, written and verbal communication
    skills
  - Ability to build and maintain good rapport with internal and
    external customers and handle situations with confidence,
    tact and resourcefulness
  - Flexible, adaptable with the ability to work under pressure
    to meet deadlines in a fast paced office environment

  ENVIRONMENT & PHYSICAL DEMANDS

  The physical demands described here are representative of
  those an individual must meet to successfully perform the
  essential functions of this job. Reasonable accommodations
  may be made to enable individuals with disabilities to
  perform the essential functions.

  - Office environment. Utilizing an office desk – sitting,
    reading, listening, or speaking with the ability to move
    intermittently throughout the day
  - Strong sensory skills, such as good eyesight, good hearing,
    and dexterity
  - Ability to operate office equipment, including computers,
    copiers, fax machines, and phones

  We are proud of the competitive and comprehensive
  compensation and benefit package provided to our associates
  and their families. Our compensation package is designed to
  meet our associates today and help them plan for the future.

  Health Benefits

  Vera Bradley offers a variety of medical, dental and vision
  programs to meet your family’s health care needs.

  - Medical plan options including both a HDHP/HSA plan and a
    PPO plan
  - Dental
  - Vision
  - Flexible spending accounts

  Survivor Benefits

  Life insurance provides peace of mind for your family should
  the unexpected happen.

  - Employer provided 2X your salary in life insurance
  - Accidental Death and Disability insurance
  - Voluntary life insurance for you, your spouse and your
    children

  Income Protection

  If you are unable to work due to illness or injury Vera
  Bradley provides several programs to protect your income at
  no cost to you.

  - Short-term disability
  - Long-term disability

  Retirement Plan

  The Vera Bradley 401k plan helps you accumulate savings for
  retirement

  - 401k with generous company match, immediate vesting (age and
    service requirement)
  - Strong line up of professionally managed funds
  - Safe-harbor plan design

  Paid Time Off

  Enjoy generous time off programs.

  - Earn up to 3 weeks of paid time off in your first year of
    employment with opportunity to earn more
  - 9 paid holidays a year
  - Paid bereavement leave

  Give Back Opportunities

  Vera Bradley offers the opportunity to serve your community.

  - Voluntary Time Off

  Holistic Wellness

  - Access to a variety of financial, physical, and mental
    wellness experts

  - Employee Assistance Program with access to work/life
    wellness support including no cost unlimited telephonic
    counseling services
  - Opportunities for leadership development, skill development
    and career advancement

  Product Discount

  - Generous employee discount on Vera Bradley products

  Ancillary Benefits and Programs

  - Bonus opportunity, identity protection, legal services, pet
    insurance, cell phone discount, employee referral bonus,
    annual birthday gift, DailyPay, corporate fitness facility
    and individual policies through Aflac

