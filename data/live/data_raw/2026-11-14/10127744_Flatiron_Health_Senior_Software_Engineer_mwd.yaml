title: Senior Software Engineer (m/w/d)
company: Flatiron Health
location: Berlin, DEU
work_type: FULL_TIME
company_size: 2,500 Employees
description: |
  We're looking for a Senior Software Engineer to help us
  accomplish our mission to improve and extend lives by
  learning from the experience of every person with cancer.
  Are you ready to be the next changemaker in cancer care?
  Flatiron Health is a healthtech company using data for good
  to power smarter care for every person with cancer, around
  the world. Flatiron partners with cancer centers in the US,
  Europe and Asia to transform patients' real-life experiences
  into real-world evidence and create a more modern, connected
  oncology ecosystem. Our multidisciplinary teams include
  oncologists, data scientists, software engineers,
  epidemiologists, product experts and more. Flatiron Health
  is an independent affiliate of the Roche Group. What You'll
  Do This role will design and develop technology in
  partnership with other software engineers in the US, UK,
  Germany, and Japan. Additionally, this role will collaborate
  day-to-day with oncologists, clinicians, product leaders,
  quantitative scientists, and customers to understand their
  challenges and how technology can help solve them.

  - Create new or enhance existing business critical, complex
    data pipelines using a variety of data processing tools
    and automation
  - Expand our capabilities in Deep Learning and LLM-powered
    extraction of clinical insights from global datasets
  - Devise creative solutions for technical and business
    challenges to help the team scale
  - Contribute to shaping the direction of team roadmaps and
    technology development
  - Help build our European engineering teams and company
    culture as we grow
  - Rapidly iterate on products while maintaining engineering
    practices that ensure quality and security
  - Bring or develop a deep knowledge of healthcare in Germany,
    including data sources, security, privacy, information
    governance requirements, and emerging trends

  Who You Are You're a kind, passionate and collaborative
  problem-solver who values the opportunity to think beyond
  the way things are. You're excited by the prospect of
  working on difficult and meaningful problems each day. You
  seek and give candid feedback, and value the chance to make
  an important impact on cancer patients and society.

  - You're a data engineer with 4-8 years of relevant
    professional experience
  - You are excited to work in a startup environment, think
    creatively and be scrappy to get the job done
  - You are excited about working in a passionate, fast-paced,
    technology-driven culture
  - You have a nose for value and empathy for your customers
  - You have experience with agile development environments
    using object-oriented programming languages (e.g. Python,
    C#, SQL), but are also language agnostic and willing to
    pick up new programming languages as needed
  - You have experience working with cloud platforms like AWS
    and data warehouse solutions like Snowflake
  - You have experience with data processing and orchestration
    tools such as Databricks, Spark, Ray, DBT, Prefect, and/or
    Airflow
  - You act as an expert in your domain area, and as a partner
    with product teams
  - You understand the purpose of "boring" technology (as
    described in this blog post) and are willing to use the
    right tools to get the job done
  - You can collaborate and easily explain technical terms to a
    non-technical, highly sophisticated audience; you have
    superior communication skills
  - You are comfortable with ambiguity and always willing to
    teach and learn
  - You are fluent in English

  Optional

  - You have experience working in healthcare in Germany or
    exposure to healthcare-related standards like HL7
  - You hold a Bachelors, Masters, and/or Ph.D. in computer
    science or a related field
  - You have experience in infrastructure, devops, or security
    engineering
  - You are conversational in German

  Who We Are Our people are at the centre of everything we do.
  We strive to foster a culture where our teammates feel
  equipped and empowered to make meaningful contributions with
  confidence, compassion, and clarity. Preferred Primary
  Location: Berlin office The annual pay range reflected above
  for this position is based on the preferred primary location
  of the role which is listed in the job description. Salary
  ranges for other locations vary from the range reflected
  above. Base pay offered may vary depending on job-related
  knowledge, skills, and experience. An annual bonus and
  equity may be provided as part of the compensation package,
  in addition to a full range of medical, financial, and/or
  other benefits, dependent on the position offered.
