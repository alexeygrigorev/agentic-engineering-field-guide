description: |
  About Extend:

  Extend is revolutionizing the post-purchase experience for
  retailers and their customers by providing merchants with
  AI-driven solutions that enhance customer satisfaction and
  drive revenue growth. Our comprehensive platform offers
  automated customer service handling, seamless
  returns/exchange management, end-to-end automated
  fulfillment, and product protection and shipping protection
  alongside Extend's best-in-class fraud detection. By
  integrating leading-edge technology with exceptional
  customer service, Extend empowers businesses to build trust
  and loyalty among consumers while reducing costs and
  increasing profits.

  Today, Extend works with more than 1,000 leading merchant
  partners across industries, including fashion/apparel,
  cosmetics, furniture, jewelry, consumer electronics, auto
  parts, sports and fitness, and much more. Extend is backed
  by some of the most prominent technology investors in the
  industry, and our headquarters is in downtown San Francisco.

  About the Role:

  We are looking for an exceptional Software Engineer II to
  join the Extend Fulfillments team, a core pillar driving our
  company's growth and customer satisfaction. This role offers
  a unique opportunity to build impactful software used by
  some of the largest ECommerce and Brick and Mortar merchants
  in the industry, and directly influencing how our merchants
  make their customers whole.

  You’ll partner closely with cross-functional teams in
  product, design, operations, delivery and the broader
  engineering organization - contributing significantly to a
  culture of innovation, continuous improvement, and
  excellence.

  What You’ll Do:

  - Build and ship features across all aspects of fulfillment
    and servicing, including refunds, replacements, reverse
    logistics, and more, taking on ambiguous problems with
    growing independence.
  - Own features end to end, from design through building,
    deployment, release, and monitoring.
  - Deliver scalable, event-driven, AI-native applications that
    elevate the customer experience.
  - Build single-page applications, partnering with design on UX
    and owning client and server state management to ship
    polished, high-quality apps.
  - Work with senior engineers and platform teams on system
    design, raising risks and tradeoffs early.
  - Build, test, and monitor AI/agentic features in production,
    with clear attention to quality and safety.
  - Use AI developer tooling daily to ship more, and share the
    habits that make it effective with your team.
  - Spot and propose proactive investments (refactors,
    observability, upgrades) and deliver them in the areas you
    own.
  - Communicate clearly with product, design, solutions, and
    other engineering teams so your work lines up with
    business goals.

  What We’re Looking For:

  - 4+ years of full-stack experience
  - Hands-on experience building production systems on AWS,
    including serverless
  - Demonstrated experience shipping AI/LLM features to
    production
  - A solid grasp of API design, versioning, idempotency, and
    backwards compatibility — and why they matter where events
    drive money movement or fulfillment
  - A track record of owning features end to end and working
    through ambiguous problems with limited direction
  - Experience building production single-page applications with
    modern state management, and a habit of working closely
    with designers to turn UX into quality software.
  - Sound data modeling skills and a working understanding of
    context engineering for agentic features
  - Daily fluency with AI developer tooling and a habit of
    sharing what works with teammates
  - Willingness to raise concerns early and push back with data
  - Clear communication across product, business stakeholders,
    designers, support, and engineers
  - Ability to form clear opinions and advocate for them

  Expected Pay Range: $140,000 - $160,000 per year salaried*

  *The target base salary range for this position is listed
  above. Individual salaries are determined based on a number
  of factors including, but not limited to, job-related
  knowledge, skills and experience.

  Extend does not provide immigration-related sponsorship for
  this role.

  Life at Extend:

  - Working with a great team from diverse backgrounds in a
    collaborative and supportive environment.
  - Competitive salary based on experience, with full medical
    and dental & vision benefits.
  - Stock in an early-stage startup growing quickly.
  - Generous, flexible paid time off policy.
  - 401(k) with Financial Guidance from Morgan Stanley.

