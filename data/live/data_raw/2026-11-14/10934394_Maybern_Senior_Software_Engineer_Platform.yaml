description: |
  Who We Are

  Maybern is transforming the way private fund managers
  effectively manage their funds through cutting edge
  technology: an operating system with deterministic guard
  rails underneath, agents on top. Maybern is founded by top
  engineering experts with deep knowledge of the fund
  management space.

  Private funds manage $15T in capital and are growing at 20%
  YoY, but with increasing regulatory scrutiny and investor
  demands for transparency, the need for more modern, fully
  agentic solutions to help private fund CFOs is crucial.

  This is where Maybern comes in.

  We are equipping fund managers with a fully agentic
  operating system for private fund management, enabling
  private investment managers to focus on what they do best:
  driving returns for their investors. We are backed by
  leading venture capital firms and a large number of
  strategic investors.

  Maybern is an NYC based company with a strong in-office
  culture to drive collaboration, and we are looking to make
  strong additions to our team.

  What We're Looking For

  We are looking for a Senior Software Engineer to help drive
  the evolution of our platform.

  The Platform Team provides core components for the rest of
  the Maybern engineering team to build on top of, including
  foundational data modeling, integration testing, and release
  tooling. We aim to create simple, reliable interfaces for
  complex systems to enable our engineers to move quickly yet
  safely, so our product teams can focus on delivering value
  for our customers.

  The right candidate's north star is developer productivity:
  you design, build, and rigorously test solutions so that
  product teams can stay focused on customer features while
  the complexities of scalability, performance, and
  fault‑tolerance are handled transparently by the platform.

  What You'll Do

  To thrive in this role, you must be an entrepreneurial
  engineer who enjoys solving complex problems

  - Build: Architect, scope, and build core parts of our system
    from the ground up
  - Lead: Identify and drive new initiatives while mentoring
    junior engineers
  - Partner: Work closely with other engineers to design
    elegant, flexible solutions that solve their problems
    while being forward-thinking about future use cases

  Who You Are

  - Developer Experience Mindset. On our Platform team, you will
    shape the internal tools and services that let product
    engineers move fast without tripping over infrastructure
    details. You understand how to turn engineering needs into
    opinionated, self‑service platforms that are reliable,
    observable, and easy to extend.
  - Collaborative. You collaborate well across teams, can
    distill and incorporate feedback, and communicate clearly
    and concisely
  - Leader. You're eager to shape our technical foundation and
    will level up team practices and processes. You can take
    broad guidance and determine the best path forward. You
    thrive in a fast-paced environment and are comfortable
    wearing multiple hats
  - Strategic. You see both the forest and the trees: think big
    picture, execute fine details. You can plan for the long
    term while navigating short-term tradeoffs
  - AI-Forward. You’re excited about applying AI where it
    creates real leverage for engineers. You can build and own
    AI-enabled developer tools, internal workflows, and
    automated engineering processes.

  This Could Be a Great Fit If You...

  - Are comfortable working across server-side languages and
    frameworks; we’re tech-agnostic in interviews, and use
    Python and Django in practice.
  - Have 6+ years of software engineering experience, including
    meaningful exposure to cloud infrastructure, platform
    systems, or developer-facing tools.
  - Have experience monitoring cloud applications, responding to
    incidents, and improving production reliability and
    observability.
  - Understand relational databases, transactions, distributed
    systems, and the tradeoffs involved in building reliable
    services.
  - Can take broad guidance, scope ambiguous work, and
    independently drive complex projects forward while
    collaborating closely across the organization.
  - Thrive in a fast-paced, collaborative environment with
    shifting priorities and broad ownership; early-stage
    startup experience is a plus.
  - Are excited about building tooling to help developers move
    quickly and safely in an AI first development environment.

  Benefits

  - We offer a competitive salary + equity package,
    comprehensive benefits, and a flexible family-friendly
    work environment. Some of our perks include:
    - Comprehensive healthcare benefits
      - Maybern covers 100% of medical, dental, and vision premiums
        for individuals
      - HSA & FSA plans
    - Family-Friendly policies
      - Paid parental leave
    - Flexible schedule
      - Flexible PTO / sick leave
      - WFH as needed to fit your needs
    - 401k
