description: |
  Joining Amex Tech means discovering and shaping your
  contribution to something big. Here, you can work alongside
  talented tech teams and build a unique career with the
  Powerful Backing of American Express. With a range of
  opportunities to work with the latest technologies, and a
  commitment to back the broader engineering community through
  open source, our mission is to power your success. Because
  Amex Tech is powered by our technology, our culture, and our
  colleagues.

  The U.S. Consumer Services and Enterprise Digital & Data
  Technology Team brings together foundational strategic
  technology capabilities in digital experience engineering
  (Mobile and Web), AI/ML, marketing technology, enterprise
  communications, travel and lifestyle, and automation,
  grounded in our data technology model that prioritizes data
  governance. It employs a ground-breaking focus with
  development responsibilities for customer-facing
  capabilities that deepen and expand digital engagement, as
  well as core technical capabilities that cut across business
  lines and customer segments.

  Be part of exciting and innovative initiatives and join a
  team of creative, curious, and passionate professionals
  whose mission is to become the future of American Express by
  staying on the cutting edge of technology and bringing
  innovation to life! The Brand Experience and Engagement
  Technology team leads the Event Marketing and AdTech
  technology strategy and platforms.

  This position works closely with our Digital Advertising
  business partners and product teams to develop and support
  critical systems and platforms for the American Express
  products and services that drive current and prospective
  customer engagement, acquisition, and loyalty via a
  multitude of channels. We are looking for a dynamic,
  innovative, action-and-results oriented senior engineer to
  support this fast-evolving eco system.

  The ideal candidate is required to be accomplished in the
  development and deployment of complex software solutions,
  with a strong focus on Cloud based engineering, various Java
  technologies, API design and user experience. The candidate
  should be able to develop innovative solutions, have a
  pragmatic approach to application architecture, and be
  excited to work on a varied tech stack. You will be expected
  to have a deep understanding of the functional platforms,
  but also contribute to planning and executing the technology
  roadmap, while being an exemplary team player and
  contributor. You are required to have a curious mindset,
  ability to question status quo and technologically advance
  the platforms, while exhibiting collaboration with other
  enterprise teams.

  This is an opportunity to work in a fast-paced, Scaled Agile
  environment with a team of engineers, product owners and
  several technology stakeholders. You should be familiar with
  modern software development methodologies and be able to
  dive deep and rapidly iterate on ideas despite ambiguity.

  Responsibilities

  - Lead and contribute to the development of Amex’s new
    advertising capabilities (e.g., ad serving, targeting,
    measurement), ensuring alignment with strategic priorities
    of the Digital Advertising team.
  - Design, build and deploy new ad capabilities, collaborating
    across numerous platforms (e.g., Amex Travel, Resy, Amex
    App) and functional teams (e.g., product, technology,
    marketing, control management, legal).
  - Support the assessments of 3-rd party technology solutions
    to determine suitability for use in the emerging platform.
  - Collaborate successfully with product owners, designers, and
    a broad set of internal tech partners (across multiple
    internal groups).
  - Perform code reviews to ensure product releases are high
    quality, deliver excellent user experiences, perform
    seamlessly at scale, and comply with regulatory
    requirements.
  - Partner with peers in technologies to identify opportunities
    for code sharing, common services, joint development.
  - Keep up with the latest industry research and emerging
    technologies to ensure we are appropriately leveraging new
    techniques and capabilities.
  - Interview to help recruit top talent with technical skills
    and non-technical skills
  - Coach and potentially lead junior engineers
  - Consistently question assumptions, challenge the status quo,
    and strive for improvement.

  Qualifications

  - Bring a strong technical foundation; able to engage the team
    on coding practices, architecture, design, get under the
    hood of complex integrated architectures, coding systems,
    and interface design.
  - Digital Advertising and/or Media network software
    engineering experience.
  - Hands-on engineering experience using and implementing
    Google Ads Manager and other similar products is
    preferred.
  - Experience with Adobe products for Marketing and Creative
    (Adobe Experience Cloud/Platform, Adobe Creative Cloud) is
    preferred.
  - Extensive experience in Software Engineering, with 8+ years
    of demonstrable experience building and deploying large
    scale software products.
  - Strong experience in design and Agile development, code
    reviews for full stack solutions.
  - Significant experience with Java, REST APIs, Cloud
    engineering, building digital experiences.
  - Strong understanding and experience in CICD and DevOps,
    system and platform resiliency.
  - Ability to communicate complex technical concepts clearly
    and concisely to non-technical individuals.
  - Experience or exposure with technology planning and road
    mapping.
  - Proven track record to lead problem analysis and resolution.
  - Bachelor’s degree in computer science, Computer Engineering
    or Information Systems degree or equivalent work
    experience; Advanced Degree preferred.



  Preferred Qualifications:

  - Knowledge of American Express Marketing & Data platforms,
    and software development practices a plus.
  - Excellent verbal and written communications skills required,
    with ability to create and deliver effective presentations
    to executive leadership and technical architects across
    the organization is a plus.
  - Proven ability to develop and execute against a platform
    vision, strategy, and priorities.
  - Deep appreciation for the importance of elegant solutions to
    technical challenges.
  - Flawless interpersonal skills and ability to partner with
    technology peers to drive technical solutions forward.

  Employment eligibility to work with American Express in the
  United States is required as the company will not pursue
  visa sponsorship for these positions.






  About Us

  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. From delivering
  differentiated products to providing world-class customer
  service, we operate with a strong risk mindset, ensuring we
  continue to uphold our brand promise of trust, security, and
  service.

  As part of Team Amex, you’ll experience our powerful backing
  with comprehensive support for your holistic well-being and
  many opportunities to learn new skills, develop as a leader,
  and grow your career. Here, your voice and ideas matter,
  your work makes an impact, and together, you will help us
  define the future of American Express.

  About the Team

  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:

  - Competitive base salaries
  - Bonus incentives
  - 6% Company Match on retirement savings plan
  - Free financial coaching and financial well-being support
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - 20+ weeks paid parental leave for all parents, regardless of
    gender, offered for pregnancy, adoption or surrogacy
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities

  For a full list of Team Amex benefits, visit our Colleague
  Benefits Site.

