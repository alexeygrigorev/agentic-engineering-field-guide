description: |
  Full Stack Engineer

  Role Overview

  As a Full Stack Engineer on the Core Feature Team, you’ll
  work across the stack to

  build, maintain, and optimize key product features that
  empower Cinch customers to

  reach and retain their audiences more effectively. While
  your focus will be backend

  development you’ll also contribute to front-end work in
  React to deliver cohesive,

  intuitive user experiences. You’ll collaborate with
  engineers, designers, and product

  managers to bring ideas from concept to deployment—balancing
  quality, performance,

  and innovation.

  Key Responsibilities

   Design and implement backend APIs and services using
  Django/Django REST

  Framework.

   Develop and integrate front-end components using React

   Collaborate with designers and product managers to
  translate business needs

  into technical solutions.

   Write clean, reusable, and testable code across the stack

   Troubleshoot, debug, and resolve production issues
  efficiently.

   Participate in feature refactoring and codebase
  optimizations for maintainability.

   Work with PostgreSQL databases to ensure data integrity
  and efficient query

  performance.

   Use Docker and AWS to develop, test, and deploy
  applications in a scalable

  environment.

  Qualifications

   Bachelor’s degree in Computer Science or related field, or
  equivalent experience.

   3–5 years of professional experience as a software
  engineer.

   Proficiency in Python, Django/Django REST Framework, and
  PostgreSQL.

   Working knowledge of React and modern front-end
  development practices.

   Experience with Docker and AWS in a production
  environment.

   Familiarity with RESTful design patterns and secure API
  development.

   Familiarity with version control systems and agile
  methodologies

  Skills

   Strong backend foundation with solid front-end
  understanding.

   Proficiency in debugging and problem-solving across
  multiple layers of the stack.

   Ability to collaborate effectively with cross-functional
  teams.

   Commitment to writing clean, maintainable, and performant
  code.

   Growth mindset and eagerness to learn new technologies.

  Why Join Cinch?

  At Cinch, you’ll work in a cloud-native, SaaS environment
  that embraces agility,

  innovation, and collaboration. You’ll be part of a team that
  values ownership, continuous

  learning, and high-impact engineering—building products that
  redefine how businesses

  connect with their customers.

  About Cinch

  At Cinch, we’re revolutionizing the omnichannel marketing
  industry by building the best

  marketing automation platform targeting multi-location
  businesses. Our platform

  centralizes customer data and enables personalization and
  automated outreach across

  channels—such as email, SMS, digital ads, and direct mail—to
  enhance retention and

  drive growth.

  Join us to be part of a vision that prioritizes customer
  experience and technological

  excellence.

  Compensation

  The base pay range for this role is $3,500 – $5,000 per
  month.
