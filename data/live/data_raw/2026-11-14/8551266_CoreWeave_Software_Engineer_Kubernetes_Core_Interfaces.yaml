description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do:

  The Kubernetes Core Interfaces Team at CoreWeave builds the
  control plane that powers our cloud infrastructure at scale.
  Our team ensures that the Kubernetes platforms running
  CoreWeave’s GPU workloads are reliable, fault-tolerant, and
  easy to operate, providing deep insights and smooth
  experiences for users and internal teams alike.

  About the role: As an Engineer on the Kubernetes Core
  Interfaces Team, you’ll design and implement scalable
  solutions that simplify administration and enhance the user
  experience of CoreWeave’s Kubernetes platforms. You will
  develop Helm charts, custom controllers, API endpoints, and
  other control plane components, while building automation,
  dashboards, alerts, and testing frameworks. You’ll
  participate in the on-call rotation and collaborate closely
  with your teammates in a supportive, high-performance
  environment that encourages curiosity, ownership, and
  personal growth.

  Some of what you’ll work on:

  - Design and implement solutions for scale, fault tolerance,
    and operational simplicity in CoreWeave’s Kubernetes
    platforms.
  - Develop Helm charts, custom controllers, CRDs, gateways, API
    endpoints, and other Kubernetes control plane components.
  - Build deployment automation, monitoring dashboards, and
    operational insights for Kubernetes services.
  - Participate in the team’s on-call rotation, contributing to
    incident response and operational excellence.
  - Collaborate with teammates to share ideas, provide feedback,
    and grow together in a high-trust environment.

  Who You Are:

  - 3+ years of experience in software or infrastructure
    engineering.
  - Experienced in developing fault-tolerant, testable software
    services, primarily using Go.
  - Familiar with Kubernetes concepts and/or experienced
    administrating Kubernetes clusters.
  - Comfortable working with Linux systems, shell scripting, and
    Linux storage/networking stacks.
  - Collaborative, curious, and excited to contribute to a
    diverse, high-performance team.

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You enjoy solving complex challenges at scale and improving
    operational workflows.
  - You’re curious about cloud infrastructure, Kubernetes, and
    high-performance systems.
  - You thrive in a collaborative environment, sharing
    knowledge, and learning from teammates.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $109,000 to $160,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

