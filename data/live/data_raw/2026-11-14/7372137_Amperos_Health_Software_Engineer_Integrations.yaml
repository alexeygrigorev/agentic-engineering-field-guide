description: |
  About Amperos

  Amperos is healthcare's first AI-native denial management
  and revenue recovery platform. Our agentic AI works claims
  end-to-end, from portal follow-ups and payor calls to
  appeals and medical records, so providers can resolve more
  denials, recover more revenue, and focus on what matters
  most: serving patients.

  We just closed a $16M Series A led by Bessemer Venture
  Partners, with continued participation from Uncork Capital
  and Neo. We're still small, still early, and going after a
  $260B+ problem that's only getting worse. If you want to
  work on hard problems that matter, alongside people who care
  deeply about the mission (and each other), we'd love to meet
  you.

  About Amperos Health

  Amperos Health is the leading provider of multi-modal RCM
  agents empowering healthcare clinics to collect more
  revenue, faster. Founded in 2023 and backed by Uncork, Neo,
  Nebular.vc and strategic angels from OpenAI, Stripe, and
  Twilio, we're on a mission to revamp the bridge between
  healthcare providers and payers. Our vision is to equip
  healthcare providers with an AI workforce that reduces
  administrative burden and accelerates revenue.

  About the role

  Our clients are on many different healthcare PM systems that
  are either remote desktops or browser based and often behind
  strict security requirements. We need to use a combination
  of APIs (usually not possible), RPA, and agentic methods to
  be able to enable the capabilities we offer.

  To support our fast growth and new customers, we need to be
  able to build out new integrations for new systems
  efficiently as well as develop a framework for reliability
  and monitoring. You’ll get to join our new Integrations team
  and shape how this team grows.

  What you’ll do

  - Build and maintain integrations with healthcare EMR software
    using APIs, RPA, or agentic flows
  - Work closely with clients to figure out how to access their
    PM system and how it works to be able to build a
    successful automation
  - Implement monitoring and observability infrastructure to
    make our integrations more reliable
  - Figure out how to scale building integrations for new PM
    systems with a repeatable framework
  - Prototype and productionize new capabilities that require
    integrating with PM systems (ie. fetching certain pieces
    of data from PM systems)

  Who we’re looking for

  - 5+ years of experience in software engineering specifically
    for healthcare integrations
  - Can work with customer directly to solve their problems
    rather than just following specs
  - Willing to wear different hats and do whatever is necessary.
    No task is beneath us.
  - High agency. You don’t need much instruction to create
    results. You pride yourself on being able to just figure
    things out.
  - Great communicator both verbally and written. You
    proactively push necessary information to the team rather
    than the team needing to pull info from you.
  - Excited to build in an industry that is underserved by
    technology and immerse themselves in the world of
    healthcare billing and revenue cycle management

  Perks & Benefits

  - Very competitive compensation
  - Paid lunch, dinner, coffee, snacks
  - In person culture at our cozy Flatiron district office in
    NYC with work from home on Fridays
  - Flexible hours and time off
  - AI subscriptions of your choice covered
  - Best-in-class Health, dental, vision insurance
  - 401(k) with matching contribution
  - Fitness stipend
  - Annual offsite

  Our Values

  - Lead with Empathy - Great products and teams are built on
    empathy—whether for our customers, users, or team members.
    We take the time to walk in others' shoes, listen
    actively, and truly understand their challenges, needs,
    and perspectives.
  - Humbly Ambitious - We combine humility with ambition. No
    task is beneath us, and no challenge too big. Greatness
    comes from being willing to do whatever it takes, while
    having the courage to take bold risks and learn from
    failures.
  - Radical Agency - Own your domain. Drive initiatives with
    autonomy and accountability. Think deeply, communicate
    with the team, and maintain a bias for action.

  Amperos never asks candidates for money at any stage of the
