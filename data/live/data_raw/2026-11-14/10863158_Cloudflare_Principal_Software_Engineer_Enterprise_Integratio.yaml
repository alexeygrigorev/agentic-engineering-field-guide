description: |
  About Us  At Cloudflare, we are on a mission to help build a
  better Internet. Today the company runs one of the world's
  largest networks that powers millions of websites and other
  Internet properties for customers ranging from individual
  bloggers to SMBs to Fortune 500 companies. Cloudflare
  protects and accelerates any Internet application online
  without adding hardware, installing software, or changing a
  line of code. Internet properties powered by Cloudflare all
  have web traffic routed through its intelligent global
  network, which gets smarter with every request. As a result,
  they see significant improvement in performance and a
  decrease in spam and other attacks. Cloudflare was named to
  Entrepreneur Magazine's Top Company Cultures list and ranked
  among the World's Most Innovative Companies by Fast Company.
  At Cloudflare, we're not looking for people who wait for a
  polished roadmap; we're looking for the builders who see the
  cracks in the Internet that everyone else has simply learned
  to live with. We value candidates who have the instinct to
  spot a "normalized" problem and the AI-native curiosity to
  create a solution using the latest tools. Our culture is
  built on iteration, leveraging AI to ship faster today to
  make it better tomorrow, while ensuring that every
  improvement, no matter how small, is shared across the team
  to lift everyone up. If you're the type of person who values
  curiosity over bureaucracy, and that AI is a partner in
  solving tough problems to keep the Internet moving forward,
  you'll fit right in. Available Locations: Austin, TX | San
  Francisco, CA | Lisbon, Portugal | London, UK About the
  Department Cloudflare's Enterprise Integrations Engineering
  Team designs, builds, and maintains integrations across the
  SaaS applications used throughout the organization. We're
  increasingly applying AI, from agentic workflows to LLM-
  assisted development and automated diagnostics, to build
  integrations faster, operate them more reliably, and reduce
  manual toil across the team. Our mission is to create
  scalable, reliable, and intelligent systems that ensure data
  flows securely and efficiently between platforms, and to use
  AI as a force multiplier for how we design, build, and
  support that work. Our team is highly collaborative, values
  continuous learning, and supports each other through shared
  ownership and open communication. We work closely with both
  technical and business teams, conduct regular
  retrospectives, and are actively evolving how AI tooling
  changes the way we plan, build, test, and troubleshoot
  integrations. What You'll Do We're looking for a Principal
  Engineer to establish technical direction across Enterprise
  Applications and help teams turn that direction into
  reliable, incremental delivery. You'll design systems, lead
  complex cross-team initiatives, influence engineering
  practices, and remain hands-on with implementation where
  your contribution has the greatest leverage. This role
  requires navigating ambiguity, adapting technical strategy
  as conditions change, and building alignment across
  engineering and business stakeholders. You'll model
  responsible AI-assisted engineering, operational excellence,
  sound judgment, and attention to detail. Responsibilities
  include:

  - Establish and communicate technical strategy across multiple
    teams, translating long-term direction into incremental
    delivery plans.
  - Lead complex, cross-functional initiatives from problem
    definition through architecture, implementation,
    deployment, and operation.
  - Influence technical decisions across teams through design
    reviews, prototypes, standards, mentoring, and hands-on
    contributions.
  - Build and extend AI-enabled systems, including agents,
    evaluation frameworks, MCP servers, and workflow
    automation.
  - Determine when AI is appropriate and when deterministic
    software offers a safer, simpler, or more reliable
    solution.
  - Establish practices for evaluating AI systems, including
    quality, reliability, security, cost, latency, and human
    oversight.
  - Improve engineering effectiveness through reusable
    platforms, operational tooling, automated diagnostics, and
    development workflows.
  - Partner with business and technical stakeholders to convert
    ambiguous problems into clear technical strategies and
    measurable outcomes.

   Desirable Skills, Knowledge, and Experience:

  - Bachelor's degree in Computer Science or related field, or
    equivalent work experience
  - 10+ years of professional software engineering experience as
    a guideline
  - Proficiency in at least one backend language.
  - Experience with LLM APIs (Anthropic, OpenAI, etc.)
  - Experience with AI guardrails/governance best practices
  - Demonstrated experience delivering AI-enabled systems beyond
    experimentation. Candidates should be able to explain
    their individual contribution, evaluation approach,
    production constraints, failure modes, and measurable
    outcomes.
  - Demonstrated experience influencing technical culture and
    best practices without authority.
  - Familiarity with integration patterns (pub/sub, API-first,
    CDM, batch processing)
  - Experience working with stakeholders to solve business
    problems through integration or automation solutions
  - Experience building APIs with proper security and
    operational practices
  - Experience with observability tooling (e.g. Grafana,
    Prometheus, Sentry, Kibana, Splunk or similar)
  - Working familiarity with containerized/cloud environments
    (Kubernetes, or equivalent cloud-native experience)
  - Experience with serverless computing platforms (e.g. AWS
    Lambda, Google Cloud Functions, Azure Functions, or
    Cloudflare Workers)
  - Experience with GitLab or other CI/CD tooling
  - Willingness to participate in an on-call rotation for
    roughly one week every two months


  Bonus Points:

  - Experience with business financial systems, such as Oracle
    or NetSuite
  - Experience with PostgreSQL
  - Experience with Cloudflare Developer Platform (Workers,
    Workflows, D1, etc.)
  - Experience with Go, Python and TypeScript

   Compensation  Compensation may be adjusted depending on
  work location.

  - For Portugal-based hires: Estimated annual salary of
    €79,000-€109,000
  - For Bay Area based hires: Estimated annual salary of
    $230,000 - $317,000

   Equity  This role is eligible to participate in
  Cloudflare's equity plan. Benefits Cloudflare offers a
  complete package of benefits and programs to support you and
  your family. Our benefits programs can help you pay health
  care expenses, support caregiving, build capital for the
  future and make life a little easier and fun! The below is a
  description of our benefits for employees in the United
  States, and benefits may vary for employees based outside
  the U.S. Health & Welfare Benefits

  - Medical/Rx Insurance
  - Dental Insurance
  - Vision Insurance
  - Flexible Spending Accounts
  - Commuter Spending Accounts
  - Fertility & Family Forming Benefits
  - On-demand mental health support and Employee Assistance
    Program
  - Global Travel Medical Insurance


  Financial Benefits

  - Short and Long Term Disability Insurance
  - Life & Accident Insurance
  - 401(k) Retirement Savings Plan
  - Employee Stock Participation Plan


  Time Off

  - Flexible paid time off covering vacation and sick leave
  - Leave programs, including parental, pregnancy health,
    medical, and bereavement leave

  What Makes Cloudflare Special?  We're not just a highly
  ambitious, large-scale technology company. We're a highly
  ambitious, large-scale technology company with a soul.
  Fundamental to our mission to help build a better Internet
  is protecting the free and open Internet. Project Galileo:
  Since 2014, we've equipped more than 2,400 journalism and
  civil society organizations in 111 countries with powerful
  tools to defend themselves against attacks that would
  otherwise censor their work, technology already used by
  Cloudflare's enterprise customers--at no cost. Athenian
  Project: In 2017, we created the Athenian Project to ensure
  that state and local governments have the highest level of
  protection and reliability for free, so that their
  constituents have access to election information and voter
  registration. Since the project, we've provided services to
  more than 425 local government election websites in 33
  states. 1.1.1.1: We released 1.1.1.1 to help fix the
  foundation of the Internet by building a faster, more secure
  and privacy-centric public DNS resolver. This is available
  publicly for everyone to use - it is the first consumer-
  focused service Cloudflare has ever released. Here's the
  deal - we don't store client IP addresses never, ever. We
  will continue to abide by our privacy commitment and ensure
  that no user data is sold to advertisers or used to target
  consumers. Sound like something you'd like to be a part of?
  We'd love to hear from you! Please note that applicants who
  progress to the offer stage of the interview process may be
  asked to attend an in-person interview within one of the
  Cloudflare Offices or Cloudflare Hubs. More details about
  this will be available at that stage of the interview
  process. This position may require access to information
