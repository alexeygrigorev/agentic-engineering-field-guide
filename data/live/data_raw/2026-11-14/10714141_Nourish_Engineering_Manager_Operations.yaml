  About the Role

  Nourish is seeking a hands-on Engineering Manager to lead
  Provider Supply. Reporting to Sarah J, you’ll own the team
  responsible for ensuring Nourish has the provider capacity
  to meet growing patient demand — and that providers can
  build predictable, rewarding careers on the platform.

  Your team owns technology across the provider journey, from
  application and onboarding through scheduling, productivity,
  earnings, and retention. You’ll grow provider supply through
  two primary levers: helping existing providers operate at
  their full potential and creating a seamless, high-
  converting path for new providers to join and activate on
  Nourish.

  This team is tackling a foundational challenge for Nourish:
  scaling our provider network to serve patients across the
  country. First, we’re rebuilding the scheduling and capacity
  system so providers can set achievable caseload goals, trust
  Nourish to fill their calendars, and earn predictably.
  Second, we’re transforming application through activation
  from a human-heavy recruiting process into a thoughtful,
  product-led experience — with data and automation handling
  repetitive work while people step in at the moments where
  they have the greatest impact on supporting providers in
  their onboarding at Nourish.

  This is a hands-on leadership role for someone who enjoys
  developing engineers, shaping products, remaining close to
  architecture and implementation, and the details of
  marketplace dynamics. You’ll work closely with provider
  recruiting, onboarding, provider strategy, product, design,
  data, and finance to build systems that balance patient
  access, provider experience, and business performance.

  This is a full-time role. We strongly prefer candidates
  based in New York City or San Francisco, with exceptions for
  truly exceptional candidates. Check out Engineering at
  Nourish to learn more about our team and what we’ve already
  built.

  Key Responsibilities

  - Build, lead, and develop a high-performing team of 4–6
    engineers with strong technical ownership.
  - Coach engineers through regular feedback, career
    development, calibration, and performance management.
  - Scale the team through recruiting, interviewing, hiring, and
    onboarding.
  - Stay hands-on through architecture, pair programming,
    coding, code reviews, and on-call.
  - Partner with product and design to write requirements, shape
    roadmaps, scope work, plan sprints, and deliver measurable
    outcomes.
  - Drive thoughtful decisions around system design, code
    quality, observability, reliability, and scalability.
  - Establish effective team rituals, including sprint planning,
    OKR planning and reporting, quarterly planning, and
    retrospectives.
  - Operate with urgency and sound judgment in a fast-paced,
    ambiguous environment.
  - Set the technical and product direction for Nourish’s
    provider supply platform.
  - Build scheduling and capacity systems that help providers
    set achievable caseload goals, manage their availability,
    fill open appointments, and earn predictably.
  - Improve the provider application-to-activation funnel
    through experimentation, automation, lifecycle-based
    referrals, and thoughtfully designed recruiting and
    onboarding experiences.
  - Create human-in-the-loop systems that automate repetitive
    operational work and direct recruiting and operations
    teams toward the highest-value interventions.
  - Build the data foundations needed to understand provider
    capacity, forecast supply, measure funnel conversion, and
    make effective marketplace decisions.
  - Connect improvements in provider growth and productivity to
    patient access, provider retention, operational
    efficiency, and Nourish’s ability to scale.
  - Partner closely with provider recruiting, onboarding,
    strategy, operations, product, design, data, finance, and
    clinical leadership.

