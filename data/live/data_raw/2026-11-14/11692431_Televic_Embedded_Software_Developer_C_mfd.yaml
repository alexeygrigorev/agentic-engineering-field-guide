description: |
  WE ARE GROWING: IN THE MARKET. AS A TEAM. THROUGH OUR
  CHALLENGES. GROW WITH US!

  At Televic Rail, we have a clear mission: we develop and
  deliver innovative, reliable passenger information and
  communication systems for the global rail market. For more
  than 40 years, we have been designing, manufacturing,
  programming and maintaining fully integrated hardware and
  software systems for rail applications – with passion and
  expertise.

  Today, our technology is deployed in more than 60,000
  vehicles worldwide, with new installations added every day.
  Innovation, agility, customer focus and sustainability are
  the driving forces behind everything we do.

  Become part of Televic Rail and actively help shape the
  future of passenger information. Your enthusiasm and
  expertise are key to inspiring our customers and making the
  rail industry even smarter.

  PDM AUDIO & LED – WHERE EMBEDDED SOFTWARE MEETS CONNECTED
  COMMUNICATION

  As part of our product team, you will develop embedded
  software for Linux-based devices used in the rail industry.
  A key focus is the further development of our TRACS audio
  system: distributed devices that communicate across train
  networks, exchange data and stream audio.

  Your role goes beyond developing an existing codebase. You
  will translate specific requirements from customer projects
  into sustainable product features, contribute your own ideas
  and actively shape our products together with international
  colleagues.

  WHAT WE OFFER

  At Televic, it is not just about writing code, but about
  developing software that becomes a long-term part of our
  products and is used every day across the international rail
  industry.

  What you can look forward to:

  - Technology & Development: A high degree of ownership in
    product development, exciting embedded technologies and
    plenty of room to bring your own ideas to life.
  - Flexibility & Benefits: 30 days of annual leave, a 13th
    salary, flexible working hours, remote work options and
    subsidies for public transport, JobRad or an on-site
    parking space.
  - International & Meaningful: Collaboration with international
    development teams on software solutions used in rail
    vehicles worldwide.
  - Culture & Collaboration: Short decision-making paths, open
    technical exchange and an environment where new
    technologies and innovative approaches are genuinely
    encouraged.

  YOUR TASKS

  Product & Software Development

  - Further develop our embedded software for Linux-based
    systems with a strong focus on C++
  - Translate specific project requirements into reusable
    product features and extend our existing codebase
  - Analyze, reproduce and sustainably resolve software issues

  Ownership & Quality

  - Take technical ownership of individual subcomponents and
    their codebase
  - Plan and estimate efforts for new features and change
    requests
  - Document developed solutions and continuously improve
    product quality and stability

  Projects & Collaboration

  - Support international project teams with product
    configuration, integration and technical clarifications
  - Work closely with Product Development, Bid Management and
    Project Management
  - Collaborate with our international teams and actively
    contribute new technical ideas

  YOUR SKILLS

  Experience & Expertise

  - Several years of professional experience in software
    development with C++
  - Master’s degree in Computer Science, Embedded Software, ICT,
    Engineering or a comparable field
  - Strong experience developing for and working with Linux-
    based systems
  - Ability to independently structure and reliably deliver
    complex technical topics

  Technical Understanding

  - Interest in embedded systems, distributed applications and
    network-based communication
  - Willingness and ability to independently explore new
    technologies and complex technical topics
  - Motivation to develop new ideas, challenge existing
    approaches and drive solutions beyond your immediate team
  - Experience with AI-assisted software development and an
    interest in AI-native development, coding assistants and
    agentic workflows

  Collaboration

  - Team-oriented, structured and solution-focused way of
    working
  - Strong communication skills in an international development
    environment
  - Very good German and English skills at C1 level
  - Willingness to travel occasionally, particularly to our site
    in Belgium



  NICE TO HAVE

  We would especially value experience in some of the
  following areas:

  - Software Engineering: Test-Driven Development, CMake, Git,
    Jenkins, Jira, Confluence, SonarQube
  - Audio: GStreamer, audio processing, audio streaming, SIP or
    Asterisk
  - Networking: IP networks, multicast, routing, network
    protocols and Wireshark
  - Security: Linux and network-based technologies such as
    authentication and encryption
  - Additional Languages: Initial experience with Rust or C

