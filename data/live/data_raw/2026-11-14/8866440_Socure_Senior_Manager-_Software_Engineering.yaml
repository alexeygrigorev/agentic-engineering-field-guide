description: |
  Why Socure?

  Socure is building the identity trust infrastructure for the
  digital economy — verifying 100% of good identities in real
  time and stopping fraud before it starts. The mission is
  big, the problems are complex, and the impact is felt by
  businesses, governments, and millions of people every day.

  We hire people who want that level of responsibility. People
  who move fast, think critically, act like owners, and care
  deeply about solving customer problems with precision. If
  you want predictability or narrow scope, this won’t be your
  place. If you want to help build the future of identity with
  a team that holds a high bar for itself — keep reading.

  At Socure, we are revolutionizing digital trust by building
  mission-critical systems that deliver high reliability and
  operate at global scale. As a Manager, Software Engineering,
  you will be a hands-on technical leader who defines
  direction, raises engineering standards, and delivers
  measurable product outcomes, all while remaining deeply
  involved in design and development. This is not a
  traditional people-management or delivery-management
  role—here, you will write code, architect solutions, lead
  complex projects, and coach engineers to maximize their
  potential.

  This role is perfect for leaders seeking high-growth,
  product-driven environments, who are passionate about
  distributed systems, and who want to directly influence the
  design of secure, scalable, and resilient infrastructure
  while cultivating top engineering talent.

  What You'll Do:

  - Architect and design scalable, resilient, high-performance
    backend systems and platforms in AWS, prioritizing
    reliability, security, and cost efficiency.
  - Contribute hands-on to key initiatives—including design
    reviews, prototyping, coding, performance tuning, and
    debugging—typically 30% of your time, while mentoring
    engineers and establishing high standards.
  - Lead cross-team technical initiatives; drive design forums,
    establish engineering guardrails, and ensure high-quality
    delivery via code reviews and automation.
  - Partner closely with Product, Design, Data Science, and
    Platform teams to define project scope, sequence
    milestones, and proactively de-risk execution for
    iterative releases.
  - Own design of APIs and microservices, including REST and
    event-driven patterns, and enforce best practices for
    versioning, contracts, and backward compatibility.
  - Advance operational excellence by defining SLOs, improving
    observability and alerting, hardening on-call procedures
    and runbooks, and leading incident response and post-
    mortems.
  - Solve complex distributed system challenges (such as
    throughput, latency, consistency, and data modeling) with
    pragmatic decision-making and balanced tradeoffs.
  - Document architectural decisions, service ownership, and
    operational runbooks to share knowledge and maintain long-
    term scalability.
  - Foster team growth through clear expectations, actionable
    feedback, and mentorship; hire, develop, and onboard
    diverse talent committed to a culture of ownership and
    collaboration.

  What You Bring:

  - 7+ years of professional software engineering experience,
    including ownership of large-scale backend systems in
    production.
  - 3+ years of hands-on technical leadership (as Tech Lead or
    Manager) with a track record of leading complex, cross-
    team projects while contributing to code and design.
  - 5+ years of experience with Golang (preferred) and/or Java,
    plus strong computer science fundamentals (data
    structures, concurrency, distributed systems).
  - Deep understanding of AWS cloud-native architectures and
    services (e.g., ECS/EKS, Lambda, OpenSearch, DynamoDB,
    RDS, S3) and resilience patterns.
  - Proficiency with microservices, API design, and event-driven
    systems, as well as experience with containerization and
    orchestration (Docker, Kubernetes).
  - Strong operational mindset: expert in observability,
    monitoring, incident response, performance engineering,
    and adherence to security best practices.
  - Familiarity with CI/CD pipelines, automated testing
    strategies (unit, integration, e2e), and modern DevOps
    workflows; comfortable with Git-based trunk/branch
    strategies.
  - Excellent communication, stakeholder management, and
    decision-making skills; able to clearly frame tradeoffs
    and drive alignment across engineering and product teams.

  Additional Information

  - Permanent right to work in the UK is required; Socure does
    not provide visa sponsorship for this role.
  - Candidates must be based in London or within a commutable
    distance, with the ability to attend the office as needed.

  Socure is an equal opportunity employer that values
  diversity in all its forms within our company. We do not
  discriminate based on race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status. If you need an
  accommodation during any stage of the application or hiring
  process—including interview or onboarding support—please
  reach out to your Socure recruiting partner directly.

