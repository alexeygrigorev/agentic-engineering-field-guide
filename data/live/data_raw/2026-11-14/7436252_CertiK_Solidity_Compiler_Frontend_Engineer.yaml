description: |
  About the Company

  One of the fastest-growing and most trusted companies in
  blockchain security, CertiK is a true market leader. To
  date, CertiK has worked with over 4,798 clients, secured
  over $597 billion worth of digital assets, and has monitored
  over 17,000 projects. Our clients include leading projects
  such as Aave, Polygon, Yearn, and Chiliz.



  Investors = Insight Partners, Sequoia, Tiger Global, Coatue
  Management, Lightspeed, Advent International, SoftBank,
  Hillhouse Capital, Goldman Sachs, Shunwei Capital, IDG
  Capital, Wing, Legend Star, Danhua Capital and other
  investors.



  About the Role

  We are seeking an experienced Solidity Compiler Frontend
  Engineer to join our team working on cutting-edge blockchain
  compiler infrastructure and formal verification tools. You
  will participate in developing and optimizing the frontend
  components of Solidity compilation pipelines, with a focus
  on static analysis, type checking, and integration with
  formal verification systems.

  Responsibilities

  - Design and implement frontend components for the Solidity
    compiler, including lexical analysis, parsing, AST
    generation, and semantic analysis.
  - Optimize compiler performance and improve error reporting
    and diagnostics.
  - Develop integration layers between the Solidity compiler and
    formal verification tools.
  - Contribute to the evolution of Solidity language features
    and specification.
  - Collaborate with security researchers to implement static
    analysis and security checks.
  - Maintain and improve existing compiler infrastructure and
    tooling.

  Requirements

  - 3+ years of professional experience in Solidity compiler
    development or related compiler projects (e.g., EVM-based
    languages, smart contract compilers)
  - Strong proficiency in Java with deep understanding of Java
    based compiler development and optimization
  - Solid foundation in compiler theory, including parsing
    techniques, type systems, and intermediate representations
  - Experience with formal methods or formal verification tools
    (e.g., SMT solvers, theorem provers, or verification
    frameworks)
  - Strong understanding of the Ethereum Virtual Machine (EVM)
    and smart contract execution models
  - Excellent problem-solving skills and attention to detail

  Preferred Qualifications

  - Experience with LLVM or similar compiler infrastructure
  - Knowledge of programming language semantics and type theory
  - Contributions to open-source compiler projects
  - Experience with Solidity or other blockchain programming
    languages

  What We Offer

  - Opportunity to shape the national conversation on blockchain
    and security.
  - Collaborate with industry-leading security researchers,
    technologists, and global institutions.
  - Flexible work environment and mission-driven culture.

  Compensation: If the role is performed in the US, the target
  annual compensation is $140,000 - $220,000. The exact
  compensation at which this job is filled will be determined
  by the skills and experience of qualified candidates.



