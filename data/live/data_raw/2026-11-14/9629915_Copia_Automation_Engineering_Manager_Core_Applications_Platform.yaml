description: |
  About Copia

  Copia Automation builds the version control and change
  management platform for industrial automation. Our customers
  are in oil & gas, manufacturing, and critical
  infrastructure: environments where the code running on PLCs,
  SCADA systems, and HMIs have direct safety implications. We
  bring modern software engineering practices to operational
  technology teams that have been underserved by tooling for
  decades.

  We’re a well-funded startup growing fast, with enterprise
  customers deploying Copia across hundreds of facilities. Our
  headquarters is in New York City.

  The Role

  We’re hiring an Engineering Manager to stand up and lead a
  brand-new Core Applications Platform team. This team’s
  customers are our internal product teams, and its mandate is
  to design, build, and own the shared, full-stack application
  capabilities that every product at Copia depends on; the
  kind of capabilities that should be solved once, well, and
  reused across many user types.

  Reporting into the VP of Engineering, you will lead a group
  of full-stack software engineers and partner closely with
  the Product, Design, and other Engineering leaders whose
  teams rely on what you build. You’ll support, mentor, and
  grow your team while staying close enough to the technology
  to provide meaningful architectural input, code review, and
  the occasional pull request.

  This role is a great fit for a hands-on line manager who is
  excited by the challenge of building a new team from scratch
  and shaping how an entire engineering organization builds
  product. You must be comfortable collaborating through
  ambiguity, while supporting your team to drive predictable
  velocity as we continue to scale the organization.

