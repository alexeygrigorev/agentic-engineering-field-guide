description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We’re looking for an experienced Backend Engineer for our
  Consumer Onboarding team. This is a unique opportunity to
  have a massive impact, helping a growing number of customers
  around the world choosing Wise to move their money without
  borders.

  The Consumer Onboarding team is dedicated to guiding
  personal customers through setting up their Wise account and
  resolving their first international money needs in a way
  that’s clear, easy, and delightful. You'll lead a team of
  talented engineers, collaborating daily with product
  managers, data analysts, and designers to continuously
  improve our onboarding flows and user journeys - making them
  faster, more intuitive, and more scalable.



  Your mission:

  As the one of most Senior Engineers in the Consumer
  Onboarding team, you will:

  - Work closely with the Product Manager and Engineering Lead
    of your team to shape the roadmap, set the technical and
    product vision and ensure the team delivers on product
    goals in a robust and scalable way.
  - Enable your team to succeed by ensuring they are well-
    resourced, can plan effectively, and are set up to commit
    to and deliver on their roadmap.
  - Drive and deliver high impact projects end to end - from
    understanding customer problem, design solution alongside
    your team, driving technical discovery, scoping and
    execution to delivery
  - Own the health of systems and services in your team,
    ensuring our system remain maintainable, scalable and
    performing to support our growth and scale
  - Collaborate with other senior engineers and engineering lead
    across Onboarding squad and Wise to ensure your team’s
    work is aligned with the wider technical strategy.
  - Coach and mentor engineers in your team supporting their
    technical growth and being a force multiplier

  Qualifications

  A bit about you:

  - You have experience working with and building distributed,
    high scalability systems and microservices architectures
  - You have a strong product and customer mindset and
    experience building customer facing products.
  - You possess strong technical expertise or background in OOP
    Languages (Java or similar) and modern technology stacks
  - You enjoy mentoring and teaching others what you know though
    your own work - being a force multiplier
  - You're a great communicator who can articulate complex
    technical concepts clearly to both technical and non-
    technical audiences.
  - You thrive in a collaborative environment and have
    experience working effectively with cross-functional peers
    like designers, product managers, and analysts.
  - Bonus: You have experience working with other functions like
    Frontend and/or Mobile engineers and design functions

  Additional Information

  Interested? Find out more:

  - How we work - a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it’s like to work at Wise London
  - Our engineering career map

  Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £111,000 - £145,000 + RSUs
  - Wise Benefits

