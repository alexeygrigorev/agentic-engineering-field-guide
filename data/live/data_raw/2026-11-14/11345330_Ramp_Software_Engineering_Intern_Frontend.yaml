description: |
  About Ramp

  Ramp is building the smart infrastructure for finance teams,
  embedded in the transaction flow of every dollar a business
  spends. We automate how over $275B in annualized spend flows
  in and out of 85,000+ companies: authorizing payments,
  flagging risk, categorizing spend, and closing books.

  The problems are high-stakes, data-dense, and unforgiving.

  We hire people with high agency and high urgency. We look
  for slope over intercept. We care less about where you
  trained and more about what you’ve built. At Ramp, everyone
  is a builder who owns problems end to end and makes
  consequential decisions that shape the outcome.

  The median Ramp customer saves 7.5% and grows revenue 16% in
  their first year – far in excess of businesses operating
  without Ramp. We believe every ambitious company deserves
  the same.

  If you want to build systems that directly shape how
  companies move and manage billions, Ramp is the place to do
  it.

  Explore our Engineering Blog & Emerging Talent Blog to learn
  more about how we build at Ramp and what it’s like to start
  your career here.

  About the Role

  Ramp is, at its core, an engineering company. We’re looking
  for frontend and full-stack engineering interns who are
  excited to build intuitive, high-quality products that solve
  complex problems for our customers.

  Our ideal candidate has strong JavaScript fundamentals, an
  eye for great user experiences, and enjoys turning customer
  needs into thoughtful engineering solutions. Our frontend
  stack includes TypeScript, React, Vite, and Ryu, our in-
  house design system.

  What You’ll Do

  - Build performant, beautiful, and intuitive interfaces for
    businesses with complex needs
  - Own meaningful projects and ship products alongside cross-
    functional teams
  - Work closely with product, design, and business teams to
    turn customer feedback into product improvements
  - Contribute to the tools, systems, and engineering practices
    that help Ramp scale

  What You’ll Need

  - Currently pursuing a B.S. or higher in Computer Science or a
    related technical field, graduating December 2027 or later
  - Strong JavaScript fundamentals and attention to visual and
    product details
  - Experience with one or more programming languages
  - Track record of shipping high-quality products, features, or
    side projects
  - Ability to turn product and business ideas into engineering
    solutions
  - Desire to learn quickly, take ownership, and work in a fast-
    paced environment

  Nice to Haves

  - Experience with React
  - Familiarity with or interest in TypeScript and modern
    frontend development
  - Interest in fintech, AI, or building products at scale

  Compensation

  The monthly rate for this internship is $12,500 + a housing
  stipend.

  Ramp Benefits

  - Apple MacBook
  - Catered lunches and dinners in our NYC office Monday through
    Friday
  - $10/week for Coffee with a Colleague

  Benefits available to all full-time Ramp employees (Global)

  - Flexible PTO
  - Centralized home-office equipment ordering
  - Health and wellness stipend
  - Budget for intra-office travel
  - Weekly coffee stipend

  United States

  - 100% medical, dental & vision insurance coverage for you,
    with partial coverage for dependents
  - One Medical annual membership
  - 401(k), including employer match on contributions made while
    employed by Ramp
  - Fertility HRA (up to $10,000 per year)
  - Parental leave: up to 16 weeks (birthing + bonding) or 8
    weeks (bonding only) at 100% pay
  - Pet insurance
  - In-office perks: lunch, snacks, drinks, and more
  - Relocation expense coverage to NYC or SF (if needed)

  Canada

  - Group medical, dental, and vision coverage through Sun Life
  - Life, AD&D, and disability coverage
  - Fertility drug coverage (up to $4,000 lifetime)
  - Group Retirement Plan with employer match (RRSP + DPSP)
  - Parental leave: up to 16 weeks (birthing + bonding) or 8
    weeks (bonding only) at 100% pay, with additional time
    available at reduced pay
  - Employee Assistance Program and virtual care through Lumino
    Health

  United Kingdom

  - Private medical insurance through Freedom Elite
  - Virtual GP and at-home care via eMed x Livi
  - Workplace pension through Penfold, with salary sacrifice
    option
  - Parental leave: up to 16 weeks (birthing + bonding) or 8
    weeks (bonding only) at 100% pay with additional time
    available at reduced pay

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.



  Other notices

  Pursuant to the San Francisco Fair Chance Ordinance, we will
  consider for employment qualified applicants with arrest and
  conviction records.



  Beware of recruiting scams: Ramp will only contact you
  through official @Ramp.com email addresses and will never
  ask for payment or sensitive personal information during the
  hiring process.



