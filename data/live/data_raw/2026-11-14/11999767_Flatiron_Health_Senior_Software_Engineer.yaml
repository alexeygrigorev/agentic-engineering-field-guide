description: |
  Reimagine the infrastructure of cancer care within a
  community that values integrity, inspires growth, and is
  uniquely positioned to create a more modern, connected
  oncology ecosystem. We're looking for a Senior Software
  Engineer to lead the technical direction of electronic
  prescribing in OncoEMR, to help us accomplish our mission to
  improve and extend lives by learning from the experience of
  every person with cancer. Are you ready to be the next
  changemaker in cancer care? What You'll Do In this role you
  will lead the technical design and delivery of our
  electronic prescribing (eRx) modernization, including
  upgrading to the latest standards and actively partnering
  with key vendors for verification. You will help break
  large, ambiguous problems into clear plans, tickets, and
  milestones, and keep the team aligned on scope, risks, and
  timelines. In addition you will:

  - Write and review high-quality code across the stack in C#,
    VB.NET, and React, setting the bar for testing,
    reliability, and maintainability.
  - Guide the phased move from legacy WebForms and VB.NET
    workflows to React micro-frontends and .NET services,
    balancing modernization with the day-to-day needs of
    clinicians.
  - Partner with product, design, QA, and clinical oncology
    experts to turn prescriber and pharmacist workflows into
    thoughtful technical solutions.
  - Build and test safety-critical prescribing workflows that
    help us meet ONC certification and DEA/EPCS requirements.
  - Mentor engineers through code reviews, pairing, and design
    feedback, and help shape how the team works, including how
    we use AI tools across the development lifecycle.
  - At the end of your first year, success would mean having led
    eRx work from design through rollout, with a team that
    ships reliably and clinicians who can prescribe with less
    friction.

  Who You Are You're a kind, passionate and collaborative
  problem-solver who values the opportunity to think beyond
  the way things are. In addition, you're a thoughtful,
  empathetic communicator with 5-8 years of experience
  building and shipping production software, including
  technical leadership of a project or team.

  - You have experience building production software in a modern
    language (e.g., C#, Java, Python, or TypeScript) and are
    comfortable working in a large, long-lived codebase.
  - You are a full-stack web developer with experience building
    both front-end interfaces (e.g., React) and back-end
    services, including REST APIs and relational databases.
  - You have led the technical design and delivery of complex,
    cross-team projects from planning through rollout, and can
    make and communicate architecture tradeoffs.
  - You mentor and grow other engineers through code review,
    pairing, and thoughtful feedback.
  - You are a self-starter who is comfortable working with
    ambiguity and breaking large problems into clear steps.
  - You are a team-player who gives and receives feedback openly
    and enjoys working cross-functionally.
  - You are motivated by our mission and want your work to have
    a direct impact on people with cancer, in software where
    safety and accuracy matter.

  Extra credit

  - You have experience using AI coding tools (e.g., Claude Code
    or Cursor) to build and test software, and a point of view
    on what works well.
  - You have experience building features powered by LLMs or AI
    agents, or evaluating AI output for quality and safety.
  - You have experience in a regulated environment (e.g., ONC
    certification, HIPAA, or DEA/EPCS) and are interested in
    continuing that kind of work.

  Where You'll Work In this hybrid role, you'll have a defined
  work location that includes work from home and 3 office days
  set by you and your team. For more information on our
  approach to hybrid work, please visit the how we work
  website. Life at Flatiron At Flatiron Health, we offer a
  full range of benefits to support you and your loved ones so
  you can focus your working hours on improving cancer care
  and accelerating cancer research, and your non-working hours
  on everything else life has to offer:

  - Work/life autonomy via flexible work hours and flexible paid
    time off
  - Comprehensive compensation package
  - 401(k) contribution to help you reach your retirement
    planning goals
  - Financial health resources including 1:1 financial advice
  - Mental well-being tools and services
  - Parental benefits and policies including family-building
    care and generous leave
  - Path to parenthood programs supporting fertility, adoption
    and surrogacy
  - Travel support for safe healthcare services

  In addition to our robust benefit offerings, visit our Life
  at Flatiron page to learn how we support continuous learning
  and celebrate inclusion and belonging in the workplace.  Job
  Compensation Range Salary Range: $152,000.00 - $209,000.00
  Preferred Primary Location: NY office The annual pay range
  reflected above for this position is based on the preferred
  primary location of the role which is listed in the job
  description. Salary ranges for other locations vary from the
  range reflected above. Base pay offered may vary depending
  on job-related knowledge, skills, and experience. An annual
  bonus and equity may be provided as part of the compensation
  package, in addition to a full range of medical, financial,
  and/or other benefits, dependent on the position offered.
