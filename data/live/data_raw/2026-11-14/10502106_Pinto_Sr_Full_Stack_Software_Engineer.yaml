description: |
  Company Description

  Pinto (pinto.co) is building the smartest product database
  and analytics platform in food, grocery, and nutrition, with
  a mission of making product data fully personalized,
  transparent, and easily searchable for both consumers and
  businesses alike. Over 66% of Americans now choose products
  based on personal health needs (think Keto, No Added Sugar,
  Plant-Based, Heart Healthy, No Dairy, Diabetes Management,
  etc etc), and the Pinto data platform is organizing the
  world of products at scale across every personalized
  dimension that matters to these modern consumers. The era of
  personalization is here and we’re building Pinto to power it
  🍓📊.

  We are a profitable, venture-backed company that's growing
  quickly, and we’re now looking for Full Stack Software
  Engineers to join our growing engineering team. In this
  role, you’ll work across the Pinto stack to contribute to
  and improve Pinto’s Web-based data platform, a suite of
  technologies and tools used to create, process, classify,
  visualize and make sense of complex food product data and
  analytics.

  Ideal candidates will be comfortable leading initiatives
  from ideation to planning, prototyping, execution, shipping,
  and iteration. We use a variety of tools, technologies, and
  languages to build software including ES6
  JavaScript/TypeScript, React/React Native, Redux, Webpack,
  Node.JS, GraphQL and MongoDB.

  This is an amazing opportunity for someone looking to join
  in the early stages of a rapidly growing technology startup
  solving a meaningful problem in food and the broader world
  of personalization in nutrition and consumer products.

  Job Description

  - You’ll use your skills to help solve real-world problems,
    while learning about the food, consumer products, and
    personalized nutrition ecosystem
  - You’ll work across the Pinto Web stack using tools and
    languages like JavaScript/TypeScript, Node.js, MongoDB,
    GraphQL, React, Sass
  - You’ll envision and create new features for our core data
    platform, which processes large, complex data sets from a
    variety of sources
  - You’ll build interfaces and tools to display, process, and
    update data on the Pinto platform
  - You’ll envision and create tools that contribute to and
    enhance our end-to-end data pipeline
  - You’ll automate and handle the life-cycle of systems and
    platforms that process our data
  - You’ll model, design and implement complex data integrations
    with our industry partners
  - You’ll build tools and processes that enhance our end-to-end
    data pipeline, and will envision new features to
    continually improve and refine this pipeline
  - You’ll work with our Research, Nutrition, & Data Analyst
    teams to gain a deep knowledge of underlying use cases in
    food data and nutrition
  - You’ll contribute to the ongoing evolution of the Pinto Web
    stack

  Qualifications

  Qualifications

  - Strong experience with: React, Node.js, document databases
    (e.g. MongoDB)
  - 5+ years of professional software development experience
  - Bachelor's degree in computer science (or similar) or
    equivalent practical experience
  - A track record of shipping high-quality software from start
    to finish
  - A solid foundation in computer science fundamentals with
    sound knowledge of data structures, algorithms, and system
    design
  - Comfortable in a fast-paced startup environment
  - Self-aware and have a desire to learn and improve

  Bonus points for

  - Example of code projects you’ve worked on (e.g. GitHub,
    BitBucket)
  - Experience with: TypeScript, Amazon Web Services (AWS),
    Distributed Systems
  - Experience working with React Native
  - Experience working with large, complex data sets from a
    variety of sources
  - Experience with or strong interest in data science and/or
    machine learning
  - Strong communication skills

  Additional Information

  Pinto (pinto.co) is building the smartest product database
  and analytics platform in food, grocery, and CPG. Our
  mission is to make the world of products optimized,
  searchable, and personalized for today's consumers (66% of
  whom now shop around personal health needs — think Keto, No
  Added Sugar, Plant-Based, Heart Health, No Dairy, etc etc.).
  We're the "system of record" that's powering personalized,
  preference-driven shopping.

   At Pinto, we believe consumers should be able to easily
  find products according to their individual needs, and our
  data platform is solving this by digitizing and classifying
  the world of products across every consumer preference —
  from every allergen and intolerance to key lifestyles and
  diets (like Vegan, Paleo, Keto, Gluten Free), rising health
  conditions (like Diabetes Management, Heart Health, etc.),
  certifications, sustainability preferences, nutrition and
  ingredient preferences, and so much more.

   The era of personalization is here and we’ve built Pinto to
  power it🍓📊.

