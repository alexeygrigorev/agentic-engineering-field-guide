description: |
  Up to £100,000 depending on experience

  📍 Salary based on London. Hybrid, with flexible hours.

  Fanvue is one of the fastest-growing creator monetisation
  platforms globally. We're an AI-powered, creator-first
  platform helping creators connect, engage, and earn directly
  from their audiences at scale. Following our recent Series
  A, Fanvue has surpassed $200m+ in annual recurring revenue,
  with triple-digit year-on-year growth, supporting hundreds
  of thousands of creators and millions of fans worldwide.

  Growth engineering at Fanvue exists to move core product
  metrics fast. It's a small team that reads out experiments
  every week, and the surface area is enormous: signup,
  onboarding, activation, referral loops, retention, and the
  funnels underneath all of them. There is far more worth
  testing than there are people to test it. This role exists
  to close that gap.

  🎯 The Role

  We're hiring a Full Stack Engineer to work on Fanvue's
  Growth streams, partnering closely with Product, Design,
  Data and Marketing to design, ship and iterate on high-
  impact experiments across acquisition, onboarding,
  activation and retention.

  This is highly execution-focused. You'll be testing ideas in
  production within your first weeks, not writing specs about
  them. The team runs on a weekly experiment cadence with real
  readouts, so the loop between an idea and knowing whether it
  worked is short, and you own both ends of it.

  It suits someone who wants to be judged on whether the
  metric moved.

  🚀 What You'll Do

  - Design, build and ship growth experiments across signup,
    onboarding, activation and retention flows
  - Own features end to end, from idea through implementation,
    measurement and iteration
  - Build and refine growth loops such as referrals, sharing
    mechanics and viral surfaces
  - Run A/B and multivariate tests, and read the results
    honestly, including the ones that kill your own idea
  - Partner with Product and Design to prioritise and scope
    what's worth testing
  - Improve the performance and reliability of growth-critical
    user journeys
  - Use analytics and data tooling to guide technical and
    product decisions
  - Continuously find and remove friction in creator and fan
    funnels

  👀 Who You Are

  - Strong full stack engineering experience with a clear bias
    toward shipping
  - Comfortable across frontend and backend, and willing to go
    wherever the problem is
  - Experienced with modern web stacks such as TypeScript,
    Node.js, React and relational databases
  - Familiar with experimentation frameworks, analytics tooling
    and funnel metrics
  - Comfortable in ambiguity, with a strong bias toward action
  - Data-informed and outcome-driven rather than feature-focused
  - A clear communicator who works well with product, design and
    growth partners
  - High ownership, high agency, and an appetite for fast
    iteration

  Nice to have

  - Experience in the creator economy, consumer subscription,
    marketplaces or social platforms
  - Hands-on with Amplitude, Mixpanel, PostHog or similar
  - A track record of growth loops you built that are still
    running

  ✨ You'll Thrive Here If

  - You'd rather ship a scrappy test this week than a polished
    one next quarter
  - You want to be measured on whether the number moved, not on
    what you delivered
  - You're happy to kill your own experiment when the data says
    so
  - You go and find the opportunity rather than waiting for it
    to arrive as a ticket

  ⚠️ You'll Struggle Here If

  - You prefer long planning cycles to fast iteration
  - You need tightly defined requirements before you can start
  - You optimise for technical purity over measurable impact
  - You're uncomfortable with a roadmap that changes when the
    results say it should

  🌍 Why Join Fanvue?

  - Sunday Times Best Places to Work, two years running. We
    don't just say we have great culture, we prove it
  - Ship work that directly moves growth, activation and
    revenue, and see it in the numbers the same week
  - Work at the intersection of product, data and engineering,
    with high visibility across the business
  - Fanvue supports hundreds of thousands of creators and
    millions of fans globally. The problems you solve here are
    real and immediate
  - Series A momentum: triple-digit growth means the work you do
    now sets the standard for years
  - Unlimited holiday
  - Hybrid working, with flexible hours according to when you
    work best
  - Salary reviews every six months, we don't wait for annual
    cycles to recognise your growth
  - Budget for growth and wellbeing, plus support with
    upskilling and development costs
  - A culture built on innovation, speed, excellence, ownership
    and transparency

  ⭐ Fanvue is for Everyone

  We know that diverse teams build better products. Even if
  you do not meet every requirement, we encourage you to
  apply. Potential, mindset, and ambition matter just as much
  as experience.
