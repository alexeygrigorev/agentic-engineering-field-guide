description: |
  At Precisely, we're not just building software — we're
  shaping the future of data integrity. As a global leader in
  data quality, data enrichment, and location intelligence,
  Precisely helps thousands of the world's most trusted brands
  make confident decisions with data they can rely on. We're
  an AI-first organization, which means artificial
  intelligence isn't a buzzword here — it's woven into how we
  build products, how we work, and how we think about solving
  complex problems for our customers. When you join Precisely,
  you join a team of curious, driven innovators who believe
  that better data makes the world run better. If you're ready
  to do meaningful work at the intersection of AI and data —
  and help define what's possible — we'd love for you to
  apply!

  Overview:

  We are seeking a passionate Associate Software Developer
  (AI) to join our engineering team building scalable
  applications. This role is ideal for a candidate who is
  eager to learn, contribute, and grow in a collaborative,
  fast-paced environment. You will work under the guidance of
  experienced developers, participate in real projects, and
  build your skills with modern languages, frameworks, and
  practices.

  What you will do:

  - Assist in designing, developing, and maintaining AI-enabled
    applications using modern programming languages such as
    Python, TypeScript, Java, C#, or Go.
  - Work with team members to understand requirements and
    implement features.
  - Learn to use Pydantic for defining and validating data
    models.
  - Write clean, well-documented, object-oriented code with
    guidance.
  - Participate in code reviews and incorporate feedback.
  - Help troubleshoot and resolve basic technical issues.
  - Support testing and CI/CD processes.

  What we are looking for:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related technical field, or equivalent experience.
  - At least 1 year of experience building enterprise-level
    software.
  - Solid proficiency in at least one modern, general-purpose
    language, such as Python, TypeScript/JavaScript, Java, C#,
    or Go.
  - Working knowledge of object-oriented programming principles
    and design patterns.
  - Experience building or consuming REST APIs.
  - Familiarity with popular frameworks and libraries in your
    language of choice, such as FastAPI, Django, Flask,
    Node.js/Express, NestJS, Spring Boot, .NET, or React.
  - Eagerness to learn new languages, frameworks, and tools as
    our stack evolves.
  - Strong problem-solving and communication skills.
  - Willingness to take initiative and accept feedback.
  - Ability to work effectively in a team and follow
    instructions.

  AI Skills/Knowledge:

  - Knowledge of large language models (LLMs) and experience
    with AI coding assistants such as Claude Code or GitHub
    Copilot.

  Preferred Skills (a plus but not required):

  - Exposure to web development (frontend and backend),
    including building and consuming APIs
  - Familiarity with Git and unit/integration testing
  - Exposure to data engineering concepts
  - Exposure to cloud platforms (AWS, GCP, or Azure), Docker,
    and CI/CD tooling

  This position is 100% remote anywhere in the US

