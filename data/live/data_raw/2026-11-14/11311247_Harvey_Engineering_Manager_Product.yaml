description: |
  Why Harvey

  At Harvey, we’re transforming how legal and professional
  services operate. By combining frontier agentic AI, an
  enterprise-grade platform, and deep domain expertise, we’re
  reshaping how critical knowledge work gets done for decades
  to come.

  This is a rare chance to help build a generational company
  at a true inflection point. We have strong product-market
  fit and world-class investor support. We’re scaling fast and
  defining a new category in real time. The work is ambitious,
  the bar is high, and the opportunity for growth — personal,
  professional, and financial — is unmatched.

  Our team moves fast, takes ownership, and is deeply
  committed to the mission — operating with intensity, staying
  close to our customers, and pushing each other for
  excellence. We live by three values: Decisiveness,
  Simplicity, and Job's Not Finished. We act quickly on clear
  judgment over perfect information, we believe simplicity is
  what scales, and we're never satisfied with where we are. If
  you want to do the best work of your career alongside people
  who share that drive, we'd love to build with you.

  At Harvey, the future of professional services is being
  written today — and we’re just getting started.

  Role Overview

  Harvey is redefining what’s possible in legal work by
  combining cutting-edge AI with intuitive product
  experiences. As we scale rapidly and take on increasingly
  complex use cases, we’re expanding our product engineering
  team to accelerate our ability to ship fast, delight users,
  and build infrastructure that scales with us.

  As an Engineering Manager for Product Engineering, you’ll
  lead teams of fullstack engineers building the core product
  surfaces that lawyers and legal professionals use every
  day—from complex workflows and collaboration tools to
  elegant user interfaces powered by sophisticated backend
  systems. This role is equal parts product intuition and
  technical execution. You’ll be trusted to make fast, high-
  quality decisions, ship impactful features, and grow a team
  that embodies engineering excellence.

  We move with urgency, bias toward simplicity, and expect our
  leaders to be hands-on when needed. If you’re energized by
  ownership, decisive execution, and solving real user
  problems, we'd love to hear from you.

  What You’ll Do

  - Lead fullstack engineering team(s) building user-facing
    features across our web product.
  - Collaborate closely with Design, Product, and AI teams to
    identify and execute on high-impact initiatives.
  - Help define and evolve the architecture for a fast-moving,
    AI-powered application.
  - Hire, grow, and retain exceptional engineers who thrive in a
    high-trust, high-impact environment.
  - Foster a culture of simplicity, quality, and continuous
    improvement.
  - Contribute to code and architecture reviews, unblock teams,
    and lead by example when needed.
  - Work closely with cross-functional partners to align product
    initiatives with company goals.

  What You Have

  - 3+ years of experience in a software engineering management
    role leading fullstack product engineering teams,
    preferably in high-growth environments.
  - 5+ years of experience as a fullstack or backend product
    engineer.
  - A track record of leading high-performing, engaged
    engineering teams.
  - Strong product sense and an instinct for balancing speed,
    quality, and user impact.
  - Experience with modern frontend frameworks (e.g. React) and
    backend systems (e.g. Python, Node, Go).
  - A plus: Exposure to AI-powered applications or complex
    internal tools.

  Compensation Range

  $260,000 - $330,000 USD

