description: |
  Say hello to Hagerty

  Hagerty is a company built by drivers for drivers. We put
  our members at the center of everything we do and are
  dedicated to making it easier and more enjoyable for
  enthusiasts to drive and celebrate the machines they love.
  We’re proud to be the world’s largest insurer of collectible
  and enthusiast vehicles and are home to the Hagerty Drivers
  Club, the world’s largest car club. Our Marketplace business
  presents live and digital sales across the U.S. and Europe,
  we host a number of driving events and concours, and our
  award-winning automotive journalists produce the most
  popular car magazine globally, alongside internationally
  awarded videos. We’re committed to Never Stop Driving. Ready
  to get in the driver’s seat? Join us! 

  As a Lead Software Engineer, Dynamics & Power Platform with
  deep expertise in Microsoft Dynamics 365 Sales, Power
  Platform and Power Apps you will lead the design,
  development, and delivery of scalable enterprise solutions.
  This role combines hands-on engineering excellence and
  technical leadership (with 80-20 split of 80% on hands-on
  engineering work, 20% on technical leadership) ensuring
  high-quality, maintainable, and efficient solutions across
  the team.

   What you’ll do

  Technical Leadership & Development

  - Lead the development of solutions using Dynamics 365 Sales
    (CRM) and Dataverse
  - Implement Power Automate workflows to streamline business
    processes
  - Develop applications using Power Apps (Canvas and Model-
    Driven Apps)
  - Design and build custom Power Apps Component Framework (PCF)
    controls using HTML, CSS, TypeScript and React
  - Ensure best practices for customization, configuration, and
    extensibility within the platform

  Engineering Excellence

  - Establish and enforce engineering best practices, coding
    standards, and governance across the team
  - Implement source control and versioning strategies using Git
    (or similar tools) for:
    - Web resources
    - Dataverse tables and forms
    - Environment variables
    - Power Automate flows
  - Drive solution performance, scalability, and maintainability
  - Maintain and run CI/CD pipelines for Dynamics 365 and Power
    Platform deployments, and troubleshoot failed builds and
    releases

  Team Leadership & Mentorship

  - Mentor and coach junior and mid-level engineers
  - Conduct timely code reviews and provide constructive
    feedback
  - Foster a collaborative and continuous learning environment

  Delivery & Collaboration

  - Work closely with the Solution Architect to break down
    features into well-defined user stories and ensure
    alignment with architecture
  - Partner with the Technical Product Manager to understand,
    refine, and support business requirements
  - Collaborate with the Scrum Master and Engineering Manager to
    ensure:
    - Stable and predictable sprint delivery
    - Effective backlog grooming and estimation
    - Timely resolution of blockers
  - Act as the technical point of contact for stakeholders and
    cross-functional teams

  This might describe you

  - Strong problem-solving and communication skills
  - Proven, hands-on experience working as a Lead Engineer or
    Tech Lead in Dynamics 365 / Power Platform / Power Apps
  - Demonstrated ability to deliver in a fast-paced, high-
    demand, high-pressure environment, with concrete examples
    of meeting tight deadlines, handling production issues and
    managing competing priorities
  - Strong expertise in:
    - Dynamics 365 Sales and Dataverse
    - Power Automate
    - Power Apps (Canvas & Model-driven)
  - Hands-on PCF (Power Apps Component Framework) development
    using web technologies: HTML, CSS, TypeScript and React
  - Experience with Git-based version control systems
  - Strong understanding of ALM (Application Lifecycle
    Management) on Microsoft Power Platform
  - Experience working in Agile/Scrum environments
  - Take the on-call duty, including but not limited to, during
    nights and weekends to support Broad Arrow Auctions

  Preferred Qualifications

  - Familiarity with Git repositories / code repos for Dynamics
    365 and Power Apps development, and the ability to
    maintain and run existing CI/CD pipelines (Azure DevOps or
    similar)
  - Experience with Azure services and integrations
  - Familiarity with Power Platform governance and security
    models
  - Microsoft certifications in Dynamics 365 or Power Platform

  What Success Looks Like

  - High-quality, scalable Dynamics solutions delivered
    consistently
  - Strong alignment between architecture, product requirements,
    and engineering execution
  - Improved team productivity and code quality through best
    practices
  - Reliable and efficient CI/CD processes
  - Effective collaboration across product, architecture, and
    engineering teams

  - Other things to note ·
  - This position is open to U.S. remote work. However, team
    members who reside within 20 miles of the Traverse City
    headquarters will follow a hybrid schedule, working from
    the office three days per week. ·
  - May require travel for quarterly events.  ·
  - Familiarity with public company requirements, including
    Sarbanes Oxley and key regulations, if applicable. For SOX
    compliant roles, responsible for designing, executing, and
    documenting internal controls where they have been
    identified as owners to prevent errors in financial
    reporting, processes, and business operations. Including
    attestation to the completeness, accuracy, and compliance
    of all financial reporting data, where applicable.

     If you reside in the following jurisdictions: Illinois,
  Colorado, California, District of Columbia, Hawaii,
  Maryland, Minnesota, Nevada, New York, or Jersey City, New
