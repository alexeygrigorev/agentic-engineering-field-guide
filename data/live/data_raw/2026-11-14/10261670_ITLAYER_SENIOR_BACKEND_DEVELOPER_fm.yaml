description: |
  Company Description

  Are you tired of building trivial frontends? Looking for the
  challenge to build a complex, highly interactive user-
  interface with HTML5/JS?Are you fed up with ecommerce?Want
  to build something purposeful that has a positive impact on
  children’s life?

  Join us!

  We are a Berlin based EdTech startup which was founded in
  2008.Our goal is to improve math learning and teaching in
  schools worldwide.We offer an adaptive learning platform for
  highly interactive math books which enable students to learn
  from their mistakes. Students solve millions of exercises
  each week with  and in doing so experience hundreds of
  thousands of aha! effects.

  Qualifications

  We are looking for a

  Senior BackEnd-Developer

   who will help us to scale our platform.

  You should have

  - several years of experience with the  architecture of
    complex high-traffic web-applications, practical
    experience with microservice architectures is a big plus
  - a DevOps mindset and experience with operations on AWS
    and/or Docker&Co.
  - thorough understanding of design principles (reactive, event
    sourcing, CQRS, …)
  - solid know-how of scalable database systems (NoSQL)
  - mastery of at least two mainstream programming languages and
    desire for more  (we currently use Python, JavaScript)
  - willingness to think and code full-stack
  - a strong passion for software-craftsmanship (TDD,ATDD, BDD)

  Additional Information

  You will be part of a cross-functional, fully-empowered,
  self-organized team.

  We strongly believe in agile principles, value fast learning
  cycles and trust in continuous improvement.Expecting the
  same from you.
