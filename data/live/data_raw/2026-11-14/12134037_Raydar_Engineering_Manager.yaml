description: |
  About the company

  Our client is a technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Oversee a group of software developers responsible for live
  systems, developing them into self-directed owners of their
  areas. Set technical direction and ownership boundaries,
  turn product and system signals into a prioritized plan, and
  stay close to design reviews, debugging and incident
  response. Hands-on use of modern AI coding tools is part of
  the job.

  What you'll do

  - Hire, onboard, coach and grow engineers into independent
    owners.

  - Set ownership boundaries and technical direction across the
    systems the team runs, including handoffs between
    components.

  - Convert usage, quality, system health and capacity signals
    into a sequenced plan with clear acceptance criteria.

  - Review key designs and code changes, and lead debugging,
    technical decisions and incident response.

  - Use AI coding tools yourself and guide engineers in scoping,
    reviewing and verifying their AI-assisted work.

  Requirements

  What we're looking for

  - Two or more years of people leadership over developers who
    ship software into live environments.

  - Strong system design and architecture skill, turning
    business needs into scalable technical solutions.

  - Experience hiring, coaching and growing senior engineers
    into broader owners.

  - At least 1 year at a high-growth startup or an AI-forward
    company.

  - Track record shipping complex platforms, whether data-heavy,
    machine-learning driven, infrastructure or enterprise
    connectivity work.

  - Daily, hands-on use of frontier AI tools in your workflow.

  - At least one signal of excellence, such as a top school or a
    top employer.

  - BS in computer science or a STEM-related field.

  Bonus points

  - Experience with Python and AWS.

  - Background in resilient batch processing, including partial
    reruns and tracking where data originated.

  Benefits

  Compensation and benefits

  - Base salary: $230K - $300K

  - Equity

  - Health, dental and vision coverage

  - Flexible time off

  Location and work model

  - Brooklyn, NY, United States

  - On-site, 5 days in-office

  - Full-time
