description: |
  Job title: Engineering Manager

  Location: Brimsdown, Enfield, UK (Site based role)

  World-changing careers, enabled by Johnson Matthey. With
  more than 200 years history, join us and help to accelerate
  the transition to net-zero! As an Engineering Manager,
  you’ll contribute to JM’s mission as a world leader in
  sustainable technology, transforming energy and reducing
  carbon emissions for a cleaner, brighter future.

  The Engineering Manager leads the engineering and self-
  delivery capital projects on the site and is the single
  point of accountability for maintenance and technical
  engineering.

  Partnering with the PGMS & JM Engineering and Projects
  group, the Engineering Manager provides support to the site
  to ensure that day to day maintenance support is provided
  and long term engineering strategy.

  The Engineering Manager leads deployment of engineering
  objectives for the site, including capital investment
  programme, compliance & standards; line performance
  improvement; organisational standards & capability; and
  sustainability.

  The Engineering Manager must assign, lead, and develop
  engineering and projects capability at a site level to
  deliver capability and succession planning. The Engineering
  Manager ensure that that the business has a strong
  engineering team that can lead early-stage investment
  planning and assure engineering and capital projects
  competence across the site.

  The role leads the site Process Safety technical function
  and will ensure the continual reduction of risk in the
  operation of our processes. The job holder will play a key
  role in assessment of tolerable risk and will ensure that
  the senior leadership are appropriately informed of the
  current risks within the operating field.

  The role:

  - Actively lead and promote a positive safety culture across
    engineering and capital projects
  - Ensure all work is carried out safely through the
    application of JM EHS and sustainability policy
  - Lead delivery of diverse engineering operational
    improvements in line performance, compliance & standards
  - Deliver Engineering Excellence programme for the site and
    ensure cost efficiency is delivered through LEAN
    methodologies.
  - Lead major manufacturing problem resolution typically
    associated with supply interruptions and/or marketed
    product action, applying root cause analysis, design of
    experiments, and CAPA effectiveness trending
  - Lead the site-based capital programme, including pre-gate
    assurance of projects below the threshold requiring group
    project assurance
  - Active contribution to the wider JM Engineering team,
    participating in development and implementation of
    engineering strategy in support of the business

  Reports to:

  - Site Manager

  Direct Reports:

  - Maintenance Manager

  - Capex Manager

  - Capex EHS Lead

  - Process Safety Engineer

  - Compliance Engineer

  Key skills that will help you succeed in this role:

  - Bachelor’s degree in Engineering or related field of
    equivalent experience (advanced degree preferred),
    together with Membership of recognised engineering
    institution.
  - Proven knowledge and experience of capital projects and
    operations within highly regulated and high hazard
    industries.
  - An inspirational safety leader and partner for the EHS
    function, with experience of leading significant safety
    improvement in a project environment.
  - Delivery focused & a self-starter, having a track record of
    achieving challenging goals within business-critical
    timescales while working under pressure.
  - Courage to question or challenge issues and collaborate with
    stakeholders to drive towards resolution.
  - Able to translate complex technical concepts to non-
    technical, senior level audiences.

  Even if you only match some of the skills, we’d love to hear
  from you to discuss further!

  What we offer:

  We make sure salaries are fair, competitive and aligned to
  individual roles, experience and responsibilities. We are
  also supportive of hybrid and flexible working and where
  applicable, offer life, medical and other benefits that
  support our employees’ financial and physical wellbeing,
  such as:

  - Retirement savings
  - Share plans
  - Saving accounts
  - House saving funds
  - Life and disability insurance
  - Commuter allowances and loans
  - Medical plans / health assessments
  - Fitness discounts

  Ready to make a meaningful impact on your career and the
  environment? Join us and help shape a sustainable future
  while advancing your career!

  At JM, inclusivity is central to our values. We create an
  environment where everyone can thrive, embracing diverse
  perspectives to tackle challenges and ensure all colleagues
  feel valued and connected.

  For any queries or accessibility requirements, please
  contact GlobalRecruit@matthey.com. We will work with you to
  make suitable adjustments at any stage of the recruitment
  process. All conversations are confidential, and your
  feedback is welcome to help us provide an accessible and
  positive recruitment experience.

