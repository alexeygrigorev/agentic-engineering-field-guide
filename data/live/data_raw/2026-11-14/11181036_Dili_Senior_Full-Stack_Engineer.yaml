description: |
  About Us

  We're a fast-growing YC-backed startup using AI to simplify
  complex labor compliance processes for energy,
  infrastructure and other construction projects. Our platform
  automates prevailing wage and apprenticeship compliance
  audits, significantly reducing errors and administrative
  workload. We empower clients to confidently navigate audits,
  maximize federal funding, and accelerate the
  industrialization boom in the US.

  Our culture favors high integrity, clear ownership, and
  pragmatic engineering.

  Role Overview

  Full‑Stack Software Engineer (Python / Django · React)

  Responsibilities

  - Build end‑to‑end features across a Python / Django backend
    and React front‑end.
  - Operate what you ship: CI/CD in GitHub Actions, AWS deployed
    via Terraform, shared on‑call rotation.
  - Collaborate directly with customers and our internal
    operations team, turning feedback into rapid product
    improvements.
  - Participate in daily stand‑ups, technical planning, and
    continuous refactoring – working with a high degree of
    autonomy.

  Qualifications

  - 7+ years building and maintaining production web apps
  - React (TypeScript or modern JS)
  - Python web framework (Django, Flask, FastAPI, etc.)
  - Comfort with basic DevOps on AWS and CI/CD pipelines
  - Strong written & verbal communication

  Nice to Haves

  - Terraform or other IaC tools
  - Building software for regulated or enterprise domains

  We care more about demonstrated capability than matching
  every bullet – if you learn quickly and deliver, let’s talk.

  How We Work

  - Hybrid (In-office 3x a week minimum)
  - Daily 15‑minute stand‑up; otherwise deep‑work focus and
    asynchronous comms
  - Code reviews aimed at maintainability and shared learning
  - You own features from concept through production and
    post‑launch support

  Benefits

  - Competitive salary + meaningful early‑stage equity
  - Medical, dental, and vision coverage
  - Company‑funded laptop and home‑office setup
  - Flexible PTO and remote‑work stipend

  Hiring Process (2-3 Weeks)

  - 30‑min video screen
  - 45‑min live technical coding interview
  - 60‑min hands‑on design session
  - Offer
