description: |
  Quick Facts

  Focus:  Connecting Human-Created Copyrighted Content & AI
  Companies training LLMs

  Location: San Francisco Hybrid (USA)

  Website: https://createdbyhumans.ai

  Team: 8 Eng: 4

  Funding: $ 10M Seed Round from top-tier VCs.

  About Us

  Created by Humans is a groundbreaking AI Rights licensing
  platform that connects creators with AI developers, enabling
  the licensing of copyrighted works for AI training and
  reference uses. Our platform aims to protect copyright
  owners’ rights while fostering innovation in AI.

  Created by Humans is built on our founding team’s extensive
  experience in the digital publishing, technology, and data
  infrastructure sectors. Trip Adler, our CEO, previously
  founded Scribd, where he pioneered the subscription model
  for books.  We’re the official partner of the Authors Guild,
  the nation’s oldest and largest organization for 14,000+
  writers.

  We’ve raised $10 million in seed financing from David Sacks’
  Craft Ventures, Mike Maples, Jr. at Floodgate, YCombinator
  CEO, Garry Tan, and bestselling author Walter Isaacson. We
  have already hired several senior engineers (ex-Google, ex-
  Snap, ex-Rubrik) and are looking to expand our team. Over 50
  authors have tested our product in beta, including Douglas
  Preston,  Susan Orlean, Lincoln Child, and others. We made a
  collaboration agreement with one of the largest author
  associations in the US and are about to sign an agreement
  with one of the Big Five publishers in the US.

  Technical Challenge

  We’re building a large-scale system to curate, store and
  deliver content  from multiple industries (publishing,
  video, websites, etc.)to AI companies. One of our technical
  challenges is reconciling all stakeholders for various
  content and implementing a complex payout system so the
  value could flow back from AI Companies to all content
  creation stakeholders.

  Team and Technologies

  We’re building a team of seasoned senior engineers, where
  each member shows technical excellence and a high level of
  ownership. We’d like to stay lean and flat for as long as
  possible. Our primary backend language is Python, and we’re
  deployed on AWS; for our web app, we use TypeScript, React,
  Tailwind, NextJS, and Radix UI. Eventually, we’ll also train
  models ourselves and/or build consumer applications.

  Compensation

  We offer generous equity, competitive salaries, health
  insurance, 401k, and lunches for in-office days.

  For California applicants: the base salary for this position
  is $140.000-$260.000.
