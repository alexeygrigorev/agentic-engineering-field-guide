description: |
  About Swap

  Swap is the infrastructure behind modern agentic commerce.
  The only AI-native platform connecting backend operations
  with a forward-thinking storefront experience.

  Built for brands that want to sell anything - anywhere, Swap
  centralises global operations, powers intelligent workflows,
  and unlocks margin-protecting decisions with real-time data
  and capability. Our products span cross-border, tax,
  returns, demand planning, and our next-generation agentic
  storefront, giving merchants full transparency and the
  ability to act with confidence.

  At Swap, we’re building a culture that values clarity,
  creativity, and shared ownership as we redefine how global
  commerce works.

  About the role

  We are looking for a Full Stack Engineer to join our ever
  growing engineering team. You will be joining us in an
  exciting phase of hyper growth where you will help shape the
  future of Swap and build our products from the ground up.
  The ideal candidate would be someone who has a genuine
  passion for designing and implementing elegant software
  solutions. You will also be intimately familiar and up to
  date with the development ecosystem for making solid
  decisions when it comes to choosing the right tool or
  library for the role. We expect our engineers to be able to
  contribute across the entire product stack, as well as
  collectively oversee the integrity of the codebase. You will
  also partner very closely with our product and design team
  as well as other internal teams when needed.

  Responsibilities

  - Writing scalable, robust, testable, efficient, and easily
    maintainable code.
  - Translating software requirements into working, high-
    performance software.
  - Playing a key role in architectural and design decisions,
    building toward efficient architecture.
  - Writing design documents and estimates.
  - Writing test units.
  - Work with cloud service AWS for deployment, monitoring, and
    scaling of applications.
  - Collaborate with cross-functional teams; work closely with
    product managers, designers, and other engineers to gather
    requirements and translate them into technical
    specifications.

  Requirements

  - Experience working as a Full Stack Engineer.
  - 5+ years of relevant experience in coding in
    Typescript/JavaScript, using Node.js to architect and
    create REST and/or GraphQL APIs.
  - Preferred experience working with eCommerce systems and
    platforms.
  - Strong technical experience in modern front-end
    Typescript/JavaScript libraries and frameworks such as
    React.js.
  - Good understanding of and experience with git & git
    workflows.
  - Experience with relational DBs, data modelling and writing
    SQL queries, and familiarity with NoSQL databases.
  - Familiarity with CI/CD workflows and the deployment of
    workloads to cloud infrastructure.
  - Passion for writing clean, testable and robust code.
  - A BSc in Computer Science or Mathematics (or equivalent
    experience).
  - Enjoy working in a fast paced, high-growth environment.
  - A team player mindset with excellent communication skills
    and the ability to work independently.

  What we offer

  💰 Competitive base salary: Pay that reflects your experience
  and the impact you’ll have, reviewed regularly as you grow
  with us.

  📈 Stock options: Own a piece of what we’re building. As a
  high-growth scale-up, you’ll share in the upside as the
  company grows.

  🏖️ Generous PTO: Competitive annual leave, with public
  holidays on top, plus your birthday off so you can celebrate
  properly.

  🏥 Private healthcare: Comprehensive private medical cover,
  so you can get the care you need quickly.

  🏦 Pension contributions: Company contributions to help you
  build long-term financial security.

  🧘 Wellness benefits: Support for your physical health and
  wellbeing, so you can look after yourself in the way that
  works for you.

  💚 Mental health support: Access to mental health resources
  and support, because looking after your mind matters as much
  as your body.

  👶 Enhanced maternity and paternity leave: Extra support when
  you’re growing your family, so you can focus on what matters
  most.

  🏡 Flexible working: Choose how and where you do your best
  work, with the trust and autonomy to manage your own time.

  ✈️ Work abroad for 4 weeks a year: Take your laptop
  somewhere new for up to four weeks each year, whether that’s
  family, travel, or a change of scenery.

  🎉 Quarterly team offsite budget: A dedicated budget each
  quarter for your team to get together, connect, and have
  fun.

  🍻 Thursday happy hour: Wind down the week with your
  colleagues at our Thursday happy hour, held across all of
  our locations.

  🥞 Breakfast Mondays: Start the week with a good meal and
  good company.

  Diversity & Equal Opportunities:

  We embrace diversity and equality in a serious way. We are
  committed to building a team with a variety of backgrounds,
  skills, and views. The more inclusive we are, the better our
  work will be. Creating a culture of equality isn't just the
  right thing to do; it's also the smart thing.
