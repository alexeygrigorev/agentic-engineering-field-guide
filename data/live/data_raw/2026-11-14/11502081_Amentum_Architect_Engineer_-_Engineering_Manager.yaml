description: |
  At Amentum, we're not just solving problems; we're
  engineering the future. Our team is driven by an unyielding
  commitment to innovation, integrity, and collaboration,
  tackling some of the most significant challenges in science,
  security, and sustainability. If you're passionate about
  making a real impact and want to be part of a community that
  values ethical excellence, this is the place where your
  ambition can thrive.

  Here, we believe that success comes from continuously
  pushing boundaries and working together to deliver on our
  promises. We embrace challenges with confidence and are
  dedicated to creating a secure and vibrant future for all.

  We’ll inspire and empower you to deliver your best work so
  you can evolve, grow and succeed – today and into tomorrow.
  We offer an exciting range of opportunities to develop your
  career within a supportive team who always strive to do the
  right thing for our people, clients and communities.

  People are our greatest asset, and we offer a competitive
  package to retain and attract the best talent.

  In addition to the benefits you’d expect, UK employees also
  receive free single medical cover and digital GP service,
  family-friendly benefits such as enhanced parental leave pay
  and free membership of employee assistance and parental
  programmes, plus reimbursement towards relevant professional
  development and memberships.

  Work-life balance and flexibility is a key focus area for
  us. We’re happy to discuss hybrid, part-time and flexible
  working hours, patterns and locations to suit you and our
  business.

  About the Opportunity

  Amentum is currently recruiting for an Architect Engineer -
  Engineering Manager to join our Engineering & Technical
  Services (ETS) business. ETS is entering an exciting phase
  of opportunity by supporting our key client’s UK nuclear
  fleet through a business transformation, and by supporting
  new small modular reactor developers. Our work is varied,
  covering New Build, Generation, Life Extension, and
  Defueling, and our capabilities are in demand across the
  nuclear sector.

  Are you good at spinning plates?

  It’s not something you see very often on TV these days, but
  figuratively, it is a very useful skill, one which is vital
  if your goal is to keep nuclear power stations operating
  safely, contributing to the UK’s Net Zero carbon target, or
  to help prepare them for decommissioning.

  The UK’s five operating stations deliver 16% of the UK’s
  power, and it takes a large team delivering 100’s of
  projects to enable these stations to continue generating as
  well as defuel the three stations that have ceased operation
  - and that’s a lot of plates.

  And this is where you come in

  Your role will be to co-ordinate multi-disciplinary
  engineering teams and activities, delivering complex
  engineering solutions to time, cost and quality on projects
  of varying sizes. If you’re familiar with project delivery,
  you’ll know that they have plenty of moving parts and
  complexity, which is why you’ll be working alongside our
  Operations Managers and Framework Directors to support you
  to deliver successful outcomes for clients.

  People are at the heart of everything we do

  Centre to the success of the role will be your people
  skills, building effective relationships and interacting
  with multiple internal and external stakeholders in multiple
  locations.

  You’ll also work closely with colleagues to support
  activities that offer the best service to the client.
  Through your interactions, you’ll be able to gather useful
  intelligence on client needs and work with the team to
  deliver innovative solutions.

  You’ll utilise your strong communication and engagement
  skills to achieve client, people and business outcomes,
  working with your team and peers that are based in different
  locations across the UK.

  We’re continuously evolving and growing the business, so
  there’s plenty of opportunity to evolve and grow your skills
  and career too.

  This role will be based at one of our offices (Leiston or
  London). We put flexibility at the heart of what we do and
  we’re happy to consider flexible working patterns. Key
  responsibilities will be:

  - Co-ordinate multi-discipline engineering teams to deliver
    complex engineering solutions to time, cost and quality on
    projects of varying sizes
  - Marshall projects through an investment delivery process,
    from FEED to solution delivery
  - Act as Architect Engineer on projects, taking ownership of
    technical challenges, developing strategies, and managing
    stakeholders and interfaces in order to implement
    technical solutions
  - Development and delivery of clear engineering strategies
  - Manage significant number of varied stakeholders
  - Deliver projects across a typical project lifecycle,
    including bidding, definition of requirements, design and
    implementation, into delivery of commissioned systems
    ready to support the needs of our clients
  - Safety Case Alignment: Liaison with Case Officers to ensure
    safety case strategy is integrated with design
    development. Support for development of safety case
    documentation
  - Identify and manage technical risks
  - Support the Project Manager with respect to resourcing and
    financial elements, such as costs and schedule, and
    supporting change control and identification and control
    of technical risks

  Qualifications, Skills & Experience

  - Degree qualified or equivalent (e.g. HNC/HND with
    significant experience) in engineering discipline with
    extensive design experience
  - Chartered Engineer, Fellow or similar demonstrable
    experience
  - A Mechanical, Process, EC&I, Structural Integrity or Civils
    technical background is essential
  - Self-starter with a professional leadership approach and a
    technical background
  - Nuclear industry, and/or equivalent safety case, experience
  - Demonstrable experience in leading and managing
    multidiscipline teams
  - Proven experience of engineering delivery within a nuclear
    or highly regulated environment
  - Motivated team member with the ability to work to deadlines
    and communicate project progress
  - Good communication skills and ability to articulate
    information to a broad range of stakeholders
  - Ability to produce a project strategy to solve technical
    problems and take ownership of all the interfaces to
    implement the solution
  - Experience of executing project tasks against relevant
    codes, standards, and best practices
  - Knowledge of Project Management principles and experience of
    handling change control and making informed judgements to
    control or mitigate project risks
  - Committed to Continuous Professional Development of self and
    others
  - Previous experience working on the UK’s fleet of operational
    or decommissioning nuclear power plants is highly
    desirable

  Our Culture

  Our values are built on a strong foundation of safety,
  integrity, and respect for every individual. People are at
  the heart of our mission, and we believe in supporting one
  another through a culture of care and collaboration.

  We strive to create a workplace where everyone feels they
  belong and can thrive. Supporting mental wellbeing and
  fostering a sense of connection are essential to how we
  work.

  When we embrace different perspectives and work together, we
  become more innovative, more agile, and more successful.

  We partner with VERCIDA, for greater online accessibility
  please visit www.vercida.com to view and access our roles.
  As a Disability Confident employer, we will interview all
  disabled applicants who meet the minimum criteria for a
  vacancy. We welcome applications from candidates who are
  seeking flexible working and from those who may not meet all
  the listed requirements for a role.

  If you require further support or reasonable adjustments
  with regards to the recruitment process (for example, you
  require the application form in a different format), please
  contact the team.

