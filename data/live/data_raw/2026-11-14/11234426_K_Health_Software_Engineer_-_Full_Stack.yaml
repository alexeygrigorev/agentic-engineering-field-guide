description: |
  About the Role

  As a Software Engineer at K Health, you are the champion of
  technical excellence for a high-stakes portfolio of clinical
  AI and a suite of products that serve the patients and the
  physicians. We don't just build apps; we build, and operate
  modern, AI-powered, 24/7 virtual clinics for the nation’s
  largest health systems.

  In this role, your mission is to help build a product
  ecosystem where reliability, privacy, and performance are
  non-negotiable. You will develop reusable components and
  resilient architectures that exude trust, ensuring that
  every patient interaction is seamless and every clinical
  data point is secure. You will be a "multiplier," creating
  the foundational frameworks that allow us to deploy 5-star
  experiences across a portfolio of partners without
  sacrificing the quality our users depend on.

  This role requires onsite presence in our New York City
  office 4 days a week and does not provide immigration
  support.

  What you will do

  - Full-Stack: Support the end-to-end lifecycle of products and
    features, from multi-platform clients, to the Kotlin/JVM-
    based backend services that power them.
  - Quality as a Feature: Enforce standards for high-stakes
    engineering—ensuring that performance, accessibility, and
    data privacy are baked into every feature
  - Platform Innovation: Proactively modernize our systems to
    leverage agentic AI tools that improve developer
    productivity and team efficiency.
  - Technical Stewardship: Act as a stabilizing force in complex
    technical situations, bringing clarity to ambiguous
    requirements and making informed decisions that mitigate
    risk.
  - Mentor & Multiply: Level up the engineering organization by
    fostering an ownership mindset and modeling how to move
    fast while maintaining clinical-grade quality.

  What we are looking for

  - Established Expertise: 3-5+ years of professional software
    engineering experience, with a deep focus on building
    robust, customer-facing products from front-to-back.
  - Full Stack Fluency: Strong professional experience in front-
    to-back-end development using Node/Typescript with a JVM
    language (Kotlin or Java) as a major plus.
  - Middle Layer Proficiency: You understand how to build
    resilient APIs that support critical workflows on any
    user-facing platform. We leverage GraphQL and Typescript
    heavily in the middle layers.
  - Tasteful User Experience: You develop with the customer in
    mind, and prioritize their experience across the
    functional and non-functional considerations that shape
    the overall experience across Web and for Mobile
    platforms.
  - AI-First Mindset: Proficiency with modern agentic
    development tools (i.e., Claude Code), using them
    effectively across platforms to deliver high-quality code
    quickly and reliably.
  - Repeatable Patterns Mentality: Experience building reusable
    frameworks, white-label solutions, or multi-tenant
    architectures where code quality directly impacts multiple
    products.
  - Mission-Driven Reliability: A background in high-stakes
    industries (e.g., HealthTech, ConsumerTech, or
    Conversational AI) where performance and privacy are
    paramount.
  - Autonomy & Judgment: Proven ability to work with high levels
    of autonomy, using your expertise to "do the right thing"
    for the patient and the partner.
  - Education: A Bachelor’s or Master’s degree in Computer
    Science or a related technical field.

  Bonus

  - KMP: Experience with Kotlin Multiplatform to drive logic
    sharing across the portfolio.
  - Security Expertise: Deep knowledge of security best
    practices and data encryption.
  - Clinical Integration: Experience with healthcare standards
    (FHIR, HL7) or integrating with EHR systems.

  Benefits & Perks:  #LI-Hybrid

  - Hybrid work schedule with weekly lunches and stocked fridges
  - Monthly social committees for company events
  - 18 vacation days, 9 company holidays, 5 sick days, and 2
    personal days
  - Stock options for every full-time employee
  - Paid parental leave
  - 401k benefit
  - Commuter Benefits
  - Competitive health, dental, and vision insurance options

  Compensation:

  $140,000—$165,000 USD

  Who We Are:

  Behind every leading health system is K Health’s AI-powered
  virtual care engine.

  Our deeply integrated model modernizes the primary care loop
  by using AI to put humans first. For our patients, we offer
  clinical AI (i.e., PatientGPT) and unparalleled access to
  close care gaps around the clock. For our Providers, we
  deliver provider-serving agentic solutions (i.e., Perfect
  Note) to eliminate administrative overload and burnout. And
  for the health systems, we deploy our top-grade Virtualists
  in AI-powered virtual clinics 24/7 to capture the patients'
  care journeys at step one, retain the journey through the
  system for longitudinal care, and strengthen profitability.

  We’re founded in 2016, headquartered in New York City, and
  backed by over $443.5M from leading investors including
  Valor Equity Partners, Claure Group, Mangrove Capital
  Partners, 14W, Notable Capital, Lerer Hippeau, Primary
  Venture Partners, Comcast Ventures, PICO Venture Partners,
  Max Ventures, and other strategic healthcare partners.

  We offer competitive compensation packages based on industry
  benchmarks for function, level, and geographic location.
  Offer amounts are determined by multiple factors such as a
  candidate's experience and expertise.

  We are proud to be an Equal Opportunity Employer and
  consider applicants for employment regardless of race,
  ethnicity, religion, color, national origin, ancestry,
  disability, medical condition, genetic information, marital
  status, sex, gender, gender identity, gender expression,
  sexual orientation, pregnancy, childbirth and breastfeeding,
  age, citizenship, military or veteran status, or any other
  class protected by applicable federal, state, and local
  laws. We’re deeply committed to building teams as diverse as
  the patients we serve and strive to cultivate an environment
  where everyone can bring their most authentic self to work.
  We depend on our differences to make our team stronger, our
  workplace more dynamic, and our product accessible to all of
  our users.

  We are committed to maintaining the integrity of our hiring
  process and ensuring a safe environment for all candidates.
  All communication for job offers from K Health will come
  from email addresses ending in @khealth.com. K Health will
  never ask you to provide financial information about
  yourself during the recruitment process. We will never use
  personal email accounts or other domains for official
  correspondence. Our official job postings are only listed on
  our official website and reputable job boards. Be cautious
  of job offers from sources other than these platforms.
