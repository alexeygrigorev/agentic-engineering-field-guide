description: |
  About Thunes:

  Thunes is the Smart Superhighway to move money around the
  world. Thunes’ proprietary Direct Global Network allows
  Members to make payments in real-time in over 140 countries
  and more than 90 currencies. Thunes’ Network connects
  directly to over 12 billion mobile wallets, stablecoin
  wallets and bank accounts worldwide, as well as 15 billion
  cards via more than 220 different payment methods, such as
  GCash, M-Pesa, Airtel, MTN, Orange, JazzCash, Easypaisa,
  AliPay, WeChat Pay and many more.

  Thunes’ Direct Global Network differentiates itself through
  its worldwide reach, in-house SmartX Treasury System and
  Fortress Compliance Platform, ensuring Members of the
  Network receive unrivaled speed, control, visibility,
  protection, and cost efficiencies when making real-time
  payments, globally.

  Members of Thunes’ Direct Global Network include gig economy
  giants like Uber and Deliveroo, super-apps like Grab and
  WeChat, MTOs, fintechs, PSPs and banks.

  Headquartered in Singapore, Thunes has offices in 14
  locations, including Barcelona, Beijing, Dubai, Hong Kong,
  Johannesburg, London, Manila, Nairobi, New York, Paris,
  Riyadh, San Francisco and Shanghai. For more information,
  visit: https://www.thunes.com/

  Context of the role

  We’re looking for a Senior Software Engineer (Golang) who is
  passionate about the FinTech industry, wants to work in a
  disruptive, fast-growing and exciting environment. As part
  of the Engineering team, based in Europe, this role will
  bring you great opportunities to work on various projects,
  technologies, with a diverse range of teams.

  The Engineering team is responsible for developing our core
  business products and getting them to production in the most
  efficient and fastest way possible. We architect solutions,
  tools and platforms to solve business needs and tools around
  provisioning, configuration, CICD, monitoring, SLA,
  performance and uptime. Our team is passionate about the
  details and we work very closely with a wide range of
  stakeholders. Processing millions of transactions per month
  and interconnecting hundreds of partners from all around the
  world, Thunes is continuously growing its coverage and
  footprint in the industry.

  Responsibilities

  We’re looking for a highly driven, self-motivated,
  technically excellent engineer who is truly excited about
  having a meaningful impact within the company and payments
  industry. In this role, you will combine a startup mindset
  with the scale of an industry leader. Working on our core
  platform and services you will help us to create the future
  of the company, by ensuring the scalability and performance
  of the platform, delivering new functionalities, automating
  and improving development processes.

  - Work on highly available services, exposed mainly by APIs
  - Participate in the design, implementation and shipping of
    new products to internal and external stakeholders
  - Deliver high quality, testable, secure, readable, scalable
    and documented software
  - Understand, apply and champion the principles of the agile
    methodology (code reviews, sprint planning, pair
    programming, daily stand-ups, etc..)
  - Assist in the evaluation of new technologies and initiatives

  What we are looking for

  - Preferably a degree in Information Technology, Engineering
    Computer Science or related fields
  - Software engineers that are motivated, curious and have an
    appetite for learning
  - Proficient in Golang
  - Experience with Event-Driven Architecture and message
    brokers (e.g., AWS SNS/SQS, Apache Kafka, RabbitMQ)
  - Experience with relational databases (e.g, PostgreSQL,
    MySQL)
  - Passionate about Agile Methodology and practices (TDD, CI,
    CD, etc..)
  - Experience designing and developing web and API solutions
  - Interest in the Fintech Industry and market innovations

  Benefits

  - Great compensation package, including performance & company
    bonus
  - Private Health insurance for you and your family
  - Life Insurance
  - Work life balance (flexibility and hybrid working policy)
  - Great offices close to Sagrada Familia
  - Learning & Development budget
  - Our team is global, you will work with 40+ different
    nationalities spread across 5 continents
  - 25 days of holidays + 2 Thunes Out Days + 2 Community days

  We can offer you an environment where we have a culture of
  learning and feedback. You will be challenged to own your
  code - write, test, deploy it, multiple times per day. Our
  technology is used 24/7 and around the world, it needs to be
  reliable, secure and massively scalable. You will also need
  to interface with technology teams in different countries.
  Our environment and packages match the ambition of the
  company - building world class engineering teams.

  Sound like you? Apply now!
