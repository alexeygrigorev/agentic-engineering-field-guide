description: |
  POSITION OVERVIEW

  MCI is one of the fastest-growing tech-enabled business
  services companies in the USA, with a strong call center
  footprint and operations that extend across multiple
  countries. We deliver Customer Experience (CX), Business
  Process Outsourcing (BPO), and Anything-as-a-Service (XaaS)
  cloud technology solutions across a wide range of
  industries, including healthcare, retail, government,
  education, telecom, technology e-commerce, and financial
  services. Our contact centers are powered by both on-site
  and remote agents, leveraging advanced technologies to
  enhance customer journeys, drive scalability and reduce
  costs.

  At MCI we are committed to fostering an environment where
  professionals can build meaningful careers, access
  continuous learning and development opportunities and
  contribute to the success of a globally expanding, industry-
  leading organization.

  We’re building a next‑generation labor marketplace that
  makes hiring effortless for employers and unlocks real
  opportunities for workers. We’re looking for a Product
  Engineer who can do something rare: design intuitive user
  experiences and build the full‑stack systems behind them. If
  you thrive on owning features end‑to‑end and turning complex
  workflows into elegant products, this role is for you.

  Our platform powers the full talent lifecycle sourcing,
  matching, onboarding, scheduling, compliance, messaging, and
  performance insights. The challenge is to make it simple
  enough for first‑time users yet powerful enough for
  workforce managers. Your work will directly impact hiring
  speed, user satisfaction, and marketplace adoption.

  Why You’ll Love Working With Us

  - High‑impact role where you own meaningful product surfaces.
  - Opportunity to shape a platform from the ground up.
  - Fast‑moving team that values design thinking, engineering
    excellence, and rapid iteration.
  - A culture that rewards problem‑solvers, builders, and people
    who deliver.

  If you’re excited about crafting intuitive interfaces and
  building the systems that power them we’d love to meet you.

  Apply now and help shape the future of workforce technology.

  To be considered for this role, you must complete a full
  application on our company careers page, including all
  screening questions and a brief pre-employment test.

  POSITION RESPONSIBILITIES

  Key Responsibilities:

  - Own features from concept to production: research, UX
    design, prototyping, and full‑stack delivery.
  - Design user flows, wireframes, and reusable component
    systems for web and mobile.
  - Build responsive front‑end experiences with React, Next.js,
    or Vue.
  - Develop scalable back‑end logic, APIs, and databases using
    Node.js, Python, and SQL.
  - Maintain and evolve our design system and component library.
  - Simplify complex hiring workflows into frictionless user
    experiences.
  - Validate ideas through user interviews, feedback loops, and
    rapid iteration.
  - Collaborate with product, engineering, UX, operations, and
    HR teams.
  - Ensure performance, accessibility, and security across the
    stack.
  - Use analytics, funnel metrics, and A/B testing to guide
    product decisions.
  - Marketplace workflows: job posting, onboarding, worker
    profiles, matching/search
  - Employer dashboards: candidate management, reporting,
    performance insights
  - Worker experience: scheduling, availability, shift
    management, messaging
  - Integrations: ATS, HRIS, CRM, identity verification,
    payroll, communication tools
  - Design system ownership: patterns, typography, interactions,
    components

  CANDIDATE QUALIFICATIONS

  WONDER IF YOU ARE A GOOD FIT FOR THIS POSITION?

  All positive, and driven applicants are encouraged to apply.
  The Ideal candidates for this position are highly motivated
  and dedicated and should possess the below qualities:

  - Bachelor’s degree in Computer Science, Software Engineering,
    Information Systems, or equivalent experience.
  - 4+ years in product engineering, full‑stack engineering, UX
    engineering, or hybrid roles.
  - Strong portfolio showcasing UX/UI work and shipped
    production features.
  - Proficiency in modern front‑end frameworks (React, Next.js,
    Vue).
  - Experience with back‑end frameworks (Node.js, Express,
    Python, or similar).
  - Thorough understanding of databases, cloud environments, and
    API design.
  - Ability to translate product requirements into strong design
    and technical solutions.
  - Experience in fast‑paced or early‑stage product
    environments.

  Added strengths we appreciate:

  - Experience with labor marketplaces, gig/shift platforms, or
    HR tech.
  - Familiarity with scheduling engines, matching algorithms, or
    identity verification workflows.
  - Exposure to real‑time systems (WebSockets) or event‑driven
    architecture.
  - Background in design systems, component libraries, or motion
    design.
  - Experience integrating with ATS, HRIS, payroll, or
    communication tools.

  COMPENSATION DETAILS

  WANT AN EMPLOYER THAT VALUES YOUR CONTRIBUTION?

  At MCI, we believe that your hard work deserves recognition
  and reward. Our compensation and benefits packages are
  designed to be competitive and to grow with you over time.
  Starting compensation is based on experience, and we offer a
  variety of benefits and incentives to support and reward our
  team members.

  What You Can Expect from MCI:

  We understand the importance of balance and support, which
  is why we offer a variety of benefits and incentives that go
  beyond a paycheck. Our team members enjoy:

  - Paid Time Off: Earn PTO and paid holidays to take the time
    you need.
  - Incentives & Rewards: Participate in daily, weekly, and
    monthly contests that include cash bonuses and prizes
    ranging from electronics to dream vacations and sometimes
    even cars!
  - Health Benefits: Full-time employees are eligible for
    comprehensive medical, dental, and vision coverage after
    60 days of employment, and all employees have access to
    MEC medical plans after just 30 days. Benefit options vary
    by location.
  - Retirement Savings: Secure your future with retirement
    savings programs, where available.
  - Disability Insurance: Short-term disability coverage is
    available to help protect you during unexpected
    challenges.
  - Life Insurance: Access life insurance options to safeguard
    your loved ones.
  - Supplemental Insurance: Accident and critical illness
    insurance
  - Career Growth: With a focus on internal promotions,
    employees enjoy significant advancement opportunities.
  - Paid Training: Learn new skills while earning a paycheck.
  - Fun, Engaging Work Environment: Enjoy a team-oriented
    culture that fosters collaboration and engagement.
  - Casual Dress Code: Be comfortable while you work.

  Compensation & Benefits that Fit Your Life

  MCI takes pride in tailoring our offerings to fit the needs
  of our diverse team across subsidiaries and locations. While
  specific benefits and incentives may vary by geography, the
  core of our commitment remains the same: rewarding effort,
  providing growth opportunities, and creating an environment
  where every employee feels valued.

  If you’re ready to join a company that recognizes your
  contributions and supports your growth, MCI is the place for
  you. Apply today!

  PHYSICAL REQUIREMENTS

  This job operates in a professional office environment.
  While performing the duties of this job, the employee will
  be largely sedentary and will be required to sit/stand for
  long periods while using a computer and telephone headset.
  The employee will be regularly required to operate a
  computer and other office equipment, including a phone,
  copier, and printer. The employee may occasionally be
  required to move about the office to accomplish tasks; reach
  in any direction; raise or lower objects, move objects from
  place to place, hold onto objects, and move or exert force
  up to forty (40) pounds.

  CONDITIONS OF EMPLOYMENT

  All MCI Locations

  - Must be authorized to work in the country where the job is
    based.

  Subject to the program and location of the position

  - Must be willing to submit up to a LEVEL II background and/or
    security investigation with a fingerprint.  Job offers are
    contingent on background/security investigation results.
  - Must be willing to submit to drug screening.  Job offers are
    contingent on drug screening results. (Does not apply in
    Canada)

  REASONABLE ACCOMMODATION

  Consistent with the Americans with Disabilities Act (ADA),
  it is the policy of MCI and its affiliates to provide
  reasonable accommodations when requested by a qualified
  applicant or employee with a disability unless such
  accommodations would cause undue hardship. The policy
  regarding requests for reasonable accommodation applies to
  all aspects of employment. If reasonable accommodations are
  needed, please contact Human Resources.

  EQUAL OPPORTUNITY EMPLOYER

  At MCI and its subsidiaries, we embrace differences and
  believe diversity is a benefit to our employees, our
  company, our customers, and our community.  All aspects of
  employment at MCI are based solely on a person's merit and
  qualifications.  MCI maintains a work environment free from
  discrimination, one where employees are treated with dignity
  and respect. All employees share in the responsibility for
  fulfilling MCI's commitment to a diverse and equal
  opportunity work environment.

  MCI does not discriminate against any employee or applicant
  on the basis of age, ancestry, color, family or medical care
  leave, gender identity or expression, genetic information,
  marital status, medical condition, national origin, physical
  or mental disability, political affiliation, protected
  veteran status, race, religion, sex (including pregnancy),
  sexual orientation, or any other characteristic protected by
  applicable laws, regulations, and ordinances.  MCI will
  consider for employment qualified applicants with criminal
  histories in a manner consistent with local and federal
  requirements.

  MCI will not tolerate discrimination or harassment based on
  any of these characteristics.  We adhere to these principles
  in all aspects of employment, including recruitment, hiring,
  training, compensation, promotion, benefits, social and
  recreational programs, and discipline. In addition, it is
  the policy of MCI to provide reasonable accommodation to
  qualified employees who have protected disabilities to the
  extent required by applicable laws, regulations, and
  ordinances where an employee works.

  ABOUT MCI (PARENT COMPANY)

  MCI helps customers take on their CX and DX challenges
  differently, creating industry-leading solutions that
  deliver exceptional experiences and drive optimal
  performance. MCI assists companies with business process
  outsourcing, staff augmentation, contact center customer
  services, and IT Services needs by providing general and
  specialized hosting, software, staff, and services.

  In 2019, Marlowe Companies Inc. (MCI) was named by Inc.
  Magazine as Iowa’s Fastest Growing Company in the State of
  Iowa and was named the 452nd Fastest Growing Privately
  Company in the USA, making the coveted top 500 for the first
  time. MCI’s subsidiaries had previously made Inc. Magazine's
  List of Fastest-Growing Companies 15 times, respectively.
  MCI has ten business process outsourcing service delivery
  facilities in Georgia, Florida, Texas, New Mexico,
  California, Kansas, Nova Scotia, South Africa, and the
  Philippines.

  Driving modernization through digitalization, MCI ensures
  clients do more for less. MCI is the holding company for a
  diverse lineup of tech-enabled business services operating
  companies. MCI organically grows, acquires, and operates
  companies that have synergistic products and services
  portfolios, including but not limited to Automated Contact
  Center Solutions (ACCS), customer contact management, IT
  Services (IT Schedule 70), and Temporary and Administrative
  Professional Staffing (TAPS Schedule 736), Business Process
  Management (BPM), Business Process Outsourcing (BPO), Claims
  Processing, Collections, Customer Experience Provider (CXP),
  Customer Service, Digital Experience Provider (DXP), Account
  Receivables Management (ARM), Application Software
  Development, Managed Services, and Technology Services, to
  mid-market, Federal & enterprise partners. MCI now employs
  10,000+ talented individuals with 150+ diverse North
  American client partners across the following MCI brands:
  MCI BPO, MCI BPOaaS, MarketForce,  GravisApps, Gravis
  Marketing, MarchEast, Mass Markets, MCI Federal Services
  (MFS), OnBrand24, The Sydney Call Center, Valor Intelligent
  Processing (VIP), BYC Aqua, EastWest BPO, TeleTechnology,
  and Vinculum.

