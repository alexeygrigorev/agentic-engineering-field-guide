description: |
  At Expedia Group, we help travelers explore the world, one
  journey at a time. As a global travel company powered by
  passionate people, trusted partnerships, and leading
  technology, we connect travelers, partners, and advertisers
  through our consumer brands, B2B network, and travel
  advertising business.

  Here, you'll do meaningful work that helps millions of
  people discover, book, and experience travel with more ease,
  confidence, and joy. Our five Behaviors-Traveler First,
  Think Big, Operate with Excellence, Ownership Mindset, and
  Succeed Together-help foster a supportive environment where
  people can grow their careers and have the flexibility,
  benefits, and support to do their best work. Join us and
  build for travelers everywhere.

  Expedia Business the B2B arm of Expedia Group. We bring
  Expedia Group’s innovative technology and distribution
  solutions to partners across the world, including financial
  institutions, corporate managed travel companies, offline
  travel agents, and travel suppliers. As a Software
  Development Engineer II supporting Forward Deployment
  Engineering, you will build software solutions that address
  partner needs and bring Expedia Group’s Travel Platform
  capabilities to life. You will combine hands-on software
  development with customer collaboration, solution discovery,
  prototyping, and technical delivery. In this role, you will:

  - Develop, test, deploy, and maintain software applications
    and supporting services in public or hybrid cloud
    environments.
  - Work directly with partners, product teams, sales, and
    engineering teams to understand business needs and
    translate them into technical solutions.
  - Build prototypes, integrations, APIs, and production-quality
    software that demonstrate and deliver value.
  - Apply software design principles, data structures, design
    patterns, and computer science fundamentals to create
    clean, maintainable, modular code.
  - Use databases, data stores, and API integration patterns to
    support partner and platform requirements.
  - Contribute to solutions involving emerging technologies,
    including AI-powered and intelligent travel experiences.
  - Test, monitor, debug, and improve your code using
    appropriate engineering tools and practices.
  - Consider security, resiliency, scalability, observability,
    and operational requirements when developing solutions.
  - Collaborate with stakeholders to coordinate input, resolve
    issues, and support holistic solutions across people,
    process, technology, and organisational needs.
  - Report clearly on work status, ask thoughtful questions, and
    identify inefficiencies or opportunities to improve
    existing systems.
  - Build relationships across Expedia Group, seek expertise
    from subject matter experts, and contribute to a
    collaborative engineering culture.
  - Apply Expedia Group principles to your work: choose
    fearlessly, include consciously, trust each other, force
    simplicity, and go get what’s next.

  Experience and Qualifications:

  - 2+ years of professional software development experience
    with a bachelor’s degree in Computer Science, Software
    Engineering, or a related technical field; or 0–2 years of
    experience with a master’s degree in Computer Science,
    Software Engineering, or a related technical field; or
    equivalent related professional experience.
  - Experience developing software in a team environment using
    agile practices and version control.
  - Experience building and maintaining software deployed to
    production in a public or hybrid cloud environment.
  - Strong proficiency in at least one programming language and
    familiarity with additional languages relevant to the
    role.
  - Familiarity with databases, data stores, API design, and
    system integration.
  - Understanding of moderately complex systems and how projects
    contribute to team and business goals.
  - Experience testing, monitoring, troubleshooting, and
    debugging applications.
  - Ability to collaborate effectively with engineers, partners,
    and stakeholders, including audiences with varying levels
    of technical knowledge.

  Preferred

  - Experience in forward deployment engineering, solution
    engineering, consulting, or customer-facing software
    development.
  - Experience building proofs of concept, prototypes, or
    integrations for external partners.
  - Familiarity with large language models, prompt design, AI
    application development, or AI evaluation.
  - Experience with cloud platforms, distributed systems,
    observability tools, or continuous delivery practices.
  - Experience working in travel technology, B2B technology, or
    platform-based products.

  Accommodation requests

  Expedia Group is committed to providing an inclusive and
  accessible recruiting experience. If you need an
  accommodation or adjustment due to a disability during the
  application or recruiting process, please submit a request
  at https://expedia.service-
  now.com/askeg?id=job_accommodation.

  About Expedia Group

  Expedia Group includes three flagship consumer brands -
  Expedia, Hotels.com, and Vrbo - along with a leading B2B
  travel business and travel advertising offerings. Across our
  brands and business, we help travelers explore the world
  with confidence and ease.

  Important notice

  Employment opportunities and job offers at Expedia Group
  will always come from Expedia Group's Talent Acquisition and
  hiring teams. Never share sensitive personal information
  unless you are confident of the recipient. Expedia Group
  does not extend job offers via email or messaging tools to
  individuals with whom we have not made prior contact. Our
  email domain is @expediagroup.com. The official place to
  find and apply for roles is
  https://careers.expediagroup.com/jobs/.

  Equal Opportunity

  Expedia is committed to creating an inclusive work
  environment with a diverse workforce. All qualified
  applicants will receive consideration for employment without
  regard to race, religion, gender, sexual orientation,
  national origin, disability or age.
