description: |
  Who We Are

  Holiday Channel is a forward-thinking startup focused on
  creating innovative solutions like Digital Magazines,
  Marketplace and Streaming Platform to enhance holiday
  experiences. Holiday World is a digital media and
  entertainment company building the world’s first platform
  for ALL THINGS HOLIDAY where consumers can conveniently find
  all their holiday needs 24x7x365 — entertainment, shopping,
  trends, traditions, food, travel, DIY, and the best deals.
  We created Holiday World to inspire, celebrate, and unite
  people through holidays, as well as all the traditions and
  rituals that accompany them. As the first inclusive
  destination devoted to sharing a global lens on holiday
  celebrations and preparation, Holiday World is a catalyst
  for more diverse storytelling and cross-cultural education.
  Our mission is to give millions of people a reason to
  celebrate and savor every day, every moment, all year by
  uniting communities with more joy, more fun, and more
  compassion. Holiday World is a for-profit company that holds
  its social mission at its core. What We Offer

  - Immediate opportunity to make an impact on our team,
    product, and business.
  - A chance to work with a startup that has over 110K users.
  - A get-stuff-done and fun and caring culture.
  - Meaningful work and a strong shared sense of mission.
  - A remote first working environment with an office in
    Colorado Springs, CO.
  - A platform to lead and innovate within a dynamic startup
    environment, offering substantial opportunities for
    professional growth and development.
  - Sponsorship for international students on F-1 OPT ((Optional
    Practical Training)

  What This Role Is

  We are seeking talented and motivated individuals to join
  our team for an exciting opportunity to work on cutting-edge
  technologies and projects. This unpaid internship is
  designed for software engineers who are passionate about web
  development and want to enhance their skills in full-stack
  development, with a focus on TypeScript, Next.js, React.js,
  Node.js, Tailwind CSS, Framer Motion, MongoDB, PostgreSQL,
  and microservice architecture. As a Software Engineer Intern
  (MERN Stack with TypeScript), you will work alongside
  experienced developers, contribute to real-world projects,
  and gain invaluable experience in full-stack web
  development. You’ll be involved in all stages of the
  development process, from concept to deployment, and will
  have the opportunity to sharpen your skills while building
  meaningful applications.

  What You'll Do

  - Collaborate with the development team to design, build, and
    maintain full-stack web applications using
    Next.js/React.js, Node.js and Express.js with TypeScript.
  - Implement responsive user interfaces using Tailwind CSS.
  - Create engaging animations and interactions with Framer
    Motion.
  - Develop and manage PostgreSQL databases.
  - Assist in integrating APIs and third-party services.
  - Participate in code reviews and contribute to team
    discussions on best practices. Troubleshoot, debug, and
    upgrade existing systems.
  - Stay updated with the latest web technologies and tools.
  - Work on both front-end and back-end features of the
    application.
  - Contribute to the planning and design of new software
    products.

  What You'll Have

  - 2+ years of experience working with the MERN stack (MongoDB,
    Express.js, React, Node.js).
  - Proficiency in TypeScript.
  - Strong understanding of JavaScript, HTML, and CSS.
  - Experience with front-end frameworks (Next.js, React.js) and
    back-end frameworks (Node.js, Express.js).
  - Familiarity with Tailwind CSS for responsive design.
  - Experience with Framer Motion for animations.
  - Knowledge of PostgreSQL and database management.
  - Understanding of microservice architecture.
  - Familiarity with RESTful APIs and version control systems
    (Git).
  - Excellent problem-solving skills and the ability to work
    both independently and collaboratively in a team
    environment.
  - Strong communication skills and the ability to contribute
    ideas in a constructive manner.
  - Experience in eCommerce development is a plus.

  What Helps You Stand Out

  - Familiarity with cloud services such as AWS, Azure, or
    Google Cloud.
  - Experience with CI/CD pipelines.
