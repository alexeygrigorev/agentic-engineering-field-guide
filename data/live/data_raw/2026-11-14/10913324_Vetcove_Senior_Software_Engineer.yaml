description: |
  Join Vetcove and help modernize the future of veterinary
  software and the pet parent healthcare experience. Our suite
  of platforms features a market-leading procurement
  marketplace, an ultra-modern home delivery ecommerce
  experience, and a next-generation practice management
  system. More than 25,000 hospitals across all 50 states rely
  on Vetcove daily, supporting tens of thousands of
  veterinarians who care for tens of millions of pets each
  year.

  We are modernizing the 50 billion dollar plus animal health
  industry by giving veterinary organizations the tools to
  focus more on patient care. Backed by Y Combinator and top
  venture investors in Silicon Valley, New York and Miami,
  Vetcove is a fast-growing, mission-driven company. We are
  searching for talented and passionate people who want to
  help shape the future of veterinary care.



  About the Position

  The Senior Software Engineer Role is a key member of our
  engineering team who is responsible for supporting projects
  from conception to completion. This level of involvement
  includes plan formulation, creation, maintenance and upgrade
  implementations across most of the technology stack. As a
  contributor to the core features of the Vetcove platform,
  you will be an integral part of ensuring we are creating
  intuitive and innovative products that our users need for
  success in their day to day.



  About our team

  We believe every engineer at Vetcove should have a holistic
  view of Vetcove and work on many areas of our technology
  stack. We encourage you to apply to help us grow a system
  that facilitates billions of dollars in orders each year. We
  move lightning-fast in an industry that was previously slow
  to adopt technology. As Vetcove quickly expands its
  offerings to better serve veterinary groups and its supply
  chain partners, we’re quickly growing our engineering team
  to keep pace with the rapid expansion of our business, while
  maintaining exceptional code quality and system integrity.
  You’ll have an opportunity to work closely with end users,
  handle large scale infrastructure challenges, and everything
  in between. We operate in a fully remote environment, giving
  you the flexibility to do your best work while staying
  deeply connected to a fast moving, highly collaborative
  team!



  Some projects we've worked on recently

  - A real time analytics platform to display billions of
    dollars in purchase history
  - A dynamic advertising platform that gives away millions of
    dollars in cash back rewards to clinics
  - A mobile shopping experience that lets clinic shop using
    their phone’s camera
  - Laid the foundation for a new, modern architecture to
    support seamless interactivity between several major
    features



  What you'll do

  - Contribute to the conceptualization and feature
    documentation of new ideas and product enhancements
  - Build and extend interactive React applications that will be
    used by tens of thousands of veterinary purchasers,
    corporate hospital groups owners, and animal health
    manufacturers
  - Add good test coverage
  - Building reusable components for use by the larger team
  - Implement new features into our React Native applications
  - Work directly with our CTO and engineering team, as well as
    across other functions to continuously evolve our platform
    and products
  - Work in a fully remote environment



  What you should have

  - 2 years of professional software engineering experience,
    (preferably building web applications)
  - Bachelor's Degree required, ideally in Computer Science
  - High proficiency over at least one industry-common language
    and be conversant (and interested to improve!) in others
  - Experience in building a professionally successful
    production application in a modern web framework
  - Ability to design new features around data models with
    accuracy, security, and performance in mind
  - Experience working with a database and analyzing queries for
    improved optimizations
  - Fluency with JavaScript’s features as a prototyped and
    functional language
  - Good software testing habits
  - Excellent written and verbal communication skills
  - Ability to adapt quickly and manage many concurrent
    responsibilities
  - A strong desire to help our customers succeed
  - A positive attitude and one-for-all team mentality
  - Experience working with a backend language, an ORM, and
    writing API endpoints
  - Startup work experience is a plus
  - Comfortable working in a remote environment



  Tools we use

  - Backend: Python (Django, Django Rest Framework)
  - Frontend: JavaScript (React, Redux), Less.js, Typescript,
    Webpack
  - Datastores: Postgres, Elasticsearch, Redis
  - Mobile: React Native
  - Version Control: Git



  Benefits (Full Time Roles)

  - 100% remote within the USA
  - Medical, Dental, and Vision Insurance
  - Automatic 401k contribution
  - Employee referral program
  - At home office set up
  - Bi-annual company retreats
  - Open vacation policy
  - Equity
  - Monthly team events



  The typical base pay range for this role across the U.S. is:
  $115,000/year - $180,000/year + bonus + equity + benefits.
  There is a different range applicable to specific work
  locations. For Colorado, the salary range is: $130,000 -
  $170,000 + bonus + equity + benefits. This salary range is a
  good faith estimate of what Vetcove may pay for this
  position at the time of posting. Actual compensation may
  vary based on skills, qualifications, and experience. The
  range reflects the base hourly rate or annual compensation
  (as applicable), and does not include bonus, equity or other
  incentives.

  In addition to base compensation, Vetcove offers a
  comprehensive benefits package. Please refer to the
  “Benefits (Full Time Roles)” section above for more details.



  To apply, please submit your application through Vetcove’s
  Careers Page. The application deadline is accepted on an on
  going basis.

  Please note we are unable to sponsor work visas at this
  time.

