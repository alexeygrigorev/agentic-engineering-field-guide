title: Software Developer - Swaps Platform (Corporate Actions)
company: Jefferies
location: New York, USA
work_type: FULL_TIME
company_size: 6,435 Employees
description: |
  We are seeking a Senior Software Engineer with strong
  experience in swaps technology and corporate actions
  processing to design, develop, and support critical trading
  and post-trade systems within a financial services
  environment.



  This role will focus on building scalable, high-performance
  applications across the swaps trade lifecycle and corporate
  actions workflows, including trade capture, booking,
  validation, lifecycle events, settlements, reconciliations,
  dividends, coupons, stock splits, mergers, conversions, and
  other event-driven processing. The engineer will work
  closely with trading, operations, risk, finance, and
  technology teams to deliver reliable solutions for
  derivatives and post-trade platforms.



  Responsibilities

  - Design, develop, and maintain applications supporting swaps
    trade lifecycle and corporate actions processing.
  - Build high-quality software using Java and/or C++.
  - Partner with business and technology stakeholders to gather
    requirements and deliver solutions.
  - Support and enhance systems for OTC derivatives, swaps
    products, and event-driven post-trade workflows.
  - Troubleshoot production issues and implement long-term
    improvements.
  - Contribute to architecture, code reviews, testing, and
    engineering best practices.



  Qualifications

  - Bachelor’s degree in Computer Science, Engineering, Finance,
    Mathematics, or a related field.
  - Senior-level software engineering experience in financial
    services.
  - Strong hands-on development experience with Java and/or C++.
  - Experience with swaps, OTC derivatives, trade lifecycle
    systems, or corporate actions platforms.
  - Understanding of corporate actions events such as dividends,
    coupons, stock splits, mergers, conversions, spin-offs, or
    reorganizations.
  - Strong knowledge of SQL, distributed systems, and object-
    oriented design.
  - Excellent analytical, problem-solving, and communication
    skills.



  Preferred Experience

  - Knowledge of swaps lifecycle events, settlements,
    reconciliations, confirmations, collateral, margin, or
    regulatory reporting.
  - Experience with corporate actions data, entitlement
    calculations, event processing, or downstream booking
    workflows.
  - Experience with Kafka, MQ, REST APIs, microservices, or
    event-driven architecture.
  - Familiarity with Dodd-Frank, EMIR, MiFID II, CFTC reporting,
    or other regulatory requirements.

  Primary Location Full Time Salary Range of $175,000 -
  $200,000

