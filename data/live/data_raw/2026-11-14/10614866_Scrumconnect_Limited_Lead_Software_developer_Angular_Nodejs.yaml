description: |
  Full Stack Developer (Node.js/Angular/AWS)

  About Scrumconnect Consulting

  Scrumconnect Consulting is a leading digital transformation
  consultancy delivering innovative technology solutions
  across the public and private sectors. We specialise in
  designing and building scalable digital services, cloud-
  native platforms, and user-centred applications that enable
  organisations to modernise and improve service delivery.

  Our multidisciplinary teams work across engineering,
  product, delivery, and design to deliver impactful digital
  solutions using modern technologies and Agile methodologies.
  We foster a culture of continuous learning, collaboration,
  and technical excellence, giving our people the opportunity
  to work on large-scale transformation programmes that make a
  real difference.

  The Role

  We're looking for experienced Full Stack Developers to join
  our growing engineering team.

  You'll help design, build, and deliver modern cloud-native
  applications across a range of enterprise-scale digital
  transformation projects. Working within Agile delivery
  teams, you'll contribute across the full software
  development life cycle, developing secure Back End services,
  modern Front End applications, and automated deployment
  pipelines.

  We're particularly interested in experienced Node.js
  developers with strong JavaScript/TypeScript skills and
  exposure to cloud-native development.

  Responsibilities

  - Design, develop and maintain scalable full-stack
    applications
  - Build secure, high-performance RESTful APIs using Node.js
    and Express
  - Develop responsive Front End applications using Angular and
    TypeScript
  - Write clean, maintainable and well-tested code using modern
    engineering practices
  - Build and maintain automated tests using Jest
  - Contribute to CI/CD pipelines using GitLab CI/CD
  - Support cloud-native deployments using AWS and container
    technologies
  - Participate in architecture discussions, code reviews and
    technical design sessions
  - Work collaboratively with Product Owners, Designers, QA
    Engineers and DevOps teams
  - Troubleshoot, optimise and improve application performance,
    scalability and reliability

  Essential Skills

  - Strong commercial experience developing applications with
    Node.js
  - Excellent JavaScript and TypeScript knowledge
  - Experience building REST APIs using Express.js
  - Commercial Angular development experience
  - Experience writing automated tests using Jest
  - Experience using GitLab CI/CD
  - Understanding of Agile software delivery
  - Experience working with Git

  Desirable Skills

  Experience with some of the following technologies would be
  advantageous:

  AWS & Cloud

  - AWS Lambda
  - API Gateway
  - SQS
  - S3
  - KMS
  - CloudWatch
  - X-Ray
  - ECS/Fargate
  - ECR
  - EKS

  Infrastructure & DevOps

  - Terraform
  - Docker
  - Kubernetes
  - Kong Enterprise Gateway

  Databases

  - MongoDB
  - Amazon DocumentDB

  Messaging & Monitoring

  - Kafka
  - Confluent Schema Registry
  - Dynatrace

  Other

  - Serverless architectures
  - Monorepo development
  - Nunjucks

  What We're Looking For

  We're interested in developers who:

  - Enjoy solving complex technical problems
  - Write clean, maintainable code
  - Have a collaborative mindset
  - Are comfortable working within multidisciplinary Agile teams
  - Take ownership of delivering high-quality software
  - Have experience building secure, scalable enterprise
    applications

  Nice to Have

  - Experience working on UK Government or other highly
    regulated programmes
  - Active SC Clearance or eligibility to obtain SC Clearance

  Why Join Scrumconnect?

  You'll have the opportunity to:

  - Work on high-profile digital transformation programmes
  - Build modern cloud-native applications using the latest
    technologies
  - Collaborate with experienced engineers across multiple
    disciplines
  - Learn through continuous professional development
  - Progress your career within a growing consultancy
  - Work in a supportive, inclusive and collaborative
    environment

  Diversity & Inclusion

  At Scrumconnect Consulting, we're committed to creating an
  inclusive workplace where everyone feels valued, respected
  and empowered to succeed.

  We welcome applications from people of all backgrounds,
  experiences and perspectives. We believe diverse teams
  create better ideas, stronger products and better outcomes
  for our clients and communities.
