  Pay ranges at Yext are established based on an analysis of
  salaries for positions with a similar level of
  accountability and impact in the relevant labor market.
  Salary levels are expected to change to reflect an
  employee’s job performance (results and impact) over time.
  Salaries at the time of hire are typically offered in the
  lower to middle of the above-referenced range in order to
  provide the opportunity to reflect performance-based
  increases over time. In addition to base salaries, employees
  at Yext are typically eligible for a comprehensive package
  of benefits including medical, dental and vision benefits;
  life insurance; short term and long-term disability; 401(k)
  retirement plan; and vacation and sick leave. Successful
  candidates may also be eligible for variable pay programs
  based on performance relative to goals and targets.

  Annual Base Pay Range

  $148,500—$303,500 USD

  Yext is an equal opportunity employer committed to building
  a results-driven, engaging culture where every employee has
  the opportunity to contribute to the success of the Company,
  perform at the highest possible level, and grow their skills
  and capabilities. Yext welcomes employees and applicants of
  all backgrounds and demographics, and does not engage in
  discrimination on the basis of any protected characteristic
  recognized under applicable law. We also consider qualified
  applicants regardless of criminal histories, consistent with
  legal requirements. The Company believes a broad variety of
  life experiences across the Yext team is critical to its
  mission to help every business in the world be visible
  everywhere customers search. By seeking out fresh
  perspectives and fostering a positive interview experience
  and employee experience, Yext can remain at the forefront of
  innovation, and better serve its customers.

  It is Yext’s policy to provide reasonable accommodations to
  people with disabilities as required by applicable law. If
