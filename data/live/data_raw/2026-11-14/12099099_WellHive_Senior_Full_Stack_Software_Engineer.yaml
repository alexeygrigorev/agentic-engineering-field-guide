description: |
  About Us

  WellHive is a fast-growing organization focused on
  transforming the way health systems coordinate and deliver
  care through secure, modern technology. Our teams leverage
  the latest in cloud-based tools and services to design and
  build complex and compelling applications. Every employee is
  treated as a valued contributor that brings their own unique
  experience and perspective to the issues we are solving for
  our users. WellHive proudly offers competitive pay and
  benefits in addition to flexible working conditions.


  Role Summary Because of our growth, we are seeking a Senior
  Full Stack Software Engineer to join the team. In this role,
  you will be instrumental in architecting, developing, and
  deploying robust solutions for our healthcare platform.
  After in person identity proofing and a brief onboarding,
  this is a remote position offering significant autonomy
  while closely collaborating with your agile scrum team and
  cross-functional partners.

  A successful candidate will help the team drive best coding
  and testing practices across the full stack, playing a
  pivotal role in elevating our team's coding standards. We
  are seeking an individual who can champion and implement
  best practices across both our frontend and backend
  development, writing robust, scalable, and maintainable
  code, and who is comfortable incorporating AI coding tools
  into their day-to-day workflow to move faster without
  sacrificing quality. This includes helping define and
  implement best practices for automated testing, including
  unit, integration, and end-to-end testing.

  This role requires not only a strong technical background
  but also a passion for mentorship and a commitment to
  fostering a culture of continuous improvement within the
  engineering team. It is critical to be able to show examples
  and discuss improvements in code design within complex,
  real-world systems.

  Do you thrive on tackling the complexities of building
  scalable systems? Are you passionate about solving
  challenging real world problems within large-scale
  healthcare environments? Do you value writing clean, well-
  architected, and maintainable code within an agile
  framework? If so, we encourage you to apply.


  Required Qualifications

  - Minimum of 5 years of professional software development
    experience.
  - Proficiency with modern software development practices
    across the full stack; this role will largely use Go and
    TypeScript, though prior proficiency in other programming
    languages is welcome.
  - Strong knowledge of testing frameworks and a firm belief in
    leveraging automation to write unit, integration, and end-
    to-end tests to ensure software quality.
  - Experience mapping together multiple API results into easy
    to understand and maintain design patterns.
  - Comfortable using AI coding assistants (e.g., GitHub
    Copilot, Claude Code) as part of the regular development
    workflow.
  - Demonstrated ability to collaborate effectively within a
    team, provide technical guidance, mentor junior engineers,
    and foster knowledge sharing.
  - Expertise in software engineering best practices and
    familiarity with associated tools, such as Git/GitHub for
    version control, code review processes, static analysis
    tools (e.g., ESLint, SonarQube), and CI/CD pipelines
    (e.g., Jenkins, GitLab CI).
  - Strong understanding of agile methodologies such as Scrum
    and continuous integration/continuous deployment (CI/CD)
    principles.
  - Solid understanding of fundamental software engineering
    principles, including data structures, algorithms,
    software design patterns, testing paradigms, and effective
    debugging of distributed systems.
  - Bachelor's degree in Computer Science, Software Engineering,
    Computer Engineering, or a closely related technical
    field.
  - Successful completion of in-person IAL3 compliant identity
    proofing will be required (you must be able to present the
    necessary identification documents).
  - Willingness and ability to travel for occasional customer or
    onsite company meetings (approximately 1-2 times per
    year).
  - Ability to work remotely within the continental USA from an
    Eastern or Central time zone (excluding New York).
  - Must be a US citizen or permanent resident.

  Preferred Qualifications

  - Practical experience with Angular or another modern frontend
    framework.
  - Strong understanding of Web Services, including RESTful API
    design, integration, and consumption.
  - Experience with cloud platforms, particularly AWS.
  - Familiarity with the Go programming language, paradigms,
    constructs, and idioms.
  - Knowledge of relational databases, whether PostgreSQL or
    other.
  - Familiarity with TypeScript/JavaScript and modern web
    application design patterns.

  Essential Job Functions

  - Collaborate closely with your Scrum team to contribute to
    program increment and sprint planning, providing technical
    insights and estimations.
  - Translate user stories and product requirements into well-
    defined technical designs and implementations.
  - Apply your deep technical knowledge and problem-solving
    skills to address complex challenges within the healthcare
    domain.
  - Develop high-quality, performant, and maintainable code with
    comprehensive unit, integration, and end-to-end test
    coverage.
  - Provide technical leadership through participation in design
    discussions, code reviews, and mentorship of other team
    members.
  - Actively participate in code reviews, design sessions, and
    all agile ceremonies (stand-ups, sprint reviews,
    retrospectives, backlog refinement).
  - Work both independently and collaboratively with cross-
    functional teams to deliver innovative solutions to
    challenging healthcare problems.
  - Mentor and support the technical growth of other engineers
    on the team.
  - Contribute to the continuous improvement of our development
    tools, processes, and architecture.
  - Troubleshoot and resolve technical issues, including
    occasional participation in a daytime on-call rotation (1
    weekday every 3-4 weeks).

  Tech Stack

  As a Senior Full Stack Engineer, you will be working within
  an ecosystem that includes: a modern UI built with Angular,
  TypeScript, and leveraging RxJS/NGXS for state management.
  Our backend services are primarily Golang applications
  running on Amazon Linux ECS/Fargate, with data persistence
  in PostgreSQL/Redshift. Data analytics pipelines utilize
  Python/Glue. Our infrastructure is managed as code using
  Pulumi, and our CI/CD pipeline is orchestrated with Jenkins.
  We use Git/GitHub for version control and Jira for agile
  project management. Our engineers also make use of AI coding
  tools (e.g., GitHub Copilot, Claude Code) to accelerate
  development and improve code quality.
