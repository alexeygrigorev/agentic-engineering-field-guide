description: |
  Join Grifin and Revolutionize How People Invest

  Grifin is a first-of-its-kind investing platform that brings
  investing into everyday life. Fresh off our Series A
  fundraise and backed by top-tier investors, we’re scaling
  rapidly to bring effortless, personalized investing to
  millions. Our mobile app automatically helps users invest in
  the companies where they shop - whether they’re grabbing
  coffee at Starbucks or paying for their Netflix
  subscription. By making investing simple, human, and fun,
  Grifin empowers people to build healthy financial habits
  over time. With customization options and a seamless user
  experience, we’re on a mission to make investing more
  accessible to everyone.

  Our Users Love Us

  Since our public launch in 2021, we've helped hundreds of
  thousands of people invest using our proprietary Stock Where
  You Shop™ technology. With over 1 million downloads and
  thousands of five-star reviews, our app is resonating with
  users around the country.

  Your Opportunity - Build Technology that Improves Lives

  As an experienced Full Stack Engineer, you’ll join our lean
  but fast-growing team and contribute to developing key
  product features that will one day be used by millions of
  individuals and families. As an early team member, you’ll
  have amazing opportunities to help shape the culture of the
  engineering organization, drive best practices, and explore
  new ways of solving challenging problems at scale. You’ll
  work closely with product and design to understand the needs
  of our customers and represent their voice in how we
  architect our solutions.

  What Excites Us About You

  - You have 5+ years in professional software engineering
  - You have 3+ years building mobile apps, preferably with
    React Native.
  - You are proficient with MongoDB or similar noSQL databases.
  - You are experienced in ExpressJS for server-side logic.
  - You are familiar with AWS (ECS, EC2, Step Functions, Lambda,
    SQS).
  - You are skilled in building and securing REST APIs.
  - You are able to integrate APIs into mobile applications.
  - You have a passion for mentoring and uplifting the
    engineering team.
  - Previous startup success as a founder or very early stage
    team member. You’ve been a part of a successful
    acquisition or scaled from a Series A to IPO.
  - You’re a yes person - there is always a way to accomplish
    the task at hand. You believe everything is solvable.

  What Motivates You

  - You love a challenge and you don’t just show up for the
    wins. You’re in it for the hard parts too.
  - You’re interested in learning new things and can pick them
    up quickly.
  - You’re a curious, scrappy, highly-motivated innovator
    excited about working in a fast-paced early-stage startup.
  - You’re an avid team player.
  - You’re gritty and persistent.
  - You question everything and believe that innovation comes
    from trying new things.
  - You trust your gut, validate with data, and love operating
    as an owner.

  Our Perks and Benefits

  - Equity ownership with the opportunity to grow stake as we
    scale.
  - Fully remote by design.
  - Company laptop (MacBook Pro).
  - Home office setup allowance.
  - Unlimited PTO.
  - Multiple medical Insurance plans available.
  - Monthly health & wellness allowance.
  - Annual professional development allowance.

  Our Commitment

  Inclusion is one of our core values. We are fully invested
  in hiring and growing a diverse team of high performers.
  We’re committed to creating a positive and connected work
  environment for all. We believe that uniqueness in ideas,
  experiences, and backgrounds makes us a better Grifin. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity or expression, age,
  national origin, protected veteran status, disability
  status, or any other applicable legally protected
  characteristics in the location in which the candidate is
  applying.

  To paraphrase Warren Buffett: when hiring, we look for
  intelligence, initiative, and integrity. But we also seek
  passionate, mission-driven people who are ready to think big
  and move fast. If that sounds like you, even if you don’t
  check every box—we want to hear from you.
