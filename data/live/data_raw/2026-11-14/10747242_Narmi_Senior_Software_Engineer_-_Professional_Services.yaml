description: |
  About Us

  Narmi is how community financial institutions unlock the
  very latest capabilities in digital banking, account
  opening, and lending so they can move faster, tap new growth
  opportunities, and be where banking is going. Since our
  founding, Narmi has enabled the movement of billions of
  dollars and the opening of hundreds of thousands of accounts
  for banks and credit unions across the U.S. The results
  speak for themselves: our customers have grown deposits,
  revenue, and customer satisfaction, with one of the first
  institutions powered by Narmi recognized by Bankrate and
  NerdWallet for delivering the #1 digital banking experience
  in the country.

  About the Forward Deployed Engineering Team

  Forward Deployed Engineering is a small-in-headcount, high-
  impact team of entrepreneurial engineers who work directly
  with Narmi's financial institution customers to build
  features and configure the platform for their specific
  needs. Our mission is to make sure Narmi's products are
  powering the goals and objectives of the FIs we serve. We do
  that by building targeted features and prototypes in the
  field, then partnering with Narmi's core product and
  engineering teams to scale those solutions from 1 to n.

  You'll have real influence on how development work gets
  scoped, how FDE best practices evolve, and what feedback
  reaches core engineering about the configurability of the
  platform. Being a self-starter with strong intuition for
  where impact lives and having a creative approach to
  problem-solving is what makes people successful here.

  We believe the best work happens when great people build
  together in the same room, so we're an in-person–first team,
  typically working from Narmi's Flatiron office about three
  days per week with flexibility to work remotely when needed.

  What you'll do

  - Solve novel technical challenges alongside our customers:
    work with FIs to understand their unique use cases and
    technical constraints, then design and implement creative
    solutions within our platform.
  - Build new platform functionality: you're an extension of
    Narmi's platform engineering team and will contribute
    alongside the dedicated pod to broader platform
    development work.
  - Identify product gaps through your customer interactions,
    and build features and prototypes that extend our existing
    APIs to better meet client needs.
  - Build the v0 when a problem needs solving quickly, then work
    with the rest of engineering to re-architect it over time
    to optimize for scale.
  - Automate recurrent FI workflows and create scalable systems
    and tools that address customer pain points at the root.
  - Take the lead on working with FIs to identify solutions to
    problems for the Platform team.
  - Partner with Customer Success, Implementations, Product, and
    Engineering to build internal tools and automations that
    streamline their workflows.

  What you'll bring

  - 4+ years of relevant, post-college professional experience
  - Strong engineering background in Computer Science,
    Mathematics, or another engineering or scientific
    discipline
  - Strong coder with demonstrated proficiency in one or more of
    the following: Python (especially Django or DRF),
    JavaScript (specifically NodeJS), React
  - Ability to develop creative solutions to a wide variety of
    technical challenges and learn new subject matter quickly
  - Capable of explaining complex technical concepts with
    clarity and simplicity, whether to an engineer or an
    executive
  - Passion for understanding customer problems and quickly
    delivering scalable solutions
  - Eagerness to solve problems, build from the ground up, and
    engage with all areas of the organization
  - Curiosity about the different functions at a startup, from
    customer engagement to product development and partner
    integrations
  - Based in New York City or willing to relocate; comfortable
    with occasional client travel
  - Authorized to work in the United States

  Nice to have

  - Familiarity with financial services, core banking systems
    (Symitar, COCC DNA, IBS, Finastra, Corelation), or fintech
    compliance workflows
  - Hands-on experience building with LLMs and agentic systems
  - Experience with cloud infrastructure (AWS preferred),
    including serverless and IaC
  - Background in forward deployed, implementation, or other
    customer-facing engineering roles

  Compensation

  The base pay range for this role is $167,000 – $196,000 per
  year.

  At Narmi, how we work is just as important as what we build.
  We call this The Narmi Standard:

  - High Ceiling: You go beyond the obvious, take initiative,
    and hold yourself to high standards with care.
  - Low Ego: You put the mission above ourselves, share credit
    freely, and lead with curiosity.
  - Alignment to Mission: You believe that helping community
    financial institutions win against Mega Banks and FinTechs
    is a worthy endeavor, and will use that belief as a
    northstar to anchor your efforts to that goal.
  - High Commitment: You follow through, roll up your sleeves,
    and keep the bar high for yourself and others.

  We believe that high-performing teams include people from
  different backgrounds and experiences who can challenge each
  other's assumptions with fresh perspectives. To that end, we
  actively seek a diverse pool of applicants, including those
  from historically marginalized groups.

  Please note that all correspondence related to this role
  will come directly from Narmi (email addresses ending in
  @narmi.com or @narmitech.com), and not from a third party.
  If you receive correspondence from an individual claiming to
  represent Narmi please let us know immediately at
  security@narmi.com
