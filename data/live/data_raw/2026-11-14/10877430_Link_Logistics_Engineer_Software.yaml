description: |
  Link Logistics Real Estate (“Link”) is a leading operator of
  warehouses and business parks, specializing in last-mile
  logistics real estate. Established by Blackstone in 2019,
  the company connects consumption, technology, and the supply
  chain across its portfolio, which spans half a billion
  square feet. We leverage our scale, proprietary data and
  insights, and foundational focus on sustainability to drive
  success for our customers’ businesses and deliver value for
  our stakeholders. We put our people, customers, and
  communities first and find ways to make a conscious,
  positive impact where we live and work. Every day, we work
  to reinvent and lead our industry forward by thinking bigger
  and challenging the status quo.

  As a Software Engineer, you will drive software development
  for this analytics platform, ensuring it delivers high-
  quality, data-driven insights to internal stakeholders.
  You’ll work closely with product managers, data scientists,
  and business leaders to translate complex requirements into
  intuitive, scalable solutions that enhance Link’s
  competitive edge.

  Role Overview

  As a Full Stack Software Engineer, you will be both a player
  and a coach. You’ll write significant portions of code
  yourself—leveraging AI-assisted coding tools—while also
  guiding and managing contractors and interns to deliver
  high-quality solutions.

  You will design and build end-to-end applications, from
  intuitive front-end interfaces to robust back-end services,
  integrating advanced analytics and machine learning outputs.
  This role demands strong technical expertise across the
  stack, cloud technologies, and modern development practices,
  as well as leadership skills to mentor and coordinate
  resources in a dynamic environment.

  Key Responsibilities

  - Develop full-stack applications that deliver advanced
    analytics and ML insights to end users.

  - Build responsive, user-friendly interfaces using modern
    front-end frameworks (React, Angular, or similar).

  - Design and implement scalable back-end services and APIs in
    Python or Node.js.

  - Integrate applications with data pipelines, ML models, and
    visualization components.

  - Write production-quality code leveraging AI-assisted coding
    tools to accelerate development.

  - Act as a technical lead for contractors and interns,
    providing guidance, code reviews, and ensuring alignment
    with project goals.

  - Ensure applications are performant, secure, and scalable
    across cloud environments (Azure preferred).

  - Contribute to architectural decisions and advocate for best
    practices in full-stack engineering.

  - Communicate effectively with technical and non-technical
    stakeholders.

  Tech Stack

  - Front-End: React, TypeScript, HTML/CSS, responsive design
    principles

  - Back-End: Python (preferred), Node.js, RESTful APIs

  - Data & Integration: SQL, Databricks/Spark for distributed
    processing

  - Prototyping: Streamlit for rapid internal dashboards

  - Cloud & Infrastructure: Azure, CI/CD pipelines, Docker,
    Kubernetes

  - AI/ML Integration: TensorFlow, Scikit-learn, MLOps practices

  - Visualization: D3.js or similar libraries for interactive
    data visualizations

  - Tools: AI-assisted coding platforms (e.g., Cursor)

  Qualifications

  - 10+ years of experience in full-stack application
    development.

  - Strong proficiency in JavaScript/TypeScript, HTML/CSS, and
    responsive design principles.

  - Experience building and integrating back-end services and
    APIs.

  - Familiarity with AI-assisted coding tools and modern
    development workflows.

  - Exposure to cloud platforms (Azure preferred) and CI/CD
    practices.

  - Strong problem-solving and collaboration skills; ability to
    thrive in fast-paced, ambiguous environments.

  - Excellent verbal and written communication skills.

  Preferred Skills:

  - Experience with data visualization libraries (D3.js, Plotly,
    etc.).

  - Knowledge of containerization (Docker, Kubernetes).

  - Understanding of ML concepts and ability to work with data
    science outputs.

  - Prior experience mentoring junior developers or managing
    contractors.

  $185,000 - $245,000 represents the presently anticipated
  base compensation pay range for this position at Link.
  Actual pay may vary based on various factors, including but
  not limited to location and experience.

  Link provides a variety of benefits to employees, including
  health insurance coverage, retirement savings plan, paid
  holidays, paid time off.

  The direct compensation and benefits described above are
  subject to the terms and conditions of any governing plans,
  policies, practices, agreements, or other materials or
  documents as in effect from time to time, including but not
  limited to terms and conditions regarding eligibility.

