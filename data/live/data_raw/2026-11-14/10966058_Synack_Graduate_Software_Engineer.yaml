description: |
  NetSPI+Synack is a leader in offensive security, combining
  elite human expertise with agentic AI to help organizations
  identify, validate, prioritize, and remediate exploitable
  risk across their entire attack surface. Its platform
  delivers expert-validated testing in depth, continuously, or
  on demand, from pre-production code to live production
  environments, so security teams can separate vulnerability
  noise from real risk, including the growing threat of AI-
  driven attacks. With global reach and more than 13 million
  hours of real-world offensive testing experience,
  NetSPI+Synack serves many of the world's largest enterprises
  and government organizations with one ambition: nothing left
  to exploit.  We are looking for individuals with a
  collaborative, innovative, and customer-first mindset to
  join our team. Learn more about our award-winning workplace
  culture and get to know our A-Team at www.netspi.com/careers
  and www.synack.com/careers.

  We are looking for a Graduate Software Engineer (AI), where
  you'll take a hands-on lead in designing and building
  cutting-edge, AI-centric systems tailored for the offensive
  security sector. You will directly drive product innovation
  at the intersection of AI and cybersecurity.

  Sounds interesting? Keep reading...

  Here’s what you'll do

  - Design, implement and deliver scalable AI-centric software
    systems
  - Help to drive the development of agentic AI capabilities for
    identifying vulnerabilities, automating penetration
    testing processes, workflow optimization and enhancing
    threat intelligence.
  - Own and drive the end-to-end development of product features
    from ideation to production deployment and monitoring.
  - Actively contribute to and drive the design and
    implementation of AI-enabled systems, promoting effective
    SDLC processes.
  - Be involved in technical discussions, code reviews and
    design sessions, sharing your expertise to uplift the
    team's capabilities.
  - Collaborate closely with cross-functional teams to integrate
    AI capabilities into broader systems and applications.

  Here’s what you’ll need

  - A degree in a computing/technology discipline.
  - ~1yr of work/internship experience relevant to this role.
  - 3yrs hands-on experience with Python/Go
  - Some experience with AI technologies, e.g. LLMs, RAG, MCP,
    etc.
  - Some grasp of token usage optimisation and LLM cost
    optimisation techniques.
  - Strong experience and understanding of microservices, REST
    API design, gRPC, writing unit testing, BDD testing.
  - Strong design skills required – UML is a bonus; exposure to
    Domain Driven Design desirable.
  - Some experience with asynchronous messaging technologies
    such as Google PubSub, Kafka.
  - In depth knowledge of NoSQL and RDBMS technologies.
  - Strong experience with Docker, Kubernetes, Cloud
    Environments (GCP preferred).
  - Experience working on agile teams.
  - Excellent communication and collaboration skills in all
    mediums.
  - Experience working on and scaling a microservice-based
    application.
  - A proven ability to thrive in a collaborative environment
    involving different stakeholders and subject matter
    experts.

  Ready to join us?

  Synack is committed to embracing diversity. Our people are
  our strength.  Each addition to our team is an opportunity
  to grow and diversify our ideas, experiences, and
  viewpoints. Synack strives to be inclusive of all people.

  As a candidate, Synack cares about your privacy. Please view
  our candidate privacy policy.

  This position has responsibility to ensure Synack’s security
  and privacy posture is maintained.

