  as well as geographic location and business and contract
  considerations. Depending on the position, employees may be
  eligible for overtime, shift differential, and a
  discretionary bonus in addition to base pay. Benefits
  Statement

  Peraton offers eligible employees a variety of benefits
  including medical, dental, vision, life, health savings
