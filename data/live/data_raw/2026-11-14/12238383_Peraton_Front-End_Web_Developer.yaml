description: |
  Peraton Overview

  Peraton is a next-generation national security company that
  drives missions of consequence spanning the globe and
  extending to the farthest reaches of the galaxy. As the
  world’s leading mission capability integrator and
  transformative enterprise IT provider, we deliver trusted,
  highly differentiated solutions and technologies to protect
  our nation and allies. Peraton operates at the critical
  nexus between traditional and nontraditional threats across
  all domains: land, sea, space, air, and cyberspace. The
  company serves as a valued partner to essential government
  agencies and supports every branch of the U.S. armed forces.
  Each day, our employees do the can’t be done by solving the
  most daunting challenges facing our customers. Visit
  peraton.com to learn how we’re keeping people around the
  world safe and secure.

  Responsibilities

  Peraton is seeking a Front‑End Web Developer to join our
  growing team supporting mission‑critical applications for
  government customers. In this role, you will design, build,
  and maintain intuitive, accessible, and highly performant
  user interfaces using modern JavaScript frameworks and U.S.
  Web Design System (USWDS) components. You will collaborate
  closely with data scientist, UX designers, and product
  owners to deliver user‑centered solutions.

  Responsibilities:

  - Develop responsive, accessible front‑end applications using
    React, Node.js, and USWDS components
  - Implement custom reusable UI components and front‑end
    architecture patterns that support scalability and
    maintainability
  - Build modular interface components and client-side logic
    using modern JavaScript and patterns
  - Integrate front‑end interfaces with RESTful APIs and back-
    end services
  - Optimize build and bundling modern web projects using tools
    like Vite
  - Support deployment and runtime behavior in containerized
    environments using Nginx for static hosting or reverse
    proxying
  - Ensure compliance with accessibility standards (WCAG) and
    government usability guidelines.
  - Troubleshoot UI defects, performance issues, and
    cross‑browser inconsistencies.
  - Collaborate with DevOps, DataOps, and cloud engineers to
    support deployment and operational readiness.

  Qualifications

  Required Qualifications:

  - 5 years with BS/BA; 3 years with MS/MA; 0 years with PhD or
    9 years and High School diploma in lieu of degree
  - Professional experience building front‑end applications
    using:
  - Strong understanding of HTML5, CSS3, modular CSS, responsive
    design, and JavaScript ES6+.
  - Experience integrating front‑end components with API
    services.
  - Experience working in Agile environments using Git‑based
    version control.
  - Ability to work collaboratively in a distributed team
    environment.
  - Ability to obtain and maintain a Public Trust clearance.
  - US Citizenship is required.

  Desired Qualifications:

  - Experience with Snowflake (queries, stored procedures, or
    SQL API concepts).
  - Familiarity with AWS services (Lambda, API Gateway, S3, EKS,
    ECR, etc.).
  - Experience using the AWS SDK within Node.js or front‑end
    applications.
  - Database experience using SQL (PostgreSQL or similar).
  - Knowledge of CI/CD pipelines and automated testing
    frameworks

  Target Salary Range$104,000 - $166,000. This represents the
  typical salary range for this position. Salary is determined
