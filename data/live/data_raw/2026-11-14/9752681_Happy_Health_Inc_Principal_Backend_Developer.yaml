description: |
  About Happy Health

  Happy Health is revolutionizing sleep medicine delivery
  through our comprehensive telehealth platform. We've
  eliminated the traditional barriers to sleep care – no more
  waiting months for appointments or spending uncomfortable
  nights in sleep labs. Our patients receive FDA-cleared home
  sleep testing via Happy Ring, connect with board-certified
  sleep specialists, and when required, begin evidence-based
  treatment within just 5 days. Ongoing physiological data
  monitoring with the Happy Ring enables real-time condition
  management, combination therapies, and drives measurable
  outcomes.

  Happy Ring represents the future of sleep diagnostics: an
  FDA-cleared medical device integrating advanced biometric
  sensors with AI-powered analysis to deliver highly accurate
  diagnostics and longitudinal management at home. For sleep
  medicine physicians, this means you'll have access to high-
  quality diagnostic data that empowers you to make confident
  clinical decisions for your patients, and integrate
  multimodal treatments that focus on root-cause solutions.



  Overview

  This position on the software team has direct ownership of
  and responsibility for the architecture, scalability,
  reliability, security, and long-term evolution of our
  backend infrastructure.

  As part of the software team behind the Happy Health
  product, you will help ensure that the integrated services
  and systems instrumental to the customer-facing experience
  (e.g. CRM, EHR, eComm, 3PL, etc.) are designed and operated
  to scale reliably. You will also help lead the design and
  implementation of internal tools used by technical and non-
  technical leaders and teams across the company. In addition
  to a primary role in hands-on engineering, this role will
  provide technical leadership across backend architecture,
  integration strategy, engineering standards, and platform
  decision-making.

  Key Responsibilities

  Required Qualifications

  - 8+ years of experience in backend software development
  - 5+ years of experience in Python
  - 5+ years of experience building and operating production
    systems in AWS
  - Demonstrated experience designing scalable APIs, cloud
    infrastructure, and continuous integration workflows.
  - Strong experience making technical tradeoffs across
    performance, reliability, security, and speed of execution
  - Proven ability to lead technical design and influence
    engineering direction across multiple systems or teams

  Preferred Qualifications

  Collaboration

