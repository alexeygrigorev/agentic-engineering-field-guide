description: |
  Are you passionate about making a difference in people's
  lives? Do you enjoy working in a service-oriented industry?
  If so, this opportunity may be the right fit for you!

  We are seeking a highly experienced Software Engineer IV to
  serve as a senior technical leader responsible for
  architecting and delivering complex, distributed systems
  while contributing to adoption of AI-assisted development
  tools and processes. This role combines deep expertise in
  system design with the ability to leverage modern AI-powered
  development tools to improve engineering productivity, code
  quality, and delivery speed. The ideal candidate will shape
  both system architecture and how engineering teams
  effectively integrate AI into their daily workflows.

  This role…

  System Architecture & Design Leadership

  - Lead the architecture and design of complex, distributed
    systems
  - Define scalable, resilient, and secure architectures aligned
    with long-term business objectives
  - Design APIs, microservices, and event-driven systems using
    modern cloud-native patterns in Microsoft Azure
  - Conduct architecture reviews and enforce design standards
    and best practices
  - Identify and mitigate technical risks, bottlenecks, and
    scalability constraints

  Software Development & AI Adoption

  - Design and implement high-quality, performant, and
    maintainable systems
  - Lead delivery of complex initiatives spanning multiple
    services and teams
  - Develop resilient solutions leveraging cloud-native
    capabilities (e.g., Azure App Services, Cosmos DB)
  - Solving highly complex technical problems requiring deep
    expertise and innovation
  - Drive adoption of AI-assisted software development tools
    (e.g., Codex, Spec-Kit, MCP servers) while maintaining
    code quality and security
  - Stay current on emerging trends in AI-assisted development,
    cloud-native architectures, and engineering productivity
    tools
  - Champion a culture of continuous improvement and technical
    excellence

  System Reliability & Operational Excellence

  - Design systems with built-in observability using tools such
    as Azure Application Insights, and Log Analytics
  - Implement monitoring and alerting system health and
    performance
  - Lead performance optimization, capacity planning, and cost
    efficiency improvements
  - Participate in incident response and lead root cause
    analysis

  Leadership & Collaboration

  - Collaborate across engineering, DevOps, QA, and product
    teams to define requirements and deliver projects
  - Partner with engineering leadership to integrate AI
    capabilities into the software development lifecycle
  - Mentor engineers in technical design, development best
    practices and effective use of AI development tools

  We are interested in speaking with individuals with the
  following…

  - Bachelor’s degree in Computer Science, Engineering, or
    related field (or equivalent experience)
  - 8+ years of software engineering experience with strong
    system design expertise
  - Proven experience architecting and delivering complex,
    distributed systems
  - Experience building and operating solutions in Microsoft
    Azure environments
  - Hands-on experience using AI-assisted development tools
    (e.g., Codex, GitHub Copilot or similar)
  - Strong programming skills in one or more languages (e.g.,
    C#, Java, Python, Go, TypeScript)
  - Deep understanding of microservices, APIs, and distributed
    systems
  - Experience with CI/CD pipelines (e.g., Azure DevOps, GitHub
    Actions)

  Preferred Qualifications

  - Experience with rolling out AI-assisted development tools at
    scale within engineering organizations
  - Azure certifications (e.g., Azure Solutions Architect, Azure
    Developer)
  - Experience with Infrastructure as Code (e.g., Pulumi,
    Terraform)
  - Experience working in regulated environments (e.g.
    Healthcare, FinTech)

  Salary: $116,700-$160,400

  This role is bonus eligible based on individual and company
  performance.

  The physical demands described are representative of those
  that must be met by an employee to successfully perform the
  essential functions of the position. Reasonable
  accommodations may be made to enable qualified individuals
  with disabilities to perform the essential functions of the
  job.

  Primarily seated work; extensive computer and telephone use;
  occasional standing, walking, reaching, bending, and lifting
  up to 10 lbs.

  Modivcare’s positions are posted and open for applications
  for a minimum of 5 days. Positions may be posted for a
  maximum of 45 days dependent on the type of role, the number
  of roles, and the number of applications received.  We
  encourage our prospective candidates to submit their
  application(s) expediently so as not to miss out on our
  opportunities. We frequently post new opportunities and
  encourage prospective candidates to check back often for new
  postings.

  We value our team members and realize the importance of
  benefits for you and your family.

  Modivcare offers a comprehensive benefits package to include
  the following:

  - Medical, Dental, and Vision insurance
  - Employer Paid Basic Life Insurance and AD&D
  - Voluntary Life Insurance (Employee/Spouse/Child)
  - Health Care and Dependent Care Flexible Spending Accounts
  - Pre-Tax and Post --Tax Commuter and Parking Benefits
  - 401(k) Retirement Savings Plan with Company Match
  - Paid Time Off
  - Paid Parental Leave
  - Short-Term and Long-Term Disability
  - Tuition Reimbursement
  - Employee Discounts (retail, hotel, food, restaurants, car
    rental and much more!)

