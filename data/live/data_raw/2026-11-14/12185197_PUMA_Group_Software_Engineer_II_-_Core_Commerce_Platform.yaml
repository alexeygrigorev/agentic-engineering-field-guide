description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Core Commerce Platform organisation
  responsible for delivering the omnichannel commerce
  capabilities that power the purchase journey, inventory
  availability, delivery promise, order processing &
  fulfilment and post-purchase experiences across channels.
  The organisation plays a critical role in ensuring products
  are available to buy, orders can be fulfilled reliably, and
  commitments made to consumers are delivered consistently.
  Through a portfolio of commerce platform capabilities, the
  organisation enables seamless omnichannel experiences while
  supporting efficient, scalable, and resilient commerce
  operations across the global digital ecosystem.

  As a Software Engineer, you will build the backend services
  that power Basket, Cart, Pricing, Promotions, and Checkout
  experiences across omni-channel commerce platforms. You will
  be responsible for technical design, development, testing,
  and operational readiness of scalable commerce services.
  Working closely with the Lead Engineer, Engineering Manager,
  and Product teams, you will deliver high-performing,
  resilient, and low-latency services that enable seamless
  real-time customer shopping and checkout journeys.

  What you will do:

  - · Develop and implement omni-channel Basket and Checkout
    services, supporting seamless customer journeys from cart
    creation and basket management through checkout completion
    and order submission.
  - · Develop scalable, production-grade integrations and
    services using modern Java-based microservices within a
    cloud-native commerce architecture.
  - · Implement and optimize shopping cart and checkout
    experiences, including guest checkout, registered customer
    journeys, saved carts, multi-shipment scenarios, and
    click-and-collect capabilities.
  - · Ensure solutions are secure, observable, reliable, and
    resilient through strong engineering practices,
    performance optimization, and operational excellence.
  - · Optimize storefront and checkout performance through
    caching strategies, API optimization, automation, and
    proactive monitoring.
  - · Leverage AI-assisted engineering practices and tools to
    improve engineering productivity, code quality, testing
    effectiveness, and delivery velocity.

  YOUR TALENT

  - 4+ years of software engineering experience with proven
    expertise in digital commerce platforms, storefront
    applications, and customer-facing Basket & Checkout
    capabilities.
  - · Knowledge of omni-channel commerce experiences, including
    Click & Collect (BOPIS), multi-shipment checkout, guest
    checkout, and cross-channel customer journeys, along with
    associated checkout and fulfillment integrations.
  - · Understanding of real-time inventory visibility, product
    availability, reservations, and shipping options to enable
    accurate, seamless checkout experiences.
  - · Strong Java development experience with expertise in
    Spring Boot and microservices architecture for building
    scalable, resilient, and production-grade commerce
    applications.
  - · Strong understanding of performance optimization, catching
    strategies, session management, and scalability
    considerations for high-volume basket and checkout
    functionalities.
  - · Experience with observability, reliability engineering,
    monitoring, distributed tracing, and performance
    optimization in customer-facing commerce platforms.
  - · Experience using coding agents, LLMs, or AI-assisted
    engineering tools to improve software delivery, code
    quality, testing efficiency, and developer productivity.
  - · Working knowledge of SFCC is preferred

