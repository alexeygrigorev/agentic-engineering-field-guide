description: |
  About Freetrade

  Freetrade’s mission is to become the default place to
  invest. Investing has been too complicated and expensive for
  too long, keeping millions from making the most of their
  savings.

  We’re changing that.

  We’re building our team and looking for people who are
  excited to reshape how our customers invest and grow their
  wealth. If you’re driven by solving complex problems and
  building innovative products, you’ll fit right in.

  2026 is a big year for us. Last year, we announced a game
  changing deal to become part of the IG Group. We’ll continue
  to operate as an independent business while gaining access
  to the resources and support of an established leader in the
  space.

  This year, we’re accelerating our roadmap and taking our
  products to the next level. We’re building new features like
  mutual funds, bonds, and family investment tools. We’re also
  exploring how we can leverage AI to deliver an even better
  experience for our customers.

  Freetrade Engineers play a pivotal role in developing and
  maintaining a robust, scalable platform used by thousands
  daily. We tackle big technical challenges, drive innovation,
  and build solutions that make a real impact.

  Here, your code doesn’t just run - it powers the decisions
  of investors across the UK.

  About the role

  We are looking for a Senior Backend Software Engineer to
  play a pivotal role in our engineering team. In this
  position, you'll lead the end-to-end delivery of complex,
  impactful features, showcasing a passion for independent
  problem-solving and a drive to scale our next-generation,
  user-focused product.

  Our philosophy on hiring

  We hire for engineering excellence, not just a specific list
  of keywords. Our interview process is language-agnostic; we
  care about your ability to solve complex problems, design
  scalable systems, and write clean code in whichever language
  you’re most comfortable with.

  Our stack

  Once you join, you’ll be working primarily with TypeScript,
  Node.js, and PostgreSQL on GCP. We don’t expect you to be an
  expert in these on Day 1, but we do look for engineers who
  are excited to master this stack and contribute to its
  evolution.



  What you’ll do

  - Lead features from initial design and development through to
    post-production and validation.
  - Level up the team through technical workshops, pair
    programming, and active mentorship.
  - Define and uphold company-wide standards for code reviews
    and engineering best practices.
  - Act as a senior escalation point for high-priority issues
    and participate in our on-call rotation.
  - Conduct technical interviews to identify and hire top-tier
    engineering talent.
  - Constantly evaluate the tech landscape to improve our
    development processes and tools.

  About you

  - Involve others in design decisions and delegate
    responsibility to help your squad grow.
  - Speak candidly when quality dips and work proactively with
    your team to raise the bar.
  - Stay calm and effective when tackling complex, ambiguous
    technical challenges under pressure.
  - Maintain a deep obsession with the "how" and "why" of the
    systems you build.
  - Bring a genuine interest in the world of investments and
    fintech.
  - Stay current with industry trends to influence better
    internal engineering practices.

  Our interview process

  We keep things simple and transparent. Our process starts
  with an initial conversation with one of our Senior Talent
  Partners, followed by:

  - Hiring Manager interview – A deep dive into your skills and
    experience.
  - Live Coding – Show us how you think and solve problems.
  - System Design – We’ll explore how you design systems to
    handle real-world challenges.
  - Final Values interview – A conversation with our
    stakeholders, where we also assess cultural fit.

  Hybrid working culture We’re operating in a hybrid model:
  3-days in-office / 2-days from home. We believe great
  collaboration happens in person and our office in central
  London, Shoreditch designed to bring people together. 🏢
  Office days: Monday, Tuesday, Thursday 🏡 Work from home
  days: Wednesday, Friday

  Benefits In London:

  - Competitive salary – carefully benchmarked, public range on
    our job post linked to the role
  - Bonus Scheme: join us and share in our growth, bonuses are
    linked to both company success and your individual impact
  - Holidays – 25 days plus UK public holidays, your birthday
    off, plus one extra day for every year at Freetrade
  - Enhanced pension – we’ll match your contributions up to 7%
  - Group Life Insurance – coverage at 5x your salary, ensuring
    financial security in any circumstance
  - Private Health Insurance - includes access to high quality
    medical care, mental health support, dental and vision
    plans, Wellness programs and preventative care initiatives
    are also provided to ensure the wellbeing of your entire
    family
  - Income Protection Cover – safeguard your income with
    comprehensive coverage, ensuring financial stability in
    the event of illness or injury
  - Enhanced parental leave – time off when it matters most
  - Learning & Development – we fund industry qualifications so
    you can grow as a financial services professional
  - Cycle to Work scheme – high quality bike and gear through
    our salary sacrifice scheme, spreading the cost with tax
    free monthly instalments
  - Paid Sick Leave – 10 days of fully paid sick leave each
    calendar year

  We are an Equal Opportunity employer committed to a diverse
  and representative team. Whatever your race, religion,
  colour, national origin, gender, sexual orientation, age,
  marital status, or disability - we want to hear from you.

  To find out more about how we look after your personal data
  when you apply for a job with us, please see our Recruitment
  Privacy Policy here.

  Please note we are not accepting agency CVs.
