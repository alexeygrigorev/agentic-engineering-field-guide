description: |
  At Replicant, we believe AI should work for people, starting
  with customer service. That’s why we built a platform that
  helps contact centers resolve more requests, proactively
  identify issues, and improve agent performance with AI-
  powered conversation intelligence and AI agents that act
  like your best reps.

  Our AI agents handle millions of calls every month for
  Fortune 500 companies and high-growth innovators. From
  processing payments to booking appointments and
  authenticating users, they help customers get what they need
  instantly, 24/7. Meanwhile, our real-time conversation
  insights help contact center leaders coach better and
  improve every interaction.

  We are leading the shift from legacy systems to AI-first
  service, powered by large language models (LLMs) and
  designed for enterprise scale, security, and empathy. If
  you’re excited by the potential of LLMs, voice AI, and
  building category-defining technology with a kind, ambitious
  team, you’ll love it here.

  Joining Replicant means working on technology that makes
  customer service both better and cheaper, for a gigantic
  market of millions of potential customers. We solve huge
  challenges with a small team, so every improvement you will
  ship makes a huge difference.

  We’re looking for a Full Stack Software Engineer to join
  Replicant’s engineering team! As part of our team, you’ll
  design and deliver technology that powers natural, human-
  like conversations at scale, helping companies reduce wait
  times, improve customer satisfaction, and empower
  representatives to focus on complex problems. You’ll build
  rich user experiences and backend services that enable
  customers to design, launch, and monitor these AI-powered
  conversations. You’ll collaborate closely with our product
  and machine learning teams to ensure our customers can build
  compelling and delightful conversations for their callers.
  Our stack includes TypeScript, Node.js, React, and Python in
  Kubernetes on GCP. Please note that the posted compensation
  ranges for US and Canada cover all levels we may hire for
  this role. Final compensation is set at the level determined
  by the interview process.

  What You’ll Do

  - Build new features powering millions of daily conversations
    on Replicant’s core AI voice and chat products
  - Ship full stack end-to-end features with high impact in
    days, not weeks or months
  - Integrate automatic speech recognition, text to speech, and
    conversational AI model improvements into Replicant’s
    products
  - Refractor, optimize, and debug production systems balancing
    latency, cost, and user delight
  - Participate in regular on-call rotations, monitoring live
    production systems
  - Continuously improve systems based on performance metrics
    and customer feedback
  - Shape a fast-moving culture that emphasizes knowledge
    sharing and mentorship across distributed systems, high-
    availability design, and user experience for enterprise-
    scale AI
  - Participate in team and company-wide office events; travel
    required

  What You’ll Bring

  - 5+ years of full-stack software engineering experience,
    ideally in SaaS, AI, or complex real-time systems
  - Proven experience owning and shipping elegant, maintainable,
    continuously improving solutions that scale to millions of
    users
  - History of raising the bar for great engineering in your
    teams, with strong collaboration skills favoring impact
    over process
  - Strong communication skills that build trust with teammates
    and stakeholders
  - Mastery of AI tools for writing, improving, debugging, and
    refactoring large code bases
  - Demonstrated experience designing and implementing quality
    testing for systems you’ve built, including automated,
    manual, and AI
  - Mastery of one or more of the following
    - TypeScript and frontend frameworks (React or similar)
    - Node.Js for production-grade backend systems
    - Python
    - Rust, LLM prompt engineering, Google Cloud Services,
      Kubernetes
  - Familiarity with all of the following
    - Relational databases (MySQL, PostgreSQL)
    - Cloud environments (AWS, GCP, or Azure) and CI/CD pipelines
    - Metrics, logging, and monitoring
  - Enthusiasm for AI, machine learning, telephony

  For all full-time employees, we offer:

  🌴 In-person connection that counts: company-wide offsites
  and smaller team gatherings designed to make remote work
  feel personal

  🖥️ Tech & learning stipend: Conferences, books, courses —
  interested? We’ll fund them

  📍 Remote by design: We’re distributed — no guilt about life
  events, we trust you to manage your calendar

  🏋️ Health & wellness: Flexible vacations, paid sabbatical
  after 5 years, comprehensive benefits, plus a stipend to
  support your physical and mental well-being

  💸 Compensation that matches your impact: competitive
  salaries in the company you’re helping to build

  📈 Equity with upside: We believe in shared ownership—You’ll
  own a real piece of a fast-growing AI company

  Our Values

  Replicant has three core values. It is critical that
  everyone who joins the team feels excited and moved by these
  values as every new team member makes an impact on our
  culture.

  Blade Runners: We take ownership and pride to influence the
  outcomes of our goals. We are successful, and like a Blade
  Runner, use the tools at our disposal to reach our
  objectives. We value open and honest communication and
  proactively seek feedback along the way. We are a company
  driven to grow and achieve both individually and as a team.

  Bread Makers: We are humble and strive toward an egalitarian
  culture. No task is too big or too small. We work together
  to achieve our goals and develop our company mission. We
  believe that the whole is greater than the sum of its parts
  in everything that we do.

  Självdistans (Self-Distance): Självdistans is Swedish for
  self-distance. It's the ability to critically reflect on
  oneself and one's relations from an external perspective.
  With this in mind, we act with objectivity and always
  remember that we are not our work. There's no perfect
  science to growing a team or business, but we trust everyone
  at Replicant to point out our blind spots and humbly admit
  their own.

  Replicant is proud to be an equal opportunity employer. We
  are committed to fostering an inclusive, diverse and
  equitable workplace that is built on trust, support and
  respect. We welcome all individuals and do not discriminate
  on the basis of gender identity and expression, race,
  ethnicity, disability, sexual orientation, colour, religion,
  creed, gender, national origin, age, marital status,
  pregnancy, sex, citizenship, education, languages spoken or
  veteran status. Accommodation is available upon request at
  any point during our recruitment process. If you require an
  accommodation, please speak to your talent acquisition
  partner or email us at talent@replicant.ai and we’ll work to
  meet your needs.
