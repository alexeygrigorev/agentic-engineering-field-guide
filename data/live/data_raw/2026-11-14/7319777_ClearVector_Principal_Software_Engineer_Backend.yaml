description: |
  We're an early-stage company building innovative software
  solutions with a commitment to shipping rock-solid,
  reliable, safe software. We’re searching for someone who
  loves writing code that helps protect customers and
  frustrates the adversary. You’ve written serious software in
  a careful way, and you love scalable systems built right
  with small teams. Read more about us and our mission here.

  Responsibilities

  - Design, architect, and develop features and improvements in
    a secure, well-tested, and performant way

  - Maintain a high bar for quality in a fast-paced, iterative
    environment

  - Work closely with company leadership to guide our entry into
    the market

  - Interact with potential customers and the community to help
    drive adoption

  - Craft code that meets our internal standards for style,
    maintainability, and best practices

  - Maintain and advocate for these standards through code
    review and other cultural practices

  - Regularly demonstrate progress during our weekly internal
    demos

  Top candidates for this role will have:

  - Experience designing and shipping commercially available
    software products at scale that customers love

  - Experience building and shipping self-service B2B SaaS
    products at scale

  - Expert knowledge of at least one major systems programming
    language

  - Ability to learn Typescript or Rust

  - Experience shipping serverless software on AWS or
    distributed systems experience

  - Experience working at a fast-growing startup

  - Be comfortable working remotely, asynchronously, and
    independently

  - Strong time management habits and the ability to have a
    quiet working environment

  - Fluency in technology such as GitHub, AWS, Auth0,
    TypeScript, Rust, GitHub Copilot and Claude

  - At least 12 years of experience

  - Ability to thrive in a fully remote organization

  Additional notes

  - As a remote first company, we are looking to hire anywhere
    in the United States.

  - We hire people authorized to work in the United States. We
    do not sponsor immigration visas.
  - Ability to travel for in-person company planning and events.
