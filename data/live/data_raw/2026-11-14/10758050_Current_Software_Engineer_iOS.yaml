description: |
  SOFTWARE ENGINEER, iOS

  Current is a leading consumer fintech platform transforming
  financial access for everyday Americans with over 6 million
  members. We provide access to financial solutions that
  seamlessly work together to solve the needs of our members
  and enable all Americans to build better financial futures.
  Based in NYC, our results-driven environment drives us to
  build better products, grow faster and empower everyone on
  our team to have an impact on our business and mission to
  improve financial outcomes.

  Our mobile engineers are responsible for building the full
  suite of user experiences for our members, leveraging our
  proprietary backend banking core. The mobile apps are native
  (Kotlin/Swift), built 100% natively with no cross-platform
  frameworks, and primarily use gRPC to interface with our
  backend. Being the primary interface for our members to
  manage their finances (there isn't a web app), the mobile
  experience needs to be highly performant and intuitive to
  use. Our engineers work closely with senior teammates to
  learn the foundational layers of application infrastructure,
  our reusable UI components, and the data that drives product
  decisions. Join us for an opportunity to work in a fast-
  moving environment where your work is highly visible and has
  a direct impact on our members' financial outcomes!

  We are looking for an iOS engineer to join our team in New
  York. This role has a salary range of $150,000 - $200,000.
  The ideal candidate has hands-on experience building and
  shipping native iOS applications and is looking to grow
  their craft on a small, high-ownership team. This person
  should be a motivated self-starter who's comfortable asking
  questions, learning quickly, and working through ambiguity
  in a fast-paced environment.

  WHAT TO EXPECT:

  - Be part of a small and nimble mobile engineering team
    working closely with our product, design, and backend
    engineering teams to ship end-to-end experiences for our
    users
  - Own features from design handoff through launch, with
    support from senior engineers on system design and
    architecture decisions
  - Contribute to and learn our scalable, reusable mobile
    frameworks that improve code consistency and engineering
    velocity
  - Build strong instincts for engineering excellence through
    active participation in code and architecture review
  - Help Current's members build better financial futures
    through products like Paycheck Advance, Build Card, and
    Savings Pods
  - A strong culture of code and architecture review, with real
    mentorship from senior teammates

  ABOUT YOU:

  - Proficient in Swift, with a working knowledge of its
    Concurrency model
  - Understanding of core iOS fundamentals including app states,
    memory management, dependency injection, and persistence
  - Experience building responsive user interfaces in a native
    iOS codebase (UIKit)
  - Comfortable working within a modularized app architecture,
    or eager to learn patterns like MVC, unidirectional data
    flow, and the Coordinator design pattern
  - Have shipped features on apps available on the App Store
  - A genuine interest in the personal finance space!

  BONUS:

  - Experience using SwiftUI and its interfacing with UIKit
  - Experience writing unit and UI tests with XCTest, XCUITest
    and Swift Testing
  - Exposure to Instruments for profiling and optimizing app
    performance
  - Experience using gRPC (Google Remote Procedure Call) and
    Protobuf (Protocol Buffers) schemas for networking
  - Interest in building highly secure iOS apps
  - Experience working on a team building platform components

  BENEFITS:

  - Competitive salary
  - Meaningful equity in the form of stock options
  - 401(k) plan
  - Discretionary performance bonus program
  - Biannual performance reviews
  - Medical, Dental and Vision premiums covered at 100% for you
    and your dependents
  - Flexible time off and paid holidays
  - Generous parental leave policy
  - Commuter benefits
  - Fitness benefits
  - Healthcare and Dependent care FSA benefit
  - Employee Assistance Programs focused on mental health
  - Healthcare advocacy program for all employees
  - Access to mental health apps
  - Team building activities
  - Our modern NYC based office with open floor plan, stocked
    kitchen, and catered lunches
