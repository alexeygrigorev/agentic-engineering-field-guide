description: |
  MyPrize is the fastest growing free-to-play social gaming
  and social markets platform in the world, redefining how
  people play, watch, and connect with one another and with
  gaming and markets online. Pioneering multiplayer
  experiences where users can join forces with creators,
  streamers, and friends, MyPrize provides a platform built
  for shared moments and massive communities.

  MyPrize transcends boundaries, giving players and fans what
  they have been desperately craving: an all-in-one platform
  that combines the best of online gaming, live streaming, and
  social markets, powered by MyPrize's proprietary AI
  personalization engine. With SOC-2 Type 1 certification,
  MyPrize maintains institutional-grade security while
  building the future of online entertainment.

  The Need:

  We're seeking a Senior Software Engineer to work out of our
  NYC office. This is an exciting opportunity to join a fast-
  growing team where you will be focused on owning and
  elevating our end-to-end consumer entertainment platform,
  helping drive measurable growth across departments and the
  MyPrize user journey.

  What you will do at My Technology:

  - Design and implement backend solutions (APIs, workers, and
    integrations with third-party services) to power our
    social casino product.
  - Explain and debate the merits of architecture designs and
    implementation plans with fellow team members to get
    alignment.
  - Work independently without constant oversight in a high-
    trust, high-execution remote environment.
  - Review other team members’ code.
  - Work with frontend engineers to design and build solutions
    that meet their needs.

  What you bring to My Technology:

  - You have 5+ years of experience developing backend software.
  - We are a Typescript shop, but professional experience with
    other modern languages such as Python, Java, Golang, Rust,
    etc. is acceptable if you are willing to learn and work
    with Typescript.
  - Working with SQL databases and writing raw SQL queries to
    efficiently and safely insert and retrieve data.
  - An understanding of the architecture of cloud-based software
    powering consumer apps. This involves the fundamentals of
    networking, caching, HTTP (REST) APIs, common web
    standards like JWTs / cookies / websockets, techniques to
    scale and manage traffic bursts, etc.
  - Comfortable using the terminal and git / Github.
  - Capable of self-learning and picking up new technologies,
    concepts, and skills as needed.

  Gold Stars:

  - Professional experience with Typescript, Postgres, AWS,
    redis, or kubernetes.
  - Experience or interest in cryptocurrency and blockchain
    technology.
  - Experience in gaming, streaming, or social casino
    industries.

  Benefits and Perks:

  - Office in NYC
  - Equity
  - 401K
  - Comprehensive insurance plans: Health, Dental, and Vision
  - Flexible Spending Account
  - Flexible Vacation Policy
