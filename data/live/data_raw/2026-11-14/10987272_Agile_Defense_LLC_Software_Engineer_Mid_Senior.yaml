  Job Description

  - Design, develop, test, and implement software solutions
    aligned with client requirements and organizational
    standards.
  - Optimize existing systems and code bases for performance,
    scalability, and maintainability.
  - Collaborate with cross-functional teams, including product
    managers, designers, and engineers, to deliver robust and
    innovative software solutions.
  - Troubleshoot and resolve technical issues, ensuring minimal
    disruption to operations and user experience.
  - Conduct thorough code reviews and ensure adherence to
    industry best practices and secure coding standards.
  - Contribute to system architecture discussions and recommend
    improvements or enhancements.
  - Stay informed about emerging technologies and trends to
    drive continuous improvement and innovation.
  - Actively participate in Agile methodologies, including
    sprint planning, daily stand-ups, and retrospectives.

  Education & Years of Experience

  - Bachelor’s degree in Computer Science, Software Engineering,
    or a related field (or equivalent work experience).
  - Minimum of 3–5 years of professional experience in software
    engineering.
  - Demonstrated ability to deliver scalable and efficient
    software solutions in a team-oriented environment.

  Required Skills

  - Strong proficiency in programming languages such as Java and
    JavaScript.
  - Hands-on experience with frameworks and tools such as React,
    Angular, Spring Boot, or similar technologies.
  - In-depth knowledge of cloud platforms (e.g., AWS, Azure,
    Google Cloud) and associated tools.
  - Experience with version control systems like Git and CI/CD
    pipelines.
  - Solid understanding of Agile development practices and
    methodologies.
  - Strong problem-solving and analytical skills.
  - Proven experience architecting and delivering production-
    grade applications and RESTful services.
  - Strong proficiency in at least one modern backend language
    and framework (e.g., Java/Spring Boot, Node.js/NestJS) and
    familiarity with frontend frameworks (e.g., React,
    Angular, Vue).
  - Hands-on experience with relational and NoSQL databases,
    data modeling, and performance optimization.
  - Expertise in software security fundamentals: OWASP Top 10,
    secure coding practices, authN/authZ (e.g., OAuth2/JWT),
    and secrets management.
  - Experience with cloud platforms (AWS, Azure, or GCP),
    containers (Docker), and orchestration (Kubernetes).
  - Solid understanding of CI/CD pipelines, automated testing
    (unit, integration, contract), and infrastructure-as-code.
  - Excellent communication skills; able to translate complex
    technical concepts for diverse stakeholders.

  Preferred Skills

  - Familiarity with containerization and orchestration tools
    such as Docker and Kubernetes.
  - Experience working with database systems (SQL and NoSQL).
  - Knowledge of cybersecurity principles and secure coding
    practices.
  - Excellent written and verbal communication skills for
    effective collaboration.
  - Experience with microservices architecture, event-driven
    systems (Kafka/RabbitMQ), and API-first design
    (OpenAPI/Swagger).
  - Knowledge of distributed systems patterns (circuit breakers,
    retries, idempotency) and caching (Redis).
  - Experience with observability stacks (Prometheus/Grafana,
    ELK/Elastic, OpenTelemetry, Jaeger/Zipkin).
  - Familiarity with domain-driven design, clean/hexagonal
    architecture, and design patterns.
  - Background in regulated or high-security environments;
    familiarity with compliance frameworks.
  - Contributions to engineering standards, internal platforms,
    or developer experience initiatives.

  Our Core Values



  Employees of Agile Defense are our number one priority, and
  the importance we place on our culture here is fundamental.
  Our culture is alive and evolving, but it always stays true
  to its roots. Here, you are valued as a family member, and
  we believe that we can accomplish great things together.
  Agile Defense has been highly successful in the past few
  years due to our employees and the culture we create
  together.



  What makes us Agile? We call it the 6Hs, the values that
  define our culture and guide everything we do. Together,
  these values infuse vibrancy, integrity, and a tireless work
  ethic into advancing the most important national security
  and critical civilian missions. It's how we show up every
  day. It's who we are.



  - Happy - Be Infectious. Happiness multiplies and creates a
    positive and connected environment where motivation and
    satisfaction have an outsized effect on everything we do.
  - Helpful - Be Supportive. Being helpful is the foundation of
    teamwork, resulting in a supportive atmosphere where
    collaboration flourishes, and collective success is
    celebrated.
  - Honest - Be Trustworthy. Honesty serves as our compass,
    ensuring transparent communication and ethical conduct,
    essential to who we are and the complex domains we
    support.
  - Humble - Be Grounded. Success is not achieved alone,
    humility ensures a culture of mutual respect, encouraging
    open communication, and a willingness to learn from one
    another and take on any task.
  - Hungry - Be Eager. Our hunger for excellence drives an
    insatiable appetite for innovation and continuous
    improvement, propelling us forward in the face of new and
    unprecedented challenges.
  - Hustle - Be Driven. Hustle is reflected in our relentless
    work ethic, where we are each committed to going above and
    beyond to advance the mission and achieve success.



