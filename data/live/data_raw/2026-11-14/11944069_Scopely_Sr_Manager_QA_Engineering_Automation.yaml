description: |
  Scopely is looking for a Senior QA Manager, Automation &
  Tooling to join our team supporting a soon-to-be-announced
  AAA mobile game title. This role can be remote in the US and
  Canada, or hybrid in Culver City.

  You will lead the automation strategy for a live game,
  building the people, processes, frameworks, and tooling
  required to scale quality across frequent releases and a
  large, active player base. You will partner closely with
  Engineering, QA, Live Operations, and other disciplines to
  establish a development culture where automation is a shared
  responsibility and a core component of product quality.

  At Scopely, we create and operate games played by millions
  of people around the world. This role is an opportunity to
  shape how quality engineering evolves from the ground up for
  a high-scale live mobile game.

  What You Will Do

  - Define and execute the QA automation strategy for a live
    mobile game, including scalable frameworks, tooling,
    standards, and quality gates.
  - Build and lead an automation team from the ground up,
    including hiring, team structure, processes, mentorship,
    and career development.
  - Design, build, and implement automated testing across UI,
    API, integration, regression, end-to-end, mobile, and
    live-operations workflows.
  - Evaluate automation approaches, frameworks, platforms, and
    traditional or AI-assisted tools based on coverage,
    maintainability, speed, and value.
  - Establish automation standards, coding practices, test
    architecture, reporting, observability, and quality gates
    that can scale with the game and organization.
  - Partner with Engineering and QA to prioritize automation,
    improve testability, integrate testing into CI/CD, and
    establish shared ownership of automated tests, ensuring
    automation is part of the definition of done for every
    feature.
  - Provide hands-on technical leadership through framework
    design, prototypes, code reviews, automation
    implementation, and test-script development.
  - Mentor manual testers as they develop coding and automation
    skills, while defining metrics for coverage, stability,
    flakiness, execution time, and defect detection.
  - Communicate quality risks, automation progress, and
    investment needs while partnering with Product, Live
    Operations, Marketing, Customer Support, Localization, and
    external development teams.
  - Champion quality and release excellence across the
    organization while ensuring automation supports—not
    replaces—strong exploratory and risk-based testing.

  What We’re Looking For

  - 8+ years of experience in QA, test automation, or quality
    engineering, including 4+ years leading or building
    automation teams.
  - Proven experience creating automation strategies,
    frameworks, tooling, and infrastructure for complex
    products, ideally from the ground up.
  - Experience evaluating automation approaches and tools,
    integrating automated tests into CI/CD pipelines, and
    scaling quality practices for frequent live releases.
  - Hands-on programming experience in one or more languages; C#
    preferred.
  - Strong understanding of testing methodologies, automation
    architecture, coding practices, testability, and software
    development lifecycles.
  - Experience mentoring manual testers in coding, automation,
    and automated test-script development.
  - Proven ability to align Engineering and QA around
    automation, shared quality ownership, and continuous
    improvement.
  - Experience with mobile testing and familiarity with
    traditional and AI-assisted testing tools; game-testing
    experience preferred.
  - Experience with test management, defect tracking, source
    control, build systems, CI/CD, and release-management
    tools.
  - Strong communication, organization, analytical, stakeholder-
    management, and distributed-team leadership skills.

  Bonus Points

  - Experience working on a live mobile, free-to-play, or core
    game.
  - Experience with mobile-device farms, emulators, simulators,
    or cloud-based device testing.
  - Experience testing Unity, Unreal, or other game-engine-based
    products.
  - Experience with API, backend-service, data, performance,
    load, or reliability automation.
  - Experience automating live events, remote configuration,
    experimentation, monetization, or service-driven game
    features.
  - Familiarity with AI-powered test generation, test
    maintenance, visual validation, defect triage, or code-
    assistance tools.
  - Experience establishing automation metrics, quality
    dashboards, and engineering quality gates.
  - Experience working across internal and external development
    partners.

  For candidates in CA, CO, NJ, NY, and WA, the annual salary
  range is provided below. In addition to base pay, employees
  may be eligible for equity, bonuses, and a comprehensive
  benefits package, including healthcare benefits, retirement
  benefits, pet insurance, paid holidays, paid Scopely free
  days, and unlimited paid time off. Base pay offered may vary
  depending on job-related knowledge, skills, and experience.

  CA, CO, NJ, NY, and WA Annual Salary Range

  $112,200—$165,300 USD

  About Scopely

  Scopely is a leading video game and global interactive
  entertainment company, home to many of the world’s most
  beloved and enduring experiences, including two of the most
  successful mobile games of all-time “MONOPOLY GO!” and
  “Pokémon GO,” along with “Stumble Guys,” “Star Trek™ Fleet
  Command,” “MARVEL Strike Force,” “WWE Champions,” the
  Scrabble® franchise, “Yahtzee® With Buddies,” and many
  others. Across mobile, web, PC, and console, Scopely
  creates, develops, publishes, and live-operates one of the
  most diversified and award-winning portfolios in the games
  industry — bringing hundreds of millions of players together
  through a shared love of play.

  Founded in 2011, Scopely is powered by its exceptional team
  — including thousands of world-class gamemakers around the
  globe, a distinctive tenet-driven culture, and its
  proprietary technology platform, Playgami. Together, these
  strengths have fueled Scopely’s position as the #1 mobile
  games company in the U.S. and #2 globally, generating more
  than $10 billion in lifetime revenue. Whether building
  global sensations like “MONOPOLY GO!” from the ground up, or
  expanding through strategic acquisitions, including the
  FoxNext, GSN, and Scopely Explore games businesses — Scopely
  consistently delivers experiences players love today and
  return to for years to come.

  Recognized multiple times as one of the "100 Most
  Influential Companies in the World" by TIME magazine and one
  of Fast Company's "World's Most Innovative Companies" and
  “Best Workplaces for Innovators,” Scopely believes that
  video games can be a force for good — creating meaningful
  connections, vibrant communities, and making life better
  through play.

  Scopely has global operations and partners across four
  continents in more than a dozen countries worldwide. For
  more information, visit: https://www.scopely.com/.

