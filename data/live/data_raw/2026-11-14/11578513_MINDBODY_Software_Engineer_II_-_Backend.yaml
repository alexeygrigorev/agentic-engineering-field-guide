description: |
  At Playlist, life's richest moments happen when people step
  away from screens to move, connect, explore, and play. We're
  building the definitive platform for intentional living,
  connecting people with inspiring experiences in fitness,
  wellness, and beyond. With popular brands like Mindbody and
  ClassPass, Playlist empowers businesses and individuals,
  making it effortless for aspirations to become actions. Join
  us in reshaping technology's role to foster meaningful,
  real-world connections.

  Mindbody equips wellness entrepreneurs with technology to
  support thriving businesses and create exceptional
  experiences. Innovation and curiosity drive our culture,
  connecting businesses and individuals through cutting-edge
  solutions. Join us if you're passionate about enhancing
  wellness through technology.

  Who we are

  We’re a passionate engineering, platform, and operations
  team building products that help wellness businesses grow
  and help more people discover experiences that support full,
  healthy lives. At Mindbody, our software powers the tools
  fitness, beauty, and wellness businesses rely on every day
  to serve their communities.

  We believe great products are built by teams with different
  perspectives, shared purpose, and a commitment to continuous
  learning. We’re creating an environment where people feel
  supported, included, and empowered to do thoughtful work
  that makes a real-world impact.

  The Role You'll Play

  As a Software Engineer II on the Mindbody Software
  Engineering team, you’ll help build and maintain secure,
  reliable backend systems that support the Mindbody
  ecosystem. You’ll work closely with Product, Design, QA, and
  other engineers to deliver meaningful improvements for our
  customers and the businesses they serve.

  You’ll contribute to well-scoped projects with support from
  your team, continue growing your technical depth, and help
  create software that powers real-world wellness experiences
  around the globe.

  You’ll likely spend time working on:

  - Build and maintain backend systems and applications that
    support Mindbody products
  - Collaborate with Product, Design, QA, and Engineering to
    design, implement, test, and release product improvements
  - Contribute to secure, scalable services using thoughtful
    engineering practices
  - Participate in code reviews with clear, constructive
    feedback
  - Apply engineering best practices, including automated
    testing, monitoring, and maintainable code
  - Learn and contribute across one or more technical areas
    within your team’s codebase
  - Engage in retrospectives and team discussions with a focus
    on continuous improvement
  - Keep customer needs in mind while building tools that help
    wellness businesses grow

  Experience You Bring

  - 2+ years of experience programming large-scale SaaS products
  - Experience building backend services with an object-oriented
    language such as C# or Java
  - Experience designing and architecting backend services
  - Experience designing and working with microservice
    architecture
  - Experience with monitoring systems such as New Relic or
    Kibana
  - Familiarity with SDLC, programming design patterns, and
    Agile methodology
  - Ability to evaluate the impact of new features and identify
    potential application risks
  - Clear, professional communication skills and a collaborative
    approach to problem solving

  Pay Transparency:

  Pay Transparency: It is Playlist’s intent to pay all Team
  Members competitive wages and salaries that are
  motivational, fair, and equitable. The goal of Playlist’s
  compensation program is to be transparent, attract potential
  employees, meet the needs of all current employees, and
  encourage Team Members to stay with our organization. Actual
  compensation packages are based on several factors that are
  unique to each candidate, including but not limited to skill
  set, depth of experience, certifications, and specific work
  location. The base salary range for this position in the
  United States is $100,000 - $132,000. The total compensation
  package for this position also includes a bonus target and a
  full benefits package.

  Have we piqued your curiosity?

  Sound like the role for you? We’d love to hear from you!
  Even if you’re not 100% sure about potential fit, we still
  encourage you to apply. We’re looking for the right person,
  not the perfect series of checkboxes.

  The Company is an Equal Opportunity Employer. We highly
  value diversity at our company and encourage people of all
  different backgrounds, experiences, abilities and
  perspectives to apply. We do not discriminate on the basis
  of race, religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, disability
  status, or other protected characteristics.

