  including by auto-dialer. Message and data rates may apply.
  Opt-out or text STOP to cancel at any time. If you are a
  California resident or reside outside the United States then
  by submitting your application you confirm that you have
  read, understood, agree and - where applicable - grant your
  prior, free, informed and express consent for the processing
  of your personal information, including sensitive personal
  information, as described in our California Applicant
