description: |
  About heyLibby

  heyLibby is a seed-stage startup building the world’s best
  AI assistant for small to medium businesses focusing on the
  fitness and wellness industries. We were co-founded by
  Spencer Rascoff, the former CEO of Zillow and current CEO of
  Match Group. Our AI works seamlessly across phone, email,
  text, and chat to help businesses manage their
  communications efficiently. We move fast, prioritize impact,
  and work closely with top industry experts. Our culture
  values transparency, hard work, and making an impact.

  About the Role

  We are looking for a highly skilled and experienced Senior
  Software Engineer with the ability to architect, design, and
  build and with deep expertise in React, TypeScript, Node.js,
  and AWS. You will be a critical part of our small, high-
  impact team, architecting and building scalable systems
  while making quick and pragmatic architectural decisions. We
  value engineers who can think creatively, ship fast, and
  build practical solutions that drive real business value. We
  also use AI throughout all our daily tasks and are looking
  for engineers that can use the latest AI technologies to
  accelerate their development.

  Responsibilities

  - Architect, develop, and maintain scalable, high-quality
    full-stack applications.
  - Design and implement frontend experiences using React and
    TypeScript. You will be our React/frontend expert to fill
    in and round out the team’s skills!
  - Build and optimize backend services using Node.js on AWS.
  - Collaborate closely with founders and the team to shape
    technical decisions and product direction.
  - Own features end-to-end, from idea to deployment.
  - Optimize performance and usability while maintaining high-
    quality code.
  - Work quickly and adapt to a fast-changing environment while
    maintaining a pragmatic approach to problem-solving.
  - Help to select design patterns, and architect solutions top
    to bottom.

  Qualifications

  Must-Haves:

  - 5+ years of professional experience in full-stack
    development.
  - Strong expertise in React, TypeScript, and Node.js.
  - Ability to use the latest AI technologies for development,
    testing, and other tasks
  - Deep understanding of AWS and cloud-based architectures.
  - Ability to independently design and architect systems.
  - Strong problem-solving skills and ability to move fast in a
    startup environment.
  - Excellent communication skills and ability to work
    collaboratively in a small team.
  - A ‘get-it-done’ attitude and a bias toward execution over
    perfection.

  Nice-to-Haves:

  - Experience with AWS Amplify.
  - Experience working at an early-stage startup.
  - Familiarity with automated testing tools and CI/CD
    pipelines.
  - Experience with Identity and Access Management solutions.
  - Experience with Authentication and Authorization frameworks
    (OIDC, OAuth, etc.)

  Why Join Us?

  - Fast-moving environment: We believe in moving fast and
    iterating quickly.
  - Work with top experts: Get the opportunity to collaborate
    with leading industry professionals.
  - Real impact: Your work will directly shape the future of AI-
    powered business tools.
  - Work-life balance: We work very hard but also respect the
    need to take care of life and family.
  - Equity and ownership: Be part of a small, high-impact team
    where your contributions are valued.

  If you are an experienced software engineer looking to work
  in a high-energy, fast-paced, and fun startup, we’d love to
  hear from you. Apply now and help us shape the future of AI-
  powered business communication!
