description: |
  🍊Our mission

  Great science regularly stalls in the clinic, not because
  the science is wrong, but because the company behind it
  lacks the capital, infrastructure, or focus to take it all
  the way through. Today’s clinical-stage biopharma model is
  broken, and as a result promising treatments never reach
  patients.

  Our mission is to fix this: we’re building the next
  generation of biopharma by in-licensing clinical-stage
  therapeutic assets and developing them through Lindus
  Health’s integrated, technology-first clinical trial
  infrastructure. We’re a new initiative, but we’re building
  on a proven foundation - the same infrastructure that has
  delivered 82% of Lindus Health’s sponsor trials on or ahead
  of timeline, across 40+ completed trials across the US and
  Europe.

  We’re in-licensing 5-7 clinical-stage, typically
  Phase-2-ready assets, funded directly from Lindus Health’s
  balance sheet. We’re targeting deal close on our first
  assets through 2026, with first trials launching in H1 2027.

  🍊About the role

  We are looking for a software engineer to help build the
  platform powering the next generation of clinical trials.
  Join our fast-moving team and help us scale the product to
  manage complex trials and bring new treatments to patients
  faster!

  This is an onsite role in London with a flexible (hybrid)
  office arrangement. After an initial onboarding period full-
  time at our headquarters (near London Bridge) we expect you
  to be in the office at least 3 days a week.

  🍊About you

  We’d like to hear from you if…

  - You have 3+ years experience as a professional software
    engineer collaborating within a team
  - You are product-minded: you want to understand why we are
    building something to figure out the best how in
    collaboration with product managers, designers, non-
    technical colleagues and users
  - You have embraced the recent advances in AI, and enjoy
    leveraging AI to help you in your role
  - You are comfortable working across a stack that includes
    frontend (TypeScript/React), backend
    (Python/Node.js/Postgres) and infrastructure (AWS). You
    don’t necessarily have hands-on experience with all pieces
    of our stack but are happy to pick up technology and
    processes that’s new to you.
  - You have supported systems at scale in production.
  - You can work independently but also collaborate well with
    others.
  - You are passionate and curious about our mission; changing
    how the clinical trials industry operates and how new
    medicines are developed.
  - You want to learn what life is like at a high-growth,
    mission-driven VC funded startup

  You belong here! If your experience and interests match
  those above, we want you to apply.

  🍊What you’ll focus on

  You'll join less than a year into our new v2 product launch,
  in a fast-paced, high-ownership environment where you can
  challenge and shape our product and processes while they're
  still being defined.

  - In your first month
    - Learn about clinical trials and the problems we are trying
      to solve through our onboarding training and chats with
      people across the company
    - Collaborate with the product team on starter projects and
      make your first commits
    - Become a part of the regular product development cycle: join
      a squad and deliver a feature in Citrus, our trial
      delivery platform
    - Become familiar with the core components of our stack
      (React, TypeScript, Python, Postgres, Terraform,
      Kubernetes, Github Actions, Relational databases, Claude
      Code)
  - In your first 3 months
    - Develop deeper understanding of one or more areas of our
      stack
    - Contribute actively to the team’s processes and rituals,
      such as retrospectives and standups
  - Within your first 6 months
    - Get close to users, observe the product being used in real
      trials and support the team in responding to feature
      requests and bug reports
    - Take on more complex coding and design tasks
    - Rotate through our support function, handling user issues
      and investigating and fixing bugs
    - Deepen your understanding of clinical trials, and build
      relationships across the wider company

  🍊 What we offer

  Make an impact across all areas of our business and fix one
  of the world's most broken industries.

  - Competitive salary, plus meaningful stock options
  - Flexible working: We have an incredible office near London
    Bridge and encourage people to work 3 days per week from
    the office
  - 30 days annual leave in addition to Bank Holidays, resulting
    in 39 paid days off per year
  - £60 monthly wellness allowance, which you can spend on our
    company health insurance scheme through AXA, a wellhub
    membership, or wellness activities and expenses of your
    choice!
  - Enhanced Parental Leave: 16 weeks full pay for primary
    caregiver and 4 weeks full pay for secondary caregiver
  - £1,000 Learning and Development allowance each year to put
    towards courses, certifications, and development
  - Regular whole company and team events, both in person and
    virtually
  - Access to gym and retail discounts through our benefits
    platform Happl
  - A well-stocked pantry and drinks fridge, Monday breakfast
    spread and catered team lunch on a Thursday for the UK
    office every week!
  - Cycle-to-work scheme and other salary sacrifice options
    available
  - Charity events and fundraising opportunities through our
    charity partnership with the Forward Trust

  🍊 Our Hiring Process

  We believe hiring should be transparent, respectful of your
  time, and give you a real feel for what Lindus Health is
  like. Here's what to expect:

  Initial conversation with Sophie, Head of Talent (30 mins)
  Get to know each other, discuss the role, and answer any
  questions you have

  Take home task (60 mins)

  This will be a coding task, which you can complete in Python
  or TypeScript, that is reviewed by a member of the
  engineering team.

  Functional interview with Tim, Engineering Manager & 1
  senior engineer (60 mins) Deep dive into your experience and
  how you'd approach key challenges

  Values interview with our CEO, Meri and Gemma, CPTO (30
  mins) A chance to get to know each other and explore how our
  values align

  [We'll arrange at least one interview in-person at our
  office so you can meet more of the team and get a feel for
  our environment - usually the final values stage.]

  We will only contact you from lindushealth.com email
  addresses. Please check the spelling of emails which appear
  to come from Lindus carefully before responding. We will
  never ask for your financial information over email. We are
  an equal opportunity employer committed to building a
  diverse and inclusive workforce. We evaluate all candidates
  based solely on their skills, experience, and qualifications
  relevant to the role. We do not discriminate on the basis of
  race, ethnicity, religion, gender, gender identity, sexual
  orientation, age, disability, veteran status, or any other
  legally protected status
