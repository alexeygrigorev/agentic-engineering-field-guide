description: |
  This is a remote position.



  ****If not located in LATAM, PLEASE DO NOT APPLY, thanks****




      At GBH, we don’t just do tech, we live it, breathe it,
  and build it with purpose.










      We're the dreamers, the builders, the strategists who
  turn ideas into digital experiences that actually matter.
  Whether it’s crafting seamless mobile and web apps,
  unlocking insights through big data, or rethinking tech
  strategies, we do it all with impact in mind and belonging
  at heart.










      We’re Geared for Impact. Built for Belonging. And always
  ready for what’s next.










  We are looking for a Senior Full-Stack Product Engineer. You
  will work directly with business stakeholders to understand
  their goals and the problems they need to solve. You will
  clarify needs, explore solution options, and explain trade-
  offs in business terms before defining the technical
  approach. Then you will design, build, test, release, and
  support changes in production across React and TypeScript
  front-end applications and Python-based back-end services.
  You will apply sound software architecture principles to
  design scalable, secure, reliable, and maintainable systems.
  You will work with product, design, and engineering partners
  to deliver useful software.




  You will be responsible for:



  - Work directly with business stakeholders to understand
    goals, users, and constraints. Ask questions and clarify
    the problem before proposing a solution.
  - Frame business needs as clear problem statements and
    acceptance criteria with the people involved.
  - Compare solution options and explain trade-offs in business
    terms before discussing technical details.
  - Own approved changes from solution design through
    implementation, testing, release, and production support.
  - Design and evolve software architecture. Define system
    boundaries, component responsibilities, data flows, API
    contracts, and integration patterns. Assess trade-offs in
    scalability, reliability, security, and maintainability.
  - Build and maintain React and TypeScript front-end
    applications with a focus on performance, usability, and
    maintainable architecture.
  - Design and maintain Python-based back-end services and
    connect applications to GraphQL APIs and partner
    integrations.
  - Work with product and design partners on user flows,
    wireframes, mockups, data visualization, and analytics-
    driven features.
  - Add user behavior and usage metrics when needed, and help
    review how changes perform.
  - Maintain code quality through testing, refactoring, code
    review, CI/CD, and production monitoring.
  - Collaborate across business and technical teams. Communicate
    progress, risks, decisions, and product updates clearly.
  - Explore tools and design approaches that address real
    product or engineering needs.
  - Contribute to broader platform development when required.


    Requirements



  - 3–5+ years of professional experience in software
    engineering, with experience delivering front-end, back-
    end, or full-stack software
  - 2–3+ years of experience with React and modern front-end
    development
  - 2–3+ years of experience with Python in production
    environments
  - Experience taking software changes through testing,
    deployment, and production support
  - Experience clarifying business needs, comparing solution
    options, and explaining trade-offs to non-technical
    stakeholders
  - Strong knowledge of software architecture and system design,
    including component boundaries, API and integration
    design, data modeling, scalability, reliability, security,
    and maintainability
  - Strong proficiency with TypeScript, React, and modern
    styling solutions such as SCSS or CSS
  - Experience designing and consuming APIs, including GraphQL
  - Experience using AI tools in software development, with the
    ability to review, test, and take responsibility for the
    resulting code
  - Hands-on experience with AWS, Docker, CDNs, and CI/CD
    workflows
  - Familiarity with Apache Airflow, Neo4j, or similar data-
    driven technologies is a plus
  - Solid understanding of Git and version control best
    practices
  - Ability to work with product and design partners on user
    experience, data visualization, and product analytics
  - Strong communication skills with technical and non-technical
    stakeholders
  - Bachelor’s degree in Computer Science or a related field, or
    equivalent experience
  - Advanced English proficiency
  - Based in LATAM.










  Meet the Team



   We’re a company that empowers people. Instead of rules, we
  have three company values to let you do what you do best.
  You’re free to be passionate, innovative, collaborative,
  live a life of integrity, care for those you work with, and
  delight our customers.











  On this team you´ll work with a group of talented
  professionals such as Hector Aristy.







    Benefits

   Why Join GBH?




  - Our Culture: A friendly, fast-paced and inclusive
    environment. We rely on an open and empathetic culture
    that constantly promotes the growth of our team.
  - Learning & Development: We do our best to set the best
    baselines to accelerate your career.
  - Benefits & Rewards: We strive to offer competitive,
    unbiased, and fair rewards for all our people. We empower
    you to manage your own time and promote flexible working
    opportunities, along with family-friendly policies.





  What Happens once you apply?





  Once you have completed your application, we will review
  your profile and you will hear from us in a period of 5 to
  10 days maximum.










