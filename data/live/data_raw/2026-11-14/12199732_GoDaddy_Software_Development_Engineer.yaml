description: |
  Location Details:

  At GoDaddy the future of work looks different for each team.
  Some teams work in the office full-time; others have a
  hybrid arrangement (they work remotely some days and in the
  office some days) and some work entirely remotely.

  This is a remote position, so you’ll be working remotely
  from your home. You may occasionally visit a GoDaddy office
  to meet with your team for events or meetings.

  This position is not eligible to be performed in Alaska,
  Mississippi, North Dakota, or the Virgin Islands.

  GoDaddy is not currently considering candidates for this
  role in California, Seattle, or NYC.



  Join Our Team

  Join our growth engineering team and help shape how
  customers discover, experience, and purchase GoDaddy’s AI-
  powered products.

  Our team focuses on monetizing Airo, GoDaddy’s AI-powered
  website-building experience, through product-led growth. We
  build and optimize experiences that help free and trial
  users become paying customers while helping existing
  customers discover products and plans that provide greater
  value.

  Our work spans pricing and plan experiences, upgrade flows,
  paywalls, trial-to-paid and free-to-paid journeys,
  contextual upsells, and post-purchase experiences.
  Experimentation is central to how we work. We regularly
  launch experiences as A/B tests, measure customer and
  business impact, and use those insights to determine what we
  iterate on and scale.

  We’re a small, highly collaborative, remote-first team where
  engineers work closely with product management, design,
  analytics, and data science. We value ownership, thoughtful
  execution, quick learning, and continuously improving the
  customer experience.

  What You’ll Get to Do…

  As a Software Development Engineer III, you’ll build
  customer-facing experiences that directly influence how
  customers interact with and purchase GoDaddy products.
  You’ll have the opportunity to:

  - Build and ship full-stack, customer-facing experiences using
    React and TypeScript, with opportunities to work with
    Node.js, APIs, and GraphQL across pricing, upgrades,
    checkout, and purchase journeys.
  - Take product hypotheses from idea to production, using
    feature flags, cohorts, event tracking, testing, and
    experimentation to measure results and drive improvements.
  - Partner closely with product managers and designers to
    define scope, influence the customer experience, and
    identify effective ways to test new ideas.
  - Collaborate with data analysts and data scientists to
    understand experiment performance, conversion funnels,
    customer behavior, and opportunities for growth.
  - Build and optimize contextual upgrade and monetization
    experiences that connect customers with the right products
    and plans at key moments in their journey.
  - Write clean, maintainable, and testable code, contribute to
    code reviews, and improve shared components, tooling, and
    engineering practices.

  Your Experience Should Include…

  - 3+ years of professional software engineering experience, or
    equivalent experience, with a track record of ownership,
    learning quickly, and delivering results.
  - Strong professional experience with JavaScript/TypeScript
    and React, building production-ready, customer-facing
    applications.
  - Experience shipping consumer-facing or SaaS product features
    end to end, from development and testing through
    production and iteration.
  - Strong software engineering fundamentals, including testing,
    debugging, code reviews, Git, and CI/CD.
  - Experience collaborating effectively with product, design,
    data, and engineering partners to deliver high-quality
    customer experiences.
  - A strong product and business mindset, with the ability to
    connect engineering decisions to customer behavior,
    conversion, and business outcomes.

  You Might Also Have…

  - Experience with A/B testing and experimentation, including
    feature flags, cohorts, event tracking, analytics,
    conversion funnels, or growth and monetization products
    such as e-commerce, checkout, pricing, or SaaS
    subscriptions.
  - Experience with modern front-end and full-stack
    technologies, including Redux, React Query, GraphQL,
    Node.js, and REST APIs, with exposure to reusable
    component libraries, accessibility, performance,
    internationalization, or building consumer-facing products
    at scale.

  We encourage you to apply even if your experience or
  skillset doesn’t align perfectly with every requirement. We
  value a wide range of backgrounds and transferable skills,
  and we are excited to support learning and growth.

  About us...  GoDaddy is empowering everyday entrepreneurs
  around the world by providing the help and tools to succeed
  online, making opportunity more inclusive for all. GoDaddy
  is the place people come to name their idea, build a
  professional website, attract customers, sell their products
  and services, and manage their work. Our mission is to give
  our customers the tools, insights, and people to transform
  their ideas and personal initiative into success. To learn
  more about the company, visit About Us.

  At GoDaddy, we know diverse teams build better
  products—period. Our people and culture reflect and
  celebrate that sense of diversity and inclusion in ideas,
  experiences and perspectives. But we also know that’s not
  enough to build true equity and belonging in our
  communities. That’s why we prioritize integrating diversity,
  equity, inclusion and belonging principles into the core of
  how we work every day—focusing not only on our employee
  experience, but also our customer experience and operations.
  It’s the best way to serve our mission of empowering
  entrepreneurs everywhere, and making opportunity more
  inclusive for all. To read more about these commitments, as
  well as our representation and pay equity data, check out
  our Diversity and Pay Parity annual report which can be
  found on our Diversity Careers page.

  We also embrace our diverse culture and offer a range of
  Employee Resource Groups (Culture). Have a side hustle? No
  problem. We love entrepreneurs! Most importantly, come as
  you are and make your own way.

  GoDaddy is proud to be an equal opportunity employer.
  GoDaddy will consider for employment qualified applicants
  with criminal histories in a manner consistent with local
  and federal requirements. Refer to our full EEO policy.

  Our recruiting team is available to assist you in completing
  your application. If they could be helpful, please reach out
  to myrecruiter@godaddy.com.

  Colorado Residents: In any materials you submit, you may
  redact or remove age-identifying information such as age,
  date of birth, or dates of school attendance or graduation.
  You will not be penalized for redacting or removing this
  information.

  GoDaddy doesn’t accept unsolicited resumes from recruiters
  or employment agencies.

  Compensation & Benefits:

  What We Offer:

  Working at GoDaddy offers many benefits, including
  competitive pay, generous time off, parental and wellness
  leave, healthcare, retirement savings program, and much
  more. Offerings vary by location.

  This role is eligible for a comprehensive benefits package,
  which includes medical, dental, and vision insurance, a
  401(k)-retirement plan, paid sick time, paid flexible time
  off, paid parental leave, life insurance, short- and long-
  term disability, AD&D insurance, mental health or EAP
  programs, remote or hybrid work options, paid holidays, paid
  Wellness days, tuition assistance, adoption, surrogacy, and
  fertility benefits, dependent daycare and backup care
  benefits, Employee stock purchase plan, financial education
  and advice; and other benefits in accordance with GoDaddy’s
  benefit plans and applicable law.

  Actual compensation and benefits eligibility will be
  determined based on permissible, non-discriminatory factors
  such as skills, experience, and geographic location.

