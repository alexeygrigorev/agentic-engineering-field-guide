description: |
  🐶 Our mission

  Every pet should get the care they need, regardless of cost.
  Vet med prices are up 40% since 2020, and pet owners are
  stuck having to pick between their bank account and furry
  friend. At Snout, we aim to solve this by enabling clinics
  to offer pet wellness plans, that actually work.

  🚀 The opportunity

  Snout is one of the fastest growing wellness plan providers
  in the veterinary space, trusted by clinics across the U.S.
  We’re a small but mighty startup team of <50 employees.
  We’re on the lookout for an experienced and remote Senior
  Software Engineer based in the USA or Ontario, Canada to
  help build and maintain our web platform and portal.

  💻 The role

  As an Senior Software Engineer, you'll be working on our
  Snout web platform. You'll add new wellness plan features
  and capabilities, enhance user experience, and operate the
  wellness platform that clinics and pet owners rely on every
  day. This isn't siloed engineering work — you'll frequently
  work cross-functionally with marketing, sales, and support
  teams, writing code and performing technical operations that
  touch every part of the business.

  Your impact will be felt immediately and broadly. You'll
  lead spirited technical debates to establish product and
  technical plans, then take ownership to deliver on those
  plans quickly and effectively. You'll work alongside
  experienced partners who have your back, pair regularly, and
  help take the product to the moon. As Snout grows, your role
  will grow with it.

  If you're a collaborative engineer who thrives in a small
  team environment, loves solving real problems for real
  users, and wants to make veterinary care accessible to
  everyone — we want to hear from you.

  Snout is committed to building a diverse and inclusive team.
  We know that great candidates may not check every box — and
  that’s okay. If you're excited about this role and our
  mission, we encourage you to apply if you meet at least 75%
  of “what we’re looking for” including the first bullet
  point. If you need any accommodations during the application
  or interview process, please let us know — we’re happy to
  support you.

  🛠 What you’ll do

  - Maintain, build and ship new features and capabilities for
    our platform and portal
  - Enhance user experience across our platform for veterinary
    clinics and pet owners
  - Write code and perform technical operations to support
    marketing, sales, and customer support initiatives
  - Test, monitor, and operate the wellness platform to ensure
    reliability and performance
  - Collaborate daily with the team through pairing sessions,
    meetings, and Slack discussions
  - Take ownership of special projects and initiatives as they
    arise

  💡What we're looking for

  - 6+ years of professional software engineering experience
  - Experience with both JavaScript and TypeScript in production
    environments
  - Strong proficiency with our tech stack: ReactJS, NodeJS,
    Tailwind, PostgreSQL and AWS
  - Ability to design, code, and test full-stack web
    applications from database to UI, with attention to
    scalability and performance
  - Comfortable leading detailed technical debates and making
    thoughtful engineering decisions around systems
    design/architecture or user experience
  - A self-motivated team player who takes initiative,
    communicates clearly, and ships work effectively

  🌟 What will make you stand out

  - Experience building and scaling SaaS products
  - Background working at early-stage startups (Series A/B)
  - Familiarity with healthcare or veterinary technology
  - Experience working cross-functionally with non-technical
    teams
  - Track record of owning features end-to-end from concept to
    production
  - Passion for pets and understanding of the veterinary space

  💖 Why you should join Snout

  - Fast growing, venture capital backed technology company
    focused on improving access to veterinary care
  - Ability to have a meaningful impact from Day 1, where your
    voice and opinion matters
  - Unlimited potential to grow in your career, learn and expand
    your skillsets
  - Collaborative, flexible, and friendly culture

  ❌ Why this role might not be a fit for you

  - You don’t live near an airport or have the flexibility to
    travel quarterly
  - A fast-moving, startup culture feels overwhelming to you and
    you aren’t comfortable with ambiguity and figuring things
    out as you go
  - You prefer working independently in your own area rather
    than collaborating daily with the team online or in person
  - You're uncomfortable with spirited technical debates or
    having your ideas challenged

  💸 Compensation

  - $130 000 - $160 000 base salary

  ⚕️Benefits

  - Day 1 medical/dental/vision benefits
  - Flexible time off + 11 Snout calendar holidays
  - Paid parental leave
