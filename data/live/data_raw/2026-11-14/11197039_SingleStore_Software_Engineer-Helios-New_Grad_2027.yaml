description: |
  Position Overview

  At SingleStore, we're not just building a database company;
  we are defining the future of data management. We believe
  that every company should have a holistic view of all its
  data, and the Helios team is responsible for making this
  possible. We are looking for people to join us in building a
  hybrid cloud control plane that autonomously manages high-
  performance SingleStore databases on behalf of our
  customers.

  As a Software Engineer, you will have the opportunity to
  develop continuously deployed software with a collaborative
  team. As our team operates in parallel on multiple features,
  you will help manage the entire lifecycle of feature
  development at varying levels of complexity. This includes
  working directly with other teams as well as customers to
  ensure we always exceed expectations. Our engineers are not
  just technical partners, but are also business partners who
  are exposed to all areas of the business, working with teams
  such as product, marketing, and sales.

  Role and Responsibilities

  Our Software Engineers work on small, collaborative teams to
  help drive our company forward. Our University Graduates are
  responsible for developing the software powering our world-
  class cloud service. You will be building brand new,
  exciting projects and features that are deployed into
  production at a fast pace. Your work will include everything
  from writing to testing software while gaining a significant
  understanding of both the product and the business.

  Required Skills and Experience

  - B.S. Degree in Computer Science, Electrical Engineering,
    Computer Engineering, or related discipline
  - Deep understanding of C.S. fundamentals, in particular,
    operating systems, concurrency, multithreading, and server
    architectures
  - Strong programming skills with JavaScript, Typescript,  or
    GolangPassionate about building highly reliable software
  - Firm grasp of algorithms and data structures

  SingleStore delivers the cloud-native database with the
  speed and scale to power the world’s data-intensive
  applications. With a distributed SQL database that
  introduces simplicity to your data architecture by unifying
  transactions and analytics, SingleStore empowers digital
  leaders to deliver exceptional, real-time data experiences
  to their customers. SingleStore is venture-backed and
  headquartered in San Francisco with offices in Seattle,
  Lisbon and Hyderabad.

  Consistent with our commitment to diversity & inclusion, we
  value individuals with the ability to work on diverse teams
  and with a diverse range of people.
