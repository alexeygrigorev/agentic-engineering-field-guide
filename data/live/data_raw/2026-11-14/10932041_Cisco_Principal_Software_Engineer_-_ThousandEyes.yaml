title: Principal Software Engineer - ThousandEyes
company: Cisco
location: London, GBR
work_type: FULL_TIME
company_size: 77,500 Employees
description: |
  Meet the Team

  Cisco ThousandEyes is a Digital Experience Assurance
  platform that empowers organizations to deliver flawless
  digital experiences across every network - even the ones
  they don’t own. Powered by AI and an unmatched set of cloud,
  internet and enterprise network telemetry data, ThousandEyes
  enables IT teams to proactively detect, diagnose, and
  remediate issues - before they impact end- user experiences.

  ThousandEyes is deeply integrated across the entire Cisco
  technology portfolio and beyond, helping customers deploy at
  scale while also delivering AI-powered assurance insights
  within Cisco’s leading Networking, Security, Collaboration,
  and Observability portfolios.

  The Endpoint Engineering team is leading this charge,
  competing to dominate its market segment as well as becoming
  part of the fabric of Cisco’s wireless, security and
  collaboration systems. We are a small team where every
  engineer is hands-on and has a voice in where the product
  and technology goes. This creates a rare opportunity for you
  to work with one eye on the future, while staying closely
  rooted in delivering exciting new innovations today.

  Your Impact

  You will partner with product and engineering leaders across
  ThousandEyes to determine how best to evolve our
  technologies, and then roll your sleeves up and help ship
  these new features. Critical initiatives include bringing
  our technology into Cisco wireless and security product
  portfolios and pragmatically leveraging AI to deliver
  capabilities such as self-service issue diagnosis for users
  and automated remediation of network issues.

  You will be an effective voice for the engineering team as
  we work across the company, and an enthusiastic team mate in
  the build and operation of complex systems. You should also
  be passionate about developer productivity and how we can
  constantly improve on this.

  Minimum Qualifications

  - Professional software engineering experience building and
    maintaining production-grade applications using Java,
    Kotlin, or C++.
  - Software architecture experience in at least two of the
    following domains: distributed systems, enterprise SaaS,
    endpoint development, or low-level networking protocols.
  - 4+ years of experience in technical leadership capacity
    while designing, developing and maintaining large-scale
    distributed production systems.
  - Proven experience delivering large-scale internet products
    while collaborating with cross-functional teams outside of
    your direct line.
  - Demonstrated experience of having mentored software
    engineers at various levels of experience.
  - Demonstrated experience of having made measurable
    improvements in developer productivity.

  Preferred Qualifications

  - Bachelor’s degree in Computer Science or similar.
  - Familiar with Docker, Kubernetes and cloud technologies such
    as AWS.
  - Experience with processing large data sets on Elasticsearch
    or similar data stores.
  - Experience with event-driven architectures (CQRS, Kafka
    Streams etc).
  - Excellent knowledge of computer science and networking
    fundamentals.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
