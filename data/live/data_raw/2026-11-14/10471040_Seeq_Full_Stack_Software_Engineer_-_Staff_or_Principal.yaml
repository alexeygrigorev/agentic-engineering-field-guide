description: |
  This is a full stack engineering role focused on building
  and evolving Seeq's data analytics platform end-to-end. You
  will work across frontend and backend systems, owning
  features from browser to database in a complex enterprise
  product that serves industrial sectors like pharmaceuticals,
  energy, and manufacturing.

  We are looking for an exceptional engineer who is highly
  effective across the full stack, with strong product sense
  and the ability to deliver polished, reliable software at
  every layer.

  What You Will Do

  You will lead the design and development of features that
  span the entire stack, from React-based frontend
  applications to backend services, APIs, and data layers.

  You will work closely with Product, UX, and Engineering
  teams to understand user needs, make sound technical
  decisions, and deliver high-quality software that solves
  real problems.

  You will own features end-to-end. You are comfortable
  building intuitive frontend experiences and equally
  comfortable working in backend services, databases, and
  distributed systems.

  You will mentor and guide other engineers, helping raise the
  quality bar across the team through code review, pairing,
  and technical leadership.

  You bring fresh technologies and approaches to the team and
  help the organization adopt them effectively. You are
  thoughtful about how AI is changing software development and
  how to leverage it to accelerate outcomes.

  What We're Looking For

  You are a highly productive engineer with a strong track
  record of delivering complex features across frontend and
  backend systems. You identify areas for improvement without
  waiting to be told, and you ship with consistency in a
  continuous delivery model.

  You are meticulous and detail-oriented. You advocate for
  testing, continuous integration, and clean solutions. You
  address bugs immediately and actively reduce technical debt.

  You collaborate effectively through code review, pairing,
  and clear communication. You are product- and user-focused —
  you engage with customers and can articulate the rationale
  behind features and pain points to your fellow engineers.

  You are proficient in React, TypeScript, and modern frontend
  tooling (e.g., Tailwind), and can build polished, responsive
  user interfaces. You also bring depth in backend
  technologies such as a JVM language like Kotlin, Python, or
  GraphQL, and can work confidently with databases,
  distributed systems, and cloud platforms.

  You bring strong ownership and agency. You do not wait to be
  told where the gaps are. You find them, make good judgments
  about where to focus, and drive improvements through to
  completion.

  You are driven by impact beyond individual contributions.
  You work across boundaries for the benefit of the product
  and its users, and you maintain open communication about
  growth opportunities with your manager(s) and colleagues.

  Requirements

  - A Bachelor's or Master's degree (or equivalent experience)
    in computer science, software engineering, or a related
    field
  - Substantial professional experience in software development,
    with a solid record of designing, building and evolving
    complex software systems over a period of years: 6+ years
    for Staff, 10+ years for Principal
  - Demonstrate a strong understanding of software design
    principles, patterns, and best practices
  - Expertise in one or more backend JVM languages, such as
    Java, Kotlin, or Scala
  - Experience working with databases such as Postgres
  - Expertise in building large frontend applications with React
    or TypeScript preferred.
  - Ability to work effectively across frontend and backend
    codebases, owning features end-to-end
  - Excellent problem-solving and analytical skills, with great
    attention to detail
  - Proven leadership skills, with the ability to guide and
    mentor junior engineers
  - Excellent communication and collaboration skills, and the
    ability to work effectively in a cross-functional team
    environment
  - Familiarity with agile development methodologies and tools,
    such as Scrum or Kanban

  Benefits

  Seeq is a remote-first (and only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.

  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability and sustainability.

  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers'
  expectations. We are certified as a great place to work, and
  included in the Technology Fast 500 and Inc. Magazine's Best
  Places to Work.

  The Perks of Working at Seeq

  - Competitive salary plus cash bonuses
  - Benefits:

  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.

  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas.
