description: |
  US Mobile is building the future of wireless communication.
  The goal: one unified network open to any person and any
  device, worldwide. Connection without walls.

  We’re getting there by empowering customers. All three major
  networks on one phone and one plan, plus home internet from
  Starlink. No lock-in. No commitments. Custom fit plans at
  every price point. 24/7 customer support with real people,
  empowered to help. We get real-time feedback from Reddit,
  surveys, and customer support informing product roadmaps and
  everything we do. It’s working — we’re The Wirecutter’s
  favorite cellular carrier, and Consumer Reports has named us
  the top-rated mobile carrier two years in a row.*

  And we’re building innovative systems that scale. A network
  agnostic tech stack. Agile, cross-functional teams built on
  trust and mutual respect. This work isn’t for everyone. If
  you work fast, flexibly, and collaboratively — without
  compromising standards — we want to hear from you.

  We’re looking for a Lead Frontend Engineer to help us build
  and grow our frontend team as we double our team. This is a
  high-impact, high-ownership role where you’ll manage and
  mentor a team of engineers while architecting and building
  fast, accessible, and elegant web and mobile applications
  used by over 1 million subscribers. Our challenges are both
  technical and strategic.

  About the Role

  The Lead Frontend Engineer owns the growth and output of a
  frontend engineering pod — hiring, developing, and managing
  a small team — while remaining a strong hands-on contributor
  and a voice in technical direction. This is a player-coach
  role: you’ll write code and shape architecture alongside
  your team, not just direct it from a distance, while also
  partnering with Talent to build out the team and with
  Engineering leadership to shape where the frontend goes
  next.

  You will:

  - Build and lead a team — hire, mentor, and grow a high-
    performing group of frontend engineers as we scale.
  - Shape technical direction — influence architecture, tooling,
    and roadmap decisions across frontend systems.
  - Stay hands-on — architect and build fast, accessible,
    elegant web and mobile applications used by over 1 million
    subscribers.
  - Scale our systems — help us grow to tens of millions of
    customers and connected devices.
  - Raise the bar — build quality tools and frameworks to ensure
    a high-quality product.
  - Champion accessibility and performance — treat both as
    first-class concerns across the frontend org.
  - Drive innovation — work on mission-critical projects like
    our next-gen agentic AI chatbot, a customer-centric
    interface giving full control over phone lines, a next-
    generation usage dashboard, and an e-commerce experience
    unmatched in telecom.

