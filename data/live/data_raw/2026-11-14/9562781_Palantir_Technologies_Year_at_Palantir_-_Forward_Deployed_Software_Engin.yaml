description: |
  A World-Changing Company

  Palantir builds the world’s leading software for data-driven
  decisions and operations. By bringing the right data to the
  people who need it, our platforms empower our partners to
  develop lifesaving drugs, forecast supply chain disruptions,
  locate missing children, and more.

  Palantir Year

  We've had surging demand from undergrads who want to get
  into the arena faster. You've told us you can't sit in
  lectures while the biggest story of our lifetime is written
  around you. It's clearer every day, it's being written
  faster than ever. If that's your spirit, you'll feel right
  at home here. Come join us for a year. Do real, critical
  work with the engineers and customers building the future.
  Many of our interns find they want to stay - perhaps you
  will too.

  The Role

  Build software and deliver customer outcomes. You'll work on
  real problems: helping customers deploy AI-powered
  solutions, building the software platforms of the future,
  and transforming how organizations operate. You'll be held
  to the same performance standards as any Palantir engineer,
  and your career progression will be based purely on merit
  and impact. Every incentive we have points toward putting
  our best people in the highest-leverage positions, as fast
  as possible. You’ll have the rare opportunity to gain deep
  insight into and directly influence some of the world’s most
  critical industries and institutions. By building on
  Palantir’s powerful platforms leveraging integrated cutting-
  edge AI, you’ll help organizations unlock the full potential
  of their data to make smarter, faster decisions.

