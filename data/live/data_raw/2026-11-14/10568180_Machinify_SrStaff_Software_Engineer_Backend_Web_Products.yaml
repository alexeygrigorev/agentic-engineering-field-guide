description: |
  Machinify is a leading healthcare intelligence company with
  expertise across the payment continuum, delivering unmatched
  value, transparency, and efficiency to health plan clients
  across the country. Deployed by over 85 health plans,
  including many of the top 20, and representing more than 270
  million lives, Machinify brings together a fully
  configurable and content-rich, AI-powered platform along
  with best-in-class expertise. We’re constantly reimagining
  what’s possible in our industry, creating disruptively
  simple, powerfully clear ways to maximize financial outcomes
  and drive down healthcare costs.

  We're hiring for a Staff and Senior Backend Engineer to join
  our Pay and Audit product teams!

  Our Culture @ Machinify

  We embrace complex challenges with curiosity, having genuine
  interest and drive to understand the hard problems at hand
  and how to move the needle forward. Our engineers empower
  each other to take action, learn deeply about our customers'
  needs and unlock innovation with a strong sense of product
  ownership. We build with our users in mind, thoughtfully
  shipping outcomes, not just features. The technology we
  build shapes real healthcare decisions, demanding a high bar
  for engineering excellence and what we ship carries real
  weight. We pressure-test new AI tools, shape how they're
  used, and set the example for what disciplined, AI-driven
  engineering looks like...fast, but always under structured
  human oversight.

  The Role

  In this role, you'll set technical direction for backend
  development, leverage your deep programming expertise to
  design and build scalable, reliable web application systems
  — working alongside AI coding agents as a core part of how
  you deliver, directing and reviewing their output while
  holding the bar on quality. The ideal candidate has strong
  experience in application design and system architecture,
  along with a proven ability to drive adoption of new
  languages, tools, and agentic development practices across a
  team

  You'll join a highly visible engineering team trusted to
  solve complex, high-stakes problems using the best of AI,
  data and software systems. You're responsible for writing
  code that has a significant impact on our customers and
  future product lines. Our team partners cross-functionally
  to influence product direction, work directly with
  customers, and own systems positively impacting millions of
  lives, where your technical decisions truly matter.

  Click here to learn more about our flagship Pay & Audit
  product lines.

  Does this sound like the right opportunity for you? Let’s
  connect!

  What You’ll Do

  - Deepen your understanding of the healthcare claims and
    payments domain
  - Developer Coach/Multiplier - An experienced Java, Scala
    and/or Rust developer who not only builds production-grade
    services, but also contributes to setting standards,
    mentors others, and elevates the team’s overall
    programming maturity.
  - Backend voice in cross-team planning and the glue in cross-
    functional execution
  - Contribute to new product development of complex in-browser
    applications, taking advantage of your holistic view to
    ensure our application is extensible, scalable, and secure
  - Balance customer-facing features and technical debt cleanup
    to keep the software suite sustainable
  - Architect and implement complex applications that apply ML
    techniques to large volumes of data, simplifying labor-
    intensive processes through good user experience
  - Design systems that work together to deliver a good-
    performing, reliable application
  - Bring agentic engineering practices into the team’s day-to-
    day work and help the team adopt them effectively

  What You Bring

  - 10+ years of experience spread across backend programming
    (additional full-stack experienced highly desired)
  - Proven experience designing and shipping customer-facing web
    application products, you've built features that serve
    external users and you're energized by that kind of work!
  - Meaningful experience with Java or Scala; Rust highly
    desired
  - Experience designing, building, and operating distributed
    systems that run reliably on cloud-services at scale (high
    throughput, high availability)
  - The ability to write a Technical Design Document (TDD) that
    a staff peer trusts and a product lead can understand —
    turning ambiguous product intent into concrete backend
    design
  - A product and user-driven mindset. You connect your
    technical decisions to the people using what you build,
    and you care about the outcome, not just the
    implementation
  - Strong cross-functional collaboration skills with your
    engineering peers, senior PM, ML/DS partners, and
    leadership. You care more about the system landing than
    about being right.
  - A pragmatic default paired with a strong systems instinct –
    you look for root causes, not symptoms.
  - Hands-on experience with agentic engineering tools and
    workflows in a real production setting.
  - Experience reading and understanding complex code, owning
    code quality and improving it
  - Critical thinking and problem solving skills working in a
    high growth environment where stakes are high
  - Comfort with complexity and curiosity to define the path
    forward, not wait for one
  - Nice to have - Provides technical leadership on Rust best
    practices - idioms, safety, and performance as the team
    scales its adoption across greenfield projects
  - BS or MS in Computer Science (or equivalent experience)

  What We Offer

  - Work from anywhere in the US! Machinify is digital-first.
  - Top Medical/Dental/Vision offerings
  - FSA/HSA
  - Tuition reimbursement
  - Competitive salary, 401(k) with company match
  - Unlimited PTO
  - Additional health and wellness benefits and perks
  - Flexible and trusting environment where you’ll feel
    empowered to do your best work

  How We Evaluate Talent

  Our interview process is designed to evaluate candidates
  across our engineering career ladder. The level, title, and
  compensation range we're able to offer are determined by
  your overall performance and the competencies you
  demonstrate throughout the process which allows us to place
  each candidate at the level that best reflects their
  experience and abilities!

  The salary for this position is based on an array of factors
  unique to each candidate: Such as years and depth of
  experience, set skills, certifications, etc.  We are hiring
  for different levels, and our Recruiting team will let you
  know if you qualify for a different role/range. Salary is
  one component of the total compensation package, which
  includes meaningful equity, excellent healthcare, flexible
  time off, and other benefits and perks.

  Pay Range: $200,000-250,000 ~

