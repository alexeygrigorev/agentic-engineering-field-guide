description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.

  As a Lead Software Engineer at JPMorgan Chase within
  Quantitative Execution Strategies Tech, you are an integral
  part of an agile team that works to enhance, build, and
  deliver trusted market-leading technology products in a
  secure, stable, and scalable way. As a core technical
  contributor, you are responsible for building critical
  technology solutions across multiple technical areas within
  various business functions in support of the firm’s business
  objectives.

  Team Overview:

  The QES (Quantitative Execution Strategies) infrastructure
  supports the execution of cross-markets intraday trading
  strategies.  It is a large growth area for JP Morgan’s
  markets franchise, and will see significant additional
  investment over the next year to further our excellence in
  the business. The team's responsibility includes the design,
  build and support of the platform.  The work requires close
  collaboration with our front office partners from sales,
  trading and quantitative research.

  Job Responsibilities:

  - Executes creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems
  - Develops secure high-quality production code, and reviews
    and debugs code written by others
  - Identifies opportunities to eliminate or automate
    remediation of recurring issues to improve overall
    operational stability of software applications and systems
  - Leads communities of practice across Software Engineering to
    drive awareness and use of new and leading-edge
    technologies
  - Acts as a front office developer within the QES technology
    team.
  - Collaborates closely with front office teams (trading,
    structuring) to support the QES platform.
  - Develops platform and visualization components required by
    the desk.
  - Utilizes principal technologies such as Java, Python and
    TypeScript (React) within the team.

  Required Qualifications, Capabilities, and Skills:

  - Formal training or certification on software engineering
    concepts and proficient advanced experience
  - Hands-on practical experience delivering system design,
    application development, testing, and operational
    stability
  - Advanced in Python programming language
  - Excellent analytical skills (i.e. problem solving)
  - Experience in leading an agile delivery team leveraging
    scrum, sprint planning, retrospectives and reporting
    progress to senior stakeholders.

  Preferred Qualifications, Capabilities, and Skills:

  - Experience of working in a front office environment within
    financial services
  - Knowledge of Java, Python, Typescript, React

