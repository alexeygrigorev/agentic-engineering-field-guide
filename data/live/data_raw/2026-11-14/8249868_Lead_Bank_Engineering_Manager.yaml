description: |
  About Lead Bank

  Lead is a banking infrastructure platform trusted by the
  most innovative companies to power complex financial
  products. We enable fintechs to offer compliant,
  programmable services like payments, lending, and digital
  assets at scale. Banking has moved beyond traditional
  institutions and is now embedded directly into everyday
  experiences, meaning companies need modern infrastructure
  that is safe, secure, and operationally sound.

  Today, Lead is one of the only API-first, developer-focused
  partner banks with the financial, regulatory, and legal
  expertise required to help fintechs succeed. We operate
  offices in San Francisco, Sunnyvale, and New York City, and
  an FDIC-insured bank in Kansas City.

  Engineering Team at Lead

  The Engineering team builds and maintains the technology
  that powers Lead's modern banking platform. Partnering with
  the Product, Finance, and Compliance teams, they architect
  secure, scalable financial systems that power money
  movement, credit and lending, card issuing, and account
  products for fintechs. Success requires technical
  excellence, a passion for solving complex infrastructure
  challenges, and the ability to collaborate effectively with
  a diverse set of stakeholders. The team is made up of
  ambitious builders and pragmatic problem solvers who are
  genuinely excited to see their work reach millions of end
  users across the globe.



  Role Description:

  We are looking for a highly skilled and proven engineering
  manager to lead a very experienced engineering team to
  deliver new banking services for enterprise customers, and
  to expand the depth of existing services. This position
  requires exceptional technical and people management skills
  and the ability to form strong partnerships with product
  managers and stakeholders across the organization to define
  and execute on a roadmap that addresses both product goals
  and customer needs.



  The ideal candidate has led highly effective development
  teams of engineers and architects, grown teams via
  mentorship and leadership, and demonstrated extensive
  technical prowess in the cloud-native space, with experience
  operating at scale across a diverse set of technologies with
  a focus on performance, reliability and scalability.

  What You'll Do:

  - You will be leading and expanding a rapidly growing team,
    building a team culture of collaboration, quality,
    innovation, and efficiency, with a relentless focus on
    customer needs.
  - You will collaborate closely with product and business
    teams, setting the roadmap, ensuring the successful
    delivery of high-quality software solutions, and driving
    the continuous improvement of our engineering practices
  - You’ll merge your real-world business instincts and
    understanding with technical skills to innovate and impact
    the company
  - You will be working across multiple disciplines within a
    dynamic, fast-growing company to deliver impactful
    outcomes. You'll bring order and focus while leaving room
    for flexibility and innovation
  - Perform all other duties as assigned

  Qualifications:

  - 8+ years of experience in software engineering, with
    demonstrated success designing and building large scale
    distributed systems. Experience in building financial
    systems or platforms is a huge plus.
  - 2+ years of engineering management, with a proven track
    record of delivering high quality products, hiring, and
    leading teams
  - Experience building products from the ground up
  - Ability to define and effectively communicate technical
    vision, and inspire the team around a shared vision for
    success
  - Experience building and nurturing cultures of operational
    excellence and a track record of successfully scaling
    teams
  - Ability to set a roadmap and goals for a team and every one
    of its members, delegate intelligently, offer engineering
    advice, deliver frequent and transparent feedback, work
    with team members to grow in their careers, and ensure
    everyone delivers quality results
  - Exceptional written and verbal communication and ability to
    communicate directly and clearly, with a strong emphasis
    on careful listening
  - Previous exposure to making business-level tradeoffs,
    balancing the needs of our customers with those of our
    business and clearly communicating the rationale behind
    your decisions
  - Good instincts matched with deep analytical thinking. You're
    comfortable defining and tracking key business and usage
    success metrics, but also recognize that metrics never
    tell the whole story
  - Real passion to understand customer needs and a strong
    motivation to solve their problems rather than focusing on
    technology as an end in itself

  What we offer:

  - At Lead, we design our benefits to support company culture
    and principles, to foster an efficient and inspiring work
    environment, and to create the conditions for our team to
    give their best in both work and life
  - Competitive compensation, including opportunities for equity
    grants, based on experience, geographic location, and role
  - Medical, Dental, Vision, Life, 401k Matching, and other
    wellness benefits, including FSA, HSA and HRA
  - Paid parental leave
  - Flexible vacation policy, including PTO and paid holidays
  - A fun and challenging team environment in a dynamic industry
    with ample opportunities for career growth

  *Lead Bank is proud to have an inclusive culture committed
  to ensuring equal employment opportunity in all employment
  decisions regardless of race, color, gender, national
  origin, religion, age, disability, sexual orientation,
  gender identity, military status, veteran status or any
  other legally protected status.



  *Reasonable accommodations may be made to enable individuals
  with disabilities to perform essential functions.



  *Pursuant to the San Francisco Fair Chance Ordinance, we
  will consider for employment qualified applicants with
  arrest and conviction records.



  **Our compensation reflects the cost of labor across several
  US geographic markets. Pay is based on a number of factors
  and may vary depending on geographical market location, job-
  related knowledge, skills, and experience. These ranges may
  be modified in the future.



