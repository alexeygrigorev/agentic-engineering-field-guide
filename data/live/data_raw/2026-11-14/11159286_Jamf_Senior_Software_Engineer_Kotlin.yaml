description: |
  At Jamf, we believe in an open, flexible culture based on
  respect and trust. Our track record and thriving work
  environment all stem from the freedom we grant ourselves to
  get the job done right. We take pride in helping tens of
  thousands of customers around the globe succeed with Apple.

  The secret to our success lies in our connectivity, while
  operating with a high degree of flexibility. Work-life
  balance remains our priority while feeling connected is
  important to maintain our strong culture, achieve our goals,
  and thrive as #OneJamf.

  This role is offered as a hybrid role from London, the
  United Kingdom, with the expectation to come to the office
  at least once per month. We are only able to accept
  applications from those based in the UK or who have
  sponsorship to live and work in the UK. #LI-Hybrid

  What you’ll do at Jamf:

  At Jamf, we empower people to be their best selves and do
  their best work.

  Jamf is consolidating functionality onto our Platform, by
  migrating products and services to a new and existing
  Portal.  Right now, some areas sit outside that platform and
  miss out on improvements that other products already have.
  This migration fixes that, and you'll be one of the
  engineers building the services that make it happen.

  Once the current release cycle wraps, the team shifts focus
  to picking up Kotlin. If you enjoy mentoring and want a hand
  in leveling up a team's skill set alongside your own, this
  is a good time to join.



  Our Tech Stack:

  - Kotlin
  - Spring Boot
  - REST API
  - Microservices architecture
  - AWS



  What you can expect to do in this role:

  - Break down customer problems into work you and the team can
    execute on.
  - Independently complete tasks from start to finish with high
    quality.
  - Ability to communicate technical concepts to stakeholders.
  - Use your knowledge of Engineering best practices to ask the
    right questions, solve problems and build great software
    with a high level of quality.
  - Produce designs for new and existing features.
  - Clearly communicate technical concepts with others in the
    organization (Technical Communication, Support, Product
    and Cloud).
  - Performs all job responsibilities in alignment with the core
    values, mission and purpose of the organization.
  - Adheres to the highest moral, ethical and legal standards to
    deliver and environment that promotes respect, innovation
    and creativity.
  - Supports and promotes a positive, inclusive workplace one in
    which the talents and strengths of our increasingly
    diverse workforce are welcomed, further developed and
    manifested in our work.



  What we are looking for:

  Required skills and experience:

  - Minimum of 5 years of experience developing enterprise-grade
    software with an understanding of testing and quality
    assurance processes.
  - Minimum of 5 years of demonstrated experience in current
    programming language and tools based on position
    requirements (Kotlin, Spring Boot, AWS).

  Preferred skills and experience:

  - General experience with performance and load testing
    applications
  - Hands-on experience with AI-driven coding assistants like
    GitHub Copilot, Cursor, and others to enhance development
    productivity.
  - Experience building enterprise-level software.
  - Comfortable working in an agile team and adapting as
    priorities shift during a platform migration.
  - Track record of mentoring or coaching other engineers.
  - Strong communication skills.
  - Proven analytical and problem-solving skills.
  - Ability to interact effectively with co-workers in a
    results-driven culture.
  - Ability to engage with and establish trust and rapport with
    all levels of customers and employees.
  - Solution-focused ability to work collaboratively in a fast-
    paced environment.
  - Apple platform experience.

  EDUCATION

  - 2 year / Associates (Required).
  - 4 year / Bachelors Degree (Preferred).
  - A combination of relevant experience and education may be
    considered.

  Why Jamf?

  - Named a 2025 Best Companies to Work For by U.S. News
  - Named a 2024 Best Technology Company to Work For by U.S.
    News
  - Named one of Forbes Most Trusted Companies in 2024
  - We constantly push the boundaries of technology, our
    developers support new innovations and OS releases the
    moment they are made available by Apple.
  - Several Jamf engineers are named in patents and with team
    names like CatDog, ThunderSnow and Dalek you can expect to
    have some fun while building cutting-edge software.
  - You will have the opportunity to work with a small and
    empowered team where the culture is based on trust,
    ownership, and respect.
  - Visit our Jamf Engineering blog to learn more about the
    innovative projects our team is working on and what we
    learn from each challenge we solve. A blog written by
    engineers, for engineers at https://engineering.jamf.com



  What it means to be a Jamf? We are a team of free-thinkers,
  can-doers, and problem-crushers. We value humility and the
  relentless pursuit of knowledge. Our culture flows from a
  spirit of selflessness and relentless self-improvement -
  driving both personal growth and collective progress
  throughout our company. We unite around common goals while
  respecting personal approaches, believing that fulfilled
  individuals create a thriving, vibrant workplace.

  Our aim is simple: hire exceptionally good people who are
  incredibly good at what they do and let them do it. We
  provide the support and resources to let everyone be their
  authentic, best selves at work, at rest, and at play. We are
  committed to supporting the continual improvement of Apple
  in the workplace, the organizations that rely on them and
  the people who keep it all running smoothly.

  Above it all, waves our banner of #OneJamf – and the
  knowledge that when we stand together, we accomplish so much
  more than we could alone. We seek individuals who share this
  unwavering journey toward growth to join us in our quest for
  constant improvement.

  What does Jamf do? Jamf extends the legendary Apple
  experience people enjoy in their personal lives to the
  workplace. We believe the experience of using a device at
  work or school should feel the same, and be as secure as,
  using a personal device. With Jamf, customers are able to
  confidently automate Mac, iPad, iPhone and Apple TV
  deployment, management, and security – anytime, anywhere –
  to protect the data and applications used by employees in
  the workplace, students learning in the classroom, and
  streamline communications in healthcare between patients and
  providers. More than 2,500 Jamf strong worldwide, we are
  free-thinkers, can-doers, and problems crushers who are
  encouraged to bring their whole selves to work each and
  every day.

  Get social with us and follow the conversation at #OneJamf

