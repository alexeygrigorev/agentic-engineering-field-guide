description: |
  ABOUT ROCKET MONEY 🔮

  Rocket Money’s mission is to meaningfully improve the
  financial prosperity of millions of people. Rocket Money
  offers members a unique understanding of their finances and
  a suite of valuable services that save them time and money –
  ultimately giving them a leg up on their financial journey.

  ABOUT THE TEAM 🤝

  The Premium team owns everything related to converting our
  users to Premium and keeping them successfully subscribed.
  We build and operate the end-to-end purchasing and billing
  experience—including a Stripe integration, purchasing
  through Apple/Google IAP, subscription infrastructure,
  invoicing, and post-purchase subscription management.

  We care deeply about delivering the best experience for our
  users, correctness, and resiliency. This team is perfect for
  you if you’re excited to work on highly reliable and
  mission-critical systems that move millions of dollars
  daily.

  IN THIS ROLE, YOU'LL:

  - Build and ship Premium management features across Stripe,
    in-app purchases (Apple IAP / Google IAP), credit card
    payment flows, and post-purchase lifecycle management.
  - Own projects end-to-end: problem definition, technical
    design, implementation, rollout, and ongoing reliability.
  - Partner closely with our product partners, data teams, and
    operations partners to create systems that are safe,
    scalable, and pleasant to use.
  - Improve reliability and observability across critical
    workflows by instrumenting services, debugging production
    issues, and raising engineering standards.
  - Write clear design docs and RFCs, participate in code
    reviews, and contribute to a culture of thoughtful
    feedback and continuous improvement.
  - Drive technical direction: propose architectures, evaluate
    tradeoffs, and influence the team’s product and technical
    roadmap.
  - Mentor and unblock others: coach mid-level engineers, pair
    on tricky problems, and share best practices.

  ABOUT YOU 🦄

  - You have 8+ years of professional experience working with
    some combination of Node.js/TypeScript, React (or similar
    framework), Postgres (or similar relational database), and
    asynchronous queuing systems like SQS. Experience with
    GraphQL is a plus.
  - You're not just interested in what you're building, but also
    why you're building it. You want to see the bigger picture
    of how the software you‘re building is benefitting our
    users.
  - You are highly autonomous. You can take an ambiguous
    problem, align with stakeholders, and drive it to a
    reliable production outcome.
  - You are data-driven: You define success metrics up front,
    instrument what needs to be measured, and apply a working
    knowledge of analytics to interpret experiment results so
    that we can be confident in our product decisions.
  - You want to use the best tools for the job, including AI
    tools.
  - You’re effective in a large organization, building trust
    across teams, untangling ownership and dependencies, and
    maintaining momentum from ambiguity through execution.
  - You understand how observability impacts reliability and
    enjoy digging into the details to solve performance, data
    accuracy, and user experience issues.
  - You have a collaborator’s mindset and dig deep to understand
    nuanced and multi-faceted problems and tenaciously break
    them down into tractable pieces. You love giving and
    receiving feedback, and considering new and novel ideas.

  BONUS POINTS FOR ✨

  - ACH and credit card payments experience
  - Payment processor experience: You have experience with
    Stripe, Apple IAP, or Google IAP
  - Privacy & sensitive data experience: You understand
    technical considerations around handling PII and PIFI
  - AI: You’ve found ways to responsibly use AI tools to
    accelerate exploration, implementation, debugging, and
    iteration while still maintaining high code quality and
    diligence standards.

  WE OFFER 💫

  - Health, Dental & Vision Plans
  - Life Insurance
  - Long/Short Term Disability
  - Competitive Pay
  - 401k Matching
  - Team Member Stock Purchasing Program (TMSPP)
  - Learning & Development Opportunities
  - Tuition Reimbursement
  - Unlimited PTO
  - Daily Lunch, Snacks & Coffee (in-office only)
  - Commuter benefits (in-office only)

  Additional Information: Salary range of $150,000 -
  $185,000/year + bonus + benefits. Base pay offered may vary
  depending on job-related knowledge, skills, and experience.

