description: |
  About Parambil

  The legal industry moves billions of dollars on the backs of
  antiquated, manual processes. Personal injury lawyers spend
  countless hours buried in medical records, trying to extract
  the critical details that make or break their cases. It's
  slow, expensive, and error-prone.

  Parambil is changing that.

  We've built an AI-powered platform that transforms how law
  firms review medical records — turning weeks of manual work
  into minutes of intelligent analysis. Our technology helps
  attorneys quickly identify key medical facts, build stronger
  cases, and serve their clients better.

  We're trusted by top personal injury law firms and major
  enterprises like cruise lines to handle their most critical
  legal workflows. This year alone, we 10x'd our revenue and
  customer base — and we're just getting started.

  Parambil is backed by $8M from leading investors including
  Bling Capital, NVP, and Daybreak (with $6M raised just this
  quarter). We're led by technical founders from McKinsey
  QuantumBlack, Yale/Stanford Medicine, and Emory CS, and
  advised by post-exit CTOs and AI professors. Our team is
  small, technical, and moving fast — and we're building the
  future of legal AI from our NYC office near Grand Central.

  What We’re Looking For

  We’re looking for a builder - someone who can model complex
  problems, design elegant systems, and ship production-grade
  features end to end. You’ll work closely with designers,
  engineers, and product leaders who care deeply about the
  craft of software and solving meaningful problems.

  - 6+ years building and shipping full-stack web apps -
    experience with Next.js, React, TypeScript, or PostgreSQL
    is a plus
  - Strong backend experience - comfortable designing APIs,
    managing authentication, handling data migrations, and
    integrating third-party services (we use tools like
    Prisma, Auth0, OpenAI, and Stripe)
  - Deep AWS and infrastructure expertise - designing,
    deploying, and monitoring production systems using
    Terraform, ECS, EC2, and supporting services like Lambda,
    RDS, and CloudWatch
  - Solid understanding of data modeling, performance
    optimization, and secure infrastructure.
  - Excellent communicator who thrives in collaborative, cross-
    functional teams and values clear thinking and
    craftsmanship

  Your Role

  - Build features end-to-end - from system design to production
    delivery
  - Work directly with lawyers and domain experts to understand
    problems and model solutions using cloud, web, and AI
    infrastructure
  - Communicate technical ideas, constraints, and trade-offs
    clearly
  - Provide guidance to other engineers, ensuring smooth
    collaboration and delivery
  - Help shape and scale our engineering process as the product
    and team grow

  What We Offer

  - Meaningful, challenging work solving a mission-critical
    problem in legal tech
  - Medical Insurance, 401K
  - A close-knit startup culture in our NYC office
  - Competitive salary range: $150K–$220K Base + Equity
  - Full-time, in-person role in New York City - we value real
    collaboration and spontaneous problem-solving

  Why Parambil?

  - Ownership & Impact: You’ll build meaningful features that go
    live quickly
  - Elite Team: Build alongside the best talent in NYC
  - Fast Growth: Your work will directly shape our product and
    company trajectory
  - Equity: You’ll own a piece of what you’re building
  - Culture: We’re a tight-knit, no-ego team that values
    curiosity, speed, and execution
