  Greetings Everyone



  Who are we?





  For the past 20 years, we have powered many Digital
  Experiences for the Fortune 500. Since 1999, we have grown
  from a few people to more than 4000 team members across the
  globe that are engaged in various Digital Modernization. For
  a brief 1 minute video about us, you can check
  https://youtu.be/uJWBWQZEA6o.



  What will you do?     What are we looking for?  Position
  Summary



  If you’re eager to make a real impact in healthcare through
  meaningful contributions, explore a technology role. We’re
  looking for engineers who are passionate about innovation,
  problem-solving, and building modern cloud-based systems
  that shape the future of care delivery.



  As a Backend Developer, you will play a key role in
  designing, developing, and deploying high-quality software
  solutions. You will collaborate across teams, contribute to
  architectural decisions, and support large-scale platforms
  that enhance customer and patient experiences. This role
  offers the opportunity to grow your engineering expertise
  while working in a dynamic, agile, and highly collaborative
  environment.



  Responsibilities



  • Collaborate with the team to design and implement backend
  components and system architecture.



  • Deploy and maintain large-scale production software with a
  focus on reliability and operational excellence.



  • Write and execute unit tests, perform code reviews, debug
  issues, and ensure system stability.



  • Translate business requirements into well‑structured
  software solutions in an agile environment.



  • Work closely with cross-functional teams to deliver
  integrated, scalable, and high-performing systems.



  • Tackle complex challenges involving structured and
  unstructured data while expanding technical capabilities.




  Required Qualifications



  • 5+ years of experience building software solutions in
  cloud environments (preferably Google Cloud Platform).



  • 5+ years of hands-on experience in modern programming
  languages such as Python, Java, C#, JavaScript, or SQL.




  Preferred Qualifications



  • Strong written and verbal communication skills.



  • Experience with complex systems and solving
  analytical/engineering challenges.



  • Familiarity with Jenkins, Git, CI/CD pipelines, and DevOps
  best practices.



  • Understanding of the software development lifecycle
  (SDLC).



  • Knowledge of GCP architecture, commands, and cloud-native
  design patterns.



  • Ability to use multiple tools/languages to work with
  diverse data sources.



  • Experience building APIs, microservices, and modern
  software patterns.



  • Healthcare industry experience is a plus.




  Education



  • Bachelor’s degree or equivalent experience in Computer
  Science, Information Systems, Data Engineering, Data
  Analytics, Machine Learning, or a related field.



  • Master's degree preferred.




  Location



  - Texas, Chicago, NY - Photon Offices



  Compensation, Benefits and Duration



  Minimum Compensation: USD 40,000 Maximum Compensation: USD
  140,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
