title: Senior Software Engineer, Product
company: Confido
location: New York, USA
work_type: FULL_TIME
company_size: 100 Employees
description: |
  The brands on your kitchen shelf are run by people doing
  extraordinary work that nobody sees.  We're building the
  platform they run on, and a brand they'll be proud to be
  part of. Confido is the AI operating system that runs cash
  application, deductions, trade and planning in one place for
  CPG brands. That means Finance, Sales, and Ops finally work
  on the same number. We’re trusted by 250+ brands managing
  $30B+ in revenue, including Daisy, OLIPOP, Simple Mills,
  Idahoan, and more. We've achieved best-in-class growth and
  recently raised a $55M Series B led by Insight Partners to
  accelerate our momentum.

  If you want your work on shelves everywhere — and outsized
  ownership while you build — we'd love to meet you.

  The Role

  As a Senior Software Engineer (Platform/Core), you will help
  build the core infrastructure and product systems that power
  the Confido platform. This includes everything from large-
  scale data pipelines and financial analytics systems to AI-
  powered workflows used by leading CPG brands.

  You’ll work closely with engineering, product, and customers
  to turn complex operational workflows into reliable,
  scalable software.

  Location: New York, NY (Relocation supported)

  What You'll Do

  - Build and scale the core platform that powers financial
    workflows for CPG brands
  - Develop systems for ingesting and processing financial and
    operational data from multiple sources
  - Build backend services and APIs that power analytics,
    forecasting, and automation features
  - Implement AI-powered workflows for document processing and
    financial data extraction
  - Design intuitive product experiences that turn complex
    financial data into actionable insights
  - Work directly with product and occasionally customers to
    understand workflows and ship solutions quickly

  Example Problems

  - AI-powered ingestion of invoices, deductions, and retailer
    reports
  - Scaling data pipelines that ingest financial data from
    multiple retailer systems
  - Building analytics infrastructure for forecasting and demand
    planning
  - Designing internal tools and product features that simplify
    complex financial workflows
  - Improving performance and reliability across core platform
    services

  What We're Looking For

  Required

  - 6+ years of software engineering experience
  - Strong backend engineering skills and systems design
    experience
  - Comfort building production systems that handle large
    datasets or complex workflows
  - Strong product instincts and ability to work across
    engineering and product

  Nice to Have

  - Experience working with AI/ML-powered systems
  - Experience with data pipelines or analytics infrastructure
  - Experience working directly with customers or cross-
    functional stakeholders
  - Interest in early-stage startups and high-ownership roles
  - CS degree or equivalent experience

  More about Engineering @ Confido

  🌴 Perks + Benefits

  - Equity — own a meaningful piece of the company you’re
    helping build
  - Fully paid health coverage through Aetna — we cover 100% of
    employee premiums
  - Top-tier dental and vision coverage through Guardian
  - Carrot Fertility Pro — comprehensive fertility and family-
    forming support
  - 12 weeks of paid parental leave
  - Unlimited PTO — plus regular 4-day holiday weekends we
    actually take
  - 401(k) through Vestwell
  - Paid relocation support — we’ll help you make the move to
    NYC
  - Fully equipped workspace from day one — laptop, monitor,
    keyboard, and a $200 stipend to personalize your setup
  - Team perks — catered Friday lunches, team dinners, and
    unlimited coffee + snacks featuring products from the
    brands we work with

  Confido provides equal employment opportunities to all
  employees and applicants for employment and prohibits
  discrimination and harassment of any type without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetics, protected veteran status, sexual
  orientation, gender identity or expression, or any other
  characteristic protected by federal, state or local laws.
