description: |
  Overview

  At Opencall, we’re building AI call centers for medical
  services.

  We’re solving a unique challenge: pushing the limits of AI
  at millisecond performance to have the best human-like
  customer service experience at enterprise scale. Our AI is
  faster, cheaper, more powerful, and more reliable than
  anything else on the market. We’re looking for versatile
  engineers to help scale our proprietary system from millions
  of calls to billions of calls annually and build out new
  product lines that our customers are already asking for.

  Role: Staff Software Engineer

  As a Staff Software Engineer at OpenCall, you’ll operate as
  a technical leader within the engineering team. You’ll
  partner closely with founders, product, and engineering to
  identify the highest-impact problems, define technical
  direction, and deliver scalable solutions.

  Key Responsibilities

  You’ll work across our realtime voice platform, customer
  dashboard, agent runtime, and analytics pipeline, balancing
  product needs with the technical requirements of building
  reliable AI systems at scale.

  - Technical Ownership
    - Own critical systems across our realtime voice platform,
      agent runtime, and infrastructure from design through
      execution.
    - Define architecture, technical direction, and engineering
      standards for complex projects.
    - Partner with product and business teams to identify
      opportunities and tradeoffs.
  - Architecture & Scale
    - Design and evolve systems capable of supporting 100x growth
      in traffic and complexity.
    - Make high-leverage architectural decisions across our
      realtime voice platform, agent runtime, customer
      dashboard, and analytics infrastructure.
    - Solve problems involving real-time latency, voice quality,
      reliability, distributed systems, and operational scale.
  - Leadership
    - As a technical leader, you’ll raise the engineering bar
      through mentorship, technical guidance, and strong
      engineering practices.

  Qualifications

  - Education
    - BS or MS degree in Computer Science, Engineering, or a
      related field.

  - Experience
    - 10+ years of software engineering experience, with
      demonstrated ownership of large-scale systems or complex
      technical initiatives.

  Requirements

  - Staff-Level Expectations
    - Experience leading technical direction for large, ambiguous
      projects.
    - Track record of designing and scaling production systems.
    - Ability to make pragmatic engineering decisions with
      incomplete information.
    - Experience mentoring engineers and improving engineering
      practices.
    - Strong product judgment and ability to balance technical
      excellence with business impact.
  - Technical Skills
    - Proficiency in Python and Typescript.
    - Experience building customer-facing applications with modern
      frontend frameworks (React preferred).
    - Strong foundation in computer science fundamentals,
      including data structures, algorithms, databases,
      networking, and software design principles.
    - Passion for maintainable systems and thoughtful engineering
      practices.
  - Soft Skills
    - Ownership mindset: Comfortable operating independently,
      making decisions with limited information, and driving
      projects from idea to production.
    - Strong communication: Clearly communicating technical
      concepts is an underrated skill
    - Strong product sense: We’re in a new space and there’s no
      mainstream equivalent of what we’re building. Defining
      what to build, not just how to build it, is part of the
      job
    - Ambition: Excited to solve hard technical problems where the
      right solution is not obvious.

  Nice to Haves

  - Experience designing and scaling distributed systems and
    infrastructure in production environments.
  - Experience building real-time systems, telephony/SIP
    infrastructure, video chat platforms, data engineering
    platforms, or other latency-sensitive applications..
  - Experience operating production systems in cloud
    environments (AWS, GCP, Azure, etc.).
  - Experience working in early-stage environments with high
    autonomy and ambiguous requirements.

  FAQ

  What motivates us?

  - We hate bad customer service and the “press 1, press 2”
    headache. Let’s get end customers what they want without
    the suffering.

  Company outlook?

  - We have more customers than we can handle. That’s why we
    need you!

  Can I work from anywhere?

  - We prefer candidates in San Francisco or New York, but are
    open to exceptional remote applicants.
