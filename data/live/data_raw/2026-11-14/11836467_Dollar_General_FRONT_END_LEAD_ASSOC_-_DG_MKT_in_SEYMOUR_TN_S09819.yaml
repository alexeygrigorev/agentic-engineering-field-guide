description: |
  Job Details General Summary:

  Under general supervision, lead front-end sales associates
  in the replenishment of front end impulse fixtures and
  ensure exceptional service is provided to each customer.
  Provides support to other managers as requested.

   Duties and Essential Job Functions

  Lead the work of sales associates serving as cashiers
  including six to eight active registers.Operate cash
  register and flatbed scanner as needed to provide great
  customer service.Authorize voids and overrides; count
  register; make bank deposits.Assist in maintaining strict
  cash accountability, key control, and adherence to company
  security practices and cash control procedures.Monitor cash
  levels and make appropriate drawer pulls as directed by the
  Store Manager.Monitor cameras for unusual activities
  (customers and employees), if applicable.Supply cashiers
  with change when needed.Complete all required paperwork and
  documentation according to guidelines and deadlines as
  assigned.Responsible for training new cashiers;Cash handling
  policies and proceduresProper Scanning techniqueEngaging the
  customerCashier selling activityAsking for additional front
  end help when lines start to back upResponsible for the
  sanitation and execution of the front end cleaning schedule.
  Job Qualifications

   KNOWLEDGE, SKILLS and ABILITIES:

  Ability to perform mathematical calculations such as
  addition, subtraction, multiplication, division, and
  percentages.Knowledge of cash handling procedures including
  cashier accountability and deposit control.Ability to
  perform cash register functions.Knowledge of cash, facility
  and safety control policies and practices.Effective
  interpersonal and oral & written communication
  skills.Understanding of safety policies and
  practices.Ability to read and follow plan-o-gram and
  merchandise presentation guidance.Knowledge of and
  willingness to comply with company policies and procedures
  as outlined in the Standard Operating Procedures manual,
  Employee Handbook, and company communications.Ability and
  willingness to obtain required certifications in food
  handling.

   Work Experience and/or Education

  High school diploma or equivalent.One to two years of retail
  clerk experience.Previous lead experience and/or grocery
  store experience preferred.Attainment of required local and
  state food handling certifications, if applicable.

   Working Conditions

  Frequent walking and standing.Frequent bending, stooping and
  kneeling to run check out station, stock merchandise and
  unload trucks.Frequent handling of merchandise and equipment
  such as hand-held scanners, pricing guns, box cutters,
  hoses, merchandise containers, two-wheel dollies, and
  U-boats (six-wheel carts).Frequent and proper lifting of up
  to 40 pounds; occasional lifting of up to 55
  pounds.Occasional climbing using ladder.Fast-paced
  environment; moderate noise level.Occasionally exposed to
  outside weather conditions.Occasionally exposed to hazardous
  cleaning solutions.Occasionally exposed to slippery floor
  surfaces.May be exposed to extreme cold in freezers.

