description: |
  Join Us at 55ip & Help the Wealth Management Industry Move
  Forward

  Working at 55ip means standing at the intersection of
  finance and technology—and at the cutting-edge of wealth
  management. We’ve been making rapid progress on our mission:
  to break down barriers to financial progress for financial
  advisors and their clients. Our Boston and Mumbai based
  teams have built and brought to market a tax-smart
  investment strategy engine delivering an intuitive
  experience and intelligent automation. Driven by strategic
  partnerships with world-class asset management firms, we’ve
  experienced breakthrough growth over the last two years.
  Today, over 110 financial advisor firms with $28 billion in
  assets (and counting) are using 55ip.



  If we look a little different, it’s because we are. We’re
  entrepreneurs, product pros, technology enthusiast,
  investment scientists, and customer advocates who aim to
  deliver an exceptional experience—and have fun doing it.
  Like lots of companies, we’ve got a deep bench of smart,
  talented, creative people, but our superpower lies in our
  hustle. That extra push when others would quit, that new
  approach nobody else has tried, that ability to thrive at
  30,000 feet or dig into the details—and to do it all with
  humility, empathy, and respect. As we enter an exciting new
  chapter as a separately-branded subsidiary of J.P. Morgan,
  we’re looking for top talent—with hustle—to join us on our
  path to becoming an industry standard.

  Position Description:

  55ip is looking for an experienced software development
  manager to lead the 55IP platform that forms the backbone of
  its technology-enabled investment platform for large
  investment advisory (RIA) & wealth management firms. The
  ideal candidate for this role has successfully designed,
  delivered and maintained large-scale systems for the
  financial services and / or capital markets’ domain. The
  candidate has successfully demonstrated the ability to lead
  and manage a team of 3-5 software developers. The candidate
  will be a motivated and responsible individual; a problem
  solver; a team player and an empathetic leader; and a
  proficient software developer, looking to make a significant
  impact on a fast-growing company.

   Responsibilities:

  - The end-to-end development, enhancement and maintenance of
    55ip’s market data platform

  - Partner with many stakeholders to define & deliver
    innovative solution to functional requirements

  - Identify, prioritize and allocate tasks to effectively
    deliver to the firm’s technology objectives.

  - Architect & develop data ETL processes and data objects.

  - Build mentor & manage a team of software developers and
    testers.

  - Planning and running agile-scrum sprints.

  - Ensure the team (a) delivers high quality coding standards
    through code reviews; (b) conducts thorough unit /
    functional testing; and (c) provides support during UAT &
    post go-live phases.

  Qualifications / Skillsets:

  - 12- 14 years of experience in software development.

  - Recent experience in leading & mentoring a scrum team.

  - Proficient in Python, Django, Pandas, GitHub / Bit-Bucket,
    Jira, PostgreSQL, and SQL scripting

  - Demonstrated experience of designing and executing high-
    scale data projects

  - Clear understanding of OOPs and software design constructs &
    their implementation using Python

  - Expertise in all aspects of software development lifecycle,
    especially Agile Scrum.

  - Exposure to financial capital markets data and trading
    applications

  - Hands-on-experience of RabbitMQ, Redis & NoSQL is a nice to
    have

  - Understanding of R is a nice to have.

  - Bachelor’s degree (or equivalent) in Computer, Electronic or
    IT Engineering.

  - Strong communication (written and oral) and analytical
    problem-solving skills.

  - Attention to detail, pride in delivering high quality work
    and willingness to learn.

  Grade: Vice President

  About 55ip

  55ip is a financial technology company whose purpose is to
  break down barriers to financial progress. Wealth management
  enterprises and financial advisors use 55ip’s tax-smart
  investment strategy engine to dramatically improve their
  efficiency and effectiveness. 55ip’s intuitive experience
  and intelligent automation elevate portfolio design and
  delivery, helping advisors save time and drive better
  outcomes for their clients. At the heart of the experience
  is 55ip’s ActiveTax® Technology, which includes tax-smart
  transitions, management, and withdrawals. 55ip is becoming
  the industry standard by connecting to platforms where
  advisors manage their client accounts, enhancing workflow
  and reducing the need to move the assets. More information
  is available at https://55-ip.com/

  About Us



    JPMorganChase, one of the oldest financial institutions,
  offers innovative financial solutions to millions of
  consumers, small businesses and many of the world’s most
  prominent corporate, institutional and government clients
  under the J.P. Morgan and Chase brands. Our history spans
  over 200 years and today we are a leader in investment
  banking, consumer and small business banking, commercial
  banking, financial transaction processing and asset
  management.




