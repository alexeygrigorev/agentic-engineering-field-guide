description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission

  We are looking for a Principal/ Senior Staff Engineer,
  Experimentation Platform to elevate the systems that power
  trusted decision-making at Zocdoc.

  In this high-impact role, you will define platform
  standards, lead complex cross-domain initiatives, and shape
  the future of our analytics and data infrastructure. Your
  work will ensure our data ecosystem is secure, reliable,
  compliant, performant, and cost-efficient—enabling teams
  across Product, Engineering, Operations, and Leadership to
  move confidently with trusted insights.

  This is a senior individual contributor role open to remote
  candidates across the United States.

  You’ll enjoy this role if you are…

  - Motivated by designing scalable data platforms that serve
    hundreds of stakeholders.
  - Passionate about building clean, governed, and secure data
    systems.
  - Known for improving reliability, performance, and cost
    efficiency.
  - Comfortable operating as a technical authority without
    formal management.
  - Energized by raising standards across analytics,
    infrastructure, and governance.
  - Interested in solving complex data challenges in healthcare.

  Your day to day is…

  - Architecting and improving orchestration, monitoring, and
    data reliability systems.
  - Defining modeling, semantic layer, and governance standards
    across teams.
  - Optimizing warehouse performance and reducing compute spend.
  - Implementing secure access controls and strengthening
    compliance practices.
  - Partnering with Engineering to improve upstream data quality
    and contracts.
  - Leading cross-functional initiatives that modernize and
    future-proof Zocdoc’s data platform.
  - Mentoring engineers and guiding architectural decisions.

  You’ll be successful in this role if you have…

  - 10+ years of experience in Data Engineering, Analytics
    Engineering, Experimentation Platform Engineering, or
    Backend Software Engineering.
  - Operated at Staff-level scope with cross-team technical
    influence.
  - Expert SQL skills and strong proficiency in Python or
    similar languages.
  - Deep experience with Snowflake, BigQuery, Redshift, or
    similar warehouses.
  - Hands-on experience with dbt and orchestration tools like
    Airflow or Dagster.
  - Experience improving pipeline reliability, observability,
    and system performance.
  - Proven ownership of warehouse cost optimization.
  - Experience implementing secure data access patterns and
    working in regulated environments.
  - Strong communication skills and ability to influence across
    technical and non-technical stakeholders.

  Benefits

  - Flexible work environment
  - Unlimited Vacation(if salaried) / Competitive PTO (if
    hourly)
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified

