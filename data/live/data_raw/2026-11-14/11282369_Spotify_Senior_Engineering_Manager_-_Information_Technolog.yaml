description: |
  The Platform team creates the technology that enables
  Spotify to learn quickly and scale easily, enabling rapid
  growth in our users and our business around the globe.
  Spanning many disciplines, we work to make the business
  work; creating the infrastructure, tooling, frameworks, and
  capabilities needed to welcome a billion customers.



  The IT Studio exists to remove the friction of work,
  unblocking Spotifiers anywhere, anytime, with simplicity and
  safety. We are the team behind the technology that
  approximately 8,000 Spotifiers rely on every day, spanning
  endpoint and device management, identity and access,
  networking and connectivity, IT service management and
  support, audio visual and meeting room technology,
  productivity and collaboration platforms, work management
  tooling, and the AI tools changing how everyone at Spotify
  works. Across 9 teams, we touch almost every part of how
  Spotify functions as a company.



  We’re looking for an experienced engineering leader to lead
  a group of Engineering Managers and approximately 50
  engineers and technicians across the studio. You’ll set
  engineering strategy, strengthen the technical practices
  that help our teams operate at their best, and partner
  closely with product and studio leadership to balance
  engineering investment with business priorities.

