description: |
  Job Title

  Software Test Engineer

  Location

  Global

  Position Type

  Volunteer

  Job Description

  Volunteer Position We are seeking full time and volunteer
  professional Software Test Engineers. We have product teams
  that work in various frameworks and platforms including.
  Bloom - C#, Typescript + React, CSS, SQL, and Java Paratext
  - C#,.React, Net development, XML/HTML/CSS SIL International
  is a faith-based nonprofit organization committed to serving
  translation teams worldwide. If you believe, as we do, that
  all languages are of value, form an integral part of
  people’s identity, and have the potential to serve them in a
  rapidly changing world, then you can be part of a software
  team serving translation teams worldwide. Summary: A
  Software Test Engineer is responsible for designing and
  implementing software testing. Testing software products as
  early and often as possible is proven to improve the
  resolution of the quality picture and thus enable the
  software development team to objectively improve the quality
  of the software. The test cases for our software products
  are developed by the people with the most knowledge of the
  product. The output of the effort is a list of procedure-
  based test cases encompassing the desired test coverage.
  This position is intended to execute the test cases daily
  and at release milestones.

  Major Responsibilities:

  - Manually execute scheduled tests as written, on time
  - Participate in reviews for new test cases developed
  - Report issues found into issue tracking systems
  - Report status at team standups
  - Manually perform Ad-Hoc testing
  - Work with Software Test Manager to collaborate, review, and
    deliver high quality software testing
  - Participate as an integral and enthusiastic part of the
    team, exhibiting ownership, follow-through, initiative,
    awareness, and effective communication with peers and
    management
  - Work with the team around a cohesive team roadmap

  Minor Responsibilities:

  - Participate in regular project status, planning,
    partnership, and strategic meetings
  - Be available to travel to software development team meetings
    as needed
  - Be available to travel biannually to the Language Technology
    Conference
  - Participate in professional meetings

  Knowledge, Skills, and Abilities:

  - A servant heart attitude
  - Demonstrated knowledge of QA process: different levels,
    types and methods of testing: unit, functional, negative,
    integration, performance, reliability, stress, user
    scenario, visual
  - Demonstrated knowledge of Black, Grey, and White box
    testing.
  - Strong written and verbal skills
  - Good interpersonal skills of communication
  - Good organizational skills
  - The ability to make decisions in a timely manner
  - The ability to generate multiple solutions to the problem
  - The ability to quickly pick up technical concepts
  - The ability to work both with a team and independently, and
    to multitask effectively

  Education and Experience:

  Software Test Engineers should have experience in software
  engineering and a good understanding of the software
  development lifecycle. Bachelor’s degree in computer science
  or equivalent software testing work experience is preferred,
  but we care more for a heart and mind that are always
  learning.

  Training and Orientation:

  Will complete the initial IT Software Department training
  program and relevant portions of IT Orientation.

  Weekly Hours

  40
