description: |
  Do you have the desire to join a collaborative & innovative
  team? Is a culture where “People Count” and “We do the Right
  Thing” and “We Hold Ourselves to Very High Standard
  meaningful to you? If so, Guardian Life Insurance Company is
  actively seeking a passionate, driven and self-motivated
  Full Stack Developer to join our Enterprise Business &
  Technology Services team!

  In this role you will be responsible for creating and
  maintaining new features for a business-critical website.

  You will: (Responsibilities)

  - Design, develop and unit test features for business critical
    website
  - Collaborate and align with security standards prescribed by
    security office
  - Work in partnership with product owners to decompose
    features
  - Align with Project Governance requirements for development
    effort.
  - Work in a SAFe agile team environment with other developers,
    QA, business users, and other internal teams as well as
    periodic external partners.
  - Maintain existing software and software documentation.

  You Have (Required Skills)

  - 6 or more years of full stack technology experience in J2EE
    & front end technologies
  - Solid command over Java/J2EE, Spring Boot, React, Node.js,
    Next JS, Nest JS, TypeScript, Micro-Frontends,
    JPA/Hibernate/iBatis, REST API's, GraphQL, SQL, Oracle,
    DB2
  - Familiar with Apache Tomcat, AWS, Micro-services
  - Strong knowledge of release/build/configuration management
    practices.
  - Good communication skills and ability to work well in a team
  - Well familiar with Insurance Domain
  - Ability to prioritize and manage work, adhering to critical
    and aggressive project timelines in a fast-paced
    environment
  - Extensive experience in Software Development Life Cycle
    Management using Scaled Agile, Scrum, Kanban
  - Excellent analytical and problem-solving skills
  - Minimum of a BA/BS Degree in Computer Science or a related
    field or equivalent
  - You reside in New York, New Jersey or Pennsylvania

  Location:

  - Hybrid Schedule - 3 days in office in either Holmdel (NJ),
    Bethlehem (PA), Pittsfield (MA), or Hudson Yards (NYC)

  Salary Range:

  $95,170.00 - $156,355.00

  The salary range reflected above is a good faith estimate of
  base pay for the primary location of the position. The
  salary for this position ultimately will be determined based
  on the education, experience, knowledge, and abilities of
  the successful candidate. In addition to salary, this role
  may also be eligible for annual, sales, or other incentive
  compensation.

  Our Promise

  At Guardian, you’ll have the support and flexibility to
  achieve your professional and personal goals.  Through
  skill-building, leadership development and philanthropic
  opportunities, we provide opportunities to build communities
  and grow your career, surrounded by diverse colleagues with
  high ethical standards.

  Inspire Well-Being

  As part of Guardian’s Purpose – to inspire well-being – we
  are committed to offering contemporary, supportive,
  flexible, and inclusive benefits and resources to our
  colleagues. Explore our company benefits at
  www.guardianlife.com/careers/corporate/benefits. Benefits
  apply to full-time eligible employees. Interns are not
  eligible for most Company benefits.

