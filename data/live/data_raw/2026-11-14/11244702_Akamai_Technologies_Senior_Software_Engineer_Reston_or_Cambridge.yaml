description: |
  Do you enjoy collaborating with teams to solve complex
  challenges?

  Are you ready to design and deliver secure cloud solutions
  for government networks?

  Join Our Custom Government Engineering Team!

  The Custom Government team operates across the full breadth
  and depth of Akamai's technology stack to design, build, and
  deliver customized solutions for Public Sector customers.
  This role partners closely with Operations and SRE teams in
  a highly collaborative environment to deploy, operate, and
  continuously improve secure, resilient, and high-performance
  Application Delivery Networks

  Partner with the best

  We are seeking an experienced, self-motivated, and highly
  productive Senior Software Engineer with a solid systems
  background. In this role, you will be involved in the
  support, enhancement, and integration of custom platform
  frameworks, automated build systems, distributed cloud
  databases, and storage ecosystems

  As a Senior Software Engineer, you will be responsible for:

  - Managing CI/CD pipelines, enhancing software tools, and
    developing robust testing frameworks to ensure quality
    release standards
  - Leading technical initiatives and taking ownership of the
    design, deployment, and evolution of custom government
    network platforms
  - Designing and developing next-generation capabilities for
    custom platform services in a collaborative environment
  - Guiding code reviews, applying security patches, and
    identifying ongoing improvements for software delivery and
    system performance
  - Collaborating across cross-functional teams to manage SDLC
    release cycles using modern Agile practices and AI-
    assisted workflows
  - Partnering with Operations, Engineering, and SRE teams to
    investigate and troubleshoot complex technical system
    issues

  Do what you love

  To be successful in this role you will:

  - Have 5 years of relevant experience and a Bachelor's degree
    in Computer Science or its equivalent.
  - Possess solid knowledge of Linux or Unix administration,
    configuration, system-level software development, and
    debugging tools.
  - Demonstrate proficiency in Linux shell scripting and
    interpretive languages including Python or Perl
  - Have experience managing CI/CD automation pipelines using
    Jenkins or similar continuous integration tooling.
  - Demonstrate hands-on familiarity with Docker containers,
    NoSQL databases, cloud storage, and networking protocols.
  - Be familiar with Zero Trust Architecture, Public Key
    Infrastructure standards, systems security, and security
    patching.
  - Possess US Citizenship, and be eligible to undergo the
    required security clearance process; an active clearance
    is not required.

  About us

  At Akamai, we make life better for billions of people,
  trillions of times a day. Whether you're streaming live
  events, scrolling social media, watching your favorite
  series, or managing your savings, we're the engine behind
  the scenes. We provide the world's most distributed platform
  from Cloud to Edge to help the giants of the digital world
  work faster and stay more secure, making the internet a
  better experience for everyone. Our focus is simple: Cloud
  and Edge: Running apps closer to users for instant
  performance. Security: Neutralizing threats before they ever
  reach your data. Content Delivery: Scaling the world's
  biggest moments without a glitch. AI: Enabling our customers
  to build, secure, and scale AI apps on the world's most
  distributed cloud platform. At Akamai, we don't just support
  the internet; we power and protect it, because behind every
  great digital experience is a massive hidden challenge. And
  we're the ones who solve it. When millions of people hit
  play or pay, Akamai ensures it just works.

  Benefits at Akamai: We support your health, well-being,
  finances, and life beyond work. See our benefits.

  Work in a way that works for you

  FlexBase, Akamai's Global Flexible Working Program, is based
  on the principles that are helping us create the best
  workplace in the world. When our colleagues said that
  flexible working was important to them, we listened. We also
  know flexible working is important to many of the incredible
  people considering joining Akamai. FlexBase, gives 95% of
  employees the choice to work from their home, their office,
  or both (in the country advertised). This permanent
  workplace flexibility program is consistent and fair
  globally, to help us find incredible talent, virtually
  anywhere. We are happy to discuss working options for this
  role and encourage you to speak with your recruiter in more
  detail when you apply.  We trust our incredible employees to
  work in ways that suit them best: at home, in an office, or
  a combination of both.

  Connect with us on social and see what life at Akamai is
  like!

  Compensation

  Akamai is committed to fair and equitable compensation
  practices. For US based candidates only - the base salary
  for this position ranges from $121,400 - $218,600/year; a
  candidate’s salary is determined by various factors
  including, but not limited to, relevant work experience,
  skills, certifications and location. Compensation for
  candidates outside the US will vary. The compensation
  package may also include incentive compensation
  opportunities in the form of annual bonus or incentives,
  equity awards and an Employee Stock Purchase Plan (ESPP).
  Akamai provides industry-leading benefits including
  healthcare, 401K savings plan, company holidays, vacation
  (in the form of PTO), sick time, family friendly benefits
  including parental leave and an employee assistance program
  including a focus on mental and financial wellness;
  Eligibility requirements apply.
