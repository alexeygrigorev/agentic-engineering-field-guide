description: |
  About the Company

  Gemini is a global crypto and Web3 platform founded by
  Cameron and Tyler Winklevoss in 2014, offering a wide range
  of simple, reliable, and secure crypto products and services
  to individuals and institutions in over 70 countries. Our
  mission is to unlock the next era of financial, creative,
  and personal freedom by providing trusted access to the
  decentralized future. We envision a world where crypto
  reshapes the global financial system, internet, and money to
  create greater choice, independence, and opportunity for all
  — bridging traditional finance with the emerging
  cryptoeconomy in a way that is more open, fair, and secure.
  As a publicly traded company, Gemini is poised to accelerate
  this vision with greater scale, reach, and impact.

  The Department: Tooling

  The Role: Staff Software Engineer (Product)

  As a Staff Product Engineer on the Tooling team, you'll
  operate across backend, web, and mobile to shape the
  customer-facing platform tooling that defines how millions
  of users experience Gemini — onboarding, compliance,
  customer support, and the ad hoc projects that keep the
  customer journey smooth from first touch onward. This is a
  high-leverage, high-ownership role for an engineer who sets
  technical direction across multiple systems and teams, moves
  fluidly up and down the stack, and drives complex, cross-
  cutting products from ambiguity to production.

  You'll join a team that treats AI-assisted development and
  automation as first-class tools. We run an agentic SDLC
  pipeline where specialized agents plan, implement, and
  review work through our harness with human guidance. We
  expect our engineers to wield these tools fluently —
  offloading toil to automation while holding the decision
  gates that matter — and we expect our Staff engineers to
  help shape where that frontier goes next. If you get excited
  about setting technical vision for customer-facing problems,
  multiplying the teams around you, and pushing the frontier
  of how software gets built, we'd love to hear from you.

  This role is required to be in person twice a week at our
  New York City, NY office.

  Responsibilities:

  - Independently scope, design, and deliver solutions for
    large, complex, cross-cutting challenges spanning backend
    services, web, and mobile — owning multi-system outcomes
    end to end.
  - Drive the architecture behind onboarding, compliance
    (KYC/identity), and customer support workflows that serve
    millions of users, designing for scale and reliability
    with the future in mind.
  - Set technical direction beyond your immediate team: plug
    into designs across the product unit, provide guidance,
    and help teams avoid design pitfalls.
  - Leverage and help advance our AI coding tools and agentic
    development pipeline, raising the bar for how the team
    builds.
  - Own the DevOps lifecycle for the systems you build —
    building, validating, monitoring, and maintaining them
    over the long term — and drive key processes like
    operational review, security, and disaster recovery for
    your domain.
  - Plan and deliver complex, multi-team, long-term projects,
    including ones with external dependencies; identify
    strategic problems and advocate for their prioritization.
  - Conduct meaningful code and design reviews for correctness,
    style, and information security, providing oversight and
    coaching that raises quality across teams.
  - Mentor engineers, provide compassionate technical coaching,
    and contribute to the technical direction, hiring, and
    engineering culture of the team.
  - Take on the most ambiguous, high-stakes problems and drive
    them to resolution, tying the work clearly to company
    objectives.

  Minimum Qualifications:

  - 8+ years of software engineering experience building and
    operating complex production systems at scale.
  - A track record of independently designing and delivering
    large, multi-system or multi-team projects from
    architecture through operation.
  - Demonstrated ability to work across multiple layers of the
    stack: backend services plus web and/or mobile — and a
    willingness to work wherever a problem requires.
  - Proficiency in a typed language (e.g., TypeScript, Scala,
    Java, Go) and comfort with JavaScript/TypeScript for web
    and mobile surfaces.
  - Experience building consumer-facing applications, with a
    strong understanding of UX/UI concepts and product
    sensibility.
  - Fluency in using AI coding tools and automation as part of
    your everyday workflow.
  - Expertise in unit and integration testing and a commitment
    to code health, testing, and maintainability.
  - A customer and product-focused mindset, with the ability to
    make well-reasoned tradeoffs between speed and quality.
  - Demonstrated technical leadership: influencing architecture
    and prioritization across teams, mentoring engineers, and
    building consensus among cross-functional stakeholders.
  - Excellent communication and teamwork skills, including the
    ability to drive alignment across teams and time zones.

  Preferred Qualifications:

  - Experience in the crypto or fintech industry, or as a user
    of crypto products.
  - Experience with onboarding, identity/KYC, compliance, or
    customer support tooling.
  - Experience building and operating AI agents or agentic
    workflows in production.
  - Familiarity with React/React Native and cloud/microservices
    architecture.
  - Experience influencing product decisions with data and
    experimentation.
  - A history of acting as a technical multiplier — coaching
    engineers and leading initiatives beyond your core area of
    expertise.

  It Pays to Work Here



  The compensation & benefits package for this role includes:

  - Competitive starting pay
  - A discretionary annual bonus
  - Long-term incentive in the form of a new hire equity grant
  - Comprehensive health plans
  - 401K with company matching
  - Paid Parental Leave
  - Flexible time off

  Salary Range: The base salary range for this role is between
  $168,000 - $240,000 in the State of New York. This range is
  not inclusive of our discretionary bonus or equity package.
  When determining a candidate’s compensation, we consider a
  number of factors including skillset, experience, job scope,
  and current market data.

  In the United States, we offer a hybrid work approach at our
  hub offices, balancing the benefits of in-person
  collaboration with the flexibility of remote work.
  Expectations may vary by location and role, so candidates
  are encouraged to connect with their recruiter to learn more
  about the specific policy for the role. Employees who do not
  live near one of our hubs are part of our remote workforce.
  All employees, however, are required to onboard in-person at
  one of our office locations.

  At Gemini, we strive to build diverse teams that reflect the
  people we want to empower through our products, and we are
  committed to equal employment opportunity regardless of
  race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, gender identity, or Veteran status. Equal
  Opportunity is the Law, and Gemini is proud to be an equal
  opportunity workplace. If you have a specific need that
  requires accommodation, please let a member of the People
  Team know.

