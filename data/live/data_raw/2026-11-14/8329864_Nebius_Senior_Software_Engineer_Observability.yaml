description: |
  About Nebius:

  Nebius is leading a new era in cloud infrastructure for the
  global AI economy. We are building a full-stack AI cloud
  platform that supports developers and enterprises from data
  and model training through to production deployment, without
  the cost and complexity of building large in-house AI/ML
  infrastructure.

  Built by engineers, for engineers. From large-scale GPU
  orchestration to inference optimization, we own the hard
  problems across compute, storage, networking and applied AI.

  Listed on Nasdaq (NBIS) and headquartered in Amsterdam, we
  have a global footprint with R&D hubs across Europe, the UK,
  North America and Israel. Our team of 1,500+ includes
  hundreds of engineers with deep expertise across hardware,
  software and AI R&D.

  The Role

  Nebius is hiring a Senior Software Engineer to design,
  build, and own backend systems that power metrics, monitor
  large-scale infrastructure, and develop a comprehensive
  infrastructure maintenance platform. This role requires
  strong production experience, sound system design judgment,
  and the ability to operate and improve critical services.

  Your responsibilities will include:

  - Design and build services and agents that provide deep
    visibility into large-scale server fleets and data center
    engineering systems
  - Evolve metrics, aggregation, and alerting pipelines, with a
    focus on signal quality and reliability
  - Design and operate maintenance and remediation systems that
    enable safe, predictable fleet-wide changes and keep
    infrastructure healthy
  - Investigate production incidents hands-on, including on-host
    Linux debugging, and drive root-cause fixes
  - Collaborate closely with hardware, networking, and data
    center operations teams to improve reliability

  What we expect you to have:

  - 5+ years of professional software engineering experience
  - Strong production experience with Python and Go, or the
    ability to ramp up quickly
  - Solid Linux fundamentals and comfort debugging live systems
  - Ability to write reliable, maintainable code and dig into
    complex, ambiguous problems
  - Experience building and operating production systems at
    scale

  It will be an added bonus if you have:

  - Ubuntu experience, including internal tooling and packaging
    workflows (e.g., building Debian packages)
  - CCNA (Cisco Certified Network Associate) or equivalent
    networking experience

  Key employee benefits:

  - Health insurance: 100% company-paid medical, dental, and
    vision coverage for employees and families.
  - 401(k) plan: up to 4% company match with immediate vesting.
  - Parental leave: 20 weeks paid for primary caregivers, 12
    weeks for secondary caregivers.
  - Remote work reimbursement: up to $85/month for mobile and
    internet.
  - Disability & life insurance: company-paid short-term, long-
    term and life insurance coverage.

  Compensation

  - We offer competitive salaries, ranging from $130k- $170k
    base + quarterly performance bonuses.

  Join Nebius Today!

  Benefits & Perks:

  - Competitive compensation
  - Career growth and learning opportunities
  - Flexibility and ownership
  - Collaborative and innovative culture
  - Opportunity to work on impactful AI projects
  - International environment and talented teams

  What's it like to work at Nebius:

  Fast moving - Bold thinking - Constant growth - Meaningful
  impact - Trust and real ownership - Opportunity to shape the
  future of AI

