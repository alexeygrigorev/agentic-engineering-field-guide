title: Manager I, Engineering - Zero Trust Networking
company: Datadog
location: New York, USA
work_type: FULL_TIME
company_size: 6,500 Employees
description: |
  Fabric Zero Trust Networking builds the infrastructure that
  makes secure service connectivity the default across
  Datadog. Our team develops workload-identity, authorization,
  network-segmentation, and egress-control mechanisms that
  help protect customer data while keeping our production
  platform reliable and efficient. As an engineering manager,
  you'll grow a team of engineers, shape its roadmap alongside
  technical leaders, and drive adoption across Datadog's
  infrastructure. You'll work at the intersection of
  distributed systems, networking, and security, turning
  complex requirements into platforms that other engineers can
  use confidently.

  At Datadog, we place value in our office culture - the
  relationships that it builds, the creativity it brings to
  the table, and the collaboration of being together. We
  operate as a hybrid workplace to ensure our employees can
  create a work-life harmony that best fits them.

  What You’ll Do:

  - Lead, coach, and grow a team of software engineers, creating
    clear expectations, ownership, and career-development
    opportunities.
  - Partner with senior engineers to set technical direction and
    deliver a roadmap for secure service connectivity and
    least-privilege network access.
  - Lead development and adoption of identity-based
    authorization, TLS/mTLS enforcement, network-segmentation
    mechanisms, and egress controls.
  - Make security capabilities straightforward to adopt through
    secure defaults, clear policy abstractions, migration
    tooling, and useful diagnostics.
  - Maintain high standards for reliability, performance, and
    safe production rollouts, including testing,
    observability, and incident learning.
  - Collaborate with Fabric, Security, and production-
    infrastructure partners to align priorities and deliver
    improvements across teams.

  Who You Are:

  - You have built and operated distributed systems, backend
    infrastructure, or internal platforms in production.
  - You communicate clearly, build productive cross-team
    relationships, and have experience working with engineers
    across multiple locations and time zones.
  - You understand networking and security fundamentals and are
    interested in building the mechanisms that enforce
    security on production traffic.
  - You have led complex infrastructure changes or migrations
    with a thoughtful approach to adoption, compatibility, and
    rollout safety.
  - You combine technical curiosity with pragmatic judgment and
    care about making platforms reliable, secure, and easy to
    use.
  - You have experience leading software engineers and helping
    them grow through coaching and feedback.

  Datadog values people from all walks of life. We understand
  not everyone will meet all the above qualifications on day
  one. That's okay. If you’re passionate about technology and
  want to grow your skills, we encourage you to apply.

  Benefits and Growth:

  - New hire stock equity (RSUs) and employee stock purchase
    plan (ESPP)
  - Continuous professional development, product training, and
    career pathing
  - Intradepartmental mentor and buddy program for in-house
    networking
  - An inclusive company culture, ability to join our Community
    Guilds (Datadog employee resource groups)
  - Access to Inclusion Talks, our Internal panel discussions
  - Free, global mental health benefits for employees and
    dependents age 6+
  - Competitive global benefits

  Benefits and Growth listed above may vary based on the
  country of your employment and the nature of your employment
  with Datadog.

  #LI-HYBRID

  Datadog offers a competitive salary and equity package, and
  may include variable compensation. Actual compensation is
  based on factors such as the candidate's skills,
  qualifications, and experience. In addition, Datadog offers
  a wide range of best in class, comprehensive and inclusive
  employee benefits for this role including healthcare,
  dental, parental planning, and mental health benefits, a
  401(k) plan and match, paid time off, fitness
  reimbursements, and a discounted employee stock purchase
  plan.

  The reasonably estimated yearly salary for this role at
  Datadog is:

  $192,000—$240,000 USD

