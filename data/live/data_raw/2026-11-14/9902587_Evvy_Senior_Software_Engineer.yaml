description: |
  About Evvy

  At Evvy, we believe the female body shouldn’t be a medical
  mystery.

  We are a precision women’s health company leveraging the
  vaginal microbiome to improve outcomes across a woman's
  lifespan. Backed by $60M+ from leading investors, we serve
  over 100,000 patients and 3,000 providers nationwide with
  our validated Vaginal Microbiome Test and AI-powered
  personalized care platform.

  Through this work, we have built the world’s largest dataset
  on the vaginal microbiome — a proprietary foundation that
  will drive breakthroughs in infertility, preterm birth,
  gynecological cancers, and beyond.

  Why join now?

  Evvy is a generational opportunity in women's health — and
  we're at the inflection point.

  - We’ve built a dataset no one has. Evvy has generated the
    world’s largest vaginal microbiome dataset from 100,000+
    patients, uncovering novel biological markers underlying
    women’s health conditions that collectively cost the
    healthcare system $180B+ annually.
  - Validated, AI-first platform. We’ve built a comprehensive
    testing and care platform that unlocks personalized
    treatment pathways for each patient. Our work is supported
    by research published in major peer-reviewed journals and
    presented at major clinical conferences (including ACOG,
    ASRM, IDSOG, and more).
  - Proven traction, massive opportunity. We serve 100,000+
    patients and 2,000 providers nationwide, with rapidly
    growing revenue and an expanding suite of diagnostics and
    treatments to improve outcomes across condition areas.
    We've only scratched the surface.
  - Top tier team, investors, and partners. Our world-class team
    is backed by industry leading investors, including General
    Catalyst, Left Lane Capital, US Fertility, and Labcorp.

  We're looking for high-horsepower, mission-driven people who
  find it unacceptable that the female body is still a medical
  mystery — and want to help change that.

  About the Role

  We're hiring a Senior Software Engineer to join the product
  engineering team. You'll architect, build, and scale our
  personalized vaginal health platform, from ideation to
  launch and well beyond. This is a role for someone who wants
  to build something great, not just ship tickets. You'll own
  features end-to-end, work across the full stack, partner
  closely with product, ops, clinical, and design, and help
  shape the way we engineer as we scale.

  This is a role for someone who is product-minded,
  relentlessly driven, and exceptionally resourceful.

  Evvy is a primarily in-person team based in New York, NY.
  Given the cross-functional nature of this role, our ideal
  candidate is located in NYC.

  What You'll Do

  - Lead zero-to-one product development from ideation to
    production, collaborating with cross-functional leaders
    across data, product, design, marketing, clinical, and
    operations
  - Work across the true full stack: requirements definition,
    system architecture, backend, frontend, QA, monitoring,
    debugging, maybe even the occasional Figma mockup
  - Collaborate closely with the team to refine our technical
    architecture and platform direction
  - Build innovative, personalized user experiences, from our
    AI-powered insights layer to ecommerce, testing services,
    and care delivery
  - Design and build internal workflows and tooling that allow
    our ops team to support users at every step
  - Make smart tradeoffs between speed and scalability, knowing
    when to ship something now that will eventually break (and
    understanding exactly where it will) vs. when to build it
    right the first time
  - Own your work all the way to outcome: you don't consider
    something shipped when the PR merges; you're eager to see
    how it does post-launch, notice any bugs in FullStory
    before anyone reports it, and close every loop
  - Shape our engineering culture & inspire how we work at Evvy:
    define processes, mentor teammates, and contribute to a
    innovative, high-performance team

  What We're Looking For

  Technical depth and practicality. You have 5+ years of full-
  stack experience with a proven ability to ship high-quality,
  scalable applications. You write clean, functional code and
  explain your decisions as you go. You're comfortable across
  the stack and don't need a fully defined spec to start
  moving.

  Real AI/ML experience. You've shipped AI features to
  production and can speak to what worked, what failed, and
  the specific tradeoffs you made, not just that you "use AI
  tools." You have a thoughtful, nuanced take on where agentic
  AI development is headed and how a team like ours should
  approach it.

  Product ownership. You care deeply about the why behind what
  you build. You naturally ask "how does this affect the
  user?" before being prompted. You understand that the work
  isn't done until the user need is met.

  Radical ownership. You drive things forward without hand-
  holding. You proactively think about failure modes and
  monitoring. When something breaks, regardless of how it
  happened, you roll up your sleeves and figure it out.

  Cross-functional collaboration. You've worked closely with
  non-engineering teams and found it useful and energizing.
  You communicate clearly enough that a non-engineer can
  follow your reasoning. You treat ops, clinical, and product
  teammates as proxies for the end user and build accordingly.

  Adaptability. The tech, the science, and the business are
  all shifting. You find that energizing. You update your
  approach when new information lands and help the people
  around you do the same.

  Genuine mission alignment. You care about the Evvy user—a
  woman trying to get a better answer about her body—and that
  shows up in how you make technical decisions, not just in an
  interview answer.

  Technical Skills

  - Strong backend experience in Python and Postgres
  - Frontend proficiency in React and TypeScript
  - Familiarity with cloud infrastructure and deployment
    pipelines
  - Strong CS fundamentals and general debugging skills
  - Proficiency with AI-native development and Claude Code
  - Prior startup or growth-stage experience, or evidence of the
    scrappiness and creative problem solving that comes with
    it

  Nice to have:

  - Experience with our stack: Django, Typescript, AWS, Render,
    Snowflake
  - DevOps/infra depth: CI/CD, monitoring, security expertise
  - HIPAA or data privacy compliance experience
  - Ecommerce or health tech background

  Working at Evvy

  Evvy is a primarily in-person team based in New York, NY
  with a strong culture of collaboration and connection. We
  work from the office 4 days a week (Wednesdays remote), and
  we genuinely enjoy spending time together: team dinners,
  happy hours, and shared wins are part of the rhythm here.

  Our Values

  Start with the why. We tie everything back to a user need or
  company goal. Figure it out. We take initiative, embrace
  ambiguity, and build from first principles. Create win-wins.
  We solve problems with patients, partners, and the business
  in mind. Own it to the end. We close every loop and take
  pride in the details. Stay eleven steps ahead. We
  anticipate, plan, and act with foresight and speed.





  Company Benefits

  - Competitive salary and equity package
  - Flexible PTO
  - $1K learning and development budget
  - Health, dental, and vision insurance, plus HSA plans
  - 401(k) plan (Roth and traditional)
  - Monthly team events
  - Free Evvy membership
  - Paid parental leave

  Evvy is an equal opportunity employer committed to diversity
  and inclusion. We welcome applicants of all backgrounds and
  do not discriminate based on race, gender, sexual
  orientation, age, disability, or other protected
  characteristics.

  All communications will come from an @evvy.com email
  address.
