description: |
  Haast Autonomous is building an autonomous aircraft network
  for time-sensitive medical logistics. We’re developing long-
  range VTOL aircraft, autonomy software, and the operational
  foundation needed to move critical payloads between
  hospitals, labs, and healthcare facilities on-demand faster
  and more reliably.

  We’re early, small, and moving quickly. Joining now means
  you'll have a direct role in shaping the foundation of Haast
  — our culture, engineering process, testing discipline,
  partner relationships, and the path from prototype to a real
  medical logistics network.

  We’re looking for high-agency people who want ownership,
  urgency, and system-level impact from day one.

  What you'll do

  - Build and maintain the React/TypeScript operations portal
    (dashboards, live maps, flight requests, facilities,
    inventory-backed supply flights).
  - Design and evolve the Supabase/Postgres backend.
  - Improve reliability of core workflows including aircraft
    allocation, mission generation, telemetry ingestion, and
    live dashboard updates.
  - Work at the integration of our Python bridge, which connects
    the platform to ArduPilot-based aircraft and simulations.
  - Add tests, improve logging and observability, and prepare
    the platform for production-grade reliability.
  - Collaborate with autonomy and simulation engineers as the
    real-flight and digital-twin systems mature.

  Required skills

  - TypeScript and React.
  - SQL / PostgreSQL.
  - Experience shipping full-stack web applications to
    production.
  - Understanding of authentication, authorization, and multi-
    tenant data access.
  - Comfortable with Git, environment management, deployment,
    and debugging.

  Preferred skills

  - Supabase
  - Python
  - Mapbox
  - Realtime dashboards, websockets, or telemetry pipelines.
  - Familiarity with Linux services, SSH, and cloud deployment.

  We care more about agency, ownership, taste, and evidence
  that you can build than whether you match every bullet
  point. If you have worked on aircraft, drones, robots,
  vehicles, rockets, or other hard technical systems and want
  to help build something from the ground up, we want to hear
  from you.
