description: |
  Contributes to the design, development, and support of
  modern software solutions in an Agile/Scrum and DevOps
  environment, with a focus on Enterprise Content Management
  (ECM) and workflow automation. Applies modern engineering
  practices, including CI/CD, automated testing,
  infrastructure as code, and observability, to help deliver
  secure, resilient, and scalable services. Works with ECM
  technologies (e.g., OnBase, Kofax, ImageRight or similar)
  and supports integration of content services with enterprise
  applications and cloud platforms. This is an individual
  contributor role with no team leadership, supervisory, or
  people-management responsibilities.

  RESPONSIBILITIES/TASKS:

  - Develops, configures, and supports Enterprise Content
    Management (ECM) platforms and content services (e.g.,
    OnBase, Kofax, ImageRight), including workflow automation,
    integrations, and platform modernization tasks.
  - Participates in planning, design, development, testing,
    release, and support of ECM and content-enabled
    applications, following established enterprise
    architecture standards.
  - Collaborates with Product Owners, Scrum Masters, architects,
    and business stakeholders to clarify requirements,
    estimate assigned work, and contribute to backlog
    refinement and delivery planning.
  - Follows Agile/Scrum practices and contributes to DevOps
    automation, including CI/CD pipelines, automated testing,
    code quality gates, and infrastructure as code; supports
    releases across environments using established processes.
  - Applies established development patterns and seeks guidance
    from experienced engineers and architects on design and
    implementation decisions.
  - Diagnoses and resolves incidents and performance issues
    across ECM platforms, APIs/integrations, and supporting
    services (application, database, and infrastructure).
  - Works with the Product Team to ensure user stories for
    content capture, workflow, and records requirements are
    developer-ready with clear acceptance criteria and test
    scenarios.
  - Builds automated tests and performs resiliency, failover,
    and load testing to validate nonfunctional requirements
    for ECM services in production.
  - Implements established security, retention, privacy, and
    audit requirements in assigned ECM solutions, working with
    IT Security and Records as needed.
  - Participates in design reviews, architecture discussions,
    and communities of practice to share knowledge and develop
    modern software engineering skills.
  - Participates in peer code reviews, applies feedback, and
    follows established standards for secure coding,
    maintainable designs, integrations, and workflow
    components.
  - Supports operational readiness by configuring monitoring and
    alerts, maintaining runbooks, contributing to root cause
    analysis, and implementing assigned improvements to
    production reliability.
  - Working knowledge of software design principles and modern
    engineering and delivery practices, including Agile/Scrum,
    CI/CD, and DevOps.
  - Familiarity with cloud technologies (Azure, O365, AWS),
    enterprise platforms (e.g., SharePoint), and their
    integration with ECM/content services.
  - Ability to build services and applications using .NET /
    ASP.NET / C# / SQL Server and integrate with CRM and other
    enterprise systems.
  - Experience integrating ECM platforms via REST/SOAP APIs,
    webhooks, and eventdriven patterns; strong understanding
    of content capture, indexing, and workflow concepts.
  - Working knowledge of C#, .Net framework, Asp.Net, and MVC.
  - Working knowledge of OOAD and multi-tier architectures, with
    familiarity with MVC/MVP/MVVM design patterns.
  - Working knowledge of web services and REST, with familiarity
    with WCF and SOA architecture.
  - Knowledge with MS Entity Framework.
  - Working knowledge of MVC GUI design using JQuery,
    JavaScript, and CSS, with familiarity with AJAX/SPA.
  - Working knowledge of database tools such as MS SQL Studio,
    PL/SQL Developer / Toad, or similar tools.
  - Strong analytical, problem solving, and planning skills.
  - Excellent interpersonal and communication skills.
  - Ability to multi-task in a fast-paced environment.
  - Team player who is flexible, delivery-oriented, and takes
    responsibility for the team’s success.
  - Enthusiastic attitude with the drive to continually learn
    and improve.

  This position description identifies the responsibilities
  and tasks typically associated with the performance of the
  position.  Other relevant essential functions may be
  required.

  EMPLOYMENT QUALIFICATIONS:

  EDUCATION OR EQUIVALENT EXPERIENCE:

  Bachelor’s degree in information services or related field.
  Combinations of relevant education and experience may be
  considered in lieu of a degree. Continuous learning, as
  defined by the Company’s learning philosophy, is required.
  Certification or progress toward certification is highly
  preferred and encouraged.

  EXPERIENCE:

  2–5 years of relevant work experience in software
  development and system design, providing the necessary
  skills, knowledge, and abilities.

  SKILLS/KNOWLEDGE/ABILITIES (SKA) REQUIRED:

  - Ability to understand business needs and conceptualize and
    implement information systems that support those business
    strategies.
  - Experience working within an agile framework like Scrum
    based development organization.
  - Ability to learn and follow departmental procedures,
    processes, and workflows.
  - Knowledge of standard languages, coding methods, company
    coding standards and quality requirements.
  - Excellent oral and written communication skills required.
  - Demonstrated abilities to successfully document and
    communicate software platform designs to all levels of
    staff (technical and non-technical).
  - Ability to work constructively with other technical experts
    in a group setting.
  - Knowledge of object-oriented development languages and web-
    related technologies.
  - Ability to comprehend the consequences of various problem
    situations and address them, or refer them for appropriate
    decision making.
  - Ability to effectively exchange information clearly and
    concisely, and present ideas, reports facts and other
    information, and respond to questions as appropriate.
  - Ability to make sound decisions within assigned work and
    seek guidance or escalate issues when appropriate.
  - Ability to collaborate with technical services teams and
    software vendors to troubleshoot and resolve assigned
    issues.
  - Familiarity with project management tools and techniques
    used to track assigned tasks and communicate progress.
  - Ability to maintain confidentiality.
  - Ability to perform other assignments at locations outside
    the office.

  RECOMMENDED SKILLS/QUALIFICATIONS (ADDITIONAL)

  - Experience with Enterprise Content Management (ECM)
    platforms, including:
    - OnBase by Hyland (workflow design, Unity scripting,
      WorkView, API integrations)
    - Kofax (Capture, Transformation Modules, workflow automation)
    - ImageRight (content storage, workflow configuration, system
      administration)
    - Other ECM/document‑management systems supporting imaging,
      workflow, and records retention
  - Ability to integrate ECM platforms with enterprise
    applications, including .NET systems, CRM platforms, and
    cloud services.
  - Knowledge of document capture, indexing, classification, and
    automated workflow design.
  - Experience modernizing or migrating legacy ECM solutions to
    cloud or hybrid architectures.
  - Familiarity with REST APIs, webhooks, and service‑based
    integrations used in ECM ecosystems.
  - Understanding of security, retention, and governance
    practices related to enterprise content.
  - Ability to troubleshoot and optimize ECM workflows and
    performance.

  WORKING CONDITIONS:

  Work is performed mainly in an office environment with
  minimal hazards. Ability to work extended hours as needed.
  Travel may be required.

   PAY RANGE:

  “Actual compensation decision relies on the consideration of
  internal equity, candidate’s skills and professional
  experience, geographic location, market and other potential
  factors. It is not standard practice for an offer to be at
  or near the top of the range, and therefore a reasonable
  estimate for this role is between $56,700 and $114,850.”

  We are an Equal Opportunity Employer. We will not tolerate
  discrimination or harassment in any form. Candidates for the
  position stated above are hired on an "at will" basis.
  Nothing herein is intended to create a contract.

