description: |
  About Luminai

  Healthcare operations have always depended on people to
  bridge the gaps that technology couldn't. It relies on
  complex manual work to carry out critical internal
  processes, yet most health systems don’t have enough
  resources to properly automate these tasks, leaving them
  stuck in outdated, labor-intensive SOPs. Luminai structures
  the chaos, automates the manual handoffs, and deploys end-
  to-end workflows across every system, providing the
  integrated intelligence layer to improve processes over
  time. By delegating to autonomous AI systems those mission-
  critical workflows that previously expended valuable human
  time, Luminai allows doctors and administrators to do what
  they do best: Focus on Patients. We've raised $60M in
  funding, including our recent Series B led by Peak XV
  Partners (formerly Sequoia India), with participation from
  healthcare-focused Define Ventures and continued support
  from General Catalyst and Y Combinator. We're backed by some
  of the best investors in Silicon Valley, including Kevin
  Weil (Chief Product Officer at OpenAI), Arash Ferdowsi (co-
  founder of Dropbox), Katie Stanton (former VP Global Media,
  Twitter), and CEOs of companies such as Flexport, Notion,
  Front, Ramp, and Twitch.

  Our team is in-office 4 days a week (Monday - Friday,
  Wednesday optional WFH) in either San Francisco, California
  or New York, New York.

  About the Role

  As a Staff Software Engineer, you will play a foundational
  role in designing, implementing and spearheading the core
  platform development. The platform is used by organizations
  worldwide to deploy and scale executable AI automations in
  mission critical production environments. As a senior member
  of the engineering team, you are expected to have a strong
  proficiency in fundamentals of software engineering and
  exceptional ability to drive technical projects in ambitious
  technical environments. You will help define, architect and
  improve key system foundations that allows the overall
  engineering team to execute effectively and deliver a
  stellar platform experience for users within a high growth
  team.

  What You'll Do

  - Languages and associated tooling (DSLs, parsers, compilers)
    for external and internal system abstractions
  - Architecting and maintaining distributed computing
    environments.
  - Simplify system bottlenecks and proactively re-architect
    foundational abstractions to support scale
  - Lead core technical initiatives setting high quality
    foundations in the codebase
  - Define and scale experimentation, monitoring, reliability,
    and observability concepts for production systems
  - Drive improvements to the core Luminai IDE to deliver a
    stellar experience for end users
  - Help champion high performance engineering foundations and
    practices across the codebase

  What We're Looking For

  - A minimum of 8+ years of experience as a software engineer,
    that involves spearheading zero to one engineering
    projects
  - Proven track record of shipping high-quality code in
    challenging projects
  - Direct experience designing and implementing high
    performance systems in production, and an understanding of
    how to navigate key architectural trade-offs
  - Prior experience or working familiarity with modern
    infrastructure stack (Kafka, Kubernetes etc.)
  - Knowledge of parallel computing concepts and distributed
    systems
  - Exceptional problem-solving skills and an ability to work
    across the stack

  Bonus

  - MS or PhD in CS from a top school or equivalent experience
  - Knowledge or interest in compilers, interpreters and design
    of programming languages
  - Prior experience managing (or otherwise leading) engineering
    teams
