description: |
  Ready to be a Titan?

  We're building the next generation of ServiceTitan's iOS
  mobile applications—engineered to deliver unmatched
  performance, elegant design, and powerful capabilities for
  the field technicians who depend on them every day. As a
  Senior Staff Software Engineer, iOS, you'll be the apex
  technical leader of this effort: setting the long-term
  technical vision for our entire mobile organization, driving
  cross-company architectural alignment, and pushing Apple's
  ecosystem to its fullest potential to create lasting product
  differentiation.

  This is an organization-defining role. You'll establish the
  engineering philosophy that guides our iOS platform for
  years to come—shaping how we build, how we scale, and how we
  grow our engineers. You'll operate at the intersection of
  deep technical mastery and broad organizational influence,
  working across product, design, data, and backend leadership
  to deliver outcomes that transform how tradespeople run
  their businesses.



  What You'll Do

  •       Define and own the multi-year technical vision for
  ServiceTitan's iOS platform—establishing architecture
  principles, engineering standards, and platform frameworks
  that are adopted company-wide and set the standard for
  mobile development at scale.

  •       Lead the design of next-generation mobile frameworks
  and foundational systems that serve tens of thousands of
  field technicians daily, with an uncompromising focus on
  platform longevity, extensibility, and resilience.

  •       Partner at the executive and VP level across
  product, design, data, and backend to shape long-range
  roadmaps and ensure iOS capabilities are a strategic driver
  of business outcomes.

  •       Serve as the definitive technical authority for iOS
  across the entire organization—establishing alignment across
  multiple engineering orgs, resolving the most complex cross-
  functional ambiguities, and owning the highest-stakes
  architectural decisions.

  •       Identify and drive strategic technical investments:
  evaluate emerging Apple frameworks, platform capabilities,
  and industry trends to ensure ServiceTitan maintains a
  durable competitive advantage on mobile.

  •       Architect elegant, scalable integrations with
  backend services via GraphQL, establishing patterns for data
  access and API design that scale with the platform.

  •       Champion and evolve ServiceTitan's use of The
  Composable Architecture (TCA)—driving shared state
  management, performance optimization, and modular design
  patterns across the iOS engineering community.

  •       Define the AI-assisted development strategy for iOS
  engineering—establishing how tools like Claude, GitHub
  Copilot, Cursor, and Windsurf are integrated into
  engineering workflows to compound developer productivity at
  scale.

  •       Grow and inspire the next generation of staff and
  senior engineers—serving as a technical role model, thought
  partner, and mentor across the iOS org and beyond.

  •       Set and hold the engineering bar: code quality,
  performance standards, testing philosophy, and architectural
  integrity. Your influence shapes what 'great' looks like for
  all of iOS engineering.



  What You'll Bring

  •       Bachelor's degree in Computer Science or a related
  field—or equivalent practical experience at scale.

  •       12+ years of mobile application development
  experience, with deep specialization in iOS and a proven
  track record at the most senior levels of engineering.

  •       Expert-level mastery of Swift, with the ability to
  reason deeply about language internals, performance, and
  idiomatic design.

  •       A distinguished history of defining and delivering
  architecture for large-scale mobile platforms—setting
  direction across multiple teams and sustaining platform
  health over multi-year horizons.

  •       Strong hands-on experience with GraphQL and the
  ability to define data access patterns that scale across a
  complex mobile platform.

  •       Deep command of TCA, including advanced shared state
  patterns, performance optimization, and modular
  decomposition at scale.

  •       Exceptional ability to lead without
  authority—shaping the technical direction of the
  organization through credibility, clarity, and deep
  engineering judgment. Engineers and executives alike trust
  your perspective.

  •       Outstanding written and verbal communication skills,
  with a demonstrated ability to articulate complex technical
  trade-offs to both engineering and non-engineering
  audiences.



  Preferred Qualifications

  •       Prior experience operating at the Senior Staff
  level, setting platform strategy across large, multi-team
  engineering organizations.

  •       Track record of influencing company-wide engineering
  culture—authoring standards, running guilds, or shaping how
  engineering craft is practiced at scale.

  •       Deep familiarity with large-scale distributed
  systems design and the mobile/backend interface at scale.

  •       Strong proficiency with SwiftUI and experience
  leading its adoption across complex, production iOS
  codebases.



  Nice to Have

  •       Familiarity with MVI architecture patterns and
  experience evaluating architectural trade-offs across
  paradigms.

  •       Experience designing or owning CI/CD systems at
  scale using tools such as Bitrise or GitHub Actions.

  •       Experience establishing end-to-end test automation
  strategies and driving adoption across engineering teams.

  •       Open source contributions or public technical
  writing that has shaped iOS engineering practices more
  broadly.



  Why ServiceTitan

  Our mobile platform powers the businesses of plumbers,
  electricians, HVAC technicians, and other tradespeople
  across North America—people who run their entire operations
  from a phone in the field. The work you do here has
  immediate, tangible impact on how those businesses run and
  grow.

  As a Senior Staff Engineer, you'll have the organizational
  reach and technical freedom to shape not just what we
  build—but how we build it, and who we become as an
  engineering organization. You'll work alongside engineers
  who take the craft seriously, operate with purpose, and hold
  each other to a high standard. We invest in modern tooling,
  encourage bold bets, and believe that mentorship and
  knowledge-sharing are core responsibilities—not
  afterthoughts.

  If you're ready to define the future of a mobile platform at
  scale and become the engineer that engineers across the
  company look to for technical leadership, we'd love to hear
  from you.

  Be Human With Us: Being human isn’t about checking every box
  on a list. It’s about the experiences we have, people we
  meet, and the perspectives we share. So, if you have the
  skills but are hesitant to apply because of your background,
  apply anyway. We need amazing people like you to help us
  challenge the conventional and think differently about the
  problems that we’re solving. We’re in this together. Come be
  human, with us.

  Use of AI Technology:

  We use technology, including automated and AI-assisted
  tools, to support certain aspects of our recruitment
  process. These tools are designed to improve efficiency and
  enhance the candidate experience. AI tools are not used to
  make hiring decisions; all hiring decisions are made by our
  hiring teams.

  What We Offer:

  When you join our team, you’re not just accepting a job.
  You’re making a career move. Here’s how we’ll support you in
  doing some of the most impactful work of your career:

  - Flextime, recognition, and support for autonomous work:
    Flexible time off with ample learning and development
    opportunities to continue growing your career. We offer a
    comprehensive onboarding program, leadership training for
    Titans at all levels, and other programs and events. Great
    work is rewarded through Bonusly, peer-nominated awards,
    and more.
  - Holistic health and wellness benefits: Company-paid medical,
    dental, and vision (with 100% employer paid options and
    90% coverage for dependents), FSA and HSA, 401k match, and
    telehealth options including memberships to One Medical.
  - Support for Titans at all stages of life: Parental leave and
    support, up to $20k in fertility services (i.e. IUI and
    IVF), surrogacy, and adoption reimbursement, on demand
    maternity support through Maven Maternity, free breast
    milk shipping through Maven Milk, pet insurance, legal
    advisory services, financial planning tools, and more.

  At ServiceTitan, we celebrate individuality and uniqueness.
  We believe that the convergence of fresh perspectives and
  experiences from all walks of life is what makes our product
  and culture so great. We strongly encourage people from
  underrepresented groups to apply. We do not discriminate
  against employees based on race, color, religion, sex,
  national origin, gender identity or expression, age,
  disability, pregnancy (including childbirth, breastfeeding,
  or related medical condition), genetic information,
  protected military or veteran status, sexual orientation, or
  any other characteristic protected by applicable federal,
  state or local laws.

  ServiceTitan is committed to fair and equitable compensation
  for all of our employees. We thoughtfully consider a wide
  range of factors when determining individual compensation,
  which may change over time. We comply with all applicable
  minimum wage laws. For candidates in the United States, the
  good faith salary ranges estimate for this role is

  Zone 1: $218,300 USD - $327,500 USD Applicable for: CA, CT,
  DC, MD, MA, NJ, NY, VA, and WA

  Zone 2: $204,000 USD - $306,000 USD Applicable for: All
  other US locations.

  International Compensation for candidates residing outside
  the United States will vary by location and will be
  discussed during the hiring process. Actual compensation
  within a range is determined by factors including relevant
  experience, skill set, qualifications, and performance. In
  addition to base salary, our total compensation package
  includes an annual bonus, equity, and a holistic suite of
  benefits.
