  - Health insurance
  - 401(k) with matching contribution
  - Flexible vacation time
  - Flexible work hours
  - Work-from-home/remote office stipend, or desk at Ambrook’s
    NYC office or Denver office
  - Wellness stipend
  - Professional development stipend

