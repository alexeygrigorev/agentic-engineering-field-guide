description: |
  Job Type: Full-Time | Location: Remote (United States)

  Techstars is undergoing a significant platform
  transformation: consolidating legacy systems into Techstars
  OS, sunsetting older tools, and leaning into AI to run our
  business lines more effectively. As Product Manager, you
  will be the operational center of gravity for this work. The
  VP of Product & Engineering owns roadmap and strategy; you
  own the day-to-day delivery. That means taking a loosely
  defined stakeholder request and turning it into a clear,
  documented plan that engineering can build against. It also
  means getting stakeholders aligned, keeping them informed,
  and shepherding them through change, not just collecting
  their feedback. This role spans the full Techstars internal
  platform: OS, data systems, founder tools, and the
  integrations that connect them.

  What you will do

  - Translate ambiguous stakeholder requests into well-
    structured, engineering-ready work plans: clear scope,
    acceptance criteria, open questions called out, tradeoffs
    documented
  - Own day-to-day product delivery across Techstars internal
    systems and their supporting tools
  - Run the product lifecycle end to end: intake, discovery,
    requirements, sprint management, go-live coordination, and
    post-launch follow-up
  - Manage the backlog in Jira: sprint planning, refinement,
    prioritization, and keeping the team focused and unblocked
  - Produce clear, direct documentation that demonstrates that
    you understand the problem and the solution in your own
    words, not that you can prompt an AI to generate one.
  - Lead change management as Techstars moves away from legacy
    systems
  - Shepherd stakeholders through the full lifecycle of a
    change, communicating tradeoffs, managing expectations,
    and bringing people along
  - Partner closely with the operations and program teams to
    understand real workflow friction before specifying
    solutions
  - Maintain human-digestible documentation so context is
    captured and the team can move fast without losing
    institutional knowledge
  - Track usage and adoption of new features and flag what is
    not landing so the team can iterate quickly

  What you bring

  - 4+ years of product management experience in software,
    ideally at a company where you worked across multiple
    internal tools or platforms, not a single product
  - Proven ability to turn a loosely defined problem or request
    into a documented, scoped plan that an engineering team
    can execute on
  - Strong change management instincts: you know how to get
    stakeholders on board with something they did not ask for,
    and how to hold that relationship through a difficult
    transition
  - Experience working directly with engineers, you understand
    technical tradeoffs, can read a ticket, and know when to
    push back on scope
  - Excellent written communication: your PRDs, tickets, and
    async updates are clear the first time and do not require
    meetings to explain
  - Proficiency with Jira and agile/scrum processes, sprint
    planning, capacity management, and release coordination
  - Comfort working across a wide range of stakeholders from ELT
    to program associates, you adjust your communication style
    and know how to build trust at every level
  - A bias for action and equanimity under shifting priorities,
    you can hold multiple workstreams without losing the
    details
  - Analytical enough to define a success metric, instrument a
    feature, and know whether it actually worked

  Nice to have

  - Experience in a startup accelerator, venture capital, or
    founder-services context
  - Hands-on familiarity with Salesforce, Metabase, Jira, and
    Notion as a power user
  - Experience managing a product through a legacy migration or
    platform consolidation
  - Background working with data or operational systems, you
    have worked on features that help non-technical teams get
    value out of structured data
  - Experience working at or with a small, high-autonomy
    engineering team

  Knowledge of financial or investment data in a VC or startup
