description: |
  Full Stack Engineer - React/ Typescript - Python  (VP)

  Engineer the future of global finance. At Citi, our Tech
  team doesn’t just support finance – we are helping to
  redefine it. Every day, $5 trillion crosses through our
  network. We do business in 180+ countries operating at a
  scale few can match. From deploying advanced AI to helping
  shape global markets, we build systems that matter. Look to
  join a team where your work helps influence economies, your
  ideas can drive innovation and outcomes, and your growth is
  backed by mentorship, continuous learning and flexibility
  with potential hybrid work opportunities. Help solve real-
  world challenges that touch millions and get the opportunity
  to build the future of finance with Citi Tech.

  Department Overview:

  Equities Technology at Citi is undertaking a bold,
  multi‑year transformation to build a best‑in‑class global
  platform across execution, prime, clearing and cross‑product
  margining. We are re‑engineering our technology estate to
  achieve world‑leading performance and resiliency, enabling
  new capabilities in advanced execution, global market
  connectivity, and modernised post‑trade, clearing and margin
  processes. Our ambition is to deliver a seamlessly
  integrated, highly automated platform that drives
  outstanding client outcomes and accelerates growth across
  our global franchise. As part of the team, you’ll
  collaborate closely with high‑calibre engineers and deeply
  engaged business and product partners - working together to
  define and deliver the next generation of Equities
  technology at Citi.

  Role Overview

  Citi is seeking an accomplished and highly motivated Vice
  President (VP) level developer to join our Strategic Equity
  Solutions (SES) team. This role offers the opportunity to
  contribute to the creation of greenfield services focused on
  enhancing trader workflow tooling. As a key member of an
  agile, self-organizing team, you will have direct engagement
  with business users globally, offering substantial autonomy
  in technology decisions. Our team is committed to continuous
  delivery, owning the entire pipeline to production, and
  striving for frequent releases that drive immediate business
  value.

  What will you do:

  - Design & Develop: Iteratively develop robust, high-
    performance software solutions from initial concept
    through to production deployment, directly impacting
    trader efficiency and capabilities.
  - Business Acumen & Product Ownership: Collaborate closely
    with business stakeholders, demonstrating a keen
    understanding of business drivers and a strong product
    owner mindset. You will translate complex requirements
    into technical specifications and innovative solutions
    that address critical trading needs. Functionally, this
    role will directly support the Strategic Equity Solutions
    (SES) business.
  - Code Excellence: Produce clean, efficient, and well-
    documented code, adhering to best practices and
    contributing to a high-quality codebase.
  - Engineering Leadership: Champion and share best engineering
    practices, foster a culture of continuous improvement, and
    mentor junior colleagues across the wider technology team.
    Technically, you will be an integral part of the ABS team.
  - Innovation & Adaptation: Proactively evaluate and integrate
    new technologies, including AI tooling, to maintain a
    leading edge in our solutions.
  - Full Lifecycle Ownership: Take ownership of the entire
    software development lifecycle, from design and
    development to testing, deployment, and monitoring in a
    DevOps-centric environment.

  Key Skills and Experience:

  We are looking for a versatile and experienced professional.
  This position can be tailored to a Full Stack Developer or a
  dedicated Backend Developer, depending on the candidate's
  core strengths and career aspirations.

  Technology Skills Desired:

  - Backend Expertise (Mandatory for Backend Role, Highly
    Desired for Full Stack):
    - Strong proficiency in modern backend languages such as
      Kotlin and/or Python.
    - Extensive experience with microservices architecture and
      developing scalable, resilient services.
    - Demonstrated experience deploying and managing applications
      within containerization platforms like Kubernetes and
      OpenShift.
  - Frontend Expertise:
    - Experienced in Python-based frontend frameworks (e.g., Dash,
      Streamlit, or other relevant Python web frameworks)
      would be desirable.
  - DevOps & Modern SDLC:
    - Deep understanding and practical application of DevOps
      principles, including CI/CD pipelines, automated
      testing, and trunk-based development.
    - A strong commitment to fully automated testing and
      continuous integration.
  - Domain Knowledge:
    - Prior experience with front office applications and an
      understanding of trading workflows, financial
      instruments, or market data will be a significant
      advantage.
  - Educational Background:
    - Bachelor’s degree or University degree in Computer Science,
      Engineering, or a related field, or equivalent practical
      experience in a similar role.

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

  What we’ll provide you

  By joining Citi, you will not only be part of a business
  casual workplace with a hybrid working model (up to 2 days
  working at home per week), but also receive a competitive
  base salary (which is annually reviewed), and enjoy a whole
  host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources

  Visit our About Us | Culture, Values & Benefits page to
  learn more.

  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

