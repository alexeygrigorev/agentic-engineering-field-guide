description: |
  At Hudl, we build great teams. We hire the best of the best
  to ensure you’re working with people you can constantly
  learn from. You’re trusted to get your work done your way
  while testing the limits of what’s possible and what’s next.
  We work hard to provide a culture where everyone feels
  supported, and our employees feel it—their votes helped us
  become one of the Top 100 Inspiring Workplaces. We think of
  ourselves as the team behind the team, supporting the
  lifelong impact sports can have: the lessons in teamwork and
  dedication; the influence of inspiring coaches; and the
  opportunities to reach new heights. That’s why we help teams
  from all over the world see their game differently. Our
  products make it easier for coaches and athletes at any
  level to capture video, analyze data, share highlights and
  more. Ready to join us?

  Your Role

  We're hiring a Senior Software Engineer to join our Core
  Data team in London.

  This team builds the systems that power how Hudl understands
  sport at scale. From identifying players and teams across
  thousands of leagues to processing the moments that become
  highlights, stats and analysis, our services sit at the
  center of Hudl's platform.

  As a Senior Engineer, you'll help shape the technical
  direction of the Global Sports Library (GSL), the backbone
  that connects identities, metadata and game context across
  Hudl products. You'll design and evolve APIs, distributed
  systems and large-scale data pipelines that ensure Hudl
  products operate from a consistent understanding of the
  game.

  This role is deeply backend-focused and comes with
  significant ownership. You'll tackle complex engineering
  challenges around scalability, entity resolution, data
  consistency and platform architecture, while helping raise
  the technical bar across the team through design leadership,
  mentoring and pragmatic decision-making.

  The systems you build won't support just one product or one
  sport. They'll become shared capabilities used across Hudl's
  ecosystem, powering experiences for teams, athletes and fans
  around the world.

  - Be a key technical leader. You'll support the team by
    breaking down complex engineering problems, advocating for
    best practices and guiding others in addition to your
    focus on delivery.
  - Maintain efficiency. You'll ensure your team delivers high-
    impact work efficiently by focusing on outcomes over
    outputs. Your leadership will empower the team to make
    data-driven decisions and iterate quickly on feedback.
  - Collaborate across disciplines. You'll work closely with
    leaders from various disciplines to plan and deliver
    enhancements across our product suite. Your ability to
    integrate diverse perspectives will be key to driving
    innovation.
  - Foster Agile practices. You'll participate actively in Scrum
    ceremonies and play a significant role in maintaining a
    strong team culture.

  Location

  Time spent collaborating with your teammates in-office will
  be a regular part of how you work. We're currently
  considering applicants within commuting distance of London.
  You'll be expected to work more days in-office than remote,
  but will have the freedom to coordinate your specific in-
  office schedule with your team.

  Must-Haves

  - Strong technical proficiency. You have extensive experience
    in full-stack engineering and have spent time with cloud-
    based systems and services. You're also an advocate of TDD
    and CI/CD.
  - Technical coaching experience. You're comfortable
    translating requirements, creating architectural proposals
    and guiding other engineers through implementation.
  - A collaborative, team-first mindset. You know building
    excellent software is a team effort and you're willing to
    pitch in whenever a teammate needs a hand.
  - Mentor mentality. You believe in the multiplier mindset and
    enjoy helping fellow engineers hone their skills through
    code reviews and pair programming.

  Nice-to-Haves

  - Tech stack knowledge. Professional background in C#,
    GraphQL, Elastic, MongoDB and AWS is ideal.
  - Experience with media at scale. You've worked with video
    encoding and on-demand rendering in a professional
    setting.
  - Passion for sports. You have an interest in the sports world
    and an understanding of sports analytics is a definite
    plus.
  - Familiarity with hybrid teams. You've worked with hybrid or
    remote teams before and can adapt quickly to our working
    environment.

  Our Role

  - Champion work-life harmony. We'll give you the flexibility
    you need in your work life (e.g., flexible vacation time
    above any required statutory leave, company-wide holidays,
    remote work options and more) so you can enjoy your
    personal life too. Plus, every five years, we give you a
    paid sabbatical to unplug and recharge.
  - Guarantee autonomy. We have an open, honest culture and we
    trust our people from day one. Your team will support you,
    but you'll own your work and have the agency to try new
    ideas.
  - Encourage career growth. We're lifelong learners who
    encourage professional development. We'll give you tons of
    resources and opportunities to keep growing.
  - Provide an environment to help you succeed. We've invested
    in our offices, designing incredible spaces with our
    employees in mind. But whether you're at the office or
    working remotely, we'll provide you the tech you need to
    do your best work.
  - Support your wellbeing. Depending on location, we offer
    medical and retirement benefits for employees—but no
    matter where you're located, we have resources like our
    Employee Assistance Program and employee resource groups
    to support your mental health.

  Compensation

  The base salary range for this role is displayed
  below—starting salaries will typically fall near the middle
  of this range.

  We make compensation decisions based on an individual's
  experience, skills and education in line with our internal
  pay equity practices.

  This role will also be eligible for a long-term incentive
  (LTI) award. Any bonuses awarded are based on individual and
  company performance paid at Hudl's discretion.

  Base Salary Range

  £66,000—£111,000 GBP

