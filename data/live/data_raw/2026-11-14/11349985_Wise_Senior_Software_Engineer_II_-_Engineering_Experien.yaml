description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role:

  Engineering Experience looks after developer productivity at
  Wise. We work in two ways. We operate services that
  engineers rely on every day, and we are the pillar team
  responsible for improving engineering productivity across
  Wise.

  We are looking for an experienced software engineer who
  wants to make life better for other engineers. You will
  build and run tools, help set our technical direction and
  work directly with teams so the things we create are useful
  in practice. This is a hands-on role for someone who writes
  strong production software and is comfortable teaching,
  advocating and leading change.

  How we work:

  Everything we build needs to work for more than 1,200
  engineers. That scale matters. We are not looking for
  isolated wins. Saving every engineer an hour has a huge
  impact, so we focus on common problems and solutions that
  work across Wise.

  We learn by talking to engineers, looking at usage data and
  seeing how our services behave in production. We use that
  evidence to design, build and operate improvements that are
  secure, reliable and easy to use. Adoption is part of the
  engineering work. We run workshops, write practical guidance
  and communicate in large engineering forums to help good
  tools become everyday habits.

  We are an AI first team using agentic development tools
  across the entire SDLC to enhance our productivity and have
  more impact at Wise. We do not use the tools to replace what
  we care about, which is people, relationships and working as
  a team.

  What will you be working on?:

  - Owning and operating the agentic tooling used by engineers
    across Wise, including security, access to models and
    tools, telemetry and evaluation.
  - Building an engineering knowledge base exposed through a MCP
    server, so engineers and AI agents can find trusted
    internal context when they need it.
  - Leading AI enablement across engineering through hands-on
    workshops, practical guidance and adoption campaigns that
    help teams use these tools confidently in their day-to-day
    work.
  - Building and operating products that remove friction across
    software development, from local setup and code review
    through to deployment and operation.
  - Improving the developer portal and other shared engineering
    services so tools, guidance and engineering signals are
    easy to find and act on.
  - Using research, feedback and data to find problems shared by
    many teams, then turning them into software and changes
    that save engineers time across Wise.

  What do you need?:

  - A senior engineer comfortable working in a polyglot
    environment. Our tools and services span languages
    including Java, Go, Python and TypeScript. You need to be
    an expert in either Java, Go or TypeScript, but not all of
    them.
  - Strong experience building and operating production
    software, including taking services from design through to
    reliable operation.
  - Excellent software design judgement. You can break down
    complex problems, define clear boundaries and interfaces,
    and build systems that are testable, maintainable and
    observable.
  - Practical experience using agentic tools to deliver real
    user stories, not only prototypes. You know how to give
    agents the right context and constraints, review their
    output and take responsibility for the result.
  - A genuine passion for AI developer tooling and a habit of
    learning as the field changes. You are interested in how
    these tools are built, secured, evaluated and adopted.
  - Experience building internal platforms or tooling used by
    other engineers, with the empathy to treat engineers as
    your users.
  - Experience leading large technical initiatives across teams
    and keeping delivery moving when the path is not obvious.
  - Strong code review skills and a high bar for engineering
    quality, including clear tests and practical feedback that
    helps other engineers improve.
  - Confidence explaining technical ideas to varied audiences,
    leading workshops and advocating for change across a large
    engineering organisation.

  Interested? Find out more:

  - How we work – a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it's like to work at Wise London!
  - Our Engineering career map
  - Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £111,000 - £145,000
  - Wise Benefits

  Interested in more than one role?

  If you're interested in multiple roles, please apply for
  just one—the one you're most excited about. If you submit
  multiple applications requiring the same assessment, we'll
  continue your recruitment journey using your first
  application, and any duplicate applications will be
  automatically closed. This helps ensure a fair and
  consistent interview process. If another role feels like a
  better fit, you can discuss this with your recruiter during
  the process.







  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
