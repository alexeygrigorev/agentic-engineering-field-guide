description: |
  ABOUT CORDIAL

  We founded Cordial in 2014 on the belief that there should
  be more humanity and empathy in marketing—both in how brands
  communicate with their customers and in how technology
  companies work with brands. We built our company and
  platform purposefully, driven by a desire to inspire more
  thoughtful communication and to create experiences that feel
  more personal and human—for consumers, for the people at the
  companies we work with, and for Cordial employees. Today,
  brands like PacSun, Revolve, Abercrombie & Fitch,
  Realtor.com, L.L. Bean and Forbes rely on Cordial to drive
  revenue growth by sending a better message.

  We chose the name Cordial to symbolize how we empower our
  clients to communicate with their customers, as well as how
  we do business: with transparency, collaboration, and trust.
  We're building a passionate team of individuals willing to
  learn, grow, and be thoughtfully challenged on a daily basis
  to continuously improve our product, company, and culture
  every single day.

  OUR VALUES

  - Communicate better than the rest
  - Own it, every time
  - Solve client problems tenaciously
  - Make Waves

  POSITION SUMMARY

  Cordial is seeking a Senior Software Engineer who will guide
  the engineering team in developing scalable, high-
  performance systems by defining technical roadmaps and
  setting standards for code quality. You will mentor team
  members, drive architectural improvements, collaborate with
  stakeholders, and ensure timely delivery of features while
  advocating for engineering needs.

  This role is based in the United States on Eastern Time or
  in the United Kingdom.

  YOU WILL

  - Define and lead technical roadmaps, ensuring that the
    engineering team builds scalable, high-performance
    systems.
  - Set engineering standards for code quality, design, and
    implementation, guiding the team to follow these
    principles.
  - Provide mentorship to junior and senior engineers, promoting
    a culture of knowledge sharing and continuous improvement.
  - Identify and implement best practices in software
    development and ensure the team adopts them.
  - Lead architectural discussions, ensuring that software
    systems meet long-term goals, performance, and
    scalability.
  - Collaborate with product managers, stakeholders, and other
    engineers to develop sound technical strategies and
    solutions.
  - Drive architectural improvements and technical debt
    resolution across the platform.
  - Make critical decisions on technology stacks, tools, and
    frameworks that align with our business and technical
    objectives.
  - Partner closely with Product, Design, and other business
    units to align engineering work with business priorities.
  - Advocate for engineering needs and ensure that projects are
    executed within timeframes and budgets.
  - Ensure the timely delivery of features and services that
    meet quality standards.
  - Stay up-to-date with the latest trends and technologies in
    software development and bring innovative ideas to the
    team.
  - Lead research and development initiatives to explore new
    tools and approaches to solve technical challenges.
  - Tackle complex and challenging problems that require in-
    depth technical knowledge and creative solutions.
  - Serve as a role model in both technical and soft skills,
    contributing to a positive engineering culture.
  - Mentor other engineers, fostering their technical and career
    growth.
  - Lead technical interviews and play a key role in hiring and
    onboarding new team members.

  ABOUT YOU

  - 7+ years of software engineering experience, with a track
    record of leading technical work on complex, high-scale
    systems.
  - You think in systems — you have deep experience designing
    scalable, performant architectures and know how to make
    technology decisions that hold up as a product and team
    grow.
  - You hold yourself and others to a high bar for code quality,
    design, and implementation — and you know how to raise
    that bar in a way that brings people along with you, not
    just over them.
  - You're a natural mentor. You find genuine satisfaction in
    the growth of others, and you share knowledge freely — not
    because it's expected, but because it makes the whole team
    better.
  - The code word is #becordial
  - You're comfortable in ambiguity. You can define a technical
    roadmap from a business goal, identify what's missing, and
    drive alignment without needing all the answers handed to
    you up front.
  - You operate like an owner. You care about outcomes — not
    just the technical elegance of a solution, but whether it
    actually solves the problem, ships on time, and moves the
    business forward.
  - You thrive in cross-functional collaboration. You can
    translate complex technical concepts for non-technical
    stakeholders, and you know how to partner with Product and
    Design to build things that are both right and on time.
  - You're tenacious about solving hard problems. When something
    is broken or holding the team back — tech debt, tooling
    gaps, architectural constraints — you don't look away. You
    lead the charge.
  - You're curious and continuously learning. You stay close to
    what's evolving in the industry, bring new ideas to the
    team, and aren't afraid to challenge the status quo when
    there's a better way.
  - You communicate exceptionally well — in code reviews, in
    architecture discussions, in interviews, and in the
    hallway. People leave conversations with you feeling
    clearer, not more confused.
  - You care about culture. You understand that how a team works
    together is just as important as what it builds — and you
    actively contribute to an environment of transparency,
    trust, and continuous improvement.

  APPLICATION INSTRUCTIONS

  Resume Submission Requirement — Please Read Carefully

  When uploading your resume, your file must be named in the
  following format:

  FIRSTNAME-LASTNAME-CORDIAL2026

  Example: JOE-DOE-CORDIAL2026

  Applications that do not follow this naming convention
  exactly will be automatically rejected and will not be
  reviewed. Please double-check your file name before
  submitting.

  Accepted file formats: PDF or Word (.docx)

  COMPENSATION & BENEFITS

  $160,000.00 - $175,000.00 base salary annually. The
  compensation range may be adjusted based on experience and
  location. In combination with base salary, Cordial's
  compensation package includes equity and bonus, a robust
  benefit plan (medical/dental/vision/life), 401k match, and
  flexible time off. Additionally, we offer perks such as
  childcare and continued education yearly reimbursements. We
  pride ourselves in maintaining a healthy work/life balance,
  a strong dedication to DE&I efforts, and an overall
  respectful and open culture!

  WORK AUTHORIZATION

   As of January 1, 2026, Cordial does not provide visa
  sponsorship, visa transfers, immigration support, or
  employment-related documentation for immigration purposes,
  including letters supporting visa applications, renewals,
  transfers, or work authorization, for new hires.

  Cordial is proud to be an equal opportunity employer that
  celebrates diversity and is committed to creating an
  inclusive workplace with equal opportunity for all
  applicants. Our goal is to recruit the most talented people
  from a diverse candidate pool regardless of race, color,
  ancestry, national origin, religion, disability status, sex
  (including pregnancy), age, gender, gender identity or
  expression, sexual orientation, marital status, veteran
  status, or any other characteristic protected by law.

  Cordial is committed to working with and providing access
  and reasonable accommodation to applicants with mental
  and/or physical disabilities. If you require an
  accommodation, please reach out to your recruiter once
  you've begun the interview process. All requests for
  accommodations are treated discreetly and confidentially, as
  practical and permitted by law.
