description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  Team you will be working with: Receive Risk

  The Receive Risk team is part of Acquiring Squad, in the
  Global Product tribe, dedicated to ensuring customers can
  receive money quickly and securely, using our full suite of
  Acquiring products. We build smart fraud detection and
  prevention systems to stop scammers and fraudsters from
  exploiting Wise or defrauding our customers.

  Supporting our full suite of Acquiring products — QuickPay,
  Payment links, Invoices, e-commerce, and more — we work
  closely with our financial crime teams to strike the perfect
  balance: seamless experiences for legitimate users, strong
  barriers against bad actors.

  What will you be working on?

  We're looking for a Backend Engineer to build a fraud engine
  that will help us ship new products and features quickly
  while keeping risk and cost low. This will involve working
  closely with Product, Data Science, Fraud Prevention
  Analysts and our Fraud agents to strike the right balance
  between scaling quickly and mitigating risk efficiently.

  What do you need?

  - Hands-on experience with distributed systems, including
    microservices architecture and backend services supporting
    large-scale traffic.
  - Proven ability to deliver high-performance, low-latency
    systems with a focus on speed, scalability, and
    reliability.
  - Strong product-oriented mindset, with end-to-enpd ownership
    of features and close collaboration across teams.
  - Proficiency in Java (preferred) or solid experience with
    similar backend programming languages.
  - Familiarity with messaging systems such as Kafka or
    RabbitMQ, and strong knowledge of relational databases
    (SQL).
  - Excellent communication and collaboration skills, combined
    with a growth mindset and focus on delivering user and
    business value.

  Nice to Have:

  - Understanding of basic machine learning concepts and
    experience building data pipelines.
  - Mentorship experience, helping team members grow and
    contributing to a culture of continuous learning.

