description: |
  Join the team bringing autonomy to the built world

  At Bedrock, we're moving AI out of the lab and onto real job
  sites. Our team includes veterans who helped launch Waymo,
  scaled Segment to a $3.2B acquisition, and grew Uber Freight
  to $5B in revenue. We retrofit the heavy equipment
  contractors already own, starting with excavators, so
  experienced crews can safely take on more projects and
  deliver more of the critical infrastructure our society
  needs. In August 2026, Bedrock-equipped excavators began
  doing fully autonomous, paid work on live commercial job
  sites. We've more than doubled our customer base since 2025,
  and our machines now work with contractors across the South,
  Midwest, and Mid-Atlantic In October 2026, we raised a $600M
  Series C co-led by CapitalG and Emergence Capital, bringing
  our total funding to nearly $1B. We're using it to put more
  autonomous machines to work, build the field and operations
  teams behind every deployment, and expand into new machine
  types and job-site tasks. This is where algorithms meet
  steel-toed boots. You'll work alongside construction
  veterans and world-class engineers to solve physical-world
  problems that simulations can't touch. If you're ready to do
  meaningful work on hard problems, we'd love to have you join
  us.

  The Role:

  Take on a lead role in designing and building the core
  services and infrastructure that will power the next
  generation of autonomous construction equipment. From fleet
  management to autonomous task orchestration and machine
  coordination- you’ll work with a world class engineering
  team to build and design the core infrastructure that powers
  our machine interfaces, workflows, and services.

  Also, you get to drive 100,000 lb excavators.

  What You'll Do:

  - Own the design, architecture, implementation and iteration
    of 0-to-1 services and infrastructure to support
    autonomous operations and distributed fleet management
  - Develop data intensive services for machine operators to
    visualize and monitor robotics systems
  - Partner closely with a full stack team (from Frontend, to ML
    and Robotics) to design technical solutions efficiently,
    be comfortable with rapid prototyping and experimentation
  - Build tooling to streamline processes such as autonomous
    testing, model deployments, and in-the-field fleet
    management
  - Establish our core backend frameworks, patterns, and
    infrastructure

  Required Qualifications:

  - 6+ years of professional experience owning the design,
    architecture and implementation of backends to highly
    complex, business critical applications
  - Expertise in running and maintaining high-uptime services:
    observability, monitoring, and performance tuning
  - Small startup experience: rapid prototyping and building
    from the ground up
  - Capability to design and implement application architectures
    from first principles with modern cloud technologies

  Preferred Qualifications:

  - Some experience building with complex geospatial tooling
    (e.g. GIS, robotics, construction tech, command & control
    interfaces)
  - Experience dealing with infra at the edge: low latency SLAs
    in dynamic bandwidth environments (LTE, IoT, mobile)
  - Experience working in AWS

  Bedrock Robotics is an Equal Opportunity Employer

  We’re committed to building a diverse and inclusive
  workplace. We consider all qualified applicants for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  ancestry, age, disability, veteran status, genetic
  information, or any other protected characteristic.

  Reasonable Accommodations

  We want our hiring process to be accessible to everyone. If
  you need an accommodation to participate in the application
  or interview process, please let your recruiter know so we
  can support you.
