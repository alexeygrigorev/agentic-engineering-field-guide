description: |
  Help scale the software behind autonomous systems already
  operating in the real world.

  At sees.ai, we've developed the core software platform
  behind our autonomous aircraft technology. It's proven in
  the field and already supporting energy grid inspection
  missions being flown internationally.

  Now we're tackling the next set of engineering challenges:
  making the system more capable, reliable and scalable as our
  operations grow.

  How do we improve performance when computing resources and
  connectivity are constrained? How do we evolve complex
  software without compromising reliability? How do we build
  new capabilities while supporting an expanding fleet
  operating in the real world?

  We're looking for a Senior C++ Software Engineer who enjoys
  solving problems like these.

  You'll work across our core software stack, spanning flight
  control, mission systems, simulation, connectivity and
  operator interfaces. You'll develop new capabilities, tackle
  difficult technical problems and help shape the architecture
  and engineering practices that support our next stage of
  growth.

  You'll join a collaborative team of engineers working across
  software, robotics, hardware and operations, with the
  opportunity to influence technical decisions and see your
  work deployed in the field.

  We're continuing to grow our software engineering team,
  having already recruited several engineers over the past
  year. With further investment secured, we're now expanding
  the team to support the next stage of growth.

  What You'll Be Doing

  - Developing and improving C++ software across our autonomous
    systems platform.
  - Taking ownership of complex technical problems, from
    debugging and root-cause analysis through to
    implementation and deployment.
  - Improving performance, reliability and efficiency under
    real-world operating constraints.
  - Contributing to software architecture, testing and
    engineering practices as the platform evolves.
  - Working closely with engineering and operations colleagues
    to translate operational feedback into software
    improvements.
  - Supporting and sharing knowledge with other engineers.

  What You'll Bring

  - Significant hands-on experience developing complex
    production software in modern C++.
  - Strong software engineering fundamentals, including
    architecture, design, debugging and testing.
  - Experience developing software in Linux environments.
  - The ability to tackle unfamiliar problems from first
    principles and make sound technical decisions.
  - A good understanding of software performance, memory
    management and computing constraints.
  - Intellectual curiosity, independent thinking and a genuine
    enjoyment of programming.

  You don't need a background in robotics. We're equally
  interested in excellent software engineers from games
  development, simulation, scientific computing and other
  technically demanding disciplines. What matters is how you
  think, solve problems and write software.

  Why Join Us?

  - Work on challenging technical problems with direct, visible
    results in real-world operations.
  - Help shape the technical direction of a sophisticated
    software platform as it scales.
  - Work alongside talented engineers across software, robotics,
    hardware integration and operations.
  - Join a friendly, collaborative team where you can take
    ownership and your ideas count.
  - Be part of a venture-backed company with proven technology,
    major commercial contracts and international growth
    ambitions.
  - Competitive salary and share options — own a piece of what
    you help build.

  Location: London EC1V – Hybrid working, with regular visits
  to Chichester.
