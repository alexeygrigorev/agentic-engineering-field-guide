description: |
  Senior Full-Stack E-Commerce Technical Lead

  New York, NY

  1-Year Contract



  Position Summary

  We are seeking a Senior Full-Stack E-Commerce Technical Lead
  to help build an enterprise-grade B2B e-commerce platform
  supporting a catalog of 1M+ products and integrations with
  TD SYNNEX, Microsoft Dynamics 365 Business Central, payment
  providers, shipping services, and other business systems.

  This is a hands-on technical leadership role. You will
  design the architecture, write production code, lead
  integrations, solve scalability and reliability challenges,
  review code, and mentor an existing developer. The goal is
  to deliver a production-ready platform within approximately
  12 months through phased releases.

  Key Responsibilities

  Design scalable architecture for a large B2B e-commerce
  platform.

  Lead full-stack development across storefront, backend
  services, APIs, databases, search, and integrations.

  Design and implement TD SYNNEX integration, including
  product catalogs, pricing, inventory, orders, shipments,
  tracking, and error/retry handling.

  Architect and manage 1M+ product catalogs, including bulk
  imports, incremental updates, product data, pricing,
  inventory, caching, and validation.

  Build scalable enterprise search using technologies such as
  Elasticsearch, OpenSearch, Azure AI Search, or Algolia.

  Develop B2B commerce capabilities including customer/company
  accounts, roles, cart, checkout, quotes, POs,
  customer/contract pricing, credit terms, orders, shipping,
  tax, returns, and reordering.

  Integrate with Microsoft Dynamics 365 Business Central for
  customers, products, orders, pricing, invoices, payments,
  credit limits, shipments, and financial reconciliation.

  Develop secure and scalable REST APIs, background jobs,
  webhooks, queues, caching, logging, monitoring, and event-
  driven services.

  Design and optimize relational databases and large-scale
  data processing.

  Establish Azure cloud architecture, CI/CD, monitoring,
  security, backup/recovery, and disaster recovery.

  Ensure application security, including authentication, RBAC,
  API security, OWASP practices, encryption, audit logging,
  and PCI-aware payment architecture.

  Drive performance testing, scalability, integration testing,
  security testing, and production readiness.

  Conduct code reviews, mentor developers, and translate
  business requirements into technical solutions.

  Required Qualifications

  7+ years of professional software development experience.

  3+ years working on complex production web applications or
  e-commerce platforms.

  Strong full-stack, backend/API, SQL, and relational database
  experience.

  Experience integrating third-party APIs and designing
  scalable cloud applications.

  Strong knowledge of authentication, authorization, security,
  reliability, monitoring, and failure recovery.

  Experience with Git and modern CI/CD practices.

  Strong troubleshooting, production debugging, communication,
  and technical documentation skills.

  Ability to independently translate business requirements
  into technical solutions.

  Highly Preferred

  TD SYNNEX, Ingram Micro, or similar distributor integration
  experience

  Large-scale B2B e-commerce / 500K+ SKU catalogs

  Microsoft Dynamics 365 Business Central / Dynamics 365

  Azure, Azure AI Search, Elasticsearch/OpenSearch, Redis,
  Azure Service Bus

  ERP, payment gateway, tax, and shipping integrations

  B2B purchasing, Net 30/credit accounts, customer-specific
  and contract pricing.

  Important

  This is not primarily a website-design or frontend-only
  role. We are looking for someone experienced in solving
  backend, integration, data, scalability, security, and
  production reliability challenges.
