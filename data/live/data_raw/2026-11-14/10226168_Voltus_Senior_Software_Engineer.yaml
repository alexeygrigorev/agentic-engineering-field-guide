description: |
  About Voltus

  Voltus is a leading company for Distributed Energy Resources
  (DERs). Our mission is to be the platform that fulfills the
  promise of the energy transition. The Voltus platform
  connects any DER to any energy market across the US and
  Canada, providing flexibility, reliability, and resilience
  to the grid while generating revenue for our partners.

  We hire teammates who are bright, gritty, and good and who
  have a genuine passion for delivering a cleaner energy
  future and for working in a fast-paced, entrepreneurial
  environment. We are a remote and virtual company,
  distributed across US, Canada, and abroad.

  The Role

  Voltus is hiring for multiple roles at the senior level on
  several teams. As a Senior Engineer you will find a home on
  one of these teams and assume a technical leadership role in
  our backend solutions and front end technologies where
  appropriate to the team. You'll join a fully remote team
  tackling complex energy industry challenges, collaborating
  with experienced engineers on our modern tech stack, and
  contributing to core systems that decarbonize the grid.

  Your work will involve building core backend logic, APIs,
  designing data pipelines, or creating customer interfaces. A
  strong candidate can speak to their alignment with our core
  values of bright, gritty, and good, and you want to work
  with others like you in a highly collaborative environment.

  Technologies We Use

  We build scalable software using Python, Postgres, Go,
  FastAPI, Temporal, Delta Lake, Clickhouse, Typescript, and
  React, running our services using Docker and the HashiCorp
  stack on AWS. We do not expect candidates to have a
  background in every tool listed here; instead, we place a
  high value on strong foundational programming skills and a
  genuine eagerness to learn and grow. Successful candidates
  can demonstrate significant depth in some of core
  technologies.

  Responsibilities

  Qualifications

  **Please include a link to your GitHub account in your
  application (in the “links” section). Applications without a
  GitHub account will not be considered**



  Please note that at this time, we do not sponsor visas or
  transfers for new hires. Voltus teammates need to be
  authorized to work from their home location (in the US or
  Canada, unless otherwise indicated on the role description).



  Additionally, while Voltus is an all-remote workplace, we
  have limitations on where employees are able to work for
  regulatory and security reasons. We expect that Voltans are
  working primarily from their home country. Working while
  traveling to other countries must be approved as per our
  Global Remote Travel Policy.



  At Voltus, we are proud to be an equal opportunity employer
  because we recognize that a diverse organization begins with
  a diverse candidate pool. This means we do not tolerate
  discrimination of any kind and are committed to providing
  equal employment opportunities regardless of your gender
  identity, race, nationality, religion, age, sexual
  orientation, veteran status, disability status, or marital
  status.
