description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We are looking for a talented Software Engineer to join our
  Recommend team in the London office. The Recommend team
  builds and owns the recommendation experience that allows
  customers to recommend Wise to their friends, family or
  connections and brings new customers to Wise through the
  recommendations. From building referral platforms, to
  creating smooth onboarding experience for referred customers
  and building reward mechanisms, we own the whole journey
  until the first international money needs are met. Our team
  is dedicated to building the best recommendation journey and
  diverse reward mechanisms to solve customers' first
  international money needs in a way that’s clear, easy and
  delightful. Our team is diverse and is made of software
  engineers, data analysts, and designers and more who
  collaborate on a daily basis to continuously improve
  customer experience with recommendation journeys at Wise.

  What will you be working on?

  We are looking for a Senior Backed Engineer to help us
  evolve and scale our recommendation platform and reward
  mechanisms for our customers all over the world. You will
  get the opportunity to build the systems, APIs and product
  experiences that help us shape the first experience of many
  of our soon-to-be-new customers

  Qualifications

  What do you need?:

  - 5+ years of experience in Java or Kotlin (or other JVM based
    language)
  - Strong experience with Spring framework, relational
    databases, distributed and concurrent systems (Kafka)
  - Close collaboration with product managers, data scientists,
    data analysts, engineers and other product teams is a must
    have and is something to expect to happen on a daily basis
  - You enjoy writing testable code and you have experience in
    testing strategies, such as unit testing, integration
    testing
  - You believe in and follow best coding practices, code
    reviews and open feedback
  - You have great communication skills and the ability to
    articulate complex, technical concepts to non-technical
    audience
  - You strive to improve our team culture and processes
  - A strong product mindset and passion for customer
    experience, you prioritise work with the customers in mind
    and make data-driven decisions to fix customer pain-points
  - Being able to work independently on customer problems is a
    key to success - you take responsibility and end-to-end
    ownership of your projects: drive and own them to make
    sure we hit the goals we want to achieve

  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
