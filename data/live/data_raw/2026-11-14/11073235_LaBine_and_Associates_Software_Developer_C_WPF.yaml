description: |
  Software Developer- C# WPF: Current interviewing candidates
  for a full-time Front-End-C# WPF, MVVM developer.

  Our client designs, develops, and maintains the most
  powerful trading tools on the market. Their target users are
  institutional traders in all asset classes and their front
  end experience is critical to their market access.

  Responsibilities:

  - Work collaboratively on multiple teams to develop concepts,
    prototypes and front end production code.
  - Produce high quality, production-ready code working with
    other team members as a C# developer.
  - Understand and use existing styles and design patterns as
    well as develop new, extensible controls including
    maintaining multiple Style Dictionaries and themes.
  - Design and develop new components using current best
    practices blending code and design.
  - Create interactive prototypes to proof and test new
    interactions, visuals, and animations.
  - Iterate on prototype and product quality by testing for and
    fixing issues.

  Skills/Requirements:

  - Minimum 2 years building software with C# and .Net
    Framework.
  - Strong C# development skills.
  - Skilled with using Microsoft Expression Blend.
  - Must be able to provide visual and code examples of user
    interface using WPF.
  - Git, CVS or other version control system exposure.
  - Agile development methods.
  - Thrive in the fast-paced delivery environment - Start-up
    experience a plus.
  - Must be able to work onsite at our Great Neck, Long Island
    New York office.

  Nice to have:

  - Experience in the financial industry.
  - Experience working with a front-end team focused on the user
    experience.
  - Linux/Unix.
  - Shell/Pearl/BASH.
  - Experience with 3rd party toolkits such as Infragistics,
    DevExpress or Telerik.
  - Knowledge of FIX Protocol.
