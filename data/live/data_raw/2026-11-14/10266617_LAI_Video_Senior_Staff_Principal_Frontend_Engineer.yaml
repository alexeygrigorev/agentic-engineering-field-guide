description: |
  Senior / Staff / Principal Frontend Engineer

  Location: Onsite New York

  We have multiple startups interested in talent. Here is a
  generic summary. Instead of a perfect job description, we
  present talented individuals to companies and allow them to
  share how that talent fits in the organization.

  A Front-End Developer is responsible for building the user-
  facing parts of websites and web applications, ensuring a
  seamless and visually appealing user experience. They
  translate designs into functional code using HTML, CSS, and
  JavaScript, and may also utilize frameworks and libraries.



  Key Responsibilities:

  •           Develop and implement user interfaces: Front-end
  developers create the visual elements of websites and
  applications that users see and interact with. •
  Translate designs into code: They take design mockups and
  wireframes and translate them into functional code using
  HTML, CSS, and JavaScript. •           Build interactive
  elements: They create interactive features and animations to
  enhance the user experience. •           Ensure cross-
  browser compatibility: They make sure the website or
  application functions correctly across different web
  browsers and devices. •           Optimize page load times:
  They optimize code for speed and efficiency, ensuring a fast
  and smooth user experience. •           Collaborate with
  back-end developers: They work closely with back-end
  developers to integrate the front-end with server-side logic
  and databases.

  •           Maintain and update existing websites and
  applications: They may be responsible for fixing bugs,
  implementing new features, and maintaining existing code.

  •           Follow industry best practices: They stay up-to-
  date on the latest front-end technologies and best
  practices.

  •           Test and debug code: They thoroughly test their
  code to ensure it functions as expected and debug any issues
  that arise.

  Key Skills:

  •           HTML, CSS, and JavaScript: Proficiency in these
  foundational web development languages is essential.

  •           Front-end frameworks and libraries: Knowledge of
  frameworks like React, Angular, or Vue.js is often required.

  •           Responsive design: Ability to create websites
  and applications that adapt to different screen sizes and
  devices.

  •           Version control systems (Git): Familiarity with
  version control systems like Git is crucial for
  collaborative development.

  •           Accessibility: Understanding of accessibility
  principles and how to make websites usable for people with
  disabilities.

  •           Problem-solving and debugging skills: Ability to
  identify and resolve issues in the code.

  •           Testing and debugging: Ability to test and debug
  code to ensure it functions correctly.



  Compensation: Market range and can include equity – details
  can be provided after the specific client is determined.
