description: |
  Join Us in Building the Future of Digital Work

  At Sola, we’re transforming the way work is done. We’re
  developing AI agents that make powerful automation
  effortless, enabling any user to record a workflow and
  instantly scale it up to millions of executions.

  Sola today powers enterprise workflows in Fortune 100
  companies, with a horizontal platform that works across
  healthcare, finance, legal, logistics, and more. We’ve
  raised $21M in funding from a16z, Conviction (Sarah Guo),
  and Y Combinator, and are looking for passionate engineers
  to help us continue to scale.

  If you’re interested in being on the forefront of agentic
  automation, we’d love to hear from you!

  What to expect

  We‘re solving one of the most interesting problems in AI
  today: building reliable, deterministic execution on top of
  non-deterministic AI models.

  As one of our first dedicated ML platform hires, you'll work
  directly with our CTO to bring state-of-the-art AI
  capabilities into production. This is an engineering role,
  not a research role. You'll own the systems that make our AI
  reliable, observable, and scalable, turning AI research into
  production features.

  This is an opportunity to join a small, tight-knit team at
  our HQ in NYC. We believe the best work happens in person,
  especially at the early stage, and you'll have the
  opportunity to learn from the founding team and early
  engineers to help shape the future of the company.

  What you'll do

  - Partner directly with our CTO to turn AI research and
    experiments into production-grade features
  - Investigate and prototype new AI capabilities, taking early-
    stage ideas and quickly determining what's feasible to
    build and ship
  - Build observability and evals infrastructure so we can
    monitor models in production and measure whether they're
    succeeding
  - Take ownership of AI features end-to-end, from design
    through deployment and monitoring, collaborating with
    other teams as needed to bring features to production

  What we're looking for

  - You have 3+ years of experience as an engineer, including
    recent work on cutting-edge ML and AI systems
  - You've owned production AI features end-to-end, from
    experimentation to maintaining live production
    infrastructure
  - You're proficient in Python with hands-on experience in
    modern ML frameworks (e.g. PyTorch, HuggingFace, DSPy)
  - You're open to working 5 days a week out of our office in
    NYC (we'll cover relocation!)

  You might excel if

  - You have hands-on experience operating at an early stage
    startup where ownership and execution in the face of
    ambiguity were essential
  - You bring an ML research background on top of your
    engineering skills, particularly in areas relevant to Sola
    (e.g. CUA, agentic reasoning, visual grounding, VLMs,
    fine-tuning)
  - You're an expert in some or all of our stack: Typescript,
    Python, DSPy, vLLM / TensorRT, Temporal, Kubernetes
  - You're ambitious, creative, and a great communicator

  Why Sola

  - $21M raised from top-tier VCs (a16z, Conviction,
    YCombinator) and growing incredibly fast
  - Proven traction with Fortune 100 customers, with horizontal
    applicability across a variety of domains (including
    finance, healthcare, legal, logistics, and more)
  - Leading-edge agentic AI tech, solving deep problems in
    partnership with the AI labs (ex. Anthropic, AWS AGI Lab)
  - Small team, early stage, with an opportunity for outsized
    impact on the company’s future
  - Work closely with founders Jessica Wu (ex-Citadel, Thrive
    Capital) and Neil Deshmukh (MIT Quest for Intelligence
    Lab), alongside David Fullerton (ex-CTO Heap, Stack
    Overflow)

  Compensation & Benefits

  Sola offers competitive salary plus meaningful equity at
  Series A stage. Exact compensation is based on experience
  and level.

  We offer comprehensive medical, dental, and vision benefits,
  401(k) matching, daily meals together in the office,
  flexible PTO (4 weeks per year), and relocation support for
  candidates not already based in NYC.
