description: |
  Senior Software Development Engineer in Test (SDET)

  Location: London (Hybrid) | Practice Area: Technology &
  Engineering | Type: Permanent

  Advance your testing career while shaping digital finance
  with automation

  The Role

  Capco is growing our Engineering team and we're looking for
  experienced SDETs with a passion for delivering innovative
  solutions in financial services. If you enjoy solving
  complex problems, working with cloud-native technologies,
  and collaborating in agile teams, we'd love to hear from
  you.

  As a Senior Software Development Engineer in Test (SDET) at
  Capco, you'll contribute to high-impact, client-facing
  projects that shape the future of financial services. You'll
  work alongside talented engineers, gain access to industry-
  leading training, and have opportunities to develop your
  expertise across multiple technology platforms and business
  domains within Financial Services & Energy. You'll also
  embrace AI-enabled ways of working, using approved AI and
  automation tools where appropriate to improve engineering
  productivity, accelerate test delivery, and enhance software
  quality while applying sound engineering judgement and
  responsible AI practices.

  What You'll Do

  - Design and implement robust, reusable, and scalable test
    strategies and automation frameworks, applying AI-enabled
    engineering approaches where appropriate to improve
    efficiency and test coverage.
  - Develop and maintain test artefacts, including test plans,
    specifications, automated scripts, and quality reporting
    to support end-to-end delivery.
  - Manage test environments and generate reliable, consistent
    test data to support functional, integration, and
    regression testing.
  - Execute UI and API automation using modern testing
    frameworks while integrating automated testing into CI/CD
    pipelines.
  - Collaborate with engineers and cross-functional teams to
    deliver quality-first solutions, encouraging the
    responsible use of approved AI tools and automation to
    improve collaboration and engineering outcomes.

  What We're Looking For

  - Strong knowledge of at least one object-oriented programming
    language, such as Java, Scala, or JavaScript.
  - Experience designing and building test automation frameworks
    using tools such as Selenium, Cypress, Playwright, or
    equivalent technologies.
  - Hands-on experience with UI and API automation, alongside a
    solid understanding of quality engineering practices.
  - Familiarity with Jira, TestRail, Jenkins, GitHub, SonarQube,
    CI/CD pipelines, and cloud infrastructure.
  - Experience using AI-enabled tools responsibly to improve
    engineering productivity while maintaining appropriate
    human oversight, governance, software quality, and testing
    standards.

  Bonus Points For

  - Development experience with modern programming languages and
    software engineering practices.
  - Performance and load testing experience using JMeter,
    LoadRunner, or equivalent tools.
  - Knowledge of DevOps practices and public cloud platforms
    including AWS, Azure, or Google Cloud.
  - Experience supporting cloud migration programmes and modern
    application delivery.
  - Curiosity to explore responsible AI, automation, and
    emerging quality engineering technologies to continually
    improve software testing and delivery.

  Why Join Capco

  - Deliver high-impact technology solutions for Tier 1
    financial institutions.
  - Work in a collaborative, flat, and entrepreneurial
    consulting culture.
  - Access continuous learning, training, and industry
    certifications.
  - Be part of a team shaping the future of digital financial
    services.
  - Help shape the future of digital transformation across
    Financial Services & Energy.

  Benefits

  We offer a competitive, people-first benefits package
  designed to support every aspect of your life:

  - Core Benefits: Discretionary bonus, competitive pension,
    health insurance, life insurance and critical illness
    cover.
  - Mental Health: Easy access to CareFirst, Unmind, Aviva
    consultations, and in-house first aiders.
  - Family-Friendly: Maternity, adoption, shared parental leave,
    plus paid leave for sickness, pregnancy loss, fertility
    treatment, menopause, and bereavement.
  - Family Care: Eight complimentary backup care sessions for
    emergency childcare or elder care.
  - Holiday Flexibility: Five weeks of annual leave with the
    option to buy or sell holiday days based on your needs.
  - Continuous Learning: Your growth, your way—minimum 40 hours
    of training annually through workshops, certifications,
    and e-learning. You'll also be assigned a Business Coach
    from Day One to support your professional development.
  - Healthcare Access: Convenient online GP services.
  - Extra Perks: Wellhub (Gympass), travel insurance, Tastecard,
    season ticket loans, Cycle to Work, and dental insurance.

  Inclusion at Capco

  We're committed to making our recruitment process accessible
  and straightforward for everyone. If you need any
  adjustments at any stage, just let us know - we'll be happy
  to help. We value each person's unique perspective and
  contribution. At Capco, we believe that being yourself is
  your greatest strength. Our #BeYourselfAtWork culture
  encourages individuality and collaboration - a mindset that
  shapes how we work with clients and each other every day.

  #LI-DNI
