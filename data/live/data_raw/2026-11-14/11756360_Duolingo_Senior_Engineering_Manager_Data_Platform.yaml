description: |
  Our mission at Duolingo is to develop the best education in
  the world and make it universally available. It’s a big
  mission, and that’s where you come in!

  At Duolingo, you’ll join a team that cares about finding
  innovative solutions to complex technical problems, running
  countless experiments (300+ at a time!) with our massive
  user base to make data-driven decisions, and educating our
  users and employees alike. You’ll have limitless learning
  opportunities, mentorship and collaboration with world-class
  minds, and a variety of projects with large scopes — while
  doing work that’s both fun and meaningful.

  Join our life-changing mission to develop education for our
  half a billion (and growing!) learners around the world.

  About the role...

  As the manager and team lead of the Experiments Team, you
  will oversee the A/B testing system that powers Duolingo's
  product development lifecycle. Experiments play an essential
  role at Duolingo, with almost all product changes going
  through some form of test. You will manage our in-house
  Experiment Platform that is responsible for defining
  experiments, executing them in the app, and measuring their
  outcome. While the role is platform-focused, you will remain
  highly connected to the product in all parts of Duolingo,
  shaping how we use A/B testing to build the best possible
  experience for our learners.

  🧠  You will...

  - Expand the capabilities on our Experiment Platform to
    support more sophisticated types of A/B tests and
    statistical methods.
  - Empower teams to confidently evaluate their key metrics and
    easily gate access to new functionality.
  - Help shape the future of the accelerated feature shipping at
    Duolingo by enabling improved experiment automation and
    backend-based control of the learner experience.
  - Scale the Experiment Platform to be able to handle
    dramatically increased experiment velocity in a
    statistically sound and cost-efficient manner.
  - Partner with product teams to devise unique approaches to
    measuring complex product scenarios and to advise on
    experiment strategy.
  - Shape the future of the Duolingo product lifecycle through
    A/B testing.

  ✅  You have...

  - Experience leading, managing, and building a team of
    software engineers, with demonstrated ability to hire,
    develop, and retain talent.
  - A track record of building scalable infrastructure and
    working with large datasets.
  - Experience with A/B testing, either via supporting
    experiment infrastructure or using A/B tests in product
    development.
  - Strong cross‑functional leadership and communication skills,
    especially between product and platform teams.
  - The ability to work from or relocate to Pittsburgh, PA or
    New York, NY.

  ⭐  Exceptional candidates will have...

  - Prior experience building an experimentation platform or A/B
    testing-related tooling.
  - Experience operating in a high-speed product development
    environment.
  - Comfort with the statistical methods behind hypothesis
    testing.

  The offered salary is dependent upon several factors,
  including work experience, skills, and internal peer
  comparisons. The posted range is subject to change in the
  future. For this role, base salary is supplemented by equity
  compensation. We encourage you to talk with your recruiter
  for more information related to compensation for this role!

  Salary Range:

  $204,000—$306,000 USD

