description: |
  About Pinecone

  Pinecone is the leading vector database for building
  accurate and performant AI applications at scale in
  production. Pinecone's mission is to make AI knowledgeable.
  More than 9000 customers across various industries have
  shipped AI applications faster and more confidently with
  Pinecone's developer-friendly technology. Pinecone is based
  in New York and raised $138M in funding from Andreessen
  Horowitz, ICONIQ, Menlo Ventures, and Wing Venture Capital.

  About the Team and Role:

  Pinecone is looking for a full-stack engineer to bring a new
  level of visibility, control, and trust to our product
  experiences. From cost metrics and spend alerts to
  interactive usage dashboards, we’re looking for a product-
  focused engineer who will deliver transparent and accurate
  insights to our customers.

  As a member of the Experience Platform team, you’ll have
  direct ownership over the billing, management, and
  authentication interfaces that we need our customers to
  understand and trust. You understand the responsibility and
  care this type of work requires, while also moving quickly
  to match Pinecone’s rapid growth. You’ll do this by working
  closely with product, design, and other engineering teams to
  identify user and system needs and build the right thing, at
  the right abstraction level, at the right time.

  Responsibilities:

  - Shape our product experience. Influence the rollout of
    products, propose and build new features, and advocate for
    experiences that will build confidence with our customers.
  - Ship end-to-end experiences across API, SDK, and web. You'll
    own the full surface, from the HTTP layer to the UI, and
    you'll make calls across all of it.
  - Own integrations with billing systems and vendor APIs,
    designing for resiliency against outages, schema drift,
    and inconsistent data.
  - Create observable, auditable systems with monitoring,
    alerting, and verification mechanisms that give leadership
    and customers confidence in the numbers.
  - Bring AI-assisted development practices to the team — use
    the best tools available and help establish patterns that
    let a small team move at a pace that shouldn't be
    possible.
  - Partner with finance, product, and design to translate
    business requirements into scalable technical solutions,
    and push back when the abstraction level isn't right.

  Requirements:

  Engineers at Pinecone operate with high autonomy. You'll be
  an active partner in setting strategy on APIs, interfaces,
  observability, and our product experience — not just
  executing on a roadmap. We care more about how you think and
  how you work than whether your resume checks every box. In
  exchange, we’ll make sure you’re set up for success with
  mentorship and technical guidance.

  You should have:

  - At least 2 years of software engineering experience
  - A bias toward automation and leverage — you reach for
    systems and tooling before you reach for elbow grease
  - Hands-on experience shipping with AI coding tools (Claude
    Code, Cursor, Copilot, or similar) as a genuine part of
    your workflow
  - Proven ability to design and deliver APIs for a rapidly
    scaling product surface
  - Proficiency building web interfaces with React or similar
  - Experience with at least one major cloud provider (AWS, GCP,
    Azure)
  - Strong intuition for what makes APIs easy for both humans
    and agents to use correctly

  Bonus points for:

  - Experience at a SaaS company with usage-based or consumption
    pricing models
  - Experience building billing-specific features, such as usage
    dashboards or cost reporting
  - Strong familiarity with a compiled language like Rust, Go,
    or Java
  - Experience integrating with third-party financial APIs and
    building defensively against inconsistent or delayed data
  - Experience with queueing and streaming technologies such as
    Kafka, Kinesis, or Pub/Sub

  Perks & Benefits:

  - Comprehensive health coverage including medical, dental,
    vision, and mental health resources
  - 401(k) Plan
  - Equity award
  - Flexible time off
  - Paid parental leave
  - WFH Equipment Stipend

  All qualified applicants will receive considerations for
  employment without regard to race, color, religion, sex,
  age, disability, marital status, familial status, sexual
  orientation, pregnancy, gender identity, gender expression,
  national origin, ancestry, citizenship status, veteran
  status, and any other legally protected status under
  federal, state, or local anti-discrimination laws.
