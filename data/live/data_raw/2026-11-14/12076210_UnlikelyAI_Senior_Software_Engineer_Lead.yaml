description: |
  About Us

  At UnlikelyAI, we are building the future of AI: one that is
  reliable, explainable, and resistant to hallucination. Our
  patented neurosymbolic platform combines the expressive
  power of LLMs with the transparency and control of symbolic
  reasoning. This enables us to create AI systems that are
  accurate, auditable, and suitable for high-trust, high-
  stakes applications – where precision, traceability, and
  compliance are essential.

  The Role

  We're looking for a Senior Software Engineer to be the Tech
  Lead for Uncheck, our accounting disclosure product, and
  lead its planning and delivery as it scales across customers
  and markets. You'll own the technical plan and sequencing,
  working with product and customers, and make sure it is
  delivered well and on time, while staying hands-on in the
  code.

  Uncheck automates the checking of accounting disclosures. It
  reviews financial statements against the accounting
  standards and regulations that apply to them, and shows the
  evidence behind each finding. It is live in production at
  enterprise scale, and we are expanding it into new regions
  and markets.

  This role is ideal for someone who enjoys leading the
  delivery of software as much as building it, and takes pride
  in delivering what has been promised. You'll work on
  planning and building a product that customers rely on for
  regulatory decisions, writing code alongside an experienced
  engineering team, and collaborate with product and research
  colleagues.

  Pioneering AI is one of our leadership principles. In every
  role we make AI our starting point for rethinking how work
  gets done, and you'll lead that for the Uncheck engineering
  team.

  This is a hands-on position with real impact, offering the
  chance to shape Uncheck through its next stage of growth.

  What You'll Do

  In this role, you'll be responsible for delivering
  meaningful impact through your expertise:

  - Own the technical plan for Uncheck and lead delivery against
    the commitments we make to customers.
  - Build software as a hands-on member of the team, writing
    production code and reviewing others' work. Make technical
    decisions together with the team, aligning with senior
    engineering and leadership.
  - Lead how the team builds with AI agents, including how
    agent-written code is reviewed, tested and shipped safely,
    and measure what it does for delivery.
  - Make sure Uncheck runs reliably and securely in the cloud as
    it scales to new customers and regions.
  - Lead technical conversations with customers' IT, security
    and architecture teams, from first evaluation through to
    live use.
  - Work with product and research colleagues to turn new
    capabilities and customer feedback into clear priorities.
  - Mentor engineers across the team.

  You'll be successful here if...

  - ...you already work AI-first. Agents write a large share of
    your code, and you have firm views on how a team should
    review and test that work, because customers rely on what
    we ship for regulatory decisions.
  - ...you have led delivery for a team of 4 to 8 engineers,
    shipping to enterprise customers on time and to a high
    standard.
  - ...you have mentored engineers and helped them grow.
  - ...you communicate clearly with customers and non-engineers,
    and are comfortable leading technical conversations with
    enterprise teams.
  - ...you have strong back-end experience in any language,
    including agent-written code, and able to make sound
    technical decisions.
  - ...you have owned production cloud services, ideally on AWS,
    in a team with strong engineering practice: code review,
    automated testing, CI/CD and on-call.
  - ...you understand what enterprise security and compliance
    teams expect.

  Other skills

  You don't need all of these, but any of them would
  strengthen your application:

  - Experience shipping AI-powered products or features to
    customers, and making their output reliable at scale.
  - Experience with Python, which our back end is written in.
  - Experience in a regulated industry, such as financial or
    professional services, legal, insurance or healthcare.
  - Experience taking a product into new regions.
  - DevOps, infrastructure and SRE experience, such as
    infrastructure as code, CI/CD pipelines and observability.

  What's in it for You

  Joining UnlikelyAI means working on technology that pushes
  boundaries while shaping your career:

  - Work on a hard and worthwhile problem: making AI output
    reliable enough for regulatory decisions.
  - Have a real say in how we plan and deliver, in a team of
    around 40 where decisions are made quickly and together.
  - Work alongside researchers developing new approaches to
    trustworthy AI.
  - Help take a live product into new regions and markets.

  Working at UnlikelyAI

  We offer a range of benefits and perks designed to support
  our team's wellbeing and work-life balance:

  - A hybrid working policy, with three days a week as the
    expectation at our Central London office
  - Office in Bloomsbury, five minutes from Tottenham Court Road
    and Holborn stations
  - Free team lunches every Monday, Tuesday, Wednesday and
    Thursday
  - Optional social and extra-curricular activities throughout
    the year
  - Share options, so you own part of what you help build
  - Private health insurance with Bupa
  - Juno rewards, earning points on everyday purchases

  Equal Opportunities

  We are committed to having a truly diverse team where
  everyone is encouraged to be their authentic selves. We do
  not discriminate in employment based on gender, race,
  religion, sexual orientation, national origin, political
  affiliation, disability, age, marital status, medical
  history, parental status or genetic information. Having a
  broad mix of people helps us to be the best we can. If there
  is anything we can do to make the recruitment process more
  accessible or comfortable for you, please let us know.
