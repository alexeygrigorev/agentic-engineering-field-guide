description: |
  About us

  Health is the most important thing in life, and the American
  healthcare system is completely broken - poor outcomes, high
  cost, bad patient experience. We're building a new system
  from the ground up.

  Our mission is to improve people’s health by making it easy
  to live a healthy lifestyle.

  Nourish is the country's largest dietitian-led metabolic
  health clinic. We’re an AI-native digital health system
  matching patients with 10,000+ Registered Dietitians,
  physicians, medications, lab testing, and AI agents to
  deliver insurance-covered care across all 50 states. Founded
  four years ago, we've completed millions of appointments,
  tripled year-over-year, and partnered with health plans
  covering 200M+ Americans across 250+ health systems.

  In 2026 we raised a $100M Series C, bringing total funding
  to $215M. The round was led by Menlo Ventures, with
  participation from Thrive Capital, Index Ventures, J.P.
  Morgan Growth Equity Partners, Maverick Ventures, Y
  Combinator, BoxGroup, Atomico, Daybreak, and Operator
  Partners.

  Learn more about our Series C here: Nourish Blog, Bloomberg,
  Fierce Healthcare, Digital Native, The Pulse Podcast.

  This is not a job for everyone. We hold an extremely high
  bar because we believe talent density is our biggest
  competitive advantage. We're looking for people who actively
  choose hard, ambiguous problems, who run toward unglamorous
  work, give and receive candid feedback, and bring relentless
  resilience without the ego. Our work is important, but we
  are not self-important. We do this because we’re solving one
  of the hardest problems in the world, and the problem
  matters. If that's you, we disproportionately reward it.

  About the Role:

  Nourish is looking for talented Senior Backend Engineers to
  join our fast-growing team! As a key, early member of
  Nourish’s engineering team, you’ll play a pivotal role in
  shaping the future of our core platform. Working side-by-
  side with engineering, product, design, and analytics,
  you’ll drive the development of critical features that will
  lay the foundation for years to come.

  Reporting to the Engineering Manager of your Pod, you’ll
  take full ownership of major parts of the codebase, setting
  ambitious timelines and leading project deliverables.
  Whether you’re in the Ops or Platform Pod, your
  contributions will be essential in bringing our product
  roadmap to life and building scalable technology to
  transform interactions with patients, dietitians, and
  insurance companies.

  This role is full-time hybrid out of Nourish’s NYC office in
  the heart of Union Square. This role also welcomes remote
  candidacy. Check out ‘Engineering at Nourish’ to learn more
  about our team and what we’ve already built!

  Key responsibilities:

  - Design, build, and ship cutting-edge products and features
    at lightning speed without compromising on quality.
  - Drive continuous improvements in our engineering processes,
    tools, and systems to scale both our codebase and team
    productivity.
  - Collaborate with colleagues across product, design,
    engineering, and analytics to solve challenging and
    impactful problems in a data-driven experimentation
    culture.
  - Contribute to the estimations, planning and execution of
    projects, features, and integrations.
  - Maintain and elevate our existing codebase by developing,
    releasing, and maintaining backend services and/or
    infrastructure.
  - Write clean, fully-tested, high-performance code that sets
    the standard for excellence.

  We’d love to hear from you if you:

  - Bachelor’s or Master’s in Computer Science, Engineering, or
    related field.
  - 5+ years as a Backend focused Software Engineer, preferably
    building high-performance internal platforms to streamline
    internal business operations, developer experience, or
    devops.
  - 3+ years utilizing our tech stack (Typescript, Node.js,
    Prisma, PostgreSQL, AWS) or confidence and excitement
    about cross-training and up-skilling!
  - Do your own stunts and ship fast. You like to build and ship
    new things, can independently take a project from idea
    through implementation, and run toward hard problems.
  - Think work should feel like play. You value a very
    collaborative, close-knit team and care about having fun
    and making an impact at work.
  - Want to be deeply involved in product and design. You are
    not only passionate about engineering but also have a
    desire to build a product end-to-end, through the design,
    coding, testing, and deployment phases. We're an early-
    stage startup where product, design, and engineering are
    closely intertwined.
  - Think from first principles. Ask why, challenge assumptions,
    and value the right answer over being right.

  Nice to Haves:

  - Startup or Scale Up experience. You have that dog in you;
    you’re resilient and persevere through challenges.
  - Interviewing Experience. We’re quickly growing our
    Engineering function and expect our Engineers to help us
    do so!
  - Energized by our mission. Our mission defines everything we
    do, we need engineers hungry to improve people’s health by
    making it easy to eat well.

