description: |
  About the company

  Our client is a healthcare technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and extend web applications in a TypeScript codebase,
  owning features from initial specification through to
  release. The work includes creating new billing automation
  tools from the ground up and improving internal staff-facing
  applications, with code that runs in the browser and on the
  server alike. The role suits a self-directed engineer who
  can take on open-ended problems with little guidance.

  What you'll do

  - Build new billing automation tools and workflows from
    scratch, designing them around modern processes rather
    than recreating existing manual ones.

  - Enhance and extend internal portals and workflow
    applications used by staff.

  - Deliver features across the full stack, from Vue and
    TypeScript interfaces to Node-based services, through to
    production.

  - Turn complicated, irregular data into workflows that surface
    useful information to users.

  - Handle sensitive information with care, applying sound
    judgment on privacy compliance and access controls.

  Requirements

  What we're looking for

  - 5+ years building production web applications at a senior
    level, with a track record of measurable results.

  - Comfortable working in a typed JavaScript dialect and a
    component-based UI framework such as Vue or React.

  - Back-end experience with Node.js and a document database.

  - Senior-level experience at early-stage startups, digital
    health companies, or comparable high-growth technology
    companies.

  - A record of leading a feature or project end to end, not
    only carrying out assigned tasks.

  Bonus points

  - Python experience.

  - Experience with cloud platforms such as AWS, Azure or GCP.

  - Familiarity with healthcare data standards and
    interoperability formats.

  - Experience with real-time communication, AI APIs or workflow
    orchestration tools.

  - Prior founder or co-founder experience.

  - Healthcare background is strongly preferred but not
    required.

  Benefits

  Compensation and benefits

  - Base salary: $190K to $250K

  Location and work model

  - New York, NY, United States or Vancouver, BC, Canada

  - Hybrid, 3 days in-office per week (Monday to Wednesday)

  - Full-time
