description: |
  All roles at JumpCloud® are Remote unless otherwise
  specified in the Job Description.

  About JumpCloud®

  JumpCloud® is the AI-powered unified IT management platform
  designed to secure the modern workforce. By consolidating
  identity, device, and access management, JumpCloud provides
  intelligent, secure IT that scales from human users to
  autonomous AI agents. We help organizations around the globe
  eliminate complexity and turn AI risk into an optimized
  advantage, ensuring the right people and agents have secure
  access to the right resources at all times.



  JumpCloud is Intelligent, Secure IT.

  As Manager, Sales Engineering, you will lead, coach, and
  scale a distributed team of Sales Engineers across multiple
  countries to drive technical wins and accelerate JumpCloud’s
  international revenue growth. You will bridge people
  leadership, commercial strategy, and technical judgment to
  solve complex identity, access, and unified device
  management challenges for modern IT environments. By
  establishing rigorous business and technical discovery,
  value-based demonstrations, and focused Proofs of Value
  (POVs), you ensure predictable deal progression and
  eliminate technical friction throughout the sales cycle.
  Additionally, you will optimize SE resource allocation
  across qualified opportunities and partner with Professional
  Services and Customer Success to ensure seamless
  implementation handoffs and long-term customer retention.

