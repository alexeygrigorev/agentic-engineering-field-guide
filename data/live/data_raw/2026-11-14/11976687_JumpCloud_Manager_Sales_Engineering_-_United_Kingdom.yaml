  Where you’ll be working/Location:

  JumpCloud® is committed to being Remote First, meaning that
  you are able to work remotely within the country noted in
  the Job Description.



  This role is remote in the country of England. You must be
  located in and authorized to work in the England to be
  considered for this role.



  Language:

  JumpCloud® has teams in 15+ countries around the world and
  conducts our internal business in English. The interview and
  any additional screening process will take place primarily
  in English. To be considered for a role at JumpCloud®, you
  will be required to speak and write in English fluently.
  Any additional language requirements will be included in the
  details of the job description.



  Why JumpCloud®?

  If you thrive working in a fast, SaaS-based environment and
  you are passionate about solving challenging technical
  problems, we look forward to hearing from you! JumpCloud® is
  an incredible place to share and grow your expertise! You’ll
  work with amazing talent across each department who are
  passionate about our mission. We’re out of the box thinkers,
  so your unique ideas and approaches for conceiving a product
  and/or feature will be welcome. You’ll have a voice in the
  organization as you work with a seasoned executive team, a
  supportive board and in a proven market that our customers
  are excited about.



  One of JumpCloud®'s three core values is to “Build
  Connections.” To us that means creating " human connection
  with each other regardless of our backgrounds, orientations,
  geographies, religions, languages, gender, race, etc. We
  care deeply about the people that we work with and want to
  see everyone succeed." - Rajat Bhargava, CEO



  Please submit your résumé and brief explanation about
  yourself and why you would be a good fit for JumpCloud®.
  Please note JumpCloud® is not accepting third party resumes
  at this time.



  JumpCloud® is an equal opportunity employer. All applicants
  will be considered for employment without attention to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, veteran or disability status.



  Scam Notice:

  Please be aware that there are individuals and organizations
  that may attempt to scam job seekers by offering fraudulent
  employment opportunities in the name of JumpCloud. These
  scams may involve fake job postings, unsolicited emails, or
  messages claiming to be from our recruiters or hiring
  managers. Please note that JumpCloud will never ask for any
  personal account information, such as credit card details or
  bank account numbers, during the recruitment process.
  Additionally, JumpCloud will never send you a check for any
  equipment prior to employment.



  All communication related to interviews and offers from our
  recruiters and hiring managers will come from official
  company email addresses (@jumpcloud.com) and will never ask
  for any payment, fee to be paid or purchases to be made by
  the job seeker. If you are contacted by anyone claiming to
  represent JumpCloud and you are unsure of their
  authenticity, please do not provide any personal/financial
  information and contact us immediately at
  recruiting@jumpcloud.com with the subject line "Scam Notice"



