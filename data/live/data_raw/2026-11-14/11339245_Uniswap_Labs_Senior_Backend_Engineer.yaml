description: |
  Uniswap Labs is a core contributor to the Uniswap Protocol,
  the world’s largest DEX, with over $4 trillion in volume
  across 17 chains. It builds products that help millions
  access the protocol, including the Uniswap Web App, Wallet,
  and Trading API. Uniswap Labs is also the primary technical
  provider for Unichain, a DeFi-native Ethereum Layer 2 built
  to be the home for liquidity across chains.

  When you join Uniswap, you become part of a team that's
  reshaping the way value flows on the internet.

  We’re looking for an enthusiastic, self-motivated Senior
  Backend Engineer to help us build the next generation of
  financial products.

  Responsibilities

  - Write high quality and well tested code, and review code
    from other team members.
  - Collaborate with engineers, designers, and product managers
    to turn requirements into products and lead the execution
    end to end.
  - Provide guidance and technical leadership to peers in
    navigating architectural and coding tradeoffs.
  - Take charge of driving strategic technical initiatives
    across engineering pods that impact the entire engineering
    organization.

  Requirements

  - 6+ years of software engineering experience
  - Excellent coding skills, deep understanding of cloud
    architectures, algorithms, and strong debugging
    capabilities.
  - Consistently manage projects comprehensively, starting from
    gathering requirements and designing, to debugging and
    testing, and finally to release management and operational
    monitoring.
  - Design, build, and maintain a large-scale production system
    on the cloud, ensuring smooth operation and high
    availability.
  - Be able to build systems from the ground up, on a 0→1
    fashion.
  - Desire to keep up with modern best practices in software
    development/Web3, and shape our tech stack as we build out
    new systems and services.
  - Mentored junior engineers

  Nice to have:

  - Has previously been a Technical Lead
  - Prior experience with time-series based monitoring /
    observability systems
  - Degree in computer science
  - Experience with Typescript
  - Experience with AWS
  - Love for unicorns:)

  Minimum full-time salary of $180,000-$226,000. Disclosure in
  accordance with New York City's Pay Transparency Law. Full
  Time employees at Uniswap Labs are also eligible for other
  compensation elements, including tokens, and benefits,
  dependent on the position type.

  Uniswap Labs' Full-Time employee benefits include company-
  paid medical, dental, & vision for you and your dependents,
  wellness offerings including a partnership with Equinox
  Fitness Clubs, 401(k) with 4% employer contribution, annual
  $1,500 education stipend, unlimited and encouraged time off,
  up to 16 weeks paid parental leave, home office setup
  stipend for remote employees and daily lunches at NY
  headquarters (all benefits are subject to applicable taxes
  and based on eligibility).

  Uniswap Labs is committed to diversity in our workforce and
