description: |
  The Lead Software Engineer has expertise in building full-
  stack applications using React, .NET, Next.js, and Azure.
  This role will be responsible for leading technical
  development, conducting code reviews, and ensuring high-
  quality software delivery. This role is a hands-on leader
  who can guide a team while also contributing directly to the
  codebase.

  Duties and Responsibilities:

  - Architect, develop, and maintain scalable full-stack
    applications using .NET, TypeScript,
  - React/Next.js on Azure.
  - Lead technical decision-making, providing expertise on best
    practices, architecture, and
  - modern software development methodologies.
  - Conduct code reviews, ensuring high code quality, security,
    and performance
  - optimization.
  - Collaborate with cross-functional teams, including product
    managers and designers, to
  - define, design, and ship new features.
  - Mentor and coach junior and mid-level engineers, fostering a
    culture of growth and
  - technical excellence.
  - Monitor and improve application performance, optimizing
    database queries, front-end
  - rendering, and API interactions.
  - Ensure security best practices in web applications,
    including authentication,
  - authorization, and data protection.
  - Work with DevOps teams to implement CI/CD pipelines and
    automate deployments on
  - Azure.
  - Stay up to date with emerging technologies and advocate for
    their adoption where
  - appropriate.

  Education and/or Experience:

  Required:

  - Bachelor’s degree in Computer Science, Software Engineering,
    or a related field (or
  - equivalent experience).
  - A minimum of 5 years of experience in full-stack software
    development.
  - Expertise in React, .NET, Next.js, TypeScript, and Azure.
  - Strong experience in code reviews, software design patterns,
    and scalable application
  - architecture.
  - Proficiency in RESTful APIs and microservices architectures.
  - Hands-on experience with databases, such as SQL Server,
    PostgreSQL, or NoSQL
  - solutions.
  - Experience with version control systems (Git) and Agile
    development methodologies.

  Preferred:

  - Experience with containerization (Docker, Kubernetes, Azure
    Container Apps) on Azure.
  - Knowledge of serverless computing and cloud-native
    applications.
  - Familiarity with unit testing frameworks and automated
    testing best practices.
  - Certifications in Azure or relevant technologies.

  Other Skills and Abilities:

  The following will also be required of the successful
  candidate:

  - Strong organizational skills
  - Strong attention to detail
  - Good judgment
  - Strong interpersonal communication skills
  - Strong analytical and problem-solving skills
  - Able to work harmoniously and effectively with others
  - Able to preserve confidentiality and exercise discretion
  - Able to work under pressure
  - Able to manage multiple projects with competing deadlines
    and priorities

  #LI-MR1

  #LI-Hybrid

  Applicants must be authorized to work in the United States
  without the need for employer sponsorship, now or in the
  future

  The target salary range for this role is:

  $117,300 - $184,300 if located in Illinois, New York, or
  Texas.

  Salaries vary by location and are based on numerous factors,
  including, but not limited to, the relevant market, skills,
  experience, and education of the selected candidate. Our
  compensation package also includes bonus eligibility and a
  comprehensive benefits program. Benefits information can be
  found at Sidley.com/Benefits.

  To perform this job successfully, an individual must be able
  to perform the Duties and Responsibilities above
  satisfactorily and meet the requirements. The requirements
  listed above are representative of the minimum knowledge,
  skill, and/or ability required. Reasonable accommodations
  will be made to enable individuals with disabilities to
  perform the essential functions of the job. If you need such
  an accommodation, please email
  sidleytalentacquisition@sidley.com (current employees should
  contact Human Resources).

  Sidley Austin LLP is an Equal Opportunity Employer.
