description: |
  The Basics:

  Are you someone who thrives in dynamic environments, has a
  passion for customer excellence and delivering exceptional
  outcomes?  We are searching for a business value
  professional to collaborate with a high-performing team of
  sales professionals.  If you have experience working as a
  Value Engineer with a track record of successfully
  partnering with account teams, we would love to hear from
  you!

  This role requires an intellectually curious individual with
  keen business and financial acumen.  You will articulate how
  the Tanium platform can drive positive business outcomes to
  internal and external stakeholders. This role is crucial to
  ensuring our customers unlock the full potential of our
  software solutions, driving value, and fostering long-term
  partnerships.

  What you’ll do:

  - Collaborate closely with account teams to identify a value
    delivery strategy for key accounts.
  - Engage with customers to identify, understand, and quantify
    their unique challenges and potential benefits, aligned
    against their strategic initiatives.
  - Define and communicate the Tanium value proposition in
    alignment with customer objectives.
  - Lead business value reviews / business cases, and
    effectively communicate the realized value and potential
    economic benefits of new opportunities.
  - Create and deliver boardroom-quality, executive documents,
    and presentations.
  - Work collaboratively with product and engineering teams to
    tailor solutions that meet the specific needs of customers
    and prospects.
  - Provide guidance on best practices and innovative approaches
    to maximize the value of Tanium solutions.
  - Act as a subject matter expert on our solutions within our
    customer’s business, remaining informed about industry
    trends and advancements.
  - Initiate and contribute to thought leadership projects.
  - Provide training and workshops for Tanium colleagues to
    improve their skills in uncovering opportunities, and
    their knowledge of business value & customer excellence.
  - Make a positive impact on the future of the value
    engineering practice at Tanium, by creating improved
    methods and tools for a stronger value-based selling
    adoption.

  We’re looking for someone with:

  - 5+ years of experience in value engineering, management
    consulting, financial / investment analysis, solution
    architecture, or a related customer-facing role within the
    software industry.
  - Advanced knowledge and experience in value-based-selling
    methodologies.
  - Proven ability to lead complex cross functional projects.
  - Strong financial modeling skills and ability to create
    dynamic and impactful presentations.
  - Deep knowledge of and ability to demonstrate practical use
    of key financial metrics.
  - Strong executive presence.
  - Demonstrated ability to work in a fast-paced, ever-changing,
    global environment.
  - Bachelor’s Degree in Economics, Business, Finance,
    Accounting or other quantitative field required.
  - MBA or CPA/public accounting background is a plus

  About Tanium

  Tanium is the Autonomous IT company. As Al accelerates both
  innovation and risk, Tanium Atlas, the company's autonomous
  operating system, puts the full depth of the Tanium
  Autonomous IT Platform behind every IT and security operator
  - human and agentic. Tanium provides the real-time
  intelligence, agentic decision-making, and autonomous
  execution operators needed to detect, decide, and remediate
  at machine speed across their endpoint estate.

  The company is recognized as a Leader in the inaugural 2026
  Gartner® Magic Quadrant™ for Endpoint Management Tools, as a
  Leader in the IDC MarketScape: Worldwide Client Endpoint
  Management Software for Windows Device Management 2025-2026
  Vendor Assessment, and as a Leader in The Forrester Wave™.
  Endpoint Management Platforms, Q2 2026.

  To learn how Tanium delivers Autonomous IT for unstoppable
  business, visit www.tanium.com and follow us
  on LinkedIn and X.

  On a mission. Together.

  At Tanium, we are stewards of a culture that emphasizes the
  importance of collaboration, respect, and diversity. In our
  pursuit of revolutionizing the way some of the largest
  enterprises and governments in the world solve their most
  difficult IT challenges, we are strengthened by our unique
  perspectives and by our collective actions.

  As a global organization with stakeholders around the world,
  it’s imperative that the diversity of our customers and
  communities is reflected internally in our team members. We
  strive to create a diverse and inclusive environment where
  everyone feels they have opportunities to succeed and grow
  because we know that only together can we do great things.

  Our commitment to excellence and innovation has earned us a
  place on the Forbes Cloud 100 list for ten consecutive
  years, and we continue to be recognized worldwide as a great
  place to work.

  Each of our team members has 5 days set aside as volunteer
  time off (VTO) to contribute to the communities they live in
  and give back to the causes they care about most.

  What you’ll get

  The annual base salary range for this full-time position is
  $126,000 to $193,000 and this position will also be
  commission eligible. This range is an estimate for what
  Tanium will pay a new hire. The actual annual base salary
  offered may be adjusted based on a variety of factors,
  including but not limited to, location, education, skills,
  training, and experience.

  In addition to an annual base salary, team members will
  receive equity awards and a generous benefits package
  consisting of medical, dental and vision plan, family
  planning benefits, health savings account, flexible spending
  account, transportation savings account, 401(k) retirement
  savings plan with company match, life, accident and
  disability coverage, business travel accident insurance,
  employee assistance programs, disability insurance, and
  other well-being benefits.

  Tanium is an Equal Opportunity and Affirmative Action
  employer. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, sex, national origin, age, gender identity, sexual
  orientation, disability, protected Veteran status, or other
  legally protected categories. If you require a reasonable
  accommodation in searching for a job opening, completing an
  application, interviewing, or completing any pre-employment
  testing or requirements, please contact
  accommodations@tanium.com. For more information refer to the
  “Know Your Rights” poster which is available here -
  https://www.eeoc.gov/poster.

  Please be aware of job offers coming from people claiming to
  be Tanium employees. Tanium employees will only use
  @tanium.com email addresses to communicate with you, will
  have video interviews with you, and will never ask you for
  money.

