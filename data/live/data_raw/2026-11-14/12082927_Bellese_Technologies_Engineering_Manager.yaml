description: |
  Bellese is a mission-driven Digital Services Company
  committed to pioneering innovative technology solutions in
  civic healthcare. Our dedication lies in making a meaningful
  impact on public health outcomes.



  Driven by service design, we strive to know the “Why” to
  understand the healthcare journey for patients, caregivers,
  providers, payers, and policymakers. Our goal is to design
  and build solutions that reduce confusion, provide clarity,
  support decision making, and streamline the process so that
  we and our partners can focus on providing better health
  outcomes by improving patient care and reducing costs and
  burden.

  The Team you will be joining:

  HQR

  Our team is charged with maintaining and improving the
  software at the Centers for Medicare and Medicaid Services
  (CMS) that supports the Hospital Quality Reporting program.
  Thousands of hospitals across the country depend on these
  systems to submit quality measure data that reflects the
  care beneficiaries receive in their facility.  Our teams
  will continuously strive to modernize these systems, while
  improving them in ways that reduce provider burden and
  minimize costs to CMS.  We do this through HCD and Service
  design practices, product thinking, and skilled engineering.
  At Bellese, we’re relentlessly focused on enabling and
  empowering providers to focus on improving the quality and
  safety of patient care.

  What you will be doing:

  - Manage and lead one or more teams of software engineers,
    fostering a culture of continuous improvement and
    technical excellence.
  - Personnel management, including hiring, performance
    management, and team building.
  - Oversee the design, development, and delivery of high-
    quality, innovative software solutions.
  - Collaborate with Product Managers to align team activities
    with product vision and business goals.
  - Monitor team performance and provide regular feedback,
    coaching, and career development to team members.
  - Drive efficient processes and standards to enable team
    success and maintain high engineering standards.
  - Contribute to architectural decisions, software development,
    and code review.
  - Participate in resource planning and recruitment activities
    to scale the engineering team as necessary.
  - Foster an inclusive, collaborative, and positive team
    culture.

  Required Qualifications & Experience:

  - Bachelor's degree in Computer Science, Engineering, or a
    related technical field.
  - 5+ years of experience in software development, with at
    least 3 years in a managerial or leadership role.
  - Demonstrated success in personnel management,
    - including hiring, performance management, and team building.
  - Strong understanding of software development lifecycle
    (SDLC), including Agile methodologies.
  - Proficiency in one or more programming languages such as
    databricks, Go, or Python.
  - Demonstrated experience in managing and leading software
    engineering teams.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and interpersonal skills, with the
    ability to inspire and lead a team.
  - Strong project management skills with a track record of
    delivering projects on time.

  Security Clearance Requirements

  - US Citizenship or Green Card only - we do not offer
    Sponsorship
  - US Residency for at least the past 3 years
  - Able to meet the requirements to hold a position of Public
    Trust, including successful completion of a US Government
    background investigation
  - Disclaimer: Medical or recreational marijuana use is
    considered illegal at the federal level, regardless of
    state laws allowing such, and may affect your ability to
    obtain Public Trust. See article

  Work that matters, with perks that deliver. Discover how
  Bellese Technologies invests in you through a benefits suite
  that makes every day better

  - Remote First, Remote Only Culture
  - Four weeks paid time off yearly (prorated based on start
    date for the first year)
  - 10 paid floating company holidays
  - Flexible schedule
  - Work from home setup including a Macbook
  - Collaborative, learning environment
  - Medical, dental, and company-paid vision insurance
  - Optional HSA account with some medical plans and a company
    contribution
  - Company paid basic life and AD&D insurance coverages
  - Company paid short and long term life insurance
  - Optional critical illness and accident insurance
  - 401K plan with 3% safe harbor contribution
  - Wellness resources and virtual care
  - Perks Plus employee discounts

  You will like it here if

  - You foster a collaborative ethos, driven by the mission to
    deliver exceptional customer service to clients. You are
    passionate about Healthcare and changing the healthcare
    landscape. You’re an out of the box thinker, always
    striving to know the “why” when it comes to building
    solutions. You excel in a team-oriented, remote-first
    environment characterized by mutual respect and open
    communication. Your adaptability and ability to navigate
    challenges ensure your success in any situation.
