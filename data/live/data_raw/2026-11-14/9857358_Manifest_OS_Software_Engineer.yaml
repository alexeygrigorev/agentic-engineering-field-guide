description: |
  About Manifest

  Manifest OS is an AI-native company on a mission to replace
  the billable hour and make legal services more accessible
  for American businesses and consumers. We power the next
  generation of AI-native law firms with one unified global
  brand, a proprietary technology platform, and a centralized
  back office — enabling lawyers to eliminate the
  administrative burden and focus on delivering exceptional
  outcomes for their clients. Manifest OS has raised a $60M
  Series A from Menlo Ventures, Kleiner Perkins, First Round,
  and Quiet Capital.

  About the Role

  We're looking for a Software Engineer to help build the
  legal tech platform powering the next generation of AI-
  native law firms. You'll own the development of secure
  client portals and enterprise-grade systems - from
  architecture to production.

  This opportunity is ideal for engineers who want broad
  scope, high ownership and move nimbly across lanes. You'll
  work across AI systems architecture and full-stack
  engineering - eval systems, retrieval, agent orchestration,
  and optimization, alongside the APIs, data models, and
  systems that power the core platform.

  This is an in-person role - you'll be on-site at our NYC
  office 5 days a week.

  What You’ll Do

  Engineers here move across these areas as needed:

  Agent Platform

  - Eval systems, retrieval, and agent orchestration - building
    the infrastructure that measures and improves how our AI
    agents perform
  - Harness engineering - building the tooling and guardrails
    that let the rest of the company build securely, reliably,
    and self-serve

  Core Platform & Infrastructure

  - Database design and backend architecture
  - Deploy and operate services on cloud infrastructure

  Product Engineering

  - Own end-to-end features across our legal tech platform -
    client portals, case management, and the workflows lawyers
    and clients depend on daily
  - Design production-grade APIs, data models, and permission
    systems for a regulated, high-trust domain

  What We're Looking For

  Must-haves:

  - 7+ years building production software, with demonstrated
    depth in at least one area (backend systems, infra, ML/AI
    systems, frontend or similar)
  - Proven track record delivering features that produce
    measurable business outcomes
  - Comfort with relational database design and data modeling
  - Hands-on experience deploying and operating services on a
    major cloud platform
  - Fluent with AI coding tools as a core part of your daily
    workflow
  - A track record of self-teaching your way into unfamiliar
    systems and shipping there
  - First-principles and systems thinking: you can reason about
    a system you didn't build, from the database up through
    the API to the product surface
  - Familiarity with our stack - TypeScript, React, GCP,
    PostgreSQL
  - Bachelor’s degree or equivalent practical work experience.

  Nice-to-haves:

  - Deeply engaged with the AI tooling ecosystem - you follow
    new model releases, experiment with new tools as they
    land, and stay current out of genuine curiosity
  - Experience with eval systems, retrieval, agent orchestration
    OR ML in production
  - Background building client portals, CRMs, or case management
    systems
  - Familiarity with legal tech or other regulated industries

  This is for you if....

  You treat AI tools as core to how you architect and ship
  software. You have real depth in at least one area, plus the
  self-teaching ability to pick up unfamiliar systems and
  contribute there competently. You move with speed, thrive
  with ownership, and prefer outcomes over process. You want
  to build infrastructure that makes legal services more
  accessible to people.

  This is not for you if....

  You do your best work with clear processes and defined
  guardrails already in place. You're earlier in your journey
  with AI-augmented development and want more time to build
  that muscle first.
