description: |
  About the team

  We build the platform that lists and settles event contracts
  on our CFTC-regulated exchange. That covers sports, crypto,
  and other real-world events.

  Our systems take in data from several sports and market
  providers, turn each event into tradeable contracts, and
  settle them correctly once the event ends. Settlement moves
  real money, so correctness and auditability matter as much
  as speed.

  We are moving the platform from Python and Airflow to Go
  services built around Postgres, and you’ll help build it.

