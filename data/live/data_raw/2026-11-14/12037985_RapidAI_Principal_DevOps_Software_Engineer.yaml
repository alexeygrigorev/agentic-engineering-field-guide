description: |
  RapidAI is the trusted leader in deep clinical AI, helping
  hospitals deliver faster, more informed care through
  intelligent imaging and integrated workflows. The Rapid
  Enterprise™ Platform supports disease states across the care
  spectrum, but it’s our clinical depth that drives the most
  meaningful impact — improving decision-making, patient
  outcomes, and health-system performance. Used by more than
  2,500 hospitals in over 100 countries and backed by 700+
  clinical studies, including research that helped expand
  national stroke-treatment guidelines, RapidAI is the most
  clinically validated AI platform in healthcare.

  We are looking for a DevOps Engineer to be at the forefront
  of medical device software development to help deliver the
  best patient care around the world.

  How you help us grow!

  What you bring!

  - 8+ years of experience in engineering with demonstrated
    technical leadership
  - Bachelors’ Degree in CS or relevant fields
  - Experience using AI coding tools (Claude Code, Codex, GitHub
    Copilot) for infrastructure, automation, and
    troubleshooting
  - Strong experience with Kubernetes and its ecosystem (e.g.,
    EKS, Helm, Argo CD/Flux, Prometheus/Grafana)
  - Strong working knowledge of AWS cloud services
  - Proficiency with Terraform and/or CloudFormation
  - Experience with CI/CD using GitHub Actions and/or Jenkins
  - Solid networking knowledge (TCP/IP, DNS, TLS, load
    balancing, VPC design, VPN)
  - Experience with AWS security tools (e.g., IAM, KMS,
    GuardDuty, Security Hub, Config, CloudTrail)
  - Proficiency in a scripting or programming language (e.g.,
    Python, Bash, Go, JS)
  - Troubleshoot issues effectively in a distributed
    architecture
  - Strong decision-making ability and the ability to support
    multiple teams
  - Great communication skills with technical and non-technical
    teams in a global environment across time zones
  - Experience with AWS GovCloud
  - Experience with compliance frameworks (e.g., FedRAMP, HIPAA,
    SOC 2, NIST 800-53, ISO 27001)

  - Citizenship / Status: Due to U.S. Department of Veterans
    Affairs (VA) contract requirements, applicants must be a
    U.S. Citizen or a Lawful Permanent Resident (Green Card
    holder).
  - U.S. Residency Requirement: Per federal investigation
    standards, non-U.S. citizen candidates must have lawfully
    resided in the United States for a minimum of three (3)
    consecutive years prior to application.
  - Background Investigation: Candidates must be able to
    successfully initiate, pass, and maintain a favorable VA
    background investigation (e-QIP / eApp, including
    fingerprinting/SAC and Tier 1 or Public Trust suitability
    adjudication) to obtain a VA PIV card and access VA
    networks.
  - Visa Sponsorship: Candidates must be currently authorized to
    work in the United States without restriction. We are
    unable to provide visa sponsorship (now or in the future)
    for this position.

  RapidAI is committed to creating an inclusive and diverse
