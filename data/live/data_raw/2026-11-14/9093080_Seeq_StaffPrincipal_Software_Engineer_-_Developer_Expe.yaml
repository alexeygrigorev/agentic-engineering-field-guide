description: |
  Seeq is a leader in industrial data analytics, empowering
  companies to derive insights from complex process data and
  improve operational outcomes. As we continue to grow, we
  recognize the importance of creating a seamless and
  productive developer experience, enabling our engineering
  teams and customers to build, integrate, and extend our
  platform effectively.

  As a Principal or Staff Software Engineer – Developer
  Experience, you will play a pivotal role in designing and
  building the tools, platforms, and workflows that help
  engineers work more efficiently. A key focus of this role
  will be advancing the adoption of AI-powered development
  tools and practices, identifying opportunities to improve
  engineering productivity, and implementing solutions that
  meaningfully enhance the software development lifecycle.

  You will work closely with engineering teams to understand
  developer needs, identify friction points, and deliver
  scalable solutions that improve how software is built,
  tested, deployed, and maintained. Your work will span
  internal developer platforms, SDKs, APIs, build systems,
  CI/CD pipelines, observability, security tooling, and AI-
  enabled developer workflows.

  Beyond building tools, you will help shape how engineering
  teams adopt and benefit from new technologies. You will
  champion automation, promote developer experience best
  practices, and help establish workflows that make our
  engineering organization more productive.

  This role is ideal for an experienced engineer who enjoys
  solving complex technical challenges, building tools for
  other developers, and exploring how AI can transform
  software engineering practices.

  Key Responsibilities

  - Design, develop, and maintain internal developer platforms,
    tools, SDKs, APIs, and frameworks that improve engineering
    productivity.
  - Drive the adoption and integration of AI-powered tools and
    workflows into the software development lifecycle, helping
    engineering teams improve efficiency, automation, and
    developer experience.
  - Identify opportunities to leverage AI in development
    workflows, including coding, testing, debugging,
    documentation, and other engineering processes.
  - Collaborate with engineering teams to understand developer
    challenges, identify friction points, and build scalable
    solutions that address them.
  - Lead initiatives to improve and automate build, test,
    deployment, and CI/CD processes.
  - Build and enhance internal developer infrastructure,
    including developer portals, build tooling, and reusable
    engineering frameworks.
  - Improve developers’ ability to detect and diagnose issues
    with internal tooling by building and maintaining
    effective observability and monitoring.
  - Provide vulnerability management tooling that helps teams
    find and triage issues, assess their impact, and resolve
    them.
  - Define and track developer productivity metrics, using data
    to identify opportunities for improvement and guide
    investment decisions.
  - Improve developer visibility and operational efficiency
    through observability, monitoring, and vulnerability
    management tooling.
  - Evaluate emerging developer technologies and AI
    capabilities, identifying practical opportunities to
    integrate them into existing engineering workflows.
  - Provide technical guidance and mentorship, helping engineers
    adopt effective tools, automation practices, and
    development standards.
  - Influence technical direction and champion developer
    productivity improvements within engineering teams and
    across the broader organization.

  Requirements

  - Bachelor's or Master's degree in Computer Science, Software
    Engineering, or a related discipline, or equivalent
    experience.
  - 8+ years of professional software engineering experience,
    including significant experience with developer tooling,
    internal developer platforms, infrastructure, or software
    development automation.
  - Strong backend software engineering experience, with
    proficiency in programming languages such as Java, Python,
    TypeScript, or Go.
  - Experience designing, building, or improving tools and
    platforms used by other engineers.
  - Experience implementing or driving adoption of AI-enabled
    development tools, automation, or workflows to improve
    engineering productivity.
  - Experience with cloud platforms such as AWS, Azure, or GCP,
    including CI/CD tooling.
  - Deep understanding of the software development lifecycle,
    build systems, automation, and engineering best practices.
  - Proven ability to lead technical initiatives, collaborate
    across engineering teams, and mentor other engineers.
  - Strong communication and problem-solving skills, with the
    ability to translate developer needs into practical
    technical solutions.
  - Enthusiasm for emerging technologies and a passion for
    improving how software is developed.

  Preferred Qualifications

  - Experience building or maintaining internal developer
    platforms, including technologies such as Backstage or
    comparable developer portal frameworks.
  - Experience extending or developing build tooling, such as
    creating custom Gradle plugins or similar reusable build-
    system integrations.
  - Experience implementing AI-assisted development workflows,
    including developer assistants, AI-enabled automation, or
    other tools adopted by engineering teams.
  - Experience with developer-focused observability, monitoring,
    security tooling, or vulnerability management.
  - Experience building tools or platforms used across multiple
    engineering teams.
  - Experience with frontend technologies or full-stack
    development in addition to backend engineering.

  Level Expectations

  - Principal Software Engineer: Operates at the scope of the
    whole Engineering Organization. Leads large, multi-team
    initiatives and shapes their team's technical direction
    over 6–12 months with engineering leadership. Builds tools
    and patterns that scale beyond themself and uses metrics
    to decide where to invest.
  - Staff Software Engineer: Operates at team-level scope. Leads
    complex, multi-person efforts in their team's core areas,
    such as CI/CD, build tooling, and observability. Mentors
    engineers and raises the quality and velocity of the team
    by leading through example.

  Benefits

  Seeq is a remote-first (only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.

  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability.

  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers’
  expectations. We are certified as a great place to work, an
  emerging startup, the Technology Fast 500, and Inc.
  Magazine's Best Places to Work.

  The Perks of Working at Seeq

  - Competitive salary plus bonus incentives
  - Benefits:

  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.

  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas
