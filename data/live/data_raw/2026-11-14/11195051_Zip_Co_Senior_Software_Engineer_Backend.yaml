description: |
  - Build the payments infrastructure that enables Zip customers
    to transact securely and seamlessly at scale.
  - Bring deep backend and payments expertise, strong technical
    ownership, and practical AI fluency to solve complex
    engineering challenges.
  - Remote-first opportunity for US-based employees with the
    option to work in-person out of our Manhattan office

  Start your adventure with Zip

  Join Zip’s Engineering team and help build the payments
  infrastructure that powers how our customers transact.

  As a Senior Software Engineer, you’ll design and build the
  systems behind card issuing, transaction processing, and
  settlement across Zip’s physical and virtual card
  experiences. You’ll work across our payments ecosystem,
  including integrations with Stripe Issuing and banking
  partners, building reliable services that support high
  volumes of transactions and mission-critical financial
  workflows.

  This is a hands-on builder role where you’ll own complex
  technical problems from design through production,
  contribute to architectural direction, and partner closely
  with Product, Engineering and Infrastructure. You’ll also
  use AI throughout the software development lifecycle to
  improve engineering quality, speed and problem-solving,
  while identifying new opportunities to apply AI responsibly
  across engineering workflows.

  Interesting Problems You’ll Get to Solve

  - Build and evolve scalable card issuing, transaction
    processing and settlement systems that power critical Zip
    customer experiences.
  - Design reliable integrations across Stripe, banking partners
    and Zip’s internal platforms, ensuring transactions move
    securely and accurately at scale.
  - Own complex technical initiatives from design through
    production, making thoughtful tradeoffs across customer
    experience, reliability, security and delivery speed.
  - Contribute to the architecture of event-driven, distributed
    backend systems using .NET, C#, Azure, DDD and CQRS.
  - Build resilient payment systems that operate effectively
    within evolving regulatory, compliance and risk
    requirements.
  - Improve the reliability, observability and performance of
    production systems, identifying issues early and
    strengthening how Zip responds when they occur.
  - Partner with Product, Engineering and Infrastructure to
    navigate technical tradeoffs, de-risk unknowns and deliver
    solutions that support customer and business outcomes.
  - Raise engineering quality through thoughtful design and code
    reviews, automated testing, monitoring and strong
    development practices.
  - Leverage AI-assisted development throughout the software
    lifecycle to accelerate delivery, improve code quality and
    strengthen testing, debugging and technical problem-
    solving.
  - Explore practical applications of emerging AI capabilities
    to improve engineering workflows, automate repetitive work
    and help the team build more effectively.
  - Mentor and support engineers through pairing, code reviews,
    technical guidance and knowledge sharing.

  What You’ll Bring to the Team

  - Bachelor's degree in Computer Science, Software Engineering,
    or a related field, or equivalent practical experience. A
    graduate degree is a plus.
  - 10+ years of software engineering experience designing,
    building, testing, and maintaining complex production
    systems.
  - Deep experience with .NET/C#, Azure Cloud Services, and
    distributed backend systems.
  - Experience designing systems using Domain-Driven Design
    (DDD), CQRS and event-driven architectures.
  - Experience building payment infrastructure, card issuing or
    transaction processing systems, including platforms such
    as Stripe Issuing, Marqeta or comparable in-house
    solutions.
  - Demonstrated ability to independently own complex technical
    initiatives from architecture and design through
    production delivery.
  - Strong understanding of reliability, observability,
    automated testing, system performance and production
    incident management.
  - Experience navigating the security, compliance, and
    operational considerations involved in building mission-
    critical financial systems.
  - Proven ability to influence technical decisions and partner
    effectively across Engineering, Product and other
    technical and business teams.
  - Experience mentoring engineers and strengthening engineering
    practices through code reviews, pairing and knowledge
    sharing.
  - Proven experience leveraging AI-assisted development tools
    across coding, testing, debugging and technical problem-
    solving to improve software quality, developer
    productivity and delivery speed.
  - Ability to evaluate and apply emerging AI capabilities to
    engineering workflows, using sound judgment to ensure
    quality, security and maintainability.
  - A high-ownership, collaborative approach aligned with Zip’s
    values: Customer First, Own It, Stronger Together and
    Change the Game.

  What you’ll get in return

  Zip is a place where you’ll get out what you put in. The
  newness of our sector means we need to move at pace and
  embrace change, and our promise to you when you join the
  team is that you’ll feel empowered and trusted to make big
  things happen quickly.

  We want you to feel welcome and as though you have the
  support to be yourself, and care for yourself at work.
  Because it’s important to us that you make the most of the
  opportunities you’ll get to grow your skills and your
  career, and be surrounded by smart, friendly people and
  leaders that have your back.

  We think these are just some of the best things about being
  a Zipster. We will also offer you:

  - Flexible working culture
  - Incentive programs
  - Unlimited PTO
  - Generous paid parental leave
  - Leading family support policies
  - Company-sponsored 401k match
  - Learning and wellness subscription stipend
  - Beautiful Union Square office with a casual dress code
  - Industry-leading, employer-sponsored insurance for you and
    your dependents, with several 100% Zip-covered choices
    available

  Zip is committed to a straightforward and transparent pay
  structure. The actual base salary will be determined by
  various individualized factors, including job-related
  knowledge, skills, experience, location, internal equity, as
  well as other objective business considerations.

  The annual base Pay Range for this position is $150,000 -
  $175,000. This range reflects our US national compensation
  band (USN). Additional premium percentages may apply based
  on our tiered premium strategy.

  Subject to those same considerations, the total compensation
  package for this position may also include other elements,
  including a bonus and/or commission awards, in addition to a
  full range of medical, financial, and/or other benefits.

  *Please note that visa sponsorship is not available for this
  position.

  If hired, employees will be in an 'at-will position' and the
  Company reserves the right to modify base salary (as well as
  any other discretionary payment or compensation or benefit
  program) at any time, including for reasons related to
  individual performance, Company or individual
  department/team performance, and market factors.

  Be a part of a team that reflects the diversity of our
  customers

  We pride ourselves on being a workplace that provides equal
  opportunities to people of all ages, cultural backgrounds,
  sexual orientations, gender identities, abilities, veteran
  status, and everything else that makes you unique.

  Equally, we’re committed to ensuring our recruitment
