description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology and data
  driven group implementing a scientific approach to
  investing. Combining data, research, technology and trading
  expertise has shaped QRT’s collaborative mindset which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high quality returns for our investors.

  You will work on the development of software systems and
  reusable components that support QRT’s research and
  technology infrastructure. The role focuses on solving
  complex engineering challenges involving system performance,
  concurrency and reliability. You will collaborate with
  Quantitative Researchers and Software Engineers to develop
  technical solutions, contribute to architectural decisions
  and improve existing systems.

  Your future role within QRT

  - Design, develop and maintain reliable, high performance
    software systems and reusable components
  - Take ownership of technical design and implementation,
    contributing to architectural decisions and the evolution
    of existing systems
  - Solve complex engineering challenges involving concurrency,
    memory management, system performance and reliability
  - Investigate and resolve production issues, identifying
    underlying causes and implementing improvements to system
    robustness and efficiency
  - Collaborate with Quantitative Researchers and Software
    Engineers to understand requirements and deliver effective
    technical solutions
  - Contribute to code reviews, automated testing and software
    engineering best practices to maintain code quality

  Your present skillset

  - Strong proficiency in at least one programming language such
    as Python, Rust, C++, Go or Java
  - Excellent computer science fundamentals, particularly
    algorithms, data structures and system design
  - Experience designing, developing and maintaining software
    systems, with ownership of technical implementation
  - Strong understanding of multithreading, asynchronous I/O,
    memory management and performance optimisation
  - Experience developing reliable production software,
    including debugging, testing and performance analysis
  - Proficiency working in Linux environments
  - Strong analytical and problem solving skills, with the
    ability to investigate complex technical challenges
    independently
  - Excellent communication skills and ability to collaborate
    effectively with researchers and engineering teams

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
