description: |
  Join Zepz: Breaking Down Borders, Together

  Our Meaningful Mission At Zepz, we're all about breaking
  down barriers for our customers and our teammates. Our
  purpose is deeply personal, we provide a lifeline and
  deliver opportunities to cross-border communities that need
  it most through cutting edge finance and tech.Zepz is the
  power behind WorldRemit and Sendwave,  driven by the mission
  to celebrate the incredible impact migrants have, both at
  home and abroad. We're not just moving money; we're building
  a world that truly recognizes and supports global
  connections.

  Who You'll Be Joining We look for mission-driven builders
  who thrive in a fast-paced environment connected to a true
  purpose. We’re an always developing team of experts that
  enjoy problem solving and bring clarity to tough challenges.
  At Zepz, we are Relentless Learners, always seeking
  feedback, and  Responsible Owners, treating company
  resources like your own. We depend on Transparent
  Communicators who keep the team aligned through open, honest
  talk. Our Core Commitments — What We Live By Our vibrant and
  truly diverse culture is built on three core commitments,
  that guide how we work and interact:

  - Integrity: We always do the right thing. It’s simple, but
    it’s the foundation of everything we build for our
    customers and each other.
  - Outcomes: We work for our customers. Their success and
    prosperity are the results we focus on delivering.
  - Velocity: We are fast! We maintain high energy levels and
    make smart decisions quickly, keeping us nimble and ahead
    of the curve.

  Perks of Joining Our Team We believe in empowering
  colleagues because we genuinely trust our team. Our culture
  is founded on this high trust, which naturally encourages
  the high ownership that drives us to meet our shared high
  expectations and deliver high performance. While we have all
  the tools to work remotely, we value the purpose and
  benefits of in-person connections so we expect our teams to
  come to the office on a regular basis, and therefore be
  within a comfortable commutable distance from our London
  office. Alongside a great office environment, think
  unlimited annual leave , great healthcare benefits, and
  employee discounts. We want you to thrive and focus entirely
  on making your biggest impact! In turn, we expect you to
  bring high ownership and commitment to your work. This is a
  place where we value trust and high performance, and we'll
  provide the environment and support needed for you to excel.
  About the Role As an Engineer in Payments, you will build
  the seamless, reliable, and performant systems that power
  our user journey, from initial quote to final delivery of
  funds. This involves owning core workflows: managing
  payments in, handling recipient creation, overseeing
  transaction lifecycles, and evolving in-app wallet
  capabilities. We are building a highly scalable payments
  infrastructure to support the growth of Zepz and its
  multiple brands. Our solutions must be flexible and robust
  enough to handle increasing customer volumes, new payment
  methods, emerging products, and future brand integrations,
  ensuring an excellent user experience across the entire
  money movement lifecycle. What you will own

  - Build and maintain software for the end-to-end payments
    experience, including payment method management and
    capturing funds, recipient creation, payment
    orchestration, and transaction records.
  - Look after and improve our existing fiat and crypto wallet
    solutions.
  - Collaborate with other teams to help ensure smooth and
    secure payment flows across all products and features.

  What you bring to the table

  - You have strong experience building backend services/APIs in
    Kotlin or Java.
  - The code you write:
    - Follows industry best practices.
    - Is well tested.
    - Is maintainable.
    - Is scalable.
    - Is well documented.
  - You deeply care about the customer experience and love to
    take ownership of solutions end-to-end.
  - You are a keen learner and love to pick up new skills
    including new programming languages and get out of your
    comfort zone.
  - You have a good understanding of observability and metrics:
    Dashboards and alerting are your bread and butter and you
    understand the value in monitoring the systems you build
    not only in terms of infrastructure and operational
    excellence, but also for business metrics.
  - You are pragmatic, and understand that perfect is the enemy
    of done, but also that there are some things that cannot
    be compromised on.
  - You have an open mind with respect to diversity and
    inclusivity. Our team (and customers) come from all over
    the world.

  Bonus Points

  - Have worked in fullstack teams alongside other backend and
    mobile engineers.
  - Have exposure to Kotlin Multiplatform or Spring or Python
    are willing to learn on the job.
  - Have strong familiarity with SQL
  - Experience with the following tools and frameworks:
    - Apache Airflow and or  data pipelines.
    - FastAPI and/or Flask
    - Postgres (AWS Aurora Ideally)
    - Grafana, Datadog, other monitoring tools
  - Have experience working in the FinTech industry or other
    highly regulated environments

  If you want to join us in our journey to help break barriers
  in financial access and improve lives globally, there's no
  better place or time to join. Our global team of 800+ people
  is spread across six continents. We aspire to hire the best
  mix of people from former Olympians to YouTube influencers
  and we speak over twenty languages. This incredible
  diversity isn't a bonus; it's the engine that lets us serve
  the world. Ready to Apply? Let’s Go.
