description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Design and build backend and distributed services for a no-
  code product aimed at non-technical users. Partner with
  users and product colleagues, contribute to written specs,
  and make sound technical decisions that keep systems
  dependable and easy to evolve as usage grows.

  What you'll do

  - Build and evolve backend services and distributed systems
    behind a customer-facing software product.

  - Improve the speed and interactivity of queries that run
    against large data warehouses, including query tuning and
    storing precomputed results.

  - Develop analytics and experimentation features that let
    users define audiences and measure how they perform.

  - Explore real-time computation and data syncing as underlying
    data platforms become faster.

  - Apply generative AI to streamline user workflows.

  - Write and review product specs, and speak directly with
    users to refine work based on their feedback.

  - Weigh long-term design tradeoffs so that services stay
    robust, maintainable and able to handle growth.

  Requirements

  What we're looking for

  - Staff-level engineering experience at minimum.

  - A strong backend specialization; primarily full-stack or
    infrastructure-focused profiles are not the target for
    this role.

  - Excellent grounding in systems design fundamentals.

  - A product-minded approach to backend work, including
    openness to calls with users and iterating on their
    feedback.

  - Experience at a high-velocity startup during later stages of
    rapid growth.

  - A degree in computer science, math or electrical engineering
    from a highly ranked program.

  - Clear communication skills and a curious, fast-learning
    mindset.

  Bonus points

  - A track record of quick promotion at previous high-growth
    companies.

  Benefits

  Compensation and benefits

  - Base salary: USD 180,000 to 320,000 per year

  - Equity

  Location and work model

  - Remote (US or Canada)

  - Full-time
