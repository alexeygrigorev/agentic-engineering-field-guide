  About the Role:

  Grade Level (for internal use):

  11

  The Role: Lead, Software Engineer

  Location: Hybrid setting role, 2 days per week onsite on NYC
  or Princeton, NJ

  About the Role:

  S&P Dow Jones Indices is a leader in benchmarks and
  investable indices, providing indispensable solutions to
  institutional clients. We are seeking a Lead Software
  Engineer for our indices prototyping platform. The ideal
  candidate is a highly skilled developer with experience in
  designing and implementing large-scale distributed systems
  that handle complex calculations and are deployed to cloud
  infrastructure. This role is pivotal in advancing S&P
  Global's capabilities in delivering high-quality indices and
  benchmarks.

  The Team:

  The Lead Software Engineer will collaborate with a team of
  seasoned Software Engineers, contributing to the development
  of robust and scalable solutions that meet the evolving
  needs of our institutional clients. This team is dedicated
  to fostering an environment of innovation and continuous
  improvement, where creative problem-solving and cutting-edge
  technology solutions are at the forefront. As part of this
  collaborative effort, the Lead Software Engineer will work
  on implementing high-quality solutions and contribute to the
  overall development direction of the platform. Additionally,
  the team values open communication and encourages the
  sharing of ideas and best practices, creating a supportive
  atmosphere for professional growth and development.

  Responsibilities include:

  - Lead the design, development, and deployment of applications
    using modern programming languages and frameworks.
  - Collaborate with cross-functional teams to define, design,
    and ship new features.
  - Ensure the performance, quality, and responsiveness of
    applications.
  - Identify and correct bottlenecks and fix bugs.
  - Help maintain code quality, organization, and automation.
  - Develop and implement applications that are highly scalable
    and fault-tolerant.
  - Utilize cloud services for application deployments.
  - Implement containerization strategies for applications.
  - Develop user interfaces using modern front-end technologies.
  - Mentor junior developers and provide technical guidance.
  - Stay up-to-date with emerging technologies and industry
    trends.

  Compensation/Benefits Information (US Applicants Only):

  S&P Global states that the anticipated base salary range for
  this position is $120,000 – $150,000. Final base salary for
  this role will be based on the individual’s geographical
  location as well as experience and qualifications for the
  role.

  This role is eligible to receive additional S&P Global
  benefits. For more information on the benefits we provide to
  our employees, please click here.

  What We’re Looking For:

  Basic Required Qualifications:

  - Ideal candidate should have 8+ years of strong Java
    experience in designing, developing, testing and
    successfully deploying critical and complex projects.
  - Must have strong Java skills with experience in development
    of concurrent and distributed systems.
  - Should have experience working in Java 8 features especially
    Streams API.
  - Must have 5 + yrs. advanced experience with Spring-based
    technologies (Spring Boot, Spring Cloud etc.) and caching
    frameworks like Hazelcast.
  - Must have 5 + yrs. SQL knowledge and experience.
  - Role requires experience in designing and implementing micro
    services based solutions; and experience writing
    unit/integration tests; writing SQL queries with a good
    understanding of data model.
  - Should possess exposure of AWS cloud (EC2, ECS, Load
    Balancer, Security Group, Lambda, S3, etc.).
  - Strong analytical and problem solving skills.
  - Bachelor’s degree in Computer Science, Information
    Technology, or a related field.

  Additional Preferred Qualifications:

  - Master’s degree in Computer Science or related field.
  - Experience with CI/CD pipelines and DevOps practices.
  - Experience with Agile/Scrum methodologies.

  Right to Work Requirements:

  This role is limited to persons with indefinite right to
  work in the United States.

  Return to Work:

  Have you taken time out for caring responsibilities and are
  now looking to return to work? As part of our Return to Work
  initiative, Restart, we are encouraging enthusiastic and
  talented returners to apply and will actively support your
  return to the workplace.

  About S&P Global Dow Jones Indices

  At S&P Dow Jones Indices, we provide iconic and innovative
  index solutions backed by unparalleled expertise across the
  asset-class spectrum. By bringing transparency to the global
  capital markets, we empower investors everywhere to make
  decisions with conviction. We’re the largest global resource
  for index-based concepts, data and research, and home to
  iconic financial market indicators, such as the S&P 500® and
  the Dow Jones Industrial Average®. More assets are invested
  in products based upon our indices than any other index
  provider in the world. With over USD 7.4 trillion in
  passively managed assets linked to our indices and over USD
  11.3 trillion benchmarked to our indices, our solutions are
  widely considered indispensable in tracking market
  performance, evaluating portfolios and developing investment
  strategies.

  S&P Dow Jones Indices is a division of S&P Global (NYSE:
  SPGI). S&P Global is the world’s foremost provider of credit
  ratings, benchmarks, analytics and workflow solutions in the
  global capital, commodity and automotive markets. With every
  one of our offerings, we help many of the world’s leading
  organizations navigate the economic landscape so they can
  plan for tomorrow, today. For more information, visit
  www.spglobal.com/spdji.

  What’s In It For You?

  Our Mission:

  Advancing Essential Intelligence.

  Our People:

  We're more than 35,000 strong worldwide—so we're able to
  understand nuances while having a broad perspective. Our
  team is driven by curiosity and a shared belief that
  Essential Intelligence can help build a more prosperous
  future for us all.From finding new ways to measure
  sustainability to analyzing energy transition across the
  supply chain to building workflow solutions that make it
  easy to tap into insight and apply it. We are changing the
  way people see things and empowering them to make an impact
  on the world we live in. We’re committed to a more equitable
  future and to helping our customers find new, sustainable
  ways of doing business. Join us and help create the critical
  insights that truly make a difference.

  Our Values:

  Integrity, Discovery, Partnership

  Throughout our history, the world's leading organizations
  have relied on us for the Essential Intelligence they need
  to make confident decisions about the road ahead. We start
  with a foundation of integrity in all we do, bring a spirit
  of discovery to our work, and collaborate in close
  partnership with each other and our customers to achieve
  shared goals. Benefits:

  We take care of you, so you can take care of business. We
  care about our people. That’s why we provide everything
  you—and your career—need to thrive at S&P Global. Our
  benefits include:

  - Health & Wellness: Health care coverage designed for the
    mind and body.
  - Flexible Downtime: Generous time off helps keep you
    energized for your time on.
  - Continuous Learning: Access a wealth of resources to grow
    your career and learn valuable new skills.
  - Invest in Your Future: Secure your financial future through
    competitive pay, retirement planning, a continuing
    education program with a company-matched student loan
    contribution, and financial wellness programs.
  - Family Friendly Perks: It’s not just about you. S&P Global
    has perks for your partners and little ones, too, with
    some best-in class benefits for families.
  - Beyond the Basics: From retail discounts to referral
    incentive awards—small perks can make a big difference.

  For more information on benefits by country visit:
  https://spgbenefits.com/benefit-summaries

  Global Hiring and Opportunity at S&P Global:

  At S&P Global, we are committed to fostering a connected and
  engaged workplace where all individuals have access to
  opportunities based on their skills, experience, and
  contributions. Our hiring practices emphasize fairness,
  transparency, and merit, ensuring that we attract and retain
  top talent. By valuing different perspectives and promoting
