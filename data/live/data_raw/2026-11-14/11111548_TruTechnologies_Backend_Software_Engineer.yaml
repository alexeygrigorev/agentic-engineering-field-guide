description: |
  Position Overview: TruTechnologies is seeking a mid-level
  backend software engineer to join our small, but growing
  team. You must have a passion for diving deep into real-
  world business problems and architecting scalable server-
  side solutions. The ideal candidate takes strong ownership,
  thrives in a relatively unstructured environment, and is
  ready to lead backend initiatives while mentoring newer
  developers. This position offers a unique opportunity to
  shape our data model, infrastructure, and development
  processes while making a significant impact on the company's
  technical direction.

  What You'll Do:

  - Design, build, and iterate on backend services,
    RESTful/GraphQL APIs, and database schemas
  - Take ownership of backend architecture decisions, optimizing
    for performance, scalability, and reliability
  - Develop and enforce best practices across our tech stack,
    development process, and CI/CD pipelines
  - Collaborate seamlessly with frontend developers, product
    managers, QA testers, and stakeholders to deliver end-to-
    end features
  - Effectively juggle multiple concurrent projects, proactively
    reporting status and clarifying priorities
  - Lead architecture sessions, conduct thorough code reviews,
    and mentor junior developers
  - Identify and implement backend improvements for internal-
    and external-facing product offerings

  What You'll Need:

  - 3–5 years of professional backend software development
    experience
  - Strong proficiency in one or more backend languages (e.g.,
    Python, Java, Node.js, Go, or C#)
  - Deep experience with relational and/or NoSQL databases,
    query optimization, and data modeling
  - Familiarity with cloud infrastructure (AWS, GCP, or Azure)
    and containerization (Docker, Kubernetes)
  - Solid understanding of system design, API architecture, and
    design patterns
  - A passion for building software that solves real-world
    business problems
  - Intellectually curious, feedback-oriented, and able to
    course-correct quickly
  - Excellent communication skills and a team-first attitude
  - Experience with Ruby on Rails is preferred
  - Bachelor's degree in Computer Science is preferred, but not
    required
