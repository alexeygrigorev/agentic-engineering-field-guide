description: |
  About Syllo

  Syllo is on a mission to transform litigation. Our product
  is a unified litigation platform that enables lawyers and
  paralegals to safely harness the power of language models
  and agentic AI throughout the litigation life cycle. Since
  going to market, we have gained a diverse group of
  enterprise customers, including some of the biggest law
  firms and corporations in the country, and we are quickly
  expanding. By reducing the expense of litigation industry-
  wide, we aim to improve access to high-quality
  representation and promote the alignment of legal outcomes
  with merit.

  About the Role

  We’re looking for a Sr. Engineering Manager who will foster
  a collaborative, high-performing environment where engineers
  can grow, learn, and thrive.

  Responsibilities

  - Mentor, coach, and support the career growth of 8-10
    engineers. You will conduct regular 1-on-1s, provide
    actionable feedback, and foster a culture of ownership and
    psychological safety.

  - Participate in personnel review, including the shaping of
    the performance review process and structure.

  - Improve engineering processes (scrum meetings, code reviews,
    testing) to increase velocity without sacrificing quality.

  - Partner with Product Managers to translate roadmaps and
    designs into concrete execution plans. Be responsible for
    allocating work among engineers, monitoring progress, and
    facilitating collaboration.

  - Work with the leadership team to define engineering staffing
    strategy and team structure, and participate in hiring and
    recruiting.

  Qualifications

  - 5+ years of experience in engineering management, leading
    teams of 5 or more in a fast-paced environment, preferably
    remote.

  - Core software engineering skills, including proficiency in
    languages such as Python and Ruby.

  - Knowledge of engineering practices and patterns for the full
    software development lifecycle.

  - Comfortable with ambiguity and shifting priorities.

  - Excellent communication and interpersonal skills, able to
    engage effectively with both technical and non-technical
    stakeholders.

  - Experience partnering with product management teams.

  Salary Range: $190,000-$230,000 USD plus health insurance
  and equity.



  United States - Remote Pay Range

  $190—$230 USD
