description: |
  Why Socure?

  Socure is building the identity trust infrastructure for the
  digital economy — verifying 100% of good identities in real
  time and stopping fraud before it starts. The mission is
  big, the problems are complex, and the impact is felt by
  businesses, governments, and millions of people every day.

  We hire people who want that level of responsibility. People
  who move fast, think critically, act like owners, and care
  deeply about solving customer problems with precision. If
  you want predictability or narrow scope, this won’t be your
  place. If you want to help build the future of identity with
  a team that holds a high bar for itself — keep reading.

  At Socure, Software engineers work within product-focused
  teams to design and build systems that operate at scale and
  deliver meaningful, real-world impact. Our teams actively
  engage with customers to drive satisfaction and champion
  continuous improvement across our product suite.



  As a Senior Backend Engineer, you will be responsible for
  leading the design and implementation of distributed
  systems, taking full ownership of critical non-functional
  requirements such as scalability, security, and reliability.
  You will mentor fellow engineers, provide technical
  expertise, and remain hands-on through all phases of
  development—from architecture and implementation, to
  testing, documentation, and production support.



  This role is ideal for backend engineers who are passionate
  about building robust systems in Golang, thrive in a fast-
  paced environment, and want to shape technology at scale.



  What you'll do:

  - Architect, develop, test, and debug scalable backend
    services for distributed systems.
  - Lead and deliver on key non-functional requirements,
    including scalability, availability, performance, and
    security.
  - Design, author, and maintain comprehensive unit,
    integration, and functional tests to ensure reliability
    and exceptional coverage.
  - Create and contribute to technical documentation, fostering
    knowledge sharing and collaboration across teams.
  - Break down complex projects into clear, actionable tasks and
    drive them through to completion.
  - Mentor and support team members with code reviews, technical
    guidance, and sharing best practices.
  - Collaborate cross-functionally with product managers,
    designers, and engineers to deliver impactful features.
  - Continuously improve engineering processes, tools, and
    practices within an agile environment.What you'll bring:
  - 5–8 years of professional software engineering experience
    with strong Golang proficiency, ideally in product-driven
    companies.
  - Solid programming fundamentals, excellent problem-solving
    skills, and expertise in system design.
  - Deep understanding of concurrency, multi-threading, and
    distributed computing concepts.
  - Experience building microservice architectures and
    developing RESTful APIs.
  - Demonstrated analytical and reasoning skills, with the
    ability to visualize and simplify complex systems.
  - Experience working with high-throughput, low-latency systems
    is highly desirable.
  - Familiarity with cloud platforms (AWS/GCP), NoSQL databases,
    big data analytics, or machine learning services is a
    plus.
  - A growth mindset and a genuine desire to learn, improve, and
    help build leading-edge backend systems.

  Additional Information

  - Permanent right to work in the UK is required; Socure does
    not provide visa sponsorship for this role.
  - Candidates must be based in London or within a commutable
    distance, with the ability to attend the office as needed.

  Socure is an equal opportunity employer that values
  diversity in all its forms within our company. We do not
  discriminate based on race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status. If you need an
  accommodation during any stage of the application or hiring
  process—including interview or onboarding support—please
  reach out to your Socure recruiting partner directly.

