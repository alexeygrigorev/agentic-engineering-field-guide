description: |
  This is an unpaid internship at this time and is suitable
  for candidates pursuing degree completion that wants to be a
  Senior Back-End Engineer. Company Overview:

  Flow Global Software Technologies, LLC., operating in the
  Information Technology (IT) sector, is a cutting-edge high-
  tech enterprise AI company that engages in the design,
  engineering, marketing, sales, and 5-star support of a
  cloud-based enterprise AI platform with patent pending
  artificial intelligence, deep learning, and other core
  proprietary technologies awaiting patent approval. Flow
  Turbo™, the company's first product, is a brand of next-
  generation SaaS AI sales prospecting platform that is
  designed to maximize the productivity day-to-day for B2B
  sales representatives within B2B outbound, inbound, and
  inside sales organizations of B2B companies. The company
  also provides world-class award-winning customer support,
  professional services, guidance, certifications, training,
  and advisory services. The company is headquartered in
  Austin, Texas and is registered in Delaware.

  Position Overview:

  Flow is seeking a highly skilled and highly motivated Senior
  Back-End Engineer Intern to join our engineering
  organization. This is a demanding role requiring expertise
  in complex back-end engineering, specifically with Django
  development, and a significant understanding of API
  development, API calls, API routes, API endpoints, API
  tokens, authorization, authentication, OAuth2.0, data
  management, data flows, data triggers, relational databases,
  SQL, ER diagramming, schema development, systems
  architecture, and cloud infrastructure. The ideal candidate
  is a seasoned engineer with a passion for building robust,
  scalable systems and possesses a strong background in system
  architecture and database design. This position is ideal for
  individuals currently pursuing or have obtained a Master's
  degree in Computer Science with a strong background in back-
  end engineering technologies and Django. The internship is
  remote-only and requires a commitment of at least 30 hours
  per week.

  Key Responsibilities:

  - Django Development: Build and maintain scalable back-end
    applications using Django, ensuring high performance and
    responsiveness.
  - API Development: Design, implement, and maintain RESTful
    APIs to support front-end and external service
    integrations.
  - Data Management & Data Flow: Develop and manage efficient
    data pipelines, ensuring smooth data flows and triggers
    across various systems.
  - Database Management: Design and maintain complex database
    schemas, perform database migrations, and optimize
    database performance (PostgresSQL experience preferred).
  - ER Diagramming & Schema Development: Create and maintain
    entity-relationship (ER) diagrams, and develop robust
    database schemas aligned with business requirements.
  - Authentication & Authorization: Implement and manage secure
    authentication and authorization mechanisms within the
    application.
  - Systems Design & Architecture: Participate in the design and
    architecture of scalable systems, ensuring best practices
    in systems and database architecture.
  - Cloud Infrastructure: Configure and maintain cloud
    infrastructure services to support live production
    deployments. Experience with cloud platforms (AWS, Google
    Cloud, etc.) is preferred.
  - Testing & QA: Develop and execute unit tests, integration
    tests, regression tests, and API tests to ensure code
    quality and reliability.
  - Linux & Shell Scripting: Utilize Linux-based environments
    for server management and automation tasks using Bash,
    SSH, and shell scripting.
  - Collaboration & Documentation: Work closely with cross-
    functional teams to ensure seamless integration of all
    systems, and maintain comprehensive documentation for all
    projects.

  Qualifications:

  - Experience: 2-3+ years of professional experience in complex
    back-end engineering, especially with Django.
  - Technical Skills:
    - Expert in Django, Python, and RESTful API development.
    - Expert with data management, data flows, and data triggers.
    - Expertise in database design, including ER diagramming,
      schema development, and PostgresSQL.
    - Expert in system design, architecture, and cloud
      infrastructure configuration for production deployments.
    - Hands-on experience with testing frameworks for unit,
      integration, regression, and API testing.
    - Expert in Linux, Bash, SSH, and shell scripting.
    - Expertise with a wide variety of cloud infrastructure
      platforms and deployment configurations for hosting
      servers and live production environments.
  - Remote Work: Must be able to work remotely and dedicate a
    minimum of 30 hours per week.

  Benefits:

  - Remote native; Location freedom
  - Professional industry experience in the SaaS and AI industry
  - Creative freedom
  - Potential to convert into a full-time position

  Note:

  This internship offers an exciting opportunity to gain
  hands-on experience in back-end engineering within a high
  pressure and innovative environment. Candidates must be
  self-motivated, proactive, and capable of delivering high-
  quality results independently. The internship provides
  valuable exposure to cutting-edge technologies and real-
  world software development practices, making it an ideal
  opportunity for aspiring back-end engineers.

  This is an unpaid internship at this time and is suitable
  for candidates pursuing degree completion that wants to be a
  Senior Back-End Engineer.
