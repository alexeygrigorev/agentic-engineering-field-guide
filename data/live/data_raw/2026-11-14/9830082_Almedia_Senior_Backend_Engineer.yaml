description: |
  Our bar is high, and this is the best place for ambitious
  builders.

  Bootstrapped and profitable from day one, Almedia is
  Germany’s fastest-growing company (FT1000). Join us as we
  build the global leader in rewards, at a $1bn+ revenue run
  rate and climbing fast.

  Senior Backend Engineer

  We’re looking for a Senior Backend Engineer to help grow our
  AdTech platform. If you’re passionate about building
  scalable, high-performance web applications and enjoy
  collaborating across teams to serve millions of users, we’d
  love to hear from you.

  Tech stack:

  - TypeScript, Node.js, NestJS, Jest.
  - GraphQL, REST, gRPC, WebSockets.
  - MySQL, MongoDB, Redis, BigQuery.
  - RabbitMQ, Google Pub/Sub.
  - Docker, Kubernetes, GitLab CI/CD.
  - Datadog.

  What You’ll Do 🎯

  - Design and develop clean, efficient, and scalable code using
    Node.js, NestJS and TypeScript.
  - Create a data-driven product by integrating external
    services for A/B testing and feature flagging.
  - Deliver high-quality testable code at a high pace, making
    sure everything runs smoothly.
  - Own your services end to end, from design to production.
  - Help our junior engineers grow through code reviews and
    pairing.
  - Use AI tools (Claude, Cursor, Copilot, etc.) as part of your
    everyday toolkit. We actively encourage AI-assisted
    development.

  What You’ll Bring 💡

  - Several years of hands-on production experience with
    Node.js.
  - Strong experience in web development.
  - A strong understanding of scalable systems.
  - Production experience with most of our tech stack.
  - Ownership mindset: take full ownership of your work.
  - Strong English communication skills for effective
    collaboration.

  What Makes You a Great Fit 🌟

  - Experience working with microservices architecture.
  - Background in DevOps/SRE practices.

  Why Almedia? 🎁

  - Scale With Almedia: Grow alongside a startup that has been
    profitable from day one.
  - Central Berlin Office: Work from a fully-stocked modern
    office built for collaboration, accessible from all around
    Berlin.
  - Other Benefits: Transport subsidy, breakfasts and lunches,
    language learning, Urban Sports Club, and more.

  We believe in fostering talent, evaluating all skill levels
  during the hiring process, and providing a clear path for
  growth. Almedia is an equal opportunity employer. We embrace
  and celebrate diversity, and encourage individuals from all
  backgrounds to apply.
