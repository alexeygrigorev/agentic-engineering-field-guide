description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  About the team

  Banks need flexibility in how they fund international
  payments, settle with Wise and convert currencies. Our Cash
  Management team builds the products that give them that
  control and make Wise work for more partners and their
  customers.

  The problems are concrete. How can a bank lock in an
  exchange rate today and provide the funds later? How can it
  send payments first and settle with Wise afterward? We build
  the capabilities behind those choices, helping partners
  manage their cash around the needs of their business.

  We’re a small, growing team developing new products in a
  domain with plenty to learn and shape. You’ll have a
  meaningful say in how we solve customer problems, design our
  systems and maintain engineering quality as we grow. The
  work combines product development with the challenge of
  building dependable services that move money across systems.

  You’ll work closely with product managers, partner banks and
  engineers across Wise whose systems handle accounts,
  incoming payments and liquidity. Together, you’ll understand
  partner needs, agree how those systems fit together and turn
  complex requirements into practical products.

  Job Description

  About the role

  We’re looking for a senior engineer who enjoys understanding
  a customer’s problem, designing a solution and taking
  responsibility for how it performs in production.

  This is a hands-on role with substantial ownership. You’ll
  have the autonomy to move work forward, alongside colleagues
  who contribute through shared design, reviews and pairing.

  You will:

  - Own solutions from problem to production. Work with product
    managers and engineers to understand partner needs, shape
    the approach, and design, build, test and operate backend
    services.
  - Make thoughtful technical decisions. Explain tradeoffs
    clearly and balance delivery time, reliability and
    maintainability, including when the information available
    is incomplete.
  - Build across system boundaries. Work with other teams to
    agree clear interfaces and understand how changes affect
    the wider payment journey.
  - Improve the systems you operate. Strengthen testing and
    observability, diagnose production issues, and use what
    you learn to make services more dependable.
  - Help the team succeed. Contribute across workstreams, share
    domain knowledge and help other engineers grow through
    reviews, pairing and mentoring.

  Our backend stack includes Java, Spring Boot, Kafka and
  PostgreSQL. You’ll deepen your understanding of funding,
  settlement and currency conversion, using that knowledge to
  make better product and engineering decisions. As the team’s
  scope grows, there will be opportunities to take on broader
  technical ownership and influence how we build.

  What will you be doing?

  - Design, develop, and maintain highly scalable services in
    Java and Spring Boot within a microservices architecture.
  - Apply domain-driven design to build robust, scalable
    solutions.
  - Lead development efforts in event-driven architectures using
    Kafka or similar messaging systems.
  - Architect, design, and optimise relational databases (e.g.,
    PostgreSQL) to ensure performance and scalability.
  - Collaborate with cross-functional teams to support partner
    integrations and expand the Wise payment platform
    globally.
  - Participate in code reviews, champion best coding practices
    and mentor junior engineers.

  Qualifications

  We’re looking for:

  - Hands-on experience building or making substantial
    contributions to large-scale distributed systems.
  - Strong backend engineering experience, including relational
    databases, event-driven systems and proficiency in an
    object-oriented language.
  - A product mindset: you can explain the customer problems
    behind your work, why your solution matters and how you
    assess whether it helps.
  - The ability to take ownership with a high degree of
    autonomy, make progress through ambiguity and involve
    others when their expertise is needed.
  - Strong collaboration and communication skills. You can
    explain technical decisions, work effectively across teams
    and contribute to your colleagues’ success.
  - Curiosity about the business domain and a willingness to
    learn how our partners use the products you build.

  Useful additional experience includes:

  - Java, Spring Boot, Kafka or PostgreSQL.
  - Payments, financial technology, funding, settlement or
    foreign exchange.
  - Using product metrics and data to understand customer
    behaviour and guide decisions.

  You can learn our technologies and banking domain here. If
  you bring the core engineering experience, ownership and
  curiosity described above, we’d like to hear from you.

  Additional Information

  Interested? Find out more:

  - How we work - a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it’s like to work at Wise London
  - Our engineering career map

  Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £87,000 - £111,000 + RSUs
