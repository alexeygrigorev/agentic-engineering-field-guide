description: |
  About Syntax Data

  Syntax is a financial data and technology company that
  codifies business models into a relational system called
  Affinity® Data. Using its patented FIS® technology inspired
  by the systems sciences, Affinity® Data offers the most
  comprehensive, granular, and accurate product line revenue
  data available on public companies in the market. This
  technology is leveraged to classify and analyze private
  markets at scale.



  Syntax Direct℠, is an index modelling and analysis platform
  that uses this abundance of data to facilitate the near
  instantaneous creation and ongoing management of boundless
  direct indexing solutions and rules-based equity portfolios
  through a fully automated platform. Syntax Indices provides
  customized and proprietary indices, including core global
  benchmarks and micro- and macro-thematic, smart beta,
  defined outcome, and target volatility indices. These
  indices are foundational for a range of financial products,
  such as ETFs, UITs, and structured products.



  About the Role

  Syntax’s Software Engineering team is a group of highly
  motivated people with a passion for technology. As a Mid-
  Level or Senior Software Engineer you will be responsible
  for developing, maintaining and innovating on Syntax’s
  financial software and data products.  You will be tasked
  with writing optimized, performant code, and be expected to
  contribute to the planning and design of our products. Your
  work will contribute to the development of web applications,
  data pipelines and third party integrations. You will mentor
  peers, conduct code reviews, and provide direct feedback
  into Syntax’s software engineering process and improve the
  efficiency of the team.

  Responsibilities will include:

  - Designing, enhancing and maintaining large financial
    databases for use in web applications
  - Developing and maintaining database systems supporting the
    construction of  performant, complex queries
  - Writing well-designed APIs and working with backend services
  - Creating flexible and intuitive client-facing JSON APIs for
    streaming data
  - Implementing dynamic front-end layouts to design
    specifications
  - Ensuring that mission critical systems and services operate
    smoothly by triaging and resolving operational issues as
    part of a team of on-call engineers
  - Collaborating with cross-functional teams to identify and
    solve complex problems

  The ideal candidate will have:

  - A bachelor’s degree or higher in computer science or a
    related discipline
  - Proficiency in relational database systems such as
    Postgresql
  - Familiarity with JavaScript and at least one modern front-
    end framework
  - An eye for code quality, familiarity with design patterns
    and best practices
  - Excellent problem-solving skills and the ability to work
    independently and collaboratively in a fast-paced, agile
    environment
  - Strong communication skills and the ability to articulate
    technical concepts effectively to both technical and non-
    technical audiences

   Preferred skills:

  - Experience with python and a dataframe library such as
    Polars or Pandas
  - Experience working in finance or financial technology
  - Prior professional experience working with and deploying to
    cloud environments such as AWS, DigitalOcean, or
    equivalent
  - Experience with Ruby on Rails or similar MVC framework
  - Familiarity with Infrastructure as Code and tooling such as
    Terraform or AWS CDK

  Mid-level range: $125,000 - $140,000

  Senior-level range: $140,000 - $165,000



  Syntax is a data and technology provider to the financial
  services industry. The company offers unique data sets  for
  public and private companies that organize the global
  economy based on systems theory. Data is offered via
  complete database solutions, consulting services, indices
  and turnkey technology platforms.



  Learn more at syntaxdata.com
