description: |
  Software Engineer (Dashboard)

  Dashboard is the front door to Browserbase. This team owns
  our dashboard and web experience - everything from
  authentication and billing to data-rich observability and
  complex UI. It’s true full stack engineering: building
  interfaces users love while solving tough problems under the
  hood.

  What you’ll do

  - Build and scale Browserbase’s dashboard and web presence.
  - Design and implement complex UI and data visualizations that
    make large-scale data intuitive.
  - Collaborate across teams to ensure the dashboard surfaces
    the power of Browserbase clearly and effectively.
  - Help define, scope, and prioritize roadmap objectives that
    improve user experience.
  - Establish and reinforce best practices around frontend
    performance, accessibility, and maintainability.
  - Document as you go and share your knowledge with the team.

  Technical skills

  - Strong experience with modern frontend frameworks (React,
    Next.js).
  - Proficiency in TypeScript.
  - Background in full stack development (Node.js, APIs,
    Postgres).
  - Experience with data-heavy applications (observability,
    analytics, dashboards).
  - Familiarity with UI/UX best practices and implementing
    complex interfaces.

  You’re a good fit if you…

  - Have high agency: you can set direction, make judgment
    calls, and drive projects forward without waiting for
    perfect clarity.
  - Have a strong sense of ownership and bias toward action.
  - Can drive projects independently, with high accountability
    without much outside input.
  - Communicate clearly in writing and in person, and choose the
    right medium for the message.
  - Are adaptable and able to dive into unfamiliar systems,
    learn quickly, and make sound technical decisions.
  - Enjoy collaborating with a small, ambitious team in a fast-
    paced environment.
  - Are excited to work in New York.

  Why join us

  - Shape the user-facing side of Browserbase — the dashboard
    that every customer touches.
  - Build complex, data-rich applications that bring our
    infrastructure to life.
  - Collaborate with a small, high-bar team of engineers who
    care deeply about quality.
  - Join an ambitious startup where your impact will be felt
    immediately.

  More about Browserbase

  Browserbase is the complete platform to build and deploy
  agents that browse and interact with the web like humans. We
  provide one API key for agents to search and fetch
  information, fill out forms, and replicate user actions.

  We are a Series B startup that grew our revenue 5x in 2025
  and are continuing to grow, fast. Backed by Kleiner Perkins,
  CRV, and Notable Capital, our team is building on our CEO's
  founding vision to power the world's best AI tools and help
  everyone automate the web.
