description: |
  About the company

  Our client is a real estate company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Take charge of the user-facing side of a new internal web
  application, starting with tidying the existing codebase and
  then delivering data-centered features. Collaborate closely
  with colleagues who use the tool, iterate on prototypes and
  contribute to the roadmap.

  What you'll do

  - Lead the front-end codebase, including cleaning up early
    code and establishing a shared component library and
    design system.

  - Create data-heavy interfaces such as charts, maps and AI-
    assisted insights that support business decisions.

  - Meet with internal users to understand how they work,
    capture needs and test rough prototypes, often turning
    feedback around within hours.

  - Produce interface designs in Figma or with AI tools, suggest
    your own feature ideas and help shape the roadmap with
    leadership.

  - Partner with backend and quantitative research leads to
    build tools for additional business functions.

  Requirements

  What we're looking for

  - 4+ years of software engineering experience, including at
    least 2 years at a large technology firm or a high-caliber
    growth-stage startup.

  - A track record of leading product work end to end, from
    early scoping through release, across a wide area of
    functionality.

  - Strong front-end background shipping production web apps,
    with React and Next.js.

  - Experience creating data-intensive products featuring
    visualizations, charts and maps.

  - Skill in designing and prototyping user interfaces in Figma
    or similar tools.

  - Comfort using AI-assisted tools to speed up prototyping,
    coding and delivery.

  - Ability to partner with internal stakeholders, collect
    reactions to early versions and turn them into clear
    requirements.

  - A computer science degree.

  - Ability to work on-site 4-5 days per week.

  - Valid US work authorization.

  Benefits

  Compensation and benefits

  - Base salary: USD 225,000 to 275,000 per year

  - Equity

  Location and work model

  - New York, NY, United States

  - On-site, 4-5 days per week in the office

  - Full-time
