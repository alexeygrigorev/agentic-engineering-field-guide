title: Senior Software Engineer (NetSuite/SuiteCommerce)
company: EBizCharge
location: USA
remote: true
work_type: FULL_TIME
company_size: 200 Employees
description: |
  Headquartered in Irvine, California, EBizCharge specializes
  in developing integrated payment solutions that facilitate
  electronic payment processing within ERP, CRM, Mobile, and
  eCommerce applications. Our applications are PCI compliant
  and fully integrated with major ERP/accounting systems,
  including QuickBooks, Sage, SAP Business One, Microsoft
  Dynamics, NetSuite, Epicor, Acumatica, and major online
  shopping carts, including Magento and WooCommerce.
  EBizCharge offers its employees tremendous learning
  opportunities, career growth potential, and a dynamic work
  environment.

  Responsibilities

  - Design, develop, and optimize SuiteCommerce solutions
    tailored to financial services and fintech applications.
  - Develop custom SCA extensions, SSP applications, and backend
    logic using SuiteScript (1.0/2.0), JavaScript, HTML, CSS,
    and Backbone.js.
  - Integrate third-party systems and services via REST/SOAP
    APIs.
  - Build and maintain integrations with payment gateways,
    compliance tools, and third-party financial applications.
  - Collaborate with cross-functional teams to enhance
    SuiteCommerce’s eCommerce and client portal capabilities
    for financial customers.
  - Monitor and adopt NetSuite and SuiteCommerce updates to
    ensure compatibility and feature enablement.

  Qualifications

  - 4+ years of hands-on development experience with
    SuiteCommerce Advanced (SCA).
  - Proven experience with financial workflows, accounting
    modules, and payment processing in NetSuite.
  - Strong understanding of NetSuite ERP, including custom
    records, workflows, and integration architecture.
  - Strong front-end development skills in JavaScript, HTML,
    CSS, and performance optimization for SuiteCommerce UX/UI.
  - Familiarity with NetSuite deployment processes (SSP
    applications, themes, extensions).
  - Experience with version control systems (Git), and
    understanding of CI/CD pipelines and DevOps practices.
  - NetSuite Certified SuiteCommerce Developer or NetSuite
    Certified ERP Consultant is a plus.
  - Experience integrating NetSuite with financial risk
    management tools, fraud detection systems, or accounting
    platforms such as QuickBooks is a plus.

  Benefits:

  - Employer paid benefits (including Medical, Dental, Vision, &
    life insurance) for selected plans for the employee.
  - Retirement 401(k) plan with company match.
  - Gym access, dry cleaners, car wash conveniently located
    within building.
  - Generous PTO plan with an additional 9 Days Company Paid
    Holidays per year.

  Job Type: Full-time

  The Company is committed to compliance with all applicable
  laws providing equal employment opportunities. This
  commitment applies to all persons involved in Company
  operations. The Company prohibits unlawful discrimination
  against any job applicant, employee or unpaid intern by any
  employee of the Company, including supervisors and
  coworkers. Pay discrimination between employees of the
  opposite sex or between employees of another race or
  ethnicity performing substantially similar work, as defined
  by the California Fair Pay Act and federal law, is
  prohibited. #LI-DNP
