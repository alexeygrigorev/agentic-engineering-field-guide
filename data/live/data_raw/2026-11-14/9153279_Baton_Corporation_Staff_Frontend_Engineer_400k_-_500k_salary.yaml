title: Staff Frontend Engineer ($400k - $500k salary)
company: Baton Corporation
location: New York, USA
work_type: FULL_TIME
company_size: 100 Employees
description: |
  Who We Are

  Baton Corporation is the development company that builds and
  operates the entire technology stack behind pump.fun, the
  largest memecoin launchpad in production today. The systems
  are low latency, high throughput, live under constant load,
  and break if you get them wrong.

  What You’ll Do

  As a Staff Frontend Engineer, you’ll own the design and
  evolution of large parts of our frontend architecture. This
  is a hands-on, high-impact role focused on building fast,
  reliable, and maintainable user-facing systems under real
  load.

  - Architect and evolve large-scale frontend systems using
    React and Next.js that serve hundreds of thousands of
    users
  - Own performance, reliability, and correctness across
    critical user flows, including rendering performance,
    state management, and data fetching
  - Design frontend abstractions and patterns that scale with
    team and product complexity, not just feature count
  - Work closely with backend and Solana engineers to define
    clean, efficient client–server boundaries
  - Lead complex frontend initiatives end to end, from technical
    design through implementation, rollout, and iteration
  - Set a high bar for code quality, testing, and operational
    readiness across the frontend codebase
  - Mentor and unblock other frontend engineers through design
    reviews, pairing, and hands-on guidance

  Who You Are

  - A staff-level frontend engineer with deep experience
    building production React applications at scale
  - Have owned frontend systems used by large, real user bases,
    not just internal tools or small apps
  - Strong understanding of browser internals, rendering
    pipelines, performance optimisation, and modern frontend
    tooling
  - Comfortable designing systems that balance developer
    velocity, performance, and long-term maintainability
  - Deep experience with React, Next.js, and TypeScript;
    comfortable working close to the metal when needed
  - High-agency and ownership-driven, able to drive large
    initiatives with minimal guidance
  - Thoughtful about tradeoffs and able to make pragmatic
    decisions based on real-world constraints
  - Interested in crypto systems or high-scale consumer
    products, and excited by fast-moving environments

  What it's like to work here

  - We work in person
  - Hours can be long and unconventional
  - The pace is intense
  - Expectations are high, and impact is immediate
  - Working at Baton is not for everyone

  Why Join Us?

  - Unmatched ownership and autonomy
  - Exposure to systems operating at the edge of crypto scale
  - The ability to ship fast and see real-world impact
    immediately

  If you’re motivated by responsibility, speed, and building
  products used by massive audiences, you’ll feel at home
  here.
