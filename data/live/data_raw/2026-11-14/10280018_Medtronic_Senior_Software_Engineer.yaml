description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the Life

  Medtronic Digital Technologies is creating ambitious new
  products that bring connectivity, real-time guidance, and
  decision support to the operating room. To support this
  mission, we are developing compact, high-performance,
  embedded systems that enable edge computing and
  connectivity.

  Working closely with other teams across Medtronic, we are
  creating a connected ecosystem and leveraging the state of
  the art in computer vision to provide the most comprehensive
  view of surgery. If you’re interested in using cutting-edge
  technology to improve the standard of care in surgery on a
  global scale, this could be the place for you.

  Responsibilities may include the following and other duties
  may be assigned:

  - Own delivery of backend/services work from design through
    production.
  - Contribute to and lead technical design for complex
    features, services, and components.
  - Identify risks, and define mitigation strategies.
  - Write high-quality code, mainly in Python, and participate
    actively in code reviews.
  - Improve testability, observability, reliability, and
    maintainability.
  - Provide technical mentorship to team members through code
    review, pairing and design feedback.
  - Promote high engineering standards - ensuring clarity,
    scalability, and maintainability in all designs.
  - Collaborate with product, systems, QA, clinical/domain, and
    engineering partners to deliver reliable solutions.
  - Create clear technical documentation - capturing
    architectural decisions, design rationale, and system
    context with the clarity and depth needed for teammates to
    collaborate and extend independently.

  Required Knowledge and Experience:

  - Backend or systems engineering experience, preferably with
    strong Python proficiency.
  - Experience designing, building, and operating distributed
    systems in production, with solid understanding of
    architectural trade-offs involving performance,
    scalability, and reliability.
  - Proficiency with cloud platforms (preferably AWS),
    databases, APIs, and modern DevOps practices.
  - Strong focus on quality assurance, including testing
    strategies, code review practices, and system reliability.
  - Proven ability to own substantial backend or systems work
    from design through production, including surfacing risks
    early, driving pragmatic solutions, and taking
    accountability for quality and maintainability.
  - Track record of successfully navigating ambiguity, including
    making progress with incomplete information, breaking down
    complex problems, and adapting approach as requirements
    evolve.
  - Excellent documentation skills and experience with knowledge
    transfer for project handovers.
  - Must be willing to commute to London 2 to 3 days per week.

  Interest in AI-assisted or agentic coding workflows, with
  good judgment around code review, testing, and responsible
  use of generated code; product experience with agentic
  coding tools is a plus.

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

