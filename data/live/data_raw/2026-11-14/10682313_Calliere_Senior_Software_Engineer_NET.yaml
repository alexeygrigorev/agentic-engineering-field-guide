description: |
  This is a remote position.



   The Senior Software Engineer is a highly experienced,
  hands-on technical leader responsible for owning and driving
  initiatives from concept through delivery. This role
  requires deep technical expertise, strong solutioning
  skills, and the ability to provide technical guidance across
  the software development lifecycle.









   The ideal candidate partners closely with Architecture,
  Product, and DevOps to design and deliver scalable,
  reliable, and high-performing solutions that create
  meaningful business impact.









   Key Responsibilities:









   • Take ownership of complex engineering initiatives,
  leading technical design, implementation, delivery, and
  ongoing operational excellence.




   • Design, build, and maintain scalable software solutions
  using technologies such as C#, .NET Framework, SQL Server,
  React, jQuery, DocumentDB (MongoDB), Azure, and related
  integration platforms.




   • Develop and support modern service architectures,
  including RESTful APIs, GraphQL, modular monoliths,
  microservices, and event- or integration-driven solutions as
  appropriate.




   • Partner closely with Architecture, Product, and DevOps to
  define technical solutions that are scalable, reliable,
  performant, secure, and aligned with platform strategy.




   • Provide technical leadership and guidance through
  solution design, code reviews, mentoring, estimation, and
  hands-on problem solving.




   • Contribute to and improve engineering practices such as
  CI/CD, automated testing, observability, release quality,
  and operational readiness using Azure DevOps and related
  tooling.




   • Apply sound engineering principles and practices such as
  domain-driven design (DDD), test-driven




   development (TDD), vertical slice architecture (VSA), and
  clean modular design where appropriate.




   • Identify and resolve system bottlenecks, reliability
  concerns, and performance issues across applications,
  services, data stores, and integrations.




   • Leverage AI-enabled tools such as Codex, Claude Code, or
  similar technologies to improve engineering efficiency and
  software delivery outcomes.




   • Collaborate effectively across teams and stakeholders to
  drive clear technical decisions, reduce risk, and deliver
  measurable results.













    Requirements






   • Proven experience as a senior or lead software engineer,
  with a track record of owning and delivering complex
  technical initiatives.




   • Strong hands-on experience with C#, .NET Framework, SQL
  Server, React, and modern application development practices.




   • Experience designing and delivering RESTful APIs and
  scalable distributed or modular systems.




   • Strong understanding of CI/CD pipelines, Azure DevOps,
  software quality practices, and reliable production
  delivery.




   • Demonstrated ability to provide technical guidance,
  solution design, and architectural input in partnership with
  Architecture, Product, and DevOps teams.




   • Familiarity with VSA, DDD, TDD, modular monolith
  architecture, microservices, and related engineering
  approaches is strongly preferred.




   • Experience using Codex, Claude Code, or other AI tooling
  within the SDLC is strongly preferred, along with the
  ability to effectively leverage AI as a development tool.




   • Exposure to AI and processing technologies within product
  experiences is a plus




   • Exposure to and familiarity with the legaltech industry
  is a plus.




   • Strong communication, collaboration, problem-solving, and
  technical leadership skills.




   • Bachelor’s degree in Computer Science, Engineering, or a
  related field, or equivalent practical experience.
