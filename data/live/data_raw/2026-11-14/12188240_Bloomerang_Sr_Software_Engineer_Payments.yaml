description: |
  At Bloomerang, we believe change happens on purpose. We
  champion the power and potential of nonprofits, igniting
  next-level impact with the team and technology built for
  purpose. Our powerful giving platform and stellar support
  enable tens of thousands of nonprofits to raise more,
  recruit more, and retain more, fueling maximum impact and
  raising the bar on what’s possible for the nonprofit sector.
  That's why, even as the nonprofit sector sees declines in
  giving, Bloomerang customers raise more year over year.

  We're also in the business of creating thriving employees.
  Join a mission-driven culture built on our core values of
  Simplify, Care and Act. We know our people are the key to
  our success, and we're proud to be home to some of the most
  innovative and skilled individuals in the workforce today.
  Come feel invigorated and unstoppable with us!



  The Role

  As a Senior Software Engineer at Bloomerang, you'll be a
  hands-on engineer and a key driver of technical success on
  your team. You'll design, build, and ship production
  software that helps nonprofits raise the money that powers
  their missions. Agentic AI tools are part of how we build
  every day, across the whole delivery lifecycle, and how we
  work keeps changing as those tools do.

  You'll join Paid in Dreams, the team that owns payments at
  Bloomerang. In payments, reliability and security can't be
  compromised. A bug here can mean a donation that didn't go
  through or money that didn't land where it should. Stripe is
  our primary processor, and the work covers processor
  integrations, webhooks, and the donor-facing experiences
  built on top of them.

  We're looking for a pragmatic engineer who sees the bigger
  picture. You understand how a change ripples across systems,
  products, and the people who use them. You find the real
  problem before reaching for a solution, and you know when
  something needs rigor and when good enough is fine. You
  bring ideas without assuming you have all the answers, and
  you're curious about the customer problem behind the ticket.



   How You'll Show Up

  - Own your work and drive it to done. Treat commitments as
    promises, push through the murky middle, and share bad
    news early.
  - Communicate directly. Ask the question, raise the concern,
    and keep the team in the loop.
  - Use good judgment and welcome feedback. Make sound decisions
    with incomplete information, and treat feedback as useful
    information to act on.
  - Keep learning. Pick up new tools quickly and let go of
    approaches that no longer fit.
  - Think like a product engineer. Connect technical work to
    business goals and to the experience of nonprofits and
    their donors.

  What You Will Do

  - Design, build, test, and ship features and integrations
    across the payments stack, from processor APIs and
    webhooks to the UI. Partner with product, design, and
    support to understand the problem nonprofits and their
    donors face before you build.
  - Use agentic AI tools every day to deliver value faster, and
    help shape the harnesses, guardrails, and conventions that
    keep AI-generated code aligned with our architecture.
  - Keep payment flows secure, reliable, and observable. Debug
    production issues to the root cause, and improve the live
    codebase, including legacy code, step by step with the
    team's agreement instead of through unilateral rewrites.
  - Make the team better. Review code, pair with teammates, and
    share what you know so it doesn't stay siloed. Represent
    payments in cross-team work and bring that context back.

  What You Need to Succeed

  AI Fluency

  - Hands-on experience taking AI-assisted or AI-driven work to
    production, beyond writing prompts, in large, established
    codebases, not just greenfield projects.
  - Enough architectural understanding to codify it into the
    harnesses, instructions, and reviews that keep AI tools
    producing code that fits the system.

  Technical Depth

  - Strong recent experience as a hands-on senior engineer
    shipping and supporting a live production app.
  - A deep understanding of software architecture, which matters
    more to us than any specific language. Our stack includes
    .NET/C#, TypeScript/Node, React, and SQL, and strong
    engineers from similar ecosystems will ramp up quickly.
    This includes:
    - object-oriented design, distributed systems, and event-
      driven architecture
    - asynchronous programming
    - relational databases and ORMs
    - automated testing
    - modern front-end and component architecture, including
      micro-frontends
  - Experience with modern payment processing at scale. That
    means immediate API responses confirmed later by
    asynchronous webhooks, and the failure modes that come
    with them. It also means third-party rate limits, queuing
    and retries, and traffic spikes. Experience with Stripe,
    PayPal, or similar processors.
  - A working knowledge of modern security practices for web and
    payment systems, and the instinct to spot a brittle or
    insecure design before it ships.

  Collaboration

  - You thrive on a tight-knit, highly communicative team that
    talks every day and jumps on quick calls to work through
    problems together.

  Benefits

  Health + Wellness You’ll have access to generous health,
  vision, and dental insurance options as well as
  HealthiestYou, a healthcare service that offers convenient,
  confidential access to quality doctors 24/7, anytime,
  anywhere.

  Time Off You'll get a competitive PTO package that includes
  20 PTO days, 3 flex days, 4 optional volunteer days, 12 paid
  holidays, as well as paid parental leave. More is more!

  401k You'll receive a 401k match to help invest in your
  future.

  Equipment Everything you need to be successful, shipped
  right to your door. You got this. We got you.

  Compensation  The salary range for this position is $114,800
  - $191,400. You may also be eligible for a discretionary
  bonus. Actual compensation within the range will be
  dependent on your skills, experience, qualifications, and
  location, as well as applicable employment laws

  Location This is a permanent, full-time, fully remote
  position (within the U.S. and select Canadian Provinces
  only). Employees living in Indianapolis, IN are welcome to
  work from our company headquarters. We do not offer Visa
  sponsorship or relocation assistance at this time.

  Accommodations Applicants who require accommodations may
  contact careers@bloomerang.com to request an accommodation
  in completing an application.

  Bloomerang is an Equal Opportunity Employer. Individuals
  seeking employment at Bloomerang are considered without
  regard to race, color, religion, national origin, age, sex,
  marital status, ancestry, physical or mental disability,
  veteran status, gender identity, or sexual orientation.

  Bloomerang uses artificial intelligence (AI) tools to help
  find candidates, review and rank applications against job
  requirements, and take interview notes. AI does not make
  hiring decisions. People review every application and every
  AI recommendation, make all rejection decisions, and make
  all final hiring decisions.
