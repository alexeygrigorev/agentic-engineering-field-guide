title: Sr. Manager, Software Engineering
company: Yum! Brands
location: USA
remote: true
work_type: FULL_TIME
company_size: 6,056 Employees
description: |
  We are searching for an experienced Sr. Engineering Manager
  who can own both the technical direction and the people side
  of our engineering teams. In this role, you will lead a team
  of engineers and own delivery of both consumer-facing and
  enterprise operational applications for the restaurant
  industry. Our platform runs globally across Taco Bell, KFC
  and Pizza Hut using peer-to-peer replication, network
  service discovery, and embedded web servers to keep
  restaurants running even when the network doesn’t. As a Sr.
  Engineering Manager, you will also own strategic planning
  for your area of the platform, manage delivery timelines and
  resource tradeoffs, provide input into long-term engineering
  decisions, and guide technical activities to ensure our
  users’ and brands’ needs are met.

  Responsibilities

  People Management and Leadership:

  - Lead your team of 4-7 software engineers. Set clear
    priorities, goals and success criteria for the team.
  - Own team capacity planning, hiring inputs and resource
    allocation across your workstreams.
  - Day-to-day leadership, coaching, team recruitment, and
    people development.
  - Mentor other members of the team.
  - Lead agile development process that adds incremental value
    to the platform with each iteration.

  Problem Solving:



  - Own engineering execution for multiple international market
    launches, including feature development, market
    localization, rollout readiness, issue resolution and
    transition into a scalable support model.
  - Own the engineering plan and budget/resource allocation for
    your workstreams, including capacity planning, sequencing,
    vendor needs, and clear trade-off proposals when demand
    exceeds capacity.
  - Shape the long-term architecture and engineering direction
    for the Byte platform, balancing near-term market needs
    with scalability, reliability, supportability, security
    and cost of ownership.
  - Set long-term guidance and direction for AI tool usage on
    the team, using it to improve productivity across
    development, testing, documentation and support while
    keeping clear expectations for quality, security and
    engineer ownership.
  - Own realistic project plans and make sure they are executed
    within approved budget, scope, resource and quality
    constraints; raise tradeoffs early when market
    commitments, dependencies or funding assumptions change.
  - Solve both ambiguous and complex problems with real risk,
    working alongside cross-functional teams.

  Communication and Influence:

  - Frequently interact with Senior Leadership/exec teams, both
    within Byte and within brands/markets, to align on rollout
    strategy, roadmap tradeoffs, resourcing needs and delivery
    risks.
  - Communicate complex topics/problems in an articulate manner.
  - Collaborate with product management, other engineering
    teams, quality assurance, operations, and other functions
    to develop the right solutions.
  - Help build the kind of team culture where engineers are
    excited to show up to work.

  Qualifications

  You should have:

  - BA/BS or higher in Computer Science or a related STEM field.
  - 10+ years hands-on experience building robust mobile/web
    software.
  - 3+ years managing engineering teams, including ownership of
    strategic planning, capacity planning and delivery
    tradeoffs for complex engineering programs.
  - AI dev tooling embedded in your day-to-day, not just
    experimenting, with enough judgment to guide how a team
    uses it safely and effectively.
  - Strong ability to build systems that solve complex problems.

  We prefer:

  - Exposure to distributed systems and peer-to-peer
    architecture.
  - Restaurant tech, retail POS, or any in-store operational
    system background.
  - Kotlin and Android experience in production.
  - Excellent communication and interpersonal skills.

  Some of our perks:

  - 4 weeks of vacation plus holidays.
  - 5 sick days.
  - 2 paid volunteer days.
  - Company-wide recharge holidays.
  - 401(k) matching.
  - Medical, dental, vision.
  - Life insurance.
  - Half-day Fridays.
  - Generous parental leave.
  - A world-famous recognition culture.



  Salary Range: $169,900 - $212,000 annually + bonus
  eligibility. This is the expected salary range for this
  position. Ultimately, in determining pay, we'll consider the
  successful candidate’s location, experience, and other job-
  related factors.

  Benefits: Employees (and their eligible family members) may
  enroll in the following types of insurance coverage:
  medical, dental, vision, legal, and accidental death and
  dismemberment, as well as FSA/HSA (depending on enrolled
  medical plan). Yum! also provides short-term disability,
  long-term disability, and life insurance. Employees may
  enroll in our 401(k) plan. Yum! provides 4 weeks of
  vacation, paid sick leave, 10 paid holidays, a floating day
  off and 2 paid days for volunteer time each calendar year.
