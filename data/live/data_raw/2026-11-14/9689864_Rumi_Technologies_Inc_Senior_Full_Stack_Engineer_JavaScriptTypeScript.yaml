description: |
  About Rumi

  Rumi is building a more transparent and authentic writing
  and learning environment for the AI era. We help
  institutions guide AI use at the assignment level,
  supporting learning-focused workflows instead of blanket
  enforcement.

  The role

  Join our engineering team to architect a real-time,
  transparent writing environment. You’ll build end-to-end
  features—from high-performance frontends to robust backend
  services—delivering a seamless experience for classrooms at
  scale.

  What you’ll do

  - Ship full-stack product features in a JS/TS stack (React +
    Node.js)
  - Design APIs, data models, and backend services that are
    reliable and scalable
  - Build responsive, fast UI experiences that feel great in
    real-time workflows
  - Improve system observability, performance, and reliability
    (metrics, tracing, on-call as needed)
  - Collaborate with product/design to turn educator needs into
    usable features

  What we’re looking for

  - 5+ years professional experience in JS/TS (Node.js + React)
  - Strong product sense: you care about UX, adoption, and
    iterative shipping
  - Experience building reliable systems (testing, CI/CD,
    monitoring, performance)
  - Ability to work across frontend and backend without handoffs
  - Clear communication and comfort making technical tradeoffs

  Nice to have

  - Cloud experience with GCP and/or AWS (deployments, managed
    services, observability)
  - Postgres, Redis, queues, or event-driven architectures
  - Work in education, compliance/privacy-adjacent environments,
    or B2B SaaS

  Benefits

  - Competitive salary
  - Comprehensive health insurance
  - 15 days PTO annually
  - Flexible working hours
  - Redwood City office (in-person preferred; remote possible)
  - Professional development support
