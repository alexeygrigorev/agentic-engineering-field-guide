  We're Here to Help

  We’re happy to answer any questions you may have about the
  position or our hiring process - please reach out at
  careers@thefarmersdog.com.

  We commit to building a competitive compensation package and
  company environment for all individuals to thrive. We
  believe in competitive base compensation rooted in location
  specific market data and performance along with equity
  ownership in the company that allows every team member to
  build their personal wealth as the company grows, just as
  much as we believe in fostering a culture that supports our
  team members personally, professionally, and holistically.
  For this role the anticipated hiring base compensation range
  is USD annual and the compensation offered will include a
  robust market competitive package of base and equity. In
  addition to your base compensation offer you will also
  receive equity ownership in the company. More information
  about the value of this equity will be shared at the time of
  offer. This range is representative of NYC Market Data if
  you are applying to this role outside of the NYC area the
  range may change.

  NYC Pay Range

  $207,000—$250,000 USD
