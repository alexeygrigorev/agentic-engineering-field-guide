description: |
  Put your engineering skills to work on products that matter.
  You will collaborate with an agile team to design, build,
  and improve secure, scalable technology. This role is built
  for growth, giving you hands-on experience across the
  software development life cycle while strengthening your
  development and troubleshooting skills. You will learn from
  peers, use modern tooling, and contribute to high-quality
  delivery. If you enjoy solving problems and continuously
  improving how software is built, this is a strong next step.

  As a Software Engineer II at JPMorgan Chase within the FICC
  eTrading tech team, you will design, develop, and
  troubleshoot software components that support secure,
  stable, and scalable technology products. You will
  contribute as an emerging member of an agile team,
  delivering software solutions across multiple components
  within a product, application, or system. You will write
  high-quality code, apply secure engineering practices, and
  learn through collaboration, feedback, and continuous
  improvement. You will consider upstream and downstream
  impacts as you build and enhance solutions. You will also
  use enterprise-authorized tooling to improve productivity
  while validating outputs through testing and peer review.

  Job responsibilities

  - Design, build, test, and deliver high-quality software
    solutions for electronic trading systems, from
    requirements through production rollout
  - Contribute to architecture decisions, ensuring solutions are
    secure, scalable, and resilient
  - Build and maintain low-latency, high-throughput services
    with a strong focus on performance, reliability, and
    correctness
  - Integrate services with internal and external systems,
    ensuring well-defined interfaces, robust error handling,
    and operational readiness
  - Own production outcomes by participating in on-call/support,
    triaging incidents, performing root-cause analysis, and
    driving permanent fixes
  - Improve engineering standards through code reviews,
    automated testing, CI/CD, observability, and continuous
    refactoring to strengthen system health
  - Contribute to an inclusive team culture and actively engage
    in communities of practice to evaluate and adopt relevant
    emerging technologies

  Required qualifications, capabilities, and skills

  - Strong OOP/design patterns understanding and clean code
    practices
  - Strong coding skills in Java and Spring with solid
    fundamentals
  - Proven, hands-on experience across system design,
    application development, testing, and production support
  - Experience with FIX protocol

  Preferred qualifications, capabilities, and skills

  - Knowledge of fixed income products
  - Exposure to agentic AI

