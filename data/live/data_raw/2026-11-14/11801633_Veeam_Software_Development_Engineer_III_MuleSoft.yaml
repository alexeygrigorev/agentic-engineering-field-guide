  #LI-REMOTE #LI-JC2About the Role

  Veeam is the Data and AI Trust Company, specializing in
  helping organizations ensure their data and AI are fully
  understood, secured, and resilient to enable the
  acceleration of safe AI at scale. As the market leader in
  both data resilience and data security posture management,
  Veeam is built for the convergence of identity, data,
  security, and AI risk. Headquartered in Seattle with offices
  in more than 30 countries, Veeam protects over 550,000
  customers worldwide, who trust Veeam to keep their
  businesses running. Join us as we go fearlessly forward
  together, growing, learning, and making a real impact for
  some of the world’s biggest brands.

  Software Development Engineer III, MuleSoft is crucial role
  in the Integrations team. In this role, you will be
  responsible for designing, developing, and maintaining
  integrations using MuleSoft's Anypoint Platform. This
  position offers an excellent opportunity to work with
  cutting-edge technology and  contribute to the successful
  delivery of enterprise-level integration solutions. You must
  have a strong background in designing and developing
  integrations and APIs using MuleSoft Anypoint Platform and
  CloudHub adhering to best practices.

  The team is looking for someone based on the east coast or
  who is willing to work Eastern hours to align with the team

  What You’ll Do

  - Design and develop MuleSoft integrations, APIs, and
    connectors using Anypoint Studio and Anypoint Platform
  - Implement integration solutions, ensuring scalability,
    reliability, and performance optimization
  - Troubleshoot integration issues, analyze error logs, and
    implement appropriate solutions
  - Perform unit testing and participate in code reviews to
    ensure high-quality code and adherence to best practices
  - Collaborate with the testing team to develop and execute
    integration test cases.
  - Assist in the deployment of MuleSoft applications and
    configurations to various environments.
  - Document technical specifications, system processes, and
    integration flows.
  - Stay updated with MuleSoft product releases, new features,
    and industry best practices.
  - Provide technical guidance and mentorship to junior
    developers as needed.

  What You’ll Bring

  - Proven experience as a MuleSoft Developer, working with
    MuleSoft's Anypoint Platform
  - Deep understanding of the Platform, including Mule ESB, API
    Manager, Mule runtime, Anypoint Studio, and CloudHub 2.0
  - Thorough understanding of RESTful and SOAP web services
  - Experience building integration with ERP systems, CRM
    systems, databases, cloud platforms, and other third-party
    applications
  - Knowledge of security protocols, encryption, OAuth, SSL, and
    possess experience in implementing governance policies for
    effective API management
  - Proficiency with SQL and its variations among databases
  - Familiarity with Salesforce (CRM, CPQ) and its underlying
    object model, Developer Console and SOQL
  - Familiarity with continuous integration and continuous
    deployment (CI/CD) tools and processes
  - Display excellent problem-solving skills and the ability to
    perform under pressure
  - Strong communication and collaboration skills, with the
    ability to work effectively in a distributed team
    environment
  - Proficient multitasking, prioritization, and time management
    skills in demanding environments
  - Experience with Java SpringBoot

  Qualifications:

  - Bachelor's degree in computer science, information systems,
    or a related field. In lieu of a degree, 7 years of
    relevant experience within the integration domain may
    suffice
  - 5 - 7 years of overall experience in software development,
    with 2-5 years of experience with MuleSoft Anypoint
    platform
  - MuleSoft certification (MuleSoft Certified Developer) is a
    plus

  What you'll get

  - Unlimited paid time off, 12 paid holidays including 4 global
    VeeaMe Days for self-care and 24 paid volunteer hours
    annually through Veeam Cares
  - Paid parental leave: 8 weeks for all parents, 16 weeks for
    birthing parents
  - Medical, dental, and vision coverage starting on your first
    day
  - Mental health support, therapy sessions, and digital
    wellness tools via our Employee Assistance Program
  - 401(k) retirement plan with company matching contributions
  - Fertility, adoption, and surrogacy support through Maven,
    plus paid volunteer time
  - AirVet: 24/7 virtual veterinary care at no cost
  - Legal services, identity protection, and supplemental health
    insurance options
  - Tax-advantaged spending accounts for healthcare, dependent
    care, and commuting
  - Opportunities to learn and grow through on-demand libraries
    (LinkedIn Learning, O’Reilly), mentoring, workshops, and
    learning events like our annual Global Day of Learning

