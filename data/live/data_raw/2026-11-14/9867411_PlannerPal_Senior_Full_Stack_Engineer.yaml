  application development with a strong background in devops
  or enterprise-level agentic engineering. You will focus on:
  * Designing and building key features of our solutions *
  Development and design of CI/CD pipelines, including
  Infrastructure as a Code and the enablement of developers *
  Building and deploying AI agents to production. * Ensure
  that coding and testing standards are upheld This role
  offers the opportunity to work closely with the founders at
  a defining stage in our growth. Tasks Responsibilities;
  _Solution design;_ * Own the end-to-end solution design for
  new features within a defined architecture framework * Make
  pragmatic decisions about trade-offs (scope, performance,
  scalability, security) in a fast-moving environment. _Hands-
  on development;_ * Take ownership of complex or high-impact
  pieces of work, especially where the architecture,
  integrations or performance considerations are non-trivial.
  * Design, build and optimise the journeys of our service
  using our tech stack: * Backend: Python * Frontend: React +
  Flutter * Data / Infra: Postgres, AWS ( S3, ECS etc.) *
  Write high-quality, testable code and contribute to our
  continuous integration and deployment pipelines.
