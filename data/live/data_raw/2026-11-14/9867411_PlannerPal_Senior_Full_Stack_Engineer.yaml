  deliver better client outcomes by automating meeting notes,
  documentation, and CRM updates. Trusted by hundreds of
  advisory firms, PlannerPal is reshaping the advice industry
  – improving efficiency, compliance, and data quality across
  the client journey. The company recently signed enterprise
  contracts with both a top-10 and a top-5 UK wealth
  management firm, further establishing its position as a key
  technology partner in the sector. Recognised by the
  Financial Times Adviser as one of the Top 3 AI tools for
  financial advisers, PlannerPal is a UK-based wealth tech
  company backed by venture capital investors, with deep
  experience in financial services, technology, and AI. The
  platform is scaling rapidly through numerous industry
  technology partnerships, including a strategic AI
  partnership with Iress Xplan. The Role; We’re now looking
