description: |
  At Talkspace, we are committed to fostering a diverse,
  equitable, inclusive, and belonging-centered workplace where
  everyone can thrive while making a difference in mental
  health. Want to help over two million people receive quality
  mental healthcare? Come join our mission of getting therapy
  in the hands of everyone!

  We are looking for an experienced Senior Software Engineer
  to join our team. This individual will play a key role in
  designing, building, and scaling the core applications and
  services that power our platform. The ideal candidate is a
  hands-on full-stack engineer looking to build 0 to 1. To
  work at Talkspace, you need to be as passionate as we are
  about our work, and excited to partner with us on delivering
  quality mental healthcare. As a senior member of the team,
  you'll partner closely with Product, Design, and Engineering
  stakeholders to deliver high-quality solutions while helping
  shape technical standards and best practices across the
  organization.

  This is a remote position. Candidates must be based in
  Eastern Time. Talkspace Headquarters is located in NYC.

  What You’ll Do

  - Technical Skills
    - Writes correct and consistent code using both knowledge and
      expertise (backend, frontend, and devops).
    - Develops and maintains full-stack web applications using
      React on the frontend and Node.js on the backend.
    - Designs, builds, and integrates APIs and backend services to
      support product functionality and system integrations.
    - Reviews code efficiently and give feedback on it.
    - Understands industry standards and consistently keeps
      informed of upcoming trends.
  - Communication and Leadership
    - Communicates and justifies technical decisions via design
      docs, tech talks and documentation.
    - Mentors Junior Engineers via Pairing, Feedback, PR Review
      and 1:1's.
    - Communicates effectively cross-functionally to the Product
      team, his manager, and business if needed.
    - Proactively identifies problems with requirements for and
      his own projects and the engineers they support and
      communicates it to stakeholders.
  - Project Management
    - Delivers complex product to QA that is fully developed and
      bug-free.
    - Takes initiative to fix bugs, open tickets and improve code
      when needed
    - Persistent in the face of roadblocks, knows when to pull
      others to solve the problem if needed.
  - Impact
    - End-to-end responsibility for getting production-ready
      features to the finish line.
    - Identifies problems and potential risks in his code and
      others.
    - Helps keep consistency and quality in the code base with PR
      overview and feedback.
    - Helps enforce proper QA for all products that he is involved
      in.
  - Performs other related duties as assigned.

  About You

  - Bachelor's degree or higher in Computer Science, Technology,
    Engineering or Math.
  - 5+ years of professional experience developing software
  - 5+ years of professional experience working in both react
    and node.js

  Benefits

  - Comprehensive Medical, Dental and Vision plans
  - Pre-tax benefits: HSA/ FSA
  - 401k Retirement Savings Program with matching up to 3%
  - Voluntary benefits including disability, basic life or pet
    insurance, etc.
  - Monthly Wellness Stipend to promote mental and physical
    self-care
  - Flexible PTO and Remote First Environment
  - Regular team events, including Wellness Workshops and Team
    Building Events
  - Free access to Talkspace products for you and one household
    member, as well as access to a friends and family
    discount!

  Compensation

  At Talkspace, we believe that pay transparency during the
  interview process is a critical part of diversity, equity,
  and inclusion. Our salary bands are based on internal and
  external compensation benchmarks, which we regularly
  evaluate to ensure we pay competitively.

  The base salary range for this role is between $146,000 -
  $180,000. Within the salary bands, leveling corresponds to
  each candidate’s relevant experience, skills as assessed
  during the interview process, education, and applicable
  certifications.

  Why Talkspace?

  Talkspace is the world’s leading online therapy company,
  serving over 2 million users looking to begin their wellness
  journey through tele-health. According to the World Health
  Organization, close to 1 billion people worldwide live with
  a mental disorder, and on average more than 75% with mental,
  neurological, and substance use disorders receive no
  treatment for their condition at all. Additionally, one-
  third of the world’s population – 2 billion people – live in
  countries that spend less than 1% of their health budgets on
  mental health. Therapy is an universal need and it's our
  mission here to change the world by cultivating an
  intentional space for people to feel supported through
  quality care that is simple and accessible.

  Combining our passion for innovation along with our desire
  to help others overcome the stigma behind “getting help,” we
  are transforming the way patients find the right care
  provider, making an otherwise impossible feat easily
  conquerable. Our network of licensed, accredited, and board-
  certified clinicians are increasing access to mental health
  for our members through a myriad of high quality therapy
  services: anytime and for a fraction of the price. Dedicated
  to our mission, we are looking for candidates that want to
  bring their talents into a diverse  “for purpose” space. If
  you’re equally as passionate about making quality mental
  healthcare accessible to all then Talkspace is the right
  place for you!

  EQUAL OPPORTUNITY EMPLOYER

  Talkspace welcomes and celebrates talent from all
  backgrounds, perspectives, and walks of life to foster an
  innovative and diverse workforce. We encourage you to apply,
  even if you don’t meet every qualification or if your path
  has been nontraditional — such as not completing a formal
  degree program, taking a career break, or having a prior
  criminal record — if you believe you could make a great
  addition to this team. Come as you are and learn about the
  exciting opportunities on our team.

  Individuals seeking employment at Talkspace are considered
  without regard to race, color, religious creed, sex,
  national origin, citizenship status, age, physical or mental
  disability, sexual orientation, marital, parental, veteran
  or military status, unfavorable military discharge, or any
  other status protected by applicable federal, state or local
  law.

  How do we define Diversity, Equity, Inclusion, and Belonging
  at Talkspace?

  Diversity

  Diversity encompasses the unique attributes of our employees
  as individuals. We value and embrace the richness arising
  from their varied backgrounds, perspectives, and
  experiences, which include, but are not limited to, age,
  ability, ethnicity, gender, race, and cultural background.

  Equity

  Equity refers to a fair and impartial workplace, aiming to
  ensure equal growth and advancement opportunities for all
  employees. This involves amplifying underrepresented voices,
  addressing unconscious biases, and providing inclusive,
  culturally competent mental health care.

  Inclusion

  Inclusion signifies the practice of granting equal access to
  opportunities and resources for all employees, particularly
  those who might otherwise be excluded or marginalized. It
  ensures that everyone feels a sense of belonging, value,
  support, and respect as an individual.

  Belonging

  Belonging reflects the affinity and positive relationships
  that develop among employees from diverse backgrounds when
  businesses actively promote diversity, equity, and inclusion
  in the workplace.
