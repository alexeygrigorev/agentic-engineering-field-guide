description: |
  Description The Role : We're looking for a seasoned Security
  Software Engineer to join our IAM team (Identity Access
  Management) to help develop, architect and advance our suite
  of applications and services. You will contribute primarily
  to developing novel IAM technology for GM while also
  advancing and optimizing our SaaS services. Serve as an
  internal subject matter expert on architecture,
  implementation, management, and industry best practices for
  identity strategy. What You'll Do :

  - Design and develop security-focused software solutions,
    tools, and automation frameworks
  - Integrate security into CI/CD pipelines and cloud-native
    environments
  - Collaborate with infrastructure and application teams to
    embed security into system architecture
  - Conduct code reviews and threat modeling to identify and
    remediate vulnerabilities
  - Build and maintain systems for monitoring, logging, and
    alerting on security events
  - Develop and maintain APIs and microservices that support
    security operations
  - Participate in incident response and forensic investigations
    as needed
  - Stay current with emerging threats, vulnerabilities, and
    security technologies


   Your Skills & Abilities (Required Qualifications):

  - Bachelor's degree in Computer Science, Cybersecurity, or
    related field (or equivalent experience).
  - 9+ years of experience in the administration, configuration,
    and support of IAM products including: EntraID, SailPoint
    or other similar products.
  - Advanced proficiency in one or more programming languages
    (e.g., Python, Go, Java, C++).
  - Experience with cloud platforms (AWS, Azure, GCP) and
    containerization (Docker, Kubernetes)
  - Strong understanding of authentication, authorization,
    encryption, and secure coding practices.
  - Experience working with security and audit teams
  - Ability to self-manage time and maintain an excellent work
    ethic in an Agile environment
  - Able to convey identity requirements and concepts across
    different levels of users
  - Strong verbal and written communication skills


   What Will Give You A Competitive Edge (Preferred
  Qualifications):

  - Exposure to contractor heavy and partner collaboration
    driving identity systems
  - Project experience modeling and deploying external identity
    architectures
  - Experience working with Databricks, Microsoft, or Google
    products
  - Experience with CASB security integrations
  - Experience with front-end application development


