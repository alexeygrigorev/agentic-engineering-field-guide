description: |
  Argon · New York City · In person

  We are opportunistically looking for exceptional
  senior/staff full-stack engineers who can turn ambiguous
  customer needs into useful, reliable software. You’ll work
  closely with the founders, product partners, and domain
  experts, owning features from scoping and design through
  implementation, launch, and iteration.

  What you’ll do

  - Deliver customer-facing features end to end across frontend,
    backend services, APIs, and integrations.
  - Improve research, analysis, and writing workflows, including
    evidence presentation, citations, and exports.
  - Make practical product and architecture decisions, break
    work into useful releases, and follow through on quality
    and customer adoption.
  - Build appropriate tests, instrumentation, and operational
    support for the features you ship.

  What you bring

  - A record of independently shipping substantial full-stack
    products or features used by real customers.
  - Strong frontend and backend fundamentals, product judgment,
    and attention to usability and correctness.
  - Ability to navigate unfamiliar systems, work with domain
    experts, and finish projects with limited oversight.
  - Experience with TypeScript, modern frontend development,
    APIs, and SQL; Python, AI product work, and life-sciences
    experience are useful additions.
