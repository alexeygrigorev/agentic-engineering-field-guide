title: Mid-Level Software Engineer (Python) - RegTech - UK
company: Suade Labs
location: London, GBR
work_type: FULL_TIME
company_size: 87 Employees
description: |
  Suade is a market-leading regtech SaaS company with cutting-
  edge technology that automates regulatory reporting,
  compliance and financial risk solutions for financial
  institutions. Our technology leads the market on most
  metrics, and we are supported by an unprecedented need for
  new technology to solve complex and growing regulatory
  burdens. We serve Tier 1 banks across Europe, North America,
  and Asia.

  The Midlevel Software Engineer role is for you if you are an
  experienced software engineer with a love of systemising and
  codifying real-world problems. If you are interested in
  learning about finance, are mathematically minded, and enjoy
  working with non-technical teams to turn their knowledge
  into working code, we would like to talk to you.

  Salary: £50,000 to £65,000 based on experience

  Please note:

  - We are unable to offer visa sponsorship for this role.
    Candidates who need visa sponsorship now or will need it
    in the future will not be considered.
  - This role is based in London. Suade has a flexible working
    policy, but you will need to be available to come into the
    London office when required. Some travel may be required.

  Suade is an equal opportunity employer. We are building a
  world-class team, and we know we need a diverse mix of
  talented people doing their best work.

  Requirements

  Responsibilities

  - As part of the RegTech team, you will use your expertise in
    software engineering to translate business requirements
    into technical specifications and lead the architecture,
    development and expansion of our regulatory portfolio. You
    will work closely with our Project Managers and Business
    Analysts, and you will build upon your experience to:
  - Contribute to the delivery of our product roadmap, shipping
    code that our customers may be using to solve their
    regulatory problems the same day.
  - Grow your coding skills and domain knowledge, and become
    responsible for part of our portfolio, becoming the
    internal reference within the team.
  - Collaborate with other engineers who are as passionate as
    you are about stopping the next financial crisis.
  - Contribute new ideas to the architecture of the platform and
    see some of those ideas implemented.
  - Understand the main problems that we are solving with our
    product. Participate in internal reviews and design
    sessions to keep our product up to date.
  - Drive the adoption and use of best practices like TDD and
    code analysis
  - Be aware of and consider non-functional requirements like
    performance, security, maintainability.

  Skills and Experience

  - 3 - 5 years’ relevant experience working with Python

  - Practical experience working collaboratively using version
    control systems like Git and platforms like GitHub or
    GitLab

  - Experience working with non-technical stakeholders, business
    requirements, and ambiguity

  - Experience with unit tests, automated testing and knowledge
    of best practices

  - Exposure to large codebases involving multiple authors,
    features and timelines

  Desirable

  - Comfortable using a Unix-based operating system (e.g.
    Ubuntu)

  - Experience working in agile frameworks like Kanban or Scrum

  - Experience improving or refactoring existing code as
    requirements change

  - A Bachelor’s degree in Computer Science, Mathematics,
    Physics or Engineering

  - Personal, academic, or internship projects involving
    scripting, automation, or data handling

  Benefits

  - 25 days' holiday + public holidays
  - Flexible holiday: choose when you take your holidays by
    swapping bank holidays if you would like
  - Additional tenure-based holiday: an extra day of annual
    leave for every year of service after 2 years
  - Flexible working hours and remote working (subject to
    conditions)
  - Monthly social events
  - Annual ski trip and residential offsites
  - £500 ‘work from home’ set up budget when you join
  - £500 personal training & development budget per year
  - Enhanced maternity and paternity leave (subject to
    conditions)
  - Company pension (Nest)
  - Perkbox benefits plan
