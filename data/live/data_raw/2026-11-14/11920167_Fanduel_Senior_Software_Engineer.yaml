description: |
  THE POSITION

  Our roster has an opening with your name on it

  We are looking for a full stack Senior Software Engineer to
  lead the design, development, and delivery of high-scale
  applications. In this role, you will autonomously architect
  resilient systems, establish modern engineering standards,
  and collaborate closely with cross-functional partners to
  drive key technical and product initiatives across the
  organization. You'll own the frontend architecture of our
  web and mobile products end to end, while working
  comfortably across the stack to build and extend the
  services that power them. This is a senior role: you'll set
  technical direction, raise the quality bar, and mentor other
  engineers.

  In addition to the specific responsibilities outlined above,
  employees may be required to perform other such duties as
  assigned by the Company. This ensures operational
  flexibility and allows the Company to meet evolving business
  needs.

  THE GAME PLAN

   Everyone on our team has a part to play

  - Autonomously drive sustained business impact across team
    goals, product capabilities, and technical systems.
  - Take ownership of semi-annual and annual technical
    objectives, consistently delivering high-quality, mission-
    critical systems on schedule.
  - Define and shape the long-term architectural vision for core
    full stack and microservices platforms.
  - Architect technical solutions for complex, ambiguous
    engineering challenges, making sound trade-offs between
    immediate velocity and long-term system health.
  - Lead cross-team technical initiatives to extend software
    standards and platform impact across the engineering
    organization.
  - Mentor engineers, influence organizational design standards,
    and champion best engineering and operational practices.
  - Proactively manage technical dependencies and align
    architectural strategy across external engineering teams.
  - Partner with product and business stakeholders to resolve
    ambiguity, clarify requirements, and address technical
    risks early in the lifecycle.
  - Leverage deep domain knowledge to guide technology choices
    independently in fast-paced, high-scale environments.
  - Streamline complex application architecture by focusing on
    core scalability, efficiency, and critical business
    outcomes.
  - Architect and build applications that are resilient, secure,
    and maintainable under high traffic loads.
  - Develop high-performance front-end interfaces and back-end
    microservices utilizing modern frameworks and design
    patterns.
  - Design, build, and optimize high-throughput GraphQL APIs to
    power seamless client applications and backend
    integrations.
  - Lead rigorous code reviews, establish testing strategies,
    and enforce engineering excellence across the software
    development lifecycle.

  THE STATS

  What we’re looking for in our next teammate

  - Degree in Computer Science or a related field, or equivalent
    practical experience, with 5+ years building and shipping
    production software.
  - Deep expertise in modern web frontend architecture with
    TypeScript, JavaScript (ES6+), and React — including
    component design, state management, and hooks.
  - Mobile development with React Native, plus readiness to work
    natively: we're migrating our mobile apps to native
    (Swift/iOS and Kotlin/Android) with the help of AI
    tooling, so you're either comfortable in native mobile or
    a strong engineer eager to pick it up fast. Existing Swift
    or Kotlin experience is a plus.
  - Strong command of HTML5, CSS3, responsive design, and cross-
    browser/cross-device compatibility across web and mobile.
  - Proven track record of frontend performance optimization:
    code splitting, lazy loading, bundle/asset optimization,
    rendering performance, and Core Web Vitals.
  - Test-first mindset with hands-on frontend testing experience
    (e.g., Jest, React Testing Library) and a commitment to
    code quality, maintainability, and observability.
  - Working knowledge of backend services in Java and Spring
    Boot — enough to build and extend APIs and collaborate
    closely with backend teams.
  - Experience consuming and integrating APIs on the client,
    including GraphQL.
  - Solid grasp of software design patterns and architectural
    best practices for reliable, scalable, maintainable
    systems.
  - Hands-on use of AI development tools (AI coding assistants,
    agentic IDEs, LLM-based testing or review tools) in real
    projects.
  - Strong communication and cross-functional collaboration
    skills.
  - Proven technical leadership: mentoring engineers, setting
    technical direction, and raising engineering standards
    across a team.

  Preferred Skills

  - Experience with design systems, reusable component
    libraries, and accessibility (WCAG) best practices.
  - Familiarity with relational databases, messaging/streaming
    concepts (e.g., Kafka), and GraphQL federation (e.g.,
    Cosmo).
  - Experience with CI/CD pipelines and build tooling (e.g.,
    Gradle, Buildkite).
  - Cloud infrastructure (preferably AWS), containerization
    (Docker), and orchestration (Kubernetes); exposure to Helm
    and Terraform a plus.

  ABOUT FANDUEL FanDuel Group is the premier mobile gaming
  company in the United States and Canada. FanDuel Group
  consists of a portfolio of leading brands across mobile
  wagering including: America’s #1 Sportsbook, FanDuel
  Sportsbook; its leading iGaming platform, FanDuel Casino;
  the industry’s unquestioned leader in horse racing and
  advance-deposit wagering, FanDuel Racing; and its daily
  fantasy sports product. In addition, FanDuel Group operates
  FanDuel TV, its broadly distributed linear cable television
  network and FanDuel TV+, its leading direct-to-consumer OTT
  platform. FanDuel Group has a presence across all 50 states,
  Canada, and Puerto Rico. The company is based in New York
  with US offices in Los Angeles, Atlanta, and Jersey City, as
  well as global offices in Canada and Scotland. The company’s
  affiliates have offices worldwide, including in Ireland,
  Portugal, Romania, and Australia. FanDuel Group is a
  subsidiary of Flutter Entertainment, the world's largest
  sports betting and gaming operator with a portfolio of
  globally recognized brands and traded on the New York Stock
  Exchange (NYSE: FLUT).

  PLAYER BENEFITS

  We treat our team right

  We offer amazing benefits above and beyond the basics. We
  have an array of health plans to choose from (some as low as
  $0 per paycheck) that include programs for fertility and
  family planning, mental health support, and fitness
  benefits. We offer generous paid time off (PTO & sick
  leave), annual bonus and long-term incentive opportunities
  (based on performance), 401k with up to a 5% match, commuter
  benefits, pet insurance, and more - check out all our
  benefits here: FanDuel Total Rewards. *Benefits differ
  across location, role, and level. FanDuel is an equal
  opportunities employer and we believe, as one of our
  principles states, “We are One Team!”. As such, we are
  committed to equal employment opportunity regardless of
  race, color, ethnicity, ancestry, religion, creed, sex,
  national origin, sexual orientation, age, citizenship
  status, marital status, disability, gender identity, gender
  expression, veteran status, or any other characteristic
  protected by state, local or federal law. We believe FanDuel
  is strongest and best able to compete if all employees feel
  valued, respected, and included. FanDuel is committed to
  providing reasonable accommodations for qualified
  individuals with disabilities. If you have a disability and
  need a workplace accommodation or adjustment during the
  application and hiring process, including support for the
  interview or onboarding process, please email
  Benefits@fanduel.com. The applicable salary range for this
  position is $138,000 - $173,000 USD, which is dependent on a
  variety of factors including relevant experience, location,
  business needs and market demand. This role may offer the
  following benefits: medical, vision, and dental insurance;
  life insurance; disability insurance; a 401(k) matching
  program; among other employee benefits. This role may also
  be eligible for short-term or long-term incentive
  compensation, including, but not limited to, cash bonuses
  and stock program participation. This role includes paid
  personal time off and 14 paid company holidays. FanDuel
  offers paid sick time in accordance with all applicable
  state and federal laws. It is unlawful in Massachusetts to
  require or administer a lie detector test as a condition of
  employment or continued employment. An employer who violates
  this law shall be subject to criminal penalties and civil
  liability.





