  The Role

  NewRocket is a global team made up of ServiceNow
  professionals who help our customers run and grow their
  ServiceNow environments.  We are hiring a ServiceNow Senior
  Software Engineer with SAM/HAM experience. The Senior
  Software Engineer is responsible for leading, coaching and
  mentoring a team of Software Engineers who provide the
  development of project professional services for customers.
  The Senior Software Engineer will implement and develop
  customizations based on functional and technical
  requirements using leading practices and internal code
  standards on large-scale more complex professional services
  projects.

  We will provide support and guidance to get you up to speed
  on some of the most amazing projects!  We provide official
  ServiceNow training so you can achieve multiple
  certifications. We will set expectations for what success
  looks like. Then we will allow you use your skills and
  experience to come up with innovative solutions to achieve
  customer goals.

  We are #GoingBeyond Come join our crew!

  Key Responsibilities:

  - Perform advanced troubleshooting and root cause analysis on
    ServiceNow platform issues.
  - Troubleshoot and resolve issues related to ITSM, HAM, SAM
    integrations, portal and other ServiceNow
    modules(optional), including
    HRSD/SPM/SAM/CMDB/IRM/SecOps/BCM
  - Support and maintain ServiceNow modules.
  - Support and maintain integrations between ServiceNow and
    external systems.
  - Collaborate with stakeholders & end users to understand
    requirements and deliver effective ServiceNow solutions.
  - Participate in platform upgrades, clone, patching, and
    performance optimization initiatives.
  - Ensure adherence to best practices in ServiceNow development
    and configuration.
  - Document technical solutions, workflows, and issue
    resolutions.
  - Perform deployment.Required Certifications:
  - Certified System Administrator(CSA)
  - Certified Application Developer(CAD) / CIS - ITSM

