description: |
  Role: Engineering Manager (Platforms)

  Reports to: VP of Engineering

  Direct Reports: Up to 8 Engineers

  Full-time

  Remote (Must be UK based)

  Kooth is a fast growing business with a social purpose.
  Listed on the London Stock Exchange (LSE:KOO), our mission
  is to provide welcoming and effective digital mental health
  support to the nation.

  At Kooth, our mission is to create welcoming, accessible
  spaces for personalized digital mental health care that
  empowers young people to thrive. Grounded in an early-
  intervention model, we help youth aged 13–25 build
  resilience, access timely support, and lead fulfilling
  lives. We are more than a digital service — we are a
  movement for inclusive, evidence-informed mental health
  care.

  Our culture is rooted in our values: Alongside You,
  Flexible, Compassionate, Committed, and Safe. These guide
  everything we do - how we show up for young people, how we
  collaborate as a team, and how we build solutions that meet
  communities where they are. With Kooth, you’ll be part of
  something bigger than yourself: meaningful work with
  measurable impact.

  Role Purpose:

  We’re looking for a forward-thinking Engineering Manager to
  lead a fast-paced, innovative team, helping engineers tackle
  challenging problems and develop reliable solutions. Our
  Internal Platform and Data teams build the infrastructure
  that power our user-facing products and drive a positive
  developer experience. You will have responsibilities that
  span people, engineering and delivery. We will rely on you
  to ensure that engineers grow and thrive as they solve for
  business outcomes, to provide technical leadership while
  influencing culture, to facilitate technical delivery, to
  work with your team on strategy, practices and execution,
  and to work with leadership to define big picture vision and
  strategy alignment. Your work will guide young people to the
  services they need, and have a positive impact on their
  mental health.

  If you would like to be part of an ambitious, fun and caring
  culture in a growing company that is having a positive
  social impact, look no further – apply today!

  What You’ll Be Doing

  - Lead, manage and support a remote-first, team of full-stack-
    oriented platform and data engineers through hiring,
    coaching, mentoring, feedback, and hands-on career
    development.
  - Nurture and champion a collaborative engineering culture
    where feedback, craft and quality are valued.
  - Guide your team as they make high-integrity technical
    decisions, develop sustainable architecture, and evolve
    near and long-term strategy.
  - Lead goals around reliability, observability, developer
    experience, continuous integration, data and ML tooling,
    and infrastructure cost management to outcomes.
  - Collaborate to continuously improve your team's agile
    practices, delivery cadence, ways of working and learning
    approach.
  - Work closely with your team and cross-functional peers to
    build relationships with internal customers, andenable
    sustainable and timely delivery of technical solutions.
  - Provide context, support and guidance as your team works
    toward driving business outcomes — you will inspire, not
    merely direct.
  - Engage with the VP of Engineering and our broader leadership
    team to set up the Kooth engineering team for future
    growth and success.

  Requirements

  - You are an experienced Engineering Manager with a proven
    track record of attracting and retaining great talent.

  - You have successfully led and managed healthy full-stack
    engineering teams in a remote environment, collaborating
    across geographies and timezones.
  - You have experience leading internal product infrastructure
    or data teams and supporting peer engineering teams as
    your customers.
  - You are a servant leader who values team success over
    personal success, empowers individuals to grow, and
    emphasizes learning from failure. You thrive when
    developing great people, not just great products.
  - You are fluent in modern software development, quality and
    reliability practices. You partner with engineers and
    guide them to positive technical outcomes.
  - You believe in data-informed, learning-driven iteration and
    have a deep toolbox of agile and lean delivery experience
    to pull from.
  - You enjoy collaborating with cross-functional partners to
    lead high-profile, consumer-facing projects to timely
    execution and delivery.

  Benefits

   Are you looking for a fulfilling career with attractive
  perks and a supportive work environment? Look no further!
  We're excited to offer an incredible opportunity with a
  range of benefits that cater to your professional growth,
  well-being, and work-life balance.


  - 1. Competitive Salary:

  Up to £110,000

  - 2. Generous Annual Leave:

  Enjoy 28 days of annual leave, in addition to public
  holidays, providing you ample time to recharge and spend
  quality moments with your loved ones.

  - 3. Professional Development:

  Benefit from our yearly professional training programmes,
  tailored to your career aspirations and designed to enhance
  your skills and knowledge.

  - 4. Health and Well-being:

  Prioritize your health and well-being with our comprehensive
  Health Shield cover and access to an Employee Assistance
  Programme (EAP). The EAP offers 24/7 telephone mental health
  support and access to GP consultations, ensuring your mental
  and physical health are taken care of.

  - 5. Life Assurance:

  Gain peace of mind knowing that you're covered with life
  assurance, providing up to four times your annual salary to
  your loved ones in the unfortunate event of your passing.

  - 6. Flexible Working:

  Embrace the flexibility of remote working, allowing you to
  create a work-life balance that suits your needs and
  maximizes your productivity.

  - 7. Lifestyle Benefits:

  If you're seeking a stimulating career where your well-
  being, growth, and contributions are valued, we invite you
  to apply and become a part of our dynamic and supportive
  team. Join us as we strive for success together!

  At Kooth, we are committed to fostering an inclusive and
  diverse workplace that values and embraces the unique
  contributions of every individual. We believe in equal
  opportunities for all, regardless of race, color, religion,
  gender, gender identity or expression or sexual orientation.

  Our dedication to creating a fair and unbiased environment
  is reflected in all aspects of our recruitment, hiring, and
  employment practices. We strive to provide a work
  environment that is free from discrimination, where every
  employee is treated with respect and dignity.

  Request for Reasonable Adjustments:

  We are dedicated to providing reasonable adjustments to
  applicants and employees with disabilities or individuals
  who require accommodations to participate in the application
  process, interviews, or job-related tasks. If you require
  any reasonable adjustments to ensure your equal
  participation in our recruitment process, please inform our
  Human Resources team.

  Your openness will allow us to work together to provide
  appropriate accommodations and ensure a fair and accessible
  application and employment experience for everyone.

  Kooth plc is committed to our responsibilities for
  safeguarding and promoting the welfare of children, young
  people and vulnerable adults . We are committed to
  recruiting candidates who share this commitment to
  safeguarding, and therefore we apply robust recruitment and
  selection procedures to ensure that the people selected are
  right for the job, and that all candidates are appropriately
  screened prior to appointment. This will include a DBS
  check.
