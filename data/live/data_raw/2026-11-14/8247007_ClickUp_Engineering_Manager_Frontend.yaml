description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  We are seeking a highly technical and experienced
  Engineering Manager to one of our business critical
  engineering team. This role is ideal for a hands-on leader
  who thrives in a fast-paced environment, has a deep
  understanding of collaborative document editing
  technologies, and is passionate about building scalable,
  high-performance software. As the Manager, you will oversee
  the development and delivery of innovative features, ensure
  technical excellence, and mentor a team of talented
  engineers.



  The Role:

  - Technical Leadership: Provide hands-on technical guidance to
    the team, ensuring best practices in software development,
    architecture, and design.
  - Team Management: Lead, mentor, and grow a team of engineers,
    fostering a culture of collaboration, innovation, and
    continuous improvement.
  - Product Development: Drive the development of new features
    and enhancements, ensuring high performance, scalability,
    and reliability.
  - Collaboration: Work closely with product managers,
    designers, and other engineering teams to align on goals,
    prioritize initiatives, and deliver exceptional user
    experiences.
  - Code Quality: Oversee code reviews, ensure adherence to
    coding standards, and advocate for clean, maintainable,
    and testable code.
  - Innovation: Stay up-to-date with the latest trends and
    technologies in collaborative editing, cloud
    infrastructure, and web development, and apply them to
    improve our product.
  - Operational Excellence: Ensure the stability and performance
    of the Docs platform, proactively addressing technical
    debt and optimizing system architecture.



  Qualifications:

  - Technical Expertise:
    - Proficiency in Node.js, relational databases, and at least
      one modern frontend framework.
    - Experience with AWS cloud services and infrastructure.
  - Leadership Experience:
    - Proven track record of managing and scaling engineering
      teams.
    - Strong ability to mentor and develop technical talent.
  - Problem-Solving Skills:
    - Ability to tackle complex technical challenges and make
      data-driven decisions.
  - Communication:
    - Excellent verbal and written communication skills, with the
      ability to articulate technical concepts to non-
      technical stakeholders.
  - Education & Experience:
    - Bachelor’s or Master’s degree in Computer Science,
      Engineering, or a related field, or equivalent industry
      experience.
    - 7+ years of software engineering experience, with at least 1
      year in a leadership role.



