description: |
  SUMMARY:

  We are seeking a Software Engineer with strong expertise in
  software design, modeling, and Java to join our Agile Scrum
  development team on Next Generation Constructive. The
  successful candidate will primarily maintain, enhance,
  troubleshoot, and support existing Java applications. The
  backend development is done using Java and Spring. The ideal
  candidate enjoys developing complex systems, resolving
  software defects, translating system requirements into
  software designs, implementing software enhancements, and
  collaborating with cross-functional teams to deliver high-
  quality software.

  WHAT YOU WILL DO:

  You will report to the Engineering Management team and
  perform software design, code, unit test, integration and
  testing to satisfy project requirements.  Additionally, this
  position will be assigned other projects or tasks in
  alignment with the level and scope of the position.  This
  position will work remotely as an extension to our Orlando,
  FL software development team.

  ESSENTIAL DUTIES / RESPONSIBILITIES:

  •Maintain, enhance, and support existing Java Services.

  •Develop new features and functionality within existing Java
  services.

  •Investigate, troubleshoot, and resolve software defects and
  production issues.

  •Analyze software requirements and implement enhancements to
  existing functionality.

  •Refactor and improve existing code to enhance
  maintainability, performance, and reliability.

  •Participate in all phases of the Agile Scrum software
  development lifecycle, including sprint planning, daily
  standups, and retrospectives.

  •Collaborate with software engineers, product owners, and
  other stakeholders to deliver software updates and
  enhancements.

  •Work closely with a test team to support software
  verification, resolve reported defects, and ensure software
  quality.

  •Participate in peer code reviews to promote code quality,
  consistency, maintainability, and adherence to the
  established coding standards.

  •Collaborate with a documentation and training team on
  software updates that impact documentation to keep it
  current.

  •Follow established software engineering processes, version
  control practices, and coding standards.

  •Contribute to continuous improvement of software quality,
  development practices, and team processes.

  MINIMUM QUALIFICATIONS:

  •Bachelor’s degree in Computer Science, Computer
  engineering, or a related field (or equivalent experience).

  •5-7+ years of Software Engineering experience.

  •Professional experience developing and maintaining Java
  services.

  •Strong proficiency with Java, Spring and software design
  principles.

  •Experience working within an Agile Scrum software
  development environment.

  •Familiarity using an integrated development environment
  such as VS Code, Intellij IDEA, or Eclipse.

  •Experience working in a Linux development environment.

  •Strong analytical, troubleshooting, debugging, and problem-
  solving skills.

  •Effective verbal and written communication skills.

  •Ability to work independently and collaboratively with a
  software development team.

  PREFERRED SKILLS:

  •Java

  •Git version control

  •Atlassian tools (Jira Confluence)

  •Gradle and Maven

  •Object-oriented programming principles and software design
  patterns.

  •Experience integrating Angular applications with Java-based
  backend services and enterprise application interfaces.

  JOB CONTEXT / PHYSICAL DEMANDS:

  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodation may be made to enable individuals with
  disabilities to perform the essential functions.

  This position is be operated in an office type environment.
  The employee must occasionally lift and/or move up to 10
  pounds. Specific vision abilities required by this job
  include Close vision while performing the duties of this
  Job, the employee is regularly required to sit; use hands to
  finger, handle, or feel; reach with hands and arms and talk
  or hear. The employee is occasionally required to stand and
  walk.

