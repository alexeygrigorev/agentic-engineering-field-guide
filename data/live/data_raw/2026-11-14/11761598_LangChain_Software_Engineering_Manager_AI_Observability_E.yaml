description: |
  About Us

  At LangChain, our mission is to enable every company to own
  its intelligence. We believe agents will transform how
  companies operate, and we're building the foundation to make
  that future possible. Our open-source harnesses and
  LangSmith platform give developers and enterprises the
  infrastructure to run, improve, and govern agents at scale.

  We've raised $460M to date, with our most recent funding
  round valuing the company at $3B, backed by leading
  investors including Sequoia, Benchmark, IVP, and CapitalG.
  As we continue to expand our platform and tackle some of the
  hardest challenges in agent engineering, every team member
  has the opportunity to make a meaningful impact and help
  shape both our technology and the future of the industry.

  More than 7,000 organizations rely on LangSmith, from fast-
  growing startups to Fortune 500 enterprises, including
  NVIDIA, Bridgewater, LinkedIn, Workday, and Rippling. We're
  just getting started on making high-performing agents easier
  to build and manage at scale.

  About the Team

  The LangSmith team owns and builds LangChain's core platform
  for observability, evaluation, and production reliability of
  AI systems. From tracing and annotation to run rules,
  evaluations, and beyond, this team owns LangSmith end-to-
  end. If you want to define what great AI observability looks
  like at production scale, this is where that work gets done.

  About the role

  We’re looking for an Engineering Manager to lead the team
  building LangSmith, our observability and evaluation
  platform for LLM applications. You’ll define the technical
  direction, grow and mentor a world-class engineering team,
  and partner with product and design to deliver features that
  help developers build and deploy trustworthy AI systems with
  confidence.

  What you'll do

  - Build, mentor, and grow a high-performing team of engineers,
    fostering collaboration, ownership, and accountability
  - Strengthen LangChain’s engineering culture through
    mentorship, high-quality code, and technical excellence
  - Shape long-term technical direction and ensure scalability
    and reliability of LangSmith AI Observability Platform
  - Partner with product and design teams to define scope,
    sequence, and success criteria for key initiatives
  - Maintain a high bar for technical excellence while making
    sure the team moves with urgency and focus
  - Lead by example in writing clean, maintainable, and well-
    tested code in Go/Python and Typescript
  - Engage directly with customers to understand their needs and
    translate them into actionable product improvements

  What you'll bring

  - Experience managing or tech-leading teams delivering complex
    full-stack products
  - Strong technical background in Go/Python and
    React/Typescript
  - Solid understanding of databases (Postgres, Redis and
    ClickHouse)
  - Proven ability to design high throughput data-intensive
    systems
  - Bias towards shipping quickly and learning from customers
  - Strong communication skills—able to collaborate with
    internal stakeholders and engage directly with customers
  - Bonus: Experience building AI/LLM-powered applications,
    developer tools, or observability platforms

  - Annual salary range: $200,000- $250,000

  Compensation Philosophy:

  We offer competitive compensation that includes base salary,
  variable compensation for relevant roles, meaningful equity,
  benefits, and perks.

  We are hiring for this role across a range of scope, and the
  compensation band reflects that. Your offer depends on what
  we learn about your impact, craft, leadership, and
  communication during the interview process. We will tell you
  early where you’re tracking and talk comp with you before
  offer stage. Team members in the EU, UK, and APAC receive
  locally competitive benefits aligned with regional norms and
  regulations.

  Benefits

  Benefits include medical, dental, and vision coverage,
  flexible vacation, a 401(k) plan, meals on in-office days in
  the US and more.
