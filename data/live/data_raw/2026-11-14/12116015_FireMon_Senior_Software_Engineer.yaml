description: |
  FireMon delivers Network Security Policy Control for the
  Modern Enterprise.

  Most enterprises run firewalls from multiple vendors
  alongside cloud security groups and microsegmentation
  platforms, and no single console can say whether it all
  works together. We believe policy is the control plane for
  network security: it defines what the environment should do,
  and the infrastructure carries it out. FireMon gives
  security teams one place to see, govern, and prove that
  their policy is doing what they intend, across on-prem,
  cloud, and hybrid environments

  The Software Engineer will work with Product Management and
  other Engineers to design, develop, and maintain network
  device integration software.

  About the role

  Required Skills and Experience

  - Bachelor's Degree in Computer Science, Information
    Technology, Engineering or another related field
  - Proficient Java coding skills, including an understanding of
    optimization, performance ramifications of coding
    decisions, and object-oriented design
  - Scripting expertise in either BASH or Python programming
    languages
  - Linux and general command-line experience
  - Experience with and working knowledge of Maven, SQL, JUnit,
    XML/XSLT, RESTful web services, and logback/log4j
  - Regex experience
  - Outstanding problem-solving skills.
  - Able to pick apart software, analyze it and become a subject
    matter expert on it
  - Must be willing to work in a fast-paced environment with
    multiple roles and demonstrate high emotional intelligence
  - Flexible and able to handle and prioritize multiple tasks
  - Possess a positive attitude and work well with others

  Preferred Skills and Experience

  - Experience in an Agile/Scrum software development lifecycle
  - XML / XSD Design experience
  - Expertise in networking (Cisco, Juniper, Check Point, Palo
    Alto, etc
  - Cisco network and security certification is a plus (CCIE /
    CCNA)
