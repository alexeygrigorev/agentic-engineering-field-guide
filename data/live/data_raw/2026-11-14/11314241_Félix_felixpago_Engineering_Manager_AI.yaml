description: |
  About Us

  At Félix, we are building the indispensable financial
  companion for Latinos in the US. We combine an AI-powered,
  conversational-first interface with real-time financial
  infrastructure to make cross-border money movement as easy
  as sending a text. Starting with fast, affordable
  remittances powered by AI and crypto rails, we are expanding
  into credit, savings, and wallet services to support the
  complete immigrant financial journey. Our ambition is to
  deliver a white-glove financial experience with the
  simplicity of a conversation to a community the traditional
  financial system has historically overlooked.

  We are a hyper-growth Series C company, backed by over $300
  million in funding from top-tier global investors, including
  Andreessen Horowitz, QED, Castle Island, Switch Ventures,
  HTwenty, Monashees, General Catalyst Customer Value Fund.
  This isn't just about the numbers; it's a testament to the
  trust our investors have in our vision and our team.
  Additionally, Félix was selected as an “Endeavor
  Entrepreneur” and was a recipient of the CrossTech Fintech
  Startups Award.

  Joining Félix means you will be part of a team building a
  legacy, a company that will outlive us all. This is a rare
  opportunity to apply your skills to a deeply meaningful
  mission—serving a community that has been underserved for
  too long. We are a team that is fiercely loyal to each
  other, where radical transparency and constructive feedback
  are how we grow and push for excellence. We are bold, we
  care less about what others are doing, and more about
  creating sustainable value and a product that truly makes
  our users' lives better. We are building the future, today.

  Responsibilities

  - Manage squad performance, set goals, and track progress
    while providing direct mentorship to foster a culture of
    continuous growth.
  - Act as a leader, translating AI demands into scalable
    technical architectures.
  - Partner closely with the Product team to define, prioritize,
    and execute the technical roadmap.
  - Focus on Metrics, ensuring the engineering team provides
    tools and tracking for usability, conversion funnels,
    retention, F1, etc.
  - Support high-level technical decisions and architectural
    guidance, ensuring the team delivers performant and
    optimized solutions.
  - Lead people management initiatives, including 1:1s, career
    development, and maintaining high motivation levels within
    the squad.
  - Optimize development processes and power users of AI for
    coding.
  - Generate exemplary technical documentation to set the
    foundations for the squad’s long-term success.
  - These are the applicable requisites, although equivalent
    competencies in any of the above will also be considered.

  Requirements

  - Proven experience in team management (ideally 3+ years
    leading direct reports), with a strong track record of
    having direct reports in a fast-paced technology
    environment.
  - 10+ years of experience in Software Engineering and AI
    Agents
  - Strong delivery-oriented mindset, with experience supporting
    stakeholders and coordinating teams to achieve tangible
    business results.
  - Ability to act at a high technical level, focusing on system
    design and problem-solving rather than just hands-on
    coding.
  - Excellent communication and interpersonal skills to
    collaborate effectively with Product Managers and other
    cross-functional stakeholders.
  - Ability to inspire and motivate a team, taking full
    ownership of the developers' growth and career concerns.
  - Bias for action is a strong requirement
  - Capacity to anticipate future architectures requirements
  - These are the applicable requisites, although equivalent
    competencies in any of the above will also be considered.

  Our tech stack

  We are technology agnostic and value candidates with diverse
  backgrounds. While familiarity

  with the following is helpful, your willingness to learn and
  adapt is paramount:

  - AI: Google ADK, langfuse, open AI api, Gemini Apis, etc.
  - Back-end: Python, Flask/Fast, REST APIs, Redis, SQL
  - Cloud: Google Cloud services (Firestore, Cloud Storage,
    Pub/Sub, Google Artifact Registry, Cloud Run, BigQuery,
    Cloud Composer, etc.)
  - Infrastructure: Kubernetes, Terraform, NewRelic

  What We Offer

  - Base: $232,000 - $280,000. Flexible depending on location
    and interview performance
  - Initial stock options grant
  - Annual performance bonus
  - Health, dental, and vision plans
  - 401(k) with an employer's match
  - Continuous learning opportunities
  - Unlimited PTO
  - Paid parental leave
  - Empowering opportunities for growth in a dynamic
    entrepreneurial environment

  Equal Opportunity Employer

  At Félix, we are committed to providing equal employment
  opportunities to all qualified employees and applicants
  without regard to race, religion, nationality, sex, sexual
  orientation, gender identity, age, or disability. This
  policy applies to all terms and conditions of employment,
  including recruitment, hiring, placement, promotion,
  training, compensation, benefits, and termination.

  Want to learn more about our privacy practices? Check out
  our Privacy Policy.

  Compensation

  The base pay range for this role is $232,000 – $280,000 per
  year.
