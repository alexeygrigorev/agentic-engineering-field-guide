description: |
  Full Stack Engineer Job Title



  Full Stack Engineer



  Job Summary



  We are seeking a Full Stack Engineer to design, develop, and
  integrate scalable API-based solutions that enable seamless
  data exchange and real-time updates across enterprise
  systems. The ideal candidate will work closely with business
  analysts, quality engineers, and program managers to deliver
  secure, high-performance applications that support business
  transformation initiatives.



  Key Responsibilities



  - Design, develop, and maintain frontend and backend
    applications supporting API integrations.
  - Build and consume RESTful APIs and microservices for
    enterprise applications.
  - Develop responsive and user-friendly interfaces to enhance
    user experience.
  - Integrate third-party and internal systems to enable real-
    time data synchronization.
  - Collaborate with Data Science teams to incorporate analytics
    and predictive models into applications.
  - Optimize application performance, scalability, and
    reliability.
  - Implement security best practices, authentication, and
    authorization mechanisms.
  - Participate in code reviews and maintain coding standards.
  - Troubleshoot and resolve application and integration issues.
  - Support deployment, post-production monitoring, and ongoing
    maintenance activities.



  Required Qualifications



  - Bachelor's degree in Computer Science, Engineering, or
    related field.
  - 4+ years of experience in full-stack development.
  - Strong proficiency in Java, .NET, Node.js, or Python.
  - Experience with React, Angular, or Vue.js.
  - Hands-on experience with REST APIs, microservices, and cloud
    platforms.
  - Strong understanding of databases such as SQL Server,
    Oracle, MongoDB, or PostgreSQL.
  - Experience with Git, CI/CD pipelines, and DevOps practices.



  Preferred Qualifications



  - Experience with Azure, AWS, or Google Cloud.
  - Knowledge of AI/ML integration and data-driven applications.
  - Experience with containerization technologies such as Docker
    and Kubernetes.











  Compensation, Benefits and Duration



  Minimum Compensation: USD 37,000 Maximum Compensation: USD
  132,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
