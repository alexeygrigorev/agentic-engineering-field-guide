description: |
  About Snorkel

  Snorkel AI is the frontier AI data lab, helping teams build
  the data and environments behind high-performing frontier
  and agentic AI. We combine technology with research-driven
  AI data development to create datasets, benchmarks, evals,
  and custom solutions for real-world AI systems. Founded out
  of the Stanford AI Lab in 2019, Snorkel works with leading
  AI labs and enterprises to move from better data to better
  outcomes.  Excited to help us redefine how AI is built?
  Apply to be the newest Snorkeler!

  About The Role-Senior Software Engineer (Req # 722)

  Snorkel AI, Inc., headquartered in San Francisco, CA, seeks
  a Senior Software Engineer to build systems to power large-
  scale AI workloads for top tier AI research labs. Work
  closely with other engineers, product managers, and field
  team members to ensure that Snorkel’s frontier AI datasets
  meet and surpass the capabilities of the most advanced
  foundation models. Launch agents into production to
  accomplish long running reasoning and verification tasks.
  The Evaluation Engineering team owns critical systems for
  building high-quality post-training and benchmark datasets,
  integrating with the latest foundation model technology to
  push the frontier of models used globally across coding,
  mathematics, law, medicine, and other advanced domains. Own
  the architecture, design, development, and operations of
  large-scale systems designed for AI/ML tasks including
  distributed compute systems, data management systems, data
  engineering workflow systems, and end user experiences.
  Recognize and act on opportunities to integrate the latest
  agentic and foundation model technologies to power eval
  workflows. Prototype, optimize, and maintain scalable back-
  end services that will power new foundation model
  development tools. Design extensible and testable interfaces
  between internal services including the underlying storage
  and data models. Be an engaged team player in a customer-
  focused cross-functional environment where you will feel
  excited to take on whatever is most impactful for the
  company and product.

  What We're Looking For

  Bachelor’s degree (or foreign equivalent) in Computer
  Science or a related field and the following experience:

  - 4 years developing software using Java & Typescript and work
    with relational databases, with a focus on scalability,
    reliability and performance;
  - 4 years building and optimize large-scale distributed
    systems or compute frameworks for data processing;
  - 3 years designing, developing and delivering AI/ML systems
    and services in production environments for cloud-native
    applications, development of AI agents and LLM-powered
    systems: Retrieval-Augmented Generation (RAG), Model
    Context Protocol (MCP);
  - 3 years designing and implementing data storage, compute &
    retrieval systems to support AI/ML applications;
  - 3 years improving large language model (LLM) applications
    through evaluation frameworks, prompt engineering and
    agent orchestration techniques;
  - 3 years leading or owning the delivery of large, multi-
    person engineering projects from design through
    deployment.

  Able to work 100% remotely.

  #LI-DNI

  Actual compensation will be determined based on factors
  including skills, qualifications, experience, and geographic
  location.

  Salary range(s) for this role

  $208,000—$315,000 USD

  Be Your Best at Snorkel

  Joining Snorkel AI means becoming part of a company that has
  market proven solutions, robust funding, and is scaling
  rapidly—offering a unique combination of stability and the
  excitement of high growth. As a member of our team, you’ll
