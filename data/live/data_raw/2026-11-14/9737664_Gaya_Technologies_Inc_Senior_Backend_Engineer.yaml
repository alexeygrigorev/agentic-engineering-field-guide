description: |
  Role Summary

  As a Senior Backend Engineer at Gaya, you will be critical
  in enhancing and scaling our backend systems. You will be
  responsible for improving our API infrastructures,
  optimizing core algorithms, ensuring system reliability, and
  implementing robust unit testing across our tech stack. Your
  expertise will also support our migration to a more robust
  cloud provider. Experience with Robotic Process Automation
  (RPA) solutions is strongly preferred.

  Responsibilities

  - Backend Development: Lead the development and optimization
    of our backend services, focusing on both internal and
    external API infrastructures.
  - Unit Testing Implementation: Establish and implement
    comprehensive unit testing across the entire backend tech
    stack, setting a playbook for the engineering team.
  - Algorithm Optimization: Enhance the efficiency of our core
    algorithms to improve speed, reliability, and security.
  - Cloud Migration Support: Assist in migrating our backend
    systems from Supabase to a more robust cloud provider,
    ensuring a smooth transition with minimal downtime.
  - System Scalability and Reliability: Design and implement
    solutions that ensure our backend systems can scale
    effectively while maintaining high availability.
  - Collaboration: Work closely with front-end engineers,
    DevOps, and other stakeholders to deliver cohesive and
    efficient solutions.
  - AI Integration: Comfortably work with AI workflows, systems,
    and endpoints to integrate advanced features into our
    backend services.

  Ideal Candidate Profile

  - Seniority: At least seven years of development experience
    building production-grade code.
  - Extensive Backend Expertise: Strong proficiency in Node.js
    and experience with cloud-based backend services.
  - RPA Experience (Preferred): A strong background in building
    RPA (Robotic Process Automation) solutions is highly
    desirable.
  - Testing and Quality Assurance: Proven experience
    implementing unit testing frameworks and establishing best
    practices for backend systems.
  - API Development: Expertise in designing, building, and
    optimizing internal and external APIs.
  - Algorithm Optimization: Demonstrated ability to optimize
    algorithms for performance, reliability, and security.
  - Cloud Infrastructure Knowledge: Experience migrating backend
    services to robust cloud providers and knowledge of cloud
    infrastructure best practices.
  - Collaborative Team Player: Excellent communication skills
    and a proactive approach to teamwork and problem-solving.

  Core Tech Stack

  - JavaScript/Typescript
  - React
  - Node.js
  - Python
  - PostgreSQL

  Reporting Structure

  You will report directly to our Lead Engineer as well as our
  CTO, playing a pivotal role in the company's strategic
  direction and technological advancements.

  Join Us

  As a Senior Backend Engineer at Gaya, you'll architect and
  scale the systems that power insurance automation for
  thousands of users. You'll establish engineering best
  practices, lead critical infrastructure decisions, and work
  closely with our Lead Engineer to build a robust, scalable
  platform. If you're excited about backend challenges that
  directly impact business outcomes, we'd love to hear from
  you.
