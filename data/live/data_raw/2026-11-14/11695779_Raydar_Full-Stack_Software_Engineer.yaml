description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Work side by side with client teams to understand how their
  operational work really gets done, then design and ship
  software that fits it. Own delivery from specification
  through production, balancing client-facing conversations
  with hands-on engineering.

  What you'll do

  - Embed with client teams to learn how their day-to-day work
    actually runs, beyond the documented process.

  - Lead customer calls, write specifications and build full-
    stack systems covering frontend, backend, data model and
    AI components.

  - Take ownership of whole areas of the product from the start,
    working closely with company leadership.

  - Release to production quickly and iterate based on direct
    feedback from users.

  - Decide what is worth building and which customer requests
    are broadly useful versus one-off.

  - Study real client documents and outputs to build AI-assisted
    workflows that handle unstructured, inconsistent inputs.

  Requirements

  What we're looking for

  - 3 to 6 years of software or product engineering experience,
    ideally at a high-calibre startup.

  - Proven track record of building and shipping production
    systems to real users.

  - Full-stack capability, including Python, frontend work, data
    modelling and integrating AI models.

  - A personable, confident communication style suited to
    working directly with clients.

  - Strong academic background.

  - Ability to work on-site five days a week.

  Bonus points

  - Prior experience starting a company or joining a startup at
    its earliest stage.

  - Background in a client-embedded engineering role at a well-
    regarded technology firm.

  - Openness to candidates who would need UK work sponsorship.

  Benefits

  Compensation and benefits

  - Base salary: GBP 100,000 to 160,000 per year

  - Equity

  Location and work model

  - London, United Kingdom

  - On-site, 5 days per week in the office

  - Full-time
