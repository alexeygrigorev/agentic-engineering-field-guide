description: |
  About Savvy Wealth:

  Wealth management is a $545 billion industry that still runs
  on manual work. 75% of advisors offer no digital
  communication beyond email, and most still build financial
  plans by hand in Excel. Savvy is reinventing what it looks
  like to be a financial advisor. Founder Ritik Malhotra saw
  the fragmentation firsthand after seeking out his own
  advisor, and started Savvy to give independent advisors a
  modern, AI-native home.

  Savvy is a registered investment advisor (RIA), and we
  partner with experienced financial advisors who want to grow
  without running the back office themselves. Advisors bring
  their book and join Savvy, running under their own brand (or
  ours), and Savvy earns a percentage of the assets they
  manage. In return, they get a true business-in-a-box: a
  proprietary tech platform and client portal, an in-house
  marketing team that helps them grow, a world-class
  investment management team, and a dedicated client services
  team that runs day-to-day operations and support. Advisors
  at Savvy service up to 50% more households and save 19 hours
  a week.

  AI runs through everything we do. On the product side, Savvy
  Intelligence (released April 2026) is the only AI built for
  wealth managers that can see a client's complete financial
  picture. Internally, everyone at Savvy uses Claude and is
  encouraged to experiment with it, backed by a dedicated AI
  enablement team and a RevOps org building agents in-house.

  The trajectory is steep and it's still early. We're a Series
  C company with 170+ people, $200M raised, and $100M ARR in
  sight this year. Inc. ranked us the No. 1 fastest-growing
  financial services company in America in 2026. Come build
  the next stage with us!

  Recognition:

  We're a Certified Great Place to Work and have been honored
  for our culture and our growth:

  - Newsweek's America's Greatest Startup Workplaces (2026)
  - Fortune Best Workplaces in New York™ (2026)
  - Great Place to Work Certified™

  The role

  Savvy is hiring a Senior Engineering Manager to lead three
  engineering teams building the platform where AI meets
  fiduciary advice. You'll inherit three established, high-
  performing teams, each anchored by a senior tech lead who
  owns day-to-day technical direction. Your job is to keep
  those teams shipping high-impact product and platform work,
  keep the engineers on them growing, and hold the technical
  and quality bar as we scale.

  This is a hands-on management role. You're based in our NYC
  HQ, working in person alongside the Product Managers,
  Product Designers, and stakeholders who shape what we build,
  and you manage a fully remote engineering team across LATAM
  that works the same hours we do. You're the bridge between
  the two: translating product direction into clear technical
  execution, and bringing engineering reality back into how we
  plan. AI tooling has let our managers stay genuinely
  technical while they lead, and we expect the same here.
  You'll review the hard changes and make architectural calls,
  not from the sidelines.

  Responsibilities

  - Own delivery health across three teams: predictable
    shipping, sane scope, and unblocking engineers fast, in
    close partnership with Product and Design.
  - Grow and retain a strong team: coaching, career development,
    substantive feedback, and keeping your engineers engaged
    and leveling up.
  - Drive our hiring process for these teams: raising the bar on
    who we bring in and running a tight, fair loop.
  - Stay hands-on with the code: review complex changes, set and
    hold engineering patterns and standards across product and
    platform work, and make architectural calls with your tech
    leads.
  - Champion AI tooling across the team (Claude Code, Cursor,
    Codex, and whatever's next), modeling it in your own work
    and raising the team's velocity with it.
  - Partner with Product and Design at HQ to shape scope and de-
    risk execution on high-ambiguity problems, and carry that
    context clearly to a remote team.

  Must have

  - Experience managing remote or distributed engineering teams.
  - 3+ years managing engineers, including owning delivery,
    performance, hiring, and growth for a team.
  - You use AI tools aggressively in your daily workflow: Claude
    Code, Cursor, Codex, and whatever else is useful. You're
    ahead of the curve on what's emerging, you stay
    technically proficient because of it, and you translate
    that into how your team builds.
  - A track record of shipping complex product and platform work
    end-to-end with measurable business impact, and holding
    the quality bar throughout.
  - Strong full-stack or platform engineering depth, enough to
    lead and review with credibility. We use Rails, React,
    Next.js, PostgreSQL, and GraphQL; you're comfortable
    across the stack or close gaps fast.
  - Strong system-design judgment: data models, service
    boundaries, failure modes, and how systems hold up at
    scale, applied to guiding architecture and raising the
    team's instincts.
  - Strong communication: you write clearly, give effective
    feedback, and collaborate well across functions in a
    startup environment, including with a remote team.
  - Based in or willing to relocate to NYC and work in person at
    our HQ.

  Nice to have

  - You've built AI-powered features customers rely on in
    production: LLM integrations, agentic workflows,
    intelligent automations, or similar, and you understand
    the real tradeoffs around reliability, latency, cost, and
    failure modes.
  - Fintech domain knowledge: financial services, wealth
    management, regulatory compliance, or financial data
    integrations.
  - Experience leading in an early-stage, high-ambiguity startup
    environment.

  Benefits:

  - Competitive salary and equity package
  - We offer a generous relocation package to help top talent
    make the move to our NYC office
  - Unlimited PTO + paid company holidays
  - Access to holistic medical, dental, and vision plans
  - Company 401(k) (including Mega backdoor Roth options),
    Commuter, and HSA/FSA plans
  - NYC office in Union Square
  - Lunch and snacks provided in the office, & dinner if you
    stay late
  - Access to virtual mental health care (Spring Health) and
    health concierge (Rightway) to help you find the right
    care
  - Access to counseling for stress management, dependent care,
    nutrition, fitness, legal, and financial issues (Guardian
    WorkLifeMatters EAP)
  - Benefits are available to full-time employees
