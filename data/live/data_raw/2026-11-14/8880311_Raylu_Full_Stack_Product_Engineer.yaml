description: |
  Position Summary

  Join us as a Full-Stack Product Engineer to design, build,
  and iterate on ambitious product surfaces end-to-end. You’ll
  work across React/Next and Node/TypeScript, contributing to
  features from rough idea to shipped outcome—with support
  from the team.

  What we’re looking for

  - Strong full-stack foundation: TypeScript across the stack;
    React/Next on the front, Node on the back.
  - Product-minded: You prioritize user value, care about UX
    details, and help design APIs that keep the UI simple.
  - Good engineering judgment: You can move quickly while
    keeping an eye on reliability and making smart now-vs-
    scale tradeoffs.
  - Ownership: You can take features from requirements to
    implementation, launch, and iteration - collaborating
    closely with teammates.
  - Bonus: Familiarity with LLM integrations and cloud
    deployment.
  - Opinionated: You’re thoughtful about the tech landscape and
    make design decisions based on clear reasoning—comfortable
    learning new patterns when needed.

  Responsibilities

  - Move rapidly from customer pain point to shipped feature
  - Build and ship across frontend, backend, and infrastructure;
    prototype quickly then harden
  - Improve developer ergonomics, code quality, and
    observability
  - Contribute to the roadmap and help shape product direction
    with data and user feedback

  Logistics:

  - Compensation: $150K - $200K salary, $50–100K equivalent in
    new hire equity (4 year vest)
  - Location: New York City. We are a fully in-office team
    working out of Midtown Manhattan Monday through Friday. We
    allow for WFH days when anyone is traveling, but we do not
    allow for permanent remote work.

  Benefits:

    - Generous health, dental, and vision insurance
    - 401k with 3% automatic contribution (no vesting)
    - Paid Lunches
    - Wellness and Citi Bike benefit
