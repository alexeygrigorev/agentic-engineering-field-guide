description: |
  About Us

  Resonance is a technology company building a more
  sustainable and valuable fashion industry for designers,
  brands, manufacturers, consumers, and the planet. The
  company’s AI-powered operating system ONE enables brands to
  design, sell, and make in that order, empowering designers
  to operate with no unnecessary inventory and eliminating the
  financial and environmental burdens of the legacy fashion
  industry.

  Resonance ONE is our software that powers any apparel
  company. Resonance ONE uses an emergent behavior model that
  redefines how garments are designed, sold and made with an
  “I know nothing” mindset that is constantly learning from
  our users. Resonance ONE includes the following:

  - An apparel brand or creator’s digital operating system to
    launch and run their brand’s business.
  - An AI Agentic framework, Contracts, and APIs for functions
    that span the end-to-end creation-to-closet functionality,
    including everything from 3D volumetric design and
    collection creation to payments to orders to inventory
    management and some non-standard processes that are
    specific to Resonance workflows
  - Internal value chain routing, organization, and optimization
    of garment manufacturing.Future analytics and machine
    learning functions for learning and optimization.

  ONE primarily focuses on building a learning system that
  teaches optimally how to produce garments sustainably and
  without legacy restrictions.

  Headquartered in New York City and Santiago, Dominican
  Republic, Resonance has partnered with more than 30 brands,
  including THE KIT and Rebecca Minkoff, to create garments
  that use 97% less dye, 70% less water, and 50% less material
  than any other fashion brand—and immediately eliminate
  overproduction.

  Want to know more? Visit our website and read articles about
  us.

  About the role

  As a Senior Full Stack Application Engineer, you will be a
  critical role in implementing the applications roadmap at
  Resonance. This role…

  Responsibilities

  - Own the App roadmap working closely with products to design
    and develop the next generation of Resonance services.
  - Design, build, and maintain, user-facing experiences,
    services, APIs, and systems
  - Make effective tradeoffs that consider business priorities,
    user experience, and a sustainable technical foundation
  - Strike a balance between always trying to improve the
    platform and tools we use while being highly value-focused
    and aiming to delight customers
  - Debug production issues across services and multiple levels
    of the stack

  Requirements

  Minimum Qualifications

  - 5+ years of software engineering experience
  - Enjoy being a generalist working on both the frontend and
    backend
  - Care deeply about the user experience and take pride in
    building products to solve problems and delight users
  - Prefer simple solutions and designs over complex ones, and
    have a good intuition for what will last and scale
  - Thrive in a collaborative environment involving different
    stakeholder and partners: we work closely with designers,
    product team, analysts and operational teams
  - Have a high quality bar, attention to detail, and helps
    teammates deliver polished products
  - Want to own end-to-end product experiences: product design,
    architecture, writing lots of code,
  - safely rolling out that code, and doing whatever is needed
    to ship products

  Preferred Qualifications

  - Experience with startups
  - Prior experience with Javascript/Typescript, React, and SQL
  - Experience building Python APIs
  - Have a track record of building excellent products

  Benefits

  - We offer full benefits (medical, dental, and vision), a
    competitive salary and equity.
  - Resonance Companies is an equal opportunity employer and
    values diversity in our company. We do not discriminate
    based on race, religion, color, sex, gender identity,
    sexual orientation, age, non-disqualifying physical or
    mental disability, national origin, veteran status, or any
    other basis covered by appropriate law. All employment is
    decided based on qualifications, merit, and business
    needs.
