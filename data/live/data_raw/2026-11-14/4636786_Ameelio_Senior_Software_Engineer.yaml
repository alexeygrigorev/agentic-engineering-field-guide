description: |
  Location:

  Remote (International OK)

  While our operations are centered in the United States and
  preference will be given to candidates located within the
  US, we welcome international applicants who can ensure some
  overlap with US time zones, including US Pacific Time
  (UTC−07:00). This arrangement supports effective
  collaboration and synchronization with our team.

  About Us:

  Ameelio is a pioneering non-profit committed to using
  technology to make a significant social impact. Our mission
  encompasses the development and implementation of innovative
  tech solutions that improve the lives of incarcerated
  individuals and their families. We focus on enhancing
  communications and expanding educational opportunities
  within correctional facilities, which are crucial for
  maintaining family connections and supporting
  rehabilitation.

  By providing free and accessible communication tools, we
  help preserve essential support structures that
  significantly reduce recidivism. We also challenge the
  unjust practices of incumbents in the industry who impose
  high costs on communications, ensuring that families,
  especially those least able to afford these fees, can stay
  connected without financial burden.

  Join us in our mission to empower educators, improve
  familial connections, and fight against systemic
  exploitation in the communication services for incarcerated
  individuals and their families.

  Technologies we use:

  - TypeScript
  - GraphQL
  - React
  - React Native
  - WebRTC
  - ffmpeg
  - Docker
  - Github Actions
  - Kubernetes

  Position Overview:

  Responsibilities:

  - Implement full stack changes on Ameelio Connect
  - Support team members with regular code reviews
  - Release and support changes in production
  - Create maintainable code with appropriate tests and types
  - Investigate and recommend solutions to issues reported by
    customers
  - Identify opportunities for improved code quality and procesS

  Who we’re looking for:

  - Works independently on medium and large features, seeking
    advice when making decisions not specified by the change
    request.
  - Takes ownership of released changes, building confidence
    through automated tests, feature flags, and real-user
    monitoring.
  - Considers impact on actual users when making decisions and
    prioritizing efforts.
  - Motivated by delivering value to actual people
  - Growth-oriented with low ego

  Bonus experience:

  - WebRTC
  - ffmpeg
  - Audio stream processing
  - Video stream processing



  Benefits:

  - Competitive salary and excellent benefits package.
  - Opportunity to contribute to a meaningful mission that
    positively (and measurably) impacts society.
  - Ability to strongly shape the development/outcome of the
    product, lay a sustainable foundation, and set the team up
    for long-term success.
  - Be an early part of a high-impact startup that has a bright
    future ahead of it.
  - Work with a talented, passionate team committed to making a
    difference.
  - Enjoy a great work/life balance

  Salary:

  We aim to offer competitive compensation that aligns with
  local standards while reflecting the significance of the
  role and the expertise brought by the ideal candidate.
