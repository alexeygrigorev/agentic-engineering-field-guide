description: |
  Who We Are

  adMarketplace is the largest global marketplace for Native
  Search advertising. For over 25 years, we’ve connected
  brands with consumers at the moment they express commercial
  intent beyond legacy search engines. Today, our Native
  Search solutions are exclusively integrated across next-
  generation platforms where discovery happens, including web
  browsers, Buy Now Pay Later apps, and AI chat surfaces.
  Powered by vector search technology, our platform delivers
  relevant text and product ads that match consumers with the
  brands, products, and offers they’re actively seeking. Our
  award-winning culture is grounded in the principles of
  Curiosity, Collaboration, Creative Conflict, Commitment, and
  Competitiveness – our 5Cs. These values drive us to turn
  complexity into clarity and create measurable value for
  consumers, advertisers, and publishers alike.

  The Role

  We are looking for an AI-first full-stack engineer to join
  Workflows team - building AI-native UI and agentic workflow
  Amplify platform. Amplify is a control plane for all
  advertiser & publisher activity within adMarketplace. You
  will own full-stack end-to-end projects - you’ll work
  closely with internal & external users, design, product,
  drive architecture and full stack implementation.

  Your work will have a direct and measurable impact on our
  revenue. You will have a clear career progression path and
  numerous opportunities for both personal and professional
  growth in an intellectually stimulating and dynamic work
  environment.

  What You'll Do:

  - Deliver production-ready features that improve client-facing
    and internal product workflows.
  - Build intuitive, reusable, and performant frontend
    experiences using React and other frontend technologies.
  - Develop scalable, secure, and observable backend
    microservices using Java.
  - Design and optimize database schemas, queries, indexes, and
    transactions.
  - Improve system reliability, performance, maintainability,
    and code quality.
  - Use AI-assisted development tools responsibly to increase
    productivity, testing quality, debugging speed, and
    documentation.
  - Mentor engineers, contribute to technical design, and raise
    engineering standards across the team.

  Basic Qualifications:

  Technical / Functional Skills

  - Bachelor’s degree in Computer Science, Engineering, or
    related technical field preferred, or equivalent practical
    experience.
  - 5+ years of professional software engineering experience.
  - 3+ years of hands-on experience with React and preferably
    TypeScript.
  - 3+ years of hands-on experience with Java (preferably Spring
    Boot)
  - Experience working with relational databases, preferably
    MySQL.
  - Experience designing and maintaining microservices and
    GraphQL/REST API endpoints.
  - Experience with microservices, distributed systems, and
    production-grade applications.
  - Strong understanding of software design principles, clean
    code, testing, refactoring, and maintainable architecture.
  - Experience with CI/CD practices, automated testing,
    observability, and production support.
  - Experience using AI-assisted development tools responsibly
    and effectively for prototyping, architecting, coding,
    debugging, testing, refactoring, documentation, and
    learning.
  - Ability to validate AI-generated code for correctness,
    security, scalability, performance, and maintainability.

  Core Competencies

  - Strong problem-solving and analytical thinking.
  - Strong stakeholder management and communication skills.
  - Sound technical judgment and ability to evaluate tradeoffs.
  - High ownership, accountability, and delivery orientation.
  - Ability to mentor engineers and improve team practices.
  - Comfort operating in a fast-paced, evolving environment.

  Preferred Qualifications

  - Experience querying analytical databases such as ClickHouse
    for reporting and product analytics.
  - Experience with Kafka or similar event-driven technologies
    preferred.
  - Experience in ad tech, search, marketplace systems,
    analytics, or high-scale transactional platforms is a
    plus.

  Compensation: $170,000 - $200,000 + bonus + equity

  Join Us

  adMarketplace has been named as one of the best places to
  work in New York City by Built In and Crain’s- the latter of
  which have recognized us the past three years straight! AMP
  is currently experiencing triple digit growth, and it’s
  never been a better time to join our team!

  We offer a robust continuing education program, management
  training, regular company-wide lunch and learns, and well-
  defined career paths to ensure all our employees have an
  opportunity to grow.

  At adMarketplace, we play to win, but we learn from our
  setbacks. Our commitment to a collaborative environment
  means no one succeeds alone, and no one fails alone either.

  We know you’ve come to expect comprehensive healthcare,
  wellness programs, paid time off, commuter benefits, and
  401k matching from any company, so it’s a good thing we
  offer all of that and so much more. adMarketplace offers
  Summer Fridays, catered lunches, a fully stocked kitchen,
  ZogSports teams, happy hours and corporate retreats to
  encourage a strong work/life balance.

  No Third Party Recruiters. We do not accept unsolicited
  agency resumes and we are not responsible for any fees
  related to unsolicited resumes.

  *This range represents the low and high end of the base
  salary someone in this role may earn as an employee of
  adMarketplace in the New York office. Salaries will vary
  based on various factors including but not limited to
  professional and academic experience; training; associated
  responsibilities; and other business and organizational
  needs. The range listed is just one component of our total
  compensation package for employees. Salary decisions are
  dependent on the circumstances of each hire.
