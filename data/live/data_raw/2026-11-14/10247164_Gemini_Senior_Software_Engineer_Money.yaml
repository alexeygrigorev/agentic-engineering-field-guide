description: |
  About the Company

  Gemini is a global crypto and Web3 platform founded by
  Cameron and Tyler Winklevoss in 2014, offering a wide range
  of simple, reliable, and secure crypto products and services
  to individuals and institutions in over 70 countries. Our
  mission is to unlock the next era of financial, creative,
  and personal freedom by providing trusted access to the
  decentralized future. We envision a world where crypto
  reshapes the global financial system, internet, and money to
  create greater choice, independence, and opportunity for all
  — bridging traditional finance with the emerging
  cryptoeconomy in a way that is more open, fair, and secure.
  As a publicly traded company, Gemini is poised to accelerate
  this vision with greater scale, reach, and impact.

  The Department: Money

  The Money Team owns the financial infrastructure that
  underpins every dollar and crypto asset that moves through
  Gemini. We build and operate the ledger platform — the
  system of record for all crypto and fiat balances,
  settlements, fees, rewards, and administrative adjustments —
  as well as the payments services and reconciliation
  pipelines that connect Gemini to banks, payment rails, and
  external partners.

  Our systems are relied upon by finance, compliance,
  treasury, and regulatory reporting. Correctness is non-
  negotiable. If something is ambiguous, we clarify it. If
  something is manual, we automate it. If something is unsafe,
  we fix it.

  The Role: Senior Software Engineer

  We're looking for a Senior Software Engineer to join a team
  of ledger and financial infrastructure engineers designing,
  building, and operating core money-movement systems at
  scale. You'll work on services that must handle high
  transaction volumes, evolve safely as new products and
  partners are introduced, and remain easy to operate and
  audit.

  Responsibilities:

  - Design, develop, deploy, and support ledger and payments
    services that accurately record all crypto and fiat money
    movement across the platform.
  - Build and evolve bank settlement and reconciliation
    pipelines that connect Gemini to external payment rails
    and banking partners.
  - Apply sound engineering principles to identify correctness,
    consistency, and operational risks — and implement
    safeguards in software before they become incidents.
  - Partner with finance, reconciliation, and treasury teams to
    understand real-world workflows and translate them into
    robust, auditable system behavior.
  - Design scalable APIs and data models that support new
    transaction types, products, and regulatory requirements
    without increasing operational burden.
  - Write well-tested, production-grade code that other critical
    systems depend on.
  - Monitor and communicate the health of ledger and payment
    systems, proactively identify issues, and participate in
    incident response and remediation.
  - Mentor teammates to ensure new functionality is correct,
    auditable, and production-ready.
  - Participate in on-call rotations as needed.

  Minimum Qualifications:

  - 5+ years of experience building backend systems in a
    production environment.
  - Strong experience designing and operating distributed,
    stateful systems where data integrity is critical.
  - Proficiency in at least one backend language — we primarily
    use Scala and Go, but are open to candidates willing to
    learn.
  - Experience with unit testing, integration testing, and CI/CD
    pipelines.
  - Familiarity with cloud-based infrastructure (AWS, GCP, or
    Azure).
  - Ability to reason about and debug complex system behavior
    across services and data stores.
  - Strong communication skills and the ability to work
    effectively with cross-functional partners.

  Preferred Qualifications:

  - Experience working on ledger systems, accounting platforms,
    payments infrastructure, or financial transaction
    processing.
  - Familiarity with double-entry bookkeeping, reconciliation
    processes, audit requirements, or regulatory reporting.
  - Experience integrating with external payment rails or
    banking partners (ACH, wire, card networks).
  - Familiarity with workflow orchestration systems (e.g.
    Temporal, Cadence) for durable, retryable financial
    processes.
  - Background in fintech or financial services.

  It Pays to Work Here



  The compensation & benefits package for this role includes:

  - Competitive starting pay
  - A discretionary annual bonus
  - Long-term incentive in the form of a new hire equity grant
  - Comprehensive health plans
  - 401K with company matching
  - Paid Parental Leave
  - Flexible time off

  Salary Range: The base salary range for this role is between
  $140,000 - $200,000 in the State of New York. This range is
  not inclusive of our discretionary bonus or equity package.
  When determining a candidate’s compensation, we consider a
  number of factors including skillset, experience, job scope,
  and current market data.

  In the United States, we offer a hybrid work approach at our
  hub offices, balancing the benefits of in-person
  collaboration with the flexibility of remote work.
  Expectations may vary by location and role, so candidates
  are encouraged to connect with their recruiter to learn more
  about the specific policy for the role. Employees who do not
  live near one of our hubs are part of our remote workforce.
  All employees, however, are required to onboard in-person at
  one of our office locations.

  At Gemini, we strive to build diverse teams that reflect the
  people we want to empower through our products, and we are
  committed to equal employment opportunity regardless of
  race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, gender identity, or Veteran status. Equal
  Opportunity is the Law, and Gemini is proud to be an equal
  opportunity workplace. If you have a specific need that
  requires accommodation, please let a member of the People
  Team know.

