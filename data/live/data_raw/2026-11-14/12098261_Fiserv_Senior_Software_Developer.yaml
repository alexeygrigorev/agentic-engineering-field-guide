description: |
  Calling all innovators – find your future at Fiserv.

  We’re Fiserv, a global leader in Fintech and payments, and
  we move money and information in a way that moves the world.
  We connect financial institutions, corporations, merchants,
  and consumers to one another millions of times a day –
  quickly, reliably, and securely. Any time you swipe your
  credit card, pay through a mobile app, or withdraw money
  from the bank, we’re involved. If you want to make an impact
  on a global scale, come make a difference at Fiserv.

  Job Title

  Senior Software Developer

  About your role:

  At Fiserv, we are dedicated to transforming financial
  services technology to benefit our clients. As a Senior
  Software Developer, you will play a critical role in
  designing, developing, and maintaining high-quality software
  applications. You will work with cross-functional teams to
  deliver solutions that align with our business goals and
  client needs.

  You will be a part of a team that is building the Merchants
  Onboarding & Client Implementations platforms.

  What you'll do:

  - Design, develop and implement software applications to
    support business goals.
  - Collaborate with cross-functional teams to gather
    requirements and translate them into technical
    specifications.
  - Perform coding, testing and debugging of applications to
    ensure optimal performance.
  - Maintain and improve existing codebases and support peer
    review processes.
  - Mentor junior developers and provide technical guidance to
    enhance team capabilities.
  - Design and build event-driven applications using Kafka and
    Kafka Streams.
  - Develop microservices and enterprise applications using the
    Spring Framework.
  - Work with distributed databases to support scalable,
    resilient and high-performance systems.
  - Contribute to AI-driven development practices, including the
    use of AI-assisted engineering tools for coding, testing
    and productivity.
  - Build, deploy and manage containerized applications using
    Helm and Kubernetes.
  - Develop and support cloud-native applications and services
    in AWS.
  - Support CI/CD pipelines and DevOps practices across the
    software development lifecycle.

  Experience you’ll need to have:

  - Design and build event-driven applications using Kafka and
    Kafka Streams.
  - Develop microservices and enterprise applications using the
    Spring Framework.
  - Work with distributed databases to support scalable,
    resilient and high-performance systems.
  - Contribute to AI-driven development practices, including the
    use of AI-assisted engineering tools for coding, testing
    and productivity.
  - Experience in Java software development, Kubernetes & AWS
    technologies, SQL databases, CI/CD pipelines & DevOps
    practices, Agile methodologies

  Experience that would be great to have:

  - Experience in the financial services industry

  Thank you for considering employment with Fiserv.  Please:

  - Apply using your legal name
  - Complete the step-by-step profile and attach your resume
    (either is acceptable, both are preferable).

  Our commitment to Diversity and Inclusion:

  Fiserv is proud to be an Equal Opportunity Employer. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, national
  origin, gender, gender identity, sexual orientation, age,
  disability, protected veteran status, or any other category
  protected by law.

  Note to agencies:

  Fiserv does not accept resume submissions from agencies
  outside of existing agreements. Please do not send resumes
  to Fiserv associates. Fiserv is not responsible for any fees
  associated with unsolicited resume submissions.

  Warning about fake job posts:

  Please be aware of fraudulent job postings that are not
  affiliated with Fiserv. Fraudulent job postings may be used
  by cyber criminals to target your personally identifiable
  information and/or to steal money or financial information.
  Any communications from a Fiserv representative will come
  from a legitimate Fiserv email address.
