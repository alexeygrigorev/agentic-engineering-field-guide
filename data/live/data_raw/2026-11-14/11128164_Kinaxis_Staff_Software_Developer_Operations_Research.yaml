description: |
  About Kinaxis

  Elevate your career journey by embracing a new challenge
  with Kinaxis. We are experts in tech, but it’s really our
  people who give us passion to always seek ways to do things
  better. As such, we’re serious about your career growth and
  professional development, because People matter at Kinaxis. 
   

  In 1984, we started out as a team of three engineers. Today,
  we have grown to become a global organization with over 2000
  employees around the world, with a brand-new HQ based in
  Kanata North in Ottawa. As one of Canada’s Top Employers, we
  are proud to work with our customers and employees towards
  solving some of the biggest challenges facing supply chains
  today.

  At Kinaxis, we power the world’s supply chains to help
  preserve the planet’s resources and enrich the human
  experience. As a global leader in end-to-end supply chain
  management, we enable supply chain excellence for all
  industries, with more than 40,000 users in over 100
  countries. We are expanding our team as we continue to
  innovate and revolutionize how we support our customers.

  Location

  Ottawa and Toronto, Canada - Hybrid

  Other Canadian and USA locations - Remote

  Vacancy Status

  This is an existing job vacancy

  About the team

  Operations Research Software Developers at Kinaxis create
  algorithms to optimize supply chains. Each one of us plays
  an important part in accomplishing our work, building our
  culture, and making a global impact.

  Every day, we are empowered to work together to help our
  customers make fast, confident planning decisions. This is
  how we create a better planet – for each other, for our
  customers and for generations to come. Our cloud-based
  platform Maestro ensures that the products we need –
  everything from medicine and cars to day-to-day items like
  toothpaste – make it tomarket and into our hands when we
  need them with minimal ecological footprint. Our customers
  have terabytes of data that needs to be analyzed for the
  largest supply chains imaginable.

  What you will do

  - Investigate novel techniques combining class leading
    heuristics with optimization
  - Translate real world Supply Chain Management use cases into
    mathematical model
  - Lead the design and implementation of the mathematical model
  - Define test strategies and develop comprehensive test plans.
  - Write unit testing, integration testing, and debugging to
    ensure robust and error-free software.
  - Design, develop, and maintain automated test scripts for
    functional, regression, and performance testing using
    testing frameworks and tools.
  - Collaborate closely with your agile team members and other
    stakeholders
  - Shape the future direction of Kinaxis as we move into new
    markets
  - Find opportunities to accelerate the SDLC through innovative
    application of AI or other tooling,  while upholding
    architecture consistency, secure design, and code-quality
    standards.
  - Review AI-generated code rigorously for correctness,
    architectural fit, integration risk, and edge case support
    with a growth mindset and bias for experimentation.

  Technologies we use

  - C++ for core development
  - Commercial mathematical solvers
  - Maestro’s market leading in-memory data server technology
    Visual Studio, JIRA, Confluence, Git
  - Sophisticated internal testing tools to validate correctness
    and performance
  - Virtual and cloud infrastructure for development, support
    and testing

  What we are looking for

  Core implementation is primarily in C++, but we value strong
  algorithmic thinkers who are proficient in one or more
  modern programming languages (e.g., C++, C#, Python) and
  willing to work across language boundaries

  - MSc or PhD in Operations Research, Industrial Engineering,
    Computer Science (or related)
  - 7+ years of software development experience, track record of
    delivering commercial software
  - Working knowledge of C++, including object-oriented design
    and design patterns, unit testing
  - A love of data structures and algorithms, and the desire to
    apply them in the real world
  - Experience in creating mathematical models of real-world
    optimization problems.
  - Experience in commercial solvers (Gurobi, Xpress, CPLEX)
  - Ability to design, develop, and maintain automated test
    scripts for functional, regression, and performance
    testing using testing frameworks and tools.
  - Ability to find opportunities to accelerate the SDLC through
    innovative application of AI or other tooling,  while
    upholding architecture consistency, secure design, and
    code-quality standards.
  - Ability to review AI-generated code rigorously for
    correctness, architectural fit, integration risk, and edge
    case support with a growth mindset and bias for
    experimentation.
  - Nice to have knowledge in machine learning models and
    algorithms

  #Senior; #LI-EM1

  Work With Impact: Our platform directly helps companies
  power the world’s supply chains. We see the results of what
  we do out in the world every day—when we see store shelves
  stocked, when medications are available for our loved ones,
  and so much more.

  Work with Fortune 500 Brands: Companies across industries
  trust us to help them take control of their integrated
  business planning and digital supply chain. Some of our
  customers include Lockheed Martin, Yamaha, P&G, Honda, and
  more.

  Social Responsibility at Kinaxis: Our Diversity, Equity, and
  Inclusion Committee weighs in on hiring practices, talent
  assessment training materials, and mandatory training on
  unconscious bias and inclusion fundamentals. Sustainability
  is key to what we do and we’re committed to net-zero
  operations strategy for the long term. We are involved in
  our communities and support causes where we can make the
  most impact.

  People matter at Kinaxis and these are some of the perks and
  benefits we created for our team:

  - Flexible vacation and Kinaxis Days (company-wide day off on
    the last Friday of every month)
  - Flexible work options
  - Physical and mental well-being programs
  - Regularly scheduled virtual fitness classes
  - Mentorship programs and training and career development
  - Recognition programs and referral rewards
  - Hackathons

