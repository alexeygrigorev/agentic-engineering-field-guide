  Job Description:

  3M Health Care is now Solventum

  At Solventum, we enable better, smarter, safer healthcare to
  improve lives. As a new company with a long legacy of
  creating breakthrough solutions for our customers’ toughest
  challenges, we pioneer game-changing innovations at the
  intersection of health, material and data science that
  change patients' lives for the better while enabling
  healthcare professionals to perform at their best. Because
  people, and their wellbeing, are at the heart of every
  scientific advancement we pursue.

  We partner closely with the brightest minds in healthcare to
  ensure that every solution we create melds the latest
  technology with compassion and empathy. Because at
  Solventum, we never stop solving for you.

  The Impact You’ll Make in this Role

  As a Senior Software Engineer, you will have the opportunity
  to tap into your curiosity and collaborate with some of the
  most innovative and diverse people around the world. Here,
  you will make an impact by:

  - Leading thoughtful work to accomplish healthcare initiatives
  - Implementing solutions within healthcare industry
  - Determining some of the best methods to satisfy our customer
    needs
  - Supporting teams within 3M R&D to deliver solutions that
    impress our clients
  - Creating out of the box thinking and solutions for our
    customer base

  Your Skills and Expertise

  To set you up for success in this role from day one,
  Solventum requires (at a minimum) the following
  qualifications:

  - Bachelor or higher (completed and verified prior to start)
    from an accredited institution and eight (8) years of
    experience in software development.

  OR

  - High School Diploma/GED from an accredited institution and a
    minimum of twelve (12) years of experience in software
    development.

  AND

  In addition to the above requirements, the following are
  also required.

  - Minimum of 8 years of experience as a Java/Kotlin Enterprise
    Developer (Spring, MVC) with Postgres (or similar)
    integration.
  - Minimum 5 years of experience as full stack engineer
    developing web applications and component libraries using
    React/Angular framework preferably with EMR integration.
  - Minimum 5 years of experience in developing & interfacing
    with services through REST APIs.
  - Minimum 5 years of experience with cloud architectures and
    large-scale hosted applications (preferably AWS).

  Additional qualifications that could help you succeed even
  further in this role include:

  - Experience working in an Agile team with strong test
    automation.
  - Ability to work independently and collaboratively in a team
    environment including distributed teams.
  - Ability to effectively communicate ideas, concepts, and
    information on both the user and the technical level.
  - Unit testing experience (e.g. Karma, Jasmine).
  - Experience in healthcare.

  Travel: Occasional travel may be required

  Work location: Remote

  Relocation Assistance: Not authorized

  Must be legally authorized to work in country of employment
  without sponsorship for employment visa status (e.g., H1B
  status).

  Supporting Your Well-being

  Solventum offers many programs to help you live your best
  life – both physically and financially. To ensure
  competitive pay and benefits, Solventum regularly benchmarks
  with other companies that are comparable in size and scope.

  By applying to this position, you acknowledge that Solventum
  recently publicly announced its intention to divest its
  Health Information Systems Business. See Solventum Announces
  Intent to Separate its Health Information Systems Business
  :: Solventum Corporation Newsroom. No decision has been made
  regarding the ultimate structure or timing of any potential
  transaction, and there can be no assurance that a separation
  will occur. Any transaction would be subject to customary
  approvals, including approval by Solventum's Board of
  Directors, regulatory requirements and other customary
  conditions. This position supports the Health Information
  Systems Business. If a future transaction involving that
  business were to occur, the impact on this role would be
  determined as part of that process and would remain subject
  to applicable legal requirements, approvals and business
  decisions.

  Onboarding Requirement: To improve the onboarding
  experience, you will have an opportunity to meet with your
  manager and other new employees as part of the Solventum new
  employee orientation. As a result, new employees hired for
  this position will be required to travel to a designated
  company location for on-site onboarding during their initial
  days of employment. Travel arrangements and related expenses
  will be coordinated and paid for by the company in
  accordance with its travel policy. Applies to new hires with
  a start date of October 1st 2025 or later.Applicable to US
  Applicants Only:The expected compensation range for this
  position is $124,000 - $170,500, which includes base pay
  plus variable incentive pay, if eligible. This range
  represents a good faith estimate for this position. The
  specific compensation offered to a candidate may vary based
  on factors including, but not limited to, the candidate’s
  relevant knowledge, training, skills, work location, and/or
  experience. In addition, this position may be eligible for a
  range of benefits (e.g., Medical, Dental & Vision, Health
  Savings Accounts, Health Care & Dependent Care Flexible
  Spending Accounts, Disability Benefits, Life Insurance,
  Voluntary Benefits, Paid Absences and Retirement Benefits,
  etc.). Additional information is available at:
  https://www.solventum.com/en-us/home/our-
  company/careers/#Total-Rewards



