title: Software Engineer, Trading Systems (C++)
company: Tower Research Capital
location: New York, USA
work_type: FULL_TIME
company_size: 1,056 Employees
description: |
  Tower Research Capital is a leading quantitative trading
  firm founded in 1998. Tower has built its business on a
  high-performance platform and independent trading teams. We
  have a 25+ year track record of innovation and a reputation
  for discovering unique market opportunities.

  Tower is home to some of the world’s best systematic trading
  and engineering talent. We empower portfolio managers to
  build their teams and strategies independently while
  providing the economies of scale that come from a large,
  global organization.

  Engineers thrive at Tower while developing electronic
  trading infrastructure at a world class level. Our engineers
  solve challenging problems in the realms of low-latency
  programming, FPGA technology, hardware acceleration and
  machine learning. Our ongoing investment in top engineering
  talent and technology ensures our platform remains unmatched
  in terms of functionality, scalability and performance.

  At Tower, every employee plays a role in our success. Our
  Business Support teams are essential to building and
  maintaining the platform that powers everything we do —
  combining market access, data, compute, and research
  infrastructure with risk management, compliance, and a full
  suite of business services. Our Business Support teams
  enable our trading and engineering teams to perform at their
  best.

  At Tower, employees will find a stimulating, results-
  oriented environment where highly intelligent and motivated
  colleagues inspire each other to reach their greatest
  potential.

  Responsibilities

  - Architect and evolve the trading platform to support the
    changing needs of quantitative research, simulation, and
    production trading, with particular emphasis on market
    data and execution systems.
  - Partner closely with quantitative researchers, traders, and
    software engineers to design, implement, and deploy
    systematic trading strategies.
  - Design and develop high-performance trading infrastructure
    responsible for collecting market data, processing trading
    signals, and routing orders to exchanges around the world.
  - Build frameworks and tools that enable researchers to
    rapidly prototype, backtest, analyze, and deploy new
    trading strategies.
  - Develop scalable systems that provide efficient access to
    live and historical market data for research, simulation,
    and production use cases.
  - Collaborate with researchers to translate quantitative
    models into robust, maintainable production systems. Lead
    development efforts across the strategy lifecycle, from
    research tooling and data infrastructure to production
    deployment and monitoring.
  - Optimize trading and research systems through low-latency
    software design, network programming, performance
    analysis, and systems-level engineering.
  - Create tools and analytics that help identify market
    patterns, evaluate strategy performance, and improve
    trading decisions.
  - Build risk management, monitoring, and performance
    attribution systems used by researchers and traders.
    Investigate production trading behavior and partner with
    strategy teams to diagnose performance, execution, and
    market data issues.
  - Contribute to the architecture of shared platforms that
    improve productivity across research, development, and
    trading teams.

  Qualifications

  - Degree in Computer Science, Engineering, Mathematics,
    Physics, or a related technical field.
  - Strong foundation in algorithms, data structures,
    distributed systems, and software design.
  - Excellent programming skills in C++, with experience in
    Python strongly preferred.
  - Interest in financial markets, systematic trading, and
    quantitative research workflows.
  - Experience building high-performance systems, data-intensive
    applications, or low-latency software. The ability to
    collaborate effectively with quantitative researchers,
    traders, and engineers to solve complex technical and
    analytical problems.
  - Strong analytical and problem-solving abilities with a focus
    on both correctness and performance.
  - Comfortable managing multiple projects and priorities in a
    fast-paced environment.
  - Strong communication skills and a collaborative mindset.

  Nice to Have

  - Experience with market data systems, exchange connectivity,
    or electronic trading platforms.
  - Experience building research platforms, backtesting systems,
    simulation frameworks, or quantitative analytics tools.
  - Familiarity with statistical analysis, machine learning, or
    quantitative modeling techniques.
  - Experience working in Linux environments and developing
    distributed systems.
  - Knowledge of Python or Rust

  Anticipated New York annual base salary range $120,000 -
  $285,000, plus eligible for discretionary bonus

  Benefits

  Tower’s headquarters are in the historic Equitable Building,
  right in the heart of NYC’s Financial District and our
  impact is global, with over a dozen offices around the
  world.

  At Tower, we believe work should be both challenging and
  enjoyable. That is why we foster a culture where smart,
  driven people thrive – without the egos. Our open concept
  workplace, casual dress code, and well-stocked kitchens
  reflect the value we place on a friendly, collaborative
  environment where everyone is respected, and great ideas
  win.

  Our benefits include:

  - Generous paid time off policies
  - Savings plans and other financial wellness tools available
    in each region
  - Hybrid working opportunities
  - Free breakfast, lunch, and snacks daily
  - In-office wellness experiences and reimbursement for select
    wellness expenses (e.g., gym, personal training and more)
  - Company-sponsored sports teams and fitness events (JPM
    Corporate Challenge, Cycle for Survival, Wall Street Rides
    FAR and more)
  - Volunteer opportunities and charitable giving
  - Social events, happy hours, treats, and celebrations
    throughout the year
  - Workshops and continuous learning opportunities

  At Tower, you’ll find a collaborative and welcoming culture,
  a diverse team and a workplace that values both performance
  and enjoyment. No unnecessary hierarchy. No ego. Just great
  people doing great work – together.

  Tower Research Capital is an equal opportunity employer.
