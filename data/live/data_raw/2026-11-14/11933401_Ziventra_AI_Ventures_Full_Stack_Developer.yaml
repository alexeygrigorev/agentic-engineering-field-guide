description: |
  About Us

  Ziventra is building innovative, scalable technology
  solutions with a strong focus on modern architectures and
  AI-driven applications. We work on cutting-edge products
  that combine robust backend systems with intuitive, high-
  performance frontends.

  Role Overview

  We are looking for a highly skilled Full Stack Developer who
  is passionate about building scalable applications and
  taking end-to-end ownership of features. The ideal candidate
  has strong backend expertise in Python and FastAPI, solid
  frontend experience with modern React ecosystems, and an
  interest in GenAI-powered applications.

  Key ResponsibilitiesBackend Development

  - Design, develop, and maintain scalable backend services
    using Python and FastAPI
  - Write efficient asynchronous code and optimize application
    performance
  - Work extensively with PostgreSQL, including query
    optimization and PL/pgSQL
  - Manage and scale data using MongoDB for high-volume and
    unstructured datasets
  - Build secure, well-documented RESTful APIs

  Frontend Development

  - Develop responsive and user-friendly interfaces using React
    and TypeScript
  - Manage application state with Redux Toolkit
  - Build modern UI components using Tailwind CSS
  - Collaborate closely with designers and backend engineers to
    deliver seamless user experiences

  GenAI & Advanced Applications

  - Contribute to GenAI-powered solutions, including:
    - Large Language Models (LLMs)
    - AI Agents
    - Knowledge Bases (KBs)
    - Retrieval-Augmented Generation (RAG)
    - Semantic Search systems

  DevOps & Deployment

  - Containerize applications using Docker
  - Deploy and manage services on AWS (preferred)
  - Take end-to-end ownership from development to deployment and
    monitoring

  Required Skills & Qualifications

  - Strong experience with Python and FastAPI
  - Solid understanding of async programming concepts
  - Hands-on experience with PostgreSQL and MongoDB
  - Proficiency in React, TypeScript, Redux Toolkit, and
    Tailwind CSS
  - Experience building and consuming REST APIs
  - Familiarity with Docker and cloud platforms (AWS preferred)

  Nice to Have

  - Experience working on GenAI or AI-driven applications
  - Exposure to cloud-native architectures
  - Understanding of scalability, performance optimization, and
    system design

  What We Offer

  - Opportunity to work on cutting-edge GenAI products
  - High ownership and impact-driven role
  - Collaborative and fast-paced work environment
  - Learning and growth with modern tech stacks
