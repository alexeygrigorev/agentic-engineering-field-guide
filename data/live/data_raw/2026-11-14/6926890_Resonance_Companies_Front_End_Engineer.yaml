description: |
  About Us

  Resonance is building a more sustainable and valuable
  fashion industry for designers, brands, manufacturers,
  consumers, and the planet. The company’s AI-powered
  operating system ONE enables Brands to Design, Sell and Make
  in that order, empowering designers to operate with no
  unnecessary inventory—eliminating the financial and
  environmental burdens of the legacy fashion industry.

  Headquartered in New York City and Santiago, Dominican
  Republic, Resonance has partnered with more than 30 brands,
  including THE KIT and Rebecca Minkoff to create garments
  that use 97% less dye, 70% less water, and 50% less material
  than any other fashion brand—and immediately eliminate
  overproduction.

  Want to know more? Visit our website and read articles about
  us.

  About the Role

  We’re looking to add a front-end software engineer to our
  team to report directly to our technical cofounder and CEO,
  Christian Gheorghe and rapidly build interactive user
  experiences and interfaces for our brands designing, selling
  and operating on our self-sufficient digital product ONE.
  This role engages across product management, platform
  engineering and design. Individuals in this role supercharge
  our ability to rapidly ship new experiences and learn from
  live users.

  Responsibilities include:

  - Build best in class user experiences for highly visual,
    creative users across a myriad of functions including: 3D
    design, e-commerce/channel selling systems, planning
    tools, and more.
  - Scope, design and lead implementation of technical projects,
    laying groundwork for early-stage products to iteratively
    evolve and scale.
  - Ensure UI components and libraries are reliable, secure and
    accessible.
  - Independently and collaboratively solve UI/UX design
    problems, including debugging for long term stability.

  You may be a good fit if the following describes you:

  You’re a coder, a hacker, an engineer at heart. You like to
  create something from nothing. You appreciate beautiful,
  highly opinionated, custom built, user experiences and
  design systems. You are intensely curious and desire a role
  where you collaborate with creators, designers and
  manufacturers. You have love for analog and digital
  products, from vinyl LPS to beautiful VR applications.

  Requirements

  Job Requirements

  - 3+ years of experience developing design systems.
  - Strong foundation in front-end frameworks, design patterns,
    data structures, storage systems and web services.
  - Proficient in web technologies: React, JavaScript, HTML,
    CSS, modern package bundlers/task runners and testing
    tools.
  - Experience with CI/CD pipelines and how to integrate
    frontend applications in that pipeline.
  - Experience with Webpack, Storybook, GraphQL, and AWS a plus.
  - Able to independently solve UI/UX design problems.
  - Computer Science Background
  - Comfortable with being given clearly-defined goals but full
    ownership and responsibility for discovering the path to
    achieve those goals.
  - Ability to succeed in a constantly changing, fast-paced
    environment. Making mistakes means we are learning, and
    you welcome actively seeking ways to grow

  Benefits

  - We offer full benefits (medical, dental, and vision), a
    competitive salary and equity
  - Resonance Companies is an equal opportunity employer and
    values diversity in our company. We do not discriminate on
    the basis of race, religion, color, sex, gender identity,
    sexual orientation, age, non-disqualifying physical or
    mental disability, national origin, veteran status, or any
    other basis covered by appropriate law. All employment is
    decided on the basis of qualifications, merit, and
    business need.
