description: |
  About Numeral:

  At Numeral, we're building the future of tax by bringing
  together AI agents, human expertise, and global compliance.

  We’re the largest and fastest-growing AI-native tax
  solution. Today, we serve more than 3,500 global businesses,
  including companies like Supabase, Eight Sleep, and Graza.
  We’ve grown quickly across our core e-commerce and software
  segments, more than tripled our revenue every year, and
  expanded into new industries, including manufacturing,
  distribution, and wholesale.

  Numeral has raised over $157M from Insight Partners,
  Salesforce Ventures, Benchmark, Mayfield, Y Combinator, and
  many others.

  About the role:

  We’re looking for a Software Engineer who combines strong
  engineering fundamentals with business acumen and a metrics-
  focused mindset. You’ll build customer-facing features,
  integrations, and internal tools, owning projects from idea
  to production and measuring their impact.

  Our Growth Engineering team builds software that helps
  Numeral acquire, onboard, and retain customers. We partner
  closely with Product, Sales and Marketing to turn
  opportunities across the customer journey into measurable
  business outcomes.

  What you’ll do:

  - Build product features, backend services, and internal tools
    that help Numeral grow.
  - Improve customer workflows across signup, onboarding,
    activation, and renewals.
  - Partner with Sales, Marketing, and Customer Success to
    identify and solve business problems.
  - Own engineering projects end-to-end, from scoping through
    deployment and iteration.
  - Instrument key workflows, define success metrics, and
    measure business impact.
  - Run experiments and use data and customer feedback to guide
    improvements.
  - Write reliable, maintainable code and balance iteration
    speed with engineering quality.

  What you'll bring:

  - 2+ years of software engineering experience shipping
    production software.
  - Strong debugging and problem-solving skills.
  - Experience with backend technologies like Node.js,
    PostgreSQL, Redis, and cloud services (AWS preferred).
  - Business acumen: ability to connect technical decisions to
    customer and business outcomes.
  - A metrics-focused mindset and comfort using data to
    prioritize and evaluate work.
  - Ownership: you take initiative and drive projects from idea
    to production.
  - Excellent communication and collaboration with technical and
    non-technical teammates.
  - Startup mentality: comfortable with ambiguity and excited
    for rapid growth.

  Nice to haves:

  - Experience building software in Sales or Marketing space.
  - Projects involving onboarding, activation, retention,
    renewals, or expansion.
  - Experience working in or with Growth functions.

  Location:

  - This role is hybrid (3 days a week in our NYC office)

  What we offer:

  - Competitive salary and equity - you'll share directly in the
    company's success
  - Full medical, dental, and vision coverage
  - Wellness perks like Headspace and the Peloton One App
  - 401(k) to help you build long-term financial security
  - Relocation assistance to NYC (if needed)
  - Lunch and snacks when you're in the office
  - Regular team offsites and company events as we grow
  - A culture built on ownership - your work matters and people
    will see it!
