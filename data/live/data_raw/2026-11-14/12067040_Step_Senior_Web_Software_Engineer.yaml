description: |
  About Step

  Step's mission is to improve the financial future of the
  next generation. Millions of people use our banking and
  borrowing products to manage, build, and grow their money.
  Now that we're part of Beast Industries – the company behind
  MrBeast – we're poised for a new phase of growth to deliver
  financial literacy and tools at massive scale.



  The role

  Step is looking for a Senior Web Software Engineer.

  What you'll do

  - Build and maintain the library of components used for our
    public Step website.
  - Own features throughout their life cycle, from inception to
    production.
  - Create and implement styling and animations to bring our web
    designs to life.
  - Manage our content platform, server-side rendering, site
    generation, and migrating functionality from the mobile
    app to web.
  - Partner cross-functionally with product, design, and growth
    teams to build new web functionality.
  - Work in a small, tight-knit cross-functional team.
  - See your contributions make a weekly impact to an evolving
    product.

  What we're looking for

  - 6+ years of overall experience working on front-end
    development.
  - Strong Computer Science fundamentals.
  - Passion for software quality.
  - Experience designing, building, and maintaining beautiful
    public-facing websites with React.
  - Strong portfolio of complex web designs (animations, 3D,
    micro-interactions, etc).
  - Advanced knowledge of CSS, animation frameworks (e.g. D3,
    Three.js, etc).

  How we're different

  We stand for the side hustlers, the creators, the
  freelancers, and the investors — people who are not afraid
  to take on challenges, especially when it comes to their
  finances. Step is focused on disrupting the banking industry
  by delivering a differentiated, mobile-first consumer
  experience, and we operate like the customers we serve:
  customer obsessed, acting as owners, moving with urgency,
  and breaking the norm.

  Step is a wholly owned subsidiary of Beast Industries, the
  media and entertainment company founded by Jimmy Donaldson
  (MrBeast), the most-watched person in the world. Beast
  Industries spans digital media, consumer products,
  philanthropy, and new ventures, with an audience reach no
  consumer company has ever had — and Step is tasked with
  turning that reach into financial literacy and tools for the
  next generation at massive scale. With Beast's distribution
  and brand behind it, Step is positioned to scale
  significantly over the next 12 months, and joining now means
  helping shape that trajectory from the inside.

  Come work with us!

  Step is a remote-first company building banking for the next
  generation. We offer competitive compensation and stock
  options, generous medical, dental, vision, and company-paid
  life insurance, a 401k plan with Safe Harbor company
  matching, a flexible vacation policy and paid company
  holidays, 12 weeks paid parental leave with flexible return
  to work, and a company-provided technology package. If
  you're looking to join a fast-growing company with a strong
  mission and vision that puts people first, we want to meet
  you!

  Step is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, age, disability, veteran status, or any
  other status protected by applicable federal, state, or
  local law.

  Step is committed to providing reasonable accommodations to
  qualified individuals with disabilities throughout the
  application and interview process. If you need an
  accommodation, please let us know at people@step.com and
  we'll work with you to provide appropriate support.
