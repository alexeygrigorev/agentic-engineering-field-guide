description: |
  About Varnish Software

  Varnish Software is redefining how the world’s leading
  organizations build resilient, high-performance delivery
  platforms. We empower businesses to secure and accelerate
  their CI/CD pipelines by caching and validating software
  dependencies, integrating platform engineering best
  practices and robust supply chain security directly into
  their infrastructure. While our core technology remains the
  industry standard for lightning-fast web and streaming, we
  are expanding into helping customers build, secure, and
  scale their development ecosystems with confidence.

  To help us support our customers in developing and
  implementing solutions for their biggest challenges, we are
  looking for customer-facing engineers who can deliver either
  remote or onsite customer Varnish projects.

  About the Role

  As a Solutions Engineer at Varnish, you will:

  - Consult with customers on modernizing their delivery
    pipelines, focusing on platform engineering best practices
    and software supply chain security integrations
  - Become the go-to technical expert on Virtual Registry,
    Artifact Firewall and potential future products within the
    business area
  - Work with our sales team on active opportunities: discovery,
    demos, workshops, proof-of-concepts and architecture fit
  - Increase win rate in technically complex deals
  - Deliver custom implementation projects such as onboarding,
    monitoring, high availability, integration and development
  - Travel frequently to meet and work with customers, including
    some of the biggest brands in their markets (with
    flexibility depending on location and project needs)
  - Work directly with our Engineering teams to come up with
    solutions to meet new requirements
  - Have a significant impact on technical and architectural
    decisions for some of our customers
  - Work alongside our existing Solutions Engineers in Europe
    and the US

  Qualifications

  You are an engineer first, meeting the following
  requirements:

  - A technical background in software engineering, DevOps, SRE,
    platform engineering or infrastructure
  - Strong Linux background
  - Hands-on experience with CI/CD pipelines and build tooling
  - Solid understanding of software supply chain security
    concepts
  - Proven experience in a customer-facing technical role, such
    as Solutions Engineering, Technical Account Management,
    Technical Support, or Pre-Sales, where explaining
    technical concepts and architectural trade-offs was part
    of the job
  - Strong communication skills: comfortable running a demo, a
    workshop or a technical deep dive with engineering teams,
    and explaining value to business decision makers
  - Adaptable to new technological trends
  - Fluent in both written and spoken English
  - Please note: Applicants must be legally authorized to work
    in the countries where the role is located.

  It's a bonus, but not a requirement, if you can demonstrate
  the following:

  - Hands-on software supply chain experience: artifact
    repositories, package managers (npm, PyPI, Maven,
    container registries), DevSecOps tooling
  - Hands-on experience with Varnish Cache and/or VCL
  - Knowledge of web, HTTP, or API security concepts, such as
    WAF or WAAP
  - Experience at or with JFrog, Sonatype, Cloudsmith or similar
    vendors
  - Commercial awareness or experience supporting technically
    complex sales cycles
  - Prior experience working closely with R&D or product teams
    on customer-driven improvements

  Our Team

  At Varnish Software, we take pride in our software and
  products, and we value innovation. We strive to hire team
  members who share our values. You will join a new business
  area at an early stage, where your input shapes how we sell
  and support our products. We offer an open, honest, and
  international culture in a relaxed and stimulating work
  environment. You will be working with some of the brightest
  and most talented people in the industry. We offer
  competitive salaries and benefits, generous vacation time, a
  hybrid working context, growth & development programs, and
  more.

  Varnish Software is an equal opportunity employer. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, national origin, age, or disability.

  What We Offer

  - Real influence on a young product line, from roadmap input
    to how customers adopt it
  - A happy, creative, non-hierarchical work environment in
    which you are a valued member of our organization
  - An international environment with offices and colleagues all
    over the world
  - An opportunity to showcase your work in community meetups
    and other conferences where applicable
  - Involvement in the complete lifecycle of software products
  - Interaction and cooperation with top global customers
  - Participate in presenting Varnish’s technology at major
    industry conferences
  - Opportunities for your professional growth and development

  How to Apply

  Ready to join our team? Click the Apply button to get
  started. We’re excited to learn more about you, your
  strengths, and how you could contribute to our success.

  Please note: Applicants must be legally authorized to work
  in the countries where the role is located.

  Target start date is January 2027.
