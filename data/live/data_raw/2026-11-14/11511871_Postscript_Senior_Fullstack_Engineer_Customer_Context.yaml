description: |
  Postscript is the AI messaging platform trusted by 20,000+
  Shopify brands — including Brooklinen, Ruggable, True
  Classic, and Dr. Squatch.

  With a mission to make SMS your number one revenue driving
  channel, we built the best-in-class SMS marketing platform
  and launched revenue-driving AI features not available on
  any other platform. And we're just getting started.

  Backed by Greylock and Y Combinator, fully remote since
  2018.

  We are looking for a polyglot Senior Fullstack Engineer to
  join the Customer Context  team. You’ll help build and scale
  the foundational services, APIs, and pipelines that power
  the Postscript product. This role blends strong backend
  engineering skills with a deep appreciation for data
  intensive systems, performance, and reliability. You’ll
  collaborate closely with other software engineers, data
  engineers, and product to help e-commerce marketers maximize
  their revenue with best-in-class targeting and context-
  driven AI.

  This is a high-autonomy role for engineers who are energized
  by ambiguity, take genuine ownership of their work, and
  bring a strong point of view on how to build things well,
  without sacrificing speed or pragmatism. AI isn't a nice-to-
  have here — it's central to how we work. We expect our
  engineers to be active practitioners of AI-first
  development: fluent with the latest agentic coding tools,
  curious about what's emerging, and constantly pushing the
  boundary of what's possible with AI in their day-to-day
  craft. If you're the kind of engineer who's already
  experimenting with new models and tooling before anyone asks
  you to, you'll feel at home here.

  As a senior engineer at Postscript, you’ll no longer be only
  writing code but orchestrating it.

  This position is fully remote and can be based in the US or
  Canada.

  What You'll Do

  - Take deep ownership of systems and product areas on your
    team, and become the go-to technical expert for what you
    own
  - Independently investigate, design, and execute solutions
    across distributed systems with a high degree of ambiguity
  - Architect, build, and maintain highly available, scalable
    REST APIs and backend services for internal and external
    use
  - Drive system decoupling, modularization, and technical debt
    reduction.. Improve long-term maintainability without
    blocking near-term delivery
  - Build agentically as your default: leveraging concurrent
    autonomous agent workflows, owning the output, and keeping
    a steady queue of aligned work moving
  - Stay at the forefront of emerging AI tooling and practices,
    bringing new techniques back to the team and helping raise
    the floor for how Postscript engineers work
  - Contribute to how we think about integrating AI into our
    systems and workflows. That means not just using AI tools,
    but helping shape where and how AI creates leverage across
    the engineering org
  - Collaborate cross-functionally with product, data, and go-
    to-market teams by communicating clearly and proactively
    in an async-first environment
  - Identify and eliminate single points of failure, improving
    system resilience and knowledge redundancy across your
    team
  - Improve how engineering gets done: bring better tools, fix
    workflow friction, build internal utilities when the
    leverage compounds

  What We're Looking For

  - 6+ years of experience building large-scale data-intensive
    backend systems and APIs
  - You are an active, daily user of AI coding tools and are
    using them to maximize your output — Claude Code, Codex,
    Cursor, Copilot, or equivalent — and can speak concretely
    to how they've changed your output and your workflow
  - Some or all of these languages: Python, Go, Rust, React, and
    TypeScript
  - You follow the AI tooling landscape closely: new model
    releases, emerging agentic workflows, and evolving best
    practices aren't things you catch up on eventually.
  - You think critically about AI output and you know where it
    accelerates you, where it introduces risk, and how to
    verify what it produces
  - You are able to context switch quickly across concurrent
    workstreams
  - Experience working on both 0-to-1 initiatives and complex
    existing systems, and knowing how to balance building new
    things with improving what's there
  - You have working knowledge of event-driven distributed
    systems, Kafka, and familiarity with distributed data
    processing technologies (Flink/Spark/etc)
  - Experience growing systems under production customer load,
    ideally from early days to the multi-terabyte stage
  - Experience building and designing high-scale systems AWS
    with a broad variety of database technologies (RDBMS,
    OLAP, NoSQL, etc.)
  - You know how to intelligently model relational data and
    design index strategies. You write performant SQL for
    transactional and analytical workloads
  - Experience with infrastructure as code (eg, Terraform). You
    are comfortable evaluating and applying your infra
    changes.
  - Familiarity building and observing applications on AWS &
    Kubernetes, ideally with Datadog, Signoz, or comparable
    observability tooling
  - Clear, direct communication. Cross-functional partners and
    async teams can count on you to surface information
    proactively
  - Strong instincts for technical tradeoffs informed by both
    engineering best practices and business priorities

  What You'll Love About Us

  - Salary range of USD $175,000–$220,000 base plus significant
    equity (we do not have geo-based salaries)
  - High growth startup — plenty of room for you to directly
    impact the company and grow your career
  - Work from home (or wherever in US / Canada)
  - Fun — we're passionate and enjoy what we do
  - Competitive compensation and opportunity for equity
  - Flexible paid time off
  - Health, dental, vision insurance

  For information about how we use your personal data, please
  see our U.S. Job Applicant Privacy Notice

  You are welcome here. Postscript is an ever-evolving place
  of equal employment for talented individuals.
