description: |
  This is a remote position.



  The senior software engineer position is focused on a modern
  technology stack using the latest software development
  frameworks, data-intensive distributed microservices,
  relational and nonrelational database management systems,
  and containerized cloud infrastructure within a well-
  established continuous-delivery and Agile development
  process. You’ll help us with our mission and commitment to a
  sustainable future.




  The ideal candidate will have expertise in Java programming,
  Docker, and data modeling. You should have strong knowledge
  of software design patterns and be able to work both
  independently and through team collaboration. You should be
  able to break down complex software initiatives into clear
  and manageable developer-ready user stories. You must be
  able to review your peers’ code and provide recommendations,
  and willing to stay up to speed on the latest trends in
  distributed systems, containerization, microservices, and
  event-driven technologies. You should have strong leadership
  skills with the ability to develop and mentor the junior
  engineers on the team.




  What you’ll do



  - Collaborate with product and engineering leadership to help
    define product architecture and implement secure,
    reliable, scalable software products
  - Collaborate with internal and client stakeholders to
    translate business problems into technical solutions
  - Mentor junior software engineers on best practices for
    building scalable cloud applications
  - Participate in continuous learning activities to understand
    latest technology trends and share knowledge across the
    team and organization








  What will make you a good fit



  - At least five years of experience in Java (8 or 11+)
    software development
  - Experience architecting software solutions within the AWS
    Cloud Platform
  - Experience with data modeling and relational database design
    and implementation
  - Experience with NoSQL databases such as MongoDB and
    Cassandra
  - Experience with enterprise integration patterns and creating
    and managing microservices in a containerized environment
    (Spring Boot, Docker, and Kubernetes)
  - Experience with knowledge graph technologies and techniques
  - Experience programming with Python
  - Experience working with GIT and GITOPS, and building CI/CD
    pipelines with Jenkins or AWS code pipelines
  - Product-oriented mindset
  - Proven track record of efficiently designing, developing,
    and releasing software products both independently and
    collaboratively
  - Creative mind, keen ability, and the initiative to think
    beyond
  - Ability to effectively communicate with technical teams and
    business stakeholders
  - Passion for energy and the environment
  - BS or MS in software engineering, computer science, or a
    related field of study
