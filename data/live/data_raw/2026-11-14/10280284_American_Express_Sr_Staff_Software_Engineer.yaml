description: |
  The U.S. Consumer Services and Membership Digital
  Experiences Technology team (USCDT) brings together
  foundational strategic technology capabilities in digital
  experience engineering (Mobile and Web), marketing and
  advertising technology, enterprise communications, travel
  and lifestyle, and dining technology. It employs a ground-
  breaking focus with development responsibilities for
  customer-facing capabilities that deepen and expand digital
  engagement, as well as core technical capabilities that cut
  across business lines and customer segments.

  The Marketing Transformation team is part of USCDT, employs
  a ground-breaking focus with development responsibilities
  for customer & marketer facing capabilities that deepen and
  expand digital engagement, as well as core technical
  capabilities that cut across business lines and customer
  segments. The Marketing Transformation team leads the
  technology strategy and engineering delivery of marketing
  activities, campaigns, and management of marketing assets.

  How will you make an impact in this role?

  We are seeking a Senior Staff Software Engineer specializing
  in Adobe Experience Cloud and enterprise digital
  architecture to lead the design, implementation, and
  evolution of American Express's customer experience
  platforms. This role combines deep technical expertise with
  strategic architectural leadership to deliver scalable,
  secure, and personalized digital experiences across web and
  mobile channels.

  As a Senior Staff Software Engineer, you will define
  enterprise architecture standards, drive platform
  modernization initiatives, and partner with engineering,
  product, marketing, security, and infrastructure teams to
  build next-generation customer engagement capabilities. You
  will serve as a technical leader across multiple engineering
  organizations while remaining hands-on with architecture,
  solution design, and implementation.

  Responsibilities

  - Define the enterprise architecture and technical roadmap for
    Adobe Experience Cloud platforms, including Adobe
    Experience Manager (AEM), Adobe Analytics, Adobe Customer
    Journey Analytics, Adobe Journey Optimizer, and Adobe
    Experience Platform.
  - Lead architecture for highly scalable, cloud-native digital
    experiences supporting millions of customers globally.
  - Design reusable architecture patterns, integration
    frameworks, and reference implementations for Adobe
    ecosystem services.
  - Drive enterprise integration between Adobe Experience Cloud,
    customer identity platforms, CRM systems, APIs, and
    internal business services.
  - Collaborate with product, UX, marketing technology, data
    engineering, and security teams to deliver omnichannel
    customer experiences.
  - Architect event-driven solutions leveraging APIs, messaging
    platforms, and real-time customer data.
  - Provide technical leadership during solution design reviews,
    architecture governance, and production readiness
    assessments.
  - Mentor senior engineers, architects, and technical leads
    while fostering engineering excellence across multiple
    teams.
  - Evaluate emerging Adobe capabilities and industry
    technologies to drive continuous platform innovation.
  - Lead complex modernization initiatives, migration
    strategies, and enterprise platform transformations.
  - As a Senior Staff Software Engineer, you will:
  - Establish technical vision and long-term architecture
    strategy for enterprise digital platforms.
  - Influence engineering decisions across multiple
    organizations without direct management responsibility.
  - Drive engineering excellence through architecture reviews,
    mentoring, and technical governance.
  - Balance innovation with operational excellence, security,
    scalability, and reliability.
  - Champion customer-centric engineering practices and modern
    software development methodologies.Success Measures
  - Improved scalability and reliability of enterprise digital
    platforms.
  - Increased adoption of standardized architecture patterns
    across engineering teams.
  - Successful delivery of enterprise Adobe Experience Cloud
    initiatives.
  - Reduced operational complexity through platform
    modernization and reusable engineering solutions.
  - Enhanced customer experience through personalization,
    content delivery optimization, and real-time engagement
    capabilities.

  Qualifications

  - 12+ years of software engineering experience with
    enterprise-scale distributed systems.
  - 5+ years leading enterprise architecture or Staff/Principal
    engineering initiatives.
  - Extensive experience implementing and architecting Adobe
    Experience Cloud solutions.
  - Deep expertise with Adobe Experience Manager (AEM) Sites,
    Assets, and Headless CMS.
  - Experience with Adobe Experience Platform (AEP), Adobe
    Target, Adobe Analytics, Adobe Campaign, and Adobe Journey
    Optimizer.
  - Strong knowledge of enterprise integration patterns, REST
    APIs, GraphQL, microservices, and event-driven
    architecture.
  - Experience building cloud-native solutions using AWS, Azure,
    or Google Cloud Platform.
  - Strong understanding of authentication, authorization,
    identity management, and enterprise security principles.
  - Proven ability to influence technical direction across
    multiple engineering organizations.
  - Preferred QualificationsAdobe Certified Expert (ACE) or
    Adobe Certified Master certifications.
  - Experience implementing Adobe Edge Delivery Services and
    headless content architectures.
  - Knowledge of Adobe Real-Time CDP and customer data
    platforms.
  - Experience with Kubernetes, Docker, Kafka, and distributed
    event streaming.
  - Familiarity with financial services, regulated environments,
    and enterprise compliance requirements.
  - Experience leading multi-year digital transformation
    programs.
  - Strong executive communication and stakeholder management
    skills.Depending on factors such as business unit
    requirements, the nature of the position, cost and
    applicable laws, American Express may provide visa
    sponsorship for certain positions.
