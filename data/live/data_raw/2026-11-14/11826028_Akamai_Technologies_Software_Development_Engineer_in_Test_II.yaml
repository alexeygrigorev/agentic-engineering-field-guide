description: |
  Are you passionate about system performance, reliability,
  and security?

  Does the opportunity to improve the platform running
  Akamai's AI and Compute platform excite you?

  Join our Cloud Platform Infrastructure Group - Linux
  Infrastructure team

  Our team is part of Cloud Platform Infrastructure Group. At
  the core of Akamai infrastructure, we work on complex and
  exciting systems that are available 24/7.

  Partner with the best

  You will lead the test strategy for Akamai's custom Linux
  kernel with some focus on functionality and support of new
  hardware platforms. You will design scalable continuous
  testing infrastructure and troubleshoot complex system
  issues. This will help validate feature functionality and
  maximize the performance of a global AI and Compute platform
  known for its dependability.

  As a Software Development Engineer in Test II, you will be
  responsible for:

  - Designing, building, and scaling advanced automated test
    frameworks to validate the hardware compatibility,
    performance, reliability, and security of Akamai's Linux
    kernel and OS imaging process
  - Developing test suites validating new hardware designs;
    facilitate porting existing Akamai modifications to newer
    versions of the Linux kernel and VM infrastructure
    software
  - Debugging, isolating, and troubleshooting complex, low-level
    system issues found in a variety of testing and simulated
    production environments
  - Architecting and enhancing existing build and test
    automation infrastructure to achieve robust, continuous
    integration and testing
  - Learning a variety of new technical skills with an advanced
    team of Senior engineers, improving quality standards of
    the testing organization

  Do what you love

  To be successful in this role you will:

  - Have 2 years of relevant experience and a Bachelor's degree
    or its equivalent
  - Have solid experience in scripting (Python/Shell/Perl) with
    some experience in software validation in C
  - Possess understanding of Linux kernel internals including
    hardware drivers (pcie, gpu hardware, ethernet devices,
    KVM, virtio, cgroups, memory management, file systems,
    block IO, TCP/IP stack)
  - Have familiarity with x86 and server-class arm64
    architectures.
  - Have familiarity with Linux kernel and hardware debugging
    tools, performance benchmarking, and continuous testing/CI
    frameworks
  - Be a motivated self-starter who thrives on collaborating
    with others to solve highly complex infrastructure
    challenges

  About us

  At Akamai, we make life better for billions of people,
  trillions of times a day. Whether you're streaming live
  events, scrolling social media, watching your favorite
  series, or managing your savings, we're the engine behind
  the scenes. We provide the world's most distributed platform
  from Cloud to Edge to help the giants of the digital world
  work faster and stay more secure, making the internet a
  better experience for everyone. Our focus is simple: Cloud
  and Edge: Running apps closer to users for instant
  performance. Security: Neutralizing threats before they ever
  reach your data. Content Delivery: Scaling the world's
  biggest moments without a glitch. AI: Enabling our customers
  to build, secure, and scale AI apps on the world's most
  distributed cloud platform. At Akamai, we don't just support
  the internet; we power and protect it, because behind every
  great digital experience is a massive hidden challenge. And
  we're the ones who solve it. When millions of people hit
  play or pay, Akamai ensures it just works.

  Benefits at Akamai: We support your health, well-being,
  finances, and life beyond work. See our benefits.

  FlexBase adapts to your job's needs

  Akamai's FlexBase program is yet another way we show our
