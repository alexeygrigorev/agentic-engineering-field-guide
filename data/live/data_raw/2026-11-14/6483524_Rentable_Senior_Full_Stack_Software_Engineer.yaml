description: |
  We’re Changing the Rentals Industry We’re a profitable,
  growth-stage company building industry-leading martech and
  data products for the rentals industry. While originally
  known for building and operating one of the U.S.’s largest
  rental marketplaces - Rentable, our focus has shifted to our
  category-leading AI and data SaaS products with triple-digit
  growth rates.

  We’re a fully remote team of 100+ spread across the U.S.
  from coast to coast. We operate on a strict no a**holes
  policy and are proud to have built a community of highly
  performing people that take our work seriously, but not
  ourselves.

  While we’ve raised $30MM+ to date from some of the world’s
  best investors, we’re profitable with a strong balance sheet
  and an indefinite runway. We pride ourselves on achieving
  rapid growth without having to incinerate capital. If you
  like the idea of joining an industry-changing company made
  up of people who genuinely like each other, Rentable could
  be a great fit for you. Your New Team The ApartmentIQ team
  is revolutionizing how property managers optimize their
  operations. We provide a powerful platform that centralizes
  critical property data, offering actionable insights and
  intuitive tools to enhance efficiency and decision-making.
  Our product empowers users to streamline everything from
  leasing and maintenance to resident communication and
  financial reporting.

  We leverage a modern tech stack, with a React/Tailwind
  frontend delivering a seamless user experience, backed by a
  robust Ruby on Rails backend. We believe in fostering an
  inclusive environment built on mutual trust, continuous
  learning, and a commitment to simplicity, where every
  engineer can contribute and grow. The Role

  We're looking for an experienced Senior Software Engineer to
  join our ApartmentIQ team. In this role, you'll work closely
  with engineering leads to ensure our platform operates
  smoothly and effectively, directly contributing to its
  continuous improvement and expansion. You'll primarily focus
  on hands-on development, with opportunities to take on more
  project management responsibilities as you gain deeper
  domain knowledge. If you're passionate about building robust
  software and thrive in a collaborative environment, we
  encourage you to apply. Responsibilities

  - Contribute to the development of new features in a fast
    pace, agile environment.
  - Create engaging and intuitive user interfaces for our
    cutting-edge AI web applications.
  - Lead development and deployment of features in a fast pace,
    agile environment.
  - Engage with product leadership on what features to
    prioritize.
  - Grow professionally, have fun, and add to our remote work
    culture everyday.

  Qualifications

  - 5+ years of experience as a software engineer.
  - Proven track record delivering React + Tailwind front-end
    applications.
  - Ruby on Rails web development experience.
  - Experience building responsive applications across a variety
    of browsers and devices.
  - Strong proficiency in JavaScript / ES6, including DOM
    manipulation and the JavaScript object model.
  - Solid understanding of fundamental web technologies such as
    HTTP, REST, AJAX and JSON.
  - Ability to break down complex problems into digestible
    chunks.
  - Interest or experience in using AI tools to enhance
    productivity.
  - Thrive in fast-paced startup environments and adapts quickly
    to changing priorities.

  Bonus Skills & Experience

  - Familiarity with relational databases, like MySQL.
  - React.js, Redux and similar javascript tools.
  - Taste in modern trends of front-end development.
  - Experience working with designers to build beautiful front
    end experiences.
  - Desire to build simple, user-focused, and intuitive UX.

  Why Our Team

  - 100% remote across the U.S., with quarterly in-person
    gatherings for team offsites
  - Competitive Compensation
  - Flexible vacation and parental leave policies
  - Medical, Dental, and Vision Insurance
  - 100% paid Short-Term Disability, Long-Term Disability, and
    Life Insurance Program
  - 401k Program
  - A supportive, learning-first culture where you’ll help shape
    the next generation of tools for the apartment rental
    industry

  If you need assistance and/or a reasonable accommodation in
  the application or recruiting process, please contact your
  recruiter. Applicants must be authorized to work for any
  employer in the U.S. We are unable to sponsor or take over
  sponsorship of an employment Visa at this time.

  We want to alert you to potential recruiting scams targeting
  job seekers. Please note that our company will never request
  payment, personal information, or any confidential details
  during the interview process.
