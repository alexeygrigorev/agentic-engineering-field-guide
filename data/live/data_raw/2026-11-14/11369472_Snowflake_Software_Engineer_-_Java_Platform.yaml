description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  Build the Future of Data. Join the Snowflake Team.

  We are actively hiring software engineers from Europe and
  around the world for our European Engineering Center. Our
  office is located at Potsdamer Platz, in the heart of
  Berlin. It’s easily accessible by train, subway, bus, or
  bicycle – with numerous restaurants, cafes, and shops within
  walking distance. The official language for this office is
  English.

  This is a fantastic opportunity to join a team of skilled
  engineers, building and maintaining the future of the Java
  infrastructure that powers the data cloud. As part of this
  team, you will work on the core Java libraries and JVM
  infrastructure that support our scalable, high-performance
  platform, impacting millions of users globally.

  AS A SOFTWARE ENGINEER ON THE JAVA PLATFORM TEAM, YOU WILL:

  - Contribute to building the next-generation systems that make
    using Java safe, efficient, and secure
  - Help provide a consistent, high-performance platform that
    Snowflake engineers can use to deliver high-quality
    solutions to production.
  - Identify performance and availability issues, implement
    effective solutions, and instrument key components as
    needed.
  - Collaborate with global teams to solve real-world, large-
    scale challenges in data infrastructure.
  - Continuously improve the reliability and performance of our
    Java infrastructure through proactive monitoring and
    automation.

  WE ARE LOOKING FOR SOFTWARE ENGINEERS WHO:

  - Have experience building, supporting, and troubleshooting
    complex Java systems.
  - Understand Java fundamentals, including the JVM and core
    libraries.
  - Have solid computer science fundamentals, including data
    structures, algorithms, and distributed systems.
  - Are eager to learn about JVM internals and performance
    tuning.
  - Thrive in collaborative environments, contributing to shared
    team goals.
  - Have a BS in Computer Science or equivalent experience
    (advanced degrees a plus).

  Bonus points for:

  - Experience with multi-threading, concurrency, and caching.
  - Knowledge of database or Linux internals.
  - Previous experience with large-scale, high-performance
    systems.

  Join us and be a part of a team that is driving the future
  of the data cloud.

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
