description: |
  McKesson is an impact-driven, Fortune 10 company that
  touches virtually every aspect of healthcare. We are known
  for delivering insights, products, and services that make
  quality care more accessible and affordable. Here, we focus
  on the health, happiness, and well-being of you and those we
  serve – we care.

  What you do at McKesson matters. We foster a culture where
  you can grow, make an impact, and are empowered to bring new
  ideas. Together, we thrive as we shape the future of health
  for patients, our communities, and our people. If you want
  to be part of tomorrow’s health today, we want to hear from
  you.

  The Specialty Access & Affordability value stream is seeking
  a Senior Engineering Manager to lead the FastAuth team.
  FastAuth is central to how we move specialty prescriptions
  through prior authorization faster, reducing the time
  between a prescription being written and a patient starting
  therapy.

  This is a role for a leader who manages significant
  complexity and can carry multiple major workstreams at once.
  You will own delivery, team health, and technical direction
  for FastAuth, and you will operate as a peer to the other
  engineering leaders in the value stream on decisions that
  reach beyond your own team. You will lead a group of skilled
  engineers working across React front ends, .NET services,
  and event-driven integrations on Azure, on a team that ships
  continuously and owns what it builds.

  What You'll Do

  Delivery and execution

  - Plan and execute across multiple workstreams, setting goals
    at the right altitude and holding the team accountable to
    them
  - Prioritize investment across your portfolio of projects and
    refocus effort when results are not moving the business
    forward
  - Run efficient operating cadences within SAFe, including PI
    planning, while minimizing work about work
  - Unblock the team by addressing root causes rather than
    symptoms
  - Ensure delivery results do not come at the expense of long-
    term growth, retention, or psychological safety

  Technical and strategic direction

  - Define a vision for FastAuth that aligns to value stream and
    company priorities, and bring engineers and cross-
    functional partners along with it
  - Partner with architects and staff engineers on design
    decisions across TypeScript, React, .NET, Azure, and
    event-driven architecture
  - Resolve misalignment with partner teams and stakeholders who
    hold different goals
  - Serve as a steady presence through change, and coach the
    team through complexity and ambiguity

  Team and talent

  - Attract, hire, and retain a diverse and talented engineering
    team, with an eye on long-term org health rather than the
    immediate opening
  - Interview and assess senior candidates, and keep your team
    calibrated as interviewers
  - Hold the team to clear performance expectations, motivating
    high performers and turning around low performers
  - Grow careers deliberately by matching development
    opportunities to individual goals and offering next-level
    work to those ready for it
  - Structure the team so the right people are in the right
    roles, and plan headcount for sustained success

  Collaboration and culture

  - Break down silos across engineering, product, design, and
    quality, and influence toward the best outcome for the
    business rather than the local optimum
  - Build deep cross-functional relationships, facilitate the
    right conversations, and settle disagreements by managing
    competing viewpoints
  - Disagree and commit when that is what moves a critical
    priority forward
  - Remove barriers to inclusion, surface cultural issues
    proactively, and follow through when something is off
  - Write and speak with clarity, tailoring the message to the
    audience, and share information so the right people stay
    aligned

  Priority will be given to candidates who reside in the
  Columbus, OH metropolitan area.

  We are unable to provide sponsorship for this role presently
  or in the future.

  Minimum Requirements

  Degree or equivalent experience, plus typically 10+ years of
  relevant professional experience including 4+ years of
  engineering management experience.

  Critical Skills

  - 4+ years leading software engineering teams, including
    hiring, performance management, and career development
  - Track record delivering multiple concurrent workstreams with
    real business impact
  - Technical foundation strong enough to be credible in design
    discussions on modern web stacks and cloud platforms,
    ideally TypeScript, React, .NET, and Azure
  - Working understanding of event-driven architecture and the
    tradeoffs it introduces
  - Experience operating in a scaled agile environment, SAFe or
    equivalent, including planning across teams
  - Data-driven approach to delivery health, including flow
    metrics such as throughput, cycle time, and predictability
  - Demonstrated ability to drive adoption of AI tooling in
    engineering workflows
  - Ability to resolve cross-team misalignment directly, without
    routing every disagreement through escalation
  - Clear written and verbal communication that works for both
    engineers and executives

  Additional Skills (Preferred)

  - Healthcare applications, particularly EHR integrations
  - Prior authorization, pharmacy, or payer domain experience
  - FHIR standard, SMART on FHIR integrations, and healthcare
    data exchange
  - Experience leading other people managers or building a
    leadership bench
  - Experience scaling a team through significant growth,
    transition, or restructuring
  - Contributions to engineering communities of practice,
    internal or external

  Education

  Bachelor's degree in Computer Science, Engineering, or a
  related field, or equivalent experience.

  Work Environment

  Hybrid, based out of the Columbus, Ohio office. Regular
  collaboration across time zones with distributed team
  members and partners.

  We are proud to offer a competitive compensation package at
  McKesson as part of our Total Rewards. This is determined by
  several factors, including performance, experience and
  skills, equity, regular job market evaluations, and
  geographical markets. The pay range shown below is aligned
  with McKesson's pay philosophy, and pay will always be
  compliant with any applicable regulations. In addition to
  base pay, other compensation, such as an annual bonus or
  long-term incentive opportunities may be offered. For more
  information regarding benefits at McKesson, please click
  here.

  Our Base Pay Range for this position

  $126,000 - $210,000

