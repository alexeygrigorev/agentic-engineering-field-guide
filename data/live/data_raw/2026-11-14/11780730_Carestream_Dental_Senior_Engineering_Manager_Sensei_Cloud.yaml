title: Senior Engineering Manager, Sensei Cloud
company: Carestream Dental
location: USA
remote: true
work_type: FULL_TIME
company_size: 1,300 Employees
description: |
  Job Summary & Responsibilities

  About the Role

  Carestream Dental builds the software that dental and oral
  surgery practices use to run their day, from the schedule
  and the patient chart to the ledger and the claim. Sensei
  Cloud is our cloud practice management platform and the
  center of our product strategy. Practices across the United
  States and the United Kingdom work in it from the start of
  the day to the end, and more join every month as they move
  from our established desktop products.

  We are hiring a Senior Engineering Manager to lead the
  engineering teams that build Sensei Cloud. Reporting to the
  Chief Technology Officer, you will be responsible for the
  quality and reliability of the platform, for predictable
  delivery, and for the health and growth of the engineers who
  build it.

  This is a growth investment. As Sensei Cloud becomes the
  primary product for more of our customers, we are raising
  the engineering bar to match: stronger automated testing,
  faster and safer releases, deeper integration with our
  partner ecosystem, and a modern, AI assisted way of working
  for the teams. You will lead that work.

  Why You Might Want This Job

  This role suits an engineering leader who wants to run a
  cloud product line with real scale and a clear mandate to
  invest in it. The platform is live, the customer base is
  growing, the roadmap is ambitious, and the teams want a
  leader who stays close to the work. You will report to the
  CTO and work alongside architects who own the platform
  design and Product Owners who own the roadmap.

  What You’ll Do

  - Lead, coach and grow the Sensei Cloud engineering teams.
    This includes line management, weekly one to ones, clear
    goals, honest performance conversations, and careful
    hiring and onboarding.
  - Name and develop a Team Lead in each team, and run the teams
    through them.
  - Set and uphold the quality and reliability standards for the
    platform, including release criteria measured from
    production telemetry.
  - Build out automated regression coverage across the clinical,
    financial, imaging and reporting paths, with performance
    testing on data access changes and validation at every
    integration boundary.
  - Own predictable delivery, with commitments Product and the
    executive team can plan on, risk raised early with
    options, and a clear account of outcomes.
  - Partner with Product on the Sensei Cloud roadmap, including
    usability work, in product feedback, workflow enhancements
    and new integrations.
  - Run the operating discipline. Azure DevOps is the single
    source of truth, severe issues are owned round the clock
    between the US and UK, and backlogs are ready before
    sprints start.
  - Stay technical. Take part in design reviews, lead incident
    response, and partner with our architects on platform
    direction.
  - Keep a working build of the product and contribute changes
    through the normal review process, using AI assisted tools
    such as Claude Code, so that you lead the teams through
    the change in how software is built from your own
    experience of it.
  - Set the working agreement for AI assisted engineering on
    your teams: what can be delegated to an agent, what a
    person must review, how generated code is tested, and how
    security is handled. Measure adoption and its effect on
    quality.
  - Manage a distributed organization across the United States,
    the United Kingdom and partner teams in Latin America and
    Europe, holding employees and partners to the same
    expectations with the same support.

  What You’ll Bring

  - You have led engineering for a multi tenant cloud SaaS
    product in production and lived with the consequences of
    earlier decisions. Azure and .NET experience is preferred.
  - You have raised the quality and reliability of a product
    with measurable results, and can describe which measures
    moved and how.
  - You have managed managers or team leads across time zones,
    with vendor or partner engineers embedded in your teams.
  - You are credible in a design review with senior engineers
    and close enough to the code to recognize when an estimate
    or a design is wrong.
  - You can set up, build and run a modern .NET and Azure
    codebase, and you have shipped changes to a production
    system in the last year using AI assisted development
    tools. We will ask you to show us.
  - You have introduced AI assisted engineering to a team, with
    review, testing and security guardrails, and can describe
    what changed as a result.
  - You have run production incidents and owned the process
    changes that followed.
  - You can explain trade offs to product and executive
    stakeholders in the terms they use to make decisions, and
    you push back when a commitment is not realistic.
  - You know what to decide yourself, what to delegate, and what
    to escalate.

  Nice to Have

  - Dental or wider healthcare software, including scheduling,
    charting, claims and imaging.
  - Regulated data, including HIPAA and UK GDPR, in design and
    operations.
  - A product estate that spans cloud and desktop software, and
    the migration between them.

  How We Work

  - Azure DevOps is our single source of truth. If work is
    happening, it is recorded there.
  - Severe issues are owned round the clock and handed off
    explicitly between the US and UK teams.
  - Team Leads direct the day to day technical work, managers
    own the people and the delivery, and architects own the
    platform design.
  - Full time employees and partner engineers onboard the same
    way and are held to the same standard.
  - We are adopting AI assisted engineering, with Claude Code in
    daily use, and we measure both its adoption and its effect
    on quality. Leaders are expected to use the tools
    themselves.

  Education

  Bachelor's degree in Computer Science, Computer Engineering
  or Software Engineering, or equivalent practical experience.

  Total Target Compensation: $160,000 - $175,000 USD annually,
  which includes a base salary and target variable incentive.
  Actual compensation will be determined based on factors such
  as skills, experience, and qualifications.
