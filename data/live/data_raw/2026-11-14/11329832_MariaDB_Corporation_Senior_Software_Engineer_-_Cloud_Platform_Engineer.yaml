description: |
  About MariaDB

  Are you ready to shape the infrastructure for a
  groundbreaking cloud database platform? MariaDB is making a
  big impact on the world. Whether you’re checking your bank
  account, buying a coffee, shopping online, making a phone
  call, listening to music, taking out a loan or ordering
  takeout – MariaDB is the backbone of applications used every
  day. Companies small and large, including 75% of the Fortune
  500, run MariaDB, touching the lives of billions of people.
  With massive reach through Linux distributions, enterprise
  deployments and public clouds, MariaDB is uniquely
  positioned as the leading database for modern application
  development.

  MariaDB Cloud is revolutionizing the way businesses manage
  their data in the cloud. We're on a mission to provide a
  seamless, powerful, and user-centric Database-as-a-Service
  (DBaaS) solution that sets new industry standards. MariaDB
  Cloud is a Multi-cloud Database-as-a-Service platform
  offering, specializing in managing MariaDB, one of the most
  popular open-source relational database systems.

  MariaDB Cloud is more than just a database; it's a
  comprehensive and innovative platform that delivers
  continuous availability, autonomous operation, and
  serverless capabilities. We're redefining the database
  experience to make it more accessible, intuitive, and
  efficient than ever before.

  The OpportunityAbout the Role

  We are seeking a Senior Software Engineer to join a small,
  high-ownership team building robust cloud infrastructure for
  our globally deployed relational database engine. You will
  design and implement the application layers, business logic,
  and API workflows at the intersection of data management,
  cloud operations, and relational database services—critical
  components that enterprise applications depend on for
  correctness, performance, and governance. This is a hands-
  on, end-to-end role. You will lead features from whiteboard
  to production: owning implementation, writing clean and
  scalable code, and leveraging deep expertise in cloud
  orchestration to ensure robust deployment across multi-cloud
  environments. Proficiency in Terraform is essential for
  managing our complex infrastructure and ensuring
  reproducible deployments. Our team is small by design,
  offering high individual impact and direct visibility into
  engineering strategy. The ideal candidate has scaled
  infrastructure across multiple cloud providers and
  approaches every challenge with an ownership
  mindset—shipping production-grade systems that set new
  industry standards.

  Key Responsibilities

  - 8+ years of experience in software development with deep
    expertise in distributed systems and cloud-native
    architecture.
  - Proven track record of designing and operating multi-cloud
    infrastructure at scale across AWS, GCP, and Azure.
  - Advanced proficiency in Terraform for Infrastructure as Code
    (IaC) and complex cloud orchestration.
  - Expertise in containerization and orchestration using
    Kubernetes and Docker in production-grade environments.
  - Experience building and maintaining robust CI/CD pipelines
    for automated, scalable deployments.
  - Strong command of Go or Python for developing cloud-native
    applications, controllers, and automation tooling.
  - BS/MS in Computer Science or a related technical field.
  - Experience designing and implementing REST and/or gRPC APIs
    used by external consumers or frontend systems.
  - Knowledge of MariaDB server is a plus.

  Required QualificationsExperience

  - 5+ years of professional software development experience,
    with at least 2 years focused on data-intensive
    applications, database-adjacent features, or enterprise
    software.
  - Demonstrated end-to-end ownership of a non-trivial
    production feature or module: you have taken something
    from functional specification through implementation to
    production.
  - Hands-on production experience deploying, debugging, and
    managing application services across at least two major
    public clouds (AWS, Azure, GCP).
  - Experience building or integrating with vector databases,
    embedding pipelines, semantic search, or retrieval-
    augmented generation (RAG) systems.
  - Prior work building LLM-based applications or workflows
    using AI agent frameworks (LangChain, LangGraph, CrewAI,
    AutoGen, or equivalent).

  Technical Skills

  - Strong proficiency in Python for AI application development,
    alongside high proficiency in at least one backend
    language (such as Go, Java, or C++).
  - Deep, practical application of relational databases: writing
    complex SQL, structural indexing, query optimization,
    transactions, and schema design.
  - Experience implementing temporal data models, event-driven
    tracking, audit logs, or utilizing system-versioned
    tables.
  - Solid understanding of application security fundamentals:
    authentication, authorization, RBAC, row-level security,
    and multi-tenant data isolation at the application layer.
  - Proficiency with modern application monitoring tooling:
    structured logging, distributed tracing (OpenTelemetry),
    and functional alerting.
  - Experience designing and implementing REST and/or gRPC APIs
    used by external consumers or frontend systems.

  Preferred Qualifications

  - Experience contributing to or maintaining open-source
    projects in the database, AI/ML application, or agent-
    tooling ecosystem.
  - Hands-on experience developing MCP servers or integrating
    A2A (Agent2Agent) protocols into production systems.
  - Familiarity with agent memory frameworks such as Mem0,
    Graphiti, or Letta.
  - Experience leveraging graph databases or multi-hop graph
    traversal (Neo4j, Kuzu, FalkorDB, or similar) within
    applications.
  - Background with in-memory data grids or semantic caching
    systems (Redis or similar) to optimize AI token usage.
  - Experience packaging applications for on-premises or air-
    gapped deployment environments, including regulated
    infrastructure.
  - Knowledge of MariaDB or MySQL application development,
    system-versioned tables, or temporal SQL.

  Location & Job Info

  Full-Time - Remote - US

  Why Join Us

  Compensation

  The annual anticipated U.S. base salary range for this full-
  time position is $141,000-$185,000. Actual salaries may vary
  and fall outside of this range depending on factors such as
  a candidate’s qualifications, geographic location, skills,
  experience, and competencies.

  In addition, we are often open to a wide variety of
  profiles, and recognize that the person we hire may be less
  experienced (or more senior) than the job description as
  posted. Salary is one component of MariaDB’s total rewards
  package.  We provide a competitive benefits package.
  Additional benefits includes health insurance, life, and
  disability insurance, funds toward professional development
  resources, Flexible Paid Time Off (FPTO), paid holidays,
  401(k), and parental leave, a massive degree of flexibility
  and freedom, just to name a few!

  Salaries for candidates outside the U.S. will vary based on
  local compensation structures.

  How to Apply

  If you are interested in this position, please submit your
  application along with your CV/Resume through our ATS
  Greenhouse on our MariaDB Careers site.

  - At MariaDB, we celebrate the diverse experiences and
    perspectives of our employees because this drives
    innovation and success. MariaDB is an equal opportunity
    employer dedicated to creating a welcoming and inclusive
    workplace for everyone.
  - MariaDB does not sponsor work visas or relocation.
  - MariaDB is committed to providing accommodations for
    individuals with disabilities within our application and
    interview process. To request an accommodation due to a
    disability, please inform your recruiter.
  - MariaDB will not accept agency resumes without a prior
    contractual agreement with HR. Please do not forward
    resumes to any recruiting alias or employee directly.
    MariaDB is not responsible for paying any fees associated
    with any unsolicited submitted CV/Resumes.
