description: |
  Flow Traders is looking for a Software Engineer (Trading
  Automation) to join our Technology department in our New
  York office. As a member of Trading Automation team, you
  will develop applications that support our core business by
  improving data frameworks, automating workflows, and
  creating opportunities for greater efficiency and growth.

  In this role, you will be responsible for developing
  applications, services, mentoring team members and managing
  stakeholders. Your actions will directly contribute to the
  performance of the company. You will also get the
  opportunity to interact and work closely with the global
  Trading Automation team and different departments to gain a
  well-rounded knowledge of start-to-end trading landscape,
  how they function and integrate within our ecosystem.

  What you will do

  - Develop workflow automation processes aligned with business
    needs
  - Design, create, and maintain data pipelines and data-
    intensive applications
  - Write automated test cases, ensuring that they cover major
    edge cases
  - Thoroughly document your work, including technical/design
    specifications and operational guides
  - Deploy software applications to production using continuous
    integration and continuous deployment
  - Act as first line of defense with regards to operational
    support of the solutions delivered by the team
  - Collaborate with both local and global stakeholders and team
    members

  What you need to succeed

  - 5+ years of professional working experience
  - Bachelor's degree in Engineering, Computer Science, or
    related fields required; advanced degree preferred
  - Strong working knowledge of Git, SQL, Python, and Linux
  - Familiarity with any of Airflow, Ansible, Kafka, Docker,
    Kubernetes, and AWS/Azure/GCP is a plus
  - Experience using LLMs to develop software and integrate
    solutions with existing systems
  - Excellent communication and writing skills
  - Ability to work in a fast-paced environment with a strong
    sense of urgency
  - Strong organizational, analytical, and problem-solving
    skills
  - A hands-on, entrepreneurial mindset

  At Flow Traders, we acknowledge the importance of open and
  transparent communication whether it be with our employees,
  our stakeholders, or our local and global communities. When
  it comes to salary, Flow Traders uses reliable market
  research to create base ranges. Where candidates will fall
  within the range depends on a few different factors
  including but not limited to level of experience, location,
  and specific skill set. We also consider ourselves one
  global team, and to demonstrate that, all employees are
  eligible to share in the company’s success through an annual
  discretionary variable remuneration allocated based on
  company, group and individual performance and contribution.

  Per NYC salary transparency law, the total compensation for
  this role includes a base range of $185,000 to $240,000 plus
  annual discretionary variable remuneration.

  Flow Traders does not accept unsolicited resumes from any
  professional staffing or search firms. All resumes, and any
  other information identifying potential candidates,
  submitted to any employee at Flow Traders via-email, the
  Internet or directly without a valid and signed search
  agreement will be deemed free to contact by Flow Traders
  without any restrictions and no placement fee of any kind
  will be paid in the event the candidate is hired by Flow
  Traders.

