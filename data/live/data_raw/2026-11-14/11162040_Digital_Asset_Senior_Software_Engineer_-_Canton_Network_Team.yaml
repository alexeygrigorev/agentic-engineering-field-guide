description: |
  About Digital Asset & the Canton Network Digital Asset
  builds the technologies that are reshaping the foundations
  of financial markets. Our mission is to create the world’s
  most trusted, privacy-enabled, and interoperable digital
  infrastructure for global finance. At the heart of this
  mission is the Canton Network - the blockchain purpose-built
  for institutional finance. Uniquely combining privacy,
  compliance, and scalability, Canton enables real-time,
  secure settlement across multiple asset classes. Governed by
  the Canton Foundation with participation from leading
  financial institutions, it is the proven link between the
  promise of blockchain and the power of global finance.

  Founded in 2014 and headquartered in New York City, with
  offices in London, Zurich, Budapest, Hong Kong, and Sydney—
  we are on a mission to transform finance— and that
  transformation is now playing out rapidly on the Canton
  Network. If you’re interested in playing a crucial role at
  the intersection of traditional and crypto-capital markets
  and want to help bring the next trillion dollars of finance
  on-chain, join us.

  Job requirements

  The successful candidate will live within the New York City
  Tri-State area (New York, New Jersey, Connecticut),
  preferably with the ability to commute to the New York city
  office on a flexible hybrid schedule.

  - Experienced polyglot software engineer as demonstrated by
    either your open-source contributions or commercial
    experience.
  - Proven success contributing to significant software
    engineering projects and owning major components within
    the solution.
  - Excellent programming skills, ideally using a functional
    language (preferably Scala or Haskell).
  - Must have demonstrable experience with development for Cloud
    deployment, and of operations of Cloud technologies such
    as Kubernetes, Pulumi, Helm, Grafana.
  - Superb communication skills - both written and spoken, with
    demonstrated ability to interact with other engineers
    within the team and across teams.
  - Ability and willingness to mentor other engineers for great
    responsibility and productivity.
  - Striving to improve overall systems and processes within and
    beyond the immediate team.
  - An independent, yet collaborative, individual who can work
    effectively in a geographically distributed remote team.
  - Bachelor’s or Master’s degree in computer science or a
    related discipline; or equivalent demonstrable experience.
  - Bonus points for experience also in one of: security
    engineering, DeFi Web3 programming, frontend development.

  Job responsibilities

  As a senior engineer in this team, you will have the
  opportunity to work across a wide range of Web3 and Web2
  technologies. You will help us tackle some of the most
  challenging and complex problems in distributed systems and
  systems security, while delivering the best quality products
  for our customers, all open source and public. You will get
  to collaborate with our existing set of talented engineers,
  and also help mentor and grow the next generation of great
  engineers.

  - Proven success contributing to significant software
    engineering projects and owning major components within
    the solution.
  - Excellent programming skills, ideally using a functional
    language (preferably Scala or Haskell).
  - Must have demonstrable experience with development for Cloud
    deployment, and of operations of Cloud technologies such
    as Kubernetes, Pulumi, Helm, Grafana.
  - Superb communication skills - both written and spoken, with
    demonstrated ability to interact with other engineers
    within the team and across teams.
  - Ability and willingness to mentor other engineers for great
    responsibility and productivity.
  - Striving to improve overall systems and processes within and
    beyond the immediate team.
  - An independent, yet collaborative, individual who can work
    effectively in a geographically distributed remote team.
  - Bachelor’s or Master’s degree in computer science or a
    related discipline; or equivalent demonstrable experience.
  - Bonus points for experience also in one of: security
    engineering, DeFi Web3 programming, frontend development.

  Pay Transparency: The estimated salary range for this role,
  based in our New York City office, is $175,000 to $200,000.
  The range may vary if based outside the New York tri-state
  area (New York, New Jersey, and Connecticut). Base salaries
  are determined during our interview process, during which we
  assess the candidate's experience, skills, and capabilities
  against internal peers and the scope and responsibilities of
  the position.

  Benefits

  NO AGENCIES PLEASE!

  - We offer a comprehensive benefits package designed to
    support the well-being of our team members. Health and
    insurance benefits vary by region to ensure local
    relevance and compliance, and may include medical, dental,
    and vision coverage.
  - Digital Asset is an equal opportunity employer. All
    qualified applicants will receive consideration for
    employment without regard to race, color, national origin,
    sex, religion, sexual orientation, age, disability,
    citizenship status, veteran status or any other basis
    protected by applicable law. If and as required by
    applicable law, all persons hired to work at Digital Asset
    will be required to verify identity and eligibility to
    work in the location for which they have an offer to work
    and to complete the necessary employment eligibility
    verification documents upon hire. Applicants with
    disabilities who require accommodation should contact
    recruiting@digitalasset.com.
  - As part of our commitment to equal opportunity, Digital
    Asset believes that all employees should receive equal pay
    for equal work and is committed to this principle in its
    pay structure. DA also offers family-friendly benefits in
    addition to flexible work arrangements.
