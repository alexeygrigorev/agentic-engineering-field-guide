description: |
  About Velixus Labs

  Velixus Labs is building the next generation of AI,
  blockchain, and Web3 infrastructure. We partner with
  startups, enterprises, and emerging technology leaders to
  develop secure, scalable, and intelligent digital products
  powered by decentralized technologies.

  We're a team of builders who enjoy solving difficult
  technical challenges and delivering products that create
  real-world impact.

  The Role

  We're looking for a Senior Engineering Manager to lead the
  delivery of blockchain products and help scale our
  engineering organization.

  This role combines technical leadership, people management,
  and execution. You'll work closely with engineering,
  product, and business stakeholders to guide teams building
  smart contracts, decentralized applications, blockchain
  infrastructure, and supporting platforms.

  You won't be expected to write production code every day,
  but you'll be deeply involved in technical decision-making,
  architecture discussions, hiring, mentoring, and ensuring
  engineering teams deliver high-quality products.

  What You'll Do

  - Lead and grow high-performing engineering teams building
    blockchain and Web3 products.
  - Partner with product and business leaders to define
    technical strategy and execution plans.
  - Support engineers through mentoring, coaching, performance
    management, and career development.
  - Drive technical excellence, engineering quality, and
    operational reliability across projects.
  - Help teams make sound architectural decisions and manage
    technical tradeoffs.
  - Establish scalable engineering processes that enable teams
    to move quickly without sacrificing quality.
  - Manage project priorities, resource planning, and delivery
    expectations.
  - Foster a culture of ownership, accountability, and
    continuous improvement.
  - Participate in hiring and help build a world-class
    engineering organization.

  What We're Looking For

  - Experience leading engineering teams and delivering complex
    software products.
  - Strong background in software engineering and system design.
  - Proven experience working on blockchain, cryptocurrency, or
    Web3 products.
  - Ability to lead both technical discussions and people-
    related decisions.
  - Experience building and scaling engineering teams in fast-
    moving environments.
  - Strong communication skills and the ability to work across
    technical and non-technical stakeholders.
  - A pragmatic approach to problem-solving and decision-making.

  Nice to Have

  - Experience managing distributed or remote engineering teams.
  - Background in startups, scale-ups, or technology consulting
    environments.
  - Experience building products in DeFi, tokenization, digital
    assets, wallets, infrastructure, or enterprise blockchain.
  - Familiarity with cloud infrastructure and modern software
    delivery practices.

  Why Join Velixus Labs

  - Work on innovative blockchain and AI products with global
    clients and partners.
  - Help shape the future direction of our engineering
    organization.
  - Lead talented teams solving challenging technical problems.
  - Flexible remote-first work environment.
  - Learning and development support.
  - Competitive compensation and performance incentives.

  Compensation

  Base Salary: $240,000 – $320,000 USD

  Compensation is based on experience, location, leadership
  scope, and overall impact.

  Additional compensation may include performance bonuses,
  equity participation, and other benefits depending on role
  and location.

  How to Apply

  Send your resume, LinkedIn profile, and a brief summary of
  blockchain products or teams you've led to:

  careers@velixuslabs.org

  We're interested in understanding the teams you've built,
  the products you've helped deliver, and the challenges
  you've solved.
