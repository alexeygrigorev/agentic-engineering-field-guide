description: |
  At Garten, we are pioneering a modern approach to health and
  wellbeing in the workplace, because we know that a team that
  is filled with inspiration and equipped to face the day can
  change the world.

  Working with businesses that are or want to answer the call
  of change, we see high-quality food and a holistic approach
  to wellness as critical ingredients in creating a team of
  happy, thriving employees.

  Born from a desire to democratize wellness, we set the
  standard for healthier living in today’s workplace. Through
  curated nutrition to proprietary data analysis, we transform
  the way our client partners support their most important
  asset, their employees.

  In many areas of Garten, engineers have developed a deep
  understanding of the field operations and management it
  takes to deliver healthy food and beverage to our clients’
  offices. In this next era, we're at a much earlier stage in
  the evolution of our products. That means unprecedented
  challenges — and abundant opportunities to make far-reaching
  impact with our clients nationwide. Our vision is to set a
  new benchmark for the industry—driving innovation beyond the
  breakroom.

  Garten is looking for senior engineers with experience
  building enterprise and consumer  applications for
  enterprise and consumers.  You will help design, build and
  maintain scalable applications.  You have experience working
  closely with third party vendors, engineering teams and
  business stakeholders to understand the use cases and build
  end-to-end solutions.

  If this sounds like something you believe in and you want to
  be a pioneer in the development of our platform, we want to
  hear from you!

  Specifically, you will

  - Work closely with product management, UX design teams and
    nutrition team to understand requirements and specify
    interfaces for new software frameworks and enhance
    existing frameworks
  - Work across all phases of the software development lifecycle
    (planning, design, implementation, testing, deployment,
    operations and support)
  - Mentor and support other members of the engineering team on
    a technical level
  - Communicate technical ideas and direction in cross-
    functional settings
  - Perform opportunistic code refactoring (you are comfortable
    changing tires on a moving vehicle)
  - Address complex architectural problems with simple,
    intuitive designs

  About you

  - Senior-level back-end engineer with 5+ years of experience
  - Experience with cloud-based technologies like Amazon AWS
    (Dynamo, SNS, SQS, etc) and Apache Spark/Kafka
  - Experience with Java, Elixir, or Ruby, and the willingness
    to learn new technologies (experience with other object-
    oriented languages is okay too, but our code is Java,
    Elixir, and Ruby, so you should be able to get up-to-speed
    on at least one of them quickly.
  - Bonus points for experience with container orchestration
    (kubernetes/docker)
  - You are passionate about product development, self-driven,
    highly motivated and you enjoy the independence of
    managing projects on your own
  - You are extremely collaborative and enjoy working cross-
    functionally with other engineers, product managers, and
    designers
  - You are proactive and can move fast or pivot to meet the
    changing needs of the product
  - You enjoy problem solving and can use everything from big-
    data to command line tools to help you identify and fix
    issues
  - Solid expertise in building highly scalable, distributed,
    loosely coupled systems
  - Experience with partner platforms, marketplace experiences,
    and third party integrations a plus. Garten’s  mission is
    to empower people to live healthful and blissful lives.
    Through our platform and services, we're building a
    different kind of company that connects employers to their
    employees. We focus on three core beliefs:
    - Work is changing, so must the workplace
    - Food is the foundation
    - Inspired employees radiate energy and drive creativity
