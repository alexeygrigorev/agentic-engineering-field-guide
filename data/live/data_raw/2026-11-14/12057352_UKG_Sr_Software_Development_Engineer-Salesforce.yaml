description: |
  Why UKG:

  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.

  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you. Summary The Senior
  Salesforce Software Developer is responsible for the
  administration, configuration, development, testing, and
  ongoing support of Salesforce Service Cloud and integrated
  enterprise applications supporting Customer Experience (CX)
  operations. This role partners closely with Business Systems
  Analysts, Salesforce Administrators, Product Owners, QA
  Analysts, Architects, and business stakeholders to deliver
  scalable, high-quality solutions that improve business
  processes, operational efficiency, and customer experience.
  The ideal candidate combines strong Salesforce development
  skills with platform administration expertise and is
  experienced in implementing process enhancements through
  configuration, custom development, testing, and production
  support. This role participates throughout the Software
  Development Life Cycle (SDLC), from requirements analysis
  through deployment and post-production support. Key
  Responsibilities
  - Design, develop, configure, test, deploy, and support
    Salesforce Service Cloud and integrated enterprise
    applications supporting Customer Experience operations.
  - Lead the technical implementation of complex Salesforce
    enhancements, balancing declarative configuration with
    custom development using Apex, Lightning Web Components
    (LWC), Flows, and APIs.
  - Collaborate with Business Systems Analysts, Product Owners,
    Architects, QA, and business stakeholders to translate
    business requirements into scalable technical solutions.
  - Provide technical leadership during solution design, code
    reviews, and development planning, ensuring adherence to
    Salesforce best practices, security standards, and
    architectural guidelines.
  - Develop and support integrations between Salesforce and
    enterprise applications using REST APIs, middleware, and
    event-driven technologies.
  - Design, execute, and support unit, integration, regression,
    and User Acceptance Testing (UAT), ensuring high-quality,
    reliable releases.
  - Analyze and resolve complex production issues, perform root
    cause analysis, and implement sustainable corrective
    actions.
  - Participate in Agile delivery processes including backlog
    refinement, sprint planning, estimation, code reviews,
    release management, and production deployments.
  - Mentor junior developers and provide technical guidance to
    improve development quality, consistency, and platform
    knowledge.
  - Identify opportunities to improve operational efficiency
    through automation, AI-enabled capabilities, reusable
    components, and continuous process improvement.
  - Develop and maintain technical documentation, development
    standards, and deployment procedures.
  Basic Qualifications

  - Bachelor's degree in Computer Science, Information Systems,
    Software Engineering, or a related field, or equivalent
    professional experience.
  - 4+ years of hands-on Salesforce application development
    experience, including 2+ years supporting Salesforce
    Service Cloud or related experience.
  - Strong experience developing solutions using Apex, Lightning
    Web Components (LWC), Salesforce Flow, SOQL/SOSL, Platform
    Events, and REST APIs.
  - Demonstrated experience supporting the full Software
    Development Life Cycle (SDLC) within Agile/Scrum
    environments.
  - Experience developing and supporting integrations between
    Salesforce and enterprise applications.

  - Strong analytical, troubleshooting, and problem-solving
    skills with the ability to independently resolve complex
    technical issues.
  - Excellent communication and collaboration skills with
    experience working across business and technical teams.

  Preferred Qualifications

  - Salesforce Platform Developer I certification (required
    within first year if not already certified); Platform
    Developer II, Salesforce Administrator, or Service Cloud
    Consultant certifications preferred.
  - Experience with Salesforce DevOps practices, Git, Azure
    DevOps, CI/CD pipelines, Jira, and Confluence.
  - Experience with Salesforce AI capabilities (Agentforce,
    Einstein, Prompt Builder) or Sierra and workflow
    automation.
  - Experience supporting Customer Experience, Customer Support,
    Case Management, or Professional Services organizations.
  - Demonstrated ability to provide technical leadership, mentor
    team members, and contribute to platform architecture and
    development standards.
  - Experience with enterprise integrations, ServiceNow, Power
    BI, or related business applications.

  Company Overview:

  UKG is the Workforce Operating Platform that puts workforce
  understanding to work. With the world's largest collection
  of workforce insights, and people-first AI, our ability to
  reveal unseen ways to build trust, amplify productivity, and
  empower talent, is unmatched. It's this expertise that
  equips our customers with the intelligence to solve any
  challenge in any industry — because great organizations know
  their workforce is their competitive edge. Learn more at
  ukg.com.

