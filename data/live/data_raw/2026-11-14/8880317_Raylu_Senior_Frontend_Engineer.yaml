description: |
  Position Summary

  We’re hiring a Senior Frontend Engineer who is both
  opinionated and design-oriented. You will own end-to-end
  delivery of interfaces: architecture, performance,
  accessibility, and the actual UX. If you care as much about
  micro-interactions as data loading strategies, you’ll fit
  right in.

  What we’re looking for

  - Modern FE stack: React + Next.js, Tailwind, Vercel, Zustand,
    React Query.
  - Design + UX ownership: You sweat details, shape interaction
    patterns, and push for visual clarity.
  - System thinking: Build component libraries/design systems
    that scale across products.
  - Performance & quality: Exemplary Core Web Vitals,
    accessibility, testing, and error handling.
  - Product instincts: You can turn vague ideas into crisp flows
    and ship quickly.
  - Opinionated: Deep level of understanding of the
    technological landscape, making both high level framework
    and granular code design decisions based on understanding
    rather than preference - diving deep on unknown patterns
    in order to build the best product.

  Responsibilities

  - Lead the architecture and delivery of complex, data-rich
    UIs.
  - Define state management and data-fetching patterns for
    reliability and speed.
  - Partner tightly with design and product; contribute to UX
    research and prototyping.
  - Establish FE best practices: design tokens, theming,
    testing, and CI/CD for the web.
  - Create and contribute to storybook and reusable components
    to standardize all customer facing surfaces.

  Logistics:

  - Compensation: $165K - $250K salary, $100K-200K equivalent in
    new hire equity (4 year vest)
  - Location: New York City. We are a fully in-office team
    working out of Midtown Manhattan Monday through Friday. We
    allow for WFH days when anyone is traveling, but we do not
    allow for permanent remote work.
  - Benefits:
    - Generous health, dental, and vision insurance
    - 401k with 3% automatic contribution (no vesting)
    - Paid Lunches
    - Wellness and Citi Bike benefit
