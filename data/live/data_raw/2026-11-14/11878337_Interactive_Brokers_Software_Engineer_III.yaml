description: |
  About the Company



  Interactive Brokers Group, Inc. (NASDAQ: IBKR), a member of
  the S&P 500, is a global financial services company
  headquartered in Greenwich, Connecticut, with offices in
  over 15 countries. Through its affiliates, Interactive
  Brokers provides automated trade execution and custody of
  securities, commodities, foreign exchange, and prediction
  markets on over 170 markets in numerous countries and
  currencies.



  For more than four decades, Interactive Brokers has focused
  on technology, automation, and innovation to provide clients
  worldwide with a sophisticated, unified platform to manage
  their investment portfolios. We serve individual investors,
  hedge funds, proprietary trading groups, financial advisors,
  and introducing brokers.



  Our culture is driven by problem-solving, efficiency, and
  continuous improvement. We look for individuals who are
  intellectually curious, collaborative, and motivated to
  contribute to technology that helps simplify and enhance
  access to global financial markets. Interactive Brokers has
  consistently been recognized as a top broker by respected
  industry sources including Barron’s, Investopedia,
  Stockbrokers.com, and others.



  This is a hybrid role (three days in the office/two days
  remote).

  Join the INTERACTIVE BROKERS Team!

  The Back Office team is the operational and financial
  backbone of Interactive Brokers, ensuring the accurate,
  timely processing that keeps our global brokerage running.
  This group spans a broad set of functions—including
  Accounting, Finance, Treasury, Tax, Clearing, Corporate
  Actions, Securities Finance, Market Data, and
  Credit—alongside Business Analytics, Investor Relations, and
  the CFO Office. Together these teams safeguard the firm's
  financial integrity, manage cash and securities movements,
  and deliver critical regulatory reporting. It's a fast-paced
  environment where precision, accountability, and deep market
  knowledge drive everything we do.

  You will be part of:

  A team responsible for design, development and support of
  back-end software that consolidates, tracks and analyzes
  financial portfolios, advanced performance reporting,
  benchmarks and risk metrics, for clients globally.

  - Developing financial analysis and reporting features to meet
    user needs while considering functionality, reliability,
    and scalability.
  - Working with other developers, designers, product managers,
    and stakeholders to understand project requirements and
    specifications.
  - Working with Java, Oracle database and AI coding assistants
    to develop maintainable and efficient back-end services
    and algorithms.
  - Testing to identify bugs and resolve them to ensure high-
    quality deliverables.
  - Reviewing code written by peers for quality assurance and
    provide constructive feedback.

  You will need to have:

  - Bachelor's or Master's in Computer Science, or related
    degree
  - 3-7 years of Java experience
  - Strong understanding of DBMS concepts (Oracle platform is a
    plus)
  - Hands on expertise in server-side programming in Java

  What we’d also love to see:

  - An ambitious and diligent individual
  - An Innovative mindset with a drive to improve existing
    systems
  - A desire to solve complex problems

  Company benefits:

  - Competitive salary, annual performance-based bonus, and
    stock grant awards
  - 401(k) retirement plan with competitive company match
  - Excellent health and wellness benefits, including medical,
    dental, and vision benefits. 100% employer-paid medical
    premiums, with generous employer contributions to dental &
    vision plans as well.
  - Wellness screening and assessments, health coaches, and
    counseling services through an Employee Assistance Program
    (EAP)
  - Generous paid parental leave (up to 16 weeks paid parental
    leave for eligible employees)
  - Company-paid basic life insurance, accidental death &
    dismemberment (AD&D), and short- and long-term disability
    coverage
  - Flexible Spending Accounts (Healthcare, Dependent Care, and
    Commuter FSAs)
  - Quarterly fitness stipend to offset costs associated with
    traditional gym and fitness memberships or fees
  - Education reimbursement and professional development
    opportunities
  - Legal services, telehealth access, and voluntary insurance
    options
  - Backup child and adult care support through Care.com
  - Daily lunch allowance and fully stocked kitchen with healthy
    breakfast and snack options
