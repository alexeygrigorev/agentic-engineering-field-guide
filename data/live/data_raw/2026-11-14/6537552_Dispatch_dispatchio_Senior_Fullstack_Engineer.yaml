description: |
  About Us

  The financial advisory industry is a $80T market in the US,
  but has seen little technological innovation compared to the
  self-service market (Robinhood, Betterment, Wealthfront,
  SoFi). Client data management is a universally painful and
  expensive problem for financial advisors. Today, advisors
  manually collect, update, and utilize client data across the
  7-10 software tools that they use to run their business.
  Data transcription and translation across systems is time-
  consuming and error-prone, leading to costly inefficiencies
  and embarrassing client-facing problems. Managing data
  access control, audit logs, and compliance is a constant
  challenge, particularly in larger organizations.

  We are building the first wealth tech data orchestration
  company. We sync client data across a financial advisor's
  tech stack, unlocking the efficiency of a fully-integrated
  software suite with the choice of tools that best fit their
  business. We are laser-focused on enabling the best
  technology experiences for advisors and unlocking the
  potential of the entire wealth tech software ecosystem.
  We’re an experienced team of start-up operators with deep
  roots in both tech and advisory. You can learn more about us
  on our website.

  Role Details

  Role overview:

  We’re looking for an experienced fullstack engineer who can
  lead the development of our early product. You'll help
  evolve our engineering culture, take end-to-end ownership
  over the features that you build, and heavily influence the
  product roadmap and architecture decisions.

  Where you'll make an impact:

  - Lead areas of development critical to the business, building
    features such as: self-service onboarding, data blending
    and deconfliction, and digital account opening.
  - As an early employee, you'll have a large role to play in
    shaping the company's technical vision and product
    roadmap.
  - Help us build and maintain a strong (and enjoyable!)
    developer experience.
  - Ensure that the product operates smoothly in production,
    leveraging observability and monitoring tools to triage
    and resolve operational issues.
  - Help hire and mentor other engineers as we build out our
    fast-growing team.

  Requirements:

  - Strong track record of shipping high-quality systems with
    high complexity and scale.
  - Experience building high-quality, delightful user-facing web
    applications.
  - Experience working closely with a cross-functional product
    team.
  - Excited to primarily be an individual contributor with a ton
    of ownership.
  - You thrive in an early-stage, fast-paced environment with a
    high degree of ambiguity and agency.
  - Impact-driven — you focus on the most important problems to
    solve and execute to deliver. You get shit done.
  - Bias towards action and ownership – when you see a problem,
    you fix it.
  - Customer-centric – you are focused on creating the best
    customer experience possible.
  - Move fast — you can operate at breakneck speed and work
    furiously to ship, ship, ship.
  - 7+ years of engineering experience.

  You’ll stand out if you have:

  - Experience building B2B software and/or fintech software.
  - Experience at seed/early-stage startups (eg, being a first-3
    engineer at a company).
  - Experience building and maintaining open source software.
  - Previously started a company and/or launched personal
    projects.
  - Experience with AI promting, models, and tools. You are
    someone who not only leverages these in your work, but can
    help level-up our team.

  Our tech stack:

  React, Node, Fastify, MUI, React Query, Vite, Storybook,
  Playwright

  Why Dispatch?

  Why work at Dispatch?

  - We’re a highly experienced team with a track record of
    successfully building together. We’re well-versed in
    building for the best tech companies and asset managers.
  - We’re a well-funded company backed by top-tier investors.

  - We're laser-focused on customers and believe that a world-
    class user experience is critical for product and business
    success.

  - We move fast, iterate quickly, and have a high bar for what
    “excellent” looks like.

  What we offer:

  - Competitive salary and equity options
  - High-quality benefits package including 100% company-paid
    insurance premiums for family coverage (medical, vision,
    dental).
  - 401K, HSA & FSA plans
  - OneMedical, HealthAdvocate, TalkSpace, and Teladoc
    memberships
  - Technology stipend
  - Unlimited PTO
  - Paid parental leave
  - Office space in San Francisco and New York for in-person
    working

  Dispatch provides equal employment opportunities to all
  employees and applicants for employment and prohibits
  discrimination and harassment of any type without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetics, protected veteran status, sexual
  orientation, gender identity or expression, or any other
  characteristic protected by federal, state or local laws.
