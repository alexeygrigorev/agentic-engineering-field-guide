description: |
  Company Overview:

  Kale’s mission is to empower people to translate their
  social value into economic value. With our focus on everyday
  creators and a content-first discovery experience, Kale is
  redefining social commerce. Our goal is to flip influencer
  marketing on its head to put power back in the hands of true
  customers, making brand/creator relationships genuine and
  trustworthy.

  Job Description:

  As a Full Stack Engineer at Kale, you will work closely with
  product managers, and software engineers to develop and
  deploy new features and enhancements to our website, mobile
  app and backend platform to elevate the user experience and
  drive business value. You will likely lean into one area or
  specialty, either on the frontend or backend, but you will
  be excited to learn and deepen your skill set in other
  areas. Day to day, you will collaborate and pair with your
  engineering teammates helping to architect and implement
  solutions that add value to Kale’s brands, creators and the
  dynamics of the marketplace.

  Expectations in this role:

  - You are a contributor who promotes software best practices
    and team health. You create a positive impact through your
    work.
  - As your work inspires your team to work with you, you are
    able to occasionally mentor them and connect people.
  - You drive solutions to simplify complexity and develop the
    approach to tackle a problem. You have a background in
    overseeing complex systems with subsystems, internal
    initiatives.
  - You are a practitioner that understands the broader context
    of the system you impact, going on at least one area of
    the product.

  Tech stack

  - Several React.js and Spring applications deployed statically
    in Google App Engine
  - Our design system and mockups specified in Figma
  - Our API is built on Kotlin Spring using GraphQL
  - The Kotlin API is backed by a Postgres database, and
    integrations with third party data sources.
  - Automated continuous integration and deployment pipelines
    for the frontend and backend that spin up review
    applications after they have run the test and build suite.

  Qualifications:

  - Bachelor's or Master's degree in Computer Science,
    Engineering, or related field
  - 3+ years of experience as a software engineer or related
    role
  - Strong programming skills in Kotlin/Java, Javascript, React,
    GraphQL,
  - Familiarity with cloud platforms such as AWS or GCP
  - Strong problem-solving skills and ability to work
    independently and in a team

  Nice to haves:

  - Professional experience at a software startup.
  - Experience as a technical mentor.
  - Experience designing and building APIs.

  If you're passionate about applying software engineering to
  real-world business problems and want to make an impact at a
  fast-growing startup, we encourage you to apply for this
  exciting opportunity at Kale!
