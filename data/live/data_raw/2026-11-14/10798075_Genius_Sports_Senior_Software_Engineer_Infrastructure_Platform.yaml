  The Role - Senior Software Engineer - Infrastructure
  Platform

  We are seeking a Senior Software Engineer to help lead
  critical initiatives of our core infrastructure platform.
  Genius Sports is currently in the process of aligning its
  various tech teams and acquisitions under one unified
  technical strategy. The infrastructure platform is the
  ground level of this change. The goal is to enable
  engineering teams to build, deploy, and operate Genius
  Sport’s massive product catalog in a consistent and cohesive
  manner.

  In this role, you’ll work on the InfraPlat team to lead and
  implement technical initiatives for a variety of projects.
  Some of these initiatives include multi-account/region
  Kubernetes clusters, MLOps, standardized deployments, and
  the company-wide authentication platform. In addition, you
  will engage with stakeholders from product engineering teams
  to scope requests, identify shared pain points within the
  org, and prioritize initiatives.

  What You’ll Bring

  - 6+ years of experience building software and operating
    platforms.

  - Experience building applications and automations to
    eliminate toil for engineering teams.

  - Understand the developer experience and what it takes to
    magnify the output of engineers across the whole org.

  - Strong communication skills that enable you to drive
    platform adoption forwards for new teams.

  - Passion for mentorship and upleveling the team around you to
    maximize their full potential.


  It’ll Be a Bonus if You Have

  - Experience developing agentic environments and harnessing.

  - Experience with Rust in production.

  - History of open source contribution.

  - Full stack software development experience with web
    applications or data pipelines.

  The salary for this role is based on an annualized range of
  $180,000 - $250,000 USD. This role will also be eligible to
  take part in Genius Sports Group's benefits plan.

  We enjoy an ‘office-first’ culture and maximize
  opportunities to collaborate, connect and learn together.
  Our hybrid working models differ depending on your role and
  location. Occasional travel may be required.

  As well as a competitive salary and range of benefits, we’re
  committed to supporting employee wellbeing and helping you
  grow your skills, experience and career. Learn more about
  how rewarding life at Genius can be at Reward | Genius
  Sports.

  One team, being brave, driving change 

  We strive to create an inclusive working environment, where
  everyone feels a sense of belonging and the ability to make
  a difference. Learn more about our values and culture at
  Culture | Genius Sports.

  Let us know when you apply if you need any assistance during
  the recruiting process due to a disability.
