description: |
  Fullstack Software Engineer (Remote)

  CreateBase is building the future of music rights
  infrastructure—and we’re looking for a Fullstack Software
  Engineer to help us scale it.

  This is an equity-only role to start, with a path to
  competitive cash compensation post-fundraise. We’re fully
  remote, but we work Pacific Time hours and move fast.

  As an early engineer, you’ll help architect and build the
  core systems powering our metadata and royalties platform.
  You’ll work across the stack—building elegant UIs and robust
  APIs, integrating AI tooling, and shaping the future of
  music tech.

  What You’ll Do

  - Design, build, and maintain core backend services and modern
    frontend interfaces
  - Own features end-to-end—from brainstorm to production
  - Collaborate closely with founders, designers, and fellow
    engineers
  - Optimize systems for performance, security, and scalability
  - Build and integrate with modern AI/infra tools (we move fast
    and use what works)

  You Should Have

  - 3–6+ years of fullstack experience (frontend/backend split
    doesn’t matter as long as you can ship)
  - Strong backend fundamentals—REST APIs, databases
    (PostgreSQL, Redis), authentication, etc.
  - Proficiency with Node.js, Python, or Go
  - Solid experience with React (or another modern frontend
    framework)
  - Familiarity with cloud infrastructure (AWS, Vercel,
    Supabase, etc.)
  - Comfortable working with modern AI/DevEx tools (e.g.,
    Cursor, GPT-4, Supabase Edge Functions)

  Bonus Points For

  - Experience with music tech, IP, or fintech platforms
  - A product mindset—you care about users and shipping quickly
  - Open source contributions or a portfolio of projects

  We’re not just building software. We’re building a category.
  If you want to help creators get paid what they’re owed—and
  you want to work with a team that moves fast and builds
  smart—come join us.

  Apply now by sending your resume (and any relevant work or
  portfolio) to arsh@createbase.com.

  Let us know why you’re excited about CreateBase. We’ll be in
  touch if it’s a fit.
