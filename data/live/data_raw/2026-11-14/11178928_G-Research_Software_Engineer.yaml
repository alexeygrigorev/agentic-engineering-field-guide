description: |
  We tackle the most complex problems in quantitative finance,
  by bringing scientific clarity to financial complexity.

  From our London HQ, we unite world-class researchers and
  engineers in an environment that values deep exploration and
  methodical execution - because the best ideas take time to
  evolve.  Together we’re building a world-class platform to
  amplify our teams’ most powerful ideas.

  As part of our engineering team, you’ll shape the platforms
  and tools that drive high-impact research - designing
  systems that scale, accelerate discovery and support
  innovation across the firm.

  The role

  Engineering underpins our continued growth and success, and
  we are committed to recruiting and developing the world’s
  best Engineers.

  Our Engineers are the enablers of our success. They work
  side-by-side with our researchers to realise their ideas in
  global financial markets. They work at the bleeding-edge
  with immense compute power at their fingertips to achieve
  our aim: predicting the future.

  The core tech stack is C# and Python, productionised in our
  own datacentres.

  Areas of focus for these teams include:

  - Trading systems – reliable and performant systems able to
    trade 24/6 for our customers, with real money at stake
  - Modelling – building core capabilities and assisting quant
    researchers in our cutting-edge prediction capabilities
  - Simulation – back-testing frameworks for validating the
    strategies our researchers produce and for assessing their
    ongoing performance
  - Research tooling – front-end UX and workflow for our quant
    researchers
  - Performance and scalability – optimising our trading and
    research systems to unlock new capabilities

  To give a flavour of the work we do, here are some of our
  recent projects:

  - Low level performance optimisations in our core simulation
    engine, unlocking the next advances in quant research
  - Experimenting with alternative solvers in a core trade
    planning system
  - Integrating our high and low frequency systems for more
    optimal trading
  - Re-architecting systems to provide a seamless path from
    research to production for machine learning models

  - Enabling large-scale distributed training of machine
    learning models
  - Contributing back to open-source projects

  Who are we looking for?

  - Deliver high-quality, well-engineered software with strong
    architectural awareness
  - Take end-to-end ownership of solutions, from concept to
    delivery
  - Demonstrate solid knowledge of algorithms, data structures
    and software fundamentals
  - Show interest in quantitative finance and the role of
    engineering within it
  - Prioritise effectively to deliver measurable business impact
  - Proactively identify and implement scalable improvements
  - Stay ahead of emerging technologies and drive their adoption
  - Apply sound judgment and balance competing approaches
  - Communicate clearly and adapt their style to different
    audiences
  - Understand others’ needs to deliver mutually beneficial
    outcomes
  - Collaborate effectively and build strong relationships
    across the business

  Why should you apply?

  - Highly competitive compensation plus annual discretionary
    bonus
  - Lunch provided (via Just Eat for Business) and dedicated
    barista bar
  - 35 days’ annual leave
  - 9% company pension contributions
  - Informal dress code and excellent work/life balance
  - Comprehensive healthcare and life assurance
  - Cycle-to-work scheme
  - Monthly company events

  G-Research is committed to cultivating and preserving an
  inclusive work environment. We are an ideas-driven business
  and we place great value on diversity of experience and
  opinions.

  We want to ensure that applicants receive a recruitment
  experience that enables them to perform at their best. If
  you have a disability or special need that requires
  accommodation please let us know in the relevant section
