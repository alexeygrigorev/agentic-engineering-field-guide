description: |
  Why Rogo

  Our mission is to transform global finance by empowering
  professionals at the world's top investment banks, private
  equity funds, and investment firms with AI that delivers
  unparalleled speed, accuracy, and insight. We're not just
  improving financial workflows; we're redefining them.

  This is a unique opportunity to join a generational company
  driving transformation in one of the most important
  industries in the world. With a rapidly growing, global
  client base, proven product-market fit, and backing from
  world-class investors, we are scaling quickly and defining a
  new category of enterprise AI.

  Our team is sharp, motivated, and deeply committed to Rogo’s
  mission. We take ownership of complex problems and stay
  relentlessly focused on our users. If you thrive in a fast-
  paced environment, demand excellence, and want to help build
  the future of finance, we invite you to join us.

  What You Will Own

  As a Full-Stack Engineer at Rogo, you will be instrumental
  in shaping the product of a cutting-edge AI tool, crucially
  keeping us at the forefront of what's possible with LLMs.

  - Major product features across the stack from design to
    launch
  - Feedback loops with users and with our Customer Success team
  - Partner with our cross-functional team of engineers and
    domain experts to architect scalable systems, implement
    robust software components, and ensure the reliability and
    performance of our software platforms

  What You Will Need

  - Bachelors in Computer Science or Equivalent degree
  - You write amazing code, fast
  - Extensive knowledge of React and TypeScript
  - Deployed Production code with Python, NextJS, NestJS,
    Typescript, Docker, AWS, and Tailwind
  - Keen interest in developing unique AI tools and user
    experiences
  - Experience updating codebases with the newest framework
    features (RSC, streaming, etc.)
  - Exceptional attention to detail
  - Proven track record in similar roles
  - Self-motivated with a drive to take ownership of projects
    end-to-end
  - A passion for craftsmanship
  - 5+ years of industry experience

  Bonus

  - Experience at a leading AI research institution
  - Early engineer at a hyper-growth startup
  - Experience in world-class product organizations (e.g.,
    Notion, Figma)
  - Demonstrated passion for startups or early-stage companies
  - Experience with UI/UX and product design

  Who You Are

  - You thrive in fast-paced environments. You are high-
    intensity and care a lot about what you do, and you're
    ecstatic to work at a startup.
  - You are ambitious. You have fun solving problems that others
    think are impossible.
  - You are curious. You find joy in learning about AI,
    technology, and finance.
  - You are an owner. You are autonomous, self-directed, and
    comfortable working with ambiguity.
  - You are collaborative, organized, thoughtful, and kind.

  Why Join Rogo?

  - Up and to the right: Rogo has strong product adoption with
    the world's leading financial institutions, and we are
    still early. The upside is enormous.
  - Extraordinary team: we take talent density seriously. You'll
    do the best work of your career alongside some of the
    sharpest people in AI and finance.
  - A one-of-one problem: bringing AI to the core of how Wall
    Street works is one of the most ambitious, technically
    demanding, and consequential problems today. There is
    nowhere else you can work on it at this scale.
  - Real ownership: You'll own real surface area and watch the
    world's most sophisticated users rely on your work.
  - Always at the frontier: we work at the edge of what the best
    models can do and turn it into products people trust. If
    you're obsessed with AI, this is where it's happening.
