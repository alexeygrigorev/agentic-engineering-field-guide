description: |
  About Us

  Rivian and Volkswagen Group Technologies is a joint venture
  between two industry leaders with a clear vision for
  automotive’s next chapter. From operating systems to zonal
  controllers to cloud and connectivity solutions, we’re
  addressing the challenges of electric vehicles through
  technology that will set the standards for software-defined
  vehicles around the world.

  The road to the future is uncharted. By combining our
  expertise across connectivity, AI, security and more, we’ll
  map a new way forward. Working together, we’ll create a
  future that’s more connected, more intelligent, more
  sustainable for everyone.

  Role Summary

  Parallax is the core messaging platform that moves vehicle
  states, commands, and events between vehicle ECUs, cloud
  services, and mobile apps, using one shared definition.
  Parallax runs in the cloud and in every vehicle, across
  Rivian and Volkswagen Group brands.

  As a Senior Software Engineer on the cloud side of Parallax,
  you will build and operate the distributed services and SDKs
  that hide messaging complexity from product teams, and
  evolve the shared schema together with vehicle, firmware,
  and mobile teams. You will trace problems from a gateway
  call through authorization and routing down to the vehicle,
  and carry your changes from design through production.

  This role is based in our Berlin office and requires a
  minimum of three days per week onsite.



  Responsibilities

  - Design, build, and operate cloud services and gRPC/Protobuf
    APIs that every connected feature uses to read vehicle
    state, subscribe to changes, and send commands.
  - Shape the shared vehicle model definitions with vehicle and
    mobile teams, for new connected features across vehicle,
    cloud and app.
  - Operate and tune NATS, the messaging layer that carries
    vehicle traffic, including configuration, upgrades,
    troubleshooting, performance validation, and capacity
    planning.
  - Scale the system as more brands join, keeping each brand's
    vehicles and data isolated on shared infrastructure.
  - Own services end to end, from implementation through
    deployment and production operation, using Kubernetes,
    GitOps/Argo CD, and infrastructure as code.
  - Diagnose production behavior across cloud and vehicle using
    metrics, traces, logs, dashboards, and alerts.
  - Design, operate, and tune service networking, load
    balancers, and L4/L7 traffic routing.
  - Develop and run end-to-end, integration, and load tests,
    including fleet-scale simulations, to catch functional and
    performance regressions before production.



  Qualifications

  Minimum Qualifications:

  - At least 5 years of software engineering experience focused
    on distributed systems, high-scale backend services, or
    streaming and messaging platforms.
  - Strong proficiency in at least one general-purpose
    programming language and willingness to work primarily in
    Go, with occasional work in Java and TypeScript client
    SDKs.
  - Practical experience building and operating production
    services, including observability and troubleshooting.
  - Solid foundations in API design, networking, concurrency,
    and distributed systems with working knowledge of
    Kubernetes.

  Preferred Qualifications

  - Hands-on experience with high-throughput messaging systems
    such as NATS, Kafka, or MQTT.
  - Experience with Kubernetes and owning service deployments;
    familiarity with GitOps/Argo CD and infrastructure as
    code.
  - Strong knowledge of HTTP/2, TCP, L4/L7 load balancing along
    with experience operating gRPC services in production is a
    major plus.
  - Familiarity with mTLS, certificates, service identity,
    secure transport and authentication patterns.
  - Track record of maintaining or making contributions to
    established open-source projects.



  Why this role

  Parallax Cloud engineers collaborate closely with both
  product and cloud platform teams, creating a unique
  opportunity to shape how connected features are designed and
  how the underlying platform evolves. The role offers broad
  visibility across the system and meaningful influence on
  decisions on both sides. You will have the autonomy to
  investigate problems and carry improvements from design
  through rollout.

