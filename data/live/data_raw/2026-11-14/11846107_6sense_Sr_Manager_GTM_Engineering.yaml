  Senior Manager, GTM Engineering

  Marketing Operations | Reports to: Sr. Director, Marketing
  Operations | Direct reports: 1 (BDR Operations Specialist)

  About the Role

  6sense's Marketing Operations team builds the technical
  backbone behind our go-to-market motion: systems
  integration, campaign orchestration, and AI-assisted
  workflows across the marketing and BDR stack.

  This role will create the AI architecture, agents, and
  workflows that power our agentic GTM motion.

  Why this role, why now

  6sense is building the intelligence engine for agentic go-
  to-market, and this role is central to how our own Marketing
  team puts that strategy into practice. What you build will
  run our pipeline motion and get regular visibility from
  leaders across the company. It's a rare chance to build
  agentic GTM inside the company defining it.

  The Sr. Manager, GTM Engineering builds the automations,
  integrations, and AI agents that let Marketing scale output
  efficiently while increasing productivity and impact. That
  spans core GTM engineering (lead capture, routing, and BDR
  handoff), BDR prospecting automation, agentic support for
  content and campaign creation, and ABM personalization
  across Marketing.

  This is a hands-on technical role with management
  responsibilities. You'll independently weigh tradeoffs
  across speed, scale, data quality, privacy, AI governance,
  adoption, and pipeline impact, and serve as the go-to
  technical voice on what's scalable and sound, turning
  strategy into working systems that marketers and BDRs
  actually use. You'll own GTM engineering priorities and
  delivery across Marketing and BDR teams, partnering with
  Marketing Operations, Revenue/Growth Marketing, Customer and
  Event Marketing, BDR Leadership, RevOps, and IT.

  Key Responsibilities

  AI Agent & Workflow Architecture

  - Build agentic workflows for end-to-end campaign creation,
    from brief intake to first-draft assets, using Claude and
    comparable enterprise LLM platforms. Orchestrate agents
    across MCP connectors to optimize AI usage across the
    stack. Partner with Growth, Customer, and Event Marketing
    to cut manual production time on recurring campaign types,
    with human review in the loop.
  - Automate Marketing work management. For example, create
    workflows that allow marketers to build campaign assets
    leveraging centralized context governing product
    positioning, use cases, personas, and marketing channel
    best practices.
  - Build reusable patterns, templates, and playbooks so
    Marketing teams can adopt automations without GTM
    Engineering support.

  GTM Systems Architecture & Integration

  - Be our own best customer: Build the best-in-class use of the
    6sense platform within a headless GTM architecture, using
    6sense data and intelligence through external tools, APIs,
    and MCP.
  - Build BDR prospecting automation, including signal-based
    account prioritization, research assembly, outreach
    drafting, and task automation, to increase high-quality
    pipeline per BDR.
  - Own the BDR technology stack, including the sales engagement
    platform and dialer, with BDR leadership and your BDR
    Operations Specialist.
  - Partner with BDR leaders to find productivity bottlenecks,
    then prioritize, ship, and measure fixes.

  Governance, Experimentation & Iteration

  - Embed security, privacy, and compliance into workflows and
    agents by design, including data handling, agent
    permissions, and access controls, in partnership with
    Business Technology and Security.
  - Flag design or scale risk in workflows and agents before
    they ship.
  - Run technical experiments on automation and agent logic, and
    iterate on performance data and pipeline impact with BDR
    and Marketing leadership.

  Team Leadership & Influence

  - Manage, coach, and prioritize work for one direct report
    (BDR Operations Specialist), developing their ownership of
    BDR tooling and process.
  - Run intake and prioritization of automation requests across
    competing stakeholders, and influence senior Marketing and
    Revenue leaders without relying on authority.

  Required Qualifications

  - 7+ years in marketing operations, GTM/revenue systems
    engineering, or marketing automation, with ownership of
    complex GTM systems, cross-functional roadmap delivery,
    and executive stakeholder management.
  - Hands-on experience building automations and integrations
    across a marketing/RevOps stack, such as Salesforce,
    Marketo, and 6sense or comparable ABM/intent platforms
    (APIs, webhooks, iPaaS).
  - Strong understanding of top-of-funnel GTM and BDR/SDR
    operations: lead routing, scoring, handoff SLAs, sales
    engagement and dialer tooling, and attribution.
  - Experience building AI-assisted workflows or agents in a
    business context using Claude or comparable LLM platforms,
    with working fluency orchestrating agents through MCP
    connectors or similar.
  - Experience building content and campaign automation
    workflows, from brief intake to first-draft assets.
  - B2B SaaS or subscription GTM experience, ideally across
    multiple regions, segments, or sales motions.
  - Experience managing, mentoring, or technically leading
    others.
  - Ability to translate business needs into practical technical
    delivery plans and build effective relationships across
    Marketing, Sales, RevOps, and IT.

  Who You Are

  - Curious and a natural problem solver: you dig into root
    causes, not just the request in front of you.
  - Proactive with a strong bias to act: you form theories and
    test them on your own, without waiting to be asked, move
    fast within guardrails, measure the results, and retire
    what doesn't work.
  - A strategic translator: you turn business strategy into
    tangible actions, workflows, and systems.
  - Comfortable with visibility: you communicate credibly with
    senior leaders across Marketing, Sales, and the executive
    team.

  Preferred Qualifications

  - Experience building ABM personalization and GTM workflows at
    scale.
  - Experience automating work-management tools such as Asana.
  - Familiarity with attribution platforms such as Dreamdata.
  - Exposure to AI governance and responsible-AI practices.

  Success Measures

  - Increase in high-quality pipeline generated per BDR to
    contribute to bookings.
  - Measurable improvement in speed-to-lead and routing accuracy
    from lead capture to BDR handoff.
  - Measurable reduction in BDR manual and administrative time.
  - AI-assisted workflows and agents that run reliably in
    production with real adoption across Marketing, not just
    GTM and outbound.
  - Measurable reduction in manual production time for campaign
    creation and ABM personalization.
  - Zero production incidents from agents or automations
    reaching customers or prospects without review.

