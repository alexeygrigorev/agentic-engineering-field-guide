description: |
  About Harmonic

  Harmonic is the startup discovery engine.

  It pains us to see great startup opportunities consistently
  go unfunded not because of lack of talent, but lack of
  signal.

  We're fixing that by mapping the entire startup landscape
  and building the tools that put the right companies in front
  of the right people at the right time. Investors, corporate
  development, and GTM teams use us to find breakout companies
  before they're obvious and turn that discovery into action.
  Whether that's a check, an acquisition, partnership or new
  business.

  We're growing revenue at a rate of 100%+ annually, with $30M
  in funding from Craft, Floodgate, and Sozo Ventures. We're
  committed to ensuring hundreds of billions of dollars find
  the right founders, so the innovations that matter most
  flourish. If that resonates, let's talk.

  We are looking for full-stack engineers to join one of our
  three teams:

  - Discovery. We build the intelligence layer behind Harmonic,
    transforming hundreds of fragmented, unstructured sources,
    from APIs and raw HTML to legal filings, into structured
    knowledge about startups, investors, and people. On top of
    that foundation, we're building an agentic research system
    that lets VCs explore the startup ecosystem through
    natural language and structured queries, surfacing
    breakout companies before anyone else.
  - Flow. Flow is Harmonic's deal management system, built
    natively on top of our knowledge graph. Instead of forcing
    investors to sync data between a CRM and external sourcing
    tools, Flow makes Harmonic a first-class system of record.
    VCs can manage deals, track companies, and collaborate
    directly within the platform, the most intuitive and
    performant way to source, research, and triage
    opportunities in one place.
  - Ecosystem. Ecosystem is focused on making Harmonic first-
    class wherever investors already work, and on bringing the
    data from those surfaces back into the product as core
    context for Scout.

  Who You Are

  - You have 5-8 years of experience building full-stack
    products at scale. This role leans roughly 70/30 back-end.
  - You've ideally been a founding engineer, or joined a product
    early and helped scale it.
  - You have a record of shipping high-quality product. We want
    to hear about the major releases you've driven over the
    past several years.
  - You build with core CS principles and have a strong
    understanding of how to build highly performant products.
  - You have experience building and scaling data pipelines for
    products that rely on large datasets.
  - You're skilled at turning ambiguity into clarity: building
    scalable, performant, and observable systems from first
    principles while balancing technical, product, and
    organizational tradeoffs.
  - You're customer obsessed. You love building products for
    customers and are always looking to improve their
    experience.
  - You're methodical in how you build. You believe in being
    measured, in experimenting, and in learning quickly. We
    ship fast, learn, and iterate, but always in a methodical
    way.
  - You have an interest in venture capital and the startup
    ecosystem.

  What You'll Do

  - Own customer-facing features and experiences end to end,
    from the customer's perspective, so that what you ship
    works exceptionally well.
  - Build scalable, performant, and observable systems from
    first principles, from the data and pipelines underneath a
    feature to the full-stack product experience on top of it.
  - Ship fast, measure what happens, and iterate, treating every
    release as a chance to learn something real about the
    product and the customer.
  - Work cross-functionally with Design, Product, and GTM to
    build with a customer-first mentality.
  - Constantly question and explore how we can improve our
    product experience.

