  Senior Software Engineer I - Observability Platform

  Work Model: Onsite, Framingham, Massachusetts

  Staples is business to business. You’re what binds us
  together.

  Our eCommerce team delivers customer-centric site
  experiences to position Staples as a digital selling
  platform of choice. Our team ensures that our mobile,
  desktop, and app platforms deliver the digital experience
  that our customers expect.  We do this through customer
  insights, analytics, and testing to build a strong
  innovation pipeline for the future and to bring products and
  solutions to market seamlessly. We utilize online
  merchandising and campaigns executed by both humans and
  automated tools to convert new and returning website
  visitors into customers. We work end-to-end with our sales,
  merchandising, finance, logistics and technology teams to
  provide a world-class, holistic digital experience, growing
  profitable results in a fun and rewarding work environment.
  We are inclusive, customer-obsessed, and are looking for
  well-rounded professionals with strong eCommerce business
  acumen to join our team

   Team Summary:

  The Observability Platform team within Staples Digital
  Solutions builds and operates the enterprise monitoring and
  telemetry capabilities that help keep customer-facing
  platforms, supply chain systems, and critical business
  applications reliable, available, and performant. The team
  partners across engineering, Site Reliability Engineering,
  infrastructure, security, product, procurement, and
  technology vendors to improve operational visibility,
  accelerate issue resolution, and strengthen resilience
  across distributed and cloud environments.

  Role Summary:

  As a Senior Software Engineer I - Observability Platform,
  you will serve as a senior technical contributor and subject
  matter expert for enterprise observability technologies. You
  will administer, engineer, integrate, and continuously
  improve infrastructure monitoring, application performance
  monitoring, digital experience monitoring, and telemetry
  management solutions. Using advanced technical knowledge and
  independent judgment, you will solve complex operational
  challenges, automate platform activities, improve signal
  quality, manage platform capacity and usage, and help
  strengthen service reliability and performance across the
  enterprise.

  What you’ll be doing:

  - Administer, configure, maintain, and enhance enterprise
    infrastructure monitoring, application performance
    monitoring, digital experience monitoring, and telemetry
    management platforms.
  - Lead the technical onboarding of applications, services,
    infrastructure components, and cloud resources into the
    enterprise observability ecosystem.
  - Design monitoring policies, alerting rules, dashboards,
    telemetry collection, health reporting, and diagnostic
    capabilities for distributed applications and
    infrastructure environments.
  - Develop scripts, automation, infrastructure-as-code, and
    reusable platform capabilities that improve deployment
    consistency, operational efficiency, and observability
    coverage.
  - Integrate observability platforms with IT service
    management, configuration management databases, incident
    management systems, CI/CD pipelines, and other enterprise
    technology tools.
  - Diagnose and resolve complex platform, performance,
    availability, telemetry, and integration issues affecting
    multiple applications, services, or technology teams.
  - Analyze alerts, telemetry volume, platform usage, licensing
    consumption, and capacity requirements; recommend
    improvements to signal quality, scalability, and cost
    efficiency.
  - Establish observability standards, implementation patterns,
    platform documentation, and operational procedures based
    on technical and industry best practices.
  - Evaluate emerging technologies and vendor solutions, and
    lead or guide complex platform upgrades, migrations,
    integrations, and operational improvement initiatives.
  - Partner with observability vendors and procurement teams on
    technical enablement, licensing, contracts, support cases,
    and renewal requirements.
  - Mentor less experienced engineers and provide technical
    direction, design reviews, and solution guidance without
    direct people-management responsibility.
  - What you bring to the table:
  - Advanced analytical and problem-solving skills, with the
    ability to isolate complex performance, availability,
    platform, and integration issues.
  - Strong systems thinking and an understanding of dependencies
    across applications, infrastructure, cloud services,
    telemetry pipelines, and operational processes.
  - Initiative and intellectual curiosity to evaluate emerging
    technologies, challenge inefficient practices, and
    introduce practical improvements.
  - Sound judgment when balancing service reliability,
    operational risk, monitoring coverage, telemetry volume,
    platform capacity, licensing usage, and cost.
  - Strong collaboration, communication, and influencing skills,
    including the ability to explain complex technical
    concepts to technical and nontechnical audiences.
  - The ability to manage complex assignments, balance competing
    priorities, and deliver short- and mid-term outcomes with
    limited oversight.

  What’s needed- Basic Qualifications:

  - Bachelor’s degree in Computer Science, Engineering, or a
    directly related field.
  - 7+ years of progressively complex experience in software
    engineering, systems engineering, platform engineering,
    Site Reliability Engineering, infrastructure engineering,
    or a related technology discipline.
  - 3+ years of hands-on experience administering or engineering
    an enterprise observability, infrastructure-monitoring, or
    application performance monitoring platform, such as
    Zabbix, New Relic, Dynatrace, Datadog, SolarWinds, or
    AppDynamics.
  - 3+ years of experience configuring monitoring, alerting,
    dashboards, telemetry collection, health reporting, or
    diagnostic capabilities for distributed applications or
    infrastructure environments.
  - 2+ years of experience with a scripting, automation,
    configuration-management, or infrastructure-as-code
    technology, such as Python, PowerShell, Bash, Terraform,
    Ansible, or Jenkins.
  - Experience integrating an observability platform with an
    ITSM, CMDB, incident-management, or CI/CD toolchain.
  - Experience supporting production applications or
    infrastructure in Microsoft Azure, Google Cloud Platform,
    Amazon Web Services, or another public-cloud environment.
  - Working knowledge of observability platform licensing, cost
    management, vendor relationships, and contracts.

  What’s needed- Preferred Qualifications:

  - Current certification in New Relic, Zabbix, Dynatrace,
    Datadog, Microsoft Azure, Google Cloud, AWS, or a related
    observability or cloud technology.
  - 2+ years of hands-on experience with OpenTelemetry,
    distributed tracing, synthetic monitoring, digital
    experience monitoring, or real user monitoring.
  - 2+ years of experience integrating or operating ServiceNow,
    PagerDuty, Jira, Confluence, or comparable enterprise
    operational tools.
  - Experience providing technical leadership for an enterprise
    observability implementation, platform upgrade, migration,
    or complex integration.
  - Experience supporting an Agile or SAFe delivery environment
    for at least one year or through two or more program
    increments or major releases.
  - Experience supporting observability capabilities for
    eCommerce, supply chain, retail, or another large-scale
    customer-facing technology environment.
  - Experience leveraging artificial intelligence to enhance
    observability solutions.

  We Offer:

  - Inclusive culture with associate-led Business Resource
    Groups
  - 22 days of PTO and Holiday Schedule (7 observed paid
    holidays + 1 floating holiday)
  - Online and Retail Discounts, Company Match 401(k), Physical
    and Mental Health Wellness programs, and more!

  The salary range represents the expected compensation for
