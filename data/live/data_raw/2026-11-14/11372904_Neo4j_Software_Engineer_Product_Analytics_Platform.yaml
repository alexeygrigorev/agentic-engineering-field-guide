description: |
  About Neo4j:

  Neo4j is the graph intelligence platform that transforms
  data into knowledge to power the next generation of
  intelligent applications and AI systems. It includes
  enterprise-ready knowledge graphs for accurate, explainable,
  and governed AI; the most comprehensive, trusted, and easy-
  to-deploy graph capabilities across any environment and data
  source; and an unmatched ecosystem trusted by 84 of the
  Fortune 100 and supported by the world’s largest graph
  community. Intelligence that works. Results that matter.

  Built to work everywhere and integrate with everything
  across every cloud for dynamic, personalized, and autonomous
  AI systems. We deliver quicker results, contextual
  knowledge, and solutions that impact customers and employees
  across the business.

  Our Vision:

  At Neo4j, we have always strived to help the world make
  sense of data.

  As business, society and knowledge become increasingly
  connected, our technology promotes innovation by helping
  organizations to find and understand data relationships. We
  created, drive and lead the graph database category, and
  we’re disrupting how organizations leverage their data to
  innovate and stay competitive.

  The Team:

  Neo4j's managed cloud offering, Aura, brings the power of
  graph databases to the cloud. We're forming a new Product
  Analytics Platform team.

  As Neo4j Aura’s platform and product surface area have
  grown, so has the need for a consistent, purpose-built way
  to capture what's happening across them. Today, each product
  tracks its own data, but retrieving it can be difficult.

  This team will own the Analytics API and infrastructure that
  collects raw product analytics events from across Neo4j's
  products so every team integrates with one contract instead
  of inventing their own.

  The Role:

  In this role you’ll be one of the founding members of the
  Product Analytics Platform team. You’ll help define the
  technical foundations for how product analytics data is
  captured across Aura, building the Analytics API and
  underlying infrastructure that provides a consistent
  integration point for engineering teams across Neo4j.

  You’ll have significant ownership over the design of the
  API, balancing the needs of multiple product teams with the
  long-term maintainability of the platform. You’ll work
  closely with Product Management and other engineering teams
  to shape the solution, drive adoption, and evolve it as the
  platform grows.

  Primary responsibilities

  - Design, build, and operate the Analytics API and the
    underlying infrastructure, defining the schema and
    integration contract used by teams across Aura.
  - Make pragmatic architectural decisions around event
    ingestion, data contracts, reliability, and scalability as
    the platform grows.
  - Build a simple, well-defined integration layer that makes it
    easy for product teams to send analytics events without
    coupling them to the underlying data infrastructure.
  - Drive adoption across the Engineering organisation, working
    with teams to integrate with the API and providing the
    guidance and documentation they need.
  - Keep product analytics and billing concerns cleanly
    separated, even where the underlying data flows or
    infrastructure may be similar.
  - Evaluate build vs. buy across the existing analytics and
    data stack, including tools such as Segment and BigQuery,
    keeping the API focused on collection rather than
    reimplementing downstream capabilities.
  - Partner closely with the team building the downstream data
    pipeline to ensure raw events are reliable, well-
    structured, and usable for analytics.
  - Define and evolve the platform through RFCs, technical
    documentation, and close collaboration with Product
    Management and other engineering teams.

  What you'll need

  - Strong backend software engineering experience, with Go as
    your primary language, building and operating APIs,
    services, or ingestion systems that other teams depend on.
  - Experience designing well-defined APIs and integration
    contracts, including thinking about schemas, backwards
    compatibility, validation, and how other engineering teams
    will consume them.
  - Experience building production services in Go, from smaller
    utilities and scripts through to larger, long-running
    services or microservices.
  - Some experience with TypeScript or JavaScript and an ability
    to work comfortably in a codebase that spans backend and
    frontend technologies. This is primarily a backend role —
    you won't be responsible for UI development.
  - Familiarity with event-driven systems, data ingestion, or
    data pipeline tooling such as Segment, BigQuery, or
    similar.
  - Ability to work independently in a new area, make pragmatic
    technical decisions, and drive work forward with limited
    direction.
  - Comfortable writing RFCs and technical documentation, and
    working across teams to establish and drive adoption of a
    new integration point.
  - Clear, concise communication — a lot of this role involves
    defining contracts, documenting decisions, and helping
    other engineers integrate with what you build.

  What's nice to have

  - Experience with observability, including tracing, logging,
    and metrics.
  - Experience integrating with GCP, AWS, or Azure.
  - Experience working with product analytics, event tracking,
    or telemetry systems.

  #LI-Hybrid

  Why Join Neo4j?

  Neo4j is, without question, the most popular graph
  intelligence platform in the world. We have customers in
  every industry globally, and our products are a proven
  product/market fit. Joining our team is an opportunity to
  shape the future of data and analytics. Below are just a few
  exciting facts about Neo4j.

  - Neo4j is one of the fastest-scaling technology companies in
    this industry. It recently surpassed $200M in annual
    recurring revenue (ARR), doubling its ARR over the past
    three years.
  - Raised the biggest funding round in database history ($325M
    Series F). Backed by world-class investors like Eurazeo,
    GV (formerly Google Ventures), and Inovia Capital, Neo4j
    has raised over $600M in funding and is currently valued
    at over $2Bn. This puts Neo4j among the most well-funded
    database companies in history.
  - 84% of the Fortune 100 and 58% of the Fortune 500 use Neo4j.
    Examples include Boston Scientific, BT Group, Caterpillar,
    Cisco, Comcast, Department for Education UK, eBay, NBC
    News, Novo Nordisk, Worldline, and others.
  - Co-founder and CEO Emil Eifrem has built an amazing culture
    that prides itself on relationships, inclusiveness,
    innovation, and customer success.
  - Countless industry awards. Massive enterprises and
    individual developers/data scientists love Neo4j. A strong
    sense of community and ecosystem is built around the
    platform.
  - A recent Forrester Total Economic Impact™ Study cited Neo4j
    as delivering 417% ROI to customers.

