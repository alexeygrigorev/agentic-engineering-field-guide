description: |
  We help make autonomous technologies more efficient, safer,
  and accessible.

  Helm.ai builds AI software for autonomous driving and
  robotics. Our "Deep Teaching" methodology is uniquely data
  and capital efficient, allowing us to surpass traditional
  approaches. Our unsupervised learning software can train
  neural networks for L2/L3 autonomy, which drastically
  reduces the need for human annotation and is hardware-
  agnostic. We work with some of the world's largest
  automotive manufacturers towards mass production and we've
  raised over $100M from Honda, Mando, and others to help us
  scale.

  We are looking for versatile engineers to shape core
  components of the next generation of the Helm.ai autonomous
  stack. No prior experience in autonomous vehicles is
  required—we prioritize deep expertise in backend systems and
  a proven track record in high-impact software engineering.
  In this senior role, you will design, implement, and test
  safe, efficient, and reliable vehicle software/hardware
  systems, collaborate with sensor and compute vendors,
  partner with Helm.ai’s AI teams, and work with customers to
  advance highway and urban autonomous driving capabilities.

  You will:

  - Design, develop, and deliver safe, scalable, and robust
    real-time software for mass production grade autonomous
    vehicle systems directly contributing to safer roads and
    economically viable AI deployment.
  - Conduct in-depth algorithm analysis, optimization, and
    iteration to enhance efficiency and accuracy across the AV
    stack.
  - Architect scalable continuous learning system for deploying
    new ML models, monitoring their performance, and
    prioritizing improvements.
  - Collaborate with platform, embedded, and AI teams to ensure
    cohesive development, validation, and integration of ML
    based perception, prediction, and planning.
  - Stay abreast of industry trends and emerging tools in high-
    performance computing, real-time systems, and AI-driven
    mobility.

  You have:

  - Bachelor’s or Master’s degree in Computer Science,
    Electrical Engineering, Robotics; Ph.D. preferred.
  - Demonstrated ability to lead projects, mentor team members,
    and work autonomously in high-stakes fast-paced
    environments.
  - Strong foundation in backend programming (C++, Python) and
    proven track record in designing, developing, and
    deploying performant and/or real-time software systems,
    e.g. aerospace, online ads, robotics, gaming, high-
    frequency trading.
  - Strong command of data structures, algorithms, software
    architecture, and design patterns.
  - Excellent problem-solving, communication, and collaboration
    skills, with a passion for innovation.

  The following are not required but a plus:

  - Experience in autonomous vehicle development, with expertise
    in software/hardware integration. Experience with ROS2 or
    other robotics middleware.
  - Experience with ML model deployment and monitoring in
    production environments, including data pipeline
    management and model versioning for safety-critical
    systems.
  - Expertise in simulation tools (e.g., CARLA) and real-world
    testing protocols for autonomous vehicles.

  We offer:

  - Competitive health insurance options
  - 401K plan management
  - Remote-friendly and flexible team culture
  - Free lunch and fully-stocked kitchen in our South Bay office
  - Additional perks: monthly wellness stipend, office set up
    allowance, company retreats, and more to come as we scale
  - The opportunity to work on one of the most interesting,
    impactful problems of the decade

  Helm.ai is proud to be an equal opportunity employer
  building a diverse and inclusive workforce. All applicants
  will be considered for employment without attention to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, veteran or disability status.

  Any unsolicited resumes/candidate profiles submitted through
  our website or to personal email accounts of employees of
  Helm.ai are considered the property of Helm.ai and are not
  subject to payment of agency fees.
