description: |
  We require people to be on-site, 4 days/week at our NYC or
  Denver office and are unable to offer relocation support. LG
  Ad Solutions

  LG Ad Solutions is a global leader in connected TV (CTV) and
  cross-screen advertising. We pride ourselves on delivering
  state-of-the-art advertising solutions that integrate
  seamlessly with today's ever-evolving digital media
  landscape.

  The Opportunity:

  We are looking for a Senior Software Engineer II to join our
  dynamic engineering team in either our NYC or Denver
  offices. This role will focus on building and optimizing
  large-scale ad serving, measurement, and targeting systems
  that drive over $500M in revenue. Specifically, you'll be
  working on tools used by our clients to develop their
  customer segmentation strategies. You'll be part of a
  collaborative environment that leverages data engineering
  and distributed systems to power LG Ad Solutions' global CTV
  advertising platform.

  This is more than just a coding role. You will work closely
  with Product, Operations, and other Engineering teams to
  design, implement, and deploy scalable solutions across our
  ad tech stack. This role will also entail collaboration with
  our developer teams in India. This is a hands-on role that
  provides opportunities to lead impactful projects, mentor
  peers, and work with cutting-edge technologies in a fast-
  paced, data-driven environment.

  Responsibilities:

  - Design, develop, and deploy scalable ad serving and
    measurement systems supporting large data volumes and high
    throughput.
  - Implement and optimize big data applications for
    performance, reliability, and cost-efficiency.
  - Drive end-to-end ownership of projects from requirement
    gathering and design through delivery, monitoring, and
    maintenance.
  - Lead and mentor junior engineers, fostering growth and
    innovation through code reviews, design guidance, and
    continuous learning.
  - Champion best engineering practices and promote a culture of
    quality, operational excellence, and accountability within
    the team.
  - Collaborate cross-functionally with Product, Operations, and
    other Engineering teams to align on requirements and
    delivery timelines.
  - Work on integrations with internal and external platforms to
    enhance targeting and measurement capabilities.
  - Contribute to system architecture design, long-term
    technical vision, and roadmap planning.

  Requirements:

  - Bachelor's or Master's degree or relevant experience in
    Computer Science, Engineering, or a related field.
  - 5+ years of experience developing and maintaining large-
    scale, high-quality software systems.
  - Proficiency in one or more programming languages such as
    Scala, Go, Python, C++, or JavaScript, along with a strong
    knowledge of fundamental Computer Science concepts.
  - Experience working with technologies like Spark/Databricks,
    MySQL, Redis/ElastiCache, ReactJS, Kubernetes, and AWS.
  - Ability to independently understand, contribute to, and
    refactor large codebases.
  - Strong understanding of data structures, algorithms, and
    system design.
  - Collaborate closely with engineering teams in India to
    deliver high-quality solutions, share technical knowledge,
    and drive successful project execution.

  Preferred:

  - Prior experience scaling distributed computing and big data
    systems.
  - Proven track record of technical leadership in complex
    projects.
  - Experience working in a distributed global team environment
    and mentoring junior engineers.

  LG Ad Solutions provides equal work opportunities to all
  team members and applicants, and it prohibits discrimination
  and harassment of any type on the basis of race, color,
  ethnicity, caste, religion, age, sex (including pregnancy),
  national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by our
  policies or federal, state, or local laws.

  We want to ensure that our hiring process is accessible. If
  you need reasonable accommodation for any part of the
  application process because of a medical condition or
  disability, please send an email to careers@lgads.tv to let
  us know the nature of your request.

  Application Deadline: December 31, 2026

  Compensation & Benefits

  - Tier 1* (San Francisco Bay Area, New York City Tri-State
    Area, Los Angeles Metro Area, and Seattle Metro
    Area)$185,000 - $264,000/year
  - Tier 2* (all other U.S. Locations outside of Tier 1)
    $162,000 – $231,000/yr
  - Offers Bonus
  - Benefits & Perks: 100% employer-paid medical, dental, and
    vision coverage for employees and eligible dependents.
    Company-paid life and AD&D, STD and LTD insurance, plus
    optional supplemental coverage. 401(k) with company match.
    Flexible Time Off (FTO). Paid parental leave.

  *Certain markets, including the San Francisco Bay Area, New
  York City Tri-State Area, Los Angeles Metro Area, and
  Seattle Metro Area, are aligned to Tier 1 compensation
  bands. All other U.S. locations -including Denver - are
  aligned to Tier 2 compensation bands. The compensation
  offered will take into account internal equity and may vary
  depending on the candidate's geographic region, job-related
  knowledge, skills, and experience.
