description: |
  Senior Software Engineer (Python / TypeScript / Azure)

  London, UK (On-site) | £100,000-£150,000 + pre-IPO stock
  options

  Build the software behind some of the world’s most advanced
  radar systems.

  CHAOS Industries is a defense tech company founded in 2022
  that has raised $1B from investors including 8VC, Accel and
  Valor Equity Partners. You’ll build the backend services,
  data pipelines and operator-facing apps that turn raw sensor
  data into decisions people can act on.

  What you’ll do

  - Build high-performance Python services that ingest, process
    and distribute real-time sensor data with low latency,
    high reliability and security at scale
  - Build the web apps (TypeScript and React) operators use to
    monitor live missions and investigate what the sensors saw
  - Design and build secure, scalable Azure services for
    distributed radar systems, defining the infrastructure as
    code and instrumentation for what you own
  - Work alongside software, hardware and systems engineers, and
    the teams who take these systems into the field
  - Influence architecture and help define the engineering
    foundations of a fast-evolving platform

  You’re a fit if you have

  - Experience building scalable backend systems and owning
    production services
  - Experience with distributed systems and real-time data
    problems
  - Real leverage from AI coding tools, with a considered view
    on what to delegate and what not to
  - Willingness to travel: you’ll be based in our Soho office,
    and most of the team is in San Francisco, so expect to co-
    locate there for around a week each quarter

  Nice to have

  - Python for backend services
  - TypeScript and React for web applications
  - Azure and infrastructure as code

  What you get

  - Private medical, dental and vision for you and your
    dependents, 100% paid by the company
  - 5% pension match
  - Pre-IPO stock options, relocation assistance, and annual
    bonuses (coming soon)

  Please note: Right to work in the UK required.

  Apply now. It takes just 2 minutes.
