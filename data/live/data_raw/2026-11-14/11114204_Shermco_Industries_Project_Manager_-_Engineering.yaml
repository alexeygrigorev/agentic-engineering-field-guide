description: |
  Overview

  The Company

  Since 1974, Shermco has become North America’s largest and
  fastest growing NETA-accredited electrical testing
  organization. With Safety encouraged as a personal core
  value for every employee, our focus is to make sure
  electrical power systems are functioning properly and
  safely. Add to that our Professional Engineering Group,
  Rotating Machinery Division, Renewable Energy Services,
  Systems Integration Services, and Field Repair and local
  Repair Service Centers, places Shermco in a position to
  handle all things electrical. All done with an emphasis on
  safety and client service, supported throughout every level
  of the company. If it’s in the electrical power system,
  Shermco does it.

  That’s why we say… One Line. One Company.

  The Position Shermco Systems Integration is seeking a
  Project Manager to lead electrical and controls projects
  from inception to completion. You will be the primary point
  of accountability for project scope, schedule, and budget,
  ensuring high-quality execution while maintaining an
  unwavering focus on safety and client satisfaction.

  The Opportunity

  Join our team of leaders in controls, system integration,
  electrical construction, and engineering! Due to continued
  growth, we are seeking safety-focused and experienced
  teammates with industrial field experience and strong
  knowledge of industrial control systems. We offer the
  opportunity to develop and utilize a broad skill set at an
  accelerated pace. Shermco is an industry-leading turnkey
  systems integration firm and is an ideal fit for smart,
  motivated individuals that want to continuously learn,
  develop, and solve complex problems. Our team works in a
  dynamic, safety-focused environment where there are no
  limits on personal or professional growth.

  Responsibilities

  Roles and Responsibilities:

  - Oversee the full project lifecycle, from planning and
    resource coordination to execution and final closeout.

  - Monitor job budgets, review technician time/material costs,
    and actively manage cash flow and profitability as well as
    provide forecasting for future revenue and invoicing.

  - Serve as the primary liaison between the field, clients, and
    internal departments to provide status updates and resolve
    issues.

  - Coordinate technical requirements and deliverables between
    departments to present a unified front to the client.

  - Identify, create, and negotiate change orders and expanded
    job scopes with customers and account managers.

  - Resource Allocation: Assign individual job tasks and
    coordinate third-party subcontractors as needed.

  - Establish/Maintain behaviors that demonstrate Safety as a
    Personal Core Value.

  - Interface with accounting on paperwork problems or
    investigation requirements

  - Perform special projects as requested

  - Other duties as needed or assigned by Management

  Qualifications

  Qualifications:

  - Bachelor’s degree in Electrical Engineering, Construction
    Management, or a related field preferred.

  - Minimum of 5 years in electrical project management,
    specifically with industrial control systems or power
    systems.

  - Highly proficient computer skills; including MS Business
    Central, Word, Project, Excel, Outlook, and Internet
    search skills

  - Exceptional leadership, negotiation, and conflict resolution
    skills to manage shifting priorities in a fast-paced
    environment.

  - Ability to work safely, and an eagerness to contribute to a
    safety-focused team.

  - Professional in appearance and attitude both internally and
    with the public

  - Able to work in a fast-paced, self-directed entrepreneurial
    environment

  - Exceptional verbal and written communication skills

  - Excellent telephone personality skills

  - Strong organization skills; excellent time management skills

  - Highly energetic and self-starter

  - Able to multi-task the activities with shifting priorities

  - Must be honest and reliable

  Other Requirements:

  - Strong preference for individuals who are able and willing
    to demonstrate their personal commitment to Safety.

  - Must be able to lift up to 50 pounds, climb ladders, stand
    for extended periods, drive regularly, with or without
    reasonable accommodations

  - Should be able to pass a fit for duty physical exam when
    required

  - Must be able to pass a pre-employment drug test and
    periodic, unannounced random drug tests.

  - Must be able to pass a pre-employment criminal background
    check.

  - All offers are conditioned on acceptable results from a
    background check and drug and alcohol screening.

  - Must have a valid driver’s license and currently have (and
    be able to maintain) a good driving record.

  - Must be eligible to work in the U.S. without need for
    employer-sponsored visa (work permit).

  - Must be able to fluently read, write, and speak English.

  EQUAL OPPORTUNITY EMPLOYER | DRUG-FREE WORKPLACE

  Shermco is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, or
  veteran status.  Shermco is a drug-free workplace.

  NO AGENCIES PLEASE.

  Pay RangeUSD $100,000.00 - USD $130,000.00 /Yr.
