description: |
  About Shippo

  At Shippo, our vision is bold and clear: we are the shipping
  layer of the internet. Our mission is to make every merchant
  successful through excellent shipping, delivering world-
  class logistics technology and infrastructure. We’re
  building the backbone of global e-commerce — connecting
  merchants to carriers worldwide through a single API and
  intuitive dashboard.

  As a remote-first and globally distributed team, we believe
  flexibility fuels trust, autonomy, and performance. Our
  diverse perspectives — across continents, cultures, and time
  zones — drive our innovation and enable us to build
  solutions used by businesses everywhere. We invest in
  modern, scalable technology so our teams can build, ship,
  and iterate with confidence.

  Your impact starts here: every person at Shippo plays a
  direct role in shaping the infrastructure that powers global
  commerce and makes shipping simpler for businesses around
  the world.

  How we will deliver success together:

  We are looking for a Software Engineer III to join our
  WebApp - Lighthouse team. Our business is rapidly expanding
  and we develop capabilities to optimize our customers'
  experience by reducing their cognitive load in shipping and
  fulfillment. We are also the stewards of Shippo’s front
  platform to ensure optimal experiences are delivered to
  customers. As a Software Engineer III, you will be working
  together with a group of highly talented engineers and
  partnering with product managers and designers to deliver
  features to meet our customers’ demands. Stay connected to
  customer impact and contribute to decisions that balance
  technical quality with user experience.

  Shipping & handling responsibilities

  - System Design & Development: Build and maintain the full
    stack web application features including scalable,
    distributed microservices.
  - Technical Leadership: Own complex features from technical
    design to production deployment, adhering to high-
    performance and reliability standards.
  - Engineering Excellence: Enhance and support core web
    application stack, ensuring performance and accuracy for
    high-throughput traffic.
  - Operational Health: Participate in on-call rotations,
    troubleshoot production incidents, and maintain high SLAs.
  - Collaboration & Mentorship: Collaborate with cross-
    functional teams (Product, Infrastructure, Designer, API
    Partners) and setting high engineering standards.
  - Infrastructure: Improve CI/CD pipelines, container-based
    software distribution (Docker, Kubernetes), and
    observability.

  Your shipping requirements

  - Minimum 7+ years of experience in software development
  - Experience building and maintaining highly available,
    scalable web applications
  - Proficiency in programming language and frameworks commonly
    used in full-stack development on distributed systems.
    (e.g.,React, Python, Go, Kafka, SQL, NoSQL)
  - Strong understanding of software architecture, object-
    oriented programming, and design patterns.
  - Experience with AI assisted development workflow.
  - Can effectively communicate to stakeholders across different
    organizations within the company
  - Strong interpersonal and collaboration skills, with the
    ability to work effectively across teams.
  - BSc in a STEM field, with a preference for computer science
    and software engineering

  Bonus

  - Experience with the shipping and logistics industry.
  - Experience with shipping AI powered customer facing features

  What is in the Shippo Package?

  - Healthcare coverage for medical, dental, and vision (90%
    covered by the company, incl. dependents). Pets coverage
    is also available!
  - Take-as-much-as-you-need vacation policy & flexible working
    hours
  - One week-long company wide winter slow down
  - 3 Volunteer Days Off (VTOs)
  - WFH stipend to set up your home office
  - Charity donation match up to $100
  - Dedicated programs, coaching, tools, and resources for your
    professional and career growth as well as an individual
    learning stipend for your personal and focused growth
  - Fun team in person time through our Shippos Everywhere
    program which includes regular team and company off-sites
    throughout the year as well as local Shippos gatherings

  Compensation

  Our Compensation Shippolicy:

  We believe compensation is a custom experience and are
  commited to fair and equitable compensation practices. The
  standard base pay range for this role in the U.S is min is
  $133k to a max $181k annual salary (we tend to anchor our
  offers at the mid point $157k). Since we are focused on
  hiring Shippos Everywhere, we have 2 US pay ranges, a
  standard compensation range for the majority of the US and a
  standard +1 compensation range for those who live in areas
  where the cost of labor is higher, such as NYC and
  California.

  The actual base pay is dependent upon many factors, such as:
  financial budgets, work experience, training, transferable
  skills, business needs, and market value. The base pay
  salary ranges are subject to change and may be modified in
  the future. Total compensation for this role will include,
  equity, medical, dental, vision and other benefits noted in
  our Shippos “package” section.

  Sail through the process:

  Here at Shippo, we celebrate inclusivity and are committed
  to creating equal access to opportunities for people from
  all backgrounds, perspectives and geographies. These values
  define who we are and everything we do. All qualified
  individuals are encouraged to apply. If you need assistance,
  or a reasonable accommodation during the application and
  recruiting process, please contact us at
  accommodations@shippo.com

  Shippos in the wild:

  Our people, much like the packages we help ship, are all
  over the world. This means, through our remote-first
  program, “Shippos Everywhere”, our roles can be based
  anywhere in the US with the exception of Delaware, Nevada,
  Ohio, Oregon, Hawaii, New Mexico and West Virginia and many
  roles can be based internationally.

  For locations outside of the US and Ireland, the employment
  contracts are powered by Rippling.com.
