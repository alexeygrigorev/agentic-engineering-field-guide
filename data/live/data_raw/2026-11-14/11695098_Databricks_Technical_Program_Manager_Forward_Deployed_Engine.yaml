description: |
  At Databricks, we aim to inspire our customers to make
  informed decisions through an intuitive platform. As a
  Technical Program Manager (TPM) in our Forward Deployed
  Engineering division, you lead the success of a portfolio of
  complex programs and drive the continuous evolution of our
  delivery excellence. You are a senior leader within the FDE
  practice, entrusted with high-visibility, large-scale
  engagements. Your focus is on delivering superior results
  and setting the standard for how we empower our customers to
  achieve their most ambitious data goals.

  The Impact You Will Have

  - Portfolio Success: Own and lead a portfolio of highly
    complex, high-visibility programs, ensuring they remain
    perfectly aligned with strategic customer objectives.
  - Operational Excellence: Drive innovation and efficiency
    across the PS team to deliver increasingly better results
    for the Business Unit.
  - Strategic Alignment: Proactively coordinate technical
    milestones and program-level dependencies across multiple
    concurrent engagements.
  - Leadership Hub: Act as the primary lead for complex
    technical delivery discussions, collaborating with
    M5-level managers to ensure rapid and successful project
    momentum.
  - Mentorship: Elevate the entire team by mentoring junior TPMs
    and refining delivery processes to scale our global
    impact.

  What We Look For

  - Experience: Extensive experience managing complex technical
    programs. Experience with Product Management is a plus.
  - Technical Bar: Intermediate technical fluency; 1 Databricks
    Associate-level Certification required within 6 months of
    hire.
  - AI Proficiency: Demonstrated ability to integrate AI tools
    into program management workflows to drive operational
    performance.
  - Process Innovation: A track record of enhancing delivery
    standards and implementing changes that improve
    operational performance.

  About Databricks

  Databricks is the Data and AI company. More than 20,000
  organizations worldwide — including adidas, AT&T, Bayer,
  Block, Mastercard, Rivian, Unilever, and 70% of the Fortune
  500 — rely on the Databricks Data + AI Platform to build and
  scale data and AI apps, analytics and agents. Headquartered
  in San Francisco with 30+ offices around the globe,
  Databricks offers a unified platform that includes Genie,
  Lakebase, Agent Bricks, Lakeflow, Lakehouse, and Unity
  Catalog. To learn more, follow Databricks on LinkedIn, X,
  YouTube, and Instagram. Benefits At Databricks, we strive to
  provide comprehensive benefits and perks that meet the needs
  of all of our employees. For specific details on the
  benefits offered in your region click here.

  Our Commitment to Diversity and Inclusion

  At Databricks, we are committed to fostering a diverse and
  inclusive culture where everyone can excel. We take great
  care to ensure that our hiring practices are inclusive and
  meet equal employment opportunity standards. Individuals
  looking for employment at Databricks are considered without
  regard to age, color, disability, ethnicity, family or
  marital status, gender identity or expression, language,
  national origin, physical and mental ability, political
  affiliation, race, religion, sexual orientation, socio-
