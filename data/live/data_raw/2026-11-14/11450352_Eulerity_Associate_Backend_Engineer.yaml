description: |
  About Eulerity

  Eulerity is a rapidly growing technology company
  revolutionizing marketing automation for small businesses
  and franchises with our industry-leading proprietary
  software. Founded by leaders from Google, Facebook, and
  Yahoo! with more than 20 years of digital advertising,
  engineering, and marketing experience, we build tools that
  make enterprise-grade marketing accessible at scale.

  The Role

  We're looking for a Backend Developer with 1–3 years of
  experience to join our engineering team. You'll take an
  active role in building, testing, and maintaining the
  backend services that power our platform — and you'll do it
  with AI as a core part of your workflow, not an
  afterthought. This is a role for someone who's genuinely
  excited about what AI-assisted development makes possible
  and wants to push that further every day.

  What You'll Do

  - Build, test, and maintain backend services across Eulerity's
    core platform
  - Own features end-to-end — from design and implementation
    through deployment
  - Use AI agents and LLM tooling to prototype, iterate, and
    ship faster
  - Contribute product ideas and help shape the engineering
    roadmap
  - Collaborate closely with cross-functional teams on features
    and releases
  - Assist with documentation, system support, and knowledge
    sharing across the team

  About You

  - 1–3 years of hands-on backend development experience, with
    at least 1 year building in Java
  - You've actually used AI agents (Claude, Copilot, Cursor, or
    similar) to build, debug, and ship software — not just
    experimented with them
  - Familiarity with LLMs, AI agent frameworks, or AI-assisted
    development workflows
  - Comfortable integrating third-party APIs
  - A strong drive to keep learning — especially when it comes
    to evolving AI tooling and how it applies to real
    engineering problems
  - You think creatively about complex problems and enjoy
    finding elegant solutions
  - A collaborative, communicative team player with a friendly,
    low-ego approach

  Requirements

  - Based in the NYC tri-state area
  - Available to work full-time (40 hours/week)

  What We Offer

  - Competitive salary (commensurate with experience)
  - Full GitHub Copilot access with frontier LLMs and coding
    agents from Anthropic, Google, and OpenAI — so you're
    always working with the best tooling available
  - Mentorship and regular peer review sessions
  - Unlimited snacks and an in-office lunch credit
  - Hybrid work flexibility with at least three in-office days
    per week

  Benefits

  - 🩺 Comprehensive benefits
  - 🏖️ Unlimited PTO
  - 🚅 Commuter benefits
  - 📈 401(k) with company match
  - 😎 Summer Fridays

  Compensation

  Our salary ranges are based on paying competitively for our
  company's size and industry, and are one part of the total
  compensation package that also includes benefits, perks, and
  other opportunities at Eulerity. The expected total
  compensation range for this role is $95,000 - $125,000,
  commensurate with experience.

