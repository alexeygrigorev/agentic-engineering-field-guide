description: |
  This is a remote position.



  About the company



  An established software company serving professional
  services firms across North America. Its platform combines
  practice management, workflow automation, and integrated
  payments, helping firms run more efficiently and spend more
  time on higher-value work. The data and analytics function
  is a growing area of investment.




  The role



  We're looking for a hands-on engineering manager to lead a
  team building a cloud data platform that gives customers and
  partners new ways to turn their data into actionable
  business insight. This is a strong fit for someone who is
  deep in modern cloud data technologies (analytics, big data,
  warehouses, and lakes) and enjoys a fast-moving environment
  with new technology.




  Responsibilities



  - Lead and grow a software engineering team, including hiring,
    mentoring, and developing your people.
  - Manage both onshore and offshore engineering staff.
  - Provide technical leadership across architecture, design,
    build, documentation, and testing for the data and
    analytics platform and its products.
  - Work closely with Product to keep a shared vision and drive
    continuous improvement across the platform and multiple
    products.
  - Own the data and analytics roadmap, from strategy through to
    the technical delivery of scalable platform and product
    rollouts.
  - Contribute to product roadmaps, sprint planning, and release
    planning, including leading grooming sessions and helping
    the team estimate effort.
  - Stay hands-on: strong coding and data modeling, code
    reviews, quality documentation, and setting the technical
    standard for the team.
  - Follow agile SDLC, data architecture, and engineering best
    practices and governance.
  - Deliver fixes and service packs on a repeatable, efficient
    cycle.
  - Partner with security leadership to meet corporate data
    security standards.
  - Own the KPIs tied to software and data quality, with a focus
    on raising release frequency and engineering confidence.
  - Manage third-party vendor relationships for tools,
    outsourcing, and consulting alongside the wider
    engineering management team.



  Experience and skills



  - BS/MS in Engineering or equivalent.
  - Hands-on depth in data and analytics technologies plus
    cloud-native data architecture design and best practices.
  - 10+ years in technical roles, with 7+ years managing people
    and leading increasingly complex projects to delivery.
  - 7+ years designing and maintaining data architecture, data
    models, and standards for data integration and
    warehousing.
  - 7+ years programming in web, object-oriented, or functional
    environments.
  - Solid grounding in enterprise and cloud-native BI
    architecture.
  - Comfortable with git and team branching strategies.
  - Broad range across data architecture, ETL, security,
    performance, and analytics.
  - Experience building highly scalable, data-driven SaaS
    applications in close partnership with product and
    engineering.
  - Hands-on with Azure or AWS.
  - Hands-on building data and analytics products with Microsoft
    Fabric or Snowflake, feeding reporting tools such as Power
    BI with real-time or near-real-time sync.
  - Familiar with release and deployment processes.



  Certifications (a plus)



  - Azure Data Engineer Associate
  - Azure AI Engineer Associate
  - Azure Solutions Architect Expert
  - Power BI Data Analyst Associate
  - Snowflake / SnowPro certifications



  Leadership qualities



  - Excellent written and verbal communication, attention to
    detail, and strong organization.
  - Proven remote team leadership across multiple time zones,
    able to work independently.
  - Ownership mentality and entrepreneurial approach,
    comfortable with smart risk-taking.
  - Good delegation and Agile/Scrum leadership experience.
  - Able to build relationships with senior stakeholders and
    team members.
  - Results-oriented self-starter who needs little supervision,
    and a confident, flexible communicator.



  Benefits



  Flexible PTO, medical/dental/vision, supplemental and paid
  sick coverage, health savings account, and a retirement
  savings match.
