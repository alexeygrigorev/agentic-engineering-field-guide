description: |
  About Supabase

  Supabase is the Postgres development platform, built by
  developers for developers. We provide a complete backend
  solution including Database, Auth, Storage, Edge Functions,
  Realtime, and Vector Search. All services are deeply
  integrated and designed for growth.

  About the Role

  Supabase Storage is a scalable and high performance object
  storage service and is one of our fastest growing services.
  The current landscape of tools for uploading, storing,
  processing and delivering assets is complicated. Developers
  are forced to think about regions, caching, codecs and
  security before they can start uploading anything.

  We are looking for engineers to solve this problem once and
  for all!

  You will be working across the entire stack - client
  libraries, CLI, CDN, the storage server and the deployment
  infrastructure. One day, you might focus on improving upload
  resilience in iOS applications; the next, you could be
  optimizing the S3 protocol for efficient retries or finding
  ways to accelerate upload processing.

  You will be contributing to both our open source server and
  upstream dependencies we use, like the TUS server.

  This role is ideal for someone who thrives in async, fast-
  paced environments and is excited about building developer
  tools that scale to millions.

  What You’ll Be Responsible For

  - Improving our analytics bucket offering and improving the
    storage of open file formats like iceberg and ducklake
  - Asset optimization to speed up delivery for websites and
    mobile applications
  - Building out our edge network to speed up uploads and build
    features like automatic cache invalidation
  - Improve the performance, observability, and reliability of
    our storage server
  - Work with the frontend team to build a fast, powerful
    storage explorer
  - Improve our APIs, client libraries and CLI to provide an
    exceptional end-to-end DX for our users
  - Resolve escalated support issues, while also identifying and
    resolving systemic issues across the platform

  You Might Be a Good Fit If You

  - Have 5+ years backend engineering experience of running
    Node.js in production
  - Have experience with highly scalable, distributed systems
  - Are comfortable with working across the stack - backend
    application development, some infrastructure work
    including deploying, monitoring and scaling the service
  - Posses familiarity with observability tools (OpenTelemetry,
    Prometheus, Grafana) and performance tuning
  - Have experience with production-grade PostgreSQL usage,
    including tuning and troubleshooting
  - Demonstrate an ownership mentality: driving projects end-to-
    end
  - Display empathy towards developer experience

  Nice-to-have

  - Prior experience working on developer tools
  - Solid knowledge of cloud infrastructure (AWS, GCP or Azure)
    and containerization (Docker, Kubernetes)
  - Direct experience designing and operating large file
    upload/download pipelines at scale
  - Deep, practical CDN integration and optimization knowledge
  - Experience with image and video processing tools (sharp,
    dssim, ffmpeg), formats and codecs (AVIF, WebM, Brotli) is
    a plus
  - Experience with the frontend ecosystem (Next.js, React, etc)
    is a plus

  What We Offer

  - Fully RemoteWe hire globally. We believe you can do your
    best work from anywhere. There are no Supabase offices,
    but we provide a WeWork membership or co-working allowance
    you can use anywhere in the world.
  - ESOPEvery team member receives ESOP (equity ownership) in
    the company. We want everyone to share in the upside of
    what we’re building together.
  - Tech AllowanceUse this budget to set up your ideal work
    environment—laptop, monitor, headphones, or whatever helps
    you do your best work.
  - Health BenefitsSupabase covers 100% of health insurance for
    employees and 80% for dependents, wherever you are. Your
    wellbeing and your family’s health are important to us.
  - Annual Off-SitesOnce a year, the entire company gathers in a
    new city for a week of connection, collaboration, and fun.
    It’s a highlight of our year.
  - Flexible WorkWe operate asynchronously and trust you to
    manage your own time. You know what needs to be done and
    when.
  - Professional DevelopmentEvery team member receives an annual
    education allowance to spend on learning—courses, books,
    conferences, or anything that supports your growth.

  About the Team

  Supabase was born-remote and open-source-first. We believe
  our globally distributed team is our secret weapon in
  building tools developers love.

  - ~400 team members
  - 60+ countries
  - 20+ languages spoken
  - Over $1B raised (including our $500M Series F)
  - 540,000+ community members

  We move fast, build in public, and use what we ship. If it’s
  in your project, we probably use it in ours too. We believe
  deeply in the open-source ecosystem and strive to
  support—not replace—existing tools and communities.
