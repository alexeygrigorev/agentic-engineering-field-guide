description: |
  WHY DEPT®?

  We are pioneers at heart. What this means, is that we are
  always leaning forward, thinking of what we can create
  tomorrow that does not exist today. We were born digital and
  we are a new model of agency, with a deep skillset in tech
  and marketing. That’s why we hire curious, self-driven,
  talented people who never stop innovating.

  Our culture is big enough to cope and small enough to care.
  Meaning, that with people across 20+ countries, we’re big
  enough to provide you with the best tools, global
  opportunities, and benefits that help you thrive. While
  acting small by investing in you, your growth, your team,
  and giving you the autonomy to solve our clients' problems,
  no matter where you are in the world.

  This is remote role, however you must be located within 50
  miles of New York NY to be considered.

  THE ROLE

  The Client Finance Manager will be responsible for managing
  the financial relationship with key clients, ensuring
  budgets, forecasts, and financial targets are met. The role
  will act as a liaison between client-facing teams and the
  finance department, ensuring projects are financially
  aligned and delivered within budget. The ideal candidate
  will have strong financial management skills, with a focus
  on client billing, project financials, and collaboration
  with project teams to ensure profitability and operational
  success.

  WHAT YOU'LL DO

  - Client Billing & Financial Oversight: Manage client purchase
    orders, invoices, and billing documentation to ensure
    accuracy and timeliness. Provide regular financial reports
    to clients and internal stakeholders, addressing any
    discrepancies.
  - Work In Progress (WIP) Management: Monitor and review WIP
    commentary inputted by project teams to ensure projects
    are tracking in line with financial forecasts and
    expectations.
  - Budget & Forecasting Management: Track and manage client
    budgets and forecasts, identifying financial risks and
    taking proactive steps to ensure project profitability.
  - Collaboration with Project Teams: Work closely with project
    managers and client teams to ensure financial alignment
    and support in delivering successful project outcomes.
  - Process Improvement: Contribute to the continuous
    improvement of financial reporting processes, tools, and
    internal controls to streamline operations and enhance
    efficiency.
  - Client Financial Reporting & Insights: Provide financial
    insights and reports to senior leadership and client-
    facing teams, helping them make data-driven decisions to
    optimize profitability and performance.

  WHAT YOU WILL BRING

  - Bachelor's degree in Finance, Accounting, Business
    Administration, or a related field. MBA or relevant
    certifications (CPA, CFA) are a plus.
  - Minimum of 5 years of experience in client finance,
    financial management, or a related role in a professional
    services environment, preferably in advertising, digital
    marketing, or media.
  - Proven experience managing client budgets, forecasts, and
    financial reports.
  - Strong knowledge of financial modeling, budgeting, and
    forecasting techniques.
  - Excellent communication skills, with the ability to
    communicate complex financial information to both
    financial and non-financial stakeholders.
  - Advanced proficiency in Excel and financial reporting tools
    (e.g., ERP systems, Tableau, etc.).
  - Strong analytical, problem-solving, and attention to detail
    skills.
  - Ability to work independently and collaboratively in a fast-
    paced environment.

  WHAT DO WE OFFER?

  We are a collaborative, open-door, best-idea-wins
  environment that fosters personal and company growth and has
  fun doing it. Here is a snapshot of our  benefits package:

  - Healthcare, Dental, and Vision coverage
  - 401k plan, plus matching
  - PTO
  - Paid Company Holidays
  - Parental Leave

  The anticipated salary range for this position is $84,100 -
  $121,900. Salary is based on a range of factors that include
  relevant experience, expertise, physical location, and
  organizational impact. This is based on a 40-hour workweek
  and leveling. Keep in mind, we're flexible.

