description: |
  About Nomic

  Nomic builds AI agents and developer tools that power the
  built world. We help enterprise teams in architecture,
  engineering, and construction extract structured knowledge
  from decades of drawings, specs, and project files. Our
  platform combines embedding models, document parsing, and
  autonomous agents that reason over real-world data and take
  action in live environments.

  The Role

  We're looking for a senior full-stack engineer to build
  product across the Nomic platform. You'll work on the
  interfaces, APIs, and backend systems that enterprise
  customers and developers use daily — from our web
  application to our Developer API.

  Most of your day-to-day coding will involve directing and
  managing AI coding agents. We're not interested in people
  who are curious about this — we need someone already doing
  it, with the architectural judgment to use it effectively.
  That means knowing how to decompose work for agents,
  reviewing output with a critical eye, maintaining codebase
  coherence when code is being generated at speed, and never
  letting velocity become an excuse for slop. The bar is
  engineering excellence: clean architecture, thoughtful
  abstractions, code that other people can work in.

  What You'll Work On

  - Product features end-to-end — UI through API through data
    layer
  - Backend services in Python and TypeScript
  - Frontend in React/TypeScript
  - APIs that serve both our product and external developers
  - Integration points with our AI and agent systems

  What We're Looking For

  - 5+ years of professional software engineering experience
  - Strong full-stack skills — you're comfortable owning
    frontend and backend
  - Production experience with Python and TypeScript
  - Active, intentional use of AI coding tools (Cursor, Claude
    Code, Copilot, etc.) — not as a novelty but as your
    primary workflow
  - Good instincts for API design, data modeling, and system
    architecture
  - You write code that's clear, tested, and easy to change —
    whether you typed it or an agent did
  - You care about the end-user experience, not just the
    implementation

  Even better if you have:

  - Experience building developer-facing products or APIs
  - Familiarity with AI/ML systems — embeddings, retrieval,
    model integration
  - Background in enterprise software or B2B products

  What We Offer

  - Competitive base salary and performance-based compensation
  - Equity participation
  - Medical, dental, and vision coverage
  - Flexible PTO
  - Hybrid NYC work model (3 days in office)
  - High-visibility role on a small team
