description: |
  About CircuitHub

  CircuitHub is reshaping electronics manufacturing with The
  Grid, a factory-scale robotics platform that makes small-
  batch, high-mix electronics assembly radically more
  efficient. Think semiconductor-fab precision applied to the
  chaotic world of prototyping and low-volume production: a
  10x throughput improvement in one of the world's most
  foundational industries.

  We've raised $45M from top-tier investors including Plural,
  Y Combinator and Google Ventures, and we're already
  profitable. Our customers include a major EV maker, a top AI
  lab and many of the worlds largest companies.

  The Grid isn't a prototype. It's live, scaling fast and
  delivering real revenue, and we're building the team that
  will scale it further.

  Overview

  - CircuitHub is primarily built using a combination of
    Haskell, Nix, and PostgreSQL, deployed to both AWS and
    bare metal machines. We use a significant amount of open-
    source technology, and also try and give back where
    possible (for example, both Rel8 and Fast Downward Haskell
    bindings).
  - CircuitHub spans a vast problem space. Challenges include
    computer vision (OpenCV), machine learning (PyTorch), hard
    optimization problems (Z3/MiniZinc/OR-Tools), and all the
    normal engineering challenges of building both web-based
    customer-facing and internal tooling.
  - We work on manufacturing execution systems, enterprise
    resource planning, and robotics. An old video from Haskell
    Exchange 2019 hints at what we are up to on the robotics
    side. We have progressed significantly since then!
  - These roles are remote (any location), in-person, or hybrid,
    depending on preference.
  - We have offices in South Deerfield - USA, Cambridge, and
    London, UK.
  - Salary depends on the candidate and location, but as
    guidance in the UK, a likely range is £80k to £125k and in
    the US $125k to $250k, with additional equity.
  - CircuitHub has raised $45M from top-tier VCs and has been
    going for about ten years. CircuitHub is profitable, with
    tens of millions in revenue. Small team (CircuitHub is ~50
    employees) with tremendous growth opportunity and low
    risk. We are aiming to 10x capacity through 2027 in both
    our existing Massachusetts factory and expand into Europe.



  Team/Environment/Role

  Our R&D team is more than 20 people, with eight engineers
  working directly on the Haskell code base. We are looking to
  expand the team significantly this year. We have many
  exciting problems to solve, from robotic path planning to
  more conventional web products.

  We are happy to consider candidates without commercial
  Haskell experience, but your other skills and experience
  would need to compensate. A possible profile, for instance,
  would be a professional robotics background with some
  hobbyist FP experience.

  Conversely, for experienced Haskellers without experience in
  our domain, we will look for interests that correlate with
  what we are trying to accomplish. Life is too short to work
  on something you are not passionate about!



  Location

  Work remotely, or from one of our offices in the UK (London,
  Cambridge) or USA (Boston)
