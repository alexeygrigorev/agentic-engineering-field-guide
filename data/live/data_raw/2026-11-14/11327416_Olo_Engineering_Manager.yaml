description: |
  Olo is a leading SaaS platform accelerating digital
  transformation in the restaurant industry, by helping
  customers deliver more personalised and profitable guest
  experiences. As a result, our digital ordering, payment, and
  guest engagement solutions enable brands to do more with
  less and make every guest feel like a regular.



  As an Engineering Manager at Olo, you will play a
  significant and visible role in helping us scale one of the
  most advanced food ordering platforms in the market. We are
  looking for an Engineering Manager with experience leading
  high performing teams to deliver the best possible
  experience for our customers.





  This position is fully remote and allows you to work from
  anywhere within Northern Ireland.

  How you’ll make an impact:

  - Manage execution of engineering projects, meeting deadlines
    and maintaining quality standards.
  - Drive the identification, prioritisation, and resolution of
    technical debt by collaborating with teams to assess its
    impact, partnering with the product team to integrate
    remediation into project planning, and communicate
    outcomes to leadership, ensuring balance with feature
    development and sustainable system architecture.
  - Own and execute on your team's product roadmap, aligning it
    with long-term business objectives.
  - Develop and implement new processes to address business
    needs.
  - Keep the team competitive by adopting new technologies and
    industry best practices.
  - Ensure engineering teams work effectively with other
    functions to meet business goals.
  - Deliver systems that meet performance, scalability, and
    quality standards, consistently delivering reliable
    solutions.
  - Regularly evaluate team performance and quality, driving
    necessary improvements.
  - Resolve major technical issues, acting as the main point of
    escalation for stakeholders.
  - Work with clients and partners to address technical needs,
    resolve challenges, and ensure effective solutions.

  Leadership Responsibilities:

  - Manage an engineering team, ensuring strategic alignment
    with business goals and successful execution of
    deliverables.
  - Eliminate roadblocks and empower the team, acting as a
    servant leader who ensures team success.
  - Drive team growth through mentoring, 1:1s, and development
    plans, fostering professional development.
  - Promote a high-performance culture that encourages
    innovation, inclusion, and diverse perspectives.
  - Guide team technical development, enforce best practices,
    and provide mentorship.
  - Lead the hiring and development of engineering talent,
    ensuring alignment with team objectives and organisational
    values.

  What will set you up for success:

  - Bachelor’s Degree in Computer Science, Software Engineering,
    or a related field, or equivalent practical experience.
  - 12+ years of engineering experience, with 2+ years in
    management.
  - Deep knowledge of technical architecture, system design, and
    scalability.
  - Experience collaborating across teams to develop and execute
    product roadmaps.
  - Proven success in hiring and managing engineering teams.
  - Strong history of managing and developing technical teams,
    focusing on performance.
  - Excellent interpersonal skills, with the ability to
    collaborate across teams with empathetic leadership.
  - Familiarity with emerging technologies and a track record of
    driving process improvement, experimentation, and
    innovation.
  - Leads independently while staying aligned with company
    objectives.

  About Olo



  Olo is a leading restaurant technology provider with
  ordering, payment, and guest engagement solutions that help
  brands increase orders, streamline operations, and improve
  the guest experience. Each day, Olo processes millions of
  orders on its open SaaS platform, gathering the right data
  from each touchpoint into a single source—so restaurants can
  better understand and better serve every guest on every
  channel, every time. Over 800 restaurant brands trust Olo
  and its network of more than 400 integration partners to
  innovate on behalf of the restaurant community, accelerating
  technology’s positive impact and creating a world where
  every restaurant guest feels like a regular. Learn more at
  olo.com.



