description: |
  Please note this posting is to advertise potential job
  opportunities. This exact role may not be open today but
  could open in the near future. When you apply, a Cisco
  representative may contact you directly if a relevant
  position opens.

  Meet the Team   Join Cisco’s Ensoft software development
  team to shape the future of networking.  We are responsible
  for creating cutting edge software that helps to run the
  Internet, delivered with outstanding quality.

  We offer an exceptional career path for talented individuals
  with an enthusiasm for software development.  Our team is
  entirely composed of people who arrived as young,
  exceptional graduates from top universities. The pathway is
  there to develop into any of the roles in the team, from the
  directors and management line to our industry-leading
  technical experts.

  Our office is in Harpenden, close to the station and with a
  very fast connection into London. Harpenden is an attractive
  town with a thriving centre of shops, bars and restaurants.
  Close by is the city of St Albans, bringing a wider social
  scene (theatres, clubs, a wider selection of bars) and all
  the facilities offered by a modern city.

  We have a really friendly culture.  It is a sign of how well
  people get on that employees arrange so many activities
  together in their spare time.  This is on top of the many
  company funded social events arranged by our social team
  including team celebrations, weekly five a side football,
  annual Christmas and Summer parties, and many other one-off
  events.

  We all love working here, but don't just take our word for
  it. The best way to judge is to see and hear what our
  employees think about us, so please take a look at our
  casebooks (https://cs.co/ensoft) and come along to our
  recruitment events to speak to us first hand.

  Your Impact   From the very start of your career you will be
  faced with the challenge of developing the very latest
  networking software – everything from the initial ideas and
  design through to code, test, delivery and support.

  You will contribute to Cisco’s flagship IOS XR network
  operating system, with opportunity to work on everything
  from low level build and install infrastructure up to higher
  level manageability and routing applications.    Minimum
  Qualifications

  - You must want a career developing software - that's what we
    do!
  - The barrier to entry is high, so you need a proven academic
    capability.   This typically means you will have a
    numerate degree from a leading University and all A/A*
    grades at A-level or equivalent.
  - Software experience is useful, but not essential.  It is
    great to find recent graduates who love writing code and
    want to turn that into a successful career. But we provide
    comprehensive training that means anyone with the right
    potential can excel; our primary criteria for recruiting
    are potential and enthusiasm rather than what you happen
    to already know.
  - The software development process is collaborative, so you
    should enjoy working closely with the other people in your
    team.
  - Oh, by the way, we believe that we are creating an
    exceptional team, so you need a pride and passion for your
    work and should expect to work with us for many years.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
