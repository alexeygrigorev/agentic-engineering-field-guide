description: |
  VeeFriends is a modern entertainment and consumer products
  company built around characters, storytelling, collectibles,
  community, and culture. Its business spans physical and
  digital collectibles, publishing, licensing, live
  experiences, commerce, and emerging consumer products.

  VeeFriends is hiring a Software Engineer to develop and
  maintain applications, backend services, and integrations
  that support our digital products and business operations.

  We’re looking for someone with a solid software development
  background, experience working with AI coding tools, and the
  technical judgment to deliver reliable software. This role
  has a strong focus on backend development.

  Responsibilities

  - Develop and maintain backend services, APIs, and business
    system integrations.
  - Translate requirements into practical technical solutions.
  - Deliver features and improvements in collaboration with
    engineering, design, and business teams.
  - Investigate application issues and improve performance,
    reliability, and data quality.
  - Ensure changes meet requirements through testing, code
    review, and validation.
  - Support application deployments and troubleshoot issues in
    cloud environments.
  - Maintain technical documentation and contribute to
    improvements in development practices.

  Qualifications

  - 3+ years of professional software development experience,
    including building and supporting production applications.
  - Experience building applications with C#/.NET,
    TypeScript/JavaScript, Java, or similar languages and
    frameworks.
  - Experience developing, deploying, or supporting applications
    in Microsoft Azure, AWS, Google Cloud, or a similar cloud
    platform.
  - Experience using OpenAI Codex, Claude Code, or similar AI
    coding agents for technical design, development, testing,
    debugging, and code review.
  - Ability to understand code, evaluate technical approaches,
    identify errors, and guide work toward a reliable result.
  - Working knowledge of REST APIs, SQL databases,
    authentication, and third-party integrations.
  - Familiarity with Git, GitHub, pull requests, and automated
    testing.
  - Strong problem-solving skills, clear communication, and
    attention to detail.

  Preferred Experience

  - C#/.NET and Microsoft Azure.
  - Azure Container Apps, Service Bus, Cosmos DB, Storage, or
    Application Insights.
  - PostgreSQL, data modeling, and query optimization.
  - Docker, GitHub Actions, and CI/CD workflows.
  - Microsoft Orleans or other distributed application
    frameworks.
  - Node.js, Next.js, or React.
  - Shopify, GraphQL, or integrations involving commerce,
    payments, inventory, and fulfillment.
  - Webhooks, message queues, scheduled jobs, and reliable
    handling of retries and duplicate events.
