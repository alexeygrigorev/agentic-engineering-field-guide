description: |
  We’re looking for a Senior Software Engineer to play a
  pivotal role in evolving M&S’s Order Management platform.
  This team provides the critical software capabilities that
  power order fulfilment across the business, ensuring
  customers receive a seamless experience from checkout
  through to delivery, amendments, cancellations, and returns.

  Your “customers” are product teams, engineers, fulfilment
  stakeholders, and ultimately millions of M&S customers — and
  your mission is to make them faster, more effective, and
  more confident through scalable systems, resilient
  integrations, and exceptional engineering practices.

  This is a role for an engineer who is excited by solving
  complex fulfilment challenges, modernising enterprise
  systems, and building reliable software that supports one of
  the UK's largest retail operations.

  About the Team

  Our engineering teams enable product, engineering, and
  fulfilment teams to deliver customer experiences with speed
  and confidence. We create reliable, scalable, and secure
  platforms rooted in strong engineering standards,
  automation, and continuous improvement.

  What You'll Do

  Your key accountabilities will include:

  - Design, build, and evolve order management capabilities that
    support seamless customer fulfilment journeys across
    checkout, fulfilment, returns, amendments, and
    cancellations.
  - Own features end-to-end, taking responsibility for solution
    design, development, testing, deployment, and production
    support.
  - Help shape the technical direction of the Order Management
    platform, driving improvements in architecture,
    integration patterns, automation, reliability, and
    security.
  - Drive operational excellence by designing systems with
    observability, monitoring, resilience, and supportability
    at their core.
  - Use tools such as Dynatrace to improve platform visibility,
    monitoring, and alerting capabilities.
  - Collaborate closely with Product Managers, Engineering
    teams, and Fulfilment stakeholders to solve complex
    business challenges and accelerate delivery outcomes.

  Who You Are

  - Strong Java engineer with experience designing and
    developing enterprise services, APIs, and integrations
    across distributed systems.
  - Willing to learn and work with the IBM Sterling OMS/SIP
    product suite.  Previous experience with these products is
    a plus.
  - Experienced in CI/CD practices, observability, production
    support, and operational excellence.
  - Comfortable designing systems with resilience,
    recoverability, monitoring, and supportability in mind.
  - A collaborative engineer who enjoys working across
    disciplines, raising standards, and helping teams
    continuously improve.

  What’s in it for you

  Being a part of M&S is exactly that – playing your part to
  bring the magic of M&S to our customers every day. We’re an
  inclusive, dynamic, exciting, and ever-evolving business
  built on doing the right thing and bringing exceptional
  quality, value, service to every customer, whenever,
  wherever, and however they want to shop with us.

  Here are some of the benefits we offer that make working for
  M&S just that little bit more special…

  - 20% colleague discount across M&S products and selected
    third-party brands.
  - Competitive holiday entitlement with the potential to buy
    extra holiday days.
  - Discretionary bonus schemes awarded based on personal and
    business performance.
  - A generous Defined Contribution Pension Scheme and Life
    Assurance.
  - A tailored induction and extensive learning and development
    opportunities.
  - Amazing perks and discounts via the M&S Choices platform.
  - Access to GymSave and the opportunity to become an M&S
    Shareholder.
  - A dedicated charity volunteer day to support a cause you're
    passionate about.
  - Access to a fantastic range of wellbeing support, including
    a 24/7 Virtual GP and wellbeing services.

  Everyone’s Welcome

  We are ambitious about the future of retail. We’re
  disrupting, innovating, and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet.

  Marks & Spencer strives to be an inclusive organisation,
  trusted and admired by our colleagues, customers, and
  suppliers.

  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and win
  together.

  If you’d benefit from any support or reasonable adjustments
  during any stage of the recruitment process, please let us
  know when completing your application.

