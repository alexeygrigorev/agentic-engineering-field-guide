description: |
  Ampa is a pioneering neurotechnology startup developing
  brain stimulation technology to help eradicate depression.
  We will improve millions of lives by making this
  transformative treatment universally accessible. Joining us
  means you’ll be part of a rapidly growing startup with
  significant equity opportunities and a major impact on our
  future.

  What to Expect:  Working at Ampa is a rare chance to help
  transform global mental health and save millions of lives —
  a level of impact that demands deep commitment. Success here
  requires resilience, adaptability, and the discipline to put
  in long hours. If you thrive in a high-intensity, fast-
  changing environment and want your work to truly matter, you
  may do the best work of your life here.

  Role Overview:

  We’re seeking an extremely talented Frontend-focused
  Fullstack Software Engineer to lead the development of our
  neuromodulation technology. In this role, you’ll be leading
  the team responsible for building the most user-friendly,
  scalable, and advanced brain stimulator platform in the
  world. You’ll work across both frontend and backend systems
  to control the stimulator, visualize data for healthcare
  providers, sync data with the cloud, collaborate with other
  engineers, ensure strong encryption, and create a seamless
  user experience. You’re a 10x engineer, passionate about
  mental health, with the potential to lead and mentor a
  growing team.



  Tech Stack:

  - Frontend: React, React Native
  - Backend: Python, Node.js
  - Database: PostgreSQL
  - Cloud: AWS (ECS, CDK, Glue, Firehose, EventBridge

  Key Responsibilities:

  - Full Stack Development: Design and maintain both frontend
    and backend components.
  - Web Applications: Develop and deploy apps for managing
    patient data.
  - Data Visualization: Implement real-time 3D models and other
    visual tools.
  - API Integration: Develop and maintain APIs for frontend-
    backend communication.
  - User Feedback: Collect and apply user feedback to improve
    UX.
  - Team Building: manage & grow a talented group of engineers
    in India

  What We’re Looking For:

  - Mission Obsession: You’re passionate about eradicating
    depression.
  - Drive: Highly motivated, open to feedback, and able to learn
    new skills as needed.
  - Adaptability: Thrives in a fast-paced, evolving startup.

  Specific to this role:

  - Expertise: Strong in front-end architecture, API design, and
    data-driven development.
  - Experience: 6+ years in full stack development, including
    React/React Native and backend technologies like Python or
    Node.js.
  - Miscellaneous: Hardware interaction, computer vision, camera
    APIs (desirable).

  Why Join Ampa?

  - Impact:
  - Growth: Thrive in a startup environment with rapid
    innovation.
  - Stability: Enjoy startup benefits with a secure product
    line.
  - Ownership: Receive substantial equity as an early team
    member.

  Logistics:

  - Work Mode: Remote, Hybrid, or In-Person
  - Locations: United States - Pacific or Mountain time zones
  - Compensation: Competitive Base + Strong Equity
  - Employment: Permanent
  - Visa Sponsorship: Will sponsor TN visa or equivalent. No
    H1B.
