description: |
  About Method Security

  Method Security is dedicated to reshaping cybersecurity in
  an era where AI-driven threats are growing rapidly. Our
  mission is to defend critical institutions—such as
  government, defense, and key commercial sectors—against
  these sophisticated threats by building cutting-edge,
  autonomous defense solutions. We bring together expertise in
  AI, cybersecurity, and software to create products that seek
  to finally shift the advantage in security from offense to
  defense.

  Our Team and Values

  Joining Method means becoming part of an elite, mission-
  driven team that values innovation, transparency, and high
  standards. We work with purpose, embracing diverse
  perspectives and experiences while maintaining a high bar
  for quality. Our team is built around trust, efficiency, and
  respect. We’re committed to creating an environment where
  everyone can contribute meaningfully. We believe in small,
  focused teams capable of tackling complex challenges and
  achieving outsized results. At Method, you’ll have the
  autonomy to drive projects forward, the support to navigate
  challenges, and the opportunity to shape the future of
  cybersecurity.

  Role Overview

  As a Backend Engineer at Method Security, you will build and
  scale the core systems that power our autonomous
  cybersecurity products. This role involves designing and
  optimizing distributed systems to meet rigorous performance
  and latency standards, as well as implementing APIs and
  robust database schemas. You’ll work closely with a high-
  performing team to solve complex technical challenges and
  ensure that our backend infrastructure is secure, efficient,
  and reliable.

  Key Responsibilities

  - Architect, develop, and maintain scalable distributed
    systems with a focus on performance, reliability, and
    latency.
  - Independently diagnose, triage, and resolve issues in a
    microservices environment, enhancing overall system
    stability and resilience.
  - Design clean, secure APIs and effective database schemas to
    support product features and data handling needs.
  - Collaborate closely with frontend engineers, product
    managers, and other team members to translate requirements
    into technical solutions.
  - Work directly with end users to ensure that Method is
    meeting operational needs and solving real world problems.

  Qualifications

  - Experience building and scaling distributed systems, with a
    proven track record of meeting high performance and low-
    latency requirements.
  - Proficiency in triaging and debugging complex microservice
    architectures.
  - Strong experience designing backend APIs and crafting
    efficient database schemas.
  - Experience with strongly typed programming languages; Java
    is preferred.

  Nice to Haves

  - Familiarity with cloud-based infrastructure and tools for
    monitoring and optimizing distributed systems.
  - Experience with containerization and orchestration tools
    (e.g., Docker, Kubernetes).

  Base Salary Range: $140,000-$190,000
