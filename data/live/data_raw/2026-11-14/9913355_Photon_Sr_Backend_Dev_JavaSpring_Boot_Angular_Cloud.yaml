description: |
  Greetings Everyone



  Who are we?





  For the past 20 years, we have powered many Digital
  Experiences for the Fortune 500. Since 1999, we have grown
  from a few people to more than 4000 team members across the
  globe that are engaged in various Digital Modernization. For
  a brief 1 minute video about us, you can check
  https://youtu.be/uJWBWQZEA6o.



  What will you do?     What are we looking for?  We are
  seeking a Senior Backend Developer who will design, build,
  and maintain backend services, APIs, and platform
  capabilities. This role combines strong backend engineering
  with hands-on involvement in release readiness, production
  deployment, monitoring, and cross-team coordination. You
  will contribute to high-impact technical decisions, maintain
  engineering excellence, and help drive smooth, reliable
  release cycles. What You Will Do



  - Partner with technical leaders to contribute to
    architecture, design frameworks, and roadmap planning.
  - Provide engineering guidance during early-stage designs and
    ensure strong technical execution.
  - Build reliable, scalable distributed systems and backend
    services.
  - Lead key technical decisions for high-risk or high-impact
    initiatives.
  - Drive features from prototype to production with end-to-end
    ownership.
  - Collaborate with product, architecture, security, digital,
    and engineering teams.
  - Work effectively in a fast-paced environment with multiple
    priorities.
  - Take ownership in a remote/hybrid setup and ensure strong
    communication across teams.
  - Identify customer pain points and propose self‑service
    automation solutions.
  - Promote innovation, continuous improvement, and a positive,
    collaborative team culture.



  Required Qualifications



  - 8+ years of software development experience.
  - Strong expertise in Java, Spring Boot, and Angular.
  - Experience working with cloud platforms (GCP, Azure) and
    end-to-end DevOps pipelines.
  - Solid foundation in data structures, algorithms,
    concurrency, and design patterns.
  - 3+ years building and maintaining RESTful APIs,
    microservices, and backend systems.
  - Hands-on experience establishing and maintaining CI/CD
    pipelines.
  - Strong skills with relational and/or NoSQL databases.
  - Experience coordinating release cycles, preparing release
    notes, and ensuring release readiness.
  - Experience supporting production deployments and performing
    post‑deployment validation.
  - Strong understanding of Agile methodologies and sprint
    planning.
  - Excellent communication and cross-functional collaboration
    skills.
  - Ability to lead technical discussions and mentor junior
    engineers.
  - High level of ownership and ability to operate with minimal
    guidance.
  - Background in roles combining development +
    release/operations.
  - Experience with Application & Performance Monitoring tools.
  - Knowledge of Pub/Sub, Kafka, or other event-driven messaging
    systems.
  - Exposure to SRE/DevOps practices, including incident
    management and root-cause analysis.



  Preferred Qualifications



  - Experience in healthcare domains (PBM, NCPDP, HIPAA).



  Education



  - Bachelor’s degree in computer science, Engineering, or
    related field – or equivalent experience.



  Location



  - Texas, Chicago, NY - Photon Offices



  Compensation, Benefits and Duration



  Minimum Compensation: USD 44,000 Maximum Compensation: USD
  154,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
