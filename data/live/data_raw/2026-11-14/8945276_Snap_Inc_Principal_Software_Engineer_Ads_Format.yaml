  Our Benefits: Snap Inc. is its own community, so we’ve got
  your back! We do our best to make sure you and your loved
  ones have everything you need to be happy and healthy, on
  your own terms. Our benefits are built around your needs and
  include paid parental leave, comprehensive medical coverage,
  emotional and mental health support programs, and
  compensation packages that let you share in Snap’s long-term
  success!

  Compensation

  In the United States, work locations are assigned a pay zone
  which determines the salary range for the position. The
  successful candidate’s starting pay will be determined based
  on job-related skills, experience, qualifications, work
  location, and market conditions. The starting pay may be
  negotiable within the salary range for the position. These
  pay zones may be modified in the future.

  Zone A (CA, WA, NYC):

  The base salary range for this position is $276,000-$414,000
  annually.



  Zone B:

  The base salary range for this position is $262,000-$393,000
  annually.

  Zone C:

  The base salary range for this position is $235,000-$352,000
  annually.

  This position is eligible for equity in the form of RSUs.

