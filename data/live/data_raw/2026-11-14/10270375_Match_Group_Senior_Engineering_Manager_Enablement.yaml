description: |
  Hinge is the dating app designed to be deleted

  In today's digital world, finding genuine relationships is
  tougher than ever. At Hinge, we’re on a mission to inspire
  intimate connection to create a less lonely world. We’re
  obsessed with understanding our users’ behaviors to help
  them find love, and our success is defined by one simple
  metric– setting up great dates. With millions of users
  across the globe, we’ve become the most trusted way to find
  a relationship, for all.

  About the Role



  Engineering Enablement helps engineering teams build faster,
  more safely, and with less friction. The team owns the
  tools, workflows, and platform capabilities that improve
  developer velocity, quality, and confidence across the
  product development lifecycle, with a growing focus on AI-
  native tooling. That includes Hinge's agent platform, the
  foundation for building and operating AI agents across the
  development lifecycle, alongside the CI/CD pipeline,
  developer-facing observability, and the tooling that makes
  spinning up services and internal tools frictionless.

  We are looking for a Senior Engineering Manager to lead
  Engineering Enablement within Platform. This role owns the
  team's strategy, roadmap, and execution while ensuring the
  work delivers meaningful value to engineering teams across
  the company. You will identify the highest-leverage
  opportunities to improve how engineers build, test,
  validate, and adopt platform capabilities, and you will lead
  the team that turns those opportunities into durable systems
  and practices.



  This is a hands-on platform leadership role with broad
  cross-functional reach. You will partner closely with
  product engineering teams and adjacent platform teams to
  ensure Engineering Enablement is building the right
  capabilities, driving adoption, and improving outcomes
  rather than just shipping tools.

  Responsibilities

  - Lead the Engineering Enablement team strategy: define the
    highest-leverage opportunities to improve developer
    velocity, quality, and engineering effectiveness.
  - Own the team's roadmap and execution: make priorities clear,
    drive decisions to closure, and ensure the team is
    delivering against meaningful outcomes.
  - Build and improve the tools, workflows, and platform
    capabilities that help engineers develop, test, validate,
    and ship software more effectively.
  - Treat internal platform work as a product: understand user
    needs, shape the right solutions, drive adoption, and
    measure success through velocity and quality improvements.
  - Advance the team's AI-native bets: make Hinge's codebase and
    systems operable by agents, and build the validation
    infrastructure that lets faster development translate into
    faster, safe product impact.
  - Raise the technical bar on the team through strong
    engineering judgment, clear standards, and credible
    involvement in architecture and design discussions.
  - Grow and manage the engineers on the team, including
    coaching, performance management, hiring, and development
    of future technical and people leaders.
  - Partner across Platform and with product engineering leaders
    to make shared work legible, coordinated, and effective.
  - Represent Engineering Enablement clearly to the broader
    engineering organization: what it owns, what it enables,
    and how teams should engage with it.

  What We're Looking For

  #LI-CH1

  As a member of our team, you’ll enjoy:

  401(k) Matching: We match 100% of the first 10% of pre-tax
  401(k) contributions you make, up to a maximum of $10,000
  per year.

  Professional Growth: Get an annual Learning & Development
  stipend once you’ve been with us for three months. You also
  get free access to Udemy, an online learning and teaching
  marketplace with over 6000 courses, starting your first day.

  Parental Leave & Planning: When you become a new parent,
  you’re eligible for 100% paid parental leave (20 paid weeks
  for both birth and non-birth parents.)

  Fertility Support: You’ll get easy access to fertility care
  through Carrot, from basic treatments to fertility
  preservation. We also provide a stipend towards fertility
  preservation. You and your spouse/domestic partner are both
  eligible.

  Date Stipend: All Hinge employees receive a $100 monthly
  stipend for epic dates– Romantic or otherwise. Hinge Premium
  is also free for employees and their loved ones.

  ERGs: We have eight Employee Resource Groups (ERGs)—Asian,
  Unapologetic, Disability, LGBTQIA+, Raices, Women/Nonbinary,
  Parents —that hold regular meetings, host events, and
  provide dedicated support to the organization & its
  community.

  At Hinge, our core values are…

  Authenticity: We share, never hide, our words, actions and
  intentions.

  Courage: We embrace lofty goals and tough challenges.

  Empathy: We deeply consider the perspective of others.

  Diversity inspires innovation

  Hinge is an equal-opportunity employer. We value diversity
  at our company and do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. We believe success is created by a
  diverse workforce of individuals with different ideas,
  strengths, interests, and cultural backgrounds.

  If you require reasonable accommodation to complete a job
  application, pre-employment testing, or a job interview or
  to otherwise participate in the hiring process, please let
  your Talent Acquisition partner know.

