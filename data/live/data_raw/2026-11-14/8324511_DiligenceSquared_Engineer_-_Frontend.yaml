description: |
  We’re looking for a Software Engineer with deep expertise in
  frontend to help develop the next-generation AI platform for
  market due diligence. You'll own the frontend for AI-powered
  research workflows - building interfaces for voice AI
  interactions and interactive data visualization to create
  the next-generation of market reports for investment
  professionals in Private Equity, Hedge Funds, Private
  Credit, and Corporate M&A.

  About DiligenceSquared

  DiligenceSquared is the AI-native consulting firm. We
  deliver investment-grade market research and commercial due
  diligence, powered by AI agents and led by experienced
  consultants. Our founding team brings deep experience from
  Blackstone and BCG, and we're backed by Y Combinator and
  Relentless. Our clients include 5 of the 10 largest private
  equity firms in the world and represent more than $3T in
  combined AUM.

  What you’ll do

  - Own the entire frontend experience for our AI-powered
    platform, creating interfaces that delight users at top
    investment firms
  - Transform complex data and AI outputs into intuitive,
    actionable interfaces
  - Build performant, scalable frontend architecture that can
    handle intensive real-time operations
  - Push the boundaries of what's possible with modern web
    technologies
  - Apply learnings from each project into the product, so we're
    1% better everyday (Law of Compounding is real. After all,
    we are founded by investment professionals)

  Qualifications:

  - 3+ years of professional React/TypeScript experience
  - Deep expertise in modern frontend architecture and state
    management
  - Experience building complex, data-heavy applications
  - Experience with Next.js or similar React frameworks
  - Portfolio demonstrating craft and attention to detail
  - Passion for UI/UX and making complex information accessible

  Bonus:

  - Background building interfaces for AI/ML products
  - Experience with real-time communication features
  - Familiarity with voice AI integrations
  - Previous startup experience

  Who you are

  - Obsess over craft - every interaction and layout decision
    matters
  - Take pride in your code and want to work with others who do
    the same
  - Act with Urgency so we can empower you with Agency
  - Pay high attention to detail and are curious about how great
    products work
  - Feel discomfort when things don't move as fast as you feel
    they should
