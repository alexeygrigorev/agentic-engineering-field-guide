description: |
  About the company

  Our client is a fintech company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and own backend and infrastructure systems for a
  small, fast-moving team, with wide latitude over technical
  choices and full accountability for the outcomes of those
  choices. The work spans product features and the platform
  underneath them.

  What you'll do

  - Build and maintain backend services and infrastructure that
    support product development.

  - Connect software to external partner systems through APIs.

  - Improve developer tooling, testing and continuous
    integration so releases ship quickly and safely.

  - Develop data pipelines and warehouse infrastructure for
    financial data.

  - Help keep sensitive customer data secure and compliant in a
    heavily regulated setting.

  - Work on voice and conversational AI infrastructure for high-
    volume customer interaction.

  - Address root causes of problems in systems rather than one-
    off fixes.

  Requirements

  What we're looking for

  - At least 2 years of relevant engineering experience.

  - Comfort building software with and for AI agents.

  - Experience in at least one of: API integrations, developer
    tooling, voice AI infrastructure, data warehousing, or
    security, compliance and privacy engineering.

  - A track record of shipping production changes safely and
    quickly.

  - Willingness to take ownership of technical decisions and
    their consequences.

  - Ability to work six days a week, in person.

  Benefits

  Compensation and benefits

  - Base salary: USD 125,000 to 225,000 per year

  - Health, dental and vision coverage

  Location and work model

  - New York City, New York, United States

  - On-site

  - 6 days per week in office

  - Full-time
