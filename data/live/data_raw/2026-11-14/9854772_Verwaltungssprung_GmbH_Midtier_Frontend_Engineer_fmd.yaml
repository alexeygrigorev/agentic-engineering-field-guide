description: |
  Verwaltungssprung is a Berlin-based GovTech company
  developing AI-powered software solutions to simplify and
  digitize administrative processes. Our platform enables
  citizens and public institutions to access secure, user-
  friendly, and fully digital public services. To support the
  growth of our organization, we are looking for a Midtier
  Frontend Engineer (f/m/d) with strong expertise in modern
  web technologies, responsive interface development, and
  user-centered digital experiences. In this role, you will
  develop intuitive and accessible frontend applications that
  help citizens and public institutions interact seamlessly
  with digital government services. Tasks * Develop and
  maintain responsive, high-quality user interfaces for web
  applications * Collaborate closely with Product Designers,
  Backend Engineers, and AI teams to deliver user-friendly
  digital solutions * Build scalable frontend components and
  reusable UI libraries using modern frontend frameworks *
  Ensure performance, accessibility, responsiveness, and
  cross-browser compatibility of applications * Translate
  design concepts and user requirements into clean and
  maintainable code * Optimize frontend architecture and
  application performance * Participate in code reviews and
  contribute to frontend best practices and development
  standards * Support integration of frontend systems with
  APIs and backend services Requirements * Degree in Computer
  Science, Software Engineering, or a related field *
  Experience in frontend development using modern JavaScript
  frameworks and web technologies * Strong understanding of
  responsive design, accessibility standards, and UI/UX
  principles * Familiarity with APIs, version control systems,
  and modern development workflows * Knowledge of frontend
  performance optimization and testing practices * Ability to
  work collaboratively in cross-functional product teams *
  Strong attention to detail and problem-solving skills *
  Motivation to build impactful digital products within a
  fast-paced startup environment * Excellent communication
  skills in English; German is a plus Benefits * Attractive
  above-average compensation package * Centrally located
  offices with access to the unique ThinkTank Campus in
  Berlin-Wannsee * Free snacks and beverages in our offices *
  Flat hierarchies, fast decision-making, and room for your
  own ideas * International team spirit with recognition of
  both collective and individual successes * Early
  responsibility and creative freedom from day one *
  Structured onboarding with a buddy and experienced mentor *
  Continuous training programs and regular development
  discussions Join Verwaltungssprung and become part of a
  mission-driven team building the future of digital public
  services. If you are passionate about translating complex
  requirements into meaningful digital solutions with real
  societal impact, we would love to hear from you.
