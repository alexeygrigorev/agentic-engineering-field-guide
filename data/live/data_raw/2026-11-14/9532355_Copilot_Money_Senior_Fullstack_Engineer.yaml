description: |
  Who we are

  Copilot Money is on a mission to help people stress less
  about money. We’re building a new kind of financial platform
  that empowers people to take control of their finances, make
  informed decisions, and achieve their goals. We're a high-
  energy, fast-paced startup looking for determined, hands-on
  folks to join our team and make a real impact on people's
  financial lives.

  The Role

  As a Senior Fullstack Engineer at Copilot Money, you'll be a
  key contributor on a small, high-ownership engineering team
  building one of the most trusted personal finance apps in
  the market. You'll work across the full stack on features
  that matter - bringing strong technical judgment, a bias for
  shipping, and a genuine enthusiasm for using AI tools as
  part of how you build.

  This is a hybrid position based in New York City you’ll be
  required to come into our office at least 2 times a week
  along with the rest of the team. We work from home the rest
  of the week, but the office is always available in case you
  want to make use of it more often.

  Key Responsibilities

  - Own end-to-end delivery of product features spanning web
    client and backend systems, from technical design through
    launch and iteration.
  - Design and implement backend APIs, data models, and services
    that power Copilot Money's core financial features.
  - Partner closely with Product and Design in a build-as-you-
    plan process - comfortable moving forward with incomplete
    inputs and refining solutions through real usage.
  - Contribute to architecture decisions and raise the bar for
    code quality, testing, and operational reliability within
    your team.
  - Actively use AI tools and models as part of your daily
    development workflow.
  - Identify and address technical debt and risks proactively,
    with a pragmatic approach to balancing speed and
    maintainability.

  Required Qualifications

  - 6+ years of professional software engineering experience
    with significant ownership of shipped products.
  - Strong experience building web apps, with production work in
    Node.js, React, and TypeScript.
  - Strong backend engineering skills, including designing APIs,
    data models, and scalable services.
  - Experience with a major cloud provider (GCP, Cloudflare, or
    AWS).
  - A bonus if you have experience with: agentic
    interfaces/tools, Progress Web Apps, Firebase, real-time
    systems, Mobile apps, CI / CD systems
  - Comfortable working across the full stack with minimal hand-
    offs between client and server work.
  - Hands-on, day-to-day user of AI coding tools (e.g. Claude,
    Cursor, Gemini) - not just curious about AI, but actively
    integrating it into how you build.
  - Strong system design fundamentals and comfort making
    technical tradeoffs under ambiguity.
  - Clear communicator who works well with product, design, and
    fellow engineers.
  - Team player who can manage time independently.
  - Based in NYC.

  Why should you work with us?

  - A product people love: Copilot users are extremely engaged
    with the app and are sharing it with their friends and
    family.
  - A team that cares: We’re a bunch of geeks who care about
    data quality and good coffee. We go the extra mile when it
    comes to making our users happy (and making an excellent
    pour-over).
  - Significant impact: We are currently a small, thirty-five-
    person team with big ambitions. Our team has previous
    experience at companies like Google and Apple.
  - Multicultural team: We’re based in NYC 🇺🇸 and in Santiago,
    Chile 🇨🇱.
  - Great company culture: You’ll work with a highly
    collaborative team that’s always learning and ready to
    help each other out.

  Compensation and Benefits

  - The expected salary range for this role is $185k - $215k.
    However, the starting base pay will depend on a number of
    factors including the candidate’s location, skills,
    experience, market demands, and internal pay parity.

  - Equity in the company
  - Health, Dental & Vision Insurance (company pays 100% premium
    for employee)
  - 401k matching up to 4%
  - Home Office Setup, and monthly Internet reimbursement (up to
    $80/month)
  - Wellness Reimbursement ($100/month)
  - 4 weeks of PTO. After 2 years in the company you get 5 extra
    vacation days, and 5 more after 4 years.
  - Annual company retreats

  At Copilot Money, we believe that diverse teams build better
  products. We strongly encourage applications from
  individuals of all backgrounds, regardless of race, color,
  religion, gender, gender identity or expression, sexual
  orientation, national origin, genetics, disability, age, or
  veteran status.

  Join us in our mission to help the world stress less about
  money and create financial clarity for all!
