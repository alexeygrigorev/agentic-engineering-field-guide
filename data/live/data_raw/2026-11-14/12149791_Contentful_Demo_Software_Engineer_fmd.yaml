description: |
  About The Opportunity

  As a Demo Software Engineer (f/m/d)  you will be responsible
  for developing digital applications showcasing the use of
  Contentful within well-established categories and emerging
  areas. You will be the first to see new product features and
  play a critical role in bringing them to the market by
  building demos featured in product launches, analyst calls
  and annual customer conferences. In the off-season, you will
  help Contentful users get the most out of the product by
  developing how-to guides and tutorials, recording technical
  videos, and - occasionally - conducting in-person workshops.

  This is a hands-on position that requires solid development
  skills and experience in shipping successful digital
  applications. You will be routinely asked to create things
  from scratch and craft delightful interaction loops, so
  creative thinking and good UX instincts are important for
  this role. Expect to be working on a wide range of tasks -
  frontend, backend, QA, devops - and a diverse set of
  projects spanning web, mobile, internal tooling, and AI. The
  demo team operates a modern technology stack and has a lot
  of say in deciding what tools and architectural patterns to
  use on the job.

  While the core Demo team is small, we work with numerous
  stakeholders to deliver on our goals. We partner with Sales,
  Product, Engineering and Partnership teams to identify key
  business requirements and technical specifications for demo
  assets. We are experienced at augmenting our team with
  freelancers, agencies, and partners when tackling large-
  scale development projects. And we work closely with other
  marketing teams to drive product adoption through long-term
  educational programs and ad hoc campaigns.

  What To Expect?

  Be a part of an agile development team with a high impact
  across the organization:

  - Support popular customer use cases and enable integrations
    with leading cloud providers, AI services and SaaS vendors
  - Identify high-value technical problems and prototype quick
    solutions in the form of components, apps, integrations or
    full-fledged demo environments to address them.
  - Master technical topics underpinning effective use of the
    Contentful platform, including content modeling, design
    systems, content orchestration, composable architectures,
    etc
  - Develop expertise in using the customer-facing Contentful
    platform (e.g. APIs, CLI, webhooks, Forma36 design system,
    App framework, etc.) and internal systems (e.g.
    monitoring, deployment, AI-assisted development work)
  - Effectively leverage devops infrastructure and AI tools to
    automate repetitive tasks, conduct effective QA, and
    support end-to-end workflows for internal users
  - Prototype new integrations with our tech partners (among
    them OpenAI, Vercel, Algolia, Commercetools, Bynder,
    Ninetailed, Slack)
  - Collaborate with Sales Engineering, Developer Relations,
    Solutions Architecture, and Product Marketing to create
    polished demo sites and apps
  - Collaborate with Product Management, Engineering, and Design
    to implement new features in demo environments and provide
    effective product feedback
  - Coach junior engineers and peers, act as a tech lead for
    cross-functional projects  and projects delivered by
    external contractors

  What You Need To Be Successful

  - 6+ years of software development experience and/or systems
    engineering experience
  - Strong technical experience with JavaScript, TypeScript and
    React
  - Solid understanding of modern frontend frameworks
    (React/Vue/Svelte)
  - Extensive experience working with APIs (including GraphQL
    API)
  - Understanding of CI/CD workflows and devops best practices
  - Ability to identify and prioritize high-impact problems and
    independently deliver solutions that provide reasonable
    effort/quality trade-offs
  - Innate curiosity and ability to empathize with end users
  - Good communication skills and ability to present complex
    technical concepts in an accessible way
  - Proactive attitude and ability to master new topics quickly
    (there is a lot to learn on the job)
  - Experience in full-stack development, working with AI,
    implementing design systems in production, launching
    mobile apps, and leading product development workshops is
    a plus

