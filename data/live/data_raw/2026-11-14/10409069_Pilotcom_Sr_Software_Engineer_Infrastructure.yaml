description: |
  The Role

  Pilot is a successful startup hiring a senior engineer on
  our Infrastructure team.



  All of our teams have unique charters to collectively build
  the software, services and systems that enable Pilot to
  deliver a high-quality experience, profitably, at scale. The
  Infrastructure team accelerates the rest of R&D by providing
  scalable, efficient, and high-quality building blocks for
  product development, while also ensuring we can support
  business growth in a secure and reliable way. The team is
  responsible for building simple, scalable abstractions and
  owns the full Infrastructure stack from the AWS infra that
  our systems run on to the product platform that our product
  engineers use.



  Pilot’s aim is to provide our customers with the same
  superpowers as large companies with full finance teams —
  superpowers that include having a deep understanding of
  financial health of the business, the machinery to
  constantly improve it, and the predictive abilities to
  thoughtfully plan for the future. We do this at a fraction
  of the cost a large company would pay for this, by
  delivering these capabilities through powerful software.



  Pilot’s backend is written in fully typed modern Python, and
  our frontend is JavaScript, TypeScript, and Vue.js. We use
  Terraform to manage our production infrastructure, and
  deploy Docker containers to ECS. AWS CodeDeploy powers our
  deployments and we rely on Honeycomb for our monitoring and
  Postgres as our database.



  We're looking for senior infra engineers who are generalists
  comfortable working across the full infrastructure stack,
  with a product platform bent and full stack familiarity.

  Key Responsibilities

  - Building, testing and deploying software in a continuous
    manner (we deploy daily or more often).
  - Creating and contributing to technical specs and
    testing/rollout plans.
  - Working with internal customers and stakeholders to ensure
    we’re solving the right problems.
  - Mentoring and sponsoring your teammates to help them grow.
  - Working across teams to shape the future of engineering at
    Pilot.
  - Supporting your software and services as required.

  About you

  Even if you don’t have experience with the specific
  technologies in our stack, we’d love to talk to you! Our
  requirements are:

  - 5+ years of experience as a software engineer
  - Experience with Python in production
  - Experience with common infrastructure tooling such as
    Terraform, AWS
  - Familiarity with the frontend ecosystem and frontend
    infrastructure tools
  - Able to work collaboratively across functions
  - Strong written, verbal, and technical communication skills
  - Able to write well-structured, well-tested, and maintainable
    code
  - Demonstrated ability to mentor and teach others
  - This position is only available for remote employment in the
    United States in the following states: CA, GA, NY, NC, TN,
    TX, and WA

  About Pilot

  Pilot launched in 2017 to bring the back office into the
  modern era. Pilot provides small businesses with dedicated
  finance experts - which Pilot hires as full-time, U.S.-based
  employees - who learn the ins-and-outs of their business.
  Pilot integrates directly with the billing, banking,
  expense, and payroll systems customers already use. With a
  special blend of custom software and expert bookkeepers,
  Pilot delivers accurate, consistent bookkeeping and
  financial management and tax services that give
  entrepreneurs the freedom to focus on their business.

  Pilot has over 3,000 customers and has raised over $170
  million in financing from Sequoia, Index Ventures, Stripe,
  Bezos Expeditions, and Whale Rock.  Our investors also
  include a long list of world-class entrepreneurs, including
  Patrick and John Collison, Drew Houston, and Diane Greene.
  Our most recent funding round doubled our valuation to $1.2
  billion – Meet Fintech’s Newest Unicorn.

  Why Pilot?

  - We invest in our employees’ development and happiness
    because our employees are the keys to our success and
    ensuring happy customers
  - The opportunity to join a seasoned founding team that has
    led companies through two prior successful startups and
    acquisitions (by Oracle and Dropbox).
  - Flexible vacation/time-off policy
  - All federal holidays are observed
  - Competitive benefits package including additional wellness
    benefits
  - Parental leave for birthing or non-birthing parents – 100%
    pay for 12 weeks
  - 401(k) plan

  The base pay range target for the role seniority described
  in this job description is $133,000 - $267,000 in most
  remote locations, and between $166,000 - $267,000 in San
  Francisco, CA and New York City, NY. Final offer amounts
  depend on multiple factors such as candidate experience and
  expertise, geographic location, total compensation, and
  market data. In addition to cash pay, full-time regular
  positions are eligible for equity, 401(k), health benefits,
  and other benefits; some of these benefits may be available
  for part-time or temporary positions.

  Pilot commits to provide a work environment free of
  discrimination and harassment, as well as equal employment
  opportunity regardless of race, color, ancestry, religion,
  sex, national origin, sexual orientation, age, citizenship,
  marital status, disability, gender identity or Veteran
  status. We also consider qualified applicants regardless of
  criminal histories, consistent with legal requirements. You
  may view all of Pilot’s recruiting notices here, including
  our EEO policy, information about requesting a reasonable
  accommodation in the job application process, recruitment
  agency policy, recruitment scam notice, and important
  E-Verify information. You may view our job candidate privacy
  policy here.

  As part of Pilot’s commitment to fair and transparent remote
  hiring, Pilot uses light identity verification steps, such
  as briefly waving on camera and/or recording interviews, to
  confirm that candidates are representing themselves. For
  some roles, we may also invite finalists to our San
  Francisco office for onsite interviews.  By clicking “Submit
  Application” below you consent to our recording of
  interviews with you if your application goes to the
  interviews stage.
