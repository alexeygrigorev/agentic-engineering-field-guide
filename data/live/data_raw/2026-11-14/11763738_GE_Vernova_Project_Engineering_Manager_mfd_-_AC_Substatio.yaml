description: |
  Job Description SummaryJoin GE Vernova’s Grid Systems
  Integration (GSI) team, where our AC Substation projects are
  powering Europe’s shift to clean energy and helping
  operators meet bold sustainability targets. We’re looking
  for a Project Engineering Manager (m/f/d) to lead the
  technical execution of high-profile substation projects in
  Germany or Poland. This is your opportunity to take full
  ownership of the engineering scope, from initial design
  coordination to final customer acceptance. In this role, you
  will guide multidisciplinary design teams, manage complex
  technical interfaces, and ensure the on-time, on-budget
  delivery of engineering documentation with the highest
  quality standards. You’ll be responsible for implementing
  design changes, aligning engineering workflows with
  procurement and construction, and representing customer
  interests throughout the project lifecycle.

  Job Description

  Key Responsibilities

  - Oversee and consolidate the project drawing list and
    integrate it into the design schedule.
  - Manage the overall engineering timeline and ensure alignment
    with procurement, construction, and commissioning
    activities.
  - Coordinate technical interface deliveries and maintain
    structured communication with partners, clients, and
    contractors.
  - Ensure timely and high-quality delivery of all design
    documentation, including partner contributions.
  - Support engineering change management for large and complex
    projects in collaboration with the Project Engineering
    Director and Project I&I manager.
  - Lead and coordinate multidisciplinary design teams,
    including Primary, Secondary, and Civil Designers.
  - Monitor and manage the engineering budget, identify cost-
    saving opportunities, and handle scope or design changes,
    including claim preparation.
  - Participate in design reviews and ensure alignment with GE
    procedures and project strategy.
  - Analyze customer technical requirements, prepare clause-by-
    clause compliance documentation, and manage technical
    queries.
  - Represent customer interests in design decisions and ensure
    validation through customer acceptance processes.

  Your Profile

  - Degree in Electrical Engineering or equivalent.
  - Extensive experience in high-voltage (HV) project execution,
    ideally in substation environments.
  - Fluent in English and either German or Polish.
  - Proven experience in technical project management within
    international, multidisciplinary teams.
  - Strong understanding of Transmission and Distribution
    systems and engineering workflows.
  - Skilled in managing technical interfaces with partners,
    clients, and contractors.
  - Experienced in handling drawing lists, design schedules,
    multidisciplinary design reviews, and design change
    processes.
  - Excellent interpersonal and stakeholder management skills.
  - Capable of managing multiple projects simultaneously.
  - Familiarity with Renewable Energy systems is a plus.

  Who We Are

  GE Vernova – Grid Systems Integration (GSI) is a rapidly
  growing business line within GE Vernova, the energy company
  that spun off from General Electric in 2024 to accelerate
  the global energy transition. With over 12,000 professionals
  worldwide, we deliver cutting-edge technologies for reliable
  and efficient power transmission and distribution. GSI
  specializes in substation integration projects, including
  high-voltage direct current (HVDC) systems, and plays a key
  role in modernizing grids and integrating renewable energy
  sources. Our mission is to build a more sustainable,
  resilient, and carbon-neutral future by electrifying the
  world with advanced grid solutions.

  Benefits

  GE Vernova employees rise to the challenge of building a
  world that works. To support this mission, we offer a
  variety of competitive benefits designed to meet the diverse
  needs of our workforce:

  - Our compensation and benefits are structured to reward high
    performance and support your personal and family needs. We
    provide a comprehensive benefits package based on your
    employment status and local requirements.
  - A healthy, balanced lifestyle means different things to
    different people. That’s why we’ve developed programs that
    support the way you live and work today.
  - GE Vernova invests in your growth by offering opportunities
    for continued learning and development throughout your
    career.

  Inclusion & Diversity

  At GE Vernova, we value your unique identity, background,
  and experiences. We are committed to fostering an inclusive
  culture where everyone feels empowered to do their best
  work, because they feel accepted, respected, and that they
  belong.

  Additional Information

  Relocation Assistance Provided: No
