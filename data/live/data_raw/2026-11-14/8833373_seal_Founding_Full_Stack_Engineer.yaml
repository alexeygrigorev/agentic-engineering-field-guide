description: |
  Why Stand

  Stand is building the future of prediction market trading.
  We are looking for a full stack engineer to help accelerate
  our roadmap. Started by repeat founders from Y Combinator,
  Facebook, Brave, and MIT. Growing 200% w/w and facilitating
  millions of dollars in trading volume monthly. Why you
  should join Culture is paramount for us. Our values are:

  - User-obsessed
  - Operate from first principles
  - Data-autonomous (go beyond data-driven)
  - The best ideas win
  - Transparency remains the ultimate disinfectant
  - Be comfortable being uncomfortable
  - Bias for action

  The Role Stand is looking for a founding full stack engineer
  to help accelerate our roadmap. You will be responsible for
  shaping the future of prediction market trading, starting
  with our advanced trading terminal.

  Responsibilities

  - Write high quality and well tested code; scrutinize over
    other team members’ code
  - Architect, build, deploy and maintain the infrastructure
    underlying Stand’s product offerings
  - Collaborate with the design and product teams to craft
    first-class user experiences
  - Participate and own product improvement ideas from start to
    finish

  Minimum Requirements:

  - Based in the US
  - 2+ yrs of engineering experience at a fast-pace startup
  - Extensive experience shipping significant full stack
    products all the way to launch
  - Demonstrated proficiency in TypeScript, JavaScript,
    Solidity, Go, Rust
  - Supremely curious
  - Web3 native
  - Excellent oral and written communication skills

  Preferred Qualifications

  - Highly skilled in building with cloud infrastructure,
    networking, or orchestration with AWS (e.g. Docker, ECS,
    CDK, DynamoDB)
  - Extensive knowledge on the EVM and general Ethereum infra
  - Experience writing smart contracts

  N.B. We welcome interest from candidates with varying levels
  of experience; many successful candidates do not meet every
  single requirement.

  Benefits

  - Great compensation package (salary + equity)
  - Full health, dental, and vision insurance
  - Generous home-office stipends

  - Unlimited PTO
