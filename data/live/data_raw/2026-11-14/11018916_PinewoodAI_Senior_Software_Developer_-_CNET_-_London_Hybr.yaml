description: |
  Hybrid Working: We take a flexible approach to hybrid
  working, recognising that office attendance may vary
  depending on your location, role and team needs. Don’t let
  office attendance put you off applying. The expected working
  pattern will be discussed during the recruitment process. As
  a senior member of the team, you will work with a group of
  developers and senior engineers, shaping technical
  decisions, guiding delivery, and ensuring the team produces
  high-quality, scalable solutions for the Pinewood Automotive
  Intelligence Platform, our enterprise-scale SaaS product
  used by automotive retailers and OEMs worldwide.

  This role is ideal for a strong, hands-on developer who
  enjoys building new product features, developing
  integrations with third-party systems, and working across
  the full software development lifecycle while supporting
  high engineering standards within a collaborative team
  environment.


  Key Responsibilities:

  - Collaborate closely with UK-based Product and Engineering
    teams to deliver high-quality features and enhancements
    for the Pinewood Automotive Intelligence Platform.
  - Remain hands-on in coding, design, and architecture,
    promoting best practices across the full .NET stack.
  - Mentor and coach team members, helping them grow their
    technical capability and encouraging a culture of learning
    and improvement.
  - Ensure the team delivers scalable, secure, and maintainable
    solutions that meet enterprise SaaS standards.
  - Support the Engineering Manager with shaping local
    engineering processes, CI/CD pipelines, and development
    practices.
  - Participate in architectural discussions, contributing to
    long-term technical decisions.
  - Encourage strong communication and collaboration across the
    UK engineering teams.
  - Diagnose complex issues, review code, and lead the
    resolution of technical challenges.
  - Contribute to building a positive, high-performing team
    culture within the new hub.
  - Responsible for contributing towards the organisation's
    information security strategy, ensuring the protection of
    sensitive data and compliance with relevant regulations,
    while managing risk and adhering to all established
    security measures

  Requirements:

  - Proven experience as a Senior Developer within a SaaS or
    enterprise software environment.
  - Strong hands-on expertise in C#, .NET / .NET Core, and SQL /
    T-SQL.
  - Solid understanding of database design, performance
    optimisation, and query tuning.
  - Experience delivering front-end functionality using HTML,
    JavaScript, and Razor.
  - Experience building and supporting integrations with third-
    party systems using REST APIs or similar technologies.
  - Practical experience working with Azure Cloud Services and
    Azure DevOps, or equivalent CI/CD tooling.
  - Proficiency with Visual Studio or VS Code.
  - Strong understanding of software development practices and
    agile delivery methods.
  - Experience working across the full software development
    lifecycle, from concept through to production support.
  - Strong analytical and problem-solving skills, with a passion
    for clean, efficient, and maintainable code.
  - Experience in enterprise SaaS industries, or with complex,
    high-availability platforms, would be beneficial.

  Benefits

  - Competitive salary based on experience

  - Bonus scheme
  - Share scheme
  - Hybrid working (flexibility depending on your base
    location).
  - 25 days holiday plus all UK bank holidays
  - 4x life assurance
  - Enhanced family-friendly leave, supporting employees with 5
    months’ full pay for maternity or adoption leave, 2 weeks’
    fully paid paternity or adoption leave, plus an additional
    2 weeks of paid annual leave to use within 24 months of
    the birth or adoption.
  - Employee Assistance Programme (EAP) - free, confidential
    24/7 support for you and your immediate family (including
    counselling, legal & financial advice, and wellbeing
    resources)
  - Ongoing training & professional development
  - Cycle to Work scheme - save up to 40% on bikes and
    accessories through salary sacrifice
  - Eyecare vouchers - free eye test and contribution towards
    prescription glasses
  - Regular social events
  - Employee recognition and awards
  - Exclusive Gym (Virgin Active) membership scheme

  About Us: Our story began more than 20 years ago, but right
  from the start, it has been rooted in the specific needs of
  the automotive industry. As automotive professionals as well
  as technologists, we wanted to build practical technology
  solutions that were designed around how automotive
  businesses work, recognising what makes them different.
  Pinewood.AI is an unparalleled Automotive Intelligence
  Platform that enables automotive retail customers
  (dealerships) and OEMs to drive growth and profitability
  throughout every aspect of their business.

  Pinewood’s cloud-based secure end-to-end ecosystem unlocks
  the value of every customer. Our vision is to be the full-
  service technology partner that helps automotive vehicle
  retailers and OEMs run more efficiently and increase revenue
  by making better commercial and business decisions more
  easily.
