description: |
  About the Role

  FinThrive is seeking a detail-oriented Software Quality
  Engineer to ensure the quality, reliability, and performance
  of our healthcare technology platforms. You will work
  closely with cross-functional engineering teams to validate
  application functionality, develop automated testing
  solutions, and ensure high-quality releases across data,
  APIs, and integrated systems.

  This role is ideal for someone who is hands-on with testing
  and automation, thrives in Agile environments, and is
  passionate about building scalable QA practices.

  What You Will Do

  - Collaborate with Agile teams to support the delivery of new
    features and enhancements
  - Design, document, and execute test plans, test cases, and
    test strategies
  - Perform functional, integration, system, and regression
    testing across applications, APIs, and data platforms
  - Validate data quality across relational and non-relational
    databases
  - Develop and maintain QA automation frameworks using open-
    source tools (e.g., Selenium, pytest)
  - Execute both manual and automated testing to ensure release
    quality
  - Set up and manage test data and test environments for
    integration and QA workflows
  - Track, document, and support resolution of defects,
    including basic root cause analysis
  - Support CI/CD pipelines by integrating automated test
    execution into build and deployment processes
  - Work with offshore and cross-functional teams to align
    testing efforts
  - Participate in sprint planning, backlog refinement, and
    estimation of QA work
  - Continuously learn and improve QA processes, tools, and best
    practices

  What You Will Bring

  - Bachelor’s degree in Computer Science, Engineering, or
    related field
  - 2–4 years of experience in software quality assurance or
    testing
  - Experience testing modern applications built with C#,
    Python, Java, or .NET frameworks
  - Hands-on experience with SQL and working with relational
    databases (basic NoSQL exposure preferred)
  - Experience with manual and automated testing approaches
  - Familiarity with QA automation tools such as Selenium,
    pytest, or similar frameworks
  - Experience working in Agile/Scrum environments
  - Basic understanding of CI/CD pipelines (Azure DevOps,
    Jenkins, or equivalent)
  - Experience working in Windows and/or Linux environments
  - Strong analytical, problem-solving, and debugging skills
  - Effective communication skills and ability to collaborate
    across teams

  What We Would Like to See

  - Experience working in a cloud environment (Azure preferred)
  - Exposure to API testing tools (Postman, REST Assured, etc.)
  - Familiarity with BDD frameworks (e.g., SpecFlow, Cucumber)
  - Experience testing data pipelines, APIs, or integration-
    heavy systems
  - Knowledge of test automation best practices and scalable QA
    frameworks
  - Exposure to healthcare systems, EDI transactions, or
    regulated environments
  - Understanding of DevOps concepts or infrastructure testing

