description: |
  Job Description:

  We are looking for a Senior Java Backend Developer to join
  the Margin Calculation technology team within Prime
  Services.

  Our platform processes large volumes of financial data and
  applies complex business rules to calculate client margin
  requirements and support the firm’s risk management. The
  role involves hands-on Java development, technical design,
  performance optimization, and end-to-end ownership of
  business-critical functionality.

  You will work closely with developers, business analysts,
  risk, and operations teams across multiple regions. This is
  a senior role with opportunities to influence platform
  design, mentor other developers, and improve engineering
  practices.

  Responsibilities

  - Design, develop, test, and deliver Java applications
    supporting margin calculation.
  - Translate complex financial requirements into accurate,
    maintainable, and well-tested solutions.
  - Lead technical design for significant enhancements and
    contribute to the platform’s technical roadmap.
  - Optimize calculation performance using concurrency,
    multithreading, parallel processing, caching, and
    efficient database access.
  - Develop high-volume batch and event-driven processing
    workflows.
  - Review code and designs, establish development standards,
    and mentor other engineers.
  - Own deliverables throughout the development lifecycle, from
    requirements analysis through production implementation.
  - Investigate production issues, perform root-cause analysis,
    and implement long-term fixes.
  - Improve monitoring, resiliency, operational support, and
    recovery processes.
  - Partner with global technology and business teams to manage
    dependencies, risks, and delivery commitments.
  - Ensure solutions meet security, regulatory, audit, and
    technology-control requirements.

  Required Qualifications

  - 7+ years of professional software development experience,
    with strong hands-on Java expertise.
  - Advanced knowledge of core Java, including collections,
    streams, concurrency, multithreading, synchronization, and
    memory management.
  - Strong experience with Spring, particularly Spring Boot,
    Spring Batch, Spring Integration, and Spring Data.
  - Experience building high-volume, calculation-intensive, or
    distributed applications.
  - Strong understanding of algorithms, data structures, design
    patterns, and clean-code principles.
  - Experience with Kafka, JMS, or similar messaging
    technologies.
  - Strong SQL and relational database experience.
  - Experience with JUnit, Mockito, test-driven development, and
    automated integration testing.
  - Proven experience troubleshooting and improving application
    performance.
  - Proficiency in Linux, Git, CI/CD, and production-support
    practices.
  - Working knowledge of Docker and Kubernetes.
  - Ability to lead technical delivery and communicate
    effectively with both technical and business stakeholders.

  Preferred Qualifications

  - Experience with margin, collateral, risk, pricing, Prime
    Services, or other financial platforms.
  - Experience developing calculation engines or implementing
    complex business rules.
  - Experience with large-scale batch processing and job
    scheduling.
  - Experience with Apache Geode, GemFire, or another
    distributed caching technology.
  - Familiarity with Hibernate, JPA, Jackson, and related Java
    frameworks.
  - Experience modernizing complex or legacy applications.
  - Experience with application monitoring, logging, alerting,
    and performance profiling.

  Education

  Bachelor’s degree in Computer Science, Engineering, or a
  related field, or equivalent practical experience

