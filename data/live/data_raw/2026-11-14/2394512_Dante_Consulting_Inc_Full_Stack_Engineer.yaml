description: |
  Dante is hiring full time Full Stack and/or Senior Full
  Stack Engineers to join our growing team. Dive right in
  working alongside Dante teammates and client stakeholders to
  build robust scalable software in the cloud for our
  Enterprise private sector clients. Industry clients include
  Airlines, Communications, Finance, Media, Telecommunications
  and more. We are building dynamic solutions while
  approaching consulting in a unique and refreshing way, using
  Cloud Native and serverless architecture & development using
  React, Node.js, AWS Lambda and DynamoDB.

  We hire full time employees residing in the DC metro area
  (DC, VA, MD), California, Oregon, Washington, Texas,
  Colorado, Montana and Kansas.

  Full Stack Engineer

  Responsibilities:

  - Work closely with Dante team and client stakeholders using
    Cloud Native Architecture (e.g., JavaScript, React, Node,
    AWS Lambda,  DynamoDB, etc.)
  - Work across full technology stack to deliver end to end
    solutions using Lean methodologies
  - Work closely with teams and independently to complete
    deliverables on time
  - Continue to learn and introduce emerging technologies that
    may provide more effective solutions

  Qualifications:

  - MUST have 2+ years of on-the-job experience writing AWS
    Lambda functions
  - 3 + years of Enterprise application development practical
    on-the-job experience using JavaScript, Node.js, React,
    and DynamoDB or relevant database
  - 3+ years of development experience of multi-tier software
    applications
  - Experience with iterative development in a fast paced
    environment
  - Experience with AWS, Git, Jasmine, Mocha, Atlassian suite a
    plus
  - Prior experience in a Lean development environment is a plus
  - Demonstrated ability to quickly develop subject matter
    expertise
  - Demonstrated ability to effectively interact with project
    team and client stakeholders
  - Prior experience in a consulting environment a plus
  - Must have effective communication and listening skills
  - MUST have U.S. Citizenship or possess Green Card

  Salary: $150,000.00 - $200,000.00 per year

  Benefits:

  - 401(k)
  - 401(k) matching
  - Health insurance
  - Health savings account
  - Paid time off
  - Professional development assistance
  - Referral program
  - Retirement plan
  - Vision insurance

  Dante is an Equal Opportunity employer
