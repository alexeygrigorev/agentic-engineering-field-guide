title: Core AI Engineering Manager
company: G-Research
location: London, GBR
work_type: FULL_TIME
company_size: 1,039 Employees
description: |
  We tackle the most complex problems in quantitative finance,
  by bringing scientific clarity to financial complexity.

  From our London HQ, we unite world-class researchers and
  engineers in an environment that values deep exploration and
  methodical execution - because the best ideas take time to
  evolve. Together we’re building a world-class platform to
  amplify our teams’ most powerful ideas.

  As part of our engineering team, you’ll shape the platforms
  and tools that drive high-impact research - designing
  systems that scale, accelerate discovery and support
  innovation across the firm.

  Take the next step in your career.

  The role

  The Core AI team owns the foundational platform that
  supports AI work across the firm. This includes the AI
  gateway service for access to frontier models, the on-prem
  inference platform for access to open-weight and custom
  models at scale on the GPU farm, and the secure model
  registry.

  We are looking for an exceptional engineering manager to
  lead and grow the Core AI team within the Basecamp
  Technology group. You will be communicating platform
  strategy and impact to senior stakeholders, including the
  Head of Basecamp Technology and CTO.

  AI is part of how every team here works, accelerating
  thinking and delivering impact. All colleagues are expected
  to bring AI into their daily workflows. In this team, that
  means building the tools and services that make this
  possible.

  Key responsibilities of the role include:

  - Driving the Core AI infrastructure roadmap in line with the
    firm's AI strategy
  - Leading build versus buy decisions across model serving and
    inference infrastructure
  - Designing and owning a centralised MCP gateway, working with
    platform teams to provide MCP services
  - Collaborate with the open-source group to stay up to date
    and help to drive priorities for feature development in
    open-source products
  - Leading and mentoring a team of product-focused engineers
  - Driving developer adoption through SDKs, documentation and
    self-service tooling

  Who are we looking for?

  The ideal candidate will have the following skills and
  experience:

  - Proven experience leading large-scale platform or
    infrastructure initiatives
  - Strong communication skills, with the ability to influence
    stakeholders across technical and business functions
  - Expert C# and Python skills, with experience building
    distributed systems
  - Deep Kubernetes expertise, including operators, custom
    schedulers and multi-tenant cluster management
  - Experience with Docker, Terraform and CI/CD in regulated
    environments
  - Experience with GPU infrastructure and platform optimisation
  - Experience operating MCP servers at scale, sandboxing
    technologies and open-source contributions

  Why should you apply?

  - Highly competitive compensation plus annual discretionary
    bonus
  - Lunch provided (via Just Eat for Business) and dedicated
    barista bar
  - 35 days' annual leave
  - 9% company pension contributions
  - Informal dress code and excellent work/life balance
  - Comprehensive healthcare and life assurance
  - Cycle-to-work scheme
  - Monthly company events
  - Experience days: all-expenses-paid, bucket-list outings with
    colleagues, from Michelin-star tasting menus to European
    day trips.

  Relocation Support

  If you're relocating internationally to join us in London,
  we offer a comprehensive range of support services to assist
  you all the way. All costs associated with your relocation
  and immigration are covered by G-Research.

  - Concierge service: Your personal consultant will arrange
    travel; help find your new home and manage your move.
    They're also on hand to help with more bespoke requests
    too.
  - Immigration support: We'll partner you with an expert
    consultant who will guide you through the full immigration
    process.

  G-Research is committed to cultivating and preserving an
  inclusive work environment. We are an ideas-driven business
  and we place great value on diversity of experience and
  opinions.

  We want to ensure that applicants receive a recruitment
  experience that enables them to perform at their best. If
  you have a disability or special need that requires
  accommodation please let us know in the relevant section
