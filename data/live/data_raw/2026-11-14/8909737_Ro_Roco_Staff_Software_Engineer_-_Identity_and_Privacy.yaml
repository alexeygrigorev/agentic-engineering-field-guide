description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role

  As a Staff Software Engineer on Ro’s Identity and Privacy
  team, you will build and scale systems that support secure
  user identity and privacy-first data practices. This
  includes authentication, user lifecycle management, consent,
  and data governance—ensuring Ro’s technical foundation
  supports both patient trust and business growth.

  You will design, build, and maintain systems that manage
  customer identity, data preferences, attribution, and event-
  driven data flows. This work requires strong expertise in
  distributed systems, event pipelines, and privacy-preserving
  architectures. You’ll work in a highly cross-functional
  environment, partnering with security, legal, marketing, and
  data teams to define solutions that balance compliance,
  security, and high-quality patient experiences.

  What You’ll Do

  - Build and maintain privacy-first, distributed data systems
    and consent management systems that comply with consumer
    privacy regulations.
  - Design and operate high-throughput, event-driven
    architectures (e.g., Kafka, streaming systems) for
    collection, processing, and distribution of first-party
    data.
  - Contribute to authentication and identity systems, including
    user lifecycle management, access controls, and multi-
    factor authentication.
  - Architect and scale asynchronous data pipelines and event
    processing systems for real-time and batch use cases.
  - Partner with marketing and growth teams to enable privacy-
    compliant advertising, CRM, and analytics workflows.
  - Implement privacy-preserving techniques (e.g.,
    anonymization, tokenization, minimization) and ensure
    compliant data flows to third-party platforms.
  - Collaborate with security and legal teams to enforce data
    governance, retention, and compliance policies.

  What You’ll Bring to the Team

  - 8+ years of software engineering experience (2+ years at
    Staff or above level) with a focus on distributed systems,
    data infrastructure, privacy, or security.
  - Strong proficiency in Python and experience building
    scalable, production-grade systems.
  - Deep experience with distributed systems, including
    streaming platforms (e.g., Kafka), event-driven
    architectures, and asynchronous processing.
  - Experience designing and operating data pipelines, eventing
    systems, and first-party data platforms.
  - Familiarity with authentication and identity systems (e.g.,
    OAuth, session management, MFA, user lifecycle
    management).
  - Experience using agentic coding tools to improve development
    velocity, reduce workflow friction, automate repetitive
    tasks, and increase system visibility—while maintaining
    strong engineering judgment and ownership of outcomes.
  - Experience in regulated environments and strong ownership in
    driving complex, cross-functional technical initiatives.

  We’ve Got You Covered

  - Full medical, dental, and vision insurance + OneMedical
    membership
  - Healthcare and Dependent Care FSA
  - 401(k) with company match
  - Flexible PTO
  - Wellbeing + Learning & Growth reimbursements
  - Paid parental leave + Fertility benefits
  - Pet insurance
  - Student loan refinancing
  - Virtual resources for mindfulness, counseling, and fitness

  The target base salary for this position ranges from
  $223,100 to $311,000, in addition to a competitive equity
  and benefits package (as applicable). When determining
  compensation, we analyze and carefully consider several
  factors, including location, job-related knowledge, skills
  and experience. These considerations may cause your
  compensation to vary.

  Ro is consistently recognized as a top workplace in Health
