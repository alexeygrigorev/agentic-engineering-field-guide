description: |
  Suite's Story:

  Suite makes it incredibly easy for creative teams to store,
  share, and edit massive media files—like they’re sitting
  next to each other, even when they’re not. No more waiting
  on downloads or messing with sync issues. Just smooth, fast
  collaboration that keeps projects in flow and artists in the
  zone. We're a small experienced team with a mission to solve
  the biggest problems facing the media and entertainment
  industry. We’re not building another SaaS web app, we’re
  solving difficult and complex problems. To solve these
  problems we're expanding selectively with a team of high-
  performing engineers who demonstrate exceptional ability in
  their work and enjoy what they do. If this speaks to you,
  come join us.

  Who you are

  - You take pragmatic approaches to writing software
  - You test drive and refactor your code with confidence
  - You avoid large upfront design and focus on incremental
    change
  - You enjoy writing full-stack software
  - You are proficient in multiple programming languages (C#, C,
    C++, Typescript, Java)
  - You have practiced XP or would like to practice XP
  - You want to help shape the company, culture, AND product.
    You don't want "just another job"



  Your day-to-day

  - Teaching, learning from, and collaborating with teammates
  - Leading new feature development
  - And yes, writing software
  - We're open to fully remote engineers as well!

  Benefits at Suite:

  - Best in class health & dental
  - Hybrid work environment; A balance of in-office and remote
    work to foster collaboration and flexibility (for those
    located in the Denver/Boulder area)
  - Unlimited paid time off
  - Fitness & wellness stipend
  - Taco Tuesday, every TuesdaySome roles, such as internships,
    may not be eligible for certain benefits.
