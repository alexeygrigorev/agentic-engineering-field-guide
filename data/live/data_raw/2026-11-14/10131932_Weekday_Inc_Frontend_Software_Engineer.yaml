description: |
  This role is for one of our clients

  $40 - $50/hourpay

  Role Title: Frontend Software Engineer

  Role Type: Contractor

  Location: Remote

  We are seeking experienced Frontend Software Engineers to
  contribute to an AI-driven initiative focused on building
  and evaluating high-quality user interfaces. In this role,
  you will apply your frontend development expertise to help
  improve next-generation AI systems by creating accurate,
  production-quality UI implementations and providing domain-
  specific technical insights.

  No prior AI experience is required. Your knowledge of
  frontend engineering, responsive design, and modern web
  technologies will play a key role in helping AI models learn
  how to build visually polished, accessible, and high-
  performing web applications.

  RequirementsKey Responsibilities

  - Translate detailed component specifications, design systems,
    and UI mockups into accurate, production-quality web
    interfaces.
  - Build pixel-perfect, responsive user interface components
    using TypeScript, CSS3, and modern frontend development
    practices.
  - Ensure all implementations follow established design
    systems, accessibility standards, and responsive design
    principles.
  - Collaborate effectively within a remote-first environment
    through clear technical documentation, code reviews, and
    constructive feedback.
  - Identify and resolve inconsistencies or ambiguities in
    design specifications before implementation.
  - Optimize frontend performance to deliver fast-loading,
    responsive, and seamless user experiences across browsers
    and devices.
  - Contribute technical expertise to support the development
    and evaluation of advanced AI models for frontend
    engineering tasks.

  Required Qualifications

  - 3+ years of professional experience in frontend software
    development.
  - Strong proficiency in TypeScript, CSS3, HTML, and modern
    responsive web development.
  - Demonstrated experience building pixel-perfect interfaces
    from design specifications, mockups, or screenshots.
  - Experience working with component libraries, design systems,
    and reusable UI architectures.
  - Strong understanding of responsive layouts, cross-browser
    compatibility, accessibility (WCAG), and frontend
    performance optimization.
  - Excellent written and verbal communication skills in
    English.
  - Self-motivated with the ability to work independently in
    distributed, remote development environments.

  Preferred Qualifications

  - Experience extending or maintaining enterprise design
    systems.
  - Familiarity with modern frontend frameworks and component-
    driven development.
  - Strong eye for visual detail and UI consistency.
  - Experience collaborating with designers and cross-functional
    engineering teams.
  - Master's degree or PhD in Computer Science, Software
    Engineering, or a related technical discipline is a plus.

  Engagement Details

  - Fully remote opportunity with flexible working arrangements.
  - Collaborate with multidisciplinary teams on advanced AI and
    frontend engineering projects.
  - Apply real-world frontend development expertise to improve
    AI-generated user interfaces and engineering workflows.
  - Opportunities for continued engagement based on project
    needs and performance.

  Equal Opportunity

  We are committed to providing equal opportunities to all
  qualified applicants and offer reasonable accommodations
  throughout the application and engagement process upon
  request.
