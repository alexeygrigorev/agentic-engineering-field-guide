description: |
  Who we’re looking for

  We are looking for an experienced Principal Full-Stack
  Software Engineer to design, build and operate production-
  grade capabilities across APIs, data products, enterprise
  integrations and tools used by agents. This is a senior
  individual-contributor role for an engineer who can take
  complex problems from first idea through design,
  implementation, release and ongoing support.



  You will remain strongly hands-on while providing technical
  direction across teams. You will create reusable engineering
  patterns, make sound architectural trade-offs, mentor other
  engineers and raise standards for testing, security,
  observability, deployment and support. The role requires
  breadth across software, data and integration, with the
  depth to resolve difficult engineering problems and deliver
  reliable solutions in a regulated environment.



  About Us

  Schroders is a global investment manager which provides
  active asset management, wealth management and investment
  solutions. We aim to provide excellent investment
  performance to clients through active management. We serve a
  diverse client base that includes pension schemes, insurance
  companies, sovereign wealth funds, endowments, foundations,
  high net worth individuals, family offices, as well as end
  clients through partnerships with distributors, financial
  advisers, and online platforms.



  Established in 1804, we have around 5,500 people across 36
  global locations. Schroders' success can be attributed to
  its diversified business model, spanning different asset
  classes, client types and geographies.



  About Cazenove Capital

  Cazenove Capital is the wealth management business of
  Schroders. We support private individuals, families,
  charities, family offices and institutions with investment
  management, wealth planning, banking and related services.

  The base

  We moved into our new HQ in the City of London in 2018.
  We’re close to our clients, in the heart of the UK’s
  financial centre and we have everything we need to work
  flexibly.

  The opportunity in Wealth Technology

  Wealth has ambitious growth objectives. Supporting that
  growth requires us to scale the expertise of our advisers,
  planners and support teams without increasing headcount at
  the same rate.



  Our approach is to build practical technology that improves
  the workflows driving commercial and client outcomes. That
  includes secure APIs, trusted data products, enterprise
  integrations and reusable tools that allow applications,
  workflows and governed agents to act on consistent business
  capabilities. The objective is to create components that can
  be used repeatedly across Wealth, increasing delivery speed
  without compromising control, resilience or supportability.



  The team

  You will join Wealth Technology and work directly with
  business, product, architecture, data, security and control
  teams. As a principal engineer, you will combine hands-on
  delivery with technical leadership: shaping solutions,
  influencing engineering direction.

  What you'll do

  - Design, build and operate full-stack capabilities, with
    particular depth in Python services, APIs and backend
    engineering.
  - Create secure, reusable APIs and integration components that
    expose business capabilities consistently across the
    Wealth technology estate.
  - Build governed data products and pipelines, turning source
    data into reliable, documented and reusable services for
    applications, analytics and agents.
  - Develop tools that agents can use safely to retrieve data,
    invoke workflows and complete defined actions, with
    appropriate authentication, permissions, guardrails and
    auditability.
  - Own engineering outcomes across the full lifecycle,
    including design, code, automated testing, deployment,
    observability, operational readiness and continuous
    improvement.
  - Provide principal-level technical leadership through design
    reviews, reusable patterns, mentoring and constructive
    challenge, while remaining accountable for working
    software in production.



  The knowledge, experience and qualifications you need

  - Substantial hands-on software engineering experience and a
    strong record of delivering production systems across the
    full development lifecycle.
  - Deep Python engineering experience, including production
    services and APIs built with FastAPI or a comparable
    framework, plus the ability to work across user-facing
    components where required.
  - Strong understanding of API design, distributed systems,
    enterprise integration, authentication and authorisation,
    event-driven and batch patterns, testing, deployment and
    observability.
  - Experience creating data products and robust data pipelines
    using technologies such as Snowflake, SQL, dbt, Azure Data
    Factory or comparable cloud data tooling, including data
    modelling, quality and lineage.
  - Experience building tool-using applications or agent
    capabilities, including reliable tool interfaces,
    structured inputs and outputs, permissions, evaluation,
    failure handling and operational controls.
  - Principal-level judgement: able to shape technical
    direction, simplify complex problems, influence across
    teams, mentor engineers and balance pace with security,
    resilience, maintainability and regulatory control.



  What you’ll be like

  - A hands-on principal engineer who leads through technical
    credibility, working software and clear engineering
    judgement.
  - Outcome-led and pragmatic, able to move quickly while
    building solutions that are secure, reusable, observable
    and supportable.
  - Comfortable operating across software, data, integration and
    agent tooling rather than within a single technical
    specialism.
  - Collaborative and straightforward, able to mentor others,
    challenge constructively and influence technical decisions
    across organisational boundaries.



  We Recognise Potential, Whoever You Are

  Our purpose is to deliver excellent investment performance
  to clients through active management. We believe diverse
  perspectives and an inclusive culture help us make better
  decisions and achieve better outcomes for our clients.
  That's why inclusion is a strategic priority for us, and we
  are an equal opportunities employer. You are welcome here,
  regardless of your age, disability, gender identity,
  religious beliefs, sexual orientation, socio-economic
  background, or any other protected characteristic.



  We will consider flexible working arrangements for all roles
  and provide reasonable accommodations to support applicants
  and employees, including those with neurodiversity,
  disability, or physical and mental health needs. For more
  information, please visit our FAQs.



  About Us

   We're a global investment manager. We help institutions,
  intermediaries and individuals around the world invest money
  to meet their goals, fulfil their ambitions, and prepare for
  the future.



   We have around 6,000 people on six continents. And we've
  been around for over 200 years, but keep adapting as society
  and technology changes. What doesn't change is our
  commitment to helping our clients, and society, prosper.
