description: |
  Madison Square Garden Entertainment Corp. (MSG
  Entertainment) is a leader in live entertainment, delivering
  unforgettable experiences while forging deep connections
  with diverse and passionate audiences. The Company’s
  portfolio includes a collection of world-renowned venues –
  New York’s Madison Square Garden, Infosys Theater at Madison
  Square Garden, Radio City Music Hall, and Beacon Theatre;
  and The Chicago Theatre – that showcase a broad array of
  sporting events, concerts, family shows, and special events
  for millions of guests annually. In addition, the Company
  features the original production, the Christmas Spectacular
  Starring the Radio City Rockettes, which has been a holiday
  tradition for more than 90 years. More information is
  available at www.msgentertainment.com.

  Who are we hiring?

  This position assists with overseeing the maintenance,
  repair, and capital improvement of all kitchen equipment,
  appliances, and related ancillary equipment within the
  venue’s kitchens, concessions, and related areas. The role
  also supports the maintenance of refrigeration systems
  throughout the building, including beer boxes, walk-in boxes
  and freezers, Traulsen units, and Perlick packs. The Manager
  will ensure the necessary preventive maintenance is
  performed on all assigned equipment to provide safe,
  sanitary, and reliable food and beverage operations for
  employees and guests, and will continue building out and
  revamping the PM program for that equipment.

  The Manager, Engineering will be one of the key management
  contacts in the engineering department during events,
  responding to equipment failures and service interruptions
  as they arise, and will serve as Manager on Duty on a
  recurring schedule. This position schedules and oversees
  project, repair, and emergency work; administers the CMMS;
  manages vendors and contractors; and directly supervises a
  staff of union mechanics and operating engineers. While food
  and beverage equipment is the primary focus of this role
  today, the position will also support capital projects and
  additional areas of responsibility as departmental needs and
  venue priorities continue to evolve.

  What will you do?

  - Oversee the maintenance, repair, and capital improvement of
    all kitchen equipment, appliances, and related ancillaries
    in the venue's kitchens, concessions, and related areas.
  - Maintain responsibility for the refrigeration systems
    throughout the building, including beer boxes, walk-in
    boxes and freezers, Traulsen units, and Perlick packs.
  - Continue building out and revamping the preventive
    maintenance program for all assigned equipment, including
    asset records, PM tasks, and PM schedules.
  - Manage the evaluation, procurement, and implementation of
    capital equipment, including scope development, vendor
    selection, and installation oversight.
  - Schedule and oversee project work, routine repairs, and
    emergency response for assigned equipment and systems,
    partnering with leadership across departments to
    operationalize impact and prioritize work around the event
    calendar.
  - Manage outside vendors and contractors, including scope,
    pricing, scheduling, quality of work, and warranty follow-
    up.
  - Serve as a key management contact during events as
    scheduled, responding to equipment failures and unforeseen
    critical situations.
  - Direct and support union trades and department staff
    assigned to food and beverage equipment work.
  - Track equipment condition and repair history to inform
    repair-versus-replace recommendations and capital
    planning.
  - Oversee departmental budgeting for repairs, service
    contracts, parts, and capital equipment for F&B
    appliances.
  - Maintain compliance with applicable health, sanitation,
    fire, and life safety requirements for assigned equipment
    and systems.
  - Manage FDNY rangehood inspections and ensure all kitchen
    equipment is up to FDNY and DOH standards
  - Assist the Engineering team and greater Building Operations
    department as needed on ancillary projects.
  - Manage refrigeration-related vendor and contractor work,
    including service calls, warranty work, and scheduled
    system overhauls; identify refrigeration equipment nearing
    end of life and support the evaluation, procurement, and
    implementation of replacement and capital equipment.
  - Take on additional responsibilities within the engineering
    department as the role and department needs evolve.
  - Provide exceptional experiences for our guests, partners,
    and team members, including by adhering to our appearance
    and presentation guidelines while on-site.



  What do you need to succeed?

  - Must have 5-7 years of experience as a building manager or
    engineer - operation and maintenance of large complex
    facility or arena/entertainment/theatrical building
    required.
  - Must have a strong technical background
  - Ability to read and interpret equipment manuals, schematics,
    and mechanical drawings.
  - Engineering degree is strongly preferred
  - Must have a strong working understanding of 120 v / 208 v /
    220 v systems/circuits
  - Familiarity with NYC Building and Fire codes
  - Must obtain the following certifications:
    - FDNY COFs: A35, C92, F01, F03, F60, G60, S12, S13, S14 and
      FLSD
    - CFC Universal Technician Certificate.
  - Ability to directly manage a staff of union mechanics, and
    operating engineers

  Special Requirements

  - Lifting 25 lbs., standing for long periods and walking long
    distances.
  - Ability to work a flexible schedule including nights,
    weekends, holiday, and split days off; willing to travel
    to other venues as needed.

  #LI- Onsite

  Pay Range

  $83,000—$135,000 USD

