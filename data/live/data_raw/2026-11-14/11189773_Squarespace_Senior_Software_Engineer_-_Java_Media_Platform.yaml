title: Senior Software Engineer - Java (Media Platform)
company: Squarespace
location: New York, USA
work_type: FULL_TIME
company_size: 1,723 Employees
description: |
  Squarespace is looking for a Senior Software Engineer to
  join the Media Platform team within the Platform Engineering
  group. The Media Platform team provides Squarespace
  engineers with a scalable, reliable, secure, and flexible
  platform for uploading, processing, managing, and serving
  media assets like images, video, and audio.

  You will report to the Engineering Team Manager of the Media
  Platforms team in our NYC office. This is a hybrid
  opportunity with three days in the office per week.

  You'll Get To…

  - Design systems and components within the Media Platform
  - Own complex projects end-to-end
  - Explore new technologies that are at the forefront of image,
    audio and video technologies – processing, compressing,
    storage, streaming, serving, etc.
  - Ensure the availability and reliability of systems essential
    to Squarespace users and businesses powered by Squarespace
  - Effectively collaborate and integrate with upstream and
    downstream teams
  - Contribute to design discussions and collaborate with
    engineering teams across the company to enhance platform
    solutions
  - Integrate with LLMs and GenAI technologies
  - Be a technical leader and mentor within the team
  - Participate in the team production on-call rotation

  Who We're Looking For

  - 6+ years of experience developing backend systems with Java
    and Spring in cloud environments (e.g. GCP) and
    microservices architecture.
  - An understanding of, and practical experience with, web
    application development. Strong in RESTful API
    development.
  - Collaboration with stakeholders and engineers to come up
    with the best solutions for the problems at hand.
  - Comfortable challenging established workflows with AI tools.
    Quick to adopt what works, and rigorous about customer
    data and safety while doing it.
  - Experience developing large-scale, fault tolerant,
    distributed systems. Familiarity with the behaviors of
    different transaction control and consistency models.
  - Experience with relational and/or NoSQL databases such as
    CockroachDB, MongoDB.
  - Experience working with cloud services and tools for
    storage, identity and access management, monitoring,
    analytics, messaging, and databases. Google Cloud Platform
    (GCP) experience is preferred, but equivalent experience
    in another cloud platform is also welcome.
  - Experience with media content management such as images,
    video, and audio. Familiar with media standards.
  - Experience with CDN technologies and caching architectures.

  Benefits & Perks

  - A choice between medical plans with an option for 100%
    covered premiums
  - Fertility and adoption benefits
  - Access to supplemental insurance plans for additional
    coverage
  - Headspace mindfulness app subscription
  - Global Employee Assistance Program
  - Retirement benefits with employer match
  - Flexible paid time off
  - 20 weeks for parental leave and up to 12 weeks to care for
    an ill family member
  - Pretax commuter benefit
  - Education reimbursement
  - Employee donation match to community organizations
  - 8 Global Employee Resource Groups (ERGs)
  - Dog-friendly workplace
  - Free lunch and snacks
  - Private rooftop
  - Hack week twice per year

  Cash Compensation Range: $128,500 – $207,000 USD

  The base salary for this position will vary based on job-
  related criteria including relevant skills, experience, and
  location, among other factors.

  In addition to the cash compensation above (which includes
  base salary and, where applicable for eligible roles, may
  include overtime pay), Squarespace employees are eligible to
  be granted an option to purchase our common stock. Sales
  positions generally offer a competitive On Target Earnings
  (OTE) incentive structure in addition to base salary.

  About Squarespace

  Squarespace is a design-driven platform helping
  entrepreneurs build brands and businesses online. We empower
  millions of customers in more than 200 countries and
  territories with all the tools they need to create an online
  presence, build an audience, monetize, and scale their
  business. Our suite of products range from websites,
  domains, ecommerce, and marketing tools, as well as tools
  for scheduling with Acuity and creating and managing social
  media presence with Bio Sites and Unfold. Our team of more
  than 1,500 is headquartered in bustling New York City, with
  offices in Dublin, Ireland, Aveiro, Portugal, and coworking
  spaces in the UK, Netherlands, and Australia. For more
  information about our company culture, visit
  www.squarespace.com/about/careers.

  Our Commitment

  Today, more than a million people around the globe use
  Squarespace to share different perspectives and experiences
  with the world. Not only do we embrace and celebrate the
  diversity of our customers, but we also work toward the same
  in our employees. At Squarespace, we are committed to equal
  employment opportunity regardless of race, color, ethnicity,
  ancestry, religion, national origin, gender, sex, gender
  identity or expression, sexual orientation, age,
  citizenship, marital or parental status, disability, veteran
  status, or other class protected by applicable law. We are
  proud to be an equal opportunity workplace.

