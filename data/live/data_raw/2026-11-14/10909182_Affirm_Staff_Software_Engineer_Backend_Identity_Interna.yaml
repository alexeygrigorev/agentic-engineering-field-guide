description: |
  At Affirm, we exist for the moments that matter—giving
  people a clear, predictable way to pay over time, with no
  hidden fees, no surprises, and no tradeoffs on what matters
  most.

  Identity at Affirm is mission-critical; it is the very first
  step of the customer journey and the foundation of global
  expansion. The International Expansion Unit (IEU) owns
  Identity for every market outside North America, placing our
  team at the center of Affirm’s global strategy. We are
  responsible for ensuring Affirm can enter and scale in new
  markets while operating compliantly across diverse
  regulatory environments.

  Our scope includes building and expanding Identity Data
  Management, KYC Verification, and Decisioning capabilities,
  while driving architectural changes that impact Identity
  services globally. We don’t just execute; we influence the
  core platform’s evolution to support new risk models and
  market dynamics. Operating at the intersection of technical
  depth and regulatory complexity, we directly impact approval
  rates, conversion, and fraud exposure. By joining this team,
  you will shape the foundational processes that unlock
  revenue and build customer trust on a global scale.

  What You'll Do · You will be responsible for setting
  technical strategy for your team on a year-long time scale,
  and help your team tie it together with critical, business-
  impacting projects. · You will collaborate across teams in
  the product development lifecycle by collaborating with
  product management, design & analytics to ensure technical
  sustainability, risks and trade-offs are well understood and
  managed. · You will act as a force-multiplier for your team
  through your definition and advocacy of technical solutions
  and operational processes. · You take ownership of your
  team’s operations and availability by ensuring you have the
  right monitoring, triage rotations, playbooks, polcities,
  testing and alerting in place to support “keep the lights
  on” & on-call efforts. · You will foster a culture of
  quality and ownership on your team by setting code review
  and design standards for your team, and advocating for them
  beyond your team through your writing and tech talks. · You
  will help develop talent on your team by providing feedback
  and guidance, and leading by example. What We Look For · You
  have 8+ years of experience designing, developing and
  launching backend systems at scale using languages like
  Python or Kotlin. · You have an extensive track record of
  developing highly available distributed systems using
  technologies like AWS, MySQL, Spark and Kubernetes. · You
  have experience delivering major features, system components
  or deprecating existing functionality in a system through
  the definition of a technical and execution plan. You write
  high quality code that is easily understood and used by
  others. · You thrive in ambiguity, and are comfortable
  moving from low level language idioms all the way to the
  architecture of large systems to understand how they work. ·
  Your growth and impact trajectory demonstrates that you have
  mastered gathering and iterating on feedback from your
  engineering and cross-functional peers. · You have strong
  verbal and written communication skills that support
  effective collaboration with our global engineering team.

  Pay Grade - P Equity Grade - 7 Employees new to Affirm
  typically come in at the start of the pay range. Affirm
  focuses on providing a simple and transparent pay structure
  which is based on a variety of factors, including location,
  experience and job-related skills. Base pay is part of a
  total compensation package that may include monthly stipends
  for health, wellness and tech spending, and benefits
  (including 100% subsidized medical coverage, dental and
  vision for you and your dependents). In addition, the
  employees may be eligible for equity rewards offered by
  Affirm Holdings, Inc. (parent company). GBR base pay range
  per year: £142,000 - £190,000

  Location - Remote UK #LI-Remote

  Remote-first with flexibility built in Affirm is proud to be
  a remote-first company. Most roles can be done from almost
  anywhere within the country of employment. Some positions
  may occasionally require in-person work at an Affirm office,
  and a few are office-based due to the nature of the work.
  All new hires will be invited to attend an in-person
  onboarding experience.

  Benefits designed for you Our benefits reflect our
  commitment to care, transparency, and flexibility. Here are
  a few highlights:

  - Health coverage at no cost: We cover 100% of premiums for
    employees and their dependents.
  - Spending stipends: Monthly stipends support your tech setup,
    and the ability to choose health and wellness options that
    are right for you.
  - Time off to recharge: Flexible time off and generous holiday
    calendars help you rest when you need to.
  - Own a piece of what you build: Our employee stock purchase
    plan (ESPP) lets you buy Affirm stock at a discount.

  We’re committed to providing an inclusive interview process,
  including accommodations for candidates with disabilities.
  If you need support, we’re happy to help.

  For positions based in San Francisco or Los Angeles: Affirm
  considers qualified applicants with arrest and conviction
  records, as required by law.

  By clicking "Submit Application," you acknowledge that you
  have read Affirm's Global Candidate Privacy Notice and
  consent to the use of your personal information as
  described.
