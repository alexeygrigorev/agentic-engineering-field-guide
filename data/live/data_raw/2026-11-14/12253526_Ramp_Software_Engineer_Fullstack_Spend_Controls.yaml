description: |
  About Ramp

  Ramp is building the smart infrastructure for finance teams,
  embedded in the transaction flow of every dollar a business
  spends. We automate how over $275B in annualized spend flows
  in and out of 85,000+ companies: authorizing payments,
  flagging risk, categorizing spend, and closing books.

  The problems are high-stakes, data-dense, and unforgiving.

  We hire people with high agency and high urgency. We look
  for slope over intercept. We care less about where you
  trained and more about what you’ve built. At Ramp, everyone
  is a builder who owns problems end to end and makes
  consequential decisions that shape the outcome.

  The median Ramp customer saves 7.5% and grows revenue 16% in
  their first year – far in excess of businesses operating
  without Ramp. We believe every ambitious company deserves
  the same.

  If you want to build systems that directly shape how
  companies move and manage billions, Ramp is the place to do
  it.

  About the Role

  Great spend controls help businesses move quickly without
  losing control of their money. Ramp’s Spend Controls team
  builds the core capabilities behind Ramp’s most critical
  primitives, like budgets and cards,helping customers put
  spending policies into practice and understand how their
  money is being deployed.

  We’re looking for a fullstack engineer to build and improve
  these experiences, from the interfaces admins use to
  configure controls to the backend logic that makes them work
  reliably. You’ll build and own new features end to end,
  simplify complex spending workflows, and improve the quality
  of products customers depend on every day.

  What You’ll Do

  - Build fullstack features to improve how customers manage the
    lifecycle of issued money, with clearer behavior and
    sensible defaults
  - Work with product, design, and engineering partners to turn
    customer needs into well-scoped features and deliver them
    from technical design through launch and iteration
  - Build better visibility into spend and utilization,
    including configurable restrictions and sensible buffers,
    so that users can spend money easily, while transactions
    that shouldn’t happen are declined properly
  - Contribute to on-call support, investigate production
    issues, and address recurring problems through testing and
    targeted quality improvements

  What You’ll Need

  - Experience building and shipping production features across
    frontend interfaces and backend services
  - The ability to own a feature end to end, break down the
    work, design key components, and follow through on
    delivery
  - Sound judgment about data correctness, reliability, and
    keeping complex product behavior understandable
  - A customer-focused approach to building software, with
    attention to usability and practical tradeoffs
  - Experience testing and debugging software, including
    investigating issues in production
  - Clear communication and a collaborative approach to working
    with product, design, and engineering teammates

