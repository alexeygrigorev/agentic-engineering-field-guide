description: |
  About the Role

  We’re seeking a Senior Full Stack Engineer to join our
  dynamic team in New York City or Austin, TX.You’ll play a
  key role in developing and enhancing our platforms,
  including our internal billing platform and OneVerify, our
  flagship customer-facing product.

  As a core contributor, you’ll own major parts of the product
  experience end-to-end, from backend architecture to front-
  end performance. You’ll work closely across teams to
  understand user feedback, iterate on ideas, and translate
  them into simple, high-impact solutions.

  We’re looking for someone who goes beyond just shipping
  features, someone who can independently solve problems,
  think critically about tradeoffs, and partner closely with
  product to shape what gets built, not just how it gets
  built.

  What You’ll Do

  - Design, build, and scale new features across the stack
    (Node.js, React, TypeScript)
  - Own the full lifecycle of projects, from concept and
    implementation to deployment and monitoring
  - Collaborate closely with product and design to iterate on
    ideas and deliver intuitive, high-impact user experiences
  - Solve complex technical and product problems with a focus on
    simplicity and scalability
  - Uphold engineering excellence through clean, testable, and
    reliable code
  - Lead and mentor teammates, contributing to architectural
    direction and continuous process improvements
  - Stay curious, bringing new tools and ideas that make our
    systems smarter and faster

  What We’re Looking For

  - 5+ years of full stack development experience, with strong
    backend and frontend expertise
  - Proficiency in Node.js, React, and TypeScript
  - Deep understanding of RESTful APIs, web services, and
    microservices architecture
  - Experience working on B2B products or supporting enterprise
    workflows
  - Ability to work independently, lead projects, and deliver
    results in a fast-paced environment
  - Strong collaboration skills and a team-oriented mindset
  - Bachelor’s or Master’s degree in Computer Science, Software
    Engineering, or a related field
  - Candidates must currently reside in the NYC metro area or
    the Austin metro area

  Preferred Qualifications

  - Previous Tech Lead experience or proven ability to translate
    user feedback into successful technical solutions
  - Startup experience and a strong product mindset
  - Healthcare experience is a plus, but not required
  - Passion for mental health, healthcare, or fintech innovation

  How We Support You

  - Medical, dental, vision, and 401(k)
  - Hybrid, dog-friendly NYC office (3 days a week)
  - Unlimited PTO
  - $1000 per year Mental Health Wellness Benefit
  - Equity compensation packages
  - Stocked office kitchen
  - Remote home office support
  - Collaborative, open-door culture

  Compensation:

  $160K–$210K base salary + equity, depending on experience

  Additional Information:

  Location Requirement: This role is based in New York City or
  Austin, TX. Candidates must currently reside in either the
  NYC metro area or the Austin metro area. This is a hybrid
  role (3 days/week in-office) for NY, and we are unable to
  offer relocation assistance at this time.

  We are unable to offer visa sponsorship.
