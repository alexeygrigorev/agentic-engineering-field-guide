description: |
  About 11x

  Most of what GTM teams do all day isn't selling. It's
  monotonous work like research, list-building, follow-ups,
  and data entry - things that should never have been a human
  job in the first place.

  We help teams accelerate growth by automating the busywork
  of GTM. With 11x teams can focus on what they do best:
  building relationships and closing deals.

  Backed by $75M+ from a16z and Benchmark, headquartered in
  San Francisco, and trusted by leading teams at Checkr,
  Xerox, Rillet, and much more. We're hiring ambitious people
  who want to define how the next generation of companies
  accelerate growth.

  About the Role

  We’re looking for a product-minded fullstack engineer to
  build the core experiences that power our AI agents. You’ll
  work across the stack, from user-facing product experiences
  to the systems that orchestrate and deploy autonomous
  agents, partnering closely with Product, Design, and
  AI/Engineering.

  This role can be remote, but you’ll need to work close to
  Pacific Time (PT) hours to ensure close collaboration with
  the engineering team.

  What You'll Do

  - Design, build, and iterate on fullstack systems that power
    AI agents from concept to deployment.
  - Research and evaluate new approaches to agent orchestration,
    prompting strategies, and model alignment.
  - Collaborate with product, design, and engineering teams to
    improve UX and usability for non-technical users.
  - Share learnings, document findings, and contribute to the
    evolution of internal best practices.
  - Participate in peer reviews, brainstorming sessions, and
    technical deep dives with our global team.

  Ideal Candidates Have

  - 3+ years of experience in a product-oriented software
    engineering role.
  - A strong foundation in Typescript, React, NextJS, and
    NodeJS.
  - Experience working in fast-paced environments with a track
    record of rapid learning and iteration.
  - Interest in research, technical writing, or contributing to
    knowledge-sharing within a team.
  - Bonus: experience with large language models, prompt
    engineering, or AI infrastructure.

  11x is an equal opportunity employer and does not
  discriminate on the basis of race, gender, sexual
  orientation, gender identity/expression, national origin,
  disability, age, genetic information, veteran status,
  marital status, pregnancy or related condition, or any other
  basis protected by law.
