description: |
  LM Studio is used by millions of people around the world to
  run AI on their own computers, and now with Bionic - also in
  the cloud. Our values prioritize putting the human in the
  center, and creating tools that we want to use ourselves,
  and recommend to our friends and family.

  As a team, we work with high technical intensity and
  personal responsibility. We are looking for curious, self-
  motivated, creative, and technically excellent teammates to
  join us and build the future of human-AI interactions in
  software.

  The Role

  We are looking for a Full Stack Software Engineer with broad
  experience and deep technical fundamentals. You will work
  across our web platforms, API backend, SDK, and desktop app.
  On a given project, you might build a React interface,
  design the API and data model behind it, debug network
  behavior between the app and a service, and determine how
  the system should operate under real load.

  You should understand the systems beneath your code:
  browsers and servers, databases and transactions, HTTP and
  TCP, concurrency and failure, and the constraints of
  serverless execution. You should be comfortable moving down
  the stack when necessary without losing sight of the
  finished product.

  Qualifications

  - Significant experience building and operating production
    software across frontend and backend systems
  - Excellent TypeScript and React fundamentals
  - Strong understanding of APIs, SQL, relational databases, and
    data modeling
  - Solid networking fundamentals, including TCP, HTTP,
    WebSockets, and streaming
  - Understands how systems scale and the tradeoffs involved in
    serverless and distributed environments
  - Able to investigate problems across the client, network,
    service, and database layers
  - Takes personal responsibility for the quality, reliability,
    and performance of their work
  - Deep interest in AI, developer tools, and open-weight models

  Responsibilities

  - Build features across LM Studio's web platforms, API
    backend, SDK, and desktop app
  - Design user experiences together with the services, data
    models, and protocols that support them
  - Build systems that remain fast and reliable as usage grows
  - Diagnose and fix problems wherever they occur in the stack
  - Make technical decisions, explain the tradeoffs, and remain
    responsible for the result

  Benefits

  - Competitive salary and equity grants
  - Great medical, vision, dental healthcare plans
  - Catered team lunch / expensed dinners in the office
  - Flexible PTO
  - Flexible WFH
  - Sun-drenched office in SoHo in NYC
