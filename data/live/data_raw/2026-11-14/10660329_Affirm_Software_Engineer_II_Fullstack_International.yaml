description: |
  At Affirm, we exist for the moments that matter—giving
  people a clear, predictable way to pay over time, with no
  hidden fees, no surprises, and no tradeoffs on what matters
  most.

  The International Accelerator Engineering team is growing,
  and we're looking for a Software Engineer to join us! We're
  a full-stack team located entirely in Europe within the same
  time zone, but culturally rooted in Silicon Valley. We
  directly improve the financial lives of over 20 million
  people shaping how Affirm builds Direct-to-Consumer products
  for Canada, the UK, and future international markets. We
  build and own various products used by our consumers, like
  the Affirm App and other Direct to Consumer products across
  international markets. We are here to make sure we reach and
  provide useful tools to our users so they can experience
  honest financial products at their fullest.

  Our work is agile and fast-paced, shipping new code to
  production for millions to use across geographies and
  rigorously measuring the impact it has on them. This role
  rewards curiosity, ownership, ability to zoom in and out,
  switch contexts often, also in an open contribution model,
  and a builder's mindset. You'll know exactly what your
  objectives are, you'll have what you need to hit them, and
  you'll choose your own path to get there, while constantly
  looking for ways to get AI to increase productivity on a
  daily basis. You'll learn quickly from experienced teammates
  and grow your craft on problems that matter at scale.

  If you want to build something new and operate it at scale –
  come join us!

  What You'll Do: · With the support of your team’s tech lead
  and manager, you will break down larger projects into
  individual tasks, deliver them in multiple phases, and
  collaborate with others to ensure timely delivery of your
  work. · You will support your peers and stakeholders in the
  product development lifecycle by collaborating with product
  management, design & analytics by participating in ideation,
  articulating technical constraints, and partnering on
  decisions that properly consider risks and trade-offs. · You
  will support the operations and availability of your team’s
  artifacts by creating and monitoring metrics, escalating
  when needed, and supporting “keep the lights on” & on-call
  efforts. · You will contribute to a sense of community on
  your team by engaging in growth and development activities
  such as participation in the interview process. What We Look
  For: · You have a total of 1.5+ years of experience as a
  software engineer. · You have experience shipping web apps
  using declarative UI frameworks like React or Vue. · You
  have experience designing, developing and launching APIs at
  scale using languages like Python or Kotlin. · You have
  mastered taking a simple problem or business scenario into a
  solution that interacts with multiple software components,
  and executing on it by writing clear, easily understood,
  well tested and extensible code. · You are comfortable
  navigating a large code base, debugging others' code, and
  providing feedback to other engineers through code reviews.
  · Your experience demonstrates that you take ownership of
  your growth, proactively seeking feedback from your team,
  your manager, and your stakeholders. · You have strong
  verbal and written communication skills that support
  effective collaboration with our global engineering team.

  Compensation & Benefits

  Base Pay Grade - L

  Equity Grade - 4

  Employees new to Affirm typically come in at the start of
  the pay range. Affirm focuses on providing a simple and
  transparent pay structure which is based on a variety of
  factors, including location, experience and job-related
  skills.

  Base pay is part of a total compensation package that may
  include equity rewards, monthly stipends for health,
  wellness and tech spending, and benefits (including 100%
  subsidised medical coverage, dental and vision for you and
  your dependents.)

  Base pay range per year: £101,000 - £149,000

  Location: UK Remote

   #LI-Remote

  Remote-first with flexibility built in Affirm is proud to be
  a remote-first company. Most roles can be done from almost
  anywhere within the country of employment. Some positions
  may occasionally require in-person work at an Affirm office,
  and a few are office-based due to the nature of the work.
  All new hires will be invited to attend an in-person
  onboarding experience.

  Benefits designed for you Our benefits reflect our
  commitment to care, transparency, and flexibility. Here are
  a few highlights:

  - Health coverage at no cost: We cover 100% of premiums for
    employees and their dependents.
  - Spending stipends: Monthly stipends support your tech setup,
    and the ability to choose health and wellness options that
    are right for you.
  - Time off to recharge: Flexible time off and generous holiday
    calendars help you rest when you need to.
  - Own a piece of what you build: Our employee stock purchase
    plan (ESPP) lets you buy Affirm stock at a discount.

  We’re committed to providing an inclusive interview process,
  including accommodations for candidates with disabilities.
  If you need support, we’re happy to help.

  For positions based in San Francisco or Los Angeles: Affirm
  considers qualified applicants with arrest and conviction
  records, as required by law.

  By clicking "Submit Application," you acknowledge that you
  have read Affirm's Global Candidate Privacy Notice and
  consent to the use of your personal information as
  described.
