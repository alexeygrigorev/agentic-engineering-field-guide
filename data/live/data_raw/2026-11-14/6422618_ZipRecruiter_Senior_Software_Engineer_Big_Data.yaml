description: |
  We offer a hybrid work environment. Most US-based positions
  can also be performed remotely (any exceptions will be noted
  in the Minimum Qualifications below.)

  Our Mission:

  To actively connect people to their next great opportunity.

  Who We Are:

  ZipRecruiter is a leading online employment marketplace.
  Powered by AI-driven smart matching technology, the company
  actively connects millions of all-sized businesses and job
  seekers through innovative mobile, web, and email services,
  as well as through partnerships with the best job boards on
  the web. ZipRecruiter has the #1 rated job search app on iOS
  & Android.

  Summary:

  Our team has a unique opportunity to work on applications
  and data at scale, serving millions of jobseekers and tens
  of thousands of customers. We’re working on building an
  efficient marketplace of jobseekers and employers and need
  senior data engineers to build fast, scalable, and effective
  applications, stream and batch data processing, ML
  infrastructure and a variety of other systems all to help
  connect people to their next job. We provide an essential
  service and have a thriving business as a result.

  Our stack is complex and we’re looking for engineers who
  know how to write evolvable, properly instrumented, and
  efficient code as part of a growing distributed system.
  We’re working on data driven systems and applications and
  need people who can build fast services and processes to
  power all of the intelligence we use to help change people’s
  lives.

  Responsibilities:

  - Build data processing and exploration pipelines along with
    ML infrastructure to power our intelligence
  - Deploy a range of cloud-based technologies for critical
    projects
  - Write, test, instrument, and deploy code to our Kubernetes
    environment
  - Help drive the innovation and evolution of ZipRecruiter

  Minimum Qualifications:

  - 5+ years of professional software development experience
    with a focus on Python and big data technologies
  - Experience with Spark, Kafka, Hadoop, Hive, and/or other big
    data technologies
  - Comprehensive computer science fundamentals in coding,
    object-oriented programming, data structures, and
    algorithms
  - Experience with containerization technologies like Docker
    and/or Kubernetes

  Preferred Qualifications:

  - 8+ years of professional software development experience,
    with a focus on Python and big data technologies
  - BS/MS/PhD in Mathematics, Computer Science, Physics, related
    technical field or equivalent practical experience
  - Experience with data integration tools like Apache Kafka,
    Flume, and NiFi
  - Familiarity with data storage technologies such as Delta
    Lake, HBase, Cassandra, and MongoDB
  - Familiarity with Apache Hudi, Apache Beam, Apache Flink,
    Google Cloud Dataflow, Amazon Kinesis Data Analytics,
    and/or Azure Databricks

  As part of our team you’ll enjoy:

  - Competitive compensation
  - Exceptional benefits package
  - Flexible Vacation & Paid Time Off
  - Employer-matched 401(k) plan

  The US base salary range for this full-time position is
  $170,000-$240,000. Our salary ranges are determined by role,
  level, and location, and the range displayed on each job
  posting reflects the minimum and maximum target for new hire
  salaries for the position across all US locations. Within
  the range, individual pay is determined by work location,
  role-related knowledge and skills, depth of experience,
  relevant education or training, and additional role-related
  considerations.

  Depending on the position offered, equity, bonuses,
  commission, or other forms of compensation may also be
  provided as part of a total compensation package, in
  addition to a full range of medical, financial, and other
  benefits.

