description: |
  About Lyra Health

  Lyra Health is a leading provider of evidence-based mental
  health care, serving more than 20 million people globally in
  partnership with employers and more than 100 million through
  health plan and partner relationships. The company has
  delivered more than 15 million sessions of mental health
  care, published more than 35 peer-reviewed studies, and
  delivered unmatched outcomes in terms of access, clinical
  effectiveness, and cost efficiency. Extensive peer-reviewed
  research confirms Lyra’s transformative care model helps
  people recover twice as fast and results in a 26% annual
  reduction in overall healthcare claims costs. Lyra is
  transforming access to life-changing mental health care
  through Lyra Empower, the only fully integrated, AI-powered
  platform combining the highest-quality care and technology
  solutions.

  About the Role:

  We are looking for a strategic leader to spearhead the
  execution of Lyra's machine learning roadmap. In this
  capacity, you will scale and mentor a high-impact AI/ML
  engineering team, ensuring our technical vision translates
  into production-grade systems that operate with clinical
  precision and high-availability reliability.

  The ideal candidate is an experienced engineering manager
  who excels at balancing long-term technical strategy with
  hands-on people leadership. You possess a deep passion for
  developing technical talent, building robust cross-
  functional partnerships, and cultivating a culture of
  operational excellence within an AI-driven organization.

  Why Lyra?

  - Collaborative Innovation: Thrive on working alongside
    brilliant colleagues to solve complex, mission-critical
    challenges.
  - Social Impact: Are deeply motivated by making a tangible
    difference and supporting individuals during their most
    vulnerable moments.
  - Cross-Functional Partnership: Enjoy collaborating with a
    diverse group of physicians, therapists, data scientists,
    and product leaders.

