description: |
  The Opportunity As a Forward Deployed Software Engineering -
  Senior Manager, you will lead the development of innovative
  software solutions that drive digital transformation and
  enhance business performance. Within our Tax practice, you
  will leverage your skills and experience to deliver quality
  results, motivating and coaching teams to solve complex
  problems. You will apply sound judgment, recognizing when to
  take action and when to escalate, while fostering a diverse
  and inclusive environment that contributes to the success of
  our firm. In this role at PwC, you will craft and convey
  clear, impactful messages that tell a holistic story,
  applying systems thinking to identify underlying problems
  and opportunities. You will validate outcomes with clients,
  share alternative perspectives, and act on client feedback.
  Your ability to direct teams through complexity, demonstrate
  composure in challenging situations, and initiate open
  coaching conversations will be key to resolving issues and
  enhancing team effectiveness. This position offers the
  chance to deepen your skills, evolve your expertise, and
  model professional standards, all while driving results and
  maintaining operational excellence. Responsibilities
  - Leading the development and deployment of innovative
    software solutions to drive digital transformation
  - Managing software engineering projects, confirming alignment
    with client needs and business objectives
  - Designing, coding, and testing applications to deliver
    exceptional user experiences
  - Utilizing advanced programming languages such as Python and
    JavaScript to enhance software functionality
  - Overseeing application development and lifecycle management
    to optimize performance and reliability
  - Implementing continuous integration and delivery (CI/CD)
    practices to streamline software releases
  - Conducting code reviews and quality assurance testing to
    maintain coding standards
  - Collaborating with cross-functional teams to analyze
    business requirements and develop tailored solutions
  - Applying systems thinking to identify and address underlying
    problems and opportunities
  - Coaching and mentoring team members to foster a culture of
    innovation and continuous improvement
  - Engaging with clients to validate outcomes and incorporate
    feedback into project enhancements
  - Directing teams through complex and ambiguous situations,
    maintaining composure and focus
  - Promoting the use of enterprise application architecture and
    integration for scalable solutions
  - Driving business process improvement initiatives to enhance
    operational efficiency and effectiveness
  What You Must Have
  - At least a Bachelor's degree
  - At least 6 years of experience
  What Sets You Apart
  - Excelling in API Management and Application Development
  - Demonstrating proficiency in Continuous
    Integration/Continuous Delivery (CI/CD)
  - Utilizing strategic questioning to drive business process
    improvement
  - Applying analytical thinking to enhance software project
    management
  - Innovating enterprise application architecture solutions
  - Leading teams through complex software troubleshooting
    scenarios
  - Developing inclusive and diverse high-performing teams
  The salary range for this position is: $124,000 - $335,000.
