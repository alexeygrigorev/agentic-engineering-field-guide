description: |
  About Gifted Savings

  Gifted Savings is the first national nonprofit to combine
  the gifting of real-world investment assets—a diversified
  $1,000 portfolio of stocks, bonds, Bitcoin, and a CD—with
  real-world financial education for every participating high
  school senior. The model is designed to give students both
  skin in the game and a practical understanding of investing
  and long-term wealth creation. Through a next-generation web
  app, students track their portfolio and complete financial
  literacy lessons tied directly to what they own. When they
  turn 18 and complete the program, their investment portfolio
  is transferred to them to use as they choose.

  Founded by serial entrepreneur Farhad Mohit — whose
  ventures, including Flipagram (now TikTok), Shopzilla, and
  BizRate have generated more than $1 billion in exits —
  Gifted Savings is powered by a bold philanthropic model in
  which a committed group of patrons covers all operating
  expenses. This ensures that 100% of every donor’s gift goes
  directly to funding student investment accounts and
  expanding long-term opportunities for graduates nationwide.

  Gifted Savings has been featured on the main stage at
  TEDNext and recognized by the Anthem Awards and Fast
  Company’s Innovation by Design Awards for its innovative
  approach to financial education and youth empowerment.

  What you’ll do:

  - Web application development from design to fully deployed
    product that functions seamlessly across desktop and
    mobile web platforms.
  - Translate product requirements and designs into high-
    quality, working software for users on our web-based
    platform.
  - Ship server-side flows where money and account state have to
    stay correct: charging, funding, bank linking, and account
    opening, including failure and retry paths
  - Collaborate with our lean, agile team working directly with
    product, design, and QA teams.
  - Report directly to the CTO, contributing to strategic
    decisions and the overall direction of our technology
    stack.

  Who we’re looking for:

  - 8+ years of professional software engineering experience,
    with significant backend ownership in production systems.
  - Strong proficiency in TypeScript across modern frontend and
    backend stacks, including Next.js, Node.js, and relational
    databases such as PostgreSQL with a typed ORM.
  - You lead by example with AI-native development, coding with
    Claude Code, Cursor, MCPs, and orchestrating agents.
  - You’re tuned into the latest news and releases of AI tools
    and technical functionality. You try new things to figure
    out how they can be useful.
  - Advanced technical and analytical skills to diagnose,
    isolate, and resolve problems.
  - Strong communication skills and the ability to work well
    with others in a collaborative environment.
  - Ability to act as a technical lead on product features or
    initiatives.
  - Background in fintech, investment platforms, or financial
    technology — especially experience with payments,
    compliance, secure financial workflows, or
    donor/fundraising tools.

  Bonus if:

  - Experience with TypeScript, NestJS, Next.js, NodeJS, Prisma
    ORM or TailwindCSS
  - Built entire applications from the ground up from designs to
    scaled production deployments.

  Why You Should Join Us

  - Impact: Work on something that will radically advance
    financial inclusion — and philanthropy — in America and
    beyond.
  - Amazing Culture: Join a high-performing team whose shared
    values are: Big Dreams and Bold Action, Results and
    Learning, Generosity and Teamwork, Honesty and
    Authenticity, and Freedom and Responsibility.
  - Small Team: Join as an early team member, shaping an idea
    that can change the world for good.
  - Full Benefits: Get 100% coverage of health, dental, and
    vision benefits for you and your dependents.
  - Bonus Program: Earn our innovative Bitcoin-denominated
    deferred bonus plan, allowing you to have the amazing
    upside of being in a startup while working on a truly
    meaningful non-profit mission.
  - Unlimited PTO: We have a flexible time-off (sick and
    vacation) policy to make sure we’re always taking care of
    ourselves, so we can help others.
  - Flexibility: Enjoy the freedom of a remote work environment,
    with occasional travel to connect with team members and
    participate in impactful program events.
  - Retirement Plan: Plan for your future with access to a
    403(b) plan that’s simple to manage.
  - Growth: Thrive within a growing organization that
    prioritizes innovation, offering you the chance to shape
    your career while advancing financial education.

  Other Important Information

  This is a full-time, remote leadership role based in the
  United States, with occasional travel for team meetings and
  program-related events.

  Compensation for this role is expected to be in the range of
  $170,000 - $200,000, with final salary determined based on
  experience, skills, and organizational needs. Gifted Savings
  reserves the right to modify this range at any time.

  We are not considering candidates currently based outside of
  the United States, and we are unable to provide visa
  sponsorship at this time.

  To Apply

  Please submit:

  - Your resume

  Equal Opportunity Employer Statement

  Gifted Savings is an equal opportunity employer. We are
  committed to creating an inclusive and diverse workplace
  where all employees feel valued, respected, and supported.
  We do not discriminate on the basis of race, color,
  religion, sex, sexual orientation, gender identity or
  expression, national origin, age, disability, veteran
  status, marital status, or any other characteristic
  protected by applicable law. We encourage applications from
  individuals of all backgrounds, experiences, and
  perspectives to contribute to our mission of advancing
  financial inclusion and education for all.
