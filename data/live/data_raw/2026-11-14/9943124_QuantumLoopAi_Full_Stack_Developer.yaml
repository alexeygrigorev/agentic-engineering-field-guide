description: |
  ABOUT QUANTUMLOOPAI

  QuantumLoopAI is transforming how patients access NHS
  primary care. Our AI-powered reception system, EMMA, serves
  millions of NHS patients, helping GP surgeries manage
  demand, reduce phone queues, and ensure patients get the
  right care at the right time. Backed by leading healthcare
  investors and working with NHS practices across England, we
  are building the future of primary care access. As we
  prepare for our Series A and expand our team, we are looking
  for exceptional people who want to make a genuine difference
  to the NHS.

  ABOUT THE ROLE

  We are looking for a Full Stack Developer to join our
  engineering team at our Canary Wharf headquarters. You will
  work across the entire application stack, building and
  scaling the products that power EMMA and the tools our NHS
  customers rely on every day. This is not a maintenance role.
  You will ship features end to end, make meaningful
  architectural decisions, and see your work improve patient
  access for millions of people. You will be surrounded by a
  team that moves fast, cares deeply about quality, and
  understands that the code we write has real consequences for
  patients and practices. If you want genuine ownership in a
  healthtech company where engineering is central to the
  mission, this is the role.

  WHAT YOU'LL DO

  - Build, test, and deploy features across the full stack, from
    frontend interfaces to backend services and APIs

  - Own features end to end, from technical scoping and
    architecture through to production release and monitoring

  - Collaborate closely with product, clinical, and commercial
    teams to translate NHS user needs into reliable, scalable
    software

  - Develop and maintain integrations with NHS clinical systems
    and third-party platforms

  - Write clean, well-tested, maintainable code and contribute
    to code reviews that raise the bar for the whole team

  - Identify and resolve performance bottlenecks, ensuring our
    platform remains fast and reliable under high demand

  - Contribute to technical decisions around architecture,
    tooling, and engineering best practices as the team grows

  - Participate in incident response and on-call rotations to
    support platform reliability

  Requirements

  ESSENTIAL

  - 3+ years of professional experience as a full stack
    developer working on production web applications

  - Strong proficiency in at least one modern frontend framework
    and one backend language or framework

  - Experience designing and consuming RESTful APIs or GraphQL
    endpoints

  - Solid understanding of relational databases and data
    modelling, with experience writing performant queries

  - Familiarity with cloud infrastructure and deployment
    pipelines (CI/CD)

  - Experience with version control using Git and collaborative
    development workflows

  - Strong debugging and problem-solving skills with the ability
    to diagnose issues across the full stack

  - Excellent communication skills and a collaborative working
    style

  - The right to work in the UK (we are unable to offer visa
    sponsorship for this role)

  DESIRABLE

  - Experience working in healthcare, healthtech, or regulated
    industries

  - Familiarity with telephony or voice AI systems

  - Experience building integrations with third-party APIs and
    external platforms

  - Understanding of NHS digital systems, DTAC compliance, or
    healthcare data standards (HL7, FHIR)

  - Experience with real-time communication systems (WebSockets,
    event-driven architecture)

  - Familiarity with containerisation and orchestration tools

  - Experience working in an early-stage startup where you
    helped define engineering processes and standards

  - Contributions to open-source projects

  LOGISTICS

  - Education: We value skills and experience over formal
    qualifications

  - Working arrangements: Office-based at our Canary Wharf,
    London headquarters, five days per week

  - Visa sponsorship: We are unable to offer visa sponsorship
    for this role

  - Start date: Flexible

  Benefits

  WHAT WE OFFER

  - Competitive package depending on experience

  - Potential share options

  - Professional development including conference attendance and
    CPD support

  - The opportunity to shape the future of NHS primary care at
    one of the UK's fastest-growing healthtech companies

  - A modern office in Canary Wharf with excellent transport
    links

  - A small, high-output engineering team where your work ships
    fast and matters immediately

  HOW WE'RE DIFFERENT

  At QuantumLoopAI, you will join a team that is genuinely
  improving NHS primary care. We move fast, take ownership,
  and celebrate wins together. Our culture values:

  - Impact over optics. We measure success by patient outcomes,
    not busy work

  - Transparency. Open communication, honest feedback, shared
    context

  - Ownership. You will have real autonomy to shape your work
    and our product

  - Learning. We are building something new, and we learn from
    every experiment

  DIVERSITY AND INCLUSION

  We believe diverse teams build better products. We welcome
  applications from candidates of all backgrounds, and we are
  committed to creating an inclusive environment where
  everyone can do their best work. If you are excited about
  this role but do not meet every requirement, we would still
  love to hear from you.

  RECRUITMENT SAFETY NOTICE

  QuantumLoopAI will never ask candidates for payment or
  sensitive financial information during the recruitment
  process. All official communications come from
  @quantumloopai.com email addresses.

  COME WORK WITH US

  Ready to help transform NHS primary care? We would love to
  hear from you. Questions about this role? Contact
  careers@quantumloopai.com
