description: |
  Crane Worldwide Logistics is a leader in supply chain
  solutions with over 130 locations across 30 countries
  providing individual services that address our client's
  logistics challenges.

  The Senior Solutions Engineering Manager – EMEIA is
  responsible for leading the engineering and technical
  solutions function in support of new business development,
  strategic customer opportunities, and operational excellence
  across the EMEIA region.

  The role is responsible for developing innovative, cost-
  effective, and scalable warehouse and supply chain solutions
  that support business growth, improve operational
  performance, and enhance customer value. Working closely
  with Commercial, Operations, Business Development, Finance,
  Procurement, and customers, the Senior Solutions Engineering
  Manager will lead the design, implementation, and continuous
  improvement of Contract Logistics solutions across multiple
  countries.

  ESSENTIAL JOB FUNCTIONS

  Solutions Design & Business Development

  - Lead the engineering design process for strategic Contract
    Logistics opportunities across EMEIA.
  - Analyse customer operational data to develop innovative and
    commercially competitive logistics solutions.
  - Design warehouse layouts, operational workflows, and
    material handling solutions.
  - Produce conceptual layouts, process flow diagrams, warehouse
    profiles, labour models, and storage strategies.
  - Develop resource models and operational costing to support
    pricing submissions.
  - Prepare technical content for customer proposals,
    presentations, and solution documentation.
  - Support commercial teams during customer presentations,
    workshops, and solution reviews.
  - Ensure all proposed solutions align with customer
    requirements and Crane operational standards.

  Request for Proposal (RFP) Support

  - Analyse customer operational data to support solution
    development.
  - Deliver engineered labour and resource requirements to
    support pricing models.
  - Produce technical solution documentation for inclusion in
    written client proposals.
  - Develop conceptual warehouse layouts using AutoCAD.
  - Create material flow diagrams, inventory profiling, and
    order analytics.
  - Prepare budgetary estimates for warehouse equipment and
    automation solutions.
  - Support tender responses from initial qualification through
    contract award.

  Operational Engineering & Continuous Improvement

  - Evaluate operational performance across existing Contract
    Logistics sites.
  - Identify opportunities to improve productivity, efficiency,
    quality, safety, and customer service.
  - Develop engineered solutions to optimise warehouse layouts,
    storage capacity, inventory flow, and labour utilisation.
  - Implement continuous improvement initiatives using Lean
    methodologies and operational best practice.
  - Support network optimisation projects across EMEIA.
  - Develop standard engineering methodologies and best
    practices.

  Automation & Technology

  - Evaluate automation opportunities within existing and new
    operations.
  - Develop business cases, financial analysis, and return on
    investment (ROI) calculations for automation projects.
  - Recommend appropriate warehouse technologies including:
  - Support procurement and vendor selection processes.
  - Manage implementation of approved automation projects.

  Project Management

  - Lead engineering workstreams for new customer
    implementations.
  - Develop implementation plans, timelines, and project
    deliverables.
  - Coordinate cross-functional project teams across multiple
    countries.
  - Monitor project progress, risks, budgets, and deliverables.
  - Ensure engineering projects are delivered on time and within
    budget.

  Leadership

  - Lead and develop the regional Solutions Engineering team.
  - Allocate engineering resources across regional projects.
  - Coach and mentor engineering professionals.
  - Promote collaboration between Commercial, Operations,
    Procurement, Finance, and IT.
  - Drive a culture of innovation, continuous improvement, and
    customer focus.

  KEY RESPONSIBILITIES

  - Lead engineering support for strategic Contract Logistics
    opportunities throughout EMEIA.
  - Develop innovative warehouse and automation solutions.
  - Support regional business development and customer
    retention.
  - Deliver technically robust and commercially competitive
    engineering solutions.
  - Improve operational efficiency through engineering
    excellence.
  - Lead regional engineering projects and implementations.
  - Develop engineering standards across the region.
  - Build strong relationships with customers, suppliers, and
    internal stakeholders.
  - Support operational excellence initiatives across Contract
    Logistics.



  KNOWLEDGE, SKILLS & EXPERIENCE

  Essential

  - Bachelor's Degree in Engineering, Logistics, Supply Chain
    Management, Business or related discipline.
  - Master's Degree desirable.
  - Minimum 15 years' experience in industrial engineering,
    warehouse design, supply chain management, or Contract
    Logistics.
  - Extensive experience within Third-Party Logistics (3PL),
    retail distribution, manufacturing, e-commerce or consumer
    goods.
  - Demonstrated experience designing warehouse layouts and
    operational workflows.
  - Strong experience developing engineered labour standards and
    labour models.
  - Extensive experience using AutoCAD.
  - Experience with Warehouse Management Systems (WMS).
  - Strong understanding of warehouse automation technologies.
  - Experience developing business cases, Total Cost of
    Ownership (TCO), and Return on Investment (ROI) analysis.
  - Strong analytical and problem-solving skills.
  - Excellent presentation and customer-facing communication
    skills.
  - Advanced Microsoft Excel, PowerPoint, Power BI, Visio, SQL,
    SmartSheet and Access skills.
  - Proven project management experience across complex regional
    projects.
  - Strong commercial awareness and financial acumen.
  - Ability to work across multiple countries and cultures.

  Desirable

  - Lean Six Sigma Green Belt or Black Belt.
  - Prince2, PMP or equivalent Project Management qualification.
  - Experience implementing warehouse automation projects
    internationally.
  - Experience with simulation and warehouse modelling software.
  - Experience supporting multinational logistics operations.
  - Knowledge of regional logistics regulations and compliance
    requirements.



  CORE COMPETENCIES

  - Leadership
  - Customer Focus
  - Strategic Thinking
  - Commercial Awareness
  - Engineering Excellence
  - Innovation
  - Analytical Thinking
  - Project Management
  - Problem Solving
  - Collaboration
  - Communication
  - Continuous Improvement
  - Decision Making
  - Planning & Organisation
  - Stakeholder Management



  KEY PERFORMANCE INDICATORS (KPIs)

  - Win rate of engineering-supported proposals.
  - Accuracy of engineering cost models.
  - Timely delivery of engineering support for customer
    opportunities.
  - Project implementation performance (cost, quality,
    schedule).
  - Customer satisfaction during solution design and
    implementation.
  - Productivity improvements delivered across Contract
    Logistics operations.
  - ROI achieved on automation investments.
  - Continuous improvement initiatives implemented.
  - Engineering team development and capability growth.

  DECISION MAKING

  The Senior Solutions Engineering Manager is responsible for
  making technical and engineering decisions relating to
  warehouse design, operational efficiency, automation
  solutions, and customer proposals. The role exercises
  significant judgement in evaluating commercial
  opportunities, balancing operational requirements with
  financial objectives, and recommending engineering solutions
  that support regional business growth. Strategic decisions
  with significant financial or operational impact are made in
  conjunction with senior leadership.

  CONFIDENTIALITY

  This role has access to commercially sensitive customer
  information, pricing models, engineering designs, business
  development strategies, and operational data. The post
  holder must maintain the highest levels of confidentiality
  and comply with all company policies relating to data
  protection, information security, and confidentiality.

  EQUAL OPPORTUNITY EMPLOYER

  Crane Worldwide Logistics is an Equal Opportunity Employer
  and is committed to creating an inclusive workplace where
  all employees and applicants are treated with dignity,
  fairness, and respect.

  Employment decisions are made without regard to race,
  colour, religion, creed, sex, gender, gender identity or
  expression, sexual orientation, age, national origin,
  ancestry, disability, marital or civil partnership status,
  pregnancy or maternity, veteran status, genetic information,
  or any other characteristic protected by applicable local
  law.

  We are committed to providing equal opportunities in
  recruitment, training, career development, promotion,
