description: |
  The Role

  We’re looking for Software Engineers to help architect,
  build, and productize our AI/ML infrastructure. You'll be
  the bridge between research, product, customers, and
  engineering, driving AI adoption from strategy through
  production at scale.

  This role is ideal for someone who thrives in early-stage
  environments, enjoys owning things end to end, and wants
  their work to have a measurable impact on an industry that
  desperately needs modern infrastructure.



  What You’ll Do

  System Architecture & Design

  - Design and evolve a modular, service-oriented architecture
    to power configurable healthcare workflows at scale.
  - Build a workflow orchestration engine capable of handling
    thousands of concurrent stateful tasks (credentialing,
    verification, enrollment).
  - Define and optimize integration frameworks to connect with
    thousands of external systems — web portals, APIs, PDFs,
    spreadsheets.
  - Drive reliability, auditability, and performance through
    observability, self-healing, and clear fault-domain
    boundaries.

  Applied AI and Automation

  - Lead the design and deployment of AI-powered digital workers
    — LLM- and rules-driven agents that perform operational
    workflows end-to-end.
  - Evaluate AI tools, frameworks, and third-party APIs,
    ensuring alignment with platform goals and data protection
    requirements.

  Cross-functional Leadership

  - Partner with product, engineering, and analytics to discover
    use cases, build features, and deliver value
  - Engage with customers to understand operational challenges,
    validate assumptions, and iterate solutions quickly



  What We’re Looking For

  Must-Have:

  - 5+ years experience building and scaling complex,
    distributed systems or workflow-heavy SaaS platforms.
  - Proven ability to own architecture and make high-stakes
    technical decisions in ambiguous, high-growth
    environments.
  - Deep understanding of modern cloud architecture and full
    software stacks.
  - Excellent communication — able to clearly explain technical
    trade-offs to technical and non-technical audiences alike.

  Preferred:

  - Experience with workflow orchestration frameworks or event-
    driven architectures.
  - Contributions to open-source projects, publications, or
    active technical presence.
  - Open-source contributions, publications, or technical blog
    presence

  You’ll Love This Role If You

  - Want to lead AI projects from idea to deployment
  - Want to own architecture, projects, and culture — not
    inherit them.
  - Thrive in a 0→1 environment, building from scratch and
    scaling from concept to production.
  - Care deeply about impact — accelerating patient access by
    fixing the infrastructure of healthcare.
  - Believe great products emerge from tight collaboration
    between product, engineering, and operations.
  - Want your work to outlast you — building systems that become
    part of healthcare’s invisible infrastructure.



  Why Join Assured

  - High-impact work - Tackle bottlenecks that slow down
    provider access to patients
  - Real-world AI – Build intelligent systems that reason, act,
    and automate in production.
  - Cross-functional exposure - Collaborate with customers,
    clinical ops, engineers, and founders
  - Early-stage upside - Equity, early influence, and a high-
    growth trajectory
  - People-first culture - Mental health time, and a focus on
    outcomes, not hours

  Benefits and Pay

  Our headquarters are located in New York City. This is an
  in-office role. We value in-person collaboration — we host
  offsites, outings, and team meals to stay connected as
  people, and offer office lunch and a fully stocked snack
  bar. We provide competitive base compensation along with
  stock options. Compensation for this role depends on
  experience and interview performance. We offer generous
  employer-sponsored health and dental coverage, nine company
  holidays, and unlimited PTO ("take what you need").

  EEO Statement

  Assured is an equal opportunity employer committed to
  diversity and inclusion. We prohibit discrimination and
  harassment based on race, color, sex, religion, sexual
  orientation, national origin, disability, genetic
  information, pregnancy, or any other protected
  characteristic under federal, state, or local laws.

  This policy applies to all employment practices, including
  hiring, promotion, termination, compensation, benefits,
  training, and apprenticeships. Assured bases hiring
  decisions solely on qualifications, merit, and business
  needs.
