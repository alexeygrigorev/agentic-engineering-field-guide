description: |
  We power people’s progress.

  At Preply, we’re all about creating life-changing learning
  experiences. We help people discover the magic of the
  perfect tutor, craft a personalised learning journey, and
  stay motivated to keep growing. Our approach is human-led,
  tech-enabled - and it’s creating real impact.

  We’ve just reached unicorn status with a $150M Series D,
  accelerating our vision to transform education through
  human-led, AI-enhanced learning. Today, 100,000+ tutors
  teach 90+ languages to learners in 180 countries - and we’re
  only getting started. As a category-defining company, we’re
  shaping what the future of learning looks like at global
  scale.

  Every Preply lesson sparks change, fuels ambition, and
  drives progress that matters. Joining Preply means helping
  define the future of education at global scale, and building
  something that truly matters for millions of people, every
  day.

  Meet the team

  The CRM team owns how Preply talks to millions of learners
  and tutors – every lifecycle email, push notification and
  in-app message that reaches them at the moments that matter,
  at scale and in every market we operate in.

  We work across Preply's core platform, built with
  Python/Django on the backend and React on the frontend, and
  the CRM stack that powers our communications layer. Our
  focus now is adding more automation to that layer and making
  it AI-native so the team's output scales with the business.

  We're proudly tech-agnostic, great engineers come from all
  kinds of backgrounds. Whether you’ve worked with
  Java/Spring, Node.js, Ruby on Rails, Scala/Play, PHP, or Go,
  you’ll feel right at home here. Python experience isn’t
  required.

  We make decisions based on data and real user feedback:
  running A/B tests, shipping iteratively, and constantly
  improving. We also put a strong focus on observability,
  monitoring, and metrics, so we can keep our systems healthy
  and continue optimizing at scale.

  At Preply, we ship 50–60 times per day, thanks to a solid
  CI/CD setup and a culture that values action over ceremony.
  As a fast-growing company, you’ll find a wide range of
  technical challenges (we even write about many of them on
  our Engineering Blog!), the kind of work that keeps you
  learning, stretching, and growing.

  We’ve reached 90%+ adoption of AI coding tools across
  engineering, and we’re now moving towards more autonomous,
  AI-Augmented development at scale. At Preply, engineers have
  direct access to the best tools available, with the freedom
  to use them fully and experiment as they build.

  What you’ll be doing

  You will work in a truly cross-functional team alongside
  Engineers, CRM Marketers, Localisation specialists, Product
  Designers, UX Writers, and other stakeholders to deliver
  meaningful outcomes for learners and tutors. As a Senior
  Full Stack Engineer on the CRM team, you'll build the
  platform our communications run on, combining hands-on
  execution with technical leadership, helping shape both
  product direction and engineering excellence through
  initiatives that drive customer and business impact,
  including, but not limited to:

  - CRM Platform & Automation: Evolve how our communications get
    built and shipped - working with Braze and HTML
    templating, and building the automation and AI-assisted
    workflows that make campaign delivery faster and more
    reliable. Braze experience is a plus, not a requirement -
    it's knowledge the team already has and will share with
    you;
  - Back-end Development: Develop and own backend features using
    Python/Django, supporting the creation of new backend
    services as well as design, create, and/or troubleshoot
    integrations with third-party vendors including our CRM
    and communications stack;
  - UI Development: Develop and evolve frontend experiences in
    React/Typescript, contributing to experimentation
    frameworks and helping establish frontend engineering best
    practices;
  - Implementation & Ownership: Lead complex initiatives from
    discovery through deployment, taking ownership of
    solutions throughout their lifecycle and balancing
    immediate product needs with long-term sustainability;
  - Raising the Bar: Drive engineering excellence through
    mentorship, architectural reviews, and the adoption of
    best practices across frontend and backend development;
  - Data-Driven Product Development: Partner closely with
    Product, Data, and UX teammates to identify opportunities,
    validate hypotheses, and maximize customer value through
    experimentation and measurable outcomes;
  - System Design: Shape architectural direction for complex
    systems, making technical decisions that improve
    scalability, reliability, maintainability, and developer
    productivity;
  - Prioritisation & Decision-Making: Navigate ambiguity,
    evaluate trade-offs, and align technical investments with
    business objectives and customer impact;
  - Technical Leadership: Influence technical direction beyond
    your immediate scope, collaborating with engineers,
    managers, and stakeholders to drive alignment and
    successful delivery;
  - Chasing Excellence: Continuously raise the quality bar
    through craftsmanship, curiosity, continuous learning, and
    a commitment to helping others grow.

  What you need to succeed

  - Full-Stack Expertise: Comfortable across the stack -
    building backend services in any major language, and
    working on the front end;
  - Internal Tooling Track Record: You've built and owned
    tooling or automation that other engineers depended on day
    to day, and you understand that adoption is part of the
    job, not a follow-up;
  - Email & Template Engineering: You can deliver production-
    ready email independently with a templating language, and
    you understand why email engineering is not web
    engineering - the rendering constraints, the client
    quirks, the testing burden.
  - AI Expertise: You're a forefront user of Agentic AI. You're
    able to bring hands on experience and start influencing
    the team beyond code generation; reserving judgment for
    architecture, business logic, and security, using AI as a
    thought partner and able to set up quality gates and
    safety nets to enhance existing engineering workflows and
    propose AI-native alternatives.
  - Scalable Systems & Architecture: Experience designing and
    evolving large-scale web applications, including well-
    designed APIs, distributed systems, high-volume data
    flows, and scalable architectural patterns. Ability to
    make sound technical trade-offs that balance short-term
    delivery with long-term sustainability;
  - Technical Leadership: Demonstrated ability to influence
    technical decisions, drive engineering best practices, and
    contribute to architectural direction within your team;
  - Product & Business Impact: Strong product mindset with the
    ability to translate ambiguous business challenges into
    scalable technical solutions, using experimentation, data,
    and customer insights to guide decisions;
  - Proactive Problem-Solving: Comfortable navigating ambiguity
    and independently solving complex technical and product
    challenges, while knowing when to engage others to
    maximize impact;
  - Ownership & Accountability: High level of self-organization,
    ownership, and responsibility, with a track record of
    driving initiatives from concept through delivery and
    measurable outcomes;
  - Collaboration & Communication: Excellent collaboration,
    stakeholder management, and communication skills, with the
    ability to work effectively across engineering, product,
    design, and data functions. English level B2 or higher;
  - Engineering Excellence: Experience working in a cross
    functional team, contributing to code and design reviews,
    and helping raise the engineering bar through knowledge
    sharing and technical leadership;
  - Operational Excellence: Understanding of observability,
    reliability, monitoring, and operational best practices,
    with willingness to participate in your squad’s on-call
    rotation (1 week every 5 weeks);

  Our Principles

  - Care to change the world - We are passionate about our work
    and care deeply about its impact to be life changing.
  - We do it for learners - For both Preply and tutors, learners
    are why we do what we do. Every day we focus on empowering
    tutors to deliver an exceptional learning experience.
  - Keep perfecting - To create an outstanding customer
    experience, we focus on simplicity, smoothness, and
    enjoyment, continually perfecting it as every detail
    matters.
  - Now is the time - In a fast-paced world, it matters how
    quickly we act. Now is the time to make great things
    happen.
  - Disciplined execution - What makes us disciplined is the
    excellence in our execution. We set clear goals, focus on
    what matters, and utilize our resources efficiently.
  - Dive deep - We leverage business acumen and curiosity to
    investigate disparities between numbers and stories,
    unlocking meaningful insights to guide our decisions.
  - Growth mindset - We proactively seek growth opportunities
    and believe today's best performance becomes tomorrow's
    starting point. We humbly embrace feedback and learn from
    setbacks.
  - Raise the bar - We raise our performance standards
    continuously, alongside each new hire and promotion. We
    build diverse and high-performing teams that can make a
    real difference.
  - Challenge, disagree and commit - We value open and candid
    communication, even when we don’t fully agree. We speak
    our minds, challenge when necessary, and fully commit to
    decisions once made.
  - One Preply - We prioritize collaboration, inclusion, and the
    success of our team over personal ambitions. Together, we
    support and celebrate each other's progress.

  Diversity, Equity, and Inclusion

  Preply.com is committed to creating an inclusive environment
  where people of diverse backgrounds can thrive. We believe
  that the presence of different opinions and viewpoints is a
  key ingredient for our success as a multicultural Ed-Tech
  company. That means that Preply will consider all
  applications for employment without regard to race, color,
  religion, gender identity or expression, sexual orientation,
  national origin, disability, age or veteran status.
