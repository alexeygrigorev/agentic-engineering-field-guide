description: |
  About Lendable

  Lendable is on a mission to build the world's best
  technology to help people get credit and save money. We're
  building one of the world’s leading fintech companies and
  are off to a strong start:

  - One of the UK’s most exciting unicorns with a team of over
    800 people
  - Among the fastest-growing tech companies in the UK
  - Profitable since 2017
  - Backed by top investors including Balderton Capital and
    Goldman Sachs
  - Loved by customers with the best reviews in the market (4.9
    across 10,000s of reviews on Trustpilot)

  So far, we’ve rebuilt the Big Three consumer finance
  products from scratch: loans, credit cards and car finance.
  We get money into our customers’ hands in minutes instead of
  days.

  We’re growing fast, and there’s a lot more to do: we’re
  going after the two biggest Western markets (UK and US)
  where trillions worth of financial products are held by big
  banks with dated systems and painful processes.

  Join us if you want to

  - Take ownership: you are trusted to make decisions that drive
    a material impact on the direction and success of Lendable
    from day 1
  - Work in small teams of exceptional people: Lendies are
    relentlessly resourceful. We challenge the status quo to
    solve problems and find smarter solutions
  - Build the best technology in-house: we use new data sources,
    machine learning and AI to make machines do the heavy
    lifting

  We’re looking for a full-stack Python engineer to join our
  Central Operations team.

  Central Ops sits across our core products (Cards, Loans and
  Motor), focusing on shared operational challenges and
  opportunities. We build a mix of internally facing web
  applications and robust automations to help our Operations
  teams deliver great outcomes for customers, efficiently and
  at scale.

  It’s a broad space: Operations makes up roughly half of our
  employee headcount and covers everything from day-to-day
  customer support up to complex areas like Fraud and Fincrime
  prevention. As our customer base grows rapidly, our role is
  to help ops keep pace without relying solely on headcount
  growth. We make intelligent, pragmatic use of AI where it
  adds real value, working closely with Product, Data Science
  and Analytics to deploy solutions that genuinely support our
  ops agents.

  You’ll have real ownership from an engineering perspective,
  shipping features that are used daily by Ops teams. It’s an
  evolving space at Lendable, and what you build will help
  shape both our tools and our technical direction.

  Some examples of things we’ve built recently:

  - Rebuilt our Ops QA admin system from the ground up,
    replacing an off-the-shelf tool with something tailored to
    our needs
  - Deployed a pipeline to summarise customer calls into concise
    notes using LLMs, automatically surfaced in ops admin
    panels — removing the need for manual note-writing
  - More than doubled the number of complaints processed by
    agents through a combination of targeted AI automation and
    improved UX



  What we’re looking for

  We’d consider the following essential to the role:

  - You have 8+ years of professional experience as a software
    engineer
  - Solid experience with Python in a web application context.
    You have some experience with web frameworks like FastAPI,
    Django or Flask. We use FastAPI.
  - Experience with Javascript/Typescript and a modern JS
    framework such as React, Angular or Vue.js. We generally
    use React & NextJS. You can build a frontend that's good
    enough for internal tooling
  - Strong engineering principles & practices: design patterns,
    testing, clean code and a good reviewer
  - Previous experience working in a product-focused team
  - A keen desire to want to learn and input into a highly
    collaborative team
  - You use AI tools like Copilot, Cursor, Claude or others in
    your day-to-day coding



  The following are also a plus, but by no means essential. If
  you don’t meet all of these, please apply anyway!

  - Exposure to Domain Driven Design, Message-Driven Systems and
    Event Sourcing
  - Experience with cloud infrastructure, particularly AWS
  - SQL, and finding your way around data schemas
  - Shipping containerised software with Argo, Kubernetes,
    Docker and Terraform

  Interview process

  - A 30 minute introductory call
  - Take Home Task
  - Technical Interview
  - Cultural/behavioural interview

  Life at Lendable

  - Winning team: the opportunity to scale up one of the world’s
    most successful fintech companies
  - Flexible working: flexible approach tailored to each role.
    Hybrid roles require three days in-office weekly; fully
    remote roles include regular opportunities for in-person
    connection through socials and off-sites
  - Socials & connection: opportunities and events to come
    together, socialise, and get to know each other beyond the
    office walls
  - Health coverage: support for your physical and mental
    wellbeing, including private health cover
  - Retirement & savings: long-term financial wellbeing through
    retirement savings plans
  - Employee referral programme: earn a competitive bonus when
    you refer successful new team members
  - Office meals & snacks: enjoy a fully stocked kitchen, plus
    complimentary lunches prepared by in-house chefs on in-
    office days at select locations
  - Sustainable commuting: cycle-to-work and electric vehicle
    salary sacrifice schemes available in select locations

  Please note: The availability and details of specific
  benefits vary by location and role. For more information,
  please speak to your Talent Partner.

  Check out our blog!
