description: |
  Maxana is seeking an experienced Backend Engineer for a
  confidential client — a well-funded AI platform company used
  by ML teams globally. In this role you will own features end
  to end across APIs, CLI tooling, billing systems, and
  platform integrations. The team is small and senior, the
  engineering bar is high, and you will work directly with
  product and engineering leaders.

  Key Responsibilities

  - Write clean, efficient, production-grade code in Go (Golang)
  - Build and scale APIs, CLI tools, billing systems, and
    security integrations
  - Set technical direction for large projects alongside
    engineering and product leadership
  - Evaluate and strengthen technical architecture, tooling, and
    processes
  - Champion software quality, drive continuous delivery, and
    proactively reduce technical debt
  - Mentor engineers on system design and operating in high-
    uncertainty environments

  Requirements

  - 5+ years of production Go experience in a SaaS environment
  - Broad knowledge of backend and frontend systems — APIs,
    CLIs, billing, security protocols
  - Experience with cloud platforms: AWS, GCP, or Azure
  - Familiarity with containerization — Docker and Kubernetes a
    strong plus
  - Prior startup or high-growth company experience required
  - Must be able to work hybrid 2 days/week

  Benefits

  - Competitive base salary + equity ($110,000–$270,000 range)
  - Medical, dental, and vision
  - Flexible paid time off
  - Learning and development stipend
  - Working for a globally recognized company
