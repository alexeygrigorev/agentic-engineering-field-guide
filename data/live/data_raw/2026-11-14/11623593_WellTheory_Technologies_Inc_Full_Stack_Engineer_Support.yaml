description: |
  About WellTheory

  WellTheory is a digital health company helping people with
  autoimmune conditions take control of their health through
  personalized care, nutrition guidance, and ongoing coaching.
  We're a team of 60+ passionate people who care deeply about
  helping our members reduce symptoms, feel better, and live
  fuller lives — while helping employers and payors reduce
  their spend.

  About the Role

  WellTheory is hiring an engineer to own what happens when
  things break, and then make sure they break less.

  When a member or Care Team member hits an issue, you’re
  first on it. You size the impact, find the root cause, get
  people unblocked, and decide what deserves a permanent fix.
  Your real job is to shrink the queue, not just work through
  it: spot patterns, ship upstream fixes, write runbooks, and
  automate the repetitive stuff.

  You’ll work across our member app, Care Hub (our clinical
  tooling for care teams), and the internal tools and data
  pipelines behind them. You’ll partner closely with our
  Member Support Specialist and Care Team, join a small,
  senior, fully remote engineering team, and report to our Co-
  Founder & CPO.

  You likely have 4+ years as a software engineer and fluency
  in TypeScript. Our stack is TypeScript/JavaScript, React,
  React Native, Node, Postgres, and GCP, with Sentry, GCP
  logs, Linear, and Slack day to day. You don’t need every
  piece. We’re a team of generalists who learn fast and make
  good trade-offs.

  What You'll Do

  - Triage first. Size the impact, reproduce the issue, and
    decide the next move.
  - Find the root cause. Dig through Sentry, GCP logs, and the
    codebase, and ship the fix when it’s worth it.
  - Unblock, then fix. Get the reporter moving first, then
    decide if the problem earns a ticket.
  - Kill recurring issues. Maintain a prioritized backlog and
    use quieter stretches to ship durable fixes, improvements,
    and feature requests.
  - Make next week easier. Write runbooks, build meaningful
    alerts, and create automations and AI agents that cut
    ticket volume.
  - Protect the queue. A ticket means “worth doing,” not
    “someone mentioned it.”
  - Handle member data with care.

  You Might Be a Great Fit If You...

  - Play detective. You follow the thread, connecting logs,
    errors, and Slack history without needing the whole system
    mapped out first.
  - Size impact before acting. One member locked out and ten
    providers unable to submit charting notes are not a tie,
    and you know which comes first.
  - Stay calm in the chaos. You triage, communicate, and work
    the problem.
  - Say only what’s needed. Members and providers get the
    answer, not the investigation.
  - Scale yourself. You use AI to move faster, and you’d rather
    automate a fix than do it a third time.
  - Care about the person on the other end. It shows in how you
    prioritize and communicate.
  - Know your limits. You ask for help before you’re drowning,
    but not for every splash.
  - Stay curious. You ask questions without fear and welcome new
    approaches.

  Bonus Points

  - You’ve worked as a support, sustaining, or forward-deployed
    engineer.
  - You’ve built internal tools, dashboards, or bots that made a
    support process disappear.
  - You’ve worked in healthcare, or you care deeply about
    autoimmune or women’s health outcomes.
  - You’ve done something most people wouldn’t: run a marathon,
    started a company, earned a degree while working full
    time, or overcome serious adversity.

  This role is US-based and requires current US work
  authorization (we can’t sponsor visas at this time) and
  access to protected health information.

  What We Offer

  - A team that genuinely cares about each other and the members
    we serve
  - A fully remote company that gathers every year for an annual
    retreat
  - A base salary range of $140,000 - $165,000 with meaningful
    equity and benefits. Placement within our range depends on
    directly relevant skills and experiences you bring to the
    role.

  Employment is contingent upon successful completion of a
  background check and drug screening (5-panel, no THC).
  --  For your safety: Please remember that WellTheory will
  only contact you from a @welltheory.com email address. Be
  cautious of emails from other domains. Our recruiting team
  will never ask for money, fees, or banking information as
  part of our hiring process. If you're ever unsure, don't
  click any links and apply directly to a posted role on our
  career site.

  --

  At WellTheory, we're committed to building a diverse,
  inclusive, and authentic team — so if you're excited about
  this role but your experience doesn't check every box, we
  encourage you to apply anyway. You might be exactly who
  we're looking for. WellTheory is an equal opportunity
  employer. We do not discriminate on the basis of race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, age, disability, veteran status, or any
  other protected characteristic. If you require
  accommodations at any stage of our hiring process, please
  reach out to our hiring team. We're happy to work with you.
