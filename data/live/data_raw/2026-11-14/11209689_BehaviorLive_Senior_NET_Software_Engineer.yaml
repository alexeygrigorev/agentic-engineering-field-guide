description: |
  Please note. Directly emailing us will result in immediate
  disqualification. Use the application form to apply.

  About OkWhen

  OkWhen builds technology that powers live, virtual, and
  hybrid events. Our platform supports conference management,
  registration, payments, mobile apps, content libraries,
  webinars, LMS functionality, CEU tracking, sponsor
  management, and operational workflows.

  We are hiring a Senior .NET Software Engineer to help us
  improve, maintain, and extend a production platform used to
  run complex events.

  The Outcome We’re Hiring For

  You will own meaningful parts of our application and
  consistently deliver reliable software without requiring
  constant supervision. You will improve system performance,
  reduce technical debt, and turn operational problems into
  simple, maintainable products.

  This is not a ticket-taking role. We need an engineer who
  can understand the existing system, make sound technical
  decisions, and follow work through from discovery to
  production.

  Responsibilities

  - Design, build, test, deploy, and maintain production
    software
  - Develop backend services and APIs using C# and ASP.NET/.NET
  - Build and maintain web applications using Angular
  - Design, optimize, and troubleshoot SQL Server databases and
    queries
  - Maintain and extend mobile applications using .NET MAUI
  - Investigate and resolve production issues
  - Improve application reliability, performance, security, and
    observability
  - Write automated tests and maintain technical documentation
  - Participate in code reviews and establish engineering
    standards
  - Collaborate with product, operations, and event-production
    teams
  - Break ambiguous business problems into clear technical plans
  - Use AI-assisted development tools responsibly to improve
    speed without sacrificing quality

  Requirements

  - 7+ years of professional software development experience
  - Strong commercial experience with C#, .NET, and ASP.NET Core
  - Strong experience with Angular and TypeScript
  - Advanced working knowledge of SQL Server, database design,
    and query optimization
  - Production experience with .NET MAUI or Xamarin
  - Experience designing and consuming REST APIs
  - Experience with Git, CI/CD, debugging, and automated testing
  - Demonstrated ability to work independently in an existing
    codebase
  - Strong written and verbal communication
  - Comfortable owning outcomes, not just completing assigned
    tasks

  Preferred Qualifications

  - Experience with SaaS platforms
  - Experience with event management, registration, payments,
    LMS, or communications systems
  - Cloud experience with Azure or AWS
  - Experience with distributed systems, queues, integrations,
    or real-time applications
  - Experience modernizing legacy applications
  - Experience mentoring other developers

  Benefits

  - Health Care Plan (Medical, Dental & Vision)
  - Retirement Plan (401k, IRA)
  - Paid Time Off (Vacation, Sick & Public Holidays)
  - Training & Development
  - Work From Home
