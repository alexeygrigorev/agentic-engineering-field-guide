description: |
  KEY RESPONSIBILITES

  · Lead the architecture, design, and development of complex
  software systems and platforms

  · Define and champion engineering standards, best practices,
  and long-term technical roadmaps

  · Collaborate with cross-functional teams to translate
  business needs into scalable, secure, and maintainable
  solutions

  · Conduct deep technical reviews, guide system design
  discussions, and ensure architectural consistency across
  teams

  · Mentor and coach engineers, fostering a culture of
  technical excellence and continuous learning

  · Drive root-cause analysis and resolution of complex
  technical issues, ensuring system reliability and data
  integrity

  · Evaluate emerging technologies and guide strategic
  adoption where appropriate

  · Partner with product, laboratory, and bioinformatics teams
  to optimize workflows and enhance operational efficiency

  · Ensure compliance with security, privacy, and regulatory
  requirements across all software systems

  · Contribute to innovation initiatives that advance Baylor
  Genetics’ digital capabilities and competitive advantage

  · Perform other duties as assigned to support team and
  organizational objectives.

  · Comply with all company policies, procedures, and
  applicable regulatory requirements.

  QUALIFICATIONS

  Required

  · B.S. in Computer Science or related field required

  · 10+ years of professional software engineering experience,
  including significant experience in large-scale or complex
  systems

  · Expert-level proficiency with C# and .NET (e.g., .NET Core
  / .NET 6+)

  · Extensive experience architecting and building React +
  TypeScript applications

  · Deep expertise with relational databases such as MS SQL
  Server, PostgreSQL, or MySQL, including schema design,
  performance tuning, and data modeling

  · Proven experience designing, implementing, and governing
  RESTful APIs and distributed systems

  · Strong background in software architecture, system design,
  and engineering best practices

  · Demonstrated experience leading technical initiatives,
  mentoring engineers, and influencing cross-functional
  decision-making

  · Strong understanding of DevOps principles, CI/CD
  pipelines, and cloud-native architectures

  · Excellent analytical and problem-solving skills with the
  ability to navigate ambiguity and complexity

  · Equivalent combination of education and experience may be
  considered.

  Preferred:

  · M.S. or higher preferred in Computer Science or related
  field

  · Experience in healthcare, clinical diagnostics, genomics,
  or NGS environments

  · Familiarity with laboratory workflows, LIMS systems, or
  clinical reportingplatforms

  · Experience working in regulated environments (CLIA, CAP,
  HIPAA)

  · Background in designing secure, compliant, and audit-ready
  systems

  · Experience with high-performance or data-intensive
  applications, including optimization and scalability
  strategies

  COMPETENCIES

  · A strategic technical leader who can define long-term
  architectural direction

  · Strong ownership mindset with the ability to drive
  initiatives from concept to production

  · Exceptional communication skills, capable of translating
  complex technical concepts for diverse audiences

  · A collaborative partner who elevates team performance and
  mentors engineers at all levels

  · Sound judgment balancing innovation, speed, quality, and
  regulatory requirements

  · Passion for building systems that directly support
  clinical decision-making and patient outcomes

  PHYSICAL DEMANDS AND WORK ENVIRONMENT

  · Location: Remote

