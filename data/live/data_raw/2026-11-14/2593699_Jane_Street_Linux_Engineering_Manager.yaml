description: |
  About the Position

  We are seeking a leader for our growing team of Linux
  Engineers.

  Members of this group, managers and individual contributors
  alike, are hard-working Systems Engineers, Administrators,
  and Programmers, tasked with maintaining and improving the
  platform that powers Jane Street's production trading
  systems. (Find out more about the Linux Engineer role here).

  We expect managers to come in and lead by example. As well
  as supporting their teams, the ideal candidate will be
  excited to start off as an individual contributor, establish
  a fundamental understanding of Jane Street's technical
  environment, and gradually grow into a management role.

  We are looking for people who are enthusiastic about our
  values: honesty, cooperation, intellectual curiosity,
  humility, and a quantitative approach to decision making and
  problem solving. To succeed in this role, they should be
  Linux Engineers at heart who have grown into several of the
  following areas: people management, project and programme
  management, large-scale coordination and communication,
  partnership facilitation, short- and long-term planning, and
  service delivery, among others.

  About You

  We are looking to hire a Linux Engineer Manager with a
  strong technical background and solid leadership experience.
  Candidates are expected to lead by example, prioritising
  their individual technical work and their leadership
  responsibilities accordingly. They should have a willingness
  to learn OCaml, our language of choice, and meet the
  following requirements:

  - Bachelor's degree in Computer Science, Software Engineering,
    or other technical discipline (or equivalent experience)
  - Clear and concise communication skills, from one-on-one
    meetings to larger group discussions, and the ability to
    efficiently analyse and deconstruct problems
  - Successful track record supporting individuals and helping
    teams thrive
  - Experience building and growing firm-wide partnerships
  - Strong analytical and troubleshooting skills at various
    levels (technical, process, people, etc.)
  - Deep knowledge of operating system fundamentals, especially
    Linux
  - Fluency with the Unix command line and shell scripting
  - Practical experience with modern Linux systems and systems
    programming concepts
  - Basic understanding of network protocols
  - Programming experience in any language
  - Fluency in English required

  If you're a recruiting agency and want to partner with us,
  please reach out to agency-partnerships@janestreet.com.
