description: |
  Backed by leading Silicon Valley investors, Peregrine helps
  public safety organizations, state and local and
  governments, federal agencies, and private-sector
  institutions address society’s challenges with unprecedented
  speed and accuracy. Our AI-enabled platform turns siloed and
  disconnected data into operational intelligence — instantly
  surfacing mission-critical information to empower better,
  faster decisions that improve outcomes at every touchpoint.
  Today Peregrine supports hundreds of customers across 30+
  states and two countries, serving more than 125 million
  people — and we’re amplifying our impact as we expand into
  the enterprise and internationally.

  Our Team

  As an engineering team, we believe strongly that empathy
  improves our solutions. Seeing how people use the product is
  a priority and the way we get to the right answer. Engineers
  will have the opportunity to work closely with our team
  onsite to understand the variety of use cases that Peregrine
  serves.

  We’re looking for a Staff Software Engineer to join our core
  engineering teams. You’ll work cross-functionally with
  design and product management to build systems that are
  robust, scalable, and user-centered. Our teams tackle a
  range of challenges, from enabling real-time user
  collaboration on detailed maps to building high-scale
  backend architecture for ingesting billions of data points.

  We value both ownership and collaboration—you will take full
  responsibility for major features and work closely with
  other engineers to drive them to completion. We believe that
  humility and empathy are essential for building the right
  solutions—you will collaborate directly with our deployment
  team and users as we iterate to solve their problems.
  Perseverance and creativity are crucial to executing our
  vision.

  Role

  We’re looking for a Staff Software Engineer to join our
  growing team and drive impactful projects, foster an
  inclusive team culture, and lead technical decision-making.

  This role is for someone who thrives in both people
  management and hands-on technical leadership. You’ll develop
  a high-performing team, guide them through complex technical
  challenges, and ensure their work aligns with our business
  priorities. The ideal candidate will balance mentorship
  while maintaining high standards in technical execution.

  You’ll drive impactful work that delivers value to our
  customers, from aiding emergency responders during a
  hurricane to diffusing complex organized crime. We are
  building innovative capabilities that enable new workflows
  for our customers. As a leader, you will ensure that we
  execute well on these initiatives.

  Our stack is constantly evolving but based on a backend
  foundation of Python, Django, Celery, Airflow, and Kafka; a
  frontend built in React, Redux, and Mapbox; data stores
  including PostgreSQL and Elasticsearch; machine learning
  models hosted in Bedrock and Sagemaker; and with AWS,
  Pulumi, Terraform, and Kubernetes as our underlying
  infrastructure.

  About you

  - Desire and drive to own large portions of the application
    from start to finish
  - Passion for crafting and shipping software solutions that
    delight users
  - Thrive on ambiguity and love taking on hard problems
  - Excellent technical vision with the ability to synthesize
    product requests into strong and reliable software
    components

  What we look for

  - Degree in Computer Science or a related field, or equivalent
    experience
  - 8+ years of experience working with cross-functional
    software development teams
  - Experience shipping and iterating on production-grade
    software components professionally and / or in the open-
    source community
  - Ability to write robust, well tested, and well-designed code
    that frequently gets deployed to users
  - Solid understanding of architecting and scaling distributed
    software systems
  - Strong best practices in modern software development and
    comfort navigating large codebases
  - Located in NYC and open to working in office

  Annual Salary + Benefits + Equity (if applicable) + Bonus
  (if applicable)

  $200,000—$275,000 USD

  Actual compensation is influenced by a wide array of factors
  including but not limited to skill set, level of experience,
  certifications or licenses, and specific work location.
  Information on the benefits offered is here.

  Peregrine Technologies is committed to creating an inclusive
  environment for all employees. We celebrate diversity and
  are a proud equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, gender, gender identity or
  expression, sexual orientation, national origin, genetics,
  disability, age, or veteran status.
