description: |
  Who We Are

  Notion is the collaborative AI workspace where teams and
  agents think together. We're building one place where your
  knowledge, projects, meetings, and AI tools live side by
  side, so work is faster, clearer, and less fragmented.
  Millions of individuals, small teams, and large companies
  run their work on Notion.

  Notinos (our employees) are customer zero in bringing this
  future of work to life. We care about craft, building things
  that last, and the belief that great work is still
  fundamentally human. Our goal isn’t to ship the next
  feature. Each and every team of Notinos is working to set
  the standard for how humans work together in the AI era.
  From building a business’s system of record to making and
  managing AI agents to automating away the busy work, we care
  deeply about giving our customers more time for their life’s
  work.

  About the Role

  Build the iOS platform that helps engineers ship
  confidently. As Notion’s mobile team grows, we’re turning
  the first generation of mobile foundations into a durable
  platform: clearer architecture, ergonomic testing,
  dependable observability, and faster CI/CD. This role is
  broad—you’ll shape the iOS stack end to end, from shared
  frameworks and build systems to release quality, with
  opportunities to work across our shared Rust layer and AI
  infrastructure for mobile development. You’ll pair with
  mobile AI and core product engineers to understand friction,
  evaluate new iOS capabilities, and decide what should become
  part of the platform.

  This role can be based in either San Francisco or New York
  City. We work from our offices on Mondays, Tuesdays and
  Thursdays (our Anchor Days) because we do our best thinking
  and building together in person. We’re looking for someone
  who’s excited to work alongside the team during those days.

  What You'll Achieve

  - Make the iOS platform agent-ready: Give engineers and agents
    dependable ways to build, run, test, screenshot, and
    iterate through the app so mobile teams can move faster
    without lowering the quality bar.
  - By the end of your first year, define how iOS features are
    built: establish architecture and ship developer tools,
    then partner with product engineers to adopt them.
  - Raise the bar for iOS reliability and release quality:
    Improve the systems that catch regressions, prevent
    incidents, and help engineers understand issues quickly
    across builds, tests, observability, and CI/CD.



  Skills You'll Need to Bring

  - Deep iOS engineering experience at scale: You’ve helped
    build and deploy mobile applications used by millions, and
    understand the reliability, performance, and operational
    practices required at that scale.
  - Platform or infrastructure experience: You’ve worked below
    the product-feature layer on mobile CI/CD, testing
    platforms, build systems, developer tooling, or shared
    frameworks—and can turn recurring friction into durable
    systems.
  - Strong architectural judgment: You’re familiar with multiple
    approaches to iOS architecture and can explain the trade-
    offs clearly, choosing patterns that make features easier
    to build, test, and maintain.
  - Cross-functional influence: You can partner closely with
    product engineers, understand their pain points, and earn
    adoption for new platform APIs, workflows, and standards
    without relying on authority.
  - AI-native engineering practice: You use AI tools and agents
    as real collaborators, framing tasks clearly, reviewing
    generated changes, testing behavior, and designing
    workflows that make the broader team more effective.



  Notion is committed to providing highly competitive cash
  compensation, equity, and benefits. The compensation offered
  for this role will be based on multiple factors such as
  location, the role’s scope and complexity, and the
  candidate’s experience and expertise, and may vary from the
  range provided below. For roles based in San Francisco or
  New York City, the estimated base salary range for this role
  is $150,000 - $168,000 per year.



