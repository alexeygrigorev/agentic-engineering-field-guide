description: |
  The Role

  Cogniify is hiring a Full Stack Java Engineer to build and
  improve web applications. You will work on Java-based
  backend services and user-facing features, with Python used
  where it fits the work. We are looking for someone who can
  deliver features end to end and use AI development tools
  such as Claude Code to support coding, testing, and
  debugging.

  What You’ll Do

  - Build and maintain Java backend services, APIs, and
    application features.
  - Develop frontend features using a modern JavaScript
    framework and integrate them with backend APIs.
  - Work with Python for scripts, integrations, or supporting
    services when needed.
  - Use Claude Code or similar AI coding tools to help with
    development, while reviewing and testing the output before
    release.
  - Write tests, troubleshoot issues, and support the deployment
    and maintenance of applications.
  - Work with the team on design decisions, code reviews, and
    practical improvements to application quality.

  What We’re Looking For

  - 3 to 6 years of professional software development
    experience.
  - Hands-on Java development experience, including backend
    services and REST APIs.
  - Full-stack experience building both backend and frontend
    application features.
  - Working knowledge of Python.
  - Familiarity with Claude Code or another AI coding assistant
    in a software development workflow.
  - Exposure to building or running applications on a cloud
    platform such as AWS, Azure, or Google Cloud.
  - Ability to test and debug your work and communicate clearly
    with other engineers.

  Preferred Qualifications

  - Experience with Spring Boot and a frontend framework such as
    React, Angular, or Vue.
  - Familiarity with SQL databases, Git, and CI/CD practices.

  Perks And Benefits Of Working With Us

  - Unlimited PTO.
  - Please ask us about our very generous parental leave, much
    above industry standards!.
  - Entrepreneurial culture where pushing limits and taking
    risks is everyday business.
  - Open communication with management and company leadership.
  - Small, dynamic teams = massive impact.
  - Medical, Dental and Vision coverage for employees.
  - Access to Disability & Life insurance.
  - Mental health and wellbeing support
  - Annual bonus program
  - Employer Stock Purchase Program (ESPP)
  - Yearly Team building experiences
  - Mentorship and sponsorship opportunities
  - Manager resources and support

  We are an equal opportunity employer. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, disability, or any other protected characteristic.
