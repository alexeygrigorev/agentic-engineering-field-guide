    how closely your qualifications match.
  - What information it uses: The text of your resume, your
    name, your current or most recent job title, your
    location, and this job posting.
  - What it cannot see: Your answers to voluntary demographic or
    equal employment opportunity questions, interview
    feedback, or offer information.
  - How it is used: The score is one factor in our initial
    review of applications. The tool does not reject anyone. A
    member of our recruiting team reviews every application
    before any decision is made.
  - Your options: If you would like your application reviewed
    without the AI tool, or you need a reasonable
    accommodation at any point in the hiring process, contact
