description: |
  Full-Stack Engineer (Senior Specialist) – Risk Engineering /
  Pittsburgh

  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators and champions
  of inclusion, BNY is where bold ideas meet advanced
  technology and exceptional talent. Together, we power the
  future of finance – and this is what #LifeAtBNY is all
  about. Join us and be part of something extraordinary.

  We’re seeking a future team member for the role of Full-
  Stack Engineer (Senior Specialist) to join our Risk
  Engineering team. This role is located in Pittsburgh and
  requires presence in the office 4 days per week.

  In this role, you’ll make an impact in the following ways:

  - Collaborate with cross-functional teams to design, develop,
    and maintain scalable web applications using Python/Java
    for back-end services.
  - Implement RESTful APIs and microservices in Python/Java,
    ensuring robust integration with front-end components and
    data platforms.
  - Develop intuitive and responsive user interfaces using
    Angular/React, adhering to best practices in web
    development and accessibility.
  - Integrate and query data from Snowflake, optimizing data
    pipelines and managing data storage for performance and
    reliability.
  - Participate in the entire software development lifecycle,
    including requirements gathering, design, coding, testing,
    and deployment.
  - Write clean, maintainable, and well-documented code across
    the stack, supporting code reviews and knowledge sharing
    within the team.
  - Troubleshoot, debug, and resolve technical issues across
    back-end, front-end, and data platform components.
  - Contribute to continuous improvement by suggesting
    enhancements to application architecture, code quality,
    and development processes.
  - Support the implementation of security best practices
    throughout the stack, including data protection and secure
    authentication mechanisms.
  - Collaborate with business users and other stakeholders to
    deliver user-centric solutions that align with business
    objectives.
  - Stay current with emerging technologies in Python/Java,
    Angular/React, and Snowflake, applying new insights to
    improve application performance and reliability.
  - Assist in the preparation and maintenance of technical
    documentation, deployment scripts, and user guides as
    needed.
  - Engage in Agile development practices, participating in
    daily stand-ups, sprint planning, and retrospectives
  - Use and champion AI-assisted development tools and agentic
    coding workflows, applying them hands-on to accelerate
    delivery and code quality.

  To be successful in this role, we’re seeking the following:

  - Bachelor’s degree in Computer Science, Software Engineering,
    or related field required
  - Proven experience developing scalable web applications using
    Python/Java and Angular/React
  - Hands-on expertise in building RESTful APIs and
    microservices
  - Experience integrating and querying data from Snowflake or
    similar data platforms
  - Demonstrated ability to participate in Agile software
    development practices
  - Strong problem-solving and debugging skills across the
    technology stack
  - Excellent communication and collaboration skills within
    cross-functional teams
  - Experience with AI-assisted development tools (e.g:
    Windsurf) and agentic coding workflows

