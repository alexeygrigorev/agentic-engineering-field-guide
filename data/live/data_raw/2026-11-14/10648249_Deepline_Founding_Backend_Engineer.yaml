description: |
  New York City | In person | Full time

  TL;DR

  Deepline is hiring a Founding Backend Engineer to build the
  systems that make bespoke GTM software reliable in
  production. You will own the data, integrations, and
  execution infrastructure behind a product that lets people
  and agents turn an idea into something that actually runs.

  Why Deepline

  Deepline is the agent-first platform for teams to build
  bespoke GTM software.

  Agents are making it possible for anyone to build custom
  software around how a company sells. But turning a good idea
  into a production system still requires a fragmented stack
  of data providers, internal and external data, APIs,
  permissions, integrations, monitoring, and operational
  infrastructure.

  Deepline makes that layer practical. We give power users and
  agents the primitives to build and run the exact systems
  their company needs.

  We're already used by thousands of power users at several T1
  companies and have grown extremely quickly since we launched
  in the last six months. We are a lean, deeply technical team
  moving quickly to build the infrastructure for agent-built
  software.

  Software has never been built solely for agents. Come help
  shape what that looks like.

  The role

  The hard part of bespoke software is not generating a UI. It
  is making the underlying system dependable when it touches
  real customer data and the tools a business uses every day.
  You will build that layer: the APIs, data models,
  integrations, and runtime infrastructure that make Deepline
  trustworthy in production.

  What you’ll own

  • Core APIs and services that power Deepline’s data and
  workflow execution.

  • Integrations with CRMs, enrichment providers, sequencing
  tools, warehouses, and other systems customers depend on.

  • Durable data models, identity resolution, permissions, and
  auditability across complex customer environments.

  • Reliability work: observability, monitoring, failure
  handling, performance, and operational tooling.

  • Architecture that makes it easier for product engineers
  and agents to build safely on Deepline.

  • The feedback loops that turn production usage and edge
  cases into a stronger platform.

  Who we’re looking for

  • You have 4+ years building and operating production
  backend systems.

  • You are strong in Python, TypeScript/Node, SQL, and
  relational data systems.

  • You have experience designing APIs, integrating third-
  party systems, and reasoning about reliability at scale.

  • You have sound judgment about tradeoffs: when to ship,
  when to simplify, and when to rebuild.

  • You take ownership of failures and make systems better
  after they happen.

  • Experience with data platforms, agent systems, workflow
  orchestration, or enterprise SaaS is a plus.

  Why build with us

  • Shape an entirely new category of software, with a real
  role in defining both the product and the company.

  • Work in person in New York with experienced founders and a
  deeply technical, talent-dense team.

  • Build at the frontier of AI, on problems that change how
  products are created, shipped, and brought to market.

  • Work somewhere truth-seeking and creatively opinionated:
  we question inherited assumptions and choose fast learning
  over false certainty.

  • Competitive salary and meaningful equity.

  Early teams compound. We are looking for people who raise
  the ambition, clarity, and quality of the work around them.

  Compensation

  The base pay range for this role is $140,000 – $270,000 per
  year.
