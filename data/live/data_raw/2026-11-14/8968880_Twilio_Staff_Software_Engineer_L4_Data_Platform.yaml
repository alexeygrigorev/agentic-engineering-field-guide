description: |
  Who we are

  At Twilio, we’re shaping the future of communications, all
  from the comfort of our homes. We deliver innovative
  solutions to hundreds of thousands of businesses and empower
  millions of developers worldwide to craft personalized
  customer experiences.

  Our dedication to remote-first work, and strong culture of
  connection and global inclusion means that no matter your
  location, you’re part of a vibrant team with diverse
  experiences making a global impact each day. As we continue
  to revolutionize how the world interacts, we’re acquiring
  new skills and experiences that make work feel truly
  rewarding. Your career at Twilio is in your hands. .

  Hiring and how we work

  We use Artificial Intelligence (AI) to help make our hiring
  process efficient. That said, every hiring decision is made
  by real Twilions!

  Also, while we are a remote-first company, you may be asked
  to report in person on an ad-hoc basis for team gatherings,
  functional off-sites or customer meetings. .

  See yourself at Twilio

  Join the team as Twilio's next Staff Software Engineer on
  our Data & Analytics Platform

  Who we are & why we’re hiring

  Twilio powers real-time business communications and data
  solutions that help companies and developers worldwide build
  better applications and customer experiences.

  Although we're headquartered in San Francisco, we have
  presence throughout South America, Europe, Asia and
  Australia. We're on a journey to becoming a global company
  that actively opposes racism and all forms of oppression and
  bias. At Twilio, we support diversity, equity & inclusion
  wherever we do business.

  About the job

  We are seeking an experienced Staff Engineer to join our
  Data Substrate team. In this role, you will be responsible
  for architecting scalable and reliable data solutions,
  collaborating closely with cross-functional partners driving
  technical innovation, and mentoring a team of talented
  engineers. The ideal candidate will have deep expertise in
  data systems, strong leadership skills, and a proven track
  record of delivering complex data projects at scale.


  Responsibilities

  In this role, you’ll:

  - Serve as a subject matter expert in distributed systems,
    data technologies, with strong software engineering skills
  - Architect and implement scalable and efficient data systems,
    storage solutions, and processing frameworks using state-
    of-the-art technologies.
  - Drive technical innovation and research to stay at the
    forefront of emerging data technologies and best
    practices.
  - Mentor and coach a team of talented engineers, fostering a
    culture of technical excellence, collaboration, and
    continuous learning.
  - Collaborate closely with cross-functional teams to
    understand business requirements and translate them into
    scalable and efficient technical solutions.
  - Ensure data quality, integrity, and security throughout the
    data lifecycle, adhering to industry best practices and
    compliance standards.

  Qualifications

  Not all applicants will have skills that match a job
  description exactly. Twilio values diverse experiences in
  other industries, and we encourage everyone who meets the
  required qualifications to apply. While having “desired”
  qualifications make for a strong candidate, we encourage
  applicants with alternative experiences to also apply. If
  your career is just starting or hasn't followed a
  traditional path, don't let that stop you from considering
  Twilio. We are always looking for people who will bring
  something new to the table!

  Required:

  - Bachelor's or Master's degree in Computer Science,
    Engineering, or a related field.
  - 8+ years of experience in software development, or a related
    field.
  - Proven track record of architecting and delivering complex
    data projects at scale, with a deep understanding of data
    infrastructure and distributed systems.
  - Expertise in big data technologies such as Hadoop, Spark,
    Kafka, and other distributed computing systems.
  - Experience designing, building, and operating large-scale
    systems using AWS technologies.
  - Proficiency in programming languages such as Python, Java,
    or Scala, with strong problem-solving skills and attention
    to detail.
  - Experience designing or working with Data Lakehouse
    architectures, including hands-on experience with Hudi,
    Iceberg, or Delta data formats.
  - Excellent communication and collaboration skills, with the
    ability to influence technical decisions and drive
    alignment across teams.
  - Strong leadership skills, with a track record of mentoring
    and developing junior engineers.
  - Demonstrated ability to thrive in a fast-paced, dynamic
    environment and deliver results under tight timelines.

  Desired

  - Contributions to OSS projects is a bonus
  - Familiarity with data modeling, data warehousing, and ETL
    processes is a plus.

  Location

  This role will be remote, and based in the United States.
  This role will be remote but is not eligible to be hired in
  CA, WA, NY, NJ, PA or CT.

  Travel

  We prioritize connection and opportunities to build
  relationships with our customers and each other. For this
  role, you may be required to travel occasionally to
  participate in project or team in-person meetings.

  Compensation

  *Please note the salary range information provided applies
  only to candidates residing in California, Colorado, Hawaii,
  Illinois, Maryland, Massachusetts, Minnesota, New Jersey,
  New York, Vermont, Washington D.C., and Washington State due
  to local requirements. Compensation for candidates in other
  locations will be discussed during the hiring process.
  Please note that hiring for this role is not restricted to
  the locations listed above.

  The estimated pay ranges for this role are as follows:

  - Based in Colorado, Hawaii, Illinois, Maryland,
    Massachusetts, Minnesota, Vermont or Washington D.C.:
    $171,120.00 to $213,900.00
  - Based in New York, New Jersey, Washington State, or
    California (outside of the San Francisco Bay area):
    $181,200.00 to $226,500.00
  - Based in the San Francisco Bay area, California: $201,280.00
    to $251,600.00.
  - This role may be eligible to participate in Twilio’s equity
    plan and corporate bonus plan. All roles are generally
    eligible for the following benefits: health care
    insurance, 401(k) retirement account, paid sick time, paid
    personal time off, paid parental leave.

  The successful candidate’s starting salary will be
  determined based on permissible, non-discriminatory factors
  such as skills, experience, and geographic location..

  Applications for this role are intended to be accepted until
  8/28/2026, but may change based on business needs.

