title: Senior Full Stack Engineer
company: Bilt
location: New York, USA
work_type: FULL_TIME
company_size: 200 Employees
description: |
  What is Bilt?

  Bilt is the membership for where you live.

  What started as a way to reward people on their largest
  expense has turned into an ecosystem connecting our members,
  property managers and local merchants.

  Travel, dining, fitness, everyday spend. We are building
  systems across payments, credit, loyalty, and commerce all
  at once.

  We run lean and move quickly. Every person here has a real
  impact on what gets built and how fast it happens.

  This role comes with real ownership and high expectations.
  If you prefer clearly defined lanes and structure, this will
  feel uncomfortable. If you want to build quickly, have a
  real say in what gets built, and work on products used by
  millions, you will likely do your best work here.

  What’s the role?

  As a Senior Full Stack Engineer, you'll work on high-impact
  projects that directly shape how our members interact with
  Bilt's most exciting initiatives. From powering our hit game
  show "Rent Free" to developing exclusive member experiences
  and Rent Day benefits, you'll be at the forefront of
  creating memorable digital touch-points that make renting
  more rewarding.

  In this role you will:

  - Own projects end-to-end—from technical scoping and
    architecture through deployment and production support
  - Participate in code reviews, technical discussions, and
    architectural decision-making
  - Work across the stack as needed, adapting to the demands of
    different projects and problems
  - Architect and build scalable web applications and services
    that serve millions of Bilt members
  - Develop and maintain backend services using Node.js
    frameworks (NestJS, Hono, Express)
  - Build performant frontend experiences using Next.js, React,
    and React Native
  - Collaborate with design teams to use our design system
    across web and mobile platforms
  - Work with relational databases (PostgreSQL) to design
    schemas, optimize queries, and ensure data integrity
  - Implement and maintain observability practices including
    structured logging, distributed tracing, and monitoring

  In terms of qualifications, we’re seeking:

  - 6+ years of professional software development experience
  - Strong proficiency in React, TypeScript, and modern
    JavaScript
  - Hands-on experience with Node.js backend development using
    frameworks like NestJS, Express, or Hono
  - Experience with Next.js and/or React Native for building
    production applications
  - Solid understanding of relational databases (PostgreSQL
    preferred), including data modeling and query optimization
  - Familiarity with state management patterns and libraries
    (Redux or similar)
  - Experience working with design systems and component
    libraries
  - Understanding of observability fundamentals: logging,
    tracing, metrics, and alerting
  - Experience designing systems that scale—caching strategies,
    async processing, API design
  - Proficiency with Git and modern CI/CD workflows
  - Strong problem-solving skills and attention to detail
  - Solid understanding of RESTful APIs and web services
  - Excellent communication and collaboration abilities

  You'll thrive here if you:

  - Are excited about working across the full stack and don't
    box yourself into "frontend" or "backend"
  - Take ownership and see things through—you don't throw
    problems over the wall
  - Communicate clearly and collaborate well; you're a team
    player who doesn't deflect or finger-point
  - Are comfortable with ambiguity and can drive projects
    forward with minimal hand-holding
  - Care about code quality, testing, and building things that
    last
  - Embrace an AI-augmented development workflow—you actively
    use tools like Claude Code, Cursor, and/or Devin as part
    of how you build, debug, and ship software

  Benefits:

  - Compensation - We offer a competitive salary with a
    meaningful stake in the company via equity and our
    performance bonus program
  - Health insurance for you (& your loved ones) from day one -
    Enjoy a One Medical Membership, wellness stipends, family
    programs and more, on us. We’ve got you and your family
    covered from day one.
  - 401k plan with a match - Retirement may feel more like a
    pipe dream than a reality but we’re here to help you get
    there.
  - Commuter FSAs - We believe the best ideas come from being
    together in one place. We just don’t think getting there
    should be so expensive.
  - UNLIMITED PTO - Because we believe that working hard
    shouldn’t mean always working. Take time for you as often
    as you need it.
  - Exclusive Employee only Bilt Points - We give our employees
    unique opportunities to earn points throughout their time
    at Bilt.

  At Bilt Rewards, we believe in transparency and we do our
  best to make sure the company and our candidates are on the
  same page as it relates to compensation. In addition to
  posting salary ranges for our open roles, candidates should
  expect to be asked about compensation expectations and
  requirements early on in their interview process. Our goal
  is to highlight when expectations and Bilt’s salary range
  may be out of sync, and work with the candidate to determine
  whether it makes sense to continue conversations.

  We are considering candidates with differing levels of
  expertise for this position. Leveling will be based upon
  your experience and performance in the interview process.

  Where a new hire falls within a range will be based on their
  individual skills and experience, and how these competencies
  compare across other employees in the same role. Bilt's
  bands are designed to allow for individual compensation
  growth within the role. As such, new hires typically start
  at the lower end of the range. Bilt rewards performance and
  outcomes - should you join the company, you will have the
  opportunity to grow your salary over time.

  The salary range for a Senior Full Stack Engineer is
  $175,000-$250,000 and will be eligible for equity and an
  annual performance-based bonus.
