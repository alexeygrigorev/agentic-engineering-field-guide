description: |
  About the company

  Our client is a healthcare technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Own the delivery of web application features across both the
  server and the browser, partnering with colleagues in
  product, design and engineering leadership. The work also
  involves connecting to external systems and keeping deployed
  services dependable.

  What you'll do

  - Design, ship and maintain end-to-end web features spanning
    backend services and a browser-based interface.

  - Connect the platform to third-party records systems, older
    legacy software and live voice services.

  - Work alongside product managers, designers and senior
    engineers to translate user requirements into working
    releases.

  - Troubleshoot production issues and tune the stability, speed
    and capacity of running services.

  - Participate in design discussions and peer code reviews, and
    help refine team engineering practices.

  Requirements

  What we're looking for

  - A standout career marker, for example recent work at a
    leading technology firm, a quick-moving startup or a
    highly selective university, as opposed to a background
    mostly in slow-paced large organizations.

  - A self-directed builder who delivers quickly in a startup
    setting with minimal supervision.

  - Hands-on production ownership of a Node.js and TypeScript
    backend as well as a React frontend.

  - A track record of taking new products from initial concept
    to live release.

  - A degree in computer science or a comparable technical
    field.

  - Strong product instincts and design sensibility, with
    experience creating user-friendly interfaces.

  Bonus points

  - Exposure to large language models and voice technologies.

  Benefits

  Compensation and benefits

  - Base salary: USD 150,000 to 230,000 per year

  - Equity

  - Health, dental and vision coverage

  - Commuter benefits

  - Flexible time off

  Location and work model

  - New York, New York, United States

  - On-site, 5 days per week in office

  - Full-time
