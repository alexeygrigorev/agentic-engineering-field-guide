description: |
  Company:Marsh

  Description:

  You will lead the engineering team that designs, builds, and
  runs front office investment applications used by the UK
  investment business team. This is a hands-on technical
  leadership role focused on delivering robust solutions
  across a mix of in-house applications and vendor platforms.

  Working closely with the business, you will help shape
  requirements, design effective solutions, and oversee the
  implementation and support of business-critical investment
  applications. You will manage a team of 6 software engineers
  and collaborate closely with broader global technology teams
  to ensure alignment, consistency, and high engineering
  standards.

  We will count on you to:

  - Lead and develop the UK Investment Engineering team of 6
    engineers
  - Partner closely with front office stakeholders to understand
    priorities, challenges, and opportunities.
  - Apply AI tools and techniques to improve software delivery,
    code quality, and engineering productivity.
  - Learn our technology architecture and systems, with a focus
    on investment management, trading systems, and the data
    lake.
  - Collaborate with the broader Engineering team to understand
    standards, practices, and architecture.
  - Perform technical analysis to identify root causes of issues
    and support timely resolution.
  - Design and implement technical changes and improvements
    across key applications and services.
  - Take an active role in coding, code reviews, and technical
    decision-making.

  What you need to have:

  - A degree in a financial, technological, mathematical, or
    scientific discipline, or equivalent practical experience
    with a strong analytical foundation.
  - Experience in an engineering or software development role
    within investment management, ideally with exposure to
    front-office teams.
  - Practical experience using AI tools in software development,
    with an understanding of how to apply them responsibly and
    effectively.
  - Current experience with C# and Python, and a genuine passion
    for software development.
  - Strong SQL skills.
  - Experience designing robust data flows and systems.
  - Strong, clear, and concise communication skills, both verbal
    and written.
  - A strong sense of responsibility and commitment to quality.
  - A self-driven, motivated work ethic.
  - A collaborative, energetic, and enthusiastic approach.

  What makes you stand out?

  - IMC or another investment management qualification.
  - Experience with Apache Airflow.
  - Experience with Databricks.
  - A passion for design and architecture.

  Why join our team:

  - We help you be your best through professional development
    opportunities, interesting work and supportive leaders.
  - We foster a vibrant and inclusive culture where you can work
    with talented colleagues to create new solutions and have
    impact for colleagues, clients and communities.
  - Our scale enables us to provide a range of career
    opportunities, as well as benefits and rewards to enhance
    your well-being.

  Marsh (NYSE: MRSH) is a global leader in risk, reinsurance
  and capital, people and investments, and management
  consulting, advising clients in 130 countries. With annual
  revenue of over $27 billion and more than 95,000 colleagues,
  Marsh helps build the confidence to thrive through the power
  of perspective. For more information, visit marsh.com, or
  follow us on LinkedIn and X.

  Marsh is committed to embracing a diverse, inclusive and
  flexible work environment. We aim to attract and retain the
  best people and embrace diversity of age background, civil
  partnership status, disability, ethnic origin, family
  duties, gender orientation or expression, gender
  reassignment, marital status, nationality, parental status,
  personal or social status, political affiliation, race,
  religion and beliefs, sex/gender, sexual orientation or
  expression, skin color, or any other characteristic
  protected by applicable law. We are an equal opportunities
  employer. We are committed to providing reasonable
  adjustments in accordance with applicable law to any
  candidate with a disability to allow them to fully
  participate in the recruitment process. If you have a
  disability that may require reasonable adjustments, please
  contact us at reasonableaccommodations@marsh.com.

  Marsh is committed to hybrid work, which includes the
  flexibility of working remotely and the collaboration,
  connections and professional development benefits of working
  together in the office. All Marsh colleagues are expected to
  be in their local office or working onsite with clients at
  least three days per week. Office-based teams will identify
  at least one “anchor day” per week on which their full team
  will be together in person.
