description: |
  We are open to hiring at multiple levels for this role,
  depending on experience, impact, and demonstrated ownership.
  While this role is level-agnostic, it is best suited for
  engineers with experience owning production systems and
  working in highly ambiguous problem spaces.

  Software Engineer

  About the company:

  In the coming decades, demand for critical minerals such as
  copper, lithium, and cobalt will continue to grow. These
  minerals are needed to build electric infrastructure,
  vehicles, data centers, and electronics. However, the mining
  industry is making 10x fewer discoveries per dollar spent on
  exploration compared to 30 years ago because the easy-to-
  find, near surface deposits have largely been discovered.

  KoBold was founded to be the first AI native mineral
  exploration, mine development, and technology development
  company. Our goal is to turn mineral exploration into a
  repeatable science to discover the minerals the world
  needs—by integrating artificial intelligence, human
  intelligence, and new technology. Our multidisciplinary
  teams of data scientists, engineers, and geologists work
  together to build data systems, design new sensors, and
  establish industry-leading workflows to develop and test
  subsurface predictions on our exploration projects.

  Our first discovery, Mingomba, is a high-grade copper
  deposit in Zambia, found after spending materially less than
  industry average. We are developing Mingomba with the same
  technical rigor that we apply to exploration. The Mingomba
  team brings together mine and processing engineers,
  geologists, data scientists, software engineers, and
  community, health & safety, construction, and operations
  specialists. By combining industry knowledge and cutting
  edge technology, we are developing Mingomba into a world
  class project that has safer and more predictable outcomes
  for ourselves, partners, and communities. It is expected to
  create thousands of good jobs for generations.

  KoBold runs exploration programs in eight countries, all
  with the potential for another discovery.

  KoBold is privately held; investors include institutional
  asset managers T. Rowe Price and Canada Pension Plan
  Investments; technology venture capitalists Andreessen
  Horowitz, Breakthrough Energy Ventures, BOND Capital,
  Durable Capital, StepStone, and Standard Investments; and
  strategic natural resources companies BHP and Mitsubishi.

  We are hiring Software Engineers to accelerate our mission.

  About The Role:

  At KoBold, software engineers have the unique opportunity to
  embed directly with their users and learn the ins and outs
  of mineral exploration and geology while developing state of
  the art technology solutions. Unlike traditional software
  engineering roles, we don’t simply ship code and passively
  wait for feedback about its utility: our userbase includes
  our colleagues… and ourselves! While there are real
  technical challenges in making mineral exploration data
  broadly searchable and accessible to both humans and
  machines, we believe that solving these technical challenges
  cannot be done without “getting our hands dirty” – sometimes
  literally! – by embedding directly with the exploration
  teams and even occasionally (~once a year) joining our
  colleagues in the field, be it in Zambia, Canada, or
  Arizona, to experience the impact of our software in real
  time.

  As a Software Engineer on the Data Systems Engineering team
  at KoBold, your main role will be to enable systematic
  exploration and materially improve exploration success rates
  by making mineral exploration data broadly accessible to
  humans and machines.  Past projects have included SIP (the
  Structured Ingest Pipeline), DataKit generation (producing
  curated sets of data on demand), and RAG (Retrieval
  Augmentation Generation, utilizing natural language
  processing on unstructured data). Our tech stack is
  primarily python and includes Django, React, AWS, and
  additional technologies like Retool and Prefect.

  Your work will empower KoBold to unlock invaluable insights
  and streamline intricate scientific processes. Collaborating
  with our exceptional team of data scientists, geologists,
  and other software engineers, you will have the opportunity
  to tackle complex problems head-on and collectively pave the
  way for the discoveries of vital energy transition metals
  like lithium, copper, nickel, and cobalt. Together we can
  shape the future of mineral exploration and contribute to
  building a sustainable world.

  This role be responsible for:

  - Deep engagement with exploration geologists and data
    scientists, continual learning about mineral exploration,
    and tailoring technology development to the needs of
    exploration project scientists
  - Building data pipelines and tooling for deriving advanced
    human and machine insights from exploration data, often
    leading a small group of software engineers to successful
    delivery
  - Developing expertise in KoBold’s Data Systems and deeply
    understanding how they impact exploration
  - End-to-end ownership of projects from design to
    implementation and testing to continued engagement with
    colleagues on exploration teams using your solutions
  - Responding well to design and code feedback, also providing
    feedback to teammates
  - Operationally managing the team’s services and assisting
    scientific colleagues with our tooling

  Qualifications

  - 4+ years of software engineering experience, ideally
    building production cloud data systems
  - Proficiency with Python
  - Ability to write production-quality code that is correct,
    readable, well-tested, scalable and extensible
  - Skilled in large-scale system design
  - A track record of taking ownership from definition of the
    problem and delivering projects with demonstrated impact
    in an iterative manner
  - Intellectual curiosity and eagerness to learn about all
    aspects of mineral exploration, particularly in the
    geology domain. Enjoys constantly learning such that you
    are driving insights through using our tools in
    exploration and willing to work directly with geologists
    in the field.
  - Ability to explain technical problems to and collaborate on
    solutions with domain experts who are not software
    developers. A strong communicator who enjoys working with
    colleagues across the company.
  - Excitement about joining a fast-growing early-stage company,
    comfort with a dynamic work environment, and eagerness to
    take on an evolving range of responsibilities.
  - Keen not just to build cool technology, but to figure out
    what technical product to build to best achieve the
    business objectives of the company.

  Nice to Haves

  - Experience with modern frontend frameworks such as React
  - Experience with geospatial data and building map-based
    experiences
  - Familiarity with containerization and container
    orchestration platforms, such as Docker, AWS ECS,
    Kubernetes, etc.
  - Formal education or job exposure to natural sciences

  The UK base salary range for this full-time exempt position
  is $120,000 - $210,000 USD.

  Location: Remote, Candidates can be located anywhere in the
  United Kingdom.

  What to Expect

  Joining KoBold means getting the opportunity for hands-on
  exposure to our exploration projects around the world. All
  employees are expected to travel to project sites, with a
  minimum of one week per year. Field-facing and technical
  roles spend significantly more time in the field.

  Compensation ranges are listed in USD. If you are based
  outside the US, the range may not translate directly: US pay
  reflects a different market with different competitive
  dynamics, so we benchmark roles against the local market
  rather than converting the listed figure.
