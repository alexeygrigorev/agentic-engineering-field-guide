description: |
  Frontend Engineer

  Location: Remote, United States

  Help create seamless digital experiences that support people
  on their hearing journey. As a Frontend Engineer, you will
  build and evolve customer-facing web experiences for Jabra
  Enhance, translating thoughtful design into accessible,
  high-performing products.

  In the role of Frontend Engineer in the Engineering team,
  you will contribute to our purpose of Bringing People
  Closer. You will own key web-based customer journeys from
  technical design through delivery, partnering closely with
  design and engineering colleagues to create intuitive,
  reliable customer experiences.

  The Team you will be part of

  · You will join the Growth Engineering organization,
  reporting to the Senior Engineering Manager, Growth.

  · The team develops digital products and experiences that
  help customers discover, access, and engage with Jabra
  Enhance solutions.

  · We work collaboratively across engineering, design, and
  product, combining customer focus, technical curiosity, and
  a commitment to quality outcomes.

  · We value practical problem-solving, open communication,
  and continuous improvement.



  Your contribution is appreciated, and you will

  · Develop and enhance customer-facing features and end-to-
  end web journeys using React.js, JavaScript, CSS, Relay, and
  GraphQL

  · Plan, architect, build, and maintain core external-facing
  web applications

  · Partner with design to translate UI/UX concepts into
  accessible, intuitive, and technically feasible experiences

  · Create reusable components, code, and libraries that
  support scalable product development

  · Improve application performance, reliability, and
  efficiency through debugging, profiling, and optimization

  · Participate in code refactoring and architecture reviews
  to support maintainable, high-quality solutions

  · Contribute to Agile ceremonies and collaborate with
  colleagues during East Coast business hours

  To perform well in the role, we imagine that you

  · Bring experience developing modern web applications with
  React.js and contemporary JavaScript libraries and tooling

  · Have a solid understanding of HTML rendering, CSS,
  JavaScript, single-page applications, and client-side and
  server-side rendering

  · May have experience with server-side technologies, such as
  Node.js

  · Bring demonstrated attention to design, usability, and the
  customer experience

  · Have experience as a Frontend or Full stack Engineer and
  enjoy working collaboratively to deliver results

  · Have Experience with Shopify - Liquid, Storefront/Admin
  APIs, theme or app development. Preferred, not required



  Pay Transparency Notice

  · The target annual compensation for this position can range
  from $135,000.00 to $150,000.00, with a discretionary bonus
  if you are an active employee as of the fiscal year-end.

  ·  Compensation for roles at GN depends on a wide array of
  factors including but not limited to location, role, skill
  set, and level of experience.

  We encourage you to apply

  We highly value a mindset and motivation that align with our
  core values, to not only ensure growth for you, but for your
  team and the wider GN organization as well.

  We are committed to an inclusive recruitment process

  GN welcomes applicants from all backgrounds and applicants
  will receive equal consideration for employment. We make
  life sound better by developing intelligent sound solutions
  that transform lives through the power of sound, enabling
  you to hear more, do more & be more than you ever thought
  possible.



  Disability Accommodation

  If you have a disability and you believe you need a
  reasonable accommodation in order to search for a job
  opening or to submit an online application, please e-mail
  careers.us@gn.com or call 978-606-2210. This email and phone
  number is created exclusively to assist disabled job seekers
  whose disability prevents them from being able to apply
  online. Only messages left for this purpose will be
  returned. Messages left for other purposes, such as
  following up on an application or technical issues not
