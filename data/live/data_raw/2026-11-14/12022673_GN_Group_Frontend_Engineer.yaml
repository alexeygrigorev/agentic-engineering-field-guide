  Join us in bringing people closer GN brings people closer
  through our advanced intelligent hearing, audio, video, and
  gaming solutions. Inspired by people and motivated by
  innovation, we deliver technology that enhances the senses
  of hearing and sight. We enable people with hearing loss to
  overcome real-life problems, improve communication and
  collaboration for businesses, and provide great experiences
  for audio and gaming users.

  GN Store Nord A/S has entered into a definitive agreement
  for the sale of GN’s Hearing business to Amplifon S.p.A. to
  create a global leader in audiology. For GN Group, this
  creates an opportunity to expand our position in the large
  audio and video peripherals markets. Read more about the
  announcement here.

  For the purpose of processing your job application, GN will
