description: |
  About Kontakt.io

  Inside health systems, where every second can matter,
  operations are still spread across dozens of disconnected
  tools and platforms. Kontakt.io is changing that.

  We combine proprietary hardware, AI-powered intelligence,
  and deep integrations with the technology health systems
  already have in place to build real-time understanding of
  what's happening across their operations. That intelligence
  becomes the execution layer care teams have been missing,
  helping them make smarter decisions and deliver better
  patient care.

  Backed by Goldman Sachs and trusted by leading health
  systems including HCA Healthcare, Sutter Health,
  AdventHealth, Trinity Health, Northwell Health, Cleveland
  Clinic, and the U.S. Department of Veterans Affairs, we’ve
  more than doubled our revenue and are rapidly scaling with a
  clear path toward $100M in annual recurring revenue.

  If you're excited to solve hard problems and help health
  systems deliver better care, we'd love to meet you!

  Senior Software Engineer

  About This Role As a Senior Software Engineer at Kontakt.io,
  you'll build the systems that orchestrate patient
  milestones, identify and prioritize discharge barriers, and
  prevent unit-level bottlenecks before they happen. You'll
  work across the stack, from data models to user-facing
  tools, automating escalations and high-census communications
  across hospital operations. This is a small, product-focused
  team, so you'll have real ownership from day one: proposing
  solutions, not just executing tickets.

  What You’ll Do

  - Design and build APIs that are simple to use, fast to
    respond, and scalable
  - Build and design UIs for frontend applications
  - Develop and deploy container-based applications
  - Contribute to event-sourced architecture (Kafka and similar
    tooling)
  - Build new products from the ground up as part of a small,
    high-ownership team

  What You Have

  - 4+ years backend experience (Java/Kotlin, Python)
  - 2+ years building and designing UIs for frontend
    applications (Angular)
  - Experience with both OOP and functional programming
  - 2+ years developing and deploying container-based
    applications
  - Strong Computer Science fundamentals

  Bonus Points If You Have

  - Experience with event-sourced architectures (Kafka or
    similar)
  - Background in healthcare, IoT, or another highly regulated
    industry

  Logistics, Perks & Benefits

  - Built for collaboration - our team a hybrid schedule of 3
    days/week minimum from our New York City office
  - Equity in a high-growth company scaling toward $400M+ ARR
    and backed by leading investors
  - Full health, dental, and vision coverage, a 401k, paid time
    off, paid parental leave and all the tools you need to do
    your best work
  - Autonomy to solve meaningful problems with work that ships
    quickly and makes a difference

  Compensation

  The expected salary range for this role is $200,000 –
  $250,000 for New York-based candidates. Actual compensation
  within this range will be determined based on relevant
  experience, skills, and qualifications. In exceptional
  cases, where a candidate’s experience or qualifications
  significantly exceed those anticipated for this role, we may
  consider the candidate for a more senior level. This role
  may also be eligible for equity and bonus compensation.

  Ready to Build the Future of Healthcare?

  Apply now and help to build the platform that care
  operations run on. 🚀
