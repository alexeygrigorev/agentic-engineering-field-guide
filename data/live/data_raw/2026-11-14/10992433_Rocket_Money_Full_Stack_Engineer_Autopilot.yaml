description: |
  ABOUT ROCKET MONEY 🔮

  Rocket Money’s mission is to meaningfully improve the
  financial prosperity of millions of people. Rocket Money
  offers members a unique understanding of their finances and
  a suite of valuable services that save them time and money –
  ultimately giving them a leg up on their financial journey.

  ABOUT THE TEAM 🤝

  The Autopilot team sits within the Financial Products &
  Partnerships group at Rocket Money and is responsible for
  helping our members hit important financial milestones more
  easily by leveraging technology. We’re a small team of
  experienced builders who can balance moving quickly with
  operating diligently in order to responsibly manage other
  people’s money. After building software tools and financial
  products that have helped millions of people save money,
  we’re now building an entire ecosystem to go beyond saving
  money and into helping our members build lasting wealth.

  IN THIS ROLE, YOU'LL:

  - Make key decisions for the future of our banking and
    investment systems that balance technical concerns with
    business concerns.
  - Build user interfaces using React and build back-ends in
    Node & GraphQL.
  - Collaborate with cross-functional stakeholders to understand
    nuanced business needs and communicate technical
    complexity and tradeoffs clearly when requirements evolve.
  - Architect scalable solutions that may differ from initial
    requests but better serve the underlying business
    objectives and long-term technical sustainability.
  - Own the full lifecycle of Autopilot technology, from initial
    planning and development through ongoing production
    maintenance and optimization.

  ABOUT YOU 🦄

  - You have 3+ years of professional experience working with
    some combination of Node, Javascript, React/React Native,
    GraphQL, and Postgres or similar relational database.
    (Typescript a plus)
  - You're not just interested in what you're building, but also
    why you're building it. You want to see the bigger picture
    of how the software you're building is benefitting our
    users.
  - You understand observability and enjoy digging into the
    details to solve performance and user experience issues.
  - You’re motivated to understand the intricacies of vendor
    integrations, you have an understanding of the challenges
    that come with them and you can investigate and solve any
    related issues.
  - You're both a student and a teacher, continually seeking to
    grow as an engineer and help those around you grow as
    well.
  - You thrive in a growing organization, and are not afraid of
    a challenging problem. In fact, you confront problems head
    on and take the lead on the solution.

  WE OFFER 💫

  - Health, Dental & Vision Plans
  - Life Insurance
  - Long/Short Term Disability
  - Competitive Pay
  - 401k Matching
  - Team Member Stock Purchasing Program (TMSPP)
  - Learning & Development Opportunities
  - Tuition Reimbursement
  - Unlimited PTO
  - Daily Lunch, Snacks & Coffee (in-office only)
  - Commuter benefits (in-office only)

  Additional Information: Salary range of $130,000 -
  $170,000/year + bonus + benefits. Base pay offered may vary
  depending on job-related knowledge, skills, and experience.

