description: |
  Why Work Here?

  At Arkatechture, we have a simple shared mission: to build a
  sustainable organization built upon three pillars:  Do
  something meaningful, With a great team, Earning what you
  deserve.

  Founded in 2012, Arkatechture has grown into a nationally
  recognized data and technology company, partnering with
  organizations across the fintech, AI, and financial services
  spaces. We combine deep industry knowledge with technical
  expertise to help our clients unlock the full potential of
  their data. Whether it’s modernizing infrastructure,
  building analytics platforms, or leveraging AI for smarter
  decision-making, we thrive at the intersection of innovation
  and impact.

  Our team is made up of curious, collaborative, and
  community-minded professionals who are passionate about
  solving complex problems and staying ahead of what’s next in
  data and technology. While our roots are in New England, our
  reach is nationwide, and we support flexible, remote-
  friendly work to match.

  We offer a competitive benefits package that includes:

  - A flexible remote work policy with optional access to our
    Portland, Maine office
  - A 4-day workweek after 3 years of service
  - Generous paid time off, including 11 holidays
  - Medical, disability, life insurance, and optional
    dental/vision
  - 401(k) retirement plan with company match
  - Training & certification reimbursement
  - Milestone recognition programs, annual PTO increases, and
    more

  All employees share our core values: put the team first,
  practice humility, take pride in everything we do, stay
  curious, care for our community & environment, take work
  seriously; ourselves not so much.

  The Position

  Arkatechture is seeking a Software Engineer to join our
  Support Services team, supporting our Arkalytics platform
  and related data warehousing and analytics solutions.

  This role combines software engineering, cloud operations,
  and customer support. You'll investigate complex production
  issues, develop permanent solutions, improve platform
  reliability, and build tools and automation that make our
  products better for customers and teammates alike.

  You'll work closely with engineers, customers, and product
  experts to resolve technical challenges while continuously
  improving the stability, performance, and scalability of our
  platform.

  How to Apply

  Please send a cover letter and resume with your application.
  You must submit both documents to be considered for the
  position. We’re building a diverse team of people who care
  about doing meaningful work with great people. If that
  excites you, apply and let’s start the conversation. To help
  us get to know you, please include your resume and answer
  the following question in the cover letter section of your
  application:

  Describe a production issue or customer-facing technical
  problem you personally investigated and resolved. What was
  the issue, how did you troubleshoot it, what tools, logs,
  queries, or data did you use to identify the root cause, and
  what did you ultimately change or implement to resolve it?
  (250 words or less.)

  Key Responsibilities

  - Troubleshoot and resolve complex production issues across
    the Arkalytics platform.
  - Develop software enhancements, bug fixes, and automation
    that improve platform stability and customer experience.
  - Investigate application, database, and cloud infrastructure
    issues within AWS environments.
  - Perform root cause analysis and implement long-term
    solutions to prevent recurring issues.
  - Build and maintain clean, reliable, and well-tested code.
  - Improve monitoring, alerting, logging, and operational
    tooling.
  - Collaborate with Support Services, Customer Success,
    Product, and Engineering teams to resolve customer issues
    efficiently.
  - Participate in Tier 2 and Tier 3 production support and
    shared on-call rotations.
  - Contribute to system documentation, knowledge sharing, and
    continuous process improvements.
  - Participate in code reviews and help maintain high
    engineering standards.
  - Stay current with emerging technologies and recommend
    improvements that enhance our platform.
  - Additional responsibilities as assigned.

  Skills, Knowledge and Expertise

  - 3+ years of professional software engineering experience.
  - Bachelor's degree in Computer Science, Engineering, or a
    related field, or equivalent professional experience.
  - Proficiency developing or supporting applications in AWS.
  - Strong programming skills in Python or another object-
    oriented language.
  - Solid SQL skills and experience working with relational
    databases (Snowflake or Databricks).
  - Familiarity with REST APIs, SDKs, and command-line tools.
  - Ability to work with structured data formats such as JSON,
    XML, and CSV.
  - Strong troubleshooting, debugging, and root cause analysis
    skills in production environments.
  - Familiarity with containerized and cloud-native technologies
    such as Docker, ECS, Fargate, Kubernetes, or microservices
    is a plus.
  - Knowledge of NoSQL databases such as DynamoDB is a plus.
  - Comfort working in Linux or Unix environments.
  - Understanding of data warehousing, business intelligence, or
    analytics platforms.
  - Familiarity with Git, Jira, Confluence, and Slack.
  - Experience working in Agile software development
    environments.
  - AWS certification is preferred, or a willingness to obtain
    one.
  - Familiarity with CI/CD pipelines and DevOps practices is a
    plus.
  - Financial services industry experience is a plus.
  - Strong written and verbal communication skills, with the
    ability to explain technical concepts to both technical
    and non-technical audiences.
  - A collaborative mindset, intellectual curiosity, and a
    passion for continuous learning.

  About At Arkatechture, we love data — we play with it and
  learn from it every day, and we want you to love your data,
  too. We are a data consultation and services company
  specializing in data quality, visualization, and management,
  as well as customized enterprise-level solutions. We work
  with companies big and small to help solve their data
  challenges and reveal how they can leverage their data in
  brand new ways. Need to collect, clean, or visualize your
  data? We can help.
