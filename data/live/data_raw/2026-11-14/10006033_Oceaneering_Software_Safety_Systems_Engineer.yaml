description: |
  The Software Safety Engineer serves as the key resource for
  Oceaneering Technologies (OTECH) system safety related needs
  for the robotic and autonomous vehicles we build and design.
  This position will require a solid foundation in fielding
  underwater systems that meet rigorous government system
  safety standards using the methods defined in MIL-STD-882.


  The Software Safety Engineer applies a working knowledge of
  systems engineering fundamentals for submersible systems,
  including HM&E (hull, mechanical, and electrical) and
  Software. This person will work with other OTECH

  Responsibilities

  - Implement a software safety program in accordance with MIL-
    STD-882 for one or more programs.
  - Provide direction and oversight for Level of Rigor tasks
    consistent with the assessed criticality of system
    software.
  - Ownership of the following deliverables:
    - Software Safety Plans
    - System Requirements Hazard Analysis
    - Functional Hazard Analysis
    - Software Safety Assessment Report
  - Assist in development and reviews of other safety analyses
    defined in MIL-STD-882 as applicable to each program.
  - Track and report software statement/branch coverage metrics.
  - Catalog and maintain software safety related software
    development artefacts such as the results of code reviews,
    safety testing, and qualification testing.
  - Act as an independent safety reviewer of software under
    development.
  - Prepare and present material at recurring customer-facing
    System and Software Safety Working Group (WG) meetings.
  - Prepare and present safety engineering slides at major
    design reviews and other milestone and key event meetings.
  - Schedules can be demanding throughout the year and
    occasional work outside normal working hours should be
    anticipated.
  - Occasional travel should be anticipated.SUPERVISORY
    RESPONSIBILITIES
  - Works with program leadership to ensure that systems
    engineering tasks, specifically those affecting system
    safety products, are completed in a timely manner,
    including tasking engineering personnel to complete
    analyses, trade studies, tests, etc.
  - Coordinate implementation of software safety programs across
    OTECH to ensure consistency in the methodology and the
    quality of deliverables.

  Qualifications

  ESSENTIAL QUALIFICATIONS

  - BS Degree in Systems Engineering, Computer Science,
    Mathematics, Computer Engineering, Electrical Engineering,
    Mechanical Engineering or related technical field.
    Commensurate experience will be considered.
  - 5+ years of practical experience in systems, safety,
    software or quality engineering.
  - Proficiency understanding the following programming
    languages: C, C++, C#, Python and/or Java.
  - Capable of producing software safety plans and executing to
    them.
  - Attention to detail and interest in designing safety
    compliant underwater systems.
  - Ability to obtain and maintain a United States Government
    Department of Defense Security Clearance.
  - Must be a US citizen.

  PREFERRED QUALIFICATIONS

  - Understanding of MIL-STD 882E “Department of Defense
    Standard Practice System Safety” or equivalent standard.
  - Experience conducting safety hazard analyses such as
    Preliminary Hazard List (PHL), Preliminary Hazard Analysis
    (PHA), or Functional Hazard Analysis (FHA).
  - Experience creating System/Software Safety Assessment
    Reports and Plans (SSAR).
  - Experience with VectorCAST or automated test tools (Jacoco,
    McCabe, MSTest, NUnit).
  - Experience with Jira and Github.
  - Solid written and oral communications skills, including
    ability to effectively document, convey, and present
    engineering concepts and products to team members and
    customers.
  - Experience with US Department of Defense programs or the
    field of ocean engineering.

  We offer a comprehensive and competitive benefits package.
  Employee benefits vary by role, however, may include Health
  and Wellness, Mental Health, Retirement Savings, Life and
  Disability, Paid Maternity and Parental Leave, Paid Time
  Off, Tuition Reimbursement, and an Employee Assistance
  Program.



  Compensation $94,100.00 - $141,100.00

