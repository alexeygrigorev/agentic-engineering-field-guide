description: |
  About Us

  We are Ocado Group, and we're bringing world-class
  automation to online grocery. Our Ocado Smart Platform (OSP)
  combines cutting-edge robotics, AI, and IoT within our
  advanced CFCs (Customer Fulfilment Centres). We've mastered
  the single pick, transforming online delivery for our global
  partners. Join us and be part of a team pushing the
  boundaries of retail technology.

  About the role

  We are currently looking for experienced Engineering Team
  Manager to be part of Ocado history, joining us at our
  operational Customer Fulfilment Centre in Erith, Kent. You
  will be leading a team of Engineers, Technicians and
  Trainees, driving their success by assessing their
  capabilities, identifying development opportunities and
  motivating them on a daily basis. You will play an
  instrumental part in the day-to-day allocation of workload
  and be involved in any disciplinary issues.

  As an Engineering Team Manager, you need to be able to lead
  from the front, driving pace, accuracy and standards across
  all aspects of the CFC. As part of this you will need to be
  a competent and experienced Engineer in your own right,
  either mechanically or electrically, although you must be
  familiar and competent with both streams of engineering to
  enable decision making.

  You will work a shift pattern to support our 24/7 operation,
  consisting of 12 hour shifts across days, nights and
  weekends.

  About you

  You are a passionate leader who is looking to take the next
  step in growing your career. You will have experience in
  leading a team of Engineers within an automated FMCG
  environment, as well as being comfortable making critical
  decisions in a fast-paced role. Your technical ability
  relating to automation hardware and software will be second
  to none.

  You have a comprehensive understanding of production,
  picking and storage MHE systems.

  You are computer literate and have experience working with
  computerised maintenance management systems. You are also
  keen to learn new skills and take a creative approach to
  problem-solving. Health and safety is a top priority for
  you, and you are able to work safely at height.

  Ideally you have an Engineering HNC, or equivalent relevant
  Degree coupled with any of the following; relevant applied
  learning, Engineering Technician Apprenticeship, Electrical
  and/or mechanical skills preferably gained in an FMCG
  background to at least NVQ 3.

  What we offer you

  Our employee benefits are designed for you, we care about
  people and we’ve ensured we have a wealth of benefits that
  focus on your well-being. We regularly review our benefits
  to ensure we are supporting our employees appropriately.

  - Wellbeing support through dedicated apps and an Employee
    Assistance Programme
  - 264 hours annual leave, rising after 5 years service (plus
    optional holiday purchase)
  - Pension scheme (various options available including employer
    contribution matching up to 7%)
  - Generous Private Medical Insurance (within the first month
    of joining!)
  - Income Protection (can be up to 50% of salary for 3 years)
    and Life Assurance (3 x annual salary)
  - 22 weeks paid maternity/primary parent leave and 6 weeks
    paid paternity leave (once relevant service requirements
    complete)
  - Train Ticket loan (interest-free)
  - Cycle to Work Scheme
  - Opportunity to participate in Sharesave and Buy as You Earn
    share schemes
  - 15% discount on Ocado.com and free delivery for all
    employees (within the first month of joining!

  Financial assistance is available for eligible UK candidates
  relocating 35 miles or more for this role.

