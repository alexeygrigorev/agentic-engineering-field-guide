description: |
  Tabs is the AI Operating System for Revenue, built for
  modern finance and accounting teams. It combines deep
  revenue and accounting expertise with the agents and
  applications needed to run revenue work end to end. Tabs
  understands customer and contract context, applies
  accounting logic, and executes critical workflows with built
  in controls, auditability, and human oversight. With Tabs,
  finance teams can move from manually managing revenue
  workflows to directing outcomes while the system executes
  the work.

  About the Role

  Tabs is looking for a Senior Software Engineer to join our
  Platform team, reporting to the engineering leader who owns
  platform and infrastructure. Your customers are the
  engineers around you. The work is measured by a single
  question: can the rest of engineering ship faster because of
  what you built?

  Platform at Tabs is deliberately understated. We are the
  first and last line of defense — the layer that makes
  deploys boring, failures legible, and the path from commit
  to production short. What you'll experience is real
  leverage: every improvement you make compounds across every
  team.

  You'll own the foundation every other engineer builds on:
  build systems, CI/CD, infrastructure, developer tooling, dev
  containers, and the API infrastructure and standards teams
  build against. A lot of this work lives outside any product
  roadmap. It's ours to define, and we set the bar for the
  rest of engineering. You'll also help shape what's next,
  like the internal platform-as-a-service we're planning to
  build. All of it supports a product that runs the contract-
  to-cash lifecycle for high-growth companies, where
  reliability is measured in real money. We move on two-week
  cycles, and the platform keeps up.

  How We Operate

  - We work hard. Two-week sprints, weekly ship goals, short
    feedback cycles. Built around intra-month product
    releases.
  - We work smart. Get in front of the other engineering teams,
    use both data and customer feedback to drive decisions,
    while keeping the bigger picture in mind.
  - We work together. In-office culture with people you want to
    work with. Lots of whiteboard space. Expense coffee,
    lunch, and dinner when in the office.

  What You'll Do

  - Own platform and infrastructure work that shortens the path
    from an engineer's commit to production
  - Build and evolve the build systems, CI/CD, and developer
    tooling the whole engineering team relies on every day
  - Improve observability and operational tooling so problems
    surface early and are cheap to diagnose
  - Make hard tradeoffs on behalf of the wider engineering org,
    and explain the reasoning behind them
  - Partner with product engineering teams to find out what's
    actually slowing them down, then go fix it
  - Write production-quality code and automation across the
    stack, not just at the infrastructure layer

  Who You Are

  - You get genuine satisfaction from solving other engineers'
    problems
  - You'd rather build the thing nobody notices than the thing
    everyone sees
  - You dive deep instead of handing off, and you finish what
    you pick up
  - You make pragmatic calls under constraint and can defend
    them
  - You have no ego about it — this team operates as a team

  Experience

  - 5+ years of professional software engineering experience
  - Startup experience is a must — you've owned broad surface
    area at a company moving through a growth stage, not one
    narrow specialty on a large, heavily staffed team
  - Strong hands-on experience with cloud infrastructure, CI/CD,
    and build tooling
  - Fluency in TypeScript, Python, or a similar modern language,
    with the judgment to write code others will maintain
  - Experience operating production systems and reasoning about
    failure modes
  - Strong foundation in computer science and coding

  Perks and Benefits (Full-time Employees)

  - Competitive compensation and equity
  - Unlimited PTO
  - Up to 100% employer covered monthly healthcare premium
    (medical, dental, vision)
  - Lunch provided via Sharebite, plus dinner for any later in
    office days.
  - Parental leave up to 12 weeks
  - Tax free commuter and parking benefits
  - Voluntary insurances (Life, Hospital, Critical Illness,
    Accident)
  - Employee Assistance Program (Rightway)
  - Free One Medical Membership
  - 401k

  Tabs is an equal opportunity employer. We welcome teammates
  of all identities and do not discriminate on the basis of
  race, ethnicity, religion, gender identity, sexual
  orientation, age, disability, veteran status, or any other
  protected characteristic. We’re committed to creating an
  environment where everyone can grow, contribute, and feel
  comfortable being themselves.
