description: |
  Behind every investment is a person with ambitions,
  motivations and values. While we know that every client is
  unique, they come to J.P. Morgan Personal Investing for the
  same reason: our straightforward and transparent approach to
  investing, and the trust that 150 years of J.P. Morgan
  heritage brings.

  J.P. Morgan Personal Investing offers award-winning
  investments, products and digital wealth management services
  to over 275,000 investors in the UK. We built the business
  with innovation as a core part of our ethos to give
  consumers the confidence and clarity to make informed
  investment decisions and achieve their financial goals.

  As a Manager of Software Engineering at JPMorgan Personal
  Investing, you will be a credible engineering leader, in
  charge of a squad of engineers, technically savvy to
  influence your squad’s technical implementations and
  confident enough to challenge architecture decisions as you
  maintain focus on delivering initiatives and demonstrating
  customer value every step of the way.

   Our Invest team is at the heart of this venture, focused on
  getting smart ideas into the hands of our customers. We're
  looking for people who have a curious mindset, thrive in
  collaborative squads, and are passionate about new
  technology. By their nature, our people are also solution-
  oriented, commercially savvy and have a head for fintech. We
  work in tribes and squads that focus on specific products
  and projects – and depending on your strengths and
  interests, you'll have the opportunity to move between them.

  Job responsibilities:

  - Lead a squad of engineers to design, implement and maintain
    the payments area of the Invest Tribe within Chase UK.
  - Line-manage an engineering squad; set clear goals, support
    development and build up the team’s delivery capability.
  - Conduct thorough code reviews to ensure high-quality,
    maintainable, and efficient code, while providing
    constructive feedback to team members.
  - Engage in hands-on coding to contribute to the development
    of key features and solutions, demonstrating best
    practices and technical expertise.
  - Lead by example, setting high standards for code quality,
    work ethic, and collaboration within the squad.
  - Mentor and guide engineers in the squad, fostering a culture
    of continuous learning and improvement.
  - Collaborate with product managers and other stakeholders to
    align technical efforts with business goals and deliver
    impactful results.
  - Facilitate regular team meetings and retrospectives to
    promote open communication and address any challenges or
    roadblocks.
  - Collaborate with Technical Leads and Principal engineers to
    design robust, scalable, and maintainable technical
    solutions.
  - Operate with a data-driven mindset; establish and track
    metrics across delivery, systems health and customer
    journeys.
  - Foster an inclusive culture of high-quality engineering in
    your team and across the organization, implement best
    practices and aim for top engineering. standards·
  - Drives adoption and governance of approved AI-assisted
    engineering practices across teams to improve code
    quality, delivery speed, and operational outcomes (e.g.,
    AI-assisted code review/refactoring, test acceleration,
    release readiness, incident/root-cause analysis), while
    establishing measurable validation standards (secure
    coding, peer review, automated testing) and promoting
    reuse of proven patterns and automation within the
    SDLC/TLM toolchain.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including approved AI-assisted
    development and automation capabilities, to improve the
    value realized by automation at scale.

   Required qualifications, capabilities and skills:

  - Formal training or certification on team management concepts
    and proficient advanced experience.
  - Great team player with strong technical background, focused
    on achieving best outcomes collaboratively among a group
    of peers with equally strong technical views.
  - Business-driven mentality, you can understand business and
    product requirements and come up with an optimal
    engineering approach for a given problem.
  - Progressive mindset, you embrace challenging the status quo
    to faster achieve the business goals
  - Extensive experience with a JVM language Extensive
    experience in automating deployment, releases and testing
    in continuous integration, continuous delivery pipelines.
  - Proven track record in designing and operating microservices
    using Cloud technology and event driven architectures.
  - Strong people management qualities; focus on acquiring,
    retaining, and growing talent to form and evolve a highly
    effective delivery team
  - Demonstrated experience leading effective use of enterprise-
    authorized AI-assisted software development tools within
    the work environment (e.g., for coding, code review, test
    acceleration, troubleshooting) with the ability to set
    team expectations for validating AI outputs for
    correctness, performance, and security
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    senior engineers/leads on compliant usage patterns and
    controls.

