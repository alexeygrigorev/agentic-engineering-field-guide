description: |
  FlexTrade Systems is a provider of customized multi-asset
  execution and order management trading solutions for buy-
  and sell-side financial institutions. Through deep client
  partnerships with some of the world's largest, most complex
  and demanding capital markets firms, we develop the flexible
  tools, technology and innovation that deliver our clients a
  competitive edge. Our globally distributed engineering teams
  focus on adaptable technology and open architecture to
  develop highly sophisticated trading solutions that can
  automate and scale with your business strategies.

  At FlexTrade, we hold our values close to heart, with pride
  and gratitude, as they guide us in everything that we do. We
  are dedicated to giving our clients a competitive edge,
  taking ownership of our responsibilities, being flexible to
  adapt to ever changing environment and technology, bringing
  integrity to every interaction and we continue to improve,
  grow together and collaborate as one team. All of these
  while having Fun truly makes FlexTrade a wonderful place to
  work.

  Client Services Development team:

  Everyone with an idea is welcome to collaborate with our
  diverse Client Services team here at FlexTrade. We believe
  in having a sound Engineering process while at the same
  time, maintaining the belief that every process should
  evolve to enhance Development efficiency with designing new
  technologies and methodologies. We take pride in our ability
  to execute complex projects and deliver them on time to our
  customers. All this while having fun at work!

  What will you be doing:

  As a critical member of our Client Services Engineering &
  Development team, you will be responsible for:

  - Developing and implementing solutions for integrated
    FlexTrade Products.
  - This role will involve C++ programming on Unix Environment
    with rapidly evolving technology group supplying top
    quality solutions to our growing top tier Wall Street
    client base.
  - Recommending Product Ideas based on Client experiences and
    resolve complex technical issues independently.
  - Exposure to a complete Product Life Cycle Development
    Gaining high visibility to work with teams across Client
    Services. Mentoring and guiding the junior team members
    and interns

  What we expect from you:

  - Strong proficiency in C++ programming on Linux/Unix systems
    environment.
  - Proficient with Data Structures, Multithreading and Problem-
    Solving capabilities.
  - Practical Knowledge of the latest C++ 17 and C++ 20 standard
    is appreciated
  - Familiar with OS Concepts and Basic Database skills.
  - Bachelor’s or Master’s Degree in Computer Science,
    Information Technology, Engineering and/or related
    discipline.
  - Excellent Communication skills with an attitude and appetite
    to learn and grow.

  Does this sound like you? We would love to hear from you.
  Please use the link on this page to apply, and we will get
  back to you as soon as we are able. For more information
  visit http://flextrade.com or follow us on twitter and
  LinkedIn for the latest updates.

