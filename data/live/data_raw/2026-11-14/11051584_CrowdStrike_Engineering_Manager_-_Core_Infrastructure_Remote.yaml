description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  Our team builds the foundational platform that powers
  CrowdStrike’s massive scale. We focus on creating self-
  service infrastructure-as-a-code primitives, ensuring high
  availability, and optimizing our cloud footprint to empower
  our engineering teams to move faster with confidence.

  What You’ll Do:

  - Please note that if you are close to one of our office
    locations we would ask that you partake in a hybrid work
    schedule.
  - Manage a growing team of engineers focused on building
    quality platforms.
  - Participate in architecting large scale core infrastructure
    services for service teams at CrowdStrike.
  - Participate in regular retros, capacity and planning
    meetings with your team, allowing team collaboration and
    discussions in a high fidelity manner.
  - Be part of “lunch and learn” demos: for new POCs or design
    sessions to work out new architectures.
  - Flexible working - with transparent communication, we
    encourage flexible working and a healthy work life
    balance.
  - Responsible for reviewing, providing feedback and approving
    new design proposals from your team.
  - Help plan the product roadmap
  - Drive cloud cost optimization efforts, balancing high-
    performance requirements with operational efficiency and
    budget awareness.
  - Define and enforce standards for service deployments,
    ensuring consistency across our complex, multi-cloud
    environment.

  What You’ll Need (Technical)

  - Experience in Configuration Management (Chef, Puppet, Salt
    or similar solutions)
  - Experience in Provisioning & Orchestration (Pulumi,
    Terraform, Ansible, Temporal or similar solutions)
  - Experience with immutable architecture and distributed
    systems design.
  - Experience in software development, design patterns, data
    structures and algorithms  ( Python or Go )
  - Experience with large-scale, business-critical Linux
    environments.
  - Experience operating within the cloud, AWS & GCP preferred.
  - Experience with TDD, CI/CD, Chaos Engineering or similar
    resilience and reliability practices for infrastructure
    development.
  - Knowledge of SRE, Devops and Gitops practices
  - 8+ years industry experience
  - Experience in building and managing reusable infrastructure
    modules and internal developer platforms (IDP).
  - Strong understanding of SRE principles, including SLO
    management, error budget planning, and post-incident
    analysis.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  What You’ll Need (Leadership)

  - Proven ability to work effectively with both local and
    remote teams.
  - Rock solid communication skills, verbal and written.
  - A combination of confidence and independence, with the
    prudence to know when to ask for help from the rest of the
    team.
  - Experience with managing on-call
  - 4+ years of experience as a people manager
  - Led a team of Senior Engineers
  - Proven track record of influencing engineering strategy
    beyond your immediate team, and acting as a technical
    consultant to other product engineering groups.

