description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role:

  As a Staff Software Engineer/Tech Lead on our Patient
  Experience team, you’ll serve as a technical and
  architectural leader for the systems that help patients
  discover, start, and continue their care with Ro. You'll be
  responsible for the patient-facing platform that supports
  patients taking the first steps in their patient journey -
  and the second, and the tenth, and the 100th. Rather than
  building one-off experiments, you’ll design the architecture
  and technical foundations that allow us to continuously
  iterate on and personalize intake for patients as we learn
  more about their needs. You’ll serve as a strong technical
  partner to our Growth and Clinical teams, helping translate
  patient and business needs into thoughtful, scalable
  technical solutions. Patient Experience operates across a
  highly visible and interconnected part of the patient
  journey, partnering closely with engineering, product,
  design, and data to translate complex clinical information
  across systems into clear, intuitive next steps for
  patients. You’ll bring the systems thinking and technical
  leadership needed to connect decisions across domains,
  translate shared goals into cohesive, scalable patient
  experiences, drive patient and growth outcomes, and raise
  the team’s architectural and technical bar.

  What You’ll Do:

   What You’ll Bring to the Team:

  - Strong technical judgment and a track record of impact,
    demonstrated through the scope and complexity of problems
    you’ve led.
  - Deeply outcome-oriented and naturally curious, with a track
    record of measuring impact, learning from results, and
    continuously finding ways to improve both the product and
    how you work.
  - Deep backend and systems design expertise, with the ability
    to reason across services, APIs, data flows, dependencies,
    and architectural boundaries.
  - Strong product judgment, with a demonstrated ability to
    connect technical and architectural decisions to patient,
    growth, and business outcomes.
  - Experience leading technical work for consumer-facing growth
    experiences, such as acquisition, onboarding, conversion,
    merchandising, subscriptions, retention, or renewal.
  - A track record of leading architecture across complex,
    interconnected systems, partnering effectively with other
    engineering teams and influencing technical direction
    across organizational boundaries.
  - The ability to move fluidly between product and systems
    thinking, understanding the patient experience while
    reasoning deeply about the architecture that enables it.
  - Comfort operating in ambiguous, cross-functional
    environments, creating clarity, navigating tradeoffs, and
    driving complex technical work forward.
  - Experience with healthcare, commerce, or another regulated
    or data-sensitive domain is a plus.
  - Strong backend engineering fundamentals and experience
    building complex, production systems, with proficiency in
    Python or enough experience with similar languages to
    quickly become effective in Ro’s Python-based stack.

  We’ve Got You Covered:

  The target base salary  for this position ranges from
  $223,100 to $311,000, in addition to a competitive equity
  and benefits package (as applicable). When determining
  compensation, we analyze and carefully consider several
  factors, including location, job-related knowledge, skills
  and experience. These considerations may cause your
  compensation to vary.

  Ro is consistently recognized as a top workplace in Health
  Care, in New York, and for Women and Parents—earning more
  than 20 honors from Fortune, Great Place to Work, and PEOPLE
  since 2021. In 2025 alone, we ranked top 5 among medium
  workplaces in Health Care and New York, and top 50
  nationwide.



  At Ro, we believe that our diverse perspectives are our
  biggest strengths — and that embracing them will create real
  change in healthcare. As an equal opportunity employer, we
  provide equal opportunity in all aspects of employment,
  including recruiting, hiring, compensation, training and
  promotion, termination, and any other terms and conditions
  of employment without regard to race, ethnicity, color,
  religion, sex, sexual orientation, gender identity, gender
  expression, familial status, age, disability and/or any
  other legally protected classification protected by federal,
  state, or local law.



  Ro is committed to providing reasonable accommodations for
  qualified individuals with disabilities in our application
  and interview process. If you require a reasonable
  accommodation in the application or interview process,
  please contact us at talent@ro.co.



