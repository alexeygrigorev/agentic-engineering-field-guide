description: |
  Woven by Toyota is enabling Toyota’s once-in-a-century
  transformation into a mobility company. Inspired by a legacy
  of innovating for the benefit of others, our mission is to
  challenge the current state of mobility through human-
  centric innovation — expanding what “mobility” means and how
  it serves society.

  Our work centers on four pillars: AD/ADAS, our autonomous
  driving and advanced driver assist technologies; Arene, our
  software development platform for software-defined vehicles;
  Woven City, a test course for mobility; and Cloud & AI, the
  digital infrastructure powering our collaborative
  foundation. Business-critical functions empower these teams
  to execute, and together, we’re working toward one bold
  goal: a world with zero accidents and enhanced well-being
  for all.

  Team

  Our data platform team is working on accelerating autonomous
  driving by providing access to petabytes of data collected
  by our fleet of autonomous and non-autonomous vehicles.
  Efficient, fast and cost-effective access to data at large
  scale is key to tackle the hardest problems in AD/ADAS, from
  developing the Machine Learning (ML) models for perception
  and prediction of human driving patterns, to increasing the
  sophistication of our validation and simulation by
  identifying rare and interesting real-world driving
  situations. The data ecosystem developed by the London team
  is a key building block for developing and testing modern
  AD/ADAS products that will impact millions of customers.

  Our ML and Data pipelines are built on-top of the open-
  source Flyte orchestration framework and are deployed to
  AWS. Pipeline code is written in Python. We use SQS and
  Kafka to automate data connections and leverage BigQuery and
  ElasticSearch for data storage. We believe strongly in
  automation and testing to ensure delivery of robust and
  correct systems.  We are a distributed team, working in the
  UK and US.

  Who are we looking for?

  The London Data Infrastructure team is looking for engineers
  who are passionate about and enable the next generation of
  automotive software development. The right candidate will
  have excellent communication skills, solid coding skills,
  broad knowledge of software development across areas such as
  Data Infrastructure and Warehouses, Data Ingestion, Compute
  Frameworks, Observability and Build Infra.

