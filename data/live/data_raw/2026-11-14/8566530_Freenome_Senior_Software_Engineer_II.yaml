description: |
  About this opportunity:

  At Freenome we are seeking a Senior Software Engineer to
  grow our Platform team. This is an opportunity to join a
  stellar group of engineers with the mission to enable
  scientific innovation, cross-functional collaboration and
  data intelligence as we move from R&D to the commercial
  launch of our lifesaving multi-cancer detection blood tests.
  This team builds and operates the multi-tenant platform that
  provides a governed data lakehouse and query infrastructure,
  scalable batch and distributed compute, and self-service
  environments for development and analytics to an
  interdisciplinary user base across all Freenome.

  The ideal candidate has experience building internal
  platforms, enjoys collaborating with other domain experts,
  and is comfortable operating in a fast-evolving technical
  and organizational environment.

  The role reports to our engineering management team. This
  role will be a Remote role.

  What you’ll do:

  - Lead projects end to end and contribute to impactful
    platform initiatives that power R&D, operational
    excellence and business intelligence analytics.
  - Partner with engineers, scientists, product managers and
    business teams to identify high-leverage opportunities and
    build common solutions.
  - Integrate open-source, enterprise and SaaS technologies into
    our evolving stack.
  - Design and ship components of a new platform architecture to
    enable multi-tenancy, fine-grained data governance,
    workload isolation and scaling.
  - Contribute to the growth of our Data Lakehouse platforms,
    enabling well governed data products for analytical and
    operational use cases.
  - Continuously improve the Research Platform to meet our
    Science’s evolving needs for experimentation, ML Ops, data
    processing and analysis.
  - Help shape how we approach data modeling, context
    engineering and emerging semantic layers to make data
    easier to discover and to use.
  - Advocate for a product mindset within Platform and Data
    engineering at Freenome, focusing on developer
    effectiveness and platform usability.
  - Explore and pilot AI-assisted or agentic workflows to
    enhance individual and team productivity, sharing
    learnings with the broader organization.
  - Collaborate through system design, code reviews and pairing,
    promoting a strong team culture of accountability,
    learning, and psychological safety.
  - Support platform users to troubleshoot issues and unblock
    critical work.
  - Model Freenome’s values and principles in your work and
    interactions.

  Must haves:

  - 6+ years of experience building and operating highly
    reliable production software systems, preferably in
    platform engineering teams or similar.
  - Proficiency with Python and experience with one or more
    other high-level programming languages.
  - Strong knowledge of Linux fundamentals including networking
    and containerization.
  - Hands-on experience operating cloud services, storage and
    compute using IaC with at least one major cloud provider,
    preferably Azure or GCP.
  - Operational experience managing and optimizing large
    Kubernetes clusters, preferably in single or multi-cluster
    environments with thousands of nodes.
  - A pragmatic approach to reliability, observability,
    performance tuning, and operational excellence.
  - Excellent communication and documentation skills.
  - Comfort with cross-functional collaboration and navigating
    tradeoffs.
  - BS or higher in computer science or a related technical
    field, or comparable experience.

  Nice to haves:

  - Columnar data processing, open lakehouse technologies and
    table formats.
  - Supporting researchers, data scientists, AI/ML teams.
  - Flyte or other modern workflow orchestrators.
  - Everything as Code approach to infrastructure, policies,
    data.
  - Operating production systems in Microsoft Azure.
  - Open-Source contribution and maintenance.

  Benefits and additional information:

  The US target range of our base salary for new hires is
  $161,925 - $227,325. You will also be eligible to receive
  equity, cash bonuses, and a full range of medical,
  financial, and other benefits depending on the position
  offered.  Please note that individual total compensation for
  this position will be determined at the Company’s sole
  discretion and may vary based on several factors, including
  but not limited to, location, skill level, years and depth
  of relevant experience, and education. We invite you to
  check out our career page @ freenome.com/job-openings/ for
  additional company information.

