description: |
  Who We Are

  EDO is the TV outcomes company. Our leading measurement
  platform connects convergent TV airings to the ad-driven
  consumer behaviors most predictive of future sales. EDO
  empowers the advertising industry to maximize media impact,
  optimize creative performance, and know the fair value of
  every impression — across linear and streaming for an
  increasingly programmatic world. By combining immediate
  engagement signals with world-class decision science and
  vertical AI, EDO equips industry leaders with syndicated,
  investment-grade data that aligns media to business results
  — with detailed competitive, category, and historical
  insights. Leading brands, agencies, networks, streamers, and
  studios trust EDO’s TV intelligence to know what works.

  EDO is headquartered in New York City and Los Angeles with
  an office space in San Francisco.

  We recognize the benefits of hybrid working, and want to
  create the best balance to ensure we can continue working
  together effectively.  For those who reside full-time in
  NYC, SF, or LA: we have a hybrid work policy of three days
  in the office and two remote work days.

  To learn more about the work we do at EDO, please visit EDO
  Press.

  The Role

  As a Senior Full Stack Engineer at EDO, you will write
  software that presents our world-class data to our clients.
  You will use your full-stack skills to develop clear,
  intuitive, and actionable reports.  You will join an
  optimistic and creative team of problem-solvers.  You will
  partner with our Media Analytics and Data Science teams to
  present our clients with the insights they need to make
  informed and effective advertising decisions.

  What You Will Do

  - Collaborate with our product teams to implement data
    exploration and visualization features in our client
    application.
  - Scale our application, associated APIs, and backend
    processes related to our automated reporting tools.
  - Work with our backend teams to integrate performance
    enhancements and new data into our platform.
  - Work on a small team and take ownership of high-impact
    projects.
  - Work in a fast-paced environment with continuous deployment
    and rapid product iteration..
  - Help define the future of media and advertising through the
    innovative use of data and technology.
  - Have direct impact on product growth at a nimble Series
    B-stage company.

  What We Are Looking For

  - BS / MS in Computer Science or a related technical field.
  - 5+ years of experience in product-focused full-stack
    software engineering, with a track record of delivering
    end-to-end features at scale.
  - A high-agency self-starter who thrives in high-ambiguity
    environments. You have a proven ability to navigate the
    shifting priorities of a fast-growing startup without
    losing momentum.
  - Versatility, i.e., the ability and willingness to wear
    multiple hats and switch gears frequently.
  - Ability to build products quickly and efficiently.
  - Deep understanding of software engineering fundamentals.
  - We believe that strong engineers can learn any stack, but we
    currently use:

  Compensation and Benefits

  EDO offers a competitive compensation package. Components of
  compensation include:

  - Mid-stage equity and competitive salary
  - Flexible Time Off
  - Medical, dental and vision coverage: EDO provides full
    coverage for individual medical plans and partial coverage
    for dependent or family plans.
  - 401(k) plan, FSA, HSA
  - Commuter Benefits
  - When in an office, employee meals, snacks, and more

  In compliance with New York and California Pay Transparency
  Law, the salary range for this position is $150,000-$180,000
  annually plus equity. We note the salary information as a
  general guideline only, as actual compensation may vary from
  posting. We will consider various factors to determine the
  offer for this role, including the scope and
  responsibilities of the position, relevant work experience,
  key skills, training, and business considerations.

  EDO is an Equal Opportunity Employer. We do not discriminate
  based on race, color, ethnicity, ancestry, national origin,
  religion, sex, gender, gender identity, gender expression,
  sexual orientation, age, disability, veteran status, genetic
  information, marital status, or any legally protected
  status. All your information will be kept confidential
  according to EEO guidelines.
