description: |
  About Us

  Cambium is a modern American wood manufacturer, distributor,
  and technology company connecting and modernizing the wood
  economy. We work with architects, builders, and leading
  brands across the built environment, including Amazon, Room
  & Board, and Equinox. Our work has been recognized by Time's
  Best Inventions and Fast Company's Innovation by Design
  Awards. Technology is how we match supply to demand across a
  fragmented industry. The American hardwood industry has lost
  more than half its sawmills in the last two decades. Quality
  trees go to waste, and the US imports more lumber than it
  produces, even though domestic capacity could meet nearly
  all of our needs. Until now, this industry forced a choice:
  local relationships or national scale, meaningful materials
  or modern efficiency. We don't think those are real
  tradeoffs. We're building the infrastructure to prove it,
  with modern software, better supply chains, and a clear view
  of what comes next: a wood economy that's local, efficient,
  and built to last.

  About This Role

  As a Senior Software Engineer at Cambium, you'll be a key
  individual contributor leading end-to-end projects across
  our platform — writing maintainable code, designing for
  performance and longevity, and shaping architectural
  decisions. Our platform consists of a data layer, storing
  all data across the entire supply chain, this is where we
  digitize the offline network. On top of that data layer,
  we’re building vertical applications specific to each node
  within the network, from sawmills to contractors to Fortune
  500 buyers. You'll work closely with the VP of Engineering,
  Product, and the broader team (including customers) to bring
  solutions from concept to production. To succeed at the job,
  you must be able to operate independently and want to take
  on ownership, be a great mentor for others, and be able to
  contribute across a wide range of technical challenges.

  What You'll Do Here

  - Lead the design, development, and deployment of major
    features across Cambium's platform — data infrastructure,
    internal tools, and client-facing interfaces.
  - Build with AI coding agents like Claude Code as a core part
    of how you work — not as an occasional assist, but as the
    default. Help shape our team's evolving practices for
    agentic development as the frontier moves.
  - Write clean, maintainable, performant code with an emphasis
    on security and reliability.
  - Help define Cambium's architecture and technical roadmap
    alongside our Staff Engineer and leadership.
  - Prioritize and resolve technical debt and cross-cutting
    concerns.
  - Collaborate cross-functionally with Product, Supply, Sales,
    and external partners.
  - Mentor teammates and strengthen a culture of learning
    through code reviews, design reviews, and postmortems.

  Your Skill Sets and Capabilities Include

  - 8–10+ years of professional software development experience,
    ideally with some startup or early-stage environments.
  - Strong backend engineering experience designing secure,
    maintainable, production-ready systems.
  - Hands-on experience shipping production code with AI coding
    agents (e.g. Claude Code, Cursor, Codex). You have
    specific opinions about where these tools shine, where
    they break, and how to get serious leverage from them.
    Comfort with rapid change and a strong instinct to
    experiment are required — we're at the forward edge of
    this and the ground moves under us regularly.
  - Frontend experience with React and modern TypeScript;
    ability to lead frontend architecture and implementation
    is a major plus.
  - Experience leading projects independently and influencing
    architecture and roadmap discussions with a pragmatic,
    systems-thinking approach.
  - Strong communication skills across technical and non-
    technical audiences.
  - Familiarity with (or interest in) Cambium's stack: Python,
    Postgres, TypeScript, React, AWS.
  - Bonus: supply chain/logistics, geospatial data, ERP/CRM,
    sustainability-focused tech.

  The Details

  This role will report to: Aaron LeClair, Interim CTO

  When: Q4 2026

  Where: Remote, with occasional travel for company or
  engineering retreats

  Benefits and Perks

  - Equity options package
  - Unlimited PTO and flexible schedule
  - 401k matching
  - Comprehensive medical, dental & vision insurance
  - Work with an incredibly smart, diverse, climate mission-
    driven team
  - An opportunity to play a core role in defining our fast-
    growing company
  - Volunteer tree planting days

  Cambium is committed to building an inclusive organization
  that reflects the diverse communities our team works to
  serve. We believe that diversity in all its forms (gender,
  race, ethnicity, age, sexual orientation, religion,
  veteran’s status, disability and more) is essential to
  imagining and actively building a more just and sustainable
  future for all. We hope you feel welcome here. Pursuant to
  the San Francisco Fair Chance Ordinance, we will consider
  for employment qualified applicants with arrest and
  conviction records.
