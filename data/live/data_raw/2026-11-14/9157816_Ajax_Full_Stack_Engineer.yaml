description: |
  Our mission

  Ajax is on a mission to help law firms capture and organize
  their latent knowledge and put it to work. The legal
  services industry takes in over $1T in annual revenue and
  boasts 1.5 million practicing attorneys just here in the US,
  but AI has clients wondering what exactly they're paying so
  much for.

  These clients are half-right: AI makes it faster to draft
  rote motions and review voluminous documents during
  discovery. But law firms have never been in the business of
  mutating and transmitting documents; they're paid to apply
  their firm's institutional knowledge and best practices to
  their clients' specific cases. Ajax automatically captures
  this knowledge and helps firms redeploy it toward faster,
  cheaper, and more effective legal services.



  The Company

  Our mission is lofty, but our product provides tangible,
  day-1 benefit to firms. We started by addressing the firm’s
  core revenue driver: our AI timekeeping product tracks
  attorneys' work and draftsbillable time entries for them,
  finding each attorney tens of thousands of incremental
  dollars per year. This product has 5x annual growth,
  hundreds of law firms, and thousands of DAUs.



  Metrics we’re proud of We’re solving the worst problem 1.5
  million attorneys in the US face. Our metrics are
  exceptional:

  - Customers say things like "I'm leaving my husband for Ajax"
    (really)

  - 14 customers have invested in Ajax with their own money
  - <1% Customer Churn: we build long term partnerships with our
    customers (<10% annual is considered good)
  - 97% Pilot Conversion Rate: when we start pilots, we win them
    (>70% is considered good)
  - 140% Net Dollar Retention: after firms convert with Ajax,
    they share it with more and more employees (>120% is
    considered good)



  The Role

  Your core job here is to build software that makes owning
  and operating a law firm as easy as pie.

  By day 30, you will

  - Ship user-facing features that make reviewing one's time
    easier, e.g.:
    - Automatically proposing UIs that match users' review
      preferences, or
    - Rethinking how we enable users to split entries
  - Build a new billing system integration that unlocks more of
    the legal market

  By day 90, you will

  - Generate meaningful improvements to our pipeline's quality,
    e.g.:
    - Improving our clustering algorithms
    - Driving down p99 latency
  - Meet with customers and prototype a new feature, e.g.
    - Building an ontology for the firm's client-management and
      exposing it via MCP

  By day 180, you will

  - Shape our product roadmap. You'll work with Alex (me) to
    decide what problems we need to solve, and go solve them



  Who you are

  - Ownership: a wise man* once said the difference between
    senior engineers and junior engineers is that senior
    engineers own the feature into production and beyond
  - Empathy: to build features end to end, you must be able to
    sit in our customers' shoes. Our company makes bs work go
    away for lawyers that work really hard; that needs to
    speak to you.
  - Resourceful: you're scrappy: you prefer figuring bugs out
    yourself to putting your hands up.

  *my coworker Andrew

  You will:

  - Prototype new features and share with real customers that
    day
  - Deeply understand and improve our inference pipeline
  - Meaningfully shape our growing team:
    - Interview every candidate

  You’ll excel here if

  - Your reward function is customer happiness (stolen verbatim
    from our 2nd engineer).
  - You want ownership - that means shipping your ideas and
    owning the results.
  - You like adventure. We’re solving an unsolved problem, so we
    need to be brave and rigorous in our exploration. The
    optimal number of unsuccessful experiments is higher than
    0.



  I like working here because we win a lot, we’re solving
  previously-intractable technical challenges, and at least
  once a week a customer tells me that our product is saving
  their life. If that sounds fun to you, send me an email.





  FAQs

  - How far along are we?
    - We have over 200 paying law firms and thousands of users
    - Our team is 16 people (6 engineers, 10 GTM)
    - We’ve raised $15mm in venture funding from excellent VCs
  - Can I work remotely?
    - We usually work 5 days/week in-person in FiDi, NYC. We’re
      flexible, though, and we get that people are adults -
      Tyler worked from home when he had some family staying
      over, and Nat took a Wednesday off recently because she
      had to take delivery of a rare fish (don't ask).
  - Compensation: $210-$270k base + .25%-.75% equity.
    - The range is wide because we’re open to a range of
      seniorities.
    - Offers may extend above but will not dip below the stated
      range.
    - We also offer unlimited PTO, paid lunch/dinner on Fridays,
      and health/dental/vision.





