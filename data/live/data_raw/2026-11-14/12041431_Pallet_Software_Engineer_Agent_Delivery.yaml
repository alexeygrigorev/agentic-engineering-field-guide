description: |
  About Pallet

  Pallet is building AI Agents to transform the physical
  economy, a $12 trillion global TAM. We’ve raised $50M from
  top investors, including General Catalyst, Bessemer Venture
  Partners, and Bain Capital Ventures.

  Our mission is to increase the efficiency of the global
  supply chain by automating the manual workflows that slow
  supply chain teams down. Our flagship platform provides end-
  to-end visibility, and control.

  As companies across the physical economy look to drive
  efficiency, many are turning to Pallet to lead the way. With
  deep supply chain expertise and cutting-edge AI
  capabilities, we’re positioned to build the next $10B
  company powering the physical economy.

  Join us and work alongside leaders from Google, DoorDash,
  YC, and more to shape the future of supply chain technology.

  $145,000 - $245,000 Full-time / Onsite (5 days/week)

  About The Role

  We’re hiring a Software Engineer, Agent Delivery to deploy
  production AI agents inside some of the world’s largest
  supply chain companies.

  You’ll work directly with customer operators, engineers, and
  executives to understand how critical workflows actually
  run. Then you’ll design integrations, debug production
  systems, and ship AI-powered workflows into environments
  that are often undocumented, fragmented, and business-
  critical.

  This role sits at the intersection of engineering, product,
  and customer operations. You’ll own deployments from initial
  discovery through production launch, spending time with
  customers both remotely and onsite, solving complex
  operational problems and turning those solutions into
  reusable product capabilities.

  Success in this role is measured by outcomes: can you get
  systems live, make them reliable, and solve problems in
  environments you don’t fully control? Every deployment
  teaches us something new about how supply chain companies
  operate. The patterns you uncover become product features,
  and what you solve for one customer often becomes a
  capability we ship across the platform.

  The impact you will have

  - Lead high-impact customer deployments from problem
    definition through production, designing, prototyping,
    building, and deploying AI agents and workflows that
    change how work gets done and run reliably at scale.
  - Embed in customer workflows and build relationships from ICs
    and operators up to executives, turning messy business
    requirements into clear technical solutions that solve the
    underlying problem, not just the first request.
  - Make design decisions across agent behavior, application
    logic, data, evals, security, and reliability, and set the
    patterns for how Pallet agents are deployed in production.
  - Connect Pallet agents to the systems, APIs, and data
    customers already rely on, working directly with their
    engineering and ops teams to get around technical
    constraints.
  - Stay accountable after launch by debugging failures,
    evaluating and improving agent quality, and working with
    Engineering and Product to clear anything blocking a
    successful deployment.
  - Turn what you learn in the field into reusable agents,
    integrations, evals, and frameworks, and bring recurring
    needs and product gaps back to Product and Engineering to
    shape the core platform.

  Who You Are

  - 3+ years of experience building and owning production
    systems in high-growth startups or similarly demanding
    environments.
  - Strong experience working with APIs, integrations,
    authentication systems, and event-driven architectures.
  - Proven ability to debug complex systems in production.
  - Comfortable operating in ambiguous environments where
    documentation is incomplete, and requirements evolve
    quickly.
  - Strong communication skills and the ability to build trust
    with technical and non-technical stakeholders.
  - Experience working directly with customers is a strong plus

  Our Tech Stack

  - Backend: Node + TypeScript on Encore.dev. Event-driven
    design with message passing and queues. Hosted on GCP
  - Database: PostgreSQL
  - LLMs: OpenAI, Anthropic, Google for foundation models; fine-
    tuned models on Vertex AI
  - Browser Automation: Playwright
  - Frontend: Next.js + React + TypeScript. Hosted on Vercel
  - Observability: Datadog for logging and metrics

  Location: New York, Flatiron, 5 days a week

  The estimated salary range for this role is
  $135,000–$180,000, depending on experience and skill set. In
  addition to base salary, we offer competitive equity,
  benefits, and growth opportunities. Final compensation will
  be determined based on a combination of factors, including
  experience, qualifications, and location.

  Our Benefits

  We invest in our people the same way we invest in our
  product: seriously.

  - 🩺 Health, Vision, and Dental benefits
  - 🏝️ Take-what-you-need Paid Vacation
  - ➕ Life Insurance and Accidental Insurance
  - ❤️‍🩹 Short-Term Disability Coverage
  - 💸 Generous salary and equity for all staff
  - 🪜 401k option; helping you save for the future
  - 🧑‍🧑‍🧒‍🧒 Paid parental leave to support growing families
  - 📚 Yearly learning and development stipend
  - 🚌 Commuter benefits for Bay Area and New York employees
  - 🚘 Uber ride stipend if you ever have to work late in the
    office
  - 🏡 Remote office home stipend to get you comfy in your space
    for remote employees
  - 📸 Free professional headshot
  - 🍔 Daily catered lunches and dinners provided in office
  - 💪 Complimentary On-Site Gym: Our SF office has a fully
    equipped gym
  - ✈️ Onboarding trip to one of our offices if you work
    remotely
  - 🥤 Monthly happy hours
  - 🎉 Annual Company Offsites; our last one was in Palm Springs
    CA 🌴

  Workplace Policy

  We are an in-person company. Our offices in San Francisco,
  New York City and London are where ideas get built,
  decisions get made, and the team gets stronger. We have
  invested in making them genuinely great places to spend your
  day, with catered lunches, monthly happy hours, and people
  who care about the work and each other.

  Most of our team works in office five days a week. For
  select roles, we hire remotely across the U.S. Remote
  employees come to one of our offices for their first week to
  onboard and meet the team, and we cover the full trip.

  Every role is different. Travel expectations are always
  shared upfront in the job description and confirmed in your
  first call with us.

