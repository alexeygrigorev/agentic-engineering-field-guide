description: |
  Virta Health is on a mission to reverse metabolic disease in
  one billion people. Current treatment approaches aren't
  working—over half of US adults have either type 2 diabetes
  or prediabetes, and obesity rates are at an all-time high.
  Virta is changing this by helping people reverse their
  metabolic condition through innovations in technology,
  personalized nutrition, and virtual care delivery reinvented
  from the ground up. We have raised over $350 million from
  top-tier investors, and partner with the largest health
  plans, employers, and government organizations to help their
  employees and members restore their health and take back
  their lives. Join us on our mission to reverse metabolic
  disease in one billion people.

  As a Senior Manager, Engineering you'll set the technical
  direction for the team, making tradeoffs between technical
  investments and product work, and communicating strategy
  transparently to your team and to leadership. You'll act as
  a critical technical leader across backend, frontend, data,
  and third-party systems taking holistic ownership of complex
  systems, defining strategic roadmaps, and driving cross-
  functional alignment and engineering excellence to improve
  the billing, accounting and member-to-product eligibility
  experience along with components of the enrollment
  experience.

  Ownership is a key quality for this team. You will help
  shape product direction by developing a deep understanding
  of our internal and external customers. The ideal candidate
  will be driven to track projects to successful completion
  and beyond, taking initiative to work with other teams and
  functions to ensure your team's work reaches users and
  drives outcomes.

  You'll lead a group of talented engineers, helping the team
  deliver business impact while staying open to change through
  constant experimentation. You'll collaborate with
  engineering, product, data science and operations on
  programs that empower the team to iterate quickly while
  measuring outcomes and establishing impact to our customers.

  If you enjoy collaborating with technical and nontechnical
  partners on a product with real-world impact, this is the
  role for you.

  Responsibilities

  - Technical Strategy & Execution: Set the technical direction
    across backend, frontend, data, and third-party systems,
    balancing critical technical investments with new product
    delivery.
  - Team Leadership & Leadership Development: Recruit, mentor,
    and retain a talented team of engineers while actively
    coaching, growing, and scaling engineering managers or
    team leads on your team.
  - Domain & Roadmap Ownership: Take holistic ownership of
    complex, high-impact systems spanning billing, accounting,
    member eligibility, and enrollment, defining durable
    roadmaps to drive strategic outcomes.
  - Cross-Functional Collaboration: Partner closely with
    engineering, product, data science, and operations to
    align on key programs, measure impact, and empower the
    team to iterate rapidly through experimentation.
  - Balance & Velocity: Maintain a careful balance between
    building sustainable, high-impact projects and shipping
    software quickly to drive immediate user value.
  - Continuous Improvement: Instill a spirit of continuous
    improvement across the team's codebase, systems
    architecture, and engineering processes.

  Must-Haves

  - 5+ years of experience managing and providing technical
    leadership to engineering teams, with a proven track
    record of hiring, coaching, or developing other
    engineering managers or team leads.
  - Deep technical expertise across backend, frontend, data, and
    integrations to third-party systems, with strong
    familiarity in building distributed services using Python
    and/or Go.
  - Experience taking holistic ownership of complex
    transactional systems, specifically in domains like
    billing, financial accounting, membership eligibility, or
    customer enrollment.
  - Track record of building, mentoring, and scaling highly
    diverse, inclusive, and high-performing engineering teams.
  - Can motivate and instill a strong sense of ownership in your
    team.
  - Are able to thrive in a heavily cross-functional environment
    and drive projects to completion regardless of the
    organizational structure.
  - Work well with product partners and help set the product
    vision for an ambiguous project.

  Nice-to-Haves

  - Experience working in a HIPAA-compliant or similarly
    regulated environment (fintech, health tech, etc.).

  Values-driven culture

  Virta's company values drive our culture, so you'll do well
  if:

  - You put people first and take care of yourself, your peers,
    and our patients equally.
  - You have a strong sense of ownership and take initiative
    while empowering others to do the same.
  - You prioritize positive impact over busy work.
  - You have no ego and understand that everyone has something
    to bring to the table regardless of experience.
  - You appreciate transparency and promote trust and
    empowerment through open access of information.
  - You are evidence-based and prioritize data and science over
    seniority or dogma.
  - You take risks and rapidly iterate.

  Is this role not quite what you're looking for? Join our
  Talent Community and follow us on LinkedIn to stay
  connected!

