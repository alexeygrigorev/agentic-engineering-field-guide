description: |
  This is a remote position.



      Paradigm is seeking a Senior Software Engineer to
  support our client in the development and delivery of high-
  volume, mission-critical enterprise applications. This is a
  hands-on development role for an experienced engineer who
  can contribute across the full software development
  lifecycle while also serving as a technical resource and
  mentor to other developers.










      The ideal candidate brings strong experience with
  TypeScript/JavaScript, Next.js, SQL, and C#/.NET, along with
  the ability to troubleshoot complex technical issues, work
  effectively across technical and business teams, and
  independently drive development work from requirements
  through production.










   Type: Contract





   Duration: 12-month*





   Pay Rate: $60-$70/hour





   Benefits: Medical, dental, vision, life, 401(k), PTO, and
  sick leave





   Location: Remote – approved U.S. locations





   Job No.: Para_1502










   * Assignment lengths are estimated based on the expected
  workload and scope of work. The assignment may be extended
  or conclude earlier than anticipated based on business
  needs.









   Approved Hiring Locations: Alabama, Arizona, Colorado,
  Connecticut, Delaware, Florida, Georgia, Idaho, Illinois,
  Indiana, Kansas, Kentucky, Louisiana, Maryland,
  Massachusetts, Michigan, Minnesota, Missouri, Nevada, New
  Jersey, New York, North Carolina, Ohio, Oklahoma, Oregon,
  Pennsylvania, South Carolina, Tennessee, Texas, Utah,
  Virginia, Washington DC, and Wisconsin.










  As a Senior Software Engineer, you will:



  - Design, develop, debug, test, and deliver high-volume
    enterprise applications.
  - Participate throughout the Agile software development
    lifecycle, including requirements analysis, technical
    design, prototyping, programming, testing, debugging, and
    production implementation.
  - Develop applications and components using technologies
    including TypeScript/JavaScript, Next.js, C#/.NET, and SQL
    Server.
  - Develop and optimize SQL solutions, including stored
    procedures, database design, and performance tuning.
  - Participate in technical design discussions and contribute
    to sound, scalable application architecture.
  - Identify and proactively raise concerns when requirements or
    specifications could create quality, performance,
    scalability, or architectural issues.
  - Troubleshoot complex application and technical issues and
    provide effective solutions.
  - Collaborate closely with software engineers, analysts,
    business teams, and other stakeholders throughout the
    development process.
  - Serve as a technical resource to other software engineers
    and provide guidance in areas of expertise.
  - Mentor fellow developers and contribute to the continued
    development of the engineering team.
  - Act as a liaison between technical teams, department
    leadership, analysts, and business stakeholders as needed.
  - Take a self-directed, proactive approach to identifying and
    solving technical problems.


    Requirements

   What we are looking for:




  - Strong professional experience with TypeScript/JavaScript.
  - Experience developing applications using Next.js.
  - Strong SQL experience, including stored procedures, database
    design, and performance considerations.
  - 5+ years of software development experience using C#/.NET.
  - Experience developing multi-tier components for high-volume
    applications.
  - Experience working with SQL Server.
  - Experience with Agile software development methodologies and
    full lifecycle application development.
  - Strong troubleshooting and technical problem-solving skills.
  - Ability to work independently while collaborating
    effectively in a team environment.
  - Strong written and verbal communication skills.
  - Experience mentoring or providing technical guidance to
    other developers.



   Preferred Qualifications




  - Experience with load-balancing technologies.
  - Advanced degree, technical training, or other relevant
    education in a related field.


    Benefits

      Paradigm offers a competitive benefits package that
  includes medical, dental, vision, life, 401K, PTO, and sick
  days.










   About Us, Paradigm









  Paradigm Information Services is an established staffing
  company that has been connecting talented people with great
  opportunities for more than 25 years. We work with clients
  across a variety of industries and positions, giving our
  recruiting team the opportunity to work on interesting and
  sometimes challenging searches.




