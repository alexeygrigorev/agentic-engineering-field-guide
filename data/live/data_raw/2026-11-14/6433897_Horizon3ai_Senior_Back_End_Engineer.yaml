description: |
  Get to Know Us

  Horizon3 is a fast-growing, remote cybersecurity company
  dedicated to the mission of enabling organizations to
  proactively find, fix and verify exploitable attack vectors
  before criminals exploit them. Our flagship product, the
  NodeZeroTM platform, delivers production-safe autonomous
  pentests and other key assessment operations that scale
  across the largest internal, external, cloud, and hybrid
  cloud environments. NodeZero has been adopted by
  organizations of all sizes, from small educational
  institutions to government agencies and Global 100
  enterprises. It is used by IT Ops/SecOps teams, consulting
  pentesters, and MSSPs and MSPs.

  We are a fusion of former U.S. Special Operations cyber
  operators, startup engineers & operators, and formerly
  frustrated cybersecurity practitioners. We're committed to
  helping solve our common security problems: ineffective
  security tools and false positives, resulting in alert
  fatigue, blind spots, "checkbox” security culture,
  cybersecurity skills shortage, and the long lead time and
  expense of hiring outside consultants. Collectively, we are
  a team of learn it alls, committed to a culture of respect,
  collaboration, ownership, and results.

  What You’ll Do

  The Senior Software Engineer will be joining the Platform
  Integration team — a high-impact group whose mandate is
  critical to the scalability of our platform. You’ll be
  responsible for building the systems and platforms behind a
  product that helps security teams cut through the noise and
  prioritize actually fixing the weaknesses that represent
  real risk in their environment. This role is for a senior
  individual contributor who leads through technical judgment,
  cross-functional partnership, and execution.

  This nascent team helps push our existing APIs to be first-
  class citizens, building the consistent, well-documented
  foundation that powers every integration and allows
  customers to build their own agentic workflows atop our
  platform. No less critical, this team will build strategic
  integrations to unlock critical new features atop mountains
  of complimentary data from users own systems. We want to
  meet users where they are at with their current tooling, and
  use the products they already have in their ecosystem to
  drive the find-fix-verify loop with greater accuracy and
  less downtime.

  What You’ll Be Responsible For

  - Develop core product features in ETL (Extract, Transform,
    Load) and GraphQL to support data processing and
    retrieval.
  - Design and implement backend APIs in GraphQL to facilitate
    data interactions between different components of the
    product.
  - Contribute production code, setting the standard for design
    quality, code quality, and operational rigor.
  - Collaborate with frontend team members to present data in a
    clear and user-friendly format, enhancing the product's
    user experience.

  What You’ll Bring

  - Ability to own and manage concurrent initiatives,
    demonstrating effective judgment in prioritization and
    time management.
  - Driven, self-managed, capable of conceiving and implementing
    solutions on your own and with a team
  - A strong desire to continuously improve and learn new
    technologies in a fast-paced Agile development environment
  - Excellent analytical and problem-solving skills, effective
    communication, attention to detail and high-quality work
  - Strong technical documentation ability to support the
    development process.
  - Effective communication and collaboration with designers,
    developers, and product managers.
  - Ability and interest in mentoring junior and mid-level
    engineers to foster their growth and development.

  Required Education / Experience

  - Bachelor's Degree in Computer Science, Computer Engineering
    or related field.
  - 7+ yrs professional software engineering experience using
    modern object-oriented or functional languages (Python,
    Java, Go, Scala, C++, TypeScript, etc).
  - Experience building applications on cloud computing
    platforms such as AWS, Azure, GCP, using container
    technologies such as Docker and Kubernetes.

  What Sets You Apart

  - Expert proficiency in SQL and experience with various
    database architectures including relational (PostgreSQL)
    and graph (Neo4j).
  - Experience building GraphQL backends.
  - Experience working on API platforms, headless customer
    experiences, or agent-based customer flows.
  - Experience with an integrations platform, particularly with
    an eye to build speed for new integrations.

  Travel Required

  We are a fully remote company with a strong preference for
  candidates in the Bay Area. This job may require up to 5% of
  travel to be successful.

  Compensation and Values

  At Horizon3, we believe that our people are our greatest
  asset, and our compensation philosophy reflects this core
  value. We are committed to fostering an environment where
  all employees feel valued, respected, and rewarded for their
  contributions. Our compensation structure is designed to be
  fair, competitive, and transparent, ensuring that every team
  member is recognized and compensated equitably across roles,
  levels, and locations.

  In accordance with various State’s transparency regulations,
  we provide the following salary range information for this
  position:

  - Base salary range: $170,000 - $235,000 annually. The exact
    salary will be determined based on the selected
    candidate’s location, qualifications, experience, and
    relevant skills.
  - Additional compensation: All full-time roles are eligible
    for an equity package in the form of stock options.

  Perks of Horizon3

  - Inclusive Team: We value diversity and promote an inclusive
    culture where everyone can thrive.
  - Growth Opportunities: Be part of a dynamic and growing team
    with numerous career development opportunities.
  - Innovative Culture: Work in a collaborative environment that
    encourages creativity and out-of-the-box thinking.
  - Remote Work: We are a 100% remote company. Enjoy the
    flexibility to work in the way that supports you and
    brings out your best.
  - Competitive Compensation: We offer competitive salary,
    equity and benefits. Our benefits include health, vision &
    dental insurance for you and your family, a flexible
    vacation policy, and generous parental leave.

  You Belong Here

  Horizon3 is not just an equal opportunity employer - we are
  a community that values diversity, equity, and inclusion as
  fundamental principles of our culture and success. We are
  dedicated to fostering a workplace where everyone feels
  welcome and respected, regardless of race, color, religion,
  sex, national origin, age, disability, veteran status,
  sexual orientation, gender identity or expression, genetic
  information, marital status, hair length or any other
  legally protected status by law.

  Our commitment to diversity and inclusion means we strive to
  attract, develop, and retain a workforce that reflects the
  varied communities we serve. We believe that diverse
  perspectives drive innovation and strengthen our ability to
  create cutting-edge cybersecurity solutions. At Horizon3,
  every team member is valued and supported in an environment
  that encourages personal and professional growth.

  We welcome candidates from all backgrounds and experiences,
  and we encourage all qualified individuals to apply. Come be
  a part of Horizon3, where your unique contributions are
  recognized, and your potential is limitless.

  Other Duties

  Please note this job description is not designed to cover or
  contain a comprehensive listing of activities, duties or
  responsibilities that are required of the employee. Duties,
  responsibilities, and activities may change at any time with
  or without notice.

  Application Note

  In any materials you submit, you may redact or remove age-
  identifying information such as age, date of birth, or dates
  of school attendance or graduation. You will not be
  penalized for redacting or removing this information.
