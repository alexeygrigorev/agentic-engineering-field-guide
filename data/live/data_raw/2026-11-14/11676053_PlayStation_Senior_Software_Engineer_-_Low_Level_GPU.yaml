description: |
  Why Sony Interactive Entertainment?

  Sony Interactive Entertainment isn’t just the Best Place to
  Play — it’s also the Best Place to Work. Sony Interactive
  Entertainment (SIE) is the company behind the PlayStation
  brand. As a subsidiary of Sony Group Corporation, we’re part
  of a proud legacy of innovation and excellence. SIE is a
  dynamic technology company, delivering cutting-edge hardware
  and network services to more than 100 million people and an
  entertainment leader, home to some of the most beloved and
  recognizable intellectual properties (IP) in the world. Our
  role at SIE is to create and nurture the experiences under
  the PlayStation brand, a name synonymous with entertainment
  excellence and creativity.

  About the Advanced Technology Group

  The Advanced Technology Group (ATG) is a part of
  Foundational Systems and Experiences Engineering (FSEE)
  within the Platform Business Group. Established over 20
  years ago as part of PlayStation®’s first-party game
  development studios, ATG has always focused on helping game
  developers get the most out of PlayStation® hardware - a
  mission that continues to this day. As a team, we are
  responsible for large parts of the graphics software stack
  used by all PlayStation® games, and collaborate with leading
  engineering teams worldwide, from game developers to
  hardware vendors, to deliver key platform technologies.

  What you’ll be doing

  - You will be working on Razor GPU, a GPU performance analysis
    and debugging tool, for current and future PlayStation®
    platforms.
  - You will be developing GPU Capture and Replay technology,
    which allows GPU commands, shaders and resources to be
    captured, analysed and later reinstated, so that graphics
    frames can be re-executed on the GPU independently from
    the running game.
  - You will be developing profiling and debugging features upon
    this core technology, to help game developers worldwide to
    realize their creative vision and push PlayStation®
    hardware to its limits.
  - You will be developing internal features used by platform
    software and hardware teams, to help build and improve the
    PlayStation® graphics software stack, as well as diagnose
    low-level platform issues.
  - You will collaborate with game developers and platform
    engineers to gain a deep understanding of their needs,
    with a view to creating efficient, reliable and scalable
    tools, which are a joy to use for new and deeply technical
    engineers alike.

  This is a unique senior engineering role at the heart of
  PlayStation® GPU technology, where you will work within a
  highly experienced technology-driven team. We are looking
  for developers who are passionate about their craft, the
  products they build, and who would like to make a lasting
  impact on the PlayStation® graphics software stack, its
  tooling, and its future.

  What we are looking for

  - Strong problem-solving skills, including the ability to
    design and implement highly reliable performant systems in
    C++.
  - Strong debugging skills, including the ability to understand
    and reason about complex systems, as well as unpick their
    interactions.
  - Experience developing on consoles, particularly using
    console graphics and memory management APIs.
  - An interest in GPU architecture and low-level graphics
    engineering.
  - Experience using GPU profiling and debugging tools.
  - An eagerness to learn and take responsibility of features
    end-to-end, from building core systems, to influencing
    end-user UX design.

  Please note, Sony Interactive Entertainment conducts
  background checks at the offer stage for all new employees
  (which may include criminal background checks for some
  roles) and will need to process personal information to
  support these checks.

  Please refer to our Candidate Privacy Notice (where
  applicable) for more information about what personal
  information we collect, how we use it, who we share it with,
  and your data protection rights.

  Equal Opportunity Statement:

