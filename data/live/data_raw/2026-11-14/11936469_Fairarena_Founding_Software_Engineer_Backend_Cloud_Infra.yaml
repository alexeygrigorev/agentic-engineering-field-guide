description: |
  About the Role

  As a Founding Software Engineer, you will work across
  backend engineering, cloud infrastructure, and distributed
  systems to build reliable and scalable services. You'll take
  ownership of critical components, contribute to
  architectural decisions, and help shape the technical
  foundation of our platform.

  This role is suited to an engineer who enjoys solving
  challenging problems, working independently, and building
  products from the ground up.

  What You'll Do

  - Design, develop, and maintain backend services and REST
    APIs.
  - Build systems for cloud workspace provisioning, lifecycle
    management, and resource orchestration.
  - Work with containerized environments, Docker, and cloud
    infrastructure.
  - Improve system performance, reliability, scalability, and
    security.
  - Build integrations, SDKs, and developer-facing tools.
  - Collaborate on technical architecture and ship features from
    idea to production.

  What We're Looking For

  - Strong programming skills in TypeScript/JavaScript and
    Node.js.
  - Understanding of backend development, REST APIs, and
    database design.
  - Experience with PostgreSQL, Redis, or similar data systems.
  - Familiarity with Docker, Linux, and cloud infrastructure.
  - Ability to debug complex problems and write maintainable
    code.
  - A strong sense of ownership and willingness to work in an
    early-stage startup environment.

  Nice to Have

  - Experience with Kubernetes, container orchestration, or
    distributed systems.
  - Familiarity with cloud platforms, virtual machines, and
    networking.
  - Experience building developer tools, SDKs, or infrastructure
    automation.
  - Interest in AI infrastructure, GPU computing, or cloud
    development environments.

  Why Join Velocity?

  - Build core infrastructure for a growing cloud development
    platform.
  - Take ownership of meaningful engineering challenges.
  - Work with modern technologies across cloud computing and
    developer tooling.
  - Contribute directly to product and architectural decisions.
  - Grow with an engineering team focused on building reliable,
    scalable systems.
