  Staff Full Stack Software Engineer

  🌐 Location: 100% Remote within the United States

  💰Compensation: $180-250k total compensation package

  About Clever

  Clever Real Estate (listwithclever.com) is a venture-backed
  proptech company on a mission to change how people buy,
  sell, and manage real estate. Since 2017, we've helped more
  than 200,000 homeowners sell their homes while saving
  thousands in fees, and we're just getting started. With a
  strong foundation in real estate, we're aggressively
  expanding through vertical integration, building a suite of
  adjacent businesses that serve customers at every step of
  the home transaction journey.

  We’ve built a leading real estate platform and earned a 4.9
  TrustPilot rating with over 4,000 reviews, helping consumers
  save over $220 million in real estate fees.

  As a team, we FORGE leaders. We move with Frequency and
  urgency, take Ownership of outcomes, build genuine
  Relationships, commit to Growth every day, and hold
  ourselves to a standard of Excellence we're always raising.
  If you're excited to play a key role at a company that
  transforms how people navigate their real estate journey,
  we’d love to hear from you!

  AI Usage

  We expect all team members to leverage AI tools as a natural
  part of their daily workflow — using them to handle routine
  tasks efficiently so you can spend more of your energy on
  the work that actually matters: collaborating, problem-
  solving, and driving strategy.

  About the Role

  As a Staff Full-Stack Software Engineer at Clever, you will
  own meaningful customer and operational problems from
  initial framing through production. Working across our
  Python/Django backend and React/TypeScript frontend, you
  will turn ambiguous needs into complete, reliable solutions.

  We are a small, high-autonomy team looking for engineers who
  make sound tradeoffs, move quickly, and remain accountable
  for outcomes. AI is core to how we work: you will use it to
  materially increase your speed, quality, and scope while
  retaining responsibility for everything you deliver.

  Key Responsibilities

  - Own full-stack product and operational initiatives from
    problem framing through implementation, launch, and
    production validation.
  - Turn ambiguous requirements into practical plans,
    milestones, and shippable increments.
  - Build and maintain reliable applications using Django and
    TypeScript.
  - Make sound decisions about architecture, data models, APIs,
    integrations, testing, security, and production
    operations.
  - Use AI tools throughout investigation, development, testing,
    debugging, and review to deliver materially better
    outcomes.
  - Validate AI-assisted work rigorously and recognize when
    direct engineering judgment is required.
  - Work directly with Product, Design, Operations, and other
    stakeholders to understand the underlying problem and
    define successful outcomes.
  - Communicate progress, decisions, risks, and blockers
    proactively.
  - Diagnose production issues, restore service responsibly, and
    drive follow-up improvements that reduce recurrence.
  - Improve the systems, tooling, and engineering practices that
    help the broader team move faster and produce better work.

  Experience

  - 8+ years of professional software engineering experience.
  - Strong backend development experience with Python and
    Django.
  - Experience building user-facing applications with React and
    TypeScript.
  - Demonstrated ownership of meaningful production outcomes.
  - Experience designing and integrating APIs, relational data
    models, and third-party services.
  - Strong understanding of automated testing, security, data
    integrity, failure handling, and maintainable software
    design.
  - Experience diagnosing production behavior using logs,
    metrics, traces, profiling, and other forms of operational
    evidence.
  - Meaningful experience using AI tools in a professional
    engineering workflow.
  - Ability to explain technical decisions, tradeoffs, and
    measurable results.
  - Strong written and verbal communication skills in a remote,
    cross-functional environment.

  Ideal Experience

  - Experience in a lean product organization where engineers
    work directly with business or operational stakeholders.
  - Experience with marketplaces, matching, routing, lead
    management, workflow automation, or other multi-sided
    products.
  - Experience building integration-heavy systems involving
    CRMs, communications platforms, webhooks, asynchronous
    jobs, or third-party APIs.
  - Experience with PostgreSQL, background-processing systems
    such as Celery.
  - Experience delivering complete features across both backend
    and frontend systems.
  - Experience with production incidents, migrations,
    concurrency, data-quality problems, or other high-
    consequence workflows.
  - Experience turning successful AI workflows into reusable
    automation, tooling, or team practices.

  Compensation & Additional Information

  - What We Offer
  - 💰 Compensation: $180,000-$250,000 total compensation package
  - 🏥 Comprehensive Benefits: Medical, dental, vision, and life
    insurance
  - 🌴 Paid Time Off: 18 days of PTO (increases with tenure) plus
    10 paid holidays
  - 📚 Professional Development: Annual budget for learning and
    career growth
  - 🏝️ Tenure Sabbaticals: Paid sabbaticals to celebrate major
    milestones
  - 🏡 Clever Product Benefit: Exclusive access to Clever
    homeownership perks
  - 🖥️ Work-From-Home Stipend: Support for your remote workspace
  - 💼 401(k): Retirement plan administered through Betterment
  - 👶 Parental Leave: 6–12 weeks of paid parental leave
  - 💙 Wellness Benefits: Free counseling sessions and optional
    weekly meditation

