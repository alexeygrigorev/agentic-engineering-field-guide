description: |
  Headquartered in Irvine, California, EBizCharge specializes
  in developing integrated payment solutions that facilitate
  electronic payment processing within ERP, CRM, Mobile, and
  eCommerce applications. Our applications are PCI compliant
  and fully integrated with major ERP/accounting systems,
  including QuickBooks, Sage, SAP Business One, Microsoft
  Dynamics, NetSuite, Epicor, Acumatica, and major online
  shopping carts, including Magento and WooCommerce.
  EBizCharge offers its employees tremendous learning
  opportunities, career growth potential, and a dynamic work
  environment.

  We are seeking a skilled and motivated Software Developer
  with experience in Infor CloudSuite Industrial / SyteLine or
  Mongoose and a strong background in full-stack web
  application development. The ideal candidate will contribute
  to designing, developing, and maintaining innovative
  solutions that optimize the payment processing capabilities.

  Responsibilities

  - Develop and customize applications within the Infor
    CloudSuite Industrial SyteLine platform to support
    business processes.
  - Integrate third-party applications with the Infor platform
    to enhance functionality.
  - Work closely with business analysts, stakeholders, and other
    developers to understand requirements and deliver high-
    quality solutions.
  - Participate in code reviews and provide constructive
    feedback to peers.

  - Design and develop full-stack web applications with modern
    frameworks and technologies.
  - Ensure seamless integration of front-end interfaces with
    backend logic and enterprise systems.
  - Troubleshoot and resolve issues related to the Infor
    CloudSuite environment.

  Qualifications

  - 3+ years of experience with Infor CloudSuite Industrial
    SyteLine or Mongoose, including development,
    customizations, configuration, and integration.
  - Strong proficiency in full-stack web development with
    expertise in technologies such as:
    - Front-End: HTML, CSS, JavaScript, Angular, or similar
      frameworks.
    - Back-End: .NET
    - Database: SQL Server, MySQL, or other relational database
      systems.
  - Experience with RESTful APIs, SOAP, and microservices
    architecture.
  - Familiarity with Infor cloud platform and deployment tools
  - Strong problem-solving and debugging skills.
  - Excellent communication and teamwork abilities.

  Benefits

  - Employer paid benefits (including Medical, Dental, Vision, &
    life insurance) for selected plans for the employee.
  - Retirement 401(k) plan with company match.
  - Gym access, dry cleaners, car wash conveniently located
    within building.
  - Generous PTO plan with an additional 9 Days Company Paid
    Holidays per year.

  Job Type: Full-time

  The Company is committed to compliance with all applicable
  laws providing equal employment opportunities. This
  commitment applies to all persons involved in Company
  operations. The Company prohibits unlawful discrimination
  against any job applicant, employee, or unpaid intern by any
