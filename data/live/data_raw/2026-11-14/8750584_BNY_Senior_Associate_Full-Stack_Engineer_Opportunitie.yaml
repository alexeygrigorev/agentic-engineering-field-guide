description: |
  Senior Associate, Full-Stack Engineer Opportunities.

  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

  We welcome you to apply! When applying to this general
  posting, our expert BNY Talent Acquisition Team may also
  review your resume for consideration across other open roles
  within the company.

  We’re seeking a future team member for the role of Senior
  Associate, Full-Stack Engineer to join our team. This role
  is located in London.

  Role Overview: We’re seeking a Full Stack Developer to build
  secure, scalable, and resilient systems. You’ll work
  primarily on the backend while contributing to modern web
  frontends, owning delivery across the product lifecycle and
  collaborating closely with product and design partners.

  In this role, you’ll make an impact in the following ways:

  - Design, build, and maintain backend services, batches and
    APIs, contributing to UI components as needed.
  - Own end-to-end delivery: implementation, testing,
    deployment, observability, and reliability.
  - Write clean, well-tested code; participate in code reviews
    and continuous improvement.
  - Collaborate with product, design, and operations to
    translate business needs into technical solutions.
  - Enhance performance, security, and resiliency through best
    practices and automation (CI/CD).
  - Foster a learning, inclusive team culture —aligned to BNY’s
    principles and pillars.

  To be successful in this role, we’re seeking the following:

  - Hands-on AI development using modern tools and IDEs (e.g.,
    Windsurf).
  - Solid understanding of programming concepts and
    microservices
  - Proficiency in Java with Spring.
  - Experience with CI/CD, automated testing (JUnit/Spock), and
    containers (Docker).
  - Familiarity with microservices, observability/telemetry
    (e.g., Splunk, AppDynamics), and cloud deployments.
  - Curiosity to understand the business domain and translate
    product strategy into technical solutions.
  - Working knowledge of Groovy with Spock preferred.
  - Working knowledge of JavaScript/TypeScript and Angular 15+
    preferred.

