description: |
  As the Mid-Market Solutions Engineering Manager at Ashby,
  you’ll lead and grow a high-performing team of Solutions
  Engineers who sit at the center of our sales motion. Your
  team partners closely with Account Executives to secure both
  the technical and commercial win—showing prospects how Ashby
  can fundamentally transform the way they hire.

  You’ll be responsible for shaping the next generation of SEs
  at Ashby: hiring exceptional talent, coaching them toward
  mastery, operationalizing excellence, and building scalable
  processes that help the team—and the business—win more often
  and more efficiently.

  This is a highly strategic role with direct impact on
  revenue, product innovation, and customer value.

  Why Lead SE at Ashby?

  Product-Market Fit That Makes Your Team’s Job Easier

  Your team will support a product that prospects genuinely
  love—and often ask to buy before the demo ends. This creates
  a coaching environment focused on excellence, not
  convincing.

  Impact on a Market That’s Ripe for Transformation

  Talent teams have been historically underserved. Your team
  will help prospects reimagine what a modern hiring platform
  can do—and you’ll have a front-row seat to shaping the next
  wave of innovation in TA tech.

  A Leadership Role Designed for Builders

  You’ll shape not just how Ashby sells, but how Ashby scales.
  The initiatives you lead will define how the SE team
  operates for years to come.

  What You’ll Do

  Lead & Grow a High-Performing SE Team

  - Hire, onboard, and develop world-class Solutions Engineers
    who become trusted advisors to mid-market prospects.
  - Coach SEs on discovery, storytelling, demo excellence,
    product knowledge, competitive positioning, and commercial
    partnership with AEs.
  - Create a culture of ownership, collaboration, and continuous
    improvement.

  Drive Excellence in Mid-Market Deal Execution

  - Partner with Mid-Market sales leadership to align on
    pipeline and priorities, ensuring SE coverage accelerates
    deal momentum.
  - Oversee the team's involvement in demos, trials, technical
    evaluations, and RFPs—ensuring every touchpoint is crisp,
    consultative, and actionable.
  - Review and elevate team execution, stepping in as a
    technical expert when needed.

  Support Building Scalable Systems, Processes & Enablement

  - Standardize and evolve demo workflows, trial frameworks, RFP
    processes, and internal product knowledge.
  - Identify patterns from the field and translate them into
    product feedback, roadmap insights, and internal process
    improvements.
  - Ensure the team is equipped with the right tools,
    enablement, and infrastructure to support complex multi-
    stakeholder sales cycles.

  You could be a great fit if:

  - 🎯 You have experience managing or mentoring Solutions
    Engineers in complex, multi-stakeholder SaaS sales
    motions.
  - 👥 You thrive in hiring, growing, and developing people—your
    success comes from your team’s success.
  - 🧭 You think strategically about process, enablement, and
    operational excellence, not just individual deal
    execution.
  - 🤝 You partner naturally with Sales Leadership and can
    influence cross-functional leaders with clarity and
    conviction.
  - 🧠 You have strong business acumen and can guide your team on
    how to connect Ashby’s capabilities to measurable customer
    outcomes.
  - 📣 You’re a clear communicator who can simplify complex
    concepts and coach others to do the same.
  - ⚙️ You love building—systems, playbooks, processes,
    knowledge bases, demo environments—and you do it with
    intentionality.
  - 💙 You have empathy for Talent teams and are energized by
    solving their real, nuanced challenges.

  Bonus Points For

  - 🤝 Experience with Applicant Tracking Systems or deep
    familiarity with TA workflows
  - 🧩 Experience building demo infrastructure, value frameworks,
    or trial structures
  - 📈 Experience leading cross-functional projects in rapidly
    scaling organizations

  Reasons You Shouldn’t Apply

  - You prefer maintaining the status quo rather than building
    new systems and iterating quickly.
  - You’re uncomfortable coaching people through feedback,
    growth, and evolving expectations.
  - You would rather execute deals yourself than enable a team
    around you to excel.
  - You’re not energized by both the business side and the
    technical side of solutioning.
  - Fast-paced, high-change environments feel overwhelming
    rather than exciting.
  - You have never owned a strategic project from inception
    through execution.

