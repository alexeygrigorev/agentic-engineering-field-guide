description: |
  ABOUT BASETEN

  Baseten powers mission-critical inference for the world's
  most dynamic AI companies, like Cursor, Notion,
  OpenEvidence, Abridge, Clay, Gamma, and Writer. By uniting
  applied AI research, flexible infrastructure, and seamless
  developer tooling, we enable companies operating at the
  frontier of AI to bring cutting-edge models into production.
  We're growing quickly and recently raised our $1.5B Series
  F, led by Altimeter Capital, Conviction Partners, and Spark
  Capital. Join us and help build the platform engineers turn
  to ship AI products.

  THE ROLE As a Software Engineer at Baseten, you will own one
  of the most critical surfaces of our business: pricing,
  billing, and revenue infrastructure. As we launch more and
  more products— billing is no longer just operational
  plumbing. It is a strategic lever for growth. This role will
  establish clear ownership of billing as a function and
  create leverage for Finance, Sales, and GTM teams while
  maintaining a seamless customer experience. RESPONSIBILITIES

  - Own Baseten’s end-to-end billing and revenue infrastructure,
    including pricing, invoicing, metering, and reporting
    foundations.
  - Build and evolve our billing platform and integrations
    (including Orb), ensuring correctness, auditability, and a
    high-trust experience for customers and internal teams.
  - Partner closely with Finance, Sales, GTM, and Forward
    Deployed Engineering to turn real-world workflows into
    reliable internal tooling and automation (quoting,
    approvals, renewals, usage reconciliation, revenue
    reporting).
  - Design systems that scale with new products, packaging, and
    go-to-market motions, making billing a strategic lever for
    growth.
  - Drive reliability and operational excellence for revenue-
    critical workflows: monitoring, alerting, incident
    response, backfills, and clear runbooks.
  - Lead from the front on high-impact projects: clarify
    requirements, propose crisp technical approaches, ship
    iteratively, and raise the bar on quality and velocity.
  - Debug and resolve production issues with urgency,
    communicating clearly with stakeholders and closing the
    loop with durable fixes.

  REQUIREMENTS

  - Bachelor's degree or higher in Computer Science or related
    field
  - Experience with billing systems or building internal tools
  - Deep knowledge of the web stack & databases
  - Strong collaboration and communication skills

  BENEFITS

  - Competitive compensation, including meaningful equity
  - (U.S. only) 100% coverage of medical, dental, and vision
    insurance for employee and dependents
  - Flexible PTO policy including company wide Winter Break (our
    offices are closed from Christmas Eve to New Year's Day!)
  - Paid parental leave
  - Fertility and family-building stipend through Carrot
  - (U.S. only) Company-facilitated 401(k)
  - Exposure to a variety of ML startups, offering unparalleled
    learning and networking opportunities.

  Apply now to embark on a rewarding journey in shaping the
  future of AI! If you are a motivated individual with a
  passion for machine learning and a desire to be part of a
  collaborative and forward-thinking team, we would love to
  hear from you.

  At Baseten, we are committed to fostering a diverse and
  inclusive workplace. We provide equal employment
  opportunities to all employees and applicants without regard
  to race, color, religion, gender, sexual orientation, gender
  identity or expression, national origin, age, genetic
  information, disability, or veteran status.

  We are an Equal Opportunity Employer and will consider
  qualified applicants with criminal histories in a manner
  consistent with applicable law (by example, the requirements
  of the San Francisco Fair Chance Ordinance, where
  applicable).
