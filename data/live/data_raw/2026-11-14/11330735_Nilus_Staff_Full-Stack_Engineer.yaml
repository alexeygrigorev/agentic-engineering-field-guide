description: |
  Who are we?

  Applied AI for liquidity.

  Corporate finance teams still manage cash by hand —
  stitching together spreadsheets, bank portals and ERP data
  across Treasury, AR and AP. Most treasury tools stop at
  visibility: a dashboard someone still has to read, interpret
  and act on.

  Nilus goes further. We're building an agentic workforce for
  treasury — AI agents that reconcile cash, forecast liquidity
  and automate finance ops across every bank and ERP, in one
  connected system for Treasury, AR and AP.

  We're a Series A company backed by Bessemer Venture
  Partners, Felicis, Perpetual Growth and Better Tomorrow
  Ventures, led by a team of ex-fintech pros transforming the
  finance function.

  The role

  This is our first senior engineering seat in New York.
  You'll work directly with our Head of AI, building the
  products we're investing in next, alongside our R&D team in
  Tel Aviv.

  It's a hands-on staff role with real ownership. You'll build
  features end to end — data model through interface — and
  have genuine input into what we build, not only how.

  What you'll do

  - Design and build new products and features across backend
    and frontend
  - Own technical decisions on the work you lead, and raise the
    engineering bar around you
  - Work closely with product on shaping what ships
  - Use AI coding tools (Claude Code, Codex) as a core part of
    how you work
  - Collaborate day to day with our engineering team in Tel Aviv

  What we're looking for

  - 8–12+ years as a software engineer, at staff level or
    equivalent scope
  - Genuine full-stack depth — you've built and owned both
    backend and frontend
  - Strong command of our stack: TypeScript, Node.js, Postgres,
    tRPC, Vercel, AWS
  - Experience building products from the ground up, and comfort
    moving quickly
  - Fluency with AI-assisted development (Claude Code, Codex, or
    similar)

  Nice to have

  - Product sense and experience partnering closely with PMs
  - Experience building agentic or LLM-powered product features
  - Fintech, payments, banking or treasury background
  - Experience working with a distributed engineering team
    across time zones

  Compensation

  The base salary range for this role is $180,000 – $250,000.
  Actual base pay will depend on experience, skills and scope.
  The role also includes equity and a full benefits package
  (medical, dental and vision).

  Nilus is an equal opportunity employer. We consider all
  qualified applicants without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age, disability, veteran status, or any other
  characteristic protected by law.
