  partnerships and networks combine to deliver a unique set of
  products and services that help people, businesses and
  governments realize their greatest potential. Title and
  Summary Principal Software Engineer Join Mastercard's
  Operations Automation Program as a Principal Engineer for
  our DevOps team that powers infrastructure automation across
  on-prem data centers and the cloud using Terraform, Chef,
  Ansible and other exciting tools. Role In this role you will
  enable automation, deployment and management of critical
  high-volume infrastructure into public and private cloud
  environments. You will work with global engineering teams to
  drive DevOps initiatives across the platform utilizing a
  highly scalable architecture leveraging enterprise tools and
  technologies. This is a unique opportunity to shape the
  future of Mastercard's infrastructure automation -advancing
  innovative, high-performance solutions and driving
  engineering and operational excellence across the
  organization.• Automate, provision and manage public and on-
  prem cloud infrastructure, including containerized and
  virtualized systems• Plan, build, and optimize CI/CD
  pipelines to enable fast, safe, and repeatable delivery of
  complex distributed systems across a global network of data
  centres.• Collaborate in cross-functional teams to automate
  deployments, troubleshoot complex issues, and support new
  product initiatives• Champion Infrastructure as Code
  principles using tools like Terraform Enterprise, Ansible
  and Chef• Drive observability and reliability through
  monitoring, logging, and alerting systems (Prometheus,
  Grafana, Druid, Splunk etc.).• Foster innovation and
  continuous improvement, adopting new tools and practices to
  increase efficiency, scalability, and cost optimization.•
  Hands-on coding of automation efforts in Go Lang • Partner
  with stakeholders to align DevOps initiatives with business
  objectives, including uptime, deployment velocity, and cost
  efficiency. All About You• 10+ years of experience in
  Software Engineering and DevOps roles, including at least 2
  years in a technical leadership capacity.• Strong Linux
  systems administration background• Deep familiarity with
  cloud environments either AWS, Azure or GCP• Proven
  experience with container orchestration and tooling
  (Kubernetes, Helm, Docker Compose).• Hands-on experience
  with Terraform Enterprise, Ansbile and Chef• Strong
  understanding of CI/CD pipelines (GitHub Actions, Jenkins
  etc.).• Proficient in scripting and programming (Bash,
  GoLang Python, Ruby ).• Experience with monitoring and
  observability platforms (Prometheus, Grafana, Splunk,
  Dynatrace).• Excellent communication skills and the ability
  to work effectively with Product, Developers and Operations
  teams.• Demonstrated ownership mindset, prioritization
  skills, and ability to thrive in a fast-paced, multi-tasking
  environment. Corporate Security Responsibility All
  activities involving access to Mastercard assets,
  information, and networks comes with an inherent risk to the
  organization and, therefore, it is expected that every
  person working for, or on behalf of, Mastercard is
  responsible for information security and must:

  - Abide by Mastercard's security policies and practices;
  - Ensure the confidentiality and integrity of the information
    being accessed;
  - Report any suspected information security violation or
    breach, and
  - Complete all periodic mandatory security trainings in
    accordance with Mastercard's guidelines.
