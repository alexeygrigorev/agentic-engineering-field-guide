description: |
  About Renaissance

  When you join Renaissance®, you join a global leader in
  pre-K–12 education technology! Renaissance’s solutions help
  educators analyze, customize, and plan personalized learning
  paths for students, allowing time for what matters—creating
  energizing learning experiences in the classroom. Our
  fiercely passionate employees and educational partners have
  helped drive phenomenal student growth, with Renaissance
  solutions being used in over one-third of US schools and in
  more than 100 countries worldwide.

  Every day, we are connected to our mission by exemplifying
  our values: trust each other, win together, strive for the
  best, own our actions, and grow and evolve.

  Job Description

  Renaissance is looking for an experienced Software Engineer
  II to be part of the Engineering Enablement group’s
  DevSecOps Team with a focus on administering CI-CD, Runtime
  & AI Platforms.

  We are at the crossroads of evolving our current team and
  looking for someone who has been involved in the Engineering
  Enablement/DevSecOps/AI first journey at other companies. We
  are looking for someone who is a problem solver, self-
  motivated, great at communication, values teamwork. You will
  apply your technical expertise to build and scale our highly
  available distributed SaaS platform used by millions of K-12
  students worldwide.

  In this role, you will: 

  - Administer the CI-CD, Runtime & AI Platforms used by our
    Engineering Teams.
  - Support day-to-day CI-CD, Runtime & AI Platform questions
    from Engineering Teams.
  - Look at ways to improve the team processes at Renaissance
    using AI Agents.
  - Be on call rotation and support off hours and weekends when
    needed.

  Qualifications

  For this role, you must have: 

  - 4+ years of experience focused on Software Engineering,
    Engineering Enablement functions.
  - Experience in managing & monitoring containerized cloud
    environments in production, preferably AWS.
  - Experience with IaC, Configuration Management and
    Orchestration Tools like Terraform/Docker/Ansible.
  - Experience in any of the programming or scripting languages
    like .NET/Java, Python, Javascript etc .,

    Optionally, you could have: 

  - BS in Information Systems or Computer Science, related field
    experience, or both.
  - AWS, Github, Claude & other Engineering Tool Administration
    (Ex: LaunchDarkly, Datadog etc.,).
  - Experience using Claude using agentic coding, agentic SDLC,
    software factories.
  - Experience setting up Monitoring, Logging, Alerting &
    Observability in tools such as NewRelic, Datadog.
    CloudWatch.
  - Experience w/Teleport, Hashicorp Boundary, Hashicorp Consul,
    Vault etc.,

  Additional information

  All your information will be kept confidential according to
  EEO guidelines.

  Salary Range: The base range for this position is $82,200.00
  - $100,000.00. This range is based on national market data
  and may vary by experience and location.

