  About Us

  Fortive Corporation Overview

  Fortive’s essential technology makes the world stronger,
  safer, and smarter. We accelerate transformation across a
  broad range of applications including environmental, health
  and safety compliance, industrial condition monitoring,
  next-generation product design, and healthcare safety
  solutions.

  We are a global industrial technology innovator with a
  startup spirit. Our forward-looking companies lead the way
  in software-powered workflow solutions, data-driven
  intelligence, AI-powered automation, and other disruptive
  technologies. We’re a force for progress, working alongside
  our customers and partners to solve challenges on a global
  scale, from workplace safety in the most demanding
  conditions to groundbreaking sustainability solutions.

  We are a diverse team 18,000 strong, united by a dynamic,
  inclusive culture and energized by limitless learning and
  growth. We use the proven Fortive Business System (FBS) to
  accelerate our positive impact.

  At Fortive, we believe in you. We believe in your
  potential—your ability to learn, grow, and make a
  difference.

  At Fortive, we believe in us. We believe in the power of
  people working together to solve problems no one could solve
  alone.

  At Fortive, we believe in growth. We’re honest about what’s
  working and what isn’t, and we never stop improving and
  innovating.

  Fortive: For you, for us, for growth.

  About the Team

   About ServiceChannel



   ServiceChannel empowers many of your favorite brands to
  take care of their brick and mortar locations. Our customers
  are market leaders in the retail, restaurant, grocery,
  convenience store, fitness, banking, education and health
  industries. The facilities and store operations teams at
  CVS, Trader Joe’s, Adidas, Louis Vuitton and Chipotle, among
  500 other brands in over 70+ countries, rely on us to
  deliver the best possible guest and employee experience. We
  are the leader in our space, and we continue to earn that
  position by driving innovation around IOT, AI and data with
  our software and services.



   In 2021, we joined the Fortive family of leading technology
  companies, united by a common purpose to make the world
  stronger, safer and smarter. Fortive is a Fortune 500
  company and has been named by Fortune as one of the world’s
  most admired companies. Being part of Fortive means we are
  supported by a strong foundation of business systems,
  resources and culture, which will accelerate our growth
  journey!



   We offer an excellent benefits package including medical,
  dental, vision, life and LTD insurance, HSA, and a 401(k)
  retirement plan.



