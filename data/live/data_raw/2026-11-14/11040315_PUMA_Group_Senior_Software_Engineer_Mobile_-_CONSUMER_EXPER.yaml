description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Experience Engineering
  organisation responsible for building fast, intuitive,
  accessible and premium digital experiences across web and
  mobile. The organisation owns the web & mobile platforms,
  engineering delivery for consumer-facing journeys, shared
  design systems, performance, accessibility and AI-native
  engineering practices that help product teams deliver
  consistent, reusable, high-quality consumer experiences
  across the globe.

  The Senior Software Engineer (Mobile) is responsible for
  designing, building, optimizing, and supporting scalable
  consumer-facing mobile applications while driving
  engineering excellence, architectural best practices, and
  operational reliability across iOS and Android platforms.

  What you will do:

  - Design, build and maintain scalable mobile applications
    using React Native, TypeScript and JavaScript.
  - Develop native iOS and Android integrations to deliver
    seamless consumer experiences.
  - Define and implement robust application architecture, state
    management and API integration patterns.
  - Collaborate with Product Owners, Design, QA and Engineering
    teams to deliver high-quality consumer-facing solutions.
  - Build secure, reliable and high-performing mobile
    applications following engineering best practices.
  - Develop reusable components, shared libraries and mobile
    engineering frameworks.
  - Implement testing, code quality and automation practices
    across the development lifecycle.
  - Monitor, troubleshoot and optimise application performance,
    stability and consumer experience.
  - Contribute to App Store and Google Play releases, CI/CD
    pipelines and deployment automation.
  - Drive engineering excellence through code reviews, technical
    mentoring and continuous improvement.
  - Shape architecture decisions, produce technical
    documentation and maintain engineering standards within
    the team.
  - Participate in Agile delivery activities including planning,
    estimation, refinement and retrospectives.
  - Support experimentation, feature flagging and data-driven
    product optimisation initiatives.

  YOUR TALENT

  - 7+ years of software engineering experience, including
    significant hands-on experience building mobile
    applications.
  - Strong hands-on experience with React Native, TypeScript and
    modern JavaScript development.
  - Solid understanding of iOS and Android platforms,
    application lifecycle and mobile platform capabilities.
  - Experience developing and integrating native iOS and Android
    modules when required.
  - Strong knowledge of mobile architecture patterns, modular
    design and scalable application development.
  - Experience implementing state management solutions and
    application data flow patterns.
  - Experience integrating mobile applications with REST and
    GraphQL APIs.
  - Strong understanding of secure application development,
    authentication, data protection and consumer privacy
    practices.
  - Experience building reusable components, shared libraries
    and maintainable mobile architectures.
  - Strong experience with unit, integration and end-to-end
    testing, including test automation.
  - Experience troubleshooting production issues, analysing
    crashes, monitoring application health and optimising
    performance.
  - Knowledge of observability, logging, release management and
    operational support practices.
  - Experience conducting code reviews, mentoring engineers and
    promoting engineering best practices.
  - Understanding of accessibility standards, mobile
    accessibility practices, mobile UX principles and cross-
    device compatibility.
  - Strong problem-solving, communication and collaboration
    skills.
  - Experience in Consumer, Retail, eCommerce or DTC products is
    preferred.
  - Experience with experimentation platforms, feature flagging
    and A/B testing is a plus.
  - Use AI-assisted engineering tools and practices to improve
    development quality, delivery efficiency, testing and
    technical documentation.
  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field.

