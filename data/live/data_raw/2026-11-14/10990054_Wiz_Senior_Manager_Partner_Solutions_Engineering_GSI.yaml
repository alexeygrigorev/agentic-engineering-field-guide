  relevant education or training. Your recruiter can share
  more about the specific salary range for your preferred
  location during the hiring process.

  Please note that the compensation details listed in US role
  postings reflect the base salary only, and do not include
  bonus, equity, or benefits. Learn more about benefits at
  Google.

