description: |
  Come join the organization that is redefining security for
  the AI era. As one of the fastest-growing startups ever, we
  enable teams to secure cloud and AI applications by
  connecting code, cloud, and runtime into a single shared
  context. Trusted by security teams all over the world, we
  have a proven track record of success and a culture that
  values world-class talent. Not to mention, we're now powered
  by Google, meaning we offer our customers an AI-powered
  platform that harnesses Google’s Threat Intelligence and
  Security Operations to better detect, prevent, and respond
  to threats across all environments, allowing for further
  innovation.

  Our Wizards from all over the globe work together to protect
  the infrastructure of our customers, including over 65% of
  the Fortune 100, who trust us to scan and secure over 230
  billion files daily. We’re honored to be a leading player in
  a massive and growing market, and we continue to look for
  exceptional Wizards who are eager to make a significant
  impact on our team. At Wiz, you’ll have the freedom to think
  creatively, dream big, and use your full range of skills to
  contribute to our momentous growth. Come join our team and
  help us create secure cloud environments that allow even the
  best companies to move faster, all while having some fun!

  Minimum Qualifications:

  - 7+ years of experience in Partner Solutions Architecture,
    Solutions Engineering, or similar functions in a global
    SaaS or cloud security organization, with 5+ years of
    experience developing, managing, and coaching technical
    teams.
  - Proven track record of recruiting, retaining, developing,
    and coaching a globally distributed team of skilled
    Partner Solutions Architects.
  - Exceptional communication & executive presence – Proven
    ability to confidently engage and influence C-level
    executives, partner leaders, and internal stakeholders.
  - Deep understanding of partner ecosystems (GSIs, CSPs,
    regional SIs, VARs, MSPs), their complex organizational
    structures, and knowledge of how to navigate across the
    various teams within them.
  - Strong technical leadership skills – A proven ability to
    "lead from the front" by balancing team management with
    hands-on technical engagement.
  - Technical competency in cloud security – Hands-on
    understanding of AWS, Azure, GCP, networking, cloud
    identity & access management, containers, and CSPM/CNAPP
    solutions.
  - Operational acumen – Experience deploying programs to
    advance the technical and selling skills of your team,
    alongside a history of driving accountability using
    metrics and systems (e.g., Salesforce).
  - Managed services expertise – Detailed understanding of
    managed services offerings from a technical, commercial,
    and operational perspective.
  - Global mindset – Experience working across multiple
    geographies and cultures, with an ability to scale
    programs worldwide.

  Preferred Qualifications:

  - Experience with traditional CSPM, CNAPP, or cloud
    infrastructure security solutions.
  - Technical SaaS Selling experience.
  - Understanding of CI/CD pipelines and Infrastructure-as-Code
    (Terraform, CloudFormation, etc.).
  - Previous experience in Partner Program Management or
    Services GTM Strategy.

  About the Job:

  We are seeking a Sr. Manager of Global Partner Solutions
  Architecture to direct and scale our strategy for driving
  technical excellence across our global partner network. In
  this pivotal leadership position, reporting to the Head of
  Partner Solutions Architecture, you will collaborate closely
  with our Global GSI Leader on strategic execution while
  aligning with Sales, Product, and Partner organizations
  globally.

  You’ll lead a globally distributed team responsible for
  enabling Global Systems Integrators (GSIs) to scope,
  solution, and deliver world-class cloud security services
  built on our platform. You will thrive as a technical leader
  of the team not only in performing team leadership but also
  by getting your hands into the technology. By leading from
  the front and maintaining a strong executive presence, you
  will play a pivotal role in ensuring partners can
  confidently deploy and support our solutions, driving both
  partner-driven revenue and high-quality service delivery.

  Responsibilities:

  - Build & Lead a Global Team – Recruit, retain, develop, and
    coach a high-performing global team of Partner Solutions
    Architects—driving technical excellence and measurable
    partner impact.
  - Lead from the Front – Thrive as a technical leader who stays
    hands-on with technology. Invest time in learning new
    product features and be the trusted advisor to your
    partners for all things related to cloud security across
    AWS, Azure, and GCP.
  - Executive-Level Partner Engagement – Leverage strong
    executive presence to build relationships with senior
    leaders, GSI, and CSP partner sales leaders. Create deep
    alignment, strengthen technical interlock, and drive joint
    business success.
  - Drive Partner Technical Enablement – Develop and oversee
    structured enablement programs that equip partners to
    confidently scope, sell, and deliver solutions. Ensure
    partners are technically proficient, certified, and self-
    sufficient in their service delivery.
  - Strategic GTM Insertion – Partner with sales leaders to
    insert our platform into strategic go-to-market (GTM)
    insertion points within the partners and help build
    corresponding services practices around our technology.
  - Ensure Service Quality & Consistency – Establish and enforce
    best practices, methodologies, and technical frameworks
    that improve the quality and consistency of partner-
    delivered services.
  - Operational Excellence & Coaching – Set clear performance
    expectations and objectives for the team. Provide regular
    feedback, partner with product and sales groups to drive
    operational efficiency, and maintain a history of driving
    team accountability.
  - Cross-Functional Influence – Collaborate closely with Sales,
    Product, and Solutions Engineering leadership to share
    best practices, ensure consistency between direct and
    partner-led engagements, and establish feedback loops that
    accelerate product innovation.

  Compensation + Benefits

  Compensation for this full-time position includes base
  salary + bonus + equity + benefits. Our salary ranges are
