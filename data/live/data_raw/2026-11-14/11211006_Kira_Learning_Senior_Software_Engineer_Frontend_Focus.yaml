title: Senior Software Engineer (Frontend Focus)
company: Kira Learning
location: New York, USA
work_type: FULL_TIME
company_size: 50 Employees
description: |
  We live in a world where technology is rapidly changing the
  educational experiences of students and teachers everywhere,
  and we have the opportunity to shape how this change takes
  place. It is Kira Learning’s mission to harness
  transformative AI technologies to make world-class teaching
  and learning accessible to everyone. As an engineer at Kira,
  you will lead crucial projects and initiatives that have
  never been done before, and you will have the opportunity to
  help us build products that improve teaching and learning
  experiences across the world.

  Kira is a rapidly growing startup backed by top-tier Venture
  Capital funds including New Enterprise Associates (NEA),
  Andrew Ng’s AI Fund, and Primavera. This is a full-time
  position that requires flexibility with work hours and
  availability outside of regular business hours. We have
  offices in San Francisco, CA and New York City, NY and we
  ask that employees work from one of the two locations and
  come into the office in-person 4 days a week.

  What You’ll Do

  - Own and ship polished, end-to-end product features that
    improve student and teacher experiences
  - Partner closely with product managers and designers on UX,
    interaction design, and visual quality
  - Help shape frontend and full-stack technical direction,
    translating product goals into pragmatic implementation
    plans
  - Improve product quality, performance, accessibility, and
    maintainability across the frontend codebase
  - Contribute across the full development lifecycle, including
    prototyping, testing, rollout, and support
  - Collaborate with engineers to design APIs and deliver
    cohesive end-to-end solutions

  What We’re Looking For

  - Bachelor’s or Master’s degree in Computer Science, or
    equivalent technical experience
  - 8+ years of professional software engineering experience or
    equivalent practical experience
  - Strong React and Typescript experience, with ownership of
    production-grade user-facing features used by hundreds of
    thousands to millions of users
  - Experience building modern web applications using TypeScript
    and React
  - Strong CSS skills, with experience using systems such as
    Tailwind, SCSS
  - Solid backend experience (e.g., Kotlin, Python, Go, Rust,
    Scala), with willingness to ramp up on Kira’s stack
    (Kotlin, Python)
  - Solid full-stack fundamentals, including working with APIs
    and relational databases (e.g., MySQL)
  - Experience owning, leading, and shipping complex features
    with minimal guidance
  - 2+ years experience mentoring and/or managing junior and
    mid-level engineers, fostering a culture of continuous
    learning and high-quality delivery
  - Familiarity with automated testing and CI/CD practices for
    reliable frontend delivery
  - Ability to communicate clearly about technical and product
    tradeoffs with both technical and non-technical partners
  - Comfort operating in a fast-paced, early-stage startup
    environment with evolving requirements
  - (Preferred) Experience integrating and shipping features
    backed by LLMs or AI APIs (e.g., OpenAI, Anthropic)

  What We Offer

  - Competitive compensation and equity. For applicants in the
    US, the salary range for this role is $180,000 -
    $250,000+, depending on relevant considerations like
    professional experience and related skill sets.
  - Medical, dental, vision and life insurance, including a
    medical insurance plan with 100% coverage of employee
    premiums.
  - Flexible PTO policy and company holidays.
  - DoorDash credit for lunch daily.
  - Wellhub Membership: 100% company-paid access to premium gym
    networks (Orangetheory, SoulCycle), 60+ wellness apps
    (Headspace, MyFitnessPal, Apple Fitness+), and 1:1
    coaching sessions spanning fitness, mental health,
    nutrition, and sleep.
  - Dog friendly office 🐶.

  Equal Employment Opportunity Employer

  At Kira, we are committed to providing an environment of
  mutual respect where equal employment opportunities are
  available to all applicants without regard to race, color,
  religion, sex, pregnancy (including childbirth, lactation
  and related medical conditions), national origin, age,
  physical and mental disability, marital status, sexual
  orientation, gender identity, gender expression, genetic
  information (including characteristics and testing),
  military and veteran status, and any other characteristic
  protected by applicable law. Kira believes that diversity
  and inclusion among our employees are critical to our
  success as a company, and we seek to recruit, develop and
  retain the most talented people from a diverse candidate
  pool. Selection for employment is decided on the basis of
  qualifications, merit, and business need.

  Background Check

  Kira will make a conditional job offer in line with local,
  state and federal laws, and a subsequent criminal,
  education, and employment history background check will then
  be issued.
