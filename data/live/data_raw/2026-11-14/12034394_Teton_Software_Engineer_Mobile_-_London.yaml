description: |
  ABOUT US

  Teton is redefining the role of healthcare workers through
  cutting-edge AI technology and a great product experience.
  As populations grow older and staff shortages increase,
  healthcare systems are under pressure. Our mission is to
  decrease the cost of healthcare while improving the quality
  of care.

  Our product enables care teams to intervene, prevent and
  operate more efficiently. Our ambient sensors in resident
  rooms capture activity, sleep, respiration, gait and more.
  These signals are used both to react fast to risk events,
  like falls, and for long-term health analysis, so care teams
  can take action.

  Teton is scaling fast, operating in the Nordics, the UK,
  DACH and the US. We recently raised a $20M Series A. You can
  expect travel to the US to meet users and team members.

  We focus relentlessly on product excellence and user
  experience, deploying solutions at speed that make a
  tangible difference for carers. We are an aspiring
  meritocracy, biased towards action and always striving to
  raise the bar. If you are driven by impact, speed and
  levelling up, this might be the place for you.

  The position is onsite at our office in London, United
  Kingdom. If you are looking for a 9-to-5 job, perform best
  with structure and struggle to deal with unknowns, this is
  not for you. We believe close collaboration within a hard-
  working, high-agency team enables the fastest and most
  efficient iteration cycles, helping us build an impactful
  product that healthcare professionals truly love to use.

  THE JOB

  We're looking for a talented and driven Software Engineer to
  join our Mobile team, building the tools that care workers
  rely on during every shift. Our app runs 24/7 in care
  facilities, delivering real-time alerts and monitoring
  residents. This isn't a typical app dev role. You'll work
  across the full stack, from React Native UI to backend
  infrastructure, in an environment where reliability directly
  impacts patient safety.

  In this role, you will focus on:

  - Feature Development: Own features end-to-end, from design
    discussions through implementation to production rollout
    across multiple markets and languages.
  - Reliability & Debugging: Keep our real-time alert pipeline
    rock-solid. Debug push notification delivery on Android
    and iOS, investigate ANR issues, and troubleshoot weird
    bugs in care environments with unreliable Wi-Fi.
  - Backend, Infrastructure & Systems: Work across backend
    services, databases, cloud infrastructure and internal
    platforms to support the systems our app depends on. You
    will not just consume APIs; you will help shape, improve
    and fix the systems behind them.
  - Testing & Validation: Build automated test coverage (e.g.
    Maestro for E2E) across a range of devices and OS
    versions. Validate that alerts arrive when they must.
  - Developer Experience: Improve shared components, internal
    tooling and build pipelines so the team ships faster with
    fewer surprises.

  QUALIFICATIONS

  - Strong TypeScript skills. This is the language for
    everything we build.
  - Solid experience with React Native and Expo in production.
  - Comfortable working across the stack: you've touched
    databases, queues or cloud infrastructure, not just UI.
  - Experience with native iOS or Android development
    (Kotlin/Swift) is a strong plus, as we occasionally need
    to go below the managed Expo layer.
  - Familiarity with real-time systems, push notifications or
    TanStack is a plus.
  - AWS or equivalent cloud platform experience.
  - Previous startup experience and/or shipping a product where
    you owned the outcome.
  - Strong problem-solving skills and the ability to work both
    independently and in a team.

  WHAT WE OFFER

  - Participation in our warrant program (stock options).
  - A small team where your decisions directly shape the
    product.
  - A London-based office with close collaboration, no async-
    only culture.
  - Work on software that healthcare workers depend on every
    day. The impact is tangible and immediate.

  JOIN OUR TEAM

  We're looking for individuals who share our vision and value
  ownership and entrepreneurship over a conventional job.

  At Teton, you'll have the chance to make a real impact with
  your work.

  If you're ready for more than just a job, come aboard and be
  part of our mission to transform healthcare.
