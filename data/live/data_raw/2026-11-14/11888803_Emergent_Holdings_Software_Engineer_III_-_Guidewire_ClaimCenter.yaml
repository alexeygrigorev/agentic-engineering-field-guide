description: |
  Responsible for designing, developing, configuring, testing,
  and documenting applications, integrations, tools, systems
  and components based on project or change request
  specifications and procedures using knowledge of and ability
  to code in JavaScript (including user interfaces), Java,
  .Net, and other web-related technologies as well as or other
  object-oriented development languages. Responsible for the
  production support of internally developed and third-party
  applications, processes, and reports. Acts as an application
  owner for incident management, technical troubleshooting,
  root cause analysis, correction of software defects, and
  production application validation.  Assist in design and
  maintenance of existing software.  Follows standard
  troubleshooting and development procedures using various
  tools. May assist with complex incident management
  situations.  Works within the System Development Life Cycle.

  - Monitor the lifecycle of systems by being aware of
    obsolescence and release dates for the product per the
    System Development Lifecycle.
  - Review patch and upgrade information and ensure
    implementation where appropriate.
  - Owns problem management process and ensures resolution to
    completion, including identifying discrepancies between
    systems and developing preventative measures for the long
    term.
  - Track issues and errors, documenting resolutions.
  - Act as a liaison between the Company and third-party
    vendors.
  - Demonstrate ability to work under stressful situations and
    display professional demeanor.
  - Ensure that documentation is available for both
    administrators and users.
  - Respond to and resolve reported application, data, or tool
    issues in a timely manner.
  - Identify and resolve advanced application issues using
    appropriate code languages, toolsets, or configuration
    processes.
  - Perform peer reviews for Level I and II Developers on
    technical design approaches and ensuring conformity to
    standards and quality.
  - Ensure changes follow appropriate release management
    processes.
  - Raise awareness of application, tool and data issues and
    resolutions with the Customer and appropriate IS
    personnel.
  - Create and review/approved technical design documents and
    specifications on change requests and assignments within a
    project while maintaining documentation and abstracts in
    conformance with standards.
  - Maintain knowledge of standards and quality requirements.
  - Assist development with analysis and design for new or
    existing systems.
  - Periodically participate in groups/committees related to
    processes, standards, and best practices.
  - Maintain and enhance technical abilities through online
    resources such as manuals, periodicals, and white papers.
  - Review program specifications for completeness and
    conformance to quality standards.
  - Periodically prepare reports for review by project
    leader/system supervisor.
  - Works with minimum supervision and exercises sufficient
    discretion and independent judgment.
  - Maintains confidentiality of information processed, as
    appropriate.
  - Verify changes by developing unit test plans, test data and
    scripts.  Also perform desk checks and debugging.
  - Mentor less experienced Level I and Level II Developers.
  - Works with architecture group to set direction of design and
    development standards. Assists with implementation and
    execution of those standards. Serves as a project leader
    to ensure quality deliverables and sound design execution.
  - Evaluates user requests for new or modified programs to
    determine feasibility, cost and time required,
    compatibility with current systems, and computer
    capabilities.

  EDUCATION

  - Bachelor’s degree in computer science or related field.
  - Combinations of relevant education, certifications, and
    experience may be considered in lieu of a degree.
  - Continuous learning, as defined by the Company’s learning
    philosophy, is required.
  - Certification or progress toward certification is highly
    preferred and encouraged.

  EXPERIENCE

  - Five years’ experience within an IT environment which
    provides the necessary skills, knowledge and abilities.
  - Knowledge of Test-Driven Development preferred.
  - Experience with tools such as PL/SQL Developer and Microsoft
    Team Foundation Server (TFS) preferred.
  - Experience with WCF Technology certifications
    (BizTalk/.NET/Oracle/SQL Server) preferred.

  QUALIFICATIONS

  - Knowledge of, and the ability to apply, necessary software
    programming practices and procedures.
  - Ability to apply the principles of independent logical
    thinking to define problems, collect data, establish
    facts, and draw valid conclusions.
  - Ability to comprehend the consequences of various problem
    situations and to refer them for appropriate decision
    making.
  - Proficiency in SQL and relational database concepts.
  - Ability to design program logic, prepares test data, and
    test programs.
  - Ability to review business requirements and compare to
    application for possible deviations from customer
    expectations.
  - Excellent triage, troubleshooting and problem-solving
    skills.
  - Ability to handle multiple priorities, establishes
    workflows, and meets necessary deadlines.
  - Excellent oral and written communication skills.
  - Ability to effectively exchange information clearly and
    concisely, and present ideas, report facts and other
    information, and respond to questions as appropriate.
  - Ability to maintain confidentiality.
  - Ability to perform other assignments at locations outside
    the office.
  - Ability to work varying hours, including evenings, weekends
    and holidays as required.
  - Demonstrated leadership ability.
  - Understand the need for, and display, a strong sense of
    urgency while maintaining a high level of quality.
  - Knowledge of and ability to code in HTML, XML, JavaScript
    and other web-related technologies.
  - Proficiency in Java, .NET or other object-oriented
    development languages.
  - Working knowledge of Oracle and Microsoft SQL DDL and DML.
  - Experience with development using Oracle Middleware.
  - Knowledge of and sound-decision making around the use of
    enterprise scheduling and monitoring tools.
  - Ability to ensure successful automated functional testing
    across applications.
  - Ability to establish expected load test service level
    agreements (SLA) with technical partners.
  - Experience creating test scripts, test harnesses, programs,
    and/or drivers to run automated functional and performance
    tests.
  - Experience translating test plans and test cases into
    automated testing functions and load testing scripts using
    an existing automation framework.
  - Must possess strong orientation for both the functional and
    performance testing aspects.
  - Java, Visual Basic, or C++ development experience.
  - Working knowledge of testing best practices demonstrated
    through a Software Tester certification such as CTFL,
    CTAL, CSQE, or CSTE preferred.

   PAY RANGE:

  “Actual compensation decision relies on the consideration of
  internal equity, candidate’s skills and professional
  experience, geographic location, market and other potential
  factors. It is not standard practice for an offer to be at
  or near the top of the range, and therefore a reasonable
  estimate for this role is between $64,00 and $147,250.”



