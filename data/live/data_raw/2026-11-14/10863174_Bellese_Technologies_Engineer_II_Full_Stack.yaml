description: |
  Bellese is a mission-driven Digital Services Company
  committed to pioneering innovative technology solutions in
  civic healthcare. Our dedication lies in making a meaningful
  impact on public health outcomes.



  Driven by service design, we strive to know the “Why” to
  understand the healthcare journey for patients, caregivers,
  providers, payers, and policymakers. Our goal is to design
  and build solutions that reduce confusion, provide clarity,
  support decision making, and streamline the process so that
  we and our partners can focus on providing better health
  outcomes by improving patient care and reducing costs and
  burden.

  Please note this position requires 8 YOE with a BA.  Four
  additional YOE may substitute for the education
  requirements. This is a contractual obligation.

  Team you will be joining

  The Centers for Medicare & Medicaid Services (CMS) is
  enhancing program integrity efforts to combat fraud, waste,
  and abuse (FWA) within Medicare and Medicaid. The Unified
  Case Management (UCM) system serves as a centralized
  application for Program Integrity Contractors, facilitating
  case tracking, audits, investigations, and workload
  management. UCM supports coordinated efforts to prevent FWA
  and ensure compliance through efficient lead management,
  investigative actions, and reporting. As part of CMS’s
  modernization initiative, we are transforming UCM into a
  modern, scalable architecture that enhances performance,
  security, and usability. This effort includes migrating to
  cloud-based solutions, improving system interoperability,
  and adopting cutting-edge technologies to streamline
  workflows and improve data-driven decision-making. Our goal
  is to ensure a more robust, efficient, and future-ready
  platform for program integrity operations.

  As a Full Stack Engineer, you will:

  Influence: Make an impact on one or more projects or
  products.

  Technology: Highly proficient in one or more technologies
  within the Software Engineering discipline. Particularly
  skilled in one or more technologies.

  System: Reliably scope, estimate, design, and deliver
  medium-to-large features while reducing the technical debt
  of one or more projects or products.

  People: Proactively support other team members and help them
  to be successful.

  Process: Follow the team processes, delivering a consistent
  flow of features to production.

  These are the types of things you’ll be working on

  Leverage test-driven development to deliver backend systems
  and user interfaces to ease development and integration
  between them.

  Contribute to the development of APIs, specifications, and
  data models, facilitating integration with frontend
  applications and third-party systems.

  Design, implement, and maintain data interactions. Optimize
  data operations for performance and scalability, and ensure
  data integrity and security.

  Design and develop user interfaces, informed by UX designs
  that meet customer needs.

  Understand and contribute to functional and non-functional
  automated testing suites.

  Tech used, but not limited to:

  Java (SpringBoot)

  Typescript

  Angular (React may be substituted for Angular)

  Maven

  Angular

  Javascript

  Nice to have

  Experience working on a large-scale system with over 100
  users

  PostgresSQL

  AWS knowledge & experience

  Camunda

  AI/ML

  FHIR

  Security Clearance Requirements

  - US Citizenship or Green Card only - we do not offer
    Sponsorship
  - US Residency for at least the past 3 years
  - Able to meet the requirements to hold a position of Public
    Trust, including successful completion of a US Government
    background investigation
  - Disclaimer: Medical or recreational marijuana use is
    considered illegal at the federal level, regardless of
    state laws allowing such, and may affect your ability to
    obtain Public Trust. See article

  Work that matters, with perks that deliver. Discover how
  Bellese Technologies invests in you through a benefits suite
  that makes every day better

  - Remote First, Remote Only Culture
  - Four weeks paid time off yearly (prorated based on start
    date for the first year)
  - 10 paid floating company holidays
  - Flexible schedule
  - Work from home setup including a Macbook
  - Collaborative, learning environment
  - Medical, dental, and company-paid vision insurance
  - Optional HSA account with some medical plans and a company
    contribution
  - Company paid basic life and AD&D insurance coverages
  - Company paid short and long term life insurance
  - Optional critical illness and accident insurance
  - 401K plan with 3% safe harbor contribution
  - Wellness resources and virtual care
  - Perks Plus employee discounts

  You will like it here if

  - You foster a collaborative ethos, driven by the mission to
    deliver exceptional customer service to clients. You are
    passionate about Healthcare and changing the healthcare
    landscape. You’re an out of the box thinker, always
    striving to know the “why” when it comes to building
    solutions. You excel in a team-oriented, remote-first
    environment characterized by mutual respect and open
    communication. Your adaptability and ability to navigate
    challenges ensure your success in any situation.
