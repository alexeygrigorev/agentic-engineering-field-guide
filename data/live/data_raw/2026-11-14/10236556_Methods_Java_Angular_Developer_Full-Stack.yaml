description: |
  About Methods:

  Methods is a £100M+ IT Services Consultancy who has
  partnered with a range of central government departments and
  agencies to transform the way the public sector operates in
  the UK. Established over 30 years ago and UK-based, we apply
  our skills in transformation, delivery, and collaboration
  from across the Methods Group, to create end-to-end business
  and technical solutions that are people-centred, safe, and
  designed for the future.

  Our human touch sets us apart from other consultancies,
  system integrators and software houses - with people,
  technology, and data at the heart of who we are, we believe
  in creating value and sustainability through everything we
  do for our clients, staff, communities, and the planet.

  We support our clients in the success of their projects
  while working collaboratively to share skill sets and solve
  problems. At Methods we have fun while working hard; we are
  not afraid of making mistakes and learning from them.

  Predominantly focused on the public-sector, Methods is now
  building a significant private sector client portfolio.

  Methods was acquired by the Alten Group in early 2022. Alten
  is a global engineering firm with approximately 57,000
  employees specializing in engineering and IT services.

  Requirements

  We are looking for a Java / Python Developer to help manage,
  build, develop and design the Java Application with good
  exposure on springboot, microservices and system designing.

  - 6+ hands-on experience with Java, Angular, Spring,
    Typescript, Python
  - Strong object oriented design and development skills, data-
    structures and algorithms, and design patterns.
  - Excellent analytical ability.
  - Strong experience with relational databases logical
    modelling.
  - Strength in querying large relational databases in an
    optimized manner.
  - A culture of incorporating unit test cases when designing
    systems using Junit.
  - Strong collaboration and communication skills. The candidate
    will work in a global team where clear and concise
    communication skills are a must. Work independently
    following proper coding standards.
  - Exposure to leveraging AI agents and automation tools across
    software development, validation, and production
    deployment.
  - At least 6 years' relevant experience would generally be
    expected to find the skills required for this role.
  - EXCELLENT communication skills

