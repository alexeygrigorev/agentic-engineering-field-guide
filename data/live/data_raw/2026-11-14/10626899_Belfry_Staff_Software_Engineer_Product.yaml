description: |
  Build the platform a $50 billion industry runs on!

  Belfry is changing how the security guard services industry
  runs. We give back-office teams and field officers one
  modern platform to do their best work, and we are early
  enough that the engineers who join now will decide what it
  becomes.

  This is a seat for an engineer who wants the full early-
  stage experience: shape the tech stack, own real pieces of
  the product, learn directly from industry experts and
  investors, help build the team, and share in the upside
  through meaningful equity.

  What you'll own

  You will have real responsibility from day one. A few of the
  problems waiting for you:

  - AI agents for real customers. Build agents that solve actual
    customer problems, not demos.
  - The architecture. Design the foundation that lets Belfry
    scale as our user base grows.
  - How we build. Evolve our software development lifecycle to
    take full advantage of agentic tools.
  - Reliability you can trust. Deploy and scale systems with
    secure, available, performant best practices, and improve
    monitoring and telemetry so we always know how the product
    is behaving.
  - Standards and team. Set the technical standards across the
    full lifecycle, and improve the practices that make your
    fellow engineers faster.

  Built for Engineers who..

  - Have 6+ years as a software engineer and have owned complex
    backend or infrastructure projects before.
  - Want a high degree of responsibility and are excited to
    shape a company, not just a codebase.
  - Explain technical decisions and product ideas clearly, and
    grow by helping the people around them grow.
  - Pick the right tool for the job, and are actively exploring
    how AI coding tools change the way software gets built.
  - Have familiarity with React, Python, TypeScript or React
    Native. This is a plus, not a requirement.

  Why join Belfry?

  - Significant equity in a high-growth startup with a clear
    path to significant outcomes.
  - Real ownership. Shape the tech stack, own the product, and
    help build the team.
  - A team with a fantastic track record, plus direct access to
    industry experts and investors.
  - Fully covered healthcare, dental and vision.
  - Unlimited PTO and 11 paid holidays, and we actively
    encourage you to use them.

  Sound like the kind of problem you want to own? We would
  look forward to you applying!
