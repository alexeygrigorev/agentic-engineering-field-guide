description: |
  Aker Systems was founded in 2017 by a team of experienced
  technology professionals who recognised an opportunity to
  provide highly secure enterprise data platforms to large
  organisations.  We build and operate ground-breaking, ultra-
  secure, high performance, cloud-based data infrastructure
  for the enterprise. Our proprietary technology solutions
  drive performance and reduce costs while helping our clients
  to improve the management and sharing of data across their
  organisations.

  In 2024, Aker Systems won the Breakthrough Culture Awards
  highlighting growth companies putting culture first. In 2020
  Aker Systems was recognised as a ‘One to Watch’ on the
  Sunday Times Tech Track.  The Company was also recognised at
  the Thames Valley Tech Awards 2020; winning the Thames
  Valley Tech Company of the year, the Emerging Tech Company
  and High Growth Tech Business categories.  We encourage
  people of all different backgrounds and identities to apply.
  We are committed to maintaining an inclusive, and supportive
  place for you to do your very best work.

  Aker Systems designs, builds & operates advanced, ultra-
  secure data infrastructure, delivering data modernisation at
  enterprise scale to enable AI-driven transformation and
  seamless sharing of trusted data at scale, predominantly for
  highly regulated and Central Government clients in the UK.

  Aker has proven tech-enabled service offerings - covering
  the entire client lifecycle through strategic cloud & data
  capability leadership, secure cloud and data infrastructure
  modernisation, managed services in client environments and
  data & platform engineering.

  Aker powers AI digital transformation through trusted,
  enterprise scale data modernisation with proven mission
  critical, secure, trusted and real-time expertise &
  solutions. With deeply trusted relationships and influence,
  innovative technology and excellent delivery track record.

  Client Focus

  You will be working for national security and defence
  clients in the Southwest in the long term, across both short
  and long-lived programmes of work, as part of an Agile team
  of likeminded individuals that thrive on solving real-world
  problems, keeping the UK safe.

  We will support you in obtaining enhanced DV Clearance.
  Whilst eDV is being processed, you will be working with our
  Central Government clients on SC level work.

  Duties & Responsibilities

  As a Software Engineer, you will help lead the development
  of backend platforms and services for National Security and
  Defence clients leveraging the latest commercial and open-
  source technologies in private and public cloud
  environments.

  - Design, develop, document, deploy and enhance features to
    our platforms and services that meet functional / non-
    functional business requirements
  - Actively participate in the team’s elaboration and
    estimation of user stories
  - Build frequent, small releases to maintain the team’s
    momentum
  - Collaborate closely with other engineers in our cross-
    functional feature teams; ensuring that others can cover
    for you, and that you can cover for them
  - Build, optimise and operate our Continuous Deployment
    pipelines
  - Maintain operational responsibility for the services that
    your team owns

  Core Competencies

  The successful candidate will have at least 5 years
  professional experience delivering production grade cloud
  solutions.

  You will have demonstrated the following competencies to the
  proficiency level appropriate to the seniority of the role;

  - Fluent in writing JAVA coding and experience with JVM
    compatible languages (Kotlin, Scala)
  - Experience with Kafka or a similar platform.
  - Experience working in Agile DevSecOps environments and Zero
    Trust Architecture
  - Integrating with backing services, such as PostgreSQL, Redis
    or S3
  - Good engineering practices including continuous delivery,
    clean code, documentation, defensive programming,
    automated testing and code reviews
  - Using GitHub/GitLab/Atlassian Suite for source control
  - Test Driven Development with appropriate tools and
    frameworks
  - Experience with micro-service design patterns
  - Experience in Big Data technologies

  Aker Systems Attributes

  At Aker we work as a team; we are collaborative,
  hardworking, open, and delivery obsessed. There is no blame
  culture here: try things, and take responsibility for the
  outcomes. You are always part of the wider Aker. We help our
  colleagues and take pride in successfully achieving
  difficult tasks. We run towards problems and help to solve
  them. Communicate always, do so accurately and in a timely
  fashion.

  In return, we offer a competitive salary, 25 days holiday
  plus bank holidays, company paid medical insurance and life
  assurance, pension scheme, annual training allowance,
  wellbeing allowance, virtual GP, Employee Assistance plan
  and more.

  Equal Opportunities

  Aker Systems fosters a diverse environment that encourages
  openness in its communications and is committed to providing
  equal employment opportunity for all people regardless of
  race, religion, gender or sexual orientation, age, marital
  status, national origin, citizenship status, disability,
  veteran status or other personal characteristics. We embrace
  differences of opinion and diversity because they help
  challenge us and find new groundbreaking technical
  solutions.
