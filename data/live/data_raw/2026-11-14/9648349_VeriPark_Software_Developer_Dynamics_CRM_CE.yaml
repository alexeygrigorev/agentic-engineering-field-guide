description: |
  We enable financial institutions to become AI-first digital
  leaders.

  As a professional team of global scale, we work with best
  clients for great and exciting projects, in an environment
  where we learn amazing things every day. Each code, each
  voice, each contribution, each challenge, each success is
  celebrated here.

  We welcome candidates who share our values, have the skills
  and are passionate to enjoy our journey to build the digital
  future of finance, together.  About The Job:

  What you will be doing:

  - Gathering and analyzing client requirements to design and
    implement complex CRM solutions using Microsoft Dynamics
    365 and Power Platform.
  - Curating and brainstorming approaches to a requirement when
    needed.
  - Meticulously understanding the requirements with respect the
    solutions offered by CRM’s OOB components and those that
    need extensions like code.
  - Estimating for the efforts around multiple approaches and
    narrating & quantifying the pros & cons with respect to
    such implementations.
  - Developing and customizing various CRM components such as
    entities, forms, workflows, plugins, reports, dashboards
  - Implement integrations with external systems.
  - Be involved in development using CRM SDK, C#, ASP.NET, SQL
    Database, ADO.NET
  - Writing clean and efficient code using programming languages
    such as C# and JavaScript while adhering to coding
    standards and best practices.
  - Debugging and troubleshooting issues in the CRM system and
    providing timely resolution to ensure high system
    availability and performance.
  - Collaborating with project managers, business analysts,
    testing teams, and other stakeholders to ensure successful
    project delivery on time and within budget.
  - Calculating and raising such concerns in timely manner which
    might intervene the timely delivery of the deliverable.
  - Providing technical guidance and mentorship to junior
    developers and team members to enhance their skills and
    knowledge in CRM development.

  What we are looking for:

  - 5+ years of relevant working experience.
  - Bachelor’s Degree.
  - Understand fully what Microsoft’s Modules like Sales,
    Customer Service, Marketing have to offer out of the box
    before needing any extended customization.
  - Be able to timely communicate statuses and concerns down and
    up the responsibility hierarchy so as to ensure smoother
    delivery of the requirement.
  - Be able to build D365 CE entities, forms, workflows,
    dashboards and reports.
  - Be able to develop plug-ins using C# and to code UI logic in
    JavaScript.
  - Be able to build and release solutions.
  - Be able to write technical documentation in clear and
    understandable way
  - Banking experience is preferable.
  - Optionally develop Web resource, PowerApp apps and PowerBI
    reports.

  About VeriPark:

  VeriPark is a global technology powerhouse with more than
  two decades of experience in the financial services
  industry. Our mission is to enable financial institutions to
  become digital leaders by delivering world class customer
  journeys.

  With offices in 15 countries from Canada over Europe and the
  Middle East to Kuala Lumpur, our 1000+ colleagues are
  serving customers in more than 30 countries worldwide.

  As a global player, we offer more than just a workplace; we
  provide a transformative environment that transcends
  boundaries. Joining VeriPark means becoming part of a
  diverse family where talent is nurtured, diversity is
  celebrated, and our culture empowers each individual to
  reach their full potential.

  Be a part of our global family, where opportunities are as
  vast as our global footprint.

