description: |
  Locations: United States - (Dallas, Houston, Jersey City,
  New York City, Tampa)

  Salary: $48,000 - $66,000 USD

  Want to start your career as a Java Developer?

  Graduate training, ongoing support, opportunities at leading
  global employers – the Alumni graduate program gives you
  everything you need. (And don’t worry, there’s no training
  bond. No exit fees, no hidden catches).

  Here at mthree, we pair great graduates with brilliant
  global businesses. Our clients include tier one investment
  banks and other organizations across a range of industries,
  from insurance to healthcare to travel.

  As part of the mthree Alumni program, mthree has an exciting
  and exclusive partnership with Columbia Univ. School of
  Engineering. All mthree Alumni are eligible to receive two
  Executive Education certificates from Columbia Engineering
  as part of their Academy and industry placement experience
  at no cost. Further, all participating Alumni will have
  access to the Columbia Engineering network and ongoing
  training.

  What you’ll do:

  As a software developer with mthree, you’ll build complex
  applications in a global team environment.

  You’ll love seeing the impact you make when code you’ve
  written launches to the people who need it. If you stay on
  the lookout for new ways to get better results through
  software development, you’ll become an asset to your team.

  How the Alumni program works:

  - Apply via this job advert.
  - Complete our assessment process.
  - Get trained at mthree Academy in an online class for 4-8
    weeks with other graduates. Focusing on Java, or other
    languages depending on which coding languages our clients
    are looking for at the time.
  - Join a mthree client for 12-24 months while receiving
    support and salary increases every 12 months.
  - The vast majority then convert to permanent employees with
    the client at the end of the program.

  What you’ll learn at the mthree Academy:

  - How to design, develop, and test a full-stack application.
  - How to demonstrate professionalism, including communication
    skills and personal interactions.
  - How to explain industry concepts at a high level.
  - An understanding of monitoring, supporting, and
    troubleshooting, and how it ties into good development
    processes.

  What you'll need:

  - Bachelor's degree in computer science or a related major
  - A GPA of 2.7 or higher. We look for potential, not prestige,
    but it’s important that you enjoy pushing yourself to pick
    up new ideas.
  - Experience with OOP (object-oriented programming).
  - Solid knowledge of software engineering principles (data
    structures, OOP, design patterns, multithreading).
  - Skills in troubleshooting and debugging.
  - Knowledge of database concepts (SQL, stored procs, schema
    design).
  - An understanding of the formal SDLC (software development
    lifecycle).
  - An understanding of test-driven development.
  - The right to work without needing visa sponsorship.

  What you'll get:

  - In-depth, interactive training in small classes with
    graduates like you. Our training is created and delivered
    by industry experts who know your field inside out.
  - A generous graduate salary.
  - Pay rises every 12 months to reflect your progress.
  - A flexible benefits package.
  - Ongoing training and support.
  - Valuable industry experience. Ultimately, a foot in the door
    to build your career in an in-demand niche.

  How to apply:

  - Apply via the form below and tell us a bit about you.
  - Complete the online assessment (we’ll send you a link by
    email).
  - Complete the interviews with our friendly talent team over
    phone and video.
  - Lastly, you’ll interview with one or more of our clients.

  So you don’t miss out on your dream job, we encourage you to
  be open to relocating.

  At mthree, our values support courageous teammates, needle
  movers, and learning champions all while striving to support
  the health and well-being of all employees.  We take great
  pride in celebrating the diversity of each individual who
  contributes to making mthree the company it is today and
  will be in the future. We value diversity both within mthree
  and with our partner companies, and we're proud to provide
  an environment where all our colleagues can flourish. That
  means promoting a strong culture of equality but, most
  importantly, inclusion

  We are committed to fair, transparent pay, and we strive to
  provide competitive compensation in addition to a
  comprehensive benefits package.  The base pay rate for this
  position is $48,000- $66,000 USD.  This pay rate represents
  mthree’s good faith and reasonable estimate of the base pay
  for this role at the time of posting and based on the
  locations listed in the job advertisement. It is anticipated
  that qualified candidates selected for a placement will
  receive this pay rate as a starting salary once onsite with
  the mthree client, however, the ultimate salary offered for
  this role may be higher or lower and will be set based on a
  variety of non-discriminatory factors, including but not
  limited to, geographic location, skills, and competencies.

  Applicants must be currently authorized to work in the
  United States on a full-time basis. The Company will not
  sponsor applicants for work visas.
