description: |
  PENN Entertainment, Inc. is North America’s leading provider
  of integrated entertainment, sports content, and casino
  gaming experiences. From casinos and racetracks to online
  gaming, sports betting and entertainment content, we deliver
  the experiences people want, how and where they want them.

  We’re always on the lookout for those who are passionate
  about creating and delivering cutting-edge online gaming and
  sports media products. Whether it’s through Hollywood
  Casino, theScore Bet Sportsbook, or theScore media app,
  we’re excited to push the boundaries of what’s possible.
  These state-of-the-art platforms are powered by proprietary
  in-house technology, a key component of PENN’s omnichannel
  gaming and entertainment strategy.

  When you join PENN Entertainment’s digital team, you’ll not
  only work on these cutting-edge platforms through theScore
  and PENN Interactive, but you’ll also be part of a company
  that truly cares about your career growth. We’re committed
  to supporting you as you expand your skills and explore new
  opportunities.

  With locations throughout North America, you can build a
  future at PENN Entertainment wherever you are. If you want
  to challenge conventions in gaming, media and entertainment,
  we want to talk to you.

  About the Role & Team The Enablement team is responsible for
  building, maintaining, and supporting foundational services
  and applications that power our platform. We focus on
  identifying friction points across our systems and SDLC, and
  delivering solutions that enable teams to operate more
  efficiently and autonomously. Our engineers lead cross-team
  technical efforts for our customer-facing applications,
  driving solutions that span multiple systems and shape the
  architecture of our broader ecosystem. We take pride in
  creating scalable, reliable capabilities that accelerate
  product delivery and strengthen the platform as a whole.

  About the Work

  As a staff engineer on the Enablement team, you will:

  - Lead the design, architecture, and delivery of new platform
    capabilities in a collaborative agile environment
  - Build, support, and maintain key services that drive our
    Federated GraphQL API, event-driven architecture, and
    regulatory compliance tooling
  - Drive integrations with internal services by partnering
    closely with engineering teams and stakeholders across the
    organization
  - Support teams developing features in our customer-facing
    applications (theScore, theScore Bet, Hollywood Casino) by
    helping define scope, contributing to technical specs, and
    identifying edge cases and performance improvements
    through code and design review
  - Develop, scale, and optimize gRPC endpoints, GraphQL APIs,
    and SQL queries
  - Own observability practices across our systems, including
    monitoring, alerting, and incident response (DataDog,
    Bugsnag)
  - Proactively identify bottlenecks and areas of systemic risk,
    and lead efforts to address them before they impact
    reliability or scale
  - Mentor engineers across the organization and contribute to a
    culture of technical excellence

  About You

  - 7+ years in a software engineering role
  - A first-principles thinker who digs into root causes rather
    than surface symptoms
  - A track record of owning complex systems end-to-end
  - Comfortable working across a polyglot codebase that includes
    Elixir, Java, Rust, and TypeScript
  - Driven to design, build, and optimize distributed systems
    that hold up under real-world load
  - Knows the difference between an API that exposes a data
    model and one that expresses a domain, and has strong
    opinions about which to build
  - A solid foundation in computer science, with deep
    competencies in data structures, distributed systems,
    algorithms, and software design
  - Holds teams to a high bar for code quality and architecture,
    and can articulate why it matters
  - Strong experience with relational databases, particularly
    PostgreSQL
  - Familiarity with caching strategies and the tradeoffs
    involved in applying them at scale
  - Experience with testing frameworks such as ExUnit, RSpec,
    Jest, pytest, or equivalent
  - Experience with high-throughput or real-time domains such as
    sports betting, gaming, or financial services
  - Experience with Kubernetes
  - Experience with AI

  What We Offer

  - Competitive compensation package
  - Fun, relaxed work environment
  - Education and conference reimbursements.
  - Opportunities for career progression and mentoring others

  #LI-REMOTE

  Salary Range

  $170,000—$220,000 USD

  Penn Interactive is proud to be an equal opportunity
  workplace. We will consider all qualified applicants for
  employment without regard to race, color, religion, age,
  sex, sexual orientation, gender identity, national origin,
  disability, veteran status, genetic information, or any
  other basis protected by applicable law.Base pay is one part
  of the Total Rewards that Penn Interactive provides to
  compensate and recognize employees for their work. Most
  sales positions are eligible for a Commission under the
  terms of an applicable plan, while most non-sales positions
  are eligible for a Bonus. Additionally, Penn Interactive
  provides best-in-class benefits to eligible employees. We
  believe that benefits should connect you to the support you
  need when it matters most, and should help you care for
  those who matter most. That’s why we provide an array of
  options, expert guidance and always-on tools, that are
  personalized to meet the needs of your reality – to help
  support you physically, financially and emotionally through
  the big milestones and in your everyday life.
