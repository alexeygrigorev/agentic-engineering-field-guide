description: |
  GenLogs is a transportation-technology company building the
  next generation of truck intelligence. Through a nationwide
  network of sensors and proprietary data, We deliver real-
  time, high-fidelity insights into freight movement for
  commercial supply-chain customers and public-sector
  agencies. Our mission is to strengthen America’s logistics
  backbone, combat freight fraud and cargo theft, and provide
  near-instantaneous visibility into commercial motor vehicle
  activity across major freight corridors. By operating at the
  intersection of edge sensing, computer vision, AI-driven
  analytics, and large-scale field deployment, GenLogs is
  transforming how transportation data is captured, secured,
  and commercialized.

  ABOUT THE ENGINEERING TEAM

  The Engineering team at GenLogs builds and sustains the end-
  to-end systems that power the country’s most advanced
  commercial-vehicle sensing and intelligence network. Our
  engineers develop everything from roadside hardware and
  embedded software to computer vision pipelines, distributed
  cloud infrastructure, and real-time data services. We are
  responsible for the reliability, accuracy, and security of
  the our sensor network and the data products it fuels.
  Operating across edge, cloud, and field environments, the
  team partners closely with Deployment, Data Science, and
  Product to turn complex, real-world requirements into
  scalable systems that function under demanding conditions
  and national-level workloads. We value technical rigor,
  speed of execution, and a commitment to building durable
  infrastructure that delivers measurable, mission-critical
  impact.

  ABOUT THE JOB

  As a Senior Software Engineer behind Genlogs’s platform, you
  will have an opportunity to create systems that will make
  possible the future of freight intelligence by leveraging
  AI, distributed sensors and multiple datasets to
  ubiquitously track all 4 million commercial trucks in the
  United States and beyond. By helping build unbreakable
  supply chains, GenLogs is making America safer and stronger

  WHAT YOU’LL DO

  Engineers at GenLogs have a unique opportunity to shape a
  platform that is transforming freight intelligence. As a
  Senior Software Engineer, you will work across the stack,
  influence architectural decisions, mentor teammates, and
  help deliver high-quality features on a continuous release
  cadence. You’ll collaborate closely with product, data, and
  engineering teams to build systems that are scalable,
  reliable, and impactful.

  - Build core product experiences including ReactJS portals,
    Flask-based APIs, and batch interfaces used across all
    GenLogs applications.
  - Integrate diverse data sources, both open-source and
    proprietary, into our platform.
  - Develop tools, automation, and test infrastructure to
    improve accuracy, reliability, and platform performance.
  - Contribute to production and QA infrastructure, helping
    ensure system stability and scalability.
  - Shape software architecture, providing input on design
    decisions for complex systems.
  - Collaborate cross-functionally with product, data
    engineering, and data science teams to deliver high-
    quality solutions.
  - Participate in the full software development lifecycle, from
    requirements and design to deployment and ongoing
    maintenance.
  - Write clean, efficient, maintainable code aligned with best
    practices.
  - Conduct thoughtful code reviews, ensuring quality,
    consistency, and adherence to engineering standards.
  - Diagnose and resolve complex technical challenges, including
    production issues, with urgency and ownership.
  - Stay current with modern engineering tools and technologies
    and bring forward recommendations that improve our stack.
  - Provide mentorship and technical leadership to junior
    engineers, supporting their growth through coaching and
    feedback.

  REQUIRED QUALIFICATIONS

  - Full-stack engineer with at least 8 years of experience
    preferably on high transactional and distributed systems
  - Proficiency in python and javascript technologies such as
    Flask, React JS, Javascript, CSS and HTML
  - Knowledge of javascript frameworks a plus
  - Expert-level SQL fluency, with the ability to design
    normalized and denormalized schemas, optimize slow-running
    queries, analyze execution plans, and work with large-
    scale datasets efficiently.
  - Experience designing and implementing API’s
  - Solid understanding of database design and object oriented
    programming concepts
  - Experience working on robust, multi-tiered and scalable
    architectures
  - Excellent written and verbal communication skills
  - High effectiveness and communication working in a remote and
    distributed team
  - English proficiency is required.

  IDEAL CANDIDATE

  - You prioritize understanding and exceeding customer needs in
    every project and interaction.
  - You focus on delivering meaningful progress while embracing
    iteration and continuous improvement.
  - You bring deep technical expertise, delivering high-quality,
    reliable, and scalable solutions.
  - You anticipate needs, take initiative, and stay ahead of the
    curve with timely actions and decisions.
  - You excel in articulating complex ideas clearly, concisely,
    and effectively through written communication.
  - You have a thirst for knowledge, a passion for problem-
    solving, and a drive to explore and learn new things.
  - You value transparency, actively seek feedback, and
    collaborate to build trust and alignment within the team.
  - You thrive in a remote environment, leveraging tools and
    practices to stay connected and deliver results.
  - You balance hard work with strategic thinking, focusing on
    impact and efficiency.
