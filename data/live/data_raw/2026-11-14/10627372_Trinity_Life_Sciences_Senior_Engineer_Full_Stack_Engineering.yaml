description: |
  Senior Full Stack Software Engineer

  Location: Waltham, MA; New York, NY; Princeton, NJ

  Employment Type: Full-Time

  Work Mode: Hybrid

  Position Summary

  We're looking for an exceptional engineer who loves building
  cloud-native applications with AI at their core. If you
  thrive where modern infrastructure meets intelligent
  software, this is your role.

  What You'll Do

  - Architect and ship scalable cloud apps on AWS, Azure, or GCP
    (Lambda, ECS, Kubernetes) with event-driven microservices
    and serverless architectures
  - Build AI/ML integrations using modern frameworks while
    driving best practices for prompt engineering, RAG
    patterns, and agent orchestration
  - Lead technical architecture decisions, code reviews, and
    define development standards and technical roadmaps
  - Own the full stack—from pixel-perfect, accessible UI
    implementation to robust Django REST and GraphQL APIs
  - Build real-time features using WebRTC, WebSockets, and
    Server-Sent Events
  - Create and enforce engineering excellence through coding
    standards, comprehensive testing strategies (unit,
    integration, agent-based, E2E), documentation, and
    deployment patterns
  - Champion DevOps practices, security compliance, and CI/CD
    pipelines while establishing observability with APM tools
  - Lead and mentor teams through agile delivery, establishing
    engineering culture through technical leadership and
    knowledge sharing
  - Collaborate with data engineering teams on pipeline
    integration and consumption patterns
  - Lead production incident response, post-mortems, and
    evaluate emerging AI/ML tools and frameworks
  - Bridge product, design, and engineering to deliver fit-for-
    purpose client solutions

  What You'll Bring

  - 8+ years building production-grade solutions with proven
    tech leadership
  - Expert in React web apps, React native with state management
    (Redux, Zustand), TypeScript, modern JavaScript, and
    responsive component libraries
  - Expert in building AI applications with LangGraph,
    LangChain, LlamaIndex, AWS Bedrock, OpenAI APIs, including
    token optimization, cost management, and streaming
    responses
  - Expert in  Python and Django with REST and GraphQL API
    design, plus async patterns (asyncio, FastAPI) for AI
    workloads
  - Experience with multi-modal AI (text, images, documents),
    fine-tuning, model adaptation, and understanding of data
    quality and governance in AI contexts
  - Hands-on Docker and containerization with CI/CD pipeline
    creation (Git, Jenkins, Artifactory)
  - Deep cloud platform development experience (AWS, Azure, GCP)
    with serverless, containers, and understanding of
    security, IAM, and authentication patterns (OAuth, JWT,
    SSO)
  - Experience with RDBMS, NoSQL, and semantic databases,
    including schema design and query optimization
  - Proficiency with testing frameworks (Jest, Pytest, Selenium)
    and build tools (Webpack, Vite) with Git workflows and
    trunk-based development
  - Experience with monitoring and logging tools (CloudWatch,
    Sentry, Langfuse)
  - Clear communicator who takes initiative, follows through,
    and thrives as a collaborative problem-solver in fast-
    paced environments
  - Life sciences background
  - Cloud or AI developer certifications (AWS/Azure/GCP)
  - Shipped AI-powered features to production
  - LLM and AI agent development experience
  - Open-source contributions
  - PWA development and edge computing optimization

  About Trinity

  Trinity powers the future of life sciences commercialization
  through the fusion of human and artificial intelligence. By
  blending deep therapeutic expertise and trusted human
  ingenuity with a purpose-built technology platform, Trinity
  accelerates clarity and confidence at every step of the
  commercialization journey—from pre-launch to scale to loss
  of exclusivity. For more than 30 years, the world’s leading
  pharmaceutical, biotech, and medtech companies have relied
  on Trinity’s foresight, execution, and partnership to
  deliver confident product launches, decisive market
  advantage, and measurable patient impact. During that time,
  Trinity expanded from its first office in Waltham, MA to
  1,300 professionals across 14 offices and five continents,
  setting new industry standards in quality, responsiveness,
  and client partnership. For more information, visit Trinity
  at www.trinitylifesciences.com.

  Trinity’s salary bands account for a wide range of factors
  that are considered in making compensation decisions
  including but not limited to skill sets and market demand
  for skills; level of experience and training; specific
  qualifications, performance, time in role/company,
  geographic location, and other business and organizational
  needs. The base salary range for this role is $128,000 -
  $192,000 per year. Compensation is determined based on
  factors such as the candidate’s skills, experience, job-
  related education and training, location, and internal
  equity. In addition to your base salary, you will also be
  eligible for an annual discretionary performance bonus.

