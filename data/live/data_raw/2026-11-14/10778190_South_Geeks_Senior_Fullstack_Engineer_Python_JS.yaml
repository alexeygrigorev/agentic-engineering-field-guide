  About Us

  South Geeks connects elite, AI-fluent engineers from Latin
  America with future-shaping companies in Health and Wealth.
  We're hiring an AI Solutions & Enablement Engineer to join
  one of our clients, a biotechnology company advancing
  immune-driven medicine through precision diagnostics and
  research.

  About the Client

  Our client builds a B2B digital wealth management platform
  designed to improve financial literacy, expand financial
  inclusion, and make financial services more human-centered.
  Their solution helps organizations deliver interactive,
  data-driven experiences that empower better financial
  decision-making.

  About the Role

  We're looking for a Senior Full Stack Engineer with strong
  Python experience and front-end skills in Angular or React
  to join Marstone's engineering team and help build and
  evolve their wealth management platform.

  This is a hands-on senior role with real ownership. You'll
  participate in architectural planning sessions in an Agile-
  based environment and collaborate closely with the
  Engineering Manager, CTO, and the rest of the team to
  deliver reliable, scalable solutions.

  Key Responsibilities

  - Design, develop, and maintain full-stack features using
    Python (Django/Flask) on the backend and Angular or React
    on the frontend.
  - Design and maintain Service Oriented Architectures
    (REST/JSON or SOAP web services).
  - Work with relational databases (PostgreSQL, MySQL, SQL
    Server, Oracle) and ORM tools, writing efficient queries
    and ensuring data integrity.
  - Contribute to cloud architecture and design in AWS or Azure.
  - Use Docker, ECS, Kubernetes or similar container products
    for deployment.
  - Collaborate in an Agile/Scrum environment (Jira,
    Confluence), participating in code reviews and demos.

  What You Need to Succeed in This Role

  - Senior-level Python experience (4+ years) with Django and/or
    Flask.
  - Front-end development experience with Angular or React.
  - Experience designing and consuming REST/SOAP APIs.
  - Strong knowledge of relational databases and SQL, with ORM
    experience.
  - Experience with cloud architecture (AWS or Azure).
  - Familiarity with Docker, ECS, Kubernetes or similar
    container technologies.
  - Ability to work independently, communicate clearly, and
    collaborate across teams.

  Nice to have

  - Experience in fintech, blockchain, or wealth management
    platforms.
  - Familiarity with Agile/Scrum ceremonies and tools (Jira,
    Confluence).
  - Experience working directly with US-based clients and
    distributed teams.

  Our Team

  We strive to create an inspiring and growth-oriented
  environment where everyone feels valued, heard, and
  empowered. We promote both personal and professional
  development, with individualized support for your needs and
  goals. We aim to build a space where everyone can thrive.

