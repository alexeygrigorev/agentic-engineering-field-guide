description: |
  At R1, we’re transforming how healthcare works by combining
  nearly two decades of revenue cycle expertise with advanced
  technology, including analytics, AI, intelligent automation
  and workflow orchestration. We pair that technology with the
  irreplaceable expertise of our people to help hospitals,
  health systems and medical groups improve financial
  performance, simplify administrative complexity and create
  better experiences for patients and providers.

  All Together Better defines our culture and the way we work.
  We’re a diverse, global team united by a shared mission to
  make healthcare work better for all. Across technology,
  operations and support functions, our people bring deep
  expertise, empathy and ingenuity to the work we do. Here,
  collaboration fuels progress, adaptability sparks innovation
  and every voice can help shape what’s next for R1 and the
  future of healthcare.

  About R37

  R37 is R1’s AI innovation lab, building technology to
  transform healthcare.

  Our flagship platform, Phare OS, uses AI and automation to
  improve critical pre-bill workflows, including
  authorization, utilization management, documentation and
  coding. By identifying and resolving issues before claims
  are submitted, Phare OS helps prevent denials, improve
  reimbursement and move revenue cycle work upstream.

  What makes R37 different is the opportunity to build
  advanced AI at real-world scale. R1 works across 95 of the
  top 100 U.S. health systems, giving R37 access to the data,
  workflows and reach needed to make an immediate impact:

  - 180M+ claims
  - 550M+ patient encounters
  - 1.2B+ workflow actions and outcomes annually

  This is startup-level ownership with enterprise-level
  impact. You’ll build technology that moves from idea to real
  healthcare environments, solving complex problems at scale
  and changing how healthcare works.

  As our Software Engineer, Data Platform (HL7/FHIR), you will
  be a key member of the engineering team and apply advanced
  technical knowledge, broad knowledge of software engineering
  best practices, problem-solving, and creativity to build and
  maintain software products that achieve technical, business,
  and customer experience goals. To thrive in this role, you
  must have the ability and willingness to mentor and develop
  junior software engineers, and act as a thought leader and
  trusted subject-matter expert in a variety of technical
  domains.

  Here’s what you will experience working as a Staff Software
  Engineer, Data Platform (HL7/FHIR):

  - Heavily participate in roadmap definition, working closely
    with senior product and engineering leaders.
  - Evaluate and help shape strategic technology direction and
    choices.
  - Provide thoughtful recommendations in sessions with scrum
    team members to structure solution source code and
    implementation approaches —emphasizing the need to
    optimize code that follows engineering best practices, and
    maximizes maintainability, testability, and performance.
  - Work with product management and business stakeholders to
    understand software requirements and help estimate epics,
    features, and stories.
  - Script and maintain automated build steps, continuous
    integration systems, and staging environments.
  - Willingly and enthusiastically mentor junior members of the
    development team.

  Required Skills:

  - Bachelor’s degree in Computer Science or a related technical
    field.
  - 10+ years of software engineering or data engineering
    experience, including 5+ years in a technical leadership
    or thought-leadership capacity.
  - Advanced experience with Apache Spark, Python, Scala,
    Databricks, and big-data architecture.
  - Hands-on experience with HL7, FHIR, Epic, clinical data, and
    healthcare technology environments.
  - Extensive experience with at least one major cloud platform,
    including Microsoft Azure, Google Cloud Platform, or
    Amazon Web Services.
  - Strong knowledge of web services and integration
    technologies, including XML, XSD, SOAP, JSON, and REST
    APIs.
  - Experience with modern software engineering practices,
    including version control, automated testing, CI/CD, Agile
    development, and automated build and deployment processes.

  For this US-based position, the base pay range is
  $212,100.00 - $409,050.00 per year . Individual pay is
  determined by role, level, location, job-related skills,
  experience, and relevant education or training.This job is
  eligible to participate in our annual bonus plan at a target
  of 25.00%

  The healthcare system is always evolving — and it’s up to us
  to use our shared expertise to find new solutions that can
  keep up. On our growing team you’ll find the opportunity to
  constantly learn, collaborate across groups and explore new
