description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Core Commerce Platform organisation
  responsible for delivering the omnichannel commerce
  capabilities that power the purchase journey, inventory
  availability, delivery promise, order processing &
  fulfilment and post-purchase experiences across channels.
  The organisation plays a critical role in ensuring products
  are available to buy, orders can be fulfilled reliably, and
  commitments made to consumers are delivered consistently.
  Through a portfolio of commerce platform capabilities, the
  organisation enables seamless omnichannel experiences while
  supporting efficient, scalable, and resilient commerce
  operations across the global digital ecosystem.

  As a Senior Quality Engineer, you will own quality strategy,
  test automation and test execution for omni-channel commerce
  capabilities. You will work closely with Software Engineers,
  Tech Leads, Product Owners and Data Engineering teams to
  embed quality throughout the development lifecycle. Your
  focus will be building scalable automation, validating AI
  powered Omni-Channel Experience & Fulfilment Quality,
  improving engineering quality and enabling fast, reliable
  releases.

  What you will do:

  - Define and drive quality strategy & standards for Order
    Management and Omnichannel Fulfillment capabilities,
    ensuring reliability, scalability, and business readiness
    across the order lifecycle.
  - Design, build and maintain automated test frameworks
    covering APIs, integrations, contract, event-driven
    workflows, and end-to-end commerce scenarios.
  - Ensure inventory accuracy, order orchestration, fulfillment
    execution, and SLA adherence through robust automated and
    exploratory testing practices.
  - Embed quality throughout the software development lifecycle
    by partnering closely with Software Engineers, Tech Leads,
    Product Owners and Data Engineering teams.
  - Develop and maintain test data management capabilities
    supporting complex order, inventory, sourcing,
    fulfillment, and returns scenarios.
  - Integrate quality engineering practices into CI/CD pipelines
    with automated quality gates, release validation,
    regression testing, and deployment readiness assessments.
  - Define quality metrics, test coverage goals and continuous
    improvement initiatives across the team.
  - Coach engineers on test automation, quality practices and
    continuous improvement.

  YOUR TALENT

  - Bachelor's degree in computer science, Information
    Technology, Engineering, or a related field.
  - 7+ years of Quality Engineering, Software Testing, and Test
    Automation experience, with a strong track record of
    delivering quality for Order Management, Inventory,
    Fulfillment, and Omnichannel Commerce platforms.
  - Strong proficiency with automation technologies such as
    Selenium, Playwright, Cypress, Postman, or equivalent
    testing frameworks.
  - Expertise in order lifecycle validation, covering order
    capture, sourcing, fulfillment, shipment, returns,
    exchanges, and post-purchase experiences.
  - Strong expertise in API Testing, Contract Testing, and
    Integration Testing across distributed microservices
    architectures.
  - Hands-on experience integrating automated testing into CI/CD
    pipelines, implementing quality gates, automated release
    validation, and deployment verification processes.
  - Strong understanding of modern Quality Engineering practices
    including shift-left testing, continuous testing, quality
    engineering metrics, and release readiness assessment.
  - Experience in cross-browser testing and tooling
    (BrowserStack or equivalent) will be an advantage.
  - Experience with test-data management.
  - Experience leveraging AI-assisted test generation,
    intelligent test maintenance, intelligent regression
    testing, and LLM-assisted Quality Engineering practices to
    improve coverage and efficiency.
  - Strong collaboration and stakeholder management skills, with
    experience partnering closely with Product Owners,
    Architects, Engineers, Project Managers to influence
    engineering quality across multiple teams
  - Experience mentoring Quality Engineers, driving automation
    adoption, and establishing engineering excellence and
    continuous improvement practices across teams.

