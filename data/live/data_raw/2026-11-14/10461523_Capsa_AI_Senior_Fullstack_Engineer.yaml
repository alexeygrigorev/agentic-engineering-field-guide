description: |
  The AI Operating System for Private Capital.

  Capsa

  Private capital funds have to find potential investments,
  research and analyse them thoroughly, monitor them over
  time, drive improvements, and decide when to buy and sell.
  They've got to see through the marketing. They've got to
  outbid the competition. And they've got to learn from every
  deal they do. Historically, these processes have run on
  people, we are building the AI Operating System that will
  run them in the future.

  We're focused, ambitious, and obsessed with building a
  category-defining company. In the last 12 months we've grown
  ARR 15x, achieved product–market fit with leading multi-
  billion-dollar PE firms, and expanded across the US, UK, and
  Europe. Now we're doubling down: we've raised a large Series
  A from top-tier VC investors to scale the team. We're hiring
  hyper-talented people who want to work at the forefront of
  AI and revolutionise an industry.

  At a glance

  - Role: Senior Fullstack Engineer
  - Location: London, UK (Hybrid, in-person 4 days per week)
  - Team: Engineering
  - Compensation: Top of market. Competitive base + OTE

  The role

  Own product features and take them from ideation to
  production and measure the impact. Work across all layers of
  the application to deliver value for our customers. Uphold
  the quality of our codebase and find ways to move faster.

  The opportunity

  - Ownership: You'll own whole surfaces of the product end to
    end. You'll make the architecture calls, ship them, and
    operate them.
  - Growth: You'll work across the entire stack, alongside a
    team of startup veterans, and take on real responsibility.
  - Upside: You'll receive meaningful equity in a company that
    grew 15x last year.
  - Impact: You'll leave an indelible mark on an industry
    responsible for ~7% of US GDP.

  Recent projects include

  - Agent Harness: Our own agent harness built on a custom,
    streaming-first graph execution framework.
  - Code Execution Framework: Our own code execution framework
    that can be interrupted and resumed mid-execution for
    programmatic tool calling.
  - Document Ingestion, Indexing, and Search: A VLM-based OCR
    pipeline, a self-hosted search cluster, and domain-aware
    search strategies.
  - Citations: An end-to-end approach to citation, enabling
    users to quickly review supporting documentation for any
    AI generated statement.
  - Document Authoring: Agent tooling and a document editor
    supporting advanced collaborative authoring across Word,
    Excel, PowerPoint, and email.

  Your track record

  - You’ve worked in a high performance environment. Four or
    more years building production software at a venture-
    backed startup or top tech firm, owning features end-to-
    end.
  - You've shipped things that mattered. Entire products or
    features taken from ideation to production, with impact
    you can speak to.
  - Expertise with our stack. Python, TypeScript, React,
    FastAPI, Postgres, OpenSearch, RabbitMQ, Kafka, LLMs,
    Agents.
  - Domain curiosity. You go deep on the problem. You care about
    what the product does for the person using it, and that
    shows in how you build.
  - Comfortable at pace. Fast-moving environments are where you
    do your best work.

  How you operate

  - Accountable: You take responsibility for what you build and
    make sure it has a positive impact on our customers and
    the team.
  - Thoughtful: You think deeply about the problems you're
    solving and the code you're submitting. You use AI to
    enhance your thinking, not to outsource it.
  - Pragmatic: You accept that time is limited and information
    is incomplete. You make progress regardless, and adjust as
    we learn more.

  If this opportunity excites you

  We'd like to meet you. Initial conversations are direct and
  substantive, going deep on the work, the team, and what
  you'd own in the first six months.

