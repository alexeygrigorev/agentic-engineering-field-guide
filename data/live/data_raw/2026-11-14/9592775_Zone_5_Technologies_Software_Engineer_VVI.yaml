description: |
  At Zone 5 Technologies, we're redefining what's possible in
  precision weapons and unmanned aircraft systems (UAS). Our
  team of engineers and innovators are developing cutting-edge
  autonomous solutions to deliver affordable and scalable
  precision weapons, interceptors, and UAS.

  We're building the next generation of munitions and unmanned
  systems for the United States and its allies. If you're
  driven by hard problems, energized by rapid innovation, and
  ready to make an impact on defense technology, you belong
  here.

  From air-launched effects and open interceptor systems like
  White Spike to advanced autonomy and mission-critical
  software, our work directly shapes multi-domain operations
  for demanding government customers. We're scaling rapidly
  (recently acquired by KONGSBERG and growing fast), and we're
  seeking elite software engineering talent to architect and
  deliver the high-reliability, safety-critical software that
  powers these groundbreaking systems. If you're a battle-
  tested senior engineer who thrives on owning complex
  domains, mentoring high-performing teams, driving technical
  excellence in regulated aerospace/defense environments, and
  solving problems where failure is not an option — this is
  your opportunity to leave a lasting mark on next-generation
  flight and strike capabilities.

  We're looking for a principal-level C#/.NET software
  engineer (with strong embedded or real-time systems depth)
  ready to lead the design and evolution of complex, high-
  assurance software for autonomous UAS platforms in the
  aerospace and defense sector.

  Key Responsibilities:

  - Lead the architecture, design, implementation, and
    verification of embedded and application-level software
    for high-reliability, safety-critical UAS systems — from
    flight controls and mission autonomy to ground station
    integration and real-time data processing.
  - Own end-to-end technical ownership of major software
    components or subsystems, driving decisions on technology
    stack, performance optimization, fault tolerance, and
    certification pathways (DO-178C familiarity a strong
    plus).
  - Collaborate deeply with systems, hardware, GNC, flight test,
    and cybersecurity teams to define requirements, resolve
    cross-domain challenges, and integrate software into full-
    system flight demonstrations.
  - Champion modern development excellence: architect and evolve
    CI/CD pipelines (GitHub Actions + AWS), automated testing
    frameworks, build systems, and deployment strategies for
    cloud-edge hybrid environments.
  - Mentor and guide mid-level and senior engineers, conduct in-
    depth code/design reviews, establish best practices, and
    foster a culture of rigorous, high-quality engineering in
    a fast-paced environment.
  - Contribute to strategic technical roadmaps, evaluate
    emerging technologies (e.g., real-time middleware, model-
    based design, AI/ML integration for autonomy), and
    influence product direction for long-range strike,
    counter-UAS, and multi-domain systems.
  - Support qualification, certification, and airworthiness
    processes through rigorous verification, validation, and
    documentation in compliance with defense and aerospace
    standards.

  Qualifications:

  - 8–15+ years of professional software engineering experience,
    with significant time spent on complex, high-reliability
    or safety-critical systems (aerospace, defense,
    automotive, medical devices, or similar strongly
    preferred).

  - Deep expertise in C# (preferred) and strong proficiency in
    additional languages such as C/C++, Python, or
    Matlab/Simulink for real-time/embedded/model-based
    workflows.

  - Proven track record designing and delivering real-time
    embedded software, flight-critical applications, autonomy
    stacks, or mission systems for UAS, drones, robotics, or
    related platforms.

  - Advanced hands-on mastery of Git/GitHub workflows at scale,
    Visual Studio, and scripting/automation (Bash, PowerShell,
    Python) for build/deploy/test pipelines.

  - Strong experience building and optimizing CI/CD systems
    (GitHub Actions required; Jenkins, GitLab CI, or similar a
    plus) and deploying/managing software in AWS or hybrid
    cloud environments.

  - Demonstrated ability to lead technical initiatives,
    influence architecture across teams, and deliver under
    aggressive schedules in regulated industries.

  - Excellent problem-solving, communication, and collaboration
    skills — able to distill complex technical concepts for
    cross-functional stakeholders and drive consensus on tough
    trade-offs.

  - U.S. person status required (ability to obtain and maintain
    security clearance preferred; existing clearance a
    significant advantage).

  Compensation:

  Level V - $162,000 - 192,000

  Level VI - $192,000 - 223,000

  To ensure you've read this description, please start your
  cover letter or the 'summary' section of your application
  with the phrase: [Favorite Tool] Specialist found.
  Applications without this phrase will not be reviewed.

  Pay range for this role

  $162,000—$223,000 USD

  What's in it for you:

  Benefits:

  - Competitive total compensation package
  - Comprehensive benefit package options include medical,
    dental, vision, life, and more.
  - 401k with company-match
  - 3 weeks of paid time off each year
  - 40 hours of sick time
  - 12 annual company holidays

  Why Join Zone 5 Technologies?

  - Innovative Environment: Work on cutting-edge technology that
    is shaping the future of defense and aerospace.
  - Collaborative Culture: Join a team of passionate
    professionals dedicated to pushing the boundaries of
    what’s possible.
  - Career Growth: Opportunities for professional development
    and career advancement.

  If you are passionate about unmanned aircraft technology and
  want to be a part of a dynamic and growing company, we would
  love to hear from you. Apply today and join the Zone 5
  Technologies team!

  In compliance with federal law, all persons hired will be
  required to verify identity and eligibility to work in the
  United States and to complete the required employment
  eligibility verification form upon hire.

  Zone 5 Technologies is a federal contractor and participates
