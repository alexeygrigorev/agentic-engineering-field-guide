description: |
  The Opportunity

  We’re looking for a passionate and skilled Software Engineer
  to join our fast growing engineering teams to revolutionize
  healthcare billing products and systems that directly
  address the needs of our customers. You will contribute to
  the full software development lifecycle, ensure high
  scalable, reliable and performance of our products and
  customer experience. If you thrive in a fast-paced,
  collaborative environment, are driven by customer outcomes,
  and are committed to crafting robust and scalable solutions,
  we would like you to join us!

  What you’ll be doing

  - Write clean, well-documented, testable and maintainable
    code.
  - Design, develop, and maintain complex features and develop
    ownership over large swaths of our products and systems.
  - Collaborate closely with product managers, and other
    engineers to understand customers’ needs and develop
    creative ways to address them.
  - Contribute to architecture and design of our systems with
    scalability and reliability as core principles.
  - Play a part to shape our engineering culture and help make
    this the best place we’ve ever worked.

  Who you are

  - You have Bachelors of Science or Bachelors of Art in
    Computer Science, Computer Engineering, Math or other
    similar degree.
  - You have 2+ years of experience in a Software Engineering
    position.
  - Experience with the technologies we currently use is a plus,
    but by no means required: Python, PostgreSQL, Docker,
    Kubernetes, React, Typescript, Google Cloud Platform,
    Auth0, Terraform.
  - You enjoy building high-quality software, but you also
    anchor on outcomes and have good intuition around which
    corners are worth cutting and which aren’t.
  - You enjoy owning features end-to-end and are comfortable
    learning new tools or moving across the stack to do so.
  - You have a customer-first and learner’s mindset, and value
    teaching others.
  - You’re a clear and concise communicator; you enjoy the
    challenge of explaining complicated ideas in simple terms,
    both in-person and in writing.

  Pay Transparency

  The estimated starting annual salary range for this position
  is $140,000 to $220,000 USD. The listed range is a guideline
  from Pave data, and the actual base salary may be modified
  based on factors including job-related skills,
  experience/qualifications, interview performance, market
  data, etc. Total compensation for this position may also
  include equity, sales incentives (for sales roles), and
  employee benefits. Given Candid Health’s funding and size,
  we heavily value the potential upside from equity in our
  compensation package. Further note that Candid Health has
  minimal hierarchy and titles, but has broad ranges of
  experience represented within roles.
