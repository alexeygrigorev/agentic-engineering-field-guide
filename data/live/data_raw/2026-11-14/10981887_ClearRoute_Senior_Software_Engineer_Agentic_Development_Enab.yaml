title: "Senior Software Engineer: Agentic Development Enablement"
company: ClearRoute
location: London, GBR
work_type: FULL_TIME
company_size: 97 Employees
description: |
  About Us:

  ClearRoute is an engineering consultancy bridging Quality
  Engineering, Cloud Platforms and Developer Experience. We
  help enterprises reliably bring high-impact digital products
  to market faster, cheaper, and safer, working with
  technology leaders facing complex business challenges.

  We take as much pride in our people, culture and work-life
  balance as we do in making better software. We’re not just
  making better software. We’re making the making of software
  better. Collaborative, entrepreneurial and dedicated to
  problem solving, we bring the step change our customer need
  to sustain innovation. Our values challenge us to do the
  best we can for ClearRoute, our customers and most
  importantly our team. This is an opportunity for you to
  build the organisation from the ground up, use your voice to
  drive change and help transform organisations and problem
  domains.

  Role: ClearRoute are engaged to lead a strategic platform
  engineering initiative aimed at fundamentally modernising
  the path to production. The project centres on building an
  AI-enabled delivery platform on AWS that reduces friction,
  enforces consistency, and embeds governance directly into
  the engineering lifecycle.

  We are looking for hands-on software engineer(s) who can
  help design and implement the controls, tooling, and
  engineering practices needed to support safe AI-assisted
  development in an enterprise environment. The role sits
  across several domains. It requires someone who is credible
  as a developer first, with enough breadth across cloud,
  security, operating systems, desktop engineering, CI/CD, and
  developer tooling to work on a cross-cutting enablement
  problem.  The focus is on enabling engineers to use agentic
  tooling safely and effectively through the right mix of
  research, prototyping, implementation, telemetry, and
  guardrails. Key Responsibilities:

  • Investigate safe patterns for enterprise use of agentic
  development tools such as Claude Code and GitHub Copilot  •
  Design and implement practical guardrails, controls, and
  engineering patterns for AI-assisted development •
  Contribute to endpoint and platform observability,
  telemetry, and policy enforcement • Help define how controls
  should work consistently across local development
  environments and CI/CD pipelines • Explore changes to the
  development environment, including more containerised or
  backend offloaded approaches • Run research, proof-of-
  concept work, and technical experimentation in an emerging
  and fast moving area • Work across engineering, platform,
  security, and adjacent enterprise teams to turn concepts
  into operating solutions • Help shape scalable practices for
  governance, rollout, and developer adoption

  Required Experience:

  • Strong hands-on background as a software engineer  • Broad
  technical understanding across several of the following:
  developer tooling, cloud platforms, operating systems,
  desktop environments, security controls, observability,
  telemetry, and CI/CD • Experience working on developer
  workflows and engineering ways of working, not only end-user
  application delivery • Experience with enterprise adoption
  of AI-assisted development tools • Ability to work in
  ambiguous problem spaces and turn research or
  experimentation into practical implementation • Strong
  communication skills and the ability to work across
  technical disciplines and stakeholder groups • Curiosity,
  sound engineering judgement, and comfort operating across
  discipline boundaries

  Desirable Experience: • Familiarity with secure developer
  environments, enterprise guardrails, or policy enforcement •
  Experience with containerised development environments or
  remote/offloaded development models • Exposure to telemetry,
  usage analytics, or engineering reporting pipelines •
  Experience in regulated or control-heavy enterprise
  environments • Some data engineering or analytics
  capability, particularly where reporting and insight
  generation are part of the role Working at ClearRoute We
  have grown from six founders to 180+ people across five
  countries in three years, and what sets us apart isn't the
  pace, it's how we grow.

  - Real flexibility, in practice. We trust you to perform at
    your best and still have a life outside of work, with
    genuine hybrid working, a home office budget, an open
    feedback culture where your voice shapes decisions, and
    time off when life needs it (birthday included).
  - When ClearRoute wins, you win. We offer profit share so
    success is shared, meaningful recognition for great work,
    and benefits that look after you and your family,
    including private healthcare, competitive salary
    benchmarking, and a confidential employee assistance
    program covering counselling, mental health support, and
    financial wellbeing.
  - A community you'll genuinely want to be part of. Interest
    based communities like running and book clubs, Women in
    Tech group, monthly socials, and cross regional events
    bring people together across the company. An inclusive,
    collaborative culture where you don't need to conform to
    succeed, where people support one another and feel
    comfortable being themselves.
  - Where meaningful work meets real growth. You will tackle
    complex, real world problems at the forefront of platform
    engineering, AI, security, and scalable systems. Your
    growth is supported by learning budgets, Udemy access, a
    clear career framework, internal mobility, and thought
    leadership opportunities that take your impact beyond
    ClearRoute.

  At ClearRoute, we believe diverse perspectives lead to
  better outcomes, and inclusion creates the conditions for
  everyone to thrive. We are proud to have built a family
  friendly working environment and have many employees who
  have caring responsibilities alongside work. We welcome
  applications from people who require flexibility and will be
  happy to discuss needs on an individual basis.

  We are committed to fostering a culture where all team
  members feel respected, supported, and empowered to do their
  best work. We celebrate individuality and our differences
  and understand that some differences may mean that you
  require changes made to the interview process. We are happy
  to cater to your needs to make the interview accessible, if
  this is something you require please let us know by emailing
  us at join@clearroute.io
