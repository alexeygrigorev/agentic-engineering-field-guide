description: |
  Discover your potential. Build your legacy. Go the distance
  with Capital Group At Capital Group, we go the distance —
  for our people, our clients, and each other. As a global,
  privately held firm with more than 95 years of history, we
  believe meaningful careers, like meaningful investing, are
  built over the long term. That’s why we invest in our
  associates with the same conviction we bring to our clients
  — through career growth, purpose-driven work, whole-person
  wellness, and rewards that recognize your contributions.
  Here, you’ll find the opportunity, global scale and support
  to unlock your potential and build a career that lasts.

  The role

  As a Technology Operations Senior Manager, you’ll shape and
  lead foundational technology operations capabilities that
  keep global services available, secure, resilient, and
  efficient. You’ll partner with senior technology leaders to
  define operating models, team structures, capability
  roadmaps, and investment priorities as the organization
  evolves. By setting clear standards across cloud, network,
  and on-premise platforms, you’ll build operations that can
  scale sustainably and support Capital Group over the long
  term.

  The team

  You’ll join a global technology operations organization that
  supports foundational services across cloud, network, and
  on-premise platforms. Working closely with senior technology
  leaders, vendor management, and critical third-party and
  SaaS providers, the team strengthens reliability,
  resilience, service management, and operational efficiency.
  The organization is evolving, so you’ll help clarify
  responsibilities, engagement models, and investment
  priorities while developing a geographically distributed
  leadership team.

  Your impact

  - Define and evolve the operational strategy for foundational
    technology services, connecting near-term execution with
    long-term business and technology outcomes.

  - Translate enterprise strategy into clear operating models,
    capability roadmaps, staffing approaches, accountability
    boundaries, and investment priorities.

  - Lead and adapt multiple technology operations capabilities
    as the organization matures, reinforcing collaboration,
    ownership, and operational rigor.

  - Champion availability, scalability, resilience,
    recoverability, and sustainability across cloud, network,
    and on-premise platforms.

  - Drive AI-enabled, automation-first practices and data-driven
    operations to simplify complexity, improve service
    quality, reduce costs, and scale repeatable processes.

  - Lead high-severity incidents with calm judgment, clear
    incident command, and effective executive communication
    while promoting proactive risk reduction.

  - Ensure global adherence to IT Service Management standards
    and processes, including event, incident, problem, and
    change management, while improving the quality and value
    of operational data.

  - Manage budgets, delivery timelines, performance metrics,
    leadership development, and relationships with critical
    third-party vendors and SaaS providers.

  What you’ll bring

  - 10+ years of progressive technology leadership experience
    managing global teams and complex operational
    environments.

  - A bachelor’s degree in information technology, computer
    science, or a related field; a master’s degree is
    preferred.

  - Experience developing and executing operational strategy
    tied to long-term business objectives.

  - Experience shaping operating models, defining scope, roles,
    decision boundaries, staffing plans, and capability plans
    in evolving organizations.

  - Proven ability to lead high-stakes incidents with composure,
    clarity, and executive presence.

  - Strong knowledge of enterprise technology operations, ITIL
    frameworks, and regulatory and compliance requirements.

  - A track record of delivering modernization, automation, AI-
    enabled, and data-driven operational outcomes.

  - Exceptional leadership, communication, and stakeholder
    management skills, with the ability to advise senior
    leaders and influence priorities and investment decisions.

  What you’ll get When you go the distance for our clients, we
  go the distance for you. You’ll grow through mentoring,
  leadership programs and tuition reimbursement, and do work
  that matters at a firm managing $3T+ in AUM for millions of
  investors worldwide. We invest in your whole life too – with
  comprehensive wellness and mental health support, family-
  first benefits, competitive pay with performance and
  profitability bonuses and a company-funded retirement plan.
  And as a privately held firm built for the long term, we
  offer the opportunity and support to build a career that
  lasts.

