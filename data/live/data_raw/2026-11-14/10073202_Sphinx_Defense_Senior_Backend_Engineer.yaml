description: |
  ABOUT SPHINX

  Sphinx builds software to solve complex national security
  problems in Space. Founded by engineers and technologists
  with deep experience across commercial and defense
  technology, we were frustrated by the outdated and insecure
  technology America's service members are forced to rely on.
  We're here to do better.

  We’re focused on building modern, scalable products with an
  emphasis on using open source technologies. Expect talented,
  motivated, and interesting colleagues who emphasize
  collaboration, transparency, and individual responsibility.

  ABOUT THE ROLE

  Sphinx is hiring a Senior Backend Engineer to join our team,
  building the next generation of mission planning and command
  and control software for space communications programs. This
  team is charged with creating modern, resilient services and
  capabilities to service the US Government for the next
  decade and beyond.

  As a Senior Backend Engineer, you will play a key role in
  building a cutting-edge communications platform for US
  government satellites. Sphinx is hiring a Senior Backend
  Engineer to join our Space Communications team, building a
  ground communications and data-transport platform for US
  government satellites. As a Senior Backend Engineer, you
  will lead the development of core platform services and
  design and build technology to support the operations of
  various US  government satellites. You'll work as both an
  individual contributor and a lead for more junior engineers.

  You will have an outsized role in determining what we build
  and how we work. You'll work as both an individual
  contributor and a lead for more junior engineers.

  What you will be focusing on:

  - Building multi-tenant services on public cloud platforms
    like AWS
  - Building, architecting, and consuming APIs and backend
    services as part of the platform ecosystem with an
    emphasis on automation, testing, and security
  - Advocating for improvements to product quality, security,
    and performance that have a particular impact on your team
    and others
  - Supporting junior engineering talent with mentorship or
    technical guidance
  - Interacting with customers and partners to help them
    integrate with our services
  - Scale the services and solve interesting Space Communication
    challenges

  You might be a good fit if you have:

  - 5+ years of progressively responsible software engineering
    experience
  - Have extensive experience with Python, FastAPI, Postgres,
    AWS, Docker, Kubernetes, and Terraform*
  - Demonstrable in-depth knowledge of at least one commercial
    cloud platform and its associated services
  - Led the architecture, development, and building of backend
    services and APIs to ensure performance, security, and
    reliability
  - An ability to successfully own technical problems end-to-end
  - Made enough mistakes and booked enough wins to know what not
    to build and what good looks like
  - Excellent communication skills, working with end-users to
    design and build solutions to their needs, a habit of
    self-directed learning of new technologies, and the
    ability to learn quickly and adapt to a fast-paced
    environment

  LOCATION

  This is a fully remote role. All work must be completed in
  the United States. Occasional travel may be required, such
  as client visits, semiannual company gatherings, and other
  project related travel as needed may be required.

  COMPENSATION

  This role is between $160,000 - $185,000 base salary.

  BENEFITS

  Compensation includes competitive salary, meaningful equity
  ownership, profit sharing, employer 401(k) contribution, and
  100% employer covered medical, dental, and vision insurance
  for you and your dependents.

  EEO STATEMENT

  At Sphinx Defense, we are devoted to building a team that
  represents a variety of backgrounds, perspectives, and
  skills. Sphinx Defense is committed to providing equal
  employment opportunities to all employees and applicants for
  employment without regard to race, color, religion, sex,
  sexual orientation, and gender identity.



  CLEARANCE ELIGIBILITY - This position requires eligibility
  to obtain and maintain a U.S. security clearance. For more
  information about U.S. Security Clearances: click here.



  To conform to U.S. Government export regulations, applicant
  must be a (i) U.S. citizen or national, (ii) U.S. lawful,
  permanent resident (aka green card holder), (iii) Refugee
  under 8 U.S.C. § 1157, or (iv) Asylee under 8 U.S.C. § 1158,
  or be eligible to obtain the required authorizations from
  the U.S. Department of State. Learn more about the ITAR
  here.
