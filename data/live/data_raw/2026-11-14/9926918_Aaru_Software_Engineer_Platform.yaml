description: |
  ABOUT AARU

  Aaru operates at the frontier of predictive intelligence,
  using AI to simulate and predict human behavior at scale. By
  generating and deploying instances of artificial
  intelligence that mirror humans, called agents, Aaru
  simulates entire populations with unprecedented accuracy.
  Our partners use Aaru to refine strategic positioning,
  identify and understand high-value audiences, validate
  concepts and messaging before launch, optimize pricing
  decisions, and build a continuously richer understanding of
  their customers through simulation. We provide organizations
  with invaluable foresight, empowering them to anticipate
  outcomes and proactively make the right decisions at the
  right time, every time.

  We're a small, dedicated, mission-driven team and we intend
  to stay that way. We believe the best work happens when
  exceptionally talented people are given ownership, trust and
  the space to operate without bureaucratic friction. We work
  with urgency and intellectual honesty and expect new team
  members to match our velocity. We seek individuals who
  thrive at the frontier, who push beyond conventional limits,
  who bring curiosity and conviction in equal measure, and who
  want their work to have demonstrable impact in the world. If
  you're energized by the idea of a small team doing things
  that feel impossible, let’s build together.



  ABOUT THE ROLE

  As a platform engineer at Aaru, you will design and build
  the product foundation that brings our simulation technology
  to customers. You will work on high-leverage systems,
  interfaces, and workflows that help organizations use Aaru
  to understand change, test decisions, and act with greater
  confidence.



  RESPONSIBILITIES

  - Design, build, and advance the platform that powers Aaru's
    core product capabilities
  - Identify patterns across customer needs, product workflows,
    and simulation technology
  - Build abstractions that make complex simulation capabilities
    easier for customers and agents to use
  - Write framework-level code that absorbs complexity across
    the product
  - Partner with research and product to bring new simulation
    capabilities into customer-facing workflows
  - Own platform decisions from product architecture through
    implementation and iteration



  YOU MAY BE A FIT IF

  - You love asking questions while building something great
  - You make complex things feel simple
  - You understand the tradeoffs between building quickly and
    building well
  - You have worked on products that serve users with a wide
    range of technical abilities
  - You enjoy building systems that create leverage for other
    users, teams, or products
  - You are willing to go deep on ambiguous problems and stay
    with them until they are clear



  STRONG CANDIDATES MAY ALSO HAVE

  - Experience building developer products, platforms, or
    workflow-heavy software
  - Experience launching or building a great product from the
    ground up
  - Experience working closely with research, product, design,
    or customer-facing teams
  - A track record of turning complex technical capabilities
    into simple user experiences



  LOCATION

  This role is based in New York City. Aaru is an in-person
  company, and the team works in-office five days a week.
  Candidates are expected to be located within the New York
  City metropolitan area or open to relocation.



  BENEFITS

  At Aaru, we take care of our people. In addition to a
  competitive base salary and equity participation, we offer
  comprehensive medical, vision, and dental coverage, visa
  sponsorship and relocation support, and various other
  benefits and perks.
