description: |
  Madison Square Garden Entertainment Corp. (MSG
  Entertainment) is a leader in live entertainment, delivering
  unforgettable experiences while forging deep connections
  with diverse and passionate audiences. The Company’s
  portfolio includes a collection of world-renowned venues –
  New York’s Madison Square Garden, Infosys Theater at Madison
  Square Garden, Radio City Music Hall, and Beacon Theatre;
  and The Chicago Theatre – that showcase a broad array of
  sporting events, concerts, family shows, and special events
  for millions of guests annually. In addition, the Company
  features the original production, the Christmas Spectacular
  Starring the Radio City Rockettes, which has been a holiday
  tradition for more than 90 years. More information is
  available at www.msgentertainment.com.

  Who are we hiring?  

  The Senior Manager, DevOps & Cloud Engineering will serve as
  a senior technical leader within the Digital Product
  Engineering team, responsible for setting and evolving cloud
  engineering standards, automation strategy, and DevOps
  practices for the organization. This is a hands-on
  leadership role overseeing infrastructure automation,
  continuous delivery, and continuous integration capabilities
  while managing and mentoring a team of DevOps engineers.
  This role will drive the design and implementation of
  scalable cloud infrastructure, championing operational
  excellence and identifying processes and systems that would
  benefit from modernization to scale Madison Square Garden's
  applications and workflows.

  This role will collaborate with engineers across multiple
  teams, Information Security, system administration,
  networking, and external stakeholders, and will be part of a
  24/7 team supporting web and mobile apps as well as backend
  services, ensuring our software platform is stable,
  scalable, and secure.



   What will you do? 

  - Lead and grow the DevOps & Cloud Engineering team, providing
    guidance and mentoring to team members including senior
    individual contributors, with a focus on diversity,
    collaboration, and respect.
  - Work closely with engineering leadership to reinforce a
    culture of ownership, accountability, and collaboration;
    scale by delegating effectively and ensuring tasks are
    completed as committee
  - Define, maintain, and evolve technology standards and best
    practices in collaboration with cross-functional teams,
    emphasizing automation, stability, security, and
    adaptability
  - Oversee the design, estimation, implementation, and
    operations of cloud infrastructure, developer tooling, and
    CI/CD pipelines to enable rapid, reliable, and secure
    software delivery at scal
  - Contribute to the organization's cloud and DevOps strategy,
    staying updated on industry trends and advancements, and
    making recommendations to ensure alignment with business
    goals and objective
  - Lead automation efforts and identify opportunities to
    improve the quality, cost, and speed of the software
    development lifecycle across cloud engineering,
    application engineering, and quality engineering
  - Manage team budget and expenses with a focus on cost
    optimization and operational efficiency
  - Ensure compliance with security and data privacy protocols
    for all cloud and DevOps projects
  - Monitor and report on key performance indicators and metrics
    for the DevOps & Cloud Engineering team
  - Provide exceptional experiences for our guests, partners,
    and team members, including by adhering to our appearance
    and presentation guidelines while on-site



  What do you need to succeed?  

  - 8+ years of related experience
  - Bachelor’s degree, or equivalent combination of education
    and experience
  - 3+ years of experience in a technical leadership or
    management role
  - Strong hands-on experience with public cloud platforms,
    primarily AWS, with working knowledge of Azure or GCP, and
    their associated services (e.g., ELB/ALB, CloudFront, ECS,
    ECR, EKS, Lambda, Route 53)
  - Strong experience with infrastructure as code frameworks
    such as Terraform, CloudFormation, or AWS CDK
  - Strong experience with containers and orchestration
    technologies such as Docker, Kubernetes, and ECS,
    including service mesh, distributed tracing, and automated
    certificate management
  - Strong experience with CI/CD pipeline tools like Jenkins,
    GitLab CI, GitHub Actions, SonarQube, and Artifactory
  - Strong experience with Linux (RedHat/CentOS/Ubuntu)
    administration and operations, including web/application
    stack technologies (Nginx, MongoDB, Node.js, PHP,
    JavaScript)
  - Proficiency in at least one programming/scripting language
    (Python, Go, Bash, Groovy) with experience in git-based
    workflows and branching strategies (Git Flow, GitHub Flow)
  - Experience with monitoring, observability, and APM tools
    (e.g., Dynatrace, Datadog, AppDynamics, NewRelic) and
    configuration management tools such as Ansible, Chef, or
    Puppet
  - Experience managing and optimizing cloud costs and budgets
  - Demonstrated ability to lead teams through process
    improvement and operational transformation
  - Excellent troubleshooting, problem-solving, interpersonal,
    and communication skills with the ability to influence
    across teams
  - Ability to manage multiple priorities simultaneously and
    maintain composure in high-pressure situations with a
    strong sense of urgency regarding mission-critical issues



  Special Requirements

  - Must be willing to work weekends, overnight shifts, and
    holidays when required
  - This is a 24/7 operational environment; flexibility to work
    various shifts, including nights, weekends, and holidays,
    is required





