description: |
  Senior Backend Engineer – Java

  Location: London (Hybrid) | Practice Area: Technology &
  Engineering | Type: Permanent

  Power the platforms behind modern finance. Shape cloud-
  native solutions with Java at their core.

  The Role

  We’re seeking a Senior Backend Engineer (Java) to join our
  Technology & Engineering team. You’ll bring expertise in
  building robust, scalable, cloud-native applications using
  Java, Spring Boot, and AWS. Working on high-impact platforms
  for Tier 1 financial institutions, you’ll help shape backend
  architecture, champion engineering best practices, and
  contribute to the evolution of modern banking technology.
  You'll also embrace AI-enabled ways of working, using
  approved AI and automation tools where appropriate to
  improve engineering productivity, accelerate delivery, and
  enhance software quality while applying sound engineering
  judgement and responsible AI practices.

  What You’ll Do

  - Design and build cloud-native, microservices-based
    applications using Java (11+) and Spring Boot.
  - Deliver enterprise-ready solutions on AWS, applying modern
    engineering practices and AI-enabled development
    approaches where appropriate to improve delivery
    efficiency and code quality.
  - Build, maintain, and optimise CI/CD pipelines to support
    secure, scalable, and reliable software deployments.
  - Develop comprehensive automated tests and promote quality-
    driven engineering practices across the software
    development lifecycle.
  - Collaborate with agile teams to solve complex technical
    challenges, contribute to architecture decisions, and
    encourage the responsible use of approved AI tools and
    automation to enhance collaboration and delivery.

  What We’re Looking For

  - Strong expertise in Java (11, 17, 21+) and Spring Boot, with
    experience building enterprise-grade backend applications.
  - Deep knowledge of public cloud platforms, preferably AWS,
    alongside cloud-native, microservices, and event-driven
    architectures.
  - Proven experience with CI/CD pipelines, SQL and NoSQL
    databases, Kafka, Java Streaming, and modern software
    engineering practices.
  - Familiarity with Infrastructure as Code (for example,
    CloudFormation), distributed systems, secure application
    design, and scalable cloud deployments.
  - Experience using AI-enabled tools responsibly to improve
    engineering productivity while maintaining appropriate
    human oversight, governance, security, and software
    quality.

  Bonus Points For

  - Experience using GitLab for CI/CD pipelines and Cucumber for
    BDD test automation.
  - AWS Certified Solutions Architect (Associate or
    Professional).
  - Knowledge of CQRS patterns, performance testing strategies,
    and application observability.
  - Curiosity to explore emerging cloud technologies,
    responsible AI, and automation to continually improve
    engineering practices.
  - Experience delivering customer-facing or business-critical
    applications within financial services.

  Why Join Capco

  - Deliver high-impact technology solutions for Tier 1
    financial institutions.
  - Work in a collaborative, flat, and entrepreneurial
    consulting culture.
  - Access continuous learning, training, and industry
    certifications.
  - Be part of a team shaping the future of digital financial
    services.
  - Help shape the future of digital transformation across
    Financial Services & Energy.

  Benefits

  We offer a competitive, people-first benefits package
  designed to support every aspect of your life:

  - Core Benefits: Discretionary bonus, competitive pension,
    health insurance, life insurance and critical illness
    cover.
  - Mental Health: Easy access to CareFirst, Unmind, Aviva
    consultations, and in-house first aiders.
  - Family-Friendly: Maternity, adoption, shared parental leave,
    plus paid leave for sickness, pregnancy loss, fertility
    treatment, menopause, and bereavement.
  - Family Care: Eight complimentary backup care sessions for
    emergency childcare or elder care.
  - Holiday Flexibility: Five weeks of annual leave with the
    option to buy or sell holiday days based on your needs.
  - Continuous Learning: Your growth, your way - minimum 40
    hours of training annually through workshops,
    certifications, and e-learning. You'll also be assigned a
    Business Coach from day one to support your career
    development.
  - Healthcare Access: Convenient online GP services.
  - Extra Perks: Wellhub (Gympass), travel insurance, Tastecard,
    season ticket loans, Cycle to Work, and dental insurance.

  Inclusion at Capco

  We’re committed to making our recruitment process accessible
  and straightforward for everyone. If you need any
  adjustments at any stage, just let us know—we’ll be happy to
  help. We value each person’s unique perspective and
  contribution. At Capco, we believe that being yourself is
  your greatest strength. Our #BeYourselfAtWork culture
  encourages individuality and collaboration—a mindset that
  shapes how we work with clients and each other every day.

  #LI-DNI
