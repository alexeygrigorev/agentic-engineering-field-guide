description: |
  About the company

  Trust Wallet is the secure, self-custody Web3 wallet that
  empowers people to own and control their digital assets.
  Whether you're new to crypto or an experienced user, Trust
  Wallet makes it easier, safer, and more convenient to
  explore Web3, securely access dApps, manage your crypto, and
  buy and sell digital assets, all in one place.

  The Opportunity  At Trust Wallet, you’ll have the chance to
  directly shape the future of how millions of people interact
  with Web3. This role offers the opportunity to:

  - Work on high-impact backend systems that power a product
    trusted by over 200M users worldwide.
  - Contribute to the next generation of self-custody
    technology, enabling individuals to securely own and grow
    their digital assets.
  - Build and scale cloud-native, microservice-based
    architectures that support a truly global user base.

  Responsibilities

  - Feature development and optimization: You will be owning
    backend features that support all our platforms
    (extension, mobile, and desktop)
  - Infrastructure: You will help to define how Trust Wallet
    runs and deploys backend services to our millions of users
  - Maintainability: You will setup system monitoring in order
    to provide high SLAs of the developed features
  - Team building: You will be working with the team to create
    and foster a culture of raising the bar with each new hire

  Requirements

  - 5+ years of software engineering experience, including
    extensive knowledge of Go (3+ years for Mid Level role)
  - Experience building microservice-based architectures
  - Experience with cloud environments like AWS, Azure, or GCP
  - Knowledge of SQL databases
  - Experience in building systems from scratch
  - Experience with containerization (e.g. Docker, Kubernetes)

  Nice to Have

  - Experience in a blockchain-based project
  - Experience building distributed systems.
  - Expertise in identifying and analyzing performance
    bottlenecks
  - Expertise in NoSQL and/or other database storage engines
    (e.g. Key Value)
  - Startup experience

  Additional Information

  This is a global and fully remote role. You must have the
  right to work for the country you are based.

  Why work at Trust Wallet?

  - Be a part of the world’s leading blockchain ecosystem that
    continues to grow.
  - Excellent learning and career development opportunities.
  - Work alongside diverse, world-class talent, in an
    environment where learning and growth opportunities are
    endless.
  - Tackle fast-paced, challenging and unique projects.
  - Work in a truly global organization, with international
    teams and a flat organizational structure.
  - Work fully remotely with flexible working hours.
  - Enjoy competitive salary and benefits.

  Apply today to join our team in building the world’s most
  trusted and secure crypto wallet and enable a decentralized
  future for everyone.

  Trust Wallet is committed to being an equal opportunity
  employer. We believe that having a diverse workforce is
  fundamental to our success.

  *Due to the large amount of the applications, please
  consider your application as unsuccessful should you not be
  contacted within 4 weeks from your application date.
