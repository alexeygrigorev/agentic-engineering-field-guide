description: |
  Location: Dallas, TX (Onsite / Hybrid) Experience: 12+ Years
  Employment Type: Contract / Full-Time

  Job Summary

  We are seeking an experienced Full Stack Engineer with
  strong expertise in React.js and Node.js to design, develop,
  and support scalable web applications. The ideal candidate
  will have hands-on experience building modern, cloud-enabled
  applications, developing RESTful APIs, and working within
  microservices-based architectures.

  Key Responsibilities

  - Design, develop, and maintain scalable web applications
    using React.js and Node.js.
  - Build and consume RESTful APIs and microservices.
  - Develop responsive, high-performance user interfaces using
    JavaScript/TypeScript.
  - Collaborate with product owners, architects, and development
    teams to deliver business solutions.
  - Participate in application design, code reviews, testing,
    and deployment activities.
  - Implement CI/CD pipelines and support cloud-based
    application deployments.
  - Troubleshoot and resolve performance, scalability, and
    production issues.
  - Follow best practices for coding standards, security, and
    application architecture.

  Required Skills

  - 12+ years of software development experience.
  - Strong hands-on experience with React.js and Node.js.
  - Expertise in JavaScript and TypeScript.
  - Experience developing REST APIs and Microservices.
  - Experience with cloud platforms such as AWS, Azure, or GCP.
  - Strong understanding of CI/CD pipelines and DevOps
    practices.
  - Experience building scalable, enterprise-grade web
    applications.
  - Excellent problem-solving and communication skills.

  Preferred Skills

  - Experience with containerization technologies such as Docker
    and Kubernetes.
  - Experience working in Agile/Scrum environments.
  - Familiarity with modern frontend and backend design
    patterns.
