description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  The CrowdStrike Intelligence team is looking for a Senior
  Software Engineer to work on our dedicated engineering team,
  building processing pipelines, information storage systems
  and presentation layers in support of our world-class team
  of analysts and researchers.

  The collection, processing, and exploration of information
  at a large scale is at the core of the Intelligence mission
  at CrowdStrike. The Intelligence Automation team is
  responsible for prototyping, building and operating the
  systems that make up our Intelligence pipeline, and we'd
  like you to join us!

  You will use your deep experience in scalable, distributed
  architectures to design flexible data integration and
  processing systems in a fast-paced Intelligence environment.
  In this environment, requirements sometimes shift rapidly,
  and projects can live anything from weeks to years depending
  on changes in the surrounding ecosystem. You will be
  responsible for all aspects of the software you design, from
  initial design, over hands-on prototyping, overseeing and
  taking an active part in the actual implementation, down to
  deployment to production, and ensuring smooth operations. In
  addition, you will be responsible for proper documentation
  and training of customers of the systems you design. You
  will interact regularly with your internal customers to
  gather requirements, solicit feedback, and validate your
  results. We are agnostic when it comes to technology stacks,
  and you will be free to pick the technologies and tools that
  best fit the purpose at any given time, based on your
  previous exposure to a wide variety of technologies such as
  programming languages, database systems, network protocols,
  queuing and messaging systems, etc.

  As a remote employee on a team distributed across various
  time zones, you will not have direct access to all of your
  co-workers at every point of time, so your ability to work
  unsupervised, communicate asynchronously, and take the
  initiative in maintaining lines of communication is crucial.
  In addition, we are looking for someone who would like to be
  part of a team who are passionate about their work and go
  the extra mile to exceed expectations. We love enthusiastic
  individuals who bring a positive attitude to their work and
  really care about what they produce for our internal
  customers.

  What You’ll Do:

  - Integrate into the Intelligence team and gather requirements
    from Intelligence Analysts and Technical Analysts as
    internal customers
  - Assume responsibility for the long-term maintenance of both,
    new and legacy systems
  - Autonomously develop requirements based on anything from
    vague mission statements to very detailed technical
    specifications
  - Develop systems and autonomously make choices about
    implementation details, as well as the right balance
    between rapid development, scalability, and performance

  What You’ll Need:

  - Bachelor’s degree in Computer Science or equivalent
    academic/work experience
  - Demonstrated, multi-year experience in software engineering
  - Experience in developing scalable, distributed and
    production-grade services
  - Proficiency in Linux and containers
  - Proficiency in hands-on coding in multiple programming
    languages
  - Knowledge of SQL and No-SQL database systems
  - Knowledge of cloud technologies
  - Ability to maintain and improve existing Go and Python code
    bases
  - Ability to communicate technical detail in a simple, top-
    down manner to management, customers, and peers
  - Ability to independently  make sound, justifiable decisions
    and take action
  - Ability to plan, organize and prioritize work independently
    and meet deadlines
  - Ability to work on a geographically distributed and diverse
    team
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points

  - Familiarity with the AWS or GCP cloud ecosystem (e.g. EC2,
    S3, VPC, ECS)
  - Experience developing Web UIs, e.g. Single-Page-Applications
    (SPA)
  - Experience creating scalable and well-documented HTTP APIs
  - Experience with malware analysis or software reverse
    engineering
  - Offensive information security experience, e.g. from
    capture-the-flag (CTF) competitions

