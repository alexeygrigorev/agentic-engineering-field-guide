description: |
  Company Description

  Granola Studios is an Entertainment Technology Startup based
  in Berlin. Our mission is to bring fans closer to their
  favourite artists without leaving the house. Real artists
  perform exclusive and unique live concerts in a motion
  capture suit and animate their 3D character in a virtual
  world. Fans can watch these live concerts on PC and Mac
  (more platforms coming soon) and use their own personalized
  avatar to explore the festival venue and to interact
  directly with the artists.

  Here is a video with some impressions from our first
  official live concert with the Belgian artist ICO and the
  Festival Les Ardentes: https://youtu.be/tyUvt-bTxYI

  Job Description

  - Build new features in a dynamic startup environment using
    the latest technologies and tools such as Node, React,
    AWS, GitHub, Docker, Kubernetes, mongodb
  - Take ownership of features, starting with an idea, going
    through the implementation, following the production
    deployment and continuously monitoring
  - Advise and be part on architecture choices and tools
  - Be creative and push new concepts forward

  Qualifications

  - You already have some experience building applications from
    concept to production
  - You love Javascript and its community
  - You are familiar with databases
  - You are happy to learn and explore new technologies
  - You prefer to focus on the end goal instead of the means to
    the goal
  - You like to build upon existing solutions and use modern
    technologies and frameworks
  - You love shipping code daily to see progress
  - Writing tests is something you find very helpful:)

  Additional Information

  Why you should join us

  - An early employee of a promising new Startup about to
    revolutionize live entertainment
  - Many VR headsets, fast computers, nice little office or work
    from home
  - You will probably meet some big artists ;)
  - Direct communication with the founders
  - You can directly contribute to shaping the product
industries:
