description: |
  Linus Health is a Boston-based digital health company
  focused on transforming brain health for people across the
  world. By advancing how we detect and address cognitive and
  brain disorders – leveraging cutting-edge neuroscience,
  clinical expertise, and artificial intelligence – our goal
  is to enable a future where people can live longer, happier,
  and healthier lives with better brain health.

  About the role

  As a Senior Full stack Software Engineer I you will be a
  core team member responsible for driving the design,
  development, and delivery of complex software systems. By
  combining deep front end technical expertise with strong
  backend api design abilities you will drive secure,
  performant implementations with your fellow team members
  toward high-impact outcomes. Influence api and database
  design decisions, front end technical direction, and ensure
  the scalability, reliability, and maintainability of
  software solutions. Collaborate closely with cross-
  functional partners—including product managers, designers,
  and other engineers—to align technical initiatives with
  business goals. Mentor and coach other engineers, fostering
  growth, best practices, and a culture of technical
  excellence within the organization.

  Please note that this position is for a Senior I FS
  Engineer, not a Senior II or Staff. Please also only apply
  if you're salary expectations are within the range that is
  included on the job post below.

  What you'll do

  - Build full stack applications upon restful services,
    ensuring performant, scalable, observable, maintainable
    solution in collaboration with Software Architect.
  - Lead by example with hands-on coding, code reviews, full
    stack feature design, while also anticipating long-term
    challenges such as system performance, technical debt, and
    evolving technology stacks.
  - Advance AI-assisted usage by championing best practices and
    practical applications for ai-assisted code generation
    ensuring speed gains are paired with validation, security,
    and reliability.
  - Uphold best practices for testing (unit, integration,
    snapshot, e2e), CI/CD pipelines, code quality, and
    observability in all solutions.
  - Collaborate with other engineers across projects using
    excellent written and verbal communication skills with a
    proactive mindset to deliver on the goals of the team.
  - Collaborate cross-functionally with Software Architect,
    Product, Design, Data Science/Medical, and Security to
    translate requirements into elegant, maintainable
    solutions that meet our customer’s needs.

  About You:

  Must Haves:

  - 5+ years of software engineering experience with significant
    expertise in React framework and Node.
  - 3+ years building restful services including database design
    in Node.
  - Strong grasp of modern JavaScript/TypeScript tooling and
    ecosystems (Webpack, Vite, Babel, ESLint, Jest,
    Cypress/Playwright).
  - Familiarity with AI-assisted development workflows, and
    proven ability to accelerate development workflows through
    practical application.
  - Proficiency in frontend performance optimization (bundle
    splitting, lazy loading, caching strategies, rendering
    patterns).
  - Strong communication skills—able to drive consensus,
    document decisions (ADRs, RFCs), and present tradeoffs
    clearly to technical and non-technical stakeholders.

  Nice To Have's:

  - Experience with mobile development in React Native or
    iOS/Swift.
  - Exposure to data visualization libraries (D3, Victory,
    Recharts, or native iOS charting).
  - Previous work in digital health or regulated environments
    (EHRs, HIPAA, GDPR).
  - Experience with Temporal orchestration.
  - Experience with Aurora Postgres, database design.
  - Experience / familiarity with Java services.

  How You Embody Our Values

  At Linus, we live by Be Real, Be Wise, Be Noble, Be a Team,
  Be Masters of Our Craft, Think Big and Act Bold. In this
  role, you will:

  - Be Real: communicate technical tradeoffs and risks candidly
    across teams.
  - Be Wise: guide design choices using data, metrics, and long-
    term thinking.
  - Be Noble: uphold high standards for api responsiveness,
    production observability, and customer data privacy in
    every decision.
  - Be a Team: enable engineers to succeed through mentorship,
    documentation, and open collaboration.
  - Be Masters of Our Craft: set exemplary standards for api
    quality, performance, and maintainability (including AI-
    assisted workflows).
  - Think Big and Act Bold: lead bold initiatives like public
    api development that transform how we interface with the
    broader healthcare ecosystem.

  Compensation: The base salary budgeted for this position is
  in the $155,000-165,000 range per year. This position will
  also include a yearly target discretionary bonus as well as
  equity, health benefits, unlimited PTO, a monthly flex day,
  a 401K plan with a match and more. The final offer
  determined for the candidate who is hired into this position
  will depend on a number of factors, including, but not
  limited to, the candidate's relevant skills, professional
  experience, labor market conditions, etc.

  Linus Health is an equal opportunity employer. All qualified
  candidates will receive consideration for employment without
  regard to race, religion, color, national origin, sexual
  orientation, gender, gender identity or expression, age,
  genetic information, disability or any characteristic
  protected by law. We believe that diversity is critical to
  the growth of our company and understand the importance of
  fostering an environment where everyone has a voice. We are
  also committed to providing reasonable accommodations for
  candidates with disabilities during the recruiting process.
  If you are in need of assistance due to a disability, please
  contact us
