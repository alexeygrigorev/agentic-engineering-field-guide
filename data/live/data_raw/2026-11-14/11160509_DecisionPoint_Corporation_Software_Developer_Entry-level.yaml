description: |
  Overview

  DecisionPoint Corporation is seeking a Entry-level Software
  Developer to support our U.S. Transportation Command
  (USTRANSCOM) Integrated Booking System (IBS) program. This
  role is responsible for developing, enhancing, and
  maintaining software applications that support mission-
  critical transportation and logistics operations.The
  Software Developer will contribute to front-end and/or back-
  end development efforts, utilizing technologies such as
  Angular and Java-based frameworks, based on experience and
  program needs. This position supports sustainment and
  enhancement activities across the system lifecycle and works
  closely with senior developers and technical leadership to
  deliver high-quality solutions.The ideal candidate brings
  solid software development experience, familiarity with
  modern development practices, and the ability to work
  effectively in a collaborative, Agile environment.

  This position is fully remote.

  Duties & Responsibilities

  - Design, develop, test, and maintain software applications
    and services supporting the IBS program
  - Develop solutions using Java-based technologies and/or
    Angular front-end frameworks
  - Implement solutions based on functional and technical
    requirements
  - Write clean, efficient, and maintainable code following
    established coding standards and best practices
  - Participate in code reviews and incorporate feedback to
    improve code quality
  - Troubleshoot and resolve application defects and performance
    issues
  - Support integration across system components and external
    interfaces
  - Contribute to CI/CD pipelines, supporting automated build,
    test, and deployment processes
  - Ensure applications comply with security requirements,
    including secure coding practices and STIG alignment
  - Participate in Agile development processes, including sprint
    planning, stand-ups, and retrospectives
  - Develop and maintain technical documentation
  - Support testing activities, including unit, integration, and
    system testing
  - Collaborate with senior developers, QA, DevSecOps, and
    infrastructure teams to support successful deployments

  Qualifications

  - Active Secret Clearance or ability to obtain
  - Ability to aquire IAT Level II certification (CompTIA
    Security+ CE preferred) within the first 9 months
  - Minimum 1 years of experience in software development
  - Experience with Java development (e.g., Spring Boot or
    similar frameworks)
  - Experience with Angular (modern versions), TypeScript, HTML,
    and CSS
  - Experience building and consuming RESTful APIs
  - Experience working in Agile development environments
  - Familiarity with CI/CD tools and DevSecOps practices
  - Experience with relational databases
  - Strong problem-solving, debugging, and analytical skills
  - Ability to work independently and collaboratively in a fast-
    paced environment

  Preferred:

  - Experience supporting USTRANSCOM or DoD
    transportation/logistics systems
  - Experience with cloud-based environments (AWS preferred)
  - Familiarity with containerization technologies (Docker,
    Kubernetes)
  - Experience with microservices architectures
  - Knowledge of secure coding practices and application
    security tools
  - Experience with tools such as GitLab, Jenkins, Jira, and
    Confluence

  Our Equal Employment Opportunity Policy

  - EEO and Affirmative Action Policy: DecisionPoint Corporation
    is an Equal Employment Opportunity and Affirmative Action
    employer. It is the policy of DecisionPoint Corporation to
    provide equal employment opportunity in accordance with
    all applicable Equal Employment Opportunity/Affirmative
    Action laws, directives and regulations to all employees
    and qualified applicants without regard to race,
    ethnicity, color, religion, national origin, sex, age,
    disability status, pregnancy, sexual orientation, gender
    identity, genetic information, protected veteran status,
    or any other protected status under Federal, State or
    Local laws.
  - Pay Transparency Policy: In accordance with Presidential
    Executive Order 13665, DecisionPoint Corporation will not
    discharge or in any other manner discriminate against
    employees or applicants because they have inquired about,
    discussed, or disclosed their own pay or the pay of
    another employee or applicant. However, employees who have
    access to the compensation information of other employees
    or applicants as a part of their essential job functions
    cannot disclose the pay of other employees or applicants
    to individuals who do not otherwise have access to
    compensation information, unless the disclosure is (a) in
    response to a formal complaint or charge, (b) in
    furtherance of an investigation, proceeding, hearing, or
    action, including an investigation conducted by the
    employer, or (c) consistent with the contractor's legal
    duty to furnish information.
  - Authorization to Share Resume and Personal Information: By
    expressing your interest and submitting your resume for
    this position, you authorize DecisionPoint Corporation to
    share your resume, as well as personal information
    included on the resume, with its subsidiaries, affiliates
    and teaming partners for the purpose of considering you
    for this position and other available positions requiring
    comparable skills, education and experience. Should
    DecisionPoint Corporation. or its affiliates and teaming
    partners wish to initiate pre-employment discussions, you
    will be asked to complete an employment application and
    related employment documents.
