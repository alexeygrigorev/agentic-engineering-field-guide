description: |
  About Us 🌏

  A billion jobs will be transformed by technology in the next
  decade. Companies must reskill their people at an
  unprecedented rate. Individuals must continuously adapt as
  industries, technologies, and models shift. At Uplimit, we
  exist at that intersection. We are an AI-native learning
  platform where organizations train the most in-demand skills
  and individuals reinvent their careers. We’ve built every
  element—content generation, practice, feedback, motivation,
  analytics—on AI. No passive videos, no rote courses: real
  learning powered end-to-end by models. Our founding team
  draws from 20+ years of education, AI, product & engineering
  experience across Coursera, Google, Robinhood, Meta,
  Stanford, Snowflake, and Palantir. We’re now building the
  founding product & engineering team to define what learning
  means in the AI era.

  Responsibilities 👩🏽‍💻👨‍💻

  - Own new user-facing features and help design the core
    architecture of our education platform: learner interface,
    practitioner portal, org dashboard.
  - Build and integrate cutting-edge AI workflows: from
    curriculum generation to AI-augmented course creation, to
    automated evaluation and feedback loops.
  - Take ownership end-to-end: requirement gathering, design,
    implementation, launch, monitoring, iteration—cover
    frontend, backend, services, ML pipelines.
  - Define and implement processes for high-velocity product
    development: CI/CD, code reviews, testing, observability,
    feature monitoring.
  - Collaborate closely with product managers, designers,
    customer-success, sales, and ML teams to deliver
    delightful experiences to learners and instructors.
  - Apply learnings from past features to future iterations; be
    proactive in systemizing what works and retiring what
    doesn’t.

  Background 🔰

  - Proficiency in full-stack development: you’ve shipped
    frontend + backend systems using JavaScript/TypeScript,
    Go, Python, Java or similar.
  - Experience building or integrating AI/ML-driven products
    (e.g., LLMs, embeddings, automated evaluation, intelligent
    feedback systems) is a strong plus.
  - Comfort working across the full software lifecycle:
    gathering requirements, designing modules, coding
    standards, code reviews, version control, build & test
    pipelines, operations.
  - Ability to communicate cross-functionally: you can speak
    tech with engineers, strategy with product, outcomes with
    business.
  - Startup mindset: you thrive in ambiguity, take ownership,
    move fast, and adapt fluidly as priorities shift.

  Our Offering 📍

  - Location: San Mateo, California. Engineering team
    collaborates in-office a few times per week. Remote hiring
    considered (US & Canada only).
  - Compensation: Base salary targeted between $120,000 and
    $190,000, depending on experience, skills, location.
    Equity + benefits included.
  - Equal Opportunity: We encourage applicants from all
    backgrounds, life experiences, identities. We’re building
    something meaningful and inclusive.

  Why Join Us?

  - You’ll help build the next generation of online
    education—not just another learning site, but a platform
    re-imagined for AI.
  - You’ll be instrumental in creating systems that enable mass
    reskilling and lifelong learning at scale.
  - You’ll work alongside a team with deep experience, high
    ambition, and strong conviction: we’re not settling, we’re
    iterating fast.
  - If you want to leave a mark on how people learn and work in
    the age of AI, this is the moment.
