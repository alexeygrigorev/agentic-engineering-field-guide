description: |
  Hi, we're Oscar. We're hiring Staff Software Engineers to
  join our Engineering team.

  Oscar is the first health insurance company built around a
  full stack technology platform and a focus on serving our
  members. We started Oscar in 2012 to create the kind of
  health insurance company we would want for ourselves—one
  that behaves like a doctor in the family.

  About the role

  We are hiring for Staff Software Engineers, Fullstack (with
  a frontend lean) to join several teams across the Oscar
  Engineering organization.

  In this role, you will lead technical efforts to build
  reliable and maintainable applications, infrastructure, and
  interfaces that make interacting with the health care system
  easier for both members and providers.

  You will report into a leader within the Engineering
  Organization (Associate Director+).

  Work Location: This position is based in our New York City
  office, requiring a hybrid work schedule with 3 days of in-
  office work per week. Thursdays are a required in-office day
  for team meetings and events, while your other two office
  days are flexible to suit your schedule. #LI-Hybrid

  Pay Transparency: The base pay for this role in is: $192,000
  - $252,000 per year. You are also eligible for employee
  benefits, participation in Oscar's unlimited vacation
  program, company equity grants, and annual performance
  bonuses.

  Responsibilities

  - Serve as the subject matter expert on business and technical
    domains.
  - Lead the planning, execution and release of complex
    technical projects across multiple teams, including owning
    medium to large features or infrastructure projects from
    technical design through completion.
  - Work with partners, product managers, and designers to solve
    challenging problems.
  - Lead and mentor engineers and engineering teams to improve
    technology, apply best practices and set overall team
    direction.
  - Responsible for ensuring the team's delivery of large or
    complex technology capabilities (set of components or
    services) within their team's domain or spanning multiple
    domains.
  - Facilitate, encourage, and enhance a culture of
    collaboration within the engineering team and its internal
    customers; recognizing when cross-team projects are at
    risk and actively mitigate risk to deliver on time.
  - Prolific contributor to the objectives of their functional
    group, and plays a key role in driving outcomes for
    organization-wide projects.
  - Work with leadership to assign prioritization of technical
    roadmap and influence prioritization of product roadmap
    and process enhancements within their area and across
    related areas.
  - Actively identifies and reduces failure domains while
    working with their team to do the same.
  - Builds software to minimize effort and business impact
    during maintenance and failures.
  - Guide the development of Service-Level Objectives (SLOs) for
    systems they and their team are responsible for.
  - Compliance with all applicable laws and regulations.
  - Other duties as assigned.

  Qualifications

  - 7+ years of professional software engineering experience
  - 5+ years of experience as a leader of cross-pod or cross-
    company deliverables
  - 5+ years of experience leading technical contributions,
    improving the quality of what your teams create
  - 5+ years of experience with practical application of CS
    concepts within their team.
  - 5+ years of experience setting and enforcing the standard
    for writing stable, correct, and maintainable code
  - 5+ years of experience leading technical teams including
    mentoring and training more junior engineers.

  This is an authentic Oscar Health job opportunity.

  At Oscar, being an Equal Opportunity Employer means more
  than upholding discrimination-free hiring practices. It
  means that we cultivate an environment where people can be
  their most authentic selves and find both belonging and
  support. We're on a mission to change health care -- an
  experience made whole by our unique backgrounds and
  perspectives.

  Pay Transparency:  Final offer amounts, within the base pay
  set forth above, are determined by factors including your
  relevant skills, education, and experience. Full-time
  employees are eligible for benefits including: medical,
  dental, and vision benefits, 11 paid holidays, paid sick
  time, paid parental leave, 401(k) plan participation, life
  and disability insurance, and paid wellness time and
  reimbursements.

  Artificial Intelligence (AI): Our AI Guidelines outline the
  acceptable use of artificial intelligence for candidates and
  detail how we use AI to support our recruiting efforts.

  Reasonable Accommodation: Oscar applicants are considered
  solely based on their qualifications, without regard to
  applicant’s disability or need for accommodation. Any Oscar
  applicant who requires reasonable accommodations during the
  application process should contact the Oscar Benefits Team
  (accommodations@hioscar.com) to make the need for an
  accommodation known.

  California Residents: For information about our collection,
  use, and disclosure of applicants’ personal information as
  well as applicants’ rights over their personal information,
  please see our Privacy Policy.
