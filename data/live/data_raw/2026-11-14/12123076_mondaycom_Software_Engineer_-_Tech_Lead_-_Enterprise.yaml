description: |
  At monday.com, we help teams get more work done. We are the
  best AI work platform that empowers teams to automate,
  build, and scale their impact end-to-end with tools that
  actually execute the work for you. With over $1B in ARR,
  250,000+ customers, and a global team, we’re serious about
  building a product people love to use and giving our
  employees the same ownership and flexibility to shape the
  way the world works.



  We care about the impact you make, not the hours you clock,
  so we encourage initiative, ownership, and fresh thinking.
  We back our people with flexible work, wellness and mental
  health support, and a work environment built on
  collaboration.



  We’re currently expanding our engineering teams in London
  and looking for experienced Tech Leads. This is an
  individual contributor role with technical leadership scope,
  it’s not a people management position.

  You'll drive the development of infrastructure features that
  shape our product's future from UI to database.

  🎯 Check out our Engineering Blog -
  https://engineering.monday.com/



  ﻿Please note this is a hybrid role based in our incredible
  London office in Fitzrovia, with 3 days per week on-site.
  About the Team

  Our Enterprise Engineering group sits at the heart of
  monday.com's growth, building the foundational systems that
  our largest customers depend on. The team is split across
  two closely connected areas: the Data Lifecycle team, which
  focuses on data compliance and governance at enterprise
  scale, and the Account Controls team, which gives internal
  and external partners the tools to manage and control
  customer data — and is currently our number one priority for
  enterprise growth. The work is genuinely complex: you'll be
  navigating large-scale, cross-product technical challenges,
  shaping data architecture that touches millions of users,
  and exploring how AI can be meaningfully applied to data
  management. Every decision you make has real impact on how
  enterprise clients experience monday.com. We're a hands-on,
  collaborative team based in London, working across the full
  stack (primarily Node.js and React), and we thrive on people
  who can zoom in on the details when it matters and zoom out
  to see the bigger picture.



  About the role:

  You'll work with experienced and highly talented engineers
  who are passionate about what they do, using cutting-edge
  technologies in a data- and impact-driven environment. We
  foster a culture of transparency, full ownership, teamwork,
  and a no-ego policy.

  Our engineering department consists of multiple groups, each
  responsible for a critical domain within the monday.com
  product. With over 400 engineers, we operate in cross-
  functional teams, collaboratively defining, improving,
  building, and delivering features.

  What you will do:

  - Play a key in shaping our product architecture and
    engineering excellence.
  - Evolve our architecture and engineering practices to support
    the ever-growing scale of users, features, and data.
  - Work alongside experienced and highly skilled developers
    with cutting-edge technologies.
  - Collaborate closely with Product and Design teams, taking
    full ownership and responsibility from conception to post-
    deployment in a fast-paced, dynamic environment.
  - Tech stack: React.js, Redux, Node.js, Ruby on Rails, AWS,
    Elasticsearch, Redis, MySQL.

  Note: Prior experience with our tech stack is not required;
  we welcome people willing to learn.



  Requirements:

  - 10+ years of experience as a Software Engineer.
  - Strong technical expertise with a proven track record of
    building products that people love and use daily.
  - Full-stack development experience, with a primary focus on
    backend.
  - Experience developing large-scale, user-facing web products.
  - Deep product understanding and a passion for creating
    software that delivers an exceptional user experience.
  - Strong team player with excellent communication skills and
    empathy.
  - Commitment to quality and simplicity in engineering and
    product development.



  What monday.com can offer you:

  - Opportunity to join a well-funded, publicly listed company
    with big ambitions and strong growth potential.
  - Competitive base salary, bonus, and RSUs.
  - Private healthcare insurance, critical illness, and life
    insurance coverage.
  - Pension contributions matched up to 7%.
  - ClassPass membership.
  - Buffet breakfast and lunch provided at the office, Monday to
    Thursday.
  - Fully dedicated learning and development team that provides
    opportunities for our employees to hone and gain new
    skills.
  - Fun team events, socials and offsites.
  - Amazing company culture that values transparency and
    collaboration while never forgetting to have fun while we
    work! We've been named "Best Place to Work" in the UK.
  - A global, dynamic and passionate environment with employees
    in Tel Aviv, New York, San Francisco, Miami, Chicago,
    Denver, London, Warsaw, Sydney, São Paulo, and Tokyo.
