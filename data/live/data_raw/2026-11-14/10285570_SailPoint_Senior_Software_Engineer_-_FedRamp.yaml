description: |
  This is a US-based remote role and you must be a  US
  Citizen. You will be required to interview in person.

  About SailPoint

  SailPoint is the leader in identity security for the cloud
  enterprise. Our identity security solutions secure and
  enable thousands of companies worldwide, giving our
  customers unmatched visibility into the entirety of their
  digital workforce, ensuring workers have the right access to
  do their job – no more, no less. Built on a foundation of AI
  and ML, our Identity Security Cloud Platform delivers the
  right level of access to the right identities and resources
  at the right time—matching the scale, velocity, and changing
  needs of today’s cloud-oriented, modern enterprise.

  About the role

  Want to be on a team that is full of results-driven
  individuals who are constantly seeking to innovate? Want to
  make an impact? At SailPoint, our Engineering team does just
  that. Our engineering is where high-quality professional
  engineering meets individual impact. Our team creates
  products that are built on a mature, cloud-native event-
  driven microservices architecture hosted in AWS, which is
  now scaling to meet secure federal requirements in our
  FedRAMP environment.

  As a Senior Software Engineer, your day-to-day will involve
  designing low-to-medium complexity features, writing high-
  performance Golang services, and deploying secure cloud
  resources. You will spend your day collaborating on clean
  API designs, optimizing data structures across Snowflake,
  DynamoDB, and Cassandra, and leveraging Temporal for
  stateful workflow orchestration. Because this is a FedRAMP-
  regulated environment, you will play a critical role in
  ensuring our microservices adhere to strict security,
  compliance, and observability standards, while utilizing SRE
  principles to keep our systems resilient and highly
  available.

  About the team

  You will join a dynamic, collaborative pod of software
  engineers focused on building the next generation of our
  Identity Security Cloud Platform. In this role, you will act
  as a senior Individual Contributor (IC) and module lead,
  providing technical guidance and mentoring a small pod of
  2-3 engineers. The team values innovation, continuous
  delivery, and operational excellence. We work closely
  together to refine our Software Development Life Cycle
  (SDLC) processes, conduct rigorous code reviews, and
  maintain high standards of telemetry and monitoring to meet
  our strict Service Level Objectives (SLOs).

  Roadmap for success

  This section replaces the traditional 'responsibilities'
  section.

  30 days

  - Set up the local development environment and resolve any
    necessary system and repository access issues.
  - Conduct initial 1:1 meetings with engineering managers,
    teammates, and key cross-functional stakeholders.
  - Map out the core microservices architecture and gain a deep
    understanding of our AWS CI/CD pipelines and FedRAMP
    compliance baselines.
  - Ship a small, low-risk bug fix or minor feature to the
    production environment within the first two weeks of
    onboarding.

  60 days

  - Deliver at least one medium-complexity feature or component
    in Golang, adhering to clean API design principles.
  - Actively participate in team code reviews, providing
    constructive and detailed technical feedback to peers.
  - Deepen your understanding of the product roadmap, customer
    pain points, and FedRAMP security controls.
  - Identify at least one area of technical debt, process
    inefficiency, or SRE monitoring gap to improve.

  6 months

  - Take the lead on a large technical epic or complex system
    feature from initial architectural design through
    deployment to production.
  - Propose and document a major architectural improvement or
    tooling upgrade by authoring a Request for Comments (RFC)
    or technical design document.
  - Mentor junior engineers within your pod, providing technical
    guidance and helping them grow their engineering skills.
  - Join the team's on-call rotation and confidently triage,
    troubleshoot, and resolve production incidents using SRE
    telemetry and observability tools.

  1 year

  - Own the technical lifecycle of multiple core microservices,
    ensuring their long-term scalability, performance, and
    security compliance.
  - Guide the engineering pod to successfully execute on key
    product deliverables, ensuring timelines are met and code
    quality remains high.
  - Drive significant improvements to our continuous delivery
    pipeline, optimizing deploy times and reliability for our
    FedRAMP and commercial environments.
  - Partner with engineering leadership to continuously refine
    and elevate our SDLC processes and architectural
    standards.

  Requirements

  - Bachelors degree in related field, or equivalent
    professional experience
  - US Citizenship (Required for FedRAMP compliance)
  - 7+ years of professional software development experience
  - Strong proficiency and hands-on experience in Golang for
    backend system development
  - Architecture: Extensive experience with Microservices
    development, distributed systems, clean API design, and
    event-driven patterns
  - Databases & Data Stores: Direct experience working with
    modern high-performance cloud databases, specifically
    Snowflake (data warehousing), DynamoDB (NoSQL), and
    Cassandra
  - Reliability & Monitoring: Solid understanding of SRE
    principles, setting up telemetry/observability, and
    managing Service Level Objectives (SLOs)
  - Great communication skills
  - Comprehensive experience with an object-oriented programming
    language and techniques
  - Comprehensive understanding of Java Frameworks

  Preferred Skills

  - Experience with AWS
  - Workflow Orchestration: Hands-on experience building highly
    resilient, stateful microservices using Temporal or
    similar orchestration frameworks
  - Experience with Continuous Delivery
  - Experience working on a Big Data/Machine Learning product
  - Experience instrumenting code for gathering production
    performance and security metrics

  Benefits

  At SailPoint, our identity security innovations are powered
  by a global crew. We are proudly headquartered in Austin,
  Texas, with a beautiful campus that overlooks the scenic 4
  Points Preserve. We embrace a flexible, remote-first work
  culture that prioritizes personal autonomy, trust, and work-
  life balance. Working here is defined by "The SailPoint
  Way"; a highly collaborative and inclusive environment where
  leadership is transparent, "smart jerks" are not tolerated,
  and crew members have the freedom to drive real impact in
  security.

  - Flexible Time Off: Generous, trust-based vacation policies
    alongside paid company holidays to help you recharge.
  - Comprehensive Healthcare: Premium medical, dental, and
    vision insurance options, including flexible spending
    accounts (FSAs).
  - Mental Health Support: Robust mental health resources and
    employee assistance programs to support emotional well-
    being.
  - Annual performance bonus
  - Retirement Savings: A competitive 401(k) retirement plan
    featuring a company-matching contribution.
  - Restricted stock units at certain levels
  - Employee Stock Purchase Plan: Discounted stock purchasing
    options that allow you to share in the company's success.
  - Paid Parental Leave: Fully paid leave policies to support
    new parents during family transitions.
  - Community Giving: Paid volunteer time off and matching
    charitable donations through the SailPoint Gives Back
    Foundation.
  - Austin HQ Perks: Free snacks, beverages, catered meals, and
    gym access when visiting our Austin campus.

  Benefits and Compensation listed vary based on the location
  of your employment and the nature of your employment with
  SailPoint.

  As a part of the total compensation package, this role may
  be eligible for the SailPoint Corporate Bonus Plan or a
  role-specific commission, along with potential eligibility
  for equity participation. SailPoint maintains broad salary
  ranges for its roles to account for variations in knowledge,
  skills, experience, market conditions and locations, as well
  as reflect SailPoint’s differing products, industries, and
  lines of business. Candidates are typically placed into the
  range based on the preceding factors as well as internal
  peer equity. We estimate the base salary, for US-based
  employees, will be in this range from (min-mid-max, USD):

  $112,500 - $189,626.00

  Base salaries for employees based in other locations are
  competitive for the employee’s home location.

  Benefits Overview

  1. Health and wellness coverage: Medical, dental, and vision
  insurance

  2. Disability coverage: Short-term and long-term disability

  3. Life protection: Life insurance and Accidental Death &
  Dismemberment (AD&D)

  4. Additional life coverage options: Supplemental life
  insurance for employees, spouses, and children

  5. Flexible spending accounts for health care, and dependent
  care; limited purpose flexible spending account

  6. Financial security: 401(k) Savings and Investment Plan
  with company matching

  7. Time off benefits: Flexible vacation policy

  8. Holidays: 8 paid holidays annually

  9. Sick leave

  10. Parental support: Paid parental leave

  11. Employee Assistance Program (EAP) and Care Counselors

  12. Voluntary benefits: Legal Assistance, Critical Illness,
  Accident, Hospital Indemnity and Pet Insurance options

  13. Health Savings Account (HSA) with employer contribution

