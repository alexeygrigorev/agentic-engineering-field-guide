description: |
  About Tekmetric

  Tekmetric is the all-in-one, cloud-based software helping
  auto repair shops run smarter, grow faster, and serve
  customers better.  Built by a shop owner and shaped by the
  needs of the industry, Tekmetric brings together innovation,
  real-world experience, and a thriving community to help
  shops thrive - not just survive. From running a shop, to
  securing payments to engaging customers, our platform
  simplifies operations so shop owners can focus on what
  really matters: delivering exceptional service, earning
  trust, and growing sustainably.

  Officially founded in Houston in 2017, Tekmetric has grown
  from a single shop’s vision to the industry’s leading
  solution - all by staying true to our values of
  transparency, integrity, innovation, and a service-first
  mindset.  But we’re not just building shop management
  software. We’re building a movement. We’re empowering repair
  shops to rise above the daily grind, create meaningful
  connections with their customers, and lead the industry
  forward - one interaction at a time.

  Come build with us. Join the journey. Shape the future of
  auto repair.

  Working the Tekmetric Way

  At Tekmetric, we’re building a culture where winning matters
  - not for ego, but because when our customers win, we win
  together.

  We move fast, stay curious, and take full ownership of our
  results — no excuses, no finger-pointing. If you thrive in
  ambiguity, take initiative, and view honest feedback as fuel
  for growth, you’ll feel right at home here.

  We’re direct but respectful, ambitious yet grounded, and
  collaborative at every level. Everyone leads through impact
  and is encouraged to speak up, share ideas, and challenge
  assumptions (even your manager’s). This is a place for
  builders, not bystanders.

  Success here takes focus, follow-through, and a willingness
  to roll up your sleeves — but if you’re driven by meaningful
  work and real results, it’s deeply rewarding. You’ll join a
  team that cares about the work, supports one another, and
  takes smart risks to achieve bold goals. Be yourself, stay
  mission-focused, and you’ll thrive. If that energizes you,
  we can’t wait to meet you.

  Where We Work: At Tekmetric, great work happens anywhere,
  but great teams are built through intentional connection. We
  offer hybrid and remote work models based on your proximity
  to our office hubs. Because we value in-person
  collaboration, travel is an expected part of every role. We
  come together several times a year for team and company-wide
  offsites to align on goals and strengthen relationships.
  Attendance at these events is expected and fully supported.

  What You’ll Do

  Tekmetric is looking for a Senior Software Engineer
  (Backend) to take part in the full development lifecycle,
  from ideation and brainstorming, to implementation and
  testing. You will build a strong relationship with Product
  and Design teams and ensure our vision and goals are
  aligned. You will take abstract problems and interactively
  distill and build scalable, sustainable, and performant
  solutions. Our ideal candidate has experience in Java,
  Spring, and MySQL. Experience with Javascript and React is a
  plus

  You will be responsible for:

  - Design and implement scalable services and applications that
    enable positive user experiences and measurable business
    growth
  - Provide implementation estimates and evaluations of
    different solutions
  - Collaborate with and across agile teams to design, develop,
    test, and support technical solutions
  - Ensure application performance, uptime, and scale,
    maintaining high standards of code quality and thoughtful
    application design
  - Manage the end-to-end life cycle on the development of new
    features
  - Provide technical leadership, mentorship and growth to
    junior team members as we scale

  What You’ll Bring

  - You have 5+ years software engineering experience
  - You have experience with Java and SQL databases (2+ years)
  - You enjoy working in fast moving and dynamic environments
  - You have high standards and a strong work ethic
  - You have strong product sense and communication skills
  - You have experience working cross-functionally and can work
    within ambiguity
  - You enjoy bringing innovation and impact to customers

  Bonus Points:

  - Experience with React
  - Experience with AWS

  Please Note:

  - We are only hiring remote engineers located in Eastern,
    Central, and Mountain Time Zones within the US
  - We are hiring contractors located in the EU

  Why You'll Love Working With Us

  Health & Wellness That Have You Covered:

  - Enjoy the flexibility of remote work
  - Competitive base salaries that reflect your value.
  - Flexible PTO — No set number of days, just the trust to take
    the time you need. We genuinely encourage our team to
    disconnect and recharge.
  - Support for every stage of life—with paid maternity,
    parental bonding, and medical leave for you or your loved
    ones.
  - Comprehensive health benefits, including Medical, Dental,
    Vision, and Prescription coverage. For employee only, we
    offer plans that cover 100% of premiums and we cover 50%
    of costs for families.
  - Prioritizing your mental health: get free, confidential
    counseling through our partnership with BetterHelp.

  Investing in Your Future (and Present):

  - 401(k) Retirement Savings Plan with 100% employer match on
    contributions up to 6% - so your future self will thank
    you.
  - Flexible Spending Accounts (FSA) and Health Savings Accounts
    (HSA) to make your money go further.
  - Life and Accidental Death & Dismemberment (AD&D) Insurance
    for added peace of mind.
  - Wellness on your terms: get up to $60/month toward fitness,
    mental health, or almost anything that helps you feel your
    best.
  - After one year of employment, enjoy a $300 home office setup
    bonus to help make your space work for you.
  - Keep growing with support for continuing education - we’re
    invested in your development.

  Most importantly, we have a stellar team, a whole lot of
  fun, and work that actually matters to the shops and
  families we serve!

  Tekmetric is an equal opportunity employer. We hire hard-
  working individuals, regardless of gender, race or color,
  ethnicity or national origin, age, disability, religion,
  sexual orientation, gender identity or expression, or
  veteran status. We know that when our employees feel
  appreciated and included, they can be more creative,
  innovative and successful. We will ensure that individuals
  with disabilities are provided reasonable accommodation to
  participate in the job application or interview process, to
  perform essential job functions, and to receive other
  benefits and privileges of employment. Please contact us to
  request accommodation. Tekmetric will never ask for your
  personal financial or banking information or require any
  financial commitment as part of our candidate search or
  application process. No job offers will be made without a
  formal interview process. All legitimate Tekmetric job
  postings are listed at tekmetric.com/careers. Recruiter
  communications come from @tekmetric.com email addresses.
