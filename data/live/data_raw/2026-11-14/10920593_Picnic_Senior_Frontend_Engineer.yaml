description: |
  Who we are

  At Picnic, we’re reinventing the way employees experience
  lunch at work. By partnering with top local restaurants and
  batching hundreds of orders, we make it easy for companies
  to offer high-quality, individually packed meals, without
  fees or tips. Our mission is to create a seamless,
  affordable, and joyful lunch experience that benefits both
  employees and employers.

  About the role

  We’re looking for a Senior Frontend Engineer to help build
  and scale Picnic’s real-time logistics and operations
  platforms. This role is ideal for someone who thrives in
  ambiguity, enjoys working on complex, high-performance
  systems, and wants to shape frontend architecture that
  directly powers real-world operations.

  You’ll work across web and mobile surfaces, partner closely
  with backend and operations teams, and play a key role in
  defining how we build, ship, and scale frontend systems at
  Picnic.

  What you’ll do

  - Design and build high-performance React applications powered
    by WebSockets, SSE, and GraphQL subscriptions.
  - Contribute to and shape our courier mobile apps built in
    React Native.
  - Lead technical design for complex features and systems, from
    initial architecture through production rollout
  - Own projects end-to-end, driving execution, technical
    decisions, and cross-functional alignment
  - Improve frontend reliability, latency, and scalability in a
    real-time, high-throughput environment
  - Lead debugging, incident response, and performance
    investigations for frontend systems
  - Mentor and coach engineers, raising the bar for frontend
    engineering across the team

  What we’re looking for

  - 3+ years of experience in software engineering, with deep
    frontend expertise
  - Strong experience with TypeScript and modern web application
    development
  - Solid understanding of client networking, async programming,
    performance optimization, caching, and client-side state
    management
  - Experience integrating with GraphQL and REST APIs
  - Proven ability to lead technical initiatives and influence
    architecture and best practices
  - Experience mentoring junior engineers and supporting team
    growth
  - Comfort working outside your immediate comfort zone and
    adapting as the product and team evolve

  Preferred Qualifications

  - Experience building or operating delivery, logistics, or
    real-time systems at scale
  - Full-stack experience and an understanding of backend
    tradeoffs and system design
  - Track record of improving developer productivity through
    tooling, patterns, or process improvements
  - Familiarity with modern frontend architecture best
    practices, including performance, security, and usability

  Why join us

  - Drive real impact: Be part of building the operational
    engine behind a fast-growing startup that’s redefining how
    work gets done.
  - Own your city: Take full ownership of your city’s
    performance and see the direct results of your ideas and
    execution every single day.
  - Work with purpose: Join a mission-driven team focused on
    making the workplace experience better for thousands of
    people.
  - Grow with us: At Picnic, there’s room to grow—personally and
    professionally—as we scale and take on new challenges
    together.

  What else you need to know

  This role is based in our New York office location. As a
  company driven by innovation and continuous change, close
  collaboration is essential. We’re constantly reimagining our
  industry, creating new products, and refining our processes,
  and we do our best work together. That’s why all of our
  office-based teams work onsite, five days a week.

  The base salary range for this role is $176,000 - $242,000
  per year.

  Actual compensation will be determined on an individual
  basis and may vary depending on experience, skills, and
  qualifications.

  Base salary is just one part of your total rewards package.
  You may also be eligible for equity awards and an annual
  performance-based bonus.

  Benefits Summary (USA Full-Time Exempt Employees):

  - Medical, dental, and vision insurance (multiple plans, incl.
    HSA options).
  - Company-paid life and disability insurance (short- and long-
    term).
  - Voluntary insurance: accident, critical illness, hospital
    indemnity.
  - Optional supplemental life insurance for self, spouse, and
    children.
  - Pet insurance discount.
  - 401(k).
  - Health Savings Account (HSA)
  - Flexible Spending Accounts (Healthcare, Dependent Care,
    Commuter)
  - Time Off policies:

  Benefits are subject to change at the company's discretion.
  Atoms accepts applications on an ongoing basis.

  Ready to join us as we serve those who serve others?

  #LI-Onsite
