description: |
  What are we looking for?

  Hercules is looking for a senior analytics and full-stack
  engineer to help us build the future of AI software
  development



  What will you do?

  You will own our full data-stack:

  - ETL: Get all of our data from 3rd party providers (like
    Stripe, Meta ads, our operational database etc) into our
    Data warehouse (BigQuery)
  - Data modeling: Clean and model our data for. We currently
    use DBT and the medallion architecture
  - Semantic layer modeling: Define and model our key business
    metrics, make sure they are modeled 100% accurately
  - Business intelligence: Create dashboards and visualizations
    that our company will use every day. We use Omni for
    Business Intelligence. Your goal is to make Omni as self
    serve as possible for our entire company



  What skills do we expect you to have?

  We expect candidates to be incredibly strong across all of
  the following areas:

  - Software fundamentals: system design, architecture, data
    modeling, and API design
  - Code and codebase quality: write clean, maintainable code.
    Work effectively in monorepos
  - Data modeling: Strong experience modeling data with DBT or
    another declarative data modeling framework
  - Semantic layers: Strong experience with at least one
    semantic layer modeling framework like Omni, Looker, etc
  - Business intelligence: Strong understanding of the different
    ways to display data for easy consumption
  - AI: able to truly 10x your workflow by being on frontier of
    AI coding



  What’s Hercules’ data stack?

  - ETL: Airbyte, Google Cloud Datastream
  - Data warehouse: BigQuery, Clickhouse
  - Data modeling: DBT
  - Semantic layer and Business Intelligence: Omni

  (We are not tied to any of these)



  What are Hercules’ operating principles?

  Hercules’ operating principles guide how we make decisions
  every day. We take them very seriously. Most of the
  principles can be learned on the job, however, we do
  specifically filter for the following principles in our
  hiring process:

  - We ship. We ship fast, iterate, and correct mistakes
    quickly. Our bias for action speeds up our learning and
    delights our customers.
  - We strive for excellence. Doing things well is in our DNA.
    We have good taste. We get the details right. Our outputs
    are exceptionally simple and self-serve. We’re proud of
    our work.
  - We are hungry. We are willing to work hard and break through
    walls to achieve the outcomes we want. We are willing to
    operate at any level to get things done.



  Is Hercules in-office or remote?

  Hercules founding team works in-office in San Francisco
  (Kearny and Bush). We have a very strong preference for in
  office. We are open to remote for exceptional candidates who
  are willing to 1) work in US time zones and 2) travel to the
  office regularly.



  What are Hercules’ benefits?

  - Unlimited AI token budget
  - Take what you need vacation policy
  - Healthcare, vision, and dental
  - Daily lunches, dinners and snacks in the office
  - We guarantee you will do the best work of your career here



  What’s the compensation?

  $100k-$250k + equity (variable based on seniority, equity,
  and location)
