description: |
  At FDJ UNITED, we don't just follow the game, we reinvent
  it.

  FDJ UNITED is one of Europe’s leading betting and gaming
  operators, with a vast portfolio of iconic brands and a
  reputation for technological excellence. With more than
  5,000 employees and a presence in around fifteen regulated
  markets, the Group offers a diversified, responsible range
  of games, both under exclusive rights and open to
  competition. We set new standards, proving that
  entertainment and safety can go hand in hand. Here, you’ll
  work alongside a team of passionate individuals dedicated to
  delivering the best and safest entertaining experiences for
  our customers every day. We’re looking for bold people who
  are eager to succeed and ready to level-up the game. If you
  thrive on innovation, embrace challenges, and want to make a
  real impact at all levels, FDJ UNITED is your playing field.

  Join us in shaping the future of gaming. Are you ready to
  LEVEL-UP THE GAME?

  At FDJ UNITED, the Pricing Team is focused on building and
  deploying quantitative algorithms that deliver accurate and
  low-latency odds to our Sportsbook customers. We build
  microservices across a variety of sports and products, with
  a focus on modularity, interpretability, and
  reproducibility.  As a Senior Engineer within the Pricing
  Engineering team, you will lead on building, optimising and
  deploying production-grade services to deliver a cutting-
  edge sportsbook experience, within a product-focused culture
  that champions SWE best practices. Your focus will be on
  hands-on technical delivery and oversight of production
  systems. This position would be ideal for any strong
  software engineer with strong proficiency in Java or similar
  languages, an interest in sports betting, and the ambition
  to work on high-impact projects amongst a friendly and
  intelligent team!

  Key Responsibilities

  - Develop production-grade technical solutions to business
    requirements, using appropriate design patterns
  - Challenge, refine, and proactively suggest improvements to
    business requirements based on technical expertise and
    domain knowledge
  - Build robust APIs and streaming interfaces to allow
    controlled access to the Pricing team’s complex
    statistical models and data products.
  - Champion best SWE practices for testing, observability,
    CI/CD, and automation within the wider team
  - Constructively critique solutions and code of peers
  - Work alongside Pricing Engineering managers to plan the
    effective delivery of workstreams.
  - Promote work and contributions for use within the team and
    the wider business, through global collaboration,
    conversations, written reports, and presentations.

  Expected Attributes

  - A minimum of 5 years of commercial experience in a SWE role
    focussed on implementing complex requirements within a low
    latency microservice architecture
  - Excellent Java skills (or similar languages, e.g. C#), with
    the ability to write high-quality, performant, and well-
    documented code independently
  - Demonstrable experience working with different architectures
    and systems which you can draw on to solve new challenges
  - The ability to write and/or digest technical
    GAP/Architecture documents into a sequence of deliverable
    work items
  - An excellent communicator, both written and verbal, able to
    explain complex topics to non-specialist stakeholders
  - A problem-solving growth mindset with the ability to pick up
    new tools and concepts quickly
  - Able to be a friendly and approachable team member, capable
    of mentoring more junior colleagues

  Desirable Attributes

  - Masters degree or higher in a STEM subject.
  - Experience with incident management best practices
  - Experience with writing and analysing performance tests
  - Experience with automation testing
  - Experience writing and deploying software within cloud-
    native environments
  - Experience working with sporting data or demonstrable
    knowledge and interest in this area, including an interest
    in sports betting.





  We believe talent knows no boundaries. Our hiring process
  focuses solely on your skills, experience, and potential to
  contribute to our team. We welcome applicants from all
  backgrounds and evaluate each candidate based on merit,
  regardless of personal characteristics as the age, gender,
  origin, religion, sexual orientation, neurodiversity or
  disability.
