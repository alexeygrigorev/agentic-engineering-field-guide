description: |
  Job description About Us:

  We are a funded, early-stage AI startup operating in stealth
  mode. We are building Solvin, the world’s first fully
  autonomous AI teammate that independently fixes bugs end-to-
  end, freeing developers to focus on features and innovation.
  Unlike existing coding assistants that require constant
  developer supervision, Solvin operates as an autonomous
  virtual engineering team member. Powered by a novel multi-
  agent operating system, Solvin works in the background to
  transparently handle the entire bug lifecycle. We have
  designed our platform from the ground up for enterprise
  environments, with a deep focus on security, observability,
  and fine-grained control.

  The Role:

  As a Founding Engineer, you will be a cornerstone of our
  technical team. You will have a pivotal role in designing,
  building, and deploying the foundational elements of our
  product. We're seeking a passionate and experienced engineer
  who is excited by the challenge of building a product from
  its initial concept to a production-ready MVP and beyond.
  You will work in a dynamic, fast-paced environment where
  your contributions will be visible and impactful from day
  one. This role requires a blend of strong technical
  expertise, a product-oriented mindset, and the ability to
  thrive in the ambiguity of an early-stage startup.

  What You'll Do:

  - Take ownership of significant parts of our system,
    architecting and building our core product from the ground
    up.
  - Write clean, high-performance, and scalable code, primarily
    in Python.
  - Collaborate closely with the founders to define and iterate
    on the product roadmap and technical strategy.
  - Design, build, and maintain the infrastructure for our AI
    and machine learning models.
  - Establish and champion best practices for software
    development, including testing, CI/CD, and code reviews.
  - Contribute to all phases of the product development
    lifecycle, from ideation and design to implementation and
    launch.
  - Help shape our engineering culture and, as we grow, mentor
    and guide future team members.

  What We're Looking For (Qualifications):

  - A seasoned engineer with 10+ years of software development
    experience.
  - At least 4 years of professional experience in Python
    development.
  - A minimum of 1 year of hands-on experience building
    generative AI technologies and agentic systems utilizing
    LLMs and frameworks like LangChain or LlamaIndex.
  - Proven expertise in backend development and experience
    shipping and maintaining production systems.
  - A self-starter with the ability to work independently and
    navigate the challenges of a fast-paced startup
    environment.

  Bonus Points (Advantageous Skills):

  - A strong background in cloud computing (AWS, GCP, or Azure)
    and Kubernetes.
  - Proficiency in other programming languages such as Java,
    C++, or TypeScript.
  - Familiarity with Python build systems and packaging.
  - A Bachelor's degree in Computer Science. A Master's degree
    or PhD is a strong plus.

  Why Join Us?

  - Foundational Impact: You will be more than just an early
    employee; you'll be a true partner in building our company
    and culture.
  - Significant Equity: We offer a generous equity stake,
    ensuring that you share in the success you help create.
  - Cutting-Edge Technology: Work at the forefront of AI and
    solve challenging problems with a real-world impact.
  - Direct Influence: Your ideas and decisions will directly
    shape the future of our product and company.
