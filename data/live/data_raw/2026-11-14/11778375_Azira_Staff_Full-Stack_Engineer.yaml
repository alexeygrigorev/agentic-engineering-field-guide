description: |
  Staff Full-Stack Engineer US-Based | Remote | Full-Time |
  Engineering Team

  About Azira

  Azira is on a mission to reinvent how brands use data to
  make smarter decisions, from where to open their next
  location to how they connect with customers in the real
  world. We blend marketing, location analytics, and strategy
  into a single platform, helping leading brands take action
  with confidence. We move fast, think boldly, and care deeply
  about building things that matter.

  Why This Role Matters

  We’re bringing our products and technology together under
  Azira One. As Staff Full-Stack Engineer, you’ll provide
  hands-on technical leadership to make that platform
  scalable, intuitive, and connected. You’ll report to our
  Technical Manager, Engineering. Your work will span the
  whole stack, from front-end architecture to APIs, services,
  data, and cloud systems, turning complex customer and
  business needs into thoughtful solutions. You’ll partner
  closely with Product, Design, Data Science, and SRE. This is
  a senior individual contributor role with no direct reports.
  Your influence will come from technical judgment, hands-on
  execution, and making the entire engineering organization
  more effective.

  What You’ll Do

  - Design and build high-quality product experiences across the
    front end and back end, writing production code and
    staying involved from design through deployment and
    iteration.
  - Lead the technical delivery of complex, cross-functional
    initiatives that span multiple products, services, and
    engineering teams.
  - Shape the architecture and integration of the Azira One
    platform, simplifying fragmented systems and reducing
    unnecessary complexity.
  - Partner with Product and Design to turn customer and
    business needs into scalable solutions, including
    intuitive, responsive, and accessible experiences for
    complex data and analytics products.
  - Design and evolve APIs, services, and data flows that are
    reliable, secure, and easy to maintain.
  - Help develop and improve our practical engineering standards
    for architecture, code quality, testing, documentation,
    and delivery.
  - Improve performance, reliability, observability, and
    security, working with our SRE team to make sure new
    capabilities are ready for production.
  - Lead technical discovery, break large and ambiguous
    initiatives into clear plans, and surface risks,
    dependencies, and tradeoffs early.
  - Raise the bar through thoughtful code and architecture
    reviews, and mentor engineers as they grow into broader
    technical leadership.
  - Champion responsible AI adoption, both in how we build
    software and in the AI-driven capabilities we bring to our
    products.
  - Collaborate with engineering teams across the US, India, and
    France.

  What You’ll Bring

  Your profile

  - You’re a builder and a systems thinker. You enjoy solving
    difficult technical problems, and you care just as much
    about whether the solution is useful, intuitive, and right
    for the business.
  - You’re fluent across the stack. You move comfortably from
    user experience and front-end architecture to APIs,
    services, data, and cloud infrastructure.
  - You bring structure to ambiguity. You take large, undefined
    problems and turn them into clear, achievable plans.
  - You lead without taking over. You help teams reach stronger
    decisions, raise the quality of the work around you, and
    stay personally accountable for execution.
  - You’re a pragmatist. You can set long-term architectural
    direction while making practical decisions that help the
    team deliver today, and you know when to simplify.
  - You’re a clear communicator. You explain complex technical
    decisions and tradeoffs to both technical and non-
    technical audiences.
  - You have strong product instincts. You appreciate usability,
    design quality, and a great customer experience.
  - You’re AI-forward. You use AI tools to improve how you build
    and look for ways AI can make our products better.
  - You care about outcomes. You don’t measure success by lines
    of code or the complexity of the architecture. You measure
    it by whether the product works, scales, and creates real
    value for customers and the business.

  Your experience

  - Significant experience building and operating modern,
    customer-facing software products at a Staff, Lead,
    Principal, or equivalent senior IC level.
  - Deep expertise across front-end and back-end engineering,
    including modern JavaScript or TypeScript frameworks and
    component-based architecture.
  - Experience designing APIs, services, and distributed
    systems, with a strong understanding of relational and
    non-relational data models, application security, and
    system integration.
  - Experience building cloud-based applications on AWS or
    another major public cloud.
  - Hands-on experience with automated testing, CI/CD, and
    production observability, plus a strong grasp of
    performance, scalability, and reliability.
  - A track record of leading technically complex initiatives
    across multiple teams and influencing without formal
    authority.
  - Ability to navigate existing systems, improve legacy code
    thoughtfully, and make sound calls on when to rebuild
    versus evolve.
  - Experience working effectively in a distributed, global
    environment.

  Not a perfect match on paper? If you’ve built and shipped
  great software and you’re excited about this work, throw
  your hat in the ring. We care more about what you can do
  than about checking every box.

  Why You’ll Love It Here

  - Base salary of $160,000-180,000, plus eligibility for an
    annual performance bonus. Final compensation is based on
    experience and is negotiable.
  - Health, dental, and vision benefits, plus flexible PTO
  - Fully remote work environment (US-based)
  - Big opportunity, small ego, high impact
  - A mission you can feel good about, and a team that makes the
    work fun

  How to Apply

  Sound like a fit? Apply here or send us your resume and an
  optional short note/cover letter on why this role feels
  right for you.

  At Azira, we don’t hire for the box. We hire for the spark.
  We’re building boldly. Join us.

  Azira is an equal opportunity employer. We welcome
  applicants of all backgrounds and do not discriminate based
  on race, color, religion, sex, sexual orientation, gender
  identity, national origin, age, disability, veteran status,
  or any other protected characteristic.
