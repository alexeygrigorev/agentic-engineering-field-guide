description: |
  About Zip Security

  Cybersecurity for growing businesses is broken — even
  enterprises spend heavily across hundreds of disconnected
  tools for marginal real-world benefit. For startups and mid-
  sized firms, this gap often means forgoing security
  entirely, or cobbling together a solution that leaves them
  vulnerable in other ways. At Zip Security, we build
  solutions that make enterprise cybersecurity effective and
  doable for growing businesses of all kinds, whether or not
  they have a security team in house. Our product is a
  complete security program that automates device management,
  endpoint security, identity and access management,
  compliance, and managed IT and security operations to keep
  teams of all kinds protected. We help our customers pick
  their right security frameworks, correctly deploy the tools,
  policies, and controls they need, and keep everything
  enforced over time, so their business is protected and
  compliant, 24/7.

  Zip is at the cutting edge of what’s possible in
  cybersecurity, and dedicated to delivering value for our
  customers. It’s a big part of why we’re backed by Ballistic
  Ventures. Major platforms are opening APIs that enable
  automated management at scale, new government initiatives
  are surfacing global threat data, and we're positioned to be
  the first to properly integrate all of it. We're looking for
  driven, talented people to help us get there. If this
  resonates with you, we invite you to consider building
  alongside our team.

  About The Role

  As a Senior Software Engineer, you'll help build from the
  ground up, designing and implementing secure APIs that
  harmonize functionality across multiple different enterprise
  software providers. You'll build a first-class, multi-
  tenant, cloud-native product and gain experience with
  everything from optimizing database queries to constructing
  secure login. You'll gain experience with:

  - AWS services (RDS, ECS, Fargate, etc.)
  - Infrastructure as code (Pulumi, Typescript)
  - Docker
  - Rust
  - Auth0, HashiCorp Vault
  - Common enterprise security tooling
    (Jamf/Okta/GSuite/Microsoft Intune/Crowdstrike etc.)

  What We're Looking For

  - Builders with high-ownership, autonomy, and willingness to
    learn.
  - Familiarity with AWS services
  - 5+ years of experience as a software engineer
  - Willingness to learn new things
  - An interest in security
  - Startup experience

  We believe great teams are built by curious people who care
  deeply about learning, collaboration, and ownership. At Zip
  Security, you’ll have the autonomy to contribute ideas,
  shape decisions, and help build both our product and our
  culture. If you’re excited about the role, we encourage you
  to apply — even if your experience doesn’t perfectly align
  with every qualification.



  What We Offer

  - Competitive compensation, equity, and comprehensive health
    benefits starting on day one
  - 401(k) plan to help you invest in your future
  - Flexible hybrid work environment (2-3 days in office! You
    decide what is best for you!)
  - Monthly wellness benefits to help you stay active, healthy,
    and balanced in whatever way works best for you
  - Comprehensive family-building, fertility, and hormonal
    health benefits to support you through every stage of life
  - High ownership, autonomy, and the opportunity to shape a
    rapidly growing company
  - Fully stocked office with endless snacks, coffee, and tea,
    plus Zip swag and team outings



  Standard Interview Process

  - Initial Screen with Talent Partner
  - Hiring Manager Screen
  - Technical or Team Interview
  - Executive Interview
  - Offer
