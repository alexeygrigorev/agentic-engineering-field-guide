description: |
  Field sales powers the economy — but most teams are
  struggling. Reps are buried in admin work, managers are
  stretched thin, and leaders can’t see what’s really
  happening in the field.

  Siro is redefining how field sales teams learn, perform, and
  win.

  We started as an AI-powered coaching platform that helped
  reps improve their outcomes in the field.

  Today, we’re something much bigger — an intelligent
  companion that automates sales reps’ tedious admin work,
  gives managers real-time visibility, and helps executives
  see around corners.

  Our platform integrates with systems like Salesforce,
  analyzing thousands of in-person sales conversations to
  surface insights, automate workflows, and drive better
  outcomes across the org. Think Iron Man’s Jarvis for sales —
  proactive, personalized, and built directly into the tools
  teams already use.

  Siro has raised $75M and is backed by world-class investors
  like Index, Fika, CRV, and SignalFire. We are trusted by
  leading home-improvement, retail, hospitality, and
  automotive brands, and powered by a lean team from Meta,
  McKinsey, Doordash, and Uber.

  We’re building the future of human-AI collaboration in sales
  — and we’re just getting started.

  Key Responsibilities

  - Build and enhance features (especially frontend) for Siro's
    direct consumers, creating intuitive user experiences for
    our AI-powered sales platform
  - Own the end-to-end development of key features, from
    architectural decisions through implementation,
    deployment, and support
  - Craft intuitive, performant user interfaces that make
    complex AI insights accessible to our users
  - Drive technical excellence through thoughtful code reviews,
    documentation, and engineering best practices
  - Partner closely with product and design teams to transform
    customer needs into elegant technical solutions
  - Help evolve our development practices and tooling to enable
    sustainable scaling while maintaining velocity
  - Own the health of our systems and products, and make data-
    driven decisions

  Requirements

  - We expect 10+ years of professional software engineering
    experience.
  - You are excited to work in our NYC office 3+ days a week
    with the rest of the team.
  - You demonstrate strong proficiency in TypeScript frameworks
  - You have experience with Node.js and REST API design
  - You have demonstrated skill in mobile and/or web performance
    optimization
  - You are a strong problem solver, with the ability to think
    critically and approach challenges with a first-principles
    mindset.
  - You have strong communication skills, able to articulate
    complex technical concepts to both technical and non-
    technical stakeholders.

  Our Tech Stack

  In case you’re curious, we use the following technologies
  (and more), but proficiency in any specific technology is
  not required.

  - Frontend: Next.js, React Native, TypeScript
  - Mobile: Swift, Kotlin
  - Backend: Node.js, Typescript, serverless functions
  - Cloud: Google Cloud Platform (GCP)
  - Other tools: Git, Datadog, Figma

  Why Join Siro?

  - Growth: Join a rapidly scaling Series B startup with proven
    product-market fit
  - Technology: Work with cutting-edge AI technologies and a
    modern tech stack
  - Team: Collaborate with an experienced CEO (previously built
    a successful sales tool used by 100,000+ reps) and top-
    tier team
  - Ownership: Take end-to-end ownership of features that
    directly impact our users
  - Learning: Work across the full stack and grow your technical
    breadth
  - Impact: Help democratize sales success and create
    opportunities for millions of sales professionals

  What Sets You Apart

  - You're a collaborative team player with a "we before me"
    mindset, always ready to support and elevate your
    colleagues.
  - You have high standards for excellence and aren't afraid to
    voice your opinion to push for quality.
  - You think strategically beyond code, considering business
    and design implications in your work.
  - You actively leverage AI coding tools to assist you during
    development.
  - You thrive in an agile environment with low management
    overhead.
  - You're creative and can think outside the box to solve
    complex problems in innovative ways.
  - You continuously look to grow your skills and your impact.

  At Siro, we are committed to creating a diverse and
  inclusive environment where all people feel that they are
  equally respected and valued, whether they are applying for
  an open position or working at the company. We provide equal
  employment opportunities to all applicants without regard to
  race, religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.
