description: |
  Compensation Range:

  Negotiable based on experience

  Compensation Disclaimer: The salary range listed reflects
  the base pay for this role at Altus Group and is provided
  where required by local regulations. Actual offers may
  differ based on experience, market conditions, and other
  relevant factors. The range does not include additional
  compensation such as bonuses, equity, benefits, or other
  incentives.

  Job Summary:

  Altus Group is building modern, AWS-native platforms used
  globally, and we’re looking for a Product Engineering
  Manager who enjoys leading people, shaping technical
  direction, and staying close to real engineering work.

  This role sits at the intersection of technology, delivery
  and people leadership. You’ll lead a team of talented
  engineers, help them do their best work, and create an
  environment where psychological safety, continuous
  improvement and thoughtful adoption of AI are the norm, not
  just buzzwords.

  If you care deeply about engineering quality, healthy teams
  and pragmatic innovation, we’d love to hear from you.

  Key Responsibilities:

  Leading people and teams

  - Lead, grow and support inclusive engineering teams
  - Create a high-trust, psychologically safe environment where
    people feel supported and accountable
  - Hire and onboard new team members, help engineers grow
    through regular 1:1s, feedback, coaching and clear
    development plans; and handle performance conversations
    when needed, with empathy and clarity
  - Maintain a clear understanding of team strengths, skills and
    future needs
  - Support engineers and partners in working effectively using
    Agile and Lean practices

  Technical leadership & delivery

  - Work closely with Product and Architecture to shape
    technical strategy and delivery plans
  - Guide teams building and evolving AWS-native and cloud-based
    platforms, alongside legacy systems
  - Set and uphold strong engineering standards across code
    quality, testing, CI/CD, observability and documentation
  - Stay close to technical decisions through design reviews,
    architecture discussions and hands-on coaching
  - Balance new feature delivery with technical debt,
    reliability, security and long-term platform health
  - Remove blockers and risks so teams can deliver predictably
    and sustainably

  AI adoption & innovation

  - Lead the practical use of AI tools to improve developer
    productivity and software quality
  - Encourage thoughtful experimentation with LLMs and emerging
    AI technologies where they add real value
  - Identify opportunities to embed AI capabilities into
    products and internal platforms
  - Share learnings and outcomes so teams understand what’s
    working and why

  Operational excellence

  - Take ownership of delivery commitments and help teams plan
    work realistically
  - Use a small, meaningful set of metrics to improve
    transparency and decision-making
  - Continuously improve developer experience
  - Support healthy on-call practices, retrospectives and post-
    incident reviews
  - Promote cost awareness and efficiency across AWS
    environments
  - Collaborate with other Engineering Managers through
    Communities of Practice

  Key qualifications:

  You don’t need to meet every requirement to apply. If this
  role excites you and you bring most of the experience below,
  we encourage you to apply.

  Experience

  - Strong background in software engineering, with several
    years in technical leadership and people management
  - Experience building and scaling high-performing engineering
    teams
  - Delivery experience with customer-facing web applications
  - Comfortable working in Agile environments with a continuous
    improvement mindset
  - Experience leading change across technology, process or ways
    of working
  - Hands-on experience using or introducing AI or ML tools
    within engineering teams

  Technical foundations

  - Solid understanding of cloud-native architecture, AWS and
    distributed systems
  - Proficiency in at least one modern programming language
  - Strong grasp of system design and software engineering
    fundamentals
  - Experience with Infrastructure as Code, CI/CD, observability
    and secure production systems
  - Able to communicate technical ideas clearly to both
    technical and non-technical stakeholders

  This role is initially offered as a contract position with
  the potential to convert to full-time.

  Unlock your Altus Experience!

  If you’re looking to advance your career in in an industry
  that is transitioning for greatness, there’s no better place
  than Altus Group.

  Our high trust, high performance culture prioritizes
  progressive programs that empower you to deliver your
  greatest performance while promoting collective success
  where everyone is recognized and connected.

  We offer boundless opportunities in a rapidly growing global
  business: mentorship from the best and brightest in CRE,
  access to our Altus Intelligence Academy, and the chance to
  work with the best data sets, tools and technology in the
  industry.

  What Altus Group offers:

  - Rewarding performance: competitive compensation, incentive
    and bonus plans, and a total rewards package prioritizing
    mental, physical, and financial well-being.
  - Growth and development: we invest in your professional
    learning. Our Altus Intelligence Academy offers over
    150,000 hours of learning content.
  - Flexible work model: our Activity-Based Work model provides
    flexibility to align your work location to the needs of
    the work — use the office for collaboration and remote
    work for focused tasks.

  Inclusivity & Accessibility

  Altus Group is committed to fostering an inclusive work
  environment where all clients and employees feel welcomed,
  accepted and valued. We provide an atmosphere free from
  barriers to promote diversity, equity, and inclusion, and
  encourage equal opportunities for all employees. We’re
  seeking candidates with diverse experiences and provide
  accessible candidate experiences throughout the selection
  process. If you need accommodation, please contact us at
  accessibility@altusgroup.com or +1 888 692 7487.

  Use of Artificial Intelligence

  AI tools may be used to support the initial stages of
  screening for this role; however, all assessments and final
  hiring decisions are reviewed and made by an Altus Group
  hiring professional.



  Background Checks

  Please note that as part of our commitment to maintaining a
  safe and secure workplace, Altus Group may conduct
  background checks on candidates who receive a conditional
  offer of employment. These checks may include, but are not
  limited to, verification of employment history, education
  credentials, criminal records, credit history (where
  relevant), and reference checks. The scope and nature of
  background checks may vary depending on the role, location,
  and applicable laws. All background checks will be conducted
  in compliance with local laws and regulations, and
  candidates will be informed of any checks required as part
  of the recruitment process.



  Other Notes / Application Process

  We appreciate all applicants; however, only those selected
  to move forward will be contacted. Thank you for your
  interest in Altus Group.
