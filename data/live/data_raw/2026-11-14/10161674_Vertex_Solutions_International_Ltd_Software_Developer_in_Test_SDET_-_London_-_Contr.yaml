  Job Description

  Software Developer in Test (SDET) New Digital Bank! London -
  Contract

  We’re Looking for Software Developer in Test for one of the
  most exciting Financial Service projects that we know of in
  Europe. We ideally need someone who is a hybrid between a
  Java developer and a test automation specialist.

  You will get to be a massive part of the development of a
  brand new digital bank! Great opportunity to see something
  coming to life from a clean sheet design!

  We need a specialist who can perform a developer role, with
  a focus on testability and automation. Applying a variety of
  techniques, and applying their unique experience, to review
  designs, analyze code and assess risk.

  What you need?

  - Strong Developing Background with testing experience.
  - Experience writing good quality object-oriented code Using
    Kotlin, Java  or JavaScript
  - CI Tools: E.g. Jenkins/TeamCity
  - Test Automation: Cucumber/Capybara/Selenium
  - Jira

