description: |
  Datavant is a data platform company and the world’s leader
  in health data exchange. Our vision is that every healthcare
  decision is powered by the right data, at the right time, in
  the right format.

  Our platform is powered by the largest, most diverse health
  data network in the U.S., enabling data to be secure,
  accessible and usable to inform better health decisions.
  Datavant is trusted by the world’s leading life sciences
  companies, government agencies, and those who deliver and
  pay for care.

  By joining Datavant today, you’re stepping onto a high-
  performing, values-driven team. Together, we’re rising to
  the challenge of tackling some of healthcare’s most complex
  problems with technology-forward solutions. Datavanters
  bring a diversity of professional, educational and life
  experiences to realize our bold vision for healthcare.

  As a Senior/Staff engineer on the Provider engineering team
  you will solve highly impactful problems that will have
  direct impact on patients and providers by leveraging your
  expertise in building large scale distributed systems. Don’t
  know our tech stack well? We view technology as a means to
  solving problems and getting things done, we value talent
  over current tech stack.  You will be hands-on and work on
  the architecture and design of critical systems while
  helping grow other team members. You will start meaningful
  work from day one and will be in a stretch role that can
  propel your career to higher levels.

  What You Will Bring to the Table:

  - 6+ years of engineering experience writing software and
    refactoring the small parts (source code) as well as the
    big parts (services, applications, and whole systems).
  - Exceptional familiarity with your tools and willingness to
    learn new technologies, given the appropriate time and
    training.
  - Experience creating at least one production system that grew
    to a size where you had to revisit some of your own design
    choices.
  - A desire to continually grow in your professionalism,
    knowledge, and skill
  - A willingness to center patients, healthcare providers, and
    the other people who depend on us as you make decisions.

  The Impact You Will Make:

  - Contribute to design, implementation, and overall
    development of your products
  - Guide and mentor other engineers while developing cutting-
    edge solutions for our health data ecosystem
  - Own substantial projects, take on more responsibility with
    fewer rules, and act like an owner
  - Drive innovation and deliver valuable data solutions for our
    clients
  - Work with our modern tech stack including Python,
    JavaScript, TypeScript, React, Spark, Snowflake, AWS,
    Azure and more
  - Help contribute to our awesome tech blog - click here to
    check it out!

  We are committed to building a diverse team of Datavanters
  who are all responsible for stewarding a high-performance
