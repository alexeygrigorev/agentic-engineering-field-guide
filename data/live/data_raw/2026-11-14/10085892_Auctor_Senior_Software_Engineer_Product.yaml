description: |
  Why Auctor

  We are building the AI layer for professional services and
  software implementation. Think of us as the brain behind the
  best solution engineers, forward-deployed engineers, and
  onboarding teams, automating the documentation, the
  discovery, and the decision-making that powers $400B+ in
  services work. We're going after one of the biggest software
  categories of the decade.

  The Opportunity

  As a Senior Software Engineer, Product at Auctor, you'll own
  and ship features end-to-end across our core product
  surfaces. You'll work closely with design, operations, GTM,
  and deployed services teams to build intuitive, high-quality
  experiences that solve real problems for enterprise
  customers. We're looking for people who want to do the most
  meaningful work of their career: sharp, fast, and
  relentless. No fluff, just speed, execution, and a shot to
  build something generational. This role is based in New
  York, NY, in person 5 days a week.

  What You'll Build

  - Build and iterate on user-facing product experiences for AI-
    powered collaborative workflows
  - Own features end-to-end, from technical design through
    implementation, launch, and iteration
  - Work directly with design and customers to translate complex
    enterprise workflows into simple, powerful interfaces
  - Build rich document generation, synthesis, and review
    experiences on top of LLM infrastructure
  - Develop integrations and data surfaces that connect
    enterprise tools like Confluence, Jira, and SharePoint
    into one seamless product workflow
  - Drive product quality through instrumentation,
    experimentation, and tight feedback loops with users

  What You Bring

  - 4+ years (post-BS/MS) of software engineering experience on
    product-centric teams, with strong full-stack or frontend-
    leaning skills
  - A track record of shipping user-facing features in fast-
    growing SaaS products
  - Comfort working across the stack: you can build a polished
    UI and wire up the APIs and data layer behind it
  - Strong programming skills and general computer science
    knowledge
  - Experience working closely with design and making good
    product judgment calls independently
  - Grit. Experience at early-stage startups is a plus
