description: |
  Senior Country Engineering Process and Project Manager (m/f)

  How you will contribute

  - Lead, coach, and develop engineering managers, team leads,
    and engineers
  - Conduct performance reviews, talent assessments, and
    succession planning
  - Recruit, onboard, and retain top engineering talent
  - Foster a culture of collaboration, accountability,
    inclusion, and continuous improvement
  - Support employee development through mentoring and career
    growth plans
  - Implement new products and projects as a NPI Leader
  - Support and participate in the new site launch process
    across our Technology Sites in Poland
  - Implement new solutions to optimize production costs
  - Provide technical direction and guidance to engineering
    teams
  - Review and approve major technical decisions and designs
  - Drive standardization, best practices, and innovation
  - Support root cause analysis and problem-solving for complex
    technical issues
  - Ensure projects are delivered on time, within budget, and to
    quality standards
  - Identify risks and implement mitigation plans
  - Manage project priorities and allocation of resources
  - Manage security area at Żary site
  - Oversee facilities management to ensure the site meets all
    local regulations and Health & Safety (H&S) requirements
  - Drive continuous improvement in manufacturing processes in
    accordance with production schedules, quality standards,
    and cost targets
  - Provide reports and recommendations to management upon
    request or as needed
  - Provide support and guidance on diagnosing problems,
    replacing or repairing parts, testing and adjusting, or
    recommending subcontractors to resolve such issues
  - Communicate and provide feedback to the Operations
    department and all other stakeholders as required
  - Knowledge of quality and safety management standards used in
    a production/logistics environment, in particular ISO
    9001, ISO 14001, and ISO 45001
  - Knowledge of ATEX standards and regulatory compliance for
    explosive atmospheres environments
  - Ability to work in accordance with quality system
    requirements — creating, updating, and complying with
    standardized process documentation (SOP, WI, instructions,
    control forms).
  - Knowledge of audit principles and willingness to participate
    in process audits and implement corrective actions

  What you will bring

  - A Master's degree in Engineering or a related technical
    field
  - Proven experience in engineering management or team
    leadership within a manufacturing or production
    environment
  - Solid understanding of manufacturing processes paired with
    practical experience in a production setting
  - Strong leadership, supervisory, and coaching skills
  - Hands-on experience with TPM methodologies and key metrics,
    such as OEE, MTTR, and MTBR
  - Proven experience working closely with operational
    departments and international stakeholders
  - Good command of spoken and written English, allowing for
    fluent communication in a corporate environment
  - Strong computer skills, including Microsoft Office, Visio,
    and technical design/drawing software (AutoCAD)
  - Excellent communication skills – You are an exceptional
    listener. You communicate clearly. You write exceptionally
    well and speak eloquently. You can explain practically
    anything to anyone. You feel comfortable on the phone or
    in a group – at any level. You are extremely tactful when
    conveying facts.
  - Problem solving – You enjoy solving problems. You get to the
    heart of the matter. You love taking on difficult
    challenges and finding creative, innovative solutions. You
    don't get flustered easily. If you don't know the answer,
    you will dig until you find it.
  - Detail-oriented – You pay close attention to details because
    they are one of your key strengths. You believe that
    anything worth doing is worth doing well, every time. You
    are focused and nothing escapes your attention.
  - Exceptional critical thinking skills – You can identify gaps
    in logic and hidden causes of problems. You enjoy learning
    new things and are a quick learner.
  - Ability to work in a team – You can work independently, as
    you manage yourself with limited guidance and support, but
    you also enjoy working in dynamic and multicultural teams.
    You are a friendly, helpful, and extremely organized
    person.
  - Results-oriented – You take a proactive approach to
    competing priorities and meet deadlines and commitments,
    always presenting a positive “can-do” attitude.
  - Confidentiality – You always ensure the confidentiality of
    company data.
  - IT skills – Proficiency in the full Microsoft Office suite:
    Word, Excel, PowerPoint, Visio.
  - Willingness to travel – Willingness to travel occasionally.
  - Foreign language skills – Proficiency in spoken and written
    Polish – additional languages, advanced language skills in
    English are required (enabling everyday fluent
    communication).

  Compensation

  DP World offers exciting and challenging roles within a
  growing international organization. We strive to hire and
  develop the right people, locally and globally, stimulating
  personal growth and self-development. We offer a market
  competitive compensation package.

  Salary range: PLN 109,807 - 174,660 gross per year*

  * No rights can be derived from this range. Placement within
  the range depends on relevant experience, skills and
  qualifications

   Benefits

  - Private medical care (LUX MED)
  - Group life insurance
  - Employee Capital Plans (PPK)
  - Employee Assistance Program (EAP) supporting employees and
    their families

  About DP World

  Trade is the lifeblood of the global economy, creating
  opportunities and improving the quality of life for people
  around the world. DP World exists to make the world’s trade
  flow better, changing what’s possible for the customers and
  communities we serve globally.

  With a dedicated, diverse and professional team of more than
  120,000 employees spanning 75 countries on six continents,
  DP World is pushing trade further and faster towards a
  seamless supply chain that’s fit for the future.

  We’re rapidly transforming and integrating our businesses --
  Ports and Terminals, Marine Services, Logistics and
  Technology – and uniting our global infrastructure with
  local expertise to create stronger, more efficient end-to-
  end supply chain solutions that can change the way the world
  trades.

  What's more, we're reshaping the future by investing in
  innovation. From intelligent delivery systems to automated
  warehouse stacking, we’re at the cutting edge of disruptive
  technology, pushing the sector towards better ways to trade,
  minimising disruptions from the factory floor to the
  customer’s door.



  WE MAKE TRADE FLOW

  To Change What's Possible For Everyone.
