description: |
  Warby Parker is on the lookout for a Senior Android Engineer
  to help drive the evolution of our mission-critical mobile
  experiences. In this role, you’ll take ownership of the
  development, architecture, testing strategy, and engineering
  standards of the Warby Parker native Android application.
  You’ll help establish best practices across mobile
  development and contribute to building a best-in-class
  technology discipline. Think you’ve got the goods? Keep
  reading.

  What you’ll do:

  - Contribute to the evolution of our Android platform to
    ensure scalable, observable, performant, and reliable
    mobile systems
  - Lead the design and delivery of complex Android features and
    platform improvements in partnership with Product, Design,
    Backend, and SRE teams
  - Drive architectural decisions within your team,
    participating in design reviews for major initiatives such
    as migrations, modularization, and performance
    optimization
  - Apply and advocate for modern Android best practices,
    including clean architecture, domain modeling, and
    maintainable code organization
  - Own operational excellence for your areas, including crash
    monitoring, performance tracking, logging, and issue
    remediation
  - Own operational excellence for your areas, including crash
    monitoring, performance tracking, logging, and issue
    remediation
  - Mentor engineers through code reviews, technical guidance,
    and hands-on collaboration on challenging problems



  Who you are:

  - Backed by 5+ years of professional software engineering
    experience, including significant experience building and
    shipping native Android applications
  - Expertise in Kotlin and modern Android development
  - Experience building UI with Jetpack Compose and Material3
  - Strong experience with networking and data layers using
    OkHttp and Moshi
  - Strong experience in domain modeling, system design, and
    scalable mobile architecture
  - Comfortable working with distributed systems and
    collaborating closely with backend teams
  - Experienced with modern Android architecture patterns (e.g.,
    MVI/MVVM, modularization, dependency injection)
  - A clear, concise communicator with the ability to influence
    technical direction across teams
  - Someone with a strong belief in accountability who holds
    engineering teams to a high standard
  - Strong computer science fundamentals, including data
    structures, object-oriented design, algorithm design,
    problem solving, and complexity analysis
  - Able, willing, and excited to quickly learn new domains
  - Insatiably curious and passionate about innovation
  - Not on the Office of Inspector General’s List of Excluded
    Individuals/Entities (LEIE)



  Extra credit:

  - Experience with ARCore for augmented reality experiences
  - Experience with OpenCV for computer vision capabilities
  - Familiarity with Filament for real-time rendering
  - Experience optimizing performance for high-volume, consumer-
    facing mobile applications

