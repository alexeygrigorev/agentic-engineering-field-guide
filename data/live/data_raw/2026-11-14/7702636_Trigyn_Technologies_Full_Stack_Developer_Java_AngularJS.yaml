  Job Description

  Trigyn’s direct client is looking for Full Stack Developer
  for contract assignment in New York, NY. Description: The
  client is seeking a strong full stack developer who can
  partner with technology and business colleagues. The
  successful consultant will be required to demonstrate a
  broad expertise software architecture and development as
  well as significant knowledge of financial products and
  markets, with a premium put on self-directed individuals.

  Qualifications

  Required skills include: • Strong software architecture and
  development skills • Experience in enterprise server-side
  programming skills, preferably in Java • Experience with
  SQL, databases and data modeling • Strong communication and
  interpersonal skills to work very closely with team members
  in Bengaluru and New York throughout the entire software
  development lifecycle • Preferably familiar with financial
  markets and asset classes, particularly FX or fixed income •
  Ideally some experience delivering
  HTML5/JavaScript/AngularJS front end solutions • Education
  Level: Bachelor's Degree NO THIRD PARTY CANDIDATES
  PERMITTED!

  Additional Information

