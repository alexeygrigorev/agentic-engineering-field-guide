description: |
  About the Role

  Impact you will make

  Software Engineer with FinThrive is responsible for the
  design and development of new features and tools to support
  our industry leading healthcare software. This position also
  supports and maintains existing products for growth and
  development of our Patient to Payment technology suite. The
  ideal candidate will have experience with software
  development practices and patterns, as well as direct
  experience in supporting enterprise-level cloud-based
  solutions.  Collaborating on a high energy team that
  provides an opportunity for flexibility of responsibility,
  schedule and location.

  You will help create and maintain our software and establish
  best practices.  Key impact:

  - Create or update components of multi-million-dollar revenue
    claims products
  - Work with cutting edge web technologies and modernize older
    applications
  - Build cloud based software using modern CI/CD practices



  What you will do

  - Develop new features and maintain/enhance existing
    functionality
  - Work within and maintain an extensible and performant system
    architecture
  - Perform code review, unit test coverage, and continuous
    improvement
  - Monitor and fix security vulnerabilities
  - Support automation and productivity
  - Communicate effectively with team members and project
    leadership about technical deliverables and hurdles
  - Seek opportunities to incorporate new technologies into the
    product’s technology stack when they can add value
  - Work directly with support organizations to resolve
    production issues
  - Provide application support by analyzing defects,
    replicating/fixing defects and providing root cause
    analysis for defects
  - Troubleshoot and resolve functional and performance related
    issues
  - Update documentations for code written, deployment
    instructions, and support



  What you will bring

  - Bachelor's degree in software engineering or related field;
    alternative 4+ years of software engineering experience
  - Experience in developing software in an Agile environment
  - Good knowledge of Visual Studio, C#, ASP.Net MVC, ASP.Net,
    SQL, WebAPI
  - Experience with modern web development with modern JS and TS
    frameworks
  - Angular experience
  - OOD & Design Patterns, e.g., Inversion of Control (Microsoft
    Dependency Extensions / Autofac/Unity)
  - Experience with unit testing frameworks (nUnit, Moq, MSTest,
    nspec, etc.)
  - Excellent oral and written communications skills
  - Basic understanding of CI/CD and integration of automation
    into CI/CD
  - Effective communication skills and ability to collaborate
    with developers and product owners



  What we would like to see

  - Strong understanding of .NET
  - Azure Knowledge
  - Continuous Integration experience and understanding
  - Automated Testing & Continuous Integration experience
  - Test Driven Development (TDD) experience
  - Cloud base software development experience
  - Healthcare domain knowledge, specifically in the areas of
    Patient Accounting, HIM, Revenue Cycle and IT integration
  - Knowledge of software development best practices; proven
    ability to monitor code quality and unit test coverage,
    security vulnerabilities

