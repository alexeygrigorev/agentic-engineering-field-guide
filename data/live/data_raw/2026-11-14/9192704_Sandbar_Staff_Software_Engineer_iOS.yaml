description: |
  About Sandbar

  Sandbar is an interface company in New York City. We aim to
  expand human thinking. Our team has built software, ML,
  hardware, and consumer products across Meta, CTRL-labs,
  Apple, Peloton, and Equinox.

  Our first product is Stream, a private voice ring that
  extends your thinking. Stream has been featured in WSJ,
  Bloomberg, Wired, and Time's Best Inventions of the Year.

  Join us in creating technology that extends human thinking.

  About

  We’re looking for a staff iOS product engineer to help build
  Stream, a new conversational interface. The Stream iOS app
  touches every aspect of our user experience; including
  device-cloud connectivity, on-device processing, UIUX, and
  more. You’ll work closely with design, firmware, and backend
  engineers to create a technically rigorous experience that
  ultimately feels simple.

  Responsibilities

  - Own iOS product delivery—including architecture (Swift),
    metrics-driven optimization, testing, and releases
  - Work closely with backend services (Websocket) and device
    integrations (BLE) for low-latency, always-available
    human-computer interactions
  - Work with product, design, and GTM to ship releases, gather
    insights, iterate, and improve our experiences for end-
    users

  Qualifications

  - 8+ years building and shipping interactive mobile (iOS)
    applications
  - Strong proficiency in Swift and complex interactive app
    development.
  - Deep experience in OS-level integrations such as media
    control or on-device ML
  - Experience in Python-based servers and the iOS Bluetooth
    stack are a plus
  - Strong interdisciplinary communication
  - Strong ownership, comfort with ambiguity, and technical
    output
  - Passion for end-user delight and human-computer interfaces

  FTE Benefits

  - Health, vision, and dental benefits
  - Company-sponsored 401(k)
  - Unlimited PTO and sick time
  - Early stage equity
