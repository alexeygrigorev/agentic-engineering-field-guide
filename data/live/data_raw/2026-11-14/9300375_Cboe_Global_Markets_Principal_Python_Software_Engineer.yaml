description: |
  Job Description

  Building trusted markets – powered by our people.



  At Cboe Europe, we inspire our people to solve complex
  challenges together because what we do matters. We provide
  the financial infrastructure that powers the global economy.
  As a leading provider of market infrastructure and tradable
  products, Cboe delivers cutting-edge trading, clearing and
  investment solutions to market participants around the
  world.



  We’re building inclusive ways to support professional and
  personal development while strengthening the trust we’ve
  earned as a global market leader. Our teams are empowered to
  share ideas, actively pursue them and bring on a challenge.
  As champions of internal mobility and access to opportunity,
  we encourage our people to “go for it” and equip our
  managers with the training to coach their teams to the next
  level. Our Associate Resource Groups champion diversity,
  equity and inclusion, giving associates a safe space to
  network, share ideas and create opportunities.



  Sound like the place for you? Join us!



  Cboe Europe is seeking a Principal Python Software Engineer.
  As part of a small, talented development team, you will help
  build and expand the data pipeline and event streaming
  functionality of the largest equities exchange in Europe, as
  well as our trade reporting facility and other platforms. We
  are firm believers in the value of testable, maintainable
  code, pair programming and software craftsmanship; as we
  expand and grow our product suite, we need an experienced
  engineer with strong leadership skills to help us grow.



  To support strong partnership and team connection, this role
  follows a four day in office work model.

  Location: London, UK



  Role Overview/ Your responsibilities will be:

  - Working closely with our business development and sales
    teams to develop innovative new products and features for
    our exchanges.

  - Designing and building highly reliable, highly testable
    Python systems to support Cboe Europe’s trading
    operations.

  - Leading complex projects including:

  - Meet regularly with team members and management to discuss
    project progress and operational correctness/efficiency.

  - Manage the involvement of developers across multiple Cboe
    systems and/or other developers both in Europe and the
    United States.

  - Participate in various R&D projects to identify and
    implement promising new technologies.

  - Providing mentoring for other developers (worldwide when
    necessary).

  - Leading others in debugging of complicated engineering and
    operational problems.

  - Providing operational support for Cboe Europe’s trading
    systems by participating in a production support rota,
    responding to incidents in line with Cboe’s Incident
    Management and Response processes, and contributing to
    post-mortem analyses and follow-up actions.

  The ideal candidate has :

  - Expert Python knowledge

  - A commitment to writing testable, maintainable code.

  - Proficiency with advanced SQL techniques.

  - Deep Linux knowledge

  - Solid knowledge of algorithms and data structures.

  - Degree in Computer Science or related field preferred.

  - Highly preferred: Experience with TDD, BDD or other testing
    methodologies

  - Preferred: Familiarity with PostgreSQL and Snowflake

  - Preferred: Familiarity with Web Frameworks such as Django,
    Flask or FastAPI

  - Preferred: Familiarity with event streaming platforms such
    as Apache Kafka

  - Preferred: Familiarity with data pipeline platforms such as
    Apache Airflow

  - Preferred: Familiarity with Java

  - Preferred: Experience in one or more relevant financial
    areas (market data, order management, algorithmic trading,
    financial systems integration, compliance, etc.)

  Benefits and Perks

  - We value the total wellbeing of our people – including
    health, financial, personal and social wellness. We
    believe standard benefits like health insurance and fair
    pay are a given at any organization. Still, you should
    know we offer:

  - Fair and competitive salary and incentive compensation
    packages with an upside for overachievement

  - Comprehensive private medical insurance for employees and
    their families which includes dental cover (taxable
    benefit)

  - Cboe pays for employee access to a private GP service (face
    to face or phone call consultations) to make it easy and
    convenient for you to see a doctor

  - Life and long term illness insurance for stability and peace
    of mind

  - EAP - This service intends to help employees deal with
    personal problems that might adversely impact their work
    performance, health and well-being. This service includes
    short- term counselling and referral services for
    employees and their immediate family.

  - Enhanced paid parental and adoption leave to support parents

  - Cboe offers pensions contribution up to 7% of base salary.
    You don’t have to contribute yourself.

  - ClassPass Corporate Membership which provides access to on-
    demand classes, livestream classes, in-person classes and
    wellness sessions across different fitness genres.
    (taxable benefit)

  - 25 days holiday per year per holiday year for full time
    employees, increasing with length of service at a rate of
    one extra day per completed years’ service, up to a
    maximum of 30 days.

  - Discounted Employee Stock Purchase Plan

  - Employee referral bonus program

  - Complimentary lunch, snacks and drinks in any Cboe office

  - Paid tuition assistance and education opportunities

  - Generous charitable giving company match

  - Volunteer opportunities to help you give back to your
    communities

  #LI-HL



  Any communication from Cboe regarding this position will
  only come from a Cboe recruiter who has a @cboe.com email or
  via LinkedIn Recruiter. Cboe does not use any other third
  party communication tools for recruiting purposes.
