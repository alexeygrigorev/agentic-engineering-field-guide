description: |
  Role Summary

  Revamp is seeking a Senior Project Manager to lead
  engineering delivery for EPC clients building utility-scale
  renewable energy infrastructure. You will oversee a
  portfolio of complex projects, own their scope, schedule,
  and budget, and serve as the main point of contact for your
  clients and project teams. Clients and our engineers will
  look to you for clear direction, sound judgment, and
  transparent communication when plans change.

  You will bring discipline teams and subconsultants together
  around a shared plan, mentor the project managers and
  engineers around you, and shape the proposals that win the
  next project. Every project you deliver puts more clean
  power on the grid, and as an employee-owner you will share
  directly in the success of the firm and the work you
  deliver.

  Duties & ResponsibilitiesCore Technical & Functional
  Responsibilities

  - Oversee a portfolio of EPC projects, owning scope, schedule,
    and budget from kickoff through closeout.
  - Manage multiple complex projects at once and act as
    Portfolio Manager for a suite of similar projects when
    assigned.
  - Review and finalize scopes, budgets, and schedules, and
    confirm they match contract and proposal language.
  - Direct internal engineering resources and subconsultant
    deliverables to meet agreed milestones.
  - Manage submittals, RFIs, and change requests through to
    resolution.
  - Identify project risks, scope changes, and schedule impacts
    early, and drive them to a decision.
  - Prepare, review, and submit monthly project invoicing, and
    track project financial performance.
  - Independently evaluate, select, and adapt project management
    procedures to fit unconventional or complex project
    conditions.

  Quality, Standards & Compliance

  - Review project deliverables for conformity to client
    expectations, quality standards, and contractual
    obligations.
  - Confirm that project execution meets client requirements,
    utility standards, and applicable jurisdictional
    requirements.
  - Maintain accurate project documentation and records so
    project information and correspondence are filed and
    retrievable by the team.

  Client Interface & Business Development

  - Serve as the main point of contact for clients across a
    portfolio of projects.
  - Represent Revamp in meetings with clients, officials, and
    subcontractors, and present project status, risks, and
    technical issues.
  - Lead the preparation of proposals, including scope, budget,
    and schedule.
  - Build and maintain relationships with key EPC clients and
    support business development activities.

  Mentorship & People Leadership

  - Lead the staff needed to complete assignments, assigning and
    directing work for project engineers and discipline team
    members.
  - Mentor project managers and project engineers on delivery
    practices, contract interpretation, and client
    interaction.
  - Share project delivery lessons with the broader project
    management team so the group builds depth over time.

  Collaboration & Communication

  - Serve as the day-to-day reference point for the project
    team, using working knowledge of each project's technical
    elements to route questions to the right party.
  - Coordinate civil, electrical, structural, and power systems
    discipline leads to sequence work and meet deliverable
    dates.
  - Work with technical leads to plan detailed aspects of
    engineering work and resource assignments.

  Additional Responsibilities

  - Perform essential duties including meeting deliverables and
    deadlines.
  - Perform additional related duties as assigned or directed.

  Knowledge, Skills, & AbilitiesRequired Qualifications

  - Bachelor’s degree in engineering, construction management,
    or a closely related field, or similar applicable work
    experience.
  - Eight or more years of project management experience in
    engineering consulting, EPC construction, renewable
    energy, or a comparable industry.
  - Demonstrated ownership of scope, schedule, budget, and
    invoicing across multiple complex projects at the same
    time.
  - Ability to read engineering contract and proposal terms and
    explain their delivery implications to internal teams and
    clients.
  - Experience leading proposal preparation, including scope,
    fee, and schedule development.
  - Advanced written and verbal communication skills, including
    presenting to technical client stakeholders and officials.
  - Ability to resolve complex project issues and seek guidance
    only when necessary.
  - Ability to travel up to 15% of the time, including overnight
    trips, to support project sites, client meetings, and team
    events.
  - Valid driver’s license, eligibility to rent from commercial
    vehicle rental agencies, and an MVR that meets Revamp’s
    insurability standards. Driving to job sites and other
    locations is an essential function of this position,
    verified after a conditional offer and periodically
    thereafter.

  Preferred Qualifications

  - Experience delivering utility-scale renewable energy
    projects for EPC contractors.
  - Engineering experience in a relevant discipline before
    moving into project management.
  - Experience at a design-build or engineering and construction
    firm.
  - PMP certification.
  - Experience coordinating multidisciplinary engineering teams
    and subconsultants.
  - Established relationships with stakeholders in the utility-
    scale renewable energy industry.

  Benefits for Full-Time Positions

  - Participation in Revamp’s Employee Ownership ESOP program.
  - Competitive compensation with bonus.
  - Full benefits package offerings including 99% employer-paid
    health, vision, life, and dental insurance.
  - Medical, dependent care, and commuter FSA.
  - Monthly health and wellness stipend.
  - Attractive vacation, sick, and holiday pay.
  - Paid parental leave.
  - 401(k) savings plan with 100% match up to 6%, vested
    immediately.
  - Paid volunteer time off and charitable donation matching.

  About Revamp

  Founded in 2016, Revamp is the premier employee-owned
  engineering design firm dedicated to advancing large-scale
  renewable energy projects. Our team is united by a shared
  commitment to accelerating the global energy transition and
  creating a workplace where talented people can make a
  tangible impact in the fight against climate change.

  As employee-owners, we take pride in building a culture of
  collaboration, innovation, and accountability where every
  individual’s contribution drives both company success and
  personal growth. Revamp engineers have supported the design
  of more than 10% of the utility-scale solar generation
  capacity in the US since 2020, contributing directly to the
  renewable energy transformation.

  So much more than just an engineering firm; we are a
  diverse, international team of artists, singers, dancers,
  pastry chefs, outdoor enthusiasts, animal lovers, travelers
  and problem-solvers who bring curiosity and creativity to
  everything we do. For more information, visit www.revamp-
  eng.com.

