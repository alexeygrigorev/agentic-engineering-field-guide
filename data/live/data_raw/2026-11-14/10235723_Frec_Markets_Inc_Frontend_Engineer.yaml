description: |
  We created Frec to expand the possibilities for everyone and
  their money. We’re a tight team of builders, creators, and
  designers who want to be smarter with our money for our
  futures and our families. As a software engineer at Frec,
  you’ll create products that enable us to level the financial
  playing field and empower people to manage their own money.
  Some values we identify with are accountability, humility,
  compassion, and teamwork. If this resonates with you, join
  us at this pivotal time to help shape our structures,
  systems, and Frec’s future.

  Frec highly values product ideas and feedback from all
  employees, in a true bottoms-up fashion. This means as an
  engineer, you will work with a growing team comprised of
  product managers, designers, and brokerage operations
  professionals to ideate, prioritize, prototype, develop,
  test, and iterate on software that will educate and equip
  people with newer and smarter ways to build wealth. We’re
  looking for engineers who have an unrelenting sense of
  urgency and capability to move fast, have a strong sense of
  ownership, ability to deal with ambiguity and are
  enthusiastic about tackling new challenges to help us build
  a world-class financial platform.

  What you will do:

  - Frontend Engineering: You will be working with a small team
    of experienced engineers and designers, less than 10,
    across all areas of the stack w/ focus on the frontend.
    You will shape how we approach building on web, API layout
    and design, thinking about app development, testing etc.
  - “Full-Stack” Product Development: You will work
    collaboratively on the entire life cycle of the software
    development – from collecting requirements, to iterating
    on design, to implementation, and finally testing and
    operations. You will have the autonomy to drive large
    critical features/products end-to-end like integrating the
    concept of tax optimization into the existing product,
    handling stock transfers etc.
  - Collaborate Collaborate Collaborate: You will partner
    closely with cross-functional partners to build a high
    quality product that you and our customers will love.

  What we offer:

  - Competitive salary and equity grants
  - Fully paid health, vision and dental insurances
  - 401k
  - Monthly allowance to help with maintaining a healthy body
    and mind (fitness & mental health components)
  - Flexible (Unlimited) paid time off
  - Visa sponsorship & immigration support
  - Daily in-office lunch and dinner
  - Office in San Francisco/New York for in-person collaboration
    (close to public transit options)

  Tech stack:

  - TypeScript/Node, Python as the main components of the
    backend
  - PostgreSQL as our data store, with Redis for caching and
    distributed coordination
  - Distributed worker systems powering asynchronous and high-
    throughput tasks
  - Deployed on AWS using containerized infrastructure
  - GraphQL as the mode of building and exposing APIs

  Contact:

  If all of the above resonates with you, reach out to us at
  careers@frec.com and join us for the ride!
