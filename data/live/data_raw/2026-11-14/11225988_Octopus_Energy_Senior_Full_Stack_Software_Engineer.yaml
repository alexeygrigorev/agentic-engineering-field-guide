description: |
  What we do. Electric Car Leasing



  Why we do it. Greener. Fairer. Future.



  We’re looking for a Senior Fullstack Software Engineer
  (Python and React) to join our product and engineering team
  building the systems that power our ability to revolutionize
  the electric car leasing industry.



  Our tech stack is Python with GraphQL, React with Next.js,
  PostgreSQL and noSQL databases, running on AWS.

  What you'll do...

  - Work within a dedicated cross-functional team on key
    products for our customers or our internal teams.
  - Build APIs and integrate with our own and third party
    services to optimise and automate processes.
  - Develop frontend applications to create experiences that wow
    our users.
  - Create performant systems that work consistently across
    modern browsers and devices.
  - Care about the code you write and its future
    maintainability.
  - Contribute ideas, share knowledge, support, mentor, and
    raise the game of those around you.

  What you'll need...

  - Expertise in Python and React.
  - Proficiency working with multiple data sources and designing
    expressive APIs using GraphQL.
  - Experience working with design systems and component
    libraries.
  - Excellent understanding of fundamental coding principles and
    best practices and experience applying these to create
    robust, scalable, maintainable software.
  - Proven experience of collaborating within teams and across
    disciplines.
  - A track record of taking ownership of the development of
    features from inception through to delivery.

  Any of the following would be a bonus

  - Proficiency in TypeScript and Next.js.
  - A working knowledge of AWS and infrastructure as code (IaC)
    practices.
  - Experience with event driven architecture/systems (EDA).
  - Production experience with AI tech and tooling

  Why you'll love it here

  - Don't feel like you meet all of our hiring criteria? Thats
    OK, apply anyway! We'd love to hear from you and have a
    conversation.
  - Octopus Electric Vehicles, part of the Octopus Energy Group,
    won the Sunday Times best company to work for in 2024. We
    were named 6th out of the top 100 start-ups to work for by
    Tempo in 2025 and on Glassdoor we were voted 50 best
    places to work in 2022. Our Group CEO, Greg has recorded a
    podcast about our culture and how we empower our people
  - Wondering what the salary for this role is? Once your in the
    process with one of our recruiters, it's something we
    always cover as we genuinely want to match your experience
    with the correct salary. The reason why we don't advertise
    is because we honestly have a degree of flexibility and
    would never want salary to be a reason why someone doesn't
    apply to Octopus - what's more important to us is finding
    the right octofit!
  - Octopus Energy Group is a unique culture. An organisation
    where people learn, decide, and build quicker. Where
    people work with autonomy, alongside a wide range of
    amazing co-owners, on projects that break new ground. We
    want your hard work to be rewarded with perks you actually
    care about! Visit our perks hub - Octopus Employee
    Benefits

  Things to Note...

  About us



  The electric revolution has arrived - and from 2035 you’ll
  no longer be able to buy a new petrol or diesel car in the
  UK.



  We’re building a whole new way for drivers to join the
  electric charge and not only learn about and shop for their
  EV online, but experience a 'lease for life' through an
  industry changing customer experience. This is the chance to
  join one of the UK’s most exciting start-ups – making it
  easy for individuals and businesses to go electric by
  getting their car, charger and energy all in one cracking
  deal.



  Octopus Electric Vehicles launched in 2018 to make it
  seamless to switch to cleaner, greener driving. Our mission
  is to drive sustainable change, decarbonise the planet and
  provide our customers with fair pricing and a fantastic
  experience.



  We're an Octopus Energy company—an innovative new energy
  supplier. We are part of the Octopus Energy Group, which
  seeks to improve the lives of millions of people by
  transforming the industries we operate in. The Octopus Group
  incorporates Octopus Energy, Octopus Healthcare, Octopus
  Investments, Octopus Property, Octopus Ventures and Octopus
  Labs.



  Are you ready for a career with us? We want to ensure you
  have all the tools and environment you need to unleash your
  potential. Need any specific accommodations? Whether you
  require specific accommodations or have a unique preference,
  let us know, and we'll do what we can to customise your
  interview process for comfort and maximum magic!



  Studies have shown that some groups of people, like women,
  are less likely to apply to a role unless they meet 100% of
  the job requirements. Whoever you are, if you like one of
  our jobs, we encourage you to apply as you might just be the
  candidate we hire. Across Octopus, we're looking for
  genuinely decent people who are honest and empathetic. Our
  people are our strongest asset and the unique skills and
  perspectives people bring to the team are the driving force
  of our success. As an equal opportunity employer, we do not
  discriminate on the basis of any protected attribute. Our
  commitment is to provide equal opportunities, an inclusive
  work environment, and fairness for everyone.
