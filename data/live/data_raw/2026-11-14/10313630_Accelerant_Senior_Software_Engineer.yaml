description: |
  About Accelerant

  Accelerant is a data-driven risk exchange connecting
  underwriters of specialty insurance risk with risk capital
  providers. Accelerant was founded in 2018 by a group of
  longtime insurance industry executives and technology
  experts who shared a vision of rebuilding the way risk is
  exchanged – so that it works better, for everyone. The
  Accelerant risk exchange does business across more than 20
  different countries and 250 specialty products, and we are
  proud that our insurers have been awarded an AM Best A-
  (Excellent) rating. For more information, please visit
  www.accelerant.ai.

  The Opportunity

  We’re looking for exceptional software engineers who enjoy
  solving real customer problems, moving quickly, and taking
  ownership from idea through to production.

  We are building engineering squads for the AI era - teams
  that can move quickly, own outcomes end to end and deliver
  with far greater leverage than traditional software teams.
  Our engineers use AI throughout the development lifecycle to
  generate code, automate testing, accelerate delivery, and
  improve quality, while applying strong engineering judgement
  to everything that ships.

  The engineers who thrive here are adaptable, curious and
  outcome oriented. They use AI as a force multiplier while
  remaining accountable for the quality and impact of what
  ships. Most importantly, they take ownership, learn quickly,
  collaborate closely and enjoy building useful software in a
  fast-moving environment.

  Where You’ll Have Impact

  You’ll help build the core software systems, intelligent
  workflows, and AI-enabled experiences that will make up the
  critical enterprise solutions tech stack and solutions power
  our business.

  What You’ll Do

  - Build and ship custom software, intelligent workflows, and
    AI-enabled product capabilities as part of a cross-
    functional product engineering squad
  - Use AI tools throughout the software development lifecycle
    to accelerate discovery, implementation, testing,
    debugging, and operational excellence
  - Design and implement scalable APIs, services, data flows,
    and modern web applications
  - Contribute to intelligent capabilities such as integrations,
    automation, recommendations, and operational insights
  - Design systems and services that integrate modern AI
    capabilities into real business workflows in reliable,
    secure, and production-ready ways
  - Ship early, learn quickly from users and production, and
    continuously iterate and improve
  - Own the quality, reliability, and performance of what gets
    shipped
  - Contribute to technical decisions and continuously improve
    how we build software
  - Improve reliability, performance, observability, and
    developer experience

  What We’re Looking For

  - Strong software engineering fundamentals and excellent
    engineering judgement
  - Experience building and scaling modern web applications,
    services, or APIs
  - Strength in one area of the stack, with the curiosity and
    ability to contribute more broadly
  - Engineers who take ownership of outcomes, not just tickets,
    tasks, or lines of code
  - A builder mindset: comfortable turning unclear problems into
    working software, iterating quickly, and learning as you
    go
  - Strong problem-solving, communication, and collaboration
    skills
  - Comfort moving quickly while maintaining quality, security,
    and production readiness
  - Curiosity about how AI can improve customer experiences,
    workflows, and software products in practical, production-
    ready ways
  - Excited by building intelligent product experiences powered
    by modern software, data, and AI capabilities
  - A strong interest in using AI not just to assist with
    coding, but to rethink and improve how software is
    designed, built, tested, shipped, and operated
  - A desire to work close to the problem, not just the
    implementation

  Technologies We Use

  React, TypeScript, Node.js, PostgreSQL, Redis, Snowflake,
  AWS, Azure and modern cloud infrastructure. You do not need
  experience with every technology above, but you should be
  comfortable learning quickly and working across a modern
  technology stack.
