description: |
  A Career with Point72's Technology Team

  As Point72 reimagines the future of investing, our
  Technology team is constantly evolving our firm’s IT
  infrastructure and engineering capabilities, positioning us
  at the forefront of a rapidly evolving technology landscape.
  We’re a team of experts who experiment and work to discover
  new ways to harness open-source solutions, modern cloud
  architectures, and sophisticated Artificial Intelligence
  (AI) solutions, while embracing enterprise agile
  methodologies. Our commitment to building and innovating in
  the AI space provides the framework intended to drive
  smarter decision making and enhance how we build and operate
  our platforms and applications.

  As a member of Point72’s Technology team, we encourage and
  support your professional development from day one—helping
  you advance your technical skills, contribute innovative
  ideas, and satisfy your own intellectual curiosity—all while
  delivering real business impact for our multi-billion-dollar
  global business.

  What you'll do

  As a software engineer, you will help build the next
  generation of data infrastructure at the firm—thinking
  holistically about systems across APIs, data models, cloud
  infrastructure, and user experience. As demand for direct
  data access, enriched datasets, and AI-powered workflows
  grows, you will help create a unified, enterprise-grade data
  platform with clear ownership, shared standards, and the
  organizational structure to deliver trusted data at scale.
  Specifically, you will:

  - Build and maintain agentic workflows and tooling that
    leverage large language models
  - Define the service contracts, data models, and integration
    patterns that will serve as future firmwide standards for
    data access
  - Build high-impact, enterprise-grade data services and
    pipelines that support research, trading, and AI projects
    across the firm
  - Ensure backend systems are reliable, observable, and
    performant at scale
  - Containerize services and orchestrate workloads to ensure
    resilient, observable, and scalable deployments together
    with cloud engineers
  - Contribute to CI/CD pipelines, infrastructure as code, and
    deployment automation

  What's required

  - Bachelor’s degree in computer science or a similar
    engineering field
  - 3+ years of professional experience in software engineering
    roles building enterprise-grade systems
  - Strong programming skills in Python and experience with team
    development on business-critical systems
  - Experience with relational databases, including schema
    design and performance tuning
  - Exposure to agentic development in a commercial environment
  - Exposure to cloud development
  - Commitment to the highest ethical standards

  We take care of our people

  We invest in our people, their careers, their health, and
  their well-being. When you work here, we provide:

  - Fully-paid health care benefits
  - Generous parental and family leave policies
  - Volunteer opportunities
  - Support for employee-led affinity groups representing women,
    people of color and the LGBT+ community
  - Mental and physical wellness programs
  - Tuition assistance
  - A 401(k) savings program with an employer match and more

  About Point72

  Point72 is a leading global alternative investment firm led
  by Steven A. Cohen. Building on more than 30 years of
  investing experience, Point72 seeks to deliver superior
  returns for its investors through fundamental and systematic
  investing strategies across asset classes and geographies.
  We aim to attract and retain the industry's brightest talent
  by cultivating an investor-led culture and committing to our
  people's long-term growth. For more information, visit
  https://point72.com/.

  The annual base salary range for this role is
  $200,000-$300,000 (USD) , which does not include
  discretionary bonus compensation or our comprehensive
  benefits package. Actual compensation offered to the
  successful candidate may vary from posted hiring range based
  upon geographic location, work experience, education, and/or
  skill level, among other things.
