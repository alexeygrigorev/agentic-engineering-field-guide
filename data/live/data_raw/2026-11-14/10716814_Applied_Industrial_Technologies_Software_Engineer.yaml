description: |
  Applied Intuition, Inc. is powering the future of physical
  AI. Founded in 2017 and now valued at $15 billion, the
  Silicon Valley company is creating the digital
  infrastructure needed to bring intelligence to every moving
  machine on the planet. Applied Intuition services the
  automotive, defense, trucking, construction, mining and
  agriculture industries in three core areas: tools and
  infrastructure, operating systems, and autonomy. Eighteen of
  the top 20 global automakers, as well as the United States
  military and its allies, trust the company’s solutions to
  deliver physical intelligence. Applied Intuition is
  headquartered in Sunnyvale, California, with offices in
  Washington, D.C.; San Diego; Ft. Walton Beach, Florida; Ann
  Arbor, Michigan; London; Stuttgart; Munich; Stockholm;
  Bangalore; Seoul; and Tokyo. Learn more at applied.co.

  We are an in-office company, and our expectation is that
  full-time employees primarily work from their Applied
  Intuition office 5 days a week. However, we also recognize
  the importance of flexibility and trust our employees to
  manage their schedules responsibly. This may include
  occasional remote work, starting the day with morning
  meetings from home before heading to the office, or leaving
  earlier when needed to accommodate family commitments. This
  in-office expectation does not apply to contractor positions

  Software Engineer UK

  Full-time /London (Engineering)

  About Applied Intuition Defence

  Applied Intuition UK is a software and infrastructure
  supplier that accelerates the deployment of next-generation
  autonomous capabilities to the warfighter across air, land,
  sea, and space. A subsidiary of Applied Intuition, we
  deliver dual-use solutions to national security customers
  that build upon several years of product development and
  experience from commercial autonomy programs. Based in
  London, our seasoned defence team hails from Palantir,
  Anduril, SpaceX, Google, Lockheed Martin, and the UK and US
  Armed Services. Learn more at appliedintuitiondefense.com.

  About the role

  As a software engineer on the UK engineering team, your day-
  to-day activities will vary. Somedays you might find
  yourself in the field, working alongside our forward
  deployment team integrating with customer platforms and
  technologies, other days you might be helping to design a
  brand-new product to satisfy the requirements of various
  different customers and partners that we work with. Every
  day is different, and each day is exciting. You are given
  the opportunity to learn amongst talented engineers and
  build up your skills. You will build, test and deploy your
  software and watch it actually be used.

  At Applied Intuition, you will:

  - Help to design, develop, and optimize high-performance
    libraries, modules, and products, through from incubation
    all the way to production
  - Write, test, and debug efficient modern C++ code for complex
    software solutions with the help of AI tooling
  - Work closely with product managers and customers to
    understand requirements and translate them into technical
    solutions
  - Contribute to build automation, continuous integration, and
    deployment pipelines, as needed
  - Build awesome software that you are proud of

  We’re looking for someone who has:

  - Bachelor’s degree in computer science/related engineering
    field
  - 2+ years of hands-on experience developing performant modern
    C++, or high willingness to learn C++ which is our primary
    programming language for all development
  - Strong procedural and object-oriented programming experience
    that employs clean code principles and good OOP design
    patterns/principles
  - Experience developing in Docker and containerized
    development environments, and using Linux-based operating
    systems

  Travel Requirements:

  - General willingness to travel for company business between
    our offices, as well as to customer sites

  Security Requirements:

  - Must have ability to hold UK Security Clearance (current or
    previous preferred)

  Nice to have:

  - Experience working on distributed systems, with simulation
    technology and autonomy
  - Experience with Bazel, Nix and other similar technologies
  - Experience deploying to, and working with infrastructure
    technologies
  - Experience working projects related to national security for
    one or more government agencies
  - References who will describe them as low-ego, highly
    motivated, thoughtfully opinionated, strong communicators
    and curious listeners

  Don’t meet every single requirement? If you’re excited about
  this role but your past experience doesn’t align perfectly
  with every qualification in the job description, we
  encourage you to apply anyway. You may be just the right
  candidate for this or other roles.

