  customers protect networks, secure nations, and power the
  global economy. The problems we solve are genuinely hard,
  and the work matters.



  Founded in 2016 by the team that built Cleversafe (acquired
  by IBM in 2015), Ocient is headquartered in Chicago with a
  remote-first global team. We are a carbon-neutral company
  backed by leading investors including Greycroft, OCA
  Ventures, In-Q-Tel, and Buoyant Ventures.

  Do not contact Ocient directly to apply for a role. For
  security purposes, any applications received via email will
  be deleted.

  Job Title: Senior Software Engineer

  Location: 100% Remote (US Based Only)

  - We cannot sponsor or transfer any visas, of any kind, at
    this time*

  Hiring Manager: Senior Engineering Manager

  Estimated salary range: $155,000 to $215,000

  - The salary offered for this position will be based on a
    candidate’s experience and skill demonstrated during
    interviews and other evaluations

  Job Description:

  Ocient is hiring a Senior Software Engineer to join the
  Tools & Developer Platform team to own and evolve
  sophisticated test automation and analysis infrastructure
  while contributing broadly to developer experience and
  tooling.

  Responsibilities:

  - Build automation and services (primarily using Python) to
    operate and test the Ocient distributed database system
    and integrations
  - Work closely with internal stakeholders to understand their
    needs and build the tooling to fulfill those needs
  - Maintain and extend existing tooling for performance testing
    and analysis and the automation that keeps tests
    reproducible
  - Produce documentation for future maintainers and concise
    runbooks for developers

  Ideal Qualifications:

  - Demonstrated growth mindset and ability to learn new
    languages and systems rapidly
  - BS, MS or PhD in Computer Science or related field, or
    equivalent industry experience
  - 4+ years professional software engineering experience
  - Strong systems thinking and software fundamentals
  - Comfortable working in Linux, with shell tooling, debugging
    tools, and CI systems
  - Ability to speak and write in English fluently

  An Exceptional Candidate Will Have:

  - Strong familiarity with advanced Python features and typing
  - Data gathering and analysis skills, a scientific mindset is
    a plus
  - Experience operating and/or performance tuning a distributed
    database system
  - Familiarity managing test infrastructure, including
    infrastructure as code tools

  Technical Assessment Notice: Candidates will be required to
  download and install the HackerRank Desktop Application to
  complete coding assessments and technical interviews as part
  of our hiring process.

  Interview Requirements: All interviews are conducted via
  video and require candidates to have their camera on for the
  duration of the session. The use of video filters, face-
  altering effects, or virtual backgrounds is not permitted
  for security and verification purposes.

  We are not open to using an agency or staffing company at
