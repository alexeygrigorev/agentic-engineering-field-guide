description: |
  ABOUT US

  Liberty Global is a world leader in converged broadband,
  video and mobile communications services. We deliver next-
  generation products through advanced fibre and 5G networks
  that connect 85 million subscribers across Europe and the
  United Kingdom. Our businesses operate under some of the
  best-known consumer brands, including Virgin Media-O2 in the
  UK, VodafoneZiggo in The Netherlands, Telenet in Belgium,
  Sunrise UPC in Switzerland, Virgin Media in Ireland and UPC
  in Eastern Europe.

  Our consolidated businesses generate annual revenue of more
  than $7 billion, while our joint ventures in the U.K. and
  the Netherlands generate combined annual revenue of more
  than $17 billion.

  Liberty Global Ventures, our global investment arm, has a
  portfolio of more than 50 companies across content,
  technology and infrastructure, including strategic stakes in
  companies like Plume, ITV, Lions Gate, Univision, the
  Formula E racing series and several regional sports
  networks.

  JOB PURPOSE

  Design, build and evolve the AI-first telecom platforms that
  serve millions of Liberty Global customers across multiple
  countries. As a Full Stack Engineer, you will be one of the
  most technically skilled hands on the platform – writing
  production code, shaping architectural decisions, and
  ensuring the systems we build are scalable, secure and
  genuinely ready for the demands of enterprise-scale
  telecoms.

  You will work closely with the VP Software Engineering and
  the wider platform team to translate architectural direction
  into working software, challenge technical assumptions with
  depth and evidence, and play a significant role in raising
  the engineering bar across the organisation.

  KEY ACCOUNTABILITIES

  Platform Design & Architecture

  - Design and own critical platform components, contributing to
    the overall architecture and ensuring consistency with the
    reference architecture set by the VP Software Engineering.
  - Evaluate and propose solutions to complex technical
    challenges, balancing performance, scalability, security
    and maintainability.
  - Lead architecture reviews and technical design sessions for
    key platform features, bringing depth and rigour to the
    process.
  - Define integration patterns and data flows across platform
    services, ensuring components work together reliably at
    scale.

  Engineering & Delivery

  - Write production-quality code across the full stack – from
    backend services and APIs through to front-end interfaces
    and infrastructure as code.
  - Deliver features and platform capabilities end to end, from
    design through build, test and deployment into production.
  - Contribute to production readiness: documentation, runbooks,
    monitoring and observability – ensuring nothing ships
    until it’s genuinely ready.
  - Maintain and improve existing platform components,
    addressing technical debt and performance issues with
    clear prioritisation.

  Standards & Quality

  - Champion engineering best practices across the team: code
    quality, testing, CI/CD, security, and observability.
  - Conduct thorough code and architecture reviews, providing
    constructive, evidence-based feedback that raises the
    standard.
  - Contribute to and help maintain the engineering standards
    and guardrails established at VP level, making them
    practical and usable day to day.

  Build Partner Engagement

  - Work alongside build partners on platform delivery,
    providing technical direction and reviewing their designs
    and code to the same standard as internal work.
  - Identify and flag risks or gaps in partner delivery early,
    feeding back to the VP Software Engineering with clear,
    actionable recommendations.

  Collaboration & Knowledge Sharing

  - Collaborate closely with AI/ML, DevOps, Infrastructure and
    Product teams to deliver integrated platform capabilities.
  - Share technical knowledge across the engineering
    organisation – through documentation, internal talks, or
    hands-on pairing – building capability and reducing single
    points of failure.

  WHAT SUCCESS LOOKS LIKE (6–12 MONTHS)

  - Key platform components designed, built and running in
    production with strong stability, performance and security
    outcomes.
  - Architecture decisions made with clear technical rationale,
    consistently documented and applied across the platform.
  - Code and design reviews that visibly raise the quality bar –
    the team builds better because of your involvement.
  - Build partner output reviewed and challenged effectively,
    with early identification of risks and clear escalation
    when needed.
  - Engineering standards embedded in day-to-day practice, not
    just documented on a page.

  KNOWLEDGE & EXPERIENCE

  Essential

  - Exp of hands-on full stack engineering experience,
    delivering complex platforms in enterprise environments.
  - Strong proficiency across the full stack – backend (Python,
    Java or equivalent), frontend frameworks, APIs, databases
    and infrastructure as code.
  - Depth in distributed systems design: you understand how to
    build services that scale, fail gracefully and recover
    quickly.
  - Experience working with cloud-native infrastructure (AWS,
    GCP or Azure) and container orchestration (Kubernetes or
    equivalent).
  - Proven ability to translate complex architectural
    requirements into clear, deliverable engineering plans.
  - Strong experience in code and architecture review – giving
    and receiving feedback that improves the work.
  - Comfortable working in fast-paced delivery environments with
    clear prioritisation and a bias for shipping.
  - Experience collaborating with or reviewing the output of SI
    / vendor build partners.

  Preferred

  •  Experience building or contributing to AI/ML platforms –
  particularly integrating LLMs, speech, or multimodal models
  into production systems.

  •  Familiarity with data pipelines, data quality processes
  and the infrastructure that supports AI/ML at scale.

  •  Experience with DevOps, CI/CD pipelines and observability
  tooling.

  •  Exposure to telecom or large-scale consumer-facing
  platforms.

  SKILLS & BEHAVIOURAL COMPETENCIES

  Technical Depth & Judgement

  - Consistently makes sound technical decisions, balancing
    short-term delivery with long-term platform health.
  - Goes deep into complex problems – doesn’t stop at the
    surface, finds the right answer and explains why.

  Quality & Standards

  - Holds themselves and others to a high bar on code quality,
    security and production readiness.
  - Makes engineering standards better by making them practical
    – not just written, but followed.

  Collaboration & Communication

  - Works effectively across teams – engineering, product, build
    partners – and communicates technical decisions clearly.
  - Shares knowledge generously: documentation, pairing, review
    – builds the team up, doesn’t hoard expertise.

  a

  Pragmatism & Delivery

  - Balances doing things right with doing things fast –
    pragmatic about trade-offs, clear about where corners
    cannot be cut.
  - Owns their delivery end to end and takes pride in shipping
    things that work, not just things that are finished.

  PRE-EMPLOYMENT SCREENING

  If your application is successful, your personal data may be
  used for a pre-employment screening check, which will be
  performed by a 3rd party provider (Sterling), on behalf of
  Liberty Global. Depending on the vacancy and applicable law,
  a pre-employment screening may include employment history,
  qualifications, contract information, right to work, and
  other information (such as media information) that may be
  necessary for determining your qualifications and
  suitability for the position.

  You can read more about how we process your data here:
  Privacy & Security Policy – Liberty Global. If you wish to
  exercise your privacy rights please contact:
  Peopleservices@Libertyglobal.com

  Liberty Global is an equal opportunity employer. If you are
  curious and resilient with a limitless mindset, we’re eager
  to hear from you, no matter your background.
