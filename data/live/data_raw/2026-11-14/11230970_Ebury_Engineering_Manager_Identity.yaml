description: |
  Ebury helps ambitious businesses unlock global growth, and
  we take the same approach with our people. We encourage
  innovation and movement, collaboration and problem-solving,
  and foster an environment where everyone can feel they
  belong, are valued, supported and empowered to succeed.

  If you’re a collaborator who wants to help transform how
  businesses operate globally, get in touch - we’d love to
  discuss how Ebury can accelerate your career so you can
  shape the future.

  Engineering Manager (Identity Team)

  London Office - Hybrid: 4 days in the office, 1 day working
  from home

  As an Engineering Manager for the Identity Platform, you
  will lead the team responsible for building high-throughput,
  mission-critical authentication and authorisation controls.
  You will architect and scale platform services that define
  and govern permissions across human, service, and bot
  identities, ensuring a secure, seamless banking-and-payments
  experience across Ebury.

  Why This Role is Different

  - Own Client Outcomes: Take real client problems end-to-end,
    owning experience, APIs, data, and iteration with full
    trust and autonomy.
  - Player-Coach Early, Leader Always: Stay close to code early
    on (pairing, reviewing, shipping) and transition leverage
    into building people and systems as the team grows.
  - Platform-First Thinking: Build scalable, generalisable
    platforms rather than bespoke one-offs. Value retiring
    technical debt and flags as much as shipping features.
  - AI-Native Culture: Fluent in AI tools as force multipliers,
    guiding the team on effective adoption and designing AI
    into the product.

  Key Responsibilities

  - Grow the Team: Coach engineers through actionable feedback,
    clear growth paths, and performance management.
  - Delivery Ownership: Translate ambiguous business outcomes
    into clear roadmaps. Sequence work, manage risk, and
    deliver reliably at a sustainable pace.
  - Technical Leadership: Guide architecture and design reviews
    for high-scale, event-driven transactional systems on AWS
    and BigQuery.
  - Cross-Functional Partnership: Partner closely with Product,
    Design and Business Domains to shape customer solutions
    and influence strategic trade-offs.
  - Operational Health: Ensure production-grade stability,
    humane on-call loads, testing standards, CI/CD, and strong
    observability.
  - Responsible AI Adoption: Integrate AI tools into development
    workflows safely and effectively while maintaining
    complete ownership of shipped code.

  What We're Looking For

  - Engineering Leadership: Proven experience managing and
    developing software engineering teams with a track record
    of mentorship and high delivery standards.
  - Technical Depth: Solid CS foundation with hands-on
    credibility building/operating distributed systems at
    scale (AWS, event-driven architecture, APIs).
  - Hiring Instincts: Ability to define an interview bar, run
    rigorous hiring processes, and close exceptional talent
    from scratch.
  - AI Fluency: Hands-on usage of AI coding tools and strong
    opinions on how teams best leverage AI for productivity
    and product capabilities.
  - Product & Quality Mindset: Focus on client value, pragmatic
    scoping, and high discipline around money-movement systems
    (idempotency, reconciliation).
  - Communication: Fluency in English with exceptional ability
    to articulate complex technical ideas and align cross-
    functional teams.
  - Identity and User Management: Have worked on scalable
    platforms that define and operate authentication and fine
    grained authorisation functions.
  - Nice to Have: Fintech/payments/regulated domain experience,
    experience on early founding hub teams, or web & mobile
    channel exposure.

  What We Offer

  - Competitive Package: Strong base salary, performance-based
    bonus, and comprehensive benefits tailored to a senior
    leadership role.
  - Career Progression: Clear leadership paths, senior
    mentorship, and room to grow across technical and
    organisational domains.
  - Challenging Problems: The opportunity to work on complex,
    intellectually stimulating projects that have a
    significant and measurable business impact.
  - Premium Equipment: High-end MacBook Pro and the required
    tools.
  - Collaborative Culture: An inclusive, high-performing
    environment rewarding technical excellence, decision-
    making, and constructive challenge.

  Required Qualifications

  - Proven experience as an Engineering Manager or in a similar
    leadership role, leading and supporting engineers.
  - Experience working in fintech or within the financial
    services industry.
  - Experience working in a multi-channel, multi-product driven
    environment.
  - Deep understanding of software development methodologies and
    best practices.
  - Experience with agile development processes.
  - Excellent communication, interpersonal, and leadership
    skills.
  - Strong problem-solving and decision-making abilities.
  - Passion for technology and innovation.

  Desirable Attributes

  - Experience building enterprise-level Identity, Access
    Management (IAM) platforms, Fine-Grained Access Control
    (FGAC) systems and defining authorisation policies.
  - Knowledge of advanced authentication techniques, such as
    device binding/attestation, and experience in
    consolidating fragmented user identities into a unified
    identity model.
  - Familiarity with cloud computing platforms (e.g., AWS, GCP,
    Azure) and containerisation technologies (e.g., Docker,
    Kubernetes).
  - Contributions to open-source projects or a personal
    portfolio demonstrating technical curiosity and skill.
  - Experience with Domain-Driven Design (DDD) and standardising
    communication patterns in a centralised architecture.

