  About us

  Ebury delivers sophisticated, integrated solutions —
  business accounts, hedging, and financing — on a single
  platform with a seamless workflow. Our success is built on a
  simple premise and singular purpose: To help businesses
  operate and scale globally.

  Since its founding in 2009, Ebury has always been a fast-
  growing leader in fintech. Today, we bring together 2000+
  Eburians across nearly 70 cities and we’re always looking to
  add to our team.

  At the heart of our offering is a proprietary platform,
  purpose-built to help businesses seamlessly streamline and
  manage global cash flow. We focus on continuous product
  evolution and innovation to build the infrastructure for
  borderless growth and help our clients scale at every stage.

  The opportunities at Ebury are as diverse as our people,
  ranging from business development to engineering roles
  across our tech pillars.

  We believe in inclusion. We stand against discrimination in
  all forms and are against the intolerance of differences
  that makes us a modern and successful organisation. At
  Ebury, you can be whoever you want to be and still feel a
  sense of belonging no matter your story.

