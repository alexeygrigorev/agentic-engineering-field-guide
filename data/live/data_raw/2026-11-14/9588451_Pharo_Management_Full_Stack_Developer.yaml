description: |
  Full Stack Developer

  Who we are:

  Pharo Management is a leading global macro hedge fund with a
  focus on emerging markets. Founded in 2000, the firm has
  offices in London, New York, Hong Kong and Abu Dhabi, and
  currently manages $9 billion in assets across five funds.
  Pharo trades foreign exchange, sovereign and corporate
  credit, local market interest rates, commodities, and their
  derivatives. We trade in over 70 countries across Asia,
  Central and Eastern Europe, the Middle East and Africa,
  Latin America as well as developed markets. Our investment
  approach combines macroeconomic fundamental research and
  quantitative analysis.

  Pharo employs a diverse, dynamic team of 140 professionals
  representing over 20 nationalities and 30 languages. We have
  a strong corporate culture anchored in core values such as
  collaborative spirit, creativity, and respect. We are
  passionate about what we do and are committed to attracting
  the best and brightest talent.

  This is a great opportunity to join a market leader and
  contribute to our continued success.

  Job description:

  We are seeking a highly skilled Full Stack Developer with
  exceptional UX/UI design capabilities to build next-
  generation front office technology tools for web and mobile
  platforms. You will work as part of Development team,
  contributing to the architecture and design of applications
  while focusing on delivering high-quality, performant, and
  visually compelling solutions. This role for a UI/UX-focused
  engineer who enjoys solving complex problems through clean,
  user-friendly designs and is comfortable working across the
  full stack. While financial markets experience is a plus, it
  is not required — what matters most is your ability to
  deliver beautiful, functional, and efficient applications.

  Responsibilities:

  Application Design & Development

  - Participate in application architecture and technical design
    discussions.
  - Develop React-based web applications with responsive,
    mobile-ready design.
  - Translate complex workflows into intuitive and performant
    UI/UX.
  - Build reusable, modular, and maintainable front-end
    components.
  - Integrate front-end applications with back-end services in
    .NET and Python.

  Full Stack Development

  - Contribute to server-side development in .NET 6+ (C#) and
    Python.
  - Work with SQL Server for relational data and Redis for high-
    speed caching.
  - Implement authentication and authorization (OAuth 2.0,
    OpenID Connect, JWT).
  - Develop and integrate REST APIs.
  - Support deployment and scaling on cloud platforms (Azure,
    AWS, or GCP).
  - Contribute to automated testing, CI/CD pipelines, and
    monitoring.

  Required qualities and skills:

  - Between 7+ years’ UX/UI experience.

  Frontend Expertise

  - Proficiency in React (hooks, context, state management such
    as Redux/Zustand/Recoil).
  - Strong TypeScript skills. Expertise in styling frameworks
  - Experience with responsive design, accessibility, and cross-
    platform compatibility.
  - A UI/UX portfolio showcasing data-rich, complex
    applications.

  Backend & API

  - Experience with .NET 6+ (C#) and Python, SQL (SQL Server)
  - Strong REST API experience.
  - Experience with Redis for caching.

  - Deployment and management experience with Azure / AWS.
  - CI/CD pipelines using Azure DevOps, GitHub Actions, or
    similar.

  - Familiarity with Docker (Kubernetes is a plus).

  Finance services

  - Familiarity with financial services or trading systems is
    preferred but not required.

  Work status and location:

  - Full time in New York.

  Pay range in New York:

  - Base salary - $175,000-$200,000/year.
