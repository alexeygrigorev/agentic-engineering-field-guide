description: |
  In the Technology division, we leverage innovation to build
  the connections and capabilities that power our Firm,
  enabling our clients and colleagues to redefine markets and
  shape the future of our communities.

  This is a Software Engineering position at the Director
  level, which is part of the job family responsible for
  developing and maintaining software solutions that support
  business needs.

  Morgan Stanley is an industry leader in financial services,
  known for mobilizing capital to help governments,
  corporations, institutions, and individuals around the world
  achieve their financial goals.

  Interested in joining a team that’s eager to create,
  innovate and make an impact on the world? Read on.

  PRIME BROKERAGE AND SECURITIES FINANCING TECHNOLOGY

  We provide the technology that supports core Prime Brokerage
  functions—including custody, client service, reporting,
  capital introduction, sales and finance—as well as the
  trading and post-trade processing of Securities Finance
  Transactions (SFTs), collateral posting and collateral
  optimization. The team develops applications supporting
  trade capture and enrichment, lifecycle and position
  management, exposure management, analytics and operational
  processing.

  What you’ll do in the role:

  - We are looking for a Full Stack Developer to join the Prime
    Brokerage and Securities Financing Technology department.
    The role is part of a global team with members in New
    York, London, Tokyo and Bengaluru, supporting clients in
    North America.
  - The development team builds and maintains applications using
    Scala, Java, and Angular in an agile environment. The
    successful candidate will contribute across the software
    development lifecycle, working closely with fellow
    developers, colleagues in related technology groups and
    business users.
  - The ideal candidate will have hands-on programming
    experience with AI tools such as Claude Code, Codex, Amp,
    or Copilot. They will also possess strong analytical and
    communication skills, and an interest in learning about
    the financial services industry. They will work with
    business users, including trading and operations teams, to
    understand requirements and translate them into reliable
    technology solutions.
  - Responsibilities include developing, testing and supporting
    system changes from design through production deployment;
    contributing to technical analysis and solution design;
    troubleshooting issues; and applying test-driven
    development and engineering best practices to improve
    scalability, stability and maintainability.
  - The candidate should be self-motivated, results-oriented and
    able to manage work across multiple applications and
    teams. They should be comfortable collaborating with
    geographically distributed colleagues and communicating
    progress, risks and technical decisions clearly.

  What you’ll bring to the role:

  - 5+ years of software development experience, including
    delivery of server-side applications using JVM languages.
  - Hands-on experience with JVM-based languages, including
    multithreaded programming.
  - Understanding of modern software development principles,
    including object-oriented design, automated testing, high-
    availability systems and production support.
  - Experience with test frameworks such as JUnit, Cucumber as
    well as test-driven development practices.
  - Knowledge of relational databases and SQL; experience with
    platforms such as DB2 or Sybase is beneficial.
  - Knowledge of non-relational databases and their query
    mechanisms; experience with MongoDB is beneficial.
  - Working knowledge of Git or Bitbucket, Jenkins, and Unix or
    Linux environments.
  - Experience working in an agile delivery environment across
    the full software development lifecycle.
  - Strong written and verbal communication skills, with the
    ability to build effective relationships with business
    users and global technology teams.
  - Proven ability to deliver high-quality software and to build
    an understanding of the business domain.
  - Experience with AI-assisted development tools such as Claude
    Code, Amp, Codex, or Copilot.

  Desired Skills:

  - Experience with Scala, Angular, C# or C++.

  - Familiarity with event-driven, real-time or distributed
    systems.

  - Exposure to functional programming concepts.

  - Knowledge of repo, securities lending, derivatives margin,
    central counterparty clearing or collateral management.

  - A collaborative, client-focused approach and the ability to
    work independently when appropriate.

  This role offers the opportunity to:

  Extend your technical knowledge with challenging projects
  and the use of new technologies. Enjoy access to experts in
  the wide range of technologies at Morgan Stanley

  Work in an open environment where everyone can express their
  views and make significant contributions.

  WHAT YOU CAN EXPECT FROM MORGAN STANLEY:

   At Morgan Stanley, we raise, manage and allocate capital
  for our clients – helping them reach their goals. We do it
  in a way that’s differentiated – and we’ve done that for 90
  years.  Our values - putting clients first, doing the right
  thing, leading with exceptional ideas, committing to
  diversity and inclusion, and giving back - aren’t just
  beliefs, they guide the decisions we make every day to do
  what's best for our clients, communities and more than
  80,000 employees in 1,200 offices across 42 countries. At
  Morgan Stanley, you’ll find an opportunity to work alongside
  the best and the brightest, in an environment where you are
  supported and empowered. Our teams are relentless
  collaborators and creative thinkers, fueled by their diverse
  backgrounds and experiences. We are proud to support our
  employees and their families at every point along their
  work-life journey, offering some of the most attractive and
  comprehensive employee benefits and perks in the industry.
  There’s also ample opportunity to move about the business
  for those who show passion and grit in their work.

  To learn more about our offices across the globe, please
  copy and paste https://www.morganstanley.com/about-
  us/global-offices into your browser.

  Expected base pay rates for the role will be between
  $120,000 and $170,000 per year at the commencement of
  employment. However, base pay if hired will be determined on
  an individualized basis and is only part of the total
  compensation package, which, depending on the position, may
  also include commission earnings, incentive compensation,
  discretionary bonuses, other short and long-term incentive
  packages, and other Morgan Stanley sponsored benefit
  programs.

  Morgan Stanley is an equal opportunity employer committed to
  building and maintaining a workforce that is diverse in
  experience and background.  Our recruiting efforts reflect
  our strong commitment to a culture of inclusion, where
  individuals are hired, developed, and advanced based on
  their skills and talents.

  Our workforce reflects a broad cross-section of the global
  communities in which we operate, bringing a variety of
  backgrounds, talents, perspectives, and experiences.

  For more information, please visit:
  https://www.morganstanley.com/people-opportunities/eeo.
