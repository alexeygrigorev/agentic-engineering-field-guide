description: |
  At TriEdge Investments, we build technology that helps real
  businesses operate better. Working across a portfolio of 30+
  companies and select partners, we embed with operators to
  design and ship automation that moves the numbers, including
  throughput, cost, and reliability. Over time, we turn those
  hard-won solutions into platform tools that scale across
  companies, building an intelligent system that brings modern
  automation to businesses typically overlooked by traditional
  software. As a Senior Software Engineer, you will operate as
  a senior technical leader embedded with operators and
  clients, owning complex problem spaces from discovery
  through production. Rather than executing against predefined
  specs, you will identify the highest-leverage opportunities,
  shape requirements in partnership with users and executives,
  and define system architectures that can be scaled and
  reused across the portfolio. You will remain hands-on in
  code while setting technical direction, ensuring solutions
  are durable, secure, and aligned with long-term business
  outcomes.

  What You’ll Do

  - Lead deep technical discovery with operators and clients,
    diagnosing workflows, systemic pain points, and high-
    leverage automation opportunities across engagements
  - Own architecture and delivery of end-to-end systems spanning
    web, cloud, data, and AI infrastructure, with an eye
    toward reuse and long-term scalability
  - Define and build robust APIs, agentic workflows, and AI/ML-
    driven systems, setting standards for how intelligent
    automation is designed and deployed
  - Rapidly prototype, develop, validate, and harden solutions
    in live client environments, balancing speed with
    production-grade reliability and adoption
  - Set technical direction for performance, scalability,
    security, and resilience, proactively identifying risks
    and addressing them before they impact customers
  - Lead cross-functional technical alignment with product,
    data, and operators to ensure solutions map directly to
    business outcomes and portfolio strategy
  - Own production excellence in client deployments, driving
    root-cause analysis, durable fixes, and systemic
    improvements rather than one-off patches
  - Serve as a senior technical authority and trusted advisor to
    executives and operators while remaining deeply hands-on
    in code and system design

  About You

  - 5+ years of full-stack software engineering experience, with
    demonstrated Staff-level impact in production environments
  - Proven experience in leveraging AI development stack to
    develop enterprise grade applications from end to end,
    such as Claude code, custom mcp, skills, backend-as-a-
    service.
  - Proven track record of owning ambiguous, high-stakes problem
    spaces end to end, including direct delivery in client- or
    operator-facing contexts
  - Broad technical depth across the stack (e.g., Python,
    React/Next.js, SQL/NoSQL, cloud infrastructure), with the
    judgment to choose appropriate tools and architectures
  - Strong API and systems design expertise, including defining
    interfaces and patterns that scale beyond a single team or
    deployment
  - Hands-on experience integrating AI/ML into production
    systems, with an understanding of tradeoffs across
    performance, cost, reliability, and compliance
  - Exceptional communicator, capable of influencing engineers,
    operators, and executives through clear technical
    reasoning and written design artifacts
  - Pragmatic technical leader with a strong bias toward
    ownership, accountability, and forward-deployed execution
  - Effective operating in complex environments, including
    legacy systems, heterogeneous stacks, and regulated or
    compliance-driven domains
  - Fluent in AI-assisted development, using modern tooling to
    increase leverage while maintaining high standards for
    code quality and system integrity
  - Bachelor’s degree minimum

  Why Join TriEdge Investments

  - Play a key role in reshaping private equity with AI-powered
    platforms that scale
  - Help digitize and transform real businesses, not just build
    another SaaS product
  - Be at the forefront of AI and automation across financial
    services and healthcare
  - Work closely with operators and executives to deliver
    solutions that matter
  - Join a culture that values clarity, speed, reuse, humility,
    and ownership

  Location

  TriEdge Investments is headquartered in New York's Hudson
  Yards. We've designed our workplace to foster the
  collaboration and spontaneous interactions that drive
  innovation. Our team works in-office, with flexibility to
  work remotely when needed.

  What We Offer

  Pay Transparency The annual base salary range for this
  position is $200,000 – $250,000. Actual compensation offered
  may vary from the posted hiring range based on experience
  and skill level, among other factors. This role is also
  eligible for a discretionary fund performance bonus.

  Benefits

  - $0 deductible and 100% employee-covered health, vision, and
    dental insurance
  - 401(k) matching program of 50% up to 6% of annual salary
  - Unlimited PTO
  - Beautiful custom-built office in NYC with daily lunch

  Please note: We are proud to be an equal opportunity
  employer, and we are committed to diversity and inclusion.
  All qualified applicants will receive consideration for
  employment without regard to race, color, religion,
  ethnicity, sex, age, national origin, citizenship status,
  disability, marital status, partnership status, sexual
  orientation, gender identity and expression, military or
  veteran status, or any other characteristic protected by
  federal, state or local law.
