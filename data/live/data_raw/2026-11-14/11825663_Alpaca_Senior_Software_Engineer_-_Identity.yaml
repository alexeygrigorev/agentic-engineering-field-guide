description: |
  Who We Are:

  Alpaca is a US-headquartered, global leader in agent-first
  brokerage infrastructure for stocks, ETFs, options, crypto,
  fixed income, 24/5 trading, and more. Amongst our
  subsidiaries, Alpaca is a licensed financial services
  company, serving hundreds of financial institutions across
  40 countries with our institutional-grade APIs. This
  includes broker-dealers, investment advisors, wealth
  managers, hedge funds, and crypto exchanges, totalling over
  10 million brokerage accounts. Our global team is a diverse
  group of experienced engineers, traders, and brokerage
  professionals who are working to achieve our mission of
  opening financial services to everyone on the planet. We're
  deeply committed to open-source contributions and fostering
  a vibrant community, continuously enhancing our award-
  winning, developer-friendly API and the robust
  infrastructure behind it. Alpaca is proudly backed by $400
  million in funding from top-tier global investors including
  Portage Ventures, Spark Capital, Tribe Capital, Social
  Leverage, Horizons Ventures, Opera Tech Ventures, SBI Group,
  Derayah Financial, Unbound, Peak XV, Elefund, and Y
  Combinator. Our Team Members:

  We're a dynamic team of 400+ globally distributed members
  who thrive working from our favorite places around the
  world, with teammates spanning the USA, Canada, Japan,
  Hungary, Nigeria, Brazil, the UK, and beyond! We're
  searching for passionate individuals eager to contribute to
  Alpaca's rapid growth. If you align with our core
  values—Stay Curious, Have Empathy, and Be Accountable—and
  are ready to make a significant impact, we encourage you to
  apply.

  Your Role:

  As a senior software engineer, you will help build and scale
  the systems and services that form Alpaca's foundation and
  empower millions of users who trade billions of dollars
  worth of assets.

  The identity team is responsible for building a modern
  platform for onboarding users, verifying their identity,
  evaluating risk, and managing their trading accounts. These
  people, businesses, and accounts are foundational components
  of the Alpaca system, and we need to build new capabilities
  while achieving very high automation rates. We are expanding
  the platform to handle identity verification on a global
  basis and to support our growing set of account types.

  We are looking for senior engineers who are keen on
  providing quality solutions, have great fundamentals, have
  proven experience building and architecting at scale, and
  are not afraid of challenging conventions or voicing their
  opinions. In this role, you will have the autonomy to design
  and implement solutions to achieve defined goals while
  actively participating in defining those goals. An
  understanding of cloud-based modern architecture,
  infrastructure, and orchestration practices is also a great
  asset we are actively looking for.

  Things You Get To Do:

  Contribute to a core system that millions of end users will
  rely onHelp us create a global financial identity
  verification and risk management serviceImplement backend
  services and work on designing an architecture where
  reliability mattersTake ownership of tasks, identify and
  address technical challenges proactively, and propose
  innovative solutionsContribute to architectural decisions,
  offering insights and suggestions for designing scalable and
  reliable systemsWork with other teams to improve how our
  systems interact with theirs and improve Alpaca systems in
  generalMaintain good software quality and test
  coverageParticipate in code reviewsTroubleshooting on
  incidents and reported bugsYou may be asked to be on-call to
  assist with engineering projects that are timely in nature

  Who You Are (Must-Haves):

  Strong problem-solving skills paired with a proactive
  mindsetAbility to turn business requirements into a flexible
  implementation modelExcellent communication and
  collaboration skillsAbility to work independently and as
  part of a teamA preference for simple and elegant
  solutionsAt least 3 years of experience working on systems
  at scaleProven experience in building and maintaining
  microservicesStrong coding skills, preferably in GoAbility
  to write clean, well-tested, and maintainable codeExperience
  with domain-driven design and event-driven designAbility to
  debug issues or, better yet, foresee problems and avoid them
  entirelyFamiliarity with containerization and orchestration
