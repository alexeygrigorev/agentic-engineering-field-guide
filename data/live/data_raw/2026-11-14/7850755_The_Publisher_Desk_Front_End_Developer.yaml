description: |
  The Publisher Desk helps you build your audience and grow
  your revenue.

  Empowering sports, lifestyle & business media brands to
  connect with their audience and value-aligned advertisers.

  The Publisher Desk is seeking an experienced, motivated and
  resourceful Front End Developer to join our team.  Help us
  to build efficient, beautiful and responsive media/news
  focused websites.

  Responsibilities:

  Code new WordPress themes, page templates, and plugins from
  scratch and modify existing themes and plugins

  Build efficient, testable, and reusable php modules
  including dynamic content and personalization features

  Provide front-end development of digital marketing
  communications, including full websites and micro-sites,
  landing pages, emails, and other initiatives

  Develop, test and troubleshoot across multiple browsers,
  platforms and devices, including tablets and smartphones, to
  support a consistent and positive customer experience

  Provide guidance on SEO best practices for site development

  Research and recommend new technologies and tools for
  effective integration across various platforms

  Additionally, you must understand user experience and be
  able to build media websites that are easy to understand,
  navigate, use, and adhere to design standards and
  specifications.

  You should be be able to design layouts for mobile, tablet,
  and desktop devices.

  Create wireframes or mockups for web pages and applications.

  Establishing design guidelines, standards, and best
  practices.

  We are always exploring new and innovative projects & ideas,
  giving you a great place to grow your career.

  Requirements:

  5 years of experience as a web developer

  Strong working knowledge of the Wordpress Gutenberg editor,
  especially the creation and maintenance of custom blocks for
  unique site needs.

  Experience creating and integrating custom wordpress
  plugins, themes, working with Wordpress hooks and filters

  Experience creating websites for a mobile-first strategy

  Strong knowledge of PHP web frameworks

  Strong knowledge of common PHP or web server exploits and
  their solutions

  Experience with limitations of PHP as a platform and its
  workarounds

  Knowledge of HTML5, CSS3, Sass, JavaScript, jQuery, and
  responsive frameworks (Foundation, Bootstrap)

  Experience with online usability, accessibility, and web
  analytics

  Experience with development languages (Java or Python)

  Experience integrating or working with ad serving
  technologies (prebid, DFPP)

  Experience with software versioning and revision control
  systems (Git required)

  WordPress experience

  Good understanding of search engine optimization and core
  web vitals principles.

  Proficient understanding of cross-browser compatibility
  issues.

  Creative and open to new ideas.

  Excellent communication skills.
