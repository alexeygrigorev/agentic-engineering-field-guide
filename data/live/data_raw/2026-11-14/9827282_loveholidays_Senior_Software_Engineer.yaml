description: |
  Why Engineering @loveholidays?

  At loveholidays - we trailblaze together. We’re on a mission
  to open the world to everyone, giving our customers’
  unlimited choice, unmatched ease and unmissable value for
  their next getaway. Our team is the driving force behind our
  role as our customers’ personal holiday expert - the smart
  way to get away.

  Technology at loveholidays underpins our vision to become
  the most loved OTA in Europe. We drive cutting-edge
  innovation and technical excellence to futureproof the
  business. Our systems process trillions of daily holiday
  offers, we deploy over a thousand times a month, serving
  thousands of requests per second. This is where you can
  accelerate your growth by solving complex challenges and
  broadening your skillset.

  Join us to create impact for our future in an exciting new
  chapter, owning your success and contributing to shared
  goals. We actively talk about technology and adhere to our
  key technology principles that have guided us this far. We
  are growing and have ambitious plans to expand across
  Europe, employing the best minds and technology to let us do
  this.

  The impact you’ll have:

  Senior Software Engineers at loveholidays have strong
  expertise in:

  - Supplier integration systems that process vast amounts of
    data
  - Industry leading bespoke, high performance search and
    recommendation systems
  - Sophisticated real time pricing systems
  - Complex domain modelling and implementation of booking
    payment, fulfilment and management systems
  - AI-powered solutions to assist customers pre and post
    booking
  - Best in class, modern user experience through web and mobile
    applications

  For a better understanding of our work, refer to some of our
  blog posts.

  Or our open source contributions:

  - github.com/loveholidays/ripley
  - github.com/loveholidays/eval-kit
  - github.com/loveholidays/po-test

  As part of our tech culture we continuously improve our time
  to delivery, reducing errors and generally leaving things
  better than you found them.

  Your day-to-day:

  - Adoption of our engineering principles
  - Building and running services at scale in the cloud
  - Collaborating with engineers, designers, product managers
    within and outside of the team
  - Implementing maintainable and well-tested solutions
    iteratively, keeping business impact and observability as
    a primary focus
  - Understanding the wider context of the business and
    designing system architectures that meet short and long
    term business goals

  Your skillset:

  - Algorithms, data structures
  - Observability
  - Web services, REST, HTTP
  - Containers, cloud
  - Testing, reliability, monitoring
  - Strong knowledge in building and owning application end-to-
    end, from inception to maintenance, to retirement
  - Designing systems that scale
  - Expertise in some of our main programming languages -
    TypeScript, Java, Golang, Rust, Python

  Desirable

  - Experience with Kubernetes, Prometheus, Terraform, NoSQL or
    GCP

  Perks of joining us:

  - Company pension contributions at 5%
  - Individualised training budget for you to learn on the job
    and level yourself up
  - Discounted holidays for you, your family and friends
  - 25 days of holidays per annum (plus 8 public holidays)
    increases by 1 day for every second year of service, up to
    a maximum 30 days per annum
  - Ability to buy and sell annual leave
  - Cycle to work scheme, season ticket loan and eye care
    vouchers

  The interview journey:

  - TA screening - 30 mins
  - 1st Stage - Introduction - 45 mins
  - Coding challenge - take home test or live pairing
  - 2nd Stage - 3 hours

  At loveholidays, we focus on developing an inclusive culture
  and environment that encourages personal growth and
  collective success. Each individual offers unique
  perspectives and ideas that increase the diversity and
  effectiveness of our teams. And we value the insight and
  potential you could bring on our continued journey.
