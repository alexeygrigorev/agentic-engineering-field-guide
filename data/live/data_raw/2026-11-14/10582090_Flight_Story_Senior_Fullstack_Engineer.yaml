description: |
  SENIOR FULLSTACK ENGINEER COMPANY : STEVEN.COMREPORTING TO :
  VP of ENGINEERINGLOCATION: LONDONABOUT STEVEN.COM

  Steven.com is building the operating system for the creator
  economy, forecast to pass a trillion dollars by the early
  2030's. This industry is currently held back by fragmented
  tools and a lack of professional infrastructure. Steven.com
  is the unlock. We are the end-to-end Operating System
  designed to scale what is irreplaceably human.

  We have built proprietary technology and obsessed teams to
  identify and scale the highest-potential creators across our
  core pillars:

  - Creator Media: Amplifying reach, influence, and trust
  - Creator Community: Transforming audiences into connected
    tribes
  - Creator Products: Providing creators with the infrastructure
    to build and back aligned products and ventures
  - Powered by Creator Tech & Intelligence: A proprietary data
    and technology suite that fuels smarter decisions and
    drives innovation across the entire flywheel.

  Powering all of it is Steven.com's Innovation and Technology
  Organisation (ITO). We are building proprietary AI
  infrastructure, developing consumer and enterprise digital
  products, and creating the data and intelligence layer that
  drives smarter decisions across the business. Each pillar
  feeds the next. The result is a flywheel that compounds over
  time and bets on human creation at its core.

  ROLE MISSION

  Join Steven.com's ITO to build products and systems from
  zero to production across the full stack. You'll move
  between existing products, beta products scaling up, and
  outright moonshots, defining ambiguous problems and turning
  them into scalable technical solutions without waiting for a
  spec.

  KEY OUTCOMES

  - Build products and systems from scratch, end to end, across
    frontend, backend, and infrastructure
  - Ship features with real attention to user experience,
    performance, and reliability
  - Lead major technical decisions in your domain, making
    principled speed-vs-quality tradeoffs
  - Prototype fast, run experiments, and iterate on user
    feedback and product signals
  - Integrate AI/ML tools, LLM-based systems, and intelligent
    APIs into core product experiences
  - Own systems in production: debugging, performance tuning,
    reliability
  - Work directly with the CITO, VP of Engineering, and Product
    on features, strategy, and roadmap

  CORE COMPETENCIES

  - Proficient in modern full-stack development: TypeScript,
    React, Node.js, Python, JavaScript
  - Experience with Google Cloud or other cloud infrastructure:
    provisioning, scaling, cost management
  - Can design scalable abstractions, distributed systems, and
    resilient infrastructure
  - Solid grasp of databases (SQL and NoSQL), APIs, and data
    modelling
  - Hands-on experience with AI/ML systems or LLM-based
    application development
  - Genuinely comfortable working end to end across the stack

  YOU'LL THRIVE HERE IF

  - You take ownership of outcomes, not just tasks
  - You have a bias toward action and ship without waiting for
    perfect information
  - Ambiguity and shifting priorities energise you rather than
    intimidate you
  - You're a pragmatic decision-maker who balances speed and
    scalability consciously
  - You think like a mini-founder: you define the problem rather
    than wait to be handed one
  - You switch comfortably between leading and executing,
    whatever the moment needs

  IDEAL BACKGROUND

  - Track record shipping full-stack products in a small, high-
    velocity, early-stage environment
  - Comfortable owning full systems: databases, APIs, UI, and
    infrastructure
  - Real hands-on experience applying AI/ML or LLMs inside a
    production product, not just experimenting with them
  - We weight demonstrated project work and portfolio over
    titles or years of experience
