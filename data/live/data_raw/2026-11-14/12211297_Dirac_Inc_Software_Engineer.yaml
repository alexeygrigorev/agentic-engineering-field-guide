description: |
  About the Company

  Dirac is building the creative suite for manufacturing
  engineering. Manufacturing engineering has been underserved
  by fractured tooling. The work of defining how a product
  gets built is spread across process plans, MBOMs, routings,
  work instructions, spreadsheets, PLM configurations, ERP
  tables, and internal tools. Each artifact represents only
  part of the process, forcing engineers to rebuild context
  whenever a design changes.

  BuildOS brings these workflows together in one environment.
  Manufacturing engineers author, version, review, and
  distribute the Build—the canonical definition of how a
  product is produced.

  About the Role

  Our customers build aircraft, spacecraft, defense systems,
  ships, energy equipment, and heavy machinery. You'll own
  features end to end, from the services underneath to the
  tools manufacturing engineers use every day. The work spans
  backend, frontend, and 3D, and most of it starts with a real
  customer problem.

  We want engineers who take a problem from vague to shipped,
  find the root cause before the fix, and use AI tools well
  while owning the result.

  What You'll Work On

  Depending on your strengths, you might work on:

  - Turning CAD models into structured, versioned manufacturing
    data
  - An authoring experience manufacturing engineers live in all
    day
  - Interactive 3D in the browser for assemblies with thousands
    of parts
  - AI that drafts work instructions and helps engineers plan a
    build
  - Integrations with the enterprise systems manufacturers
    already run
  - Secure deployments for aerospace and defense customers

  Our Stack

  Go, TypeScript and React, Rust and WebAssembly, Python and
  C++, on AWS and Azure. You don't need experience with all of
  it.

  Requirements

  - Strong in Go or TypeScript, and willing to work in the
    other; able to read Rust, Python, or C++ when a bug leads
    there
  - Experience building backend services with typed APIs
    (protobuf/gRPC or similar) on top of a relational database
  - Experience building non-trivial React frontends with real
    state management
  - You debug from evidence: logs, a reproduction, and the root
    cause before the fix
  - You check your own work in the running app, not just in
    passing tests
  - You use AI coding agents every day and review their output
    as hard as a colleague's
  - Clear, concise writing in design notes, PR descriptions, and
    tickets
  - You've built something, at work or not, and can explain it
    in conversation

  Nice to Have

  - CAD, 3D graphics, or computational geometry
  - Rust, WebAssembly, or GPU programming
  - Integrations with enterprise systems such as PLM, ERP, or
    MES
  - Shipping LLM-based features to production
  - Cloud infrastructure and Kubernetes
  - Security or compliance work in regulated industries
  - A background in manufacturing, aerospace, or defense

  How We Work

  - Own it end to end. You take work from the first customer
    conversation to proof that it works in the product.
  - Learn the user. You'll work with the manufacturing engineers
    who use what you build, and sometimes spend time on their
    factory floors.
  - High trust, high agency. If something needs doing, you do
    it.
  - AI-native. We build with AI tools every day and hold their
    output to the same bar as our own.
  - Fix it once. When we catch a mistake, we fix it and make
    sure it can't happen again.

  Compensation

  Base: $120,000 - $200,000 + Equity

  Location

  Fully in person at our NYC office in the Empire State
  Building (350 5th Ave). Relocation assistance is available.

  New York Pay Range

  $120,000—$200,000 USD

  Equal Opportunity Employer

  Dirac is an Equal Opportunity Employer; employment with
  Dirac is governed on the basis of merit, competence and
  qualifications and will not be influenced in any manner by
  race, color, religion, gender, national origin/ethnicity,
  veteran status, disability status, age, sexual orientation,
  gender identity, marital status, mental or physical
  disability or any other legally protected status.

  Eligibility

  Employment is restricted to U.S. Persons as defined by ITAR
  (22 CFR § 120.62)

  Benefits:

  - Health, Dental, Vision Insurance: Comprehensive coverage to
    ensure you and your family stay healthy.
  - Generous Paid Time Off: Enjoy flexible, high-trust PTO and
    sick leave.
  - Stock Options: Participate in our success with a generous
    stock option plan.
  - Commuter Benefits (NYC): Save on transportation costs with
    our commuter benefits program.
