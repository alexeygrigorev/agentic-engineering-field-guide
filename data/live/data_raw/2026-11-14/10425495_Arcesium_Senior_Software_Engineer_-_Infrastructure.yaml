description: |
  Company Overview

  Arcesium is a global financial technology firm that solves
  complex data-driven challenges faced by some of the world’s
  most sophisticated financial institutions. We constantly
  innovate our platform and capabilities to meet tomorrow’s
  challenges, anticipate the risks our clients encounter, and
  design advanced solutions to help our clients achieve
  transformational business outcomes.

  Financial technology is a high-growth industry as change and
  innovation continue to disrupt the status-quo and prompt
  major transformation. Arcesium is at a particularly
  interesting time in our own growth as we look to leverage
  our successfully established market position and expand
  operations in pursuit of strategic new business
  opportunities. We value intellectual curiosity, proactive
  ownership, and collaboration with colleagues, and we empower
  you to meaningfully contribute from day one and accelerate
  your professional development.

  Position Summary

  Arcesium seeks an accomplished Senior Software Engineer to
  join our Infrastructure Engineering organization, the team
  that builds and operates the core foundation Arcesium's
  applications run on. You’ll bring a deep commitment to
  reliability, scalability, and performance — and
  Infrastructure is where that commitment carries the
  furthest: a change made once, at the foundation, takes
  effect across the entire engineering organization.

  In this role you'll work across multiple functional areas
  within Infrastructure — including Developer Experience (AI,
  Observability, SDLC), Cloud Account Management, Compute,
  Connectivity, Customer Integration, Security, and Solutions
  Architecture — all built on top of AWS and Linux. You'll own
  one or more subsystems or services, delivering high-quality
  work both individually and as part of a collaborative team.

  You must demonstrate high agency: combining systems
  thinking, a bias to action, and the willingness to challenge
  assumptions to assess and address the infrastructure needs,
  challenges, and concerns of engineering teams across
  Arcesium.

  Responsibilities

  - Build and operate reliable, well-instrumented infrastructure
    services — spanning all of Infrastructure’s functional
    areas — that other engineers and our customer-facing
    applications depend on for high availability
  - Strengthen our compute platform, leveraging AWS and
    Kubernetes
  - Craft tools and automated solutions that streamline
    processes, reduce toil, and improve efficiency — applying
    modern tooling and, where it fits, GenAI to accelerate how
    infrastructure is built and operated
  - Take ownership of critical technology infrastructure built
    on top of multiple underlying technologies, tools, and
    programming languages
  - Drive process improvements and evangelize engineering best
    practices; help define and track the metrics that ensure
    we are prioritizing work that has the most impact
  - Act as a member of the broader Infrastructure organization
    at Arcesium, which provides the foundation upon which our
    customer-facing Platform runs

  Qualifications

  - 3–5+ years of relevant infrastructure experience. However,
    we are interested more in what you've done, can do, and
    can grow to do, rather than the number of years you've
    been working.
  - A proven track record of ownership of critical
    infrastructure systems and delivery of features that
    measurably improve reliability and efficiency. You have
    owned and operated systems such as Kubernetes, cloud
    infrastructure, DNS, or authentication services.
  - Polyglot programming capability, with advanced ability in at
    least one language. We expect engineers within
    Infrastructure to be proficient and prolific software
    engineers. Languages in our ecosystem include Python,
    Java, Go, and Bash.
  - Experience running critical workloads in AWS is highly
    valued.
  - An ability to balance delivery with correctness, delivering
    timely solutions that are properly risk-managed for the
    needs of the business.
  - A curious mind, enthusiasm for technology infrastructure,
    strong collaboration and communication skills, and the
    drive to take initiative with the right combination of
    independence and teamwork

  Not all strong candidates will meet every single
  qualification as listed. We encourage you to apply if you
  are interested in this work, even if your experience doesn't
  precisely match the job description. Your skills and passion
  will stand out, especially if your background is
  unconventional.

  The expected annual base salary for this position is
  $175,000 - $210,000. Our compensation package includes
  variable compensation in the form of a year-end bonus,
  guaranteed in the first year of hire, benefits including
  medical and prescription drug coverage, and 401k
  contribution matching.

  The applicable annual base salary paid to a successful
  applicant will be determined based on multiple factors
  including without limitation the nature and extent of prior
  experience and educational background.   #LI-JS1 #LI-hybrid

  Arcesium's Personal Data Privacy Notice for Candidates is
  linked here.

  Recruiting Security Emails from genuine Arcesium recruiters
  who are employees of the company will always come from the
  @arcesium.com domain. In some cases, you may also be
  contacted by independent search firms engaged to recruit on
  our behalf; emails from their employees should always come
  from their firm's applicable domain. We'll never ask for
  your banking information or any payment as part of the
  recruiting process. If something seems off or you're
  contacted by an unexpected third party, please reach out to
  us at careers@arcesium.com (US/UK), careers-
  india@arcesium.com (India) or careers-europe@arcesium.com
  (Portugal/Sweden).

  Arcesium is an equal opportunity employer.
