description: |
  Company Description

  We are looking for a Tech Lead Backend who will take full
  ownership of crucial backend engineering activities at
  Kadmos. You should expect to be right in the cockpit of a
  high-growth start-up, getting the exciting opportunity to
  write high-quality code and keep on top of novel
  technologies. Your responsibilities will include building
  and maintaining micro-service landscapes, ensuring the
  efficiency and speed of current applications,
  troubleshooting and debugging, and overseeing
  infrastructure. Ideally, you have been exposed to some
  leadership responsibilities and you believe in your
  leadership potential and would like to further expand and
  develop your leadership skills. Join us and become part of
  our journey to empower the lives of millions!

  About the company Kadmos is on an ambitious mission to
  revolutionize salary payments to migrant workers. The
  Berlin-based startup was founded in 2021 by MIT graduates
  Justus Schmueser and Sasha Makarovych to bring fintech, low
  margins, and transparent FX to industries riddled with
  opaque mark-ups, kickbacks, and physical cash transactions.

  Backed by renowned VCs Addition and Atlantic Labs, Kadmos
  has raised more than $10 million in just a year. The company
  intends to use the funding for expanding across industries
  and further accelerating product development. For more
  information, visit https://www.kadmos.io/.



  Job Description

  What you’ll be doing

  - Own the backend. Your tasks will include crucial backend
    activities such as the generation of reusable libraries,
    conceptualization, and implementation of complex banking
    components, integration with different service providers,
    etc.
  - Lead the team. Take on the role of a lead in one of our key
    product teams.
  - Be independent. You'll be given complete independence in
    your areas of responsibility and should take full
    ownership of your areas of responsibility, playing a
    central part in our success.
  - Growth. You will directly experience and take part in the
    scale-up of a high-growth business. What do you bring
    along

  Qualifications

  Must have requirements

  - 3+ years of professional experience in digital marketing,
    content creation, and/or social media management
  - Bachelor's degree from a top university in marketing,
    communication, or related field
  - A demonstrated ability to carry out digital marketing and
    social media strategies in an effective and timely manner
  - Strategic mindset with an ability to see the big picture and
    generate strategies to achieve company goals accordingly
  - Fluency in English. Knowledge of German would be a plus

  Nice to have requirements

  - Previous work experience(s) in the FinTech or SaaS
    environments

  Additional Information

  Why us

  🌱 Opportunity to work in a company with direct social impact

  💰 Attractive compensation & stock options

  🇺🇦 Open & International environment

  🏛️ Fantastic location in the heart of Berlin & flexible WFH
  policy

  🥳 Regular team events

  🥘 Free lunch at the office

  💻 Latest equipment, to ensure you have everything needed
