description: |
  This is a product-minded frontend engineer with elite craft
  and the judgment to turn messy technical requirements into
  interfaces that make complex systems feel simple and
  intuitive. A platform discussion, a half-formed workflow, or
  a rough feature idea becomes a polished product surface that
  makes the whole team faster. You take a loosely defined
  need, identify the right workflow, prototype it, make the
  design calls, and carry it through to production
  independently.

  What you own. The frontend layer of our proprietary
  platform, Crucible: the interfaces, workflows, templates,
  and architecture that turn powerful AI systems into usable
  software. You are shaping interaction patterns, tightening
  performance, and making complex agent workflows feel clear,
  fast, and trustworthy. You build in Crucible, creating
  reusable components and product patterns that FDEs can pull
  into customer projects again and again. You own net-new
  building blocks and their maintenance over time, not just
  one-off UI implementation. Your job is to make the platform
  excellent enough that everyone else can build on it.

  What you bring. Production frontend shipped with taste:
  React, TypeScript, modern web architecture, and a high bar
  for UX quality. You have built products where usability,
  speed, and visual polish mattered. You can navigate
  ambiguity, make sound tradeoffs without a fully defined
  spec, and explain those tradeoffs clearly. You are not a
  designer by title, but you have strong design instincts. You
  know when a flow is confusing, when a UI is not good enough,
  and when a reusable component will save the team weeks
  later. You are opinionated about what great looks like, but
  can collaborate with the FDEs and delivery teams closest to
  the customer and system constraints. You are self-sufficient
  and excited to raise the frontend bar on a backend-heavy
  engineering team.

  Level. We expect roughly 4+ years of experience, with
  independent product-building ability.
