description: |
  BeyondTrust is a place where you can bring your purpose to
  life through the work that you do, creating a safer world
  through our cybersecurity SaaS portfolio.

  Our culture of flexibility, trust, and continual learning
  means you will be recognized for your growth, and for the
  impact you make on our success. You will be surrounded by
  people who challenge, support, and inspire you to be the
  best version of yourself.

  The Role

  You'll work on the Endpoint Privilege Management software
  that protects organisations from identity-based attacks. Our
  stack is Java and Spring Boot on the backend with Angular
  and TypeScript on the front end, deployed to cloud
  infrastructure at enterprise scale.

  We are an AI-first engineering organisation. AI tooling is a
  core part of how we design, build and ship, and every
  engineer is provisioned with Claude Code and Copilot from
  day one.

  Teams here form around problems rather than fixed
  components, so you'll get exposure across the product rather
  than ownership of one narrow area.

  What You’ll Do

  - Design, build and ship features of our EPM software from
    architecture through to delivery
  - Use AI-assisted tooling as a standard part of how you
    design, code, test and debug
  - Work with distributed cross-functional teams to ship major
    releases
  - Diagnose and resolve complex issues, including those
    reported by customers

  What You’ll Bring

  - Strong Java backend development, ideally with Spring Boot
  - Front-end experience with Angular and TypeScript
  - Experience shipping production software in an Agile
    environment
  - Working knowledge of Git, build tooling and testing
    frameworks such as JUnit
  - Fluent with AI coding assistants such as Copilot or Claude
    as part of your daily workflow

  Nice To Have

  - Cloud experience with Azure or AWS
  - Relational or NoSQL database experience
  - Curiosity about applying AI/ML within the product itself,
    not only to how you write code
  - Experience working across distributed teams and time zones

  If you meet most of these but not all, we'd still like to
  hear from you.

  What We Offer

  - Competitive salary and pension with up to a 10% annual bonus
  - 25 days’ holiday which increases with length of service
  - Competitive pension scheme
  - Three weeks' additional leave at seven years' service
  - Fully remote within the UK, plus up to 4 weeks per year
    under our Working Abroad policy (subject to approval)
  - Bupa Private Healthcare for you and family
  - Medicash Benefit (including opticians and dental cover)
  - Life insurance at 4x salary and income protection
  - Paid parental leave and enhanced maternity leave
  - Employee Assistance Programme
  - Opportunity to co-invest and become a BeyondTrust
    shareholder
  - Investment in AI skills, with Claude Code and Copilot
    centres of excellence
  - Pluralsight and LinkedIn Learning licenses

  Better Together

  Diversity. Inclusion. They’re more than just words for us.
  They are the guiding values of how we build our teams,
  cultivate leaders, and create a culture where people feel
  connected.

  We take care of our employees so they can take care of our
  customers. Customers who come from all walks of life just
  like us. We hire incredible people from diverse backgrounds
  because when we are different together, we are stronger
  together.

  About Us

  BeyondTrust is the global identity security leader
  protecting Paths to Privilege™. Our identity-centric
  approach goes beyond securing privileges and access,
  empowering organizations with the most effective solution to
  manage the entire identity attack surface and neutralize
  threats, whether from external attacks or insiders.

  BeyondTrust is leading the charge in transforming identity
  security to prevent breaches and limit the blast radius of
  attacks, while creating a superior customer experience and
  operational efficiencies. We are trusted by 20,000
  customers, including 75 of the Fortune 100, and our global
  ecosystem of partners.

  Learn more at www.beyondtrust.com.

