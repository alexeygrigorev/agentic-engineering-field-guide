  - Mainframe Applications
  - Legacy Systems (Java, .NET, C++)
  - Service-Oriented Architecture (SOA)



  Preferred Qualifications



  - Experience within financial services, banking, wealth
    management, insurance, or other regulated industries.
  - Knowledge of Agile and Scrum methodologies.
  - Experience with enterprise application modernization
    initiatives.
  - Exposure to hybrid cloud and multi-cloud environments.
  - Strong understanding of software architecture patterns and
    best practices.



  Core Competencies



  - Technical Leadership
  - Solution Architecture
  - Collaborative Problem Solving
  - Strategic Thinking
  - Communication and Documentation
  - Continuous Learning
  - Team Mentorship
  - Stakeholder Management
  - Customer-Centric Mindset
  - Organizational and Multi-tasking Skills



  What Success Looks Like



  - Delivering scalable and reliable enterprise solutions.
  - Driving modernization and cloud adoption initiatives.
  - Improving system performance, maintainability, and
    operational efficiency.
  - Establishing engineering best practices and development
    standards.
  - Contributing to a culture of innovation, quality, and
    collaboration.



  This role is ideal for a senior engineer who is passionate
  about building robust backend systems, leading technical
  initiatives, and driving modernization efforts within a
  large-scale enterprise environment.













  Compensation, Benefits and Duration Minimum Compensation:
  USD 35,000 Maximum Compensation: USD 123,000 Compensation is
  based on actual experience and qualifications of the
  candidate. The above is a reasonable and a good faith
  estimate for the role. Medical, vision, and dental benefits,
  401k retirement plan, variable pay/incentives, paid time
  off, and paid holidays are available for full-time
  employees. This position is not available for independent
  contractors No applications will be considered if received
  more than 120 days after the date of this post
