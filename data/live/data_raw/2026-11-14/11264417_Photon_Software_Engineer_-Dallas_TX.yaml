description: |
  Senior Full Stack Engineer Location



  Westlake, TX (Hybrid/Onsite)



  Job Summary



  We are seeking an experienced Senior Full Stack Engineer to
  design, develop, and modernize enterprise-scale applications
  that support critical business functions. This role requires
  strong expertise in backend development, API design, cloud-
  native technologies, and modern software engineering
  practices. The ideal candidate will work closely with cross-
  functional teams to deliver scalable, secure, and high-
  performing solutions while contributing to architectural
  decisions and mentoring development teams.



  Key Responsibilities



  - Design, develop, and maintain enterprise-grade applications
    and RESTful APIs.
  - Build scalable, high-volume transactional systems with
    strong focus on performance, reliability, and security.
  - Lead and contribute to the modernization and re-platforming
    of large legacy applications.
  - Collaborate with product owners, business stakeholders,
    architects, and engineering teams to deliver end-to-end
    solutions.
  - Design and implement microservices-based architectures and
    domain-driven solutions.
  - Develop and deploy cloud-neutral applications across AWS and
    Azure environments.
  - Participate in architecture reviews, design discussions,
    code reviews, and technical decision-making.
  - Debug and analyze legacy systems to document current-state
    implementations and support migration efforts.
  - Mentor junior and mid-level developers and promote
    engineering best practices.
  - Create and maintain technical design documentation,
    architecture artifacts, and implementation guidelines.
  - Support production deployments, troubleshooting, and
    continuous improvement initiatives.
  - Foster collaboration across globally distributed teams.



  Required Qualifications



  - Bachelor's or Master's degree in Computer Science,
    Information Technology, Engineering, or a related field.
  - 7+ years of software development experience in enterprise-
    scale applications.
  - Strong expertise in Java and modern backend development
    frameworks.
  - Extensive experience designing and building scalable RESTful
    APIs.
  - Strong understanding of object-oriented analysis, design,
    and programming principles.
  - Experience developing domain logic-intensive applications
    and distributed systems.
  - Demonstrated experience leading technical teams and
    mentoring engineers.
  - Experience modernizing or re-platforming legacy
    applications.
  - Ability to analyze and document complex legacy systems to
    support modernization initiatives.
  - Strong analytical, problem-solving, and communication
    skills.



