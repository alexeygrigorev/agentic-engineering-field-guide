description: |
  Overview

  We are hiring Senior Staff Software Engineer, Digital
  Banking to deploy within our portfolio of engagements.
  Strong preference will be given to candidates with prior
  Commercial Treasury digital banking, data conversion.
  platform migration and/or software
  integration/implementation experience.

  This role sits within our consultancy, directly on our team,
  delivering high complexity, high impact projects for our
  clients. This is a customer facing role that requires strong
  communications skills, an ability to partner with our
  customers technology teams, along with our implementation
  consultants/delivery team.

  Qualifications & Experience

  - Java Expertise: 10+ years of hands-on Java development
    experience (Amazon Corretto 21), Spring Boot (3.2.4),
    Spring Security. This extensive experience implies that
    the candidate is proficient in enterprise-grade Java
    applications, design patterns, and performance
    optimization.
  - Microservices and REST API Proficiency: Skilled in
    developing web services, particularly microservices
    architectures, and REST APIs. This indicates a strong
    understanding of how to build, scale, and maintain
    distributed systems effectively.
  - Client Side Development using React JS, Webpack, and
    application testing frameworks such as Jest are preferred.
  - Database and SQL Skills: Proficient in Microsoft/Oracle
    Database, with expertise in writing complex SQL queries.
    This level of database knowledge is crucial for data-heavy
    applications and backend services.
  - Cloud-Native and Platform Experience: Familiarity with cloud
    platforms, preferably AWS or Azure, as well as experience
    with deploying containerized (AKS) cloud-native
    applications.
  - Broad Technology Stack Experience: Familiar with a range of
    modern tools and technologies, including Kafka (event
    streaming), Zookeeper (coordination service),
    Splunk/Dynatrace (monitoring), Redis (in-memory data
    structure store), Azure Key Vault, and Azure SQL Server.
    The ability to simplify and create common
    libraries/interfaces for these tools is a plus.
  - Leadership and Collaboration Skills: Experience driving end-
    to-end development, conducting code reviews, developing
    test strategies, coordinating with cross-functional teams,
    and resolving operational issues. This suggests that the
    candidate can lead and manage projects while also being a
    key technical contributor.
  - Performance Optimization and Code Reviews: Skilled in
    performance code reviews and implementing best practices
    for efficient, scalable code.

  Location: 100% Remote (paid travel 1-2 times annually)

  Employment: Contract to Hire on W2  (no C2C)

  Benefits: Untracked/flexible time-off, Health Insurance,
  Health Savings, Vision, Life Insurance

  About Us

  Ignite Banking is a boutique consulting firm serving
  exclusively banks and financial institutions in hands-on
  technology delivery roles. We are not a staff
  augmentation/recruiting firm. We are a trusted partner to
  our clients, standing shoulder to shoulder with them while
  we work together to deliver technically complex
  capabilities/projects/programs.

  Our engagements support all aspects of retail and commercial
  banking, including digital channel transformation, payments,
  core banking, software and outsourcing, enterprise
  distributed software, and beyond. Our experts help our
  clients navigate the most challenging aspects of selecting
  and implementing new technology, saving them time,
  frustration, and financial resources.

  Our consultants have a deep and thorough knowledge of the
  major enterprise banking platforms and digital channel
  vendors. Our understanding of the various market offerings
  allows us to separate fact from spin, and provide clients
  unbiased guidance about which products best suit their
  needs. Our experts collaborate with key stakeholders across
  the enterprise, and partner with vendors to find the right
  solution to achieve business goals.

  We select associates based on how well their specific
  background and subject matter expertise aligns with the
  needs of the clients we serve. Our consultants share a can-
  do, roll-up-your-sleeves approach. We’re team players, and
  we’re in the trenches with our clients, ready to do the hard
  work it takes to build a stronger, more efficient
  organization. In short, we have the right solution and the
  relevant people to create real results.

  About Our Team & Culture

  - High performance team of senior consultants, leading high
    exposure/mission critical work
  - Fast paced environment, focused on technically complex
    bank/financial services projects
  - Results-driven approach, with a focus on making real impact
    for our clients
