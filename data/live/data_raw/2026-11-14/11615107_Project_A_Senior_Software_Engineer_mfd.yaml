description: |
  A11 is the execution engine behind Europe’s top tech
  unicorns like Trade Republic, Sennder and Kry. We are a SWAT
  team for business performance in different expertise areas
  ranging from Marketing, Sales, Data, Tech to People Ops.
  With 100+ international experts, we step in with tactical
  precision to tackle complex challenges across business and
  tech. From launching products at speed to reshaping entire
  business models, we deliver impact.

  About the Job

  We're looking for driven and impactful Software Engineers
  (m/f/d) to join our Engineering team.

  Alongside our client work, we are building Lumarc: an AI
  decision engine that brings together company data,
  recommends the best course of action and carries it out.

  In your day-to-day work, you'll build with agentic, AI-
  assisted development as the default way of working, always
  with a pragmatic mindset, a keen eye for quality and a
  collaborative spirit. You'll join a small, senior team with
  real clients from day one.

  We're hiring across two tracks that share the same
  foundation and can overlap in practice:

  - Core Engineer: you build the product itself, platform and
    architecture work, agentic systems, with a small team
    where anyone can pick up any task.
  - Forward Deployed Engineer (FDE): you work hands-on with
    client teams on various different projects, take what the
    core product offers, and build the customization on top.
    The work is technical and client-facing, requires adapting
    quickly to systems you haven't seen before, and feeds
    learnings back into the core product.

  If you lean towards the Core Engineer role, you'll be:

  - Owning architecture and technology choices for AI-native,
    agentic products, from the whiteboard to production
  - Building data pipelines, workflow automation and system
    integrations that turn messy client data into clean,
    usable flows
  - Building and shipping features across frontend and backend,
    and owning the infrastructure, CI/CD and hosting that make
    the platform repeatable across clients
  - Building and refining the first product surfaces (such as
    rapid UI prototypes) end to end, deciding when a prototype
    is solid enough to productionize

  If you lean towards the FDE role, you'll be:

  - Design, plan and implement business-critical, performant and
    accessible user interfaces with our clients
  - Enhance the usability and user experience of existing
    applications by developing new features
  - Advise engineering teams on the architecture and technology
    choices for their websites and web applications
  - Working one-to-one with client teams to understand their
    systems, data and ways of working, including running
    workshops to surface implicit, undocumented knowledge
  - Building the client-specific customization on top of what
    the core product already offers
  - Translating what you learn on-site into input for the core
    team, so patterns that repeat across clients can be built
    once
  - Explaining the product in a technical, consultative way (not
    a sales pitch) and travelling to client sites for
    workshops as needed

  Your Profile:

  - Hands-on software engineering background with real shipping
    experience (products, MVPs or proofs of concept), not only
    maintenance work
  - Practical experience with AI/LLM systems in production, such
    as agent orchestration, tool-calling, integrations or
    applied AI/LLM features, not only side projects or
    tutorials
  - Knowledge of Python or TypeScript (or another object-
    oriented language)
  - A get-things-done mindset: you ship and don't wait for
    perfect specs
  - Comfort with ambiguity and open-ended work; you think in
    products, not tickets
  - High agency: you take initiative, make decisions with
    confidence, and go beyond your role to ensure success
  - Ability to effectively convey technical concepts to team
    members and stakeholders in a business-friendly way
  - A team player who prioritises shared goals, shares credit
    and collaborates across disciplines
  - Openness to feedback and adaptability in a fast-changing
    environment
  - C2 in German for FDEs & proficiency in English for both core
    engineers and FDEs
  - If you lean towards the FDE role: comfort with people-facing
    work (workshops, client conversations) and willingness to
    travel to client sites

  Please note that this position is based in Berlin.

  Why Join A11:

  - Shape the Future of Innovation: Take the lead on game-
    changing projects across a diverse range of companies and
    geographies. You'll make a true impact through our
    strategic and hands-on working style.
  - Collaborate with an International Team of Digital Natives:
    Unlock new opportunities to learn, contribute, and thrive
    in a dynamic, multicultural environment. Our Team
    represents over 25 nationalities and brings experience in
    a wide range of companies and industries.
  - Career Development: We support growth in every
    direction—whether you want to deepen your expertise, lead
    a department or explore new areas.
  - Embrace Change and New Technologies: We actively try out new
    tools and AI features to optimise our workflows and
    processes, giving you creative freedom and autonomy to
    reach your goals.
  - Exchange and Discover: From shared meals with the Team to
    fun offsites to frequently hosted meetups, you'll build
    lasting connections through regular events and dynamic
    knowledge-sharing opportunities.

  If you’re looking to accelerate growth and generate high
  impact, we want to hear from you!

  Our Commitment to Diversity and Inclusion

  A11 is committed to diversity and equal opportunities for
  all – applicants and employees alike. We value humans – with
  all our glorious multifaceted backgrounds, perspectives, and
  experiences. Our diverse team has different ethnic and
  cultural origins, gender identities, sexual orientations,
  family arrangements, religious and political affiliations,
  socioeconomic statuses, age groups, and abilities.
