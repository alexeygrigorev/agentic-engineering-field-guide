title: Sitecore Full Stack Developer- Marketing Technology
company: Neuberger Berman
location: New York, USA
work_type: FULL_TIME
company_size: 2,667 Employees
description: |
  Neuberger's Marketing Technology group is seeking a Full
  Stack Solution Engineer/Developer to support a hybrid web
  platform spanning a traditional content-managed system and a
  modern, decoupled marketing site. The candidate must be
  equally strong across front-end and back-end development,
  designing, building, and owning services end-to-end, while
  remaining comfortable operating autonomously, supporting
  production operations, and bridging legacy and modern
  systems as the team builds deeper headless expertise.
  Experience with website integrations/management, multi-
  region website operations, bot/security handling, and
  operational/monitoring practices is required given the
  platform's global, business-critical footprint.

  Responsibilities

  - Design, build, and maintain responsive front-end components
    and pages using React, Next.js, TypeScript, and SCSS;
    translate Figma design specs into accessible, production-
    ready components
  - Independently configure and author Sitecore items and
    content structures
  - Design and build backend services and APIs using Node.js
    (REST and GraphQL), including authentication/authorization
    logic, backend-for-frontend (BFF) layers, and third-party
    service integration
  - Work within Docker-based local development environments and
    with SQL/relational databases for data access and
    troubleshooting
  - Manage and troubleshoot website integrations (analytics,
    tagging, third-party services), bot detection/mitigation
    at the CDN/edge layer, and global/multi-region site
    operations
  - Define non-functional requirements (performance,
    scalability, availability, security) and
    monitor/troubleshoot production application health using
    Splunk, Datadog, and other APM tools
  - Leverage AI-assisted development tools (e.g., GitHub
    Copilot, Claude Code) to accelerate delivery; participate
    in Agile ceremonies via Azure DevOps; support teammates as
    the team builds deeper headless expertise

  Must-Have Qualifications

  - Around 5+ years of professional full stack web development
    experience, with deep hands-on experience across both
    front-end (React, Next.js, TypeScript, HTML, SCSS) and
    back-end (Node.js, API/GraphQL) development
  - Practical hands-on experience in Sitecore, including ASP.NET
    MVC/headful development, plus experience converting Figma
    (or similar) mockups into production-ready front-end code
  - Required experience with GraphQL, and hands-on experience
    designing/building backend services and APIs with Node.js
    (REST and GraphQL design, authentication/authorization
    patterns, BFF architecture)
  - Familiarity with SQL/relational databases and experience
    working in Docker-based development environments
  - Comfortable using AI-assisted development tools (e.g.,
    GitHub Copilot, Claude Code) to improve development
    velocity, paired with strong foundational skills in React,
    TypeScript, and JavaScript
  - Experience using Git and Azure DevOps for source
    control/work management, working in Agile delivery teams,
    and strong critical thinking, communication, organization,
    and collaboration skills

  Nice-to-Have Qualifications

  - Experience in financial services / asset management
  - Hands-on experience with bot detection and mitigation
    (CDN/edge middleware, rate limiting, request filtering)
  - Retrieval/hybrid search (RAG) exposure
  - Knowledge of website integrations and management (analytics,
    tagging, third-party tools, CDN/hosting configuration) and
    experience managing global websites across multiple
    regions/markets
  - Experience defining non-functional requirements (NFRs) and
    hands-on experience with Splunk and Datadog for
    application performance monitoring, operational support,
    and troubleshooting
  - Experience with Vercel/WAF or similar deployment/hosting
    platforms
  - Experience with Digital Asset Management platforms,
    particularly Bynder

  Location: This role is based in New York with a minimum of 2
  days/ week in office.

  #LI-DD2

  #LI-Hybrid

  Developer III

  Applicants must be authorized and have the right to work in
  the country where the role is located without the need for
  current or future sponsorship.

  Compensation Details

  The salary range for this role is $110,000-$135,000. This is
  the lowest to highest salary we in good faith believe we
  would pay for this role at the time of this posting. We may
  ultimately pay more or less than the posted range, and the
  range may be modified in the future. This range is only
  applicable for jobs to be performed in the job posting
  location. An employee’s pay position within the salary range
  will be based on several factors including, but limited to,
  relevant education, qualifications, certifications,
  experience, skills, seniority, geographic location, business
  sector, performance, shift, travel requirements, sales or
  revenue-based metrics, market benchmarking data, any
  collective bargaining agreements, and business or
  organizational needs. This job is also eligible for a
  discretionary bonus, which, along with base salary and
  retirement contributions, is part of our total comprehensive
  package. We offer a comprehensive package of benefits
  including paid time off, medical/dental/vision insurance,
  retirement, life insurance and other benefits to eligible
  employees.

  Note: No amount of pay is considered to be wages or
  compensation until such amount is earned, vested, and
  determinable. The amount and availability of any bonus,
  commission, production, or any other form of compensation
  that are allocable to a particular employee remains in the
  Company's sole discretion unless and until paid and may be
  modified at the Company’s sole discretion, consistent with
  the law.

