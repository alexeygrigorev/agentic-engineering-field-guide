description: |
  Watch your work come to life with landmark projects around
  the world when you partner with Syska Hennessy Group! As a
  global multi-disciplinary engineering firm, we specialize in
  highly technical buildings and the systems that bring them
  to life. We currently have an opportunity for a Software
  Developer (Innovations)Summer Intern to join our NY Office.

  Our dynamic work environment provides the optimal setting
  for a learning opportunity as an intern. From our supportive
  culture, diverse workforce, and competitive compensation to
  our flexible work schedules and fun social events, it's
  everything you'll need for an exciting, challenging and
  rewarding summer internship.

  Software Developer Intern

  Responsibilities:

  As a Software developer, you should be interested in driving
  innovation throughout the AEC industry. This position will
  report to the Innovation Program Manager and will work with
  other staff members locally and nationally to help fast-
  track the development phase for several in-progress
  innovation projects.

  Some responsibilities include:

  - Proficiency in programming for web and/or mobile
    applications, demonstrating a clear understanding of
    software development principles.
  - Demonstrated proficiency in programming languages and
    frameworks commonly used in web and/or mobile application
    development, such as but not limited to ReactJS,
    JavaScript, Python, HTML/CSS, Java, Swift, or Kotlin.
  - Familiarity with version control systems (e.g., Git) and
    best practices in code organization and documentation.
  - Ability to troubleshoot and debug code efficiently, with a
    strong attention to detail to ensure the reliability and
    performance of applications.

  Internship Requirements:

  The ideal candidate will enjoy a team environment and also
  flexible enough to work independently where needed.
  Candidates for this role will be eager to learn and will
  expand their knowledge and hands-on experience by
  challenging themselves and using the highly technical
  resources around them.

  Additional job requirements:

  - Ability to work collaboratively within a team environment,
    actively contributing to discussions and offering creative
    solutions to programming challenges.
  - Eagerness to learn and adapt to new technologies, with a
    strong desire to expand skills in software development.
  - Effective communication skills, enabling clear articulation
    of ideas and efficient collaboration with team members.
  - Ability to handle multiple tasks in a deadline driven fast-
    paced environment.
  - Flexible and proactive in taking on assignments and
    responsibilities.

  Benefits:

  As an employee of Syska Hennessy, you will be part of a
  global firm with an amazing history! We are committed to
  being the best, to advancing engineering design practice,
  and to supporting our clients with integrity. To make all of
  that happen, we rely on the talent, drive, enthusiasm, and
  the total job satisfaction of the great people who work
  here.

  As a member of our highly collaborative team, we provide our
  full-time employees with a flexible benefits package that
  reflects our respect for your workplace contributions,
  professional goals, and personal priorities. The personal
  benefits program at Syska Hennessy includes:

  - Robust, comprehensive medical, dental, vision, life
    insurance and supplemental benefit plans
  - 401(k) plan with a generous employer matching program
  - Training and professional development courses
  - Professional development incentive bonuses
  - Dynamic Employee Resource Groups
  - Competitive Paid Time Off (PTO) policy
  - Transit/parking employer stipend
  - ½ day work from home Fridays all year long

  At Syska, we promote an environment that is committed to
  embedding diversity and equality into the core of our
  business and culture. We empower our employees so they can
  take ownership of their work and development and strive to
  continually improve themselves and our firm. Syska is a
  place where you can build an exceptional career and have a
  lasting impact on the world.

  Syska Hennessy Group - Creating Exceptional Environments

  Let’s Work Together!

