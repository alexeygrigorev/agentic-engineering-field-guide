description: |
  Zscaler (NASDAQ: ZS) accelerates digital transformation so
  customers can be more agile, efficient, resilient, and
  secure. The Zscaler Zero Trust Exchange platform protects
  thousands of customers from cyberattacks and data loss by
  securely connecting users, devices, and applications in any
  location. Distributed across 200+ public data centers
  globally and thousands of private sites at the edge, the
  SASE-based Zero Trust Exchange is the world’s largest in-
  line cloud security platform.

  We believe the future of work is Human + AI and are building
  an AI-native enterprise where human potential is amplified
  by machine intelligence to solve the world’s hardest
  security challenges. Driven by deep customer obsession, we
  are committed to the mission, outcome, and to each other. We
  bring these commitments to life through three core
  behaviors: ownership and collaboration, trust through
  outcomes and impact, and a challenge culture with ongoing
  feedback. Ready to make an impact at the company pioneering
  security transformation in the AI era? Join us at Zscaler.

  Role

  We are looking for a Staff Backend Developer to join our
  Threat Intelligence team. This is a remote role based
  anywhere in the UK, reporting to the Sr. Director, Threat
  Intelligence in the Threat Intelligence department. In this
  critical role, you will design, implement, and maintain
  high-performance backend systems. You will collaborate
  closely with our malware reverse engineering team to build a
  sophisticated platform that enhances Zscaler’s core threat
  detection capabilities.

  What you’ll do (Role Expectations)

  - Build scalable data pipelines and design systems that
    ingest, process, and index large volumes of documents and
    data.
  - Take the lead on improving development best practices across
    the team, championing standards for code reviews, testing,
    observability, and documentation.
  - Identify and address performance bottlenecks to ensure the
    overall efficiency and reliability of the applications.
  - Develop robust, reliable backend APIs and services by
    creating, testing, and measuring backend workflows.

  Who You Are (Success Profile)

  - You thrive in ambiguity. You're comfortable building the
    path as you walk it. You thrive in a dynamic environment,
    seeing ambiguity not as a hindrance, but as the raw
    material to build something meaningful.
  - You are a problem-solver. You seek out challenges because
    you are energized by finding solutions, knowing that
    solving the hard problems delivers the biggest impact.
  - You are a positive force. You approach hard problems with
    constructive energy and a 'can-do' spirit that is
    contagious, inspiring your team to stay focused on the
    solution.
  - You are a pragmatic builder. You are obsessed with creating,
    iterating, and shipping. You aren't afraid to roll up your
    sleeves and build the first version yourself, balancing
    the drive for technical excellence with the need to
    deliver value to users quickly.
  - You lead with integrity. You do the right thing, even when
    it’s hard. You hold yourself and others to a high standard
    of accountability and build trust by matching your words
    with consistent, transparent action.

  What We’re Looking for (Minimum Qualifications)

  - Foundational understanding of AI/ML technologies and
    experience leveraging, securing, or positioning AI-driven
    solutions to optimize outcomes within your functional
    domain.
  - 7+ years of experience as a backend developer or in a
    similar professional role.
  - Proficiency in Python, PostgreSQL, Redis, and distributed
    task queue systems.
  - Strong understanding of backend databases, data storage, and
    RESTful API design and development.
  - Expertise in relational database design, implementation, SQL
    query optimization, and reporting.

  What Will Make You Stand Out (Preferred Qualifications)

  - Proven ability to leverage AI technologies and LLM workflows
    to automate backend data processing and enhance threat
    detection systems.
  - Prior experience building engineering solutions for malware
    automation and threat detection.
  - Expertise in Django internals, containerization with
    Kubernetes, and full-text search engines like
    Elasticsearch, Meilisearch, or Typesense.

