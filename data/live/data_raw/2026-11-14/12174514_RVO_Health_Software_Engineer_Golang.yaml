description: |
  Healthcare is complex. We’re here to change that.

  RVO Health is a health technology company on a mission to
  make health easier to navigate, more accessible, and more
  affordable for everyone.

  Here, you'll help over 40 million people every month, with a
  team that genuinely cares about the work and each other.

  At a Glance

  This is an individual contributor role on our Content
  Platform team with a focus on enhancing and maintaining our
  internal content workflow and content distribution systems.
  This role provides the opportunity to work alongside Staff
  and Senior engineers, broaden your experience,  and grow in
  your career, all while working in a friendly and supportive
  environment.

  What You’ll Do

  - Design, build, and ship features across our content
    platform, working from requirements through to production.
  - Partner with your Product Manager, Technical Project
    Manager, and fellow engineers to scope work, estimate
    effort, and plan sprints.
  - Write clean, well-tested code and participate actively in
    code review, both giving and receiving feedback.
  - Debug and resolve issues across the stack, supporting
    production systems as part of the team's on-call rotation.
  - Use AI tools to reduce engineering turnaround time, and
    optimize your solutions for the best results.
  - Contribute to a healthy team culture: clear communication,
    constructive code review, and shared ownership of quality.

  What We’re Looking For

  Required:

  - Bachelor's degree in computer science, software engineering,
    a related field; or equivalent experience.
  - 3+ years experience in software development, with a focus on
    large-scale applications.
  - Proficiency in multiple programming languages, with a focus
    on Golang (e.g., Go, PHP, JavaScript, Python, TypeScript,
    Java, C#, C++, etc.).
  - Deep understanding of software development methodologies and
    best practices.
  - Strong problem-solving and analytical skills.
  - Strong interpersonal and communication skills.
  - Experience with software testing.
  - Experience using AI for code generation and ideation.

  Preferred:

  - Full stack programming experience with multiple languages
    and technologies including Go, PHP, Node.js + TypeScript,
    GraphQL, REST APIs, NoSQL, etc.
  - Proficiency in AWS cloud infrastructure and IaC.
  - Previous experience with healthcare regulations and
    compliance requirements.

