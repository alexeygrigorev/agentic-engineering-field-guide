description: |
  Job Description SummaryAt GE Vernova's Grid Solutions
  business we are electrifying the world with advanced grid
  technologies. As leaders in the energy space our goal is to
  accelerate the transition for a more energy efficient grid
  to full fill the needs of tomorrow. With a focus on growth
  and sustainability Grid Solutions plays a pivotal role in
  integrating Renewables onto the grid to drive to carbon
  neutral. In Grid Solutions we help enable the transition for
  a greener more reliable Grid having the most advanced and
  comprehensive product and solutions portfolio within the
  energy sector.Are you a strategic leader with a passion for
  engineering excellence? As our Engineering Operations
  Manager, you will oversee the operations of our Central
  Europe regional engineering offices. Primarily, the role
  will have direct responsibility for how the Engineering team
  runs. This includes, but is not limited to, portfolio
  management, demand/capacity forecasts, budget projections
  and actuals, operating cadence, creation of standard work
  and daily management.

  Job Description

  Core Responsibilities

  Operations:

  - Serves as the single point of contact, own and be held
    accountable to lead Engineering related business critical
    initiatives, dashboards, and KPIs
  - Activate daily management across the whole of the
    Engineering teams.
  - Identify opportunities for process improvement and best
    practices. Monitor key performance indicators and analyze
    data to drive operational efficiencies.
  - Foster a world class operations culture. Deliver strong
    daily management operating mechanisms, improve visual
    management, and ensure culture of accountability.
  - Partner with stakeholders to set clear metrics with the most
    significant impact on the business and drive operational
    rigor and accountability.
  - Identify, sometimes lead and follow up on Lean events across
    the Engineering organization to improve say/do and
    productivity and overall working experience for the team.

  - Hold operating rhythm, pacing calls on Resource/workload
    management, Engineering utilization, Budget Deviation, On
    Time Delivery (OTD), Say Do Ratio (SDR).

  - Lead all central team initiatives in collaboration with
    Department Managers such as Integrated Talent Management
    (ITM) updates & progress, Technical Experts Program (TEP),
    Project Engineering Manager (PEM) certification progress,
    and Engineering Management Handbook (EMH) updates

  - Makes decisions or solves complex tasks or problems in areas
    of technology or engineering using business-based
    judgements.

  Process & Tools Integration:

  - Ensure alignment of engineering processes and tools with the
    Engineering Management Handbook (EMH).

  - Collaborate with IT to secure and maintain engineering tools
    and infrastructure.

  Quality & EHS Accountability:

  - Ensure compliance with quality procedures and resolve any
    non-conformances promptly.
  - Serve as a champion for Lessons Learned, CoPQ initiatives.

  Continuous Improvement:

  - Capture and utilize Return of Experience (RoE) to enhance
    future projects.

  - Contribute to global engineering efficiency initiatives
    through knowledge capitalization.

  External Engineering:

  Works with Sourcing and Engineering functions on improving
  engineering subcontractors & internal / External work
  packages, and monitoring and documenting performance

  Work with Sourcing on subcontractor qualification process,
  rigor, and selection

  Technical Office

  Enhance GE GSI relations GE CS, Universities and Engineering
  Associations to learn or promote new technologies.

  Serve as the single point of contact to our Global
  engineering competence center

  Be an inclusive champion of process rigor, change & a
  transformation agent, using Lean methodology.

  Qualifications & Skills:

  Education:

  - Bachelor’s or Master’s degree in Engineering or related
    field.

  Experience:

  - 10+ years in an EPC environment within T&D, Power
    Generation, Wind, or Oil & Gas.
  - Proven leadership in managing engineering teams and complex
    projects.

  Technical Expertise:

  - Mastery of Operations procedures and Strategic planning.
  - Proficiency with engineering management tools and software.
  - Hands-on experience with Lean tools such as Value Stream
    Mapping, Kaizen facilitation, 5S, and visual management
    system and Daily Management Systems (DMS)

  Core Competencies:

  - Strategic Planning & Process Optimization
  - EHS Integration & Quality Assurance
  - Return of Experience (RoE) Management
  - Strong Communication & Leadership Skills
  - Global Mindset & Cultural Competence

  Other Requirements:

  - Willingness to travel within the region.
  - Ability to collaborate effectively with cross-functional
    teams and global centers.
  - Strategic thinker – ability to navigate complexity, develop
    clear actions, and drive impact.
  - Clear thinker with strong decision making skills and
    demonstrated ability to manage conflicting priorities in a
    fast-paced environment.
  - Demonstrated systems thinker with an ability to assess
    tradeoffs, assess risk and mitigation, as well as optimize
    outcomes.
  - Demonstrated/Proven ability to:
    - influence without direct reporting alignment
    - build consensus inside and outside of large organizations
    - lead global teams to successful outcomes
    - identify and drive process improvement, implement standard
      work, and utilize Lean operating principles

  Why Join Us?

  - Impactful Role: Lead regional engineering operations and
    drive strategic initiatives.
  - Growth Opportunities: Develop your career within a global
    engineering framework.
  - Collaborative Environment: Work with diverse, talented teams
    and cutting-edge technologies.
  - Commitment to Safety: Promote a safe and compliant workplace

  Additional Information

  Relocation Assistance Provided: Yes
