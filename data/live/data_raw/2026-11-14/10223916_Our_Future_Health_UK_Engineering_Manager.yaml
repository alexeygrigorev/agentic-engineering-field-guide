description: |
  We're looking for an experienced Engineering Manager to lead
  a squad responsible for delivering critical healthcare data
  capabilities at scale. This is a unique opportunity to
  combine technical leadership, people management and delivery
  oversight while helping shape the future of health data
  infrastructure used by researchers across the UK and beyond.

  You'll join at an exciting stage of growth, playing a
  pivotal role in shaping the direction of this team. While
  this is a largely hands-off leadership position, you'll
  bring a strong engineering background and enough technical
  depth to guide architectural discussions, challenge
  assumptions and support decision-making in complex data
  environments.

  What makes this role particularly distinctive is its focus
  on healthcare data models and standards, including OMOP and
  FHIR. You'll work closely with engineers, data specialists,
  product teams and researchers to ensure the squad delivers
  scalable, well-governed data solutions that enable the
  effective use of healthcare data for research and
  innovation. If you're an Engineering Manager with experience
  building and scaling teams, leading cross-functional
  delivery and working with complex data systems, we'd love to
  hear from you.

  Our Future Health is the UK’s largest ever health research
  programme, bringing people together to develop new ways to
  detect, prevent and treat diseases. We are a charity,
  supported by the UK Government, in partnership with
  charities and industry. We work closely with the NHS and
  with public authorities across all nations and regions of
  the UK.

  Our plan is to bring together 5 million volunteers from
  right across the UK who will be asked to contribute
  information to help build one of the most detailed pictures
  we have ever had of people’s health. Researchers will be
  able to use this information to make new discoveries about
  human health and diseases. So future generations can live in
  good health for longer.

  What you'll be doing:

  - Leading an engineering squad, creating the conditions for
    high performance, collaboration and delivery excellence.
  - Managing and developing engineers through coaching,
    mentoring and career development support.
  - Driving roadmap delivery by coordinating priorities,
    managing risks and ensuring alignment across stakeholders.
  - Providing technical leadership for data-focused initiatives,
    including healthcare data models such as OMOP and FHIR.
  - Collaborating with Product, Data and Technology teams to
    deliver scalable, sustainable solutions.
  - Facilitating technical and non-technical discussions,
    helping teams navigate priorities, dependencies and trade-
    offs.
  - Promoting engineering best practices, continuous improvement
    and effective Agile ways of working.
  - Overseeing technical decision-making, balancing delivery
    pace, quality, resilience and technical debt.
  - Supporting operational excellence through incident
    management, governance, compliance and service
    reliability.
  - Communicating progress, risks and strategic updates to
    senior stakeholders and leadership teams.

  Requirements

  We don't expect you to have experience with every single
  point but to be successful in this role you'll need to have
  experience of some of the following:

  - Experience leading and developing engineers within cross-
    functional software or data engineering teams.
  - Previous Engineering Manager experience with responsibility
    for people leadership, team performance and delivery.
  - Experience building, scaling or establishing new teams,
    processes and ways of working.
  - Strong engineering background with the ability to provide
    technical leadership and support delivery in a hands-off
    management role.
  - Understanding of healthcare data standards and common data
    models, including OMOP, FHIR or similar.
  - Experience working with complex data platforms, data
    products or large-scale data ecosystems.
  - Ability to guide technical discussions around architecture,
    data modelling, engineering quality and scalability.
  - Experience balancing delivery priorities, technical debt and
    long-term platform sustainability.
  - Strong stakeholder management skills, with the ability to
    communicate effectively across technical and non-technical
    audiences.
  - Experience working collaboratively with engineers, product
    managers, data specialists, researchers and senior
    stakeholders.
  - Strong facilitation, planning and documentation skills, with
    experience leading Agile delivery practices.
  - Experience within healthcare, research, life sciences,
    health-tech or other data-intensive environments would be
    advantageous.
  - Comfortable operating in a fast-paced, evolving environment
    and helping to establish a high-performing, inclusive team
    culture.

  Benefits

  - Competitive base salary

  - Generous Pension Scheme – We invest in your future with
    employer contributions of up to 12%
  - 30 Days Holiday pro rata + Bank Holidays – Enjoy a generous
    holiday allowance with the flexibility to take bank
    holidays when it suits you
  - Enhanced Parental Leave – Supporting you during life’s
    biggest moments
  - Cycle to Work Scheme – Save 25-39% on a new bike and
    accessories through salary sacrifice
  - Home & Tech Savings – Get up to 8% off on IKEA and Currys
    products, spreading the cost over 12 months through salary
    sacrifice
  - EV Scheme – Save up to 40% on a brand new electric vehicle
    all-inclusive package through salary sacrifice
  - £1,000 Employee Referral Bonus – Know someone amazing? Get
    rewarded for bringing them on board!
  - Wellbeing Support – Access to Mental Health First Aiders,
    plus 24/7 online GP services and an Employee Assistance
    Programme for you and your family
  - A Great Place to Work – We have a lovely Central London
    office in Holborn, and offer flexible and remote working
    arrangements

  You may work remotely from anywhere within the UK, with
  occasional travel to London.

  We recommend you apply as soon as possible as occasionally
  due to high volumes of applications, we need to close our
  postings early.

  At Our Future Health, we recognise the importance of having
  a diverse workforce and ensuring that all candidates,
  regardless of their background, have equitable access to our
  application process. We proactively encourage applicants who
  identify as having a disability, neurodiversity, or long-
  term health conditions to let us know if they require any
  reasonable adjustments as part of their application process.

  If you do require any reasonable adjustments, please email
  us at talent@ourfuturehealth.org.uk
