description: |
  Who are CloudNC? CloudNC is transforming global
  manufacturing with AI that accelerates CAM programming,
  maximizes factory output, and empowers machinists to deliver
  more. Our core product, CAM Assist, speeds up CNC machining
  by tackling the most time-consuming and repetitive parts of
  the process, from machining strategy to toolpath generation.
  It enables machinists to create effective programs in
  minutes, unlocking their full potential and helping shops
  increase throughput and improve consistency. Today, CAM
  Assist is trusted by over 1,000 machine shops around the
  world to enhance their teams’ productivity, resolving skills
  shortages and helping them to deliver efficiently for their
  customers. Founded in 2015, CloudNC consists of a world-
  class team combining expertise in computer science and
  physical manufacturing, based in our headquarters in London
  and our factory in Chelmsford. The technology company is
  backed by leading venture capital firms Atomico and Episode
  1 Ventures, alongside Autodesk and Lockheed Martin as
  strategic partners. The role As we continue to expand our
  Machining Strategy team, we’re looking for passionate,
  R&D-oriented Software Engineers to help us push the
  boundaries of what’s possible in manufacturing automation.
  The role will involve researching, designing, and developing
  novel algorithms and software systems that enable our AI to
  make smarter machining decisions — from optimizing toolpaths
  and cutting strategies to automating complex CAM workflows.
  You’ll work closely with domain experts in manufacturing,
  data science, and software engineering to turn cutting-edge
  ideas into robust, production-ready solutions. Why you? To
  be successful in this role, you should thrive on tackling
  new challenges in a fast-paced environment — combining
  curiosity, experimentation, and hands-on implementation to
  turn complex problems into elegant solutions. Collaboration
  excites you: you enjoy brainstorming with your team,
  exploring fresh approaches, and pushing technological
  boundaries, all while staying aligned with our product
  vision and roadmap. Essential Experience

  - Strong C++ programming skills with a focus on writing clean,
    performant, and maintainable code.
  - Experience in algorithm design and implementation,
    especially in domains such as computational geometry and
    numerical methods.
  - Solid understanding of data structures and algorithmic
    complexity, with the ability to reason about performance
    trade-offs.
  - Collaborative mindset — able to work closely with
    multidisciplinary teams including manufacturing experts,
    data scientists, and software engineers.
  - Excellent communication skills, capable of articulating
    complex technical ideas clearly and constructively.
  - Degree (or equivalent experience) in Computer Science,
    Mathematics, Physics, Engineering, or a closely related
    field.

  Desirable Experience

  - Background in computational geometry, CAD/CAM, CNC
    machining, or manufacturing process modelling.
  - Familiarity with geometric kernels, CAD/CAM libraries, or
    simulation tools.
  - Experience in high-performance computing, parallelisation,
    or GPU programming.
  - Exposure to modern software practices such as CI/CD, code
    review, and automated testing.
  - Experience with machine learning or optimisation techniques
    (e.g., reinforcement learning, heuristic optimisation,
    constraint solving).

  Benefits Stock Options Annual Performance Equity Award 36
  days of annual leave including public holidays Leading
  medical plan Life Insurance 4 Weeks paid Sabbatical leave
  every 4 years Enhanced primary, secondary and adoption
  parental pay & leave (maternity/paternity) Monthly hackdays
  and quarterly hackathons and more... Equal Opportunities
  Statement We are proud to be an equal opportunity employer,
  valuing individuality and embracing all people. The success
  of CloudNC is a result of diversity of thought. We recognise
  this comes from people truly belonging. We encourage
  different perspectives and skills to collaborate towards our
  mission - disrupting the manufacturing industry. We
  celebrate diversity and continually improve our inclusivity
  efforts. Job requirements
