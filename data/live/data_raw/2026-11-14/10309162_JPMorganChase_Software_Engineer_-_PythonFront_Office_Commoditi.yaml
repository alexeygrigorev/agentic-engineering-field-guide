description: |
  Be a key part of an agile team driving innovation to
  enhance, build, and deliver top-notch technology products.

  Bring your Software Engineering career to the next level and
  become an integral part of an agile front-office technology
  team where your expertise advances next-generation
  solutions. We value your contributions and empower you to
  stay at the forefront of industry trends. Join us and thrive
  in a culture built on diversity, opportunity, and respect.

  As an Athena/Python, Front Office Software Engineer at
  JPMorgan Chase within the Commercial and Investment Banking
  - Precious Metals and Agriculture - Commodities Tech team,
  you will be an integral part of an agile team that works to
  enhance, build, and deliver trusted market-leading
  technology products in a secure, stable, and scalable way.
  Drive significant business impact through your capabilities
  and contributions, and apply deep technical expertise and
  problem-solving methodologies to tackle a diverse array of
  challenges spanning multiple technologies and applications.

   Job responsibilities

  - Works closely with Precious Metals/Agriculture Trading,
    Quantitative Research, Sales, Middle Office, and other
    technology teams to gather requirements and deliver
    reliable and impactful solutions
  - Designs, develops and maintains trading applications and
    systems used by Front Office
  - Troubleshoots production issues efficiently in a time-
    sensitive environment
  - Continuously improves code quality, performance and system
    resilience by developing secure and high-quality
    production code, and reviewing and debugging code written
    by others
  - Collaborates with global technology teams seamlessly and
    work in an agile manner
  - Contributes to software engineering communities of practice
    and events that explore new and emerging technologies
  - Adds to the team culture of diversity, opportunity,
    inclusion, and respect



  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and proficient advanced experience
  - Degree in Computer Science, Information Systems, Math, or
    equivalent training and relevant experience
  - Hands-on experience delivering system design, application
    development, testing, and operational stability
  - Experience in performant, large-scale system development in
    an object-oriented or functional language such as Python,
    Java, etc.
  - Solid understanding of agile methodologies such as CI/CD,
    Application Resiliency, and Security
  - Demonstrated knowledge of software applications and
    technical processes within a technical discipline (e.g.
    Cloud, object-oriented programming, full stack development
    - end to end, quantitative finance)
  - Strong analytical and problem-solving skills
  - Enthusiastic to keep learning and growing, in technical
    aptitude and business understanding



  Preferred qualifications, capabilities, and skills

  - Software development experience in commodities, finance, or
    investment banking preferred, or willingness to rapidly
    learn the business domain
  - Willingness to become proficient and develop in Python, if
    not already a primary language
  - Ability to collaborate with other technology teams to
    deliver end to end solutions to the business in a
    constantly changing environment
  - Excellent communication skills and ability to work directly
    with both business users and engineers



