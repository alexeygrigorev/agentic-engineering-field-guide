description: |
  At Rula, we are a remote-first company that believes mental
  health is just as important as physical health. We recognize
  that mental health issues can be complex and multifaceted,
  and we are dedicated to treating the whole person, not just
  the symptoms.

  We aim to create a world where mental health is no longer
  stigmatized or marginalized, but rather is embraced as an
  integral part of one's overall well-being.

  We believe that by providing quality care that is both
  evidence-based and compassionate, we can empower individuals
  to take charge of their mental health and achieve their full
  potential. We are passionate about making a positive impact
  on the lives of those struggling with mental health issues
  and we strive to be a force for positive change in the field
  of mental healthcare.

  About the Role

  We’re looking for a Staff Software Engineer to join our
  Partnerships Referrals & Conversions engineering team. This
  team is focused on managing patient referrals including
  building scalable referral pathways for partners and
  referral-centric patient experiences. You will build and
  evolve systems behind referral management, partner data
  management, and patient booking experiences.

  As a Staff Engineer, you’ll play a central role in shaping
  this direction by bringing order to ambiguity, designing
  durable systems, and delivering software that directly
  impacts how partners refer patients to Rula and how those
  patients experience care. As a technical leader, you’ll
  partner with your Engineering Manager, working closely with
  product managers, designers, and other engineers to align
  technical decisions enabling Rula to deliver mental health
  care to our partners’ members. Beyond your own
  contributions, you’ll amplify the effectiveness of the team
  by mentoring engineers, unblocking peers, and raising the
  technical bar across Rula. We’re looking for product-minded
  engineers who see problems, move quickly, and help the team
  build the right solution quickly.

  We expect engineers on this team to leverage AI-assisted
  development tools, including Claude Code, as a natural part
  of their workflow, not as a novelty. You’re fluent with
  these tools and are keeping up with the developing
  landscape, forming opinions on where they add value and how
  to get the best out of them to improve velocity and decrease
  time-to-value.

  Required Qualifications

  - 8+ years of related professional experience
  - Deep understanding of modern application design
    architecture, good API design patterns, security,
    performance, and scaling.
  - Experience designing and evolving system architectures with
    the ability to weigh tradeoffs and choose a suitable
    approach for the problem at hand.
  - Proven ability to lead complex technical projects across
    teams, shaping scope, estimates, and execution while
    aligning technical decisions with business goals.
  - Excellent communication skills and the ability to build
    positive relationships with partners and stakeholders
  - Fluent with AI-assisted development tools (Claude Code,
    etc.) and able to articulate both where they accelerate
    delivery and where they introduce risk or require human
    judgment.

  Preferred Qualifications

  While having the preferred qualifications enhances your
  candidacy, having all of them is not mandatory. We encourage
  all interested applicants to apply, even those who may not
  meet every preferred requirement.

  - Bachelor’s degree in Computer Science, related field, or
    comparable work experience.
  - Familiarity with modern infrastructure and tooling.
  - Experience with distributed systems development, especially
    using an event-based paradigm.
  - Experience building systems to interface or directly
    integrate with 3rd parties.
  - Comfortable troubleshooting complex production issues and
    advocating for reliability improvements.
  - Prior experience in early-stage and/or high-growth startup
    environments and comfortable navigating ambiguity while
    influencing evolving roadmaps.

  We're serious about your well-being! As part of our team,
  full-time employees receive:

  - 100% remote work environment: Working hours to support a
    healthy work-life balance, ensuring you can meet both
    professional and personal commitments (must be based in
    United States, currently not hiring in Hawaii)
  - Attractive pay and benefits: Full transparency of pay ranges
    regardless of where you live in the United States
  - Comprehensive health benefits: Medical, dental, vision,
    life, disability, and FSA/HSA
  - 401(k) plan access: Start saving for your future
  - Generous time-off policies: Including 2 company-wide
    shutdown weeks each year for self-care (for most
    employees)
  - Paid parental leave: Available for all parents, including
    birthing, non-birthing, adopting, and fostering
  - Employee Assistance Program (EAP): Supporting your mental
    and physical health
  - Quarterly department stipend: Fun team-building activities
    or in-person gatherings
  - Community and employee resource groups: Participate in
    groups that celebrate employee identity and lived
    experiences, fostering a sense of community and belonging
    for all
  - Home office stipend: New hire home office stipend & $50
    monthly stipend to help cover internet or cell phone
    expenses
  - Wellness at Rula program: Year-round wellness initiatives
    and a $50/month wellness stipend

  Our team

  We believe that diversity, equity, and inclusion are
  fundamental to our mission of making mental healthcare work
  for everyone.  We are dedicated to having a culture of
  inclusion that will support our employees in feeling safe,
  seen, heard, and valued.
