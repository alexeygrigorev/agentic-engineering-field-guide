description: |
  Authentic is a tech-enabled MGA (managing general agent). We
  design and run insurance programs for specific kinds of
  businesses, like restaurants, gyms, and power producers.
  Brokers bring us the businesses that need coverage, and
  carriers back our policies. Every program runs on a platform
  we built ourselves, and we own every line of code behind it.
  Engineers and insurance experts build it side by side in New
  York and Dayton, Ohio. Since our founding in 2022, we’ve
  grown to 80+ people and been named to the 2026 CB Insights
  Insurtech 50.

  Why this role is interesting

  Our users are underwriters, brokers and operations teams.
  They make high-stakes decisions on complex, messy data all
  day, and the tools they use either slow them down or give
  them a real edge. You'll build the tools that give them that
  edge.

  The hard parts:

  - Dense workflows for experts. An underwriter might review
    dozens of data points, apply rules that vary by state and
    program, and price a policy in one session. Making that
    fast and clear is a serious UX and architecture problem.
  - Correctness matters. A wrong rate or a missed form has real
    financial and regulatory consequences, so you'll design
    systems that are both fast to change and safe to trust.
  - New programs keep launching. Each one adds new coverages,
    rules and data. The platform has to stay flexible without
    turning into a mess.
  - Your users sit near you. You can watch an underwriter use
    what you shipped and fix the friction the same week.

  What you'll do

  - Own major product areas end to end: work with underwriters
    and product to define the problem, then design, build,
    ship and measure it.
  - Build polished, responsive interfaces in React and
    TypeScript that turn complex insurance workflows into
    tools people enjoy using.
  - Work across the stack. You'll shape APIs and contribute to
    backend services when the best solution calls for it.
  - Find the bottlenecks that slow our users or our team down,
    and fix them.
  - Raise the bar for the team through code review, mentoring
    and how you approach problems.

  In your first 90 days you might

  - Design, architect, and build a Claims product so we can
    administrate claims and feed its data into our
    underwriting processes.
  - Ship the broker-facing flow for a new program launch
  - Lead a frontend architecture improvement, such as forms,
    state or a design system

  Our stack

  React, TypeScript, Python, AWS. The team has 8 engineers and
  you'll report to the Head of Engineering.

  You might be a fit if you have

  - 5+ years building production web applications with
    TypeScript and React
  - Strong instincts for frontend architecture, state management
    and component design
  - Comfort working across the stack and collaborating on APIs
    and backend systems
  - A habit of clarifying what "good" looks like, asking sharp
    questions and driving work to done
  - A track record of shipping high-quality user experiences
    quickly
  - Experience mentoring engineers and making a team better

  Bonus points

  - Python backend experience
  - AWS or other cloud infrastructure experience
  - Experience at a high-growth startup, especially building
    from 0 to 1
  - Interest in fintech, insurtech or other regulated
    industries. No insurance background is needed; we'll teach
    you.

  Compensation

  This role pays a base salary of $188,000–$211,000 and
  includes meaningful equity, so you’ll have real ownership in
  what we’re building. Your offer will depend on your
  experience and skills.

  Our (FTE) benefits

  - Competitive salary, equity, and role trajectory
  - Comprehensive health benefits for you and your family
  - 401(k) plan with company match
  - Unlimited PTO
  - Paid parental leave

  About Authentic

  Authentic builds the infrastructure that program insurance
  runs on. We partner with leading brokerages to design and
  manage custom insurance programs, backed by A and A- rated
  carriers operating nationwide. Brokers bring the data and
  distribution. We bring everything else: the technology, the
  capacity, and the underwriting expertise to stand up
  specialized programs at speed and build them to last.  We’re
  a Series A company backed by top investors, including
  FirstMark Capital, Zigg Capital, Slow Ventures, Clocktower,
  Commerce Ventures, and Altai. We’ve grown over 15x in the
  past year with a massive market opportunity ahead.

  Authentic is committed to building an inclusive working
  environment regardless of gender, sexual orientation,
  religion, ethnicity, race, education, age, or other personal
  characteristics. We believe that people do their best work
  when they can be themselves, and different perspectives and
  experiences make us stronger as a team. We’re proud of the
  supportive and inclusive workplace we're building together
  and are always working to make it even better.
