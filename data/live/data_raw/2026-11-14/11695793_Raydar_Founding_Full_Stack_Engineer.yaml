description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Act as an early engineering hire responsible for the core
  application across backend, data and frontend. Partner
  closely with company leadership and end users to turn needs
  into shipped, dependable software, including the connections
  to outside business systems.

  What you'll do

  - Work with users to understand their needs, then design,
    build and release new product capabilities.

  - Model data securely with a clear audit trail and build
    event-based processing pipelines.

  - Create internal and public-facing APIs plus a live dashboard
    that shows customers what is happening in their
    operations.

  - Build connectors to partner business systems and a
    dependable layer that keeps data consistent across them.

  - Set up monitoring, reliability targets and on-call routines
    for business-critical workflows.

  - Move across backend, data and frontend work to tackle
    whatever matters most at the time.

  Requirements

  What we're looking for

  - Roughly 2 to 5 years as a software engineer, ideally with
    time in a small startup where you carried product work
    from start to finish.

  - Strong command of TypeScript and Node.js.

  - Solid Postgres skills in schema design and query tuning.

  - Ability to build user-facing interfaces with React alongside
    backend code.

  - Practical knowledge of asynchronous, message-driven designs,
    including webhooks and keeping third-party systems
    aligned.

  - Capacity to turn an ambiguous request into a working release
    without detailed specifications, favoring the simplest
    workable approach.

  - A genuine commitment to reliability for systems the business
    depends on.

  - Dedication and availability that fit a fast-paced early-
    stage environment.

  - Clear, direct communication, including with non-technical
    customers, and a collaborative, low-ego working style.

  Bonus points

  - Previous experience as one of the first engineers at a young
    company.

  - Familiarity with logistics, supply chain, freight, consumer
    goods or B2B software.

  - Exposure to electronic data interchange standards.

  - Time spent at a technology company in the shipping or
    logistics space.

  - Knowledge of managed backend platforms.

  - Production experience with LLM-powered or autonomous agent
    workflows.

  Benefits

  Compensation and benefits

  - Base salary: USD 160,000 to 220,000 per year

  - Equity

  - Health insurance

  Location and work model

  - Brooklyn, NY, United States

  - Hybrid, with a strong preference for in-person most of the
    week

  - Full-time
