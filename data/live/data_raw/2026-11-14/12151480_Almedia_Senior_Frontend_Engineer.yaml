description: |
  Our bar is high, and this is the best place for ambitious
  builders.

  Bootstrapped and profitable from day one, Almedia is
  Germany’s fastest-growing company (FT1000). Join us as we
  build the global leader in rewards, at a $1bn+ revenue run
  rate and climbing fast.

  Senior Frontend Engineer

  This role is for a highly experienced and autonomous
  engineer who will own the frontend architecture, set a high
  bar for code quality, and significantly impact product
  direction through hands-on development and strategic
  collaboration.



  What You'll Do 🎯

  - Own the Architecture: Design, develop, and maintain a new
    codebase using React and TypeScript to create a scalable,
    clean, and efficient frontend architecture.
  - Drive Product Quality at Speed: Deliver high-quality,
    testable code at a high pace, enabling a culture of
    developer productivity and smooth feature deployment
    through efficient processes.
  - Integrate Data-Driven Decisions: Implement and manage
    integrations with external services for A/B testing and
    feature flagging to ensure the product vision is validated
    and guided by data.
  - Collaborate and Lead: Work closely with our CTO, backend
    teams, and Product to translate the product vision into a
    robust technical reality. You'll serve as a key resource
    for technical decision-making and mentor other engineers.
  - Using AI tools (Claude, Cursor, Copilot, etc.) as part of
    your everyday toolkit. We actively encourage AI-assisted
    development.



  What You'll Bring 💡

  - Frontend Mastery: Extensive experience (7+ years) in
    developing scalable applications with TypeScript and
    React.
  - Full-Stack Acumen: A functional understanding of JS backends
    (e.g., NestJS) to facilitate seamless collaboration and
    end-to-end development.
  - Quality & Performance Focus: A proven ability to write high-
    quality, testable code and a passion for optimizing
    performance to ensure a smooth user experience.
  - Design Sensitivity: A great eye for design and the ability
    to work independently to create a polished, user-friendly
    interface.
  - Bonus: Experience in writing React Native applications is a
    plus.



  What Makes You a Great Fit 🌟

  - You're a self-starter with a strong ownership mindset who
    takes full accountability for the entire frontend stack.
  - You have a "Move Fast" mentality, prioritizing developer
    productivity to deliver high-quality code at an
    accelerated pace.
  - You are creative and solution-driven, able to navigate and
    solve tough challenges with ease.
  - You're an excellent communicator with great English skills,
    both written and spoken, to collaborate effectively with
    all stakeholders.
  - You have a "Focus on Impact" mindset, ensuring your work
    directly contributes to business decisions and has a
    clear, measurable effect on the product's success.



  Why Almedia? 🎁

  - Scale With Almedia: Grow alongside a startup that has been
    profitable from day one.
  - Central Berlin Office: Work from a fully-stocked modern
    office built for collaboration, accessible from all around
    Berlin.
  - Other Benefits: Transport subsidy, breakfasts and lunches,
    language learning, Urban Sports Club, and more.



  We believe in fostering talent, evaluating all skill levels
  during the hiring process, and providing a clear path for
  growth. Almedia is an equal opportunity employer. We embrace
  and celebrate diversity, and encourage individuals from all
  backgrounds to apply.
