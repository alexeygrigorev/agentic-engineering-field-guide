  Software Engineer I (Remote)

  As the leading innovator in Vehicle-to-Government (V2Gov)
  technology, Vitu is transforming the way vehicles,
  businesses, government, and drivers interact with one
  another.

  Vitu provides innovative, cutting-edge services to the motor
  vehicle industry. Our namesake solution manages titling and
  registration transactions in all 50 states and across
  multiple locations — all on one platform. With the mission
  of expanding and automating Vehicle-to-Government (V2Gov)
  transactions, the Vitu platform is reimagining how drivers,
  businesses and governments interact with vehicles. Vitu has
  offices in California, Florida, Georgia, Illinois, Indiana,
  Kentucky, Minnesota, Montana, North Carolina, New Hampshire,
  New Jersey, New York, Ohio, Oregon, Pennsylvania, and
  Virginia.

  Job Summary

  The Software Engineer writes and maintains code within
  applications and systems to implement capabilities and
  features, improve performance and maintainability, while
  reducing technical debt in alignment with product and
  technology roadmaps. The Software Engineer plays a role in
  Agile planning, providing advice and guidance, and
  monitoring emerging trends.

  Key Responsibilities

  - Works with Product Management to understand the challenges
    that customers and end users face in their day-to-day work
    and partner with them to design viable solutions.
  - Recommends viable solutions to processes, technology, and
    interfaces that improve the effectiveness of the team and
    reduce technical debt.
  - Foresees capacity requirements for component usage and
    identifies limitations.
  - Provides input into story sizing, backlog grooming, and
    release planning.
  - Contributes to product and solution designs to address
    critical issues and complex problems.
  - Builds software applications across multiple platforms in
    response to the needs of stakeholders.
  - Understands technical architecture and writes software and
    automated tests that are aligned with agreed upon
    standards.Performs trouble-shooting efforts and
    investigations when necessary.Provides ongoing support,
    monitoring, and maintenance of deployed products.
  - Actively works with less experienced software engineers
    providing technical guidance and oversight.
  - Actively participates in the engineering community, staying
    up to date on new software technologies and best practices
    and shares insights with others in the organization.

  Minimum Qualifications and Experience

  - Bachelor’s degree in Computer Science or related field or
    equivalent combination of industry related professional
    experience and education
  - 1– 3 years of working experienceWorking experience in
    design, development, and implementation of highly
    scalable, high-volume software systems and components,
    client-facing web applications, and major Internet-
    oriented applications and systems
  - Working experience realizing applications from conception
    and design, to implementation and support
  - Working experience in coding within multiple technology
    stacks (e.g. Front-end: browser and device typically using
    common client-side technologies – HTML, CSS, JavaScript;
    Back-end: server, application, database using languages
    like C#, .NET, OpenAPI/Swagger, SQL server)
  - Working experience with application lifecycle methodologies
    (e.g. agile, iterative)
  - Working experience in analysis, design and programming
  - Working experience with appropriate database technology

   Compensation



  The salary range for this position is:  $64,000 - $74,000



  The final pay for this position will be determined by
  multiple factors including, but not limited to, location,
  education, experience, training and skills.



