description: |
  Frontend Engineer

  🌍 About Outpost

  What if going global was as simple as going local?

  Outpost is building the AI global trade engine. The
  accumulated knowledge of every rule you'd need to sell
  internationally, turned into infrastructure. Tell us what
  you're selling. We'll tell you how to sell it everywhere.

  We operate as Merchant of Record or Tax of Record across 58+
  tax jurisdictions. Full liability transfer, or just the tax
  layer. We do the analysis, we handle the setup, we absorb
  the liability.

  Sell anything, anywhere. Without compromise.

  🧠 The Role

  This is a Frontend Engineer role for someone who wants to
  build intuitive interfaces for complex financial operations.

  You'll work directly with our engineering leadership to
  create the user experiences that power international
  commerce. Merchant dashboards, payment flows, tax compliance
  tools, transaction monitoring, and AI-powered analysis
  interfaces. You'll make complexity feel simple.

  We believe great design is as much about what you leave out
  as what you put in. A well-designed interface should feel
  inevitable, where every element has earned its place and
  complexity is made manageable through thoughtful design.

  This isn't just about building beautiful interfaces. You'll
  tackle challenges like displaying real-time payment flows,
  building tax compliance tools, and developing merchant
  analytics. You'll also explore how emerging technologies can
  enhance our platform, from AI-powered insights to advanced
  reporting.

  🧗 What You'll Get

  Yes, the work is intense. But in return, you'll build the
  interfaces for critical financial infrastructure handling
  hundreds of millions in volume.

  You'll have significant input into product and technical
  direction, work with a small team of experienced engineers,
  and shape how merchants experience global commerce. If you
  want to go deep on fintech product design and frontend
  architecture, this is the role.

  🧩 What You'll Build

  - Modern, responsive merchant dashboard
  - Complex financial workflows and payment interfaces
  - Tax compliance and reporting tools
  - Transaction monitoring and risk management interfaces
  - AI-powered transaction analysis and compliance tools
  - Integrations with major e-commerce platforms
  - A best in class developer experience

  🧩 What You'll Do

  Technical Development

  - Contribute to frontend architecture and development
  - Build scalable, maintainable React applications
  - Establish frontend best practices and coding standards
  - Drive technical decisions for user interface components

  Product Development

  - Create intuitive interfaces for complex financial operations
  - Design and implement responsive, cross-browser solutions
  - Build performance-optimized web applications
  - Develop reusable component libraries
  - Integrate with backend services and APIs

  Special Projects

  - Lead development of AI-enhanced user interfaces
  - Build tools for transaction analysis and insights
  - Create interfaces for automated tax compliance
  - Develop merchant self-service capabilities
  - Explore emerging technologies for platform enhancement

  💥 Example Projects

  - Build the merchant dashboard from scratch with real-time
    transaction monitoring
  - Create the tax compliance interface that makes multi-
    jurisdiction filings feel simple
  - Design and implement payment flow visualizations that
    surface issues instantly
  - Build AI-powered tools for transaction analysis and anomaly
    detection
  - Create the integration setup experience for Shopify and
    other e-commerce platforms
  - Develop the self-service onboarding flow that gets merchants
    live faster
  - Build a component library that accelerates future product
    development

  🧱 What We're Looking For

  Ideal background:

  - TypeScript with strong typing practices and type modeling
  - React with functional components, hooks, context, routing
  - Modular declarative code that prioritises readability and
    reusability
  - Track record of building complex web applications
  - Understanding of UI/UX best practices
  - Comfortable using LLMs and LLM-powered IDEs to scaffold,
    refactor, and prototype

  Bonus:

  - Prior exposure to frontend platform work: design systems,
    code generation, testing frameworks
  - Experience building internal tools or dashboards
  - Design sensibility or experience collaborating closely with
    designers
  - Fintech and compliance experience
  - Familiarity with LLM agent frameworks or tools like v0,
    Lovable
  - Understanding of cross-border commerce
  - E-commerce or SaaS experience

  Signals we care about:

  - You build interfaces that make complex things feel simple
  - You care about the details that make a product feel polished
  - You're comfortable with ambiguity and figuring things out
  - You contribute to product discussions, not just implement
    specs
  - You want to build from scratch, not maintain existing
    systems
  - Bias for action. You ship, you learn, you iterate

  What this role is not:

  - Not maintaining existing systems. You'll build from scratch
  - Not a role where you wait to be told what to do
  - Not someone who needs heavy process or detailed specs to be
    effective
  - Not pure execution without input into product direction

  🚀 Why This Role Is Different

  Most frontend roles are about building features on top of
  existing products. This role is about creating the entire
  user experience for complex financial infrastructure.

  You'll design how merchants interact with payments, tax
  compliance, and global commerce. You'll explore how AI can
  enhance these interfaces. You'll have real input into what
  we build and how it works.

  If you're excited about building complex financial
  interfaces and exploring innovative solutions in
  international commerce, this is the role.

  🦾 Outpost Team

  Our team were leaders at Revolut, Airwallex, Adyen and
  Wayflyer, and we're backed by top-tier investors who have
  built or backed some of the world's leading fintechs.

  🧾 What We Offer

  - Equity and salary in a well-funded startup
  - Ability to own your work and move fast
  - Direct access to the founding team
  - A global mission with real impact
  - Low politics, high output
  - A culture of builders, not talkers

  🧭 Working Style

  We work together in person in London or Amsterdam. We
  believe the hardest problems are solved in the room.

