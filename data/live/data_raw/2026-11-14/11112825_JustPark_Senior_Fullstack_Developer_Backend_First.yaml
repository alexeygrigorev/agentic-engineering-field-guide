description: |
  About JustPark

  JustPark is the premier partner offering both B2B solutions
  for destinations and B2C services for drivers, giving us the
  best of both worlds. We simplify the entire parking
  experience. From venues and councils to private driveways,
  our platform makes it simple for drivers to find, book, and
  pay for parking—while empowering our operating partners to
  deliver exceptional parking experiences.

  We’ve always believed parking should be easier—from end to
  end. That’s why we, two trailblazing companies—ParkHub and
  JustPark—have come together to make that vision a reality.

  ParkHub revolutionized event parking in the US, optimizing
  venue operations for a smoother, stress-free experience.
  JustPark transformed parking in the UK, turning the hunt for
  a spot into a simple, seamless task.

  Now, as one unified company, we’re combining expertise to
  offer a full-service, frictionless parking solution for both
  businesses and consumers.

  About the role

  The Senior Fullstack Developer ships high-impact product
  features across JustPark’s stack, working closely with
  product, design and other engineers to deliver value to
  customers. You’ll design, build and ship features end-to-end
  across web, mobile or backend as needed, own meaningful
  pieces of the product surface and the systems that back
  them, and raise the bar on code quality, testing and
  engineering hygiene in your team. The role works with
  engineers in code reviews and design discussions, and
  partners with product and design to refine scope and surface
  trade-offs. You’ll contribute to on-call rotations and
  improve the reliability of what your team owns. Our team is
  moving quickly with AI adoption and you’ll have the
  opportunity to learn how to get the most of AI powered
  tooling.

  Requirements

  Responsibilities

  - Design, build and ship features end-to-end across web,
    mobile, and frontend as needed
  - Own meaningful pieces of the product surface and the systems
    that back them
  - Raise the bar on code quality, testing and engineering
    hygiene in the team
  - Mentor more junior engineers through pairing, reviews and
    design discussions
  - Partner with product and design to refine scope and surface
    trade-offs
  - Contribute to on-call and improve the reliability of what
    the team owns

  Requirements

  - 5+ years of professional software engineering experience
  - Strong skills in at least one of our backend languages (PHP,
    Go) as well as a high level of competency in TypeScript.
  - Comfortable owning features from idea to production with
    minimal hand-holding
  - Solid grounding in software design, testing and operational
    excellence
  - Demonstrated ability to collaborate with PMs and designers
    on ambiguous problems
  - Pragmatic, customer-obsessed and a strong written
    communicator
  - Comfortable with AI tooling

  Benefits

  Recharge your batteries

  - Generous holiday policy: 25 days + bank holidays + managers
    have the ability to grant up to 5 extra days for high
    performance (total of 38 days a year)
  - Free lunch on all office days via Feedr with the option to
    choose your preferred meal or cuisine everyday
  - Free snacks & drinks on all office days

  Investment in you and your wellbeing

  - Private Medical Insurance with Vitality
  - Life assurance through YuLife
  - £25 credit to use for eye tests a year
  - Free O2 concert tickets through our partnership with the O2

  Simplifying journeys so you can breathe easier

  - £50 parking credit per month to use via JustPark
  - Cycle-to-work salary sacrifice scheme
  - EV salary sacrifice car scheme via Octopus Energy

  We look out for your family

  - Enhanced parental leave with 6-months enhanced maternity
    leave and 4 weeks of fully-paid paternity leave
  - Help finding great childcare, with funded hours via Koru
    Kids

  Look after the pennies

  - Pension offering with standard and salary sacrifice pension
    options

  Success is best when it's shared

  - Quarterly away days with the whole UK team - we all go off-
    site each quarter to celebrate our achievements
  - Quarterly team social budget to recharge and bond with your
    team
  - Lots of social activities and celebrations on our gorgeous
    rooftop in King’s Cross
