description: |
  PENN Entertainment, Inc. is North America’s leading provider
  of integrated entertainment, sports content, and casino
  gaming experiences. From casinos and racetracks to online
  gaming, sports betting and entertainment content, we deliver
  the experiences people want, how and where they want them.

  We’re always on the lookout for those who are passionate
  about creating and delivering cutting-edge online gaming and
  sports media products. Whether it’s through Hollywood
  Casino, theScore Bet Sportsbook, or theScore media app,
  we’re excited to push the boundaries of what’s possible.
  These state-of-the-art platforms are powered by proprietary
  in-house technology, a key component of PENN’s omnichannel
  gaming and entertainment strategy.

  When you join PENN Entertainment’s digital team, you’ll not
  only work on these cutting-edge platforms through theScore
  and PENN Interactive, but you’ll also be part of a company
  that truly cares about your career growth. We’re committed
  to supporting you as you expand your skills and explore new
  opportunities.

  With locations throughout North America, you can build a
  future at PENN Entertainment wherever you are. If you want
  to challenge conventions in gaming, media and entertainment,
  we want to talk to you.

  About the Team As part of the Accounts team, you will be
  working with a group of talented and friendly individuals.
  Our goal is to deliver and maintain the performant,
  resilient, accurate, best-in-class software platform to
  drive player registration and authentication, identity
  verification (KYC), fraud and AML checks, geolocation
  compliance, responsible gaming enforcement, regulatory
  enforcement, and player communications (push, email, SMS)
  that is at the core of everything we do as a company. As a
  result, our stakeholders span the entire range of the
  business, and we must support them with whatever they are
  required to deliver without sacrificing the quality and
  performance we strive to maintain. This will include
  building a lot of cross-service integrations, with internal
  and external stakeholders. We are also hyper-vigilant about
  software performance, resilience, reliability, and accuracy,
  constantly tracking risks and regressions on all fronts, and
  proposing improvements where opportunities exist. The
  systems we own are among the most business-critical at PENN:
  every player signup, login, identity check, and responsible
  gaming decision runs through them, and getting them right is
  a regulatory obligation, not just an engineering goal.

   About the Work

  - Design, scale, and performance-tune REST APIs, low-latency
    gRPC services, and SQL queries powering player
    registration and authentication (OAuth2, MFA, biometrics),
    identity verification, fraud and AML screening,
    geolocation compliance, responsible gaming and self-
    exclusion enforcement, regulatory reporting, and player
    notifications, among other things.
  - Own technical problems of the highest scope and complexity,
    drafting proposals and presenting them to leadership and
    partner teams for feedback
  - Design, architect, and deliver new features end-to-end in a
    collaborative agile/scrum environment
  - Identify bottlenecks and areas of risk in production, and
    drive the changes that make the platform more scalable
  - Set up and refine monitoring and alerting in Datadog for the
    systems you own
  - Mentor engineers on the team and across teams that ship into
    our codebase, through specs, pairing, and code review
  - Interact with multiple stakeholders across a wide variety of
    business domains to deliver best in class products,
    operational improvements, and cost efficiency
    optimizations.
  - Be comfortable with bridging the gap between internal, third
    party (identity verification, fraud, geolocation, and
    messaging vendors), legacy, and modern systems; and excel
    at doing what this entails, including, data migrations,
    intermediate data translation, the building and
    stewardship of additional supporting infrastructure as
    required, etc.
  - Other duties as required.

   About You

  - You possess a minimum of 5 years of experience in Software
    engineering
  - A solid foundation in computer science, with strong
    competencies in data structures, distributed systems,
    algorithms, and software design
  - Strong grasp of production systems at scale, and experience
    identifying areas of improvement in a production
    environment through load testing and tracing
  - Experience investigating and remediating production
    performance regressions, including CPU, I/O, and memory
    hotspots as well as latency regressions in high-throughput
    services
  - Experience with on-call rotations for a production service,
    including owning release cycles end-to-end
  - Passionate about clean code architecture and software
    craftsmanship
  - Excellent written and verbal communication skills, with a
    track record of authoring tech specs, runbooks, and cross-
    team design docs that stand up to scrutiny
  - Experience with modern web frameworks and API development
    (Phoenix, Ruby on Rails, FastAPI, Laravel, Node)
  - A strong grasp of relational databases, including PostgreSQL
    and MySQL. Additionally, a strong understanding of
    relational database theory, including, but not limited to,
    normalization and denormalization, particularly from a
    flexibility vs performance mindset, is a major asset.
  - Experience with Kubernetes and comfort operating services in
    a containerized environment
  - Comfortable working in the terminal, with Git and GitHub or
    similar, and in an editor of your choice
  - Experience with testing frameworks such as ExUnit, RSpec,
    Jest, pytest, or equivalent
  - Experience with background job processing (Oban, Exq,
    Sidekiq, Celery, Beanstalkd)
  - Experience with asynchronous event handling infrastructure
    (Apache Kafka, RabbitMQ, AWS SQS/SNS, Google Cloud
    Pub/Sub)
  - Experience with agentic software development tools, building
    and using agentic workflows, and validating quality of
    agentic outputs is a major asset.
  - Experience with building authentication, identity, or other
    regulated systems with strong security and auditability is
    paramount.
  - Strong understanding of authentication and authorization
    standards (OAuth 2.0, OIDC, JWT, MFA) and secure handling
    of PII.
  - Experience integrating third-party KYC, fraud, geolocation,
    or messaging providers (e.g., push, email, SMS) is an
    asset.

  NICE TO HAVE:

  - Experience building applications in Elixir, hexagonal
    architecture, Domain-Driven Design, contribution to open
    source software, experience working at startups, passion
    for sports and/or esports
  - Experience with building financial, legal, and / or process
    accounting systems with strong correctness and
    auditability
  - Experience designing and evolving GraphQL schemas for
    product surfaces used by multiple clients (iOS, Android,
    Web) is an asset.
  - Experience building and integrating multi-client / white-
    label platforms, including geo-based routing and per-
    jurisdiction configuration
  - Familiarity with gaming regulatory requirements across
    jurisdictions (e.g., AGCO, DGE) and responsible gaming
    controls is an asset.

  What We Offer  •    Competitive compensation package •
  Fun, relaxed work environment •    Education and conference
  reimbursements. •    Opportunities for career progression
  and mentoring others

  #LI-REMOTE

  Salary Range

  $145,000—$193,000 USD

