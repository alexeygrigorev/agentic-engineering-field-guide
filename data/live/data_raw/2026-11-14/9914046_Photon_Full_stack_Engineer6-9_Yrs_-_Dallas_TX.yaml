description: |
  We are seeking a Full Stack Developer to join our dynamic
  engineering team. In this role, you will be responsible for
  designing, developing, and maintaining high-quality web
  applications using a combination of Java/Spring Boot on the
  backend and Angular on the frontend. You will work closely
  with cross-functional teams to deliver innovative and user-
  centric solutions.

  Responsibilities:

  - Designing and developing backend microservices using Java
    and Spring Boot.
  - Creating and maintaining RESTful APIs for various
    functionalities.
  - Building and integrating frontend components using Angular
    to consume backend APIs.
  - Potentially working with asynchronous communication patterns
    using Kafka.
  - Utilizing AWS S3 for data storage or asset management.
  - Collaborating with other developers, testers, and product
    managers throughout the software development lifecycle.
  - Troubleshooting and debugging issues across the full stack.

  Key Skills and Technologies: Working Experience on Fraud
  prevention is must. Backend (70-80%):

  - Java: This is the core language. You'll likely be working
    with frameworks like Spring Boot to build robust and
    scalable applications.
  - Microservices Architecture: Understanding how to design,
    develop, and deploy independent, loosely coupled services
    is crucial. This includes concepts like inter-service
    communication, service discovery, and fault tolerance.
  - REST APIs: You'll be responsible for designing and
    implementing well-structured and efficient RESTful APIs
    for communication between the frontend, other
    microservices, and external systems. This involves
    understanding HTTP methods, status codes, and data formats
    (like JSON).

  Frontend (30-20%):

  - Angular: Proficiency in Angular (TypeScript, components,
    services, routing, state management) is essential for
    building the user interface.

  Good to Have:

  - Kafka: Experience with Kafka (a distributed streaming
    platform) suggests real-time data processing, event-driven
    architectures, or message queuing.
  - AWS S3: Knowledge of Amazon S3 (Simple Storage Service)
    indicates familiarity with cloud-based object storage,
    which could be used for various purposes like storing
    static assets, backups, or data for processing.











  Compensation, Benefits and Duration



  Minimum Compensation: USD 37,000 Maximum Compensation: USD
  132,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
