description: |
  About Gusto

  At Gusto, we're on a mission to grow the small business
  economy. We handle the hard stuff — payroll, health
  insurance, 401(k)s, and HR — so owners can focus on their
  craft and their customers. With teams in Denver, San
  Francisco, and New York, we support more than 500,000 small
  businesses nationwide and are building a workplace that
  reflects the people we serve.

  All full-time employees receive competitive base pay,
  benefits, and equity (RSUs) — because everyone who helps
  build Gusto should share in its success. Offer amounts are
  determined by role, level, and location. Learn more about
  our Total Rewards philosophy.

  AI is a fundamental part of how work gets done at Gusto. We
  expect all team members to actively engage with AI tools
  relevant to their role and grow their fluency as the
  technology evolves. AI experience requirements vary by role
  and will be assessed during the interview process.

  About the Role:

  As a Staff Software Engineer on the Cloud Infrastructure
  team, you'll build automation and evolve the foundational
  systems that support Gusto's products. This is a code-driven
  infrastructure role, well suited to someone with a DevOps,
  SRE, or platform engineering background who enjoys solving
  problems that help other engineers work more effectively.
  You'll help set the architecture, Infrastructure-as-Code
  patterns, and operational standards that every Gusto
  engineer builds on, with real autonomy over how it gets
  done. Key opportunities include migrating production
  applications into a modern AWS multi-account architecture,
  strengthening disaster recovery and compliance, and
  improving the speed and reliability of our infrastructure
  tooling.

  About the Team:

  Gusto's Cloud Infrastructure team builds and operates the
  AWS foundations that the rest of our engineering
  organization depends on. We manage infrastructure as code
  with Terraform/OpenTofu and run Spacelift, the platform
  hundreds of engineers use daily to deploy infrastructure
  changes. This experienced team partners with networking,
  compute, platform, and application teams to make Gusto's
  cloud infrastructure more reliable, resilient, and easier to
  use.

  Here’s what you’ll do day-to-day:

  - Build and maintain AWS infrastructure using
    Terraform/OpenTofu, with changes managed through code
    rather than manual configuration.
  - Improve the speed, reliability, and usability of Spacelift
    workflows used by engineering teams across Gusto.
  - Partner with application and infrastructure teams to migrate
    production services into a modern AWS multi-account
    architecture.
  - Strengthen disaster recovery and compliance readiness by
    implementing and testing infrastructure resilience.
  - Refactor infrastructure code into modular, reusable
    components that simplify maintenance and future
    development.
  - Support engineering teams with cloud infrastructure needs,
    troubleshooting, and vendor integrations.
  - Leverage AI-assisted tools to accelerate infrastructure
    development, improve troubleshooting, and identify
    automation opportunities while maintaining a high bar for
    security, correctness, and reliability.
  - Participate in an on-call rotation focused on internal
    engineering support, turning recurring issues into
    automation and lasting improvements.

  Here’s what we're looking for:

  - 8+ years of hands-on experience in infrastructure, platform,
    or site reliability engineering.
  - Deep, production-level AWS expertise across compute,
    networking, identity, and security primitives.
  - Demonstrated mastery of Infrastructure as Code
    (Terraform/OpenTofu strongly preferred; Crossplane,
    CloudFormation, or similar) including module design, state
    management, and scalable patterns for large teams.
  - Experience with multi-account AWS governance — AWS
    Organizations, OU design, SCPs/RCPs, and federated
    identity via IAM Identity Center or equivalent SSO.
  - Hands-on experience with a managed IaC orchestration
    platform (Spacelift, Terraform Cloud, etc.).
  - Experience operating production infrastructure for a
    customer-facing SaaS platform, including observability
    (monitoring, logging, alerting) and participating in
    incident response.
  - Track record of driving multi-quarter infrastructure
    initiatives to completion with minimal direction.

  Bonus:

  - Operating Terraform/OpenTofu at large scale — managing
    thousands of workspaces or state files, module registries
    and versioning strategy, drift detection and remediation,
    and policy-as-code enforcement.
  - Experience in compliance-regulated environments (SOC 2, PCI,
    NIST).
  - Solid cloud networking foundations: VPC design, IP address
    management, DNS, egress control, and centralized traffic
    inspection.

  Please note that travel to Gusto's office for onboarding is
  required for this position. If you have any questions
  regarding this requirement, please share with your
  recruiter.

  Our cash compensation amount for this role is targeted at
  163,000–204,000 in Denver, and 197,000–247,000 for San
  Francisco & New York. Stock equity is additional. Final
  offer amounts are determined by multiple factors including
  candidate experience and expertise and may vary from the
  amounts listed above.

  At Gusto, we don't use titles the traditional way, as a
  signal of rank or hierarchy. Instead, our titles describe
  two things at once — your craft (what you do, e.g.
  Engineering, Design) and your scope of ownership (what
  you're accountable for) — which is why you'll see something
  like "Head of X" instead of a rank word like "Director" that
  tells you neither. Because of this, the title on this
  posting may look different from what you'd expect based on
  the scope and seniority of the role, and from how similar
  roles are typically titled elsewhere. If you have questions
  about how this role compares to your current title or level,
  your recruiter can help translate.

  Gusto has physical office spaces in Denver, San Francisco,
  and New York City. Employees who are based in those
  locations will be expected to work from the office on
  designated days approximately 2-3 days per week (or more
  depending on role). The same office expectations apply to
  all Symmetry roles, Gusto's subsidiary, whose physical
  office is in Scottsdale.

  Note: The San Francisco office expectations encompass both
  the San Francisco and San Jose metro areas.

  When approved to work from a location other than a Gusto
  office, a secure, reliable, and consistent internet
  connection is required. This includes non-office days for
  hybrid employees.

  Reliable, consistent presence: We expect regular and
  predictable attendance, whether you're working in-office,
  hybrid, or fully remote, so that you stay closely connected
  to your team, customers, and stakeholders in real time and
  ensure colleagues and customers receive the timely support
  and responsiveness they deserve.

  Our customers come from all walks of life and so do we. We
  hire great people from a wide variety of backgrounds, not
  just because it's the right thing to do, but because it
  makes our company stronger. If you share our values and our
  enthusiasm for small businesses, you will find a home at
  Gusto.

  Gusto is proud to be an equal opportunity employer. We do
  not discriminate in hiring or any employment decision based
  on race, color, religion, national origin, age, sex
  (including pregnancy, childbirth, or related medical
  conditions), marital status, ancestry, physical or mental
  disability, genetic information, veteran status, gender
  identity or expression, sexual orientation, or other
  applicable legally protected characteristic. Gusto considers
  qualified applicants with criminal histories, consistent
  with applicable federal, state and local law. Gusto is also
  committed to providing reasonable accommodations for
  qualified individuals with disabilities and disabled
  veterans in our job application procedures. We want to see
  our candidates perform to the best of their ability. If you
  require a medical or religious accommodation at any time
  throughout your candidate journey, please fill out this form
  and a member of our team will get in touch with you.

  Gusto takes security and protection of your personal
  information very seriously. Please review our Fraudulent
  Activity Disclaimer.

  Personal information collected and processed as part of your
  Gusto application will be subject to Gusto's Applicant
  Privacy Notice.
