  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Core Commerce Platform organisation
  responsible for delivering the omnichannel commerce
  capabilities that power the purchase journey, inventory
  availability, delivery promise, order processing &
  fulfilment and post-purchase experiences across channels.
  The organisation plays a critical role in ensuring products
  are available to buy, orders can be fulfilled reliably, and
  commitments made to consumers are delivered consistently.
  Through a portfolio of commerce platform capabilities, the
  organisation enables seamless omnichannel experiences while
  supporting efficient, scalable, and resilient commerce
  operations across the global digital ecosystem.

  As a Quality Engineer, you will build and validate the test
  execution for payment and transaction processing
  capabilities across omni-channel commerce platforms. You
  will be responsible for creating the functional and
  automation test scripts and execution. Working closely with
  the Lead engineer, Product Owner and Engineering Manager,
  you will ensure that the delivered omni-channel commerce
  capabilities meet the requirements to provide superior
  consumer experience.

  What you will do:

  - · Develop and maintain automated test frameworks and quality
    engineering solutions for Payments, Checkout, and
    Transaction Processing platforms across omni-channel
    commerce ecosystems.
  - · Develop robust automated tests for payment workflows,
    including authorization, capture, settlement, refunds,
    voids, chargebacks, tokenization, and payment
    reconciliation.
  - · Validate seamless payment experiences across channels and
    customer touchpoints, including credit/debit cards,
    digital wallets, gift cards, BNPL, and alternative payment
    methods.
  - · Validate payment processing, fraud prevention controls,
    transaction routing, tax calculations, promotions, and
    checkout integrations to ensure secure, accurate, and
    reliable customer experiences.
  - · Build and maintain API, integration, and contract testing
    suites for integrations with payment gateways, fraud
    management platforms, tax providers, financial systems,
    OMS, and third-party payment service providers.
  - · Collaborate with the Product Owners and Lead Engineers to
    define the testing approach, quality strategy, test
    automation roadmap, acceptance criteria, and risk-based
    validation for payment capabilities.
  - · Ensure payment solutions meet PCI-DSS, security,
    compliance, performance, reliability, and scalability
    requirements through comprehensive functional,
    integration, regression, and non-functional testing.
  - · Partner with engineering teams to support continuous
    testing, observability, production validation, and quality
    monitoring across the payment lifecycle.

  YOUR TALENT

  - · 4+ years of experience in Quality Engineering, Test
    Automation, or Software Quality Assurance, with a strong
    focus on enterprise-scale payment platforms, checkout
    systems, transaction processing, fraud prevention, or
    digital commerce solutions.
  - · Understanding payment lifecycle concepts, including
    authorization, capture, settlement, refunds, voids,
    chargebacks, tokenization, and reconciliation, and how
    these contribute to accurate and reliable transaction
    processing.
  - · Experience validating payment orchestration and
    transaction routing logic, including payment gateway
    selection, alternative payment methods, fraud screening,
    tax calculations, currency handling, and payment failure
    recovery workflows.
  - · Strong hands-on experience with Java and test automation
    frameworks such as JUnit, TestNG, REST Assured, Selenium,
    Playwright, or equivalent technologies.
  - · Understanding transaction integrity, concurrency,
    idempotency, and data consistency patterns, with the
    ability to design test strategies that validate duplicate
    payment prevention, transaction accuracy, and financial
    data consistency under high-volume loads.
  - · Proven experience in API testing, contract testing,
    integration testing, and end-to-end validation across
    payment gateways, fraud management platforms, OMS, tax
    providers, financial systems, and third-party payment
    service providers.
  - · Knowledge on omnichannel payment and checkout journeys,
    including support for credit/debit cards, digital wallets,
    gift cards, Buy Now Pay Later (BNPL), alternative payment
    methods, and multi-channel transaction flows.
  - · Experience in Test Data Management, including the creation
    and maintenance of payment-specific test data, tokenized
    payment methods, and financial transaction scenarios.
  - · Experience in cross-browser testing and tooling
    (BrowserStack or equivalent).
  - · Experience in device compatibility testing across mobile
    OS versions and device types, with a focus on mobile
    checkout and payment experiences.
  - · Experience using coding agents, LLMs, or AI-assisted
    engineering tools to improve software delivery, test
    automation efficiency, and developer productivity.

