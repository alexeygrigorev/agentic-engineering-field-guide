description: |
  Amentum is a global leader in advanced engineering and
  innovative technology solutions, trusted by the United
  States and its allies to address their most significant and
  complex challenges in science, security and sustainability.
  Headquartered in Chantilly, Virginia, we have approximately
  50,000 employees in more than 70 countries across all 7
  continents.

  The Software Engineer II will perform full stack development
  with C# program, ReactJS, MVC, Linq, and rest API
  development in NET Core platform. This position is US remote
  teleworking within the US and US Citizenship is required.



  Essential Responsibilities:

  - Under general supervision, design, develop, troubleshoot,
    and analyze software programs for computer-based systems
  - Ensure automated data feeds and system interfaces are
    working as intended
  - Participate in software requirements review, preliminary and
    critical design reviews, integration readiness review, and
    software acceptance reviews
  - Design, write, test, deploy and support software code, as
    assigned
  - Perform software upgrades in accordance with software
    quality procedures
  - Frequent inter-organizational and outside customer contacts
    on technical matters
  - Support Continuous Improvement efforts intended to improve
    the quality of existing software
  - Design and implement new or existing standard software
    application programs and reports according to project
    software standards and conventions
  - Perform other duties as assigned



  Knowledge, Skills and Abilities:

  - Deep understanding of relational databases and Microsoft SQL
    Server (T-SQL)
  - Strong knowledge of Model-View-Controller (MVC), Linq Query,
    and rest API development
  - Ability to build robust, maintainable web applications and
    services
  - Excellent communications and analytical skills required
  - Good Planning/organizing skills
  - Ability to prioritize and adapt to dynamic changes in the
    environment
  - Must be able to work under deadlines
  - Position may require travel 5%

  Minimum Education and Experience Required:

  - Typically, 3 years of C# program experience with .NET
    technology, MVC, Linq, and rest API development with a
    Bachelor’s degree in a related technical discipline (e.g.,
    BSEE, BSCS) or equivalent in Computer Science or related
    field
  - ReactJS programming experience preferred
  - Position may require the ability to pass and maintain a
    Security Clearance
  - US Citizenship is required.



  Compensation Details:

  $97k - $121k



  The compensation range or hourly rate listed for this
  position is provided as a good-faith estimate of what the
