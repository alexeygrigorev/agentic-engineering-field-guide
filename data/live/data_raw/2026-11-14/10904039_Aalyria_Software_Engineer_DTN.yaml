description: |
  About Aalyria:

  Aalyria is a leading technology company that supplies laser
  communications technology and temporospatial software-
  defined networking platforms to the aerospace industry. With
  technology acquired from Google, Aalyria is at the forefront
  of innovation in satellite and airborne mesh networks, as
  well as cislunar and deep-space communications. We are
  revolutionizing the orchestration and management of
  planetary mesh networks using any radio or optical spectrum,
  any orbit, and any hardware across land, sea, air, and
  space.

  Role Overview:

  As a Delay-Tolerant Networking (DTN) Software Engineer, you
  will be part of the UK R&D team to support the development
  of new and innovative features. You will work with other
  software engineers to evolve our DTN capability, including
  the Hardy bundle router, and integration with the Spacetime
  platform, to build features that solve impactful problems
  for our customers and partners that will change how
  communication networks are operated around the world. The
  ideal candidate should have experience with the DTN stack,
  distributed systems with cloud technologies, and solutions
  to networking, storage, queueing and other systems
  challenges.

  Key Responsibilities:

  - Develop and maintain the DTN products, platforms and APIs
    using Rust, gRPC, and Protocol Buffers
  - Build a scalable and distributed system on Kubernetes
  - Participate in the entire application lifecycle, focusing on
    coding and debugging
  - Manage cutting-edge technologies to improve legacy
    applications
  - Collaborate with Front-end developers to integrate user-
    facing elements with server side logic
  - Gather and address technical and design requirements
  - Follow emerging technologies
  - Create and deliver technical content, including
    documentation, tutorials and sample code, to assist
    developers and customers in understanding and utilizing
    ‘The Relay Network’
  - Assist the onboarding process for new customers, providing
    guidance and support to ensure successful integration of
    their existing and future systems
  - Optimizing the performance of applications for full-scale
    production deployments

  Required Qualifications:

  - Bachelor’s degree in computer programming, computer science,
    or a related field
  - Strong technical communication skills, and ability to
    communicate across multiple functions.
  - High-curiosity for both business and technology strategies,
    processes, and objectives (pushing past surface-level
    understanding to gain a granular command of different
    ecosystems)
  - Experience working with customers/end-users answering
    questions and coming up with creative solutions
  - A strong desire to pitch and sell our amazing technology!

  Preferred Qualifications:

  - Experience designing and implementing scalable and
    distributed microservice and/or event-driven software
    architectures
  - Experience writing scalable software, bolstered with unit
    and integration testing, leveraging language-specific
    strengths (e.g. concurrency control), integrating it with
    various CNCF technologies, and containerising it
  - Experience with delay-tolerant networking
  - Familiarity with delay-tolerant networking communications
    standards and protocols (e.g. CCSDS/IETF BPv7, BPSec,
    etc.)
  - Experience creating technical content such as documentation,
    tutorials, or blog posts
  - Experience with cloud platforms and services such as Google
    Cloud Platform or AWS

  If you are a passionate and driven Software Engineer with a
  strong focus on Developer Relations and customer onboarding,
  ready to engage with developers, promote Spacetime, and
  ensure a successful developer and customer experience,
  Aalyria is the perfect place for you. Apply today and join
  our team of innovative professionals.

  What We Offer:

  - Innovative Environment: Work at a cutting-edge company
    shaping the future of aerospace communications.
  - Impactful Work: Directly contribute to critical national
    security programs and initiatives.
  - Growth Opportunities: Expand your career with opportunities
    for professional development and advancement.
  - Inclusive Culture: Be part of a collaborative, supportive,
    and inclusive workplace where your contributions matter.
  - Flexibility: Flexible working arrangements including hybrid
    remote/in-office schedules.
  - Compensation and Equity: Competitive salary, comprehensive
    benefits (401(k), dental, vision, health, life insurance),
    paid time off, and equity options.

  Benefits:

  - Competitive salary
  - Pension
  - Health insurance
  - Equity

  Work Requirements & Location:

  - Applicants must have the right to work in the United
    Kingdom.
  - Work Location: Remote working within the UK.

  Equal Opportunity Employer Statement:

  Aalyria is an Equal Opportunity Employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. We do not discriminate based
  on race, color, religion, sex (including pregnancy, gender
  identity, and sexual orientation), national origin, age,
  disability status, genetic information, protected veteran
  status, or any other characteristic protected by law.
  Qualified applicants from all backgrounds are encouraged to
  apply.
