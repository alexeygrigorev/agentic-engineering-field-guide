description: |
  About Sandbar

  Sandbar is an interface company in New York City. We aim to
  expand human thinking. Our team has built software, ML,
  hardware, and consumer products across Meta, CTRL-labs,
  Apple, Peloton, and Equinox.

  Our first product is Stream, a private voice ring that
  extends your thinking. Stream has been featured in WSJ,
  Bloomberg, Wired, and Time's Best Inventions of the Year.

  Join us in creating technology that extends human thinking.

  About

  We’re looking for an experienced infrastructure engineer to
  help build Stream, a new conversational interface. You will
  be responsible for developing a highly scalable real-time
  production service with various steps of ML and data
  processing. You’ll work closely with other mobile and
  firmware engineers to deliver the foundations for new human-
  computer interactions.

  Responsibilities

  - Architect a high-uptime, low-maintenance, and reliable
    distributed inference system
  - Lead observability and oncall
  - Achieve very low latency & jitter with attention to P99
    performance
  - Develop a safe rollout to production process in partnership
    with ML, SW, and mobile engineers
  - Implement data pipelines for user-facing features and
    internal tooling

  Qualifications

  - Proficient in Python and Javascript
  - Experience in shipping consumer facing interactive real-time
    services
  - 2+ years owning a live production system in a small team,
    for large N of users
  - 2+ years working in a big infra teams (Google / Meta / etc)
  - Technical leadership for building a robust process with the
    team
  - Strong ownership on healthy live service

  FTE Benefits

  - Health, vision, and dental benefits
  - Company-sponsored 401(k)
  - Unlimited PTO and sick time
  - Early stage equity
