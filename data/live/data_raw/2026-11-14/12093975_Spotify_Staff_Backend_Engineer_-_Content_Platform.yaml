description: |
  We design Spotify’s consumer experience—end to end, moment
  to moment, across every screen, platform, and partner
  integration. Our mission is to make listening feel
  effortless, personal, and joyful for billions of users
  around the world. That means turning complexity into clarity
  across hundreds of touchpoints—from our mobile and desktop
  apps to the smart speakers, TVs, cars, and integrations
  where Spotify shows up every day. If it touches a consumer,
  we shape it. We bring deep insight into human behavior,
  design, and technology to craft experiences that feel
  intuitive, expressive, and unmistakably Spotify. Policy &
  Safety (P&S) is a domain within Content Platform in the
  Experience Mission, responsible for building Spotify’s
  content moderation and regulatory compliance infrastructure.
  This includes rule engines, enforcement pipelines, policy
  configuration systems, and compliance data platforms that
  ensure safety at scale.

  The team operates at the intersection of backend platform
  engineering, machine learning systems, and regulatory
  compliance, partnering closely with Licensing, Trust &
  Safety, Legal, and Public Affairs. Sitting on the critical
  path for every new content type and feature, P&S enables
  safety-by-default experiences while supporting global
  regulatory requirements and evolving product innovation.

