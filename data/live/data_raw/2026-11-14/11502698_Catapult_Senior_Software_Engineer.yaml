description: |
  SENIOR SOFTWARE ENGINEER

  Catapult is building the future of sports performance
  technology, with a mission to Unleash the Potential of every
  athlete and team on earth. We don't just work in the
  sporting industry; we are actively changing it.  Since 2006,
  our solutions have been leading the way in sports
  performance software, science, and data, in a world where 1%
  can literally mean the difference between winning and
  losing.

  We work with over 5,000+ teams around the world, empowering
  coaches, managers and trainers in premier teams in the NFL,
  NBA, NHL, MLS, EPL, AFL, NRL, NCAA and more. We provide the
  information they need to optimize athletes’ health, game-day
  readiness, and performance, as well as in-game tactics.

  Catapult is a sports technology company that empowers
  professional teams to make data-driven decisions. We deliver
  health, performance, video, and AI insights from the locker
  room to competitive environments, ensuring every decision is
  an opportunity to gain an advantage, sharpen performance,
  and build lasting success.

  WE WANT PEOPLE WHO ARE PASSIONATE ABOUT SOLVING HARD
  PROBLEMS

  We are looking for a Senior Software Engineer to help build
  the Perch camera system,

  Based in London (hybrid), you will work across platform,
  perception, and ML systems. You will help us improve how we
  collect, process, and analyze performance data at scale,
  spanning from devices collecting real-time to backend
  services and ML infrastructure. All of which will have a
  direct impact on customers and their experiences with the
  product.

  This role suits a strong generalist who has seen many parts
  of engineering. You might have worked on any of the
  following: high-throughput systems, computer vision,
  robotics, ML infrastructure, or other complex applications.
  Our ideal candidate brings strong engineering judgment, good
  technical range, and the ability to learn quickly.

  You will be hands-on, working in Python and C++ on devices
  and services in use by our customers every day.

  WHAT YOU’LL DO

  - Design and implement algorithms for 3D object tracking,
    segmentation, and motion recognition on embedded hardware.
  - Train and iterate on ML models — from dataset curation
    through training, evaluation, and deployment to edge
    devices.
  - Help bring ML, computer vision, or signal-processing systems
    into production with tight performance constraints
  - Build reliable application features and services that
    customers use in real environments.
  - Analyze production data to find system limits, product
    issues, and opportunities for improvement.
  - Collaborate closely with the embedded platform team on model
    optimization and inference performance, and with the
    applications team on how tracking data becomes product
    features.

  WHAT YOU’LL NEED

  - 4+ years of software engineering experience in production
    systems.
  - Strong skill in Python and backend engineering.
  - Working knowledge of C++ or a strong reason to be effective
    in performance-critical code.
  - Experience with data-intensive systems, distributed systems,
    parallel processing, or efficient data pipelines.
  - Exposure to ML, ML infrastructure, signal processing, real-
    time systems, computer vision, or related applied
    technical areas.
  - A track record of shipping reliable software, not only
    prototypes.
  - Strong debugging skills and the ability to find the root
    cause of complex system behavior.
  - Clear communication and good judgment when tradeoffs are not
    simple.
  - Curiosity, adaptability, and the desire to learn new
    technical areas.

  Nice to have — and what would make you exceptional:

  - Experience with computer vision, depth cameras, pose
    estimation, tracking, or 3D data.
  - Experience with ML model deployment, feature pipelines,
    evaluation systems, or data quality tools.
  - Experience with streaming data, event systems, real-time
    processing, or low-latency applications.
  - Experience with numerical methods, signal processing,
    filtering, state estimation, or robotics.

  WHAT YOUR SUCCESS WILL LOOK LIKE

  - In 6 months time, you understand the main systems, ship
    reliable changes, and help improve a meaningful data or
    product workflow. You give valuable technical input
    towards solving problems across backend, data, and
    perception systems.
  - In 12 months time, you have made a measurable impact on
    system reliability, product capability, or data quality.
    You own important parts of the architecture and help the
    team make better technical decisions.

  WHY CATAPULT?

  - We have amazing people. We promise you’ll work with some of
    the most ambitious,  intelligent people in an exciting
    industry, and do some of the best work of your life.
  - We encourage our people to engage in constructive, open, and
    honest communication to make Catapult extraordinary.
  - We work in a collaborative yet challenging environment to
    consistently improve our performance, which in turn
    impacts our customers' performance.
  - Our workforce spans more than 20 countries. You'll have the
    opportunity to work with people from multiple
    nationalities and cultures, and to build your global
    awareness.
  - We value improvement and development. We are challenging
    ourselves to continuously grow and become a high-
    performance company. That means we maintain a growth
    mindset in everything we do, and our people are always
    looking for ways to improve.  There is an unlimited
    opportunity to grow, do more, and do better.

  Whether you’re interested in sports or not, you’ll have the
  satisfaction of knowing your work is supporting some of the
  most successful teams and athletes on the planet!

  Research shows that while men apply for jobs when they meet
  an average of 60% of the criteria, women and other
  marginalized groups tend only to apply when they check every
  box. So if you have what it takes, but don't meet every
  single point in our job ad, please still get in touch! We
  would love to have a chat and see if you could be a great
  addition to our team. We are building the future of sports
  performance. Our priority is to find the brightest talent
  who can add to our team culture, actively contribute, and be
  excited about what they do.

  All offers of employment are subject to Catapult's positive
  prehire check. To find out more, please contact the Talent
  Partner for this role.
