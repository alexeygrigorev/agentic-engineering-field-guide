description: |
  We are seeking a hands-on Staff Software Engineer to provide
  technical leadership across product areas. You will shape
  architecture, guide complex engineering initiatives, and
  help teams deliver scalable, secure, and reliable software.

  This remote role is based in USA/Canada and requires strong
  collaboration across distributed engineering, product, and
  business teams.

  Key Responsibilities

  - Lead the design and evolution of scalable, secure, highly
    available systems and platforms.
  - Define architectural direction, engineering standards, and
    technical best practices across teams.
  - Drive large technical initiatives such as modernization,
    cloud transformation, platform scalability, and developer
    productivity improvements.
  - Lead technical planning, design reviews, and risk mitigation
    for cross-team initiatives.
  - Partner with Product Management, Engineering Managers,
    Architects, and stakeholders to turn business goals into
    sustainable technical solutions.
  - Mentor engineers and strengthen technical leadership, design
    practices, and knowledge sharing across the organization.

  Required Qualifications

  - Bachelor's degree in Computer Science, Engineering, or a
    related field, or equivalent practical experience.
  - 10+ years of professional software development experience,
    including leadership of technical initiatives.
  - Strong hands-on experience with TypeScript, Node.js, and C#
    in enterprise-scale applications.
  - Experience designing distributed systems, microservices,
    event-driven architectures, and cloud-native solutions.
  - Strong AWS and/or Azure experience, including security,
    observability, automation, and production operations.
  - Experience with GitHub Actions, DevOps practices, and
    Terraform.
  - Deep understanding of scalability, performance, resilience,
    and reliability engineering.
  - Strong communication and stakeholder-management skills.

  Preferred Qualifications

  - Experience building or operating production AI/LLM-enabled
    applications, such as model integrations, evaluation
    frameworks, or AI-assisted developer tooling.
  - Experience with highly available SaaS production systems.

