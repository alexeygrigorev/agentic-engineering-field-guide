description: |
  FX Client Platforms - Senior UI Software Engineer (Vice
  President)

  About the Role

  We are seeking a Senior Applications Developer to join a
  team delivering pricing solutions for the Foreign Exchange
  (FX) business. You will cover the full software development
  lifecycle — analysis, design, implementation, and testing —
  while providing technical leadership to the team.

  Primary Responsibilities

  - Design and develop high-quality trading GUIs providing
    compelling user experiences for internal and external
    traders
  - Define and enforce interoperability standards across web
    applications using FDC3, and REST/WebSocket APIs.
    Experience with OpenFin or Interop is desirable but not
    essential.
  - Drive AI integration within the development lifecycle —
    including AI-assisted coding, automated test generation,
    and intelligent monitoring
  - Influence performance engineering across the UI stack:
    profiling, rendering optimisation, bundle analysis, and
    low-latency data delivery
  - Contribute and influence architecture decisions for large-
    scale front-end systems, including monorepo governance and
    design system adoption across globally distributed teams
  - Champion best practices in TDD, code review, and AI-assisted
    development tooling (e.g., GitHub Copilot)
  - Liaise with UI leads, UX, Product, and Sales groups to
    translate business requirements into robust technical
    solutions
  - Mentor junior engineers and contribute to team growth and
    delivery standards

  Essential Experience

  - Solid experience building and deploying complex web
    application platforms in production
  - Expert-level proficiency in **TypeScript, React, HTML5, CSS,
    and JavaScript (ES6+)**
  - Demonstrated experience profiling and optimising high
    throughput React applications (Web Workers, virtual
    rendering, memory management)
  - Experience with desktop containers: **Chromium, Electron, or
    OpenFin**; familiarity with **FDC3** for cross-application
    interoperability
  - Experience with real-time messaging systems: **Kafka,
    Solace, or Tibco**
  - Experience with CI/CD pipelines (Jenkins or equivalent) and
    Agile methodologies
  - Strong communication skills with experience in globally
    distributed teams

  Desirable

  - Experience building real-time trading platforms
  - FX or Fixed Income product knowledge
  - Java REST API development experience
  - Familiarity with AI-assisted development tools

  This job description provides a high-level review of the
  types of work performed. Other job-related duties may be
  assigned as required.

  What we’ll provide you

  By joining Citi London, you will not only be part of a
  business casual workplace with a hybrid working model (up to
  2 days working at home per week), but also receive a
  competitive base salary (which is annually reviewed), and
  enjoy a whole host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources

  Visit our Global Benefits page to learn more.

  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

