description: |
  The Role

  At Candid Health, we're seeking an experienced Engineering
  Manager to support and enable our Product Engineering team
  in planning, executing, and delivering the Candid platform
  to our healthcare provider customers who rely on it for
  mission-critical financial and operational workflows. Your
  team will be responsible for building and maintaining key
  components of a complex and and evolving architecture
  according to industry best in class quality, durability and
  performance standards. In this role, you will be part of a
  deeply cross-functional team, responsible for guiding and
  collaborating with skilled engineers and tech leads,
  fostering their growth and ensuring they contribute
  effectively. Collaboration with company leadership, sales,
  and product teams will be crucial as you help define and
  execute our long-term product strategy.

  What You’ll Do

  - Act as a steward of results and deliver outcomes: Leveraging
    an expansive breadth of ownership for the priorities of
    both our teams and customers, you will have critical
    influence on balancing competing needs and managing
    tradeoffs.
  - Oversee and lead implementation: Support your team in
    executing against the technical vision. Scoping projects
    and reviewing plans are a levered use of your time to
    achieve our collective vision. You’ll also become familiar
    with our codebase and drive best practices for design,
    delivery and collaboration across multiple organizations.
  - Manage technical teams: Lead one or more efficient,
    successful, and motivated teams. Experiment with and
    implement the team systems that work to achieve your
    teams’ outcomes. Collaborate with product, leadership, and
    others within engineering to build Candid’s flagship
    products. You will influence direction for technical leads
    and individual contributors.
  - Mentor and grow people: Investing in Candid’s growth means
    investing in the development of the people we hire. In
    this role you will help define pathways to grow for your
    team, both in formal performance management and organic
    opportunities to take on more scope.
  - Define product technical strategy: Partner with company and
    product leadership to understand and contribute to
    critical product and company strategy. With that in mind,
    you will be entrusted to design the systems, architecture,
    and processes to build in order to hit short-term and
    long-term objectives.

  Responsibilities

  - Owning engineering practice, you are responsible for
    building and maintaining critical services and features
  - Leading teams in planning, prioritization, tracking, through
    delivery of impactful results
  - Supporting teams in achieving and preserving a high level of
    technical quality, reliability, and developer satisfaction
  - Influencing partners and peers to identify obstacles to
    delivery and improve on our products while eliminating
    friction and redundancies
  - Make data driven decisions on your sphere of ownership to
    continually improve reliability, performance, scale, and
    reduce operational load
  - Diving deep into software architecture, leveraging domain
    knowledge to achieve business objectives.
  - Recruiting exceptional engineers and managers in
    collaboration with Candid’s talent acquisition team
  - Mentor and coach your direct reports and those around you,
    working with your peers to create healthy and well-
    executing teams that grow with equal velocity to the
    business

  Who You Are

  - You have Bachelors of Science or Bachelors of Art in
    Computer Science, Computer Engineering, Math or other
    similar degree.
  - You have 6+ years of experience in a Software Engineering
    Leadership position, as a technical lead, manager, or
    manager of managers.
  - You’ve successfully led people and teams to shipping high-
    quality features in strategic product areas. You’ve
    managed and executed against ambitious roadmaps
  - You have a track record of excellent technical decision
    making; you know the right architecture and patterns to
    build functional, durable, and maintainable product.
  - You know how to manage in multiple directions, including
    laterally and upward: you know how to advocate for
    yourself and your team: where to get into the weeds and
    where to delegate.
  - You have successfully interviewed, hired, and mentored
    product focused engineering teams. You collaborate well
    with staffing partners and stakeholders through all phases
    of the hiring lifecycle and are a talent magnet.
  - You’re a clear and concise communicator; you enjoy the
    challenge of explaining complicated ideas in simple terms,
    both in-person and in writing.

  Pay Transparency

  The estimated starting annual base salary range for this
  position is $220,000 to $322,000 USD. The listed range is a
  guideline from Pave data, and the actual base salary may be
  modified based on factors including job-related skills,
  experience/qualifications, interview performance, market
  data, etc. Total compensation for this position may also
  include equity, sales incentives (for sales roles), and
  employee benefits. Given Candid Health’s funding and size,
  we heavily value the potential upside from equity in our
  compensation package. Further note that Candid Health has
  minimal hierarchy and titles, but has broad ranges of
  experience represented within roles.

