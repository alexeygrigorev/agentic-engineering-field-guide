description: |
  Full Stack Developer(DISA)

  Location:  Remote,USA

  Citizenship : This position requires an US Citizenship.
  Active Secret Clearance is required

  Who We Are

  Horizon Industries Limited (Horizon) is a dynamic IT and
  Management Consulting firm based in the Washington, DC area.
  Founded in 1996, Horizon Industries Limited (Horizon) has
  evolved into a company of highly qualified professionals
  that provides full-cycle IT consulting and Management
  support in both the private and public sectors.

  Horizon’s culture is based on our core values, and we PRIDE
  ourselves on a diverse, employee, and family-centric
  approach.

  Key Responsibilities

  We’re seeking a Full Stack Developer to support the
  engineering, modernization, and sustainment of the Defense
  Information Systems Agency’s Integrated Defense Enterprise
  Acquisition System (IDEAS). This role contributes to full
  lifecycle development, system integration, troubleshooting,
  testing, and Tier 2/3 operational support in a secure DoD
  environment. This position requires strong experience in
  Java, JavaScript, SQL, system integration, cloud
  environments, and modern agile development practices.

  Duties of a Full Stack Developer may include:

  - Design, develop, test, and maintain application components
    using:
    - Java (JDK)
    - JavaScript, HTML, CSS
    - SQL and database-driven components
  - Develop secure REST and SOAP web services.
  - Build and support integrations with external DoD and federal
    systems.
  - Implement software according to DoD cybersecurity, test, and
    configuration standards.
  - Support deployment and release activities in cloud-hosted
    environments (e.g., AWS GovCloud).
  - Work within 2–6 week sprint cycles using government-provided
    tools (e.g., JIRA or equivalent).
  - Collaborate with Product Owners and SMEs to refine user
    stories and acceptance criteria.
  - Participate in sprint planning, stand-ups, backlog grooming,
    and demos.
  - Provide estimates, maintain story updates, and deliver
    development documentation.
  - Provide Tier 2 and Tier 3 technical support to resolve
    incidents, defects, and user-reported issues.
  - Conduct root-cause analysis and implement corrective
    actions.
  - Maintain integration flows and ensure data accuracy and
    system reliability.
  - Monitor environments and resolve performance or
    functionality issues.
  - Develop and maintain:
    - Technical specifications
    - Interface and integration documentation
    - Test scripts and execution results
    - Release notes and version control logs
  - Support Change Advisory Boards (CAB) and Configuration
    Control Boards (CCB) as required.
  - Follow DISA, DoD, and program-specific development standards
    and processes.
  - Work effectively with government stakeholders, engineering
    teams, functional SMEs, testers, and security personnel.
  - Support risk identification, mitigation planning, and
    continuous improvement.
  - Communicate technical issues and recommendations clearly to
    both technical and non-technical audiences.

   Required Skills / Experience:

  - 5+ years of full-stack development experience.
  - Proficiency with: Java (JDK), JavaScript, HTML, CSS, SQL and
    relational databases, Web service development (REST/SOAP),
    CI/CD tools and pipelines, Middleware (WebLogic, Apache,
    Tomcat), Data integration / ETL layers
  - Experience with: Cloud environments (e.g., AWS, Azure, or
    GovCloud equivalents), Version control (Git, SVN, etc.),
    Defensive coding and secure development practices
  - Experience working within Agile/Scrum environments.

  Education: Bachelor’s degree in Computer Science,
  Engineering, Information Systems, or related field; or
  equivalent experience.

  Why you will love working with us/ Perks

  - A comprehensive benefits package including healthcare
    (medical, dental, vision and disability)
  - a 401 (k) program where you are 100% vested from day one
    with an employer match after 90 days.
  - An Educational Assistance program.
  - a Student Loan Repayment Program
  - Gym Reimbursement Program.
  - Paid Time off
  - Dynamics, a passionate, multi-disciplinary team of creative
    minds to work with, and many more.

  Horizon is an Equal Employment Opportunity employer, and it
  is our policy to consider all applicants for employment. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, or national origin.

