description: |
  About Warp

  Warp is the AI-native Employee Management Platform for
  ambitious companies. HRIS, payroll, benefits, IT, tax
  compliance, and more, all built from scratch on one AI-
  native platform.

  Every company runs on its people, and the software that
  manages them is some of the oldest in the enterprise.
  Incumbents like ADP and Workday built their businesses on
  complexity and large ops teams. Warp is built for AI to be
  the primary operator. Every advance in LLM capability widens
  our lead.

  We process $X billion in annual payments for high-growth
  companies across all 50 US states + globally.

  We've raised $85M from Battery Ventures, Sapphire Ventures,
  Peak XV, Sound Ventures (Ashton Kutcher), and Y Combinator,
  alongside operators including Tobi Lütke (Shopify), Claire
  Hughes Johnson (Stripe), and the founders of Dropbox and
  Replit. Our team comes from MIT, Ramp, Brex, Google, Gusto,
  Rippling, and more.

  We hire people who ship constantly, own outcomes, and care
  about craft. If you want to automate an entire category of
  work that every company depends on, this is the place.

  About the Role

  As a Senior Software Engineer on the Product team, you'll
  take deep ownership of major product areas and drive them
  forward. You'll make architectural decisions, work directly
  with customers and leadership to define what gets built, and
  set the technical standard for the team. This is a high-
  ownership role at a company where engineers drive outcomes,
  not just execute tickets.

  What You'll Do

  - Own significant product surfaces end-to-end, from data model
    to user interface
  - Drive architectural decisions and set technical direction
    for your areas
  - Interface directly with customers and sales to define and
    prioritize what gets built
  - Mentor and elevate other engineers on the team
  - Collaborate directly with the CTO and CEO on product
    strategy
  - Help us scale 10x in the next year

  You'll Be Good for This Role If You

  - Take extreme ownership of your work and its outcomes
  - Are deeply product-minded. You care about the end user, not
    just the code.
  - Can lead technical decisions and bring others along
  - Have a track record of shipping impactful features at scale
  - Thrive with ambiguity and high velocity

  What You Need

  - 5+ years of experience building full-stack applications
  - Experience leading technical projects across a team
  - Strong expertise in modern, strongly typed languages
  - Track record of owning features from spec to production
  - High agency and strong communication skills
  - Willingness to work from our NYC office five days a week

  Benefits at Warp:

  - 100% Health Coverage: Comprehensive medical, dental, and
    vision plans for you and your dependents.
  - 401(k) Matching: Start investing in your future from day
    one.
  - Flexible PTO: We offer uncapped flexible PTO, meaning you’re
    trusted to take the time you need to recharge while
    balancing your responsibilities and team commitments.
  - Commuter Benefits: Pre-tax commuter benefits for your daily
    trip to our NYC office.
  - Catered Lunch Daily: Great food, every day, on us. No meal
    prep, no decision fatigue.
  - Quarterly Offsites: Beautiful locations to connect as a
    team. Past locations include Spain, Catskills, and San
    Francisco.

  Warp is based in New York City, and most of our team works
  together in-office 5x per week. Please refer to the top of
  this page for this position's hiring location and working
  model.
