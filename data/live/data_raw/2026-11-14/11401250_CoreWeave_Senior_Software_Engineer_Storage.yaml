description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do:

  The Object Storage Team at CoreWeave is responsible for the
  product capabilities and data plane function of CoreWeave’s
  managed storage products. We build reliable, scalable
  storage solutions with segment leading performance. Storage
  engine works with engineering teams across infrastructure,
  compute, and platform to ensure our storage services meet
  the needs of the world’s most demanding AI workloads.

  About the role:

  - Design and Implement distributed storage solutions to
    support scaling data intensive AI workloads.
  - Contribute to the development of exabyte-scale,
    S3-compatible object storage and integrate dedicated
    storage clusters into diverse customer environments.
  - Work with technologies such as RDMA, GPU Direct Storage, and
    distributed filesystems protocols such as NFS or FUSE to
    optimize storage performance and efficiency.
  - Lead efforts to improve the reliability, durability,
    security, and observability of our storage stack.
  - Collaborate with operations teams to monitor, troubleshoot,
    and improve storage systems in production environments.
  - Set the bar for developing metrics and dashboards to provide
    visibility into storage performance and health.
  - Analyze telemetry and system data to drive improvements in
    throughput, latency, and resilience.
  - Work cross-functionally with platform, product, and
    infrastructure teams to deliver seamless storage
    capabilities across the stack.
  - Share your knowledge and mentor other engineers on best
    practices in building distributed, high-performance
    systems.

  Who You Are:

  - Bachelor’s, Master’s, or PhD degree in Computer Science,
    Engineering, or a related field.
  - 8–10+ years of experience working in storage systems
    engineering or infrastructure.
  - Strong hands-on experience with object storage or
    distributed filesystems in production environments.
  - Experience with one or more storage protocols (e.g. S3, NFS)
    and file systems such as Ceph, DAOS, or similar.
  - Proficiency in a systems programming language such as Go, C,
    or Rust.
  - Proficiency leveraging AI tools to augment software
    development.
  - Familiarity with storage observability tools and telemetry
    pipelines (e.g., ClickHouse, Prometheus, Grafana).
  - Experience working with cloud-native infrastructure,
    Kubernetes, and scalable system architectures.

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You love to grow and push the boundaries of your expertise
  - You’re curious about distributed storage and the demands
    AI/ML workloads
  - You’re an expert in data persistence on physical media, high
    performance data transfer using RDMA, or resilient
    distributed systems.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and provides the opportunity to
  develop innovative solutions to complex problems. As we get
  set for take off, the growth opportunities within the
  organization are constantly expanding. You will be
  surrounded by some of the best talent in the industry, who
  will want to learn from you, too. Come join us!

  The base salary range for this role is $143,000 to $210,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

