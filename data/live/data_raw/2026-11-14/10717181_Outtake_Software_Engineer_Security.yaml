description: |
  About Outtake

  Outtake exists to empower and facilitate trust for a
  digital-first world. Today, impersonation, fraud, AI-driven
  scams, and identity abuse spread faster than any security
  team can respond to. So we built something different: an
  agentic AI platform that proactively detects, monitors, and
  takes down impersonators, automating protection in hours,
  not weeks.



  Built by ex-Palantir, ex-CTO/founders, and ex-Notion
  engineers, Outtake is designed for clarity, autonomy, and
  velocity. Our goal is ambitious: become the trust layer of
  the modern internet. And we intend to do it with a lean,
  dense, exceptionally talented team.



  Outtake is backed by top-tier investors and operators who
  believe in our mission and our model. With strong financial
  footing and a long runway, we prioritize creating an
  environment where people can do the best work of their
  careers.

  The Role

  This is a foundational security hire. You will be our second
  security hire, taking on massive ownership and the ability
  to shape the function from the ground up, with a direct line
  to how security scales with the company as we grow.

  Engineering at Outtake is built on ownership, clarity, and
  end-to-end impact. We hire entrepreneurial engineers who
  think in systems, not tickets. Our teams are flat and
  autonomous: engineers ship fast, make product decisions, and
  own outcomes from concept to deployment. We optimize for
  grit and velocity, which means every engineer operates with
  the scope, influence, and equity of a future CTO.

  This is a hands-on security engineering role. You will own
  the security posture of our cloud infrastructure, build our
  detection and response capabilities, and design the access
  architecture that keeps our systems and customers safe.

  What you'll do

  - Own the security posture of our cloud infrastructure: AWS,
    EKS, Vercel, Supabase
  - Shape our agentic AI security posture to help build trust on
    the internet
  - Build detection and response with logging pipelines,
    detections, and the tooling behind incident response.
  - Design and operate our secrets, credential, and access
    management architecture across our services and CI.
  - Partner with engineering on secure-by-default patterns: IAM,
    network segmentation, privilege, and access control.

  What we're looking for

  - 3+ years in infrastructure/product security, or platform
    engineering with strong security ownership
  - Hands-on cloud security (AWS preferred), experience with an
    orchestration platform (Kubernetes, etc), and solid
    networking fundamentals (VPCs, network policies).
  - Comfort writing and shipping code in your language of choice
  - Real incident response experience as an IC, including
    communicating with non-security stakeholders under
    pressure
  - Pragmatism about the tradeoffs between security, velocity,
    and developer experience at an early-stage company

  Life at Outtake

  - Office: For those in NY, we are an in-person team (5 days a
    week, with flexibility as needed) working out of a
    stunning waterfront office in Brooklyn. Collaboration,
    speed, and clarity matter.
  - Health: 100% company-paid medical, dental, and vision for
    employees.
  - Time Away: Flexible PTO. We trust adults to manage energy,
    not clock time.
  - Culture & Team: Annual company retreats and regular in-
    person events.

  Outtake is an equal opportunity employer. We are committed
  to building a diverse, inclusive team.
