description: |
  We are looking for inquisitive problem solvers to join our
  team as a Graduate Engineer

  Mako is a leading options market maker with a global trading
  footprint. It has been at the forefront of options market
  making for over 20 years, from the open outcry trading pits
  to screen trading and automated algorithmic execution
  strategies that are driving the future of the industry.

  From offices in London, Amsterdam, Dublin, Singapore,
  Sydney, Brisbane and Chengdu, Mako offers the best in class
  liquidity solutions across Equities, Fixed Income,
  Commodities and FX derivatives markets and prides itself in
  its entrepreneurial, collaborative and philanthropic
  culture.

  A Unique Programme for Aspiring Engineer

  Mako’s Graduate Engineer Programme is an immersive and
  structured programme specially designed to give our
  graduates the opportunity to develop in-depth knowledge and
  experience of the industry. As a graduate, you will be part
  of a structured training programme designed to provide you
  with hands-on experience and early exposure to production-
  relevant work within our Software team, alongside formal
  training and development opportunities.

  What we need from you

  Most of our engineers have a degree in a STEM subject and
  what they all have in common is having a pragmatic, problem-
  solving mind-set and strong quantitative skills.
  Additionally, we are looking for:

  - A strong understanding of algorithms and data structures
  - Knowledge of at least one mainstream OOP language such as
    C++, C#, Java, JavaScript or Go
  - Working knowledge of C++, as our live coding interviews are
    conducted in C++
  - An upper second class degree in an STEM based subject or
    equivalent.
  - An interest in financial markets

  It would be excellent if you had:

  - Experience of asynchronous and multi-threaded programming
  - An appreciation for clean, readable, testable code
  - A good understanding of networks and network programming
  - An understanding of computer architecture and how it relates
    to the performance of your code

  Experience with the following tools and languages is
  beneficial:

  - Python, shell scripting, CMake, Jenkins, PCAP/Wireshark, C,
    static analysers, a range of compilers.



  We are Mako

  At Mako, we are welcoming, inclusive and collaborative. We
  work fast and smart in a supportive and dress-down
  environment that allows colleagues to be themselves and
  achieve great things. We uphold the principles of a flat
  structure that offers unrivalled engagement with senior
  leadership and career development opportunities. We have a
  comprehensive benefits package, including:

  - Flexible leave and flexible working policies
  - Private health and dental insurance
  - Generous pension scheme
  - Free access to the Mako gym
  - Employee wellbeing guidance and support
  - Opportunity to become involved in the rewarding work of the
    Mako Foundation



  PROGRAMME HIGHLIGHTS

  Work in a Fast Paced Real-Time Engineer Environment

  From the outset, Graduate Engineers are introduced to the
  team and its duties. Our low latency derivatives trading
  system is written in-house. It is implemented in C++ and
  runs on Linux.

  The Front Office engineering team is responsible for
  designing and implementing all aspects of Mako’s proprietary
  trading system. This includes algorithms, pricing models,
  user interfaces and connectivity to most major derivatives
  venues and third-party trading platforms.

  Learn From Highly Experienced Engineers

  As a Graduate Engineer, you will be mentored by some of the
  most experienced professionals in the business, working in
  pragmatic, self-organising teams that collaborate closely
  with traders, hardware engineers, and support staff.

  Our teams use an Agile development model to deliver tangible
  business value. By leveraging modern software practices and
  continuous integration pipelines, our engineers rapidly
  transform trading ideas into profitable automated
  strategies.

  We provide graduates with dedicated mentorship and
  comprehensive training in both technical and soft skills,
  preparing you to partner effectively with stakeholders and
  solve complex trading challenges. Technology is central to
  everything we do, and our teams are composed of
  knowledgeable, motivated, and friendly problem-solvers who
  thrive in Mako's highly supportive and collaborative
  culture.

  Recruitment Process

  At Mako, we want you to have the best possible experience,
  so we've outlined what to expect from our recruitment
  process to help you prepare for each stage.

  - Initial Online AssessmentShortly after you apply, you'll
    receive an online test. We recommend completing it
    promptly in a calm, focused environment.
  - Technical Coding TestIf your assessment is successful and
    your profile aligns with the role; you’ll be invited to
    complete an online technical coding assessment.
  - Live Coding InterviewsNext, you'll participate in two rounds
    of live coding interviews, conducted in C++.
  - Final Panel InterviewIf you progress past the live coding
    stage, we’ll schedule a final interview with a panel of
    our Senior Engineers and HR. Again, please check your
    email (including spam folders) for scheduling details.
  - Offer StageOnce all interviews are completed, offers will be
    made to successful candidates.



  If you require any support or adjustments with the
  application process or have any questions about the
  application process, please contact hr@mako.com .
