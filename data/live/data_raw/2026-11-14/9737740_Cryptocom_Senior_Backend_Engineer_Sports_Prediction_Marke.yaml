description: |
  About Us



  OG.com is a fast-growing, CFTC-regulated Prediction Market
  platform powered by cutting-edge technology. We’re building
  an engaging marketplace where users trade on real-world
  outcomes - from major sports and elections to cultural and
  financial events. With a sleek mobile-first app and a
  passionate community, we’re redefining how people interact
  with news, probabilities, and financial markets. OG.com runs
  on the rails of North American Derivatives Exchange, Inc.
  (NADEX), a CFTC-regulated exchange operating since 2004 and
  was acquired by Crypto.com in 2022.

  ABOUT THE ROLE

  We are seeking a highly skilled Mid-to-Senior Backend
  Engineer to spearhead the growth of our 24/7 high-throughput
  infrastructure, with a particular focus on expanding our
  core domains into the sports, prediction ecosystem. This
  role demands an engineer who thrives within a fast-paced,
  startup-minded ecosystem, possessing a deep domain
  understanding of sports platforms / prediction environments,
  and capable of keeping critical transactional networks
  running flawlessly around the clock.

  RESPONSIBILITIES

  REQUIREMENTS

  Benefits

  Competitive salary Attractive annual leave entitlement
  including: birthday, work anniversary 401(k) plan with
  employer match Eligible for company-sponsored group health,
  dental, vision, and life/disability insurance Work
  Flexibility Adoption. Flexi-work hour and hybrid set-up
  Aspire career alternatives through us. Our internal mobility
  program can offer employees a diverse scope.

  Our benefits packages vary depending on region requirements,
  you can learn more from our talent acquisition team.

  About OG

  OG, a Crypto.com company, offers CFTC-compliant technology
  to offer access to a federally regulated derivatives
  platform to trade, engage with others, climb the
  leaderboard, and where it pays to be right. OG provides
  sports fans and consumers with the opportunity to act on
  uncertainty, capitalize on the future, and celebrate triumph
  through a most comprehensive offering of sports and cultural
  event contracts. Make your call now at https://OG.com.

  About Crypto.com

  Founded in 2016, Crypto.com is trusted by millions of users
  worldwide and is the industry leader in regulatory
  compliance, security and privacy. Our vision is simple:
  Cryptocurrency in Every Wallet™. Crypto.com is committed to
  accelerating the adoption of cryptocurrency through
  innovation and empowering the next generation of builders,
  creators, and entrepreneurs to develop a fairer and more
  equitable digital ecosystem.  Crypto.com | Derivatives North
  America (CDNA) is an affiliate of Crypto.com and is
  registered with the Commodity Futures Trading Commission
  (CFTC) as a designated contract market and derivatives
  clearing organization. CDNA offers market access, through
  various technology services providers and brands, including
  OG, for the trading of prediction market contracts, as well
  as economic and cryptocurrency event contracts. Margined
  trading of prediction market contracts is subject to the
  certification of such products with the CFTC.

  Personal data provided by applicants will be used for
  recruitment purposes only.

  Please note that only shortlisted candidates will be
  contacted.
