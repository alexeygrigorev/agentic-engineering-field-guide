description: |
  Description

  At Qodo, we’re building an AI Code Review platform that
  helps developers move fast, ship with confidence, and
  elevate code quality across the SDLC through deep, scalable
  codebase understanding.

  We’re seeking a Senior Backend Engineer to join our Shift-
  left Solutions team. This team is focused on bringing code
  review directly into developer workflows - integrating with
  the tools engineers use every day like Claude Code, Cursor,
  Copilot, and other AI-powered development environments.

  This is a foundational role where you'll help shape how
  developers interact with code quality tooling, working
  closely with a collaborative team of senior engineers who
  value both moving quickly and building thoughtfully

  Responsibilities

  - Build developer-first integrations: Design and implement
    integrations with modern development tools and AI coding
    assistants that feel natural and helpful to use
  - End-to-End Ownership: Lead projects from design through
    production, taking responsibility for technical decisions
    and their outcomes
  - Technical Leadership: Drive architectural discussions,
    establish engineering practices, mentor team members, and
    raise the bar for engineering quality
  - Collaborate across teams: Partner with our engineering teams
    across the globe to align on architecture and share
    learnings

  Our Technical Stack

  - Backend: Python, FastAPI
  - Data Stores: PostgreSQL, Redis
  - AI/ML: OpenAI and other LLM integrations
  - Infrastructure: GCP

  Requirements

  - 7+ years of hands-on experience building high-performance
    backend systems or scalable developer tooling
  - Strong expertise in Python and modern backend development
    practices
  - A collaborative approach to problem-solving and a
    willingness to share knowledge with teammates
  - Comfortable in a fast-paced environment where you move
    quickly without compromising on quality

  Bonus Points

  - Familiarity with AI coding assistants (Claude Code, Cursor,
    GitHub Copilot, etc.)
  - Familiarity with GenAI product development
  - Previous work on early-stage or founding engineering teams

  If you’re excited about the role but not sure you tick every
  box, please feel comfortable applying. We’d love to hear
  from you!

  For this position at Qodo, we offer:

  - All Qodo team members are also eligible for stock options,
    reflecting our belief in shared ownership and long-term
    growth
  - Comprehensive medical, dental, and vision plans for you and
    your dependents, with company contributions toward your
    premiums
  - 401(k) plan
  - Commuter Allowance: We support flexible work, and for those
    who travel to the office two or more times a week, Qodo
    provides a commuter allowance to cover part of your travel
    costs
  - Paid Time-Off: 23 vacation days
