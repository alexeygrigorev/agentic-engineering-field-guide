description: |
  # About the Job

  As a **Full Stack Developer** specializing in **Node.js,
  React, and TypeScript**, you will be an integral part of our
  engineering team, building modern, scalable web applications
  from front-end interfaces to back-end services. You will
  collaborate with designers, product managers, and fellow
  engineers to deliver high-quality software solutions while
  embracing innovation, clean architecture, and AI-assisted
  development practices in a fast-paced environment.

  ## Responsibilities

  * Design, develop, and maintain scalable web applications
  using **React.js**, **Node.js**, and **TypeScript** * Build
  responsive and intuitive user interfaces with a strong focus
  on performance and usability * Develop secure and efficient
  RESTful APIs and backend services * Collaborate with cross-
  functional teams to define, design, and deliver new product
  features * Optimize application performance, troubleshoot
  issues, and resolve bugs across the full technology stack *
  Write clean, maintainable, and well-documented code
  following industry best practices * Participate in code
  reviews, technical discussions, and architecture planning *
  Integrate third-party services, cloud platforms, and
  external APIs * Contribute to continuous improvement by
  adopting modern development tools and automation practices *
  Utilize AI-powered development tools to improve productivity
  and software quality

  ## Requirements

  * Minimum **5 years of professional experience** developing
  applications with **Node.js** and **React.js** * Strong
  proficiency in **JavaScript (ES6+)** and **TypeScript** *
  Experience building and consuming **RESTful APIs** and
  microservice-based architectures * Experience working with
  **SQL and NoSQL databases** such as PostgreSQL, MySQL, or
  MongoDB * Solid understanding of **Git** and collaborative
  development workflows * Familiarity with authentication and
  authorization mechanisms such as JWT or OAuth * Strong
  analytical, debugging, and problem-solving skills * Ability
  to work independently in a remote, collaborative environment
  * Good written and verbal English communication skills

  ### Nice to Have

  * Experience with **Next.js** * Experience with **Docker**,
  **Kubernetes**, and containerized deployments * Knowledge of
  **Redis**, message queues, caching strategies, and scalable
  architectures * Experience deploying applications on cloud
  platforms such as AWS, Vercel, or Google Cloud * Familiarity
  with CI/CD pipelines and DevOps practices * Experience
  integrating AI services or Large Language Models (LLMs) into
  production applications * Previous experience in startups,
  SaaS, fintech, or fast-growing technology companies *
  Bachelor's or Master's degree in Computer Science, Software
  Engineering, or a related field

  ## What We Offer

  * Competitive compensation based on experience * Fully
  remote work with flexible scheduling * Opportunity to work
  with cutting-edge AI and modern web technologies *
  Professional growth through challenging international
  projects * Collaborative and supportive engineering culture
  * Long-term career development opportunities within a
  growing technology company

