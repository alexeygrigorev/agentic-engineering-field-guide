description: |
  The Opportunity As a Digital Engineering Consultant (PLM
  Implementation) Manager, you will specialize in optimizing
  operational efficiency and effectiveness within our
  Operations Consulting practice. You will work closely with
  clients to analyze product development lifecycles, identify
  bottlenecks, and develop strategies to enhance speed to
  market, reduce costs, and improve quality. As a Manager, you
  will lead teams and manage client accounts, focusing on
  strategic planning and mentoring junior staff. You are
  accountable for confirming project success and maintaining
  standards. Enhancing your leadership style, you motivate,
  develop, and inspire others to deliver quality. You are
  responsible for coaching, leveraging team members' unique
  strengths, and managing performance to deliver on client
  expectations. In this role at PwC, you will provide guidance
  on implementing lean manufacturing principles, optimizing
  supply chain integration, and leveraging digital
  technologies. You will take ownership of projects,
  confirming their successful planning, budgeting, execution,
  and completion. By embracing technology and innovation, you
  will enhance your delivery and encourage others to do the
  same. You are expected to lead with integrity and
  authenticity, articulating our purpose and values in a
  meaningful way. Responsibilities
  - Leading the implementation of Product Lifecycle Management
    (PLM) solutions to optimize product development processes
  - Analyzing product development lifecycles to identify
    bottlenecks and develop strategies for enhancing speed to
    market
  - Developing operational strategies to streamline processes
    and improve productivity for clients
  - Guiding teams in the application of lean manufacturing
    principles and supply chain integration
  - Leveraging digital technologies to enhance manufacturing
    processes and reduce costs
  - Coaching team members to leverage their strengths and manage
    performance to meet client expectations
  - Conducting feasibility studies and market trend analysis to
    inform product strategy and positioning
  - Utilizing Six Sigma methodologies to improve quality and
    operational efficiency
  - Collaborating with stakeholders to address conflicts and
    engage in critical conversations
  - Upholding professional and technical standards, including
    compliance with PwC's code of conduct and independence
    requirements
  What You Must Have
  - At least a Bachelor's degree
  - At least 5 years of experience
  What Sets You Apart
  - Preference for at least one of the following fields of
    study: Analytics/Data Science, Artificial
    Intelligence/Robotics, Biology/Biomedical Sciences,
    Business Administration/Management, Computer
    Science/Information Systems, Engineering, Environmental
    Science/Sustainability, Health Administration/Public
    Health, Mathematics/Statistics, Operations/Supply Chain,
    Project/Technology Management, Science
  - Demonstrating proficiency in Product Lifecycle Management
    (PLM) systems
  - Supporting/Leading end-to-end Product Lifecycle Management
    (PLM) system implementations
  - Configuring and deploying Siemens Teamcenter or PTC
    Windchill solutions
  - Integrating PLM platforms with engineering, manufacturing,
    and enterprise systems
  - Utilizing Lean Manufacturing principles to optimize
    processes
  - Excelling in strategic planning and execution for product
    development
  - Embracing emerging technologies to drive innovation in
    manufacturing
  - Managing complex projects with a focus on quality and
    timelines
  - Leading teams with a focus on coaching and development
