description: |
  About Charlotte Tilbury Beauty

  Founded in 2013 by world‑renowned makeup artist and beauty
  entrepreneur Charlotte Tilbury CBE, Charlotte Tilbury Beauty
  has transformed the global beauty industry with one mission
  to empower everyone, everywhere to look and feel like the
  most confident version of themselves. With our easy‑to‑use,
  easy‑to‑choose, easy‑to‑gift icons, we’ve become one of the
  most talked‑about beauty brands on the planet - and the
  magic is only growing.

  Today, we’re a global beauty phenomenon, scaling at record
  speed across 50+ markets with over 3,000 Dream Team members
  bringing the Tilbury magic to life every single day. Across
  the world, our Retail Teams and Magic Offices work
  hand‑in‑hand to shape the Charlotte Tilbury experience -
  from the glamour of London and the style capitals of Europe,
  to the energy of the Americas, the vibrant beauty hubs of
  the Middle East and the fast‑growing innovation centres
  across APAC. Every region brings its own sparkle, culture
  and community, creating the unmistakable magic of Team
  Tilbury.

  We’re bold. We’re disruptive. We’re powered by creativity,
  innovation and industry‑leading tech. And as we continue to
  break records across countries, channels and categories,
  we’re looking for extraordinary talent to join us.

  About the role  We work in Scrum or Kanban teams, with a
  strong emphasis on cross-functional collaboration. You’ll
  partner closely with Engineers, QA, Product Managers, and
  Designers to build robust, scalable solutions that are as
  elegant as they are effective. We care deeply about quality,
  performance, and observability, and we’re always open to
  challenging convention when it leads to better outcomes.

  As Android Software Engineer you will

  We’re looking for motivated, curious, and collaborative
  engineers who are excited to build game-changing features
  with luxury-level polish and reliability. If you love
  solving problems, working across disciplines, and bringing
  ideas to life, you’ll thrive here.

  - Developing new features and maintaining our existing Android
    codebase

  - Collaborating with cross-functional teams to ensure we’re
    building the right things, the right way

  - Contributing to mobile CI/CD pipelines for efficient Google
    Play delivery

  - Writing test automation to ensure high-quality, reliable
    releases

  - Championing performance, accessibility, and user experience

  Who will you work with  Engineering Team About you Proven
  native Android development experience using modern Kotlin
  and Jetpack Compose.

  - Strong understanding of architectural patterns, separation
    of concerns, and scalable app design.

  - Proficiency in unit and UI testing with standard Android
    frameworks.

  - Practical knowledge of dependency injection and Kotlin
    Coroutines.

  - Familiarity with RESTful APIs, networking libraries, and
    data serialization.

  - Ability to use telemetry, analytics, performance monitoring,
    and A/B testing to validate ideas and measure impact.

  - Knowledge of CI/CD tools, including Fastlane and GitHub
    Actions.

  - Commitment to clean code and continuous learning.

  - Familiarity with AI tooling to support software development
    and problem-solving

  Charlotte Tilbury is a fast‑paced, dynamic and ever‑evolving
  environment where agility, ambition and a passion for
  excellence help our teams thrive. We look for people who
  want to grow, innovate and be part of a truly global
  #DreamTeam.

  While we outline the experience and skills we believe set
  candidates up for success, they’re a guide - not a barrier.
  If you can demonstrate the capabilities needed for the role,
  we’d love to hear from you, whether you have more or less
  experience than listed.

  Why join us?

  - Be a part of this values driven, high growth, magical
    journey with an ultimate vision to empower everyone,
    everywhere to be the best version of themselves

  - We’re a hybrid model with flexibility, allowing you to work
    how best suits you

  - 25 days holiday (plus bank holidays) with an additional day
    to celebrate your birthday

  - Inclusive parental leave policy that supports all parents
    and carers throughout their parenting and caring journey

  - Financial security and planning with our pension and life
    assurance for all

  - Wellness and social benefits including Medicash, Employee
    Assist Programs and regular social connects with
    colleagues

  - Bring your furry friend to work with you on our allocated
    dog friendly days and spaces

  - And not to forget our generous product discount and gifting!

  At Charlotte Tilbury Beauty, our mission is to empower
  everyone, everywhere, to feel like the most beautiful and
  confident version of themselves. We bring this to life by
  welcoming people from diverse backgrounds, cultures,
  identities, and perspectives into our global team. A
  workforce that reflects the world around us helps us better
  serve our communities, our customers, our colleagues, and
  every candidate who takes part in our recruitment process.

  Want a closer look at life at Charlotte Tilbury Beauty?
  Follow our LinkedIn page! For updates, stories, and
  behind‑the‑scenes moments.
