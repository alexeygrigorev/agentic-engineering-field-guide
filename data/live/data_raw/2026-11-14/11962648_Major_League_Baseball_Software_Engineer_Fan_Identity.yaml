description: |
  Major League Baseball is looking for a Software Engineer,
  Fan Identity to build and operate core platforms that power
  MLB’s business across fan platforms. The Fan Identity Team
  is responsible for architecture, securing, and managing the
  digital identities of millions of fans across a massive
  digital ecosystem (ticketing apps, e-commerce stores,
  streaming platforms, and ballpark-related apps). This team
  is also responsible for how fan data is aggregated, stored,
  and compliant with global privacy laws. We care about
  security along with high throughput, reliability,
  performance, and a culture of thoughtful engineering,
  learning, and mentorship.

  You’ll become a key contributor on our team, building and
  owning production applications and services that power fan
  platforms and collaborating closely within an agile team to
  deliver best-in-class solutions. The ideal candidate is a
  self-motivated engineer with strong experience in
  application development and a proven ability to learn
  quickly and deliver high-quality results.

  Responsibilities

  - Develop production applications: Build and maintain services
    and user interfaces using core technologies such as Java,
    Spring Boot, TypeScript, React, PostgreSQL, Queues, Google
    Cloud, Kubernetes, and more
  - Maintain and debug software: Instrument applications with
    logs, metrics, and traces. Use them to diagnose and
    resolve production issues. Build dashboards and alerts,
    and participate in a minimally interruptive on call
    rotation
  - Collaborate and communicate: Contribute across the full
    software development lifecycle. Planning, requirements
    gathering, design, development, testing, and maintenance.
    Provide thorough code reviews, seek feedback on your own
    work, and partner with product owners to ensure a strong
    user experience and right sized scope
  - Continuously improve quality: Add unit and integration
    tests, fix bugs, reduce technical debt, and stay current
    with evolving technologies
  - Keep learning: Seek feedback, pair program, and grow skills
    across our stack, including backend, frontend, data, and
    cloud

  Qualifications & Skills

  - 3+ years of professional experience designing, building, and
    maintaining large-scale, full stack systems
  - Proficiency in at least one modern language such as Java,
    Python, TypeScript and Node, or Go
  - Demonstrated proficiency using a modern JavaScript framework
  - Hands on experience in Web APIs and Git
  - A strong foundation with relational databases such as
    PostgreSQL and writing simple queries
  - Excellent problem solving and communication skills, with a
    passion for collaborating in a fast paced, agile
    environment
  - Exposure to containers and cloud concepts, or eagerness to
    learn quickly

  Core Traits

  - Results-oriented: You work with your team to clarify
    ambiguous tasks, design and implement solutions
    efficiently, and communicate progress, challenges, and
    blockers effectively
  - Technically strong: You have broad and deep technical
    knowledge, capable of building applications end-to-end
    from UI to database. You understand web application and
    microservice architectures and know when to apply
    transactional vs. eventual consistency models
  - Learner’s mindset: You’re always seeking to learn, ask
    thoughtful questions, and act quickly on feedback
  - Collaborative teammate: You communicate clearly and
    respectfully, foster a supportive team environment, and
    handle differing opinions with professionalism and
    openness
  - AI-augmented, not AI-dependent: You use AI tools to assist,
    not replace, thoughtful engineering and human judgment
  - Ownership and accountability: You take pride in your work,
    feel a deep sense of ownership, and reflect on both
    successes and setbacks to continually improve

  Preferred Skills

  - Cloud Platforms: Hands on experience with Google Cloud
    Platform
  - Caching: Knowledge of Redis or Valkey
  - Asynchronous Messaging: Familiarity with message brokers
    like ActiveMQ, Kafka, or RabbitMQ
  - Content Delivery Networks (CDNs): Experience with Fastly,
    Cloudflare, or Akamai
  - Customer Identity and Access Management (CIAM): Deploying
    and managing Customer Identity and Access Management
    platforms

  Salary Range: $120,000 - $155,000 (Base Salary) + Bonus

  As a candidate for this position, your salary and related
  aspects of compensation will be contingent upon your work
  experience, education, skills, and any other factors MLB
  considers relevant to the hiring decision. In addition to
  your salary, MLB believes in providing a competitive
  compensation and benefits package for its employees.

  Top MLB Perks & Benefits

  - Competitive Benefits Package
  - Company 401K Contribution
  - Paid Time Off and Holidays
  - Paid Parental Leave
  - Access to Free Tickets to Baseball Games & MLB.TV
  - Discounts at MLB Store | MLBShop.com
  - Employee Assistance Programs (EAP)
  - Onsite/Online Training & Development Programs
  - Tuition Reimbursement
  - Disability Benefits (short term and long term)
  - Life and Accidental Death Insurance
  - Pet Insurance

  Why MLB?

  Major League Baseball (MLB) is the most historic of the
  major professional sports leagues in the United States and
  Canada. Employees love working at MLB because of the culture
  of growth, teamwork, and professionalism. Employees who are
  most successful at MLB take initiative, know how to identify
  problems and provide solutions, and always put the Team
  first. For those ready to step up to the plate and join the
  major leagues, MLB takes the same approach as teams do with
  their players: empowering our “workforce athletes” to be at
  their best by engineering experiences that put employees in
  the best position to succeed. Major League Baseball is
  looking for candidates who are passionate about growing
  America’s pastime to best serve its fans for decades to
  come.

