description: |
  We are not working with external recruiting partners at this
  time, please apply directly to the role if you have further
  interest in joining Vise

  Engineering at Vise has the unique opportunity to use
  technology to revolutionize the investment industry. Team
  members are given ownership and trust with the understanding
  that they are supported by industry experts and together can
  build a best-in-class product. We are a small and fast-paced
  team where everyone has a voice in the development of our
  product and technology.

  As a senior full-stack software engineer, you will play a
  flexible role across our product—working on everything from
  our core portfolio creation engine to our trading system to
  our client-facing web application. You will have significant
  ownership and will have the opportunity to impact everything
  from requirements gathering and designing systems to
  implementation, release, and monitoring. This is a high
  visibility technical leadership role with a tremendous
  opportunity to impact the company’s trajectory. Please note,
  this role is primarily onsite, working from our SoHo office.

  What you will do

  - Lead the implementation of the systems that power and scale
    our business
  - Uncover and address system bottlenecks as we mature our tech
    stack
  - Partner with the Product team to provide impactful,
    measurable and testable solutions for our customers
  - When appropriate, coach and mentor engineers on best
    practices
  - Advocate for best in class technology and tooling to improve
    the development experience
  - Contribute to operational excellence

  What you will bring on Day 1

  - 5+ years of software development experience outside of
    education and internships
  - Experience with backend and frontend languages. Our stack
    includes Python, Golang, TypeScript, so direct experience
    working with these is a big plus.
  - Experience with React and a familiarity with the latest
    frontend frameworks and tools
  - Experience with relational databases — we use Postgres.
  - Firm understanding of data structures, algorithms, and
    software design
  - Strong analytical and debugging skills
  - Effective interpersonal, communication, and collaboration
    skills with proven problem solving abilities

  These would be great to have, but we’re sure you can learn
  this on the job here

  - Prior work experience with financial data, investment tools
    and/or markets
  - Familiarity with Airflow or an equivalent pipeline
    management system.

  Our stack:

  - Python, Postgres, Express, TypeScript, Node, React, Redux,
    and AWS

  Through the internal and market data Vise has collected, we
  expect the salary range for this position to be $180,000 -
  $250,000 per year, plus a competitive equity package. Your
  actual compensation will be determined based on your skills,
  qualifications, and experience. In addition, Vise offers a
  wide range of comprehensive and inclusive employee benefits.

  Why join Vise

  - Opportunity to make a significant impact at a hyper-growth
    fintech start-up
  - Competitive salary and equity
  - Unlimited PTO and great benefits, including $1 medical
    insurance
  - 401k plan with generous matching and self-directed brokerage
    account option
  - Access to investment management and free financial advice
    from one of our partner RIA firms
  - Paid lunches at our NYC office
  - Career growth and development opportunities

  About Vise:

  Vise is an artificial intelligence (AI) powered asset
  management platform designed specifically for financial
  advisors to build, manage and explain personalized
  portfolios. In today's world, AI is driving personalization
  across various industries, enhancing the way we shop,
  consume content, and engage with technology. Embracing this
  trend, Vise is leading the charge to bring this level of
  personalization to how we invest. Vise ushers in Wealth 3.0,
  moving beyond mutual funds and ETFs to offer personalized
  and automated portfolios. By harnessing the power of AI,
  Vise enables financial advisors to create tailored
  investment strategies that cater to each client's unique
  financial needs and goals.

  Financial advisors are at the heart of this transformation,
  as their relationships with clients are essential to
  understanding and meeting each client's unique financial
  needs. With Vise, advisors can focus on nurturing these
  relationships instead of spending time building and managing
  portfolios. Our platform empowers advisors to create
  institutional-grade, personalized portfolios, automate their
  management, and explain valuable insights that enhance their
  expertise and service to clients. Vise is the outsourced
  sub-advisor, doing trading, rebalancing, and managing client
  portfolios fully automated on the advisor's behalf; Vise
  charges an AUM fee for its services.

  Our exceptional New York team comprises world-class Ph.D.
  quants, investment researchers, and engineers with
  experience at industry-leading firms like Citadel,
  Blackrock, Stripe, and Stanford. Combining top financial and
  engineering talent, we pride ourselves on delivering
  products faster and understanding our customers' needs
  better than anyone else in the market. Vise has garnered the
  support of prominent venture capital firms, raising over
  $130M from Sequoia Capital and Founders Fund, among others.

  Vise celebrates and embraces diversity and is committed to
  building a team that represents a variety of experiences,
  backgrounds, and skills. We do not discriminate on the basis
  of race, color, religion, marital status, age, gender
  identity, gender expression, sexual orientation, non-
  disqualifying physical or mental disability, national
  origin, veteran status, or other applicable legally
  protected characteristics.
