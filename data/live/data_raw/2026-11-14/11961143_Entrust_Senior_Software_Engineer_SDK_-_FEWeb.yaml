description: |
  Join us at Entrust 

  At Entrust, we’re shaping the future of identity centric
  security solutions. From our comprehensive portfolio of
  solutions to our flexible, global workplace, we empower
  careers, foster collaboration, and build solutions that help
  keep the world moving safely. 

  Entrust's values are a cornerstone of who we are, our future
  business growth and how our people grow through it. We model
  our values by demonstrating that Customer Trust Is Earned,
  moving with purpose because Speed Is Intentional, taking
  accountability because We Own the Outcome, and building a
  collaborative culture where One Entrust Wins Together.



  Get to Know Us 

  Headquartered in Minnesota, Entrust is an industry leader in
  identity-centric security solutions, serving over 150
  countries with cutting-edge, scalable technologies. But our
  secret weapon? Our people. It’s the curiosity, dedication,
  and innovation that drive our success and help us anticipate
  the future. 

  What you will do:



  We’re looking for an experienced  Senior Front End Engineer
  to help us evolve our current product offering!



  You’ll join a talented and friendly team which loves to
  delight its customers with quality and robust code. We care
  about user and developer experience and we work in an agile
  way to regularly ship code to production.



  We encourage people from all backgrounds, cultures and skill
  levels to apply. It is okay to not meet all requirements
  listed as we are looking for individuals who are passionate,
  eager to learn.



  As a Senior Front-End Engineer at Entrust you will:

  - Work closely with product designers, product managers and
    other engineers to deliver great experiences to our
    customers using your great understanding of React and
    other architectural frameworks.

  - Prototype and iterate until the solutions are impactful and
    well polished, supporting multiple devices or browsers and
    meeting our accessibility standards.

  - Improve the reliability and safety of our continuous
    delivery by contributing to our test automation as well as
    the CI/CD pipeline on Gitlab.

  - Contribute to fostering a culture of psychological safety,
    inclusivity, collaboration and continuous improvement
    within the team through participation in retrospectives
    and feedback.

  - Guide and mentor other engineers helping us manage debt,
    plan refactors and improve our engineering practices.



  At Entrust, we don’t just offer jobs – we offer career
  journeys. Here is what you can expect when you join our
  team: 

  - Career Growth: Whether you’re a budding developer or a
    seasoned expert, we’re invested in your professional
    journey. With learning-forward initiatives and exciting
    challenges, your growth is our priority.

  - Flexibility: Life is all about balance. Whether you’re
    remote, hybrid, or on-site, we offer flexible options that
    fit your lifestyle.

  - Collaboration: Here, your voice matters. Our teams thrive on
    sharing ideas, brainstorming solutions, and working
    together to build a better tomorrow.

  We believe in securing identities—but it doesn’t stop there.
  At Entrust, we’re passionate about valuing all identities.
  Our culture is built on diversity, inclusion, and respect.
  From unconscious bias training for our leaders to global
  affinity groups that connect colleagues across the globe,
  we’re creating a community where everyone is encouraged to
  be themselves. 



  Ready to Make an Impact? 

  If you’re excited by the prospect of innovating, growing
  your career, and collaborating in a dynamic environment,
  Entrust is the place for you. Join us in making a
  difference. Let’s build a more secure world—together. 



  Apply today! 



  For more information, visit www.entrust.com.  Follow us on,
  LinkedIn, Facebook, Instagram, and YouTube

