description: |
  LiveRamp is shaping the future of responsible data
  collaboration between the world’s leading brands, retailers,
  financial services providers, and healthcare innovators. As
  consumers embrace new AI-driven experiences, the LiveRamp
  data collaboration network exponentially expands the breadth
  and accuracy of the data on which marketing AI capabilities
  operate, powering deeper customer insight and measurable
  performance on a global scale. LiveRamp is headquartered in
  San Francisco, California, with offices worldwide. Learn
  more at LiveRamp.com.

  Your team will:

  You will join a team responsible for building and operating
  the APIs and user experiences that enable LiveRamp customers
  and partners to activate data. The team solves complex
  problems involving API scalability, low-latency performance,
  intuitive workflows, and dependable integrations. You will
  work across the backend and frontend to deliver capabilities
  that are reliable for external consumers and easy for
  internal teams to operate.

  You will:

  - Design, develop, test, deploy, and maintain production-
    quality Ruby on Rails APIs that power LiveRamp’s external
    Activation API.
  - Build and enhance React-based user interfaces that support
    data activation configuration and management.
  - Develop secure, reliable, and scalable API endpoints and
    services for external customers and internal users.
  - Improve API performance, latency, availability,
    observability, and operational resilience.
  - Establish and apply API design standards, including resource
    modeling, versioning, error handling, documentation, and
    backward compatibility.
  - Collaborate with product managers, designers, engineers, and
    partner teams to translate requirements into effective
    full-stack solutions.
  - Use AI-powered development tools responsibly to accelerate
    implementation, testing, documentation, debugging, and
    code review while maintaining engineering quality and
    security.
  - Write automated unit, integration, and end-to-end tests for
    backend and frontend functionality.
  - Participate in architecture discussions, technical planning,
    code reviews, incident response, and continuous
    improvement initiatives.
  - Diagnose production issues, identify root causes, and
    implement durable corrective actions.
  - Contribute to technical documentation and shared engineering
    practices.
  - Measure success through improved API latency and
    reliability, effective test coverage, low defect rates,
    timely delivery, and adoption of organization-wide API
    standards.

  About you:

  - 3+ years of professional experience in full-stack software
    development or API-focused software development.
  - Professional experience developing Ruby on Rails
    applications and APIs.
  - Developed frontend applications with React or a comparable
    modern JavaScript framework.
  - Understand RESTful API design, HTTP behavior,
    authentication, authorization, versioning, and backward
    compatibility.
  - Experience writing automated tests and maintaining
    production-quality software.
  - Can troubleshoot application and production issues using
    logs, metrics, traces, and other diagnostic tools.
  - Understand relational databases, data modeling, and SQL.
  - Can collaborate effectively with product, design,
    engineering, and cross-functional stakeholders.
  - Communicate technical decisions clearly in writing and
    conversation.
  - Demonstrate a commitment to secure, maintainable,
    accessible, and high-quality software.
  - Comfortable using AI-assisted development tools with
    appropriate human review and validation.

  Preferred Skills:

  - Experience designing and operating externally consumed APIs.
  - Experience improving API latency, throughput, scalability,
    and availability.
  - Experience establishing or contributing to organization-wide
    API standards.
  - Experience with cloud infrastructure, observability
    platforms, CI/CD, and infrastructure-as-code.
  - Experience integrating frontend applications with complex
    backend APIs.
  - Experience working with privacy-sensitive, regulated, or
    high-volume data.
  - Experience mentoring engineers or leading technical
    initiatives.
  - Experience using AI-powered tools for software development,
    testing, documentation, and operational troubleshooting.

  The approximate annual base compensation range is $130,000
  to $196,500. The actual offer, reflecting the total
  compensation package and benefits, will be determined by a
  number of factors including the applicant's experience,
  knowledge, skills, and abilities, geography, as well as
  internal equity among our team.

  We use automated decision systems (ADS) as part of our
  recruitment and hiring process. If you require an
  accommodation or believe that the use of an ADS may create a
  barrier to your application or participation in the hiring
  process due to a disability or other protected
  characteristic, please let us know. We are committed to
  providing reasonable accommodations and ensuring an
  equitable hiring experience for all candidates.

  To all recruitment agencies: LiveRamp does not accept agency
  resumes. Please do not forward resumes to our jobs alias,
  LiveRamp employees or any other company location. LiveRamp
  is not responsible for any fees related to unsolicited
  resumes.
