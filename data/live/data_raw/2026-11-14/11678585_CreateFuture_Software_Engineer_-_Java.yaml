description: |
  Job Description

  Role: Mid Software Engineer (Java)

  Department: Engineering (Java)

  Date: September 2026

  Grade: 3

  CreateFuture is an AI-native consulting partner where people
  do work that matters and are supported to do it well. We
  work side by side with our clients, challenging what's not
  working and helping them to build the future.

  We work alongside organisations such as PayPal, adidas,
  NatWest, FanDuel, and Money Saving Expert, building digital
  products and services that make a difference while always
  putting people first. Our commitment to craft, quality, and
  culture has helped us scale to over 600 people in just a few
  years.

  About the role and team:

  We're looking for a Mid Software Engineer to join one of our
  client engineering teams, building backend services with
  modern Java and Spring Boot. You'll work closely with senior
  engineers and tech leads, taking ownership of well-defined
  features and components while developing your skills in a
  fast-paced, collaborative environment. This is a great
  opportunity to grow your technical craft on real client work
  that matters, with mentorship and support built in.

  What you'll be doing:

  - Build and maintain backend features and RESTful APIs using
    Java and Spring Boot, working under the guidance of senior
    engineers.
  - Write clean, well-tested code, applying unit and integration
    testing practices as part of your day-to-day development.
  - Work with relational databases (such as PostgreSQL, MySQL or
    SQL Server) and, where relevant, NoSQL stores (such as
    MongoDB or DynamoDB) using Spring Data JPA/Hibernate,
    writing efficient queries with support from the team.
  - Take part in code reviews, both giving and receiving
    feedback, to build your understanding of engineering best
    practice.
  - Collaborate with senior engineers, tech leads and product
    colleagues to understand requirements and deliver well-
    defined pieces of work.
  - Use CI/CD pipelines and Git-based workflows to ship changes
    safely, building your understanding of the wider software
    delivery lifecycle.

  We'd love to talk to you if you:

  - You have commercial experience with Java (Java 8+) and are
    comfortable with core language features such as Streams,
    Lambdas and Optional.
  - You have some experience with Spring Boot or a similar
    framework, and are keen to deepen your knowledge of the
    Spring ecosystem.
  - You understand the basics of REST API design and have
    contributed to APIs in a professional setting.
  - You have exposure to relational databases (e.g. PostgreSQL,
    MySQL or SQL Server), automated testing and Git, and are
    comfortable working in a team that uses CI/CD.
  - You're curious, keen to learn, and value feedback and
    mentorship as you grow your engineering craft.

  What we’ll offer you:

  We trust people to do their best work. That means
  flexibility over rigid rules, impact over activity, and real
  investment in your growth both professionally and
  personally. You’ll be part of a supportive, and friendly
  culture, surrounded by smart, curious people who care deeply
  about what they do. We offer flexible working, including
  hybrid and remote options. Our office hubs are located in
  Edinburgh, Leeds, Manchester, London and Bulgaria, with
  occasional travel to client sites or CreateFuture offices
  when needed.

  We trust you to manage your time balancing collaboration
  with client time and focused work. What matters is the
  impact you have, not how busy you look.

  Our hiring process

  We try to keep our hiring process clear, fair and respectful
  of your time. We aim to get back to everyone who applies and
  we will be upfront about where you are in the process.

  It usually looks like this:

  - Call with our Talent Acquisition Team
  - Role specific capability interview

  Depending on the role, we might also ask you to do a short
  presentation, a practical or technical task or have a values
  focused conversation. We will explain what is involved
  before anything happens.

  Inclusion at CreateFuture

  We believe diverse teams build better workplaces and better
  products. We want CreateFuture to be a place where people
  feel able to be themselves and do their best work.

  If you need any adjustments or support during the
  application process, just. We will do what we can to help.

  We look forward to your application!
