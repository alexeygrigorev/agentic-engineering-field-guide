description: |
  After decades of managing tens of thousands of people, we've
  seen firsthand how traditional HR and management tools have
  failed to deliver real transformation. While nearly every
  aspect of work has evolved dramatically over the past 50
  years, the way companies are managed has remained stuck in
  the past.

  We're building the AI management system that will
  fundamentally change how companies are built, scaled, and
  managed over the next five years. This isn't just another HR
  tool—it's the infrastructure that will allow businesses to
  adapt and thrive in an AI-driven world.

  The Role

  We're seeking a mid-to-senior software engineer to help
  build the future of business management. You'll be working
  on cutting-edge AI systems that directly impact how
  companies operate, scale, and succeed.

  What you'll do:

  - Design and build scalable backend systems powering our AI
    management platform
  - Integrate with modern AI APIs and develop intelligent
    automation workflows
  - Work across the full stack to deliver end-to-end features
  - Collaborate closely with our founding team to shape product
    direction
  - Build systems that can handle the complexity of managing
    thousands of employees

  What We're Looking ForRequired Experience

  - 5-10 years of software engineering experience (full-stack or
    backend-focused)
  - Hands-on AI integration experience - you must have written
    API requests to OpenAI (or similar LLMs) in production or
    personal projects
  - Strong technical foundation in Node.js, TypeScript, and
    PostgreSQL
  - Startup experience - ideally at high-growth companies, or
    exceptional candidates from Big Tech
  - Side project experience - you've built and launched
    something on your own

  What Makes You Stand Out

  - Former founder or founding engineer experience
  - CS degree from a top-tier university (MIT, Stanford, etc.) -
    preferred but not required
  - Recognition in competitive programming, math olympiads, or
    acceptance into selective programs (Recurse Center, Thiel
    Fellowship, etc.)
  - Deep curiosity about AI and its applications in business

  Essential Qualities

  - Self-starter mentality - you thrive with autonomy and
    ownership
  - Strong communication skills - you can explain complex
    technical concepts clearly
  - Adaptability - you're excited about the ambiguity and rapid
    pace of early-stage startups
  - Commitment to excellence - you take pride in building high-
    quality, scalable systems

  What We OfferCompensation & Equity

  - Competitive salary: $140,000 - $200,000 (based on
    experience)
  - Significant equity package in a fast-growing company
  - Comprehensive health, dental, and vision insurance
  - Unlimited PTO policy

  Growth & Learning

  - Work directly with experienced founders and senior engineers
  - Shape the architecture of systems that will serve thousands
    of companies
  - Stay at the forefront of AI and business management
    innovation
  - Clear path for technical and leadership growth as we scale

  Work Environment

  - In-person collaboration in our NYC office (4-5 days/week)
  - Modern tech stack and development tools
  - Small, focused team where your impact is immediately visible
  - Direct influence on product and technical decisions

  Application Process

  Please include with your application:

  Your resume highlighting relevant AI and startup experience
