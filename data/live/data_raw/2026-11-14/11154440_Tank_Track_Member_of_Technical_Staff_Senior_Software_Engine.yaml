  Member of Technical Staff — Senior Software Engineer

  Location: New York, NY (in-person/hybrid — small NYC-based
  team) | Type: Full-time | Level: Senior (5–7+ years)

  About Tank Track

  Tank Track builds software for the waste services industry —
  septic pumping, grease trap, and portable restroom
  companies. It's not a glamorous space, but it's a real one:
  our customers run physical businesses with trucks,
  technicians, and dispatchers who mostly don't want to think
  about software at all. That constraint shapes everything we
  build. If it's not fast and obvious, it doesn't work. We're
  a small team, and everyone on it is senior. There's no layer
  of middle management between an idea and shipped code.


  About the Role

  We're looking for a senior engineer to take real ownership
  of a piece of the Tank Track platform. Our stack is
  TypeScript/Node.js on the backend, React on the web, React
  Native (Expo) on mobile, with Prisma/MySQL, BullMQ/Redis,
  and infrastructure on AWS and Cloudflare. We're not going to
  hand you a spec. You'll be given a problem — sometimes a
  messy one — and it'll be on you to figure out what to build,
  how to build it, and whether it was the right call. We want
  someone who's led a product or owned a significant piece of
  one before, and who's used to living with the consequences
  of their own decisions rather than someone else's.


  What You'll Actually Do

  - Own a product area from the initial problem all the way
    through to what happens after it ships
  - Make technical calls — architecture, scope, tradeoffs —
    without someone signing off first
  - Decide where the team should invest engineering effort and
    where it's fine to cut corners
  - Work directly with leadership on what we build next, not
    just how we build it
  - Help the rest of the engineering team get better, whether
    that's through code review, design discussions, or just
    how you approach problems
  - Move around the stack as needed — this is a small team, and
    the interesting problems don't always live in one layer

  What We're Looking For

  - 5–7+ years writing production software
  - You've led a product, a feature area, or a technical
    initiative before — not just executed against someone
    else's plan
  - Good judgment under uncertainty. You don't need every fact
    before you can make a decision
  - You actually want autonomy, not just tolerate it
  - You can explain your reasoning to a non-engineer and have it
    make sense
  - A history of owning outcomes, not just tickets

  Nice to Have

  - TypeScript/Node.js, React, or React Native experience
  - Time at a small startup where you did more than your job
    title suggested
  - Background in vertical SaaS or B2B software built for non-
    technical users
  - Exposure to payments or other transactional systems

  Why Tank Track

  - You decide how problems get solved — nobody's handing you a
    plan to execute
  - Direct access to leadership; your calls actually shape the
    product
  - Small, senior team, minimal overhead
  - A chance to build real software for an industry most tech
    companies ignore

  Compensation & Benefits

  - Base salary: $170,000–$240,000, depending on experience,
    plus bonus
  - Healthcare coverage
  - 401(k)

  Equal Employment Opportunity

  Tank Track is an equal opportunity empployer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, age, disability, veteran
  status, or any other characteristic protected by applicable
  federal, state, or local law.
