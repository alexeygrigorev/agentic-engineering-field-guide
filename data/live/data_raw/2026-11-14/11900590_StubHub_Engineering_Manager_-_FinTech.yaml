description: |
  StubHub is on a mission to redefine the live event
  experience on a global scale. Whether someone is looking to
  attend their first event or their hundredth, we’re here to
  delight them all the way from the moment they start looking
  for a ticket until they step through the gate. The same goes
  for our sellers. From fans selling a single ticket to the
  promoters of a worldwide stadium tour, we want StubHub to be
  the safest, most convenient way to offer a ticket to the
  millions of fans who browse our platform around the world.

  StubHub is hiring an Engineering Manager to lead a high-
  impact team responsible for building the data systems that
  power personalized marketing and retention experiences for
  millions of fans. This is a technical leadership role
  focused on driving business and customer outcomes through
  operational rigor, data-informed decisions, and strong
  people management. You’ll be expected to deliver high-
  quality results, build a high-performing team, and raise the
  bar across engineering, execution, and impact.

  Location: Hybrid (3 days in office/2 days remote) – New
  York, NY or Century City, CA

  About the Team:

  StubHub’s FinTech organization builds the financial backbone
  of a global ticketing marketplace. This role leads two
  closely connected teams: Revenue Finance and Tax. Revenue
  Finance Engineering owns the systems that turn millions of
  transactions into accurate, auditable financial data -
  revenue recognition, billing and settlement, ledgers,
  reconciliation, and the reporting that Finance and
  Accounting rely on to close the books and report results.
  Tax Engineering owns how StubHub calculates, collects, and
  remits taxes across jurisdictions, including sales tax,
  VAT/GST, and marketplace facilitator obligations, along with
  the compliance and reporting workflows behind them.

  These systems sit at the intersection of engineering,
  finance, and regulation: they have to be correct, resilient,
  and audit-ready at scale, and they underpin decisions made
  all the way up to the executive level. As Engineering
  Manager, you’ll set technical direction across both teams,
  partner closely with Finance, Accounting, and Tax
  stakeholders, and grow a team that treats financial
  integrity as a first-class engineering problem.

  Why This Role Matters: You’ll work on critical systems that
  fuel StubHub’s growth engine. This is a high-visibility role
  with executive support, cross-functional collaboration, and
  opportunities to influence architecture, mentor engineers,
  and shape how we drive customer lifetime value. If you like
  solving hard technical problems with measurable impact and
  enjoy blending product, data, and engineering, this is the
  team for you.

  What You’ll Do:

  - Drive measurable impact: Identify high-leverage problems,
    set clear goals, and deliver solutions that produce
    quantifiable business and customer value.
  - Lead through execution: Own team delivery with precision,
    ensure commitments are met, blockers are resolved quickly,
    and progress is visible and tracked.
  - Raise the bar on talent density: Hire exceptional engineers,
    actively coach performance, and make principled decisions
    to retain only those operating at a high level.
  - Promote data-driven decisions: Use data and metrics to guide
    priorities, evaluate solutions, and continuously improve
    how your team operates.
  - Own technical quality: Champion system design, code quality,
    reliability, correctness, and long-term maintainability
    across financial and tax systems where accuracy and
    auditability are paramount.
  - Foster team health: Build a psychologically safe, inclusive
    team culture grounded in feedback, autonomy, and shared
    accountability.
  - Partner across the business: Collaborate with Finance,
    Accounting, Tax, Product, and Data partners to align on
    priorities, coordinate dependencies, and deliver business-
    critical initiatives.

  What Success Looks Like:

  - Reliable, accurate, and auditable financial and tax systems
    that Finance, Accounting, and Tax teams trust to close the
    books and stay compliant.
  - On-time, high-quality delivery of initiatives tied to
    company objectives.
  - Clear evidence of team growth, engagement, and performance.
  - Demonstrated improvement in team operational metrics (e.g.,
    velocity, quality, incident reduction).
  - A strong pipeline of internal talent and a team that
    continuously improves its impact-per-head over time.

  What We’re Looking For:

  - 8+ years of engineering experience, including technical
    ownership of production systems and business-critical
    software.
  - 4+ years of people leadership experience, with a track
    record of hiring and developing high-performing teams.
  - Direct experience building financial, payments, billing,
    ledger, or tax systems, or comparable domains where
    correctness, compliance, and auditability are first-order
    requirements.
  - Strong technical background in backend, distributed systems,
    APIs, or data platforms (Postgres, SQLserver, Java,
    Python, React).
  - Proven ability to drive execution, define clear success
    metrics, and solve complex problems with data and rigor.
  - Experience working directly with Finance, Tax, or Accounting
    stakeholders and translating regulatory and accounting
    requirements into engineering roadmaps.
  - Skilled in managing ambiguity, prioritizing ruthlessly, and
    delivering under tight timelines.
  - Comfortable giving and receiving candid feedback, and
    modeling it for others.

  What We Offer:

  - Accelerated Growth Environment: An environment designed for
    swift skill and knowledge enhancement, where you have the
    autonomy to lead experiments and tests on a massive scale.
  - Top Tier Compensation Package: Competitive base, equity, and
    upside that tracks with your impact.
  - Flexible Time Off: Enjoy unlimited Flex Time Off, giving you
    the flexibility to manage your schedule and take time to
    recharge as needed.
  - Comprehensive Benefits Package: Prioritize your well-being
    with a comprehensive benefits package, featuring 401k, and
    premium Health, Vision, and Dental Insurance options.

  The anticipated gross base pay range is below for this role.
  Actual compensation will vary depending on factors such as a
  candidate’s qualifications, skills, experience, and
  competencies. Base annual salary is one component of
  StubHub’s total compensation and competitive benefits
  package, which includes equity, 401(k), paid time off, paid
  parental leave, and comprehensive health benefits.

  Salary Range

  $270,000—$320,000 USD

  About Us

  StubHub is the world’s leading marketplace to buy and sell
  tickets to any live event, anywhere. Through StubHub in
  North America and viagogo, our international platform, we
  service customers in 195 countries in 33 languages and 49
  available currencies. With more than 300 million tickets
  available annually on our platform to events around the
  world -- from sports to music, comedy to dance, festivals to
  theater -- StubHub offers the safest, most convenient way to
  buy or sell tickets to the most memorable live experiences.
  Come join our team for a front-row seat to the action.



