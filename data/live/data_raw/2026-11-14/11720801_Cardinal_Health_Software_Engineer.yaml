description: |
  Role Summary

  The AIMS Application Support Engineer is responsible for
  maintaining the stability, availability, security, and
  performance of the AIMS Warehouse Management System, a Tier
  1 business-critical application supporting more than 50
  medical distribution centers across the United States and
  Canada. The role provides technical leadership for
  application support, infrastructure maintenance, incident
  resolution, system upgrades, disaster recovery testing, and
  continuous service improvement.

  The position operates within a 24x7 support model and works
  closely with infrastructure, database, networking, SAP,
  middleware, cybersecurity, and third-party vendor teams to
  ensure uninterrupted business operations.

  Required Technical Skills

  - Bachelor's degree in related field, or equivalent work
    experience, preferred.
  - 6+ years of experience in application development.

  - Strong experience supporting Windows Server environments.
  - Experience with SQL Performance Tuning, DTS, SSIS, SSRS
  - Strong understanding of database administration,
    troubleshooting, and optimization.

  - Experience supporting applications hosted on Google Cloud
    Platform (GCP).
  - Scripting and automation experience using PowerShell, Perl

  - Strong understanding of web application architecture and
    client/server environments.
  - Experience integrating SaaS and enterprise applications
    through APIs.
  - Understanding of REST APIs, SOAP Services, HTTPS Protocols,
    JSON, XML

  - Knowledge of DevSecOps practices and CI/CD pipelines.
  - Experience with Jenkins.
  - Experience using monitoring tools such as Dynatrace and
    BigPanda

  - Experience with ServiceNow, ITIL Framework, SailPoint,
    CyberArk



  Preferred Qualifications

  - Experience supporting Warehouse Management Systems (WMS).
  - Knowledge of Supply Chain, Distribution Center Operations,
    and Logistics processes.
  - Experience supporting mission-critical applications in a
    24x7 operational environment.
  - Strong stakeholder management and cross-functional
    coordination skills.

  Key Responsibilities

  Application Maintenance & Support

  - Perform application version upgrades, patch deployments, and
    maintenance activities to ensure systems remain current,
    secure, and supported.
  - Provide 24x7 production support coverage through a rotating
    three-shift support model.
  - Monitor application health, system alerts, and performance
    metrics to proactively identify and resolve issues.
  - Manage ServiceNow incidents and service requests, ensuring
    timely communication, resolution, and documentation.
  - Troubleshoot complex application, infrastructure, database,
    and integration issues impacting business operations.

  Infrastructure & Platform Administration

  - Perform server maintenance activities, including operating
    system upgrades, security patching, and certificate
    renewals.
  - Support and maintain Windows-based application and database
    environments.
  - Collaborate with infrastructure teams to ensure platform
    availability, resiliency, and security compliance.

  Database & Performance Optimization

  - Analyze and resolve database performance bottlenecks.
  - Optimize SQL queries, batch processes, and system
    configurations to improve application performance and
    scalability.
  - Support SQL Server administration and maintenance activities
    as required.

  Incident, Problem & Vendor Management

  - Open, coordinate, and facilitate SRTs by engaging
    appropriate support groups, including:  Network, Database,
    Server Infrastructure, SAP, Integration Platforms, Third-
    Party Vendors, Internal Application SMEs.
  - Participate in root cause analysis activities and develop
    permanent corrective actions for recurring issues.
  - Drive issue resolution across multiple technical teams to
    minimize service disruption.

  Change & Release Management

  - Coordinate application maintenance, upgrades, and deployment
    activities with distribution centers to minimize
    operational impact.
  - Support release planning, testing, validation, and
    implementation activities.
  - Ensure adherence to change management and deployment
    standards.

  Compliance, Documentation & Resiliency

  - Support SOX compliance activities and audit requirements.
  - Plan, coordinate, and execute annual Disaster Recovery (DR)
    testing in partnership with the Enterprise Resiliency
    Team.
  - Develop, maintain, and continuously improve operational
    procedures, technical documentation, and support runbooks.
  - Promote knowledge sharing and cross-training to reduce
    operational risk and improve team readiness.

