description: |
  Opportunity Overview:

  We are seeking a Lead Software Engineer to join our
  Integrations team, designing, developing, and scaling highly
  available healthcare integration systems that support prior
  authorization workflows across providers, payers, and
  delegated entities. You'll lead a fast-paced, autonomous,
  agile team of engineers building and operating a growing
  enterprise integration platform — driving technical
  excellence at the intersection of healthcare
  interoperability and modern distributed systems.

  This is a remote-first role that may require travel to
  Boston, MA for new hire onboarding and occasional in-person
  team meetings and company events.

  What you’ll do:

  - Provide technical leadership across architecture, system
    design, platform scalability, reliability, and operational
    excellence
  - Design and build scalable, resilient, high-performing
    systems supporting critical enterprise integrations
  - Lead development of secure integrations with internal,
    external, and third-party platforms
  - Design event-driven, distributed architectures and drive
    cloud infrastructure and CI/CD automation
  - Establish monitoring, observability, and incident response
    practices, and lead resolution of production issues
  - Partner cross-functionally with product, operations, data,
    security, and business stakeholders on agile delivery
  - Mentor engineers and contribute to hiring, coaching, and
    career development

  What you’ll need:

  - 8+ years building and supporting scalable enterprise
    applications and distributed systems
  - Hands-on experience integrating external APIs/third-party
    systems and building automated testing frameworks required
  - Expertise in authentication/authorization frameworks, secure
    API design, and access control required
  - Experience with data modeling across relational/non-
    relational databases, observability tooling, and event-
    driven architecture required
  - Healthcare technology/prior authorization experience,
    interoperability standards, or experience in other highly
    regulated industries a plus
  - Experience with Infrastructure as Code, cloud provisioning,
    and CI/CD pipeline design
  - Bachelor's degree in Computer Science, Information
    Technology, Computer Engineering, or related field

  Pay & Perks:

  💻 Fully remote opportunity with about 5% travel

  🩺 Medical, dental, vision, life, disability insurance, and
  Employee Assistance Program

  📈 401K retirement plan with company match; flexible spending
  and health savings account

  🏝️ Flex Time Off + company holidays

  👶 Up to 14 weeks of paid parental leave

  🐶 Pet insurance 

  The salary range for this position is $150,000 to $185,000
  annually; as part of a total benefits package which includes
  health insurance, 401k and bonus. In accordance with state
  applicable laws, Cohere is required to provide a reasonable
  estimate of the compensation range for this role. Individual
  pay decisions are ultimately based on a number of factors,
  including but not limited to qualifications for the role,
  experience level, skillset, and internal alignment.

  Interview Process*:

  - Connect with Talent Acquisition for a Preliminary Phone
    Screening
  - Meet your Hiring Manager!
  - Live System Design Exercise
  - Project Discussion
  - Cross Functional Interview

  *Subject to change

  About Cohere Health:

  Cohere Health’s clinical intelligence platform and agentic
  AI-powered solutions connect health plans’ strategic goals
  and providers’ needs, optimizing the speed, cost, and
  quality of care. With an enterprise approach that
  streamlines payer-provider decision-making across the care
  continuum–including policy, prior authorization, payment
  accuracy, and more–the company improves collaboration and
  reduces burden, resulting in up to 8x ROI and 94% provider
  satisfaction.

  With the acquisition of ZignaAI, we’ve further enhanced our
  platform by launching our Payment Integrity Suite, anchored
  by Cohere Validate™, an AI-driven clinical and coding
  validation solution that operates in near real-time. By
  unifying pre-service authorization data with post-service
  claims validation, we’re creating a transparent healthcare
  ecosystem that reduces waste, improves payer-provider
  collaboration and patient outcomes, and ensures providers
  are paid promptly and accurately.

  Cohere Health’s innovations continue to receive industry
  wide recognition. We’ve been named to the 2025 Inc. 5000
  list and in the Gartner® Hype Cycle™ for U.S. Healthcare
  Payers (2022-2025), and ranked as a Top 5 LinkedIn™ Startup
  for 2023 & 2024. Backed by leading investors such as
  Deerfield Management, Define Ventures, Flare Capital
  Partners, Longitude Capital, and Polaris Partners.

  The Coherenauts, as we call ourselves, who succeed here are
  empathetic teammates who are candid, kind, caring, and
  embody our core values and principles. We believe that
  diverse, inclusive teams make the most impactful work.
  Cohere is deeply invested in ensuring that we have a
  supportive, growth-oriented environment that works for
  everyone.

  We can’t wait to learn more about you and meet you at Cohere
  Health!

  Equal Opportunity Statement:

  Cohere Health is an Equal Opportunity Employer. We are
  committed to fostering an environment of mutual respect
  where equal employment opportunities are available to all.
  To us, it’s personal.

