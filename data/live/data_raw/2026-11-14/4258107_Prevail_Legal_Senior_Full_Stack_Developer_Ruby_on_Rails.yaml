description: |
  About Prevail Legal

  A well-funded startup founded in San Francisco, our
  workforce includes a diverse collection of individuals
  located across the country. Our first-of-its-kind platform
  combines secure video conferencing with a collection of
  intuitive tools developed for conducting remote, in-person,
  and hybrid legal proceedings.

  By maintaining a dynamic work environment where employees
  collaborate and grow, we aim to modernize and transform the
  processes involved in court reporting, testimony management,
  trial preparation, use of video evidence, and more. Join us
  in disrupting the legal industry and beyond while working
  alongside our talented team!

  About the Position: We are seeking proactive and experienced
  individuals who are passionate about full-stack development.
  As a Senior Full Stack Developer, you will be instrumental
  in building end-to-end solutions, co-writing technical
  documentation for new features, and working with both
  object-oriented and functional programming paradigms. This
  role involves significant collaboration in a remote
  environment. To be successful in this role, you must have a
  strong understanding of git/source control and familiarity
  with Gen-AI tools and their practical applications in
  development workflows. This position is fully remote and
  reports to the Chief Technology Officer.

  Required Qualifications:

  - Minimum 3-5 years of Ruby on Rails experience
  - Minimum 7+ Coding experience
  - AWS Experience - Must Meet ONE of the Following:
    - 6+ years of hands-on experience using AWS as a developer, OR
    - 6+ years managing AWS infrastructure/cloud environments, OR
    - 4+ years of AWS experience with a valid AWS certification
      (see accepted certifications below)
  - Familiarity with Gen-AI tools and their practical
    applications in development workflows
  - Ability to build end-to-end solutions with minimum coupling
  - Strong understanding of git/source control
  - Comfortable working with and understanding both object-
    oriented and functional programming paradigms
  - Ability to co-write technical documentation with
    AI/familiarity
  - Experience working with Docker

  Preferred Knowledge:

  - Experience working with WebRTC
  - Experience writing performant JavaScript preferably
    Stimulus, Hotwire, or Importmaps
  - Experience with asset optimization techniques
  - 2+ years Postgres

  Ideal Candidate:

  - Experience working in a remote startup environment
  - Hold AWS Certified DevOps Engineer – Professional or AWS
    Certified Developer – Associate certification
  - Passion for programming
  - Experience spearheading projects from start to finish
  - Has a quiet and clean place to work from home
  - Strong work ethic, + experience with small-size teams
  - Strong communication and positive attitude
  - Experience mentoring junior developers

  A note on AI Use during interviews: In interviews, we're
  looking at how you think and solve problems in real time.
  You're welcome to use AI while preparing. Using it without
  disclosing it during the interview is treated as
  misrepresentation and leads to automatic rejection.Benefits:

  - Comprehensive medical, dental, vision, and 401(k) plans
  - PTO, including vacation and company holidays
  - Generous continuing education allowance
  - Employee stock option plan
  - Remote-first workplace
  - Open, diverse, and respectful work culture

  Compensation Range: $150,000 - $180,000 per year. The final
  base salary will be determined based on several factors,
  including geographical location, level of experience,
  relevant skills, and knowledge.

  Prevail Legal reserves the right to change this job
  description to meet the organization's business needs.
  Please note that the pay band listed is for major cities,
  and compensation is based on both location and experience.



  We are hiring for US Citizens and do not provide H1B Visa
  support.

  We are committed to equal employment opportunity regardless
  of race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, gender, gender identity or expression, or
  veteran status. We are proud to be an equal opportunity
  workplace.
