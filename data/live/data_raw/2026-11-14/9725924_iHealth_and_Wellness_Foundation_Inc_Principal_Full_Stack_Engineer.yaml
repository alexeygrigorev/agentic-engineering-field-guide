  We are an 'early stage' pre-money nonprofit/ tech startup
  preparing for a proof-of-concept launch / seed-raise looking
  to recruit VOLUNTEERS (unpaid) as PRINCIPAL FULL-STACK
  ENGINEERS.

  Our tech stack includes ReactJS (website) and React Native
  (App) for the front-end, NodeJS for the back-end, and
  MongoDB for database management, with a focus on utilizing
  CSS Modules for styling.

  You’ll be helping to improve the healthcare experience for
  our users by making it simpler and more efficient for
  patients to book an appointment with and visit a doctor.

  Responsibilities:

  - You’ll balance project leadership, individual contribution,
    and mentorship
  - You’ll have the opportunity to work across the stack, front
    to back, and everything in between
  - You’ll be using cutting-edge technology to help rapidly
    build and scale a new product in a brand new business
    space
  - You’ll be helping to improve the healthcare experience for
    our users by making it simpler and more efficient for
    patients to book an appointment with and visit a doctor
  - Contributing to the end-to-end development of consumer-
    facing applications
  - Building products designed to scale quickly like new patient
    interactions, real-time video visits, and new
    functionality that helps doctors optimize their experience
  - Shipping efficient and scalable code to millions of users
    autonomously
  - Collaborating with our agile team of dedicated and brilliant
    engineers, product managers, and designers
  - You will partner with the product and design teams to
    develop product improvements
  - Making a meaningful impact as you own and release features
    in our CI environment that will impact patients, doctors,
    and alike
  - Mentoring your peers, with the notion that helping others
    means learning and growing yourself

  Required Experience:

  - Passionate about building fully scalable platforms with the
    latest technologies
  - A product-driven engineer who loves working in a highly
    collaborative and supportive environment
  - Motivated by building products that make healthcare easier
  - Excited to use technology to enhance the consumer experience
  - Passionate about building diverse and inclusive teams and
    culture
  - Excited to lead projects and be a mentor for other engineers
  - Passion for technology and the ability to think critically
    about performance, scalability, and reliability of
    software
  - Implemented fast and efficient software solutions using
    object-oriented or functional languages
  - Some of the technologies we utilize are React, C#, Scala,
    and Node.js; however, we are language agnostic
  - Designed and built user-facing web applications that scale
  - 5+ years of professional full-stack development experience
  - Successfully mentored other engineers in the past and
    encouraged your peers to use software development best
    practices for code testing and deployment
  - Familiarity with Agile frameworks is a plus
  - Ability to commit to a minimum of 4+ hour work weeks
  - Ability to attend weekly standup meeting (conference call
    with desktop/ laptop access for screen sharing)
  - HealthTech experience is a plus

  NOTE: Your first assignment will involve launching a
  fundraising campaign. iHealth will provide comprehensive
  guidance and resources to help ensure your fundraiser is
  both quick and successful.

  Please note that candidates actively seeking CPT/Internships
  are ineligible for this particular volunteer position.

  Join us, you win, we both win!!

