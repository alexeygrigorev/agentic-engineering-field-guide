description: |
  About sennder

  sennder is redefining road logistics. As Europe’s leading
  digital freight forwarder, we are building a smarter,
  faster, and more sustainable future for freight, powered by
  a single, unified platform that already runs our entire
  business. We are moving from a decade of growth through
  acquisition to a company that is outcome-driven, outward-
  focused, and AI-native by design.

  We are a growing team looking for a Senior Full Stack
  Engineer - backend focused - in the Freight Planning &
  Fulfilment team to help us on our journey to revolutionize
  road freight logistics. The role is based in our Berlin
  office.

  WHAT YOU WILL DO ...

  As a Senior Full Stack Engineer , you'll design and build
  core services that are instrumental to sennder's growth.
  You'll help create products for sennder’s core freight
  platform, acting as the backbone of the TMS by providing
  reliable data and interfaces for operators and supporting
  the carrier-facing teams in fulfilling their needs.

  Working in a cross-functional team of 5 people, you'll have
  the autonomy to deliver scalable solutions with direct
  business impact and own the full-service lifecycle,
  including infrastructure, with support from our Platform
  team.

  - Scale our engineering organization and evolve our backend,
    DevOps culture, and engineering practices to support
    sustainable growth

  - Design robust microservice architecture, including service
    mesh capabilities, stable interfaces, observability and
    metrics, and clear API contracts

  - Take a leading role in architectural design and technical
    decision-making

  - Lead mid-sized engineering projects from planning through
    delivery and operation

  - Raise engineering standards and improve development
    processes to increase quality and efficiency across the
    stack

  - Collaborate with product managers to plan and deliver
    shippable features, while communicating effectively with
    other pods and stakeholders

  - Use AI-enabled engineering tools to improve the development
    of workflows, automation, code quality, and team
    productivity.

  WHAT WE ARE LOOKING FOR ...

  - Demonstrated experience building and operating reliable,
    scalable web applications in production environments

  - Strong hands-on Python experience, with the ability to work
    confidently across backend services and contribute at
    Senior Engineer level

  - Strong backend engineering skills, with a very good
    understanding of microservices architecture, event-driven
    architecture, and modern REST APIs

  - Hands-on experience with PostgreSQL and Kafka; Kafka
    experience is a must for this role

  - Frontend experience is required, with hands-on knowledge of
    Vue.js

  - Practical experience with AWS, Docker, Kubernetes,
    Terraform, and modern CI/CD practices; familiarity with
    GitLab is beneficial

  - Great communication skills, a collaborative approach, and
    the ability to work effectively as a team player in
    English

  - Strong problem-solving skills, with ownership of technical
    and non-technical challenges and the ability to bring
    topics to completion

  - Our current stack includes Python, PostgreSQL, AWS, Kafka,
    Kubernetes, Terraform, and GitLab

  WHY CHOOSE SENNDER ...

  We believe in empowering our people to grow beyond their
  limits, embrace challenges, and create solutions that drive
  our collective success. Our culture thrives on
  entrepreneurial spirit, resilience, and collaboration.

  Dynamic Scale-Up sennder is at a pivotal stage –
  transitioning from a scale-up to a sustainably growing
  company. This means we move fast and constantly push
  ourselves to improve. Joining us means being part of an
  ambitious, international team of talented individuals who
  value teamwork as much as bold thinking. Face-to-face
  connections across our offices remain central – it's not
  uncommon to travel to our offices across Europe to
  collaborate as we tackle challenges and celebrate wins,
  together.

  Put Your Stamp on the Industry. We operate in a complex and
  ever-changing industry where your ideas and efforts have a
  tangible, transformative impact. This is your chance to be
  hands-on in creating sustainable, meaningful solutions that
  help businesses thrive.

  Employee Well-Being We make mental wellbeing and engagement
  a priority through initiatives like our sennCare program, a
  partnership with nilo (global wellbeing platform), and
  regular satisfaction surveys via Culture Amp. And most
  importantly, work alongside people who truly care about you
  as a person. There is something special about the people at
  sennder that goes beyond just ‘work’.

  Your Growth, Rewarded We believe in rewarding our team for
  their commitment and contributions to our long-term success.
  Our compensation package may include performance bonuses,
  referral rewards, or equity that align with our goal of
  building a thriving company together. We're excited to grow
  with you!

  Vibrant Workspaces Our offices are equipped with healthy
  snacks, focus zones, and social areas to keep you energized
  and connected. When you walk into a sennder office, you
  immediately feel the sennder spirit: our shared culture
  paired with each location’s own unique character. Highlights
  include a slide in our Wroclaw office and a sunny rooftop
  terrace in Berlin, Amsterdam, and Milan! We also enjoy
  coming together regularly, from monthly aperitivos to
  spontaneous team moments.

  We celebrate diversity and value your character just as much
  as your skills. If you don’t meet every requirement, don’t
  worry, we still encourage you to take a chance and apply.
  Bring your authentic self and help us shape the future of
  logistics in Europe.

  Please read our Privacy Policy before submitting your
  application.

  Learn more about us on our career website.
