description: |
  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

  We’re seeking a future team member for the role of Director,
  Full-Stack Engineering Manager to join our middle office
  platform team. This role is located in New York.

  In this role, you’ll make an impact in the following ways:

  - Consult with internal business groups to provide high-level
    application software development services and technical
    support.
  - Develop well-designed, testable, efficient code for both
    frontend and backend systems, including programming,
    testing, and automation.
  - Provide comprehensive senior-level technical consulting to
    IT management and senior technical staff, including
    evaluating compliance with technology standards.
  - Design, build, and maintain scalable full‑stack applications
    using modern frameworks (e.g., React, Java, Oracle, Kafka,
    Snowflake).
  - Architect and implement AI‑powered features using LLMs,
    vector databases, and orchestration frameworks.
  - Establish engineering best practices, coding standards, and
    architectural patterns that support long‑term agility.
  - Lead technical discovery, prototyping, and rapid
    experimentation to validate new ideas.
  - Mentor junior engineers, participate in code reviews, and
    actively engage in learning and applying emerging
    technologies and security principles.
  - This role provides technical leadership for embedding AI
    capabilities into core workflows while strengthening
    platform performance, stability, and scalability.
  - The Middle Office team is currently focused on client
    activation and committed delivery timelines. Without
    dedicated AI engineering leadership, modernization and AI
    enablement will compete directly with client delivery,
    creating material risk to client date commitments and
    production stability.
  - This role enables structured execution of the AI
    modernization roadmap while protecting client delivery,
    accelerating adoption of AI‑driven efficiencies, and
    ensuring the Middle Office platform remains fit for future
    growth."

  To be successful in this role, we’re seeking the following:

  - Bachelor’s degree in computer science, engineering, or a
    related discipline, or equivalent work experience.
  - 10-14 years of experience in software development;
    experience in the securities or financial services
    industry is a plus.
  - Expertise in frontend and backend development coding
    languages such as C#, Java, HTML, NodeJS, CSS, JSON,
    Angular, and JavaScript.
  - Proficiency in application frameworks, containerization,
    relational databases, architecture design principles, and
    security principles.
  - Prior lead experience selecting and implementing vendor-
    specific methodologies and consulting experience with
    structured methodologies.
  - Collaborate closely with product, operations, data, and
    security teams to deliver end‑to‑end solutions.
  - Communicate complex technical concepts to non‑technical
    stakeholders in clear, actionable terms.
  - Influence decision‑making through data, prototypes, and
    architectural insights.



