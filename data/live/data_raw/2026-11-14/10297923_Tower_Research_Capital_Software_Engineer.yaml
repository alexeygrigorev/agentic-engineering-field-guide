description: |
  Tower Research Capital is a leading quantitative trading
  firm founded in 1998. Tower has built its business on a
  high-performance platform and independent trading teams. We
  have a 25+ year track record of innovation and a reputation
  for discovering unique market opportunities. Tower is home
  to some of the world’s best systematic trading and
  engineering talent. We empower portfolio managers to build
  their teams and strategies independently while providing the
  economies of scale that come from a large, global
  organization.

  Engineers thrive at Tower while developing electronic
  trading infrastructure at a world class level. Our engineers
  solve challenging problems in the realms of low-latency
  programming, FPGA technology, hardware acceleration and
  machine learning. Our ongoing investment in top engineering
  talent and technology ensures our platform remains unmatched
  in terms of functionality, scalability and performance.

  At Tower, every employee plays a role in our success. Our
  Business Support teams are essential to building and
  maintaining the platform that powers everything we do —
  combining market access, data, compute, and research
  infrastructure with risk management, compliance, and a full
  suite of business services. Our Business Support teams
  enable our trading and engineering teams to perform at their
  best.

  At Tower, employees will find a stimulating, results-
  oriented environment where highly intelligent and motivated
  colleagues inspire each other to reach their greatest
  potential.

  Responsibilities

  - Build, maintain, and improve internal tools, data workflows,
    and operational web applications.
  - Develop Python-based services, automation scripts, data
    processing jobs, and internal utilities.
  - Work with business users and engineers to understand
    requirements, clarify ambiguity, and deliver practical
    software solutions.
  - Design and maintain workflows for data ingestion,
    transformation, validation, reconciliation, and reporting.
  - Write and debug SQL queries used for reporting,
    investigation, and operational analysis.
  - Build and iterate on AI-enabled internal tools for the telco
    team, including an internal AI chatbot/assistant for
    operational support, billing investigation, documentation
    discovery, and workflow guidance.
  - Develop AI agent workflows and integrations with internal
    APIs, databases, and documentation sources using patterns
    such as Model Context Protocol (MCP), function/tool
    calling, retrieval-augmented generation (RAG), and secure
    permission-aware access.
  - Maintain backend APIs and frontend interfaces for internal
    applications.
  - Debug issues across application code, databases, APIs, logs,
    configuration, and deployment environments.
  - Improve reliability, observability, test coverage,
    documentation, and maintainability of existing systems.
  - Use Git-based development workflows, code reviews, CI/CD
    pipelines, and deployment processes.
  - Communicate progress, assumptions, risks, and blockers
    clearly and early.

  Qualifications

  - Degree in Computer Science, Engineering, Mathematics,
    Physics, or a related technical field, or equivalent
    practical experience.
  - 3–5 years of professional software engineering experience.
  - Strong programming skills, preferably in Python.
  - Solid SQL skills and understanding of relational databases.
  - Experience working with production or business-critical
    codebases.
  - Experience with data workflows such as ETL, reporting,
    reconciliation, validation, or operational data
    processing.
  - Familiarity with web application development, backend APIs,
    and frontend/backend integration.
  - Comfortable working in Linux/Unix environments and using
    Git-based workflows.
  - Strong debugging and problem-solving skills across code,
    data, configuration, and environment issues.
  - Ability to work with ambiguous requirements, identify
    assumptions, ask targeted questions, and propose practical
    plans.
  - Strong ownership mindset and ability to drive well-scoped
    tasks to completion once context and direction are clear.
  - Clear communication skills, including concise status updates
    and early blocker reporting.
  - Ability to use AI coding tools thoughtfully while
    understanding, testing, and taking responsibility for the
    final output.

  Preferred Qualifications (not required)

  - Experience with Vue.js or similar frontend frameworks.
  - Experience building internal tools, admin portals,
    dashboards, workflow applications, or reporting systems.
  - Familiarity with Docker, Kubernetes, deployment
    configuration, service logs, or operational
    troubleshooting.
  - Experience with GitLab CI/CD or similar automation systems.
  - Experience with Python web frameworks such as Django, Flask,
    or FastAPI.
  - Experience with database schemas, migrations, indexes, or
    data validation logic.
  - Experience with observability tools, metrics, dashboards,
    alerts, or production monitoring.
  - Interest in improving internal platforms, automating manual
    workflows, and reducing operational burden.

  Anticipated annual base salary range $130,000 - $170,000,
  plus eligible for discretionary bonus

  Tower’s headquarters are in the historic Equitable Building,
  right in the heart of NYC’s Financial District and our
  impact is global, with over a dozen offices around the
  world.

  At Tower, we believe work should be both challenging and
  enjoyable. That is why we foster a culture where smart,
  driven people thrive – without the egos. Our open concept
  workplace, casual dress code, and well-stocked kitchens
  reflect the value we place on a friendly, collaborative
  environment where everyone is respected, and great ideas
  win.

  Our benefits include:

  - Generous paid time off policies
  - Savings plans and other financial wellness tools available
    in each region
  - Hybrid working opportunities
  - Free breakfast, lunch, and snacks daily
  - In-office wellness experiences and reimbursement for select
    wellness expenses (e.g., gym, personal training and more)
  - Company-sponsored sports teams and fitness events (JPM
    Corporate Challenge, Cycle for Survival, Wall Street Rides
    FAR and more)
  - Volunteer opportunities and charitable giving
  - Social events, happy hours, treats, and celebrations
    throughout the year
  - Workshops and continuous learning opportunities

  At Tower, you’ll find a collaborative and welcoming culture,
  a diverse team and a workplace that values both performance
  and enjoyment. No unnecessary hierarchy. No ego. Just great
  people doing great work – together.

  Tower Research Capital is an equal opportunity employer.
