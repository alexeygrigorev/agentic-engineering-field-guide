description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission

  At Zocdoc, you’ll lead a portfolio of Platform Engineering
  teams that build backend platforms, AI development
  platforms, developer tooling, and shared services used
  across our engineering organization. You’ll own the
  portfolio’s multi-year strategy, priorities, sequencing,
  investment choices, organizational design, and outcomes;
  connecting platform work to engineering velocity,
  reliability, cost efficiency, and measurable business
  impact.

  You’ll lead through managers and senior/staff engineers,
  building the organizational depth to scale beyond your
  direct involvement. You own Platform Engineering’s
  priorities, sequencing, operating standards, and outcomes.
  You’ll work directly with technical leadership to set the
  direction for major technical bets; you’ll translate that
  direction into an executable portfolio plan, define
  implementation guardrails, and create the mechanisms for
  teams to own delivery. You’ll partner with Engineering,
  Compliance, Security, and Infrastructure to align
  priorities, resolve cross-team trade-offs, drive adoption,
  improve operational health, and establish safe, effective
  AI-assisted and agentic development patterns within Platform
  Engineering.

  You'll enjoy this role if you are...

  - A platform leader who finds deep satisfaction in building
    what other engineers build on, and in creating leverage
    across a portfolio.
  - Interested in responsibly applying AI-assisted and agentic
    development to improve software delivery, with clear
    guardrails and measurable gains in quality, reliability,
    and speed
  - Comfortable holding breadth across developer platforms,
    CI/CD, cloud infrastructure, and shared services while
    keeping teams aligned around a coherent strategy.
  - Technically strong enough to partner with engineers on
    architecture and system design, and disciplined enough to
    lead through managers, senior engineers, and staff
    engineers.
  - Motivated by delivering business outcomes and energized by
    building inclusive, high-performing, psychologically safe
    teams.

  Your day to day is...

  - Lead, coach, and grow a portfolio of Platform Engineering
    teams through managers and senior/staff engineers,
    building leadership depth over time.
  - Set multi-year portfolio strategy and roadmap; make
    investment, sequencing, sunset, and decline decisions
    using business, customer, and operational signals.
  - Own Platform Engineering priorities, operating standards,
    and outcomes; translate technical leadership’s direction
    for major bets into priorities, guardrails, and execution
    plans.
  - Resolve cross-team trade-offs in sequencing, reliability,
    and operations while delegating detailed design and
    implementation to managers and staff engineers.
  - Establish safe, measurable patterns for AI-assisted
    development across planning, coding, testing, deployment,
    and operations, with practical privacy, security, quality,
    and reliability guardrails.
  - Treat platforms as products: understand internal customers,
    use feedback loops, drive adoption, measure outcomes, and
    simplify migrations and deprecations.
  - Own portfolio reliability and operational health by setting
    clear expectations, strengthening on-call practices, and
    driving learning from incidents.
  - Align engineering and cross-functional partners, unblock
    dependencies, hire exceptional leaders, and build an
    inclusive, high-performing, psychologically safe culture.

  You'll be successful in this role if you have...

  - 10+ years building and shipping software, with a strong
    foundation in Platform, Infrastructure, or Software
    Engineering.
  - 4+ years leading multiple engineering teams, including
    through managers, with responsibility for portfolio-level
    strategy, investment trade-offs, and outcomes; experience
    leading senior and staff engineers.
  - Deep expertise in one or more platform domains, such as
    developer platforms, CI/CD, cloud infrastructure, or
    shared services, plus the breadth and judgment to lead
    across the full portfolio.
  - Deep technical judgment in distributed systems,
    architecture, reliability, security, and modern software
    delivery practices, with the ability to evaluate options,
    shape implementation guardrails, and partner effectively
    with technical leadership on major architectural
    decisions.
  - A track record of treating internal platforms as products:
    understanding customer needs, driving adoption across
    teams, and measuring impact through clear outcomes.
  - Demonstrated success coaching and developing engineers and
    managers across career stages, including direct feedback
    and performance management.
  - Experience translating technical vision into business impact
    through clear prioritization, investment trade-offs, and
    measurable outcomes.
  - Experience evaluating or integrating AI tooling into
    engineering workflows, with practical judgment about
    privacy, security, quality, and reliability guardrails as
    AI adoption grows; deep AI-platform specialization is not
    required.
  - A clear, proactive communicator with a bias to action,
    humility, and a track record of building inclusive, high-
    performing, psychologically safe teams while aligning
    technical and non-technical stakeholders.

  REMOTE

  - Flexible work environment
  - Unlimited Vacation(if salaried) / Competitive PTO (if
    hourly)
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging

