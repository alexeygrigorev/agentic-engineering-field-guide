description: |
  Availity delivers revenue cycle and related business
  solutions for health care professionals who want to build
  healthy, thriving organizations. Availity has the powerful
  tools, actionable insights and expansive network reach that
  medical businesses need to get an edge in an industry
  constantly redefined by change.

  At Availity, we're not just another Healthcare Technology
  company; we're pioneers reshaping the future of healthcare!
  With our headquarters in vibrant Jacksonville, FL, and an
  exciting office in Bangalore, India, along with an
  exceptional remote workforce across the United States, we're
  a global team united by a powerful mission. We're on a
  mission to bring the focus back to what truly matters –
  patient care. As the leading healthcare engagement platform,
  we're the heartbeat of an industry that impacts millions.
  With over 2 million providers connected to health plans, and
  processing over 13 billion transactions annually, our
  influence is continually expanding. Join our energetic,
  dynamic, and forward-thinking team where your ideas are
  celebrated, innovation is encouraged, and every contribution
  counts. We're transforming the healthcare landscape, solving
  communication challenges, and creating connections that
  empower the nation's premier healthcare ecosystem.

  The Software Engineer IV will provide senior technical
  leadership for the design, development, and operation of
  Availity’s data platform processes and services. This role
  is responsible for building and operating the data processes
  that support reliable, secure, and scalable data ingestion,
  storage, processing, and access across the organization,
  while owning a member-facing membership application end to
  end.

  As a leading member of the team, this engineer will drive
  architecture and design decisions, translate business and
  platform requirements into technical designs, establish
  engineering standards, and mentor other engineers through
  disciplined execution. This individual partners closely with
  product, application engineering, information management,
  and analytics teams to ensure the platform and the
  membership application meet current and future business
  needs, while keeping a keen eye on overall performance,
  reliability, and data integrity.

  Sponsorship, in any form, is not available for this
  position.

  Location: Remote, US

  Role qualifications:

  - 6+ years of progressive work experience developing software
    products in an Agile and/or iterative development
    environment.
  - Bachelor’s degree in Computer Science, Information Systems,
    or Information Management. Master’s degree preferred but
    not required.
  - Proven commitment to working in a senior engineer role,
    including mentoring and design guidance.
  - Direct experience with data modeling and data architecture
    design, with a solid understanding of database technology
    including SQL and NoSQL databases.
  - Strong experience building and maintaining data pipelines
    and data processes capable of handling large volumes of
    data in a stable and observable manner.
  - Experience building and consuming RESTful APIs and web
    services for both internal and external use.
  - Proficiency with the following languages & frameworks:
  - Scala
  - Python (including NumPy, Pandas, and related data libraries)
  - SQL databases
  - Scripting languages such as SQL, HTML, JavaScript, or Shell
  - A data processing framework such as Spark, Flink, or similar
  - AWS experience or equivalent cloud experience.
  - Experience with automated unit testing and acceptance
    testing frameworks.
  - Working experience with source code version control
    (preferably Git and GitHub/GitLab).
  - Working knowledge of the Software Development Lifecycle,
    building CI/CD pipelines, and practicing Test Driven
    Development.
  - Experience with Docker and Kubernetes (EKS) is a plus.
  - Experience with Terraform is a plus.
  - Knowledge of the healthcare industry is a plus.

  What will set you apart:

  - Healthcare industry experience, particularly with
    membership, eligibility, or benefits data.
  - Experience owning and evolving core data or platform
    infrastructure at scale.
  - Experience improving engineering productivity through
    standards, tooling, and automation.
  - Background in reliability, performance optimization, or
    large-scale distributed systems.
  - Adherence to engineering best practices.

  What you will be doing:

  - Designing and developing scalable, maintainable, data-driven
    systems and data processes that demonstrate best
    practices.
  - Owning a membership application end to end — from detailed
    design, documentation, and development through unit
    testing, deployment, and ongoing maintenance.
  - Building and maintaining data pipelines and processes
    capable of handling large volumes of data in a stable and
    observable manner.
  - Improving the speed, efficiency, and scalability of the
    continuous integration environment, automating wherever
    possible using Python, SQL, RESTful APIs, and other
    frameworks.
  - Applying modern software architecture patterns (distributed
    systems, microservices, etc.) to build well-structured,
    reusable, maintainable, and intentionally designed code.
  - Consulting on the design and development of databases,
    writing database queries and required table definition
    modifications.
  - Leveraging CI/CD principles using Git, Jira, and AWS.
  - Creating standards for and documenting the systems you help
    build.
  - Reviewing code written by other team members and
    collaborating with software and data engineers in the
    design and code review process.
  - Coaching and mentoring junior engineers and providing design
    guidance across the team.
  - Partnering with all stakeholders to determine technical
    feasibility, estimate work efforts, and identify potential
    slippage or inter-team dependencies.
  - Innovating and sharing ideas to improve products and
    processes, big and small.

  Availity culture and benefits:

  - Availity is a certified “Great Place to Work”, a “Best
