description: |
  We are looking for a full-stack engineer with a passion for
  crafting and delivering software solutions to be part of its
  diverse, globally distributed team of IT professionals
  responsible for the development and maintenance of our
  client platforms and offerings.

  In this role you will use your knowledge of software
  development, platform integration, and cloud computing to
  modernize a diverse suite of applications that support our
  intermediary (clearing and custody) business! You will be a
  member of our team collaborating with product management,
  architecture, engineering, and technology partners to
  innovate, design, and deliver highly scalable applications
  and platforms using Agile methodologies.

  The Expertise and Skills You Bring

  - Bachelor's or master’s degree in Computer Science, Software
    Engineering or related field
  - 5+ years of relevant full stack development experience
    developing, and maintaining multi-tier applications
  - Strong expertise with the following desired skills:
    Java/JEE, Spring/Springboot, RESTful Services, Cloud
    (AWS), SQL, NoSQL, Python, Test and Deployment
    technologies, Kubernetes
  - Experience with API design & development, AWS (Cloud)
    Migration, Data Design, Batch Processing, Workflow/Process
    Automation and UI
  - Cloud skills working with AWS EKS/ECS and AWS handled
    solutions such as Lambda, SQS, EC2, S3, CloudWatch and IAM
    roles/polices
  - Terraform experience preferred, CloudFormation Templates
  - Experience using logging/observability tools such as
    Datadog, Splunk
  - Solid CI/CD skills including full scale security and quality
    testing, build and deployment automation
  - Proficiency with front-end frameworks, libraries, and
    related technologies a plus
  - Good analytical, communication and preparation skills and
    the ability to run with multiple tasks at a given time
  - Proficient with Agile methodologies

  The Value You Deliver

  - Deliver high quality, timely, efficient and maintainable
    software solutions in an agile environment to meet
    functional and non-functional business requirements
  - Actively contribute to and improve engineering practices
    such as code and design reviews, source control strategy,
    environment strategy, and CI/CD pipelines
  - Work with product owners, peer technologists and architects
    as required to deliver technical improvements to the
    platform
  - Develop an understanding of the business domain and actively
    participate in technology discussions with partners
  - Investigate creative practices and share them with your
    teams











  Compensation, Benefits and Duration



  Minimum Compensation: USD 35,000 Maximum Compensation: USD
  123,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
