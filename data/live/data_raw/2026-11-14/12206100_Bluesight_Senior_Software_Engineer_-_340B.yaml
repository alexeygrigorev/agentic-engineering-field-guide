description: |
  At Bluesight, our mission is to create groundbreaking
  solutions that increase efficiency, safety and visibility
  for health systems, hospital pharmacy, and pharmaceutical
  manufacturers.  We empower our customers to deliver the
  right medicine to the right patient at the right time, every
  time.  We are a high growth healthcare information
  technology company with a start-up 'vibe' but over 3,000
  customers using our proven solutions.



  Bluesight is looking for a Senior Full-Stack Software
  Engineer to help us redefine and grow our suite of
  healthcare data products in support of the company's mission
  of powering hospital and pharmacy operations. Our hospital
  and pharmacy customers rely on us to keep their patients
  safe and their pharmacies running smoothly while delighting
  them with every release. Through our controlled substance
  tracking platform, we're committed to improving medication
  management and compliance for our nation's healthcare
  providers; and our data operations and products are the
  backbone of that mission. On the 340BCheck team, you'll be
  helping our customers ensure complete and continuous 340B
  program compliance through automated auditing across
  multiple data sources, comprehensive documentation, and
  centralized communication and collaboration.

  As a Senior Full-Stack Software Engineer on the 340BCheck
  team, you'll be a key technical contributor working across
  the stack to deliver high-quality features and drive
  meaningful improvements to the product. You'll own the end-
  to-end delivery of your work, contribute to architectural
  decisions, and help raise the technical bar for the team
  through code reviews, mentorship, and leading by example.

  You Can Expect To

  - Build and maintain applications and services across the full
    stack using React & TypeScript, Python & FastAPI, and
    Terraform, built and deployed by CodeBuild
  - Design and own technical initiatives spanning multiple
    engineers and sprints
  - Develop subject matter expertise in the 340BCheck program,
    contribute to architectural decisions, and set technical
    direction within those domains
  - Create and establish coding patterns and technical designs
    adopted by the team
  - Ensure application performance, security, and scalability
    meet the highest standards, providing guidance on
    performance optimization
  - Create comprehensive unit and integration tests to maintain
    code quality and reliability
  - Identify and resolve complex technical problems in the
    codebase with strong debugging skills across the stack
  - Collaborate with cross-functional teams including Product,
    QA, and adjacent engineering teams to implement solutions
  - Lead code reviews, providing constructive feedback, and
    champion best practices
  - Mentor junior engineers, foster a culture of learning,
    growth, and technical excellence
  - Positively influence team culture and engineering practices
  - Communicate technical tradeoffs clearly to both engineering
    and non-technical stakeholders
  - Use gen AI tools effectively in your own workflow and help
    establish best practices for AI-assisted development on
    the team

  Required Qualifications & Skills

  - Professional software engineering experience with deep
    strength in one or more areas of the stack (front-end,
    back-end, or infrastructure) and proficiency across the
    entire stack
  - Solid understanding of software engineering best practices
    (code reviews, source control, build processes, testing,
    etc.)
  - Strong understanding of relational database systems (MySQL),
    with experience designing for scale
  - Experience with Infrastructure as Code (Terraform) and
    deploying production services end-to-end
  - Demonstrated expertise in writing comprehensive tests (unit,
    integration, end-to-end) to ensure code quality and
    reliability
  - Proven experience in product development, translating
    business requirements into scalable and user-centric
    software solutions
  - Exceptional problem-solving skills and the ability to
    troubleshoot complex technical challenges
  - Excellent verbal and written communication skills, with the
    ability to effectively collaborate within cross-functional
    teams
  - Experience using gen AI tools in your development workflow
  - A proactive and self-driven attitude towards learning,
    innovation, and continuous improvement
  - A passion for leading by example, sharing knowledge, and
    fostering a culture of ownership and technical excellence

  Preferred Qualifications

  - Database administration experience, preferably AWS Aurora
    MySQL
  - Experience with observability tooling (DataDog)
  - Experience integrating Electronic Health Record (EHR) data
    into enterprise software
  - Prior experience in a regulated/compliance-driven healthcare
    or controlled-substance domain

  What You'll Get From Us

  - Ownership of problems of scale, technical debt, and security
    that shape what's possible in medication intelligence
  - Room to be creative and choose your own path
  - Trust in your sense of ownership
  - Dedicated budget for training and career development
  - Coworkers who you'll learn from, who will push you, and who
    are looking to learn from you

  This position is open to applicants in the continental
  United States.



  Why Bluesight?

  Bluesight’s culture is built on innovation and teamwork.
  There’s room to grow and opportunities to take initiative.
  You will partner with sharp, motivated teammates looking to
  disrupt a massive industry—and have fun doing it.  We truly
  believe that where you work and what you do matters.  Join
  us as we revolutionize the hospital pharmacy landscape!

  -Competitive salary

  -Time off when you need it – unlimited vacation days!

  -Generous insurance coverage

  -401k program with a company match

  -Fun, collaborative culture!



  EOE AA M/F/VET/Disability



  All qualified applicants will receive consideration for
  employment and will not be discriminated against on the
  basis of race, religion, color, national origin, sex,
  protected veteran status, disability, or any other basis
  protected by federal, state or local laws.
