  Lead Embedded Software Engineer - Defense Solutions

  Curtiss Wright is seeking an experienced Lead Embedded
  Software Engineer to join our Defense Solutions Group.

  As our Lead Software Engineer-Embedded Computing Software,
  you will oversee and perform the design, development,
  enhancement, and testing of complex software for embedded
  processing products used in US DoD and other secure
  applications. The Lead Software Development engineer also
  serves as a technical expert who drives architecture
  decisions, resolves advanced software issues, and ensures
  high-quality solutions that are aligned with product,
  customer, and business needs.

  Location: New Hamshire, USA (Remote)

  Salary Information: $ 108,900.00 - $145,200.00 per year plus
  bonus

  Please note that the salary range information provided is a
  general guideline only, reflecting a position based in
  Virginia. Criteria such as the candidate’s qualifications
  and relevant experience, the scope of the specific position,
  as well as market and business considerations will be
  evaluated when extending an offer.

  We Take Care of Our People

  Paid Time Off I 401K with Employer Match and Profit Sharing
  I Health and Wellness Benefits I Learning and Development
  Opportunities I Referral Program I Competitive Pay I
  Recognition I Employee Stock Purchase Plan I Inclusive &
  Supportive Culture

  Your Challenge:

  - Participate in discussions and analyze marketing and product
    line managers’ product plans and requirements and generate
    the software specifications and requirements for new
    products and enhancements to current products. Assist in
    Bids and Proposals (B&P) efforts, including generating
    engineering labor and material estimates based on
    requirements and defined scope of effort.
  - Collaborate with systems engineering and hardware
    development teams, and work with technical staff to create
    sustainable solutions and develop resolutions for software
    and/or hardware problems.
  - Plan, design, develop, and test new embedded computing
    software or complex enhancements to existing software for
    embedded systems based on specifications, and in
    compliance to industrial, military, and aerospace
    standards.
  - Implement and integrate, or debug embedded software
    including bootloaders (BIOS, SlimBootLoader and U-Boot),
    device drivers (Linux and VxWorks), customized
    applications and embedded test software, and product
    simulation and production test software.
  - Diagnose and resolve advanced software defects by
    collaborating with cross-functional technical staff and
    applying expert-level analytical and troubleshooting
    skills
  - Evaluate and respond to customer-reported issues,
    recommending and implementing software modifications or
    enhancements to improve functionality and user experience
  - Assist in the development of software design and test
    documentation, and user manuals.

  What You Bring:

  - U.S. citizenship required.
  - Bachelor’s degree in computer science, Computer Engineering,
    Software Engineering, or a related technical field;
    advanced degree preferred.
  - 8–12+ years of progressive software development experience,
    including ownership of complex applications or subsystems.
    5+ years’ experience developing software systems and 4+
    years software project lead experience
  - Competencies in computer architecture, development of real-
    time embedded software, and engineering process
    discipline.
  - Hands-on and demonstrable experience with software
    development using C/C++, Linux (Red Hat, LynxOS,
    WindRiver), VxWorks (7.x), Linux and VxWorks device
    drivers, Scripting(bash/csh), high-level application
    software, Python, LabVIEW and IPMI.
  - Hands-on and demonstrable experience with development tools
    such as IDEs (Visual Studio, Eclipse-based), AMD/Xilinx
    Vivado/Vitis, Petalinux, GCC, CMake, Yocto, and MS Office.
  - Hands-on and demonstrable experience with with Intel x86
    Processors, ARM, and AMD Zynq MPSoCs.
  - Knowledge and experience with protocol/standard, e.g.,
    Ethernet, Infiniband, RDMA, PCIe Gen3/4, SPI, I2C, and
    RS232/RS422
  - Hands-on and demonstrable experience with laboratory
    debugging equipment and tools, e.g., Oscilloscope, Logic
    Analyzer, Spectrum Analyzer, and JTAG emulators
  - Proficiency with requirements management (IBM Rational
    DOORS), source code control (git, Bitbucket), JIRA, &
    Confluence
  - Familiarity with GreenHills Multi SW Development Suite,
    COSMIC SW Development Suite, ClearQuest, VectorCAST,
    LabVIEW
  - Familiarity with virtualization concepts and LynxOS
    Hypervisor preferred
  - Full software lifecycle development experience in accordance
    with DO-178C and CMMI
  - Fundamental understanding of software regression
    testing/verification
  - Strong analytical, problem-solving, and cross-functional
    collaboration skills.
  - Proven ability to interface with customers, resolve
    escalated technical issues, and translate feedback into
    actionable improvements.
  - Familiarity with industry guidelines and standards for
    engineering processes

  Who We Are:

  Our Values

  Environmental, Social and Governance

  Curtiss-Wright's Defense Solution division is a trusted,
  proven leader, delivering superior products and services
  that meet the defense and aerospace industries' toughest
  challenges with best-in-class value. Our solutions address
  air, ground, and naval defense applications, and are focused
  on growth segments with a high demand for advanced
  technology, enhanced safety, security, and performance. As a
  leading Modular Open Systems Approach (MOSA) solutions
  supplier for battlefield platforms and communication
  systems, we are uniquely positioned to benefit from the
  DoD's commitment to maintaining technological superiority on
  the battlefield.

  To learn more visit: Home | Curtiss-Wright Defense Solutions
  (curtisswrightds.com)

