description: |
  About Us

  At Prophet Security, we're not just building a platform that
  automates complex security tasks—we're building a company
  where every team member has a direct impact on customer
  success. As a member of our team, you'll have the unique
  opportunity to work closely with our customers, understand
  their needs, and see firsthand how your work is making a
  difference.

  If you're passionate about building impactful products,
  working in a collaborative environment, and gaining valuable
  experience in a fast-growing startup, we encourage you to
  apply.

  Prophet Security’s founding team brings over 30 years of
  cybersecurity experience from leading companies, including
  Abnormal Security, Expel, Mandiant, McAfee, Oracle, Red
  Canary, Red Hat, Riverbed, and Symantec. We are now focused
  on disrupting the $400B security labor market by building
  the future of automated security operations.

  What Our Platform Does

  Prophet Security is a force multiplier for security teams.
  Our platform analyzes alerts, develops and executes
  investigation plans, and provides detailed findings and
  actionable recommendations. Analysts review these
  investigations, adding context and feedback that are
  continuously incorporated into future automation.

  Our mission is to fundamentally shift cybersecurity power
  dynamics to favor defenders—making security teams more
  effective, efficient, and scalable.

  The Impact You’ll Have

  As a Frontend Engineer at Prophet Security, you’ll help
  build the interfaces through which customers experience the
  next generation of security automation. You’ll lead the
  implementation of key frontend features for our Agentic AI
  SOC Platform, creating intuitive, powerful experiences that
  make complex security workflows feel seamless.

  Working closely with product, design, and engineering,
  you’ll contribute to a scalable frontend foundation and help
  us deliver a polished, reliable product for security teams.

  What You’ll Do

  - Lead the implementation of frontend features using React and
    TypeScript.
  - Build and maintain reusable components and contribute to our
    design system.
  - Partner with product and design to translate complex
    functionality into intuitive, high-quality user
    experiences.
  - Improve frontend performance, accessibility, reliability,
    and cross-browser compatibility.
  - Collaborate with backend engineers to develop efficient APIs
    and data flows.
  - Participate in technical reviews and contribute to frontend
    development standards.
  - Help identify opportunities to improve our frontend
    architecture and developer experience.
  - Advocate for a thoughtful, consistent user experience
    throughout the product development process.

  Qualifications

  - At least 2–3 years of professional software engineering
    experience, with a focus on frontend development.
  - Strong experience with React, TypeScript, HTML, and CSS;
    experience with Tailwind is a plus.
  - Experience building and shipping polished, production-
    quality user interfaces.
  - A solid understanding of component-based architecture, state
    management, and responsive design.
  - Strong product and design instincts, with attention to
    usability and visual detail.
  - The ability to collaborate effectively with engineers,
    designers, and product partners.
  - Comfort working through ambiguity in a fast-moving startup
    environment.
  - Bonus: Experience with cybersecurity products, AI/ML-powered
    interfaces, or real-time data visualization.

  Our Culture

  Our employees are recognized as our top asset, and we
  provide great benefits, meaningful equity participation, and
  a fun, inspiring environment to create and collaborate.

  We live by the following values:

  - Customer Centricity: Focus on exceeding customer
    expectations and placing them at the core of decisions.
  - Practicality over Perfection: Emphasis on efficient
    solutions and agile decision-making.
  - Strive for Excellence: Commitment to high standards and
    continuous improvement.
  - Transparent Communication: Encouragement of open, honest
    dialogue and collaborative trust.
  - Unwavering Resilience: Determination to overcome challenges
    and persist in achieving goals.
  - Have Fun: Foster a positive work environment that balances
    hard work with enjoyment and creativity.
