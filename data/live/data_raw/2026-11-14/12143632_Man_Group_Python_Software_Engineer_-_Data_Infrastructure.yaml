description: |
  About Man Group

  Man Group is a global alternative investment management firm
  focused on pursuing outperformance for sophisticated clients
  via our Systematic, Discretionary and Solutions offerings.
  Powered by talent and advanced technology, our single and
  multi-manager investment strategies are underpinned by deep
  research and span public and private markets, across all
  major asset classes, with a significant focus on
  alternatives. Man Group takes a partnership approach to
  working with clients, establishing deep connections and
  creating tailored solutions to meet their investment goals
  and those of the millions of retirees and savers they
  represent.

  Headquartered in London, we manage $253.6 billion* and
  operate across multiple offices globally. Man Group plc is
  listed on the London Stock Exchange under the ticker EMG.LN
  and is a constituent of the FTSE 250 Index. Further
  information can be found at www.man.com

  At Man Group, we respect your privacy and we are committed
  to protecting and safeguarding your Personal Data. We have
  developed policies and processes which are designed to
  provide for the security and integrity of your Personal
  Data. We are committed to Processing your Personal Data
  fairly and lawfully, and being open and transparent about
  such Processing. For further information on how we process
  your data, please see the privacy notice for applicants
  here.

  * As at 30 June 2026

  The Team

  Join our Data Platform Engineering team at the heart of a
  quantitative investment firm, powering the data
  infrastructure which drives our systematic trading
  strategies and cutting-edge discretionary research.

  As a Python Engineer, you’ll help architect our multi-
  petabyte scale estate, processing billions of datapoints
  daily from thousands of data sources. Our stack combines
  Java and Python, with foundations of Kafka, ArcticDB,
  Airflow, Spark, and more. This is an opportunity to tackle
  complex distributed systems challenges at an exceptional
  scale across thousands of unique datasets.

  AI agents are fast becoming primary consumers of our data,
  which makes improving its discoverability and usability for
  both people and agents a source of green-field work for the
  team.

  Role Responsibilities

  - Build and ship features on a high-throughput platform
    processing billions of market data points and thousands of
    files daily
  - Tackle hard distributed systems problems at a scale few
    Engineers encounter
  - Work closely with quant researchers and traders to turn
    complex requirements into elegant platform solutions
  - Drive platform reliability through rigorous incident
    response, root-cause analysis, and systemic fixes
  - Raise the engineering bar through thoughtful code review and
    mentoring of junior team members

  Key Competencies

  Essential

  - 4+ years of professional experience in software engineering
    with Python or Java as your primary language
  - Proficient on Linux platforms and strong understanding of
    Git
  - Deep knowledge of one or more relevant database technologies
    such as Iceberg, PostgreSQL, or MongoDB
  - Embracing agentic engineering: willingness and ability to
    work effectively with AI-assisted development tools as
    part of daily workflow
  - Strong problem-solving skills and attention to detail
  - Strong communication and collaboration abilities
  - Ability to work independently and gather requirements from
    stakeholders

  Advantageous

  - Strong academic record and a degree with high mathematical
    and computing content e.g. Computer Science, Mathematics,
    Engineering or Physics
  - Familiarity with distributed systems and orchestration
  - Experience with performance optimization and large-scale
    data processing
  - Contributions to open-source projects
  - Experience with market data
  - Expertise in streaming or real-time data processing

  Inclusion, Work-Life Balance and Benefits at Man Group
  You'll thrive in our working environment that champions
  equality of opportunity. Your unique perspective will
  contribute to our success, joining a workplace where
  inclusion is fundamental and deeply embedded in our culture
  and values. Through our external and internal initiatives,
  partnerships and programmes, you'll find opportunities to
  grow, develop your talents, and help foster an inclusive
  environment for all across our firm and industry. Learn more
  at www.man.com/diversity. You'll have opportunities to make
  a difference through our charitable and global initiatives,
  while advancing your career through professional
  development, and with flexible working arrangements
  available too. Like all our people, you'll receive two
  annual 'Mankind' days of paid leave for community
  volunteering.

  Our comprehensive benefits package includes competitive
  holiday entitlements, pension/401k, life and long-term
  disability coverage, group sick pay, enhanced parental leave
  and long-service leave. Depending on your location, you may
  also enjoy additional benefits such as private medical
  coverage, discounted gym membership options and pet
  insurance.

  Equal Employment Opportunity Policy

  Man Group provides equal employment opportunities to all
  applicants and all employees without regard to race, color,
  creed, national origin, ancestry, religion, disability, sex,
  gender identity and expression, marital status, sexual
  orientation, military or veteran status, age or any other
  legally protected category or status in accordance with
  applicable federal, state and local laws.

  Man Group is a Disability Confident Committed employer; if
  you require help or information on reasonable adjustments as
  you apply for roles with us, please contact
  TalentAcquisition@man.com.
