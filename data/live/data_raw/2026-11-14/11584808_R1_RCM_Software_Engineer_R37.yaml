description: |
  At R1, we’re transforming how healthcare works by combining
  nearly two decades of revenue cycle expertise with advanced
  technology, including analytics, AI, intelligent automation
  and workflow orchestration. We pair that technology with the
  irreplaceable expertise of our people to help hospitals,
  health systems and medical groups improve financial
  performance, simplify administrative complexity and create
  better experiences for patients and providers.

  All Together Better defines our culture and the way we work.
  We’re a diverse, global team united by a shared mission to
  make healthcare work better for all. Across technology,
  operations and support functions, our people bring deep
  expertise, empathy and ingenuity to the work we do. Here,
  collaboration fuels progress, adaptability sparks innovation
  and every voice can help shape what’s next for R1 and the
  future of healthcare.

  About R37

  R37 is R1’s AI innovation lab, building technology to
  transform healthcare.

  Our flagship platform, Phare OS, uses AI and automation to
  improve critical pre-bill workflows, including
  authorization, utilization management, documentation and
  coding. By identifying and resolving issues before claims
  are submitted, Phare OS helps prevent denials, improve
  reimbursement and move revenue cycle work upstream.

  What makes R37 different is the opportunity to build
  advanced AI at real-world scale. R1 works across 95 of the
  top 100 U.S. health systems, giving R37 access to the data,
  workflows and reach needed to make an immediate impact:

  - 180M+ claims
  - 550M+ patient encounters
  - 1.2B+ workflow actions and outcomes annually



  This is startup-level ownership with enterprise-level
  impact. You’ll build technology that moves from idea to real
  healthcare environments, solving complex problems at scale
  and changing how healthcare works.



  As our Software Engineer, you will help build and scale AI-
  native products that transform complex workflows into
  intelligent, automated solutions. Every day you will design
  and develop full-stack applications and services, partner
  with product teams to deliver AI-driven features that solve
  real customer problems, and build reliable systems that
  combine traditional software engineering, machine learning,
  and generative AI technologies.

  To thrive in this role, you must be a strong full-stack
  engineer who enjoys end-to-end ownership, is passionate
  about building production-ready systems, and is excited
  about applying AI to create meaningful business impact.



  Here's what you will experience working as a Software
  Engineer:

  - Design, code, test, deploy, and operate frontend
    applications, backend services, data pipelines, and AI
    systems that power models, specialized reasoning and
    resolution agents, and human-in-the-loop AI features
  - Run A/B tests and ship production features tied to real
    business outcomes
  - Partner closely with product managers and operators to turn
    cumbersome manual workflows into agentic and AI-driven
    automations
  - Work with AI and ML engineers to build AI-native systems
    that combine deterministic logic, traditional ML models,
    and LLMs
  - Design and build secure, compliant, and reliable systems at
    scale



  Required Skills:

  - 3-6+ years of software engineering experience building,
    deploying, and supporting production systems.
  - Proven experience owning features, products, or services
    throughout the entire software development lifecycle.
  - Experience designing and troubleshooting scalable systems
    with a focus on performance, reliability, and data
    integrity.
  - Strong proficiency in modern software development practices
    and full-stack application development.
  - Ability to lead projects independently and collaborate
    effectively with cross-functional stakeholders.
  - Strong commitment to clean code, software quality,
    operational excellence, and production readiness.

  Bonus if you have: Healthcare or RCM Experience



  Role Leveling:

  We are looking for candidates at various levels, ranging
  from Level 2 to Staff

  - L2: Independently delivers a complete end-to-end project,
    owning design, implementation, and delivery of scoped work
    (Compensation Range for L2: $120k - $150k)
  - L3: Leads delivery of larger projects, handling increased
    technical complexity and ambiguity, providing light
    guidance to L2s on shared work (Compensation Range for L3:
    $140k - $220k)
  - Senior: Team Lead responsible for managing a portfolio of
    projects that contribute to major technical initiatives.
    (Compensation Range for Senior: $140k - $255k)
  - Staff: Impact at the organizational level. Responsible for
    leading multiple teams or multiple broad initiatives
    simultaneously, ensuring that high-level technical goals
    are met across the entire organization. (Compensation
    Range for Staff: $140k - $300k)

  Benefits

  - Top-of-market compensation, including bonus that starts at
    10%
  - Flexible PTO
  - Comprehensive health benefits
  - 401(k) matching
  - Inspiring, brilliant, mission-driven teammates

  For this US-based position, the base pay range is
  $105,000.00 - $202,500.00 per year . Individual pay is
  determined by role, level, location, job-related skills,
  experience, and relevant education or training.This job is
  eligible to participate in our annual bonus plan at a target
  of 10.00%

  The healthcare system is always evolving — and it’s up to us
  to use our shared expertise to find new solutions that can
  keep up. On our growing team you’ll find the opportunity to
  constantly learn, collaborate across groups and explore new
