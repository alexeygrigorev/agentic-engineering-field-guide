description: |
  About Grid

  We founded Grid to design future-proof solutions for
  financial firms and startups struggling to keep pace with
  the breakneck advance of fraud tactics. A new player in the
  fraud prevention space with deep roots in financial business
  management, we came by our mission the hard way.

  After our consumer business fell victim to one of the
  infinite variations of fraud, our co-founders set out to
  create a platform that’s more of a fortress than a tool —
  saving our clients millions in annual revenue and a ton of
  restless nights. The result? A fraud prevention platform
  that  integrates multiple data providers into a single,
  powerful solution designed for rapid deployment and ease of
  use.

  About the Role

  - Build UI in ReactJS that is identical to the original Figma
    designs down to the margins and padding.
  - Implement Responsive Web Design UI that adapts to various
    screen sizes based on design specifications.
  - Integrate with RESTful APIs using custom hooks to manage
    state.
  - Write strong unit and end-to-end tests that are ran in a
    robust CI/CD pipeline ensuring quality of code.
  - Communicate with backend team to address any discrepancies
    in API spec outside of project manager.
  - Leverage browser dev tools to investigate performance issues
    and identify opportunities for optimization.
  - Work autonomously and make system architecture decisions
    that are resistant to change leveraging your experience.
  - Deploy changes to production to customers on a weekly
    cadence.
  - Own the frontend code base and make critical decisions that
    impact the integrity and resilience of the source code.

  About You

  - 5+ years of full-time experience as a Software Engineer
  - BS in Computer Science or commensurate experience
  - Extensive experience with NextJS
  - Proficient in JavaScript and TypeScript programming
    languages
  - Impeccable knowledge in ReactJS mechanics - hooks, reducers,
    contexts, props
  - Proven track record for integrating with RESTful APIs
  - Strong familiarity with Figma or similar collaborative
    design tools
  - Skilled at deep investigation solving bugs and UI issues
  - Writing unit and end-to-end tests are second nature to you

  Our Stack

  - NextJS
  - JavaScript
  - ReactJS
  - Redux
  - Sass
  - JestJS
  - Figma
  - Heroku
  - Git

  Bonus

  - Experience in Finance, FinTech, or Identity Verification.

