description: |
  About us

  At Meow, we provide startups with business accounts,
  corporate cards, and the clean financial reporting they need
  to operate and raise capital. Our customers are complex and
  global, from crypto protocols to multi-entity international
  businesses. We combine financial infrastructure with hands-
  on support so founders can operate efficiently and scale
  with confidence.

  We’re hiring a Software Engineer who wants real ownership in
  a fast-moving startup environment.

  What You’ll Do

  - Build full-stack web features (front-end, back-end) from
    zero to one.
  - Comfortable with building against 3rd-party APIs and have a
    good mind for state machines. The financial system is one
    giant state machine.
  - Own your work from inception to launch and beyond. We expect
    engineers to hop in customer channels and iterate with our
    customers post product-launch.
  - Hold yourself accountable to high standards of quality.

  Requirements

  - 1-4 years of experience in full-stack web development,
    preferably with exposure to smaller companies where
    flexibility and versatility are key
  - Full-stack experience: Comfortable working across both
    front-end and back-end technologies (our tech stack:
    TypeScript, React, Python (FastAPI), Postgres, AWS)
  - Side projects: You've built something because you wanted to
    or because you're ambitious or just for the sake of
    building.
  - Must be authorized to work in the U.S. without sponsorship.
    U.S. citizenship or permanent residency is required.

  Compensation

  Total compensation may vary and could include equity and
  additional benefits depending on the position offered and
  location.

  This is a high-autonomy role where you’ll work directly with
  innovative, early-stage startups, gaining exposure to
  complex business models and global operations.
