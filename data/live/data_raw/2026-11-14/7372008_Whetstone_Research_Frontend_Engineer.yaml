description: |
  About the role

  This role is going to be working on Pure Markets.

  Responsibilities

  - Implementing - new UI features and improved designs
  - Testing - automate UI testing alongside a release pipeline
  - Shipping - overseeing successful production releases

  What we're looking for

  Hopefully you're obsessed with implementing high quality
  user experiences and interfaces. Ideally you're product
  minded and have a deep amount of respect for users. You love
  the blockchain industry and everything that entails,
  including an understanding of why non-custodial UX is what
  it is. You enjoy quickly testing out and iterating on a
  product until finding something that converts to real,
  tangible outcomes. You work well as part of a team, know
  when to ask for help, and lean on your colleagues in a
  remote environment to ensure we are continuously releasing
  improvements. You have experience delivering highly reliable
  and modern interfaces to millions of users.

  About Whetstone Research

  Whetstone Research is focused on designing and building new
  protocols that accelerate the future of onchain markets. The
  team is less than 10 people with deep hands on experience in
  the blockchain industry; previously at Uniswap, Primitive,
  Aztec, and numerous others. We are working on Doppler, a
  hyper-efficient price discovery and liquidity bootstrapping
  Protocol built on the EVM, used by Zora and others. Learn
  more about Whetstone on our website or read our blog. Let's
  build the future of onchain markets together.
