  which may include the California Consumer Privacy Act
  (CCPA), the EU General Data Protection Regulation (GDPR),
  Canada's Personal Information Protection and Electronic
  Documents Act (PIPEDA) and applicable provincial privacy
  legislation, and other applicable national or local privacy
  laws. For full details on what personal data we collect, how
  we use it, your rights as an Applicant, and how to contact
  us with privacy-related questions, please review the
  relevant Applicant Data Privacy Notices: US Applicant Data
  Privacy Notice & Canada Data Privacy Notice.
