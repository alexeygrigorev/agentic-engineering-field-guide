description: |
  We’re ALTEN Technology USA, an engineering company helping
  clients bring groundbreaking ideas to life—from advancing
  space exploration and life-saving medical devices to
  building autonomous electric vehicles. With 3,000+ experts
  across North America, we partner with leading companies in
  aerospace, medical devices, robotics, automotive, commercial
  vehicles, EVs, rail, and more.

  As part of the global ALTEN Group—57,000+ engineers in 30
  countries—we deliver across the entire product development
  cycle, from consulting to full project outsourcing.

  When you join ALTEN Technology USA, you’ll collaborate on
  some of the world’s toughest engineering challenges,
  supported by mentorship, career growth opportunities, and
  comprehensive benefits. We take pride in fostering a culture
  where employees feel valued, supported, and inspired to
  grow.

  This is a Prospective/Pipeline Posting — Not an Active Role

  About the Opportunity

  We're building a talent pipeline for upcoming software
  engineering opportunities across multiple levels. Connect
  with us now so you're on our radar when the right role
  opens.

  - Junior Software Engineer (0–3 years)
  - Software Engineer (3–6 years)
  - Senior Software Engineer (6–10 years)
  - Staff/Principal Software Engineer (10+ years)

  What You Might Work On

  - Design, development, and testing of embedded or application
    software
  - Firmware development and hardware-software integration
  - Code review, debugging, and performance optimization
  - Agile/Scrum development cycles
  - Cross-functional collaboration with systems, controls, and
    hardware teams

  What We Look For

  - Bachelor's degree in Computer Science, Software Engineering,
    or related field (Master's a plus for senior-level roles)
  - Proficiency in relevant languages (C/C++, Python, Java, or
    similar depending on domain)
  - Experience with version control and CI/CD practices
  - Experience ranging from recent graduates to engineers with
    10+ years leading software architecture

  Why Join Our Talent Network

  - Get connected before roles are publicly posted
  - Be matched to opportunities that fit your specific
    experience level and interests
  - No commitment required — this is simply an opportunity to
    introduce yourself

  Interested? Submit your resume and a short note on what kind
  of role you're looking for. We'll keep your information on
  file and reach out as soon as a relevant opportunity becomes
  available.

  This is a pipeline-building posting. There is no guarantee
  of an interview or offer, as we are not actively hiring for
  a specific position at this time.

  Salary Range: $60,000-$150,000

  The actual salary offered is dependent on various factors
  including, but not limited to, location, the candidate’s
  combination of job-related knowledge, qualifications,
  skills, education, training, and experience

