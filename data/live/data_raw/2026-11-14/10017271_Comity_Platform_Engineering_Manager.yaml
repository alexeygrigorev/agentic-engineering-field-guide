description: |
  🎯 Why we exist

  We’re on a mission to improve the reliability, transparency,
  and efficiency of our energy systems, fostering a future
  with sustainable and abundant energy. To accomplish our
  aims, we’re leveraging state of the art statistical learning
  and convex optimization methods (AI) to build the financial
  trust layer for the electric age.

  We envision energy systems that are efficient, autonomous,
  resilient, and electrified.

  🧗 Who we are

  We are an energy-obsessed, talented, and hard working
  entrepreneurial team.

  We are rooted in the spirit of the first mass
  electrification, when substations and transmission lines lit
  up America's cities fueling an era of unprecedented growth.
  Today, we are helping power the next wave of American
  ingenuity through a more resilient and affordable energy
  system.

  Our founders (ex-Apple, Bluevine; ex-Affirm, Square, Google)
  are Stanford alumni who have scaled multi-billion-dollar
  underwriting platforms from scratch. We bring expertise in
  energy, complex systems, computational science, and
  structured finance.

  Our world-class investors, Maverick Ventures and Caffeinated
  Capital, are aligned to our policy objectives and platform
  vision.

  The Role

  Comity is looking for an Engineering Manager to lead our
  Platform Software Engineering team, which owns our research,
  market-making, and risk management platforms. You’ll lead
  the team that designs and scales the core data
  infrastructure powering all of these platforms, and works
  closely with researchers developing our price forecasting
  and grid optimization technology.

  This role reports directly to the CTO and works closely with
  senior leadership across our Research and Business
  Operations teams. Given our team size, this is a hands-on
  role involving both senior IC work and people management. As
  both an early hire and team leader, you will have broad
  impact and ownership over our platform, technology, team
  practices, and culture.

  Comity has two core teams: Power Markets and Commercial.
  This role is part of our Power Markets team.



  We’re excited about you because:

  - You have 7+ years of professional experience as a software
    engineer, with 2+ years of experience as an engineering
    manager.
  - You are a hands-on leader who enjoys staying close to the
    code and day-to-day technical decisions of the team.
  - You have experience designing and building data intensive
    applications with distributed systems. Experience with
    machine learning concepts and technology is a plus.
  - You have experience leading complex engineering projects in
    collaboration with data scientists or other technical
    researchers.
  - You are a lifelong learner and empathetic teacher. We’re
    committed to the growth and development of our teammates.
    We work towards a shared understanding by listening with
    intent and holding open discussions because we know that's
    how we'll deliver quality results.
  - We believe strong foundations are more important than
    specific technical knowledge, but experience with any part
    of our stack (Python, AWS, Snowflake, Ray) is a plus.

  Location

  This role will be based in one of our offices in Brooklyn,
  New York, or San Francisco, California.

  At Comity, we seek to recruit, develop, and retain the most
  talented people from a diverse candidate pool. Our priority
  is to ensure that all applicants are provided with fair and
  equal access to employment opportunities. Recruiting and
  hiring decisions are made without regard to race, color,
  religion, sex, national origin, age, disability, or any
  other class protected by law.
