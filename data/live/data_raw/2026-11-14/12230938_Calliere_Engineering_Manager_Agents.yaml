description: |
  This is a remote position.



  Picture a marketer who types a goal into a box and gets back
  a whole campaign: the creative, the audience, the launch
  across every ad and email channel, and a running read on
  what's working and what to change next. Not a copilot that
  drafts a subject line. An agent that runs the program end to
  end.




  That's what this team is building, and they need an
  engineering leader to take it further.


   Why this one is worth a look



  - It's the bet, not a side project. Agents are where the
    company is putting its chips, and this team is at the
    center of it.
  - The customers are household names. Global consumer brands,
    major retailers and fast-growing fintechs already run on
    the platform.
  - The data foundation is already there. The company built a
    leading customer data platform first. The agents sit on
    top of real customer context, not a blank prompt.
  - Recognized category leader. The major industry analysts rank
    them at the front of their space.
  - That salary range. Up to $400K base, the same no matter
    where in North America you live.

   The role



  This is a player-coach leadership job. Engineering leaders
  here are expected to be a real technical voice in the room
  and a strong people manager at the same time. You won't hide
  behind status reports, and you won't disappear into the code
  either.




  What you'll own



  - Shipping big things. Lead the roadmap and delivery of major
    features. Keep the technical bar high and make smart,
    pragmatic tradeoffs.
  - Speed. Make the team measurably faster through how you lead
    and what you contribute technically.
  - Hiring. Figure out who the team needs, decide how to
    evaluate them, and bring in people who move the needle.
  - Reliability. Fewer incidents. Catch problems before
    customers ever see them. Tighten up incident response.
  - People. Help everyone on the team grow, stay engaged and
    stay motivated.

   The problems you'll be solving



  - Content generation. Producing on-brand marketing content at
    scale, combining foundation models, deep customer context
    and human review.
  - Context management. Building the systems that organize
    customer data, brand guidelines, campaigns and goals so
    the agents can actually reason well.
  - Insights. Spotting what's working, when creative is wearing
    out, and what competitors are doing, then turning that
    into recommended next moves.
  - Orchestration. Wiring generated assets into ad and lifecycle
    platforms so campaigns launch and run reliably.







    Requirements Who thrives here



  - Intellectually curious, motivated, and genuinely excited by
    the four problems above
  - Strong enough technically to shape architecture and
    challenge decisions, not just run standups
  - A track record of growing people and building teams
  - Someone who cares more about impact than titles or tenure

   How they work



  The team is ambitious, focused on impact, and efficient.
  They move fast. They also put real weight on humility,
  kindness and compassion, and see those as part of why they
  win, not a nice-to-have.
