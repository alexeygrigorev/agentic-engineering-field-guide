description: |
  Courier Health is on a mission to solve one of the biggest
  and most meaningful opportunities in healthcare: reinvent
  how people living with chronic and rare diseases are
  supported.

  We are building the future of patient engagement for life
  sciences companies. Our software is leveraged by biopharma
  companies to support patients in their complex journey from
  diagnosis to initiating and remaining on therapy to achieve
  optimal health outcomes.

  About Courier Health

  Courier Health is a New York City-based technology company
  on a mission to improve the patient experience for hundreds
  of millions of people living with a chronic condition or
  rare disease. The company develops and delivers the fastest-
  growing patient experience solution for the life sciences
  industry.

  Companies that choose Courier Health are achieving double-
  digit improvements to patient starts, time-to-start and
  ongoing adherence to life-altering therapies. As host of the
  invite-only Patient Innovators Summit and publisher of The
  State of Patient-Centricity in Biopharma report, Courier
  Health is backed by leading investors, including Oak HC/FT,
  Norwest and Work-Bench.

  Come Build with Us

  We're a NYC-based team that believes culture, craft, and
  customer obsession go hand in hand. We show up for each
  other the same way we show up for the people we serve. We're
  an office-first company that values in-person collaboration
  4 days per week because we believe the best work happens
  when you can collaborate and brainstorm together in the same
  room. If that sounds like your kind of place, we think
  you'll love it here.

  The Opportunity

  Courier Health is at an inflection point. Last year we grew
  the number of customers and therapies on our platform by
  over 400% and raised a $50M Series B to go further, faster.
  Engineering is growing with it, and we're adding three
  Engineering Managers to lead the teams that build the
  platform.

  You'll lead a team of 4-7 engineers that owns one part of
  our product: our AI intake agents, core data, integrations,
  patient services, field access, or workflows. You'll report
  to a Director of Engineering, partner with a dedicated
  Product Manager, and own how your team plans, ships,
  operates, and grows.

  This is a management role, not a coding seat. We'll judge
  you by what your team delivers and how much better your
  engineers get. You'll be technical enough to review a
  design, unblock an engineer, and work an incident with the
  team, and experienced enough that none of the people work is
  new to you.

  What You'll Own

  Delivery others can plan around. You'll run your team's
  operating rhythm: sprint planning, estimation, demos, and
  retros. When a commitment is at risk, you'll know before
  anyone asks and say so early. You'll work within our product
  development process of reviewed PRDs and technical designs.

  A team that gets better every quarter. You'll hire for your
  own team, from sourcing to close. You'll give direct,
  specific feedback, run reviews against our engineering
  career ladder, promote people who have earned it, and
  address performance gaps early and fairly.

  Systems patients depend on. We handle protected health
  information for enterprise biopharma customers under HIPAA
  and SOC 2 Type II. Your team owns the reliability of what it
  ships: testing, observability, on-call, and incident
  response. A data error here means a patient doesn't get the
  call they need.

  A real partnership with Product. You and your PM share the
  roadmap. You'll bring engineering's view of scope,
  sequencing, and cost, push back when the quarter holds more
  roadmap than capacity, and make the trade-offs explicit.

  How AI changes the way we build. Agentic AI is part of our
  product and how we work. You'll lead your team's adoption of
  AI coding tools so that speed and quality rise together, and
  you'll measure whether they did.

  What You Bring

  - 2+ years as an engineering manager in your current or most
    recent role, leading 4-7 direct reports.
  - 10+ years in software engineering overall. You came up as a
    senior engineer and are still technically credible: you
    review designs and code, unblock engineers, and join
    incidents.
  - You've done the whole people job: hired onto your own team,
    delivered hard feedback, managed an underperformer, and
    promoted someone.
  - You've established a team's rituals, not just inherited
    them: planning, estimation, retros, and on-call.
  - You've shipped end to end with a Product partner and can
    name the outcomes you moved, with numbers: cycle time,
    incident rate, delivery predictability.
  - You talk about failures in terms of what you'd do
    differently, not who was at fault.
  - Experience leading teams on production cloud systems. Our
    stack is TypeScript/Node, React, GraphQL, AWS (largely
    Serverless), and PostgreSQL.
  - Based in New York and in our Nomad office 4+ days per week.

  Bonus points if:

  - You've worked in healthcare or another regulated environment
    that handles PHI (HIPAA, SOC 2)
  - You've led a team through rapid growth at an early-stage
    company
  - You've shipped LLM-powered or agentic features to
    production, or led a team's move to agentic coding tools
  - You've worked on enterprise B2B products with heavy data
    integration (APIs, SFTP, HL7, FHIR, EDI)

  Benefits

  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Unlimited Vacation
  - Commuter Benefits
  - Paid parental leave
  - Catered lunch on Fridays
  - Wellness stipend

  Compensation

  The annual salary range for the target level for this role
  is $210,000 - $250,000 + equity + benefits, including
  medical, dental, and vision. Final compensation will be
  determined based on a variety of factors including relevant
  experience, interview performance, and internal equity.

