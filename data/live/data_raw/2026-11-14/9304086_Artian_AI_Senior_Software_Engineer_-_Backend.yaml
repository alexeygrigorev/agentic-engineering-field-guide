description: |
  About Artian

  Artian AI is building agentic AI automation for financial
  services. Our platform enables reliable, autonomous AI
  agents to execute business-critical workflows across
  regulated enterprise environments.

  We are an in-person team in New York, building at the
  intersection of AI, enterprise software, workflow
  automation, and financial services. We move with urgency,
  take ownership, communicate transparently, and care deeply
  about doing excellent work. We are looking for people who
  are grounded under pressure, learn quickly, earn trust with
  teammates and customers, and want to help define how AI
  agents are deployed safely and effectively in the
  enterprise.

  About the Role

  Artian AI is looking for a Senior Software Engineer -
  Backend to lead development of the core platform behind our
  agentic AI automation product. You will design and build the
  backend systems that allow autonomous agents to execute
  business-critical workflows reliably, securely, and at
  enterprise scale.

  This is a senior individual contributor role for an engineer
  who can own major technical decisions, raise engineering
  standards, and translate ambiguous product and customer
  needs into durable backend architecture.

  What You’ll Do

  - Lead design and implementation of backend architecture for
    Artian’s AI automation platform.
  - Build scalable services, APIs, orchestration systems,
    workflow engines, data models, and integration layers.
  - Design platform primitives for permissions, state,
    auditability, observability, reliability, and enterprise
    deployment.
  - Partner with AI/ML engineers to productionize agent
    capabilities and support complex AI-driven workflows.
  - Own major backend workstreams from technical design through
    implementation, launch, and iteration.
  - Improve engineering practices around testing, monitoring,
    code quality, deployment, and incident response.
  - Mentor engineers and help establish technical standards for
    a high-performing engineering team.
  - Make pragmatic architecture decisions that balance speed,
    correctness, reliability, and long-term maintainability.

  What We’re Looking For

  - Significant backend engineering experience with a record of
    shipping production systems.
  - Deep Python experience and strong software architecture
    fundamentals.
  - Experience designing APIs, distributed systems, workflow
    systems, data platforms, or enterprise SaaS
    infrastructure.
  - Strong understanding of databases, asynchronous processing,
    observability, cloud infrastructure, security, and system
    reliability.
  - Ability to own ambiguous technical problems and drive them
    to high-quality outcomes.
  - Strong communication skills and the ability to collaborate
    across engineering, product, and customer-facing teams.
  - A high bar for engineering quality and a bias toward
    building simple, robust systems.

  Nice to Have

  - MS in Computer Science or a closely related engineering
    discipline, or equivalent industry experience.Experience
    building enterprise SaaS, workflow automation platforms,
    developer platforms, or mission-critical systems.
  - Experience with AI/ML infrastructure, LLM applications,
    agent orchestration, or data-intensive automation.
  - Experience with financial services, regulated environments,
    auditability, compliance, or security-sensitive systems.
  - Experience at an early-stage company where senior engineers
    shape architecture and culture.

  Why Join Artian

  - Own foundational architecture for enterprise-grade
    autonomous agents.
  - Build systems that must be reliable, observable, secure, and
    scalable from day one.
  - Work in a high-ownership environment with direct influence
    on product and engineering direction.
  - Help define the platform layer for agentic AI in financial
    services.
