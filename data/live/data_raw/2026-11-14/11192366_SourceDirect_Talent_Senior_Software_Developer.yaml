description: |
  Senior Software Developer Remote – Home Based

  Job Summary

  We’re partnering with a company in the SaaS space to find a
  Senior Software Developer. In this role, you’ll be
  responsible for developing and documenting a SaaS platform,
  while continuously improving functionality and quality
  across all offerings.

  Essential Duties and Responsibilities

  - Implement functionality within the platform in accordance
    with established standards and operating procedures
  - Contribute to quality assurance processes through activities
    such as functional and unit testing, defect triage, and
    regular code reviews
  - Create and maintain internal and external feature
    documentation, including design and test plans, API
    guides, and process documents
  - Participate in team exercises (meetings, planning
    discussions, etc.) in an inclusive manner
  - Provide operational support for platform components in
    regulated, validated environments

  Stakeholders

  - Management
  - Internal Team
  - Consultants

  Education and Experience

  - Bachelor’s degree and 3+ years of experience as a senior
    full stack developer

  Working Conditions

  - Standard remote office position

  Skills & Experience

  - Associate: 3+ years of professional software development
    experience, or equivalent combination of education and
    experience
  - Senior: 6+ years of professional software development
    experience, or equivalent combination of education and
    experience
  - Experience developing enterprise-grade applications using C#
    (WebAPI, ASP.NET Core, etc.)
  - Experience writing and optimizing T-SQL, and/or utilizing
    and optimizing EntityFrameworkCore in production
    environments
  - Experience developing enterprise-grade web applications
    using HTML, CSS, and JavaScript/TypeScript
  - Strong critical-thinking and problem-solving skills
  - Strong attention to detail, processes, and quality assurance
  - Strong understanding of core software development
    competencies:
    - Software Design (Patterns, SOLID, etc.)
    - Defect Triage / Debugging
    - Research
    - Code Literacy
    - Interface Negotiations

  Additional Skills and Abilities

  - Experience working in a DevOps culture
  - Experience with microservice / distributed architectures
  - Experience developing high-performance HTTP APIs for public
    consumption
  - Experience with ORMs such as NHibernate, Dapper, or
    EntityFrameworkCore
  - Experience with web frameworks such as Angular, BlazorWasm,
    Stencil, or React
  - Experience working in an Agile environment and/or Agile
    certifications
  - Experience with testing frameworks/toolsets such as NUnit,
    JustMock, Karma, or Selenium
  - Experience with software archaeology

  About the Opportunity

  Our client is focused on building technology that advances
  human health. They’re looking for smart, capable, and
  conscientious individuals to help expand product
  capabilities, grow the business, and better serve customers.

  Employees benefit from:

  - Comprehensive benefits including medical, dental, vision,
    and life/LTD insurance
  - Strong employer contribution to health premiums
  - A focus on wellness and work/life balance, including
    flexible work schedules and locations
  - Weekly company-wide standups
  - A collaborative culture centered around innovation, quality,
    and user experience
