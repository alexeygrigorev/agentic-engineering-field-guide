description: |
  🌎 What we do

  Root is Europe’s #1 primary data collection platform for F&B
  companies. We help our customers to measure and reduce farm-
  level emissions.

  ~31% of global GHG emissions originate from food-related
  activities. For the first time in history, climate
  performance has become an overall business performance
  indicator. Enterprises are mandated by regulatory bodies to
  disclose their climate performance, which leads to
  increasing pressure from investors, competitors, retailers,
  and consumers to prevent and reduce their CO2e emissions.
  Over the next 10 years, companies have set ambitious
  reduction targets that need to be met. Unlike other
  industries, the vast majority of F&B emissions originate
  from farms (known as Scope 3.1 emissions) and are highly
  complex to address. Root exists to help overcome this
  challenge.

  We raised >€10m in funding in the first 2 years of our
  existence, we launched our enterprise product, signed and
  onboarded some of the largest F&B players in Europe, and put
  together what we believe is the best-suited early-stage tech
  team in Europe. Will you be the next to join us? 🚀

  🔭 What you will work on

  Your mission

  Build and scale our software products with a sense of full
  ownership.

  In the first 6 months, your focus will be on

  - Coding (this is a very hands-on role) our web application –
    frontend, backend and infrastructure
  - Adjusting and expanding our tech stack where necessary
  - Setting up and improving our infrastructure set-up – with a
    focus on database structure, data pipelines and analytics,
    which is a big part of the value we offer to our customers
  - Setting the foundations for our engineering practices in
    line with our broader operating model to attract and
    retain the best engineering talent in Europe

  Tech Stack

  - Our tech stack, much like our business and product, is still
    in its early stage. Joining at this point means you will
    still play a key role in defining what tools and
    technologies we will use to build up Root Global for years
    to come!
  - Our product consists of multiple web applications our
    customers use, based on a backend consisting of user input
    data (procurement, product composition, etc.) calculation
    models, and plug-ins to various emission factor/LCA
    databases
  - Frontend: React and Next.js
  - Backend: Node.js w/Typescript, Nest.js, PostgreSQL
  - Infra: AWS

  🧺 What you bring along

  Based on what you know on the role 👆 you are the best
  evaluator to decide if you believe this is a role you will
  be able to thrive in.

  These are some things that would help:

  - You have built full-stack web applications before – that
    people are actually using
  - You have worked in an early stage VC-backed startup (pre-
    seed/seed), preferably with a B2B business model
  - You feel comfortable with broad product requirements and
    enjoy participating in the product conceptualisation phase
  - You feel comfortable guiding teams through technical
    troubleshooting and delivering feedback on topics beyond
    technical performance.

  🎢 Hiring Process

  Our ambition is to offer you an end-to-end experience that
  is fast and uncomplicated. Every step is a conversation,
  which is both an opportunity to meet more of the team as
  well as express yourself.

  - 45 min Intro with the CTO. Goal: Get to know each other,
    introduce Root Global and the role in more detail, and
    align on baseline expectations.
  - 60min Technical Interview with one Engineer from the team.
    Goal: Discuss your technical experience, how it overlaps
    with the challenges ahead of us and what you can expect
    from the day-to-day of an Engineer at Root Global.
  - Approx. 2 hour office visit, where you will 1) meet the rest
    of the Engineering team on a team session where you will
    dive into our product and a real world scenario and 2) one
    or two (depending on availability) 30min coffee chats or
    walks - weather allowing - to get to know other team
    members outside of the Engineering team.

  🤗 You don't feel like you fulfill all the criteria? We get
  it: confidence can sometimes hold us back from applying for
  a job. But guess what?! There is no such thing as a
  “perfect” candidate. The only thing you need to ensure along
  the recruiting process and beyond is that the problem that
  we are solving with Root is one you cannot wait to get out
  of bed for on Monday morning!

  Root Global is an equal opportunity employer, which means we
  do not discriminate on the basis of race, colour, religion,
  marital status, age, national origin, ancestry, physical or
  mental disability, medical condition, pregnancy, genetic
  information, gender, sexual orientation, gender identity or
  expression. We celebrate diversity and are committed to
  creating an inclusive environment for all employees.
