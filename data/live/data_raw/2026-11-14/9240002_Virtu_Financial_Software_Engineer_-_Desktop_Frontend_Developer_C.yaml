description: |
  VIRTU

  As a leading financial technology firm, we leverage cutting-
  edge technology to deliver liquidity to global markets as
  well as innovative, transparent trading solutions and
  industry standard-setting analytics tools to our clients. As
  a market maker, Virtu provides deep liquidity that helps to
  create more efficient markets around the world. Our market
  structure expertise, broad diversification, and execution
  technology enables us to provide competitive bids and offers
  in over 19,000 securities, at over 235 venues, in 36
  countries worldwide.

  Virtu offers a dynamic, meritocratic environment with a flat
  hierarchy. No finance background is necessary or expected.
  This is a great opportunity for the right candidate to kick
  start a career in the financial technology space.

  THE ROLE

  Virtu is looking for a Frontend Software Engineer to join
  our Core Development team. This team creates powerful
  trading tools, which facilitate the operation of a high-
  performance system, deployed in financial marketplaces
  around the world.

  We are looking for passionate engineers who love delivering
  extraordinary software in a highly visible, front-office
  engineering role within the organization.

  Responsibilities include:

  - Collaborate with traders and researchers to build and
    maintain live trading user interfaces
  - Scale up capacity and performance of C# software components
    and end user experiences
  - Create new custom features to improve visualization of real-
    time trading data
  - Handle multiple concurrent projects while adapting quickly
    to changing priorities
  - Be a great teammate and effective communicator across teams



  THE CANDIDATE

  - Bachelor’s Degree in a STEM field
  - Proven results delivering multi-threaded, high performance
    user interfaces in C# and Winforms (or WPF)
  - Previous experience with desktop based applications and Core
    .NET frameworks, such as DevExpress, Telerik UI, and/or
    Syncfusion
  - Knowledge of multi-asset classes (e.g. Options, Equities),
    market structure and trading systems is a big plus
  - Experience leveraging .NET memory and performance profiling
    technology
  - Proficient in object oriented programming and advanced
    programming languages
  - Experience with unit testing
  - Self-starter and stand-out contributor who has a real
    passion for technical excellence
  - Excellent communication and interpersonal skills (verbal and
    written)

  Salary Range: $150,000 - 200,000 (salary range is exclusive
  of bonuses, benefits or other categories of compensation)

  Virtu Financial is an equal opportunity employer, committed
  to a diverse and inclusive workplace, welcoming you for who
  you are and does not discriminate on the basis of race,
  national origin, gender, gender identity, sexual
  orientation, protected veteran status, disability, age, or
  other legally protected status.
