description: |
  Overview

  We’re dedicated to speeding up the pace of innovation at
  manufacturing companies by automating product regulatory
  compliance. That frees up product and engineering teams to
  focus on building great products in automotive, aerospace,
  construction, medicine and healthcare, and more.

  We’re a small, focused team, and we’re proud to be
  supporting the development of products used by over 100
  million people worldwide. We’ve raised over $6M from IA
  Ventures, 8VC, and other institutional investors.

  Our Mission

  At Daptic, we’re building an AI platform to accelerate
  product development at manufacturing companies. We do that
  by creating NLP pipelines that identify all regulations that
  are relevant to any product in development, such as an
  electric battery or the latest level-4 autonomous driving
  system.

  As engineers, reading complex legal and regulatory documents
  are often the last things we want to do. What we’re building
  means that teams can stop poring over 1000-page PDFs via
  Google Translate and can instead focus entirely on building
  the best systems that the world needs today.

  In short, what you build with us will directly lead to
  companies launching physical products months faster than
  before.

  Role

  Daptic is seeking an experienced Staff Product Fullstack
  Engineer to drive the development of our platforms.

  The ideal candidate has strong experience building and
  launching full-stack products in a startup environment. You
  are ready to work with new technologies and learn whatever
  is needed to solve the challenges we will face. You will be
  a part of our Platform Engineering Team and have complete,
  end-to-end ownership of the enterprise-facing launch of the
  product.

  We are based out of NYC, in-person, with flexibility for
  remote work at times. If you are not currently in NYC, we
  would ask you to plan to move to the city in the next few
  months.

  Responsibilities

  - Collaborate closely with Product, Go-to-Market, and ML/Data
    to translate product strategy into iterative, scalable
    product versions that can be rapidly deployed for user
    testing
  - Lead the team in selecting the appropriate technology stack,
    framework, and tools to enable experimentation and
    tracking
  - Own the architecture and development of the working product
    and beyond
  - Strategize and articulate tradeoffs between speed and
    scalability

  Qualifications

  - Bachelors or Masters in Computer Science, Engineering, or
    other related field
  - 6+ years of professional development experience, Staff
    Engineer/Tech Lead/Technical Founder experience
  - A highly product-oriented approach and eagerness to solve
    technical problems while prioritizing both user experience
    and platform scalability.
  - Comfortable working in a dynamic environment with evolving
    objectives and fast iteration with users
  - Strong experience managing the fullstack development of a
    new product in a fast-growth organization—ready to tackle
    any part of the process and comfortable with starting from
    a problem instead of a full specification
  - Expertise in TypeScript, React, and CSS
  - Demonstrated proficiency with relational databases
  - Experience deploying applications with AWS and Docker
  - Excellent communication skills and low ego
  - US work authorization is required; we do not currently
    support visa transfers

  Nice to haves

  - Proficiency in Python
  - Familiarity with modern frontend development libraries
    (NextJS, TanStack, TRPC, Tailwind)
  - Interest in Generative AI/LLMs—will work closely with our
    Machine Learning engineers to deliver AI-powered user
    workflows
  - Interest in being involved in the product development
    process
  - Leadership experience
