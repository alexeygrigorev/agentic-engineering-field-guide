description: |
  We’re looking for a Software Engineer in Test specialising
  in Android automation to help elevate the quality of our
  American Express Travel native mobile applications. This
  role is ideal for an engineer who is passionate about modern
  testing practices, automation frameworks, and coaching
  development teams to build quality into every stage of
  delivery.

  You’ll act as a quality champion within the Android
  engineering community — partnering closely with engineers,
  product teams, and delivery leads to improve automated test
  coverage, advocate for best practices, and drive confidence
  in our mobile releases.

  Responsibilities

  As a Software Engineer in Test, you will focus on building
  and evolving scalable UI automation solutions for native
  Android applications using Jetpack Compose testing
  frameworks and Kotlin. You will also play a key role in
  supporting and mentoring Android engineers in writing
  effective automated tests and embedding quality-first
  engineering practices across teams.


  - Design, develop, and maintain automated UI test frameworks
    and test suites for native Android applications using
    Jetpack Compose testing APIs and Kotlin
  - Champion mobile quality engineering practices across Android
    development teams
  - Partner with Android engineers to improve testability,
    automation coverage, and overall application quality
  - Coach and support engineers in writing reliable,
    maintainable, and effective automated tests
  - Establish and promote standards for UI automation, test
    architecture, and continuous testing
  - Collaborate with product owners, engineers, and release
    teams to ensure quality is embedded throughout the
    software delivery lifecycle
  - Analyse test failures, identify root causes, and drive
    improvements to increase reliability and reduce flaky
    tests
  - Contribute to CI/CD pipeline improvements to enable faster
    and more reliable automated test execution
  - Advocate for shift-left testing approaches and modern
    quality engineering principles
  - Monitor and report on automation coverage, quality metrics,
    and release readiness
  - Support exploratory and risk-based testing activities where
    appropriate

  Qualifications

  - Experience developing automated tests for native Android
    applications using Jetpack Compose testing frameworks
  - Strong programming experience with Kotlin
  - Solid understanding of Android application architecture and
    the Android development lifecycle
  - Experience testing modern Android UI implementations built
    with Jetpack Compose
  - Experience integrating automated tests into CI/CD pipelines
  - Knowledge of software testing methodologies, test design
    techniques, and quality engineering principles
  - Experience collaborating closely with software engineers in
    Agile delivery teams
  - Strong communication and stakeholder engagement skills
  - Ability to coach and influence engineering teams on quality
    best practices

  Employment eligibility to work with American Express in the
  UK is required as the company will not pursue visa
  sponsorship for these positions.



  About Us

  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. From delivering
  differentiated products to providing world-class customer
  service, we operate with a strong risk mindset, ensuring we
  continue to uphold our brand promise of trust, security, and
  service.

  As part of Team Amex, you’ll experience our powerful backing
  with comprehensive support for your holistic well-being and
  many opportunities to learn new skills, develop as a leader,
  and grow your career. Here, your voice and ideas matter,
  your work makes an impact, and together, you will help us
  define the future of American Express.

  About the Team

  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:

  - Competitive base salaries
  - Bonus incentives
  - Support for financial-well-being and retirement
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits (depending on location)
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - Generous paid parental leave policies (depending on your
    location)
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities



  Offer of employment with American Express is conditioned
  upon the successful completion of a background verification
  check, subject to applicable laws and regulations.
