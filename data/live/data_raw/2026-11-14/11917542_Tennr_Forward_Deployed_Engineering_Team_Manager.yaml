title: Forward Deployed Engineering Team Manager
company: Tennr
location: New York, USA
work_type: FULL_TIME
company_size: 69 Employees
description: |
  Company Description

  Today, when you go to your doctor and get referred to a
  specialist, your doctor sends out a referral and tells you,
  “They’ll be in touch soon.” So you wait. And wait. Sometimes
  days, weeks, or even months. Why? Because too often
  providers are overwhelmed with the painstakingly tedious
  work required to get paid by insurance companies. Powered by
  proprietary models, Tennr handles the complex paperwork that
  gets patients through the door and providers paid, helping
  operators get patients the right care, at the right time, in
  the right setting.

  Role Description

  Great Forward Deployed Engineers make deployments succeed.
  The Forward Deployed Engineering Team Manager makes the
  whole team succeed. In this role you will lead a team of
  FDEs and own delivery outcomes across your book: clean
  builds, on-time milestones, and healthy, growing accounts.
  You set the quality bar for everything the pod ships and
  turn what works into standard practice

  This is a management seat with real autonomy. You decide how
  the pod runs and own the results. You will work closely with
  Account Partners, Implementation Engineers, and Product, so
  your focus stays on your whole book of business, the
  development of the people delivering it, and the systems
  that make your team run. The role reports to the VP of
  Solutions and is the proving ground for delivery leadership
  at Tennr.

  Responsibilities

  - Own your team’s key metrics: time to first outcome from go-
    live, delivery predictability on key milestones, and
    adoption and health across all accounts.
  - Hold the quality bar: review scoping and architectures
    before they are built, require dry runs for high-stakes
    moments (architecture reviews, demos, UAT), and sample
    live customer calls to coach execution.
  - Hire and develop every FDE in the pod through weekly 1:1s,
    evidence-based reviews, clear 30/60/90 ramp expectations,
    and documented growth plans.
  - Act as first line of defense on escalations: diagnose root
    causes, set direction, and coordinate the fix through the
    team, then coach so it does not recur.
  - Serve as the technical solutioning partner for FDEs working
    through hard architecture and workflow problems.
  - Act as the final scoping gate on pre-sales engagements,
    catching post-sale risk before contracts close.
  - Turn patterns across the pod’s accounts into a clear signal
    for Product, and close the loop with the team on what
    ships.

  Candidate Qualifications

  - Experience leading and developing a team of implementation,
    solutions, or technical delivery professionals
  - Track record of successfully delivering complex customer
    implementations, healthcare or healthcare technology
    experience is preferred
  - Strong technical judgment on architecture and workflow
    design, with the ability to guide a build without taking
    it over
  - Comfort inspecting work and holding a high bar, including
    when the work looks fine
  - Clear communication with customers and executives, and the
    ability to surface risk and trends upward early
  - Experience partnering with Product to turn recurring field
    patterns into roadmap priorities
  - High ownership mindset and comfort in a fast-paced,
    ambiguous environment

  Why Tennr?

  - Drive Impact: one of our company values is Cowboy, meaning
    you set the pace. You won’t just talk about things, you’ll
    get them done. And feel the impact.
  - Develop Operational Expertise: learn the inner workings of
    scaling systems, tools, and infrastructure
  - Innovate with Purpose: we’re not just doing this for fun
    (although we do have a lot of fun). At Tennr, you’ll join
    a high-caliber team maniacally focused on reducing patient
    delays across the U.S. healthcare system.
  - Build Relationships: collaborate and connect with like-
    minded, driven individuals in our Hudson Square office 4
    days/week
  - Free lunch! Plus a pantry full of snacks.

  Benefits

  - Beautiful new office at 345 Hudson Street
  - Unlimited PTO
  - 100% paid employee health benefit options
  - Employer-funded 401(k) match
  - Competitive parental leave
