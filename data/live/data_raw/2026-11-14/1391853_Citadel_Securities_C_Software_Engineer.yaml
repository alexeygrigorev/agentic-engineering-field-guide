description: |
  Job Description We're looking for driven innovators and
  optimizers who are excited about cutting-edge technology and
  making a measurable impact. If you're passionate, obsessed
  with performance, and excited to work where nanoseconds
  matter, read on. What You'll Do

  - Solve What Matters: Break down intricate challenges and
    deliver clear, elegant solutions that drive real world
    outcomes
  - Build and Scale: Design, build and maintain high performance
    systems that are the backbone of our trading
    infrastructure
  - Optimize Everything: Continuously push the limits of
    latency, reliability, and throughput in a distributed
    environment
  - Partner and Deliver: Collaborate directly with traders,
    researchers, and fellow engineers to deliver ideas into
    production
  - Own it in production: Take pride in running your code live -
    Monitoring, supporting and improving it every day

  What we are looking for

  - Deep experience in C++ with a passion for clean, performant
    code
  - A strong grasp of multithreading, concurrency, and
    distributed systems
  - Curiosity to explore how things work and a drive to improve
    them
  - Clear, thoughtful communication and the ability to thrive in
    a high ownership environment
  - Bachelor's (or higher) degree in a Computer Science,
    Engineering or related field
  - Background in Trading or finance is a plus but not a
    requirement

  Opportunities may be available from time to time in any
  location in which the business is based for suitable
  candidates. If you are interested in a career with Citadel
  Securities, please share your details and we will contact
  you if there is a vacancy available.  About Citadel
  Securities Citadel Securities is a technology-driven, next-
  generation global market maker. We provide institutional and
  retail investors with world-class liquidity, competitive
  pricing and seamless front-to-back execution in a broad
  array of financial products. Our teams of engineers, traders
  and researchers harness leading-edge quantitative research
  and the accelerating power of compute, machine learning and
  AI to power our analytics and tackle the market's and our
  clients' most critical challenges. Together, we are forging
  the future of capital markets. For more information, visit
  citadelsecurities.com .
