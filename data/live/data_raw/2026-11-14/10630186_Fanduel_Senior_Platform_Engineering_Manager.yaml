description: |
  THE POSITION Our roster has an opening with your name on it

  As a Senior Platform Engineering Manager, you’ll lead
  Engineering Managers and Platform Engineers across multiple
  teams within Platform Engineering. You’ll be responsible for
  leading the delivery and improvement of the internal
  platform capabilities that enable engineers and AI agents to
  build, deploy and operate software safely and efficiently.

  You’ll be responsible for developing managers and engineers,
  setting direction across your area and ensuring teams are
  focused on the right priorities. Alongside your broader
  leadership responsibilities, you’ll remain close to the
  delivery and development of the teams and people you
  directly manage.

  Working closely with Engineering, Product and Security,
  you’ll shape the roadmap for your area, manage priorities
  and dependencies across teams, and turn common engineering
  needs into reusable, self-service platform capabilities. As
  AI becomes a bigger part of software development, you’ll
  also help shape how our platform supports engineers and AI-
  driven workflows safely and at scale.

  Reporting to the Platform Engineering Director, you’ll
  combine strong organizational leadership with strong
  technical judgement to influence technical direction,
  challenge decisions and create an environment where teams
  can deliver effectively.

  In addition to the specific responsibilities outlined above,
  employees may be required to perform other such duties as
  assigned by the Company. This ensures operational
  flexibility and allows the Company to meet evolving business
  needs.

  THE GAME PLAN Everyone on our team has a part to play

  - Leading Engineering Managers and Platform Engineers across
    multiple teams, providing direction, alignment and support
    to help teams deliver and grow.
  - Developing managers and engineers through regular coaching,
    feedback and career development.
  - Translating Platform Engineering strategy into clear
    priorities and outcomes, ensuring teams understand what
    matters and why.
  - Working closely with Product to shape roadmaps, prioritize
    investment and ensure platform capabilities address the
    needs of our internal customers.
  - Driving the development and adoption of our Internal
    Developer Platform, including developer tooling,
    workflows, APIs, templates, integrations and platform
    services.
  - Enabling teams to deliver platform capabilities for
    engineers and AI agents, with a focus on self-service,
    automation and secure-by-default ways of working.
  - Providing technical and organizational leadership,
    influencing architecture and engineering direction while
    ensuring teams make sound technical decisions.
  - Managing priorities, dependencies and trade-offs across
    teams, working across Engineering, Product and Security to
    remove blockers and drive outcomes.
  - Driving platform reliability and operational maturity, using
    SLOs, observability, incidents and operational data to
    identify and prioritize improvements.
  - Using platform metrics and developer feedback to understand
    adoption, developer experience, reliability and the impact
    of platform investments.
  - Championing engineering standards across automation, code
    quality, observability, security, Infrastructure as Code
    and operational excellence.
  - Building organizational capability, including workforce
    planning, hiring, succession planning and developing
    future technical and people leaders.

  A Sneak Peek Into Our Tech Stack

  AWS (including Outposts) · 100+ Kubernetes/EKS clusters ·
  Kong Gateway & Kong Mesh · GitOps (Akuity) · Buildkite ·
  Terraform · Helm · Ansible · Vault · Datadog · PagerDuty

  THE STATS What we're looking for in our next teammate

  - Proven experience leading across multiple engineering teams,
    ideally within Platform Engineering, infrastructure, SRE,
    DevOps or a related engineering environment.
  - Experience leading and developing Engineering Managers and
    engineers, with a track record of building strong, high-
    performing teams.
  - A track record of delivering platform capabilities or
    internal products at scale that improve developer
    productivity, reliability or operational efficiency.
  - Experience setting direction and translating strategy into
    execution, aligning multiple teams around clear priorities
    and measurable outcomes.
  - Experience working closely with Product and Engineering
    leadership to shape roadmaps, prioritize investment and
    manage competing demands.
  - Experience building or scaling internal developer platforms
    and self-service capabilities, with a strong understanding
    of platform-as-a-product principles and experience driving
    adoption across an engineering organization.
  - Experience using platform metrics and developer feedback to
    measure adoption, developer experience, reliability and
    outcomes, and using those insights to inform priorities
    and investment.
  - Strong technical understanding of platform architecture,
    distributed systems and modern software delivery, with the
    ability to influence technical direction and evaluate
    trade-offs at an organizational level.
  - Experience with modern platform technologies and practices
    such as Kubernetes, AWS, GitOps, CI/CD, Infrastructure as
    Code and observability.
  - An understanding of how AI-assisted development and agent-
    based workflows are changing how engineers interact with
    platforms, tooling and infrastructure.
  - Strong stakeholder management, communication and influencing
    skills, with the ability to work effectively across
    Engineering, Product, Security and senior leadership.
  - A mindset of ownership, accountability and continuous
    improvement, with the ability to create the same culture
    across multiple teams.

  Don’t check all the boxes? That’s okay! We encourage you to
  still apply if you feel like you possess an adjacent skill
  set and are interested in learning more about this position.

  ABOUT FANDUEL

  FanDuel Group is the premier mobile gaming company in the
  United States and Canada. FanDuel Group consists of a
  portfolio of leading brands across mobile wagering
  including: America’s #1 Sportsbook, FanDuel Sportsbook; its
  leading iGaming platform, FanDuel Casino; the industry’s
  unquestioned leader in horse racing and advance-deposit
  wagering, FanDuel Racing; and its daily fantasy sports
  product.

  In addition, FanDuel Group operates FanDuel TV, its broadly
  distributed linear cable television network and FanDuel TV+,
  its leading direct-to-consumer OTT platform. FanDuel Group
  has a presence across all 50 states, Canada, and Puerto
  Rico.

  The company is based in New York with US offices in Los
  Angeles, Atlanta, and Jersey City, as well as global offices
  in Canada and Scotland. The company’s affiliates have
  offices worldwide, including in Ireland, Portugal, Romania,
  and Australia.

  FanDuel Group is a subsidiary of Flutter Entertainment, the
  world's largest sports betting and gaming operator with a
  portfolio of globally recognized brands and traded on the
  New York Stock Exchange (NYSE: FLUT).

  PLAYER BENEFITS We treat our team right

  We offer amazing benefits above and beyond the basics. We
  have an array of health plans to choose from (some as low as
  $0 per paycheck) that include programs for fertility and
  family planning, mental health support, and fitness
  benefits. We offer generous paid time off (PTO & sick
  leave), annual bonus and long-term incentive opportunities
  (based on performance), 401k with up to a 5% match, commuter
  benefits, pet insurance, and more - check out all our
  benefits here: FanDuel Total Rewards. *Benefits differ
  across location, role, and level.

