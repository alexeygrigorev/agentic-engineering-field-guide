description: |
  Company Description

  About Us

  Every business needs to know who they’re really working with
  whether it’s suppliers, investors, partners, or third
  parties. At Xapien, we’re reinventing how organisations do
  that, combining speed, scale and accuracy with cutting-edge
  AI.

  Since 2018, we’ve grown from a deep-tech startup to a global
  player in AI-driven due diligence and risk intelligence.
  2024 was a landmark year as we closed a $10M (£8M) Series A,
  earned recognition in the Chartis RiskTech100® and Everest
  Group’s Leading 50™, and expanded our products, markets and
  customer base.

  2025 has already been even bigger: With new regulations,
  rising compliance pressure and growing reputation risks,
  organisations everywhere are demanding smarter, faster ways
  to work and they’re turning to us. Customers worldwide from
  global law firms and private banks to universities and
  nonprofits rely on Xapien to turn days of manual research
  into trusted insights, delivered in minutes.

  Our momentum so far Customers in a diverse range of
  industries, with particular growth in wealth management,
  insurance, financial services and supply chain onboarding.
  Demand accelerating beyond our UK headquarters, across
  multiple continents with new customers in the Middle East,
  Asia, and Oceania.

  Why this is an exciting time to join This is not just
  another tech job, it’s a chance to shape the direction of
  the due diligence industry with our market-leading product.
  Whether you’re in engineering, data science, product, AI/ML
  or infrastructure, you’ll be solving hard, high-impact
  problems: scaling distributed systems to fuel explosive
  growth, making sense of multilingual and unstructured data,
  applying AI/ML to real-world risk, and delivering insights
  that organisations can trust in high-stakes environments.

  We’re scaling fast with more customers, more releases,
  bigger regulatory challenges and a growing expectation that
  “due diligence” means not only real-time insight, but
  conducted at pace and cost-efficiency. You won’t just be
  shipping features, you’ll be shaping architecture, tooling,
  models, and pushing the boundaries of what’s possible.

  For people who love learning, innovating, and making an
  impact that matters now is the moment to be a part of
  Xapien.

  Job Description

  The Challenge

  Our product is experiencing tremendous demand, presenting us
  with the exciting challenge of scaling our platform and
  technology. We need to deliver accurate insights while
  doubling down on how we architect, coordinate, and maintain
  our subsystems. We’re doing all of this against a backdrop
  of continuous innovation and refinement.

  The Role

  We are looking for a Fullstack Engineer (Go + React) to help
  scale and evolve the core Xapien platform as we grow
  rapidly.

  Working directly with our Head of Engineering, you will play
  a key role in shaping the future of our product. This
  position involves a mix of backend and frontend development,
  systems design, and collaborative problem solving across the
  stack.

  We are seeking someone with a strong background in modern
  web development and microservice architecture, and a mindset
  for clean, maintainable code.

  Here’s what you will be responsible for

  - Designing and building scalable microservices in Go, as part
    of a growing platform architecture.
  - Developing intuitive and performant React components to
    enhance our frontend experience.
  - Collaborating closely with product and design teams to turn
    complex user needs into elegant technical solutions.
  - Writing clean, testable, and maintainable code across the
    stack.
  - Participating in architectural discussions and helping shape
    engineering best practices.
  - Troubleshooting and resolving production issues across
    services and systems.
  - Contributing to CI/CD pipelines, observability, and
    automation alongside platform engineers.



  Qualifications

  Your Skills & Experience:

  Must-haves to be successful in this role:

  - Strong experience writing backend services in Go.
  - Proficiency in React and modern JavaScript/TypeScript.
  - Solid understanding of microservices architecture, RESTful
    APIs, and service-to-service communication.
  - Experience working with cloud infrastructure (e.g. AWS, GCP
    or Azure).
  - Strong grasp of software engineering fundamentals: testing,
    documentation, performance, reliability.
  - Excellent communication and collaboration skills: you're
    comfortable working cross-functionally with engineers,
    designers, and product managers.
  - A team-first mindset: open to feedback, different
    perspectives, and alternative approaches to coding and
    code styles.

  Nobody can do everything, but here are a few related things
  we’re interested in:

  - Experience working lower in the stack, e.g., databases,
    infrastructure, Kubernetes, or observability tooling.
  - Exposure to CI/CD tooling
  - Interest in natural language processing, AI, or distributed
    systems.



  Additional Information

  Here’s our promise to you:

  - We are going to work with you - to build a rewarding and
    fulfilling career with the opportunities, challenges and
    resources you need to do you your best work.
  - We succeed together- you will own a meaningful part of the
    business through our employee shares & equity programme.
  - Private health insurance to keep you in tip-top condition.
  - Life Insurance - let’s hope nobody ever needs this!.
  - Unlimited holidays - yes, it’s really uncapped.
  - A £1k wellness and development fund per year (including
    access to Wellhub - formerly Gympass).
  - We equip each new team member a high-spec MacBook.
  - Regular team lunches and gatherings.
  - Fun and inclusive monthly social events, from go-karting to
    mini golf to karaoke to rounders in the park.
  - Two days paid volunteering per year.
  - X day – one whole company day off every year so we can all
    switch off Slack and reset.
  - Flexible and hybrid working.
