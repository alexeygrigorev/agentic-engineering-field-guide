description: |
  Bluesky's vision is to make social more like the web itself.
  We're building a social media app, but beyond that, we've
  created a protocol that supports a broad ecosystem of
  applications and clients. Imagine a network of applications
  — from microblogging to photos to video to long-form writing
  — all interconnected and accessible with a shared identity.

  As a Fullstack Engineer, you’ll be responsible for building
  and maintaining moderation applications used internally by
  teams keeping millions of users save. You’ll work closely
  with our internal operations and product team to build
  moderation and user-safety tools.

  Responsibilities:

  - Implement features in a large scale and mature React
    application used internally for moderation and labeling.
  - Collaborate with the product team to execute on moderation
    tooling for the application
  - Gather feedback from moderators to drive improvements to
    their toolkit

  You might be a good fit if you:

  - Have strong fundamental programming and software engineering
    skills
  - Have extensive experience with building large-scale apps in
    Typescript and React (e.g. 5+ years)
  - Have built React applications with relatively large
    codebases in production
  - Have a strong sense of UI/UX excellence
  - Have experience working on the full stack of applications
    (frontend and backend)
  - Have a strong intuitive understanding of social media
  - Like working on small, fast-moving teams
  - Are interested in helping shape the future of social
    networking

  We’re a fully remote team, but an overlap of working hours
  with PST is required, and for this role, proximity and
  willingness to travel to Seattle are a plus. Please note
  there may be an on-site component to these interviews. We
  offer health, dental, and vision insurance.

  Additional Notes:

  - The anticipated base salary range for this position is
    $179,000 - $220,000, excluding equity. Equity will be
    considered in the total compensation package. Final base
    salary for this role will be based on the individual’s
    geographic location, as well as experience level, skill
    set, training, licenses and certifications.

  If you want to work with an excellent team and help define
  the future of social, we encourage you to apply.
