description: |
  About fomo

  - fomo is a trading app for the rest of us. Sign up in seconds
    and start trading right away, with no prior experience
    needed. Our social features are actually useful: follow
    top traders, see their full portfolios and trades, and
    find opportunities early. Under the hood, we deliver best-
    in-class execution and data for experienced traders.
  - In just over a year, fomo has onboarded over 3.4 million
    plus users who have collectively done over $28 billion
    dollars in trading volume.
  - fomo has made over $100M of revenue since launching in May
    2025, and has raised a total of ~$100M in addition from T1
    investors. Investors include Benchmark, Index Ventures,
    and Union Square Ventures.
  - https://fomo.family/
  - https://x.com/fomo

  About the team

  - You’ll be joining a team of 12 on the engineering side: 4
    frontend engineers, 8 backend engineers. Everyone on the
    team has experience building at scale from companies like
    Google, Pinterest, Snap, Two Sigma, Square, and dYdX. We
    have high standards for ourselves and the people we work
    with.

  Want to learn more about the team, our growth, and life at
  fomo? Check out our Work at fomo page.

  About the role

  - Backend engineers at fomo work on a little bit of everything
    across all areas of the business - from trading
    infrastructure to social network scaling. Things we’re
    working on include:
    - Trade execution and infrastructure
    - Trade data ingestion and portfolio tracking
    - Social network trust and safety
    - Analytics data ingestion and analysis
    - Infrastructure scaling and optimization
    - Constantly refining the user experience, tap by tap and
      trade by trade
  - Our stack is primarily written in Typescript with some
    purpose-specific micro-services.
  - Engineers at fomo aren’t constrained to any specific area -
    while this is primarily a backend opening, we encourage
    our backend engineers to contribute to the frontend when
    it makes sense (and vice-versa).
  - This role is in-person in NYC. We have a strong in-person
    culture and just moved into a new spacious office in Soho.

  Minimum Qualifications

  - Staff+ level engineer (6+ years of experience), able to come
    up with and execute on plans autonomously
  - Has worked at scale on consumer products with hundreds of
    thousands of users

  Nice to Haves

  - Full-stack (React) experience is a plus

  Being able to connect with customers and understanding the
  full stack of the product is something we value at fomo. All
  of our engineers think about improving our user experience
  and use the app to better understand what to improve.

  Compensation and benefits

  fomo offers:

  - Competitive cash compensation and equity
  - Comprehensive health insurance including medical, dental,
    and vision for you and your dependents; including tax
    savings benefits such as HSAs and FSAs
  - 401(k) with match
  - Group term life insurance
  - Flexible time off
  - Annual company offsites

  Equal opportunity

  fomo is an equal opportunity employer. We consider qualified
  applicants without regard to race, color, religion, sex,
  sexual orientation, gender identity or expression, national
  origin, age, disability, veteran status, or any other
  characteristic protected by applicable law. If you need a
  reasonable accommodation during the hiring process, please
  let us know.
