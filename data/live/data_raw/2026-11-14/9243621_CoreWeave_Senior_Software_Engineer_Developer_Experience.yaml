description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the Team

  CoreWeave is The Essential Cloud for AI™ — the
  infrastructure that the world's leading AI labs,
  researchers, and enterprises depend on. The Developer
  Experience (DevEx) team owns the platform, services, and
  systems that enable every engineer at CoreWeave to build and
  ship software faster, more safely, and with greater
  confidence. Our scope spans the full developer lifecycle:
  onboarding, developer environments, CLIs, SDKs, CI
  (continuous integration) and build infrastructure, test
  experience, delivery systems, artifact storage and
  distribution, internal developer platforms, and the agentic
  AI tooling that is redefining how engineers move from idea
  to production.

  This is a high-leverage technical leadership role. You won't
  be operating tooling — you'll be designing and building the
  platforms other engineers depend on every day. The work you
  do will directly shape developer velocity, system
  reliability, and the agentic developer experience across a
  rapidly scaling engineering organization.

  What You'll Do

  - Set technical direction for key DevEx platform subsystems.
    Drive architectural decisions across SDKs, CLIs, inner
    development loop, CI pipeline infrastructure, test
    experience, artifact management, developer environments,
    and agentic tooling. Lead multi-quarter initiatives from
    design through production.
  - Design and build the core services that power developer
    productivity. Build pipeline services, test experience
    platforms, progressive rollout systems, artifact
    registries, ephemeral development environments, and the
    APIs that tie them together.
  - Architect and evolve our agentic developer platform. Elevate
    agentic DevEx capabilities so engineers can delegate
    development tasks and move faster in an AI-native way.
  - Build for real scale. DevEx systems must reliably serve
    thousands of application instances and engineering
    workflows across 40+ data centers with diverse
    infrastructure profiles.
  - Mentor other senior and mid-level engineers, own design
    reviews, establish engineering patterns, and consistently
    raise the quality bar across the team.
  - Partner closely with infrastructure, security, and product
    engineering teams to design and implement developer
    experience foundations that are fast, safe, and compliant
    at scale.
  - Lead post-mortems and drive continuous improvement cycles
    that harden DevEx systems against failure modes and reduce
    operational burden for engineering teams.
  - Set the standard for documentation and onboarding across the
    platform, so engineering teams at CoreWeave can discover,
    adopt, and self-serve the tools your team builds.

  What We're Looking For

  - 6+ years of software engineering experience with building
    production platforms, developer tooling, delivery
    infrastructure, or distributed storage systems.
  - Bachelor's degree in Computer Science, Engineering, or a
    related technical field.
  - Strong systems design skills. You think in distributed
    services, event-driven architectures, and APIs. You
    approach developer platform problems as software
    engineering problems, not configuration exercises.
  - Proficiency in Go, Python, or similar languages with
    production experience shipping services in cloud-native
    environments.
  - Deep experience with Kubernetes. You understand how
    workloads are packaged, scheduled, and managed at the
    cluster level, and can design platform services that
    integrate at that layer.
  - Experience with or strong technical interest in LLM-
    integrated developer tooling, such as agent frameworks,
    MCP-style tools, or AI-assisted developer workflows.
  - Proven track record of setting technical direction, making
    sound architectural trade-offs, and driving engineering
    decisions that hold up as systems and teams scale.
  - Effective cross-functional collaborator. You can align
    stakeholders, influence without authority, and translate
    complex technical trade-offs for technical and non-
    technical audiences alike.
  - Experience mentoring engineers and consistently raising the
    technical quality bar of the teams you work on.

  Nice to Have

  - Experience designing platform APIs, SDKs, or developer tools
    that were adopted broadly across an engineering
    organization.
  - Experience building or extending CI and Build infrastructure
    at scale, including GitHub Actions, Buildkite, Bazel, or
    similar build systems.
  - Experience designing and operating progressive delivery
    systems at scale, including SLO-based quality gates,
    automated multi-stage pipeline orchestration, and custom
    Kubernetes operators, across heterogeneous deployment
    environments.
  - Hands-on experience with artifact management, including
    distributed storage, caching, versioning, or multi-region
    artifact distribution (e.g. JFrog Artifactory, Cloudsmith,
    or custom-built systems).
  - Direct experience building agentic systems, including MCP
    servers, tool-augmented LLM workflows, and incorporating
    these capabilities into DevEx platform features with
    consistent value-add.

  The base salary range for this role is $165,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

