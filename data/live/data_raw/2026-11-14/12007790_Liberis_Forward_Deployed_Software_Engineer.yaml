description: |
  Some key info for you about Liberis:

  🌱 We were founded in 2007

  💰 We have provided over $3bn of funding to small businesses
  so far

  🚀 We have been named in CNBC & Statista Top 150 UK Fintechs
  for 2025

  🌍 We're a global team, with a dynamic presence in 6 key
  locations around the world

  🧠 We're a thriving community of over 290 innovative minds

  👩🏾 🤝 👨🏼 We're a vibrant melting pot, celebrating over 27
  nationalities in our team

  🏢 Our team brings experience from over 740 previous
  companies, from startups to global giants

  🎯 We have just been named as one of FinTech’s Finest 50 by
  Welcome to the Jungle

  💪 We’re proud to be an accredited Real Living Wage employer,
  ensuring everyone is paid fairly for the great work they do!

  Our Product & Engineering Team:

  Liberis is building the embedded finance platform that lets
  partners around the world offer innovative funding products
  to their small business customers. We're a growth-stage
  fintech with teams in London, Nottingham, Atlanta,
  Stockholm, Munich and Mumbai, and we’re building a global
  Product, Data & Engineering team that thrives on autonomy,
  ownership, and is focused on impact! Our teams solve real-
  world problems for small businesses, shaping products that
  unlock opportunity at scale.

  Engineering is going through an AI-first transformation,
  rethinking how teams are structured and how they ship. It's
  changing what a small team can do! We empower our teams to
  make decisions, move fast, and take full responsibility for
  the solutions they deliver. You’ll join a team where
  curiosity is encouraged and collaboration across Product,
  Data, Delivery and Engineering is the norm.

  The role:

  As a Forward Deployed Software Engineer at Liberis, you'll
  work directly with partners to understand their technical
  challenges and help them adopt and integrate our product.
  You'll take problems from an ambiguous brief to a working
  solution, combining hands-on engineering with technical
  consultation and partner relationship building.

  This is a backend-heavy, full-stack engineering role. You'll
  work directly with partner engineers, contribute code where
  it unblocks delivery, and work with Product and Engineering
  to keep integrations reliable and supportable, so partners
  reach production faster without avoidable bespoke work or
  operational debt.

  What you'll get to do:

  - Work with partners to understand their needs, define
    technical problems and build solutions that help them
    adopt Liberis's product.
  - Own delivery from an initial, open-ended problem through to
    a working integration or solution.
  - Write code and work across different languages and
    technology stacks, adapting to each partner's environment.
  - Use AI coding tools as part of your engineering workflow,
    applying your own judgement to their output and
    limitations.
  - Build lasting technical relationships with partners,
    communicating clearly with engineers and senior business
    stakeholders.
  - Handle difficult technical conversations, including
    explaining incidents and their impact with clarity and
    sound reasoning.
  - Collaborate with product, engineering and delivery leaders
    across Liberis

  The interview process:

  - Screening call with Chess (Internal Recruiter) (30 mins)
  - Video interview with the Hiring Manager (1 hour)
  - Pairing interview with a member of Engineering team (1 hour)
  - Video interview with the wider Liberis team (1 hour)

  What we think you'll need:

  - Proven experience in a Software Engineering role using,
    Python, TypeScript or C#/.NET, NextJs and GCP.
  - Experience taking a new product, system or integration from
    an unclear problem statement to a working solution
  - Experience working directly with customers or partners to
    understand their problems and deliver software that meets
    their needs
  - Deep API knowledge (REST, authentication, webhooks,
    idempotency, SFTP and batch file flows), and can debug
    across systems you did not write using logs, traces and
    partner-side symptoms
  - Experience using AI coding tools in your engineering work,
    applying your own judgement to assess their output and
    recognise when they get things wrong
  - Clear communication skills, including the ability to explain
    technical decisions to senior stakeholders and navigate
    difficult conversations.
  - Experience designing agent-based workflows that make
    integrations faster and safer, and explain their limits to
    non-engineers.
  - Experience taking end-to-end ownership of projects,
    collaborating across Product, Engineering, Support,
    Delivery and Partner Managers

  Next steps If this opportunity feels like the right fit for
  your next career move, we’d love to hear from you!

  Even if you don’t meet every requirement, don’t hesitate to
  apply or reach out to Chess (Internal Recruiter) on
  chess.crossley@liberis.com

  Our hybrid approach

  Working together in person helps us move faster, collaborate
  better and build a great Liberis culture. Our hybrid working
  approach requires colleagues to attend the office at least
  three days a week, increasing to at least four days a week
  in Q1 2027

   #LI-FC1
