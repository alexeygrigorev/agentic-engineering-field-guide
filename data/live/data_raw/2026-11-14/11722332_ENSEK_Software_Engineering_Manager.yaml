description: |
  About ENSEK ENSEK builds the cloud‑native SaaS software
  that’s transforming how energy retailers operate, innovate
  and manage at scale. We help retailers lower operating
  costs, improve billing accuracy for consumers, and enhance
  customer experience through automation and AI‑driven
  insight, all underpinned by modern, cloud‑native
  architecture.

  ENSEK is at an exciting inflection point as we scale at pace
  towards new international horizons. If you’re motivated by
  solving complex, real‑world problems and want to lead the
  teams that build reliable, resilient platform services to
  accelerate the global energy transition, you’ll feel right
  at home with us.

  About the role

  Here you will have the chance to lead a high‑performing
  engineering team at the heart of our transformation from a
  tightly‑coupled monolith to a modern, domain‑driven,
  product‑led organisation.

  You’ll blend strong people leadership with sharp technical
  awareness to guide your team, shape engineering direction,
  and deliver scalable, cloud‑native solutions that power our
  next stage of growth.

  Working closely with Product, Design, SRE and other
  engineering teams, you’ll drive clarity, unblock delivery
  and champion a culture of ownership, experimentation and
  high standards. Your leadership will strengthen engineering
  culture, accelerate platform modernisation, and help build a
  truly domain‑aligned organisation.

  Key responsibilities:

  - Team Leadership: hiring exceptional talent, developing
    engineers through meaningful 1:1s, coaching and career
    pathways, and creating a culture of ownership,
    accountability and high standards.

  - Delivery & Planning: Drive clarity and predictability. Own
    sprint planning, backlog prioritisation and execution in
    partnership with Product, ensuring the team consistently
    delivers valuable, high‑quality features and fixes at
    pace.

  - Engineering Excellence: Raise the engineering bar. Champion
    best‑in‑class design, testing, code review and CI/CD
    practices to ensure the team ships maintainable,
    dependable and well‑engineered software.

  - Technical Ownership: Provide strong technical leadership.
    Shape architectural decisions, make pragmatic trade‑offs,
    and partner with architects and SRE to build scalable,
    secure and observable systems.

  - Cross‑Functional Collaboration: Work seamlessly with
    Product, UX, Data and SRE to align on priorities, define
    clear acceptance criteria and coordinate smooth, confident
    releases.

  - Operational Responsibility: Ensure operational excellence.
    Support on‑call readiness, lead blameless post‑incident
    reviews, strengthen runbooks, monitoring and alerting, and
    embed SLIs/SLOs for the services your team owns.

  - Continuous Improvement: Remove friction, automate manual
    processes, embed learning loops, and foster a culture
    where experimentation, improvement and innovation are the
    norm.

  Key outcomes:

  - High‑performing team: Engineers are engaged, growing and
    delivering predictable outcomes against roadmap
    commitments.

  - Reliable product delivery: Features are delivered with high
    quality, appropriate test coverage and minimal production
    incidents.

  - Operationally robust services: Services meet agreed
    SLAs/SLOs with clear dashboards, playbooks and reduced
    MTTD/MTTR.

  - Strong cross‑team alignment: Close partnership with Product
    and SRE results in faster, lower‑risk launches and
    improved customer outcomes.

  Experience required:

  - Proven engineering management experience: 3+ years managing
    engineers with a track record of hiring, coaching and
    developing teams.

  - Software delivery at scale: Experience shipping production
    microservices or cloud‑native applications using public
    cloud (AWS preferred).

  - DevOps & CI/CD: Practical understanding of automated
    pipelines, Infrastructure as Code and container
    orchestration (Kubernetes or equivalent).

  - Quality & testing: Experience driving test strategy,
    automated testing and code quality initiatives.

  - Observability & incident response: Familiar with monitoring,
    logging and incident management practices to support
    reliable operations.

  - Stakeholder management: Strong communicator able to
    influence across product, design, SRE and senior
    leadership.

  - Technical background: Strong coding experience in at least
    one modern language (e.g. Java, Kotlin, Python, Go, C#)
    and familiarity with system design and architecture
    patterns.

  Company benefits

  - 25 days’ holiday + bank holidays
  - Up to 25% bonus based on company and personal performance

  - Option to buy or sell 5 extra annual leave days per year

  - Vitality Health Insurance, including private healthcare,
    virtual GP access and mental‑health support

  - Pension with 5% matched contribution

  - Regular team‑wide and company‑wide events

  - 2 volunteering days per year

  - Remote‑first working environment with offices in London and
    Nottingham
