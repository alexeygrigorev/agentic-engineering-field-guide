description: |
  Overview

  At Opencall, we’re building AI call centers for medical
  services.

  We’re solving a unique challenge: pushing the limits of AI
  at millisecond performance to have the best human-like
  customer service experience at enterprise scale. Our AI is
  faster, cheaper, more powerful, and more reliable than
  anything else on the market. We’re looking for versatile
  engineers to help scale our proprietary system from millions
  of calls to billions of calls annually and build out new
  product lines that our customers are already asking for.

  Role: Senior Full Stack Software Engineer

  As a Senior Full Stack Software Engineer at Opencall, you'll
  be a cornerstone in taking our technological foundation to
  the next level. The ideal candidate can draw insight from
  every part of the business to prioritize effectively in a
  fast-paced environment. Deep understanding and empathy for
  our users is critical to success in this space.

  Key Responsibilities

  You’d be working on our realtime voice platform, customer
  dashboard, agent runtime, and analytics pipeline.

  Feature design and development

  - Understand how the product is currently used, our long term
    goals, and build features that deliver the best ratio of
    impact delivered to effort required

  Software architecture

  - Design systems around strict performance and infrastructure
    constraints
  - Scale our platform to >100x current traffic

  Leadership

  - We’re looking for someone who can start as an individual
    contributor, but transition into growing and running an
    organization.
  - Hiring, delegation, and mentorship will be part of the role

  Qualifications Requirements:

  Education:

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field.

  Experience:

  - 6+ years in software engineering, focusing on product
    development

  Technical Skills:

  - Proficiency in Python and Typescript.
  - Frontend experience, React preferred
  - Strong knowledge of programming fundamentals: data
    structures, algorithms, databases, networking, and design
    patterns/principles are a plus
  - Passion for maintainable code and idiot-proof systems

  Strong communication:

  - Clearly communicating technical concepts is an underrated
    skill

  Strong product sense:

  - We’re in a new space and there’s no mainstream equivalent of
    what we’re building. Figuring out what to build, not just
    how to build it, is part of the job

  High-Energy:

  - Passionate about what you do and eager to innovate.

  Ambition:

  - A desire to create groundbreaking solutions and push the
    boundaries of technology.

  Bonus points:

  - Expertise in scalable infrastructure, microservices
    architecture, containerization (Docker, Kubernetes), and
    distributed systems.
  - GraphQL experience. Even better if you have experience with
    Relay GraphQL
  - Experience with cloud platforms (e.g., AWS, GCP, Azure).

  FAQ

  What motivates us?

  - We hate bad customer service and the “press 1, press 2”
    headache. Let’s get end customers what they want without
    the suffering.

  Company outlook?

  - We have more customers than we can handle. That’s why we
    need you!

  Can I work from anywhere?

  - We prefer candidates in San Francisco or New York, but are
    open to exceptional remote applicants.
