description: |
  Software Engineering & Data Manager

  Lead the technology that keeps our business moving

  At Nisbets, we're investing in the platforms, integrations
  and data capabilities that power our business. As our
  Software Engineering & Data Manager, you'll play a key role
  in shaping how we build, support and improve the systems
  that colleagues rely on every day.

  This is an opportunity to lead a talented team across
  Software Engineering, Data Engineering and BI, ensuring our
  applications, integrations and data platforms remain
  reliable, secure and scalable. You'll work closely with
  stakeholders across the business to balance operational
  excellence with continuous improvement, helping us deliver
  solutions that create real value.

  This isn't just a people management role. You'll influence
  technology direction, improve engineering standards, drive
  data and reporting capabilities, and help modernise key
  business systems that support our future growth.

  Where you'll work

  The role is based at our Fourth Way office in Avonmouth,
  with hybrid working available following an initial training
  period.

  What you'll get to work on

  You'll have the chance to:

  - Lead and develop a team of Software Engineers, Data
    Engineers and BI professionals.
  - Drive the delivery of software, integration and data
    initiatives across the business.
  - Help shape and improve engineering standards, development
    practices and release processes.
  - Oversee APIs, EDI, automation services and business-critical
    system integrations.
  - Ensure our data warehouse, reporting platforms and analytics
    capabilities remain robust, secure and trusted.
  - Work with stakeholders to understand business challenges and
    translate them into effective technology solutions.
  - Manage team priorities, resources and delivery plans across
    both project and operational workloads.
  - Improve system reliability, performance and supportability
    while reducing technical debt.
  - Drive improvements in data governance, reporting standards
    and self-service analytics.
  - Build strong relationships with suppliers and technology
    partners to maximise value and service delivery.
  - Support the ongoing evolution of our technology landscape,
    identifying opportunities to innovate and improve.

  What you'll bring

  We don't expect you to have everything, but you'll need
  strong experience in:

  - Leading Software Engineering, Data Engineering or BI teams.
  - Delivering and supporting business-critical applications and
    technology platforms.
  - Software development lifecycle management, including
    testing, deployment and release practices.
  - Data warehousing, reporting platforms and business
    intelligence solutions.
  - APIs, system integrations and automation technologies.
  - Working with cloud platforms and Microsoft technologies.
  - Managing stakeholder expectations and translating business
    needs into technical solutions.
  - Building high-performing teams and creating a culture of
    continuous improvement.

  It would be great if you also have experience with:

  - Azure-based technologies and cloud services.
  - Power BI and modern analytics platforms.
  - ERP, Warehouse Management or Supply Chain systems.
  - Retail, distribution, logistics or other operationally
    focused environments.
  - Data governance, data quality and self-service reporting
    frameworks.

  About Us Nisbets is committed to providing equality of
  opportunity for all colleagues. We aim to ensure our
  workplaces are free from discrimination and that not only
  colleagues but also our potential future colleagues are
  treated fairly and with dignity and respect. Therefore,
  please inform us of any reasonable adjustments that we may
  need to make to the application or interview process.

  Here at Nisbets, we aim high and we dream big. From a one-
  man operation in 1983, to the UK’s market leader today –
  it’s always been our determination to hit whatever goal we
  set ourselves, no matter how big. And we’ve done it time and
  time again.

  We’re looking for experts. Passionate, forward thinkers who
  obsess about our customers as much as we do. We need
  strivers, trailblazers and problem solvers who are as
  determined to grow, develop and succeed as we are.

  We’re determined to take the next step. But we need your
  help to do it. It’s all about you.

  If you’re looking for a forward-thinking business on which
  to leave your mark; where your work is valued; Where you’ll
  test your skills and then develop them further than you
  thought you could - Nisbets is for you.

  You’ll be pushing the boundaries with us, day in day out.
  You’ll work in a fast-paced, ever changing environment.
  You’ll collaborate with a wide range of other experts around
  the business, bringing big ideas to life, and play a leading
  role in taking our journey to the next level.

  We are a  business with heart. From the small indie diner to
  the Michelin-star restaurant, Nisbets deliver the equipment
  they need to excel.  If you join our team you’ll be working
  in a family-owned business that isn’t afraid to let you
  grow. That understands the value of innovation. And that
  puts our impact on the environment, our commitment to
  ethical trading and our determination to being a fully
  transparent business at the forefront of all we do.

  Ready to take the next step with us? Apply today.
