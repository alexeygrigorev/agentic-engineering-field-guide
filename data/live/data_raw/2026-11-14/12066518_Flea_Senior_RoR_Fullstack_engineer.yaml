description: |
  ## Company Overview

  Flea Software UG (haftungsbeschränkt) is on a mission to
  transform tech leadership by empowering managers to turn
  insight into action. We foster a workplace where coaching
  drives engagement and performance, addressing the core issue
  that people quit bad managers, not companies. ## Job Title

  Senior RoR Fullstack Engineer ## Location

  Berlin, Germany ## Role Overview

  As our technical Co-Founder, you'll play a pivotal role in
  bringing Flea to life and transforming millions of dull 1:1s
  into meaningful meetings that drive engagement,
  productivity, and retention. You will have the opportunity
  to shape the tech stack and architecture according to your
  expertise and preferences. ## Responsibilities

  * Expand our MVP into a full product. * Collaborate closely
  with the founding team to iterate on our MVP and prove
  traction and engagement. * Develop a working sales funnel. *
  Contribute to the vision of developing Flea into a holistic
  AI-powered leadership enablement platform.

  ## Who You Are

  * A genuine passion for leadership and/or firsthand
  experience with the problem we solve. * Hands-on, pragmatic,
  and capable of expanding the MVP to a full product. *
  Understanding and embracing the startup journey, with all
  its potential rewards and lack of corporate security.

  ## Required Skills

  * 3-10 years of experience in software development. *
  Proficiency in Ruby on Rails and full-stack development.

  ## Offer

  * Co-Founder with equal equity share (50%). * Grant of
  2,200€ per month, to be increased with the first funding
  round (By Q2/24). * Full freedom to shape the tech stack and
  architecture. * Full-time commitment, starting ASAP. *
  Location: Berlin, Germany (the default is to be in the
  office).

  ## Our Current Status and Next Steps

  * Validated problem and solution space with 120+ user
  interviews and 40+ user tests. * Clear purchase intent from
  12+ customers and initial interest from selected investors.
  * Accepted into Reaktor Berlin as 1 of 6 teams from 214
  applicant startups. * Currently testing our live-MVP with
  selected first customers. * Next steps include getting
  fundraising ready, iterating on our MVP, and understanding
  and creating a working sales funnel.

  ## Join Our Wild Ride

  We are super stoked to get to know you and have you join us
  in creating meaningful and compassionate workplaces for
  millions. With us, you'll grow both professionally and
  personally in a nurturing environment, targeting a 17B+
  opportunity with a clear USP.
