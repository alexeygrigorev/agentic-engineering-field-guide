description: |
  The Role

  As a Senior Software Engineer you will provide technical
  leadership to the group responsible for architecting,
  developing, and owning Real-Time data collection and
  delivery. You will collaborate with Engineers, Product
  Managers and Executives across the organization to develop a
  roadmap and subsequent projects to build the next generation
  comprehensive, multichannel marketing solution that unifies
  and unlocks data across digital touch points, driving return
  on marketing investment.

  This position will be responsible for the design and
  development of realtime systems of The Zeta Marketing
  Platform and LiveIntent, working on technology that enables
  access to core of Identity Solutions. You will mentor an
  organization of developers through your knowledge sharing
  sessions that will guide and strengthen their knowledge. You
  should have a deep knowledge of distributed systems and
  cloud architecture. You will need extensive design and
  development experience and passion about working with large
  amounts of data and designing reliable low-latency data
  processing systems.

  Essential Responsibilities:

  As a Senior Software Engineer, your responsibilities will
  include:

  - Building, refining, tuning, and maintaining our real-time
    infrastructure
  - Designing, developing and maintaining services responsible
    for data collection and real-time data processing
  - Working with Product Managers to design and build data
    products
  - Working with our DevOps team to scale and optimize our
    infrastructure
  - Participate in architecture discussions, influence the road
    map, take ownership and responsibility over new projects
  - Participating in on-call rotation (be available by phone or
    email in case something goes wrong)

  Desired Characteristics:

  - Minimum 4 years of software engineering experience.
  - An undergraduate degree in Computer Science (or a related
    field) from a university where the primary language of
    instruction is English is strongly desired.
  - 2+ Years of Experience/Fluency in Scala/Java
  - Proficient with both relational and NoSQL databases
  - Experience working with container-based solutions is a plus.
  - Experience in adequate usage of libraries such as ZIO, Akka,
    Play Framework is a plus
  - Experience in adequate usage of cloud services (AWS) at
    scale
  - Experience in adequate usage of Terraform
  - Proven long term experience and enthusiasm for distributed
    data processing at scale, eagerness to learn new things.
  - Expertise in designing and architecting distributed low
    latency and scalable solutions in cloud.
  - Exposure to the whole software development lifecycle from
    inception to production and monitoring.
  - Experience in Advertising Attribution domain is a plus
  - Experience in agile software development processes
  - Excellent interpersonal and communication skills

  BENEFITS & PERKS

  - Excellent medical, dental, and vision coverage

