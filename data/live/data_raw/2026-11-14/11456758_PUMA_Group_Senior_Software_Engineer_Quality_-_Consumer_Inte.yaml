  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Intelligence & Engagement
  organisation responsible for delivering the intelligence and
  engagement capabilities that enable more relevant and
  personalised consumer experiences across digital channels.
  The organisation plays a key role in how consumers discover
  products, engage with content, and elevate experiences
  through membership & loyalty. Through capabilities such as
  personalisation, recommendations, consumer intelligence,
  experimentation, and AI-driven decisioning, the organisation
  helps deliver more contextual, data-driven interactions
  across the consumer journey.

  As a Quality Engineer, you will validate the membership and
  loyalty capabilities and integrations with core commerce
  systems. You will be responsible for creating and validating
  functional and automation test scripts. Working closely with
  the Lead Engineer, Product Owner and Engineering Manager,
  you will ensure that the delivered membership capabilities
  meet the requirements to provide superior consumer
  experience.

  What you will do:

  - Design and execute functional, integration, API and
    automated tests for membership and loyalty capabilities.
  - Build and maintain automated test suites covering API,
    integration, functional and end-to-end testing.
  - Partner with Lead Engineers, Software Engineers and Product
    Owners to embed quality throughout the software
    development lifecycle.
  - Validate loyalty points accrual, redemption and personalized
    recommendations for members.
  - Lead the team of quality engineers in the loyalty and
    personalization area
  - Create and manage test data and validation scenarios for
    member consumer experiences.
  - Ensure a consistent and reliable experience across browsers,
    devices and digital consumer journeys.
  - Leverage AI-assisted quality engineering tools and practices
    to improve test coverage, regression efficiency and defect
    detection.
  - Continuously improve automation coverage, test reliability
    and quality engineering practices.

  YOUR TALENT

  - 7+ years of experience in testing large-scale distributed
    backend systems on cloud-native platforms related to
    membership and loyalty capabilities.
  - Hands-on experience with Playwright (Preferred), Cypress,
    Appium or equivalent tools.
  - Experience in defining the test strategy for loyalty
    management applications
  - Experience in API Testing and Contract Testing.
  - Experience in Test Data Management.
  - Experience in validating membership and loyalty related
    capabilities.
  - Ability to define A/B testing approach.
  - Experience in cross-browser testing and tooling
    (BrowserStack or equivalent) is preferred.
  - Experience using coding agents, LLMs or AI-assisted
    engineering tools to improve software delivery and
    developer productivity.

  Experience in eCommerce, retail, or consumer digital
  products is strongly preferred.

