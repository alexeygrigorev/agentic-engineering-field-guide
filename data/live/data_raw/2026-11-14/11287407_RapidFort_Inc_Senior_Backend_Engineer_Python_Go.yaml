  Senior Backend Engineer (Python / Go)Overview

  We are seeking a skilled and passionate Senior Backend
  Engineer to join our team, focusing on the design,
  development, and maintenance of high-performance, scalable
  microservices. The ideal candidate will have strong
  expertise in Go (Golang), and a deep understanding of
  distributed systems architecture.

