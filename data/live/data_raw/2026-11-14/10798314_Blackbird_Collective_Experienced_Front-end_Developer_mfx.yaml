description: |
  Company Description

  Blackbird Collective is an HR organisation that helps
  startups and established companies find employees that match
  their current needs. We work on freelance and interim
  recruitment projects for clients based in Germany, most of
  which are located in Berlin.

  Job Description

  Berlin is known for its thriving cultural scene, a strong
  economy, diverse and open-minded society, beautiful
  architecture, delicious food, low cost of living and
  perfectly central location. It is not only a great place to
  live, but also for founding a company. It has become the
  biggest startup hub of Europe, with huge market demand for
  experienced tech professionals. We truly believe that
  there’s a place for each motivated and skilled candidate.
  Feel free to apply for this job or simply send us your CV
  and we will do our best to find you your next employer. At
  the moment, we are collaborating with a few innovative
  startups searching for Front-end Engineers who could support
  their existing teams. We continue to gain the majority of
  our work through recommendations so we are confident that
  our clients are great employers and offer work on exciting
  projects in international teams. Most of them are located in
  the city centre and offer all the typical perks of the
  startup environment.

  Qualifications

  - At least 3 years of professional experience in Front-end
    development
  - Good understanding of new versions of JavaScript frameworks
  - Experience in RESTful Applications
  - Good command of English
  - Prior experience of working in agile methodology

  Nice to have:

  - Knowledge regarding databases
  - Skills in writing tests
  - Knowledge of TypeScript is very beneficial

  Additional Information

  If this sounds like you, get in touch with us! We will do
  our best to find a role perfectly suited to your
  professional experience. We might not get back to you
  immediately but we will definitely let you know as soon as
  we have a matching offer.
