description: |
  🏢 Who we areA team from Germany with the vision to make
  advanced network security accessible for everyone

  We are a software company developing an open source zero-
  trust network security platform that is both easy to use and
  affordable for teams of all sizes and budgets. Our mission
  is grounded in a simple yet powerful belief: secure private
  networking is a fundamental right of every modern company.

  Since our launch on GitHub in 2021, we have gained trust
  among thousands of companies seeking secure and seamless
  solutions for connecting remote employees and
  infrastructure. By replacing traditional centralized VPNs,
  NetBird has become a trusted choice for modern network
  security, connecting today hundreds of thousands of users
  and machines worldwide. Our open source, community-driven
  approach has been a key driver of our success. We listen to
  our users, and their input helps us make network security
  better for everyone.

  Want to see what we're working on? Check out our GitHub repo
  at https://github.com/netbirdio/netbird or
  https://netbird.io/knowledge-hub

  ✏️ What you will do

  As a Software Engineer (Mobile), you will take ownership of
  the mobile apps end-to-end, collaborating closely with
  design, product, backend, and infrastructure teams to
  deliver a high-quality mobile experience aligned with our
  security-first values.

  Specifically, you will:

  - Own the development and evolution of NetBird’s mobile
    applications across iOS and Android, ensuring stability,
    usability, and performance.
  - Drive architectural decisions and establish mobile
    engineering best practices (code quality, testing, release
    processes, monitoring).
  - Build secure, intuitive, and polished mobile user
    experiences, balancing product needs with strong
    engineering fundamentals.
  - Collaborate cross-functionally with backend and client
    engineers and product teams to deliver user-focused
    features from idea to production.
  - Improve CI/CD pipelines and release processes (App Store /
    Play Store), reducing cycle time while maintaining
    quality.
  - Diagnose and resolve complex issues in production
    environments, contributing to reliability and customer
    satisfaction.
  - Contribute to code reviews, and help raise the engineering
    bar across the team.
  - Stay up to date with mobile platform trends and contribute
    innovative ideas to improve the product.

  If you read this far and think: “that’s me!” — You probably
  won’t need to read any further, and we should have a
  conversation. But if you doubt the type of experience we
  expect you to have, the following should help clarify.



  🔎 What we are looking for

  We're looking for someone who thrives in a collaborative
  environment and loves helping customers succeed.



  Must-Haves

  - 5+ years of professional software engineering experience,
    with significant experience building production mobile
    apps.
  - Strong experience with native iOS (Swift) and/or native
    Android (Kotlin/Java) development.(If you specialize in
    one platform, you should be willing and able to work
    across both or help establish a scalable cross-platform
    approach.)
  - Deep understanding of mobile app architecture and best
    practices.
  - Experience building robust mobile apps that handle secure
    authentication, networking, and state management reliably.
  - Strong knowledge of mobile testing practices (unit tests,
    integration tests, UI tests) and ability to improve
    overall test coverage.
  - Experience shipping apps to the App Store and Google Play,
    including debugging production issues and monitoring
    performance.
  - Strong collaboration and communication skills in English,
    with the ability to work independently and make pragmatic
    decisions in a startup environment.

  Nice-to-Haves

  - Experience with Android Tv and TV OS apps.
  - Familiarity with networking/security concepts (VPNs,
    WireGuard, Zero Trust, device posture, certificates).
  - Experience working with CI/CD tools for mobile (Fastlane,
    Bitrise, GitHub Actions, etc.).
  - Knowledge of mobile performance profiling and observability
    (Crashlytics, Sentry, performance monitoring).
  - Experience contributing to open source projects.
  - Experience working in cloud environments and modern backend
    ecosystems.



   😌 What’s in for you

  We know that happy and supported team members build the best
  products. That’s why we offer:

  - Comprehensive compensation package: Receive a competitive
    base salary and equity incentives.
  - Hybrid work environment: Enjoy the flexibility of working
    both from our centrally located Berlin office and
    remotely.
  - Diverse and collaborative team: Join a team that values
    fast, clean shipping and works together to achieve great
    results.
  - High level of independence: This is not a strict 9-to-6
    role. We focus on outcomes, not the appearance of work.
  - Growth opportunities: Be part of a rapidly growing company
    at the forefront of the Zero Trust security revolution.
