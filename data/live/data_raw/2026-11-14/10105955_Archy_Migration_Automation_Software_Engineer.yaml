description: |
  About Archy

  Smile! Those teeth you are showing deserve the best care you
  can give them, yet the status quo of the software your
  dentist uses today is outdated.

  Archy is a Series C vertical SaaS solution revolutionizing
  the dental practice management space — giving dental
  providers AI agents and software that lets them do what they
  do best (be dentists!) while we handle the more technical
  sides of running their practice business.

  Job Description:

  Join Archy as a Migration Automation Software Engineer and
  help revolutionize dental practice management with our
  cutting-edge SaaS solution. You will design, build, and
  optimize the automated workflows that streamline the
  onboarding process for new customers, ensuring a seamless
  and reliable data migration experience onto our platform.

  You don't just write automation scripts; you ensure that
  data migrations are fast, secure, and bulletproof. You’ll
  see your work have a direct impact on customer onboarding
  velocity and the overall success of our platform.

  Job Responsibilities:

  - Build, modify, and debug robust automation workflows and
    routines to streamline data migrations from legacy
    software packages.
  - Implement and manage custom scripting and orchestration
    processes utilizing C#, .NET, PowerShell, and related
    technologies.
  - Proactively leverage AI tools (e.g., Claude) into your
    workflow to increase velocity. We expect you to use
    sophisticated prompting to accelerate boilerplate and
    execution, but you must remain the "architect," retaining
    total ownership over the logic, security, and
    architectural implications of the code.
  - Work closely with cross-functional teams to identify system
    bottlenecks and continually improve the robustness,
    accuracy, and speed of our automated migrations.
  - Monitor, validate, and perform complex ETL (Extract,
    Transform, Load) processes to transfer critical data from
    legacy environments to the Archy platform.
  - Investigate, troubleshoot, and resolve technical issues
    related to live automated routines to maintain high
    onboarding standards.
  - Maintain comprehensive technical documentation for all tools
    and routines, and clearly communicate progress and
    roadblocks to key stakeholders.

  Job Requirements:

  - Bachelor’s degree in Engineering, Computer Science, or
    equivalent experience.
  - 2–5 years of software development experience, with a strong
    emphasis on writing clean, quality automation code
    utilizing C# and .NET frameworks.
  - Proven ability to write, debug, and optimize complex
    PowerShell scripts for environment and process
    orchestration.
  - Strong hands-on experience with SQL databases, schema
    mapping, and complex data querying/scripting.
  - A deep understanding of how to use AI tools as a co-pilot to
    accelerate development without sacrificing data integrity
    or deep-thinking problem-solving.
  - Ability to quickly analyze unfamiliar third-party software
    packages and adapt workflows to changing technical
    requirements.
  - A deep focus on data stability, testing, and system
    performance to ensure our platform remains rock-solid for
    our users.
  - Familiarity with enterprise software onboarding, ETL
    processes, or extensive data migration pipelines is a
    plus.

  What We Offer:

  - Health & Wellness: Comprehensive medical, dental, and vision
    coverage for you and your family, plus Spring Health and
    One Medical access.
  - Competitive Compensation: Base pay and equity, 401(k) with
    company match, and performance-based incentives (bonus or
    commission eligibility by role).
  - Flexibility & Remote Support: A remote-friendly culture that
    values flexibility and time to rest and recharge, with
    home office support and time-off benefits varying by role.
  - Team Connection: Annual all-company offsites to collaborate
    and connect in person.
