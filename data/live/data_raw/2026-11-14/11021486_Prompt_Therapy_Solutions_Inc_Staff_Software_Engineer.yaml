description: |
  Job Title: Staff Software Engineer

  Prompt is revolutionizing healthcare by delivering highly
  automated and modern B2B enterprise software to rehab
  therapy businesses, the teams within, and the patients they
  serve. We have established ourselves as the go-to platform
  in the space, are setting a new standard in healthcare
  technology, and rapidly growing our market share. We are
  identifying new challenges across outpatient therapy and the
  healthcare space at large every day, and we’re looking to
  bring on a Staff Software Engineer to join our powerful and
  talented engineering team as we tackle these new
  opportunities.

  As a Staff Software Engineer at Prompt, you will be a hands-
  on technical leader responsible for driving architecture,
  technical strategy, and execution across major product
  areas. You’ll tackle some of our most complex engineering
  challenges, lead the technical direction of high-impact
  initiatives, and raise the engineering bar through
  mentorship, design leadership, and direct contribution to
  the product.

  This is an individual contributor role for an engineer who
  wants to have an outsized technical impact while remaining
  deeply involved in building and shipping software.

  Why work for Prompt?

  - Big Challenges: Here at Prompt, we are solving complex and
    unique problems that have plagued the healthcare industry
    since the dawn of time.
  - Talented People: Prompt didn't happen by chance, it's a team
    of incredibly talented and proven individuals who all made
    their mark before joining forces to build the greatest
    software on the planet for rehab therapists.
  - Healthy Approach: This isn't an investment bank. At Prompt
    you own your workload and the entire organization takes a
    liking to smart work (over hard work).
  - Positive Impact: Prompt helps outpatient rehab organizations
    treat more patients and deliver better care with less
    environmental waste. That means less surgery and less
    narcotic-based pain treatment, all while turning a paper-
    heavy industry digital.

  Responsibilities

  - Define and drive technical strategy and architecture across
    major product areas
  - Lead technical design for complex features and initiatives
  - Drive technical refinement and de-risk complex initiatives
  - Mentor engineers at all levels, raising technical standards
    across the engineering team
  - Lead implementation of particularly challenging and high-
    impact product features
  - Participate and contribute to the Code Review process,
    establishing and reinforcing high standards for code
    quality and maintainability as well as coaching other
    engineers to do the same
  - Engage in and lead Design Reviews, Product Retrospectives,
    and other team based ceremonies
  - Conduct technical interviews and evolve hiring standards for
    future Prompt engineers
  - Drive alignment for key technical decisions across engineers
    and other stakeholders
  - Identify and proactively address architectural risks, tech
    debt, process problems, and scalability concerns before
    they become blockers in collaboration with other Staff
    Engineers and Architects
  - Identify and advocate for new technologies and patterns as
    appropriate for the project and team
  - Exercise strong human judgment while utilizing artificial
    intelligence as a force multiplier for development
  - Spearhead, architect, and organize green-field development
    for new products when appropriate

  Qualifications

  - Meaningful experience as a senior software engineer with a
    focus on Full Stack web development
  - Experience serving as a technical leader for complex, high-
    impact engineering initiatives
  - Demonstrated ability to mentor experienced engineers and
    raise engineering standards across a team
  - Strong communication skills and the ability to comfortably
    articulate your thoughts and decisions
  - Desire to contribute to the growth of the product, team, and
    direction of Prompt Therapy Solutions Inc.
  - Experience developing and maintaining enterprise-scale
    applications where data architecture and query performance
    were a primary concern
  - A working knowledge of the technologies listed below

  Technology

  - Advanced working knowledge of PHP, Laravel, Vue.JS, and
    MySQL or any equivalent (Ruby, Node.JS, React, Angular,
    Ember, Postgres, MSSQL, etc.)
  - Please only apply if you are interested in a heavy code
    contribution role. This is a Staff-level individual
    contributor position, not an Engineering Manager role.

  Perks - What you can expect:

  - Competitive salaries
  - Remote/hybrid environment
  - Potential equity compensation for outstanding performance
  - Flexible PTO
  - Company-wide sponsored lunches
  - Company paid disability and life insurance benefits
  - Company paid family and medical leave
  - Medical, dental, and vision insurance benefits
  - Discounted pet insurance
  - FSA/DCA and commuter benefits
  - 401k
  - Complimentary subscription to digital fitness classes and
    wellness content
  - Recovery suite at HQ – includes a cold plunge, sauna, and
    shower

  FAQ’s

  You might want to know…

  - Do I have to come to an office to do a job that is
    accomplished on a computer?No. This is a 100% remote
    position. Wear sweatpants, put your feet up, listen to
    music, whatever you fancy is.
  - Will I be working with a manager who has minimal insight
    into the complexities of engineering?No. Come join our
    team of highly skilled and proven engineers.
  - Is this an Engineering Manager role?No. This is a hands-on
    individual contributor role. Staff Engineers at Prompt
    lead through technical expertise, architecture,
    mentorship, and execution while continuing to make
    meaningful contributions to the codebase.
  - Do I have to install a time tracker on my computer because
    you do not trust my work ethic?No. Prompt employees work
    around U.S. business hours in order to promote
    collaboration and communication. You’d be expected to do
    the same within reason. We are flexible and prioritize
    actual output over how long something took.
  - Will I be working on tedious projects that never make it to
    production?No. We don't have time to waste, your work in
    the first quarter here will be in the product, we 100%
    guarantee it.
  - Will the hiring process be dragged out?No. You will hear
    back quickly and the interviewing process is efficient and
    effective.
  - Is Prompt growing quickly?Yes. Over the past several years
    Prompt has rapidly emerged from a successful startup to
    the new industry standard in the rehab therapy software
    space providing “EMR 2.0” technology that handles every
    aspect of running a rehab therapy practice, optimizing and
    automating each role in the business.

  Here at Prompt, we are committed to fostering a fair and
  respectful work environment. As part of this commitment, it
  is our policy not to hire individuals from Prompt Customers
  unless they have obtained their current employer's explicit
  consent. We believe in upholding strong professional
  relationships and respecting the agreements and commitments
  our customers have with their employees. We appreciate your
  understanding and cooperation regarding this policy. Please
  don't hesitate to inquire with our team.

  Prompt Therapy Solutions, Inc is an equal opportunity
