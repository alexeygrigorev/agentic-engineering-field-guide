  identity, sexual orientation, age, marital status, veteran
  status, disability, medical condition, or any other
  protected characteristic. We celebrate diversity and are
  committed to creating an inclusive environment for all
  employees.

  Prompt Therapy Solutions, Inc is an E-Verify Employer.
