description: |
  At Ocean Infinity, we're on a bold mission to subsea data
  using innovative technology.

  Using cutting-edge robotics, autonomous technology and
  world-class software, we're transforming how complex
  operations are carried out at sea. Our uncrewed systems are
  making ocean exploration and operations safer, smarter and
  more sustainable, helping unlock the vast potential of our
  oceans while reducing environmental impact. 🌍

  This isn't a vision for the future. It's happening right
  now.

  As we continue to push the boundaries of innovation and
  redefine what's possible in the maritime industry, we're
  looking for exceptional talent to join our fast-growing
  team.

  Ocean Infinity is seeking a hands-on Senior Software
  engineer with Tech Lead hat experience for a fullstack
  product team. You are the technical anchor of the team: you
  own how the work gets built and when it ships, while
  remaining a strong individual contributor. We are looking
  for someone assertive and entrepreneurial who takes
  initiative, digs for answers, and helps the team navigate
  complex problems rather than waiting for direction.

  As with our Senior Engineers, this role is backend-first and
  stack-plural. Our products run on C#/.NET with React, and on
  our TypeScript stack (Next.js, tRPC, Node, Postgres). You
  should be strong enough in backend engineering to set and
  hold the quality bar wherever the team is building.

  Requirements

  What you will do! 🚀

  - Set the technical direction for a fullstack product across
    backend services and web applications, and stay hands-on
    writing and reviewing code;
  - Own the how and the when: technical approach, task
    breakdown, sequencing, capacity, and the quality bar, and
    be accountable for delivery;
  - Hold the line on backend design discipline, so that services
    stay maintainable as the team and codebase grow;
  - Collaborate with Product, Design, and QA to define, design,
    and ship features, distinguishing core engineering work
    from simpler edge work;
  - Facilitate the team's delivery rhythm (stand-ups, planning,
    refinement, retrospectives) and remove impediments;
  - Raise the engineering bar through mentorship, code review,
    and constructive technical feedback;
  - Use AI-assisted development tools (such as Cursor or Claude)
    as part of your everyday workflow, and help the team use
    them well;
  - Follow development and quality best practices, and be
    critical when you believe they can be improved;
  - Document software and processes as needed.

  What we look for!🔍

  - Degree in Computer Science, Information Technology, or
    related;
  - Preferably 6+ years as a software engineer, with production
    experience across backend services and web frontends;
  - Proven experience as a Tech Lead or in a similar technical-
    leadership role, owning a team's technical approach and
    delivery;
  - Strong backend fundamentals: Clean Architecture, design
    patterns, and API design, with hands-on experience in
    C#/.NETor Node/TypeScript;
  - Proven experience building single-page web apps with React;
  - Solid experience with relational databases and an ORM,
    including schema and migration management;
  - Proficiency with TypeScript and Git;
  - Understanding and practice of Agile methodologies;
  - Familiarity with web application security concepts;
  - Fluency in English, spoken and written;
  - Strong communication and the ability to lead by example;
  - Critical thinking, initiative, and an entrepreneurial
    mindset.

  Nice to have! ✨

  - Experience establishing backend patterns or guidelines on a
    TypeScript/Node stack;
  - Experience with event-driven or event-streaming systems
    (Kafka, RabbitMQ, or similar);
  - Experience with real-time data (WebSockets, SignalR);
  - Experience with containerisation and orchestration (Docker,
    Kubernetes);
  - Experience with CI/CD and infrastructure-as-code;
  - Familiarity with a cloud platform (Azure, AWS, or GCP);
  - Strong understanding of quality management, including
    relevant standards and procedures.

  Benefits

  *Salary: £110,000 Per Annum*
