description: |
  Tremendous is the global platform built for businesses to
  send thousands of payouts to anyone, anywhere, for free.
  We're trusted by 20,000 leading organizations like
  Atlassian, MIT, and United Way to deliver gift cards and
  money to millions of recipients worldwide.

  In both our product and our workplace, we're intentional
  about making work more efficient, flexible, and fulfilling.
  Tremendous is a fully remote, high-documentation, low-
  meeting culture, which means more time for what matters in
  both your professional and personal life.

  Our customers, who include researchers, marketers, HR teams,
  and nonprofits, rave about how fast and easy it is to use
  Tremendous. Check out our ratings on G2.

  Tremendous is profitable and growing without outside
  investors.

  About the role

  We're looking for a GTM Engineering Manager to lead our team
  of GTM engineers. Our Revenue Operations team works like a
  product and engineering org: planners define what marketing,
  sales, and customer success need, and GTM engineers design
  and build it with LLMs, workflow tools, and code. You'll own
  how that team works: its standards, its infrastructure, and
  the growth of the people on it. You'll stay hands-on,
  building the systems that make the whole team faster.

  What you'll do

  - Manage and develop a team of GTM engineers across marketing,
    sales, and platform work. Hire the next ones.
  - Set the team's engineering practices: version control,
    review, documentation, and ownership for every workflow,
    agent, and integration in production.
  - Build the team's own infrastructure, including the agents
    and tooling that keep work assigned, tracked, and current.
  - Partner with GTM planners on the roadmap: bring the build-
    side view on what's feasible and how to sequence it, and
    put the right builder on the right project.
  - Act as the team's ambassador to our AI enablement
    engineering team, and shape how work moves from a GTM
    engineering prototype to long-term engineering ownership.
  - Own relationships with the technical vendors the team builds
    on, such as Cargo.

  What you'll bring

  - 7+ years across RevOps, GTM engineering, marketing or sales
    ops engineering, or internal tools, with real hands-on
    building.
  - 2+ years managing builders or technical roles, with people
    you've grown into stronger roles.
  - You're a capable builder yourself: AI agents, workflow tools
    (Cargo, Clay, n8n, Zapier, or similar), APIs, webhooks,
    and Git.
  - Engineering-manager instincts: you've set up review,
    documentation, and rollback practices on systems other
    people depend on.
  - Fluency across the GTM funnel: marketing, sales, and
    customer success.
  - Strong written communication. We're a documentation-first
    culture.
  - Autonomous and self-directed. Tremendous is not a great fit
    for people who default to waiting for instructions.
  - High empathy. You care about your teammates and the people
    who use what your team builds.

  Nice to haves

  - HubSpot depth, especially workflows and APIs
  - Cursor, Claude, or similar AI-assisted development as a
    daily habit
  - SQL and Snowflake
  - Experience standing up a GTM engineering or RevOps
    engineering team from a few people
  - Usage-based or fintech GTM experience

  What's cool about the role

  - The team already exists and is shipping. You're making a
    strong team faster, not starting from scratch.
  - The company is AI-forward. Cursor daily, regular AI tool
    evaluations, leadership fully bought in.
  - Profitable and growing without outside investors.
  - Competitive pay, equity, and benefits. Base salary:
    $190,000-$230,000
  - Fully remote. This role is US Remote.
  - Smart people and a great culture. See our company handbook.
