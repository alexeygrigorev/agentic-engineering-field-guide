description: |
  At Klatch, we are building the next generation of data
  labeling platform, one that puts AI at the core, not as a
  fancy add-on feature. Think of it as "data labeling 2.0,"
  where pre-trained models do the heavy lifting and humans
  perfect the output. Our platform will leverage an extensive
  library of foundational models to make AI-assisted labeling
  the norm, not the exception. Imagine a workflow where you
  are not starting annotation from scratch but with pre-
  labeled data, with manual annotators simply refining the
  output. That's where we're heading.

  Responsibilities 💼

  You will work hands-on to design, build, and ship features
  across the stack. This role is high impact, and your code
  will be used in live projects.

  - Own and ship user-facing features for annotation and review
    interfaces
  - Implement backend services for ingestion, storage, user
    management, and annotation pipelines
  - Integrate model inference into workflows so users see auto-
    annotations by default
  - Improve performance for loading, rendering, and editing
    large images and videos
  - Design and maintain robust APIs and data flows between UI,
    model services, and storage
  - Work directly with product, operations, and annotators to
    iterate on real user problems

  Benefits✨

  - Full Stack Engineer Internship Certificate
  - Internship monthly stipend
  - Flexible work timings + Remote (Work from Home)
  - Valuable career exposure to the fastest-growing AI field of
    Computer Vision and Data Labeling

  Qualifications 🎓

  Required:

  - Strong proficiency in a modern front-end framework such as
    React or Vue
  - Solid backend experience with Node.js or Python frameworks
    (FastAPI, Django, or Flask)
  - Hands-on experience working with databases such as
    PostgreSQL or MongoDB
  - Clear understanding of REST APIs, authentication, and
    client-server architecture
  - Practical experience using Git in a collaborative
    development environment

  Preferred:

  - Any work or projects involving Computer Vision or ML
    pipelines
  - Familiarity with annotation tools such as CVAT, Labelbox, or
    similar platforms
  - Familiarity with cloud platforms (AWS, GCP, or Azure) and
    containerization (Docker)
  - Basic understanding of how ML models are deployed and served
    in production

  Why this opportunity? 💡

  - Real product and startup experience building a deep tech
    platform
  - Hands-on exposure to AI-assisted workflows and Computer
    Vision tooling
  - Mentorship from founders and engineers with domain
    experience
  - Portfolio work you can showcase — shipped features used by
    real users
  - We are an early-stage team developing a game-changing
    Computer Vision annotation platform. If you want to build
    product-grade systems that actually ship and impact ML
    teams, this is the place.

  About us

  Klatch is at the forefront of addressing today's most
  critical challenge in AI development: the need for high-
  quality, diverse data. Our award-winning Data Annotation,
  Data Acquisition, and Synthetic Data Generation services are
  tailored to fuel innovation across Computer Vision, ML, and
  NLP LLM applications. We are seeking Interns for our AI Data
  Annotation Services team. This is a remote internship and is
  open to qualified applicants worldwide.

  Our Impact: Recognized in Slator's 2024 Top Language AI
  Firms under the Data for AI segment, Klatch has established
  itself as an essential partner for enterprises pushing the
  boundaries of AI. We were also nominated for Startup of the
  Year 2024 by HackerNoon in the AI and IT Services segment.
