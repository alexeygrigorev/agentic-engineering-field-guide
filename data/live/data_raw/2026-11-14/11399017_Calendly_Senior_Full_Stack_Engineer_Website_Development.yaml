description: |
  What’s in it for you?

  Ready to make a serious impact? Millions of people already
  rely on Calendly, and we’re still in the midst of exciting
  product growth — it’s a fantastic time to join us.
  Everything you’ll work on here will accelerate your career
  to the next level. If you want to learn, grow, and do the
  best work of your life alongside the best people you’ve ever
  worked with, then we hope you’ll consider allowing Calendly
  to be a part of your professional journey.

  About the team & opportunity

  Millions of people rely on Calendly, and our website is
  often their first experience with our product and brand. As
  Calendly continues to grow, our web experiences play an
  increasingly important role in how people discover our
  products, find answers, and become customers.

  In this role, you’ll build highly visible experiences at
  scale while helping shape the technical foundation behind
  them.

  A day in the life of a Senior Full Stack Engineer at
  Calendly

  As a Senior Full Stack Engineer on the Website Development
  team, you’ll help build and evolve the platforms powering
  Calendly’s public-facing experiences, including our
  marketing website and Help Center.

  You’ll partner with Marketing, Content, SEO, Design,
  Product, and Engineering to build fast, accessible,
  discoverable, and maintainable web experiences. You’ll have
  end-to-end ownership across frontend architecture, content
  systems, CMS integrations, performance, experimentation, and
  search and AI-powered discovery.

  On a typical day, you will be working on:

  - Design, build, and maintain performant, responsive, and
    accessible web experiences used by millions of visitors.
  - Own projects end to end, from discovery and technical design
    through implementation, testing, deployment, measurement,
    and iteration.
  - Build scalable frontend architecture, reusable components,
    and content models that allow teams to launch and iterate
    quickly without sacrificing quality.
  - Build and maintain integrations across our web applications,
    CMS, analytics and experimentation platforms, APIs, and
    other Calendly systems.
  - Partner with Marketing, Content, SEO, Design, and Product to
    translate business and customer needs into scalable
    technical solutions and efficient publishing workflows.
  - Apply technical SEO and Answer Engine Optimization (AEO)
    best practices to improve how Calendly content is
    discovered across traditional search and AI-powered
    experiences.
  - Monitor and improve Core Web Vitals, site performance,
    accessibility, reliability, and overall web quality.
  - Help shape the technical direction of Calendly’s public web
    platform by simplifying architecture, improving developer
    experience, and raising the engineering bar through
    technical design, testing, code reviews, documentation,
    and mentorship.

  What do we need from you?

  - 7+ years of professional software development experience,
    including significant experience building and operating
    production web applications at scale.
  - Strong proficiency with modern JavaScript and TypeScript,
    modern frontend frameworks, and core web technologies
    including HTML and CSS.
  - Strong understanding of browser behavior, responsive design,
    accessibility, caching, and web performance.
  - Experience designing scalable frontend systems and reusable
    component architectures.
  - Experience integrating web applications with APIs, content
    management systems, analytics platforms, experimentation
    systems, and other services.
  - Working knowledge of technical SEO, including crawlability,
    indexing, metadata, structured data, site architecture,
    redirects, canonicalization, and performance, as well as
    familiarity with AEO and AI-powered discovery.
  - Experience measuring and improving the performance,
    accessibility, and quality of high-traffic web
    applications.
  - Strong engineering fundamentals with an emphasis on clean,
    maintainable code, thoughtful testing, and incremental
    delivery.
  - Strong communication and collaboration skills with the
    ability to take ambiguous business or customer needs,
    shape the problem, and independently drive a technical
    solution from idea through production.
  - Authorized to work lawfully in the United States of America
    as Calendly does not engage in immigration sponsorship at
    this time.

  Nice to have

  - Experience with Payload CMS or another modern headless CMS,
    including designing content models and architectures for
    large, content-rich websites.
  - Experience with Astro or similar modern web frameworks and
    static/server-rendered architectures.
  - Experience with internationalization and localization across
    large web properties.
  - Experience with experimentation, conversion optimization,
    SEO, growth marketing, or content teams on high-traffic
    websites.
  - Experience building structured content or content APIs used
    by AI assistants, search systems, or other downstream
    consumers.
  - Experience modernizing or migrating large websites, CMS
    platforms, or frontend architectures.

  Tier 1 Salary Hiring Range

  $224,400—$271,920 USD

  Tier 2 Salary Hiring Range

  $205,700—$249,260 USD

  Tier 3 Salary Hiring Range

  $187,000—$226,600 USD

  The ranges listed above are the expected annual base salary
  for this role, subject to change.

  Calendly takes a number of factors into consideration when
  determining an employee’s starting salary, including
  relevant experience, relevant skills sets, interview
  performance, location/metropolitan area, and internal pay
  equity.

  Base salary is just one component of Calendly’s total
  rewards package. All full-time (30 hours/week) employees are
  also eligible for equity awards, and competitive benefits.
  Eligible Sales employees also qualify for a Sales Incentive
  program.

  Calendly uses the zip code of an employee’s remote work
  location, or the onsite building location if hybrid, to
  determine which metropolitan pay range we use. Current
  geographic zones are as follows:

  - Tier 1: San Francisco, CA, San Jose, CA, New York City, NY
  - Tier 2: Chicago, IL, Austin, TX, Denver, CO, Boston, MA,
    Washington D.C., Philadelphia, PA, Portland, OR, Seattle,
    WA, Miami, FL, and all other cities in CA.
  - Tier 3: All other locations not in Tier 1 or Tier 2

  If you are an individual with a disability and would like to
  request a reasonable accommodation as part of the
  application or recruiting process, please let your Recruiter
  know when first connecting with them. Calendly is registered
  as an employer in many, but not all, states. If you are
  located in Alaska, Delaware, Hawaii, Idaho, Iowa, Montana,
  Nebraska, North Dakota, Rhode Island, South Dakota, and West
  Virginia, you will not be eligible for employment. Note that
  all individual roles will specify location eligibility.

