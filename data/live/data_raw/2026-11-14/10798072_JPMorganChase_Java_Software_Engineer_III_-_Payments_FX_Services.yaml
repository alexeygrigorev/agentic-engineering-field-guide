  As a Software Engineer III in the Commercial and Investment
  Bank, you will lead the implementation of critical
  technology solutions across multiple domains. You will work
  within an agile team to enhance, build, and deliver secure,
  stable, and scalable products. You’ll support various
  business functions, produce architecture and design
  artifacts, and ensure design constraints are met. Your
  leadership and technical skills will drive innovation and
  reliability.

  Job Responsibilities:

  - Execute software solutions, design, development, and
    technical troubleshooting to solve complex problems
  - Create secure, high-quality production code and maintain
    algorithms that integrate with systems
  - Produce architecture and design artifacts for complex
    applications, ensuring design constraints are met
  - Gather, analyze, and synthesize data to develop
    visualizations and reporting for continuous improvement
  - Identify hidden problems and patterns in data to drive
    improvements in coding hygiene and system architecture
  - Contribute to a culture of diversity, opportunity,
    inclusion, and respect

  Required Qualifications, Capabilities, and Skills:

  - Demonstrate expertise in Java technologies and frameworks
    such as Spring/Spring Boot and REST-based services
  - Show proficiency in Unix/Linux environments, including
    system navigation and log investigation
  - Apply hands-on experience in system design, application
    development, testing, and operational stability
  - Develop, debug, and maintain code in a large corporate
    environment using modern programming and database querying
    languages
  - Understand the Software Development Life Cycle
  - Possess knowledge of agile methodologies including CI/CD,
    application resiliency, and security
  - Exhibit knowledge of software applications and technical
    processes within disciplines such as cloud, artificial
    intelligence, machine learning, or mobile

  Preferred Qualifications, Capabilities, and Skills:

  - Familiarity with modern front-end technologies
  - Exposure to cloud technologies, Splunk, Apache Kafka, and
    Grafana

