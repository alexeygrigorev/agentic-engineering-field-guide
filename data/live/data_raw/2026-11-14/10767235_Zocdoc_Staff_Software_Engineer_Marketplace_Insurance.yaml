description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission

  Zocdoc's greatest asset is its people. As a Staff Software
  Engineer on the Marketplace Insurance team, you'll help
  answer two of the most important questions patients face
  when seeking healthcare: Which providers can I see in-
  network? and How much will it cost?

  We empower patients to make informed healthcare decisions
  with confidence while driving a significant, high-visibility
  impact on Zocdoc's business. You'll tackle complex technical
  challenges, simplifying an intricate domain that involves
  vast datasets. Spanning thousands of insurers and millions
  of patients, into seamless, user-friendly experiences.

  As a Staff Engineer on the team, you'll provide technical
  leadership, guide design decisions, and mentor engineers to
  drive best practices across the organization. All while
  maintaining a strong focus on user experience and shipping
  features that delight the user.

  You'll enjoy this role if you are…

  - Inspired by the opportunity to positively impact the
    healthcare experience for millions of patients
  - Passionate about building highly scalable platforms and
    excited about developing new and innovative products
  - Undaunted by the complexity of how the health insurance
    system works, and are motivated to simplify it for
    patients
  - Product-driven with a relentless focus on user needs; you’re
    excited to partner closely with cross-functional teams,
    leading projects beginning from the early ideation phase
  - A fervent champion of engineering fundamentals and enjoy
    driving adoption of best practices in code health,
    testing, and maintainability across organizations and
    teams
  - A leader who mentors and grows teams, cultivates innovation,
    and drives cross-collaboration across multiple teams
  - An entrepreneur with strong ownership who can thrive in an
    ambiguous and fast-changing environment

  Your day to day is…

  - Ownership of Zocdoc's expansion of Insurance features and
    cost transparency, including roadmapping, prototyping, and
    leading 0 - 1 projects that span across the technology
    stack
  - Acting as a stakeholder in deciding what we build, and
    partnering with other business and product stakeholders to
    chart the course
  - Analyzing and decomposing complex product challenges to
    drive sound design decisions
  - Working hands-on with your team and shipping production code
    using C#, React, and AWS to millions of users autonomously
  - Collaborating with our agile team of dedicated and brilliant
    engineers, product managers, designers and data scientists
  - Mentoring fellow engineers, supercharging team throughput
    through robust coding standards, automated workflows, and
    a culture that embraces continuous improvement
  - Continuously improving our ability to deliver quality
    solutions through evolving engineering process and
    technical capabilities
  - Working with cutting edge GenAI tools and technology to have
    a multiplier effect on the team

  You'll be successful in this role if you have…

  - 7+ years of significant expertise in building and scaling
    high-performance, distributed backend systems
  - Successfully shipped code for a complex, user-facing
    product, with experience working across multiple areas of
    the technology stack
  - Possess a strong product-owner mindset with a relentless
    focus on user needs and a demonstrated history of
    delivering features that drive significant business impact
  - Demonstrated history of solid and well-rounded system design
    skills. Designing systems for high availability, fault
    tolerance, and graceful degradation
  - Improved developer productivity, efficiency, and velocity by
    setting up the best practices for coding, testing,
    deployment, and observability
  - Successfully mentored other engineers in the past and have
    encouraged your peers to use engineering best practices
  - Been an effective communicator capable of delving into
    technical details, leading technical discussions, and
    presenting solutions to diverse cross-functional audiences
  - Experience evaluating and working with third-party vendors
    and data providers

  Benefits:

  - Flexible, hybrid work environment at our convenient Soho
    location
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - Commuter Benefits
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Catered lunch everyday along with beverages and snacks
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified

  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
  with market data. Base salary offered is determined by a
  number of factors including the candidate’s experience,
  qualifications, and skills. Certain positions are also
  eligible for variable pay and/or equity; your recruiter will
  discuss the full compensation package details.

  NYC Base Salary Range

  $180,000—$270,000 USD

  About us Zocdoc is the country’s leading digital health
  marketplace that helps patients easily find and book the
  care they need. Each month, millions of patients use our
  free service to find nearby, in-network providers, compare
  choices based on verified patient reviews, and instantly
  book in-person or video visits online. Providers participate
  in Zocdoc’s Marketplace to reach new patients to grow their
  practice, fill their last-minute openings, and deliver a
  better healthcare experience. Founded in 2007 with a mission
  to give power to the patient, our work each day in pursuit
  of that mission is guided by our six core values. Zocdoc is
  a private company backed by some of the world’s leading
  investors, and we believe we’re still only scratching the
  surface of what we plan to accomplish.

  Zocdoc is a mission-driven organization dedicated to
  building teams as diverse as the patients and providers we
  aim to serve. In the spirit of one of our core values -
  Together, Not Alone, we are a company that prides itself on
  being highly collaborative, and we believe that diverse
  perspectives, experiences and contributors make our
  community and our platform better.  We’re an equal
  opportunity employer committed to providing employees with a
  work environment free of discrimination and harassment.
