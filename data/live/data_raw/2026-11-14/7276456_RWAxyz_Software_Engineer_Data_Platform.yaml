description: |
  About RWA.xyz

  Tokenization is the most significant infrastructure upgrade
  in modern capital markets, enabling programmable, real-time
  settlement of financial assets using blockchain rails. The
  tokenization market has grown to over $30 billion, expanding
  300% year-over-year, yet still represents less than 0.01% of
  the $500+ trillion in global financial assets.

  RWA.xyz is the leading data platform for tokenized assets.
  We are the trusted provider for leading financial
  institutions like Goldman Sachs, J.P. Morgan, the U.S.
  Treasury, the IMF, and countless others.

  We are backed by top investors across both traditional
  finance and crypto: Archetype, Jump, Solana. Our team comes
  from the best companies in Silicon Valley and Wall Street.

  Overview

  Role: Software Engineer

  Team: Data Platform

  Type: Individual Contributor

  Level: Mid-level (3-6 years of experience)

  Compensation: $175k-225k salary + 0.5%-1% equity, depending
  on experience

  Location: Hybrid in NYC

  What You’ll Do

  As a software engineer on the data platform, your
  responsibilities will include:

  - Building our core data systems and API
  - Collaborating with product engineers to ship new features
  - Increasing team productivity by improving the development
    lifecycle

  Since we’re a startup, in addition to the above, you’ll have
  the chance to be involved in other areas of the business
  like product, growth, recruiting, and fundraising.

  What We’re Looking For

  None of these are strict requirements—we believe great
  candidates can come from many different backgrounds.

  - 3+ years of experience engineering data systems with
    technologies like Spark, Beam, or Flink
  - Strong experience in relational database schema design
  - Experience with cloud infrastructure DevOps
  - Excellent communication ability
  - Strong sense of ownership and craftsmanship
  - Can move quickly and accurately under conditions of
    uncertainty without supervision

  Bonus points if you have previous blockchain data, early-
  stage startup, or finance experience!

  Interview Process

  - The first step is meeting Charlie, our CTO. He’ll ask in-
    depth questions about your work history, as well as give
    you an overview of our company and culture.
  - The next step is a technical take-home assignment where
    you’ll solve a problem similar to the ones we face every
    day.
  - After the take-home, you’ll meet us on-site to whiteboard a
    system design problem, discuss how you think about
    engineering management and processes, and enjoy a
    delicious lunch with the team!
  - Finally, we like to do a paid trial run, where you’ll be
    working with us over a weekend or part-time during the
    week. This lets both sides make a more informed decision
    about working together.
  - Afterwards, we’ll ask for references with past colleagues
    and compile a formal offer
