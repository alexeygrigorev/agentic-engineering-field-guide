description: |
  About BullishBullish is an institutionally focused global
  digital asset platform that provides market infrastructure
  and information services. These include: Bullish Exchange –
  a regulated and institutionally focused digital assets spot
  and derivatives exchange, integrating a high-performance
  central limit order book matching engine with automated
  market making to provide deep and predictable liquidity.
  Bullish Exchange is regulated in Germany, Hong Kong, and
  Gibraltar. CoinDesk Indices – a collection of tradable
  proprietary and single-asset benchmarks and indices that
  track the performance of digital assets for global
  institutions in the digital assets and traditional finance
  industries. CoinDesk Data - a broad suite of digital assets
  market data and analytics, providing real-time insights into
  prices, trends, and market dynamics. CoinDesk Insights – a
  digital asset media and events provider and operator of
  Coindesk.com, a digital media platform that covers news and
  insights about digital assets, the underlying markets,
  policy, and blockchain technology.

  Reports to:

  Director, Engineering, CoinDesk

  About CoinDesk: At CoinDesk, we do more than report on the
  future of money. We actively help shape it. As the global
  leader in crypto news, indices, and events, we provide the
  transparency and context the world needs to understand the
  digital asset revolution. Our team is dedicated to a shared
  mission: informing, educating, and connecting the global
  community.

  Our impact is amplified by our position within the Bullish
  Group. Bullish is a regulated, institutional-grade exchange
  known for technological prowess. Operating as a subsidiary,
  CoinDesk is backed by a partner that shares our belief in
  the transformative power of digital assets.

  We value engineers who treat development as a craft. You
  will own outcomes from concept to deployment. We expect you
  to navigate the unknown and bring structure to ambiguity.
  You will help shape the frameworks and processes that drive
  our global teams forward. We refuse to compromise on
  quality. We seek problem solvers who thrive on high-impact
  technical challenges.

  The Team: CoinDesk Media Engineering:

  The CoinDesk Media Engineering Team builds and optimizes the
  digital touchpoints that connect millions of global readers
  to the digital asset economy. Our mission is to ensure
  seamless, real-time access to breaking journalism,
  multimedia, and market intelligence for millions of readers
  worldwide. We are responsible for the architecture,
  development, and optimization of coindesk.com, the CoinDesk
  mobile applications, and the high-availability services
  layer behind both.

  What You’ll Do:

  - End-to-End Delivery Excellence: Own features across the
    complete product lifecycle. You will lead scoping
    alongside product and design, oversee shipping, and
    monitor systems in production. You will ensure systems
    remain secure, fault-tolerant, and performant.
  - Full-Stack Execution: Architect and ship robust
    functionality across our web platform, mobile
    applications, and services layer. You will build high-
    quality solutions using Next.js, React 19, TypeScript, and
    modern runtime services.
  - AI-Native Engineering: Leverage AI tools as a default part
    of how you design, build, and optimize software. We use
    Claude Code, Open Code, and open-source models daily. You
    will also identify opportunities to build internal tooling
    that streamlines workflows for editors, designers, and
    product partners.
  - Direct Cross-Functional Collaboration: Partner directly with
    product managers, UX designers, and editorial stakeholders
    in a nimble team setting. You will take initiatives from
    rough conceptual drafts to production reality without
    unnecessary organizational overhead.
  - Safe Release & Operational Governance: Champion progressive
    rollout practices using feature flags such as
    LaunchDarkly. Implement automated CI/CD pipelines and
    disciplined observability. You will deploy frequently with
    confidence and minimal blast radius.

  What You’ll Bring:

  - Senior-Level Production Experience: 5+ years of shipping
    production-grade software. You have deep, hands-on
    authority across modern web architectures (Next.js and
    React) and backend environments (Node.js and TypeScript).
    You also have strong experience with RESTful APIs and
    content management platforms.
  - Web Performance & Architecture Mastery: Advanced expertise
    in Next.js, server-side rendering (SSR), and modern
    caching patterns. You demonstrate deep knowledge of Core
    Web Vitals optimization to deliver lightning-fast
    experiences for a massive global readership.
  - Quality as a Feature: A fundamental commitment to software
    quality. You implement rigorous automated testing across
    unit, integration, and end-to-end suites with Playwright
    and Maestro. Testing is an inherent part of your
    development process, not an afterthought.
  - Pragmatic Craftsmanship: A strong bias toward action and
    simplicity. You thrive in a collaborative environment. You
    can take existing systems, eliminate technical friction,
    and make codebases enjoyable and sustainable to scale.
  - End-to-End DevSecOps Mindset: Practical experience managing
    CI/CD pipelines and embedding security best practices. You
    have hands-on experience integrating secure identity
    systems like Auth0 across client and server boundaries.
  - Collaborative Problem Solving: Strong communication skills
    and comfort working directly with non-engineering
    stakeholders. You excel at translating product vision into
    clean, maintainable technical execution.

  Nice to Haves:

  - Cross-Platform Mobile Engineering: Hands-on experience
    building or maintaining mobile apps using React Native and
    Expo.
  - Publishing & Headless Architecture: Experience with modern
    headless CMS platforms, such as Sanity, and structured
    content workflows at scale.
  - Monetization & Analytics Infrastructure: Prior work
    integrating ad management engines (Google Ad Manager),
    digital paywalls and billing (Stripe), and behavioral
    analytics (Amplitude and HubSpot).
  - Cloud Infrastructure & IaC: Familiarity with Google Cloud
    Platform, including GCP Cloud Functions, and
    Infrastructure as Code using Terraform.
  - Modern Runtimes & High-Performance Microservices: Curiosity
    or hands-on experience with emerging web runtimes like Bun
    and Elysia, as well as in-memory datastores like Redis.

  Bullish is proud to be an equal opportunity employer. We are
  fast evolving and striving towards being a globally-diverse
  community. With integrity at our core, our success is driven
  by a talented team of individuals and the different
  perspectives they are encouraged to bring to work every day.
