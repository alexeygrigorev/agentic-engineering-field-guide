description: |
  About Us

  Teton is redefining the role of healthcare workers through
  cutting-edge AI technology and a great product experience.
  As populations gets older and a shortage in staff,
  healthcare system is under pressure. Our missions is to
  decrease the cost of healthcare while improving the quality
  of care.

  Our product enables careteams to intervene, prevent and
  operator more efficiently. Our ambient sensors in resident
  rooms captures activity, sleep, respiration, gait and more.
  These signal used for both react fast to risk events, like
  falls, and long term health analysis, for care teams to take
  actions.

  Teton is scaling fast, operating in Nordics, UK, DACH and
  US. Recently raised 20M $$ series A. Expect travel to the
  US, to meet users and team members.

  We focus relentless on product excellence and user
  experience, deploying solutions at speed that make a
  tangible difference for cares. We are an aspiring
  meritocracy biased towards action, striving to always raise
  the bar. If you are driven by impact, speed and leveling up,
  this might be the place for you.

  If you are looking for a 9-17 job, perform best with
  structure and struggle dealing with unknowns, this is not
  for you. We believe close collaboration between a hard
  working, high agency team enables the fastest and most
  efficient iteration cycles, helping us build an impactful
  product that healthcare professionals truly love to use.

  The Job

  We are looking for a strong backend engineer to help scale
  the core infrastructure powering Teton’s platform.

  Our systems ingest and process continuous streams of real-
  time data from thousands of deployed edge devices across
  care facilities. These systems power critical alerts and
  operational workflows used by healthcare staff around the
  clock.

  You will work across:

  - Distributed data ingestion systems
  - Real-time event pipelines
  - APIs and backend services
  - Databases and storage systems
  - MQTT infrastructure and edge communication
  - Reliability, observability, and system performance
  - Cloud infrastructure and deployment architecture

  Qualifications:

  We care more about engineering ability and ownership than
  specific credentials, but strong candidates will likely have
  experience with several of the following:

  - Building and operating large-scale backend or distributed
    systems
  - Designing reliable real-time data pipelines
  - Working with event-driven architectures and asynchronous
    systems
  - Scaling APIs and services handling high-throughput workloads
  - Operating production infrastructure with strong reliability
    requirements
  - Database design and performance optimization
  - Cloud infrastructure and deployment tooling
  - Debugging complex production issues under pressure

  What We Offer

  - Participation in our warrant program (stock options).
  - A small team where your decisions directly shape the
    product.
  - A Copenhagen-based office with close collaboration, no
    async-only culture.
  - Work on software that healthcare workers depend on every
    day, the impact is tangible and immediate.

  Join Our Team

  We're looking for individuals who share our vision and value
  ownership and entrepreneurship over a conventional job.

  At Teton, you'll have the chance to make a real impact with
  your work.

  If you're ready for more than just a job, come aboard and be
  part of our mission to transform healthcare.
