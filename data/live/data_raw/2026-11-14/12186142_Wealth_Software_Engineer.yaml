description: |
  About Us

  Wealth.com is the industry's leading estate planning
  platform, empowering more than 1,000 wealth management firms
  to modernize the delivery of estate planning guidance to
  their clients. As the only tech-led, end-to-end platform
  built specifically for financial institutions, Wealth.com
  enables firms to drive scale, efficiency, and measurable
  client impact. Trusted by some of the largest names in
  finance, Wealth.com combines proprietary AI, robust
  security, and deep technological and legal expertise to
  serve the full range of client needs, from foundational
  plans to the most sophisticated estate strategies. The
  company has been widely recognized for innovation and
  leadership, winning Top Estate Planning Technology and Top
  Estate Planning Implementation at the 2025
  WealthManagement.com Industry Awards, being named the 2024
  Best Technology Provider in the Trust category, and earning
  #1 in estate planning market share in the 2025 Kitces
  AdvisorTech Study.

  Our team is fundamental to our standing as the leading
  estate planning platform. We cultivate a collaborative and
  supportive environment, fostering innovation and making
  Wealth.com a truly enjoyable workplace. Wealth.com is proud
  to be certified as a Great Place to Work for 2025.

  The Opportunity

  As a Software Engineer at Wealth.com, you will help design,
  build, and scale the backend systems powering our estate
  planning, tax planning, and AI-driven products used by tens
  of thousands of financial advisors and their clients. You'll
  work on a TypeScript-first stack alongside engineers who
  have shipped production software at scale, and you'll have
  significant ownership over the systems you build — from
  architecture and implementation through deployment,
  monitoring, and iteration.

  We're hiring across multiple product areas (estate planning,
  tax planning, Esther AI, platform/integrations) and will
  match strong engineers to the team where they're most
  excited to contribute.

  Your Responsibilities

  - Design, build, and operate backend services that power
    Wealth.com's products — including APIs, data pipelines,
    and integrations with enterprise wealth management
    platforms
  - Take features from spec through design, implementation,
    testing, deployment, and post-launch monitoring; own what
    you ship
  - Write production-grade TypeScript code with strong testing,
    observability, and operational discipline
  - Collaborate with product managers, designers, and other
    engineers to translate ambiguous problems into well-scoped
    technical solutions
  - Contribute to system design decisions around scalability,
    reliability, security, and performance
  - Participate in code review, technical design discussions,
    and on-call rotations as the team grows
  - Help shape engineering culture, tooling, and best practices
    as we scale the org

  Qualifications

  - 3+ years of professional software engineering experience
    shipping backend systems to production
  - Strong proficiency in TypeScript, or deep experience in
    another typed language (Java, Go, C#, Kotlin, Rust) with
    demonstrated ability to ramp quickly into TypeScript
  - Hands-on experience designing and operating systems at
    meaningful scale — handling real traffic, real data
    volumes, and real users
  - Solid grasp of backend fundamentals: API design (REST/gRPC),
    relational and NoSQL databases, messaging/event-driven
    systems, caching, and concurrency
  - Experience with cloud infrastructure (AWS, GCP, or Azure),
    containerization (Docker/Kubernetes), and modern CI/CD
    workflows
  - Production-grade operational mindset: logging, metrics,
    tracing, alerting, incident response, and a track record
    of supporting what you ship
  - Comfortable working in a fast-paced, ambiguous, startup
    environment where priorities shift and you're expected to
    drive your own work
  - Strong written and verbal communication; able to collaborate
    across product, design, and other engineering teams

  Bonus

  - Prior experience at an early or growth-stage startup,
    ideally one where you helped scale systems from early
    traction through significant growth
  - Experience in fintech, wealth management, or other regulated
    environments (compliance, audit, PII handling)
  - Background in AI/ML infrastructure, LLM-powered product
    development, or document processing (OCR, extraction
    pipelines)
  - Experience integrating with enterprise platforms used by
    financial institutions (custodians, CRMs, portfolio
    management systems)
  - Exposure to TypeScript ecosystem tools: Node.js, NestJS,
    tRPC, Prisma, PostgreSQL
  - Bachelor's degree in Computer Science, a related field, or
    equivalent practical experience

  Benefits & Perks

  - Competitive Salary.
  - Hybrid in the NYC Office (3x a week)
  - Excellent Medical, Dental, and Vision insurance options,
    with low-cost premium structures that demonstrate our
    commitment to offering great value to our employees.
  - 100% Company Paid Basic Life Insurance, Short Term and Long
    Term Disability
  - 100% Paid Parental Leave upon eligibility
  - Company equity managed through Carta.
  - 401k with Match and 100% vesting upon hire.
  - Flexible PTO in an environment where taking time off to
    relax or recharge is supported and encouraged.
  - Take time off for holidays—and yes, your birthday counts
    too. Celebrate, relax, and recharge without thinking
    twice.
  - Free estate planning for life!
