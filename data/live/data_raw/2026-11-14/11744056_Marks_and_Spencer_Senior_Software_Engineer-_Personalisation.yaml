description: |
  We’re looking for a Senior Software Engineer within the
  Personalised Search team to play a pivotal role in evolving
  M&S’s Identity Platform. This team provides the critical
  software capabilities that power authentication,
  authorisation, and identity management across M&S digital
  channels, enabling secure and seamless experiences for
  millions of customers and thousands of colleagues.

  Your “customers” are product teams, engineers, business
  stakeholders, and millions of M&S customers and colleagues
  and your mission is to enable them through secure, scalable
  platforms, resilient services, and exceptional engineering
  practices.

  This is a role for an engineer who is excited by building
  large-scale identity solutions, modernising authentication
  platforms, and delivering secure digital experiences that
  sit at the heart of every customer and colleague interaction
  with M&S.

  About the Team

  Our engineering teams enable product, engineering, and
  business teams to build and deliver digital experiences with
  speed and confidence. We create reliable, scalable, and
  secure platforms rooted in strong engineering standards,
  automation, and continuous improvement.

  You will join the Identity Platform team, responsible for
  the services and capabilities that manage authentication,
  authorisation, and user identity across the M&S ecosystem.

  What You'll Do

  Your key accountabilities will include:

  - Design, build, and evolve secure, scalable, and high-
    performance authentication and identity services used by
    millions of customers and colleagues.
  - Own features end-to-end, taking responsibility for solution
    design, development, testing, deployment, monitoring, and
    production support.
  - Help shape the technical direction of the Identity Platform,
    balancing customer experience, security, performance, and
    developer usability.
  - Develop resilient APIs and backend services that enable
    secure authentication, authorisation, and identity
    management capabilities across the organisation.
  - Champion engineering excellence through clean, maintainable,
    and well-tested code, helping establish best practices
    across teams.
  - Actively participate in code reviews, technical discussions,
    pair programming, and knowledge-sharing initiatives.

  Who You Are

  - A senior software engineer with significant experience
    building and operating large-scale distributed systems
    serving millions of users.
  - Strong experience with Java and/or Kotlin and modern backend
    development frameworks.
  - in designing and delivering secure, scalable services within
    cloud-native environments.
  - Strong understanding of DevOps principles, CI/CD pipelines,
    automation, and operational ownership.
  - Comfortable designing systems that balance security,
    usability, resilience, and performance.
  - Experience with identity and access management technologies,
    OAuth 2.0, OpenID Connect, or similar authentication
    standards is highly desirable.

  What’s in it for you

  Being a part of M&S is exactly that – playing your part to
  bring the magic of M&S to our customers every day. We’re an
  inclusive, dynamic, exciting, and ever-evolving business
  built on doing the right thing and bringing exceptional
  quality, value, service to every customer, whenever,
  wherever, and however they want to shop with us.

  Here are some of the benefits we offer that make working for
  M&S just that little bit more special.

  - After completing your probationary period, you’ll receive
    20% colleague discount across all M&S products and many of
    our third-party brands for you and a member of your
    household.
  - Competitive holiday entitlement with the potential to buy
    extra holiday days.
  - Discretionary bonus schemes awarded based on how you achieve
    your personal objectives and our performance as a
    business.
  - A generous Defined Contribution Pension Scheme and Life
    Assurance.
  - A dedicated welcome to our teams with a tailored induction
    and a wide range of training programmes to develop your
    skills.
  - Amazing perks and discounts via our M&S Choices portal to
    maximise your financial and personal wellbeing.
  - Industry-leading parental, adoption and neonatal policies,
    providing support and flexibility for your family.
  - Access to a fantastic range of wellbeing support for all
    colleagues including access to our 24/7 Virtual GP and PAM
    Assist to support you and your family.
  - A charity volunteer day to support a charity or cause you're
    passionate about through a dedicated day away from work.

  Everyone’s Welcome

  We are ambitious about the future of retail. We’re
  disrupting, innovating, and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet.

  Marks & Spencer strives to be an inclusive organisation,
  trusted and admired by our colleagues, customers, and
  suppliers.

  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and win
  together.

  If you’d benefit from any support or reasonable adjustments
  during any stage of the recruitment process, please let us
  know when completing your application.

