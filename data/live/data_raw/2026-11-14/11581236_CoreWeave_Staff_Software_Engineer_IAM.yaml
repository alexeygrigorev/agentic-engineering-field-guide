description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What you’ll do

  As a Staff Software Engineer on the Identity & Access
  Management (IAM) team, you will be a primary architect of
  CoreWeave’s IAM strategy as we rapidly expand the platform.
  You will leverage your deep expertise in identity systems to
  design, extend, and harden a platform that secures our high-
  performance cloud infrastructure. This is a high-impact
  leadership role where you will balance rapid execution with
  the long-term technical vision necessary to meet the demands
  of our global enterprise customers.

  About the role

  - Technical Strategy & Vision: Partner with Product and
    Engineering Leadership to translate complex requirements
    into a multi-year technical roadmap that balances
    immediate business needs with long-term architectural
    integrity
  - System Architecture: Lead the design and implementation of
    high-throughput, low-latency distributed systems for
    authentication and authorization across all CoreWeave
    services
  - Platform Evolution: Architect customer-facing experiences
    for identity lifecycle management, IdP integration
    (SAML/OIDC), and granular permissioning models
  - Engineering Excellence: Champion a security-first mindset
    across the organization, establishing rigorous standards
    for code quality, design reviews, and threat modeling
  - Operational Leadership: Elevate the team’s operational
    maturity by defining SLOs, enhancing deep-stack
    observability, and driving automation to eliminate
    systemic toil
  - Technical Mentorship: Act as a force multiplier by mentoring
    Senior engineers and fostering a culture of continuous
    learning and high-performance engineering
  - Cross-Functional Influence: Drive alignment on critical
    security initiatives across the broader engineering
    organization, articulating complex technical trade-offs to
    stakeholders

  Who you are

  - 8+ Years of Experience building and operating large-scale
    distributed systems in a production environment using one
    or more of Go, TypeScript, or React
  - 5+ Years of IAM Domain Expertise: Proven track record of
    developing identity products and a deep mastery of
    standards including OIDC, OAuth2.0, SAML, and JWT
  - Technical Leadership: Demonstrated experience leading large,
    cross-functional projects from inception to planet-scale
    deployment with measurable business impact
  - Cloud-Native Mastery: Deep understanding of Kubernetes,
    microservices architecture at scale, and advanced CI/CD
    patterns
  - Enterprise Security Acumen: Solid knowledge of the security,
    compliance (SOC2, HIPAA, etc.), and governance needs of
    sophisticated enterprise customers
  - Strategic Communication: Superb ability to synthesize
    ambiguous requirements into clear technical designs and
    communicate trade-offs to both executive and technical
    audiences
  - Analytical Problem Solving: Expert-level ability to debug
    complex, intermittent issues within distributed
    environments

  Preferred

  - Architectural Transformation: Experience leading the
    decomposition of monolithic architectures into high-
    performance microservices
  - AI-Augmented Development: Familiarity with leveraging AI
    agents (e.g., Claude, Cursor) to accelerate the software
    development lifecycle
  - Emerging Tech Knowledge: Familiarity with AI/ML workloads,
    GPU-based infrastructure, and the unique security
    challenges of MLOps at scale
  - Policy-as-Code: Experience with modern authorization
    frameworks such as Open Policy Agent (OPA) or Cedar

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You love to solve complex problems and build high-scale,
    low-latency distributed systems.
  - You’re curious about how to evolve cloud platforms and scale
    infrastructure globally for the next generation of AI
    workloads.
  - You’re an expert in one or more preferred programming
    languages (Go, TypeScript, Python), and have deep
    technical knowledge of distributed systems.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $188,000 to $275,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

