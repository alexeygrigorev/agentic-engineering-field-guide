description: |
  Blockstream was founded in 2014 by Dr. Adam Back and a group
  of fellow cryptographers and engineers passionate about
  Bitcoin and its potential to change the future of finance.
  Focusing on building fundamental Bitcoin infrastructure,
  Blockstream quickly grew into one of the leading technology
  power houses of the industry.

  At Blockstream, we’re building solutions on Bitcoin that
  will disrupt the existing financial system. We imagine a
  world where individuals and businesses can easily access a
  global, permissionless system to secure their money, use it
  every day, and invest it or put it to work. In pursuit of
  our expansive vision, we’ve built a full stack of innovative
  products on top of the Bitcoin protocol, from layer-2
  projects like Liquid and Core Lightning, to end-user
  software and hardware wallets like Green and Jade. Our brand
  stands for innovation in the Bitcoin community, and we’re
  growing our team to accelerate the future.

  Blockstream is looking for Software Engineers to work on our
  enterprise custody solution. You’ll design and maintain
  scalable end-to-end systems that serve APIs and SDKs, and
  work on everything from database architecture to cloud-based
  deployments.

  What You’ll Be Doing (Responsibilities):

  - Design, develop, and maintain scalable end-to-end systems
    that serve APIs and SDKs.
  - Full stack software development, from database architecture
    to cloud-based deployment.
  - Optimize system performance and security to support high-
    availability applications.
  - Collaborate with cross-functional teams, including front-end
    developers, product managers, and hardware engineers to
    deliver seamless solutions.
  - Implement best practices in software development, including
    CI/CD, automated testing, and code reviews.
  - Research and integrate emerging technologies to enhance
    security and system efficiency.
  - Troubleshoot and resolve complex software issues in a fast-
    paced development environment.
  - Mentor junior developers and contribute to team knowledge-
    sharing efforts.

  What We Look For In You (Required Qualifications):

  - 5+ years of experience in full-stack software development,
    with a focus on backend engineering.
  - Proficiency in backend technologies such as C++, Python,
    Rust, Node.js.
  - Strong experience in designing and building RESTful APIs and
    SDKs.
  - Hands-on experience with cloud platforms (AWS, Azure, GCP)
    and containerization (Docker, Kubernetes).
  - Deep understanding of database technologies, including SQL
    (PostgreSQL, MySQL) and NoSQL (MongoDB, Redis).
  - Familiarity with authentication and security best practices,
    including OAuth, JWT, encryption, and access control.
  - Experience with CI/CD pipelines, automated testing, and
    DevOps tools.
  - Strong problem-solving skills and ability to work
    independently or as part of a team.
  - Excellent communication skills, with the ability to explain
    technical concepts to non-technical stakeholders.

  Nice To Haves (Preferred Qualifications):

  - Experience with Bitcoin, blockchain technology, or
    cryptography.
  - Open-source software development experience.
  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field (or equivalent
    experience).
  - Experience with system/software architecture.



  🔒 Stay Safe from Job Scams All official Blockstream
  communication will come from an @blockstream.com email
  address. We will never ask you to share sensitive
  information or purchase equipment during the hiring process.
  If in doubt, contact us at hr@blockstream.com. Learn more
  about avoiding job scams here.
