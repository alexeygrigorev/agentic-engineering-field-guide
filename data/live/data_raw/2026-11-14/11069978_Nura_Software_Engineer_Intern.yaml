description: |
  Nura is the AI intelligence layer for real estate. We're
  helping America build more. We are backed by Afore Capital
  and angels from top real estate and financial institutions.
  We're a team of engineers building the infrastructure for
  how America finances and develops real estate.

  The Role:

  At Nura, we build products that sit at the center of how
  developers and lenders analyze deals. Our users range from
  real estate developers underwriting their next project to
  banks screening hundreds of loan requests. They rely on our
  platform to understand what can be built, whether a deal
  pencils, and how to move faster than their competition.

  You'll sit at the intersection of engineering, product, and
  customers. You will translate messy real-world problems into
  clear technical solutions, make high-impact decisions under
  real constraints, and work directly with founders and
  customers to build products that close six-figure deals.

  We move fast and ship constantly. You'll own what you build.

  About the Role:

  - High-ownership environment with direct customer exposure
  - Close collaboration with founders and customers
  - Your code ships to production, not to a backlog
  - Potential to convert to full-time

  What Makes You a Good Fit:

  - Comfortable across the stack: React/TypeScript on frontend,
    Node.js or Python on backend
  - Experience with web scraping, unstructured data, or PDF
    parsing
  - Familiarity with LLMs and building AI-powered features
  - Comfortable with AWS or similar cloud environments
  - Experience building production systems with real paying
    users

  Bonus Points:

  - Experience with web scraping, unstructured data, or PDF
    parsing
  - Familiarity with LLMs and building AI-powered features
  - Experience with AWS or similar cloud environments
  - Familiarity with geospatial data, mapping, or real estate
  - Prior work scraping or parsing messy public data sources

  Come help shape how America gets built.
