description: |
  Meet the Team

  The Cisco Common Platform Services (CCPS) organization is
  transforming how Cisco delivers software-as-a-service by
  providing a modern, consistent, and secure platform for all!
  With demonstrated ability, our distributed team brings
  innovative methodologies to building and managing hybrid
  cloud environments. We focus on platform management
  services, continuously evaluating infrastructure and
  operations to ensure efficiency and precision. Our expertise
  in IaaS and PaaS, combined with repeatable and portable
  delivery models, enables the rapid and secure deployment of
  applications.

  Within CCPS, the Cloud Software & Solutions (CSS) group
  designs and develops OpenStack and Kubernetes platform
  solutions with an emphasis on quality, stability,
  simplification, user experience, scalability, performance,
  and portability. We are looking for a Software Engineer to
  join our team and build scalable cloud-native applications
  and services.

  Your Impact

  - Design and build foundational capabilities of the
    cloud‑native ecosystem, with a focus on Kubernetes layers
    and the underlying infrastructure.
  - Develop and maintain automation and tooling for Kubernetes
    cluster lifecycle management, configuration, and upgrades.
  - Develop and enhance platform components that support
    Kubernetes networking, storage, security, and resource
    management.
  - Collaborate closely with SRE, security, networking and
    application teams to deliver robust and scalable platform
    capabilities.
  - Leverage AI‑assisted engineering tools to improve
    productivity, code quality, and troubleshooting
    efficiency.
  - Participate in on‑call rotations, incident response, and
    post‑incident reviews to ensure platform reliability.

  Minimum Qualifications

  - 4+ years of experience in software development or
    cloud/platform engineering roles.
  - Strong proficiency in Go (Golang) or Python
  - Experience with Kubernetes and cloud‑native technologies.
  - Experience with Infrastructure as Code and automation tools
    (e.g., Terraform).
  - Experience with at least one major public cloud platform
    (AWS, Azure, or GCP).
  - Experience using AI‑assisted tools to improve engineering
    efficiency and quality.
  - Experience with observability tools (Prometheus, Grafana,
    OpenTelemetry).

  Preferred Qualifications

  - Experience with large‑scale or multi‑tenant Kubernetes
    clusters.
  - Familiarity with OpenStack in private or hybrid cloud
    environments.
  - Experience with testing frameworks and test‑driven
    development practices.
  - Understanding security scanning, vulnerability management,
    and compliance frameworks (e.g., SOC 2, PCI‑DSS, GDPR).
  - Experience with CI/CD, GitOps, or developer platform
    enablement.

  Collabhiring

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
