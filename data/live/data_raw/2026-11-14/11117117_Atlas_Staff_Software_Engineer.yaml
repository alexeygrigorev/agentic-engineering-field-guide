description: |
  Atlas HXM is the global workforce platform built on
  compliance. We help companies determine how to engage each
  member of their workforce and then execute with
  accountability built in — direct Employer of Record (EOR),
  Agent of Record (AOR), payroll, and compliance capabilities
  backed by a decade of practitioner-led expertise. Recognized
  as a category Leader by NelsonHall and Everest Group, Atlas
  HXM builds Human Experience Management into everything we
  do, guided by our "For People, by People" principle.

  The future of work is borderless, and so are we. Our people
  are located around the globe — in the U.S., the UK, India,
  Colombia, China, and beyond. Diversity and belonging are not
  just values; they are who we are.

  We are also committed to making a positive impact. Through
  our Environment, Social, and Governance (ESG) impact
  initiative, we are addressing our environmental footprint
  and promoting social responsibility. Our impact program is
  central to our vision and culture, focusing on employee
  wellness, diversity, charitable work, and ethical corporate
  governance.

  Staff Software Engineer (Product)

  We’re looking for a Staff Software Engineer (Product) to
  help shape the technical evolution of our product. This is a
  senior individual contributor role focused on building high-
  quality product systems, making sound technical decisions,
  and supporting other engineers through collaboration and
  example.

  This role is hands-on and does not involve people
  management. You’ll work closely with engineers, Product, and
  Design to deliver meaningful customer value while keeping an
  eye on long-term maintainability and quality.



  What You’ll Do

  - Design and build complex, customer-facing product features
    and systems
  - Take ownership of technical decisions within a product area
    or initiative
  - Work closely with Product and Design to shape practical,
    scalable solutions
  - Contribute to architectural discussions and technical
    direction across teams
  - Maintain a high bar for code quality through reviews and
    shared standards
  - Support and mentor other engineers through collaboration and
    knowledge sharing
  - Participate in production support and help resolve incidents
    when needed



  What We’re Looking For

  We’re looking for an experienced engineer who is comfortable
  working with autonomy, navigating ambiguity, and influencing
  outcomes through clear thinking and collaboration.

  - Strong experience building and maintaining production
    software
  - Experience designing and delivering complex systems or
    features end to end
  - Solid background in modern web application development
  - Experience with TypeScript and React, or similar modern
    frontend technologies
  - Backend experience with Node.js and/or .NET (C#)
  - Experience working in a cloud environment (Azure preferred,
    but not required)
  - Familiarity with API design, data modelling, and system
    boundaries
  - Clear communication skills and a thoughtful, collaborative
    approach

  We don’t expect deep expertise in every area. Strength in
  some areas and working knowledge in others is absolutely
  fine.



  Technical Environment (High Level)

  You’ll work across much of our stack, with flexibility to
  lean into your strengths.

  - Frontend: React, TypeScript, modern UI patterns
  - Backend: Node.js and/or .NET services
  - Data: Relational databases (e.g. Postgres, Azure SQL, or
    similar)
  - Cloud: Microsoft Azure and standard cloud tooling

  Experience with infrastructure as code, performance
  optimisation, or AI-enabled features is a plus, but not
  required.



  Nice to Have

  - Experience in B2B SaaS or complex product environments
  - Exposure to regulated, security-conscious, or enterprise
    systems
  - Experience contributing to cross-team technical initiatives
  - Interest in mentoring and supporting other engineers

  Final Note

  We value good judgment, pragmatic engineering, and
  collaboration over exhaustive checklists. If this role
  sounds broadly aligned with your experience, we’d be happy
  to hear from you—even if you don’t meet every requirement.



  This position description may not describe all duties,
  responsibilities, and skills associated with this position.
  It is intended to portray the major aspects of the job.
  Other duties or skills may be required.

  What We Offer

  - The opportunity to work with a purpose — simplifying global
    expansion across borders and cultures
  - A diverse and inclusive environment
  - Country-specific benefits
  - Flexible PTO
  - Your birthday off and a day for you to volunteer and give
    back to the organization of your choice
  - Generous Parental Leave Program
  - Growth and development opportunities with access to a top
    learning content provider
  - The opportunity to challenge yourself in a high-performing
    organization and leave each day knowing you have made an
    impact.

