description: |
  Who we are:  Through a partnership-based approach, Coterie
  helps insurance professionals unlock untapped revenue in the
  small commercial space. With an innovative quoting platform
  that delivers accurate pricing and bindable quotes in less
  than one minute, Coterie makes small business insurance
  effortless. We are on a mission to build and foster a world-
  class team to bring speed, simplicity, and service to
  commercial insurance. We value integrity, humility, passion,
  and intelligence. If you want to push yourself and reshape a
  $200B+ market, we’re excited to talk to you!

  What will the Sr Software Engineer (Backend) do?

  The Senior Software Engineer is responsible for leading the
  design, development, and maintenance of complex software
  systems that support organizational goals. This role
  provides technical direction, contributes to architectural
  decisions, and ensures the quality, scalability, and
  performance of engineering solutions. The Senior Software
  Engineer mentors team members, drives continuous
  improvement, and collaborates with cross-functional
  stakeholders to deliver reliable and efficient software
  aligned with business needs. All engineers are granted a
  Claude Code premium license and are encouraged to leverage
  AI in their work

  Key Responsibilities:

  - Designs and implements complex systems; mentors others
  - Owns end-to-end delivery of significant features
  - Ensures code quality, scalability, and maintainability
  - Influences technical direction and team practices.

  Required Qualifications:

  - 5+ years software engineering experience
  - 5+ years working in the insurance industry
  - 5+ years building production ready APIs in C# with .NET 5+
  - Experience working within a micro-services architecture in a
    containerized environment.
  - Experience working with cloud-based SQL and NoSQL Databases,
    and other cloud-based services to build scalable
    applications.
  - Experience using Git and GitHub to collaborate and review
    code.
  - Experience writing Unit tests and automated integration
    tests (Postman or equivalent)

  - Strong problem-solving skills with the ability to debug
    issues and improve system performance.
  - Collaborates effectively with cross-functional teams and
    participates in code reviews.
  - Willingness to learn new technologies and contribute to
    continuous improvement.

  Our interview process:

  Our hiring process generally consists of 4 phases. The goal
  is to provide an opportunity for us to learn more about our
  candidates while allowing them to get to know us as well!

  - Phase 1: Qualified candidates will first meet with a member
    of our People Operations team for a phone interview.  This
    discussion is a high-level conversation to understand more
    about your background and interests and for us to share
    more about Coterie and the position.
  - Phase 2: Selected candidates will be invited to meet with
    our Hiring Manager for a 2nd interview via Teams video.
    This interview is designed to be more detail oriented and
    allows you to learn more about the role and expected to be
    30 minutes in length.
  - Phase 3: Top candidates will be invited to interview with
    members of our engineering team via Teams video. This
    series will include participating in live coding
    exercise/discussion. This series is expected to be 2 hours
    in length.
  - Phase 4: Final candidates will receive an invite to
    interview with our CTO. This video interview is expected
    to be 30 minutes in length.

  What's in it for you:

  Coterie has excellent benefits for all full-time employees.
  We offer the following:

  - 100% remote
  - Health insurance through Aetna (we pay 100% of premiums)
  - Dental and vision insurance through Guardian (we pay 100% of
    premiums)
  - Basic life insurance (we pay 100% of premiums)
  - Access to flexible spending account (FSA) or health savings
    account (HSA) (for those using HSA eligible plans)
  - 401K plan (up 4% match with immediate vest). Must be 21
    years of age or older to participate
  - Flexible PTO policy offering employees up to 4 weeks of PTO
    in their first 12 months. Thereafter, PTO usage aligns
    with company standards and typically does not exceed 5
    weeks per calendar year.
  - 12 company-paid holidays each year
  - Continuing education annual stipend
  - Annual salary estimated between $140,000-$165,000 based on
    national data. Candidates who meet all the minimum
    requirements and possess additional relevant experience,
    as outlined in the job description, may be considered for
    a salary above the midpoint of the above range. Salary is
    based on internal equity; internal salary ranges; market
    data/ranges; applicant’s skills; prior relevant
    experience; degrees or certifications, etc.

  Work Authorization: At this time, Coterie Insurance is
  unable to consider candidates who require current or future
  visa sponsorship. Applicants must have authorization to work
  in the United States without the need for sponsorship now or
  in the future. Falsification of an application, including
  work authorization status, is immediate grounds for
  dismissal from consideration.
