description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You'll Do:

  Prime Systems & Services builds and operates internal
  Kubernetes platforms and foundational infrastructure
  services that CoreWeave depends on. We are a new team
  focused on making these systems reliable, scalable, and easy
  to operate. Our work combines Kubernetes, software, systems,
  and reliability engineering to improve how infrastructure is
  deployed, changed, and supported at scale.

  About the role:

  We are seeking an Engineering Manager to build and lead a
  team of infrastructure and systems engineers. You will have
  the opportunity to shape the team from its earliest stage
  and translate an evolving charter into a clear, sustainable
  operating model. In partnership with technical leadership,
  you will establish how the team delivers, operates, and
  grows while remaining accountable for its people,
  priorities, and outcomes.

  In this role, you will:

  - Lead and develop a high-performing team of infrastructure
    engineers.
  - Set clear priorities, roadmaps, ownership, and measures of
    success.
  - Define clear decision-making, escalation, and on-call
    practices as the team grows.
  - Partner with technical leaders to guide architecture and
    deliver reliable infrastructure and automation.
  - Establish strong practices for testing, observability, safe
    changes, incident response, and on-call.
  - Use operational and delivery data to identify risks and
    guide investment.
  - Resolve cross-team dependencies and create a culture of
    accountability, collaboration, and continuous improvement.

  Who You Are:

  - You have 6+ years of experience in software, infrastructure,
    platform, SRE, or production engineering, including people
    leadership.
  - You have managed engineers responsible for production
    systems with meaningful reliability requirements.
  - You have experience with Kubernetes, distributed systems,
    and cloud infrastructure.
  - You have improved operational practices such as on-call,
    SLOs, observability, incident response, or change
    management.
  - You have turned ambiguous ownership or cross-team
    dependencies into clear plans and delivered outcomes.
  - You can guide technical tradeoffs and work effectively with
    senior engineers without becoming the team's sole
    architect.
  - You have experience hiring, coaching, managing performance,
    and communicating priorities and risks to technical teams
    and senior leaders.

  Preferred:

  - Experience building a new engineering team or platform
    function.
  - Experience operating Kubernetes at scale or on bare metal.
  - Familiarity with infrastructure automation, GitOps, and
    progressive delivery.
  - Experience leading teams with both development and
    operational responsibilities.

  Wondering if you're a good fit?

  We value diverse experiences and do not expect candidates to
  match every qualification. If you enjoy developing
  engineers, creating clarity, and building dependable
  infrastructure organizations, we would love to talk.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast! We're
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We're not afraid of a little chaos, and
  we're constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $182,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

