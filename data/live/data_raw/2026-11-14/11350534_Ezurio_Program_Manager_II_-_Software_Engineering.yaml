description: |
  The Program Manager II - Software Engineering leads the
  planning and delivery of custom embedded software, firmware,
  and connectivity stacks that run on Ezurio's Wi-Fi Radios,
  System-on-Modules (SOMs) and Single Board Computers (SBCs).
  These multi-discipline software programs — spanning radio
  firmware, board support packages, drivers, middleware,
  cloud/edge connectivity, and customer application enablement
  — require disciplined project management from concept
  through release and long-term support. Working with Product
  Management, and Engineering teams you will be an experienced
  user of Atlassian tools (Jira, Confluence, Jira Product
  Discovery), and extensions such as BigPicture, Eazy Bi,
  Tempo, bringing hands-on experience managing embedded
  software development programs in an electronics design
  environment. Both internal and customer-facing projects are
  scoped; strong stakeholder management and customer-facing
  communication skills are essential. This role is preferably
  based in hybrid work arrangement in Akron, Ohio. Remote
  candidates will also be considered. Legal authorization to
  work in the US is required.

  RESPONSIBILITIESProgram & Project Management

  - Own end-to-end program management for custom
    software/firmware co-development programs, from project
    initiation through production release and sustaining
    support.
  - Define, plan, and maintain detailed project schedules,
    release plans, and financial budgets in alignment with
    customer commitments and internal targets.
  - Simultaneously manage priorities, direction, and resource
    allocation across all active software programs.
  - Identify, track, and proactively mitigate project risks;
    escalate issues with clear options and recommendations.
  - Manage cost targets as established by Senior Management,
    tracking actuals against budget throughout the software
    development lifecycle.

  Atlassian Toolset & Reporting

  - Stand up, configure, and maintain all projects within the
    Atlassian toolset (Jira, Confluence, BigPicture, Tempo).
  - Maintain accurate, up-to-date project plans, project boards,
    and associated collateral in line with Ezurio engineering
    process requirements.
  - Assist in the maintenance, development and improvement of
    Jira tools and processes using Jira automation, Script
    Runner, Eazy Bi (MDX) and Power Bi (Power Query & DAX)
  - Generate and present weekly snapshot reports for both
    internal stakeholders and external customers.
  - Produce and present program status reports to the Senior
    Leadership Team (SLT), including schedule health, budget
    variance, and key risks.

  Cross-Functional & Customer Collaboration

  - Serve as the primary project management interface for
    customers throughout the software co-development
    lifecycle, ensuring clear communication on scope,
    schedule, and deliverables.
  - Lead and coordinate globally distributed engineering teams
    spanning embedded software, firmware, cloud, QA/test, and
    hardware disciplines.
  - Partner with department heads to manage shared engineering
    resources across multiple concurrent software programs.
  - Coordinate activities between software engineering, hardware
    engineering, manufacturing, and quality to meet product
    development requirements and customer commitments.

  Process & Quality

  - Generate and facilitate documentation in accordance with
    Ezurio engineering procedures and quality standards.
  - Adhere to and support quality and safety systems and
    standards, including secure software development and
    release practices, across all managed programs.
  - Contribute to the continuous improvement of project
    management and software delivery practices within the
    Custom SOM & SBC group.

  REQUIREMENTS

  - High-level proficiency in Atlassian tools - Jira,
    Confluence, and BigPicture (or equivalent extension),
    Tempo, Script Runner and Jira Automation; ability to
    configure and administer projects from scratch.
  - Strong command of project financial management: budgeting,
    forecasting, variance tracking, and cost reporting.
  - Excellent cross-functional communication skills, written and
    verbal, with demonstrated ability to manage engineering
    and customer relationships at a technical level.
  - Proven ability to manage multiple software development
    programs simultaneously in a fast-paced, globally
    distributed environment.
  - Strong analytical skills; ability to build and use tools to
    synthesize project data into actionable reporting.
  - Deep understanding of cross-functional interdependencies in
    embedded software product development, from architecture
    through release and customer hand-off.
  - Exceptional attention to detail and time management
    discipline.
  - Working knowledge of embedded software development
    processes: Agile/Scrum or Kanban delivery, code review and
    CI/CD pipelines, and release/version management.
  - Familiarity with embedded Linux, RTOS, and wireless
    connectivity stacks (e.g., Wi-Fi, Bluetooth, Cellular) is
    strongly preferred.
  - Understanding of the technical considerations specific to
    custom SOM/SBC software co-development programs, including
    board support packages and driver bring-up.
  - Proficiency in Microsoft Excel and data analysis tools for
    financial and schedule tracking.

  EDUCATION/EXPERIENCE

  - Bachelor’s degree in Computer Science, Software Engineering,
    or a related technical field. Equivalent professional
    experience considered in lieu of degree.
  - 5+ years of program or project management experience in an
    electronics design environment - embedded software or
    firmware development experience required.
  - Direct experience managing customer co-development programs
    (NRE-based or joint development agreements) is strongly
    preferred.
  - Experience with NXP i.MX, TI, or similar embedded processor
    platforms, and their associated software/BSP ecosystems,
    and wireless certifications is a plus.



