description: |
  Manager, Software Development Engineering, CoCounsel FDE
  Product Development | CoCounsel Forward Deployed Engineering

  What if you could shape the future of legal AI while leading
  a team of engineers embedded directly with customers to
  solve their most complex problems? At Thomson Reuters, we're
  redefining how professionals interact with the law through
  CoCounsel, our generative AI legal assistant, and we're
  looking for a technically strong, people-focused leader to
  guide our Forward Deployed Engineering (FDE) team as we
  scale AI-powered solutions across the legal industry.

  As Manager, Software Development Engineering for CoCounsel
  FDE, you will provide technical leadership and people
  management for engineers embedded in customer-facing
  initiatives, translating ambiguous, real-world problems into
  scalable AI/ML solutions. You'll balance hands-on technical
  guidance with strategic influence, ensuring your team
  delivers high-quality, secure, and reusable AI components
  while growing as engineers and professionals.

  About the Role

  In this opportunity as Manager, Software Development
  Engineering, CoCounsel FDE, you will:

  - Lead and support multiple cross-functional Forward Deployed
    Engineering project teams, ensuring efficient and
    effective execution while resolving issues as they arise
  - Architect and guide the design of scalable, secure
    AI/software solutions, applying deep knowledge of software
    and AI system architecture to complex, end-to-end AI/ML
    development across the software development lifecycle
  - Drive innovation by evaluating and adopting emerging AI
    methodologies, influencing enterprise-wide MLOps and
    LLMOps practices, and setting strategy for testing, AI
    monitoring, and debugging at the platform level
  - Manage and develop talent through hiring, performance
    management, coaching, and mentoring of engineers,
    fostering a culture of technical growth and high
    performance
  - Translate business needs into AI solutions by communicating
    and coordinating with project teams, partners, and
    stakeholders, and by championing thought leadership that
    promotes reusable, consistent AI frameworks and patterns
  - Own technical delivery across multiple projects and
    products—including large-scale AI/ML initiatives—by
    removing impediments, guiding project leads, and managing
    budgets where applicable
  - Build a customer-aware, high-performing team culture,
    ensuring close collaboration with Product, Project
    Management, and Technical Operations to deliver impactful,
    prioritized work

  About You

  You're a fit for the role of Manager, Software Development
  Engineering, CoCounsel FDE if your background includes:

  - 10+ years in software/solutions engineering, including 2+
    years in a formal or informal people-management or team-
    lead capacity, while remaining technically hands-on rather
    than purely administrative.
  - Team leadership experience — you've led and grown a team of
    forward-deployed, field, or solutions engineers, with
    direct accountability for hiring, performance management,
    career development, and team structure.
  - Sustained customer-facing experience — running discovery
    sessions, presenting architecture, defending technical
    decisions, and building trust with both technical and non-
    technical stakeholders (GCs, IT leaders, innovation
    teams).
  - A track record of scoping, building, and demoing rapid POCs
    and pilots against ambiguous or evolving requirements, and
    turning what you learn into repeatable patterns your team
    can execute on.
  - Strong Python development skills, plus hands-on AWS
    expertise (Bedrock AgentCore, CDK, EKS, ECR) and ownership
    of CI/CD pipelines (Docker, SQL/Flyway migrations, Cumulus
    or similar enterprise deployment platforms).
  - Direct ownership of building and deploying LLM-powered
    agents (Anthropic Claude or similar) — from requirements
    gathering and solution design through implementation,
    integration, and production hand-off — including backend,
    frontend, agent guardrails/security design, evaluation
    frameworks and scorecard-based quality testing, and
    production observability (e.g., Datadog), and infra.
  - Comfort operating at the intersection of Product,
    Engineering, Sales, and Customer Success, translating
    customer-specific technical work into structured feedback
    that shapes the core CoCounsel product roadmap.
  - Familiarity with the legal industry or legal tech (e.g.,
    document review, contract lifecycle, legal research) is a
    strong plus, given the domain-specific nature of customer
    requirements.

  #LI-GK1

  This posting is for proactive recruitment purposes and may
  be used to fill current openings or future vacancies within
  our organization.

  What’s in it For You?

  - Hybrid Work Model: We’ve adopted a flexible hybrid working
    environment for our office-based roles while delivering a
    seamless experience that is digitally and physically
    connected.
  - Flexibility & Work-Life Balance: Flex My Way is a set of
    supportive workplace policies designed to help manage
    personal and professional responsibilities, whether caring
    for family, giving back to the community, or finding time
    to refresh and reset. This builds upon our flexible work
    arrangements, including work from anywhere for up to 8
    weeks per year, empowering employees to achieve a better
    work-life balance.
  - Career Development and Growth: By fostering a culture of
    continuous learning and skill development, we prepare our
    talent to tackle tomorrow’s challenges and deliver real-
    world solutions. Our Grow My Way programming and skills-
    first approach ensures you have the tools and knowledge to
    grow, lead, and thrive in an AI-enabled future.
  - Industry Competitive Benefits: We offer comprehensive
    benefit plans to include flexible vacation, two company-
    wide Mental Health Days off, access to the Headspace app,
    retirement savings, tuition reimbursement, employee
    incentive programs, and resources for mental, physical,
    and financial wellbeing.
  - Culture: Globally recognized, award-winning reputation for
    inclusion and belonging, flexibility, work-life balance,
    and more. We live by our values: Obsess over our
    Customers, Compete to Win, Challenge (Y)our Thinking, Act
    Fast / Learn Fast, and Stronger Together.
  - Social Impact: Make an impact in your community with our
    Social Impact Institute. We offer employees two paid
    volunteer days off annually and opportunities to get
    involved with pro-bono consulting projects and
    Environmental, Social, and Governance (ESG) initiatives.
  - Making a Real-World Impact: We are one of the few companies
    globally that helps its customers pursue justice, truth,
    and transparency. Together, with the professionals and
    institutions we serve, we help uphold the rule of law,
    turn the wheels of commerce, catch bad actors, report the
    facts, and provide trusted, unbiased information to people
    all over the world.

  Our use of AI within the recruitment process Thomson Reuters
  utilizes Artificial Intelligence (AI) to support parts of
  our global recruitment process. Unless you opt-out, our AI
  system will assess the information provided by you and
  compare it to the requirements listed for the role, and
  present the result to our recruitment personnel for further
  review. The AI system acts as a supporting tool, but there
  is always a human making the decision if you will be
  considered for the role.

  In the United States, Thomson Reuters offers a comprehensive
  benefits package to our employees. Our benefit package
  includes market competitive health, dental, vision,
  disability, and life insurance programs, as well as a
  competitive 401k plan with company match. In addition,
  Thomson Reuters offers market leading work life benefits
  with competitive vacation, sick and safe paid time off, paid
  holidays (including two company mental health days off),
  parental leave, sabbatical leave. These benefits meet or
  exceeds the requirements of paid time off in accordance with
  any applicable state or municipal laws. Finally, Thomson
  Reuters offers the following additional benefits: optional
  hospital, accident and sickness insurance paid 100% by the
  employee; optional life and AD&D insurance paid 100% by the
  employee; Flexible Spending and Health Savings Accounts;
  fitness reimbursement; access to Employee Assistance
  Program; Group Legal Identity Theft Protection benefit paid
  100% by employee; access to 529 Plan; commuter benefits;
  Adoption & Surrogacy Assistance; Tuition Reimbursement; and
  access to Employee Stock Purchase Plan.

  Thomson Reuters complies with local laws that require
  upfront disclosure of the expected pay range for a position.
  The base compensation range varies across locations.

  Eligible office location(s) for this role include one or
  more of the following: New York City, San Francisco, Los
  Angeles, and/or Irvine, CA; McLean, VA; Washington, DC. The
  base compensation range for the role in any of those
  locations is $136,000 USD - $253,000 USD. For any eligible
  US locations, unless otherwise noted, the base compensation
  range for this role is $118,400 USD - $219,800 USD. For
  Ontario, Canada, the base compensation range for this role
  is $140,600 CAD - $190,600 CAD.

  Base pay is positioned within the range based on several
  factors including an individual’s knowledge, skills and
  experience with consideration given to internal equity. Base
  pay is one part of a comprehensive Total Reward program
  which also includes flexible and supportive benefits and
  other wellbeing programs. This role may also be eligible for
  an Annual Bonus based on a combination of enterprise and
  individual performance.

  About Us

  Thomson Reuters informs the way forward by bringing together
  the trusted content and technology that people and
  organizations need to make the right decisions. We serve
  professionals across legal, tax, accounting, compliance,
  government, and media. Our products combine highly
  specialized software and insights to empower professionals
  with the data, intelligence, and solutions needed to make
  informed decisions, and to help institutions in their
  pursuit of justice, truth, and transparency. Reuters, part
  of Thomson Reuters, is a world leading provider of trusted
  journalism and news.

  We are powered by the talents of 26,000 employees across
  more than 70 countries, where everyone has a chance to
  contribute and grow professionally in flexible work
  environments. At a time when objectivity, accuracy,
  fairness, and transparency are under attack, we consider it
  our duty to pursue them. Sound exciting? Join us and help
  shape the industries that move society forward.

  As a global business, we rely on the unique backgrounds,
