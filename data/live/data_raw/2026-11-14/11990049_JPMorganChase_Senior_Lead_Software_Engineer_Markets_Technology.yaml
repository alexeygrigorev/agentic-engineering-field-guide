description: |
  Be an integral part of an agile team that's constantly
  pushing the envelope to enhance, build, and deliver top-
  notch technology products.


   As a Senior Lead Software Engineer at JPMorganChase within
  the CIB – Markets Technology, you are an integral part of an
  agile team that works to enhance, build, and deliver trusted
  market-leading technology products in a secure, stable, and
  scalable way. Drive significant business impact through your
  capabilities and contributions, and apply deep technical
  expertise and problem-solving methodologies to tackle a
  diverse array of challenges that span multiple technologies
  and applications.


  Job responsibilities



  - Accountable for all aspects of 1+ technical components
    including design, code quality, stability, scalability,
    stability, compliance, vulnerabilities, etc
  - Partners with the business aligned teams and other engineers
    contributing to the components to support new change
    requests and requirements
  - Drives decisions that influence the product design,
    application functionality, and technical operations and
    processes
  - Serves as a function-wide subject matter expert in one or
    more areas of focus
  - Develops secure and high-quality production code, and
    reviews and debugs code written by others
  - Actively contributes to the engineering community as an
    advocate of firmwide frameworks, tools, and practices of
    the Software Development Life Cycle



   Required qualifications, capabilities, and skills

  - Proven leadership delivering end-to-end, complex initiatives
    spanning multiple applications and workflows, with
    experience managing teams directly and/or leading through
    influence in a matrixed environment
  - Advanced proficiency in Java incl hands-on technical coding
    knowledge — actively codes and can demonstrate sound
    architecture, design, coding standards, and resiliency
    practices (these will be a major focus during interviews).
  - Excellent communication skills — able to clearly articulate
    technical concepts to engineers and provide crisp,
    executive-ready updates to senior stakeholders
  - Demonstrated conflict resolution and stakeholder negotiation
    skills



  - Proven experience enabling responsible use of approved AI-
    assisted dev tools, setting standards to validate outputs
    (correctness, performance, security/resiliency), and
    coaching engineers on data sensitivity and secure
    handling.
  - Practical enterprise-scale experience incl designing and
    running on cloud platforms

