description: |
  At Ripple, we’re building a world where value moves like
  information does today. It’s big, it’s bold, and we’re
  already doing it. Through our crypto solutions for financial
  institutions, businesses, governments and developers, we are
  improving the global financial system and creating greater
  economic fairness and opportunity for more people, in more
  places around the world. And we get to do the best work of
  our career and grow our skills surrounded by colleagues who
  have our backs.

  If you’re ready to see your impact and unlock incredible
  career growth opportunities, join us, and build real world
  value.

  THE WORK:

  Join the Ripple Treasury Payments team in London! We build
  the payment workflows clients use to create, approve and
  release payments in bank formats like ISO 20022. Ripple
  Treasury facilitates over $13 trillion in payments a year,
  for clients from small businesses to the Fortune 500. Every
  payment is value moving the way Ripple believes it should.

  You’ll work with C# / .NET 8, Azure, SQL Server, React and
  TypeScript, and help modernise a large .NET Framework
  codebase. AI tools are part of how we work every day.

  WHAT YOU’LL DO:

  - Take ownership of a core payment service within your first
    6–12 months
  - Design, build and ship full-stack features across .NET 8
    services and React front ends
  - Lead large projects from design to rollout with one or two
    other engineers
  - Modernise legacy code, building in automated tests and
    observability
  - Join our on-call rotation and partner with product,
    engineering and client support
  - Mentor engineers through code review and pairing, and help
    us hire

  WHAT YOU'LL BRING:

  - 4–8 years of professional software development experience
  - Strong C# / .NET backend skills, including in large,
    established codebases
  - Experience with React, TypeScript and SQL
  - Daily, hands-on use of AI coding assistants
  - A record of delivering projects to production with limited
    supervision
  - Curiosity about payments: we’ll help you learn the domain

  WHO WE ARE:

  Do Your Best Work

  - The opportunity to build in a fast-paced start-up
    environment with experienced industry leaders
  - A learning environment where you can dive deep into the
    latest technologies and make an impact.  A professional
    development budget to support other modes of learning.
  - Thrive in an environment where no matter what race,
    ethnicity, gender, origin, or culture they identify with,
    every employee is a respected, valued, and empowered part
    of the team.
  - In-office collaboration for moments that matter is important
    to our culture, and we give managers and teams the
    flexibility to decide which 10+ days a month they come in.
  - Bi-weekly all-company meeting - business updates and ask me
    anything style discussion with our Leadership Team
  - We come together for moments that matter which include team
    offsites, team bonding activities, happy hours and more!

  Take Control of Your Finances

  - Competitive salary, bonuses, and equity
  - Competitive benefits that cover physical and mental
    healthcare, retirement, family forming, and family support
  - Employee giving match
  - Mobile phone stipend

  Take Care of Yourself

  - R&R days so you can rest and recharge
  - Generous wellness reimbursement and weekly onsite & virtual
    programming
  - Generous vacation policy - work with your manager to take
    time off when you need it
  - Industry-leading parental leave policies. Family planning
    benefits.
  - Catered lunches, fully-stocked kitchens with premium
    snacks/beverages, and plenty of fun events

  Benefits listed above are for full-time employees.

