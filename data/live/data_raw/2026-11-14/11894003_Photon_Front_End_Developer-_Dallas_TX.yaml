description: |
  Job Summary



  We are seeking a skilled UI Developer with strong expertise
  in modern Angular development to design, develop, and
  maintain responsive, high-performance web applications. The
  ideal candidate will have hands-on experience with Angular
  19+, Angular Signals API, Reactive Forms, and modern unit
  testing frameworks such as Vitest or Jest. The candidate
  should possess a deep understanding of Angular component
  architecture, lifecycle hooks, and change detection
  mechanisms to build scalable and maintainable front-end
  solutions.



  Key Responsibilities



  - Design, develop, and maintain dynamic, responsive, and user-
    friendly web applications using Angular 19+.
  - Develop reusable, modular, and maintainable UI components
    following Angular best practices and coding standards.
  - Leverage Angular Signals API for efficient state management
    and reactive programming patterns.
  - Build and maintain complex forms using Angular Reactive
    Forms, including custom validations and dynamic form
    controls.
  - Implement robust unit tests using Vitest or Jest to ensure
    application reliability, maintainability, and code
    quality.
  - Utilize Angular lifecycle hooks effectively to optimize
    component initialization, rendering, and resource
    management.
  - Analyze and optimize Angular change detection strategies to
    improve application performance and scalability.
  - Collaborate with UX/UI designers, backend developers, and
    product teams to translate business requirements into
    technical solutions.
  - Troubleshoot, debug, and resolve front-end issues across
    multiple browsers and devices.
  - Participate in code reviews and enforce front-end
    development standards and best practices.
  - Integrate RESTful APIs and backend services into Angular
    applications.
  - Continuously evaluate and adopt modern Angular features and
    front-end development practices.



  Required Qualifications



  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field.
  - 8+ years of professional experience in front-end or UI
    development.
  - Strong hands-on experience with Angular 19+ and TypeScript.
  - Experience working with Angular Signals API and reactive
    application architecture.
  - Expertise in Reactive Forms, form validation, and complex
    form workflows.
  - Strong understanding of Angular component lifecycle hooks,
    dependency injection, and modular architecture.
  - Deep knowledge of Angular change detection strategies,
    performance optimization, and rendering behavior.
  - Experience with unit testing frameworks such as Vitest or
    Jest.
  - Proficiency in HTML5, CSS3, SCSS, JavaScript, and
    TypeScript.
  - Experience consuming REST APIs and handling asynchronous
    operations using RxJS.
  - Familiarity with Git version control and Agile/Scrum
    development methodologies.



  Preferred Qualifications



  - Experience with state management solutions and modern
    Angular architecture patterns.
  - Knowledge of CI/CD pipelines and automated testing
    practices.
  - Familiarity with cloud platforms such as AWS, Azure, or
    Google Cloud.
  - Experience with component libraries and design systems.
  - Knowledge of accessibility (WCAG) and responsive design
    principles.



  Compensation, Benefits and Duration

  Minimum Compensation: USD 38,000 Maximum Compensation: USD
  135,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
