description: |
  Attentive® is the AI marketing platform for 1:1
  personalization redefining the way brands and people
  connect. We’re the only marketing platform that combines
  powerful technology with human expertise to build authentic
  customer relationships. By unifying SMS, RCS, email, and
  push notifications, our AI-powered personalization engine
  delivers bespoke experiences that drive performance,
  revenue, and loyalty through real-time behavioral insights.



  Recognized as the #1 provider in SMS Marketing by G2,
  Attentive partners with more than 8,000 customers across 70+
  industries. Leading global brands like Crate and Barrel,
  Urban Outfitters, and Carter’s work with us to enable
  billions of interactions that power tens of billions in
  revenue for our customers.



  With a distributed global workforce and employee hubs in New
  York City, San Francisco, London, and Sydney, Attentive’s
  team has been consistently recognized for its performance
  and culture. We’re proud to be included in Deloitte’s Fast
  500 (four years running!), LinkedIn’s Top Startups, Forbes’
  Cloud 100 (five years running!), Inc.’s Best Workplaces, and
  the Human Rights Campaign Foundation's Corporate Equality
  Index!

  About the Role

  The Onsite Customer Growth team develops features that help
  Attentive's customers grow through personalized experiences
  built directly on their websites. We focus on increasing
  list growth through investments in creative capabilities,
  experimentation, and AI-driven optimization. Our team builds
  the systems and product experiences that power onsite
  engagement for millions of users and help brands convert
  more visitors into subscribers and customers.

  We're looking for a Staff Software Engineer to serve as a
  technical anchor for the team, shaping not just what we
  build, but how we build it. This is a role for someone who
  thinks in systems across multiple teams, drives durable
  architectural decisions, and accelerates the people around
  them as much as the product itself. You'll own the most
  complex, cross-cutting technical challenges in our onsite
  growth platform and define the technical strategy as the
  team scales.

  This hybrid role is based in our New York office, with in-
  office collaboration Tuesday through Thursday each week.

  What You'll Accomplish

  - Define and own the technical architecture for Attentive's
    Onsite Growth platform, setting direction for services,
    APIs, and shared infrastructure that multiple teams depend
    on
  - Lead cross-functional technical strategy in partnership with
    product, design, ML, and data science teams, driving the
    most complex, ambiguous problems from alignment to
    production
  - Identify and address systemic engineering risks (reliability
    gaps, scalability ceilings, and architectural debt) before
    they become blockers to the business
  - Build scalable backend services, APIs, and user-facing
    product capabilities that power onsite growth at
    Attentive's scale
  - Improve system observability, resiliency, and performance to
    ensure onsite experiences remain fast, reliable, and
    effective at scale
  - Mentor and develop other engineers, giving technical
    feedback, sponsoring growth, and helping the team level up
    as a whole
  - Contribute to a strong engineering culture through
    principled technical leadership and a consistent focus on
    customer impact

  Your Expertise

  - 8+ years of professional software engineering experience,
    with a track record of leading complex systems at scale
  - Demonstrated staff-level impact: you've driven architectural
    decisions that shaped an entire product area or platform,
    not just a single feature
  - Deep proficiency in at least one modern programming language
    such as Java or TypeScript
  - Experience designing distributed systems, APIs, and
    microservices, and a solid understanding of reliability,
    scalability, and performance
  - Strong technical communication: you’ve written crisp RFCs,
    led productive design reviews, and made complex tradeoffs
    legible to non-engineers
  - Experience with cloud infrastructure and modern developer
    tooling (AWS, Docker, Kubernetes, relational databases,
    caching, queues, streaming)
  - A history of developing other engineers through mentorship,
    code review, and raising the standard of work around you
  - Curiosity, strong collaboration skills, and a genuine
    passion for building products that drive meaningful
    customer growth

  You'll get competitive perks and benefits, from health &
  wellness to equity, to help you bring your best self to
  work.

  For US based applicants:

  - The US base salary range for this full-time position is
    $208,000 - $312,000 annually + equity + benefits
  - Our salary ranges are determined by role, level and location

  #LI-CW1

  By applying for this position, your data will be processed
  as per Attentive's Privacy Policy.

  Attentive Company Values

  Default to Action - Move swiftly and with purpose

  Be One Unstoppable Team - Rally as each other’s champions

  Champion the Customer - Our success is defined by our
  customers' success

