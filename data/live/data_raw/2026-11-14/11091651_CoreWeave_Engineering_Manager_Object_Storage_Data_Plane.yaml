description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the Role

  As an Engineering Manager, Object Storage Data Plane, you
  will lead high-performing systems engineering teams driving
  high-throughput distributed storage architectures and
  tackling the challenge of scaling storage performance by 10x
  for massive AI workloads. You will oversee file and block
  and object storage development to maximize GPU utilization
  across AI cloud infrastructure. In this role, you will
  balance technical guidance with strategic execution,
  performance management and cross-functional leadership in a
  fast-paced environment.

  What You’ll Do

  - Scale foundational file and block and object storage systems
    powering high-performance computing AI infrastructure.
  - Drive end-to-end design and operational excellence across
    file and block and object storage services built in Go and
    Rust to maximize GPU utilization.
  - Solve complex engineering challenges to achieve 10x
    performance scaling in file and block and object storage
    systems.
  - Lead systems engineering teams in a coding-focused, meeting-
    light culture with high autonomy and impact.
  - Provide technical mentorship, oversee performance management
    and foster innovation.
  - Align engineering execution with strategic business goals
    through effective cross-team leadership.

  Who You Are

  - Deep technical expertise in storage performance tuning,
    latency optimization and benchmarking for file and block
    and object storage architectures.
  - 3+ years managing engineering teams plus 7+ years in hands-
    on systems or infrastructure engineering.
  - Technical expertise in cloud storage technologies and
    distributed systems such as Ceph, Lustre, MinIO and
    GPUDirect Storage.
  - Proven track record scaling storage engineering teams within
    hyper-scale cloud environments.
  - Demonstrated success operating ultra-low-latency systems
    across high-performance computing or AI infrastructure.
  - Proficiency in systems programming with Go and Rust.
  - Demonstrated capability in technical recruitment and team
    growth.

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You are driven to solve complex low-latency systems
    challenges and scale top-tier engineering teams.
  - You are eager to push the boundaries of GPU optimization,
    next-generation distributed systems and massive-scale AI
    infrastructure.
  - You are an expert in cloud storage, file and block and
    object storage systems and low-level systems programming.

  Why CoreWeave?

  We care deeply about how we build our products and how we
  collaborate, anchored by our core values:

  - Be curious at your core
  - Act like an owner
  - Empower employees
  - Deliver best-in-class client experiences
  - Achieve more together

  We foster an environment of high autonomy and collaboration
  to solve complex technical challenges. You will work
  alongside industry leaders driving breakthrough engineering
  in AI cloud infrastructure.

  The base salary range for this role is $182,000 to $242,000.
  The starting salary will be determined by job-related
  knowledge, skills, experience and the market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

