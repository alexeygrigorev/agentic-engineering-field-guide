  Senior Software Engineer, Simple Trade Experience

  We're hiring a Senior Software Engineer to join the Simple
  Trade Experience team within the Consumer & Business group.
  This team powers the critical buy, sell, and convert
  journeys on the Simple interface of the Coinbase app and
  website, supporting multiple trading types and assets for
  millions of users worldwide. You'll own highly performant,
  available, and consistent backend and frontend systems that
  directly enable customers to trade with confidence at web-
  scale.

  What you'll do:

  - Own the design and delivery of highly performant, available,
    and consistent systems powering trading for millions of
    users worldwide
  - Architect robust, extensible systems that support multiple
    trading types and assets (Spot, Limit, Recurring, and
    more) while maintaining reliability at web-scale
  - Partner closely with product and design to define and ship a
    best-in-class trading experience across web and mobile
  - Drive production service evolution, scaling and maintaining
    critical trading infrastructure as traffic and product
    scope grow
  - Strengthen engineering quality across the team through
    rigorous code reviews, mentorship, and knowledge sharing

  Required Skills and Experience:

  - 5+ years of experience in software engineering with
    demonstrated success building and scaling production
    services handling web-scale traffic
  - Proven track record designing, building, and maintaining
    high-availability distributed systems that evolve over
    time, ideally in trading or financial systems
  - Deep proficiency in backend systems languages (Java, Golang,
    or similar) with experience in data stores such as MongoDB
    or Redis
  - Demonstrated ability to pair customer-focused product
    thinking with comprehensive observability and operational
    excellence
  - Experience upgrading or re-architecting significant legacy
    systems into next-generation platforms
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $186,065—$218,900 USD

