description: |
  At Goldschmitt and Associates LLC (G&A), we’re not just
  another company—we’re a catalyst for innovation and impact,
  and we’re inviting passionate, forward-thinking individuals
  to join us on this journey. Recognized multiple times on the
  Inc 5000 list of the fastest-growing companies, G&A is a
  leader in tech transformation and system modernization for
  some of the nation’s most important federal agencies. Our
  culture is built on creativity and collaboration. We offer
  flexible schedules, telework options, and an environment
  where your ideas truly matter. At G&A, you won’t just clock
  in—you’ll be solving real-world challenges and working on
  projects that make a difference in the lives of millions.
  Joining our team means becoming part of a vibrant, connected
  community where innovation thrives, your voice is heard, and
  your impact is felt. Whether you’re a tech enthusiast, a
  strategic thinker, or a problem-solver, at G&A, you’ll have
  the opportunity to level up your career while making a real-
  world impact. If you’re ready to be part of a company that
  values purpose as much as progress, G&A is the place for
  you! Summary: Goldschmitt is seeking a Full Stack Developer.
  This position is remote with preference given to candidates
  who live within a commutable distance to the DMV area. The
  anticipated salary for this position is $85,000.00-
  $130,000.00, dependent upon experience. The anticipated
  travel for this position is 5%. Job Duties and
  Responsibilities:

  - Design, develop, implement, and maintain full stack
    enterprise/SaaS applications
  - Develop responsive, user-friendly web application
    interfaces, dashboards, and reports using React
  - Develop and maintain backend applications using Java, Spring
    Boot, and related technologies
  - Design, develop, document, and maintain RESTful APIs and web
    services
  - Design and maintain databases, data models, queries, and
    supporting scripts
  - Implement application authentication, authorization, and
    role-based access controls
  - Translate software requirements and business processes into
    functional application features
  - Develop and execute automated tests for frontend and backend
    functionality
  - Troubleshoot, debug, and optimize application functionality,
    performance, and security
  - Participate in code reviews and collaborate with technical
    and business stakeholders to deliver high-quality software

  Necessary Skills and Knowledge:

  - Experience developing frontend applications using React and
    backend applications using Java and Spring Boot
  - Experience designing, developing, and integrating RESTful
    APIs
  - Experience with relational databases and data modeling
  - Experience with modern software development, testing, and
    deployment practices

  Minimum Qualifications:

  - Possess at least 3 years of professional software
    development experience, including full stack development
    of enterprise web applications and/or SaaS solutions
  - Possess a Bachelor's degree
  - Possess the ability to pass and maintain eligibility for a
    Public Trust investigation, including United States
    citizenship
  - Possess experience with the following:
    - Frontend: JavaScript (ES6+), HTML5, CSS3/SCSS, React (hooks
      and functional components), Redux/Redux Toolkit
    - Backend: Java, Spring Boot, Hibernate/JPA
    - APIs: RESTful web services, API integration, Swagger/OpenAPI
    - Databases: MySQL or comparable relational databases, SQL,
      and data modeling
    - Frontend Development: Data-heavy pages, pagination, tables,
      sorting/filtering, complex forms, validation, and CRUD
      operations
    - Application Security: Authentication, authorization, and
      role-based access controls
    - Platforms and Tools: AWS, Git, CI/CD pipelines, Docker
    - Testing: Experience with frontend and backend automated
      testing frameworks

  Preferred Qualifications:

  - Possess experience developing scheduling, workforce
    management, or government applications
  - Possess experience with the following:
    - Frontend: TypeScript, Bootstrap 5/React-Bootstrap, React
      Router
    - Testing: Vitest or Jest, React Testing Library, MSW, JUnit
    - Reporting: Interactive dashboards, data visualization,
      print-optimized layouts, and PDF report generation
    - AWS Technologies: AWS GovCloud, Cognito, API Gateway, ECS,
      Lambda, CloudWatch, RDS, CloudFormation, IAM, and
      Secrets Manager
    - Databases: DB2, Redis, DynamoDB
    - Additional Technologies: Node.js, AWS CDK, Spring Boot
      Actuator/Micrometer
    - Security and Compliance: FedRAMP, Authority to Operate
      (ATO), and government security requirements
