description: |
  About this role

  Lead Java Developer, Software Engineering – Platform
  Engineering

  Your team

  The Platform Engineering team architects and builds the
  foundational technology that supports Aladdin, BlackRock’s
  investment operating system. Aladdin connects the
  information, people, and technology needed to manage money
  in real time, combining risk analytics with portfolio
  management, trading, and operations capabilities.

  The team builds core infrastructure and platforms that
  improve developer productivity, stability, and performance
  across Aladdin applications. As part of Aladdin Engineering,
  you will collaborate with colleagues across offices and
  countries to develop technology used by financial
  institutions and investment professionals worldwide.

  Your role and impact

  As a Lead Java Developer in Platform Engineering, you will
  develop and enhance scalable software systems, build
  foundational capabilities, and improve the developer
  experience across Aladdin. You will help shape product
  roadmaps, solve complex engineering problems, and support
  reliable applications through disciplined design, testing,
  and operational practices.

  You will work in a complex, fast-paced environment where
  collaboration, thoughtful analysis, clear communication, and
  the ability to learn and apply new concepts are important.
  You will also provide technical leadership for projects and
  contribute to an inclusive, collaborative engineering
  culture.

  Your responsibilities

  In every role at BlackRock, you'll be expected to apply
  sound judgement and critical thinking to solve complex
  problems, adapt as the business evolves, and combine the
  curiosity to explore new approaches and technologies with
  the rigor to challenge the results. The scope of this role
  also includes the following responsibilities:

  - Collaborate across offices and countries with engineering
    colleagues, product management, and business partners to
    define product roadmaps and delivery priorities.
  - Evolve continuous integration and continuous delivery
    (CI/CD) pipelines, build systems, package-management
    capabilities, enterprise-grade container orchestration
    platforms supporting declarative infrastructure and
    horizontal scaling, and Open Container Initiative (OCI)
    container image packaging and runtime while supporting
    operational teams through testing, code reviews,
    resilience practices, and level-two production support.
  - Deliver efficient, highly available, concurrent, and fault-
    tolerant software systems.
  - Design and develop innovative solutions to complex problems,
    identifying issues, dependencies, and potential
    roadblocks.
  - Apply established software engineering practices throughout
    the development lifecycle, including design-focused and
    test-driven approaches.
  - Promote an inclusive and collaborative culture through
    recruiting, management actions, and employee engagement.
  - Lead individual projects by managing priorities, deadlines,
    deliverables, and technical decisions using Agile
    methodologies.

  Your experience

  - A bachelor’s or master’s degree in computer science,
    engineering, or a related field, or comparable practical
    experience, supported by substantial software engineering
    experience.
  - 8-10+ Years of Strong software development experience using
    core Java, object-oriented programming, design patterns,
    and relevant backend or frontend technologies such as
    Spring, TypeScript, JavaScript, Angular, React, or Python.
  - A track record of building high-quality software using
    design-focused, test-driven, and Agile engineering
    practices, with experience using relevant open-source
    frameworks and development tools.
  - Experience working with relational databases, highly
    available distributed non-relational data storage
    platforms, scalable distributed data and caching
    platforms, and distributed event streaming and messaging
    platforms.
  - Strong analytical, problem-solving, and communication
    skills, with the ability to understand financial or
    investment-related problems and build effective
    relationships with partner teams, sponsors, and user
    groups.
  - Experience leading software projects or development teams
    and taking ownership of the design and technical quality
    of a significant application, system, or component.
  - Exposure to application programming interfaces,
    microservices, cloud platforms such as Microsoft Azure,
    software delivery and operations tools such as Azure
    DevOps, optimization or algorithms, or artificial
    intelligence-related products and research environments.

  For New York, NY Only the salary range for this position is
  USD$215,000.00 - USD$162,000.00 . Additionally, employees
  are eligible for an annual discretionary bonus, and benefits
  including healthcare, leave benefits, and retirement
  benefits. BlackRock operates a pay-for-performance
  compensation philosophy and your total compensation may vary
  based on role, location, and firm, department and individual
  performance.

  Our benefits To help you stay energized, engaged and
  inspired, we offer a wide range of benefits including a
  strong retirement plan, tuition reimbursement, comprehensive
  healthcare, support for working parents and Flexible Time
  Off (FTO) so you can relax, recharge and be there for the
  people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

