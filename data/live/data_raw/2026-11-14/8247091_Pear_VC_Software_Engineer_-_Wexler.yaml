description: |
  About Wexler

  Wexler is building the best AI system for litigation on the
  planet. We work with some of the world’s largest law firms,
  helping them to solve their most complex cases, find the
  winning strategy in each matter, and create clarity from the
  chaos of documents and facts in each case. We are a rapidly
  growing, legal AI company based in London. Clifford Chance,
  HSFKramer, Goodwin, Addleshaw Goddard and more rely on us to
  help find the critical facts that can determine their
  chances of winning a case.

  We’re backed with a $5.3M Seed by Pear VC, Seedcamp, The
  LegalTechFund + many leading industry angels.

  We are building a comprehensive AI platform for managing,
  resolving and preventing legal disputes across Enterprise
  law firms and Fortune500 companies. We are growing 10x YoY
  and signing more eminent firms every month. Our system
  extracts, objective, cross referenced facts from millions of
  documents, helping litigators win more cases whilst saving
  months of working hours. In this way we ensure every client
  gets the representation they deserve.

  AI is transforming the law, but most tools have focused on
  contract law or are generalist copilots that aggregate the
  tasks lawyers do across practices. Wexler is the leading
  gen-AI platform specifically built for the nuances of
  litigation, and our growth proves the story is resonating.

  About the Role

  We're seeking an entrepreneurial full-stack engineer who
  will work closely with the founders to architect, build and
  scale Wexler's agentic systems for document analysis,
  powered by our state-of-art fact extraction engine.

  As a Software Engineer, you will work closely with the
  founding technical team and contribute to the technical
  architecture of our product and delivery of our ambitious
  product roadmap.

  You'll play a key role in shaping the culture of our
  Technical organisation and will learn alongside expert
  Software and Machine Learning Engineers. You will rapidly
  take on more responsibility and have a clear path to a
  leadership position.

  Please note we have two open positions for this role.

  Responsibilities:

  - Architect, build and scale full-stack applications that
    power Wexler's agentic systems for document analysis
  - Develop customer-facing features, internal tooling and
    DevOps infrastructure to support our growing platform
  - Collaborate with AI engineers to integrate LLM capabilities
    into production-ready software systems
  - Build robust, scalable backend systems using modern
    technologies and cloud infrastructure
  - Create intuitive user interfaces that allow legal
    professionals to interact seamlessly with AI-powered tools
  - Contribute to technical architecture decisions and help
    establish engineering best practices
  - Work directly with customers to understand their needs and
    rapidly iterate on solutions

  Technical Must-Haves:

  - Strong experience with Node.js and TypeScript for backend
    development
  - Strong Python experience for AI system development
  - Proficiency with PostgreSQL for database design and
    optimisation
  - Hands-on experience with AWS cloud services and
    infrastructure
  - Full-stack development experience with modern frontend
    frameworks
  - Experience building scalable, production-grade systems
  - Understanding of DevOps practices and CI/CD pipelines

  You will be:

  - A builder with a track record of shipping new product
    features or architectures in a fast-paced environment
  - Driven by building fantastic product experiences - you can
    put yourself in the users shoes and understand their
    struggles
  - Fascinated by AI and excited to build products at the
    bleeding edge of this once in a lifetime platform shift
    (but you don't need to have any prior AI experience)
  - Full-stack and happy to get stuck in where needed most, be
    it working on customer-facing features, internal tooling
    or improving our DevOps
  - Excited to work in a startup environment. You're excited by
    the idea of speaking with customers in the morning and
    shipping features to solve their problems in the
    afternoon. You're ok with priorities changing and you're
    comfortable with risk
  - Someone who values working with people who are low ego,
    ambitious and pragmatic
  - Comfortable figuring out how to build things you haven't
    built before
  - Excited to work in-person from our office in London. We work
    from the WeWork in Aldwych, and we spend 4 days a week in
    person

  What We Offer:

  - Competitive salary and significant equity
  - Huge autonomy and ownership. You will be designing and
    building the core systems that power AI for some of the
    most expert users in AI
  - Budget for learning and professional growth
  - Bi-annual team retreats
  - Work closely with experienced founders and a team of AI
    scientists and engineers

  About the opportunity:

  Legal AI has caught the attention of VCs and the wider tech
  world, but the reality is adoption with users is low in the
  enterprise, with roughly 20% of lawyers using AI tech. Of
  those lawyers, most are transactional or contract lawyers
  and they use generalist platforms that look to aggregate the
  tasks lawyers do but do not go deep into specific workflows.
  That's where Wexler is different. We are a 'scalpel' rather
  than a 'Swiss Army knife', meaning we go deep into the
  workflows that can decide how a legal case is won. We have
  extremely positive feedback from lawyers, and we have an
  ambitious roadmap of features to expand our coverage while
  retaining the forensic detail that makes our product great.

  Some topics you'll think about:

  - Delightful ‘agentic’ product experiences: Legal AI has
    largely revolved around AI assistants. we are building
    workflows that solve specific tasks for expert users. You
    will be obsessed with defining and building these
    features.
  - Scale: architecting systems that scale with our commercial
    growth, delivering each user a delightful, performant and
    magical experience.
  - Security: our customers treat their clients with the highest
    degree of sensitivity and security. The software we build
    meets the highest standards of security, ever evolving in
    the world of AI.

  Note: If you think you don't quite fit the bill but you'd
  still be interested in chatting for a different role, get in
  touch at careers@wexler.ai.
