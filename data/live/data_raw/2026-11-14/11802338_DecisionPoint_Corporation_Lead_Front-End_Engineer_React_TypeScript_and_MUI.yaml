description: |
  Overview

  DecisionPoint Corporation is seeking a Lead Front-End
  Engineer to join our U.S. Transportation Command
  (USTRANSCOM) Global Freight Management (GFM) modernization
  team. This hands-on technical leadership role is ideal for
  an experienced React and TypeScript engineer who can deliver
  high-quality software, guide front-end technical direction,
  and mentor other developers.

  The Lead Front-End Engineer will collaborate with product
  owners, functional analysts, UX designers, developers,
  testers, DevSecOps engineers, and government stakeholders to
  translate complex requirements into accessible, responsive,
  and maintainable enterprise solutions. The ideal candidate
  combines deep front-end expertise with sound technical
  judgment, attention to user experience, and a practical
  approach to balancing engineering quality with delivery
  priorities.

  This position is fully remote.

  Duties & Responsibilities

  - Design, develop, test, and maintain complex enterprise web
    applications using React, TypeScript, and Material UI
    (MUI).
  - Lead front-end architecture and establish development
    patterns that support scalability, consistency, security,
    and long-term maintainability.
  - Develop reusable components, shared utilities, and design-
    system-aligned solutions.
  - Implement responsive, accessible, and user-friendly
    interfaces that accurately reflect UX designs and product
    requirements.
  - Collaborate with UX designers to refine workflows,
    interactions, layouts, and visual details.
  - Modernize legacy functionality while preserving critical
    business capabilities.
  - Provide technical leadership and mentorship to junior and
    mid-level engineers.
  - Conduct code reviews and promote standards for code quality,
    testing, accessibility, performance, and maintainability.
  - Participate in backlog refinement, sprint planning,
    estimation, retrospectives, and release planning.
  - Work with product owners and functional analysts to
    translate business needs into actionable user stories,
    acceptance criteria, and technical tasks.
  - Identify technical risks, dependencies, architectural
    concerns, and implementation tradeoffs early in the
    development process.
  - Design and consume RESTful APIs and collaborate with back-
    end engineers on API contracts and data models.
  - Write and troubleshoot SQL queries to investigate issues,
    validate functionality, and support development
    activities.
  - Support automated testing, CI/CD integration, deployment,
    troubleshooting, and production support.
  - Communicate technical recommendations, risks, and tradeoffs
    clearly to technical and non-technical stakeholders.
  - Independently lead features from initial requirements
    through deployment and production support.

  Qualifications

  Required:

  - Authorized to work within the United States.
  - Ability to obtain Secret Security Clearance.
  - Ability to obtain CompTIA Security+ certification.
  - Bachelor's degree in Computer Science, Information Systems,
    Engineering, or a related technical discipline, or
    equivalent professional experience.
  - Seven or more years of professional software-development
    experience.
  - Five or more years of experience building production
    applications with React.
  - Three or more years of experience developing enterprise
    applications with TypeScript.
  - Strong experience with Material UI (MUI), including theming,
    component customization, responsive design, and design-
    system implementation.
  - Demonstrated experience leading technical efforts and
    mentoring software engineers.
  - Strong knowledge of modern front-end architecture,
    component-based design, HTML, CSS, responsive design, and
    cross-browser compatibility.
  - Experience integrating front-end applications with RESTful
    APIs.
  - Experience with automated testing, Git-based workflows, and
    CI/CD practices.
  - Experience participating in Agile planning, estimation,
    backlog refinement, and story development.
  - Strong verbal, written, and interpersonal communication
    skills.
  - Ability to collaborate effectively with engineers,
    designers, analysts, product owners, and stakeholders in a
    remote team environment.

  Preferred:

  - Experience with Java, Spring Boot, SQL, and back-end API or
    service development.
  - Experience creating, maintaining, or governing reusable
    component libraries and design systems.
  - Experience with front-end testing frameworks and test-
    automation practices.
  - Experience applying WCAG 2.1 and Section 508 accessibility
    standards.
  - Experience optimizing front-end application performance and
    modernizing legacy enterprise applications.
  - Experience supporting Department of Defense or other federal
    government programs.
  - Active Secret security clearance.
  - Active CompTIA Security+ certification.

