description: |
  About Sprinter Health:



  At Sprinter Health, our mission is reimagining how people
  access care by bringing it directly to their homes. Nearly
  30% of patients in the U.S. skip preventive or chronic care
  simply because they can’t get to a doctor’s office. For
  many, the ER becomes their first touchpoint with the
  healthcare system—driving over $300B in avoidable costs
  every year.



  By using the same technologies that power leading
  marketplace and last-mile platforms, we deliver care where
  people are, especially those who need it most. So far, we’ve
  supported more than 2 million patients across 22 states,
  completed 130,000+ in-home visits, and maintained a 92 NPS.
  Our team of clinicians, technologists, and operators have
  raised over $125M to date investors like a16z, General
  Catalyst, GV, and Accel and enjoy multi-year runway.



  About the Role



  Sprinter Health delivers free, in-home care to some of the
  most underserved communities in the country. The Growth
  Engineering team is responsible for getting patients to
  actually use that care—by reaching them, educating them, and
  making it easy to book. Today, most appointments are booked
  through outbound phone outreach. Your mandate is to help us
  evolve that into a true product-led motion by bringing
  booking directly into the core product and scaling how we
  engage patients.



  This is a role where the impact is tangible—you’re building
  the systems that determine whether someone gets care or goes
  without.



  Hybrid & Office Experience

  We operate on a hybrid schedule, working from the office
  Monday through Thursday, with Fridays designated as work-
  from-anywhere days. Although this role is open to remote

  We care deeply about work-life balance and are happy to
  provide flexibility when life happens. We ask that employees
  be in the office Monday through Thursday to collaborate with
  their teams while maintaining flexibility where it matters
  most.

  Lunch is provided every day, and the entire team takes an
  hour to eat together. It's one of the ways we stay connected
  outside of meetings. You'll usually find us playing a board
  game before getting back to work.



  What you will do:

  - Design and ship experiments that drive patient bookings —
    from message copy tests and outreach timing to new in-
    product booking flows
  - Optimize multi-channel engagement across SMS, phone, email,
    and mail to reach patients who typically don’t schedule
    care
  - Run rapid brainstorms and sizing exercises to prioritize the
    next set of growth bets
  - Define and monitor funnel metrics to understand drop-off,
    activation, and conversion
  - Share insights through clear reporting and experiment
    reviews with cross-functional partners
  - Test unconventional tactics (like door-knocking pilots) and
    simulate outreach volume to match clinical supply and
    demand





  What have you done:

  - Spent 3+ years as a software engineer, including 1–2 years
    on a growth or experimentation-focused team
  - Built and iterated on backend systems that power
    experimentation, messaging, funnels, or activation flows
  - Shipped and measured experiments that moved core metrics
    like activation, conversion, retention, or booking
  - Used data to identify drop-offs, size opportunities, and
    prioritize what to build next
  - Collaborated with product, design, data, or ops to turn
    insights into shipped features
  - Balanced speed and impact in a startup or high-growth
    environment





  What gives you an edge:

  - You’ve shipped experiments that directly moved activation,
    conversion, or booking metrics
  - You’re comfortable owning the full loop — sizing, building,
    launching, and measuring
  - You’ve worked on products where growth is driven through the
    product, not just outbound channels
  - You move fast with data, scrappy tooling, and lightweight
    experiments
  - You’ve operated in high-ambiguity, zero-to-one, or PLG
    environments where playbooks didn’t exist





  Our tech stack:

  - Typescript, Python
  - AWS Amplify stack (AppSync, DynamoDB, Lambda,
    CloudFormation)
  - BigQuery, OpenSearch / ElasticSearch
  - Looker, Kibana
  - Statsig
  - GraphQL
  - Node.js
  - React Native, React Native for Web





  What we offer

  - Meaningful pre-IPO equity
  - Medical, dental, and vision plans 100% paid for you and your
    dependents
  - Flexible PTO + 10 paid holidays per year
  - 401(k) with match
  - 16-week parental leave policy for birthing parent, 8 weeks
    for all other parents
  - HSA + FSA contributions
  - Life insurance, plus short and long-term disability coverage
  - Free daily lunch in-office
  - Annual learning stipend





  The Interview Process

  - We aim to complete the interview process between 2-3 weeks.
    It will usually consist of:
  - Recruiter Screen (30-Minutes)
  - Technical Assessment (45-Minutes)
  - Hiring Manager Introduction (30-Minutes)
  - Onsite Interview: Systems Design - Growth Focused +
    Behavioral Interview + Lunch with the Team (3-hours)
  - References



