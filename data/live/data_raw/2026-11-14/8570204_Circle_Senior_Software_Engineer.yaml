description: |
  Circle (NYSE: CRCL) is one of the world's leading internet
  financial platform companies, building the foundation of a
  more open, global economy through digital assets, payment
  applications, and programmable blockchain infrastructure.
  Circle's platform includes the world's largest regulated
  stablecoin network anchored by USDC, Circle Payments Network
  for global money movement, and Arc, an enterprise-grade
  blockchain designed to become the Economic OS for the
  internet. Enterprises, financial institutions, and
  developers use Circle to power trusted, internet-scale
  financial innovation. Learn more at circle.com . What you'll
  be part of: Circle is committed to visibility and stability
  in everything we do. As we grow as an organization, we're
  expanding into some of the world's strongest jurisdictions.
  Speed and efficiency are motivators for our success and our
  employees live by our company values : High Integrity,
  Future Forward, Multistakeholder, Mindful, and Driven by
  Excellence. We have built a flexible work environment where
  new ideas are encouraged and everyone is a stakeholder. What
  you'll be responsible for: The Senior Software Engineer is
  responsible for extending Circle's in-house blockchain
  systems infrastructure to support the tokenization of the
  world; analyzing requirements, procedures, and problems to
  improve existing systems and modifying systems; building and
  owning scalable microservices that are responsible for
  reliable and secure APIs that transfer value and assets
  across all blockchain protocols as well as traditional
  banking protocols; collaborating with Product and
  Engineering teams to design, test, and shape Circle
  features, including developing and documenting system design
  procedures, testing procedures, and quality standards;
  troubleshooting program and system malfunctions to restore
  normal functioning; building publicly accessible APIs that
  make it simple for developers to integrate with complex
  payment systems; integrating Platform Services with leading
  banks and financial technologies; consulting with management
  to ensure agreement on system principles; writing the
  infrastructure to deliver great payment experiences,
  including data sources (SQL or NoSQL), messaging systems and
  APIs; other duties as assigned. What you'll bring to Circle:

  - 6 years minimum professional software development experience
    in object oriented languages like Java and Go
  - Bachelor's degree in Computer Science or a closely related
    field (or equivalent).
  - Led teams (2-4) technically on architecture and system
    design.
  - Experience working with payment systems like credit cards
    and bank transfers.
  - A broad understanding of RESTful API design and development
    principles.
  - Experience with Cloud Services (AWS, Google Cloud, Microsoft
    Azure, etc).
  - Experience with SQL databases and designing schemas.
  - Proven experience in the design & deployment of production-
    quality, scalable software.
  - A focus on coding standards and code quality -- a desire to
    have great test coverage to enable continuous delivery.
  - Excellent communication skills, able to collaborate with
    remote teams, share ideas and present concepts
    effectively.
  - Self-starter, you enjoy moving at a fast pace, shipping
    software that improves the user experience and constantly
    improving your work with little supervision.

   Additional Information:

  - This position is eligible for day-one PERM sponsorship for
    qualified candidates.

  Circle is on a mission to create an inclusive financial
  future, with transparency at our core. We consider a wide
  variety of elements when crafting our compensation ranges
  and total compensation packages.  Starting pay is determined
  by various factors, including but not limited to: relevant
  experience, skill set, qualifications, and other business
  and organizational needs. Please note that compensation
  ranges may differ for candidates in other locations. Base
  Pay Range: $152,500 - $205,000 We are an equal opportunity
  employer. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status, or any other protected status required by
  the laws in the locations where we hire. Additionally,
  Circle participates in the E-Verify Program in certain
  locations, as required by law. Should you require
  accommodations or assistance in our interview process
  because of a disability, please reach out to
  accommodations@circle.com for support. We respect your
  privacy and will connect with you separately from our
  interview process to accommodate your needs. #LI-Remote
