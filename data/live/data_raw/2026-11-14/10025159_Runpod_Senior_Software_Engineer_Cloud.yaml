title: Senior Software Engineer (Cloud)
company: Runpod
location: USA
remote: true
work_type: FULL_TIME
company_size: 120 Employees
description: |
  Runpod is pioneering the future of AI and machine learning,
  offering cutting-edge cloud infrastructure for full-stack AI
  applications. Founded in 2022, we are a rapidly growing,
  well-funded company with a remote-first organization spread
  globally. Our mission is to empower innovators and
  enterprises to unlock AI's true potential, driving
  technology and transforming industries. Join us as we shape
  the future of AI.

  As our cloud platform grows, we are seeking a full-time,
  remote Software Engineer to join our team. This technical
  position will be crucial to growing our cloud platform as we
  integrate new data centers, optimize existing functionality,
  and deliver new features to customers. This role offers the
  opportunity to innovate on cloud infrastructure for massive-
  scale parallel computing, supporting the technical
  innovations of the future. You will work on the services
  that manage VMs across thousands of machines in worldwide
  data centers.

  If you are passionate about cloud infrastructure,
  distributed systems, and enabling the future of high-
  performance AI computation, we want to hear from you. Join
  our team and help shape the future of computing!

  Responsibilities:

  - Design, develop, and maintain cloud infrastructure software,
    primarily in Go.
  - Collaborate with managers and other engineers to define and
    implement product requirements.
  - Troubleshoot and optimize existing code to improve
    performance and reliability.
  - Participate in code reviews and contribute to the team's
    technical standards.
  - Contribute to architectural discussions and decisions.
  - Stay up-to-date with industry trends and emerging
    technologies.

  Requirements:

  - Bachelor’s degree in Computer Science, Computer Engineering
    or a related field, or equivalent experience.
  - 3+ years of professional experience in software development,
    with experience in Go.
  - Strong understanding of the Go programming language and its
    ecosystem.
  - Strong problem-solving skills and ability to work in a
    collaborative environment.
  - Excellent communication skills and attention to detail.
  - Successful completion of a background check

  Preferred:

  - Experience with one or more of: C, Rust, Python, Javascript,
    Typescript.
  - Experience developing and/or deploying machine learning
    applications.
  - Experience with Python machine learning libraries or models.
  - Experience developing and maintaining large scale
    distributed systems.
  - Experience with containerization: Linux containers (LXC),
    Docker containers, virtual machines (VMs), and/or
    hypervisor technology.
  - Experience debugging Linux application and kernel/driver
    issues.

  What You’ll Receive:

  - The competitive base pay for this position ranges from
    ($150,000 - $200,000). Factors that may be used to
    determine your actual pay may include your specific job
    related knowledge, skills and experience
  - Meaningful equity in a fast-growing AI infra company-
    everyone on the team receives stock options — your impact
    drives our growth, and you share in the upside.
  - Generous medical, dental & vision plans
  - Flexible PTO- take the time you need to recharge
  - Most roles have are remote work first with an inclusive,
    collaborative teams utilizing slack as the main form of
    internal communication
  - Join a passionate team on the cutting edge of AI
    infrastructure — where culture, learning, and ownership
    are at the heart of how we scale.
  - $1,200 Home Office & Equipment Stipend- We set you up for
    success from day one with gear and support to create your
    ideal workspace

  Runpod is committed to maintaining a workplace free from
  discrimination and upholding the principles of equality and
  respect for all individuals. We believe that diversity in
  all its forms enhances our team. As an equal opportunity
  employer, Runpod is committed to creating an inclusive
  workforce at every level. We evaluate qualified applicants
  without regard to race, color, religion, sex, sexual
  orientation, gender identity, national origin, age, marital
  status, protected veteran status, disability status, or any
  other characteristic protected by law.

