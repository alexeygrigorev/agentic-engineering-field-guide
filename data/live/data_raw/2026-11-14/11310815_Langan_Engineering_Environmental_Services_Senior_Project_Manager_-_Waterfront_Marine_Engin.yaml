   Job Summary

  Langan is seeking a Waterfront / Marine Engineering Senior
  Project Manager to join its collaborative team in New York
  City. This individual will serve a key function in in
  managing clients, pursuing new project opportunities,
  providing staff training and project leadership, providing
  waterfront/marine engineering expertise through engineering
  analysis and design of waterfront/marine structures,
  preparation of technical reports, specifications, drawings,
  and overseeing waterfront-related permit applications. In
  this role, you will have the opportunity to partner with
  other disciplines on both small-scale and large-scale
  private development and public infrastructure waterfront
  projects.

  Job Responsibilities

  - Oversee and review complex structural and geotechnical
    analyses;
  - Oversee design for bulkheads, seawalls, relieving platforms,
    pile-supported platforms, breakwaters, revetments,
    stabilized embankments, mechanically stabilized earth and
    other waterfront structures;
  - Oversee and review preparation of permit applications for
    waterfront permits (e.g., NYSDEC Tidal Wetlands Permits,
    USACE Section 10/404 Permits, NYCSBS Waterfront Permits);
  - Oversee and review technical documents, reports,
    construction documents, and construction-related
    correspondence associated with the projects managed;
  - Design and supervise field investigations, waterfront
    facility inspections, and engineering observations during
    waterfront construction activities;
  - Perform and manage multiple projects and tasks within
    specific budgets, schedules, and deadlines;
  - Prepare proposals, draft change orders, review invoices,
    project billings, and collect from clients; and
  - Manage, lead and develop two to five staff and senior staff
    engineers.
  - Perform other duties as requested.

  Qualifications

  - Bachelor’s degree in Civil, Structural, or Geotechnical
    Engineering required;
  - Master’s degree in Structural, Geotechnical, or Coastal
    engineering preferred;
  - Professional Engineer licensure in New York State or ability
    to achieve reciprocity required
  - 10+ years of related waterfront/marine experience;
  - Proven experience in preparing technical reports,
    specifications, construction plans, and waterfront
    facility inspections;
  - Proven experience in project management including: writing
    proposals, running/coordinating projects, managing
    clients, managing billings, reviewing the work of staff
    and mentoring staff;
  - Strong understanding of codes and other regulatory
    requirements;
  - Knowledge of quantitative/technical analyses and related
    software;
  - Possess an entrepreneurial and professional demeanor, as
    well as strong written, verbal, and presentation
    communication skills;
  - Desire and ability to seek out new business opportunities
    and develop additional clients while maintaining project
    workload;
  - Ability to coach and assist with the management of staff;
  - Demonstrated ability to work with staff, clients, and
    regulatory agencies;
  - A collaborative team player with excellent interpersonal and
    social skills; and
  - Possess reliable transportation for client meetings and job
    site visits and a valid driver’s license in good standing.

