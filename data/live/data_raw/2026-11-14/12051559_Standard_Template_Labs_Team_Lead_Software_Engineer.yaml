description: |
  Team Lead, Software Engineer

  STLabs is an AI service management platform that resolves
  employee requests end-to-end, grounded in a living model of
  the enterprise. This matters because we're able to resolve
  requests with full context - the people, systems, services,
  and policies that define how an organization actually runs.
  Requests that used to take days of back-and-forth resolve in
  minutes, right where employees already work.

  About the Role

  We're looking for a Team Lead who loves building software
  just as much as leading engineers. This isn't a traditional
  management role where your calendar is filled with meetings.
  You'll remain deeply hands-on—designing systems, writing
  production code, reviewing architecture, and shipping
  product every week—while leading a small team of exceptional
  engineers.

  You'll help set technical direction, unblock your team,
  raise the engineering bar, and ensure we continue moving
  quickly without sacrificing quality. If you enjoy solving
  hard distributed systems problems, mentoring engineers, and
  building products that customers love, we'd love to meet
  you.

  What You'll Do

  Lead by Building

  - Spend the majority of your time designing and building
    production software.
  - Own complex technical initiatives from architecture through
    production.
  - Help define engineering standards and architectural
    direction.

  Grow an Exceptional Team

  - Lead a small team of engineers through technical guidance,
    coaching, and mentorship.
  - Help engineers grow technically and professionally.
  - Foster a culture of ownership, curiosity, and continuous
    improvement.

  Drive Technical Execution

  - Break large product initiatives into executable engineering
    plans.
  - Partner closely with Product and Design to turn ambitious
    ideas into customer-facing features.
  - Balance shipping velocity with long-term maintainability.
  - Remove technical blockers and help the team make smart
    engineering tradeoffs.

  What We're Looking For

  - 8+ years building production software.
  - Previous experience leading or mentoring engineers.
  - Proven ability to deliver large technical projects while
    remaining hands-on.
  - Strong background in distributed systems and cloud-native
    architecture.
  - Excellent software design and architectural instincts.
  - Comfortable working across the entire software development
    lifecycle.
  - Strong communicator who enjoys collaborating across
    engineering, product, and design.

  What We Offer

  - Build foundational product features for an AI-first
    enterprise platform
  - The opportunity to take ownership of critical systems that
    scale to millions of users.
  - A culture that values craftsmanship, autonomy, and user
    experience.
  - Competitive compensation, equity, and benefits package.
  - Work from our Midtown, Manhattan office, where you’ll be
    side-by-side with the founding team in a supportive,
    collaborative setting. Our team works on-site five days a
    week. The location is easy to reach with plenty of public
    transportation options.

  As an equal opportunity employer, we don’t tolerate
  discrimination or harassment of any kind. Whether that’s
  based on race, ethnicity, age, gender identity, citizenship,
  religion, sexual orientation, disability, pregnancy, veteran
  status or any other protected characteristic as outlined by
  federal, state or local laws. The reasonably estimated
  yearly salary for this role at is: 160,000—230,000 USD.
