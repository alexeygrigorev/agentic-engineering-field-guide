description: |
  Company Description

  A growing financial services intermediary requires the
  services of a driven and enthusiastic software engineer with
  experience in managing teams along with hands on development
  experience. This is a multi-faceted position which will
  enable the right candidate to enhance their technical
  experience on large scale platforms and integrations while
  managing and regulating a small team of developers.

  The existing software stack is based on Angular + nodejs +
  mysql and incorporates external platforms to provide the
  complete solution. The ideal candidate will be able to
  extend, optimise and manage the existing platform. A new
  consumer facing product has also been identified which has
  been approved.

  Job Description

  - Maintain existing code base and version control
  - Design and develop new features and functionality based on
    business requirements
  - Coordinate with the rest of the team who work on different
    parts of the infrastructure
  - Report on the progress of all open projects
  - Assist in hiring, onboarding and evaluations
  - Push forward internal development through sharing knowledge
    and keeping on top of the newest technologies.

  Qualifications

  - Graduate in CS or related subject
  - Overall 3- 5 years experience as a developer in a team
    environment
  - Highly experienced with JavaScript, 3+ years
  - Good understanding of serverless architectures (AWS)
  - Expertise setting up infrastructure in AWS through code
    (Serverless, CDK, CloudFormation)
  - Experience working in cross-functional teams, alongside
    Designers, Product Managers, etc.
  - Experience doing backend applications using Node.JS,
    especially serverless microservices. Knowledge of
    serverless patterns
  - Technologies:
    - Javacsript/Typescript o Angular 2.0+/React o Nodejs
    - C#
    - MySQL
