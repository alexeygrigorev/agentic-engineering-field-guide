description: |
  Frontend Developer







  KEY RESPONSIBILITIES







  - Develop and maintain responsive, scalable, and user-friendly
    web applications.







  - Build reusable UI components using modern front-end
    technologies.







  - Translate UI/UX designs and business requirements into
    functional web applications.







  - Integrate front-end applications with REST APIs and backend
    services.







  - Optimize applications for performance, accessibility, and
    cross-browser compatibility.







  - Troubleshoot and resolve application issues.







  - Participate in code reviews, testing, and Agile development
    activities.







  - Collaborate with designers, backend developers, QA, and
    product teams.







  REQUIRED SKILLS







  - Hands-on experience with Angular, JavaScript, and
    TypeScript.







  - Proficiency in HTML5 and CSS3.







  - Experience with NGRX/Redux or similar state management
    frameworks.







  - Understanding of responsive web design and front-end
    architecture.







  - Experience with REST API integration.







  - Good knowledge of debugging, testing, and performance
    optimization.







  - Strong problem-solving and communication skills.







  QUALIFICATIONS







  - Bachelor's degree in Computer Science, IT, Engineering, or a
    related field.







  - 3+ years of experience in front-end development.







  - Experience building responsive and enterprise-grade web
    applications.







  - Experience working in Agile/Scrum environments.







  - Ability to work effectively with cross-functional teams.



  Compensation, Benefits and Duration



  Minimum Compensation: USD 40,000 Maximum Compensation: USD
  142,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full-time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
