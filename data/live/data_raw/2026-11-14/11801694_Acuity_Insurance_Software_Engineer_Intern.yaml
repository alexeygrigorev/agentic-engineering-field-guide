description: |
  Acuity is seeking a Software Engineer Intern to develop,
  test, and document software applications that support the
  business needs of Acuity. During the internship, you will
  use various programming languages and technologies to create
  user-friendly, efficient, and secure software solutions.
  while working with a team of engineers and business analysts
  following agile project methodologies and best practices to
  manage and complete assigned tasks.

  Start Date: Summer 2027.

  ESSENTIAL RESPONSIBILITIES:

  - Review user requirements and specifications to design and
    develop software applications that meet business needs and
    user expectations.
  - Provide input on planning for assigned work, including
    estimating, developing, testing, and target dates.
  - Update and maintain software applications, including fixing
    bugs, adding features, and improving performance.
  - Is knowledgeable of the data in the systems that their team
    oversees.
  - Write clean, efficient, and well-documented code using the
    appropriate programming language and framework for the
    project.
  - Test, debug, and troubleshoot software applications to
    ensure functionality, quality, and performance.
  - Document software applications, including user manuals,
    technical specifications, and system diagrams.
  - Follow coding standards, best practices, and department
    procedures for software development.
  - Consult with users, engineers, business analysts, or mentor
    to clarify software objectives and provide support and
    training.
  - Implement and integrate software applications with other
    systems and platforms, such as operating systems,
    databases, or web services.
  - Participate in regular and predictable attendance and
    complete mandatory training programs as determined by
    Acuity.
  - Perform other duties as assigned.

  EDUCATION:

  Junior or senior year college status in pursuit of
  bachelor’s degree in software engineering, computer science
  or related field.

  EXPERIENCE:

  Entry level.

  OTHER QUALIFICATIONS:

  - Basic familiarity with some or all of the following tools
    and technologies:
    - Languages: Java, C#, Python, JavaScript, or COBOL
    - Relational or non-relational databases, such as Db2, MySQL,
      MongoDB, PostgreSQL, Microsoft SQL Server
    - WebUI frameworks, such as Angular, React, Vue, SDF/CICS etc.
    - Version control tools, such as Git, SVN, etc.
    - Testing tools and frameworks, such as JUnit, ZUnit, Bruno,
      Postman, etc.
    - ETL processes and best practices, data governance (data
      quality and security), design and analyze data to answer
      business questions.
  - Analytical problem-solving ability.
  - Strong communication and collaboration skills.
  - Detail oriented with a focus on quality.

  *Acuity does not sponsor applicants for U.S. work
  authorization.*

  This job is classified as non-exempt.

  The pay rate for this position is $23.00 per hour. This
  salary range is an estimate, and the actual salary will vary
  based on applicant’s education, experience, knowledge,
  skills, and abilities.

  For internships, Acuity offers a generous 401(k)
  contribution, vision insurance, an Employee Assistance
  Program, and more. A full description of benefits and
  eligibility will be provided to candidates during the hiring
  process.

  We are an Equal Employment Opportunity employer. Applicants
  and employees are considered for positions and are evaluated
  without regard to mental or physical disability, race,
  color, religion, gender, national origin, age, genetic
  information, military or veteran status, sexual orientation,
  marital status or any other protected Federal,
  State/Province or Local status unrelated to the performance
  of the work involved.

  Acuity will include at least one in-person interview during
  the hiring process for all positions.

  If you have a disability and require reasonable
  accommodations to apply or during the interview process,
  including for in-person interviews, please contact our
  Talent Acquisition team at careers@acuity.com. Acuity is
  dedicated to offering reasonable accommodations during our
  recruitment process for qualified individuals.

  Equal Opportunity Employer This employer is required to
  notify all applicants of their rights pursuant to federal
  employment laws. For further information, please review the
  Know Your Rights notice from the Department of Labor.
