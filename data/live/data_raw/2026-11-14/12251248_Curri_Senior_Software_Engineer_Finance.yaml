description: |
  About the role:

  Curri is seeking a Senior Software Engineer, Finance to own
  the systems behind how money moves through the company, from
  the price a customer is quoted to what lands in our ERP.
  Every Curri delivery is a financial transaction: a customer
  gets billed, a driver gets paid, and finance closes the
  books. As we grow, our hardest problems are about money:
  getting paid faster, paying drivers accurately and on time,
  and giving finance numbers they can trust. This engineer
  will sit with the finance team, scope the problem directly,
  and ship the fix in weekly loops with AI as a force
  multiplier.

  What you will do:

  - Own finance problems end to end, working directly with
    finance, ops, sales, customers, and drivers to scope,
    ship, measure, and iterate on fixes.
  - Map and improve how financial data flows from quote and
    booking through invoicing, collections, and driver payouts
    into our ERP and reporting.
  - Build and expand integrations with payment processors, ERP
    and accounting tools, invoicing, and driver payout
    systems.
  - Ship smarter invoicing and billing options that make it
    easier for customers to pay on time and bring down DSO.
  - Build reconciliation, audit trails, and automated checks so
    every cent is accounted for and problems surface before
    finance finds them.
  - Ship full-stack in weekly loops across Go, TypeScript, Node,
    Postgres, NATS, Redis, and React/React Native, using
    Claude Code, Cursor, and Claude daily, and partner with
    Platform and Infrastructure on architectural decisions
    that scale.

  What you need to have:

  - 5+ years of full-stack engineering experience across backend
    services (Go, Node, TypeScript, Postgres) and React, with
    a product engineer mindset that owns outcomes rather than
    tickets and is comfortable starting from a Slack message
    instead of a fully written spec.
  - Strong systems thinking for money flows, including designing
    for retries, duplicate payment prevention, and data
    consistency across systems, with judgment about when to
    move fast and when to build for scale.
  - Rigorous attention to financial data quality, treating
    numbers as something that has to be right rather than
    roughly right and building in checks, reconciliation, and
    audit trails by default.
  - Clear, frequent communication with non-technical partners,
    asking the hard scope questions, explaining tradeoffs in
    plain language, and shipping visible progress rather than
    going dark for weeks.
  - Daily fluency with AI coding tools like Claude Code and
    Cursor, knowing when to plan, when to drive the agent, and
    when to write the line yourself, and reviewing AI output
    critically before it ships.

  Bonus points for:

  - Having shipped production code with Claude Code or a similar
    agent in the last six months, with a clear view of where
    it helped and where it led you astray.
  - Hands-on experience with the Stripe API or an equivalent
    payments platform, including payouts, invoicing, or
    Connect.
  - Speaking basic finance (DSO, AR/AP, reconciliation, revenue
    recognition, month-end close) and having partnered
    directly with finance or accounting teams.
  - Building or running high-volume financial systems where
    every cent mattered.

  What is in it for you?

  - Direct ownership of the systems behind Curri's money flows,
    with a direct line to the finance team and real influence
    on how we bill, collect, and pay at scale.
  - A lean, AI-forward engineering team where you ship product
    every week and experiment in the open instead of waiting
    for someone else to scope the work.
  - Competitive salary, equity compensation, and comprehensive
    benefits (health, dental, vision, 401K).
  - Remote-friendly, with the option to work from our Ventura,
    CA headquarters.
  - A high-growth, mission-driven environment where your work
    has direct and measurable impact.

  Who are we?

  We are Curri, and our mission is to build the network and
  software that move the world’s goods with speed,
  intelligence, and trust. Curri provides on-demand, last-mile
  logistics for construction and adjacent industries with our
  nationwide fleet of cars, trucks, and flatbeds. Founded in
  2018 and part of the YC S19 Batch, we’re solving the massive
  inefficiencies that exist in the construction industry. Our
  headquarters are in Ventura, CA. Learn more at curri.com.

  Curri is an equal opportunity employer and complies with all
  applicable federal, state, and local fair employment
  practices laws. All qualified applicants will receive
  consideration for employment. We don't discriminate based on
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, age, disability, veteran status,
  or any other characteristic protected by law.
