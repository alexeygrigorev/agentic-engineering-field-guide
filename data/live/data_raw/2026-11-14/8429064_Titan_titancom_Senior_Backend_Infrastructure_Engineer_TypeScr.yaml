description: |
  About Titan

  Despite decades of innovation in money, the most important
  consumer money domain remains largely untouched: wealth
  management. Legacy Wall Street institutions still dominate
  private wealth, gatekeeping their services behind extremely
  high minimums, janky user experiences, and layers of fees.
  They are, in our opinion, the "final boss" of consumer
  fintech.

  Our belief: every American deserves an elite wealth team
  navigating their capital, delivered at the cost and speed
  only humans working in harmony with AI can unlock.

  At heart, we're a small pack of hard-working rebels
  operating at the intersection of engineering craft and high-
  stakes financial precision. Every person here is a
  calibrated bet on what we're building next. Our mission is
  to rebuild what a wealth management firm means, from the
  ground up, brick by brick, leveraging technology across the
  entire stack, so that AI lets one wealth advisor deliver
  what used to take a team, serving clients a Wall Street team
  never could have reached.

  We're backed by a16z and Sam Altman, and currently power
  over $1 billion in assets under management.

  Why Join Titan

  For the right person, this will be one of the most rewarding
  roles they ever have.

  - Legacy-defining vision. Private wealth in every pocket isn't
    an incremental product. It’s not B2B automation. It’s a
    “before & after” moment in money.
  - The time is now. LLMs just unlocked what was impossible five
    years ago: truly personalized wealth management for
    everyone.
  - Outsized decision making. We're a small team by design.
    Every hire is precise, every role carries real weight, and
    your decisions disproportionately shape what we become.
  - Built in person, in the trenches. We're a high-touch, high-
    tempo group that works side by side. You’ll see our
    founders working in the trenches with the team everyday.
  - Ownership in every sense. Competitive cash and well-above-
    market equity. We believe in identifying only exceptional
    talent and compensating them generously.
  - World-class backing. Investors who share the bold vision:
    a16z, General Catalyst, Accel, Y Combinator, Sam Altman,
    Paul Graham, and more.

  Role Overview

  Titan engineers are building the systems to power a next-
  generation RIA prepared to scale well beyond our $1B AUM.
  Working alongside former founders, Google & Meta Engineers
  We are seeking a Senior Backend / Infrastructure Engineer to
  help architect, build, and scale the core systems that power
  our financial platform. You’ll work on our backend services,
  trading systems, real-time APIs, data pipelines, automated
  workflows, and infrastructure in ways that are secure,
  scalable, and resilient. This is a high-impact role where
  your technical decisions will directly affect platform
  reliability and performance at scale.

  Core Responsibilities

  - Design, build, and maintain backend services and APIs using
    Node.js and TypeScript.
  - Improve and extend the infrastructure that enables trading,
    account management, transaction processing, and portfolio
    automation.
  - Ensure high availability, performance, and security across
    backend systems powering millions of daily operations.
  - Build and enhance internal tools, data pipelines, and system
    integrations.
  - Extend our devOps/infrastructure to shape CI/CD, deployment
    automation, observability, monitoring, and incident
    response.
  - Champion best practices for code quality, system design,
    testing, and documentation.
  - Mentor junior engineers and drive architectural initiatives
    across the backend domain.

  Qualifications

  - 3 + years of professional experience building backend
    systems in TypeScript or comparable languages (Node.js
    preferred).
  - Strong backend fundamentals: APIs, microservices,
    distributed systems, data stores, caching, messaging
    systems.
  - Experience with database design (SQL & NoSQL), scaling
    patterns, performance optimization, and observability.
  - Deep experience with cloud platforms (AWS, GCP, Azure) and
    infrastructure as code.
  - Solid understanding of security practices for backend
    systems (authentication, authorization, data protection).
  - Strong analytical, problem-solving, and communication
    skills.
  - Ability to work effectively in a fast-paced, collaborative
    environment.

  What Makes You Stand Out

  - Experience building financial or real-time services.
  - Familiarity with automated portfolio, trading, or financial
    data systems.
  - Previous ownership of backend infrastructure or mission-
    critical systems.
  - Experience scaling apps used by tens of thousands of users
    with high throughput.
