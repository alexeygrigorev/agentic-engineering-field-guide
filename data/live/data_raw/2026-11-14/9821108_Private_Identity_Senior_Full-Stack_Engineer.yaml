description: |
  About Us

  Imagine a world where passwords are obsolete, and you never
  have to recall security questions about your first pet. At
  PrivateID, we're making this a reality with secure, self-
  managed digital identities that feel almost magical: think
  biometric sorcery meets cryptographic brilliance. Trusted by
  global brands for our privacy-first solutions, we're rapidly
  scaling to meet the soaring demand for passwordless, zero-
  trust technology.

  About the Role

  We are seeking C++ Engineers with at least 10 years of
  experience who can lead by example, take ownership of
  complex systems, and help scale our platform. You should be
  capable of working independently and collaborate in a fast-
  paced, high-accountability environment.

  Qualifications

  - C++: Demonstrated experience in C++ programming with a
    strong understanding of language features and best
    practices.
  - Multithreading and Synchronization in C++: Demonstrated
    experience on multi-threading and synchronization
    techniques in C++.
  - CMake Proficiency: Experience with CMake for configuring and
    building C++ projects.
  - Conan Package Management: Experience with Conan for managing
    dependencies in C++ projects.
  - Linux Administration: Knowledge in Linux system
    administration, including terminal operations, SSH, and
    basic server management.
  - Version Control with GitHub: Proficient in using GitHub for
    version control, branching, pull requests, and
    collaboration workflows.
  - CI/CD with GitHub Actions: Experience setting up and
    maintaining CI/CD pipelines using GitHub Actions
  - Unit Testing: Skilled in writing comprehensive unit tests to
    ensure code stability and quality.
  - Image Processing: Background in image processing with C++
    and OpenCV
  - Python: Experience in Python for application development and
    scripting

  Bonus Qualifications

  - Ctypes: Experience integrating C++ modules into Python using
    ctypes including managing shared libraries and data type
    conversions.

  Benefits

  - Competitive compensation and equity
  - A remote-first, collaborative culture

  Important:

  Candidates must pass a background check as part of the
  hiring process due to our work in the financial sector.

  Equal Employment Opportunity

  PrivateID values diversity and is committed to providing an
  inclusive work environment where all employees can excel.
  Qualified applicants will be considered without regard to
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, disability, veteran status, or
  any other legally protected status. Reasonable
  accommodations are available upon request to ensure
  equitable participation in our hiring process and workplace.
