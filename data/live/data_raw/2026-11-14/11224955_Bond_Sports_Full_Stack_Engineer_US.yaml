description: |
  Description

  Bond Sports is looking for an experienced Mid-Level Full
  Stack developer to join our dynamic team. As a Mid-Level
  Full Stack Developer at Bond Sports, you will play a vital
  role in developing cutting-edge software solutions.

  You will work closely with our cross-functional teams to
  deliver high-quality projects, and your technical expertise
  will help shape the future of our products.

  Key Responsibilities:

  1. Full Stack Development:

  - Develop and maintain full-stack applications, following
    coding standards and best practices.
  - Collaborate with the team to ensure code quality and
    contribute to design and code reviews.

  2. Development Lifecycle Support:

  - Assisted in architectural discussions and ensured alignment
    with project goals and standards.
  - Work with cross-functional teams to enhance the development
    lifecycle and productivity.

  3. Learning and Growth:

  - Continuously learn and stay updated on emerging technologies
    and trends.
  - Actively participate in the team's growth by sharing
    knowledge and collaborating with peers.

  Requirements

  Qualifications:

  - 5+ years of experience in full-stack web development.
  - Proficiency in technologies such as Node.js, React, and
    TypeScript.
  - Experience with a server-side language, preferably NestJS
    (e.g., Node.js, Python, Java, C#).
  - Familiarity with front-end frameworks like React, Angular,
    or similar.
  - Exposure to cloud platforms such as AWS or GCP.
  - Knowledge of databases, analytics, cloud architecture, and
    data pipelines & ETLs.
  - Bachelor's degree in Computer Science (or related field)

  Desired Attributes:

  - Eagerness to learn and grow in a dynamic environment.
  - Strong communication skills and the ability to collaborate
    effectively.
  - A proactive mindset with the flexibility to adapt to
    changing priorities.
  - A passion for technology and a desire to contribute to
    innovative solutions.

  Compensation: $150-200K annually, commensurate with
  experience.
