description: |
  Major League Baseball is looking for a Software Engineer to
  join a cross-platform engineering group that ships our
  Mobile MLB App and MLB.TV Connected TV experience focused on
  Streaming and Subscriptions.

  You will work in small, outcome-driven squads that rotate
  focus based on business priorities. Success means shipping
  reliable, high-quality user experiences while keeping
  platform parity with our other CTV stacks and aligning with
  our shared design system with other feature delivery teams.
  You will collaborate closely with product, design, QA, and
  partner teams across the organization.

  This position can be based out of our Boulder, Colorado or
  New York City office locations. Please be sure to select the
  appropriate office for which you wish to apply in the
  application.

  Responsibilities

  - Design, build, test, and ship features on multiple surfaces
    with emphasis on media playback and subscription flows
  - Partner with engineers on other platforms to deliver
    consistent behavior and shared contracts (APIs, analytics,
    entitlements, UX rules)
  - Contribute to code quality, observability, and release
    readiness (crash reduction, performance, feature flags,
    rollback-friendly delivery)
  - Participate in squad planning, estimation, and
    retrospectives; occasionally serve as mission tech lead
    for a focused initiative
  - Integrate with our design library and token-based UI
    patterns; raise gaps early with design and platform owners
  - Review code, mentor peers, and improve engineering practices
    within the team

  Qualifications & Skills

  Required

  - 3+ years of professional software engineering experience
  - Strong experience building and shipping iOS applications in
    production (Swift; UIKit and/or SwiftUI)
  - Solid understanding of mobile architecture, networking,
    state management, and error handling
  - Experience collaborating in cross-functional teams (product,
    design, QA) with clear ownership and communication
  - Comfort working in fast release cycles with testing,
    monitoring, and incremental rollout practices
  - Pragmatic approach to tradeoffs: clarity, maintainability,
    and user impact over perfection

  Strongly preferred

  - Experience with tvOS / Apple TV (focus engine, remote
    interactions, TV-safe UX patterns)
  - Background in video streaming (players, playback lifecycle,
    DRM-adjacent workflows, QoE) and/or subscriptions
    (purchase, restore, entitlements, paywalls)
  - Familiarity with analytics instrumentation and experiment-
    friendly feature delivery
  - Experience adopting or contributing to a shared design
    system (components, tokens, accessibility standards)
  - Exposure to Android / Android TV / Fire TV or willingness to
    learn cross-platform parity practices
  - Strong focus on architectural intent, system design, and
    code verification guardrails when overseeing AI-generated
    implementations
  - Experience strategically applying AI tools for high-impact
    engineering tasks, such as generating unit tests,
    documentation, and managing technical debt/refactoring

  Salary Range: $120,000 - $155,000 (Base Salary) + Bonus

  As a candidate for this position, your salary and related
  aspects of compensation will be contingent upon your work
  experience, education, skills, and any other factors MLB
  considers relevant to the hiring decision. In addition to
  your salary, MLB believes in providing a competitive
  compensation and benefits package for its employees.

  Top MLB Perks & Benefits

  - Competitive Benefits Package
  - Company 401K Contribution
  - Paid Time Off and Holidays
  - Paid Parental Leave
  - Access to Free Tickets to Baseball Games & MLB.TV
  - Discounts at MLB Store | MLBShop.com
  - Employee Assistance Programs (EAP)
  - Onsite/Online Training & Development Programs
  - Tuition Reimbursement
  - Disability Benefits (short term and long term)
  - Life and Accidental Death Insurance
  - Pet Insurance

  Why MLB?

  Major League Baseball (MLB) is the most historic of the
  major professional sports leagues in the United States and
  Canada. Employees love working at MLB because of the culture
  of growth, teamwork, and professionalism. Employees who are
  most successful at MLB take initiative, know how to identify
  problems and provide solutions, and always put the Team
  first. For those ready to step up to the plate and join the
  major leagues, MLB takes the same approach as teams do with
  their players: empowering our “workforce athletes” to be at
  their best by engineering experiences that put employees in
  the best position to succeed. Major League Baseball is
  looking for candidates who are passionate about growing
  America’s pastime to best serve its fans for decades to
  come.

  California Residents: Please see our California Recruitment
  Privacy Policy for more details.

  Colorado Residents: Colorado based applicants may redact or
  remove age-identifying information such as age, date of
  birth, or dates of school attendance or graduation. You will
  not be penalized for redacting or removing this information.

  Applicants requiring a reasonable accommodation for any part
  of the application and hiring process, please email us at
  accommodations@mlb.com. Requests received for non-disability
  related issues, such as following up on an application, will
  not receive a response.

  Are you ready to Step Up to the Plate? Apply below!
