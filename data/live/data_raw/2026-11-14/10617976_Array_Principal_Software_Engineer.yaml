description: |
  Array is a financial innovation platform that helps digital
  brands, financial institutions, and fintechs get compelling
  consumer products to market faster. We deliver a suite of
  credit and identity monitoring tools, privacy protection,
  and a financial ads marketplace via embeddable widgets or a
  clean, modern API.  Our private label offerings help drive
  revenue and increase engagement for our customers while
  empowering millions of consumers to achieve their financial
  goals.

  As a remote-first company, we’re focused on providing
  opportunities for high performing individuals to have deep
  impact in the fast growing fintech space. A clear mission, a
  commitment to continuous improvement and a willingness to
  experiment empower us individually and together deliver the
  best products for our clients and users.

  The Principal Software Engineer is Array’s highest-level
  individual contributor in Engineering, with technical scope
  across the company. Working across products and alongside
  business and technology leaders, you’ll solve our most
  consequential engineering problems, turn ambiguity into
  action, and drive work through to measurable outcomes. Your
  leverage comes not only from what you build, but from making
  our systems simpler and the engineers around you more
  effective.

  This role reports directly to the SVP of Engineering and
  works across all of Array’s products and engineering teams.

  You Will:

  - Take on the engineering problems that matter most: Lead
    through ambiguity, define what success looks like, and
    drive consequential initiatives from uncertainty to
    measurable outcomes.
  - Make complex systems simpler: Improve our architecture,
    platforms, and engineering practices so they are easier to
    understand, change, operate, and scale.
  - Shape technical direction across Array: Bring strong
    judgment and clear recommendations, align teams around the
    right path, and turn technical strategy into execution.
  - Multiply the people around you: Raise the effectiveness of
    senior engineers and teams through coaching, better
    decisions, reusable patterns, and thoughtful technical
    leadership.
  - Own outcomes, not territory: Go wherever the highest-
    leverage engineering problems are, working across teams
    and domains without needing formal authority to make
    progress.
  - Stay close to the work: Use code, architecture, data, and
    production systems to build context and credibility while
    knowing when your greatest impact comes from enabling
    others.
  - Maintain a habit of using AI tools to think, build, and ship
    faster—it’s your default, not an afterthought.

  You Have:

  - A bachelor's degree in Computer Science, Engineering, or a
    related technical field.
  - 10+ years of professional software engineering experience,
    including experience operating at Staff, Principal, or
    equivalent scope.
  - Significant experience designing, building, and operating
    complex production systems, with breadth across
    architecture, delivery, reliability, performance, and
    operations.
  - A career history of increasing scope and leverage, with
    impact that extends beyond your own code or immediate
    team.
  - A default sense of urgency. You naturally look for ways to
    create momentum, shorten the path to an outcome, and move
    important work forward without waiting for deadlines,
    escalation, or someone else to prompt you.
  - The self-direction and ownership to thrive in a remote
    environment. You bring energy to the organization,
    communicate proactively, surface problems with possible
    solutions, and create clarity for yourself and others
    without requiring constant coordination or oversight.
  - The curiosity and humility to challenge your own
    assumptions, seek out context, disagree constructively,
    and commit fully once a direction is chosen.
  - A belief that AI is reshaping work, you instinctively use it
    to accelerate everything you do.

  Pay transparency: $200,000 + for base salary, depending on
  experience. Full time employee compensation includes an
  Incentive Stock Option (ISO) grant, subject to Board
  approval.

  Expected interview process: Recruiter Conversation - Hiring
  Manager Interview - Loop round.

  Expected onboarding process: Onboarding at Array is active,
  not passive: new hires spend their first two weeks building
  fluency in our products, customers, and value proposition,
  and are expected to pass scored assessments before beginning
  role-specific work. Success means meeting defined
  performance standards through a six-month evaluation period
  — with continuous feedback and ongoing accountability as
  core parts of working at Array.

  Array Offers All Full Time Employees the following Benefits
  and Perks:

  - Full medical, dental, and vision, premiums covered at 100%
    for full-time employees and 70% for dependents
  - Unlimited PTO and sick leave + 14 company holidays to
    encourage a healthy work-life blend
  - 100% 401k match up to 4% with immediate vesting
  - Generous and competitive parental leave for all parents
  - $1,000 desk setup subsidy to set-up your unique remote
    office
  - $100/month to subsidize wifi/cell phone expenses
  - Summer Fridays (half-day Fridays) typically from late May to
    the end of August
  - Commuter benefits for those who choose to go into our New
    York City office space

  Not sure if you meet the Qualifications? We know that folks
  tend to only apply if they check every box. If you think you
  have the appropriate qualifications, but don’t meet every
  single one, we encourage you to still apply. We’d love to
  hear from you.

  We are proud to be an equal opportunity workplace; we are
  committed to equal employment opportunity regardless of
  race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, gender identity or Veteran status. Array will
  provide reasonable accommodations to qualified applicants—if
  you need an accommodation to participate in the application
  or interview process, please email talent@array.com to make
  your request.

  Array uses CLEAR to conduct identity verification as part of
  the application process. We encourage you to review CLEAR’s
  Privacy Notice and Terms of Use to understand how your
  personal data will be processed.
