description: |
  At The Battery Network, we are leading the charge to turn
  yesterday’s batteries into tomorrow’s power.

  As the nation’s premier battery collection and recycling
  nonprofit, we’ve spent over three decades leading the charge
  toward a cleaner planet and a circular economy.



  We connect consumers, businesses, manufacturers, and
  municipalities through one trusted network. We provide
  education, collection, logistics, and compliance expertise,
  helping our partners stay ahead of regulation while
  capturing the critical materials that power the future. We
  keep valuable materials in circulation and out of
  landfills—reducing reliance on foreign supply chains,
  strengthening America’s energy independence, and protecting
  people, property, and the planet.



  We’re looking for passionate changemakers to help us scale
  our impact and shape the future of sustainability. If you're
  ready to turn purpose into action, you’ll thrive in our
  mission-driven, collaborative environment. Learn more at
  batterynetwork.org and follow us on Facebook, Instagram, or
  LinkedIn.

