description: |
  Company Overview:

  Join D/XYZ (d.xyz) to transform how venture capital is
  accessed and invested. We provide a transparent, equitable
  platform that allows our investors to engage with high-
  growth tech startups.

  Location:

  Remote (USA) with In-Person 2-day Retreats 4x a year

  Role Summary:

  The Investor Relations Manager will be responsible for
  managing communications and relationships with investors,
  ensuring they are kept informed and engaged with our
  progress and performance.

  Key Responsibilities:

  - Software Development: Design, develop, and implement
    software solutions that improve our investment platform's
    performance and scalability.
  - Technical Leadership: Mentor junior engineers and lead by
    example in all phases of the software development
    lifecycle.
  - Problem Solving: Tackle challenging software engineering
    problems and provide innovative solutions.
  - Quality Assurance: Ensure software quality by writing clean,
    efficient, and maintainable code, and by participating in
    code reviews.
  - Innovation: Stay abreast of the latest technology trends and
    use this knowledge to propose enhancements and tools for
    continuous improvement.

  Ideal Candidate:

  - Extensive experience in software development, preferably
    with a focus on financial technologies or platform
    services.
  - Proficiency in multiple programming languages such as Java,
    Python, or C#.
  - Strong understanding of software architecture, data
    structures, and modern design patterns.
  - Excellent problem-solving skills and a passion for technical
    challenges.
  - A collaborative team player with superior communication
    skills.

  Why Join D/XYZ?

  Working at D/XYZ means being part of a culture that values
  innovation, accountability, and inclusiveness. You’ll have
  the opportunity to impact a rapidly growing company and
  industry, work with a team of driven professionals, and
  contribute to a platform that is changing the face of
  investment. Here, your work enables a future where everyone
  can participate in the growth and success of the tech
  industry.

  Application Process:

  To apply, please submit your resume, a note detailing your
  interest and fit for the role, and two paragraphs about
  yourself.

  We look forward to learning how your skills and passions
  align with our mission of unlocking public access to private
  tech.
