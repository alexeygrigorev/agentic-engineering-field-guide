description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  As one of the fastest-growing technology companies in a
  massive industry, we're on a mission to build an exceptional
  engineering team and a transformative operating platform
  that will redefine real estate. We're seeking talented
  individuals at all levels to join us as we continue to grow
  our team.

  At Compass, we believe in fostering a diverse and inclusive
  community, ensuring that our place can be anyone's place.
  Our entrepreneurial principles spirit unites us, guiding our
  approach to the challenges ahead.

  As a Senior Software Engineer I and Senior Software Engineer
  II, you will join a world-class engineering team operating
  the only end-to-end platform in the real estate industry. We
  are building a high-caliber talent pool of Senior Engineers
  to lead technical initiatives across several key domain
  areas. For these roles, we are looking for Front End
  Engineers.

  Our Key Domains & Focus Areas

  Based on your background and interests, you will have the
  opportunity to align with one of our specialized domains:

  - Customer Relationship Management (CRM): CRM Insights is
    transforming Compass's CRM from a system of record into an
    intelligent system of action — using AI-driven insights to
    surface data patterns and proactively guide agents toward
    high-value activity. As the FE Lead, you'll shape a
    strategic, high-visibility product surface — building
    innovative dashboards, notifications, and reporting
    interfaces that make those insights actionable for
    thousands of agents.
  - Broker Productivity: Powers the scalability of brokerage
    operations by engineering a unified operating system that
    consolidates fragmented back-office workflows—including
    several back-office applications, APIs, tools and
    services—into a cohesive, data-driven ecosystem that
    eliminates manual dependencies and empowers brokerages to
    grow and operate profitably.

  What You Will Do

  - End-to-End Design & Build: Architect, build, and maintain
    high-performance, distributed, event-driven microservices
    and cloud infrastructure, while ensuring seamless
    integration with modern, intuitive frontend interfaces.
  - Drive Technical Delivery: Independently define, decompose,
    and lead the delivery of complex technical projects and
    subsystems across the entire stack.
  - Incorporate Intelligent Automation: Build and operationalize
    modern software patterns, including integrating AI models,
    data pipelines, and telemetry systems to automate
    workflows.
  - Champion Engineering Excellence: Perform rigorous code and
    design reviews, write high-quality automated tests (unit,
    integration, and end-to-end), and continuously leave
    codebases cleaner and more performant than you found them.
  - Own Your Domain: Act as a subject matter expert, creating
    clear technical documentation (architecture diagrams,
    runbooks, and specs) and owning your services and
    applications throughout their entire lifecycle.
  - Collaborate & Mentor: Work closely with cross-functional
    stakeholders to balance requirements, resolve systemic
    bottlenecks, and actively mentor peers to level up the
    engineering team.

  What We Look For

  - BS in Computer Science, Software Engineering, or equivalent
    practical experience.
  - 5+ years of experience developing comprehensive, well-
    tested, and high-performance software applications in
    Typescript, Javascript, and HTML/CSS
  - 5+ years of experience with React and NodeJS
  - 3+ years of experience using AWS / cloud technologies
  - A track record as a technical leader with cross-team impact
  - Understanding and adherence to industry-standard best
    practices in software development and architecture while
    keeping abreast of evolving technologies in AI
  - A sheer eye for design and attention to detail, the products
    you build should not merely be functional but should take
    in context and anticipate our customer’s needs in a
    beautiful way
  - Strong critical thinking skills, great communication skills
    and passion for delivering operational excellence
  - Strong familiarity with continuous integration/continuous
    delivery (CI/CD) pipelines, containerization, and
    Agile/Scrum methodologies
  - Excellent verbal and written communication skills with a
    strong sense of technical empathy for your end-users
    (whether they are real estate agents or fellow developers)
  - Nice to have: Experience with backend programming experience
    using languages such as Java, Golang, or Python
  - Nice to have: Experience with Kafka and event-driven
    systems, gRPC, Thrift, and other server-to-server
    communication protocols

  Compensation: The base pay range for this position is
  $176,800-$196,100 annually; however, base pay offered may
  vary depending on job-related knowledge, skills, and
  experience. Bonuses and restricted stock units may be
  provided as part of the compensation package, in addition to
  a full range of benefits. Base pay is based on market
  location. Minimum wage for the position will always be met.

  —-

  Check out Compass’s Engineering blog!

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



  Do your best work, be your authentic self.

  At Compass, we believe that everyone deserves to find their
  place in the world — a place where they feel like they
  belong, where they can be their authentic selves, where they
  can thrive.  Our collaborative, energetic culture is
  grounded in our Compass Entrepreneurship Principles and our
  commitment to diversity, equity, inclusion, growth and
  mobility. As an equal opportunity employer, we offer
  competitive compensation packages, robust benefits and
  professional growth opportunities aimed at helping to
  improve our employees' lives and careers.

