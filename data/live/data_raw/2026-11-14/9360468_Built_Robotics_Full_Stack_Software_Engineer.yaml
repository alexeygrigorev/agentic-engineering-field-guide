description: |
  WHO WE ARE

  Built Robotics’ mission is to build the robots that build
  the world. By automating repetitive tasks in the $300
  billion solar industry, Built is bridging the workforce gap
  to accelerate our transition to clean energy.



  WHAT YOU’LL DO



  - Design and build full-stack applications that allow our
    users to safely control and monitor our autonomous
    construction robots
  - Develop internal and customer-facing tools for robot
    command, control, monitoring, and analytics
  - Build scalable backend services and APIs that support robot
    deployments
  - Develop intuitive front-end interfaces for real-time
    robotics visualization and control
  - Improve reliability, scalability, and observability across
    distributed systems
  - Participate in rapid iteration cycles and deploy production
    code daily



  YOUR QUALIFICATIONS



  - BS or MS in Computer Science or related field
  - 3+ years of experience building production-grade web
    applications and backend systems
  - Strong proficiency in Python, TypeScript, JavaScript, or Go
  - Experience with React or similar frontend frameworks
  - Experience vibe coding to rapidly iterate on UIs and
    application functionality
  - Experience building scalable APIs and distributed systems
  - Interest in robotics, industrial automation, or operational
    software systems



  COMPANY PERKS



  - Competitive salary and equity
  - 100% employer-sponsored health, dental and vision insurance
    — for you, your spouse and children
  - 401(k) with employer matching
  - Paid holidays and flexible PTO
  - TSA PreCheck
  - Gym membership• Free catered lunch and plenty of snacks
  - A pair of steel-toe boots

  ABOUT THE COMPANY & ROLE

  Built Robotics’ mission is to build the robots that build
  the world. By automating repetitive tasks in the $300
  billion solar industry, Built is bridging the workforce gap
  to accelerate our transition to clean energy.

  The starting annual base salary range for this role is
  $140,000 to $185,000. Job level and actual compensation will
  be decided based on factors including, but not limited to,
  individual qualifications, working location, and market
  demands. The total compensation package for this role may
  also include: equity compensation, benefits such as medical,
  dental and vision insurance, 401(k) matching, paid time off,
  cell phone and internet reimbursement and more.

  Built Robotics provides equal employment opportunities to
  all employees and applicants for employment and prohibits
  discrimination and harassment of any type without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetics, protected veteran status, sexual
  orientation, gender identity or expression, or any other
  characteristic protected by federal, state or local laws.
  Built Robotics makes hiring decisions based solely on
  qualifications, merit, and business needs at the time.
