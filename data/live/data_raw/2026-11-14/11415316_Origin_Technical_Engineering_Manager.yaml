description: |
  About Origin

  Origin is building the endpoint AI observability platform
  for AI-adopting organizations. We believe that organizations
  should not adopt AI on their endpoints without observability
  in place, and we want to be the platform that maximizes the
  productivity & safety of that adoption.

  The company exists to maximize the diffusion of intelligence
  inside an organization, maximize the productivity of agentic
  systems and the humans driving them, keep agent actions
  traceable end-to-end so that when a user asks for something
  in a prompt they can verify the agent actually did what was
  expected, and give organizations one interface to answer the
  hardest questions they have about how work gets done.

  Our platform monitors and protects some of the most
  important organizations in the world. We are backed by
  Sequoia Capital, Brightmind Ventures, IA Ventures and other
  top VC firms.

  Role

  Origin is hiring a Technical Engineering Manager to manage
  the team responsible for our endpoint agent, data and
  inference services, cloud infrastructure, and customer-
  facing product. Reporting to the Engineering Lead, you will
  translate established priorities and technical direction
  into clear execution plans and keep the team tasked and
  aligned. You’ll stay close to the work through design
  reviews, code reviews, production debugging, and hands-on
  contributions when needed.

  The ideal candidate has led high performing teams as a
  technical or team lead and has managed and developed
  engineers directly. You bring sound judgment across people,
  projects, and systems, along with real experience directing
  agentic coding tools. You’re comfortable working with high
  agency in a fast-moving, AI-native environment.

  Responsibilities

  - Lead technical execution across the endpoint agent, backend
    services, inference pipelines, infrastructure, and
    frontend under the direction set by Engineering leaders.
  - Translate the priorities and technical direction set by
    Engineering leaders into clear plans, milestones, and
    owners.
  - Turn architecture and design decisions into implementation
    plans, break complex work into manageable pieces, and help
    the team make strong day-to-day technical decisions.
  - Manage, mentor, and develop engineers through clear
    expectations, regular feedback, coaching, performance
    management, and career development.
  - Run a simple, effective cadence for planning,
    prioritization, progress reviews, and retrospectives.
  - Hold the team accountable for commitments, quality, and
    follow-through. Identify delivery or performance issues
    early and address them directly.
  - Manage capacity, sequencing, and dependencies. Remove
    blockers and escalate scope, resourcing, or technical
    trade-offs when needed.
  - Take part in hiring and own the successful onboarding of new
    engineers.

  Skills and Experience

  - 5+ years in engineering leadership, including direct people
    management and experience as a technical or team lead,
    ideally at a startup.
  - Strong judgment about when to make a decision, when to raise
    a trade-off, and when to escalate to Engineering leaders.
  - A track record building or leading teams that work on data-
    intensive, high-throughput distributed systems.
  - Clear communicator who can give direct feedback, align a
    team, and explain technical trade-offs without
    overcomplicating them.
  - Real experience using agentic coding tools, like Claude
    Code, Codex, or OpenCode, with the judgment to validate
    their output, redirect them, and know when to take over.
  - High agency and comfort in an early-stage or fast-scaling
    environment where priorities shift.

  Nice to Haves

  - Background in observability or real-time monitoring
    infrastructure, such as Palantir, Datadog, Honeycomb, or
    Chronosphere
  - Background in AI infrastructure, particularly inference
    pipelines, embeddings, or agent orchestration
  - Experience as the first Engineering Manager, or an early
    Engineering Lead at a startup
  - Rust and Python fluency

  Working at Origin

  Origin is a fully remote team across the US & Canada, built
  on trust, autonomy, and excellence. We empower our team to
  take ownership, move with purpose, and continuously improve.
  Our culture values top performers who align with our mission
  and embrace high standards. We offer generous healthcare,
  flexible PTO, and home-office support, ensuring our team has
  the freedom and resources to thrive. While we move fast, we
  prioritize quality, collaboration, and remain committed to
  building impactful security solutions with precision.
