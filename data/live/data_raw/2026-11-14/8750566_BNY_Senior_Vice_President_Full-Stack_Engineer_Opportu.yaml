description: |
  Senior Vice President, Full-Stack Engineer Opportunities.

  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

  We welcome you to apply! When applying to this general
  posting, our expert BNY Talent Acquisition Team may also
  review your resume for consideration across other open roles
  within the company.

  We’re seeking a future team member for the role of Senior
  Vice President, Full-Stack Engineer to join our team. This
  role is located in London.

  Role Overview: BNY is seeking a Senior Vice President,
  Software Engineering to lead high-impact teams. This role
  encompasses end-to-end delivery ownership, elevating
  engineering standards, nurturing talent, and collaborating
  closely with product and business stakeholders. The aim is
  to create secure, resilient, and scalable systems. This
  opportunity is ideal for a hands-on leader who excels in
  agile environments and transforms complex business
  challenges into elegant, dependable solutions.

  In this role, you’ll make an impact in the following ways:

  - Lead and develop inclusive, high performing engineering
    teams; set clear objectives, coach talent, and build
    succession plans while representing engineering in program
    reviews and governance forums.
  - Own end to end delivery of mission critical software—from
    requirements and architecture to implementation, testing,
    deployment, observability, and reliability—while ensuring
    compliance and operational excellence.
  - Raise engineering excellence and resilience: enforce best
    practices and automation across code, testing,
    microservices/APIs, performance, and infrastructure;
    champion secure by design (secure coding,
    logging/monitoring, incident playbooks, disaster
    recovery).
  - Partner with product, design, and ops to turn outcomes into
    measurable technical plans, steer architecture
    modernization, integrations —aligned to BNY’s principles
    and pillars.

  To be successful in this role, we’re seeking the following:

  - Proven leadership of software engineering teams building
    distributed systems and microservices in agile
    environments such as Scrum or Kanban.
  - Hands-on AI development using modern tools and IDEs (e.g.,
    Windsurf) and familiarity with integrating AI into
    products.
  - Strong expertise in Java (preferably Spring) and
    architectural patterns for scalable, observable, and
    testable systems.
  - Proficiency in modern engineering practices including CI/CD
    (e.g., GitLab), automated testing (JUnit/Spock), code
    reviews, quality focused test-driven development, and
    DevOps culture.
  - Hands-on experience with containers (Docker) and private
    cloud infrastructure, alongside familiarity with service
    telemetry tools (e.g., Splunk, AppDynamics).
  - Track record of talent development including hiring,
    coaching, performance management, and building
    collaborative, learning-focused teams.
  - Dedication to understanding the business domain and
    translating product strategy into architecture and
    delivery plans.
  - Corporate Actions domain experience strongly preferred.
  - Experience with JavaScript/TypeScript and Angular for full-
    stack development contexts preferred.
  - Expertise in Spring Framework, software architecture, and
    API/platform design preferred.
  - Background in financial services, risk and controls, and
    regulated environments preferred.

