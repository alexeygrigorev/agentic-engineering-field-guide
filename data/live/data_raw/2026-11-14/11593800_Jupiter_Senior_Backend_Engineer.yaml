description: |
  About the Company

  Jupiter.co is transforming grocery shopping with a recipe-
  first, AI-powered experience. By seamlessly connecting
  recipe content with grocery purchases, Jupiter makes it
  simple for consumers to shop based on what they love to
  cook. Founded out of Stanford and backed by Y Combinator,
  NFX, and Khosla Ventures, Jupiter is positioned to capture a
  share of the $200B recipe-driven shopping market in the US.

  About the Role

  As a Sr. Backend Engineer at Jupiter, you'll play a crucial
  role in designing and developing robust, scalable backend
  systems. You'll implement innovative solutions to complex
  business problems, working closely with cross-functional
  teams to deliver high-quality products in the food industry
  space.

  Responsibilities:

  - Product Development: Analyze product requirements and
    translate them into technical solutions.
  - Software Design and Implementation: Design and implement
    backend services using Kotlin, Micronaut, and Spring
    frameworks.
  - API Development: Create RESTful APIs to expose backend
    services to frontend applications and third-party
    integrations.
  - Database Design and Optimization: Design and optimize
    relational databases (PostgreSQL) and NoSQL databases
    (Elasticsearch).
  - Asynchronous Processing: Implement background jobs and
    event-driven architectures using RabbitMQ.
  - AI Integration: Use AI tools to automate data classification
    and structuring.
  - Test Automation: Write and maintain unit, integration, and
    end-to-end tests.
  - Deployment and Monitoring: Deploy and monitor backend
    services in cloud environments (GCP) using Docker,
    Kubernetes, and Terraform.
  - Performance Optimization: Identify and resolve performance
    bottlenecks.
  - Code Review and Collaboration: Actively participate in code
    reviews and collaborate with team members to maintain high
    code quality.

  Qualifications:

  - 3+ years of backend development experience, focusing on JVM
    languages (Kotlin required)
  - Proficiency in backend frameworks like Micronaut or Spring
  - Experience with relational (PostgreSQL) and NoSQL
    (Elasticsearch) databases
  - Solid understanding of object-oriented, functional, and
    reactive programming paradigms
  - Experience with cloud platforms (GCP) and containerization
    (Docker, Kubernetes)
  - Strong knowledge of RESTful API design and development
  - Experience with asynchronous programming and message queues
    (RabbitMQ)
  - Proficiency in writing clean, well-tested code
  - Experience with AI and machine learning tools is a plus
  - Excellent problem-solving and debugging skills
  - Strong communication and collaboration skills

  What We Offer:

  - Opportunity to work on cutting-edge technologies and
    innovative products
  - A collaborative and supportive remote work environment
  - Competitive compensation and benefits package
  - Continuous learning and development opportunities
  - A small team with big values:
    - Progress First → Perfect Next
    - Seek Data → Use Data
    - Take Decisions → Own Outcomes
    - Serve Customers → Earn Patrons

  Salary:

  The expected annual salary range for this role is $100,000 -
  $150,000. However, the starting base pay will depend on a
  number of factors including the candidate’s location,
  skills, experience, market demands, and internal pay parity.

  If you're passionate about building scalable, reliable
  backend systems and want to join a dynamic team, we
  encourage you to apply.

  EEO Policy Statement

  Jupiter is an equal opportunity employer, committed to
  providing a workplace free from discrimination. We value the
  diverse backgrounds and perspectives of our employees and
  applicants, and do not discriminate based on race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age, disability, genetic information, marital
  status, veteran status, or any other protected status under
  applicable laws. We also provide reasonable accommodations
  for qualified individuals with disabilities.
