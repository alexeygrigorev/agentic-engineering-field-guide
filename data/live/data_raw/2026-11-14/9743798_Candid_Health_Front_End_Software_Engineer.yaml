description: |
  What you’ll be doing

  - You’ll contribute to Candid Health’s product development.
  - You’ll ensure there is UX consistency across various
    pages/components within the Candid app.
  - You’ll interact closely with our current and prospective
    customers, developing intuition around their biggest pain
    points and thinking of creative ways to address them.
  - You’ll play a critical role in shaping our engineering and
    broader company culture and help make this the best place
    we’ve ever worked.
  - You’ll ensure we’re using the most relevant front end
    libraries and tooling.
  - You'll have opportunities to build tooling and improvements
    for front-end dev ops.
  - You’ll be responsible for front end profiling and
    monitoring.

  Who you are

  - You have Bachelors of Science or Bachelors of Arts/Sciences
    in Computer Science, Computer Engineering, Mathematics, or
    similar degree.
  - You have 3+ years of experience in a Software Engineering
    position.
  - You have experience with HTML, CSS, React, Typescript, and
    API development.
  - You may have experience with server-side rendering, GraphQL,
    Tailwind, Firebase, and Codegen.
  - You have great instincts around UX / Design.
  - You take pride in your craft and enjoy building high-quality
    software but also believe that “done is better than
    perfect” and have good intuition around which corners are
    worth cutting and which aren’t.
  - You have a learner’s mindset and value teaching others.
  - You have a customer-first mindset.
  - You’re a clear and concise communicator; you enjoy the
    challenge of explaining complicated ideas in simple terms,
    both in-person and in writing.

  Pay Transparency

  The estimated starting annual salary range for this position
  is $150,000 to $200,000 USD. The listed range is a guideline
  from Pave data, and the actual base salary may be modified
  based on factors including job-related skills,
  experience/qualifications, interview performance, market
  data, etc. Total compensation for this position may also
  include equity, sales incentives (for sales roles), and
  employee benefits. Given Candid Health’s funding and size,
  we heavily value the potential upside from equity in our
  compensation package. Further note that Candid Health has
  minimal hierarchy and titles, but has broad ranges of
  experience represented within roles.

