description: |
  Senior Software Engineer

  Reports To: Team Lead Department: Software Development

  Location: Queretaro, MX – Hybrid



  At MTech Systems, our company mission is to increase yield
  in protein production to help feed the growing world
  population without compromising animal welfare or damaging
  the planet. We aim to create software that delivers real-
  time data to the entire supply chain that allows producers
  to get better insight into what is happening on their farms
  and what they can do to responsibly improve production.

  MTech Systems is a prominent provider of tools for managing
  performance in Live Animal Protein Production. For over 30
  years, MTech Systems has provided cutting-edge enterprise
  data solutions for all aspects of the live poultry
  operations cycle. We provide our customers with solutions in
  Business Intelligence, Live Production Accounting,
  Production Planning, and Remote Data Management—all through
  an integrated system. Our applications can currently be
  found running businesses on six continents in over 50
  countries. MTech has built an international reputation for
  equipping our customers with the power to utilize
  comprehensive data to maximize profitability.

  With over 200 employees globally, MTech Systems currently
  has main offices in Mexico, United States, and Brazil, with
  additional resources in key markets around the world. MTech
  Systems USA’s headquarters is based in Atlanta, Georgia and
  has approximately 90 team members in a casual, collaborative
  environment. Our work culture here is based on a commitment
  to helping our clients feed the world, resulting in a
  flexible and rewarding atmosphere. We are committed to
  maintaining a work culture that enhances collaboration,
  provides robust development tools, offers training programs,
  and allows for direct access to senior and executive
  management.





  Job Summary

  We are looking for a Software Development Engineer to join
  the Solutions team. Our team is looking for a motivated
  professional who is skilled in software development,
  delivering high quality products, and building multifaceted
  enterprise applications for a diverse and growing
  international client base. We are proud to foster a
  workplace that promotes teamwork, advanced development
  tools, training, and continuous engagement with senior and
  executive management.

  Responsibilities and Duties

  Will contribute to building multifaceted enterprise and
  customized applications for a diverse and growing
  international client base. Tasks will include:

  - Develop, maintain, and enhance web applications, internal
    tooling/libraries and shared components focusing on
    usability, scalability, and innovation.
  - Engage in collaborative work with cross-functional teams to
    ensure high-quality software delivery.
  - Participate in code reviews, contribute to technical
    documentation, and exchange knowledge with colleagues,
    promoting a culture of continuous learning and
    development.

  Education and Experience

  - B.S. Computer Science or related, equivalent experience
  - 4+ years of experience with TypeScript, JavaScript, and/or
    C#, preferably in developing large-scale web applications.
  - Over 4 years of practical experience working with Angular,
    ASP.NET Core, or related technologies in a professional
    environment.

  Qualifications and Skills

  - Can speak, read, write in English on a proficient/advanced
    level
  - Strong understanding of software development principles,
    design patterns, and best practices.
  - Experience with cloud solutions (Microsoft Azure), mobile
    app frameworks (Ionic), database management (SQL Server),
    continuous integration and delivery (Azure DevOps),
    messaging frameworks (NServiceBus), end-to-end testing
    (Cypress), and familiarity with OpenAI technologies.

  EEO Statement Integrated into our shared values is MTech’s
  commitment to diversity and equal employment opportunity.
  All qualified applicants will receive consideration for
  employment without regard to sex, age, race, color, creed,
  religion, national origin, disability, sexual orientation,
  gender identity, veteran status, military service, genetic
  information, or any other characteristic or conduct
  protected by law. MTech aims to maintain a global inclusive
  workplace where every person is regarded fairly, appreciated
  for their uniqueness, advanced according to their
  accomplishments, and encouraged to fulfill their highest
  potential. We believe in understanding and respecting
  differences among all people. Every individual at MTech has
  an ongoing responsibility to respect and support a globally
  diverse environment.
