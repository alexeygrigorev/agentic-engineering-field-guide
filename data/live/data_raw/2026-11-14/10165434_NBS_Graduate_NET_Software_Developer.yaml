description: |
  Company Description

  NBS provide market leading Software as a Service solutions
  (SaaS) to construction industry professionals and are proud
  to be leading the construction industry in its digital
  evolution. We have developed and produced NBS products which
  support the built environment for over 40 years.

  Job Description

  We have a great opportunity for a Graduate .NET Developer to
  join us at our award winning office in Newcastle city
  centre, a few minutes’ walk from Central Station. You will
  work as part of a large agile Software Development team
  incorporating Infrastructure Engineers, Software Developers,
  Product Managers, Software Testers and UX Designers to
  deliver world leading products to our customers.

  Our Graduate programme will give you exposure to a number of
  different projects and technologies whilst gaining valuable
  Microsoft Certified Professional (MCP) qualifications along
  the way. If you're an ambitious individual who lives and
  breathes code and want to make you're first real major step
  into a career within development then this could be the
  perfect role for you!

  What we do:

  NBS provide market leading Software as a Service solutions
  (SaaS) to construction industry professionals and are proud
  to be leading the construction industry in its digital
  evolution. We have developed and produced NBS products which
  support the built environment for over 40 years.

  What will you be doing?

  Working with one of our experienced Development team’s you
  will be contributing to the ongoing development of our
  underpinning platform services using technologies in the
  Microsoft .NET stack. We want you to have an appetite for
  personal development as you will learn best practice
  programming principles alongside your MCP qualifications.

  Working with our team of UX Designers, Software Developers,
  Product Managers and Testers you will be learning to write
  clean code which follows best practice. You should be a
  confident communicator who can contribute to our processes,
  proactively giving feedback.

  Our agile teams are self-managing and motivated by
  delivering incremental and visible business benefit. We
  thrive on collaborating with our peers to find solutions
  together.  We are all about development so you will feel
  right at home if you have a passion for software development
  and look to develop yourself continuously.

  Qualifications

  A degree or equivalent in a Computer Science related
  discipline.

  Knowledge of Agile and/or Scrum

  Knowledge of .NET Core, C#

  Familiarity with Microsoft Visual Studio/ Visual Studio Code

  A real passion for software development

  Good problem solving skills

  Additional Information

  You’ll enjoy a superb benefits package including 25 days
  holiday plus bank holidays. In addition you will receive a
  day’s holiday to use on your birthday, as well as a half day
  in December for you to do some Christmas shopping. We offer
  a competitive pension scheme, 2 days of paid leave so you
  can volunteer in the local community, eye care and child
  care vouchers. Above and beyond these benefits we also have
  an onsite gym, cycle to work scheme and have fresh fruit
  available daily! We have one of the best office coffee
  machines around, all drinks and fruit are complimentary
