description: |
  🌐 Who We Are

  Bankjoy is a Y Combinator and Bessemer Venture Partner
  backed FinTech startup. We are changing the way community
  banks and credit unions do business, enabling them to become
  tech-driven and digital first. Bankjoy provides modern
  digital banking products including mobile banking, online
  banking, online account opening, loan origination, and
  conversational AI. Our mission is to revolutionize banking
  tech infrastructure by leading digital transformation at
  financial institutions — big and small.

  💼 The Role

  As a Senior Software Engineer within our Digital Banking
  platform, you will be instrumental in the development and
  maintenance of robust, secure, and scalable software
  solutions to power our digital banking platform. You will
  collaborate closely with cross-functional teams to deliver
  high-quality software that enhances the online banking
  experience for our customers while ensuring compliance with
  regulatory standards.

  🧠 What You’ll Do

  - Lead the implementation of new features and enhancements on
    existing products, demonstrating ownership and expertise.
  - Design, develop, and maintain front-end applications using
    modern frameworks (e.g., Angular, React) and best
    practices.
  - Architect and build scalable, secure APIs to support new
    features and products.
  - Proactively identify and address technical challenges,
    refactor code to reduce technical debt, and promote best
    practices across the team.
  - Collaborate with cross-functional teams and third-party
    vendors to deliver projects on schedule and with high
    quality.
  - Drive test-driven development and implement robust testing
    strategies across the technology stack.
  - Provide technical guidance and mentorship to junior and mid-
    level engineers.
  - Actively participate in Agile ceremonies and contribute to
    continuous process improvements.

  🎯 What You Bring

  - 6+ years of professional experience in enterprise-level
    software development with C# and .NET Core, delivering
    scalable and secure products.
  - 4+ years of experience in front-end development with Angular
    or React, TypeScript, HTML, and CSS.
  - 4+ years of SQL experience, including query optimization,
    index management, and performance tuning.
  - Proven experience in designing scalable APIs and integrating
    third-party SDKs or platforms.
  - Strong knowledge of cloud hosting platforms (e.g., AWS,
    Azure, GCP) and cloud-native practices.
  - A track record of working in high-growth or startup
    environments, demonstrating adaptability and ownership.
  - Exceptional problem-solving skills, communication, and a
    collaborative mindset.
  - Bachelor’s degree in Computer Science, Computer Engineering,
    or equivalent experience.
  - Candidates MUST be located in Canada to be considered for
    this opportunity

  Preferred Skills

  - Experience with transaction processing systems in FinTech
    domain
  - Experience with user access and permission management
  - Familiar with banking domain and operations

  🎁 What You Get

  - A fast-paced and collaborative environment
  - Competitive compensation
  - Stock options at a well-funded startup
  - We cover 100% of medical, dental, and vision premiums for
    individuals on our base plan, with significant
    contributions toward all other plan options (USA).
  - We cover 100% of extended medical, dental, and vision
    premiums for you and your family under our single,
    comprehensive plan (Canada).
  - Retirement plan with 4% company matching
  - 8 weeks paid parental leave for birthing parents, 4 weeks
    for non-birthing
  - 3-5 weeks PTO depending on tenure
  - 5 health days
  - 15 holidays
  - End of year shutdown
  - Performance-based bonuses
  - Remote first culture

  ⚖️ Equal Employment Opportunities at Bankjoy

  Bankjoy is committed to hiring talented and qualified
  individuals with diverse backgrounds for all of its tech,
  non-tech, and leadership roles. Bankjoy provides equal
  employment opportunities (EEO) to all employees and
  applicants for employment without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age or disability.

  🤖 Use of AI In Hiring

  We use AI-assisted tools in Ashby to help review
  applications. A member of our team reviews every application
  and makes all hiring decisions.

  🤝Accessibility and Accommodations  Bankjoy is committed to
  an accessible recruitment process. Accommodations are
  available on request at every stage. Email
  bankjoyhr@bankjoy.com to let us know what you need.
