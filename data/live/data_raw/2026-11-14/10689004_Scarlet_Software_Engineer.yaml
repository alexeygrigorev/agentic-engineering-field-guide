description: |
  We pull medical technology from the future to solve human
  health.



  Scarlet is authorised to assess and certify medical devices.
  We combine clinical, technical and regulatory expertise with
  AI agents and software so rigorous certification can keep
  pace with product development at the world’s most ambitious
  technology companies, without lowering the safety bar.

  Our customers have cut a year or more from their
  certification timelines for new AI-enabled medical devices
  and shortened product-update cycles from months to weeks.
  You’ll join a team building the infrastructure that makes
  these outcomes repeatable at scale.

  About the role

  As a Software Engineer at Scarlet you will build software
  that streamlines and accelerates complex regulatory
  processes without sacrificing quality. Our engineering
  problems are plenty, and we have chosen Clojure as the tool
  to solve them. We aspire to shape and nurture an engineering
  team where every team member:

  - Really cares about our customers.
  - Works cross-functionally with engineers, product managers,
    designers, regulatory experts and other stakeholders.
  - Collaborates on solving hard, important, real-world
    problems.
  - Helps bring out the best in each other and support each
    other’s growth.
  - Brings a diverse set of experiences, backgrounds and
    perspectives.
  - Feels that what we do day-to-day is deeply meaningful.

  We all have our fair share of experience working with
  startups, open source and various problem spaces. We wish to
  expand the team with team members who can balance our
  strengths and weaknesses and help Scarlet build fantastic
  products Our ways of working are guided by a desire to
  perform at the highest level and do great work.

  - Low/no scheduled meetings: Keep meetings to a minimum - no
    daily stand-ups or agile ceremonies.
  - Asynchronous collaboration: Have rich async discussions and
    flexible 1:1s as needed.
  - High trust and autonomy: Everyone solves problems, we are
    responsible for our choices and communicating them with
    our teammates.
  - Getting together: We meet a minimum of twice a year for a
    week at our offices in London.
  - Pick your tools: We believe in engineering excellence and
    trust you to use the tool set you feel most productive
    with.

  Responsibilities

  - Build products and services that our users love.
  - Streamline and accelerate complex regulatory processes
    without sacrificing quality to enable excellent safety
    assessments of our customers' products.
  - Continuously ship great functionality at a high cadence -
    and have fun while doing it.
  - Build and maintain a tech stack that embraces the complex
    domain in which we work.

  Required qualifications

  - 3+ years of professional programming experience
  - Professional full-stack web development experience.
  - Superb written and verbal communication.
  - Evidence that you think independently, creatively and from
    first principles.
  - Evidence that you are driven to understand why things are
    the way they are.
  - Excited to travel to the London office for one week twice a
    year and for your first week of onboarding.

  Preferred qualifications

  - Professional Clojure experience.
  - Previous experience in the health-tech or regulatory space.
  - Live within +/- 2h of the UK’s timezone.

  The interview process

  - Intro chat with Niclas - 45 mins
  - Technical knowledge chat with an engineer - 60 mins
  - Product chat with Johnny - 30 mins
  - Coding session with Niclas - 60 mins
  - Culture fit chats with our co-founders Jamie and James - 20
    mins each
  - Offer & referencing

  We want your experience with Scarlet to be a good one, and
  we do our utmost to ensure that you feel welcome throughout
  the interview process.
