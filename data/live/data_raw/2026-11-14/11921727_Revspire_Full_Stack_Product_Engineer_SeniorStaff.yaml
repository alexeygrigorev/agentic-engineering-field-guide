description: |
  Full Stack Product Engineer (Senior/Staff)

  Revin · Flatiron, New York City

  $225,000–$325,000 base salary + meaningful equity · Full-
  time

  Four days per week in our Flatiron office, with one remote
  day and flexibility when life comes up. We are hiring at
  Senior and Staff levels. Final compensation depends on
  level, based on your demonstrated experience, scope of
  ownership, and impact.

  About Revin

  Revin builds AI-powered software for the businesses that
  keep our homes running: roofing, HVAC, plumbing, remodeling,
  and more. We help these businesses respond to customers,
  book appointments, and manage the customer experience across
  voice, SMS, and email.

  Revin handles around half a million customer conversations a
  month. Businesses with hundreds of millions in annual
  revenue rely on our products for work that directly affects
  their customers and their bottom line.

  Our customers include Vertex Service Partners, a national
  roofing and exterior-services platform with over $600M in
  revenue, and Del-Air, a $300M+ HVAC and plumbing business.
  See the impact of our work: we’ve helped Del-Air book
  11,000+ membership appointments, while ImproveIt uses Revin
  to set 34% of its booked appointments.

  The Role

  We’re looking for a strong engineer who combines technical
  ability with product judgment, curiosity about customers,
  and an eye for good user experience.

  You’ll partner closely with our product manager to decide
  what we build and how we build it. One PM oversees our
  entire product, so engineers have substantial responsibility
  for shaping solutions, challenging assumptions, and
  influencing the roadmap. We work from clear product briefs
  and give engineers the independence to make decisions and
  carry them through.

  You’ll own customer-facing product work from the initial
  problem through launch and iteration. Success means
  customers adopt what you build, it makes their work better,
  and you can demonstrate that through usage and outcomes.

  We use AI programming tools heavily. You should be excited
  about how much a capable generalist can accomplish with
  these tools and bring the judgment to deliver high-quality
  results.

  What You’ll Build

  - A unified messaging workspace. A single place where customer
    service teams see voice, SMS, and email communication and
    handle agent escalations.
  - Embedded booking experiences. Interfaces that let customers
    schedule appointments directly on a service provider’s
    website.
  - Agent management tools. Experiences that help operators
    maintain and improve how their AI agents work.
  - Reporting and analytics. Products that help customers
    understand interaction outcomes, assess quality, and
    identify opportunities to improve.
  - Revin’s API and MCP interfaces. Developer interfaces that
    enable other software and AI agents to work with our
    platform.

  What You’ll Do

  - Own products and features end to end. Understand the
    customer problem, shape the solution, build across the
    interface, APIs, and data layer, and improve it after
    launch.
  - Help shape our roadmap. Bring ideas and informed opinions.
    Work with product to weigh customer value against
    technical complexity, timelines, cost, and reliability.
  - Build thoughtful customer experiences. Create intuitive,
    polished interfaces in TypeScript and React, including the
    details that make complex workflows feel simple.
  - Measure adoption and impact. Define success metrics, build
    the instrumentation to track them, and use data and
    customer feedback to decide what to improve next.
  - Keep work moving. Ship in short iteration cycles, surface
    blockers early, and advance other priorities while
    dependencies are resolved.
  - Raise the quality of our execution. Communicate tradeoffs
    clearly, use AI tools effectively, and take responsibility
    for testing, debugging, and the reliability of what you
    ship.
  - At Staff level, you’ll also help set direction across
    product areas and raise the effectiveness of the broader
    engineering team while remaining hands-on.

  What You’ll Bring

  - Substantial experience building products for external
    customers. You can walk us through products you owned, the
    decisions you made, what you learned from users, and how
    the product improved.
  - Fluency in TypeScript and React. You can follow a feature
    across the stack and learn unfamiliar systems.
  - Strong product judgment. You understand the business problem
    behind a request, question assumptions, and make sensible
    decisions when the answer isn’t fully specified. You bring
    opinions and adapt them as you learn.
  - Good instincts for user experience. You care about how a
    product feels and work closely with product and design to
    make it better.
  - Experience measuring what happens after launch. You’ve used
    instrumentation, adoption metrics, or experimentation to
    understand whether your work delivered value.
  - Independence and clear communication. You take initiative,
    make progress through ambiguity, and keep collaborators
    informed about decisions, risks, and changing
    expectations.
  - A desire to work in an early-stage startup. You’re energized
    by broad responsibility, rapid iteration, and the
    opportunity to make substantial improvements quickly.

  Nice To Have

  - Experience building products at a strong startup.
  - Experience with Python or PostgreSQL.
  - Experience shipping AI-powered products or production
    agents.

  Compensation and Benefits

  - $225,000–$325,000 base salary
  - Meaningful early equity. A real ownership stake and the
    opportunity to share substantially in the upside you help
    create
  - Excellent health coverage. $0 employee premiums for
    individual medical coverage on most plans, plus dental and
    vision insurance
  - 401(k) matching up to 4% of salary. Contribute 5% to receive
    the full match
  - Unlimited PTO
  - Commuter benefits
  - Free lunches and dinners in the office
  - $100/month gym membership stipend
  - Tech equipment of your choice
  - Mentorship pairing with a Revin advisor or investor
