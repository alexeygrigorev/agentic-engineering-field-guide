  Ok, now for some tough love. Here are the values we strive
  for at Allium:

  - Obsessiveness - The best people at Allium cannot put a
    problem down once they pick it up. We care more about the
    work than is strictly rational. Institutions trust us
    because our data is right. Right means caring about the
    small things. The decoded contract that ships with one
    wrong field. The label that is 99% accurate but wrong on
    the address that matters. The query that runs in 4 seconds
    when it should run in 400 milliseconds. Most companies
    tolerate these. We do not.Obsessiveness shows up as depth
    of care. It is not measured in hours worked or visible
    effort. You should feel something physical when work ships
    half-right. That instinct is what we hire for.
  - Pro Athlete Mindset - Consistency. Day in and day out, in
    pursuit of excellence. A win yesterday does not guarantee
    (or even imply!) a win tomorrow. I hope anyone who
    supports a failing sports team will feel the pain (cough
    Man United fans) of inconsistency
  - Figure It Out & Extreme Ownership - Every day is unexplored
    territory. There are new engineering frameworks, new legal
    docs, new compliance, new sales, new regulations, and new
    operational procedures every single day. If you don’t know
    it, learn it. If you can’t learn it, find someone or a
    product that does it. If you can’t find someone, find
    someone who can find someone. It is never a lack of
    resources, but lack of resourcefulness.
  - High Agency - (One of) the highest commonalities between all
    successful people is their responsiveness. Most successful
    billionaire CEOs still reply to emails within minutes
    (within working hours). And when you reply, respond fast
    with effective solutions - and even better, resolutions.
    If you’re looking for a superpower, you can’t go wrong
    with responsiveness. Well of course this doesn't make
    sense when you're an engineer coding in flow, but in
    general high agency of problem solving gets one very far
    in life
  - Leading from the Front - No one is going to listen (and
    adopt) your suggestion unless you lead by example. It’s
    one thing to say We need to do XYZ this better & it’s
    another thing to build an MVP and say “This is the way we
    should do things”. The proof of work and momentum goes a
    long way.
  - Strong Opinions On the Future (loosely held) - It is okay to
    be wrong, but what is not okay is not to have an idea of
    how a better future should be. Alliumites take pride in
    trying to improving everything about the company all the
    time.
  - Sense of (Allium) business smell - There are number of folks
    who live to eat at Allium, but the Allium smell we are
    talking about is that we love folks who naturally want to
    know why and how the work they are doing builds leverage
    for their teammates and also relates to the business goals

  About the team

  We invite people of all backgrounds
  (https://www.allium.so/about). We have engineers who learnt
  coding much later in life, who learnt coding on the side, we
  have engineers who are still in school and we also have
  engineers who went to the top schools (CMU, Stanford, UIUC,
  UPenn, Oxford, NUS, Cornell), all are welcome if one comes
  in with a curious mind and an infectious work ethic.

  Administrative Benefits

  - Medical, Dental, Vision, Life and AD&D insurance - US folks
    get 100% coverage for Gold plans, 80% for dependents
  - Ownership - Meaningful early-stage equity. Every full-time
    employee receives a stock option grant so you can share
    directly in Allium's upside
  - Time off - Flexible, trust-based paid time off. We encourage
    people to take the rest they need. In every country we
    hire, our policies meet or exceed local statutory vacation
    requirements
  - Retirement - Company sponsored 401(k) plan in US so you can
    save pre-tax for the long term

  All applicants have to answer this pop quiz: "What is an
  Allium? What is your favorite Allium?". Bonus points for the
  right pronunciation.
