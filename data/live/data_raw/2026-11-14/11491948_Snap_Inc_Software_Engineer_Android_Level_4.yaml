  that being together in person helps us build our culture
  faster, reinforce our values, and serve our community,
  customers and partners better through dynamic collaboration.
  To reflect this, we practice a “default together” approach
  and expect our team members to work in an office 4+ days per
  week.

  At Snap, we believe that having a team of diverse
  backgrounds and voices working together will enable us to
  create innovative products that improve the way people live
