description: |
  Snap Inc is a technology company. We believe the camera
  presents the greatest opportunity to improve the way people
  live and communicate. Snap contributes to human progress by
  empowering people to express themselves, live in the moment,
  learn about the world, and have fun together.

  The Company operates Snapchat, a visual messaging app that
  enhances your relationships with friends, family, and the
  world, and Specs Inc., a wholly-owned subsidiary dedicated
  to making computing more human, in addition to Bitmoji,
  Saturn, and other digital services.

  Snap Engineering teams build fun and technically
  sophisticated products that reach hundreds of millions of
  Snapchatters around the world, every day. We’re deeply
  committed to the well-being of everyone in our global
  community, which is why our values are at the root of
  everything we do. We move fast, with precision, and always
  execute with privacy at the forefront.

  We’re looking for an Android Engineer to join Snap Inc!

  What you’ll do:

  - Push the limits of mobile devices and build great user
    experiences
  - Build smooth, stable, and fun products
  - Develop features from design through implementation and
    launch
  - Evaluate technical tradeoffs of every decision and work with
    design on the best UI and infrastructure practices
  - Perform code reviews that guarantee code quality
  - Utilize AI tools and high velocity engineering workflows to
    design and ship scalable services while upholding rigorous
    standards for code correctness, security, and production
    ready quality code

  Knowledge, Skills & Abilities:

  - Ability to use Kotlin, Java, RxJava, Dagger, and other great
    tools to build smooth, stable, and fun products
  - Able to prioritize duties and work well on your own
  - Proficiency in, or a strong aptitude for, leveraging AI
    tools to streamline development, paired with the critical
    judgment to audit generated output for architectural
    integrity, performance bottlenecks, and security risks.
  - Adaptability in learning and applying evolving AI systems
    and tools to remain at the forefront of engineering trends
    and modern development practices

  Minimum Qualifications:

  - Bachelor's Degree in a relevant technical field such as
    computer science or equivalent years of practical work
    experience
  - 2+ years of post-Bachelor’s software development experience;
    or Master’s degree in a technical field + 1+ year of post-
    grad software development experience; or PhD in a relevant
    technical field
  - Experience with Android application development

  Preferred Qualifications:

  - Experience working with large-scale customer-facing mobile
    application

  If you have a disability or special need that requires
  accommodation, please provide us some information.

