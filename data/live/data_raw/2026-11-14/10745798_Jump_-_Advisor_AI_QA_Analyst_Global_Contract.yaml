  Job description

  Who are we?

  Hey there! We are Jumpapp.com, AI for Financial Advisors.
  Jump’s mission is to empower financial advisors, firms, and
  clients to thrive in the age of AI with smarter workflows,
  deeper insights, and enterprise-grade security and
  compliance. Jump leads its category in market share,
  customer satisfaction, and analyst rankings, and is rapidly
  growing. Jump was launched in 2023 by repeat entrepreneurs
  and is led by a team with backgrounds from Harvard,
  Stanford, Google, Snowflake, Bill.com, JPMorgan, Fidelity,
  Bain, EY, Bain Capital Ventures, Auditboard, Nitrogen, and
  more.

  Job Description:

  As a Quality Assurance Specialist, you will be responsible
  for thoroughly testing software changes, reporting bugs and
  creating test artifacts including but not limited to test
  cases, checklists, shared testing data. You will play a
  crucial role in ensuring our product meets the highest
  standards of quality while supporting and improving our
  release velocity. We’re looking for someone who can treat
  this as their primary professional commitment and be
  reliably available during agreed working hours. This role
  requires consistent focus throughout the week and is not
  well-suited for candidates juggling multiple full-time
  contracts.

  Skills and Qualifications:

  - Strong analytical and critical thinking skills to be able to
    evaluate, understand, and clarify requirements, and
    develop a testing strategy to cover the requirements
    adequately.
  - Ability to effectively troubleshoot, and prioritize bugs,
    including clear concise bug reporting.
  - Strong testing skills, and deep knowledge of various testing
    types.
  - Strong sense of ownership, and a proactive, independent
    problem-solving mindset.
  - Exemplary verbal and written communication skills, essential
    for effective asynchronous and remote collaboration.
  - Demonstrated success working independently in a fully remote
    environment. This role requires exceptional self-
    management, high autonomy, and the ability to effectively
    manage your time and projects with minimal oversight.
  - Positive attitude and growth mindset.
  - An eye for what slows teams down and an ability to surface
    opportunities for improvement.

  You have experience with:

  - Web, mobile, backend, AI tooling hands-on testing
  - Risk-based and context-driven testing
  - End-to-end testing ownership
  - Developing a subject matter expertise of the products and
    systems under test
  - Advocating for quality throughout the SDLC
  - Reviewing and analyzing requirements
  - Defining holistic testing approaches
  - Bug triages
  - Working closely with product and engineering from early
    stages of development

  What is the hiring process?

  - Intro screen call.
  - Paid 8-hour trial where you will be testing our app and
    reporting the bugs you find.
  - 60-minute deep dive into your background and QA approach.
  - 30-minute interview with the team to assess team fit.

  Our Culture

  We have a rigorous hiring process yet a kind and encouraging
  culture. We hire for a mix of experience, aptitude &
  attitude. Jump’s team values are High Velocity, World Class,
  and Direct + Kind + No Drama.

  Other info:

  - HQ based in SLC, Utah
  - You can work any hours aiming for at least 3 hours
    overlapping HQ's hours from anywhere outside of the United
    States

  About Jump

  Jump’s mission is to empower financial advisors and their
  clients to thrive in the age of AI. Jump’s primary product
  is an AI assistant helping financial advisors with their
  client meeting cycle and other workflows. Jump’s product is
  expanding to include many other advisor workflows, as well
  as into other finserv verticals. Jump leads its category in
  market share, customer satisfaction, and analyst rankings,
  and has grown rapidly. Jump customers include leading
  independent broker dealers such as LPL, Osaic, Raymond
  James, and Cetera, and leading RIAs including Focus
  Financial, Merit, Savant, Allworth, Sanctuary Wealth,
  Integrated Partners, and more. Jump was launched in 2023 by
  repeat entrepreneurs and is led by a team with backgrounds
  from Harvard, Stanford, Google, Snowflake, Bill.com,
  JPMorgan, Fidelity, Bain, Bain Capital Ventures, Auditboard,
  Nitrogen, and eMoney. Jump is a Series A company backed by
  top venture capital firms and industry strategics including
  Battery, Sorenson, Pelion, and Citi. Please consider joining
  us in our work to transform the client and advisor / rep
  experience in financial services by delivering cutting edge,
  practical, compliant AI technology to help those who help
  safeguard the financial future of everyday people everywhere
