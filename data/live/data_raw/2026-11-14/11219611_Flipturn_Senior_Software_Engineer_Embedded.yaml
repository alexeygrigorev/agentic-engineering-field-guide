description: |
  About us

  The rapid transition to electric vehicles (EVs) is the
  biggest change in transportation since the Model T. Flipturn
  is building the EV charging and energy platform for the next
  generation of sustainable transportation. We're already
  working with the largest forward-thinking Fortune 500 EV
  fleets across trucking, transit, and autonomous.

  Flipturn is now a part of Einride, a global company
  revolutionizing transportation by showing the world a new
  way to move, based on the latest digital, electric and
  autonomous technologies. Through a suite of EV charging and
  fleet solutions and freight capacity as a service
  operations, Einride enables businesses around the world to
  accelerate towards their sustainability goals. Einride’s
  customers include some of the world’s biggest shippers,
  including Fortune 500 companies.



  At Flipturn, you’ll:

  - Build a climate/sustainability-focused product, working on
    projects that directly impact real-life EV infrastructure
  - Collaborate with a team of extremely talented and mission-
    driven teammates (Stripe, Samsara, Google, MIT, UC
    Berkeley)
  - Work with modern technologies and best in class tools (ex:
    Yocto, TypeScript, GraphQL, AWS, Cursor, Claude)
  - Build for the long term as part of Einride, a global leader
    in EV and autonomous transportation technology

  The role

  This role is focused on the Flipturn Controller, a cutting-
  edge onsite control computer that integrates with EV
  chargers, batteries, generators, meters, and utility
  programs. You'll be involved in building major features,
  getting feedback from customers, driving the vision of our
  EV charging platform, and setting the culture of our
  engineering team.

  You'll work on projects like:

  - Integrating EV charging with on-site batteries and
    generators, utility programs, and other sources of control
  - Upgrading our embedded Linux systems, including build
    tooling (Yocto or similar), bootloaders, and board bring-
    up
  - Firmware and full-stack improvements to Flipturn's
    innovative energy management platform, for example helping
    customers participate in PG&E's Flex Connect program to
    get their sites up and running faster

  We're looking for people who have:

  - 4-7 years of experience in software engineering
  - 2+ years of experience with firmware development
  - Experience with embedded Linux systems – build tooling
    (Yocto or similar), bootloaders, and board bring-up
  - Interest in working on firmware/hardware projects as well as
    full-stack product development, as needed to deliver a
    fully working end-to-end product
  - Experience on a fast-moving industry-leading technology team
    and delivering products and features end-to-end
  - Interest in using AI tools to accelerate software
    development

  Benefits

  - Competitive compensation: The anticipated range for this
    position is $190,000 - $230,000 base salary per year, with
    an additional equity component
  - Comprehensive health coverage: Medical, dental, and vision
    plans, including PPO and HSA options.
  - Retirement savings: 401(k) plan with an employer match.
  - Generous time off: 25 days of Paid Time Off (PTO). 15 paid
    sick days and 15 paid US holidays observed.
  - Wellness allowance: To support your personal well-being.
  - Offices in NYC and Austin, as well as regular team bonding
    weeks with remote team members
