description: |
  At Braze, we have found our people. We’re a genuinely
  approachable, exceptionally kind, and intensely passionate
  crew.

  We seek to ignite that passion by setting high standards,
  championing teamwork, and creating work-life harmony as we
  collectively navigate rapid growth on a global scale while
  striving for greater equity and opportunity – inside and
  outside our organization.

  To flourish here, you must be prepared to set a high bar for
  yourself and those around you. There is always a way to
  contribute: Acting with autonomy, having accountability and
  being open to new perspectives are essential to our
  continued success.

  Our deep curiosity to learn and our eagerness to share
  diverse passions with others gives us balance and injects a
  one-of-a-kind vibrancy into our culture.

  If you are driven to solve exhilarating challenges and have
  a bias toward action in the face of change, you will be
  empowered to make a real impact here, with a sharp and
  passionate team at your back. If Braze sounds like a place
  where you can thrive, we can’t wait to meet you.

  WHAT YOU'LL DO

  We're looking for an Engineering Manager to lead our Landing
  Pages product, which builds the platform our customers use
  to create, host, and serve standalone web experiences —
  sign-up forms, preference centers, surveys, and other pages
  that capture first-party data directly into Braze user
  profiles. This includes a drag-and-drop editor and
  templating system, a hosting and delivery layer that serves
  those pages to end users at scale, APIs and integrations
  that write captured data back into the customer's workspace,
  and the reporting that shows marketers how their pages
  perform.

  Landing Pages is a newer part of the Braze platform that is
  expanding into a growing set of customer use cases, so this
  role is as much a product growth problem as an engineering
  one. As the manager of this team, you'll work closely with
  product, design, and the team's engineers to decide what to
  build next, validate those bets against real usage data, and
  rapidly grow adoption of the channel. You will recruit,
  coach, and develop the team's engineers. You will help solve
  major engineering challenges, by guiding key architectural
  decisions and (in certain high-leverage cases) via the code
  you write. Finally, you will have broad responsibility for
  the team's vision, goals, and processes. We greatly value
  colleagues who help make us better engineers and are
  excited, in turn, to learn from us. If that's you, we'd love
  to hear from you!

  WHO YOU ARE

  - 5+ years of software engineering experience with a strong
    track record of success, with 2+ years leading high
    performing teams
  - Thrive on a high level of autonomy and responsibility, while
    having the ability to dig into technical details to inform
    decisions
  - A strong product instinct and attention to detail, with a
    track record of building intuitive, high-quality user
    experiences
  - Experience building foundational systems at scale and
    spearheading software projects that significantly advanced
    the goals of your organization
  - Demonstrated success building, motivating, and retaining
    high-performing teams in high-growth environments

  For candidates based in the United States, the pay range for
  this position at the start of employment is expected to be
  between $188,641 and $320,335/year with an expected On
  Target Earnings (OTE) between $212,000 and $360,000/year
  (including bonus or commission). Your exact offer may vary
  depending on multiple individualized factors, including
  market location, job-related knowledge, skills, and
  experience. In addition to cash compensation, this role
  qualifies for a comprehensive Total Rewards package that
  includes equity grants of restricted stock (RSUs) so that
  you will own a piece of our company.

   #LI-Hybrid

  WHAT WE OFFER

  Braze benefits vary by location, and we encourage you to
  review our specific benefits offerings for each country at
  here. More details on benefits plans will be provided if you
  receive an offer of employment.

  From offering comprehensive benefits to fostering hybrid
  ways of working, we've got you covered so you can prioritize
  work-life harmony. Braze offers benefits such as:

  - Competitive compensation that may include equity
  - Retirement and Employee Stock Purchase Plans
  - Flexible paid time off
  - Comprehensive benefit plans covering medical, dental,
    vision, life, and disability
  - Family services that include fertility benefits and equal
    paid parental leave
  - Professional development supported by formal career pathing,
    learning platforms, and a yearly learning stipend
  - A curated in-office employee experience, designed to foster
    community, team connections, and innovation
  - Opportunities to give back to your community, including an
    annual company-wide Volunteer Week and donation matching
  - Employee Resource Groups that provide supportive communities
    within Braze
  - Collaborative, transparent, and fun culture recognized as a
    Great Place to Work®

  ABOUT BRAZE

  Braze is the leading customer engagement platform that
  empowers brands to Be Absolutely Engaging™ Braze helps
  brands deliver great customer experiences that drive value
  both for consumers and for their businesses. Built on a
  foundation of composable intelligence, BrazeAI™ allows
  marketers to combine and activate AI agents, models, and
  features at every touchpoint throughout the Braze Customer
  Engagement Platform for smarter, faster, and more meaningful
  customer engagement. From cross-channel messaging and
  journey orchestration to Al-powered decisioning and
  optimization, Braze enables companies to turn action into
  interaction through autonomous, 1:1 personalized
  experiences.

  The company has repeatedly been recognized as a Leader in
  marketing technology by industry analysts, and was voted a
  G2 “Best of Marketing and Digital Advertising Software
  Product” in 2025.

  Braze was also named a 2025 Best Companies To Work For by
  U.S. News and World Report, a 2025 America’s Greatest
  Companies by Newsweek, and a 2025 Fortune Best Workplace in
  Technology™ by Great Place To Work®, among other accolades.
  Braze is also proudly certified as a Great Place to Work® in
  the U.S., the UK, Australia, and Singapore.

  The company is headquartered in New York with offices in
  Austin, Berlin, Bucharest, Chicago, Dubai, Jakarta, London,
  Paris, San Francisco, São Paulo, Singapore, Seoul, Sydney
  and Tokyo.

  BRAZE IS AN EQUAL OPPORTUNITY EMPLOYER

  At Braze, we strive to create equitable growth and
  opportunities inside and outside the organization.

  Building meaningful connections is at the heart of
  everything we do, and that includes our recruiting
  practices. We're committed to offering all candidates a
  fair, accessible, and inclusive experience – regardless of
  age, color, disability, gender identity, marital status,
  maternity, national origin, pregnancy, race, religion, sex,
  sexual orientation, or status as a protected veteran. When
  applying and interviewing with Braze, we want you to feel
  comfortable showcasing what makes you you.

  We know that sometimes different circumstances can lead
  talented people to hesitate to apply for a role unless they
  meet 100% of the criteria. If this sounds familiar, we
  encourage you to apply, as we’d love to meet you

  OUR AI-POWERED BRAZE RECRUITMENT PROCESS

  At Braze, we’re committed to a fair and transparent
  candidate experience. To help our recruitment teams focus on
  what matters most — the person behind each application — we
  use AI-assisted tools at certain stages of our recruitment
  process.

  This includes using AI to analyze the experience, skills and
  qualifications in your application materials to help with
  screening and prioritizing candidates. Such screening may
  amount to a form of solely automated decision-making. We
  also use AI for administrative support, like scheduling and
  recording interviews and summarizing interview notes. Our
  recruiting teams remain responsible for all hiring decisions
  and are involved throughout the process.

  Depending on where you are located, you may have certain
  rights available to you in relation to Braze’s use of AI:

  - To opt out of AI-assisted review of your application, please
    click the “Learn More” at the end of the application form
    below and follow the instructions before submitting your
    application. Please note, if you apply to multiple roles
    at Braze, you will need to opt out in relation to each
    application.
  - To exercise other types of rights, such as rights to request
    further information about how AI is used in our
    recruitment process, to request a retroactive manual
    review of any decision made or to contest a decision,
    please contact us at talentdata.privacy@braze.com.

  Please contact us at talentdata.privacy@braze.com with any
  questions. To find out more about our hiring process, check
  out this page.

  Notice Regarding Automated Employment Decision Tool (NYC
  Local Law 144)

  Our use of AI during the application review process may
  include the use of automated employment decision tools.
  Pursuant to New York City Local Law 144, for roles based in
  New York City, or if you reside in New York City, you have
  the right to request an alternative selection process or a
  reasonable accommodation instead of AI-assisted review.

  To opt out of AI-assisted review of your application, please
  click the “Learn More” button below and follow the
  instructions before submitting your application. Please
  note, if you apply to multiple roles at Braze, you will need
  to opt out in relation to each application. Please submit
  any other request to our Talent Acquisition team at
  talentdata.privacy@braze.com promptly after applying.
  Summaries of the most recent bias audit results for such
  tools are available here.

  Please see our Candidate Privacy Policy for more information
  on how Braze processes your personal information during the
  recruitment process and, if applicable based on your
  location, how you can exercise any privacy rights.
