description: |
  We believe independent restaurants deserve the same
  advantages as big chains without giving up their
  independence.

  Ilir Sela started Slice in his family’s pizzerias, where he
  saw firsthand what it takes to run a local shop. Now we’re
  taking everything we’ve learned beyond pizza, to taquerias,
  delis, burger joints, and other neighborhood staples.

  We put technology, marketing, buying power, and support to
  work for more than 15,000 restaurants, so owners spend less
  time on admin, marketing, and order management and more time
  growing their business. They remain independent, but never
  alone.

  We’re growing our team to help bring this next chapter to
  life. That’s where you come in.

  This position is open to applicants across all of the UK on
  a remote basis, with the physical office located in Belfast,
  Northern Ireland.

  There are several openings within our Services team so we
  welcome applications from candidates seeking associate,
  intermediate or senior level positions.

  The Challenge to Solve

  How do mom-and-pop restaurants survive and win in a world of
  big-budget chains and third-party apps? This is the
  challenge you’ll help solve at Slice. Local pizzerias
  already outperform the big chains in offline sales, yet are
  outsold 20-to-1 online – a gap we’re determined to close. We
  operate at the intersection of high stakes and local
  community: our mission is to level the playing field for
  small businesses by providing them with the technology and
  capabilities that rival those of the biggest players. When a
  shop partners with Slice, our goal is that it feels “as if
  they’ve just hired 1,000 people” to support their business.
  As an engineer on our team, you’ll seek out bold, asymmetric
  opportunities to create these outsized impacts for our
  restaurant partners and the millions of customers they
  serve. It’s not just about writing code – it’s about writing
  the future of eating local.

  What You'll Do

  As a Software Developer on our Services team, you will
  immerse yourself in our ambitious mission and take on a wide
  range of responsibilities to drive customer impact.
  Specifically, you will:

  - Build innovative features & services: Design, code, and
    launch new backend features that help our restaurant
    partners operate more efficiently and deliver exceptional,
    seamless experiences to their customers. Your work will
    directly enhance real-world interactions between shops and
    pizza lovers every day.
  - Identify game-changing opportunities: Constantly look for
    asymmetric opportunities where a small technical change
    can deliver disproportionate value. You’ll use your
    creativity and entrepreneurial mindset to find 10x
    solutions that delight users and give our partners an
    edge.
  - Own projects end-to-end: Take ownership of initiatives from
    concept through production. You’ll work closely with
    product, design, and other teams to define solutions,
    execute rapidly, and iterate based on feedback. When you
    see a problem, you don’t wait - you tackle it.
  - Use the best tools for the job: While our primary stack is
    Python (Flask), we embrace any technology that delivers
    value. You might rewrite a microservice from Go to Python,
    craft a script in Ruby, or leverage a new cloud service –
    whatever it takes to solve the task at hand in a scalable
    way.
  - Collaborate in a small, agile team: Work alongside a tight-
    knit team of 5 to 8 backend engineers (across the US, UK,
    and Europe) who are as passionate about the mission as you
    are. Together, you will review code, brainstorm ideas, and
    push each other to raise the bar while maintaining a fun,
    supportive atmosphere.
  - Ensure quality and performance at scale: Employ best
    practices in coding, testing, monitoring, and DevOps to
    ensure our services are reliable and performant. You build
    it, you own it - from writing unit tests to fine-tuning
    logging and alerting, you’ll make sure your code runs
    smoothly in production.

  The Winning Recipe

  We’re looking for bold, founder-like engineers who aren’t
  afraid to challenge the status quo and build products that
  make a real difference. If you’re an unconventional thinker
  and a highly productive doer, you’ll feel right at home. The
  ideal candidate has:

  - Owner’s mindset: You think like a founder. You take
    initiative, own problems end-to-end, and move with urgency
    to deliver results. Obstacles energize you, and you thrive
    in a fast-paced, ambiguous startup environment where your
    decisions drive real impact.
  - Proven builder: You have solid experience crafting scalable
    backend systems in Python (Flask) and working with
    databases and cloud services. You’re comfortable diving
    into monitoring and logging tools to keep systems healthy.
    More importantly, you’re technology-agnostic – you quickly
    pick up new languages or frameworks (Go, Ruby, or whatever
    is needed) to solve problems effectively.
  - Remote-ready collaborator: You excel at working on a
    distributed team and communicating asynchronously. You’re
    comfortable collaborating with teammates across different
    time zones and backgrounds, and you know how to stay
    connected and communicative in a remote work setting.
  - Product & customer focus: You care deeply about the why
    behind your code. You can clearly express opinions on
    product direction and design, always keeping the end-
    customer and restaurant owner in mind. At the same time,
    you respect others’ perspectives and believe the best
    ideas can come from anywhere.
  - Innovative problem solver: You love finding creative
    solutions to hard problems. Words like “impossible” or
    “uncharted” fuel your curiosity. You seek out those
    asymmetric win scenarios and aren’t afraid to experiment,
    adapt, and iterate to achieve a better outcome for users.

  If you’ve ever dreamed of building something big, scrappy,
  and impactful – and you have the skills to back it up – we
  want to meet you!

  The Extras

  Working at Slice comes with a comprehensive set of benefits,
  but here are some of the unexpected highlights:

  - Access to medical, dental, and vision plans
  - Flexible working hours
  - Generous time off policies
  - £200 per annum employee wellbeing allowance
  - Market leading maternity and paternity schemes

  The Hiring Process

  You’ll find a summary of your expected interview process
  below and we’ll stick to this as closely as possible, but
  please note this may be subject to change.

  - Application
  - 30 minute introductory meeting
  - 90 minute Live Coding Interview & 60 minute Technical
    Interview
  - 45 minute Hiring Manager meeting
  - Offer!

  We’re an Equal Opportunity Employer and embrace a diversity
  of backgrounds, cultures, and perspectives. We do not
  discriminate on the basis of race, colour, gender, sexual
  orientation, gender identity or expression, religion,
  disability, national origin, protected veteran status, age,
  or any other status protected by applicable national,
  federal, state, or local law. We are also proud members of
  the Diversity Mark NI initiative as a Bronze Member.

  Privacy Notice Statement of Acknowledgment

  When you apply for a job on this site, the personal data
  contained in your application will be collected by Slice.
  Slice is keeping your data safe and secure. Once we have
  received your personal data, we put in place reasonable and
  appropriate measures and controls to prevent any accidental
  or unlawful destruction, loss, alteration, or unauthorised
  access. If selected, we will process your personal data for
  hiring /employment processes, as well as our legal
  obligations.

  If you are not selected for the job position and you have
  given consent on the question below (by selecting "Give
  consent") we will store and process your personal data and
  submitted documents (CV) to consider eligibility for
  employment up to 365 days (one year). You have the right to
  withdraw your previously given consent for storing your
  personal data and CV in the Slice database considering
  eligibility for employment for a year. You have the right to
  withdraw your consent at any time.

  For additional information and / or exercise of your rights
  to the protection of personal data, you can contact our Data
  Protection Officer, e-mail: privacy@slice.com
