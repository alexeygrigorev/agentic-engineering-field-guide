  ·         Employee discounts

  ·         Health insurance

  ·         Life insurance

  ·         Paid time off

  ·         12 paid holidays per year

  ·         Paid training

  ·         Referral program

  ·         Vision insurance



  Supplemental pay types:



  ·         Referral bonuses



