description: |
  AmeriSave Mortgage has set the standard in online mortgage
  lending with over $130 billion in funded loan volume. As one
  of the top-rated, largest privately-owned online mortgage
  lenders in the nation, our mission is to deliver beneficial,
  responsible home lending solutions with unwavering
  integrity, dedication and excellence. We leverage cutting-
  edge technology and data-driven strategies to provide
  exceptional service to our customers.



  Our employees are the driving force behind our success. We
  believe in the power of a dynamic and talented workforce and
  creating an environment where your contributions are not
  just recognized, they’re celebrated. Your success is our
  success, and we are seeking skilled professionals who are
  ready to bring their A-game, exceed benchmarks and enhance
  the overall excellence of AmeriSave, while also growing and
  advancing their careers.

  At AmeriSave, we're one team with one shared dream - to be
  the best.  Let’s redefine excellence together!

  We are currently looking for a Senior Full Stack Developer
  to join our growing team.

  This is a remote opportunity to work from home.  Schedule
  will be Eastern Standard Time.

  What You’ll Do:

  - Design, develop, and maintain robust and scalable web
    applications using Vue 3, Nuxt, and Node.js.
  - Collaborate with cross-functional teams to define, design,
    and ship new features.
  - Write clean, maintainable, and efficient code in Typescript.
  - Optimize applications for maximum speed and scalability.
  - Troubleshoot and debug applications to ensure optimal
    performance.
  - Implement data storage solutions using MS SQL and ensure
    data integrity.
  - Participate in code reviews to maintain code quality and
    ensure best practices.
  - Stay up-to-date with the latest industry trends and
    technologies to bring innovative solutions to the table.
  - Design and develop user interfaces with HTML and CSS.
  - Perform DOM manipulation to create dynamic and interactive
    web pages.
  - Ensure cross-browser compatibility and responsiveness of web
    applications.

  What You’ll Need:

  - Experience: Minimum of 5 years of professional experience in
    full stack development.
  - Technical Skills:
  - Problem-Solving: Strong analytical and problem-solving
    skills.
  - Collaboration: Excellent communication and teamwork skills,
    with the ability to work effectively in a remote
    environment.
  - Time zone: Availability to work in the EST time zone is
    mandatory.
  - High-speed internet required for remote work, Cable or Fiber
    ONLY with the ability to connect via Ethernet. Minimum
    speeds: 70/30 Mbps (basic), 200-300/35-70 Mbps (shared),
    500-1,000/100+ Mbps (heavy use).



  Preferred Qualifications:

  - Experience with other frontend frameworks/libraries.
  - Familiarity with containerization technologies such as
    Docker.
  - Knowledge of cloud platforms preferably Azure.
  - Experience with CI/CD pipelines and DevOps practices.

  **Please note that the compensation and benefit information
  that follows is a good faith estimate for this position only
  and is provided pursuant to applicable state and local laws
  on pay transparency. It is estimated based on what a
  successful applicant in the relevant state might be paid. **



  Compensation:

  The annual compensation for this position generally ranges
  from between $130,000 - $150,000.



  Benefits:



  ·         401(k)

  ·         Dental insurance

