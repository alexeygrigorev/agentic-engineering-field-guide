description: |
  Netic is the AI revenue engine for essential services who
  are the backbone of the American economy. With $43M in
  funding from Founders Fund, Greylock, Hanabi, and Dylan
  Field who led our Series B, we helped our customers book
  hundreds of thousands of jobs across services industries in
  North America. There are now companies operating entirely
  AI-first on Netic.



  You’ll join our team with relentless builders from Scale,
  Databricks, HRT, Meta, MIT, Stanford, and Harvard in
  bringing frontier AI to the physical economy, where the
  problems are hard, the data is complex, and the impact is
  immediate and tangible.

  Netic is the AI revenue engine for essential services who
  are the backbone of the American economy. With $43M in
  funding from Founders Fund, Greylock, Hanabi, and Dylan
  Field who led our Series B, we helped our customers book
  hundreds of thousands of jobs across services industries in
  North America. There are now companies operating entirely
  AI-first on Netic.

  You’ll join our team with relentless builders from Scale,
  Databricks, HRT, Meta, MIT, Stanford, and Harvard in
  bringing frontier AI to the physical economy, where the
  problems are hard, the data is complex, and the impact is
  immediate and tangible.

  Netic’s Gap Year Software Engineers join our product team
  for a year to build the features that put AI in the hands of
  real businesses. This role is for college students who want
  to take a year off school to work full-time as an engineer,
  combining technical excellence with customer empathy to
  craft products that make complex AI feel simple and deliver
  immediate value to essential service industries.

  Gap Year engineers are full-time employees, not interns.
  You’ll earn a full salary and equity, have a dedicated
  mentor, and we’ll cover room and board in an apartment next
  to our office in San Francisco or New York. The program is
  modeled on our first Gap Year engineer, who took a year off
  from Harvard to own products used by real customers, work
  on-site with them, and meet our board and investors before
  returning to finish his degree.

  If you want to start a company someday, this is the year to
  learn how. You’ll see up close how a fast-growing startup
  wins customers, ships product, makes hard decisions, and
  builds a team. You’ll also leave with relationships with the
  investors, founders, operators, and teammates who can advise
  you, back you, or co-found with you when it’s your turn.

  We need to hire multiple Gap Year engineers who are
  currently enrolled undergraduates at a US university and can
  take at least a year off school to work with us full-time.
  We hire on a rolling basis, and start dates are flexible.

  What You’ll Do:

  - Build agentic products: Design, code, and ship full-stack
    features for Netic’s AI platform.
  - Co‑create with customers: Work closely with our customers,
    including on-site, to understand workflows, gather
    feedback, and turn pain points into features that stick.
  - Own end‑to‑end delivery: Drive projects from spec to
    production, handling data models, APIs, front‑end polish,
    and post‑launch iteration.
  - Ensure quality: Build, test, and monitor features in
    production to ensure reliability and performance.
  - Learn how a company is built: Sit in on sales calls and
    leadership meetings to see how a fast-growing startup wins
    customers, makes decisions, and builds a team.
  - Build your founder network: Get to know our board,
    investors, and leaders across tech—people who can advise
    you, back you, or build with you when you start your own
    company.

  What You’ll Bring:

  - Proven builder: You’ve shipped real projects end-to-end,
    whether through school, internships, hackathons, or on
    your own.
  - Full‑stack foundations: Comfortable with React, TypeScript,
    and Python, or ready to pick them up fast.
  - AI experience (nice‑to‑have): Hands‑on with LLM APIs,
    embeddings, or RAG patterns—or hunger to learn fast.
  - Customer empathy: You care about the people who use what you
    build and want to work with them directly.
  - Founder‑level ambition: You want to start a company one day
    and want to learn how great companies are built first.
  - Excellent communicator: Able to explain technical trade‑offs
    to engineers and product decisions to customers.

  Program Details:

  - Eligibility: You must be currently enrolled as an
    undergraduate at a US university and able to arrange at
    least one full year off from school on your own (for
    example, through your school’s leave of absence process)
    before returning to finish your degree.
  - Duration: 12 months, full-time, in person in San Francisco
    or New York.
  - Compensation: Full-time base salary and equity.
  - Housing: Room and board fully covered, in an apartment next
    to our office.

  Our values

  - Obsess over the customer
  - Every second counts
  - Sweat the details
  - There are no blockers
  - Be self-directed
  - Seek and speak the truth
  - Enjoy the ride

  We are an equal opportunity employer and do not discriminate
  on the basis of race, religion, national origin, gender,
  sexual orientation, age, veteran status, disability or any
  other legally protected status.
