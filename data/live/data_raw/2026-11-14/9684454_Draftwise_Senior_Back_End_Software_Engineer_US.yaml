description: |
  About The Role

  We are looking for an experienced back end software engineer
  to join our team. As an experienced team member, you will
  have a broad ownership and impact on the technology,
  product, and our culture. You will work alongside a first-
  rate engineering team to implement exciting new features,
  scale the platform, and to make the platform more
  performant.

  We have challenges at all levels of the stack, from building
  beautiful web technology to fine tuning LLMs to optimizing
  Postgres and Elasticsearch queries to deal with an ever-
  growing scale.

  We’d love for you to take ownership of features, write
  performant, elegant code, and make meaningful architectural
  decisions.

  What We Value

  - Strong communication skills in a transparent environment.
  - Creating an environment of trust through well-intentioned
    feedback.
  - Skills to work independently and make decisions with minimal
    supervision.
  - Interest in working in a lively environment with dynamic
    objectives.
  - Individual autonomy and ownership to build quality products.

  What We Offer

  - Remote-first work environment. (Engineering teams typically
    span UTC+3 to UTC-5.)
    - This role is best suited for someone who can work on East
      Coast time.
  - Competitive salary.
  - Equity-based compensation.
  - Private medical care.
  - New laptop and a work-from-home stipend for necessary
    accessories.
  - Generous PTO / sick leave.
  - Opportunities to lead our company as we disrupt the legal
    world.

  About You

  We're looking for engineers who have:

  - Strong overlap with DraftWise’s company values.
  - A focus on user impact and passion for shipping high-quality
    products that delights users.
  - Extensive and recent experience in Java.
  - 5+ years as a professional software engineer.

  It's also great if you have:

  - Worked with elements in our tech stack:
    - Development: Java 21, jOOQ, Dropwizard, Dagger
    - Data: Postgres, Elasticsearch, TensorFlow, Keras
    - DevOps: AWS, Docker
  - Experience in building, deploying, and maintaining
    deployment infrastructure.
  - Experience building data-intensive applications such as NLP,
    search and indexing, and data processing, LLMs.
  - Interest in being involved in engineering design decisions.
  - Interest in the data products space, and a love of building
    tools that helps enterprise users to do more.

  About The Interview

  A successful candidate will go through the following
  process:

  Step 1: Introductory call where we share more about what we
  are building, and to hear about what kind of work you are
  seeking. We may dive a bit into your resume, too. Of course,
  we want to give you an opportunity to ask questions! This
  should take 30 minutes.

  Step 2: Technical interview where we will ask you to do some
  coding (in Java). The problem will be related to work we
  have done, so it will give you a taste for our product
  space. This should take about 1 hour.

  Step 3: Take home project (~3-4 hours). This involves a more
  complicated problem, which helps us get a sense of how you
  approach adding new functionality to a pre-existing code
  base. Given our remote-first work environment, the project
  shows us what you can do independently. After you submit
  your solution, we will have a follow-up call to discuss it
  and ask about how you went about solving it.

  We would love for you to meet other members of the team
  before you make a decision should an offer be rendered.
