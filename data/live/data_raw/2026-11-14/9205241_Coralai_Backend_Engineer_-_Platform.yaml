  Job Title: Backend Engineer – Platform

  Role Overview

  As a Backend Engineer – Platform at Coral AI, you will be
  instrumental in designing and building scalable systems,
  frameworks, and core infrastructure. You will collaborate
  closely with engineering teams to establish and uphold best
  practices across the platform and ensure our systems are
  robust, reliable, and performant as we grow.

  Key Responsibilities

  - Architect, design, and develop highly scalable and reliable
    backend systems and frameworks
  - Build and maintain core platform infrastructure to support
    products and engineering efforts company-wide
  - Drive engineering and coding best practices; set standards
    for quality and code reviews
  - Collaborate with product managers, frontend engineers,
    DevOps, and other stakeholders to deliver top-notch
    solutions
  - Proactively identify technical debt, architectural
    bottlenecks, and opportunities for system improvements
  - Mentor and guide fellow engineers on platform and backend
    topics

  Requirements

  - 3–7 years of experience in backend engineering or similar
    roles
  - Proven experience building scalable and distributed backend
    systems and services
  - Strong programming skills in languages such as Go, Java, or
    Python
  - In-depth understanding of system architecture, frameworks,
    and core infrastructure components
  - Experience with cloud services (AWS, GCP, or Azure) and
    containerization (Docker, Kubernetes)
  - Familiarity with databases (SQL and NoSQL), messaging
    systems, and caching strategies
  - Solid grasp of engineering best practices: code reviews,
    testing, CI/CD pipelines, and documentation
  - Excellent troubleshooting, problem-solving, and analytical
    skills
  - Strong communication and teamwork skills
  - Willingness and ability to work on-site in Bengaluru

  What We Offer

  - Opportunity to work on cutting-edge platform engineering
    challenges
  - Collaborative and growth-oriented work environment
  - Competitive salary and benefits
  - Modern office in the heart of Bengaluru
