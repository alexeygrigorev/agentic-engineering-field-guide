description: |
  Canonical, the company behind the Ubuntu Linux distribution,
  is searching for highly skilled senior software engineers,
  tech leads, or team leads who are ready to take the next
  step in their careers by transitioning into engineering
  management.

  As a Kernel Engineering Manager, you will step into a
  pivotal leadership role overseeing the engineers who build,
  maintain, and optimize the Linux kernel that powers millions
  of systems globally. Our platform, Ubuntu, is in widespread
  use in breakthrough enterprise initiatives such as public
  cloud, data science, AI, engineering innovation, and IoT.
  You will collaborate closely with the world's leading public
  cloud and silicon providers to deliver a world-class
  operating system.

  We do not require prior direct people management experience
  for this role. Instead, we are looking for individuals who
  possess a solid technical foundation, a proven track record
  of technical leadership or project delivery, and a strong
  desire to learn how to lead complex, system-level projects
  and the engineers who build them.

  The company is founder-led, profitable, and growing, making
  this an exceptional opportunity to grow your career into the
  core of open-source technology leadership.

  Location: Working from home, worldwide.  We have kernel
  teams and openings in every time zone and with the notable
  exception of Taipei, Taiwan, have no offices and therefore
  no pressure to work from an office.

  The role entails

  - Transition from individual contribution or technical
    leadership into full-time people and project management.
  - Lead and mentor a globally distributed team of talented
    Linux kernel engineers.
  - Manage the delivery, testing, and maintenance of Ubuntu
    kernels across various platforms (cloud, server, desktop,
    and IoT).
  - Drive engineering excellence, ensuring code quality,
    security, and performance standards are met consistently.
  - Develop and execute team strategies, aligning with broader
    company goals and product roadmaps.
  - Collaborate with silicon vendors, cloud partners, and
    internal Canonical teams to enable new hardware and
    features.
  - Own the release cycles and update cadence for your team's
    kernel portfolios.
  - Foster a culture of continuous learning, feedback, open-
    source collaboration, and accountability within the team.

  What we are looking for in you

  - Proven experience as a Senior Software Engineer, Tech Lead,
    or similar role with a strong desire to transition into a
    formal management position (no prior direct management
    experience required).
  - Solid technical background in systems software, C
    programming, or operating systems concepts.  Direct
    experience with the Linux or other operating system
    kernels would be highly regarded, but is not essential.
  - Prior experience developing with software packaging formats,
    with direct Ubuntu/Debian/Snap experience being highly
    regarded.
  - Demonstrated ability to mentor junior engineers, guide
    complex technical projects, or drive architectural
    decisions.
  - Leadership potential and a commitment to skills development
    and mentorship.
  - Confidence to respectfully speak up, exchange feedback, and
    share ideas without hesitation.
  - Professional written and spoken English with excellent
    presentation skills.
  - Ability to travel internationally twice a year for company
    events up to two weeks long.

  Nice-to-have skills

  - Experience acting as a scrum master, project lead, or
    informal mentor for remote teams.
  - Direct experience contributing to or participating in the
    Linux kernel community.
  - Familiarity with continuous integration (CI) and automated
    testing frameworks for systems software.

  What we offer colleagues

  We consider geographical location, experience, and
  performance in shaping compensation worldwide. We revisit
  compensation annually (and more often for graduates and
  associates) to ensure we recognize outstanding performance.
  In addition to base pay, we offer a performance-driven
  annual bonus or commission. We provide all team members with
  additional benefits which reflect our values and ideals. We
  balance our programs to meet local needs and ensure fairness
  globally.

  - Distributed work environment with twice-yearly team sprints
    in person
  - Personal learning and development budget of USD 2,000 per
    year
  - Annual compensation review
  - Recognition rewards
  - Annual holiday leave
  - Maternity and paternity leave
  - Team Member Assistance Program & Wellness Platform
  - Opportunity to travel to new locations to meet colleagues
  - Priority Pass and travel upgrades for long-haul company
    events

  About Canonical

  Canonical is a pioneering tech firm at the forefront of the
  global move to open source. As the company that publishes
  Ubuntu, one of the most important open-source projects and
  the platform for AI, IoT, and the cloud, we are changing the
  world of software. We recruit on a global basis and set a
  very high standard for people joining the company. We expect
  excellence; in order to succeed, we need to be the best at
  what we do. Most colleagues at Canonical have worked from
  home since our inception in 2004. Working here is a step
  into the future and will challenge you to think differently,
  work smarter, learn new skills, and raise your game.

  Canonical is an equal opportunity employer

  We are proud to foster a workplace free from discrimination.
  Diversity of experience, perspectives, and background create
  a better work environment and better products. Whatever your
  identity, we will give your application fair consideration.

