description: |
  Senior Software Engineer | Autoplanner | Hybrid Working |
  London

  Introduction:

  We are Ocado Group, and we're bringing world-class
  automation to online grocery. Our Ocado Smart Platform (OSP)
  combines cutting-edge robotics, AI, and IoT within our
  advanced CFCs (Customer Fulfilment Centres). We've mastered
  the single pick, transforming online delivery for our global
  partners. Join us and be part of a team pushing the
  boundaries of retail technology.

  About the Role:

  As a Senior Software Engineer in the Autoplanner team, you
  will own the software engineering that brings our data
  science and machine learning products into live production.
  Autoplanner builds AI-powered systems that unify planning
  across global warehouses and last-mile assets, delivering
  globally optimized plans that maximize profit and minimize
  lateness. You will act as the engineering partner to our
  data scientists, ensuring our systems remain robust, highly
  scalable, and efficient as we roll out to more international
  retail partners. Our services are mostly Python, but we use
  Java where a service integrates closely with the Ocado Smart
  Platform, to take advantage of its shared tooling.

  In this role, you will write typed, well-tested Python and
  oversee cloud-based data applications from end to end. You
  will contribute to core architectural decisions, improve
  CI/CD pipelines, and raise engineering standards across the
  team through pairing, code reviews, and shared tooling.
  Additionally, you will harness AI coding tools in production
  while maintaining a strong emphasis on engineering
  discipline, system performance, and high-quality software
  craft.

  Key Responsibilities:

  - Develop and maintain data- and ML-driven, cloud-based
    applications.
  - Build and maintain robust APIs and data contracts for data
    science teams and broader Ocado systems.
  - Manage cloud deployments and continuously improve CI/CD
    pipelines across diverse AWS environments.
  - Package, version, serve, and monitor machine learning models
    in live production environments.
  - Drive architecture decisions across repository, application,
    and system levels, documenting them as Architecture
    Decision Records (ADRs).
  - Partner directly with data scientists to transition advanced
    algorithms and models into scalable production systems.
  - Collaborate with software engineers across Ocado Technology
    to integrate applications within the Ocado Smart Platform
    (OSP).
  - Elevate engineering practices across the team through
    pairing, code reviews, shared tooling, and responsible AI
    agent integration.
  - Share in on-call and production support responsibilities for
    critical live operational services.

  What We’re Looking For:

  - Proven experience as a Senior Software Engineer owning end-
    to-end production Python services.
  - Extensive background building data-intensive cloud
    applications, preferably asynchronous, event-driven, or
    queue-based architectures.
  - Strong practical knowledge of AWS and/or GCP identity,
    networking, and messaging services.
  - Solid software design capabilities, including defining
    system boundaries and crafting high-level architectures.
  - Rigorous testing and delivery discipline, encompassing
    integration testing and modern CI/CD practices.
  - Hands-on MLOps experience, specifically in packaging,
    serving, and monitoring ML models in production.
  - Demonstrated track record of collaborating effectively with
    data scientists and cross-functional engineering teams.
  - Practical experience using AI coding agents on production
    codebases, with a sharp judgment on validating and
    verifying AI-generated output.

  Benefits:

  We believe in supporting our people with meaningful,
  flexible benefits that prioritise well-being and work-life
  balance. Here’s a snapshot of what you can expect:

  - Time to recharge: 25 days annual leave (rising to 27 after 5
    years), plus the option to buy more – and 30 days a year
    to work from anywhere in the world.
  - Health & wellbeing: Private Medical Insurance from your
    first month, wellbeing support through specialist apps and
    EAP, plus Income Protection and Life Assurance.
  - Family-first policies: 22 weeks paid maternity/primary carer
    leave and 6 weeks paid paternity leave.
  - Financial support: Pension with employer matching up to 7%,
    share schemes (Sharesave & BAYE), and interest-free loans
    for train tickets.
  - Commuter perks: Cycle to Work Scheme and free shuttle buses
    to/from Hatfield and Welwyn Garden City stations.
  - Exclusive discounts: 15% off at Ocado.com with free delivery
    (starting in your first month).

  Be bold, be unique, be brilliant, be you. We are looking for
  individuality and we value diversity. We are an equal
  opportunities employer and we are committed to treating all
  applicants and employees fairly and equally. We are
  committed to making reasonable adjustments to provide a
  positive, barrier-free recruitment process and supportive
  work environment. If you have any support or access
  requirements, we encourage you to advise us at the time of
  application.

