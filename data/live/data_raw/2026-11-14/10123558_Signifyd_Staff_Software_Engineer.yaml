  Compensation:

  In the United States, each work location is assigned a
  specific pay zone, which determines the salary range for a
  given position. The starting base salary for the selected
  candidate will be based on a variety of factors, including
  job-related skills, experience, qualifications, geographic
  location, and current market conditions.

  Base Salary Ranges by Pay Zone:

  - Tier 1 (NYC/SF Bay Area/Seattle): $200,000 - 225,000
    annuallyTier 2 (DC Metro/Austin/Chicago/Denver/Boston/Los
    Angeles/San Diego): $195,000- $220,000 annuallyTier 3 (US
    - All Other): $190,000- $215,000 annually

  Equity: This role is eligible for a stock option grant of
  6000 stock options, based on the position level and internal
  compensation guidelines.

  Bonus: This role is eligible for an annual performance bonus
  of up to 10% of base salary.

