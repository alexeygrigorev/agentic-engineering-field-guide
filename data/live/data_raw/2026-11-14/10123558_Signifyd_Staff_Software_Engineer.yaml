description: |
  At Signifyd, we help merchants confidently grow their
  businesses by building trusted relationships with their
  customers. Our advanced technology, combined with a team
  genuinely invested in our clients’ success, creates
  frictionless shopping experiences, approving more good
  orders, protecting revenue, and keeping customers happy.

  Trusted by thousands of leading merchants across more than
  100 countries, we securely process billions of transactions
  each year. Our people are the heart of everything we do,
  driving our mission forward with commitment, empathy, and
  creativity. Join us on our mission to empower confident,
  fraud-free commerce by helping online retailers provide
  superior customer experiences and eliminate fraud. Learn
  about our company values here!

  Department: Engineering

  The Engineering organization at Signifyd is at the forefront
  of building solutions that protect and empower global
  commerce. We pride ourselves on delivering highly scalable,
  robust systems that evolve with our customers' needs, from
  emerging startups to enterprise-level organizations
  processing millions of transactions. Our engineers thrive in
  an innovative environment where rapid iteration and
  continuous learning drive our success. We embrace modern
  development practices, leverage cloud-native technologies,
  and maintain a customer-obsessed mindset to ensure our
  solutions anticipate tomorrow's challenges. Strong
  partnerships with Product and Data Science ensure every
  technical decision is aligned with delivering maximum value
  and driving meaningful business outcomes.

  The Role

  We are looking for a staff back-end engineer to set the
  technical direction for the platform retailers use to
  integrate with Signifyd. As a member of the Integrations &
  Onboarding team, you will own the architecture and long-term
  health of our public-facing API platform and ingestion
  services, defining both what we build and how we build it.
  This role suits an engineer who is drawn to open-ended
  problems spanning several teams, who can turn a complicated
  problem space into simple and durable foundations, and whose
  influence shows up in other teams' roadmaps as much as in
  their own systems.

  Responsibilities

  - Define and deliver the multi-year technical vision for our
    integration and ingestion platform across multiple teams
    and competing constraints.
  - Make the architecture-level technology calls, including
    build-versus-buy decisions and framework selection, and
    own the tradeoffs behind them.
  - Own the overall health and engineering quality of the
    platform: drive health reviews, curate testing strategy,
    and ensure the systems stay maintainable by engineers with
    varying levels of expertise.
  - Design systems under significant ambiguity, particularly
    those that many other systems depend on.
  - Partner with product management, data engineering, and other
    engineering teams, influencing their roadmaps where a
    shared solution serves the business better than a locally
    optimal one.
  - Raise the technical bar across related areas through design
    and code review, with particular attention to cross-team
    interfaces and API quality.
  - Proactively identify areas of technical debt and drive the
    strategy for addressing them.
  - Serve as a role model and mentor for engineers across the
    organization, and champion responsible adoption of AI
    development tools.

  Requirements

  - Bachelor's degree or equivalent practical experience.
  - Significant experience in software development with modern
    programming languages, experience programming in a
    functional style.
  - Track record of setting technical direction across multiple
    teams, and of carrying large, ambiguous initiatives
    through to completion.
  - Depth in a platform or product domain that translated into
    distinctive business value, rather than breadth alone.
  - Strong software design and architecture skills, including
    reducing complex problems to simple foundational
    components and designing interfaces that are difficult to
    misuse.
  - Experience owning the long-term health of a significant
    system: testing strategy, operability, and reducing key-
    person dependency.
  - Experience building distributed systems or public-
    facing/platform APIs at scale.
  - Experience with cloud platforms such as AWS or GCP.
  - Ability to influence without authority, and to communicate
    effectively with engineers and non-engineers alike.
  - You use modern AI development tools fluently and help others
    do the same, championing responsible adoption while
    holding the line on quality. This means practical
    experience with AI coding assistants, understanding how to
    provide effective context, critically evaluating generated
    code for correctness, security, and maintainability, and
    coaching others toward the same standard.

  Our Stack

  - Java, SQL, gRPC, HTTP/REST
  - Kubernetes, Docker, Linux
  - Cassandra, Pub/Sub, Bigtable, Databricks
  - GCP, AWS

