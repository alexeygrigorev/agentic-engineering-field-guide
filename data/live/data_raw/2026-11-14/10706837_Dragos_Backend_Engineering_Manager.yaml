description: |
  At Dragos, the mission is personal. The systems we protect
  deliver the water you drink, power your home, and keep the
  hospitals your community depends on running. Those critical
  infrastructure systems that power our civilization around
  the world are under attack every day by adversaries. When
  those systems fail, people are immediately at risk. We are
  the global leader in xOT cybersecurity, combining
  technology, threat intelligence, and expert services. The
  people here chose this work because they understand what is
  at stake. Here, you will find a remote-first mission-driven
  team across North America, Europe, the Middle East, and APAC
  built on authenticity, transparency, and trust. If
  safeguarding the systems that protect your family, friends,
  and community is the kind of work that matters to you, you
  are in the right place.

  About the Role:  Dragos is seeking an experienced Backend
  Software Engineering Manager with a background in building
  and leading teams who develop microservice architectures,
  data processing pipelines, and extensible platform
  components. Backend Engineering is a critical dependency
  across the Dragos platform. As such, this role requires deep
  technical knowledge, excellent leadership skills, and strong
  business acumen. This person will manage the team
  responsible for developing and sustaining the backend
  components of the Dragos Platform. Focus areas include
  streaming data ingest, streaming detection processing,
  baseline learning, asset reconciliation, core platform APIs,
  and platform coordination across sensor/analytic
  deployments.

  Responsibilities:

  - Leadership and health of the Backend Engineering skill
    community
  - Mentor Engineering team members, especially their growth in
    technical expertise and career goals
  - Champion the vision and execution of the backend components
    of the Dragos Platform
  - Foster a strong technical community by developing close
    relationships amongst Engineering Leaders
  - Heavy collaboration with tech leads and Product Managers on
    product teams
  - Provide technical input/insight during software design,
    development, testing, and release
  - Ensure support for fielded production deployments

  Qualifications:

  - 7+ years of experience leading and building technical teams
  - 5+ years of experience developing and/or leading teams
    developing software applications with microservice
    architectures
  - Demonstrated hands-on experience as a software engineer,
    with strong fundamentals in backend system design,
    distributed systems, and production-grade development.
    Experience with Rust is strongly preferred, along with the
    ability to learn, adopt, and advocate for modern systems-
    level languages and architectures
  - Leadership experience within agile cross-functional teams
  - Familiarity with Apache Flink, RabbitMQ, or Hashicorp Vault
  - Comfortable stepping in when needed for occasional
    development, triage, or troubleshooting support
  - Experience working in cybersecurity, OT, or ICS environments
    is preferred

  Compensation:

  - Salary: $220,000
  - Competitive Equity Package
  - Comprehensive Benefits Plan



