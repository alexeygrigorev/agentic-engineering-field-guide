description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  We're hiring a Senior Software Engineer, Frontend to join
  the Consumer Payments team within the Consumer Product
  Group. This team owns the infrastructure, experiences, and
  controls that power how millions of users send, receive, and
  move crypto on Coinbase. You'll own critical user journeys
  across web and mobile, building fast, reliable, and
  delightful payment flows while mentoring junior engineers
  and driving down customer friction at scale.

  What you’ll do:

  - Own end-to-end frontend development for core crypto money
    movement experiences, including send, receive, and
    transaction status tracking across web and mobile
  - Drive measurable improvements in CUJ latency, availability,
    and SLOs for the payment flows you own
  - Build new user-facing features - such as contact management
    systems and real-time transaction status trackers
  - Partner with product, design, and backend engineering to
    scope, prioritize, and ship projects that reduce CX
    contact rates and improve the customer experience
  - Identify and resolve frontend performance bottlenecks across
    payment flows, reducing end-to-end latency and improving
    reliability for millions of users

  Required skills and experience:

  - 5+ years of software engineering experience with deep
    expertise in React and React Native
  - Proven track record of shipping consumer-facing products
    end-to-end in a high-scale environment, with a focus on
    performance, reliability, and user experience
  - Experience owning SLOs and driving measurable improvements
    in latency and availability for user-facing flows
  - Demonstrated ability to mentor junior engineers and operate
    as a senior technical voice on a team of mixed levels
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality

  P77525

  #LI-Remote

