description: |
  About Crunchyroll

  Founded by fans, Crunchyroll delivers the art and culture of
  anime to a passionate community. We super-serve over 100
  million anime and manga fans across 200+ countries and
  territories, and help them connect with the stories and
  characters they crave. Whether that experience is online or
  in-person, streaming video, theatrical, games, merchandise,
  events and more, it’s powered by the anime content we all
  love.

  Join our team, and help us shape the future of anime!

  About the role

  Crunchyroll is scaling globally, creating unique challenges
  and exciting opportunities to delight millions of anime fans
  worldwide. The Partner Engineering team, part of the larger
  Ecosystem Engineering organization, works with our growing
  network of partners and internal teams to ensure an
  exceptional experience for all Crunchyroll fans.

  As a Staff Partner Engineer, you'll lead strategic technical
  integrations, optimize deployment processes, and collaborate
  with key partners to deliver outstanding user experiences.
  You'll act as the technical point of contact for our
  partners, driving innovation and solving complex challenges
  with scalable, forward-thinking solutions.

  In this high-impact role, you will:

  - Lead cross-functional projects involving Product,
    Engineering, Business Development, Program Management, and
    Marketing.
  - Improve and scale existing partner operations.
  - Define and commercialize new partner-facing solutions and
    workflows.
  - Accelerate new initiatives by building and iterating through
    the full product development cycle, prototyping, testing,
    and launching successful features.
  - Identify and bridge product gaps to enable seamless partner
    integration.

  You will report to the Senior Manager of Partner Engineering
  and must be based in the London Area. This is a hybrid role
  with 3 days a week in the office (Tuesdays, Wednesdays, and
  Thursdays).

  About You

  We’re excited about candidates who bring:

  - A Bachelor’s degree in Computer Science or equivalent
    practical experience.
  - 12+ years of experience building and deploying complex
    systems in collaboration with external partners.
  - Experience with modern web technologies: JavaScript,
    TypeScript, Node.js, HTML5, React, and WebSockets.
  - Strong understanding of Client/Server architectures and
    scalable system design.
  - Experience building backend services and APIs
  - The ability to confidently engage both technical and non-
    technical stakeholders
  - Partner facing experience across technical and business
    domains
  - Experience integrating payment systems, metadata and other
    B2B APIs.
  - Platform development experience with Android TV or browser
    based TV platforms
  - Familiarity with embedded devices, OEMs, SoC providers, or
    pay TV operators

  About the Team

  The Ecosystem Engineering team at Crunchyroll plays a
  pivotal role in enhancing and expanding our users'
  experiences. We collaborate extensively with a diverse
  network of partners to integrate, test, deploy, and improve
  the Crunchyroll streaming application, content discovery
  APIs, and billing integration APIs over the entire device
  lifecycle using Crunchyroll tools and data.

  We're focused on:

  - Driving subscriber growth through new device integrations.
  - Opening new acquisition and distribution channels.
  - Delivering high-quality, consistent user experiences across
    all platforms.
  - Innovating in the highly competitive global streaming market

  Situated at the crossroads of technology and business, we
  are dedicated to continually enabling experiences that
  delight anime fans across the globe.

  Why you will love working at Crunchyroll

  In addition to getting to work with fun, passionate and
  inspired colleagues, you will also enjoy the following
  benefits and perks:

  - Receive a great compensation package including salary plus
    performance bonus earning potential, paid annually.
  - Flexible time off policies allowing you to take the time you
    need to be your whole self.
  - Generous medical, dental, vision, STD, LTD, and life
    insurance
  - Health Saving Account HSA program
  - Health care and dependent care FSA
  - 401(k) plan, with employer match
  - Employer paid commuter benefit
  - Support program for new parents
  - Pet insurance and some of our offices are pet friendly!

  #LifeAtCrunchyroll #LI-Hybrid

  About our Values

  We want to be everything for someone rather than something
  for everyone and we do this by living and modeling our
  values in all that we do. We value

  - Courage. We believe that when we overcome fear, we enable
    our best selves.
  - Curiosity. We are curious, which is the gateway to empathy,
    inclusion, and understanding.
  - Kaizen. We have a growth mindset committed to constant
    forward progress.
  - Service. We serve our community with humility, enabling joy
    and belonging for others.

  Our commitment to diversity and inclusion

  Our mission of helping people belong reflects our commitment
  to diversity & inclusion. It's just the way we do business.

  We are an equal opportunity employer and value diversity at
  Crunchyroll. Pursuant to applicable law, we do not
  discriminate on the basis of race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status.

  Crunchyroll, LLC is an independently operated joint venture
  between US-based Sony Pictures Entertainment, and Japan's
  Aniplex, a subsidiary of Sony Music Entertainment (Japan)
  Inc., both subsidiaries of Tokyo-based Sony Group
  Corporation.

