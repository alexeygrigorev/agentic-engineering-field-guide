description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission

  We're transforming how healthcare practices interact with
  Zocdoc, building intelligent systems that understand each
  practice's needs and guide them toward actions that grow
  their business. This means personalized homepages, smart
  recommendations, AI-assisted configuration, and workflows
  that make Zocdoc essential to daily operations.

  As Senior Software Engineer, you'll build these systems end-
  to-end. You'll own features from design through production,
  work across the stack, and collaborate with Product, Design,
  and Data Science to ship experiences that matter.

  What You'll Do

  - Build platform components - including practice profile
    services, engagement scoring pipelines, recommendation
    APIs, personalization infrastructure.
  - Ship product features end-to-end - database to API to front-
    end, owning the full lifecycle.
  - Work with Data Science to integrate ML models  build feature
    pipelines, call model endpoints, instrument feedback
    loops.
  - Write production-ready code with strong testing,
    observability, and error handling.
  - Participate in design discussions and contribute to
    architecture decisions. Deliver complex components with
    strong engineering judgment.
  - Improve engineering practices - including testing, CI/CD,
    monitoring, documentation.
  - Mentor junior engineers through code reviews and pairing.

  You'll enjoy this role if you are…

  - Inspired by the opportunity to positively impact the
    healthcare experience for millions of patients and
    providers
  - Passionate about building full-stack features that users
    love, with a strong sense of ownership from idea to
    production
  - Product-driven with a relentless focus on user needs, and
    excited to collaborate closely with cross-functional teams
  - Comfortable working with data — building pipelines,
    computing aggregations, and integrating ML model outputs
    into product experiences
  - A champion of engineering fundamentals who cares about code
    quality, testing, and maintainability
  - Someone who takes initiative, sees features through to
    completion, and takes pride in shipping
  - A collaborator who mentors teammates, gives thoughtful code
    reviews, and learns from others
  - A believer that diverse and inclusive teams and cultures are
    non-negotiable

  Your day to day is…

  - Building platform components that power engagement
    intelligence — practice profile services, engagement
    scoring pipelines, recommendation APIs, personalization
    infrastructure, and more
  - Shipping product features end-to-end — from database schema
    to API to front-end, owning the full lifecycle
  - Working with Data Science to integrate data-driven features
    — building pipelines, calling model endpoints, and
    instrumenting feedback loops to measure outcomes
  - Building the product surfaces that deliver recommendations
    to users — personalized homepage modules, in-product
    messaging, and value reinforcement ("You gained 15
    bookings this week")
  - Working with cutting edge GenAI tools and technology
  - Collaborating with our agile team of dedicated engineers,
    product managers, designers, and data scientists
  - Participating in design discussions — contributing to
    architecture decisions and learning from Staff engineers
  - Improving engineering practices — testing, CI/CD,
    monitoring, documentation
  - Mentoring junior engineers through code reviews and pairing

  You'll be successful in this role if you have…

  - 5+ years of software engineering experience building
    production systems
  - Full-stack capabilities — comfortable across backend
    services, APIs, and front-end
  - Experience with data pipelines or ETL — you've built systems
    that aggregate, transform, or serve data
  - Comfort working with ML outputs — you can integrate models
    (call APIs, handle predictions, log outcomes)
  - Strong fundamentals — data structures, system design,
    debugging
  - The ability to integrate generative AI tools into daily
    workflows to automate tasks, foster innovation, and
    maximize productivity
  - Good judgment on tradeoffs — you know when to optimize and
    when to ship
  - Ownership mentality — you see features through to production

  Benefits:

  - Flexible, hybrid work environment at our convenient Soho
    location
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - Commuter Benefits
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Catered lunch everyday along with beverages and snacks
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified

  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
  with market data. Base salary offered is determined by a
  number of factors including the candidate’s experience,
  qualifications, and skills. Certain positions are also
  eligible for variable pay and/or equity; your recruiter will
  discuss the full compensation package details.

  NYC Base Salary Range

  $173,000—$221,000 USD

  About us Zocdoc is the country’s leading digital health
  marketplace that helps patients easily find and book the
  care they need. Each month, millions of patients use our
  free service to find nearby, in-network providers, compare
  choices based on verified patient reviews, and instantly
  book in-person or video visits online. Providers participate
  in Zocdoc’s Marketplace to reach new patients to grow their
  practice, fill their last-minute openings, and deliver a
  better healthcare experience. Founded in 2007 with a mission
  to give power to the patient, our work each day in pursuit
  of that mission is guided by our six core values. Zocdoc is
  a private company backed by some of the world’s leading
  investors, and we believe we’re still only scratching the
  surface of what we plan to accomplish.

  Zocdoc is a mission-driven organization dedicated to
  building teams as diverse as the patients and providers we
  aim to serve. In the spirit of one of our core values -
  Together, Not Alone, we are a company that prides itself on
  being highly collaborative, and we believe that diverse
  perspectives, experiences and contributors make our
  community and our platform better.  We’re an equal
  opportunity employer committed to providing employees with a
  work environment free of discrimination and harassment.
  Applicants are considered for employment regardless of race,
  color, ethnicity, ancestry, religion, national origin,
  gender, sex, gender identity, gender expression, sexual
  orientation, age, citizenship, marital or parental status,
  disability, veteran status, or any other class protected by
