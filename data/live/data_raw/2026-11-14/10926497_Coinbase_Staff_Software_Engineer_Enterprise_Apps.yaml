description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  As a Staff Software Engineer on the Agent Engagement and
  Experience team within Coinbase's Enterprise Applications
  and Architecture (EAA) org, you'll build the customer
  experience platforms that power customer service and
  compliance processes for CX agents across the company. This
  team creates innovative services, tools, and applications
  that help resolve customer issues and compliance KYC
  processes faster and with greater accuracy. You'll anchor
  new projects, set technical direction, and mentor engineers
  while architecting the distributed systems that directly
  improve customer satisfaction and compliance outcomes at
  scale.

  What you'll do:

  - Architect and deliver distributed backend systems and
    foundational infrastructure components, including dynamic
    configuration, container orchestration, and secrets
    storage, using Golang, gRPC, TypeScript, and React
  - Lead technical direction for the team by defining strategic
    roadmaps with engineering management and stakeholders,
    translating ambiguous problems into clear architectural
    plans with measurable outcomes
  - Build and scale high-reliability services that streamline CX
    agent workflows and compliance processes, owning end-to-
    end delivery from design through production deployment
  - Mentor engineers on design techniques, coding standards,
    testing practices, and operational best practices, raising
    the overall engineering quality bar across the team
  - Partner cross-functionally with teams across multiple time
    zones to identify platform improvements, foresee potential
    issues, and communicate complex technical concepts clearly
    to both technical and non-technical leaders

  Required Skills and Experience:

  - 8+ years of software engineering experience, with
    demonstrated ability to architect and deliver distributed
    systems that solve ambiguous, high-impact problems
  - Deep proficiency in Go (Golang) and experience building
    scalable, high-traffic backend services in production,
    including API development (gRPC, GraphQL), event-driven
    architectures (Kafka, MQ), and SQL or NoSQL databases
  - Hands-on experience with cloud infrastructure and DevOps
    tooling such as AWS, Kubernetes, Terraform, and CI/CD
    pipelines (BuildKite or similar), including rate limiters,
    caching, load balancing, circuit breakers, and
    observability (metrics, logging, tracing)
  - Proven track record of leading technical projects end-to-
    end, mentoring engineers, and influencing architectural
    decisions across teams without direct authority
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $218,025—$256,500 USD

