description: |
  About Aalyria:

  Aalyria is a leading technology company that supplies laser
  communications technology and temporospatial software-
  defined networking platforms to the aerospace industry. With
  technology acquired from Google, Aalyria is at the forefront
  of innovation in satellite and airborne mesh networks, as
  well as cislunar and deep-space communications. We are
  revolutionizing the orchestration and management of
  planetary mesh networks using any radio or optical spectrum,
  any orbit, and any hardware across land, sea, air, and
  space.

  Role Overview:

  We are seeking a highly motivated and experienced Software
  Engineer to join our core engineering team. We value
  engineers who are adaptable, proactive, and eager to tackle
  new challenges as we advance our technology. The ideal
  candidate will bring a solid technical background and a
  proven track record in solving complex engineering
  challenges. As a software engineer on the Spacetime team,
  you will play an integral role in developing and optimizing
  systems critical to our business, with the flexibility to
  contribute to and take ownership of various projects as both
  you and the company grow. You will be working alongside a
  team of seasoned engineers from top-tier tech companies,
  managing project priorities, timelines, and deliverables
  while designing, developing, testing, and maintaining core
  software.

  Our products are evolving rapidly and have generated a great
  deal of interest in the industry. This creates an exciting
  and continuous stream of innovative technical projects to
  dive into.

  Key Responsibilities:

   Some examples of initiatives you might be a part of
  include:

  - Scale and optimize distributed systems powering link
    modeling computations, with a focus on improving
    performance, parallelism, and reliability across
    heterogeneous compute environments.
  - Optimize computational pipelines by migrating workloads from
    CPU-bound implementations to GPU-accelerated
    architectures.
  - Optimize production-grade link modeling algorithms to
    increase system capacity and service sellability,
    leveraging advanced techniques in signal processing and
    linear algebra.

  Required Qualificiations:

  - Bachelor’s or Master’s degree
  - 7+years of experience with software development
  - Proficiency in Golang, C/C++, Rust, or Java
  - Demonstrated leadership in technical design and architecture
    to drive projects from conception through production
    launch.
  - Proficiency in coding, problem-solving, design, system
    health, diagnosis and resolution, and software test
    development.
  - 3+ years of experience with developing large-scale
    infrastructure, distributed systems or networks.
  - Familiarity with cloud infrastructure, container
    orchestration, and distributed data systems.
  - Experience with performance, large scale systems data
    analysis, visualization tools, or debugging.

  What We Offer:

  - Innovative Environment: Work at a cutting-edge company
    shaping the future of aerospace communications.
  - Impactful Work: Directly contribute to critical national
    security programs and initiatives.
  - Growth Opportunities: Expand your career with opportunities
    for professional development and advancement.
  - Inclusive Culture: Be part of a collaborative, supportive,
    and inclusive workplace where your contributions matter.
  - Flexibility: Flexible working arrangements including hybrid
    remote/in-office schedules.
  - Compensation and Equity: Competitive salary, comprehensive
    benefits (401(k), dental, vision, health, life insurance),
    paid time off, and equity options.

  Benefits:

  - Competitive salary
  - Pension
  - Health insurance
  - Equity

  Work Requirements & Location:

  - Applicants must have the right to work in the United
    Kingdom.
  - Work Location: Remote working within the UK.

  Equal Opportunity Employer Statement:

  Aalyria is an Equal Opportunity Employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. We do not discriminate based
  on race, color, religion, sex (including pregnancy, gender
  identity, and sexual orientation), national origin, age,
  disability status, genetic information, protected veteran
  status, or any other characteristic protected by law.
  Qualified applicants from all backgrounds are encouraged to
  apply.
