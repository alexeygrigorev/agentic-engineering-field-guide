description: |
  - Own end-to-end quality verification and validation for
    complex systems, from design through production.
  - Help shape how verification and validation standards evolve
    as our engineering model matures.
  - Remote-first opportunity for US-based employees, with the
    option to work in person from our Manhattan office.

  Start your adventure with Zip

  Join Zip's Engineering team and put your name to solving
  fascinating quality challenges at scale in an agile, AI-
  forward development environment. If you bring a strong
  quality mindset, deep technical expertise, and a relentless
  curiosity to uncover edge cases and hidden defects, you'll
  be a great fit with the squads responsible for building
  cloud-native software applications that serve millions of
  customers and process billions of dollars in payments.

  In this role, you will partner closely with engineers,
  design, product managers, and stakeholders to ensure quality
  is built in, not tested in. Your ability to design
  comprehensive test strategies, drive root cause analysis,
  and bring disciplined verification and validation to every
  release will be critical as Zip's verification & validation
  organization continues to take shape.

  Interesting problems you'll get to solve

  - Apply verification (confirming a system is built right;
    correct against spec, architecture, and code quality) and
    validation (confirming it's the right system, that it
    actually solves the business problem) to everything you
    test.
  - Design and execute comprehensive test strategies with a
    strong focus on edge cases, failure modes, and real-world
    scenarios.
  - Build and maintain robust, scalable automation frameworks
    across backend (API, integration testing) and frontend
    (UI, end-to-end testing).
  - Identify gaps in test coverage and system behavior
  - Drive root cause analysis and contribute to prevention
    strategies for defects and incidents.
  - Leverage AI-assisted tools throughout the testing lifecycle
    to accelerate test design, strengthen debugging, and speed
    up technical problem-solving.
  - Apply the same verification and validation rigor to AI- and
    agent-produced work as to human-written code, as
    engineering workflows continue to evolve
  - Explore practical applications of emerging AI capabilities
    that improve quality engineering workflows, automate
    repetitive testing work, and strengthen release
    confidence.
  - Continuously improve test efficiency, reliability, and
    execution speed.
  - Mentor team members and elevate overall quality standards
    across the team.

  What you'll bring to the team

  - 8+ years of experience in quality engineering, QA
    automation, or SDET roles, with a proven track record of
    owning quality for complex, production systems.
  - Strong ability to think critically and identify edge cases,
    failure scenarios, and subtle bugs.
  - Deep understanding of testing strategies (unit, integration,
    E2E, contract, regression).
  - Proven experience owning quality for complex production
    systems.
  - Strong programming skills (preferably TypeScript,
    JavaScript, or similar).
  - Experience building automation frameworks for backend/API
    testing and frontend/UI testing (e.g., BrowserStack,
    Playwright, Cypress, Selenium, Appium).
  - Experience with CI/CD integration and test pipelines.
  - Familiarity with mocking, stubbing, and test data
    management.
  - Strong debugging and problem-solving skills, with the
    ability to understand system architecture and identify
    risk areas.
  - A proactive mindset with a focus on prevention over
    detection.
  - Proven experience leveraging AI-assisted development tools
    across testing, debugging, and technical problem-solving
    to improve software quality, team productivity, and
    delivery speed.
  - Ability to evaluate and apply emerging AI capabilities to
    engineering workflows, using sound judgment to ensure
    quality, security, and maintainability.
  - Strong drive to learn, adapt, and grow in a fast-paced
    environment, with the comfort to operate in ambiguity as
    the Verification & Release model continues to take shape.
  - Takes ownership and accountability for outcomes, and is
    comfortable challenging assumptions and advocating for
    quality.
  - Experience mentoring other engineers and raising quality
    standards across a team.
  - Experience with performance testing, BDD frameworks, or
    microservices architectures is a plus.
  - Experience working in high-scale or fintech environments is
    a plus.
  - Our values in your DNA: Customer First, Own It, Stronger
    Together and Change the Game.

  What you’ll get in return

  Zip is a place where you’ll get out what you put in. The
  newness of our sector means we need to move at pace and
  embrace change, and our promise to you when you join the
  team is that you’ll feel empowered and trusted to make big
  things happen quickly.

  We want you to feel welcome and as though you have the
  support to be yourself, and care for yourself at work.
  Because it’s important to us that you make the most of the
  opportunities you’ll get to grow your skills and your
  career, and be surrounded by smart, friendly people and
  leaders that have your back.

  We think these are just some of the best things about being
  a Zipster. We will also offer you:

  - Flexible working culture
  - Incentive programs
  - Unlimited PTO
  - Generous paid parental leave
  - Leading family support policies
  - Company-sponsored 401k match
  - Learning and wellness subscription stipend
  - Beautiful Union Square office with a casual dress code
  - Industry-leading, employer-sponsored insurance for you and
    your dependents, with several 100% Zip-covered choices
    available

  Zip is committed to a straightforward and transparent pay
  structure. The actual base salary will be determined by
  various individualized factors, including job-related
  knowledge, skills, experience, location, internal equity, as
  well as other objective business considerations.

  The annual base Pay Range for this position is $146,000 -
  $157,000. This range reflects our US national compensation
  band (USN). Additional premium percentages may apply based
  on our tiered premium strategy.

  Subject to those same considerations, the total compensation
  package for this position may also include other elements,
  including a bonus and/or commission awards, in addition to a
  full range of medical, financial, and/or other benefits.

  *Please note that visa sponsorship is not available for this
  position.

  If hired, employees will be in an 'at-will position' and the
  Company reserves the right to modify base salary (as well as
  any other discretionary payment or compensation or benefit
  program) at any time, including for reasons related to
  individual performance, Company or individual
  department/team performance, and market factors.

