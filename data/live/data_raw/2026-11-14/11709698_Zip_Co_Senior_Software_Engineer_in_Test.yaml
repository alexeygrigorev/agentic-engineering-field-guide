  And finally…get to know us

  Zip Co Limited (ASX: ZIP) is a digital financial services
  company, offering innovative, people-centered products.

  Operating in two core markets - Australia and New Zealand
  (ANZ) and the US, Zip offers access to point-of-sale credit
  and digital payment services, connecting millions of
  customers with its global network of tens of thousands of
  merchants. We’re proud to be a values-led business and our
  values - Customer First, Own it, Stronger Together and
  Change the Game - guide us in everything we do.

