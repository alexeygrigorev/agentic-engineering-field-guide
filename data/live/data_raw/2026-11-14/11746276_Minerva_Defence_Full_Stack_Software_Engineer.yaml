description: |
  As a full stack software engineer with Minerva you will be
  responsible for taking feature requests from frontline users
  and designing, implementing, testing and shipping them. We
  are looking for engineers who are comfortable taking full
  ownership of this process across the whole stack; whether
  that is backend, frontend, embedded, ML or networking.

  Minerva Defence is one of the fastest-growing defence
  technology companies in Europe. We create the software,
  hardware and networking that make unmanned systems effective
  on the modern battlefield, all ideated, designed and
  manufactured end-to-end in the UK, and in active use today.
  We are deliberately low-profile: a team of around 70, small
  in headcount and outsized in effect. We look for people who
  are not just talented but genuinely committed to the work,
  the team, and the purpose behind it.

  You will work directly on products used by large numbers of
  frontline operators on a daily basis. You will be
  responsible for implementing features to improve their
  operational output, whether direct user requests or ideas of
  your own. We expect our full stack engineers to take
  complete ownership of the features they write, across
  implementation, field testing and deployment. As a result,
  we are looking for candidates who are comfortable across the
  full stack, including networking and lower-level work, and
  who are willing to jump into learning about new areas they
  are less familiar with if that’s what is needed to get the
  job done in a reliable way.

  Responsibilities

  - Take a lead on developing new features based on customer
    feedback, or novel Minerva products.
  - Work across the full stack, whether that’s backend (largely
    Python), frontend, embedded, networking or ML.
  - Do whatever it takes to ensure our users get reliable,
    robust feature updates which improve their operational
    output in a timely fashion.

  Requirements

  Minimum:

  - Proven experience shipping production software at a high
    standard
  - A solid grounding in backend and frontend development
  - A strong understanding of devops
  - Willingness to expand your skillset into new areas, if that
    is what is required.
  - Willingness to be involved in field testing of the features
    you own

  Preferred:

  - Experience with Linux and lower-level languages
  - Experience with networking and cyber-security
  - Experience with deploying and optimising machine learning
    models on edge devices

  Benefits

  We offer competitive compensation including;

  - Share options vesting over three years
  - Bupa private medical insurance
  - 6% employer pension contribution
  - 25 days leave plus bank holidays
  - Enhanced mat/pat leave
  - Enterprise level AI tooling
  - Relocation support/home office budget
