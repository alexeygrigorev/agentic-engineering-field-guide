description: |
  Requirements

  Millions of people want to grow their money but don't know
  where to start. More than 90% of adults don’t access
  traditional financial advice. That's the gap Plum was built
  to close.

  We're building the proactive money platform that makes it
  easy for people to smartly and sustainably grow their money.
  Whether you're stashing the cash for tea and toast in your
  first home or catching some rays during retirement, we've
  got your back.

  Since 2016, millions of people across 10 European markets
  have set aside more than £10 billion with Plum. But what
  we're most excited about is what comes next and the
  opportunity for our people to help shape it.

  We're now going after something even bigger: the £2
  trillion+ advised market in the UK and beyond, currently
  locked behind high fees and complexity. By combining AI-
  driven financial guidance with the products people actually
  need, we're building a solution for everyone, not just the
  wealthy few.

  At Plum, you'll be part of a team that's ambitious, curious
  and driven. We move fast, learn from what doesn't work,
  challenge the status quo and, most importantly, build
  something that makes people's lives better. We believe great
  ideas can come from anywhere, and that the best work happens
  when people feel trusted to take ownership, collaborate
  openly and bring their whole selves to work.

  Join nearly 300 Plumsters and be part of a team shaping the
  future of money.

  The Role

  At Plum we’re looking for engineers who are passionate about
  both technology but also about bringing the best product to
  our customers.

  To achieve this mission we’re looking for engineers who not
  only have a strong technical background but who also
  understand the product and are able to make an impact on all
  the steps of the product development lifecycle.

  We’re looking for a Senior Backend Engineer and these are
  the main qualities you should ideally possess if you want to
  be part of the team:

  Qualifications:

  - At least 5+ years of working experience as a Software
    Engineer
  - High level of pragmatism
  - Strong planning and prioritization skills
  - Promote Continuous Improvement by identifying process
    efficiencies and quality improvements
  - Provide guidance to and mentor more junior team members
  - Being able to share product insight with stakeholders and
    challenge product decisions
  - Demonstrated capacity to clearly and concisely communicate
    about complex technical, architectural, and/or
    organizational challenges and propose thorough iterative
    solutions
  - Experience in working within a cross functional team,
    collaborative environment, ability to partake in and
    contribute to technical, design and retrospective dialog
  - Self-motivated and self-managing, with excellent
    organizational skills
  - Comfortable working with both strongly and dynamically typed
    languages, we believe you can bring valuable insights and
    perspectives to the team, even if Python is not your
    primary language. We care more about your overall
    programming skills and approach to problem-solving!

  Key Responsibilities:

  - Being able to create and design modular, scalable, testable,
    tested, performant systems which interface via well
    defined endpoints using software engineering best
    practices
  - Being able to identify root cause of system issues and
    determine short and long term resolutions

  - Adaptability and flexibility, we are building new and novel
    products and believe that we can provide our users the
    best products by shipping fast and getting feedback to
    improve on later iterations
  - Able to work and intervene on the whole life cycle of the
    software

  Our Tech Stack:

  - Tech Stack: Kotlin with Spring Boot & Python with FastAPI
  - Datastores: Postgres, BigQuery,
  - Infrastructure: GCP (kubernetes, docker), RabbitMQ,
    Terraform
  - Monitoring: Grafana, Prometheus, Datadog, Incident.io,
    Sentry

  What to Expect from Our Hiring Process At Plum, we value a
  lot the time you devote to the hiring process, this is why
  we are always trying to make the process as fast and smooth
  as possible.

  - 30 min. Call with ourTalent Acquisition Team. So we
    understand better your career plan, tell you more about
    Plum and the role ⚙️
  - 45 min. Call with our Engineering Lead. Brief technical
    discussion about the role and your skills 🏄
  - 120 min. Live Coding Call with our Engineers, including
    System Design exercise and an Implementation phase🧑‍💻
  - 30 min. TeamCall with a Product Manager and a Senior Manager
    from Engineering, for you to understand the business and
    envision yourself as part of Plum 🧬
  - Offer 💵

  Plum's Perks

  - Own part of the company you're helping grow through stock
    options
  - Private health insurance
  - Annual training budget
  - Plum Premium for free
  - Competitive referral scheme
  - Flexible approach to remote working: we encourage at least 2
    days a week in one of our beautiful offices in London,
    Athens or Cyprus
  - Team breakfasts and team lunches
  - 25 days holiday + bank holidays
  - 45 work-from-anywhere days to give you flexibility to work
    your way
  - 2 weeks sabbatical after 4 years to take the break you
    deserve
  - Enhanced parental leave
  - 1 paid volunteering day annually
  - Annual team trip to a surprise destination!
  - A fun, inclusive company culture (think 🦄🌈💯)

  If you think this sounds like you, don’t hesitate to get in
  touch!

  Thanks,

  Plum Τeam 💜

