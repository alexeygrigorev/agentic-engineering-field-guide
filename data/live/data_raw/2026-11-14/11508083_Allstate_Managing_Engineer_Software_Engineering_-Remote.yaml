description: |
  At Allstate, great things happen when our people work
  together to protect families and their belongings from
  life’s uncertainties. And for more than 90 years, our
  innovative drive has kept us a step ahead of our customers’
  evolving needs. From advocating for seat belts, air bags and
  graduated driving laws, to being an industry leader in
  pricing sophistication, telematics, and, more recently,
  device and identity protection.

  Job Description

  The Managing Engineer architects and designs their digital
  products using modern tools, technologies, frameworks, and
  systems. They apply a systematic application of scientific
  and technological knowledge, methods, and experience to the
  design, implementation, testing, and documentation of
  software. They own and manage running their application in
  production and ultimately becomes accountable for the
  success of their digital products through achieving KPIs.
  The Managing Engineer plans, directs, designs, and executes
  IT-related activities and programs that are of a complex and
  critical nature. The Managing Engineer selects, leads,
  counsels, motivates, sets expectations and evaluates medium
  to large teams. Additionally, they confer with and advise
  direct reports on administrative policies and procedures,
  risks, issues, problem resolution, sourcing decisions,
  budget and priorities.

  Key Responsibilities

  - Leads and participates in knowledge sharing and contribute
    to the growth of team and organizational engineering
    practices
  - Leads Design, build, and enhance software products
  - Leads and participates in Design and implement testing
    strategies to validate acceptance criteria
  - Leads and promotes pair programming practice and test-driven
    development (TDD) as part of daily engineering work
  - Collaborate with the team on system and application design,
    selecting the simplest and most effective technical
    solutions
  - Leads iteration planning, ensuring a shared understanding of
    backlog stories and technical requirements
  - Leads daily standups, cross-site collaboration, and product
    team ceremonies
  - Collaborate with other digital product teams and clearly
    communicate technical designs
  - Leads and participates in retrospectives, demonstrating and
    encouraging each participant to provide feedback with
    empathy
  - Serves as the anchor of the team and practices technical
    leadership; helping guide the team in choosing the right
    technology, solving technical problems, and resolving any
    technical conflicts within the team
  - Establishes continuous integration, continuous delivery, and
    continuous deployment pipelines and practices
  - Leads collaboration and strategy alignment across product
    portfolios (cross-product) in partnership with product
    managers, other peers and key stakeholders
  - Serves as an expert on multiple business domain and a
    distinguished advocate of multiple technology stacks and
    shares that knowledge across organizations

  Essential Skills

  - 7+ years of experience in software engineering, product
    engineering, or similar skill.
  - Strong proficiency in Java 17+ and Spring Boot 3.x+
  - Strong proficiency in JVM and Application Performance
    Architecture/Management
  - Understanding of frontend engineering –
    ReactJS/AngularJS/Typescript
  - Understanding of building responsive, accessible, data-
    driven User Experiences
  - Strong understanding of REST APIs and distributed systems
  - Experience building microservices and event-driven systems
    (Kafka preferred)
  - Understanding of cloud and hybrid environment(s), including
    Azure, AWS, and various on-premises systems
  - Experience with relational/NoSQL databases
  - Familiarity with schema standards (OpenAPI/JSON/AVSC)
  - Practice Test-Driven Development (TDD)
  - Strong understanding of secure development
  - Comfortable working in a pair-programming (XP) environment
  - CI/CD experience (Jenkins/GitHub Actions), Docker,
    Kubernetes
  - Leverage Datadog or similar tools for application monitoring
    and troubleshooting

  Desired Skills

  - Working knowledge of Python
  - Understanding of MongoDB Performance Tuning
  - Understanding and ability to leverage, and or build,
    generative and agentic AI tooling to build solutions

  Supervisory Responsibilities

  - This job has supervisory duties.

  Skills

  Accountability, Accountability, AngularJS, Application
  Design, Application Lifecycle Management (ALM), Application
  Monitoring, Application Performance, Budgeting, Business
  Software, Collaboration, Communication, Computer Science,
  Continuous Delivery, Continuous Deployment, Continuous
  Integrations, Design, Docker (Software), Documentations,
  Engineering Software, GitHub Actions, Give Feedback, Java
  (Programming Language), JavaScript Object Notation (JSON),
  Key Performance Indicators (KPI), Kubernetes {+ 18 more}

  Compensation

  Compensation offered for this role is 120,000.00 -
  193,725.00 annually and is based on experience and
  qualifications.

  The candidate(s) offered this position will be required to
  submit to a background investigation.

  Joining our team isn’t just a job — it’s an opportunity. One
  that takes your skills and pushes them to the next level.
  One that encourages you to challenge the status quo. One
  where you can shape the future of protection while
  supporting causes that mean the most to you. Joining our
  team means being part of something bigger – a winning team
  making a meaningful impact.

