description: |
  Array is a financial innovation platform that helps digital
  brands, financial institutions, and fintechs get compelling
  consumer products to market faster. We deliver a suite of
  credit and identity monitoring tools, privacy protection,
  and a financial ads marketplace via embeddable widgets or a
  clean, modern API.  Our private label offerings help drive
  revenue and increase engagement for our customers while
  empowering millions of consumers to achieve their financial
  goals.

  As a remote-first company, we’re focused on providing
  opportunities for high performing individuals to have deep
  impact in the fast growing fintech space. A clear mission, a
  commitment to continuous improvement and a willingness to
  experiment empower us individually and together deliver the
  best products for our clients and users.

  The Lead Svelte Software Engineer at Array will play a key
  role in shaping and elevating our front-end engineering
  practice. This role focuses on delivering high-quality,
  scalable implementations while contributing to the
  standards, patterns, and tooling that guide our broader
  engineering organization. You'll report to an Engineering
  Manager and work within a squad responsible for one of our
  product areas, driving both hands-on development and
  technical influence across teams.

  This role will start as a contract role for a 180
  probationary period before converting full time.

  This role is fully remote.

  You Will

  - Join an engineering organization filled with sharp engineers
    with a track record of building products used by millions.
  - Work with a squad of engineers to build high-quality Svelte
    Web Components that support white-label integration and
    can be fully customized through our theme editor, running
    reliably across desktop and mobile environments.
  - Collaborate closely with Product Design to extend and evolve
    our design system, ensuring components are consistent,
    scalable, and adaptable across partners and branding
    contexts.
  - Use modern tooling, including the latest AI, to think,
    build, and ship faster with less toil.
  - Help ensure the reliability and availability of the
    components you build, including participating in an on-
    call rotation with your squad.
  - Conceptualize and deliver front-end solutions with support
    and guidance from our Principal Engineers and Engineering
    Managers.
  - Become an emerging expert in modern web standards, Web
    Component architecture, front-end performance,
    accessibility, design-system-driven development, and
    scalable component patterns.
  - Spend the majority of your time building solutions rather
    than talking about them.

  You Have

  - 6+ years of professional software development experience.
  - Strong proficiency in TypeScript, HTML, and CSS, including
    accessibility best practices.
  - Experience building applications with modern JavaScript
    frameworks such as Svelte, React, or Vue.
  - Experience developing mobile applications using Kotlin
    and/or Swift.
  - 4+ years of experience building embeddable UI components
    that partners can integrate independently without direct
    engineering coordination covering white labelling and
    accessibility.
  - 2+ years of experience building production-ready Web
    Components, including embedding components into third-
    party desktop or mobile application environments and
    understanding the constraints that come with externally
    hosted integration.
  - A bias towards action. You have a proven track record of
    delivering solutions in a fast-paced environment.
  - Meaningful experience contributing to design systems,
    including building reusable components, defining tokens,
    and managing shared state patterns across complex UI
    surfaces.
  - Experience with modern front-end tooling, build systems,
    component-driven architecture, and practical state
    management patterns that support predictable and
    maintainable UI behavior.
  - Experience consuming APIs backed by relational or document
    data sources, with a clear understanding of how frontend
    systems shape, model, and present that data.
  - A portfolio or collection of work that demonstrates strong
    frontend craftsmanship, component design, and attention to
    detail.

  Pay Transparency

  $80-$100/hr for the 180 day period.

  Expected interviews

  Recruiter conversation - Technical Interview - Loop:
  Engineering Leadership Interview, How We Work Interview.

  Array Offers All Full Time Employees the following Benefits
  and Perks:

  - Full medical, dental, and vision, premiums covered at 100%
    for full-time employees and 70% for dependents
  - Unlimited PTO and sick leave + 14 company holidays to
    encourage a healthy work-life blend
  - 100% 401k match up to 4% with immediate vesting
  - Generous and competitive parental leave for all parents
  - $1,000 desk setup subsidy to set-up your unique remote
    office
  - $100/month to subsidize wifi/cell phone expenses
  - Summer Fridays (half-day Fridays) typically from late May to
    the end of August
  - Commuter benefits for those who choose to go into our New
    York City office space

  Not sure if you meet the Qualifications? We know that folks
  tend to only apply if they check every box. If you think you
  have the appropriate qualifications, but don’t meet every
  single one, we encourage you to still apply. We’d love to
  hear from you.

  We are proud to be an equal opportunity workplace; we are
  committed to equal employment opportunity regardless of
  race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, citizenship, marital status,
  disability, gender identity or Veteran status. Array will
  provide reasonable accommodations to qualified applicants—if
  you need an accommodation to participate in the application
  or interview process, please email talent@array.com to make
  your request.

  Array uses CLEAR to conduct identity verification as part of
  the application process. We encourage you to review CLEAR’s
  Privacy Notice and Terms of Use to understand how your
  personal data will be processed.
