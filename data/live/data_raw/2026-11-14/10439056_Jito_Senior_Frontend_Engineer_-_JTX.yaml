description: |
  JTX is our trading app, and it runs on the fastest market
  infrastructure on Solana, which we also built. What nobody
  has done yet is make that speed something a trader can feel.
  That is this job.

  JTX is live. Two frontend engineers built it to this point
  and you would be the third. The work now is one to a
  hundred: harden what exists, make it hold up under real
  volume, expand onto mobile, and raise the ceiling on every
  screen a trader touches.

  We're a small team with product-market fit. That means:

  - High ownership: every team member drives significant
    technical decisions and shapes our product roadmap.
  - Fast execution: we ship rapidly and iterate based on real-
    world feedback. Progress, not motion.
  - High quality bar: the details are the product. We don't
    trade them for speed.

