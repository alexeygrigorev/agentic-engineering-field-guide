description: |
  At Playlist, life's richest moments happen when people step
  away from screens to move, connect, explore, and play. We're
  building the definitive platform for intentional living,
  connecting people with inspiring experiences in fitness,
  wellness, and beyond. With popular brands like Mindbody and
  ClassPass, Playlist empowers businesses and individuals,
  making it effortless for aspirations to become actions. Join
  us in reshaping technology's role to foster meaningful,
  real-world connections.

  Mindbody equips wellness entrepreneurs with technology to
  support thriving businesses and create exceptional
  experiences. Innovation and curiosity drive our culture,
  connecting businesses and individuals through cutting-edge
  solutions. Join us if you're passionate about enhancing
  wellness through technology.

  Your role

  As a Senior Software Engineer, you’ll play a crucial
  leadership role in building scalable systems for the
  Mindbody ecosystem. You’ll exercise autonomy in decision-
  making, take ownership of large technical projects, and
  provide leadership within your team and across engineering.
  You proactively identify and solve challenges your squad is
  facing, often leading medium-to-large features and cross-
  team efforts. You act as a multiplier for your team,
  mentoring engineers, sharing best practices, and
  contributing to a culture of growth and learning. You’ll
  pursue continuous improvement to help Mindbody achieve its
  mission: Powering the world’s fitness and wellness
  businesses and connecting them with more consumers, more
  effectively, than anyone else

  You'll likely spend time working on

  - Leading discussions with Product, Design, and QA to iterate
    on the design, implementation and deployment of our
    product.
  - Build, maintain, and own backend systems and applications.
  - Seeking different perspectives and soliciting honest
    feedback
  - Practice engineering best practices (e.g., automated
    testing, code reviews, proper monitoring) while guiding
    others on their adoption, and contributing thoughtful,
    timely feedback during peer reviews.
  - Mentoring and leading through code reviews, teaching best
    practices, and conducting technical interviews for
    engineers and managers.
  - Leading retrospectives and incident postmortems for your
    squad.
  - Helping attract and retain talent by building community
    inside and outside the organization
  - Care about our studio partners and want to help them grow
    their business
  - Take delight in delighting our users.

  About the right team member

  You love to design robust and easy to use APIs and services
  taking ownership of technical decisions. You’re capable of
  leading complex technical projects with high levels of
  uncertainty, scale, and interdependencies—creating
  timelines, delegating tasks, and ensuring smooth launches.
  You learn quickly and ramp up on new systems, languages, or
  frameworks with minimal guidance. You’re not afraid to ask
  questions early and often in unfamiliar territory. You are a
  sought-after contributor in code reviews, helping elevate
  code quality through timely and constructive feedback. You
  are an expert in one or more technical areas and are
  recognized within your team as a trusted source of insights
  and mentorship.

  At Playlist we value people who are intellectually curious,
  who are pragmatic not dogmatic, and people who care about
  our product, their teammates, and their own personal growth.
  We are faced with an interesting set of technical
  challenges, and we believe in giving our engineers the
  autonomy to go and solve them. Much of our team comes from
  non-traditional computing backgrounds; we know that by
  bringing together a diverse set of voices we’ll be able to
  build a better product, and a better company. We care less
  about what languages or frameworks you know, and care more
  that you are excited to produce high-quality code and be
  constantly learning. Our engineers work in cross-functional
  teams that are focused on impact, and movement between teams
  is encouraged. We work very closely with our brilliant
  product team to deliver a world class user experience, and
  ultimately to empower our users to live their fullest,
  healthiest lives.

  You'll thrive in this role with experience in

  - 8+ years' experience in programming large-scale SaaS
    products.
  - Experience building backend services with an object-oriented
    language such as C# or Java.
  - Experience designing and architecting backend services.
  - Experience Designing and working with Microservice
    architecture.
  - Experience with monitoring systems such as New Relic or
    Kibana.
  - Familiarity with SDLC and programming design patterns, and
    Agile methodology.
  - Experience reviewing new feature impact on an application
    and recognizing potential risks.
  - Detail-oriented, professional and possesses a positive work
    attitude.
  - Ability to communicate professionally both verbally and in
    writing.

  Nice to have

  - Experience building or operating payment flows end to end —
    authorization, capture, settlement, refunds, and
    reconciliation.
  - Hands-on integration with a payment gateway or PSP,
    including webhook-driven state handling.
  - Experience making payment operations safe to retry —
    idempotency, retries, and eventual consistency — so a
    request that fails partway through doesn't double-charge a
    customer.
  - Working knowledge of PCI DSS scope, tokenization, and
    handling sensitive payment data safely.

  Technologies you’ll be working with

  ~ You don’t need experience with every item below—what
  matters is strong fundamentals and the ability to learn
  quickly ~

  - Experience building high-performing, high-quality backend
    systems. Our codebase is diverse and includes .NET, C#,
    Java, JavaScript, Kotlin, Python, React, and Ruby, but
    we’re less focused on experience with a specific language
    and more interested in your ability to build reliable,
    well-designed systems.
  - Data: PostgreSQL/MongoDB/DynamoDB, Redis, schema migrations,
    indexing, partitioning/sharding
  - Strong understanding of SQL and relational databases.
  - AWS Cloud
  - AI tooling: Claude Code/ Cursor/ Codex-style coding
    assistants; MCPs; agent/orchestration frameworks; safety
    harnesses
  - Engineering Practices: automated testing, code reviews,
    CI/CD, observability, on-call, incident management — with
    AI-accelerated workflows where appropriate

  It is the Company’s intent to pay all Team Members
  competitive wages and salaries that are fair and equitable.
  Actual compensation packages are based on several factors
  unique to each candidate, including skill set, depth of
  experience, certifications, and work location. The goal of
  Company's compensation program is to be transparent, attract
  potential employees, meet the needs of all current
  employees, and encourage Team Members to stay with our
  organization.

  The base salary range for this position in the United States
  is $156,000 - $208,000. The total compensation package may
  also include a performance bonus, benefits, and other
  applicable incentive compensation plans.

