description: |
  The Opportunity As a Tax Innovation - Software Engineering -
  Senior Manager you will lead software engineering efforts
  that support tax technology solutions, bringing together
  design, coding, testing, and delivery across client-facing
  work within our Tax practice. As a Senior Manager you will
  lead large projects, use sound judgment in complex settings,
  coach teams through ambiguity, and shape clear messages that
  connect technical work to business needs. In this role at
  PwC, you will guide software and product innovation efforts
  that help deliver digital solutions, support product
  development, and advance the work of the Tax Innovation team
  through collaboration, thoughtful problem solving, and
  steady delivery. Responsibilities
  - Advising tax innovation stakeholders on software engineering
    strategies that support digital transformation and product
    development
  - Leading application design, coding, testing, and deployment
    activities for tax technology solutions
  - Translating tax service delivery needs into scalable
    software architectures, microservices, and enterprise
    application patterns
  - Managing software project planning, delivery milestones, and
    risk tracking across cross-functional workstreams
  - Applying software development methodology and application
    lifecycle management practices to guide solution delivery
  - Developing C#.NET based applications and integrating AI-
    enabled capabilities where business value can be advanced
  - Reviewing solution architecture options and technical
    tradeoffs to support sustainable platforms and efficient
    maintenance
  - Coaching engineers and analysts through complex technical
    issues, code reviews, and delivery decisions
  - Validating client feedback and adapting solution direction
    to reflect business priorities and technical constraints
  - Promoting clear communication of system design, delivery
    status, and implementation impacts across stakeholders
  What You Must Have
  - At least a Bachelor's degree
  - At least 6 years of experience
  What Sets You Apart
  - Crafting clear, impactful messages that tell a holistic
    story
  - Applying systems thinking to identify underlying problems
    and opportunities
  - Validating client outcomes, sharing alternative
    perspectives, and acting on feedback
  - Directing teams through complexity and ambiguous situations
    with composure
  - Deepening software engineering and tax innovation skills
    continuously
  - Initiating open coaching conversations and resolving team
    effectiveness issues
  The salary range for this position is: $124,000 - $335,000.
