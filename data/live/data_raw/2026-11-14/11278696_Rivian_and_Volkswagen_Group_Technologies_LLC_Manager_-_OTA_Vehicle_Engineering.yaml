description: |
  About Us

  Rivian and Volkswagen Group Technologies is a joint venture
  between two industry leaders with a clear vision for
  automotive’s next chapter. From operating systems to zonal
  controllers to cloud and connectivity solutions, we’re
  addressing the challenges of electric vehicles through
  technology that will set the standards for software-defined
  vehicles around the world.

  The road to the future is uncharted. By combining our
  expertise across connectivity, AI, security and more, we’ll
  map a new way forward. Working together, we’ll create a
  future that’s more connected, more intelligent, more
  sustainable for everyone.

  Role Summary

  RV Tech is redefining what a car can be by making continuous
  iteration and improvement core to the product. Over-the-Air
  (OTA) Updates are what make that model possible — allowing
  us to seamlessly and rapidly deliver the latest software to
  both engineering and customer vehicles. As a result, the OTA
  system sits on the critical path of RV Tech's entire
  development chain.

  As Manager of OTA Vehicle Engineering Berlin, you will lead
  and grow the Berlin chapter of RV Tech’s OTA team so that
  they may develop end to end features within the broader OTA
  ecosystem and support the Volkswagen Group directly in our
  joint effort to build a software defined vehicle.

  We are looking for a highly motivated leader who can operate
  credibly from the electrical layer to the business strategy
  layer, and who thrives in complex, ambiguous, high-stakes
  environments.

  This role is based in our Berlin office and requires a
  minimum of three days per week onsite.

  Responsibilities

  - Lead and grow the team from a technical and architectural
    perspective so that they can become an autonomous and self
    sustaining chapter within the larger OTA organization
  - Own development and testing of OTA features assigned to the
    Berlin chapter
  - Collaborate with the larger OTA engineering org across all
    sites (Palo Alto, Irvine, and Belgrade) to build effective
    work distribution processes to ensure the efficient
    operation as a satellite chapter
  - Collaborate with Volkswagen Group partners
  - Ability to spend at least 50% of their time contributing
    technically to the OTA system

  Qualifications

  Leadership Qualifications

  - 5+ years in software development or integration, including
    2+ years managing engineers.
  - Track record of leading technical teams within a highly
    cross functional, international environment
  - Proven ability to bring order to a complex product and
    stakeholder network — technically, operationally, and
    organizationally.
  - Ability to reason across the full tech stack, from domain
    software to larger vehicle architecture architecture, and
    speak authoritatively at each level.

  - Experience building software platforms for complex,
    distributed, electromechanical systems (aerospace,
    automotive, defense, or robotics).
  - Experience with systems engineering and architectural
    development.
  - Experience establishing software development processes, test
    automation, and operational KPIs.

  Technical Experience

  Required

  - High-performance C++ and/or Rust applications for co-
    habitated POSIX systems.
  - Embedded software in C and/or Rust for real-time operating
    systems.
  - Experience Developing test automation software in Python and
    Go.

  Preferred

  - Experience in developing software infrastructure Over the
    Air Updates on deployed products
  - Experience with automotive diagnostic protocols UDS, SOVD
  - Experience with automotive communication protocols CAN, LIN,
    Flexray, ETH-UDP, ISO-TP over ETH-TCP

  Total Rewards

  We build the exceptional — and we believe the people doing
  that work should be rewarded accordingly. In addition to a
  competitive base salary, full-time positions may be is
  eligible to participate in our annual company performance
  bonus program.

  Payments are discretionary and not guaranteed; actual
  amounts depend on company results and the terms of the plan
  in effect, and require active employment at the time of
  payout. This role is also eligible for equity in the form of
  Restricted Stock Units (RSUs), subject to board approval and
  the terms of our equity incentive plans, including
  applicable vesting requirements.

  In addition to our compensation programs, we invest in our
  people with a comprehensive benefits package designed to
  support the health, wellbeing, and financial future for
  full-time employees — including health coverage, retirement
  savings, time off, and family planning programs. Offerings
  vary by country. Learn more about our global benefit
  programs.

  External candidates can apply for this role through the
  Rivian and Volkswagen Group Technologies careers site
  (https://rivianvw.tech/#careers). If you are a current
  employee, please apply through our internal job board.

