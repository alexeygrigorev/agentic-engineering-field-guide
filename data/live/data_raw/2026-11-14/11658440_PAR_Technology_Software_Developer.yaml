description: |
  For over four decades, PAR Technology Corporation (NYSE:
  PAR) has been a leader in restaurant technology, empowering
  brands worldwide to create lasting connections with their
  guests. Our innovative solutions and commitment to
  excellence provide comprehensive software and hardware that
  enable seamless experiences and drive growth for over
  100,000 restaurants in more than 110 countries. Embracing
  our "Better Together" ethos, we offer Unified Customer
  Experience solutions, combining point-of-sale, digital
  ordering, loyalty and back-office software solutions as well
  as industry-leading hardware and drive-thru offerings. To
  learn more, visit partech.com or connect with us on
  LinkedIn, X (formerly Twitter), Facebook, and Instagram.

  Position Description: PAR is looking for a Software
  Developer to support cloud engineering operations and active
  software development projects. This role is ideal for
  someone with a strong software engineering or cloud
  infrastructure background who has experience with cloud
  operations, automation, and modern development practices.
  The Software Developer will contribute to highly technical
  software projects, help troubleshoot and resolve technical
  issues, and identify opportunities to improve products,
  systems, interfaces, business processes, and overall
  performance. This role will work closely with a cross-
  functional team including other engineers, QA, developers,
  business analysts, technical leads, the Head of Product, and
  the Development Manager. The ideal candidate is comfortable
  learning new technologies and is passionate about
  continually improving development practices.

  Position Location: Remote (United States)

  Reports To: Development Manager and Development Team Leader

  What We’re Looking For:

  - 3+ years of experience working on desktop applications.
  - Strong software engineering or cloud infrastructure
    background with a solid understanding of technical cloud
    operations and automation.
  - Experience with cloud-based infrastructure and services such
    as Microsoft Azure and Amazon Web Services (AWS).
  - Strong scripting skills using technologies such as
    PowerShell, Python, Perl, and Ansible.
  - Understanding of networking and network security.
  - Ability to ensure operational quality is incorporated into
    software delivery projects.
  - Willingness to learn and adopt new technologies as needed.
  - Strong collaboration skills and the ability to work
    effectively within cross-functional teams.

  Additional skills:

  - Ability to evaluate and implement solutions that improve
    system performance and business process efficiency.
  - Experience reviewing code and solutions to ensure
    development best practices are followed.
  - Experience providing coaching, mentoring, or knowledge-
    sharing opportunities to other developers.
  - Strong understanding of development practices and standards.
  - Ability to identify opportunities to improve products,
    systems, interfaces, and business processes through
    technology.

  Unleash your potential: What you will be doing and owning:

  - Troubleshoot technical issues and develop and implement
    remediation plans.
  - Perform hands-on software development, including writing and
    reviewing code.
  - Ensure cloud technologies are being used efficiently and
    that solutions meet established quality standards.
  - Identify and deliver technology solutions that improve
    products, systems, interfaces, business processes, and
    performance.
  - Support other software developers through coaching,
    mentoring, and knowledge-sharing opportunities.
  - Contribute to improving development capabilities across the
    team and organization.
  - Champion a positive development culture and collaborate
    effectively with cross-functional teams.
  - Determine appropriate automation and tooling approaches for
    build, release, and container platforms.
  - Determine when solutions and code changes are ready to move
    to the next stage of delivery.
  - Identify when technical issues or risks should be escalated
    to the Development Manager and Team Lead.
  - Help identify opportunities to improve products, systems,
    and business processes through technology.

  Interview Process: Interview #1: Phone Screen with Talent
  Acquisition Team Interview #2: Video interview with the
  Hiring Manager (via MS Teams) Interview #3: Video interviews
  with the Team (via MS Teams)

