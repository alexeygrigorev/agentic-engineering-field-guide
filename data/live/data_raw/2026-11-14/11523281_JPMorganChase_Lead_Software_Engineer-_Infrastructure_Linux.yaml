description: |
  Push the limits of what’s possible while building technology
  that teams rely on every day. In this role, you’ll tackle
  complex engineering problems across multiple technical areas
  and see your work drive real business outcomes. You’ll
  collaborate with talented peers in an agile environment,
  with opportunities to grow your impact and expand your
  skills. If you enjoy building secure, resilient systems and
  improving how teams deliver software, you’ll feel at home
  here.

  As a Lead Software Engineer at JPMorgan Chase within
  Corporate Technology, you will be an integral part of an
  agile team that enhances, builds, and delivers trusted,
  market-leading technology products in a secure, stable, and
  scalable way. You will conduct critical technology solutions
  across multiple technical areas within various business
  functions in support of the firm’s business objectives. You
  will contribute hands-on engineering expertise while helping
  the team raise standards for quality, automation, and
  operational excellence.

  Job Responsibilities

  - Execute creative software solutions, including
    Infrastructure as Code (IaC), spanning design,
    development, and technical troubleshooting.
  - Develop secure, high-quality infrastructure patterns,
    primarily in Red Hat Linux environments.
  - Drive adoption of enterprise-authorized AI-assisted
    engineering practices to improve code quality, delivery
    speed, and operational outcomes.
  - Apply Software Development Life Cycle (SDLC) tooling,
    including approved AI-assisted development and automation
    capabilities, to increase the value realized from
    automation.
  - Identify opportunities to eliminate recurring issues or
    automate remediation to improve operational stability
    across applications and systems.
  - Lead evaluation sessions with external vendors, startups,
    and internal teams to assess architectural designs,
    technical credentials, and fit within existing systems and
    information architecture.

  Required Qualifications, Capabilities, and Skills

  - Hands-on experience delivering infrastructure and system
    design, application development, testing, and operational
    stability.
  - Advanced proficiency in one or more programming languages.
  - Demonstrated ability to lead effective use of approved AI-
    assisted software development tools, including setting
    expectations to validate outputs for correctness,
    performance, and security.
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity, secure handling of
    inputs and outputs, and adherence to resiliency and
    security expectations.
  - Proficiency across all aspects of the Software Development
    Life Cycle.
  - Advanced understanding of agile engineering practices,
    including CI/CD, application resiliency, Infrastructure as
    Code, and security.
  - Strong practical experience implementing and supporting Red
    Hat Linux environments.

  Preferred Qualifications, Capabilities, and Skills

  - Knowledge of financial services technology landscapes and
    operating environments.
  - Practical cloud-native experience.

