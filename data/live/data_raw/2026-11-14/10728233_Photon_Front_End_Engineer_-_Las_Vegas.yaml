description: |
  Front End Engineer:

  JOB DESCRIPTION:

  Senior React Developer Position Summary

  We are seeking a highly skilled Senior React Developer to
  join our engineering team. The ideal candidate will have
  deep expertise in building modern web applications using
  React, TypeScript, and automated testing frameworks such as
  Cypress. This role requires strong front-end engineering
  skills, a passion for creating exceptional user experiences,
  and the ability to collaborate effectively with cross-
  functional teams. Experience with Java/Spring Boot on the
  backend is a strong plus.

  Responsibilities

  - Design, develop, and maintain scalable, responsive web
    applications using React and TypeScript.
  - Build reusable UI components and front-end libraries for
    future use.
  - Collaborate with product managers, designers, and backend
    engineers to implement new features.
  - Write clean, maintainable, and well-tested code following
    industry best practices.
  - Develop and maintain end-to-end and integration tests using
    Cypress.
  - Optimize applications for maximum speed, performance, and
    scalability.
  - Participate in code reviews and mentor junior developers.
  - Troubleshoot and resolve complex technical issues.
  - Contribute to architecture decisions and technical roadmap
    discussions.
  - Work closely with backend teams to define API contracts and
    integrations.

  Required Qualifications

  - 5+ years of professional software development experience.
  - 3+ years of hands-on experience developing applications with
    React.
  - Strong proficiency in TypeScript, JavaScript (ES6+), HTML5,
    and CSS3.
  - Experience with modern React concepts, including Hooks,
    Context API, and state management solutions (Redux,
    Zustand, React Query, etc.).
  - Strong experience writing automated tests using Cypress.
  - Experience consuming RESTful APIs and working with modern
    web services.
  - Knowledge of responsive design and cross-browser
    compatibility.
  - Familiarity with CI/CD pipelines and modern development
    workflows.
  - Experience using Git and collaborative development
    practices.
  - Strong problem-solving and communication skills.

  Preferred Qualifications

  - Experience developing backend services using Java and Spring
    Boot.
  - Experience with microservices architectures.
  - Familiarity with cloud platforms such as Azure, AWS, or
    Google Cloud.
  - Experience with containerization technologies such as Docker
    and Kubernetes.
  - Understanding of security best practices for web
    applications.
  - Experience working in Agile/Scrum environments.

  Technical Skills Required

  - React
  - TypeScript
  - JavaScript
  - Cypress
  - HTML5/CSS3
  - REST APIs
  - Git

  Nice to Have

  - Java
  - Spring Boot
  - Azure/AWS
  - Docker
  - Kubernetes
  - React Query
  - Redux

  What Success Looks Like

  - Delivering high-quality, maintainable front-end features.
  - Ensuring comprehensive automated test coverage.
  - Contributing to architectural decisions and technical
    excellence.
  - Mentoring team members and driving best practices across the
    engineering organization.
  - Collaborating effectively with backend teams to deliver end-
    to-end solutions.

  Seniority Level: Senior Employment Type: Full-Time Location:
  Onsite

   Compensation, Benefits and Duration

  Minimum Compensation: USD 33,000 Maximum Compensation: USD
  118,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
