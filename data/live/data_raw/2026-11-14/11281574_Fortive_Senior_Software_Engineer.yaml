description: |
  The Senior Software Engineer is a hands-on technical leader
  responsible for sustaining, improving, testing, deploying,
  and supporting secure, reliable software across the Censis
  application stack. This role owns complex technical
  outcomes, influences solution design, raises engineering
  standards, and mentors other developers. The engineer
  partners closely with Product, Quality Assurance,
  Architecture, DevOps, Security, and globally distributed
  engineering teams to deliver reliable customer value.

  Specific Responsibilities

  Software Design and Delivery:

  - Own complex maintenance, defect resolution, customer-driven
    enhancements, and technical work from investigation and
    design through production support, with clear acceptance
    criteria and measurable outcomes.
  - Design, develop, and maintain full-stack applications using
    C#/.NET, Vue.js, JavaScript/TypeScript, HTML, CSS, REST
    APIs, and SQL Server.
  - Make sound design decisions that improve maintainability,
    extensibility, performance, testability, and reliability
    without unnecessary complexity.
  - Create and maintain technical documentation, including
    solution approaches, API contracts, data flows,
    operational guidance, and key design decisions.
  - Triage and resolve complex production issues, identify
    dependencies and risks early, and deliver fixes and small
    enhancements incrementally within Agile teams.

   Quality, Security, and Reliability:

  - Build quality into the development lifecycle through
    automated unit and integration tests, peer reviews, static
    analysis, and appropriate end-to-end test support.
  - Apply secure- and privacy-by-design practices, including
    threat-aware design, secure coding, dependency management,
    secrets protection, and remediation of identified
    vulnerabilities.
  - Use only approved development and AI tools and follow
    applicable Secure Development Lifecycle, data handling,
    privacy, and compliance requirements.
  - Improve application observability and supportability through
    meaningful logging, monitoring, diagnostics, and root-
    cause analysis.
  - Identify recurring defects and support friction, perform
    root-cause analysis, and implement preventive
    improvements, reusable patterns, and standard work that
    reduce repeat incidents and backlog age.

  Technical Leadership and Collaboration:

  - Lead technical discussions and code reviews, provide
    constructive feedback, and help teams converge on
    practical, supportable solutions.
  - Mentor engineers through pairing, design guidance, review
    feedback, and knowledge sharing while promoting ownership
    and independent problem solving.
  - Partner with Product Owners, Support, and QA Engineers to
    clarify customer impact, refine requirements, define
    testable outcomes, and surface technical tradeoffs before
    implementation.
  - Coordinate effectively across Product, Support, QA, DevOps,
    and Engineering teams, communicate status and risks
    clearly, and contribute to consistent engineering
    practices across products.
  - Contribute to architecture, platform, and engineering
    standards while escalating decisions that require broader
    alignment.

  AI-Enabled Engineering and Continuous Improvement:

  - Use approved generative AI tools to accelerate analysis,
    coding, testing, documentation, code review, and
    troubleshooting while maintaining human accountability for
    quality, security, and correctness.
  - Evaluate AI-generated output for accuracy, licensing, data
    exposure, security, maintainability, and alignment with
    coding standards before use.
  - Create reusable prompts, patterns, guidance, or automations
    that improve team productivity and can be adopted safely
    by others.
  - Continuously learn emerging technologies and recommend
    adoption based on business value, risk, total cost, and
    long-term supportability.

  Required Qualifications

  - Bachelor's degree in Computer Science, Software Engineering,
    or a related discipline, or equivalent practical
    experience.
  - 8 or more years of professional software development
    experience, including ownership and support of complex
    production applications.
  - Strong hands-on experience with C#/.NET and modern web
    development using Vue.js and JavaScript/TypeScript.
  - Strong experience designing and integrating RESTful APIs and
    working with relational databases, preferably SQL Server.
  - Demonstrated ability to write automated tests and use modern
    engineering practices for code review, version control,
    build, and deployment workflows.
  - Experience applying software design principles, debugging
    complex issues, improving performance, and conducting
    root-cause analysis.
  - Experience working in Agile maintenance or product
    development teams and collaborating with Support, Product,
    QA, DevOps, Architecture, and Security partners.
  - Clear written and verbal communication skills, including the
    ability to explain technical tradeoffs to technical and
    non-technical stakeholders.
  - Proven mentoring, technical leadership, and ownership
    without requiring direct people-management responsibility.
  - Experience with GitHub, Jira, production support workflows,
    automated code-quality or security scanning, and modern
    observability platforms.
  - Experience using approved generative AI development tools
    such as GitHub Copilot in production-oriented workflows.
  - Working knowledge of enterprise SaaS products.
  - Experience supporting enterprise applications and
    collaborating with distributed development, product, and
    customer-facing teams.

  Education

  Bachelor’s degree in a related discipline or equivalent
  experience.

