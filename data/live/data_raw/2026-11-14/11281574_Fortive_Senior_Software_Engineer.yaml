  About the Team

   About Censis



   Censis, the first company to engineer a surgical asset
  management system that tracks down to the instrument and
  patient levels, has continually set the standards for the
  sterile processing industry.



   From the beginning, Censis has recognized the vital
  connection between perioperative innovation and efficiency,
  unparalleled customer care and improved operational
  performance. By continuing to invest in technology, ease of
  integration, education and support, Censis provides
  solutions that empower hospitals and healthcare providers to
  stay compliant and ahead of healthcare’s rapidly changing
  environment. With Censis, you’re positioned to start ahead
  and stay ahead, no matter what the future holds.



