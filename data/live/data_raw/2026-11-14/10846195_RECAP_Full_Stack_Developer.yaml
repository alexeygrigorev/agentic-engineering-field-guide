description: |
  Company Overview Join our innovative team at RECAP, a
  startup revolutionizing the real estate investment
  landscape. We are looking for a talented Full Stack
  Developer to be one of the first members of our team, with
  significant influence over our technology direction.

  Job Description As a Full Stack Developer at RECAP, you will
  be responsible for developing and maintaining the full stack
  of our software applications. Your role will involve working
  on both the front-end and back-end components, ensuring
  seamless integration and a user-friendly experience.

  Responsibilities

  - Develop and maintain software applications across the full
    stack.
  - Collaborate with cross-functional teams to define and
    implement new features.
  - Write clean, maintainable, and efficient code.
  - Troubleshoot and debug applications.
  - Participate in code reviews and contribute to best
    practices.
  - Stay up-to-date with emerging trends and technologies in
    software development.

  Requirements

  - Proven experience as a Full Stack Developer or similar role.
  - Proficiency in front-end frameworks, particularly Vue.js.
  - Experience with back-end development using PHP and Laravel.
  - Strong knowledge of databases, particularly MySQL.
  - Understanding of the software development lifecycle and best
    practices.
  - Strong problem-solving skills and attention to detail.
  - Excellent communication and teamwork abilities.

  Qualifications

  - 1-5 years of experience in full stack development.
  - Experience with front-end build tools and task runners.
  - Knowledge of modern front-end development workflows and
    tools.
  - Experience with cloud services (e.g., AWS, Azure).
  - Knowledge of CI/CD pipelines.

  Why Join Us

  - Be part of a small, fast-paced team working closely with the
    founders.
  - Significant influence over technology direction and company
    growth.
  - Opportunities for professional growth and development.
  - Competitive salary and potential for equity participation.

  How to Apply If you are passionate about software
  development and eager to take on new challenges, we invite
  you to join us in revolutionizing the real estate investment
  industry. Please submit your resume and a cover letter
  outlining your qualifications and why you are a good fit for
  the role at RECAP.
