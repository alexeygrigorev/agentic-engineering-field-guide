description: |
  Abtrace is transforming primary care by enabling proactive,
  preventative healthcare at scale. We support 500+ practices
  and 4.5M patients across the UK, helping teams identify risk
  earlier, act sooner, and deliver care efficiently - without
  extra burden.

  Our Engineering team builds robust, scalable, and high-
  impact software that drives real outcomes. As we scale,
  we're evolving our culture to move fast, raise the bar, and
  deliver at startup speed.

  What You’ll Do

  As an Engineering Manager, you will...:

  - Lead&Scale: Grow, mentor and manage high-performing
    engineering teams, with a focus on speed, rigor, and
    accountability.
  - Mentor&Grow: Coach engineers to improve technically and
    professionally, creating a clear growth path.
  - Set the Bar: Implement engineering best practices and raise
    the quality bar across code, architecture, and delivery.
  - Transform Culture: Help transition the team from early-stage
    startup to an elite engineering organization with
    structure, pace, and intensity.
  - Own Delivery: Ensure projects are delivered rapidly, always
    putting customer needs at the heart of what we do
  - Drive Performance: Cultivate a high-output, high-trust
    culture where engineers take full ownership and move
    quickly without sacrificing quality.
  - Hire A+ Talent: Recruit, onboard, and retain top engineers
    who are drawn to a fast, demanding, high growth
    environment.
  - Collaborate Cross-Functionally: Work closely with Product,
    Design, and Ops to prioritize and execute.

  You Might Be a Fit If You…

  - Have 3+ years of engineering leadership experience in high-
    growth startups or scale-ups.
  - Have seen scale before and be hungry to build it again
  - Cultivate and support engineering in high-velocity
    environments with clear KPIs and performance expectations.
  - Know how to balance speed with engineering rigor—shipping
    fast, but (rarely) breaking things.
  - Are hands-on enough to jump into code or architecture
    discussions but know how to delegate and empower.
  - Have a strong product mindset—you care about outcomes, not
    just output.
  - Are relentless about raising the bar on execution, hiring,
    and accountability.
  - Have some hands-on experience with Python, React, public
    cloud environments (AWS preferred), distributed systems
    (such as Kubernetes), and infrastructure as code.

  Benefits

  - Private Pension
  - Share Options scheme
  - Generous sick and maternity/paternity leave
  - As much freedom and independence as you earn, and a chance
    to grow rapidly as the company does.
  - Flexi and hybrid working
  - Company's office in Paddington - easy commute and
    comfortable surroundings
  - Motivated, highly functioning, multi-disciplinary team
