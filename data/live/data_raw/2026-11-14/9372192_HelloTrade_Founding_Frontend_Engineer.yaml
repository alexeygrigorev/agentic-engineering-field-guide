description: |
  You’ll lead the design and development of the front end of
  our mobile-first product, helping abstract away the
  complexity of trading while maintaining clarity,
  performance, and polish. You'll work closely with designers,
  customers, product, and backend engineering to translate
  real-time data into fluid user experiences. This role is
  ideal for a highly motivated and creative individual who
  believes that intuitive UI/UX are critical to democratized
  financial access.

  Qualifications

  - Ambitious and excited to learn, thrive in fast-paced
    environments, and independently own core components
  - 3+ years experience building and owning consumer mobile/web
    products with a strong design eye
  - Mastery of UI/UX principles, with a focus on clarity, speed,
    and simplicity
  - Proficiency in React-Native, TypeScript, CSS, HTML, React,
    other mobile application frameworks
  - Experience working with high-throughput APIs, WebSockets,
    and data-heavy UIs
  - Bonus: Background in crypto, web3, or financial
    applications, owning and shipping products from 0 to
    production

  Compensation & BenefitsWe offer competitive compensation and
  meaningful early-stage equity. As an early team member,
  you’ll have ownership and upside in shaping one of the most
  ambitious financial platforms in finance.

  What we offer:

  - Competitive salary + meaningful equity stake
  - Hybrid work environment (in-person preferred in NYC)
  - Health, dental, and vision benefits
  - Unlimited PTO and flexible work hours
  - Cutting-edge problems at the intersection of crypto, global
    markets, and mobile UX
  - A fast-paced, mission-driven team of top builders from
    BlackRock, leading crypto firms, and high-growth startups

  Hello Trade is an equal-opportunity employer. We are
  committed to creating a diverse and inclusive workplace. We
  do not discriminate based on race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, age, veteran status, genetic information, or any
  other legally protected status. We encourage all qualified
  individuals to apply and strive to create an environment
  where all employees feel valued, respected, and supported.
  If you require reasonable accommodation during the
  application process, don't hesitate to contact us at
  wyatt@perpetuity.finance.
