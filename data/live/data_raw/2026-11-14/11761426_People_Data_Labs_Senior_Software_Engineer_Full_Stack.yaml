description: |
  Note for all engineering roles: With the rise of fake
  applicants and AI-enabled candidate fraud, we have built in
  additional measures throughout the process to identify such
  candidates and remove them.

  About Us

  People Data Labs (PDL) is the provider of people and company
  data. We do the heavy lifting of data collection and
  standardization so our customers can focus on building and
  scaling innovative, compliant data solutions. Our sole focus
  is on building the best data available by integrating
  thousands of compliantly sourced datasets into a single,
  developer-friendly source of truth. Leading companies across
  the world use PDL’s workforce data to enrich recruiting
  platforms, power AI models, create custom audiences, and
  more.

  We are looking for individuals who can balance extreme
  ownership with a “one-team, one-dream” mindset. Our
  customers are trying to solve complex problems, and we only
  help them achieve their goals as a team. Our Delivery and
  API Team ensures our customers have access to standardized
  and high-quality data to build upon.

  You will be crucial in accelerating our efforts to build
  standalone data products that enable data teams and
  independent developers to create innovative solutions at
  massive scale. In this role, you will be working with a team
  to continuously improve our existing APIs and delivery
  methods, as well as creating new ones.

  If you are looking to be part of a team discovering the next
  frontier of data-as-a-service (DaaS) with a high level of
  autonomy and opportunity for direct contributions, this
  might be the role for you. We like our engineers to be
  thoughtful, quirky, and willing to fearlessly try new
  things. Failure is embraced at PDL as long as we continue to
  learn and grow from it.

  Roles and Responsibilities

  - Drive our self-serve product offerings to bring prospective
    customers into our products and grow new revenue
  - Drive the core tools that our customer success team uses to
    support our customers
  - Understand and translate our business requirements into the
    systems that support our core business activities
  - Proactively work with stakeholders to clarify ambiguities in
    business operations and system design
  - Design and update our systems using good design patterns on
    both frontend and backend, which allow for extensibility
    and evolution as our business evolves
  - Ensure the integrity (correctness and accuracy) of data
    captured around key business activities so that we have a
    reliable source of truth on our operations
  - Build and maintain our frontend components, design, and
    architecture
  - Ensure the quality and reliability of frontend surfaces
    presented to users and the accuracy and effectiveness of
    the application stack supporting those surfaces

  Technical Requirements

  - 5-7+ years of industry experience with clear examples of
    strategic technical problem-solving and implementation
  - Strong software development fundamentals
  - Experience working in systems where you've had to engage
    with existing implementation patterns and evolve them over
    time

  Backend Expertise

  - 4+ years of experience with Python in a production
    environment (we are primarily a Python shop)
  - Strong REST API design skills, including resource modeling,
    versioning, pagination, error handling, and authentication
    / authorization
  - Production experience with backend frameworks such as
    FastAPI, Django, Flask, or similar
  - Deep SQL experience with PostgreSQL, MySQL, or similar,
    including schema design, migrations, and query performance
    tuning
  - Experience designing for performance and scale: caching
    strategies, background jobs and task queues, and handling
    high-volume or long-running workloads
  - Experience writing well-tested backend code (e.g., pytest),
    with unit, integration, and API-level tests
  - Familiarity with cloud infrastructure (AWS, GCP, or
    similar), containerization (Docker), and CI/CD pipelines
  - Experience instrumenting and operating services in
    production, including logging, metrics, alerting, and
    debugging live issues
  - Experience with search or analytics data stores such as
    Elasticsearch/OpenSearch, or large-scale data processing
    (nice to have)

  Frontend Expertise

  - 2+ years of experience with React.js and TypeScript
  - Experience with Next.js (or other React.js frontend
    frameworks)
  - Comfortable implementing designs with CSS fundamentals and
    Tailwind CSS
  - Ability to collaborate with UI/UX designers and contribute a
    customer-centric perspective
  - Experience with Vercel, Figma, or working within an existing
    UI component library (nice to have)

  Professional Requirements

  - Must thrive in a fast-paced environment and be able to work
    independently
  - It’s no sweat to scope, breakdown, and estimate projects
    effectively with a solid track record of delivery
  - You communicate progress and blockers effectively with your
    manager, team, and stakeholders
  - Strong written communication skills on Slack/Chat and in
    documents
  - You collaborate well across engineering, design, and product
    management
  - Experienced in writing technical design docs and translating
    technical design documents into projects, milestones, and
    backlogs
  - Experience mentoring and developing engineers
  - Ensure and develop solid code quality and development
    practices and standards within the team

  Comp: $160K - $180K

  Our Benefits

  - Stock
  - 401k
  - Competitive Salaries
  - Unlimited paid time off
  - Medical, dental, & vision insurance
  - Health, fitness, and office stipends
  - The permanent ability to work wherever and however you want

  Why People Data Labs?

  Great People make great teams. It is as simple and elegant
  as that. We believe in building highly functional,
  energetic, and engaging teams to serve our customers.
  People, Customers, Shareholders, in that order, sets us up
  for success and delivering on our promises.

  If all of that sounds good to you, we can’t wait to hear
  from you and build something amazing together!

  Check out our latest company kickoff video to get a taste of
  our company culture:

