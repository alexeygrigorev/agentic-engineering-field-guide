description: |
  Why Clarium?

  The healthcare industry overspends on its supply chain by
  over $25B each year, the result of fragmented data,
  inefficient workflows, and wasted supplies. Clarium is
  fixing that. Our AI-powered platform, Astra OS, gives
  hospitals end-to-end visibility into their supply chain
  operations, automating workflows and surfacing actionable
  insights so supply chain teams can focus on what matters
  most: patient care. We're trusted by some of the world's
  leading health systems, including Yale New Haven Health,
  Stanford, Geisinger, and Kaiser Permanente.

  Founded in 2020, Clarium has raised $43M in total funding.
  Our Series A was led by Northzone, with participation from
  General Catalyst, AlleyCorp, Kaiser Permanente Ventures,
  Texas Medical Center Ventures, and 1984 Ventures.

  The Opportunity

  Clarium is scaling Astra OS across more of the country's
  leading health systems, and the features our users touch
  every day are at the center of that growth. We're looking
  for a Senior Fullstack Engineer who's passionate about using
  their skills to unlock efficiency for hospitals and their
  suppliers — someone who wants to own end-to-end features
  that hospital supply chain teams rely on daily.

  In this role, you'll design, build, and maintain features
  across our full stack, working with a fast-paced, cross-
  functional team to ship end-user-facing functionality
  quickly and iterate based on real customer feedback. You'll
  move fluidly between our frontend (React/TypeScript) and
  backend (Python/FastAPI) codebases, owning features from
  concept to production.

  This role is ideal for someone who loves end-to-end
  ownership and staying close to the customer problems their
  work solves, at a stage where what you build genuinely
  shapes the product.

  In This Role You Will

  - Design, build, and maintain backend APIs and frontend
    components for end-user-facing features
  - Own features from concept to production, iterating quickly
    based on customer feedback
  - Write high-quality, well-tested, maintainable code across
    the full stack
  - Collaborate with product managers and customers to align
    development with real-world needs
  - Contribute to technical discussions, code reviews, and
    architecture decisions

  What You'll Bring

  - 5+ years of relevant industry experience
  - Strong experience with Python
  - Strong experience designing and consuming RESTful APIs
  - Strong experience with React and TypeScript
  - Experience with SQL
  - Self-motivated, with excellent problem-solving and
    communication skills

  Nice to Have

  - Experience with FastAPI
  - Experience working in healthtech
  - Experience working at a startup

  Skills & Tools You'll UseNeed to Know - Python · React ·
  TypeScript · RESTful APIs · SQLNice to Know - FastAPI · AWS

  What You Get at Clarium

  Target Base Salary Range: $140K - $190K

  The base salary Clarium offers may vary depending upon the
  ultimate scope and responsibilities of the position and on
  the candidate's job-related knowledge, skills, and
  experience. The total package will include equity, in
  addition to a full range of medical and/or other benefits,
  depending on the position offered. Pay and benefits are
  subject to change at any time, consistent with the terms of
  any applicable compensation or benefit plans.

  - Incentive Stock Options proportionate to your salary
  - Fully remote, with a NYC co-working space available;
    distributed team across multiple time zones with
    opportunities for in-person time
  - Unlimited PTO
  - Top-tier health, vision, and dental benefits
  - 401K
  - The opportunity to build on a strong foundational team with
    deep data and engineering roots at a stage where your work
    genuinely shapes the product
  - A fast-paced, high-growth environment where we move quickly
    to solve critical healthcare challenges
  - The chance to empower frontline healthcare workers by
    automating the administrative friction in their day-to-day
  - Collaborative work alongside a high-caliber team of
    clinicians, engineers, and revenue leaders
  - A commitment to diversity, actively seeking out voices and
    backgrounds underrepresented in healthtech
  - A culture built on camaraderie, direct feedback, and
    celebrating our collective wins

  Equal Opportunity Statement

  Clarium is committed to promoting an inclusive work
  environment free of discrimination and harassment. We value
  a diverse and balanced team where everyone can belong.
