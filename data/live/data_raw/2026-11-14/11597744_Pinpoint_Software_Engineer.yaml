description: |
  About Us

  At Pinpoint, we're building the world's first agentic social
  media team: a workforce of AI agents that run organic, paid,
  and influencer social in a brand's own voice, 24/7. Our
  agents reply to comments and DMs, moderate negativity in
  real time, screen and recruit affiliates, convert buying-
  intent conversations into sales, track trends and
  competitors, and turn every interaction into intelligence a
  team can actually query and act on. We believe the future of
  social isn't more tools for humans to operate, it's agents
  that do the work itself.

  Backed by $4M in funding from True Global, Phoenix Capital
  Ventures, Flybridge, Antler, and social media stars
  KSI/Sidemen, we work with brands like Overtime, GoPuff,
  Polymarket, Represent, Cozy Earth, Masa Chips, Momofuku,
  Every Man Jack, and hundreds of others.



  About The Role

  We've hit clear product-market fit—seven figures in ARR—with
  a lean team of just three engineers. We're now growing our
  engineering team to expand our feature set, improve our
  existing agents and tools, and better serve our customers.
  We use a modern, standard stack: TypeScript everything,
  Next.js on the frontetnd, Nest on the backend, Postgres with
  Prisma, AWS, Github CI, and Claude Code. As startups go, we
  like to think our codebase is well-structured and empowers
  us to ship great product quickly and safely. We rotate
  through tasks to keep ourselves fresh and engaged, so you'll
  work across the whole stack rather than getting boxed into
  one corner.

  What You'll Be Doing

  - Design and scale the systems that ingest and process social
    data in real-time from Meta, TikTok, X, and other
    platforms
  - Leverage bleeding-edge AI to make decisions for our
    customers and manage data at scale
  - Work closely with the founding team to turn fast-moving
    product ideas into shipped, reliable features
  - Build the product surfaces our customers use to configure,
    monitor, and trust their agents, from agent configuration
    and management to plain-English reporting



  What We're Looking For

  - Full-stack fluency
  - Past experience at a Series A or Series B startup
  - The ability to weigh engineering, product, and business
    decisions
  - A beginner's mind



  Bonus Points

  - Experience building with social APIs
  - Experience building AI-powered or LLM-integrated product
    features
  - Experience with real-time data pipelines or high-volume data
    processing
  - Previous experience at an early-stage or rapidly-scaling
    startup



  What We Offer

  - $150k - $200k, plus early equity.
