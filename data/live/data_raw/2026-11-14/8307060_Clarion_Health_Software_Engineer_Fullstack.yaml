description: |
  About Clarion

  At Clarion, we’re rebuilding how healthcare communicates in
  the age of AI.

  Today, clinics miss 30–40% of patient calls, while staff are
  overwhelmed by administrative work. We believe AI agents
  should handle workflows like scheduling, billing,
  prescription refills, and follow-ups so healthcare teams can
  focus on patient care.

  We’re building the communication infrastructure modern
  healthcare needs. Our AI agents don’t just answer calls—they
  complete workflows end-to-end, ensuring patients never go
  unheard. To date, we’ve handled hundreds of thousands of
  patient interactions across virtual care companies, health
  systems, and a $5B health insurance company.

  Clarion was founded by a Stanford/Harvard-trained physician
  (founding team at Two Chairs and Ophelia) and an ex-Amazon
  Alexa engineer who led AI/ML teams at Salesforce. We’ve
  raised $10M from Accel, Y Combinator, Sequoia (Scout), and
  leading healthcare founders. We’re an in-person team in New
  York, moving fast to solve one of healthcare’s most critical
  problems.

  Why This Role Is Special

  - High-impact ownership: You’ll own meaningful features and
    systems used daily in real healthcare environments.
  - Strong signal, early traction: Dozens of paying customers
    and growing revenue, with room to shape core product
    decisions.
  - Learn from experienced builders: Work closely with founders
    and senior engineers operating at the intersection of
    healthcare, AI, and real-time systems.

  What You’ll Work On

  - Build and operate production full-stack features powering
    AI-driven healthcare communication.
  - Integrate with EHRs, legacy healthcare systems, and real-
    time voice infrastructure.
  - Collaborate closely with product, design, and senior
    engineers to turn customer needs into shipped software.
  - Debug and improve reliability, performance, and scalability
    across live systems.
  - Contribute to technical discussions, code reviews, and
    evolving engineering best practices.

  Interesting Technical Challenges

  - AI-powered workflows: Support and extend LLM-driven systems
    used in real-time healthcare interactions.
  - Real-time systems: Work on low-latency services that process
    live voice and patient data.
  - Healthcare integrations: Build resilient abstractions across
    fragmented, regulated systems while maintaining security
    and compliance.

  What We’re Looking For

  - 3–5 years of experience building and shipping production
    software.
  - Strong full-stack experience with Node.js, TypeScript,
    React, and PostgreSQL.
  - Comfort working in ambiguous environments and learning
    quickly.
  - A strong sense of ownership—you care about quality,
    reliability, and real-world impact.
  - Clear communication and a collaborative mindset.

  You’ll be a great fit if you enjoy shipping real software,
  learning from experienced teammates, and growing your
  technical judgment while working on meaningful problems.

  Interview Process

  We move quickly and communicate clearly at every stage:

  - Intro Chat (20–30 min, Virtual): Background, role context,
    and mutual fit.
  - Technical Interview (1 hr, Virtual): Practical system design
    and coding discussion with an engineer.
  - Onsite Team Day (Half Day, NYC): Collaborate on real
    problems, meet the team, and assess mutual fit.

  Decisions are typically made within 24 hours of each stage.
