description: |
  Please note that this position is based in Berlin, Germany —
  relocation support is provided if required.

  THE BEST WORK OF YOUR CAREER

  Trade Republic is the largest savings platform in Europe —
  we operate in 18 countries, serving +10 million customers
  who trust us with over €150B in assets. But we’re striving
  for more.

  We have a bold mission to empower everyone to build wealth
  with easy, safe, and free access to financial systems. You
  will have the opportunity to grow your career by
  collaborating with a team of outstanding talents and state
  of the art technology to build a lasting, positive future
  for millions.

  WHAT YOU’LL BE DOING

  - Build and test services and products using modern tools from
    the JVM ecosystem such as Kotlin, Spring and Vert.x,
    Hibernate or jOOQ.
  - Design cloud services focusing on high availability, low
    latency and scalability (on top of AWS).
  - Implement automated software delivery using GitHub Actions,
    container-based CI/CD pipelines, and Kubernetes
    orchestration.

  WHAT WE'RE LOOKING FOR

  - 5 years of experience in software engineering (preferably in
    JVM ecosystem).
  - Experience with developed and shipped scalable features
    within a service oriented architecture.
  - A strong commitment to delivering reliable and maintainable
    software using an iterative development approach and
    continuous delivery.
  - Experience with building platform services that act as a
    foundation and accelerator for product development (prior
    experience in platform/foundations-focused teams is a
    plus).

  WHY YOU SHOULD APPLY NOW

  Our culture rewards ownership, excellence, and high energy.
  We care deeply about outcomes and hold each other
  accountable — we’re here to win and fix one of the largest
  challenges Europeans face — closing the pension gap and
  democratising wealth. If this gets you fired up, reach out!

  We believe it’s our team’s varied identities and backgrounds
  that make us sharper and stronger. We’re committed to
  creating an environment where everyone feels respected and
  has equal opportunity to thrive in their careers. For any
  questions on DEI during the interview process, reach out to
  your recruitment partner.
