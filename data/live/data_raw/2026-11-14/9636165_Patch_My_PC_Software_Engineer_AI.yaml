description: |
  About Our Company:



  At Patch My PC, we exist to improve lives. What started as a
  free tool to keep apps updated has grown into a trusted
  enterprise solution that helps IT and Security teams
  automate, manage, deploy, and report on third-party updates
  in Microsoft ConfigMgr, Intune, and WSUS. Our fully remote
  crew of 150 GIF-loving humans supports over 10,000 customers
  and more than 32 million devices. We make patching easier,
  boost security, and give IT teams their time back.



  Our core values guide how we work, how we treat each other,
  and how we grow. They keep us focused on what matters most.
  We're here to improve the lives of our customers, our team
  members, and our communities.

  About this Role:



  Are you seeking a dynamic environment where you get to dive
  deep into a range of projects bootstrapping AI development?

  We’re seeking a passionate and curious Software Engineer,
  AI to join our growing emerging technology team. This role
  is ideal for someone with foundational experience in AI and
  a keen interest in agentic frameworks, autonomous systems,
  and intelligent workflows. You’ll be embedded with
  development to ideate, architect and develop AI automation
  for both internal productivity and customer product
  solutions.    Passion and drive for creating proof of
  concepts and evolving to production quality is essential.
  You should also be comfortable dealing with ambiguity, and
  enjoy educating and equipping fellow developers on AI
  solutions.

  Responsibilities:

  Required Skills:

  Nice to Have:

  - Knowledge of agent memory, planning, and tool-use strategies
  - Familiarity with containerization (Docker) and CI/CD
    pipelines
  - Contributions to open-source AI projects or personal agent-
    based experiments

