description: |
  Company Description

  Are you ready to join the forefront of technology innovation
  with Netcompany?

  As one of the fastest growing technology companies, we are
  disrupting the marketplace and revolutionizing the way
  businesses operate. Our vision is to be the leading digital
  challenger in Europe whilst evolving the next generation of
  IT consulting.

  Operating across both public and private sectors, we offer a
  comprehensive range of services from application development
  and seamless cloud migration to program delivery and service
  operations, our offerings are designed to meet diverse
  business needs

  Job Description

  This is an exciting opportunity within technology
  consultancy, which offers you fast-track career development
  opportunities, as well as the opportunity to explore new and
  cutting-edge technologies. This role supports the full life
  cycle of software development, and includes the opportunity
  for hands-on coding. Can you see yourself playing a crucial
  role in supporting and driving your team to succeed? Are you
  looking to be involved in all parts of the process - from
  design and development, to ensuring that we deliver a high-
  quality end product to our clients?

  There will always be a lead manager associated with the
  project with the overall delivery responsibility, who you
  can lean on and learn from to hone your skills around
  management and IT deliveries.

  Key Activities:

  - System development - both front-end, back-end and
    integrations
  - Workflow planning
  - Process optimization and quality assurance
  - Implementing customer requirements for the design of new
    features
  - Analysis and design of the overall solution
  - Daily sparring with your team
  - Full life cycle of delivery

  Qualifications

  - +2 years experience in the IT Industry
  - Degree in Software Engineering, Computer Science,
    Information Technology or similar
  - A curiosity to explore new technologies
  - Experience across the full software development lifecycle
  - Ability to code within projects and working with Python or
    .NET
  - Experience in Databases, including MongoDB, SQL or Document
    Database
  - Experience in Native Testing or Automated test frameworks
  - Experience in AWS or Azure, as well as Terraform
  - Previous involvement in developing and delivering major IT
    solutions
  - An understanding of agile tools and techniques
  - Excellent communication skills and professional attitude
  - Highly ambitious, wanting to excel in your career
  - Candidates MUST be willing to travel to client site anywhere
    in the UK when needed, and MUST have the right to work in
    the UK
  - Hybrid working model

  Additional Information

  Benefits:

  - Hybrid working model with some flexible working
  - 25 days’ holiday
  - Private Medical Health care via Vitality
  - Pension contribution, Life Assurance
  - Professional certifications supported as part of learning
    and development.
  - A range of retail discounts to enhance your lifestyle,
    encompassing restaurants, supermarkets, travel, leisure
    activities and health and well-being services.
  - Access to our Employee Resource Groups, our groups represent
    diverse backgrounds and provide a platform for colleagues
    to connect, learn, and support one another.

  Join Netcompany, where we proudly hold the 5th position on
  the esteemed UK Top 50 Best Places to Work in the Glassdoor
  Employees’ Choice Awards for 2024.

  At Netcompany, we pride ourselves on our entrepreneurial
  spirit and our capacity for doing things differently. Our
  culture is built on fostering low bureaucracy, emphasizing
  high agility and promoting flexibility, enabling everyone to
  contribute their best.

  Our journey began in the UK with the acquisition of Hunter
  Macdonald in 2017. As one of Northern Europe's most
  accomplished IT companies, we have expanded our headcount
  globally to 7400+ employees and have offices in UK, Denmark,
  Norway, Poland, Holland and Vietnam.

  Netcompany is committed to providing an inclusive and
  barrier-free recruitment process for anyone wishing to apply
  for a job with us.  We operate a Disability Confident
  Interview Scheme which means that we offer guaranteed
  interviews to all applicants with a disability who meet the
  minimum criteria for a role. Applicants are asked to opt in,
  so please let us know if you wish your application to be
  considered under this scheme.

  If you need any reasonable adjustments or extra support
  during the recruitment process, please contact us at
  reasonableadjustments@netcompany.com.

