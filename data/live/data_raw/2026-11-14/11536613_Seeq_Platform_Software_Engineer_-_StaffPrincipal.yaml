description: |
  At Seeq, we develop advanced analytics solutions for
  industrial process data, enabling companies in
  pharmaceuticals, energy, and manufacturing to derive
  actionable insights. Our innovative products integrate
  cutting-edge technologies and data-processing capabilities,
  connecting to complex data sources and delivering impactful
  analytics.

  As a fully remote company, Seeq fosters collaboration using
  tools like Zoom, Slack, and our own Qube Virtual Office.
  With a focus on agile principles, our team of talented
  engineers is dedicated to building products that exceed
  customer expectations while nurturing a supportive,
  collaborative environment.

  What You Will Do As a Software Engineer - Platform, you will
  be instrumental in designing and building our internal
  platform:  the infrastructure and services that other
  engineering teams at Seeq use to deploy and operate our
  software products. Working as a key technical leader, you
  will collaborate closely with cross-functional teams
  including product management and fellow engineers to
  architect and implement robust and secure internal platform
  components.

  You will focus on enhancing the internal platform to provide
  common services and capabilities to application teams, so
  that they can focus on innovating for our customers rather
  than figuring out how to best deploy and operate their
  software. The infrastructure and services you build will
  enable the scalability and reliability of our products. Your
  responsibilities will include evolving interfaces between
  systems, optimizing infrastructure, migrating existing
  functionality to new services and infrastructure, enabling
  efficient software delivery, building multi-tenant clusters,
  and integrating security best practices. You will also
  mentor and guide engineering teammates, ensuring high
  technical standards and effective collaboration.

  Requirements

  - 8+ years of professional software engineering experience,
    including significant experience building platform
    services, infrastructure, or distributed systems
  - Proficient in backend technologies with strong experience in
    languages like Go or Python
  - Proficient with infrastructure as code configuration systems
    like Terraform, OpenTofu, or Pulumi
  - Deep understanding of cloud platforms such as AWS, Azure, or
    GCP; distributed systems including Kubernetes; and
    microservice architectures
  - Experience building scalable, reliable platforms that
    support data-intensive applications
  - Expertise in infrastructure development and configuration,
    software delivery, and integrating security practices in
    platform development
  - Strong background in system architecture, production system
    migration, and infrastructure cost and performance
    optimization
  - Demonstrated leadership and mentoring skills, with
    experience guiding engineering teams
  - Excellent communication and collaboration skills in a cross-
    functional and remote work environment
  - Passion for continuous improvement and adopting modern
    development methodologies like Agile and CI/CD
  - Bachelor’s degree in computer science, software engineering,
    a related field, or equivalent experience

  Leveling

  We are hiring across Staff and Principal levels for this
  role. Level will be determined based on experience,
  technical depth, and demonstrated scope and impact.
  Engineers at all levels are expected to remain hands-on; the
  scope of technical leadership and influence increases by
  level.

  Staff: Operates with team-level scope and influence, leading
  complex multi-person efforts, providing architectural
  direction, and raising the effectiveness of engineers around
  them.

  Principal: Operates with multi-team scope and influence,
  leading complex cross-team initiatives, shaping system-wide
  architecture and longer-term technical direction, and
  multiplying the effectiveness of teams.

  Benefits

  Seeq is a remote-first (and only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.

  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability and sustainability.

  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers’
  expectations. We are certified as a great place to work, and
  included in the Technology Fast 500 and Inc. Magazine’s Best
  Places to Work.

  The Perks of Working at Seeq

  - Competitive salary, equity, and cash bonus incentives
  - Benefits:

  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.

  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas
