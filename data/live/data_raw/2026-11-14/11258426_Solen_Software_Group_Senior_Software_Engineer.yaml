description: |
  Job Title: Senior Software Engineer Company: Cooperative
  Technologies Location: US Employment Type : Full-time

  About Cooperative Technologies

  Cooperative Technologies (“CT”) is the only company in the
  US that provides ceding carrier data for annuity and life
  insurance exchanges, making the platform the de facto
  standard for replacement processing. The market for US
  annuity sales is projected to double to ~$900B by 2030 with
  CT at the center of that growth.

  CT is at an inflection point and looking for future leaders
  to champion the next phase of growth for the organizations.
  The company is now searching for a senior software engineer
  who can own an AI roadmap, mentor junior resources, and
  write the code to ship its product. Working in an
  entrepreneurial fully remote environment, the hired
  candidate will have high visibility and autonomy.

  What You'll Actually Do

  - Design, build, and ship product enhancements to the
    1035YellowPages platform in VB.NET/C#/.NET, including
    database objects, ASP.NET Web Forms, and WCF web services.

  - Debug, triage, and resolve defects and performance issues
    across the full stack

  - Build and maintain the technical integration that moves data
    between CT and its clients.

  - Coordinate new client onboarding and serve as the direct
    technical contact for existing web site and web service
    clients, including support escalations.

  - Generating 30%+ of your code output using AI-assisted
    development tools and using them thoughtfully to
    accelerate delivery without sacrificing quality.

  Required Qualifications

  - 7+ years of professional software development experience,
    with significant time as the senior or sole engineer
    accountable for a production system.

  - Programming Proficiency: C#, .NET Framework / .NET, VB.NET,
    JavaScript, SQL, VB 6, Visual C++ (Nice-to-have)

  - Windows Development and Database Technologies: Windows Forms
    (WinForms), ASP.NET Web Forms, WCF Web Services, Windows
    Services. HTML, CSS, Database Technologies, Microsoft SQL
    Server, T-SQL

  - Demonstrated ability to work directly with enterprise
    clients on technical issues, integration work, and support
    escalations.

  - Track record shipping and supporting production software in
    a small-team environment where you owned the outcome end
    to end, not a slice of a larger platform team.

  - Comfort operating in an established codebase with legacy
    components, including sole responsibility for systems you
    did not write.

  Preferred Qualifications

  - Experience with Azure DevOps, REST APIs, or ASP.NET MVC.

  - Familiarity with legacy migration projects — specifically
    managing a system through end-of-life.

  - Prior use of FogBugz or similar issue-tracking tools

  What Success Looks Like — First 90 Days

  - At least one enhancement or defect fix shipped to production
    independently.

  - Working command of the 1035YellowPages codebase and data
    model sufficient to scope, estimate, and deliver without
    supervision.

  - Knowledge transfer from the retiring technical team captured
    in writing, so the critical paths through the system no
    longer live in one person's head.

  Who You'll Work With

  You report directly to CT's executive leadership team.
  Product direction comes from CT's executive leadership and
  the Director of Business Development & Operations, who
  translate market and client requirements into priorities.
  This is a senior individual contributor role with high
  autonomy and high impact.

  On any given day you might be writing code in the morning,
  resolving a client integration issue at noon, and sitting
  with the retiring technical team in the afternoon to pull
  one more system out of their heads and into yours. CT's team
  is small and this role has real influence over how the
  product gets built.

  What We Offer

  - Mentorship from a retiring technical team handing over the
    reins to a new generation.

  - Ownership of the training and development plan for a junior
    resource, including shaping how they ramp, what they
    learn, and how they progress.

  - A direct line from your code to the customer, with
    visibility into how the business makes money.

  - Exposure to the Solen Software Group portfolio company
    network and operating model.

  Recruitment Disclaimer

  Solen Software Group will never request payment, banking
  information, or other sensitive personal or financial
  details during any stage of the recruitment process. All
  official communication will come from a
  verified @solensoftwaregroup.com email address. Any outreach
  outside these standards should be disregarded and reported
  through our official channels.

  We thank all applicants for their interest in joining Solen
  Software Group. Only candidates selected for an interview
  will be contacted.
