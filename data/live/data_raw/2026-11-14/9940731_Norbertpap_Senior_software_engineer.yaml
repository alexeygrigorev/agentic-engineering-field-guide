description: |
  ## Company Overview

  Norbertpap is a dynamic and innovative company committed to
  delivering cutting-edge solutions in the tech industry. We
  pride ourselves on fostering a collaborative and inclusive
  work environment that encourages creativity and growth. ##
  Job Title

  Senior Software Engineer ## Location

  Budapest, Hungary, Europe ## Job Description

  We are seeking a highly skilled and experienced Senior
  Software Engineer to join our team in Budapest. The ideal
  candidate will have a strong background in software
  development, particularly with CodeIgniter and PHP, and a
  passion for aviation technology. This role requires a
  proactive individual who can work independently and
  collaboratively to drive projects to completion. ## Key
  Responsibilities

  * Design, develop, and maintain high-quality software
  applications using CodeIgniter and PHP. * Collaborate with
  cross-functional teams to define, design, and ship new
  features. * Ensure the performance, quality, and
  responsiveness of applications. * Identify and correct
  bottlenecks and fix bugs. * Help maintain code quality,
  organization, and automation.

  ## Required Qualifications

  * 5-13 years of professional experience in software
  development. * Proficiency in CodeIgniter and PHP. *
  Experience or interest in aviation technology. * Fluency in
  Spanish. * Strong problem-solving skills and attention to
  detail.

  ## What We Offer

  * Competitive salary. * Opportunity to work in a vibrant and
  culturally rich city. * A supportive and collaborative work
  environment. * Opportunities for professional growth and
  development.
