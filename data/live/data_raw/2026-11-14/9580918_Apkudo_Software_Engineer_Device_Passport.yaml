description: |
  About Job

  The Device Passport team at Apkudo is a dynamic, cross-
  functional group that builds and operates the systems giving
  devices a trusted, verifiable identity throughout their
  lifecycle. As a mid-level Software Engineer, you will be
  responsible for delivering Python-based platform features
  that matter to marquee partners, collaborating daily with
  engineers, product managers, and hardware specialists.

  Your success in this role will be measured by your ability
  to own and deliver meaningful slices of our platform,
  ensuring our systems remain reliable and scalable. If you're
  passionate about software engineering and have a proven
  track record of delivering high-quality results, we
  encourage you to apply.

  Skills & Qualification

  - Proficiency in Python programming language to support
    critical software systems for custom software and hardware
    platforms.
  - Experience with PostgreSQL and related tools to enhance
    productivity, preserve stability, and ensure consistent
    APIs.
  - Strong understanding of AWS Cloud or equivalent cloud
    platform experience to ensure scalability and reliability.
  - Ability to write clear technical specifications and document
    requirements effectively.
  - Excellent problem-solving skills and strong communication
    skills to collaborate within a cross-functional team.
  - Bachelor's degree in Computer Science or related field
    (relevant experience may substitute for and/or augment
    relevant degrees).
  - 7+ years of hands-on experience working with Python, 3+
    years of SQL experience, and 2+ years of AWS Cloud
    experience.

  Responsibilities

  - Work primarily in Python to support critical software
    systems for our custom software and hardware platforms,
    enhancing and debugging Python applications to improve
    reliability, performance, and maintainability.
  - Collaborate within a cross-functional, distributed team
    spanning engineering, product, and operations to deliver
    features that matter to marquee partners.
  - Utilize Python, PostgreSQL, and related tools to enhance
    productivity, preserve stability, ensure consistent APIs,
    and improve system speed.
  - Work in an Ubuntu/Linux desktop environment and leverage AWS
    Cloud or equivalent cloud platform experience to ensure
    scalability and reliability.
  - Document requirements and write clear technical
    specifications to ensure effective communication within
    the team.
  - Develop and implement solutions to complex problems,
    applying strong problem-solving skills and excellent
    communication skills.
  - Collaborate with hardware specialists to ensure seamless
    integration of software and hardware platforms.
  - Maintain and improve the overall quality of our platform,
    ensuring reliability, scalability, and performance.
