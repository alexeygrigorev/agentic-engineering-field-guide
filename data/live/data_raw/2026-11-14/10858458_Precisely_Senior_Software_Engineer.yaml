description: |
  At Precisely, we're not just building software — we're
  shaping the future of data integrity. As a global leader in
  data quality, data enrichment, and location intelligence,
  Precisely helps thousands of the world's most trusted brands
  make confident decisions with data they can rely on. We're
  an AI-first organization, which means artificial
  intelligence isn't a buzzword here — it's woven into how we
  build products, how we work, and how we think about solving
  complex problems for our customers. When you join Precisely,
  you join a team of curious, driven innovators who believe
  that better data makes the world run better. If you're ready
  to do meaningful work at the intersection of AI and data —
  and help define what's possible — we'd love for you to
  apply!

  Overview:

  We are looking for a highly experienced full-stack Senior
  Software Engineer to join our Connectivity team in the
  United States.  You will work closely with a globally
  distributed engineering team, with most of the team based in
  India. As a senior member of the team, you will
  independently drive features from design to delivery and
  ensure reliable support for our platform during US hours.
  As a Senior Software Engineer, you will be responsible for
  design, architecture, development, and unit testing of
  applications. You will collaborate with architects, UI/UX
  experts, and other software developers for developing
  solutions with the latest technologies. Also, you will unite
  with other team members to research and develop innovative
  products and solutions that will help Precisely in staying
  ahead of the competition

  What you will do:

  - Take ownership and deliver results with minimal direction.
  - Participates/owns technical designs, participates in
    discussions, constructively suggests, and receives ideas &
    feedback to improve product functionality.
  - End to end ownership of product features and is expected to
    create highly scalable, stable, maintainable, and
    available products and features.
  - Communicate effectively across teams and time zones.
  - Balance feature development with operational excellence.
  - Bring a customer-first mindset while maintaining high
    engineering standards.
  - Innovate and bring ideas and possible solutions to
    stakeholders and product team to help increase
    productivity.
  - Contribute to strategies and roadmap development to meet
    business objectives with existing or emerging
    technologies.
  - Help build a platform that can support huge volumes of data,
    with multi-tenancy and near real-time analytics.
  - Have an opportunity to participate, guide, and mentor other
    people in the team on architecture and design in a hands-
    on manner.

  What we are looking for:

  Required:

  - Bachelor's or master's degree in computer science or related
    field.
  - 8+ years of experience in developing Enterprise Software.
  - Hands-on expertise in: Java, Node.js, Go (Golang), React,
    MongoDB
  - Strong full-stack development experience.
  - Excellent communication (oral and written), and exceptional
    analytical and troubleshooting skills.
  - Experience with cloud-based platforms like AWS, Azure, GCP
    and cloud native technologies like Docker, Kubernetes and
    microservices architecture.
  - Good understanding of Design Patterns & Architectural
    Patterns and hands on experience.
  - Excellent knowledge of OOP concepts.
  - Strong understanding of distributed systems, scalability,
    and cloud-native application development.
  - Experience with SQL and/or No SQL databases.
  - Strong debugging, troubleshooting and production support
    skills.
  - Ability to work independently with minimal supervision and
    drive work to completion.
  - Excellent interpersonal skills and the ability to work with
    diverse and distributed product teams in an agile
    environment.

  AI Skills/Knowledge:

  - Strong understanding of AI-assisted software development
  - Comfortable using generative AI tools (e.g. Microsoft
    Copilot, GitHub Copilot, ChatGPT) to assist with code
    generation, test writing, and experience design.
  - Uses AI for code review, documentation, and test generation;
  - Familiarity with LLM APIs or agentic workflows;
  - Understands responsible AI principles including bias,
    security, and explainability
  - Open to continuously adopting new AI capabilities as they
    emerge in the engineering and design workflow.

  Preferred Skills (a plus but not required):

  - Good experience in Java/J2EE and data modelling and related
    technologies.
  - Experience working on Data Governance, Data Catalog, Data
    Quality products is a plus.
  - Preferred experience working on regulated cloud platforms or
    enterprise products requiring security, compliance, or
    government certifications

