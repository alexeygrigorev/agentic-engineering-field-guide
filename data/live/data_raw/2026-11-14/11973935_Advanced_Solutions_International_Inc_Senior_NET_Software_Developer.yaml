description: |
  Senior .NET Software Developer  Austin, TX (Remote)



  Why ASI  At ASI, our purpose is straightforward: we help
  people achieve great things through innovative solutions.
  Since 1991, we have built the iMIS® engagement management
  software that lets non-profits, associations, and unions
  focus on their mission rather than their technology. Our
  founder-led team of more than 300 people now serves over
  4,000 clients across 28 countries, supporting more than 51
  million users worldwide. Your work at ASI reaches further
  than you might expect.

  We are guided by our three Core Values - Courage,
  Excellence, and Respect - and by a mission we hold to
  closely: keeping our clients for life. ASI is a genuine
  melting pot, a place where deep experience and fresh
  thinking sit side by side and sharpen one another. We offer
  the stability of a company with more than thirty years
  behind it and the momentum of one that is still growing and
  still innovating.

  About the role  ASI is looking for a Senior .NET Software
  Developer: a creative and skilled engineer with a strong
  foundation in software performance and scalability. In this
  role you will build Microsoft-based software applications
  and products, with a particular focus on the performance and
  reliability of new software infrastructure. You will work
  exclusively within a .NET technology stack and partner
  closely with our software architects to deliver solutions
  that our clients can depend on.

  What you will do

  - Collaborate with software architects on product development
    and on the performance and reliability of new software
    infrastructure.
  - Conduct code review, performance testing, and analysis
    across a range of software solutions, including legacy
    systems and microservices.
  - Meet project milestones and complete architecture and
    enabler stories within sprints, as specified by the
    architectural runway.
  - Work with the quality assurance team to integrate
    performance testing into the CI/CD pipeline, ensuring
    continuous performance validation.
  - Follow established standards and guidelines to deliver work
    that is high in quality and value to ASI and its
    customers.
  - Learn, follow, adapt, and apply SAFe Agile software
    principles.
  - Receive, act on, and contribute to constructive feedback in
    support of continuous process, product, and self-
    improvement.
  - Work with Technical Support to reproduce and resolve
    customer issues as needed.
  - Perform other job-related duties and responsibilities as
    assigned.



  What you will bring

  - A bachelor’s degree in computer science, information
    science, or a related field, or equivalent experience.
  - 8+ years of experience developing integrated suites of full-
    featured web-based applications, including user
    interfaces, database access, and networked components.
  - Demonstrated knowledge of Microsoft tools and technologies:
    C#, .NET Core, .NET MVC, Entity Framework Core, SQL Server
    or Azure SQL, and Visual Studio.
  - Experience with non-Microsoft web application stacks, such
    as Java 8+, Spring and Hibernate, TypeScript, NodeJS, and
    Postgres or MySQL, may be considered in lieu of Microsoft
    technology experience. This role works exclusively with a
    .NET technology stack, with a focus on .NET Core.
  - A solid object-oriented analysis and design background,
    including automated unit and integration test writing,
    with proven experience implementing and testing high-
    quality software.
  - Experience benchmarking application page-turn and API
    endpoint performance using JMeter, WAPT, or similar tools.
  - Experience building and monitoring highly observable web
    applications using structured logging data, Azure
    Application Insights, and .NET Aspire.
  - The ability to analyze legacy code based on MS Web Forms,
    Web Apps, and Web API, the MS .NET Framework, and
    AngularJS.
  - Experience deploying and maintaining cloud-based
    applications in a DevOps environment using Azure platform
    services, including Azure Application Insights, Azure App
    Service, Azure Containers, and Azure SQL, or similar.
  - Experience implementing performance optimizations and tuning
    for legacy codebases and SQL schemas.
  - Solid interpersonal skills and strong written and verbal
    communication.
  - An excellent ability to collaborate with others, both in
    person and remotely.



  What we offer

  - Work that matters, supporting the organizations that serve
    communities, professions, and causes around the world.
  - A modern technology stack built on Microsoft Azure, .NET,
    and SQL.
  - A learning culture organized around continuous performance
    improvement, for our clients and for ourselves.
  - The stability of a founder-led company with more than thirty
    years of history, and genuine room to grow within it.
  - A collaborative team that works well together both in person
    and remotely.



  Compensation Compensation for this position is determined
  based on a variety of factors, including, but not limited
  to, an individual’s skills, experience, training,
  certifications, education, geographic location, business
  needs, and internal equity. For candidates located in
  Alexandria, VA or Austin, TX, the current estimated
  compensation range for this role is $110,000- $140,000.
  Compensation may vary for candidates in other locations
  within the United States.

  Benefits

  In addition to a competitive base salary and bonus
  opportunities for eligible positions, ASI offers a
  comprehensive benefits package, which includes:

  - Generous Paid Time Off
  - Medical, Dental, and Vision Insurance
  - Life and AD&D Insurance
  - Flexible Spending Account
  - Healthcare Savings Account
  - Wellness Benefits
  - 401k Retirement Plan with Discretionary Match

  - Opportunities for Professional Growth and Development
  - Volunteer Time Off
  - Study Leave
  - Employee Assistance Program
  - Hybrid Remote Work



  ASI for all

  ASI provides equal employment opportunities to all employees
  and applicants without regard to race, religion, color, age,
  sex, national origin, sexual orientation, gender identity,
  disability, or veteran status. Our commitment to diversity
  flows directly from our core values, and we work to
  cultivate a team that reflects the varied organizations and
  communities we serve.

  Applicants requiring accommodation in the application and/or
  interview process should notify the ASI Human Resources
  Department at hrdept@advsol.com.

  If you or someone you know may be interested in this
  position, please have them apply here.
