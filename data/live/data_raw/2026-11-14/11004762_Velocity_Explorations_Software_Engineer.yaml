description: |
  About Velocity Explorations

  Velocity Explorations is a dynamic company specializing in
  innovative technology solutions for the Department of
  Defense. Our mission is to provide cutting-edge products and
  services that enhance operational capabilities and
  efficiency. We are dedicated to delivering high-quality,
  tailored solutions to meet the unique needs of our clients
  within the defense sector.

  Job Description

  We are seeking a talented and passionate Software Engineer
  to join our dynamic team. As a Software Engineer at Velocity
  Explorations, you will play a key role in building and
  maintaining innovative software solutions using TypeScript,
  Go, and Python. You will work alongside a talented team of
  developers, designers, and product managers, contributing to
  the design and development of cutting-edge
  technologies—including AI-powered solutions—that push the
  limits of what's possible.

  What You’ll Do

  - Work on a small team of software developers to bootstrap and
    take products from idea to conception.
  - Meet with stakeholders in the DoD to understand their needs
    and wants.
  - Develop software for all parts of the stack from backend to
    frontend, and even architecture
  - Participate in code reviews
  - Travel when needed to support customers and perform
    exploration

  Why Join Us?Health:

  - Medical/Dental/Vision

  Financial:

  - Home Office Setup Budget

  Leave:

  - Unlimited paid time off, with a mandatory 10 days off on top
    of 11 federal government holidays, week of Thanksgiving,
    last two weeks of December (including New Year’s Day)
  - Paid Parental Leave

  Learning:

  - Work on challenging and consumer-facing projects that have
    the potential to impact many in the DoD space.
  - Advance your career through hands-on experience, learning
    opportunities, and mentorship on a small team within a
    start-up.
  - Collaborate with a diverse and talented group of individuals
    and stakeholders who share your passion for technology and
    innovation.
  - Conferences (Travel, lodging, and fees)

  Requirements

  Required Qualifications:

  - Bachelor's degree and a minimum of 1 year of software
    experience (Internships included).
  - In lieu of a degree, a minimum of 3 years of software
    experience.
  - Experience with Javascript, and Python.
  - U.S Citizenship
  - Florida Resident

  Preferred Qualifications:

  - Proficiency with a React framework (Remix, NextJS, etc.)
  - Prior experience with full product-lifecycle ownership
  - Proficiency with some backend language (we use Go)
  - Some experience with relational databases
  - Interest in AI/ML (Experience not needed)
  - Ability to move fast in an environment where things are
    sometimes loosely defined and may have competing
    priorities or deadlines
  - Comfortable with autonomy and ability to learn and process
    information quickly

