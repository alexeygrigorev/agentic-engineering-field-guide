  About the job

  Company Description

  Headstarter is a platform and community designed to showcase
  an engineer's greatest strengths and connect them with fast-
  paced AI startups. We aim to highlight the unique skills of
  engineers and provide opportunities for growth and career
  advancement within the innovative AI sector. Headstarter
  focuses on building bridges between talented engineers and
  cutting-edge AI startups.

  Role Description

  This full-time Full-Stack Engineer role is on-site and
  located in San Francisco, CA. The Full-Stack Engineer will
  be responsible for developing and maintaining web
  applications, designing and implementing user interface
  components, and ensuring the scalability and performance of
  the applications. Additionally, the role will include
  collaborating with cross-functional teams, conducting code
  reviews, and staying current with emerging technologies and
  industry trends.

  Qualifications

  - Development skills in JavaScript, HTML, CSS, and related
    frameworks like React, Nextjs, Shadcn
  - Experience with backend technologies such as Node.js,
    Python, or Ruby on Rails
  - Familiarity with database technologies including SQL and
    NoSQL databases
  - Proficiency in collaborating with cross-functional teams and
    conducting code reviews
  - Excellent problem-solving skills and attention to detail
  - Strong understanding of web applications' scalability and
    performance requirements
  - Bachelor's degree in Computer Science, Engineering, or a
    related field is preferred
  - Relevant experience in the AI industry is a plus
