description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  The Core Automation team envisions a future where AI-powered
  operations lead to seamless, delightful experiences for
  customers and maximum value for shareholders. Towards this
  vision, our strategy is to 1) start with re-imagining and
  automating Compliance operations with Agentic AI, 2)
  incorporate learnings from this automation experience and
  build primitives and orchestration solutions that allow us
  to scale, and 3) scale across a variety of domains enabling
  AI to enhance every part of customer experience and internal
  processes.

  It is day 1 for us. We are laser focused on automating
  compliance processes today. This is not just focused on
  driving efficiencies by automating manual processes, but
  reimagining what processes and systems must look like in a
  fully AI driven automated world, and then bring that vision
  to reality, working across cross functional teams to offer a
  delightful customer experience, improve compliance posture
  and deliver outsized shareholder value.

  What you’ll be doing (ie. job duties):

  - Explore and apply advanced GenAI techniques, including large
    language models (LLMs) and Agentic AI, to solve complex
    challenges across the organization.
  - Partner with and influence Operations and Compliance
    organizations to maximize impact.
  - Build and manage engineering teams in the Compliance domain,
    to guide the development of features, services, and
    infrastructure.
  - Plan, design, develop, and test software systems or
    applications for software enhancements and new products,
    including cloud-based or internet-related tools.
  - Design scalable systems to solve novel problems with modern
    cloud technology and industry best practices.
  - Collaborate with engineers, designers, product managers, and
    senior leadership to turn product and technical vision
    into a tangible roadmap every quarter.
  - Coach team members on design principles, coding standards,
    and AI productivity tools adoption.
  - Review and ensure the security, scalability, and
    architectural integrity of feature designs across teams.
  - Hiring, training and growing a high-performing team to blaze
    the trail in AI/ML solutions.
  - Lead multiple engineering focused efforts in parallel, while
    maintaining high service quality standards
  - Create and enforce processes to improve engineering quality,
    AI adoption and high impact delivery of each team member
  - Be a thoughtful technical voice within the team, aiding in
    diligent architectural decisions and fostering a culture
    of high-quality code and engineering processes.
    Collaborate with Product and Engineering teams to ensure
    successful delivery and operation of multi-tenanted,
    distributed systems at scale.

  What we look for in you (ie. job requirements):

  - At least 10 years of experience in software engineering.
  - At least 5 years of engineering management experience, and 2
    years of experience managing Managers.
  - You know what high quality code — and software engineering
    processes — look like and know how to foster an
    environment that creates them.
  - Execution focused with an ability to navigate ambiguity.
  - Ability to do both long term thinking and short term
    planning.
  - Experience creating, delivering, and operating multi-
    tenanted, distributed systems at scale.
  - You can be hands-on when needed – whether that’s
    writing/reviewing code or technical documents,
    participating in on-call rotations and leading incidents,
    or triaging/troubleshooting bugs.
  - You're passionate about building an open financial system
    that brings the world together.

  Nice to haves:

  - Experience getting LLM based applications to production.
    Measuring and improving LLMs’ grounding to a given corpus
    and experience reducing hallucinations is a big plus.
  - Experience in the Customer Support Compliance or Financial
    Crimes domains.

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $253,895—$298,700 USD

  - Application Limit: Candidates may submit a maximum of 3
    applications within a 6-month period.
  - Equal Opportunity Employer: Coinbase is an Equal Opportunity
    Employer. All qualified applicants will receive
    consideration for employment without regard to race,
    color, religion, sex, sexual orientation, gender identity,
    national origin, disability, protected veteran status, or
    genetic information. Applicants with criminal histories
    will be considered consistent with applicable federal,
    state, and local laws.
  - US Applicants: View Employee Rights, Know Your Rights, and
    E-Verify Notice of Participation.
  - Accommodations: If you are an individual with a disability
    who needs a reasonable accommodation, email us your
    request and contact info at
    accommodations[at]coinbase.com. Need screen reading
    technology? Click here to download a free compatible
    screen reader and view the tutorial.
  - Data Privacy & Arbitration: By submitting your application,
    you agree to our Candidate Privacy Notice. US applicants:
    By submitting your application, you agree to Arbitration
    of Disputes.
