description: |
  Powering Performance Marketplaces in Digital Media

  QuinStreet is a pioneer in powering decentralized online
  marketplaces that match searchers and “research and compare”
  consumers with brands. We run these virtual- and private-
  label marketplaces in one of the nation’s largest media
  networks.

  Our industry leading segmentation and AI-driven matching
  technologies help consumers find better solutions and brands
  faster. They allow brands to target and reach in-market
  customer prospects with pinpoint segment-by-segment
  accuracy, and to pay only for performance results.

  Our campaign-results-driven matching decision engines and
  optimization algorithms are built from over 20 years and
  billions of dollars of online media experience.

  We believe in:

  - The direct measurability of digital media.
  - Performance marketing. (We pioneered it.)
  - The advantages of technology.

  We bring all this together to deliver truly great results
  for consumers and brands in the world’s biggest channel.

  Job Category

  We are seeking an Engineering Manager to lead the technical
  side of our platform engineering, integrations, and customer
  delivery experience. This role is critical to helping
  customers successfully integrate with our SaaS platform
  while enabling cross-functional teams to execute on complex,
  technical initiatives.

  As an Engineering Manager, you will act as the primary
  technical leader across Engineering, Sales, Business
  Development, Account Management, and Operations. You will
  drive platform capability, provide real-time technical
  guidance, and elevate documentation and processes as we
  scale.

  This role is ideal for someone who enjoys being
  collaborative, deeply technical, and highly solution-
  oriented—while also influencing how the engineering
  organization operates internally.

  Responsibilities

  Technical Leadership & Delivery

  - Partner with Sales and Business Development as the technical
    lead throughout the sales cycle and delivery process
  - Join customer calls to explain API functionality, sandbox
    environments, data formats, authentication, error
    handling, and platform constraints
  - Lead technical reviews and tailored solution discussions
    aligned to customer and product requirements
  - Answer complex technical questions live to remove blockers
    and accelerate execution
  - Provide detailed post-call follow-ups including technical
    summaries, architecture diagrams, and next steps

  Platform & API Subject Matter Expertise

  - Serve as the internal and external SME on our SaaS platform,
    APIs, integrations, and supported workflows
  - Advise customers and internal teams on best-practice
    integration approaches and implementation strategies
  - Support Business Development by clearly communicating
    carrier availability, supported programs, and technical
    feasibility
  - Collaborate with Engineering to confirm technical
    requirements, edge cases, and delivery timelines

  Integration Support & Technical Triage

  - Act as an escalation point for integration-related issues,
    reducing friction across Account Management, Operations,
    and Engineering
  - Help define, support, and improve SLAs for technical tickets
    and customer integrations
  - Identify recurring integration issues and drive root-cause
    resolution with Engineering
  - Streamline technical workflows to reduce back-and-forth and
    improve time-to-resolution

  Documentation, Enablement & Scale

  - Create and maintain high-quality technical documentation,
    including FAQs, integration guides, and implementation
    resources
  - Analyze common integration questions and convert them into
    scalable documentation and knowledge-base content
  - Improve internal enablement by aligning Sales, AMs, and Ops
    on accurate technical messaging and expectations

  Cross-Functional Leadership

  - Partner closely with Engineering to align technical
    realities with customer-facing messaging
  - Provide feedback on product gaps, integration friction, and
    roadmap risks
  - Support clearer communication around product changes, launch
    timelines, and roadmap updates

  Requirements

  - 5+ years of experience as an Engineering Manager, Solutions
    Engineer, or Technical Lead in a SaaS environment
  - Strong experience with APIs, integrations, and technical
    system design
  - Proven ability to explain complex technical concepts to both
    technical and non-technical audiences
  - Experience supporting customer integrations,
    implementations, or onboarding
  - Excellent written and verbal communication skills, including
    technical documentation
  - Highly organized, proactive, and able to operate
    independently in ambiguous environments

  Nice to Have

  - Experience in API-first, fintech, insurtech, or highly
    regulated SaaS platforms
  - Familiarity with carrier integrations or complex third-party
    ecosystems
  - Experience creating presales architecture diagrams or
    technical enablement materials
  - Exposure to ticketing systems and SLA-driven support models

  The expected salary range for this position is $130,000 USD
  to $155,000 USD annually. This salary range is an estimate,
  and the actual salary may vary based on the Company's
  compensation practices. The salary may be adjusted based on
  applicant's geographic location. The position is also
  eligible to receive performance bonus or commission and
  equity in the form of restricted stock units. This position
  is eligible to participate in the Company's standard
  employee benefits programs, which currently include health
  care benefits; retirement benefits; the amount of paid days
  off (paid sick leave, parental leave, paid time off, or
  vacation benefits); and any other tax-reportable benefits.

