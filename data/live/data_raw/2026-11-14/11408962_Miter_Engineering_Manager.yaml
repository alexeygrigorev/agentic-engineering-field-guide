description: |
  A Better Built World

  At Miter, we’re on a mission to help construction
  contractors build with confidence. If we’re successful,
  we’ll make it easier and faster to build critical physical
  infrastructure - roads, bridges, utilities, data centers,
  housing, etc.

  For decades, construction and field services contractors
  have had to run their businesses on outdated software:
  clunky, on-premise systems created in the 1980s and 1990s.

  That’s where Miter comes in. We’re using AI and embedded
  payments to rebuild the core HR, finance, and operations
  systems that underpin our physical economy. Using Miter,
  contractors like Marathon Electrical, W.J. O’Neil, and
  Truebeck Construction are building stronger teams,
  controlling job costs, and accelerating jobsite execution.

  This idea is resonating. Since we launched in 2021, we’ve
  grown to thousands of customers and tens of millions in ARR,
  making us one of the fastest growing vertical software
  companies ever. To double-down on our momentum, we’ve raised
  $78M+ from top investors (Bessemer, Coatue, and Battery) who
  share our belief that we’re just getting started.

  About the Team & How We Work

  As Engineering Manager for Financials at Miter, you will
  build both a team and a product line from the ground up.
  This is a player-coach role: you will lead a small, growing
  engineering team while remaining one of the strongest
  engineers on it, taking new financial products from zero to
  one on top of Miter's construction payroll and HR platform.

  Construction contractors move large sums through disjointed
  systems that were never designed to work together. You will
  grow a small team into a full Financials pod, hiring the
  engineers and expanding the product from expenses,
  reimbursements, and per diems into enterprise-ready
  financial systems. You will influence the roadmap, working
  directly with our CEO and with our earliest Financials
  customers, discovering what needs to be built as you build
  it.

  This is a greenfield project, but with the backing of a
  company that already has thousands of customers and a proven
  wedge into the industry. You will help the team make the
  correct engineering decisions for a business-critical system
  that needs to last for many years. You will own those calls,
  working directly with our CEO and with the customers who
  live with the result, and you will have a direct impact on
  how contractors across the country manage their money,
  ultimately helping them build a better built world

  What You'll Do

  - Build and hire the Financials team: grow a small engineering
    team, and find, attract, and hire the engineers you will
    lead, then onboard, coach, and run performance for them.
  - Ship 0->1 financials products: take multiple new experiences
    from zero to one, expanding from expenses, reimbursements,
    and per diems into enterprise-ready financial systems for
    contractors.
  - Stay hands-on as a player-coach: operate as one of the
    strongest engineers on the team on the hardest problems,
    setting the technical bar through code and design rather
    than from the sidelines.
  - Own delivery and technical direction: set the roadmap,
    architecture, and quality bar for Financials, and own
    reliability for business-critical systems.
  - Partner directly with the CEO and early customers: work
    closely with our CEO and with Miter's earliest Financials
    customers to discover what we need to build as we build
    it.
  - Move fast without mortgaging the future: default to speed on
    an ambiguous, greenfield surface while making architecture
    and product decisions that hold up long term.

  What You'll Need

  - A significant hands-on engineering career at senior or staff
    level, now moving into or early in management. This is a
    first or second management role, not a junior-overall
    profile.
  - Experience taking 0->1 products or new product lines from
    scratch to shipped, not only scaling mature ones.
  - Experience in a genuinely complex, high-correctness domain
    such as fintech, payments, or payroll, where getting the
    details wrong has real consequences.
  - The ability to design and evolve correctness-critical
    transactional systems at scale, where money moves, and the
    numbers have to be exactly right. Strong enough as an
    engineer to be among the best on the team when called on.
  - A track record of attracting and hiring strong engineers,
    and of raising a small team's level through direct
    feedback and technical mentorship.
  - Decisiveness under ambiguity, and credibility both with
    executives and directly with demanding customers.
  - Nice to have: vertical SaaS, construction or field-services,
    or workforce and payroll experience; direct experience
    building financial systems; comfort with the latest AI
    developer tooling; a good eye for UX.

  Our Interview Process

  - Recruiter Screen
  - Hiring Manager Interview
  - Technical Interview
  - Virtual Onsite (Values & System Design)

  Our Benefits:

  - Competitive Compensation: We offer competitive (well above
    “market”) salary, commission, and equity packages.
  - Medical Insurance: Comprehensive medical, dental, FSA,
    vision plans to suit you and your family’s needs.
  - 401(k) Retirement Plan: Company-matched contributions to
    help you plan for your future.

  - Flexible PTO: Take the time you need to recharge and be your
    best self.
  - Parental Leave: Generous 16-week paid leave for all parents,
    including adoptive and foster parents.
  - Learning & Development: We offer every employee an annual
    educational allowance to explore external professional
    development.
  - Office Extras: Snacks, coffee, lunch, and commuter benefits
    for in-office Mitosaurs.
  - Community: Company-wide and team-specific off-sites per
    year.

  Hybrid vs. Remote Approach:

  We believe the magic of Miter comes from working side by
  side. We also believe in work flexibility. For roles that
  are listed as hybrid, our approach is 3 days a week in the
  office giving us the chance to connect, brainstorm, and
  build stronger relationships. If you live within a
  reasonable commute to either our New York City or San
  Francisco offices, we ask that you work in our hybrid
  approach.

  Otherwise, for roles listed as remote or in other cities
  where we don't have an office location, there is no
  requirement to work in our hybrid approach. We do travel a
  few times a year for onboarding, company-wide and team
  specific off-sites!

  Join our Talent Community

  Not seeing a role that matches your background right now?
  Apply to our Talent Community, and we’ll reach out if a role
  opens up that aligns with your experience!

  Equal Opportunity:

  Miter provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, genetics, sexual orientation, gender identity,
  or gender expression. We are committed to a diverse and
  inclusive workforce and welcome people from all backgrounds,
  experiences, perspectives, and abilities.

  Use of Artificial Intelligence in Our Hiring Process:

  Miter uses AI-assisted tools as part of our hiring process
  to help our recruiting team manage and review applications
  more efficiently. We want to be transparent about how this
  works.

  What the AI does: When you apply to a role at Miter, an AI
  tool may review your application against the specific
  qualifications and requirements posted for that job. This
  tool identifies whether your experience appears to meet,
  partially meet, or not meet each stated requirement, and it
  provides supporting evidence from your application for every
  assessment it makes.

  What the AI does not do: The AI does not make hiring
  decisions. It does not reject, advance, or rank candidates
  on its own, and it does not assign you a numerical score.
  Every application is reviewed by a member of our recruiting
  team, who makes the final call on whether you move forward.
  The AI is a tool that helps our team prioritize their time
  across a high volume of applications. It is not a substitute
  for human judgment.

  What information it uses: The tool evaluates the application
  materials you submit (your resume and any other application
  content) against role-specific criteria our team has
  defined. It does not pull information from external sources
  such as social media or professional networking profiles,
  and personal identifying information is removed from your
  materials before any AI review takes place.

  Human oversight: Our recruiting team periodically reviews
  how these tools are performing to check for unintended
  patterns in outcomes, and we retain the ability to override
  any AI-generated assessment at any time.
