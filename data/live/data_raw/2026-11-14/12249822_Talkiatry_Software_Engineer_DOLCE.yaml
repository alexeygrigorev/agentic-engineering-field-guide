description: |
  We're looking for a Full Stack Engineer to join our Platform
  and Internal Tools team, the team responsible for services
  connecting third-party systems and data sources to product
  surfaces, as well as internal tooling for clinical providers
  and patient care coordinators. This team plays a pivotal
  role in Talkiatry's mission by creating and maintaining the
  technical infrastructure and tooling that allows us to
  efficiently match and book patients with providers, support
  providers in delivering great care, and allow our staff to
  quickly and effectively assist patients with problems. As an
  engineer on this team, you'll work on the problems involved
  in improving and optimizing healthcare delivery. You'll co-
  own systems that synchronize patient data across multiple
  platforms and data sources, solve integration challenges,
  and build tools that clinicians depend on to manage their
  patients and their day. You'll collaborate closely with
  product, design, and data to design and build reliable,
  extensible, and maintainable systems in TypeScript across
  both backend and frontend (running on AWS). Our team lives
  by the motto penned by Piet Hein: "Problems worthy of attack
  prove their worth by hitting back"—and that’s the kind of
  problems we like to solve. The challenges are meaningful
  precisely because patient care depends on getting them
  right.

  About Talkiatry:

  Talkiatry is transforming mental health care by making high-
  quality psychiatry more accessible, human, and sustainable
  for both patients and clinicians. Co-founded by a patient
  and a triple-board-certified psychiatrist, we were built to
  solve one of healthcare’s most urgent challenges: millions
  of people struggle to access mental health care, while
  clinicians face growing administrative burden and burnout.
  Through our technology-powered, in-network platform, we’re
  changing that, creating a better experience for patients and
  empowering clinicians to focus on delivering exceptional
  care.



  Today, Talkiatry is the largest dedicated psychiatry
  practice in the U.S., with 900+ psychiatrists, 400+
  therapists, and more than 4 million patient visits delivered
  nationwide. At our scale, every innovation has real impact.
  Every workflow we improve, every technology solution we
  build, and every patient experience we redesign helps
  thousands of clinicians provide better care to hundreds of
  thousands of patients. We’re not just growing quickly —
  we’re redefining how behavioral healthcare is delivered in
  America.



  Joining Talkiatry means joining a mission-driven team that
  is solving complex problems at scale, driving meaningful
  change in healthcare, and building the future of mental
  health care with compassion, innovation, and purpose.

  You will:

  - Contribute to the design, development, and rollout of core
    technical features and large-scale initiatives that
    directly impact the efficiency and quality of patient
    care.
  - Write clear technical specifications, define architecture,
    and identify risks before project kickoffs.
  - Take part in engineering best practices—including code
    reviews, documentation, testing, and postmortems—to
    improve team efficiency and code quality.
  - Collaborate cross-functionally with product managers,
    designers, and analysts to translate business needs into
    actionable, measurable features.
  - Contribute across the stack: from building robust backend
    services and APIs to creating intuitive frontend tooling
    in React/TypeScript.
  - Drive simplicity and scalability in system design to
    maintain reliability and implementation velocity.
  - Mentor teammates and take active parts in high-impact
    initiatives.

  You have:

  - 1-3+ years of professional software development experience.
  - Expertise in TypeScript and modern frontend frameworks.
  - Experience building backend services in TypeScript (Node.js,
    Express, or similar).
  - Demonstrated ability to deliver complex projects from design
    through production.
  - Experience collaborating with product and other engineering
    teams, measuring outcomes, and iterating quickly.
  - Excellent communication and documentation skills.
  - A bias for reducing complexity, improving systems, and
    mentoring others.

  Nice to Have

  - Familiarity with Nest JS.
  - Familiarity with healthcare, telehealth, or regulated
    industries.
  - Comfort working in a fast-paced environment.

  Why Talkiatry:

  - Top-notch team: we're a diverse, experienced group motivated
    to make a difference in mental health care
  - Collaborative environment: be part of building something
    from the ground up at a fast-paced startup
  - Excellent benefits: medical, dental, vision, effective day 1
    of employment, 401K with match, generous PTO plus paid
    holidays, paid parental leave, and more!
  - Grow your career with us: hone your skills and build new
    ones with our Learning team as Talkiatry expands
  - It all comes back to care: we’re a mental health company,
    and we put our team’s well-being first

  Talkiatry participates in E-Verify and will provide the
  federal government with your Form I-9 information to confirm
  that you are authorized to work in the U.S. only after a job
  offer is accepted and Form I-9 is completed. For more
  information on E-Verify, please visit the following: EVerify
  Participation & IER Right to Work.

  At Talkiatry, we are an equal opportunity employer committed
  to a diverse, inclusive, and equitable workplace and
  candidate experience. We strive to create an environment
  where everyone has a sense of belonging and purpose, and
  where we learn from the unique experiences of those around
  us.

  We encourage all qualified candidates to apply regardless of
  race, color, ancestry, religion, national origin, sexual
  orientation, age, citizenship, marital or family status,
  disability, gender, gender identity or expression, pregnancy
  or caregiver status, veteran status, or any other legally
  protected status.
