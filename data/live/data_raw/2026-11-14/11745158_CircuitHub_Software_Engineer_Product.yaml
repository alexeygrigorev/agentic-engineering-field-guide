description: |
  About CircuitHub

  CircuitHub is reshaping electronics manufacturing with The
  Grid, a factory-scale robotics platform that makes small-
  batch, high-mix electronics assembly radically more
  efficient. Think semiconductor-fab precision applied to the
  chaotic world of prototyping and low-volume production: a
  10x throughput improvement in one of the world's most
  foundational industries.

  We've raised $45M from top-tier investors including Plural,
  Y Combinator and Google Ventures, and we're already
  profitable. Our customers include a major EV maker, a top AI
  lab and many of the worlds largest companies.

  The Grid isn't a prototype. It's live, scaling fast and
  delivering real revenue, and we're building the team that
  will scale it further.

  What You’ll Do

  As a Product Engineer at CircuitHub, you will own entire
  production software systems end-to-end, from understanding
  operational problems on the factory floor through designing,
  building, deploying, and operating the software that solves
  them. You’ll be responsible for entire systems rather than
  isolated tickets, owning problems from discovery through
  deployment and operational impact.

  This includes building and maintaining the internal
  operational stack that seamlessly connects planning,
  materials, purchasing, personnel, and factory processes,
  transforming complex manufacturing workflows into highly
  reliable, usable software. You’ll partner closely with
  factory operators, engineers, and company leadership to
  ensure CircuitHub’s factories scale smoothly as demand and
  Grid capabilities grow.

  Example Projects:

  - Develop production planning tools and inventory/materials-
    flow systems
  - Improve factory operator workflows
  - Integrate new automation equipment
  - Apply AI and LLMs to automate operational decision making,
    from purchasing and production planning to machine
    diagnostics and debugging.
  - Build the software systems that coordinate thousands of
    manufacturing decisions across people, robots, inventory,
    and suppliers in real time.



  What We’re Looking For

  Must-haves

  - Strong PostgreSQL experience: complex queries, performance
    tuning, and schema design
  - Solid data modeling and systems-design judgment
  - Hands-on systems integration: stitching together APIs,
    tools, and workflows that hold up in production
  - Strong software engineering fundamentals and the ability to
    ship production systems quickly and reliably.
  - Willingness and ability to travel regularly to CircuitHub
    factories (US and UK) and spend time on the factory floor
    partnering closely with operators and engineers.

  Nice-to-haves

  - Familiarity with manufacturing, logistics, ERP/MRP, or
    supply-chain systems
  - Experience building internal tools or operational software
  - Experience keeping mission-critical operational systems fast
    and reliable
  - Comfortable collaborating closely with internal teams on
    regular basis



  Who You'll Work With

  You’ll work directly with the Head of Internal Software and
  company leadership to identify bottlenecks and turn them
  into software systems that improve factory throughput.
  You'll join the internal software team and work alongside
  engineers, factory operators, and leadership.

  In your first 6–12 months, success looks like owning a
  meaningful slice of the production operations stack outright
  and measurably improving the reliability and throughput of
  the operations it supports.



  Location & Work Environment

  - Offices: South Deerfield MA, US; London and Cambridge, UK
  - Flexible arrangements: remote, hybrid, or in-person
  - This is potentially a remote role open to candidates who can
    maintain at least four hours of daily overlap with both
    our US East Coast and UK teams.
  - While the role can be remote, successful candidates should
    expect regular travel to CircuitHub factories (in US and
    UK) and hands-on engagement with production operations.



  Compensation

  - UK: £80k–£125k
  - US: $125k–$250k
  - Plus equity

  This is a single posting open across multiple levels. Your
  level and offer are calibrated to your experience, and we're
  happy to discuss where you'd land early in the process.
