description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the role:

  CoreWeave is seeking a Technical Program Manager to lead
  programs that level up engineering excellence across our
  developer teams. In this role, you will own engineering
  programs that ensure our engineering team can ship fast,
  without compromising reliability, security or compliance.
  You will look at the whole software development life cycle
  (SDLC), get a deep understanding of how our engineers work
  and what goods look like.  This position is ideal for
  someone who has run large scale programs across many
  engineering teams, understands every step of the SDLC  and
  can keep multi-team execution moving without direct
  authority.

  In this role, TPM will

  - Work closely with our internal developer platform teams to
    understand the paved path and define engineering
    excellence.
  - Meet your internal customers, the CoreWeave engineering
    teams, where they are, understand their priorities and
    drive their migration onto the paved path. .,
  - Lead rollout of engineering and security standards across
    all engineering organizations, including acquired
    entities, sequencing overlapping changes and managing
    exceptions.
  - Drive programs that make releases and operations safer, such
    as change guardrails, progressive rollout, rollback
    readiness and validation of controls.
  - Partner with platform, infrastructure, security, reliability
    and observability teams to reduce deployment related
    incidents and regressions.
  - Create clear visibility into program status, ownership,
    dependencies, risks, decisions needed and progress against
    commitments for engineers, product managers and
    leadership.
  - Work closely with the internal product managers to
    understand priorities and make outcomes measurable.

  Minimum Qualifications

  - 7+ years of experience in technical program management,
    infrastructure program management or a similar role in a
    complex technical environment.
  - Have led complex technical programs spanning developer
    infrastructure, CI/CD, build and test systems, artifact
    management, release engineering or distributed systems.
  - Have run large scale migrations or platform adoption
    programs across many engineering teams, including
    inventory, wave planning, exception handling and legacy
    decommission.
  - Can engage deeply with engineers on workflow architecture,
    deployment systems, rollout risk, observability and
    operational tradeoffs.
  - Have delivered measurable improvements in developer
    velocity, deployment throughput, release reliability or
    engineering efficiency.
  - Know how to turn fragmented ownership and recurring manual
    work into durable mechanisms, standards and tooling with
    strong adoption.
  - Use data and qualitative evidence to prioritize work, define
    useful metrics and distinguish real productivity gains
    from local optimization.
  - Lead effectively across platform and product teams, resolve
    ambiguity and keep multi-team execution moving without
    direct authority.
  - Are Customer obsessed - Treat engineering teams and partners
    as customers.
  - Communicate with precision and move comfortably between
    technical detail, operational execution and executive
    level decisions.
  - Proficiency in JIRA, Confluence and other program management
    and collaboration tools.

  Preferred Qualifications

  - Master's or advanced technical degree.
  - Experience with software supply chain security programs such
    as artifact governance, dependency management, source
    control hardening or credential and secrets management.
  - Experience integrating acquired companies onto shared
    engineering platforms and security standards.
  - Experience driving security or compliance driven programs
    with fixed deadlines across many engineering teams.
  - Experience at a cloud provider, AI infrastructure company,
    hyperscaler or other high scale technical environment.
  - Comfortable working in a fast moving environment and
    flexible working with a variety of leadership.

  Why CoreWeave

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of growth, scaling at an unprecedented
  speed. We are frequently challenging the norm, exploring new
  technologies and advancing the potential for hyperscale.
  We’re not afraid of a little chaos, and we’re constantly
  learning. Our team cares deeply about how we build our
  products and how we work together, which is represented
  through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and provides the opportunity to
  develop innovative solutions to complex problems. As we
  continue to grow, opportunities within the organization are
  evolving and expanding. You will be surrounded by some of
  the best talent in the industry, who will want to learn from
  you, too. If this resonates with you, come join us!

  The base salary range for this role is $157,000 to $210,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

