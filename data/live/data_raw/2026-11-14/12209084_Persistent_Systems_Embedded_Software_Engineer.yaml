description: |
  Job Description & Responsibilities

  We're looking for a hands-on Embedded Software Engineer with
  extensive experience developing software (C/C++) in a Linux
  environment. You will be responsible for working with a team
  of engineers in the development and implementation of a wide
  range of low-level embedded software, hardware development,
  and the development of application software running on the
  Wave Relay® network. This position provides the opportunity
  to develop technology that enables our customers to solve
  their most difficult networking problems.

  Position Responsibilities

  - Using C/C++ to architect, develop, and implement software
    for embedded Linux hardware platforms
  - Supporting hardware development
  - Supporting production hardware test systems running cross-
    platform applications built with Java for Windows and
    Linux
  - Developing application software running on the Wave Relay®
    network, which may include device drivers, Linux kernel
    modules, network stack development, porting existing
    software to new embedded platforms, and other low-level
    programming activities
  - Supporting internal and external engineering activities,
    including travel to test locations, military facilities,
    and customer sites to directly support the testing,
    evaluation, and deployment of the Wave Relay® system
  - Integrating other systems, sensors, and components with the
    Wave Relay® system
  - Writing technical proposals

  Job Qualifications & Experience

  Minimum Qualifications

  - Bachelor’s degree in computer science, electrical
    engineering, or a related field or equivalent experience
  - At least 3 years of work experience developing software for
    embedded Linux systems in C/C++
  - At least 1 year of work experience with Java
  - Must have a US Security Clearance or the ability to obtain
    one

  Preferred Qualifications

  - Master’s degree in computer science/electrical
    engineering/computer engineering or a related field
  - Experience with Linux kernel and kernel module development
    and Linux driver development (wireless, network stack)
  - Hands-on experience with lab equipment (oscilloscopes, logic
    analyzers, multimeters)
  - Experience with UNIX shell scripting
  - Experience with Android application development

  The total compensation for this role can vary from $133,000
  to $160,000 a year based on the selected individual's
  education and experience. Persistent Systems, LLC offers a
  comprehensive benefits package including medical, dental,
  vision, life, and disability insurance; paid time off;
  flexible spending accounts; 401(k) plan with company match;
  fitness membership reimbursement; tuition assistance; mental
  health benefits; and veterinary benefits. We will accept
  applications on a rolling basis until the role is filled.

  Company Overview

  Headquartered in New York City since 2007, Persistent
  Systems, LLC is a global communications technology company
  which develops, manufactures, and integrates a patented and
  secure Mobile Ad Hoc Networking (MANET) system: Wave Relay®.
  The company’s industry leading R&D team has designed
  wireless networking protocols to support their cutting-edge
  Wave Relay® system and technology. Wave Relay® is capable of
  running data, video, voice and other applications under the
  most difficult and unpredictable conditions. Their suite of
  products is field proven and utilized in Commercial,
  Military, Government, Industrial, Agriculture, Robotics, and
  Unmanned System markets.
