description: |
  About Anvil

  Anvil is the SEO platform for the LLM era. As search shifts
  from Google to tools like ChatGPT and Perplexity, we help
  brands stay visible and drive leads in AI-native search.
  We’re a seed-stage startup based in NYC, backed by top
  investors and building fast at the frontier of AI and
  search.

  The Role

  We’re hiring a Backend-Focused Software Engineer to join our
  founding product team. You’ll work directly with the
  founders (ex-Google, YC) and build infrastructure powering
  AI visibility, LLM analytics, and distributed systems. As an
  early engineer, you’ll have significant influence — on
  architecture, company culture, and how we tell our story.
  There is a lot to build in a short amount of time, expect
  intense schedule.

  What We're Looking For

  - Bachelor’s degree in Computer Science or related field (top
    CS programs preferred)
  - 1–2 years of experience at a Big Tech company or Series B+
    startup
  - Strong CS fundamentals, with hands-on experience in
    multithreaded backend systems
  - Experience with Java and TypeScript
  - Must have: experience with data pipelines — Airflow, Kafka,
    Redis queues, MySQL (or similar)
  - High standards for code quality and reliability
  - Bias toward shipping and iterating quickly in a startup
    environment

  Nice to Have

  - Familiarity with Spring Boot
  - Interest in AI, LLMs, or search infrastructure

  What You’ll Get

  - $130,000–$150,000 base salary + equity
  - health/dental/vision insurance
  - International company offsite
  - 3 weeks remote per year
  - Mentorship from ex-Google founders
  - Major say in shaping the engineering culture, narrative, and
    product direction

  Logistics

  - Hybrid, 3 days a week on-site
