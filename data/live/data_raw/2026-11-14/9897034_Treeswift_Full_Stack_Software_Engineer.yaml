description: |
  About Treeswift:

  In the face of rising threats, increasing pressure on
  affordability, and unprecedented demand for power, Treeswift
  empowers energy companies to modernize their field work to
  meet the growth and challenges ahead.

  We build physical AI for the field worker: whether on foot
  or in a vehicle, our technology is an ironman suit for
  engineers, linemen, and vegetation crews: same worker, same
  boots on the ground, now operating at 10x productivity. Our
  platform is powered by cutting edge hardware, sensors
  (LiDAR, camera, etc…), AI and software designed to
  revolutionize work in the toughest environments.

  Our technology has enabled our customers to reduce wildfire
  risk, regulatory and outage risk from vegetation, avoid
  delays and cost overruns in new construction, and accelerate
  recovery from severe storms.

  To tackle this challenge, we are bringing together a team of
  mission-driven experts with deep industry experience in
  robotics (Penn, Caltech, CMU) and enterprise software
  development (Palantir, Stripe, Oracle, MongoDB). We have
  raised funding from leading investors including Penny
  Pritzker’s Inspired Capital.

  We are headquartered in midtown Manhattan, with additional
  offices in San Francisco and Philadelphia.

  Our growth is only accelerating. We’re looking for deeply
  curious and highly ambitious people who want to have a real
  world impact. Come build the future of (field) work with us.

  About the role

  You are a highly skilled and motivated Software Engineer.
  You will:

  - Develop new features and use cases in our web platform in
    close partnership with early adopters. We launched our web
    platform last fall and have only scratched the surface of
    what’s possible. In this role you will both stand-up
    entire new workflows from scratch, as well as iterate and
    improve on the existing foundation. You will partner
    closely with some of the largest utilities in the country
    and contribute to efforts to develop new workflows in work
    planning, construction and disaster response.
  - Help us scale. We are moving quickly since launching our web
    platform and need to introduce the right-level of tools
    and processes to keep moving quickly. This is an ideal
    role for you if you are excited to work on greenfield
    scope, but also enjoy standing up best practices (i.e.
    CI/CD processes and tooling) to help a small software
    engineering organization continue to grow effectively.
  - Stay curious, collaborative and customer-focused. You will
    join a team that takes on challenges across disciplines
    from hardware engineering, to machine learning, software
    engineering and coordinating large data collections in the
    field. We take a lot of pride in turning this technical
    depth into a cohesive easy-to-use product with value
    generation for the customer at the center. As full stack
    software engineer you will be a big part of setting an
    engineering culture that makes Treeswift an exciting place
    to work.
  - Be an owner at Treeswift; make our company better in
    whatever form that takes. Whether you’re a board game
    maestro, former backcountry fire fighter or visual artist
    (all real examples from our current team) we are sure you
    will bring hidden talents that contribute to Treeswifts’
    success and we can’t wait to learn what those are.

  Experience / Skills

  - You have Bachelors Degree in Computer Science, Computer
    Engineering, Math or other similar degree.
  - 5+ years of full-stack software development experience.
  - You have built web applications in a commercial context,
    both in early stage fast-moving settings and at larger
    user scales with meaningful reliability and security
    requirements.
  - Proficiency with Python Typescript, and React. Experience
    with AWS, User Auth, and WebGL are pluses.
  - You are excited to own end-to-end feature development
    independently, are a fan of front-end work and motivated
    to deliver a high-quality UI/UX. You are not afraid to
    pick up new skills or interact across the technical stack
    to do so.
  - You are prepared to contribute to early decisions around our
    tooling and architecture. You are comfortable standing up
    CI/CD processes/tooling from scratch.
  - You are excited about collaborating across disciplines and
    upskilling others to contribute.
  - Experience with geospatial data and imagery data is a plus.

  What We Value

  - Mission first. We value team members who are focused on
    working towards the best outcomes for the customer and the
    business.
  - Curiosity. We are constantly learning – from each other and
    from our customers.. We aren’t afraid to learn we were
    wrong in the process and adapt our approach accordingly.
  - Owners mindset. If you see an opportunity for improvement,
    run with it. We believe that good ideas can come from
    anywhere, no matter your role.

  Benefits

  - Competitive salary and equity package
  - Comprehensive medical, dental, and vision coverage for you
    and your eligible dependents
  - Life insurance and short- and long-term disability coverage
  - 16 weeks of fully paid parental leave to support all new
    parents
  - Flexible, unlimited paid time off
  - 401(k) retirement savings plan
  - Free OneMedical membership
  - Commuter benefits
  - Snacks, goodies, and team lunches provided twice a week to
    keep you fueled and connected with your colleagues.

  Salary

  The estimated salary range for this position is
  $180,000-$230,000. Total compensation for this position is
  determined by skills, qualifications, relevant work
  experience, location, and other factors. This salary
  estimate excludes the value of any potential bonuses; the
  value of any benefits offered; and the potential future
  value of any long-term incentives. This information is
  provided per the New York City Human Rights Law. Please note
  that the range provided is applicable only to New York City-
  based applicants. Base compensation may vary if the work
  location is outside of New York City.

  Treeswift  is proud to be an equal opportunity employer. We
  provide employment opportunities without regard to age,
  race, color, ancestry, national origin, religion,
  disability, sex, gender identity or expression, sexual
  orientation, veteran status, or any other protected status
  in accordance with applicable law.

  If you require any accommodations during the recruitment
  process, whether it be alternate forms of material,
  accessible meeting rooms, etc., please let us know and we
  will work with you to meet your needs.
