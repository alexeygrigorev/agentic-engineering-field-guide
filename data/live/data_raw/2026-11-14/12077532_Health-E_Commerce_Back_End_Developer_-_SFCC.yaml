description: |
  About the Role:

  We're seeking a Back End Developer - SFCC who will be
  responsible for designing and implementing new and exciting
  features, while also maintaining and enhancing the existing
  implementations on our ecommerce websites.  They will
  collaborate with various internal and external teams to
  enhance the overall efficiency and optimization of the
  overall infrastructure.

   Specific Responsibilities:

  - Manage compliance with platform requirements, make updates
    as necessary
  - Work with external development agency, third parties and
    other cross-functional teams to design, develop and
    support end-to-end eCommerce capabilities in Salesforce
    Commerce Cloud
  - Individuals in this role will spend the majority of their
    time fully hands-on with development and making
    architectural decisions.
  - Set up, maintain and troubleshoot website integration feeds,
    including products, inventory, price books, OMS, google
    and product reviews.
  - Provide monitoring and reporting on website performance
    (downtime, speed), recommend and implement improvements
  - Remain current on the latest development innovations on the
    Salesforce Commerce Cloud platform
  - Manage site domains and code repositories
  - Identify project risks and work effectively to mitigate them
  - Proactively uncover opportunities to improve and optimize
    processes and interfaces on the Salesforce Commerce Cloud
    platform
  - Develop and mentor junior engineers, paying your knowledge
    forward.

  Specific responsibilities:

  - Minimum of 3 years experience in SFCC - Required
  - Bachelor's degree in Computer Science, MIS, related field or
    equivalent combination of education and experience
    required.
  - Software development experience with direct Salesforce
    Commerce Cloud experience (Commerce Cloud certification
    preferred) and eCommerce feeds and integrations
  - SFCC Site Genesis and/or SFRA framework, leveraging platform
    features including catalog, content assets, slots, search,
    ordering, marketing, analytics, etc.
  - Experience with integrating third party cartridges with
    necessary customizations as well as developing new
    cartridges.
  - Knowledge & experience with caching and cache management in
    Salesforce Commerce Cloud as well as performance
    monitoring and improvement strategies.
  - A good understanding of Business manager and all its
    capabilities and features including customizations..
  - Strong knowledge and experience on ISMLs, JS controllers,
    pipelines, OCAPI, Business Manager configurations,
    project/release management and version control tools
  - Comfortable working knowledge and experience with front-end
    development skills including JavaScript, HTML5, CSS, SASS,
    jQuery and JavaScript
  - Experience in Retail/E-Commerce industry a plus

  Note for Current Employees:

  Please use the internal job board in Greenhouse to apply.
  Applications submitted through this external link will not
  be tagged as internal.

  Compensation, Benefits, & Additional Details:

  Health-E Commerce's compensation philosophy is grounded in
  market data and internal equity to ensure fairness and
  consistency across the team. Individuals new to the company
  should generally expect offers to fall between the entry
  point and midpoint of the salary range.  Our goal is to
  provide an offer that supports growth potential within the
  role and allows for future salary progression.

  - Compensation: $100,000 - $150,000
  - Discretionary Annual Bonus Eligibility: Up to 10%
  - Medical, Dental, Vision, and 401K with a company match
  - Dependent Care, FSA & HSA accounts
  - Paid Parental & Bonding Leave
  - Flexible PTO & office closure on all major holidays
  - Monthly wellness & internet reimbursements
  - Professional development including certification support &
    leadership coaching
  - Mental Health resources
  - 100% remote within the United States
  - Must be able to work EST hours

  Candidate Privacy Notice
