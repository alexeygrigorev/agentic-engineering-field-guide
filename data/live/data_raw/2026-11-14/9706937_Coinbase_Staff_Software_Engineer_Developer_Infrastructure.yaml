description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  Coinbase's Developer Infrastructure - Test team exists for
  one reason: every Coinbase engineer should get fast,
  reliable test signals so the company can test and ship
  faster. As AI accelerates the pace of code generation, test
  infrastructure is becoming a critical path for how quickly
  Coinbase delivers value to customers. As a Staff Software
  Engineer on the Platform team, you'll set the technical
  direction for how Coinbase tests and ships software, owning
  the systems that turn testing into a speed advantage instead
  of a bottleneck.

  What you'll do:

  - Define and own the technical strategy for test
    infrastructure across Coinbase engineering, with feedback
    speed as a core design constraint.
  - Build and operate core test infrastructure services,
    including test orchestration, smart test selection,
    sharding, flaky-test detection, and test result analysis.
  - Drive measurable improvements in test feedback speed and
    signal reliability so engineers can ship with confidence
    and without reruns.
  - Own systems end to end, including architecture,
    observability, SLOs, and on-call operations.
  - Partner with engineering teams across Coinbase to identify
    bottlenecks and turn them into platform improvements.
  - Mentor engineers, raise technical standards, and shape how
    the organization approaches test infrastructure.

  Required Skills and Experience:

  - 10+ years building and operating production software, with
    distributed systems fundamentals and proficiency in Go or
    a similar language.
  - Track record of defining and delivering technical strategy
    for foundational systems that other teams depend on.
  - Deep experience in test infrastructure, including test
    execution at scale, flaky-test detection, test selection
    and its tradeoffs between speed and coverage, sharding, or
    test result analysis.
  - Proven experience operating reliable systems at scale using
    Kubernetes, AWS, GitHub Actions, Terraform, containers,
    and observability tooling such as Datadog.
  - Demonstrated success measuring platform impact through
    developer adoption and workflow improvements, with
    experience building and maintaining SLOs and incident
    response processes.
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

  Pay Transparency Notice: Base salary varies by location (see
  range below). Total compensation may also include equity and
  bonus eligibility, and benefits (medical, dental, vision,
  401(k)).

  Annual base salary range (excluding equity and bonus):

  $218,025—$256,500 USD

