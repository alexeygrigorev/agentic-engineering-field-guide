description: |
  About Bikky

  Restaurants are the heart of our communities - where we go
  to celebrate life’s memorable moments with those we love,
  and find comfort and familiarity in the world. But while the
  digital and data revolutions have transformed other parts of
  commerce and hospitality, restaurants haven’t had the same
  opportunity. The result has been an industry that’s - on
  average - had their profit margins shrink by 5x over the
  past 20 years.

  Bikky was founded on the belief that restaurants deserve the
  same access to data as the largest, most sophisticated
  businesses in the world. We believe that data can
  fundamentally transform the economic model of the entire
  restaurant industry - producing better businesses, more
  jobs, and stronger communities.

  Bikky is based in New York City and has raised over $26
  million in funding to date, most recently with a Series B in
  2026. We’re proud to serve thousands of restaurant locations
  across the U.S., including major brands like Bojangles,
  Dave’s Hot Chicken, and Long John Silver’s.

  About the role

  As a Senior Software Engineer at Bikky, you’ll play a key
  role in shaping the future of our technical systems. Your
  work will span our entire platform - across data
  visualization, marketing workflows, AI powered analytics,
  and infrastructure. We’re working at scale and are growing
  rapidly, but our team is still small and tightknit. You’ll
  be trusted to take ownership over large sections of our
  stack and evolve them to meet the future needs of the
  business.

  On any given day you might:

  - Contribute to our in-house data visualization framework,
    enabling our customers to build custom dashboards.
  - Expand our data ingestion pipeline, which processes millions
    of orders, payments, and guests a day.
  - Deepen our AI powered Data Assistant, helping non-technical
    users answer data questions. While doing so, you’ll push
    the boundaries of how AI can be used in analytics.
  - Support your peers by investing in our engineering practices
    to enable exceptional, high quality, productivity at
    scale.
  - Design and scope the next generation of one of our core
    capabilities across infrastructure, platform, and
    applications.

  About you

  Our engineering culture is pragmatic and low ego, with a
  high bar for ourselves and the quality of our work. We’re
  looking for engineers that thrive in an autonomous
  environment, instinctively take deep ownership, and are
  clear communicators.

  The ideal candidate will have:

  - 6+ years of professional software engineering experience.
  - Strong fundamentals across backend and frontend.
  - Experience with - or desire to learn - AI enabled
    engineering practices.
  - Experience with our stack (React, TypeScript, Python,
    PostgreSQL) is a plus but not required.

  That said, we want to talk with exceptional candidates from
  any background. If you feel you’re a great fit for the role,
  please reach out even if you don’t meet all of the points
  above.

  Why us

  At Bikky, you’ll work on challenging problems that matter to
  real businesses while building a product used by some of the
  best-known restaurants in the country. We work at the
  intersection of a unique set of technical constraints that
  you’ll help us solve. And you’ll do it in service of a
  deeply deserving customer base - restaurant operators have
  been underserved by the technical community and deserve
  better tools.

  Along the way, you’ll work with a fully senior/staff level
  team. Your teammates have deep experience in their
  respective domains and we’re a low drama, high productivity
  team. Many of us are startup veterans and we feel we’re
  working at an “adult’s startup” - all the benefits of being
  at an early stage company without the chaos.

  Perks and Benefits

  - $160,000 - $250,000 annual salary. Estimated salary range is
    inclusive of multiple levels and will be narrowed in the
    interview process.
  - Generous equity compensation
  - Top tier health insurance including medical, vision, and
    dental
  - Ability to participate in a 401k
  - Bikky offers a hybrid working environment. For candidates in
    New York City, we have an office where the team works 3-4
    days per week.
  - Flexible vacation policy
