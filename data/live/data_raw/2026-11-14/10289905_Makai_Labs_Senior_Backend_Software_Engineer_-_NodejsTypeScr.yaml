description: |
  About Makai

  Makai uses best-in-class AI and data to solve real-world
  operational and strategic challenges at scale. We help
  businesses with enterprise automation, human-machine
  teaming, product design and development, and market
  intelligence. Until now, people have had to learn and adapt
  to software. Makai creates solutions that adapt to people
  because technology will never be 100% accurate. People are
  essential for all of our human-machine teaming solutions.

  About the role

  This is a full-time remote role for a Senior Backend
  Software Engineer at Makai. This person will be responsible
  for backend app development and will collaborate with cross-
  functional teams to design and implement innovative
  solutions that enhance user experiences and drive business
  outcomes.

  The ideal candidate will be able to

  - Develop new features across our Node.js/TypeScript backend
    services
  - Optimize applications for maximum speed and scalability
  - Ensure the technical feasibility of UI/UX designs
  - Collaborate with frontend developers and product designers
    to improve usability
  - Write robust, clean, and documented code
  - Maintain and enhance existing applications
  - Conduct performance tests and ensure responsiveness and
    stability across all platforms

  Qualifications

  - Experience with Node.js and TypeScript required
  - 7+ years of professional backend software engineering
    experience, including strong, current, hands-on experience
    building and running production services
  - Experience building and running software in a regulated,
    compliance-heavy environment (e.g., healthcare and PHI,
    HIPAA, SOC 2, or HITRUST), with the access-control, audit-
    logging, and data-handling discipline that implies
  - Proven ability to pick up new frameworks and tools quickly,
    and to reason about systems rather than rely on
    familiarity with a single specific stack
  - Strong command of relational data modeling and an ORM, and
    of structured request/schema validation as a general
    practice
  - Relevant experience using Docker
  - Understanding of microservices architecture and related
    patterns
  - Solid software engineering skills, with the ability to
    produce well-structured, maintainable code
  - Familiarity with modern authorization mechanisms
  - Solid experience working from a fully remote position

  Nice-to-haves

  - Experience with a Node.js application framework such as
    NestJS, Express, or Fastify
  - Cloud-native experience on Azure, particularly containers
    and Kubernetes (AKS)
  - Workflow orchestration with Temporal or a comparable
    durable-execution runtime
  - Multi-tenant SaaS architecture: tenant isolation, row-level
    security, and attribute-based access control (ABAC)
  - Legacy modernization or migration experience, carrying a
    live production system onto a new platform

  How we work

  Small senior teams, real ownership. We'd rather have one
  engineer who understands a platform top to bottom than
  several who each own a slice.

  Core values for Makai employees

  - Be a flexible, innovative and creative thinker
  - Be congenial and a team player
  - Be self-sufficient
  - Be self-driven with an ownership mentality
  - Have a strong work ethic

  Employment Type Full Time

  - Fully remote role

  Benefits

  - Fully remote role, Eastern time zone
  - Opportunities to work in-person with local colleagues
  - Generous PTO
  - Full health insurance premium reimbursement
  - 401(k) matching
  - Career growth & development opportunities
