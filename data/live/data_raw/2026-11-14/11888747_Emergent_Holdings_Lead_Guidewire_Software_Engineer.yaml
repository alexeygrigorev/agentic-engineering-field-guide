description: |
  SUMMARY:

  Responsible for leading the design, development,
  configuration, integration, testing, deployment, and
  production support of Guidewire solutions supporting
  Property and Casualty insurance operations. Provides hands-
  on technical leadership across one or more Guidewire
  InsuranceSuite applications, including PolicyCenter,
  ClaimCenter, or BillingCenter, and ensures solutions align
  with enterprise architecture, security, quality, and
  performance standards. Partners with product owners,
  business stakeholders, architects, and delivery teams to
  translate policy, claims, billing, and related insurance
  requirements into scalable technical solutions. Leads
  incident management, technical troubleshooting, root cause
  analysis, defect correction, release validation, and
  continuous improvement throughout the system development
  life cycle.

  ESSENTIAL DUTIES AND RESPONSIBILITIES:

  - Serve as the lead technical expert for Guidewire-based
    applications supporting Property and Casualty insurance
    products and operations.
  - Lead solution design, configuration, development,
    integration, testing, implementation, and production
    support for PolicyCenter, ClaimCenter, or BillingCenter.
  - Partner with product owners, underwriting, policy
    administration, claims, billing, architecture, and other
    key stakeholders to translate business needs into secure,
    scalable Guidewire solutions.
  - Provide technical direction to engineers, coordinate
    development assignments, review technical designs and
    code, and promote Guidewire implementation best practices.
  - Design and support integrations between Guidewire
    applications and internal or third-party systems using
    APIs, web services, messaging, and batch processes.
  - Troubleshoot and resolve application, integration, database,
    user interface, and performance issues across Guidewire
    environments.
  - Lead root cause analysis for production incidents, implement
    durable corrective actions, and validate application
    stability following releases and changes.
  - Work with product teams to refine developer-ready user
    stories, acceptance criteria, technical requirements,
    estimates, and implementation plans.
  - Implement Agile/Scrum and DevOps practices, including
    continuous integration, automated testing, source control,
    deployment automation, and release management.
  - Ensure Guidewire configurations, customizations, and
    integrations comply with enterprise architecture,
    security, data protection, coding, and quality standards.
  - Maintain technical documentation, including solution
    designs, integration specifications, support procedures,
    release notes, and production readiness materials.
  - Monitor Guidewire product capabilities and industry trends,
    recommend appropriate platform enhancements, and
    contribute to technical communities of practice.
  - Mentor engineers and support knowledge sharing related to
    Guidewire development, Property and Casualty insurance
    processes, software design, and delivery practices.
  - Use Agile project management tools and delivery metrics to
    identify risks, communicate status, and help deliver
    initiatives on time and within budget.

  EDUCATION AND EXPERIENCE:

  Bachelor’s degree in information services or related field.
  Combinations of relevant education and experience may be
  considered in lieu of a degree. Continuous learning, as
  defined by the Company’s learning philosophy, is required.
  Certification or progress toward certification is highly
  preferred and encouraged.

  Minimum seven years experience of development and system
  design which provides the necessary skills, knowledge, and
  abilities.

  QUALIFICATIONS

  To perform this job successfully, an individual must be able
  to perform each essential duty satisfactorily. The
  requirements listed below are representative of the
  knowledge, skill, and/or ability required. Reasonable
  accommodation may be made to enable individuals with
  disabilities to perform the essential functions.

  OTHER SKILLS AND ABILITIES:

  - Extensive experience designing, configuring, developing,
    integrating, and supporting Guidewire applications in a
    Property and Casualty insurance environment.
  - Hands-on experience with at least one of the following
    Guidewire applications: PolicyCenter, ClaimCenter, or
    BillingCenter.
  - Strong knowledge of Property and Casualty insurance
    concepts, workflows, and data, including policy
    administration, underwriting, claims, billing, and related
    operational processes.
  - Expert knowledge of Guidewire configuration and development
    concepts, including data models, business rules,
    workflows, user interfaces, and application extensions.
  - Strong experience with Guidewire integration patterns and
    technologies, including APIs, web services, messaging,
    plugins, and batch processing.
  - Proficiency with Guidewire development tools and applicable
    programming technologies, including Gosu, Java, SQL, XML,
    and web technologies.
  - Strong understanding of object-oriented analysis and design,
    multi-tier architecture, design patterns, secure coding,
    and software engineering best practices.
  - Experience with relational databases, data analysis, query
    optimization, and troubleshooting application and
    integration issues.
  - Experience with source control, continuous integration,
    automated testing, deployment pipelines, environment
    management, and release practices for enterprise
    applications.
  - Ability to lead technical design discussions, conduct code
    reviews, mentor engineers, and communicate complex
    platform decisions to technical and non-technical
    stakeholders.
  - Strong analytical, problem-solving, planning, interpersonal,
    and written and verbal communication skills.
  - Ability to manage multiple priorities in a fast-paced
    environment while taking ownership of delivery quality and
    team success.
  - Ability to understand business needs and conceptualize and
    implement information systems that support those business
    strategies.
  - Experience working within an agile framework like Scrum
    based development organization.
  - Thorough knowledge of departmental procedures processes and
    work flows.
  - Knowledge of standard languages, coding methods, company
    coding standards and quality requirements.
  - Excellent oral and written communication skills required.
  - Demonstrated abilities to successfully document and
    communicate software platform designs to all levels of
    staff (technical and non-technical).
  - Ability to work constructively with other technical experts
    in a group setting.
  - Knowledge of object-oriented development languages and web-
    related technologies.
  - Ability to comprehend the consequences of various problem
    situations and address them, or refer them for appropriate
    decision making.
  - Ability to effectively exchange information clearly and
    concisely, and present ideas, reports facts and other
    information, and respond to questions as appropriate.
  - Demonstrated leadership abilities.
  - Ability to make competent, independent decisions.
  - Ability to manage technical services and software vendors.
  - Ability and proficiency in the use of project management
    tools and techniques.
  - Ability to maintain confidentiality.
  - Ability to perform other assignments at locations outside
    the office.

  ADDITIONAL INFORMATION

  The above statements are intended to describe the general
  nature and level of work being performed by people assigned
  to this classification. They are not intended to be
  construed as an exhaustive list of all responsibilities,
  duties and skills required of personnel so classified. This
  job description does not constitute a contract for
  employment.

   PAY RANGE:

  “Actual compensation decision relies on the consideration of
