description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  Our Senior Software Engineers lead and mentor engineers,
  delivering high-value products for our customers and
  infrastructure that enables our business to scale.

  Vanta’s team and technology surface are growing quickly, and
  it’s essential that we invest in the right abstractions and
  systems to enable us to scale with our business. As a Senior
  Software Engineer, you’ll be responsible for setting
  technical direction to enable our product and infrastructure
  to scale with our business, driving complex projects across
  our technical stack, and mentoring our talented engineering
  team. Your past experience will be leveraged to enable and
  accelerate Vanta’s growth.

  Our business has found incredible product-market fit and has
  monetized effectively since the day we signed our first
  customer. We’re growing at a blistering pace, which presents
  career-defining opportunities for engineers to accelerate
  their growth and to contribute to a rapidly-scaling company.

  Visit our Vanta Engineering Blog to learn more about what
  our team is working on!

  The GRC (Governance, Risk and Compliance) organization is
  the primary org responsible for developing and maintaining
  Vanta's core product offerings. These teams are at the heart
  of Vanta moving upmarket to support enterprise customers and
  build products that enable our customers’ existing security
  and compliance programs to integrate seamlessly with Vanta,
  giving them invaluable insights and recommendations to
  continue to operate, mature and evolve their programs.

  What you’ll do as a Senior Software Engineer at Vanta:

  - Lead complex projects with multiple stakeholders and
    engineers to deliver significant impact to our business
  - Set direction for critical technical surface areas, enabling
    us to stay ahead of continued rapid growth
  - Design, develop, and own new product functionality and/or
    infrastructure leveraging modern frameworks and tooling
    (TypeScript, React, Node.js)
  - Work with talented and kind engineers to make a significant
    impact on our customer base, enabling them to improve
    their security and prove it
  - Contribute to building Vanta’s engineering culture as we
    grow

  How to be successful in this role:

  - Have at least 8 years of industry experience
  - Have played technical leadership roles for teams or complex
    projects
  - Have previous startup experience, or worked in an
    environment that prioritizes a bias for action
  - Have previous experience working on greenfield projects
  - Have an interest in learning about security or prior
    experience in the space

  What you can expect as a US-based Vanta'n:

  - Industry-competitive salary and equity
  - Comprehensive medical, dental, and vision coverage, with
    100% of employee-only benefit premiums covered for most
    medical plans
  - 16 weeks paid Parental Leave for all new parents
  - Health & wellness stipend
  - Remote workspace, internet, and cellphone stipend
  - Commuter benefits for team members who report to the SF and
    NYC office
  - Family planning benefits
  - Matching 401(k) contribution with immediate vesting
  - Flexible PTO policy, plus 80 hours of Sick Time
  - 11 company-paid holidays
  - Virtual team building activities, lunch and learns, and
    other company-wide events!
  - Offices in SF, NYC, London, Dublin, Tel Aviv, and Sydney



  To provide greater transparency to candidates, we share base
  pay ranges for all US-based job postings regardless of
  state. We set standard base pay ranges for all roles based
  on function, level, and country location, benchmarked
  against similar-stage growth companies. Final offer amounts
  are determined by multiple factors and may vary based on
  candidate location, skills, depth of work experience, and
  relevant licenses/credentials.



  #LI-Remote

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
