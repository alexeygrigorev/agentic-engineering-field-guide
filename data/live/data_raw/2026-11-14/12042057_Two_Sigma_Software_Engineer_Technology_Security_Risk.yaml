title: "Software Engineer, Technology Security & Risk"
company: Two Sigma
location: New York, USA
work_type: FULL_TIME
company_size: 1,700 Employees
description: |
  Position Summary  Two Sigma is a leading quantitative
  investment management and trading firm. The company applies
  a scientific approach to investing, combining cutting-edge
  technology, artificial intelligence, data science, and
  quantitative research with rigorous human inquiry to
  capitalize on market opportunities and deliver alpha for
  investors. Our team of engineers, quantitative researchers
  and data scientists looks beyond the traditional to test
  hypotheses and develop creative solutions to some of the
  world's most complex economic problems. Security Development
  and Infrastructure team and the Tech Risk teams are
  responsible for Two Sigma's most critical authentication,
  authorization, and security infrastructure systems. We
  build, maintain, and evolve world-class security solutions
  including identity management systems, access control
  platforms, and configuration management databases that
  protect the company's technology while meeting evolving
  business needs. We are seeking experienced software
  engineers to architect and build the next generation of our
  security infrastructure, redefining legacy systems into
  modern, scalable solutions. This role combines hands-on
  software development with technical leadership
  opportunities, requiring you to make critical architectural
  decisions while mentoring team members and driving cross-
  organizational initiatives to improve our security posture.
  You will take on the following responsibilities:

  - Develop robust software in either Java, Go, or Python to
    enhance system capabilities, improve performance, and
    reduce operational complexity
  - Lead architectural decisions and technical strategy for
    migrating legacy infrastructure to modern, cloud-native
    platforms while maintaining high security and reliability
    standards
  - Mentor junior engineers and influence technical direction
    through code reviews and design discussions
  - Drive team-wide and cross-team projects to improve system
    observability, monitoring, and documentation
  - Research industry standards, contribute to open source
    projects, and evaluate emerging security technologies for
    potential adoption
  - Become a technical domain authority on running our
    authentication, authorization, and identity management
    systems

  You should possess the following qualifications:

  - BS in Computer Science, Software Engineering, or another
    technical discipline
  - Experience in software engineering roles building and
    maintaining distributed systems at scale
  - Proficiency in programming languages such as Java, Python,
    or Go
  - A deep understanding of system design principles, including
    distributed systems architecture and database management
  - Experience with authentication and authorization protocols,
    configuration management tools, CI/CD and security
    standards
  - Consistent track record of leading technical initiatives and
    making architectural decisions
  - Strong communication skills with ability to work effectively
    across teams and with collaborators

  Preferred Qualifications:

  - Experience with containerization technologies (Docker) and
    orchestration platforms (Kubernetes)
  - Knowledge of entitlement systems and audit processes within
    financial- or technology organizations
  - Familiarity with identity systems and technologies
  - Proficiency in SQL and large-scale data management
  - Experience with cloud infrastructure (GCP, AWS, or Azure)
    and hybrid cloud architectures
  - Expertise in zero trust security models and implementation
  - Contributions to open source projects or published technical
    content

  You will enjoy the following benefits:

  - Core Benefits: Fully paid medical and dental insurance
    premiums for employees and dependents, competitive 401k
    match, employer-paid life & disability insurance
  - Perks: Onsite gyms with laundry service, wellness
    activities, casual dress, snacks, game rooms
  - Learning: Tuition reimbursement, conference and training
    sponsorship
  - Time Off: Generous vacation and unlimited sick days,
    competitive paid caregiver leaves
  - Hybrid Work Policy: Flexible in-office days with budget for
    home office setup

  The base pay for this role will be between $165,000 and
  $250,000. This role may also be eligible for other forms of
  compensation and benefits, such as a discretionary bonus,
  health, dental and other wellness plans and 401(k)
  contributions. Discretionary bonus can be a significant
  portion of total compensation. Actual compensation for
  successful candidates will be carefully determined based on
  a number of factors, including their skills, qualifications
  and experience. We are proud to be an equal opportunity
  workplace. We do not discriminate based upon race, religion,
  color, national origin, sex, sexual orientation, gender
  identity/expression, age, status as a protected veteran,
  status as an individual with a disability, or any other
  applicable legally protected characteristics. Two Sigma is
  committed to providing reasonable accommodations to
  qualified individuals in accordance with applicable federal,
  state, and local laws. If you believe you need an
  accommodation, please visit our website for additional
  information.
