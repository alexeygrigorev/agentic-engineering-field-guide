description: |
  About Us

  Since 1989, SHI International Corp. has helped organizations
  change the world through technology. We’ve grown every year
  since, and today we’re proud to be a $16 billion global
  provider of IT solutions and services.



  Over 17,000 organizations worldwide rely on SHI’s concierge
  approach to help them solve what’s next. But the heartbeat
  of SHI is our employees – all 7,000 of them. If you join our
  team, you’ll enjoy:

  - Our commitment to diversity, as the largest minority- and
    woman-owned enterprise in the U.S.
  - Continuous professional growth and leadership opportunities.
  - Health, wellness, and financial benefits to offer peace of
    mind to you and your family.
  - World-class facilities and the technology you need to thrive
    – in our offices or yours.

  Job Summary

  The Manager of Presales Engineering is a Technical Sales and
  Pre-Sales Manager supporting a team of Engineers,
  Architects, and Specialists whose focus is to bring the
  right technical solutions to meet customer needs. This
  individual will coach, train, and develop Solutions
  Engineers. In addition, they will be involved in customer
  meetings to move the process forward and actively close
  deals with the team. These positions are remote positions
  required to reside in one of the following US areas to
  support business needs as determined by SHI management:
  West/Pacific Northwest/Mountain Northeast/New England/DMV
  Southeast Texas

  Role Description

  Include but not limited to:  

  - Engaging with multiple layers of contacts within a client’s
    organization, including but not limited to CIO, CTO, IT
    Directors, and Application Managers, to sell, build
    relationships and uncover opportunities
  - Collaborating with sales team to help close deals by
    speaking to the technical side of recommended solutions
  - Engaging the Local Technology Community (MFGs and SI
    Partners) and the appropriate customer technical personnel
    to establish market credibility
  - Strategically training sales team on the positioning of
    company solution practices, ensuring they understand
    customers' ongoing enterprise needs
  - Monitoring employee performance and attendance records,
    acting on performance issues in a fair and consistent
    manner by providing actionable feedback, and driving
    employee recognition

  Behaviors and Competencies

  - Collaboration: Can take ownership of team initiatives,
    foster a collaborative environment, and ensure that all
    team members feel valued and heard.
  - Leadership: Can take ownership of complex team initiatives,
    collaborate with others in decision-making processes, and
    drive team performance.
  - Problem-Solving: Can proactively identify and take ownership
    of complex problem-solving initiatives, initiate
    preventative measures, collaborate with others to find
    solutions, and drive successful outcomes.
  - Strategic Implementation: Can take ownership of complex
    strategic initiatives, coordinate cross-functional teams,
    and ensure successful implementation and outcome.
  - Technical Expertise: Can demonstrate a high level of
    technical expertise in a specified area and can serve as a
    resource for others.
  - Communication: Can effectively communicate complex ideas and
    information to diverse audiences, facilitate effective
    communication between others, and mentor others in
    effective communication.
  - Continuous Improvement: Can identify major areas for
    improvement, implement major changes, and support others
    in their continuous improvement efforts.
  - Analytical Thinking: Can use advanced analytical techniques
    to solve complex problems, draw insights, and communicate
    the solutions effectively.
  - Detail-Oriented: Can oversee multiple projects, maintaining
    a high level of detail orientation, identifying errors or
    inconsistencies in work, and ensuring accuracy across all
    tasks.
  - Prioritization: Can take ownership of complex task
    management, collaborate with others to align priorities,
    and drive team efficiency.

  Skill Level Requirements

  - Strong leadership skills
  - Ability to monitor employee performance and exhibit a high
    level of confidentiality with employees and management
  - Ability to clearly communicate ideas and effectively work
    well with employees and collaborate in a team setting
  - Ability to motivate the team by setting a mission and then
    turning it into clear, specific, and measurable goals
  - Strategic planning abilities in line with business segment
    and company initiatives
  - Ability to be honest and hold oneself accountable to build
    trust and serve as an example
  - Deep understanding and experience working with enterprise
    technology organizations (Cisco, CrowdStrike, Proofpoint,
    AWS, Microsoft, Palo Alto, etc.) and knowledge of the
    competitive IT landscape
  - Advanced knowledge of Microsoft Excel/Visio/PPT and
    delivering customer proposals

  Other Requirements

  - Bachelor’s Degree or equivalent work experience
  - Minimum 5 years in a Pre-Sales Technical role
  - Minimum 3 years of experience working with complex Data
    Center, Cloud, Collaboration, Security, and Network sales
    opportunities
  - Minimum 2 years development and coaching experience
  - Position requires 35% of travel for business

  The base salary range for this position is $144,000 -
  $296,000. The estimated on-target earnings, or OTE, which
  includes a base salary and bonus, are $180,000 - $370,000.
  The compensation for this position is dependent on job-
  related knowledge, skills, experience, and market location
  and, therefore, will vary from individual to individual.
  Benefits may include, but are not limited to, medical,
  vision, dental, 401K, and flexible spending.

  Equal Employment Opportunity – M/F/Disability/Protected
  Veteran Status
