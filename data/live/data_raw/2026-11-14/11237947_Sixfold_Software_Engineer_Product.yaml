  Our Commitment

  Sixfold fosters an environment that welcomes professionals
  with a diversity of backgrounds and ideas. We value
  passionate professionals who bring creativity,
  determination, and a commitment to our mission. At Sixfold,
  every team member plays a crucial role, with opportunities
  to make meaningful and visible contributions to our success.

  We believe in empowering our employees through continuous
  growth, learning, and a proactive problem-solving approach.
  Our comprehensive compensation package includes competitive
  salaries, equity opportunities, and robust benefits, all
  within a supportive and inclusive workplace culture. If
  you're driven to make a significant impact alongside
  exceptional colleagues, we want to hear from you.

  We are committed to accessibility and provide reasonable
  accommodations for qualified individuals with disabilities
  and disabled veterans throughout our recruitment process. If
  you have any difficulty using our online system and you need
  accommodation due to a disability, please reach out to us
  directly at (646) 847-8824.

  Sixfold does not accept unsolicited agency resumes and is
  not responsible for any fees related to unsolicited resumes.
