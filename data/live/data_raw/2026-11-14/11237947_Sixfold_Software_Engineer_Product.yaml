description: |
  Software Engineer, Product

  Insurance underwriting runs on human judgment, manual
  workflows, and knowledge locked in someone's head. It breaks
  when that person leaves and doesn't scale when the book
  doubles. Sixfold is building AI agents that understand risk
  the way a 20-year veteran underwriter does. Not summaries or
  flags, but systems that make real decisions on billions in
  premium for some of the world's largest carriers. AI is the
  product and the workflow. In this role, you will build and
  run the cloud infrastructure, Kubernetes environments,
  deployment tooling, and observability systems that enable
  Sixfold's engineers to develop, release, and operate our
  products.

  Who We Are

  🏔 Product: Sixfold is the AI brain for underwriting. Our
  platform handles submissions at scale, assessing risk
  against appetite, surfacing cited insights, and deploying AI
  agents to handle research, referrals, and triage so
  underwriters can focus on building profitable portfolios.

  💪 Team: A focused team of insurance operators, AI
  researchers, and engineers who love hard problems. We're
  pushing the boundaries of AI adoption across every function,
  from how we build, to how we sell and to how we support
  customers. We ship fast and stay close.

  📈 Traction: Processing billions in premium for some of the
  world's largest carriers. We know AI. We know underwriting.
  We're building what comes next.

  About the Role

  As a software engineer at Sixfold, you will:

  - Build and deliver quality software. You will write, test,
    and deploy code across the full application stack,
    primarily using TypeScript. You will build new product
    capabilities in our TypeScript stack and contribute to
    established Ruby and Python services when needed. You’ll
    work on team-level projects, applying engineering best
    practices and contributing to the team’s technical
    decision-making.
  - Develop AI engineering expertise. You'll have opportunities
    to learn and apply machine learning principles, work with
    large language models, and integrate AI capabilities into
    our products. You'll collaborate with our AI engineers to
    understand best practices for prompt engineering, model
    evaluation, and responsible AI development.
  - Collaborate with cross-functional partners. Our teams
    include product managers, designers, and engineers working
    together to accomplish shared goals. You will collaborate
    with these partners, beginning with problem discovery
    through solution design and delivery. We work in two-week
    cycles and release to production at least once a week.
  - Own your software through its entire lifecycle. In addition
    to shipping code, you will assess our most pressing
    product and engineering problems, identify and design
    solutions, write technical specs, and scope and break down
    projects. You will also spend approximately one week per
    quarter on call, serving as the first line of defense
    against service outages and critical bugs. If you don’t
    have experience with all of this yet, don’t worry - we’ll
    teach you!

  What Success Looks Like

  Within 90 days you will have:

  - Within 30 days: You’re familiar with the domain of an
    underwriter. You understand where their bottlenecks are,
    the pain points they feel day-to-day, and how Sixfold fits
    into their workflow. You’re comfortable in the codebase of
    our products and have shipped code to production.
  - Within 60 days: You work with Product and Design to
    translate underwriter problems to solutions. You’re
    tackling projects on our roadmap, owning feature work end-
    to-end. You have participated in writing and reviewing
    RFCs and technical specs.
  - Within 90 days: You’re building expertise and owning an area
    of our products. You are integrated into your team’s on-
    call rotation. You’re participating in building out the
    team’s roadmap for the upcoming quarter.

  About You

  - You have 3+ years of professional software engineering
    experience.
  - You are familiar with web development using React and
    TypeScript. You understand React's component lifecycle,
    state management patterns, and performance optimization
    techniques. You can leverage TypeScript's type system
    effectively to create maintainable, type-safe code. Extra
    credit if you are comfortable with generics, utility
    types, and TailwindCSS.
  - You are familiar with Node and PostgreSQL and know their
    patterns well enough to build features in a TypeScript app
    without significant learning time. Extra credit if you
    have experience with WebSocket frameworks or background
    job processing frameworks.
  - You have **experience designing and developing APIs
    (**RESTful and/or GraphQL) with a strong understanding of
    authentication, authorization, and versioning best
    practices. You can build and document APIs that are
    intuitive, scalable, and easy to integrate with.
  - You want to work in an early-stage, fast-growth tech
    company. You are comfortable with ambiguity and change.
    You can own problems and proactively devise solutions, not
    just wait for somebody to feed you tasks to execute.
  - You love communication, collaboration, and execution. You
    value meaningful commit messages and pull request
    descriptions and prefer to merge your PRs within a day.
    You appreciate healthy engineering debates but know how to
    make pragmatic decisions. You take feedback well and are
    candid with the feedback you give.
  - You have experience with agentic coding as your default
    workflow. You ship real feature work through Claude Code
    or Codex, orchestrate parallel agents, design specs and
    prompts as a primary craft, and have intuition around
    evals, tool use, and context engineering.
  - Insurance, insurtech, or enterprise B2B background is a plus
    but not required.

  Additional Information

  - Expected salary: $130,000-170,000 + equity + benefits
  - Advertised and actual salary ranges may differ by geographic
    area, work experience, education, and/or skill level.
  - About half the company works in the NYC office 3–4 days a
    week.
  - This position does not include visa sponsorship. Candidates
    must be authorized to work in the United States without
    requiring employer sponsorship.

