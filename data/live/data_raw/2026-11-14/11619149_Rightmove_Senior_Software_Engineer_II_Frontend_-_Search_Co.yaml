description: |
  Our vision is to give everyone the belief they can make
  their move. We aim to make moving simpler, by giving
  everyone the best place to turn to and return to for access
  to the tools, expertise, trust, and belief to make it
  happen.

  We’re home to the UK’s largest choice of properties and are
  the go-to destination for millions of people planning their
  next move, reading the latest industry news, or just
  browsing what’s on the market.

  Location: London - hybrid (Wednesday & Thursday office days)
  Reports to: Engineering Manager, Core Search

  The role At Rightmove, millions of people use our products
  at some of the most important moments in their lives. As a
  Senior Software Engineer II, you'll play a key role in
  building the tools, systems and experiences that help keep
  the UK's favourite property platform moving forward.

  You'll join a collaborative, high-performing engineering
  community where autonomy, curiosity and continuous
  improvement are part of everyday life. Working closely with
  Product, Design and Engineering colleagues, you'll help
  solve meaningful problems at scale, delivering software that
  is reliable, maintainable and loved by its users. We're
  passionate about modern engineering practices, continuous
  delivery and building quality in from the start. Whether
  it's shaping architecture, mentoring engineers or exploring
  new technologies, you'll have the freedom and support to
  make a genuine impact.

  A note from your manager: Help millions of people find the
  right property faster. Join our collaborative Search team,
  where you’ll build intelligent, intuitive discovery
  experiences, experiment with new technologies, and shape how
  users explore and connect with homes they'll love.

  What you'll be doing

  - Building and evolving products using a modern technology
    stack including TypeScript, React, Express, Node.js,
    Kubernetes and GitLab
  - Delivering high-quality software that can be released safely
    and frequently to production
  - Partnering with Product, Design and Engineering teams to
    solve complex, real-world challenges
  - Influencing technical direction and helping shape the work
    that goes into each sprint
  - Designing scalable, resilient systems alongside Architects
    and Principal Engineers
  - Contributing to engineering communities, standards and best
    practices across Rightmove
  - Coaching and mentoring fellow engineers, helping others grow
    and develop
  - Collaborating through code reviews and technical discussions
    to continuously improve quality
  - Experimenting with new technologies and approaches that help
    us work smarter and deliver more value

  We'd love to hear from you if...

  - You enjoy solving complex technical problems and finding
    simple, elegant solutions
  - You're passionate about software quality and advocate for
    testing and automation
  - You have strong experience with React, TypeScript and modern
    web application development
  - You care about performance, scalability and creating great
    user experiences
  - You're comfortable influencing technical decisions and
    driving engineering excellence
  - You enjoy mentoring others and helping teams succeed
    together
  - You're naturally curious, always looking to learn and
    improve
  - You take ownership, value collaboration and celebrate team
    success

  Our Approach to AI

  At Rightmove, we believe software and product are ultimately
  people problems, and everything we build aims to improve the
  lives of others. We see AI as a helpful way to create more
  space for the human side of our work, from understanding
  real needs to making sure we are solving the right problems
  in the right way. There is an expectation that you are
  proactive in exploring how AI can support your own workflow
  and productivity, and that you approach it with curiosity
  and an open mind.

  Life at Rightmove

  Despite our growth, we’ve remained a friendly, supportive
  place to work, with employee #1 still working here!  We’ve
  done this by placing the Rightmove Hows at the heart of
  everything we do. These are the essential values that
  reflect our culture, and include:

  - We create value…by delivering results and building trust
    with partners and consumers.
  - We think bigger…by acting with curiosity and setting bold
    aspirations.
  - We care deeply…by being real, having fun, and valuing
    diversity.
  - We move together…by being one team - internally
    collaborative, externally competitive.
  - We make a difference…by focusing on delivering measurable
    impact.





  We believe in careers that open doors and help our team
  develop by providing an open and inclusive work environment,
  offering ongoing   training opportunities, and supporting
  charity fundraising events. And with 89% of Rightmovers
  saying we’re a great place to work, we’re clearly doing
  something right!

  What we offer

  - Cash plan for dental, optical and physio treatments.
  - Private Medical Insurance, Pension and Life Insurance,
    Employee Assistance Plan.
  - 27 days holiday plus two (paid) volunteering days a year to
    give back, and holiday buy schemes.
  - Contributory stakeholder pension.
  - Life assurance at 4x your basic salary to a spouse, family
    member or other nominated person in your life.
  - Competitive compensation package.
  - Paid leave for maternity, paternity, adoption & fertility.
  - Travel Loans, Bike to Work scheme, Rental Deposit Loan.
  - Charitable contributions through Payroll Giving and donation
    matching.
  - Access deals and discounts on things like travel,
    electronics, fashion, gym memberships, cinema discounts
    and more.
  - We offer hybrid working with a minimum of 2 days in the
    office. For our roles, such as Field or Home-based
    positions, different working arrangements apply - full
    details will be shared during the recruitment process.

  As an Equal Opportunity Employer, Rightmove will never
  discriminate based on age, disability, sex, race, religion
  or belief, gender reassignment, marriage / civil
  partnership, pregnancy/maternity or sexual orientation.

  At Rightmove, we believe that a diverse and inclusive
  workforce leads to better innovation, productivity, and
  overall success. We are committed to creating a welcoming
  and inclusive environment for all employees, regardless of
  their background or identity, to develop and promote a
  diverse culture that reflects the communities we serve.By
  applying, you confirm that you are aged at least 18 or over
  and that you’ve read and understood our Privacy Policy,
  which explains how we handle and protect your personal
  information during the recruitment process.
