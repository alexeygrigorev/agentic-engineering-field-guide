  The Role

  As a Staff Software Development Engineer, you play a crucial
  role in developing and supporting the cloud-native Workload
  credentials management solution within the BeyondTrust
  platform.  You will be part of a fast-paced team designing,
  developing, delivering, and maintaining a cloud-based
  software solution utilizing modern orchestration
  technologies.  This is a unique opportunity for you to step
  up as a technical leader in solving cloud-scale challenges
  and deliver a bar-raising secret management solution as part
  of our SaaS offering.

  What You’ll Do

  - Design, build, and maintain highly scalable, resilient full-
    stack platform components, services, and orchestration.
  - Deliver an outstanding user experience for complex web-based
    enterprise applications.
  - Lead and contribute to system design and provide technical
    leadership on projects of increasing complexity.
  - Review functional and technical requirements to identify
    gaps and limitations, propose simplifications, and
    communicate ideas clearly across cross-functional teams.
  - Partner with cross-functional teams, including engineering
    and non-engineering stakeholders, to drive project
    outcomes.
  - Raise the bar for delivering results and take end-to-end
    ownership both individually and as part of a team.
  - Pursue high quality relentlessly by applying engineering
    best practices.

  What You’ll Bring

  - 8+ years of experience delivering and supporting enterprise-
    ready, cloud-based systems.
  - 4+ years of professional experience with Go in production
    environments. Proficiency with C# or other object-oriented
    languages is a plus.
  - Solid understanding of modern design patterns, with the
    ability to weigh trade-offs between multiple approaches.
  - A track record of leading complex projects from start to
    finish, across design, implementation, testing, and
    release to production.
  - Excellent communication and collaboration skills for working
    effectively with cross-functional teams.
  - Experience mentoring and guiding multiple engineers on
    projects you have led.
  - Ability to influence stakeholders toward the right strategic
    decisions.
  - Experience with the full development lifecycle, including
    continuous integration and product release in an agile
    environment.
  - Expertise in cloud and SaaS development and strategy.
  - Expertise in developing API services, distributed systems,
    and scalable microservices architectures.
  - Experience with modern JavaScript frameworks, with deep
    knowledge of Angular, React, or similar.

  Nice To Have

  - Prior experience with security or secrets management
    solutions is preferred.
  - Experience with major cloud providers such as AWS, Google
    Cloud, and Azure.
  - Experience with managing services in  production and at
    scale.
  - Familarity with operations of cloud infrastructure.
  - Familiarity with unit testing frameworks and end-to-end
    testing tools such as Cypress, Playwright, or Selenium is
    a plus.
  - Experience using AI agents and harnesses in your day-to-day
    workflow.
  - Authored or contributed to popular open-source projects.

  Who You Are

  - You are a team player, eager, and open to sharing successes
    and failures.
  - You are flexible, comfortable with ambiguity, and able to
    adapt to shifting situations and requirements.
  - You take initiative to fix issues before they are assigned
    to you. You stay persistent when facing roadblocks,
    overcome them efficiently, and know how to coordinate with
    others when needed.
  - You hold high standards, continuously raise the bar, and
    drive teams to deliver high-quality products, services,
    and processes.
  - You understand software development best practices, from
    appropriate testing paradigms to effective peer code
    reviews, resilient architectures, and evolving agentic
    workflows.
  - You know how to balance speed against risk, and you make
    decisions based on data.

