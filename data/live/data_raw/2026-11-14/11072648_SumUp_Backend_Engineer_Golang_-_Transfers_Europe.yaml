description: |
  At SumUp, we empower small businesses with simple,
  affordable tools to start, run, and grow. Our Global Bank
  teams build the financial services that help merchants
  manage their money and keep their businesses moving.

  For merchants, a transfer should feel simple. Behind that
  experience is a complex network of payment schemes, banks,
  providers, messages, certificates, reconciliations, and edge
  cases—all of which need to work together reliably.

  Transfers Europe squad is the integration layer connecting
  SumUp’s internal systems with the financial networks that
  move money across Europe and the UK. We build and run the
  backend services behind SEPA and UK transfer flows, helping
  move money accurately and reliably across external networks.
  As a Backend Engineer, you’ll take ownership of services
  that process real money. You’ll work on complex systems
  problems to ensure seamless integrations as we scale, while
  seeing a direct connection between your engineering
  decisions and merchant trust. If you enjoy understanding how
  systems behave under real-world conditions while improving
  them over time, we’d love to hear from you.

  Our tech stack includes Golang, AWS, Kafka, PostgreSQL,
  Redis and Kubernetes, supported by a strong observability
  toolchain with Prometheus, Grafana, and Honeycomb. We also
  actively use AI‑assisted development tools such as Cursor,
  GitHub Copilot, and others.

  What you’ll do

  - Build and maintain production money movement backend
    services, contributing to their delivery, observability,
    and ongoing maintenance.
  - Own and deliver well‑defined tasks and features, and
    contribute to larger projects within the team’s domain.
  - Contribute to technical design and implementation, following
    established architectural patterns and best practices.
  - Improve service reliability and quality by writing tests,
    enhancing monitoring, and following established delivery
    pipelines.
  - Support the operation of the systems you work on by
    participating in on‑call rotations, incident response, and
    learning from post‑incident reviews.
  - Apply a backend and systems perspective during refinement,
    raising questions about risks, dependencies, and edge
    cases.
  - Collaborate closely with Product, QA, and other engineers to
    deliver end‑to‑end transfer and banking capabilities.

  You’ll be great for this role if you

  - Have experience building backend services in a modern
    environment and supporting them in production.
  - You are proficient in Golang and and comfortable learning
    and working with other languages as needed
  - Are comfortable working with cloud‑based systems,
    containerized workloads, and automated delivery pipelines.
  - Raise well-scoped pull requests, conduct thorough code
    reviews, and help maintain high standards of code quality
    and test coverage across the team
  - Understand the fundamentals of system architecture, data
    modelling, and API design, and are eager to deepen this
    knowledge.
  - Are curious about how your work fits into the broader system
    and product experience.
  - Communicate clearly and collaborate effectively with
    engineers, product managers, and other stakeholders.

  Any of the following would be considered a plus

  - Exposure to banking, payments, or financial systems,
    especially in regulated environments.
  - Experience supporting systems with production traffic,
    including participating in incident response.
  - Use of AI‑assisted tools to improve development speed,
    learning, or code quality.

  Why you should join SumUp

  🌎 Opportunity to work with SumUppers globally on large-scale
  fintech products used by millions of businesses worldwide,
  from our Berlin office. This involves an office-first setup

  🌈 Commitment to Diversity and Inclusion: be part of a
  workplace that values and promotes diversity, fostering an
  inclusive environment where everyone's perspectives are
  respected and embraced

  🚀 Enrolment onto our Virtual Stock Option programme: you
  will own a stake in SumUp's future success

  📚 A dedicated annual L&D budget of €2000 for your individual
  development, which can be used to attend conferences and/or
  advance your career through further education

  💶 A corporate pension scheme where we match up to 20% of
  your contributions

  🏖 Generous time off: enjoy 28 days of paid leave plus public
  holidays and special leave days

  🩺 Numerous other benefits such as Urban Sports Club subsidy,
  Kita placement assistance, subsidised office lunches

  🌴 Break4me: 1-month sabbatical after 3 years of service

  🔗 Referral Bonus: earn additional rewards by referring
  talented individuals to join the SumUp team

