description: |
  About Vercel:

  Vercel is the agentic infrastructure company, freeing people
  and agents to ship what's next. For more than a decade we've
  helped builders move from idea to production with speed,
  security, and exceptional developer experience.

  Now we're scaling our products for both agents and people to
  ship and run software, built in the open and trusted by
  OpenAI, PayPal, Ramp, Supreme, and millions of developers
  worldwide.

  About the role:

  As a Software Engineer on the Next.js team, you’ll work on
  the core of the framework, collaborating directly with the
  open-source community and delivering features to a global
  audience of developers. The team is responsible for
  advancing Next.js and its ecosystem, so developers can build
  faster, more scalable applications. You’ll work on server
  rendering, routing, bundling, performance optimization, and
  integrating emerging web standards. Your job is to keep the
  framework intuitive and stable as it evolves. This is a
  hybrid role with 3 in-office days per week in San Francisco
  or New York City.

  What you'll do:

  - Design and implement core features in Next.js, from RFC to
    release
  - Work with Vercel’s platform and runtime teams to build
    integrations between the framework and infrastructure
  - Work with the open-source community through issues, PRs,
    RFCs, and discussions
  - Optimize performance across the full stack, from server to
    browser to edge, and track emerging web standards such as
    React Server Components, Partial Prerendering, and Web
    Streams
  - Build developer tooling, docs, and examples that help others
    succeed with Next.js

  What you need:

  - 5+ years of relevant engineering experience
  - Built production web applications or frameworks with
    JavaScript, TypeScript, and React
  - Hands-on experience with web fundamentals: HTML, CSS, HTTP,
    rendering models, and caching
  - Hands-on experience with build tools such as Webpack,
    Turbopack, Babel, or SWC
  - Communicated clearly and collaborated in public, open-source
    settings

  Benefits & Compensation:

  - Competitive compensation package, including equity.
  - Inclusive Healthcare Package.
  - Learn and Grow - we provide mentorship and send you to
    events that help you build your network and skills.
  - Flexible Time Off.
  - We will provide you the gear you need to do your role, and a
    WFH budget for you to outfit your space as needed.

  The San Francisco, CA base pay range for this role is
  $196,000-$294,000. Actual salary will be based on job-
  related skills, experience, and location. Compensation
  outside of San Francisco may be adjusted based on employee
  location, and the total package includes benefits and
  equity-based compensation. Your recruiter can share more
  details during the hiring process.

  Disclosures:

  - Privacy: Please review our Job Applicant Privacy Policy for
    more information on how we handle your data.
  - Equal Opportunity: Vercel is committed to fostering and
    empowering an inclusive community within our organization.
    We do not discriminate on the basis of race, religion,
    color, gender expression or identity, sexual orientation,
    national origin, citizenship, age, marital status, veteran
    status, disability status, or any other characteristic
    protected by law. Vercel encourages everyone to apply for
    our available positions, even if they don't necessarily
    check every box on the job description.
