description: |
  Octane is unlocking the power of financial products for
  merchants and consumers. Our cutting-edge technology and
  innovative financial products empower businesses with more
  control and flexibility, enabling them to deliver seamless
  digital experiences, drive customer loyalty, and build long-
  term value.

  Octane supports merchants throughout the sales cycle:
  connecting dealerships with high-intent buyers, driving
  transparent, fast, and easy closings with award-winning
  technology, and providing on-going customer care with
  superior loan servicing.

  Founded in 2014, Octane supports over 60 OEM partner brands
  and over 4,000 dealer partners, and has a team of over 600.
  Visit www.octane.co.

  We are looking for a Senior Software Engineer to join our
  team and lead the evolution of our core products for dealer
  and lending services.

  Our platform is a mission-critical tool used by dealerships
  nationwide. By streamlining complex workflows, we empower
  partners to provide fast, flexible financing to their
  customers right when it matters most. As a key member of our
  full stack engineering team, you’ll dive into a
  sophisticated stack featuring Python, Django, React and
  PostgreSQL to build the high-performance infrastructure that
  powers these transactions.

  This isn't just about writing code; it's about engineering
  solutions. You will work alongside a passionate group of
  veteran engineers to architect scalable systems, mentor
  growing talent, and ensure our marketplace remains the gold
  standard for speed and reliability.

  Responsibilities:

  - Design high-performance systems that power a nationwide
    marketplace.
  - Build elegant, high-impact features using Python and Django.
  - Own the reliability of the stack with sophisticated
    automated testing.
  - Lead high-level code reviews and crush complex technical
    bottlenecks.
  - Partner across teams to turn ambitious product visions into
    reality.
  - Mentor rising talent and set the gold standard for
    engineering excellence.

  Requirements:

  - 5+ years of experience delivering high-impact software at
    scale.
  - Deep proficiency in at least one high-level language
    (Python, Java, C#, or JavaScript), with the versatility to
    adapt across the stack.
  - Demonstrated success in designing and implementing end-to-
    end technical solutions for complex business problems.
  - Thrives in high-trust, cross-functional environments,
    prioritizing collective success and seamless integration.
  - A proactive, solution-oriented approach with a track record
    of taking full accountability for project outcomes.
  - Ability to distill complex technical concepts into clear,
    actionable insights for both engineers and stakeholders.
  - Experience leveling up junior talent by championing
    engineering best practices and fostering a culture of
    growth.
  - Experience developing with AI systems.
  - A BS/MS in Computer Science or a related field (preferred).

  Compensation: In addition to salary, Total Rewards include
  bonus eligibility, a stock option package, and benefits as
  outlined below. The role described above offers a base
  salary of $130,000 to $170,000 + corporate bonus
  eligibility. Your offer will be based on location, the
  alignment of your qualifications with the requirements of
  the job and internal equity.

  Benefits:

  - Robust Health Care Plans (Medical, Dental & Vision)
  - Generous Parental Leave
  - Flexible Time Off (FTO) Policy - Time Off When You Need It
  - Retirement Plan (401k) with company match!
  - Educational Assistance/Tuition Reimbursement up to $3K/year
  - Life Insurance (Basic, Voluntary & AD&D)
  - Short Term / Long Term Disability
  - Robust Ancillary benefits including accident insurance,
    hospital insurance, etc
  - Wellhub (Gympass) Wellness Benefit
  - Recreational Safety Benefit

  Disclaimer:  The above statements are intended to describe
  the general nature and level of work being performed by
  associates assigned to this classification.  They are not to
  be construed as an exhaustive list of all responsibilities,
  duties, and skills required of personnel so classified.  All
  personnel may be required to perform duties outside of their
  normal responsibilities from time to time, as needed.

