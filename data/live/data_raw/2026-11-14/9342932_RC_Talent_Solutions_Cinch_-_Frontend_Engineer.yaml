description: |
  Senior Frontend Engineer – React & AI-Driven Interfaces

  Role Overview

  Cinch fosters a dynamic, collaborative culture where
  engineers take full ownership of

  their work, from design to deployment—an approach modeled
  across our engineering

  roles . As a Senior Frontend Engineer on our Core Feature
  Team, you will lead the

  modernization, evolution, and performance of our front-end
  architecture.

  Cinch is embarking on an ambitious, company-wide revamp of
  the entire front-end

  experience, providing a unique opportunity for a senior
  engineer to make an outsized

  impact on UI direction, user experience, and long-term
  technical foundations.

  You’ll collaborate closely with product, UI/UX, backend, and
  AI engineering teams to

  deliver modern, intuitive, and high-performing interfaces.
  This role combines:

   Primary ownership of our React front-end

   Leadership in architecting the new UI stack

   Designing next-generation AI-driven user experiences
  (e.g., chat-based

  interfaces, real-time interactions, agentic workflows)

  If you love crafting delightful user experiences, driving
  architectural decisions, and

  building cutting-edge interfaces—including ones powered by
  AI—this role is ideal for

  you.

  Key Responsibilities

   Lead the design, development, and modernization of Cinch’s
  React-based front

  end.

   Architect scalable UI systems, reusable components, and
  frontend frameworks

  for long-term growth.

   Drive a full front-end revamp in partnership with UI/UX
  and product teams,

  expanding on the collaborative culture shown in prior FE
  roles .

   Build high-performing, responsive, and accessible
  interfaces across the

  application.

   Develop rich, real-time interfaces using WebSockets,
  Socket.IO, and related

  technologies.

   Experience developing real-time event-driven systems and
  frontend interactions

   Create intuitive chatbot-style and AI-assisted workflows
  integrated with

  agentic backend systems.

   Collaborate with backend and AI engineers to align API
  design with UI needs.

   Explore and evaluate emerging technologies to maintain a
  modern, competitive

  UI stack.

  Qualifications

   Bachelor’s degree in computer science or related field, or
  equivalent experience.

   5+ years of professional experience developing production
  front-end applications.

   Deep expertise with React, modern JavaScript/TypeScript,
  hooks, state

  management, and component architecture.

   Experience leading large-scale UI/UX refactoring,
  redesign, or architecture

  modernization initiatives.

   Strong understanding of RESTful API integration and front-
  end performance

  optimization.

   Experience building real-time interfaces using WebSockets
  or Socket.IO

  (preferred).

   Experience designing or consuming AI/LLM-driven interfaces
  (preferred).

   Familiarity with chatbot UIs, conversational patterns, or
  streaming UI updates

  (preferred).

   Optional: Understanding of Python/Django to enable closer
  backend

  collaboration (similar to optional Python capability noted
  in prior FE role) .

   Comfortable working in a cloud-native environment using
  tools such as AWS and

  Docker.

  Skills

   Front-end expert with strong system design and
  architectural judgment.

   Ability to translate complex workflows into intuitive user
  experiences.

   Strong debugging and problem-solving skills across the UI
  stack.

   Exceptional collaboration skills, partnered closely with
  product and design teams.

   Ability to lead modernization initiatives while delivering
  high-quality features.

   Growth mindset with a passion for exploring new UI and AI
  technologies.

   Self-starter with the initiative to own and evolve the
  front-end direction of the

  product.

  Why Join Cinch?

  At Cinch, you’ll work in a cloud-native SaaS environment
  that embraces agility,

  experimentation, and innovation—echoing the engineering
  values across all Cinch roles

  .

  You’ll be part of a lean, ambitious team where your
  expertise will directly shape the

  future of our platform, influence product direction, and
  elevate the user experience for

  thousands of businesses.

  This is a rare opportunity to lead a major front-end
  transformation, build next-generation

  AI-powered experiences, and leave a lasting impact on a
  rapidly growing company.

  About Cinch

  At Cinch, we’re revolutionizing the omnichannel marketing
  industry by building the best

  marketing automation platform targeting multi-location
  businesses. Our platform

  centralizes customer data and enables personalization and
  automated outreach across

  channels—such as email, SMS, digital ads, and direct mail—to
  enhance retention and

  drive growth.

  Join us to be part of a vision that prioritizes customer
  experience and technological

  excellence.

  Compensation

  The base pay range for this role is $2,500 – $5,000 per
  month.
