description: |
  A Career with Point72’s Technology Team

  As Point72 reimagines the future of investing, our
  Technology team is constantly improving our company’s IT
  infrastructure, positioning us at the forefront of a rapidly
  evolving technology landscape. We’re a team of experts
  experimenting, discovering new ways to harness the power of
  open-source solutions, and embracing enterprise agile
  methodology. We encourage professional development to ensure
  you bring innovative ideas to our products while satisfying
  your own intellectual curiosity.

  About the Software Engineer Internship

  The Software Engineer Internship at Point72 provides
  individuals interested in pursuing a career in technology at
  an investment firm with a valuable, hands-on experience.
  During the program, you will gain exposure to:

  - Developing and enhancing software applications that support
    asset management functions, including trading systems,
    research platforms, and data analysis tools
  - Code reviews, maintaining existing codebases, and ensuring
    software scalability and integrity
  - Technologies and methodologies like AI, machine learning,
    big data, and cloud computing to solve complex problems
  - Collaborating with cross-functional teams to ensure
    technology solutions align with business goals and
    processes
  - Documenting and presenting design decisions, code, and
    functionalities to team members and stakeholders
  - Interacting with senior-level professionals
  - The fast-paced, competitive hedge fund world and industry
    best practices

  Summer Internship Program at Point72

  In addition to the learning and development you’ll receive
  in your day-to-day role with your team, as a part of our
  summer internship program you will:

  - Work alongside your fellow interns and be mentored by
    experienced professionals
  - Meet your peers through designated intern programming,
    volunteer opportunities, and social events
  - Attend sessions with senior leaders discussing their
    expertise and career paths
  - Get hands on access to the wealth of tools and resources
    that Point72 employees use every day
  - Gain exposure to groups and functions with unique
    responsibilities and perspectives on our industry
  - Develop technical, writing, and presentation skills
  - Participate in networking opportunities across the firm,
    with groups such as Trading, Finance, Trade Support,
    Compliance, and Market Intelligence

  What’s Required

  - Bachelor’s degree expected between Fall 2027 and Spring 2028
  - Strong programming skills in one or more of the following
    languages: Python, Java, C++, or similar
  - Familiarity with software development methodologies and
    tools (e.g., Git, JIRA)
  - Ability to manage multiple tasks and deadlines in a fast-
    paced environment
  - Strong attention to detail
  - Strong analytical, writing, verbal communication, and
    technical skills
  - Demonstrated ability to work cooperatively with all levels
    of the team
  - Ability and willingness to conduct yourself with
    professionalism and integrity at all times
  - Commitment to the highest ethical standards

  About Point72  Point72 is a leading global alternative
  investment firm led by Steven A. Cohen. Building on more
  than 30 years of investing experience, Point72 seeks to
  deliver superior returns for its investors through
  fundamental and systematic investing strategies across asset
  classes and geographies. We aim to attract and retain the
  industry’s brightest talent by cultivating an investor-led
  culture and committing to our people’s long-term growth. For
  more information, visit https://point72.com/.

  The annual base salary is $130,000 (USD), which will be
  prorated based on internship start and end date; this does
  not include overtime compensation. Actual compensation
  offered to the successful candidate may vary from posted
  hiring based upon geographic location, work experience,
  education, and/or skill level, among other things.
