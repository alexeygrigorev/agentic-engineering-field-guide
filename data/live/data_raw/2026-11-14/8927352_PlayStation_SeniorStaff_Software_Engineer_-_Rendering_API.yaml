description: |
  Why Sony Interactive Entertainment?

  Sony Interactive Entertainment isn’t just the Best Place to
  Play — it’s also the Best Place to Work. Sony Interactive
  Entertainment (SIE) is the company behind the PlayStation
  brand. As a subsidiary of Sony Group Corporation, we’re part
  of a proud legacy of innovation and excellence. SIE is a
  dynamic technology company, delivering cutting-edge hardware
  and network services to more than 100 million people and an
  entertainment leader, home to some of the most beloved and
  recognizable intellectual properties (IP) in the world. Our
  role at SIE is to create and nurture the experiences under
  the PlayStation brand, a name synonymous with entertainment
  excellence and creativity.

  About the Advanced Technology Group

  The Advanced Technology Group (ATG) is a part of
  Foundational Systems and Experiences Engineering (FSEE)
  within the Platform Business Group. Established over 20
  years ago as part of PlayStation®’s first-party game
  development studios, ATG has always focused on helping game
  developers get the most out of PlayStation® hardware - a
  mission that continues to this day. As a team, we are
  responsible for large parts of the graphics software stack
  used by all PlayStation® games, and collaborate with leading
  engineering teams worldwide, from game developers to
  hardware vendors, to deliver key platform technologies.

  What you’ll be doing

  - You will be working on the current and future rendering APIs
    used by PlayStation games, as well as the hardware
    underpinning them.

  - You will design and implement features that enable efficient
    game development, push GPU programming forward, and create
    a healthy platform.

  - You will observe industry trends, understanding of – and
    empathy for – our customers, and business needs as the
    foundation of your decision making.

  - You will help shape the path of the PlayStation graphics
    stack going forward.

  - You will collaborate with the platform software and hardware
    teams, as well as game developers.

  - You will often take the role as the game-developer advocate
    when working with the platform teams, or the role as the
    platform-team advocate when working with game developers.

  This is a senior position at the core of PlayStation GPU
  technology with an unusual degree of influence on future of
  console graphics-programming. ATG is granted a high degree
  of trust and autonomy in shaping the graphics software stack
  and we are looking for people who are passionate about
  carrying this forward. You will not be spending your time in
  committee meetings or writing endless proposals, this is
  very much an engineering role where your primary role is to
  determine what needs to be implemented, how best to
  implement it and to then sit down, code, debug. We believe
  that this practical focus is crucial in building up the
  skill, experience, and insight required to make the large-
  scale and long-term decisions we have been entrusted with.

  What we are looking for

  - Experience and interest in low-level graphics architecture
    and engineering.

  - Experience writing rendering code on top of multiple
    existing rendering APIs.

  - Experience writing rendering code on console.

  - The ability to keep an eye on the big picture, even when
    deep in the weeds.

  - An eagerness to learn and to take responsibility for the
    long run.

  Please note, Sony Interactive Entertainment conducts
  background checks at the offer stage for all new employees
  (which may include criminal background checks for some
  roles) and will need to process personal information to
  support these checks.

  Please refer to our Candidate Privacy Notice (where
  applicable) for more information about what personal
  information we collect, how we use it, who we share it with,
  and your data protection rights.

  Equal Opportunity Statement:

