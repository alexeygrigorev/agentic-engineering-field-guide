  orientation, pregnancy, maternity or parental status, trade
  union membership or membership in any other legally
  protected category.

  We strive to create an inclusive environment, empower
  employees and embrace diversity. We encourage everyone to
  respond.

  Sony Interactive Entertainment is a Fair Chance employer and
  qualified applicants with arrest and conviction records will
  be considered for employment.
