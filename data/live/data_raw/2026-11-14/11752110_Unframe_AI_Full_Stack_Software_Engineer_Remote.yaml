description: |
  About Unframe

  Unframe is an AI-first startup helping the world’s largest
  enterprises bring LLM-powered applications to life in days -
  not months. We combine the speed of a product company with
  the flexibility of a consultancy, helping customers move
  from idea to deployed AI systems faster than anyone else in
  the market.

  With over $100M in TCV secured within 12 months, and a new
  $50M Series B led by Highland Europe, Unframe is rapidly
  scaling globally alongside Fortune 500 customers, backed by
  Bessemer, Craft, and TLV.

  About the role:

  As a Full Stack Software Engineer, you’ll work across the
  stack to design, implement, and ship high-quality workflows
  that solve real problems for real users. You’ll collaborate
  directly with product and enterprise customers, see your
  code in production within days, and be part of a team that
  values ownership and thoughtful execution.  This role is
  Remote on the East Coast.

  What you’ll do:

  - Develop and deliver full-stack AI-powered applications on
    top of Unframe’s platform.
  - Work closely with customers and internal teams to tailor
    solutions.
  - Extend the platform and UI/UX layer as needed.
  - Collaborate with platform and research teams to integrate AI
    capabilities into production use.
  - Write clean, tested, and maintainable code.

  What we are looking for:

  - 5 + years of hands-on software-engineering experience.
  - Proven record of shipping real user-facing products end-to-
    end.
  - Proficiency with JavaScript, Node.js, Vue\React and
    PostgreSQL.
  - Strong communication skills and a product mindset.
  - Ownership mentality - comfortable taking a feature from idea
    to production.

  Nice to Have:

  - Experience working with AI or LLM-based applications.
  - Experience working with B2B or enterprise customers.

  Why join us?

  - Real ownership from day one. Drive decisions, shape ideas
    and make them work.
  - Your fastest learning years. Build alongside founders and
    VPs in a space that moves weekly.
  - You'll have the opportunity to write and build what comes
    next.
