description: |
  About Petra Labs

  Petra Labs is building the attribution and experimentation
  layer for AI search. We believe the future of commerce will
  be shaped by AI-driven information retrieval, yet most
  companies lack the infrastructure to understand and
  capitalize on this emerging growth channel. Petra Labs uses
  large-scale simulations, agentic analysis, and deeply
  embedded integrations to turn AI search from a black box
  into a measurable growth channel teams can rigorously
  optimize and allocate spend against.

  Raised $5M+ in funding from Tier-1 VCs. We work in our SoHo,
  New York office.

  Culture

  - We hire a small number of extremely talented people and give
    them as much ownership and autonomy as possible
  - We are truth-seeking. Transparent, direct discourse is
    encouraged. We challenge existing beliefs in pursuit of
    always getting better
  - We work hard and are unapologetic about the level of effort
    required to build a generational company

  What You’ll Do

  - Define and build product end-to-end. Deeply understand user
    needs to iterate on, deploy, and scale software, with
    extreme ownership
  - Operate at the frontier. We tackle ambiguous, unsolved
    problems in AI search that require running experiments to
    uncover novel insights
  - Design and build large-scale systems, data models, and
    infrastructure

  You’ll Excel in This Role If You

  - Can quickly and effectively decompose large, ambiguous
    problems and systems
  - Have built real products before and are comfortable owning
    large technical surfaces
  - Have strong fundamentals in system design and databases,
    with good judgment around when to move fast versus build
    for scale

  Process

  1. Hiring Manager Screen

  2. Technical Interview

  3. Technical Interview

  4. On-Site Interview
