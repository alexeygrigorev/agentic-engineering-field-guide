  Job Title: Front End Developer

  Duration: 12 Months

  Location: New York, NY Job Description: Project/Role
  summary: Global Markets Risk Reporting application - to
  serve ad-hoc business reporting and data analytics requests,
  system status and data quality controls monitoring,
  operational process management We are looking for a strong
  Web application developer to join our project team to drive
  design and implementation of a strategic user facing
  applications space. Initial efforts will focus on building a
  desktop support in several phases starting with the
  dashboard functionality and then core business data
  reporting. Main duties will include designing user interface
  and Restful API end points, setting up web server
  environment, building modules and components into a
  functional application communicating with the API using JSON
  over HTTP and subscribing to pub/sub topics for real time
  updates. This role involves working on the larger team
  responsible for the front to back development, providing
  expertise and assisting others getting up to speed with web
  based application technologies and best practices. Ideal
  candidate would be a strong problem-solver able to operate
  independently with minimal supervision, team player, quick
  learner and passionate about new Web technologies, work well
  under pressure meeting aggressive deadlines while delivering
  quality software Job requirements

  - In-depth understanding of Web applications architecture,
    technologies, and development best practices
  - Solid background building complex mission critical web
    applications incorporating dynamic web front ends with
    graphs/charts using AngularJS (1.x or 2), React,
    Javascript, HTML5
  - Experience integrating real time messaging technologies such
    as Kafka or AMPS into web applications
  - Working knowledge of Restful API, Web servers such as
    Tornado or Apache, Web socket technologies, Python, and
    Hadoop/Spark are a big plus
  - Prior banking industry web applications experience
    supporting trading/risk management functions very helpful

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
