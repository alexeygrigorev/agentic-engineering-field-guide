description: |
  About Taskrabbit:

  Taskrabbit is a marketplace platform that conveniently
  connects people with Taskers to handle everyday home to-
  do’s, such as furniture assembly, handyman work, moving
  help, and much more.

  At Taskrabbit, we want to transform lives one task at a
  time. As a company we celebrate innovation, inclusion and
  hard work. Our culture is collaborative, pragmatic, and
  fast-paced. We’re looking for talented, entrepreneurially
  minded and data-driven people who also have a passion for
  helping people do what they love. Together with IKEA, we’re
  creating more opportunities for people to earn a consistent,
  meaningful income on their own terms by building lasting
  relationships with clients in communities around the world.

  Taskrabbit is a hybrid company with employees distributed
  across the US and EU and a Built In — Best Places to Work
  (2022, 2023, 2024, 2025) continually ranked across multiple
  national and regional categories. Join us at Taskrabbit,
  where your work will be meaningful, your ideas valued, and
  your potential unleashed!

  This role operates on a hybrid schedule requiring two days
  of in-office collaboration per week.

  About the Role

  Reporting to the Infrastructure Director of Engineering, you
  are a pragmatic security leader who acts as a business
  enabler rather than a gatekeeper. You thrive in a high-
  velocity, non-regulated environment where you must define
  "what good looks like" from scratch and drive security
  progress with a blend of strong planning skills and strong
  cross-functional partnerships.

  You are a technical player-coach who manages the "how"
  behind engineering initiatives, providing direct guidance to
  a lean team which needs to navigate trade-offs between
  quality, depth, and delivery volume. You are just as
  comfortable planning core initiatives as you are writing a
  proposal for security program improvements. You have a
  proven track record of seamlessly integrating security
  controls within the Software Development Life Cycle (SDLC).
  Above all, you are a data-oriented communicator who uses
  relationship building to hold our security bar to a high
  standard for our customers and partners.

  What You'll Work On:

  - Lead and develop a team of security engineers, acting as a
    technical player-coach to manage deliverables, mentorship,
    and continuous learning. Lead the team through
    prioritization and tradeoffs to determine which
    initiatives provide the most meaningful impact.
  - Integrate foundational security tooling and automation
    across data, infrastructure, and application layers
    working closely with engineering teams, IT, corporate
    security, legal and compliance.
  - Develop data-driven security strategies, including OKRs,
    KPIs, and roadmaps, using clear written communication to
    advocate for security priorities during cross-functional
    planning.
  - Achieve compliance with security frameworks (e.g. CIS, SOC2,
    GDPR), designing sustainable controls in partnership with
    internal teams.
  - Lead pragmatic incident response efforts, focusing on
    investigation and resolution while continuously maturing
    our response plans and threat modeling.
  - Develop and implement security-related AI and machine
    learning solutions, ensuring safe adoption while
    mitigating associated risks.
  - Drive cultural change through education, acting as a
    security evangelist to help cross-functional partners
    understand risk and own security within their respective
    domains.
  - Govern the Security Engineering Program, developing high-
    quality proposals and recommendations that align security
    decisions with Taskrabbit’s innovative business goals.

  Your Areas Of Expertise:

  - 5+ years of experience building and managing security teams
    in an agile, high-growth environment.
  - Proven track record working within copliance frameworks
    (e.g., developing secure software in a SOC2 or GDPR
    compliant environment).
  - Experience implementing a security framework from scratch is
    a plus.
  - Strong technical "Player-Coach" ability, with the comfort
    level to dive into technical initiatives and provide
    direct guidance to security engineers.
  - Exceptional written and verbal communication skills, with a
    knack for telling the "story" of security through formal
    proposals, strategies, and risk presentations.
  - Pragmatic Risk Management: Ability to handle moderate risk
    tolerance by focusing on business impact and customer
    trust rather than theoretical perfection.
  - Analytical and data-oriented mindset, with experience
    designing metrics and KPIs that demonstrate the business
    value of security initiatives.
  - Expertise in influence-based leadership, showing a history
    of driving security maturity in non-regulated industries
    through relationship building and alignment.
  - Deep knowledge of modern AI-assisted secure software
    development and deployment practices, including cloud
    security, data security, and integrating security controls
    within the SDLC with experience leading incident response.
  - Experience with security governance for AI/ML systems and a
    proactive approach to managing the risks inherent in
    emerging technologies.
  - Experience with security tooling implementation: Direct
    experience implementing or leading the implementation of
    comprehensive security tooling

  Compensation & Benefits:

  At Taskrabbit, our approach to compensation is designed to
  be competitive, transparent, and equitable. Total
  compensation consists of base pay + bonus + benefits +
  perks. The base pay range for this position is $155,000 -
  $210,000. This range is representative of base pay only, and
  does not include any other total cash compensation amounts,
  such as company bonus or benefits. Final offer amounts may
  vary from the amounts listed above and will be determined by
  factors including, but not limited to, relevant experience,
  qualifications, geography, and level.

  You’ll love working here because:

  - Taskrabbit is a Hybrid Company. We value flexibility and
    choice but also stay committed to regular in-person
    connection.
  - The People. You will be surrounded by some of the most
    talented, supportive, smart, and kind leaders and teams --
    people you can be proud to work with!
  - The Diverse Culture. We believe that we make better
    decisions when our workforce reflects the diversity of the
    communities in which we operate. Women make up half of our
    leadership team and our diversity representation is above
    that of the tech industry average.
  - The Perks. Taskrabbit offers our employees with employer-
    paid health insurance and a 401k match with immediate
    vesting for our US based employees. We offer all of our
    global employees generous and flexible time off with 2
    company-wide closure weeks, Taskrabbit product stipends,
    wellness + productivity + education stipends, IKEA
    discounts, reproductive health support, and more. Benefits
    vary by country of employment.

  Taskrabbit’s commitment to Diversity and Inclusion:

  An Active Commitment to Equity within our Company and
  Platform. We are an inclusive community where all who share
  our mission and values belong. Our diverse team represents
  the communities we serve, breaking down systemic barriers,
  and transforming lives- one action at a time.

  Taskrabbit is an equal opportunity employer and values
  diversity at our company. We do not discriminate on the
  basis of race, religion, color, national origin, ancestry,
  citizenship, sex, gender, gender identity, sexual
  orientation, age, marital status, military/veteran status,
  or disability status. Taskrabbit is committed to working
  with and providing reasonable accommodation to applicants
  with physical and mental disabilities. Taskrabbit will
  consider for employment all qualified applicants with
  criminal histories in a manner consistent with applicable
  law.

  AI-Assisted Prescreening Notice [US Based Candidates Only]:
  As part of our hiring process, we may use artificial
  intelligence tools to assist with the initial prescreening
  of applications and responses. This tool does not make
  hiring decisions — every application and response is
  reviewed by a member of our recruiting team to determine fit
  for the role. If you would prefer not to have your
  application processed using this tool, you may opt out by
  selecting 'opt out' in the application form or by emailing
  talentacquisition@taskrabbit.com, and your application will
  be reviewed manually with no impact on your candidacy.
