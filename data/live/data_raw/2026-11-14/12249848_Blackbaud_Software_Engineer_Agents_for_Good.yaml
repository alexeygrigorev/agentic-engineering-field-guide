description: |
  About the role:

  As a Staff Software Engineer in AI on the Agents for Good
  team, you'll help build Blackbaud's agentic products and the
  frameworks that power them. You'll work independently on
  well-scoped problems, contribute to the design of new agent
  capabilities, and grow your skill in applying AI-native
  development practices to ship faster and with higher
  quality.

  What you'll be doing:

  - Build and ship features for Blackbaud's AI agents (e.g.,
    Development Agent, Data Health Agent) and the shared agent
    framework used to create new agents

  - Design, build, and maintain scalable, well-tested code
    across the stack

  - Apply AI-native development practices using tools like
    Claude Code to move through the Build phase of Blackbaud's
    AI-native PDLC (Plan, Code, Verify) and help refine those
    practices for the team

  - Partner with Senior and Principal engineers to translate
    product requirements into technical designs

  - Write and maintain automated tests, and participate actively
    in code review

  - Troubleshoot and resolve issues in existing agent features
    and services

  - Contribute to internal documentation and onboarding
    materials for the AFG framework

  - Continuously learn and apply emerging AI/LLM techniques to
    your work

  What we'll want you to have:

  - 2+ years of software engineering experience

  - Working knowledge of .NET Core, C#, and modern web
    technologies

  - Experience with Angular, JavaScript/TypeScript, CSS, and
    HTML

  - Exposure to building or integrating LLM-powered features
    (prompting, RAG, agent orchestration) is a plus

  - Comfort using AI-assisted development tools (e.g., Claude
    Code) as part of your daily workflow, or strong interest
    in adopting them

  - Familiarity with RESTful API development and cloud platforms
    (Azure preferred)

  - Strong communication skills and a collaborative, growth-
    oriented mindset

  Stay up to date on everything Blackbaud, follow us on
  Linkedin, Twitter, Instagram, Facebook and YouTube

  Blackbaud powers social impact through purpose‑driven
  technology and responsible AI. Guided by our Intelligence
  for Good® vision, we’re building a culture where innovation,
  trust, and human expertise come together to help
  organizations make a greater difference in the world.

  Blackbaud is proud to be an equal opportunity employer and
  is committed to maintaining a diverse and inclusive work
  environment. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, gender, gender identity or expression, sexual
  orientation, national origin, physical or mental disability,
  age, or veteran status or any other basis protected by
  federal, state, or local law.

  The starting base pay is $87,700.00 to $114,200.00.
  Blackbaud may pay more or less based on employee
  qualifications, market value, Company finances, and other
  operational considerations.

  Benefits Include:

  - Medical, dental, and vision insurance
  - Remote-flexible workforce
  - Wellness Programs
  - 401(k) program with employer match
  - Flexible paid time off
  - Generous Parental Leave
  - Donations for Doers
  - Pet insurance, legal and identity protection
  - Tuition reimbursement program
