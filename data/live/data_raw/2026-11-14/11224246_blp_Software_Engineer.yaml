description: |
  Join BLP and help make the world’s business processes
  autonomous!

  Our agentic platform helps finance and operations teams
  worldwide remove manual work from their core business
  processes, so work runs end-to-end with greater control and
  significant productivity gains.

  Today, over 550 enterprise customers use BLP across 1,300+
  deployed projects. In the processes we automate, customers
  achieve productivity improvements of 5 to 10 times.

  To date, BLP remains majority employee-owned, with Goldman
  Sachs holding a minority stake as a growth investor. Our
  success is driven by deep expertise in technology and
  business processes, a superior product with strong product-
  market fit, reflected in an expanding customer base that
  includes Fortune 500 companies.

  BLP is one of Switzerland's fastest-growing SaaS scale-ups;
  we are now entering our next phase of growth. From our
  headquarters on Zürich's Bahnhofstrasse, we're expanding
  globally, with a growing presence across Europe and North
  America.

  Join us and help make autonomous operations the new
  standard.

  About the role

  At blp, we create cutting-edge products for automated
  document processing. We have dedicated engineering teams for
  each product. The teams fully own their product, that means
  we understand the business problem that our product solves
  and own the roadmap how the product evolves.

  We have a strong sense of end-to-end ownership and a desire
  to have direct impact by solving real world problems. As a
  team, we also strive to own and shape how we work together
  and how we grow, both as individuals and as a team.



  What you'll do

  - Drive Impact: Collaborate with business stakeholders to
    understand requirements and translate them into possible
    improvements to our product.
  - Build Great Software: Design and develop clean,
    maintainable, and high-quality software, applying a wide
    range of principles including functional patterns. Conduct
    code reviews and contribute to a culture of technical
    excellence.
  - Lead and Influence: Guide technical direction for major
    initiatives, shape how the product evolves and mentor team
    members along the way.
  - Promote Innovation and Collaboration: Work closely with
    colleagues, share what you learn openly, and continuously
    improve processes, tools, and team practices.
  - The Tech Stack for this role includes Golang, MySQL, Docker
    images deployed on a Kubernetes cluster in our cloud
    infrastructure (GCS, AWS or Azure) and Github CI/CD.



  What you'll bring

  - Bachelor's or Master's degree in Computer Science or
    equivalent practical experience.
  - 3+ years of experience in a software engineering role.
  - Passionate about software craftsmanship: Strong
    understanding of software development principles, Clean
    Code and Clean Architecture.
  - Product thinking: Ability to translate business problems
    into precise requirements, specifications and ultimately
    into code.
  - Entrepreneurial mindset: link your daily work to team and
    company goals, balance cost and benefit, deliver high-
    quality solutions efficiently.
  - Ownership: take responsibility for your technical work, for
    the product we build and the team we shape.
  - Team-oriented: proactively support team goals, close gaps.
  - Abstraction and efficient communication: simplify complex
    systems, identify core concepts, communicate complex ideas
    to different stakeholders.



  What you'll get

  - Full ownership. You own the product's roadmap, from business
    problem to shipped code.
  - End-to-end impact. You're on a team that owns what it
    builds, start to finish.
  - A modern, varied tech stack. Continuous learning as the
    platform scales.



  Learn more about blp and our values at
  blp.digital/company/careers.

  Please note:

  London - hybrid, wider UK - remote

  Zurich: Onsite

  Europe: Remote
