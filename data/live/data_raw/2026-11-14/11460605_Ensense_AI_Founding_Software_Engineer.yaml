description: |
  About Ensense

  Ensense AI is building the next generation of Physical AI.
  Our mission is to bring transparency to public places
  through scalable sensing and software innovations that
  empower people, organizations, and government to make better
  decisions.

  We are building a Physical Intelligence Layer over streets
  that is continuously updating, captured through innovative
  multimodal sensing and transformed into actionable
  intelligence by advanced spatiotemporal AI systems. Our work
  spans the full stack from sensing to intelligence, enabling
  a new class of real time environmental, safety, and
  infrastructure insights.

  Ensense AI is a high caliber, early stage team of engineers,
  scientists, and operators who value curiosity, engineering
  precision, and measurable impact. Every team member is hands
  on and directly responsible for defining and advancing the
  state of the art in Physical AI.

  About the Role

  We are looking for a Founding Full Stack Engineer to join
  Ensense AI at a pivotal moment. You will work directly with
  the founders to design, build, and scale the core platforms
  that power our multimodal sensing and intelligence systems.
  This role is ideal for someone who thrives in early stage
  environments, enjoys solving complex technical problems, and
  wants meaningful ownership across the stack. Your work will
  directly shape the foundation of our product and the
  engineering culture of the company.

  Responsibilities

  - Design and build production quality backend systems that
    ingest, process, and serve multimodal sensor, audio,
    video, and environmental data
  - Build APIs, services, and infrastructure that support data
    pipelines and model development and inference
  - Develop applications that enables users to interact with our
    AI models
  - Implement best practices in reliability, scalability, and
    data integrity
  - Help define code standards, and long term engineering
    strategy
  - Contribute to a culture of engineering excellence,
    ownership, and speed

  Required Qualifications

  - B.Sc. in computer science or a related technical field
  - 2+ years of professional experience with a strong record of
    shipping
  - Strong proficiency in modern backend development using
    Python or Go
  - Proficiency with relational databases such as Postgres
  - Proven expertise in databases technologies including schema
    design, query optimization, indexing, and performance
    tuning
  - Experience building cloud based systems on AWS or GCP
  - Ability to design APIs, data models, and scalable service
    architectures
  - Experience working with modern MLOPs practices
  - Strong problem solving and comfort working in fast paced
    environments
  - Clear and concise communication skills

  Preferred Qualifications

  - Interest in Physical AI, smart infrastructure, or urban
    systems
  - Background in early stage startups or experience as an early
    technical hire
  - Experience with real time or streaming data systems
  - Experience with geospatial data, mapping frameworks, or
    location data
