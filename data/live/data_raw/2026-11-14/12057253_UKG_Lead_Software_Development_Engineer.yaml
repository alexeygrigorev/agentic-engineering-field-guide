description: |
  Why UKG:

  At UKG, the work you do matters. The code you ship, the
  decisions you make, and the care you show a customer all add
  up to real impact. Today, tens of millions of workers start
  and end their days with our workforce operating platform.
  Helping people get paid, grow in their careers, and shape
  the future of their industries. That’s what we do.

  We never stop learning. We never stop challenging the norm.
  We push for better, and we celebrate the wins along the way.
  Here, you’ll get flexibility that’s real, benefits you can
  count on, and a team that succeeds together. Because at UKG,
  your work matters—and so do you.   ROLE OVERVIEW We are
  seeking an experienced Dynamics 365 Technical Resource to
  lead configuration and customization efforts for our Mergers
  & Acquisitions initiatives. This role is critical to
  ensuring seamless business process integration, data
  consolidation, and system optimization during M&A
  activities. The ideal candidate will bridge the gap between
  business requirements and technical implementation, managing
  both configuration work and coordination with development
  teams for custom object development. Duties and
  Responsibilities:

  Business Process Configuration & Analysis ● Analyze current
  business processes and translate M&A requirements into
  Dynamics 365 configurations ● Configure entities, fields,
  forms, views, business rules, and workflows to support
  merged entity operations ● Document as-is and to-be business
  processes in collaboration with business stakeholders
  Stakeholder Collaboration & Requirements Gathering ● Work
  directly with business teams, finance, HR, operations, and
  sales to understand M&A process requirements ● Facilitate
  workshops and requirement-gathering sessions ● Communicate
  technical capabilities and constraints to non-technical
  stakeholders Hands-On Configuration & Customization ●
  Execute configuration in Dynamics 365 including data models,
  security roles, and field-level security ● Build forms,
  views, business process flows, and automated workflows ●
  Configure and manage integrations with related systems ●
  Implement power automate flows and canvas/model-driven app
  configurations as needed Developer Coordination & Custom
  Development ● Identify requirements that exceed standard
  configuration capabilities ● Create detailed technical
  specifications for custom object development and plugins ●
  Collaborate with development team on solutions architecture
  and code reviews ● Validate developed solutions meet
  business requirements ● Support testing and deployment of
  custom code solutions Data Migration & Integration ● Plan
  and execute data migration strategies for M&A scenarios ●
  Configure and validate data integrations between legacy and
  target systems ● Perform data quality assessments and
  remediation ● Document data mapping and transformation logic
  Testing, Training & Deployment ● Design and execute system
  testing protocols ● Develop training materials and conduct
  end-user training sessions ● Manage change management and
  user adoption strategies ● Support go-live and post-
  implementation stabilization Documentation & Best Practices
  ● Maintain comprehensive technical documentation of
  configurations ● Ensure adherence to Dynamics 365 and
  organizational best practices ● Create and maintain
  configuration decision logs and design documents Basic
  Requirements

  ● 7+ years of hands-on experience with Microsoft Dynamics
  365 configuration and customization ● 3+ years of experience
  working on Mergers & Acquisitions or system consolidation
  initiatives ● Proven expertise in configuring Sales,
  Service, or Finance & Operations modules within Dynamics 365
  ● Experience building and optimizing business process flows,
  workflows, and automated processes ● Demonstrated ability to
  work effectively with development teams and understand
  custom code implementations ● Strong background in data
  migration and integration between systems ● Experience with
  Power Platform (Power Automate, Power Apps) preferred ●
  Exposure to API integrations and custom plugin/extension
  development concepts ● Track record of successful end-to-end
  project delivery in complex environments Preferred
  Qualifications

  ● Microsoft Certified: Dynamics 365 Fundamentals or higher
  certification ● Experience with Dynamics 365 Finance &
  Operations (ERP) consolidation scenarios ● Background in
  business process re-engineering or continuous improvement
  initiatives ● Hands-on experience with custom plugin
  development or C# coding ● Experience with third-party
  Dynamics 365 extensions and solutions ● Background in
  enterprise resource planning (ERP) or CRM implementations ●
  Experience mentoring junior consultants or technical staff

  Technical Competencies ● Dynamics 365 Configuration:
  Entities, attributes, relationships, forms, views, business
  rules, business process flows, workflows ● Data Management:
  Data import, export, duplication detection, duplicate
  records management, data quality frameworks ● Integration:
  API fundamentals, integration patterns, Power Automate cloud
  flows, connector configuration ● Development Concepts:
  Understanding of JavaScript, C#, plugin architecture, and
  solution packaging ● Power Platform: Power Apps (model-
  driven and canvas), Power Automate, Power BI integration ●
  Office 365 & Azure: Basic familiarity with cloud
  architecture, Azure Active Directory, Microsoft 365
  integration ● Advanced Find & Reporting: Query design,
  FetchXML, Power BI report creation and embedding Soft Skills
  ● Strong communication skills - ability to explain technical
  concepts to non-technical stakeholders and business
  requirements to developers ● Excellent problem-solving and
  analytical capabilities ● Detail-oriented with strong
  documentation practices ● Self-motivated and ability to
  manage multiple workstreams simultaneously ● Adaptability to
  rapidly changing requirements common in M&A environments ●
  Collaborative mindset with ability to build consensus across
  diverse stakeholder groups ● Project management fundamentals
  - comfortable with Agile and Waterfall methodologies ●
  Proactive approach to professional development and staying
  current with Dynamics 365 updates Success Metrics ● On-time
  delivery of configured solutions aligned with project
  milestones ● Zero-defect configuration implementations post
  go-live ● Business requirement satisfaction - measured
  through stakeholder feedback and sign-offs ● Effective
  collaboration with development team resulting in quality
  custom solutions ● High user adoption rates following
  training and go-live ● Comprehensive documentation of all
  configurations and decisions ● Proactive identification and
  mitigation of technical risks Company Overview:

  UKG is the Workforce Operating Platform that puts workforce
  understanding to work. With the world's largest collection
  of workforce insights, and people-first AI, our ability to
  reveal unseen ways to build trust, amplify productivity, and
  empower talent, is unmatched. It's this expertise that
  equips our customers with the intelligence to solve any
  challenge in any industry — because great organizations know
  their workforce is their competitive edge. Learn more at
  ukg.com.

