description: |
  About the job:

  Kent is looking for a Manager, Process Safety Engineering to
  manage its Process Safety team.

  The ideal candidate will have a P.E. license and minimum of
  10 years of experience in a management role and a minimum of
  20 years of experience in providing process safety services
  to the onshore and offshore Oil & Gas sectors, including
  extensive experience providing Process Safety services in
  the Gulf of America / Gulf of Mexico.

        Skills and Responsibilities:

  Responsibilities:



  - Leading and managing a team of Process Safety Engineers.
  - Process Safety Subject Matter Expert (SME), providing
    advice, guidance, and support ensuring project goals are
    met.
  - Ensuring all work product is prepared in accordance with
    Kent’s quality control procedures, and industry/regulatory
    requirements.
  - Building and maintaining positive relationships with
    clients, addressing their needs, and ensuring their
    satisfaction with the services provided, leading to
    repeat/new opportunities for the business.
  - Keeping up to date on new engineering processes, techniques,
    trends, AI technology, and standards ensuring that
    effective methods and design/engineering techniques are
    used.
  - Participating and representing the organization as needed in
    outside associations, conferences, and symposiums.
  - Mentoring and developing the team at all levels, fostering a
    collaborative and supportive team environment.
  - Developing CTRs and proposals including preparing and
    qualifying Process Safety engineering scopes of work,
    budget, and schedule for business opportunities.
  - Working closely with other disciplines in the execution of
    multi-disciplinary scopes with Technical and Process
    Safety oversight. Examples include – working with Process
    Engineering and Structural engineering disciplines for
    various consequence analyses (Design Accidental Load (DAL)
    input for advanced structural response analyses, Blowdown
    and ESD scenarios etc).
  - Identifying and communicating potential spinoff
    opportunities for other engineering disciplines,
    leveraging the early engagement of the process safety team
    in projects.
  - Networking with counterparts in other Kent regions to
    support inter-company resourcing needs.
  - Participating in business development activities including
    preparing capability presentations and marketing Kent’s
    services to potential clients.
  - Participating and actively supporting recruiting efforts to
    help grow the Process Safety business.
  - Championing implementation of Kent Business strategy.




  In addition to the responsibilities listed herein, the
  employee may be required to perform other ad-hoc tasks as
  needed or directed by the supervisor or management. These
  tasks will be within the reasonable scope of the employee's
  skills, capabilities, and role within the organization. The
  intent of this provision is to allow for flexibility and
  adaptability in meeting the dynamic needs of the
  organization, ensuring that operational requirements can be
  met efficiently. All such tasks will be assigned considering
  the employee's current workload and with respect to their
  professional development.




         Your knowledge/skills, education, and experience:

  Knowledge/ Qualification/ Training/ Certification:



  - A Bachelor’s degree in Chemical Engineering is desired
    (other disciplines will be considered based on
    experience); a Master’s degree or higher is preferred.
  - P.E. license with the Texas State Board is required or can
    be obtained within 6 months.
  - A minimum ten (10) years of experience as a Lead Engineer in
    mid to large size projects is desired with a strong
    background in managing projects and teams.
  - Brownfield, greenfield, onshore, and offshore project
    experience is required.
  - Design and construction knowledge is desired.
  - Experience with commonly used industry codes and standards
    including but not limited to API, DNV, ASME codes and
    industry good practices.
  - Experience in advanced analysis modelling techniques
    including CFD.
  - Experience in contributing Process Safety content to a
    single or multi-discipline basis of design is desired.
  - Software – PHAST, PHA-Pro for HAZOP and LOPA, and other
    standard Engineering software.
  - Proficient in MS Office (Excel and Word).
  - Technical competence in risk identification, risk assessment
    and risk management methodologies.
  - Demonstrated strong skills in one or more of the following:



              o Integrating process safety within the design
  process and/or operating practices



              o PHA facilitation (HAZID, HAZOP, LOPA, SILA,
  etc)



                 o Consequence and frequency analyses



              o Fault / Event Tree Analysis



              o Quantitative Risk Assessment (QRA)



              o Authoring Safety Cases, including ALARP
  demonstrations



              o Bow Tie Analysis



  • Experience in a client-facing role, showing an
  understanding of the commercial challenges relevant to an
  engineering consultancy business.











  Communication:



  - Excellent verbal and written communication skills, with the
    ability to effectively collaborate with team members,
    clients, and other stakeholders.







  Behavior/ Core Competencies:



  • Excellent problem-solving skills and ability to provide
  advice on technical issues both externally and internally.



  • Excellent report writing and presentation skills.



  • A co-operative and helpful attitude toward both colleagues
  and clients with demonstrated experience in mentoring of
  more junior resources.



  • A strong drive and willingness to continue learning from
  clients and colleagues.



  • Confident in selling services, preparation of proposals
  and cost estimates for studies and winning work.



  • Adaptable to changing working hour requirements as needed
  to accommodate project work and client needs in other time
  zones.



  • Flexible in work location as needed (Kent office, client’s
  office).



  • Strong leadership and organizational skills, with the
  ability to motivate and manage a team effectively.







  HSSEQ:



  The Employee shall observe the Health, Safety,
  Sustainability, Environment and Quality rules of the
  Company; it’s clients and the governing authorities of the
  host country.


