description: |
  Aescape is a body intelligence company delivering Adaptive
  Body Therapy, powered by physical AI and robotics. Each
  session listens to your body and adapts to it in real time,
  releasing the tension that builds from work, training,
  travel and everyday life. Members choose their focus, adjust
  pressure as they go, and see results build with consistent
  use. Every table evolves through over-the-air software
  updates, so the experience keeps getting better. Find
  Aescape at 150+ leading fitness, hospitality and wellness
  destinations across the US. Aescape is headquartered in New
  York and is backed by Valor Equity Partners, BroadLight
  Capital and Mecha Ventures, alongside seven-time Super Bowl
  champion Tom Brady, an investor and strategic partner.

  Aescape is looking for a Senior Frontend Engineer that will
  work directly with a stellar team to help build the software
  that connects people with our frontier robotics capabilities
  — and shape how we deliver world-class experiences on one of
  the most technically ambitious platforms in wellness. This
  is an amazing opportunity to drive product quality at every
  layer of the stack as we revolutionize the recovery
  industry. If this sounds like you, we'd love to hear from
  you!

  This role is hybrid, based out of our NYC office in Chelsea.

  What You’ll Do

  As a Senior Frontend Engineer at Aescape, you will:

  - Own the core interface (Kotlin / Android) between our robot
    and our customers, working closely with UX Designers and
    Robotics experts to set the standard for communicating
    body intelligence insights and enable smooth bodywork
    sessions.
  - Collaborate with our robotics and backend engineers to
    translate hardware telemetry into actionable interfaces
    (React/Next.js webapps) for our partners and support
    staff.
  - Integrate tightly with our Go microservices backend, owning
    the full request lifecycle from API contract through to
    user-facing state.
  - Enforce best practices in code quality, testing, and
    architecture across the frontend codebase.
  - Contribute to platform decisions about state management,
    navigation, component systems, and CI/CD pipelines.
  - Champion appropriate use of modern coding tools such as AI-
    assisted development and automated testing to enable the
    entire engineering team to collaborate on the product.

  What You’ll Bring

  - Demonstrated proficiency building production Kotlin mobile
    applications, ideally with JetPack Compose & Gradle.
  - Demonstrated proficiency with modern UX application patterns
    (component libraries, form validation, data fetching,
    SSR).
  - Solid understanding of REST API integration patterns,
    authentication flows, and client-side state management.
  - Experience with mobile release pipelines, CI/CD automation,
    and multi-environment deployment processes.
  - Bias toward action — iteratively shipping to production,
    owning quality from commit to customer.
  - Ability to work on-site (hybrid 3 days/week negotiable) in
    our NYC office.

  Bonus / Nice to Have

  - Cross-Platform & Web Exposure: Experience with or
    willingness to contribute to:
    - Flutter / Dart (used in our member booking and session
      insights app)
    - React, Next.js, and TypeScript (used in our internal
      administrative and partner tooling)
  - Backend Systems: Familiarity with Go microservices or a
    willingness to dive in and debug backend endpoints.
  - Interactive Visualization: Familiarity with C# / Unity or
    real-time 3D graphics (used in our internal massage
    trajectory visualization tooling).
  - Hardware & Dedicated Devices: Prior experience building
    software for dedicated kiosks, custom tablets, IoT
    devices, or interfacing with robotics (e.g., ROS2).

  What’s In It For You

  - Join a trailblazing robotics and AI company building the
    future of recovery
  - The chance to make a difference with a product that empowers
    healthier and happier living
  - Team culture driven by passion, ambition, empowerment,
    inclusion, curiosity, and fun!
  - 100% employer-paid healthcare coverage for employees with
    generous coverage for eligible dependents
  - Flexible time off
  - Quarterly Wellness Days - everyone fully unplugs
  - Generous parental leave
  - Complimentary OneMedical membership
  - 401(k) with employer matching
  - Home office budget
  - Annual stipend for professional development
  - Working late? Dinner is on us
  - Complimentary Aescape recovery sessions for yourself,
    friends & family

  Compensation: Base salary range of $160,000 - $200,000
  annually, plus 10% discretionary annual bonus, plus equity
  grant commensurate with the role and company stage. Full-
  time employees are also eligible for our comprehensive
  benefits package, including medical, dental, and vision
  coverage, 401(k), paid time off, and paid parental leave.

  Equal Opportunity Employer

  Aescape is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, age, disability, veteran status, or any
  other characteristic protected by applicable law. The salary
  range listed above is a good-faith estimate provided in
  accordance with New York City's pay transparency law.



  Join Aescape

  We’re building a new category: body intelligence, delivered
  through Adaptive Body Therapy. We’re looking for people who
  are driven, resourceful and eager to learn, who bring
  different perspectives, and who care about work that makes a
  real difference for the people we serve. If that sounds like
  you, we’d like to hear from you.



  Listen. Release. Repeat.
