description: |
  About Formation Bio

  Formation Bio is a tech and AI driven pharma company
  differentiated by radically more efficient drug development.

  Advancements in AI and drug discovery are creating more
  candidate drugs than the industry can progress because of
  the high cost and time of clinical trials. Recognizing that
  this development bottleneck may ultimately limit the number
  of new medicines that can reach patients, Formation Bio,
  founded in 2016 as TrialSpark Inc., has built technology
  platforms, processes, and capabilities to accelerate all
  aspects of drug development and clinical trials. Formation
  Bio partners, acquires, or in-licenses drugs from pharma
  companies, research organizations, and biotechs to develop
  programs past clinical proof of concept and beyond,
  ultimately helping to bring new medicines to patients. The
  company is backed by investors across pharma and tech,
  including a16z, Sequoia, Sanofi, Thrive Capital, John Doerr,
  Spark Capital, SV Angel Growth, and others.

  You can read more at the following links:

  - Our Vision for AI in Pharma
  - Our Current Drug Portfolio
  - Our Technology & Platform

  At Formation Bio, our values are the driving force behind
  our mission to revolutionize the pharma industry. Every team
  and individual at the company shares these same values, and
  every team and individual plays a key part in our mission to
  bring new treatments to patients faster and more
  efficiently.

  About the Position

  As a Senior Software Engineer at Formation Bio, you will
  build high-leverage software across the org. You will turn
  ambiguous problems into products and systems that help
  people, applications, AI Enabled Employees, and Agents make
  better decisions and move faster.

  This is an AI-native engineering role. You use modern AI and
  agentic development tools as a core part of how you explore,
  build, test, and operate software. You will also help create
  software that incorporates AI responsibly, with the
  interfaces, data access, evaluation, and operational
  controls needed to make these systems useful in practice.

  Our products and priorities evolve quickly as we learn. You
  will be expected to make progress with incomplete
  information, identify the highest-value path forward,
  communicate tradeoffs clearly, and reorient quickly when new
  information changes the priority. This role has a backend
  and systems center of gravity. We value full-stack range,
  with a primary focus on backend, systems, product, and AI
  engineering.

  Responsibilities

  - Own meaningful product or platform outcomes from problem
    definition through design, implementation, launch, and
    iteration.
  - Build and operate production services, APIs, integrations,
    databases, asynchronous workflows, and distributed
    systems.
  - Build software for people, applications, AI Enabled
    Employees, and Agents, including the tools, APIs,
    permissions, state, observability, and failure handling
    required for reliable use.
  - Design and ship AI-enabled and agentic workflows, including
    tool use, retrieval, data access, evaluation, and
    appropriate human review.
  - Use LLMs and agentic coding systems daily for exploration,
    prototyping, implementation, testing, debugging,
    documentation, and automation while maintaining a high bar
    for validation.
  - Partner with Data Engineering on application data models,
    data products, data contracts, and access patterns.
  - Partner with Data Science on ML-powered capabilities, model
    interfaces, evaluation, and production integration.
  - Partner with SRE on deployment, reliability, observability,
    security, and infrastructure decisions.
  - Make pragmatic tradeoffs between speed, quality,
    maintainability, and future flexibility. Use engineering
    rigor proportional to the risk and context of the system.
  - Reprioritize quickly as new information changes the highest-
    value path, and communicate decisions and tradeoffs
    clearly to technical and non-technical partners.
  - Review designs and code, mentor engineers, and raise the bar
    for product judgment and engineering quality.

  About You

  - 5+ years of experience building and shipping production
    software, or equivalent senior-level experience.
  - Experience in pharmaceutical, biology, and/or biotechnology
    software and data is a strong plus.
  - Strong backend and systems engineering fundamentals,
    including APIs, distributed systems, databases, cloud
    services, and asynchronous workflows.
  - Daily experience using AI tools, LLMs, or agentic
    development systems as part of the engineering workflow.
  - Experience building AI-enabled software, agentic workflows,
    retrieval systems, tool integrations, or other ML-powered
    products is a strong plus.
  - Familiarity with ML concepts such as training versus
    inference, embeddings, retrieval, evaluation, data
    quality, and model limitations is a plus. Deep ML research
    experience is not required.
  - Strong product judgment and the ability to make progress
    with incomplete information, identify high-value problems,
    and adapt quickly as priorities change.
  - Experience operating production software with appropriate
    testing, observability, security, and follow-through after
    launch.
  - We value full-stack range, with a primary emphasis on
    backend, systems, product, and AI engineering.
  - Exceptional communication and collaboration skills across
    Product Engineering, Data Engineering, Data Science, SRE,
    and non-technical partners.

  Total Compensation Range: $185,500 - $232,000

  Compensation Individual compensation is determined by
  several factors, including role scope, geographic location,
  and skills & experience. Your offer will reflect where you
  fall within the range based on these considerations. In
  addition to base salary, we offer equity, comprehensive
  benefits, and generous perks. If the posted range doesn't
  match your expectations, we still encourage you to apply!

  Where We Hire Formation Bio is prioritizing hiring in key
  hubs, primarily the New York City and Boston metro areas,
  with a hybrid model requiring 3 days per week in office.
  Applicants from the Research Triangle (NC) and San Francisco
  Bay Area may also be considered. Please apply only if you
  reside in these locations or are willing to relocate.

  Equal Opportunity Formation Bio is committed to building a
  diverse and inclusive team. We are an equal opportunity
  employer and welcome candidates from all backgrounds. All
  qualified applicants will receive consideration for
  employment without regard to race, color, creed, religion,
  national origin, ancestry, sex (including pregnancy,
  childbirth, breastfeeding, and related medical conditions),
  gender identity or expression, sexual orientation, age,
  disability, genetic information, marital status, military or
  veteran status, or any other characteristic protected by
  federal, state, or local law.

  We've seen a rise in recruiting impersonation scams across
  the industry, where fake profiles pose as recruiters aiming
  to trick candidates into sharing personal and financial
  information through illegitimate interviews and job offers.
  All legitimate recruiting communications from Formation Bio
  will come from a @formation.bio email address. If you
  receive outreach from someone claiming to work at Formation
  Bio through any other domain or channel, please disregard it
  and do not share any personal information.
