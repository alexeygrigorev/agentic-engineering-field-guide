description: |
  About Button

  Button is building the future of the commerce powered
  internet — enabling performance marketing and monetization
  at scale across marketplaces, brands, and creators. We’re
  creating products that unlock new value at the intersection
  of discovery, engagement, and conversion. Button’s Mission
  is to empower the companies shaping the creator and
  affiliate economy - fueling mobile growth with innovation
  and new paths to monetization.  Our vision is an internet
  where all marketing is performance-based, everyone wins, and
  our innovation in the creator and affiliate economy lays the
  foundation for a new era of growth.

  What you'll do

  You'll define the technical architecture and engineering
  direction for Button's core products at organizational
  scale. These systems power commerce experiences used by
  millions of people and help partners and internal teams
  activate and understand those experiences. This is a hands-
  on role: you'll set technical vision across teams, resolve
  competing architectural directions, write production code,
  build proofs of concept, and take zero-to-one projects to
  production, working closely with Engineering and Product
  leadership on strategy. Our stack includes React,
  TypeScript, Go, NodeJS, Python, Docker, and AWS.

  - Define full-stack architectures for large-scale systems,
    drive adoption across teams, resolve competing technical
    directions, and set the standards other engineers build on
  - Stay hands-on: write high-quality production code, build
    proofs of concept, and own zero-to-one projects end to
    end, from idea through design, implementation, and launch
  - Work across teams and domains, contribute quickly, and
    connect systems architecturally at the company level
  - Own business-critical, highly ambiguous technical problems,
    breaking them into coordinated workstreams, aligning
    teams, and delivering against our most important product
    goals
  - Apply machine learning where it adds real product value, and
    lead ML from prototype to production, including
    deployment, evaluation, and monitoring
  - Partner with Product leadership to tie engineering roadmaps
    to company strategy and anticipate the business's
    technical needs
  - Raise the bar on engineering practices (code quality,
    testing, system design, maintainability) and operational
    health (SLOs, incident management, reliability)
  - Develop senior engineers into technical leaders through
    mentorship, sponsorship, feedback, and by modeling
    technical excellence

  What you need to be successful

  - 10+ years building production systems at scale, and you
    still write excellent code, prototype quickly, and ship
  - A track record of taking zero-to-one products or systems end
    to end into production
  - Deep full-stack expertise across UIs, APIs, backend
    services, and data infrastructure, with 5+ years leading
    system design and architecture across teams
  - Strong fluency in JavaScript/TypeScript (React, NodeJS) and
    Go, plus strong Python experience, especially for ML and
    data work
  - Strong command of web fundamentals (component architecture,
    state management, accessibility, performance) and sharp
    API design instincts for cross-team interfaces at scale
  - A strong sense of, or direct experience with, ML, including
    productionizing Python ML systems: deployment, evaluation,
    monitoring, and iteration
  - Ability to operate in high ambiguity: framing open-ended
    problems, aligning stakeholders, and driving company-level
    outcomes
  - Experience owning reliability across teams, including
    defining SLOs, leading incident response culture, and
    improving systemic operational health
  - Deep experience with relational databases, distributed
    systems, and cloud infrastructure (AWS)
  - A history of developing senior engineers into leaders, and
    the communication skills to build technical consensus and
    engage executives

  What you'll get

  - Compensation: U.S. base salary range of $205,000–$265,000.
    Final offer depends on skills and experience relative to
    the role's requirements.
  - Comprehensive Health Coverage: 100% company-paid premiums
    for employee base medical coverage, with ~80% coverage for
    spouse, partner, and dependent care. Options include both
    traditional plans and a High Deductible Health Plan (HDHP)
    paired with a Flexible Spending Account (FSA) or Health
    Savings Account (HSA).
  - HSA Company Contribution: For employees enrolled in the
    HDHP, the company contributes up to $1,800/year for
    individuals ($150/month) and up to $3,000/year for
    families ($250/month).
  - 401(k) Retirement Plan: Automatic 3% company contribution
    starting after 30 days, completely independent of employee
    contributions and 100% vested immediately (with both
    traditional pre-tax and Roth options).
  - Annual "Treat Yourself" Stipend: A $500 annual wellness and
    personal stipend to spend on vacations, spa days, personal
    electronics, or home goods.
  - Monthly Tech & Connectivity Stipend: $130 per month ($1,560
    annually) to cover cell phone and home internet expenses.
  - Home Office Setup Allowance: A one-time $400 stipend for new
    hires to customize their workstation, equipment, and
    ergonomic office setup.
  - Wellness & Fitness Perks: Subsidized fitness benefits,
    including discounted Peloton memberships ($10/month) and
    covered NYC bike-share memberships.
  - Concierge Healthcare: Complimentary One Medical membership
    providing 24/7 on-demand virtual care and prioritized in-
    person appointments.
  - Time Off: Unlimited time off (including your birthday), plus
    summer and winter company breaks
  - Employee Assistance Program (EAP)
  - RemotePlus workplace: Work from anywhere, with an NYC hub,
    WeWork All Access memberships in select markets, regular
    coworking days, and social events

  Button is committed to being a welcoming and inclusive
  workplace for everyone, and we are intentional about making
  sure people feel respected, supported and connected at
  work—regardless of who you are or where you come from. We
  value and celebrate our differences and we believe being
  open about who we are allows us to do the best work of our
  lives.

  Button is an Equal Opportunity Employer. We do not
  discriminate against qualified applicants or employees on
  the basis of race, color, religion, gender identity, sex,
  sexual preference, sexual identity, pregnancy, national
  origin, ancestry, citizenship, age, marital status, physical
  disability, mental disability, medical condition, military
  status, or any other characteristic protected by federal,
  state, or local law, rule, or regulation.
