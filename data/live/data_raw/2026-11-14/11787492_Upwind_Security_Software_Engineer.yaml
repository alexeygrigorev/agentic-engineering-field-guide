  Requirements

  WHAT YOU’LL BRING

  - 4+ years of experience as an engineer working in a cloud
    environment.
  - A curious mindset where you like to be challenged to dive
    deep when required.
  - Proven, hands-on experience with infrastructure as code in
    production environments (Terraform, Terragrunt,
    Cloudformation, CDK, ARM-BICEP etc..).
  - Some programming experience (Golang or Java preferred).
  - Scripting/programming skills with Python/Bash/Csh.
  - An innovative approach, with the ability to quickly learn
    technologies, and implement cutting edge technologies.
  - A strong sense of ownership and accountability .

  Advantages

  - Deep knowledge of snapshotting, volumes and encryption on
    public clouds.
  - Deep knowledge of filesystems.
  - Hands on experience with multiple cloud vendors, including
    cross account IAM and identity federation schemes
  - Familiarity with deploying serverless functions with
    multiple Cloud Vendors
