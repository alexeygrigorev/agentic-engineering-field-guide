description: |
  We have an exciting and rewarding opportunity for you to
  take your software engineering career to the next level.


   As a Software Engineer III at JPMorganChase within the
  Business Banking, Business Access and Tools division, you
  serve as a seasoned member of an agile team to design and
  deliver trusted market-leading technology products in a
  secure, stable, and scalable way. You are responsible for
  carrying out critical technology solutions across multiple
  technical areas within various business functions in support
  of the firm’s business objectives.


  Job responsibilities



  - Executes software solutions, design, development, and
    technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    breakdown technical problems
  - Design, develop, and maintain backend services, agentic
    workflows using TypeScript and APIs using Java, and Spring
    Boot
  - Implement micro-services architecture leveraging Spring
    Cloud for service discovery, configuration, and resilience
  - Containerize and deploy applications on AWS using services
    such as ECS, EKS, Lambda, or EC2.
  - Implement and maintain AWS infrastructure using
    Infrastructure as Code (IaC)
  - Implements reactive programming paradigms for high-
    performance systems
  - Apply 12-factor app principles and best practices for cloud-
    native development
  - Design and execute performance and load tests using JMeter
    or Blazemeter



   Required qualifications, capabilities, and skills





  - Formal training or certification on software engineering
    concepts and 3+ years applied experience
  - Hands-on experience in system design, application
    development, testing, and operational stability in
    production environments.
  - Backend experience with Java 21, Spring Boot, and Spring
    Cloud; building microservices with service discovery,
    configuration, and resiliency patterns.
  - Front-end experience with TypeScript and JavaScript,
    delivering end-to-end functionality across UI and APIs.
  - AWS cloud and infrastructure experience using Infrastructure
    as Code (IaC), including Lambda, S3, and Kafka-based
    integrations.
  - Experience applying reactive programming paradigms for high-
    performance, resilient systems.
  - Strong cloud-native engineering practices, including
    applying 12-factor app principles.
  - Performance and load testing experience using JMeter or
    BlazeMeter, with results-driven tuning and optimization.
  - CI/CD pipeline and release automation experience with tools
    such as Jules and Spinnaker.
  - Observability and operational troubleshooting experience
    using Splunk and Dynatrace.
  - Data layer experience across Cassandra, DynamoDB,
    PostgreSQL, and caching solutions such as ElastiCache,
    plus familiarity with enterprise-authorized AI-assisted
    development tools and responsible AI usage in engineering
    workflows.



   Preferred qualifications, capabilities, and skills





  - Experience designing and integrating agent-to-UI
    interactions, including familiarity with agent-to-agent
    (A2A) protocols.
  - Proven ability to troubleshoot, debug, and resolve issues in
    distributed, multi-agent environments.
  - Proficiency in Python for building, automating, and
    supporting production-grade services and tooling.

  About Us

  Chase is a leading financial services firm, helping nearly
  half of America’s households and small businesses achieve
  their financial goals through a broad range of financial
  products. Our mission is to create engaged, lifelong
  relationships and put our customers at the heart of
  everything we do. We also help small businesses, nonprofits
  and cities grow, delivering solutions to solve all their
  financial needs.

  We offer a competitive total rewards package including base
  salary determined based on the role, experience, skill set
  and location. Those in eligible roles may receive
  commission-based pay and/or discretionary incentive
  compensation, paid in the form of cash and/or forfeitable
  equity, awarded in recognition of individual achievements
  and contributions.  We also offer a range of benefits and
  programs to meet employee needs, based on eligibility. These
  benefits include comprehensive health care coverage, on-site
  health and wellness centers, a retirement savings plan,
  backup childcare, tuition reimbursement, mental health
  support, financial coaching and more. Additional details
  about total compensation and benefits will be provided
  during the hiring process.

