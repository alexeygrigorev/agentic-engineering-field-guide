description: |
  Exceptional Hospitality Starts with You

  This role is based at one of our corporate offices in
  Dallas, TX, McLean, VA, Memphis, TN or Remote

  This is your chance to be a part of an in-house Technology
  team that's creating consumer-facing, cutting-edge
  technologies revolutionizing the hospitality industry around
  the world! As an AI Software Engineer, you will bring your
  technical skills to a hospitality company with an award-
  winning culture. On the AI Platform team reporting to the
  Senior Manager Software Engineering, you will support
  projects including AI stay planner, AI Agents and Large
  Language Model integrations.

  What you'll do during a typical day:

  - Build APIs, MCP servers, AI agents, and LLM interactions
    using Python, FastAPI, LangChain, or Strands.
  - Develop full-stack web applications using React, TypeScript,
    Tailwind CSS, Vitest, and Testing Library on the front
    end.
  - Design and implement scalable cloud applications using AWS
    services such as S3, EKS, ElastiCache, Bedrock, AgentCore
    and Guardrails.
  - Build observability using Datadog and Splunk.

  How you'll collaborate with others:

  - Propose initial UI/UX concepts and flows and iterate based
    on feedback from Product and UX teams.
  - Work with Security and Legal teams to evaluate and maintain
    AI assistants.
  - Work with software engineering teams to adapt the tools to
    Hilton codebases by implementing custom instructions,
    custom agents and agent skills.

  Deliverables you'll take ownership of:

  - Partner with delivery managers, software engineers, and
    other team members to translate requirements into
    technical solutions through sprint planning, design
    reviews, and architecture discussions.
  - Guide implementation and production deployment of AI agents
    for developer productivity and customer experience use
    cases, including API integrations, evaluation pipelines,
    monitoring, support, and best practices for agent
    workflows.

   What It Takes to Make the Stay

  You have these minimum qualifications:

  - Professional work experience in Technology or related field
  - Experience developing Generative AI-driven solutions.
  - Experience engineering AI solutions through UI development,
    API configuration, or platform support
  - Travel up to 5%

  It would be useful if you have:

  - Bachelor's Degree, or Associate's Degree plus 3+ years of
    Technology related experience, or High School Degree/GED
    plus 5+ years of Technology related experience
  - Three (3) + years of professional work experience in
    Technology or related field
  - Two (2) + years of work experience in Generative AI-driven
    solutions.
  - Two (2) + years of experience engineering AI solutions in UI
    development, API configuration, or platforms support
  - Proficiency in CI/CD tools (Jenkins, GitLab)
  - Experience with NoSQL databases such as ElastiCache or
    OpenSearch
  - Located near one of our three US office locations (McLean,
    Dallas, Memphis)



  How We'll Help You Thrive

  At Hilton, the hospitality we're known for doesn't end with
  our guests. We proudly invest in our Team Members'
  wellbeing, supporting you through all of life's moments.
  When you join Hilton, our exceptional care extends to you
  with unmatched perks and benefits, including*:

  - Incredible travel perks – Enjoy 110 nights of deeply
    discounted travel, with room rates as low as $40/night at
    our world-class hotels through our Go Hilton travel
    program
  - Own a piece of Hilton – Through our employee stock purchase
    program (ESPP), you can invest in Hilton shares at a 15%
    discount to help build your financial future
  - Paid parental leave – Because family matters. We offer paid
    leave for eligible Team Members, including partners and
    adoptive parents
  - Personalized caregiving support – Access dedicated
    caregiving concierge services to help navigate caregiving
    for yourself and your loved ones
  - Crisis concierge – In times of loss, our Crisis Concierge
    offers a single, compassionate point of contact for both
    practical support and emotional care
  - Mental health resources – Your wellbeing comes first.
    Eligible Team Members can access free counseling and
    support through our best-in-class Employee Assistance
    Program (EAP)
  - Generous paid time off (PTO) – Recharge, relax, and take
    time for what matters most
  - Health & welfare benefits – From checkups to dental
    cleanings to new glasses, we offer a variety of health
    plans that keep you and your family covered
  - Financial security for your future – Our retirement plans
    make it easier to save for what's next

  *Benefits availability may vary depending on Team Member's
  location as well as terms and conditions of employment and
  are subject to the terms and conditions of each specific
  program/plan.

  Hilton offers its eligible team members a comprehensive
  benefits package to support their mental and physical well-
  being, so they can Thrive personally and professionally. The
  pay range for this role is $77,500 – $110,000 and is
  determined based on applicable and specialized experience
  and location. Subject to plan terms and conditions, you will
  be eligible to participate in the Hilton Annual Incentive
  (Bonus) Plan, consistent with other team members at the same
  level and/or position within the Company.

