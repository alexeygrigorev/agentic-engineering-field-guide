description: |
  We’re Blue River, a team of innovators driven to create
  intelligent machinery that solves monumental problems for
  our customers. We empower our customers – farmers,
  construction crews, and foresters - to implement safer and
  more sustainable solutions, driving increased profitability
  with less reliance on scarce labor. We believe that focusing
  on the small stuff – pixel-by-pixel and task-by-task - leads
  to big gains.

  Blue River Technology aligns with John Deere’s vision to
  “innovate on behalf of humanity” by quickly identifying and
  solving high-value, high-uncertainty challenges in AI,
  machine learning, computer vision, and robotics. BRT acts as
  a research and development flywheel, building not only new
  products but also new platforms that reliably create value
  for both Deere and its customers. From fully autonomous
  machines to highly precise farming equipment, BRT and Deere
  are partnering to create technical breakthroughs in
  industries like agriculture and construction. Our people are
  at the heart of what we do. Through cross-disciplinary
  collaboration, this mission-driven team is eager to define
  the new frontier of robotics. We are always asking hard
  questions, rapidly iterating, and getting our boots in the
  field to figure it out. We won’t give up until we’ve made a
  tangible and positive impact on the planet!

  Blue River Technology is based in Santa Clara, CA.

  Summary

  Our See & Spray Team is looking for a highly motivated
  Software Engineer to deliver the promise of Precision
  Agriculture to the world’s farm fields. In this role, you
  will collaborate with our team in the development, testing,
  and optimization of software systems that power our
  agricultural and construction equipment. We tackle our
  objectives with multi-functional engineering teams of
  systems and embedded software, test and QA, mechatronics,
  computer vision, and machine learning engineers. Our team is
  empowered to figure out how to overcome challenges, and plan
  and prioritize work – everyone is a key contributor.

  - Employment Type: Full-time
  - Work Location: Remote in the United States
  - Visa sponsorship: Available for this position.

  Job Responsibilities

  - Design, develop, and test robotics system software in a
    complex distributed system using C++ in a Linux
    environment in a small multidisciplinary team.
  - Provide remote and in-field troubleshooting and support of
    distributed systems during deployment and testing phases.
  - Document code, APIs, and system architecture to ensure
    knowledge sharing.
  - Break down work and estimate time to completion.

  Required Experience and Skills

  - BS degree or higher in Computer Science or related field.
  - 2 or more years of experience with distributed robotics
    software development in C++.
  - Proficiency with Linux/bash environments and command-line
    tools.
  - Knowledge of version control systems (e.g., Git) and
    collaborative development workflows.
  - Problem-solving skills with the ability to debug complex
    systems.
  - Ability to work effectively in a fast-paced, iterative
    development environment.
  - Familiarity with SSH for remote access and scripting on
    single-board compute for rapid prototype/ test
    applications (i.e., Raspberry Pi use cases).
  - OS and machine deployment + management ability (Ansible,
    etc.)
  - Strong written and verbal documentation.

  Preferred Experience and Skills

  - Experience with real-time sensor integration and vision
    systems on autonomous vehicles or robotic systems.
  - Familiarity with GPU computing on edge devices and real-
    world constraints.
  - Experience with Python, especially in a robotics context.
  - Passionate about agriculture.

  Only individual applicants will be considered. We do not
  work with unsolicited third-party agencies or proxy
  interview services.

  At Blue River, your base pay is one part of your total
  compensation package. For this position, the reasonably
  expected pay range is between $104,000 – $183,000/year for
