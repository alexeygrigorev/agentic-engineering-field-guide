description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  CrowdStrike is seeking an Engineering Manager to join our
  Proactive Security team within Cloud Security Group. This
  role will lead our Proactive Protection team, focusing on
  helping our customers to detect and prevent threats in cloud
  environments through advanced detection techniques and
  methodologies, before they can cause harm.

  You will collaborate closely with cross-functional teams,
  product management, and security researchers to drive
  detection capabilities while building a team and managing
  direct reports.

  We're seeking innovative problem-solvers who can take
  ownership of complex technical challenges across our
  platform. This is an opportunity to work at unprecedented
  scale with cutting-edge cloud technologies while making a
  direct impact on organizations worldwide protecting them
  from sophisticated threats.

  This role is hybrid, on-site at one of the posted locations.
  Candidates should be comfortable visiting the office twice a
  week once the development center is established.

  About the Cloud Proactive Security Team:

  - A global team of engineers that  develops and maintains
    mechanisms to prevent cloud misconfigurations and security
    risks before deployment - The team builds intelligent
    prevention capabilities that identify and block insecure
    cloud configurations.
  - Develops and maintains proactive security controls that
    protect Kubernetes clusters, container registries,
    serverless functions, and cloud workloads from emerging
    threats in multiple cloud vendors as well as private data
    centers.
  - Creates developer-friendly tools and integrations that embed
    security prevention directly into CI/CD pipelines, GitOps
    workflows, and Kubernetes deployment processes.

  What You Will Do:

  - Manage a team of engineers building and optimizing the core
    pipeline that protects cloud workloads, containers, and
    Kubernetes clusters.
  - As an engineering manager, you will help drive and deliver
    on both roadmap and technical strategy, and you will be
    instrumental in hiring, retaining, and growing a team of
    highly talented engineers.
  - Help to architect enterprise grade solutions that scale
    seamlessly from thousands to millions of requests per
    second
  - Build and Lead a Global Team. Manage a distributed team of
    high-talented cloud specialized software engineers and
    technical leads, fostering a collaborative environment
    while coordinating across time zones to deliver high-
    quality products.
  - Cross-Functional Collaboration. Partner with product
    management and engineering teams to align cloud proactive
    capabilities with customer needs, directly influencing
    CrowdStrike's Proactive detection platform evolution and
    organizational strategy.
  - Ensure Quality and Accuracy. Own validation processes for
    proactive vulnerability detections, implementing automated
    workflows that maintain CrowdStrike's high standards for
    security solutions.
  - Must be able to work 3+ days per week on site from our New
    York office.

  What You’ll Need:

  - Must be a U.S. Citizen or US Permanent Resident.
  - BS/MS in Computer Science or related field, or equivalent
    work experience
  - 7+ years of experience in Software Engineering roles with at
    least 3+ years in management positions.
  - Security and/or Cloud Security experience is required
  - Understanding of cloud security concepts such as CSPM, CWPP,
    and CNAPP
  - Exposure to cloud security products, including product
    direction for AI/ML, XDR, SIEM, SOAR,  or related
    cybersecurity domains.
  - Familiarity with container and Kubernetes security (build-
    time and runtime)
  - Solid design and problem-solving skills with a demonstrated
    passion for engineering excellence, quality, security, and
    performance
  - Broad grounding in all aspects of distributed systems
    development
  - Experience with Kafka, Cassandra, ElasticSearch technologies
  - Experience building systems at cloud scale and container
    orchestration technologies such as Kubernetes
  - Proficiency with at least one major cloud platform (AWS,
    Azure, or GCP)
  - Experience with modern programming languages such as Go,
    Python, Java, C++, Rust or similar languages
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.
  - Exceptional communication skills, with the ability to convey
    complex technical concepts clearly to both executive and
    engineering audiences, in writing and verbally
  - Strong cross-functional collaboration skills, with a proven
    ability to partner effectively across engineering, product
    management, support, and sales engineering
  - Demonstrated success recruiting and hiring strong
    engineering talent
  - Proven track record of mentoring and developing engineers,
    helping them grow in their careers and technical skills

  Bonus Points:

  - Remote/distributed multi-team leadership experience
  - Experience with organizational scaling and process
    optimization

  #LI-JC1

