description: |
  Sound is hiring a Staff Frontend Engineer to help shape the
  future of a new music economy that values artists and their
  music while connecting fans more closely to the music they
  love.

  As Staff Frontend Engineer, you will lead technical
  direction for our engineering team while contributing as an
  individual contributor to our code base. You will help build
  and maintain our user-facing suite of tools. This includes
  our core song and artist pages for listening parties, artist
  tools, community management tools, governance and membership
  tools to empower the next wave of artists and their
  communities. You will be involved in product decisions and
  have a direct impact on the end user experience.

  Responsibilities

  - Set the technical direction for the team and help guide
    frontend engineering vision
  - Create delightful user experiences with an eye towards
    performance and accessibility
  - Build reusable components, write unit & integration tests,
    and continually raise the code quality and developer
    experience bar
  - Lead the architecting of important systems and anticipate
    strategic and scaling-related challenges
  - Design, build, and continually improve Sound's core frontend
    infrastructure
  - Act as a player-coach and champion code quality & developer
    experience
  - Mentor and train other engineers on the team

  Must haves

  - 6+ years of experience writing production software.
  - Live between GMT-8 and GMT-5 (North American timezones)
  - Advanced knowledge of React and Typescript

  Nice to haves

  - Public contributions to open source projects
  - Experience with Next.js, GraphQL
  - Full-stack experience (NodeJS)

  Sound's Benefits

  Our vision for the future is ambitious: we want to honor the
  value of music by giving a million artists the opportunity
  to live off their music. Here are some of our benefits:

  - We offer top-of-the-line benefits, including health, mental
    health, dental, and vision insurance.
  - Remote-first teamwork with team and community members around
    the world
  - Work-from-home/remote office stipend
  - Team offsites for periodic collaborative strategy sessions
    in person
  - Passionate, supportive team dedicated to learning and
    growing together in web3

  Sound is an equal opportunity employer. We do not
  discriminate based on gender, ethnicity, sexual orientation,
  religion, age, civil or family status, disability or race.
