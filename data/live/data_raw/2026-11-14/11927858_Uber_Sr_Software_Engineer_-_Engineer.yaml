description: |
  About the team

  The Disruptive Growth team at Uber Eats is building our next
  big bet in affordability: "Meal Deals". This high-priority
  product is dedicated to making Uber Eats more accessible for
  everyone. Our team's mission is to scale Meal Deals and
  other growth products to global markets, driving significant
  revenue and business growth worldwide.

  About the role



  Our mission is to expand Uber Eats business by
  experimenting, iterating, and launching world-class
  consumer-facing growth features. We are looking for a highly
  motivated Back End Engineer with a deep passion for product
  to contribute to this mission. In this role, you won't just
  write code; you will help define what a great product looks
  like. Your contributions will directly impact a rapidly
  growing business unit, shaping the user experience for
  millions of customers.

  Basiq Qualifications

  - BS or MS in Computer Science or a related technical
    discipline, or equivalent experience.
  - 5+ years of working experience in the software engineering
    industry
  - Proficient in modern programming languages, such as Go,
    Java, C++.
  - Hands-on experience building and scaling Consumer-Facing
    (B2C) products.

  Preferred Qualifications

  - Strong product mindset and passion with a proven track
    record of optimizing product features to improve user
    experience and drive business metrics.
  - Experience collaborating closely with cross-functional
    teams, including product, design, and data science, to
    drive innovation in consumer applications.
  - Experience building highly scalable, distributed backend
    systems that support millions of users.
  - Experience supporting and mentoring other engineers, while
    fostering a collaborative, inclusive team culture

  Responsibilities

  For New York City, NY-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  You will be eligible to participate in Uber's bonus program,
  and may be offered an equity award & other types of comp.
  All full-time employees are eligible to participate in a
  401(k) plan. You will also be eligible for various benefits.

  About Us

  Ready to Ride?



  This isn't the kind of place where you follow a playbook —
  it's where you help write one. If you're driven by impact,
  energized by challenge, and ready to shape how the world
  moves — we'd love to hear from you.

  You may be eligible for bonuses, equity, and other
  compensation, as well as a range of benefits. Explore our
  benefits.

  Offices remain key to collaboration and Uber's culture.
  Unless approved for full remote work, employees must spend
  at least 50% of their time in-office. Some roles, like those
  at greenlight hubs, require full-time in-office presence.
  Ask your Recruiter for details about this role's
  requirements.

