description: |
  If you’re an exceptional coder, love shaping product, and
  are excited by the chance to work with bleeding-edge AI -
  this is your role.

  Dentology is one of the UK’s fastest-growing performance
  marketing agencies, partnering exclusively with high-end
  cosmetic dental practices. We’re a 30+ person team spanning
  across content, ads, sales, and engineering - and one of the
  only agencies building an end-to-end patient acquisition
  system that blends agency services with proprietary
  software.

  Our platform combines real-time lead tracking, performance
  analytics, and AI-driven insights to give practices
  unprecedented visibility into what’s driving results. From
  high-production content shoots and paid campaigns to in-
  house sales teams who close the leads, we deliver
  predictable, profitable growth for some of the biggest names
  in UK dentistry.

  Role Overview

  We’re looking for a Full Stack Product Engineer to join us
  and help build a product that will transform how dental
  practices attract and convert patients. You’ll work across
  the stack, from database to frontend, and take ownership of
  key features, integrations, and user experiences. You’ll
  collaborate closely with the founders (marketing + tech
  backgrounds), bringing your own ideas to the table,
  influencing product direction, and helping us move fast with
  high-quality, clean, and scalable code.

  What you'll be doing

  - Take ownership of engineering projects, delivering features
    end-to-end - from database design to polished frontend.
  - Build and scale resilient backend services and high-usage
    API integrations.
  - Collaborate with the team to align technical execution with
    real-world clinic needs and marketing performance goals.
  - Help shape the engineering culture, setting best practices,
    tooling standards, and mentoring future hires.
  - Drive continuous improvements to our UX/UI, working closely
    with non-technical team members to deliver seamless user
    experiences.
  - Tackle challenges like real-time data syncing, performance
    optimisation, lead-tracking infrastructure, and AI-
    enhanced tools.
  - Contribute ideas around product strategy - we want you
    thinking beyond code.

  What we're looking for

  - 2+ years of full stack experience with React.js, Next.js,
    TypeScript, or similar web frameworks
  - Solid understanding of data flows and state management in
    web applications
  - Experience working with Prisma, PostgreSQL, and building
    robust API integrations
  - A passion for clean, scalable code and practical solutions
  - Empathy for the user - understanding how they interact with
    the product and shaping the experience to meet their needs
  - Curiosity - a willingness to learn quickly, adapt, and grow
    with new technologies

  Success in the Role

  6 Months:

  - Gain deep expertise in our entire tech stack, including
    deployments and infrastructure
  - Take ownership of smaller features, ensuring high-quality
    delivery and end-to-end responsibility
  - Become the go-to person for understanding how all systems
    work together and contribute to ongoing projects
  - Work autonomously on both frontend and backend development,
    applying best practices across the full stack

  12 Months:

  - Play a key role in hiring, working closely with the
    engineering team to evaluate potential candidates
  - Take on mentorship responsibilities, helping junior
    developers grow their skills
  - Contribute to engineering decisions around architecture,
    tech stack improvements, and development practices
  - Lead efforts in scaling systems, optimising performance, and
    ensuring robustness of integrations

  18 Months +:

  - Lead a team of developers, managing projects and ensuring
    delivery aligns with product goals
  - Take ownership of more strategic decisions, including
    setting long-term engineering direction
  - Mentor and guide other engineers on complex problems,
    promoting a culture of technical excellence and
    collaboration
  - Influence the company’s growth trajectory by playing a major
    role in key product and engineering initiatives

  Why Join Us

  - Incredible category – We’re blending agency speed with SaaS
    scalability in a niche ripe for disruption.
  - Cutting-edge tech – Work with the latest AI and workflows.
  - Real ownership – You’ll build the product, not just ship
    tickets.
  - Clear progression – We’re scaling quickly; there are huge
    opportunities to grow into leadership.
  - Startup energy, proven team – Fast-moving, ambitious culture
    - but with a 30+ person company behind you.
  - Remote-first – Work from anywhere, tightly connected to a
    high-performance, collaborative team.
