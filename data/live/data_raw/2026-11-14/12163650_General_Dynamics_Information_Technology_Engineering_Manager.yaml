  Total Rewards at GDIT:

  Our benefits package for all US-based employees includes a
  variety of medical plan options, some with Health Savings
  Accounts, dental plan options, a vision plan, and a 401(k)
  plan offering the ability to contribute both pre and post-
  tax dollars up to the IRS annual limits and receive a
  company match. To encourage work/life balance, GDIT offers
  employees full flex work weeks where possible and a variety
  of paid time off plans, including vacation, sick and
  personal time, holidays, paid parental, military,
  bereavement and jury duty leave. GDIT typically provides new
  employees with 15 days of paid leave per calendar year to be
  used for vacations, personal business, and illness and an
  additional 10 paid holidays per year. Paid leave and paid
  holidays are prorated based on the employee’s date of hire.
  The GDIT Paid Family Leave program provides a total of up to
  160 hours of paid leave in a rolling 12 month period for
  eligible employees. To ensure our employees are able to
  protect their income, other offerings such as short and
  long-term disability benefits, life, accidental death and
  dismemberment, personal accident, critical illness and
  business travel and accident insurance are provided or
  available. We regularly review our Total Rewards package to
  ensure our offerings are competitive and reflect what our
  employees have told us they value most.



  Our Identity Verification Process:

  As part of the hiring process, we will ask you to complete
  an identity verification process that leverages advanced
  biometrics and artificial intelligence to ensure
  authenticity and protect against identity fraud. You are
  expected to be on camera during virtual interviews. We
  reserve the right to take your picture to verify your
  identity and prevent fraud. By proceeding, you authorize the
  collection, processing, and use of your biometric data for
  identity verification and security purposes.

