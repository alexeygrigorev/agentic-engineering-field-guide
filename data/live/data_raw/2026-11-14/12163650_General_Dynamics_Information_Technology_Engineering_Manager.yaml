  Job Description:

  Engineering Manager

  What You’ll Do:

  - Lead a high-performing team of engineers (employees,
    internal contractors, and external contractors) to deliver
    high-impact features and improvements to our core services
    and systems
  - Focus primarily on people management, team development, and
    strategic execution rather than hands-on coding
  - Independently drive execution on projects supporting semi-
    annual and annual goals, navigating ambiguity and
    organizational change
  - Foster a culture of ownership, excellence, and psychological
    safety where team members can grow and deliver their best
    work
  - Set clear priorities, goals, and key metrics for your team
    and hold them accountable for progress while maintaining
    healthy team dynamics
  - Partner effectively across engineering teams and with cross-
    functional stakeholders (product, design, customer) to
    deliver business and customer impact
  - Build and develop a diverse, high-performing team through
    strategic hiring, coaching, and creating growth
    opportunities aligned with individual strengths and career
    aspirations
  - Balance running the business, foundational work, and new
    initiatives to optimize for sustainable long-term
    execution
  - Identify and address technical risks, system bottlenecks,
    and process inefficiencies that impact team productivity
    and outcomes
  - Drive informed decision-making by gathering diverse
    perspectives and balancing customer value with broader
    business goals
  - Champion engineering best practices, including architectural
    quality, operational excellence, and technical strategy
    alignment

  Evidence of Leadership & Management Accomplishment:

  - Demonstrated track record of leading high-performing
    engineering teams to deliver significant business and
    customer impact
  - Experience managing mixed workforce models including full-
    time employees, internal contractors, and external
    contractors
  - Strong people management focus with experience spending the
    majority of time on coaching, development, and team
    enablement rather than individual contribution
  - Experience managing the full software development lifecycle
    with a focus on results, quality, and team health
  - Proven ability to navigate complexity and ambiguity while
    maintaining team focus and morale
  - Track record of building, hiring, and developing diverse
    engineering teams across various skill levels
  - Experience setting technical direction and making
    architectural tradeoffs in partnership with senior

  Management & Technical Excellence:

  - Strong people management skills including coaching,
    performance management, and conflict resolution across
    diverse workforce models
  - Experience building cohesive, high-performing teams that
    include a mix of employees and contractors
  - Ability to provide quality technical feedback on designs and
    architectural decisions without being hands[1]on keyboard
  - Understanding of distributed systems, microservices, and
    modern engineering practices
  - Experience establishing efficient processes and operational
    cadences that drive high team performance
  - Skilled at balancing technical excellence with pragmatic
    delivery of business value
  - Comfortable reviewing system health, engineering quality,
    and technical strategy alignment

  Ownership, Collaboration, & Communication:

  - Demonstrated propensity for taking ownership of problems and
    driving them to resolution
  - Ability to communicate with clarity and brevity, tailoring
    messages to different audiences and stakeholders
  - Experience building deep cross-functional relationships and
    facilitating productive conflict
  - Track record of advocating for your team while optimizing
    for broader organizational outcomes
  - Willingness to hold crucial conversations even when
    uncomfortable, and ability to disagree and commit
  - Creates inclusive environments where diverse perspectives
    are valued and team members feel psychologically safe

  Adaptability & Growth:

  - Growth mindset with demonstrated commitment to continuous
    learning and self-development
  - Proven ability to embrace change, introduce new initiatives,
    and guide teams through organizational transitions
  - Demonstrated embrace of AI and automation tools to enhance
    team productivity and engineering outcomes
  - Track record of encouraging experimentation, learning from
    failures, and driving innovation within teams
  - Comfort operating in ambiguous environments and ability to
    focus on the greater purpose to move forward

  Required:

  - Must be a US Citizen and able to obtain and maintain Public
    Trust 6C
  - Position is remote, with approximately 10-20% business
    travel

