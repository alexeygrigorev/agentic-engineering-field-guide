title: Senior Full Stack Engineer (Incard Apps)
company: Incard
location: London, GBR
work_type: FULL_TIME
company_size: 26 Employees
description: |
  About Incard

  Incard’s mission is to build the financial operating system
  for entrepreneurs.

  We are focused on creating a system where business banking,
  financial tools, and application logic are coordinated into
  a single control layer.

  Through the app store, entrepreneurs and developers can
  build industry-specific functionality as their business
  evolves.

  Our team is small, highly motivated, and focused on
  engineering excellence. We operate with a flat
  organizational structure. All employees are expected to be
  hands-on and to contribute directly to the company’s
  mission. Leadership is given to those who show initiative
  and consistently deliver excellence. All engineers are
  expected to have strong communication skills. They should be
  able to concisely and accurately share knowledge with their
  teammates.

  Who We’re Looking For

  We’re looking for a Senior Full-Stack Developer to join our
  New Features squad.

  You’ll work on some of Incard’s most visible and strategic
  initiatives, shipping in-house applications and zero-to-one
  features such as Stablecoins, Capital for Cards, Cashback
  experiences, and new financial workflows built on top of
  external partners.

  This role is ideal for a strong generalist engineer who
  enjoys owning features end-to-end, moving fast, and turning
  complex integrations into polished user experiences.

  What You’ll DoShip New Products End-to-End

  - Build and launch new in-house applications and features from
    scratch
  - Own features across backend, frontend, and integrations
  - Take ideas from concept → production → iteration

  Integrations & Partner-Driven Features

  - Build features integrating with external partners such as:
    - Stablecoin infrastructure (e.g. Bridge)
    - Capital / credit for cards (e.g. Finmid)
    - Cashback and rewards mechanics
  - Design robust flows around APIs, webhooks, and asynchronous
    processes

  Full-Stack Engineering

  - Build scalable backend services using TypeScript and/or Go
  - Build clean, intuitive frontend experiences aligned with
    Incard’s design system
  - Design APIs, workflows, and data models that support fast
    iteration

  Execution & Delivery

  - Own features from design to production within your squad
  - Collaborate closely with Product Owners, Designers, Backend,
    and Mobile teams
  - Break down complex initiatives into clear, shippable
    milestones
  - Ship fast while maintaining high quality and correctness

  Quality, Reliability & Collaboration

  - Write clean, maintainable, and well-tested code
  - Participate actively in code reviews and technical
    discussions
  - Think through edge cases, failure modes, and real-world
    usage
  - Contribute to shared standards and best practices

  What We’re Looking For

  - 5+ years of experience as a Full-Stack or Product-focused
    Engineer
  - Strong experience with TypeScript (frontend and backend)
  - Solid backend experience (APIs, integrations, workflows,
    data models)
  - Comfort working across frontend, backend, and external APIs
  - Product-minded engineer who enjoys shipping user-facing
    features
  - Strong attention to detail, edge cases, and execution
    quality
  - Clear communicator who works well in cross-functional teams

  Nice to Have

  - Experience integrating with fintech, payments, or financial
    APIs
  - Experience shipping zero-to-one products or in-house tools
  - Familiarity with Go or distributed backend systems
  - Experience working with stablecoins, credit products, or
    rewards systems

  Mindset We Look For

  - Builder mentality — you like shipping real products, not
    just abstractions
  - Strong sense of ownership over features you deliver
  - Comfortable with ambiguity and fast iteration
  - Pragmatic engineer — speed with discipline
  - Low ego, collaborative, and impact-driven
  - Startup DNA — bias to action, no bureaucracy

  Benefits:

  - Competitive cash-based compensation
  - Incard stock options
  - 25 days of paid time off per year, plus bank holidays and
    your birthday off
  - Global health insurance and unlimited paid sick leave
