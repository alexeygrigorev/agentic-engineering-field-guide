description: |
  About the role:

  Curri is seeking a Senior Software Engineer, Mobile to take
  ownership of the React Native applications that power the
  heart of Curri's logistics platform. Our mobile applications
  are a critical touchpoint for operations and brand
  perception, and right now driver-facing quality and feature
  velocity stall without dedicated senior ownership. You will
  collaborate closely with Product, Design, and the
  engineering team to take large features from fuzzy problem
  statement through shipped, measured impact, working directly
  with the drivers you build for. In this role you will be the
  go-to owner for several of Curri's largest driver-facing
  features.

  What You’ll Do:

  - Own driver-facing features end to end, from problem
    definition through shipping and measuring whether the work
    moved the metric.
  - Build and maintain Curri's React Native driver app across
    iOS and Android.
  - Build offline-first functionality, background geolocation,
    and push notifications that hold up in the field where
    connectivity is unreliable.
  - Drop into native iOS and Android code when location
    tracking, file uploads, or performance work requires it.
  - Talk directly with drivers, ops, and design to find where
    the driver experience breaks down, then fix it.
  - Diagnose and resolve production issues affecting app
    stability.

  What you need to have:

  - Deep React Native expertise, with 5+ years building and
    shipping production mobile applications across iOS and
    Android and a strong command of JavaScript and TypeScript.
  - Working knowledge of native iOS and Android development,
    enough to build and debug native modules for location
    tracking, file uploads, and background services rather
    than routing around them.
  - Strong UI and design sensibility, partnering closely with
    designers while owning the details yourself and taking a
    fuzzy spec all the way to pixel-perfect, shipped work.
  - Product-minded ownership, meaning you define the problem,
    talk to the people affected, ship the fix, and follow the
    metrics afterward instead of waiting to be handed tickets.
  - Fluency with AI-assisted development tools and real
    enthusiasm for using them as part of how you build.

  Bonus points for:

  - Experience building for a marketplace, gig economy, or
    logistics platform where the app is the product for a
    workforce in the field.
  - A track record of owning several large features end to end
    at the same company, rather than individual tickets across
    many.
  - Full-stack range that lets you follow a mobile feature into
    the backend when the work calls for it.
  - Experience instrumenting mobile apps so post-launch impact
    is measurable rather than anecdotal.

  What is in it for you?

  - Full ownership of the mobile surface Curri's largest
    customer base uses every day, with a mandate to own
    projects completely rather than work a ticket queue.
  - Direct access to the drivers and ops team you build for, so
    you can see the impact of what you ship.
  - A role that stretches past mobile into full-stack work when
    a feature requires it.
  - Competitive salary, equity compensation, and comprehensive
    benefits (health, dental, vision, 401K).
  - Fully remote, with the option to work from our Ventura, CA
    office if you are local.
  - A high-growth, mission-driven environment where your work
    has direct and measurable impact.

  Who are we?

  We are Curri, and our mission is to build the network and
  software that move the world’s goods with speed,
  intelligence, and trust. Curri provides on-demand, last-mile
  logistics for construction and adjacent industries with our
  nationwide fleet of cars, trucks, and flatbeds. Founded in
  2018 and part of the YC S19 Batch, we’re solving the massive
  inefficiencies that exist in the construction industry. Our
  headquarters are in Ventura, CA. Learn more at curri.com.

  Curri is an equal opportunity employer and complies with all
  applicable federal, state, and local fair employment
  practices laws. All qualified applicants will receive
  consideration for employment. We don't discriminate based on
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, age, disability, veteran status,
  or any other characteristic protected by law.
