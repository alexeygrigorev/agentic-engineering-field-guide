description: |
  About this role

  Your team

  Preqin, part of BlackRock, is seeking a Full Stack Software
  Engineer (Associate) to join the London Engineering team.
  The team develops and supports technology solutions that
  power Preqin's private markets platform, helping clients
  access high-quality data, analytics, and workflow
  capabilities globally. You will work with a collaborative,
  international engineering team focused on delivering
  scalable, cloud-first solutions while applying modern
  software engineering practices across the full product
  lifecycle.

  Your role and impact

  As a Full Stack Software Engineer, you will contribute to
  the design, development, deployment, and support of critical
  Preqin products. This role offers the opportunity to work
  across both backend and frontend technologies, with a
  particular emphasis on building robust services using Python
  and .NET alongside modern React-based user experiences. You
  will help drive engineering excellence, contribute to
  architectural decisions, and support the evolution of
  products that serve a global client base in the private
  markets industry.

  Your responsibilities

  In every role at BlackRock, you'll be expected to apply
  sound judgement and critical thinking to solve complex
  problems, adapt as the business evolves, and combine the
  curiosity to explore new approaches and technologies with
  the rigor to challenge the results. The scope of this role
  also includes the following responsibilities:

  - Build new features end-to-end, from concept and design
    through production deployment and support.

  - Develop and maintain scalable backend services using Python
    and .NET, and create intuitive frontend experiences using
    React and TypeScript.

  - Take ownership of components within a Software as a Service
    (SaaS) platform, including production monitoring,
    operational support, and incident resolution in cloud
    environments.

  - Apply information security principles throughout software
    design, development, testing, and deployment activities.

  - Contribute to engineering excellence through Continuous
    Integration and Continuous Delivery (CI/CD), automated
    testing, code reviews, and continuous improvement
    initiatives.

  - Collaborate closely with product, engineering, and business
    stakeholders to deliver high-quality solutions that meet
    client and business needs.

  - Contribute to the design and evolution of cloud-native,
    distributed systems and modern application architectures.

  Your experience

  - Bachelor's or Master's degree in Computer Science,
    Engineering, Mathematics, Organizational Sciences, or a
    related field, or equivalent practical experience.

  - Demonstrated experience developing backend applications with
    Python and .NET, together with frontend development using
    modern frameworks such as React and TypeScript.

  - Strong understanding of software engineering principles,
    Object-Oriented Programming (OOP) concepts, and best
    practices, combined with strong analytical, problem-
    solving, and prioritization skills.

  - Experience designing, building, and integrating APIs using
    Representational State Transfer (REST), gRPC, and modern
    microservices-based architectures.

  - Experience working within existing codebases and
    contributing to the deployment of cloud-native
    applications.

  - Strong communication skills in English and an interest in
    understanding business and product domains; experience in
    financial services is beneficial.

  - Familiarity with data technologies such as Microsoft SQL
    Server, MongoDB, and Snowflake.

  Nice to have

  - Experience with Java development.

  - Experience with GraphQL APIs and application integrations.

  - Exposure to Amazon Web Services (AWS).

  - Familiarity with enterprise-grade container orchestration
    platforms supporting declarative infrastructure and
    horizontal scaling.

  - Familiarity with modern DevOps practices and cloud-native
    engineering approaches.

  Our benefits

  To help you stay energized, engaged and inspired, we offer a
  wide range of employee benefits including: retirement
  investment and tools designed to help you in building a
  sound financial future; access to education reimbursement;
  comprehensive resources to support your physical health and
  emotional well-being; family support programs; and Flexible
  Time Off (FTO) so you can relax, recharge and be there for
  the people you care about.

  Our hybrid work model

  BlackRock’s hybrid work model is designed to enable a
  culture of collaboration and apprenticeship that enriches
  the experience of our employees, while supporting
  flexibility for all. Employees are currently required to
  work at least 4 days in the office per week, with the
  flexibility to work from home 1 day a week. Some business
  groups may require more time in the office due to their
  roles and responsibilities. We remain focused on increasing
  the impactful moments that arise when we work together in
  person – aligned with our commitment to performance and
  innovation. As a new joiner, you can count on this hybrid
  model to accelerate your learning and onboarding experience
  here at BlackRock.

  Guidance on AI use for candidates

  At BlackRock, AI has long been part of how we work –
  enhancing decision-making, improving operations, and helping
  us deliver better outcomes for clients. We encourage
  candidates to use AI thoughtfully to learn, prepare, and
  work more effectively; but during our interview process, we
  want to focus on getting to know you through your own
  experiences, thinking, and judgment. To support you, we’ve
  provided guidance on when and how to use AI during our
  hiring process so you can approach each step with confidence
  and showcase your best self.

  About BlackRock

  At BlackRock, we are all connected by one mission: to help
  more and more people experience financial well-being.  Our
  clients, and the people they serve, are saving for
  retirement, paying for their children’s educations, buying
  homes and starting businesses. Their investments also help
  to strengthen the global economy: support businesses small
  and large; finance infrastructure projects that connect and
  power cities; and facilitate innovations that drive
  progress.

  This mission would not be possible without our smartest
  investment – the one we make in our employees. It’s why
  we’re dedicated to creating an environment where our
  colleagues feel welcomed, valued and supported with
  networks, benefits and development opportunities to help
  them thrive.

  To learn more about BlackRock, please visit
  Careers.BlackRock.com. We also encourage you to get to know
  us on LinkedIn, Instagram, YouTube, X, and TikTok.

  BlackRock is proud to be an Equal Opportunity Employer.  We
  evaluate qualified applicants without regard to age,
  disability, race, religion, sex, sexual orientation and
  other protected characteristics at law.
