description: |
  Our client is building a category-defining platform at the
  intersection of commerce, community, and vertical
  SaaS—reimagining how a massive, legacy consumer industry
  operates in a modern, creator-driven world.

  They’ve quietly become one of the fastest-scaling platforms
  in their space, enabling thousands of independent operators
  to launch and grow businesses on top of their
  infrastructure. Think: a full-stack operating system paired
  with a powerful distribution layer and a highly engaged
  professional network.

  Backed by top-tier venture firms and led by repeat founders,
  the company has reached meaningful scale (200+ employees,
  strong revenue traction) while maintaining a high bar for
  product quality and design. The team is based in New York,
  with a hybrid culture that leans heavily into in-person
  collaboration.

  The Role

  Our client is hiring a Senior or Staff Frontend Engineer to
  play a key role in shaping the core user experience of their
  platform.

  This is not a “pixel-pushing” frontend role. You’ll be
  working on a complex, stateful product used daily by a
  growing base of power users running real businesses. The
  surface area spans onboarding, search, transactions,
  workflow management, and communication—touching both
  customer-facing and internal systems.

  You’ll partner closely with product and design to define
  what gets built, not just how it gets built.

  What You’ll Work On

  - Owning major parts of the core web application used by
    thousands of active users
  - Building intuitive, high-performance interfaces for complex
    workflows (search, booking, data management, etc.)
  - Collaborating with backend engineers to design clean,
    scalable end-to-end systems
  - Contributing to product direction alongside design and
    product leadership
  - Shipping features end-to-end with full ownership—from
    concept to production

  RequirementsWhat They’re Looking For

  - 5+ years building modern web applications
  - Strong experience with React, Vue, or Angular (React
    preferred in practice)
  - Experience with stateful, event-driven UIs and complex
    frontend architecture
  - A product mindset—you care about user experience as much as
    code quality
  - Comfort operating in fast-moving, ambiguous environments
  - Strong collaboration skills across engineering, product, and
    design

  BenefitsComp & Structure

  - Base: roughly $150,000 to $220,000+  USD
  - Meaningful equity
  - Full benefits package (health, dental, vision, retirement,
    etc.)
  - Flexible vacation policy
  - Hybrid NYC setup (3 days in-office / flexible)
