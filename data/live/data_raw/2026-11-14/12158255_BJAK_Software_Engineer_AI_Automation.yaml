description: |
  About Act

  There are over 5 billion users using basic applications
  today such email, notes, tasks, calendar and they're not AI-
  native. Our mission is to build proactive applications for
  anyone in the world, who are not used to complex prompting.
  We aim to bring intelligence to conversations, errands,
  organising and workflows, with minimal to no prompting.

  Our first application is an agent-first mobile communication
  app. We believe building applications that users use daily
  for communication, coordination and collaboration needs will
  help integrate AI into their lives. The net effect is to
  eliminate misinformation, achieve low coordination costs,
  enable high quality tasks and collaboration at scale with
  minimal or little prompting.

  Role

  - Build and maintain internal applications and automation
    systems for Recruiting, HR, Finance, Operations and other
    business functions
  - Identify manual processes that can be automated and define
    technical solutions based on business requirements
  - Develop AI-powered workflows using LLM APIs, agents and
    external tool integrations where appropriate
  - Build backend services, APIs, databases and interfaces to
    support internal applications
  - Integrate internal systems and third-party platforms to
    automate data processing, approvals and routine tasks
  - Deploy, monitor and improve internal tools based on
    reliability, accuracy, usage and time saved

  Requirements

  - 3+ years of software engineering experience in backend,
    full-stack or application development
  - Able to translate business workflows and operational
    problems into practical software solutions
  - Proficient in at least one backend or full-stack programming
    language, such as Python, TypeScript or JavaScript
  - Able to design and build APIs, database-backed applications
    and integrations with third-party services
  - Experience deploying and maintaining production systems,
    diagnosing failures and improving reliability
  - Able to work directly with non-technical stakeholders to
    understand requirements, validate solutions and deliver
    measurable improvements

  Nice to Have

  - Experience building AI applications using LLM APIs, agents
    or workflow orchestration frameworks
  - Experience developing internal tools, business automation or
    enterprise integrations
  - Familiarity with HR, recruiting, finance or operations
    systems
  - Experience with workflow automation platforms such as n8n,
    Zapier or Make
