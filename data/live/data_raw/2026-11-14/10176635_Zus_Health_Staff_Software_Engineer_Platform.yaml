  We will offer you…

  • Competitive compensation that reflects the value you bring
  to the team a combination of cash and equity

  • Robust benefits that include health insurance, wellness
  benefits, 401k with a match, unlimited PTO

  • Opportunity to work alongside a passionate team that is
  determined to help change the world (and have fun doing it)

  Please Note: Research shows that candidates from
  underrepresented backgrounds often don’t apply unless they
  meet 100% of the job criteria. While we have worked to
  consolidate the minimum qualifications for each role, we
  aren’t looking for someone who checks each box on a page;
  we’re looking for active learners and people who care about
  disrupting the current healthcare system with their unique
  experiences.

  We do not conduct interviews by text nor will we send you a
  job offer unless you've interviewed with multiple people,
  including the Director of People & Talent, over video
  interviews. Job scams do exist so please be careful with
  your personal information.
