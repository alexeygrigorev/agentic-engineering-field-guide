description: |
  Overview

  At Addition Wealth, we’re on a mission to redefine financial
  health by making personalized financial expertise inclusive
  and accessible to everyone. Through innovative technology
  and meaningful partnerships with leading companies and
  financial institutions, we empower individuals with robust
  digital tools, a comprehensive knowledge center, and access
  to top financial professionals to confidently navigate
  life’s financial decisions. Our work not only reduces stress
  and improves productivity but transforms how people think
  about and manage their money.

  We’re not just another financial wellness platform. We are
  pioneering a revolution in how individuals make financial
  decisions—leveraging technology to create seamless,
  impactful, and life-changing experiences. At Addition
  Wealth, you’ll have the opportunity to solve complex
  challenges, push the boundaries of what’s possible, and
  create tools that truly make a difference.

  Our impact has been recognized globally. Backed by top
  fintech VCs including Barclays, Anthemis, and Nyca, Addition
  Wealth has been named one of Business Insider’s 54 Promising
  Fintech Companies to Watch, honored with UBS’ Female Founder
  Award 2023, and selected as a World Economic Forum Top
  Innovator. We’ve also been featured in Bloomberg,
  TechCrunch, Insider, Forbes, and other leading publications.
  Together, we’re building something extraordinary—and we’re
  just getting started.

  We are looking for a Full Stack, Staff Software Engineer to
  help build out the product set of Addition Wealth. Our
  technical stack is built primarily in Typescript and hosted
  on AWS. Major frameworks we use include both Nestjs and
  Nextjs and our primary data stores are in Postgres. You do
  not need to know all of these technologies, but capability
  in similar stacks is nice to have.



  You will be expected to have strong technical, problem
  solving and organizational skills. Candidates will be
  expected to demonstrate systems design, project management,
  and mentorship skills as well.

  What we're looking for

  - Strong technical talent - you have deep experience building,
    deploying, monitoring and scaling modern serverless or
    container-based systems
  - A bias for action - you can move quickly and prefer to
    launch and gather early data over absolute perfection. You
    know when to hack a solution vs. build robust systems for
    the long term
  - Good product sense - you can weigh tradeoffs and suggest
    creative solutions to delivering the best overall product
    to our customers, even with resource and time constraints
  - Autonomous - You enjoy choosing what you work on and are
    responsible for maximizing your own impact

  What you’ll work on:

  - Architect and build systems from scratch, making the right
    tradeoffs for risk and long-term maintainability
  - Lead, build, test, and release products with stringent
    correctness and scalability requirements. These products
    include personal finance scenario builders, tax
    calculators, and more
  - Tackle complex integrations within the personal finance
    space to enable smooth customer experiences and accurate
    financial reporting
  - You’ll shape the product strategy and tech organization:
    you’ll have significant input into our product development
    process - this includes helping to scope what we are
    building and how we are building it to optimize for both
    speed and elegant user experience
  - High Impact - Ability to drive real impact and help build a
    company from the ground up
  - Flexibility - We are a fully remote and distributed company.
    This means you can work from wherever you want!
  - Endless growth - We care about your professional and
    personal growth. Stretch into areas that interest you and
    grow with the company as we scale
  - Mission Driven - You’ll see the product of your work –
    directly improving the financial health of thousands of
    people in the US through access to high quality financial
    expertise
  - We believe that working remotely and flexibly is key to
    individual and team success, as such we have a small but
    talented US-based team that is spread throughout the
    globe.

  Our Tech Stack

  - Typescript
  - NodeJS frameworks NestJS and NextJS
  - Terraform and Cloudformation
  - Postgres and Redshift

  Perks & Benefits

  - Competitive salary
  - 401(k) & Employer Match
  - Work from anywhere
  - Health insurance & wellness benefits
  - Equity compensation
  - Generous parental leave
  - Unlimited vacation
  - Company offsites
  - Unlimited access to financial professionals

