description: |
  Airbnb was born in 2007 when two hosts welcomed three guests
  to their San Francisco home, and has since grown to over 5
  million hosts who have welcomed over 2 billion guest
  arrivals in almost every country across the globe. Every
  day, hosts offer unique stays and experiences that make it
  possible for guests to connect with communities in a more
  authentic way.

  The Community You Will Join

  AirCover protects Hosts and guests on Airbnb, including Host
  liability insurance, Experiences liability insurance and
  Host damage protection. As the Engineering Manager for the
  AirCover Insurance Platform, you will lead the system that
  lets Airbnb launch, price, enroll and service insurance
  products in new regions, and that lets the business test
  what drives Hosts and guests to be covered. You will lead a
  team of senior and staff engineers across backend
  engineering through the platform's next phase: from region-
  by-region builds to a configurable, globally scalable
  platform, and from ad hoc tests to a rigorous
  experimentation engine that raises attach rates. The team
  partners closely with Product, Design, Data Science, Legal,
  Insurance and Finance, and with teams across Airbnb that
  depend on AirCover.

  The Difference You Will Make

  - Scale the insurance platform to new countries and products
    by making regulatory, pricing, coverage and enrollment
    rules configurable rather than rebuilt for each region.
  - Build the experimentation foundation that lets Product and
    Data Science test coverage offers, pricing, placement and
    messaging, and measure their effect on attach rate.
  - Deliver a multi-year platform roadmap and global rollout on
    a fast-growing team with greenfield opportunities.
  - Apply data and LLM-driven automation where it improves
    coverage decisions, quality and the Host and guest
    experience.
  - Grow a team that owns initiatives end to end, in an
    inclusive environment that values well-being and
    sustainable engineering practices.

  A Typical Day

  - Work with senior leaders to define the long-term technical
    strategy and architecture for the AirCover insurance
    platform.
  - Partner with Product, Data Science, Legal and Insurance
    leaders to set priorities across regional expansion,
    attach-rate growth and platform reliability.
  - Lead the team to build reliable, auditable and scalable
    systems for policy and coverage management, enrollment,
    pricing inputs and experimentation.
  - Own the team roadmap, technical direction and operational
    health, including incident response and on-call quality.
  - Align stakeholders and adjacent teams on shared standards
    and a common platform approach.
  - Work with data scientists and ML engineers to incorporate
    their insights and models into experimentation, so the
    business can test and improve attach rates.
  - Stay close to the code through design and code reviews.
  - Hire, mentor and develop engineers, and support their career
    growth.

  Your Expertise

  - 10+ years of relevant experience in the tech industry,
    including 5+ years as an Engineering Manager owning large-
    scale software systems.
  - Track record of setting and holding a multi-year technical
    direction on a live, business-critical platform, including
    leading a major re-architecture or multi-region expansion
    while continuing to deliver.
  - Depth in backend platforms, with experience in distributed
    systems and high-availability services. Experience with
    insurance, payments, fintech or other regulated domains is
    a strong plus.
  - Strong product judgment exercised through data, including
    running experiments and using measurement to improve
    conversion or attach rate.
  - Experience managing and growing senior and staff engineers,
    and creating an environment where they own initiatives end
    to end.
  - Strong communication and influence with technical and non-
    technical partners, including Legal, Finance and
    Operations.
  - A proven track record of fostering a culture of Diversity
    and Belonging within the organization and across the tech
    community.

  Your Location

  This position is US - Remote Eligible. The role may include
  occasional work at an Airbnb office or attendance at
  offsites, as agreed to with your manager. While the position
  is Remote Eligible, you must live in a state where Airbnb,
  Inc. has a registered entity. If your position is employed
  by another Airbnb entity, your recruiter will inform you
  what states you are eligible to work from.

  Our Commitment To Inclusion & Belonging

  Airbnb is committed to working with the broadest talent pool
  possible. We believe diverse ideas foster innovation and
  engagement, and allow us to attract creatively-led people,
  and to develop the best products, services and solutions.
  All qualified individuals are encouraged to apply.

  We strive to also provide a disability inclusive application
  and interview process. If you are a candidate with a
  disability and require reasonable accommodation in order to
  submit an application, please contact us at:
  reasonableaccommodations@airbnb.com. Please include your
  full name, the role you're applying for and the
  accommodation necessary to assist you with the recruiting
  process. We ask that you only reach out to us if you are a
  candidate whose disability prevents you from being able to
  complete our online application.

  How We'll Take Care of You:

  Our job titles may span more than one career level. The
  actual base pay is dependent upon many factors, such as:
  training, transferable skills, work experience, business
  needs and market demands. The base pay range is subject to
  change and may be modified in the future. This role may also
  be eligible for bonus, equity, benefits, and Employee Travel
  Credits.

  Pay Range

  $212,000—$265,000 USD

  Reasonable Accommodations: We are committed to providing
  reasonable accommodations throughout the recruitment process
  for applicants with disabilities. If you need assistance, or
  an accommodation, please let your recruiter know once you
  are contacted about a role.

  A Note on Recruiting Scams: Scammers sometimes pose as
  Airbnb recruiters to get money or personal information from
  candidates. A few things that will always be true for
  Airbnb’s hiring process: our open roles are posted on
  Airbnb’s Career’s Page at careers.airbnb.com, and our
  recruiters correspond only from @airbnb.com or
  @ext.airbnb.com email addresses. Our recruiters will never
  ask for your Social Security number, bank account details,
  passport, or payment app information while you are
  interviewing.  We’ll also never ask you to pay a fee, send
  money, deposit or cash a check, or purchase work-related
  equipment (such as a company laptop) during the interview
  process. We encourage candidates to remain vigilant of these
  recruiting scams and not share sensitive information if you
  do not believe an individual is actually affiliated with
  Airbnb.
