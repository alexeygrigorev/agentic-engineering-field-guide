description: |
  About Neo4j:

  Neo4j is the graph intelligence platform that transforms
  data into knowledge to power the next generation of
  intelligent applications and AI systems. It includes
  enterprise-ready knowledge graphs for accurate, explainable,
  and governed AI; the most comprehensive, trusted, and easy-
  to-deploy graph capabilities across any environment and data
  source; and an unmatched ecosystem trusted by 84 of the
  Fortune 100 and supported by the world’s largest graph
  community. Intelligence that works. Results that matter.

  Built to work everywhere and integrate with everything
  across every cloud for dynamic, personalized, and autonomous
  AI systems. We deliver quicker results, contextual
  knowledge, and solutions that impact customers and employees
  across the business.

  Our Vision:

  At Neo4j, we have always strived to help the world make
  sense of data.

  As business, society and knowledge become increasingly
  connected, our technology promotes innovation by helping
  organizations to find and understand data relationships. We
  created, drive and lead the graph database category, and
  we’re disrupting how organizations leverage their data to
  innovate and stay competitive.

  The Team:  In the Connectors team, we have six engineers.
  Our work enables Neo4j to connect with the data ecosystem,
  facilitating the movement of data from other systems into a
  graph for analysis and returning the results to various
  business systems. We build on a vast variety of
  technological stacks, from building products on top of
  Apache Kafka, Apache Spark, and Apache Beam to integrating
  Neo4j into Google Dataflow Templates and Microsoft Fabric.
  We also build backend components for our Data Importer
  product, including deployment of those into our Kubernetes-
  based infrastructure. At times, we also need to build
  frontends for our customers to interact with what we build.

  The Role:

  We are constantly building new or improving existing
  connectors for Neo4j, making our database accessible from a
  wider range of environments, including widely used big data
  and data warehouse products in the cloud and on-premise,
  while also helping improve the core database’s data
  ingestion capabilities with new features.

  As a software engineer in the Connectors team, you’ll:

  - Be part of designing and architecting connectors for the
    Neo4j database
  - Build and maintain new and existing connectors for various
    technologies
  - Design new streaming/data ingestion APIs to make Neo4j
    faster and easier to use for our customers
  - When necessary, work across teams to enhance our core
    database features
  - Occasionally, build front-ends for connectors or
    integrations that require user interaction

  What you'll bring to this role:

  - You have 5+ years of experience developing production-level
    software
  - You have experience designing multi-threaded systems and
    algorithms
  - You have hands-on experience with backend programming
    languages, such as Kotlin, Java, or Go
  - You ideally have professional experience developing software
    systems, either in cloud or on-premises, involving either
    of the following;

  Nice-to-have:

  - Experience with graph databases such as Neo4j or other
    SQL/NoSQL databases
  - Experience in frontend development, ideally with React and
    TypeScript

  We encourage you to apply even if you don’t have experience
  across all of these areas, since the team will have a mix of
  different skills.

  #LI-Hybrid

  Why Join Neo4j?

  Neo4j is, without question, the most popular graph
  intelligence platform in the world. We have customers in
  every industry globally, and our products are a proven
  product/market fit. Joining our team is an opportunity to
  shape the future of data and analytics. Below are just a few
  exciting facts about Neo4j.

  - Neo4j is one of the fastest-scaling technology companies in
    this industry. It recently surpassed $200M in annual
    recurring revenue (ARR), doubling its ARR over the past
    three years.
  - Raised the biggest funding round in database history ($325M
    Series F). Backed by world-class investors like Eurazeo,
    GV (formerly Google Ventures), and Inovia Capital, Neo4j
    has raised over $600M in funding and is currently valued
    at over $2Bn. This puts Neo4j among the most well-funded
    database companies in history.
  - 84% of the Fortune 100 and 58% of the Fortune 500 use Neo4j.
    Examples include Boston Scientific, BT Group, Caterpillar,
    Cisco, Comcast, Department for Education UK, eBay, NBC
    News, Novo Nordisk, Worldline, and others.
  - Co-founder and CEO Emil Eifrem has built an amazing culture
    that prides itself on relationships, inclusiveness,
    innovation, and customer success.
  - Countless industry awards. Massive enterprises and
    individual developers/data scientists love Neo4j. A strong
    sense of community and ecosystem is built around the
    platform.
  - A recent Forrester Total Economic Impact™ Study cited Neo4j
    as delivering 417% ROI to customers.

  Research shows that members of underrepresented communities
  are less likely to apply for jobs when they don’t meet all
  the qualifications. If this is part of the reason you
  hesitate to apply, we’d encourage you to reconsider and give
  us the opportunity to review your application. At Neo4j, we
  are committed to building awareness and helping to improve
  these issues.

  One of our central objectives is to provide an inclusive,
  diverse, and equitable workplace for everyone to develop
  their potential and have a positive, career-defining
  experience. We look forward to receiving your application.

