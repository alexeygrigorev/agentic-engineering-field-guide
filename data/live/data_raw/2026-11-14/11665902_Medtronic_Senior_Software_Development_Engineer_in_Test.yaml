description: |
  Careers that change lives start here. Medtronic is a global
  leader in healthcare technology with a Mission to alleviate
  pain, restore health, and extend life. Our 95,000 employees
  work across more than 150 countries to put patients first —
  developing innovative medical technologies that improve the
  lives of 72+ million patients each year. Your unique talents
  will help shape the future of healthcare while building a
  career grounded in purpose, growth, and impact.

  A Day in the Life

  The Digital Technologies Business Unit (DTBU) at Medtronic
  is implementing cutting-edge AI technology, computer vision,
  and augmented reality in the operating room (OR) to augment
  surgical coaching, and eventually, performance. Our goal is
  to deliver safer surgery around the world. Our Touch
  SurgeryTM Video solution is an innovative video management
  and data analytics platform for hospitals that includes the
  DS1 Computer, our first OR device, allowing surgeons, OR
  team members, and trainees to securely access videos of
  their procedures shortly after surgery.

  As a Senior Software Development Engineer in Test you’ll
  play a pivotal role in shaping our software development
  lifecycle by designing and building automated test solutions
  that ensure the reliability, safety, and performance of our
  embedded and connected hardware platforms used in the
  operating room. This role focuses on testing device
  software, firmware integrations, and hardware-software
  interaction, rather than web or mobile applications.

  You’ll collaborate closely with engineering teams to embed
  quality at every stage, leverage modern automation
  frameworks, and help drive continuous improvement in our
  testing practices. If you are passionate about developing
  robust automation and elevating product quality through
  software, we want to hear from you.

  Primary Responsibilities:

  - Design, develop, and maintain robust automated test
    frameworks and tools for device software, focusing on
    scalable, reusable solutions.
  - Collaborate with software engineers to define test
    scenarios, testable architectures, and drive quality
    through code.
  - Develop, implement and execute advanced test automation
    strategies for embedded, edge, and device-integrated
    systems (Android AOSP, Linux-based edge devices, IoT
    gateways), including validation of device drivers,
    connectivity modules, and firmware updates.
  - Analyse requirements and develop comprehensive test plans
    and protocols for a range of technologies, including
    service APIs (REST, IPC), WebUI, and over-the-air updates.
  - Contribute to continuous integration and deployment (CI/CD)
    pipelines with automated quality gates.
  - Generate and maintain technical documentation, standards,
    and best practices for test, automation and quality
    engineering.
  - Collaborate with hardware, firmware, and systems engineers
    to validate device performance, connectivity, and
    stability under real-world operating conditions.
  - Must be able to commute frequently to London-based office;
    3~4 days per week onsite.

  Required Qualifications:

  - Bachelor’s degree in Computer Science, Engineering, or
    related field (or equivalent international degree).
  - Relevant experience in software automation and test
    development.
  - Strong proficiency in software development for test
    automation (Python, Java, or equivalent).
  - Hands-on experience with manual test management tools and
    test automation frameworks (Selenium, Appium, Espresso,
    etc.).
  - Familiarity with CI/CD tools (e.g., Jenkins, GitHub Actions,
    Azure DevOps).
  - Device operating systems (Android, Linux).
  - Service-oriented architecture (SoA), APIs (REST, IPC).
  - Hands-on experience testing embedded or connected hardware
    devices, preferably involving edge computing or IoT
    systems.
  - Strong understanding of hardware-software interaction,
    debugging logs, and analysing system-level behaviour.
  - Familiarity with firmware validation, board bring-up
    testing, or similar.
  - Web-based interfaces, Internet-connected devices, OTA
    updates.
  - Highly technical, hands-on, and passionate about product
    quality.
  - Demonstrated ability to design and implement automated
    solutions, not just execute manual tests.
  - Self-starter, autonomous, and able to lead initiatives
    independently.

  Preferred Qualifications:

  - Experience with embedded device software development,
    hardware-in-the-loop testing, device connectivity (USB,
    Wi-Fi, Bluetooth), and video streaming or imaging devices.
  - Familiarity with medical device standards (IEC 62304) and
    safety-critical testing.

  Physical Job Requirements The above statements are intended
  to describe the general nature and level of work being
  performed by employees assigned to this position, but they
  are not an exhaustive list of all the required
  responsibilities and skills of this position.

