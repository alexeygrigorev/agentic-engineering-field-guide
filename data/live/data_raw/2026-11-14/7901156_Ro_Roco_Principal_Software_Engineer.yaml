description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role



  We’re looking for a Principal Software Engineer to serve as
  a senior technical leader across Ro’s engineering
  organization. In this role, you’ll help shape the long-term
  direction of our platform, guide the evolution of critical
  systems, and drive architectural decisions that enable Ro to
  scale safely, sustainably, and quickly.  You’ll partner
  across engineering, product, design, and cross-functional
  leadership to define technical strategy, anticipate risks,
  mentor senior engineers, and guide teams toward resilient,
  maintainable, high-quality solutions. This role is ideal for
  someone energized by system-wide impact, complex technical
  challenges, and helping raise the engineering bar across Ro.

  What You’ll Do

  - Define and drive the architectural vision for key systems
    and platforms, ensuring scalability, reliability,
    resilience, and long-term maintainability.
  - Evaluate and recommend foundational technologies, patterns,
    and practices that position Ro for future growth.
  - Translate complex, ambiguous problem spaces into clear
    technical roadmaps, identifying tradeoffs and guiding
    teams toward strategic solutions.
  - Lead organization-wide initiatives that improve system
    health, observability, performance, security, and
    operational excellence.
  - Partner with product, design, data, and other teams to align
    technical strategy with business priorities.
  - Break down large, multi-team initiatives into actionable
    plans and drive them from concept to delivery.
  - Mentor and support Staff, Senior, and early-career engineers
    in both technical and strategic growth.
  - Foster a culture of high-quality engineering, thoughtful
    design, rigorous review, and continuous learning.
  - Provide technical leadership in design reviews, architecture
    discussions, and cross-team forums.
  - Act as a trusted technical advisor to engineering leadership
    and cross-functional partners.

  What You’ll Bring to the Team

  - 12+ years of experience building scalable, maintainable
    software systems
  - A proven track record of technical leadership across
    multiple teams or domains, including designing and
    evolving complex distributed systems.
  - Deep expertise in backend engineering (preferably with a
    strong proficiency in Python) and experience with
    distributed systems and relational databases.
  - Experience in metrics instrumentation and data-driven
    performance tuning, leveraging load testing infrastructure
    and tools like Datadog.
  - Strong architectural skills with the ability to reason about
    long-term tradeoffs, system interactions, operational
    risks, and platform evolution.
  - Demonstrated ability to influence technical strategy, drive
    alignment across multiple teams, and guide organizations
    through ambiguity.
  - Exceptional communication skills with the ability to
    articulate technical concepts to both technical and non-
    technical audiences.
  - A passion for and strong track record of developing other
    engineers and raising the technical bar through
    mentorship, coaching, and leadership.

  Bonus Skills

  - Experience in telehealth or other highly-regulated
    industries.

  We’ve Got You Covered

  - Full medical, dental, and vision insurance + OneMedical
    membership
  - Healthcare and Dependent Care FSA
  - 401(k) with company match
  - Flexible PTO
  - Wellbeing + Learning & Growth reimbursements
  - Paid parental leave + Fertility benefits
  - Pet insurance
  - Student loan refinancing
  - Virtual resources for mindfulness, counseling, and fitness

  The target base salary for this position ranges from
  $266,100 to $340,000, in addition to a competitive equity
  and benefits package (as applicable). When determining
  compensation, we analyze and carefully consider several
  factors, including location, job-related knowledge, skills
  and experience. These considerations may cause your
  compensation to vary.

  Ro is consistently recognized as a top workplace in Health
  Care, in New York, and for Women and Parents—earning more
  than 20 honors from Fortune, Great Place to Work, and PEOPLE
  since 2021. In 2025 alone, we ranked top 5 among medium
  workplaces in Health Care and New York, and top 50
  nationwide.



