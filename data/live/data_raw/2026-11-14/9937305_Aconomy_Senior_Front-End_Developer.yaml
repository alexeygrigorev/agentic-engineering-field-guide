description: |
  About Aconomy:Aconomy is a pioneering Real-World Asset (RWA)
  Decentralized Exchange (DEX) platform that leverages
  blockchain technology to enable the tokenization of assets
  and provide a seamless, decentralized trading experience.
  Our mission is to revolutionize the asset economy by
  creating a truly decentralized ecosystem for asset owners,
  validators, and investors.

  Job Description:

  We are looking for a talented and experienced Senior Front-
  End Developer to join our dynamic team. The ideal candidate
  will have a strong background in front-end development, a
  deep understanding of Web3 technologies, and a passion for
  building innovative, user-friendly interfaces. As a Senior
  Front-End Developer, you will play a critical role in
  shaping the user experience and interface of Aconomy's
  platform.

  Key Responsibilities:

  - Develop and maintain high-quality, responsive user
    interfaces for Aconomy's web applications using modern
    JavaScript frameworks (e.g., React) and technologies
    (e.g., TypeScript, HTML, CSS).
  - Collaborate with designers, product managers, and back-end
    developers to create seamless and visually appealing user
    experiences, participating in product design sessions and
    feature development.
  - Optimize front-end architecture to ensure high performance,
    scalability, and maintainability, and build platforms,
    systems, and services for internal and external teams.
  - Integrate with Web3 technologies, including blockchain APIs
    and smart contracts, to enhance the platform's
    functionality and enable decentralized applications
    (dApps).
  - Troubleshoot and resolve front-end issues, ensuring a smooth
    user experience, and stay up-to-date with the latest
    development trends and best practices.
  - Mentor and guide junior developers, fostering a culture of
    continuous learning and improvement within the team, and
    contribute to developing mobile-first applications and
    PWAs.

  Qualifications:

  - Bachelor's degree in Computer Science, Engineering, or a
    related field.
  - Proven experience as a front-end developer, with a strong
    portfolio of web applications.
  - Proficiency in modern JavaScript frameworks and libraries
    (e.g., React, Angular, Vue.js).
  - Solid understanding of HTML, CSS, and responsive design
    principles.
  - Experience with version control systems (e.g., Git) and
    collaborative development workflows.
  - Familiarity with Web3 technologies, blockchain, and
    decentralized applications (dApps).
  - Strong problem-solving skills and attention to detail.
  - Excellent communication and collaboration skills, with the
    ability to work effectively in a team environment.
  - Ability to thrive in a fast-paced, dynamic startup
    environment.

  Apply for this post if you possess:

  - A passion for building intuitive and engaging user
    interfaces.
  - Expertise in front-end development, with a focus on
    performance and scalability.
  - Experience integrating Web3 technologies into web
    applications.
  - A proactive attitude and a willingness to take ownership of
    complex projects.
  - The ability to mentor and guide junior developers.

  We highly recommend you apply if you have:

  - Experience working in the Blockchain/Web 3.0 space or a
    strong interest in emerging technologies.
  - A track record of delivering successful projects in a fast-
    paced, agile development environment.
