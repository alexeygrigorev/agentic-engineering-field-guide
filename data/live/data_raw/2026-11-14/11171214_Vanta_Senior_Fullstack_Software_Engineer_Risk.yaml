description: |
  At Vanta, our mission is to help businesses earn and prove
  trust. We believe that security should be monitored and
  verified continuously, and we empower companies to practice
  better security and prove it with ease. Vanta has a kind and
  talented team, and while some have prior security
  experience, many have been successful at Vanta without it.

  The Risk pillar builds products that help customers
  understand and act on exposure across their organizations.
  Our work spans AI and data governance, privacy, identity and
  access, workforce security, enterprise risk management, and
  third-party oversight. These areas come together through
  Vanta's Trust Graph, which connects people, agents, data,
  controls, assets, and vendors to turn fragmented signals
  into clear context, prioritization, and action.

  As a Senior Fullstack Engineer, you'll lead product
  engineering work end to end across the stack, partnering
  closely with product and design to turn ambiguous customer
  problems into simple, high-quality experiences. This role
  offers a unique opportunity to shape a critical and rapidly
  growing area of Vanta's product. Depending on team
  priorities, you might build AI-powered workflows that let
  the Vanta Agent take on operational work, systems that
  transform connected signals into trustworthy
  recommendations, or intuitive experiences for complex
  internal and third-party programs. You'll tackle unique
  technical challenges and help customers move from manual,
  disconnected work to continuous, informed decision-making.

  Our business has achieved strong product-market fit and has
  monetized effectively since the day we signed our first
  customer. As Vanta continues to scale, engineers have
  meaningful opportunities to accelerate their growth and
  contribute directly to the company's next stage.

  What you'll do as a Senior Fullstack Engineer at Vanta:

  - Identify, scope, and lead large technical projects, laying
    the groundwork for core products to evolve and scale into
    highly performant, reliable, and customizable systems
  - Own customer-facing product experiences from understanding
    the user problem and shaping the solution through
    implementation, launch, measurement, and iteration
  - Make effective tradeoffs that consider business priorities,
    user experience, and a sustainable technical foundation
  - Build reliable, secure systems that connect and interpret
    data across people, agents, assets, controls, vendors, and
    other critical business context
  - Partner with product, design, domain experts, and other
    engineers to bring AI-powered workflows from exploration
    to production, with a high bar for quality,
    explainability, and customer trust
  - Use AI thoughtfully throughout the development lifecycle to
    prototype, build, test, and learn faster, while
    maintaining a high bar for quality, security, and
    maintainability
  - Work with talented and kind engineers to make a significant
    impact on our customer base, enabling them to improve
    their security and prove it
  - Lead complex projects with multiple stakeholders and
    engineers to deliver significant impact to our business
  - Set direction for critical technical surface areas, enabling
    us to stay ahead of continued rapid growth
  - Contribute to building Vanta’s engineering culture as we
    grow

  How to be successful in this role:

  - Have 7+ years of full stack experience with an emphasis on
    backend skills
  - Have played technical leadership roles for teams or complex
    projects
  - Have strong communication and collaboration skills
  - Have experience building user-facing SaaS products, ideally
    both for startups and enterprise users
  - Have previous startup experience, or worked in an
    environment that prioritizes a bias for action
  - Have experience building 0→1 products as well as solving
    large scale problems
  - Have an interest in learning about security, risk, privacy,
    or AI governance, or prior experience in one or more of
    these spaces
  - Experience with TypeScript and Go is a plus. Experience
    building AI-powered product experiences, evaluating AI
    quality, or using modern AI development tools is also
    valuable, but not required.

  What you can expect as a Vanta’n:

  - Industry-competitive salary and equity
  - 100% covered medical, dental, and vision benefits with
    dependents coverage
  - 16 weeks paid Parental Leave for all new parents
  - Health & wellness stipend
  - Remote workspace, internet, and mobile phone stipend
  - Commuter benefits for team members who attend the office
  - Pension matching
  - 25 days of Annual Leave per year and unlimited sick time
  - 8 company-paid holidays
  - Virtual team building activities, lunch and learns, and
    other company-wide events!
  - Offices in SF, NYC, London, Dublin, Tel Aviv, and Sydney

  #LI-remote

  At Vanta, we are committed to hiring diverse talent of
  different backgrounds and as such, it is important to us to
  provide an inclusive work environment for all. We do not
  discriminate on the basis of race, gender identity, age,
  religion, sexual orientation, veteran or disability status,
  or any other protected class. As an equal opportunity
  employer, we encourage and welcome people of all backgrounds
  to apply.

  About Vanta

  We started in 2018, in the wake of several high-profile data
  breaches. Online security was only becoming more important,
  but we knew firsthand how hard it could be for fast-growing
  companies to invest the time and manpower it takes to build
  a solid security foundation. Vanta was inspired by a vision
  to restore trust in internet businesses by enabling
  companies to improve and prove their security. From our
  early days automating security monitoring for compliance
  standards like SOC 2, HIPAA and ISO 27001 to creating the
  world's leading Trust Management Platform, our vision
  remains unchanged.

  Now more than ever, making security continuous—not just a
  point-in-time check— is essential. Thousands of companies
  rely on Vanta to build, maintain and demonstrate their
  trust— all in a way that's real-time and transparent.

  Referral Instructions

  If you are being referred for the role, please contact that
  person to apply on your behalf.
