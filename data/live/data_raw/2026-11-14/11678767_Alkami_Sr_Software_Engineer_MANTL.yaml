description: |
  Alkami is the digital sales and service platform provider
  for U.S. banks and credit unions. Our unified Platform
  integrates onboarding, digital banking, and data and
  marketing—each solution can stand alone, but together they
  deliver more—to help institutions onboard, engage, and grow
  relationships. As the future shifts toward Anticipatory
  Banking, we help data-informed bankers meet the moment with
  technology that drives action.

  Founded in 2009, we continue to be recognized for our
  intentional culture and tremendous growth (Best Place to
  Work in Fintech; Best & Brightest to Work For Nationally;
  and Comparably’s Best Company Culture, Best Career Growth,
  Best Engineering Team, and Best Places to Work in Dallas,
  among others). We’re building a culture where each Alkamist
  can perform to their highest potential, and we’re always on
  the lookout for the best and brightest minds. If you’re
  ready to experience the power of alchemy - transforming the
  ordinary into the extraordinary - come join one of the
  fastest growing SaaS companies in the U.S.

  As a remote-first company, most of our positions can be
  remote in the US, except for key roles, which will be
  indicated in the Job Title.

  Follow us on Glassdoor and LinkedIn!

  The Sr. Software Engineer is a senior individual contributor
  who sets technical direction and delivers complex, cross-
  team software capabilities across Alkami's digital banking
  platform. This role turns ambiguous product and business
  needs into scalable system designs, robust APIs, secure
  integrations, and intuitive experiences for financial
  institution administrators and digital banking users. The
  position partners with product, design, security,
  architecture, site reliability, data, and engineering teams
  to manage tradeoffs, improve reliability and developer
  effectiveness, and raise engineering standards through
  mentorship, reviews, and hands-on delivery. The Staff
  Software Engineer is accountable for code quality and
  operational outcomes while influencing without direct
  people-management responsibility.

  Essential Duties & Responsibilities:

  - Lead cross-team delivery across experiences, services, APIs,
    data, and integrations.
  - Turn ambiguous product and business needs into technical
    strategies, delivery plans, and measurable outcomes.
  - Set architecture across domains, document tradeoffs, and
    align teams on scalable, secure patterns.
  - Write and review tested code in TypeScript and Node.js,
    Python, Go, or similar languages for full stack
    applications
  - Design secure APIs, domain models, microservices, workflows,
    and data contracts.
  - Build for reliability and performance using error handling,
    observability, capacity planning, graceful degradation,
    and recovery patterns.
  - Lead third-party integration design across authentication,
    privacy, data mapping, rate limits, retries, idempotency,
    monitoring, and vendor failures.
  - Drive cross-team execution by managing dependencies,
    sequencing work, reducing risk, and making timely
    decisions when tradeoffs are unclear.
  - Mentor engineers through reviews, pairing, documentation,
    and hands-on coaching.
  - Partner with product, design, security, architecture, site
    reliability, data, and engineering leaders to balance
    speed, experience, operability, and risk.
  - Lead incident response and root-cause analysis, driving
    prevention and operational readiness.
  - Improve engineering effectiveness through reusable patterns,
    automated tests, CI/CD, developer tooling, and secure,
    human-reviewed use of AI-assisted tools.

  Recommended Experience & Education

  Minimum Years of Experience

  Typically requires a minimum of 8 years of related
  experience; or 6 years and an advanced degree.

  Education Level Bachelor’s degree in engineering, or another
  related field or equivalent work experience

  Knowledge, Skills, & Qualifications

  Required

  - Experience delivering complex production software and
    leading technical direction across teams or domains
  - Deep proficiency in TypeScript and Node.js, Python, Go, or
    similar languages for frontend and/or backend use, with
    the ability to work across the stack
  - Advanced system design across domain-driven design,
    microservices, REST APIs, distributed systems, data
    stores, and integrations
  - Strong discipline in testing, error handling, observability,
    performance, security, and maintainable delivery
  - Ability to influence without authority, communicate
    architecture clearly, and mentor engineers through reviews
    and hands-on guidance
  - Ability to turn ambiguity into pragmatic plans, manage
    cross-team dependencies, and drive measurable outcomes
  - Experience in Agile, iterative delivery and improving team
    practices through feedback and continuous learning

  Preferred

  - Experience in SaaS, FinTech, digital banking, payments, or
    another regulated technology environment
  - Experience with ReactJS, NestJS, or comparable frontend and
    backend frameworks
  - Experience with GraphQL
  - Experience designing third-party integrations for financial
    data, identity, or communications platforms
  - Experience with cloud platforms, containers, orchestration,
    infrastructure as code, or event-driven architecture

  Physical Demands

  - Ability to lift a minimum of 5 pounds to a maximum of 10
    pounds unassisted
  - Ability to stand, sit, stoop, walk, stretch, reach, and use
    full range of body motions
  - Manual dexterity as required for specific equipment

