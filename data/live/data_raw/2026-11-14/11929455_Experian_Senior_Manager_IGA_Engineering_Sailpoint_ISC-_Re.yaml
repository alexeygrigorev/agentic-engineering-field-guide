description: |
  Company Description

  Experian is a global data and technology company, powering
  opportunities for people and businesses around the world. We
  operate across a range of markets, from financial services
  to healthcare, automotive, agribusiness, insurance, and many
  more. Experian invests in people and new advanced
  technologies to unlock the power of data. We have an amazing
  team of 25,200 people in 32 countries.

  Job Description

  The Senior Manager, Identity Governance & Administration
  will lead the engineering team responsible for enterprise
  identity governance services. You will set the technical
  direction for SailPoint Identity Security Cloud, identity
  lifecycle management, and governance for both human and non-
  human identities. You will partner with security,
  architecture, cloud, application, and compliance teams to
  strengthen identity security across the organization.

  This is a Remote position. You will report to the Director
  of IGA.

  You will have opportunity to:

  - Lead a team of Identity Governance engineers.
  - Set the technical strategy and engineering standards for
    enterprise IGA services.
  - Lead the architecture, implementation, and operation of
    SailPoint Identity Security Cloud.
  - Oversee identity lifecycle management, access requests,
    certifications, provisioning, and policy workflows.
  - Guide migrations from legacy identity platforms to SailPoint
    ISC.
  - Establish governance for service accounts, machine
    identities, cloud service principals, bots, and other non-
    human identities.
  - Expand automation through APIs, custom connectors, GitOps,
    Infrastructure as Code, automated testing, and DevSecOps
    practices.
  - Partner with business and technology leaders to support
    application onboarding, cloud transformation, regulatory
    compliance, and operational reporting.

  Qualifications

  - 8+ years of experience in Identity and Access Management or
    Identity Governance engineering.
  - 5+ years of experience managing software engineering or
    identity engineering teams.
  - Hands-on experience implementing and operating SailPoint
    Identity Security Cloud.
  - Experience leading enterprise SailPoint implementations from
    architecture through production support.
  - Experience with identity lifecycle management, access
    certifications, provisioning, RBAC, ABAC, and governance
    workflows.
  - Experience developing identity integrations using APIs,
    connectors, and automation.
  - Experience with Agile delivery, DevSecOps, CI/CD, Git, and
    Infrastructure as Code.
  - Experience communicating technical strategy and program
    progress to senior leaders and cross-functional
    stakeholders.
  - #LI-Remote

