description: |
  Overview

  At the core of Microsoft Ads is a mission-critical, high-
  throughput real-time bidding (RTB) platform. It processes
  millions of auction requests per second, executes complex
  auction logic under strict latency constraints, and directly
  impacts revenue, win rate, partner satisfaction, and
  platform reliability.

  This Principal Software Engineer role owns core
  architectural and technical evolution of the platform,
  focusing on modernization, performance, scalability and
  operational excellence. The position requires deep expertise
  in low-latency distributed systems, solid leadership in
  large-scale refactoring and platform modernization, and
  close collaboration across engineering, data science and
  business stakeholders.

  The engineer in this role drives initiatives with company-
  level impact, ensuring our platform can continue to scale,
  evolve, and support future Microsoft Ads growth.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  AI Experiences employees who live within a 50- mile commute
  of a designated Microsoft Hub in the U.S. are expected to
  work from the office at least four days per week. This
  expectation is subject to local law and may vary by
  jurisdiction.

  Responsibilities

  - Own technical direction and execution for core components, a
    high-scale, latency-sensitive real-time bidding service at
    the heart of Microsoft Ads.
  - Lead design and implementation of scalable, high-performance
    backend systems operating under strict latency and
    reliability requirements.
  - Drive platform modernization and long-term sustainability of
    critical services, improving code quality,
    maintainability, and operational safety.
  - Ensure performance, scalability, and stability of the
    service as traffic, data volume, and business requirements
    continue to grow.
  - Define and evolve instrumentation, observability, and
    experimentation capabilities to support data-driven
    decision making and safe production changes.
  - Collaborate closely with cross-functional partners
    (engineering, data science, experimentation, product, and
    infrastructure) to align technical solutions with business
    goals.
  - Provide technical leadership and mentorship, influencing
    architecture decisions and engineering best practices
    across teams.

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Other Requirements: Ability to meet Microsoft, customer
  and/or government security screening requirements are
  required for this role. These requirements include but are
  not limited to the following specialized security
  screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 8+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 12+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.
  - Experience working on high-throughput, production systems
    where scalability, latency, and stability are critical.
  - Demonstrated ability to design, evolve, and maintain complex
    systems over time.
  - Experience collaborating with cross-functional teams to
    deliver solutions aligned with business needs.
  - Problem-solving skills and ability to analyze and address
    performance or reliability issues in production
    environments.
  - Experience with real-time bidding systems, ad tech, or high-
    frequency decision systems.
  - Familiarity with experimentation platforms, A/B testing, or
    traffic shaping systems.
  - Experience working with ML-driven decision systems or
    integrating models into production pipelines.
  - Exposure to large-scale data processing or feature
    pipelines.
  - Experience with cloud environments and modern deployment
    practices.

