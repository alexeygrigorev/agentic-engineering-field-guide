description: |
  About Conduit Health

  Conduit Health is transforming one of the most outdated
  corners of post-acute care—getting essential medical
  equipment and supplies into patients' homes. We're the first
  vertically integrated, AI-powered platform to unite
  ordering, telehealth, prescriptions, insurance, and
  fulfillment into one seamless experience. In seconds, case
  managers and providers can say "yes" to patients who would
  otherwise wait weeks — while we handle every step behind the
  scenes.

  The Role

  We’re looking for software engineers who are excited to
  build the next generation of Conduit Health’s patient
  experience. You’ll be responsible for owning and shipping
  high impact products that directly affect outcomes. You'll
  join a small (but quickly growing!) team of engineers
  building the platform that's transforming patients’ access
  to medical equipment.

  Our product-market fit is proven and demand is growing every
  day. We are scaling up our engineering team to meet that
  demand.

  You'll implement major features end-to-end, make
  architectural decisions that affect the entire platform, and
  have the ability to directly influence the engineering
  culture and how we build software.

  You can expect to tackle a wide range of challenges:

  - Streamlining fulfillment: turning complex manual workflows
    into elegant automations, leveraging a combination of
    traditional deterministic approaches and modern AI/agentic
    tools.
  - Enhancing our end-user experience: building high growth
    customer-facing applications that directly impact our
    patients and their caretakers
  - External integrations: Building external facing APIs and
    other creative AI-driven solutions to give our partners
    ways to automate their workflows
  - Being scrappy: Running experiments, proof of concepts, and
    being genuinely curious in ways that shape the product
    roadmap.

  All while elevating the bar of how Conduit Health approaches
  engineering. This role reports directly into the Head of
  Engineering.

  You’re the right fit if:

  - You’re a builder who enjoys being hands on and excited about
    owning features from 0 to 1
  - You're a product minded engineer who likes to be involved in
    the "what" and "why" of the features we build
  - You're a strong communicator, both technically and non-
    technically.
  - You’ve worked in early stage, high growth startup
    environments where you’ve had a measurable, direct impact
  - You have a team-oriented mindset: you are low-ego, deeply
    value good communication, documenting your thought
    processes, giving/receiving constructive feedback, and
    embracing collaboration.
  - You’re comfortable working across the stack (although we
    understand when folks lean towards one side)
  - You have deep experience in at least some parts of our
    stack: Python, Typescript, React, Postgres, MongoDB,
    Kubernetes, AWS
  - Your workflow involves deep usage of LLMs/agentic tools, and
    you know how to use them most effectively
  - You know how to stay nimble, flexible, and deal with natural
    ambiguity in a growing startup environment

  Bonus points if:

  - You have experience in the healthcare industry
  - You’ve dealt with compliance requirements (HIPAA, SOC2, etc)

  Working with us

  Conduit Health is based in NYC, with an office in Union
  Square. Our engineering team works mostly remotely, with a
  preference for team members within commuting distance for
  ad-hoc team rituals.

  Why join us

  - Opportunity to have a real impact on the patient experience
  - Competitive base salary + equity
  - Unlimited PTO + 9 company holidays
  - Medical, Dental, and Vision benefits
  - 401k

  What to expect in the process?

  - Introductory call with the Head of Engineering
  - Cross functional interview with Product team
  - Technical assessment
  - Meet the founders
  - Offer
