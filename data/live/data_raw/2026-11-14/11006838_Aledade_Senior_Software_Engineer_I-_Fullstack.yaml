description: |
  As a Senior Software Engineer I - EHR Integrations,
  Fullstack, you are someone who has experience building “0 to
  1 products'', and you thrive in an ambiguous environment. As
  the Sr. SWE I on the team, you will be taking Aledade’s
  world class point of care insights (Dx suggestions,
  analytics, care suggestions) one step closer to the
  Electronic Health Record (EHR) systems that our partner
  practices use for patient management! You will be building
  cutting-edge full stack applications, built on top of
  constructs like interoperability standards (FHIR, HL7),
  chromium project overlay apps compatible with browser based
  EHR systems, as well as Windows desktop based EHR systems.
  Point of Care full stack application initiative is one of
  the key 2026-27 product investments.

  Here at Aledade, we're not just engineering software; we're
  engineering the future of healthcare. We’re on a mission to
  revolutionize healthcare delivery with cutting-edge
  technology. As part of the technology team at Aledade,
  you'll dive into the thrilling world of healthcare
  technology. You'll be part of a dynamic team that pushes
  boundaries and challenges the status quo. Your mission? To
  develop software that's not just code, but a catalyst for
  positive change in healthcare.

  Primary Duties:

  Minimum Qualifications:

  - BS/BTech (or higher) in Computer Science, Engineering or a
    related field.
  - 4+ years experience as an engineer as part of a cross-
    functional team.
  - 4+ years experience as an engineer building complex frontend
    (UI/UX) focused applications as part of a cross-functional
    team.
  - 4+ years of experience working with CSS/HTML/Javascript and
    modern JavaScript frameworks (e.g., React, Angular,
    VueJs/Ember).
  - 2+ years of experience acting as a trusted technical
    decision-maker in a team setting, solving for short-term
    and long-term business value.
  - 2+ years of experience coaching other engineers.

