  Physical Requirements:

  At Aledade PBC, you will be part of a creative culture that
  is driven by a passion for tackling complex issues with
  respect, open-mindedness and a desire to learn. You will
  collaborate with team members who bring a wide range of
  experiences, interests, backgrounds, beliefs and
  achievements to their work - and who are all united by a
  shared passion for public health and a commitment to the
  Aledade mission.

  Aledade offers the following comprehensive total rewards
  package designed for the overall well-being of our team
  members:

  Base salary range: $134,000 – $182,000 USD annually

  The range above reflects the base pay we reasonably expect
  to offer for this role across all U.S. locations. Where an
