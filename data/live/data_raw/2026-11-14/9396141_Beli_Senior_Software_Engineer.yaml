description: |
  By changing the way people explore restaurants, Beli has
  emerged as one of fastest-growing consumer platforms in the
  country. Beli helps you build organized restaurant lists and
  maps, share them with friends, and discover new spots around
  the world according to your personal taste.

  Job Overview

  At Beli, individual Software Engineers operate like full
  product teams. As a Software Engineer at Beli, you will be
  responsible for leading the research, design, architecture,
  implementation, testing, launching, measuring, and support
  of Beli iOS and Android app features. You will work closely
  with the CTO, CEO, and other software engineers to build
  features that drive user growth, engagement, and retention.

  Responsibilities

  - Product research and design
    - Conduct product, user, and quantitative research to inform
      the prioritization and design of app features
    - Design features using wireframes and Figma prototypes
    - Propose performant and scalable frontend and backend
      implementations
  - Implementation
    - Build features using Django, Postgres, Angular, and other
      technologies
    - Perform/implement tests, including QA, performance, unit,
      and integration tests
    - Determine the steps, timeline, and communication surrounding
      the release of new features
    - Conduct A/B tests and quantitative analyses to measure
      feature impact and identify opportunities for
      improvement
  - Support
    - Support existing features with bug fixes, enhancements, and
      by managing user outreach

  Qualifications

  - 5+ years as a full-time software engineer
  - Proven track record of implementing high-impact product
    features in a startup or high-growth environment
  - Highly skilled in Javascript/Typescript and Python
  - High user empathy and strong product mindset
  - Coursework or experience in statistics
  - Strong analytical and quantitative skills
  - Excellent communication and interpersonal skills
  - Grit, hustle, "roll up your sleeves" mentality, and
    intellectual curiosity

  Compensation

  Compensation will be determined based on experience and
  skills. This position also includes equity as part of the
  total compensation package.
