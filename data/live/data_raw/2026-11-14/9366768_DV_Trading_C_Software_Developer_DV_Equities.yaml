description: |
  About Us: Founded 20 years ago and headquartered in Chicago,
  the DV Group of financial services firms has grown to more
  than 600 people operating throughout North America, Europe
  and Asia. Since spinning out of a large brokerage firm in
  2016, DV Trading has rapidly scaled as an independent
  proprietary trading firm utilizing its own capital, trading
  strategies, and risk management methodologies to provide
  liquidity to worldwide financial markets and hedging
  opportunities to commodity producers and users. Now, DV
  group affiliates include two broker dealers, a
  cryptocurrency market making firm, and a bourgeoning
  investment adviser.

  Overview:  We are looking for an experienced software
  developer to join our DV Equities desk. In this role, you'll
  be responsible for development and daily operations of
  trading systems that provide services to traders.

  Job Responsibilities:

  - Lead in the design, implementation, and deployment of DV’s
    core trading platform in C++ 17
  - Bring deep technical knowledge such as parallel programming,
    trading systems, networking, or performance analysis
  - Work on cross-functional teams across trading, quant, and
    development to troubleshoot and solve complex problems
  - Work directly with trading desks on new feature requests

  Requirements:

  - Experience building performant, scalable applications in C++
  - Experience working on Linux
  - Solid understanding of multi-threaded/multi-core programming
    paradigms
  - Object-oriented design and programming experience
  - Highly collaborative in nature, with excellent written and
    verbal communication skills
  - Familiarity with options trading and trading systems is a
    plus
  - Bachelor’s degree in Computer Science, Engineering or a
    related field from an accredited institution

  DV is not accepting unsolicited resumes from search firms.
