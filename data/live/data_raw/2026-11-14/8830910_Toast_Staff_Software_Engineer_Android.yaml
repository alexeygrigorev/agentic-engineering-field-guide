description: |
  Staff Software Engineer, Android

  Location: Remote USA

  Who We Are

  Toast creates technology to help restaurants and local
  businesses succeed in a digital world, helping business
  owners operate, increase sales, engage customers, and keep
  employees happy.

  Are you bready* for a change?

  Toast currently serves hundreds of multi-unit brands,
  including Caribou Coffee, Choice Hotels, Craveworthy Brands,
  WaBa Grill, Nothing Bundt Cakes, Papa Gino's & D'Angelo,
  Costa Vida Fresh Mexican Grill, and The Human Bean, among
  others. We are looking for a Staff Software Engineer to join
  our enterprise drive-thru team and help us build the best-
  in-class drive-thru solutions that enable significant future
  growth. You will get to work across the entire Toast
  platform, including our scalable backend, customer-facing
  web apps, and everything else in between. As a member of the
  Drive-Thru Enterprise team, you will help ensure our
  products are built to meet the evolving needs of these
  customers. You can read more on our Toast for Enterprise
  Page.

  About this roll* (Responsibilities)

  - Define the long-term technical strategy and architecture for
    the Drive-Thru domain, balancing immediate delivery with
    long-term maintainability.
  - Standardize Android best practices across the organization,
    influencing how multiple teams build and deploy mobile
    features.
  - Architect the interface between mobile clients and complex
    backend services to ensure offline-resiliency in high-
    volume drive-thru environments.
  - Design, build, deploy, and maintain highly resilient and
    scalable features across Toast’s enterprise management
    products.
  - Identify high-impact opportunities within the Drive-Thru
    ecosystem and partner with Product and UX leadership to
    define the roadmap.
  - Bridge the gap between Android and backend systems to ensure
    a seamless, end-to-end enterprise experience.
  - Guide the growth & development of peer engineers with
    mentoring and coaching.
  - Foster a culture of engineering excellence by driving
    innovation and continuously improving engineering
    practices.

  Do you have the right ingredients*? (Requirements)

  - 8+ years of experience developing and maintaining Android
    applications
  - Experience with distributed systems, enterprise messaging
    systems, and/or microservices
  - Proficient with modern API standards and technologies (e.g.,
    REST, GraphQL)
  - Proven track record of leading teams through major
    architectural transformations and delivering high-impact,
    scalable solutions in multi-product environments.
  - Excellent communication skills, with the ability to
    articulate complex technical concepts to diverse audiences
  - Passionate about driving innovation and continuously
    improving engineering practices
  - Proven ability to influence non-technical stakeholders and
    align technical debt reduction with business value
  - Bachelor’s degree or higher in computer science

  What we use to make our dish (Our Tech Stack)

  - A core of Java & Kotlin based backend services.
  - React SPAs leveraging Tailwind, GraphQL, and Storybook.
  - Android app built in Java & Kotlin.
  - PostgreSQL and DynamoDB as core persistence.
  - Pulsar, Camel, and RabbitMQ for message-based integrations.
  - And many more technologies that help us build a top-class
    platform.

  AI at Toast

  At Toast, one of our company values is that we're hungry to
  build and learn. We believe learning new AI tools empowers
  us to build for our customers faster, more independently,
  and with higher quality. We provide these tools across all
  disciplines, from Engineering and Product to Sales and
  Support, and are inspired by how our Toasters are already
  driving real value with them. The people who thrive here are
  those who embrace changes that let us build more for our
  customers; it’s a core part of our culture.

  Our Total Rewards Philosophy  We strive to provide
  competitive compensation and benefits programs that help to
  attract, retain, and motivate the best and brightest people
  in our industry. Our total rewards package goes beyond great
  earnings potential and provides the means to a healthy
  lifestyle with the flexibility to meet Toasters’ changing
  needs. Learn more about our benefits at
  https://careers.toasttab.com/toast-benefits.

  The base salary range for this role is listed below. The
  starting salary will be determined based on skills,
  experience, and geographic location. In addition to base
  salary, our total rewards components include cash
  compensation (overtime, bonus/commissions if eligible),
  equity, and benefits. You can learn more about how we align
  pay with local labor markets in our Geographic Pay Zone
  Philosophy.

  Zone A

  $193,000—$309,000 USD

  Zone B

  $168,000—$269,000 USD

  Zone C

  $151,000—$242,000 USD

  How Toast Uses AI in its Hiring Process

  Throughout the hiring process, our goal is to get to know
  you. We use AI tools to support our recruiters and
  interviewers with tasks like note-taking, summarization, and
  documentation of interviews to ensure they can be fully
  focused on your conversation. All hiring decisions are made
  by people. We ask that you complete interviews and
  assessments on your own, without real-time AI tools,
  recording, or transcription bots, unless we tell you
  otherwise in advance. To learn more:
  https://careers.toasttab.com/ai-in-hiring

  Our Approach to Hybrid Working We embrace a hybrid work
  model that fosters in-person collaboration while valuing
  individual needs. Our goal is to build a strong culture of
  connection as we work together to empower the hospitality
  community, regardless of location. Please visit the
  Locations page on our career site to learn more about our
  in-office expectations by region:
  https://careers.toasttab.com/locations-toast

  People Are the Secret Ingredient in Our Recipe for Success

  At Toast, our employees are our secret ingredient—when they
  thrive, we thrive. The restaurant industry brings together
  people with a wide range of backgrounds, experiences, and
  perspectives, and we value that same breadth at Toast. We
  strive to build a culture grounded in authenticity, respect,
  and humility, where every Toaster has a real opportunity to
  grow, contribute, and do their best work—raising the bar in
  delivering exceptional experiences for our customers and
  each other.

  Apply today!

  Toast is committed to creating an accessible and inclusive
  hiring process. As part of this commitment, we strive to
  provide reasonable accommodations for persons with
  disabilities to enable them to access the hiring process. If
  you need an accommodation to access the job application or
  interview process, please contact
  candidateaccommodations@toasttab.com.

