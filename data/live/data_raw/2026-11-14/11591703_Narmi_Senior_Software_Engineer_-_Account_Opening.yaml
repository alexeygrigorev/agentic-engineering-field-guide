title: Senior Software Engineer - Account Opening
company: Narmi
location: New York, USA
work_type: FULL_TIME
company_size: 140 Employees
description: |
  About Us

  Narmi is how community financial institutions unlock the
  very latest capabilities in digital banking, account
  opening, and lending so they can move faster, tap new growth
  opportunities, and be where banking is going. Since our
  founding, Narmi has enabled the movement of billions of
  dollars and the opening of hundreds of thousands of accounts
  for banks and credit unions across the U.S. The results
  speak for themselves: our customers have grown deposits,
  revenue, and customer satisfaction, with one of the first
  institutions powered by Narmi recognized by Bankrate and
  NerdWallet for delivering the #1 digital banking experience
  in the country.

  About the Account Opening Engineering Team:

  Narmi's Account Opening Engineering team is the engine
  behind Narmi's Account Opening products. We spend 100% of
  our efforts building and maintaining products that delight
  our clients and allow their users to seamlessly open new
  consumer and business banking accounts without having to go
  into a branch. You'll continuously add new features,
  updates, and iterate on frictionless account opening
  experiences that prioritize speed and ease of use, ensuring
  our platform aligns with client workflows and protects
  financial institutions from fraudulent activities.

  What you'll do:

  - Lead the design and delivery of new features across Narmi's
    consumer and business account opening products
  - Iterate on application flows to make opening an account
    faster and easier for end users
  - Build safeguards that protect our clients and their users
    against fraud and malicious actors
  - Work across the stack with React, JavaScript, Python, and
    Django
  - Partner with Product, Design, and other engineering teams to
    shape the team's technical direction
  - Mentor other engineers, review code, and raise the bar on
    testing and code quality

  What you'll bring:

  - BS in Computer Science or equivalent work experience
  - 5+ years of professional software engineering experience
  - Experience with Django (or similar web frameworks) and
    database design
  - Experience with React or similar frameworks
  - Hard working, agile, and a top performer
  - Excellent communication skills in verbal and written English
  - Based in New York City or willing to relocate
  - Authorized to work in the United States

  Preferred qualifications:

  - 7+ years of professional software engineering experience
  - Advanced proficiency in Django or similar frameworks
  - Advanced proficiency in some of the following: JavaScript,
    React, Python (especially Django or DRF)
  - Experience at a startup or financial technology firm

  Compensation

  The base pay range for this role is $167,000 – $196,000 per
  year.

  At Narmi, how we work is just as important as what we build.
  We call this The Narmi Standard:

  - High Ceiling: You go beyond the obvious, take initiative,
    and hold yourself to high standards with care.
  - Low Ego: You put the mission above ourselves, share credit
    freely, and lead with curiosity.
  - Alignment to Mission: You believe that helping community
    financial institutions win against Mega Banks and FinTechs
    is a worthy endeavor, and will use that belief as a
    northstar to anchor your efforts to that goal.
  - High Commitment: You follow through, roll up your sleeves,
    and keep the bar high for yourself and others.

  We believe that high-performing teams include people from
  different backgrounds and experiences who can challenge each
  other's assumptions with fresh perspectives. To that end, we
  actively seek a diverse pool of applicants, including those
  from historically marginalized groups.

  Please note that all correspondence related to this role
  will come directly from Narmi (email addresses ending in
  @narmi.com or @narmitech.com), and not from a third party.
  If you receive correspondence from an individual claiming to
  represent Narmi please let us know immediately at
  security@narmi.com
