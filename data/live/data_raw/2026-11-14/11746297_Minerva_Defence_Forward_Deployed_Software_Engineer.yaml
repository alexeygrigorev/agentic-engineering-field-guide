description: |
  Embedded with the customers who use our systems, supporting
  them in operational environments.

  Minerva Defence is one of the fastest-growing defence
  technology companies in Europe. We create the software,
  hardware and networking that make unmanned systems effective
  on the modern battlefield, all ideated, designed and
  manufactured end-to-end in the UK, and in active use today.
  We are deliberately low-profile: a team of around 70, small
  in headcount and outsized in effect. We look for people who
  are not just talented but genuinely committed to the work,
  the team, and the purpose behind it.

  You will be embedded with customers in operational
  environments, the engineer they rely on when our systems are
  in use. Your bug reports will come from someone standing
  next to you, with the system in their hands and a reason it
  has to work. The work spans Linux, networking and the
  software that connects it all: rolling out updates to the
  systems we already have deployed, keeping connectivity alive
  and secure wherever they are operating. The problems you
  solve will come straight from the field, and the fixes you
  ship will go straight back there. We are looking for
  engineers with deep technical knowledge and a genuine desire
  to support the people using our products, not just the
  products themselves.

  Responsibilities

  - Roll out and manage software updates to the systems we have
    deployed in the field, over the network
  - Configure, secure and diagnose the networks our systems
    depend on, from setup through to live fault-finding under
    pressure
  - Debug Linux systems and connectivity issues on the ground,
    often with limited time and tooling
  - Write and maintain the Python software, tooling and
    automation that hold the platform together
  - Act as the technical point of contact for operators, turning
    field problems into reliable fixes
  - Feed real operational issues back to the core engineering
    team to harden the product

  Requirements

  Minimum:

  - Proven experience shipping production software; we work
    mostly in Python, but are language-agnostic for engineers
    with strong computer-science fundamentals (data
    structures, algorithms, systems)
  - A solid grounding in Linux and networking fundamentals, with
    hands-on experience diagnosing both
  - A track record of earning the trust of experienced,
    demanding end users on their own terms, through substance
    and straight talk rather than sales polish
  - Able to work on-site in the West Midlands and travel to
    customer locations, operating with a high degree of
    autonomy
  - Eligible for UK DV clearance (UK national, normally 10 or
    more years of continuous UK residency)

  Preferred:

  - Experience operating in deployed or operational environments
  - Familiarity with secure or air-gapped network architectures
  - Experience shipping software updates to systems already
    deployed in the field (over-the-air or similar)

  Benefits

  We offer competitive compensation including;

  - Share options vesting over three years
  - Bupa private medical insurance
  - 6% employer pension contribution
  - 25 days leave plus bank holidays
  - Enhanced mat/pat leave
  - Enterprise level AI tooling
  - Relocation support/home office budget
