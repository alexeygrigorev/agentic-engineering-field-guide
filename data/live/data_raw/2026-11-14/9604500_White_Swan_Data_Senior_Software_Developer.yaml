description: |
  About White Swan Data

  Technology is at the heart of our business and has produced
  consistent and significant results. We are a small but
  rapidly growing team of mathematicians, data scientists and
  software engineers constantly striving to refine our world
  class statistical models while also researching and
  deploying new ones.

  Our work bridges three domains, each challenging in its own
  right - iGaming, quantitative research and software
  development. This convergence demands a rare blend of skills
  and creativity to identify and capitalise on inefficiencies
  across the iGaming landscape. The opportunities are vast,
  but we are only as good as the people we bring on board.

  As a startup, we offer a dynamic and entrepreneurial
  environment where you’ll work on impactful projects and have
  the autonomy to explore new ideas. In-person collaboration
  and innovation are at the heart of what we do, and we are
  always looking for individuals who can contribute their
  unique perspectives and talents to help us stay ahead in a
  constantly evolving industry.

  About the Role

  We have an opportunity for an experienced developer to join
  a fast-developing area of our business. This role will be
  joining a small and dynamic team developing a cutting-edge
  trading systems.

  We are building systems that process real-time market and
  event-based information to execute automated trading
  strategies with millisecond latency. This is an opportunity
  to work on challenging technical problems in a collaborative
  environment where your contributions directly impact our
  platform's success.

  Key Responsibilities

  - Design, develop, and optimise cloud based low-latency data
    processing pipelines.
  - Implement and maintain integrations with multiple trading
    platform.
  - Enhance existing trading strategy implementations for
    improved performance.
  - Design and implement real-time data processing and
    analytical reporting pipelines.
  - Monitor and optimise system performance to maintain
    millisecond-level latency targets.
  - Collaborate closely with quantitative analysts to translate
    trading strategies into production code.
  - Maintain and improve our GCP-based infrastructure and
    deployment pipelines.

  Skills, Knowledge and Expertise

  Must have:

  - Programming Proficiency: Strong skills in Python and Java.
  - Cloud & Infrastructure: Hands-on experience with Google
    Cloud Platform (GCP) and Docker containerisation.
  - API Development: Experience building and integrating with
    RESTful APIs, particularly for real-time applications.
  - Low-Latency Systems: Understanding of performance
    optimisation techniques and experience building resilient
    systems with strict latency requirements, streaming data
    architectures and event-driven systems.
  - Data Engineering: Solid grasp of data pipeline design, ETL
    processes, and schema design for both transactional and
    analytical workloads.
  - Experience of AI. We have found AI has been an enormous
    accelerator across our team, this is a requirement for new
    hires.

  Nice to have:

  - Experience in a trading environment.
  - Industry experience in wagering/betting.

  Benefits

  - Salary depending on experience.
  - Annual discretionary performance bonus.
  - 25 days holiday per annum, plus UK bank holidays.
  - Private health & dental insurance.
  - Optical cover through Aviva.
  - Pension plan.
  - Gympass membership to over 1900 gyms and wellness
    businesses.
  - Breakfast bought in every day and lunch bought in twice a
    week
  - Free coffee & snacks at the office.
  - Regular team events & socials.

  Company Culture

  At White Swan Data we have created a highly dynamic and
  entrepreneurial working environment. We value innovation,
  ambition, and dedication in our employees, and strive to
  foster a culture which drives excellence. The work is often
  fast-paced, challenging, and there is never a dull moment.
  We are always chasing the next win, and make sure to
  celebrate it and recognize individual contributions to our
  overall success.

  At White Swan Data, we recognise that building a diverse and
  inclusive workforce within a highly technical field presents
  both opportunities and challenges. We recognise the value
  that a variety of perspectives can bring to innovation,
  problem-solving, and business success. A team composed of
  individuals from different backgrounds, experiences, and
  ways of thinking fosters creativity, enhances decision-
  making, and ultimately strengthens our ability to tackle
  complex challenges.

