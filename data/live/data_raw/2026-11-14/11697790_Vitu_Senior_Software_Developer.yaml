description: |
  Senior .Net Developer  (Remote)

  As the leading innovator in Vehicle-to-Government (V2Gov)
  technology, Vitu is transforming the way vehicles,
  businesses, government, and drivers interact with one
  another.

  Vitu provides innovative, cutting-edge services to the motor
  vehicle industry. Our namesake solution manages titling and
  registration transactions in all 50 states and across
  multiple locations — all on one platform. With the mission
  of expanding and automating Vehicle-to-Government (V2Gov)
  transactions, the Vitu platform is reimagining how drivers,
  businesses and governments interact with vehicles. Vitu has
  offices in California, Florida, Georgia, Illinois, Indiana,
  Kentucky, Minnesota, Montana, North Carolina, New Hampshire,
  New Jersey, New York, Ohio, Oregon, Pennsylvania, and
  Virginia.

  Job Summary

  Analysis of business requirements, working closely with US
  business analytics/managers. Readiness and ability to work
  either as part of the team or making R&D semi-independently
  depending on current duties. Integration of user-facing
  elements developed by front-end teams with server-side
  logic. Design, develop, support of REST Web Services,
  ASP.NET Web Services. Optimization high performance,
  stability, and responsiveness to requests from the front-
  end. Design and implementation of data storage solutions.
  Implementation of security and data protection.

  Key Responsibilities

  - Analyzes, designs, develops software applications including
    both new and existing software products.
  - Detects, analyzes and resolves problems associated with
    applications and their dependent systems/services.
  - Builds a strong working knowledge of product architecture,
    technology stack and deployment infrastructure.
  - Reviews and verifies requirements/specifications with
    product, business and system analysts.
  - Reviews test plans and acceptance criteria with testers/QA.
    Conducts quality reviews and verification of
    coding/designs.
  - Mentors/guides less experienced peers.
  - Documents technical designs, specifications and analysis on
    tech wiki or SharePoint site.
  - Ability to support multiple Project Managers simultaneously
    while effectively managing competing priorities in a fast-
    paced environment.

  Minimum Qualifications and Experience

  - 10+ years of related work experience.
  - Demonstrated experience implementing distributed systems and
    building reliable data integrations between those systems.
  - Demonstrate solid engineering fundamentals. Experienced
    employing concepts like CI/CD, test-driven development,
    pull requests, and agile methodologies to projects to
    maximize the quality of the software a team writes
    together.
  - Experience and strong knowledge of GitHub
  - Understanding data-structures, algorithms. Bachelor’s degree
    in Computer Science or a related field, or equivalent work
    experience.
  - Solid understanding of REST and SOAP API design
    methodologies using .Net Core, C#, ASP.Net Core, ASP.Net
    Web Forms.
  - Experience working with Cloud/Kubernetes infrastructure. AWS
    is plus
  - Strong understanding of relational database design.
    Experience with PostgreSQL
  - Should have a working knowledge of common design patterns
    and OOA&D, a good understanding of SOLID principles.
  - Experience in implementing security standards (OWASP) is a
    plus.
  - Excellent hands-on design, coding, testing methodologies,
    and debugging skills.
  - Knowledge of logging and auditing mechanisms.
  - Great communication skills, including working in
    geographically distributed teams. Readiness to work with
    project stakeholders/business analysts.
  - Experience in creating technical documentation.

  Compensation

  The salary range for this position is:  $110,000 - $160,000

   The final pay for this position will be determined by
  multiple factors including, but not limited to, location,
  education, experience, training and skills.



