description: |
  Electronic circuit boards are at the core of current and
  future inventions - space travel, medical robotics,
  autonomous transportation, augmented reality, bio-
  engineering. Yet today designing an electronic circuit board
  is an extremely manual, long and tedious process. At Circuit
  Mind we believe that this is wrong and we are on a mission
  to fix it, triggering the future of hardware design. We are
  creating an entirely new software engine for circuit boards,
  that takes as inputs the requirements of a circuit board and
  automatically outputs a complete design, ready for
  manufacture. As a Lead Software Engineer, you’ll create
  simple and elegant solutions to difficult technical problems
  that the world has not solved before. You will work in close
  collaboration with a highly-functioning team of software,
  electronics, algorithm engineers and product managers. Tasks
  * Collaborate with the product team and in-house hardware
  engineers to understand the problems of hardware engineering
  teams. * Plan, design, develop, test and iterate on the
  software solutions to those problems, accounting for
  functional and non-functional requirements. * Co-design,
  pair on, and review the development work of other lead
  software developers. * You’ll work on the entire company's
  backend code base: data models, algorithms, data pipelines,
  infrastructure, APIs, complex database queries, ML models. *
  Learn, use, and improve best practices and processes for
  high-quality software development. Our technology stack
  includes Python 3.11, PostgreSQL, Django, mypy, GraphQL,
  Docker, Redis, Typescript, React. Requirements We’re only
  considering exceptional candidates, with the following pre-
  requisites: * 5+ years of professional software development
  experience. * 2+ years of professional experience in Python.
  * 2+ years in a senior software engineer position. * Strong
  communication and team-work skills. * Experience working in
  an agile software development environment. Nice-to-haves *
  Experience in a tech lead position. * An interest in
  electronic engineering. Benefits * Collaboration with a
  friendly world-class team. * Above market rate salary and
  meaningful equity. * 25 days of annual holidays plus bank
  holidays. * Flexible working hours with two days a week in
  the office. * 5 weeks per year to work wherever you want in
  the world. * London Bridge office. * Extended parental
  leave. * Learning and development budget to support your
  professional development. * Yearly retreat. * Access to
  Circuit Mind's cutting edge EDA platform.
