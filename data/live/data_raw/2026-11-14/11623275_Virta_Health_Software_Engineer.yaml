description: |
  Virta Health is on a mission to reverse metabolic disease in
  one billion people. Current treatment approaches aren’t
  working—over half of US adults have either type 2 diabetes
  or prediabetes, and obesity rates are at an all-time high.
  Virta is changing this by helping people reverse their
  metabolic condition through innovations in technology,
  personalized nutrition, and virtual care delivery reinvented
  from the ground up. We have raised over $350 million from
  top-tier investors, and partner with the largest health
  plans, employers, and government organizations to help their
  employees and members restore their health and take back
  their lives. Join us on our mission to reverse metabolic
  disease in one billion people.

  As a Backend Engineer, you’ll build reliable systems,
  improve data accuracy across member, client, and operational
  workflows, and automate processes that are critical to
  Virta’s ability to deliver seamless care and transparent
  reporting. Your work will enable faster decision-making,
  reduce manual processes, and ensure our data is accurate,
  accessible, and ready to support both internal teams and
  external partners.

  We’re also excited to find someone who brings an AI-
  augmented mindset, using modern tools and techniques to
  enhance development workflows and spot opportunities to
  embed AI into processes where it adds value.

  What You’ll Do

  - Build and enhance scalable Golang microservices to power
    eligibility, coverage, billing, and client-facing systems.
  - Automate and streamline operational workflows, helping to
    reduce manual data handling and improve the accuracy and
    availability of member and client data.
  - Design and deliver self-service tools that allow finance,
    operations, and client teams to manage processes and
    configurations independently, reducing reliance on
    engineering.
  - Ensure member, client, and operational data is accurate,
    consistent, and traceable, supporting both internal
    decision-making and external reporting.
  - Work with data and AI teams to explore opportunities to
    apply AI to data validation, process automation, and
    anomaly detection.
  - Contribute to client-facing APIs that enable seamless data
    exchange between Virta and our customers.

  What We’re Looking For

  - 5-7 years of shipping backend code in a high quality
    production environment, with exposure to data centric
    systems
  - Experience building microservices in production
  - Experience with data and event-based architectures (API
    development, SQL/NoSQL datastores, messaging queues, etc.)
  - Experience with Golang
  - Experience with a cloud platform such as Google Cloud, AWS
    and/or Azure
  - Strong communication skills and a proven history of
    interfacing with business-level stakeholders, both
    technical and non-technical alike
  - Being a champion of long-term thinking and striving to make
    a business impact without sacrificing engineering quality

  Bonuses

  - Practical use of AI tools to accelerate development
    workflows or enhance data processes.
  - Light frontend skills for full-stack moments.
  - Exposure to healthcare, fintech, or other regulated domains
    where data integrity is paramount.

  Values-driven culture

  Virta’s company values drive our culture, so you’ll do well
  if:

  - You put people first and take care of yourself, your peers,
    and our patients equally
  - You have a strong sense of ownership and take initiative
    while empowering others to do the same
  - You prioritize positive impact over busy work
  - You have no ego and understand that everyone has something
    to bring to the table regardless of experience
  - You appreciate transparency and promote trust and
    empowerment through open access of information
  - You are evidence-based and prioritize data and science over
    seniority or dogma
  - You take risks and rapidly iterate



  Is this role not quite what you're looking for? Join our
  Talent Community and follow us on Linkedin to stay
  connected!

  Virta has a location based compensation structure. Starting
  pay will be based on a number of factors and commensurate
  with qualifications & experience. For this role, the
  compensation range is $114,500 - $148,000. Information about
  Virta’s benefits is on our Careers page at:
  https://www.virtahealth.com/careers.

  As part of your duties at Virta, you may come in contact
  with sensitive patient information that is governed by
  HIPAA. Throughout your career at Virta, you will be expected
  to follow Virta's security and privacy procedures to ensure
  our patients' information remains strictly confidential.
  Security and privacy training will be provided.

  As a remote-first company, our team is spread across various
  locations with office hubs in Denver and San Francisco.

  Clinical roles: We currently do not hire in the following
  states: AK, HI, RI

  Corporate roles: We currently do not hire in the following
  states: AK, DE, HI, ME, MS, OK, SD, VT.

  Virta uses Ashby as its applicant tracking system, which
  incorporates AI-powered tools (provided by OpenAI, AWS, and
  Google Gemini) in certain aspects of the recruiting process,
  including application review, candidate screening, and
  interview note taking; your data is not used to train AI
  models, and all final hiring decisions are made by Virta
  Health personnel. For more information, see Virta’s AI
  Interview Resources page.
  https://www.virtahealth.com/careers/ai-interview-resources
