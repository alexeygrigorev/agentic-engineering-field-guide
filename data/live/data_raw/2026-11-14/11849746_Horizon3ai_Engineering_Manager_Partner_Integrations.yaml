description: |
  Get to Know Us

  Horizon3 is a fast-growing, remote cybersecurity company
  dedicated to the mission of enabling organizations to
  proactively find and fix and verify exploitable attack
  vectors before criminals exploit them. Our flagship product,
  the NodeZeroTM platform, delivers production-safe autonomous
  pentests and other key assessment operations that scale
  across the largest internal, external, cloud, and hybrid
  cloud environments. NodeZero has been adopted by
  organizations of all sizes, from small educational
  institutions to government agencies and Global 100
  enterprises. It is used by ITOps/SecOps teams, consulting
  pentesters, and MSSPs and MSPs.

  We are a fusion of former U.S. Special Operations cyber
  operators, startup engineers, and formerly frustrated
  cybersecurity practitioners. We're committed to helping
  solve our common security problems: ineffective security
  tools, false positives resulting in alert fatigue, blind
  spots, "checkbox” security culture, cybersecurity skills
  shortage, and the long lead time and expense of hiring
  outside consultants. Collectively, we are a team of learn it
  alls, committed to a culture of respect, collaboration,
  ownership, and results.



  What You'll Do

  You will lead Partner Integrations — the team that ships
  NodeZero's first-party integration products. When a customer
  wants NodeZero findings flowing into Crowdstrike,
  SentinelOne, Splunk, or any other security platform they
  run, your team builds that integration, ships it, and keeps
  it working. Each integration is a delivered product: it must
  install without friction, stay current as upstream APIs
  evolve, and carry the same quality bar as NodeZero itself.
  You will grow this team to 6–7 engineers and build an
  integration portfolio that makes NodeZero indispensable
  inside every customer's security stack.

  - Lead Partner Integrations: Own the engineering execution and
    team health for the Partner Integrations sub-team. Drive
    the pace, quality, and reliability of integration delivery
    across NodeZero's first-party integration catalog.
  - Own the Integration Product Portfolio: Manage the roadmap of
    named integration products — Crowdstrike Falcon,
    SentinelOne Singularity, Splunk Enterprise/Cloud,
    ServiceNow, and others. Decide what to build next, in what
    order, and at what depth.
  - Ship Production-Grade Integrations: Each integration is a
    shipped product that customers deploy. Own the
    reliability, versioning, and backward-compatibility
    guarantees that enterprise customers expect.
  - API Contract with Integrations Platform: Work closely with
    the Integrations Platform team (who builds the underlying
    framework and connector infrastructure) to define the API
    contract your integrations consume. Your team is the
    primary customer of their framework.
  - Breaking-Change Management: Monitor upstream vendor API
    changes and deprecations. Own the process for detecting,
    triaging, and shipping compatibility fixes before they
    become customer incidents.
  - Certification & Validation Pipeline: Build and own the
    certification process that gates every integration release
    — functional tests, security validation, and partner
    certification requirements.
  - Cross-functional Partnership: Work with Customer Success
    (who field integration issues), Security Research (new
    finding types that integrations must surface), and
    NodeZero's partnerships team to align the integration
    roadmap with customer demand and partner commitments.
  - Team Building: Build a team of engineers who take pride in
    making integrations rock-solid — people who can learn a
    new vendor platform quickly, read API docs critically, and
    ship something that just works.



  What You'll Bring

  - Experience leading engineering teams of 5–8 people building
    and shipping third-party integration products in a SaaS or
    security context.
  - Hands-on familiarity with the APIs and data models of
    enterprise security platforms — EDR (Crowdstrike,
    SentinelOne), SIEM (Splunk, Sentinel), ticketing
    (ServiceNow, Jira), or similar.
  - Track record of shipping integration products that meet
    enterprise reliability and data fidelity requirements —
    not just proof-of-concept connectors.
  - Experience managing external API dependencies: rate limits,
    versioning, deprecations, and the operational overhead of
    staying current across multiple upstream vendors.
  - Proven ability to define and execute a roadmap with clear
    prioritization — balancing customer demand, partner
    opportunity, and engineering cost.

  Technical Expertise

  - Proficient in Go or Python — capable of reviewing and
    contributing to integration code.
  - Understanding of enterprise authentication patterns: OAuth
    2.0, API keys, SAML, and mutual TLS as used by security
    platform APIs.
  - Familiarity with webhook delivery, polling, and event-driven
    architectures for integration data flows.
  - AWS infrastructure: Lambda, SQS/SNS, EventBridge, or
    equivalent for serverless integration execution.
  - Experience with data normalization across disparate security
    data models (findings, assets, vulnerabilities, alerts).

  Nice to Haves

  - Background in cybersecurity — direct experience with EDR,
    SIEM, or SOAR platforms from a practitioner or vendor
    perspective.
  - Experience navigating technology partnership programs
    (Crowdstrike Marketplace, Splunk Splunkbase, ServiceNow
    Store) and their certification requirements.
  - Familiarity with STIX/TAXII or other cybersecurity data
    exchange standards.
  - Experience building customer-facing integration health
    dashboards or self-service troubleshooting tools.



  Travel Required

  We are a fully remote company, and this job may require up
  to 15% of travel to be successful.



  Compensation and Values

  At Horizon3, we believe that our people are our greatest
  asset, and our compensation philosophy reflects this core
  value. We are committed to fostering an environment where
  all employees feel valued, respected, and rewarded for their
  contributions. Our compensation structure is designed to be
  fair, competitive, and transparent, ensuring that every team
  member is recognized and compensated equitably across roles,
  levels, and locations.

  In accordance with various State's transparency regulations,
  we provide the following salary range information for this
  position:

  - Base salary range: $225,250 - $265,000 annually. The exact
    salary will be determined based on the selected
    candidate's location, qualifications, experience, and
    relevant skills.
  - Additional compensation: This role may also be eligible for
    an equity package (in the form of stock options). If any
    other compensation benefits apply, they will be discussed
    during the interview process.



  Perks of Horizon3

  - Inclusive Team: We value diversity and promote an inclusive
    culture where everyone can thrive.
  - Growth Opportunities: Be part of a dynamic and growing team
    with numerous career development opportunities.
  - Innovative Culture: Work in a collaborative environment that
    encourages creativity and out-of-the-box thinking.
  - Hybrid & Remote Work: We embrace a mix of remote and hybrid
    work models depending on role and location, including our
    Chicago office, where some roles require regular in-office
    presence.
  - Competitive Compensation: We offer competitive salary,
    equity and benefits. Our benefits include health, vision &
    dental insurance for you and your family, a flexible
    vacation policy, and generous parental leave.

  You Belong Here

  Horizon3 is not just an equal opportunity employer - we are
  a community that values diversity, equity, and inclusion as
  fundamental principles of our culture and success. We are
  dedicated to fostering a workplace where everyone feels
  welcome and respected, regardless of race, color, religion,
  sex, national origin, age, disability, veteran status,
  sexual orientation, gender identity or expression, genetic
  information, marital status, or any other legally protected
  status by law.

  Our commitment to diversity and inclusion means we strive to
  attract, develop, and retain a workforce that reflects the
  varied communities we serve. We believe that diverse
  perspectives drive innovation and strengthen our ability to
  create cutting-edge cybersecurity solutions. At Horizon3,
  every team member is valued and supported in an environment
  that encourages personal and professional growth.

  We welcome candidates from all backgrounds and experiences,
  and we encourage all qualified individuals to apply. Come be
  a part of Horizon3, where your unique contributions are
  recognized, and your potential is limitless.

