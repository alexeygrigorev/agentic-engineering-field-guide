description: |
  About the job

  We are looking for a motivated and enthusiastic Web
  Development Intern to join our team. As an intern, you will
  have the opportunity to work on exciting web projects and
  gain hands-on experience in front-end and back-end
  development. This internship is designed to provide you with
  a solid foundation in web development while contributing to
  real-world projects.

  Eligibility

  Access to a PC or Laptop with a reliable internet
  connection.

  Good understanding of the English language.

  Any graduate with a desire to become a web developer.
  Freshers are welcome.

  Knowledge of HTML, CSS, and JavaScript is a plus but NOT
  mandatory.

  Freshers are encouraged to apply. Comprehensive training
  will be provided, so no prior coding experience is
  necessary.

  Responsibilities

  Creating new websites from scratch.

  Redesigning and rebuilding existing websites.

  Creating sitemaps and designing wireframes.

  Collaborating with teams and managing workspaces.

  Creating effective content to ensure user engagement.

  Working on Front-End development to create interactive User
  Interfaces (UI).

  Building easy navigation for a solid User Experience (UX).

  Working on Back-End development to ensure fast and error-
  free website performance.

  Benefits

  Internship Certificate

  Letter of Recommendation

  Performance-Based Stipend

  Part-time work from home (2-3 hours per day)

  5 days a week, fully flexible shift
