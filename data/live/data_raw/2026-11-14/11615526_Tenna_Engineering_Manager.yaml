description: |
  Why Tenna?

  We take pride that our roots are in the construction
  industry. With this experience and knowledge, we have built
  a platform that revolutionizes construction equipment fleet
  operations. We provide innovative solutions to customers
  looking for competitive ways to better manage and track
  their assets, such as heavy and light equipment, large
  fleets, tools, and materials.



  At Tenna, we believe the best is right in front of all of us
  and that each day holds more potential than the one before.
  We believe that every new discovery can lead to something
  better than we thought possible. When we boil it down, the
  top five qualities that define the Tenna Team are quality-
  obsessed, gritty, continuous learners, collaborative problem
  solvers, and just plain awesome. Sound like you? Join us as
  we empower our customers to control their mixed assets on
  one comprehensive platform anytime, anywhere.



  Position Description

  Tenna is seeking an Engineering Manager to connect
  engineering execution with product delivery. Reporting to
  engineering leadership, the Engineering Manager leads
  multiple development teams and is responsible for the full
  people-management lifecycle, including hiring, performance,
  and staffing. This role partners with Product on priorities
  and trade-offs, manages schedules, dependencies, and
  execution risk, and holds technical leads accountable for
  design quality and delivery commitments. The Engineering
  Manager does not set product direction or perform hands-on
  technical work; the focus is on driving execution through
  the team.

  The ideal candidate is an experienced people manager with
  the technical credibility to engage substantively with the
  team's work. Having begun your career as a technical
  contributor before moving into leadership, you bring a
  proven record of developing engineers and delivering product
  through your teams. You are technical enough to evaluate
  estimates, identify design risks before they escalate, and
  partner effectively with technical leads, while recognizing
  that your primary contribution is leadership rather than
  implementation. You understand the product well enough to
  make sound trade-off decisions and to identify issues early.
  Sounds like you? Apply now!

  Your Responsibilities

  - Owns the full people management lifecycle for direct
    reports: 1:1s, performance reviews, career development,
    hiring, terminations, and compensation decisions.
  - Manages multiple engineering teams, owning people and
    delivery outcomes across scope.
  - Ensures teams meet their KPIs and have the right staffing to
    deliver on commitments.
  - Develops Tech Leads in their roles, supporting their growth
    in design ownership, technical mentorship, and delivery
    accountability.
  - Owns active project management for feature
    development—defining scope with Product partners,
    scheduling delivery, identifying dependencies and
    complexities, managing timelines, and moving resources as
    necessary to protect commitments.
  - Acts as the project management layer for engineering:
    coordinates with Product Managers to align on deadlines
    and priorities, surfaces risks early, and proactively
    resolves scheduling conflicts.
  - Holds Tech Leads accountable to delivery commitments and
    design completion. Gut-checks estimates and engages with
    project designs, plans, and scope definitions to identify
    execution and schedule risk.
  - Holds partial accountability for burn charts—does not own
    them outright but is responsible for ensuring they
    accurately reflect project health.
  - Ensures deployment plans are defined and in place ahead of
    every feature release.
  - Identifies technical and schedule risks across projects;
    partners with Tech Leads on mitigation strategies before
    issues escalate.
  - Partners with Product Management to understand priorities,
    define features clearly, and negotiate tradeoffs between
    scope, time, and resources.
  - Partners with Tech Leads to ensure execution proceeds
    correctly per process and standards. Where execution gaps
    exist, addresses them through coaching, resourcing, or
    process intervention.
  - Drives process improvement initiatives to increase team
    efficiency, delivery predictability, and engineering
    quality.

  Qualifications

  - 10+ years of professional software engineering experience,
    with a strong background as a hands-on technical
    contributor earlier in your career.
  - 3+ years of experience in an engineering management role,
    with direct responsibility for project delivery and people
    management.
  - Demonstrated experience managing and developing engineering
    talent, including performance reviews, hiring, and
    compensation decisions.
  - Proven experience owning project management for software
    feature development, not just coordination, but full
    accountability for schedule, scope, process, and outcomes.
  - Technical depth sufficient to evaluate risks in designs and
    plans, gut-check technical estimates, and credibly partner
    with Tech Leads. You don’t need to be the deepest
    technical expert in the room; you need to be technical
    enough to ask the right questions and recognize when an
    answer doesn’t add up.
  - Strong track record of collaborating with Product Management
    to define features, align on priorities, and navigate
    tradeoffs.
  - Ability to identify and manage technical and schedule risk
    proactively, developing mitigation strategies before
    issues escalate.
  - Solid understanding of software delivery processes,
    standards, and deployment practices.
  - Strong verbal and written communication skills with both
    technical and non-technical stakeholders.
  - Bachelor’s or Master’s degree in Computer Science or a
    related field is required, or equivalent industry
    experience.

  Benefits, Perks, & Additional Information:

  - Full-time opportunity.
  - Location: Remote - nationwide.
  - Travel is required, 8 - 10%.
  - Opportunities for growth and personal development within a
    highly dynamic team.
  - Robust, low-cost benefit packages offered.
  - Benefit coverage begins on the first date of employment.
  - Paid Time Off and Volunteer Time Off offered.
  - 401k match.
  - Dependent Care offered.
  - Employee referral bonuses.

  As an Equal Opportunity Employer, Tenna is committed to
  building a diverse team. We welcome different perspectives
  and opinions to foster innovation, authenticity, and
  excellence across all parts of our company, and are
  committed to providing employees with a work environment
  free of discrimination and harassment.
