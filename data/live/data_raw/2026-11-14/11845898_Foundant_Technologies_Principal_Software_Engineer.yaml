description: |
  A NOTE ON HOW TO REACH US

  We're truly grateful that so many people have Foundant on
  their radar — it means a lot that our work resonates with
  others. That said, due to the high volume of direct messages
  and emails we receive, cold outreach isn't the preferred way
  to be considered for a role, and we're not able to
  prioritize applications submitted this way. To apply for
  open positions, please visit our careers page, which is the
  fastest and most effective route to being considered.

  About Foundant

  At Foundant, we build mission-critical software for the
  social good ecosystem — helping foundations, grantmakers,
  nonprofits, and community organizations streamline their
  work, strengthen relationships, and maximize their impact.
  We serve the giving community worldwide with a comprehensive
  suite of solutions spanning grant management, community
  foundation software, and giving analytics.

  We're a unified company shaped by strong roots across our
  product portfolio, and we operate with intention and
  purpose. Our team of ~350 people across six countries is
  connected by a shared North Star: to be the trusted partner
  and strategic advisor to the communities we serve.

  Where You’ll Work:

  - As a remote-first workplace, we believe in offering
    flexibility and the freedom to work where it suits you
    best, while staying connected through technology. Our
    global network of talent is supported by physical office
    hubs and virtual collaboration, fostering a dynamic
    environment where innovation and growth thrive.
  - With office locations in Bozeman, MT, Toronto, Canada, and
    Dublin, Ireland, you'll be part of a globally connected
    team. Whether you're working remotely or from one of our
    office locations, you'll be contributing to a vibrant,
    collaborative culture focused on driving meaningful impact
    across the world.

  What You’ll Do:

  - You'll be part of Foundant’s product engineering team
    responsible for development activities along with their
    ongoing production environments care and feeding to take
    on their hardest technical problems, and you’ll deliver
    high-quality working code — not just direction. This is a
    hands-on role at every level of seniority it carries.
  - You'll own architectural decisions at both the application
    and service level, making calls that hold up under real
    production load and remain understandable to the engineers
    who inherit them.
  - You'll diagnose systemic and architectural issues that cross
    component and service boundaries, including the ambiguous
    ones where the cause isn't in any single team code.
  - You’ll see the big picture and work proactively to resolve
    integration issues or coordinate across team boundaries.
  - You’ll put AI-assisted development and agentic tooling to
    work in your daily engineering, shortening the path from
    idea to production-ready code and getting valuable
    improvements into clients’ hands sooner.
  - Other duties as assigned.

  What You’ll Need:

  - 12+ years of professional software engineering experience,
    including significant time at a principal, staff, or
    equivalent senior individual contributor level as a hands-
    on developer.
  - Demonstrated mastery of architectural patterns and the
    judgment to know which apply in a given context, at both
    the application and service level.
  - Proven expertise in Java, Spring Boot, TypeScript, Node.js,
    and React, with a track record of building and shipping
    production software.
  - Extensive full-stack development experience building
    scalable RESTful applications with React and Java/Spring
    Boot backend.
  - Advanced proficiency working with large scale relational
    database management systems (RDBMS).
  - Experience working with analytical systems and databases
    processing large volume of data.
  - Proficient with AI assisted development practices and
    tooling.
  - Proven experience developing cloud-based SaaS applications;
    experience working with AWS is highly desirable.
  - Proven experience owning production services, including
    reliability, performance, and incident response.
  - Professional experience using AI-assisted development tools
    in production work. Foundant uses Claude Code; deep
    expertise with a comparable tool is acceptable.
  - Extensive experience diagnosing and debugging complex
    technical issues across multiple components and services,
    including the use of debugging and profiling tools.
  - Must be legally eligible to work in the United States.

  What You’ll Bring to our Team Dynamics:

  - Adaptive Achievement: Moves between unfamiliar codebases,
    domains, and problem spaces without losing momentum, and
    delivers high-quality solutions under shifting priorities
    and incomplete context.
  - Productive Collaboration: Leads engineers through complex
    initiatives by influence rather than authority — entering
    a team as a guest, earning trust quickly, and articulating
    direction clearly enough that the team can carry it
    forward without you.
  - Service Orientation: Treats internal engineering teams as
    clients, and understands that the reliability of a shared
    service is ultimately felt by the foundations and
    nonprofits depending on our software to do their work.
  - Business Insight: Weighs the blast radius of shared-service
    decisions across every product and client, balancing
    technical elegance against what actually advances the
    business and the communities we serve.
  - Active Learning: Builds working depth in unfamiliar stacks
    quickly, and applies rigorous judgment to AI-generated
    code — knowing when to lean on it, when to scrutinize it,
    and how to help colleagues do the same.

  Why You’ll Love Working at Foundant:

  - At the heart of everything we do is a commitment to
    innovation and making a positive impact. Whether you’re
    working on projects that empower not-for-profits,
    community foundations, or corporations, your contributions
    will help drive real-world change.
  - We offer competitive salary and benefits, including tuition,
    and lifestyle reimbursements, and bespoke mindfulness and
    fitness initiatives.
  - With our Flexible PTO policy, you’ll have the freedom to
    manage your time in a way that supports your personal
    well-being and professional success.
  - We’re committed to your professional and personal
    development.  With our merger, you'll have the chance to
    collaborate across teams, giving you exposure to diverse
    ideas, expertise, and projects that span multiple
    industries.
  - As part of a larger organization, you’ll have even more
    opportunities to grow your career. Whether it’s exploring
    new roles, leadership opportunities, or shifting to a
    different department, we support internal mobility to help
    you achieve your career goals
  - You’ll enjoy autonomy and responsibility, empowering you to
    approach your work creatively and independently, fostering
    innovation and independent thought.
  - Employee recognition is a core part of our culture. When you
    do a great job, we make sure everyone knows about it!



  Foundant is an equal opportunity employer, committed to
  building a diverse workforce that represents the communities
  we serve. We welcome and encourage applications from all
  qualified candidates, and will consider all applicants
  without regard to race, color, citizenship, religion, sex,
  marital/family status, sexual orientation, gender identity,
  Indigenous status, age, disability, or individuals who may
  require accommodation.

  Foundant is also committed to providing accommodations
  throughout the interview and employment process.
  Accommodations are available upon request for candidates
  participating in all aspects of the selection process. If
  you have accessibility requirements during the recruitment
  process and require accommodation, please contact
  hr@smartsimple.com.
