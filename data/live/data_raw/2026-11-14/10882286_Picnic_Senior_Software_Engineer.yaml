description: |
  Who we are

  At Picnic, we’re reinventing the way employees experience
  lunch at work. By partnering with top local restaurants and
  batching hundreds of orders, we make it easy for companies
  to offer high-quality, individually packed meals, without
  fees or tips. Our mission is to create a seamless,
  affordable, and joyful lunch experience that benefits both
  employees and employers.

  About the role

  We’re looking for a Backend Engineer to help architect and
  scale Picnic’s real-time logistics and operations platforms.
  This is a high-impact role for someone who enjoys ambiguity,
  thrives in complex systems, and wants to shape the technical
  direction of backend systems that power real-world
  operations. You’ll work across backend services that support
  web and mobile surfaces, partner closely with frontend,
  mobile, product, and operations teams, and help define how
  we design, build, and scale backend systems at Picnic.

  What you’ll do

  - Write high-quality, well-tested code in languages like Java
    and Go, and set a strong bar for engineering excellence
  - Lead and influence large backend initiatives across domains
    such as vehicle routing optimization, automation,
    scalability, and reliability
  - Own backend architecture and drive solutions to ambiguous,
    high-impact problems
  - Drive the development and scaling of core data stores and
    API layers as the business grows
  - Establish and promote best practices for building, testing,
    monitoring, and operating large-scale systems
  - Translate technical vision into quarterly roadmaps in
    collaboration with product and engineering leadership
  - Mentor and uplevel engineers through technical leadership,
    reviews, and hands-on collaboration

  What we’re looking for

  - 3+ years of experience in software engineering
  - Strong experience architecting and delivering systems in
    ambiguous, fast-moving environments
  - Proven ability to lead complex, cross-team initiatives and
    drive architectural alignment
  - Deep understanding of backend system design, APIs, data
    stores, and distributed systems
  - Experience collaborating closely with frontend, mobile,
    product, data, and business partners
  - A hands-on engineer who sets a high bar for code quality,
    reliability, and operational excellence
  - Passion for product impact and building systems that
    directly support customers and operators

  Preferred Qualifications

  - Experience building or operating logistics, delivery, or
    real-time systems at scale
  - Background in fast-growing, high-execution technology
    companies
  - Familiarity with frontend and mobile tradeoffs and how
    backend decisions affect client performance
  - Track record of improving developer productivity through
    tooling, patterns, or process improvements

  Why join us

  - Drive real impact: Be part of building the operational
    engine behind a fast-growing startup that’s redefining how
    work gets done.
  - Own your city: Take full ownership of your city’s
    performance and see the direct results of your ideas and
    execution every single day.
  - Work with purpose: Join a mission-driven team focused on
    making the workplace experience better for thousands of
    people.
  - Grow with us: At Picnic, there’s room to grow—personally and
    professionally—as we scale and take on new challenges
    together.

  What else you need to know

  This role is based in our New York office location. As a
  company driven by innovation and continuous change, close
  collaboration is essential. We’re constantly reimagining our
  industry, creating new products, and refining our processes,
  and we do our best work together. That’s why all of our
  office-based teams work onsite, five days a week.

  The base salary range for this role is $176,000 - $242,000
  per year.

  Actual compensation will be determined on an individual
  basis and may vary depending on experience, skills, and
  qualifications.

  Base salary is just one part of your total rewards package.
  You may also be eligible for equity awards and an annual
  performance-based bonus.

  Benefits Summary (USA Full-Time Exempt Employees):

  - Medical, dental, and vision insurance (multiple plans, incl.
    HSA options).
  - Company-paid life and disability insurance (short- and long-
    term).
  - Voluntary insurance: accident, critical illness, hospital
    indemnity.
  - Optional supplemental life insurance for self, spouse, and
    children.
  - Pet insurance discount.
  - 401(k).
  - Health Savings Account (HSA)
  - Flexible Spending Accounts (Healthcare, Dependent Care,
    Commuter)
  - Time Off policies:

  Benefits are subject to change at the company's discretion.
  Atoms accepts applications on an ongoing basis.

  Ready to join us as we serve those who serve others?

  #LI-Onsite
