description: |
  Please note: This role requires applicants to be willing and
  eligible to obtain SC and DV security clearance.  This role
  also requires applicants to be willing to work on-site up to
  4 days per week. At Gemba Advantage, we build secure, user-
  centred digital products for critical public sector
  organisations across the UK. Our teams work on complex,
  high-impact systems, the kind that have to be secure,
  scalable, and actually usable by the people who rely on
  them.

  We’re looking for junior and mid‑level engineers who are
  eager to learn, grow, and contribute to meaningful software
  projects. You’ll join an agile delivery team working closely
  with customers to design and develop products that drive
  digital transformation. Expect to work with modern
  cloud‑native technologies and be supported by experienced
  engineers who are passionate about doing the job properly.

  The Role:

  - Contribute to the design and development of secure, scalable
    software services.
  - Research, prototype, and deliver effective technical
    solutions alongside experienced teammates.
  - Take part in code reviews, learn from feedback, and
    continuously develop your skills.
  - Build and test solutions using modern frameworks and best
    practices
  - Work directly with customers and collaborate across
    different delivery disciplines.

  What you'll bring:

  - Willingness and eligibility to obtain SC & DV clearance
    (essential)
  - Solid foundation in software engineering principles, and
    experience in at least one modern language (Java,
    TypeScript, Python, or Go)
  - Interest or hands‑on exposure to cloud and container
    technologies such as AWS, Docker, or Kubernetes
  - A proactive attitude toward learning, problem‑solving, and
    improving how things are built
  - A collaborative approach, you value teamwork, shared
    learning, and quality delivery

  Tech we commonly use

  - Java - TypeScript - Python - Go
  - React / Angular
  - AWS - Kubernetes - Docker
  - Elasticsearch - MongoDB - relational DBs
  - CI/CD - GitOps - infrastructure as code

  Why join Gemba?

  We’re guided by four core values that make Gemba a great
  place to work:

  - Our people are our most important asset, and we prioritise
    their needs.
  - We succeed and fail as a team, not as individuals.
  - We do the right thing and we do the thing right.
  - We keep an unwavering focus on the customer’s needs.

  Away from our values, Gemba offers an excellent and
  comprehensive package to our Gembans, including great
  salaries, meaningful perks, a culture of truly rewarding and
  celebrating success, amongst many other core benefits like
  flexible pensions and PMI.

  As an Equal Opportunity Employer, we recognise, and studies
  confirm, that often underrepresented candidates in the
  workplace are less likely to apply to roles unless they meet
  all skills and experience of the position.

  At Gemba we celebrate diversity and are committed to
  creating a diverse and inclusive workplace, therefore we
  make sure that our recruitment and selection processes never
  discriminate based upon age, race, religion, disability,
  sex, sexual orientation, gender reassignment, marriage and
  civil partnership, or pregnancy, and actively welcome
  applications from all groups.

  About Gemba Advantage make high-impact software that is
  secure, scalable and sustainable. Our experience and
  expertise allows us to succeed inside and alongside our
  customers’ exacting operational environments. We make
  software that makes a difference.
