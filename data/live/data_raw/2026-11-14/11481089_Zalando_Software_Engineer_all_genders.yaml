description: |
  THE ROLE & THE TEAM

  At Zalando Payments, we are building and maintaining a broad
  array of highly available microservices that control the
  payment flow from checkout to refund, securing the financial
  backbone of Zalando's platform.

  As a Site Reliability Engineer, you will speed up
  initiatives to bring the best infrastructure-related
  technologies to our payment teams and services. You will be
  responsible for creating innovative solutions for deploying,
  operating, and monitoring these mission-critical systems
  effectively and efficiently. In doing so, you will optimize
  workflows, automate infrastructure requirements, and ensure
  continuous reliability, making impactful contributions to
  our vision of making Zalando the starting point for fashion.

  INCLUSIVE BY DESIGN

  At Zalando, our vision is to be inclusive by design. And
  this vision starts with our hiring - we do not discriminate
  on the basis of gender identity, sexual orientation,
  personal expression, ethnicity, religious belief, or
  disability status. You are welcome to leave out your
  picture, age, or marital status from your application. We
  only assess candidates on their qualifications and merit. We
  want to provide you with a great candidate experience. Feel
  free to inform us of any accommodations you may need, so we
  can best support you throughout the hiring process.

  do.BETTER - our diversity & inclusion strategy:
  https://corporate.zalando.com/en/our-impact/dobetter-our-
  diversity-and-inclusion-strategy

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

  - Platform Evolution: Design and implement robust platform
    changes from proof-of-concept to production, continually
    improving the overall quality of our infrastructure.
  - Workflow Automation: Optimize and automate operational
    workflows, developing infrastructure-as-code and
    implementing automated testing frameworks.
  - Production Operations: Own the stability of our mission-
    critical systems, utilizing SRE best practices to
    troubleshoot issues and maintain high availability in
    production environments.
  - Proactive Monitoring: Identify strategic opportunities to
    improve the overall platform reliability, alerting
    capabilities, and monitoring frameworks.
  - Collaborative Implementation: Partner with teams to
    implement infrastructural requirements, ensuring they run
    seamlessly and efficiently in production.
  - Knowledge Sharing: Actively contribute to the engineering
    community by sharing your SRE knowledge, mentoring others,
    and fostering stronger technical practices.

  WE’D LOVE TO MEET YOU IF

  - You have a strong background in Linux system administration
    and architecture design, with proven experience managing
    highly-scalable environments.
  - You bring a profound understanding of the Kubernetes and
    Docker ecosystems, and are comfortable navigating cloud-
    native setups.
  - You have a deep passion for SRE best practices, including
    building infrastructure-as-code and implementing automated
    testing pipelines.
  - You bring the ability to write clean, efficient code using
    Python or Golang to automate processes and solve complex
    technical challenges.
  - You have strong problem-solving skills and the ability to
    make independent decisions, taking complete ownership of
    both smaller and larger technical topics.
  - You bring a curiosity for MLOps, or possess valuable
    industry certifications such as AWS Certified Solutions
    Architect or CKA (Certified Kubernetes Administrator).

  If you think you have what it takes, we encourage you to
  apply even if you don't meet every single requirement. You
  may just be the right candidate for this or other roles!

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - Employee shares program
  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Zalando Lounge, discounts from external
    partners
  - 2 paid volunteering days a year
  - 27 days of vacation a year to start
  - Relocation assistance available (subject to prior agreement)
  - Family services, including counseling and support
  - Health and wellbeing options (including Wellhub, formerly
    Gympass)
  - Mental health support and coaching available
  - Drive your development through our training platform and
    biannual peer-to-peer review

  Learn all about Zalando and our values here:
  https://jobs.zalando.com/en/?gh_src=22377bdd1us

  Please note that all applications must be completed using
  the online form - we do not accept applications via email.
