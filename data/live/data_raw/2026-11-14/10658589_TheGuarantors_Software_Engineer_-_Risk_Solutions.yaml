description: |
  TheGuarantors is a fintech company helping multifamily
  owners and operators mitigate leasing risk while expanding
  access for renters. With a deep understanding of owner,
  operator, and renter needs, we believe renters deserve
  better access to the home of their choice and operators
  deserve greater protection and growth opportunities. That’s
  why we’re leveraging our real estate expertise and using AI-
  driven renter underwriting to help operators qualify renters
  faster while mitigating the financial risk of renter
  default. With $7B+ in lease value protected, we work with 9
  of the country’s top 10 operators, are the #1 lease
  guarantee provider nationwide, and have consistently been
  named one of Inc. 5000’s fastest-growing companies, one of
  Forbes’ Best Startup Employers, and one of Deloitte’s
  Technology Fast 500

  The Role

  The Software Engineer - Risk Solutions owns TheGuarantors
  auto-underwriting and pricing infrastructure: the
  decisioning systems that determine applicant and outcomes,
  including Approve/Decline decisions and pricing. The team is
  responsible for the end-to-end underwriting decision path,
  from orchestrating external data integrations and evaluating
  risk rules to returning decisions and pricing applicants.
  Common work includes building new capabilities for Risk
  analysts, implementing underwriting rules, onboarding new
  data sources, and improving pricing effectiveness. This is a
  hands on role requiring coding 75% of the time and
  architecture design 25% of the time.

  Location This is a hybrid role based in NYC

  What You’ll Do

  - Own a slice of the underwriting and pricing platform end to
    end, from requirements through development, QA, and
    production.
  - Lead technical design discussions, evaluate tradeoffs, and
    write clean, maintainable code through a strong code
    review culture.
  - Build and extend the critical decisioning systems at the
    core of underwriting and pricing.
  - Partner with Product, Design, Operations, Risk analysts, and
    Engineering to align on priorities and deliver high-impact
    solutions.
  - Communicate updates, risks, blockers, and recommendations
    clearly and proactively.
  - Identify opportunities to improve team processes,
    engineering output, and stakeholder/user experience.
  - Manage assigned work independently and follow through on
    commitments, deadlines, and deliverables.
  - Ensure work is completed in accordance with applicable
    policies, procedures, standards, and regulatory
    requirements.
  - Perform other role-related responsibilities as assigned and
    aligned with business needs.

  Requirements

  - 5+ years of experience building backend services with common
    systems languages such as Go, Java, Python, or C#. Go
    experience is not required, but must be open to learning
    and using it.
  - Proven ability to independently execute complex engineering
    projects from design through delivery.
  - Advanced SQL skills and experience with PostgreSQL or other
    relational databases.
  - Familiarity with modern web infrastructure and production
    operations, including caching, Kubernetes, API gateways,
    observability, and deployment patterns.
  - Strong understanding of distributed systems and microservice
    architecture.
  - Experience with cloud providers such as AWS, Azure, GCP, or
    OCI, and managing infrastructure using IaC tooling such as
    Terraform.
  - Demonstrated ability to manage complex features end to end,
    partner with product and cross-functional stakeholders,
    and deliver high-quality work in a dynamic business
    environment.

  Nice to Have

  - Experience working in a workflow orchestration/ ML
    infrastructure environment.
  - Experience working in a fast-paced, high-growth, cross-
    functional environment.

  Benefits

  - Opportunities to make an impact within a fast growing
    company
  - Medical, dental, & vision insurance, beginning day one
  - Health savings account with employer contribution
  - Generous PTO and paid holidays
  - Flexible working hours
  - 401(k)
  - Paid parental leave
  - Company sponsored short and long term disability
  - Flexible spending accounts (healthcare, dependent care,
    commuter)
  - Competitive salary

  Base Salary

  This is an individual contributor role, internally leveled
  as IC4.

  The annual U.S. base salary range is $170,000–$205,000. Base
  salary does not include other forms of compensation or
  benefits. Individual pay is determined by work location,
  skills, experience, and other job-related factors, which
  will be discussed during the hiring process.

