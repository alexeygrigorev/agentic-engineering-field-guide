description: |
  Senior Software Engineer, Engineering (Full-stack)

  Full-Time, Remote / Salary, Exempt

  Includes Exceptional Benefits, Flexible PTO, Flexible
  Schedule, Equity

  Steno is growing! We’re looking for a Senior Software
  Engineer to join our winning team, which is revolutionizing
  the court reporting industry every single day. We’re a
  diverse team from all over the country (and beyond) and
  we’re crazy about redefining the boundaries of an outdated
  industry.

  If you are enthusiastic about joining an engineering culture
  that has a spirit of continuous improvement in all aspects
  of building products - come join us!

  Who are you?

  We’re looking for a self-starter who is effective in
  managing their time in remote working environments. If you
  love solving problems and collaborating with others to solve
  those problems then this role is for you!

  This is a fast-paced environment, but an amazing opportunity
  for someone who wants to join a growing tech team at a mid-
  stage start-up and have a direct impact on building and
  enhancing our products!

  On a regular basis you will

  - Participate in hands-on software development, where you can
    apply your skills, knowledge and previous experiences
  - Design and implement technical solutions
  - Build and refine engineering team processes and best
    practices based on project experiences
  - Mentor less experienced engineers on the team, providing
    guidance and technical expertise

  You’re gonna crush it if

  - You love solving problems and collaborating with others to
    solve those problems
  - You've become familiar with the downsides of both under-
    engineering and over-engineering, and developed an
    appreciation for working pragmatically
  - You seek clarity, and as much simplicity as the underlying
    problem domain will allow
  - You are well organized, able to manage time effectively, and
    comfortable working through sometimes incomplete designs
    and product specs
  - You're enthusiastic about defining and cultivating a
    product-oriented engineering culture that instills a
    spirit of continuous improvement in all aspects of
    building products
  - You are humble and recognize no one or system is perfect and
    you see mistakes being made as an opportunity for
    improvement
  - You are not easily flustered if someone takes a different
    approach to solving the same problem

  Some requirements:

  - You have extensive experience with git, a high-level
    programming language (preferably a statically-typed
    language or JavaScript), and at least one kind of
    relational database
    - Familiarity with our stack - Node.js with Typescript,
      React.js front-end, and PostgreSQL
  - You are familiar with unit and integration testing and have
    put them into practice
  - You have exposure to different software architectures
    (n-tier, monolithic, distributed, etc)
  - You have exposure to cloud infrastructure and/or cloud based
    CI/CD pipelines.
  - Demonstrated track record of delivering well-engineered
    products with modern technologies for a variety of domains
  - You have an understanding of web app fundamentals up and
    down the stack, from pixels to queries and everything in
    between
  - At least 5 years of development experience
  - Bachelor's degree in computer science or equivalent
    experience
  - Bonus points if you have worked in one or more early-stage
    startups!

  Compensation & Benefits

  - Salary - $175k-$215k in base salary, plus a yearly
    discretionary bonus based on goals set by your manager
  - Health, Vision, & Dental Benefits - low-cost health plans
    that free up mind space and unlock our employees' best
    work
  - Wellness/Mental Health - shared benefits to be used among
    employees and families
  - Flexible Paid Time Off - allowing employees to find balance
    in their lives
  - Options of Equity - we know our success is nothing without
    our team
  - Access to a company-provided 401(k) account
  - A home office setup and a monthly stipend to offset internet
    and phone costs

  Our Team

  Our Tech Team is a small, highly reliable, constantly
  innovative team. It is composed of Engineering, QA, Design,
  Data, and Product. Instead of being siloed, Eng and QA work
  hand-in-hand with Product and Design for execution of new
  ideas and solutions. Our Eng team includes people from all
  levels of seniority and with a variety of backgrounds, from
  Fortune 500 to startups to FinTech to bootcamps.

  Our team is also humble, and each individual recognizes that
  no one or one system is perfect; we see errors as an
  opportunity for improvement!

  About Steno

  - Founded in 2018 and growing fast!
  - Values: be highly reliable, constantly innovate, operate
    with a hospitality mindset
  - Diverse backgrounds welcome! Steno employees have a unique
    blend of legal, technology, operations and finance
    experience
  - We are revolutionizing the litigation and court reporting
    industry
    - Flexible deferred payment options (e.g., DelayPay)
    - Cutting-edge technology - unique products and integrations
      to maximize the output of legal professionals
    - White glove, concierge customer service that our clients
      rave about

  Application Information

  - Steno is an equal opportunity employer and does not
    discriminate based on any characteristics that are
    protected under the law. All employment decisions are
    based on qualifications, merit, and business needs.
  - Applicants needing special assistance or accommodations for
    interviews or website access should contact us at
    accommodations@steno.com.
  - Steno personnel will always have either a steno.com email
    address or will contact you via Rippling Recruiting. Act
    with caution if asked for personal information. Background
    checks, for example, are only conducted after an offer is
    extended.
  - Applicants should receive a confirmation email immediately
    after applying. If you haven’t received it, check your
    email spam folder and approve the sender address to ensure
    receipt of future communications.

  - Information provided to Steno, such as professional
    credentials and skills, educational and work history, the
    results of technical skills assessments or working
    exercises, and other information that may be included on a
    resume or application, is collected and stored in our
    system. Still, we never disclose or sell your personal
    information.
  - Steno uses AI-assisted tools to help review applications and
    identify candidates whose experience aligns with the role.
    All hiring decisions are made by our People team, and a
    member of our team will personally reach out to candidates
    selected to move forward in the process.
