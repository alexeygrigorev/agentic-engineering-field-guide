title: Senior Frontend Engineer
company: Confido
location: New York, USA
work_type: FULL_TIME
company_size: 100 Employees
description: |
  The brands on your kitchen shelf are run by people doing
  extraordinary work that nobody sees.  We're building the
  platform they run on, and a brand they'll be proud to be
  part of. Confido is the AI operating system that runs cash
  application, deductions, trade and planning in one place for
  CPG brands. That means Finance, Sales, and Ops finally work
  on the same number. We’re trusted by 250+ brands managing
  $30B+ in revenue, including Daisy, OLIPOP, Simple Mills,
  Idahoan, and more. We've achieved best-in-class growth and
  recently raised a $55M Series B led by Insight Partners to
  accelerate our momentum.

  If you want your work on shelves everywhere — and outsized
  ownership while you build — we'd love to meet you.

  As a Senior Frontend Engineer, you will own the design and
  development of the user-facing experience of the Confido
  platform. You’ll build intuitive, performant interfaces that
  make complex financial workflows feel simple and actionable
  for our customers.

  You’ll work closely with engineering, design, and customers
  to translate complex operational and financial data into
  elegant, usable product experiences.

  Location: New York, NY (Relocation supported)

  What You'll Do

  - Build and scale the frontend architecture that powers the
    Confido platform
  - Develop performant, responsive, and intuitive user
    interfaces for complex workflows
  - Partner closely with backend engineers to integrate APIs and
    data systems into seamless experiences
  - Design and implement UI systems that visualize financial
    data, analytics, and forecasts
  - Create reusable components and design systems to ensure
    consistency across the product
  - Work directly with product and occasionally customers to
    understand workflows and ship high-impact features quickly
  - Own frontend performance, reliability, and overall user
    experience

  Example Problems

  - Designing interfaces for reviewing and managing invoices,
    deductions, and retailer reports
  - Building dashboards for financial analytics, forecasting,
    and demand planning
  - Creating workflows that simplify complex, multi-step
    financial operations
  - Visualizing large datasets in a way that is intuitive and
    actionable
  - Improving frontend performance and responsiveness across the
    platform
  - Developing internal tools that enable faster operations and
    decision-making

  What We're Looking ForRequired

  - 4+ years of software engineering experience, with a focus on
    frontend development
  - Strong experience with modern frontend frameworks (React or
    similar)
  - Experience building and shipping production-grade web
    applications
  - Strong understanding of UI/UX principles and building
    intuitive user experiences
  - Ability to work across engineering and product to translate
    requirements into high-quality interfaces

  Nice to Have

  - Experience working with data-heavy or analytics-driven
    applications
  - Experience with design systems or component libraries
  - Familiarity with performance optimization and frontend
    architecture patterns
  - Experience working directly with customers or cross-
    functional stakeholders
  - Interest in early-stage startups and high-ownership roles
  - CS degree or equivalent experience

  🌴 Perks + Benefits

  - Equity — own a meaningful piece of the company you’re
    helping build
  - Fully paid health coverage through Aetna — we cover 100% of
    employee premiums
  - Top-tier dental and vision coverage through Guardian
  - Carrot Fertility Pro — comprehensive fertility and family-
    forming support
  - 12 weeks of paid parental leave
  - Unlimited PTO — plus regular 4-day holiday weekends we
    actually take
  - 401(k) through Vestwell
  - Paid relocation support — we’ll help you make the move to
    NYC
  - Fully equipped workspace from day one — laptop, monitor,
    keyboard, and a $200 stipend to personalize your setup
  - Team perks — catered Friday lunches, team dinners, and
    unlimited coffee + snacks featuring products from the
    brands we work with

  Confido provides equal employment opportunities to all
  employees and applicants for employment and prohibits
  discrimination and harassment of any type without regard to
  race, color, religion, age, sex, national origin, disability
  status, genetics, protected veteran status, sexual
  orientation, gender identity or expression, or any other
  characteristic protected by federal, state or local laws.
