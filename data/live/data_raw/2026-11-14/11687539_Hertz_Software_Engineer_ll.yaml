description: |
  Come join us in our effort to digitally transform Hertz!
  Recent innovations such as smartphones, electric vehicles,
  and ride-hailing apps have created new and exciting
  opportunities in transportation that Hertz is uniquely
  positioned to capitalize on. We’re looking for software
  engineers who will modernize Hertz’s tech stack and, in the
  process, ship delightful products to meet the ever-
  increasing demands of our customers.


  What you will do: •    Implement and maintain java based
  applications that can be high-volume and low-latency •
  Contribute to all stages of software development lifecycle •
  Develop and test software •    Identify and resolve any
  technical issues arising •    Participate in design stages •
  Identify changes to current infrastructure •    Create
  technical design for the user stories using the overall
  system desin •    Write well designed, testable code •
  Conduct software analysis, programming, testing, and
  debugging •    Support continuous improvement, investigating
  alternatives and technologies, and presenting for
  architectural review


  What We're Looking For: •    B.S. in Computer Science or
  equivalent •    4+ years of experience in the technology
  industry •    Proficiency in one or more programming
  languages and common data structures / algorithms •
  Experience developing in the cloud platform using native
  cloud technologies and also building cloud agnostic
  technologies •    Modern development practices like Test
  driven development, Clean code •    Strong communication
  skills. You must be able to work with cross-functional
  partners to gather requirements and explain outcomes •
  Strong product sense. You must be able to align your work
  with business objectives and make appropriate tradeoffs


  The starting salary is $110,000 The actual salary will be
  determined based on years of relevant work experience


  What You’ll Get: •    Up to 40% off any standard Hertz
  Rental •    Paid Time Off •    Medical, Dental & Vision plan
  options •    Retirement programs, including 401(k) employer
  matching •    Paid Parental Leave & Adoption Assistance •
  Employee Assistance Program for employees & family •
  Educational Reimbursement & Discounts •    Voluntary
  Insurance Programs - Pet, Legal/Identity Theft, Critical
  Illness •    Perks & Discounts –Theme Park Tickets, Gym
  Discounts & more


  About UsThe Hertz Corporation operates the Hertz, Dollar Car
  Rental, Thrifty Car Rental brands in approximately 9,700
  corporate and franchisee locations throughout North America,
  Europe, The Caribbean, Latin America, Africa, the Middle
  East, Asia, Australia and New Zealand. The Hertz Corporation
  is one of the largest worldwide airport general use vehicle
  rental companies, and the Hertz brand is one of the most
  recognized in the world.




