description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  As a Staff Software Engineer in the Transaction Journey (TJ)
  organization, you will use your deep Frontend web expertise
  to build products that deliver high business impact to our
  customers. You will lead the design and development of a
  collaborative transaction management platform that
  streamlines the process of buying and selling homes, which
  spans key areas such as: transaction forms, eSign,
  compliance review, and commissions processing. You will lead
  teams to deliver features that make it easier for agents to
  work with clients and other parties to complete critical
  tasks throughout the transaction, so that they can spend
  less time managing it, and more time with their clients, and
  building their business. You will collaborate cross-
  functionally with multiple teams as well as with our product
  and design teams to identify and deliver the right solutions
  for our customers and support the growth of the world’s most
  scalable brokerage.

  You are an engineer who is passionate about creating great
  products that are easy to use. You feel it is critical that
  your voice is heard in product and business decisions. You
  love to learn, and equally love to share your knowledge with
  others. You are a great communicator and you take care to
  understand before making yourself understood.

  You design systems that are fault tolerant, scalable, highly
  available, well-tested, eventually consistent, and follow
  best practices such as the single responsibility principle.
  Your code is designed for modularity and re-use. You take
  pride in delivering solid code that is well-tested, peer-
  reviewed, and follows best practices. You have strong
  opinions on code structure, style, and development
  processes.

  At Compass, You Will:

  - Provide strategic direction and ownership of platform
    architecture, data ingestion and normalization, to deliver
    an industry leading search experience at scale.
  - Independently define and lead the delivery of complex
    technical projects across the entire stack.
  - Champion a culture of operational excellence by defining
    reliability KPIs, establishing accountability for service
    health, and leading architectural improvements that
    proactively reduce technical debt, manual toil, and
    infrastructure costs.
  - Adopt and operationalize modern and emerging software
    patterns, including integrating AI, data pipelines, and
    telemetry systems to automate workflows
  - Operate in a scalable engineering culture that leverages
    modern principles of AI assisted workflows, decoupled
    systems, and automated CI/CD/testing/monitoring to drive
    efficiencies
  - Inspire, recruit, and mentor fellow engineers.
  - Join a great team with a lot of visibility and some
    challenging projects on the horizon

  What We Look For:

  - BS in Computer Science, Software Engineering or equivalent
    practical experience
  - 10+ years of experience developing comprehensive, well-
    tested, and high-performance software applications in
    Typescript, Javascript, and HTML/CSS
  - 5+ years of experience with React and NodeJS
  - 3+ years of experience using AWS / cloud technologies
  - A track record as a technical leader with cross-team impact
  - Understanding and adherence to industry-standard best
    practices in software development and architecture while
    keeping abreast of evolving technologies in AI
  - A sheer eye for design and attention to detail, the products
    you build should not merely be functional but should take
    in context and anticipate our customer’s needs in a
    beautiful way
  - Strong critical thinking skills, great communication skills
    and passion for delivering operational excellence
  - Strong familiarity with continuous integration/continuous
    delivery (CI/CD) pipelines, containerization, and
    Agile/Scrum methodologies
  - Excellent verbal and written communication skills with a
    strong sense of technical empathy for your end-users
    (whether they are real estate agents or fellow developers)
  - Nice to have: Experience with backend programming experience
    using languages such as Java, Golang, or Python
  - Nice to have: Experience with Kafka and event-driven
    systems, gRPC, Thrift, and other server-to-server
    communication protocols

  If you're passionate about shaping the future of real estate
  technology and possess the skills and experience we're
  seeking, we encourage you to join our dynamic team at
  Compass. Together, we'll continue to transform the industry.

  Compensation: The base pay range for this position is
  $228,000- 240,000 however, base pay offered may vary
  depending on job-related knowledge, skills, and experience.
  Bonuses and restricted stock units may be provided as part
  of the compensation package, in addition to a full range of
  benefits. Base pay is based on market location. Minimum wage
  for the position will always be met.

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



  Do your best work, be your authentic self.

  At Compass, we believe that everyone deserves to find their
  place in the world — a place where they feel like they
  belong, where they can be their authentic selves, where they
  can thrive.  Our collaborative, energetic culture is
  grounded in our Compass Entrepreneurship Principles and our
  commitment to diversity, equity, inclusion, growth and
  mobility. As an equal opportunity employer, we offer
  competitive compensation packages, robust benefits and
  professional growth opportunities aimed at helping to
  improve our employees' lives and careers.

