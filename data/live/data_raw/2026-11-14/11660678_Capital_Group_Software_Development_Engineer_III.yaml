description: |
  “I can be myself at work.”

  You are more than a job title. We want you to feel
  comfortable doing great work and bringing your best,
  authentic self to everything you do. We value your talents,
  traditions, and uniqueness—and we’re committed to fostering
  a strong sense of belonging in a respectful workplace.

  We intentionally seek diverse perspectives, experiences, and
  backgrounds, investing in a culture designed to celebrate
  differences. We believe that belonging leads to better
  outcomes and a stronger community of associates united by
  our mission. At Capital, we live our core values every day:
  Integrity, Client Focus, Diverse Perspectives, Long-Term
  Thinking, and Community.



  “I can influence my income.”



  You want to feel recognized at work. Your performance will
  be reviewed annually, and your compensation will be designed
  to motivate and reward the value that you provide. You’ll
  receive a competitive salary, bonuses and benefits. Your
  company-funded retirement contribution will factor in salary
  and variable pay, including bonuses.



  “I can lead a full life.”



  You bring unique goals and interests to your job and your
  life. Whether you’re raising a family, you’re passionate
  about where you volunteer, or you want to explore different
  career paths, we’ll give you the resources that can set you
  up for success.

  - Enjoy generous time-away and health benefits from day one,
    with the opportunity for flexible work options
  - Receive 2-for-1 matching gifts for your charitable
    contributions and the opportunity to secure annual grants
    for the organizations you love
  - Access on-demand professional development resources that
    allow you to hone existing skills and learn new ones

  As a senior Software Development Engineer, you will help
  lead and contribute hands on to the Enterprise Data Office
  (EDO) Content Delivery team. You will collaborate closely
  with peers across EDO, GT and global business partners to
  enable, transform and optimize the delivery of software
  applications and data solutions that support Capital Group’s
  strategic growth.

  This is a role for an experienced full stack engineer with
  AI experience who combines strong application engineering
  depth with modern data and AI approach. You will contribute
  directly to discovery, architecture, design, coding,
  testing, deployment and operational excellence, while
  mentoring engineers and helping the team adopt practical AI-
  enabled engineering practices where they add measurable
  value.

  The role sits within EDO Content Delivery and focuses on
  building and improving full stack applications and data-
  enabled products, including product reference data
  management, client-facing data applications, AI enabled
  applications, and marketing/publishing data automation. AI
  experience is important because you will help enhance and
  improve the AI engineering capabilities within our
  applications and team, applying generative AI and automation
  responsibly to improve engineering productivity,
  application, data quality, controls and user outcomes.

  What you'll do

  Lead full stack engineering delivery

  - Partner directly with business and product leaders to
    understand workflows, identify high-value opportunities
    and translate ambiguous needs into clear outcomes,
    acceptance criteria and technical specifications.

  - Design, build and operate modern full stack applications,
    APIs, data workflows and user-facing capabilities that
    support EDO Content Delivery priorities.

  - Develop intuitive, accessible and maintainable front-end and
    UI experiences that make EDO applications easier to use,
    support and extend.

  - Help establish strong full stack engineering practices
    across the team, setting a high bar for technical quality,
    collaboration, inclusion and continuous learning.

  - Use AI-enabled tools and practices to improve discovery,
    engineering productivity, testing, documentation, data
    quality and operational support where they are appropriate
    and well controlled.

  Implement modern AI solutions

  - Implement end-to-end retrieval-augmented generation
    solutions, including parsing, ingestion, chunking,
    metadata, embeddings, vector storage, retrieval,
    reranking, context assembly and prompt management.

  - Apply sound system-design and distributed-systems judgement
    across structured and unstructured data, with particular
    attention to data quality, lineage, cataloguing and access
    controls.

  Deliver production excellence

  - Implement and deliver solutions end to end, from partnering
    on discovery and architecture through implementation,
    controlled rollout, adoption and ongoing operations.

  - Practise evaluation-driven development by defining
    acceptance criteria early and building automated
    evaluation harnesses that measure correctness,
    groundedness, hallucination, safety, latency and task
    success.

  - Implement observability, monitoring, cost attribution, audit
    trails and service-level measures so teams can detect
    degradation, diagnose failures and prevent regressions.

  - Use engineering metrics and measurable value outcomes to
    guide technical investment, improve delivery and
    demonstrate the impact of AI capabilities.

  Provide technical leadership

  - Lead solution reviews and technical decision-making across
    initiatives, balancing speed, quality, risk,
    maintainability and business value.

  - Contribute code and hands-on problem solving where it
    creates the greatest leverage, particularly for complex
    designs, reusable components and production-critical
    issues.

  - Coach and mentor engineers across AI, software, data and
    platform disciplines, helping them build practical skills
    and sound engineering judgement.

  - Codify successful approaches into reusable services,
    libraries, patterns, reference architectures and playbooks
    that accelerate the wider organisation.

  - Build strong partnerships across global teams and time
    zones, influencing outcomes.

  Required qualifications

  - Substantial experience leading complex software, platform,
    cloud, data or AI engineering initiatives, including
    helping build or scale a capability from an early stage.

  - Demonstrable hands-on engineering depth, with the ability to
    contribute production code, lead technical design and
    challenge architecture constructively.

  - Hands-on experience designing, building and shipping
    software and AI or machine-learning solutions for real
    business problems.

  - Practical knowledge of prompt engineering, retrieval
    architectures, agent development and evaluation methods
    for generative AI systems.

  - Strong software engineering fundamentals, including APIs,
    system design, distributed-systems concepts, cloud-native
    development, testing, CI/CD and production operations.

  - Strong front-end and UI development experience, including
    building responsive, accessible and user-centred
    interfaces using modern web frameworks and design-system
    patterns.

  - Experience integrating applications with enterprise data
    platforms and working across structured and unstructured
    data, metadata, semantic or context layers and data-
    quality controls.

  - A track record of influencing senior technology and business
    stakeholders and translating effectively between business
    outcomes and technical decisions.

  - Systems thinking and high agency, with the judgement to
    navigate ambiguity and make pragmatic trade-offs between
    scope, speed, risk, cost and quality.

  - Excellent written and spoken communication, with the ability
    to explain complex topics clearly to technical and non-
    technical audiences.

  - Bachelor's degree in Computer Science, Engineering or a
    related technical field, or equivalent practical
    experience.

  - The right to work in the UK, the ability to work from London
    on a hybrid basis, and openness to travel and collaborate
    across time zones, particularly with US teams.

  Preferred qualifications

  - Experience in financial services or another highly regulated
    enterprise environment.

  - Experience with public cloud and modern data or AI
    platforms, including technologies such as AWS, Azure AI or
    Databricks.

  - Experience designing and delivering full stack applications
    across front-end, API, service and data layers, with a
    strong understanding of how user experience, business
    logic and data quality fit together.

  - Strong hands-on experience with modern front-end and UI
    development, including component-based frameworks,
    responsive design, accessibility, usability and
    integration with enterprise design standards.

  - Experience building reliable backend services, APIs and
    integrations, including authentication, authorisation,
    observability, testing, CI/CD and secure production
    support.

  - Experience enhancing existing applications with AI-enabled
    capabilities, automation or intelligent user experiences,
    while applying sound engineering judgement, controls and
    maintainability practices.

  - Experience mentoring senior engineers, setting technical
    standards and influencing engineering practice across
    organisational boundaries.

  What you bring

  - You operate with urgency, ownership, humility and strong
    collaboration.

  - You move confidently between strategic context,
    architectural decisions and detailed engineering
    implementation.

  - You hold high standards for code quality, testing, clarity,
    security and reliability, while applying judgement about
    which standards matter most in each context.

  - You challenge constructively, propose better alternatives
    and protect quality and team capacity when it counts.

  - You stay current as models, tooling and engineering
    practices evolve, and you help others learn and adapt.

  - You are motivated by meaningful impact, strong engineering
    outcomes and the growth of those around you.

  What success looks like

  - AI solutions deliver measurable improvements to client
    experiences, business workflows or engineering
    productivity.

  - Production AI services are secure, observable, resilient,
    auditable and cost-effective.

  - Teams adopt reusable AI engineering patterns, evaluation
    practices and responsible delivery standards.

  - Engineers grow their practical AI capabilities through
    coaching, shared standards and hands-on collaboration.

  - The organisation becomes faster at moving valuable AI use
    cases from discovery into dependable production services.

