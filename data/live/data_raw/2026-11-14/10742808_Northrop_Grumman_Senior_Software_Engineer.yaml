description: |
  UK CITIZENSHIP REQUIRED FOR THIS POSITION: Yes

  RELOCATION ASSISTANCE: Relocation assistance may be
  available

  TRAVEL: Yes, 10% of the Time

  Senior Software Engineer

  Location: London – hybrid

  Salary: £49,000 - £72,000 DOE

  Clearance: You must currently hold the highest level of UK
  Government clearance

  Define Possible at Northrop Grumman UK

  At Northrop Grumman UK, our mission is to solve the most
  complex challenges by shaping the technology and solutions
  of tomorrow. We call it Defining Possible.

  This mind-set goes beyond our customer solutions; it’s the
  foundation for your career development and the impact we
  have within the community. So, what’s your possible?

  Opportunity:

  This is more than just a job; it’s a mission.

  As a Senior Engineer you play a pivotal role in designing,
  developing and maintaining the critical infrastructure that
  powers our services. You will be self-driven and organised
  with a passion for building elegant and stable solutions.
  You will have the chance to work on a variety of exciting
  projects with complex challenges within a unique space.
  You’ll be at the forefront of delivering core solutions that
  have real world impact.

  In addition, you will have a strong leadership mentality,
  guiding your team through both technical and delivery
  challenges to accommodate the customer’s requirements.

  “My purpose is to lead a team of engineers, rise to the
  challenges presented, push the boundaries and define
  possible together.” – Matthew Bullock, Software Manager at
  Northrop Grumman UK.

  Responsibilities:

  - Perform hands-on development and actively contribute to the
    code base including peer review of code
  - Perform design of software features to realise the product
    road map and be able to explain design choices
  - Support breaking down of large pieces of work into well-
    defined tasks to be implemented in an Agile manner
  - Support setup and maintenance of continuous integration and
    deployment pipelines
  - Perform demonstrations to internal and external customers of
    development work

  Benefits:

  We can offer you a range of flexible, hybrid and options to
  suit you, including optional compressed working schedule
  with every other Friday off. Our benefits including private
  health care, career development opportunities and
  performance bonuses. For a comprehensive list of benefits,
  speak to our recruitment team.

  We are looking for:

  - Experience as a Software Engineer in one of:
    - Backend development and it’s ecosystem (Java Spring boot,
      Maven, Python)
    - Frontend development and it’s ecosystem (JS/TS, React, Npm)
  - Familiarity with CICD, containerisation, deployment
    technologies & cloud platforms (Jenkins, Kubernetes,
    Docker, AWS).
  - Understanding of database technologies such as SQL,
    Elasticsearch or MongoDB
  - Strong communication, collaboration & problem solving
    skills, ideally with some experience in agile ways of
    working.

  Security clearance:

  You must be able to gain and maintain the highest level of
  UK Government clearance .

  Our recruitment team is on hand to answer any questions and
  we will guide you through the process:
  talentenquiries@uk.ngc.com.

  Why join us?

  - A mission to believe in – Every day we contribute to
    building a more secure and connected world, expanding our
    reach from land, sea, and air to space and cyberspace.
    From engineering data and intelligence solutions, to
    developing maritime navigation and control systems and
    innovating command and control systems for the UK and
    NATO, what we do together matters.
  - A place to belong and thrive – Every voice matters at our
    table meaning you can bring your authentic self to work.
    From our Employee Resource Groups backed by thousands of
    employees, to sponsoring our partnerships with Association
    For Black and Minority Ethnic Engineers, Forces Transition
    Group, Mind, and Women in Defence – we are passionate
    about growing and supporting our inclusive community where
    everyone can belong.
  - Your career, your way - Shape your career journey with
    diverse roles, mentorship, and development opportunities
    that fuel your curiosity, channel your expertise and
    nurture your passion. Looking for flexibility? Balance
    your professional career with your personal life, health
    and wellbeing benefits, discount schemes, pension benefits
    and investment in your future development. Speak to our
    team to find the balance that’s right for you.

  Ready to apply?

  Yes – Submit your application online. Your application will
  be reviewed by our team and we will be in touch.

  Possibly, I’d like to find out more about this role – Reach
  out to our team for more information and support:
  talentenquiries@uk.ngc.com.

  No, I don’t think this role is right for me – Our extensive
  UK growth means we have exciting, new opportunities opening
  all the time. Speak to our team to discuss your career
  goals.

  Northrop Grumman is committed to hiring and retaining a
  diverse workforce, and encourages individuals from all
  backgrounds and all abilities to apply and consider becoming
  a part of our diverse and inclusive workforce.
