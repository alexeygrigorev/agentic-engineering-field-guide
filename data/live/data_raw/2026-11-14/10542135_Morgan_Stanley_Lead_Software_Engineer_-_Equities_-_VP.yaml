description: |
  We’re seeking someone to join our team as aaJava developer
  to work on automated trading systems, primarily in the
  Equities domain. The candidate should possess good
  analytical skills & computer programming experience, a
  logical approach to problem solving. The role involves
  building, deploying & supporting algorithmic trading
  strategies, analytical tools and scalable trading engine
  infrastructure, working as part of a fast-moving IT / quant
  / trading team. The candidate should be a strong problem
  solver and be able to work in a fast-paced environment.

  In the Technology division, we leverage innovation to build
  the connections and capabilities that power our Firm,
  enabling our clients and colleagues to redefine markets and
  shape the future of our communities.

  This is a Lead Software Engineering position at VP level,
  which is part of the job family responsible for developing
  and maintaining software solutions that support business
  needs.

  Since 1935, Morgan Stanley is known as a global leader in
  financial services, continuously evolving and innovating to
  better serve our clients and our communities in more than 40
  countries around the world What you'll do in the role:

  - Communicate regularly with product leads across the
    technology organization and discuss opportunities for
    improvement to existing and future technology solutions.
  - You will be using core Java development to build and enhance
    trading strategies and engines
  - The role involves working directly with the global trading,
    quant and IT teams to advance the platform and the
    businesses it serves
  - The project portfolio is typically varied, spanning new and
    existing algorithm development, improving the technical
    and execution performance of trading systems, the
    generation and analysis of trading signals & data
  - You will part of a team which is involved in the full system
    development lifecycle from discussing and agreeing
    requirements through to designing, developing and
    deploying the changes
  - The systems you will work on are high volume, low latency,
    resilient, scalable and message-driven based on cutting
    edge Java and utilising the latest hardware

  What you'll bring to the role:

  - Ability to effectively manage multiple functions or guide
    junior staff and initiatives.
  - Advanced understanding of business line and discipline with
    some knowledge of competitive environment and other
    disciplines.
  - Core Java knowledge in a UNIX/Linux environment.
  - Ability to analyse business & technical requirements and
    translate them into a well designed & programmed solution
  - A logical approach to problem solving and good analytical
    skills
  - Strong communication skills and ability to work in a global
    team
  - Experience with Git/Stash and Jenkins
  - Experience with unit testing frameworks such as JUnit
  - An interest to learn the business supported by the
    applications
  - Good Linux fundamentals
  - Interest in developing systems for automated market making,
    DMA or algo trading group in liquid markets (equities, FX,
    liquid rates, etc.) using FIX protocol
  - Experience with web service development, REST, TypeScript
    knowledge with preferably Angular framework
  - Experience with low-latency messaging middleware pub/sub
    technologies.
  - Experience of time-series data analysis in technologies such
    as KDB/q

  #LI-LM1 #LI-Hybrid

  WHAT YOU CAN EXPECT FROM MORGAN STANLEY:

   At Morgan Stanley, we raise, manage and allocate capital
  for our clients – helping them reach their goals. We do it
  in a way that’s differentiated – and we’ve done that for 90
  years.  Our values - putting clients first, doing the right
  thing, leading with exceptional ideas, committing to
  diversity and inclusion, and giving back - aren’t just
  beliefs, they guide the decisions we make every day to do
  what's best for our clients, communities and more than
  80,000 employees in 1,200 offices across 42 countries. At
  Morgan Stanley, you’ll find an opportunity to work alongside
  the best and the brightest, in an environment where you are
  supported and empowered. Our teams are relentless
  collaborators and creative thinkers, fueled by their diverse
  backgrounds and experiences. We are proud to support our
  employees and their families at every point along their
  work-life journey, offering some of the most attractive and
  comprehensive employee benefits and perks in the industry.
  There’s also ample opportunity to move about the business
  for those who show passion and grit in their work.

  To learn more about our offices across the globe, please
