description: |
  Via is on a mission to create public transportation systems
  that provide far greater access to jobs, healthcare, and
  education. Our platform serves as the technology backbone
  for modern transit networks, transforming antiquated and
  siloed public transportation systems into smart, data-
  driven, and efficient digital networks. With hundreds of
  agency partners around the world, Via is recognized as the
  leading transportation technology and service provider
  globally.

  As a Senior Software Engineer on the Remix engineering team,
  you’ll build software cities rely on to design and improve
  public transportation systems with a focus on access,
  equity, and long-term sustainability. You’ll own features
  end to end from concept to production while shaping what we
  build and how we build it. Our stack includes Python, Ruby,
  TypeScript, and React, but we care most about strong
  engineering fundamentals and a user-centered approach to
  building products. You'll work on features used by some of
  the largest transit networks in the world, involving
  optimization, geospatial computation, machine learning, and
  AI.

  About the Role:

  - Improve our planning and scheduling products to help
    planners explore new concepts, make informed decisions
    with data, and deliver better service to their riders.
  - Build, scale, and improve the optimization and backend
    systems behind those products, and make sure they run fast
    and reliably in production.
  - Collaborate with designers, data scientists, algorithm
    researchers, product managers, our in-house transit
    planners and schedulers, and our customers.
  - Work with a variety of technologies across our stack for
    different projects, all to deliver great end-to-end user
    experience.
  - Contribute to discussions about engineering best practices
    and architecture within your relevant area of expertise.
  - Build and maintain our processes and tools, to keep our
    productivity and code quality high.

  About You:

  - You have at least 6 years of professional software
    engineering experience.
  - You’ve built and scaled a computationally hard system in
    production, such as optimization, routing, search,
    simulation, or geospatial processing.
  - Mission-driven: you’re passionate about companies with
    strong values and missions.
  - User-centric: you find value in talking to customers and
    addressing core customer needs.
  - You use AI tools effectively in your day-to-day engineering
    work.
  - Collaborative, humble, empathetic, and feedback-driven.
  - Experience with operations research, mathematical
    optimization, or applied machine learning is a plus, but
    not required.
  - Experience with geospatial data, mapping technologies, or
    data visualization is a plus, but not required.

  Compensation and Benefits:

  - Final salary will be determined by the candidate’s
    experience, knowledge, and skills. Salary reflected does
    not include equity or variable pay, where applicable.
  - Salary Range: $180,000-$220,000
  - We are proud to offer a generous and comprehensive benefits
    package, including free medical plans and 401K matching.

  There has never been a more exciting time to be on the
  cutting edge of public mobility. Ready to join the ride?

  Via is an equal opportunity employer.
