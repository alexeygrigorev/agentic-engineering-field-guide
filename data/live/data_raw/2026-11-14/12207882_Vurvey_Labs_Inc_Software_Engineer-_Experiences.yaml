description: |
  ABOUT VURVEY LABS Vurvey Labs is where frontier intelligence
  meets real human experience. Our core product, Freckle,
  allows organizations to move beyond what people say,
  building People Models that capture how they actually think,
  feel, and behave. By blending advanced AI simulations with
  real-world validation, we help major global brands and
  agency partners co-create deeply with their audiences.

  Why Join Us:

  - Category-Defining Work: You aren't just maintaining legacy
    systems; you're actively ensuring that real human voices
    remain central to AI. Your work lands directly in the
    hands of global industry leaders.
  - A Unified, Autonomous Team: We believe in small, cross-
    functional teams where researchers, engineers, and
    strategists work in one seamless loop. You will always see
    the big picture and own your piece of the puzzle.
  - Driven by Connection: We prioritize genuine human connection
    in everything we do. We are intentional about how we
    collaborate, fostering a culture of transparency, trust,
    and deep respect for the people behind the work.

  About the Role

  At Vurvey Labs, we are redefining how people and brands
  collaborate through AI-powered insights and storytelling. As
  a Software Engineer on our Experiences team, you will help
  design and build custom AI agent applications that bring
  Vurvey to life at major global events—such as Cannes Lions,
  CES, and Advertising Week—and directly on our clients' web
  platforms.

  Blending visual design, software engineering, and AI, you
  will partner alongside a senior engineer to take projects
  from initial concept to live interactive experiences across
  mobile apps, large touch-screen displays, and embeddable web
  widgets. In this role, you will champion an AI-first
  workflow to create engaging, memorable interfaces that make
  users stop, interact, and connect with intelligent agents in
  real time.

  What you'll do:

  - Design End-to-End User Experiences: Translate brand
    guidelines into intuitive visual identities, user flows,
    and interactive interfaces without relying on pre-existing
    Figma designs.
  - Build Cross-Platform AI Applications: Develop and deploy
    multi-platform applications using Flutter for iOS,
    Android, and touch-screen displays, alongside React and
    TypeScript for embeddable web components.
  - Animate Conversational Interfaces:  Create engaging AI-
    driven user experiences with streaming responses, voice
    input, and smooth animations using Flutter animations and
    Motion for React.
  - Prototype and Iterate Rapidly: Turn creative ideas into
    working prototypes quickly, adjusting designs based on
    feedback and navigating tight timelines around major live
    events.
  - Support Full-Stack Integrations: Extend and maintain Node.js
    and TypeScript GraphQL APIs to supply necessary endpoints
    and backend functionality for front-end experiences.
  - Leverage AI Development Assistants: Utilize modern AI-
    powered tools like Claude Code within daily workflows to
    accelerate delivery speed while maintaining high software
    quality.

  What you'll bring:

  - 2–5 years of software engineering experience or a strong
    portfolio demonstrating custom-designed,
  - High proficiency in TypeScript and React, alongside
    Flutter/Dart experience or an eagerness to master Flutter
    rapidly.
  - Exposure to LLM integrations, conversational UI design, or
    utilizing AI development tools to optimize engineering
    workflows
  - Experience with API design (GraphQL preferred), Git version
    control, and web or mobile deployment environments.

  - Deep experience with AI prompting, building AI agents, and
    evaluating LLM output quality for production use cases.
  - Familiarity with version control, deployment pipelines, and
    operational systems for managing AI workflows and testing
    frameworks.
  - Strong cross-functional communication skills with a bias for
    action and the ability to seamlessly translate analytical
    findings into design execution.
