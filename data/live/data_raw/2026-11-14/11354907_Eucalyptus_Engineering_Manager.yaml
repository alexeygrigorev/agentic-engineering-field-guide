description: |
  We're the world's leading consumer healthcare platform,
  supporting millions of patients across the US, Australia,
  the UK, Germany, Japan, Spain and Canada.

  We're driven by the belief that good health should last a
  lifetime, and that to get there we need to deliver the
  personalised, high quality and empathetic care that the
  traditional system cannot support.

  You'll partner with our care teams of prescribers, nurses,
  health coaches, pharmacists and dietitians to support
  patients across preventative health, weight management and
  specific women's and men's health conditions.

  We joined Hims & Hers so that you can do all of the above on
  a bigger scale, with more ambition, a stronger global brand
  and the resources to deliver care to patients in dozens of
  countries.

  We're looking for people who appreciate and are excited by
  the enormity and uniqueness of this challenge, and want to
  work in the most ambitious, smart, fast moving and positive
  sum environment of their lives to transform how healthcare
  is delivered globally.

  We hope that's you.

  About the Role

  As an Engineering Manager, you will lead an engineering team
  to ensure fast, high-quality execution. You will focus on
  rapid experimentation and technical excellence across the
  full customer lifecycle - from awareness and acquisition
  through to retention, revenue, and referral.

  As Engineering Manager, you’ll lead or more small squads,
  typically our teams consist of 3-4 engineers working
  alongside a product manager and a designer. Each squad owns
  its problem area and its OKRs end to end, with very little
  red tape. We ship hundreds of times a month, merged code is
  live in minutes, and growth experiments read out in weeks,
  so you’ll quickly see what your team’s work does for
  patients and for the business.

  Engineering here is deliberately lean, which means every
  leader has real influence over what gets built and how, and
  progression means more ownership, not just a bigger team.
  You’ll stay close to the architecture and technical
  decisions, working with senior engineers who value someone
  who can challenge a design and keep the team moving.

  Operating at the intersection of engineering, product, and
  growth marketing, you will partner with cross-functional
  stakeholders to translate strategic visions into scalable
  engineering solutions. You will be responsible for
  empowering your team, optimising execution velocity, and
  maintaining high engineering standards as we scale our
  preventative care ecosystem globally.

  Key Responsibilities

  - Ensure High-Quality Execution: Manage an engineering team or
    function to drive fast, reliable software delivery.
  - Resolve Technical & Operational Blockers: Act as an
    escalation point for complex technical and operational
    issues, solving them efficiently to keep projects on
    track.
  - Optimise Workloads: Balance priorities and take active
    responsibility for optimising team workload to maintain
    predictable delivery without burnout.
  - Drive Growth & Experimentation: Own the execution of
    sophisticated, data-driven experiments and growth
    initiatives across the entire patient journey.
  - Improve Engineering Processes: Continuously refine
    development processes, workflows, and team structures to
    build a high-velocity environment.
  - Build & Mentor Talent: Partner with talent acquisition teams
    to recruit, onboard, and retain world-class engineers
    while fostering a culture of ownership, psychological
    safety, and high morale.
  - Align Cross-Functionally: Partner seamlessly with Product,
    Marketing, and Data stakeholders to align technical
    delivery with commercial goals.

  About You

  - Technical Strength & Codebase Ownership: You are technically
    strong and partner credibly with senior engineers-able to
    evaluate system architecture and spot when technical
    estimates lack substance. Coding is not the primary job,
    but you are comfortable getting on the tools in an
    ecosystem built on React, React Native, TypeScript, Go
    microservices, GraphQL, Kubernetes, and GCP, and
    delivering work to unblock your team.
  - Leadership Experience: Proven track record leading an
    engineering team to ensure fast and high-quality
    execution. First-time managers are welcome!
  - Operational Focus: Demonstrated capability in solving
    escalated issues, optimising team workloads, and driving
    continuous improvements across team workflows and
    structures.
  - Experimentation & Growth Mindset: Hands-on background or
    strong familiarity with rapid experimentation, A/B
    testing, and building software optimised for user
    engagement, conversion, and retention.
  - People-First Leadership: Skilled at mentoring engineers,
    navigating shifting priorities, and nurturing an
    inclusive, highly motivated team culture.
  - Cross-Functional Collaboration: Exceptional communication
    skills with a history of bridging technical delivery with
    product strategy, growth marketing, and commercial
    outcomes.

  Nice to Have

  - Experience in regulated sectors (such as healthtech, fintech
    or gaming), finding creative paths forward inside
    compliance constraints rather than being stopped by them.

  Why join Eucalyptus

  - What's next - Our goal for the next three years is to
    support 1 million patients globally to live better for
    longer, launching into new conditions, demographics and
    geographies.
  - Build something world-changing - We're on the path to
    becoming the world's largest international digital
    healthcare company. It will be challenging, fast-paced and
    deeply rewarding.
  - Make real impact - Your work directly shapes patient
    outcomes and scales evidence-based care across markets.
  - Accelerate your growth - High ownership, continuous feedback
    and dedicated development support.
  - Join a motivated team - Talented peers solving complex
    clinical and operational problems at scale.

  What's ahead in the UK

  - Be an owner - Your own stake in the business with our
    employee options programme
  - Invest in your growth - Annual development budget plus 3
    days of professional development leave
  - Work flexibly - Hybrid setup with 3 days a week in our Old
    Street office, designed for focus and collaboration
  - Support your well-being - Private health insurance through
    Vitality, or a monthly wellness allowance to spend on what
    matters most to you
  - Take time off - 25 days of holiday, enhanced parental leave
    and work from anywhere 3 weeks a year
  - Join a connected team - A vibrant office culture with
    regular socials, clubs, after-school sport and seasonal
    events

  At Eucalyptus, we value individuals from all backgrounds,
  experiences, and perspectives, and we embrace the unique
  qualities each person brings. When you apply, please let us
  know of any reasonable adjustments you may need during the
  interview process. We use AI-assisted tools across our
  business to help our teams work more efficiently, including
  within our recruitment process. These tools support our team
  — all hiring decisions are made by real people, and every
  application is reviewed by a member of our recruitment team.
