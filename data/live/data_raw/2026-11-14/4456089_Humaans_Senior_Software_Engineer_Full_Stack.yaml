description: |
  About us

  Humaans is building the next generation of infrastructure
  for the workplace; software designed for companies that are
  scaling fast, operating globally, and pushing into new
  boundaries. What started as a system of record has evolved
  into a broader platform for operating people globally. With
  Athena, our agentic AI layer, Humaans moves beyond data
  management into intelligent orchestration, connecting
  workflows across HR, IT, Finance, and Operations so
  organisations can act faster and with greater confidence,
  redefining how work gets done. We work with ambitious teams
  across Europe and the US, from AI-native companies like
  Lovable, Poolside, Fyxer AI, and Tandem Health, to
  established, high-growth organisations scaling
  internationally and through acquisition, including Quantexa,
  Sellpy, Manychat, Gigs, Croud, and Threecolts. These teams
  don’t buy software for features,they buy leverage. The
  ability to run faster, cleaner, and with more control as
  complexity compounds. To date, we’ve raised $20m in venture
  funding from some of the most respected founders, operators,
  and funds in technology: Lachy Groom (Physical
  Intelligence), Stewart Butterfield (Slack), Tobias Lütke
  (Shopify), Dylan Field (Figma), Jeff Weiner (LinkedIn),
  Claire Johnson (Stripe), Oliver Jay (OpenAI), Jay Simmons
  (Bond) as well as Y Combinator, Moonfire, Frontline
  Ventures, Pathlight Ventures, and Exor. If you have massive
  ambition and want to work on a hard problem, with a small
  team that moves fast, at a moment when the category is
  genuinely up for grabs - this is it.

  The role

  We’re looking for a Senior Software Engineer to help us
  build and evolve Humaans as we continue to scale.

  We obsess over the details and quality of our user-facing
  experiences and the engineering behind them. At the same
  time, we move fast by creating focus, making pragmatic
  decisions and investing in high-quality foundations that
  allow us to keep moving quickly as the product grows.

  This is an end-to-end engineering role. You’ll work across
  the stack, from shaping what we build with Product and
  Design through to implementation, release and iteration. On
  any given day you might be building a new customer-facing
  feature, improving our infrastructure, expanding an
  integration or helping solve a problem for a customer.

  You’ll have meaningful ownership over both the product and
  the technical decisions behind it, with the opportunity to
  contribute to how our architecture evolves as Humaans grows.

  What you’ll do

  - Help shape product features from early definition through to
    implementation, release and iteration
  - Build end-to-end customer-facing features across our
    frontend and backend
  - Write backend TypeScript across Node, Postgres, Redis and
    Kubernetes
  - Build frontend experiences using TypeScript and React
  - Fix bugs, improve infrastructure and strengthen the
    foundations that allow us to move quickly without
    compromising quality
  - Expand our third-party integration marketplace and build
    reliable connections between Humaans and the wider HR
    technology ecosystem
  - Contribute to technical architecture decisions and help us
    make thoughtful trade-offs as the product scales
  - Work closely with Product and Design to turn ideas and
    customer problems into high-quality experiences
  - Support customers when technical problems require
    engineering input, getting close to the problems people
    experience in the real world
  - Partner with Sales and Marketing when engineering context
    can help us communicate, demonstrate or deliver the value
    of Humaans

  What we’re looking for

  - Multiple years of industry experience building full-stack
    web applications, ideally within SaaS
  - Strong TypeScript knowledge and a genuine appreciation for
    the language
  - Experience working across both backend and frontend systems
    and taking features from idea through to production
  - Strong product instincts and an appreciation for design,
    usability and digital product craftsmanship
  - Experience collaborating directly with Product and Design
    rather than working from requirements in isolation
  - A proven track record of shipping work that creates
    meaningful value for customers or users
  - The ability to balance speed with quality, knowing when to
    move quickly and when investing in stronger foundations
    will pay off
  - Strong engineering judgement and an interest in contributing
    to technical architecture as the product evolves
  - A high degree of ownership and comfort working across
    whatever part of the product or stack is needed to solve
    the problem

  You may not be a great fit if

  - You prefer specialising exclusively in frontend, backend or
    infrastructure rather than working across the stack
  - You want to receive fully specified requirements rather than
    helping shape what gets built and how
  - You’re more interested in technical complexity than the
    quality and usefulness of the product customers ultimately
    experience
  - You prefer engineering to happen separately from Product and
    Design rather than collaborating closely throughout the
    process
  - You’re uncomfortable moving between product features, bugs,
    infrastructure, integrations and customer problems as
    priorities change
  - You optimise exclusively for speed or technical perfection
    rather than making pragmatic decisions that balance both
  - You prefer staying removed from customers, Sales and other
    parts of the business rather than helping where
    engineering context can make a difference

  Our tech stack

  Our tech stack today consists of TypeScript, JavaScript,
  React, Node, Postgres and Redis. We use GitHub for code and
  continuous integration to deploy to Kubernetes on Google
  Cloud Platform. We have a public REST API and our browser
  client uses a realtime WebSocket API.

  This is an in-person role. Our team comes together in the
  office Monday through Thursday, while most of the team
  collaborates in person on Mondays, Tuesdays, and Thursdays.

  Package & Benefits

  Early stage startups can be messy – we know that. We're
  putting effort in providing you with the best employee
  experience and a quality driven environment in exchange for
  trusting us.

  - Market-leading compensation that reflects your value
  - 25 days paid time off each year plus public holidays
  - Share Options with 5-year exercise window so you don’t feel
    pressure to exercise if you leave
  - Quarterly team events, and company offsites
  - Top tier private coverage for health, vision and dental care
  - A new MacBook and tools you need to do your best work
  - Enhanced parental leave with up to 16 weeks for primary and
    4 weeks for secondary
  - Learning & development budget

  Why Join Humaans Today?

  HR tech is having its AI moment and we’re positioned to own
  it. Humaans started as a next-gen HRIS taking on large
  incumbents in a massive market. We’ve since evolved into
  something even bigger: an AI platform that sits across
  workforce data and automates the operational layer of HR
  entirely; the natural progression of what we’ve been
  building toward.

  The product is highly differentiated. It’s built around a
  structured workforce data model that makes AI reliable in an
  HR context, something no one else has gotten right.
  Customers notice the difference immediately.

  We’re backed by Y Combinator, Lachy Groom, Moonfire,
  Frontline Ventures, and operators who’ve built some of the
  most consequential software companies of the last decade:
  the founders of Slack, Figma, and Shopify, and Asana’s
  former CRO and Head of OpenAI International.

  We’re a small team with an unapologetically high bar. It
  shows up in the product, in how we communicate, and in the
  standards we hold each other to.

  Our Commitment to Diversity

  At Humaans we’re looking for genuinely good people that are
  transparent and emphatic. We’re committed to providing equal
  opportunities, a diverse and inclusive work environment, and
  ensuring a fair interview process for everyone. You’re
  welcome to apply no matter your gender, ethnicity, sexual
  orientation, religion, civil or family status, age,
  disability, or race.

  Privacy notice

  We care about your privacy. When you apply for a role at
  Humaans, we’ll collect and process your personal data as
  part of our recruitment process. This includes things like
  your CV, contact details, and any other information you
  choose to share. We may also contact you about future
  opportunities. You can ask us to delete your data at any
  time. For more details, see our Privacy Policy.
