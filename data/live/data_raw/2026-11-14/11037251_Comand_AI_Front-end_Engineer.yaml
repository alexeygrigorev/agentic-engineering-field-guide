description: |
  Who we are

  Comand AI is building a global technology leader focused on
  defense & security. The company was co-founded in 2023 by
  Loïc Mougeolle, Marie Inuzuka and Quentin Le Pape, drawing
  from their unique experience at defense industry leaders and
  world-class tech companies.

  The world of defense & security are being entirely renewed
  by AI and robotisation: new classes of threats, new levels
  of autonomy and speed demands radically new solutions to
  protect our societies. Comand AI is at the forefront of the
  rebuilding of these verticals to serve our countries
  resilience.

  Comand AI core product is a next generation command and
  control software platform, which allows militaries to
  operate at machine speed in a communication and GNSS denied
  context. A few facts to anchor you:

  - €45M raised from seed to Series A, Blossom Capital leading
    the series A and Saab as a strategic investor
  - Software platform combat proven and deployed in Ukraine
  - A lean team of operators with backgrounds from Palantir,
    OpenAI and world-class tech experience, alongside unique
    expertise from the defense sector
  - Live business with governments and defense industry leaders
    across Europe
  - Paris (HQ), London, Munich and Kyiv subsidiaries

  The Role

  We are fully indexed on the success of every user, the
  interfaces you ship support live operations.

  You'd join the product development team as a front-end
  specialist, working closely with product design and
  engineering. You take an operational problem, explore it,
  come back with proposals, and iterate. Delivering a clear,
  fast and dependable user experience is critical to the
  person using it.

  What this looks like in practice:

  - Own front-end delivery on Prevail, our operational planning
    platform, from interaction design through production
  - Build interfaces for real geospatial problems: interactive
    maps, multiple data layers, large datasets, and time-
    sensitive workflows well beyond a typical CRUD application
  - Work with product and design early, turning operational
    needs into clear flows and production-ready experiences
  - Raise the front-end quality bar across the team by reviewing
    and improving work from engineers with different
    specialities, including AI-assisted code
  - Make thoughtful trade-offs between speed and durability,
    especially when a high-stakes demo or deployment creates a
    short deadline
  - Help create reusable patterns that make the product more
    coherent as the team and surface area grow

  Who We're Looking For

  We filter hardest on mission drive, low ego, attention to
  detail, and resilience under pressure. We want someone who
  cares about front-end engineering as a craft and can still
  move quickly when the problem is ambiguous.

  Must-have:

  - Strong production experience with React and TypeScript, with
    front-end engineering as a core part of your craft
  - A track record of owning complex interfaces from problem
    definition through release and iteration
  - Strong product and design judgement: you notice weak
    hierarchy, inconsistent interactions, and confusing states
    before a specification points them out
  - Pragmatism and low ego: you can improve rough work from
    other engineers without turning every implementation
    choice into a philosophical debate
  - Comfort with ambiguity and changing priorities, while
    keeping the quality of what ships high
  - EU or UK citizenship (contractual requirement tied to our
    defence contracts)

  Nice to have:

  - Experience with mapping, cartographic, GIS, or other
    geospatial applications
  - Front-end performance work involving large or real-time
    datasets
  - Experience building offline-capable or resource-constrained
    web applications
  - Experience creating or scaling a design system
  - Prior work in defence, government, or dual-use technology

  What's In It For You

  - A top 0.1% European compensation package, including base
    salary and equity
  - Paris or London based

  The Process

  - Talent screening: 30 min, online. We cover your background,
    motivations, and what you want to own next.
  - Front-end interview: 60 min, online. We assess React and
    TypeScript fundamentals, product judgement, and how you
    reason through an unfamiliar interface problem.
  - Onsite in Paris: half day. You see the product, present a
    project you are proud of, and work through a front-end
    design and re-engineering exercise based on a realistic
    product problem.
  - Roundtable: hiring committee reviews the full set of
    evidence and makes the final decision.
