description: |
  EXCLUSIVE NETWORKS | Introduction

  Exclusive Networks is the global cybersecurity go-to-market
  specialist that provides partners and end-customers with a
  wide range of services and product portfolios. With offices
  in over 45 countries and the ability to serve customers in
  over 170 countries, we combine deep local expertise with the
  scale and delivery of a single global organization.

  Our best-in-class vendor portfolio is carefully curated with
  all leading industry players. Our services range from
  managed security to specialist technical accreditation and
  training and capitalize on rapidly evolving technologies and
  changing business models. For more information visit
  www.exclusive-networks.com.

  At Exclusive Networks, we are passionate about making a
  difference. That means delivering the best to our ecosystem,
  shaping a prosperous and trusted digital world, and helping
  our people to realize their full potential.

  DUTIES AND RESPONSIBILITIES | About the role

  We’re looking for a talented Software Engineer to join our
  growing team on a 6 month fixed term contract with the
  potential to be extended. To help us build modern, data-
  driven applications that solve real business challenges.

  This is a hands-on role where you’ll work across the full
  technology stack, developing scalable backend services in
  Python and creating modern, intuitive web applications using
  Next.js and React.

  You’ll work closely with data scientists, engineers and
  business stakeholders, turning ideas and requirements into
  high-quality, production-ready solutions.

  We’re looking for someone who enjoys taking ownership.
  You’ll have the freedom to take projects from concept and
  technical design through to development, deployment and
  ongoing improvement.

  If you’re a proactive developer who likes solving problems,
  making technical decisions and seeing the impact of what you
  build, we’d love to hear from you.

  As the Software Engineer, you will:

  - Building and maintaining full-stack applications using
    Python, Next.js and React
  - Developing scalable backend APIs, services and integrations
  - Creating responsive, intuitive and high-quality user
    experiences
  - Integrating applications with databases, cloud platforms and
    third-party APIs
  - Turning business requirements into effective technical
    solutions
  - Taking ownership of projects and features from initial
    design through to deployment and support
  - Designing database structures and data models
  - Debugging and resolving issues across the full application
    stack
  - Using GitHub for source control, pull requests and
    collaborative development
  - Contributing to code reviews, development standards and
    engineering best practice
  - Improving tooling, development processes and application
    architecture
  - Creating clear technical documentation when needed

  QUALIFICATIONS AND EXPERIENCE | About you

  The ideal Software Engineer:

  - Ideally, you'll have 3+ years of commercial software
    development experience, with strong hands-on skills across
    both backend and frontend development.You'll bring:
  - Strong commercial experience with Python
  - Experience with React and Next.js
  - Good knowledge of JavaScript and/or TypeScript
  - Experience designing and consuming RESTful APIs
  - Experience with relational databases such as PostgreSQL,
    MySQL or SQL Server
  - Strong HTML and CSS skills with an understanding of
    responsive design
  - Experience working with Git and GitHub
  - Strong problem-solving skills and attention to detail
  - The ability to take a business requirement and independently
    turn it into a working technical solution
  - Great communication skills and confidence working as part of
    a remote team

  Desirable Experience

  - FastAPI, Django or Flask
  - Microsoft Azure or AWS
  - Docker and containerised deployments
  - CI/CD pipelines and automated deployment
  - Application security, authentication and performance
    optimisation
  - Analytics, reporting or data engineering solutions
  - Automated testing and quality assurance practices
  - Artificial Intelligence and Machine Learning
  - Integrating LLMs, AI services or AI APIs into applications

