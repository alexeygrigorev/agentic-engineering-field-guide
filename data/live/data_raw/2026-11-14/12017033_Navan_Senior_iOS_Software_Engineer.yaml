title: Senior iOS Software Engineer
company: Navan
location: London, GBR
work_type: FULL_TIME
company_size: 5,000 Employees
description: |
  We’re building the next generation of travel and expense
  (T&E) technology using AI and large language models. Our
  mobile platform blends cutting-edge AI with strong product
  and UX so travelers get an intelligent companion, not just
  another booking app. The app should understand needs,
  anticipate requests, and deliver personalized help through
  conversational UI and rich, immersive interactions. You’ll
  work at the intersection of AI and mobile, helping define
  how travelers interact with this kind of product on iOS.

  What You'll Do:

  - Design and ship innovative UX patterns for conversational
    interfaces and AI-driven experiences on iOS
  - Architect and build Swift-first, production grade features
    using async/await, structured concurrency and modern iOS
    APIs
  - Lead implementation of context-aware experiences using
    behavior, preferences, and app state with an emphasis on
    performance and privacy
  - Use metrics, experimentation, and validation (analytics, A/B
    tests, logging) to iterate on features and improve quality
    over time
  - Turn complex AI/ML capabilities into simple, intuitive
    mobile interactions
  - Use AI tools (e.g., Claude Code / LLM‑based coding
    assistants) to accelerate development while maintaining a
    high‑quality, well‑tested codebase
  - Collaborate across product, design, and backend in a fast-
    moving environment

  What We're Looking For:

  - 5+ years of professional development experience with strong
    Swift skills, building high quality iOS apps
  - Deep understanding of Swift and the iOS SDK, including:
  - Strong grasp of iOS architecture (e.g., MVVM, Clean
    Architecture, modularization) suitable for AI‑powered,
    stateful, and real‑time features
  - Solid understanding of JSON, REST, WebSockets, streaming
    APIs and robust networking layers (error handling,
    retries, offline support)
  - Experience with offline storage, background processing,
    threading and push notifications
  - Curiosity about new interaction models (chat, agents,
    multimodal UI, etc.)
  - Experience using AI development tools (e.g., Claude Code,
    GitHub Copilot, etc.) as part of your workflow, with good
    judgment about code quality and security
  - Familiarity with LLM‑driven features (prompt design,
    integrating LLM APIs, handling latency, fallbacks,
    guardrails) and/or conversational UX
  - Track record building consumer‑facing apps; ideally you’ve
    shipped to the App Store and iterated from user feedback
    and metrics
  - BS in Computer Science or related technical field

  Navan uses AI-assisted Automated Employment Decision Tool
  (Metaview) to assist with evaluating resumes against job
  qualifications for this role. All final decisions are made
  by human recruiters and hiring managers.

  Human oversight: Metaview does not automatically reject
