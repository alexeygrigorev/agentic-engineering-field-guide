description: |
  Acuity is seeking a Senior Software Engineer to lead the
  development and modernization of Acuity’s frontend
  technology stack. In this senior contributor role, you will
  build and maintain scalable, reusable UI components that
  deliver consistent and accessible user experiences across
  products, while also owning the CI/CD pipelines that enable
  efficient building, testing, and deployment of frontend
  changes at scale. You will drive efforts to research,
  evaluate, and adopt new technologies, patterns, and
  efficiencies, partnering closely with design, product, and
  engineering teams to ensure the design system is robust,
  scalable, well-documented (Storybook or equivalent), and
  easy to adopt, all while enhancing developer workflows,
  performance, and reliability across the frontend ecosystem.

  ESSENTIAL RESPONSIBILITIES:

  - Collaborate with business analysts and stakeholders to
    understand user needs and propose effective software
    solutions that consider the larger architectural impact.
  - Demonstrate professionalism and integrity to serve as a role
    model for other software engineers, setting a high
    standard that fosters a culture of excellence and strong
    performance within the team.
  - Coordinate and drive the planning and scoping of project
    work by gathering and providing input on effort
    estimation, development timelines, and deliverables.
  - Enhance and maintain software applications by resolving
    bugs, rolling out new features, and optimizing
    performance.
  - Write clean, scalable, and maintainable code using modern
    frameworks and languages appropriate to the project.
  - Demonstrate an expert understanding of your team’s data
    ecosystem and proactively leverage this knowledge to
    enhance application functionality and inform design
    decisions.
  - Perform testing and debugging to ensure code quality,
    stability, and performance across environments.
  - Produce and maintain thorough documentation – from technical
    specifications and system diagrams to end-user guides.
  - Recognize and correct inefficiencies and errors in the
    specifications, code, and implementation of software
    solutions.
  - Mentor other software engineers on software development
    concepts, practices, and procedures. Taking into account
    their skills and working styles to provide constructive
    feedback to help them grow.
  - Perform code reviews and make recommendations for
    improvement.
  - Direct and manage projects from initiation through delivery
    by analyzing requirements, planning workflows, assigning
    tasks, estimating timelines, coordinating efforts, and
    executing development, testing, and deployment to meet or
    exceed schedule expectations.
  - Identify and develop solutions to highly complex software
    engineering tasks, problems, and projects.
  - Understands the architecture of applications you are
    developing within and can make appropriate development
    changes that adheres to it.
  - Stay up to date on industry best practices and technologies.
  - Participate in the nightly call list for problem resolution.
  - Participate in regular and predictable attendance and
    complete mandatory training programs as determined by
    Acuity.
  - Perform other duties as assigned.

  EDUCATION:

  Bachelor’s degree or equivalent of education and experience
  in software engineering, computer science or related field.

  EXPERIENCE:

  A software engineer with 5-7 years of experience, preferably
  in the insurance industry, will generally demonstrate the
  skills set forth in this job description.

  OTHER QUALIFICATIONS:

  - Expertise in a range of tools and technologies, including:
    - Languages: TypeScript, HTML, CSS
  - Modern Web Frameworks (Vue, React) and related tooling
  - Experience with version control (git), build tools (vite)
    and CI/CD processes/pipelines (gitlab)
  - Automation technologies such as Playwright, Jest, Vitest,
    tracing and observability (Core Web Vitals / RUM) to
    ensure application and code quality
  - Understanding of configuring ESLint, Prettier, TypeScript,
    and other TypeScript infrastructure
  - Ability to analyze user requirements, develop technical
    specifications, estimate time and resources, and implement
    solutions.
  - Excellent analytical thinker with the ability to break down
    highly complex problems to identify and recommend
    practical solutions.
  - Excellent communicator and team player; partners cross-
    functionally and drives adoption of platform standards
    through internal consulting and enablement.
  - Excellence in creating and updating documentation, test
    plans, and disaster recovery procedures.
  - Ability to stay current on changes in the insurance and
    modern web development
  - Passion for delivering high-quality, scalable and reliable
    results.
  - A strong ability to use AI tools to improve development
    efficiency and output
  - Experience building and maintaining modern web applications
    & design systems
  - Proficiency working with application deployment workflows
  - Awareness of WCAG 2.1 guidelines and best practices, and
    challenges around creating accessible websites and
    components

  *Acuity does not sponsor applicants for U.S. work
  authorization.*

  This job is classified as exempt.

  The salary range for this position is $110,000-$140,000
  annually. This salary range is an estimate, and the actual
  salary will vary based on applicant’s education, experience,
  knowledge, skills, and abilities.

  For this role, Acuity offers a comprehensive benefits
  package, including a generous 401(k) contribution, medical,
  dental, vision, life and disability insurance, paid time
  off, an Employee Assistance Program, and more. A full
  description of benefits and eligibility will be provided to
  candidates during the hiring process.

  We are an Equal Employment Opportunity employer. Applicants
  and employees are considered for positions and are evaluated
  without regard to mental or physical disability, race,
  color, religion, gender, national origin, age, genetic
  information, military or veteran status, sexual orientation,
  marital status or any other protected Federal,
  State/Province or Local status unrelated to the performance
  of the work involved.

  Acuity will include at least one in-person interview during
  the hiring process for all positions.

  If you have a disability and require reasonable
  accommodations to apply or during the interview process,
  including for in-person interviews, please contact our
  Talent Acquisition team at careers@acuity.com. Acuity is
  dedicated to offering reasonable accommodations during our
  recruitment process for qualified individuals.

