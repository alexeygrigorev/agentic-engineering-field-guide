description: |
  About DeepScribe

  DeepScribe is building the future of healthcare technology.
  Our vision goes beyond automating medical notes - we are
  building AI agents for providers, streamlining diverse
  clinical workflows such as clinical trial matching, billing,
  and more. By embedding AI deeply into healthcare operations,
  we empower clinicians to deliver exceptional care.

  We’ve raised over $60 million in total funding from top-tier
  investors, including Index Ventures and prominent angels
  such as Alexandr Wang (CEO of Scale AI) and Dylan Field (CEO
  of Figma). Our solutions are trusted by some of the largest
  healthcare organizations in the country, including The US
  Oncology Network (the nation’s largest oncology network) and
  Ochsner Health (the largest healthcare system on the Gulf
  Coast).

  About the role

  We’re looking for an exceptional Product Engineer who would
  thrive in a fast-paced, rapidly scaling startup environment.
  You will build the backbone of AI-powered workflows that
  saves doctors hours of documentation time, enabling them to
  focus on patient care. You’ll write code across the stack to
  get the job done.

  What you’ll do

  - Contribute to the design and implementation of our real-time
    LLM-powered platform, delivering core features that will
    shape the future of our product
  - Build and enhance key pieces of the user journey such as
    onboarding, note customization, and in-the-moment insights
  - Collaborate across functions (product, design, clinical
    subject matter experts, sales/go-to-market, etc) to ensure
    we’re building and launching best-in-class products
  - Learn and grow alongside experienced engineers while
    implementing best practices for building robust, scalable
    code for AI-first applications

  About you

  - You enjoy solving problems and writing code using languages
    like Python and/or Typescript/React
  - You’re comfortable working across the stack and are eager to
    learn whatever you need to ship the right product
  - You love working directly with end-users and are excited
    about working with doctors first-hand
  - You move really, really fast while keeping the quality bar
    high
  - You are curious and are excited by the challenge of applying
    LLMs to novel problems in healthcare
  - You care deeply about your teammates and contribute to a
    collaborative, team-oriented culture

  Nice to have

  - Experience in healthcare, integrating with EHR systems, or
    familiarity with clinical documentation
  - Experience working with sensitive data and familiarity with
    SOC-2/HIPAA
  - Experience with building and deploying mobile applications
  - Experience managing and deploying code in AWS architecture

  This is a remote position, although Bay Area residents are
  encouraged to work from our SF office.

  Perks and benefits

  $100,000 to $185,000 annual salary. Actual compensation will
  be determined based on factors including but not limited to
  experience, education, skill level, location, and internal
  equity, and may vary from the posted range.

  Meaningful equity stake in the company

  Flexible PTO

  Work from home stipend

  Medical, Dental, Vision, 401K and other benefits are also
  offered

  About the Team

  At DeepScribe, we value trust, teamwork, and transparency,
  and we’re dedicated to promoting diversity and equity in the
  workforce through inclusive hiring practices. Candidates
  with backgrounds that are underrepresented in the technology
  industry are encouraged to apply.

  In compliance with federal law, all persons hired will be
  required to verify identity and eligibility to work in the
  United States and to complete the required eligibility
  verification form upon hire.

  We’re excited to connect with people who feel inspired by
  our mission to transform medical documentation with AI. As
  part of your application, we ask you to briefly tell us why
  you want to work at DeepScribe. Applications without a
  thoughtful response may not be considered.

  How to use AI during our hiring process

  - When applying: create the first draft of your resume
    yourself, but it’s OK to use AI to help you polish it
  - While preparing: use AI to research DeepScribe, practice
    your answers, or prepare questions for us
  - During live interviews: no AI assistance of any kind unless
    we indicate otherwise. We want to see how you think,
    approach problems, and work through challenges in real
    time.
