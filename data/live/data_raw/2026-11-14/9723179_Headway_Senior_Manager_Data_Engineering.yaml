description: |
  1 in 4 people in the US have a treatable mental health
  condition, but most providers don't accept insurance, making
  therapy too expensive for most people. Headway’s mission is
  to fix this by building a new mental healthcare system
  everyone can access. We started by solving the biggest
  barrier to care: insurance. The admin work - credentialing,
  claims, payment reconciliation - is a nightmare. We've
  automated that.

  But we're going further. Over 90,000 providers across all 50
  states run their practice on our software, serving over 2.6
  million patients. We are building the best tools for
  therapists to run their entire practice, reimagining the
  experience of finding a therapist, and investing in the
  platform foundations to enable this at scale, and building
  much of it with AI. We aren't just a billing layer; we are
  becoming the platform where care actually happens.

  We're a Series D company with $325M+ in funding (a16z,
  Accel, Spark Capital, etc.), looking for exceptional people
  to help us achieve this mission. We want your time here to
  be the most meaningful experience of your career. Join us,
  and help change mental healthcare for the better.

  About the Role

  As Senior Manager, Data Engineering, you will define and
  lead the technical strategy for Headway's data
  infrastructure. The team's mission is to build and maintain
  the reliable, scalable data systems that power analytics,
  machine learning, and operational decision-making across the
  company.

  You will report into Headway's Data organization, a mission-
  critical pillar that ensures our data assets are accurate,
  timely, and accessible. Trustworthy data infrastructure is
  foundational to Headway's growth — enabling every team to
  build, measure, and improve with confidence.

  You will partner closely with Data Science, Analytics,
  Product, and Engineering to deeply understand and anticipate
  the data needs of a fast-growing healthcare company. You
  will define the right architectural investments, proactively
  surface reliability and scalability risks, and use
  engineering rigor to guide decisions from early design
  through launch and iteration.

  You will:

  - Lead and grow a high-performing team of Data Engineers,
    fostering a culture of technical excellence, ownership,
    and craftsmanship.
  - Develop quarterly roadmaps with cross-functional partners on
    Data Science, Operations and Engineering, align Data
    Engineering resources, and oversee execution of timely,
    high-quality work.
  - Own the architecture and reliability of Headway's data
    platform — including our data warehouse, ingestion
    pipelines, transformation layer (dbt), and orchestration
    systems.
  - Identify and prioritize platform projects that enable better
    self-service and standardization across teams and pods,
    reducing bottlenecks and empowering stakeholders to get
    the data they need on their own.
  - Define and champion engineering standards: data modeling
    conventions, pipeline observability, SLA frameworks, and
    data quality monitoring.
  - Partner cross-functionally to design and build the data
    infrastructure that powers analytics, experimentation, ML
    models, and operational tooling at scale.
  - Lead the team in finding practical ways to leverage AI in
    data engineering workflows, with a clear view of what’s
    feasible today and what isn’t yet.
  - Stay close to the work by engaging directly with strategic
    technical challenges, surfacing gaps in our platform
    capabilities before they become bottlenecks.
  - Translate complex data decisions into clear, actionable
    recommendations for executive stakeholders.

  You will love this role if:

  - You have 8+ years of experience in data engineering or
    related roles
  - You have 3+ years of experience managing and developing
    teams
  - You have experience building and scaling data platforms in a
    high-growth, cloud-native environment (highly preferred)
  - You have proven success partnering cross-functionally with
    Data Science, Analytics, and Product Engineering
  - You have deep expertise in data warehouse design, pipeline
    architecture, and transformation frameworks — with the
    ability to coach others through complex technical trade-
    offs
  - You’re forward-thinking about AI, with hands-on experience
    using it to improve team workflows and a pragmatic sense
    of where it adds real value

  Comprehensive benefits:

  Medical, dental, vision, HSA/FSA, 401(k) including match for
  2027!, Carrot Fertility reimbursement, and paid parental,
  medical and caregiver leave.

  We believe a team's strength is in its people, and we cannot
  achieve this mission without a team that reflects the
  diversity of this problem – across race, ethnicity, gender,
  sexuality, age, national origin, religion, family status,
  disability, military status, and experience. Headway is
  committed to the full inclusion of all qualified
  individuals. As part of this commitment, Headway will ensure
  that persons with disabilities are provided with reasonable
  accommodations. If reasonable accommodation is needed to
  participate in the job application or interview process, to
  perform essential job functions, and/or receive other
  benefits and privileges of employment, please inform the
  recruiter when they contact you to schedule your interview.

