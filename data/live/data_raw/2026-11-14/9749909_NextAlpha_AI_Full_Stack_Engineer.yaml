description: |
  About Us

  We partner with startups in San Francisco to connect them
  with the best talent from Europe and Asia. Our network
  brings together top professionals in business, design, and
  technology to help companies scale their teams quickly and
  efficiently. We focus on delivering exceptional results
  through a community of skilled experts, ensuring that
  startups can access the talent they need to grow and
  innovate.

  Required Skills

  - Frontend Development:
    - Proficient in JavaScript and TypeScript.
    - Experience with at least one modern frontend
      framework/library such as React.
    - Vue.js or Angular experience can count but React is
      preferred.
  - Backend Development:
    - Strong knowledge of Python, Go, or JavaScript/TypeScript.
    - Experience with server-side frameworks (e.g., Django, Flask
      for Python; Express for Node.js).
    - Java, C#, Rust experience count but Python, Go and
      TypeScript are preferred.
  - Database Management:
    - Experience with relational and/or NoSQL databases (e.g.,
      PostgreSQL, MongoDB).
  - Version Control:
    - Proficient in using Git for version control.
  - Cloud Services:
    - Experience with AWS services for deployment and
      infrastructure management.
  - General:
    - Solid understanding of web development principles, including
      RESTful API design, responsive design, and performance
      optimization.
    - Excellent problem-solving skills and attention to detail.
    - Strong communication and teamwork abilities.

  Technical Stack

  - Frontend: React (preferred), Vue.js, Angular
  - Backend: Python, Go, JavaScript/TypeScript, Java, C#, Rust
  - Databases: PostgreSQL, MongoDB, etc.
  - Cloud Platforms: AWS (preferred), GCP, Azure
  - Version Control: Git
  - DevOps Tools: Docker, Kubernetes, CI/CD pipelines

  Education and Experience

  - Bachelor’s Degree in Computer Science, Engineering, or a
    related field, or equivalent practical experience.
  - 3+ years of professional experience in full stack
    development.

  What We Offer

  - Competitive salary and benefits package.
  - Opportunities for professional growth and development.
  - A collaborative and inclusive work environment.
  - Flexible work arrangements.
