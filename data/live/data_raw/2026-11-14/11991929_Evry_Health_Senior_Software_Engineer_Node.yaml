description: |
  Role Summary

  The Senior Node Software Engineer is a technically senior,
  backend-focused individual contributor leading the Node sub-
  team's technical direction, architecture decisions, and code
  quality standards, while remaining deeply hands-on in the
  design, development, and delivery of Evry Health's backend
  platform. The role centers on building Node.js and
  TypeScript services, Next.js API routes, and the underlying
  data layer, bringing a system-level perspective to
  architecture that considers performance, security,
  scalability, and healthcare regulatory compliance. Engineers
  in this role partner with frontend and mobile teams on API
  contracts but do not own frontend development.

  Responsibilities

  - Backend Architecture & System Design: Leads architecture of
    the backend platform — service and API structure,
    asynchronous and real-time processing, rate limiting and
    resiliency, and relational/document data modeling —
    documenting decisions for stakeholders.
  - Senior-Level Backend Feature Development: Owns design and
    implementation of the most complex backend features using
    Node.js and TypeScript, delivering production-quality code
    that sets the team standard.
  - Node.js Services & Next.js API Development: Designs and
    implements complex Next.js API routes and Node.js backend
    services — API design and contracts,
    authentication/authorization, caching, messaging, and
    relational/document database design and access — enabling
    frontend and mobile teams to build on stable, well-
    documented interfaces.
  - Technical Leadership & Mentoring: Provides day-to-day
    technical leadership to the Node sub-team — leading code
    reviews, mentoring junior engineers, and establishing and
    enforcing Node coding standards.
  - Performance, Testing & CI/CD Ownership: Owns backend
    performance optimization, testing strategy, and CI/CD
    pipeline governance, ensuring HIPAA-compliant, secure, and
    high-availability services.

  Qualifications

  Telecommuting Requirements
