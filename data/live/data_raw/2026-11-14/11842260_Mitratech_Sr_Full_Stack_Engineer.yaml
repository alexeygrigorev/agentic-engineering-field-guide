description: |
  At Mitratech, we are a team of innovators focused on
  building world-class products that simplify operations in
  the Legal, Risk, Compliance, and HR functions. We are a
  close-knit, globally dispersed team that thrives in an
  ecosystem that supports individual excellence and takes
  pride in its diverse and inclusive work culture centered
  around great people practices, learning opportunities, and
  having fun! Our culture is the ideal blend of
  entrepreneurial spirit and enterprise investment, enabling
  the chance to move at a rapid pace with some of the most
  complex, leading-edge technologies available.

  For over 35 years, the experts at Mitratech have been
  focused on solving the complex needs. Today, we serve 20,000
  client companies of all sizes globally, representing 30% of
  the Fortune 500 and over 500,000 users in over 160
  countries.

  As we continue to grow, we’re always looking for
  resourceful, enthusiastic, and fresh perspectives. Join our
  global team and see what makes Mitratech a truly exceptional
  place to work!

  Job Overview

  This is more than a typical engineering position. We are
  looking for an individual who is excited by the practical
  application of AI to make the best HR software. You will be
  empowered to explore and implement background screening
  technology with a critical sense of user experience.

  Essential Duties & Responsibilities:

  - Design, develop, and maintain robust and scalable web
    services for our core B2B SaaS application.
  - Write clean, high-quality, and well-tested code, primarily
    in Go.
  - Architect and manage complex database schemas and queries
    using PostgreSQL.
  - Lead initiatives to research, prototype, and implement AI-
    powered tools to accelerate our software development
    lifecycle—from intelligent code completion and automated
    reviews to advanced CI/CD pipeline optimizations.
  - Collaborate closely with product managers, designers, and
    fellow engineers to translate complex user requirements
    into elegant, user-centric solutions.
  - Mentor other engineers, champion best practices, and
    contribute to a culture of technical excellence and
    continuous improvement.

  Requirements & Skills:

  - Deep proficiency in the full stack of b2b SaaS; Front end:
    vanilla html/css/js; Back end: Go preferred,
    Ruby/Python/PHP ok; Database: PostgreSQL
  - A product-first mindset with a demonstrated ability to think
    from the user's perspective and a keen eye for user
    experience and design.
  - Excellent problem-solving skills and the ability to
    architect solutions for complex, distributed systems.
  - Strong communication skills and a desire to work in a highly
    collaborative environment.

  We will disclose intended pay ranges in our job ads for US-
  based opportunities. This role can be performed 100% remote
  anywhere in the US. Anticipated Pay Range: $150K to 170K
  Annually USD

  Total compensation includes US employee benefits and annual
  bonus eligibility.

  Benefits we offer:

  - Health, Dental & Vision Insurance *
  - 401 (k) + Employer Match *
  - Open PTO + 11 Paid Holidays + 4 Annual Paid Global Wellness
    Days Off
  - STD, LTD & Group Life Insurance
  - Paid Parental Leave
  - Pet Insurance
  - FSA & HSA Options
  - Employee Assistance Program

  Perks we offer:

  - Remote Work
  - Career Advancement & Professional Development Opportunities
  - Employee Recognition
  - LinkedIn Learning Platform

  Mitratech is proud to be an EEOE, M/F/D/V, and we are
  committed to diversity both in practice and spirit at the
  corporate level. Mitratech participates in the Electronic
  Employment Verification Program. E-Verify is an Internet-
  based system that compares information from an employee’s
  I-9 to data from the U.S. Department of Homeland Security
  and Social Security Administration Records. To learn more,
  visit: everify.com

   We are an equal-opportunity employer that values diversity
  at all levels. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, gender, national origin, age, sexual orientation,
  gender identity, disability, or veteran status.
