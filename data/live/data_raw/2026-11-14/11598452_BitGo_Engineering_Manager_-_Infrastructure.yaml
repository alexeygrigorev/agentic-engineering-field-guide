description: |
  BitGo (NYSE: BTGO) is the digital asset infrastructure
  company delivering custody, wallets, staking, trading,
  financing, stablecoins, and settlement services from
  regulated cold storage. Since 2013, BitGo has focused on
  accelerating the transition of the financial system to a
  digital asset economy. BitGo maintains a global presence and
  multiple regulated entities, including BitGo Bank & Trust,
  National Association, the first federally chartered digital
  asset trust bank owned by a publicly traded company. Today,
  BitGo serves thousands of institutions, including many of
  the industry's top brands, financial institutions,
  exchanges, and platforms, and millions of investors
  worldwide. For more information, visit www.bitgo.com.

  This role will require being full-time onsite at our New
  York City or Toronto office to support collaborative team
  dynamics and innovative problem-solving. You will
  participate in an on-call rotation covering 8:00am–4:00pm
  ET.

  This is a player-coach role: you'll lead a small team of
  infrastructure engineers while staying hands-on in the
  engineering work itself. You'll be an extra set of hands on
  your team's projects, take on smaller initiatives yourself
  so the team can stay focused on roadmap work, and help
  build, shape, and execute our infrastructure roadmap. Expect
  to spend roughly 60% of your time on hands-on engineering
  and 40% on leading the team.

  What you'll doLead the team

  - Lead and develop a small team of talented infrastructure
    engineers through regular 1:1s, coaching, feedback, and
    career development
  - Help shape a team culture of open communication,
    craftsmanship, and ownership
  - Take direct responsibility for the quality and delivery of
    the team's work
  - Participate in hiring and growing the team
  - Protect the team's focus by triaging incoming requests and
    unplanned work, so engineers can stay on roadmap
    priorities

  Stay hands-on

  - Be an extra set of hands on your team's projects: pair on
    hard problems, unblock work, review designs and code, and
    pick up pieces of larger efforts when it helps the team
    move faster
  - Own and deliver smaller infrastructure initiatives end to
    end
  - Participate in the team's on-call rotation (8:00am–4:00pm
    ET), act as a technical leader during production
    incidents, and drive postmortems and follow-up work
  - Champion Infrastructure as Code, automation, and engineering
    best practices, leading by example

  Shape the roadmap

  - Partner with the Head of Infrastructure to build, shape, and
    execute the infrastructure roadmap
  - Translate long-term goals into concrete, shippable
    milestones, and plan, estimate, and make tradeoffs with
    your team
  - Own and be accountable for KPIs covering the reliability,
    resiliency, and uptime of critical services
  - Collaborate with engineering, security, and product teams to
    identify infrastructure requirements, risks, and
    opportunities, including cloud cost optimization
  - Facilitate thorough documentation and knowledge sharing

  What we're looking for

  We are looking for teammates who share and practice our
  values: open communication, transparency, taking ownership,
  and a high level of craftsmanship.

  Required

  - 6+ years of experience in DevOps, SRE, or infrastructure
    engineering, building and operating complex, high-stakes
    production systems
  - 2+ years leading a team of engineers, including people
    leadership responsibilities such as 1:1s, feedback, and
    performance conversations
  - A track record of balancing hands-on technical work with
    team leadership
  - Extensive experience securing, scaling, and operating
    Kubernetes in production, with associated tooling (ArgoCD,
    GitOps, Grafana) and advanced Terraform
  - Hands-on experience with a major public cloud provider. We
    operate primarily on AWS but believe skills in one cloud
    provider translate to others
  - Strong Linux systems administration skills and networking
    fundamentals (VPCs, security groups, load balancers, CNI
    plugins, network policy management)
  - Proficiency in at least one high-level programming language,
    preferably Go, with strong bash scripting
  - Operational experience with relational and NoSQL databases
  - Experience with GitHub Actions and CI/CD pipelines
  - Experience participating in and organizing on-call
    rotations, and leading incident response
  - Strong project management skills and experience
    collaborating across teams
  - Excellent written and verbal communication skills

  Preferred

  - Security operations experience, including vulnerability
    management, security monitoring, and incident response
  - Experience with compliance frameworks and audit lifecycles
    (SOC, ISO, regulators, etc.)
  - Cloud cost optimization and capacity planning experience
  - Deep observability experience (Prometheus, Alertmanager,
    Loki, ELK)
  - Experience sourcing and hiring engineering talent
  - A history of delivering internal tools or automation that
    improved developer or operator workflows
  - Blockchain/crypto infrastructure experience, such as running
    nodes and validators
  - Prior experience in financial services or regulated
    industries

  Why Join BitGo?

  Disrupting an industry takes vision, innovation, passion,
  technical chops, drive to deliver, collaboration, and
  execution. Join a team of great people who strive for
  excellence and personify our corporate values of ownership,
  craftsmanship, and open communication. We are looking for
  new colleagues who bring innovative ways of thinking and
  problem-solving, and who want risks to be part of the team
  that changes the world’s financial markets.

  - Competitive base salary, bonus, and stock options
  - 100% company-paid health insurance for employee, partner,
    and dependents
  - Up to 4% 401k company match
  - Paid parental leave, Paid vacation
  - Free commuter/parking pass
  - Free custom lunches and snacks
  - Computer equipment and workplace furniture to suit your
    needs
  - Great colleagues and an inspiring environment

  Benefits may vary based on location.

  Pay Transparency Notice:

  Depending upon your leveling and location, the compensation
  for this role averages between $220,000 and $280,000 USD
  base salary. Equity, an annual performance bonus, and the
  benefits outlined above are also part of this role’s
  package.

  Cryptocurrencies are the most disruptive change the
  financial services industry has seen in years. Join us and
  you'll be able to look back and say you were part of the
  team that transformed investing.
