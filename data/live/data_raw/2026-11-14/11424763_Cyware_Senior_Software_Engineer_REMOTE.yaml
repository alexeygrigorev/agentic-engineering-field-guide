description: |
  Job Title: Senior Software Engineer

  Location: USA (Remote or Regional Office)

  Reports To: Senior VP of Engineering

  About Cyware:

  Cyware delivers an innovative approach to cybersecurity that
  unifies threat intelligence, automation, threat response,
  and vulnerability management with data insights gleaned from
  assets, users, malware, attackers, and vulnerabilities.
  Cyware’s Cyber Fusion platform integrates SOAR and TIP
  technology, enabling collaboration across siloed security
  teams. Cyware is widely deployed by enterprises, government
  agencies, and MSSPs, and is the leading threat intelligence
  sharing platform for global ISACs and CERTs.

  Your next opportunity starts here!

  More on Cyware: (www.cyware.com)

  Built and designed by SecOps practitioners and cybersecurity
  leaders, Cyware offers multiple technologies within its
  Cyber Fusion platform, including advanced threat
  intelligence solutions (TIP) for large and small security
  teams, vendor-agnostic security automation (SOAR), and
  purpose-built security case management. As a result,
  organizations can increase speed and accuracy while reducing
  costs and analyst burnout. Cyware's Virtual Cyber Fusion
  solutions make secure collaboration, information sharing,
  and enhanced threat visibility a reality for enterprises,
  sharing communities (ISAC/ISAO), MSSPs, and government
  agencies of all sizes and needs.

  About you:

  - You are driven, inquisitive, proactive, and energetic
  - You have a growth mindset and are committed to delivering
    results
  - You thrive in a fast-paced, collaborative environment
  - You understand that building high-quality products means
    adhering to a high bar where security, auditability, and
    reliability are not afterthoughts
  - You have experience with AI-based debugging and development
    tools and practices

  Why We’re Hiring

  We are looking for a passionate back-end developer to build
  and harden Cyware's Cyber Fusion platform across both
  commercial enterprise and public sector environments. You
  will build scalable features that seamlessly operate within
  commercial SaaS and highly regulated compliance frameworks
  such as FedRAMP High and GovRAMP Moderate, deployed across
  standard cloud infrastructure and AWS GovCloud. You'll work
  closely with our Security, GRC, and DevOps teams to ensure
  every feature you ship is deployable, auditable, and
  defensible under rigorous commercial and federal compliance
  standards.

  What You’ll Do

  - Develop features from proposal to polished end result,
    accounting for both enterprise scale and high-security
    compliance constraints (GovCloud, segmented environments,
    control inheritance) from design forward.
  - Build code that passes FedRAMP/GovRAMP control requirements
    (secure coding, audit logging, RBAC, encryption in
    transit/at rest) without needing significant post-hoc
    rework.
  - Manage and review code contributed by the rest of the team,
    with an eye toward what will meet rigorous enterprise and
    regulatory security standards, and keep code easy to
    maintain and easy for others to contribute to.
  - Partner with DevOps and GRC to ensure features deploy
    cleanly through modern CI/CD pipelines (Bitbucket
    Pipelines, Helm, ArgoCD) across commercial and GovCloud
    environments, holding up under continuous monitoring.
  - Take initiative in improving the software in small or large
    ways to address pain points in your own experience as a
    developer.
  - Work with multi-disciplinary teams to maintain and support
    production and operations of Cyware Products across both
    commercial and GovCloud environments.

  Who You Are

  - U.S. Citizenship required (per 8 U.S.C. 1324b(a)(2)(C));
    ability to comply with U.S. government/enterprise security
    standards, and eligibility for security clearances.
  - Bachelor’s degree or higher, in Computer Science,
    Engineering, IT or a related discipline (or equivalent
    experience).
  - 7–10+ years of Python experience, proficient in building
    efficient REST APIs with Django/Django REST Framework; 5+
    years of practical experience in building Django
    applications is a huge plus. Go (GoLang) is a strong plus.
  - Strong software design and architecture skills with proven
    experience designing scalable microservices and applying
    core design principles (e.g., MVC), including
    understanding of OOPS and design patterns such as strategy
    and adapter to build modular and scalable solutions.
  - Solid background with Generative AI integrations, REST/gRPC
    LLM services, AI agents, and RAG pipelines (vector stores,
    embeddings, document indexing, retrieval strategies).
  - Hands-on experience in AWS and AWS GovCloud environments
    (ECS/EKS, Lambda, API Gateway, S3, RDS) and multi-tenant
    architectures.
  - Proficiency with enterprise & federal identity/auth
    standards (SAML, OAuth, PIV/CAC, FICAM, RBAC) and secure
    coding principles (OWASP, secrets management) aligned with
    FedRAMP/GovRAMP controls.
  - Practical knowledge of databases (PostgreSQL, Elasticsearch,
    ClickHouse, MongoDB), RDBMS and NoSQL use cases, caching
    (Redis, Memcached), and message brokers (RabbitMQ, Kafka,
    Redis).
  - Strong engineering practices including unit testing,
    debugging, test automation, CI/CD, source version control,
    Git/GitHub, and container technologies (Docker,
    Kubernetes).
  - Knowledge of scheduling frameworks or event-driven
    programming in Django, threading limitations of Python,
    and multi-process architecture.
  - Experience with applications that have scaled, including
    designing scalable microservices and building products
    from scratch; prior experience in search-heavy, data-
    intensive, or AI-powered products is a big plus.
  - Strong proficiency in data structures and algorithms and
    good understanding of server-side templating languages.
  - Knowledge of user authentication and authorization between
    multiple systems, servers, and environments, including
    RBAC controls and multi-tenant architectures.
  - Good hands-on experience working in scalable AWS
    environments and understanding of associated cloud
    services and application architectures.
  - Experience with Elasticsearch for search, log analytics, or
    as part of an indexing layer is a strong plus.
  - Knowledge of different database technologies and associated
    use cases, caching mechanisms using Redis/Memcache, and
    message brokers like RabbitMQ, Kafka, and Redis.
  - Self-driven approach to enjoy technical challenges and
    eagerness to explore new technologies (AI, LLMs, RAG, Go,
    etc.), with experience developing products from scratch in
    regulated/FedRAMP environments.

  We're a lean team, so your impact will be felt immediately.
  If this all sounds like a good fit for you, why not join us?

  You’ll love working at Cyware because:

  - We foster an exciting and challenging start-up culture.
  - We’re not just employees. We’re people. We offer a
    comprehensive benefits package including time off, paid
    holidays, retirement plans, insurance coverage and much
    more.
  - We’ll invest in your career. Our company is growing quickly
    and we will give you the opportunity to do the same. You
    will have access to a number of professional development
    opportunities so that you can keep up with the company’s
    evolving needs.
  - We offer competitive compensation packages. We deeply value
    the talent our team brings to the table and believe that
    fair and equitable total compensation packages are part of
    our commitment to everyone who works here.
  - We value diversity of people, culture, and ideas.

  How to Apply

  Apply right here. You've found the application!



