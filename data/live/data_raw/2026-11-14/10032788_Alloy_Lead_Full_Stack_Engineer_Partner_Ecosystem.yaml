description: |
  Alloy is where you belong!

  Alloy is the AI-powered identity and fraud prevention
  platform that accelerates onboarding, stops fraud, and
  scales compliance across the customer lifecycle so financial
  organizations can grow without limits. More than 900 of the
  world's leading financial institutions and fintechs trust
  Alloy for smarter risk management that drives growth.
  Through our values: Be Bold, Go Fast, Collaborate, and
  Celebrate Our Differences, we are creating a workplace where
  you can grow, thrive, and belong. See how we’ve been
  continuously recognized and named one of Inc. Magazine’s
  Best Workplaces, Forbes America’s Best Startup Employers,
  Best Fintech to Work for by American Banker, year after
  year. Check out our investors and read more about us here.

  About the team

  Alloy is actively hiring experienced full stack engineers to
  join the Partner Ecosystem Platform Engineering team to
  design and build a future data provider integration
  platform. Alloy partners with hundreds of data vendors that
  perform work across identity verification, fraud mitigation
  and many others. To scale this out Alloy is building the
  next generation integration platform, which will make it
  easy to build, operate and maintain data integrations. Alloy
  is hiring experienced engineers who can lead this effort,
  creating a new platform that enables the new stage of
  Alloy’s growth.

  Alloy operates in a hybrid-work environment. We look to
  foster collaboration and community by having our local
  employees onsite three days a week.

  What you'll be doing

  Reporting to the Head of Engineering, you will:

  - Design and build a scalable platform that simplifies the
    creation/operation of hundreds of data partner
    integrations.
  - Collaborate with engineers, designers, and product managers
    to translate our product and technical vision into a
    concrete roadmap, guiding the team towards success.
  - Partner with third-party vendors & our clients to gather
    requirements and co-create solutions, ensuring seamless
    integration of their data within the core product and the
    evolving marketplace experience.
  - Architect, develop, test, and deploy significant customer-
    facing features and projects using cutting-edge tools and
    technologies. Our tech stack includes TypeScript,
    JavaScript (ES6/React), Python (Django), Node.js,
    PostgreSQL, Elasticsearch, and AWS.
  - Craft high-quality, thoroughly-tested code that meets the
    unique requirements of our clients, ensuring robustness
    and reliability.
  - Provide technical mentorship and guidance to fellow
    engineers, fostering a culture of learning and growth
    within our rapidly expanding team.

  In summary, you will play a pivotal role in building out the
  next generation of partner ecosystem platform at Alloy,
  driving the development of integrations with our data
  partner APIs and SDKs, leveraging your technical expertise
  to build solutions that have a significant market impact
  while fostering a collaborative and high-performance team
  environment.

  Who we're looking for

  - 10+ years of hands-on experience in developing production-
    ready software, demonstrating a proven track record of
    delivering robust and scalable solutions.
  - Experience maintaining and working with data integrations /
    external API sources
  - Expertise in steering technical projects (fullstack or
    backend), adept at prioritizing tasks, defining
    requirements, and facilitating productive discussions
    within the team to drive informed technical decisions.
  - Collaborative mindset, experience leading engineering teams
    in collective pursuits, fostering an environment of
    cooperation and shared success.
  - Remarkable ability to adapt swiftly to the evolving needs of
    our growing organization and dynamic product landscape,
    ensuring alignment with strategic objectives.
  - Proficiency in client-side technologies such as TypeScript,
    JavaScript (ES6/React), HTML/CSS, as well as server-side
    proficiency in Python (Django), enabling seamless
    development across the entire stack.
  - Practical experience in managing relational databases, with
    a strong command over PostgreSQL and its intricacies,
    ensuring efficient data management and retrieval.

  Nice to have:

  - Experience working in developer productivity domain and/or
    SDKs
  - Experience working in Fintech or the financial services
    industry.

  We're a lean team, so your impact will be felt immediately,
  and opportunities will grow as the company scales up. If
  this all sounds like a good fit for you, why not join us?

  Alloy is committed to fair and equitable compensation
  practices. In addition to a competitive base salary, this
  position is also eligible for equity awards in the form of
  stock options (ISOs) as well as a competitive total benefits
  package. Your recruiter will be happy to walk you through
  the details and what compensation could look like for you
  specifically!

  This position has a salary range of $198,000 to $250,000.
  Offers are determined by experience, skills, and interview
  performance as indicators of expected contribution, with
  movement through the range tied to demonstrated impact in
  the role.

  Benefits and Perks

  We invest in your health, your financial future, and your
  growth. Here's what you can expect:

  - Medical, dental, and vision coverage from the first of the
    month after you join, including $0 employee-only premium
    options, plus FSA options and an Alloy-funded HSA with our
    high-deductible plan
  - Healia: if your spouse or partner has health insurance
    through their employer, Alloy may cover up to 100% of your
    family's costs on their plan
  - Alloy-paid One Medical membership, Spring Health therapy and
    coaching, Superpower advanced lab testing, and ClassPass
    credits
  - Stock options for every full-time employee
  - 401(k) with a 100% match up to 4% of pay, vested
    immediately, plus a mega backdoor Roth option
  - Free, unlimited 1:1 financial planning through Addition
    Wealth
  - Unlimited PTO plus company holidays
  - 16 weeks of fully paid parental leave for eligible birthing,
    non-birthing, adoptive, and foster parents
  - Annual learning and development stipend, plus a home office
    stipend to set up your workspace
  - Hybrid work environment: most team members work from our HQ
    in Union Square, Manhattan, Tuesday through Thursday, with
    in-office expectations that vary by role. Catered lunches
    from a variety of local restaurants and frequent employee-
    organized cultural events bring energy to the office. On
    Mondays and Fridays, many employees work remotely, while
    some take advantage of the quieter office.

  How to apply

  Apply right here! You've found the application!

  Alloy is proud to be an equal-opportunity workplace and
  employer. We’re committed to equal opportunity regardless of
  race, color, ancestry, religion, gender, gender identity,
  parental or pregnancy status, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  or veteran status. We are committed to an inclusive
  interview experience and provide reasonable accommodations
  to applicants with visible and invisible disabilities. We
  encourage applicants to share needed accommodations with
  their recruiter.

  All Alloy jobs are listed on our careers page. Any
  communication during the recruitment process, including
  interview requests or job offers, will come directly from a
  recruiting team member with an alloy.com email address. We
  do not use outside applications or automated text messaging
  in our recruiting process. We will not ask for any sensitive
  financial or identification information during the
  recruiting process. If you’re ever unsure, please contact us
  directly via our website before sharing personal
  information.
