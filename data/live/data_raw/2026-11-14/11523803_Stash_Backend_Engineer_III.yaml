description: |
  Want to help everyday Americans invest and build wealth?
  Financial inequality is increasing, and too many people are
  getting left behind. At Stash, we’re passionate about
  democratizing wealth creation through education, advice, and
  products that help customers achieve greater financial
  freedom. We also believe in working smarter—leveraging AI
  and emerging technologies to move faster, operate more
  efficiently, and focus our time on solving meaningful
  problems for our customers.

  As a key member of the Accounts Team, you will play a
  pivotal role in managing and enhancing our Core Banking
  System. Our system is built using Go, with a robust
  asynchronous architecture, and CockroachDB as the primary
  database. We are looking for engineers who are eager to
  tackle challenges in fintech, build scalable backend
  services, and contribute to the next generation of banking
  infrastructure.

  This position operates on a hybrid schedule, requiring you
  to be on-site in our New York office at least three days per
  week to work with stakeholders and foster team
  collaboration.

  What you'll do:

  - Design, develop, and maintain backend services for our Core
    Banking System, ensuring performance, reliability, and
    scalability.
  - Architect and implement robust asynchronous workflows to
    process banking transactions efficiently.
  - Optimize and scale our system as we continue to grow,
    ensuring high availability and security.
  - Act as an "Agent Conductor" to architect, design, and
    rapidly implement services by leveraging AI coding
    assistants.
  - Collaborate with cross-functional teams, including
    operations and infrastructure teams, to deliver seamless
    experiences.
  - Continuously deploy and monitor services in a cloud-based
    environment.
  - Debug, test, and document code to ensure high-quality
    software development.

  What we're looking for:

  - 3 - 5 years of professional experience in backend software
    development.
  - Strong proficiency in Go or Rails (or deep experience in
    another backend language with a willingness to learn Go).
  - Experience working with event-driven, asynchronous
    architectures.
  - Data-driven decision maker, willing to take risks, fail
    fast, and iterate at the speed of AI generation.
  - Proficiency in working with relational and distributed
    databases, preferably CockroachDB, PostgreSQL, or similar.
  - Hands-on experience building highly scalable, fault-tolerant
    backend services.
  - A strong understanding of testing best practices, debugging,
    and profiling.
  - Familiarity with cloud platforms (AWS).
  - Excellent problem-solving skills and a mindset for
    continuous improvement.

  Gold Stars:

  - Knowledge of multi-region architectures.
  - Familiarity with CI/CD pipelines, Terraform, and Datadog.
  - Understanding of banking or fintech-related systems.

  #LI-Hybrid

