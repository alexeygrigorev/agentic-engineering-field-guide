description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  - Design, develop and maintain high-quality consumer-facing
    web applications using React, Typescript and JavaScript.
  - Partner with Product, Design, Architecture, Quality
    Engineering, and Platform teams to deliver optimized
    consumer journeys.
  - Define strategies for rendering, code splitting, lazy
    loading, asset optimization, caching, and bundle
    management.
  - Lead troubleshooting and root cause analysis for complex
    performance, reliability, and production issues.
  - Ensure digital experiences meet WCAG accessibility standards
    and inclusive design principles.
  - Partner with UX and Design teams to develop reusable
    components and evolve enterprise design systems.
  - Support feature flagging, experimentation, A/B testing, and
    data-driven optimization of consumer journeys.
  - Build scalable and reusable application architectures that
    support long-term maintainability and growth.
  - Design and implement robust state management and API
    integration strategies.
  - Collaborate with Product, Design, QA, and Engineering teams
    to deliver consumer-focused digital experiences.
  - Build secure, performant, and reliable web applications
    following industry best practices.
  - Lead development of reusable components, shared libraries,
    and common engineering frameworks.
  - Drive code quality through code reviews, engineering
    standards, and technical mentorship.
  - Optimize application performance, responsiveness,
    accessibility, and device compatibility.
  - Support CI/CD pipelines, release management processes, and
    deployment automation.
  - Contribute to technical documentation, architecture
    decisions, and engineering best practices.
  - Participate actively in Agile ceremonies including planning,
    estimation, refinement, and retrospectives.
  - Drive continuous improvement initiatives focused on
    engineering productivity, quality, and operational
    excellence.

  YOUR TALENT

  - 7+ years of software engineering experience with significant
    experience in web application development.
  - Strong hands-on expertise in ReactJS, NextJS, TypeScript,
    Redux and modern JavaScript development.
  - Deep understanding of web fundamentals, browser variations
    and capabilities.
  - Strong knowledge of web architecture patterns, modular
    architecture, and scalable application design.
  - Expertise in REST API and GraphQL integration patterns for
    mobile applications.
  - Experience designing secure consumer-facing web applications
    and protecting sensitive data.
  - Strong understanding of advanced React patterns, reusable
    component design, and frontend engineering practices.
  - Expertise in debugging complex production issues, crash
    analysis, monitoring, and performance optimization.
  - Strong knowledge of logging, observability, release
    management, and operational support practices.
  - Hands-on experience with Git workflows, CI/CD pipelines, and
    modern software delivery practices.
  - Experience conducting code reviews, mentoring engineers, and
    promoting engineering best practices.
  - Strong understanding of accessibility standards (WCAG), UX
    principles, and responsive web design.
  - Experience working in Agile delivery environments using
    Jira, Confluence, or equivalent tools.
  - Excellent problem-solving, communication, stakeholder
    management, and collaboration skills.
  - Experience with experimentation platforms, feature flagging,
    and A/B testing validation is a plus.
  - Experience in Consumer, Retail, eCommerce, or Direct-to-
    Consumer (DTC) digital products is preferred.
  - Use AI-assisted engineering tools and practices to improve
    development quality, delivery efficiency, testing and
    technical documentation.
  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field.

