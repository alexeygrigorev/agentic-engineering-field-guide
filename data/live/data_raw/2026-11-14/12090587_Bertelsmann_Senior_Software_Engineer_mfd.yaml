description: |
  Company Description

  Everyone’s story matters. Come shape your story with us at
  Riverty. But where does that take you?

  To one of our 30 hybrid workspaces – designed for exchanging
  ideas, learning from others, and shaping the way we work. An
  international community of over 4,000 people, representing
  almost 80 nationalities across 12 countries. United by one
  mission: Combining empathy, advanced technology and data-
  driven insights to keep people and businesses in flow. With
  payments made for them. So that they don’t have to worry
  about it.

  And there’s more. We are part of the family-owned
  Bertelsmann group. Established. Corporate. In a fast-paced
  industry. We enable flexible payments in various industries,
  simplifying the financial management of known brands and
  helping people repay debt to build financial confidence. In
  short: shaping FinTech.



  Job Description

  We are looking for a

  (Senior) Software Engineer (m/f/d)

  (permanent, full-time) Join our team at our location in
  Baden-Baden, Berlin or Verl – flexible working conditions
  available



  As a (Senior) Software Engineer within Riverty’s debt
  collection business, you will develop and maintain modern
  cloud-based applications and contribute to the evolution of
  a central solution for knowledge transfer and collaboration.
  Playing an important role in Client Onboarding, the solution
  is still at an early stage of development, giving you the
  opportunity to shape its core functionality and APIs, drive
  continuous improvement, and contribute your technical
  expertise to consulting and onboarding activities.



  How you’ll shape our software solutions:

  - Develop, ship and maintain cloud-based applications using C#
    and .NET.
  - Design microservices and distributed architectures and build
    robust RESTful APIs.
  - Containerize applications with Docker, work with Kubernetes
    and contribute to CI/CD pipelines using Azure DevOps.
  - Work with relational and NoSQL databases, including SQL
    Server, Entity Framework and MongoDB.
  - Ensure software quality through unit and integration testing
    with frameworks such as xUnit or NUnit and mocking
    libraries such as Moq.
  - Build secure and efficient solutions using authentication
    and authorization concepts such as OAuth2, Auth0 and JWT,
    as well as caching solutions such as Redis.
  - Apply SOLID principles, design patterns and Clean
    Architecture or Domain-Driven Design to create
    maintainable software.



  Qualifications

  What will help you succeed in this role:

  - 5+ of hands-on experience with C# and the .NET framework,
    combined with experience developing, shipping and
    maintaining cloud-based applications.
  - Strong knowledge of microservices, distributed architectures
    and RESTful APIs.
  - Practical experience with Docker and Kubernetes, plus good
    knowledge of CI/CD pipelines, preferably Azure DevOps.
  - Several years of experience with relational databases,
    preferably SQL Server, and working knowledge of ORMs such
    as Entity Framework, alongside experience with NoSQL
    databases, preferably MongoDB.
  - Solid experience with unit and integration testing,
    alongside a good understanding of authentication,
    authorization, caching and modern software design
    principles.
  - Fluent English and a thoughtful, quality-focused approach to
    software development.
  - Experience with Infrastructure as Code, preferably
    Terraform, and knowledge of the FinTech or banking
    industry are welcome advantages.
  - Hands-on experience with AI-assisted development tools such
    as Claude, Cursor or GitHub Copilot, together with sound
    judgement when reviewing and testing their output, is a
    plus.



  Additional Information



