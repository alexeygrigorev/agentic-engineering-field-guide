description: |
  Overview

  Citi is a world-leading global bank. We have approximately
  200 million customer accounts and a presence in more than
  160 countries and jurisdictions worldwide. We provide
  consumers, corporations, governments, and institutions with
  a broad range of financial products and services, including
  consumer banking and credit, corporate and investment
  banking, securities brokerage, transaction services, and
  wealth management. We enable clients to achieve their
  strategic financial objectives by providing them with
  cutting-edge ideas, best-in-class products and solutions,
  and unparalleled access to capital and liquidity.

  What we do:

  Citi Markets Technology powers the global financial markets
  by providing innovative, robust, and high-performance
  technology solutions. We are undergoing a significant
  transformation, modernizing our core platforms to support
  high-volume, low-latency transactions and drive business
  growth.

  What you will do:

  As a Senior Engineering Manager within Markets Operations
  Technology (MOT), you will lead a critical team responsible
  for the overall transformation and engineering excellence of
  Citi's Securities Settlements processing technology stack.
  This is a high-impact role in a fast-paced environment,
  offering the opportunity to shape and transform scalable
  infrastructure at one of the world's leading capital markets
  franchises.

  You will be responsible for leading the architecture,
  design, development, and delivery of strategic solutions,
  ensuring Level-3 support for the securities processing
  settlements tech stack that supports Citigroup's NAM, EMEA,
  and APAC markets operations. This role requires a leader
  with strong technical depth, domain expertise in securities
  processing, and a proven track record of successful project
  execution and team management.

  Key Responsibilities:

  - Engineering Leadership: Lead, mentor, and inspire a team of
    software engineers, fostering a culture of strong
    engineering principles, product ownership, and continuous
    improvement. Provide technical guidance, perform code
    reviews, and drive best practices.
  - Strategic Transformation: Drive the modernization of a large
    legacy securities processing stack into a modern, high-
    volume, low-latency, and scalable technology platform.
    Formulate and execute technology strategy for brown-field
    and green-field efforts.
  - Architecture & Design: Own the architecture and design of
    enterprise applications, focusing on microservices,
    distributed systems, and scalable solutions that adapt to
    changing market conditions. Ensure adherence to technical
    design, application development standards, and quality
    processes.
  - Project & Product Delivery: Manage complex technology
    projects from conception to delivery, ensuring alignment
    with business requirements, deadlines, and quality
    standards. Oversee CI/CD automation and improve overall
    development team efficiency.
  - Stakeholder & Risk Management: Collaborate extensively with
    business users, operations teams, project managers, and
    other technology groups to gather requirements, manage
    expectations, and deliver effective solutions. Identify
    and mitigate potential risks related to systems,
    processes, and regulatory compliance.
  - System Optimization: Identify system bottlenecks and
    deficiencies, devising and implementing robust solutions
    to enhance resiliency, performance, and scalability.
    Provide technical consultation for performance testing and
    tuning.

  Required Skills & Qualifications:

  - Education: BS/MS degree in Engineering, Computer Science, or
    equivalent.
  - Experience:
  - Experience in Capital Markets technology, with a strong
    focus on Securities Processing (Equities and/or Fixed
    Income settlements).
  - Experience as a Senior Developer, with hands-on experience
    building end-to-end solutions.
  - Direct management experience leading development staff in a
    mid to large-scale bank, providing engineering leadership
    and guidance.
  - Proven record of managing and delivering large-scale,
    complex platforms in a high-growth environment.
  - Technical Expertise:
  - Languages & Frameworks: Expert proficiency in Java (Core,
    Multi-threaded, J2EE), Spring Framework (Boot, Cloud, MVC,
    Data, Security, JMS), JavaScript (Angular, React.js,
    jQuery).
  - Architecture: Strong emphasis on Microservice architecture
    and design patterns, with a proven track record of legacy
    modernization. Experience with distributed environments
    and anti-patterns.
  - Databases: Expert knowledge of Oracle RDBMS design (PL/SQL,
    stored procedures, triggers, performance tuning) and
    experience with NoSQL (MongoDB, Cassandra). Experience
    migrating RDBMS to cloud/NoSQL is a significant plus.
  - Middleware: Hands-on experience with Tibco EMS, Kafka, MQ,
    JMS.
  - Cloud & DevOps: Developing/deploying applications to cloud
    platforms (AWS, GCP, PCF). Strong experience with
    Agile/SCRUM, CI/CD automation (Jenkins, Bamboo,
    UrbanCode), and code versioning tools (Github, Bitbucket,
    Perforce).
  - Other: High-volume/low-latency application development,
    transaction management (JTA), network infrastructure
    understanding (HTTP/S, TCP/IP, TLS, DNS), shell scripting
    (Unix/Linux/Windows).
  - Domain Knowledge: Deep understanding of trade processing,
    allocations, DTC/Fedwire/SWIFT settlements, payments,
    securities settlement lifecycle, segregation, margin,
    collateral optimization, and product knowledge across
    Equities, OTC Listed Options, Fixed Income (UST,
    Mortgages, Corporates), Repos, and Stock Borrow Loans.
  - Regulatory Awareness: Knowledge of relevant industry
    regulations and compliance requirements.
  - Soft Skills: Excellent interpersonal, oral, and written
    communication skills. Proven ability to lead, motivate,
    and manage diverse teams in a high-pressure, global
    environment. Strong analytical and problem-solving skills.

  What we’ll provide you:

  By joining Citi, you will not only be part of a business
  casual workplace with a hybrid working model (up to 2 days
  working at home per week), but also receive a competitive
  base salary (which is annually reviewed), and enjoy a whole
  host of additional benefits such as:

  - 27 days annual leave (plus bank holidays)
  - A discretional annual performance related bonus
  - Private Medical Care & Life Insurance
  - Employee Assistance Program
  - Pension Plan
  - Paid Parental Leave
  - Special discounts for employees, family, and friends
  - Access to an array of learning and development resources

  Visit our Global Benefits page to learn more.

  Alongside these benefits Citi is committed to ensuring our
  workplace is where everyone feels comfortable coming to work
  as their whole self, every day. We want the best talent
  around the world to be energized to join us, motivated to
  stay and empowered to thrive.

