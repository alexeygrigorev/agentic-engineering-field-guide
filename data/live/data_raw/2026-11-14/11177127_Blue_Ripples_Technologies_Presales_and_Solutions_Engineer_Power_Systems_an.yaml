description: |
  This is a remote position.



   Presales & Solutions Engineer — Power Systems & Energy
  Software






      Location: Bangalore, India (Delhi NCR / Pune / Chennai /
  Trivandrum also considered)





      Full-Time





      Experience 5- 8 Years






   About Us:




      Blue Ripples Technologies is a software engineering
  company with deep power-systems domain expertise. We build
  the integration and intelligence infrastructure that grid,
  DER, and energy-market software runs on — working with
  utilities, DER hardware makers, DERMS/VPP platforms, and
  energy service companies across the US and Europe. Our work
  spans grid protocol integration, DER fleet telemetry,
  demand-response and flexibility software, and CIM/grid-model
  interoperability.






   The Role:




      We're looking for a Presales & Solutions Engineer to be
  the technical-and-domain voice in front of our customers —
  utilities, DER hardware companies, and energy-software
  platforms in the US and EU. You'll join discovery calls, run
  live product demos, help scope engagements, and translate a
  prospect's grid or energy-market problem into the right
  solution — without needing to be the one who builds it. Our
  engineering team handles delivery; you own the conversation.






      This is a highly visible, customer-facing role reporting
  directly to the CEO, with real autonomy in how you run
  discovery, shape proposals, and represent us at industry
  events.






   What You'll Do






      • Lead and co-lead discovery calls with prospects —
  understand their grid, DER, or energy-market operations
  problem and map it to what we can build





      • Run live technical demos of our products and
  platforms, tailored to the audience (utility programme
  manager, DERMS CTO, energy operations lead, etc.)





      • Write or co-write technical sections of proposals and
  RFP responses





      • Sit in customer meetings as the domain-and-technical
  voice, working alongside our engineering team rather than
  instead of it





      • Represent the company at industry conferences and
  trade shows (DistribuTECH, RE+, SEPA, and similar) — running
  booth demos and technical breakout conversations





      • Feed real customer language, objections, and
  competitive intel back into our product and positioning









    Requirements

   What We're Looking For









   Must Have:




      • 5–8 years in software/systems engineering or technical
  delivery, with genuine exposure to the power/utility/energy
  sector — SCADA, AMI, grid operations, renewable integration,
  or energy analytics. You don't need to have built a DERMS
  platform, but you need to understand how one fits into a
  utility's world.





      • Prior experience in a customer-facing or cross-
  functional technical role — presales, solutions engineering,
  technical account management, or a delivery role that
  regularly required explaining technical work to non-
  technical stakeholders.





      • Comfortable reading and discussing system architecture
  and integration/data-flow concepts, without needing to build
  them yourself.





      • Strong written and verbal communication — you'll be
  writing proposals and presenting to customers regularly.










   Nice-to-have:




      • Familiarity with grid/energy protocols and standards:
  OpenADR, IEEE 2030.5, DNP3, IEC 61850, SunSpec, OCPP, or
  CIM/CGMES.





      • Exposure to DERMS/VPP platforms, ISO/energy-market
  operations, or utility demand-response programme delivery.





      • Prior experience representing a company at industry
  conferences or trade shows.















    Benefits

   What We Offer






      • A high-autonomy, high-visibility role with direct
  exposure to real customer relationships from day one





      • The chance to shape how a growing power-systems
  software company tells its story in the market





      • Competitive compensation in line with the seniority
  and scope of this role





      • Domestic and occasional international travel for
  customer meetings and conferences
