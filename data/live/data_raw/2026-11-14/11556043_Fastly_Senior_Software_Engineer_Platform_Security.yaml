description: |
  Fastly helps people stay better connected with the things
  they love. Fastly’s edge cloud platform enables customers to
  create great digital experiences quickly, securely, and
  reliably by processing, serving, and securing our customers’
  applications as close to their end-users as possible — at
  the edge of the Internet. The platform is designed to take
  advantage of the modern internet, to be programmable, and to
  support agile software development. Fastly’s customers
  include many of the world’s most prominent companies,
  including GitHub, Yelp, Paramount, and JetBlue.

  We're building a more trustworthy Internet. Come join us.

  Posting Open Date:  10/06/2026

  Anticipated Posting Close Date*: 01/30/2027

  *Job posting may close early due to the volume of
  applicants.

  Senior Software Engineer, Platform Security

  Fastly is seeking a Senior Engineer to represent our
  Platform Security team, with a specialized focus on Trust
  and Identity infrastructure. This is a high-impact
  individual contributor role for a technically exceptional
  engineer with deep experience in secure platform services at
  incredible scale.

  You will drive the execution of initiatives foundational to
  Fastly’s internal authentication, identity, and access
  control systems. This position is ideal for someone who
  thrives on solving complex problems, guiding architecture,
  and is passionate about resilience —while keeping systems
  secure and scalable.

  You will help shape Fastly’s internal trust architecture for
  years to come.

  What You'll Do:

  - Work alongside peers to define the long-term vision for
    trust and identity infrastructure and translate it into
    tangible execution plans aligned with business goals
  - Design and implement scalable internal trust solutions such
    as secrets management, PKI, and authentication services
  - Own Complex Challenges: Tackle ambiguous, technically
    demanding initiatives with multiple stakeholders and
    organization-wide impactCross-Functional: Partner deeply
    with Product, Security, Compliance, and other Engineering
    teamsImpact Management: Proactively identify potential
    situations that could negatively affect the business or
    customers and develop strategies to mitigate these risks
    before they escalate.
  - Promote Engineering Excellence: Establish and evangelize
    technical standards, code quality, reliability, and
    operational maturity

  What We're Looking For:

  - 5+ years of experience in a technical capacity as an
    individual contributorTeam player in areas such as
    Privileged Access Management, workload identity
    management, LDAP, secrets management, or trust systems
  - Strong systems engineering background with deep experience
    in Linux, networking, and distributed systems
  - Demonstrated expertise in modern programming languages
    (e.g., Go, Python, Rust) and infrastructure tooling (e.g.,
    Terraform, Vault, Consul, Chef)
  - Passionate about demos, feedback-driven work
  - Excellent written and verbal communication skills, with the
    ability to clearly articulate complex technical concepts
    for varying audiences and produce clear and comprehensive
    documentation
  - A collaborative mindset with experience working across
    cross-functional teams, fostering a culture of respect,
    knowledge sharing and innovation influencing technical
    decisions at the org level

  We’ll be super impressed if you have experience in any of
  these:

  - Implementing zero-trust architectures or identity-aware
    access proxies
  - Designing scalable secrets lifecycle management workflows
  - Working with PKI and certificate automation at scale
  - Contributing to open source identity or security tooling
  - Experience in cutting edge technologies (e.g. SPIFE/SPIRE,
    modern PAM tooling)

  This position will require you to be available during core
  business hours. It will also require occasional nights and
  weekends as necessary to support any on-call coverage.

  ------------------------------------------------------------
  --------------------------------------------

  This position is also open to Hybrid And Remote Work
  Locations.

  The preferred locations for this position are:

  - San Francisco, CA
  - New York, NY
  - Denver, CO

  Fastly currently embraces a largely hybrid model for most
  roles which allows employees flexibility to split their time
  between the office and home.

  There is a strong preference for Hybrid near a local office.
  However, we may be willing to consider remote candidates
  within the US.

  This position may require travel as required by your role or
  requested by your manager.

