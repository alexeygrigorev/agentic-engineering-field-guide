description: |
  MetTel is a global communications solutions provider with
  the most complete suite of fully managed services that focus
  on secure connectivity, and network and mobility services.
  We simplify communications and networking for business and
  government agencies. Our customers include many of the
  Fortune 500, and Gartner recognizes us as an industry
  leader. We have the broadest portfolio of technology and
  integrated partnerships, as well as our private network,
  which we use to create tailored solutions design,
  deployment, and ongoing management, driving cost savings,
  efficiency, innovation, and the ability to focus on core
  objectives.

  We believe that each team member is a key to the success and
  sustainability of the group. In order to achieve this, we
  offer an environment where all professionals can grow and
  develop their skills and competencies, collaborate with
  diverse professionals, share knowledge and enjoy a rewarding
  career.

  We are seeking a Senior Software Engineer – Full Stack to
  join a new Bruin Platform Modernization team in NYC.

  Bruin is MetTel's mission-critical operations platform,
  deeply embedded in how MetTel and its customers run. This
  role drives Bruin's tech stack modernization — moving
  Bruin's core platform onto modern frameworks, retiring
  legacy patterns, and building the new platform components
  that the next generation of Bruin will be built on. You will
  also build new core services and platform features on the
  modernized stack, and contribute back-end depth to the Bruin
  AI Portal and the broader team's work as needed.

  You will partner with our Principal Software Architect and
  senior technical leadership on architectural direction. You
  will use AI-assisted engineering tools as a core part of
  your workflow.

  ROLE AND RESPONSIBILITIES:

  - Tech Stack Modernization: Drive Bruin's tech stack
    modernization in partnership with the Principal Software
    Architect — moving core platform components onto modern
    frameworks, retiring legacy patterns, and establishing the
    patterns the next generation of Bruin will be built on.
  - Architecture & Design: Partner with the Principal Software
    Architect on architectural decisions across the
    modernization scope. Write ADRs for significant design
    choices, evaluate framework and infrastructure options,
    and contribute to platform-wide design discussions.
  - Full-Stack Development: Design, build, and ship new Bruin
    core services and customer-facing features on the
    modernized stack. Build across backend, API, and data
    layers.
  - Cross-Track Capacity: Work flexibly across the team's
    tracks, where additional depth or full-stack capacity is
    needed. Comfortable picking up work in unfamiliar parts of
    the codebase and ramping quickly.
  - Cloud & DevOps: Build and operate services on our
    containerized infrastructure (Kubernetes on-premise).
    Establish and follow CI/CD, IaC, and deployment patterns
    alongside the team.
  - Code Quality & Mentorship: Conduct code reviews, write well-
    tested maintainable code, and contribute to a high
    engineering bar across the team. Guide collaborating
    junior and mid-level engineers.

  DESIRED QUALIFICATIONS:

  - Must be a strong full-stack engineer with the fundamentals
    and judgment to work effectively alongside AI tooling and
    to operate with high autonomy.
  - 7+ years of professional software engineering, with
    significant time spent shipping production full-stack
    applications.
  - Strong proficiency in at least two modern programming
    languages, TypeScript/JavaScript (Node.js) preferred, plus
    working knowledge of multiple language ecosystems (e.g.,
    Python, Go, Java).
  - Solid React + TypeScript experience building complex, data-
    driven web applications; comfort with modern front-end
    tooling.
  - Production experience with a modern backend framework (e.g.,
    NestJS, FastAPI, or similar).
  - Hands-on experience designing and operating microservices
    and event-driven architectures, including production work
    with Kafka and Redis (or similar messaging and caching
    infrastructure).
  - Relational database experience and proficiency with ORM
    frameworks; familiarity with MSSQL a plus given Bruin's
    existing data layer.
  - Hands-on experience with containerized deployment
    (Kubernetes, Docker), and comfort with CI/CD pipelines.
  - Familiarity with cloud platforms (AWS, Azure, or GCP) as
    adjacent experience — many of the patterns transfer to our
    on-premise environment.
  - Comfort reading and reasoning about systems you didn't build
    — legacy codebase analysis and modernization are central
    to this role.
  - Demonstrated proficiency with AI-assisted development tools
    (Claude Code, Copilot, Cursor, or similar) as a core part
    of your engineering workflow.
  - Strong communication skills; able to articulate technical
    decisions to engineering peers and non-technical
    stakeholders.

  NICE TO HAVE:

  - Experience building AI-powered or AI-augmented application
    features — chat interfaces, agent integrations, tool-use
    surfaces, RAG patterns, or similar.
  - Workflow / orchestration engine experience (Temporal.io,
    Dagster, or similar).
  - Previous experience contributing to a brownfield
    modernization.
  - Experience building data-intensive applications — large-
    scale data pipelines, real-time analytics, high-throughput
    event processing, or systems where data volume and
    consistency are first-class design concerns.
  - Search and analytics infrastructure exposure (Solr,
    OpenSearch, StarRocks, ClickHouse, or similar).
  - Telecom, managed services, or B2B platform domain
    experience.
  - Certifications in AWS, Azure, GCP, or Kubernetes.

  *The salary range reflected is a good faith estimate of base
  pay for the primary location of the position. Our
  compensation reflects the cost of labor across several U.S.
  geographic markets, and we pay differently based on those
  defined markets. The U.S. pay for this position ranges from
  $150,000.00 to $165,000.00 annually. Pay varies by work
  location and may also depend on job -related knowledge,
  skills, experience and abilities of the successful
  candidate. Your recruiter can share more about the specific
  salary range for the job location during the hiring process.

