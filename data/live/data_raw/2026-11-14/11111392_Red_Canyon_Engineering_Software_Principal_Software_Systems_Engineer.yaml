description: |
  Do you want to help a small company make a BIG difference in
  space? Do you take ownership of your job and responsibility
  for your actions? Then come work for Red Canyon and help us
  continue our mission of helping humankind reach the stars!

  Red Canyon Software is looking for an enthusiastic and
  creative Principal Software Systems Engineer (Contract) to
  design and analyze new satellite and aerospace systems.
  We're looking for candidates who can bring exceptional
  engineering skills and strong experience in aerospace
  programs to the team.

  Position Responsibilities:

  The Principal Software Systems Engineer's primary
  responsibility will be driving the development of customer
  satellite systems with a focus on flight software delivery.
  This engineer will be involved in the full lifecycle of
  development, from requirements definition, validation,
  verification and operations. Being at the cutting edge of
  space technology, we need someone who is eager to learn,
  grow, and take on new and potentially unfamiliar challenges.
  There is no shortage of fascinating problems to solve.

  The Principal Software Systems Engineer will provide
  autonomous solutions of complex problems, through direct
  work or delegation, under the leadership of the Systems
  Engineering Manager. The Principal Systems Engineer will
  have project and subject matter responsibility and
  authority.

  Systems Engineering 75%

  - Perform systems engineering tasks for satellite software
    systems, including the heritage platform:
    - Requirements development – initial definition, decomposition
      and flow down, management of Software and Avionics
      Subsystem requirements
    - System design and trade studies – high level concept trades
      to support subsequent detail design
    - Verification planning and testing – verification matrices,
      buy-off / sell-off, test planning, analysis planning,
      etc.
    - Ensure proper Systems Engineering processes are followed
      including requirements traces / RVTMs
    - Coordinate and collaborate with internal and external stake
      holders to ensure that technical requirements are met
    - Flight Software anomaly resolution and troubleshooting
  - Demonstrated ability to participate in cross-functional
    planning, coordination, and task execution situations
    involving the full spectrum of engineering and integration
    activities

  Roadmap Development 15%

  - Support spacecraft development product roadmap; includes
    design adjustments, schedule, and cost targets aligned for
    future business captures
  - Support the definition of spacecraft customization process
    for customer mission needs

  Additional Responsibilities 10%

  - Perform all the necessary systems engineering activities to
    build, to maintain and to evolve the spacecraft products
  - Promote and optimize cost savings by reuse of the heritage
    platform designs and manufacturing infrastructures in the
    pursuit of various constellation prospects.

  Qualified Experience / Skills / Training:

  Education:

  - Bachelor's degree in STEM (Science, Technical, Engineering,
    Math) or related scientific areas
  - Preferred: Masters in STEM (Science, Technical, Engineering,
    Math) or related scientific areas

  Experience:

  - A minimum of 15 years with a bachelor's degree, or 12 years
    with a master's degree
  - Proven track-record of working with aerospace software
    systems, starting from conceptual designs and tradeoffs
    thru detailed design, development, integration, test,
    deployment, and operations
  - Proven track-record of leading multi-disciplinary teams to
    solve problems

  Knowledge, Skills, Demonstrated Capabilities:

  - Familiarity with elements of space mission architectures
    extending beyond the satellite platform – including
    launch, flight operations, mission CONOPS, user
    interfaces, etc.
  - Experience with systems architecture, requirements
    definition and decomposition, and requirements
    verification and validation (e.g. Requirements
    Verification and Traceability Matrices)
  - Experience with Model Based Systems Engineering (MBSE) tools
    and methods
  - Experience with requirements management tools (DOORS or
    similar)
  - Experience leading and/or performing analyses for
    affordability, safety, reliability, maintainability,
    testability, human systems integration, survivability,
    vulnerability, susceptibility, system security,
    regulatory, certification, product assurance or other
    specialties engineering disciplines
  - Communicate in a clear and concise manner effectively across
    multiple levels
  - Be team-minded and ready to work in a multi-functional and
    multi-cultural, fast-moving and complex/technical
    environment
  - Flexible attitude and strong initiative
  - Demonstrated ability to deliver results

  MUST BE A US CITIZEN

  Red Canyon Engineering and Software: “Exploring Other
  Planets, Improving our Own”

  Red Canyon contracts with NASA, NOAA, NREL, JPL, and DOD, in
  addition to customers such as Lockheed Martin Space,
  Raytheon, Sierra Space, a.i. solutions, Walt Disney
  Imagineering, SAIC, Sidus Space, Ball Aerospace, SpaceX,
  Honeywell, KBRwyle, Peraton, LASP, Maxar, Blue Origin, and
  Moog. We specialize in building spacecraft, developing
  renewable energy technologies to help make our planet a
  better world and cutting edge research and development. Our
  disciplines include embedded flight software, software
  testing, GN&C, systems engineering, mechanical design,
  structural analysis, real time flight and ground software,
  simulation software, user interface software, and mission
  management software. We help our contractors with the full
  life cycle of product development from requirements to test
  and delivery.

  Some of the programs we have previously or currently worked
  on include: Human Lander System, Artemis I-II, WorldView
  Legion V, Perseverance Rover, InSight, GeoXO, Tranche-1,
  LizzieSat, Dream Chaser, Psyche, Mars 98, Odyssey 01,
  Stardust, Genesis and Deep Impact, Mars Phoenix, Joint Polar
  Satellite System, Mars Reconnaissance Orbiter, Orion, Lunar
  Reconnaissance Orbiter, GOES-R, OSIRIS-REx, Maven, JUNO,
  Grail, and the MarsFlight and LunarSIM Simulation.

  Red Canyon’s home office is located in scenic Denver,
  Colorado, and our regional office, Launch Now, is in
  historic downtown Titusville, Florida. We are a small
  company that maintains a flat organization to decrease our
  overhead and costs to our customers. Our number one focus is
  to solve some of the most complicated engineering problems
  humankind is facing.

  Does it sound like you want to join our mission?
