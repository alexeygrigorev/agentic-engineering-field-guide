description: |
  Ready to do the most impactful work of your career? At
  Coinbase, we are uncompromising on our mission to increase
  economic freedom. The bar is high, the environment is
  intense, and we like it that way. This isn't a place for
  complacency, it’s a place to be pushed past your perceived
  limits. If you're ready to build the future of finance
  alongside people who refuse to settle for "good enough," you
  belong here. Coinbase is a remote-first, but not remote-only
  company. Expect to get together quarterly for intense in-
  person working sessions called “surges.” learn more about
  working at Coinbase.

  As a Staff Software Engineer, Frontend on the Advanced
  Trading team within the Consumer & Business group, you'll
  lead the front-end technical strategy for Coinbase Advanced,
  our trading platform for experienced traders. You'll own the
  performance, reliability, and scalability of our web and
  mobile trading clients, driving low-latency interfaces that
  serve traders across multiple instrument types. This is a
  high-impact role at the intersection of crypto, trading
  infrastructure, and consumer product, where your technical
  leadership will shape both the platform and the engineering
  team building it.

  What you'll do:

  - Own the front-end technical roadmap for Coinbase Advanced,
    defining architecture decisions that enable a reliable,
    scalable trading platform across web and mobile
  - Drive measurable performance improvements across rendering,
    network efficiency, and state management to deliver a low-
    latency trading experience
  - Lead complex, multi-quarter technical initiatives end-to-
    end, setting and enforcing high standards for code
    quality, system design, and engineering rigor
  - Strengthen the engineering team through hands-on mentorship
    of senior engineers, elevating technical decision-making
    and fostering growth across the subteam
  - Partner with Product and Engineering leadership to translate
    business priorities into actionable technical plans and
    ship high-impact features
  - Shape front-end engineering practices and patterns that
    scale with a growing team, establishing conventions that
    accelerate development velocity

  Required Skills and Experience:

  - 8+ years of software engineering experience with deep
    expertise in modern front-end frameworks (React, React
    Native, or equivalent) and mobile development environments
  - Proven track record optimizing complex UI systems for
    performance, including rendering optimization, network
    efficiency, and state management at scale
  - Experience leading technical strategy for a product area,
    including architecture decisions, trade-off analysis, and
    cross-team alignment for multi-quarter initiatives
  - Demonstrated success mentoring senior engineers and driving
    measurable improvements in team engineering standards and
    delivery velocity
  - Familiarity with high-availability, low-latency systems
    (trading platforms, financial systems, or real-time data
    applications preferred)
  - Utilizes generative AI responsibly, maintaining human
    oversight to deliver business-ready outputs and drive
    measurable improvements in workflow efficiency, cost, and
    quality.

  P75751 #LI-Remote

