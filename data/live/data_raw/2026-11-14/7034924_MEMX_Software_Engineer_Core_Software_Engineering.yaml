description: |
  Description

  MEMX is looking for a Software Engineer to join our core
  software development team. The Software Engineer will work
  on the design, development, and support of the MEMX Trading
  system software. This person will play a key role in serving
  our customers and our business by building new features for
  the US Equities and Options platform as well as providing
  secondary production support.

  MEMX currently has a U.S. presence in these states:
  California, Colorado, Connecticut, Delaware, Florida,
  Georgia, Illinois, Kansas, Maine, Maryland, Michigan,
  Nevada, New Jersey, New York, North Carolina, Pennsylvania,
  South Carolina, & Utah.

  *If you live outside of the above states, please list in
  your application and our team will evaluate.

  What You'll Do

  - Full Software Development Life Cycle participation for MEMX
    Trading Platform
  - Low latency, high throughput, event-sourcing application
    development
  - Assist Market and Technical Operations to resolve production
    issues

  Requirements

  - B.S. in Computer Science
  - 5+ years of Real-Time Server-Side JAVA software development
    experience
  - Low latency, High Volume, High Throughput Linux production
    system development/support Experience
  - Experience in the development of US Equities, Options, or
    Futures asset classes
  - Experience developing low latency trading systems
  - Strong professional and interpersonal skills including
    exceptional customer service, creative problem solving,
    and effective written and verbal communications,
  - Broad systems thinking – understands the connections and
    relationships across functions and entities for both
    internal and external constituencies
  - Ideal candidate will have demonstrated ability to succeed as
    a self-starter in a dynamic, remote-first environment

  Working experience in the following areas is a plus:

  - Clearing and Settlement/Back Office processes
  - Event Sourcing design pattern application development
  - Time Series Databases
  - TCP/IP UDP networking
  - FIX messaging
  - GIT/Gradle/Junit/Jira/Confluence/Jenkins/Wireshark

  Benefits

  At MEMX you will have the ability to work with a talented
  team of professionals who bring diversity of thought and
  background. You will have the opportunity to shape the
  future of our company and the impact MEMX will have on our
  clients and the broader markets. We offer competitive
  employee benefits and perks and will continue to make this a
  priority to attract the best.

  - Work From Home
  - Health Care Plan (Medical, Dental & Vision)
  - Retirement Plan (401k)
  - Life Insurance (Basic, Voluntary & AD&D)
  - Unlimited Paid Time Off
  - Generous Paid Family Leave
  - Short Term & Long-Term Disability
  - Training & Development
  - Wellness Resources

  Pay Range: $150,000 – $250,000 USD

  *Pay ranges are a general guideline only and not a guarantee
  of compensation. Compensation may vary depending on a number
  of factors, including a candidate’s qualifications, skills,
  competencies and experience, and location.

  Equal Opportunity Statement

  MEMX is an equal opportunity employer. We are committed to
  creating a diverse and inclusive environment for all
  employees. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, gender, gender identity or expression, sexual
  orientation, national origin, genetics, disability, age, or
  veteran status.

  Diversity Inclusion Statement

  At MEMX, we believe that diversity and inclusion are
  essential to driving innovation and success. We welcome and
  celebrate individuals from all backgrounds and perspectives,
  and we strive to create an inclusive culture where everyone
  can thrive.
