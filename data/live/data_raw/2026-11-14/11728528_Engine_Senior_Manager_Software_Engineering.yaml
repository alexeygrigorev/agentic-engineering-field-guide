description: |
  About Engine

  Engine is the AI-native platform for intelligent travel. For
  a decade, Engine has built the proprietary technology and
  supply behind modern business travel, serving over 40,000
  customers and nearly 2 million travelers, along with leading
  travel and AI companies that build on Engine's
  infrastructure. One system powers business travel, group
  travel, human agents, and AI agents. That work has earned
  Engine recognition as TravelTech's Reservation Platform of
  the Year (2026), a spot on Inc.'s Power Partners list
  (2026), and one of Built In's Best Places to Work
  (2020–2026). We're looking for bold, ambitious people to
  help redefine how businesses manage and experience travel.
  Working here, you can expect exponential growth, an
  ambitious pace, full ownership, and high-caliber colleagues
  who push you to do the best work of your career. Every hire
  raises the bar. Come outpace the ordinary and build the
  future of travel with us.

  About the Role

  We’re looking for an Engineering Manager responsible for
  driving customer activation, engagement, and expansion
  across Engine’s full travel marketplace, including Flights
  and Partner Hub.  In this role, you’ll lead a high-
  performing team focused on rapid development, continuous
  improvement, and building stronger experimentation practices
  into how the team ships and learns. You’ll partner closely
  with product, data, and design to identify opportunities to
  increase time-to-value, improve stickiness, and encourage
  broader product adoption across the platform through
  thoughtful testing, learning, and iteration.

  Your Mission

  As part of the Engine team, you’ll play a vital role in an
  environment where innovation meets collaboration. Here’s
  what you’ll take charge of:

  - Lead a high-performing engineering team by fostering a
    culture of technical excellence, extreme ownership, and
    rapid execution. You will raise the talent bar, empowering
    builders to solve complex marketplace challenges while
    ensuring growth and accountability.
  - Manage the end-to-end development lifecycle of engineering
    projects by pioneering AI-driven practices that accelerate
    quality and delivery. You will leverage cutting-edge
    strategies to make speed-to-market a byproduct of your
    team's velocity, ensuring every initiative meets our high
    bar for security, scalability, and excellence.
  - Drive efficiency through agile methodologies and engineering
    best practices, leveraging intelligent automation and
    advanced workflows to redefine the ceiling for team
    velocity. You will continuously refine processes and tools
    to optimize productivity, ensuring rapid delivery and
    high-caliber output are the standard for every project.
  - Act as the bridge between engineering and other teams,
    ensuring clear communication and alignment on priorities.
    Translate complex technical concepts into actionable
    insights for business stakeholders and leadership.
  - Champion a customer-obsessed engineering culture by building
    data-driven, consumer-grade solutions that anticipate
    traveler needs. You will integrate emerging technologies
    and innovative strategies to enhance product depth,
    ensuring every technical decision scales efficiently while
    directly fueling business growth and long-term technical
    success.

  What You’ll Bring to Engine

  We’re looking for someone who’s ready to make an impact and
  grow alongside us:

  - Experience: 5+ years of experience in engineering, with at
    least 5 years in a management role. Proven track record of
    successfully leading engineering teams and delivering
    complex projects.
  - Skills: Exceptional leadership with a focus on driving high-
    velocity results and a culture of performance. You are a
    decisive problem-solver who leverages an AI-first mindset
    to manage complex priorities and streamline communication,
    ensuring the team remains agile and ahead of schedule.
  - Tech-Savvy: Proven technical foundation in some or all of
    our core stack—Node.js, Ruby on Rails, React, AWS
    (Lambda/Terraform), and Datadog. You are a modern builder
    who leverages tools like Claude and Cursor to accelerate
    delivery and maintain a high bar for performance and
    observability.Education: Bachelor’s degree in Computer
    Science, Engineering, or a related field (Master’s
    preferred), or equivalent professional experience.Mindset:
    Deep understanding of agile software development
    methodologies (Scrum, Kanban, etc.). A strategic and
    results-driven approach to engineering and team
    leadership. Adaptability and a continuous improvement
    mindset.

  Compensation Our compensation packages are based on several
  factors, including your experience, expertise, and location.
  In addition to a competitive base salary, all roles receive
  equity. Depending on the role, total compensation may also
  include an annual bonus. Your recruiter will share your
  complete compensation package as you move through the
  process.

  Base Pay Range

  $225,000—$265,000 USD

  The Engine Edge: Perks & Compensation We believe in
  rewarding great work with great benefits:

  - Compensation: Competitive base pay tied to role and
    experience, with equity for all employees. Some roles are
    also eligible for bonuses or commissions.
  - Benefits: Check out our full list at engine.com/culture
  - Environments for Success: Different roles have different
    needs in terms of the environments that drive success
    which is why we have a hybrid-hub model. Whether you are
    in one of our amazing offices or fully remote, we'll make
    sure you have what you need to succeed.

  Perks and benefits may vary based on employment type,
  location, and more
