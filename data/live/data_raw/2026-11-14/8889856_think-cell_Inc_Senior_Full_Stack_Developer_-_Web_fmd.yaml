description: |
  Join us as a (Senior) Full Stack Developer - Web (f/m/d) in
  Berlin

  Our Story



  We are looking for a Senior Full Stack Developer (Web
  Platform) to help shape and scale thinkcell’s web platform
  and enable multiple teams to efficiently manage and publish
  content.

  This is not a role for someone who only wants to work within
  a fixed web stack or maintain existing templates. We are
  looking for a web engineer who enjoys solving complex
  technical problems, making sound architectural decisions,
  and building systems that remain robust and maintainable as
  requirements evolve.

  You will work across frontend and backend, improve the
  technical foundation of our web platform, and help us build
  scalable solutions that enable our teams to manage and
  publish content. Along the way, you will collaborate closely
  with stakeholders across design, marketing, product and
  engineering but with strong ownership over technical
  quality, long-term maintainability, and the overall
  direction of the platform.

  What you will do

  - Design, build, and evolve our web platform features across
    front-end and CMS back-end.
  - Solve complex technical problems in a pragmatic way,
    balancing speed of delivery with long-term maintainability
  - Drive architectural improvements that make our web ecosystem
    more robust, scalable, and easier to work with
  - Build and improve our back-end functionality in PHP and
    Laravel for integrations, dynamic features, and internal
    tooling
  - Extend and optimize our CMS and publishing workflows to
    support efficient content operations without compromising
    technical quality
  - Improve performance, Core Web Vitals, accessibility, and
    technical SEO foundations across the platform
  - Work on the evolution of our current web architecture, while
    also challenging existing approaches when better solutions
    exist
  - Collaborate with design, marketing, product, and engineering
    teams to turn business requirements into well-structured
    technical solutions
  - Interface with back-end systems written in C++, ensuring
    reliable and efficient data exchange across system
    boundaries
  - Identify opportunities to improve developer experience,
    reduce complexity, and raise the overall engineering
    standard of the platform
  - Take ownership of technical tasks and help define best
    practices for modern web development at think-cell

  What we are looking for

  - Strong experience building and shipping production-grade web
    platforms, applications, or systems
  - A proven ability to solve non-trivial technical problems and
    work confidently in complex web related codebases
  - Strong full stack engineering skills, with solid backend
    experience in PHP, Laravel, or similar technologies and a
    frameworks
  - Strong frontend fundamentals, including HTML, CSS,
    JavaScript and modern approaches to building maintainable
    user interfaces
  - Good judgment when making architectural and technical trade-
    offs
  - A pragmatic mindset: you know when to build for flexibility
    and when to keep things simple
  - Curiosity and confidence to work with unfamiliar
    technologies or domains when needed
  - A strong sense of ownership and responsibility for code
    quality, maintainability, and technical outcomes
  - Experience collaborating across disciplines and
    communicating clearly with technical and non-technical
    stakeholders in English

  Nice to have

  - Experience with Statamic CMS
  - Experience with static site generation challenges
  - Experience with Deployment Tools such as Jenkins or similar
    tools
  - Familiarity with Tailwind, Alpine.js, or similar frontend
    tools
  - Experience improving performance-critical, SEO-relevant, or
    content-heavy platforms
  - Familiarity with Python for automation or tooling
  - Experience integrating with non-web backend systems or
    services

  Our Values

  As part of our team, you will embody and help shape the
  following principles that define us: 

  - Forward Thinking: We embrace change and challenge the status
    quo.

  - Ownership: We take pride in our work and learn from our
    mistakes.

  - Customer First: We prioritize delivering lasting value.

  - Unified Team: We foster collaboration, respect, and
    integrity.

  - Strive for Excellence: We set ambitious goals and pursue
    quality.

  Why is thinkcell the right place for you?  We empower over
  1.3 million users across 35,000 companies, including top
  consulting firms and major global enterprises. With offices
  in Berlin, Munich, Denver, Boston, London, Tokyo, and Dubai,
  we’re a diverse team of over 220 people, committed to
  innovation and excellence.

  think-cell is more than a job – it's a chance to be part of
  an innovative, inclusive team that values collaboration and
  growth. We encourage applicants from all backgrounds to
  apply. Together, we can shape the future of productivity
  software.

  We can’t wait to see what you’ll bring to the team!
