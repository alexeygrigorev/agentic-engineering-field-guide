description: |
  An Introduction to Primer

  Primer is the unified infrastructure for global payments. We
  give finance and payments teams the visibility and control
  to reduce complexity, improve performance, and capture more
  revenue - all from a single platform. Backed by Sofina, Peak
  XV Partners, ICONIQ, Tencent, Accel, and Balderton, we're
  building the payments layer the world's best companies rely
  on.

  Watch our showcase >

  Read up on our $100m Series C

  Learn more about our culture >

  What will you be doing?

  - Leading and growing the pre-sales SE team. You'll hire,
    coach, and set a high bar for both technical and
    commercial craft.
  - Getting into the biggest deals yourself. You'll join the
    discovery calls, architecture sessions and exec
    conversations that bring real value to your merchant
    interactions.
  - Owning how we sell technically: discovery, demo standards,
    POCs and RFPs, so every SE runs a deal the same sharp way.
  - Partnering with Sales leadership on pipeline, forecast and
    deal strategy. You'll know where the technical risk sits
    in every opportunity and how to clear it.
  - Building business cases a merchant's CFO will sign off on.
    Auth rate uplift, cost savings and resilience, told as one
    clear story.
  - Acting as the voice of the merchant inside Primer, turning
    patterns from the field into sharp input for Product.
  - Defining how we measure SE impact on win rate and deal
    velocity, and using that to decide where the team spends
    its time.

  What you'll bring

  - Experience leading a pre-sales or Solutions Engineering team
    in the payments industry, B2B SaaS or infrastructure.
  - A strong emphasis and track record hiring and developing
    Solution Engineers.
  - Experience applying MEDDPICC throughout your SE playbooks.
  - Deep technical fluency. You can whiteboard an API
    integration, talk through SDKs, webhooks and auth flows,
    and hold your own with a merchant's engineering team.
  - Real commercial instinct. You've shaped and closed complex
    enterprise deals and can tie technical wins to revenue.
  - Confidence at exec level, with merchant leadership and
    internally.
  - You've built structure around a pre-sales function, not just
    run one that already existed.

  ✅ A typical interview process

  - An initial intro call with a Talent Partner
  - An interview with the Hiring Manager
  - Challenge Stage - Contextualised to the role
  - A final, values-alignment interview

  What's the culture like at Primer?

  We're building a culture where people can do their best work
  and be proud of the impact they have. You'll be working with
  people who are mission-driven, smart, and reflective, and
  who are genuinely invested in building exceptional products
  and delivering success for our merchants. We work remotely,
  and have done since day one. We believe that building a
  successful, profitable company goes beyond proximity. We
  invest in our relationships through great remote working
  practices and thoughtfully designed face-to-face time,
  including workations, our annual company retreat, and access
  to co-working spaces across most major cities. The work is
  challenging. Scaleups are a challenge, and building
  category-defining products is a challenge. But there's a
  meaningful difference between a challenge and a struggle. At
  Primer, the right challenge comes with the right support:
  strong onboarding, a collaborative environment, and a team
  that is genuinely invested in your success. It's never
  something you face alone.

  Our benefits

  🌍 We are fully remote and globally distributed; and have
  been since day one 💰 Competitive share options 🌴 Flexible
  holiday, with 25 days minimum to be taken 🗣️ Co-working
  space access across major cities 📅 Workations & Company
  Retreat 💻 The best equipment for your role 🏠 £500 towards
  your home office setup 🔎 Generous learning budget 🏥 Private
  Medical Insurance 📈 A broad set of additional perks and
  benefits (depending on location)

