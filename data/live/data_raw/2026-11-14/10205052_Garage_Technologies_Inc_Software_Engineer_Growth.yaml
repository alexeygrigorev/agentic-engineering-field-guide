description: |
  About us

  Garage powers the exchange of critical assets across
  America’s essential industries. We started with fire
  departments, where purchasing mission-critical vehicles and
  equipment used to take months of paperwork, phone calls, and
  delays. Our agentic platform automates the entire
  transaction: discovery, payments, freight, paperwork,
  warranty, and financing. What once took months now takes
  minutes.

  In under a year, we’ve expanded to cities and towns in all
  50 states and grown revenue more than 10x. Based in New
  York, we’ve raised $18M from Y Combinator, Initialized
  Capital, Infinity Ventures, FJ Labs, and other leading
  investors. We’re moving fast, growing quickly, and just
  getting started.



  About the role

  Growth engineering at Garage builds the systems that turn
  our sales motion into a machine. The industry runs on PDFs,
  phone calls, and software built in 2003, and we'd rather
  build the modern version in-house than wire together someone
  else's tools.

  You'll work closely with our sales team and the dealers,
  manufacturers, fleet operators, and government buyers who
  move specialty assets across the country. This involves
  owning the data infrastructure, internal tools, and AI-
  powered workflows that fill our pipeline.

  - Build the data infrastructure that finds every prospect in
    the industry by turning fragmented data into pipelines.
  - Ship internal tools that make our sales team dramatically
    more effective. This includes outbound automation, lead
    routing, sequencing, deal-room tooling.
  - Apply AI and LLMs to unstructured data and turn it into
    signals that fill our pipeline.
  - Build agents that work in the background to compound our
    sales advantage.



  What we’re looking for

  - You think in systems, not tickets.
  - You get excited by operating in a high-performance startup
    environment.
  - You would love to be customer-facing.
  - You play for the front of the jersey, having strong
    opinions, a willingness to question the status quo, and a
    drive to become a real expert in whatever space you work
    in. All while being a great team communicator.



  Required

  - Extremely AI-native, living on the cutting edge. AI is how
    you ship.
  - A track record of shipping high-quality products at scale,
    including with and for agents.
  - Experience designing and working with scalable databases and
    APIs.



  Nice to have

  - Startup experience as a technical co-founder or early
    engineer at a Series A/B/C startup.
  - Experience working with messy real-world data from analog
    sources.
  - Familiarity with sales and marketing automation tools (Clay,
    HubSpot, Salesforce, Apollo).
  - 2+ years of experience.



  Our values

  - Growth oriented. We invest in people who grow as the company
    grows. We all should be constantly learning.
  - Humility. Everyone has a lot to give and a lot to learn. We
    believe in creating an environment where the best ideas
    win and acknowledging when we are wrong.
  - Customer focused. We have a genuine love for our customers.
    Customer success is our success.
  - Hack to success. We move fast and take big swings. We always
    aim for a solution that addresses 80% of the problem in
    20% of the time. We make informed bets, launch quickly,
    and iterate.



  Why Garage?

  - Our product is something people use everyday to buy the
    equipment local communities everywhere depend on.
  - We’ve grown revenue over 10x in the last year and are well
    capitalized with $18M in funding raised total.
  - We have a talent-dense, high-performing team from Ramp,
    Twitter, Goldman Sachs, Bilt, Wise, Unify, Honey, PayPal,
    and more.
  - You’ll be one of our first 35 employees, operating as a
    foundational member of the team, partnering alongside the
    company’s founders.



  What we offer

  - Competitive salary and stock options
  - Health, dental and vision insurance (100% covered)
  - Unlimited paid time off every year (in addition to company
    observed holidays)
  - Daily lunch and dinner
  - $100 monthly wellness stipend
  - 401(k) with employer match
  - Pre-tax commuter benefits
  - Bi-annual team offsite
  - Relocation assistance
