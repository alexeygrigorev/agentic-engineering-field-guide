description: |
  About Hexmodal

  Hexmodal builds smart devices and a simple software platform
  that help facilities teams automate routine compliance
  testing, monitoring, and documentation. Our technology helps
  teams spend less time on manual rounds and more time on the
  maintenance work that keeps buildings operating safely.
  Today, Hexmodal supports more than 180 health systems across
  48 states.

  The Role (also the Mission)

  We are looking for a Senior Software Engineer to add
  implementation and review bandwidth to our application team.
  This role is focused on feature development across our
  Django/Vue platform, which helps 3,000+ healthcare
  facilities stay safe and compliant through our IoT device
  fleet.

  This is an empowered individual contributor role. We’ve
  focused a lot on building process and automations to allow
  for our developers to move quickly and work independently,
  without being blocked. In return, we expect you to be very
  fast and productive on your own work, bring real technical
  depth, and learn without needing much dedicated guidance.

  We believe in diffusing responsibility across the team:
  engineers today should own more of the process end to end,
  and ownership over parts of the codebase is both motivating
  and a driver of productivity. Within your first 4 months,
  you will be assigned ownership of one or more modules of our
  application, becoming the go-to expert for their design,
  quality, and evolution.

  You will also dedicate roughly 30% of your time to code
  reviews, a direct lever on the whole team's velocity. This
  role reports to our Application Lead and is based out of our
  NYC office 5 days a week.

  Here are some ways you’ll make an impact (also Outcomes of
  the role)

  ● Ship features end to end with high velocity and quality:
  scope, design, build, release, and iterate with customer
  feedback, with minimal oversight.

  ● Within 6 months, be assigned ownership of one or more
  application modules, and act as their authority on design,
  quality, and roadmap input.

  ● Dedicate ~30% of your time to code reviews, providing
  fast, rigorous, constructive feedback that keeps the team's
  velocity high and the codebase healthy.

  ● Own production bugs and issues in your modules as part of
  the on-call/bug triage rotation, resolving them in a timely
  and structured manner and keeping affected users informed.

  ● Improve the performance and maintainability of the modules
  you own through targeted refactors and query optimization.

  ● Ramp up on new domains and tools independently, freeing
  lead time for the rest of the team.

  Competencies we are looking for in the right candidate:

  ● 6+ years of professional software development experience,
  including 3+ years in a fast-moving startup or high-velocity
  environment.

  ● A track record of high personal output: shipping complex
  features quickly without sacrificing quality.

  ● Strong backend depth in Python. Django experience strongly
  preferred; depth with a comparable framework plus strong
  fundamentals counts.

  ● Deep PostgreSQL expertise: schema design, query
  optimization, indexing, and performance tuning.

  ● Demonstrated experience solving hard technical problems,
  such as scaling an application, large refactors, or
  performance bottlenecks.

  ● Highly independent: learns new domains and tools on their
  own and makes sound technical decisions with minimal
  guidance.

  ● Strong code review skills: thorough, fast feedback that
  improves code without slowing the team down.

  ● Comfortable with operational ownership: debugging
  production issues and owning the fix through to resolution.

  ● Proficient with AI coding tools as part of an efficient
  personal workflow.

  Bonus Points: (Some nice to haves for this role)

  ● Front-end experience with Vue.js

  ● Experience with IoT devices and LoRaWAN

  ● Experience with AWS and containerization (Docker,
  Kubernetes) in production

  ● Experience building compliance-related software

  Compensation & Benefits We offer competitive compensation
  along with meaningful equity so you share in the value you
  help create.

  Our benefits include:

  - 401(k) match
  - 100% coverage of medical, dental, and vision premiums for
    you and 80% coverage for dependents
  - Paid parental leave (for all parents)
  - Unlimited PTO

  Why Hexmodal

  At Hexmodal, you’ll work on real problems with real-world
  constraints and have meaningful ownership over the results.
  We’re a growing team that values simplicity, accountability,
  curiosity, and respect for the facilities professionals we
  serve.

  If you’re excited to build practical technology that makes
  an important job easier, we’d like to hear from you.

  How to apply

  Click the link below to apply.

