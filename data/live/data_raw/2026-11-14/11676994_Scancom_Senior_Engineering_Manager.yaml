description: |
  We're Scan.com. We're building America's national imaging
  network: the infrastructure that connects patients,
  providers, and payers to faster, better-value diagnostic
  imaging. Thousands of patients move through our platform
  every day, and each is a real person waiting for an answer
  to a healthcare concern. We exist to get them that answer
  faster.

  We manage the medical imaging pathway end-to-end. Providers
  order through a single point of entry, and from there, we
  run the entire medical diagnostic pathway. Managing the full
  pathway, rather than brokering pieces of it, is what lets us
  deliver imaging faster, at higher quality, and at a lower
  cost than the fragmented status quo.

  We're looking for a Senior Engineering Manager at an
  exciting time. We've raised over $200m in funding to date,
  reached profitability, and are growing 100% year on year.

  Millions of people wait too long for a diagnosis. Come help
  us fix that.

  WHAT YOU WILL BE GETTING INVOLVED IN:

  We are a small, high-output team building across a complex
  technical surface: consumer marketplace, provider-facing
  scheduling tools, interoperability infrastructure, revenue
  cycle tooling, and AI-augmented workflows. We scale our
  impact through AI-native development practices, tight
  feedback loops, and engineers who own outcomes rather than
  tickets.

  As Senior Engineering Manager, you will lead a cross-
  functional engineering team and partner with the product
  organization to deliver on our ambitious roadmap. We expect
  roughly 20% of your time to be spent writing code, reviewing
  architecture, or directly shaping technical decisions. The
  majority of your time will be spent establishing engineering
  processes, managing technical breakdown of features,
  reporting progress to leadership, career development of your
  reports, and exploring new technologies/vendors.

  You will report to our CPO and partner closely with Product,
  Operations, and Data to ship the systems that run our
  business. You are expected to be genuinely AI-native: not
  just comfortable with AI tooling, but actively shaping how
  your team uses it. That means deploying agents, building
  evaluation frameworks, and coaching engineers to work at a
  level of throughput that wasn't possible two years ago.

  As a scale-up business, you can expect your role to develop
  over time. Here are some of the types of things you could be
  getting involved in:

  - Lead and develop a team of engineers across multiple product
    domains, owning velocity, process, performance, technical
    growth, and team culture
  - Remain a consistent technical contributor by writing
    production code, leading design reviews, and pairing with
    engineers on complex problems.
  - Define and enforce engineering standards across code
    quality, system design, testing discipline, deployment
    practices, and incident response
  - Drive the team's AI-native operating model by identifying
    where AI agents can replace or accelerate engineering
    workflows, building evaluation frameworks to measure
    output quality, and coaching engineers to leverage AI
    tooling as a primary development instrument rather than an
    occasional aid
  - Partner with Product to refine roadmaps, push back on scope
    where necessary, and ensure the team is working on the
    highest-leverage problems at any given time
  - Own the architecture of your team's systems by making build
    vs. buy decisions, managing technical debt deliberately,
    and ensuring the stack can support the growth trajectory
    of the business
  - Contribute to Scan.com's broader engineering culture through
    interview loops, cross-team design reviews, engineering
    all-hands, and institutional knowledge.

  WHAT YOU MIGHT BRING TO THE TABLE:

  You don't need to tick all the boxes to apply for this role.
  Whether it's your first role or your fifth, we believe
  everyone can add value, learn, and grow. However, these
  might be some of the ways you are currently adding value:

  - Proven experience managing and growing engineering teams.
    You have operated with limited resources, changing
    priorities, and a high bar for individual output, and you
    have thrived in that context.
  - Genuine AI-native fluency: you have deployed AI agents in
    production engineering workflows, you understand
    evaluation frameworks and can design them for non-trivial
    tasks, and you have coached teams to use AI as a primary
    tool.
  - Active technical contributor with strong engineering
    fundamentals. You write production-quality code in at
    least one modern backend or full-stack language, can lead
    a system design discussion at a senior level, and have not
    been out of the code for more than a year
  - Experience in a scaling healthcare technology company is a
    strong plus. Familiarity with the regulatory environment,
    interoperability constraints, and the operational
    complexity of healthcare delivery meaningfully shortens
    the ramp
  - Strong cross-functional instincts: you have partnered
    effectively with Product and Operations, understand how to
    negotiate scope without burning relationships, and can
    represent technical constraints to a non-technical
    audience without losing fidelity
  - A track record of growing engineers. ICs on your previous
    teams have been promoted, expanded their scope, and
    credited you with material development in their careers
  - High ownership orientation: you do not wait to be asked, you
    do not manage up problems without a proposed path forward,
    and you treat the business outcomes of your team's work as
    personally yours

  A VIEW ON OUR CULTURE

  We're building something that matters. Every scan we speed
  up is a real person waiting on an answer, and that urgency
  runs through everything we do. We move fast, we own
  outcomes, and take pride in our output. If you like
  ambiguity, working with ambitious people, and want your work
  to visibly move the needle, you'll feel at home here. To be
  successful at Scan.com you must embody our values.

  HOW WE WILL INTERVIEW YOU

  We keep our interview process short and sweet, and we're a
  nimble team that can progress at pace. Here are the stages
  you can expect, but we might switch up the order of each
  step depending on team availability:

  - Introductory call with our Senior Talent Partner,
    approximately 30 minutes.
  - Video call with a software engineer on the team,
    approximately 60 minutes. This will be a live assessment
    of your technical skill.
  - Assessment stage, which may be a take-home exercise, in-
    person session, or a combination of the two.This will be
    cross functional in nature, and will assess your systems
    design skills along with your ability to evolve a feature
    with your future teammates. We will be mindful of your
    time.
  - Final round with our Chief Technology Officer and Chief
    Product Officer. This round will assess alignment with our
    company values.
  - Offer!

  WHAT WE OFFER

  We go beyond the basics with our benefits package. We
  believe great work starts with supporting our people. Here's
  what you can expect from us:

  - Salary range of $180,000 - $240,000
  - Hybrid work model with 2 days in the office and 3 days
    working remotely each week
  - Dedicated personal development budget
  - Medical, vision, and dental coverage
  - 28+ days of paid time off across PTO and wellbeing days, so
    you can show up at your best
  - Paid parental leave
  - 401k retirement plan
  - All the equipment you need to do your best work
  - Inclusive, people-first policies designed by our team, for
    our team

  DIVERSITY AT SCAN.COM

  Scan.com is committed to eliminating discrimination and
  encouraging diversity within our team. We strive to provide
  equality and fairness for all job applicants and employees
  and never discriminate on the basis of gender, marital
  status, age, race, ethnicity, religion, or physical
  differences.

  We are opposed to all forms of unlawful treatment and
  discrimination.

  Our ambition is for our team to be representative of
  society's diversity, and for every employee to feel
  respected and able to bring their best selves to work.

  If you need an accommodation to apply or interview, contact
  us at people@scan.com.

  We look forward to receiving your application!
