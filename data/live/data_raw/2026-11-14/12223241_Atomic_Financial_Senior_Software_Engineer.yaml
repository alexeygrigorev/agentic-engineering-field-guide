description: |
  Who we are:

  Atomic is building a more connected financial landscape that
  enables consumers to connect their payroll and financial
  data to services that will better their financial lives.

  At Atomic we're focused on building an incredible business
  while also having a huge social impact. We work with 8 of
  the top 10 financial institutions and 13 of the top 20
  neobanks in the country to deliver exceptional user
  experiences and help people manage their money.

  Job description and responsibilities

  We're looking for a Senior Software Engineer to to join our
  team. You'll be building innovative solutions using a
  variety of technologies including Node.js, TypeScript, Vue,
  Temporal, Kubernetes, MongoDB, and AWS. You will play a key
  role in driving the development of high-quality software
  products and features that meet our customers' needs.
  Responsibilities include:

  - Taking ownership of product and feature delivery, developing
    and releasing in a manner that increases deployment
    frequency, reduces cycle time, and failure rate
  - Implementation of large and challenging products and
    features assigned to your team. You'll collaborate with a
    teams of talented engineers, product managers, designers,
    machine learning engineers, and site reliability engineers
    to build products and features for our customers
  - Interfacing with customers to iterate on product design
  - Providing technical leadership for other engineers, ensuring
    their contributions are meaningful to our delivery so that
    they grow as developers
  - Adhere to and potentially expand upon the software, tools
    and libraries we're currently using and ensure we
    implement them in a way that is robust, scalable, secure,
    redundant, and complies with industry best practice

  Qualifications and skills

  - Bachelor's degree in Computer Science or related field
  - Strong communication skills, and be able to work closely
    with both technical and non-technical parts in the
    organization while always increasing clarity and reducing
    ambiguity
  - Strong problem-solving skills and the ability to break down
    the development of products and features into manageable,
    iterative releases.
  - Ability to act with autonomy and self-direction while
    working well in a team environment
  - 5+ years of software development experience, with a strong
    focus on building web applications with Node.js and
    TypeScript
  - Possess a deep understanding of the fundamentals: HTML,
    JavaScript, HTTP/S, client/server architecture, state
    management, and security principles
  - High proficiency with Vue, React, or other Single Page
    Application (SPA) technologies
  - Foundational knowledge of REST API development
  - Experience with document/NoSQL database design and
    optimization
  - Maintain the security of our systems through the development
    and review of secure code, and by applying industry best
    practices
  - Experience with publisher/subscriber models
  - Familiarity with integration and unit testing

  Desirable skills

  - Experience in web scraping, automation, and reconstructive
    analysis
  - Experience integrating with other teams that build
    applications with ML, NLP, or Language Models
  - Experience with developing applications for Temporal, AWS,
    and Kubernetes, and serverless environments
  - Familiarity with Infrastructure-as-Code and pipeline
    development (GitHub Actions, AWS CodePipeline,
    CloudFormation)
  - Experience with an AI workflow, using tools like Claude Code
    or Codex to accomplish work without compromising quality
    or collaboration.

  About Atomic Financial:

  At Atomic, we're building financial connectivity that
  enables the fintech and financial services ecosystem to
  connect consumers to the data in their payroll accounts,
  drive conversions of direct deposit linked products, verify
  income and employment history in real-time, update the card-
  on-file in merchants, and manage their subscriptions and
  bills.

  We believe consumers should be able to easily share their
  own payroll data to improve their financial outcomes.
  However, connecting to the data is cumbersome, met with non-
  specialized solutions, which is why we founded Atomic.

  Signing up for a mortgage? We make it so you can submit your
  paystub and W-2 in seconds. Getting a credit card? We can
  verify you're employed in real-time. Switching banks? We can
  instantly and securely move your direct deposit to the
  financial institution of your choice.

  We build user-permissioned connectivity into payroll and
  merchant systems. Our products are used by some of the
  largest financial brands in the world, and we're funded by
  some of the best investors in the world, including Greylock
  (investor in LinkedIn, Nextdoor, Airbnb, and others), Core
  Innovation Capital (invested in Ripple, Nerd Wallet, and
  others), and Portag3 (invested in WealthSimple, Albert, and
  others).

  Our team has been the reason for our success thus far, and
  it will be the reason we continue to succeed. We're looking
  to continue to grow our world-class team to shape the
  tomorrow of Atomic.

  Atomic's Culture is:

  - Innovative - we're on the bleeding edge of the fintech space
    empowering some of the coolest brands in the world.
  - Transparent - we believe in being transparent with everyone
    in our company. Feel free to ask how we deliver on this
    promise during the interview process.
  - Customer-centric - we're wild about our customers.
  - Fun - We all spend a big portion of our lives with
    colleagues, so we want it to be fun. Our last company
    activity was a virtual escape room. Each team competed and
    we had a blast!

  Atomic is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, or protected veteran
  status and will not be discriminated against on the basis of
  disability.
