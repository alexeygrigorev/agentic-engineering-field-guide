description: |
  No Third PartiesCompany Overview

  Cooperdyne Tech is a leading technology solutions provider,
  dedicated to delivering innovative and transformative
  solutions to the higher education sector. We partner with
  institutions and organizations to modernize delivery
  practices, improve visibility, and implement tools that
  drive measurable outcomes in complex environments.

  Job Title

  Senior Full Stack Developer (.NET)

  Location

  United States (Full Time | Remote Friendly | US Only)

  Role Summary

  Cooperdyne Tech is seeking a Senior Full Stack Developer
  (.NET) to design and build production-grade applications on
  the Microsoft stack. In this client-facing role, you will
  work across the full stack—from data modeling and API
  development to front-end implementation—while contributing
  to architecture decisions, code quality, and delivery
  standards. You take ownership of what you build, communicate
  clearly, and collaborate closely with delivery teams to ship
  reliable software.

  Key Responsibilities

  - Design and develop web applications using .NET 6+ and C#,
    with a focus on clean, maintainable, production-ready code
  - Build and maintain REST APIs and microservices on Azure,
    including authentication/authorization patterns (OAuth)
    and JSON-based integrations
  - Design data models and optimize queries using SQL Server and
    Azure SQL; work with Cosmos DB where appropriate
  - Implement and integrate Azure services such as App Services,
    Azure Functions, Service Bus, and Key Vault
  - Participate in code reviews, contribute to technical
    standards, and help improve engineering practices across
    teams
  - Collaborate with product owners and TPMs on sprint planning,
    backlog refinement, and delivery commitments
  - Write unit, integration, and end-to-end tests as a normal
    part of delivery
  - Support CI/CD pipeline setup and maintenance using Azure
    DevOps

  Required Qualifications

  - US Citizen or Green Card holder (required)
  - 5–7+ years of full stack development experience in a US-
    based environment (required)
  - Strong C# and .NET experience delivering and supporting
    production applications (.NET 6+ preferred)
  - Front-end proficiency with React, Angular, or Blazor,
    including building modern, maintainable UI components
  - Hands-on experience building and consuming REST APIs; strong
    understanding of JSON and OAuth-based security
  - Solid SQL skills, including schema design and query
    optimization; experience with Azure data services (Azure
    SQL and/or Cosmos DB)
  - Working knowledge of Azure cloud infrastructure and common
    deployment patterns for web apps and services
  - Experience working in Agile environments and using Azure
    DevOps for boards, backlogs, and sprint execution
  - Strong problem-solving skills and clear written
    communication, especially in client-facing contexts

  Preferred Qualifications

  - Experience with containerization and orchestration (Docker
    and Kubernetes on Azure)
  - Azure Developer or Azure Solutions Architect certification
  - Exposure to healthcare, financial services, or other
    regulated industries
  - Familiarity with GraphQL and/or gRPC

  What Success Looks Like

  - You deliver production-grade features end-to-end, from data
    model to API to UI, with strong quality and
    maintainability
  - APIs and services are secure, observable, and reliable, with
    clear contracts and well-tested behavior
  - Azure resources are implemented using sound patterns
    (secrets in Key Vault, messaging via Service Bus, scalable
    hosting on App Services/Functions)
  - CI/CD pipelines support consistent releases with automated
    testing and predictable deployments
  - Stakeholders have clarity on progress, tradeoffs, and next
    steps through strong collaboration in Agile ceremonies
  - You raise the bar on code quality and standards through
    reviews, documentation, and pragmatic technical leadership
