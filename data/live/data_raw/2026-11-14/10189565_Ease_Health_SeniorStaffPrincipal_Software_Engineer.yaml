description: |
  Senior/Staff/Principal Software Engineer - Ease Health

  Location: New York City Experience: 3+ years

  About Ease

  Ease is transforming behavioral health through AI automation
  and vertical integration. We're building the operating
  system for behavioral health - combining EHR, RCM
  automation, and AI-native products into a unified platform
  that actually works for providers and patients.

  We've just closed a $37M Series A led by a16z and have
  millions in ARR (profitable). Our founding team include
  repeat founders with 1.15B+ exits.

  The Role

  We're looking for experienced full-stack engineers to build
  the future of behavioral health technology. You'll be
  working on:

  - AI-powered RCM automation that expands margins from 10% to
    60%
  - Modern EHR features including AI scribes, intake automation,
    and clinical analytics
  - Data pipelines processing claims and clinical records

  You Should Have

  - 3+ years of software engineering experience
  - Strong full-stack software engineering skills
  - Experience with or interest in healthcare technology
    (preferred but not required)

  What We Offer

  - Meaningful equity
  - Competitive base salary - we believe in compensating talent
    properly
  - Real impact - your code will directly improve mental health
    access for millions
  - Work-life balance - this is hard work at an early stage, but
    we don't do 996. We work smart and sustainably.
  - World-class team - join engineers from great companies
    who've chosen to build something meaningful

  Why Now?

  The behavioral health market is massive ($141B), fragmented,
  and desperately needs modern technology. We're building an
  agentic EHR in a greenfield market, starting with proven
  assets and real revenue rather than hoping for product-
  market fit.

  If you want to build AI that actually ships to production,
  work on challenging technical problems, and transform an
  industry that matters, we'd love to talk.
