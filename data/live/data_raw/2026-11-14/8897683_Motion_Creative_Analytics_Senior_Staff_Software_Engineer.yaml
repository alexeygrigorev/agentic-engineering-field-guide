description: |
  About Motion 💡

  Motion is building the command center for creative
  strategists: an AI-native platform that bridges the gap
  between performance marketers and creative teams, so they
  can uncover what’s working, what’s not, and ship more
  winning ads across platforms like YouTube, LinkedIn, Meta,
  and TikTok.

  ⁠

  We're at the forefront of AI as the foundation of our
  product. Motion now automatically analyzes and organizes
  creative at scale and surfaces competitor trends. And with
  Runneth - the AI brain for the 100x marketer - we're going
  further: a persistent creative strategy agent that lives
  where your team already works (Slack, Notion, Google Drive,
  your ad data) and turns a marketer's knowledge and instincts
  into cross-channel playbooks, automated workflows, and a
  system that gets smarter over time. Our bet isn't that AI
  replaces great marketers. It's that the best marketers will
  use AI to operate at a scale that wasn't previously
  possible.

  ⁠

  Today, Motion is trusted by some of the world’s top
  e-commerce and direct-to-consumer brands and agencies
  (including Vuori, True Classic, The Farmer’s Dog, and
  HexClad) and has analyzed over $14B in media spend. When
  leading brands want to understand their creative
  performance, they turn to us.

  Our founders have built successful companies before,
  including alongside several of the people now at Motion. A
  number of teammates chose to build again here — a reflection
  of the trust, culture, and conviction behind what we’re
  building.

  The people building Motion are deeply embedded in where AI
  and our industry is heading, and obsessed with closing the
  gap between what's possible and what's actually shipping in
  product. We're a 75 person remote team backed by $65M+ in
  funding with a valuation that's nearly 3x'd in under two
  years. If you want to work on a hard problem, with people
  who've done it before, and a product that customers
  genuinely love - we'd love to connect!

  ▶️ Brief overview of the Motion product & Runneth from our
  Co-Founder & CEO, Reza Khadjavi.

  About the Senior Software Engineer role 🔍

  As a Senior Software Engineer, you'll work across the stack:
  building features, designing and maintaining the APIs and
  services behind them, and increasingly building the AI-
  powered parts of the product.

  Engineering at Motion is roughly three teams: Platform
  (cloud infra, DBs, centralised services and APIs), Harness
  (our agentic harness Runneth, the VM it runs on, and the
  primitives that the Runneth experience is built on), and
  Runneth itself (everything customer-facing). Where you land
  depends on what we need most when you start and where you’re
  able to contribute the most impact. What we do know: you'll
  be building AI-powered features across the product, and
  you'll own what you ship.

  | Our tech stack: React, Node.js with Express, TypeScript,
  GraphQL, PostgreSQL, MongoDB, and Azure.

  - 🔗 Explore our Engineering at Motion page to learn more about
    our team, our work, and how we build together.
  - 👩‍💻 Browse our Engineering Blog for an inside look at the
    decisions our team is making, the things we're learning,
    and what it means for us to be building an AI product
    today.

  What you'd be doing 🛠️

  - Scoping, designing, and shipping features end to end:
    understand the problem, make the calls, build it,own the
    outcome.
  - Building AI features across the product, and the APIs and
    services that support them.
  - Keeping our systems fast and reliable: integrations, data at
    scale, performance, and the devex problems in-between.
  - Working on a small, high-ownership team that ships
    constantly.
  - AI coding as the default, while holding what the LLMs
    produce to the same standard as code you wrote by hand.

  Our ideal fit brings ✨

  - 7+ years of experience building and maintaining software
    with customer traction
  - A track record of shipping things people use.
  - Strong proficiency in a modern web stack. We run on React,
    TypeScript, and Node.js and TS proficiency is a must. But
    if your core skill is in another language, we can still
    chat.
  - Real depth somewhere in the stack, you’re an expert at
    something. We'll ask you about an initiative or feature
    that you personally owned and built.
  - Mastery of an AI-assisted development workflow
  - Exceptional communication skills, you can explain the
    architecture of something you shipped, and what you'd
    change with hindsight.
  - , You are able to translate complex technical issues into
    clear feature and prioritisation with business impact. .
  - Any background: self-taught, bootcamp, degree, founder. We
    love talent from everywhere!

  ...and you'll be a strong fit if you align with these
  qualities:

  - A strong sense of ownership: you make decisions, stand
    behind them, and fix things quickly when they're wrong.
  - A pragmatic mindset. You optimize for impact over
    perfection, care more about shipping real customer value
    than polishing every edge, and improve things over time.
  - Comfort thriving in a fast-moving startup where requirements
    are ambiguous, shift quickly, and clarity isn't handed to
    you, you create it.
  - You enjoy being a strong individual contributor and a
    supportive teammate. Engineering is a team sport here! 💪

  You're probably not the right fit if

  - You do your best work with structure: a defined spec, a
    predictable calendar, 2 week sprint cycles
  - You struggle to context switch: You can only handle one
    focus at a time, switching between live issues and your
    work is frustrating, you tend to ignore Slack.
  - You want a steady, predictable pace: a roadmap that's set in
    advance and stays the course.
  - You're looking for a leadership role or a specific title
  - You're cautious or sceptical about AI, in general or as part
    of engineering. We're betting hard on agentic coding being
    the future; if that feels like a mandate rather than an
    unlock, it won't be a fit.

  How to apply 📬

  We keep a high bar for talent and get a lot of applicants,
  so we ask for a little more up front.

  Along with your resume, send a short Loom that covers:

  - Something you built that you're proud of, and which parts
    you personally wrote
  - How AI fits into your day-to-day workflow
  - Why Motion?

  What you'll love about Motion 💜

  - Competitive compensation package: We offer competitive
    compensation, including equity for all employees, health
    benefits from day one, a monthly health & lifestyle
    stipend to support your well-being, 20 days of PTO, and a
    $1,500 work-from-home stipend.
  - Remote-first with hybrid flexibility: We're a remote-first
    company with team members spanning Canada, the U.S., and
    beyond, but also have office spaces in 4 main hubs
    (Toronto, Montreal, Vancouver, and Porto) for optional
    hybrid work.
  - Growth that speaks for itself: Motion has strong product-
    market fit, 2.5x YoY growth, second-time founders with
    deep industry knowledge, and $65M in funding to fuel our
    momentum.
  - Opportunity for impact: As an early team member, your
    contributions will directly shape the product, team, and
    the future of the company. If you're excited about
    building, you’ll thrive here!
  - Award-winning team: We're a low-ego, high-performing team
    that was just ranked #19 on G2's list of Best Canadian
    Software Companies for 2026.
  - Team connection:
    - Virtual: Day-to-day, we use Roam, an AI-powered virtual
      office platform that fosters spontaneous collaboration,
      drop into meetings or quick chats, and interact with
      colleagues for a simulated, "live" digital headquarters.
    - In-person: Outside of the option to go to one of our
      offices, our team gets together in-person for a week
      every two months, and we have a company retreat every
      summer.

  We closed out 2024 with a $30M Series B raise and strong
  signals from our customers. In 2025, we built the
  foundational capabilities our customers rely on, setting the
  stage for what's to come. In 2026, with fresh funding ($65M+
  total capital raised), we’re building forward from that
  foundation, taking what we learned to market in a deeply AI-
  native way.

  We use artificial intelligence (AI) in certain parts of our
  recruiting process at Motion, ranging from administrative
  and efficiency-focused support to, in some cases, conducting
  introductory interviews. Every AI interview is reviewed, and
  every hiring decision is made, by a (human) member of our
  team.
