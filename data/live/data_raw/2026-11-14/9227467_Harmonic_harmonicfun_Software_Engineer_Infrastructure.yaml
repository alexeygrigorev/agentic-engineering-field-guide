description: |
  About Harmonic

  At Harmonic, we believe the future of AI depends on proof.
  Most AI makes its best guess. Aristotle uses formal methods
  and reinforcement learning to check its own reasoning and
  results.

  AI agents can write software in seconds, but edge cases and
  silent bugs still get through. We're building the
  verification engine to find them before code ships. With
  support for C and Verilog, Aristotle is built for the
  hardware and software where failure is expensive.

  Backed by some of the world’s most prominent investors, we
  are intentionally scaling an elite technical team.

  Try Aristotle for yourself here!

  About the Role

  We are seeking a talented Software Engineer to build
  infrastructure systems from scratch, bridging the gap
  between our research and product development. In this role,
  you will develop robust, scalable software systems behind
  our product based on the discoveries and advancements in AI
  from our researchers. We are looking for a problem-solver
  that has experience working on complex, distributed systems
  and are passionate about advancements in AI and software
  development.



  Key Responsibilities

  - Collaborate with AI research scientists to translate state-
    of-the-art research into practical, scalable software
    infrastructure
  - Participate in the entire software development lifecycle
    including: requirement analysis, design, coding, testing,
    reviewing, deployment, and support
  - Ensure the scalability, efficiency, and reliability of
    software systems through the entire development lifecycle
  - Write clean, efficient, and well-documented code
  - Work cross-functionally with product managers, designers,
    and other engineering teams to deliver high-quality
    product

  Minimum Qualifications

  - BS in Computer Science, Engineering, or a related field
  - 2+ years of relevant industry experience
  - Proficiency in one or more programming languages (e.g.,
    Python, C++, etc)
  - Experience building, scaling, and maintaining large-scale
    distributed systems
  - Experience with modern software development practices
    including coding standards, code reviews, source control
    management, build and deployment processes, and testing.
  - Proven track record operating successfully in a fast-paced,
    collaborative environment

  Preferred Qualifications

  - MS or PhD degree in Computer Science, Engineering, or a
    related field.
  - 5+ years of relevant industry experience
  - Prior experience in developing products from concept to
    launch
  - Experience with building core cloud technologies including:
    infrastructure, security, platforms and services (e.g.,
    AWS, Azure, GCP, Kubernetes, etc)

  What We Offer

  - Unlimited PTO
  - 401(k) matching
  - 100% employer-paid health, vision, and dental benefits for
    employees and 50% coverage for dependents. Harmonic offers
    varied health coverage options to select what is best for
    you and your family.
  - Health Savings Account (HSA) available for qualifying health
    plans

  Equal Opportunity Statement

  Harmonic is committed to diversity and inclusivity in the
  workplace. We are an equal opportunity employer and do not
  discriminate on the basis of race, religion, national
  origin, gender, sexual orientation, age, veteran status,
  disability or any other legally protected status.
