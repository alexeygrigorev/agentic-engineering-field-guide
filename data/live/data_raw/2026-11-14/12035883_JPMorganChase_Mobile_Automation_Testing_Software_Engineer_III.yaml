title: Mobile Automation Testing Software Engineer III
company: JPMorganChase
location: New York, USA
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  We have an exciting and rewarding opportunity for you to
  take your software engineering career to the next level.


  As a Mobile Automation Testing Software Engineer III at
  JPMorganChase within the Consumer and Community Bank-
  Business Banking, you serve as a seasoned member of an agile
  team to design and deliver trusted market-leading technology
  products in a secure, stable, and scalable way. You are
  responsible for carrying out critical technology solutions
  across multiple technical areas within various business
  functions in support of the firm’s business objectives.

  Job responsibilities

  - Executes standard quality engineering solutions including
    test planning, test design, manual testing, test
    automation, defect triage, and test reporting for iOS and
    Android mobile applications
  - Creates and maintains clear test cases, test charters, and
    regression suites with traceability to requirements and
    acceptance criteria
  - Develops and maintains automated tests (unit/integration/UI)
    and contributes to CI pipelines to provide fast, reliable
    quality signals
  - Performs technical troubleshooting to isolate issues,
    reproduce defects, analyze logs/crash reports, and
    communicate root cause hypotheses to engineering partners
  - Tests with consideration of upstream/downstream services,
    APIs, data dependencies, and environment impacts
    (including mocking/stubbing where appropriate)
  - Collaborates within an agile team to shift testing left,
    improve Definition of Done, and continuously enhance test
    coverage and reliability
  - Leverages enterprise-authorized AI coding assist tools
    within the work environment to improve code quality,
    delivery speed, and productivity across complex
    deliverables (e.g., code generation/refactoring, unit test
    creation, documentation), while validating outputs through
    peer review, automated testing, and secure coding
    standards; contributes learnings and reusable patterns to
    improve broader team effectiveness.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.

  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 3+ years applied experience
  - Strong experience in Quality Engineering / QA, including
    hands-on mobile application testing across iOS and Android
    and demonstrated experience performing both manual testing
    (functional, regression, exploratory) and automated
    testing for mobile applications
  - Working proficiency with Android Studio and Xcode for
    building/running apps, inspecting logs, debugging, and
    working with simulators/emulators
  - Experience with mobile automation frameworks/tools (examples
    include Appium, Espresso, UIAutomator, XCUITest, XCTest;
    equivalent frameworks acceptable)
  - Ability to design effective test strategies across layers
    (UI, API/service, integration) and select the right
    automation level for stability and ROI
  - Experience testing modern mobile app architectures and
    patterns (e.g., MVC/MVVM) and understanding of how they
    impact testability
  - Strong knowledge of CI/CD concepts and experience
    integrating automated tests into pipelines (e.g., Jenkins,
    GitHub Actions, Bitrise or similar), including proficiency
    with Git source control and collaboration workflows (PR
    reviews, branching strategies, etc.)
  - Solid understanding of mobile security and authentication
    fundamentals (e.g., OAuth2/OIDC/PKCE, biometrics, secure
    storage) sufficient to validate expected behaviors and
    identify risks
  - Strong analytical skills: able to gather information from
    logs, device signals, and test results to diagnose and
    communicate issues clearly
  - Hands-on experience using enterprise-authorized AI-assisted
    software development tools within the work environment
    (e.g., for coding, test creation, troubleshooting, or
    documentation) with demonstrated ability to critically
    evaluate, validate, and refine AI-generated outputs for
    correctness, performance, and security.
  - Understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; ability to guide
    peers on safe and effective usage within team practices.

  Preferred qualifications, capabilities, and skills

  - Experience building or contributing to a mobile test
    automation framework (page/screen object model, test data
    strategy, reporting, flake reduction)
  - Experience validating Accessibility on mobile and knowledge
    of WCAG and Apple/Android accessibility expectations
  - Experience with Design Systems and UI component libraries
    (including validation of consistency and theming/white-
    labeling)
  - Experience with API testing tools and practices (e.g.,
    Postman, contract testing, service virtualization) in
    support of mobile testing

