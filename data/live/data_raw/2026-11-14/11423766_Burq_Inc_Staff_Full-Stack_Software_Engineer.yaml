description: |
  About Burq

  Burq started with an ambitious mission: to turn the complex
  process of offering delivery into a simple, turnkey
  solution. It’s a big mission, and now we want you to join us
  in making it even bigger. 🚀

  We’re proud to be recognized as one of Fast Company’s Best
  Workplaces for Innovators and a 2025 Inc. Magazine Power
  Partner, awards that highlight how we’re redefining the
  future of logistics while empowering our partners to grow.

  Backed by leading Silicon Valley investors like Village
  Global, the fund whose investors include Bill Gates, Jeff
  Bezos, Mark Zuckerberg, Reid Hoffman, and Sara Blakely,
  we’ve built a world-class team across the globe.

  We operate at scale but remain small enough for every person
  to have a massive impact. There’s a lot of important work
  ahead, and joining Burq means the opportunity to grow faster
  than ever while doing the most meaningful work of your
  career.

  We're looking for a Full-stack Engineer who takes ownership
  of problems end to end and raises the bar for the team
  around them. You'll build the APIs, integrations, and
  product surfaces that enterprise retailers use to run
  delivery through Burq, from the first design conversation
  through production and beyond.

  This is a high-impact role for someone who doesn't wait to
  be told what to do next. You'll spot what's broken or
  missing, propose the fix, ship it, and make sure it stays
  working. As we bring on large enterprise customers, much of
  your work will be integration-heavy: connecting Burq to
  customer systems, hardening our APIs and webhooks, and
  making sure everything holds up under real operational load.

  You'll also work AI-native, using AI tools daily to move
  faster, debug smarter, and take on problems most people
  would escalate and wait on.

  Here’s a quick overview of what you will be doing:

  What you'll do

  - Own the design, implementation, and delivery of complex
    features across our backend services and web applications
  - Build and maintain REST APIs and webhooks that enterprise
    customers integrate against, with a high bar for
    reliability, security, and clear documentation
  - Lead integrations from technical scoping through go-live,
    working directly with Product, Success, and customer
    engineering teams
  - Use data and customer feedback to improve the Burq Dashboard
    so operators can run mission-critical deliveries quickly
    and without friction
  - Take ownership of production quality: monitoring, incident
    response, root-causing issues, and making sure they don't
    happen twice
  - Raise the team's standards through code reviews, technical
    design input, and mentoring, and improve our practices in
    engineering, security, and design
  - Use AI tools day to day for development, testing, and
    debugging as a core part of how you work

  Requirements

  - Nice to have

  Benefits

  Investing in you 🙏

