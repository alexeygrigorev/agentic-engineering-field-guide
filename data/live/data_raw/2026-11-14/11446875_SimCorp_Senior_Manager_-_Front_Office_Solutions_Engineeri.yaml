description: |
  WHAT MAKES US, US

  Join some of the most innovative thinkers in FinTech as we
  lead the evolution of financial technology. If you are an
  innovative, curious, collaborative person who embraces
  challenges and wants to grow, learn and pursue outcomes with
  our prestigious financial clients, say Hello to SimCorp!

  At its foundation, SimCorp is guided by our values — caring,
  customer success-driven, collaborative, curious, and
  courageous. Our people-centered organization focuses on
  skills development, relationship building, and client
  success. We take pride in cultivating an environment where
  all team members can grow, feel heard, valued, and
  empowered.

  If you like what we’re saying, keep reading!

  WHY THIS ROLE IS IMPORTANT TO US

  We are looking for a Senior Manager to lead our Americas
  Front Office Solutions Engineering team. The Front Office
  Solutions Engineering (“PreSales”) team is focused on multi-
  asset class front-office workflows (portfolio management,
  valuation and optimization, compliance, risk management, and
  trading) to showcase our investment platform capabilities to
  prospective and existing clients across the buy-side.

  You will work closely with the sales teams and guide them to
  make optimal decisions about their approach to opportunities
  and explain how SimCorp supports the newest industry trends.
  You will be a key liaison with product teams on providing
  market feedback and staying up-to-date on the many new
  developments being built within the platform. You will
  coordinate with teams across the globe for shared
  intelligence and assistance on deals where required subject
  matter expertise resources sit globally.

  WHAT YOU WILL BE RESPONSIBLE FOR

  - Managing a high performing Solution Engineering team.
  - Allocate the front office technical presales resources for
    each business growth opportunity.
  - Development of team capabilities and ensuring the right
    career paths to create a robust presales organization.
  - Cultivate high employee engagement and a common culture
    or ‘sense of belonging’ to the business.
  - Developing, implementing and maintaining presales tools,
    processes and methodologies.
  - Participate in deal reviews and opportunity qualification
    with the sales teams using established sales best
    practices.
  - Developing presales intelligence to support ongoing
    improvement and efficiency efforts.

  WHAT WE VALUE

  - 15+ years of experience in investment management within the
    financial services industry, with 5+ years of experience
    leading teams.
  - Knowledge insights into the buy-side technology industry and
    its structure, trends and hurdles. Ability to understand
    and showcase the buyside trade lifecycle from Front to
    Back.
  - Prior experience in front office buy-side technology and
    trading tools. Domain knowledge within the Front Office
    (Trading, EMS, OMS, PMS, Compliance, Performance, & Risk.
  - Familiarity with all asset classes including fixed income,
    equities and derivatives across public and private markets
    is essential.
  - Knowledge across the various types of financial instruments
    from vanilla public securities to esoteric derivatives to
    complex structured instruments.
  - Excellent presentation and communication (both written and
    oral) skills are essential.
  - Empathy driven relationship builder, able to collaborate
    both cross functionally within SimCorp's employee base as
    well as with prospects, clients and external partners.
  - Capability to handle multiple engagements, tasks, and
    projects with tight deadlines efficiently.
  - Creating and delegating tasks to further the development of
    individual employees within the team.
  - Willingness to travel as required.
  - Flexibility to work remotely up to 2 days per week per our
    hybrid policy

  BENEFITS

  Attractive salary and bonus scheme are essential for any
  work agreement. However, at SimCorp we believe we can offer
  more. Therefore, in addition to the traditional benefit
  scheme, we provide a good work and life balance: flexible
  working hours and a hybrid model - working from SimCorp's
  office two days a week. And opportunities for professional
  development: there is never only one route - we offer a
  personal approach to professional development to support the
  direction you want to take. Visit our career pages to learn
  more about working at SimCorp.

  NEXT STEPS

  Please send us your application in English via our career
  site as soon as possible, we process incoming applications
  continually. At SimCorp, we recognize that bias can
  unintentionally occur in the recruitment process. To uphold
  fairness and equal opportunities for all applicants, we
  kindly ask you to exclude personal data such as photo, age,
  or any non-professional information from your application.
  Thank you for aiding us in our endeavor to mitigate biases
  in our recruitment process. If you are interested in being a
  part of SimCorp but are not sure this role is suitable,
  submit your CV anyway.

  SimCorp is on an exciting growth journey, and our Talent
  Acquisition Team is ready to assist you discover the right
  role for you. The approximate time to consider your CV is
  three weeks.

  SimCorp welcomes and encourages applications from people
  with disabilities. Accommodations are available upon request
  for candidates taking part in all aspects of the selection
  process. Candidates who require accommodation during the
  recruitment process should contact the People & Culture team
  at PeopleandCultureAmericas@simcorp.com.

  WHO WE ARE

  For over 50 years, we have worked closely with investment
  and asset managers to become the world's leading provider of
  integrated investment management solutions. We are 4,000+
  colleagues with a broad range of nationalities, educations,
  professional experiences, ages, and backgrounds.

  SimCorp is an independent subsidiary of the Deutsche Börse
  Group. Following the recent merger with Axioma, we leverage
  the combined strength of our brands to provide an industry-
  leading, full, front-to-back offering for our clients.

  SimCorp is an equal opportunity employer and welcome
  applicants from all backgrounds, without regard to race,
  gender, age, disability, or any other protected status under
  applicable law. We are committed to building a culture where
  diverse perspectives and expertise are integrated into our
  everyday work. We believe in the continual growth and
  development of our employees, so that we can provide best-
  in-class solutions to our clients.

  Please note: Only applications sent through our system will
  be processed.

  #Li-Hybrid

  For New York City only: The salary range for this position
  is $200,000 - $270,000 USD. Additionally, employees are
  eligible for an annual discretionary bonus, and benefits
  including health care, leave, and retirement plans. Your
  total compensation may vary based on role, location,
  department and individual performance.
