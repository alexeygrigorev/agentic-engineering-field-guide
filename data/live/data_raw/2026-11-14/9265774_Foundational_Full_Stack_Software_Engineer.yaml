description: |
  About us

  Foundational is building the most precise picture of Earth
  and orbit, using lasers fired from the ground. We call it
  ground truth for orbit.

  We design and run low-cost, autonomous satellite laser
  ranging stations. They measure the distance to satellites
  with extreme precision, day and night. Our data platform
  turns those measurements into tracking data and orbit
  products for satellite operators, space agencies and
  governments. We also build our own flight-proven laser
  retroreflector arrays, so any satellite can be tracked.

  Our station network is expanding across continents. The data
  supports resilient navigation, Earth observation and the
  safe, sustainable use of space.

  We're a small, fast-moving team of engineers, scientists and
  operators in London. We're backed by venture investors and
  supported by ESA, the UK Space Agency, and Innovate UK.

  What You'll Be Doing:

  - Designing, developing, and deploying scalable and robust
    SaaS applications using Python, React and modern AWS cloud
    services.
  - Building and maintaining both the frontend and backend of
    our core product, ensuring seamless user experiences and
    high performance.
  - Implementing DevOps practices to streamline development
    workflows, automate deployments, and ensure continuous
    integration and continuous delivery (CI/CD).
  - Collaborating closely with the product team to translate
    user needs and business requirements into innovative and
    user-friendly features.
  - Writing clean, maintainable, and well-documented code,
    adhering to best practices and industry standards.
  - Troubleshooting and resolving technical issues, ensuring the
    smooth operation of our platform.
  - Staying up-to-date with the latest technologies and trends
    in web development, DevOps, and the space industry.
  - Growing with us! As an early team member, you'll have the
    opportunity to contribute to all aspects of the
    development process and make a real impact on our product
    and company culture.

  What We're Looking For:

  - Proven experience as a Full Stack Developer, with a strong
    portfolio showcasing your skills in both frontend and
    backend development.
  - Solid understanding of DevOps principles and experience with
    cloud platforms (AWS, Azure, GCP)
  - Proficiency in front end e.g., React, Angular, Vue.js and
    frameworks such as e.g., Node.js or FastAPI.
  - Experience with databases such as MongoDB and MySQL.
  - Familiarity with API design and development, including
    serverless technologies, e.g. AWS ECS/API Gateway/Lambda.
  - A passion for space technology and a genuine interest in the
    space sector (desirable, but not essential).
  - A proactive, problem-solving attitude and a desire to learn
    and grow in a fast-paced startup environment.
  - Excellent communication and teamwork skills.
  - The ability to work independently and take ownership of your
    projects.
  - A strong desire to make a tangible difference and help build
    something extraordinary.

  Bonus Points (We'd love it if you have...)

  - Experience with containerisation technologies, e.g. Docker,
    Kubernetes.
  - Contributions to open-source projects.
  - Familiarity with space situational awareness, space domain
    awareness or other ground-based space sensors (optical,
    RF, etc.)

  What We Offer

  - A high-impact role with genuine ownership and autonomy.
  - EMI options in a fast-growing VC backed startup in the
    spacetech industry
  - Generous compensation and pension contributions
  - Offices in central London right in the heart of Borough and
    London Bridge with snacks, tea, coffee and regular
    socials.
