description: |
  Senior Backend Engineer - UK Timezone (within +/- 2 hours)

  Live shows make us feel good. They’re a time to hang with
  our friends, discover new artists or lose ourselves on a
  dancefloor. We’re on a mission to bring all of this to more
  fans, more often – and that’s where you come in.

  We’re looking for a Senior Backend Engineer to join our
  Engineering team and drive exceptional product development
  for fans, venues and artists.

  At DICE, you’ll be part of the company that’s redefining
  live entertainment. It’s a place where you can be yourself,
  influence the culture, and create work that you’re proud of.

  About the role

  DICE is scaling fast, and we’ve got ambitious goals for our
  platforms. As a Senior Backend Engineer, you will play a
  pivotal role in architectural decisions, helping define not
  just what we build, but how it scales.

  Our backend apps are written mostly in Elixir. They feed
  information to our award-winning apps via GraphQL and REST
  APIs, and handle millions of ticket-sale transactions. We
  host our code on GitHub, manage pipelines with Drone CI, and
  deploy to Kubernetes clusters.

  We are always open to improving our workflow and codebase,
  and we'll look to you to champion those improvements for the
  benefit of the team and product.

  You’ll be

  - Architecting and developing complex, high-load backend
    systems written in Elixir.
  - Leading technical discussions with Product Managers,
    Engineers, and Designers to turn vague requirements into
    robust technical specifications.
  - Mentoring mid-level and junior engineers, conducting code
    reviews, and fostering a culture of technical excellence.
  - Proactively identifying bottlenecks in our ticketing and
    event management systems and designing scalable solutions
    to handle traffic spikes.
  - Championing best practices in testing, documentation, and
    maintainability across the engineering organisation.

  You are

  - A technical leader who enjoys sharing knowledge and
    uplifting the team.
  - Passionate, humble and talented.
  - A fan of music and culture.
  - Actively responsible and ownership-driven; you don't just
    write code, you own the outcome in production.
  - Pragmatic about technical debt versus feature delivery.
  - Eager to build apps that make a positive impact.
  - A great communicator.

  You’ll need

  - Extensive production experience with Elixir, OTP, and
    Phoenix (or deep expertise in another functional language
    with a willingness to master Elixir quickly).
  - A strong track record of designing and developing
    distributed systems at scale.
  - Experience integrating complex third-party services and
    gracefully handling failure scenarios.
  - Deep understanding of database internals (PostgreSQL/Redis)
    and query performance optimisation.
  - Deep understanding of how OSes and Linux work internally.
  - Experience mentoring other engineers and influencing
    technical decisions within a team.

  About DICE

  DICE is based throughout Europe, North America, Australia
  and India, and is rapidly growing worldwide. We’re
  constantly innovating to bring amazing products to fans,
  artists, venues and promoters.

  We know that having a variety of perspectives makes us a
  better company – it's why we strongly encourage members of
  underrepresented communities to apply. Find out how we're
  creating a more diverse, equitable and inclusive DICE.

  Application process

  We want the process to be as straightforward and enjoyable
  as possible. You’ll have the chance to get to know DICE,
  meet the people you’d be working with, and show us how you
  approach problems. Here’s what you can expect:

  - Talent Interview - 1h: An intro to DICE, our culture and the
    role, as well as a conversation about your background and
    experience.
  - Technical Interview - 2h: A chance to dig into your
    technical experience through a system design discussion
    and a short coding exercise. We’re interested in how you
    think, approach problems and make decisions, and there’ll
    be plenty of time for you to ask questions about the team
    and day-to-day work at DICE.
  - Manager Interview - 1.5h: A conversation about how you work,
    communicate and make decisions. We’ll talk through how you
    approach trade-offs, take ownership, measure impact, and
    think about reliability, scale and system design.

  We’ll keep you updated throughout the process and make sure
  you know what to expect at each stage.

  For information on how we use your data, please view our
  Candidate Privacy Policy.

  We may use AI-assisted tools to help analyse skills and
  experience. These systems function solely as decision-
  support tools; they do not autonomously reject candidates or
  make final hiring decisions. Every application is subject to
  meaningful human oversight, with every hiring decision
  through the process being made by humans

  If you would like more information about how your data is
  processed, please contact us.
