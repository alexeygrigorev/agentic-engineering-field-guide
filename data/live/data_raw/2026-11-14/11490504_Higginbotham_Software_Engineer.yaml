description: |
  Fortress Affinity Management is Higginbotham’s standalone
  affinity insurance platform — purpose-built to turn group
  relationships into scalable, recurring insurance programs.
  FAM provides the complete infrastructure needed to support
  these programs, including digital intake systems, member
  portals, and dedicated service teams, all aimed at reducing
  friction and improving results for both producers and their
  clients.

  Position Summary: The Software Engineer’s role is to design,
  execute, assess, and troubleshoot software programs and
  applications. This includes configuring, coding, developing,
  and documenting software specifications throughout the
  project life cycle. The Software Engineer will also oversee
  system startups in a timely and accurate fashion and provide
  support to other departments where required.

  Supervisory Responsibilities:  None

  Essential Tasks:

  Strategy & Planning

  - Collaborate with analysts and designers in the development
    and initiation of new software programs and applications.
  - Oversee the quality assurance of program logic, data
    processing, and error resolution.
  - Develop an awareness of programming and design alternatives.
  - Take an active role in cross-departmental projects when
    needed.
  - Direct research on emerging application development software
    products, languages, and standards in support of
    procurement and development efforts.
  - Interact regularly with managers, clients, vendors, and
    agencies to field queries and questions.

  Operational Management

  - Research, document, and implement program requirements and
    specifications.
  - Consistently write, translate, and code software programs
    and applications according to specifications.
  - Run and monitor performance tests on new and existing
    software for the purposes of correcting mistakes,
    isolating areas for improvement, and general debugging.
  - Administer diagnostic analysis of test results and deliver
    solutions to critical areas.
  - Cultivate and disseminate knowledge of application
    development best practices.
  - Gather statistics and prepare and write reports on the
    status of the programming process for discussion with
    management and/or team members.
  - Determine, develop, and maintain user manuals and
    guidelines.
  - Install software products for end users as required.
  - Liaise with the company’s software and hardware suppliers
    for prompt rectification of any problems or emergencies.
  - Liaise with network administrators, systems analysts,
    programmers, and other software engineers to resolve any
    defects in products or company systems.
  - Recommend, schedule, and perform software improvements and
    upgrades for optimal performance of company workstations.
  - Train, manage and provide guidance to junior software
    development staff.

  Core Competencies:

  - Ability to Analyze and Solve Problems: Skill in recognizing
    challenges, exploring options, and implementing effective
    solutions in a timely manner
  - Attention to Detail: A strong focus on completing tasks and
    projects accurately and thoroughly
  - Communication Skills: Capable of expressing ideas clearly in
    both verbal and written forms and engaging with various
    audiences
  - Timely Task Completion: Ability to finish tasks and projects
    efficiently, managing resources and priorities effectively
  - Team Collaboration: Willingness to work together with
    others, promoting teamwork and supporting shared goals
  - Client Focus: Dedication to understanding and addressing the
    needs of clients and stakeholders to ensure their
    satisfaction
  - Dependability: Acknowledgment of the importance of being
    present and punctual.
  - Creative Thinking: Openness to suggesting new ideas and
    methods to improve processes and outcome
  - Organizational Skills: Capability to prioritize tasks and
    manage multiple projects simultaneously
  - Adaptability: Willingness to adjust to changing situations
    and priorities, showing resilience in a dynamic work
    environment

  Experience and Education:

  - College degree in Software Engineering or Computer Science
    or equivalent experience
  - 5+ years relevant work experience
  - Hands-on software troubleshooting

  Licensing and Credentials:

  - None

  Systems:

  - Proficient with Microsoft Excel, Word, PowerPoint, and
    Outlook
  - Fluent in programming languages/frameworks; C#, Blazor,
    Mudblazor, JavaScript, HTML 5, CSS 3, T-SQL, and Bootstrap
  - Extensive database and operating systems experience with MS
    SQL Server, MS IIS Server, and MS Windows Server.
  - Experience with AI-assisted development tools (e.g., Claude
    Code, GitHub Copilot, etc.) is a plus.
  - Competent and proficient understanding of platforms such as
    Visual Studio, MS DevOps, Git, MS SSRS, MS SSIS, and
    Entity Framework.
  - Solid working knowledge of internet technologies, including
    REST APIs, SOAP APIs, JSON, and XML.

  Physical Requirements:

  - Ability to lift 25 pounds
  - Repeated use of sight to read documents and computer screens
  - Repeated use of hearing and speech to communicate on
    telephone and in person
  - Repetitive hand movements, such as keyboarding, writing,
    10-key
  - Walking, bending, sitting, reaching and stretching in all
    directions

  Benefits & Compensation:

  - Higginbotham offers medical, dental, vision, prescription
    drug coverage, 401K, equity incentive plan as well as
    multiple supplemental benefits for physical, emotional,
    and financial wellbeing.
  - Employee Wellness Program
  - Company paid holidays, plus PTO

  Notice to Recruiters and Staffing Agencies: To protect the
  interests of all parties, Higginbotham Insurance Agency,
  Inc., and our partners, will not accept unsolicited
  potential placements from any source other than directly
  from the candidate or a vendor partner under MSA with
  Higginbotham.  Please do not contact or send unsolicited
  potential placements to our team members.

  *Applications will be accepted until the position is filled

