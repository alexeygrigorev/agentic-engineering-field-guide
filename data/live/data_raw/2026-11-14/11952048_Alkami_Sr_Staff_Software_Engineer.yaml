description: |
  Alkami is the digital sales and service platform provider
  for U.S. banks and credit unions. Our unified Platform
  integrates onboarding, digital banking, and data and
  marketing—each solution can stand alone, but together they
  deliver more—to help institutions onboard, engage, and grow
  relationships. As the future shifts toward Anticipatory
  Banking, we help data-informed bankers meet the moment with
  technology that drives action.

  Founded in 2009, we continue to be recognized for our
  intentional culture and tremendous growth (Best Place to
  Work in Fintech; Best & Brightest to Work For Nationally;
  and Comparably’s Best Company Culture, Best Career Growth,
  Best Engineering Team, and Best Places to Work in Dallas,
  among others). We’re building a culture where each Alkamist
  can perform to their highest potential, and we’re always on
  the lookout for the best and brightest minds. If you’re
  ready to experience the power of alchemy - transforming the
  ordinary into the extraordinary - come join one of the
  fastest growing SaaS companies in the U.S.

  As a remote-first company, most of our positions can be
  remote in the US, except for key roles, which will be
  indicated in the Job Title.

  Follow us on Glassdoor and LinkedIn!

  The Sr Staff Software Engineer will lead and contribute to
  computer software systems, participating in the design
  process from beginning to end. Demonstrates deep technical
  domain knowledge of the company, including apps, services,
  systems, or frameworks. A key strategic player involved in
  maintenance of product features, including on call
  escalations, triaging and resolution.

  Essential Duties & Responsibilities:

  - Deliver highly scalable, available, and fault-tolerant
    production applications in Java and Kotlin.
  - Help prevent and investigate production issues.
  - Build architecture design, influence product roadmap, and
    take ownership and responsibility over new projects.
  - Lead deep-dive architecture discussions.
  - Lead code/design reviews to ensure smooth daily operations
    and accurate planning.
  - Participate in the entire application lifecycle, focusing on
    coding and debugging. - Write clean code to develop
    functional applications.
  - Build pipelines that transform incoming data into Kafka
    streams and KeyLife Indicators (KLIs).
  - Identify bottlenecks in systems and optimize performance,
    including Kafka tuning.
  - Integrate with MANTL APIs for data collection.
  - Lead developers, work with designers and product owners to
    identify new features.
  - Build and extend frontend features in Vue.js as needed to
    support backend-driven work.
  - Manage cutting-edge technologies to improve legacy
    applications.
  - Gather and address technical and design requirements.
  - Set up and maintain environment configurations and monitor
    system health, including observability with Prometheus and
    Grafana.
  - Provide training and support to internal teams.
  - Contribute as a Technical Team Lead by mentoring others,
    lead sprint planning, delegating work and assignments to
    team members, and participate in project planning.
  - Introduce and enhance tools to allow greater automation and
    operability of services.
  - Interface with customers and other business stakeholders to
    effectively deliver software products that meet their
    needs.
  - Establish and maintain standards for the engineering
    organization.
  - Drive AI-assisted engineering strategies, optimizing
    developer workflows and advancing prompt and context
    engineering standards.
  - Respond promptly to on-call incidents, including
    troubleshooting and resolving critical disruptions to
    ensure minimal downtime.

  Recommended Experience & Education

  Minimum Years of Experience

  Typically requires a minimum of 12 years of related
  experience; or 8 years and an advanced degree

  Education Level Bachelor’s degree in engineering, or another
  related field or equivalent work experience

  Knowledge, Skills, & Qualifications

  Required

  - Requires a minimum of 12 years of software development
    related experience; or 8 years and an advanced degree.
  - Exceptional programming skills in Java or Kotlin, with
    proven work experience as a backend-leaning full stack
    developer.
  - Strong experience with Spring Boot, Hibernate, and RESTful
    APIs.
  - Strong proficiency with Kafka basics, streaming, and
    performance tuning.
  - Working knowledge of HTML, CSS, and JavaScript for frontend
    work.
  - In-depth understanding of the entire software development
    process (design, development and deployment).
  - Exceptional experience developing and deploying applications
    for Cloud Native Infrastructure, with advanced experience
    using AWS and Kubernetes.
  - Experience building applications in microservices
    architecture with API-first mindset.
  - Collaborates effectively within the agile framework with a
    problem-solving attitude and willing to take a variety of
    approaches.
  - Excellent analytical and time management skills, with a
    proven ability to deliver cross-organization impact
    independently.
  - Advanced experience in OpenTelemetry.
  - Intermediate database querying skills (SQL).
  - Proven ability to work cross-functionally, experience with
    planning and leading complicated technical projects that
    work with several teams within the company.
  - Exceptional written and verbal communication skills, with
    demonstrated experience providing technical input.
  - Ability to participate in on call rotation (1 week per
    month).
  - Drives and expands AI-assisted engineering strategies,
    optimizing developer workflows, guiding complex
    modernization initiatives, and advancing prompt and
    context engineering standards.

  Preferred

  - Maven experience.
  - Vue.js experience.
  - Master's degree in engineering, technology or related field.
  - Experience building and deploying applications on Amazon Web
    Services.

  Physical Demands

  ● Ability to lift a minimum of 5 pounds to a maximum of 10
  pounds unassisted ● Ability to stand, sit, stoop, walk,
  stretch, reach, and use full range of body motions ● Manual
  dexterity as required for specific equipment

