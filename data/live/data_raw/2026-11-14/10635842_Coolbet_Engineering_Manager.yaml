title: Engineering Manager
company: Coolbet
location: New York, USA
work_type: FULL_TIME
company_size: 1,100 Employees
description: |
  We’re looking for an engineering manager who is inspired to
  mentor, grow, and help teams succeed, especially when the
  team is still small and nimble. You’re an experienced people
  manager and adept project manager who can guide developers
  to perform at their best and also remove any blockers that
  may appear.

  As an engineering manager, you’ll lead a team of product
  developers as they build new features for our core web app.
  You’ll keep the team engaged as we scale up; make sure that
  projects are running without a hitch; and bridge the gap
  with Product & Design to make sure that what we are building
  is on target and prioritizing customer value. As we onboard
  bigger customers and continue to evolve our product, you’ll
  guide your team to execute with efficiency, and consistency.

  Responsibilities

  - Conduct weekly 1-1s with your direct reports. Mentor, coach,
    and train your reports on how to set quarterly goals,
    create plans to achieve them, and unblock any obstacles
    along the way
  - Run the weekly engineering all-hands team meeting; set the
    agenda, encourage participation from the team, and ensure
    meeting runs efficiently
  - Help the project team to coordinate their work; collaborate
    effectively with other functions; identify, communicate
    and reduce risk; run effective meetings and periodic
    project retrospectives
  - Update and improve the Engineering onboarding process and
    documentation, ensuring that the next new hire onboarding
    is completed faster and easier than your own
  - Work closely with the recruiting team and hiring panel to
    identify, vet and hire the best candidate for the team

  Requirements

  - 3+ years of experience building and managing engineering
    teams
  - 5+ years of experience as a Data Engineer or Software
    Engineer developing production code
  - Results-oriented with a strong customer and business focus
  - Entrepreneurial and self-directed, innovative, biased
    towards action in fast-paced environments
  - Able to communicate and discuss complex topics with
    technical and non-technical audiences
  - Able to tackle ambiguous and undefined problems
