description: |
  What is DISCO?

  DISCO is the industry standard for managing, organising and
  sharing music and other media. We make music and media
  workflow fast, intuitive and simple, directly connecting
  people and their work to save time. Today we count UMG,
  Sony, Warner Music, Netflix, Amazon among our customers, and
  over 250,000 people interact with DISCO each month. Our
  customers are super passionate about our product.

  Location

  Hybrid, London, United Kingdom

  As a DISCO employee, you will work remotely from home four
  days a week, and spend one day per week at a co-working
  space in London with your local colleagues.

  Role

  As a Senior Full Stack Engineer on the DISCO team, you will
  lead the design and implementation of robust and scalable
  software features, build performant and secure APIs, and
  find elegant solutions to complex problems. As part of a
  small, dedicated team you will have a huge impact on the
  architecture, design and technology stack of our
  application.

  If you are a Senior Full Stack Engineer who has a passion
  for quality, prides themselves on being a resourceful and
  adaptive learner of new technologies, enjoys working
  collaboratively, and can help us drive our vision to be the
  operating system of the music industry forward, this role is
  for you!

  Responsibilities

  - Implement secure, usable, scalable features that meet the
    needs of our customers
  - Lead the synthesis of product ideas and business
    requirements into deliverable software
  - Ensure application security and assist with information
    security compliance initiatives
  - Lead incident response in a production environment
  - Cover on-call rotation on a shared roster
  - Champion initiatives to address technical debt and improve
    development processes
  - Ensure your team delivers clean, scalable code with
    effective tests
  - Review and constructively critique pull requests
  - Influence the engineering team to adopt best practices and
    design scalable applications
  - Support your teammates to grow through mentoring, coaching
    and collaborative learning

  Requirements

  - 7+ years hands on engineering experience across front end
    and back end
  - Demonstrated expertise with Python and Django, specifically
    the Django REST Framework
  - Experience working with relational databases, we use
    PostgreSQL
  - Experience applying shift left security principles
  - Expertise in designing and developing RESTful APIs
  - Proficient with React.js, semantic HTML and CSS frameworks
  - Experience working with modern design systems and front end
    tooling
  - Flexibility to attend occasional meetings outside of UK
    business hours to facilitate collaboration with the team
    in Australia, with time in lieu
  - Fluent in written and spoken English

  Nice to haves

  - Computer Science degree or comparable knowledge and
    experience
  - Experience responding effectively to production issues of a
    heavily used application
  - Experience developing for AWS, though experience with other
    major cloud platforms (Azure, GCP) is also welcome.
  - Experience with Infrastructure as Code, especially Terraform
  - Experience with OpenSearch or other search solutions
  - Experience in DevOps/site reliability
  - Experience in a startup business
  - Experience working in a distributed development team

  Benefits

  - Office set-up allowance
  - Annual learning and development allowance
  - 25 days of paid vacation leave per year + paid bank/public
    holidays
  - Two weeks of paid sick leave per year
  - Company-paid parental leave, including maternity leave,
    partner leave and adoption leave
  - Monthly internet allowance/reimbursement
  - Autonomy to manage your work flexibly in a high trust
    environment

  To apply for this exciting position, please submit your
  resume along with a cover letter.

  DISCO is an equal-opportunity employer. In addition, we will
  provide reasonable accommodations for individuals who have
  disabilities. If you require any reasonable accommodation to
  participate in the application process, please note this in
  your cover letter and we will reach out to you.

  Please note that we do not accept unsolicited resumes from
  recruitment agencies.
