description: |
  Backed by leading Silicon Valley investors, Peregrine helps
  public safety organizations, state and local and
  governments, federal agencies, and private-sector
  institutions address society’s challenges with unprecedented
  speed and accuracy. Our AI-enabled platform turns siloed and
  disconnected data into operational intelligence — instantly
  surfacing mission-critical information to empower better,
  faster decisions that improve outcomes at every touchpoint.
  Today Peregrine supports hundreds of customers across 30+
  states and two countries, serving more than 125 million
  people — and we’re amplifying our impact as we expand into
  the enterprise and internationally.

  Role

  We are looking to add a Staff Software Engineer, Traffic to
  expand our high-impact Platform team. You’ll design and
  build software-defined networking capabilities that enable
  secure, reliable, and scalable communication across
  Peregrine.

  You’ll work across cloud and Kubernetes networking, service-
  to-service communication, traffic management, routing, and
  observability—building the control planes, services, and
  automation that make complex networking capabilities
  reliable and easy to operate at scale.

  About you

  - Design and build systems that provision, manage, and scale
    network connectivity across customer, cloud, and
    Kubernetes environments
  - Build platform capabilities for service communication,
    routing, traffic management, segmentation, and
    observability
  - Extend and improve APIs and services that make networking
    capabilities reliable and self-service
  - Design systems for safe configuration, policy enforcement,
    traffic rollout, and failure recovery
  - Own and improve the reliability, scalability, and
    observability of networking and traffic management systems
  - Lead debugging of complex connectivity and traffic issues
    across application, Kubernetes, cloud, and network
    boundaries
  - Drive architectural direction and networking standards while
    collaborating across Infrastructure, Security, and product
    engineering teams

  What we’re looking for

  - 9+ years of experience in software, infrastructure, or
    network engineering roles, with a focus on building and
    operating systems at scale
  - Strong programming skills (e.g., Python, Go, or similar)
    with experience building production systems or services
  - Deep understanding of networking fundamentals (e.g., TCP/IP,
    routing, DNS, load balancing, NAT, VPNs)
  - Experience with cloud and Kubernetes networking, including
    concepts such as VPCs, routing, network policy, and
    service connectivity (service mesh and CNI experience,
    such as Istio or Cilium is a big plus)
  - Experience building or operating distributed systems or
    networking infrastructure (e.g., control planes, traffic
    management, gateways or proxies, automation systems)
  - Strong debugging skills and ability to troubleshoot across
    application, system, and network boundaries
  - Ability to drive technical direction and make architectural
    decisions across teams
  - Based in and around one of our offices in SF, DC, or NYC and
    excited to work in-office.

  Annual Salary + Benefits + Equity (if applicable) + Bonus
  (if applicable)

  $200,000—$275,000 USD

  Actual compensation is influenced by a wide array of factors
  including but not limited to skill set, level of experience,
  certifications or licenses, and specific work location.
  Information on the benefits offered is here.

