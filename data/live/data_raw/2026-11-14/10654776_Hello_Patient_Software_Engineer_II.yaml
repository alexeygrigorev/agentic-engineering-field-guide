description: |
  About The Role

  As a Senior Software Engineer II at Hello Patient, you’ll
  build the products that power Mia, our AI assistant for
  healthcare practices. You’ll work across our frontend
  applications, backend services, and AI-powered workflows to
  turn customer and product needs into reliable, scalable
  software.

  You’ll partner closely with Product, Design, Operations, and
  other engineers to build features that improve how
  healthcare practices communicate with and support their
  patients. This role is a great fit for an engineer who is
  comfortable owning projects independently, enjoys solving
  ambiguous problems, and wants to have meaningful impact in a
  fast-moving startup environment.

  What You'll DoBuild End-to-End Product Experiences

  - Design, build, test, and ship customer-facing features
    across our frontend applications, backend services, and AI
    workflows.
  - Develop intuitive user experiences using React, Next.js, and
    TypeScript.
  - Build reliable backend services and APIs using Python and
    FastAPI.
  - Translate product requirements into thoughtful technical
    solutions.
  - Work closely with Product and Design to understand problems,
    propose solutions, and iterate based on customer feedback.

  Own Meaningful Engineering Projects

  - Take ownership of projects from technical design through
    implementation, testing, deployment, and iteration.
  - Break down complex or ambiguous problems into manageable
    technical solutions.
  - Make sound engineering decisions and know when to seek input
    from teammates.
  - Build systems that are reliable, maintainable, and scalable
    as Hello Patient grows.
  - Collaborate with other engineers to identify tradeoffs and
    find pragmatic solutions.

  Build AI-Powered Healthcare Systems

  - Develop features powered by conversational AI, LLMs, and
    automation.
  - Work on systems involving voice, SMS, chat, scheduling, and
    patient engagement workflows.
  - Build integrations with healthcare systems and third-party
    APIs.
  - Help improve the reliability, quality, and performance of
    AI-powered experiences.

  Contribute to a Strong Engineering Team

  - Write clean, maintainable, well-tested code.
  - Participate actively in code reviews, technical discussions,
    and architecture decisions.
  - Improve reliability, observability, testing, and engineering
    workflows.
  - Share knowledge with teammates and contribute to a
    collaborative engineering culture.
  - Help raise the quality and consistency of the systems you
    work on.

  What We're Looking ForMust Have

  - 3+ years of professional software engineering experience
    building and shipping production applications.
  - Experience owning and delivering meaningful product features
    end-to-end.
  - Strong full-stack development experience or a strong primary
    focus in either frontend or backend with the ability to
    work across the stack.
  - Proficiency with TypeScript, React, and modern frontend
    frameworks (Next.js preferred).
  - Strong backend development experience with Python and API
    frameworks such as FastAPI.
  - Solid understanding of databases, APIs, testing, and
    production reliability.
  - Experience building and deploying cloud-based applications
    using AWS, Docker, and modern development workflows.
  - Experience using AI-powered development tools (e.g., Claude
    Code, Cursor, OpenCode) to improve coding, debugging,
    testing, or overall engineering productivity.
  - Ability to work independently, make thoughtful technical
    decisions, and ask for help when needed.
  - Strong communication skills and the ability to collaborate
    effectively across teams.

  Preferred

  - Experience building AI-powered applications, LLM workflows,
    agent-based systems, or RAG pipelines.
  - Experience with healthcare technology, HIPAA, FHIR, HL7, or
    other regulated industries.
  - Experience with event-driven architecture, real-time
    systems, or distributed applications.
  - Experience working in an early-stage startup environment.
  - Experience improving engineering processes, developer
    tooling, testing infrastructure, or technical
    documentation.

  Compensation

  Base salary: $120,000 - $160,000

  Equity: Meaningful ownership in a fast-growing healthtech
  startup

  About Hello Patient

  Hello Patient is transforming healthcare communication
  through advanced conversational AI. Our founding team spent
  3.5 years scaling Carbon Health's technology during
  hypergrowth, where we saw firsthand how much clinical time
  gets wasted on basic communication—great clinicians buried
  in admin work, patients stuck in phone tag.

  Our AI platform proactively engages patients through
  perfectly timed calls and texts, resolving complex
  interactions end-to-end—from scheduling to billing to
  retention. Built with security and compliance at its core,
  our technology integrates with existing healthcare
  infrastructure to deliver 24/7 patient engagement.

  Backed by Scale and 8VC, we're building the future of
  healthcare communication, one conversation at a time.
