description: |
  Job Description SummaryFor Grid Solutions, Offshore HVDC
  represents a key differentiating technology and a central
  focus for the business, particularly in Europe where
  Transmission System Operators have very ambitious renewable
  energy targets. In that context and for Germany, Grid
  Solutions is partnering with TenneT, which plans to invest
  more than $30B by 2030 in deploying new HVDC converter
  stations to bring Offshore Wind energy into Germany and the
  Netherlands. In this context, Grid Solutions is looking for
  a Project Engineering Manager*in who will oversee the
  technical coordination and management of technical topics of
  the entire On Shore scope (Or Off Shore scope) of one 2GW
  HVDC project in Netherlands or Germany. These are large,
  complex multi-year EPC project (contract value > $1B), part
  of a portfolio of several HVDC projects for TenneT.

  Job Description

  He / She will secure the technical co-ordination of all the
  associated design activities for the On Shore (or Off Shore)
  Scope, secure the delivery on time of the design documents
  maintain the planned design budget, implements design
  changes process, supervise and coordinate all engineering
  tasks required to execute the project, whether in house or
  by suppliers/subcontractors.

  The Project Engineering Manager*in will be accountable of
  the proper performance of the design in terms of engineering
  cost, deadlines, and quality on the On Shore scope (or Off
  Shore Scope).

  Responsibilities

  - Responsible for issuing consolidation of provisional drawing
    list of the project or of his/her work package,
    integrating submission dates
  - He/she is responsible of relevant co-engineering sessions
    with other disciplines, main partners or key suppliers if
    & when appropriate and of work package design reviews
  - Lead & coordinate design teams
  - Manage design workload plan and request resource arbitration
  - Ensure compliance to Customer requirements
  - Represents customer interests in the design decisions
  - Prepare or review technical specifications and supplier’s
    documents to enable procurement of materials and plant
    detailed design
  - Check effectiveness of design against delivery of contract
    requirements within project budget and look for global
    cost optimization in all design phase and mainly during
    basic design
  - Deploy Engineering tools associated to his/her work package
    (CAD, PDM/DMS,) as per strategy
  - Integrate EHS requirements based on project Strategy, and
    deploy HAZID (Hazard identification) sessions at different
    project phases
  - Implement Key Indicators on engineering process and provide
    support to elaborate project reporting
  - Implement design freeze and EHS in design

  Desired Profile and Experience

  - BSc or MSc in Electrical Engineering
  - In depth experience in industry including HVDC station
    equipment and design
  - Experience in Project Management delivery
  - Successful experience in management of multi-disciplinary
    teams with multiple interfaces and with products coming
    from several countries
  - Fluent in English , speaking German would be an advantage
  - Strong influencing and relationship building skills
  - Strong technical problem-solving skills & experience
  - Demonstrated presentation skills and ability to succinctly
    communicate complex messages
  - Demonstrates ownership & accountability, judgment and
    decision making, influences & inspires team, creates a
    vision and strategy, and has passion for the role

  What we offer:

  A key role in a dynamic, international working environment
  with a large degree of flexibility of work agreements

  Competitive benefits, and great development opportunities -
  including private health insurance.

  ELECTRIFICATION SYSTEMS - GRID SOLUTIONS

  GE Vernova’s Grid Solutions business electrifies the world
  with advanced grid technologies and systems, enabling power
  transmission and distribution across the power grid, and
  supporting a decarbonized and secured energy transition

  and secured energy transition

  Additional Information

  Relocation Assistance Provided: No
