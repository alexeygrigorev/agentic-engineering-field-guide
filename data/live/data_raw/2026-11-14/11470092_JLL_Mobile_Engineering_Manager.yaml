description: |
  JLL empowers you to shape a brighter way.

  Our people at JLL are shaping the future of real estate for
  a better world by combining world class services, advisory
  and technology for our clients. We are committed to hiring
  the best, most talented people and empowering them to
  thrive, grow meaningful careers and to find a place where
  they belong.  Whether you’ve got deep experience in
  commercial real estate, skilled trades or technology, or
  you’re looking to apply your relevant experience to a new
  industry, join our team as we help shape a brighter way
  forward.

  What this job involves:

  Lead ongoing facility activities and oversee vendors while
  maintaining operational integrity and reliability of
  engineering infrastructure for a large-scale portfolio of
  retail and commercial facilities across the Northeast
  region, including New England. This role requires strong
  customer-service instincts and collaborative leadership to
  ensure a safety-first culture and optimal facility
  performance. The position oversees engineering operations
  across a complex, geographically dispersed multi-site
  environment and requires effective coordination of multiple
  union workforces, vendors, contractors, and stakeholders.

  Your day-to-day tasks will include:

  - Establish and maintain a safety-first culture by promoting
    safe work practices and timely completion of training
  - Oversee implementation of approved initiatives by managing
    property teams, vendors, contractors, facility employees,
    and multiple union workforces
  - Lead engineering operations across a large multi-location
    retail and commercial portfolio, ensuring consistency in
    service delivery, operational standards, maintenance
    execution, and vendor performance
  - Maintain interface with third-party vendors ensuring
    contract compliance, accurate reporting, and issue
    resolution
  - Generate and implement Standard Operating Procedures (SOPs)
    and Emergency Operating Procedures (EOPs) with annual
    reviews
  - Interact with clients, JLL team members, suppliers,
    consultants, union representatives, and vendors on
    facilities and property matters
  - Oversee projects and initiatives to improve facilities
    operations and service delivery
  - Ensure resources are allocated appropriately and work orders
    are completed timely
  - Plan and oversee maintenance shutdowns, coordinating site
    personnel, vendors, union labor, and third-party
    contractors
  - Inspect facilities and equipment to determine service
    requirements and recommend improvement projects
  - Support operations across multiple sites throughout the
    Northeast region, including New England, with regular
    travel as required

  Desired experience and technical skills:

  Requirements:

  - 5–7 years of experience in MEP, skilled trades, or
    engineering operations
  - Experience managing engineering operations across a large-
    scale, geographically dispersed portfolio of retail and
    commercial locations with responsibility for maintaining
    consistent service delivery, operational standards, and
    vendor performance across numerous sites
  - Experience overseeing and coordinating multiple union
    workforces in a multi-site environment
  - Ability to maintain professionalism under stressful
    situations
  - Experience with CMMS/work order platforms
  - Strong proficiency in HVAC systems, mechanical, and
    electrical processes and troubleshooting, including
    chillers, boilers, cooling towers, air conditioning
    systems, pumps, generators, and UPS systems
  - Hands-on experience with Variable Refrigerant Flow (VRF)
    systems and Building Management Systems (BMS)/building
    controls
  - Ability to work on complex problems requiring analysis and
    rational judgment
  - Strategic thinking with strong implementation skills
  - Ability to multitask and work without direct supervision
  - Microsoft Office proficiency
  - Willingness to travel throughout the Northeast region,
    including New England

  Preferred:

  - Excellent presentation skills
  - Experience in regulatory compliance with local jurisdictions

  This position does not provide visa sponsorship. Candidates
  must be authorized to work in the United States without
  sponsorship.

  Expected compensation for this position:

  137,000.00 – 157,000.00 USD per year

  Final compensation packages are determined by various
  considerations including but not limited to candidate
  qualifications, location, market conditions, and internal
  considerations.

  Location:

  On-site –New York, NY

  If this job description resonates with you, we encourage you
  to apply, even if you don’t meet all the requirements.
  We’re interested in getting to know you and what you bring
  to the table!

  Personalized benefits that support personal well-being and
  growth:

  JLL recognizes the impact that the workplace can have on
  your wellness, so we offer a supportive culture and
  comprehensive benefits package that prioritizes mental,
  physical and emotional health. Some of these benefits
  include:

  - 401(k) plan with matching company contributions
  - Comprehensive Medical, Dental & Vision Care
  - Paid parental leave at 100% of salary
  - Paid Time Off and Company Holidays
  - Early access to earned wages through Daily Pay

  At JLL, we harness the power of artificial intelligence (AI)
  to efficiently accelerate meaningful connections between
  candidates and opportunities. Using AI capabilities, we
  analyze your application for relevant skills, experiences,
  and qualifications to generate valuable insights about how
  your unique profile aligns with the specific requirements of
  the role you're pursuing.

