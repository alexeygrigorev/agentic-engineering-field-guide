description: |
  About the company

  Our client is a fast-growing software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Join a small engineering team building backend data systems
  and cloud infrastructure from scratch. You will take loosely
  defined problems and carry them through to dependable
  production use, with considerable independence and very
  little process.

  What you'll do

  - Build and launch production systems that collect, process
    and reshape data coming from many different sources.

  - Create infrastructure that provisions and manages dedicated
    cloud environments for individual customers.

  - Model incoming information as well-structured, connected
    records with traceable history and access controls.

  - Take ownership of problems from an open-ended brief to a
    system the business relies on every day.

  - Use AI and LLM-assisted tooling heavily in daily engineering
    work to move faster.

  - Work closely with a lean engineering group and help shape
    architecture and technical direction.

  Requirements

  What we're looking for

  - 1 to 8 years of software engineering experience, including
    time at an early-stage startup.

  - A history of growing scope or being promoted across roles.

  - Hands-on background creating and releasing pipelines that
    move and transform data at scale.

  - A computer science degree or a combined computer science and
    math degree.

  - Solid data modeling fundamentals, including schema design,
    traceability and access permissions.

  - Practical experience with infrastructure-as-code and
    managing cloud environments, such as Terraform and AWS.

  - Comfort with ambiguity and the ability to work independently
    for weeks with limited direction.

  - Based in New York and able to work on-site five days a week.

  Benefits

  Compensation and benefits

  - Base salary: USD 165,000 to 290,000 per year

  - Equity

  Location and work model

  - New York, NY, United States

  - On-site, 5 days per week in office

  - Full-time
