description: |
  About Us:

  Datacor is the leading provider of software solutions,
  including ERP, CRM, Asset Tracking, Simulation and
  Formulation, to the process manufacturing space. We are on a
  mission to better equip the industry with software solutions
  and move it forward by building thoughtful, intuitive
  products that solve our customers’ most difficult problems.

  We are passionate about serving our customers and helping
  them use data as a competitive advantage. Our customers make
  products that extend and sustain lives by sanitizing,
  fertilizing, beautifying, cleaning, and recycling the world
  we live in. We at Datacor help our customers make those
  products you use every day more safely, cost effectively and
  more efficiently through our technology platforms and
  applications.

  The Role:

  The Datacor Engineering Software Group (DESG) is seeking a
  curious, motivated early-career Software Engineer to join
  our Flow Simulation team and help build the future of our
  software. You will work on Fathom, Arrow, Impulse, and
  xStream, our industry-leading fluid flow simulation
  applications, which engineers around the world use to design
  and analyze piping systems, from steady-state operation to
  transient events like a pump trip.

  This is a generalist role for someone with a solid computer
  science foundation who wants to grow into a well-rounded
  engineer. There are no skill silos here: you will work
  across the whole application, from user interface and
  application logic to data models, file formats,
  integrations, and the tooling that builds and tests it all.
  You will join a team of software engineers and mechanical
  and chemical engineers in a mature codebase that is being
  actively modernized. A structured onboarding plan and an
  experienced teammate will guide your first weeks, and you
  will take on more ownership as you grow.

  Responsibilities:

  - Design, build, and maintain features across all layers of
    our Windows desktop applications, working from
    requirements with guidance from senior engineers.
  - Diagnose and fix defects anywhere in the codebase, including
    customer-reported issues escalated from our Support team.
  - Contribute to internal tooling, build automation, CI/CD
    pipelines, and test infrastructure.
  - Take part in our ongoing modernization, including new
    architecture and user interface frameworks.
  - Write clean, maintainable, well-tested code, and take part
    in code reviews, both giving and receiving feedback.
  - Share team responsibilities such as build pipeline and bug-
    triage rotations.
  - Collaborate with engineers, QA, Product Management, and
    domain experts to deliver solutions that meet user needs.
  - Stay on top of industry trends, and use modern tools,
    including AI coding assistants, responsibly to
    continuously improve your skillset.

  Required Qualifications:

  - Bachelor's degree in Computer Science, Software Engineering,
    Computer Engineering, or a related field (or equivalent
    experience).
  - 0–2 years of professional software development experience;
    internships, co-ops, and substantial academic or personal
    projects count.
  - Proficiency in at least one object-oriented language,
    preferably C# (VB.NET, Java, or C++ also welcome).
  - Solid grounding in computer science fundamentals: object-
    oriented design, data structures, and algorithms.
  - Working knowledge of version control, including branching,
    commits, and merging.
  - Demonstrated ability to write clean, readable, and
    maintainable code.
  - Strong problem-solving and debugging skills, and the
    judgment to ask for help when stuck.
  - Excellent communication and collaboration skills.

  Preferred Qualifications:

  - Experience with the .NET ecosystem and Visual Studio.
  - Exposure to user interface development, whether desktop
    (WPF, WinForms) or web.
  - Experience writing unit tests or working with automated
    testing.
  - Familiarity with scripting languages such as Python or
    PowerShell.
  - Experience with Git, including pull requests and code
    reviews.
  - Familiarity with CI/CD pipelines, Agile practices, or tools
    such as Jira and Bitbucket.
  - Familiarity with data serialization (JSON, XML) or multi-
    threading concepts.
  - Experience using AI coding assistants thoughtfully,
    including verifying the code they produce.
  - Interest in engineering, scientific, or simulation software.

  Hybrid in Colorado Springs, CO preferred; exceptional remote
  candidates will be considered.

  The anticipated base salary range for this role is $65,000
  to $105,000 per year. Actual compensation will be determined
  based on factors including prior experience, education, and
  geographic location

  Why you will love working with us:

  - Flexible time off (FTO) policy

  - Paid parental leave
  - Remote-first work environment
  - 401(k) with company contribution
  - Premier medical, vision, and dental insurance with company-
    funded HRA
  - Competitive pay and bonus programs
  - Employee assistance program
  - A culture of rewards and recognition

  EOE Statement:

  Datacor is an Equal Opportunity Employer and does not
  discriminate on the basis or race, color, religion, sex,
  national origin, age, disability, veteran status, or any
  other protected characteristic.

  Use of AI During Interviews:

  At Datacor, we value thoughtful problem-solving and
  authentic perspectives. To ensure a fair and consistent
  evaluation process, we ask that candidates do not use
  generative AI tools or outside assistance during live
  interviews unless explicitly stated otherwise. We're
  interested in hearing your experience, your approach, and
  how you think through challenges.
