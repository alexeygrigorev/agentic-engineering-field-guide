description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We’re unable to support relocation for this role, so
  candidates will need to already be based in (or able to work
  from) the UK.

  Product Eligibility team is a fairly new team that was
  formed under Regional Platform Squad. We are one of the
  longest-running squads in the company building the platform
  for the core domains of Wise - Transfer, Payout and Partner
  Integrations. Besides that we are supporting product teams
  to extend the Platform capabilities for the new products and
  the new markets.

  Product Eligibility team's main goal is to help Wise
  accurately determine which products and features are
  available to a particular customer.

  To achieve this, we need to make sure we have a clear
  understanding of where our customers reside or operate
  business. As such, one of the first big challenges the team
  will tackle is overhauling of how Wise captures and
  validates customer's residence, present location and address
  information.

  How we work

  We work in an agile fashion, with engineers closely
  collaborating with the product manager, and the analyst. The
  team operates across our London and Cherkasy offices.

  What will you be working on?

  You will be part of an autonomous team, driving the
  technical vision for the owned domain. Contributing to the
  platform, back office tooling and episodically to the
  customer-facing flows. You will help us scale-up and build a
  world class transfer product.

  What do you need?

  We are fully aware that it is uncommon for a candidate to
  have all skills required and we fully support everyone in
  learning new skills with us. So if you have some of those
  listed below and are eager to learn more, we do want to hear
  from you!

  - You have experience working with large scale distributed
    systems
  - You have years of Java 8+ knowledge
  - You have experience working with relational and non-
    relational databases, query optimisation and designing
    schemas
  - You have a strong product mindset and passion for customer
    experience, you prioritise work with the customers in mind
    and make data-driven decisions to fix customer pain-points
  - You enjoy collaborating with others and bringing people
    together to solve a problem
  - You have experience in designing, deploying and maintaining
    clean RESTful APIs
  - You believe in and follow best coding practices, code
    reviews and open feedback
  - You enjoy writing testable code and believe in Test Driven
    Development

  Nice to have:

  - You have experience with Spring boot
  - You have experience with Kafka
  - You have worked with BFFs (Backend-for-Frontends)

