description: |
  About Graphcore

  Graphcore is one of the world’s leading innovators in
  Artificial Intelligence compute. 

  It is developing hardware, software and systems
  infrastructure that will unlock the next generation of AI
  breakthroughs and power the widespread adoption of AI
  solutions across every industry. 

  As part of the SoftBank Group, Graphcore is a member of an
  elite family of companies responsible for some of the
  world’s most transformative technologies. Together, they
  share a bold vision: to enable Artificial Super Intelligence
  and ensure its benefits are accessible to everyone.  

  Graphcore’s teams are drawn from diverse backgrounds and
  bring a broad range of skills and perspectives. A melting
  pot of AI research specialists, silicon designers, software
  engineers and systems architects, Graphcore enjoys a culture
  of continuous learning and constant innovation.

  Job Summary

  Join our dynamic Software Infrastructure team and take a
  pivotal role in scaling and managing our infrastructure. You
  will develop essential tools and services that empower our
  broader software team. Your contributions will enhance the
  build, test, deployment, and productisation processes of our
  Machine Learning Software components. Work with our High-
  Performance Computing (HPC) AI platforms and gain invaluable
  experience in distributed systems.

  The Team

  The Build Engineering team is a function within the Software
  Infrastructure team, which focuses on the overall process of
  building and integration of the Machine Learning Software
  Stack. You will work closely with the QA and development
  teams to get an understanding of how our ML SW stack is
  built, helping to ensure good build practices, and proving
  that the stack works together and is reproducible in secure,
  sandboxed environments.

   Responsibilities & Duties

  - Developing and looking after our internal software
    integration system

  - Develop tooling to support the build and release process

  - Advise on best practices for the build, release, and
    distribution of Software

  - Work closely with QA and the ML Software Stack to resolve
    any Integration issues, and providing fixes where
    necessary

   Essential Skills

  - Familiarity with C++ toolchains, library packaging, CMake

  - Experience with Dependency management for C++ and Python
    projects

  - Experience with Python (Developing tooling / Packaging /
    Dependency management)

  - Debugging / Troubleshooting in Linux environments

  - Good communication skills

   Desirable Skills:

  - Experience with Remote Execution (e.g. Bazel, Buildbarn)

  - Experience contributing towards Open Source projects

  - Experience with Buildstream (or similar Software Integration
    tooling)

  Benefits

  In addition to a competitive salary, Graphcore offers
  flexible working, a generous annual leave policy, private
  medical insurance and health cash plan, a dental plan,
  pension (matched up to 5%), life assurance and income
  protection. We have a generous parental leave policy and an
  employee assistance programme (which includes health, mental
  wellbeing, and bereavement support). We offer a range of
  healthy food and snacks at our central Bristol office and
  have our own barista bar! We welcome people of different
  backgrounds and experiences; we’re committed to building an
  inclusive work environment that makes Graphcore a great home
  for everyone. We offer an equal opportunity process and
  understand that there are visible and invisible differences
  in all of us. We can provide a flexible approach to
  interview and encourage you to chat to us if you require any
  reasonable adjustments.

  Applicants for this position must hold the right to work in
  the UK. Unfortunately at this time, we are unable to provide
  visa sponsorship or support for visa applications
