description: |
  About ROLLER

  ROLLER isn’t your average SaaS company. We operate globally
  across 30+ countries, powering millions of real-world
  experiences in the leisure and attractions industry. What we
  build doesn’t just live on a screen. It shows up in busy
  venues, peak weekends, and unforgettable moments for guests.

  Our mission is simple but ambitious: help operators run
  better businesses while creating great guest experiences.
  That means solving complex, real-world problems across
  ticketing, point of sale, self-service, memberships, kiosks,
  and digital waivers, all at meaningful scale.

  Just as importantly, it’s the people. We’re a team of 300+
  smart, grounded, and genuinely passionate humans working
  across the globe. We care about quality, ownership, and
  doing work we’re proud of, without taking ourselves too
  seriously.

  We’re growing fast, aiming high, and building something that
  matters. If you want to work on real problems, with real
  customers, alongside people who care deeply about their
  craft and impact, ROLLER is a great place to do it.

  Why You’ll Enjoy This Role!

  🚀  Work that keeps venues trading - You’ll own fiscal and
  regulatory compliance across Europe. If it’s wrong, a venue
  can’t legally trade, so getting it right matters.

  🤝  Your squad owns it - Squads are self-managing. The London
  squad owns localisation and compliance for Europe end to
  end, and you’ll work with your PM to decide what gets built,
  how it’s built and when it ships.

  🌍  Real scale, real consequences - Thousands of requests per
  second across hundreds of containers, powering over 100
  million guest experiences in 2025 alone.

  ✨  Help shape a growing team - Be one of the first engineers
  in London, set how the squad works, and help new engineers
  get up to speed.

  Why This Role Matters

  ROLLER is growing fast across Europe, and every new market
  brings its own rules on tax, invoicing, receipts and
  language. Our London squad makes sure venues in those
  markets can trade legally and run in their own language.
  Recent work includes fiscal compliance for markets like
  France, Germany and Austria, and AI-assisted translations
  across the platform.

  You’ll join a small London squad reporting to a London based
  Tech Lead. Our HQ is in Australia, so most of your work with
  the wider team is async, with live time together every week
  or two. You’ll be comfortable owning your work, unblocking
  yourself and finding your own ways to stay connected.

  Our backend runs on C#, .NET, T-SQL and AWS services
  including Lambda, API Gateway, DynamoDB, S3, SES and SQS. On
  the front end, we use Angular alongside our own design
  system and component library.

  What You’ll Do

  Build

  - Design, build and ship changes across backend services, APIs
    and the Angular interfaces venues use every day
  - Build patterns for regional rules and compliance that we can
    extend to new markets

  Own integrations

  - Lead integration-heavy work with third-party providers, like
    fiscal and certification partners: define the contract,
    handle the edge cases and plan for failure
  - Work directly with those providers when something needs
    chasing or clarifying

  Own production

  - Collaborate closely with the SRE team to monitor system
    performance and proactively identify potential issues
  - Triage compliance alerts and fix the root cause

  Raise the bar

  - Share what you know through code reviews, pairing and honest
    feedback
  - Work with your PM to break vague regulatory requirements
    into small, shippable pieces

  About You

  - You have a high appetite for Technology and AI and a natural
    curiosity for how it can transform your work. You’re
    comfortable using AI tools to automate repetitive 'busy
    work,' freeing you up to focus on high-impact work.
  - Solid mid-level or senior experience building and shipping
    full-stack software in a SaaS product company
  - Deep backend experience in C# and .NET, and enough Angular
    or TypeScript to work across the stack
  - Deep knowledge of cloud patterns, application and database
    performance, with experience applying them to varying
    workflows and workloads
  - You’ve built integrations with third-party systems where the
    details matter: payments, tax, invoicing, compliance or
    similar
  - You can take a vague requirement, like a new country’s tax
    rules, and turn it into something shipped
  - You do your best work async: you write things down clearly,
    unblock yourself and don’t need constant check-ins

  Bonus points for experience with European fiscal rules, or
  for speaking French or German. You don’t need to match every
  point.

  We believe AI is a career-defining inflection point. ROLLER
  is a fast adopter of new technology like AI, and every team
  member is empowered to own their learning and use the latest
  tools to supercharge their impact. We’re looking for
  candidates with the proficiency and curiosity to embrace AI
  and technology, not just as a technical skill, but as a core
  competency to help us achieve big goals. Our engineers use
  Claude and other AI coding tools day to day.

  Perks!

  🚀  You get to work on a category-leading product that
  customers love in a fun, high-growth industry - check our
  Capterra and G2 reviews.

  🏥  Private medical insurance through Vitality, plus dental
  cover.

  💷  Company pension.

  🛡️  Life insurance at 4x your base salary.

  💙  Team member Assistance Program to proactively support our
  team’s health and wellbeing - access to coaching, education
  modules, weekly webinars, and more.

  🍼  16 weeks paid Parental Leave for primary carers and 4
  weeks paid Parental Leave for secondary carers

  🎉  Engage in our ‘Vibe Tribe’ - led by our team members; you
  can contribute to company-wide initiatives directly. Regular
  events and social activities, fundraising & cause-related
  campaigns... you name it. We’re willing to make it happen!

  💡  Work with a driven, fun, and switched-on team that likes
  to raise the bar in all we do.

  Go on, hit apply. Let’s build great tech together. If you’ve
  got questions, don’t be afraid to reach out to Reuben at
  reuben.jamieson@rollerdigital.com.
