description: |
  Job Description

  Thomson Reuters is looking for a recognized technical
  authority to set the direction for how the world's top law
  firms and corporate legal departments adopt AI. CoCounsel is
  trusted by over 20,000 law firms and corporate legal
  departments, including the majority of top US courts and Am
  Law 100 firms, and is used by one million professionals
  across 107 countries.

  As the senior-most individual contributor on the Forward
  Deployed Engineering (FDE) team, you will define and drive
  the technology strategy and roadmap for designing, building,
  and operating bespoke AI solutions. You will own the team's
  most complex, highest-risk, and most strategically important
  engagements, working alongside Staff Software Engineers and
  Architects, Senior Legal AI Engineers, and AI Solution
  Engineers. You will partner with Product, Engineering, and
  business leadership to align FDE work with CoCounsel's long-
  term objectives.

  This is a hands-on technical leadership role with broad
  influence. You will make high-stakes architectural decisions
  with autonomy, raise the engineering bar across the team and
  beyond, and help make the team AI-native in everything it
  does.

  Key Responsibilities

       Technical Vision and Strategy

  - Define and drive the long-term technical vision and strategy
    for FDE, including vision documents, technology
    requirements, and roadmaps tied to product and business
    objectives.
  - Lead the selection, evaluation, and adoption of
    technologies, frameworks, and patterns, and build
    consensus across teams.
  - Identify where emerging capabilities such as agentic
    systems, MCP and A2A interoperability, and new model and
    orchestration patterns could cause a transformational
    shift, and communicate the opportunities and trade-offs to
    senior leadership.
  - Contribute to cross-functional and cross-business-unit
    engineering strategy, standards, and, where appropriate,
    patents.

       Architecture and Delivery of Complex AI Systems

  - Lead complex, high-risk, high-visibility AI initiatives from
    concept through production, staying hands-on in design,
    prototyping, and code for the hardest problems.
  - Architect scalable, secure AI systems that integrate with
    client environments, including document management
    systems, enterprise platforms, and legal technology
    ecosystems.
  - Design RAG pipelines, multi-agent orchestration, event-
    driven backends, and agentic workflows using CoCounsel,
    Westlaw, and Practical Law capabilities, plus third-party
    AI APIs.
  - Build reusable AI components, frameworks, and solution
    templates that scale delivery across the team.
  - Set standards for MLOps/LLMOps, Infrastructure as Code, and
    CI/CD so delivery is secure, repeatable, and fast.
  - Identify weaknesses in existing designs and drive remedies.

      Quality, Observability, and Trust

  - Set the strategy for AI monitoring and observability,
    covering performance, output quality, latency, cost, and
    production reliability risk.
  - Own LLM evaluation, including accuracy, hallucination risk,
    citation quality, A/B testing, and red-teaming, and define
    quality benchmarks grounded in real legal workflows.
  - Ensure every solution meets ethical AI, data protection, and
    enterprise security requirements.
  - Drive operational excellence across the software development
    lifecycle, including post-launch measurement.

       Client and Stakeholder Engagement

  - Act as the senior technical voice in discovery on high-value
    engagements, scoping use cases, shaping architectures, and
    building credibility with legal and technical executives.
  - Present complex technical concepts and strategy to audiences
    from engineers to business unit executives, and negotiate
    solutions between key stakeholders.
  - Work with legal SMEs to translate professional reasoning and
    domain heuristics into pipeline design, evaluation
    criteria, and benchmarks.
  - Anticipate customer and market needs and feed field insights
    back into the product roadmap.

       Leadership, Mentorship, and Culture

  - Mentor and coach Staff, Senior, and Lead engineers, and
    indirectly lead a small team of engineers and technical
    experts on ambiguous problems.
  - Review architecture and design at team and sub-unit levels
    and give authoritative feedback.
  - Strengthen engineering culture through knowledge sharing and
    by championing AI-native tools and practices.
  - Work with program and project managers to bring the
    technical dimension into status and risk reporting, and
    consult on budgets for large programs where applicable.
  - Represent Thomson Reuters externally through speaking,
    publications, community engagement, or open-source and
    standards participation.

  Required Qualifications

  - 12+ years of software engineering experience, with deep
    expertise in system design, distributed systems, and
    architecture, and a track record of leading highly
    complex, high-risk projects.
  - Extensive experience owning technical requirements and
    strategy, setting technology roadmaps, and prioritizing
    between competing features and investments.
  - Expert-level, hands-on experience building and deploying
    AI/ML and LLM-powered applications in production.
  - Deep proficiency with orchestration frameworks such as
    LangChain, LangGraph, PydanticAI, or AutoGen, and expert
    understanding of RAG architectures and vector databases.
  - Hands-on experience with Model Context Protocol (MCP) and
    Agent-to-Agent (A2A) patterns for interoperable, tool-
    augmented AI systems.
  - Expert Python (FastAPI or equivalent), with strong
    experience in RESTful, async, and event-driven
    architectures.
  - Experience with a major cloud platform (AWS, Azure, or GCP)
    and Infrastructure as Code (Terraform, CDK, or
    equivalent).
  - Production observability experience (Datadog, Grafana,
    Prometheus, or similar) and experience with AI evaluation
    platforms (LangSmith, Langfuse, Braintrust, or W&B).
  - Strong background in secure API development using OAuth 2.0,
    OpenID Connect, and JWT.
  - Demonstrated fluency with AI-assisted development tools
    (Claude Code, Cursor, GitHub Copilot) and a track record
    of driving AI-native engineering practices.
  - Proven ability to influence across teams and domains, advise
    senior leadership, and communicate complex ideas at
    multiple levels of an organization.
  - Autonomy, sound judgment, comfort with ambiguity in a fast-
    paced agile environment, and strong attention to detail.
  - Recognized as a technical role model and leader in your
    field.

  Preferred Qualifications

  - Experience in a regulated industry (legal, fintech, or
    healthcare), with familiarity with compliance and data
    privacy requirements.
  - Experience building agentic AI systems with autonomous
    decision-making.
  - Familiarity with legal platforms, document management
    systems, and legal technology ecosystems.
  - Container orchestration (Docker/Kubernetes) and MLOps/LLMOps
    lifecycle management.
  - Understanding of transformer model scaling, limitations, and
    fine-tuning.
  - External presence through conference talks, publications,
    patents, open-source contributions, or standards
    participation.
  - Experience developing vision documents and leading cross-
    business-unit technology strategy.

