description: |
  Skillable is a 100% remote and virtual tech company that’s
  modernizing the world of training. Come share your
  professional magic with highly talented, driven and fun
  colleagues who believe in the power of “skilling.”
  Experience what a team focused on doing the right thing
  feels like!



  Our talented people are what makes us friendly and have fun!
  We work together to create amazing solutions and experiences
  for our customers and their clients. We utilize our
  employees’ personal strengths to help grow our company and
  ensure our team is living their best, authentic life. We
  share our appreciation for our team members regularly during
  all-hands, a workplace appreciation tool, regular shoutouts
  in our Teams channels, social media, amongst more. Our
  remote-first work environment blends work and life without
  the added pressure of commuting or feeling guilty about
  leaving early to visit the dentist.



  Come work with us and learn what teamwork and integrity
  blended with an emphasis on well-being and balance can do
  for your career and lifestyle!

  We're an AI-first engineering team, and we treat that as a
  discipline, not a shortcut. Every engineer here works with
  agentic coding tools — Claude Code and GitHub CoPilot are
  key drivers in our daily work, which changes the shape of
  the job:

  - You'll spend more of your time on design, decomposition and
    review, and less on typing. Agents handle much of the
    implementation; you own the architecture, the verification
    and everything that ships.

  - We invest in the system that makes AI effective: project
    context, custom agents and skills, MCP integrations and
    multi-agent code review. Improving that system is
    engineering work here, and it's part of the role.

  - Judgment matters more, not less. Knowing when to hand work
    to an agent — and when not to — is a skill we hire for and
    grow.

  - Skillable's whole business is proving skills by doing. We
    hold our own work to the same standard: AI-assisted or
    not, it isn't done until it's verified.

  The Senior Software Engineer is responsible for owning
  projects and systems end-to-end - designing, building, and
  maintaining both server-side logic and infrastructure as
  well as client-side logic and interfaces that are key to our
  custom labs and related applications. Develop and optimize
  APIs, databases, UIs, design systems, and libraries written
  in either C# or JavaScript/TypeScript. Collaborate closely
  with cross-functional teams to ensure the product and
  technology roadmap is consistently delivered.

  What You Will Do:

  - Design, scope, and decompose complex software features into
    well-defined implementation plans, leveraging AI-assisted
    development workflows to accelerate delivery while
    maintaining engineering rigor.

  - Guide and direct AI agents through feature development,
    serving as the primary architect, reviewer, and decision-
    maker to frame the problem, set constraints and make the
    calls that ensure solutions are aligned with business
    requirements and technical standards.

  - Build effective scaffolding that enables AI tools to
    generate high-quality, maintainable, and scalable code,
    project context management, reusable skills, agent
    workflows, prompt frameworks and automated quality checks.

  - Drive comprehensive automated testing and verification
    practices for every feature before release, ensuring unit
    tests and validation scenarios are tied back to the
    requirements.

  - Own the quality of all delivered software by rigorously
    reviewing AI-generated output, challenging assumptions,
    finding the gaps, and validating that solution fully
    resolves the problem.

  - Identify and mitigate risks associated with AI-assisted
    development, ensuring generated solutions meet
    expectations for security, maintainability, correctness,
    and long-term sustainability.

  - Continuously raise the team capabilities in AI-driven
    engineering by improving workflows, tooling, agents and
    best practices other engineers depend on for quality
    outcomes.

  - Create and maintain documentation of features, design
    decisions, configurations, and other key technical areas
    of the application.

  - Resolves ambiguity and turns ambiguous problems into
    defined, scoped work for themselves and others.

  - Actively collaborate with other developers, QA engineers,
    designers, and product experts in a cross-functional scrum
    team.

  - Assist with scope and estimation for proposed features,
    leading to accurate cost and timeline estimates.

  - Propose, prototype, and champion technologies and processes
    that continuously help Skillable advance integration
    solutions.

  - Mentor other members of the software team to foster skill
    development and knowledge sharing.

  - Establish quality development patterns and practices,
    ensuring the team adheres to these standards.

  - Communicates technical decisions clearly and gives feedback
    to peers in code reviews and beyond.

  - Propose alternate designs that improve time-to-market or
    reduce cost or complexity.

  - Explore and recommend new technologies, patterns, and
    methods to accomplish items on the technical and product
    roadmaps.

  - Recommend standards and best practices for non-functional
    requirements such as system performance, usability,
    reliability, adaptability, security, legal and other
    operational aspects.

  - Participate in team on-call rotation during evenings,
    weekends, or holidays for emergency support or special
    events.

  - Consistently review work to ensure quality, avoid errors and
    maintain high standards.

  - Contribute to interviewing and selecting new team members.
  - Proactively integrate company-approved AI tools into day-to-
    day responsibilities, identifying opportunities to apply
    AI to role-specific tasks and workflows.
  - Continuously evaluate opportunities to leverage AI to
    automate processes, solve problems, improve efficiency,
    and enhance the quality of individual and team outcomes.
  - Use AI to enhance productivity, problem-solving, and
    decision-making where appropriate, while maintaining human
    judgment and accountability for the quality and accuracy
    of work.

  - Support and promote the company values through positive
    interactions with both internal and external stakeholders
    on a regular basis.

  - Other strategic business initiatives or special cross-
    functional project involvement as required.

  What You Bring to the Role:

  - Bachelor’s degree in related field (computer software,
    computer science, software development, etc.) or
    equivalent work experience.

  - 8+ years of professional experience as a software developer
    in an agile product team.

  - 5+ years working with .NET Framework and C# required, AND
    Typescript or JavaScript required.
  - Action oriented in thoughtfully evaluating how and where AI
    can enhance work, while applying sound judgment, critical
    thinking, and appropriate human oversight.
  - Natural curiosity and adaptability in learning, adopting and
    applying emerging AI capabilities to evolve ways of
    working across individual responsibilities and
    departments.
  - Experience working with hands-on technical training
    environments, virtual labs, or learning platforms is
    highly desirable.

  - Hands on experience delegating real implementation work to
    AI agents and reviewing and verifying what comes back for
    delegated engineering, not autocomplete.

  - Proven experience regularly use of  modern AI tools/agent
    tools including GitHub CoPilot and Claude Code or similar
    as a standard practice in building software that is not
    experimental.

  - Strong fundamentals in system design, debugging and code
    review so AI raises the bar for, supporting existing
    coding skills.

  - Evidence of building scaffolding around AI tools: custom
    agents, MCP servers, eval harnesses or enablement that
    made AI work more efficiently for a team or department,
    strongly preferred.

  - Exceptional judgment in  AI-generated output, preventing
    pursuits of ineffective solutions and technical dead ends
    and ensuring course correction early.

  - Demonstrated experience in MSSQL and Entity Framework.

  - Proficiency in collaborating with UX designers to translate
    designs into working software.

  - Proficiency in creating and consuming RESTful APIs.

  - Proficiency in Unit Testing, including writing
    comprehensive, maintainable, and efficient test cases to
    ensure code correctness, reliability, and performance.

  - Experience working with cloud native applications.

  - Proactively addresses challenges, seeking opportunities for
    continuous improvement.

  - Self-motivation and the ability to contribute effectively
    with minimal supervision, within a collaborative team
    environment.

  - Ability to adapt to dynamic project needs while maintaining
    quality and focus.

  - Ability to participate in team on-call rotation during
    evenings, weekends, or holidays for emergency support or
    special events.

  - Experience with the following is appreciated but not
    strictly required: Authentication (e.g., OIDC, OAuth,
    SAML),  NextJS, ExpressJS, and Building pipelines and
    DevOps practices.

  Salary Range

  The base salary for this position is $130,000 - $170,000
  annually. Consistent with applicable laws, compensation will
  be determined based on the candidate's level, relevant
  skills, qualifications, and experience along with
  requirements for the position and annual financial plans.

  Skillable is a distributed first team with employees working
  across the U.S., and we do not consider geography when
  determining compensation ranges.

  Pay range and current benefit offerings are effective for 90
  days from posting date.  Standard employment offerings are
  subject to potential change upon periodic review and
  analysis, at the discretion of Skillable.

  What We Offer

  We believe in providing a suite of benefits that ensure our
  employees know we appreciate them as people first.
  Skillable wants to be a company that promotes physical,
  emotional and all around well-being through our benefit
  offerings! Subject to eligibility requirements, the Company
  offers comprehensive benefits including:

  - Fully remote with a monthly stipend to pay for office
    services and supplies

  - Medical (2 plan options), dental (2 plan options), vision,
    health savings account with generous employer
    contributions, healthcare spending accounts, dependent
    care spending accounts, EAP, group paid life insurance,
    group paid STD and LTD and voluntary life/AD&D insurance,
    accident and critical illness options.

  - 401(k) with company match, tuition reimbursement, healthy
    lifestyle reimbursements.

  - Unlimited PTO, Paid holidays, bereavement leave, parental
    leave, caregiver leave and paid FMLA leave.

  - Privilege of logging off at 2:00 pm local time, every Friday
    for team members who are caught up on work and meeting
    deliverables.  Full company closure during the 4th of July
    holiday week.

  - Reimbursement for up to $750 annually to use towards
    lifestyle choices that impact their wellness such as gym
    memberships, fitness classes or healthy meal plans,

  - Stipend of $200 a month for office expenses.

  - Access to pet insurance; access for employees and dependents
    to Skillable learning opportunities through our product
    and more!

  Working Conditions:

  The job conditions for this position are in a remote home
  office setting, requiring a space that supports privacy and
  focus to attend to regular and frequent video and voice
  calls. Employees in this position use PC and phone on an on-
  going basis throughout the day. Periodic travel may be
  required equaling up to approximately 10% of the time.

  Skillable participates in E-Verify and will provide the
  federal government with your Form I-9 information to confirm
  that you are authorized to work int he U.S.  If E-Verify
  cannot confirm that you are authorized to work, this
  employer is required to give you written instructions and an
  opportunity to contact Department of Homeland Security (DHS)
  or Social Security Administration (SSA) so you can begin to
  resolve the issue before the employer can take any action
  against you, including terminating your employment.



  Fraud Prevention:

  To protect candidates from recruiting scams, please note
  that our Talent Acquisition Manager will only contact
  applicants using the personal contact information provided
  when applying through our official careers page. If you did
  not apply but are being pursued about a position, our
  initial outreach will only occur through LinkedIn - not via
  Indeed. If you receive an unexpected message directing you
  to apply through another website or from anyone other than
  our Talent Acquisition Manager, please treat it with
  caution.

  Skillable can only hire potential candidates with a primary
  residence in the following States: AZ, CA, CO, FL, GA, ID,
  IN, KY, MA, ME, MI, MO, NC, ND, NE, NH, NV, NY, OH, OK, SC,
  TN, TX, UT, WA, WI.
