description: |
  Who is Taco Bell?

  Taco Bell was born and raised in California and has been
  around since 1962. We went from selling everyone’s favorite
  Crunchy Tacos on the West Coast to a global brand with
  7,500+ restaurants, 350 franchise organizations, that serve
  42+ million fans each week around the globe. We’re not only
  the largest Mexican-inspired quick service brand (QSR) in
  the world, we’re also part of the biggest restaurant group
  in the world: Yum! Brands.



  Much of our fan love and authentic connection with our
  communities are rooted in being rebels with a cause. From
  ensuring we use high-quality, sustainable ingredients to
  elevating restaurant technology in ways that haven’t been
  done before… we will continue to be inclusive, bold,
  challenge the status quo and push industry boundaries. 



  We’re a company that celebrates and advocates for different,
  has bold self-expression, strives for a better future, and
  brings the fun while we’re at it. We fuel our culture with
  real people who bring unique experiences. We inspire and
  enable our teams and the world to Live Más.



  At Taco Bell, we’re Cultural Rebels. Want to join in on the
  passion-fueled fun? Learn more about the career below.



  About the Job:

  The Software Engineer, Cloud Platform is responsible for the
  development of the Back of House Data Router platform (BOH
  BDR) and multiple BOH projects including Store File
  Distribution (SFD), BOH PC (Cortex, Windows 11, password
  rotations, security patches), BigFix, Security remediations
  (Wiz), HME timer and Food Cost Application (FCA). This role
  will drive impact across the Taco Bell business by creating
  a strong foundation to enable increased store manager and
  team member operational efficiencies and provide crucial
  restaurant metrics and data to internal/external systems
  including franchisees. With this role, the opportunities are
  endless: Work collaboratively with technical leads across
  Yum! Brands, learn new AWS technologies and drive the future
  of the data delivery platform and data integrations. The
  Software Engineer, Cloud Platform will report to the Manager
  of Software Engineering and work on a team of software
  engineers.

  The Day-to-Day:

  - Develop code and unit tests for BOH systems leveraging AI
    technologies to increase efficiency and accuracy.
  - Collaborate with other software engineers, quality engineers
    (QE), site reliability engineers (SRE), security engineers
    and product teams across YUM brands and vendor partners to
    implement software solutions.
  - Participate in Agile Scrum activities such as daily
    standups, sprint planning, backlog refinement,  retros and
    turnover sessions.
  - Document and diagram software processes with high-level
    overview of data flows.
  - Help create and improve processes or tools. Improve existing
    code by refactoring.

  Is this you?

  - Bachelor's Degree in Engineering, Computer Science, or a
    technical discipline; or equivalent years of experience
  - At least 2 years of experience as a software developer
  - At least 2 years of experience with AWS cloud computing
    including serverless technologies
  - Experience with GitLab, Postman, TypeScript, Serverless
    Framework, CDK, Cursor.

  Work-Hard, Play-Hard:

  - Hybrid work schedule and year-round flex day Friday
  - Onsite childcare through Bright Horizons
  - Onsite dining center and game room (yes, there is a Taco
    Bell inside the building)
  - Onsite dry cleaning, laundry services, carwash,
  - Onsite gym with fitness classes and personal trainer
    sessions
  - Up to 4 weeks of vacation per year plus holidays and time
    off for volunteering
  - Tuition reimbursement and education benefits
  - Generous parental leave for all new parents and adoption
    assistance program
  - 401(k) with a 6% matching contribution from Yum! Brands with
    immediate vesting
  - Comprehensive medical & dental including prescription drug
    benefits and 100% preventive care
  - Discounts, free food, swag and… honestly, too many good
    benefits to name



  Salary Range $117,800 to $146,500 annually + bonus
  eligibility + equity (if applicable) + benefits

  The above represents the expected salary range for this job
