description: |
  About Fubo:

  FuboTV Inc. is a consumer-first live TV streaming company
  that is defining the future of TV.

  Ranked among Fast Company’s Most Innovative Companies (2026)
  and the Financial Times’ The Americas’ Fastest-Growing
  Companies (2026, 2025), FuboTV owns Hulu + Live TV
  (entertainment), Fubo (sports) and Molotov (entertainment
  and sports), which stream in markets around the globe.

  Our Mission:

  Our mission is to deliver premium sports, news and
  entertainment programming through a best-in-class user
  experience that offers greater choice, flexibility and
  value.

  About the Role:

  *This role is a New York City based HYBRID position.
  Candidates must be located in NYC, and willing to come into
  the office on a hybrid basis, four times a week (Monday,
  Tuesday, Wednesday, Thursday).*

  Fubo is looking for a Software Engineer to join our Data
  Engineering team. In this role, you'll design and build
  scalable data ingestion pipelines, analytics systems, and
  microservices that power business analytics, product
  analytics, recommendations, and personalization across
  Fubo's global streaming platform.

  As a member of the Data Engineering team, you'll collaborate
  across disciplines, partnering with engineering, product,
  business, and marketing teams to deliver reliable data
  infrastructure that drives decisions across the company.

  We're looking for engineers who care as much about data
  quality and consistency as they do about the systems that
  produce it. If you take pride in building reliable
  pipelines, ensuring data integrity end-to-end, and enabling
  analytics that drive real business decisions, you'll thrive
  here.

  Our Tech Stack:

  - Languages: Scala, Go, Python
  - Data Processing Framework: Apache Beam, Scio
  - Streaming: Apache Kafka, Google Pub/Sub
  - Orchestration: Airflow
  - Cloud & Infrastructure: GCP, Docker, Kubernetes
  - Data Storage/Cache: BigQuery, Redis, Bigtable

  Requirements:

  - 4+ years of experience shipping production-quality features
    in a data engineering or backend software engineering role
  - Experience developing data pipelines or microservices in
    Scala, Java, Go, or Python
  - Experience working with data processing frameworks such as
    Apache Beam, Scio, Apache Spark, Apache Flink is preferred
  - Familiarity with SQL and experience working with a data
    warehouse (BigQuery, Redshift, Snowflake, or similar)
  - Comfortable working in a cloud environment (GCP, AWS, or
    Azure)
  - Experience with streaming or messaging systems such as
    Apache Kafka or Google Pub/Sub is a plus
  - You care about code quality and advocate for simple,
    maintainable solutions
  - You're curious and driven by problem solving, always looking
    to learn new technologies and approaches, including how AI
    tools can change the way we build data systems
  - You're a collaborative team player who communicates openly
    and enjoys working across disciplines to get things done

  Perks & Benefits:

  - At Fubo, you will have the opportunity to personally
    influence what live media looks like after it goes through
    its next big transformation
  - Fubo provides a highly competitive compensation based on
    experience and market standards
  - Robust benefit package including Health/Dental/Vision
    coverage 401k, Life Insurance, and commuter benefits
  - Free Premium Fubo Account
  - Unlimited PTO days and regular company-wide activities
  - Fubo's main headquarters are located in Midtown Manhattan,
    with offices in Paris, and Bangalore
  - Fubo is an e-verified company

  Fubo’s minimum base salary for this role if hired in New
  York City is $160,000 per year; maximum base salary for this
  role is $190,000 per year. Additionally, this role is
  eligible to participate in Fubo's equity plan, annual cash
  bonus plans, unlimited PTO, and a full range of medical
  benefits. The final offer amount will be at the company’s
  sole discretion and determined by multiple factors,
  including years and depth of experience and expertise, and
  other business considerations.
