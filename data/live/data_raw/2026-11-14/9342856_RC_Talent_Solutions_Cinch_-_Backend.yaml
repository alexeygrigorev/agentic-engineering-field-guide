description: |
  Backend Engineer (Mid-to-Senior Level)

  Role Overview

  We foster a dynamic, collaborative culture where engineers
  take full ownership of their

  work, from design to deployment. As a Backend Engineer on
  our Core Feature Team,

  you will design, build, and optimize scalable backend
  services that power our multi-

  tenant marketing automation platform. You’ll collaborate
  closely with front-end, AI, and

  database teams to deliver robust APIs, ensure data
  integrity, and continuously improve

  system performance.

  This role is ideal for an engineer who thrives on solving
  complex data and scalability

  challenges, writing elegant and maintainable code, and
  contributing to a culture of

  continuous improvement.

  Key Responsibilities

   Design, implement, and maintain RESTful APIs using Django
  and Django REST

  Framework.

   Develop reliable data models and integrations with
  PostgreSQL databases.

   Write scalable, maintainable, and testable backend code in
  Python.

   Collaborate with front-end engineers to define and support
  API interfaces.

   Improve application performance through code optimization
  and query tuning.

   Refactor legacy systems to enhance reliability and
  scalability.

   Participate in incident response, debugging, and root
  cause analysis.

   Containerize applications using Docker and deploy services
  to AWS.

   Support CI/CD processes and ensure code quality through
  testing and reviews.

  Qualifications

   Bachelor’s degree in Computer Science or related field, or
  equivalent experience.

   5–7 years of backend software engineering experience.

   Proficiency in Python, Django/Django REST Framework, and
  PostgreSQL.

   Familiarity with AWS services (ECS, S3, Aurora RDS) and
  Docker.

   Understanding of multi-tenant architectures and scalable
  design.

   Experience with REST API development and performance
  tuning.

   Familiarity with version control systems and agile
  methodologies

   Knowledge of front-end frameworks such as React (a plus).

  Skills

   Strong backend development and debugging skills.

   Ability to design efficient, scalable systems and write
  clean, maintainable code.

   Solid understanding of database schema design and
  optimization.

   Collaborative mindset with strong communication skills.

   Comfortable working in a fast-paced, iterative
  environment.

  Why Join Cinch?

  At Cinch, you’ll work in a cloud-native, SaaS environment
  that embraces agility,

  innovation, and collaboration. You’ll be part of a team that
  values ownership, continuous

  learning, and high-impact engineering—building products that
  redefine how businesses

  connect with their customers.

  About Cinch

  At Cinch, we’re revolutionizing the omnichannel marketing
  industry by building the best

  marketing automation platform targeting multi-location
  businesses. Our platform

  centralizes customer data and enables personalization and
  automated outreach across

  channels—such as email, SMS, digital ads, and direct mail—to
  enhance retention and

  drive growth. Join us to be part of a vision that
  prioritizes customer experience and

  technological excellence.

  Compensation

  The base pay range for this role is $2,000 – $3,500 per
  month.
