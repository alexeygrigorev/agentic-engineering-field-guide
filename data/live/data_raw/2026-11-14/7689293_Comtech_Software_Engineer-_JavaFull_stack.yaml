  Company Description

  Comtech LLC is a woman-owned small business focused on
  delivering end-to-end solutions and products. Since 1998, we
  have successfully serviced enterprises across the public and
  private sectors, and the Department of Defense. Our services
  span all aspects of business, providing a holistic approach
  for managing an organization.

  Job Description

  - Core member of an agile team that drives user story analysis
    and elaboration, designs and develops software
    applications, and tests and builds automation tools
  - Perform hands-on software development and testing
  - Core member of an agile engineering team that designs and
    develops software applications
  - Typically spend 75+% of time writing code, API specs,
    conducting code reviews and testing in ongoing sprints
  - Identify exciting opportunities for adopting new
    technologies to solve existing needs and predicting future
    challenges
  - Perform ongoing refactoring of code, utilizing visualization
    and other techniques to fast-track concepts
  - Work with technical product managers to prioritize features
    for ongoing sprints, manage a list of technical
    requirements based on industry trends, new technologies,
    known defects, and issues
  - May be assigned to a specific platform/product permanently
    or be part of a dynamic resource pool that gets assigned
    to projects as they come up
  - Use industry standard automation tools to create regression
    test scripts and enables continuous development

  Qualifications

  - 2+ years of software engineering experience
  - Experience with Java development in an Enterprise setting
    using J2EE, frameworks like MEAN, Spring, Hibernate etc.,
    SQL and nonSQL databases, Big Data platforms etc
  - Demonstrated experience with object-oriented design and
    coding skills across a variety of platforms: JAVA, HTML,
    DB2, XML, Oracle, MQ Series, Data Power. Experience in
    Redhat JBOSS Suite (EAP, JBPM, JBRMS, Camel, FUSE etc.) a
    plus
  - Thorough understanding of XML, JSON, web services
    technologies (SOAP, REST), and data structure fundamentals
  - Demonstrated experience with continuous integration
    frameworks (Jenkins)
  - Bachelor's or Master's degree in computer science, computer
    engineering, or other technical discipline, or equivalent
    work experience, is required
  - Relevant technical certifications, is a plus

