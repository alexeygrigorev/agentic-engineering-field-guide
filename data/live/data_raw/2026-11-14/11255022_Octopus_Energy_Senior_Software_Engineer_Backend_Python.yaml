description: |
  About Octopus Electroverse

  We’re making electric vehicle ownership as smart and as
  simple as possible, by building the giant, virtual charging
  platform of the future.

  In just five years, Octopus Electroverse has grown to become
  one of the largest eMobility players globally, with over
  1,400,000 connected electric vehicle chargers and a customer
  ecosystem spanning web, iOS, Android, CarPlay, Android Auto
  & Automotive OS, and more.

  But it’s just the start: we’re busy expanding
  internationally, working with more automotive and tech
  partners, building exciting new features at scale, and
  creating the integrated charging experiences of the future.
  We are working to make public EV charging simple across
  multiple customer bases, including whitelabel app users, EV
  business fleets, new international markets and our flagship
  consumer offering.

  Electroverse is a multifunctional team made up of product,
  development, commercial, operations, marketing, partnerships
  teams, and more - all focused together on making Octopus the
  go-to name in EV charging. And we’re looking for smart
  individuals with an interest in the space who can help us
  make it happen.

  About the role

  We’re looking for someone who’s passionate about code,
  curious, and eager to learn. You’ll be working alongside the
  backend team that provides services for our Electroverse
  ecosystem in the electric vehicle and electrification space
  with focus on helping develop the core functionality of our
  business. As our business grows, we’re looking to build
  commercial stability whilst ensuring robust, transparent and
  competitive pricing for our customers. You’ll help us
  develop discounting solutions, monitor financial patterns,
  and consistently and reliably deliver value.

  We’re open to the level you’re applying on, if you don’t
  feel like a Senior Engineer yet, but you tick all the boxes,
  we’ll definitely consider your application. Our project is
  establishing itself as the leading e-mobility provider
  solution within the industry and we want to take it to the
  next level. This means we're working on big features which
  will give you the chance to have a huge impact and, given
  our ambitions in the electrification space, influence how
  the back-end scales to meet new challenges and create a
  wider ecosystem. Overall, you'll work with a small, high-
  energy project team to bring the product to life - an
  exciting opportunity to work like a start-up within a
  rapidly scaling EnTech business.

