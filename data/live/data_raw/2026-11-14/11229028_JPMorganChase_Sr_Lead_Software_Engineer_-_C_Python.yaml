description: |
  If you are looking for a game-changing career, working for
  one of the world's leading financial institutions, you’ve
  come to the right place.

  As a Sr. Lead Software Engineer at JPMorgan Chase within the
  Commercial & Investment Bank Compute Runtime Platforms, you
  will play a crucial role in providing expertise and
  engineering excellence as part of an agile team. Your
  responsibilities include enhancing, building, and delivering
  trusted market-leading technology products in a secure,
  stable, and scalable manner. You will leverage your advanced
  technical skills and collaborate with colleagues across the
  organization to achieve best-in-class outcomes across
  various technologies, supporting one or more of the firm’s
  portfolios.

  Job Responsibilities:

  - Design, implement, and optimize distributed computing
    solutions in HPC, K8s and Cloud environments.
  - Leverage Generative AI and AI tooling to enhance the
    monitoring, management, and optimization of large compute
    environments.
  - Collaborate with cross-functional teams to improve system
    performance and efficiency.
  - Develop and maintain software solutions using Python, C++;
    and Go.
  - Deploy and manage applications using Kubernetes (K8s) and
    HPC/Grid Computing/Big Data technologies such as Slurm,
    LSF, Spark, Ray and Symphony in cloud environments.

  Required Qualifications, Capabilities, And Skills

  - Formal training or certification on Software Engineering
    concepts and 5+ years applied experience.
  - Expertise in C++, Python, Kubernetes (K8s), and HPC/Grid
    Computing technologies (Slurm, LSF, Symphony), GenAI,
    agent framework and tools, observability tooling such as
    OTel
  - Proven experience with cloud technologies and environments
  - Strong problem-solving skills and the ability to work
    collaboratively in a team setting.
  - Experience in Computer Science, Computer Engineering,
    Mathematics, or a related technical field

  Preferred Qualifications, Skills, and Capabilities:

  - AWS hands-on experiences is a plus.

