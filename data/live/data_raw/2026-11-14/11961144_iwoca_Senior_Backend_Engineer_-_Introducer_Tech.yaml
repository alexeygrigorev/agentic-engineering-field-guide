description: |
  Senior Backend Engineer - Introducer Tech - DE

  Hybrid in London / Remote within the UK

  We’re looking for a Senior Backend Engineer

  You'll own the Lending API in Germany, which banks,
  fintechs, brokers, and comparison sites build on to offer
  iwoca's finance to their customers. You'll decide how it
  evolves and help build the features that make partners
  choose iwoca.

  The company

  Small businesses move fast. Opportunities often don’t wait,
  and cash flow pressures can appear overnight. To keep going,
  and growing, SMEs need finance that’s as flexible and
  responsive as they are.

  That's why we built iwoca. Our smart technology, data
  science and five-star customer service ensures business
  owners can act with the speed, confidence and control they
  need, exactly when it's needed.

  We’ve already cleared the way for 100,000 businesses with
  more than £5 billion in funding. Our passionate team is
  driven to help even more SMEs succeed, through access to
  better finance and other services that make running a
  business easier. Our ultimate mission is to support one
  million SMEs in their defining moments, creating lasting
  impact for the communities and economies they drive.

  The team

  Introducer Tech builds the systems that partners in Germany
  use to refer businesses to iwoca. The aim is to get new
  partners integrated quickly and to make applying simple for
  their customers. The team also looks after how partners earn
  commission.

  Its work covers three main areas:

  - The Lending API. Developing the versioned API and the
    webhooks that keep partners up to date on their customers.
  - The Introducer Portal. Building the web app that German
    brokers log in to, to submit applications and upload
    documents.
  - The sign-up journey. Improving how businesses apply and how
    well they convert, after a partner referral.

  The team is growing to have two product managers, who each
  focus on either the broker or the partner flow, and three
  engineers across the backend and frontend, including this
  hire.

  The team currently works in sprints, with three stand-ups a
  week and planning every two weeks. However, there is room to
  adapt how it works as it grows.

  The role

  You'll be the senior engineer behind iwoca's broker and
  partner channels in Germany, from the tools partners
  integrate with to the internal systems that broker account
  managers use.

  Ownership and autonomy

  - Own the Lending API in Germany end to end, deciding what to
    build, when to release a new version, when to retire an
    old one, and what iwoca can promise partners.
  - Own the developer portal and every tool partners use to
    integrate, from documentation that their developers and
    coding agents can build from to self-serve testing that
    needs no help from iwoca.

  Impact

  - Ship the features that make partners choose iwoca, starting
    with pre-qualification, which shows a customer what they
    could borrow before they apply.
  - Make integration quick and simple, so a partner can go live
    with few questions and little hand-holding.
  - Automate parts of the broker funnel and the internal CRM
    that broker account managers use, cutting friction and the
    lag between a decision and the action that follows, and
    building agents wherever they help.

  Growth trajectory

  - Set the team's technical direction and shape the product and
    technical roadmap alongside the product manager.
  - Align designs with the UK engineers who share the API, so
    German requirements shape the design from the start.
  - As well as being hands on, you’ll develop your mentoring and
    coaching skills. You’ll help lead the team as the most
    senior engineer.

  You'll work with the commercial colleagues who bring in new
  partners, and join the team's weekly support rotation.

  The requirements

  Essential:

  - Backend engineering. You've designed and built production
    backend systems in Python – ideally with Django, though
    FastAPI or Flask count too. You've used PostgreSQL or
    another relational database in production, and kept it
    fast and maintainable.
  - API design. You've built and evolved APIs that other teams
    or companies depend on, and made the decisions on
    structure, versioning, and change.
  - Ownership. You've taken work from a commercial problem
    through to production – scoping the solution, making the
    trade-offs, and iterating based on how people use it.
  - Mentoring. You've helped other engineers grow through code
    reviews and design sessions.
  - AI leverage. You've built agentic workflows, or used AI to
    scale your engineering output beyond what you could
    deliver alone. You judge when to use it and when not to.
  - Communication. You write and speak clearly, directly, and
    concisely. You adapt technical detail to your audience.

  Bonus:

  - Partner onboarding. You've helped external developers
    integrate with an API – through documentation, test
    environments, or working with them directly.
  - Full-stack. You've contributed to frontend codebases,
    particularly in React or TypeScript.
  - CI/CD. You've set up or maintained the pipelines that test
    and release a production service.
  - Measurement. You've used data, metrics, or A/B tests to
    check whether a change had the effect you intended.

  The salary

  We expect to pay from £80,000 to £100,000 for this role.
  But, we’re open-minded, so definitely include your salary
  goals with your application. We routinely benchmark salaries
  against market rates, and run quarterly performance and
  salary reviews.

  The culture

  At iwoca, the best idea wins. We model our culture on
  independent thinking, challenging untested logic, and
  evidence-based decisions. We prioritise learning and growth,
  and give people the autonomy to develop in the direction
  that makes them most effective.

  We're a tech company and believe in the power of AI to help
  us work faster and better. We provide the infrastructure
  where every iwocan always has access to the best models and
  where those models have access to all of our data. We will
  help our people to learn how to use and grow with the new
  tools available to them.

  The offices

  We put a lot of effort into making iwoca a great place to
  work:

  - Offices in London, Leeds, Berlin, and Frankfurt with plenty
    of drinks and snacks.
  - Events and community-led groups, including running groups,
    padel, and monthly ping-pong and pool competitions.

  The benefits

  - Flexible working hours.
  - Medical insurance from Vitality, including discounted gym
    membership.
  - A private GP service (separate from Vitality) for you, your
    partner, and your dependents.
  - 25 days’ holiday per year, an extra day off for your
    birthday, the option to buy or sell an additional five
    days of annual leave, and unlimited unpaid leave.
  - A one-month, fully paid sabbatical after four years.
  - Instant access to external counselling and therapy sessions
    for team members that need emotional or mental health
    support.
  - 3% pension contributions on total earnings.
  - An employee equity incentive scheme.
  - Generous parental leave and a nursery tax benefit scheme to
    help you save money.
  - Electric car scheme and cycle to work scheme.
  - Two company retreats a year: we’ve been to France, Italy,
    Spain, and further afield.

  And to make sure we all keep learning, we offer:

  - A learning and development budget for everyone.
  - Company-wide talks with internal and external speakers.
  - Access to learning platforms like Treehouse.

