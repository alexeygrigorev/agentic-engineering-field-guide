description: |
  Software Engineer (Contract)

  Company: Certive Inc. Location: Remote (US) Type: Term
  engagement Compensation: $6000/mo

  About the role

  Certive is building the modern compliance platform for
  insurance and real estate brokerages: software that tracks
  every license, never misses a renewal, and files renewals
  and new applications automatically. We are early, well-
  funded, and moving quickly.

  As a Software Engineer, you will be one of the first people
  writing code at Certive. You will work directly with the
  founder on the core product — the integrations that pull
  license data, the automation that files renewals, and the
  dashboard brokerages open every morning. There is no backlog
  to pick up and no ticket queue to work through. You will
  help decide what gets built and then build it.

  This is a term engagement rather than a salaried position,
  but the work is real product work shipped to real customers.
  Strong performance is the most direct path we have to a
  full-time seat on the team.

  What you will do

  - Build and ship features across the product, from the
    interface a brokerage sees to the services behind it.
  - Work on integrations with the industry data sources that
    tell us whether a license is active, when it expires, and
    what is required to renew it.
  - Build automation that completes renewals and new license
    applications against state and national systems.
  - Turn messy customer license spreadsheets into clean,
    structured, monitored data using AI tooling.
  - Build the tracking, alerting, and task-surfacing experience
    that keeps a brokerage ahead of every deadline.
  - Sit in on design-partner conversations, watch people use
    what you built, and fix what does not work.
  - Help establish the engineering habits we will keep as we
    grow: testing, deploys, and security hygiene.

  What we are looking for

  - Strong programming fundamentals and the ability to pick up
    unfamiliar tools and codebases quickly.
  - Evidence that you have shipped something end to end — a
    personal project, a prior internship, or open-source work.
  - Comfortable working across the stack and not precious about
    which layer you are in.
  - Clear written communication, and the discipline to work well
    asynchronously on a small remote team.
  - Self-directed and resourceful, with the judgment to make
    reasonable calls without asking first.
  - Fluent with AI coding tools and interested in using them as
    a genuine multiplier on your output.
  - Comfortable with the ambiguity, pace, and ownership of a
    three-person company.

  Nice to have

  - Experience with browser automation or web scraping.
  - Experience building with LLMs, particularly extracting
    structured data from documents.
  - Interest in regulated industries, compliance, or insurtech
    and proptech.
  - Prior experience at an early-stage startup.

  Compensation and logistics

  - $6,000/mo
  - Fully remote within the US, with meaningful overlap with
    Eastern time.
  - Contractor role
  - Strong performance can lead to a full-time offer.
  - This posting does not include a benefits package.

  Certive Inc. is an equal opportunity employer. We evaluate
  all candidates on merit and do not discriminate on the basis
  of any protected characteristic.
