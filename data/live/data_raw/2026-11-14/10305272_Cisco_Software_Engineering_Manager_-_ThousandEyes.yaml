description: |
  Meet the Team

  Cisco ThousandEyes is a Digital Experience Assurance
  platform that empowers organizations to deliver flawless
  digital experiences across every network - even the ones
  they don’t own. Powered by AI and an unmatched set of cloud,
  internet and enterprise network telemetry data, ThousandEyes
  enables IT teams to proactively detect, diagnose, and
  remediate issues - before they impact end- user experiences.

  ThousandEyes is deeply integrated across the entire Cisco
  technology portfolio and beyond, helping customers deploy at
  scale while also delivering AI-powered assurance insights
  within Cisco’s leading Networking, Security, Collaboration,
  and Observability portfolios.

  Your Impact

  You will be the Engineer Manager on the Endpoint team. Our
  goal is to ensure our customers have an unparalleled ability
  to quickly troubleshoot network issues and do long-term
  analysis of end-user experience. We equip our customers with
  complete visibility into end-user connectivity, wherever
  they may be located, whether internal or cloud apps. In this
  role you will

  - Collaborate with product, technical leaders and other
    business units to build out and deliver assurance use
    cases.
  - Lead a team to build and scale our backend infrastructure,
    which ingests, aggregates, and stores all the data our
    agents collect.
  - Lead a team of operationally minded engineers and help us
    tackle data processing and availability at scale, as our
    footprint grows.
  - Responsible for managing the individual team members' career
    growth.

  Minimum Qualifications

  - 4+ years of software engineering management experience
    leading teams of 4 or more engineers.
  - Have experience formulating a team's technical strategy and
    roadmap; you've collaborated and partnered effectively
    with several other teams to execute on shared goals.
  - 5+ years of hands-on experience building distributed
    enterprise architectures, with a proven track record of
    delivering major features from inception to production.
  - Are a strong proponent of Agile software methodologies, such
    as Scrum, and engineering principles such as Test-Driven
    Development.
  - Understand how to balance tactical needs with strategic
    growth and quality-based initiatives that can span
    multiple quarters.

  Preferred Qualifications

  - Bachelor's degree in computer science or similar.
  - Have experience driving engineering velocity by developing
    strategies to integrate AI-driven tools and autonomous
    agents effectively across the software development
    lifecycle.
  - Can ensure strong technical vision for your team and
    consistent delivery on objectives.

  Why Cisco?

  At Cisco, we’re revolutionizing how data and infrastructure
  connect and protect organizations in the AI era – and
  beyond. We’ve been innovating fearlessly for 40 years to
  create solutions that power how humans and technology work
  together across the physical and digital worlds. These
  solutions provide customers with unparalleled security,
  visibility, and insights across the entire digital
  footprint.

  Fueled by the depth and breadth of our technology, we
  experiment and create meaningful solutions. Add to that our
  worldwide network of doers and experts, and you’ll see that
  the opportunities to grow and build are limitless. We work
  as a team, collaborating with empathy to make really big
  things happen on a global scale. Because our solutions are
  everywhere, our impact is everywhere.

  We are Cisco, and our power starts with you.
