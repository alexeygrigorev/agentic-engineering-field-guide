description: |
  Software Engineer

  $135,000-$175,000

  Company Overview

  Scope Labs provides a full-service startup ecosystem focused
  on design and development of digital platforms and
  experiences. We are a team of founders consisting of
  experienced product managers, designers, and developers. Our
  expertise lies in challenging fundamental assumptions,
  dissecting legacy behaviors, simplifying intricate
  processes, and delivering experiences that leave a lasting
  impact. We are a small, but driven team and are looking to
  expand!

  Our Team

  We’re currently a small team passionate about developing the
  next generation of digital products.

  Our founding team spent the last few years building,
  designing, and scaling products at places like Google,
  Tesla, Palantir, Peloton, Scale AI, MIT, Yale, Columbia, Y
  Combinator, and more.

  We’re currently hiring for an in person role working from
  warm and sunny New York City.

  What we're looking for

  As one of the first hires at Scope Labs, you will have
  ownership over large initiatives and projects. We are
  seeking someone who doesn’t just execute on tasks assigned
  to their skillset, but ideates and innovates with us in all
  areas of the company.

  We’re looking for a 10x Full Stack Engineer who is excited
  about shaping an early company. You will be working in a
  fast-paced environment in which you will work on all stages
  of product development: discovery, conception, prototyping,
  implementation, polish, maintenance. You’ll be collaborating
  with teammates who are also incredibly passionate about
  building high-quality, design-intuitive, and data-driven
  products.

  Responsibilities

  As part of our team, you’ll move fast. Building solid user
  experiences, wiring up real-time interactions, and pushing
  out bug-fixes are all “part of the job”.

  Writing clean and efficient code that helps not only you --
  but the entire team -- deliver real value fast.

  You’ll contribute to many areas. You’ll not only work with
  product, design, and engineering, you’ll also contribute to
  them for all our customer experiences.

  You’ll shape product strategy. You’ll get to use your own
  product, talk to customers who use it, and have a direct
  impact on how our company creates and produces experiences.

  You’ll be an owner. You will work together with smart and
  ego-free people with the responsibility and freedom to
  execute. We’ll give you the space and support to excel.

  Preferred Qualifications

  - 3+ years experience as a full stack engineer.
  - Excellent knowledge of React, React Native, TypeScript, and
    Python.
  - Frontend architecture, styling, routing, and
    componentization.
  - Knowledge of how to create, deploy, and integrate APIs and
    other backend services.
  - Knowledge of agile software development methodologies, such
    as Scrum or Kanban.
  - You work with autonomy - you take ownership and are
    intrinsically motivated.
  - Strong product sense.
  - Team player and ability to work in a rapidly evolving
    environment.
  - Effective communication skills in articulating engineering
    tradeoffs and rationales.
  - Positive attitude with a desire to grow within a
    collaborative, team first environment.

  Bonus Points

  - Experience working with Supabase, Tailwind CSS, GCP tools
    and services.
  - Direct UX/UI Experience.
  - A portfolio of passion projects or past initiatives that you
    have directly built or majority was contributed by you.

  If you possess some of these skills but not all of them, we
  still encourage you to apply!

  Salary and Benefits

  The expected salary range for this role is based on job-
  related knowledge, skills, and experience.

  Salary Range: $135,000-$175,000 or monthly contract
  equivalent.

  Equal Opportunity Employer

  At Scope we take pride in our best asset, our people! We
  focus on ensuring that our culture makes life better for the
  team!

  Scope Labs is an equal opportunity employer and is committed
  to diversity in its workforce. We actively encourage
  applications from all qualified individuals regardless of
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, age, disability, veteran status,
  or any other characteristic protected by applicable law. We
  believe that a diverse and inclusive workplace fosters
  innovation and creativity, and we welcome candidates who
  share our values of respect, collaboration, and excellence.

  To perform this job successfully, the employee(s) will
  possess the skills, aptitudes, and abilities to perform each
  duty proficiently. Some requirements may exclude individuals
  who pose a direct threat or significant risk to the health
  or safety of themselves or others. The requirements listed
  in this document are the minimum levels of knowledge,
  skills, or abilities. This document does not create an
  employment contract, implied or otherwise, other than an at
  will relationship.

  To confirm you've read this far, please include the word
  "lighthouse" as the first word of your cover letter or
  application answer.
