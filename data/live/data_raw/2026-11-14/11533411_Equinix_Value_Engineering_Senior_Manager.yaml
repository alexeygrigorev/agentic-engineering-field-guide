description: |
  Who are we?

  Equinix is the world’s digital infrastructure company®,
  shortening the path to connectivity to enable the
  innovations that enrich our work, life and planet.

  A place where bold ideas are welcomed, human connection is
  valued, and everyone has the opportunity to shape their
  future.A career at Equinix means being at the center of
  shaping what comes next and amplifying customer value
  through innovation and impact. You’ll work across teams,
  influence key decisions, and help shape the path forward.
  You’ll find belonging, purpose, and a team that welcomes
  you—because when you feel valued, you’re empowered to do
  your best work.

  Job Summary

  The Senior Manager, Industry Value Engineering at Equinix is
  a highly specialized individual contributor responsible for
  developing, owning, and delivering the ROI models, business
  cases, industry insights, and value narratives that
  demonstrate the measurable impact of Equinix’s platform.
  This role blends top-tier consulting rigor, analytical
  depth, vertical expertise, and exceptional customer-facing
  communication to help customers quantify the strategic and
  financial benefits of their digital transformation and AI
  initiatives.

  This individual will play a foundational role in scaling a
  relatively new, high-caliber Value Engineering capability at
  Equinix. The ideal candidate brings strong consulting
  experience, a transformational and entrepreneurial mindset,
  and an ability to create structured, scalable tools and
  methodologies that can be leveraged across teams. They will
  partner across Marketing, Sales, Product, Industry, and
  Advisory organizations to translate business requirements
  into defensible ROI frameworks grounded in real-world
  outcomes.

  Key Responsibilities

  Value Engineering Execution & Ownership

  - Own the creation of customer-specific and industry-specific
    ROI models, TCO analyses, business cases, and value
    frameworks grounded in commercially defensible
    assumptions.

  - Translate complex customer environments, requirements, and
    industry dynamics into clear, compelling value narratives
    aligned to Equinix’s platform strategy.

  - Produce high-quality, tangible deliverables including Excel-
    based models, scenario analyses, value justification
    packs, and customer-ready storytelling assets.

  - Lead customer-facing discovery, value workshops, and
    executive presentations with confidence and credibility.

  Digital Transformation & AI Value Development

  - Apply deep experience working on digital transformation and
    AI-driven initiatives to shape customer business cases and
    value frameworks.

  - Identify where digital modernization, AI adoption,
    automation, and intelligent infrastructure create scalable
    business outcomes for customers.

  - Integrate AI-driven use cases and industry trends into ROI
    models and customer value stories.

  Industry Strategy & Vertical Insight

  - Bring vertical experience in capital markets, life sciences,
    industrial (oil and gas), or adjacent industries to shape
    industry-specific value positioning.

  - Analyze industry drivers, customer pain points, and
    ecosystem dynamics to identify meaningful value levers.

  - Work cross-functionally with Industry and Product teams to
    ensure value narratives reflect current market realities
    and customer priorities.

  Tooling, Methodology & Function Building

  - Build structured, repeatable, engineering-minded tools,
    templates, and modeling assets that scale across the Value
    Engineering function.

  - Contribute to defining methodologies, frameworks, and
    operating models used by future value engineering team
    members.

  - Apply an entrepreneurial, builder mindset to establish new
    processes and infrastructure for a rapidly forming
    discipline.

  Cross-Functional Collaboration

  - Partner closely with Marketing to shape value creation
    narratives, business justification frameworks, and
    customer-facing content that elevate Equinix’s
    differentiated industry value.

  - Work with Sales, Solutions Architecture, Advisory, Strategy,
    and Product teams to support deal cycles, strengthen
    business justification, and accelerate customer decision-
    making.

  - Ensure all value outputs reflect real customer impact and
    align to core Equinix messaging and platform value
    drivers.



  Qualifications

  Experience & Background

  - 8+ years of experience in management consulting, strategy,
    value engineering, or similar analytical roles.

  - Experience operating at the Associate or Senior Associate
    level within a top-tier consulting firm strongly
    preferred.

  - Proven experience delivering multiple customer-facing or
    strategy-heavy projects, ideally involving digital
    transformation, modernization, or AI adoption.

  - Strong business and industry acumen with the ability to
    analyze complex problem environments and quickly create
    structured frameworks.

  - Vertical exposure in Capital Markets, Life Sciences, or
    Industrial (Oil & Gas) is strongly preferred.

  - Demonstrated customer-facing experience presenting insights,
    business cases, and ROI analyses to executive
    stakeholders.

  - Track record of helping build or scale a function,
    capability, or methodology from the ground up.

  Skills & Competencies

  - Advanced mastery of Excel-based financial modeling, scenario
    analysis, and ROI/TCO development.

  - Ability to translate complex business and technical concepts
    into concise, compelling, executive-ready value
    narratives.

  - Strong communication, facilitation, and executive
    storytelling skills.

  - Ability to design structured, reusable, engineering-minded
    tools, templates, and frameworks that scale across teams.

  - Adept at operating in ambiguity and bringing clarity,
    structure, and analytical rigor to new or undefined
    problem areas.

  - Transformational mindset with an understanding of how AI and
    digital modernization create meaningful, measurable
    business value.

