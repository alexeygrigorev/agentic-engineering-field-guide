description: |
  We built Bubble with a clear mission: to empower everyone to
  create software. Our AI visual development platform lets
  anyone, from first-time entrepreneurs to enterprise teams,
  take an idea from prompt to fully-functional, scalable app
  across web, iOS, and Android. With over 6 million users in
  more than 100 countries, Bubble is breaking down the
  barriers to entrepreneurship and innovation worldwide.

  Our Product

  Bubble is the only fully visual AI app builder that lets you
  vibe code without the code to go beyond prototypes and
  launch real apps to real users. Chat with AI when you want
  speed, edit directly when you want control. Bubble's visual
  editor lets you fine-tune any detail, from the design to
  privacy rules and programming logic, so you're never stuck,
  even if AI hits its limits. Everything you need comes built
  in: a unified web and native mobile editor, enterprise-grade
  hosting, security, database management, and automatic
  scaling that grows with your business. You can build just
  about anything on Bubble, and our community is living proof.
  Mailead grew a $10K investment into a $2M valuation, and
  Faceless.video went from zero to $1M+ ARR in under a year.
  People aren't just launching products on Bubble, they're
  building real businesses. See how Bubble builders are
  shipping apps that change industries, solve problems, and
  shape the future here: Inspiring builders, breakthrough
  apps.

  Why Join Bubble Now?

  The rise of AI-generated software has validated everything
  Bubble has been building toward for over a decade. But pure
  AI-generated code is fragile, hard to debug, and rarely
  production-ready. Bubble bridges that gap, combining the
  speed of AI with a structured visual platform that produces
  stable, scalable, secure software. The people who join
  Bubble right now will help define what that means for
  millions of builders around the world. If you've ever wanted
  to work on something that genuinely changes who gets to
  build, this is your moment.

  About the Platform team:  Our Platform team executes on our
  scaling, reliability, and enablement efforts as we look to
  double our customer base over the next few years. Our scope
  includes both scalable infrastructure, and our core backend
  software systems. Success means delivering just-in-time
  capacity, running workloads quickly, and ensuring data
  scalability across numerous applications, while balancing
  costs and addressing issues like implementation and
  infrastructure inefficiencies.

  About the role:

  You’ll tackle challenges faced by the largest cloud
  providers with a small, elite team. This position offers an
  opportunity to be at the forefront of building a platform
  that is reshaping the traditional engineering stack for the
  entire world. Additionally, you'll help foster an inclusive,
  effective, and collaborative engineering culture. This role
  includes after-hours/on-call availability.

  In this role, you’ll:

  - Implement the Bubble infrastructure that can scale to
    infinitely many apps of any size and complexity
  - Improve performance and reliability across all backend
    services to scale our efficiency, capacity management, and
    data tier
  - Design and implement observability across core parts of the
    system, define and implement SLOs, and work on an
    observability platform that exposes performance
    characteristics to end users

  - Support billions of requests across a platform that supports
    arbitrary end user applications by designing, building,
    and iterating on core backbone services.
  - Build the workflow engine and scale the data tier to ensure
    reliability and scalability, supporting high-volume
    ingest, export, and workflows for diverse direct-to-
    consumer applications
  - Build our next-generation cloud infrastructure, enhancing
    reliability, scalability, and availability, along with the
    foundational services and tools required to support it
  - Participate in our triage and on-call process (along with
    the rest of the engineering team) to quickly diagnose and
    resolve issues, and implement the changes that will stop
    their recurrence

  About you:

  - Current senior engineer, or highly experienced engineer with
    5+ years of experience in software development
  - Understanding and hands-on experience with scalable
    distributed systems, including proficiency in languages
    and tools such as Node.js, Rust, PostgreSQL, Kafka and
    Terraform (AWS experience is a plus)
  - Strong problem-solving skills with a track record of
    implementing and supporting solutions that scale to
    complex and high-traffic applications
  - Excellent communication skills to effectively partner with
    teammates and managers, and the ability to commit to and
    execute priorities
  - Commitment to improving performance and reliability across
    backend services, including participation in on-call
    processes to quickly diagnose and resolve issues

  Compensation:

  We offer competitive compensation aligned to tier one
  markets. Our estimated salary for this role at Bubble ranges
  from $183,000 to $237,000. Actual pay is determined by
  multiple factors such as skills, qualifications, experience
  and market demand.

  Location:  This is a remote-friendly role open to candidates
  authorized to work in the U.S. Our team is based in NYC and
  works Eastern Time.

  We're currently set up to hire across most U.S. states.

  States we're not currently set up to employ in: AK, AL, AR,
  DE, HI, ID, IA, KS, KY, LA, ME, MT, NE, NH, NM, ND, OK, RI,
  SC, SD, VT, WV, WY. If you're in one of these states but
  open to relocating to NYC, we'd still love to hear from you.

  If you'd like to join us in New York, we're happy to help
  with relocation. We prefer hiring within commuting distance
  of our Manhattan office because we value getting together in
  person regularly — folks who come in enjoy catered lunches,
  team events, and other perks. Our Company’s Tech Stack:
  Here's what we build with. If you've worked with some of
  these, great — if not, we care more about how you think than
  which tools you've used:

  - Frontend: Typescript, SolidJS, React Native
  - Backend: Typescript, Node.js, Rust
  - AI/ML: Python, LLM APIs (OpenAI, Anthropic, etc.), LangChain
  - Infrastructure: AWS, CDK / Terraform, ECS, Redis, Postgres
  - Data & AI Workflows: JSON-based app representations,
    proprietary datasets

  Benefits:

  In addition to cash and equity compensation, Bubble offers a
  robust benefits package equating to roughly twenty thousand
  in additional annual compensation:

  Our benefits include, but are not limited to:

  - Comprehensive health coverage
  - 401(k) matching
  - Wellness and work enablement stipends
  - Generous PTO
  - A Sabbatical program

  Join us!

  Let’s democratize access to technology together! If this
  sounds like you, apply! If you don’t meet all of the
  qualifications but think you could be a match, we’d still
  love the chance to review your application. At Bubble, we
  encourage people from all ages, abilities, and experiences
  to apply. Bubble does not discriminate on the basis of race,
  color, ancestry, religion, national origin, sexual
  orientation, age, citizenship, marital or family status,
  disability, gender, gender identity or expression, pregnancy
  or caregiver status, veteran status, or any other legally
  protected status. Perhaps this job doesn't fit your
  background? Join our talent community!
