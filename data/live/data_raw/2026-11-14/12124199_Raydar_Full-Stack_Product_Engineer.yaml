description: |
  About the company

  Our client is a software company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build complete product features across the data layer,
  server logic and user interface, owning them from design
  through to production performance. Work closely with
  engineering, design and customer-facing colleagues to turn
  recurring problems into focused, lasting product
  improvements. Suited to a hands-on engineer who also brings
  product judgement to a small, fast-moving team.

  What you'll do

  - Build features end to end, spanning database models, server-
    side logic and user interfaces.

  - Monitor how shipped features perform in real use and keep
    refining them.

  - Partner with engineering, design and customer-facing
    teammates to identify recurring problems and scope lean
    solutions.

  - Design clear, transparent review and approval workflows that
    help internal teams trust automated work.

  - Build customer-facing web surfaces and hosted portals for
    external users.

  - Contribute opinions to product direction rather than only
    executing tickets.

  Requirements

  What we're looking for

  - 2 to 6 years of professional software engineering
    experience.

  - Professional experience building both the backend and data
    layer and the user interface, not frontend only.

  - Experience in an early-stage startup environment, or having
    built and launched a product of your own.

  - Professional use of TypeScript.

  - Working knowledge of SQL and relational databases such as
    PostgreSQL.

  - Strong product sense and a focus on how engineering work
    solves real customer problems.

  - Comfort in a fast-moving early-stage environment and genuine
    interest in AI as both a product and a tool.

  Bonus points

  - Founder or founding engineer experience, or side projects
    you have built and shared.

  - Product management experience on a product team.

  - Experience with React or JavaScript.

  - Experience shipping large language model or AI agent
    features.

  - Experience in a regulated industry.

  - Background at product-led AI companies.

  Benefits

  Compensation and benefits

  - Base salary: USD 165,000 to 270,000 per year

  - Equity

  - Medical and dental coverage

  Location and work model

  - New York, NY, United States

  - On-site, 5 days a week

  - Full-time
