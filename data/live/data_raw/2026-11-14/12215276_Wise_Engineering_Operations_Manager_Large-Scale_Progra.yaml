description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We’re looking for a Senior Technical Programme Manager to
  lead large-scale engineering programmes and help engineering
  tribes improve planning, prioritisation and delivery.

  You’ll turn broad priorities into clear plans, work through
  technical dependencies and help teams resolve risks and
  competing priorities. You’ll also lead technology control
  improvements, working with engineering and specialists in
  Risk, Compliance and Audit on requirements including SOX and
  IT General Controls.

  This role suits someone who takes initiative, brings
  structure to ambiguous problems and follows delivery through
  to completion. You’ll be comfortable working closely with
  engineers, challenging incomplete plans and making sure
  decisions lead to action.

  How we work

  You’ll join a small Engineering Operations team, working
  across engineering and business functions. We bring clarity
  to complex work through practical planning, clear ownership
  and consistent follow-through.

  You’ll partner with tribe leadership on planning and
  operational improvements, and coordinate delivery with
  engineering teams and control owners. Engineering teams
  retain responsibility for technical decisions, while control
  owners remain accountable for control execution and
  evidence.

  What you’ll achieve:

  - Lead complex technical programmes. Turn broad priorities
    into clear outcomes, scope, workstreams and milestones.
    Drive delivery across engineering teams, from initial
    planning and technical dependencies through rollout and
    ongoing operations.
  - Partner with engineering leaders. Support tribe-level
    planning, prioritisation and operational reviews, helping
    teams make realistic commitments and follow through on
    them.
  - Resolve risks and dependencies. Identify blockers early,
    clarify ownership and bring the right people together to
    resolve competing priorities and make decisions that keep
    delivery moving.
  - Make progress and decisions clear. Give stakeholders a
    dependable view of delivery, risks and trade-offs.
    Challenge unsupported progress updates and escalate issues
    with clear impact and practical options.
  - Deliver technology control improvements. Work with
    engineering, Risk, Compliance and Audit to translate
    control requirements, including SOX and IT General
    Controls, into practical delivery plans. Coordinate
    remediation, testing readiness and validated closure.
  - Improve how engineering operates. Use data and automation to
    reduce manual reporting and coordination. Build practical
    frameworks, guidance and training that help teams adopt
    better ways of working.
  - Make changes sustainable. Establish clear ownership,
    processes and handovers so programme outcomes and control
    improvements become part of everyday operations.

  What you’ll bring:

  - A strong track record of independently leading complex
    technical programmes across multiple engineering teams and
    business functions, with clear delivery outcomes.
  - Enough technical understanding to work through system
    dependencies, implementation constraints and rollout
    decisions with engineers.
  - Experience working closely with engineering leaders on
    planning, priorities, dependencies and operational
    improvements.
  - Experience delivering technical programmes involving
    security, technology risk, regulatory requirements or
    control improvements. You can work with specialists to
    turn requirements into engineering plans and follow them
    through to completion. Direct SOX or ITGC experience is
    valuable.
  - An understanding of control ownership, evidence requirements
    and the distinction between implementing a change and
    having it validated for closure.
  - The ability to turn ambiguous problems into clear plans,
    take ownership and drive progress without relying on
    formal authority.
  - Strong stakeholder management and the confidence to
    challenge unclear ownership, incomplete plans and
    unsupported progress claims.
  - Clear communication, including the ability to facilitate
    difficult discussions and give leaders concise updates on
    progress, risks and decisions.
  - An analytical approach, using data to identify problems,
    assess progress and improve ways of working.

  You don’t need to meet every requirement. If you bring
  strong technical programme delivery experience and relevant
  experience with risk or controls, we’d love to hear from
  you.

  Additional Information

  £92,000-£118,000k

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
