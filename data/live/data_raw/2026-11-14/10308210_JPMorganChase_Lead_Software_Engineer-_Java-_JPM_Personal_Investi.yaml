description: |
  Behind every investment is a person with ambitions,
  motivations and values. While we know that every client is
  unique, they come to J.P. Morgan Personal Investing for the
  same reason: our straightforward and transparent approach to
  investing, and the trust that 150 years of J.P. Morgan
  heritage brings.

  J.P. Morgan Personal Investing offers award-winning
  investments, products and digital wealth management services
  to over 275,000 investors in the UK. We built the business
  with innovation as a core part of our ethos to give
  consumers the confidence and clarity to make informed
  investment decisions and achieve their financial goals.

   As an Engineer at J.P. Morgan Personal Investing, you will
  be part of a team with great ambitions. We aim to build a
  top-in-market suite of mobile and web apps to provide the
  best investment experience for our clients.

  Our team is at the heart of this venture, focused on getting
  smart ideas into the hands of our customers. We're looking
  for people who have a curious mindset, thrive in
  collaborative squads, and are passionate about building
  quality software that has a big impact in a rapidly changing
  environment. By their nature, our people are also solution-
  oriented, commercially savvy and have a head for fintech. We
  work in tribes and squads that focus on specific products
  and projects.

  Job Responsibilities

  - Work with the Product team to understand user’s needs and
    follow an Agile SDLC to develop and deliver product
    features. Our stack is Java/Springboot with a bit of
    Kotlin, DynamoDB, Aurora/MySQL and AWS.
  - Participate with the rest of the team in the process of
    designing how our architecture needs to evolve to meet our
    needs. We use ADRs as part of our decision-making process
    and our architecture is microservices running on
    Kubernetes with a heavy use of Kafka and even-driven
    design.
  - Take ownership of tasks from the estimation stage right
    through until the release stage and post production
  - Identify, troubleshoot and resolve existing or newly-
    identified prioritised defects
  - Write tests for all code you deliver and adhere to best
    practices/standards, ensuring high-quality code
  - Take ownership of, or assist others with, releases and
    associated processes (we try to deploy as often as
    possible)
  - Participate in code reviews, ensuring high code quality and
    continuous development and learning for yourself and your
    colleagues
  - Be someone who enjoys knowledge sharing, who is keen to
    attend and participate in some of the many skill share
    sessions we regularly hold in the team and across the
    wider Engineering department.
  - Propose/contribute/collaborate on Technical Initiatives -
    improving and evolving the existing codebase and toolset
  - Be keen to ensure that we focus on solving the essence of
    the problem rather than merely dealing with the symptoms
  - Drives team adoption of enterprise-authorized AI-assisted
    engineering practices within the work environment to
    improve code quality, delivery speed, and operational
    outcomes (e.g., AI-assisted code review/refactoring, test
    strategy acceleration, incident/root-cause analysis
    support), while establishing consistent validation
    standards (secure coding, peer review, automated testing)
    and promoting reuse of effective patterns across the team.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.



  Required qualifications, capabilities and skills

  - English working proficiency is a must, you will be working
    with the team in London
  - You have a product engineer mindset and a track record of
    delivering high quality software that adjusts to business
    and product needs to provide a great user experience in a
    timely manner
  - Experience with a JVM language (Java/Scala/Kotlin) and
    Springboot
  - Experience designing systems from scratch as well as
    understanding how to evolve existing architectures to
    achieve new goals, both serverless and managed in the
    cloud
  - Hands-on experience designing and implementing event-driven
    architectures with different message brokers, including
    Kafka
  - Experience with monitoring and alerting in order to maintain
    a production environment
  - Good understanding of REST and what it means to work with
    APIs
  - Experience with Git flow
  - Good communication skills, you can work well within a
    delivery team and manage interactions with other parts of
    the organisation, such as Product and Operations
  - Curious about new ways of working and open to different
    approaches and ideas
  - Proactive and willing to help others put forward ideas
  - Demonstrated experience leading effective use of approved
    AI-assisted software development tools (e.g., for coding,
    code review, test acceleration, troubleshooting) with the
    ability to set team expectations for validating AI outputs
    for correctness, performance, and security.
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    engineers on safe, compliant adoption within delivery
    practices



  Preferred qualifications, capabilities and skills- nice to
  haves

  - Experience with DynamoDB and/or Aurora
  - Experience in the FinTech sector
  - Experience developing a multi-country product with multiple
    localizations and currencies.
  - Show us your Github/Stack Overflow/app portfolio!



