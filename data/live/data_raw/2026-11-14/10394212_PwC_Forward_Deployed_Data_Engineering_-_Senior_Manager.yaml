description: |
  The Opportunity As a Forward Deployed Data Engineering -
  Senior Manager, you will be at the forefront of developing
  innovative software solutions to drive digital
  transformation and enhance business performance. Within our
  Tax practice, you will combine technical experience with
  creative thinking to deliver software products that
  revolutionize industries and provide exceptional user
  experiences. As a Senior Manager, you will leverage your
  skills, influence, and professional networks to deliver
  quality results. You will motivate and coach teams to solve
  complex problems, applying sound judgment to recognize when
  to take action and when to escalate. Your ability to develop
  and sustain diverse and inclusive teams, along with your
  commitment to excellence, contributes to the success of our
  firm. In this role, you will focus on designing, coding, and
  testing applications that meet the evolving needs of
  clients. You will craft and convey clear, impactful messages
  that tell a holistic story, applying systems thinking to
  identify underlying problems and opportunities. By
  validating outcomes with clients and sharing alternative
  perspectives, you will drive project success. Your role will
  involve directing teams through complexity, demonstrating
  composure in challenging situations, and initiating open and
  honest coaching conversations at all levels.
  Responsibilities
  - Leading the development and implementation of innovative
    software solutions to drive digital transformation
  - Managing and guiding teams in the design, coding, and
    testing of applications that enhance user experiences
  - Utilizing skills in software engineering to deliver cutting-
    edge products that meet client needs
  - Collaborating with stakeholders to identify functional
    requirements and translate them into technical
    specifications
  - Conducting code reviews and confirming adherence to coding
    standards and best practices
  - Applying analytical thinking and problem-solving skills to
    troubleshoot and debug complex issues
  - Building and maintaining client relationships to understand
    and address their evolving needs
  - Promoting a culture of creativity and innovation within the
    team to foster rapid experimentation and learning
  - Coaching and mentoring team members to develop their skills
    and achieve project goals
  - Validating outcomes with clients and incorporating feedback
    to improve software solutions
  What You Must Have
  - At least a Bachelor's degree
  - At least 6 years of experience
  What Sets You Apart
  - Excelling in client management and relationship building
  - Demonstrating advanced analytical thinking and problem-
    solving skills
  - Utilizing coding standards and conducting thorough code
    reviews
  - Innovating through rapid experimentation and creativity
  - Applying systems thinking to identify opportunities
  - Leading teams through complex and ambiguous situations
  - Communicating effectively to convey impactful messages
  The salary range for this position is: $124,000 - $335,000.
