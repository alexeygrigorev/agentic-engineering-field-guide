  Senior Software Engineering - Dataplane

  Meet the Moment with Alteryx We're living through a once-in-
  a-generation shift in how work gets done. Data, automation,
  and AI are quickly becoming the center of every business
  decision - and Alteryx is leading the transformation. You'll
  be working on the challenges that sit at the heart of modern
  business. No matter your role, the work you do will help
  organizations move faster, see more clearly, and tackle
  questions that used to feel impossible.

  If you're ready to meet the moment with innovation,
  curiosity, and excellence, there's a place for you here.

  Alteryx is searching for a Senior Software Engineer. This
  position is remote-friendly.

  Position Overview We are looking for a Senior Software
  Engineer to join our high-performing Data Plane Platform
  team, building the foundation of Alteryx's next-generation
  cloud platform. This is a full-stack engineering role. The
  primary backend language is Go, with a focus on building
  scalable services, APIs, and distributed systems. You'll
  also contribute across the stack using React and TypeScript
  to build customer-facing platform management experiences.

  Required Qualifications

  - Bachelor's degree in Computer Science, Engineering, or a
    related field, or equivalent practical experience.
  - 5+ years of professional software development experience.
  - Strong experience building backend services using Go, REST
    APIs, and distributed systems.
  - Experience developing and operating production cloud
    applications on AWS or GCP.
  - Experience with JavaScript/TypeScript and React or a similar
    frontend framework.
  - Familiarity with microservices, event-driven architectures,
    and cloud-native application design.
  - Experience with testing, CI/CD pipelines, Git, and modern
    software development practices.
  - Ability to troubleshoot issues across application code,
    cloud infrastructure, and production environments.
  - Strong communication, collaboration, and problem-solving
    skills with an ownership mindset.

  Nice to Have

  - Experience with Kubernetes, Docker, Helm, Terraform, or
    Infrastructure as Code.
  - Experience with messaging technologies such as Kafka, Redis,
    or Pub/Sub.
  - Experience building cloud provisioning, orchestration, or
    platform management systems.
  - Familiarity with observability, monitoring, and distributed
    tracing tools.
  - Experience with multi-tenant SaaS platforms, workflow
    orchestration, or cloud infrastructure.
  - Experience contributing to system architecture, technical
    design, and engineering best practices

  Compensation:

  The salary range for this role varies based on the
  geographic location of the position. The ranges below
  represent the expected base salary for candidates hired in
  the applicable locations:

  - Zone A: New York (statewide), Arlington, VA, Northern
    California, Washington, DC, Massachusetts (statewide), and
    Seattle, WA — $130,000–$175,000
  - Zone B: All other U.S. locations — $120,000–$160,000

  Actual compensation will be determined based on a variety of
  factors, including the candidate’s skills, experience,
  qualifications, geographic location, and other business and
  organizational considerations.

  Employees may also be eligible for a wide range of other
  benefits, such as a bonus or commission, medical,
  retirement, financial, wellness, time off, employee
  discounts, and others.

