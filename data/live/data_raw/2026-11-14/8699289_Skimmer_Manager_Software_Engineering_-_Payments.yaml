description: |
  Skimmer is on a mission: to modernize the pool and spa
  service and repair industry. We’re a private equity-backed
  company with 6000+ customers using Skimmer’s pool service
  platform to transform their businesses. But we’re not
  stopping there (there are over 70,000 pool service companies
  in this surprisingly large “niche” space).

  Our customers love us almost as much as we love them (check
  out our reviews and our NPS score of 68!)

  We were recently honored to join the Inc. 5000 list of
  fastest-growing companies, the Deloitte Fast 500, were named
  one of Built In Austin's Best Startups, as well as Austin's
  Best Places for Working Parents.

  We’re looking for big thinkers with small egos, so let’s
  dive in!

  Our Values: At Skimmer we

  - Realize our customers' success is our success.
  - Build humble, diverse teams who have fun winning.
  - Drive results with urgency.
  - Earn trust through transparent communication.

  Who are you? / About You:

  Skimmer is looking for a player/coach technical leader for
  our Payments and Finance Development team. You will be
  responsible for leading a small team of developers and
  contributing code that improves our platform's operations
  around credit card processing, payment gateways, and
  financial integrations. You will report to the VP of
  Engineering and partner closely with Product, Finance,
  Customer Success,, and Support stakeholders.

  The Payments and Finance Development Team owns all financial
  aspects of the Skimmer platform and mobile app, including
  credit card processing, payment gateways, and integration
  with accounting platforms. They own metrics like payment
  success rate, transaction security, and finance system data
  integrity. A separate team owns the Stripe integration for
  subscribing to Skimmer. This role owns the finance
  integrations that our customers use.

  Your number 1 goal in this role is to ensure a secure,
  reliable, and compliant payments and financial ecosystem.

  The ideal candidate will have strong hands-on experience
  with API-based, real-time integrations, especially focusing
  on Stripe credit card processing and finance systems. As a
  player/coach, you will ensure technical excellence while
  leading a small team. Proficiency in leveraging AI tools to
  enhance team productivity and code quality is a significant
  plus. Your role is critical in ensuring secure, reliable,
  and compliant financial operations within the Skimmer
  platform.

  You will be joining a company with a collaborative culture,
  focus on customers, and emphasis on having a good time
  together! 🏊

  What you'll do:

  - Lead and manage a small team of development engineers,
    acting as a player/coach to mentor and contribute
    technically.
  - Be the internal technical expert on Skimmer's payments and
    finance systems, including Stripe credit card processing.
  - Drive the integration and maintenance of financial and
    accounting platforms (e.g., QuickBooks Online) to ensure
    data accuracy and compliance.
  - Utilize AI tools and best practices to maximize the
    productivity and efficiency of your development team.
  - Assist in vendor selection for payment gateways and
    financial solutions.
  - Develop and implement secure, reliable APIs and systems for
    all payment and finance-related functionality.
  - Oversee security and compliance for payment card industry
    data (PCI DSS).

  Early Projects (first 90 days):

  - Lead the migration or upgrade of our core Stripe credit card
    processing system to the latest API standards.
  - Scope and initiate the integration with QuickBooks Online or
    a similar accounting platform.
  - Review and enhance our current PCI compliance posture and
    data security protocols.

  Your Experience:

  - Experience in a technical leadership or lead player/coach
    role leading a development team’s prioritized workload at
    a SaaS startup.
  - Proven expertise building API integrations for SaaS
    products, specifically in the credit card processing and
    finance domain.
  - Deep, hands-on expertise with Stripe credit card processing
    and payment gateways.
  - Experience integrating with accounting platforms like
    QuickBooks Online, Xero, or similar .
  - Proficiency leveraging and implementing AI tools (preferably
    Claude) for development productivity.
  - Expertise developing in C# and proficient with Microsoft
    SQL.
  - Strong business acumen and an understanding of tax,
    accounting, and payment compliance (e.g., PCI DSS).
  - High emotional intelligence (EQ) and a track record of
    leading successful cross-functional projects.

  Benefits

  - Competitive base pay + bonus potential
  - Generous medical, dental, and vision plans (we pay 100% of
    your premium and 50% of your dependents’)
  - Fantastic culture with a very strong eNPS- we work hard,
    celebrate wins, and learn as we go to always be improving
    to benefit our customers.
  - Immediate access to 401(k) with company match
  - Flexible PTO (MINIMUM of 10 days required every year)
  - 12 weeks paid parental leave for birthing parent, 6 weeks
    paid leave for supporting partner
  - Remote work friendly
  - Comprehensive learning and development budget
  - A manager dedicated to your development

  At Skimmer we are deeply committed to building a diverse and
  inclusive workplace (it’s in our values). We’re proud to be
  an equal opportunity employer, seeking to identify and
  onboard people from all walks of life. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, gender, gender identity or
  expression, family status, marital status, sexual
  orientation, national origin, genetics, neurodiversity,
  disability, age, or veteran status, or any other non-merit
  based or legally protected grounds.

  We also acknowledge that there is no “perfect” candidate -
  if you fulfill the majority  of these requirements, believe
  this is a role you would be excited about on a daily basis,
  and resonate with our culture, we encourage you to apply.

