description: |
  ABOUT AARU

  Aaru operates at the frontier of predictive intelligence,
  using AI to simulate and predict human behavior at scale. By
  generating and deploying instances of artificial
  intelligence that mirror humans, called agents, Aaru
  simulates entire populations with unprecedented accuracy.
  Our partners use Aaru to refine strategic positioning,
  identify and understand high-value audiences, validate
  concepts and messaging before launch, optimize pricing
  decisions, and build a continuously richer understanding of
  their customers through simulation. We provide organizations
  with invaluable foresight, empowering them to anticipate
  outcomes and proactively make the right decisions at the
  right time, every time.

  We're a small, dedicated, mission-driven team and we intend
  to stay that way. We believe the best work happens when
  exceptionally talented people are given ownership, trust and
  the space to operate without bureaucratic friction. We work
  with urgency and intellectual honesty and expect new team
  members to match our velocity. We seek individuals who
  thrive at the frontier, who push beyond conventional limits,
  who bring curiosity and conviction in equal measure, and who
  want their work to have demonstrable impact in the world. If
  you're energized by the idea of a small team doing things
  that feel impossible, let’s build together.

  The role

  The Platform team makes Aaru’s simulations usable. It builds
  the APIs, workflows, and interfaces customers use to
  configure simulations, run them, and interpret the results.
  You will lead that team. Managers at Aaru remain engineers.
  You will set technical direction, make architecture
  decisions, write code, hire the team, and be accountable for
  the quality and pace of what it ships.

  What you will do

  - Build and lead a team of Members of Technical Staff.
  - Help set the platform roadmap with Product and Research.
  - Make key architecture decisions, review critical designs,
    and work directly on the hardest technical problems.
  - Turn new research into reliable product capabilities that
    customers can use independently.
  - Hire exceptional engineers, from the first interview through
    the close.
  - Set clear priorities, make credible commitments, and
    deliver.

  You might be a good fit if

  - You built and operated production systems as a senior
    engineer before becoming a manager.
  - You have led a team of four to ten engineers that delivered
    production systems.
  - You reduce complexity in architecture, code, process, and
    scope.
  - You give clear feedback early and address performance
    problems promptly.
  - You want to work in person in New York with a team that
    moves quickly.

  Strong candidates may also have

  - Experience with developer platforms, APIs, or products built
    on ML/AI systems.
  - Time as a founder or early engineer at a fast-growth
    startup.
  - A track record of close work with research teams.

  Compensation and benefits

  Base salary of $280,000–$425,000, equity, and full benefits.
  Final level and compensation depend on experience and sit
  within our internal bands.
