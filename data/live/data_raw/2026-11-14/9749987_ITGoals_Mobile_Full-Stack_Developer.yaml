description: |
  Company Overview

  ITGOALS is a dynamic and innovative company committed to
  driving growth and delivering exceptional digital solutions.
  We foster a collaborative and inclusive work environment
  where creativity and technical excellence thrive.

  Job Title

  Mobile Full-Stack Developer

  Location

  New Cairo, Egypt (with international collaboration)

  Years of Experience

  3 –5 years

  Job Description

  - Design and development of mobile applications for iOS and
    Android cross-platform frameworks) within MOAP Delivery
    scope.
  - Implementation of new features and changes based on user
    stories and technical specifications.
  - Participation in design and refinement of solution
    architecture and APIs together with architects and backend
    developers.
  - Execution of code reviews and adherence to coding standards,
    security and performance guidelines.
  - Resolution of defects identified during testing and UAT.
  - Contribution to estimation, technical feasibility analysis
    and Proofs of Concept.
  - Maintenance of source code, unit tests and technical
    documentation.
  - Close cooperation with testers, UX/UI specialists, analysts
    and DevOps engineers to deliver high quality mobile
    solutions.

  Key Responsibilities

  - Develop and maintain responsive, user-friendly web
    interfaces using modern front-end technologies.
  - Build and maintain back-end services and RESTful APIs to
    support product features and integrations.
  - Translate UI/UX designs into high-quality, accessible, and
    performant front-end implementations.
  - Integrate front-end components with back-end APIs and ensure
    smooth end-to-end functionality.
  - Design, implement, and optimize database schemas, queries,
    and data access patterns as needed.
  - Write clean, maintainable code with appropriate testing and
    documentation.
  - Collaborate with product, design, QA, and engineering
    teammates to refine requirements and deliver features
    iteratively.
  - Troubleshoot, debug, and resolve issues across the stack,
    including performance and reliability concerns.
  - Participate in code reviews and contribute to improving
    engineering standards and best practices.

  Required Skills & Qualifications

  - 0–5 years of experience in web development (front-end, back-
    end, or full-stack).
  - Solid understanding of HTML, CSS, and JavaScript/TypeScript
    fundamentals.
  - Experience with at least one modern front-end framework
    (e.g., React, Angular, or Vue).
  - Experience building back-end applications with at least one
    server-side technology (e.g., Node.js, .NET, Java, Python,
    or PHP).
  - Understanding of API design principles (REST),
    authentication/authorization basics, and secure coding
    practices.
  - Familiarity with relational databases (e.g., PostgreSQL,
    MySQL, SQL Server) and/or NoSQL databases.
  - Comfort with Git-based workflows and collaborative
    development practices.
  - Strong problem-solving skills, attention to detail, and
    ability to communicate clearly with technical and non-
    technical stakeholders.

  Nice to Have

  - Experience with state management, component libraries, and
    front-end performance optimization.
  - Experience with testing practices (unit/integration/e2e) and
    tools (e.g., Jest, Cypress, Playwright).
  - Familiarity with CI/CD pipelines and deployment workflows.
  - Exposure to cloud platforms and containerization (e.g.,
    AWS/Azure/GCP, Docker).
  - Experience with microservices, message queues, or real-time
    features (e.g., WebSockets).
  - Understanding of accessibility standards (WCAG) and
    internationalization (i18n).

  What Success Looks Like

  - Features are delivered end-to-end with high quality, clear
    acceptance criteria, and minimal rework.
  - User interfaces are responsive, accessible, and performant
    across modern browsers and devices.
  - APIs and services are reliable, secure, and well-documented
    for internal and external consumers.
  - Bugs are diagnosed efficiently, root causes are addressed,
    and improvements are shared with the team.
  - Collaboration is strong—requirements are clarified early,
    and progress is communicated transparently.

  Additional Information

  This role offers the opportunity to work on impactful
  projects with international collaboration, learn from
  experienced teammates, and grow your skills across both
  front-end and back-end development in a supportive,
  delivery-focused environment.
