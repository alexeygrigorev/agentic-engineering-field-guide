description: |
  About Logicbroker, Inc.

  Logicbroker is the Agentic Commerce Orchestration Engine
  helping enterprise retailers, brands, suppliers, and
  distributors connect and grow. Our Intelligent Commerce
  Network powers over $10B in GMV for global leaders like
  Samsung, Walgreens, and Home Depot by automating the entire
  process from discovery to doorstep and stock to dock. We
  make products discoverable, shoppable, fulfillable, and
  returnable so our clients can grow faster, delight
  customers, and run smarter operations.

  Job Summary Job Summary

  We're looking for a Software Engineer to build and maintain
  features across our commerce platform, working within one of
  our core stacks (.NET, Python/Django, or Go) depending on
  team assignment. You'll implement well-tested code against
  established architectural patterns, collaborate with senior
  engineers to strengthen your technical expertise, and
  leverage AI-assisted development tools as an integral part
  of your work.

  At Logicbroker, AI-driven development isn't a future
  initiative. Our engineering team has been an early adopter,
  building its own AI implementations and integrating emerging
  technologies into everyday development workflows well ahead
  of broader industry adoption. We're looking for engineers
  who are excited to join a team that's already putting AI
  into practice and continuously pushing the boundaries of how
  software is built.

  Work Authorization: Applicants must be legally authorized to
  work in the United States. Logicbroker is unable to provide
  employment visa sponsorship for this position, now or in the
  future.

  What You'll Do:

  - Design, build, and test features within an assigned domain
    (order management, catalog, invoicing, connectors, etc.)
    under the guidance of senior engineers and the team's
    technical lead.
  - Write clean, well-tested code following existing patterns
    and conventions; contribute to code review for peers.
  - Use AI coding assistants (e.g., GitHub Copilot, Claude Code)
    as a core part of your daily workflow for scaffolding,
    test generation, documentation, and navigating unfamiliar
    or legacy code.
  - Critically evaluate AI-generated code and suggestions before
    merging: verify correctness, security, and fit with
    existing domain models rather than accepting output at
    face value.
  - Participate in the full development lifecycle: requirements
    analysis, implementation, testing, deployment, and
    monitoring.
  - Diagnose and resolve bugs and production issues, escalating
    appropriately when root cause requires senior/staff
    involvement.
  - Contribute to technical documentation and runbooks for the
    features you build.
  - Collaborate with Product, QA, and other engineers to
    translate requirements into working software.
  - Participate in on-call rotation and incident response.

  What We Need:

  - Bachelor's degree in Computer Science or related field, or
    equivalent practical experience.
  - 1–4 years of professional software development experience
    (internship or academic project experience considered for
    candidates at the lower end of this range).
  - Working proficiency in at least one of: C#/.NET, Python, or
    Go.
  - Demonstrated comfort using AI coding assistants as part of a
    development workflow, with the judgment to verify rather
    than blindly trust their output.
  - Understanding of REST APIs and relational databases (e.g.,
    Postgres, MSSQL).
  - Familiarity with git-based version control and code review
    workflows.
  - Strong problem-solving skills and willingness to ask for
    help/escalate appropriately.
  - Clear written and verbal communication.

  Preferred Skills

  - Exposure to cloud platforms (AWS, Azure) and containerized
    environments (Docker, Kubernetes).
  - Familiarity with EDI, dropship, or marketplace integration
    concepts.
  - Experience with automated testing frameworks and CI/CD
    pipelines.

  Why Logicbroker:

  Mission-Driven Culture: Be part of a company transforming
  digital commerce through innovation and agility—your work
  directly shapes how global brands connect with customers.

  Collaborative, No-Ego Environment: We believe the best ideas
  win, not the loudest voices. You’ll work alongside teammates
  who challenge and support each other.

  Flexibility with High-Performance Energy: Whether remote or
  in-office, we foster autonomy and accountability—because we
  trust you to own your success.

  Leadership That Listens: Our executives are not just
  accessible—they’re invested in your growth, open to your
  ideas, and committed to building a company where people
  thrive.

  Celebrated Wins, Shared Learnings: From team offsites to
  Slack shoutouts, we celebrate progress and learn from
  setbacks together
