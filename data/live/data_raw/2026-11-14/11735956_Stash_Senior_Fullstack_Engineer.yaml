description: |
  Want to help everyday Americans invest and build wealth?
  Financial inequality is increasing, and too many people are
  getting left behind. At Stash, we’re passionate about
  democratizing wealth creation through education, advice, and
  products that help customers achieve greater financial
  freedom. We also believe in working smarter—leveraging AI
  and emerging technologies to move faster, operate more
  efficiently, and focus our time on solving meaningful
  problems for our customers.

  We’re looking for a Senior Fullstack Engineer to lead our
  B2B efforts for the StashWorks product.

  StashWorks is an emerging B2B distribution channel that
  connects employees of partner companies with Stash products
  and benefits. You’ll join a small, highly collaborative team
  building and scaling the platform from the ground up.

  You’ll own projects across partner onboarding, employee
  eligibility and enrollment, identity and authentication,
  third-party integrations, lifecycle communications, and the
  operational tools needed to support employer partners.

  What you'll do:

  - Act as an "Agent Conductor" to architect, design, and
    rapidly implement services by leveraging AI coding
    assistants.
  - Own the end to end delivery of software from inception to
    production
  - Instrument, test, profile, and code review software
  - Continuously deploy to our cloud-based infrastructure
  - Scale software infrastructure for a quickly-growing user
    base

  What we're looking for:

  - 4-7 years of professional experience building software
  - Proven hands-on experience with AI tools (e.g., Cursor,
    ChatGPT, etc.) as a core part of daily workflows, driving
    productivity and enhancing output quality, alongside a
    commitment to continuously developing AI expertise
  - Thrives in ambiguous, early-stage environments
  - Can move comfortably across services and codebases
  - Writes pragmatic, maintainable Go
  - Has experience designing APIs and integrating external
    systems
  - Understands production operations, observability, security,
    and reliability
  - Works effectively with product, operations, marketing, and
    partner-facing teams
  - Balances shipping quickly with building systems that can
    scale

  Gold Stars:

  - Experience building applications at scale
  - Familiarity with or interest in Consul, multi-region
    systems, multi-cloud design
  - Familiarity with or interest in other areas of our stack
    including Spinnaker, CI/CD pipelines, Nginx, TypeScript,
    React, Node.js, Postgres, SNS/SQS, AWS

  #LI-HYBRID

  Our Commitment to Diversity, Equity, and Inclusion

  We proudly celebrate the unique qualities that make you you,
  365 days a year, and not just because it’s the right thing
  to do or good for business. We embed the principles and
  practices of diversity, equity, and inclusion (DEI) into all
  that we do to prioritize people, a Stash core value, and to
  ensure Stashers of all backgrounds and experiences can be
  their authentic selves.

  We are also proud to be the first and only venture-backed
  fintech to join the CEO Action for Diversity & Inclusion™,
  and as an Equal Opportunity Employer, Stash is committed to
  building an inclusive environment for people of all
  backgrounds.

  If you require any reasonable accommodations to make your
  application process more accessible, please reach out to
  recruiting@Stash.com.

  Helping You Invest in Yourself

  - Comprehensive total rewards package, comprising compensation
    (salary and equity) and health care benefits
  - Complimentary subscription to Stash+ account
  - Hybrid Work Policy – We operate a hybrid work environment in
    NYC that prioritizes time together in the office to
    strengthen teamwork, innovation, and culture, while still
    allowing for work-from-home flexibility.
  - Flexible PTO
  - Work-from-home equipment stipends; home internet subsidy
  - Paid Parental Leave (offerings for birth giving and non-
    birth giving parents) Primary & Secondary
  - Enhanced health and wellness benefits through One Medical,
    Gympass, and Maven Health

  External Recognition for Stash

  - Benzinga’s 2023 Best Brokerage for Beginners and Best Robo-
    Advisor Awards
  - Qorus-Accenture’s 2023 Banking Innovation Awards
  - USA Today and Statista’s 2023 Top 500 Best Financial
    Advisory Firms
  - Comparably's Best Company Awards: Best Places to Work, Best
    Company Outlook, and Best Engineering Team for Diversity,
    Women, Culture, and more! (2023)
  - Fintech Breakthrough Award: Best Personal Finance App (2023)
  - BuiltIn’s Best Places to Work (2022, 2021, 2020, 2019)
  - Forbes Fintech 50 (2021, 2020, 2019)
  - Best Digital Bank, Finovate Awards (2020)
  - Tearsheet Challenge Awards, Best Banking Card Product -
    Stock-Back® Card, 2020
  - LendIt Fintech Innovator of the Year (2020, 2019)

  Salary Range: $170,000 - $190,000

  The base salary range represents the reasonably anticipated
  low and high end of the salary range for this position.
  Actual salaries will vary and will be based on various
  factors, such as the candidate’s qualifications, skills,
  experience and competencies, as well as internal equity and
  alignment with market data for companies of our size and
  industry.

  **No recruiters, please**
