description: |
  About Us

  YipitData is the leading market research and analytics firm
  for the disruptive economy and most recently raised $475M
  from The Carlyle Group at a valuation of over $1B. Every
  day, our proprietary technology analyzes billions of
  alternative data points to uncover actionable insights
  across sectors like software, AI, cloud, e-commerce,
  ridesharing, and payments.

  Our data and research teams transform raw data into
  strategic intelligence, delivering accurate, timely, and
  deeply contextualized analysis that our customers — ranging
  from the world's top investment funds to Fortune 500
  companies — depend on to drive high-stakes decisions.

  We operate globally with offices in the US (NYC, Austin,
  Miami, Mountain View), APAC (Hong Kong, Shanghai, Beijing,
  Guangzhou, Singapore), and India. Our award-winning, people-
  centric culture — recognized by Inc. as a Best Workplace for
  three consecutive years — emphasizes transparency,
  ownership, and continuous mastery.

  What It's Like to Work at YipitData

  YipitData isn't a place for coasting — it's a launchpad for
  ambitious, impact-driven professionals. From day one, you'll
  take the lead on meaningful work, accelerate your growth,
  and gain exposure that shapes careers.

  - Ownership That Matters: You'll lead high-impact projects
    with real business outcomes
  - Rapid Growth: We compress years of learning into months
  - Merit Over Titles: Trust and responsibility are earned
    through execution, not tenure
  - Velocity with Purpose: We move fast, support each other, and
    aim high — always with purpose and intention

  About The Role

  We're looking for a seasoned, high-output engineer who can
  operate within our product portfolio — from our Public
  Investor platform and Signals application to our AI-powered
  customer insights agent. You'll execute on well-defined
  work, but the expectation is that you go well beyond that —
  proactively identifying opportunities, improving systems,
  and driving outcomes that move the business forward.

  You'll be responsible for production-grade systems that our
  customers and internal teams depend on daily. That means
  being responsive, reliable, and an excellent communicator —
  both when things are going well and especially when they're
  not.

  The ideal candidate treats AI coding tools as core
  infrastructure for how they work — not a novelty. You've
  shipped full-stack applications, you're comfortable
  navigating ambiguity, and you have a bias toward action that
  compounds across a small team.

  This is a remote-friendly opportunity that can sit in NYC
  (where our headquarters are located), one of our office hubs
  (Austin, Miami, or Mountain View), or anywhere else in the
  US. However, depending upon where the remote work is
  performed, income could be subject to New York State tax
  withholding.

  As a Senior Software Engineer, You Will

  - Own features and systems end-to-end across multiple product
    surfaces — architecture, implementation, deployment, and
    iteration
  - Design systems that are clean, maintainable, and built to
    scale — you know how software should be structured
  - Work directly with stakeholders across engineering, product,
    data, revenue, and customers to translate business
    problems into shipped software
  - Drive initiatives across teams — you're not waiting for a PM
    to write a spec; you're in the room shaping what gets
    built and why
  - Use AI tools (Claude Code, Cursor, Codex) as a daily force
    multiplier — for implementation, code review, testing,
    documentation, and exploration
  - Operate across the full stack: backend services, frontend
    applications, data pipelines, and infrastructure
  - Make pragmatic technical decisions that balance speed,
    quality, and maintainability in a fast-moving environment
  - Raise the bar for the engineering team through code quality,
    tooling improvements, and knowledge sharing

  You Are Likely To Succeed If

  - You have 4+ years of hands-on software development
    experience with a proven track record of shipping
    customer-facing applications — and the impact to show for
    it
  - You are stack-flexible: comfortable working across Python,
    TypeScript/React, and cloud infrastructure (AWS,
    Databricks). You learn new tools fast and don't let
    unfamiliar tech slow you down
  - You have an AI-accelerated workflow — you actively use AI
    coding tools to ship faster, not as an experiment, but as
    how you work every day
  - You thrive in ambiguity — you can take a vague business
    problem, break it down, and deliver a working solution
    without heavy-handed direction
  - You are a strong communicator who can work directly with
    non-technical stakeholders, translate between business
    needs and engineering tradeoffs, and drive alignment
  - You are responsive and reliable — you take ownership of
    production systems and communicate proactively, especially
    under pressure
  - You have a bias toward action and ownership — you see a
    problem, you fix it; you see an opportunity, you ship it
  - You hold a Bachelor's or Master's degree in Computer
    Science, STEM, or a related technical discipline

  What We Offer

  Our compensation package includes comprehensive benefits,
  perks, and a competitive salary:

  - Flexible work hours, flexible vacation, a generous 401K
    match, parental leave, team events, wellness budget,
    learning reimbursement, and more
  - Your growth at YipitData is determined by the impact you
    make, not by tenure, unnecessary facetime, or office
    politics
  - The annual on-target earnings for this position is
    anticipated to be up to $170K - $190K. The final offer may
    be determined by a number of factors, including, but not
    limited to, the applicant's experience, knowledge, skills,
    abilities, as well as internal team benchmarks

  This role may be performed fully remotely within the United
  States. Please note that for this position, we are not able
  to consider candidates who currently or in the future will
  require visa sponsorship.

  We are committed to equal employment opportunity regardless
  of race, color, ancestry, religion, sex, national origin,
  sexual orientation, age, marital status, disability, gender,
  gender identity or expression, or veteran status. We are
  proud to be an equal opportunity employer.

