description: |
  This role is for a hands-on embedded software engineer
  focused on building the high-speed optical transport systems
  powering modern Data center Interconnect networks. You will
  be developing embedded software and firmware that links
  massive GPU clusters and data centers for ultra-low latency.


  Responsibilities

  Role Responsibilities

  - Write real-time embedded software and firmware for optical
    transport systems.
  - Own project from initial requirement through design,
    integration, and verification.
  - Diagnose and resolve complex, system-level issues across
    software, hardware, optics, and FPGAs.

  Qualifications

  Required Skills & Experience

  - Extensive C and C++ development on RTOS based platforms.
  - Deep understanding of timing-critical operations, interrupt-
    handling, low level drivers, and control firmware.
  - Proven experience designing and integrating hardware
    interfaces and inter‑processor communication mechanisms in
    multi‑processor systems.
  - Experience with ARM architecture, hardware interactions, and
    FPGA/CPLD integration.

  Education and Experience

  - 1–3 years of relevant industry experience with a bachelor’s
    degree in science, Technology, or Engineering.

