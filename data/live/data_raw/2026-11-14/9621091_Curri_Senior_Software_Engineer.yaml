description: |
  About the role:

  Curri is seeking a Senior Software Engineer to join the
  Technology team as a Product Engineer with real ownership
  over outcomes. Curri runs last-mile logistics for national
  retailers and industrial suppliers across the US, and our
  engineering bar is moving up: we need engineers who pick up
  a problem, scope it themselves, talk to the stakeholder
  living it, and ship without waiting for a perfect spec. In
  this role, you will work in weekly shipping loops across the
  full stack, use AI tooling as a daily force multiplier, and
  leave measurable evidence of your impact in every system you
  touch.

  What you will do:

  - Own engineering problems end-to-end: talk to the
    stakeholder, scope the solution, ship to production,
    measure results, and iterate without waiting for a fully-
    formed ticket.
  - Ship multiple surfaces per quarter in weekly loops, with a
    clean answer to "what shipped this week and what did it
    tell us?" every cycle.
  - Build across the full stack as the problem demands,
    including backend services in TypeScript, Node, Postgres,
    NATS, and Redis alongside customer-facing or internal UI
    in React and React Native.
  - Use AI tooling fluently every day, including Claude Code in
    plan and edit modes, Cursor, and Claude for design and
    code review, and take full ownership of everything you
    ship with it.
  - Make architectural decisions that scale, leave systems
    better than you found them, and partner with Platform and
    Infrastructure to move the codebase in the right
    direction.
  - Get context directly from the people closest to the problem
    — PMs, ops, drivers, customers — ask the hard scope
    questions early, and keep cross-functional stakeholders
    informed throughout

  What you need to have:

  - 6+ years of experience building production software with a
    product engineer mindset: comfortable with broad scope and
    little spec, with the expectation that you will define the
    work rather than wait for it to be handed to you.
  - Full-stack range across backend systems (TypeScript,
    Node.js, Postgres, Redis, NATS) and UI (React), with the
    confidence to cross lines as the problem demands rather
    than staying in a familiar lane.
  - Fluency with AI-paired delivery through daily use of Claude
    Code, Cursor, or equivalent agents, with a clear sense of
    when to use plan mode, when to drive the agent, and when
    to write the line yourself, and a consistent habit of
    reviewing AI output critically before it ships.
  - Systems thinking that extends beyond feature delivery, with
    the ability to reason about scale, reliability, latency,
    and cost and design for the system you will need rather
    than the one that just works today.
  - Direct, proactive communication with cross-functional
    stakeholders: you ask hard scope questions early, don't go
    dark for weeks, and earn trust by keeping people informed.

  Bonus points for:

  - Shipped production code using Claude Code or a similar agent
    in the last six months and can speak to where it
    accelerated your work and where it led you astray.
  - Experience in a small-team or startup environment where the
    spec arrived as a Slack message and you had to turn it
    into a shipped outcome.
  - Ownership of a measurable metric such as latency,
    reliability, conversion, or cycle time, not just a shipped
    feature.
  - Experience mentoring less-senior engineers on product
    engineering practices or AI-paired delivery.

  What is in it for you?

  - Real ownership over engineering outcomes at a company where
    the spec is often a conversation with a driver,
    dispatcher, or ops lead rather than a Jira ticket handed
    down from product.
  - A genuinely AI-forward engineering culture where Claude,
    Claude Code, Cursor, and Bedrock are in daily use, with
    room to push what AI-paired delivery looks like on a
    production stack.
  - Competitive salary, equity compensation, and comprehensive
    benefits (health, dental, vision, 401K).
  - Remote-friendly with flexibility, or based at HQ in Ventura,
    CA.
  - A high-growth, mission-driven environment where your work
    has direct and measurable impact.

  Who are we?

  We are Curri, and our mission is to build the network and
  software that move the world’s goods with speed,
  intelligence, and trust. Curri provides on-demand, last-mile
  logistics for construction and adjacent industries with our
  nationwide fleet of cars, trucks, and flatbeds. Founded in
  2018 and part of the YC S19 Batch, we’re solving the massive
  inefficiencies that exist in the construction industry. Our
  headquarters are in Ventura, CA. Learn more at curri.com.

  Curri is an equal opportunity employer and complies with all
  applicable federal, state, and local fair employment
  practices laws. All qualified applicants will receive
  consideration for employment. We don't discriminate based on
  race, color, religion, sex, sexual orientation, gender
  identity, national origin, age, disability, veteran status,
  or any other characteristic protected by law.
