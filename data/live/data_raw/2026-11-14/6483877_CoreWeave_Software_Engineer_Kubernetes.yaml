description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do:

  In this role, you will play a key part in ensuring the
  availability, reliability, and scalability of one of the
  industry’s largest Kubernetes environments. As a member of
  the team, you will drive operational excellence, implement
  robust automation, and help shape the systems that keep
  CoreWeave’s cloud running smoothly.



  About the role:

  - Build, operate, and scale Kubernetes-based production
    infrastructure that delivers CoreWeave’s products with
    high reliability and performance.
  - Develop automation, tooling, and infrastructure as code in
    Go and other infrastructure-focused languages to enable
    zero-touch operations, rapid recovery, and seamless
    deployments.
  - Design, implement, and maintain monitoring, alerting, and
    observability solutions—leveraging the Grafana ecosystem
    and related tools—to proactively identify and resolve
    production issues.
  - Drive incident response efforts, participate in on-call
    rotations, and lead root cause analysis to prevent
    recurrence and improve incident handling processes.
  - Partner with internal and cross-functional teams to ensure
    platform capabilities meet rigorous operational
    requirements and customer SLAs.
  - Engineer for resiliency, implementing best practices for
    redundancy, fault tolerance, and disaster recovery across
    complex distributed systems.
  - Advocate for security, reliability, and performance
    improvements throughout the stack, continuously seeking
    opportunities to strengthen operational standards.
  - Contribute to the development of custom Kubernetes operators
    and intelligent orchestration frameworks that optimize AI
    workload performance and resource utilization at scale.

  Who You Are:

  - Bring 3+ years of experience in production engineering, SRE,
    or large-scale infrastructure/platform roles.
  - Are knowledgeable in Kubernetes administration, container
    orchestration, and microservices architectures, with a
    bias for automating every aspect of operations.
  - Have a proven track record managing high-uptime, customer-
    facing systems in a fast-moving environment, with
    experience delivering measurable improvements in
    reliability and performance.
  - Possess experience in monitoring, observability, and
    incident management using tools like Prometheus, Grafana,
    Datadog, Splunk, Loki, or VictoriaMetrics.
  - Demonstrate knowledge in infrastructure-focused
    programming—especially in Go and Bash—and hold a deep
    understanding of Linux systems.
  - Excel at troubleshooting complex production issues, from
    system failures to performance bottlenecks, and approach
    problems methodically with strong analytical skills.
  - Communicate clearly across technical and non-technical
    stakeholders, proactively sharing knowledge and advocating
    for operational best practices.
  - Are passionate about building systems that are not just
    functional, but robust, self-healing, and easy to operate
    at scale.
  - Take pride in driving continuous improvement, and helping
    set high standards for operational excellence and team
    culture.

  What Success Looks Like

  - You deliver stable, robust, and highly-available systems
    that consistently meet or exceed uptime and performance
    targets.
  - You champion initiatives that drive automation, reduce
    operational toil, and increase the efficiency of incident
    response.
  - You actively contribute to a blameless culture of learning,
    mentoring others in operational best practices and
    production engineering principles.
  - You help CoreWeave maintain industry leadership through
    flawless execution in supporting demanding, AI-powered
    workloads at scale

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $153,000 to $204,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

