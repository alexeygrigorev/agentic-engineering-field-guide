description: |
  Pariveda is a North American-based, employee-owned
  professional services firm. We provide strategy and
  technology services across industries. As a mission-driven
  organization and Certified B Corp, we enable our clients to
  imagine and do more, whether it’s making next quarter’s
  goals or navigating the future. From ideas to impact, we
  help clients get better at what they do to improve people
  and profits. Learn more about our mission and culture as
  well as our recruitment process and interview prep.

  If you are looking for a place where you’ll be challenged to
  learn, grow, and truly make an impact, we invite you to
  explore opportunities with our team in New York City. We are
  looking for lead software developers to design, develop, and
  deliver enterprise-level applications. You will have an
  opportunity to expand your knowledge of full software
  development life cycle, gain direct client exposure, and
  grow junior team members.



  Pariveda is not your average professional services firm. Our
  focus on people is the key to our success and our mission is
  to grow you towards your highest potential. We don’t measure
  one’s worth by the hours they log but rather by their
  individual growth. We live and celebrate our values by
  supporting and caring for the whole person, operating
  transparently, and being curious and unafraid to ask
  questions. To learn more about our culture and what you can
  expect at Pariveda, review our Findamentals – the behaviors
  that show who we are.



  You Can Expect To:

  As a lead software engineer, you will build custom solutions
  using a variety of technologies. You will work in small,
  collaborative teams, while partnering with clients to solve
  real business challenges in an agile, people-first way.

  - Grow your career with the support and guidance of a
    dedicated mentor and a clearly defined, individualized
    career path. You will be eligible for promotion every 12
    months

  - Lead small Pariveda teams and help teammates develop their
    skills and careers

  - Diagnose and solve complex problems for Fortune-500 clients
    in a variety of industries

  - Execute projects from start to finish and get exposure to
    all roles throughout the SDLC (manage projects, estimate,
    gather requirements, architect, develop, test, and
    deliver)

  - Explore different technologies and develop in cloud
    technologies like AWS, Azure, and Google Cloud. Build
    modern applications, data driven solutions, IoT, Machine
    Learning, AI, DevOps, and more with languages including:
    Python, .NET, Java, JavaScript, and SQL, Web technologies
    like React, Redux, Angular, Vue, and Mobile technologies
    including iOS and Android.

  - Utilize AI strategically to enhance client solutions,
    incorporating AI tools to streamline development, uncover
    insights, and accelerate delivery while clearly
    communicating the value, limitations, and ethical use of
    AI to clients and stakeholders.

  - Present findings, solutions, and demos to audiences
    including senior executives and stakeholders

  - Work within a hybrid model

  - Actively engage in our culture of continuous learning,
    personal and professional development, and lead community
    service and social gathering events

  - Work with smart, humble, and supportive people



  We Look For:

  - 3+ years of hands-on software development experience

  - Experience with technical leadership such as coaching others
    and/or leading pieces of projects (estimating/assigning
    tasks, putting together timelines, requirements gathering,
    design, etc.)

  - Client facing or consulting experience highly preferred

  - Skilled problem solvers with the desire and proven ability
    to create and implement innovative solutions

  - Adaptable attitude, able to balance multiple
    responsibilities, and adjust to varied environments

  - Ability to explain and present concepts to technical and
    non-technical audiences

  - Bachelor’s Degree in MIS, Computer Science, Math,
    Engineering, or comparable experience

  - Legally authorized to work for any company in the United
    States without sponsorship



  Pariveda Benefits

  - Transparent and Equitable Salary. The salary range for this
    position starts at $121,200 annually. Actual salaries may
    vary based on factors including but not limited to
    location, experience, and performance.

  - Comprehensive medical, dental, and vision insurance for you
    and your family

  - Employer Health Savings Account (HSA) contribution

  - 2% 401(k), vested immediately

  - Company ownership through Employee Stock Ownership Plan
    (ESOP)

  - Plenty of Paid Time Off – 4 weeks of vacation time, 10
    holidays, 1 floating holiday

  - Paid sabbatical after 5 years of service for Principals and
    above

  - Paid parental leave & breast milk shipping costs reimbursed
    for work travel

  - Employee Assistance Program (EAP), health concierge, and
    financial wellness tool

  - Company paid cell phone plan and device stipend

  - Life insurance

  - Short-Term and Long-Term Disability

  Pariveda Solutions aspires that our employee diversity is
  representative of the markets in which we serve. Employment
  decisions are based solely on merit and business needs and
  not on race, color, religion, sex, sexual orientation,
  gender, gender identity, gender expression, pregnancy,
  marital status, national origin, citizenship status (if
  authorized to work in the country where the job is located),
  uniform service member, military or veteran status,
  ancestry, age (over 40), physical or mental disability
  including HIV or AIDS, medical condition, genetic
  information, political affiliation, or any other category
  protected by applicable federal, provincial, or local law.

  Our commitment to a welcoming, inclusive environment means
  we embrace applicants from all backgrounds. If you feel you
  may need an accommodation at any stage of our interview
  process due to a disability, please contact the Human
  Resources team at careandsupport@parivedasolutions.com or +1
  844-325-2729, select option 3 and then option 1 Human
  Resources.
