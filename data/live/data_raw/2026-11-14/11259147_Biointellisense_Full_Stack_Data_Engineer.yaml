  BioIntelliSense Overview

  BioIntelliSense is ushering in a new era of continuous
  health monitoring and clinical intelligence for Remote
  Patient Monitoring (RPM) and Screening (COVID-19/Infection).
  Our medical-grade Data-as-a-Service (DaaS) platform
  seamlessly captures multi-parameter vital signs,
  physiological biometrics and symptomatic events through an
  effortless patient experience. The FDA-cleared BioSticker™
  and BioButton™ devices make remote monitoring and early
  detection simple. Through the platform’s advanced analytics,
  clinicians, patients, and employers will now have access to
  high-resolution patient trending and reporting to enable
  medical grade care at home, and medical grade screening in
  the office, school, or residence. For more information on
  how BioIntelliSense is redefining remote patient monitoring
  through medical-grade and cost-effective data services,
  please visit our website at BioIntelliSense.com.
