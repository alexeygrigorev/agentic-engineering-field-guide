description: |
  Company Description

  Direct Link -
  https://boards.eu.greenhouse.io/kadmos2/jobs/4057008101

  We are looking for a Senior Backend Engineer who will take
  ownership of crucial backend engineering activities at
  Kadmos. Since we’re an early-stage company, you should be
  comfortable with change and bringing new ideas to the table.
  You should expect to be right in the cockpit of a high-
  growth startup, getting the exciting opportunity to write
  high-quality code and keep on top of novel technologies.
  Your responsibilities will include building and maintaining
  micro-service landscapes, ensuring the efficiency and speed
  of current applications, troubleshooting and debugging, and
  overseeing infrastructure. Join us and become part of our
  journey to empower the lives of millions!



  Job Description

  What you can expect:

  - Own the backend. You will be tasked with crucial backend
    activities such as the generation of reusable libraries,
    conceptualization, and implementation of complex banking
    components, integration with different service providers,
    etc.
  - Be independent. You'll be given complete independence in
    your areas of responsibility and should take full
    ownership of your areas of responsibility, playing a
    central part in our success.
  - Growth. You will directly experience and take part in the
    scale-up of a high-growth business.
  - Diverse work-family: In our open team environment, we
    encourage everyone in being who they are - you are welcome
    to add to this melting pot of diverse interests: sports,
    food, travel, fitness, etc.

  Qualifications

  Must have requirements

  - 5+ years of professional experience in Java software
    development.
  - Master's degree from a top university in computer science or
    related subjects.
  - You have mastered coding in Java and are proficient in
    Spring Boot. You have a deep understanding of current
    frameworks, SDKs, API standards, and libraries.
  - You follow engineering best practices. You regularly apply
    design patterns and testability methods; you are highly
    experienced in writing unit, integration, and performance
    tests with tools such as Junit, Spock, Testcontainers,
    etc.
  - You are proactive, ambitious, and a team player. We are
    interested in highly motivated engineers with a proven
    track record.
  - Fluency in English.

  Nice to have requirements

  - Nice to have: high familiarity with React.
  - Nice to have: previous work experience(s) in building
    FinTech products and/or banking backend systems.

  Additional Information

  Why us

  🌱 Opportunity to work in a company with direct social impact

  💰 Attractive compensation & stock options

  🇺🇦 Open & International environment

  🏛️ Fantastic location in the heart of Berlin & flexible WFH
  policy

  🥳 Regular team events

  🥘 Free lunch at the office

  💻 Latest equipment, to ensure you have everything needed
