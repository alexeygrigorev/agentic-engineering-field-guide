description: |
  Hey! We're team Granola 👋

  We're building a category-defining product, backed by a
  $125M Series C and used daily by teams at companies like
  Cursor, Vanta, and Linear. We started by making meeting
  notes better. Now we're turning every conversation a company
  has into context that people and agents can act on. Most of
  what that means for users hasn't been designed yet.

  If you haven't already, you should check out what we're
  building, and why you should work here.

  The Granola team is kind, curious and design-obsessed. Many
  of us are former founders, others have built products at
  Figma, Apple, Google and Meta, and we're all still learning
  from each other.

  You'll own user-facing features end to end: talking to
  users, deciding what to build, working closely with the
  Granola team. You'll take ideas from zero to one inside a
  product people already rely on every day.

  What you'll work on

  - Agentic workflows: Turn what was said in a meeting into what
    gets done. Build the tools and context that let Granola’s
    agents pick up where the conversation left off.
  - Team workspaces. Help companies build a shared context layer
    from their most important conversations, while still
    prioritising user privacy and ownership.
  - The core note experience. Keep AI-enhanced notes accurate
    and trustworthy, so people rely on them without checking.
  - Prototype, then ship. Ship daily experiments to our internal
    app for quick feedback, and collaborate with the team and
    our users to get it to production.
  - New surfaces. Bring Granola to more of the places people
    work, across desktop, mobile and integrations.

  Who we're looking for

  We don't set a minimum number of years. Some of our
  strongest engineers graduated two years ago; others have run
  their own companies. We care about what you've built and how
  you think about it.

  - You've shipped user-facing features end to end, with visible
    impact on a product, and you can show us.
  - You're strong in TypeScript, React and Node.js, and
    comfortable down to Postgres and AWS.
  - You have taste: you care about UX, speed and polish, and you
    push back when something doesn't feel right.
  - You're comfortable shaping the problem, not just building
    the solution, and you enjoy talking to users to get there.
  - You can take an idea from zero to one: a rough prototype in
    front of users, then iteration until it's polished.
  - You're curious about building with LLMs. Direct experience
    with prompts, evals or agents is a bonus, not a
    requirement.

  How we work

  - People and product first. We hire people who are kind, down
    to earth and pragmatic, who care deeply about the product,
    and who want to stay connected to the customers using it.
    Product isn't one team's job here; it's everyone's.
  - High autonomy. Engineers spot opportunities and ship
    improvements themselves. We’d rather you ship it than
    write about it.
  - Everyone talks to users. Every engineer works directly with
    the people using Granola, and that's where most of our
    best ideas come from.
  - A high bar for engineering and product. We expect strong
    technical ability and strong product sense. Engineers
    think like PMs: they understand the user's problem and
    help shape the direction of what they build.
  - Room to experiment. Every engineer has a budget from day one
    to use new models, tools and technologies which make them
    more productive.
  - Design and quality matter. Thoughtful design, a high quality
    bar and close collaboration on everything we build.
  - We work in person, with flexibility. We’re in the office
    five days a week because we genuinely like building
    together. It’s relaxed: dress down, bring your dog, and no
    fixed office hours.

  What that looks like in practice: the version of Granola we
  use internally goes far beyond the public app. We're
  building at the frontier of agentic software, and we try
  every new capability on ourselves first.

  Our stack

  TypeScript, React, Node.js, Postgres, AWS and Terraform,
  plus whichever new models and tools prove themselves. You
  don't need experience with everything, but you should be
  excited to work close to users and ship often.

  What we offer

  We're living in the most exciting time for tool builders
  since Engelbart's demo in 1968, and we want to build that
  future together in London. We pay slightly above market on
  salary and above market on equity. We work together in
  person five days a week at our office in Old Street, and we
  offer relocation support if you're moving to London.

  Great people come from all kinds of backgrounds. If this
  speaks to you, whether or not you look like a fit on paper,
  we'd love to hear from you.
