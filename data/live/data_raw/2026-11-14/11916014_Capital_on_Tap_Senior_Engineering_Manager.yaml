description: |
  We’re Capital on Tap 👋 💳 Capital on Tap started because
  small businesses were underserved. Big banks were slow,
  their products weren't fit for purpose, and small business
  owners often couldn't access what they needed. We set out to
  fix that.

  Today we're a financial platform - not just a credit card
  company. We offer a best-in-class business credit card, SME-
  focused spend management platform, a savings product that
  hit £1 billion in funds within its first year, and a growing
  suite of tools and financial products that make running a
  small business easier.

  1,000+ employees, £20bn in annual card spend, 200,000+
  customers, 17,000+ Trustpilot reviews averaging 4.7 stars,
  and we're profitable. We’ve done a pretty good job so far,
  but we’re just getting started!

  🏡🏢This is a Hybrid role, the Engineering team work from our
  London (Moorgate) Offices 2 days per week.

  What You’ll Be Doing

  As an Engineering Manager, you’ll own the health, delivery
  and direction of several product engineering teams and the
  Team Leads who run them. You’ll be a true product partner:
  your teams exist to build the features and propositions that
  unlock new commercial revenue streams, win new customers and
  grow revenue from the ones we already serve. You’ll make
  sure what they build is architecturally sound, scalable and
  built to last. You'll also influence product, commercial and
  engineering decisions.

  Your success is measured by the leaders you grow around you:
  developing Team Leads into confident, self-directing
  managers who run their teams without daily oversight.

  Commercial and product

  - Partner closely with Product and wider stakeholders to
    identify and deliver the features and propositions that
    unlock new commercial revenue streams and deepen revenue
    from existing customers
  - Shape the 3 to 12 month roadmap, framing technical
    investment in terms of commercial impact, customer value
    and risk
  - Champion the customer in every roadmap discussion and
    measure projects by how well they solve real customer
    problems

  Architecture and technical direction

  - Influence the architectural direction of your teams’
    systems, ensuring technical choices are scalable,
    resilient, cost-effective and sustainable
  - Work with technical leaders to set standards, reduce
    complexity and steer teams away from over-engineered
    solutions
  - Make sound build versus buy and technical debt trade-offs,
    and balance them against product needs

  Leadership and delivery

  - Lead, coach and develop Team Leads, helping them manage and
    grow their own direct reports
  - Own predictable, iterative and sustainable delivery of
    quarterly objectives across your teams
  - Address underperformance decisively and support Team Leads
    through complex people situations with integrity and
    clarity
  - Identify and mitigate risks 3 to 6 months out, including
    dependencies and resource gaps
  - Contribute to wider company initiatives such as recruitment
    strategy and organisational design

  We’re Looking For

  - Strong product and commercial instincts, with a track record
    of delivering features or propositions that generated new
    revenue or grew revenue from existing customers
  - A genuinely customer-focused, commercially aware and data-
    informed approach to decision-making
  - Demonstrable strength in software architecture and system
    design: you can set direction, challenge designs and weigh
    trade-offs across scalability, cost and maintainability
  - Proven experience managing managers or Team Leads, and
    growing them into senior leaders
  - A strong people-management track record, including hiring,
    development and performance management
  - A solid technical background and an understanding of how
    full-stack teams and codebases work. We use .NET and React
    but we aren’t zoomed in on your tech stack background.
  - A record of leading and delivering complex, cross-team
    projects
  - Excellent communication: concise, clear and adaptable to
    audiences from engineers to senior leadership
  - Calm, stabilising leadership through ambiguity and fast
    organisational growth
  - Experience in a scaling, regulated, fintech or tech-enabled
    environment is a plus

  Diversity & Inclusion 🌈 We welcome, consider and encourage
  applications from anyone who shares our commitment to
  inclusivity. Join us in creating a space where authenticity
  thrives, and everyone can do their best work.

  Great Work Deserves Great Perks We try not to take ourselves
  too seriously (all the time) so we make sure our office is
  decked out with a pool table, arcade machine, beer tap, and
  a couple of office dogs thrown in for good measure. Check
  out our benefits: 🏥 Private Healthcare including dental and
  opticians services through Vitality ✈️ Worldwide travel
  insurance through Vitality 🎁 Anniversary Rewards (£250,
  £500, £750, 4-week fully paid sabbatical) 👛 Salary Sacrifice
  Pension Scheme up to 7% match 🚘 Octopus EV Salary Sacrifice
  Scheme 🏖️ 28 days holiday (plus bank holidays) 📖 Annual
  Learning and Wellbeing Budget 👪 Enhanced Parental Leave 🚲
  Cycle to Work Scheme 🚂 Season Ticket Loan 💬 6 free therapy
  sessions per year 🐶 Dog Friendly Offices 🍫 Free drinks and
  snacks in our offices

  Check out more of our benefits, values and mission here.
  Interview Process 🤝 🤝First stage: 30 minute intro and values
  call with your Talent Partner (Video call) 🤝Second stage: 60
  minute Technical and Management Interview with a Senior
  Engineering Manager (Video call)

  🤝Third stage: 60 minute System Design Interview with our
  engineering team (Video call) 🤝Final stage: (120 minutes
  total) 60 minute Case Study with Product and our Engineering
  Team + 60 minute Good to Great Interview with Jamie, our CTO
  (In person)

  Other Info 👍Check out our ‘Top Tips’ for interviewing.
  ✔️Keep updated on new job opportunities by following us on
  Linkedin. 📧Email careers@capitalontap.com if you have any
  questions.

  Excited to work here? Apply! If you’d like to progress your
  career within our fast growing, profitable fintech then
  click apply and we will aim to get back to you within 3
  working days (during busy periods this could take up to 5
  working days.)
