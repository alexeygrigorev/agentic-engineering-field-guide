description: |
  This opportunity is for internal Rhapsody employees only. It
  is open to all locations.

  The opportunity:

  We’re hiring an Engineering Manager eager to lead and mentor
  engineers while also contributing directly through code and
  architecture. You’ll report to the Director of AI Platform
  Engineering and work with Product and engineers to turn
  ideas into software that solves real problems. You’ll help
  set technical direction and take responsibility for
  delivering it with the team. You’ll ask hard questions,
  welcome challenge in return, and help judge when to take the
  next incremental step and when to take a bigger bet.

  What you’ll do:

  - Carry the architecture forward. Work with the Director and
    engineers to turn platform direction into concrete
    designs. Bring the evolving streams together, work through
    technical disagreements, and ensure the pieces fit
    together as a coherent system.

  - Build with the team. Write production code, test ideas with
    prototypes, and work alongside colleagues on difficult
    problems.

  - Develop people. Set clear expectations, give honest
    feedback, and make time for regular one-to-ones. Help each
    person find work that stretches their skills.

  - Help others own decisions. Be a sounding board, offer
    direction when it’s needed, and give people room to act.
    Support existing technical leaders and help the team stay
    focused when priorities change.

  - Help the team deliver. Take responsibility for planning and
    delivery practices with the team. Agree scope and
    sequencing with Product and the Director. Build on what
    works, address what gets in the way, and encourage
    everyone to contribute ideas, raise concerns, and follow
    through on decisions.

  - Follow through in production. Help turn incidents and
    support issues into lasting fixes. Plan for the work it
    takes to keep systems running.

  What you bring:

  - Recent experience writing and shipping meaningful code.

  - Experience building and running complex systems through
    product engineering, platform work, SRE or operations.

  - Engineering judgment you can explain: where simplicity
    helps, which risks matter, and when a larger change is
    worth the cost.

  - A habit of helping others grow through management, mentoring
    or technical leadership. First-time line managers are
    welcome.

  - Practical experience building AI-enabled software. You know
    how to test whether it works and recognise when another
    approach would serve users better.

  - Curiosity and persistence. You dig into unfamiliar problems,
    write clearly, listen carefully, and change your mind when
    you learn something new.

  Role scope:

  You’ll be managing people and making meaningful engineering
  contributions. During onboarding, we’ll agree on your
  initial reporting group and make room for both
  responsibilities. We’ll revisit the balance as the team’s
  needs change, but this role will remain a blended role.
