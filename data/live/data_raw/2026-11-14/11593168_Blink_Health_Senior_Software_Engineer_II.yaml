description: |
  About BlinkRx:

  BlinkRx is rebuilding how Americans access life-changing
  medicines. Today, only one in five prescriptions for new
  branded therapies are ever filled. The problem isn't the
  medicine. It's insurance barriers, affordability challenges,
  fragmented pharmacy experiences, and inadequate support that
  keep patients from starting and staying on treatment. Our
  mission is to change that.

  We built RxOS, the first AI-powered prescription operating
  system. RxOS connects the largest network of doctors,
  patients, pharmacies, payers, and pharmaceutical
  manufacturers, intelligently orchestrating every step to
  guarantee a seamless prescription journey for every script.

  Our teams solve complex, high-stakes problems at the
  intersection of artificial intelligence, healthcare
  operations, logistics, payments, and regulation. The impact
  is transformative: BlinkRx more than doubles the rate at
  which patients take their medications and lowers their out-
  of-pocket expenses by hundreds of dollars every month.

  BlinkRx created and leads a rapidly growing $80+ billion
  category, with exceptional momentum:

  - Built for scale: Over the past decade, we have invested
    nearly $1 billion in building the technology and
    operational platform required to serve patients at scale.
  - Proven growth and economics: We have grown 100% annually for
    the past five years, are profitable, and support more than
    60 pharmaceutical brands.
  - Trusted with category-defining programs: Our technology
    powers a leading pharmaceutical manufacturer’s direct-to-
    patient platform for its GLP-1 portfolio, providing the
    infrastructure to expand patient access as demand for
    these therapies grows.

  We are a dynamic team of technologists and industry experts
  seeking to build a generational company that delivers a
  genuine step change in American health.

  The Work

  Healthcare is moving toward access that is digital,
  transparent, and fast. The winners will not be the companies
  that simply dispense medication. They will be the ones that
  solve coverage, and we are building that answer.

  That makes this far more than a supporting function. It is
  where BlinkRx's next chapter of growth takes shape, and
  where better technology shows up as patients getting the
  care they need, sooner. The work gets significant attention
  from the top, and you will work directly with our industry
  leaders and our founder.

  The Role

  This level (L6) is for an engineer who sets technical
  direction across teams and products and stays hands-on doing
  it: someone who does their best work near the decisions that
  matter and cares more about business results than shipping
  for its own sake.

  You'll take messy, high-stakes problems and own the
  architecture decisions that solve them, often spotting
  what's worth solving before anyone hands it to you. You'll
  take the riskiest parts yourself, set the quality bar in
  your own code and in what the team treats as good enough,
  and spend real time developing the engineers around you,
  especially the senior ones ready to take on more. This isn't
  a role where you stop writing code and start drawing
  diagrams.

  Our tooling is practical: AWS, Python, JavaScript,
  MySQL/Postgres, and Claude/Cursor. We like simple solutions,
  we move quickly, and we keep the patient in mind.

  Responsibilities

  - Design and evolve the backend and frontend architecture
    behind our systems
  - Take ambiguous, high-risk problems off the table and get
    them to a clear answer
  - Run design and code reviews
  - Own major features from first design through testing,
    documentation, monitoring, and launch
  - Work directly with founders and executives to shape strategy
    and then build against it
  - Coach engineers and help shape how the team works
  - Bring in new tools and techniques, prototype fast, and let
    data settle debates
  - Explain technical trade-offs clearly to anyone in the room,
    engineer or not

  What We're Looking For

  - 8+ years writing software, with your scope and impact
    growing over that time
  - Hands-on experience building with AI coding tools, and a
    track record of helping your team adopt and get real value
    from them.
  - A history of being the technical lead for a system or
    product area several teams depend on, owning it from a
    vague starting point through launch and scale
  - Experience working directly with founders or executives, and
    the genuine desire to work that closely with senior
    leaders
  - A focus on outcomes: you want to know your work moved the
    business and helped patients, not just that the code was
    elegant
  - Deep skills in a modern language such as Python, JavaScript,
    or Go
  - A strong background in distributed systems, API design, and
    performance work
  - A record of raising the technical bar for every team you've
    worked on, and mentoring senior engineers into their next
    level
  - Clear communication and the credibility to be a real partner
    to business and product leaders
  - A CS degree or equivalent experience

  Why Join Us: It is rare to have a company that both deeply
  impacts its customers and is able to provide its services
  across a massive population.  At Blink, we have a huge
  impact on people when they are most vulnerable: at the
  intersection of their healthcare and finances. We are also
  the fastest growing healthcare company in the country and
  are driving that impact across millions of new patients
  every year.  Our business model not only helps people, but
  drives economics that allow us to build a generational
  company. We are a relentlessly learning, constantly curious,
  and aggressively collaborative cross-functional team
  dedicated to inventing new ways to improve the lives of our
  customers. We are an equal opportunity employer and value
  diversity of all kinds. We do not discriminate on the basis
  of race, religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. Applicants who provide their phone number
  and consent to receive text messages may receive SMS or MMS
  updates from Blink Health regarding their application.
