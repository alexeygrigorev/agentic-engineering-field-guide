description: |
  Snap Inc is a technology company. We believe the camera
  presents the greatest opportunity to improve the way people
  live and communicate. Snap contributes to human progress by
  empowering people to express themselves, live in the moment,
  learn about the world, and have fun together.

  The Company operates Snapchat, a visual messaging app that
  enhances your relationships with friends, family, and the
  world, and Specs Inc., a wholly-owned subsidiary dedicated
  to making computing more human, in addition to Bitmoji,
  Saturn, and other digital services.

  Snap Engineering teams build fun and technically
  sophisticated products that reach hundreds of millions of
  Snapchatters around the world, every day. We’re deeply
  committed to the well-being of everyone in our global
  community, which is why our values are at the root of
  everything we do. We move fast, with precision, and always
  execute with privacy at the forefront.

  We’re looking for a Staff Software Engineer to join Snap
  Inc!

  What you’ll do:

  - Build high-impact product experiences: Design, develop, and
    launch innovative Android features across Friend Stories,
    Spotlight, Discover, and content interactions that drive
    user engagement, retention, and growth.
  - Own end-to-end technical execution: Lead complex projects
    from architecture and implementation through
    experimentation, launch, and ongoing optimization.
  - Improve video playback and performance: Optimize video
    startup latency, prefetching, buffering, scrolling
    responsiveness, memory usage, and overall playback
    reliability to deliver seamless content consumption
    experiences.
  - Drive Android architecture and engineering excellence: Build
    scalable, maintainable Android systems, improve shared
    components, reduce technical debt, and establish best
    practices for performance, quality, and reliability.
  - Shape product and technical strategy: Partner with Product,
    Design, Ranking/ML, Backend, and Ads teams to identify
    opportunities, influence roadmaps, and translate ambiguous
    product goals into scalable technical solutions.
  - Provide technical leadership: Mentor engineers, lead design
    reviews, raise engineering standards, and drive alignment
    across Android, iOS, and platform teams.
  - Utilize AI tools and high velocity engineering workflows to
    design and ship scalable services while upholding rigorous
    standards for code correctness, security, and production
    ready quality code

  Knowledge, Skills & Abilities:

  - Strong proficiency in Kotlin, Java, Android SDK, and modern
    Android development practices.
  - Experience designing and delivering complex, scalable mobile
    applications with a strong focus on performance and
    reliability.
  - Deep understanding of Android architecture, concurrency,
    multithreading, memory management, networking, and UI
    performance.
  - Proven ability to independently lead large, ambiguous
    technical projects and deliver measurable results.
  - Strong communication skills and experience collaborating
    with cross-functional engineering and product teams.
  - Proficiency in, or a strong aptitude for, leveraging AI
    tools to streamline development, paired with the critical
    judgment to audit generated output for architectural
    integrity, performance bottlenecks, and security risks.
  - Adaptability in learning and applying evolving AI systems
    and tools to remain at the forefront of engineering trends
    and modern development practices

  Minimum Qualifications:

  - Bachelor's Degree in a relevant technical field such as
    computer science or equivalent years of practical work
    experience
  - 9+ years of post-Bachelor’s software development experience;
    or Master’s degree in a technical field + 8+ year of post-
    grad software development experience; or PhD in a relevant
    technical field+ 5 years of post-grad software development
    experience; or PhD in a relevant technical field
  - 1+ years of experience with technical leadership or acting
    as the domain-expert to a technical organization
  - Experience with Android application development

  Preferred Qualifications:

  - Experience working with large-scale customer-facing mobile
    application
  - Experience leading teams to deliver sophisticated
    initiatives

  If you have a disability or special need that requires
