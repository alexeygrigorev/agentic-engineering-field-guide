description: |
  Company Description

  iCapital Network is the financial technology platform
  democratizing alternative investments with complete tech-
  based solutions for investors, advisors and asset managers.
  The firm’s flagship platform offers high-net-worth investors
  and independent wealth advisors a curated menu of private
  equity and hedge funds at lower minimums with a full suite
  of due diligence and administrative support in a secure
  digital environment. Banks and asset managers leverage
  iCapital’s tech-enabled services to streamline and scale
  their private investments operational infrastructure.
  iCapital was included in the 2018 Forbes FinTech 50 and as
  of June 30, 2018 serviced more than $6 billion in invested
  capital across more than 14,000 underlying accounts.

  Job Description

  The Full Stack Engineer at iCapital Network will work end-
  to-end on new Features, Enhancements, and Defect Resolution
  on the core iCapital Platform. You will work closely with
  our Product Management team throughout the software
  development process, detailing requirements, reviewing work
  in progress, and addressing issues found via manual test
  efforts.

  On a daily basis, your work will include:  • Backend
  development in Ruby (2.0) and Rails (4.2.7) • Frontend
  development in AngularJS 1.x or other front end framework we
  may adopt in the future • Unit and integration test
  development using RSpec, Cucumber, and Capybara • Active
  participation in daily (9:30am) stand up meetings • Active
  participation in Peer Code Reviews as part of our standard
  SDLC and Change Management Process

  Qualifications

  • 5+ years of Full Stack, web-based application development
  • 2+ years of development experience with Ruby on Rails • 2+
  years of development experience with AngularJS or another
  modern front end framework • 5+ years of HTML / CSS
  development • 2+ years of test automation development in a
  Ruby on Rails environment • Demonstrated understanding of
  relational database concepts and modeling practices •
  Ability to work in an Agile / Kanban methodology • Ability
  to work independently or as part of a group effort, as
  required • Solid problem solving ability • Excellent
  communication skills • Collaborative approach to software
  development

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
