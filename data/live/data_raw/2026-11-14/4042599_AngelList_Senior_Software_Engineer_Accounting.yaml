description: |
  About AngelList

  Private markets are the new public markets. The most
  important companies of this era are private, and almost no
  one can own them. What's missing is the financial system
  public markets spent a century building: exchanges,
  custodians, brokers, and ways for ordinary people to buy in.
  Private markets, now $28T, never had the equivalent.
  AngelList is building it.

  The last decade of structural innovation in venture happened
  here: syndicates, SPVs at scale, Rolling Funds, scout
  programs. Today we have $200B+ in assets and 30,000+
  startups funded on our platform. The rest of private markets
  is next. Funds is the software and services behind private
  funds, Nova is the banking network, Meridian is the wealth
  platform for accredited investors, and USVC is the brand
  behind a registered fund that lets anyone invest in venture.

  Working here means an unusual amount of agency on a problem
  that matters. Titles are closer to suggestions, and there
  are about 200 of us building what private markets never had.
  Come build it with us.

  About the Role:

  AngelList's software automates the work for our in-house
  team of operators, financial accountants, and tax
  professionals. We have grown to supporting $200B+ in assets,
  and we are now charting the course to managing $1T in
  investments.

  AngelList aims to power the best-performing venture funds.
  We can win these customers if we deliver financials more
  accurately and more quickly than anyone else. We need to
  issue and collect capital calls faster than anyone. We need
  to make our customers’ requests either self-serve, or so
  operationally tight behind-the-scenes, that it feels self-
  serve. We will get there by delivering a new product
  experience, where the GP may self-serve more of their
  requests; and by overhauling our accounting system to
  automate more operational work.

  You will have the opportunity to:

  - Model financial workflows—turning messy, real-world fund
    data into accurate and automated financials.
  - Build scalable accounting infrastructure—improving how
    financial data is reported on the front-end, and building
    out how we read/write to the general ledger on the back-
    end.
  - Solve hard data integrity problems—ensuring our system
    produces reliable and audit-ready outputs across a growing
    universe of funds.
  - Collaborate directly with accounting stakeholders in a tight
    feedback loop, turning their manual processes into
    automated systems.
  - Work with other highly talented and self-motivated
    colleagues driven by the same mission.

  You are most likely:

  - A senior back-end engineer (Ruby on Rails or similar MVC
    frameworks) with 5+ years of experience, capable of owning
    features end to end and venturing into the frontend
    (React, TypeScript).
  - Understand financial workflows or eager to dive deep into
    fund accounting, transaction processing, and general
    ledger systems. You are excited about the details of how
    money flows through the venture ecosystem.
  - Thrive on complexity—modeling ambiguous problems, messy
    data, and evolving business requirements in a relational
    database (Postgres, MySQL) where every record is critical.
  - Build for reliability—designing systems to produce audit-
    ready financial outputs, not best-effort calculations.
  - Customer-oriented to solve complex business problems in
    collaboration with users in finance and accounting.
  - Execution-focused, comfortable with balancing tradeoffs and
    making progress in a fast-moving environment.
  - Deep love of startups, having worked in at least one! You
    may have founded one yourself or hope to start a company
    in the future.

  Working Here

  If you don’t meet every requirement above, we still
  encourage you to apply. We value complementary strengths and
  operators who learn by doing.

  AngelList has offices in a few cities, with our engineering
  hub in San Francisco. We’re building our engineering and
  product teams around this hub to make the most of in-person
  collaboration. We have a hybrid in-office model: teammates
  come in at least 2 days per week (Tuesdays and either
  Wednesday or Thursday).

  Compensation: The compensation for this role consists of a
  competitive base salary, benefits, and equity package. The
  base salary for this role starts at $200,000+ annually but
  will vary based on a number of factors including a
  candidate’s professional background, experience, level, and
  location. Additional details about our Total Rewards package
  will be provided during the recruitment process.

  Benefits: We support your life both in and outside of work.
  Explore our benefits Learn about Funders & Founders

  What Guides Us: At AngelList, we are united in our purpose
  to accelerate innovation and build the future of private
  markets. Our beliefs and values shape what we work on and
  how we create impact. If the below resonate, we'd love to
  have you with us. Our beliefs Our values & leadership
  expectations

  AngelList is an equal opportunity employer and we value
  diversity at our company. We do not discriminate on the
  basis of race, religion, color, national origin, gender,
  sexual orientation, age, marital status, veteran status, or
  disability status.
