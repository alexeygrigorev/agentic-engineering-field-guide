description: |
  Novella is building AI to protect the largest, most
  complicated assets in the world. Whether it's a rocket going
  to space or a skyscraper on the coast, Novella is building
  the first AI powered specialty insurance brokerage.

  The Role

  We're looking for a Full Stack Engineer to join our team. In
  your day-to-day work, you'll be responsible for building all
  aspects of our product, from discussing big ideas to
  debugging production issues, while working across both
  frontend and backend systems. As one of our first 15 hires,
  you'll also help establish a strong engineering culture and
  take on a leadership role as the company grows.

  The Day to Day

  - Design and develop reliable, scalable and performant full-
    stack applications, including both frontend user
    interfaces and backend services.
  - Own features end-to-end, from user interface design to
    database schema optimization.
  - Collaborate closely with the founders to define and
    implement the technical vision and roadmap of our startup.

  What We're Looking For

  - Experience building modern web applications using our tech
    stack:
    - Frontend: React, Next.js, TailwindCSS
    - Backend: TypeScript, tRPC, PostgreSQL, Redis
  - Excited to use generative AI tools in day-to-day work and
    adapt as the tools and best practices change.
  - Excited about the challenge of building a new business from
    scratch. The perfect candidate will be excited about
    speaking to users and understanding the business, not just
    writing code.
  - Strong understanding of full-stack application architecture
    and modern engineering practices.
  - Salary Range 80k-250k a year
