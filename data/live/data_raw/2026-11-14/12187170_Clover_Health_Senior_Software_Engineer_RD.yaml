description: |
  At Clover, we are transforming healthcare by building
  systems that improve real-world health outcomes for our
  members. Our R&D organization operates with high autonomy,
  fast delivery cadence, and a bias toward AI-native
  development: empowered individuals own business outcomes,
  not tasks.

  We are looking for a Senior Software Engineer with expertise
  in full-stack engineering. In this role, you will
  collaborate with our operators, clinicians, and product
  managers to build tools that drive real change in
  healthcare. You won't just write code to spec — you'll
  understand the business problem, engage with stakeholders,
  and shape the solution.

  As a Senior Software Engineer, you will:

  - Simplify the complexities of healthcare by building systems
    that enhance human efforts. Understand the business
    context behind what you build — why it matters, who it
    serves, and how it connects to outcomes.
  - Exercise agency: make informed technical and product
    decisions on your own to advance outcomes. Take ownership
    of your work from problem understanding through delivery
    and measurement.
  - Stay up-to-date with new tools and technologies to solve
    challenges and advance our goals.
  - Adopt and evangelize AI both in your own work and in the
    solutions you build.
  - Help define and maintain development practices that enable
    fast iteration while ensuring quality, including writing
    tests and documenting key implementations.
  - Collaborate with Product Managers and operational teams to
    conceptualize and develop new features. Engage directly
    with users and stakeholders to understand their needs —
    don't wait for requirements to be handed to you.

  You should get in touch if:

  - You have 5+ years of experience in software with proficiency
    in one or more common languages, and are also familiar
    with various databases and web frontend technology.
  - You know how to build systems with AI agents as your
    partners and team members, and are passionate about the
    impact AI can have in technology.
  - You approach building and maintaining systems with maturity,
    rigor, and attention to scalability.
  - You are comfortable working across different technical
    systems and concerns.
  - You have experience building and refactoring complex (often
    distributed) systems.
  - You care about outcomes, not just output. You want to
    understand the "why" behind what you build and can connect
    your work to business and user impact.

  Benefits Overview:

  - Financial Well-Being: Our commitment to attracting and
    retaining top talent begins with a competitive base salary
    and equity opportunities. Additionally, we offer a
    performance-based bonus program and regular compensation
    reviews to recognize and reward exceptional contributions.
  - Physical Well-Being: We prioritize the health and well-being
    of our employees and their families by offering
    comprehensive group medical coverage that include coverage
    for hospitalization, outpatient care, optical services,
    and dental benefits.
  - Mental Well-Being: We understand the importance of mental
    health in fostering productivity and maintaining work-life
    balance. To support this, we offer initiatives such as No-
    Meeting Fridays, company holidays, access to mental health
    resources, and a generous annual leave policy.
    Additionally, we embrace a remote-first culture that
    supports collaboration and flexibility, allowing our team
    members to thrive from any location.
  - Professional Development: We are committed to developing our
    talent professionally. We offer learning programs,
    mentorship, professional development funding, and regular
    performance feedback and reviews.

  Additional Perks:

  - Reimbursement for office setup expenses
  - Flexibility to work from home, enabling collaboration with
    global teams
  - Paid parental leave for all new parents
  - And much more!

  About Clover Health: We are reinventing health insurance by
  combining the power of data with human empathy to keep our
  members healthier. We believe the healthcare system is
  broken, so we've created custom software and analytics to
  empower our clinical staff to intervene and provide
  personalized care to the people who need it most.

  We always put our members first, and our success as a team
  is measured by the quality of life of the people we serve.
  Those who work at Clover are passionate and mission-driven
  individuals with diverse areas of expertise, working
  together to solve the most complicated problem in the world:
  healthcare.

  From Clover’s inception, Diversity & Inclusion have always
  been key to our success. We are an Equal Opportunity
  Employer and our employees are people with different
  strengths, experiences and backgrounds, who share a passion
  for improving people's lives. Diversity not only includes
  race and gender identity, but also age, disability status,
  veteran status, sexual orientation, religion and many other
  parts of one’s identity. All of our employee’s points of
  view are key to our success, and inclusion is everyone's
  responsibility.

  #LI-REMOTE

  Pursuant to the San Francisco Fair Chance Ordinance, we will
  consider for employment qualified applicants with arrest and
  conviction records. We are an E-Verify company.

  Final pay is based on several factors including but not
  limited to internal equity, market data, and the applicant’s
  education, work experience, certifications, etc.

  A reasonable estimate of the base salary range for this role
  is:

  $169,200—$220,000 USD
