description: |
  ABOUT THE JOB

  Company Intro: TurbineOne is the frontline perception
  company. We deliver decision advantage, better situational
  awareness, and stronger force protection by allowing
  frontline soldiers to leverage the latest in machine
  learning and software technology. The company is a small,
  fast-moving, high-performance startup that is backed by the
  best DefenseTech venture capitalists.

  Job Title: Full-Stack Product Engineer

  - Geographically flexible - fully remote

  Primary Responsibilities:

  - Deliver edge-focused product experiences, integrating the
    latest in machine learning and autonomy, to support the
    missions of intelligence officers, frontline soldiers and
    security forces around the world.
  - Work closely with our expert design team to develop novel
    and intuitive user experiences allowing laypeople to take
    full advantage of advanced technologies.
  - Knowing the limits and shortcomings of machine learning,
    design systems and application flows that, nonetheless,
    allow machine learning to be a force multiplier for our
    frontline warfighters.
  - Collaborate with the infrastructure team, and other product
    teams, to create an efficient and elegant application
    stack, taking into account the resource constraints of the
    edge-focused environments we deploy into.
  - Work with ML engineers to design and build our internal
    modeling APIs, making sure they support optimal user
    experiences on the front end.

  Desired Experience:

  - 5+ Years working in full-stack product development
    positions.
  - 3+ years experience with strongly typed languages, such as
    GoLang, C++, C# or Java.
  - Deep understanding of reactive web frameworks, such as Vue
    and React.
  - Experience with API design and best practices for REST,
    GraphQL and gRPC.
  - Experience working with a team to develop a maintainable
    code base using design documents, code reviews, style
    guides and other industry best practices.
  - A deep love for iterating closely with design to deliver
    magical experiences to the end user.

  Startup Culture Expectations:

  - We’re a small, fully remote, team; you have to be self-
    driven and disciplined.
  - The teams at TurbineOne thrive on autonomy, trust and solid
    communication.
  - While work/life balance is key to preventing burnout, in
    emergency situations, it is important that key personnel
    be available and involved.
  - The mission is key; given the sacrifices of those that
    serve, we want a team that will work to make every mission
    we are involved in a success, regardless of what that
    takes.

  Eligibility:

  - Must be eligible to obtain a clearance with the U.S.
    government.
