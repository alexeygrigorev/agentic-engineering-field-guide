description: |
  We require people to be on-site, 4 days/week at our
  Manhattan or Denver office and are unable to offer
  relocation support.

  LG Ad Solutions

  LG Ad Solutions is a global leader in connected TV (CTV) and
  cross-screen advertising. We pride ourselves on delivering
  state-of-the-art advertising solutions that integrate
  seamlessly with today's ever-evolving digital media
  landscape.

  The Opportunity:

  We are seeking someone to work on our Automatic Content
  Recognition (ACR) platform. This platform consists of a
  client-side SDK embedded in smart TVs, a back-end engine to
  conduct content matching against a large content reference
  database, and a series of algorithms. Our platform collects
  and processes billions of pieces of data per day and is the
  backbone of our business.

  Responsibilities:

  - Design, develop, and maintain scalable systems capable of
    low latency and high throughput using Golang and C++.
  - Collaborate on systems architecture updates.
  - Build data pipelines in Kafka.
  - Help drive best practices in QA, testing, and monitoring.

  Your Expertise:

  - 6+ years of backend engineering experience with an emphasis
    on low-latency, high-throughput systems that can scale
    efficiently
  - Code regularly in Golang and/or C++
  - Experience building high volume data pipelines with Kafka
  - Experience with debugging tools (e.g., GDB, Delve)
  - Experience working in an AWS environment that embraces IaC
  - Proficient in writing highly performant concurrent code
  - Writing clear technical documentation

  LG Ad Solutions provides equal work opportunities to all
  team members and applicants, and it prohibits discrimination
  and harassment of any type on the basis of race, color,
  ethnicity, caste, religion, age, sex (including pregnancy),
  national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by our
  policies or federal, state, or local laws.

  We want to ensure that our hiring process is accessible. If
  you need reasonable accommodation for any part of the
  application process because of a medical condition or
  disability, please send an email to careers@lgads.tv to let
  us know the nature of your request.

  Application Deadline: December 31, 2026

  Compensation & Benefits

  - Tier 1* (San Francisco Bay Area, New York City Tri-State
    Area, Los Angeles Metro Area, and Seattle Metro
    Area)$154,000 - $220,000/year
  - Tier 2* (all other U.S. Locations outside of Tier 1)$135,000
    – $192,500/yr
  - Offers Bonus
  - Benefits & Perks: 100% employer-paid medical, dental, and
    vision coverage for employees and eligible dependents.
    Company-paid life and AD&D, STD and LTD insurance, plus
    optional supplemental coverage. 401(k) with company match.
    Flexible Time Off (FTO). Paid parental leave.

  *Certain markets, including the San Francisco Bay Area, New
