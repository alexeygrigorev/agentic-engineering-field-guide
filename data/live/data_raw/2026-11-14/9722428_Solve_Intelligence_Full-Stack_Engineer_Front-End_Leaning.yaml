description: |
  At Solve Intelligence, we’re building the AI-powered
  infrastructure for the global Intellectual Property
  landscape. We need a visionary Full-Stack Engineer (Front-
  End Leaning) to define how humans interact with the next
  generation of AI.

  🏗️ The Role: Full-Stack Engineer

  You’ll be joining the leanest, most talent-dense engineering
  team in London. Chat is a starting point, but it’s not the
  destination. You aren't just building dashboards; you are
  inventing the UI/UX paradigms for AI-assisted legal work -
  interfaces that didn't exist 18 months ago.

  What you’ll own:

  - The Interface of AI: Lead the design and development of our
    user interface, moving beyond simple chat to create
    intuitive, high-performance tools for complex IP
    workflows.
  - Product Evolution: Rapidly prototype and ship features based
    on direct customer feedback from the world’s top law
    firms.
  - End-to-End Delivery: While front-end is your forte, you’ll
    dive into the back-end to ensure features are seamless,
    robust, and deployed at pace.
  - WYSIWYG Innovation: Own the integration and customization of
    advanced document editors (TinyMCE/CKEditor) to handle the
    heavy-duty drafting requirements of patent attorneys.
  - Engineering Culture: As an early hire, you will help set the
    bar for code quality, speed, and design excellence across
    the entire stack.

  💡 About Solve Intelligence

  We’re the fastest-growing startup transforming the IP
  industry.

  - Traction: 20-30% MoM revenue growth; selling to 700+ global
    IP teams (DLA Piper, tech boutiques, and global
    enterprises).
  - Proven Value: Users report 50-90% efficiency gains using our
    AI platform.
  - Backing: Recently featured in Sifted following our $40M
    Series B announcement, bringing our total funding to $55M
    from elite investors including Y Combinator, 20VC,
    Visionaries and others.

  👋 Your Team

  You’ll work directly with a founding team of AI PhDs and
  systems experts:

  - Sanj (CRO): PhD in AI (Gatsby Unit, UCL), ex-Huawei R&D,
    former lead at Magic Carpet AI (acquired).
  - Chris (CEO): PhD in AI (UCL), published researcher, ex-Dyson
    and Alan Turing Institute.
  - Angus (CTO): MEng Computer Science, ex-Qualcomm and Coremont
    (Brevan Howard)

  🚀 Who You Are

  We are a high-performance culture of "hackers" and builders.

  - Obsessed with Speed: You believe that shipping today is
    better than perfection next month. You iterate in days,
    not weeks.
  - Human-Centric: You understand that world-class AI is useless
    without a clean, intuitive interface that people actually
    enjoy using.
  - Extreme Ownership: You take pride in every pixel and every
    API call, ensuring a "five nines" level of reliability and
    polish.
  - Driven & Humble: You are willing to go the extra mile
    (including the occasional late night or weekend) to ensure
    our users are blown away.

  🛠️ What You Bring

  Must-Haves:

  - Experience: Professional experience building and scaling
    complex web applications.
  - TypeScript/React Expert: Deep mastery of modern front-end
    frameworks and state management.
  - Full-Stack Fluency: Comfortable navigating back-end systems
    and full-stack frameworks to get the job done.
  - Product Intuition: A track record of turning vague user
    needs into concrete, beautiful UI.

  Preferred & Nice-to-Haves:

  - Python Mastery: Experience with our back-end language of
    choice.
  - Editor Expertise: Experience working with WYSIWYG APIs
    (TinyMCE, CKEditor, Prosemirror).
  - Design Skills: Proficiency in Figma and a "good eye" for
    modern aesthetics.
  - Database Knowledge: Comfort with Postgres and data modeling.

  🎁 What We Offer

  - Competitive Salary + Significant Equity: We want you to have
    true ownership in the success of the company.
  - Founding Impact: You will have a direct hand in every
    product and architectural decision we make.
  - Support: Full visa sponsorship and private medical
    insurance.
  - The Environment: Free meals and a seat at the table with an
    incredibly smart, ambitious team.

  Ready to build the face of the future of AI? Apply now. 🚀
