description: |
  Role Summary

  The AIMS Application Support Senior Analyst is responsible
  for supporting the stability, availability, security, and
  performance of the AIMS Warehouse Management System, a Tier
  1 business-critical application supporting more than 50
  medical distribution centers across the United States and
  Canada.

  The role provides hands-on application and production
  support, including system monitoring, incident and service
  request resolution, application maintenance,
  troubleshooting, testing, documentation, and support for
  system upgrades and disaster recovery activities.

  The position operates within a 24x7 support model and
  collaborates with infrastructure, database, networking, SAP,
  middleware, cybersecurity, and third-party vendor teams to
  maintain reliable business operations.

  Required Technical Skills

  - Bachelor's degree in related field, or equivalent work
    experience, preferred.
  - 4+ years of experience in application development.
  - Experience supporting Windows Server environments.
  - Experience with SQL queries, troubleshooting, and basic
    performance analysis.
  - Familiarity with DTS, SSIS, and SSRS.
  - Understanding of database support and maintenance concepts.

  - Familiarity with applications hosted on Google Cloud
    Platform (GCP).
  - Exposure to scripting and automation using PowerShell or
    Perl.

  - Understanding of web application architecture and
    client/server environments.
  - Understanding of enterprise application integrations and
    APIs.
  - Familiarity with REST APIs, SOAP Services, HTTPS protocols,
    JSON, and XML.

  - Basic knowledge of DevSecOps practices and CI/CD pipelines.
  - Familiarity with Jenkins.
  - Experience using monitoring tools such as Dynatrace and
    BigPanda.
  - Experience or familiarity with ServiceNow, ITIL Framework,
    SailPoint, and CyberArk.

  Preferred Qualifications

  - Experience supporting Warehouse Management Systems (WMS).
  - Knowledge of supply chain, distribution center operations,
    and logistics processes.
  - Experience working in a 24x7 application or production
    support environment.
  - Good analytical, troubleshooting, communication, and
    collaboration skills.
  - Ability to work effectively with technical teams and
    business stakeholders.

  Key Responsibilities

  Application Maintenance & Support

  - Provide production support through a rotating three-shift
    support model.
  - Monitor application health, system alerts, batch processes,
    and performance indicators.
  - Investigate and resolve application incidents and service
    requests using ServiceNow.
  - Troubleshoot application, database, infrastructure, and
    integration-related issues and escalate complex problems
    to appropriate technical teams.
  - Support application version upgrades, patches, and scheduled
    maintenance activities.
  - Maintain clear incident resolution notes and technical
    documentation.

  Infrastructure & Platform Support

  - Assist with server maintenance activities, including
    operating system upgrades, security patching, and
    certificate renewals.
  - Support Windows-based application and database environments.
  - Work with infrastructure teams to resolve platform
    availability and security-related issues.

  Database & Performance Support

  - Perform SQL queries and basic database troubleshooting.
  - Assist in identifying application and database performance
    issues.
  - Support SQL Server maintenance activities and coordinate
    more complex issues with database support teams.

  Incident & Problem Management

  - Respond to production incidents and participate in SRT
    activities.
  - Engage appropriate support groups including Network,
    Database, Server Infrastructure, SAP, Integration
    Platforms, third-party vendors, and application SMEs.
  - Assist with root cause analysis and implementation of
    corrective actions for recurring incidents.
  - Track issues through resolution and provide appropriate
    status updates.

  Change & Release Management

  - Support application maintenance, upgrade, and deployment
    activities.
  - Participate in release testing, validation, and
    implementation.
  - Follow established change management and deployment
    processes.
  - Coordinate with team members and supporting groups during
    production changes.

  Compliance, Documentation & Resiliency

  - Support SOX compliance and audit-related activities.
  - Participate in annual Disaster Recovery (DR) testing
    activities.
  - Create and maintain support procedures, technical
    documentation, knowledge articles, and operational
    runbooks.
  - Participate in knowledge-sharing and cross-training
    activities to strengthen overall team support capability.

