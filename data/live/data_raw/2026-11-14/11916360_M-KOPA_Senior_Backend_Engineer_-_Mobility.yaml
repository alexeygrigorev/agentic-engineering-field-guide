description: |
  Join our expanding Mobility engineering team! We’re actively
  recruiting a Senior Backend Engineer as M-KOPA Mobility, our
  fast-growing e-mobility business, which has a 3x year-on-
  year growth rate! Build the event-driven microservices that
  power clean, affordable transport for riders and
  entrepreneurs across Africa, with AI tools like Claude Code
  alongside you. Because Mobility is scaling quickly, an
  entrepreneurial spirit will serve you well: you’ll enjoy
  building in a fast-growing business and taking real
  ownership.

  The Impact – Africa’s transport sector is massive,
  underserved, and at an inflection point, and the shift to
  electric is accelerating, led by East Africa. Your code will
  directly power the technology behind Kenya’s leading
  e-mobility financing platform. M-KOPA has already served
  over 7 million customers and unlocked more than $2 billion
  in credit. In Mobility, we’ve financed over 11,000 electric
  motorbikes, helping riders save more than $3 a day and
  cutting air pollution by 90%. It’s your chance to build tech
  for a business that’s literally transforming lives across an
  entire continent 🌍

  The Opportunity



  🚀 Scale challenges: M-KOPA Mobility is growing 3x year-on-
  year as its own fast-scaling business, with over 11,000
  e-motorbikes financed and demand climbing. As it grows, so
  do the opportunities to expand your scope, your impact and
  your career

  🎯 Mission-driven engineering: Every service you build helps
  put clean transport within reach of riders who’d otherwise
  be locked out of ownership

  🏆 Global recognition: Join a company named by the Financial
  Times as one of Africa’s fastest-growing for 5 consecutive
  years (2022–2026)

  🌱 Environmental impact: Electric is simply better for
  drivers, cities and the planet. Our e-motorbikes cut air
  pollution by 90% versus petrol equivalents



  What You’ll Do



  At M-KOPA, you’ll build sophisticated event-driven
  microservices with real-world impact. Our engineering teams
  own their solutions end-to-end, from architecture decisions
  to production monitoring, using AI coding tools like Claude
  Code to move faster along the way. Join us in combining
  cutting-edge .NET development with purpose-driven
  engineering that makes digital and financial inclusion
  possible across Africa.



  Technical Environment 💻



  - Languages & frameworks: C#/.NET
  - Cloud: We work in Azure, and welcome experience across AWS
    or GCP
  - Architecture: Event-driven systems and microservice
    development. We use Service Bus, and welcome experience
    with similar messaging technologies such as Kafka or
    RabbitMQ
  - Infrastructure: Kubernetes, Docker
  - Observability: Prometheus, Grafana
  - Engineering culture: DevOps, infrastructure as code,
    automated testing across all environments including
    production, continuous delivery
  - AI tooling: We use AI coding tools, including Claude Code,
    as part of our engineering workflow



  Our Engineering Approach 🚀



  As an engineer, you’ll work as a collaborator. More senior
  members will coach and contribute, placing an emphasis on:



  - High quality output
  - Observability and monitoring
  - Automated testing in all environments, including production
  - Infrastructure as code and DevOps practices
  - AI-assisted development with tools like Claude Code



  What You Need



  We expect you to be comfortable working as part of a team
  that owns the entire software stack, including supporting
  infrastructure, throughout the software lifecycle, from
  inception through production to decommissioning, under a
  DevOps culture. You’ll value the constraints that continuous
  delivery places upon engineering processes and embrace
  testing and observability as first-order concerns in
  development.



  Required Experience:



  - Strong grasp of C# .NET development
  - Experience with event-driven systems: Service Bus or similar
    messaging technologies such as Kafka or RabbitMQ
  - Microservices architecture experience
  - Experience with Azure, or other major cloud providers such
    as AWS or GCP
  - Familiarity with containerisation and orchestration tools
    (Kubernetes, Docker)
  - Experience with observability tools such as Prometheus and
    Grafana
  - Testing and deployment expertise
  - DevOps culture mindset
  - Experience working with AI coding tools, ideally Claude Code
    or similar

  Location & Benefits

  - Permanent role - Benefits Package include Bonus, Growth
    Shares & On-Call allowance
  - Fully remote role within UTC -1 to UTC +3 time zones
  - Work with diverse teams across UK, Europe, and Africa
  - Professional development programs and coaching partnerships
  - Family-friendly policies and flexible working arrangements
  - Well-being support and career growth opportunities

  Our Mission 🌍 We create financial inclusion for the
  traditionally excluded through a fair, flexible, customer-
  centric financing model, with M-KOPA Mobility extending that
  same model to clean transport. We strive to drive greater
  inclusion of women, youth, and low-income communities.

  Our Impact 💚

  - Connected 📱: 6 million smartphone customers, 2.5 million
    first-time smartphone users
  - Prosperous 💰: 70% of customers use their M-KOPA product for
    income generation, with 35,000+ livelihoods created for
    agents
  - Green 🌱: 11,000+ e-motorbikes financed, growing 3x year-on-
    year, cutting air pollution by 90% and helping riders save
    more than $3 a day

  Ready to build C# .NET solutions that put clean, affordable
  transport within reach of Every Day Earners, while advancing
  your career in modern, AI-powered backend engineering?



  Apply now to join our mission of transforming lives across
  Africa through technology.

  Why M-KOPA?

  At M-KOPA, we empower our people to own their careers
  through diverse development programs, coaching partnerships,
  and on-the-job training. We support individual journeys with
  family-friendly policies, prioritize well-being, and embrace
  flexibility.

  Join us in shaping the future of M-KOPA as we grow together.
  Explore more at m-kopa.com.

  Recognized four times by the Financial Times as one Africa's
  fastest growing companies (2022, 2023, 2024, 2025 and 2026),
  named on CNBC's World’s Top Fintech Companies 2025 & 2026
  and by TIME100 Most influential companies in the world 2023
  and 2024 , we've served over 10 million customers, unlocking
  $2 billion in cumulative credit for the everyday earners
  across Africa, in addition to over 10,000 e-bikes financed
  in Kenya.

  Important Notice M-KOPA is an equal opportunity and
  affirmative action employer committed to assembling a
  diverse, broadly trained staff. Women, minorities, and
  people with disabilities are strongly encouraged to apply.

  M-KOPA explicitly prohibits the use of Forced or Child
  Labour and respects the rights of its employees to agree to
  terms and conditions of employment voluntarily, without
  coercion, and freely terminate their employment on
  appropriate notice. M-KOPA shall ensure that its Employees
  are of legal working age and shall comply with local laws
  for youth employment or student work, such as internships or
  apprenticeships.

  M-KOPA does not collect/charge any money as a pre-employment
  or post-employment requirement. This means that we never ask
  for ‘recruitment fees’, ‘processing fees’, ‘interview fees’,
  or any other kind of money in exchange for offer letters or
  interviews at any time during the hiring process.

  Applications for this position will be reviewed on a rolling
  basis. Shortlisting and interviews will take place at any
  stage during the recruitment process. We reserve the right
  to close the vacancy early if a suitable candidate is
  selected before the advertised closing date.

  If your application is successful M-KOPA undertakes pre-
  employment background checks as part of its recruitment
  process, these include; criminal records, identification
  verification, academic qualifications, employment dates and
  employer references.
