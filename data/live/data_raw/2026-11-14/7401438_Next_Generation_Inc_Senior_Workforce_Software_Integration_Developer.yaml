description: |
  Job Title:

  Senior Workforce Software Integration Developer

  Job Summary:

  Next Generation, Inc, an Equal-Opportunity Employer, is
  seeking an experienced Senior Workforce Software Integration
  Developer with expertise in workforce management systems to
  join our team. The ideal candidate will have a strong
  background in integrating workforce software solutions,
  particularly in areas such as time and attendance,
  scheduling, payroll, and employee self-service. This role
  involves designing, developing, and maintaining complex
  integrations to support our workforce management system.

  Job Responsibilities:

  - Develop and maintain integrations for workforce management
    software, particularly in time and attendance, scheduling,
    payroll, and employee self-service modules.
  - Design and implement integration solutions to streamline
    data flow between workforce management systems and other
    enterprise systems.
  - Collaborate with HR and IT teams to gather requirements and
    translate them into technical specifications.
  - Perform data analysis and validation to ensure accuracy and
    integrity of integrations.
  - Optimize and troubleshoot existing integrations to improve
    performance and reliability.
  - Provide technical support and training to end-users on
    integration usage.
  - Stay updated with the latest workforce management
    technologies and best practices in software integration.

  Job Requirements:

  - Bachelor’s degree in Computer Science, Information
    Technology, or a related field.
  - 5+ years of experience in workforce software integration
    development.
  - Strong expertise in workforce management systems and their
    components.
  - Proficiency in integration technologies such as REST APIs,
    SOAP, and middleware platforms.
  - Experience with SQL, PL/SQL, and other database
    technologies.
  - Knowledge of workforce management data models and business
    processes.
  - Excellent problem-solving skills and attention to detail.
  - Strong communication and collaboration skills.

  Preferred Skills:

  - Experience with other workforce management applications and
    modules.
  - Familiarity with Agile development methodologies.
  - Certification in workforce management technologies.

  Job Benefits:

  Competitive FTE salary range based on experience, education,
  and geographical location of $100,000 - $130,000 USD base.
  Benefits for full-time employees include:

  - Paid time off
  - Medical insurance
  - Dental plan
  - Vision plan
  - Life insurance
  - STD/LTD Disability
  - Paid holidays
