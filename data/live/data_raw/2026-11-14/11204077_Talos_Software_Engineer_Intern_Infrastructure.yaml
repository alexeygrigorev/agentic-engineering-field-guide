  Talos: Institutional Fabric for the Digital Asset Market

  Founded in 2018, Talos provides institutional-grade trading
  technology for the global digital asset market, powering
  many of the major players in the crypto ecosystem. Our
  mission is clear: to advance the mass adoption of digital
  assets by seamlessly connecting institutions to the digital
  asset ecosystem. We are committed to building the most
  innovative and trusted platform in the world, supporting the
  entire trading lifecycle.

  At Talos, you’ll find an environment that champions kindness
  and respect, values diverse perspectives, and upholds
  inclusivity at every turn. We believe every member of our
  team brings invaluable insights and abilities that drive
  Talos forward. In our pursuit of excellence, we foster a
  culture of trust, integrity, collaboration, and mutual
  growth.

  We are a tight-knit yet globally distributed team of highly
  experienced engineers and business leaders, with hubs in New
  York, London, Singapore, and Cyprus. Whether in-office or
  remote, you’ll be part of a hybrid-friendly environment
  where your unique talents and insights will play a crucial
  role in building something extraordinary

  Software Engineer Intern, Infrastructure

  Talos is seeking an Software Engineering Intern to join our
  Infrastructure team for the Summer 2027. As an Software
  Engineering Intern on the Infrastucture team at Talos, you
  will work alongside engineering teams to build, scale and
  maintain the system that powers Talo’s trading and
  settlement platform. The team is made up of engineers that
  know building great systems takes time, and we spend the
  time to ensure the safety, security and performance of our
  platform. We value strong communication skills and the
  ability to get things done in a collaborative environment.

  This internship will run for 12 weeks.



  Want to learn more about Talos’s engineering culture? Check
  out Sonic, our first open-source project which allows Talos
  to achieve microsecond network stack latency in Go:
  https://github.com/talostrading/sonic

  Responsibilities

  - Collaborate with the team to design, maintain and scale
    infrastructure systems
  - Contribute to automation initiatives, including CI/CD
    pipelines, infrastructure-as-code, and deployment tooling
  - Support the performance of production systems through
    monitoring, logging and observability improvements
  - Cross-functionally communicate with teams to understand and
    implement infrastructure requirements
  - Be part of an open and transparent culture

  Ideal Experience

  - Class of 2028 pursuing a Bachelor’s degree in Computer
    Science or related field
  - Experience with one or more programming languages (e.g.,
    Python, Go, Java, or similar)
  - Familiarity with Linux systems, shell scripting and/or
    networking fundamentals
  - Exposure to cloud platforms and online hosting (e.g. AWS,
    GCP)
  - Interest in distributed systems and platform engineering
  - Demonstrated development experience (applicable coursework,
    projects, internships, etc.)
  - Experience in either crypto or finance, or a strong desire
    to learn
  - Excellent written and verbal communication skills
  - Local to London HQ

  Check out these videos and links to learn more about Talos
  and our culture!

  - Spotlight Article: Talos Snapshot by DRW
  - Podcast: 2023 episode with co-founders Anton & Ethan
  - Website: Explore Talos: Products, Investors, Team & More
  - Case Studies: Real world examples of client solutions
  - Awards: Talos Wins Hedgeweek Global Digital Assets Award
    2024
  - Culture: Award-winning, Forbes-listed, low-attrition team

  Andreessen Horowitz re: Talos: "The company best suited to
  drive institutional adoption is one that understands
  traditional capital markets deeply and is forward-thinking
  enough to fully grasp the promise of crypto. Talos is that
  company."



  Benefits

  You will also enjoy a comprehensive array of competitive
  benefits, regardless of your location, within our warm,
  welcoming, and ambitious company culture. Some of our
  benefits include:

  - Retirement plan contributions
  - Unlimited Vacation + a PTO bonus: Employees that take 15
    days of vacation, with 5 days being consecutive, receive a
    $2000 USD bonus.
  - Bonus and stock ownership
  - Medical, dental, and vision insurance
  - Paid parental leave for 20 weeks, after 1 year of service
  - Global offsites and team outings
  - A one-time stipend towards at-home office set-up for all
    employees
  - A wellness credit of $50 accrued monthly, to go towards
    things like gym memberships, ski-passes, and work out
    classes.
  - A lunch credit of $25 USD towards lunches for days in-office
  - Donation matching up to $100 USD annually
  - Other in-office perks: Catered lunches on Tuesdays, snacks,
    and drinks



