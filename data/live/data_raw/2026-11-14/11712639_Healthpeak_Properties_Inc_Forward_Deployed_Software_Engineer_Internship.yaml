description: |
  Our mission At Healthpeak, we give our Forward Deployed
  Software Engineers the autonomy of a startup with the
  backing, scope, and staying power of a well‑established
  organization. We exist to transform technology into a
  revenue‑generating arm of the real estate business, building
  products and platforms that directly support our tenants,
  partners, and the teams who serve them every day. We are
  looking for interns to join us for Summer 2027 ! As an FDSE,
  you will be part of a small, agile pod and will directly
  embed with business teams. You will work side‑by‑side with
  operators, asset managers, and customer‑facing colleagues to
  rapidly identify opportunities, design solutions, and
  deliver real value. This is a hands‑on, high‑impact role for
  engineers who thrive close to users, enjoy ambiguity, and
  want to see their work make a tangible difference. You will
  relentlessly prototype, test, launch, and scale new
  ideas—often moving from concept to production in the matter
  of weeks. Our first and most important customers are our
  peers inside Healthpeak, and our ultimate goal is to create
  delightful, seamless experiences for our tenants and
  partners by relentlessly minimizing friction. What we’re
  looking for

  - Inquisitive engineers who care just as much about why we’re
    building it as how it should be built. Those who dare to
    reimagine how work can be done.
  - Proven programming expertise across languages such as
    Python, Java, C++, and TypeScript/JavaScript, with hands-
    on experience developing alongside AI agents (e.g., Claude
    Code). Backgrounds in Computer Science, Mathematics,
    Software Engineering, Physics, or Data Science are
    especially relevant.
  - Strong technical problem-solving skills, including practical
    experience with data structures, storage systems, cloud
    infrastructure, front-end frameworks, and related
    technologies.
  - Demonstrated ability to collaborate effectively with both
    technical and non-technical stakeholders, thriving in
    fast-paced environments with evolving goals and iterative
    user feedback.
  - Self-directed and adaptable learner, capable of working
    independently and making sound decisions with minimal
    oversight.
  - Expected hours: 40 hrs per week over 12 weeks
  - Pay rate: $25/hr
