description: |
  THE ROLE & THE TEAM

  As Backend Engineer for Zalando Payments, you will design,
  develop, test, and operate our core APIs that allow our
  customers to pay in a secure and engaging fashion. Fashion
  retail imposes many interesting challenges on the payment
  experience that we address through tailored deferred payment
  options and other products. The services you will build in
  this role steer these processes and directly interface with
  the merchant systems. You will make sure the product
  complies with the demanding and high standards of the
  fintech industry.

  Zalando Payments builds the technologies for all financial
  transactions in the Zalando fashion store and our other
  consumer-facing apps. We work to deliver a flawless user
  experience in the checkout, as well as the processing of
  payments and reconciliation in the backend. Through smart
  risk steering, we boost conversion and deliver a competitive
  advantage to our customers, taking in the entire financial
  process.

  WHY YOU SHOULD BE INTERESTED…

  - Create highly scalable solutions and own the entire
    application lifecycle. You will design technical solutions
    within your team’s architecture, and you are responsible
    for implementation, testing, and operation in the
    production environment.
  - You will be part of a team where best practices like
    continuous integration, code quality, code reviews, test-
    driven development, etc. are kept at very high standards,
    therefore you should also be positive and firm in your
    attitude towards them.
  - Together with your team you will own your code and decide on
    the technologies and tools to deliver as well as operate
    large-scale applications on cloud (AWS), based on a
    microservices architecture.
  - Share your knowledge with your colleagues helping them to
    grow their technical skills.

  WE’D LOVE TO MEET YOU IF…

  - You have a degree in computer science or a related field, or
    are an experienced IT Specialist. You are interested in
    making an impact by building and operating production
    services. You have already built and ideally operated
    production services in the past, preferably in the field
    of e-commerce or payments.
  - We do expect you to embrace the opportunity to actively
    learn new technologies and practices.
  - We are working in a big and complex environment. We expect
    you to be able to coordinate and communicate effectively
    with your peers in your team just as well as beyond team
    boundaries.
  - Great communication skills and the ability to lead technical
    decision-making with the team
  - You bring excellent problem-solving skills, with a logical
    and pragmatic attitude
  - Ideally, you are familiar with the Java ecosystem and
    frameworks (e.g. Spring Boot), You know how to find your
    way around microservice architecture, REST services,
    asynchronous distributed systems, etc.

  OUR OFFER

  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - 27 days of holiday a year to start for full-time employees
    (+1 day for every calendar year up to 30 days)

  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Lounge by Zalando, discounts from
    external partners

  - Family support, including counselling and dedicated services
    for parents and carers

  - Company pension scheme

  - Employee shares programme

  - Health and wellbeing options, including Well-hub

  - Mental health support and coaching

  - Development through our training platform and biannual peer-
    to-peer review

  - 2 paid volunteering days a year

  - Relocation assistance (subject to prior agreement)

  INCLUSIVE BY DESIGN

  If you think you have what it takes, we encourage you to
  apply even if you don't meet every single requirement. You
  may just be the right candidate for this or other roles!

  At Zalando, our vision is to be the leading European
  technology platform for fashion and lifestyle – one that
  thrives on diversity and is truly inclusive by design. We
  believe that diverse teams fuel innovation and creativity,
  and we actively seek out talent from all backgrounds.

  We actively seek to reduce bias in our hiring and employment
  processes, focusing on your qualifications, skills, and
  contributions. To support this, we kindly ask that you
  refrain from including personal details such as your photo,
  age, or marital status in your CV, ensuring a fair and
  equitable evaluation based solely on your abilities and
  potential.

  We are committed to providing an exceptional and accessible
  candidate experience for everyone. If you require any
  accommodations to support you throughout the hiring process,
  please let us know – we are here to assist you.

  Discover more about our commitment to creating a diverse and
  inclusive workplace: https://jobs.zalando.com/en/our-
  culture/diversity-and-inclusion
