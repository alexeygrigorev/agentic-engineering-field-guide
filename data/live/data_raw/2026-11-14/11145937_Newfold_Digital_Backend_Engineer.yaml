description: |
  Who We Are

  At Bluehost, we believe all small businesses deserve the
  opportunity to succeed online. Our mission is to give small
  businesses the confidence to think big. We're the all-in-one
  platform for small businesses to grow online with powerful
  simplicity, premium performance, smart tools and human
  support.

  Why we're hiring for this role

  To help scale the services behind Bluehost's core hosting
  products, systems supporting millions of small-business
  websites. You'll own backend features in Python, on Linux,
  backed by MySQL, with real say in how we modernize this
  platform, and real input on technical decisions. Perl and
  cPanel knowledge is a plus, but not a requirement. We'll
  help you build that context.

  What You'll Do & How You'll Make Your Mark

  - Design, build, and maintain backend services and internal
    APIs in Python, with ownership over the features you ship

  - Administer and troubleshoot Linux-based production systems,
    including performance tuning and root-cause investigation

  - Write, optimize, and maintain MySQL queries and schemas
    against high-traffic, production-scale data

  - Use AI across the delivery lifecycle — development,
    debugging, tests, and working through unfamiliar code —
    and review what it generates before it ships, checking
    provenance and licensing of generated snippets

  - Ship reliable, well-tested features in partnership with
    senior engineers and cross-functional teams

  - Work across both legacy and modern codebases, including
    Perl-based components where applicable, contributing to
    their gradual modernization

  - Weigh in on technical design decisions and help shape how
    legacy systems get modernized, rather than just executing
    tickets

  - Own production troubleshooting and carry on-call rotation as
    needed, learning incident response practices along the way

  Who You Are & What You'll Need to Succeed

  - 3-5 years of backend development experience

  - Strong working knowledge of Python and Linux systems
    administration

  - Solid MySQL experience: writing queries, designing schemas,
    and diagnosing performance issues

  - AI-augmented delivery: you use AI across the delivery
    lifecycle, not just code generation, and can say which
    models suit which problems and where you don't use them.
    You review AI-generated code knowing its failure modes,
    and you work within clear boundaries for what customer
    data enters a prompt and what a security or compliance
    review will ask for.

  - Experience working in a collaborative, Agile development
    environment with real sprint and release discipline

  - Demonstrated troubleshooting instincts and ownership of
    production issues under pressure, including as a front-
    line responder

  - Bonus: familiarity with Perl and with cPanel environments is
    beneficial but not required

  Why You'll Love Us

  - Work-life balance. Meaningful work, balanced by a culture
    that respects your time.

  - A culture of belonging. We celebrate what makes each of us
    different, with 20+ affinity groups connecting employees
    globally.

  - We care about you. Excellent Health, HSA, Dental, Vision,
    Matching 401K, Life/AD&D/STD/LTD, Tuition Reimbursement,
    Pet Insurance, and generous PTO.

  - Where can we take you? Mentorship, new challenges, and real
    career growth. Unfold new possibilities #OTOD!

  Employment with Newfold Digital is at-will and nothing in
  this Job Description should be interpreted or construed to
  alter the at-will employment relationship.

  This Job Description includes the essential job functions
  required to perform the job described above, as well as
  additional duties and responsibilities. This Job Description
  is not an exhaustive list of all functions that the employee
  performing this job may be required to perform. The Company
  reserves the right to revise the Job Description at any
  time, and to require the employee to perform functions in
  addition to those listed above.
