description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Junior Backend Engineer to join Bask
  Health's engineering team and help build, maintain, and
  improve the backend systems powering our telehealth
  platform.

  You'll work on APIs, databases, application logic, and
  backend services supporting patient experiences, clinical
  workflows, pharmacy operations, and merchant-facing tools.

  This is a hands-on engineering role for someone with a
  foundation in backend development who wants to strengthen
  their technical skills while contributing to real production
  software.

  Our platform uses TypeScript, Node.js, AWS, SST, and SQL
  databases, with technologies such as tRPC, Prisma, and
  Drizzle across our engineering stack.

  You'll work alongside experienced engineers, participate in
  code reviews, and gradually take ownership of increasingly
  complex features.

  We're looking for someone who enjoys building software,
  learns quickly, asks thoughtful questions, and takes pride
  in writing clean, reliable code.

  You don't need extensive professional experience or a
  background in healthcare. We care about your ability to
  write code, solve problems, understand how backend systems
  work, and continue developing your skills.

  What You'll Do

  - Build, test, and maintain backend features supporting Bask's
    telehealth platform.
  - Develop APIs, backend services, and application logic using
    TypeScript and Node.js.
  - Work with SQL databases to retrieve, update, and organize
    application data.
  - Help implement functionality supporting patient records,
    clinical workflows, pharmacy operations, and merchant
    tools.
  - Build and maintain integrations between internal services
    and third-party APIs.
  - Work with senior engineers to understand technical
    requirements and implement backend solutions.
  - Learn and contribute to serverless applications built using
    AWS and SST.
  - Assist with background jobs, asynchronous processing, and
    event-driven workflows.
  - Write clean, readable, maintainable code that follows
    established engineering practices.
  - Create automated tests to verify backend functionality and
    help prevent regressions.
  - Debug application issues, investigate errors, and contribute
    to resolving production problems.
  - Participate in code reviews and incorporate feedback from
    other engineers.
  - Collaborate with frontend engineers to ensure APIs and
    backend services support product requirements.
  - Work with product managers and engineers to break
    requirements into manageable development tasks.
  - Help maintain database schemas, application models, and API
    documentation.
  - Follow appropriate security practices when working with
    sensitive patient and customer information.
  - Use AI-assisted development tools such as Cursor and Claude
    Code to support coding, debugging, testing, and learning
    while validating generated code.
  - Assist with monitoring, logging, and troubleshooting backend
    services.
  - Contribute to improving existing code, reducing technical
    debt, and simplifying development workflows.
  - Take ownership of smaller features from implementation
    through testing and deployment.
  - Learn how to evaluate technical tradeoffs and make sound
    engineering decisions.
  - Participate in team discussions, share ideas, and ask
    questions when requirements are unclear.
  - Continue developing your understanding of backend
    architecture, cloud infrastructure, databases, and
    production software systems.

  Requirements

  - 0–2 years of professional software engineering experience,
    or equivalent hands-on experience through internships,
    freelance work, bootcamps, personal projects, or open-
    source contributions.
  - Working knowledge of JavaScript or TypeScript.
  - Familiarity with Node.js and backend application
    development.
  - Experience building or contributing to an API, backend
    service, or server-side application.
  - Basic understanding of SQL databases, relational data
    models, and database queries.
  - Understanding of programming fundamentals, data structures,
    and basic software design principles.
  - Familiarity with REST APIs or similar API technologies.
  - Basic understanding of how web applications communicate with
    backend services and databases.
  - Experience using Git or another version control system.
  - Ability to write readable, organized code and explain how it
    works.
  - Familiarity with debugging, testing, and resolving
    programming issues.
  - Willingness to learn cloud infrastructure, serverless
    development, and production deployment practices.
  - Interest in using AI-assisted development tools while
    understanding and validating the code they produce.
  - Ability to work on assigned development tasks, ask
    questions, and incorporate feedback.
  - Strong problem-solving skills, curiosity, and attention to
    detail.
  - Good written and verbal communication skills.
  - Ability to collaborate with engineers, product managers, and
    other team members.
  - Comfortable working in a fast-moving environment and
    learning unfamiliar technologies.
  - No previous healthcare industry experience required.

  Nice to Have

  - Internship or professional experience developing backend
    applications with TypeScript or Node.js.
  - Experience building and deploying personal projects or small
    production applications.
  - Familiarity with AWS, SST, or other cloud infrastructure.
  - Exposure to AWS Lambda, SQS, EventBridge, or serverless
    application development.
  - Experience using PostgreSQL, MySQL, or another relational
    database.
  - Familiarity with Prisma, Drizzle, or other ORM tools.
  - Experience with tRPC, GraphQL, or modern API frameworks.
  - Familiarity with React, Next.js, or full-stack TypeScript
    applications.
  - Experience writing automated unit or integration tests.
  - Familiarity with authentication, authorization, and basic
    application security.
  - Experience integrating third-party APIs or processing
    webhooks.
  - Understanding of asynchronous programming, background jobs,
    or message queues.
  - Familiarity with CI/CD pipelines, GitHub Actions, or
    automated deployments.
  - Experience contributing to open-source projects or
    maintaining a technical portfolio.
  - Interest in healthcare technology, SaaS platforms, or
    e-commerce systems.
  - Experience using Cursor, Claude Code, or similar AI-assisted
    development tools.
  - Experience working on a team-based software project with
    code reviews and shared repositories.
