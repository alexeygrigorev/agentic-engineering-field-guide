description: |
  Job Description

  Job Summary

  As a Software Engineer I, you are part of an agile team that
  works to enhance, design, and deliver the software
  components to the firm's state-of-the-art technology
  products in a secure, stable, and scalable way. As an entry-
  level member of a software engineering team, you execute
  basic software solutions through the design, development,
  and troubleshooting of a single technical area within a
  business function, while gaining skills and experience to
  grow within your role.

  Job Responsibilities

  - Executes basic software solutions, design, development, and
    technical troubleshooting
  - Writes secure and high-quality code using the syntax of at
    least one programming language with peer guidance
  - Interprets architecture and design representations as well
    as nonfunctional requirements to develop secure, stable
    software against a defined architecture
  - Actively applies automation to reduce manual toil in the
    Software Development Life Cycle
  - Addresses basic code quality issues
  - Gathers, analyzes and synthesizes basic data sets in service
    of technical troubleshooting and generating insights to
    drive continuous improvements
  - Breaks down routine technical tasks to troubleshoot and
    solve issues

  Required qualifications, capabilities, and skills

  - Baseline knowledge of software, applications and technical
    processes within a given technical discipline (e.g.,
    cloud, artificial intelligence, Android, etc.)
  - Ability to work in large, collaborative teams to achieve
    organizational goals, with a passion to build an inclusive
    and innovative culture
  - Demonstratable ability to code in one or more languages
  - Understanding of software skills such as business analysis,
    development, maintenance, and software improvement
  - Proficiency in developmental toolsets
  - Basic knowledge of industry-wide technology trends and best
    practices

  Preferred qualifications, capabilities, and skills

  - Exposure to cloud technologies

  Additional Information

  12 month contract to hire Full-time
