description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You’ll Do

  As a Senior Software Engineer on the Identity & Access
  Management (IAM) team, you will play a key role in
  designing, building, scaling, and maintaining CoreWeave’s
  rapidly expanding IAM platform. You will leverage your
  experience in distributed systems to design, extend, and
  harden a platform that secures our high-performance cloud
  infrastructure. You’ll be working at the intersection of
  design, developer experience, and platform architecture to
  help scale our services to the next order of magnitude. Here
  are just a few of the interesting and exciting things you’ll
  be doing:

  - Architect and build high-scale, low-latency distributed
    systems that power CoreWeave’s identity, authentication
    and authorization services
  - Design and implement customer-facing and internal APIs and
    backend services that underpin our IAM platform
  - Optimize system performance to ensure that services remain
    highly available and performant under unpredictable load
    patterns
  - Collaborate cross-functionally with stakeholders across the
    business, including product managers, designers and TPMs,
    to shape the team’s strategy and roadmap
  - Drive operational excellence by participating in on-call
    rotations and building automated tooling for monitoring,
    alerting, and incident response
  - Demonstrate and shape best-practices in software engineering
    by embracing AI for development, insisting on maintainable
    and testable code, and participating in thorough code
    reviews
  - Work with incredible people in a supportive, iterative,
    high-trust, agile environment

  Who You Are

  - Experience: Minimum of 5 years of professional experience
    developing, operating and maintaining backend services in
    a production environment
  - Programming: Strong proficiency developing software in one
    or more of our preferred languages (Go, TypeScript,
    Python)
  - Distributed systems: Knowledge of microservices
    architecture, RESTful/gRPC API design, and asynchronous
    messaging patterns
  - Observability: Fluency with best practices in observability
    (logging, metrics, dashboards, alerting)
  - Database design:  Solid understanding of relational
    databases, schema design, and SQL
  - Testing and quality: Strong commitment to automated testing
    (unit, integration, and E2E) and CI/CD pipelines
  - Ownership: Demonstrated ownership of code quality,
    performance, and maintainability from development through
    production
  - Security: Experience with authentication, authorization and
    security best practices
  - Problem solving: A proven track record of debugging complex
    performance bottlenecks and distributed system failures in
    a production environment
  - Communication: Excellent verbal and written communication
    skills, able to work effectively with both technical and
    non-technical team members

  Preferred

  - Experience with Kubernetes and a conceptual understanding of
    its major components.
  - Experience building reliable and scalable platform services
    that process large amounts of data.
  - Experience developing identity products on top of standards
    including OIDC, OAuth2.0, SAML, and JWT
  - Experience managing cloud infrastructure (AWS, GCP, etc.)
  - Familiarity with Infrastructure-as-Code tools and practices

  Wondering if you’re a good fit? We believe in investing in
  our people, and value candidates who can bring their own
  diversified experiences to our teams – even if you aren't a
  100% skill or experience match. Here are a few qualities
  we’ve found compatible with our team. If some of this
  describes you, we’d love to talk.

  - You love to solve complex problems and build high-scale,
    low-latency distributed systems.
  - You’re curious about how to evolve cloud platforms and scale
    infrastructure globally for the next generation of AI
    workloads.
  - You’re an expert in one or more preferred programming
    languages like Go, TypeScript, or Python, and have deep
    technical knowledge of distributed systems.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $165,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

