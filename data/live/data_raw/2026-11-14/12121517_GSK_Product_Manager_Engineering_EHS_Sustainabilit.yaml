description: |
  About the role

  Are you an experienced Product Manager who wants to use
  digital, data and AI to improve how Engineering,
  Environment, Health & Safety (EHS) and Sustainability
  capabilities are delivered?

  In this role, you will shape the strategy and roadmap for a
  portfolio of digital products supporting Engineering, EHS
  and Sustainability across GSK. You will work with business
  and technology teams to turn complex needs into simple,
  scalable and sustainable product solutions.

  You will focus on measurable business outcomes, identifying
  opportunities to simplify processes, improve user experience
  and make responsible use of data, automation and AI.

  Key Responsibilities

  In this role, you will:

  - Define and maintain the product vision, strategy and roadmap
    for Engineering, EHS and Sustainability capabilities,
    aligned with business priorities and enterprise technology
    strategy.
  - Partner with business leaders, users and Product Owners to
    understand business challenges and translate them into
    clear product outcomes and priorities.
  - Develop investment proposals and make roadmap decisions
    based on business value, cost, risk, compliance,
    operational impact and technical dependencies.
  - Guide Product Owners and cross-functional teams through
    discovery, delivery, release and adoption, ensuring
    solutions remain aligned with agreed product outcomes.
  - Identify opportunities for simplification, standardisation,
    automation and responsible use of AI and data, taking
    initiatives from discovery through delivery, adoption and
    benefits realisation.
  - Measure product performance through adoption, user
    experience, reliability, process outcomes and business
    value, while ensuring appropriate governance across cyber
    security, data protection, quality, validation and service
    readiness.



  Why You?

  Basic Qualifications & Experience

  We are looking for professionals with these required skills
  to achieve our goals:

  - Degree in Computer Science, Information Technology,
    Engineering, Data Science, Business, Life Sciences or a
    related discipline, or relevant experience in product
    management, digital technology or business systems.
  - Experience defining and delivering a product vision,
    strategy and roadmap for a digital product, platform or
    capability.
  - Experience in at least one of the following areas:
    Engineering, including plant maintenance, calibration,
    validation, content management or capital projects; EHS,
    including incident management, occupational health,
    industrial hygiene or chemical compliance; or
    Sustainability, including energy efficiency, clean energy
    or waste management.
  - Experience translating business requirements and user needs
    into product outcomes, investment proposals and
    prioritised delivery plans.
  - Experience working with Product Owners and cross-functional
    teams across product discovery, design, delivery, release,
    adoption and operation.
  - Experience operating within enterprise technology
    governance, including areas such as architecture, cyber
    security, data protection, quality, validation, change
    management or service readiness.

  Preferred Qualifications & Experience

  If you have the following characteristics, it would be a
  plus:

  - Experience developing strategies, roadmaps or business cases
    for AI-enabled, data-driven or advanced analytics
    products.
  - Experience taking AI or data-enabled capabilities from
    discovery and experimentation through delivery, adoption
    and scale.
  - Understanding of generative AI, machine learning,
    intelligent automation and analytics from a product
    management perspective.
  - Experience defining product measures covering business
    value, adoption, user experience, quality, reliability and
    operational performance.
  - Commercial and financial experience, including evaluating
    cost, benefits, risk and total cost of ownership.
  - Experience influencing senior stakeholders and working
    across business, technology, data, cyber security and
    external partners in a global organisation.



  Why this role?

  This is an opportunity to shape digital products that
  support some of GSK’s most important Engineering, EHS and
  Sustainability capabilities.

  Your decisions will influence how effectively these areas
  operate, from improving user experience and reliability to
  simplifying processes and enabling the responsible use of AI
  and data. You will help ensure investment is focused on the
  right problems and that products deliver measurable,
  sustainable value throughout their lifecycle.

  Closing date for applications: 19th November 2026.

  #hybrid #AGTech

  Skills

  Agile Methodology, Cross-Functional Teamwork, Data Analysis,
  Design Thinking, DevOps, Prioritization, Product Development
  Research, Product Roadmapping, Project Management, Return on
  Investment (ROI), Software Development, Strategy Deployment,
  User Experience (UX), User Interface (UI) Design

  Why GSK?

  Uniting science, technology and talent to get ahead of
  disease together.

  GSK is a global biopharma company with a purpose to unite
  science, technology and talent to get ahead of disease
  together. We aim to positively impact the health of 2.5
  billion people by the end of the decade, as a successful,
  growing company where people can thrive. We get ahead of
  disease by preventing and treating it with innovation in
  specialty medicines and vaccines. We focus on four
  therapeutic areas: respiratory, immunology and inflammation;
  oncology; HIV; and infectious diseases – to impact health at
  scale.

  People and patients around the world count on the medicines
  and vaccines we make, so we’re committed to creating an
  environment where our people can thrive and focus on what
  matters most. Our culture of being ambitious for patients,
  accountable for impact and doing the right thing is the
  foundation for how, together, we deliver for patients,
  shareholders and our people.

