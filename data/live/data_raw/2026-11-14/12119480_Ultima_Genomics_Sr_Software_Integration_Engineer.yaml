description: |
  Rapidly Growing Life Sciences Technology Company

  Ultima Genomics is a rapidly growing company that is
  developing ground-breaking genomics technologies. Our
  mission is to continuously drive the scale of genomic
  information to enable unprecedented advances in biology and
  improvements in human health. We have developed a
  foundational new approach to sequencing at scale that
  overcomes limitations due to the high costs of current
  technologies. We are well-funded and have raised over $700
  million from global top-tier investors and partners who
  share our vision. Our team brings together unique and
  diverse expertise across multiple disciplines, from
  healthcare and life sciences, to engineering, to technology
  and software and beyond. We are a collaborative group,
  including successful entrepreneurs, chemists, hardware and
  software engineers, genomics and biotechnology experts,
  molecular and computational biologists, software and
  algorithm experts, and operations and commercial leaders.
  Join us to develop and commercialize technologies that
  unleash the power of genomics at scale and empower the
  future of human health.

  We are looking for a highly motivated Senior Software
  Integration Engineer to join our team!

  As a Senior Software Integration Engineer, you will design
  and build agents and automated solutions for software
  integration, testing, release and deployment processes, and
  will create an authoritative software knowledge base
  resource for the organization. The ideal candidate is a
  builder who can translate ambiguous processes into reliable
  automated systems, and a systems thinker who can turn
  complex technical information into clear, discoverable
  structure.

  This is a full-time remote position with a preferred
  location in SF Bay Area.

  How You'll Contribute

  - Design, build, and maintain AI agents and automated
    workflows that track software availability, release
    readiness, testing, and deployment status across many
    individual software components. Ensure robust
    orchestration, error handling, and observability to
    surface failures and edge cases
  - Build and maintain a structured knowledge base to serve as
    the single source of truth for the software estate that
    can be queried by agents
  - Integrate with Atlassian tools (Jira, Confluence), GitHub,
    Microsoft 365 (Teams, Copilot), Monday.com, and internal
    systems
  - Build connectors and middleware between AI agents and
    internal or third-party systems as needed to automate data
    exchange and process handoffs
  - Independently identify and execute on automation
    opportunities in software management
  - Other job duties as assigned

  Qualifications, Skills, Knowledge & Abilities

  - BS/BA in computer science or an engineering discipline
  - 5+ years of software engineering experience, including
    experience building and maintaining automation or workflow
    orchestration systems
  - Proficiency in shell scripting and at least one high-level
    programming language such as Python in a Linux environment
  - Experience building AI agents or LLM-powered applications
    using agent frameworks or LLM APIs, including tool use and
    orchestration
  - Experience integrating with APIs such as Atlassian (Jira,
    Confluence), GitHub, Microsoft 365 (Teams, Copilot), or
    Monday.com
  - Understanding of software release, QA, and/or deployment
    processes is a plus
  - Experience with cloud computing infrastructure such as AWS
    is desirable
  - Excel in collaborating both within and across teams
  - Excellent written and verbal communication skills

  At Ultima Genomics, your base pay is one part of your total
  compensation package. This role pays between $120,000 and
  $160,000, if performed in the US, and your actual base pay
  will depend on your skills, qualifications, experience, and
  location.  Please note that the compensation details listed
  in US role postings reflect the base salary only, and do not
  include bonus, equity, or benefits.  This role is also
  eligible for a competitive benefits package that includes:
  medical, dental, vision, life, and disability insurance;
  401(k) retirement plan; flexible spending & health savings
  account; paid holidays; paid time off; employee assistance
  program; and other company benefits.

