description: |
  About Us



  Upwell is an Order-to-Cash platform for Logistics. Our
  platform combines practical AI applications with deep
  logistics expertise to automate complex freight processes,
  from document processing to predictive analytics. We focus
  on leveraging the rapidly evolving AI landscape to solve
  concrete supply chain challenges.



  Position Overview



  As a Senior Software Engineer, you'll implement proven AI
  technologies to solve complex transportation challenges -
  from automating freight document processing to creating
  intelligent rating systems. You'll work at the intersection
  of modern AI capabilities and tangible business problems
  that impact global supply chains.



  What You'll Do



  - Design and implement features using our modern tech stack
    (NextJS, React, TypeScript) that intelligently solve
    logistics challenges
  - Integrate AI services and models into logistics workflows to
    automate manual processes, including document processing
    for BOLs, PODs, and freight invoices
  - Create intelligent systems for rate optimization and carrier
    matching using available AI tools
  - Implement efficient integrations with TMS systems (McLeod,
    Descartes, MercuryGate)
  - Design scalable architectures that effectively combine
    logistics workflows with AI capabilities
  - Lead technical discussions and mentor team members on AI
    integration



  Requirements



  - 5+ years of software development experience with modern web
    applications
  - Deep expertise in TypeScript and React, with strong
    understanding of modern web architecture
  - Experience integrating AI services and APIs into production
    applications
  - Strong foundation in software engineering principles and
    system design
  - Bachelor's degree in Computer Science or equivalent
    practical experience
  - Enthusiasm for applying practical AI solutions to real-world
    logistics challenges



  What Will Set You Apart



  - Experience implementing AI solutions in logistics or supply
    chain
  - Knowledge of transportation industry workflows and data
    structures
  - Experience with document processing and OCR systems
  - Familiarity with AI-powered development tools (Cursor,
    Windsurf, GitHub Copilot)
  - Background in logistics automation and TMS systems
    (Descartes Aljex, Tai, Revenova, McLeod, MercuryGate,
    Trimble, etc.)
  - Experience with accounting system integrations such as
    QuickBooks Desktop, QuickBooks Online, Sage, Netsuite,
    etc.
  - Track record of successful systems integration in production
    environments



  Benefits



  - Competitive salary and equity package
  - Health, dental, and vision insurance
  - 401(k)
  - Professional development budget
  - Flexible PTO policy



  Location. Must be located full time in Omaha (Elkhorn)
  Nebraska.



  - Join us in building the next generation of intelligent
    freight management solutions that make global supply
    chains more efficient through practical applications of AI
    technology.
