description: |
  Who We Are

  Serval is the AI-native enterprise service management
  platform that automates the work legacy IT service
  management tools only track. Our AI agents build the
  automations that power employee support, then resolve
  requests against them instantly—helping teams across IT, HR,
  finance, legal, and beyond automate work within one governed
  platform.

  Companies including Fox, Live Nation, Notion, Ramp, and
  Lucid Motors run on Serval. Headquartered in San Francisco,
  we’ve raised $277 million from investors including Sequoia
  Capital, Redpoint Ventures, First Round, General Catalyst,
  and Elad Gil, most recently a $150 million Series C at a $3
  billion valuation.

  We’re building a team that moves quickly, takes ownership,
  and wants to make a meaningful impact on how the world’s
  largest organizations work. Come help us build what’s next
  for enterprise service management.

  About the team

  The Agent Deployment team is a customer-facing technical
  team, central to how Serval turns product capability into
  real business outcomes. The org is a family of roles:
  Deployment Strategists are the primary technical
  relationship and AI advisor for each customer, partnering
  with Deployed Software Engineers to build enterprise-grade
  features and products. Deployment Success Managers own each
  customer's long-term success, building the systems and
  motions that scale adoption, expansion, and renewal well
  past go-live.

  Role Overview

  Deployed Software Engineers are customer-facing software
  engineers: shipping features, building new capabilities, and
  expanding our product surface area inside some of the
  world’s most complex enterprises. You’ll work directly with
  customers to turn messy, high-stakes workflows into reliable
  AI-driven systems, shipping production code that influences
  both revenue and product direction. This role isn’t about
  building demos or prototypes; it’s about shipping
  enterprise-grade features and products for our customers.

  If you're energized by building something that didn't exist
  before, with a direct line between your work and company
  growth, this is the role for you.



  What You’ll Do

  - Ship core product: architect and ship production-grade
    systems that become part of Serval's core product, born
    from the real needs of our most complex customers.
  - Build platform services: design backend services, APIs, and
    integrations that extend Serval's AI agent platform across
    customers, with a focus on reliability, security, and
    long-term maintainability.
  - Turn workflows into product: work directly with customers to
    turn messy, high-stakes workflows into generalized,
    reusable product capabilities.
  - Own the deployment lifecycle: own key deployments from
    architecture through scaling and continuous improvement.

  Example Recent Projects

  - Productionize Serval's voice agent from alpha into a viable
    channel for enterprise users to reach the Serval AI agent,
    first at a Fortune 500 financial services company.
  - Upgrade our worker environment to communicate with on-
    premise Active Directory and Microsoft platforms over LDAP
    and PowerShell, and ship self-serve deployment so
    customers can stand up a Serval worker themselves.
  - Extend our workflow system to ingest knowledge from any
    source, making a customer's own systems searchable by the
    agent, a capability that won us the deal.

  What You’ll Need

  - Software engineering experience, ideally in a product-
    focused or customer-facing role
  - Strong coding and system design skills, with experience
    shipping production systems and building external
    integrations
  - High ownership in fast-moving environments with limited
    structure, and a track record of taking ambiguous problems
    to shipped, measurable impact.
  - A clear communicator with both technical and business
    stakeholders.

  Nice to Have

  - Startup experience as a founder or early engineer.
  - Background working with enterprise customers or supporting
    complex technical sales cycles.
  - Experience building or deploying AI/LLM-powered features or
    agent-based systems.
  - Familiarity with IT, security, service management, or
    workflow automation.

  What We Offer

  - Impact: Be a key player in shaping the success of our
    product and company.
  - Growth: Build a fundamentally new AI product offering with
    the support of our experienced team and investors. Grow
    rapidly with the company.
  - Culture: Join a culture that values innovation, ownership,
    accountability, and fun.
