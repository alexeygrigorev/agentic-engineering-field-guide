description: |
  About Neo4j:

  Neo4j is the graph intelligence platform that transforms
  data into knowledge to power the next generation of
  intelligent applications and AI systems. It includes
  enterprise-ready knowledge graphs for accurate, explainable,
  and governed AI; the most comprehensive, trusted, and easy-
  to-deploy graph capabilities across any environment and data
  source; and an unmatched ecosystem trusted by 84 of the
  Fortune 100 and supported by the world’s largest graph
  community. Intelligence that works. Results that matter.

  Built to work everywhere and integrate with everything
  across every cloud for dynamic, personalized, and autonomous
  AI systems. We deliver quicker results, contextual
  knowledge, and solutions that impact customers and employees
  across the business.

  Our Vision:

  At Neo4j, we have always strived to help the world make
  sense of data.

  As business, society and knowledge become increasingly
  connected, our technology promotes innovation by helping
  organizations to find and understand data relationships. We
  created, drive and lead the graph database category, and
  we’re disrupting how organizations leverage their data to
  innovate and stay competitive.

  The Role:

  Join our dynamic Cypher team at Neo4j, where we are at the
  forefront of optimizing the core codebase that receives
  query strings and transforms them into efficient, logically
  sound execution plans. This role delves deep into the heart
  of the database, determining the most rapid and effective
  means of retrieving queried data from the underlying stores
  and indexes of the property graph model.

  Responsibilities: As a Cypher Software Engineer, you will
  not only enhance and optimize the query planner but also
  contribute to the development of comprehensive features that
  elevate the capabilities of the Cypher language and the
  Neo4j database. Your impact will extend across the entire
  codebase, from the parser to the storage files and indexes.
  Success in this role requires the ability to think
  abstractly, discuss the pros and cons of different options,
  and anticipate edge cases in a design.

  What You'll Bring:

  - Experience with performance-driven development, e.g.,
    profiling, benchmarking, and optimizing code
  - Familiarity with Agile development processes (TDD,
    kanban/scrum, pair programming)
  - Knowledge of or willingness to learn Scala
  - A desire to learn.

  Nice to also have:

  - Experience programming in Scala and/or Java
  - Understanding or previous experience with database design
    and implementation
  - Interest or experience in developing compilers
  - A strong foundation in algorithm design and analysis
  - Interest in exploratory learning and transferring academic
    research into production-grade products
  - 5+ years of experience developing high-quality, highly
    scalable production-level software

  We don’t expect you to have experience across all these
  areas. We have a mix of different skills in our team. Many
  of our teams are spread over two or more locations, so you
  should be comfortable working as part of a distributed team.

