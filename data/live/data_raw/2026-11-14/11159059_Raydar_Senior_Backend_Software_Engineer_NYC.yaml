description: |
  About the company

  Our client operates a food-logistics business within an
  established physical automation group. Its office-lunch
  service coordinates batch restaurant orders and delivers
  individually packed meals without fees or tips. The team is
  looking for a backend engineer to help build reliable
  systems behind a high-volume, real-world operation.

  The role

  We are hiring a Senior Backend Software Engineer to build
  the services, APIs, and data systems that power a growing
  food operation. You will work on distributed systems where
  reliability, scale, routing, optimization, and automation
  matter every day. This role suits an engineer who can make
  thoughtful architectural decisions in ambiguous environments
  and turn them into durable production systems.

  What you'll do

  • Build backend services in Java and Go.

  • Design and operate distributed services, APIs, and data
  stores for high-scale workflows.

  • Improve routing, optimization, automation, reliability,
  and operational scalability.

  • Make architectural decisions in ambiguous problem spaces
  and contribute to quarterly technical roadmaps.

  • Build monitoring, testing, observability, and operational
  safeguards into production systems.

  • Partner with frontend, mobile, product, and operations
  teams to deliver end-to-end capabilities.

  • Mentor teammates and contribute to high-quality code
  review practices.

  Requirements

  What we're looking for

  • 5 to 8 years of backend software engineering experience.

  • A degree in computer science or another STEM field.

  • Experience at a large technology company followed by
  experience at a startup with a strong engineering team.

  • Proficiency in backend programming languages such as Java
  or Go.

  • Familiarity with relational or NoSQL databases such as
  PostgreSQL, MongoDB, or Redis.

  • Experience with AWS, Google Cloud, or Azure.

  • Understanding of RESTful APIs, microservices, and
  distributed systems.

  • Strong debugging, problem-solving, and system architecture
  skills.

  • A record of sustained ownership, with no more than two job
  changes in the past five years.

  Bonus points

  • Knowledge of CI/CD pipelines and DevOps practices.

  • Experience with Docker and Kubernetes.

  • Exposure to large-scale data processing or event-driven
  architectures.

  • Leadership in engineering projects or experience mentoring
  other engineers.

  Benefits

  Compensation and benefits

  • Base salary of $176K to $242K.

  • Equity awards and an annual performance bonus.

  Location and work model

  • Five days per week onsite in New York City.

  • Full-time position.

  • Visa transfers are supported.
