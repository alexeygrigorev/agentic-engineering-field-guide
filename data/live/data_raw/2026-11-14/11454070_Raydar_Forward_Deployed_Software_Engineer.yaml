description: |
  About the company

  Our client is a technology consulting company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Serve as a software engineer embedded with client teams,
  creating and supporting web and AI-enabled applications.
  Take responsibility for technical delivery from early design
  to live operation, and explain the work to business
  audiences. The position is fully on-site and includes
  periodic client visits.

  What you'll do

  - Build and support web applications and AI-enabled
    applications for large corporate clients.

  - Take full responsibility for technical projects, from early
    design through to live release.

  - Work independently in shifting, loosely defined client
    settings.

  - Walk clients through technical designs and finished work in
    a clear, advisory style.

  - Visit client sites roughly monthly to collaborate face to
    face with stakeholders.

  Requirements

  What we're looking for

  - At least 3 years of professional software engineering
    experience, with 3 to 8 years being typical.

  - A track record of shipping and supporting web or AI-enabled
    applications.

  - Past experience guiding engineering efforts in a lead,
    founding or similarly high-responsibility position.

  - Self-direction when requirements are unclear.

  - Real experience working with clients or customers, including
    explaining technical topics to non-technical people.

  - Readiness for a fast-paced environment where deadlines may
    occasionally stretch into weekends.

  Bonus points

  - Prior experience as a startup co-founder or CTO.

  - A degree in computer science or engineering.

  - Early involvement at a small AI-focused software firm.

  - Regular use of AI-assisted coding tools.

  Benefits

  Compensation and benefits

  - Base salary: USD 180,000 per year

  - Performance-based variable pay

  - Equity

  - Health, dental and vision coverage

  - Flexible time off

  - Life and disability insurance

  - Tax-advantaged health and commuter accounts

  Location and work model

  - New York City, NY, United States

  - On-site, 5 days per week in office

  - Full-time
