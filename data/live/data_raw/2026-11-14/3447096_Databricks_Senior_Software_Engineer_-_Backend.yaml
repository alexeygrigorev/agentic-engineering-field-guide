description: |
  P-1327

  At Databricks, we are passionate about helping data teams
  solve the world's toughest problems — from making the next
  mode of transportation a reality to accelerating the
  development of medical breakthroughs. We do this by building
  and running the world's best data and AI infrastructure
  platform so our customers can use deep data insights to
  improve their business.

  Founded by engineers, Databricks has started a multi-year
  journey to build the best Lakehouse Platform. For this we
  are building on top of a great foundation but our goal is to
  go further to build dramatically better products. We want to
  revisit every component to provide our customers with the
  fastest, easiest to use and most secure data platform for
  all their data workloads.

  As a software engineer, you will join as a founding member
  of not only the Berlin site, but really as a founding team
  for our multi-year journey to achieve our Lakehouse vision.
  You will be involved in the entire development cycle and
  exemplify all core Databricks values.

  The impact you'll have:

  Our backend teams span many domains across our essential
  service platforms. For instance, you might work on
  challenges such as:

  - Problems that span from product to infrastructure including:
    distributed systems, at-scale service architecture and
    monitoring, workflow orchestration, and developer
    experience.
  - Build reliable, secure and high performance services and
    client libraries for storing and accessing humongous
    amount of data on cloud storage backends, e.g., AWS S3,
    GCS, Azure Blob Store.
  - Develop product features that empower our customers to
    easily store and access their data.

  What we look for:

  - BS (or higher) in Computer Science, or a related field
  - 5+ years of production level experience in one of: Java,
    Scala, C++, or similar language.
  - Experience developing large-scale distributed systems.
  - Experience working on a SaaS platform or with Service-
    Oriented Architectures.
  - Knowledge of SQL.

  About Databricks

  Databricks is the Data and AI company. More than 20,000
  organizations worldwide — including adidas, AT&T, Bayer,
  Block, Mastercard, Rivian, Unilever, and 70% of the Fortune
  500 — rely on the Databricks Data + AI Platform to build and
  scale data and AI apps, analytics and agents. Headquartered
  in San Francisco with 30+ offices around the globe,
  Databricks offers a unified platform that includes Genie,
  Lakebase, Agent Bricks, Lakeflow, Lakehouse, and Unity
  Catalog. To learn more, follow Databricks on LinkedIn, X,
  YouTube, and Instagram. Benefits At Databricks, we strive to
  provide comprehensive benefits and perks that meet the needs
  of all of our employees. For specific details on the
  benefits offered in your region click here.

