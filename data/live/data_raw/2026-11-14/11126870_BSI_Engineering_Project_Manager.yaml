description: |
  We exist to create positive change for people and the
  planet. Join us and make a difference too!

  Job Title: Engineering Project Manager

  Location: Hemel Hempstead

  Job Type: Permanent, Full-Time

  Compensation: £45,000 - £50,000 + Bonus + Excellent Benefits



  For over 125 years, BSI has helped shape safer products,
  better systems and a more resilient world. As we celebrate
  this milestone, we’re continuing to invest in our people,
  our laboratories and our technical capabilities and we’re
  now looking for an Engineering Project Manager to join us in
  our Hemel Hempstead testing laboratory.



  About the Role:



  As our Engineering Project Manager, you’ll be based on our
  purpose-built Hemel Hempstead testing laboratory, that
  delivers testing across a wide range of industry sectors and
  product types including PPE, Latex, IoT Security,
  Automotive, Fire detection, Doors & Windows, and
  Construction Products.



  In this role you will be working closely with our internal
  stakeholders to understand each individual project need,
  scope of works and project deliverables; managing projects
  from cradle to grave.



  You’ll take full ownership for the project management and
  delivery of new test equipment, following a design and build
  cycle across our Product Certification testing facility at
  Hemel Hempstead. You will oversee projects from requirement
  capture through solution consideration, construction phase
  and final handover to stakeholders.



  Key Duties:

  - The Engineering Project Manager will be responsible for the
    management of turn-key projects from cradle to grave.
  - You’ll work alongside Lab Subject Matter Experts,
    calibration, maintenance, safety etc to understand the
    requirements of a given test rig/facility and project
    requirements.
  - Work with the design team to generate concept solutions,
    through to agreed final solution. Through this cycle the
    project manager will remain responsible for the design
    workload and eventual output.
  - Working in collaboration with the Project team and service
    providers, you will be responsible for delivering the
    equipment/rig/improvement into the live environment in
    line with the agreed solution.
  - Ensure validation of all requirements is obtained during the
    build cycle and prior to handover.
  - The role will require you to manage contractors/service
    providers and communicate progress to the internal client,
    complete with validation stages.
  - On project completion you will be responsible for project
    handover, ensuring all information and required
    documentation is handed over including maintenance support
    documentation/activity, declaration of conformity, schemes
    of examination and calibration requirements etc.
  - Throughout the projects you will be required to provide
    weekly reporting to the Programme Manager on all
    activities capturing key metrics throughout all stages.



  Knowledge / Skills / Abilities:



  - We are seeking an experienced project manager who holds a
    high level of technical/engineering experience.
  - You will have a proven background in the implementation and
    delivery of multiple, complex engineering focused
    projects.
  - Ideally, you will be qualified to at least HNC/HND (or
    similar) standard within a technical/engineering
    discipline.
  - Completion of a formal project management
    qualification/certification.
  - High awareness of Health & Safety such as method statements
    and risk assessments.
  - You’ll need to be a self-starter with the ability to work
    under your own initiate with limited supervision.
  - You will be working closely with internal stakeholders,
    external clients, contracting teams and suppliers, so
    excellent communication and people management skills are
    paramount.
  - The ability to evaluate and control cost and make sound
    financial recommendations to ensure projects are delivered
    within specified budgets is also crucial.



  What we offer:

  BSI offers a competitive total reward package, an
  independent and varied job in an international environment,
  flexible working hours, ongoing training, and development
  with the inclusion of Annual Bonus, Contribution Based
  Pension, Private Healthcare, 27 Days Annual Leave + Bank
  Holidays, Income Protection & Life Assurance.





