  About Us

  BSI is a business improvement and standards company and for
  over a century BSI has been recognized for having a positive
  impact on organizations and society, building trust and
  enhancing lives.

  Today BSI partners with more than 77,500 clients in 195
  countries and engages with a 15,000 strong global community
  of experts, industry and consumer groups, organizations and
  governments. Utilizing its extensive expertise in key
  industry sectors - including automotive, aerospace, built
  environment, food and retail, and healthcare - BSI delivers
  on its purpose by helping its clients fulfil theirs. Living
  by our core values of Client-Centricity, Agility, and
  Collaboration, BSI provides organizations with the
  confidence to grow by partnering with them to tackle
  society’s critical issues – from climate change to building
  trust in digital transformation and everything in between -
  to accelerate progress towards a better society and a
  sustainable world.

  BSI is an Equal Opportunity Employer dedicated to fostering
  a diverse and inclusive workplace.
