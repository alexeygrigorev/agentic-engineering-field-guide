description: |
  Build an enabled Engineering community at NewDay

  We’re building our Engineering Enablement team and are
  looking for a Senior Software Engineer who enjoys solving
  problems that make other engineers more effective.

  Rather than focusing on a single customer-facing product,
  you’ll build the internal tools, services and platform
  capabilities that help engineering teams deliver safely and
  quickly. You’ll have scope to influence a developing
  roadmap, identify opportunities to improve how we engineer
  software, and turn those ideas into practical solutions.

  This is a hands-on senior engineering role. You’ll write and
  ship software while also leading complex work end to end,
  collaborating with engineering leadership, mentoring others
  and helping shape better engineering practices. You’ll also
  have opportunities to explore how AI-enabled development
  tools improve engineering effectiveness when used
  thoughtfully and responsibly.

  How you'll contribute:

  - Design, build and ship high-quality software, including
    internal developer tools and shared platform capabilities
    that make engineers more productive.

  - Lead complex engineering work from idea to delivery,
    identifying problems, evaluating solutions and bringing
    the right people together to deliver improvements.

  - Help shape resilient engineering foundations, contributing
    to architecture, CI/CD, observability, documentation and
    maintainable technical solutions.

  - Support other engineers to succeed, through mentoring,
    technical discussions, thoughtful reviews and clear
    documentation.

  We're looking for these essential skills:

  - Strong hands-on experience with C# and .NET or TypeScript,
    including building and designing REST APIs.

  - Experience writing and maintaining automated tests
    throughout the software development lifecycle, alongside
    strong continuous integration and continuous delivery
    practices.

  - The ability to contribute to system and architecture
    decisions, with a focus on resilience, scalability and
    maintainability.

  - Experience taking significant engineering work from idea
    through to delivery, working autonomously while bringing
    stakeholders and other engineers with you.

  - Strong communication and an enabler mindset: you can explain
    technical decisions clearly, create useful documentation,
    mentor others and enjoy building tools or services that
    make engineers' jobs easier.

  We’re also interested in engineers who are thoughtful about
  AI-assisted development. You might already use tools such as
  GitHub Copilot or Claude and understand both where they can
  add value and where engineering judgement still matters.

  We'd love for you to know or want to learn:

  It would be useful, but isn't essential, if you also have
  experience with:

  - Microsoft Azure or another Platform-as-a-Service (PaaS)
    cloud environment.

  - Building internal developer tooling, shared engineering
    services or reusable platform capabilities.

  - Observability, metrics, data analysis or shared engineering
    tooling.

  - Event-driven architectures or working across more than one
    programming language.

  - Contributing to engineering standards and technical
    direction across teams, or supporting the recruitment and
    onboarding of engineers.

  Why join this team?

  You’ll be joining as the Engineering Enablement team is
  being built, so this is an opportunity to influence what it
  becomes rather than simply inherit a fixed roadmap.

