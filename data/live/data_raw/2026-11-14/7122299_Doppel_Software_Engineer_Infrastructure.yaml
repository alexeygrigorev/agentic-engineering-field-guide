description: |
  Why Join Doppel

  Doppel is building the future of social engineering defense.
  Our AI-native platform uses agentic AI to protect
  executives, employees, customers, and brands from phishing,
  impersonation, fraud, and other AI-powered threats across
  digital channels. We help some of the world’s most
  recognized brands detect and dismantle attacker
  infrastructure while strengthening employee resilience
  through threat-informed training and simulation. By unifying
  Digital Risk Protection, Human Risk Management and Email
  Security, Doppel connects threats into a real-time
  intelligence graph to power faster disruption, smarter
  defense, and modern security awareness at scale.

  Backed by leading investors including Andreessen Horowitz
  and Bessemer Venture Partners, and trusted by leading
  enterprises, Doppel is a rapidly growing Series C startup
  building the future of social engineering defense. Our team
  combines deep cybersecurity expertise, operational rigor,
  and startup velocity to solve some of the internet’s most
  urgent trust and safety challenges.

  What We're Building

  We're building the AI-native social engineering defense
  platform.

  This means we're designing scalable systems that monitor
  billions of domains, social media accounts, apps, dark web
  forums, etc., and leverage AI agents to identify and
  neutralize digital threats.

  What We're Looking For

  We’re looking for an experienced backend engineer to build
  out the infrastructure required to rapidly scale up our
  engineering organization. A few examples of the work we’ve
  done recently:

  - Built self-hosted Elasticsearch infrastructure on
    Kubernetes, enabling real-time search across millions of
    alerts and associated metadata.
  - Defined core infrastructure using Terraform (IaC), allowing
    reproducible, version-controlled environments and faster
    onboarding for new engineers.
  - Stood up a dedicated staging environment, enabling safer
    releases, feature validation, and automated integration
    testing before production rollouts.
  - Introduced observability and tracing (metrics, logging,
    distributed tracing), improving our ability to debug
    performance issues and maintain reliability at scale.

  What We Offer

  🚀 A mission-driven culture with low ego, high ownership,
  deep customer obsession, and exceptional talent density

  🍽️ Free lunch and dinner in the office

  🌴 Flexible PTO

  ✈️ Quarterly team offsites

  Join Doppel

  Doppel is the first platform built to dismantle digital
  deception at scale. We scan over 150 billion entities daily
  and deploy continuously adaptive AI SOC agents, paired with
  expert human analysts, to uncover and disrupt the
  infrastructure behind phishing, impersonation, and online
  fraud before attacks can spread. Our Threat Grid turns every
  customer signal into shared intelligence, making each
  disruption smarter, faster, and more effective.

  We’re not just another cybersecurity company. We’re defining
  the future of social engineering defense, where trust is
  protected, and deception becomes unprofitable. Backed by
  top-tier investors and trusted by some of the world’s most
  recognized brands, Doppel is growing fast. If you’re driven
  to solve real-world problems with bold technology, we’d love
  to meet you.
