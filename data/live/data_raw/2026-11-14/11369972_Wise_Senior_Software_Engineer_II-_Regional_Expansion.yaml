description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  We are expanding our Latam & Mea Payments Team and are
  looking for ambitious and highly skilled Senior Software
  Engineers to join the engineering team.

  You will lead the development of the critical integrations
  enabling money movement across the Latam & Mea regions. By
  integrating directly with local payment systems and
  sophisticated cross-border payment systems, you will unlock
  essential functionality that accelerates our growth,
  building products that empower consumers and businesses to
  manage their finances globally.

  Your Role:

  Your role involves implementing integrations with local
  banks, payment providers, and connecting our platform to
  local payment systems as well as optimizing funnels to
  handle the complexities of cross-country money movement
  within your specific area.

  This role requires a high level of technical and product
  excellence and a passion for building high-quality,
  scalable, and compliant solutions tailored for the unique
  financial infrastructure and regulatory landscape of our
  region. Beyond writing good code, you will propose solid
  technical designs, participate in code and design reviews,
  and collaborate with global engineering teams to build the
  core infrastructure that unlocks and grows new markets.

  What You'll Be Doing:

  - Design, develop, test, deploy and manage direct connections
    with local payment schemes and integrations with regional
    banks to establish foundation-level money movement
    capabilities across diverse international markets.
  - Define the technical direction by advocating for high-
    quality designs, providing critical feedback in peer
    reviews, and actively shaping the future roadmap for our
    payments ecosystem.
  - Take your local in-market learnings and work with global
    engineering teams to ensure the systems you build
    seamlessly influence and integrate with our worldwide
    platform.
  - Participate in on-call rotations to support operational
    teams and address incidents, ensuring our platform remains
    secure and consistently available for our customers.
  - Collaborate effectively with cross-functional teams,
    including product managers, designers, and engineers in
    our other global offices, to align on product vision and
    technical implementation for regional expansion

  Qualifications

  Qualifications

  - A proactive and ambitious mindset, with a desire to take
    ownership and make a significant impact
  - Autonomous team player able to work effectively with minimal
    supervision.
  - Proven experience as a Senior Software Engineer, with a
    strong track record of delivering high-quality, scalable
    systems and a strong Product mindset
  - Deep technical expertise in back-end development and
    microservices architecture
  - Experience in designing and building software systems and
    collaborating on technical designs within a team or domain
  - Strong ability to provide constructive feedback during code
    and design reviews
  - Excellent problem-solving skills and the ability to break
    down complex challenges

  Nice to Have:

  - Experience working on payments systems, money movement,
    financial integrations
  - Experience in the FinTech or payments industry
  - Experience leveraging LLMs (e.g. claude code) to enhance the
    software development lifecycle.
  - Java proficiency

  Additional Information

