description: |
  About Lendable

  Lendable is on a mission to build the world's best
  technology to help people get credit and save money. We're
  building one of the world’s leading fintech companies and
  are off to a strong start:

  - One of the UK’s most exciting unicorns with a team of over
    800 people
  - Among the fastest-growing tech companies in the UK
  - Profitable since 2017
  - Backed by top investors including Balderton Capital and
    Goldman Sachs
  - Loved by customers with the best reviews in the market (4.9
    across 10,000s of reviews on Trustpilot)

  So far, we’ve rebuilt the Big Three consumer finance
  products from scratch: loans, credit cards and car finance.
  We get money into our customers’ hands in minutes instead of
  days.

  We’re growing fast, and there’s a lot more to do: we’re
  going after the two biggest Western markets (UK and US)
  where trillions worth of financial products are held by big
  banks with dated systems and painful processes.

  Join us if you want to

  - Take ownership: you are trusted to make decisions that drive
    a material impact on the direction and success of Lendable
    from day 1
  - Work in small teams of exceptional people: Lendies are
    relentlessly resourceful. We challenge the status quo to
    solve problems and find smarter solutions
  - Build the best technology in-house: we use new data sources,
    machine learning and AI to make machines do the heavy
    lifting

  About the role

  Engineering Managers at Lendable are a unique group of
  amazing humans that combine strategic insight, hands-on
  technical leadership, and strong people management to shape
  and evolve our engineering teams. They operate at the
  convergence of business goals, technical execution, and team
  coaching, ensuring that every project and process aligns
  seamlessly with our mission and values. They build a
  resilient foundation for sustained success by focusing on
  team growth and technical innovation.

  We’re looking for an experienced Engineering Manager to lead
  one of the teams delivering our Zable App, used by over 1
  million customers on iOS and Android. In this role, you’ll
  act as both a visionary and a hands-on leader, driving the
  team’s delivery efficiency, technical excellence, and cross-
  functional collaboration. You’ll own and refine the delivery
  process, balancing feature development with technical
  investments and maintaining high team development standards.
  With a proactive approach, you’ll guide the team to meet our
  business goals while nurturing a collaborative and growth-
  oriented culture.

  There’s much to accomplish as an Engineering Manager at
  Lendable. You’ll help create a high-performing, resilient
  team that achieves today’s objectives while building a
  foundation for long-term success. From enhancing delivery
  quality to developing a robust, valuable platform, your work
  will ensure we deliver impactful solutions that meet the
  needs of our customers and stakeholders alike.

  Our Tech Stack

  The backend of our Zable app is Kotlin, AWS & GraphQL and
  the frontend is React Native with TypeScript, and NextJS.
  Across the rest of Lendable we also use PHP 8, Symfony,
  MySQL, PostgreSQL, RabbitMQ, Docker, Kubernetes, React,
  ArgoCD, Behat, PHPUnit, Jest, and Maestro.

  How you'll have an impact

  - Own and optimise the delivery process to ensure features
    reach customers efficiently, contributing directly to
    quarterly and yearly OKRs focused on customer satisfaction
    and delivery timelines.
  - Collaborate with Product Managers to balance feature
    development with technical improvements, achieving a
    sustainable pace for the team that aligns with business
    outcomes.
  - Build and develop a high-performing team by conducting
    regular assessments, cross-training, and implementing
    clear career progression pathways, supporting team
    resilience and adaptability.
  - Drive technical strategy in alignment with business goals,
    using insights from Tech Leads and senior engineers to
    make strategic trade-offs between short-term deliverables
    and long-term technical investments.
  - Ensure high-quality output by establishing best practices in
    quality assurance and incident management, tracking
    metrics such as uptime and incident reduction in the
    team’s area.
  - Facilitate cross-team collaboration to align on shared
    objectives and integrated roadmaps, ensuring seamless
    workflows and supporting key OKRs across dependent teams.
  - Embed continuous feedback within the team culture, fostering
    an environment of continuous improvement and aligning the
    team’s performance with organisational goals.

  What we're looking for

  - A degree in Computer Science or relevant experience in
    software engineering and technical management.
  - 5+ years of experience in engineering leadership, with a
    strong track record in driving delivery processes, team
    development, technical strategy, and cross-team
    collaboration.
  - Strong understanding of the mobile app development process
    and experience managing cross functional backend and
    frontend teams in an environment with dependencies on
    other business areas.
  - Demonstrated ability to balance feature delivery with
    technical improvements, ensuring a sustainable and high-
    quality pace for the team.
  - Strong business acumen and a proactive approach to gaining
    deep business context, enabling alignment of technical
    decisions with broader business goals.
  - Proven experience in owning delivery timelines and quality
    outcomes, with the ability to identify and resolve
    bottlenecks quickly and efficiently.
  - Skilled in building high-performing teams, with experience
    in skills assessment, cross-training, and fostering a
    continuous learning and improvement culture.
  - Ability to strategically guide technical decisions without
    being a blocker, with familiarity in technical debt
    management, architectural planning, and quality assurance
    best practices.
  - Exceptional communication and collaboration skills, with
    experience facilitating joint planning and maintaining
    alignment across multiple teams and stakeholders.
  - Proficiency in managing incidents and on-call processes,
    ensuring platform robustness and reliability.

  Interview process

  - A quick phone call with someone from the People Team
  - An Introductory call to the role with either one of our
    Senior EM's or one of our VP's of Engineering
  - Three onsite interviews:
    - Delivery Management and Team Collaboration
    - Technical Interview (don’t worry, we won't ask you to code)
    - People and Team management
  - One last interview with someone from the senior leadership
    team.

  Life at Lendable

  - Winning team: the opportunity to scale up one of the world’s
    most successful fintech companies
  - Flexible working: flexible approach tailored to each role.
    Hybrid roles require three days in-office weekly; fully
    remote roles include regular opportunities for in-person
    connection through socials and off-sites
  - Socials & connection: opportunities and events to come
    together, socialise, and get to know each other beyond the
    office walls
  - Health coverage: support for your physical and mental
    wellbeing, including private health cover
  - Retirement & savings: long-term financial wellbeing through
    retirement savings plans
  - Employee referral programme: earn a competitive bonus when
    you refer successful new team members
  - Office meals & snacks: enjoy a fully stocked kitchen, plus
    complimentary lunches prepared by in-house chefs on in-
    office days at select locations
  - Sustainable commuting: cycle-to-work and electric vehicle
    salary sacrifice schemes available in select locations

  Please note: The availability and details of specific
  benefits vary by location and role. For more information,
  please speak to your Talent Partner.

  Check out our blog!
