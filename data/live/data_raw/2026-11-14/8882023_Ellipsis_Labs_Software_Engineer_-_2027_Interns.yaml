description: |
  Ellipsis Labs is a profitable, venture-backed New York
  startup building performant DeFi protocols on high-
  throughput decentralized infrastructure. Our long-term
  mission is to build a more efficient, transparent, and fair
  financial system.

  Our flagship product, Phoenix Perpetuals, brings
  professional-grade perpetual futures to Solana. Phoenix has
  processed over $4 billion in trading volume and is growing
  20% month over month, adding to the more than $300 billion
  our products have facilitated to date. Behind Phoenix is a
  lean, high-caliber team with experience at top trading
  firms, blockchain companies, and tech companies.

  Ellipsis Labs is seeking software engineering summer interns
  to join our team in 2027. As an early-stage startup, we
  appreciate bright generalists who can iterate and ship
  quickly. In this role, you will:

  - Build real product features and/or platform components
    across the stack, front end, back end, infra, or on-chain,
    based on your skills and interest
  - Own scoped projects end-to-end: problem definition → design
    → implementation → testing → deployment → monitoring
  - Collaborate with design and engineering to deliver fast,
    reliable, and secure experiences
  - Instrument and improve performance, reliability, and
    observability; write clear tests and documentation

  Qualifications

  Required

  - Hands-on experience building software (courses, personal
    projects, research, or internships) in one or more
    languages such as TypeScript/JavaScript, Python, Rust,
    Java, C/C++; you write clear, tested code
  - Solid CS fundamentals (data structures, algorithms, systems
    thinking) and familiarity with Git and basic debugging
  - Ability to make informed trade-offs with business context;
    high agency and a team-first mindset
  - Curiosity about DeFi/crypto (prior domain experience not
    required)

  Preferred

  - Experience in one or more areas: full-stack web
    (React/Javascript), backend APIs/services,
    infrastructure/DevOps (Docker, CI/CD, cloud), or on-
    chain/low-level systems
  - Familiarity with blockchain technology (Solana a plus)
  - Interest or experience in fintech/trading
  - Rust or TypeScript proficiency
