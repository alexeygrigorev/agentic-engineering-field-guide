description: |
  At DICK’S Sporting Goods, we believe in how positively
  sports can change lives. On our team, everyone plays a
  critical role in creating confidence and excitement by
  personally equipping all athletes to achieve their dreams.
  We are committed to creating an inclusive and diverse
  workforce, reflecting the communities we serve.

  If you are ready to make a difference as part of the world’s
  greatest sports team, apply to join our team today!

  OVERVIEW:

  At DICK’S Sporting Goods, we believe sports can change
  lives. Founded in 1948, DICK’S Sporting Goods first started
  as a bait-and-tackle shop in Binghamton, NY and has since
  rapidly expanded into a leading omnichannel retailer with
  more than 850 locations representing our multiple brands:
  DICK’S, House of Sport, Golf Galaxy, Public Lands, Going
  Going Gone, and more. Over the years, it’s been our
  relentless focus on inspiring, supporting and equipping
  athletes and outdoor enthusiasts to achieve their dreams
  that has allowed us to become the $13B company we are today.

  Our company is looking to invest in our future as we embark
  on a journey from being the best sports retailer in the
  world to becoming the best sports company in the world. Join
  us as we build the ultimate customer experience. You will
  have the opportunity to shape the engine where the biggest
  brands in the world compete to win with our athletes. If you
  are ready to make a difference as part of the world’s
  greatest sports company, apply to join our team today!

  JOB PURPOSE

  Leads the development and maintenance of best in class
  solutions for assigned product group. Includes systems
  analysis and development. Primarily responsible for ensuring
  delivery, team talent management, and roadmapping.

  RESPONSIBILITIES

  Data-driven Product and Service Improvement

  Develop data-driven analyses to surface new opportunities to
  differentiate and improve products and user experiences,
  ensuring consistency across digital products, services, and
  channels.

  Digital Strategy/Transformational Projects Execution

  Manage and deliver end-to-end digital programs and
  initiatives, leveraging agile and design-thinking principles
  to drive sustainable implementation.

  Digital Talent Development

  Develop digital training and development programs to meet
  identified needs; run leadership development programs to
  enable personal transformations on digital.

  Digital Vision and Strategy

  Conceptualize elements of digital strategy/digital-enabled
  business change projects. Develop approaches to
  programmatically deliver successful digital innovation
  engagements.

  Project Management

  Manage a portfolio of projects while reporting to senior
  colleagues.

  Quality

  Develop new methods, tools and programs for quality
  assurance. Lead developmental initiatives or programs within
  an area of expertise.

  Budgeting

  Contribute to the development of budget plans and/or deliver
  budget plans with guidance from senior teammates.

  Information Security

  Lead in detecting and analyzing cybersecurity incidents
  including attacks, breaches, and identified vulnerabilities
  and remediate any security gaps in line with the security
  incident management procedure.

  Leadership and Direction

  Communicate the actions needed to implement the function's
  strategy and business plan within the team; explain the
  relationship to the broader organization's mission, vision
  and values; motivate people to commit to these and to doing
  extraordinary things to achieve local business goals.

  Organizational Capability Building

  Use the organization's formal development framework to
  identify the team's individual development needs. Plan and
  implement actions, including continuing professional
  development specified by professional or regulatory
  institutions, to build their professional capabilities.
  Provide informal training or coaching to others throughout
  the organization in own area of expertise to enable others
  to improve performance and fulfill personal potential.

  Performance Management

  Manage and report on the performance of a substantial,
  diverse team; set appropriate performance objectives for
  direct reports or project / account team members and hold
  them accountable for achieving these; take appropriate
  corrective action where necessary to ensure the achievement
  of team/ personal objectives.

  Program/Portfolio Management Support

  Manage a program of work while reporting to senior teammates
  leveraging assigned product management team processes and
  protocols.

  BEHAVIORAL COMPETENCIES

  Drives Engagement

  Creates a climate where people are motivated to do their
  best to help the organization achieve its objectives. For
  example, shares insight into the purpose of the work,
  involves others appropriately and gives them credit for
  their contributions. Praises the successes of others.

  Strategic Mindset

  Sees ahead to future possibilities and translates them into
  breakthrough strategies. For example, knows what to
  prioritize for the greatest strategic impact on the
  organization. Takes industry and market trends into account
  in decisions. Explores possibilities that may impact the
  team or organization in the future.

  Decision Quality

  Makes good and timely decisions that keep the organization
  moving forward. For example, knows when to act independently
  and when to escalate issues. Integrates various inputs,
  decision criteria, and trade-offs to make effective
  decisions. Typically makes good independent decisions.

  Courage

  Steps up to address difficult issues, saying what needs to
  be said. For example, shares own ideas and points of view
  openly, regardless of potential criticism or risk; shows
  conviction when faced with adversity and challenges; raises
  difficult topics to be sure they are addressed.

  Collaborates

  Builds partnerships and works collaboratively with others to
  meet shared objectives. For example, readily involves others
  to accomplish goals; stays in touch and shares information;
  discourages "us versus them" thinking; shows appreciation
  for others' ideas and input.

  Customer Focus

  Builds strong customer relationships and delivers customer-
  centric solutions. For example, keeps in contact with
  customers to ensure problems are resolved, or to improve
  customer service. Studies customer feedback and emerging
  customer needs and uses these to determine some creative new
  ideas.

  Action Oriented

  Takes on new opportunities and tough challenges with a sense
  of urgency, high energy, and enthusiasm. For example, takes
  immediate, decisive, independent action to resolve issues or
  problems. Persists as needed. Quickly and consistently
  identifies and pursues beneficial new opportunities.

  Builds Effective Teams

  Builds strong-identity teams that apply their diverse skills
  and perspectives to achieve common goals. For example,
  connects with others on team projects and leverages their
  strengths and knowledge to deliver the best possible
  results. Champions the decisions of the team and operates in
  a way that builds team spirit.

  Develops Talent

  Develops people to meet both their career goals and the
  organization's goals. For example, consistently shares
  ideas, insight, and best practices to help people reach
  their development goals and achieve optimal results. Shares
  targeted feedback in a prompt, constructive, and encouraging
  manner.

  Instills Trust

  Gains the confidence and trust of others through honesty,
  integrity, and authenticity. For example, is consistently
  honest and straightforward; shares uncomfortable information
  in a clear and helpful manner. Maintains high ethical
  standards and professional codes of conduct.

  Tech Savvy

  Anticipates and adopts innovations in business-building
  digital and technology applications. For example, is an
  early adopter of new technologies, technical skills, and
  capabilities that improve performance. Regularly experiments
  with and leverages technologies and tools to substantially
  improve performance.

  TECHNICAL SKILLS

  - Experience in customer data and analytics, omni channel
    identity resolution, data science models geared towards
    activating personalization campaigns
  - Wide and deep experience providing direction and guidance in
    data engineering
  - Experience with data engineering tools such as Google Big
    Query, Snowflake and Databricks
  - Experience with modeling complex data
  - Experience leading data engineering teams as a manager
  - Experience of planning and managing resources to deliver
    predetermined objectives
  - Experience leading teams of contractors in an
    onshore/offshore engagement
  - Experience managing, mentoring, and growing the careers of
    data engineers

  QUALIFICATIONS:

  General Education

  The right candidate may have a Master's Degree or Equivalent
  Level Preferred

  General Experience

  Substantial general work experience together with
  comprehensive job-related experience in own area of
  expertise to fully competent level. (Over 6 years to 10
  years)

  Managerial Experience

  Experience of supervising and directing people and other
  resources to achieve specific end results within limited
  timeframes (13 months to 3 years).

  VIRTUAL REQUIREMENTS:

  At DICK’S, we thrive on innovation and authenticity. That
  said, to protect the integrity and security of our hiring
  process, we ask that candidates do not use AI tools (like
  ChatGPT or others) during interviews or assessments.

  To ensure a smooth and secure experience, please note the
  following:

  - Cameras must be on during all virtual interviews.
  - AI tools are not permitted to be used by the candidate
    during any part of the interview process.
  - Offers are contingent upon a satisfactory background check
    which may include ID verification.

  If you have any questions or need accommodations, we’re here
  to help. Thanks for helping us keep the process fair and
  secure for everyone!

  Targeted Pay Range: $95,200.00 - $158,800.00. This is part
  of a competitive total rewards package that could include
  other components such as: incentive, equity and benefits.
  Individual pay is determined by a number of factors
  including experience, location, internal pay equity, and
  other relevant business considerations. We review all
  teammate pay regularly to ensure competitive and equitable
  pay.DICK'S Sporting Goods complies with all state paid leave
  requirements. We also offer a generous suite of benefits. To
  learn more, visit www.benefityourliferesources.com.
