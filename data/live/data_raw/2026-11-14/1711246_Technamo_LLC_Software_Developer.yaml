description: |
  Company Description

  TECHNAMO is a niche, young & dynamic IT service provider, VA
  SWaM certified, Microsoft Cloud Certified Partner, focused
  on providing IT Solutions & Services to government and
  commercial companies.

  Technamo is a Tier-I Contractor to provide IT Services to
  virginia govt. agencies (70+ entities) and contracted to
  provide services to state govt. New Jersey, Pennsylvania,
  Arkansas, Delaware and Maryland govt. agencies.

  Qualifications

  - 5 years of developing, designing, configuring, and
    documenting and deploying database architectures for
    Microsoft SQL Server, including tables, views, stored
    procedures, functions and triggers.
  - 5 years of developing, designing, configuring, documenting
    and deploying integration jobs as needed using SQL Server
    Integration Services.
  - 5 years of developing, designing, configuring, documenting
    and deploying integration jobs as needed using Microsoft
    Access solutions and VBA Scripting.
  - 5 years of serving as lead developer for creation,
    maintenance, and quality control of programming code,
    along with technical documentation, process documentation,
    and a database optimization plan.
  - 5 years of experience in the following programming
    languages: SQL, T-SQL, VBA, VB Scripting, Python, C++,
    Java, or JavaScript, as well as experience in MS Excel
    software in Office 365.
  - 5 years of implementing gathered requirements in code and/or
    processes, using SharePoint, Microsoft Access, Microsoft
    SQL Server and other software solutions as needed.
  - 5 years of experience with various testing methodologies,
    including Agile, Iterative, and Waterfall.
  - 5 years of planning, overseeing, and implementing the
    scalability, accuracy, and automation of technical aspects
    of an information architecture.
  - 5 years of experience with ETL source to target data
    mappings and transformation rules.
  - Bachelor’s Degree, preferably in MIS, Computer Science, or
    equivalent experience.

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
