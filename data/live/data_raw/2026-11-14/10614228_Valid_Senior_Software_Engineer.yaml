description: |
  About Valid

  Valid is one of the fastest-growing AI-native marketing
  companies. We’re building the company that replaces the
  traditional marketing agency.

  We help brands grow across Meta, TikTok, Google, and TV by
  combining software, AI agents, creative production, and
  media buying into a single system. Every day, we launch,
  measure, and iterate on advertising campaigns at a speed
  that traditional agencies can’t match.

  Our team operates at the intersection of AI video,
  filmmaking, performance marketing, and engineering. We
  believe the future of marketing isn’t people or AI, it’s
  people working alongside AI systems to produce better work,
  faster.

  The model is already working. Valid manages more than $40M
  in annualized advertising spend and partners with some of
  the fastest-growing consumer and technology companies,
  including Replit, Rover, Tolan, and others. Since launching,
  we’ve consistently won head-to-head against incumbent
  agencies by delivering better performance and moving faster.

  Backed by Canaan, Neo, Steve Huffman, Scott Banister, and
  other leading investors and operators, we’re building the
  next generation of marketing.

  This Role Is for You If You're:

  - Experienced in architecting and implementing high scale and
    throughput systems
  - Accomplished in leading projects that develop and deliver
    game-changing products
  - Proactive in identifying opportunities to meet and exceed
    your team's objectives while growing your own career
  - Passionate about mentoring early-stage engineers
  - Driven by the opportunities and challenges afforded by
    early-stage, high-growth startups

  Senior Engineer in a Nutshell

  You're an engineering leader who understands what needs to
  be done for you and Valid to reach ever-increasing levels of
  greatness. You thrive on seeing the forest through the trees
  — you identify the greatest challenges and bottlenecks and
  purposefully execute against them. As needs dictate, you
  fluidly transition between contributing both as an
  individual as well as a key member of a larger technical
  team.

  Key Qualifications

  - Experience: 4+ years software engineering experience with
    focus on system architecture of large-scale, performant
    distributed systems
  - Technical Leadership: Experience leading technical projects,
    coordinating execution of small engineering teams, and
    setting engineering standards in an agile environment
  - Engineering Excellence: Mastery in Python (our day-to-day
    operating language) and a second-nature commitment to
    engineering best practices (e.g., CI/CD, testing, fault-
    tolerance)
  - Cloud and Infrastructure: Hands-on experience managing and
    deploying cloud platforms (e.g., AWS, Google Cloud) and
    orchestration tools (e.g., k8s, Docker)

  Nice to Have

  - 1+ years in adtech or martech engineering in a senior
    capacity
  - 2+ years in early-stage (pre-Series B) startups
  - Exposure to AI and machine learning platforms/APIs,
    frameworks (e.g., TensorFlow, PyTorch), and algorithms

  What We Offer

  - Salary: We strive to make offers in the 90th-plus percentile
    of similar stage/trajectory companies for the level
    offered
  - Equity: Generous grants commensurate with experience
  - Benefits: 401k, healthcare, FSA, meals (when in-person)
  - Workplace: Remote-possible with a preference for IRL in our
    San Francisco headquarters
  - Impact: A foundational opportunity to revolutionize the
    landscape of digital advertising, forever
  - Growth: Active support in growing your career, skills, and
    outcomes in tandem with the growth of our business
  - Culture: A mission-driven organization where contributions
    are honored, diversity in experience and background is
    recognized, and disruption is core to everything we pursue

  You're Probably a Good Fit If:

  - Applying the latest tech in novel ways to delight customers
    excites you, and your goal is to maximize ownership
  - You want to join something early-stage and can thrive in an
    environment of organized chaos:
    - Organized: Build with purpose, work efficiently, communicate
      clearly, especially in writing.
    - Chaos: We think the best place to learn is in market and
      will do what it takes to ship as quickly as possible.

  This Role Might Not Be a Fit If:

  - You don't enjoy wearing multiple hats
  - You don't enjoy mentoring others
  - You dislike navigating ambiguity
