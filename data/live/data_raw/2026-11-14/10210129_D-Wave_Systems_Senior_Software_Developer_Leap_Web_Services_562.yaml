description: |
  D-Wave Quantum Inc. (NASDAQ: QBTS) is a leader in the
  development and delivery of quantum computing systems,
  software, and services. It is the world’s first commercial
  supplier of quantum computers, and the first and only to
  offer dual-platform quantum computing products and services,
  spanning both annealing and gate-model quantum computing
  technologies. D-Wave’s mission is to help customers realize
  the value of quantum today through enterprise-grade systems
  available on-premises and via its Leap™ quantum cloud
  service, which offers 99.9% availability and uptime. More
  than 100 organizations across commercial, government, and
  research sectors trust D-Wave to address complex
  computational challenges using quantum computing. Learn more
  about realizing the value of quantum computing today and how
  D-Wave is shaping the quantum-driven industrial and societal
  advancements of tomorrow: www.dwavequantum.com.

  About the role

  D-Wave is seeking a Senior Back-End Software Developer to
  contribute to the ongoing development of Leap™, our quantum-
  classical hybrid cloud platform. This role is ideal for an
  experienced software engineer who enjoys solving complex
  technical challenges, taking ownership of projects, and
  collaborating across teams to deliver scalable, reliable
  solutions.

  Since launching Leap, the world's first real-time quantum
  application environment, D-Wave has continued to expand the
  platform with new capabilities that enable developers and
  enterprises to solve computationally complex problems using
  quantum-powered applications. As a member of the Leap Web
  Services team, you will develop new features and maintain
  the services and platform capabilities that support our
  growing ecosystem of users and applications.

  You will work closely with product owners, software
  architects, developers, and cross-functional stakeholders to
  deliver high-quality software while helping to improve
  engineering practices, mentor team members, and contribute
  to the technical direction of the platform. While quantum
  computing experience is not required, you will have the
  opportunity to learn and grow in this rapidly evolving
  field.

  What you'll do

  - Collaborate with product owners, team members, software
    architects and other functional teams to deliver new
    features from concept to deployment

  - Participate in the full software development lifecycle
    (SDLC), including requirements gathering, design,
    development, testing, deployment, and maintenance

  - Maintain and improve existing systems by identifying
    inefficiencies and implementing enhancements

  - Independently own development tasks and contribute to
    moderately complex features and technical solutions

  - Troubleshoot and resolve bugs through code and system-level
    analysis

  - Write clean, maintainable, and well-documented code

  - Participate in peer code reviews and provide constructive
    feedback aligned with best practices

  - Mentor junior and intermediate developers and support their
    technical growth

  - Support performance tuning and scalability improvements

  - Identify blockers early and collaborate with others to
    resolve issues

  - Participate in the annual Hackathon to explore and prototype
    new ideas

  - Participate in the on-call rotation to help ensure the high
    availability and reliability of Leap after demonstrating
    sufficient knowledge of the system – typically after 6–12
    months



  About You

  - Bachelor’s degree in Computer Science, Computer Engineering
    or equivalent, practical experience

  - 5+ years of professional software development experience

  - Proficiency in Python for automation, scripting, and
    application development

  - Experience designing, implementing, and consuming REST APIs

  - Experience with Git workflows, including branching, merging,
    and pull requests

  - Strong communication skills, with the ability to explain
    technical concepts clearly and collaborate effectively
    across teams

  - Experience developing software in a Linux environment

  - Strong understanding of software architecture, algorithms,
    asynchronous programming, and performance optimization
    techniques

  - Strong problem-solving skills and a willingness to learn
    through exploration and feedback

  - Self-motivated, proactive, and adaptable mindset

  - Interest in improving processes and systems, with openness
    to support in implementation

  Additional Requirements

  - Candidates must be willing and able to work from our office
    in Burnaby, Canada, for six weeks during the onboarding
    process

  - Travel to the Burnaby, Canada, office is required a minimum
    of two weeks per year, as the software organization
    convenes for in-person discussions, collaboration, and our
    yearly hackathon

  A D-Waver's DNA

  - We look at the future and say “why not”; we see
    possibilities where others see problems or routines. We
    show the way ahead and are committed to achieving
    ambitious goals.
  - We practice straight talk and listen generously to each
    other with empathy. We value different opinions and points
    of views. We ensure that we connect outside as well as
    inside to learn from others and inspire each other.
  - We hold ourselves accountable for delivering results. We
    make decisions & take responsibility so that we can act &
    support each other.
  - As leaders we motivate & engage our teams to undertake
    beyond what they originally thought possible, by
    developing our teams & creating the conditions for people
    to grow and empower themselves through enabling &
    coaching.

  Inclusion:

  We celebrate diverse perspectives to drive innovation in our
  pursuit. Our employees range from distinguished domain
  experts with decades of experience in their respective
  fields, to bright and motivated graduates eager to make
  their mark. Our diverse and innovative team will make you
  feel appreciated, supported and empower your career growth
  at D-Wave.

  Our Compensation Philosophy is Simple but Powerful:

  We believe providing D-Wavers with company ownership,
  competitive pay, and a range of meaningful benefits is the
  start of creating a culture where people want to give the
  best they’ve got, not because they’re simply making money,
  but because they’ve fallen in love with our vision, mission,
  values, and team.

  The anticipated salary/hourly wage range for this position
  is between $150,000 and $206,000. Actual compensation will
  be determined based on a variety of factors including a
  candidate’s experience, skills, qualifications, work
  location, and alignment with the responsibilities of the
  role.

  We believe great work starts with supporting our people.
  Eligible U.S.-based full-time and part-time employees
  regularly scheduled to work 30 or more hours per week have
  access to a generous benefits package that includes medical,
  dental, and vision coverage; disability and life insurance;
  a 401(k) retirement plan; paid holidays; wellness and well-
  being resources; paid sick time; and flexible paid time off
  to support rest and well-being.  Employees may also be
  eligible to participate in short-term and/or long-term
  incentive programs.

  Export Controls:

  This position may include access to controlled information
  or technology under U.S. export control laws. Employment may
  be contingent on either the applicant verifying falling
  under the "U.S. Person" definition (including U.S. citizens,
  U.S. lawful permanent residents, and those granted U.S.
  asylum or refugee status) or the employer timely obtaining
  any necessary export license under federal laws. The
  employer valuates export licensing on a case-by-case basis
  and may decline to proceed with a job application in its
  sole discretion as export license applications can take many
  weeks to process.

  Security Clearance:

  This position requires the ability to pass a Tier 2
  background investigation. This position also requires an
  active U.S. government security clearance or the ability to
  qualify for a U.S. government security clearance (U.S.
  citizenship required).

  The Fine Print:

  No 3rd party candidates will be accepted

  It is D-Wave Systems Inc. policy to provide equal employment
  opportunity (EEO) to all persons regardless of race, color,
  religion, sex, national origin, age, sexual orientation,
  gender identity, genetic information, physical or mental
  disability, protected veteran status, or any other
  characteristic protected by federal, state/provincial, local
  law.

  Job seekers should be aware of fraudulent job offers from
  online scammers and only apply to roles listed on D-Wave
  Careers site using our applicant system. Note: We do not use
  text messaging or third-party messaging apps to communicate
  with applicants and will never ask for fees or financial
  commitment, so please exercise caution if you are approached
  in this way. Authentic communications will come from an
  @dwavesys.com email.



  For more information, please read our full Statement
  Regarding Job Recruiting Fraud Scams.
