description: |
  Fluence (Nasdaq: FLNC) is a global market leader delivering
  intelligent energy storage and optimization software for
  renewables and storage. Our solutions and operational
  services are helping to create a more resilient grid and
  unlock the full potential of renewable portfolios. With
  gigawatts of successful implementations across nearly 50
  markets, we are transforming the way we power our world for
  a more sustainable future. For more information, please
  visit fluenceenergy.com.

  Job Description:

  Key Responsibilities

  - Assure successful execution of all projects within the
    business unit on time, on budget, and in line with agreed
    solution engineering deliverables.
  - Provide senior leadership for project engineering resources
    allocated to the market, ensuring clear priorities,
    accountability, and delivery quality.
  - Own resource planning and capability management for the
    market, ensuring the right engineering capacity, skills,
    and experience are available to support project execution.
  - Act as senior interface to Commercial, Project Management,
    and Technical Expert Leads for upcoming opportunities,
    early risk identification, and required engineering
    support.
  - Coordinate with Technical Expert Leads across Grid
    Engineering, Electrical & Controls, SNC, and other
    relevant functions to define engineering input for complex
    opportunities.
  - Lead escalation management for critical project issues
    across the Market, including customer-facing and Fluence-
    internal escalations.
  - Drive consistency and continuous improvement of operational
    engineering processes, governance, and execution standards
    across projects.
  - Take ownership of resolving complex technical, contractual,
    and execution-related challenges in close collaboration
    with internal stakeholders and customers.
  - Develop engineering talent, including coaching managers,
    senior engineers, and high-potential team members toward
    their next level of responsibility.
  - Support succession planning and organizational development
    within Project Engineering.
  - Ensure execution of projects in alignment with Fluence
    safety KPIs, quality expectations, and business targets.
  - Contribute to regional delivery strategy, including capacity
    planning, risk mitigation, and improvement of project
    delivery performance.
  - Represent Project Engineering in senior stakeholder forums,
    customer discussions, and internal leadership reviews.
  - Travel throughout EMEA and internationally as required.

  Main Qualifications & Experience

  - Bachelor’s or Master’s degree in Electrical Engineering or
    equivalent.
  - Minimum of 8–10 years of relevant work experience in power
    systems, utility-scale installations, PV plants, Battery
    Energy Storage Systems, or comparable infrastructure
    projects in the EMEA region.
  - Strong knowledge of engineering, procurement, and
    construction for high-voltage systems, renewable energy,
    battery storage, or conventional power generation.
  - Proven leadership experience, including leading teams,
    managing managers or senior experts, and developing
    technical talent.
  - Strong ability to manage complex projects, competing
    priorities, and multiple stakeholders in a matrix
    organization.
  - Demonstrated experience in customer-facing escalation
    management and senior stakeholder communication.
  - Strong commercial and contractual awareness with the ability
    to assess risks and drive practical resolutions.
  - Strategic mindset with the ability to connect project
    execution topics to broader business objectives.
  - Solution-oriented, structured, and accountable leadership
    style.
  - Excellent communication and influencing skills across
    technical and non-technical audiences.
  - Business fluency in German and English, fluency level
    required (German C1)
  - Other language skills beneficial.

