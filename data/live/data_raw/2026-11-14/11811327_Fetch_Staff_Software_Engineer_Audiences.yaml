description: |
  What we’re building and why we’re building it.

  Fetch helps people live rewarded every day, with a vision to
  become the rewards destination for everyone. We turn
  everyday activities into meaningful rewards, whether it’s
  grocery shopping, grabbing a quick meal, or playing a
  favorite mobile game. To date, we’ve awarded more than $1
  billion in Fetch Points to our users.

  Each day, more than 13 million receipts are submitted on
  Fetch, providing visibility into over $212 billion in gross
  merchandise value. This creates the largest retail-agnostic,
  SKU-level view of household spending, powering Fetch as an
  outcomes-based advertising platform that helps brands
  acquire and retain lifelong consumers.

  The Fetch app is available on the App Store and Google Play,
  with more than 6 million five-star reviews from a highly
  engaged and loyal user base.

  It’s not just our users who believe in Fetch: with
  investments from Softbank, ICONIQ, DST, Greycroft, and
  partnerships ranging from challenger brands to Fortune 500
  companies, Fetch is reshaping how brands and consumers
  connect in the marketplace. When you work at Fetch, you play
  a vital role in a platform that drives brand loyalty and
  creates lifelong consumers with the power of Fetch points.
  User and partner success are at the heart of everything we
  do, and we extend that same commitment to our employees.

  At Fetch, we value curiosity, adaptability, and the
  confidence to explore new tools, especially AI, to drive
  smarter, faster work. You don’t need to be an expert, but
  you should be ready to learn quickly and think critically.
  We welcome learners who move fast, challenge the status quo,
  and shape what’s next, with us.  Ranked as one of America’s
  Best Startup Employers by Forbes for two years in a row,
  Fetch fosters a people-first culture rooted in trust,
  accountability, and innovation. We encourage our employees
  to challenge ideas, think bigger, and always bring the fun
  to Fetch.

  Meet Fetch Engineering

  At Fetch, engineering is driven by curiosity, ownership, and
  a bias toward action. We operate in complex problem spaces
  where the right answer is not always clear, and success
  depends on adaptability, critical thinking, and informed
  decision-making. Our engineers are comfortable navigating
  ambiguity, understanding tradeoffs, gathering context, and
  turning uncertainty into progress while maintaining high
  technical standards.

  Engineers at Fetch take pride in building reliable, scalable
  systems that serve millions of users. You will contribute
  directly to the codebase, collaborate closely with cross-
  functional partners, and help shape best practices that
  elevate the quality of our work. We foster a culture of
  mentorship and collaboration, where engineers grow by
  learning from one another and holding a high bar for
  quality, reliability, and impact.

  About the Role:

  Fetch is building the capabilities to turn purchase insights
  into a scalable audience business. We want to help
  advertisers reach both known buyers and prospective
  customers through predictive and lookalike audiences,
  combining Fetch’s purchase data with licensed identity and
  attribute data to expand reach beyond our existing users.

  We’re looking for a hands-on Staff Software Engineer to lead
  the engineering behind these products. You’ll partner with
  Data Science, Product, and Data Platform to take audience
  models from prototypes to reliable products that partners
  can activate through their advertising platforms.

  This is a full-time role that can be held from one of our US
  offices or remotely in the United States.

  Role Responsibilities:

  - Build the audience lifecycle. Develop services and workflows
    for defining seed audiences, incorporating identity and
    attribute data, scoring eligible populations, validating
    membership, refreshing segments, and delivering audiences
    to partners and DSPs.
  - Bring predictive and lookalike models into production.
    Partner with Data Science to build repeatable training,
    evaluation, deployment, and batch-scoring workflows. Make
    it straightforward to introduce new models, compare
    versions, and refresh audiences as data and behavior
    change.
  - Make audience activation reliable. Integrate identity
    mappings and partner-specific delivery requirements. Track
    how audience coverage changes through matching and
    delivery, diagnose losses, and build repeatable
    integrations that support additional partners.
  - Build quality and operational controls into the product.
    Version datasets, models, and audience definitions so
    results are reproducible. Implement monitoring, quality
    checks, safe retries, corrections, and access controls,
    including enforcement of data-use restrictions.
  - Lead technical execution across the domain. Shape the
    audience engineering roadmap, make architecture and build-
    versus-reuse decisions, and guide other engineers through
    delivery. Build on shared ingestion, storage,
    orchestration, and governance capabilities with the core
    Data Platform team.

  Minimum Requirements:

  - 12+ years of professional software engineering experience,
    including ownership of data-intensive products from design
    through production adoption.
  - Strong coding, API design, data modeling, and distributed-
    systems skills.
  - Experience operationalizing ML or predictive systems,
    including data dependencies, evaluation workflows,
    deployment, batch scoring, and monitoring.
  - Demonstrated experience setting technical direction for an
    engineering domain, aligning teams around architecture and
    priorities, and leading complex initiatives from ambiguous
    requirements through production adoption.
  - Experience making and evolving architectural decisions for
    production systems, balancing near-term delivery with
    long-term reliability, scalability, operating cost, and
    maintainability.
  - Ability to explain technical tradeoffs, build agreement
    across teams, and resolve dependencies and ownership
    boundaries.
  - Experience increasing the effectiveness of other engineers
    through design reviews, mentoring, technical standards,
    and breaking complex initiatives into work that multiple
    engineers can deliver.
  - A track record of delivering measurable outcomes and using
    production results to guide improvements.
  - Experience with identity resolution, audience activation,
    adtech, or partner data integrations.

  Compensation: At Fetch, we offer competitive compensation
  packages including base, equity, and benefits to the
  exceptional folks we hire. Discover our benefits and how our
  employees live rewarded at https://fetch.com/careers.

  At Fetch, we'll give you the tools to feel healthy, happy
  and secure through:

  - Equity: We offer full-time employees equity in Fetch, so
    that everyone can benefit from Fetch’s growth.
  - 401(k): Fetch will match your contributions dollar for
    dollar, up to 4% of your eligible pay.
  - Benefits for humans and pets: We offer comprehensive
    medical, dental, and vision plans for everyone, including
    your pets.
  - Continuing Education: Fetch provides ten thousand per year
    in education reimbursement.
  - Employee Resource Groups: Take part in employee-led groups
    that are centered around fostering a diverse and inclusive
    workplace through events, dialogue, and advocacy. The ERGs
    participate in our Inclusion Council with members of
    executive leadership.
  - Paid Time Off: On top of our flexible PTO, Fetch observes 9
    paid holidays, as well as our year-end week-long break.
    (Holidays will vary for Canada-based roles)
  - Robust Leave Policies: 14 weeks of fully paid parental leave
    for all employees, plus 6 additional weeks of paid
    childbirth recovery leave for birthing parents, and a
    flexible return-to-work schedule.
  - Calvin Care Cash: Employees who are welcoming new family
    members will also receive a one-time $2,000 incentive to
    assist employees with covering the cost of childcare,
    clothing, diapers, and much more!
  - Flexible Work Environment: Collaborate with your team in one
    of our stunning offices, or you can work fully remotely
    from anywhere in the US for US-based roles. We’ll ensure
    you are equally equipped with the hardware and software
    you need to get your job done in the comfort of your home.
    (applicable for most roles)

