description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  Build the engines protecting billions in global transfers,
  without slowing down real-time money movement.

  As a Senior Product Engineer in Wise’s Europe Risk &
  Controls team, you’ll take full end-to-end ownership of our
  core risk architecture. We’re expanding our domain to handle
  high-stakes Anti-Money Laundering (AML) and financial crime
  prevention across European and UK markets. You will
  architect high-throughput, event-driven engines that ensure
  every risk decision is bulletproof: consistent, explainable,
  and real-time auditable.

  What You'll Drive

  - System Architecture: Design and scale distributed systems
    powering customer due diligence (CDD/EDD) and fincrime
    detection.
  - Technical Leadership: Set technical strategy, make critical
    architectural calls, and mentor senior talent.
  - Domain Impact: Partner directly with Product, Compliance,
    and Data Science to translate regulatory complexity into
    high-performance code.

  Qualifications

  What do you need:

  We are fully aware that it is uncommon for a candidate to
  have all skills required and we fully support everyone in
  learning new skills with us. So if you have some of those
  listed below and are eager to learn more we do want to hear
  from you!

  - Core Stack: 7+ years of deep Java expertise leveraging
    Spring Boot.
  - Distributed Systems: Hands-on experience building event-
    driven architectures with Kafka and SQL.
  - Product Ownership: Direct end-to-end execution—owning
    systems from initial design to live production metrics.
  - Cross-Functional Influence: Ability to translate complex
    distributed architecture concepts for non-technical
    stakeholders.
  - CI/CD Mastery: Proven experience with modern continuous
    integration and deployment pipelines.
  - Domain Bonus: Prior experience in AML, KYC, or fraud
    prevention is a massive plus.

  Additional Information

  Interested? Find out more:

  - How we work – a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - Our Engineering career map
  - Scaling our Infrastructure; how we make it work
  - Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £111,000- £145,000 +RSUs
  - Wise Benefits

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
