  About the role

  We're looking for an experienced full stack developer who is
  comfortable with web3/smart contracts and CraftCMS. We have
  an existing product suite and looking to add an additional
  product to enhance our ability to onboard new users without
  the need for a deep content library.  We are looking to
  offer this initially on a temporary/contract basis for this
  specific product, with the option of full time employment
  upon completion. There will be support, however, we are
  looking for a motivated self starter who can take our design
  and briefs, and deliver this product from start to finish.

  What we're seekingMust have

  - Proven experience with Craft CMS development, including Twig
    templating.
  - Solid front-end JavaScript and UI skills; familiarity with
    Alpine.js is a plus.
  - Experience with Node.js development.
  - Familiar with smart contracts and the web3 library.
  - Knowledge of decentralized storage solutions, such as
    Filecoin, Kwil, or similar technologies.
  - Ability to work independently and effectively in a remote
    environment.
  - Comfortable working without direct supervision or guidance
    from a lead.

  What we're offering

  - Compensation value arranged before commencement of work
  - Compensation can be settled in fiat, stables or our native
    utility token VIS
  - Opportunity for long term full/part time employment beyond
    this product
  - Opportunity for Visa to RAK DAO for long term employment

  Details of product and compensation offered to candidates
  that satisfy the above.
