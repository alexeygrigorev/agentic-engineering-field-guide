description: |
  About Battle Creek Games

  Battle Creek Games is a remote, mobile gaming studio behind
  some of the most-played racing and hunting titles in the
  U.S., including No Limit 2, Offroad Outlaws, and American
  Marksman, reaching millions of players worldwide. If you’re
  excited about contributing to our titles, we’d love to hear
  from you.

  Role Overview

  As a Senior Unity Engineer, you’ll work primarily on No
  Limit Drag Racing 2, helping to develop and refine gameplay
  features, optimize performance, and ensure a smooth user
  experience across a wide range of devices. You’ll
  collaborate closely with senior engineers, artists, and
  designers to bring new content to life. This is a great
  opportunity to build on your Unity expertise while making a
  direct impact on a fast-growing, live-operated racing title.

  What You'll Do

  - Feature Implementation
    - Collaborate with designers and senior engineers to build
      engaging racing mechanics, UI elements, and multiplayer
      interactions.
  - Code Quality & Maintenance
    - Write clean, maintainable C# code. Participate in code
      reviews and follow established coding standards.
  - Performance Optimization
    - Assist in profiling and optimizing game performance (FPS,
      memory usage) to deliver a smooth experience on mobile
      devices.
  - Debugging & Problem-Solving
    - Investigate and resolve bugs or technical issues reported by
      QA or the community, ensuring fast and effective
      solutions.
  - Collaboration
    - Work with artists and designers to integrate new art assets
      and gameplay features. Communicate effectively about
      technical requirements and limitations.
  - Continuous Learning
    - Stay updated with Unity and C# best practices. Suggest
      improvements to workflows and tools that enhance
      development efficiency.

  What You'll Need

  - 5+ years of professional Unity (C#) development experience,
    preferably with one shipped mobile or live-operated title.
  - Familiarity with Unity fundamentals (prefabs, scenes, asset
    management) and common design patterns.
  - Basic understanding of optimization techniques for mobile
    devices, including memory management and rendering
    efficiencies.
  - Experience in collaborating with designers, artists, or QA
    to deliver player-facing features.
  - Strong problem-solving skills and a willingness to learn
    from feedback and data-driven insights.

  Nice to Have

  - Knowledge of racing or vehicle physics, multiplayer
    frameworks, or analytics integration.

  Why Join Battle Creek Games?

  - Remote by Design: We’re a fully remote team with processes
    and tools intentionally built for effective, distributed
    collaboration.
  - Collaborative Culture: Enjoy a supportive environment where
    cross-team collaboration and rapid iteration are highly
    valued.
  - Impactful Contribution: Play a hands-on role in advancing
    our most popular titles.
  - Professional Growth: Expand your skills by working alongside
    experienced teammates hailing from EA, Small Giant Games,
    Rovio, and Pocket Gems.
  - Competitive Benefits & Pay: Compensation is at or above the
    75th percentile for the gaming industry, most health plans
    are fully covered or low-cost, and we offer unlimited PTO
    to support long-term, sustainable careers.

  Ready to Accelerate Your Career?

  If you’re excited about creating top-tier racing experiences
  for millions of players, and you thrive in a dynamic,
  collaborative setting, send us your resume, portfolio (if
  available), and a brief introduction to your background.
  Join us and help take our multiple titles to the next level!
  At Battle Creek Games, we believe our strength comes from
  the diversity of our players and our team. We’re committed
  to building an inclusive environment where everyone,
  regardless of race, ethnicity, religion, gender identity or
  expression, sexual orientation, national origin, disability,
  age, veteran status, or background can do their best work.
  We welcome candidates from all walks of life and encourage
  you to apply, even if your experience doesn’t line up
  perfectly with every qualification listed. What matters most
  to us is passion, creativity, and a drive to help us build
  games that millions of players love. Battle Creek Games is
  proud to be an equal opportunity employer.
