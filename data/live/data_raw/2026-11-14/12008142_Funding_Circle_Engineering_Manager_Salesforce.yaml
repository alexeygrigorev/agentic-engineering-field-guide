description: |
  We’re on a mission to back the UK’s small businesses like no
  one else 🚀

  Small businesses are the backbone of the economy, and we’re
  here to help them win. We’ve built a platform that uses
  clever data to get them the funding they need in minutes,
  not weeks.

  At Funding Circle, we have the restless energy of a fintech
  start-up with the stability of a public company. It’s a
  unique mix that gives Circlers the autonomy to take
  ownership and the scale to make an impact that truly counts.

  We’re a high-performing team that chooses to lift each other
  up. We challenge, we champion, and we have each other’s
  backs - because we know that when we stand together, we move
  faster and build better.

  The impact is real: Last year alone, the businesses on our
  platform generated £7.2bn for the UK economy 📈 Come and join
  a mission that matters!

  [Read our Impact Report] | [See our Trustpilot]

  The role ⚡

  📍 London (Hybrid) | 🤝 2 days in the office | 💰 Competitive
  Salary + Benefits

  We are looking for a Senior Engineering Manager to join our
  Platform Capabilities engineering group, leading our
  Salesforce Platform team.

  You will be accountable for the successful management of
  Salesforce at Funding Circle. With key stakeholders being
  our product aligned Salesforce engineering teams, our
  Salesforce adjacent teams, and Technology as a whole.
  Definition and execution of a prioritised platform roadmap
  for our use of Salesforce, that delivers on our objectives
  both from a business and technology standpoint. You’ll also
  be responsible for levelling up your team’s product
  development maturity, helping to achieve our goal of
  engineering excellence and to make progress towards our
  target architecture.

  As an Engineering Manager you’ll:

  - Be a team builder, cultivating a collaborative and inclusive
    team environment, empowering engineers to excel.
  - Facilitate open communication, resolve conflicts
    constructively, and foster a culture of mutual respect and
    support, ensuring an engaged, high-performing team.
  - Drive company and team goals by effectively prioritising
    work, planning capacity and ensuring timely delivery.
  - Implement robust engineering processes, promote strategic
    technology adoption, and establish clear policies to
    support sustained growth.
  - Proactively seek opportunities and realise value through the
    use of AI across the SDLC and PDLC.
  - Represent Funding Circle at industry events, actively
    contributing to brand growth and fostering strong
    community relationships.
  - Forge strong partnerships with business stakeholders, deeply
    understanding their needs and sharing ownership of
    successful outcomes.
  - Serve as a mentor and educator, sharing your expertise to
    empower stakeholders and engineers to independently solve
    problems.

  What we’re looking for 🌱

  - Someone who understands Salesforce’s strengths and
    weaknesses, where best to put it to work and where to step
    away.
  - A passion for modern software development principles
    including being AI native, extreme fast feedback and
    iteration speed, and high levels of engineering
    productivity investment backed by metrics to get us there.
  - Prior or current experience in engineering management.
    Including an ability to have the tough conversations.
  - Somebody who can embody Funding Circle’s values, and is able
    to positively impact and lead a close team.

  We’re building a place where everyone truly feels they
  belong. Even if your past experience doesn't align perfectly
  with every requirement, we'd still love to hear from you.

  Why join us? 💜

  We back you to build an incredible career and by joining us,
  you'll be part of one of The Sunday Times Best Companies to
  Work For 2026! As a flexible-first employer, we use a "best
  of both" approach. We’ll see you in our London office to
  collaborate – with barista coffee and subsidised Just Eat
  lunches on us!

  Our Circler Proposition focuses on five areas:

  - Flexibility: We provide a benefit allowance you can tailor
    to your own life and family.
  - Health: This includes private medical and dental, health
    assessments, and access to a digital GP.
  - Wealth: We offer life assurance, share schemes, and
    financial coaching.
  - Development: You get a dedicated annual learning allowance
    to help you level up.
  - Lifestyle: We have electric car and cycle-to-work schemes,
    plus season ticket loans.

  We also have award-winning parental leave policies. We're
  here to support you through the big life moments, from
  fertility treatments to new additions to the family.

  Ready to join a mission that matters? We’d love to chat!
