description: |
  Courier Health is on a mission to solve one of the biggest
  and most meaningful opportunities in healthcare: reinvent
  how people living with chronic and rare diseases are
  supported.

  We are building the future of patient engagement for life
  sciences companies. Our software is leveraged by biopharma
  companies to support patients in their complex journey from
  diagnosis to initiating and remaining on therapy to achieve
  optimal health outcomes.

  We are looking for talented individuals who are motivated by
  the opportunity to have an outsized impact on not just their
  company, but the healthcare industry at large.

  What you’ll do

  - Play a lead role designing, building, and scaling software
    systems to support our rapidly growing product and
    customer base. This is a generalist role with
    opportunities to contribute on both the backend and
    frontend. Depending on the team, this role may focus more
    heavily on particular parts of the stack with the ability
    to specialize - let us know what excites you!
  - Own large systems and projects end-to-end, supporting
    critical company initiatives and driving the vision for
    long-term technical success.
  - Collaborate closely with the Product, Design, and Client
    Solutions teams to scope and deliver impactful projects to
    our users.
  - Use AI and LLMs to accelerate your impact and power
    innovative product features.
  - Drive improvements to our internal Engineering systems and
    processes, including testing, deployment, observability,
    and agentic coding.
  - Participate in on-call rotations to support production
    systems.
  - Foster a culture of curiosity, growth, and excellence within
    the Engineering organization by leading through example
    and mentoring engineers.

  Qualifications

  - B.S. or higher in computer science or a relevant field, or
    equivalent industry experience
  - 8+ years of professional software engineering experience
  - Expertise with at least one modern programming language,
    such as TypeScript, Python, Golang, etc.
  - Experience working with relational databases, cloud
    infrastructure, and distributed systems
  - Product-engineering mindset: able to balance technical
    quality with velocity and user value
  - Inspired by our mission to improve healthcare through
    technology

  Bonus Points

  - Experience with TypeScript, NodeJS, React, GraphQL, AWS,
    PostgreSQL, or Terraform
  - Experience building software in the health-tech or
    healthcare space
  - Experience at early stage software companies
  - Built and operated LLM-powered products in production

  Benefits

  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Unlimited Vacation
  - Commuter Benefits
  - Paid parental leave
  - Catered lunch on Fridays
  - Wellness stipend
  - Great Place to Work Certified

  The annual salary range for the target level for this role
  is $175,000 - $225,000 + equity + benefits, including
  medical, dental, and vision.

  Courier Health is proud to be an Equal Employment
  Opportunity employer.

  We do not discriminate based upon race, religion, color,
  national origin, gender (including pregnancy, childbirth, or
  related medical conditions), sexual orientation, gender
  identity, gender expression, age, status as a protected
  veteran, status as an individual with a disability, or other
  applicable legally protected characteristics.
