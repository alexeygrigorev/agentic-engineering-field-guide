description: |
  Introductory Marketing Language: Join us and be at the
  forefront of technology innovation, where your expertise
  drives impactful solutions. You’ll collaborate with talented
  professionals in a dynamic, agile environment that values
  your ideas and encourages growth. At JPMorganChase, we
  empower you to push boundaries, develop your skills, and
  make a real difference. Experience a culture that celebrates
  diversity, fosters inclusion, and supports your career
  journey.

  Job Summary: As a Senior Lead Software Engineer in the
  Corporate Sector, you will play a pivotal role in an agile
  team dedicated to building and delivering trusted, market-
  leading technology products. You will leverage your deep
  technical expertise to solve complex challenges across
  multiple technologies and applications. Your leadership will
  drive business impact, foster innovation, and ensure the
  stability and scalability of our solutions. You’ll help
  shape our team culture and contribute to our mission of
  delivering excellence.

  Job Responsibilities:

  - Lead end-to-end engineering delivery across the full
    software development lifecycle for modern application
    platforms.
  - Leverage technologies such as Java, React, AWS, and related
    cloud-native services and tooling.
  - Own the “you build it, you own it” model—design, build,
    test, release, and support solutions, ensuring performance
    and continuous improvement.
  - Collaborate with cross-functional stakeholders to perform
    root cause analysis, implement production changes, and
    drive resiliency improvements.
  - Drive operational excellence by enhancing observability,
    alerting, automation, and post-incident reviews.
  - Mentor and guide engineers through coaching, design and code
    reviews, and best-practice reinforcement.
  - Drive adoption and governance of approved AI-assisted
    engineering practices to improve code quality and delivery
    speed.
  - Apply strong knowledge of the SDLC/toolchain and AI-assisted
    automation to scale repeatable patterns and improve
    productivity.
  - Develop and support AI/ML-enabled approaches for
    troubleshooting and incident resolution.
  - Act as a collaborative team player and engineering leader,
    communicating clearly and coordinating effectively.

  Required Qualifications, Capabilities, and Skills:

  - Formal training or certification on software engineering
    concepts and applied experience (follow local country
    guidance as applicable).
  - Hands-on experience in system design, application
    development, testing, and operational stability.
  - Advanced proficiency in one or more programming languages.
  - Demonstrated experience leading the use of enterprise-
    authorized AI-assisted software development tools, with
    the ability to set team expectations for validating AI
    outputs.
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity, secure handling,
    and compliance with resiliency and security standards.
  - Ability to independently solve design and functionality
    problems.
  - Practical experience with cloud-native technologies.

  Preferred Qualifications, Capabilities, and Skills:

  - Experience coaching senior engineers or leads on compliant
    AI usage patterns and controls.
  - Advanced applied experience in software engineering (as
    applicable by region).
  - Familiarity with AI/ML-enabled troubleshooting and incident
    resolution approaches.
  - Experience driving strategic change and continuous
    improvement within engineering teams.

  If you’re ready to make an impact and grow your career in a
  supportive, innovative environment, we invite you to join us
  at JPMorganChase.

