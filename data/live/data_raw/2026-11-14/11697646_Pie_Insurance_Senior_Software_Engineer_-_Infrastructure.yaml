description: |
  Pie's mission is to empower small businesses to thrive by
  making commercial insurance affordable and as easy as pie.
  We leverage technology to transform how small businesses buy
  and experience commercial insurance.



  Like our small business customers, we are a diverse team of
  builders, dreamers, and entrepreneurs who are driven by core
  values and operating principles that guide every decision we
  make.

  Pie Insurance’s Technology team builds and operates a suite
  of applications and services that allow direct consumers,
  partners, and agents to manage commercial insurance
  policies. The team collaborates closely with our business
  partners to design and implement new features to help the
  company scale with increasing demand.

  We are seeking highly motivated Backend Engineers who
  encourage an environment where engineers are thought leaders
  and foster a culture of diversity and inclusion. Acting as
  leaders across the organization on design, architecture, and
  best practices, they elevate those around them and push the
  company forward.

  How You’ll Do It

  - You’ll define and evolve our AWS infrastructure as code
    using CDK, treating infrastructure with the same review,
    testing, and release discipline as application code
  - You’ll apply security and compliance practices appropriate
    to a regulated industry, supporting SOC2 and similar
    audits; least-privileged IAM, secrets management, and
    well-defined network and account boundaries.
  - You’ll leverage AI-powered development tools (e.g., Claude
    Code) as part of your daily workflow to accelerate code
    generation, testing, and documentation.
  - You’ll participate in peer code reviews across both
    application and infrastructure changes, ensuring the
    delivery of high-quality code and adherence to coding
    standards.
  - You’ll write clean, maintainable, and efficient code
    primarily in TypeScript (with some C# preferred).
  - You’ll collaborate transparently with product management,
    designers, stakeholders, and fellow engineers throughout
    the development process.
  - You’ll help shape the design and architecture of scalable,
    secure, and robust systems and applications.
  - You’ll deliver software using continuous delivery pipelines,
    contributing to enhancing and optimizing these pipelines.
  - You’ll assist our support and operations teams by triaging
    and resolving production issues in a timely manner.
  - You’ll build highly modular and reusable code while adhering
    to industry standards and best practices.
  - You’ll participate in on-call rotations, consistently
    seeking opportunities to improve operational stability and
    system visibility.
  - You’ll continuously learn and stay up-to-date on software
    engineering best practices and new technologies to improve
    our systems.

  The Right Stuff

  - Consistently demonstrated expertise in AWS technologies,
    best practices, and architecture.
  - Experienced in leveraging AWS CDK in TypeScript.
  - Deep understanding of network topology (VPC, Security
    Groups, Route53) and IAM access controls.
  - Proficiency using AI coding assistants (e.g., Claude Code)
    as a core part of your development workflow.
  - Consistently demonstrates crafting technical solutions in a
    variety of greenfield and brownfield projects, exhibiting
    adaptability, independence, and autonomy.
  - Expertise with CI/CD best practices and experience in
    continuous integration/delivery using GitHub.
  - Strong expertise in backend and infrastructure software
    engineering, with expertise in TypeScript (C# experience
    is a plus).
  - Adopts an Agile mindset focused on delivering small,
    incremental improvements that provide tangible value to
    the customer.
  - Embraces a growth mindset, continually seeking opportunities
    for professional development—expanding technical and non-
    technical capabilities such as communication,
    collaboration, and problem-solving—through openness to
    feedback and proactive learning.
  - Maintains a strong sense of personal accountability,
    consistently delivering high-quality, secure, and
    performance-optimized code.

  The use of AI in Application Review: To support a fair,
  efficient, and consistent hiring process, we use AI-powered
  tools to assist in the initial screening of applications.
  These tools help us identify qualifications and prior work
  experiences that align with the requirements of the role. We
  may also use AI assistant video tools during interviews to
  support note-taking and candidate evaluation. All AI-powered
  outputs are still subject to human oversight and decision-
  making at multiple stages of the process. By submitting your
  application, you acknowledge and consent to Pie utilizing
  these AI technologies to assist in our evaluation process.

  Base Compensation Range

  $150,000—$185,000 USD

  Compensation & Benefits

  - Competitive cash compensation
  - Comprehensive health plans
  - Generous PTO
  - Future focused 401k match
  - Generous parental and caregiver leave
  - Our core values are more than just a poster on the wall;
    they’re tangibly reflected in our work

  Making every part of working with us "Easy as Pie" -
  including our offer process. When we find someone we'd like
  as a Pie-oneer (a member of our team), we move quickly to
  put together a fair offer based on your skills, experience,
  location, and compensation expectations.

  Each year Pie reviews company performance and may grant
  discretionary bonuses to eligible team members.

  Location Information

  Unless otherwise specified, this role is remote. Remote team
  members must live and work in the United States (territories
  excluded) and have access to reliable, high-speed internet.

