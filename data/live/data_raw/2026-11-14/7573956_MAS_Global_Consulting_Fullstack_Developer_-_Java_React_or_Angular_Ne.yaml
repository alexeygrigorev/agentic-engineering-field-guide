description: |
  On-site Position Who You Are

  You are an innovative and detail-oriented Full-Stack
  Engineer with a passion for building reliable, secure, and
  scalable applications. You thrive in complex enterprise
  environments, enjoy collaborating with diverse teams, and
  are committed to continuous learning and technical
  excellence.

  You’re someone who finds energy in problem-solving,
  optimizing cloud architectures, and delivering high-quality
  software that directly impacts millions of users. You take
  ownership of your work, enjoy mentoring others, and value
  process discipline — especially in environments that demand
  precision, performance, and compliance.

  If you want to grow with a mission-driven company,
  contribute to world-class projects with global clients like
  JP Morgan Chase, and help elevate Latin American tech talent
  to its fullest potential, this is the role for you.

  Who We Are

  MAS means “more” in Spanish — and that’s what we stand for.
  We believe in providing more opportunities, more inclusion,
  and more impact.

  Founded by a Latina engineer from Medellín and based in
  Tampa, Florida, MAS Global Consulting is a 100% Hispanic and
  woman-owned company, recognized as a Great Place to Work and
  one of the Fastest-Growing Companies in the US.

  We connect top Latin American talent with North American
  clients to build digital, data, and cloud solutions. Our
  teams are currently helping world-leading organizations like
  JP Morgan Chase, Johnson Controls, and Dell to modernize
  platforms, deliver innovation, and scale digital
  transformation.

  How You Will Make Impact

  As a Full-Stack Java Developer, you will design, build, and
  optimize microservices and customer-facing applications that
  process massive volumes of secure transactions daily. You
  will work directly with Chase engineers under a time-and-
  materials engagement, embedded in agile delivery teams.

  Your contributions will drive real impact by improving
  system performance, enhancing observability, and enabling
  data-driven financial solutions at scale.

  Key Responsibilities

  - Design and develop RESTful APIs and microservices using Java
    (11+), Spring Boot, and Spring Cloud frameworks.
  - Implement event-driven architectures with Kafka (producers,
    consumers, schema management, and streaming).
  - Deploy and manage services on AWS ECS/Fargate, using
    Terraform or CloudFormation for Infrastructure-as-Code and
    Spinnaker for CI/CD automation.
  - Integrate and maintain data flows with Cassandra, AWS S3, or
    Spark-based pipelines.
  - Collaborate with frontend teams using React or Angular to
    deliver seamless, full-stack solutions.
  - Leverage Python for automation, data validation, or
    integration scripting (nice-to-have).
  - Ensure quality through Test-Driven Development, automated
    testing, and continuous integration practices.
  - Partner with DevOps and QA teams to enhance resilience,
    scalability, and performance across distributed systems.
  - Participate in sprint planning, design reviews, and
    retrospectives while following Agile/Scrum practices.
  - Champion best practices in security, code quality, and
    documentation, ensuring compliance with Chase’s standards.

  You Have:

  - BS/BA degree or equivalent experience in Computer Science,
    Engineering, or related field.
  - 7+ years of experience building enterprise-grade
    applications using Java / Spring Boot.
  - Proven experience developing and deploying microservices on
    AWS Cloud (ECS, Fargate, Lambda).
  - Solid understanding of Kafka, Docker/Kubernetes, and
    distributed system design.
  - Hands-on experience with CI/CD pipelines (Spinnaker,
    Jenkins, or GitHub Actions).
  - Experience with frontend frameworks like React or Angular
    for full-stack delivery.
  - Familiarity with Cassandra, SQL/NoSQL databases, and data
    streaming concepts.
  - Working knowledge of Python3 for automation or data
    processing (nice-to-have).
  - Exposure to observability tools like Datadog, Splunk, or
    Dynatrace for monitoring and troubleshooting.
  - Experience working in Agile environments and collaborating
    in cross-functional teams.
  - Excellent communication skills — able to explain technical
    concepts to both engineers and product stakeholders.

  Bonus Skills (Nice to Have):

  - Knowledge of Apache Spark, Flink, or data engineering
    concepts.
  - Familiarity with financial services, regulated environments,
    or compliance-heavy systems.
  - Experience integrating AI/ML-powered recommendation systems
    or event-driven personalization logic.
  - Awareness of performance testing, NFR validation, and
    resilience patterns (DLQ, retries, fallback).

  Benefits

  - Health: Medical, dental, and vision coverage.
  - Time Away: Vacation, holidays, wellness days, and parental
    leave.
  - Financial: 401(k), basic life, and AD&D insurance.
  - Growth: Ongoing technical learning, certification
    reimbursement, and leadership development.

  Equal Opportunity Statement

  At MAS Global, diversity and inclusion are at the heart of
  our identity. We celebrate individuality and believe that
  everyone deserves a fair opportunity to grow and succeed. We
  are proud to be a woman-owned, minority-led company and an
  equal opportunity employer.
