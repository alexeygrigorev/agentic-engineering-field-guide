description: |
  About Us

  The financial advisory industry is a $80T market in the US,
  but has seen little technological innovation compared to the
  self-service market (Robinhood, Betterment, Wealthfront,
  SoFi). Client data management is a universally painful and
  expensive problem for financial advisors. Today, advisors
  manually collect, update, and utilize client data across the
  7-10 software tools that they use to run their business.
  Data transcription and translation across systems is time-
  consuming and error-prone, leading to costly inefficiencies
  and embarrassing client-facing problems. Managing data
  access control, audit logs, and compliance is a constant
  challenge, particularly in larger organizations.

  We are building the first wealth tech data orchestration
  company. We sync client data across a financial advisor's
  tech stack, unlocking the efficiency of a fully-integrated
  software suite with the choice of tools that best fit their
  business. We are laser-focused on enabling the best
  technology experiences for advisors and unlocking the
  potential of the entire wealth tech software ecosystem.
  We’re an experienced team of start-up operators with deep
  roots in both tech and advisory. You can learn more about us
  on our website.

  Role DetailsRole overview:

  We're looking for a fullstack engineer to build features
  across our platform. You'll own end-to-end delivery of
  product workflows, working across frontend interfaces and
  backend services to help financial advisors manage client
  data seamlessly across their tech stack.

  Where you'll make an impact:

  - Build and ship features end-to-end, working across React,
    Node.js and Golang.
  - Develop user-facing workflows including data collection
    forms, reporting interfaces, and account management
    experiences that handle complex financial data.
  - Implement backend APIs and services that power our data
    syncing and orchestration capabilities, ensuring reliable
    data flow across systems.
  - Write well-tested, maintainable code and participate in code
    reviews, contributing to the team's technical quality and
    standards.
  - Collaborate with Product, Design, and other engineers to
    break down requirements, identify technical approaches,
    and deliver solutions efficiently.
  - Debug and resolve production issues across the stack,
    ensuring system reliability for our customers.

  Requirements:

  - 4-6 years of fullstack engineering experience with exposure
    to both frontend and backend development.
  - Solid fundamentals in web development, including
    JavaScript/TypeScript, modern frontend frameworks (React
    preferred), API design, and working with databases.
  - Comfortable working across the full stack - you may have a
    preference but can contribute effectively on both frontend
    and backend work.
  - Collaborative mindset and strong communication skills - you
    work effectively with teammates and ask good questions
    when you need clarity.
  - Eager to learn and grow your technical skills - you're
    curious about new technologies and open to feedback.
  - Self-directed and capable of owning features with minimal
    oversight, while knowing when to ask for input or
    guidance.
  - Bias toward shipping and iteration - you balance getting
    things done with building things well.

  You'll stand out if you have:

  - Experience building B2B SaaS products or working in
    fintech/financial services.
  - Exposure to building integrations, working with third-party
    APIs, or data transformation pipelines.
  - Background at startups where you had to wear multiple hats
    and ship features independently.
  - Experience with testing frameworks and writing automated
    tests for both frontend and backend code.
  - Interest in using AI tools to improve your development
    workflow and productivity.

  Our tech stack: React, TypeScript, Node.js, Fastify, Golang,
  PostgreSQL

  Why Dispatch?

  Why work at Dispatch?

  - We’re a highly experienced team with a track record of
    successfully building together. We’re well-versed in
    building for the best tech companies and asset managers.
  - We’re a well-funded company backed by top-tier investors.
  - We're laser-focused on customers and believe that a world-
    class user experience is critical for product and business
    success.
  - We move fast, iterate quickly, and have a high bar for what
    “excellent” looks like.

  What we offer:

  - Competitive salary and equity options
  - High-quality benefits package including 100% company-paid
    insurance premiums for family coverage (medical, vision,
    dental).
  - 401K, HSA & FSA plans
  - OneMedical, HealthAdvocate, TalkSpace, and Teladoc
    memberships
  - Technology stipend
  - Unlimited PTO
  - Paid parental leave
  - Office space in San Francisco and New York for in-person
    working

