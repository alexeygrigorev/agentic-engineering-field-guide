description: |
  🌎 About Us

  TeamSnap is made up of innovators, technologists, builders,
  and problem-solvers shaping the future of youth sports.
  We’ve been setting the standard in youth sports technology
  since we were founded in 2009.

  We hire for big ideas and tiny egos — which is part of how
  we landed on Outside Magazine's Best Places to Work, Built
  In's 100 Best Remote-First Places to Work and, for several
  years running, Sports Business Journal’s Best Places to Work
  in Sports.



  TeamSnap is seeking a Staff Software Engineer (Android) to
  lead advertising on our next-generation Android app. You'll
  set the technical direction for how ads come to life in the
  app: designing a scalable, privacy-conscious ad platform and
  building ad experiences that feel native to how families use
  TeamSnap. Along the way, you'll help shape the architecture
  of a modern Kotlin and Jetpack Compose app used by millions.
  We’re looking for critical thinkers who are excited to jump
  in and make an impact! We're looking for people with big
  ideas and tiny egos. No matter what your “job” is, you’re
  welcome to suggest better ways of doing anything. Our team
  values collaboration in a remote culture, so we regularly
  participate in pair sessions and virtual team swarms to stay
  connected and improve the team and company.

