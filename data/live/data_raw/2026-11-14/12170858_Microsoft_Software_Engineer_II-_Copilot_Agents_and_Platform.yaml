description: |
  Overview

  SPARTANs take on strategic projects and hard problems across
  M365 Core that remove agility and modernization barriers.
  This team enters unfamiliar problem spaces quickly, builds a
  defensible technical model, frames the work, and owns
  outcomes through deployment and measured impact. The role
  spans repositories, services, and organizational boundaries
  and must leave durable solutions, reusable patterns,
  documentation, and playbooks behind.

  Engineers on this team operate with high autonomy and a
  strong product mindset. You will own large surface areas
  end-to-end, partner closely with product and design, and
  push to continuously raise the quality bar for both the CLI
  and the underlying agent platform used across GitHub and
  Microsoft.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Technical depth: writes and reviews clean, testable,
    observable code and gains confidence quickly in unfamiliar
    codebases.
  - Distributed-systems judgment: designs high-scale, low-
    latency, always-on services with explicit reliability,
    performance, cost, and compliance tradeoffs.
  - Mission execution: converts open-ended asks into scoped
    projects with success criteria, milestones, risk
    management, deployment, and measurable impact.
  - Influence without authority: aligns partners, negotiates
    dependencies, resolves disagreement, and lands changes
    across boundaries.
  - Develop AI-first. Use AI tools with discipline across the
    whole development lifecycle, from requirements and design
    to code, tests, and operations. Own the quality of
    everything AI produces, and help the team raise its bar on
    AI-assisted engineering.
  - Solid judgment: makes timely calls under incomplete
    information, states tradeoffs, and changes direction when
    evidence changes.
  - Community leadership: help early-in-career engineers and
    other engineers, communicates crisply, and builds an
    inclusive environment.

  Qualifications Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 2+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Other Requirements:

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include but are not limited to the
  following specialized security screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 3+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 5+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.
  - Hands-on experience building and operating generative AI or
    agentic systems in production, with direct ownership over
    quality, reliability, and iteration.
  - 5+ years of experience building and shipping customer-facing
    developer products, with depth across platform/foundation
    systems and user-facing experiences
  - Solid product mindset with a track record of owning
    ambiguous problem spaces and driving them to high-quality
    outcomes.
  - Solid engineering fundamentals, including systems design,
    performance, and debugging in complex production
    environments.
  - Experience designing, running, and optimizing evaluations
    for agentic systems, including tools, prompts, and agent
    loops.
  - Experience contributing to or leading open-source projects
    at scale is a plus.



  Software Engineering IC3 - The typical base pay range for
  this role across the U.S. is USD $102,100 - $202,200 per
  year. There is a different range applicable to specific work
  locations, within the San Francisco Bay area and New York
  City metropolitan area, and the base pay range for this role
  in those locations is USD $133,800 - $219,200 per year.



  Certain roles may be eligible for benefits and other
