description: |
  Join us at Entrust 

  At Entrust, we’re shaping the future of identity centric
  security solutions. From our comprehensive portfolio of
  solutions to our flexible, global workplace, we empower
  careers, foster collaboration, and build solutions that help
  keep the world moving safely. 



  Get to Know Us 

  Headquartered in Minnesota, Entrust is an industry leader in
  identity-centric security solutions, serving over 150
  countries with cutting-edge, scalable technologies. But our
  secret weapon? Our people. It’s the curiosity, dedication,
  and innovation that drive our success and help us anticipate
  the future. 

  About the Opportunity:

  We’re looking for a Senior Software Test Engineer to join
  one of our cross-functional Identity Verification product
  teams. You’ll have impact on the quality of end-to-end
  verification journeys spanning web and mobile experiences,
  backend services and machine-learning-powered products.

  Our solutions enable thousands of customers to verify
  hundreds of millions of users during critical onboarding
  journeys. This creates unique quality and testing challenges
  around distributed systems, diverse devices and user
  conditions and reliable delivery at scale.

  About the Team:

  You’ll join a team of nine Test Engineers, each embedded
  within a cross-functional product team. You’ll collaborate
  with software engineers, product managers, designers and
  other specialists from early product and technical
  discussions through release and production feedback.

  As Test Engineers, we come together each week to work on
  shared initiatives that improve tooling, automation, and
  quality practices across engineering. You’ll have scope to
  influence both your product team and the wider organization.

  Responsibilities:

  As a Senior Test Engineer, you will:

  - Fully own planning, coordinating and executing test and
    quality-related activities within a cross-functional team;
  - Lead and contribute to the test engineering initiatives that
    have impact across several engineering teams;
  - Select and apply suitable testing techniques based on a deep
    understanding of the product from technical and customer
    perspectives;
  - Build maintainable, developer-friendly test frameworks and
    automated test suites;
  - Work closely with engineering and product colleagues to
    clarify acceptance criteria and prioritize quality
    improvements;
  - Support acceptance testing and combine automation with
    exploratory testing as required;
  - Mentor colleagues and continuously improve delivery
    pipelines, release processes, and feedback loops;
  - Advocate for quality and help strengthen the team’s testing
    culture.

  Requirements:

  - 5+ years of experience in software testing;
  - Strong test design and automation experience in web, backend
    or mobile;
  - A solid understanding of testing techniques and quality
    engineering practices;
  - Strong coding skills in multiple languages (e.g. TypeScript,
    Java, Ruby, Python);
  - Experience with several test tools and frameworks (e.g.
    Playwright, Cypress, Selenium, Appium, REST Assured);
  - Experience working with CI/CD pipelines;

  - Familiarity with performance testing, containerization and
    cloud environments;
  - Experience using or building AI-assisted development or
    testing tools.

  Our Tech Stack:

  We choose tools pragmatically and do not expect you to know
  everything in our stack. We value strong engineering
  fundamentals and a willingness to learn. For testing, we
  mainly use:

  - Languages: TypeScript, Ruby, Python, Swift, Kotlin
  - Test frameworks: Playwright, RSpec, Pytest, XCUITest,
    Espresso, k6
  - CI/CD: GitLab, Bitrise
  - Deployment and infrastructure: Docker, Kubernetes, AWS

