description: |
  Why Kubbly

  Most business texts feel like spam. At Kubbly, we are
  changing that. Messaging app inbox is becoming the most
  valuable smartphone real estate. People live within their
  messaging apps. But, businesses struggle to engage their
  customers here meaningfully without sounding like spam. We
  solve this with AI agents that predict intent, start the
  right conversation, and finish the task inside the messaging
  threads.

  We need someone who can help us scale our platform that
  enables businesses to deploy their messaging AI agents. If
  you have a knack for building end to end scalable systems,
  you'll fit right in. You'd be joining at that perfect stage:
  proven enough that we know it works, early enough that
  you'll shape how it grows.

  Reasons to join us:

  - The founders actually built similar stuff before. Piyush and
    Giorgos have previous experience building similar
    startups, licensing technologies to Fortune 1000
    companies, and 10+ years experience building ML and
    recommendation systems at Amazon and Goldman Sachs.
  - We're backed by Bek Ventures (formerly Earlybird Digital
    East). HEC-Dow Jones ranked their fund #1 in WSJ by
    overall performance. They backed UiPath and Payhawk before
    they were cool.
  - You'll own the full pipeline, not tickets. Your code won't
    go through 5 layers of review. You'll have major role in
    deciding what to be built, how something should work,
    build it, ship it, and see customers use it.
  - We actually talk about technical problems. Weekly tech
    talks, paper discussions, post-mortems on interesting
    bugs. The founders are engineers first - they'll geek out
    with you about implementation details.
  - Competitive comp + equity.

  🚀 About the role

  At Kubbly, we believe the way businesses and consumers will
  engage with each other will look completely different in
  next 5 years time. As Senior Software Engineer you’ll be
  responsible for building the systems and tools that will
  enable this change. You will work alongside the founding
  team to drive the product roadmap, develop new features and
  scale the platform. You will be product- and customer-
  obsessed many times evaluating your own hypotheses. We are
  looking for exceptional minds to join us on this adventure,
  where each person has the opportunity and the obligation to
  make a difference.

  Our philosophy: We operate on high conviction, low ego. We
  value passionate, data-driven ideas. We debate vigorously to
  find the best solution, but then align as a team to execute.

  We are mostly in-office from our awesome HQ in Williamsburg
  - 4 days per week. That’s not because we’re obsessed with
  processes but because we’ve seen it in our previous roles
  that live collaboration fosters cross-pollination and team
  bonding that a fully remote team cannot experience.

  ✅ What You’ll Do

  - This is a Senior role - You get to work independently, be an
    owner and help shape the vision and product roadmap.
  - Lead the conception, development and scaling of tools and
    features that will be used from business to monitor and
    drive customer engagement.
  - Own the architecture, reliability, observability, and
    scalability of core product systems in production.
  - Design, build and expand our proprietary database that
    powers our AI engines providing customer insights.
  - Build and maintain integrations with external APIs,
    messaging channels, and internal services that power
    customer engagement workflows.
  - Implement and optimize robust CI/CD pipelines to facilitate
    reliable, frequent software deployments.
  - Raise the standard for code quality (best practices in
    software development, code reviews, testing, etc) and help
    us shape our engineering culture.
  - Collaborate closely with the team to streamline workflows
    and reduce friction in the development lifecycle.
  - Maintain clear, comprehensive documentation for all release
    processes and infrastructure systems.

  🛠️ Who You AreSoft Skills

  - Stubbornness on the vision, flexibility on the details
    (borrowed by Jeff Bezos 😀). This means that:
    - You are flexible and curious to learn about new things
      constantly.
    - You are perfectly fine to bury the hatchet for efforts that
      don’t lead to PMF and view this is as a learning
      opportunity.
  - Customer Obsession: we’re small and what we build is driven
    only by our desire to achieve PMF. This means we listen to
    our customers’ pains and work backwards to create awesome
    solutions.
  - Desire to work (mostly in person), next to CTO, CEO and
    being involved with engineering decisions.
  - Exceptional collaboration, and communication skills that
    foster a high-performing team environment (we believe that
    less is more when it comes to communicating clearly).

  Hard Skills

  - 3+ years of experience in Software Engineering or DevOps
    supporting software development environments.
  - Strong programming skills (Python, Rust, Java, React,
    Golang, TypeScript, Node.js or other scripting languages).
  - Experience designing and operating scalable production
    systems, with strong fundamentals in system design,
    performance, and fault tolerance.
  - Strong understanding of testing, observability, and security
    best practices for backend services and production
    infrastructure.
  - Proficiency in cloud platforms (AWS preferred - EC2, S3,
    Lambda, RDS, ECR, ECS/EKS), including building and
    maintaining containerized applications (e.g., Docker,
    Kubernetes).
  - Deep understanding of REST principles and experience working
    with backend APIs and services.
  - Experience with relational databases (PostgreSQL, MySQL,
    etc.) and solid understanding of data normalization
    principles.
  - Expertise in CI/CD best practices and tools (GitHub Actions,
    Jenkins, CircleCI, etc.)
  - Experience using GenAI work boosting tools in your day-to-
    day job (ChatGPT, Claude, Gemini, etc).
  - Strong skills in shell scripting (bash, zsh) and terminal
    multiplexers (tmux).

  Nice to Have

  - Experience in early-stage or high-growth tech environments.
  - Familiarity building and managing data and process pipelines
    using Airflow or other workflow orchestration tools.
  - Experience with infrastructure as code (IaC) tools (Pulumi,
    Terraform, etc.).
  - Experience with event-driven architectures and asynchronous
    processing (queues, pub/sub, background jobs).
  - Experience building B2B SaaS integrations or customer
    communication platforms (email, SMS, WhatsApp,
    CRM/e-commerce tooling).

  🎁 What we offer

  - A great opportunity to shape the future of Kubbly and grow
    into leadership roles as the company grows 🌱
  - Competitive salary and generous equity 🚀
  - 14 paid company holidays (most companies recognize 11-12) 📆
  - Unlimited paid time off 🏖
  - Significant coverage of medical, dental, and vision
    insurance 🏥
    - Contribution towards medical, dental, and vision insurance
      for dependents
  - Generous 401(k) company match 📈
  - Home office set-up 🖥
  - Gym membership
  - All the cold brew when the machine is not broken and every
    type of coffee possible ☕️ 😛
  - Great views of the Manhattan skyline 🌇

  Compensation Range

  $120,000 - $170,000 USD (for NY based candidates) plus
  significant equity

  (Base salary will be a factor of location, experience and
  participation in equity)
