description: |
  Who We Are

  Provenir is the unified Decision Intelligence Platform that
  gives enterprises full control over end- to-end customer
  decisioning — to manage risk, drive growth, and transform
  business outcomes. By consolidating data, AI models,
  intelligence, agents and governance into a single
  decisioning environment, Provenir empowers business teams to
  configure and evolve strategy directly, while maintaining
  enterprise-grade reliability and regulatory compliance.
  Trusted by 120+ institutions in 60+ countries, Provenir
  processes over 4 billion decisions annually — turning
  architectural coherence into sustained risk performance and
  measurable value. Ready to solve meaningful challenges, work
  with enterprise customers, and help shape the future of AI-
  powered decisioning? Join us.

  We are Provenir AI, part of the Provenir group, a global
  fintech company with a passion for technology and helping
  businesses become industry leaders. As a leading provider of
  decisioning and analytics products for financial services
  and other industries, we empower businesses to create
  innovative, digital-first financial decisioning solutions
  that drive business growth.

  🏠Remote first - The successful candidate will be based in UK

  🛠️Java, Spring Boot/AI, AWS, Graph Database, AI and ML
  frameworks, Agentic AI

  🚀Be part of a growing AI Fintech, working with cutting-edge
  technologies

  🕛At least 10 years of experience in hands-on Software
  Development

  💰Competitive compensation

  💚Fantastic benefits including Health Plans, WFH allowance
  and Macbook Pro

  You’ll be a key member of the Provenir AI team, who are
  responsible for all things data, analytics, and ML/AI at
  Provenir AI.

  The team fosters a vibrant and collaborative culture. We are
  a passionate group of professionals who thrive on the
  intersection of data and engineering.

  Our team is driven by a shared enthusiasm for innovation and
  continuous learning. We encourage creativity and value
  diverse perspectives, promoting an environment where
  everyone's ideas are heard and respected.

  Collaboration and knowledge sharing are at the core of our
  work ethic, as we believe that great things are achieved by
  working together.

  We have an excellent opportunity for a Senior Software
  Engineer to design, build and operationalise large-scale
  data solutions using standard REST APIs, Graph, AI and ML
  applications for Provenir AI.

  Your Responsibilities 🚀

  ● Design, develop, and maintain efficient, reusable, and
  reliable software

  ● Engineer backend APIs, Graph, and AI-driven products,
  including agentic and generative AI capabilities

  ● Assume full ownership of assigned tasks, demonstrating
  leadership, and setting a positive example as a Senior
  member of the team. Ensure that each task is executed with a
  high level of competence, and commitment, and in alignment
  with team goals

  ● Provide technical leadership and strategic direction for
  software development projects and teams.

  ● Partner with cloud architects and leads to design the
  requirements for backend services and APIs

  ● Contribution and construction of the product roadmap
  including design and testing of POC products

  ● Create functional/technical specification documents and
  communicate with different stakeholders

  ● Participate in code reviews and brainstorming sessions,
  mentor junior developers, ensure best practices in software
  development, and assist with recruitment.

  ● Take the initiative to research and propose enhancements
  and improvements, proactively identifying opportunities to
  increase efficiency and effectiveness in our processes and
  systems

  ● Participate in the hiring process and help build a strong,
  high-performing team within the region.

  Your Experience 🛠️

  ● In-depth experience in Java software development

  ● Experience with Spring Boot and the Spring ecosystem
  including Spring AI

  ● Stay up to date with the latest industry technologies and
  standards

  ● Must have hands-on experience developing cloud-native
  applications using services like AWS S3, SQS, Kinesis, Graph
  DB, OpenSearch/Elasticsearch or equivalent services on other
  cloud platforms such as GCP

  ● Taking initiative, learning quickly, and adapting to
  shifting priorities, while working independently under
  minimal guidance, self-motivated, and able to research
  solutions with little supervision.

  ● Experience leading software development features from
  inception to deployment and mentoring junior developers.

  ● Designing, developing and deploying RESTful APIs and
  services

  ● Experience in stream data processing, low latency
  application coding.

  ● Experience with GenAI, agentic AI, and machine learning
  frameworks.

  ● Experience in writing comprehensive unit and integration
  tests, ensuring the delivery of high-quality code.
  Candidates should demonstrate proficiency in test-driven
  development (TDD) methodologies and be committed to
  maintaining excellent code quality standards

  ● Experience with software development life cycle from
  requirements gathering to deployment

  ● Ability to clearly articulate ideas during requirements
  and design sessions with the team and lead teams on assigned
  initiatives

  ● Strong analytical, problem-solving and synthesising skills
  while understanding the scope and impact of your work

  Although not essential, it would be great if you have
  practical experience with:

  ● Experience with Spring AI, LangChain, LangGraph,
  LlamaIndex, or similar AI application frameworks

  ● Familiarity with modern front-end technologies (such as
  React and Next.js).

  ● Python

  ● Kubernetes, Docker and CI/CD tools and processes

  Interview Process 💬

  The interview process would typically be structured as
  follows:

  ● Initial chat. This would be with a member of our
  recruitment team and help to better understand your current
  situation, what you are looking for and any questions you
  may have.

  ● Technical Challenge. This is a take-home task you will
  complete in your own time.

  ● Technical Interview. This will be with your potential team
  members, primarily consisting of technical questions.

  ● Final Interview. This will be with senior management and
  cover a range of technical and behavioral competencies.

  Your Benefits 💚

  ● Comprehensive private health cover and wellness plans

  ● Flexible and remote-friendly opportunities

  ● Maternity/paternity leave

  ● Retirement benefits such as pension contributions to plan
  for your future

  ● Macbook Pro

  Our employees are our top priority; we offer comprehensive
  health and wellness plans. You will enjoy paid time off and
  company holidays, flexible and remote-friendly
  opportunities, and maternity/paternity leave.

  At Provenir, we recognize that diversity and inclusion make
  our teams stronger. We are committed to equal employment
  opportunity and welcome everyone regardless of race, colour,
  ancestry, religion, national origin, age, sex, gender
  identity, sexual orientation, disability, marital status,
  domestic partner status, citizenship, or veteran status or
  medical condition. We encourage people from all backgrounds
  to apply.
