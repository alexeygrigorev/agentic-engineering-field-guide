description: |
  Our Mission: Make Data Trustworthy at Scale

  Anomalo is the AI-powered data quality platform trusted by
  Fortune 500 companies. Our platform combines unsupervised
  machine learning with automated root-cause analysis to
  detect anomalies without manual rule maintenance. While
  legacy tools force teams to anticipate every failure and
  maintain brittle threshold libraries, Anomalo learns what
  "normal" looks like and automatically flags deviations. When
  issues surface, our RCA pinpoints the cause in minutes, not
  days.

  We work with Block, Discover, Atlassian, and Notion. We're
  backed by $82M from SignalFire, Norwest, Databricks
  Ventures, Snowflake Ventures, Foundation Capital, Two Sigma
  Ventures, and First Round Capital.

  As a Senior/Staff Full Stack Software Engineer at Anomalo,
  you'll play an important role in building and maintaining
  our web platform. You'll define, shape, and ship innovative
  customer-facing features with a focus on user experience.
  You'll own the end-to-end development of customer-facing
  features from concept through launch. This role will have a
  strong focus on frontend development while also contributing
  to our backend.

  We’re open to hiring this role at the Senior or the Staff
  level. We'll determine the level together based on your
  background, experience, and how you approach the interviews.

  At Anomalo, you'll join supportive colleagues who love to
  learn together and take on challenging, high-impact projects
  with a strong sense of ownership. You’ll make a meaningful
  impact and shape key technical decisions.

  What you'll do as a Senior/Staff Full Stack Software
  Engineer at Anomalo:

  - Own end-to-end development of new product features, using
    React/TypeScript on the frontend, and Python on the
    backend
  - Translate designs, sketches, and product ideas into
    functional and reusable UI components that are beautiful
    and intuitive to use
  - Partner closely with Product and Design to create seamless,
    user-friendly experiences for our customers
  - Interact directly with end-users to deeply understand their
    needs and build the right solutions
  - Leverage AI-powered development tools to accelerate coding,
    debugging, testing, and problem-solving, while maintaining
    oversight and sound judgment to uphold high standards for
    code quality and performance

  What you'll bring to the team:

  - 7+ years of professional software engineering experience,
    with significant experience building modern, customer-
    facing web applications
  - Deep expertise in React, TypeScript, and modern frontend
    development
  - Extensive experience using Python
  - Strong knowledge of SQL
  - Experience working closely with end-users and translating
    their needs into features
  - Strong communication skills, a collaborative approach, and
    the ability to take ownership of complex projects while
    working independently
  - Demonstrated experience integrating AI-powered development
    tools into your daily engineering workflow to accelerate
    development, improve code quality, and solve complex
    technical challenges

  Location & Travel:

  - This is a remote role, open to qualified candidates based in
    the United States
  - Occasional travel is required (approximately 10%) for in-
    person company offsites and Engineering Hackathons

  Perks of Working at Anomalo

  - 🎯 Make an Impact: Join a growing company that delights our
    customers. Our modern UI and rich visualizations help our
    customers solve unknowns and anticipate data issues before
    they happen.
  - 🔍 A values-driven, open and transparent culture that
    supports autonomy and growth.
  - 🏡 Fully Remote: We were fully remote before it was a thing,
    and we believe your best work happens on your schedule. We
    offer a generous $1,000 stipend to ensure your remote
    office is comfortable.
  - 🌴 Generous Time Off: Enjoy 17 company holidays and unlimited
    vacation time that we encourage you to take. We also have
    a company-wide winter break the last week of the year.
  - 🩹 Health Benefits: Comprehensive family-friendly medical,
    dental, and vision insurance plans. Anomalo covers 90% of
    your premiums. We provide access to family planning and
    reproductive care for our employees and their families by
    partnering with Carrot Fertility. We provide mental health
    and wellness benefits for all employees, covered at 100%.
  - 🍼 Family Comes First: We offer 16 weeks of parental leave,
    during which you will receive your full pay.
  - 💸 Investment in the company & your future: Every employee is
    granted a meaningful equity package. We also offer life
    insurance and a 401(k) plan.

  Many of our benefits and perks are designed for full-time
  employees, with some available only to team members based in
  the United States.

  Accommodations and Privacy:

  We will ensure that individuals with disabilities are
  provided reasonable accommodations to participate in the
  interview process, to perform essential job functions, and
  to receive other benefits and privileges of employment. Upon
  interview scheduling, instructions for confidential
  accommodation requests will be shared.

  Anomalo Applicant Privacy Policy
