description: |
  Seeq creates cutting-edge data analytics software for
  industrial process data, serving sectors like
  pharmaceuticals, energy, and manufacturing. Our core product
  is a robust calculation engine capable of executing advanced
  math and machine learning algorithms on streaming time-
  series data. By leveraging generative AI, we enhance
  usability and accelerate outcomes for our users.

  As a fully remote company, Seeq fosters collaboration using
  tools like Zoom, Slack, and our own Qube Virtual Office.
  With a focus on agile principles, our team of talented
  engineers is dedicated to building products that exceed
  customer expectations while nurturing a supportive,
  collaborative environment.

  What You Will Do

  As a Staff+ Software Engineer at Seeq, you will play a
  critical role in shaping the technical direction and
  architecture of our software platform. You will lead the
  design and development of complex software systems, working
  closely with cross-functional teams including product
  managers, designers, and other engineers. You will mentor
  and coach junior engineers, guiding them in best practices
  and helping them grow their skills. You will be a technical
  leader, driving innovation and spearheading the
  implementation of new technologies and frameworks.

  What We’re Looking For

  You’re passionate about crafting exceptional software: you
  revel in the art of designing and building with elegance,
  extensibility, and maintainability as your guiding
  principles.

  You’re renowned as one of the most productive engineers in
  your company, set apart by your commitment to continuous
  improvement. Always striving to perfect your craft, you
  excel as a teammate, consistently coming up with innovative
  solutions. You possess an innate ability to identify areas
  for improvement without waiting for them to be pointed out.
  Your track record includes swift product and feature
  deliveries, showcasing proficiency in a continuous delivery
  model.

  You’re meticulous and detail-oriented, advocating for unit
  testing, continuous integration, and elegant solutions. Bugs
  are your adversaries, and you take pleasure in immediately
  addressing them. Eliminating technical debt while
  refactoring code excites you.

  You’re eager to collaborate through pair programming and
  contribute to team acceleration; you consistently review and
  provide actionable feedback on code. Your passion extends to
  being one of the most product- and user-focused engineers.
  Because you actively engage with customers, you can
  articulate the rationale behind features and explain pain
  points for your fellow engineers.

  You’re adaptable, versatile, and quick to learn: you bring
  fresh technologies and methodologies to the team,
  establishing yourself as a technological thought leader.
  Your influence is felt as you mentor colleagues, meeting
  deadlines through effective planning, prioritization, and
  accurate estimates.

  Knowledge of backend technologies such as a gRPC, GraphQL,
  or a JVM language like Kotlin, allows you to build and debug
  reliable, maintainable, and extensible applications from
  browser to database. Your proficiency extends to databases,
  distributed computing, and cloud platforms, with deep
  expertise in at least one of these technologies.

  You’re driven by a desire for impact beyond individual
  contributions; you possess a holistic view, working
  seamlessly across boundaries for the benefit of the product
  and its users. Proactive in seeking and providing feedback,
  you maintain open communication about growth opportunities
  with your manager(s) and colleagues.

  Requirements

  Benefits

  Seeq is a remote-first (and only) company founded by serial
  entrepreneurs. Our executive team and board of directors
  have extensive experience with successful startup ventures
  in high-growth environments.

  We are founded on the idea that companies need better
  solutions for quickly and easily getting business insight
  from their industrial process data. Our mission is to
  provide software and services that convert that data into
  meaningful information that the business can use to improve
  profitability and sustainability.

  We have a wonderful, kind-hearted, talented team that loves
  to collaborate, lead by example, and exceed our customers’
  expectations. We are certified as a great place to work, and
  included in the Technology Fast 500 and Inc. Magazine’s Best
  Places to Work.

  The Perks of Working at Seeq

  - Competitive salary, equity, and cash bonus incentives
  - Benefits:

  Seeq provides equal employment opportunities (EEO) to all
  employees and applicants for employment without regard to
  race, color, religion, sex, national origin, age,
  disability, or genetics.

  You must be authorized to work in the country in which you
  reside. Seeq does not sponsor US F1 or H-1B work visas
