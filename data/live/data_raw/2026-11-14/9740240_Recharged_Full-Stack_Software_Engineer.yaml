description: |
  About Recharged

  Recharged is on a mission to simplify the electric vehicle
  ownership experience with the first online marketplace
  designed specifically for used EV buyers and sellers. We’ve
  combined our EV expertise with a data-driven, transparent
  platform that helps accelerate EV adoption by giving
  consumers the clarity and confidence they need. We’re
  building the purpose-built platform for the future of EV
  retail.

  About The Role

  We’re seeking a driven product-minded Full-Stack Engineer
  who can ship high-quality code at speed. As part of our
  growing team, you’ll have significant autonomy in building
  and owning features across our entire marketplace platform,
  from finding ways to improve the consumer experience for
  buyers and sellers, to optimizing operations to support our

  team as we expand into new markets.

  Position Overview

  Our ideal candidate is comfortable and excited to work
  across the stack, and cares deeply about applying their
  taste to build a high-quality product experience. You are a
  generalist who thrives in fast-paced environments, can
  confidently navigate both frontend and backend development,
  and obsesses over user experience. This role is central to
  our product development, responsible for architecting and
  implementing zero-to-one features that will not only improve
  the entire end-to-end marketplace experience, but also
  support our sales & operations teams in developing world-
  class tools that help buy and sell EVs across the country.

  Required Skills & Experience

  - 4+ years of experience with Full-Stack development
  - Strong proficiency across the stack, Typescript across the
    frontend (React, Next.js) and backend (Node.js, or
    similar)
  - Track record of shipping production-ready code at high
    velocity
  - Proven ability to build intuitive, mobile-first, and user-
    friendly interfaces with an emphasis on quality and
    simplicity
  - Experience integrating and optimizing third-party APIs
  - Comfortable with leveraging AI coding tools and validating
    output to accelerate development
  - Strong communication skills for collaboration with the team
    on product strategy, feature development, and iteration
    based on user feedback and metrics
  - Demonstrated success in fast-paced, ambiguous environments

  Key Responsibilities:

  - Own end-to-end features across our tech stack, knowing when
    and what to prioritize
  - Design and implement core backend components and frontend
    interfaces, following best practices and patterns
  - Contribute to key architectural decisions that shape our
    platform, be comfortable writing design docs when needed
    to resolve ambiguities
  - Collaborate closely with product, sales, and marketing to
    gather feedback
  - Diagnose and resolve performance issues and bugs
  - Demonstrate tenacity by proactively supporting teammates and
    helping unblock each other

  An ideal candidate has:

  - Passion for building beautiful user experiences
  - Experience in startup environments and an appreciation for
    excellence
  - Background in marketplace platforms and with handling
    complex transactional systems like payments or logistics
  - Interest in sustainability, electric vehicles, or building
    for the physical world
  - Knowledge of our stack: (Typescript, React, Next.js,
    serverless architectures, Vercel, AWS, Stripe)

  Compensation & Benefits:

  - Salary: $150,000 - $190,000, dependent on experience
  - Equity: Competitive equity package that makes you a true
    stakeholder in the company's success
  - Benefits: Comprehensive health benefits package
  - Office: Work out of our NYC office (hybrid 3 days in office)

  Why join Recharged:

  - Mission-Driven: Be part of a team with a clear mission to
    accelerate the transition to sustainable transportation by
    creating a transparent and efficient marketplace for used
    electric vehicles.
  - Ownership: Competitive equity stake in a rapidly growing
    Series A-stage company and the opportunity to shape the
    company's future.
  - Drive real value: Join as an early team member, working
    directly with the founders and founding engineering team
    to define the product and technical foundations of the
    business.
  - Growth Potential: As we scale, there will be opportunities
    to grow into a technical leadership role with ownership
    across our platform.
