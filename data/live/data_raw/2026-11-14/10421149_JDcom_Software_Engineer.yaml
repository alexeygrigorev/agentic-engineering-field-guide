description: |
  Who We Are

  At JD.com, also known as JINGDONG, we are building one of
  the world’s most trusted technology and supply chain
  ecosystems. What started as a bold idea in China has evolved
  into a NASDAQ-listed, Fortune 44 global enterprise serving
  over 700 million active customers. Powered by advanced
  logistics, innovative technology, and a commitment to
  integrity, JD.com operates across retail, logistics,
  technology, property and more, creating solutions that make
  everyday life smarter, faster, and more connected.

  Our Global Reach

  JD.com is expanding its international footprint through a
  digitally intelligent, cross-border supply chain and world-
  class logistics network, supported by platforms such as
  Joybuy, which brings trusted products to customers
  worldwide. Today, our teams operate across China, the U.S.,
  U.K., Netherlands, France, Germany, Spain, Brazil, Hungary,
  Japan, South Korea, Australia, Thailand, Vietnam, Malaysia,
  Indonesia, Saudi Arabia, the UAE and beyond, reaching
  customers in every corner of the world.

  Learn more about who we are and what we do:
  https://corporate.jd.com/

  What We Offer

  Joining JD.com means becoming part of a company where
  people, innovation, and impact go hand in hand. We offer a
  competitive salary, a great location, and a supportive,
  people-first culture where your growth truly matters. With
  access to global projects, learning opportunities, and an
  inclusive environment that values every voice, you’ll have
  the space to shape the future with us.

  About The Team

  You’ll be joining the JD.com team, which values
  collaboration, ownership, and a commitment to delivering
  high-quality results in a fast-paced, dynamic environment.

  Key Responsibilities:

  - Build and maintain Joybuy's backend systems, ensuring high
    performance, availability, concurrency, security, and
    scalability.
  - Identify and mitigate technical risks throughout project
    implementation, developing and executing effective control
    strategies that cover monitorability, maintainability, and
    grey release or rollback capabilities.
  - Research, adopt, and promote new technologies and
    methodologies.
  - Identify integration opportunities between emerging
    technologies and global system architectures to drive the
    team’s technical growth and strengthen architectural
    foresight.

  Minimum Qualifications:

  - Bachelor's degree in Engineering, Computer Science,
    Mathematics, or a related technical field.
  - 3+ years of experience in Java programming and Spring Boot.
  - Passionate about technology and continuous improvement,
    demonstrating exceptional coding proficiency, a commitment
    to clean and elegant code, and a keen interest in
    exploring open-source projects.
  - Proactive, fast learner, and highly collaborative, with
    strong communication, analytical, and problem-solving
    skills, capable of independently identifying and resolving
    complex technical challenges.
  - Effective communication skills in Chinese and English.

  Preferred Qualifications:

  - Work experience in large-scale ecommerce companies.
  - Experience in supply chain, fulfilment or logistics systems.
  - Experience in UK and European business.

  What We Offer:

  - A dynamic and challenging work environment in a leading
    global e-commerce company.
  - The opportunity to work with a diverse international team
    and to make a significant impact on JD.com's global
    presence.
  - Competitive salary and benefits package, including health
    insurance, retirement plans, and performance bonuses.

  JD.com is committed to creating a diverse environment and is
  proud to be an equal opportunity employer. All qualified
  applicants will receive consideration for employment without
  regard to race, colour, religion, gender, gender identity or
  expression, sexual orientation, national origin, genetics,
  disability, age, or veteran status.

  At JD.com, we’re committed to building a diverse and
  inclusive workplace where everyone can thrive. We’re proud
  to be an equal opportunity employer and make all employment
  decisions without regard to race, color, religion, gender,
  gender identity or expression, sexual orientation, national
  origin, disability, age, veteran status, or any other
  protected characteristic.

  Ready to apply?

  Take the next step in your career, apply now and explore the
  opportunities we have to offer.
