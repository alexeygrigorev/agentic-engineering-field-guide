description: |
  Company Description

  Every minute of every day, Smiths Detection’s threat
  detection and security screening technology helps to protect
  people and infrastructure, making the world a safer place.

  Smiths Detection a global leader in the development,
  manufacture and management of security and detection
  solutions designed to make the world a safer place. Our
  technology provides threat detection and screening solutions
  for customers in our key markets: aviation, ports and
  borders, defence, and urban security.

  Our expertise spans 21 global offices, seven manufacturing
  sites and five R&D centres, with a global network of 3,000
  dedicated colleagues contributing towards over 40 years at
  the frontline of advances in safety and security.

  This results in careers built on variety and the opportunity
  to work on a range of state-of-the-art solutions, where you
  can develop your knowledge and experience every day.

  Job Description

  We are looking for a Senior Embedded Software Engineer to
  join our growing Software team in Hemel Hempstead and play a
  key role in developing the next generation of chemical and
  explosive trace detection products.

  This is an opportunity to work on mission-critical
  technology that directly contributes to the safety and
  security of military and civilian users worldwide.

  The Opportunity

  As a Senior Embedded Software Engineer, you will be part of
  an Agile software team responsible for designing, developing
  and supporting embedded software solutions across a range of
  advanced detection systems.

  Initially, you will focus on embedded software development
  for low-power microcontroller platforms before transitioning
  into projects that combine embedded systems and Linux-based
  development environments. Alongside hands-on technical
  delivery, you will take ownership of software work packages,
  lead technical investigations, contribute to architectural
  decisions, and support the development of less experienced
  engineers.

  We're looking for someone who enjoys solving complex
  technical challenges and can effectively communicate ideas
  across multidisciplinary teams.

  What You'll Be Doing

  - Designing, developing and maintaining embedded software
    using modern C/C++
  - Working within embedded RTOS and Linux environments
  - Leading technical investigations and proposing solutions to
    complex engineering challenges
  - Collaborating with hardware, systems and multidisciplinary
    engineering teams
  - Defining software requirements, interfaces and system
    behaviour
  - Conducting code reviews and supporting best practice
    software engineering
  - Performing unit, integration and system-level testing
  - Contributing to software architecture and technical
    documentation
  - Supporting Agile development activities including sprint
    planning and retrospectives
  - Mentoring and supporting junior engineers
  - Driving continuous improvement in software development
    processes, tools and practices

  What Makes Someone Successful in This Role?

  We are looking for more than a strong embedded developer.
  The successful candidate will demonstrate the ability to
  take ownership of technical work packages, investigate
  challenges independently, and clearly communicate solutions
  to both technical and non-technical stakeholders.

  You may currently be a Senior Software Engineer, Lead
  Engineer, Principal Engineer, or an experienced Embedded
  Engineer ready to operate at the next level. You will be
  comfortable balancing hands-on development with technical
  leadership, mentoring and cross-functional collaboration.

  Why Join Smiths Detection?

  - Work on cutting-edge technology with real-world impact
  - Contribute to products that help protect communities and
    critical infrastructure
  - Join an experienced and collaborative engineering team
  - Influence technical direction and software best practices
  - Opportunities for professional growth and technical
    leadership
  - Exposure to advanced embedded and Linux-based platforms
  - Long-term career development within a global technology
    organisation

  Location: Hemel Hempstead

  Working Pattern: Regular on-site presence is required due to
  close interaction with target hardware and engineering
  teams.

  If you're passionate about embedded software engineering and
  want to work on technology that makes a genuine difference,
  we'd love to hear from you.

  Qualifications

  - Minimum 5 years' experience developing software for embedded
    systems
  - Strong modern C/C++ programming skills within embedded
    environments
  - Experience working with low-power microcontrollers and
    embedded hardware
  - Knowledge of communication protocols such as:
    - SPI
    - I2C
    - UART
    - CAN
    - USB
  - Experience working within RTOS environments
  - Strong Linux experience, ideally including system
    configuration and command-line operation
  - Familiarity with Rocky Linux, CentOS or Red Hat based
    distributions
  - Experience with Git version control and modern development
    workflows
  - Strong debugging and performance optimisation skills
  - Excellent written and verbal communication skills
  - Ability to independently own and deliver technical work
    packages
  - Eligibility for BPSS clearance and ability to obtain SC
    Security Clearance

  Desirable Experience

  - Python scripting and automation
  - FreeRTOS, Keil RTX or ThreadX
  - Atlassian toolset including Jira, Bitbucket and Confluence
  - Use of lab equipment such as oscilloscopes, logic analysers
    and multimeters
  - Ability to read and understand electronic schematics
  - Experience working within regulated or safety-critical
    environments
  - Open-source software contributions

  Additional Information

  Join us and we’ll help build your career, with excellent
  training and opportunities for career growth across the
  business, both locally and globally. You’ll experience an
  inclusive environment, with strong leadership and a focus on
  safety and wellbeing. You’ll also have the flexibility to
  choose from a wide range of benefits to suit your lifestyle,
  offering you and your family support from a health and
  wellbeing, financial and lifestyle perspective.

  Join us and work for a world-leader, with the benefits and
  training to reward your dedication and skills. Be part of a
  team where we are making the world a safer place.

  We believe that different perspectives and backgrounds are
  what make a company flourish. All qualified applicants will
  receive equal consideration for employment regardless of
  color, religion, sex, sexual orientation, gender identity,
  national origin, economic status, disability, age, or any
  other legally protected characteristics. We are proud to be
  an inclusive company with values grounded in equality and
  ethics, where we celebrate, support, and embrace diversity.

  At no time during the hiring process will Smiths Detection,
  nor any of our recruitment partners ever request payment to
  enable participation – including, but not limited to,
  interviews or testing. Avoid fraudulent requests by applying
  jobs directly through our career’s website.
