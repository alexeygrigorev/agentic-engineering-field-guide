title: Staff Software Engineer
company: Parachute Health
location: USA
remote: true
work_type: FULL_TIME
company_size: 300 Employees
description: |
  Parachute Health is transforming post-acute care as the
  leading digital ordering platform for medical equipment and
  supplies. We connect major health systems, health plans, and
  suppliers to help patients get the life-saving products they
  need at home. Since launching, we've connected 300,000+
  clinicians and 3,000+ supplier locations across all 50
  states and helped 15M+ patients. What started as a DME
  ePrescribing tool has become the order management platform
  of choice for home medical equipment.

  Join our team and make a difference in patient care.

  Responsibilities

  - Develop in an agile environment, including TDD and flexible
    pair programming.
  - Contribute to balanced teams, working with product and
    design to shape the application.
  - Direct key technical decisions related to application and
    data model design.
  - Maintain stable and performant application stacks.
  - Consistently deliver quality code that supports business
    goals.
  - Understanding of data structures, TDD, and software
    engineering design patterns and principles.
  - Ability to lead a team in making technical decisions.
  - Participate in an on-call rotation, ensuring timely
    resolution of critical system issues, and contributing to
    the continuous improvement of our system reliability and
    availability.
  - Leverage cutting-edge AI developer tools to accelerate
    development, improve code quality, and automate routine
    tasks.

  Requirements

  - Minimum of 7 years of experience in a production environment
    with Ruby on Rails or other open source languages (e.g.,
    Python, Golang, JavaScript)
  - Staff-level engineering experience, including technical
    leadership, cross-functional collaboration, and mentoring
    engineers
  - Must reside in the U.S.

  Nice to Have

  - Familiar with AWS services (EC2, ECS, S3, RDS, etc).
  - Exposure to healthcare technologies (FHIR or HL7)

  Benefits

  - Medical, Dental, and Vision Coverage: Comprehensive plans
    with options for low-to-no-cost premiums.
  - Employer HSA Contribution: Company-funded contributions to
    your Health Savings Account.
  - 401(k) Retirement Plan
  - Equity Incentive Plan
  - Annual Company-Wide Bonus: Opportunity for up to 15% bonus
    based on company performance.
  - Remote-First Culture: We are remote-first with a dedicated
    NYC office and reimbursement options for co-working
    spaces.
  - Flexible Vacation Policy
  - Summer Fridays: 5 additional Fridays off during the summer
    (separate from PTO).
  - Home Office and Wellness Stipend
  - Monthly Internet Stipend
  - Annual Learning and Development Stipend

  Base Salary Band (based on experience and level)

  $200,000 - $260,000

  To ensure you’re leveled accurately, all new engineers
  participate in a 90-day review. This allows us to calibrate
  your initial interview results with your actual work,
  ensuring your title and compensation align with your impact
  and our engineering rubric.

