description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Experience Engineering
  organisation responsible for building fast, intuitive,
  accessible and premium digital experiences across web and
  mobile. The organisation owns the web & mobile platforms,
  engineering delivery for consumer-facing journeys, shared
  design systems, performance, accessibility and AI-native
  engineering practices that help product teams deliver
  consistent, reusable, high-quality consumer experiences
  across the globe.

  The Senior Software Engineer (Quality) is responsible for
  defining and executing quality engineering strategies,
  building scalable test automation solutions, and ensuring
  exceptional quality, performance, accessibility, and
  reliability across consumer-facing web and mobile digital
  experiences.

  What you will do:

  - Design, develop, and maintain scalable test automation
    frameworks for mobile applications, APIs, and backend
    services.
  - Define and execute quality strategies aligned with product,
    engineering, and business objectives.
  - Build automated test suites covering functional,
    integration, regression, end-to-end, and mobile-specific
    testing scenarios.
  - Collaborate with Product Owners, Designers, and Engineers to
    embed quality throughout the software development
    lifecycle.
  - Implement API, contract, and integration testing to ensure
    service reliability and platform stability.
  - Drive risk-based testing approaches and prioritise quality
    efforts based on consumer impact and technical risk.
  - Validate application behaviour across devices, operating
    system versions, screen sizes, and varying network
    conditions.
  - Ensure mobile applications meet accessibility, usability,
    performance, and reliability standards.
  - Integrate automated testing into CI/CD pipelines and support
    implementation of quality gates.
  - Investigate defects and production issues through root cause
    analysis and collaborate with engineering teams on
    corrective actions.
  - Analyse quality metrics, testing effectiveness, and defect
    trends to continuously improve product quality.
  - Leverage AI-assisted quality engineering practices to
    improve test coverage, defect detection, and engineering
    productivity.
  - Contribute to quality engineering standards, test
    architecture, documentation, and continuous improvement
    initiatives.

  YOUR TALENT

  - 7+ years of experience in Quality Engineering, Software
    Testing, or Test Automation Engineering.
  - Strong hands-on expertise in Playwright, Cypress, Appium or
    similar automation frameworks.
  - Proven experience designing and maintaining scalable
    automation frameworks for web, mobile, API, and end-to-end
    testing.
  - Deep understanding of quality engineering principles, test
    strategy, software development lifecycles, and Agile
    delivery practices.
  - Strong expertise in API testing, contract testing, service-
    layer validation, and automated quality assurance.
  - Experience building automated testing solutions and
    integrating quality gates within CI/CD delivery pipelines.
  - Strong knowledge of accessibility standards (WCAG 2.x),
    accessibility testing tools, and consumer experience
    quality validation.
  - Experience validating mobile applications across devices,
    operating system versions, screen sizes, and network
    conditions using BrowserStack, LambdaTest (TestMu AI), or
    equivalent testing platforms.
  - Expertise in test reporting, quality metrics, defect
    management, root cause analysis, and quality trend
    monitoring.
  - Experience leveraging logging, monitoring, observability,
    and operational telemetry to support quality analysis and
    troubleshooting.
  - Familiarity with AI-assisted test generation, intelligent
    regression testing, and AI-native quality engineering
    practices.
  - Excellent problem-solving, communication, stakeholder
    management, and analytical skills.
  - Experience mentoring engineers and driving quality
    engineering best practices across teams.
  - Experience in Consumer, Retail, eCommerce, or Direct-to-
    Consumer (DTC) digital products is preferred.
  - Experience validating experimentation platforms, feature
    flags, and A/B testing implementations is a plus.
  - Bachelor's degree in Computer Science, Information
    Technology, Engineering, or a related field.

