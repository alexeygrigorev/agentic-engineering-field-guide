description: |
  Overview

  Overview: 

  HealthEdge provides the only modern, enterprise-class
  software platform for healthcare payers. Using the
  patented HealthRules software suite, health plans, health
  insurance companies, and other payers can finally respond to
  new business opportunities and market changes in hours, not
  months or years, while drastically reducing both IT and
  operational costs. Leveraging an investment of over $125
  million, HealthRules is the most modern, scalable, and cost-
  effective technology in the industry. HealthEdge is the only
  choice for payers to survive and thrive in the emerging
  healthcare economy.  

  Our Software Engineers in Test are embedded alongside
  developers, using our latest in-house automation framework
  in Java to create reliable and comprehensive automation
  tests. Teams rely on flexible but standardized processes to
  ensure test coverage, feature quality, and regression
  checks.  

  What you will do: 

  - Develop automation in existing tools
    and frameworks and extend those tools and frameworks as
    necessary.

  - Execute both white- and black-box testing.

  - Create and execute test plans and test cases based on
    requirements and user stories revolving around complex
    data scenarios.

  - Identify current testing gaps, process flaws, suggest and
    implement improvements to increase product quality.

  - Contribute to the relevant DevOps work and help improve the
    CI/CD for the team.

  - Interact with product managers and developers to clarify
    requirements and drive projects to on-time, seamless
    releases.

  - Participate in product Demos.

  You get excited by: 

  - Understanding, testing and debugging complex, data-drive
    applications.

  - Routinely digging into code to help identify the root cause
    of a defect and helping to design a solution.

  What you bring: 

  - 5+ years of professional experience working in a software
    development environment.

  - Ability to write automated test code and tools.

  - Expert in both UI test automation tools (Katalon, Cypress or
    similar) and API testing (using soapUI, RestAssured, or
    similar).

  - Experience with performance testing (using Jmeter, K6 or
    similar).

  - Experience using a broad range of test automation
    frameworks (e.g. Cucumber, Rspec, Fitness, TestNG or
    similar).

  - Proficiency with Object Oriented languages (Java, C#, C++ or
    similar).

  - Proficiency with scripting languages (JavaScript, Python,
    Ruby or similar).

  - Working with relation databases (Oracle, MySQL or similar).

  - Familiarity with SDLC practices of Agile (Lean, Scrum, XP or
    similar).

  - Experience working with Devops tools like Ansible, Jenkins
    and practices like continuous integration and delivery
    pipelines.

  - Strong analytical and problem solving skills

  - Familiarity with enterprise architecture and SOA best
    practices.

  - Strong experience with distributed source code control
    systems, like Git.

  - Excellent verbal and written communication skills.

  - Great team player and collaborates well
    with Onshore/Offshore teams.

  - Working knowledge of Docker a plus.

  - Working knowledge of Linux a plus.

  - Experience working with WebLogic application server a plus.

  - Experience in Healthcare domain a plus.

  - Bachelor's or master's degree in computer science or related
    technical field or equivalent technical experience.

  Geographic Responsibility:  Remote, US

  Type of Employment: Full-time, permanent

  FLSA Classification (USA Only): Exempt

  Work Environment: The physical demands described here are
  representative of those that must be met by an employee to
  successfully perform the essential functions of this job: 

  - The employee is occasionally required to move around the
    office. Specific vision abilities required by this job
    include close vision, color vision, peripheral vision,
    depth perception, and ability to adjust focus.

  - Work across multiple time zones in a hybrid or remote work
    environment.

  - Long periods of time sitting and/or standing in front of a
    computer using video technology.

  - May require travel dependent on company needs.

  The above statements are intended to describe the general
  nature and level of the job being performed by the
  individual(s) assigned to this position. They are not
  intended to be an exhaustive list of all duties,
  responsibilities, and skills required. HealthEdge reserves
  the right to modify, add, or remove duties and to assign
  other duties as necessary. In addition, reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions of this
  position in compliance with the Americans with Disabilities
  Act of 1990.  Candidates may be required to go through a
  pre-employment criminal background check.

  HealthEdge is an equal opportunity employer. We are
  committed to workforce diversity and actively encourage all
  qualified persons to seek employment with us, including, but
  not limited to, racial and ethnic minorities, women,
  veterans and persons with disabilities.

  #LI-Remote

  **The annual US base salary range for this position is
  $96,000 to $103,000. This salary range may cover multiple
  career levels at HealthEdge. Final compensation will
  be determined during the interview process and is based on a
  combination of factors including, but not limited to, your
  skills, experience, qualifications and education.
