description: |
  Courier Health is on a mission to solve one of the biggest
  and most meaningful opportunities in healthcare: reinvent
  how people living with chronic and rare diseases are
  supported.

  We are building the future of patient engagement for life
  sciences companies. Our software is leveraged by biopharma
  companies to support patients in their complex journey from
  diagnosis to initiating and remaining on therapy to achieve
  optimal health outcomes.

  Senior Software Engineer, Frontend

  Courier Health is a New York City-based technology company
  on a mission to improve the patient experience for hundreds
  of millions of people living with a chronic condition or
  rare disease. The company develops and delivers the fastest-
  growing patient experience solution for the life sciences
  industry.

  Companies that choose Courier Health are achieving double-
  digit improvements to patient starts, time-to-start and
  ongoing adherence to life-altering therapies. As host of the
  invite-only Patient Innovators Summit and publisher of The
  State of Patient-Centricity in Biopharma report, Courier
  Health is backed by leading investors, including Oak HC/FT,
  Norwest and Work-Bench.

  Come Build with Us

  We're a NYC-based team that believes culture, craft, and
  customer obsession go hand in hand. We show up for each
  other the same way we show up for the people we serve. We're
  an office-first company that values in-person collaboration
  4 days per week because we believe the best work happens
  when you can collaborate and brainstorm together in the same
  room. If that sounds like your kind of place, we think
  you'll love it here.

  The Opportunity

  Our product is how life sciences teams see and act on what's
  happening with their patients. Every screen either helps
  someone start therapy sooner or gets in the way. We exist to
  get patients faster, better access to life-saving therapies,
  and the interface is where that promise holds up or breaks
  down. This role owns that.

  You'll be a senior frontend voice at a company where the
  frontend is still being written. The architecture, the
  design system, the patterns the rest of the team will follow
  for years - much of it doesn't exist yet. You'll build it,
  and then use it to ship the features customers feel.

  If you've spent your career inheriting someone else's
  component library, this is the other side of that. You set
  the standard, then live with it. The product surface is
  growing fast, the problems are real, and the decisions you
  make in your first six months will still be visible three
  years from now.

  What You'll Build

  A design system the whole team builds on. Shared components,
  patterns, and primitives that make the right thing the easy
  thing. Not a storybook nobody opens - a foundation engineers
  reach for because it's faster than rolling their own. You'll
  define it, evolve it, and hold the line on quality as the
  product grows.

  Frontend architecture that scales with the product. Our user
  base and surface area are both growing quickly. You'll make
  the structural calls - state, data fetching, module
  boundaries, performance — that keep the codebase fast to
  work in at ten times its current size. Get these right early
  and nobody notices. Get them wrong and everyone does.

  Features customers feel, owned end to end. You'll work
  directly with product and design to scope and ship the
  things that matter most, from first sketch to production.
  Strong UX instincts matter here. You'll push back on a flow
  that doesn't work and propose a better one.

  A shipping pipeline engineers trust. Tooling, e2e testing,
  deployment, and observability that give the team confidence
  to ship continuously instead of carefully. You'll use LLM-
  assisted development as a real multiplier, not a novelty,
  and help others do the same. You'll take part in an on-call
  rotation - we build it, we support it. And you'll raise the
  ceiling around you by mentoring engineers and setting the
  bar for craft.

  What Makes You Successful

  - 6+ years of professional software engineering experience
    with React and TypeScript.
  - Proven ownership of a UI design system — you've built and
    evolved a shared component library, not just consumed one.
  - Experience with e2e testing and the tooling that keeps
    quality high as a team scales.
  - Strong UX instincts and a user-centered mindset. You care
    what it feels like to use, not just whether it renders.
  - Comfortable with ambiguity and early-stage ownership. You'd
    rather define the pattern than wait for one.
  - B.S. or higher in computer science or a relevant field, or
    equivalent industry experience.

  Bonus points if you have:

  - Experience with GraphQL, Playwright, and TailwindCSS.
  - Owned the frontend discipline at an early-stage software
    company.
  - Built LLM-integrated features.
  - Worked in health-tech or healthcare.

  Benefits

  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Unlimited Vacation
  - Commuter Benefits
  - Paid parental leave
  - Catered lunch on Fridays
  - Wellness stipend

  Compensation

  The annual salary range for the target level for this role
  is $175,000 – $225,000 + equity + benefits, including
  medical, dental, and vision. Final compensation will be
  determined based on a variety of factors including relevant
  experience, interview performance, and internal equity.

  Courier Health is proud to be an Equal Employment
  Opportunity employer.

  We do not discriminate based upon race, religion, color,
  national origin, gender (including pregnancy, childbirth, or
  related medical conditions), sexual orientation, gender
  identity, gender expression, age, status as a protected
  veteran, status as an individual with a disability, or other
  applicable legally protected characteristics.
