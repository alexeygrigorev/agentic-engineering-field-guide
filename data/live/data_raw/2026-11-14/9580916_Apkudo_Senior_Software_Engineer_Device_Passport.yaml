description: |
  About Job

  The Device Passport team at Apkudo is responsible for
  building and operating systems that give every device a
  trusted, verifiable identity throughout its lifecycle. As a
  Senior Software Engineer, you will own significant technical
  surface area within our Python-based platform, drive
  architectural decisions, mentor engineers, and help us scale
  the Device Passport platform reliably across an expanding
  partner base. Our team is agile, and our days and duties can
  vary, requiring flexibility and adaptability.

  With a focus on correctness, scalability, and long-term
  maintainability, you will work on critical Python-based
  systems that underpin the Device Passport platform. You will
  lead the design and delivery of complex features and partner
  integrations, use Python, PostgreSQL, and related tooling to
  enhance system speed and platform reliability, and
  collaborate across a cross-functional, distributed team.

  Skills & Qualification

  - Deep, hands-on Python expertise as a primary production
    language, including testing practices, packaging,
    performance tuning, and code organization at scale.
  - Strong PostgreSQL experience, including schema design, query
    optimization, and data modeling.
  - AWS Cloud or equivalent cloud platform experience, with a
    focus on scalability and reliability.
  - Experience designing and maintaining RESTful APIs consumed
    by external partners or enterprise customers.
  - Excellent problem-solving instincts, with an eye for
    systemic issues rather than just immediate fixes.
  - Strong communication skills, with the ability to translate
    complexity for both technical peers and non-technical
    stakeholders.
  - Bachelor's degree in Computer Science or related field, or
    relevant experience in software engineering.

  Responsibilities

  - Architect and implement critical Python-based systems that
    underpin the Device Passport platform, with an emphasis on
    correctness, scalability, and long-term maintainability.
  - Lead the design and delivery of complex features and partner
    integrations, from technical scoping through production
    deployment.
  - Use Python, PostgreSQL, and related tooling to enhance
    system speed, preserve API consistency, enforce data
    integrity, and improve platform reliability.
  - Define and uphold engineering standards through rigorous
    code review, technical design documentation, and active
    knowledge-sharing across the team.
  - Collaborate across a cross-functional, distributed team to
    translate partner requirements into durable technical
    solutions.
  - Identify systemic risks, propose trade-offs clearly, and
    drive resolution of ambiguous technical problems with
    limited oversight.
  - Mentor mid-level and junior engineers through pairing,
    design feedback, and constructive code review.
  - Work in an Ubuntu/Linux desktop environment and have
    experience with AWS Cloud or equivalent cloud platform.
