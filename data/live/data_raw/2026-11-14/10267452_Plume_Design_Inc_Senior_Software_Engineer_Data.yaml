description: |
  Life at Plume

  At Plume, we believe that technology isn't about moving
  faster, it's about making life’s moments better. Which is
  why we’ve built the world's first, and only, open and
  hardware-independent service delivery platform for smart
  homes, small businesses, enterprises, and beyond. Our SaaS
  platform uses WiFi, advanced AI, and machine learning to
  create the future of connected spaces—and human
  experiences—at massive scale.

  We now deliver services to over 60 million locations
  globally and have managed over 3 billion devices on our
  platform. We’re expanding rapidly, pioneering a new
  category, and we achieved our Series F funding in just four
  years. Our customers include many of the world's largest
  Internet Service Providers (ISPs) who look to Plume to help
  them evolve their smart home offerings while gleaning
  insights from their own data.

  With a bias for action and a love for being trailblazers,
  the team at Plume embodies a combination of relentless
  curiosity and imaginative innovation. We challenge ourselves
  to think in ways that other companies don't, work to do what
  should be done (rather than what can), and if we can’t do it
  exceptionally well, we don’t do it. It’s how we've assembled
  a team of world-class builders, thinkers, and doers. And
  it’s how we’re reinventing what’s possible every day.

  Role Description:

  Plume's Cloud Platform team is seeking a Senior Software
  Engineer to help shape the future of our industry-leading
  platform. At our scale, every technical decision matters —
  you'll tackle complex distributed systems challenges daily,
  architecting solutions that power millions of connected
  devices worldwide. This is a high-impact, high-visibility
  role where your work will directly influence the trajectory
  of our platform and the engineers around you.

  Responsibilities:

  - Architect and lead the end-to-end delivery of large-scale
    software initiatives across cloud, embedded, front-end
    web/mobile, data, and product teams
  - Set the technical bar — writing clean, well-documented code
    and elevating quality across the team through thoughtful
    code reviews and engineering best practices
  - Drive solutions to complex scalability, integration, and
    architectural challenges unique to our platform's massive
    scale
  - Own the full lifecycle of services in a Kubernetes ecosystem
    — from design and deployment to operations and incident
    response
  - Serve as a technical leader and mentor, helping grow the
    next generation of engineers on the team
  - Participate in rotating on-call responsibilities as part of
    a strong production support culture

  Qualifications:

  - BS, MS, or PhD in Computer Science, Electrical Engineering,
    or a related technical field
  - 4+ years of experience writing and shipping production-
    quality code
  - A strong track record of leading complex, cross-functional
    software projects from conception to delivery
  - Deep proficiency in one or more of: Java, Scala, Node.js, or
    Rust
  - Solid understanding of cloud-native architectures on AWS or
    GCP
  - Strong foundation in algorithms, data structures, and
    object-oriented design
  - Working knowledge of computer networking, operating systems,
    and databases
  - Exceptional communication skills — you can distill complex
    technical concepts for both engineers and non-technical
    stakeholders
  - Experience with Spark, Akka, or NestJS is a strong plus

  Please note that visa sponsorship is not available for this
  role.

  The total compensation package would include an anticipated
  compensation range of $140,000.00 - $160,000.00, plus bonus,
  equity, and benefits.  Benefits include: a 401(k) plan and a
  company match, basic life insurance, plus unparalleled
  health, dental, vision, and other benefits and perks. An
  employee’s base salary and its position within the range may
  depend on several factors, including job-related knowledge,
  education, skills, experience, and other business-related
  considerations. Published ranges are provided in good faith
  at the time of posting.

  About Plume

  As the creator of the only open, hardware-independent,
  cloud-controlled experience platform for ISPs and their
  subscribers, Plume partners with over 400 ISP customers,
  including some of the world’s largest such as Charter,
  Liberty Global, and J:COM.

  Using OpenSync, the most widely supported open-source,
  silicon-to-cloud framework for smart spaces, Plume’s
  software-defined network allows ISPs to decouple their
  service offerings from hardware and rapidly curate and
  deliver new services over a multi-vendor, open-platform
  architecture.

