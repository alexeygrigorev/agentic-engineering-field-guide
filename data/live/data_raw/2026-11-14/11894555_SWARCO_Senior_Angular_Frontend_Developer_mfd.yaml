description: |
  Company Description

  SWARCO is a growing international group with over 5000
  employees on all continents.

  Job Description

  - Design, develop, and maintain modern web applications using
    Angular.
  - Develop and maintain applications based on Micro Frontend
    (MFE) architecture.
  - Design reusable, modular, and maintainable frontend
    components and shared libraries.
  - Integrate RESTful APIs and work with defined API models,
    contracts, and versioning.
  - Collaborate with backend developers and architects on API
    contracts and integration concepts.
  - Implement reliable state management and data-flow concepts.
  - Develop responsive, user-friendly, and accessible
    interfaces.
  - Ensure high code quality through clean code principles,
    coding standards, code reviews, and automated testing.
  - Write and maintain unit, integration, and end-to-end tests.
  - Optimize frontend performance, including application startup
    time, lazy loading, bundle size, and runtime performance.
  - Identify and resolve technical issues, performance
    bottlenecks, and architectural problems.
  - Contribute to frontend architecture, technical standards,
    and technology decisions.
  - Support and mentor other frontend developers and contribute
    to knowledge sharing within the team.
  - Work with Docker and Kubernetes-based development and
    deployment environments.
  - Contribute to and maintain CI/CD pipelines, preferably using
    Jenkins.
  - Work closely with UX/UI, Product, Backend, DevOps, and
    Architecture teams.
  - Participate in Agile development processes such as Scrum or
    Kanban.

  Qualifications

  - Several years of professional experience in Angular and
    TypeScript development.
  - Strong knowledge of modern Angular concepts, including
    components, services, dependency injection, routing,
    forms, guards, interceptors, and standalone components.
  - Strong understanding of TypeScript, JavaScript, HTML, and
    CSS/SCSS.
  - Practical experience with Micro Frontend (MFE)
    architectures, preferably using Module Federation.
  - Strong understanding of frontend architecture,
    modularization, reusable components, shared libraries, and
    dependency management.
  - Experience integrating RESTful APIs and working with API
    models, contracts, DTOs, and versioning.
  - Experience with RxJS, Observables, and asynchronous
    programming.
  - Experience with state management approaches such as Angular
    Signals, NgRx, or comparable solutions.
  - Good understanding of authentication and authorization
    concepts such as OAuth 2.0, OpenID Connect, JWT, and role-
    based access control.
  - Experience with unit, integration, and end-to-end testing.
  - Good understanding of clean code principles, software design
    patterns, and maintainable frontend architecture.
  - Experience with Git, pull requests, code reviews, and modern
    development workflows.
  - Experience with npm and package/dependency management.
  - Good understanding of HTTP, caching, CORS, browser behavior,
    and web application security.
  - Knowledge of frontend performance optimization, lazy
    loading, code splitting, and bundle optimization.
  - Understanding of responsive design and web accessibility.
  - Practical experience with Docker.
  - Good understanding of Kubernetes and container-based
    deployments.
  - Experience with CI/CD pipelines, preferably using Jenkins.
  - Familiarity with Agile development methodologies such as
    Scrum and Kanban.
  - Strong analytical and problem-solving skills with a self-
    driven and proactive mindset.
  - Ability to take technical ownership and make sound
    engineering decisions.
  - Team-oriented with clear and structured communication
    skills.
  - Excellent command of English, both spoken and written.
  - German language skills are a plus but not required.

  Additional Information

  - A strong team spirit and strong cohesion - confirmed by the
    last employee survey. Teamwork takes centre stage with us
  - SWARCO offers a secure job in a stable industry in an
    international group
  - Benefit from customised training opportunities that promote
    your professional developmen
  - Take advantage of 30 days' holiday and special leave, e.g.
    for marriage, for example
  - Take advantage of our hybrid and flexible working
    arrangements, which enable both on-site and mobile
    working, depending on the job
  - Your health is important to us: benefit from (e-)bike
    leasing and a €160/year contribution to health care and
    fitness programmes, e.g. via wellhub
  - Our offer for your personal well-being includes free,
    unbureaucratic external advice for professional, private
    or health-related issues

