description: |
  About Rebuild

  America in the 21st Century has seen an increase in
  frequency and intensity of natural disasters. Communities
  are dramatically changed in the matter of a few hours, and
  its homeowners can be displaced from their homes for years.

  Rebuild is an operating system for restoration contractors
  who specialize in mitigating damage to homes and rebuilding
  them after disasters hit. Disasters can take many forms.
  While catastrophic events likely come to mind immediately,
  smaller-scale damage (such as floods, fires, mold, etc.) can
  also be a nuisance and displace homeowners.

  AI is empowering us to meet this moment. Our initial product
  enables contractors to generate insurance-compliant
  estimates in just a few minutes, allowing them to properly
  get reimbursed for the work they do, get to more jobs, and
  repair more homes. Previously this process could take weeks
  and would result in very low margins for the restorer.

  This is just our first step towards improving the everyday
  efficiency of these contractors. Climate change estimates
  over $210 Billion dollars in damages to property, and
  Rebuild is tackling the massive opportunity to help
  restorers move more efficiently and accurately, starting
  with the estimate.

  We raised our Series A in Q3 2026 from Asymmetric Capital
  Partners with follow-ons from our earlier investors, Gutter
  Capital and 25Madison.

  The Role

  Our ideal engineer thinks about engineering with assistance
  from cutting edge AI and the latest tools.  They identify
  core challenges and craft elegant solutions that scale. In
  this role, you will have the opportunity to touch all parts
  of the platform and develop features that bring immediate
  impact to our users.

  At Rebuild, engineering is a team sport and under the
  leadership of Jack Walters you will have opportunities to
  learn fast, experiment and use cutting edge technologies all
  for the service of our customers. We are a product that
  drives high ROI for our customers and we want to continue to
  build something they can’t live without.

  - Help launch and enhance our next set of key features across
    voice and vision technologies
  - Efficiently complete and deliver tasks and tickets with a
    high standard of quality and consistency
  - Rapidly gain a comprehensive understanding of our codebase
    and demonstrate expertise in specific areas, becoming a
    go-to resource for those domains
  - Provide guidance and support to other engineers on the team,
    collaborating to execute tasks effectively
  - Create best-in-class software development processes so that
    we can build a distinguished product
  - Plan to make an impact where you see opportunities within
    the organization

  Requirements for the position

  - A true full-stack engineer comfortable across the entire
    technical stack: frontend, backend, APIs, databases, cloud
    infrastructure, DevOps
  - Deep problem-solving abilities and systems optimization
    skills
  - Strong JavaScript fundamentals
  - Experience with React and TypeScript
  - Excellent communication skills
  - Mobile experience is a plus

  Work Perks

  - Interesting and challenging work solving a mission-critical
    problem
  - Medical, Vision, and Dental Insurance
  - No limit on token usage for engineers.  Solve bugs, run
    experiments, ship new features in parallel for max speed.
  - Flexible Vacation
  - You will work directly with the founders Alex Toporek and
    John Reim, along with the rest of the engineering
    organization
  - Compensation range for this position is $180-250K base
    annual cash salary plus equity
  - The Rebuild team prides itself on our office culture at 221
    Canal, and we have thoughtful programming, fun events, and
    continuous learning fireside chats on a regular basis

  Equal opportunity employer

  At Rebuild, we aim to foster a workplace free from
  discrimination. We believe that diversity of experience,
  perspectives, and backgrounds leads to a better environment
  for our people and a better product for our clients. Rebuild
  is an equal-opportunity employer and encourages all
  applicants from every background and life experience to
  apply.

  Applicants must be eligible to work in the United States.
  Rebuild does not sponsor work visas or employment
  authorization. Only candidates with the legal right to work
  in the U.S. will be considered for this position.

  Compensation

  The base pay range for this role is $180,000 – $250,000 per
  year.
