description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  Snowflake is about empowering enterprises to achieve their
  full potential, and people too. With a culture that's all in
  on impact, innovation, and collaboration, Snowflake is the
  sweet spot for building big, moving fast, and taking
  technology and careers to the next level.

  We are hiring an EMEA Solution Engineering Manager to lead a
  team of Solution Engineers focused on the Observability
  domain. You will coach a high-performing pre-sales team,
  partner closely with Sales leadership, and help customers
  across EMEA adopt the Snowflake AI Data Cloud to unify and
  analyze their observability data at scale.

  AS AN EMEA SOLUTION ENGINEERING MANAGER AT SNOWFLAKE, YOU
  WILL:

  Team Leadership

  - Recruit, hire, develop, and retain a high-performing team of
    Sales Engineers across the region
  - Set clear performance expectations, conduct regular 1:1s,
    and foster a culture of technical excellence and
    accountability
  - Coach team members on discovery, demo methodology, proof-of-
    concept execution, and competitive positioning
  - Build career development plans and create a pipeline of
    future SE leaders

  Technical Sales Strategy

  - Partner with Regional Sales Directors to develop and execute
    regional go-to-market plans for the observability
    portfolio
  - Drive technical win rates by ensuring impactful discovery,
    compelling demonstrations and successful proof-of-value
    engagements
  - Own the regional presales operating cadence: deal strategy
    sessions, execution alignment and resource allocation

  Customer & Market Engagement

  - Engage directly with strategic and enterprise accounts as an
    executive technical sponsor
  - Lead or support high-stakes customer presentations,
    architecture workshops, and executive briefings
  - Translate customer requirements into product feedback and
    influence the observability product roadmap
  - Stay current on competitive landscape (Datadog, Splunk,
    Dynatrace, Grafana/Elastic, New Relic) and arm the team
    with differentiated positioning

  Cross-Functional Collaboration

  - Work closely with Product, Engineering, Customer Success,
    and Professional Services to ensure seamless handoffs and
    customer outcomes
  - Collaborate with Marketing on field events, webinars, and
    thought leadership content specific to observability
  - Partner with Snowflake core presales teams to identify
    cross-sell and upsell opportunities where observability
    complements existing Snowflake deployments
  - Align with enablement teams to ensure the SE organization is
    trained on new features, integrations, and use cases

  OUR IDEAL EMEA SOLUTION ENGINEERING MANAGER WILL HAVE:

  Required

  - 8+ years of experience in solution engineering, sales
    engineering, or technical pre-sales, with experience in
    data platforms, cloud, or observability technologies.
  - 2+ years of experience leading or mentoring technical teams
    in a pre-sales or customer-facing capacity.
  - Strong understanding of observability concepts, including
    logs, metrics, traces, and the modern monitoring
    landscape.
  - Hands-on experience with cloud data platforms and SQL, with
    the ability to speak credibly to both practitioners and
    executives.
  - Experience selling or implementing technical solutions to
    enterprise customers across EMEA.
  - Excellent communication and stakeholder management skills,
    with fluency in English.
  - Ability to travel across the EMEA region as needed.

  Preferred

  - Direct experience with observability platforms such as
    Datadog, Splunk, Dynatrace, New Relic, Grafana, or
  - Strong, direct experience with modern AI solutions,
    especially the ones related to observability and
    monitoring
  - Background in running proof-of-value / proof-of-concept
    programs at scale

  Competencies

  - Builder Mentality -- You create structure, process, and
    rigor.
  - Technical Credibility -- You can go deep on architecture,
    data pipelines, and observability concepts. Your team and
    your customers respect your technical judgment. You prefer
    learning by doing and lead your team by example.
  - Coaching Orientation -- You develop people. You make every
    SE on your team better through hands-on mentorship and
    structured enablement.
  - Strategic Thinking -- You connect regional activity to
    company-level objectives. You prioritize and allocate
    resources where they have the highest impact.
  - Bias for Action -- You move fast, make decisions with
    incomplete information, and course-correct quickly.

  BONUS POINTS FOR THE FOLLOWING:

  - Familiarity with the Snowflake AI Data Cloud, Snowpark,
    Streamlit, or Cortex.
  - Experience with leading observability tools such as Datadog,
    Splunk, Grafana, or Elastic.
  - Background in migrating large-scale telemetry or machine
    data workloads to a cloud platform.
  - Additional European language skills.[ List ]

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
