  An Associate Embedded Software Engineer helps develop and
  test embedded software that brings intelligence to edge
  devices and systems, connecting the physical and digital
  worlds. Working alongside experienced engineers, technical
  leads, and cross-functional teams, the role contributes to
  delivering robust, scalable, and maintainable software
  solutions.

  Key Qualifications

  - Bachelor’s degree in Computer Engineering, Electronics
    Engineering, Electrical Engineering, and related field.
  - 0-2 years of relevant experience in embedded software
    development
  - New graduates are welcome to apply
  - Strong programming fundamentals and software development
    practices (e.g. C/C++, Rust).

  - Familiarity with version control systems (such as Git) and
    code review processes.
  - Basic understanding of microcontrollers / microprocessors
    and embedded development concepts (e.g., interrupts,
    memory, peripherals).
  - Familiarity with common communication protocols (SPI, I2C,
    UART, CAN)

  - Proactive and passionate in learning and applying tools,
    programming, and platforms to accomplish the assigned
    project.
  - Strong debugging and problem-solving skills.
  - Collaborative with good interpersonal and communication
    skills.

   Key Responsibilities

  - Undergo an on-boarding (covering development processes,
    fundamental concepts, hands-on exercises, and project
    immersion activities).

  - Develop, test, and maintain embedded software components
    under guidance, following coding standards and best
    practices.
  - Collaborate with software and hardware engineers to
    understand requirements and support integration
    activities.
  - Debug and validate software using standard tools and lab
    equipment, with mentoring from senior team members.
  - Learn to profile and optimize code for performance, memory
    usage, and power consumption as needed.
  - Participate in code reviews to learn best practices and
    contribute to reliable, maintainable code.
  - Continuously learn new tools and technologies through
    training, documentation, and team mentorship.
  - Collaborate effectively on shared codebases using version
    control.

  - Complete assigned work on time and with quality.
  - Clearly document and communicate his/her work and learnings
    to ensure quality and team collaboration.

