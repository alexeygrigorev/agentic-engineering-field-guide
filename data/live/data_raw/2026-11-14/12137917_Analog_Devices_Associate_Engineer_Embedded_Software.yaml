  About Analog Devices

  Analog Devices, Inc. (NASDAQ: ADI) is a global semiconductor
  leader that bridges the physical and digital worlds to
  enable breakthroughs at the Intelligent Edge. ADI combines
  analog, digital, AI, and software technologies into
  solutions that combat climate change, reliably connect
  humans and the world, and help drive advancements in
  automation and robotics, mobility, healthcare, energy and
  data centers. With revenue of more than $11 billion in FY25,
  ADI ensures today's innovators stay Ahead of What's
  Possible. Learn more at www.analog.com and on LinkedIn and
