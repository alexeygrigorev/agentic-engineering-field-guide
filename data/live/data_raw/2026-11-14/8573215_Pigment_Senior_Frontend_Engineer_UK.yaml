description: |
  Join Pigment: Transforming Business Planning and Performance
  with AI



  Founded in 2019, Pigment stands out as one of the fastest-
  growing SaaS companies globally, redefining business
  planning and performance with our AI-powered platform. We
  empower organizations across diverse industries, including
  Consumer Packaged Goods, Retail, and Technology, to
  seamlessly integrate data, people, and processes, enabling
  them to plan and adapt rapidly.



  With a vibrant team of over 500 professionals across North
  America and Europe, and offices in New York, Toronto,
  London, Paris, and the Bay Area, Pigment has successfully
  secured nearly $400 million in funding from leading global
  venture capitalists. Our recognition as a Visionary in the
  2024 Gartner® Magic Quadrant™ for Financial Planning
  Software underscores our commitment to excellence, as we
  proudly partner with industry leaders like Unilever, Vinci,
  Kayak, Siemens, and Coca-Cola.



  At Pigment, we champion smart risks, celebrate bold ideas,
  and challenge the status quo—all as a united team. Every
  team member has the opportunity to make a significant impact
  and tackle ambitious challenges. Together, we pursue
  excellence with a collaborative spirit, continuously raising
  the bar to ensure strong performance and a proactive
  approach while fostering an environment of humility.



  If you are passionate about innovation and wish to
  collaborate with some of the brightest minds in the
  industry, we would love to hear from you!



  🚀 The Opportunity:



  Join our Product Community team as a Frontend Software
  Engineer and play a key role in shaping cutting-edge user
  experiences! You'll work on exciting, high-impact projects
  ranging from AI-powered features to rich data visualizations
  while collaborating closely with talented backend engineers
  and product managers.



  Here’s why this is an exciting opportunity:



  ✨ Innovate with AI: Implement intelligent features that
  guide users and streamline complex workflows.

  📊 Visualize Complex Data: Build and optimize advanced data
  visualizations like charts, maps, and real-time dashboards.

  🎨 Shape the Design System: Influence and maintain our
  proprietary design system to deliver consistent, high-
  performance UIs.🔍 Tackle Real Challenges: Solve complex
  problems involving large datasets, real-time updates, and
  system performance.

  📈 Drive the Future: Be part of a forward-thinking team that
  embraces new technologies and continuous learning.



  If you're passionate about building elegant, scalable UIs
  and enjoy collaborating across teams, this is the perfect
  place to grow your career!



  Who You Are:



  We value strong software engineering skills and a proactive
  mindset. You should be able to translate complex functional
  requirements into elegant designs and high-quality code. You
  are also comfortable working across teams to ensure the
  frontend experience aligns with backend capabilities.



  In any case, you have:



  - Strong experience as a software engineer working on
    production systems.

  - Proven expertise in building scalable UIs with React and
    TypeScript.

  - A track record of collaborating with backend engineers to
    shape API design and optimize data consumption.

  - Experience working with design systems, performance
    optimization, and handling large datasets.

  - Strong communication skills and a problem-solving attitude.

  - A good dose of humility and the willingness to grow (no
    matter your seniority!).

  - A fluent level in English (French is not required).



  Your Responsibilities:



  - Build and maintain user interfaces for client-facing
    features, ensuring high-quality and performant UI
    delivery.

  - Collaborate with backend engineers and product managers to
    design, develop, and deliver new features while offering
    technical input on API design and data handling.

  - Implement and enhance AI-driven capabilities that assist
    users with complex workflows (e.g., generating actionable
    insights).

  - Develop advanced data visualizations (charts, maps,
    dashboards) that provide users with real-time, interactive
    insights.

  - Contribute to and maintain our internal design system,
    including custom caching mechanisms and advanced state
    management solutions.

  - Continuously balance delivering new features with ongoing
    maintenance and performance optimization.

  - Proactively identify and resolve issues while ensuring
    continuous delivery and improving technical processes.



  Current Projects You'll Work On:



  - AI Capabilities: Implementing intelligent features that
    guide users and enhance their workflows.

  - Data Visualizations: Building and optimizing rich,
    interactive views to present complex datasets clearly and
    efficiently.

  - Design System: Maintaining and evolving our proprietary
    design system to improve development speed and UI
    consistency.

  -Technology Migration: Evaluating and adopting new
  technologies to keep our platform modern and efficient.



  Technical Challenges:



  - Balancing feature delivery with system maintenance and
    performance improvements.

  - Implementing real-time updates and managing large-scale data
    visualizations.

  - Collaborating across teams to influence API design and
    ensure seamless frontend-backend integration.



  Our Tech Stack:



  - Languages & Frameworks: React (TypeScript)

  - Testing Tools: Vitest (unit testing), Cypress (E2E testing)

  - Build Tools: Vite (for local development and production
    bundling)

  - Custom Solutions: Internal design system, advanced caching
    mechanisms, and proprietary state management built on top
    of open-source technologies.



  About the Team:



  - Mission: Deliver client-facing features that enhance the
    user experience while providing technical leadership and
    guidance on UI decisions.

  - Structure: Product Community is a collaborative group of
    teams (e.g., AI, Views) responsible for different areas of
    the product. Engineers are encouraged to share knowledge
    and can move across squads based on their interests.

  - Size: Approximately 30 engineers across the Product
    division, working in small, focused squads with a mix of
    frontend and backend specialists.

  - Collaboration: Regularly engage with backend engineers,
    product managers, and designers to deliver robust, user-
    centric solutions.



