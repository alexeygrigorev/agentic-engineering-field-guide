description: |
  Patreon is a media and community platform where over 300,000
  creators give their biggest fans access to exclusive work
  and experiences. We offer creators a variety of ways to
  engage with their fans and build a lasting business
  including: paid memberships, free memberships, community
  chats, live video, and selling to fans directly with one-
  time purchases.

  Ultimately our goal is simple: fund the creative class. And
  we're leaders in that space, with:

  - $10 billion+ generated by creators since Patreon's inception
  - 100 million+ free memberships for fans who may not be ready
    to pay just yet, and
  - 25 million+ paid memberships on Patreon today.

  We're continuing to invest heavily in building the best
  creator platform with the best team in the creator economy
  and are looking for a Software Engineer, Backend to support
  our mission.

  This role is based in New York or San Francisco and open to
  those who are able to be in-office 3 days per week on a
  hybrid work model.

  About the Team

  Our team builds the insights and analytics experiences
  creators rely on to understand and grow their business on
  Patreon, along with the infrastructure that keeps those
  numbers accurate and trustworthy. We partner closely with
  Data Engineering, Data Science, Product, and Design to turn
  creator and fan data into features creators use every day.

  About the Role

  As a Backend Engineer on the team, you will build and own
  the services, APIs, and data flows behind creator insights.
  You will bring a strong backend foundation and the curiosity
  to work in the data layer: designing data models, building
  and maintaining pipelines and jobs, and making sure the data
  creators see is correct, fast, and reliable. You will work
  across the stack from ingestion to the product surface, and
  take on work that today depends heavily on Data Engineering.

  In this role you will:

  - Design, build, and operate backend services and APIs that
    serve creator insights at scale.
  - Build and maintain data pipelines, jobs, and models that
    feed insights features, in partnership with Data
    Engineering.
  - Improve data quality, monitoring, and performance so
    creators can trust what they see.
  - Collaborate with product managers, designers, data
    scientists, and engineers to turn ambiguous questions into
    well-scoped solutions.
  - Drive technical design, write well-tested and maintainable
    code, and mentor teammates.

  What you’ll need:

  - 3+ years or 5+ years of experience in backend software
    development, building production services and APIs.
  - Strong programming skills in Python or a similar language,
    with good engineering practices (testing, CI/CD,
    monitoring).
  - Strong SQL skills and experience designing and optimizing
    relational data models (e.g. MySQL, PostgreSQL).
  - Hands-on experience with data-intensive work, such as batch
    or streaming pipelines, scheduled jobs, event logging, or
    serving analytical data (e.g. Airflow, Spark, Kafka /
    Kinesis, dbt, a data lake or warehouse).
  - Care about data accuracy and reliability, including
    idempotency, backfills, and handling late or duplicate
    data.
  - Excellent collaboration and communication skills;
    comfortable partnering with product, design, and data
    teams.
  - Bachelor's degree in Computer Science, Computer Engineering,
    or a related field, or the equivalent.

  Bonus if you have:

  - Experience with data quality, lineage, or observability
    tooling.
  - Experience building customer-facing analytics, reporting, or
    insights features.
  - Familiarity with metric design and data modeling for
    analytics and experimentation.
  - Familiarity with Elastic Search or OLAP

  We hire talented and passionate people from different
  backgrounds because workplace diversity and inclusion is
  critical to our ability to serve creators worldwide. If
  you’re excited about a role but your past experience doesn’t
  match with every bullet point outlined above, we strongly
  encourage you to apply anyway. If you’re a creator at heart,
  are energized by our mission, and share our company values,
  we’d love to hear from you.

  About Patreon

  Patreon powers creators to do what they love and get paid by
  the people who love what they do. Our team is passionate
  about making this mission and our core values come to life
  every day in our work. Through this work, our Patronauts:

  - Put Creators First | They’re the reason we’re here. When
    creators win, we win.
  - Build with Craft | We sign our name to every deliverable,
    just like the creators we serve.
  - Make it Happen | We don’t quit. We learn and deliver.
  - Win Together | We grow as individuals. We win as a team.

  Patreon is proud to be an equal opportunity employer. We
  provide employment opportunities without regard to age,
  race, color, ancestry, national origin, religion,
  disability, sex, gender identity or expression, sexual
  orientation, veteran status, or any other protected class.
  If you need a reasonable accommodation during the interview
  process, please let us know via email at
  accommodations@patreon.

  [US] Patreon offers a competitive benefits package including
  and not limited to salary, equity plans, healthcare,
  flexible time off, company holidays and recharge days,
  commuter benefits, lifestyle stipends, learning and
  development stipends, patronage, parental leave, and 401k
  plan with matching.

  [Portugal] Patreon offers a competitive benefits package
  including and not limited to salary, equity plans,
  healthcare, vacation leave, company holidays and recharge
  days, lifestyle stipends, learning and development stipends,
  patronage, parental leave and sick leave, and pension with
  an employer contribution.

  [UK] Patreon offers a competitive benefits package including
  and not limited to salary, equity plans, vacation leave,
  company holidays and recharge days, patronage, parental
  leave and sick leave, and pension with an employer
  contribution.

  Patreon operates under a hybrid work model, where employees
  based in office locations are expected to come into the
  office three days per week, excluding sick time and paid
  leave. The goal of this policy is to be intentional about
  the in-person time we spend together to strengthen the
  feeling of community at Patreon. Candidates hired into
  remote-eligible roles are not expected to meet the same
  requirements.

  At Patreon, we believe in fair and transparent pay. In
  compliance with New York and California pay transparency
  laws, we are sharing the expected salary range for this
  role.

  The posted salary range is dependent on the location and the
  level. This range may encompass multiple levels within the
  role’s job family. The final offer will be based on
  candidate’s experience, skills, competencies, and geographic
  location, aligning with the appropriate job level within
  Patreon’s leveling framework. For remote employees located
  outside CA and NY, salary may vary based on location and
  local market conditions.

  Patreon reserves the right to modify or update compensation
  and benefits at any time.
