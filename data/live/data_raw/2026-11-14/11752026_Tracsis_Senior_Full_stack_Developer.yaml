description: |
  Senior Full Stack Developer  Remote - UK 3 Month contract
  with possibility of extension. Our talented people are
  creating the technology of the future. From scheduling to
  maintenance to keeping people safe, 2.7 million people are
  helped by our software daily. Technology makes it possible;
  people make it happen and you could be part of that. The
  Tracsis Group has grown rapidly, diversifying into related
  transport technologies, and successfully executing a
  strategy that has seen it make a total of seventeen
  acquisitions. Today Tracsis is a leading provider of
  software, hardware, data analytics/GIS and services for the
  rail, traffic data and wider transport industries. The Group
  has c.550 permanent employees serving its growing customer
  base from offices in the UK, Ireland and the US.

  The Role Tracsis Rail Safety develops software solutions
  that help rail organisations plan, manage and deliver
  safety-critical work across the railway network. Our
  products are used to improve worker safety, streamline
  operational processes, and support compliance within a
  highly regulated industry. As a Senior Software Developer,
  you will play a key role in designing, developing, testing
  and delivering high-quality software solutions that support
  these safety-critical systems. You'll work as part of a
  collaborative engineering team, helping to build scalable,
  secure and reliable applications that make a real-world
  impact across the rail industry. What you will do

  - Design, develop and maintain software applications and
    services.
  - Write clean, efficient and maintainable code.
  - Build and support CI/CD pipelines and deployment processes.
  - Develop robust, secure, scalable and high-performing
    solutions.
  - Troubleshoot defects, incidents and performance issues.
  - Analyse complex problems and deliver effective technical
    solutions.
  - Collaborate with stakeholders to understand requirements and
    provide technical input.
  - Develop and maintain automated unit, integration and system
    tests.
  - Create technical documentation and maintain knowledge-
    sharing resources.
  - Contribute to the ongoing development and improvement of
    Tracsis Rail Safety product

  What you'll bring:

  - Strong commercial experience with PHP and React.
  - Experience with automated testing frameworks such as
    PHPUnit, Playwright, Cypress, Jest or PACT.
  - Code management using Git-based version control systems
    (e.g. GitLab).
  - Experience working within Agile software development teams.
  - Strong understanding of software engineering principles,
    design patterns and best practices.


  Desirable Skills:

  - Java development experience.
  - Experience working with relational and non-relational
    databases.
  - Observability tooling such as New Relic, ELK, Grafana or
    similar.
  - Cloud-native technologies including AWS, Docker, Kubernetes
    and Terraform.
  - Microservices and API design.
  - Experience working within regulated or safety-critical
    environments.

  Our values  We’re guided by four core values that shape how
  we work and collaborate:   Progression – continually
  improving and developing . Integrity – doing the right
  thing, always. Collaboration – working together to achieve
  more. Ownership – taking responsibility and delivering with
  accountability   Benefits:

  - Flexible working hours to support work-life balance
  - 25 days holiday + bank holidays
  - Competitive salary
  - Udemy Licence for learning and development
  - Bupa Medical Health care
  - Life assurance (3x basic salary)
  - Enhanced Parental Leave
  - 2 volunteering days per year
  - Tusker Car Scheme
  - Cycle to work scheme


  Next Steps Our TA team are committed to responding to all
  candidates within a reasonable timeframe. The process:

  - Call with our Talent Acquisition Team
  - Technical interview 60-90 minutes
  - Behavioural-based interview 30-45 minutes

  Our process is designed for us to understand your skills and
  experience and to give you the opportunity to find out more
  about the role, as well as the company.  We are committed to
  building a diverse workforce. Even if you do not tick all
  the boxes, we would still love to hear from you!  If you
  require any adjustments or additional support during the
  application and interview process do not hesitate to get in
  touch.
