description: |
  At Precisely, we're not just building software — we're
  shaping the future of data integrity. As a global leader in
  data quality, data enrichment, and location intelligence,
  Precisely helps thousands of the world's most trusted brands
  make confident decisions with data they can rely on. We're
  an AI-first organization, which means artificial
  intelligence isn't a buzzword here — it's woven into how we
  build products, how we work, and how we think about solving
  complex problems for our customers. When you join Precisely,
  you join a team of curious, driven innovators who believe
  that better data makes the world run better. If you're ready
  to do meaningful work at the intersection of AI and data —
  and help define what's possible — we'd love for you to
  apply!

  This position is 100% remote in the eastern and central US.

  The Company advocates employee career development and
  employee requests to pursue internal employment
  opportunities are encouraged.  Employees are also encouraged
  to discuss their career interests with their Manager at any
  time.  Open communication regarding career advancement
  promotes a positive working environment.  Both internal and
  external candidates are granted equal consideration for
  available employment opportunities. 

  Overview:

  Seeking a Software Engineer who thrives on solving complex
  technical problems in large-scale enterprise applications.
  This role is focused on investigating customer-reported
  issues, performing root-cause analysis, navigating complex
  Java codebases, and developing production-ready code fixes.
  The ideal candidate enjoys debugging challenging problems,
  working directly with customers, and delivering high-quality
  solutions that improve product stability and performance.

  What you will do:

  - Defines, analyzes, and resolves customer escalations in a
    timely & accurate manner.
  - Proven ability to investigate and resolve complex customer
    escalations — with hands-on experience using AI tools
    (Claude Code, Cursor, GitHub Copilot) for log analysis,
    root cause identification, and defect diagnosis
  - Provides periodic updates to customers, co-workers &
    management on the status of outstanding issues.
  - Documents complex issue resolutions for both the customer &
    internal reference as needed.
  - Track record of delivering production code fixes end to end
    — from defect confirmation through AI-assisted patch
    development, automated test generation, code review, and
    release validation.
  - After gaining experience with the product, will have the
    opportunity to contribute with product enhancement
    development work.
  - Assists team members with complex issues to gain experience
    & exposure to more advanced problems.
  - Ability to navigate large, unfamiliar codebases quickly
    using AI tools — assessing defect blast radius and
    identifying the safest fix path with confidence.
  - Contributes, reviews & maintain knowledge base content and
    product documentation as needed
  - Will require periodic after hour / weekend coverage, done on
    a Pager rotational basis.
  - Other duties may be assigned.

  What we are looking for:

  - 2-5 yrs of software engineering.
  - Excellent communication (oral & written), analytical and
    troubleshooting skills.
  - OS experience in one or more areas of Linux, UNIX, and/or
    Windows.
  - Frameworks: Java, J2EE, Servlets, MDB, HTML, JNDI, Jax-RS,
    JMS, Junit, XML, JSON
  - Protocols: AS2/4, HTTP(S), FTP(S), SFTP, Rest/APIs, RNIF,
    EBICS
  - Cloud experience in one or more areas of AWS, Azure, Google,
    IBM, RedHat.
  - CI/CD: Maven, Docker, IBM Cloud, Kubernetes, Jenkins, GitHub
  - Database experience in one or more areas of Oracle and/or
    DB2 and/or MS SQL and/or MySQL
  - Ability to read and code through an Object Oriented
    Language, preferred Java.
  - Experience with JDBC, JDK, JVM stack traces.
  - Strong understanding & experience of executing Static &
    Dynamic scans, fixing vulnerabilities.
  - Aptitude to prioritize and handle multiple issues
    simultaneously.
  - Strong attention to detail and accuracy.
  - Ability to work independently in a fast paced environment.
  - Ability to function and contribute in a team environment.
  - AI Augmented Engineering & Debuggingo    Demonstrated
    experience using AI assisted development tools (e.g.,
    GitHub Copilot, Claude Code, Cursor) to accelerate
    debugging, root cause analysis, code remediation, and test
    generation within enterprise SDLC and security guardrails
  - Spec Driven & Agent Assisted Development Practiceso    Hands
    on experience with spec driven or agent assisted
    development workflows, including translating problem
    statements into clear specifications, guiding AI tools to
    generate targeted code changes, and validating outputs
    through tests and reviews

