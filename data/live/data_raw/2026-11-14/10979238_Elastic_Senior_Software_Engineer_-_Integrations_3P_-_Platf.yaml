description: |
  Elastic, the Search AI Company, enables everyone to find the
  answers they need in real time, using all their data, at
  scale — unleashing the potential of businesses and people.
  The Elastic Search AI Platform, used by more than 50% of the
  Fortune 500, brings together the precision of search and the
  intelligence of AI to enable everyone to accelerate the
  results that matter. By taking advantage of all structured
  and unstructured data — securing and protecting private
  information more effectively — Elastic’s complete, cloud-
  based solutions for search, security, and observability help
  organizations deliver on the promise of AI.

  What is The Role

  We are looking for a Senior Software Engineer to join the
  Integrations Team and help us build how Elastic shows up
  inside the AI ecosystem. AI assistants and agentic tools are
  quickly becoming the place where developers start their
  work, and this role exists to make Elastic work in the tools
  and ecosystems that our users use. We want to be easy to
  find, easy to connect to, and easy to use.

  The Integrations team owns the developer-facing surfaces
  that connect Elastic to the broader ecosystem: language
  clients, CLI, MCP server, third-party integrations, and the
  skills that make Elastic accessible wherever developers
  work. You'll build and maintain these projects, engage
  directly with the developer community, and contribute across
  team and cross-functional initiatives.

  This is fast-moving territory. We want someone who enjoys an
  ambiguous, quick-shifting space, who forms opinions about
  what should be built and not only how, and who is
  comfortable working closely with our product teams and
  external partners.

  Prior experience with the Elastic product suite is not
  essential, but is beneficial.

  What You Will Be Doing

  - You'll build and evolve the Elastic MCP server and the
    infrastructure behind it, working primarily in Go.
  - You'll build the platform for universal agent skills: the
    portable format, the authoring and publishing tooling, and
    the linting that lets any team at Elastic ship a skill
    that runs across every agent.
  - You'll help set the correctness bar, making sure the skills
    and tools we ship are backed by evals rather than assumed
    to work.
  - You'll design and deliver integrations that make Elastic
    available inside third-party AI ecosystems. For that
    you’ll work closely with our product team and third-party
    partners to shape and land those integrations.
  - You'll contribute to our Elastic CLI to enhance the
    efficiency of developers and their agents.
  - You'll be developing, maintaining, and supporting libraries,
    tools, and integrations related to the Elastic Stack,
    working in a mixture of languages including Go and Rust.
  - You'll bring product thinking to the team, holding and
    defending opinions on what we should build and why,
    informed by the ecosystem around us.

  What You Bring

  - 8+ years of software engineering experience working on
    backend systems, services or libraries.
  - Proficiency with AI/ML frameworks and a working
    understanding of LLMs, agents, agent skills and protocols
    such as MCP. Interest in proving correctness through
    evaluation rather than assuming it.
  - Significant recent working experience of Go and (ideally)
    other languages.
  - Knowledge of client-server networking, HTTP, and RESTful
    APIs.
  - Comfort reading and contributing to codebases in languages
    you don't own, and no fear of picking up an unfamiliar
    one.
  - Knowledge of industry best practices in software
    engineering.
  - Product thinking: an interest in the wider ecosystem and
    strong opinions on what is worth building.
  - A strong focus on usability and developer experience.
  - Comfort with context-switching and with a space that changes
    quickly.
  - A genuine interest in technology and an active interest in
    exploring multiple programming languages.
  - Excellent communication, collaboration, and interpersonal
    skills, including in front of customers and external
    partners.
  - A willingness to work as part of a remote, globally
    distributed team.
  - Clear thinking, self-motivation, and the ability to learn
    and work independently.

  Bonus Points

  - Experience building or operating infrastructure, and an
    interest in telemetry and observability (nice to have)
  - A connection to technical communities through open source
    projects, blogs or talks (nice to have)
  - Experience working with third-party or partner engineering
    teams (nice to have)
  - Prior experience of Elastic products (nice to have)

  Additional Information - We Take Care of Our People

  As a distributed company, diversity drives our identity.
  Whether you’re looking to launch a new career or grow an
  existing one, Elastic is the type of company where you can
  balance great work with great life. Your age is only a
  number. It doesn’t matter if you’re just out of college or
  your children are; we need you for what you can do.

  We strive to have parity of benefits across regions and
  while regulations differ from place to place, we believe
  taking care of our people is the right thing to do.

  - Competitive pay based on the work you do here and not your
    previous salary
  - Health coverage for you and your family in many locations
  - Ability to craft your calendar with flexible locations and
    schedules for many roles
  - Generous number of vacation days each year
  - Increase your impact - We match up to $2000 (or local
    currency equivalent) for financial donations and service
  - Up to 40 hours each year to use toward volunteer projects
    you love
  - Embracing parenthood with minimum of 16 weeks of parental
    leave

