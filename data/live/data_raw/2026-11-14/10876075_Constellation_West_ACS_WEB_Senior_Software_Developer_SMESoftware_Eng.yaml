description: |
  SENIOR SOFTWARE DEVELOPER SME/SOFTWARE ENGINEER (Remote)

  REQUIRED SKILLS:

  - Security Clearance: Active Public Trust/Minimum Background
    Investigation (MBI) clearance required for this position
    Required Skills:
    - Minimum 15 years of software/web
      development/engineering/optimization using Object
      Oriented Programming, specifically full-stack J2EE
      (Java17/21 required), JavaScript (Angular JS, React,
      Preact), JEE, Spring Boot/Join Faces, PrimeFaces,
      JQuery, backup Java Beans, and JSF, or equivalent.
    - Hands-on experience either transitioning to or working with
      Single Page Applications (SPA).
    - Experience with software development in environments
      utilizing ECLIPSE, Visual Studio, JBoss/RedHat Linux,
      zLinux, Tomcat, HTML5, UML, .NET, Visual Basic, IBM
      Liberty, and Rocket Verastream Bridge Integrator (VBI),
      open source iText API, or equivalent.
    - Hands-on experience working with DevOps, CI/CD Pipelines,
      GitHub Actions, Incident Tracking/Management, and
      Enterprise Container Platform (ECP) containers (or
      equivalent) is also required.
    - Hands-on experience conducting unit testing, peer reviews,
      code check-in/-out procedures, requirements analysis,
      assessing/document level of effort (LOE), creating
      screen mockups via tools (i.e., HTML rendering), defect
      identification/resolution, assisting with
      troubleshooting development/production server problems,
      networking and environment configuration.
    - Hands-on experience drafting system technical documents
      (e.g., system design specifications, software user
      guides, Visio diagrams, process documentation, etc.).
    - Must be able to quickly integrate into teams and become
      intimately familiar with custom-built software
      applications using common open-source components (this
      is critical).
  - Desired Skills: Hands-on experience using tools/guidance, or
    equivalent, such as: GitHub Repository, JIRA, ECLIPSE
    (2022 or later), Service Now, Selenium test script
    development, IRS Enterprise Life Cycle (ELC), OneSDLC,
    IRM/IRS Security regulations, IRM 2.5 System Development,
    and 508 Compliance. Experience with networking
    fundamentals, development environments, and change control
    processes. Familiarity with web interfaces to mainframes
    is a plus. Education: Bachelor of Science (Masters
    preferred) in Computer Science or related discipline with
    a primary focus on software development/engineering is
    required. Software development, security, networking,
    system administration certifications a plus.Job
    Description and Tasks: Serve as the Senior Software
    Development Subject Matter Expert (SME) overseeing
    software development operations, providing guidance as
    needed, while also performing Operation and Maintenance
    (O&M) software development activities. Work with the
    Project Manager, Technical Lead, Cyber Security SME, and
    QA Tester to execute developer team day-to-day activities,
    prioritize work, schedule/host developer technical
    meetings, address issues/propose solutions, provide
    technical advice, optimize processes, develop work
    proposals for review/approval, keep Project Manager/Task
    Lead informed, and develop software code changes/code
    updates as a productive member of software development
    team.

  ABOUT US:

  Constellation West is an award-winning company that delivers
  Information Technology (IT) engineering services and
  solutions and non-IT subject matter expertise worldwide.
  Established in 1997, Constellation West is an industry
  leader, partnering with key organizations across the
  Department of Defense and civilian agencies.

