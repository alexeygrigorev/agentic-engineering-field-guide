description: |
  Supporting Cast seeks a passionate, creative developer with
  PHP and agentic engineering experience to expand on
  Supporting Cast’s podcast subscription platform. As a key
  member of our team, you'll be helping independent creators,
  podcast publishers, and media companies improve their
  financial sustainability and better satisfy their fans.
  You'll be joining a small development team and will be in a
  position to influence our tech stack and our evolving
  product. Working here provides the dynamic excitement of a
  startup, and the stability and competitive compensation of
  an established employer.

  We will consider candidates from anywhere in the United
  States, provided you can largely work East Coast hours—the
  role is fully remote.

  About the Position

  Opportunities:

  - Learn a lot about the podcast industry and the rapidly
    growing paid subscription market
  - Scale an application as we onboard clients with tens of
    thousands of members and evaluate new technologies
  - Develop and maintain user- and administrator-facing features
    in our existing stack
  - Help us leverage A.I. tools to accelerate new feature
    development and improve code quality and security
  - Build and maintain implementations for other websites,
    including embeds and third-party integrations

  Our Current Tech Stack:

  - App: PHP/Laravel, Nginx, Varnish, Redis, PostgreSQL, Docker,
    React
  - Dev ops: AWS, Fastly CDN
  - Key business vendors and partners: Stripe, Spotify,
    Wordpress
  - Key software vendors: Google Cloud Computing, AWS
    (SES/SNS/SMS), Anthropic
  - Repo: GitHub
  - Project management: Agile-oriented. Notion, Google Docs,
    Slack.

  Requirements

  WHY JOIN SUPPORTING CAST?

  You’ll help make workplaces more connected, informed, and
  interesting via the magic of podcasting. Supporting Cast
  built one of podcasting’s first and most successful
  subscription management platforms for top public podcasters
  before expanding to improve employee experiences at some of
  the most interesting companies in the world.

  This is a great opportunity if you want ownership of your
  work, a taste of startup life, and the responsibility of
  setting the bar high for a new team. You’ll also enjoy
  competitive salary and benefits in a remote-first, mission-
  driven, and family-friendly team.

  About Supporting Cast:

  Supporting Cast is a podcast monetization platform that
  helps top publishers and creators offer premium subscription
  content directly to listeners. Our clients include leading
  podcast publishers like NPR, SiriusXM, and NBC, along with
  major independent shows. A proponent of the open ecosystem,
  we make it seamless for subscribers to access premium
  podcast content in their favorite app—no new app to
  download—and give publishers the tools to grow and manage
  their paying audience with flexible integrations, analytics,
  and payments.

  We’re a small, fully remote company with a strong belief in
  the future of audio. We’re looking for someone who is
  thoughtful and detail-oriented to help us bring the magic of
  podcasting into more corporate settings.

  Supporting Cast is an affiliate of the Graham Holdings
  Company (NYSE:GHC). GHC is a diversified holding company
  whose operations include educational services; home health
  and hospice care; television broadcasting, online, print,
  and local TV news; automotive dealerships; manufacturing;
  hospitality; and consumer internet companies.
