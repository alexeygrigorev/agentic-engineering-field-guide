description: |
  TeamBuilder is a rapidly growing healthcare SaaS company on
  a mission to transform healthcare with our innovative
  technology. We believe in empowering our customers through
  inventive solutions and a commitment to excellence. Our
  young, rapidly growing team is looking for passionate
  professionals who thrive in a dynamic, innovative, and
  collaborative environment.

  We are seeking an experienced Software Quality Engineer to
  help drive quality across a growing SaaS platform. This role
  combines hands-on manual testing, test automation, API
  validation, data reconciliation, quality process design, and
  cross-functional collaboration. The successful candidate
  will be comfortable working directly with Product Managers,
  Developers, Customer Success teams, and leadership to ensure
  software quality throughout the SDLC. This is a senior
  individual contributor role for someone who enjoys building
  scalable quality systems rather than simply executing test
  cases. ***This role is FULLY REMOTE, though you MUST be
  available to work EST hours, and be legally authorized to
  work in the United States. Core Responsibilities Quality
  Strategy  Develop and continuously improve QA processes 
  Establish testing standards and best practices  Create
  risk-based testing approaches  Drive quality metrics and
  reporting  Improve release confidence and production
  stability Manual Testing  Create detailed test plans and
  test cases  Perform exploratory testing  Execute
  regression testing  Validate complex business workflows 
  Reproduce and document defects clearly Test Automation 
  Design and implement automated testing frameworks  Build
  and maintain UI automation suites  Build and maintain API
  automation suites  Integrate automated testing into CI/CD
  pipelines  Monitor and improve automation coverage and
  reliability API Testing  Test REST APIs using tools such as
  Postman  Validate authentication, authorization, and error
  handling  Create automated API regression suites  Analyze
  API logs and payloads Data Validation & Reconciliation 
  Validate application data against underlying databases 
  Perform data reconciliation between systems  Investigate
  production issues using SQL  Verify integrations and ETL
  processes  Build repeatable validation processes
  Documentation  Create and maintain: o Test Plans o QA
  Processes o Release Validation Checklists o Regression
  Suites o Status Reports o Defect Documentation Collaboration
   Partner directly with developers during feature delivery 
  Participate in design and requirements reviews  Drive bug
  triage discussions  Communicate quality risks clearly to
  stakeholders Required Experience Must Have  5+ years QA
  experience within SaaS products  Demonstrated experience
  owning quality for complex web applications  Strong manual
  testing experience  Strong test automation experience 
  Experience testing APIs  Strong SQL skills  Experience
  working in Agile environments  Excellent written and verbal
  communication skills Automation Tools Experience with one or
  more:  Playwright  Cypress  Selenium  TestCafe API Tools
  Experience with:  Postman  Swagger/OpenAPI  REST APIs
  Data Validation Experience with:  SQL Server  PostgreSQL 
  MySQL Ability to:  Write queries  Compare datasets 
  Validate business calculations  Investigate data
  discrepancies Preferred Experience AI-Enabled QA Experience
  using AI tools to improve quality processes: Examples:  AI-
  assisted test case generation  AI-assisted automation
  creation  AI-assisted bug analysis  AI-assisted regression
  identification  AI-assisted documentation generation  AI-
  assisted exploratory testing SaaS Experience Experience
  with:  B2B SaaS platforms  Enterprise software  Multi-
  tenant applications  Authentication / SSO systems  Complex
  business workflows

  Compensation, Benefits & Perks

  - Competitive salary plus annual performance bonus opportunity
  - Equity opportunities for eligible roles
  - Robust Medical, Dental, and Vision coverage options with 70%
    company contribution toward medical premiums (effective
    1st of the month following your start date)
  - Health Savings Account (HSA) eligible plan options
  - 401(k) with 3% company match
  - 15 days of PTO plus company holidays
  - Fully remote work environment (minimal travel required)
  - Employee Assistance Program (EAP)
  - Additional Perks such as Tech & wellness reimbursements,
    home-office set-up, annual company off-site, and a
    passionate and balanced work environment.
