description: |
  Grafana Labs is the company behind Grafana Cloud, the fully
  managed observability platform trusted by more than 10,000
  organizations to ensure reliability, resolve incidents
  faster, and optimize telemetry at scale. Built on open
  source and open standards and designed for interoperability
  across any stack, Grafana Cloud brings AI to observability
  and observability to AI, giving teams (and their agents)
  unified visibility so they can see, understand, and act on
  all their disparate data, wherever it lives, and move at the
  speed of their ambitions. Customers, including Anthropic,
  Bloomberg, NVIDIA, Microsoft, and Salesforce, rely on
  Grafana Labs. We are a 100% remote company with team members
  across 40+ countries, backed by leading investors including
  Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue,
  J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
  grafana.com and follow us on LinkedIn and X.

  We’re scaling fast and staying true to what makes us
  different: an open-source legacy, a global collaborative
  culture, and a passion for meaningful work. Our team thrives
  in an innovation-driven environment where transparency,
  autonomy, and trust fuel everything we do.

  You may not meet every requirement, and that’s okay. If this
  role excites you, we’d love you to raise your hand for what
  could be a truly career-defining opportunity.

  This is a full-time remote opportunity. We are considering
  candidates based in the US and Canada only, within the
  Eastern or Central time zones.

  The Opportunity:

  As a Senior Full-Stack Engineer on the Grafana Catalog team,
  you will help grow the Grafana plugin ecosystem. Plugins are
  how Grafana connects to almost any data source, panel type
  or app, and the catalog has more than 300 of them from
  Grafana Labs, commercial partners and the open source
  community.

  We own the full plugin lifecycle. Developers build plugins
  with our tooling, publish them to the catalog, and users
  discover, install and update them in Grafana and Grafana
  Cloud. We are also building the Grafana Marketplace, which
  lets partners and independent developers sell their plugins
  to Grafana users. It is in pilot today and you will help us
  take it from there.

  What You’ll Be Doing:

  Some of the things we own:

  - The Grafana Marketplace: paid plugins, publisher onboarding,
    and how customers buy and get access to them
  - The plugin catalog in grafana.com and inside Grafana, where
    users search, compare and discover plugins
  - Plugin installation and management in Grafana and Grafana
    Cloud
  - Plugin delivery: publishing, signing, validation and the CDN
    that serves plugins to every Grafana Cloud instance
  - Plugin review: every plugin published to the catalog goes
    through our review process before it reaches users
  - Developer tooling and developer portal that helps develop
    the plugins

  A typical “day in the life” could include:

  - Building new Marketplace features across the Grafana
    frontend, our Go services and grafana.com
  - Improving how users find and install plugins, for both
    humans and agents like Grafana Assistant
  - Making it easier and faster for developers to build, test
    and publish plugins
  - Automating and improving the review process that every
    published plugin goes through
  - Supporting the operations and reliability of plugin installs
    and delivery in Grafana Cloud
  - Talking to plugin developers and partners and turning their
    feedback into roadmap items
  - Coming up with suggestions for process improvements
  - Working closely with the rest of the Grafana Division

  We invest heavily in developer productivity. You can use
  modern AI coding assistants as part of your daily workflow
  (your choice of tools, within security guidelines), backed
  by a company-funded usage budget so you can iterate quickly
  without unnecessary friction. We encourage pragmatic AI-
  assisted development: faster prototyping, test generation,
  refactors, documentation, and incident follow-ups—always
  with strong code review and quality standards. You'll also
  have access to the latest frontier models from OpenAI,
  Anthropic, and Google.

  What Makes You a Great Fit:

  - You know how to transform ideas into working code, you are
    able to design a solution, get feedback and deliver large
    projects.
  - You are a self-driven individual who understands the power
    of feedback loops in making roadmap decisions and driving
    our product forward.
  - You are a motivated self starter with a bias towards action,
    and willing to take on any challenge
  - You are customer focused. We build everything with our users
    in mind. You have a passion for creating intuitive
    products that fit customers’ needs.
  - You are an excellent communicator and you enjoy
    collaboration
  - You are comfortable working in a remote-first company

  Requirements:

  - Solid experience with Golang & Typescript
  - Experience with React and building user-facing web
    applications
  - Experience with Kubernetes & microservices
  - Experience writing clean, robust, and performant software
    that is easily maintained by others
  - Experience participating in an on-call rotation and
    performing operations/SRE tasks

  Bonus Points For:

  - You have built or published a Grafana plugin
  - You have worked on a marketplace, app store or package
    registry, or on billing and licensing
  - You have built developer tooling such as CLIs, SDKs or CI
    pipelines used by other engineers
  - You have strong experience working with a Product Manager or
    external stakeholders

  In US, the OTE (On-Target Earnings)/Base compensation range
  for this role is USD $167,143 - $200,572. Actual
  compensation may vary based on level, experience, and
  skillset as assessed throughout the interview process. All
  of our roles include Restricted Stock Units (RSUs), giving
  every team member ownership in Grafana Labs' success. We
  believe in shared outcomes—RSUs help us stay aligned and
  invested as we scale globally.

  *Compensation ranges are country specific. If you are
  applying for this role from a different location than listed
  above, your recruiter will discuss your specific market’s
  defined pay range & benefits at the beginning of the
  process.

  Why You’ll Thrive at Grafana Labs:

  - 100% Remote, Global Culture - As a remote-only company, we
    bring together talent from around the world, united by a
    culture of collaboration and shared purpose.
  - Scaling Organization – Tackle meaningful work in a high-
    growth, ever-evolving environment.
  - Transparent Communication – Expect open decision-making and
    regular company-wide updates.
  - Innovation-Driven – Autonomy and support to ship great work
    and try new things.
  - Open Source Roots – Built on community-driven values that
    shape how we work.
  - Empowered Teams – High trust, low ego culture that values
    outcomes over optics.
  - Career Growth Pathways – Defined opportunities to grow and
    develop your career.
  - Approachable Leadership – Transparent execs who are
    involved, visible, and human.
  - Passionate People – Join a team of smart, supportive folks
    who care deeply about what they do.
  - In-Person onboarding - We want you to thrive from day 1 with
    your fellow new ‘Grafanistas’ to learn all about what we
    do and how we do it.
  - Balance is Key - We operate a global annual leave policy of
    30 days per annum. 3 days of your annual leave entitlement
    are reserved for Grafana Shutdown Days to allow the team
    to really disconnect. *We will comply with local
    legislation where applicable.

  Equal Opportunity Employer: Grafana Labs is an equal
  opportunities employer. We welcome applications from
  everyone regardless of race, colour, nationality, origin,
  caste, sex, gender reassignment identity or expression,
  sexual orientation, age, religion or belief, disability,
  veteran status, genetic information, pregnancy, maternity,
  marital, family or carer status, or any other characteristic
  which is protected by local law. We believe that equality
  and diversity build a strong organisation, and we work hard
  to ensure that is the foundation of our organisation as we
  grow.

  Grafana Labs may utilize AI tools in its recruitment process
  to assist in matching information provided in CVs to job
  postings. The recruitment team will continue to review
  inbound CVs manually to identify alignment with current
  openings.

