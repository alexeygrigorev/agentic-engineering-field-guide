description: |
  Senior Software Engineer

  Latitude is an early‑stage payments fintech building modern
  infrastructure for global money movement. We help businesses
  move value instantly, securely, and with full compliance-
  leveraging blockchain rails while delivering a seamless,
  enterprise‑grade experience.

  Our team has built and scaled payments and financial
  infrastructure at Uber, Coinbase, Stripe, Amazon, and
  Facebook-bringing deep experience across fintech,
  marketplaces, and global‑scale systems. In January 2025, we
  raised an $8M seed round led by NEA, with participation from
  Lightspeed Faction, Coinbase Ventures, Paxos, Bitso, Solana
  Ventures, and others. We've since raised a $35M Series A led
  by Oak HC/FT, with participation from existing investors New
  Enterprise Associates (NEA), Coinbase, and Faction VC, and
  new investors Wilson Sonsini Goodrich & Rosati and OpenFX
  -bringing our total raised to $43M.

  We're looking for experienced software engineers who are
  excited to build critical financial infrastructure at an
  early-stage company with significant technical ownership and
  impact.

  The Role

  As a Senior Software Engineer, you'll help design and build
  the systems powering the next generation of global payments.
  You'll work closely with our engineering leadership to solve
  complex technical challenges, influence architectural
  decisions, and ship products that serve real customers from
  day one.

  You'll have the opportunity to:

  - Design and build scalable, production-grade backend services
    and distributed systems
  - Develop core platform components including payment
    orchestration, ledgering, workflow engines, partner
    integrations, and public APIs
  - Influence system architecture, engineering standards, and
    technical direction as the platform scales
  - Own projects end-to-end, from technical design through
    deployment and long-term operation
  - Collaborate closely with engineering and product to solve
    complex infrastructure and financial systems challenges
  - Mentor teammates, raise the engineering bar, and contribute
    to a collaborative, high-performing culture

  What We're Looking ForRequired

  - 5+ years of professional software engineering experience
    building and operating production systems
  - Experience working in high-growth startups or fast-paced
    environments with significant ownership
  - Strong backend engineering fundamentals and experience
    building reliable, scalable distributed systems
  - Proven ability to independently drive complex technical
    initiatives and make thoughtful architectural decisions
  - Experience in one or more of the following areas:
    - Infrastructure / DevOps
    - Payments or financial systems
    - Blockchain / crypto infrastructure
  - Product-minded approach with a willingness to work across
    the stack when needed
  - Strong communication and collaboration skills
  - Authorization to work in the United States

  Our backend is primarily written in Ruby, with TypeScript
  powering our frontend. Our infrastructure runs on AWS using
  Terraform and Kubernetes. Experience with these technologies
  is a plus, but we value strong engineering fundamentals and
  the ability to learn quickly over expertise in any
  particular language or framework. We’re looking for
  engineers with strong character and empathy - we're building
  a collaborative, kind, high-achieving culture.

  Preferred

  - Experience designing APIs, distributed systems, or event-
    driven architectures
  - Experience with modern cloud infrastructure and
    infrastructure-as-code
  - Background in fintech, payments, banking, digital assets, or
    other regulated industries
  - Experience helping shape engineering practices, technical
    strategy, or scaling engineering organizations
  - Familiarity with AI-assisted development workflows and
    modern engineering tooling

  Why Latitude?

  Rare Opportunity: We're backed by top investors (including
  NEA and Lightspeed Faction), finding significant traction,
  and taking on a massive market opportunity in international
  payments. This is a chance to join a rocketship early and
  help shape the future of global money movement.

  Impact: You'll be building critical infrastructure that
  makes global payments faster and more accessible for
  businesses and individuals worldwide.

  Strong Team: Join a high-caliber team that combines deep
  fintech expertise with startup execution experience. Our
  team has worked on the stuff that matters at companies like
  Stripe, Coinbase, Uber, and Facebook.

  Opportunity to join early: As an early team member at a
  growing startup, you'll have significant influence over our
  technical direction and the opportunity to grow with the
  company.

  Compensation

  The base salary range for this role is $230,000–$250,000,
  commensurate with experience, plus meaningful early-stage
  equity.

  Benefits

  At Latitude, we believe success starts with our
  people—healthy, inspired, and empowered to thrive both in
  and outside of work.

  We offer:

  - Comprehensive medical, dental, vision, and life insurance
    with generous company contributions
  - Meaningful early-stage equity and a 401(k)
  - Unlimited PTO
  - 10 paid federal holidays
  - Flexible remote work within the United States

  Latitude is an equal opportunity employer committed to
  building an inclusive workplace. We consider all qualified
  applicants without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, age,
  disability, genetic information, veteran status, or any
  other protected characteristic. Applicants must be
  authorized to work in the United States.
