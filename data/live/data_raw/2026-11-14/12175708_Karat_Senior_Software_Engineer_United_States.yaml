description: |
  We're Karat, the talent elevation partner for the Human + AI
  Era.

  Karat helps technical leaders transform their workforce for
  the Human+AI era. Trusted by some of the world's largest
  payment companies, tier 1 banks, and global tech
  enterprises, Karat evaluates and benchmarks engineering
  talent rigorously, consistently, and at scale. Our system
  turns those evaluations into insights that help leaders
  build a more capable and competitive workforce. Karat
  interviews combine best-in-class methodologies with live,
  AI-native scenarios, delivered by experienced Interview
  Engineers. With intelligence from more than 600,000
  technical evaluations, Karat gives leaders a clear view of
  workforce capability, a competitive benchmark, and
  confidence that their standards are being met.

  Come join our Engineering team

  Our Software Engineering team is dedicated to building the
  world’s most predictive, inclusive, and fair interviewing
  products for our clients and technical candidates alike.

  What you will do

  As a Senior Software Engineer at Karat, you’ll build full-
  stack product features that directly improve how engineers
  are interviewed and how engineering organizations operate.
  You'll build robust, scalable full-stack solutions while
  helping to implement AI-enhanced features that transform
  technical talent assessment. You'll collaborate closely with
  product and engineering leadership to execute on our vision
  of more predictive, inclusive, and fair technical
  interviewing.

  - Design and develop sophisticated full-stack systems that
    power our next-generation interview platform,
    incorporating AI capabilities where they add the most
    value.
  - Build scalable, production-ready infrastructure and services
    that maintain high standards of performance, reliability,
    and security.
  - Create intuitive interfaces and APIs that serve
    interviewers, candidates, and hiring teams effectively.
  - Collaborate with cross-functional teams (product managers,
    designers, data scientists) to translate complex
    requirements into elegant technical solutions.
  - Contribute to architecture decisions that balance innovation
    with reliability, ensuring our platform evolves while
    maintaining enterprise-grade stability.
  - Serve as a technical leader by sharing expertise across
    engineering teams, promoting best practices, and elevating
    the overall technical capability of the organization.
  - Balance short-term deliverables with long-term technical
    health, addressing both customer-facing features and
    foundational infrastructure.

  The experience you will bring

  - 7+ years developing and launching web applications/systems
    into production environments
  - Experience with or exposure to AI/ML technologies and
    understanding how they can enhance assessment and
    interviewing products
  - Experience integrating LLM APIs, familiarity with knowledge-
    enhanced language model pipelines, and ability to evaluate
    and improve AI feature performance
  - Strong analytical and problem-solving skills with the
    ability to balance technical tradeoffs
  - Strong proficiency in Ruby, Python, TypeScript/JavaScript,
    or similar languages with experience in modern web
    frameworks and REST and GraphQL API design
  - Experience with system architecture, database design, cloud
    infrastructure, and deployment technologies (AWS, GCP, or
    Azure)
  - Knowledge of software engineering best practices including
    CI/CD, testing strategies, and performance optimization
  - Ability to work effectively in cross-functional teams with
    excellent communication skills; can translate complex
    technical concepts for diverse stakeholders
  - Demonstrated ability to provide technical leadership,
    including mentoring teammates and driving technical
    decisions
  - Interest in technical interviewing, talent assessment, or
    educational technology is highly valued

  This position is only available to candidates residing in
  the following U.S. states: FL, IL, MA, MO, OR, TX, and WA.
  While our team operates 100% remotely, we are currently
  limiting hiring to these specific locations. Applications
  from other states will not be considered at this time.

  Immigration sponsorship is not available.

  Compensation Varies by Geographic Location

  At Karat, salary ranges for each U.S.-based position are
  determined by the employee's work location. We structure our
  compensation into geographic tiers based on market data and
  regional economic factors.

  Please refer to our geographic classification document to
  view which tier applies to your location. If your area isn't
  included in our classification system, please connect with
  your Recruiter for specific details. These geographic
  classifications may be adjusted periodically.

  Base Salary (GeoLo 2)

  $169,755.30—$191,655 USD

  Base Salary (GeoLo 3)

  $150,893.60—$170,360 USD

  Base Salary (GeoLo 4)

  $132,031.90—$149,065 USD

  Additional Information

  By applying for a position, you consent to the processing of
  your personal data in accordance with Karat’s Employee and
  Contractor Privacy Notice found here.

  Statement of Inclusivity

  In keeping with our beliefs and goals, no employee or
  applicant will face discrimination or harassment based on:
  race, color, ancestry, national origin, religion, age,
  gender, marital/domestic partner status, sexual orientation,
  gender identity or expression, disability status, or veteran
  status. Above and beyond discrimination and harassment based
  on “protected categories,” we also strive to prevent other
  subtler forms of inappropriate behavior (i.e., stereotyping)
  from ever gaining a foothold in our office. Whether blatant
  or hidden, barriers to success have no place at Karat.

  We value a diverse workforce: people of color, womxn, and
  LGBTQIA+ individuals are strongly encouraged to apply.

  If you have a disability or special need that requires
  accommodation, please let us know at
  accommodation@karat.com.
