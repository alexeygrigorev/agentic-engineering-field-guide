description: |
  About Baba

  Baba is an applied AI lab modernizing risk and care delivery
  for people with Medicare. We've become the fastest growing
  digital health system matching people with Medicare and
  their family caregivers with expert advocates, physicians,
  medications, lab testing, and AI agents to deliver
  insurance-covered care across all 50 states. In the last 8
  months, we've completed tens of thousands of appointments
  and partnered with health plans covering more than 4 million
  Medicare beneficiaries. On any given day, our team's work
  spans population health research, applied AI research,
  clinical care delivery, and fintech infrastructure.

  We're a Series A company with $47M+ in funding. Our team is
  half engineers, a third former founders, and comes from
  places like Ramp, Stripe, Liquid AI, Palantir, MIT, and CMU.
  Our clinical operations are led by the former Executive
  Director of Care Transitions from the Mount Sinai Health
  System. We believe that talent density is our greatest
  competitive advantage.

  About the Role

  Baba is seeking a Fullstack Engineer to own the end-to-end
  development lifecycle for new platform capabilities and
  integrations with other systems.

  You'll own core systems end-to-end — from voice AI
  infrastructure to the internal tools our clinicians use
  daily. As we scale from thousands to millions of patients,
  you'll design the APIs, data pipelines, and product surfaces
  that make that possible without sacrificing quality of care.

  Interested candidates should email connor@callbaba.com with
  a short summary of the most challenging problem they've
  worked on and a link to their LinkedIn.



  What You’ll Do

  - Build and maintain the web applications, APIs, and backend
    services that power Baba's patient advocacy platform.
  - Design and implement automated QA and monitoring systems to
    audit patient outcomes and advocate performance at scale.
  - Develop internal tools and dashboards that streamline
    clinical workflows, replacing manual processes with
    reliable, scalable software.
  - Architect data models and pipelines to support a growing
    marketplace of advocates, providers, and patients.
  - Collaborate directly with the founder and clinical team to
    translate operational bottlenecks into shipped product.

  Who You Are

  - Strong builder: You have 2+ years of professional experience
    building and shipping web applications. You're comfortable
    owning features end-to-end, from database schema to UI.
  - Systems thinker: You can map complex, multi-user workflows
    into clean data models and logical service boundaries.
  - Pragmatic and fast: You prioritize shipping over perfection,
    but you don't cut corners on correctness. You thrive in
    early-stage ambiguity.
  - High-agency: You take ownership of problems, not just
    tickets. When something breaks at midnight, you fix it.
  - Willing to sweep the corners: You're equally comfortable
    debugging a production issue, answering a patient support
    ticket, or whiteboarding system architecture. No task is
    below you.

  What You Need

  - 2+ years of professional engineering experience (excluding
    internships) in relevant roles at tech and product-driven
    companies
  - Are proficient in one or more backend languages (e.g.,
    Python, Go, Rust, Typescript or similar) and distributed
    systems concepts.
  - Care deeply about reliability, safety, and performance in
    production environments.
  - Interest in AI/ML (direct experience not required)
  - Proven ability to thrive in fast-growing, product-driven
    companies by effectively navigating loosely defined tasks
    and managing competing priorities or deadlines.
  - Bonus: Former founder, or early engineer at a startup who
    has built a product from scratch

  Benefits

  - Medical, dental & vision insurance coverage
  - 401k
  - Flexible PTO
  - Free lunch & dinner in office
  - Relocation support to NYC (as needed)
