description: |
  Senior Software Engineer - Project Engineering



  The Team



  CMG Financial’s Project Engineering team delivers high-
  priority technology initiatives across our mortgage
  technology platforms. Our engineers work on complex projects
  that support loan origination, servicing, document
  processing, internal business systems, and customer-facing
  applications.

  This team takes projects from requirements and architecture
  through development, testing, production release, and
  handoff. We are looking for experienced engineers who can
  quickly understand unfamiliar systems, solve complex
  problems, and take ownership of projects from beginning to
  end.





  The Job



  The Senior Software Engineer is a hands-on technical role
  responsible for designing, developing, testing, and
  delivering enterprise applications and services.

  You will work across multiple applications and business
  areas, partnering with technology and business teams to
  translate requirements into reliable, scalable solutions.



  Responsibilities include:

  - Design, develop, test, and implement enterprise software
    solutions.
  - Take ownership of projects from technical design through
    production release.
  - Develop and maintain APIs, services, integrations, and web
    applications.
  - Troubleshoot complex issues across applications, databases,
    integrations, and cloud environments.
  - Participate in architecture and technical design decisions.
  - Develop solutions that are scalable, maintainable, secure,
    and supportable.
  - Participate in code reviews, testing, release activities,
    and production support.
  - Create appropriate technical documentation and operational
    handoff materials.
  - Work closely with Product, QA, Architecture, and other
    engineering teams.
  - Identify technical risks and proactively recommend solutions
    and improvements.
  - Use modern development tools, including AI-assisted
    development tools, to improve engineering productivity and
    software quality.



  What You'll Need

  - Significant professional software engineering experience in
    enterprise application environments.
  - Strong C# and .NET development experience.
  - Experience developing modern web applications using
    JavaScript/TypeScript frameworks such as React or Angular.
  - Strong relational database and SQL experience.
  - Experience developing and integrating REST APIs and third-
    party services.
  - Experience with cloud-based application development,
    preferably Microsoft Azure.
  - Understanding of modern software architecture and
    application design principles.
  - Experience with automated testing, source control, and CI/CD
    practices.
  - Ability to troubleshoot complex technical issues across
    multiple systems.
  - Strong technical judgment and problem-solving skills.
  - Ability to quickly learn unfamiliar applications,
    technologies, and business domains.
  - Excellent written and verbal communication skills.
  - Ability to work independently, manage priorities, and take
    ownership of results.



  Nice to Have

  - Mortgage, financial services, or fintech experience.
  - Experience with workflow or document-processing
    applications.
  - Experience mentoring engineers or leading technical
    projects.
  - Experience working with AI-assisted software development
    tools.





  How You'll Be Successful

  Success in this role means delivering high-quality solutions
  on schedule, identifying and addressing technical risks
  early, and building systems that can be successfully
  supported and enhanced by other engineering teams.





  SUPERVISORY RESPONSIBILITIES: Direct Reports: N/A



  PHYSICAL and ENVIRONMENTAL CONDITIONS:



  This role operates in an ADA compliant office environment,
  utilizing typical office equipment and tasks including
  computer work. The position may involve partial stationary
  positions and moving throughout the day. Flexibility to work
  overtime to meet project deadlines is required.





  COMPENSATION:

  Compensation Information – The anticipated salary range for
  this position is $145,000 to $180,000 annually. Candidates
  with qualifications and experience that align more closely
  with a mid-level position may be considered at a lower
  compensation range. Actual compensation will be determined
  based on experience, technical skills, industry background,
  location, education, and other job-related factors. Eligible
  employees also receive a comprehensive benefits package.
