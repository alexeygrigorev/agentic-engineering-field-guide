description: |
  Overview

  TradeGenius is building a next-generation crypto terminal
  and exchange, with the deepest network coverage of any
  terminal and the most liquid backers in the industry
  (details on request). Front-end is not decorative here: it
  is the conversion engine, the retention loop, and the brand
  differentiator. While this role is front-end focused, we
  value engineers who can contribute across the stack. We’ve
  processed over $1.5B in volume and serve 1.5M+ users.

  Responsibilities

  - Architect, build, and maintain high-performance front-end
    applications using Next.js and TypeScript.
  - Implement pixel-perfect, responsive, and accessible UI
    components.
  - Collaborate with product and design to deliver seamless user
    experiences for advanced trading workflows.
  - Optimize performance across devices and browsers with
    attention to rendering speed, bundle size, and load time.
  - Integrate front-end with APIs and occasionally contribute to
    back-end development when needed.
  - Uphold best practices in code quality, testing, and
    documentation.
  - Mentor junior developers and influence engineering culture
    and standards.

  Requirements

  - 4+ years of professional front-end development experience.
  - Expert-level proficiency with Next.js, React, and
    TypeScript.
  - Strong grasp of modern front-end architecture, performance
    optimization, and state management.
  - Experience integrating with REST and WebSocket APIs.
  - Familiarity with back-end concepts (Node.js, databases,
    cloud services, Postgres) is a plus.
  - Demonstrated ability to own features end-to-end in
    production systems.
  - Ability to operate independently in a distributed or remote-
    first environment.
  - Speed. Speed. Speed. Execution and iteration velocity
    matter.

  Preferred

  - Prior experience in fintech, trading platforms, or real-time
    applications.
  - Contributions to open-source or technically substantial side
    projects.
  - Comfort with rapid iteration and startup velocity.
