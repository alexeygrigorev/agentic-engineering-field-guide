description: |
  Tripoint Solutions is seeking a Salesforce Software
  Developer II to design, build, test, and support enterprise
  Salesforce solutions for a Department of the Navy higher
  education platform. The platform serves thousands of
  students today and is scaling significantly over the next
  year as additional partner institutions are integrated.

  The developer works in an Agile delivery environment with
  frequent production releases and contributes to the
  transition from Salesforce Education Data Architecture (EDA)
  to Salesforce Education Cloud.

  This is a hands-on development position requiring immediate
  proficiency in Salesforce development.

  Location: Remote.  The selected candidate must be currently
  located in, or willing to relocate to, a state supported by
  Tripoint Solutions corporate offices: AL, CO, DC, DE, FL,
  GA, IL, IN, KS, LA, MD, MN, MS, NC, NJ, OH, PA, SC, TN, TX,
  or VA. (No relocation assistance provided)

  Clearance Requirements:

  - U.S. Citizenship is required.
  - Applicants selected for this position may be subject to a
    government security investigation.

  Responsibilities

  - Design, develop, test, and maintain Salesforce applications
    using Apex, Lightning Web Components, Flows, and custom
    objects.
  - Build and maintain integrations between Salesforce, partner
    institution data feeds, the learning management system,
    MuleSoft, and AWS GovCloud services using REST and SOAP
    APIs, platform events, and middleware.
  - Support the Education Cloud migration by analyzing existing
    customizations, implementing approved configurations,
    supporting Person Account conversion and data validation,
    and testing integrations against the new data model.
  - Configure, develop, and test approved Agentforce
    capabilities, actions, and integrations within established
    program governance and security requirements.
  - Participate in sprint planning, backlog refinement,
    standups, demonstrations, and retrospectives. Provide
    accurate development estimates and time reporting against
    assigned Jira tickets.
  - Deliver well-tested code that meets documented acceptance
    criteria, passes established quality checks, and minimizes
    defects introduced into production.
  - Apply secure coding practices and implement assigned
    controls consistent with applicable DoD STIGs, DFARS, NIST
    SP 800-171, FERPA, and Section 508 requirements. Remediate
    assigned vulnerabilities within established timelines.
  - Document designs, technical decisions, and configuration
    changes in Jira and Confluence. Support production
    incident investigation, root cause analysis, and
    corrective actions.

  Required Qualifications

  - Bachelor’s degree in Computer Science, Software Engineering,
    Information Technology, or a closely related field.
  - Minimum of four years of professional software development
    experience.
  - Current hands-on Salesforce development experience using
    Apex and Lightning Web Components in a production
    organization within the last 12 months.
  - Experience developing on a Salesforce-based student
    information system or higher education platform (Education
    Data Architecture or Education Cloud), including student,
    enrollment, term, and course data.
  - Experience implementing Salesforce integrations using REST
    APIs, SOAP APIs, platform events, or middleware such as
    MuleSoft.
  - Experience with Git-based source control, unit testing,
    debugging, and deployments across development, testing,
    and production environments.
  - U.S. citizenship.
  - Ability to obtain and maintain a favorably adjudicated Tier
    1 background investigation for CAC issuance. A security
    clearance is not required.
  - Ability to handle and safeguard Controlled Unclassified
    Information.

  Required Salesforce Certifications

  All three certification requirements must be current and
  verifiable:

  - Salesforce Certified Platform Developer (formerly Platform
    Developer I).
  - One of the following: Salesforce Certified Platform
    Developer II, Salesforce Certified Platform Administrator,
    or Salesforce Certified Platform App Builder.
  - Salesforce Certified Agentforce Specialist.

  Candidates must list their certifications on their resumes
  and provide a Trailblazer profile URL for verification.
  Required certifications will be verified before interviews
  are scheduled.

  Preferred Qualifications

  - Experience integrating a student information system with a
    learning management system such as Blackboard Learn,
    including enrollment, grade, and completion data exchange.
  - Salesforce Certified Education Cloud Consultant
    certification.
  - Experience supporting Salesforce data model migrations,
    including Person Accounts.
  - Experience with MuleSoft, AWS GovCloud, Experience Cloud, or
    Tableau.
  - Experience implementing Agentforce solutions in a production
    environment.
  - Experience supporting federal government or Department of
    Defense technology programs.
  - Current favorably adjudicated federal background
    investigation.

  About Tripoint Solutions

  We are technology innovators, partnered with state-of-the-
  art providers, such as AWS, ServiceNow, and UiPath, to drive
  digital transformation in the federal space. TPS teams are
  bringing automation and data science into areas of the
  government that are crying out for fresh tech—making
  positive impacts felt by tens of thousands of users,
  countless citizens, and all six branches of the military
  each day. Our Agile teams are responsible for envisioning,
  launching, and operating the massive data systems and
  analytics platforms used to manage $14.5B in government
  procurements and $200B in military real estate assets
  globally. At TPS, we apply the power of cloud technologies
  to help the government think smarter and function better—for
  everyone.

  TPS Company Values

  - We value and respect each employee's dedicated work and
    unique contributions as they directly impact who we are
    and what we do.
  - Your talent and innovative thinking bring leading-edge
    solutions to our customers.
  - Our success is driven by the dedication of our employees.
  - Employee-generated solutions have sustained our continued
    success and customer satisfaction

  Benefit Offerings

  Tripoint Solutions builds flexibility into health benefit
  plan choices, covers most of the monthly premiums, and helps
  employees build a career with impact through our generous
  professional development program.

  We offer all full-time employees:

  - Medical, Dental, Vision benefits with a national provider
    network
  - Flexible Spending and Health Savings Accounts (FSA & HSA)
  - Company-paid Life and Disability insurance including Short-
    Term, Long-Term, and Accidental
  - Supplemental Insurance
  - Paid time off (PTO)
  - 11 paid holidays
  - 401(k) Retirement Plan
  - Professional Development Reimbursement Program to pursue
    undergraduate, graduate, training, and certifications
  - Monthly transportation, parking, and cell phone service
    reimbursement


  Tripoint Solutions is an Equal Opportunity
  Employer/Veterans/Disabled
