description: |
  Full Stack React Developer

  Summary

  You'll be working closely with one of our clients on their
  Global Analytics and AI team. As a Full-Stack React
  Developer on the GA and AI team in Global Analytics, you be
  responsible for developing a new SaaS product. This role
  will require an eye for balancing user and technical
  requirements across different stakeholders, breaking down
  tradeoffs between stability and pragmatic needs, and
  translating this into tangible impact. The product we're
  working on leverages massive datasets and customizes machine
  learning models to help businesses make intelligent
  decisions.

  About You

  - Enjoy working remotely.
  - Happy working as a freelance contractor.
  - Authorized to work in the United States.
  - Strong communicator - being 100% remote, excellent
    communication is critical for what we do.
  - You love to ship - you're focused on delivering value and
    you are biased towards action.
  - Strong ability to problem solve with little guidance - we
    jump around across the stack frequently, often in new
    areas. Being able to orient yourself on new areas of the
    codebase is important!

  Requirements

  - Deep experience building UI applications with React
  - Experience writing unit and integration tests for React
    applications in a maintainable manner, especially
    experience working with Jest and React Testing Library
  - Experience working in Python, especially with a focus on
    analytics and data science workloads
  - Very strong CSS / Javascript / HTML fundamentals. You take
    pride in crafting semantic, clean HTML that leverages
    modern CSS features

  Bonus Points

  - Experience using Spark, especially SparkSQL
  - Data Science fundamentals - handling large datasets, writing
    data tests, creating performant queries, analyzing result
    datasets with various statistical methodologies
  - Experience working with machine learning frameworks and
    concepts
  - Fintech experience

  About ProDev

  ProDev partners with incredible freelance developers from
  across North America to build products that delight. Our
  clients look to us to provide them with exceptionally
  talented consultants who can help them accelerate their
  delivery. Our team has been specializing in remote-based
  software consulting for over 12 years. Our goal is to build
  an exceptionally talented group of technologists who enjoy
  shipping high-quality code, working together, and are
  committed to continuous learning.
