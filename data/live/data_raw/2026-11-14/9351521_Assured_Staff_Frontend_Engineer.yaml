description: |
  Assured is on a mission to modernize insurance. Claims
  processing (i.e. should we pay this claim?), while often
  overlooked, is the foundation of the entire industry. It’s
  currently highly manual, involving phone calls, faxes, and
  gut instinct, costing tens of billions of dollars a year. We
  can do better.

  At Assured, we provide large insurers with the software
  solutions they need to win in a modern, technology-driven
  world. From self-service claim-filing software to backend
  fraud detection, we’re the engine that powers claims
  processing for some of the largest insurers in the world.

  The challenges we face are deep and diverse, from creating
  digital experiences that provide comfort and clarity to
  claimants at their most stressed and vulnerable to
  orchestrating large-scale ML-driven decision-making on
  billions of dollars of claims payments, life at Assured is
  dynamic, collaborative, and rewarding.

  We’re looking for a Staff Frontend Engineer to help define
  the future of our B2B SaaS platform through exceptional user
  experiences, scalable frontend architecture, and AI-native
  product development workflows.

  This is a highly hands-on, high-impact role for an engineer
  who operates at the intersection of design, engineering, and
  product thinking. You’ll own critical areas of our frontend
  platform, shape interaction and UI standards, and help
  establish how modern AI-assisted engineering accelerates
  both product quality and development velocity.

  We’re looking for someone who obsesses over usability and
  polish, thinks in systems, and uses AI tooling as a core
  part of how they prototype, build, refine, and ship
  software.

  What You’ll Do...

  🌎 Own major areas of the frontend architecture, driving
  decisions around scalability, performance, maintainability,
  and user experience consistency across the platform.

  ⚡ Use AI-assisted development tools (e.g. Cursor, Claude
  Code, Copilot, ChatGPT, v0, or similar) as part of your
  daily workflow to accelerate UI development, prototyping,
  debugging, testing, and iteration.

  🤖 Help define how AI can improve both our product experience
  and our internal frontend engineering workflows.

  🎨 Design and implement polished, production-ready
  interfaces, taking ideas from rough concepts and prototypes
  to refined customer experiences.

  👩‍💻 Write, test, and ship high-quality frontend code with a
  strong focus on responsiveness, accessibility, performance,
  and maintainability.

  🧠 Architect reusable UI systems, component libraries, and
  frontend abstractions that enable fast, consistent product
  development at scale.

  🗣️ Partner closely with design, product, backend, and data
  teams to deliver cohesive, customer-centered workflows and
  experiences.

  📈 Use customer feedback, analytics, experimentation, and
  usage insights to continuously improve product usability and
  interaction quality.

  🌱 Mentor engineers and help establish a strong frontend
  engineering culture centered around craftsmanship, speed,
  ownership, and modern tooling.

  What You Bring...

  💪 Extensive experience building and scaling complex modern
  web applications and frontend systems.

  🛠️ Deep expertise in frontend architecture, component
  systems, state management, performance optimization, and
  production-quality software delivery.

  🤖 Strong proficiency with modern AI engineering and design
  tooling. You actively use AI to accelerate development,
  prototype interfaces, generate ideas, debug issues, and
  improve workflow efficiency.

  👁️ Exceptional design sensibility. You care deeply about UX
  quality, accessibility, interaction design, responsiveness,
  and visual precision.

  ⚙️ Systems thinking and frontend platform experience. You
  know how to design scalable UI architectures and maintain
  consistency across large products and teams.

  ⚡ Strong execution mindset with the ability to move quickly
  while maintaining high standards for quality and
  maintainability.

  💬 Collaborative, low-ego approach. You work effectively
  across engineering, design, and product teams and
  communicate ideas clearly.

  🔧 We value adaptability, product thinking, and engineering
  judgment more than experience with any specific framework or
  library.

  Benefits:

  🤑 Competitive Compensation: Competitive salary and equity
  packages for all employees

  🏥 Healthcare Plan: Platinum medical, dental, and vision

  🛡️ Free life insurance: Including long-term disability &
  short-term disability

  🏄 Unlimited PTO: Uncapped vacation days & paid holidays

  👶 Family Leave: Maternity & paternity

  📈 401(k) Contribution: Assured contributes 3% of your
  income, even if you don't contribute

  🏠 WFH Benefits: Lunch on us 2x/week, monthly phone stipend &
  other home office perks

  👪 Health FSAs & HSAs: Pre-tax accounts for out-of-pocket
  medical expenses

  🤝 Team events & Offsites: We're remote, but we regularly get
  together

  **We have been made aware of individuals falsely posing as
  recruiters from Assured Insurance Technologies Inc. Please
  note that we only contact candidates from official
  @assured.claims email addresses and all interviews are
  conducted through verified company channels. If you are
  unsure whether a message is legitimate, please contact us
  directly at recruiting-ops@assured.claims before sharing any
  personal information**

