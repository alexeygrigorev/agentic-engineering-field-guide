description: |
  About Us

  ZeroMark builds AI-driven counter-drone systems that
  actually work in combat. No PowerPoints. No hype. Just
  field-proven technology that saves lives.

  We've doubled year-over-year for two straight years, winning
  contracts that prove what we've always known: real
  innovation happens in the dirt, not in conference rooms. Our
  systems transform standard weapons into AI-powered platforms
  that detect, track, and neutralize drone threats—because a
  $200 drone shouldn't require a million-dollar
  countermeasure.

  Here's what makes us different: ZeroMark operators don't
  build from behind screens. You'll validate tech from
  Blackhawk helicopters, train alongside Tier-1 units (who
  happen to be our coworkers), and test at legendary ranges
  from White Sands to the cliffs of Hawaii. When we say field-
  tested, we mean you'll shoot it, fly with it, and push it to
  failure. We don't tweet about changing the world—we're too
  busy actually doing it. Watch us in action here. Dark humor
  required, thick skin recommended.

  If you want to make an actual impact—and have some
  unforgettable Tuesday afternoons along the way—let's talk.
  We're all about delivering practical, field-tested tech, not
  just theories.

  What You’ll Do

  - Design, develop, test, and deploy robust and scalable
    software solutions for counter-drone systems.
  - Collaborate with cross-functional teams, including hardware
    engineers, data scientists, and subject matter experts, to
    define system requirements and architecture.
  - Implement algorithms for drone detection, tracking,
    identification, and mitigation.
  - Optimize software for real-time performance and resource
    efficiency in embedded and distributed environments.
  - Participate in code reviews, contribute to architectural
    discussions, and maintain high code quality standards.
  - Troubleshoot and debug software issues, ensuring system
    reliability and performance.
  - Stay up-to-date with emerging technologies and industry best
    practices in software development and counter-drone
    capabilities.

  What You’ll Need

  - Bachelor's or Master's degree in Computer Science, Software
    Engineering, or a related field.
  - Proven experience in software development, preferably in a
    defense, aerospace, or security-related domain.
  - Proficiency in one or more programming languages such as
    C++, Python, or Java.
  - Strong understanding of data structures, algorithms, and
    object-oriented design principles.
  - Experience with embedded systems, real-time operating
    systems (RTOS), or distributed systems is a plus.
  - Familiarity with signal processing, computer vision, or
    machine learning concepts is highly desirable.
  - Excellent problem-solving skills and a strong analytical
    mindset.
  - Ability to work effectively in a fast-paced, collaborative
    team environment.
  - U.S. citizenship is required due to government contract
    requirements.

  Bonus Points

  - Experience with sensor integration (e.g., radar, optical,
    acoustic).
  - Knowledge of communication protocols and networking.
  - Familiarity with cybersecurity principles and secure coding
    practices.
  - Experience with Agile development methodologies.

  What We Offer

  - Competitive salary, equity, and benefits package.
  - Opportunity to work on cutting-edge technology with a
    significant impact on national security.
  - A collaborative work environment that values innovation.
  - Professional development opportunities and career growth.
