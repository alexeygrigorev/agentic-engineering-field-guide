description: |
  Overview Corporate Tools is hiring Senior Software Engineers
  specializing in Ruby on Rails for up to $185,000/year. You
  will be a traditional company employee. This is a remote
  position, but if you're near one of our local offices,
  you're welcome to come hangout with us in-office as well.
  Our main offices are in Post Falls, ID, and Spokane, WA; we
  also have satellite offices in Austin, TX, and Salt Lake
  City, UT. You'll be working 40 hours a week and, of course,
  enjoy great company benefits. One moment, you'll be deep in
  system design, debating architectural tradeoffs and mapping
  out the future. The next, you'll be turning a "this seems
  impossible" project into a series of achievable wins that
  get the team moving. We love hard problems, messy
  challenges, and the kind of technical puzzles that make you
  lose track of time (in a good way). We're a nimble team that
  values smart decisions over red tape, thoughtful solutions
  over quick fixes, and software that gets better with age
  instead of more complicated. If you're the type of engineer
  who enjoys connecting big ideas to practical execution, gets
  excited by a tough technical challenge, and occasionally
  says "I have an idea..." right before solving a problem
  nobody else wanted to touch, you'll feel right at home.
  You'll join a collaborative team where knowledge is shared
  freely, questions are welcomed, and people genuinely enjoy
  working together. Whether you've been here ten years or ten
  days, you'll find teammates eager to help you succeed. If
  you're excited by complex problems, meaningful technical
  influence, and the opportunity to build software without the
  distractions of investor pressure or constant
  micromanagement, we'd love to meet you. What's in a title?
  At Corporate Tools, we don't put much stock in titles.
  They're helpful for job postings, but once you're here, what
  matters is your impact, growth, and the unique strengths you
  bring to the team. We use levels instead of traditional
  titles because they give us more flexibility to support
  career development without forcing people into rigid boxes.
  Through regular conversations, you'll have clear
  expectations, opportunities to grow, and ongoing discussions
  about challenging work, progression, and compensation. Our
  goal is simple: create an environment where talented people
  can keep learning, taking on new challenges, and building a
  career that's meaningful to them. And if you'd like a
  traditional title for LinkedIn, post away. Wage Up to
  $185,000 / year Benefits

  - 100% employer-paid medical, dental & vision Full coverage
    for employees - nothing comes out of your paycheck. Plus
    an annual review with a raise option.
  - Time off that grows with you 22 days PTO + 4 holidays to
    start. After 3 years it bumps to 29 days, and after 5
    years you move to flexible time off - not accrued, not
    capped. Take time off when you want.
  - Parental leave & 401(k) match Paid parental leave, plus up
    to 6% company 401(k) matching with no vesting period -
    it's yours from day one.
  - Quarterly allowance Spend it on whatever makes work better:
    a comfier remote setup, continuing-education classes, a
    plant for your desk, coffee for a coworker, a massage for
    yourself... really, whatever.
  - No dumb perks (and a trail mix bar) No weekend dog-walking
    gimmicks that look cool but cost nothing because nobody
    uses them. We spend on benefits you'll actually use - an
    open-concept office, friendly coworkers, a creative
    environment, and yeah... a trail mix bar.


  Responsibilities

  - Be a good human
  - Treat your co-workers with respect
  - Have a Growth Mindset, not a Fixed Mindset
  - Remember that it's a marathon, not a sprint. Help us bring
    calm to what can creep into a rush
  - Design, implement, document, and maintain front and back end
    systems for high-traffic applications
  - Help peel off monolith code into well-organized architecture
  - Help drive technical standards for the team
  - Design and implement novel systems from scratch, from
    billing to all kinds of crazy ideas we come up with
  - Help us set a high bar for quality, from code and systems to
    how we treat each other
  - Take substantial features from concept to shipping
  - Provide material feedback on the work of junior and mid-
    level programmers
  - Monitor and ensure automated processes run as expected
  - Perform routine automation assignments with minimum
    supervision
  - Communicate consistently with stakeholders, managers, and
    other teams about releases
  - Participate in the training or development of others, as
    directed


  Requirements

  - Bachelor's degree in computer science or other equivalent
    degree/experience
  - Minimum of 6 years full stack application development,
    software test automation experience, and object oriented
    development
  - 4+ years working with back-end frameworks such as Rails,
    Laravel, Django, etc.
  - 4+ years working front-end frameworks such as Vue, Angular,
    React, etc.
  - 2+ years working with relational databases and writing SQL
    queries or stored procedures
  - Advanced level of querying in ORMs such as ActiveRecord and
    Sequel
  - Experience mentoring junior to mid-level engineers while
    balancing current work
  - High proficiency in some of the following AWS services: ECS,
    EC2, S3, CloudWatch, RDS, ElasticSearch, VPC
  - Proficient in vanilla JavaScript (outside of using it with a
    modern web framework)
  - High level of ability coding in Ruby and expert level
    familiarity with the Rails framework
  - Experience with large Rails/Rack- based applications


  Back to Jobs  Senior Software Engineer (Ruby on Rails)
  Remote Apply Now Why Work Here You've been building large
  rails apps for other companies. The ones with carrots
  dangling in front of you, hipster benefits and slippery
  ladders. You've always wondered if there's a place where
  profits and titles aren't everyone's motivation. Where
  people just want you to make great software. You like the
  idea of working for a locally-owned and operated company
  that competes in an extremely competitive space nationwide.
  You like that your work matters today and will affect
  millions of our business customers. You like the idea that
  you could find a place like this in Spokane, where we have 4
  seasons. Where you can buy a great house for a great price
  with no epic commute. You like that there are 5 ski hills
  within 2 hours and endless outdoor activities. You don't
  like bugs or humidity or a million people living in your
  city. You love to code, but you want to take part in the
  planning without being required to deal with stakeholders
  and project managers all day. You want to make cool stuff.
  You want your cool stuff to be really good. But most
  importantly, if you made a dish of noodles and butter for
  someone and asked them what they thought of it, if they said
  it was okay or good and didn't give you feedback, you'd feel
  a little left out... you'd want a little more... because
  okay or good isn't fulfilling to you. But at the same
  time... it's just a job. Yourself/Family/Friends/Personal
  Time is number 1. Work is number 2 or 3. Our goal is to use
  the incredible business we are excited to be a part of to
  support all of our personal time. We all want to live a full
  personal life. We'll have more fun working together during
  the day if we know there's a clear cutoff. This way, we can
  create a work environment where we can not only go home at
  the end of the day, but mentally shut off work and mentally
  go home also. We focus on creating a welcoming, supportive
  job environment that pays well and doesn't stress you out,
  so when you call it a day, you go have fun personally. #BI-
