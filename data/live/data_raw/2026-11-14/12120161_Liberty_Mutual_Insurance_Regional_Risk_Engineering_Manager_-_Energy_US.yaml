description: |
  Description  Provides regional leadership and management
  responsibility for Risk Engineering across the US and Latin
  America, with a primary focus on Energy and Construction
  occupancies and additional support for assigned lines of
  business. The role manages team resources and priorities
  while implementing global strategy, standards, procedures,
  technical guidance, and efficient workflows in a consistent
  and practical manner. The job holder serves as a key
  integration point across Risk Engineering, Underwriting,
  Claims, Actuarial, Finance, Product Line Management, and
  regional and global leadership to support underwriting,
  pricing, claims, portfolio, referral, and survey strategy
  decisions. Externally, the role represents Liberty with
  brokers, clients, broker Risk Engineering leaders, and
  industry stakeholders by developing bespoke client service
  plans, articulating Liberty's technical value proposition,
  supporting business development, and strengthening market
  visibility through client engagement, conferences, technical
  presentations, industry papers, and thought leadership.
  Background Liberty Specialty Markets (LSM) offers specialty
  and commercial insurance and reinsurance products across key
  UK, European, Latin American, US, and other international
  locations. At Liberty Specialty Markets we create an
  environment where careers can flourish - a place for people
  to learn, grow, develop, and celebrate success. We recognize
  and encourage the values of diversity, inclusion and
  collaboration, working together to share our unique
  perspectives, make better decisions, deliver innovative
  solutions, and pursue our goals. Job Responsibilities

  - Leads and supports the development and delivery of bespoke
    client service plans through client engagement, business
    development, survey strategy, and coordinated service
    delivery.
  - Represents Liberty Risk Engineering with brokers, clients,
    and industry stakeholders, articulating Liberty's
    technical value proposition, showcasing risk engineering
    capabilities, and supporting new and renewal business
    opportunities.
  - Leads engagement with regional Heads of Broker Risk
    Engineering to strengthen relationships, cooperation,
    market visibility, and thought leadership.
  - Represents Liberty at conferences, panel discussions,
    technical presentations, industry papers, and other market
    forums to promote Liberty Risk Engineering expertise and
    value.
  - Maintains current knowledge of assigned business lines,
    process technology, loss prevention, construction, and
    market trends, and recommends how external developments
    should inform services, policies, processes, and client-
    facing solutions.
  - Provides regional leadership for the US and Latin America
    Risk Engineering team across assigned lines of business,
    primarily onshore energy and construction, with additional
    support for casualty, commercial property, and marine
    lines.
  - Manages team resources, priorities, technical and
    operational escalation, budget, headcount planning, hiring
    priorities, and staffing coordination with regional and
    global leadership.
  - Contributes to global Risk Engineering strategy, standards,
    procedures, technical instructions, guidelines, policies,
    and processes, and leads regional implementation in a
    consistent and practical manner.
  - Establishes efficient workflows, processes, tools, and
    advisory services that support business priorities,
    maintain high technical standards, and align with global
    and regional expectations.
  - Serves as a key integration point across Risk Engineering,
    Underwriting, Claims, Actuarial, Finance, Product Line
    Management, and regional and global leadership to support
    underwriting, pricing, claims, portfolio, and referral
    decisions.
  - Oversees survey and inspection strategy for the regional
    team, including desk-based risk appraisals, on-site
    surveys, marketing survey reports, monitoring of risk
    appraisals, follow-up on key recommendations, and
    maintenance of current risk engineering information on
    file.

  Qualifications Preparation, Training and Experience •
  Bachelor of Science degree in a technical discipline, such
  as Chemical, Process, Electrical, or Mechanical Engineering,
  or equivalent. • At least 10 years of experience in relevant
  energy industries, including oil, gas, petrochemical,
  chemical, power generation, renewables, or heavy industries,
  with a background in operations, maintenance, process
  safety, loss prevention, or construction. • At least 10
  years of experience within the insurance sector in relevant
  lines of business. • Demonstrated experience managing or
  leading a team of professionals. • Demonstrated ability to
  partner across Underwriting, Claims, Actuarial, and Finance
  functions on portfolio-level risk management, including Nat
  Cat exposure and pricing input. • Strong communication and
  listening skills to develop and maintain relationships with
  external stakeholders, including clients and brokers, and
  internal stakeholders, including underwriters, risk
  engineers, claims, actuarial, and finance partners. •
  Demonstrated ability in advanced-level risk evaluation,
  analysis, and strong marketing skills to participate in
  new/renewal business development. • Ability to converse in
  and understand Spanish and/or Portuguese is beneficial,
  particularly for engagement across Latin America, but is not
  a mandatory requirement. • Demonstrated ability to
  effectively use required software applications, such as
  Microsoft Office Suite; position requires regular travel.
