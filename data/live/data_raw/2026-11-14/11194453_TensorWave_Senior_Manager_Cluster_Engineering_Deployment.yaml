description: |
  About TensorWave

  Our mission is simple: deliver seamless, secure, reliable,
  and resilient AI compute at scale. We've built a versatile
  cloud platform that eliminates infrastructure barriers,
  empowering builders to focus on innovation instead of
  fighting their stack. Because breakthrough AI should move at
  the speed of ideas, not infrastructure.

  About the Role

  The Senior Manager, Cluster Engineering & Deployment owns
  and runs the machine that turns delivered racks into
  accepted clusters: network bring-up, fabric cabling
  verification against port maps, GPU node integration with
  the fabric, cluster-level validation and burn-in (including
  RCCL/collective performance), and the acceptance gate into
  production. This is one of the most schedule-critical roles
  in the pillar cluster revenue starts when this team says a
  cluster is ready.

  What You’ll Do

  - Own the cluster deployment playbook and drive its evolution:
    staged bring-up, automated config push, link/optics
    validation, cabling verification against L1 port maps, and
    fault triage during deployment windows.
  - Lead deployment engineering across concurrent cluster
    builds, through team leads and on-site engineers;
    coordinate daily with Data Center Integration field teams
    and cabling vendors.
  - Drive deployment velocity engineering: cut bring-up time per
    cluster through tooling, pre-staging, and defect-source
    elimination, and set the targets the team is measured
    against.
  - Own defect feedback loops to Network Engineering (design),
    Layer One (cabling quality), and vendors (hardware/optics
    RMA patterns), holding those partners accountable to
    resolution.
  - Define spares, test equipment, and deployment tooling
    requirements per site, and standardize them across sites.

  Who You Are

  Required Qualifications

  - 10+ years across network deployment, cluster/HPC bring-up,
    or large-scale infrastructure delivery, including managing
    engineers in a field/deployment setting.
  - Hands-on fabric bring-up experience at scale (hundreds of
    switches / thousands of links per deployment).
  - Strong operational rigor: building and enforcing playbooks,
    gates, metrics, and blameless defect loops.
  - Team leadership with schedule accountability across multiple
    concurrent builds or sites.

  Preferred Qualifications

  - GPU cluster validation experience (NCCL/RCCL benchmarking).
  - Automation skills (Python, Ansible) applied to deployment.
  - Optics/link-layer debugging depth.
  - Experience with acceptance testing as a commercial gate
    (revenue-linked).
  - Own cluster validation end to end: bandwidth/latency
    baselines, collective (RCCL) performance tests, burn-in
    criteria, and go/no-go acceptance gates and raise the bar
    on each as the fleet scales.

