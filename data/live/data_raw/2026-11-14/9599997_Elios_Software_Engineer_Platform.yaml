description: |
  Software Engineer, Platform Location: Remote (US) | Type:
  Full Time | Experience: 4 to 6+ years | Pay: $140K-$175K

  About the Role You'll build the platform that makes Elios
  faster than everyone else. Prism and Elios Insights handle
  sourcing, screening, and matching at a scale our team
  couldn't touch by hand, and you'll own real pieces of it.

  This is product engineering with an AI core. You'll work
  with frontier models through our Anthropic partnership, turn
  fuzzy matching problems into systems that ship, and watch
  your work change how the company operates the same week you
  merge it.

  What You'll Do

  - Build and own features across our matching and screening
    platform
  - Design AI workflows on top of Claude and other frontier
    models that stay reliable, fast, and cost-aware
  - Turn messy candidate and role data into structured signals
    the team can act on
  - Ship full-stack, from API and data layer to the interfaces
    our recruiters use daily
  - Work directly with the people using the product, since they
    sit a Slack message away
  - Keep quality high with testing that lets us move fast
    without breaking trust

  Qualifications

  - 4 to 6+ years building production software, ideally on data-
    heavy or AI products
  - Strong in Python or TypeScript and comfortable across the
    stack
  - Experience putting LLMs or ML models into real applications
  - Solid with a modern cloud (AWS, Azure, or GCP) and common
    data tooling
  - You care about the person using the product, not just the
    architecture
  - Happy owning ambiguous problems start to finish

  Why Join Us At Elios, AI is our cost engine, not a buzzword.
  The platform you build is what lets a small team deliver
  consulting-grade results at staff-augmentation economics.
  Few engineering roles let you see your impact this directly.

  We're remote-first, move quickly, and keep the team small
  and high-trust. You'll own meaningful work from day one.

  To apply, click Apply on LinkedIn and visit
  eliosai.com/browse-jobs
