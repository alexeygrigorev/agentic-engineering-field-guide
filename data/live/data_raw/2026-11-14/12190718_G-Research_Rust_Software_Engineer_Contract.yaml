description: |
  We tackle the most complex problems in quantitative finance,
  by bringing scientific clarity to financial complexity.

  From our London HQ, we unite world-class researchers and
  engineers in an environment that values deep exploration and
  methodical execution - because the best ideas take time to
  evolve. Together we’re building a world-class platform to
  amplify our teams’ most powerful ideas.

  As part of our engineering team, you’ll shape the platforms
  and tools that drive high-impact research - designing
  systems that scale, accelerate discovery and support
  innovation across the firm.

  Take the next step in your career.

  The role

  The Custom I/O team builds the storage technology that sits
  underneath much of our research. We are developing a new
  distributed storage platform, written in Rust, to give us
  greater scalability, performance and operational control.

  You will work closely with researchers and other engineers
  to understand how data is stored and accessed, and help
  shape the design of a platform that many teams depend on. AI
  is part of how every team here works, accelerating thinking
  and delivering impact. All colleagues are expected to bring
  AI into their daily workflows.

  Key responsibilities of this role include:

  - Designing and developing core components of a distributed
    storage platform in Rust
  - Building scalable, resilient and performant systems for
    large data workloads
  - Collaborating with researchers and engineers to understand
    data access requirements
  - Contributing to architectural decisions across distributed
    systems and data management
  - Developing and optimising services that run in Kubernetes
    environments
  - Integrating event-driven and streaming technologies,
    including Kafka, into the wider platform
  - Promoting engineering best practice, code quality and
    thorough testing

  Who are we looking for?

  The ideal candidate will have the following skills and
  experience:

  - Commercial experience developing production systems in Rust
  - A solid grounding in distributed systems and the trade-offs
    involved in designing them
  - Experience building systems that handle large volumes of
    data reliably
  - Experience with Kubernetes is beneficial
  - Familiarity with event-driven or streaming technologies such
    as Kafka is desirable
  - A collaborative approach and the ability to explain
    technical decisions clearly to colleagues
  - A commitment to testing, code quality and operational
    excellence

  Why join us?

  - Highly competitive compensation
  - Lunch provided (via Just Eat for Business) and dedicated
    barista bar
  - Informal dress code and excellent work/life balance
  - Monthly company events

  Please note that contract applications for London based
  roles at G-Research are handled by one of our third-party
  recruitment partners, so your application will be managed
  through them.

  G-Research is committed to cultivating and preserving an
  inclusive work environment. We are an ideas-driven business
  and we place great value on diversity of experience and
  opinions.

  We want to ensure that applicants receive a recruitment
  experience that enables them to perform at their best. If
  you have a disability or special need that requires
  accommodation please let us know in the relevant section
