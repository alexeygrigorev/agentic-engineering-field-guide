description: |
  Standard Job Description

  At Lockheed Martin we keep people safe and solve the world's
  most complex challenges. Our people are some of the greatest
  minds in the industry and truly make Lockheed Martin a great
  place to work. With our employees as our priority, we
  provide career opportunities designed to propel development
  and boost agility. Our flexible schedules, competitive pay,
  and comprehensive benefits enable our employees to live a
  healthy, fulfilling life at and outside of work. This is a
  place for engineers, scientists, and problem-solvers who are
  ready to engage deeply, think critically, and build with
  purpose. You will not just launch a career. You will be part
  of something bigger. This is where the best are built.

  Intern candidate will perform assignments in
  technical/engineering organizations (e.g., Systems
  Engineering, Test Engineering, Hardware Electronics
  Engineering, Software Engineering, Cybersecurity
  Engineering, Facilities/Lab Engineering, Field Engineering)
  during vacations and short-term breaks from college
  attendance while enrolled in an accredited degree program.

  Basic Qualifications

  - Experience with C, C++ or Java
  - Experience with Linux
  - Experience with software versioning system (i.e. Git)
  - Pursuing a bachelor’s degree from an accredited college in a
    Computer Science, Software Engineering, or Computer
    Engineering
  - Must be a US Citizen; this position will require a
    government security clearance. This position is located at
    a facility that requires special access.

  Desired Skills

  - Python
  - Familiarity with software development environments
  - Software and System level testing experience
  - User Interface development
  - Will be a Rising Junior heading into Summer of 2027

  Pay Information

  Full-Time Salary Range: $25.18 - $35.19

  At Lockheed Martin, we know mission success starts with
  taking care of our people. Our Total Rewards program is
  designed to attract top talent, support your well-being, and
  help you grow—both professionally and personally.

  The salary range for this position is as listed on the
  requisition. Please note that the salary information listed
  is a general guideline only. Lockheed Martin considers
  factors such as (but not limited to) scope and
  responsibilities of the position, candidate's work
  experience, education/ training, key skills as well as
  market(work location) and business considerations when
  extending an offer.

  Benefits offered: Medical, Dental, Vision, Flexible work
  arrangements and schedules (e.g., 4x10), 401(k) match, Paid
  time off, Holidays, Parental Leave, EAP, Flexible Spending
  Accounts, Education Assistance, Life Insurance, Short-Term
  Disability, and Long-Term Disability.

  - Annual short-term and/or long-term incentive compensation
    programs may be offered depending on the position.
    Payments under these annual programs are not guaranteed
    and can vary from year to year and are tied to a range of
    performance metrics.
  - For (Washington state applicants only) Non-represented full-
    time employees: accrue at least 10 hours per month of Paid
    Time Off (PTO) to be used for incidental absences and
    other reasons; receive at least 90 hours for holidays.
    Represented full time employees accrue 6.67 hours of
    Vacation per month; accrue up to 52 hours of sick leave
    annually; receive at least 96 hours for holidays. PTO,
    Vacation, sick leave, and holiday hours are prorated based
    on start date during the calendar year.
