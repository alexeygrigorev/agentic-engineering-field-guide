description: |
  About Plenful

  Plenful is on a mission to transform healthcare operations
  from the inside out. Fresh off our $50M Series B and backed
  by Notable Capital, Bessemer Venture Partners, TQ Ventures,
  Susa/Kivu Ventures, and other leading investors, we’re
  building the category-defining AI automation platform that
  healthcare teams rely on to operate smarter, faster, and
  more efficiently. Our technology empowers healthcare
  operators across hospital and health systems, pharmacies and
  payors to eliminate manual work, reduce administrative
  burden, and improve compliance, all while unlocking critical
  revenue to fund programs for their in-need patient
  populations.

  Built by healthcare operators for healthcare operators,
  Plenful is driven by a deep understanding of the challenges
  facing today’s care teams. We’re passionate about equipping
  healthcare workers with world-class tools that deliver real,
  measurable impact, and we’re proud to serve 100+ leading
  health systems, pharmacies, and healthcare organizations
  across the country. If you’re excited to help shape the
  future of healthcare, we’d love to meet you. Apply now to
  join our growing team.

  About the Role

  Plenful is hiring Senior Full-Stack Engineers across all
  three of our product teams — 340B, Intake, and a new pod
  opening up a fresh area of pharmacy operations. You'll build
  features that pharmacy and health system teams use every day
  to run compliance-critical work, not internal tools only
  other engineers will ever see.

  This is a senior role with real scope. You'll take a problem
  from a rough product idea to something live in production,
  and make sound technical calls along the way without needing
  every decision reviewed.

  - Real ownership, fast. We're past the earliest startup stage
    but still small enough that one engineer can define how a
    whole workflow works for hundreds of health systems.
  - Problems that matter. Pharmacy and health system teams are
    drowning in manual, compliance-critical work. What you
    ship directly changes how much of that work a human still
    has to do.
  - AI as a daily tool, not a slogan. We expect you to use AI
    deliberately in how you build, and we're building AI into
    the product itself.
  - Backing to build for the long term. Series B funding from
    investors including Bessemer Venture Partners, Notable
    Capital, and Danaher co-founder Mitchell Rales gives us
    the runway to invest in the engineering foundation, not
    just ship quick fixes.

  What You’ll Do

  - Build and ship full-stack features end to end, from the
    database to the UI, for workflows like 340B compliance,
    intake, rebate management, and claims reconciliation.
  - Partner directly with product managers and pharmacy
    operations experts to understand what pharmacy teams
    actually need, not just what's in the ticket.
  - Own what you ship: design it, build it, test it, deploy it,
    and support it in production.
  - Make sound tradeoffs between speed and durability as Plenful
    scales its platform to serve more health systems.
  - Contribute to the technical foundation of the platform,
    including how AI gets embedded into product workflows.
  - Use AI tools deliberately as part of how you work, not just
    how you demo.
  - Review code, weigh in on design docs, and help raise the
    technical bar across the team.

  You May Be a Fit If

  - You've spent 7+ years in professional software engineering,
    working across the stack.
  - You're proficient in JavaScript and TypeScript, with working
    proficiency in Python.
  - You've built customer-facing products — not primarily
    internal tooling or developer platforms.
  - You're comfortable moving across layers of the stack instead
    of staying in one.
  - You've worked in a fast-moving, high-growth environment
    where priorities shift as the product and customer base
    scale.
  - You have strong instincts for what "production-ready" means
    in a compliance-critical, enterprise healthcare context.
  - You communicate clearly with product, design, and non-
    technical stakeholders.
  - You're open to being based in San Francisco (hybrid, in-
    office Mondays and Wednesdays) or Chicago (remote).
  - Bonus points for experience with healthcare or pharmacy
    experience, or a track record at startups that scaled from
    0 to 1 and beyond.

  Why You'll Love Working Here

  - 🚀 Mission-Driven, World-Class Team — Join an exceptional
    group of professionals aligned around a meaningful mission
    and committed to making an impact
  - 📈 Opportunities for Growth — Strengthen your expertise
    through collaboration with experienced, high-performing
    leaders across the organization
  - 🏢 Flexible Hybrid Work Environment — We're remote-first,
    with meaningful office presence in San Francisco and New
    York. R&D roles follow a hybrid model, with two days per
    week in our San Francisco office

  Benefits & Perks

  - 🏥 Healthcare Coverage — Full medical, dental, and vision
    insurance for you and participation for your family
  - 💰 401(k) with Company Match — Plenful matches 50% of your
    first 3% contributed
  - 📊 Equity — Every full-time employee shares in our success
  - 🌴 Unlimited PTO — Take the time you need, when you need it
  - 🍽️ Daily Lunch Stipend — $100/week to cover your midday
    meals
  - 💪 Wellness Stipend — $100/month to support your health and
    well-being
  - 🚇 Commuter Benefits — $100/month for SF and NYC-based
    employees
  - 👶 Parental Leave — Paid leave to support growing families

  Compensation

  The compensation range for this position reflects the
  average span for this role. Where an offer lands depends on
  your experience, qualifications, and interview performance,
  measured against Plenful’s internal leveling guidelines and
  market benchmarks. We set offers individually.

  This role is also eligible to participate in Plenful’s
  equity plan, subject to the terms of the applicable plans
  and policies.
