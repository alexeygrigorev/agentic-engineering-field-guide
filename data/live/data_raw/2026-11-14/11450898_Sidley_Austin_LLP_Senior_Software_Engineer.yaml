description: |
  The Senior Software Engineer is a member of the Data & AI
  Engineering team responsible for designing, developing, and
  maintaining modern, scalable web applications that support
  the Firm's technology and business objectives. This position
  develops full-stack solutions using technologies such as
  .NET, React/Next.js, and Azure; contributes to technical
  design and architecture; and partners with product managers,
  designers, engineers, and other stakeholders to deliver
  reliable, secure, and maintainable applications.

  Duties and Responsibilities:

  - Design, develop, test, deploy, and maintain scalable full-
    stack applications using technologies such as .NET,
    React/Next.js, and Azure.
  - Own the delivery of complex features from technical design
    through implementation, deployment, and production
    support, ensuring solutions meet business and technical
    requirements.
  - Collaborate with product managers, designers, engineers, and
    other stakeholders to define requirements and deliver new
    application capabilities.
  - Develop clean, maintainable, and well-tested code with
    attention to application performance, reliability,
    observability, and maintainability.
  - Participate in code reviews and provide technical feedback
    to improve code quality, consistency, and knowledge
    sharing across the team.
  - Contribute to application architecture and recommend
    improvements to systems, development practices, and
    technical standards.
  - Monitor, troubleshoot, and improve application performance
    across front-end applications, APIs, services, and
    database interactions.
  - Apply security best practices throughout application
    development, including authentication, authorization, and
    data protection.
  - Partner with DevOps and other technical teams to support
    CI/CD pipelines, cloud deployments, and reliable
    production operations in Azure.
  - Provide technical guidance, coaching, and support to less
    experienced engineers and contribute ideas for continuous
    improvement based on emerging technologies and engineering
    practices.



  Education and Experience: Required:

  - Bachelor's degree in Computer Science, Software Engineering,
    a related field, or equivalent work experience.
  - A minimum of 5 years of experience in software development,
    including experience developing full-stack applications.
  - Advanced knowledge of modern web application development
    technologies and practices, including experience with
    .NET, React/Next.js, Azure, or comparable technologies.
  - Experience designing and developing scalable APIs and/or
    services.
  - Experience working with relational and/or NoSQL databases,
    such as SQL Server or PostgreSQL.
  - Experience with version control systems, such as Git, and
    Agile software development practices.
  - Demonstrated experience delivering production-quality
    software with attention to performance, reliability,
    observability, security, and maintainability.

  Preferred:

  - Experience with containerization and orchestration
    technologies such as Docker, Kubernetes, or Azure
    Container Apps.
  - Experience with cloud-native or serverless architectures.
  - Experience with automated testing frameworks and practices.
  - Experience with Azure or another major cloud platform.
  - Experience developing or integrating AI-enabled
    capabilities, including search, summarization, knowledge
    assistants, or LLM/AI services.

  Other Skills and Abilities:

  The following will also be required of the successful
  candidate:

  - Strong organizational skills
  - Strong attention to detail
  - Good judgment
  - Strong interpersonal communication skills
  - Strong analytical and problem-solving skills
  - Able to work harmoniously and effectively with others
  - Able to preserve confidentiality and exercise discretion
  - Able to work under pressure
  - Able to manage multiple projects with competing deadlines
    and priorities

  #LI-MR1

  #LI-Hybrid

  Applicants must be authorized to work in the United States
  without the need for employer sponsorship, now or in the
  future

  The target salary range for this role is:

  $93,900 - $147,500 if located in Illinois, New York, or
  Texas.

  Salaries vary by location and are based on numerous factors,
  including, but not limited to, the relevant market, skills,
  experience, and education of the selected candidate. Our
  compensation package also includes bonus eligibility and a
  comprehensive benefits program. Benefits information can be
  found at Sidley.com/Benefits.

  To perform this job successfully, an individual must be able
  to perform the Duties and Responsibilities above
  satisfactorily and meet the requirements. The requirements
  listed above are representative of the minimum knowledge,
  skill, and/or ability required. Reasonable accommodations
  will be made to enable individuals with disabilities to
  perform the essential functions of the job. If you need such
  an accommodation, please email
  sidleytalentacquisition@sidley.com (current employees should
  contact Human Resources).

  Sidley Austin LLP is an Equal Opportunity Employer.
