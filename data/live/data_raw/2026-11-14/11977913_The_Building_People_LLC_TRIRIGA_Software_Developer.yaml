  results of your reference/background check from The Building
  People, LLC.  Your position may require special
  credentialing, clearance, and access as a condition of
  employment.  In the event the government or client does not
  sponsor or approve your clearance, it may result in
  termination of your employment.

  If you need a reasonable accommodation for any part of the
