description: |
  The Building People delivers integrated solutions that
  connect technology, buildings, and people to optimize real
  estate performance, facility operations, and workforce
  outcomes. With over 450 contracts delivered across 187
  project locations, we manage more than 1,700 facilities and
  support $38.5B in federal and commercial assets. Leveraging
  AI-driven automation, data analytics, and platform-agnostic
  systems, we create high-performing, future-ready
  environments that reduce cost, improve efficiency, and
  enable mission success. Founded in 2012, we now have over
  450 employees supporting 23 federal agencies—making us a
  trusted leader in delivering technology-infused building
  solutions across the public sector.

  The Building People is committed to fostering a workplace
  where every employee can thrive. Using tools like the
  Predictive Index, we thoughtfully align individual strengths
  with team needs -ensuring the right fit, the right role, and
  long-term success.

  Our culture is rooted in integrity, innovation, and service.
  Through our growing philanthropy program, we support
  communities by focusing on gratitude, giving back,
  partnerships, and mentorship.

  Our Market Offerings Include:

  - Real Estate & Workplace
  - Facilities Management
  - Facilities Operations & Maintenance
  - Project Management & Engineering
  - Workforce Transformation & Organizational Design
  - Mission Support
  - Smart Buildings & Energy Efficiency
  - Technology Solutions

  Join our rapidly growing team and help shape the future of
  real estate, facilities, and community impact.

  Please note that this position is for an upcoming position.
  We are, however, accepting applications for this anticipated
  need. If you are interested in joining The Building People,
  we encourage you to APPLY TODAY!

  The Building People are seeking a qualified TRIRIGA Software
  Developer to support the client-based IBM TRIRIGA solution
  delivery using various COTS solution technologies to support
  a growing portfolio of federal government, local government,
  non-profit, and commercial customers – all while operating
  remotely.

  The TRIRIGA Software Developer will provide direct
  consulting services in assisting with implementation and
  business transformation as it relates to TRIRIGA for an
  enterprise solution merging the capabilities of Real
  Property Asset Management (RPAM), Computerized Maintenance
  Management System (CMMS).

  Provide expertise to execute and report results of multiple
  analytical tasks related to facility operations and
  management, and development of long- and short-range
  strategies with customer stakeholders and teams.

  - Design solutions to identified problems.
  - Hands on experience in TRIRIGA application setup, and
    configurations.
  - Experience in end-to-end implementation of TRIRIGA.
  - Develop comprehensive project documentation, technical
    reports, test cases, and workflows.
  - Complete assigned tasks on time, within budget, and
    respecting the scope provided.

  Minimum Requirements:

  - At least seven years of related technical experience with
    TRIRIGA or another Facilities Management system.
  - Work with the business sponsor and end users to develop
    requirements to be implemented in TRIRIGA.
  - Work with the TRIRIGA team to best implement the user
    requirements.
  - Develop functional requirements design document (FRDD)
  - Work with the TRIRIGA development team to determine a level
    of effort (LOE)
  - Work with the business sponsor so they can develop test
    cases and answer their questions concerning TRIRIGA.
  - Work with the TRIRIGA development team to answer questions
    and provide guidance on options and how to best implement
    solutions within TRIRIGA.
  - Understand how to customize and configure the TRIRIGA COTS
    application.
  - Ability to interpret documented requirements and communicate
    to technical (software) teams.
  - Ability to work with maintenance technicians, stakeholders,
    and technical staff.
  - Clear communication skills.
  - Ability to operate independently.
  - Strong problem solving and troubleshooting skills.
  - Working within modern cloud environments (AWS, Azure).

  Education:

  - 7+ years of relevant experience with an AA/AS degree
  - Preferred: 5+ years of relevant experience with a BS degree
  - Preferred: TRIRIGA certifications

  Additional Requirements:

  - Self-motivation and desire to always deliver with
    excellence.
  - Organized with the ability to multitask.
  - High attention to detail.
  - US Citizenship.
  - Ability to meet Federal & DoD Gov’t security background
    checks, HSPD-12, Fingerprinting, plus agency-specific
    screening.
  - 2+ years successfully working from home or remote location,
    with minimal supervision.
  - Operate within a NIST 800-171 compliant security environment
    internally and able to support all client-required cyber
    security data and operational processes. Value and protect
    company, colleague, and customer data.
  - Operate within a home office environment that provides
    adequate workspace and high-speed internet connectivity.

  *Salary offered will be commensurate with the candidate's
  experience, qualifications, and certifications.

  *Our positions may require a background screening and
  clearance directly from the Government.

  *Please note that telework arrangements are subject to
  change based on customer requirements.



  ADDITIONAL INFORMATION

  Competitive benefits for eligible employees include:

  - Medical & Rx
  - Dental
  - Vision
  - Flexible Spending Accounts
  - 401(k) Retirement Plan
  - Life Insurance/AD&D
  - Long Term Disability and Short-Term Disability
  - Paid Time Off
  - Holiday Pay

  All positions require a background check after acceptance of
  our offer. The selected candidate will be eligible to begin
