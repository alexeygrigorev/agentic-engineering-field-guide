description: |
  About Digital Asset & the Canton Network Digital Asset
  builds the technologies that are reshaping the foundations
  of financial markets. Our mission is to create the world’s
  most trusted, privacy-enabled, and interoperable digital
  infrastructure for global finance. At the heart of this
  mission is the Canton Network — the blockchain purpose-built
  for institutional finance. Uniquely combining privacy,
  compliance, and scalability, Canton enables real-time,
  secure settlement across multiple asset classes. Governed by
  the Canton Foundation with participation from leading
  financial institutions, it is the proven link between the
  promise of blockchain and the power of global finance.
  Founded in 2014 and headquartered in New York City, with
  offices in London, Zurich, Budapest, Hong Kong, and Sydney —
  we are on a mission to transform finance — and that
  transformation is now playing out rapidly on the Canton
  Network. If you’re interested in playing a crucial role at
  the intersection of traditional and crypto-capital markets
  and want to help bring the next trillion dollars of finance
  on-chain, join us.

  Job requirements

  - 8+ years of software engineering experience, including a
    history of successfully delivering complex systems or
    integrations.
  - Technical Breadth: Comprehensive understanding of full-cycle
    technical delivery, from system design and API strategies
    to cloud architecture and data modeling
  - Has working knowledge of our product and Canton OS source
    code
  - Delivery Excellence: Ability to establish engineering
    standards, design reusable components, and unblock
    delivery teams across multiple workstreams
  - Consultative Mindset: Experience in a consulting or client-
    facing role; able to translate complex business
    requirements into scalable technical roadmaps
  - Strong financial services domain knowledge and experience
  - Thrives in a fast-moving environment with multiple competing
    priorities
  - Curious, pragmatic and adaptable, and able to learn quickly
    in complex environments

  Job responsibilities

  Opportunity The Digital Asset Client Experience (“CX”) Team
  works with enterprise clients to enable financial
  institutions and organizations to bring efficient, modern
  and scalable Daml based solutions for multi-party workflows
  into production. CX Team members provide advisory services
  to a large and diverse set of clients, and are involved in
  the end-to-end client relationship from pre-sales and
  business development, requirements and solution design,
  through to software delivery and implementation. The Staff
  CX Software Engineer is a role for people that come with
  prior experience and exposure to distributed computing,
  Canton Network and our product, including topology and
  performance considerations. These individuals will stand in
  front of a client to provide sound advice, and to provide a
  technical leadership role for the team when working with
  clients on client solutions. They are comfortable with
  facing off to executive leadership. Provides direction to
  clients on physical and logical architectures for Canton
  Network solutions and integration

  - Gives direction on Canton Network topology concerns.
  - Coordinates and leads planning of complex, cross-functional
    initiatives
  - Serves as the expert in Canton Network and DA Products
  - Leverages proficiency in multiple other languages.
  - Estimates highly complex solutions and systematically
    decompose complex technical problems to arrive at a
    solution
  - Defines strategy for a performance test plan: proactively
    reasons about, identifies, and remediates performance
    issues in solutions using Canton Network and DA Product
    components; and prioritizes salient performance concerns
    of a system
  - Leverages a level of expertise in a subset of Canton Network
    and DA Products
  - Acts as a subject matter expert for other CX staff
  - Works with and customizes helm charts to enable a client
    easy onboarding to k8s

