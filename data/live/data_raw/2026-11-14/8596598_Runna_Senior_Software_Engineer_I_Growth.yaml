description: |
  We're putting together a talented team to build the #1
  training platform for Runners

  We help everyday runners become outstanding by building an
  incredible app providing world-class training, coaching and
  community for everyone, whether you're improving your 5k
  time or training for your first marathon.

  We’re growing extremely fast! In November 2023 we closed a
  $6.5M funding round led by JamJar with participation from
  Eka Ventures, Venrex and Creator Ventures. In 2024, we were
  selected by Apple as one of three global finalists for the
  iPhone app of the year, reflecting the innovation and impact
  of what we’ve built & in 2025 we were acquired by Strava!

  Our ambition is huge: to become the go-to global leading
  training platform for millions of runners everywhere. We’re
  growing with purpose and looking for people who want to
  build something meaningful with lasting impact. With the
  recent acquisition by Strava accelerating our journey, now
  is a really magical time to join. 🚀

  The Team You'll Join

  Our Growth Engineering team owns key parts of the user
  journey into Runna, working across web and app to turn first
  time visitors into long term, engaged subscribers. You'll
  collaborate closely with product, design and data partners,
  as well as our GTM and business development teams, to shape
  how new users first discover and experience Runna.

  We follow a flexible hybrid model that translates to more
  than half of your time on-site - 3 days per week in Runna's
  office based in London, UK.

  What You'll Be Doing

  - Architect, build, test and ship high impact user journeys
    and subscription funnels, focusing on turning curious
    visitors into engaged subscribers.
  - Design and run experiments across web and app - onboarding
    flows, paywalls, plan discovery - to improve conversion at
    every step.
  - Work closely with Product, Design and Data to help
    prioritise opportunities, define success metrics and make
    decisions grounded in experiment results.
  - Collaborate across teams to ensure users have a smooth,
    consistent experience as they move between products and
    platforms.
  - Implement and maintain instrumentation, tracking and tooling
    so we can understand behaviour, spot issues quickly and
    measure impact.
  - Own features end-to-end: from early discovery and technical
    design through to implementation, rollout, monitoring and
    iteration.
  - Contribute to our developer experience by improving CI/CD,
    testing and release workflows so the team can ship and
    learn quickly.

  What You'll Bring to the Team

  We're looking for people who are strong in some of these
  areas, not necessarily all of them. If this role excites
  you, please apply.

  - Solid TypeScript / JavaScript experience.
  - Experience building user-facing product surfaces where
    conversion and UX really matter — onboarding, paywalls,
    landing pages, growth loops, etc.
  - React experience (React Native is a bonus, not a
    requirement).
  - 2+ years of full stack experience — we value full stack
    experience more than depth in just one layer.
  - Comfortable working in a fast paced, iterative environment
    with lots of experimentation and learning from data.
  - Able to deliver features end-to-end: from architecture
    through to rollout, measurement and iteration.
  - Curious about what didn't work as much as what did.

  How We Work

  We believe great engineering is a team sport. Here's what
  that looks like in practice:

  - Iterative development, continuous deployment and test
    automation.
  - Knowledge sharing and collaborative design — we build
    together, not in silos.
  - Shared ownership of code and outcomes across cross-
    functional teams.
  - Psychological safety to experiment, fail, learn and try
    again.

  Bonus Points

  These are optional extras, not hidden requirements:

  - Experience with Swift or Kotlin for mobile.
  - Experience working on growth, experimentation, or funnel
    optimisation teams.
  - Experience with analytics and experimentation tooling (A/B
    tests, feature flags, etc).

  Our Tech Stack

  Here's what we work with. You won't need all of it on day
  one.

  Frontend

  - React or React Native (iOS and Android)
  - TypeScript
  - GraphQL (Apollo Client)

  Backend

  - Node.js
  - Serverless (AWS) — Lambdas, SQS, DynamoDB, EventBridge, S3

  Tools & Platforms

  - Sentry, GitHub Actions
  - Mixpanel, Intercom, RevenueCat
  - App Store Connect / Play Store
  - Google Tag Manager, Snowflake

  Salary and Benefits

  We’re offering a salary of £70,00 - £85,000 per year,
  depending on experience, plus participation in Strava's
  long-term incentive (stock) programs. Overview of our
  benefits is below:We’re also committed to continually
  evolving our benefits to support you as we grow.

  Here is a brief overview what we currently offer in the UK
  🇬🇧

  - 💪 Flexible working — typically 3 days a week in our Vauxhall
    office, with flexibility around life commitments.
  - 🏝️ 25 days holiday plus bank holidays.
  - 🏥 Private health insurance (Bupa) and workplace pension
    scheme.
  - 📚 Modern Health — mental wellness platform combining
    therapy, coaching and self guided programmes.
  - 🥕 Carrot Fertility — inclusive fertility, hormonal health
    and family forming support. We want everyone to feel
    supported in building their family, whatever that looks
    like.
  - 😌 Headspace membership for mindfulness and sleep.
  - 💵 Annual budget for gear, events and gym.
  - 💳 Free Runna and Strava subscriptions for you and 3 friends.

  Please see more info on our amazing benefits here: Benefits
  at Runna

  Runna is committed to building a diverse and inclusive team.
  We particularly encourage applications from groups that are
  underrepresented in engineering, including women, people of
  colour, and LGBTQ+ people.

  Please let us know if there’s anything we can do to better
  accommodate you throughout the interview process - this can
  be from scheduling interviews around childcare commitments
  to accessibility requirements. We want you to show your best
  self in the process, so please speak to your Talent Partner
