description: |
  Why Join GEICO?

  At GEICO, we offer a rewarding career where your ambitions
  are met with endless possibilities.



  Every day we honor our iconic brand by offering quality
  coverage to millions of customers and being there when they
  need us most. We thrive on relentless innovation to exceed
  our customers' expectations while making a real impact on
  local communities nationwide.



  Founded in 1936, GEICO is a member of the Berkshire Hathaway
  family of companies and one of the largest auto insurers in
  the United States. When you join our company, we want you to
  feel valued, supported, and proud to work here. That's why
  we offer the GEICO Pledge: Great Company, Great Culture,
  Great Rewards, and Great Careers.

  At GEICO, we offer a rewarding career where your ambitions
  are met with endless possibilities. Every day we honor our
  iconic brand by offering quality coverage to millions of
  customers and being there when they need us most. We thrive
  through relentless innovation to exceed our customers’
  expectations while making a real impact for our company
  through our shared purpose. When you join our company, we
  want you to feel valued, supported and proud to work here.
  That’s why we offer The GEICO Pledge: Great Company, Great
  Culture, Great Rewards and Great Careers. The Marketing
  Solutions Engineering group within Marketing Data Operations
  (MDO) provides dedicated stewardship of marketing-critical
  platforms and integrations across the first-party and third-
  party ecosystem. We partner closely with stakeholders across
  Marketing, Product, and Engineering to ensure solutions are
  designed, delivered, and maintained to meet the needs of the
  Marketing end user. As the founding Senior Manager of
  Marketing Solutions Engineering, you will build this group
  from the ground up, establishing the standards, team
  culture, and cross-functional trust that allow GEICO’s
  marketing organization to operate with the coherence, speed,
  and compliance that modern, data-driven marketing demands.
  Join the team behind one of the most beloved brands in the
  country. GEICO's marketing organization sets a high bar for
  excellence, bringing together business acumen, strategic
  insights, and collaborative culture to develop best-in-class
  work that is disruptive, resonant, and built to perform. Job
  Summary As the Senior Manager of Marketing Solutions
  Engineering, you are the primary functional lead within
  Marketing for marketing’s platform integration strategy
  across the first-party and third-party ecosystem. You lead a
  team of domain solution engineers across Data, Governance,
  and AI, whose collective purpose is to provide dedicated,
  end-to-end technical ownership for every layer of
  marketing’s platform and integration landscape. In this
  role, you translate strategy into direction, set the vision
  and standards for the group, and partner with marketing
  leadership to translate business priorities into the
  roadmap, and serve as the senior technical point of contact
  across Marketing, Product, Engineering, Legal, and external
  vendors. You are equally responsible for your team’s
  effectiveness as solution engineers and their influence as
  trusted partners across the organization. You translate
  marketing strategy into direction, establish the governance
  and standards that keep solutions coherent and maintainable,
  and own follow-through on the group’s most complex, cross-
  domain delivery commitments. The ideal candidate is a full-
  stack practitioner who has operated at the intersection of
  data, activation, governance, and AI in a complex marketing
  organization, and who leads with technical conviction,
  communicates with clarity to executives, product managers,
  marketers and engineers alike, and has the credibility to
  establish a new group as a trusted technical partner across
  the business. What Success Looks Like • The domain solution
  engineers have clear direction, standards, and
  organizational support to operate as effective, trusted
  owners within their domains. • Marketing leadership,
  Product, and Engineering consistently engage the Marketing
  Solutions Engineering group as the leading voice for
  marketing’s platform integration decisions. • Integration
  decisions across the marketing ecosystem have a clear owner
  and are made with the right stakeholders informed and
  aligned, with tradeoffs surfaced and accountability
  maintained. • You are trusted as the single-threaded owner
  for the group’s roadmap and cross-domain follow-through,
  ensuring the team operates with coherence across all
  domains. Key Responsibilities • Team leadership & direction:
  • Recruit, build, and lead a team of marketing solution
  engineers, providing direction, mentorship, and performance
  alignment. • Set the vision and standards for marketing’s
  landscape: defining integration patterns, platform selection
  criteria, and the principles that govern how first-party
  systems and third-party vendor ecosystems are assembled and
  integrated to support marketing capabilities. • Provide
  oversight across all domains, ensuring consistency,
  coherence, and appropriate governance across the full
  ecosystem. • Establish team-level standards and partner with
  Technology, Legal/Privacy, and governance stakeholders to
  apply integration patterns, data governance practices,
  privacy requirements, and AI controls spanning both internal
  systems and external vendor configurations. • Serve as the
  escalation point for cross-domain decisions, tradeoffs, and
  issues that cut across domains. • Roadmap & cross-functional
  solutioning: • Develop and maintain the roadmap, working
  with the Director of Marketing System Design and marketing
  leadership to align investments with business priorities and
  the broader marketing transformation. • Translate marketing
  strategy and business priorities into digestible direction;
  ensure the group’s work is consistently connected to
  marketing outcomes. • Own follow-through on the group’s most
  complex, cross-domain deliverables, driving alignment,
  decisions, and issue resolution across teams. • Provide
  leadership for marketing’s AI initiative, ensuring the AI
  Solutions Engineer has the platform, data, and governance
  foundations needed to succeed. • Serve as the core knowledge
  keeper for marketing’s technology landscape; establish
  documentation standards, decision records, and practices
  that codify institutional knowledge across the full
  ecosystem. • Stakeholder leadership: • Act as the senior
  technical point of contact for Marketing leadership,
  Technology, Product, Legal/Privacy, and external vendors;
  translate business strategy into step-by-step direction and
  communicate decisions clearly to diverse audiences. •
  Partner closely with the Director of Marketing System
  Design, serving as the technical counterpart to marketing’s
  strategy and operating model design. • Build and maintain
  credibility and trust across Marketing, Product, and
  Engineering leadership by establishing the Marketing
  Architecture group as an indispensable partner, not a
  gatekeeping function. • Represent marketing’s technology
  capability interests in enterprise-level forums and
  technology governance processes, including alignment with
  our Customer Experience Architecture and related platforms •
  Lead vendor engagement at the technical level, ensuring
  external platform partners understand GEICO’s existing
  architectural standards and integration requirements.
  Required Qualifications • 10+ years of experience in
  Solutions Engineering, Solutions Architecture, Digital
  Analytics, or a closely related technical field with hands-
  on work in marketing platforms, with at least 3 years in a
  technical leadership role managing architects or senior
  individual contributors. • Full-stack fluency across the
  marketing platform ecosystem: CDPs, tag management, data
  warehousing, marketing automation/ESP, content platforms,
  governance frameworks, and AI/ML integration spanning both
  first-party systems and third-party vendor ecosystems. •
  Deep, hands-on experience with first-party and third-party
  marketing platform integrations, including data exchange
  patterns, vendor API management, and the governance
  frameworks that apply across the 1P/3P boundary. • Proven
  ability to lead multidisciplinary technical teams in
  matrixed organizations, with a track record of building
  credibility and influence across Marketing, Technology, and
  Product leadership. • Strong communication skills;
  demonstrated ability to translate complex architectural
  strategy to both executive and engineering audiences, and to
  build organizational trust for a new team’s mandate. •
  Working knowledge of privacy regulations and their technical
  implications for marketing data architecture and vendor
  ecosystem management. Preferred Qualifications • Hands-on
  experience with major marketing platforms including Adobe
  Experience Platform, Salesforce Marketing Cloud, Braze,
  Snowflake, and leading CDPs (Segment, Tealium, Hightouch). •
  Background in large-scale marketing platform transformation
  or modernization at a complex organization, including vendor
  evaluation, platform migration, and architectural
  consolidation. • Experience designing or leading
  integrations in an organization undergoing significant AI
  enablement, including agent frameworks and AI-powered
  marketing capabilities. • Familiarity with clean room
  technologies, data collaboration platforms, and second-party
  data ecosystems. • Experience with full-lifecycle vendor
  management: evaluation, negotiation, technical onboarding,
  integration architecture, and ongoing governance.



  Annual Salary

  $130,000.00 - $260,000.00

  The above annual salary range is a general guideline.
  Multiple factors are taken into consideration to arrive at
  the final hourly rate/ annual salary to be offered to the
  selected candidate. Factors include, but are not limited to,
  the scope and responsibilities of the role, the selected
  candidate’s work experience, education and training, the
  work location as well as market and business considerations.



  At this time, GEICO will not sponsor a new applicant for
  employment authorization for this position.

