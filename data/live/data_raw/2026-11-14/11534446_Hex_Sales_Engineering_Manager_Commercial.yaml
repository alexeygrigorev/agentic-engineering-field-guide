description: |
  About Hex

  Hex is growing our team of builders on a mission to make
  everyone a data person. Our platform solves key pain points
  with today’s data and analytics tooling, and empowers anyone
  to explore data using natural language, with or without
  code, on trusted context. Thousands of customers like Ramp,
  Figma, Stubhub, Anthropic, and Gamma love Hex for our
  beautiful UI, agentic superpowers, and boundless
  flexibility.

  Hex has raised over $100M from leading investors like
  Sequoia, a16z, Snowflake and Amplify. With office hubs in
  San Francisco and New York, as well as remote team members
  throughout the US and UK, we’re a high-agency team that
  ships fast and has fun doing it. Check out our Intro to Hex
  video and employee handbook to learn more about what it’s
  like to work at Hex.

  About the Role

  We're looking for a thoughtful and driven Sales Engineering
  Manager to lead our East Coast Commercial SE team,
  supporting both SMB and Mid-Market segments. In this role,
  you'll shape and scale the technical sales strategy that
  fuels our growth, build a high-performing and collaborative
  team, and partner cross-functionally to drive product
  alignment and operational excellence. If you're excited to
  help growing companies evaluate and adopt Hex by empowering
  a team of exceptional SEs, this might be your next
  adventure.

  Responsibilities

  - Hire, onboard, and develop top-tier Sales Engineers through
    direct coaching, feedback, and mentorship
  - Own the technical win across new business and expansion
    deals within the Commercial segment, partnering closely
    with Sales leadership to exceed revenue targets
  - Guide and support the team in competitive deal cycles,
    navigating technical challenges, and executing technical
    evaluation motions (demos, POCs, hands-on workshops, etc.)
  - Foster a collaborative team culture grounded in trust,
    growth, and great vibes
  - Partner with Enablement, Post-Sales, Product/Engineering,
    and Product Marketing teams to ensure our technical sales
    strategy is aligned with product direction, market trends,
    and customer needs
  - Own the systems, tools, and investments the team will use
    day to day to operate as efficiently as possible
  - Leverage data to track team performance, deal progression,
    and areas for improvement

  About You

  - You have 2+ years of experience leading technical pre-sales
    teams, ideally in high-growth SaaS environments
  - You have a successful track record as a Sales Engineer
    winning deals in high velocity, competitive environments
  - You are passionate about developing talent and creating an
    environment where people can do their best work
  - You're comfortable jumping into deals when it’s required,
    unblocking technical issues, and helping your team win
  - You thrive working cross-functionally and see feedback,
    enablement, and collaboration as core parts of your role
  - You're excited about how AI is transforming the data
    ecosystem and can translate that vision for our customers
  - You bring clarity, action, and accountability to everything
    you do



  If you want to learn more about the Customer team, what we
  do, and how we work, please check out our team page!

  The on-target-earnings (OTE) for this role is: $236,000 -
  315,500 OTE

  In addition to our unique culture, Hex proudly offers a
  competitive total rewards package, including but not limited
  to, market-benched salary & equity, comprehensive health
  benefits, and flexible paid time off.

  The salary range shown may be a reflection of additional
  factors such as geographical location and skill
  ranges/levels we’re open to. Placement in the salary range
  will be decided upon completion of the interview process,
  taking into account factors like leaving room for growth,
  internal fairness & parity, your demonstrated skills, and
  the depth of your experience. Our Recruiting team will be
  able to provide more details during the interview process.

  By submitting an application the candidate consents to the
  use of their personal information in accordance with the Hex
  Privacy policy: https://learn.hex.tech/docs/trust/privacy-
  policy.
