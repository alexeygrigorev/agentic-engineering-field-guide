description: |
  Some key info for you:

  🌱 We were founded in 2007

  💰 We have provided over $3bn of funding to small businesses
  so far

  🚀 We have been named in CNBC & Statista Top 150 UK Fintechs
  for 2025

  🌍 We're a global team, with a dynamic presence in 6 key
  locations around the world

  🧠 We're a thriving community of over 290 innovative minds

  👩🏾 🤝 👨🏼 We're a vibrant melting pot, celebrating over 27
  nationalities in our team

  🏢 Our team brings experience from over 740 previous
  companies, from startups to global giants

  🎯 We have just been named as one of FinTech’s Finest 50 by
  Welcome to the Jungle

  💪 We’re proud to be an accredited Real Living Wage employer,
  ensuring everyone is paid fairly for the great work they do

  Our Product & Engineering Team:

  Liberis is building the embedded finance platform that lets
  partners around the world offer innovative funding products
  to their small business customers. We're a growth-stage
  fintech with teams in London, Nottingham, Atlanta,
  Stockholm, Munich and Mumbai, and we’re building a global
  Product, Data & Engineering team that thrives on autonomy,
  ownership, and is focused on impact! Our teams solve real-
  world problems for small businesses, shaping products that
  unlock opportunity at scale.

  Engineering is going through an AI-first transformation,
  rethinking how teams are structured and how they ship. It's
  changing what a small team can do! We empower our teams to
  make decisions, move fast, and take full responsibility for
  the solutions they deliver. You’ll join a team where
  curiosity is encouraged and collaboration across Product,
  Data, Delivery and Engineering is the norm.

  The role:

  At Liberis, we’re building a global engineering team that
  thrives on autonomy, ownership, and  focused on impact. Our
  engineers don’t just write code — they solve real-world
  problems for small businesses, shaping products that unlock
  opportunity at scale. As a Senior Engineer, you will be a
  key mentor to other members of the Engineering team -
  supporting us to continually develop and push the boundaries
  of what a scaling, multi-product FinTech organisation can
  achieve!

  We're hiring across a number of teams in our Engineering
  org, so we'd love to have a conversation about where you
  could make the biggest impact!

  You'll start with an informal chat with Chess (our Internal
  Recruiter), who will give you more insight into Liberis and
  what you're looking for next. From there, we'll talk you
  through the teams we're hiring for and look at which roles
  could be the best fit.

  Whether you're passionate about building customer-facing
  products, scaling platforms, working with data, or exploring
  how AI can transform the way we build software, we're
  looking for engineers who enjoy solving complex problems and
  taking ownership of what they deliver!

  The interview process:

  - Screening call with Chess (Internal Recruiter) (30 mins)
  - Video interview with the Hiring Manager (45 mins)
  - In person code pairing interview with a member of
    Engineering team (1 hour)
  - Video interview with the wider Liberis team (1 hour)

  What We Think You’ll Need

  - Proven success writing code in two or more programming
    languages.
  - A willingness to learn our tech stack - mostly C# .net, Node
    and React.
  - Proven experience developing APIs and services
  - An understanding of working with Agile methods, such as
    Extreme Programming, Kanban, or Scrum.
  - Experience mentoring more junior team members.
  - Resilience in early-stage business situations, where
    requirements are evolving and experimentation is required.
  - Bonus points if you have experience of cloud technologies
    (we are moving to GCP); experience using highly
    collaborative methods such as ensemble, mob, or pair
    programming; experience writing financial software; or
    experience with Test Driven Development.

  N.B - there is an ‘on-call’ element to this role, which
  Chess will outline at the screening stage

  Next steps If this opportunity feels like the right fit for
  your next career move, we’d love to hear from you!

  Even if you don’t meet every requirement, don’t hesitate to
  apply or reach out to Chess (Internal Recruiter) on
  chess.crossley@liberis.com

  Our hybrid approach

  Working together in person helps us move faster, collaborate
  better, and build a great Liberis culture. Our hybrid
  working policy requires team members to be in the office at
  least 3 days a week, but ideally 4 days. At Liberis, we
  embrace flexibility as a core part of our culture, while
  also valuing the importance of the time our teams spend
  together in the office

  #LI-FC1
