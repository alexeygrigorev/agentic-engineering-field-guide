description: |
  AmeriSave Mortgage Corporation is a leading fintech lender
  transforming the way people finance their homes. With a
  strong foundation in digital innovation, AmeriSave is
  expanding beyond mortgages to offer home equity loans and
  personal loans—covering every type of consumer loan. Our
  mission is to simplify and modernize the lending experience
  through technology, automation, and AI-driven solutions. We
  are a fast-paced, customer-focused organization that values
  transparency, agility, and excellence.

  Responsibilities:

  - Design, develop, and maintain robust and scalable web
    applications using TypeScript, HTML, CSS, Java, and
    Node.js in a microservice environment.
  - Collaborate with cross-functional teams to define, design,
    and ship new features quickly.
  - Write clean, maintainable, and efficient code in TypeScript
    and Java.
  - Optimize applications for maximum speed and scalability.
  - Troubleshoot and debug applications to ensure optimal
    performance.
  - Implement data storage solutions using MS SQL and ensure
    data integrity.
  - Participate in code reviews to maintain code quality and
    ensure best practices.
  - Stay up-to-date with the latest industry trends and
    technologies to bring innovative solutions to the table.
  - Work in the CST timezone to ensure seamless collaboration
    with the team.
  - Design and develop user interfaces with HTML, CSS and/or
    generated by JSON.
  - Perform DOM manipulation to create dynamic and interactive
    web pages.
  - Ensure cross-browser compatibility and responsiveness of web
    applications.

  AI-Specific Responsibilities:

  - Build and deploy AI-powered applications using LLMs, GenAI
    agents, and retrieval-augmented generation (RAG)
    pipelines.
  - Integrate AI services into full-stack solutions using
    frameworks like LangChain, FastAPI, or Azure OpenAI.
  - Handle unstructured data (PDFs, HTML, audio, images) and
    multimodal models.
  - Implement LLMOps practices including prompt versioning,
    caching, observability, and cost tracking.
  - Collaborate with AI/ML engineers and data scientists to
    embed intelligent automation and decisioning into
    enterprise workflows.
  - Contribute to the development of semantic search, vector
    databases (e.g., Pinecone, Supabase), and AI-enhanced user
    experiences.

  Requirements:

  - Experience: Minimum of 5 years of professional experience in
    full stack development.
  - Technical Skills:
  - Problem-Solving: Strong analytical and problem-solving
    skills.
  - Collaboration: Excellent communication and teamwork skills,
    with the ability to work effectively in a remote
    environment.
  - Attention to detail in evolving requirements and stability
    of services.

  Preferred Qualifications:

  - Experience with other frontend frameworks/libraries,
    including micro frontends.
  - Familiarity with Redis, pub/sub concepts.
  - Familiarity with containerization technologies such as
    Docker.
  - Knowledge of cloud platforms, preferably Azure.
  - Experience with CI/CD pipelines and DevOps practices.
  - Experience with AI-enhanced UI/UX design and intelligent
    user flows.
  - Exposure to vector databases, semantic search, and AI
    observability tools.
  - Experience with a leading Mortgage LOS and experience with
    custom software platforms.
  - Expertise and hands-on experience with Aloha software.
  - Familiarity with mortgage compliance frameworks such as
    HMDA, TRID, RESPA, and ECOA.

  High-speed internet required for remote work, Cable or Fiber
  ONLY with the ability to connect via Ethernet. Minimum
  speeds: 70/30 Mbps (basic), 200-300/35-70 Mbps (shared),
  500-1,000/100+ Mbps (heavy use).

  `

