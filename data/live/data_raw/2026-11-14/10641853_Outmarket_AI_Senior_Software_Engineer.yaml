description: |
  ABOUT OUTMARKET

  Outmarket is the AI platform for insurance, trusted by more
  than 250 brokerages to run the work their business depends
  on. Commercial insurance still runs on dense documents and
  slow, manual workflows, and that is exactly what we
  automate: quote comparisons, coverage gap and tower
  analysis, policy review, and proposal generation, all
  grounded in our customers’ own data and source-cited so
  teams can trust the output.

  The impact is concrete. Teams save 12 to 15 hours per person
  every week, cut errors by roughly 65 percent, and win more
  business, all on infrastructure that is SOC 2 Type II
  certified, single-tenant, and never used to train AI models.
  We are an AI-first company in both what we build and how we
  work, shipping quickly and in close partnership with the
  agencies that rely on us.

  WHAT YOU’LL GET

  - A high-impact role with ownership from day one.
  - Competitive compensation and meaningful equity.
  - Direct collaboration with founders and real users.
  - Remote-first flexibility.
  - The opportunity to help build an AI-native product from the
    ground up.

  ABOUT THE ROLE We are hiring a Senior Software Engineer to
  own meaningful parts of our AI-powered product end to end.
  You will lead the design and delivery of features and
  systems, set quality standards, and help less-senior
  engineers grow.

  WHY THIS ROLE

  - Own systems and features that are core to the product.
  - Shape technical direction and standards as the company
    scales.
  - Partner closely with founders on high-leverage problems.

  WHAT YOU’LL DO

  - Lead the design, build, and operation of features spanning
    AI, backend, and frontend.
  - Make pragmatic architecture decisions and drive them to
    production.
  - Raise the bar on code quality, testing, and reliability
    across the team.
  - Mentor engineers and review work to keep velocity and
    quality high.

  WHAT WE’RE LOOKING FOR

  - 4+ years building and shipping production software.
  - Deep proficiency in Python and/or TypeScript, plus strong
    SQL and system design.
  - Track record of owning features end to end in a fast-moving
    environment.
  - Ability to turn ambiguous, messy problems into reliable,
    shipped systems.

  BONUS IF YOU HAVE

  - Experience with LLM-integrated products, Postgres,
    ClickHouse, or React at depth.
  - Early-stage startup experience.
