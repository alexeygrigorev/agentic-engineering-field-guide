description: |
  Within Digital & Data Solutions (DDS), Asset Engineering
  develops and delivers engineering software and digital
  solutions for customers across the energy and maritime
  industries. The portfolio includes Sesam and Bladed,
  supported by DNV’s wider technical expertise and global
  organisation.

  DNV is seeking an experienced, commercially driven Sales
  Manager to develop and grow an assigned customer portfolio,
  with primary responsibility for Norway and selected Nordic
  accounts.

  The main focus is proactive account development and
  effective management of existing and strategic customers,
  alongside selected new-logo opportunities where
  strategically relevant.

  This is an end-to-end sales role in which the Sales Manager
  will lead all commercial activities within the assigned
  scope, from account strategy, opportunity identification and
  qualification through solution positioning, proposals,
  negotiation, contract execution, closing and follow-up.

  The role combines hands-on sales execution, structured
  account management, strategic relationship development and
  cross-functional team coordination. It will operate in
  alignment with relevant Energy Systems account-management
  principles, disciplined Salesforce use and a One-DNV
  approach.

  Key Markets

  - Offshore Oil & Gas Operators and Engineering Contractors
  - Offshore Wind Developers, Asset Owners and Operators
  - EPC Companies, Engineering Consultancies and Design Houses

  Responsibilities

  Account Growth & Customer Engagement

  - Own and lead day-to-day commercial relationships and
    account-development activity for an assigned portfolio of
    strategic and growth customers.
  - Develop and execute actionable account plans covering
    customer priorities, key stakeholders, DNV engagement,
    growth opportunities, competitive positioning, risks and
    agreed actions.
  - Build strong, multi-level relationships with technical,
    operational, commercial, procurement and executive
    stakeholders through regular customer engagement.
  - Understand customer strategies, projects and technical
    challenges and translate these into clear engagement and
    growth actions.
  - Increase adoption and share of wallet through cross-selling,
    upselling and the strategic introduction of broader Asset
    Engineering and DNV capabilities.
  - Support customer retention and recurring revenue performance
    through effective account management, early identification
    of risk and development of expansion opportunities. The
    precise scope will reflect the commercial operating model
    and assigned accounts.

  End-to-End Sales Ownership

  - Lead the complete sales lifecycle within the assigned scope,
    maintaining commercial ownership and momentum from initial
    customer engagement through contract execution and follow-
    up.
  - Identify, qualify, develop and close opportunities across
    account expansion, cross-selling, upselling, renewals
    where applicable and selected new-logo opportunities.
  - Develop compelling value propositions that explain the
    technical and commercial value of Sesam, Bladed and other
    relevant solutions.
  - Lead customer engagement, proposals, commercial discussions
    and contract negotiations while coordinating internal
    commercial, technical and legal resources.
  - Maintain accurate forecasting, pipeline management and
    Salesforce discipline with clear actions, ownership, next
    steps and realistic close dates.

  Collaboration & Market Engagement

  - Build and coordinate cross-functional account teams
    involving Sales, Product Management, Product Marketing,
    Technical Pre-Sales, Customer Success, Delivery and other
    relevant DNV resources.
  - Lead through influence and collaborate with designated Key
    Account Managers, account owners and Energy Systems
    stakeholders where responsibilities overlap.
  - Ensure a coordinated One-DNV customer approach and connect
    customer needs with relevant capabilities across Asset
    Engineering, Renewable and Ocean Assets (ROA) and the
    wider DNV organisation.
  - Share customer, competitor and market insights, and
    represent DNV at customer meetings and industry events.

  Responsibilities

  - Attractive rewards. We offer a comprehensive benefits
    package, including 6 weeks annual vacation, subsidized
    canteen, competitive pension, insurance, and parental
    leave agreement, in addition to a global profit share
    scheme.
  - Work/life balance. We offer flexible working hours, with a
    focus on work/life balance for our employees.
  - Supportive and caring culture. Our international culture
    embodies diverse colleagues who value teamwork and
    inclusion across business areas and borders. We offer
    opportunities for our employees to connect through social
    and professional networks. Our largest community CONNECT,
    throws after-works and informal meetings all year long for
    you to attend.
  - Career and development. DNV offers extensive possibilities
    to grow and develop your competencies and career
    ambitions. We have a strong company culture with emphasis
    on growth mindset, knowledge sharing, and professional and
    personal development.
  - By joining DNV you become part of a world-leading company
    whose purpose is to safeguard life, property, and the
    environment. Our values “we care, we share, we
    dare” characterize how we work and behave towards each
    other and our customers.
  - Our Høvik office is in beautiful surroundings by the sea and
    can offer access to sailboats, kayaks, tennis courts etc.
    We have more than 30 activity groups for you to join, as
    well as gym facilities and a kindergarten located on our
    premises. It is also worth noting that we offer free
    parking and shuttle buses to and from Skøyen, Lysaker and
    Sandvika.

  DNV is an Equal Opportunity Employer and gives consideration
  for employment to qualified applicants without regard to
  gender, religion, race, national or ethnic origin, cultural
  background, social group, disability, sexual orientation,
  gender identity, marital status, age or political opinion.
  Diversity is fundamental to our culture and we invite you to
  be part of this diversity.



  Qualifications

  Qualifications & Experience

  - Typically, 5+ years of relevant B2B sales, strategic account
    management or business-development experience in
    engineering, energy, offshore, software or another complex
    technical environment.
  - Proven track record of developing existing accounts,
    building relationships with multiple stakeholders and
    converting customer needs into commercial opportunities.
  - Experience with structured account planning, cross-selling,
    upselling, negotiation and full-cycle sales execution.
  - Ability to understand technically complex products and
    effectively communicate their value to customers and their
    commercial benefits.
  - Experience coordinating cross-functional teams and working
    effectively within a matrix organisation.
  - Experience with Salesforce or a comparable CRM platform.
  - Strong written and spoken English. Norwegian is
    advantageous.
  - Relevant higher education or equivalent professional
    experience.

  Personal Attributes

  - Customer-focused commercially minded and driven by growth.
  - Proactive and curious, with a strong understanding of
    customers, markets and emerging needs.
  - Structured and disciplined in account planning, follow-up,
    forecasting and Salesforce management.
  - Ability to lead through influence and collaborate across
    organisational boundaries.
  - Open to feedback, coaching and continuous development.

  Additional Requirements

  - Based in the Oslo region, with regular presence at DNV’s
    Høvik headquarters.
  - Willingness to travel across Norway, the Nordic region and
    occasionally internationally.





  Security and compliance with statutory requirements in the
  countries in which we operate is essential for DNV.
  Background checks will be conducted on all final candidates
  as part of the offer process, in accordance with applicable
  country-specific laws and practices.



