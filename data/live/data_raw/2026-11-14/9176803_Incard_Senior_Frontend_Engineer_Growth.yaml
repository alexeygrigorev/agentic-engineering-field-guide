title: Senior Frontend Engineer, Growth
company: Incard
location: London, GBR
work_type: FULL_TIME
company_size: 26 Employees
description: |
  About Incard

  Incard’s mission is to build the financial operating system
  for entrepreneurs.

  We are focused on creating a system where business banking,
  financial tools, and application logic are coordinated into
  a single control layer.

  Through the app store, entrepreneurs and developers can
  build industry-specific functionality as their business
  evolves.

  Who We're Looking For

  We're looking for a Senior Frontend Engineer to own the next
  generation of our marketing website, the front door to the
  Incard brand and the first product most people will ever
  touch.

  You obsess over pixel-perfect UI, fluid animation, and
  performance at every breakpoint. You understand that a
  marketing site is a product in its own right — one that has
  to feel as crafted as the bank behind it.

  You'll sit at the intersection of engineering, design, and
  growth, embedded in our GTM team and partnering daily with
  marketing, design, and product. You'll make sure every page,
  every experiment, and every campaign reflects the quality of
  what we ship — and that the site evolves in lockstep with
  the product as we scale.

  This role is perfect for someone who lives in the details,
  ships fast without compromising on craft, and treats Core
  Web Vitals, motion design, and conversion rate as parts of
  the same job.

  What You'll Do

  - Own and scale the Incard marketing website end-to-end on
    Vercel + Next.js App Router
  - Build brand-defining UI with complex animations, micro-
    interactions, and motion that feel native to Incard —
    never gratuitous, always purposeful
  - Ship pages that are flawlessly responsive across every
    device, from 320px phones to ultrawide displays
  - Drive technical SEO: Core Web Vitals, structured data,
    sitemaps, metadata, internationalization, and the right
    SSR/ISR/SSG strategy for every page
  - Partner with the GTM team on SEA campaigns, landing pages,
    and A/B experiments that turn traffic into signups
  - Own the full tracking and analytics stack — GTM, GA4,
    server-side tagging, conversion APIs, attribution, and
    consent management
  - Keep the marketing site and product visually and narratively
    aligned as both evolve — when product ships, the site
    reflects it
  - Build the tooling, components, and architecture that let
    marketing, design, and content move fast without ever
    dropping the quality bar

  What We're Looking For

  - 5+ years of frontend experience with React, TypeScript, and
    Next.js App Router on Vercel
  - An exceptional eye for UI craft — typography, spacing,
    color, hierarchy — you can tell exactly why a layout works
    or doesn't, and you can fix it
  - Strong command of modern animation libraries (Framer Motion,
    GSAP, Lottie) and advanced CSS — with the taste to know
    when motion serves the user and when it gets in the way
  - Deep knowledge of technical SEO, Core Web Vitals, and modern
    rendering strategies (SSG, ISR, SSR, edge, streaming)
  - Hands-on experience with the tracking ecosystem — GTM, GA4,
    Segment, server-side tagging, attribution models, A/B
    testing platforms, consent frameworks
  - A track record of building marketing or growth sites that
    perform — both technically and commercially
  - Comfort working directly with marketing, design, and GTM
    stakeholders, and translating brand and campaign intent
    into shipped code
  - A bias for ownership: you treat the site like a product, not
    a project

  Benefits:

  - Competitive cash-based compensation
  - Incard stock options
  - 25 days of paid time off per year, plus bank holidays and
    your birthday off
  - Global health insurance and unlimited paid sick leave
