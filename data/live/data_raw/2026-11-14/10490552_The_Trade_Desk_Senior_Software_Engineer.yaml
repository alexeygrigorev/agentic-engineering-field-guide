description: |
  The Trade Desk is a global technology company and the
  world’s leading independent platform for digital
  advertising, with over 3,000 employees across more than 30
  offices. Our technology helps advertisers reach the right
  audiences across the open internet — from streaming TV and
  podcasts to mobile apps, news, and more.   Advertising
  powers the content people love. By making it more
  transparent, effective, and responsible, we help support
  trusted journalism, quality entertainment, and creators
  worldwide. The world’s brands and agencies rely on us to
  reach their customers and grow their businesses responsibly.
  The scale of our platform brings unique technical challenges
  — from processing massive datasets in real time to building
  systems that operate reliably on a global scale. When you
  work here, your impact is worldwide. We welcome diverse
  perspectives, encourage curiosity, and build teams that
  learn from one another. If you’re driven to solve meaningful
  challenges, we’d love to meet you.

  Job Title: Senior Software Engineer

  Location: 1114 Ave of Americas, New York, NY 10036

   *Telecommuting permitted: work may be performed within
  normal commuting distance from The Trade Desk, Inc. office
  in New York, NY.

  Job Duties: Design and implement scalable software
  components and infrastructure within internal developer
  platforms and distributed systems to enhance engineering
  productivity and reliability. Optimize and refactor existing
  tooling, services, and workflows to reduce developer
  friction and improve system performance, fault tolerance,
  and maintainability across engineering teams. Conduct
  comprehensive technical design and code reviews for high-
  impact systems, ensuring architectural alignment, adherence
  to secure coding practices, and performance efficiency.
  Serve as a technical advisor to guide software design
  patterns and best practices across teams. Lead cross-
  functional technical initiatives by scoping and executing
  complex projects that span multiple services, teams, and
  domains, including dependency resolution, phased rollouts,
  and backward compatibility. Develop reusable frameworks and
  internal APIs to enable standardized integration and
  extensibility across the engineering organization. Own
  shared libraries or SDKs used by multiple services and
  teams. Use telemetry, logs, and operational data to identify
  bottlenecks, quantify the impact of engineering investments,
  and drive decisions around prioritization and architectural
  improvements.



  Salary: $189,592 - $274,700 / year

  Job Requirements: Bachelor's degree (U.S. or foreign
  equivalent) in Computer Science, Computer Engineering, or
  related field and six (6) years of experience in the job
  offered or related role OR Master's degree (U.S. or foreign
  equivalent) in Computer Science, Computer Engineering, or
  related field and four (4) years of experience in the job
  offered or related role. Must have four (4) years of
  experience with: REST APIs or gRPC; one of: Python, Java,
  C#, Javascript, or C++; Rational Databases, SQL; AWS;
  Kubernetes and Docker containers; and S3 or Azure Blob
  Storage. Must have two (2) years of experience with Grafana,
  Prometheus or similar.

  #LI-DNI

  In accordance with various US state laws, the range provided
  is the Trade Desk's reasonable estimate of the base
  compensation for this role. The actual amount may differ
  based on non-discriminatory factors such as experience,
  knowledge, skills, and location.  All employees may be
  eligible to become The Trade Desk shareholders through
  eligibility for stock-based compensation grants, which are
  awarded to employees based on company and individual
  performance. The Trade Desk also offers other compensation
  depending on the role such as variable compensation-based
  incentives and commissions. Plus, expected benefits for this
  role include comprehensive healthcare (medical, dental, and
  vision) with premiums paid in full for employees and
  dependents, retirement benefits such as a 401k plan and
  company match, short and long-term disability coverage,
  basic life insurance, well-being benefits, reimbursement for
  certain tuition expenses, parental leave, sick time of 1
  hour per 30 hours worked, vacation time for full-time
  employees up to 120 hours thru the first year and 160 hours
  thereafter, and around 13 paid holidays per year.  Employees
  can also purchase The Trade Desk stock at a discount through
  The Trade Desk’s Employee Stock Purchase Plan.

  The Trade Desk also offers a competitive benefits package.
  Click here to learn more.

