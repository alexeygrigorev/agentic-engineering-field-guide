description: |
  About Cogent

  Cogent is an Applied AI Lab building the next generation of
  AI agents for cybersecurity. AI has fundamentally changed
  how attacks happen, allowing malicious actors to operate at
  unprecedented speed and scale. Cogent’s "AI Taskforce"
  assesses petabytes of enterprise data to remediate these
  issues before critical breaches occur.

  To stay at the cutting edge, we blend frontier research with
  real-world execution. Alongside our core product work,
  Cogent Research serves as our applied AI lab, providing the
  research horsepower needed to make truly agentic security
  workflows a reality.

  Since coming out of stealth, Cogent has experienced rapid
  growth. We partner with Fortune 500 companies to secure some
  of the most complex production environments in the world.

  We’re backed by Greylock and we’ve built a team with the
  best minds in applied AI. Our team is comprised of people
  from:

  - Top universities like Stanford, Berkeley, Penn, Duke,
    Carnegie Mellon, Waterloo
  - Unicorn, high-growth companies like Scale AI, Databricks,
    Stripe, Tesla, Coinbase
  - World class cybersecurity experts from Wiz, Abnormal AI,
    Zscaler
  - Preeminent research labs like Deepmind and SAIL

  About the Role

  Cogent is building the world's first AI cyber taskforce,
  which is composed of AI agents capable of human-caliber
  reasoning for cybersecurity tasks. We are looking for
  talented, ambitious Senior and Staff Engineers who are
  excited to build in the Applied AI space.

  What You’ll Do & Achieve

  - Own the product.
    - You're a technical founder type who is willing to deep dive
      and get your hands dirty to build the best product.
    - This also means that you will have a high level of autonomy
      and responsibility in shaping the technical roadmap and
      product strategy.
  - Ship, ship, ship.
    - Design and implement Cogent’s AI product experience for
      enterprises that run based on our multi-tenant cloud and
      single-tenant enterprise platform.
    - The first products that you will be involved in launching
      are: customer portal, knowledge engine, internal
      labeling tool, and external customer dashboard.
  - Build the new standard for generative interfaces in
    cybersecurity.
    - World-class AI needs to be backed up by intuitive UI to be
      truly impactful to our customers.
    - You will own large parts of the customer experience that
      will ultimately help our customers protect their
      organizations from attackers.
  - Help create a robust engineering culture at Cogent
    - Onboard, support and uplevel future team members
    - Participate in, provide feedback on, and iterate interview
      process as we scale the team up
    - Actively contribute to Engineering Excellence, Operational
      Excellence and Recruiting initiatives

  What You’ll Bring

  - 5+ years of professional experience as a hands-on engineer,
    working across the full software stack and leading the
    development of scalable, high-quality applications
  - Expertise in designing, developing, and maintaining backend
    systems, including microservices, APIs, and databases, to
    support modern web applications
  - Strong experience with frontend development, including
    modern JavaScript frameworks (React, Vue, Angular) and web
    technologies (HTML, CSS, TypeScript)
  - Ability to work across the stack, integrating backend
    services with dynamic, user-facing frontends to deliver
    seamless, performant product experiences
  - Proficient in API design (RESTful, GraphQL, or gRPC) and
    integrating with both internal and external systems
  - Familiarity with containerization and orchestration
    technologies (Docker, Kubernetes) and deployment pipelines
    (CI/CD) in cloud environments (AWS, GCP, Azure)
  - Solid experience in Agile development processes, including
    code reviews, sprint planning, and collaborative cross-
    functional team work to deliver full-stack product
    features

  For California Based Applicants

  The standard base salary range for this position is $100,000
  - $300,000 annually. Compensation offered will be determined
  by factors such as location, job level, job-related
  knowledge, skills, and experience. Certain roles may be
  eligible for variable compensation, equity, and benefits.

  We are committed to building an inclusive and diverse
  company. We do not discriminate based on gender, ethnicity,
  sexual orientation, religion, civil or family status, age,
  disability, or race.
