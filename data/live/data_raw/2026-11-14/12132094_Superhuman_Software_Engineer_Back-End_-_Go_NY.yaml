description: |
  The location for this role is our NYC office in the Flatiron
  District. Our hybrid model, with a minimum of two days per
  week (Tuesdays and Thursdays), gives team members the best
  of both worlds, with plenty of focus time and in-person
  collaboration that foster trust, innovation, and a strong
  team culture.



  About Superhuman

  Superhuman is the AI productivity platform on a mission to
  unlock the superhuman potential in everyone. The Superhuman
  suite of apps and agents brings AI wherever people work,
  integrating with over 1 million applications and websites.
  The company’s products include Grammarly’s writing
  assistance, Superhuman Docs’s collaborative workspaces,
  Mail’s inbox management, and Go, the proactive AI assistant
  that understands context and delivers help automatically.
  Founded in 2009, Superhuman empowers over 40 million people,
  50,000 organizations, and 3,000 educational institutions
  worldwide to eliminate busywork and focus on what matters.
  Learn more at superhuman.com and about our values here.



  The Opportunity

  Superhuman is building the AI productivity platform that
  works everywhere people do — and the back end is where the
  intelligence lives. Our Back-End engineers build the systems
  that power AI agents across the entire product suite: the
  scheduling layer that manages getting all your agents to run
  at the right time in Go, the real-time infrastructure behind
  Superhuman Mail, the collaboration engine in Superhuman
  Docs, and the enterprise controls that let organizations
  deploy AI safely at scale.

  This is backend work at the intersection of systems
  engineering and AI. You'll build the services that make
  agentic workflows possible — session history, task
  scheduling, client-server protocols, and the real-time
  infrastructure that connects our AI layer to users across
  every surface. You'll design the infrastructure that lets
  anyone create custom agents and publish them to a
  marketplace reaching tens of millions of users. And you'll
  tackle the hard scaling problems that come with running AI-
  powered features across consumer and enterprise customers
  simultaneously.

  Superhuman's engineers have the freedom to innovate and
  shape the product roadmap. The complexity of our technical
  challenges is growing rapidly as we scale AI-powered
  features across every surface. You can hear more from our
  team on our technical blog.

  As a Back-End Engineer, you will:

  - Build and operate high-throughput production services that
    power AI agent orchestration, connector integrations, and
    real-time data pipelines.
  - Design and build core platform services — task schedulers,
    session and conversation history, client-server protocols,
    and the APIs that connect our AI engine to every product
    surface.
  - Work across the Superhuman product suite — whether that's
    Go, Mail, Docs, or Enterprise — depending on where you and
    the team see the best fit.
  - Collaborate closely with ML/AI, Product, and Front-End
    engineers to ship AI-powered features end to end.
  - Build and evolve infrastructure as code, targeting high
    availability for both consumer and enterprise customers.
  - Contribute to an engineering culture with a strong emphasis
    on documentation, testing, and reliability.
  - Mentor and grow junior engineers on the team.



  Qualifications

  - 5+ years of experience in back-end development, with strong
    fundamentals in algorithms, data structures, and system
    design.
  - Experience building, deploying, and debugging production
    systems at scale.
  - Experience with AWS or other cloud platforms (GCP, Azure).
  - Comfort working with AI-powered systems — whether that's
    building infrastructure for LLM-based features, managing
    agentic workflows, or integrating with ML pipelines. Prior
    experience building backend services for AI products is a
    plus.
  - Fluency with AI coding tools (Copilot, Cursor, Claude Code,
    etc.) and a point of view on how they change the way teams
    build software.
  - Experience with real-time systems, event-driven
    architectures, or high-throughput API design is a plus.
  - Deep understanding of CI/CD and infrastructure as code.
  - Demonstrated ability to work independently, manage
    priorities across multiple projects, and collaborate
    effectively with cross-functional teams.
  - Strong product instincts — you care about the end-user
    experience and can make good tradeoffs between speed and
    reliability.

  We invite you to share your knowledge, experience, and goals
  with us to help us find the best team match for you. Tell us
  your superpower!



  Compensation and Benefits

  Superhuman offers all team members competitive pay along
  with a benefits package encompassing the following and more:

  - Excellent health care (including a wide range of medical,
    dental, vision, mental health, and fertility benefits)
  - Disability and life insurance options
  - 401(k) and RRSP matching
  - Paid parental leave
  - 20 days of paid time off per year, 12 days of paid holidays
    per year, two floating holidays per year, and flexible
    sick time
  - Generous stipends (including those for caregiving, pet care,
    wellness, your home office, and more)
  - Annual professional development budget and opportunities

  Superhuman takes a market-based approach to compensation, so
  base pay may vary by location. Our US locations are
  categorized into two compensation zones based on proximity
  to our hub locations.

  For more information about our compensation zones and
  locations where we currently support employment, please
  refer to this page. If a location of interest is not listed,
  please speak with a recruiter for additional information.

  Base pay may vary considerably depending on job-related
  knowledge, skills, and experience. The expected salary
  ranges for this position are outlined by compensation zone
  and may be modified in the future.



