description: |
  The Global Commercial Services team at American Express is
  looking for a seasoned Senior Engineer I with extensive
  full-stack development expertise, a strategic product
  management mindset, and a proven history of successfully
  leading and mentoring software engineering teams. This role
  will be pivotal in shaping and building our next-generation
  expense management platform, designed to provide actionable
  insights into business spending for our Small and Medium-
  sized (SMS) businesses and Corporate customers. We aim to
  deliver an innovative, scalable, and highly integrated
  expenses solution that transforms business spending into a
  seamless, insightful experience.





  Responsibilities

  • Play a critical role in the design, development, and
  deployment of our next-generation expense management
  solution. • Collaborate closely with product managers,
  designers, and stakeholders to refine and shape product
  requirements, ensuring clarity and readiness for
  engineering. • Mentor and guide feature teams, fostering
  effective collaboration within the team, across guild teams,
  and with other cross-functional project teams. • Develop
  robust platform services utilizing domain-driven design and
  hexagonal architecture. • Identify, evaluate, recommend, and
  integrate SaaS, PaaS, and IaaS solutions to efficiently
  achieve both functional and non-functional objectives. •
  Participate in and facilitate Request-for-Comment (RFC)
  processes and proof-of- concept (POC) activities. •
  Integrate analytics and instrumentation toolchains into
  application development workflows. • Measure, monitor, and
  enhance application performance, scalability, and
  resilience. • Actively contribute to establishing and
  maintaining team coding standards and system design
  conventions. • Employ the Linear method to effectively guide
  the Software Development Lifecycle of the team. • Plan,
  estimate, delegate, and oversee task execution to ensure
  milestone goals are met on time, proactively addressing
  risks and resolving blockers. • Regularly demonstrate both
  individual and team milestone achievements and progress to
  the product team and stakeholders. • Gather, analyze, and
  incorporate stakeholder feedback to continuously improve the
  product and refine software engineering practices.

  Qualifications

  • Overall experience: 8+ years of experience in software
  engineering and product development, in individual
  contributor as well as leadership roles. • Education:
  Bachelor of Science or Engineering, specializing in
  Information Technology, Computer Science, or Software
  Engineering disciplines. • Experience in full-stack
  development including mobile apps, web UI, middleware,
  platform services, and infrastructure as code. •
  Professional certifications in software engineering,
  architecture, or product management. • At least 5 years of
  experience building, mentoring, and managing high-
  performance distributed engineering teams. • At least 5
  years of experience in Frontend technologies for web,
  including Typescript and frameworks such as React, Angular,
  or Ruby on Rails. • At least 5 years of experience in
  Backend and general-purpose programming languages and run-
  times such as Node.js, Python, Ruby, and Go. • At least 2
  years of experience with Mobile app development either with
  cross-platform technologies such as React Native, Cordova,
  Ionic, or native app development. • At least 2 years of
  experience showcasing deep engagement with product
  management and UX design teams. • Hands-on experience with
  cloud services for application development such as AWS
  Lambdas, S3, API Gateway, SQS, ECS, RDS, etc. • Hands-on
  experience with multiple storage technologies including
  RDBMS, Graph databases, document stores, search indices, and
  OLAP databases. • Hands-on experience integrating Postgres-
  compatible distributed databases such as CockroachDB. •
  Hands-on experience integrating with workflow engines,
  orchestration engines, or durable-execution technologies
  such as Camunda and Temporal. • Hands-on experience
  developing data-driven UI and dynamic forms such as JSON-
  schema based forms. • Hands-on experience integrating with
  AI/ML models to build user-facing recommendation engines. •
  Hands-on experience setting up instrumentation, analyzing
  performance, distributed tracing, and debugging with Datadog
  or similar instrumentation technologies. • Hands-on
  experience developing, improving, and testing application
  code towards industry-standard specifications or to meet
  compliance requirements such as Camunda and Temporal.

  • Hands-on experience developing data-driven UI and dynamic
  forms such as JSON-schema based forms.

  • Hands-on experience integrating with AI/ML models to build
  user-facing recommendation engines.

  • Hands-on experience setting up instrumentation, analyzing
  performance, distributed tracing, and debugging with Datadog
  or similar instrumentation technologies.

  • Hands-on experience developing, improving, and testing
  application code towards industry-standard specifications or
  to meet compliance requirements.

  • Entrepreneurial experience in software engineering and
  product development is valuable.

  Employment eligibility to work with American Express in the
  United States is required as the company will not pursue
  visa sponsorship for these positions.

  About Us

  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. From delivering
  differentiated products to providing world-class customer
  service, we operate with a strong risk mindset, ensuring we
  continue to uphold our brand promise of trust, security, and
  service.

  As part of Team Amex, you’ll experience our powerful backing
  with comprehensive support for your holistic well-being and
  many opportunities to learn new skills, develop as a leader,
  and grow your career. Here, your voice and ideas matter,
  your work makes an impact, and together, you will help us
  define the future of American Express.

  About the Team

  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:

  - Competitive base salaries
  - Bonus incentives
  - 6% Company Match on retirement savings plan
  - Free financial coaching and financial well-being support
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - 20+ weeks paid parental leave for all parents, regardless of
    gender, offered for pregnancy, adoption or surrogacy
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities

  For a full list of Team Amex benefits, visit our Colleague
  Benefits Site.

