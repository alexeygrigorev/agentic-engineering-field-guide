description: |
  Title: Senior Frontend Developer

  Location: Remote

  Duration: Fulltime

  Salary: $Open

  Requirements

  Role Overview

  We are looking for a hands-on Senior Front-End Developer who
  can immediately contribute to building, optimizing, and
  owning enterprise-grade web applications. This is not a UI-
  only role — the developer is expected to understand backend
  integration, Azure-hosted architectures, performance,
  security, and real-world production concerns.

  The ideal candidate writes clean, scalable React code daily,
  works closely with backend (.NET/Azure) teams, and is
  comfortable collaborating with offshore developers and
  business stakeholders.

  Responsibilities

  - Design, develop, and document enterprise-grade React
    applications using TypeScript
  - Ensure applications perform smoothly across desktop and
    mobile browsers
  - Own front-end performance, responsiveness, and usability
  - Work closely with backend teams on API contracts, error
    handling, and security
  - Collaborate with designers to ensure UX feasibility and
    consistency
  - Review code, enforce standards, and mentor junior developers
  - Debug complex production issues and drive root-cause
    analysis
  - Support and modernize legacy web applications
  - Participate actively in Agile ceremonies (stand-ups, sprint
    planning, reviews)
  - Work effectively with offshore development teams
  - Stay current with evolving front-end and web platform
    technologies

  Required Skills (Must-Have)

  - 7+ years of hands-on front-end development experience
  - Strong, hands-on React with TypeScript (functional
    components, hooks, state management)
  - Expert-level CSS (responsive layouts, performance-friendly
    styling)
  - Solid understanding of frontend architecture patterns
  - Experience integrating React with .NET backend APIs
  - Working knowledge of Azure-hosted applications (App
    Services, APIs)
  - Experience with code reviews, testing, and deployments
  - Strong understanding of web security best practices
  - Comfortable working in Agile / Scrum environments
  - Excellent communication skills (must interact with business
    users)

  Good to Have / Preferred

  - Experience with C# / .NET (even if not daily coding)
  - Familiarity with Azure services and cloud-hosted front ends
  - Experience with SQL or Cosmos DB (from a frontend
    integration perspective)
  - Exposure to frontend testing frameworks
  - Experience working in enterprise or SaaS products
  - Prior experience coordinating with offshore teams

  Benefits

  If Interested please send your updated resume
  to:rehana.j@two95intl.comand include your rate/Salary
  requirement along with your contact details with a suitable
  time when we can reach you. If you know of anyone in your
  sphere of contacts, who would be a perfect match for this
  job then, we would appreciate if you can forward this
  posting to them with a copy to us.

  We look forward to hearing from you at the earliest.
