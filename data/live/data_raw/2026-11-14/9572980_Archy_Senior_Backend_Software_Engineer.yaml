description: |
  About Archy

  Smile! Those teeth you are showing deserve the best care you
  can give them, yet the status quo of the software your
  dentist uses today is outdated.

  Archy is a Series C vertical SaaS solution revolutionizing
  the dental practice management space — giving dental
  providers AI agents and software that lets them do what they
  do best (be dentists!) while we handle the more technical
  sides of running their practice business.

  Job Description:

  Join Archy as a Senior Backend Software Engineer and help
  revolutionize dental practice management with our cutting-
  edge SaaS solution. You’ll work with our Java Spring Boot
  backend to deliver reliable, scalable systems that empower
  dental professionals to focus on patient care.

  We are looking for a passionate Senior Backend Software
  Engineer to join our growing team. You’ll thrive in our
  environment, where you’ll be an expert executor who ensures
  the technical integrity of our systems while mentoring
  others. You don't just write code; you ensure the production
  environment is stable and scalable. You’ll see your work
  have a direct impact on the success of our product and
  users.

  Job Responsibilities:

  - Take full accountability for the end-to-end delivery of
    major product updates. You will manage the release
    lifecycle, ensuring that high-impact features are deployed
    reliably and maintain peak performance in production.
  - Proactively leverage AI tools (e.g., Claude) to complement
    your workflow and increase velocity. We expect you to use
    sophisticated prompting to accelerate boilerplate and
    execution, but you must remain the "architect," retaining
    total ownership over the logic, security, and
    architectural implications of the code.
  - Collaborate with product teams to integrate and improve AI
    capabilities within the Archy platform, helping to roll
    out exciting new updates that simplify dental practice
    workflows.
  - Collaborate closely with the Frontend team to ensure
    seamless integration between our Java Spring Boot backend
    and React/TypeScript frontend.
  - Participate in code reviews, providing and receiving
    constructive feedback to help the team continuously
    improve.
  - Identify opportunities to improve team efficiency and
    implement those improvements.
  - Estimate and plan development efforts for projects, ensuring
    timely and high-quality delivery.

  Job Requirements:

  - Bachelor’s degree in Engineering, Computer Science, or
    equivalent experience.
  - 6+ years of experience as a backend engineer, with a strong
    emphasis on writing clean, quality code.
  - Experience with Java Spring Boot or similar frameworks.
  - Hands-on experience with Snowflake or enterprise cloud data
    warehouses for managing and querying large-scale datasets.
  - Experience owning the successful release of high-traffic
    features or major platform migrations.
  - A deep understanding of how to use AI tools as a co-pilot
    without sacrificing code quality or deep-thinking problem-
    solving.
  - A deep focus on testing, stability, and performance to
    ensure our platform remains rock-solid for our users.
  - A customer-centric mindset: understanding that dental
    practices are relying on us to keep their businesses
    running smoothly.
  - Strong collaboration and communication skills, with an
    openness to feedback and a respect for the diverse voices
    and talents on our team.

  What We Offer:

  - Health & Wellness: Comprehensive medical, dental, and vision
    coverage for you and your family, plus Spring Health and
    One Medical access.
  - Competitive Compensation: Base pay and equity, 401(k) with
    company match, and performance-based incentives (bonus or
    commission eligibility by role).
  - Flexibility & Remote Support: A remote-friendly culture that
    values flexibility and time to rest and recharge, with
    home office support and time-off benefits varying by role.
  - Team Connection: Annual all-company offsites to collaborate
    and connect in person.
