description: |
  About Mercor

  Mercor’s mission is to organize human intelligence for the
  AI economy. We build the infrastructure that enables
  frontier AI labs and enterprises to train, evaluate, and
  improve AI on real-world professional work. More than five
  million experts have joined our network, and we pay out over
  $5 million daily for their knowledge and expertise. We built
  our training and evaluation infrastructure alongside the
  world’s leading AI labs. Now, we’re bringing those
  capabilities to enterprises across industries, enabling them
  to train, evaluate, and improve AI using their own expertise
  and standards. Our APEX benchmarks measure how AI performs
  on economically valuable work, while our enterprise
  evaluations and post-training capabilities turn those
  insights into measurable improvements across real-world
  workflows. Our work sits at the intersection of frontier AI,
  human expertise, and real-world application. We’re solving
  problems few companies have encountered, with the
  opportunity to influence what the world’s most advanced AI
  systems become capable of doing. We’re looking for people
  who bring different perspectives, take ownership, exercise
  sound judgment, and hold themselves to an exceptionally high
  standard. You’ll have the opportunity to do consequential
  work alongside talented colleagues who challenge one
  another, collaborate openly, and share a commitment to
  excellence. Mercor is profitable and recently raised a $750
  million Series D at a $20 billion valuation. We work in
  person five days a week in San Francisco, New York, and
  London.

  About the Role

  We're looking for a strong engineer who can build agentic
  products that scale. You will work with:

  - Backend: Python, FastAPI, Django, Pydantic
  - Frontend: Next.js, React, TypeScript, Tailwind
  - Data: PostgreSQL, MySQL, Snowflake, DuckDB, Redis
  - Orchestration/Infra: Kubernetes, Temporal, Modal, Woz
  - Agents/LLM: LangGraph, LangChain, FastMCP, Harbor, NemoGym
  - Observability: Datadog, PostHog, LangSmith

  At the end of the process, you’ll be team-matched to where
  you can have the most impact, on one of the following:

  - Automation – We build intelligent systems and agents that
    automate operational work at scale—handling talent
    management, decision-making insights, and knowledge
    access—so humans can focus on higher-level thinking.This
    is a newly formed, CEO-facing team focused on 0→1 product
    development, with a strong emphasis on business impact.
    The work is highly cross-functional, touching nearly every
    system across the company.
  - Studio – We own Mercor’s evaluation system & annotation
    platform for RL environments and tasks. We build
    harnesses, agents, verifiers, and the end-to-end
    infrastructure for producing frontier data. Our mission is
    to scale up high quality RL environments/tasks and expand
    their capabilities. We work closely with researchers at
    frontier AI labs to jointly shape the direction of next-
    generation models.

  What You’ll Do

  - Own agentic features end-to-end — from scoping with
    researchers/ops partners through implementation, launch,
    and iteration on real customer feedback.
  - Design and ship LLM agents, harnesses, and verifiers —
    including the tools, prompts, and policies that make them
    reliable.
  - Build the Python/FastAPI services and Temporal/Modal
    pipelines that orchestrate agent runs, human-in-the-loop
    review and iterations.
  - Build state of the art RL environments that expand the
    capabilities of frontier agents, with realistic enterprise
    apps, simulated coworkers, and rich company data rooms
    that support tasks spanning hours to days.
  - Build tooling that turns agent trajectories into insight,
    from statistical analysis to automated failure mode
    detection.
  - Build and refine the full-stack surfaces and data
    infrastructure — craft Next.js/React interfaces where
    operators and experts work with agents, evolve data models
    to give agents the structured context and audit trails
    they need.
  - Define agent quality and drive continuous improvement —
    build evals, instrument traces, analyze failure modes, and
    iterate on prompts, tools, and guardrails while raising
    the bar for reliability, cost, latency, and UX.
  - Partner cross-functionally to shape agent autonomy — work
    with Product, Design, Research and Ops to draw the lines
    between autonomous action, propose-and-approve flows, and
    human-in-the-loop decisions.

  Why Mercor

  - Impact: Your work powers how the world’s leading AI labs
    train and test their models.
  - Learning: Get early insights into frontier model
    capabilities months before the market.
  - Growth: Work on both infrastructure and research-adjacent
    projects with fast paths to ownership.

  Benefits:

  - Generous equity grant vested over 4 years
  - Health, dental, and vision insurance
  - 401(k) with company match
  - Unlimited paid vacation and sick days
  - Parental leave for birthing and non-birthing parents
  - Free mental health services
  - $200 monthly wellness reimbursement
  - $1.5K monthly meal stipend
  - $200 monthly laundry reimbursement
  - Free Equinox membership
  - Up to $15K relocation bonus

