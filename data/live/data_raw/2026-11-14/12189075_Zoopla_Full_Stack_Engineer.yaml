description: |
  Hybrid Working Pattern - 3 days (Mon, Tue, Thurs) per week
  from Tower Bridge office

  Who We Are

  Zoopla is one of the UK’s most instantly recognisable
  property brands. In fact, we’re known and loved by over 91%
  of the nation (and we’re working hard on the other 9%). Our
  mission is to help the nation make better home decisions -
  by connecting everyone to their home and giving them
  personalised insights to help with moving, managing or
  financing. Over 50 million people visit Zoopla every month
  to access exclusive data and information on every UK
  property, search over 500,000 homes for sale and rent, find
  the best agents and secure the latest mortgage deals.

  We’re a growing, dynamic team that embraces innovation and
  isn’t afraid to push the boundaries. We’re only just
  starting our journey to redefine the digital property
  landscape, with much more to explore and achieve. Join us,
  and transform the way the nation makes home decisions.

  The Role

  As a Full-Stack Engineer at Zoopla, you will work to build
  and enhance features for our property marketplace that
  connects consumers and customers. If you enjoy being in a
  commercially driven organisation where the systems you touch
  may be used by millions of people in the UK we have
  something for you.

  While we have a diverse set of technologies and services
  running here at Zoopla, we don't expect you to know all of
  them and would love to hear from you if you have experience
  in just a few of them. What we value more is the ability to
  work in a cross functional team to problem solve and a
  willingness to sometimes jump into unfamiliar code to
  achieve your goals.

  On the frontend you’ll work with React, React Native Nx and
  TypeScript. On the backend it's Node.js, Next.js, and
  GraphQL, all written in TypeScript, but also Golang and
  Python. Our data stores include both SQL and NoSQL, and our
  systems run on AWS.

  AI tools have cut the time to build from days to hours in
  many cases. We want engineers who use that speed to test
  bold ideas, prototype new approaches, and ship the ones that
  work. You will work across the full stack to do it.

  Requirements

  What we’re looking for in Zoopla Engineers:

  - You’re skilled in TypeScript and have built both sides of a
    product: UIs in React or React Native, and backend
    services and APIs in Node.js (REST or GraphQL) backed by
    SQL or NoSQL databases. Nice to have: Python, Golang.
  - You’ve designed and shipped systems that real users depend
    on. You choose the right architecture, weigh trade-offs
    (scale, cost, complexity, speed to ship), and write down
    your decisions. You can lead a design discussion and take
    feedback.
  - You practise your engineering craft: maintainable code, code
    review, pair programming, and test coverage.
  - You build products that are stable, scalable, secure,
    observable, and performant.
  - You’ve worked with cloud infrastructure and know your way
    around Terraform (or equivalent) and AWS. We want
    engineers with a DevOps mentality.
  - You’re commercially driven and you spot opportunities to
    improve the product. You care about delighting users.
  - You work closely with colleagues across the business and
    understand how your work ties to business goals.
  - You’re accountable for performance, playing your part in
    achieving team goals and ensuring your contribution
    positively impacts overall success.
  - You are proactive and can work autonomously in a fast-paced
    agile team, alongside data, product and design. You take
    ownership of outcomes and respond to change without
    missing a beat.
  - You deeply make use of AI. You keep up with new tools and
    techniques, and you actively use them in your work.

  We take diversity and inclusion seriously, and to succeed
  here, you should too! All qualified applicants will be
  considered, without regard to race, colour, nationality,
  religion, sexual orientation, gender, gender identity, age,
  disability, health, qualifications, or time unemployed.

  Where you’ll be

  At Zoopla, we embrace hybrid working but emphasise the
  importance of also spending time together. You’ll have the
  opportunity to work remotely (at home) for two days per week
  with Mondays, Tuesdays and Thursdays as all-Zoopla days in
  the office together.

  Our home in Tower Bridge is a buzzing hub for collaborative
  and individual working, with areas to socialise and exercise
  - within easy reach of London Bridge, Tower Hill and
  Bermondsey stations. On our doorstep there are plenty of
  great food spots including a new indoor street food market
  and landscaped areas to sit by the riverside.

  Benefits

  - Our hybrid setup means you’ll join us in the Tower Bridge
    office 3 days each week
  - 25 days annual leave + additional leave benefits Including
    extra days for length of service, plus other leave perks
  - Cycle to work and electric car schemes
  - Free Calm App membership
  - Enhanced Parental leave
  - Fertility Treatment Financial Support
  - Group Income Protection and private medical insurance
  - Gym on-site in London
  - 7.5% pension contribution by the company
  - Discretionary annual bonus up to 10% of base salary
