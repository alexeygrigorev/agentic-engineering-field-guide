description: |
  About Big Leap

  Big Leap Health is democratizing access to breakthrough
  mental health treatments. We connect people with vetted
  clinics who provide treatments such as Spravato, TMS & more
  covered by insurance.

  At Big Leap Health, we believe breakthrough mental health
  treatments are a pillar in the journey toward achieving our
  fullest potential but are often too expensive and
  inaccessible for most. We focus on making cutting-edge
  treatments like Spravato TMS, and other innovative therapies
  accessible to all through insurance coverage. These aren't
  just treatments; they're gateways to resilience, empathy,
  hope, and strength.

  We’re building technology and tools to help clinics offer
  these treatments more easily, while enabling patients to use
  their insurance benefits to receive these life changing
  treatments. We’ve raised from top VCs and angels, are
  partnering with dozens of clinic operators, and are growing
  rapidly.

  About The Role

  We’re looking for a Full-Stack Engineer in New York City
  (3-4 days/week in office) who thrives in a startup
  environment and knows how to ship.

  On a daily basis, you will build end-to-end workflows, take
  them to production, and solve real world problems across an
  out-sized scale. As an early technical steward, you will
  raise the bar for code quality and decision‑making, setting
  patterns that cement a world‑class engineering culture as we
  scale. While the company 10x’s, your scope and ownership
  will grow just as fast—building the tools, mental models,
  and platforms that let both you and Big Leap Health
  accelerate exponentially.

  You’ll work across the stack, from database schemas to UI
  components, and take full ownership of features from design
  through production deployment. The ideal candidate is
  someone whose built things end to end. You’ve worked at
  high-growth startups, kicked off your own side projects, or
  maybe indie hacked for a while. You know how to take high
  level requirements and run with them without getting lost in
  over-planning or scope creep.

  You’re a generalist software engineer who is eager to take
  ownership, inclined to move quickly and hungry to ship high-
  impact software.

  Technologies We Use

  Different languages, frameworks, and databases, including
  React, Vue, Typescript, Node.js, PostgreSQL

  Industry-standard infrastructure, including Docker, AWS,
  Firebase, and Google Cloud

  What We Value

  - An infinite learner. Someone who is relentless in their
    curiosity.
  - Partner-obsessed. Someone who deeply cares about delighting
    our customers and solving real pain points, not vanity
    metrics.
  - Ultimate accountability while learning as a team, and both
    giving and receiving rapid feedback.
  - Extreme empathy. Our customers are not tech companies. They
    are clinicians and practice managers who live and work in
    the real world. Empathy is critical to arriving at correct
    solutions.
  - Unafraid of failure. You take risks. You see failure as an
    opportunity to learn, grow, and be better the next time.
    In a weird way, you trick your brain into being excited
    when you fail, because it means you got a new opportunity
    to learn more.

  What We Require

  - Strong coding skills with demonstrated proficiency in modern
    programming languages.
  - Strong engineering prowess, developed at start-ups.
  - Familiarity with storage and data processing systems, cloud
    infrastructure, and other technical tools.
  - Strong written and verbal communication skills and ability
    to iterate quickly with teammates, incorporating feedback
    and holding a high bar for quality.

  Don’t Work Here

  Please don't join if you're not excited about:

  - Building an AI-enabled product for an industry rapidly
    growing and evolving
  - Constantly talking to and visiting customers in the field
  - Working in person with some of the most ambitious people in
    NYC
  - Attempting to build a generational company, and the
    intensity required to do so

  What We’re Looking For

  - 4-7 years of experience building and shipping modern full-
    stack web applications.
  - Experience working at a VC-backed digital healthcare startup
    with the ability to move quickly, adapt priorities, and
    focus on outcomes over process.
  - Startup experience is preferred.
  - A maker mindset. You’ve built side projects, indie apps, or
    internal tools from scratch and seen them through to
    launch.
  - Excited to work in person with a small, collaborative team
    in NYC.

  Why Join Us

  - Work with an ambitious team building meaningful technology
    that is transforming mental healthcare in our country
  - Ship quickly, own your work, and see your impact in
    production.
  - Modern stack, fast feedback loops, and a product-driven
    culture.
  - Competitive pay, autonomy, and flexibility within a high-
    trust environment

  Interview Process

  - Intro call with Engineering
  - Founder Interview
  - Thought exercise, a two hour session and review with the
    team
  - Team meeting (in-person)
  - Offer

  You’ll also enjoy the following benefits:

  - Industry-leading cash compensation for a startup of our
    stage
  - Generous equity
  - Health, dental, and vision benefits
  - New company Apple laptop
  - $1,000 flexible home office budget

  This is a unique opportunity to join an early team of
  experienced healthcare operators. If you’re excited by this,
  or the prospect of improving patient access to breakthrough
  mental health treatments, contact us!

  $160,000 - $200,000 a year

  Compensation range for this position is $160,000 to
  $200,000, depending on experience; actual compensation will
  be dependent upon the specific role, location, as well as
  the individual’s qualifications, experience, skills and
  certifications.

  At Big Leap Health, we are an equal opportunity employer
  committed to a diverse, inclusive, and equitable workplace
  and candidate experience. We strive to create an environment
  where everyone has a sense of belonging and purpose, and
  where we learn from the unique experiences of those around
  us.

  We encourage all qualified candidates to apply regardless of
  race, color, ancestry, religion, national origin, sexual
  orientation, age, citizenship, marital or family status,
  disability, gender, gender identity or expression, pregnancy
  or caregiver status, veteran status, or any other legally
  protected status.
