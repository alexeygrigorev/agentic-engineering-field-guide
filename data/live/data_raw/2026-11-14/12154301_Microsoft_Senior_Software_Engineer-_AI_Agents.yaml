description: |
  Overview

  The Agent 365 team is building the enterprise platform for
  managing and governing AI agents at scale. We are looking
  for a Senior Software Engineer who is passionate about
  building secure, reliable, and highly scalable distributed
  systems and helping shape the future of enterprise agent
  management.

  Agent 365 brings together agent inventory, identity,
  ownership, lifecycle management, governance, administrative
  controls, and integrations across Microsoft's agent
  ecosystem. Internally, the governance architecture treats
  agents as governable enterprise actors with explicit
  identity, ownership, accountability, and standardized
  lifecycle states, while coordinating with systems including
  Microsoft Entra and agent platforms.

  As a Senior Software Engineer, you will own meaningful end-
  to-end areas of the platform, from architecture and API
  design through implementation, deployment, observability,
  and production operations. You will work closely with
  engineers, product managers, designers, security experts,
  and partner teams to solve technically challenging problems
  across organizational and service boundaries.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Own and deliver complex engineering features end to end,
    from technical design and implementation through
    validation, deployment, monitoring, and production
    support.
  - Design and build secure, scalable, highly available cloud
    services and APIs supporting Agent 365 management and
    governance scenarios.
  - Contribute to capabilities such as agent registry, lifecycle
    management, identity integration, ownership, governance
    actions, administrative APIs, and cross-platform
    orchestration. These are prominent areas in the current
    Agent 365 governance architecture.
  - Drive technical design for ambiguous problems, make sound
    engineering tradeoffs, and turn product requirements into
    maintainable architectures.
  - Work across service boundaries and partner teams to define
    contracts, resolve dependencies, and deliver coherent end-
    to-end experiences.
  - Build with security, privacy, compliance, reliability, and
    operability as core design requirements, rather than
    treating them as afterthoughts.
  - Establish strong engineering fundamentals including
    automated testing, monitoring, telemetry, diagnostics,
    deployment safety, and incident readiness.
  - Diagnose complex production issues and drive improvements
    that prevent recurrence.
  - Participate actively in design and code reviews and raise
    the engineering quality bar across the team.
  - Mentor other engineers through technical guidance, code
    reviews, design discussions, and hands-on collaboration.
  - Leverage AI-assisted engineering tools and modern
    development practices to improve engineering velocity
    while maintaining a high quality bar.

  Qualifications Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 4+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Other Requirements:

  Ability to meet Microsoft, customer and/or government
  security screening requirements are required for this role.
  These requirements include but are not limited to the
  following specialized security screenings:

  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 8+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.
  - Solid software engineering fundamentals including data
    structures, algorithms, object-oriented/system design,
    concurrency, and distributed systems.
  - Demonstrated experience designing and delivering production-
    quality services or large-scale software systems.
  - Solid coding and debugging skills in one or more modern
    programming languages such as C#, Java, C++, Python, or
    TypeScript.
  - Experience designing service APIs and working with
    distributed systems, cloud architectures, storage,
    authentication/authorization, or asynchronous workflows.
  - Solid understanding of software quality practices including
    testing, telemetry, monitoring, reliability, and
    operational readiness.
  - Ability to independently drive technically ambiguous
    projects from problem definition through production.
  - Solid collaboration and communication skills, particularly
    when working across team and organizational boundaries.
  - Experience building services on Microsoft Azure or another
    large-scale cloud platform.
  - Experience with identity, authentication, authorization,
    policy, governance, or enterprise administration systems.
  - Experience with Microsoft Entra ID, Microsoft Graph,
    Microsoft 365, or Power Platform.
  - Experience designing and operating highly available
    distributed services at enterprise scale.
  - Familiarity with AI agents, agentic applications, LLM-based
    systems, or AI application platforms.
  - Experience with service-to-service authentication,
    authorization models, REST APIs, event-driven
    architectures, and distributed workflow orchestration.
  - Solid security mindset and experience with threat modeling,
    least-privilege design, auditing, or compliance-sensitive
    systems.
  - Experience driving technical projects involving multiple
    engineering teams and complex dependencies.

  #CAP #Agent365 #A365



