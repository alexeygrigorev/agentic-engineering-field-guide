description: |
  It takes powerful technology to connect our brands and
  partners with an audience of hundreds of millions of people.
  Whether you’re looking to write mobile app code, engineer
  the servers behind our massive ad tech stacks, or develop
  algorithms to help us process trillions of data points a
  day, what you do here will have a huge impact on our
  business—and the world.

  A Little About Us

  When you impact millions of people every day, you become a
  large target for adversaries of all types within all layers
  of the stack. Our job is to keep our users safe and make
  Yahoo one of the safest places on the Internet. We are the
  information security team at Yahoo; known as "The
  Paranoids".

  As a part of the Paranoids Detection Engineering Team, we
  protect Yahoo, its brands, and their users. We ensure that
  our users are kept safe from targeted attacks and account
  hijacking by government backed attackers. We investigate
  cyber threats which affect Yahoo's infrastructure,
  properties, and worldwide user base and apply innovative
  legal and technical remedies to mitigate those activities.

  A Lot About You

  We are seeking a dynamic Detection Engineering Sr. Manager
  to join our Threat Detection and Response team. Our ideal
  candidate will be a leader who can support their employees,
  brainstorm with their peers, and tenaciously disrupt
  adversaries. This team is responsible for developing
  creative detections in order to identify a wide range of
  cybersecurity threats, from criminal groups to APTs. Our
  candidate will guide, organize, and lead a team who will
  build and maintain threat detection rules. Crucially, they
  will work hand in hand with our Incident Response Team and
  Insider Threat Program to find adversaries. Our candidate
  will also help integrate threat intelligence in
  collaboration with our Advanced Cyber Threats Team to
  enhance our detection capabilities and ensure we identify
  threats to our business as early and as quickly as possible.
  Our candidate will also leverage traditional data science
  along with artificial intelligence capabilities to scale our
  ability to find threats across our infrastructure, using
  sound judgement on how to deploy and validate these new
  capabilities.

  You are an ideal candidate for our team if you value:

  - Protecting employees and users, and making the Internet a
    safer place for everyone.
  - Leading and supporting a team of creative detection
    engineers.
  - Collaboratively working with other security leaders.
  - Thinking outside the box.
  - Relentlessly identifying and stopping bad actors.
  - Demonstrating deep curiosity and staying ahead of the
    evolving cyber threat landscape.
  - Taking proactive initiative to identify gaps and solve
    complex security problems.
  - Building new capabilities.

  On a typical day, you may find yourself:

  - Shaping and executing our cybersecurity detection strategy
    alongside detection engineers and Threat Detection and
    Response leadership.
  - Brainstorming detection, hunt, and purple-team ideas.
  - Running a hypothesis-driven research cycle where every
    engineer carries research commitments and delivery
  - Guiding the sprint process for building and deploying
    detections.
  - Consulting on and supporting cybersecurity investigations as
    a leader of the Threat Detection and Response Action
    Group.
  - Building a new system which catches bad actors.
  - Collaboratively developing Paranoids strategy.
  - Having fun with your team!

  Requirements include a bachelor's degree or equivalent
  experience, along with a strong track record of leading
  security or engineering teams. Qualified candidates should
  possess experience with Python, performant SQL querying, ETL
  workflows and tools, SIEM platforms, statistical analysis,
  machine learning models, and cloud infrastructure (GCP and
  AWS preferred). Experience with AI tools (such as Claude or
  Codex) and sound judgment regarding their practical
  application to detections is highly valued.

  An ideal candidate will bring a firm understanding of threat
  detection frameworks (e.g., MITRE ATT&CK, Lockheed Martin
  Cyber Kill Chain®) and experience applying threat
  intelligence to build effective detection logic. Experience
  with Databricks is a plus.

  The material job duties and responsibilities of this role
  include those listed above as well as adhering to Yahoo
  policies; exercising sound judgment; working effectively,
  safely and inclusively with others; exhibiting
  trustworthiness and meeting expectations; and safeguarding
  business operations and brand integrity.

  At Yahoo, we offer flexible hybrid work options that our
  employees love! While most roles don’t require regular
  office attendance, you may occasionally be asked to attend
  in-person events or team sessions. You’ll always get notice
  to make arrangements. Your recruiter will let you know if a
  specific job requires regular attendance at a Yahoo office
  or facility. If you have any questions about how this
  applies to the role, just ask the recruiter!

  Yahoo is proud to be an equal opportunity workplace. All
  qualified applicants will receive consideration for
  employment without regard to, and will not be discriminated
  against based on age, race, gender, color, religion,
  national origin, sexual orientation, gender identity,
  veteran status, disability or any other protected category.
  Yahoo will consider for employment qualified applicants with
  criminal histories in a manner consistent with applicable
  law. Yahoo is dedicated to providing an accessible
  environment for all candidates during the application
  process and for employees during their employment. If you
  need accessibility assistance and/or a reasonable
  accommodation due to a disability, please submit a request
  via the Accommodation Request Form
  (www.yahooinc.com/careers/contact-us.html) or call
  +1.866.772.3182. Requests and calls received for non-
  disability related issues, such as following up on an
  application, will not receive a response.

  We believe that a diverse and inclusive workplace
  strengthens Yahoo and deepens our relationships. When you
  support everyone to be their best selves, they spark
  discovery, innovation and creativity. Among other efforts,
  our 11 employee resource groups (ERGs) enhance a culture of
  belonging with programs, events and fellowship that help
  educate, support and create a workplace where all feel
  welcome.

  The compensation for this position ranges from $143,625.00 -
  $299,375.00/yr and will vary depending on factors such as
  your location, skills and experience.The compensation
  package may also include incentive compensation
  opportunities in the form of discretionary annual bonus or
  commissions. Our comprehensive benefits include healthcare,
  a great 401k, backup childcare, education stipends and much
  (much) more.

  Currently work for Yahoo? Please apply on our internal
  career site.
