  🧭 Navigating the position: React Front-End Developer We have
  a proven concept and a solid foundation, now, we need a Mid-
  level React Front-End Developer to join our engineering team
  and help design, build responsive, high-performance web
  applications that deliver high quality user experiences. You
  will work closely with product managers, and backend
  engineers, to translate complex requirements into clean,
  maintainable, and scalable front-end solutions. This is an
  excellent opportunity for a developer who enjoys working on
  features end-to-end and staying current with the evolving
  React ecosystem.

  Key Responsibilities

  In this role, you will be a core contributor to our web
  platform. You will:

  - Build & Iterate: Develop new user-facing features using
    React and TypeScript via reusable components.
  - Elevate the Frontend: Use your expert knowledge of React and
    styling frameworks to build beautiful, responsive, and
    accessible interfaces.
  - Automate Everything: Utilise Azure DevOps to manage your
    code (Repos), track your work (Boards), and ensure
    features are successfully deployed via automated
    Pipelines.
  - Collaborate: Work within a loose Agile/Sprint framework,
    contributing to storyboarding, and regular sprint planning
    meetings.
  - Code Quality: Ensuring high code quality through unit/UI
    testing, code reviews, and static analysis tools.
  - Integration: Integrate front-end applications with RESTful
    APIs, and GraphQL endpoints.
  - Performance: Resolve performance bottlenecks (Lighthouse
    scores, etc).

  Skills, Knowledge and Expertise

  You are a mid-level developer who is "hands-on" by nature,
  you don't want to sit in architectural meetings all day; you
  want to build great products.

  - React Expert: You have a track record of shipping
    production-grade apps and understand the nuances of
    components, and performance tuning.
  - Design-Led: You have a keen eye for UX/UI. You understand
    storyboards and can realise Figma designs into production-
    ready components.
  - Tooling Savvy: You are comfortable with Azure DevOps,
    including managing pipelines, boards, and releases.
  - Agile Mindset: You’re comfortable with the iterative nature
    of a growing product and can thrive in a sprint-based
    environment.

   Must-Have Technical Stack

  - Experience: Multiple years of commercial experience building
    and shipping production web applications.
  - Core: React (v18+), TypeScript (v5+), and JavaScript (ES6+).
  - Bundling: Familiarity with modern build tools & bundlers
    (Vite strongly preferred, Webpack experience a plus).
  - Style: Responsive design, and CSS-in-JS or modern styling
    approaches (Bootstrap, Sass).
  - Back-end: Experience consuming and integrating REST APIs.
  - Testing: Jest, Testing Frameworks (ViTest, etc).
  - DevOps: Azure DevOps (Pipelines & Boards).
  - Performance: Familiarity with performance profiling tools.

   Valued Technical Stack

  - Complexity: Previous work on high-traffic / consumer-facing
    apps or apps with complex business logic.
  - Accessibility: Exposure to web accessibility standards and
    testing tools
  - Runtime: Basic understanding of Node.js.

