description: |
  American Specialty Health Incorporated is seeking a Software
  Engineer in Test I to join our growing organization. We are
  looking for creative and analytical problem-solvers to join
  one of our growing Consumer Technology teams and help us
  continue to improve our products and processes so that our
  members and customers can reach their goals. As a company
  that heavily relies on cutting-edge IT operations to serve
  its members, ASH is seeking ambitious individuals with a
  strong team mentality and a genuine passion for software
  engineering. Join a company where programming design and
  quality is expected, appreciated, and nurtured.

  Hourly Salary Range

  American Specialty Health complies with state and federal
  wage and hour laws and compensation depends upon candidate’s
  qualifications, education, skill set, years of experience,
  and internal equity. $39.25 to $45.00 Hourly Wage Range.

  Remote Worker Considerations

  Candidates who are selected for this position will be
  trained remotely and must be able to work from home (WFH) in
  a designated work area with company-provided technology
  equipment. This remote/WFH position requires you have a
  stable connection to your Internet Service Provider with the
  ability to participate by video in online meetings over a
  reliable and consistent network (minimum internet download
  of 50 Mbps and 10 Mbps upload speed).

  Responsibilities

  - Assists in design, development, maintenance, and
    troubleshooting of software applications and test tools.
  - Performs routine automation assignments with minimum
    Manager’s supervision.
  - Develops an understanding of assigned automation tools,
    standards and techniques, and general business knowledge.
  - Demonstrates understanding of departmental procedures,
    programming standards, and all pertinent training
    materials.
  - Design and develop White-box testing of applications.
  - Assist in providing time estimates of assigned tasks and
    compare estimates to actual time spent in order to improve
    estimating accuracy.
  - Recommends possible improvements in applications.
  - Performs code reviews.
  - Communicate directly with product owner and end users.
  - Participates in the training or development of others, as
    directed.
  - Maintains familiarity with and uses department methodology
    as appropriate.
  - Monitors and ensures automated processes run as expected.
    Responsible for remediation.
  - Performs other duties as assigned.
  - Qualifications
  - Bachelor’s degree in an IT or computer or technical related
    field or equivalent experience required. If equivalent
    experience, high school diploma required.
  - Minimum 2 years software test automation experience,
    including object-oriented development (C#), working with
    relational databases and writing SQL queries or stored
    procedures.
  - Experience with software quality assurance procedures and
    processes.
  - Experience with relational database design, writing queries
    and stored procedures with MySQL or Microsoft SQL.
  - Experience with development and consumption of web services
    preferred.
  - Experience with XSLT, XML, JSON.
  - HTTP, C#, React, SQL experience.
  - Experience with software design patterns.
  - Experience with Selenium WebDriver or working with Web
    Services and APIs.
  - Experience with Microsoft technologies such as Dynamics CRM,
    ASP.Net, VB.Net, C#, SQL is a plus but not required.

  Core Competencies

  - Demonstrated ability to interact in a positive, respectful
    manner and establish and maintain cooperative working
    relationships.
  - Ability to display excellent customer service to meet the
    needs and expectations of both internal and external
    customers.
  - Excellent listening and interpersonal communication skills
    to identify critical core competencies based on success
    factors and organizational environment.
  - Ability to effectively organize, prioritize, multi-task and
    manage time.
  - Demonstrated accuracy and productivity in a changing
    environment with constant interruptions.
  - Demonstrated ability to analyze information, problems,
    issues, situations and procedures to develop effective
    solutions.
  - Ability to exercise strict confidentiality in all matters.

  Mobility

  Primarily sedentary, able to sit for long periods of time.

  Physical Requirements

  Ability to speak, see and hear other personnel and/or
  objects. Ability to communicate both in verbal and written
  form. Ability to travel within the facility. Capable of
  using a telephone and computer keyboard. Ability to lift up
  to 10 lbs.

  Environmental Conditions

  Work-from-home (WFH) environment.

