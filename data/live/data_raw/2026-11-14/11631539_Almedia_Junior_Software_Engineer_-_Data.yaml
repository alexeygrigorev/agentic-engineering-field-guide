description: |
  Our bar is high, and this is the best place for ambitious
  builders.

  Bootstrapped and profitable from day one, Almedia is
  Germany’s fastest-growing company (FT1000). Join us as we
  build the global leader in rewards, at a $1bn+ revenue run
  rate and climbing fast.

  Berlin, On-site Top-of-Market Compensation - Exceptional
  commitment deserves exceptional reward



  Most junior data engineers start by maintaining pipelines
  someone else designed, working through a ticket queue, and
  sitting several steps away from the product. Here, you'll
  build the pipelines and services that run live and feed what
  millions of users see every day. You'll take the engineering
  fundamentals you've built and apply them to problems at
  scale. Your first 12 months compress what takes 3 years
  elsewhere.



  You'll join a small team of engineers who have built and run
  data platforms at scale. You'll work on real problems from
  week one with the support to solve them. Show us you can own
  more, and we'll give you more.



  What You'll Do

  - Build and ship data pipelines that run live in production,
    from ingestion to storage, across near-real-time and batch
    workloads.
  - Build Python services and APIs that other teams and products
    rely on.
  - Work with operational databases and learn to run them under
    real production load: schema design, reliability, and
    performance.
  - Build tests, monitoring, and data quality checks that catch
    problems before a stakeholder has to tell you.
  - Help keep a warehouse of hundreds of terabytes fast,
    reliable, and cost-efficient.
  - Own undefined data problems from first idea to production.
    No playbook. You own it all.



  What You'll Bring

  - Strong Python and SQL. You use AI tools to move faster, and
    you still verify the output.
  - Proof of depth as an engineer: a degree in computer science
    or a related field, internships, open-source work, a
    thesis, or a system you built yourself and kept running.
  - Hands-on experience with a database beyond the basics
    (PostgreSQL, MongoDB, or similar). You understand schemas,
    indexes, and what breaks under load.
  - You get going on a vague problem without waiting for a spec,
    and you take it further than you were asked.
  - You think about reliability. You debug rigorously when
    things break, and you want to know why before you fix it.
  - Bonus: Kafka or Pub/Sub, dbt, Docker, Terraform, competition
    results, or a project you built and hardened yourself.



  Why Almedia

  - Grow at Almedia: profitable from launch, higher revenue per
    employee than Big Tech.
  - Sharp, small team: we keep it small on purpose, every hire
    raises the bar.
  - Equity: every Berlin employee gets a stake.
  - Top-of-market baseline. Deliver outlier impact, earn
    accordingly.



  Small team, high bar. Growing at scale. If that sounds like
  home, apply.

  We believe in fostering talent, evaluating all skill levels
  during the hiring process, and providing a clear path for
  growth. Almedia is an equal opportunity employer. We embrace
  and celebrate diversity, and encourage individuals from all
  backgrounds to apply.
