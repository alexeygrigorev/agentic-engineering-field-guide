description: |
  The Bank of New York Mellon seeks a Senior Vice President,
  Front-End Engineer for its New York, NY location.

  DUTIES: Consult with internal business groups to provide
  high-level application software development services or
  technical support. Utilize the user-side frontend of a
  website, as well as the backend, server-side that powers the
  user-side. Utilize security principles, relational databases
  and architecture design principles. Provide comprehensive
  senior-level technical consulting to IT management and
  senior technical staffs. Evaluate compliance with the
  organization's technology standards. Program well-designed,
  testable, efficient/ code. Analyze, design and develop tests
  and test-automation suites. Develop flowcharts, layouts and
  documentation to satisfy requirements and solutions.
  Maintain software functionality and currency (technical debt
  and gain). Actively participate in code reviews. Integrate
  software components into a fully functional software system.
  Apply security and privacy principles. Work with internal
  business groups on implementation opportunities, challenges,
  and requirements of various applications. Analyze
  information and provides recommendations to address and
  resolve business issues for a specific business group.
  Consult with IT management and technical staffs regarding
  use of emerging technologies and associated services.
  Participate in defining corporate implementation and
  integration strategies of new technologies. Remote work may
  be permitted within a commutable distance from the worksite.

  REQUIREMENTS: Bachelor’s degree, or foreign equivalent, in
  Computer Science, Computer Engineering, Information
  Technology, or a related field, and nine (9) years of
  experience in the job offered, or in a related IT
  occupation. Nine (9) years of experience must include:
  Designing and developing RESTful backend services using .Net
  to fetch financial data including accounts, portfolios,
  clients, and holdings from different data sources in an
  orchestrated manner and presenting the data to the caller as
  a single response; Designing and developing reusable
  components and libraries using HTML, CSS and JavaScript;
  Designing and maintaining coding standards and best
  practices and enforcing them using tools including Git, CICD
  pipelines and through unit testing; Designing and developing
  CI/CD architecture and best practices using GitLab;
  Reviewing code written by team members in JavaScript,
  Angular, NodeJS and .Net for frontend and backend systems;
  and Deploying applications using CI/CD, provisioning Kafka
  objects for applications using JavaScript, Python and Shell
  script. Salary Range: $184,959.00 to $246,000.00/yr.
  Qualified applicants please apply online at
  https://bnymellon.eightfold.ai/careers and utilize reference
  code #67282. Please indicate “referral source –
  advertisement – WEB.”

  The Bank of New York Mellon assesses market data to ensure a
  competitive compensation package for our employees. The base
  salary/range for this position is expected to be $184,959.00
  to $246,000.00 per year at the commencement of employment.
  Base salary if hired will be determined on an individualized
  basis, including as to experience and market location, and
  is only part of The Bank of New York Mellon total
  compensation package, which, depending on the position, may
  also include commission earnings, discretionary bonuses,
  short and long-term incentive packages, and Company-
  sponsored benefit programs.

  This position is at-will, and the Company reserves the right
  to modify base salary (as well as any other discretionary
  payment or compensation) at any time, including for reasons
  related to individual performance, change in geographic
  location, Company or individual department/team performance,
  and market factors.

