description: |
  About SolveAI

  Most enterprise problems never get solved in software,
  because the person who understands the problem and the
  person who can build the fix are never the same person.
  SolveAI closes that gap.

  Our platform lets the people closest to the problem build
  real, production-grade software by describing what they need
  in plain English. It plugs into the enterprise stack as it
  actually exists, and what it ships clears the bar
  enterprises actually hold software to: secure, compliant,
  reliable, maintainable, and able to scale. The result is
  software tailored to each customer's environment, owned by
  them.

  Unlike the wave of "vibe coding" tools squinting at the
  enterprise from the consumer world - hoping the hard parts
  can be bolted on later - we started at the hard end. For us,
  that bar is the foundation we build on, not a roadmap item.

  We can do this because of who's in the room: a team that's
  spent decades operating inside the world's most complex
  organisations, not just observing them. Backed by GV and
  Accel, built by an ex-Palantir team, and already live with
  enterprise customers.

  What We Offer

  - High-impact environment: Join a company shaping the future
    of enterprise software, working with a team that's
    redefining how AI meets real-world business needs
  - Ownership and visibility: In a small, high-performing team,
    the impact of your work isn't theoretical - it actively
    shapes the company's direction
  - Empowerment through innovation: Use cutting-edge AI tools
    internally. You'll be working with the same technology we
    deliver to enterprises

  We’re seeking exceptional Software Engineers to help build
  all areas of our product: from crafting intuitive user
  interfaces and developing APIs, database interactions, and
  agent management all the way to how we deploy our
  infrastructure in a scalable and reliable way. You’ll play a
  pivotal role in the early stage of development, and thus
  have agency to contribute and shape the product that we
  build as a company.

  Our platform is built in Rust, with gRPC powering
  communication between services, and TypeScript for agent
  orchestration and frontend. We’re also very happy to support
  and train anyone who’s keen to learn this stack.

  Responsibilities

  As a software engineer, your primary responsibility will be
  developing our product. However, being a true startup, you
  will have the agency to contribute to any area that you have
  expertise in: both within engineering and without, and we
  empower our employees to take ownership and have impact.

  Requirements

  We’re looking for curious and pragmatic engineers who are
  passionate about having meaningful impact, combining
  creativity, critical thinking, a product mindset, and a
  drive to turn ideas into tangible outcomes.

  Engineers from all backgrounds and levels of experience are
  encouraged to apply. Prior experience writing backend
  systems is valuable, and knowledge in writing sensible code
  and designing pragmatic systems is essential, but no prior
  Rust experience is required; we will ramp up new employees
  on the language. An interest in building agentic workflows
  is a big plus.

  Why SolveAI

  At SolveAI, you'll work alongside a team that's spent
  decades solving the hardest enterprise challenges, from
  operational inefficiencies to data fragmentation.

  If you want to see real change in the world, care deeply
  about value add, and thrive when given ownership in
  unfamiliar environments, we'd love to hear from you.
