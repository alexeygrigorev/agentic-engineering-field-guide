description: |
  Company Description

  We are a growing company with 7 years of experience and
  start-up character with a modern HQ in Grunewald, one of the
  greenest areas of Berlin. Our international team has
  a family atmosphere, great work-life balance and provides
  all what you need to become a champ. We provide tailor-made
  solutions for our customers; we offer optimal individual
  possibilities for the planning and realization of web and
  app projects. Due to the interdisciplinary fields of work,
  Bitlane offers an exciting work environment in various
  projects and tasks! We are searching for hands-on developers
  to join our growing team, who will have fun while accepting
  new challenges and elevate each-other to successfully reach
  company goals. We want to develop awesome projects alongside
  other talented developers and be a part of digitalization. 

  Job Description

  We are looking for a software senior backend engineer to
  join our highly motivated team of tech enthusiasts. You will
  be responsible for participating in our product development
  from ideation to deployment and beyond. You work closely
  with our project managers and frontend developers to meet or
  exceed the expectations of the requirements. The ideal
  candidate has a thorough understanding of software
  engineering and development standards and best practices.
  You deliver clean, maintainable and error proof code with
  good test coverage. You write test automation, conduct code
  reviews, and take end-to-end ownership. Also, you should be
  a problem-solver with an inquisitive and innovative mind to
  leverage your software development skills to help build new
  services. You will be responsible for back-end development
  on a wide range of projects and will work together with our
  international team on the various layers of our
  applications. The complexity of these projects can vary from
  small apps and one pager websites to e-commerce shop systems
  up to whole CRM Systems and gated company portals. If you
  recognize your skills in this job description, we would be
  happy to receive your application!

  Responsibilities:

  - Collaboration with our software team to design and launch
    new features
  - Improving our product and codebase with your analytical
    mindset
  - Keeping our system state-of-the-art and developing our
    growing environment
  - Developing and extending our existing web technology
    portfolio
  - Building new micro-services with AWS, and improve existing
    ones
  - Creating and maintaining tools to interact with software and
    data
  - Defining a project scope together with a project manager
  - Communicating the status of your work and meeting deadlines
    defined by you and a project manager

  Qualifications

  - At least 2 years backend development experience
  - Extensive knowledge of modern Javascript processes
  - Experience using CSS preprocessors like Sass, Less or Stylus
  - Highly self-driven, responsible and keen to learn and
    improve
  - Professional experience with AWS, Google Cloud or Microsoft
    Azure
  - Professional understanding of two backend programming
    languages (PHP, Java, Node.js, Python...) and AWS
    development
  - Fixing bugs in existing projects
  - Have experience with Infrastructure as Code, continuous
    integration & deployment and monitoring
  - Experience in coding practices, working with Git and have
    GitHub collaboration skills
  - Experience with integrating third-party API’s
  - Experience with WordPress, Laravel, React, Angular is a big
    advantage
  - Fluent English - German is a plus, but not necessary

  Additional Information

  - Detailed training with professional support
  - Permanent employment contract with home office options
  - Flat hierarchies and flexible working hours
  - Attractive remuneration
  - Regular further education offers
  - Coordinated team events
  - Fresh fruit, ice-cream, coffee, tea and cold drinks
  - High-quality office in the heart of the Grunewald

  Sounds like you? Great, we would love to hear from you!
  Please include your CV and a short cover letter explaining
  who you are, what is your superpower and your salary
  expectations. Feel free to send us something that shows us a
  little more about what you’re interested in - be it your
  account on GitHub, Twitter, Instagram, Medium or your blog.
