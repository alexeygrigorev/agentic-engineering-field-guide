description: |
  SideShift is building the operating system for the creator
  economy.

  We connect brands with creators and make it dramatically
  easier to discover talent, run campaigns, track performance,
  and pay creators. Today, more than 1M creators and 3,000+
  brands use SideShift, and more than $100M has been paid to
  creators through the platform.

  Our web app is at the center of the customer experience.
  Brands use SideShift to launch campaigns, discover and
  interact with creators, and track performance.

  The Role

  Sideshift is looking for a Software Engineer with a strong
  background in back-end web development to join our
  innovative team. This individual will be crucial in
  designing, developing, and maintaining the software systems
  that power our creator marketplace. We are seeking a
  collaborative problem-solver who is passionate about
  building scalable solutions and contributing to the
  evolution of our platform.

  What You'll Do

  - Design, develop, and maintain robust software systems;
  - Collaborate with cross-functional teams to integrate
    technology solutions seamlessly;
  - Focus on back-end web development, including programming and
    debugging;
  - Implement scalable solutions to enhance our marketplace
    platform;
  - Contribute to all phases of the software development
    lifecycle.

  What We're Looking For

  - 1–5 years of software engineering experience;
  - Proficiency in Typescript and Postgres;
  - Highly resourceful and willing to dig into problems
    yourself;
  - Excited about AI agents and automation;
  - Comfortable in a fast-moving startup environment; and
  - Willing to work 5 days/week from our NYC office.

  The Process

  - Initial convo with Drew Levin, Co-founder & CTO;
  - Technical conversation with Liam Shalom, Software Engineer;
  - Work Trial -- we invite you to a paid 2-3 day working
    session with the team. We've found this is the best way
    for candidates and the SideShift team to feel confident in
    making a decision;
  - Offer stage! After agreeing on employment terms, we'll talk
    to 3 references and send over final documents for
    signature.

  Location: New York City — In Person 5 days per week

  Compensation: $130,000–$180,000 + equity, depending on
  level.
