description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  The Manager – Oracle Human Capital Management (HCM) System
  will lead the engineering team responsible for the
  architecture, delivery, maintenance, and operational
  reliability of HCM integrations and related application
  capabilities. This role will own the HCM roadmap execution,
  including integrations, Visual Builder enhancements,
  workflow approval processes, security roles,  engineering
  execution, production support, and all other team
  development activities while ensuring alignment with
  business priorities and the broader Oracle transformation.

  Partnering closely with the Senior Integration Engineer –
  HCM Applications, business stakeholders, and external
  implementation partners, this leader will maintain
  continuity across existing HCM operations while delivering
  scalable solutions for future business needs. The ideal
  candidate combines strong people leadership with deep
  technical expertise, sound operational judgment, and
  experience managing complex enterprise transformations.
  Strong, clear communication is required for interacting with
  internal and external teams as well as leadership.

  Responsibilities:

  - Lead HCM integration engineers across HCM applications to
    deliver outstanding, innovative solutions.
  - Strong technical skills and background to develop
    integrations, apply visual builder enhancements,
    understand/provision security roles, understand workflow
    notifications/approvals, in addition to other HCM
    activities.
  - Own roadmap planning, prioritization, resource allocation,
    and delivery across BAU, existing HCM application
    maintenance, and transformation initiatives.
  - Oversee integrations supporting recruiting, onboarding,
    benefits, payroll, core hr, learning, and performance
    management.
  - Manage Visual Builder Studio enhancements to meet customer
    requirements.
  - Partner with the Senior Integration Engineer to establish
    architectural direction and engineering standards across
    HCM and OIC development.
  - Ensure consistent practices for design reviews, code
    quality, testing, deployments, monitoring, documentation,
    and change management.
  - Own production support and serve as the primary management
    escalation point for critical HCM application and
    integration issues.
  - Establish support coverage, on-call rotations, escalation
    paths, recovery procedures, and primary/secondary
    ownership for critical systems.
  - Lead HCM integration delivery for the Oracle transformation,
    including testing, cutover readiness, and post-launch
    stabilization.
  - Manage Deloitte and other implementation partners and
    vendors, ensuring clear accountability, delivery quality,
    and knowledge transfer.
  - Partner with business stakeholders to manage requirements,
    dependencies, and competing priorities; communicate
    progress, risks, and resource needs to leadership.
  - Ensure adherence to security, employee data privacy, access
    controls, SOX requirements, and change-management
    processes.
  - Reduce key-person dependencies through cross-training,
    documentation, and succession and coverage planning.
  - Work with internal and external partners to complete
    challenging projects, on time, and with scalable
    solutions.

  Required Qualifications & Experience

  - 15+ years of progressive experience in enterprise
    application engineering, HCM technology, or integrations,
    including 4+ years managing engineering teams.
  - 8+ years of managerial experience managing combination of
    onshore/offshore resources
  - Proven experience hiring, coaching, and developing engineers
    and managing employees, contractors, and geographically
    distributed teams.
  - Significant experience leading enterprise HCM integrations
    across benefits, payroll, retirement, equity
    administration, identity, and employee data management.
  - Strong expertise in Oracle HCM Cloud OCI, OIC, Oracle HCM
    APIs, HCM Extracts, HDL/HSDL, and related integration
    technologies.
  - Strong knowledge of REST/SOAP APIs, web services,
    middleware/iPaaS, SFTP/file-based integrations, batch
    processing, and event-driven integrations.
  - Solid experience using pgp encryption/decryption
    capabilities.
  - Strong understanding of server connectivity using ssh keys.
  - Working knowledge of HCM security roles, areas of
    responsibility, workflows, Fast Formulas, value sets,
    RTF/XSLT templates, and Visual Builder Studio.
  - Demonstrated ability to guide architecture, evaluate
    technical decisions, and establish scalable and
    maintainable engineering practices.
  - Proven experience supporting business-critical production
    systems, including incident management, root-cause
    analysis, monitoring, and operational improvement.
  - Experience balancing business as usual needs with large
    projects, major implementations, migrations, or
    transformation initiatives.
  - Experience managing implementation partners and vendors,
    including delivery oversight, knowledge transfer, and
    transition to internal support.
  - Strong understanding of data security, privacy, access
    controls, and handling of sensitive employee information.
  - Experience partnering with HR/HCM, Benefits, Payroll,
    Security, and Enterprise Technology stakeholders.
  - Experience with Oracle Fusion Financials a plus.
  - Experience with Oracle E-Business Suite 12.x on an AIX
    platform would be beneficial.
  - Excellent prioritization, communication, and stakeholder-
    management skills, with the ability to clearly explain
    technical risks and delivery tradeoffs.
  - Experience using Jira for SDLC, backlog management, sprint
    planning, and reporting. Experience leading daily standups
    when needed as well as sprint ceremonies.
  - Bachelor’s degree in Computer Science, Engineering,
    Information Systems, or equivalent practical experience.
  - Experience operating in a SOX-controlled enterprise
    environment and leading HCM platform transformations is a
    plus.
  - Self motivated leader, looking to proactively identify and
    solve blockers.

  Compensation: The base pay range for this position is
  $140,490-$156,100; however, base pay offered may vary
  depending on job-related knowledge, skills, and experience.
  Bonuses and restricted stock units may be provided as part
  of the compensation package, in addition to a full range of
  benefits. Base pay is based on market location. Minimum wage
  for the position will always be met.

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



