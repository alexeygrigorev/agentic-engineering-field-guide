description: |
  Why LeoLabs?

  At LeoLabs, we’re building the living map of activity in
  space. Through our proprietary global radar network and AI-
  enabled analytics platform, we collect millions of
  measurements daily on more than 25,000 objects in low Earth
  orbit (LEO). Our radar-powered intelligence protects
  billions in assets, monitors adversarial behavior, and
  ensures safe operations for commercial and government
  missions.

  We’re not just building technology, we are redefining global
  security, safety, and transparency in space. As orbital
  activity accelerates and threats grow more complex, LeoLabs
  is a trusted partner for Space Domain Awareness, Space
  Traffic Management, and Satellite Operations for top-tier
  space operators and allied defense organizations.

  If you're looking to work on mission-critical challenges at
  the forefront of aerospace, national security, and AI, your
  impact starts here.

   The Opportunity:

  We are seeking an experienced and highly motivated Full
  Stack Software Engineer to join our team at LeoLabs. You
  will be an integral contributor to our cross-functional
  Insights team. This is a highly collaborative team of
  approximately 8 engineers and a key part of the broader,
  40-person software engineering organization. The Insights
  team is responsible for customer-facing analytics and
  integrations with customer systems. This includes user
  interfaces, integrations between APIs, deploying code to the
  cloud and to on-site environments, and LeoLabs’ data lake.
  The team leverages services built and maintained by other
  teams, including radar development and operations and
  catalog maintenance.

  You will be responsible for building and delivering business
  services, APIs and customer facing applications and
  integrations to support our mission.  Your work will
  facilitate delivery of mission-critical data, empowering
  customers to make real-time operational decisions that
  protect and manage objects in low-earth orbit. This role
  requires solid hands-on experience in both API and service
  development and the development of rich, interactive user
  interfaces, with the ability to deliver features across both
  layers.

  Qualifications:

  - B.S., M.S in Computer Science, Software Engineering, or
    equivalent experience
  - Proven experience (3+ years) as a Software Engineer in a
    fast-paced software development environment.
  - Extensive experience designing, building, testing, deploying
    and maintaining cloud-based software services and APIs,
    including those supporting customer-facing applications.
  - Solid experience designing, building and testing rich,
    interactive user interfaces using TypeScript or
    JavaScript, HTML, CSS and a modern front-end framework,
    including integration with back-end APIs and services.
  - Significant expertise in one or more of the following
    programming languages: Python, Go, C++.
  - Strong knowledge of software development and testing
    methodologies, best practices, and industry standards.
  - Experience with cloud environments like AWS/GCP/Azure.
  - Experience with databases like Postgres/MySQL.
  - Experience building message-driven applications with tools
    such as Kafka, RabbitMq and SQS.
  - Solid understanding of Agile workflows and principles.
  - Strong communication and interpersonal skills, with the
    ability to collaborate with various stakeholders.
  - Ability to work on-call outside of normal business hours
    during critical escalations.
  - Eligibility to obtain and maintain a U.S. Personnel Security
    Clearance

  Preferred qualifications:

  - Familiarity with deploying and managing applications in
    Kubernetes, including container orchestration, scaling,
    and monitoring in cloud environments.
  - Background in Math/Physics, AI/ML, or Orbital mechanics.
  - Active US security clearance.

  Within 1 month, you’ll:

  - Complete our onboarding program designed to get you up to
    speed on our business, vision, and team.
  - Successfully set up local dev environment, tools, and
    access.
  - Attend sprint ceremonies and shadow code reviews to begin
    ramping up on Insights codebase and processes.
  - Complete first small, low-risk changes or documentation
    updates under guidance.

  Within 3 months, you’ll:

  - Understand core architecture and dependencies for Insights
    products.
  - Begin tackling small-to-medium scoped features with coaching
    and mentoring support from peers.
  - Work comfortably within the team’s agile processes and
    contribute to task planning and estimation.

  Within 6 months, you’ll:

  - Demonstrate solid grasp of team’s architecture,
    dependencies, and operational practices.
  - Actively contribute to software deliverables with some
    coaching and mentoring, consistently shipping well-tested,
    reliable code.
  - Own and drive deliverables to completion, including design
    and implementation of scoped work.

  Within 12 months, you’ll:

  - Demonstrate full proficiency in the team’s tech stack and
    operational practices.
  - Deliver complex features end-to-end with minimal oversight.
  - Act as a trusted peer through code reviews and helping shape
    technical discussions and decisions
  - Proactively identify continuous improvement opportunities
    across the codebase

  Compensation

  This position is benchmarked to San Francisco CA Bay Area
  with a base salary range of $$118,000–$$139,000 plus bonus
  and equity. Actual base salary will be determined based on
  the candidate’s work location, experience, skills, and other
  applicable factors.

  Perks and Benefits

  - 100 USD monthly wellness benefit to support your health and
    well-being
  - $300 USD home office setup stipend, available for use within
    your first six months
  - $75 USD monthly home internet allowance, paid directly
    through your regular paycheck
  - Individual Development Fund to support training, learning,
    and professional development
  - Employee Recognition Program to celebrate contributions and
    achievements across the team
  - Employee Referral Program so you can help us connect with
    great talent
  - And much more!



  ITAR Requirements

  To conform to U.S. Government space technology export
  regulations, including the International Traffic in Arms
  Regulations (ITAR) you must be eligible to obtain the
  required authorizations from the U.S. Department of State.
  More information regarding ITAR can be found at DDTC’s
  website. 



  Vendor Notification

  LeoLabs does not engage external staffing agencies or third-
  party recruiting firms for this role. Unsolicited candidate
  submissions will not be considered.

  We are committed to maintaining a respectful and inclusive
  workplace where employees are valued for their skills,
  experience, and contributions. We are an equal opportunity
  employer and make employment decisions based on
  qualifications, skills, experience, and business needs,
  consistent with applicable law.

  Accuracy of Application Information. LEOLABS requires
  applicants to provide truthful, accurate, and complete
  information throughout the hiring process, including in
  applications, résumés, interviews, and supporting materials.
  This requirement expressly includes representations
  concerning security clearance status, level, eligibility,
  and access. LEOLABS may verify such information through
  appropriate authorized channels. Any intentional
  falsification, material misrepresentation, or deliberate
  omission of material information will result in
  disqualification from further consideration or withdrawal of
  an employment offer and, if discovered after employment
  begins, may result in termination, subject to applicable
  law.

