title: Senior Software Engineer
company: CloudMargin
location: London, GBR
work_type: FULL_TIME
company_size: 57 Employees
description: |
  Primary Purpose of Role

  We’re looking for an experienced engineer to join one of our
  product teams, building customer-facing features on the
  CloudMargin platform – a growing number of which are AI-
  powered. We’ll bring you clearly defined problems; you’ll
  shape the design of the solution and deliver it end to end.
  You’ll use modern tooling to move quickly, and strong
  engineering discipline to give our financial-institution
  clients the reliability and security they expect.

  Core Accountabilities

  •  You’ll build and ship customer-facing features end to
  end, from prototype to production •  You’ll contribute to
  architecture and design within the direction our Tech Lead
  sets, making sound decisions at the component and service
  level and explaining your reasoning •  You’ll make what you
  build dependable, with the tests, monitoring and safeguards
  our financial clients expect – including for AI features,
  where behaviour is less predictable •  You’ll use AI-
  assisted tools such as Claude Code effectively, while taking
  ownership of everything that ships – you review all of it,
  whoever or whatever wrote it •  You’ll give thoughtful code
  reviews, pair with colleagues regularly and share what you
  learn so the whole team benefits •  You’ll take operational
  responsibility: investigating and fixing issues, and keeping
  stakeholders informed

  Experience & Skills

  •  You have 5+ years of professional software development
  experience, or equivalent •  You’re strong in TypeScript and
  Node.js, and comfortable working in React •  You’ve
  designed, shipped and run production services, including
  RESTful APIs and microservices – and lived with the
  consequences of your design decisions

  •  You test rigorously and habitually think about how
  software can fail •  You have experience with AWS and CI/CD;
  serverless experience (Lambda, API Gateway, SQS) is a plus •
  You communicate clearly, in writing and in conversation, and
  you collaborate well – bringing your own ideas while working
  within a shared technical direction •  You’re curious about
  new technology, including AI. If you’ve been experimenting
  with AI tools or side projects, at work or outside it, we’d
  love to hear about it

  We see years of experience as a guide, not a requirement. If
  you can show these skills another way, we’d still love to
  talk.

  What We’ll Teach You

  We work in fast-moving pods that use AI tools like Claude
  Code every day, and every engineer owns and reviews what
  they ship. Our stack is TypeScript, Node.js and React, with
  microservices on AWS – we run on Fargate today and are
  moving to Lambda, API Gateway and SQS. We practise TDD and
  have full CI/CD.

  Education / Professional Qualifications

  We don’t require any specific qualifications

  Compensation & Benefits

  We offer a competitive base salary Leave: 25 days’ paid
  leave a year, plus all public holidays Flexibility: hybrid
  working, with at least two days a week in the office, plus
  45 working days you can work from anywhere (WFA) Learning
  and development: £1,000 (or local equivalent) per year
  Family: 6 weeks’ enhanced paternity pay, enhanced maternity
  pay and family-friendly policies Wellbeing: a pension, life
  insurance and 2 wellness days a year (no questions asked!)
  Health: private healthcare

  Equal Opportunities

  We’re committed to equal opportunities in employment and to
  a working environment free from discrimination, bullying,
  harassment and victimisation. We welcome applications from
  people of all backgrounds, and we’ll make reasonable
  adjustments at any stage of the recruitment process – just
  let our Recruiting Team know what you need.

  Candidate Privacy Policy

  https://cloudmargin.com/privacy-policy/
