title: Full Stack Developer III - Private Markets Applications
company: Neuberger Berman
location: New York, USA
work_type: FULL_TIME
company_size: 2,667 Employees
description: |
  Neuberger is seeking a talented, hands-on Senior Full-Stack
  Engineer to join our technology team and help shape the
  digital experiences our clients rely on every day. You will
  be a core contributor to Neuberger's client-facing web and
  mobile platforms, built to serve sophisticated institutional
  and private markets investors, with the opportunity to bring
  engineering excellence directly to bear on client impact.

  You will work across the full stack, with a strong emphasis
  on building polished, performant, and accessible front-end
  experiences. You will partner closely with UX designers,
  product managers, and business stakeholders to translate
  complex financial data into intuitive, engaging interfaces —
  while also contributing to the cloud-native architecture,
  data pipelines, and observability practices that keep these
  platforms running reliably at scale.

  What You'll Do

  - Design and deliver polished, client-facing web experiences
    that reflect Neuberger's brand and meet the expectations
    of sophisticated institutional and private markets clients
  - Build scalable, high-performance front-end applications with
    a focus on component architecture, state management, data-
    fetching patterns, type-safe API contracts, and robust
    error handling
  - Partner with UX/UI designers, product managers, and client-
    facing business stakeholders to translate user research
    and client feedback into refined, production-ready
    features
  - Ensure all client-facing interfaces meet WCAG accessibility
    standards (minimum AA compliance) and perform consistently
    across supported browsers and devices
  - Contribute to and enforce front-end design systems and
    component libraries that ensure visual consistency across
    client-facing products
  - Develop and maintain ETL pipelines to ensure accurate,
    timely, and high-quality data movement across platforms
  - Drive cloud-native architecture decisions leveraging
    containerization, serverless computing, and modern DevOps
    practices
  - Deliver production applications instrumented with
    OpenTelemetry, with particular attention to performance,
    uptime, and reliability given direct client exposure
  - Contribute to mobile application development efforts as
    needed, applying full-stack skills to extend client-facing
    experiences beyond the web platform.
  - Explore and implement automation and workflow optimization
    opportunities using Python, .NET, NodeJS, or other modern
    tooling
  - Conduct code reviews and mentor developers on best practices
    in front-end engineering, security, and performance
  - Collaborate cross-functionally with infrastructure, DevOps,
    and data engineering teams to ensure seamless end-to-end
    delivery

  What We're Looking For

  Must Have

  - Bachelor's degree in Computer Science, Data Science,
    Engineering, or equivalent work experience
  - 4 – 6 years of hands-on experience developing enterprise
    applications, with a strong emphasis on front-end
    engineering
  - Demonstrated experience shipping client-facing or externally
    accessible web applications, with direct accountability
    for user experience quality, performance, and reliability
  - Strong proficiency in React and TypeScript, including
    single-page application architecture, modern component
    libraries (Material UI, shadcn/ui), solid CSS
    fundamentals, theming, and web performance best practices
    (Core Web Vitals, lazy loading, code splitting, and
    caching strategies)
  - Experience with modern database technologies — SQL Server,
    PostgreSQL, MongoDB, or CosmosDB
  - Experience building and/or maintaining ETL pipelines and
    data flows across platforms
  - Hands-on experience with Docker/containerization and CI/CD
    pipelines
  - Experience building secure, cloud-native applications —
    including identity-aware authentication, secrets
    management, least-privilege access, and secure handling of
    sensitive client or investor data
  - Strong written and verbal communication skills, with the
    ability to translate technical decisions for non-technical
    business and client-facing stakeholders
  - Strong problem-solving skills, attention to detail, and the
    ability to empathize with end-client workflows —
    translating complex financial data into clean, intuitive
    user experiences
  - Ability to work both independently and collaboratively in a
    fast-paced, agile environment

  Nice to Have

  - Experience with .NET
  - Kubernetes or OpenShift experience
  - Azure experience, including Container Apps and Entra ID
  - Mobile application development experience
  - Familiarity with observability and monitoring practices,
    including OpenTelemetry
  - Experience in financial services; familiarity with private
    markets, fund data, or investor-facing platforms is a
    strong plus
  - Familiarity with AI-assisted development tools such as
    GitHub Copilot, Claude, or similar, and modern development
    environments such as devcontainers or cloud workspaces
  - Experience working in a formal Agile/Scrum environment

  #LI-DD2

  #LI-Hybrid

  Applicants must be authorized and have the right to work in
  the country where the role is located without the need for
  current or future sponsorship.

  Compensation Details

  The salary range for this role is $110,000-$135,000. This is
  the lowest to highest salary we in good faith believe we
  would pay for this role at the time of this posting. We may
  ultimately pay more or less than the posted range, and the
  range may be modified in the future. This range is only
  applicable for jobs to be performed in the job posting
  location. An employee’s pay position within the salary range
  will be based on several factors including, but limited to,
  relevant education, qualifications, certifications,
  experience, skills, seniority, geographic location, business
  sector, performance, shift, travel requirements, sales or
  revenue-based metrics, market benchmarking data, any
  collective bargaining agreements, and business or
  organizational needs. This job is also eligible for a
  discretionary bonus, which, along with base salary and
  retirement contributions, is part of our total comprehensive
  package. We offer a comprehensive package of benefits
  including paid time off, medical/dental/vision insurance,
  retirement, life insurance and other benefits to eligible
  employees.

  Note: No amount of pay is considered to be wages or
  compensation until such amount is earned, vested, and
  determinable. The amount and availability of any bonus,
  commission, production, or any other form of compensation
  that are allocable to a particular employee remains in the
  Company's sole discretion unless and until paid and may be
  modified at the Company’s sole discretion, consistent with
  the law.

