title: Software Engineer - Data Lifecycle
company: "Qube Research & Technologies"
location: London, GBR
work_type: FULL_TIME
company_size: 774 Employees
description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology- and
  data-driven group implementing a scientific approach to
  investing. Combining data, research, technology, and trading
  expertise has shaped our collaborative mindset, which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high-quality returns for our investors.

  You will join QRT’s Data team as a Software Engineer,
  working at the intersection of engineering, trading, and
  research. Your focus will be on delivering scalable systems
  for reference data management, regulatory and external
  reporting, and front-office analytics. This role offers
  direct visibility across the business and the opportunity to
  collaborate with stakeholders across Execution, Engineering,
  and Research teams. Every project you work on will
  contribute to operational efficiency and trading decision-
  making.

  Your role at QRT

  This is primarily a hands-on engineering role (≈80%
  development), with a smaller component (≈20% support and
  system ownership) focused on maintaining robustness,
  reliability, and data quality in production.

  You’ll work closely with trading, research, risk, and
  operations teams, gaining strong exposure to the business
  while building scalable, high-performance systems.

  What you’ll work on

  - Designing and building scalable, high-performance systems
    for trade and position lifecycle management
  - Developing solutions to automate lifecycle events such as
    corporate actions, expiries, and cash flows across asset
    classes
  - Building and maintaining high-quality reference data
    platforms used across trading and research
  - Delivering real-time and end-of-day reporting pipelines for
    internal and external stakeholders
  - Ensuring data accuracy, integrity, and consistency across
    systems and workflows
  - Contributing to system validation, controls, and operational
    robustness, including alignment with brokers and fund
    administrators
  - Collaborating closely with stakeholders to translate
    business needs into reliable technical solutions
  - Writing well-tested, maintainable code and contributing to
    CI/CD and deployment pipelines
  - Supporting production systems and continuously improving
    reliability, monitoring, and performance

  What we’re looking for

  - 5–10 years of software engineering experience, ideally in a
    high-performance or data-intensive environment
  - Strong programming skills in Python (experience with C# is a
    plus)
  - Solid understanding of software design, architecture, and
    scalable systems
  - Experience working with SQL and relational databases
  - Familiarity with testing frameworks and CI/CD practices

  Domain experience (one or more is valuable, not required).
  We’re interested in engineers with exposure to financial
  markets, particularly:

  - Trade and position lifecycle systems
  - Equities, ETFs, futures, or options
  - Corporate actions and reference data
  - Market structure and exchange-specific behaviour

  Deep expertise in a single asset class is not required—but
  an interest in learning and working in a trading environment
  is important.

  What will set you apart

  - Experience building systems in a quantitative trading or
    financial environment
  - Strong problem-solving skills with a focus on performance,
    scalability, and data quality
  - Ability to operate in a high-impact, fast-paced environment
    with evolving requirements
  - Clear communication skills and a collaborative mindset

  Why join QRT?

  - Work on business-critical systems with direct impact on
    trading outcomes
  - Join a core engineering team with significant ownership and
    autonomy
  - Collaborate with traders, researchers, and engineers in a
    highly technical environment
  - Tackle complex data and systems challenges at scale

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
