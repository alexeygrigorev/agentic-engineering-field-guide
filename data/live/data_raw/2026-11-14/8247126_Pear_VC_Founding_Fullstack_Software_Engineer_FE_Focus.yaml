description: |
  Breakthrough medicines all start the same way: years of
  research, mountains of data, and countless decisions made by
  medical teams within the world's premier biopharma labs.

  These decisions then determine which treatments make it to
  market, how doctors learn about them, and ultimately which
  patients get access to life-saving care and when. We're at
  an inflection point. AI-powered drug discovery, precision
  medicine, and an explosion of real-world evidence have
  accelerated what's possible, but the teams translating
  science into patient access are drowning in data they can't
  use.

  The tools haven't kept up with the stakes. Atrix builds
  purpose-built AI for life sciences, designed for the
  accuracy and rigor biopharma requires.

  We're live with top-10 pharmaceutical companies, scaling
  fast, and focused on one thing: helping the right treatments
  reach the right patients, sooner

  The Role Description

  You’ll be a core builder of the Atrix AI-native platform,
  designing and shipping features that turn complex healthcare
  and AI workflows into intuitive, elegant interfaces, trusted
  by scientific, medical, and commercial teams across top
  pharma companies.

  From crafting thoughtful front-end UX to building robust
  backend systems, you’ll help bridge our AI core with real-
  world customer pain points, working on problems that
  genuinely move the needle in patient care.

  We’re building a modular, agentic platform that connects to
  customer-approved data sources, transforms messy,
  unstructured data using advanced AI, and delivers
  structured, actionable insights that drive decisions in
  regulated environments. You’ll see your work used daily by
  medical, clinical, and commercial teams making high-stakes
  decisions.

  You’ll tackle rich engineering challenges across:

  - Performance — We’re processing large data sets at once
  - Security & Privacy — Customers trust us with sensitive data
  - Explainability — AI outputs must be verifiable and traceable
  - Composable UI/UX — Interfaces need to adapt to varied use
    cases, from chat to dashboards to spreadsheets

  You’ll work closely with our Engineering Team and CEO, and
  collaborate as a peer to product, design, and GTM
  leadership. As one of our earliest Full Stack Engineers,
  you’ll help define technical architecture, influence product
  strategy, and set the tone for future engineering hires.

  💡 This is an hybrid role based in NYC (ability to be in
  office is required), with flexibility for remote work on
  some days as needed.

  Responsibilities

  This role is perfect for someone who is customer-obsessed,
  technically fluent, and thrives in fast-moving startup
  environments. If you love the challenge of translating AI
  workflows into intuitive product experiences in a high-
  stakes industry, we want to talk to you.

  - Own and evolve our web stack (React/Next.js + Python) to
    support fast, reliable AI-native workflows
  - Collaborate directly with product and design to shape user-
    facing features from spec to ship
  - Translate complex backend data structures into intuitive,
    delightful interfaces
  - Debug and improve frontend and backend systems to increase
    performance and reduce latency
  - Attend key customer and sales meetings to understand real-
    world workflows and incorporate feedback into product
    design
  - Drive architectural improvements to support scale,
    modularity, and developer velocity
  - Take full ownership of core product modules across the
    stack.

  Must haves

  - 5+ years experience as a fullstack or frontend-focused
    engineer
  - Previous B2B and startup experience required
  - Expertise in React/Next.js and frontend systems architecture
  - Comfortable working across the stack in Python when needed
  - Passionate about user experience and shipping polished,
    performant UIs
  - Proven ability to own projects end-to-end, from planning to
    deployment
  - Experience with distributed systems, APIs, and performance
    optimization
  - Desire to get involved in customer meetings, hear their
    feedback, and help translate that to a delightful
    experience

  Nice to haves

  - Background in life sciences, healthcare, or real-world data
  - Data science experience
  - Work experience at healthcare AI startups or technical
    consulting firms
  - Experience deploying AI in regulated or enterprise settings

  Why Join Atrix as a Fullstack Software Engineer?

  🚀 Mission-Driven Impact Your work will help life sciences
  teams deliver the right treatment to the right
  patient—faster. Real-world clinical outcomes start with
  better tools, and you’ll be building them.

  👨‍⚕️ Customer-Centric & High-Stakes You won’t be building in
  a vacuum. You'll work directly with top-10 pharma companies
  to understand how AI can transform medical workflows—this is
  high-impact, high-visibility work.

  🧱 End-to-End Ownership Own major parts of the stack, shape
  technical architecture, and influence product direction from
  day one.

  🌱 Early Stage, High Growth We're small and moving fast.
  You’ll help shape both the technology and the culture as we
  scale.

  🧠 Tech Meets Trust Design AI-native workflows that
  scientific and medical teams trust and depend on daily.

  📈 Clear Growth Path Opportunity to grow into a Lead Frontend
  or Fullstack Tech Lead role as we expand the engineering
  team.

  What we offer

  💪 Health & wellness support – Stipend + medical (vision,
  dental, health) insurance coverage 🌴 Unlimited PTO –
  Recharge when you need to
