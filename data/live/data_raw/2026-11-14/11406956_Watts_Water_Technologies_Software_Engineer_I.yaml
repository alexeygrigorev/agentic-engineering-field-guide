  What we do:

  For 150 years, Watts has built best-in-class products that
  are trusted by customers in residential and commercial
  settings across the world. We are at the forefront of
  innovation, working with cutting-edge technology to provide
  smart and connected, sustainable water solutions for the
  future. Watts is a leading brand with a quality reputation —
  and we have a dynamic future ahead.

  Scope of Position

  Watts Water Technologies is seeking a highly motivated
  Software Engineer I to support New Product Development (NPD)
  initiatives. In this on-site role, the Software Engineer
  will collaborate cross-functionally to design, develop,
  integrate, debug, and test embedded software for proprietary
  electronic control systems used in hydronic heating and
  water heating products. The engineer will contribute
  throughout the product development lifecycle, including
  requirements analysis, software architecture,
  implementation, verification, validation, and product
  release, helping bring innovative solutions from concept to
  market within the Watts Applied Solutions (WAS) business
  unit.

  This position does not have any supervisory
  responsibilities.

  The Software Engineer I reports to the Embedded Software
  Engineering Manager. This is an on-site position located in
  Blauvelt, New York.

  Primary Job Duties and Responsibilities

  - Develop and maintain C++20 / Qt 6 applications for ARM-based
    embedded Linux controllers used in commercial hydronic and
    water heating products.
  - Implement new features and resolve defects across the
    firmware stack, including UI screens, control logic, and
    I/O handling for analog inputs, RTDs, flow sensors,
    relays, and touchscreens.
  - Write clean, deterministic C++ code suitable for real-time
    control, avoiding dynamic memory allocation in time-
    critical paths.
  - Integrate device communication over Modbus, BACnet,
    RS-485/RS-232, CAN bus, and Ethernet.
  - Build and cross-compile firmware using CMake and Yocto
    toolchains; deploy binaries to target hardware via SSH for
    on-device debugging in Qt Creator.
  - Write and maintain unit tests (Qt Test / GoogleTest) and
    Doxygen documentation per team coding standards (. clang-
    format, license headers, enum constants).
  - Contribute to Jenkins CI/CD pipelines for automated builds,
    testing, and packaging.
  - Use Git/GitHub for version control; triage issues, reproduce
    reported bugs, and submit changes through pull requests
    and code reviews.
  - Utilize AI-assisted development tools (e.g., GitHub Copilot)
    effectively and responsibly to streamline development,
    increase efficiency, and strengthen code quality.
  - Read schematics and PCBs to support hardware/software
    integration and lab validation against test benches.
  - Collaborate cross-functionally with Controls, Hardware, QA,
    and Product teams on NPD projects from concept to
    acceptance.
  - Assume responsibility for other projects assigned by the
    Embedded Software Engineering Manager or Company
    management.
  - Responsibility directly tied to Watts Values (Integrity,
    Accountability, Continuous Improvement, Transparency)
  - Travel up to 5%.

  Required Qualifications

  - Bachelor's degree in electrical engineering, electronics and
    communications, software engineering, computer
    science/engineering or related field.
  - 1+ years of experience developing production-level code
    using C++ (C++17 or newer preferred).
  - Experience with software development in a Linux desktop
    environment
  - Experience with version control using Git & GitHub
  - Working knowledge of industrial communication protocols such
    as Modbus, BACnet, CAN bus, Ethernet/IP, Bluetooth, Wi-Fi,
    MQTT, and Cellular.
  - Familiarity with Schematic design and PCB layout
  - Excellent interpersonal skills, maintain strong working
    relationship with all internal groups
  - Proficient in business applications - MS Office, Adobe
    Acrobat, etc.
  - Understanding of and adherence to applicable laws, codes,
    policies, regulations and safety practices and procedures,
    as applicable.
  - Must successfully establish employment eligibility and
    satisfactorily complete background checks, including drug
    screening, and required pre-employment testing as a
    condition of employment.

  Preferred Qualifications

  - 2+ years of experience in C++ software development.
  - Experience with Qt framework for GUI development .
  - Expert in C++20, strong knowledge of CI/CD pipelines
    (Jenkins), and unit testing frameworks (Qt Test,
    GoogleTest).
  - Experience developing user-space C++ applications targeting
    ARM-based embedded Linux platforms
  - Past exposure to building and deploying Yocto-based kernel
    images with Jenkins
  - Development experience with AI Agents/LLMs for code
    generation, review, and productivity tooling; Machine
    Learning exposure a plus.
  - Familiarity with Doxygen documentation standards and clang-
    format-enforced coding styles.

  General Applicable Company Competencies



  - Commitment to Watts’ values of integrity, accountability,
    continuous improvement and innovation, and transparency.
  - Punctuality and dependability.
  - Ability to be flexible and adapt to changing work priorities
    and stressful conditions.
  - Adherence to all personnel policies, procedures, and
    standards of process as implemented by Watts.
  - Maintain productive and collaborative relationships with
    other Watts employees.
  - Adherence to Watts’ seven cultural beliefs: Growth Mindset,
    Customer-Focused Innovation, Constant Communication, Clear
    Goals, Collaborate Globally, Be Inclusive, and Take
    Action.





  Working Conditions

  While performing the job duties, you will be working on-site
  at a manufacturing facility and will perform the majority of
  your duties in an office environment. You may, at times, be
  required to be present on the manufacturing floor and will
  be required to wear the appropriate personal protective
  equipment. You will be required to work in the office at the
  Blauvelt, NY location (Monday – Friday). Your scheduled work
  hours will be communicated to you by your manager.





  Physical Requirements: Specific physical abilities required
  for this position include, but are not limited to:

  - Ability to stand for long periods of time.
  - Ability to lift and carry up to [insert amount] pounds.
  - Ability to push and pull up to [insert amount] pounds.
  - Ability to physically move around manufacturing floor.
  - Ability to read documents and communicate clearly with
    management and coworkers.
  - Ability to wear personal protective equipment, which may
    include, but is not limited to, safety shoes, hearing
    protection, and safety glasses.

  Pay Range

  The expected salary range for this position is $88K - $95K
