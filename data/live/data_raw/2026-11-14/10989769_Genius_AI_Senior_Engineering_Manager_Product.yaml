description: |
  About Genius AI

  Genius AI is building technology to help local businesses
  run themselves. Genius AI products do the admin work that
  keeps practitioners from the work they love and the people
  they serve. From GlossGenius to Reception, its products work
  24/7 on busywork like booking, marketing, client management,
  finances, staff and inventory management, and more.

  Genius AI technology has saved businesses 106M in admin
  hours, earned them $2.0B in additional revenue, and
  facilitated more than 624M client touch points.

  About the Role

  The engineering organization at Genius AI is maturing fast:
  more teams, more surface area, more complexity, and this
  role exists to own a meaningful part of it. As a Senior
  Engineering Manager, you'll lead across multiple teams, set
  technical direction for your domain, and connect engineering
  decisions directly to business outcomes. The platform is
  expanding, the agentic product is active and developing, and
  the standards for execution are increasing accordingly. This
  isn't a role about managing the status quo, it's about
  raising it: building the next generation of engineering
  leaders, shaping what gets built and why, and making the
  teams around you disproportionately effective.

  You will report to the Director of Engineering. You must be
  commutable to our NYC headquarters and will operate in a
  hybrid environment. We default to being in-office 3–4 days
  per week with required attendance on Tuesdays and Thursdays.

  What You'll Do

  - Own execution across multiple teams, drive complex, multi-
    team initiatives to completion by aligning priorities,
    managing scope trade-offs, and holding a consistent
    quality bar throughout
  - Embed AI tooling into how your teams work, not as a
    suggestion, but as a standard: identifying where AI
    accelerates development cycles, improves code quality, and
    removes bottlenecks that previously required human
    intervention
  - Partner with product and design to own 0-to-1 initiatives
    from inception through launch, making the call on what
    gets built and why
  - Shape the technical vision for your domain, anticipating
    platform needs, scaling challenges, and integration
    requirements before they become fires
  - Build the next generation of engineering leaders: develop
    high-potential ICs toward future leadership roles
  - Partner with recruiting to attract and retain strong
    engineers, and hold a high bar on every hire into your
    domain

  What We're Looking For

  - 8+ years of engineering experience, with at least 3 years
    managing or leading software engineering teams at a high-
    growth technology company
  - You've integrated AI tooling into your engineering workflow
    in a meaningful, structural way, and you actively push
    your teams to do the same
  - Strong technical judgment: able to evaluate architectural
    trade-offs, earn the respect of strong engineers, and make
    difficult decisions under uncertainty
  - Strong business acumen and customer-centric instincts, with
    the ability to connect engineering decisions directly to
    customer outcomes
  - Proven ability to collaborate with product and design to
    ship from 0 to 1, with ownership over the full arc from
    inception to launch
  - Demonstrated track record of developing engineers, you've
    invested in people and can point to what they went on to
    do
  - Make decisions and move: you don't wait for full
    information, you set a technical direction, ship
    something, and adjust based on what you learn

  Benefits & Perks

  - Competitive health & dental insurance options, effective on
    your first day of employment
  - Flexible PTO
  - In-office lunch twice per week for NYC and SF employees,
    plus late night dinner stipends
  - Access to Wellhub, a corporate wellness platform with
    discounted gym memberships, fitness classes, and mental
    health resources
  - Annual stipend for professional development and continued
    learning
  - High performers at 5 years receive a generous stipend to use
    however you recharge best
  - 401k benefit: employees are eligible to contribute starting
    day 1 of employment
  - Dependent Care FSA
  - Paid parental leave
  - Fertility and adoption benefits via Carrot and Kindbody

  At Genius AI, we celebrate our differences and are committed
  to creating a workplace where all employees feel supported
  and empowered to do their best work. We believe this
  benefits not only our employees but our product, customers,
  and community as well. Genius AI is proud to be an Equal
  Opportunity and Affirmative Action Employer.

  Personal Information: Notice at Collection for Employees and
  Applicants

  Agency Submissions If a resume or applicant is submitted to
  Genius AI by a third party without a signed search agreement
  in place, it will become the property of Genius AI and no
  fee will be paid, irrespective of whether the candidate is
  hired.

  Genius AI may use automated tools, including artificial
  intelligence and machine learning systems (AI Tools), to
  assist in evaluating applicants’ qualifications and fitness
  for the position. These AI Tools may be used alongside human
  review during one or more stages of the recruiting process,
  including application screening, skills assessments, and
  interviewing. No final hiring decision will be made solely
  by AI Tools without human oversight.
