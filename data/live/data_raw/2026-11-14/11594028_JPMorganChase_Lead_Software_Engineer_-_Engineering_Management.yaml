description: |
  Lead a high-impact engineering team that helps keep critical
  technology services resilient, secure, and ready to scale.
  In this role, you’ll shape an inclusive engineering culture
  while still staying close to the code and the technical
  decisions that matter. You’ll work across modern web and
  service technologies and partner closely with product,
  operations, and risk stakeholders. You’ll also gain exposure
  to enterprise-scale platforms, vendor-supported
  applications, and regulated control environments— building
  leadership breadth and technical depth.

  Job summary

  As an Engineering Manager at JPMorgan Chase in the
  Infrastructure Platforms, Data Center Services team, you
  lead and inspire a team of engineers while remaining hands-
  on in the delivery of software that supports key technology
  services. You drive predictable outcomes through strong
  engineering practices, thoughtful planning, and continuous
  improvement. You partner with stakeholders to translate
  needs into clear execution plans, and you take
  accountability for stability, resiliency, and operational
  readiness across your application portfolio. You also help
  us build a healthy team culture grounded in inclusion,
  psychological safety, and growth.

  Job responsibilities

  - Lead, mentor, and develop software engineers, fostering
    inclusion, psychological safety, and a culture of
    continuous improvement.
  - Own team delivery commitments by planning work, managing
    capacity, tracking progress, and removing blockers across
    the full development lifecycle.
  - Define and enforce engineering standards and quality
    practices, including code review, testing, and automated
    delivery pipelines.
  - Contribute hands-on as a senior engineer by writing,
    reviewing, and improving production code across modern web
    user interfaces and backend services.
  - Partner with product and senior stakeholders to translate
    requirements into well-scoped technical plans and
    measurable outcomes.
  - Lead agile rituals (planning, daily coordination,
    retrospectives, and backlog refinement) and continuously
    improve team ways of working.
  - Oversee vendor-supported applications, including delivery
    quality, service performance expectations, and effective
    knowledge transfer.
  - Own application stability and resiliency, coordinating
    incident response, root cause analysis, and sustained
    remediation.
  - Maintain applications across cloud and virtual server
    environments, including patching, capacity management,
    environment separation, and disaster recovery testing
    coordination.
  - Strengthen risk and controls posture by partnering with risk
    and control stakeholders to assess risk, implement
    controls, and remediate gaps.
  - Support hiring, onboarding, and skills development to build
    a high-performing team aligned to the organization’s
    priorities.

  Required qualifications, capabilities, and skills

  - Bachelor’s degree in Computer Science, Cybersecurity, Data
    Science, or a related field (or equivalent practical
    experience).
  - Demonstrated experience leading or managing engineers,
    including coaching, feedback, goal-setting, and
    performance management.
  - Proven ability to build and sustain high-performing teams in
    an agile delivery environment.
  - Strong hands-on engineering skills in modern web development
    and service development (for example, React; Node.js with
    TypeScript; Python).
  - Demonstrated experience across the software development
    lifecycle, including design, implementation, testing,
    release, and production support.
  - Experience establishing and operating engineering practices
    such as coding standards, code review, and automated
    testing strategies.
  - Practical experience with cloud deployments and operating
    applications hosted on virtual servers, including patching
    and capacity planning.
  - Experience overseeing vendor-delivered or vendor-supported
    applications, including delivery governance and
    relationship management.
  - Experience managing application resiliency and operational
    readiness, including incident management and remediation
    planning.
  - Experience working in a regulated or controls-driven
    environment, including assessing risk, implementing
    controls, and addressing control gaps.
  - Strong communication skills, with the ability to influence
    and align across engineering, product, operations, and
    senior stakeholders.

  Preferred qualifications, capabilities, and skills

  - Familiarity with technology risk and controls frameworks and
    with managing control remediation through established
    governance processes.
  - Experience adopting AI-assisted engineering tools
    responsibly, with attention to security, data handling,
    and compliance expectations.
  - Background in infrastructure, platform engineering, or
    operations-focused technology teams.

