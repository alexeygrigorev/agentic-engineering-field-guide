description: |
  YOUR JOB

  AI can write code now. It can't decide what's worth
  building, and it can't tell whether its own output is right.
  That part is yours. As a Fullstack Software Engineer in our
  customer-facing feature team, you'll take on real problems,
  often co-leading an initiative with a fellow engineer.
  You'll carry them from the first discovery conversation to
  production and beyond, working with Product, Design and
  engineers who would rather own an outcome than close a
  ticket. What you build lands with many companies working to
  keep their data, and the people behind it, safe.

  WE PROTECT THE PEOPLE BEHIND THE DATA

  We are a fast-growing security and compliance tech company
  with a clear purpose: we protect the people behind the data.
  With over 200 team members worldwide and with offices in
  Munich, Berlin, London, Stockholm, and Vienna, we help more
  than 4,000 global customers get certified fast and build a
  strong and scalable risk posture. With AI-powered
  automation, self-serve capabilities, and additional tailored
  expert advice, we offer our customers a seamless security
  and compliance experience to stay ahead of the rapidly
  evolving security landscape and challenges like the surge in
  cyber-attacks.

  WHAT YOU'LL BE DOING

  - Own what you build, end to end. Shape capabilities in
    discovery with your Product Owner and Designer, build them
    across frontend and backend, ship them to production, and
    make sure they work properly in customers' hands.

  - Help decide what gets built, not just how. Challenge
    assumptions, suggest alternatives, and help define
    requirements before anyone writes code.

  - Engineer with AI, responsibly. Use agentic workflows and AI
    tooling every day while you stay accountable for
    architecture, security and quality. You'll also help shape
    how our team builds with AI.

  - Build the new and improve the existing. Your time splits
    roughly evenly between new product capabilities and
    modernising an established codebase. Every area you touch
    should be better when you leave it.

  - Work beyond your team's walls. Spot dependencies with our
    other teams early, raise risks before they block delivery,
    and keep stakeholders informed.

  - Deliver as a team. Join four talented engineers who share
    ownership. You'll work in four-month terms with two-week
    sprints, keep rituals lean, and adjust scope when reality
    changes.

  WHAT YOU'LL GET IN RETURN

  - The freedom, trust, and tools to do what you love and make
    an impact in a purpose-driven company, committed to doing
    genuine good in the digital world

  - Enjoy a high degree of flexibility with tailored working
    hours, choice of work location, and benefits that support
    your lifestyle, health, and family needs

  - Join a secure, future-focused role in a dynamic scale-up
    positioned to make a major impact in the rapidly expanding
    Security & Compliance market

  - Grow along expert or leadership paths with support from
    employee accelerator programs, bi-annual feedback cycles,
    and a personal training budget

  - Work in an environment that values autonomy, rapid decision-
    making, a flat hierarchy, and collaborative, eye-level
    communication to keep things moving forward.

  THE QUALITIES YOU'LL NEED FOR A SUCCESSFUL CAREER AT
  DATAGUARD

  - You think in problems, solutions and how to implement them
    properly to deliver value to customers, not tickets that
    should to be done.

  - You're a builder across the stack. You've shipped features
    on both frontend and backend. Your backend are Java,
    Node.js using typescript or a similar typed languages, a
    knowledge in ruby is a plus. Your frontend is a modern SPA
    framework: Vue is ideal and React works too. You don't
    need deep expertise in both, but you can deliver on each
    without help.

  - You treat Product and Design as partners. You've worked
    closely with Product Managers and Designers. You've
    disagreed with one, and the result was a better idea.

  - Ambiguity doesn't stop you. You don't wait for a perfect
    ticket. You ask the right questions, make a call, write it
    down and move forward.

  - You use AI seriously, but not blindly. You've built real
    workflows with AI tools and you know how to verify what
    they produce through reviews, tests and asking "is this
    actually right?" You don't vibe-code your way to
    production.

  - You fix what's broken, deliberately. You won't ignore an
    issue just because it sits outside your ticket. You also
    know which ones to fix now, which to flag for later, and
    which rabbit holes to stay out of.

  - You explain things clearly. You can describe a technical
    decision in plain English to a customer, a colleague from
    Sales or Support, or a fellow engineer. You've worked in
    more than one company or product and you bring what you
    learned.

  LAST BUT NOT LEAST. FROM THE BOTTOM OF OUR HEARTS:

  No matter your origin, ethnicity, gender identity, religion
  or individual requirements; at DataGuard, all that counts is
  the person you are. As Guards and Guardettes, we are united
  not only by our dedication, but also by our shared belief in
  our purpose: Protect the people behind the data. Convince us
  with your personality and your skills – and together we will
  make great things happen. We are looking forward to meeting
  you!

  #LI-DNI
