description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  Role Overview

  We’re looking for a Staff Frontend Engineer to lead the
  design and development of major frontend systems and product
  initiatives at ClickUp. You’ll work across teams to solve
  complex technical challenges, improve engineering velocity,
  and help shape the direction of our frontend architecture.
  This role is for someone who thrives in fast-paced
  environments, drives clarity in ambiguity, and can influence
  both technical decisions and execution across the
  organization.

  What You’ll Do

  - Lead development of complex product features and frontend
    systems in Angular and React.
  - Partner with backend, integrations, product, design, and QA
    to deliver high-quality user experiences at speed
  - Architect scalable, reusable frontend patterns that improve
    product quality and developer velocity
  - Identify and address performance bottlenecks, UI
    architecture issues, and scalability risks
  - Drive engineering best practices across testing,
    observability, code quality, and maintainability
  - Help teams make strong technical decisions under tight
    timelines and evolving priorities
  - Own delivery across large initiatives, balancing immediate
    product needs with long-term technical health
  - Mentor engineers and elevate frontend craftsmanship across
    the team
  - Contribute to improving how frontend engineers work together
    across domains



  Qualifications

  - 7+ years of frontend engineering experience, with deep
    expertise in Angular and React
  - Strong command of TypeScript, RxJS, NgRx, and modern
    frontend architecture patterns
  - Experience building reusable component systems and scalable
    frontend application structures
  - Deep knowledge of performance optimization, debugging, and
    building for large-scale web applications
  - Strong product sense and ability to work cross-functionally
    in a fast-moving company
  - Demonstrated success leading major technical initiatives and
    influencing across teams
  - Strong mentorship skills and a track record of leveling up
    other engineers
  - Excellent communication and execution skills, especially in
    high-urgency environments
  - Strong experience with unit, integration and end 2 end
    testing using jest, vilest, playwright or related
    frameworks and ability to come up with testing strategies.

