description: |
  Company Description

  Vattenfall is a European energy company with approximately
  21 000 employees. For more than 100 years we have
  electrified industries, supplied energy to people’s homes
  and modernized our way of living through innovation and
  cooperation. We are looking for talented individuals who, in
  addition to their passion for their own role, also have
  strong team spirit and want to contribute to supporting a
  meaningful corporate mission.

  Job Description

  Do you like building fast, modern web applications that
  users rely on every day?

  In our digital development team, we design and continuously
  improve customer‑facing web platforms for the German market.
  We work in an agile, collaborative setup, delivering
  scalable, reliable and high‑quality solutions that have a
  real business impact.

  That is why we are now looking to hire a Senior Frontend
  Developer – Headless CMS (Vue.js / Nuxt) in Katowice, Berlin
  or Hamburg.

  What will you do?

  As a Senior Frontend Developer, you will play a key role in
  designing and developing modern frontend solutions within a
  headless CMS architecture. You will contribute to shaping
  technical solutions, implementing scalable features and
  ensuring high standards in performance, security and code
  quality.

  You will work in a cross‑functional DevSecOps team
  (developers, QA and DevOps), collaborate closely with
  Product Owners and stakeholders, and influence architectural
  decisions. This role offers the opportunity to work on a
  large‑scale customer platform, use modern tools (including
  AI‑assisted development) and actively contribute to how the
  team builds and delivers software.

  Your tasks and responsibilities:

  - Design frontend solutions within a headless architecture
  - Implement and maintain modern web applications (Nuxt /
    Vue.js)
  - Contribute to system design and architectural discussions
  - Align technical solutions with business needs and
    stakeholder expectations
  - Collaborate with technical and non‑technical stakeholders
  - Support knowledge sharing and team decision‑making
  - Contribute to problem‑solving and continuous improvement
    within the team
  - Ensure high standards in code quality, performance and
    security
  - Support collaboration within a large, agile and
    international team

  Location   Poland (remote, Katowice), Germany (Berlin,
  Hamburg)

  Qualifications

  Who are you?

  You are an experienced frontend developer who enjoys working
  with modern technologies and building scalable digital
  products. You combine strong technical expertise with a
  collaborative mindset and you feel comfortable working in
  international, cross‑functional teams.

  As our Senior Fronted Developer, you will bring:

  - Strong experience with headless CMS architecture
  - Solid expertise in Vue.js / Nuxt and modern frontend
    development
  - Experience in system design and architectural thinking
  - A proactive, solution‑oriented mindset and strong
    problem‑solving skills
  - Ability to communicate effectively with both technical and
    business stakeholders

  Next to this you bring:

  - Experience working in larger teams (10+ engineers) and agile
    environments
  - Strong focus on clean code and best software development
    practices
  - Experience working in multinational teams
  - A customer‑oriented mindset and understanding of business
    needs
  - Experience with AI‑assisted development tools
  - Fluent English

  Nice to have:

  - Experience with Storyblok or Contentful (headless CMS)
  - Familiarity with Storybook
  - Experience with Azure and Microsoft ecosystem
  - German language skills

  Additional Information

  Our offer  Good remuneration, a challenging and
  international work environment, and the possibility to work
  with some of the best in the field. You will be working in
  interdisciplinary teams and you can always count on support
  from committed colleagues. We offer attractive employment
  conditions and opportunities for personal and professional
  development.

  More Information  We welcome your application in English. We
  kindly request that you do not send applications by any
  means other than via our website as we cannot guarantee that
  we will be able to process applications that are not made
  via our website.

  For more information about the recruitment process you are
  welcome to contact our recruiter Marta Jura  via e-mail:
  marta.jura@vattenfall.com.

  At Vattenfall we are convinced that diversity contributes to
  build a more profitable and attractive company and we strive
  to be good role model regarding diversity. Vattenfall works
  actively for all employees to have the same opportunities
  and rights regardless of gender, ethnicity, age, transgender
  identity or expression, religion or other belief, disability
  or sexual orientation.

  The security of Vattenfall and its employees is essential.
  For that reason, a pre-employment screening will be part of
  your recruitment process. The screening is based on the role
  you will fulfill within Vattenfall. The screening will be
  performed by a third party, DISA Global Solutions AB.

  We look forward to receiving your application!
