description: |
  Overview

  This is a great opportunity to join a fast-paced agile team
  that works with the latest technologies and patterns,
  asynchronous programming, and MVVM to design and develop
  next-gen Esri software.  We are focused on designing and
  developing solutions for working with raster and imagery in
  ArcGIS Pro. Our tools support complex real-life workflows in
  2D & 3D for raster / image processing and analysis. If you
  are excited about user interaction and user interface
  development, then join our creative engineering team at Esri
  to build something unique!

  Responsibilities

  - Develop user interface components for Imagery and Raster
    Support in ArcGIS Pro
  - Follow industry-standard design patterns and development
    methodologies using C#, WPF, and C++ to build software
    components
  - Collaborate on implementation designs with team members and
    across other teams
  - Design, develop, and build software components, frameworks
    and SDKs for other engineering teams and external
    developers consuming our API
  - Work with product engineers to diagnose and resolve root
    causes for incorrect software behavior and failures
  - Build and ship timely software by working effectively with
    colleagues across software and product development
  - Work in agile environment to deliver software of the highest
    quality

  Requirements

  - 5+ years of experience building commercial software using
    C#, WPF, and C++
  - Experience in asynchronous programming using the Task
    Parallel Library
  - Firm understanding of object-oriented design, data
    structures, and design patterns
  - Ability to clearly describe and analyze a problem and to
    articulate a solution
  - Good sense of designing intuitive user interfaces that allow
    users to solve problems faster and easier
  - Ability to collaborate with software developers, product
    engineers, and documentation writers to release quality
    software
  - Ability to work productively in a fast-paced and evolving
    agile environment
  - Strong time management, prioritization, teamwork, and
    interpersonal communication skills
  - Bachelor’s degree in computer science, engineering,
    mathematics, or related field

  Recommended Qualifications

  - Interest in being a full stack developer who can build full
    feature functionality
  - Knowledge of MVVM application design pattern
  - Experience designing and developing UI / UX that simplify
    complex workflows, while keeping designs flexible for
    handling unknown scenarios
  - Experience with C++11 and modern C++ style and idioms
  - Experience working with large code bases
  - Experience writing testable software
  - Familiarity with ArcObjects (especially the Raster Object
    Model)
  - GIS experience and knowledge of raster & imagery
  - Experience with Agile software development using Scrum

  #LI-TA1

  #LI-Remote

  Total Rewards

  Esri’s competitive total rewards strategy includes industry-
  leading health and welfare benefits: medical, dental,
  vision, basic and supplemental life insurance for employees
  (and their families), 401(k) and profit-sharing programs,
  minimum accrual of 80 hours of vacation leave, twelve paid
  holidays throughout the calendar year, and opportunities for
  personal and professional growth. Base salary is one
  component of our total rewards strategy. Compensation
  decisions and the base range for this role take into account
  many factors including but not limited to skill sets;
  experience and training; licensure and certifications; and
  other business and organizational needs.

  A reasonable estimate of the base salary range is

  $123,136—$202,488 USD

