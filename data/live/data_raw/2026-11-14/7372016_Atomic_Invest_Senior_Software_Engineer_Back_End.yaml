description: |
  About Atomic Vest

  We are a fast-growing, mission-driven company powering the
  expansion of financial services and wealth creation, with
  billions of assets under management. We build critical
  financial infrastructure that allows consumer-facing
  companies to offer engaging investing experiences to their
  customers in a frictionless way. We host advanced investing
  capabilities ranging from ESG investing to multi-currency
  trading across 60 global markets. We are a team of financial
  empowerment enthusiasts who have come together from various
  industries including tech, banking, finance, and law.

  At Atomic, with billions of dollars in assets under custody,
  you will help build services that help make it easier for
  ordinary individuals to secure their financial prosperity.
  Come join an exciting opportunity to make a lasting impact!

  Location: Atomic is a remote company with offices in NYC and
  Mountain View, CA. For this position, it means that you can
  work remotely from any part of US / Canada.

  Key Responsibilities:

  - Play a key role in designing, developing, and architecting
    our microservices and Temporal workflows behind money
    movement, trading, and account lifecycle. Long-running
    state machines with real financial consequences are
    critical. Determinism, replay safety, idempotency, and
    other “retryable” challenges will be important aspects in
    your work.
  - We are a technology-first company, leveraging a cloud-native
    technology stack (Temporal, Kubernetes, Istio, AWS), AI
    and automation tools and agents for development and
    testing.
  - You make architectural decisions across a variety of systems
    and raise the bar on how we test these systems that must
    be correct.
  - Own gRPC services end-to-end in a multi-tenant platform
    along with partner-facing REST APIs.
  - Tackle really tough engineering and product problems and
    operate what you build. Instrument services in Datadog;
    own traces, dashboards, and monitors in your area.
  - Build and debug integrations with custodians, clearing
    systems, banking partners, and calculate and generate tax
    documents.

  Qualifications:

  We are looking for candidates who are creative, autonomous,
  curious, and rigorous. Some things that may make you a great
  fit:

  - 8-10+ years of software development building and operating
    production backend systems
  - Computer Science degree or equivalent experience
  - Go, or deep experience in another statically typed language
    plus genuine enthusiasm for picking it up
  - Experience working on distributed systems where partial
    failures are expected (idempotency, exactly-once
    semantics, and reconciling against external sources and
    internal data are problems you have dealt with
  - Experience in successful delivery of high-quality production
    services and systems: you’ve debugged from traces and
    logs, created postmortem documents and runbooks

  Nice to have:

  - Prior experience in the financial industry and comfort in a
    regulated environment
  - Direct experience with Temporal or similar workflow engines
    where determinism, versioning, building fault-tolerant
    workflows, and a real sense of what belongs in an activity
    versus the workflow itself
  - Experience with Datadog or comparable observability tooling,
    including building the dashboards and monitors
  - Familiarity with gRPC and protobuf at scale
  - Exposure to brokerage domain concepts such as clearing,
    settlement, corporate actions, KYC/AML, books and records.

  Technology Stack

  - Language: Go, Python
  - Async systems: Temporal, River
  - APIs: gRPC / protobuf, REST
  - Data: PostgreSQL, Redis
  - Infrastructure: Kubernetes (EKS), Istio, AWS
  - Observability: Datadog
  - PostgreSQL, AWS Kinesis, GRPC, Istio, OpenTelemetry

