description: |
  Company Description

  Today, when you go to your doctor and get referred to a
  specialist, your doctor sends out a referral and tells you,
  “They’ll be in touch soon.” So you wait. And wait. Sometimes
  days, weeks, or even months. Why? Because too often
  providers are overwhelmed with the painstakingly tedious
  work required to get paid by insurance companies. Powered by
  proprietary models, Tennr handles the complex paperwork that
  gets patients through the door and providers paid, helping
  operators get patients the right care, at the right time, in
  the right setting.



  Role Description

  We’re seeking a Senior Backend Engineer with a passion for
  systems architecture, data modeling, and large-scale
  workflow orchestration. In this role, you’ll architect and
  implement features end-to-end across our backend services
  and infrastructure, ensuring they deliver direct customer
  value. You’ll design and optimize data schemas, build
  resilient backend services, and ensure seamless integration
  with third-party systems.

  You’ll lead initiatives in high-volume workflow automation,
  with a strong focus on building and optimizing scalable data
  processing and machine learning infrastructure. This
  includes designing and maintaining complex workflows that
  leverage ML to drive automation, as well as driving
  performance optimization efforts to ensure scalability,
  reliability, and adherence to best practices across all
  layers of the stack.

  Collaboration is key—you’ll work closely with sales and
  customer experience teams to incorporate customer feedback,
  and with engineering teammates to bring robust solutions to
  life. We’re looking for someone who embraces a founder’s
  mindset, thrives on systems-wide thinking, and proactively
  drives projects from conception to completion.

  The ideal candidate has experience with backend
  architecture, event-driven systems, and orchestration
  frameworks, along with a proven track record of building
  production-ready systems. You’ll play a key role in shaping
  the technical foundation of our platform, ensuring
  reliability, scalability, and adaptability as we expand.



  Responsibilities

  - Architect and implement features that drive direct customer
    value end-to-end across our backend services and
    infrastructure.
  - Lead initiatives in high-volume workflow automation, with a
    strong focus on building and optimizing scalable data
    processing and machine learning infrastructure.
  - Design and maintain complex workflows that leverage machine
    learning to drive automation.
  - Drive performance optimization efforts, ensuring
    scalability, reliability, and adherence to best practices
    across all layers of our stack.
  - Collaborate with sales and customer success teams to respond
    to feedback from our customers and prospects.
  - Embrace a founder’s mindset, proactively driving projects
    from conception to completion, and contributing
    significantly to our company’s growth and success.



  Candidate Qualifications

  - 5+ years of experience in backend development, with a strong
    focus on JavaScript and familiarity with TypeScript.
  - Proven track record of building and maintaining scalable web
    applications, particularly in high-volume workflow
    automation and data processing.
  - Experience with integrating machine learning models into
    production environments and optimizing data pipelines.
  - Excellent problem-solving skills and a knack for efficient,
    clean coding practices.
  - Outstanding communication skills, capable of articulating
    complex technical concepts to a diverse audience.
  - A team player who thrives in collaborative environments and
    values diverse perspectives.
  - Prior experience in a startup or fast-paced tech environment
    is a plus.



  Why Tennr?

  - Drive Impact: one of our company values is Cowboy, meaning
    you set the pace. You won’t just talk about things, you’ll
    get them done. And feel the impact.
  - Develop Operational Expertise: learn the inner workings of
    scaling systems, tools, and infrastructure
  - Innovate with Purpose: we’re not just doing this for fun
    (although we do have a lot of fun). At Tennr, you’ll join
    a high-caliber team maniacally focused on reducing patient
    delays across the U.S. healthcare system.
  - Build Relationships: collaborate and connect with like-
    minded, driven individuals in our Hudson Square office 4
    days/week
  - Free lunch! Plus a pantry full of snacks.



  Benefits

  - Beautiful new office at 345 Hudson Street
  - Unlimited PTO
  - 100% paid employee health benefit options
  - Employer-funded 401(k) match
  - Competitive parental leave
