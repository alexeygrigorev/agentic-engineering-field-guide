title: Software Engineer Consultant (Defence)
company: Daintta
location: London, GBR
work_type: FULL_TIME
company_size: 46 Employees
description: |
  Daintta are a rapidly growing, values-driven consultancy
  delivering mission-critical data, technology, and
  engineering solutions across the UK public sector. We
  partner with clients in Defence, National Security, Law
  Enforcement, and wider Government to strengthen the UK’s
  resilience and operational advantage through innovative,
  data-driven insights.

  We are seeking a Software Engineer with proven experience in
  the UK Defence sector to design and deliver secure, scalable
  software systems supporting our clients’ most important
  missions. You’ll be joining a collaborative, purpose-led
  team committed to transparency, fairness, and daring
  innovation.

  As a Software Engineer (Defence), you will work alongside
  Defence stakeholders, programme leads, and multi-
  disciplinary teams to design, develop, and maintain software
  systems that directly support national defence capabilities.
  You will apply your software engineering expertise within
  classified or restricted environments, ensuring security,
  reliability, and compliance with MOD standards.

  Key Responsibilities

  - Work closely with MOD and Defence Industry clients to
    understand mission requirements and translate them into
    robust software solutions.
  - Design, develop, test, and deploy high-quality, secure
    software using Defence-approved toolchains and
    environments.
  - Contribute to systems that enhance situational awareness,
    command and control, cyber defence, and decision-support
    capabilities.
  - Develop clean, well-documented, and maintainable code in
    accordance with relevant coding standards and security
    requirements.
  - Participate in code reviews, peer testing, and design
    assurance activities to maintain delivery quality in
    secure environments.
  - Collaborate with systems engineers, data scientists, and
    solution architects to deliver integrated solutions across
    restricted environments.
  - Apply DevSecOps principles, CI/CD pipelines, and
    containerisation technologies (e.g. Docker, Kubernetes) to
    Defence projects where appropriate.
  - Keep up to date with emerging Defence technology trends,
    secure software frameworks, and government digital
    standards.
  - Contribute to bid and proposal work, technical
    presentations, and client demonstrations.
  - Support Daintta’s growth in the Defence sector through
    mentoring, technical input, and alignment with company
    strategy.
  - Helping to support & grow Daintta by actively inputting into
    the company strategy and helping to shape our future.
  - Representing us and our core values:  Transparent, Fair, and
    Daring.

  Skills/Knowledge

  The role requires the following key skills / knowledge, non-
  exhaustively:

  - Proven experience delivering software engineering projects
    within the UK Defence ecosystem (e.g. MOD, DE&S, DSTL,
    DIO, or Defence primes).
  - Strong knowledge of secure software development practices
    and handling sensitive information appropriately.
  - Proficiency in one or more programming languages: Python,
    Java, C++, Rust, or Go.
  - Familiarity with Defence-relevant software development
    frameworks and toolsets, such as Jenkins, GitLab CI,
    pytest, and OpenAPI.
  - Experience working within Unix/Linux environments and with
    database systems (SQL or NoSQL).
  - Familiarity with secure by design principles
  - Hands-on experience with Agile or Scrum delivery methods,
    ideally in secure or hybrid cloud environments.
  - Strong analytical, problem-solving, and communication
    skills; able to convey complex technical information
    clearly to non-technical stakeholders.
  - Knowledge of cloud platforms (AWS, Azure, or MODCloud) and
    DevOps practices (CI/CD, infrastructure-as-code).
  - Commitment to producing high-quality, mission-ready software
    underpinned by robust testing and assurance.

  What’s in it for you?

  In addition to being rewarded fairly for your contribution
  to the business, you get to work in a dynamic organisation
  that is agile and responsive. A business that is growing
  fast and where you get to drive and shape the future. A
  place where you are respected by everyone and your voice is
  important. Somewhere where you can be innovative and
  creative. A place where you have the opportunity to learn
  about all aspects of business from marketing to sales, to
  delivery and business operations.

  Benefits

  We believe in supporting our people both professionally and
  personally. Here’s what you can expect when you join us:

  Time Off:

  - 25 days annual leave, plus bank holidays
  - Up to 3 days annual volunteering leave - give back to the
    community
  - Competitive maternity, paternity, shared parental leave &
    compassionate leave

  Health & Wellness:

  - Comprehensive Private Health Insurance
  - Employee Assistance Programme - 24/7 support services
  - £2,000 Flex Cash Allowance, paid pro-rata over the year

  Financial Benefits:

  - 5% pension contribution
  - Discretionary company awards and bonuses, based on
    performance and company targets

  Professional Development

  - Up to £1,000 annual training budget (access to additional
    training and development budget via business case)
  - Up to 5 days annual training leave
  - 1 professional membership paid annually
  - Up to £200 of additional IT budget for new joiners

  Location?

  Hybrid, with 2-3 days working from Daintta office (London or
  Cheltenham) or on client site as required. Depending on
  client demands, there may be a need for more than 3 days per
  week on client site.

  Security Information

  Due to clients’ requirements, all applications are strictly
  subject to security clearance requirements relevant to the
  role.
