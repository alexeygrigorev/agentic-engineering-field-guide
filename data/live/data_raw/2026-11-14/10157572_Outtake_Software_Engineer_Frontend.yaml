description: |
  About Outtake

  Outtake exists to empower and facilitate trust for a
  digital-first world. Today, impersonation, fraud, AI-driven
  scams, and identity abuse spread faster than any security
  team can respond to. So we built something different: an
  agentic AI platform that proactively detects, monitors, and
  takes down impersonators, automating protection in hours,
  not weeks.



  Built by ex-Palantir, ex-CTO/founders, and ex-Notion
  engineers, Outtake is designed for clarity, autonomy, and
  velocity. Our goal is ambitious: become the trust layer of
  the modern internet. And we intend to do it with a lean,
  dense, exceptionally talented team.



  Outtake is backed by top-tier investors and operators who
  believe in our mission and our model. With strong financial
  footing and a long runway, we prioritize creating an
  environment where people can do the best work of their
  careers.

  The Role

  We’re looking for a Frontend Engineer to define how
  customers experience Outtake. At a high level, this person
  will build the FE Software Factory that enables the rest of
  the team (humans and agents) to ship beautiful, reliable,
  and consistent user experiences seamlessly. Our product
  turns a noisy, messy, fast-moving threat landscape into
  clarity: surfaced risks, evidence, workflows, decisions, and
  automated action. The frontend is where that complexity
  becomes legible. It is where customers understand what is
  happening, trust the system’s recommendations, and take
  action with confidence.

  This role is for someone who cares deeply about craft,
  speed, and product judgment. You should be excited to work
  close to the customer, translate ambiguous workflows into
  simple interfaces, and build software that feels fast,
  intelligent, and obvious. We are early, so this is not a
  narrow UI implementation role. You will shape product
  direction, design interaction patterns, make architectural
  decisions, and set the quality bar for the frontend as the
  company scales.

  What You’ll Do

  - Build the agentic coding harness that allows non-frontend
    devs to ship polished, reliable, and consistent UI
  - Refine and maintain our design system and design language
  - Own the core componentry and abstractions that enforce
    consistency across our workflows, while accelerating other
    devs and coding agents building new workflows
  - Own our UI testing framework and ensure we're shipping
    reliably
  - Maintain a high quality bar for FE code by providing
    thoughtful reviews and coaching backend-leaning devs
  - Build the agentic UI/UX (chat interfaces, generative UI, or
    similar) that define how our customers experience the
    effectiveness of our security agents
  - Flex as a Product Engineer and build end-to-end products
    alongside as necessary or desired

  What We’re Looking For

  - Proficiency with React and Typescript; familiarity with
    NextJS preferred
  - Excellent product taste and design sensibilities, ideally
    with experience building design systems
  - Experience building complex systems with coding agents, and
    the judgement to know when they are wrong
  - Comfort operating in ambiguity, making tradeoffs, and
    shipping without waiting for perfect specs
  - Comfort working closely with other engineers, non-technical
    teammates, and customers
  - Comfort working across the stack and building end-to-end
    product
  - Nice to have: experience building B2B SaaS products, ideally
    in cybersecurity or related fields
  - Nice to have: experience with shadcn, trpc, react-hook-form,
    Vercel AI SDK
  - Nice to have: experience building agentic UI/UX
  - Nice to have: experience as a designer or in design
    engineering
  - Nice to have: prior startup experience or a track record of
    thriving in high-ownership environments

  Life at Outtake

  - Office: For those in NY, we are an in-person team (5 days a
    week, with flexibility as needed) working out of a
    stunning waterfront office in Brooklyn. Collaboration,
    speed, and clarity matter.
  - Health: 100% company-paid medical, dental, and vision for
    employees.
  - Time Away: Flexible PTO. We trust adults to manage energy,
    not clock time.
  - Culture & Team: Annual company retreats and regular in-
    person events.

  Outtake is an equal opportunity employer. We are committed
  to building a diverse, inclusive team.
