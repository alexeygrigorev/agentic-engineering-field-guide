description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  Role Overview

  We’re looking for a Senior Frontend Engineer to help build
  and improve core product experiences at ClickUp. You’ll work
  closely with product, design, backend, and integrations
  teams to deliver high-impact features in a fast-moving
  environment. This role is ideal for someone who can move
  quickly, write high-quality code, and balance speed with
  long-term maintainability.

  What You’ll Do

  - Build product features in Angular and React in partnership
    with designers, product managers, and engineers
  - Architect efficient, reusable frontend code that powers the
    ClickUp user experience
  - Collaborate closely with backend and integrations teams to
    deliver end-to-end features
  - Work with QA to ensure strong test coverage and high product
    quality across edge cases
  - Identify and resolve performance, scalability, and usability
    issues
  - Build and maintain unit and integration tests
  - Fix bugs quickly and deliver durable solutions to complex
    product challenges
  - Follow established frontend architecture and state
    management patterns across the app
  - Manage project priorities, deadlines, and deliverables in a
    fast-paced environment



  Qualifications

  - 5+ years of experience with JavaScript and modern frontend
    frameworks, with Angular or React required
  - Strong experience with TypeScript, RxJS, and NgRx or similar
    Redux-style state management
  - Solid understanding of reusable component architecture and
    frontend performance
  - Strong HTML/CSS fundamentals, including layout,
    accessibility, cross-browser compatibility, and
    maintainable styling practices
  - Proven ability to move quickly, take ownership, and execute
    with urgency
  - Strong communication and collaboration skills
  - Experience mentoring teammates and helping raise engineering
    quality
  - Strong experience with unit, integration and end 2 end
    testing using jest, vilest, playwright or related
    frameworks.

