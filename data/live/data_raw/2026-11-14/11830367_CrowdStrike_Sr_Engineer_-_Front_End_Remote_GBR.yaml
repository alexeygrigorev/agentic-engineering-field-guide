description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  As an Sr Engineer - Front End at CrowdStrike, you will work
  with a talented and dedicated team to build and maintain the
  user interface for the Falcon platform and internal tooling
  used by Falcon Complete Stakeholders. You will provide a
  high quality user experience that our customers around the
  world use 24/7 to protect their systems from the most
  sophisticated adversaries.

  Our JavaScript frameworks are Ember and React, if you've
  used React, Angular, or Vue.js, you'll feel right at home,
  and we’ll help you get comfortable with Ember, React and our
  codebase. Since we only support evergreen browsers, we can
  push the boundaries of what’s possible on the web platform
  while working with truly massive amounts of data.

  We’re a highly collaborative, friendly, inclusive and
  diverse group that prizes collaboration over competition. We
  provide opportunities to learn new skills, mentor fellow
  engineers, and contribute to the direction of both the team
  and the products for which we’re responsible. We work in a
  distributed, remote-first, high-trust environment where you
  manage your own time and have the flexibility to balance
  your work and personal life.

  Our ideal candidate will be responsible for taking full
  ownership of the delivery of our products, driving the
  technical aspects, helping the team to define the
  architecture and coordinating with stakeholders in terms of
  scope and priorities. They are sensitive to the needs of the
  users and love to find solutions in a unique and dynamic
  problem space.

  About the Product:

  You’ll join the Falcon Complete Core Engineering team,
  working to protect our customers around the globe. You will
  work hand in hand with security analysts to improve existing
  tooling and develop novel solutions to support our customers
  as well as the analysts. You will build cross-tenant
  software that allows our Falcon Complete analysts to
  efficiently provide security services across many customers
  at very high scale, as well as high quality user interfaces
  connecting the Falcon Complete team with our customers via
  our Falcon platform. Falcon Complete relies on us for the
  tools to protect customer environments 24/7/365. Falcon
  Complete customers rely on us to build the interfaces they
  need to understand the who, what, and how of the work
  CrowdStrike does for them.

  What You’ll Do:

  - Build and maintain single page web applications written in
    JavaScript using React and Ember.js.
  - Participate in the code review process for your own code and
    that of your fellow Front End Engineers.
  - Take initiative and build tools that improve your team's
    development experience.
  - Write automated tests for your code.
  - Collaborate with fellow Front End Engineers, Cloud
    Engineers, UX Designers, Technical Writers, Product
    Managers, and others.
  - Continually learn about the ever-evolving challenges and
    complexities of the cybersecurity industry.
  - Have fun solving hard problems.

  What You’ll Need:

  - A good understanding of JavaScript and experience building
    web application user interfaces with modern frameworks
    such as Ember, React, Angular, or Vue.
  - Strong HTML & CSS skills, including experience with CSS pre-
    or post-processors (like Sass or PostCSS) or CSS
    frameworks like Tailwind CSS.
  - Experience with testing frameworks, tools and methodologies
    such as Playwright, QUnit or Mocha.
  - Knowledge & interest in developing genuinely accessible
    interfaces.
  - Comfortable with Git or similar version control systems and
    workflows.
  - A desire to work closely with others to deliver quality
    software and solve problems.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Familiarity with client-side build processes and tools.
    (e.g. Ember CLI, Webpack, etc.)
  - Experience creating or contributing to open source projects.
  - Experience with UI performance measurement and optimization.
  - Experience with web accessibility testing and support.
  - Familiarity with Amazon Web Services.
  - Prior experience in cybersecurity.
  - Prior experience building enterprise software as a service.

