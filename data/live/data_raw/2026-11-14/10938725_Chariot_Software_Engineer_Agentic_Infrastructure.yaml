description: |
  💼 Job Description

  Over the past 2 years, Chariot has grown 1300% YoY. As we
  continue to scale from tens of thousand of nonprofits to
  hundreds of thousands, our systems, particularly those used
  by our GTM, Ops, and Compliance teams, needs to evolve from
  manual or semi-automated to fully automated, well-
  architected and engineered. That's where this role comes in:
  Chariot Labs is our internal brain helping our full company
  adopt cutting edge software and tools (think Agent based
  workflows) that will power our next phase of growth.

  You will write code, build AI agents, and put together
  internal systems either from v1 to v100 or fully from
  scratch. You'll work directly with senior leadership and
  cross functional teams to translate strategy into automated
  workflows, programmatic outbound, and custom internal tools.
  If you want to configure simple CRM layouts all day, this is
  not for you. If you want to break down the question of if a
  CRM is even needed in the age of AI and build a prototype of
  what workflows might be possible without a CRM, you’re going
  to love this role.

  The ideal candidate is a self starter who cares deeply about
  simplicity, usability, and shipping - and wants to use their
  skills to make a tangible impact in the world. At Chariot,
  you’ll have the rare opportunity to work on 0 to 1 products,
  contribute to a thoughtful and fast moving team, and shape
  the future of how philanthropy happens online.

  👤 About You

  - You know how to build an orchestrate a set of Agents that
    work well and continue to improve in production (not just
    cool demos)
  - You've built with tools like OpenClaw, Claude Managed
    Agents, Claude Code
  - You understand and can build architecture such as Thin
    Harness, Fat Skills
  - You have 3+ years in Engineering, Growth Product Management
    or technical RevOps
  - You write code - Python, JS, SQL - and you're comfortable
    with APIs
  - You understand the sales funnel and the business logic
    behind the data you're moving
  - You ship v1 today and iterate tomorrow
  - You behave like an owner
  - You are based in NYC or willing to be - this is an in-person
    role (with WFH Fridays)
