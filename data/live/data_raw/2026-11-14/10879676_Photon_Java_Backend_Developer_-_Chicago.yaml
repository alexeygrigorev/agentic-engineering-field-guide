description: |
  We are seeking an experienced Java Backend Developer with 8+
  years of expertise in designing, developing, and maintaining
  scalable enterprise applications. The ideal candidate should
  have strong hands-on experience in Java, Spring Boot,
  Microservices architecture, REST APIs, cloud platforms, and
  modern software development practices. The candidate will
  work closely with cross-functional teams to deliver high-
  quality and high-performance backend solutions.



  Key Responsibilities



  - Design, develop, test, and deploy scalable backend
    applications using Java and Spring Boot.
  - Build and maintain Microservices-based architectures for
    enterprise-grade applications.
  - Develop and consume RESTful and SOAP web services.
  - Collaborate with architects, product owners, and front-end
    developers to deliver business requirements.
  - Optimize application performance, scalability, and
    reliability.
  - Implement security best practices using Spring Security,
    OAuth2, JWT, and authentication frameworks.
  - Design and develop database solutions using SQL and NoSQL
    databases.
  - Participate in code reviews, technical design discussions,
    and architectural decisions.
  - Troubleshoot production issues and provide timely
    resolutions.
  - Mentor junior developers and contribute to technical
    excellence across the team.
  - Ensure adherence to coding standards, DevOps practices, and
    CI/CD processes.



  Required Skills & Qualifications



  - 10+ years of experience in Java/J2EE application
    development.
  - Strong expertise in Java 8/11/17 and Core Java concepts.
  - Extensive experience with Spring Framework, including:
    - Spring Boot
    - Spring MVC
    - Spring Data JPA
    - Spring Security
    - Spring Cloud
  - Strong experience in Microservices architecture and
    distributed systems.
  - Experience building RESTful APIs and integrating SOAP
    services.
  - Hands-on experience with Hibernate/JPA.
  - Strong knowledge of relational databases such as Oracle, SQL
    Server, PostgreSQL, or MySQL.
  - Experience with messaging technologies such as Kafka,
    RabbitMQ, or ActiveMQ.
  - Experience with cloud platforms such as AWS, Azure, or
    Google Cloud.
  - Strong understanding of containerization and orchestration
    technologies like Docker and Kubernetes.
  - Experience with CI/CD tools such as Jenkins, GitHub Actions,
    Azure DevOps, or GitLab CI.
  - Proficiency in Git and Agile/Scrum methodologies.



  Preferred Qualifications



  - Experience with event-driven architecture and distributed
    systems.
  - Exposure to NoSQL databases such as MongoDB, Cassandra, or
    DynamoDB.
  - Knowledge of monitoring and logging tools such as Splunk,
    ELK, Grafana, or Prometheus.
  - Experience working in large-scale enterprise environments.
  - Cloud certification (AWS/Azure) is a plus.



  Key Competencies



  - Strong analytical and problem-solving skills.
  - Excellent communication and stakeholder management
    abilities.
  - Ability to lead technical discussions and guide development
    teams.
  - Strong ownership, accountability, and attention to detail.
  - Experience mentoring and coaching development teams



  Compensation, Benefits and Duration



  Minimum Compensation: USD 34,000 Maximum Compensation: USD
  121,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
