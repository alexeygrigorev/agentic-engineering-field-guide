description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  The Contacts team is a core team at Wise, dedicated to
  making adding, finding, and managing your recipients as easy
  as possible. We own this experience end-to-end: from the
  scalable platform securing tens of millions of bank accounts
  customers send to, to the intelligent search algorithms and
  local integrations (like Pix) that power discovery, all the
  way to the customer-facing screens where users interact with
  their counterparties. The team is integral to Wise’s day-to-
  day operations — if our services go down, Wise goes down.

  How we work

  We work in an agile fashion, with engineers closely
  collaborating with designers, the product manager, and the
  analyst. The team operates across our Tallinn and London
  offices.

  What will you be working on?

  You will be part of an autonomous team, driving the
  technical vision for the backend solution powering the
  recipient’s user experience. You will help us scale-up and
  build a world class recipient management product.

  Qualifications

  What do you need?

  We are fully aware that it is uncommon for a candidate to
  have all skills required and we fully support everyone in
  learning new skills with us. So if you have some of those
  listed below and are eager to learn more, we do want to hear
  from you!

  - You get things done
  - You have experience working with large scale distributed
    systems
  - You have years of Java 5+ knowledge
  - You have experience working with relational and non-
    relational databases, query optimisation and designing
    schemas
  - You have a strong product mindset and passion for customer
    experience, you prioritise work with the customers in mind
    and make data-driven decisions to fix customer pain-points
  - You enjoy collaborating with others and bringing people
    together to solve a problem
  - You have experience in designing, deploying and maintaining
    clean RESTful APIs
  - You believe in and follow best coding practices, code
    reviews and open feedback
  - You enjoy writing testable code and believe in Test Driven
    Development



  Nice to have:

  - You have experience with Spring boot
  - You have worked with BFFs (Backend-for-Frontends)

  Additional Information

  Interested? Find out more:

  - How we work - a practical guide
  - DEI @ Wise
  - Wise Tech Stack (2025 update)
  - See what it’s like to work at Wise London
  - Our engineering career map

  Wise Engineering – https://medium.com/wise-engineering

  What do we offer:

  - Starting salary: £87,500 - £111,000 + RSUs
  - Wise Benefits

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
