description: |
  Principal Software Engineer, Mobile

  ServiceTitan is the operating system for the trades. Our
  mobile platform puts that operating system in the hands of
  technicians and business owners in the field, and it has to
  work flawlessly, at scale, every time. We're looking for a
  Principal Software Engineer to set the technical direction
  for that platform — across iOS and Android — and raise the
  bar for how our mobile engineers build, ship, and scale
  software.

  You'll own platform architecture, drive the long-term
  technical vision for mobile, and lead major investments in
  performance, reliability, observability, and developer
  productivity. You'll influence mobile strategy across
  multiple product teams and build systems that scale to
  millions of users in the field.

  What you'll do

  - Own: Own the short- and long-term technical vision for the
    mobile platform, end to end.
  - Design and revamp: Design, build, and improve the critical
    systems powering ServiceTitan's iOS and Android apps.
    Improve the security, availability, reliability, and
    performance of our mobile products. Drive and participate
    in major architectural and strategic decisions, especially
    those related to scale.
  - Improve efficiency: Build tools and systems that increase
    the efficiency of every mobile engineer. Improve
    performance, processes, and quality across the mobile
    organization.
  - Discover: Identify opportunities to extract or build shared
    systems that benefit multiple mobile teams.
  - Empower: Mentor and guide engineers across the mobile
    organization and beyond.
  - 60% development, 40% everything else.
  - Team building: Partner with Recruiting on interviewing
    candidates and co-own lead generation (tech talks) and
    screening.
  - Strategy: Contribute to the mobile roadmap and resource
    planning.
  - Measure success: Define metrics for success and track them
    consistently.
  - Collaborate: Communicate clearly with cross-functional
    partners — engineers, product managers, customers, and
    other stakeholders.

  What you'll need

  - 15+ years of industry experience, including building large-
    scale, consumer or enterprise mobile applications.
  - 10+ years in senior engineering roles, designing APIs,
    abstractions, and tools used by other engineers.
  - Expert-level knowledge of native iOS development (Swift,
    UIKit/SwiftUI, Xcode) and/or native Android development
    (Kotlin, Jetpack, Android Studio) — deep expertise in one
    platform with strong working knowledge of the other.
  - Proven experience architecting mobile apps for scale:
    modularization, offline-first design, dependency
    injection, and clean separation of concerns.
  - Experience taking existing mobile codebases from monolithic
    to modular, domain-based architectures.
  - Strong background in mobile performance engineering — app
    startup time, memory and battery efficiency, rendering
    performance, and crash-free rates.
  - Experience with mobile observability and monitoring tools
    (for example, Firebase Crashlytics, Datadog, New Relic, or
    Application Insights).
  - Experience with mobile CI/CD pipelines and release
    automation (for example, Fastlane, Bitrise, GitHub
    Actions, or TeamCity).
  - Deep familiarity with version control, unit and UI testing,
    debugging, and profiling tools standard to mobile
    development.
  - Experience integrating large-scale third-party SDKs and APIs
    into mobile apps.
  - Working knowledge of cloud infrastructure supporting mobile
    backends (Azure, AWS, or similar).
  - Ability to empathize with our users and champion their
    experience.
  - Strong communication and technical writing skills.
  - B.S., M.S., or Ph.D. in Computer Science, Engineering, or a
    related technical field.

  Be Human With Us: Being human isn’t about checking every box
  on a list. It’s about the experiences we have, people we
  meet, and the perspectives we share. So, if you have the
  skills but are hesitant to apply because of your background,
  apply anyway. We need amazing people like you to help us
  challenge the conventional and think differently about the
  problems that we’re solving. We’re in this together. Come be
  human, with us.

  Use of AI Technology:

  We use technology, including automated and AI-assisted
  tools, to support certain aspects of our recruitment
  process. These tools are designed to improve efficiency and
  enhance the candidate experience. AI tools are not used to
  make hiring decisions; all hiring decisions are made by our
  hiring teams.

  What We Offer:

  When you join our team, you’re not just accepting a job.
  You’re making a career move. Here’s how we’ll support you in
  doing some of the most impactful work of your career:

  - Flextime, recognition, and support for autonomous work:
    Flexible time off with ample learning and development
    opportunities to continue growing your career. We offer a
    comprehensive onboarding program, leadership training for
    Titans at all levels, and other programs and events. Great
    work is rewarded through Bonusly, peer-nominated awards,
    and more.
  - Holistic health and wellness benefits: Company-paid medical,
    dental, and vision (with 100% employer paid options and
    90% coverage for dependents), FSA and HSA, 401k match, and
    telehealth options including memberships to One Medical.
  - Support for Titans at all stages of life: Parental leave and
    support, up to $20k in fertility services (i.e. IUI and
    IVF), surrogacy, and adoption reimbursement, on demand
    maternity support through Maven Maternity, free breast
    milk shipping through Maven Milk, pet insurance, legal
    advisory services, financial planning tools, and more.

  At ServiceTitan, we celebrate individuality and uniqueness.
