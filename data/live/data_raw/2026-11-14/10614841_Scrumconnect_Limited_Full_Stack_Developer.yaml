description: |
  About Scrumconnect Consulting

  Scrumconnect Consulting is a leading digital transformation
  consultancy delivering innovative technology solutions
  across public and private sector organisations. We
  specialise in building scalable digital services, cloud-
  native platforms, and user-centric applications that help
  organisations modernise and improve service delivery.

  Our teams work collaboratively across engineering, product,
  delivery, and design to create impactful digital solutions
  using modern technologies and Agile methodologies. At
  Scrumconnect, we foster a culture of continuous learning,
  innovation, and technical excellence, providing our people
  with opportunities to work on meaningful, large-scale
  transformation programmes.

  Role Overview

  We are looking for experienced Full Stack Developers to join
  our growing engineering team. You will work on enterprise-
  scale digital transformation projects, building modern,
  scalable, and cloud-native applications within Agile
  multidisciplinary teams.

  We are seeking strong Node.js developers with hands-on
  experience across backend services, APIs, cloud platforms,
  CI/CD pipelines, and modern frontend frameworks.

  Role Responsibilities

  - Design, develop, and maintain scalable full stack
    applications and microservices
  - Build secure and performant REST APIs using Node.js and
    Express
  - Develop responsive frontend applications using Angular and
    modern JavaScript/TypeScript frameworks
  - Implement automated testing using Jest and maintain high
    code quality standards
  - Contribute to CI/CD pipelines using GitLab CI/CD and DevOps
    best practices
  - Work within Agile delivery teams alongside Product Owners,
    QA Engineers, and DevOps teams
  - Participate in code reviews, technical discussions, and
    architectural decisions
  - Support cloud-native deployments and containerisation
    initiatives
  - Troubleshoot and optimise application performance,
    reliability, and scalability

  Profile 1 – Full Stack Software Developer Required Skills

  - Strong commercial experience with Node.js
  - Experience with Express.js
  - Frontend development experience with Angular (preferred over
    other frontend frameworks)
  - Experience with GitLab CI/CD pipelines
  - Automated testing experience using Jest
  - Strong understanding of Agile software delivery practices

  Desirable Skills

  - Experience with Kong Enterprise Edition (KongEE)
  - Kubernetes experience
  - Exposure to containerised applications and cloud-native
    architectures
  - Understanding of AWS EKS environments

  Additional Information

  - SC eligibility is desirable but not mandatory
  - Experience working within government or highly regulated
    environments is advantageous

  Profile 2 – Full Stack Developer (Serverless & AWS) Required
  Skills

  - Strong Node.js development experience
  - Strong JavaScript / TypeScript expertise
  - Experience building Serverless architectures
  - Hands-on AWS experience including:
    - Lambda
    - API Gateway (Private APIs)
    - SQS
    - S3
    - KMS
    - CloudWatch
    - X-Ray
  - Experience with MongoDB / Amazon DocumentDB
  - Terraform infrastructure-as-code experience
  - GitLab CI/CD experience
  - Automated testing using Jest
  - Agile delivery experience

  Desirable Skills

  - Kafka
  - Confluent Schema Registry
  - Dynatrace
  - Nunjucks

  Additional Technical Exposure

  - Docker
  - AWS ECS (including Fargate & ECR)
  - Monorepo architectures

  Preferred Candidate Profile

  - Strong problem-solving and analytical skills
  - Excellent communication and stakeholder collaboration
    abilities
  - Ability to work independently within distributed Agile teams
  - Passion for clean code, engineering best practices, and
    continuous improvement
  - Experience contributing to scalable and secure enterprise
    applications

  Diversity & Inclusion

  At Scrumconnect Consulting, we are committed to building an
  inclusive and diverse workplace where everyone feels valued,
  respected, and empowered to succeed. We welcome applications
  from candidates of all backgrounds, experiences, and
  perspectives, and we actively promote equality,
  accessibility, and inclusion throughout our recruitment and
  employment practices.

  We believe diversity strengthens innovation and helps us
  build better solutions for our clients and communities.
