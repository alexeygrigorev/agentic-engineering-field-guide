description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  Every day, Wise engineers deploy thousands of changes across
  hundreds of services. The Continuous Delivery team builds
  the platform that helps them do this safely, without turning
  delivery controls into a bottleneck.

  That challenge is becoming more important as AI-assisted
  development increases the volume and speed of software
  changes. We need to maintain strong safety and reliability
  standards while adapting our delivery platform to code and
  configuration increasingly produced with AI tools and
  agents.

  About the role

  You’ll join the team responsible for Wise’s Continuous
  Delivery platform. You’ll work primarily in Java & Go,
  extending Spinnaker and building the services and
  integrations around it.

  This is a hands-on engineering role with scope to influence
  the platform’s technical direction. You’ll take problems
  from discovery and design through to implementation and
  operation, working with teams across Platform Engineering
  and the wider company.

  We’re looking for someone who enjoys distributed systems,
  shared infrastructure, and problems where a seemingly small
  design decision can affect hundreds of services. You should
  be comfortable using deployment data, reliability metrics,
  and engineer feedback to decide where the team should
  invest.

  What you’ll work on

  - Design, build, and operate capabilities within Wise’s
    Continuous Delivery platform.
  - Evolve our use of the Open Source CD tool Spinnaker and
    contribute improvements upstream where appropriate.
  - Build reliable guardrails that help engineers deploy changes
    safely with minimal manual effort.
  - Improve the shared foundations of the platform in
    partnership with other Platform Engineering teams.
  - Use telemetry and feedback to understand how the platform
    performs and where engineers experience friction.
  - Work directly with engineering teams as they adopt new
    deployment patterns and platform capabilities.
  - Contribute to technical design, code reviews, documentation,
    and the development of other engineers.

  What you’ll bring

  - Strong experience building and operating production systems
    in Java.
  - Experience designing distributed services and APIs,
    including testing, monitoring, and failure handling.
  - Practical experience with a cloud platform such as AWS or
    GCP.
  - Experience working with containers and an orchestration
    platform such as Kubernetes.
  - A track record of automating operational work and building
    repeatable tooling.
  - Experience owning shared or mission-critical infrastructure.
  - The ability to turn complex requirements into
    understandable, maintainable solutions.
  - A willingness to challenge existing approaches, share what
    you know, and learn from others
  - Experience discovering complex problems across multiple
    teams and business functions

  You do not need previous Spinnaker experience. We’re more
  interested in strong engineering fundamentals and experience
  operating systems at scale.

  Nice to have

  - Experience with Spinnaker or another large-scale CI/CD
    platform.
  - Practical experience applying SRE principles, such as
    service-level objectives, error budgets, and automated
    incident prevention.
  - Familiarity with observability tooling such as Prometheus,
    Grafana, Elastic, or distributed tracing.
  - Knowledge of cloud networking and security.
  - Experience working in a regulated environment or with
    standards such as PCI DSS.
  - Experience with capacity planning, performance testing, or
    load testing.
  - Experience producing clear technical documentation and
    architecture diagrams.

  What you’ll get

  - Meaningful influence over a platform used by engineers
    across Wise.
  - The opportunity to solve engineering problems at company-
    wide scale.
  - Scope to contribute to open source software.
  - Support to develop your technical leadership and help other
    teams improve how they deliver software.
  - A flexible working environment and regular team and company
    events.

  Interested? Find out more:

  - How we work – a practical guide
  - The Wise Tech Stack (2025 update)
  - Our Engineering career map
  - Scaling our Infrastructure; how we make it work
  - Wise Engineering on Medium

  What do we offer:

  - Starting salary: £87,500-£111,000 + RSU#LI-AB3 #LI-Hybrid

  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
