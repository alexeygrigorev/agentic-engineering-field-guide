description: |
  OppFi is a leading tech-enabled digital finance platform
  that works with banks to provide financial products and
  services for everyday Americans. Through a transparent and
  responsible platform, which includes financial inclusion and
  excellent customer experience, the Company supports
  consumers who are turned away by mainstream options to build
  better financial health.

  We are a team of caring, innovative, and inclusive
  individuals who thrive in being immersed in diverse talents,
  expertise, perspectives, and backgrounds. Our employees
  approach every new challenge with an unparalleled ability to
  see what could be rather than settle for what is. Our
  business principles guide us and create an open and
  collaborative culture where we improve 1% every day, and the
  best ideas always win! We welcome individuals who want to
  make an impact in the financial system by facilitating
  credit access, expanding financial inclusion, promoting
  financial health, and delivering exceptional customer
  service.

  A few other fun facts about us. OppFi is one of the top
  consumer-rated financial platforms online, maintaining a
  4.4/5.0-star rating on Trustpilot. We are a 2025 Crain’s
  Fast 50™ company and were named on Built In's 2026 Best
  Places to Work in Chicago.

  About the job:

  We are looking for a Manager Enterprise Application
  Engineering to join the OppFi Technology team. This role
  will report directly to the Sr Director Platform and
  Operations and lead a team of engineers in support of
  OppFi’s technology efforts.

  What you get to do:

  As an Enterprise Application Engineering Manager, you will
  lead a team of talented engineers, acting as their technical
  mentor and professional guide. Your mission is to be the
  trusted technology partner that transforms business
  operations by building a secure, scalable, and automated
  environment that empowers our employees, protects our data,
  and accelerates our business.

  Team Leadership & Mentorship

  - Lead, mentor, and build a world-class team of Enterprise
    Application Engineers.
  - Be responsible for hiring, onboarding, performance
    management, and the career development of your direct
    reports.
  - Act as the "player-coach" and most senior technical expert
    for your team, capable of unblocking your engineers,
    leading complex architecture reviews, and troubleshooting
    the most challenging issues.
  - Foster a culture of accountability, collaboration, and
    continuous improvement.

  Strategy & Business Partnership

  - Develop and maintain the strategic roadmap for our
    enterprise application and integration architecture,
    ensuring it scales with the company's growth.
  - Act as the primary technical consultant and liaison for
    business leaders (e.g., Finance, HR, Marketing,
    Operations), understanding their needs and translating
    them into scalable, secure technology solutions.
  - Manage vendor relationships, software licenses, and budgets
    for your application stack, continuously evaluating new
    tools to maximize ROI and business value.

  SaaS Management

  - Manage the entire Google Workspace ecosystem (Gmail, Drive,
    Calendar, Groups), defining, configuring, and enforcing
    policies, rules, and OU structures.
  - Lead the architecture and administration of our Atlassian
    stack (Jira, Confluence) guiding your team in building
    complex workflows and customizing projects for other
    engineering and business teams.
  - Design, build, and manage a SaaS Management Platform (SMP)
    to bring all OppFi SaaS applications under centralized
    management.
  - Proactively analyze license utilization across our entire
    SaaS portfolio to identify opportunities for cost savings,
    license reclamation, and contract consolidation.
  - Partner with Information Security and Enterprise Risk
    Management to conduct technical reviews for all new SaaS
    applications.

  Identity & Access Management (IAM)

  - Serve as the top-level architect for our Identity and Access
    Management (IAM) program.
  - Design, build, and manage our centralized Identity Provider
    (IdP) as the single source of truth for all user
    identities.
  - Develop, deploy, and enforce Role-Based Access Control
    (RBAC) policies to ensure the principle of least
    privilege.

  Integration & Automation

  - Champion an "automation-first" mindset.
  - Build and manage automated Joiner, Mover, and Leaver (JML)
    workflows, ensuring employees are provisioned correctly on
    their start date and all access is instantly revoked upon
    termination.
  - Architect, build, and maintain robust integrations between
    our core business systems.
  - Be responsible for the reliability and integrity of data as
    it moves between integrated systems, including error
    handling and monitoring.

  What you will bring to the team:

  - Bachelor's degree in Computer Science, Information Systems,
    or a related field, or equivalent practical experience.
  - 7+ years in Enterprise Systems or Application Engineering,
    with a demonstrable focus on automation and integration.At
    least 3+ years in a people management or technical lead
    role.
  - Deep architectural and administrative experience with Google
    Workspace in a large-scale (1000+ user) environment.
  - Deep architectural and administrative experience with the
    Atlassian stack (Jira, Confluence), with the ability to
    design and implement complex workflows for both technical
    and business teams.
  - Expert-level, hands-on architectural experience with Okta
    (or a similar major IdP), with deep understanding of
    Universal Directory, Lifecycle Management (SCIM), complex
    policy creation, and SAML/OIDC integrations.
  - Architectural and administrative experience with Microsoft
    Active Directory in a large-scale (1000+ user)
    environment.
  - Proven, hands-on experience building and managing
    integrations; you are comfortable with REST APIs with
    demonstrable experience automating IT processes using
    scripting (e.g., Python, PowerShell).
  - A strategic thinker who can connect IT initiatives to
    business outcomes like revenue growth, cost reduction, and
    risk mitigation.
  - Excellent ability to communicate complex technical concepts
    to non-technical executives and stakeholders.
  - A passion for mentoring engineers and a proven track record
    of developing talent.

  Reports to:  Sr Director Platform and Operations

  Total Rewards and Benefits:

  At OppFi, we are committed to fostering a fair and equitable
  workplace. The compensation range for this role reflects our
  good faith compensation estimate for this position. Final
  offers are determined based on a myriad of factors
  including, but not limited to experience, skills,
  qualifications, and other relevant business considerations.
  Candidates are encouraged to discuss compensation
  expectations during the hiring process. In addition to base
  pay, the total compensation package includes eligibility and
  potential for performance-based bonuses and equity grants
  dependent upon the role and job level.

  OppFi offers a flexible, remote environment, 401(k) matching
  program, and generous paid time off. Other benefits include
  medical, dental, and vision coverage, and tuition
  reimbursement. Additional benefits include DoorDash
  DashPass, Figo pet insurance, Rocket Lawyer, and access to
  LinkedIn Learning. OppFi also offers Fringe, a lifestyle
  benefits platform that allows employees to decide how to
  spend rewards from dozens of vendors like Uber, DoorDash,
  and UrbanSitter. #LI-Remote

  Compensation Range:

  $148,000—$222,000 USD

