description: |
  Savvas Learning Company is a global education company that
  produces award-winning learning solutions that empower
  educators and engage students with the highest quality
  content.



  Recognized as an industry leader, we serve millions of K-12
  learners with innovative, student-centered educational
  programs that turn today’s classrooms into active learning
  environments. By embracing technology, personalized
  learning, and immersive experiences delivered across
  multiple platforms, we design our learning solutions to be
  more accessible and relevant to each student.



  Our award-winning, high-quality instructional materials span
  every grade level and discipline, from evidence-based,
  standards-aligned core curricula and supplemental and
  intervention programs to state-of-the-art assessment tools
  and the industry’s most innovative portfolio of college and
  career readiness solutions — all designed to meet the needs
  of every learner.

  We are looking for engineers who are passionate about
  building innovative applications of the highest quality and
  demonstrate ownership of the product area assigned to them.



  Key Responsibilities:

  - Work closely with the product management team to ensure
    we're building the best products.Ability to comprehend
    business requirements, map them to technical requirements,
    and decompose them into estimated stories and tasks.
  - Perform research, analysis, design, and implementation, and
    provide effective solutions for short-term and long-term
    needs
  - Evaluate new technologies and software products to determine
    the feasibility and desirability of incorporating their
    capabilities into the platform.
  - Deploy and manage cloud-based services on AWS, leveraging
    services such as CodeBuild & Pipeline, Lambda, ECS, S3,
    RDS, DynamoDB, and API Gateway.
  - Ensure that code adheres to strict standards for
    accessibility, security, object-oriented practices and
    performance
  - Optimize backend processes for performance, scalability, and
    cost-efficiency.
  - Write and execute both unit and integration tests
  - Ability to debug identified issues and track down root cause
    of the issue across the technology stack
  - Mentor other team members and developers
  - Effectively engage and positively contribute within a well-
    functioning offshore team, while also providing strong
    leadership during onshore hours.

   Qualifications

  - Master’s or Bachelor’s degree in Computer Science or
    equivalent experience, with strong fundamentals and
    problem solving skills.
  - 5+ years experience in software development roles
  - Expert knowledge and capabilities in Java 8+ development,
    SpringBoot, RESTful APIs, Java Application Servers, HTML /
    CSS.
  - Strong understanding of microservices design principles and
    best practices.
  - Hands-on experience with AWS services, such as ECS, Lambda,
    DynamoDB, RDS, and S3.
  - Experience with containerization tools like Docker, CDK and
    orchestration using AWS Fargate
  - Strong knowledge of JavaScript technologies such as Angular
    and Node.js
  - Experience with unit testing frameworks such as JUnit,
    Mockito, Jasmine.
  - Experience with SQL and relational database design.
  - Experience building and deploying services in AWSStrong
    problem-solving skills and ability to troubleshoot
    distributed systems/services.



  Preferred Qualifications

  - Experience with learning services technologies such as the
    SCORM object reference model, IMS QTI and IMS LTI
    standards, and any Learning
  - Experience with with Git is a plus
  - Knowledge of GraphQL a plus
  - Knowledge of UML and design patterns
  - Exposure to monitoring and logging tools like CloudWatch,
    Datadog
  - Experience writing modular code in an agile environment with
    CI/CD
  - Knowledge of concepts and standards such as SOLID,
    Dependency Injection, AOP, JSON.
  - Understanding of Cloud Architecture and experience working
    with AWS resources
  - AWS certification is a plus (Cloud Practitioner or higher)
  - Ability to effectively use AI to accelerate software design
    and implementation

  ABOUT SAVVAS

  We are proud to be recognized as a Top Workplace. Our
  employees are our most valuable asset, and we are committed
  to creating a work environment that promotes their growth,
  well-being, and success. We develop learning solutions that
  empower educators and improve student outcomes thanks to our
  team's passion, creativity, and dedication.

  TOTAL REWARDS

  We are committed to the health and well-being of our
  employees and their families. Our focus on employees is
  evident in our comprehensive and competitive total rewards
  package, which prioritizes what matters most to them.

  Our competitive compensation package is designed to reward
  your success with a pay-for-performance model. This ensures
  that hard work and contributions are recognized and
  rewarded. With our 401(k) match and immediate vesting,
  employees can start securing their financial future without
  any delay.

  Our benefits package is designed to promote a healthy work-
  life balance and overall well-being. Paid time off and
  holidays allow you to unplug, relax, and recharge fully.
  Starting on Day One, we offer comprehensive health benefits,
  including medical, dental, and vision coverage, ensuring
  that health is a top priority without a financial burden.

  At Savvas, we recognize the importance of emotional and
  mental well-being, both in our work environment and in our
  personal lives. That’s why we are committed to providing
  resources to support well-being.



