description: |
  Overview

  The way companies innovate is broken. The systems built to
  create and protect ideas can’t keep up with the pace of
  change. Today, 90% of S&P 500 company value is intangible
  (e.g., in intellectual property) - yet R&D and IP teams
  spend half their time buried in manual work, sifting through
  patents and paperwork instead of pushing the frontier
  forward. The tools of creating and protecting are stuck in
  the past. We’re here to fix that.

  Ankar is building the R&D tools for the AI era and defining
  what applied research will look like in the next 20 years.
  We’re building infrastructure and product experiences our
  customers rely on every day. You’ll translate messy,
  ambiguous problems into clean, dependable software—and
  you’ll do it at the cutting-edge of AI.

  We’re at an inflection point:

  - We’ve raised >$24M to date from Tier-1 VCs like Atomico,
    Index Ventures, Norrsken, Daphni, and angels like the
    Founder of Hugging Face, CEO from Datadog, and Leaders
    from DeepMind and OpenAI.
  - We’re already working with the world’s most innovative
    companies including Fortune 500 company L’Oréal and global
    law firm Vorys
  - Expanding our world-class team with alumni from Palantir,
    Amazon, and BCG to tackle the $1T+ innovation market.
    We’re just getting started.



  What you’ll do:

  - Build world-class product. Design, build, and maintain
    scalable, reliable systems and user-facing product
    experiences that customers depend on.
  - Ship fast and iterate constantly. Deliver quickly, learn
    from real feedback, and refine the product week by week
    with direct access to customers.
  - Own end-to-end execution. Take full ownership of projects
    across frontend, backend, and deployment—from design to
    implementation to monitoring and maintenance.
  - Partner deeply with teammates and customers. Collaborate
    closely with product, design, and customer-facing teams
    and customers themselves to ensure what we build is
    useful, usable, and impactful.

  This role is not for you if...

  - You need a highly structured environment, a predefined
    playbook, regular working hours, or a schedule that never
    requires travel. We operate with high autonomy and
    ownership, expect our team to go above and beyond, be
    obsessed with our mission and thrive in ambiguity rather
    than wait for direction.

  - You prefer long planning cycles and certainty before acting.
    We move quickly, ship often, and adapt based on customer
    feedback and new information.

  - You want to manage the work rather than do the work. We're
    builders first, and everyone is expected to contribute
    directly to creating exceptional products.

  - You take it personally when ideas are challenged, priorities
    shift, or work gets redirected. We care more about finding
    the right answer than defending a particular one.



  What we put behind our people

  Building at the frontier takes exceptional people. We invest
  accordingly.

  - Health Insurance: Full private health & dental coverage for
    you and your dependents.
  - Pension: Flexible pension scheme with up to 5% employer
    matching on qualifying earnings.
  - Food on us: Team lunches twice a week, plus dinner when
    working late in the office.
  - Cycle to work: Green Commute initiative scheme (up to £3k)
    to help you get a new bike tax-free.
  - Way we work: We combine deep, in-person collaboration
    (minimum 3 days/week in our Shoreditch office) with
    flexibility and trust. What matters is ownership, impact,
    and results, not where you work from.
  - Visa sponsorship: Yes



  Compensation

  We believe exceptional people should be compensated
  accordingly.

  £96,000–£160,000 including equity (depending on experience)
