  Candidate Data Privacy

  Rivian and Volkswagen Group Technologies” may collect, use
  and disclose your personal information or personal data
  (within the meaning of the applicable data protection laws)
  when you apply for employment and/or participate in our
  recruitment processes (“Candidate Personal Data”). This data
  includes contact, demographic, communications, educational,
  professional, employment, social media/website,
  network/device, recruiting system usage/interaction,
  security and preference information. Rivian and Volkswagen
  Group Technologies may use your Candidate Personal Data for
  the purposes of (i) tracking interactions with our
  recruiting system; (ii) carrying out, analyzing and
  improving our application and recruitment process, including
  assessing you and your application and conducting
  employment, background and reference checks; (iii)
  establishing an employment relationship or entering into an
  employment contract with you; (iv) complying with our legal,
  regulatory and corporate governance obligations; (v) record
  keeping; (vi) ensuring network and information security and
  preventing fraud; and (vii) as otherwise required or
  permitted by applicable law.

  Rivian and Volkswagen Group Technologies may share your
  Candidate Personal Data with (i) internal personnel who have
  a need to know such information in order to perform their
  duties, including individuals on our People Team, Finance,
  Legal, and the team(s) with the position(s) for which you
  are applying; (ii) Rivian and Volkswagen Group Technologies
  affiliates; and (iii) Rivian and Volkswagen Group
  Technologies’ service providers, including providers of
  background checks, staffing services, and cloud services.

  Rivian and Volkswagen Group Technologies may transfer or
  store internationally your Candidate Personal Data,
  including to or in the United States, Canada, and the
  European Union and in the cloud, and this data may be
  subject to the laws and accessible to the courts, law
  enforcement and national security authorities of such
  jurisdictions.

  If you provide a mobile telephone number as part of your
  application or during the recruitment process, Rivian and
  Volkswagen Group Technologies may use that number to contact
  you via SMS text message for recruitment-related purposes,
  including scheduling, logistics, and status updates. Message
  and data rates may apply. You may opt out of SMS
  communications at any time by replying STOP to any text
  message you receive from us. Consent to receive SMS messages
  is not a condition of applying for or being considered for
  employment.

  Please see our Candidate Data Privacy Notice (English) and
  Candidate Data Privacy Notice (Serbian) for more
  information.

