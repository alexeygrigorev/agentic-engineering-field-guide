description: |
  Joining Amex Tech means discovering and shaping your
  contribution to something big. Here, you can work alongside
  talented tech teams and build a unique career with the
  Powerful Backing of American Express. With a range of
  opportunities to work with the latest technologies, and a
  commitment to back the broader engineering community through
  open source, our mission is to power your success. Because
  Amex Tech is powered by our technology, our culture, and our
  colleagues.

  The Technology organization enables and accelerates the
  company’s growth strategies, delivering global capabilities
  and services in support of Amex’s customers and colleagues,
  while maintaining 24/7 servicing and availability to ensure
  an uninterrupted, high-quality customer experience.
  Technology provides the foundation for everything we do in
  the company while driving differentiation through building
  and leveraging innovative technology and data insights.

  Global Commercial Services (GCS) serves millions of business
  customers around the world, from mom-and-pop shops to
  approximately 70% of the S&P 500. We are the number one
  issuer of small business cards, the industry leader in
  corporate T&E and represent approximately 40% of the
  company’s total revenues. Our vision is to be essential to
  our customers’ businesses every day. We do that by offering
  a diverse suite of payment and cashflow tools our customers
  need to run and grow their businesses, from a wide range of
  traditional card products, to working capital and supply
  chain financing, to new digital solutions that make it easy
  for our customers to manage their financial and payment
  needs.

  Responsibilities

  - Mentors junior Software Engineers and cross-functional team
    of colleagues, fostering a culture of excellence and
    innovation
  - Provides guidance and support to junior engineers, fostering
    professional growth and development within the team
  - Directs the design, development, testing, and deployment of
    software applications and systems
  - Oversees a variety of tasks, platforms, and technologies to
    expand new and existing software to meet changing
    requirements
  - Writes automated unit tests to ensure correctness and
    stability
  - Provides technical guidance to ensure adherence to best
    practices and coding standards
  - Monitors software performance and implements improvements to
    optimize functionality
  - Analyzes technical challenges and provides innovative
    solutions to enhance software quality and efficiency
  - Collaborates with cross-functional teams to ensure seamless
    integration and deployment of software solutions
  - Collaborates and co-creates effectively with teams in
    product and the business to align technology initiatives
    with business objectives

  Qualifications

  - Bachelor's degree in Computer Science, Computer Engineering,
    and/or comparable experience; advanced degree preferred
  - Knowledge of distributed (multi-tiered) systems, algorithms,
    NoSQL, and relational databases
  - Knowledge of the core tools used in the planning, analyzing,
    crafting, building, testing, configuring, and maintaining
    of assigned application(s)

  Work Experience

  - Software engineering and development experience or a related
    job
  - Experience in application design, software development, and
    automated testing
  - Experience in object-oriented design and coding with variety
    of languages
  - Experience in distributed (multi-tiered) systems,
    algorithms, and relational databases
  - Experience in Agile software development methodologies and
    practices such as Scrum/Kanban, iterations, user stories
  - Experience in automation testing and documentation (i.e.
    automated, functional, and performance)

  Employment eligibility to work with American Express in the
  U.S. is required as the company will not pursue visa
  sponsorship for these positions

  About the Team

  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:

  - Competitive base salaries
  - Bonus incentives
  - 6% Company Match on retirement savings plan
  - Free financial coaching and financial well-being support
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - 20+ weeks paid parental leave for all parents, regardless of
    gender, offered for pregnancy, adoption or surrogacy
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities

  For a full list of Team Amex benefits, visit our Colleague
  Benefits Site.

   American Express is an equal opportunity employer and makes
  employment decisions without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, veteran status, disability status, age, or any other
