  requirements of applicable state and local laws, including
  the California Fair Chance Act, the Los Angeles County Fair
  Chance Ordinance for Employers, and the City of Los Angeles’
  Fair Chance Initiative for Hiring Ordinance. For positions
  covered by federal and/or state banking regulations,
  American Express will comply with such regulations as it
  relates to the consideration of applicants with criminal
  convictions.



   We back our colleagues with the support they need to
  thrive, professionally and personally. That's why we have
  Amex Flex, our enterprise working model that provides
  greater flexibility to colleagues while ensuring we preserve
  the important aspects of our unique in-person culture.
  Depending on role and business needs, colleagues will either
  work onsite, in a hybrid model (combination of in-office and
  virtual days) or fully virtually.



