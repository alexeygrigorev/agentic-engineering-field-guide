description: |
  About the company

  Our client is a healthcare company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Act as the most senior hands-on engineer, shaping the
  technical direction of a consumer-facing software platform
  in a regulated space. The work combines writing production
  code, owning architecture across several product areas and
  partnering with executive leadership on priorities. It also
  involves guiding a distributed team and building out a
  compact in-house group.

  What you'll do

  - Write production code for the most demanding problems while
    owning architecture across several product areas.

  - Work side by side with the chief executive to convert
    business priorities into practical technical plans.

  - Decide on product direction independently, without needing
    detailed specification documents.

  - Manage the handover of work from an external offshore group
    to an in-house team.

  - Set coding standards, peer review habits and quality
    practices for the engineering function.

  - Champion the use of AI tooling across the company to move
    the roadmap forward faster.

  - Shape hiring and structure for a new, small in-country
    engineering group over the coming year.

  Requirements

  What we're looking for

  - 6+ years of software engineering experience.

  - Production full-stack experience with TypeScript and AWS.

  - Recent hands-on time in a startup as a senior or founding-
    level engineer; large-company experience is welcome
    alongside it.

  - Track record as a Staff or Principal-level individual
    contributor who owns systems from design through delivery.

  - Experience shipping software in regulated settings such as
    fintech or healthcare, including HIPAA compliance.

  - Practical experience putting AI and LLM features into
    production.

  - Experience directing remote or offshore engineers.

  - Public code or side projects that show your craft.

  - Strong product instincts and comfort making UX and feature
    choices on your own.

  Benefits

  Compensation and benefits

  - Base salary: USD 200,000 to 250,000 per year

  - Equity

  Location and work model

  - New York, NY, United States

  - Hybrid, 3 days per week in office

  - Full-time
