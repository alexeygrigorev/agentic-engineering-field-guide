description: |
  Senior Software Engineer

  BeyondMath is a pioneering startup, backed by top-tier VCs,
  on a mission to reshape the frontiers of engineering through
  Foundational AI models for Physics. We are replacing
  traditional, slow and expensive simulation methods with AI
  that rivals accuracy at orders of magnitude higher speed.

  We are moving beyond the "generic AI" hype to solve the
  world’s hardest physical engineering challenges in
  automotive, aerospace, and energy.

  The Role

  You'll be responsible for contributing to the design,
  development, and scaling of the core software components
  powering our Generative Physics platform. This is a hands-on
  role where you'll drive the development of our product into
  a robust, scalable platform, integrating cutting-edge
  machine learning models, simulation tools, and a seamless
  user interface. Success in this role translates to
  delivering a tangible foundation that allows our development
  partners to experience the full potential of our AI-driven
  design approach.

  Responsibilities

  - System Architecture Design: Architect and implement a
    scalable, cloud-native software platform capable of
    handling the complexities of large-scale engineering data,
    AI-driven simulations, and seamless user interactions.
    Prioritise maintainability, testability, and extensibility
    in design choices.
  - Data Pipeline Engineering: Design and build robust, high-
    throughput data pipelines to manage large volumes of
    engineering data. Ensure efficient data ingestion,
    transformation, storage, and retrieval from both internal
    simulations and external partner tools.
  - Cloud-Based Scalability, Reliability, and Security: Leverage
    cloud technologies (AWS) to achieve system scalability,
    ensuring high availability, fault tolerance, and data
    security. Implement best practices for cloud
    infrastructure management and cost optimization.
  - Simulation Tool Integration: Develop APIs and interfaces to
    seamlessly integrate with a variety of engineering
    simulation tools and pipelines, both internally developed
    and from external partners.
  - AI-Powered Design Tool Innovation: Collaborate with ML
    engineers and development partners to design and build the
    next generation of AI-powered engineering design tools.
  - Technical Leadership and Mentorship: Provide technical
    guidance and mentorship to other software and ML
    engineers. Foster a culture of continuous learning and
    best practices within the engineering team.

  Essential Requirements

  - Education: Bachelor's degree (Master's preferred) in
    Computer Science, Software Engineering, or a related
    field.
  - Development Expertise: 5+ years of proven experience with
    full-stack software development, including front-end and
    back-end technologies.
  - Strong Python proficiency is essential.
  - Cloud Technologies: Experience working with cloud platforms
    (AWS) and containerization (Kubernetes, Docker).
  - Leadership & Communication: Ability to lead technical
    discussions, articulate design decisions effectively, and
    collaborate with cross-functional teams.

  Highly Desirable

  - Scientific Computing: Familiarity with scientific libraries
    like Pytorch, NumPy,
  - SciPy, and visualisation tools (Matplotlib, Plotly, etc.)
  - CFD Understanding: Any knowledge of aerodynamic design
    principles or
  - experience with CFD software is a significant plus.

  Why Join Us?

  - Full Ownership: You will have a direct seat at the table in
    shaping the future of a company redefining an entire
    industry.
  - High Impact: Your work will directly accelerate the
    transition to sustainable energy and more efficient
    transport.
  - Elite Team: Work alongside veterans from world-leading AI
    labs and engineering firms in a culture of "impact with
    integrity.

  We receive a large number of applications and take the time
  to carefully review each one. While this means our response
  time might be a bit slower, we deeply appreciate your
  patience.
