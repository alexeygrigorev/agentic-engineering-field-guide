description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for a Backend Engineer, New Grad to join Bask
  Health's engineering team and help build the software
  infrastructure behind our telehealth platform.

  This role is designed for recent graduates and early-career
  engineers who have strong programming fundamentals, enjoy
  building software, and want to gain hands-on experience
  developing production backend systems.

  You'll work on APIs, databases, backend services, and
  application logic that support patient experiences, clinical
  workflows, pharmacy operations, and merchant tools.

  Our engineering stack includes TypeScript, Node.js, AWS,
  SST, and SQL databases, with technologies such as Prisma and
  Drizzle used across the platform.

  You'll collaborate with experienced engineers, receive
  feedback through code reviews, and gradually take ownership
  of more complex features as your technical skills develop.

  We're looking for someone who is curious, takes initiative,
  learns quickly, and enjoys understanding how software works
  beyond the code they're assigned to write.

  You don't need years of professional experience or previous
  healthcare industry experience. We care about your technical
  foundation, the projects you've built, your ability to solve
  problems, and your willingness to learn.

  What You'll Do

  - Build, test, and maintain backend features that support
    Bask's telehealth platform.
  - Develop APIs, application logic, and backend services using
    TypeScript and Node.js.
  - Work with SQL databases to create, update, and retrieve
    application data.
  - Help implement backend functionality for patient
    experiences, clinical workflows, pharmacy operations, and
    merchant tools.
  - Learn how our serverless infrastructure works using AWS,
    SST, and related technologies.
  - Assist with building and maintaining integrations between
    internal services and third-party APIs.
  - Write clean, readable, maintainable code that follows
    established engineering practices.
  - Create automated tests to verify functionality and help
    prevent regressions.
  - Debug application issues, investigate errors, and work with
    experienced engineers to resolve problems.
  - Participate in code reviews and learn how to give and
    receive constructive technical feedback.
  - Collaborate with frontend engineers to understand how APIs
    connect to user-facing applications.
  - Work with product managers and engineers to understand
    requirements and break projects into manageable tasks.
  - Learn how to design database schemas, structure backend
    services, and organize application logic.
  - Help maintain documentation for APIs, backend features, and
    development workflows.
  - Use AI-assisted development tools such as Cursor and Claude
    Code to explore solutions, understand unfamiliar code, and
    accelerate development while validating generated code.
  - Learn how to test changes in staging environments before
    releasing them to production.
  - Assist with monitoring, logging, and troubleshooting backend
    services.
  - Contribute to improving existing code, reducing technical
    debt, and simplifying development workflows.
  - Take ownership of smaller features and gradually work toward
    independently delivering more complex projects.
  - Ask questions, share ideas, and actively participate in
    technical discussions.
  - Develop an understanding of security, data privacy, and
    reliability requirements for healthcare applications.
  - Continue building your technical skills through hands-on
    projects, feedback, and collaboration with the engineering
    team.

  Requirements

  - Recently completed or currently completing a degree in
    Computer Science, Software Engineering, Computer
    Engineering, or a related technical field, or equivalent
    practical experience.
  - Strong understanding of programming fundamentals, data
    structures, algorithms, and basic software design
    principles.
  - Familiarity with JavaScript, TypeScript, or another modern
    programming language, with an interest in developing
    backend applications using TypeScript and Node.js.
  - Experience building software through coursework,
    internships, personal projects, open-source contributions,
    or professional work.
  - Basic understanding of how APIs, servers, and web
    applications communicate.
  - Familiarity with relational databases and basic SQL
    concepts.
  - Understanding of Git or another version control system.
  - Ability to write readable, organized code and explain your
    technical decisions.
  - Familiarity with debugging, testing, and solving programming
    problems.
  - Interest in learning backend architecture, cloud
    infrastructure, and production software development.
  - Willingness to use AI-assisted development tools while
    understanding, reviewing, and validating the code they
    produce.
  - Strong problem-solving skills, curiosity, and attention to
    detail.
  - Ability to learn unfamiliar technologies and ask thoughtful
    questions when needed.
  - Good written and verbal communication skills.
  - Ability to collaborate with other engineers and incorporate
    feedback.
  - Comfortable working in a fast-moving environment and taking
    responsibility for assigned work.
  - No previous healthcare industry experience required.

  Nice to Have

  - Internship, co-op, freelance, or project experience
    involving backend development.
  - Experience building applications with TypeScript,
    JavaScript, or Node.js.
  - Familiarity with REST APIs, tRPC, or similar API
    technologies.
  - Experience using PostgreSQL, MySQL, or another SQL database.
  - Familiarity with Prisma, Drizzle, or other database access
    tools.
  - Exposure to AWS, SST, serverless applications, or cloud
    deployment.
  - Experience building full-stack applications using React or
    Next.js.
  - Experience deploying a personal project or application to a
    live environment.
  - Familiarity with automated testing frameworks or test-driven
    development.
  - Experience building projects involving third-party API
    integrations.
  - Contributions to open-source projects or a portfolio of
    completed technical projects.
  - Experience using Cursor, Claude Code, or other AI-assisted
    coding tools.
  - Interest in healthcare technology, SaaS platforms, or
    e-commerce systems.
  - Familiarity with application security, authentication, and
    data privacy fundamentals.
  - Experience working on a team-based software project using
    Git and code reviews.
