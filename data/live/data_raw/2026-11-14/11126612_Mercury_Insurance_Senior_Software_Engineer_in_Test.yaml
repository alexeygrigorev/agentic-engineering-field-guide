description: |
  Overview

  Join an amazing team that is consistently recognized for our
  achievements and culture, including our most recent Forbes
  award of being one of America's Best Midsize Employers for
  2026!

  Position Summary:

  As a Senior Software Engineer in Test, you will be
  designing, developing, and maintaining complex software
  testing framework and tools. This position involves leading
  project, mentoring junior team members, and ensuring the
  delivery of high-quality software solutions.

  Geo-Salary Information

  An in-person interview may be required during the hiring
  process

  State specific pay scales for this role are as follows:

  $94,458 to $179,048  (CA, NJ, NY, WA, HI, AK, MD, CT, RI,
  MA)

  $85,871 to $162,771 (NV, OR, AZ, CO, WY, TX, ND, MN, MO, IL,
  WI, FL, GA, MI, OH, VA, PA, DE, VT, NH, ME)

  $77,283 to $146,494  (UT, ID, MT, NM, SD, NE, KS, OK, IA,
  AR, LA, MS, AL, TN, KY, IN, SC, NC, WV)

  The expected base salary for this position will vary
  depending on a number of factors, including relevant
  experience, skills and location.

  In CA: Typical hiring range is $123,078 to $170,941

  Responsibilities

  Essential Job Functions:

  - Design, Develop and Maintain Test Automation Frameworks,
    Tools and Libraries: Develop a strong understanding of
    relevant product areas, independently implementing and
    maintaining complex automated tests and medium complex
    framework features.
  - Critical Thinking and Problem-Solving Skills: Skilled in
    debugging and resolving simple blocking issues, especially
    with automation scripts, new frameworks and new tools.
    Applies analytical and creative approaches to tackle
    simple quality challenges with solutions.
  - Implement/Enhance Continuous Integration Continuous
    Deployment (CI / CD): Understanding of automation
    framework with CI/CD pipelines to facilitate automated
    testing during the build and deployment processes.
  - Performance Testing Support: Design and implement complex
    performance test script based on existing automation
    framework and tools to execute performance tests.  Provide
    analytical and provide feedback for the releases in the
    test result report.
  - Define and Enforce Automation Standards and Best Practices:
    Enforcing coding standards, best practices, and guidelines
    for writing and maintaining automated scripts and
    framework. Review code written by team members to ensure
    adherence to standards and provide constructive feedback.
  - Cross-Functional Collaboration and Communication: Work
    closely with cross functional teams and stakeholders to
    gather requirements and provide simple solutions in
    framework to meet medium-complex testing needs in small-
    medium sized team.
  - Create, Monitor and Analyze Test Results: Create, review and
    analyze test execution results, providing complex insights
    and simple recommendations based on findings.
  - Training and Mentorship: Train and mentor TE and SETs on
    using the automation framework to start writing medium
    automation tests. Training others to diagnose, resolve
    mid-complex issues and prepare proper documentation to
    ensure smooth operation.

  Qualifications

  Education:

  Minimum:

  - Bachelor’s Degree in Computer Science, Computer Engineering,
    Information Systems or other related fields Or equivalent
    combination of education and experience.

  Experience:

  Minimum:

  - 5+ yrs industry experience, independently implementing
    medium sized automation framework/tools

  Preferred:

  - 3 or more years of development experience with Java and/or
    Python
  - 3 or more years of experience creating automation frameworks
  - 3 or more years of experience developing testing tools

  Knowledge and Skills:

  Minimum:

  - Familiar with the following:
    - Training, Leading, and Mentorship - Capability to train,
      lead and mentor junior team members in automation best
      practices and framework usage.
  - Knowledgeable of the following:
    - Framework Design and Development - Develop a strong
      understanding of relevant product areas, proficiency in
      designing and implementing high quality framework, that
      are modular, configurable, maximize reuse, are fast,
      effective, user friendly, secure, compliant, stable and
      maintainable.
    - Develop Testing Tools, Utilities - Develop a strong
      understanding of relevant product areas, integrate
      innovative tools, libraries, and technologies into the
      automation framework to enhance testing capabilities.
    - Create and Maintain Libraries - Proficiency in creating and
      maintain automated reusable libraries/components to
      enhance automated capabilities
    - Technologies - Experienced in containerization technologies.
      Experienced in cloud platforms such as AWS, Google
      Cloud, or Azure. Experienced in Leveraging DevSecOps to
      Improve Engineering Efficiency
    - Release Process and Continuous Integration/Continuous
      Deployment (CI/CD) - Agile software development release
      process, CI/CD practices and tools (e.g., Jenkins,
      GitHub) to integrate automated tests into the build
      process.
    - Performance Testing - Familiarity with performance testing
      concepts and tools (e.g., JMeter, LoadRunner) to assess
      system behavior under load.
    - Documentation Skills - Proficiency in documenting framework
      architecture, components, usage instructions,
      presentation, and bug report, etc...
    - Requirements Analysis - Analyze [simple/complex] system
      requirements and design to determine the best approach
      for testing of the change/implementation.
    - Critical Thinking and Problem-Solving Skills – Debugging and
      resolving blocking issues, especially in automation
      scripts, frameworks and tools. Applies analytical and
      creative approaches to tackle complex quality challenges
      with innovative solutions.
    - Collaboration and Communication - verbal and written
      communication skills on executing task-specific
      collaboration, conveying precise technical details,
      responding to immediate issues, and ensure clarity in
      resolving project-level technical challenges
    - Multi-Tasking Skill with Positive Attitude - Multi-Tasking
      skill with willingness and positive attitude to do
      whatever it takes to complete tasks on time or as
      quickly as possible.
    - Product Knowledge - Acquire and apply domain-specific
      knowledge to ensure that testing efforts align with
      business objectives and real-world use cases.
    - Test Automation Tools - Experience coding with popular test
      automation tools and frameworks (e.g., Selenium, TestNG,
      JUnit, Appium, IDE, Metrics etc.). Knowledge of
      containerization technologies like Docker and
      Kubernetes.
    - Debugging and Troubleshooting - Strong skills in diagnosing
      issues within the automation execution and scripts to
      ensure smooth operation.
    - Best Coding Practices - Ability to conduct code reviews and
      provide constructive feedback to ensure quality and
      adherence to standards and best practice.
  - Experienced with the following:
    - Coding Skills - Strong knowledge of programming languages
      commonly used in automation, such as Java, Python, or
      JavaScript.
    - Time Management - Excellent organizational skills to manage
      multiple testing projects, prioritize tasks to meet
      deadlines.
    - Adaptability and Flexibility - adapt to changing
      requirements, code designs and implementation changes,
      new technologies, methods to solve problems, shift
      priorities, workstyle and responsibilities.
    - API Testing - Knowledge of API testing methodologies and
      tools (e.g., Postman, SoapUI, Curl, Insomnia) for
      validating RESTful and SOAP APIs.
    - Continuous Learning - Commitment to staying updated with the
      latest trends, tools, and technologies in test
      automation and quality assurance.
    - Attention to Detail - Meticulous attention to detail to
      ensure high-quality automated tests and reliable
      framework performance.

