description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role:

  We are looking for a talented Senior Software Engineer to
  join our Payin Platform team in the London office. This team
  owns layer that powers how money enters Wise. The platform
  sits between our product teams (Transfer, Acquiring Payment,
  and any new product that needs to take money in) and the
  payment methods we support (Cards, Apple Pay, Google Pay,
  Balance, Bank Transfer, PISP, UPI, Direct Debit, and more).


  What will you be working on?

  Rather than owning a single payment method, we build the
  Payin Session and Payment abstractions that let every
  product integrate a payment method once and scale to
  millions of transactions without re-solving the same
  problems.

  This is a high-volume, high-leverage platform role: the
  systems you build are used by many teams across the company,
  so correctness, reliability, and thoughtful API design
  matter enormously.

  Qualifications

  What do you need?:

  - 5+ years of experience in Java, Kotlin, Python or Go
  - Strong experience with Spring framework, relational
    databases, distributed and concurrent systems (Kafka)
  - Great cross-team communication - Can discuss and champion
    complex, technical topics with a wide and varied audience,
    from fellow engineers to non-technical stakeholders across
    lots of teams.
  - You enjoy writing testable code and you have experience in
    testing strategies, such as unit testing, integration
    testing
  - You believe in and follow best coding practices, code
    reviews and open feedback
  - You have great communication skills and the ability to
    articulate complex, technical concepts to non-technical
    audience
  - You strive to improve our team culture and processes
  - A strong product mindset and passion for customer
    experience, you prioritise work with the customers in mind
    and make data-driven decisions to fix customer pain-points
  - Being able to work independently on customer problems is a
    key to success - you take responsibility and end-to-end
    ownership of your projects: drive and own them to make
    sure we hit the goals we want to achieve

