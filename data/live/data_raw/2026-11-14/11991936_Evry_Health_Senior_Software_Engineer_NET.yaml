description: |
  Role Summary

  The Senior .NET Software Engineer is a highly experienced
  technical leader within Evry Health's Engineering team,
  responsible for architecting, building, and continuously
  improving the backend services, APIs, cloud infrastructure,
  and data systems that power Evry Health's commercial health
  plan platform. The role owns the most technically complex
  backend workstreams, drives architecture decisions for the
  .NET Core and Azure services layer, mentors junior
  engineers, and ensures the backend platform meets the
  performance, reliability, security, and regulatory standards
  required of a licensed commercial health insurer.

  Responsibilities

  - System Architecture & .NET Design Leadership: Leads
    architectural design of backend systems — microservices
    decomposition, event-driven architecture, distributed
    system design — and produces Architecture Decision
    Records.
  - Senior-Level .NET Core / C# & Node.js Development: Owns
    design of the most complex backend services, including
    claims, eligibility, and benefits logic, while
    contributing to Node.js backend services as the platform
    evolves.
  - Cloud Infrastructure & Azure Engineering: Leads backend
    cloud infrastructure design on Azure — messaging,
    serverless design, data modeling, API management, and
    DevOps pipeline architecture.
  - Healthcare Data Integration & Standards: Owns healthcare
    data interchange integrations (X12, HL7, FHIR, NCPDP),
    ensuring all integrations are accurate, compliant, and
    production-hardened.
  - Technical Leadership, Testing & CI/CD Ownership: Leads code
    reviews and mentors junior engineers, establishes .NET
    coding/testing standards, and owns CI/CD pipeline
    architecture and quality gates.

  Qualifications

  - Bachelor's degree in CS, Software Engineering, or related
    field, or equivalent experience
  - 8+ years of backend development experience with deep .NET
    Core/C# and/or Node.js expertise
  - Demonstrated architecture-level design experience
    (microservices, distributed, event-driven)
  - Expert Azure cloud services, CI/CD pipeline design, and
    mentoring/code review experience

  Telecommuting Requirements
