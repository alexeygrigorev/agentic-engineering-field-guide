description: |
  The Opportunity

  ModernFi is seeking software engineers to build the
  foundation of the platform that powers banks and credit
  unions nationwide. From day one, you will have significant
  ownership and the opportunity to shape the direction of our
  platform, our engineering culture, and the broader
  trajectory of the company. As a member of a talented and
  collaborative team, you will design and build the systems at
  the core of how ModernFi operates.

  Your work will be instrumental in building the products that
  help banks and credit unions better serve their communities,
  improving financial health nationwide. This role offers the
  opportunity to build impactful solutions with real autonomy,
  work on mission-critical systems, grow your technical
  expertise, and influence how the team builds as we scale
  during a period of rapid growth.

  We are hiring across levels (mid-level, Senior, and Staff),
  and your level will be determined during the interview
  process based on your technical performance.

  At ModernFi, your work will directly fuel our vision and
  mission to serve as systemically important financial
  infrastructure that drives the American economy and to
  empower our partner financial institutions to grow and
  better serve their communities.

  The RoleResponsibilities

  - Design and build scalable, maintainable, and correct backend
    services to support ModernFi’s core products and bank
    integrations.
  - Lead or contribute to technical initiatives, with
    opportunities to define architecture, lead projects, and
    mentor teammates.
  - Partner closely with Product to define requirements,
    translate business needs into technical specs, and ship
    elegant, impactful features.
  - Uphold and evolve engineering best practices, including code
    quality, testing, CI/CD pipelines, and documentation.
  - Participate in design discussions, conduct code reviews, and
    contribute to technical decisions that scale with our
    business.
  - Tackle challenging technical problems with innovative and
    pragmatic solutions.
  - Help cultivate an inclusive, high-performing engineering
    culture grounded in trust, ownership, and collaboration.

  Tech Stack

  - Python (FastAPI, SQLAlchemy), Typescript
  - Retool (React, Vite, Tailwind)
  - PostgreSQL Database
  - AWS / Pulumi IaC
  - Tools: Auth0, Datadog, Fern

  About You

  - Proven ability to independently design, develop, and
    maintain backend systems.
  - Strong understanding of software engineering principles,
    with tangible experience writing high-quality, production-
    ready code.
  - Experience leading or contributing significantly to complex
    engineering projects (for more senior candidates).
  - Excellent communication skills with the ability to explain
    technical concepts clearly to both technical and non-
    technical audiences.
  - Comfortable operating in a fast-paced, dynamic environment
    with shifting priorities.
  - High level of empathy, integrity, and calmness under
    pressure.
  - 4+ years of software engineering experience (flexible
    depending on level), ideally with Python, AWS, or similar
    modern technologies.
  - Interest in financial systems and the opportunity to work on
    meaningful problems with real-world impact
  - You’re a thoughtful IC who thrives on shipping great
    software, improving team practices, and supporting those
    around you.

  About Us

  The caliber and character of the ModernFi team set us apart.

  We value competence and drive over experience, and look for
  compassionate people with diverse backgrounds. We appreciate
  technical ability, dedication, and humble confidence. Above
  all, we value respect — for our colleagues, our clients, our
  partners, and ourselves.

  Our team pushes each other to be better every day, supports
  each other when things go wrong, and grows together on this
  journey. Because we are a close-knit team, we are selective
  and considerate with every hire.

  The people at ModernFi could be doing anything in the world,
  yet they choose to be here.

  Benefits

  - Top-of-market comp, equity from day one
  - Health, dental, vision. 100% employee covered
  - 401(k) with a broad fund selection
  - Unlimited PTO
  - Fully paid parental leave
  - $100 monthly wellness stipend
  - Dinner in the office
  - Relocation to New York
  - Uncapped equipment
  - Quarterly team outings

  Salary Range: $150,000 - $250,000 + Equity

  The Process

  If you’d like to learn more, please email us at
  careers@modernfi.com. Our process is focused on cultural and
  personality fit. We are excited to get to know you, learn
  about what motivates you, and ensure that we can accelerate
  your personal and professional growth.
