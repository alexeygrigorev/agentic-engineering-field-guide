description: |
  SONIFI Health isn’t just building interactive patient
  technology, we’re helping healthcare organizations improve
  care and create better experiences. Our team is passionate
  about solving real healthcare challenges, reinforcing our
  belief that healthcare is hospitality, and supporting what
  patients, clinicians, and families need most in care
  settings. If shaping what the future of healthcare looks
  like in hospitals and care centers across the country sounds
  like where you want your talents and career to go next, we’d
  love to welcome you to SONIFI Health.



  Help shape the future of healthcare technology through
  thoughtful engineering, collaboration, and continuous
  growth. We’re looking for a Software Engineer who is ready
  to independently deliver high quality software solutions,
  contribute across the product development lifecycle, and
  continue expanding their technical expertise. This role
  offers the opportunity to build and improve technology that
  directly supports patient engagement, hospital operations,
  and the healthcare experience.

   What you’ll do:

  Reporting to the Director of Software Engineering, this role
  contributes across the full product development lifecycle,
  including requirements definition, design, development,
  testing, debugging, and deployment. You will work within a
  product focused engineering team to independently deliver
  small to medium-sized features and components while
  collaborating with engineering, product management, project
  management, and testing teams. Success in this role requires
  a solid technical foundation, sound engineering judgment,
  and a commitment to building reliable, maintainable
  software.

  • Analyze, design, develop, test, debug, and document
  software applications with minimal assistance, delivering
  well-defined features and technical solutions

  • Build new product capabilities, enhance existing
  applications, and resolve defects across shared codebases
  while following established software engineering standards
  and best practices

  • Partner with engineering, product management, project
  management, and testing teams to clarify requirements,
  assess technical feasibility, estimate development effort,
  and support successful delivery

  • Write clean, maintainable, and testable code, including
  unit tests that address expected functionality, edge cases,
  errors, performance, reliability, and security
  considerations

  • Apply systematic debugging and problem-solving approaches
  to diagnose complex issues, identify technical solutions,
  and support less experienced team members with
  troubleshooting

  • Contribute to technical design and implementation
  decisions while ensuring solutions align with broader
  service architecture and production requirements

  • Participate in team planning, documentation, knowledge
  sharing, process improvements, and discussions around
  priorities and implementation approaches

   What you’ll need:

  We’re looking for a software engineer with a solid technical
  foundation who can work independently within a defined area
  while continuing to grow their skills, technical breadth,
  and impact.

  • Bachelor’s degree in Computer Science, Software
  Engineering, or a related technical field and 2+ years of
  industry experience, or an equivalent combination of
  education and experience

  • Strong knowledge of software engineering methodologies,
  development best practices, testing, debugging, and
  structured problem solving

  • Experience with high level programming languages such as
  C, C++, Python, and web based technologies such as
  JavaScript and HTML

  • Ability to independently write clean, understandable, and
  testable code that accounts for expected functionality, edge
  cases, errors, and production considerations

  • Experience designing and troubleshooting software within a
  broader application or service architecture, with
  consideration for performance, reliability, fault tolerance,
  and security

  • Strong analytical, deductive reasoning, written
  communication, and verbal communication skills with the
  ability to collaborate effectively across engineering and
  product teams

  Preferred:

  • Experience with scripting languages and development
  automation

  • Experience working across multiple technologies or
  application components

  • Experience with modern web, cloud, service based, or
  distributed application environments

  • Experience contributing to team documentation, technical
  discussions, and continuous improvement initiatives

   Together, we can build your future!

  SONIFI Health offers a competitive compensation package
  based on factors including location, experience, education,
  specialty, and training. This position is also eligible for
  PTO, holidays, health, dental, vision, retirement plans, pet
  insurance, on-demand pay, and other benefits.

  SONIFI and SONIFI Health value diversity and are proud to be
  an Equal Opportunity Employer. All qualified applicants will
  be considered regardless of age, race, color, national
  origin, sex, religion, veteran status, disability, sexual
  orientation, gender identity, or any protected status.

  If you require assistance with the online application due to
  a disability, please contact Human Resources at
  605-988-1000.

  SONIFI participates in E-Verify to confirm authorization to
  work in the United States.







