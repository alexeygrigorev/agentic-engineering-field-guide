description: |
  Company Description

  AI makes us faster. It doesn’t replace our human judgment.
  We challenge AI output, verify the results and own what we
  ship. We experiment fast, learn quickly and deliver with
  care.

  Job Description

  Your Mission

  We are looking for a backend specialist who loves the
  intersection of stability and scalability. Your focus will
  not be on a title, but on the impact of your code. You will:

  - Bridge Systems: Build and maintain robust microservices that
    ensure seamless communication between internal and
    external environments.
  - Drive Implementation: Take full ownership of features from a
    raw idea to a production-ready deployment.
  - Evolve the Architecture: Contribute to our technical roadmap
    by questioning the status quo and proposing scalable
    solutions.
  - Secure the Flow: Implement and refine authentication and
    authorisation flows (OAuth, Auth0) to keep our systems
    safe and accessible.
  - Optimise the Core: Ensure our data layer is lean and fast,
    applying deep knowledge of SQL and PostgreSQL to solve
    complex data challenges.

  Qualifications

  Your Skills

  - Node.js & TypeScript Mastery: You can write clean,
    maintainable, and type-safe code that thrives in a
    production environment.

  - Data Architect Mindset: You don't just write queries; you
    understand how to design efficient database schemas and
    optimise them for performance (PostgreSQL).
  - The Art of Persistence: You know how to leverage ORMs
    effectively, understanding exactly when they help and when
    they get in the way.
  - Quality Obsession: Automated testing (jest/mocha) isn't a
    chore for you—it's the only way to ship with confidence.
  - DevOps Basics: You are comfortable with Docker, Git, and the
    general flow of modern CI/CD pipelines.

  Bonus Skills (The Power-Ups):

  - Experience navigating the AWS ecosystem or monitoring tools
    like Grafana, Prometheus, or Graylog.
  - A track record of mentoring peers or leading the technical
    direction of a project.
  - A degree in Computer Science or a self-taught journey
    evidenced by a strong portfolio.

  Additional Information

  What to expect at smartclip

  - Remote-first, with meaningful time together: We work
    remotely most of the time, with occasional workshops, team
    sessions and opportunities to collaborate in person at our
    tech office in Berlin. We also host team events throughout
    the year, including our annual Company Offsite, which
    takes place at a different venue in Germany each year.
    Being willing to travel to and attend these gatherings is
    part of the role.
  - Ownership over micromanagement: Take ownership of your work
    and drive your topics forward independently.
  - Build > Talk: Try things early, get things wrong early,
    learn early.
  - High standards, low ego: We give direct feedback and work
    together openly and respectfully.
  - Keep growing: Develop your skills through hackathons,
    conferences and community exchange.

  And of course, the benefits matter, too: 30 days of annual
  leave, plus December 24 and 31 off, Smart Fridays with the
  option of a four-day workweek, a Deutschlandticket (public
  transport pass) and JobRad bike leasing, sports and health
  benefits, mental health support, corporate discounts, access
  to RTL+ and much more.

  Your CV is just the beginning.

  What interests us more than your CV is a portfolio, a side
  project or a demo repo – something that shows us how you
  approach technical challenges and turn ideas into working
  solutions.



  AI disclaimer: AI was allowed to contribute ideas, but it
  didn’t get the final say. We kept that privilege for
  ourselves.



