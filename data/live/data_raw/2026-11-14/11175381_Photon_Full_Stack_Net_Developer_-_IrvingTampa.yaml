description: |
  Senior Full-Stack Engineer – .NET & Angular

  We are looking for a Senior Full-Stack Engineer with strong
  .NET expertise and hands-on Angular experience. This is a
  backend-heavy role focused on building scalable services and
  applications, with additional ownership of the UI layer.

  Must-Haves

  - 6+ years of software engineering experience
  - Strong hands-on expertise in C# and .NET
  - Experience with ASP.NET Core
  - Strong experience building REST APIs and microservices
  - Hands-on experience with Angular and TypeScript
  - Strong experience with relational databases, particularly
    Microsoft SQL Server and/or Oracle
  - Experience with automated testing and CI/CD
  - Solid understanding of system design, security, scalability,
    and performance
  - Strong communication, ownership, and problem-solving skills

  Nice-to-Haves

  - Experience with Entity Framework Core
  - Experience with messaging systems such as Kafka or RabbitMQ
  - Experience with RxJS, Angular Material, or NgRx
  - Experience with MongoDB or other NoSQL databases
  - Familiarity with Redis or Elasticsearch
  - Experience with event-driven architectures
  - Experience mentoring engineers or leading technical
    initiatives

  Compensation, Benefits and Duration

  Minimum Compensation: USD 34,000 Maximum Compensation: USD
  121,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full-time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
