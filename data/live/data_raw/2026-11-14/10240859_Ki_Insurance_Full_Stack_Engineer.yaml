description: |
  Who are we?👋

  Look at the latest headlines and you will see something Ki
  insures. Think space shuttles, world tours, wind farms, and
  even footballers’ legs.

  Ki’s mission is simple. Digitally disrupt and revolutionise
  a 335-year-old market. Working with Google and UCL, Ki has
  created a platform that uses algorithms, machine learning
  and large language models to give insurance brokers quotes
  in seconds, rather than days.

  Ki is proudly the biggest global algorithmic insurance
  carrier. It is the fastest growing syndicate in the Lloyd's
  of London market, and the first ever to make $100m in profit
  in 3 years.

  Ki’s teams have varied backgrounds and work together in an
  agile, cross-functional way to build the very best
  experience for its customers. Ki has big ambitions but needs
  more excellent minds to challenge the status-quo and help it
  reach new horizons.

  Where you come in?

  We’re looking for a Full-stack Engineer to join our
  development team.

  The Ki platform is the core technology crucial to our
  success — allowing us to evolve underwriting intelligently
  and unlock massive scale.

  We’re a multi-disciplined team, bringing together expertise
  in software and data engineering, full-stack development,
  platform operations, algorithm research, and data science.
  Our squads focus on delivering high-impact features, and we
  favour a highly iterative, analytical approach.

  What you will be doing: 🖋️

  - Build robust and scalable software for business critical,
    web-based applications
  - Build eye-catching, functional, efficient, and reusable web
    and mobile-based sites that drive these web applications
  - Design, build, test, document and maintain API’s and
    integrations
  - Ensure quality control using industry standard techniques
    such as automated testing, pairing, and code review
  - Work with the Product team to understand end-user
    requirements and translate them into an effective
    technical solution
  - Document technical design and analysis work
  - Assess current system architecture and identify
    opportunities for growth and improvement
  - Build mock-ups or prototypes to explore and troubleshoot new
    initiatives
  - Work with the Product team and UX designers to review
    designs, implement new features, and ensure user
    experience is top level
  - Explore new ideas and emerging technologies, develop
    prototypes quickly
  - Uphold the engineering team’s principles and ways of working

  What to expect during the recruitment process:

  1) Initial recruiter screening call

  2) Interview with hiring manager

  3) Technical Interview (this may vary depending on the role)

  4) Values Interview

  Requirements

  - Experience as a mid-senior level engineer working across a
    modern web stack
  - Experience with software engineering principles (SOLID, DRY,
    ER modelling)
  - Professional experience with a server-side language, ideally
    JVM based
  - Professional experience building web-based single page
    applications, using React/Typescript or an equivalent
  - Knowledge of front-end development, able to build rich user
    interfaces following a responsive design
  - Comfortable working with cloud infrastructure,
    infrastructure as code, familiar with standard logging and
    monitoring tools used to investigate issues
  - Experience with continuous integration, or ideally,
    continuous delivery
  - Comfortable with build tools (e.g. Maven) and version
    control tools (e.g. Git/Github)
  - Experience working in agile teams, following Scrum or
    Kanban, participating in regular ceremonies including
    stand-ups, planning, and retrospectives
  - Experience using project management and workflow tools (e.g.
    Jira)
  - Exceptional interpersonal skills, including teamwork,
    facilitation, negotiation and planning
  - Ability to quickly comprehend the functions and capabilities
    of new technologies

  Benefits

  You’ll get a highly competitive remuneration and benefits
  package. This is kept under constant review to make sure it
  stays relevant. We understand the power of saying thank you
  and take time to acknowledge and reward extraordinary effort
  by teams or individuals.
