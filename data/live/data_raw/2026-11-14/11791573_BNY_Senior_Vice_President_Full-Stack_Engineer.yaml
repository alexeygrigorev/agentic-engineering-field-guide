description: |
  We’re seeking a future team member for the role of Full
  Stack Engineer to join our team. This role is located in
  London.

  In this role, you’ll make an impact in the following ways:

  - Design and develop web front-end and back-end services for a
    new platform built to automate the management of the full
    lifecycle of complex private assets.
  - Collaborate closely with cross-functional teams, including
    product owners, business analysts, scrum masters, and
    engineering.
  - Build front and back end components ensuring software is
    exceptionally well covered by automated testing and is
    clean, easy to understand, and extend.
  - Ensure usability, scalability, performance, and resilience
    of this high-profile platform.
  - Build with Java Spring Boot and Angular Typescript.
  - Ensure an exceptional user experience and seamless
    integration between front-end and back-end components.
  - Expose clear, documented APIs for external integrations.
  - Conduct peer code reviews.

  To be successful in this role, we’re seeking the following:

  - Experience in Java Spring Boot and Angular web development.
  - Strong knowledge of micro-services and micro front-ends.
  - Expertise in reactive UX front-end design patterns.
  - Experience with high availability and high scalability
    design patterns.
  - Proficiency with GitLab and CI/CD pipelines.
  - Experience working in Agile development environments.
  - Nice to have: Experience working with Solidity & EVM-based
    platforms; blockchain and smart contracts

  About Us

  At BNY, our culture allows us to run our company better and
