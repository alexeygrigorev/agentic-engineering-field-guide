description: |
  The Position:

  We are seeking a proactive and highly skilled Senior
  Software Engineer to join our high-impact Lead Platform
  engineering team. This team designs and scales the mission-
  critical systems responsible for lead capture, intelligent
  routing, and real-time tracking. These solutions directly
  empower our senior living advisors with the seamless tools
  and actionable data insights required to connect families
  with tailored, compassionate care options. This position is
  fully remote, however the candidate must live and be
  authorized to work in the United States.

  The Lead Platform team is actively engineering modern,
  Advisor-facing experiences using NestJS, Node.js, and React.
  Reporting to the Director of Software Engineering, this
  full-stack role will include roughly 70% frontend and 30%
  backend architecture and development. In this position, you
  will help design, build, and maintain scalable services at
  the core of our advisor product ecosystem. You will
  collaborate closely with a dedicated team of engineers,
  product managers, and QA professionals who are all focused
  on delivering high-quality, high-impact solutions so
  advisors can help families navigate senior living decisions
  with confidence and care.

  The ideal candidate is a pragmatic engineer with deep
  technical curiosity and strong problem-solving skills. You
  excel at taking ownership of complex technical challenges
  and thrive in environments where you can drive clarity and
  momentum. You prioritize rapid iteration to refine features
  based on production usage and data feedback. Furthermore,
  you view experimentation, analytics, and AI integration as
  core software engineering practices while contributing to a
  collaborative, high-trust team culture.

  What You Will Do:

  - Own and deliver well-scoped projects and features from end
    to end; includes technical design through implementation,
    testing, deployment, and support.
  - Work with product managers and QA to translate business
    requirements into resilient, well-tested software
    solutions.
  - Contribute to architectural discussions, design reviews, and
    platform-wide decision-making.
  - Help evolve and enforce strong engineering standards via
    code reviews, documentation, and mentorship.
  - Participate in the creation and maintenance of automated
    tests and CI/CD pipelines to ensure rapid, stable
    delivery.
  - Build experimentation and analytics foundations: feature
    flags, A/B tests, instrumentation, and observability.
  - Champion quality and continuous deployment through testing
    (unit, integration, e2e), pipeline automation, and design
    system adoption.
  - Monitor, troubleshoot, and resolve production issues using
    logs, metrics, and instrumentation to continuously improve
    reliability.
  - Engage with the engineering team on technical planning and
    provide timeline estimates and implementation guidance for
    smaller to moderately complex tasks.
  - Collaborate with and learn from staff engineers and
    engineering leadership while also mentoring more junior
    teammates as appropriate.
  - Lead efforts in debugging, refactoring, and optimizing
    performance across services you help maintain.



  Required Skills & Competencies:

  - 6+ years of professional full-stack engineering experience,
    including modern JavaScript/TypeScript frameworks.
  - Proficiency with modern architecture patterns, including API
    design (REST and GraphQL), asynchronous processing, and
    microservices.
  - Experience working with cloud infrastructure, especially AWS
    (Lambda, EventBridge, S3, etc.).
  - Experience working with relational and non-relational
    databases (PostgreSQL, MongoDB).
  - Experience with event-driven architectures and async
    processing patterns (EventBridge, SQS, or similar).
  - Demonstrated experience in CI/CD pipelines and version
    control (GitHub Actions).
  - Hands-on experience building LLM-backed features (prompt
    design, retrieval, structured output, evaluation, cost and
    latency management) and fluency with AI coding agents.
  - Solid testing mindset with experience writing and
    maintaining automated unit, integration, and end-to-end
    tests.
  - Effective written and verbal communication skills; able to
    clearly articulate technical decisions and collaborate
    cross-functionally.
  - Proven ability to work independently and with a distributed
    team in a fast-paced environment.
  - Passion for continuous learning, product quality, and team
    success.

  Additional Information:

  - Compensation Base Salary: $160,000 - 190,000

  Benefits:

  - 401(k) plus match
  - Dental insurance
  - Health insurance
  - Vision insurance
  - Paid Time Off

  About A Place for Mom

  A Place for Mom is the leading platform guiding families
  through every stage of the aging journey. Together, we
  simplify the senior care search with free, personalized
  support — connecting caregivers and their loved ones to
  vetted providers from our network of 15,000+ senior living
  communities and home care agencies.

  Since 2000, our teams have helped millions of families find
  care that fits their needs. Behind every referral and
  resource is a shared goal: to help families focus on what
  matters most — their love for each other.

  We’re proud to be a mission-driven company where every role
  contributes to improving lives. Caring isn’t just a core
  value — it’s who we are. Whether you’re supporting families
  directly or driving innovation behind the scenes, your work
  at A Place for Mom makes a real difference.

  Our employees live the company values every day:

  - Mission Over Me: We find purpose in helping caregivers and
    their senior loved ones while approaching our work with
    empathy.
  - Do Hard Things: We are energized by solving challenging
    problems and see it as an opportunity to grow.
  - Drive Outcomes as a Team: We each own the outcome but can
    only achieve it as a team.
  - Win The Right Way: We see organizational integrity as the
    foundation for how we operate.
  - Embrace Change: We innovate and constantly evolve.

  Additional Information:

  A Place for Mom has recently become aware of the fraudulent
  use of our name on job postings and via recruiting emails
  that are illegitimate and not in any way associated with us.
  APFM will never ask you to provide sensitive personal
  information as part of the recruiting process, such as your
  social security number; send you any unsolicited job offers
  or employment contracts; require any fees, payments, or
  access to financial accounts; and/or extend an offer without
  conducting an interview.

  If you suspect you are being scammed or have been scammed
  online, you may report the crime to the Federal Bureau of
  Investigation and obtain more information regarding online
  scams at the Federal Trade Commission.

  All your information will be kept confidential according to
  EEO guidelines.

  A Place for Mom uses E-Verify to confirm the employment
  eligibility of all newly hired employees. To learn more
  about E-Verify, including your rights and responsibilities,
  please visit www.dhs.gov/E-Verify.
