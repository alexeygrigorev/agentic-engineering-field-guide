description: |
  Meet Eloquent AI

  At Eloquent AI, we’re building the next generation of AI
  Operators—multimodal, autonomous systems that execute
  complex workflows across fragmented tools with human-level
  precision. Our technology goes far beyond chat: it sees,
  reads, clicks, types, and makes decisions—transforming how
  work gets done in regulated, high-stakes environments.

  We’re already powering some of the world’s leading financial
  institutions and insurers, fundamentally changing how
  millions of people manage their finances every day. From
  automating compliance reviews to handling customer
  operations, our Operators are quietly replacing repetitive,
  manual tasks with intelligent, end-to-end execution.

  Headquartered in San Francisco with a global footprint,
  Eloquent AI is a fast-growing company backed by top-tier
  investors. Join us to work alongside world-class talent in
  AI, engineering, and product as we redefine the future of
  financial services.

  Your Role

  As a Lead Engineer at Eloquent AI, you will lead the
  development of AI-powered full-stack applications while
  overseeing and mentoring other engineers. You’ll remain
  hands-on across the stack, but also take ownership of
  technical direction, code quality, and delivery standards.

  You’ll work closely with engineers, AI researchers, and
  product teams to ensure scalable, reliable systems that
  power real-time AI-driven workflows. This role requires
  strong engineering fundamentals, leadership capability, and
  the ability to operate effectively in a fast-paced, AI-first
  environment.

  You will:

  - Design and build full-stack applications that power AI-
    driven workflows for enterprise users.
  - Oversee and review the work of other engineers, ensuring
    high-quality, production-ready code.
  - Provide technical guidance, architectural direction, and
    hands-on support where needed.
  - Develop high-performance front-end interfaces for AI agent
    control, monitoring, and visualisation.
  - Build scalable backend services that support real-time AI
    interactions, knowledge retrieval, and automation.
  - Work closely with AI researchers and ML engineers to
    integrate LLMs, RAG, and automation into production-ready
    systems.
  - Establish engineering best practices across testing,
    deployment, and performance optimisation.
  - Continuously iterate and refine AI-driven products,
    balancing speed with robustness.

  Requirements

  - 8+ years of hands-on experience building full-stack
    production applications.
  - Prior experience leading or mentoring engineers.
  - Proficiency in React, TypeScript, and Node.js.
  - Backend experience using Python.
  - Strong knowledge of cloud infrastructure (AWS, GCP, or
    Azure) and scalable architectures.
  - Understanding of AI-powered applications (LLMs, chat
    interfaces, agentic workflows).
  - Ability to work in a fast-paced, high-autonomy environment.
  - Strong collaboration skills across engineering, product, and
    AI teams.

  Bonus Points If…

  - You have experience building AI-powered applications with
    LLM integrations.
  - You’ve worked in high-performance startups or enterprise AI
    environments.
  - You have a sharp eye for UI/UX design and have built
    intuitive, AI-driven interfaces.
  - You have experience with GraphQL, WebSockets, or real-time
    data streaming.
  - You’ve contributed to open-source projects or have built
    developer tools for AI.
