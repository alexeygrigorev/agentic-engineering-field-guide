description: |
  About MCU:

  At Municipal Credit Union, we believe that an incredible
  culture helps create a happy and motivated team that works
  hard to achieve the best results for themselves and their
  members. For more than 100 years, MCU has provided
  affordable financial products and convenient services to a
  membership base that is now comprised of over 600,000
  individuals. With each new generation we have the pleasure
  of interacting with, we maintain the credit union promise of
  people helping people.

  Our Mission:

  To help hard-working New Yorkers build better tomorrows

  Our Vision:

  Be New York's most loved financial institution by helping
  our members build their best financial futures

  Overview: The Software Developer QA/QC independently
  evaluates development work completed by Software Developers
  and Senior Software Developers to ensure solutions meet
  approved requirements and MCU standards for functionality,
  security, performance, reliability, maintainability,
  documentation, and production readiness. The role reviews
  code and technical designs, coordinates and performs
  testing, validates defect remediation, and serves as a
  quality gate throughout the software development lifecycle
  while working collaboratively with developers, business
  analysts, stakeholders, and end users.

  Responsibilities:

  Specific duties include, but are not limited to, the
  following:

  - Review business requirements, acceptance criteria, technical
    designs, and development deliverables for completeness,
    traceability, accuracy, and testability.
  - Perform independent peer reviews of source code, APIs,
    integrations, microservices, widgets, automation, database
    objects, reports, and application workflows developed by
    Software Developers and Senior Software Developers.
  - Validate adherence to MCU development standards, software
    architecture, coding conventions, source control
    practices, security requirements, and documentation
    standards.
  - Develop, execute, and maintain risk-based test strategies,
    test plans, test cases, test scripts, test data, and
    regression test suites.
  - Create and execute manual and automated test cases;
    identify, document, and track defects using
    defect‑tracking tools
  - Collaborate with engineering teams to identify, document,
    and resolve defects early in the development lifecycle
  - Perform functional, integration, system, regression,
    negative, security, performance, and production-readiness
    testing, as appropriate to the change.
  - Confirm that approved requirements and acceptance criteria
    have been implemented and that test evidence supports the
    results.
  - Identify, document, prioritize, and track defects;
    communicate findings clearly; and verify remediation
    through retesting before release.
  - Validate data integrity, SQL logic, interfaces, error
    handling, logging, exception management, monitoring, and
    auditability.
  - Review authentication, authorization, encryption, sensitive-
    data handling, input validation, dependency risks, and
    other secure coding controls.
  - Assess application performance, scalability, reliability,
    supportability, and maintainability and escalate material
    risks or unresolved quality concerns.
  - Validate deployment packages, configuration changes, release
    notes, implementation plans, rollback procedures, and
    production-readiness checklists.
  - Review automated test coverage and collaborate with
    developers to improve unit, integration and regression
    testing.
  - Maintain objective evidence of reviews, test execution,
    defects, approvals, exceptions, and release decisions in
    approved systems of record.
  - Apply appropriate QA approaches across Agile, Scrum, and
    Waterfall development methodologies
  - Collaborate with Business Analysts, developers,
    stakeholders, and end users to clarify requirements,
    expected results, and acceptance criteria.
  - Support User Acceptance Testing while maintaining clear
    separation between technical quality validation and
    business acceptance.
  - Produce and communicate quality metrics, including defect
    trends, escaped defects, rework, test coverage, and
    release-readiness status.
  - Recommend improvements to coding, review, testing,
    documentation, and release processes to reduce defects and
    improve delivery quality.
  - Follow standardized methods and procedures used for
    efficient and prompt handling of all development requests.
  - Adhere to all regulatory compliance training inclusive of
    BSA/AML/OFAC and overall BSA/AML/OFAC compliance.
  - Lead efforts to continuously refine QA processes,
    incorporating feedback from retrospectives and post-
    release reviews
  - Perform other related duties as requested and special
    projects as assigned.
  - Demonstrate strong written and verbal communication skills,
    sound judgment, objectivity, and the ability to provide
    constructive technical feedback.
  - Maintain the highest ethical standards.



  Requirements:

  - Strong understanding of software development lifecycle
    practices, quality assurance, quality control, risk-based
    testing, defect management, and release validation.

  - Proficiency reviewing .NET applications and object-oriented
    code using C# or VB.NET; familiarity with ASP.NET, CSS,
    HTML, JavaScript, or jQuery.
  - Experience testing RESTful APIs, SOAP or web services,
    integrations, microservices, and distributed application
    workflows.
  - Strong knowledge of SQL and Microsoft SQL Server, including
    validation of queries, stored procedures, database
    objects, data integrity, and SSIS packages.
  - Experience with source control, pull requests, branching
    practices, code review tools, integrated development
    environments, and Azure DevOps.
  - Experience with tools such as Postman, Selenium and
    Playwright
  - Knowledge of CI/CD pipelines, automated testing, application
    deployment, configuration management, rollback validation,
    and production-readiness controls.
  - Knowledge of secure coding and application security
    concepts, including authentication, authorization,
    encryption, input validation, secrets management, and
    common web application risks.
  - Ability to create clear test documentation, reproduce
    technical issues, evaluate remediation, and communicate
    risk to technical and business stakeholders.
  - Ability to remain independent and objective when reviewing
    peer development work while maintaining collaborative
    working relationships.
  - Knowledge of Symitar and related technologies such as
    PowerOn, SymXchange, SymConnect, OpCon, and ARCU is
    desirable.
  - Experience with financial services applications, regulatory
    environments, performance testing, application monitoring,
    and AI-assisted development controls is desirable.



