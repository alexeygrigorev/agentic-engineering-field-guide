description: |
  About Methods

  Methods is a £100M+ IT Services Consultancy that partners
  with central government departments, agencies, and
  commercial organisations to deliver meaningful digital
  transformation. Established over 30 years ago and UK-based,
  we combine expertise in transformation, delivery,
  technology, and collaboration to create people-centred
  solutions that deliver lasting value.

  Predominantly focused on the public sector, whilst
  continuing to expand its private sector presence, Methods
  combines deep consulting expertise with the capability and
  scale of the Alten Group, which acquired Methods in 2022.

  As a Full Stack Developer, you will discover, design, build,
  cloud-based applications and prototypes that support
  discovery work.

  You’ll work across both front-end and back-end development,
  helping teams explore, test, and validate new technical
  approaches and digital services that underpin wider reform
  programmes.

  This role is ideal for a developer who enjoys working across
  the full stack, contributing to discovery-phase builds while
  ensuring performance, security, and usability are embedded
  from the outset.

  Key Responsibilities

  - Design, develop, and test applications using Java / Spring
    Boot, Python, TypeScript, and Angular. (mix of FE and BE)

  - Build and consume RESTful APIs and integrate with back-end
    microservices.

  - Develop prototype user interfaces with a focus on
    accessibility, usability, and responsive design.

  - Discover applications on Microsoft Azure (App Services, AKS,
    Functions, Databases).

  - Contribute to DevOps pipelines, version control, and
    automated testing.

  - Collaborate with architects, data engineers, and UX
    designers to ensure cohesive end-to-end delivery.

  - Participate in sprint planning, code reviews, and technical
    documentation to support discovery outcomes.

  - Support integration of front-end components with APIs and
    event-driven back-end systems.

  Requirements

  Essential Skills & Experience

  - Solid hands-on experience with Java / Spring Boot and
    TypeScript / Angular in production or prototype
    environments.

  - Working knowledge of Python for API or integration
    scripting.

  - Strong understanding of Azure cloud services, including App
    Services, AKS, and storage.

  - Experience developing and consuming APIs and managing data
    exchange between systems.

  - Familiarity with CI/CD pipelines, testing frameworks (JUnit,
    Jest, Cypress), and Git workflows.

  - Awareness of secure coding practices, authentication (OAuth
    / OIDC), and identity management.

  - Strong collaboration and problem-solving skills in
    multidisciplinary teams.

   Desirable Skills

  - SC cleared
  - Experience in discovery or alpha projects, building
    prototypes or proofs of concept.

  - Knowledge of containerisation (Docker, Kubernetes) and
    Infrastructure-as-Code (Terraform).

  - Familiarity with DevSecOps and automated testing pipelines.

  - Understanding of digital environments or public-sector
    technology standards.

  - Exposure to data integration and analytics solutions within
    full-stack applications.

  Location: Remote (UK-based) - Occasional Travel to London

  This role will require you to have or be willing to go
  through Security Clearance. As part of the onboarding
  process candidates will be asked to complete a Baseline
  Personnel Security Standard; details of the evidence
  required to apply may be found on the government website
  Gov.UK. If you are unable to meet this and any associated
  criteria, then your employment may be delayed, or rejected.
  Details of this will be discussed with you at interview.

  Benefits

  By joining us you can expect:

  - Autonomy to develop and grow your skills and experience
  - Be part of exciting project work that is making a difference
    in society
  - Strong, inspiring and thought-provoking leadership
  - A supportive and collaborative environment.

  As well as this, we offer:

  - Development access to LinkedIn Learning, a management
    development programme and training
  - Wellness 24/7 Confidential employee assistance programme
  - Social – Breakfast Tuesdays, Thirsty Thursdays and Pizza on
    the last Thursday of each month as well as commitment to
    charitable causes
  - Time off 25 days a year
  - Pension Salary Exchange Scheme with 4% employer contribution
    and 5% employee contribution
  - Discretionary Company Bonus based on company and individual
    performance
  - Life Assurance of 4 times base salary
  - Private Medical Insurance which is non-contributory (spouse
    and dependants included)
  - Worldwide Travel Insurance which is non-contributory (spouse
    and dependants included)
