description: |
  Why Harvey

  At Harvey, we’re transforming how legal and professional
  services operate. By combining frontier agentic AI, an
  enterprise-grade platform, and deep domain expertise, we’re
  reshaping how critical knowledge work gets done for decades
  to come.

  This is a rare chance to help build a generational company
  at a true inflection point. We have strong product-market
  fit and world-class investor support. We’re scaling fast and
  defining a new category in real time. The work is ambitious,
  the bar is high, and the opportunity for growth — personal,
  professional, and financial — is unmatched.

  Our team moves fast, takes ownership, and is deeply
  committed to the mission — operating with intensity, staying
  close to our customers, and pushing each other for
  excellence. We live by three values: Decisiveness,
  Simplicity, and Job's Not Finished. We act quickly on clear
  judgment over perfect information, we believe simplicity is
  what scales, and we're never satisfied with where we are. If
  you want to do the best work of your career alongside people
  who share that drive, we'd love to build with you.

  At Harvey, the future of professional services is being
  written today — and we’re just getting started.

  Role Overview

  Harvey’s Legal Engineering Manager, Product Specialist lead
  and scale a high-performing team of Legal Engineer, Product
  Specialists responsible for driving customer adoption,
  expansion, renewal and long-term success across Harvey’s
  global customer base. This role sits at the center of
  Harvey’s post-sales motion, ensuring that customers realize
  meaningful value from Harvey’s platform and expand their
  usage over time.

  You will oversee a team of former practicing lawyers who
  serve as trusted advisors to customers, guiding them in
  integrating Harvey into their workflows. As a manager, you
  will be responsible for elevating team performance, shaping
  customer engagement strategy, and partnering cross-
  functionally with Customer Success, Sales, Product, and
  Engineering to drive retention, expansion, and product
  evolution.

  This is both a strategic and hands-on leadership role. You
  will directly engage with Harvey’s most important customers,
  coach your team through complex engagements, and build the
  systems, playbooks, and infrastructure needed to scale a
  world-class post-sales function.

  What You'll Do

  - Lead and develop a high-performing team: Recruit, mentor,
    and manage a team of Legal Engineer – Product Specialists,
    setting a high bar for customer engagement, legal
    credibility, and product expertise. Coach team members
    through complex customer situations, provide actionable
    feedback, and create clear paths for growth and
    performance excellence.
  - Drive customer adoption, retention, and expansion: Own the
    team’s impact on customer outcomes, including adoption,
    utilization, renewals, and expansion. Partner closely with
    Customer Success Managers and Account Executives to ensure
    coordinated account strategies that deepen engagement and
    demonstrate measurable value.
  - Oversee customer engagement strategy: Guide how the team
    engages with customers across implementation, onboarding
    and ongoing enablement. Ensure consistent, high-quality
    delivery of workshops, trainings, and hands-on agent
    building sessions that help legal professionals integrate
    Harvey deeply into their workflows across practice areas
    and geographies.
  - Act as a senior escalation point for key accounts: Directly
    engage with Harvey’s most strategic and complex customers,
    building relationships with partners, general counsel, and
    other senior legal stakeholders. Step into critical
    moments to unblock adoption challenges and reinforce
    Harvey’s value proposition.
  - Own team operations and performance management: Manage team
    capacity, account allocation, and coverage to ensure
    efficient support across the customer base. Establish
    clear performance metrics tied to adoption, engagement,
    and customer health. Drive accountability through data-
    informed decision making.
  - Build scalable processes and enablement: Design and refine
    playbooks, onboarding frameworks, training programs, and
    best practices that enable the team to operate
    consistently and effectively at scale. Partner with Legal
    Enablement and Product to continuously improve materials
    and approaches.
  - Partner cross-functionally to improve customer outcomes:
    Collaborate closely with Customer Success, Sales, Product,
    Engineering, and Applied Legal Research to align on
    customer needs and deliver cohesive solutions. Ensure
    insights from customer engagements are translated into
    actionable improvements across teams.
  - Influence product strategy and roadmap: Aggregate and
    synthesize feedback from your team and customers to inform
    product development. Advocate for features and workflows
    that address real-world legal use cases and improve
    usability, adoption, and impact.
  - Shape Harvey’s customer-facing narrative: Partner with
    Marketing and Enablement to develop high-quality content,
    use case materials, and thought leadership that reflect
    deep legal expertise and resonate with customers. Help
    define how Harvey communicates value in a post-sales
    context.

  What You Have

  - JD or equivalent legal qualification.
  - 5+ years practicing law at a top-tier law firm (Vault 50 or
    equivalent) and/or in-house at a F500 or leading tech
    company, with significant client-facing experience.
  - 4+ years of direct people-management experience, with a
    demonstrated track record of building, leading, and
    developing high-performing teams - including hiring,
    performance management, and career development of direct
    reports. Experience managing legal professionals is
    preferred, but candidates with strong management track
    records leading non-legal teams will also be considered,
    provided they bring the legal background described above.
  - Strong executive presence, with experience building
    relationships with senior stakeholders such as law firm
    partners, general counsel, c-suite/senior innovation team
    members and legal operations leaders.
  - Deep understanding of legal workflows and the challenges
    faced by modern legal teams.
  - Demonstrated success in customer-facing roles (e.g., client
    advisory, customer success, legal tech, or innovation
    teams).
  - Ability to operate in a fast-paced, ambiguous environment
    and drive both strategic initiatives and day-to-day
    execution.
  - Strong interest in AI and its potential to transform the
    legal industry.
  - Experience working cross-functionally with Product and
    Engineering teams is a plus.

  Compensation

  $315,000 - $385,000 USD OTE 75/25 Split

