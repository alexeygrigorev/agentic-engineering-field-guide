description: |
  Behind every investment is a person with ambitions,
  motivations and values. While we know that every client is
  unique, they come to J.P. Morgan Personal Investing for the
  same reason: our straightforward and transparent approach to
  investing, and the trust that 150 years of J.P. Morgan
  heritage brings.

  J.P. Morgan Personal Investing offers award-winning
  investments, products and digital wealth management services
  to over 275,000 investors in the UK. We built the business
  with innovation as a core part of our ethos to give
  consumers the confidence and clarity to make informed
  investment decisions and achieve their financial goals.

  As a Lead Software Engineer at JPMorgan Chase within JPM
  Personal Investing, you will work as a hands-on Staff
  Salesforce Engineer to drive the development and evolution
  of our Salesforce-based CRM Servicing platform within JPM
  Personal Investing. This role combines deep Salesforce
  engineering expertise with architecture-level thinking and
  strong delivery leadership. You will design, build, and
  govern robust, scalable, secure, and maintainable solutions,
  translating complex business needs into elegant technical
  outcomes while upholding high engineering standards, DevOps
  discipline, and a continuous improvement mindset.

  Job Responsibilities:

  - Define and evolve the CRM Servicing engineering strategy
    aligned to business goals and drive towards a technology
    target-state architecture for CRM Servicing.
  - Lead technical discovery and solution architecture as a
    trusted advisor, aligning designs to business objectives
    and ensuring stakeholders understand decisions, trade-
    offs, and implications. Deliver end-to-end Salesforce
    solutions through build, test, release, and production
    support.
  - Own architectural decision-making: evaluate options,
    document decisions (e.g., ADRs), and ensure solutions meet
    standards for security, scalability, reliability,
    performance, and maintainability.
  - Own technical direction and governance of complex,
    integrated solutions to ensure Salesforce fits cohesively
    into the broader JPM Personal Investing ecosystem,
    including applications, data platforms, integration
    layers, identity and security, and the operating model.
  - Establish and operate architecture governance to reduce
    delivery and operational risk, and conduct implementation
    and architecture reviews to ensure deliverables align with
    architectural intent, platform best practices, and firm
    standards for security, resiliency, SDLC controls, and
    operational readiness.
  - Remain hands-on: build key components, unblock teams through
    deep technical problem-solving, and lead by example in
    code quality, performance, observability, and
    maintainability.
  - Identify, assess, and manage technical and delivery risks;
    drive issue resolution end-to-end, coordinating across
    teams to remove blockers and prevent recurrence.
  - Partner with engineering teams to evolve the platform
    architecture within an event-driven microservices
    ecosystem with heavy Kafka usage, ensuring integration
    patterns and platform constraints are addressed.
  - Champion engineering excellence, including automated
    testing, CI/CD, observability, release hygiene, and
    operational support practices.
  - Mentor and elevate engineers through coaching, design
    reviews, and consistent patterns and standards across the
    team

  Required qualifications, skills, and capabilities:

  - Extensive experience designing and delivering solutions on
    the Salesforce platform, including Sales and Service
    Clouds, with a track record of successful, production-
    grade implementations.
  - Proven ability to translate complex business requirements
    into technical designs and lead delivery from mobilisation
    through to production support.
  - Solid understanding of financial services, including
    servicing, client experience, regulatory considerations,
    and security and privacy expectations.
  - Strong engineering fundamentals: scalable design, clean
    code, test automation, performance tuning, and operational
    resilience
  - Strong understanding of cloud platform architecture
    principles, including SaaS/PaaS, multi-tenancy, multi-tier
    architectures, and integration patterns.
  - Strong software design fundamentals, including modularity,
    separation of concerns, resiliency, performance, and
    maintainability.
  - Proven experience delivering cross-cloud Salesforce
    implementations integrated with other cloud and on-
    premises systems.
  - Deep awareness of Salesforce platform constraints, including
    governor limits and large data volumes, and data migration
    strategy.
  - Experience working in environments requiring strong
    controls, security standards, and disciplined SDLC/DevOps
    practices.
  - Demonstrated ability to lead through influence, mentor
    engineers, and drive alignment across teams and
    stakeholders.
  - Collaboration and Cross-team Alignment
  - Serve as an architecture liaison between Salesforce delivery
    and JPM Personal Investing engineering teams, ensuring
    designs align with PI platform standards, integration
    patterns, and operational expectations.
  - Facilitate cross-team alignment on solution options, trade-
    offs, and implementation approach, including APIs versus
    events, synchronous versus asynchronous flows, and
    ownership boundaries, and drive timely decisions.
  - Translate business and product needs into clear technical
    requirements and architecture direction that engineering
    teams can implement consistently.
  - Partner with engineering leads to identify delivery and
    operational risks early, including scalability, limits,
    security, resilience, and observability; agree mitigations
    and track them through to resolution.
  - Promote shared ways of working, including architecture
    reviews, ADRs, and reusable patterns and guardrails, to
    reduce friction and improve consistency across PI
    engineering teams.

  Preferred qualifications, capabilities, and skills:

  - Microservices and event-driven architecture experience,
    including Kafka and its ecosystem.
  - Cloud platforms, with AWS preferred.
  - Infrastructure as Code, with Terraform preferred.
  - Salesforce Certified Technical Architect (CTA), highly
    desired.
  - Salesforce Certified Application Architect.
  - Salesforce Certified System Architect.

