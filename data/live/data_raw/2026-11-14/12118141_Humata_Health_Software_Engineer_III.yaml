description: |
  👋 We’re Humata Health. Humata Health creates frictionless
  prior authorization for providers and payers. With our
  proprietary artificial intelligence (AI) and automation
  technology, Humata Health delivers quality prior
  authorization submissions to help get patients the care they
  deserve. Humata Health is a physician-led company backed by
  a syndicate of strategic healthcare investors including Blue
  Venture Fund, LRVHealth, Optum Ventures, .406 Ventures, and
  Highmark Ventures.

  🔍 What we're looking for: Humata Health Inc. is seeking a
  Software Engineer II to join our Data Ingest team and
  modernize our existing healthcare technology solutions. In
  this role, you'll be helping a team of existing engineers
  enhance and support our existing applications. Primary areas
  of expertise will include C# and SQL.

  📍Location: Remote or Winter Park, FL - Hybrid

  ✅ Responsibilities

  Development & Maintenance

  - Assist in developing and maintaining frontend and backend
    applications
  - Write clean, well-documented code following team standards
  - Help implement and test RESTful APIs

  Collaboration & Process

  - Collaborate with team members on development tasks
  - Participate in code reviews to improve your skills and
    knowledge
  - Participate in Agile ceremonies and contribute to sprint
    planning
  - Document code, processes, and technical decisions
  - Debug and fix issues in existing applications. Specifically,
    debugging stack traces and web application debug tools.

  🛠 Role Requirements

  - Bachelor's degree in Computer Science, Software Engineering,
    related field or equivalent experience
  - 3-5 years of professional software development experience
  - Kubernetes
  - Solid knowledge of C# and .NET framework
  - Experience building and consuming REST APIs
  - Solid understanding of database concepts and SQL (e.g. SQL
    Server)
  - Familiarity with version control systems (e.g., Git)
  - Knowledge of software development life cycle
  - Strong problem-solving skills and eagerness to learn
  - Good communication skills and ability to work in a team
    environment
  - Attention to detail and commitment to code quality
  - Learn about cloud technologies and assist with
    implementations
  - Stay current with emerging technologies through continuous
    learning

  ⭐Preferred Experience & Skills:

  - Internship or academic project experience with web
    applications
  - Understanding of cloud platforms (e.g., Azure, AWS)
  - Familiarity with Agile/Scrum methodologies
  - Knowledge of object-oriented programming principles
  - Experience with unit testing and test-driven development
  - Solid understanding of CI/CD concepts
  - Postman or API related tools
  - Knowledge of containerization technologies
  - Interest in developing secure and scalable applications
  - Eagerness to learn about healthcare technology, HIPAA
    compliance and healthcare data handling

  Hiring Process & Timeline

  Interview Stages:

  - Initial interview with HR
  - Hiring Manager Interview
  - Technical leadership Interview
  - Offer

  🚀 Why Join Humata Health?

  - Impactful Work: Contribute to innovative solutions that
    improve healthcare efficiency and patient outcomes
  - Remote Flexibility: Enjoy working remotely while being part
    of a collaborative team, with access to our new office in
    Winter Park, FL
  - Competitive Compensation: Enjoy competitive base
    compensation, equity through our Employee Stock Option
    Plan, and bonus-eligible roles
  - Comprehensive Benefits: Full benefits package including
    unlimited PTO and 401k program with employer match
  - Growth Opportunities: Advance your career in a fast-paced,
    high-impact environment with ample professional
    development
  - Inclusive Culture: Join a diverse workplace where your ideas
    and contributions are valued

