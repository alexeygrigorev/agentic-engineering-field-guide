description: |
  About Vercel:

  Vercel is the agentic infrastructure company, freeing people
  and agents to ship what's next. For more than a decade we've
  helped builders move from idea to production with speed,
  security, and exceptional developer experience.

  Now we're scaling our products for both agents and people to
  ship and run software, built in the open and trusted by
  OpenAI, PayPal, Ramp, Supreme, and millions of developers
  worldwide.

  About the role

  Vercel is looking for engineers to help us build functional
  systems that improve product and customer experience. As a
  member of the Edge team, you will help to scale and improve
  our infrastructure, availability and reliability by working
  with our backend engineers and product team to identify
  problems, create tooling and automation.

  Your role will be dynamic - you should be comfortable
  designing systems, writing code, and debugging systems in
  production. Our team orchestrates deploying, routing and
  serving for our customers through capabilities and tooling
  we maintain that leverage our own and other cloud providers'
  infrastructure for networking, TLS termination, routing,
  storage, caching and other novel edge services.

  If you’re based within a pre-determined commuting distance
  of one of our offices (SF or NY), the role includes in-
  office anchor days on Monday, Tuesday, and Friday. If you're
  located beyond that distance, the role is fully remote. For
  location-specific details, please connect with our
  recruiting team.

  What you need

  - Intrigued by tackling the complex challenges serving
    petabytes of data and billions of requests to millions of
    people
  - A collaborative team player who believes in the power of
    strong teams to drive significant changes and innovations
  - Have at least 5 years of relevant experience
  - Have deep experience with how to make high performance
    systems scale in the cloud
  - Want to help protect the Vercel platform and our customers
    from abuse
  - Are keen to experiment, challenge norms and deliver secure
    and reliable systems that delight Vercel's users
  - Are knowledgeable and experienced with web servers, network
    protocols
  - Comfortable in Golang
  - Familiar with Cloud Services (e.g. AWS, Google Cloud, or
    others)
  - Experience with Terraform, Kubernetes, Lua, React and
    Next.js are nice-to-have!

  Benefits & Compensation:

  - Competitive compensation package, including equity.
  - Inclusive Healthcare Package.
  - Learn and Grow - we provide mentorship and send you to
    events that help you build your network and skills.
  - Flexible Time Off.
  - We will provide you the gear you need to do your role, and a
    WFH budget for you to outfit your space as needed.

  The San Francisco, CA base pay range for this role is
  $196,000-$294,000. Actual salary will be based on job-
  related skills, experience, and location. Compensation
  outside of San Francisco may be adjusted based on employee
  location. The total compensation package may include
  benefits, equity-based compensation, and eligibility for a
  company bonus or variable pay program depending on the role.
  Your recruiter can share more details during the hiring
  process.

  #LI-DNI

  Disclosures:

  - Privacy: Please review our Job Applicant Privacy Policy for
    more information on how we handle your data.
  - Equal Opportunity: Vercel is committed to fostering and
    empowering an inclusive community within our organization.
    We do not discriminate on the basis of race, religion,
    color, gender expression or identity, sexual orientation,
    national origin, citizenship, age, marital status, veteran
    status, disability status, or any other characteristic
    protected by law. Vercel encourages everyone to apply for
    our available positions, even if they don't necessarily
    check every box on the job description.
