description: |
  About us: Blue Rose Research builds data and AI tools that
  help Democrats win elections and advance progressive causes.
  We forecast races, test ads at scale, and use AI to track
  what's breaking in the news, then help campaigns respond
  fast with messages that actually move voters. Our work has
  guided how hundreds of millions of dollars are spent by the
  country's top campaigns and progressive organizations. We're
  a small, mission-driven team of engineers, data scientists,
  and political strategists who build fast, experiment boldly,
  and care deeply about using technology for good.

  Software Engineer (LLM Products) The 2028 cycle starts the
  day after the midterms, and a wide-open Democratic
  presidential primary will begin almost immediately. With a
  crowded field and a fragmented media environment, campaigns
  will need to understand what's reaching and persuading
  voters faster than ever, and our tools will be at the center
  of that work from the first days of the primary through the
  general election.

  We're hiring a product-focused engineer to help build a new
  generation of AI-powered products: conversational
  interfaces, autonomous research agents, and tools that turn
  large amounts of data into information a person can act on
  in seconds. You’ll be talking to internal and external users
  to understand their goals. You’ll be working with our
  political research team to understand how they develop
  strategic guidance. You’ll turn that into product ideas, UX
  designs, and production code. This role is for a builder-
  designer who is just as comfortable in Figma as in a
  codebase. You'll be joining at the start of the cycle, with
  time to build systems that are ready before the pressure
  peaks rather than scrambling to catch up.

  You will:

  - Design and build end-to-end features for products where an
    agent and humans are working together.
  - Build products that present AI-generated output,
    uncertainty, and citations in a way people actually trust.
  - Work closely with political researchers, data scientists,
    and other engineers to turn ambiguous problems into
    simple, usable software.
  - Use AI tools and coding agents to move fast, and know when a
    slicker interface actually matters versus when it’s polish
    nobody needs.
  - Talk to users and internal stakeholders to understand what’s
    confusing, slow, or untrustworthy about existing tools,
    and fix it.
  - Dive head first into the world of political strategy to
    build systems that encode a deep understanding of the
    user’s goals and thought processes.

  Our ideal candidate likely:

  - Has 6+ years of experience as a product engineer, full-stack
    engineer, or designer-engineer hybrid, with a portfolio of
    shipped products you can point to.
  - Has strong product and UX instincts: you can critique a
    flow, sketch an alternative, and explain the tradeoff in
    plain language.
  - Is comfortable using coding agents to build quickly, but
    without compromising quality.
  - Has hands-on experience building products on top of LLMs:
    chat interfaces, agents, retrieval-augmented tools.
  - Understand how to use human annotations efficiently to
    encode human expertise into AI systems.
  - Has an eye for visual and interaction design; familiarity
    with tools like Figma is a plus.
  - Is energized by ambiguous problems.
  - Is motivated by Blue Rose Research’s mission and interested
    in learning the progressive political ecosystem. Prior
    political or civic-tech experience is welcome but not
    required.

  Join us!

  We are a remote-first company with an office in NYC and
  regular team meetups. We primarily work East Coast hours.

  The salary range for this position is $110,000 - $210,000
  annually, commensurate with experience.

  We offer medical, dental, vision, 401k match, 20 weeks paid
  parental leave, fertility and family-building support
  through Maven Clinic, and unlimited PTO.

  You don't need to meet every qualification to apply. We
  welcome applicants from all backgrounds.

  Candidates must be authorized to work lawfully in the United
  States.
