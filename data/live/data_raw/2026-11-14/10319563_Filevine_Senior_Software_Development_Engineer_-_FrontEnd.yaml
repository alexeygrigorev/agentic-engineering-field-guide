description: |
  Filevine is a Legal AI company delivering Legal Operating
  Intelligence for the future of legal work. Grounded in a
  singular system of truth, Filevine brings together data,
  documents, workflows, and teams into one unified
  platform—where modern legal work happens with clarity and
  consistency.



  Powered by LOIS, the Legal Operating Intelligence System,
  Filevine connects context across every matter to transform
  legal operations from reactive to proactive. LOIS reads,
  understands, and reasons across your data to surface
  insight, automate complexity, and give professionals the
  clarity and confidence to see more, know more, and do more.
  Fueled by a team of exceptional collaborators and
  innovators, Filevine’s rapid growth has earned AI awards and
  recognition from Deloitte and Inc. as one of the most
  innovative and fastest-growing technology companies in the
  country.

  Responsibilities

  - Developing web based applications
  - Performing day to day maintenance and support of all
    existing applications in use at Filevine
  - Preserving and optimizing the quality of the software
  - Innovating and improving on the software, features,
    processes, and technology
  - Analyzing, troubleshooting, and fixing issues and bugs as
    they arise
  - Performing detailed and helpful code reviews
  - Work within assigned team to complete duties as assigned,
    while mentoring, training, and reviewing more junior
    engineers
  - Be part of an on-call rotation with other team members to
    provide escalated emergency support
  - Communicate frequently, clearly, and effectively with
    various technical and management audiences
  - Analyze and improve the scalability and performance of high-
    volume, information rich web applications.

  Qualifications

  - 7-10+ years working as a software engineer with a proven
    track record of creating value for businesses
  - Expert in efficiently coding with JavaScript or Typescript
    and possibly other Fornt End focused languages
  - Deep understanding of the web platform and web standards.
    (HTML, CSS, and JS)
  - Expertise with mobile-first responsive design.
  - Ability to build complex web UI's with and without JS
    frameworks and libraries.
  - General ability to turn Figma designs to markup
  - Experience building and maintaining style guides & pattern
    libraries.
  - Experience with accessibility standards & implementation.
  - Experience with JS frameworks & build tooling. (e.g. Svelte,
    gulp, etc.)

  Compensation Information: $160,000 - $210,000





  The base salary range represents the low and high end of the
  salary range for this position. The total compensation
  package for this position will be determined by each
  individual’s location, qualifications, education, work
  experience, skills and performance. We believe in the
  importance of pay equity - the range listed is just one
  component of Filevine’s total compensation package for
  employees. Other rewards may include commissions, stock
  options, a paid time off policy, as well as a comprehensive
  benefits package, including medical, dental, and vision.







