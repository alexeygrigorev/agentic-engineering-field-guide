title: Engineering Manager, Infrastructure and Agentic Platform
company: DeepScribe
location: USA
remote: true
work_type: FULL_TIME
company_size: 272 Employees
description: |
  About DeepScribe

  We're on a mission to reduce administrative burden on
  clinicians pre, post, and during the visit. By integrating
  AI agents seamlessly into practitioner workflows, we create
  space for them to focus on what matters: patient care.

  As a rapidly growing healthcare AI company, we face a unique
  challenge: building reliable, secure, and compliant
  infrastructure while leveraging AI to accelerate our team’s
  impact. This is where you come in.

  The Role

  We're looking for a hands-on engineering manager to lead our
  small Infrastructure and Agentic Platform team. This is a
  player-coach role (50/50 split) where you'll spend half of
  your time building software using the latest agentic tools,
  and half the time empowering your team to do their best
  work. To facilitate this balance, your team will remain
  reasonably small and senior.

  You'll own the foundation that our entire engineering
  organization builds on: from AWS-based infrastructure and
  security to the agentic tools that help us ship faster
  safely.

  You'll continuously evaluate cutting-edge software
  development practices and apply what fits DeepScribe's
  specific needs. Your role is to implement transformative
  tools while filtering out hype.

  What You'll Do

  Lead and grow a high-impact team

  - Manage and mentor a fairly senior team of 2-5 engineers,
    setting them up for success through planning, coaching,
    and technical guidance.
  - Establish hiring practices and grow the team as needed.
  - Foster a culture of excellence, ownership, and continuous
    learning.

  Build reliable foundations for rapid scaling

  - Own AWS infrastructure and data platform for a fast-growing
    healthcare AI product.
  - Lead efforts to strengthen our security and compliance
    posture (SOC2, HIPAA).
  - Establish engineering best practices that accelerate
    delivery while providing reliability that healthcare
    providers and patients have come to depend on every day.

  Define AI-native engineering workflows

  - Help build a “Software Factory” for DeepScribe by enabling
    tools and processes that help engineers iterate on the
    SDLC faster: planning, coding, testing, monitoring, and
    triaging.
  - Own the team roadmap - decide what to build and why. Weigh
    reliability, cost, and velocity to pragmatically
    prioritize investments.
  - Strike a balance between AI acceleration and engineering
    craft.

  Who You Are

  Required:

  - 6+ years of software engineering experience, with a strong
    foundation in system design, agentic workflows, or DevOps.
  - 1+ year of engineering management experience – you've led
    people, not just projects, and you’ve seen the impact of
    your decisions months down the line.
  - AWS expertise – you're comfortable designing and operating
    production systems on AWS
  - Experience with Software Factory concepts – you're familiar
    with agentic loops, MCPs, and orchestrators. You're
    excited about AI's potential but understand its
    limitations.

  You'll thrive here if you:

  - Thrive with autonomy. You can set direction, manage
    competing priorities, and communicate credibly with both
    technical teams and Customer Success.
  - Get energy from generating impact through your own
    contributions, your direct reports, and AI agents.
  - Love collaborating with smart, thoughtful, mission-driven
    engineers. You appreciate the irreplaceable value of great
    people in the age of automation.
  - Want to work on technology that makes a real difference in
    people's lives.

  Nice to Have

  - Experience with passing SOC2 and HIPAA certifications and
    audits.
  - Experience with python, typescript, terraform and AWS.
  - Experience deploying and operating LLMs at scale: evals,
    observability, and cost tracking.
  - Familiarity with the healthcare domain and the challenges
    that it brings.

  Why DeepScribe?

  Mission that matters: Our technology directly improves the
  lives of physicians and their patients. You'll see the
  impact of your work in the real world.

  AI-native culture: We don't just build AI products - we are
  building a future where agents transform how we build.
  You'll help decide what that looks like.

  Exceptional team: Work alongside mission-driven engineers
  who care deeply about craft, impact, and each other.

  Values we live by: Act Like an Owner · Make It Happen Fast ·
  Never Stop Evolving · Care Beyond Expectation

  Perks and benefits

  $180,000 to $240,000 annual salary. Actual compensation will
  be determined based on factors including but not limited to
  experience, education, skill level, location, and internal
  equity, and may vary from the posted range.

  Meaningful equity stake in the company

  Flexible PTO

  Work from home stipend

  Medical, Dental, Vision, 401K and other benefits are also
  offered

  About the Team

  At DeepScribe, we value trust, teamwork, and transparency,
  and we’re dedicated to promoting diversity and equity in the
  workforce through inclusive hiring practices. Candidates
  with backgrounds that are underrepresented in the technology
  industry are encouraged to apply.

  In compliance with federal law, all persons hired will be
  required to verify identity and eligibility to work in the
  United States and to complete the required eligibility
  verification form upon hire.

  We’re excited to connect with people who feel inspired by
  our mission to transform medical documentation with AI. As
  part of your application, we ask you to briefly tell us why
  you want to work at DeepScribe. Applications without a
  thoughtful response may not be considered.

  How to use AI during our hiring process

  - When applying: create the first draft of your resume
    yourself, but it’s OK to use AI to help you polish it
  - While preparing: use AI to research DeepScribe, practice
    your answers, or prepare questions for us
  - During live interviews: no AI assistance of any kind unless
    we indicate otherwise. We want to see how you think,
    approach problems, and work through challenges in real
    time.
