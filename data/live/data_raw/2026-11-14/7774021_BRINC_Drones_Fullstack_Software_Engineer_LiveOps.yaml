description: |
  About BRINC:

  At BRINC, we are building the technology that will define
  the future of emergency response. As a vertically integrated
  U.S. drone technology company, BRINC designs and
  manufactures unmanned aircraft systems, autonomous drone
  stations, command-and-control software, and advanced
  autonomy for public safety. Today, BRINC deploys Drone as
  First Responder (DFR) networks that dispatch drones directly
  to 911 calls, providing real-time aerial intelligence before
  ground units arrive and helping first responders make
  faster, safer decisions. BRINC serves more than 1,000 public
  safety customers across all 50 states, is the sole drone
  supplier to Motorola Solutions, and has raised more than
  $280 million from leading strategic and technology
  investors, including Motorola Solutions, Index Ventures, Sam
  Altman, Dylan Field, and others. BRINC is recruiting
  exceptional engineers to build the next generation of
  autonomous emergency-response technology, including flight-
  critical firmware and advanced pilot-assistance
  capabilities.

  About this Role:

  We’re seeking a Senior or Principal full stack engineers to
  help lead development and deployment of life saving
  technologies to public safety. This role will involve
  getting the opportunity to scope out new products, take them
  through to customer deployment, and iterate continuously
  based on customer feedback. While developing products,
  you’ll also get to work with all other disciplines of
  engineering in Brinc to help drive a market leading product.
  Brinc offers industry leading web applications to deploy
  drones to 911 calls all around the country, and strives to
  be an industry leader.

  LiveOps is a flagship product at the center of BRINC’s core
  mission and Drone as First Responder (DFR) mission. Our aim
  is to revolutionize public safety with state of the art
  software that is expected to perform and serve communities
  in a variety of high stakes situations. We are a Cloud
  Native team, building a suite of Web Applications and tools
  that enable our pilots to deploy and manage their fleet from
  anywhere.

  We’re a small team, seeking motivated and collaborative
  engineers with a Founder’s mindset. We believe in involving
  our Customers in a tight loop, so a strong Product focus is
  essential.

  Qualifications:

  - Bachelors in Computer Science or related field. Note - we
    are considering candidates for mid-career, senior, and
    principal positions.
  - 5+ years of experience developing feature-rich Web
    Applications on top of industry standard stacks (MERN,
    MEAN, LAMP or equivalent).
  - Strong background in RESTful or microservice oriented
    development.
  - Ability to navigate ambiguous technical or product
    requirements and deliver quality software in a fast-paced
    environment.
  - Fluency in NodeJS, JavaScript or equivalent Front-end/Server
    framework.
  - Excellent collaboration skills, ability to work cross-
    functionally on lean teams.
  - Proficiency in building data-intensive applications using
    SQL and NoSQL databases.

  Preferred Skills:

  - Developing scalable and fault tolerance Cloud Native
    software (using serverless, or equivalent technologies).
  - Masters or PhD in ComputerScience or related field
  - Experience with encrypted data
  - Building high performance software across a wide spectrum of
    degraded network conditions.
  - Serving realtime latency video, using RTSP, WebRTC or
    similar technologies.
  - Delivering production grade software following industry
    standard compliance regulations (SOC2, CJIS, ISO).
  - Familiarity with building Geo-spatially aware software
    (Google Maps, Mapbox, etc).
  - Experience with Edge or IoT enabled devices.

  BRINC Culture Values:

  - Try the hard stuff
  - Be innovative - Invent the future
  - Move fast
  - Listen to end-users
  - Strive for excellence
  - Don’t build a dystopia
  - Be frugal
  - Save lives through technology

  If you’re interested in this role and in joining BRINC, we
  hope you’ll apply. We’d love to review your application and
  get to know more about you!

  BRINC is proud to be an equal opportunity employer that is
  resolute in cultivating an environment that promotes safety,
  diversity, inclusion and equity. We’re committed to hiring
  the best talent — regardless of race, creed, color,
  ancestry, religion, sex (including pregnancy), national
  origin, sexual orientation, age, citizenship status, marital
  status, disability, gender identity, genetic information,
  veteran status, or any other characteristic protected by
  applicable laws, regulations and ordinances — and empowering
  every employee so they can do their best work. If you have a
  disability or special need, please let our recruiting team
  know - we strive to provide appropriate accommodation and
  assistance.

  Benefits and perks listed below may vary based on the nature
  of your employment with BRINC and/or the country within
  which you work

  - Comprehensive medical, dental and vision plans for our
    employees and their families
  - 401K plan
  - Maternity and paternity leave
  - Flexible Time Off (Exempt) / Paid time off (Non-Exempt)
  - Flexible work environment
  - Orca pass (for those in Puget Sound)
  - Free snacks, drinks and espresso (Seattle office)
