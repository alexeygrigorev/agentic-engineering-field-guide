description: |
  Senior Engineering Manager — News Engineering @ LSEG

  Help us shape the future of real-time news delivery and join
  a team powering the heartbeat of global information!  LSEG’s
  News Engineering group is looking for a Senior Engineering
  Manager to evolve our News platform, delivering enriched,
  structured breaking news with metadata, entities, and
  context to customers worldwide in sub‑second time.  If
  you're motivated by high-performance systems, real-world
  impact, and incorporating modern engineering practices in a
  dynamic and forward-thinking environment — this is your
  opportunity.

  This role is ideal for an experienced engineering manager
  who combines strong people leadership, hands‑on technical
  credibility, and sound execution judgment.  You will partner
  closely with product, architecture, and other engineering
  leaders to deliver reliable outcomes while evolving a
  content‑ and data‑driven news platform sustainably.

  As a senior engineering manager in the News team at LSEG,
  you will be accountable for delivery, quality, reliability,
  and operational outcomes across one or more News Engineering
  squads responsible for content enrichment and real‑time
  delivery.  You’ll hire, onboard, and develop engineers at
  varying levels, building high‑performing, inclusive teams.
  Coach engineers through regular feedback, career
  development, and performance management.  Foster a culture
  of ownership, accountability, learning, and continuous
  improvement.  Create an environment where on‑call and
  operational responsibilities are sustainable and
  well‑engineered, not hero‑driven.

  As a technical leader, you’ll be hands-on in design and
  problem‑solving, guiding implementation decisions without
  being the primary implementer.  Review and challenge designs
  to ensure performance, reliability, correctness, and
  operability standards are met, particularly for content
  processing and NLP‑driven enrichment systems.  Support
  engineers in making pragmatic tradeoffs between speed,
  quality, and long‑term health.  Ensure teams apply modern
  engineering practices to content‑centric systems, including
  automated testing of NLP pipelines, observability of data
  quality and model behavior, and CI/CD for both code and
  content processing.  Guide effective, responsible use of
  AI‑assisted development and content intelligence tools to
  improve productivity and code quality.

  Technical Skills We’re Looking For

  - Solid technical background in backend or platform
    engineering (e.g. Java, Python, Linux environments)
  - Experience managing teams delivering distributed, real‑time,
    or high‑availability systems
  - Solid understanding of low‑latency architectures and
    operational considerations
  - Familiarity with modern DevOps practices (CI/CD, containers,
    cloud infrastructure)
  - Experience using and guiding teams in the adoption of
    AI‑assisted development tools (e.g. GitHub Copilot)
  - Experience with news or content‑driven systems, including
    text processing, metadata enrichment, entity extraction,
    classification, or other applied NLP techniques
  - Strong communication skills, especially around design
    decisions, risks, and tradeoffs

  Why Join Us?

  - Impact: Your work helps deliver critical news to financial
    professionals in real-time.
  - Growth: Learn from expert engineers and expand your skills
    across cloud, data, and resilient systems.
  - Culture: We value curiosity over dogma, ownership over
    handoffs, and pragmatism over perfection. You’ll work in a
    globally distributed team that supports each other.
  - Flexibility: Hybrid work options and a balanced work-life
    environment.

  Career Stage:

  Manager

  Compensation/Benefits Information:

  LSEG is committed to offering competitive Compensation and
  Benefits. The anticipated base salary for this position is
  $147,500 - $245,900.

  Please be aware base salary ranges may vary by geographic
  location, city and state. In addition to our offered base
  salary, this role is eligible for our Annual Incentive Plan
  (AIP/”bonus plan”). Target AIP rates will be commensurate
  with role level and posted career stage. Individual salary
  will be reflective of job related knowledge, skills and
  equivalent experience. LSEG roles (excluding internships and
  part-time roles of less than 20 hours per week) are
  typically eligible for inclusion in our LSEG Benefits
  program, which includes offerings of: Annual Wellness
  Allowance, Paid time-off, Medical, Dental, Vision, Flex
  Spending & Health Savings Options, Prescription Drug plan,
  401(K) Savings Plan and Company match. LSEG’s Benefits plan
  also includes basic life insurance, disability benefits,
  emergency backup dependent care, adoption assistance
  commuter assistance etc.

  London Stock Exchange Group (LSEG) Information:

  Join us and be part of a team that values innovation,
  quality, and continuous improvement. If you're ready to take
  your career to the next level and make a significant impact,
  we'd love to hear from you.

  LSEG is a leading global financial markets infrastructure
  and data provider. Our purpose is driving financial
  stability, empowering economies and enabling customers to
  create sustainable growth.

  Our purpose is the foundation on which our culture is built.
  Our values of Integrity, Partnership, Excellence and Change
  underpin our purpose and set the standard for everything we
  do, every day. They go to the heart of who we are and guide
  our decision making and everyday actions.

  Working with us means that you will be part of a dynamic
  organisation of 25,000 people across 65 countries. However,
  we will value your individuality and enable you to bring
  your true self to work so you can help enrich our diverse
  workforce.

  We are proud to be an equal opportunities employer. This
  means that we do not discriminate on the basis of anyone’s
  race, religion, colour, national origin, gender, sexual
  orientation, gender identity, gender expression, age,
  marital status, veteran status, pregnancy or disability, or
  any other basis protected under applicable law. Conforming
  with applicable law, we can reasonably accommodate
  applicants' and employees' religious practices and beliefs,
  as well as mental health or physical disability needs.

  You will be part of a collaborative and creative culture
  where we encourage new ideas. We are committed to
  sustainability across our global business and we are proud
  to partner with our customers to help them meet their
  sustainability objectives. Our charity, the LSEG Foundation
  provides charitable grants to community groups that help
  people access economic opportunities and build a secure
  future with financial independence. Colleagues can get
  involved through fundraising and volunteering.

  LSEG offers a range of tailored benefits and support,
  including healthcare, retirement planning, paid volunteering
  days and wellbeing initiatives.

