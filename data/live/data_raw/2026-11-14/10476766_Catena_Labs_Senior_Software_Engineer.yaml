description: |
  SENIOR SOFTWARE ENGINEER

  As a Senior Software Engineer at Catena, you will be a core
  contributor to the team inventing new ways for humans and AI
  agents to interact with financial systems. You will play a
  critical role in developing and iterating on our core
  platform, including the Agent Commerce Kit (ACK), building
  the applications, APIs, and SDKs that facilitate secure,
  reliable global commerce for a new, agent-driven economy.

  This is an opportunity to solve novel technical challenges
  at the intersection of AI and finance. You will work in a
  highly collaborative environment, shipping code that
  directly impacts our product and helps define the future of
  how autonomous agents transact.

  WHAT YOU’LL DO

  - Build Agent Interaction Layers: Develop robust applications,
    APIs, and SDKs that enable secure communication,
    collaboration, and transactions between AI agents and
    users.
  - Develop Core Product Experiences: Build elegant and
    efficient systems to handle cryptographic identity
    management, payment workflows, and transaction processing
    within the ACK framework.
  - Engineer Agent-Native Financial Systems: Design and
    implement end-to-end user experiences tailored for AI
    agents, ensuring secure and reliable financial
    interactions.
  - Create Identity and Reputation Tools: Engineer systems that
    empower agents to establish digital identities, discover
    peers, and manage their reputations effectively.
  - Contribute to Scalable Infrastructure: Build performant
    backend services and scalable APIs that ensure rapid and
    secure coordination among decentralized AI agents.

  WHAT YOU’LL BRING

  - You have 6+ years of full stack engineering experience, with
    a strong foundation in backend architecture as well as
    experience delivering user-facing products.
  - You have a track record of shipping complex production-
    quality products from initial concept to production.
  - You are committed to building performant, reliable, and
    secure systems with polished and intuitive user
    experiences.
  - You are comfortable working in ambiguous environments,
    capable of independently designing and implementing
    technical solutions from the ground up.
  - You have a genuine curiosity for emerging technologies like
    AI agents, stablecoins, and programmable identity, with
    desire and self-initiative to learn and apply them.
  - You effectively leverage AI tools in your workflow to
    multiply productivity and streamline development
    processes.

  NICE TO HAVE

  - Hands-on experience building AI-driven solutions or
    integrating with modern AI toolkits.
  - Experience in fintech, payments, or blockchain development.
  - Proficiency with our tech stack (e.g., Python, TypeScript,
    Go, React).
  - Contributions to relevant open-source projects.

  JOIN US

  If you're passionate about pushing the boundaries of what AI
  agents can do in financial services and want to be part of
  building the trusted financial infrastructure for the
  agentic economy, we want to hear from you. You'll have the
  opportunity to work on challenging problems that have never
  been solved before, with a team that's defining an entirely
  new category of financial services.

  This is more than a job; it's a chance to be part of the
  startup team that makes the AI economy possible. Your work
  will directly enable millions of AI agents to participate
  safely in commerce, unlocking trillions in economic value
  and increasing prosperity around the world.
