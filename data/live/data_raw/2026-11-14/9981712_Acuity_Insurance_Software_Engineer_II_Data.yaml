description: |
  Acuity is seeking a Software Engineer II to design, build,
  and maintain software applications that support Acuity’s
  business operations. This role leverages modern programming
  languages and frameworks to deliver secure, efficient, and
  user-focused solutions. Working closely with engineers,
  business analysts, and cross-functional teams in an agile
  environment, the Software Engineer II follows best practices
  to ensure timely, high-quality software delivery.
  Responsibilities include troubleshooting production issues,
  providing technical support, and serving as a resource to
  fellow engineers through guidance and mentorship. The role
  also contributes to system improvements, code quality, and
  technical innovation across development teams.



  ESSENTIAL FUNCTIONS:

  - Collaborate with other software engineers, business analysts
    and stakeholders to understand user needs and translate
    them into effective software solutions.
  - Maintain integrity and excellence in your work. Proactively
    seeking out and offering candid, constructive feedback,
    delivered with professionalism and empathy, to foster
    continuous learning and development for myself and my
    colleagues.
  - Enhance and maintain software applications by resolving
    bugs, rolling out new features, and optimizing
    performance.
  - Contribute to the planning and scoping of project work by
    providing input on effort estimation, development
    timelines, and deliverables.
  - Write clean, scalable, and maintainable code using modern
    frameworks and languages appropriate to the project.
  - Perform testing and debugging to ensure code quality,
    stability, and performance across environments.
  - Produce and maintain thorough documentation – from technical
    specifications and system diagrams to end-user guides.
  - Recognize and correct inefficiencies and errors in the
    specifications, code, and implementation of software
    solutions.
  - Periodically mentor other software engineers on software
    development concepts, practices, and procedures.
  - Demonstrate an understanding of your team’s data ecosystem
    and proactively leverage this knowledge to enhance
    application functionality and inform design decisions.
  - Identify and develop solutions to moderately complex
    software engineering tasks and problems.
  - Participate in the nightly call list for problem resolution.
  - Participate in regular and predictable attendance and
    complete mandatory training programs as determined by
    Acuity.
  - Perform other duties as assigned.

  EDUCATION:

  Bachelor’s degree or equivalent of education and experience
  in software engineering, computer science or related field

  EXPERIENCE:

  A software engineer with 2-5 years of experience in data
  warehousing, preferably in the insurance industry, will
  generally demonstrate the skills set forth in this job
  description.

  OTHER QUALIFICATIONS:

  - Proficient in a range of tools and technologies, including:
    - Languages: Java, C#, Python, JavaScript, or COBOL, etc.
    - Relational or non-relational databases and related tools,
      such as Db2, MySQL, MongoDB, PostgreSQL, Microsoft SQL
      Server, DataStage, Erwin, etc.
    - Familiarity with ETL/ELT and Data Pipeline Tools like IBM
      DataStage, FiveTran, Informatica PowerCenter, etc.
    - Version control tools, such as Git
    - Testing tools and frameworks, such as JUnit, Bruno, Postman,
      MettleCI
  - Strong analytical thinker with the ability to break down
    moderately complex problems and identify practical
    solutions.
  - Excellent communicator and team player, skilled at working
    with cross-functional teams.
  - Capable of undertaking development tasks with limited
    guidance from senior software engineers.
  - Proficient in creating and updating documentation, test
    plans, and disaster recovery procedures.
  - Passion for delivering high-quality and reliable results.



  *Acuity does not sponsor applicants for U.S. work
  authorization.*



  This job is classified as exempt.



  The salary range for this position is $90,000-$115,000
  annually. This salary range is an estimate, and the actual
  salary will vary based on applicant’s education, experience,
  knowledge, skills, and abilities.



  For this role, Acuity offers a comprehensive benefits
  package, including a generous 401(k) contribution, medical,
  dental, vision, life and disability insurance, paid time
  off, an Employee Assistance Program, and more. A full
  description of benefits and eligibility will be provided to
  candidates during the hiring process.



