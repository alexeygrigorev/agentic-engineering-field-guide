description: |
  SpaceX was founded under the belief that a future where
  humanity is out exploring the stars is fundamentally more
  exciting than one where we are not. Today, SpaceX is
  actively developing the technologies to make this possible,
  with the ultimate goal of making life multiplanetary and
  expanding consciousness to the stars. SpaceXSI is building
  Super Intelligence to help humanity understand the universe.
  Our teams are building the full Super Intelligence stack:
  from our Colossus supercomputers, to Grok models, to our
  suite of applications, including Grok Bot, Grok Build, Grok
  Imagine, Grok Voice, and X. We're creating a powerful
  flywheel where more compute trains better models, better
  models power more useful products, and what we learn from
  people using those products shapes what we build next.

  SOFTWARE ENGINEER, VOICE PRODUCT

  The Grok Voice Product team builds seamless, world-class
  voice experiences for Grok across every platform and product
  surface. In this role, you will be responsible for
  designing, building, and shipping voice features across all
  surfaces. You will have the opportunity to collaborate
  across iOS, Android, and all product groups.

  RESPONSIBILITIES:

  - Own backend engineering for scalable, low-latency voice
    infrastructure and model integrations
  - Collaborate directly with Grok Voice model, media, and
    product teams to deliver end-to-end experiences
  - Drive performance, reliability, and quality of voice
    interactions at global scale
  - Move fast across platforms and product groups as a
    generalist

  BASIC QUALIFICATIONS:

  - 2+ years of professional software engineering experience
    building and shipping user-facing products

  PREFERRED SKILLS AND EXPERIENCE:

  - Proficiency in Python or Rust, with a strong track record of
    writing clean, efficient, maintainable, and scalable code
  - Background in AI-driven consumer products or media
    generation technologies
  - Track record collaborating across engineering, research, and
    product teams to ship delightful features quickly
  - Deep interest in voice/audio AI
  - Hands-on experience shipping features on iOS and/or Android
  - The ability to work across all product groups and do
    whatever it takes for best user experience

  ADDITIONAL REQUIREMENTS:

  - Onsite role: must be able to work in person at our office
    locations in Palo Alto, San Francisco, or New York

  COMPENSATION AND BENEFITS:

  $140,000 - $225,000 USD

  Base salary is just one part of our total rewards package at
  SpaceXSI, which also includes equity, comprehensive medical,
  vision, and dental coverage, access to a 401(k) retirement
  plan, short & long-term disability insurance, life
  insurance, and various other discounts and perks.

  SpaceXSI is an equal opportunity employer. For details on
  data processing, view our Recruitment Privacy Notice.
