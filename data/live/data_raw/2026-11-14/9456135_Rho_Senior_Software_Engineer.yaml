description: |
  About Us

  Rho is the modern banking platform built for the AI era.
  Startups and growth-stage companies can open accounts in
  minutes, issue cards, manage expenses, pay bills, and close
  the books – all in one connected platform backed by real
  human support.

  About the Role

  As a Senior Software Engineer at Rho, you'll build the
  financial infrastructure powering the next generation of
  founders. This isn't a role where you sit inside a lane.
  You'll move across the stack, own problems end-to-end, and
  talk directly to the customers using what you ship. We're
  hiring engineers who are restless about impact, reach for AI
  tools the way other people reach for documentation, and
  genuinely want to understand why what they're building
  matters.

  What You'll Do

  - Own problems from scoping to production. Write the code,
    ship it, watch it land.
  - Work across the stack. You go where the problem is, not
    where your comfort zone ends.
  - Talk to customers. Sit in on calls, read support tickets,
    watch session replays. Build what people actually need.
  - Use AI in your daily workflow. Code generation, debugging,
    spec drafting, and spot where it changes what's possible.
  - Move fast and iterate in the open. Get something in front of
    users, then make it better.
  - Pick up what's falling. If something's broken, fix it.

  What We're Looking For

  - 5+ years of software engineering experience in a fast-paced,
    high-growth environment.
  - Genuine full-stack flexibility. You've shipped across the
    stack and don't treat the backend/frontend divide as a
    hard boundary.
  - Genuine AI fluency. You use these tools every day and think
    about where they raise the ceiling on what you can build.
  - A bias to ship. You'd rather get something in front of a
    user than perfect it in a doc.
  - Customer curiosity. You want to know the person on the other
    side of what you're building, and you'll go find out.
  - High agency. You make progress when things are unclear,
    surface problems early, and own your outcomes.

  Compensation & Benefits

  Our people are our most valuable asset. The salary range for
  this role is $170,000 - $270,000. In addition to base pay,
  Rho offers equity, healthcare benefits and paid time off.

  Diversity, empathy and transparency are core values at Rho.
  We are passionate about building and sustaining an inclusive
  and equitable environment for all those involved with our
  mission including employees, contractors, candidates,
  customers and vendors. We believe every member of the Rho
  community enriches our ability to provide a broad range of
  ways to understand and engage with the market, identify
  problems and drive solutions that align with our mission of
  making finance frictionless for business.
