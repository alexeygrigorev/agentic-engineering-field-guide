description: |
  The Performance & Analytics team works on calculating,
  reporting, and effectively presenting performance and
  attribution metrics across investments leveraging modern
  OLAP and Columnar technologies. This includes analysis of
  returns, benchmark comparisons, and the factors contributing
  to performance.

  We are in search of a passionate engineer to take on a
  critical role in evolving our next generation performance &
  analytics platform, aiming to set a new industry standard in
  this domain. Our team is committed to creating a lasting
  impact on the investment management industry, leveraging AI
  and leading development practices to bring transformative
  change.

  At Ridgeline, how we work matters as much as what we build.
  Ridgeliners act like owners, choose growth over comfort, and
  communicate with transparency. We assume positive intent,
  bias toward action, and bring solutions—not just problems.
  We celebrate wins, learn from setbacks, and thrive in a
  resilient, collaborative, high-performing culture. If the
  Ridgeline Way excites you, we’d love to meet you.

  The impact you will make:

  - Contribute design skills and technical expertise to a team
    where design, strategy, and engineering collaborate
    closely
  - Be involved in the entire software development process, from
    requirements and design reviews through implementation
  - Impact a developing tech stack based on AWS back-end
    services
  - Participate in the creation and construction of developer-
    based automation that leads to scalable, high-quality
    applications customers will depend on to run their
    businesses
  - Think creatively, own problems, seek solutions, and
    communicate clearly along the way
  - Contribute to a collaborative environment deeply rooted in
    learning, teaching, and transparency

  What we look for:

  - 8+ years in a software engineering position with a history
    of architecting and designing new products and
    technologies
  - Experience with Kotlin or similar programming languages
  - Familiarity working with OLAP or Columnar databases, with
    the capability to optimize queries
  - Understanding of data modeling for analytical use cases
  - Interest in running complex analytics over a large scale of
    data quickly
  - Experience building cloud native applications on
    AWS/Azure/Google Cloud
  - A degree in Computer Science, Information Science, or a
    related discipline
  - Willingness to learn about new technologies while
    simultaneously developing expertise in a business
    domain/problem space
  - Understand the value of automated tests at all levels
  - Ability to focus on short-term deliverables while
    maintaining a big-picture long term perspective
  - An aptitude for complex problem-solving
  - Ability to communicate with colleagues at all levels
  - Serious interest in having fun at work

  Bonus:

  - Buy-side technology experience
  - Experience with GitHub Copilot or ChatGPT
  - Experience with ETL Pipelines that move data into OLAP
    systems
  - Familiar with performance concepts and methodologies: TWR,
    Brinson Attribution, Profit and Loss

  About Ridgeline

  Ridgeline is the industry cloud platform for investment
  management. It was founded by visionary tech entrepreneur
  Dave Duffield (co-founder of both PeopleSoft and Workday) to
  apply his successful formula of solving operational business
  challenges with bold innovation and human connectivity to
  the unique needs of the investment management industry.

  Ridgeline started with a clean sheet of paper and a deep
  bench of experts bound by a set of core values and motivated
  to revolutionize an industry underserved by its current tech
  offerings. We are building a new, modern platform in the
  public cloud, purpose-built for the investment management
  industry and we are prioritizing security, agility, and
  usability to empower business like never before.

  With a growing campus in Reno and offices in New York, Lake
  Tahoe, and the Bay Area, Ridgeline is proud to have built a
  fast-growing, people-first company that has been recognized
  by Fast Company as a “Best Workplace for Innovators,” by The
  Software Report as a “Top 100 Software Company,” and by
  Forbes as one of “America’s Best Startup Employers.”

  Ridgeline is proud to be a community-minded, discrimination-
  free equal opportunity workplace.

  Ridgeline processes the information you submit in connection
  with your application in accordance with the Ridgeline
  Candidate Privacy Policy. Please review the Ridgeline
  Candidate Privacy Policy in full to understand our privacy
  practices and contact us with any questions.

  This posting is for an existing vacancy.

  Compensation and Benefits

  The typical starting salary range for this role is:
  $200,500-$251,000.

  Final compensation amounts are determined by multiple
  factors, including candidate experience and expertise, and
  may vary from the amount listed above.

  As an employee at Ridgeline, you’ll have many opportunities
  for advancement in your career and can make a true impact on
  the product.

  In addition to the base salary, 100% of Ridgeline employees
  can participate in our Company Stock Plan subject to the
  applicable Stock Option Agreement. We also offer rich
  benefits that reflect the kind of organization we want to
  be: one in which our employees feel valued and are inspired
  to bring their best selves to work. These include unlimited
  vacation, educational and wellness reimbursements, and $0
  cost employee insurance plans. Please check out our Careers
  page for a more comprehensive overview of our perks and
  benefits.

