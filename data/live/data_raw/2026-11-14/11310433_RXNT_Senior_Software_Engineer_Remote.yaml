description: |
  The Opportunity: Startup Agility, 26-Year Stability

  At RXNT, we offer a rare engineering environment: the lean,
  fast, and iterative velocity of a mission-driven startup,
  backed by our stability as a 26-year-old industry leader. We
  serve as the digital backbone of the U.S. healthcare system,
  empowering healthcare professionals to deliver better
  patient care when it matters most.

  We are not here to maintain the status quo. The healthcare
  landscape is evolving rapidly, demanding platforms that are
  performant, highly secure, and deeply intelligent. We are
  aggressively modernizing our core cloud-based applications
  and building advanced, AI-native clinical products from the
  ground up. You will tackle complex data workflows, engineer
  high-availability systems, and solve deep architectural
  challenges that securely transform unstructured information
  into trustworthy clinical data and actions, helping the
  healthcare providers focus on what matters the most, the
  patient.

  Transforming healthcare is both a profound privilege and a
  serious responsibility. It requires us to uphold the highest
  technical standards, think with rigor, and move with extreme
  urgency because patients’ health and their care process
  depend on it. If you are an engineer who high-stakes teams
  and projects rely on and looking for true end-to-end
  ownership, where your architectural decisions have an
  immediate, real-world impact without the bureaucratic red
  tape, this is where you belong.

  What True Ownership Looks Like Here

  - Own the End-to-End Outcome: You won't just be handed a
    ticket to code; you will own the entire lifecycle of
    complex technical challenges from initial architecture to
    deployment and monitoring. You will operate with the lean,
    iterative speed of a startup, delivering features that
    directly impact the U.S. healthcare ecosystem.
  - Architect Advanced AI-Native Solutions: Rather than simply
    consuming AI as a tool, you will build and integrate the
    foundational agents, services, and infrastructure that
    power our intelligent clinical products. You will solve
    deep architectural problems to securely transform
    unstructured data into reliable, scalable solutions for
    the healthcare industry.
  - Engineer for Uncompromising Reliability: Because our
    platform supports healthcare providers when it matters
    most, our standards for system health are absolute. You
    will independently design, test, and scale high-
    availability systems, aggressively modernizing core
    applications and eliminating structural inefficiencies.
  - Drive Delivery and Close the Gaps: You will work in harmony
    with product and engineering teams to shape raw, undefined
    problems into precise, scalable solutions. We expect you
    to proactively identify bottlenecks, close every technical
    loop, and mentor peers to continuously elevate the team's
    engineering bar.

  The Mindset & DNA We Need

  - Relentless Attention to Detail: You obsess over accuracy and
    precision. You have a disciplined habit of closing all
    loops and gaps, ensuring absolutely nothing falls through
    the cracks when building systems that patients and
    providers rely on.
  - Objective & Ego-Free: You thrive in a culture rooted in
    openness and respect. You are highly comfortable giving
    and receiving direct, objective feedback, viewing it as
    the fastest path to technical excellence rather than a
    personal critique.
  - Pragmatic First-Principles Thinking: You comfortably
    navigate ambiguity, moving efficiently to solve complex
    problems without needing your hand held. You break down
    raw problems to their core elements, balancing fast
    execution with the uncompromising reliability required in
    healthtech.
  - Unwaveringly Mission-Focused: Your sense of ownership
    extends beyond the codebase to the ultimate success of the
    product and the company. You keep your eyes fixed on the
    overarching goal, ensuring that every technical decision
    you make directly advances our real-world impact.
  - Continuous Growth: You actively digest the latest
    technologies, engineering practices, and architectural
    patterns. You are a lifelong learner who adapts quickly to
    new challenges and proactively shares your expertise to
    elevate the entire team.

  Key Responsibilities

  - Own the Full Lifecycle: Take a technical challenge from
    ambiguous problem to shipped, monitored solution;
    architecting, building, testing, deploying, and supporting
    it in production without waiting for hand-offs.
  - Build AI-Native Infrastructure: Design and implement the
    agents, services, and APIs that power RXNT's intelligent
    clinical products, integrating AI capabilities as first-
    class architectural components rather than bolt-on
    features.
  - Engineer for High Availability: Design, test, and scale
    backend and frontend systems (microservices, RESTful APIs)
    that meet the reliability bar required for healthcare —
    anticipating edge cases and failure modes before they hit
    production.
  - Modernize Core Systems: Identify structural inefficiencies
    in existing applications and lead their modernization,
    balancing fast iteration with the rigor healthtech
    demands.
  - Instrument for Observability: Set up and rely on
    monitoring/logging (e.g., Datadog, New Relic) to catch
    anomalies early, and build the testing discipline (unit,
    integration) that keeps quality high at speed.
  - Collaborate Across Functions: Partner closely with product,
    design, and clinical stakeholders to turn undefined
    problems into precise, scalable technical solutions.
  - Elevate the Team: Mentor peers, raise the engineering bar
    through code review and technical guidance, and
    proactively close gaps before they become blockers.

  Skills, Knowledge and Expertise

  - Experience: 5+ years of shipping production-grade software
    in complex, high-stakes environments. You possess a deep
    foundation in computer science principles and can
    demonstrate a track record of architecting performant,
    highly scalable web applications, rather than just
    contributing to them.
  - Advanced AI-Native Workflow: You are far past treating AI as
    a simple assistant. You understand the underlying
    mechanics and best practices of modern AI assistants
    (Claude, Copilot) to achieve fast-paced delivery without
    sacrificing an ounce of quality. You don't just throw
    ambiguous problems at an agent; you rigorously structure
    technical plans and specs to guide them effectively,
    ruthlessly verifying the generated code against your own
    high standards.
  - Deep Systems Mastery: Expert-level command of modern backend
    languages (e.g., C#, Node.js, or Python) and frontend
    architectures. You understand the underlying abstractions,
    microservices design, RESTful APIs, and how to structure
    clean, maintainable code.
  - Cloud & Infrastructure Understanding: While we have
    dedicated SREs, you are expected to truly own your
    payloads. You possess strong cloud understanding and are
    ideally familiar with Infrastructure as Code (e.g.,
    Terraform).
  - Observability & Testing: You instrument your code for the
    real world. You have practical expertise with modern
    monitoring and logging tools (e.g., Datadog, New Relic, or
    similar) to track down anomalies before they become
    critical bugs, backed by rigorous unit and integration
    testing.
  - Bonus Qualifications: Previous experience leading complex
    technical projects from 0 to 1, mentoring peers, or a
    background working within the healthcare industry.

  Benefits

  RXNT offers employees access to medical insurance, short and
  long term disability, as well as the potential to earn
  quarterly incentives based on the company's performance.

  About Since 1999, RXNT has developed proven, certified
  healthcare technology for tens of thousands of physicians
  and medical billing professionals. We are an agile
  organization that prides itself on resolving customer
  challenges through collaboration and innovation, leading to
  better patient care. Each team member brings a unique set of
  skills, qualifications, and creativity to their role. But
  it’s the sum of our collective efforts that has propelled
  RXNT to leadership in the medical software industry.Our
  leadership is being noticed; RXNT has been named to Inc.
  Magazine’s list of America’s 5000 Fastest-Growing Private
  Companies multiple years in a row. We have also been
  recognized by organizations like Surescripts, Gartner
  Research, and Digital.com.Reaching Common Goals Together We
  develop technology that helps create a healthier world for
  people of all ages, gender identities, races, ethnicities,
  cultures, religions, sexual orientations, and perspectives.
  To be successful, we need a diverse workforce that
  represents the practices and patients who benefit from our
  software. When you become an RXNT team member, we’ll empower
  you to lean on your experience, skills, diversity, and
  expertise to drive excellence and creativity in every aspect
  of your work. We strive to offer a workplace that fosters
  personal and professional growth. RXNT welcomes your
  uniqueness because we know that’s what stimulates the
  innovation and imaginative problem-solving that helps us
  achieve our goals, and create a better future.
