description: |
  About Care Access

  Care Access is working to make the future of health better
  for all. With hundreds of research locations, mobile
  clinics, and clinicians across the globe, we bring world-
  class research and health services directly to communities
  that often face barriers to care. We are dedicated to
  ensuring that every person has the opportunity to understand
  their health, access the care they need, and contribute to
  the medical breakthroughs of tomorrow.

  With programs like Future of Medicine, which makes advanced
  health screenings and research opportunities accessible to
  communities worldwide, and Difference Makers, which supports
  local leaders to expand their community health and wellbeing
  efforts, we put people at the heart of medical progress.
  Through partnerships, technology, and perseverance, we are
  reimagining how clinical research and health services reach
  the world. Together, we are building a future of health that
  is better and more accessible for all.

  To learn more about Care Access, visit www.CareAccess.com.

  How This Role Makes a Difference

  As a Senior Software Engineer, you will be responsible for
  developing and maintaining modern software products that
  streamline operations at Care Access, unlock massive
  efficiencies, and accelerate the future of clinical
  research. You will work within an experienced and motivated
  cross-functional team using full-stack Typescript to deliver
  experiences that empower and delight our users.

  How You'll Make An Impact

  - Develop full-stack web applications using modern TypeScript
    in a functional-first style.
  - Implement clean, modern, and intuitive UIs that bring Figma
    mockups to life, collaborating closely with product
    designers.
  - Build efficient, scalable, and secure backend APIs in Node
    and PostgreSQL.
  - Collaborate with other engineers on the team through code
    reviews, mentorship, and pairing to maintain a high
    standard for technical excellence and feature delivery.
  - Proactively improve and maintain our codebases to keep
    technical debt low and data models aligned with real-world
    domains.
  - Support our systems in production by executing deployments,
    playing an active role in incident responses, and working
    with DevOps on operational and infrastructure
    improvements.
  - Write and review design documents and lead technical
    discussions on system architecture.
  - Work with QA Engineers to ensure that features are well-
    documented and fully testable.
  - Participate in Agile development methodologies, including
    sprint planning, stand-ups, and retrospectives.

  The Expertise Required

  - Strong proficiency in modern TypeScript, React, and Node.js
  - Experience with functional programming techniques
  - Experience with relational databases, such as PostgreSQL
  - Experience with cloud platforms, such as AWS or Azure
  - Ability to work independently and in a remote-first team
    environment
  - Excellent communication and collaboration skills

  Certifications/Licenses, Education, and Experience

  - Minimum Education:
    - Bachelor's or Master's degree in Computer Science or
      equivalent experience
  - Minimum Experience:
    - At least 6 years of experience in both front-end and back-
      end web development

  How We Work Together

  - Location: Remote within the United States. This role
    requires 100% of work to be performed in a remote office
    environment.
  - Travel: This is a remote position with less than 10% travel
    requirements. Occasional planned travel may be required as
    part of the role.
  - Physical demands associated with this position Include: The
    ability to use keyboards and other computer equipment.

  The expected pay range for this role is $140,000 - $180,000
  USD per year for full time team members.

  Benefits & Perks (US Full Time Employees)

  - Paid Time Off (PTO) and Company Paid Holidays
  - 100% Employer paid medical, dental, and vision insurance
    plan options
  - Health Savings Account and Flexible Spending Accounts
  - Bi-weekly HSA employer contribution
  - Company paid Short-Term Disability and Long-Term Disability
  - 401(k) Retirement Plan, with Company Match



