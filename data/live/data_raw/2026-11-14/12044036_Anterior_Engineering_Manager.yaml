description: |
  About Anterior

  Anterior is on a mission to transform healthcare
  administration, making it seamless and invisible so
  clinicians can focus on delivering care. We've built an AI-
  powered platform designed by clinicians, for clinicians, to
  simplify administrative workflows and improve patient
  outcomes. By combining clinical expertise with cutting-edge
  technology, we're revolutionizing healthcare operations with
  responsible AI.

  We're growing rapidly and are backed by world-class
  investors including Sequoia, New Enterprise Associates
  (NEA), and Neo, along with notable angels including the
  founders of DeepMind, Google AI, and Inflection AI.

  We're building exciting tech for huge customers and we trust
  in the foundations: keep it simple, build strong
  foundations, and the rest will follow.

  The Role

  Anterior's engineering team builds the platform health plans
  rely on for clinical decision-making at enterprise scale. As
  we grow, we need engineering leaders who keep the team
  moving quickly, hold a high bar for quality, and help every
  engineer do the best work of their career.

  As an Engineering Manager, you'll lead and grow a team of
  around 10-15 engineers in our New York office. You'll be
  responsible for the people on your team — how they're hired,
  how they grow, and how they work together — and for what the
  team delivers. This is a player-coach role, roughly 70%
  leading people and 30% hands-on: you'll stay close to the
  technical work, take part in design decisions, and
  contribute hands-on where it gives the team the most
  leverage.

  You'll work closely with our founders and with our product
  and clinical teams, and you'll help shape how engineering at
  Anterior is organized as we scale.

  What You'll Do

  Lead and grow the team

  - Hold regular 1:1s, give clear and honest feedback (gather
    feedback for a team member from their peers/collaborators,
    and assess/message that feedback), and build development
    plans that help strong engineers become standout ones.
  - Own performance reviews and career growth for your team, in
    line with our growth model.
  - Hire for your team: define roles with us, run interview
    loops, assess for competence and fit, and close the
    engineers we want most.
  - Build a team culture of ownership, care, and high standards.

  Deliver for our customers

  - Plan and sequence the team's work in cooperation with TL
    (team lead) and TPM (technical program manager) so that
    execution is predictable and quality stays high.
  - Partner with product, clinical, and customer-facing teams to
    turn real healthcare workflows into roadmaps and specs.
  - Work with our enterprise customers' technical teams to scope
    integrations and support deployments.
  - Own the reliability of your team's systems: keep your
    engineers' on-call rotation healthy, act as an escalation
    point during incidents, and drive postmortem follow-
    through.

  Stay close to the technical work

  - Review system designs, architecture decisions, and code, and
    help the team make sound trade-offs (foster collaboration
    and organic decision-making in the team).
  - Contribute hands-on where it gives the team leverage:
    prototyping, debugging, or building internal tooling.

  Help shape engineering at Anterior

  - Raise the bar on engineering practices and standards as the
    team grows.
  - Work with leadership on team structure, hiring plans, and
    how we scale the engineering organization.

  We're Looking For

  You're an engineer who became a manager because you care
  about building strong teams. You believe in keeping things
  simple and getting the foundations right, and you know that
  good engineering is as much about what a team chooses not to
  build. What we care about:

  - You have 8+ years in software engineering, including 2+
    years as an engineering manager responsible for hiring,
    performance, and career development.
  - Your technical depth is in backend and/or infrastructure:
    APIs, integrations, data pipelines, distributed systems,
    or the cloud infrastructure underneath them. You've owned
    system design decisions and operated systems in production
    at scale.
  - You still enjoy the technical work, and you can hold your
    own in a design review and in code development and review.
  - You've grown engineers into senior and lead roles, and your
    feedback is direct, specific, and kind.
  - You have sound delivery judgment. You know how to scope,
    sequence, and cut in order to ship reliably.
  - You've worked somewhere with real complexity — a scale-up, a
    big tech platform team, an engineering-focused finance
    firm, or anywhere with a serious AWS footprint.
  - Healthcare experience is a plus, but not required.

  This Isn't For You If

  - You want to step away from technical work entirely. This
    role stays close to the code and the systems.
  - You'd rather inherit a well-defined process. We're still
    building ours, and you'll help shape it.
  - You're looking for a remote role. This role is based in our
    New York office.

  Tech

  - Langs: Python / TS, React and HTMX
  - Infra: Nix, AWS (currently on CDKTF — actively looking to
    migrate; experience leading a migration like this is a
    plus)

  What's in it for you

  This is an opportunity to join a company at a major
  inflection point, using cutting-edge technology to have a
  meaningful impact in healthcare. You'll work with a world-
  class team, hold significant responsibility, and shape how
  our engineering organization grows.

  We take pride in our strong apprenticeship and coaching
  culture. We expect our early hires to become leaders both
  within our company and across the industry, and as an
  Engineering Manager, you'll be central to building that
  culture.

  Benefits:

  - Equity package
  - Competitive, top-of-market salary
  - 100% covered health, dental, and vision insurance
  - Complimentary lunches and a stocked kitchen
  - Commuter benefits
  - Company laptop along with the tools (including AI tokens)
    you need to succeed
  - Learning & development budget
  - Team-building events and budget for hosting team-building
    events
  - Flexible PTO
