description: |
  About us

  Scribe is where exceptional people come to do the best work
  of their careers. More than 94% of the Fortune 500 use
  Scribe to document and scale how work gets done. We’re
  growing fast — since our founding in 2019, we’ve grown to
  over 4 million users across 600,000 businesses. Based in San
  Francisco, we've raised $55M in funding from top-tier
  investors and are honored to have been named as a Forbes
  Next Billion Dollar Startup and LinkedIn Top Startup. Join
  us in our mission to uplevel how people do work.

  How we work

  We are builders aspiring to master our crafts. We care
  deeply about our teammates and want to win, together. We
  embrace the following values:

  - Accelerate impact
  - Raise the bar
  - Make our users heroes
  - Clear is kind
  - Rapid learning machine
  - One team one dream

  About the role

  We are seeking a highly skilled and experienced DevOps
  Engineer to join our rapidly growing team. As a DevOps
  engineer at Scribe, you will be responsible for designing,
  optimizing, and monitoring our cloud native infrastructure
  on AWS, along with supporting engineering teams develop new
  products and features. You will help define core
  architecture, contribute to product strategy, and solve fun,
  complex problems that come with building things from the
  ground up.

  Responsibilities

  - Design, implement, and maintain cloud infrastructure and
    services on AWS, including but not limited to, EKS, Aurora
    (PostgreSQL), ElastiCache (Redis), OpenSearch, and S3
  - Write infrastructure as code using Terraform
  - Develop and support CI/CD pipelines using GitHub Actions
  - Work alongside engineering teams to optimize the performance
    and reliability of microservices running in Django
    (Python), Next.js, and Go
  - Proactively identify and remediate infrastructure issues and
    bottlenecks using tools such as Amazon CloudWatch, Sentry,
    and New Relic
  - Create and maintain runbooks, architecture diagrams, and
    product documentation for both internal and external
    stakeholders

  What you bring to the table

  - 7+ years of experience in a DevOps or SRE role
  - Core understanding of DevOps and SRE principles
  - Willingness to learn and adapt to the highly dynamic needs
    of a startup environment
  - Deep knowledge of AWS services, particularly EKS, VPC, S3,
    and RDS/Aurora
  - Extensive experience with Kubernetes internals and cluster
    administration
  - Strong proficiency in writing and maintaining infrastructure
    as code using Terraform
  - Experience with widely-used CNCF projects such as Helm and
    Karpenter
  - Experience developing and managing CI/CD pipelines,
    preferably in GitHub Actions
  - Experience with observability tooling such as New Relic,
    Sentry, and Amazon CloudWatch

  How to stand out

  - Experience implementing OpenTelemetry for both APM and
    infrastructure monitoring
  - Database administration experience specifically around query
    analysis, indexes, and addressing bloat
  - Experience with AI training and inference infrastructure
    such as AWS SageMaker HyperPod
  - Experience with message brokers such as Amazon MQ/RabbitMQ
    or Amazon MSK/Kafka

  Full-time international employee benefits include

  - Some of the nicest and smartest teammates you’ll ever work
    with
  - Competitive salaries
  - Flexible PTO
  - Parental Leave
  - WFH Stipend

  Compensation will be determined based on experience and
  location.

  We consider several factors when determining compensation,
  including location, experience, and other job-related
  factors. At Scribe, we celebrate our differences and are
  committed to creating a workplace where all employees feel
  supported and empowered to do their best work. We believe
  this benefits not only our employees but our product,
  customers, and community as well. Scribe is proud to be an
  Equal Opportunity and Affirmative Action Employer.



