description: |
  Join Axon and be a Force for Good.

  At Axon, we’re on a mission to Protect Life. We’re
  explorers, pursuing society’s most critical safety and
  justice issues with our ecosystem of devices and cloud
  software. Like our products, we work better together. We
  connect with candor and care, seeking out diverse
  perspectives from our customers, communities and each other.
  Life at Axon is fast-paced, challenging and meaningful.
  Here, you’ll take ownership and drive real change.
  Constantly grow as you work hard for a mission that matters
  at a company where you matter.

  Your Impact

  You are a Staff Software Engineer with experience building
  large-scale software applications and distributed systems.
  In this role, you will help shape the technical direction
  for DEMS, a mission-critical product area where reliability,
  security, and usability matter deeply. You will collaborate
  with other senior and staff engineers, engineering managers,
  product managers, and designers to solve complex customer
  problems and build durable systems that scale. Your strong
  system design skills allow you to take a holistic view of
  architecture, reliability, and developer productivity. You
  raise the bar not just through your own contributions, but
  by reviewing designs, mentoring engineers, improving
  technical decision-making, and helping teams align around
  pragmatic, high-quality solutions. As a senior technical
  contributor, you are energized by solving hard problems,
  reducing ambiguity, and building systems that perform under
  real-world demands. As a technical leader, you partner with
  engineering leadership on long-term technical strategy while
  balancing business priorities, roadmap commitments, and
  engineering health. Come work in an environment where your
  experience, judgment, and technical leadership will directly
  contribute to products that help deliver better outcomes in
  public safety.

  What You'll Do

  Work Location: This role is based out of our London office
  and follows a hybrid schedule. We rely on in-person
  collaboration and ask that team members work onsite Tuesdays
  through Fridays, with the flexibility to work remotely on
  Mondays, unless there is an approved workplace
  accommodation. We believe that connection fuels innovation,
  and our in-office culture is designed to foster meaningful
  teamwork, mentorship, and shared success.

  - Set a high technical bar through architecture leadership,
    deep technical insight, and thoughtful design reviews.
  - Drive technical direction across one or more DEMS domains,
    ensuring solutions are scalable, maintainable, secure, and
    resilient.
  - Partner across Engineering, Product, Design, and adjacent
    teams to solve some of the most important and ambiguous
    technical challenges in the DEMS space.
  - Lead the design and evolution of backend services, APIs,
    data flows, and system integrations that support mission-
    critical workflows.
  - Identify systemic risks and opportunities, and drive
    improvements in reliability, observability, performance,
    and operational excellence.
  - Mentor engineers across teams and help grow future technical
    leaders.
  - Improve engineering effectiveness by introducing better
    patterns, simplifying complexity, and supporting high-
    quality execution.
  - Contribute directly to implementation where needed,
    especially in high-leverage or high-risk areas.

  What You Bring

  - 15+ years of software engineering experience.
  - Experience building and scaling complex software products in
    a collaborative team environment.
  - Deep expertise in backend systems and distributed system
    design.
  - Strong experience with cloud platforms and production
    service operations.
  - Experience driving technical solutions across multiple teams
    or broad product areas.
  - Strong understanding of system design, reliability,
    performance, observability, and security.
  - Experience with relational and/or NoSQL databases.
  - Track record of writing clean, maintainable, production-
    grade code.
  - Proven ability to influence technical direction and
    organizational outcomes without relying on formal
    authority.
  - Excellent communication and collaboration skills.

  Highly Valued

  - Experience in enterprise SaaS, mission-critical systems,
    compliance-sensitive domains, or workflow-heavy platforms.
  - Experience with evidence management, records systems, chain-
    of-custody concepts, or highly trusted data systems.
  - Experience supporting hybrid, on-prem, or cloud-connected
    product architectures.
  - Familiarity with languages and platforms commonly used in
    modern backend environments such as Java, Go, C#, Python,
    or similar.

  Benefits that benefit you

  - Competitive base salary and RSUs
  - Comprehensive pension plan with matching contribution
  - Private health insurance & cash plans
  - 30 days paid holiday + UK public holidays
  - Enhanced maternity/paternity leave
  - GymPass subscription
  - Life assurance & income protection
  - Career growth support and wellness resources

  Don’t meet every single requirement? That's ok. At Axon, we
  Aim Far. We think big with a long-term view because we want
  to reinvent the world to be a safer, better place. We are
  also committed to building diverse teams that reflect the
  communities we serve.

  Studies have shown that women and people of color are less
  likely to apply to jobs unless they check every box in the
  job description. If you’re excited about this role and our
  mission to Protect Life but your experience doesn’t align
  perfectly with every qualification listed here, we encourage
  you to apply anyways. You may be just the right candidate
  for this or other roles.

  Important Notes

  The above job description is not intended as, nor should it
  be construed as, exhaustive of all duties, responsibilities,
  skills, efforts, or working conditions associated with this
  job. The job description may change or be supplemented at
  any time in accordance with business needs and conditions.

  Some roles may also require legal eligibility to work in a
  firearms environment.

  We collect personal information from applicants to evaluate
  candidates for employment. You may request access, deletion,
  or exercise other CCPA rights at
  axongreenhousesupport@axon.com or via our Axon Privacy Web
  Form. For more information, please see the Your California
  Privacy Rights section of our Applicant and Candidate
  Privacy Notice.

  Axon’s mission is to Protect Life and is committed to the
  well-being and safety of its employees as well as Axon’s
  impact on the environment. All Axon employees must be aware
  of and committed to the appropriate environmental, health,
  and safety regulations, policies, and procedures. Axon
  employees are empowered to report safety concerns as they
  arise and activities potentially impacting the environment.

  We are an equal opportunity employer that promotes justice,
  advances equity, values diversity and fosters inclusion.
  We’re committed to hiring the best talent — regardless of
  race, creed, color, ancestry, religion, sex (including
  pregnancy), national origin, sexual orientation, age,
  citizenship status, marital status, disability, gender
  identity, genetic information, veteran status, or any other
  characteristic protected by applicable laws, regulations and
  ordinances — and empowering all of our employees so they can
  do their best work. If you have a disability or special need
  that requires assistance or accommodation during the
  application or the recruiting process, please email
  recruitingops@axon.com.  Please note that this email address
  is for accommodation purposes only. Axon will not respond to
  inquiries for other purposes.

  Phishing alert:  Axon will never ask you to pay for any part
  of the hiring process, including training, equipment, or
  background checks. We do not make job offers via text
  message, WhatsApp, or instant messaging platforms without a
  formal interview process.  All legitimate job openings are
  listed on our official careers page at
  https://www.axon.com/careers.  If you receive a suspicious
  offer or outreach from an email address that is not
  @axon.com, or if you are asked for sensitive personal
  information (bank details, Social Security Number)
  prematurely, please ignore the message and report it to
  recruitingops@axon.com.
