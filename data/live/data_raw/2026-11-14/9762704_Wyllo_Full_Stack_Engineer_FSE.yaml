description: |
  About Wyllo

  Wyllo is a CX-first, end-to-end risk intelligence platform
  that helps ecommerce merchants manage fraud, policy abuse,
  and customer experience across the entire commerce
  lifecycle. By combining identity signals with behavioral
  intelligence, Wyllo enables merchants to better understand
  shopper intent and make smarter decisions across checkout,
  returns, refunds, and customer support. Wyllo works with
  leading ecommerce brands and integrates directly into the
  platforms where merchants manage orders and customer
  interactions. Learn more at www.wyllo.ai

  About the Role

  We’re looking for a Full Stack Developer to design, build,
  and enhance features across our backend services and
  frontend applications. You will work in
  Node.js/NestJS/TypeScript for backend logic and
  React/Tailwind CSS for user interfaces, ensuring smooth API
  integrations and delivering high-quality, user-facing
  functionality.

  You will

  - Develop and maintain backend services and REST APIs using
    NestJS, TypeScript, and MySQL.
  - Implement frontend components and views in React and
    Tailwind CSS based on product specifications.
  - Integrate APIs seamlessly between backend and frontend.
  - Support and enhance Kafka messaging infrastructure.
  - Collaborate with product and design teams using Figma
    assets.
  - Ensure code is performant, maintainable, and accessible.
  - Use AI tools like Cursor.AI to accelerate development with
    strong prompting skills.

  You have



  - 3–5+ years of professional experience working in full stack
    development.
  - Strong knowledge of React, Tailwind CSS, Node.js, NestJS,
    TypeScript, and MySQL.
  - Experience with Kafka or similar messaging systems.
  - Familiarity with REST APIs and backend integration workflows
  - Proficiency in using AI coding tools such as Cursor.AI as a
    co-pilot, with strong prompting skills to accelerate
    development
  - Experience working with design tools like Figma to translate
    mockups into production-ready components
  - Strong communication and teamwork skills
  - Experience with using Atlassian tools such as JIRA and
    Confluence
  - Comfort working in an agile, cross-functional team
    environment.

  A plus, but not required

  - Degree or Advanced Degree (Ph.D. or Master’s) in Computer
    Science, AI, Data Science, or related field.
  - Experience in e-commerce, fraud, anomaly detection, or
    financial data modeling.
  - Experience with Ruby and Ruby on Rails is a plus
  - Experience with Bootstrap is a plus

  Working at Wyllo

  We’re a high-performing team that is passionate about making
  commerce a safe, wonderful experience for Brands and
  Consumers.  Our community is driven by values that shape
  everything we do. We seek passionate and dedicated
  individuals who align with our core principles; Integrity,
  Pride, Humility and Impact.

  - Integrity: We do the right thing, even when it’s tough, and
    even if no one sees it. We always consider the customer’s
    best interest in every decision we make.
  - Pride: We know that the work we do is important, and we take
    great pride in doing it well. We show up every day with
    the best intentions, ready to deliver superb outcomes for
    our team, our customers, and ourselves.
  - Humility: We leave our egos at the door, approaching
    problems as a team, with openness and collaboration. We’re
    willing to be wrong in order to get things right.
  - Impact: We are results-oriented, we take ownership, and we
    hold ourselves accountable to get things done and deliver
    results.

  If you are excited to collaborate in a fast-paced, purpose-
  driven environment where your contributions truly matter,
  we’d love to have you join us!

