description: |
  About CueBox

  CueBox is an early-stage startup building all-in-one
  software for performing arts and cultural organizations.
  These organizations inspire, connect and delight us; yet,
  they’ve been underserved by technology providers. Our
  product saves them time and grows their revenue by
  streamlining fundraising, ticketing, marketing, education
  and more, which is why we have such a fast-growing and happy
  customer base!

  We are quickly expanding into more segments across the
  country, and we’re looking for a talented and driven
  engineer to help our small team.

  Location

  CueBox is headquartered in New York City, and we are a
  hybrid workplace. Our team is in the office 3 days a week,
  Tuesday–Thursday.

  About You

  We are looking for backend-leaning full-stack engineers who
  love building delightful and performant products, are
  excited to work hard at a mission-oriented startup, and want
  to collaborate with us in shaping the culture of a growing
  team!

  Requirements

  - 4+ years of professional software engineering experience,
    including prior experience at an early or mid stage
    startup.
  - Bachelor’s degree or higher in Computer Science or a related
    technical field (or equivalent practical experience).
  - Proven track record of building performant, data-intensive
    applications using a strongly typed backend language in a
    complex domain.

  Preferred Qualifications

  - Strong product sense and high customer empathy; genuine
    desire to build the best possible product for our users.
  - Excels at thoughtful API design and database schema/query
    design.
  - Experience with integrating Backend APIs with a
    TypeScript/React frontend.
  - Ability to work independently and successfully own large or
    ambiguous problem areas.
  - Effective verbal and written communication for both
    technical and nontechnical audiences.
  - Experience with online payments, consumer facing flows, or
    reporting/analytics for large datasets.
  - (Nice-to-Have) Experience building AI-enabled features in
    SaaS products.

  About the Role

  This role reports directly to the Head of Engineering. You
  will:

  - Build, maintain and scale our backend systems as we grow.
  - Pioneer new features and product areas.
  - Meaningfully influence technical direction as the product
    evolves, including how to further integrate AI into our
    product.
  - Contribute to a culture of engineering excellence through
    technical design discussion, code review, and
    documentation.
  - Work in our current tech stack: Golang/Protobuf/Postgres
    backend; React/Next.js/Chakra UI frontend; Python data
    pipelines; hosted on GCP.

  Current and Upcoming Projects include:

  - Building brand new AI features such as Dynamic Pricing, MCP
    Connection and AI Email Composer
  - Improving performance, user experience and accessibility of
    consumer-facing checkout flows.
  - Scaling up and rearchitecting our backend systems to handle
    more user traffic and heavier analytics workloads.
  - Continuing to enhance our payments processing functionality,
    including split payments, Pay Later, and Fraud Prevention.

  Summary of Benefits

  - Base salary ~$145–185k
  - Competitive equity package
  - Medical, dental, and vision insurance
  - Complimentary one-medical membership
  - 401k

  Note: We do not offer visa sponsorship at this time.
