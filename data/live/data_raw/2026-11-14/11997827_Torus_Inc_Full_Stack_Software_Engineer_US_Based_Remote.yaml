description: |
  About Torus

  Torus is headquartered in Utah and is expanding
  manufacturing at our 545,000-square-foot facility in Salt
  Lake City called GigaOne. We are the world’s first mesh
  energy infrastructure, uniting communities through
  resilient, sustainable, and intelligent power. We design,
  engineer, manufacture, install, and support our systems end-
  to-end, standing behind them throughout their lifecycle.
  Torus systems help reduce costs, lower emissions, and
  protect facilities from outages, while strengthening the
  security and reliability of the broader utility grid. Torus
  is committed to American manufacturing, engineering
  excellence, and building energy systems that last.

  Torus has raised over $267 million from investors like
  Magnetar, Mercado, ICONIQ and Origin Ventures. The
  investments are helping to accelerate deployment of modular
  power plants across utilities, data centers, and industrial
  sectors. This investor confidence reflects the strength of
  our team, technology as well as the scale of the problem we
  are solving.

  At Torus, you will be part of something larger than a single
  product or technology. Your work will help build energy
  infrastructure that supports and strengthens our electrical
  grid, critical  systems, industry, and communities for
  decades to come. We value accountability, collaboration, and
  clear thinking. We are looking for people who want to solve
  hard problems and build things that matter.

  Role Overview

  We are seeking a highly capable Software Engineer (Full
  Stack) to help build and evolve the Torus platform. This
  role is ideal for an experienced engineer who thrives in a
  hands-on environment—designing, developing, and delivering
  scalable systems that power our hardware-software
  integration, customer-facing applications, and internal
  tools. You will contribute to the architecture and
  implementation of full-stack systems spanning front-end
  experiences and backend services, working across the
  software lifecycle—from ideation to production—while
  partnering closely with Product, Design, Firmware, Data
  Science, and other engineering teams to deliver high-quality
  solutions that drive real-world impact in the renewable
  energy space.

  This role requires someone who can take ownership of complex
  features, contribute to system design, and collaborate
  effectively across disciplines, with opportunities to
  continue expanding technical scope and impact over time.

  Who You Are

  - Passionate about climate solutions, sustainability, and
    building technology that matters
  - Motivated by solving complex problems and delivering
    impactful customer experiences
  - Strong collaborator who communicates effectively across
    technical and non-technical teams
  - Self-driven and accountable—you take ownership of your work
    and outcomes
  - Curious and growth-oriented, continuously learning new
    tools, patterns, and technologies
  - Pragmatic—you balance speed with quality and long-term
    maintainability

  What You’ll DoFull Stack Development & Delivery

  - Design, build, and maintain scalable full-stack applications
    using modern technologies
  - Build and maintain backend services, APIs, and data models
    supporting customer-facing and internal systems
  - Develop responsive, performant front-end interfaces that
    deliver exceptional user experiences
  - Contribute to system design and architecture discussions,
    making thoughtful tradeoffs
  - Participate in the full software development lifecycle:
    requirements, design, implementation, testing, deployment,
    and support

  Backend & Cloud Systems

  - Implement cloud-native solutions using AWS services
  - Develop RESTful APIs, event-driven services, and
    integrations supporting hardware-software coordination
  - Ensure systems are reliable, secure, and scalable through
    proper design and implementation

  AI Experience & Application

  - Experience using AI-assisted development tools to improve
    productivity and code quality, including tasks such as
    code generation, debugging, and documentation
  - Familiarity with integrating AI-enabled APIs or services
    into applications
  - Understanding of evaluating AI outputs for accuracy and
    reliability
  - Interest in applying AI to enhance product features and
    development workflows

  Collaboration & Team Contribution

  - Partner with Product and Design to translate requirements
    into technical solutions
  - Collaborate with firmware, IoT, and data teams on integrated
    system functionality
  - Participate in code reviews, pair programming, and knowledge
    sharing
  - Contribute to shared component libraries and promote
    consistency across applications

  Required ExperienceTechnical Proficiency

  - Strong experience in full-stack development with TypeScript
  - Proficiency in modern front-end frameworks such as React,
    Next.js/Tanstack Start, Tailwind
  - Experience building backend services and APIs (Node.js or
    similar)
  - Experience with AWS cloud services (Lambda, API Gateway,
    DynamoDB, IoT Core, ECS/Fargate, CDK or similar)
  - Solid understanding of software architecture, API design,
    and distributed systems fundamentals
  - Experience implementing responsive, accessible, cross-
    browser compatible interfaces
  - Implement comprehensive testing strategies and CI/CD
    pipelines for continuous delivery (experience with GitHub
    Actions is a plus)
  - Experience using AI-assisted development tools (e.g.,
    Copilot, ChatGPT)

  Experience & Impact

  - Typically 5–8+ years of professional software engineering
    experience
  - Proven track record delivering production-quality software
    in complex environments
  - Experience owning features or systems from design through
    deployment and support
  - Demonstrated ability to break down complex problems and
    deliver effective solutions

  Collaboration & Ownership

  - Strong communication and collaboration skills
  - Experience working in cross-functional teams in fast-paced
    environments
  - Ability to balance technical excellence with business needs
  - Ownership mindset—takes responsibility for delivering
    outcomes, not just tasks

  Additional Details

  Background Check All candidates are subject to a background
  check.

  Location Remote U.S.-based role with occasional onsite work
  in Salt Lake City and surrounding area locations (air-
  conditioned and non-air-conditioned). Must be available
  during MST business hours.

  Compensation $125,000 - 180,000 (Note: We have the
  flexibility to hire at different levels, which may impact
  the corresponding pay range.)

  Work Authorization Applicants must already have the legal
  authorization to work in the US without requiring any
  employer sponsorship.

  Physical Requirements

  - Regularly operates a computer and other peripheral office
    equipment such as a printer or mouse.
  - Ability to communicate information so others can understand.
    Must be able to exchange accurate information in these
    situations.
  - Must report to work reliably and with the ability to use
    full and unimpaired skills and judgment to safely execute
    your job.
  - Proficiency in reading, writing, and speaking English
    required.
  - When on the production floor, required to don personal
    protective equipment to include, but not limited to ear
    protection, gloves, eye protection and/or safety helmet.
  - When on the production floor, ability to observe, detect and
    respond to audible and visual machine malfunction
    warnings.

  Our Perks & Benefits

  Benefits eligibility is based on employment status.

  Financial

  - Employee Rewards Package including equity
  - 401(k) Retirement Savings Plan
  - Torus paid life and AD&D Insurance with options to purchase
    additional coverage
  - Voluntary short- and long-term disability insurance

  Health & Wellness

  - Health Benefits Package: Choice between traditional PPO or
    HSA-eligible medical plans with Torus covering 50% of
    medical premiums; Dental insurance; and Vision insurance
  - Plan participants have access to telehealth services, mental
    health support and coaching, and exclusive discounts on
    brands, dining, entertainment, and more.

  Time Off

  - Unlimited discretionary PTO
  - 10 paid company holidays
  - Waiting period-free 100% paid parental leave

  Culture & Community

  - Regular company-wide offsites to showcase our progress and
    learnings. A time to step back, think strategically, and
    work on the business together.
  - Team members receive Torus branded gear
  - Peer Recognition Program
  - Fully stocked break rooms with free snacks and drinks.
    Because great work deserves great fuel.

  Torus is proud to be an Equal Opportunity Employer. All
  applicants will be considered for employment without
  attention to race, color, religion, sex, sexual orientation,
  gender identity, national origin, veteran, or disability
  status.

  Torus participates in E-Verify. Once you accept a job offer,
  we will provide the Social Security Administration (SSA)
  and, if necessary, the Department of Homeland Security (DHS)
  with information from your Form I-9 to confirm work
  authorization.

