description: |
  Full-Time | US Remote

  We're partnering with Statusphere, a fast-growing influencer
  marketing technology company, to find a Senior Fullstack
  Engineer who will help build and scale its AI-powered
  creator-brand matchmaking platform.

  About Our Client: Statusphere

  Statusphere is an influencer-marketing technology platform
  built for enterprise brands to make human-generated content
  scalable, measurable and brand-safe across social, retail
  and paid media channels.

  The platform uses AI to automate and orchestrate large-scale
  creator programs, from sourcing and vetting influencers to
  fulfillment, compliance, tracking and rights management.

  Brands including Express, Parlux, Kendo Brands, and LG H&H
  use Statusphere to drive social SEO, improve product
  discoverability and generate measurable sales impact online
  and in-store.

  For more information, visit www.joinstatus.com.

  About the Role

  As a Senior Fullstack Engineer at Statusphere, you will use
  your mastery of JavaScript, Node.js, and Postgres to deliver
  web services that contribute to the company's key product
  and business outcomes.

  You are a thoughtful engineer who wants to work on a
  growing, product-focused team and thrive in a startup
  environment where you can take ownership from idea to
  delivery.

  You will follow established coding guidelines, contribute to
  process improvements, write and maintain clean application
  code, and avoid investing excessive time optimizing things
  that don't matter.

  You will be a productive team member both independently and
  in collaborative and supporting capacities.

  What You'll Do

  - Contribute to and execute the engineering technical roadmap.
  - Use continuous delivery to ship incremental improvements
    regularly.
  - Facilitate code reviews to spot issues around architecture,
    performance, security, and consistent coding patterns.
  - Follow and improve upon Statusphere's engineering
    guidelines, code style, and continuous delivery process.
  - Periodically lead the entire product development lifecycle,
    including the design, development, deployment, and
    maintenance of new and existing features.
  - Design and build the matching engine that pairs creators
    with brand campaigns.
  - Communicate plans, progress, and blockers in team review
    meetings.
  - Frequently ask clarifying questions about the intended
    impact of the work, weighing options and devising creative
    solutions to complex problems.
  - Assist with training and onboarding of team members as
    needed.
  - Contribute to team and individual development where needed.
  - Align and motivate engineering team members to execute on
    technical strategy and vision to meet deadlines.
  - Provide regular updates to the VP of Product and Engineering
    on progress of key milestones, risks, blockers,
    mitigation, and issues.
  - Identify and roll out tools that will set the Software
    Engineering team up for success.
  - Drive high levels of productivity and motivate the
    Engineering team to exceed business goals through
    mentorship.
  - Effectively manage time, prioritize tasks, and work within
    deadlines with little to no supervision.
  - Perform other duties as assigned.

  What We're Looking For

  - Proficient in operating ML-driven features in production,
    including vector similarity search (pgvector, OpenSearch,
    or similar), feature pipelines that keep model inputs
    consistent between training and serving, and monitoring
    for model drift and data quality.
  - Experience designing multi-stage matching or recommendation
    pipelines (candidate generation, filtering, and re-
    ranking) and closing the feedback loop so real-world
    outcomes like acceptances, approvals, and content
    performance continuously improve match quality.
  - Strong understanding of modern web application architecture.
  - Proven experience designing and maintaining CI/CD pipelines.
  - Ability to investigate incidents and differentiate memory,
    I/O, and CPU bottlenecks.

  Work Experience

  - 7+ years of software engineering experience, preferably in
    SaaS environments.
  - Strong proficiency in modern JavaScript tooling (React,
    Redux, Node, Express).
  - Deep expertise in front-end architecture, component-driven
    development, and state management.
  - Extensive experience building scalable, high-throughput REST
    APIs.
  - Hands-on experience with AWS (e.g., RDS, S3, Lambda, Elastic
    Beanstalk) and cloud-native architectures.
  - Solid understanding of HTML5, CSS, and modern web
    application patterns.

  Preferred Education

  - Bachelor's or Master's degree in Computer Science,
    Engineering, or a related field.

  Travel: Typically less than 5%. Remote environment. No
  special physical demands required.

  What You'll Get

  - Medical, Dental, and Vision insurance
  - Unlimited PTO + paid holidays
  - 4% 401(k) match
  - Work from anywhere, fully remote flexibility
  - Paid parental leave
  - Employee stock options
  - Opportunities for growth and leadership in a fast-growing
    company
  - Collaborative, innovative, positive, team-oriented culture

  Interested in Joining?

  We're helping Statusphere find an engineer who combines
  strong technical expertise with ownership, product thinking,
  and a passion for building impactful technology.

  Apply through A-Players Recruiting to learn more about the
  opportunity and connect with the team.
