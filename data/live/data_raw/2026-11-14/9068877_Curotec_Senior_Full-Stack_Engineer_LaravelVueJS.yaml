description: |
  About Curotec We are a globally leading software services
  company specializing in developing enterprise-level projects
  for clients worldwide. Our team is a unique blend of diverse
  skill sets, cultures, and backgrounds—a true melting pot of
  talent. One of the most rewarding aspects of working at
  Curotec is the opportunity to learn something new every day,
  not just about technology but also about our amazing team
  members. Visit our website to discover more about who we are
  and what we do.

  We are looking for highly-skilled remote developers who have
  experience building complex business applications using the
  Laravel and Vue frameworks. Candidates should have
  experience developing applications with the Laravel and Vue
  frameworks, working in a cloud environment, and using
  standard developer tools.

  This is a remote position.

  Job Duties

  - Work with a team of developers, BA, PM, QA, etc to execute
    strategies and implement solutions to build quality
    business software applications.
  - Develop front-end and back-end components for large data-
    driven applications.
  - Review features requests, provide feedback, and
    develop/maintain features for web applications.
  - Document your development process and development
    components.
  - Work with other developers to complete tasks and share
    ideas.

  Experience

  - 5+ years of experience with Laravel/Vue/Nuxt.
  - 5+ years of experience with custom application development.
  - Must be able to work EDT business hours.
  - 8am - 5pm New York time. Must be able to speak and write
    fluent English.
  - Must be dedicated, passionate, and hard-working. Attitude is
    everything.
  - Must be able to work with a team and collaborate remotely.
    Hard workers and self-starters, please apply.
  - We are looking for a creative and efficient problem solver.

  Technical Skills

  - Experience with PHP, Laravel, Vue, Javascript, HTML5, CSS3.
  - Experience with Nuxt.js framewok is mandatory.
  - Experience with VueX Store, Vue Router, and
    Provide/Inject.OAuth and JWT Tokens experience is a plus.
  - Experience with the Nuxt.js framework is a plus. In-depth
    knowledge of object-oriented PHP and versions 7 and 8.
  - Advance Laravel Experience (Middleware, Collections,
    Policies, Request, Resources, and Service Containers).
  - Experience with software testing, TDD, and unit testing
    (PHPUnit, PHPSpec, Behat).Experience with MySQL profiling
    and query optimization.
  - Solid working experience building RESTful APIs.
  - Active experience integrating custom code with 3rd party web
    services.
  - Have performed complicated data migrations.Hands-on
    experience with tools such as Git and Jira.
  - Experience working in the AWS (Amazon Web Services)
    ecosystem.Experience working within Agile development
    environments.

  Benefits

  - Competitive salary
  - Ability to grow and advance your career
  - Attend virtual developer conferences
  - Work on cutting edge and exciting projects
