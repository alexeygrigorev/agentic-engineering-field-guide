title: Associate, Credit eTrading Software Developer (Java)
company: Jefferies
location: New York, USA
work_type: FULL_TIME
company_size: 6,435 Employees
description: |
  Jefferies, a global investment banking firm focused on
  serving clients for over 50 years, is a leader in providing
  insight, expertise, and execution to investors, companies,
  and governments. The firm provides a full range of services,
  including investment banking, sales, trading, research, and
  strategy across equities, fixed income, foreign exchange,
  futures, commodities, and select asset and wealth management
  strategies. Jefferies Group LLC is a wholly-owned subsidiary
  of Leucadia National Corporation (NYSE: LUK), a diversified
  holding company.


   Primary Responsibilities:

  - Design and development of firm’s proprietary, high
    performance Fixed Income (FI) e-trading platform with an
    emphasis on Credit products (US Corporates, Credit
    Derivatives, Central/South American Emerging Markets)
  - Supporting and enhancing existing infrastructure and
    applications across a variety of technologies (ION, Java,
    Kdb)
  - Supporting various dealer-to-client trading workflows
    (indicative & firm quoting, RUNZ, axes, RFQ & order
    management, STP)
  - Working alongside traders and quantitative analyst to gather
    requirements and build out real-time trading applications
    that electronically execute orders across multiple ECNs
  - Driving implementation and design with emphasis on high
    availability and scalability
  - Working with other FI e-trading team lead to promote
    framework reusability across all products
  - Championing SDLC best practices with emphasis in test driven
    coding methodology
  - Balancing time to market (client delivery) with proper
    governance, compliance, and audit mandates

  Education

  - BS/MS in Computer Science, Engineering or related

  Required Background:

  - 3+ years of finance industry experience (front office
    e-trading experience recommended)
  - Knowledge of Java 8-21, Linux, SQLServer/PostgreSQL/JDBC
  - Strong multithreaded programming experience
  - Strong design, coding, testing and debugging skills
  - Strong communication skills to collaborate with the trading
    and sales desk

  Primary Location Full Time Salary Range of $125,000 -
  $150,000.

