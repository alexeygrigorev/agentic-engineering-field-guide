description: |
  ABOUT YOU



  We are looking for a Software Engineer, Web3 for Xsolla ZK,
  Xsolla's Web3 ecosystem on a zkSync-based L2. This will
  involve working on: smart wallets built on account
  abstraction, SDKs that game studios and partners use to
  bring players on-chain, infrastructure backend services for
  tokenizing in-game items and currencies, ecosystem dApps: a
  DEX, an NFT marketplace and an auction. This is a senior
  fullstack role: you work across backend, frontend and smart
  contracts.



  ABOUT US



  Xsolla is a global commerce company with robust tools and
  services to help developers solve the inherent challenges of
  the video game industry. From indie to AAA, companies
  partner with Xsolla to help them fund, distribute, market,
  and monetize their games. Grounded in the belief in the
  future of video games, Xsolla is resolute in the mission to
  bring opportunities together, and continually make new
  resources available to creators. Headquartered and
  incorporated in Los Angeles, California, Xsolla operates as
  the merchant of record and has helped over 1,500+ game
  developers to reach more players and grow their businesses
  around the world. With more paths to profits and ways to
  win, developers have all the things needed to enjoy the
  game.

  For more information, visit xsolla.com.

