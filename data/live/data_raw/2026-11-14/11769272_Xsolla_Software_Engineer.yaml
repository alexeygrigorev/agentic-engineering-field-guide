  How We Work:

  - Decisions in writing. Significant technical decisions are
    written up as an RFC or ADR that lays out the options and
    trade-offs. We discuss the document, not a blank
    whiteboard.
  - AI is part of everyday engineering. We use AI coding tools
    for development and review, and we treat configuring them
    for a codebase as real engineering work.
  - The team. You will work alongside product managers,
    designers, smart contract, backend and frontend engineers,
    QA and DevOps.

