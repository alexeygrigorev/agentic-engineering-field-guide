description: |
  About the Job

  As a Full-Stack Engineer at Splitero, you will play a
  crucial role in architecting, developing, and maintaining
  our software from marketing through origination. Your
  expertise in modern back-end technologies, cloud computing,
  and the full software development lifecycle will be
  essential in delivering high-quality solutions in a fintech
  and proptech ecosystem. You will work closely with product,
  engineering, and QA teams to ensure our software meets the
  highest standards of functionality and performance while we
  scale our operations to meet team and organization goals. As
  an individual contributor, you will be able to balance pace
  with perfection and understand tradeoffs in how you deliver
  your work.

  - Design and implement scalable and efficient back-end systems
    using Node, JavaScript, and TypeScript. Develop APIs and
    services that support robust application functionality.
  - Utilize PostgreSQL to design and manage databases, ensuring
    data integrity and optimizing performance across a Heroku
    Connect/Salesforce-based data infrastructure.
  - Develop and deploy serverless applications using AWS Lambda
    and IaC platforms such as Terraform and AWS CDK.
  - Work with AI technologies for both your day-to-day role as
    an engineer and also for new product implementations,
    leveraging APIs with major AI platforms
  - Collaborate with front-end developers to integrate back-end
    services with a modern React ecosystem (Next.js, Tailwind,
    Vercel, etc), ensuring a seamless and responsive user
    experience.
  - Participate in all stages of the software development
    lifecycle, from requirements gathering and design to
    implementation, testing, and deployment.
  - Work closely with product managers and QA teams to gather
    requirements, identify issues, and deliver high-quality
    software solutions.
  - Maintain a high level of attention to detail, ensuring that
    software is reliable, efficient, and meets established
    standards and specifications.
  - Stay current with industry trends and technologies,
    recommending improvements and adopting best practices for
    software development and cloud computing.

  The salary range for this position is $140,000 - $155,000.
  Within the range, individual pay is determined by job-
  related skills, experience, and relevant education or
  training.

  About You

  - 4-6 years of experience as a full-stack engineer with a
    strong focus on back-end technologies
  - Strong proficiency in JavaScript and TypeScript for front-
    end and back-end development
  - Strong experience with Node.js for building server-side
    applications
  - Expertise in PostgreSQL (or similar) and database design
  - Experience with cloud computing platforms, specifically AWS
    Lambda
  - Extensive experience working with Claude Code (or similar)
    to build tools and workflows that accelerate the
    development lifecycle; not just individual chat use or
    vibe coding
  - Hands-on experience working with Infrastructure-as-Code
    using Terraform, AWS CDK, or CloudFormation
  - Experience implementing and working with modern analytics
    tools for event tracking and reporting (Mixpanel, Posthog,
    Google Analytics, etc)
  - Strong experience working with testing and quality
    engineering tools such as Playwright, Jest, and/or Mocha
  - Solid understanding of modern cloud computing pipelines and
    the full software development lifecycle
  - Proven experience working directly with product and QA teams
    to ensure high-quality software delivery
  - Experience with Heroku Connect and Salesforce platforms is a
    plus
  - Candidates must be located in the United States. Working
    timezone in PST or MST preferred.
  - Ability to break down complex technical problems and deliver
    high-quality solutions.
  - Effective communication skills and a track record of
    collaboration with cross-functional teams.
  - Desire to participate in fast-paced early-stage startup
  - Adaptability: Embraces changing circumstances with
    resiliency and positivity
  - Team-Oriented: Prioritizes collaboration, inclusivity, and
    teammate support

  About Us

  Millions of homeowners in today’s economy are sitting on
  substantial home equity they are unable to access due to
  rising interest rates and strict qualification requirements
  of traditional lenders. That means millions of homeowners
  can’t convert their hard-earned equity into cash to pay off
  debt, start a home renovation, or pad their retirement to
  better their lives.

  Splitero co-founders Michael Gifford and David Zvaifler
  witnessed the problem firsthand throughout their real estate
  careers. They set out to create a win-win product that could
  help those homeowners access their home equity but not make
  monthly payments like traditional financing options. And
  thus, Splitero was born.

  As part of our team, you will join our quest to
  revolutionize the real estate industry while helping
  families in need. We offer a suite of benefits designed to
  help you thrive in all areas of life.

  - OneTeam Culture - We foster a culture of transparency,
    innovation, and inclusivity, where every voice is heard
    and every team member is valued. We believe in celebrating
    our successes, doing the right thing, and helping each
    other so we grow as a team and as individuals.
  - Generous Resources - We want to ensure you are set up to do
    your best work. In addition to a solid tech stack, and
    access to any WeWork location, you will receive a monthly
    cell and internet stipend.
  - Premium Healthcare - We offer comprehensive healthcare plans
    for you and your family, which employees are eligible for
    on their first day.
  - Flexible PTO and Parental Leave - We offer a generous PTO
    and encourage employees to take time off to recharge.
    We're proud to offer a parental leave policy that allows
    you to welcome your new addition without worry.

  We are a workforce composed of individuals with diverse
  backgrounds, abilities, minds, and identities. In keeping
  with our commitment to inclusion, we will ensure that people
  with disabilities are provided reasonable accommodations. If
  reasonable accommodations are required when applying,
  interviewing, or performing the essential functions of this
  position, please contact People Operations, at
  peopleops@splitero.com.
