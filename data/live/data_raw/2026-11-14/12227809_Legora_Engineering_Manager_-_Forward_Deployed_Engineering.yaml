description: |
  About Us

  Legora is redefining how legal work gets done. Not built for
  lawyers, built with them. We work alongside the world’s best
  legal teams, who expect excellence, precision, and speed,
  and we hold ourselves to the same bar. Our AI-native
  workspace lets legal professionals move faster, think more
  clearly, and operate with sharper precision. By analysing
  thousands of documents in minutes and powering end-to-end
  workflows, we cut through complexity, teams can focus on
  what matters: judgment, strategy, and outcomes. 2,100+
  customers across 80+ countries trust us, including Cleary
  Gottlieb, Goodwin, Linklaters, White & Case, Dentons, and
  Barclays. We’ve scaled to $200M+ in ARR, with teams across
  Europe, North America and APAC, and continue to expand
  through acquisitions including Qura, Walter AI, Graceview,
  Cadastral, and Wexler. We partner with world-class
  performers: including Aaron Judge and the New York Yankees,
  Ludvig Åberg (and his caddie), and campaigns featuring Jude
  Law. Joining Legora means three things.

  - We lean in: ownership over titles, outcomes over intentions.
  - We fight for excellence: high standards, direct, ego-free
    feedback.
  - We grow together: as a team and with our customers.

  Mission before ego. Everyone contributes. No one coasts.

  If you’re driven by impact, pace, and raising the bar. This
  is the place.

  The role

  As Engineering Manager, Forward Deployed Engineering, you'll
  lead a team of engineers who put Legora to work inside our
  largest enterprise customers. Our Forward Deployed Engineers
  sit between customers, product and engineering. They work
  directly with the world's leading law firms and legal teams
  to understand how they operate, then build the software that
  connects Legora to their systems and workflows.

  You'll lead by example: hands-on in the code while guiding a
  talented team, helping them deliver complex customer
  engagements and grow into owners who can run those
  engagements independently. You'll work closely with Product
  Engineering, Product, Design, Legal Engineers, Engagement
  Managers and our commercial teams. What your team builds
  shapes how thousands of lawyers use AI every day, and what
  it learns in the field helps decide what becomes part of the
  core product.

  This is a New York City-based role, five days a week in our
  Union Square office. We believe building together in person
  drives better outcomes.

  What you'll do

  - Lead, coach and grow a team of Forward Deployed Engineers in
    New York, review code, mentor engineers at every level,
    contribute to hiring, and keep the team healthy and
    effective.
  - Set team objectives that connect to the goals of the FDE
    function, and plan how engagements are scoped, staffed,
    delivered and handed over.
  - Stay hands-on by leading technical discovery and delivery on
    strategic accounts, building end-to-end features and
    integrations across our fullstack platform with Node.js,
    React, Azure, AWS and Kubernetes.
  - Make architecture and technical decisions for your team's
    work, holding a high bar for quality, security and
    performance.
  - Act as a trusted technical partner to customer stakeholders,
    aligning them on scope, tradeoffs and timelines.
  - Work with Product, Design and Product Engineering to turn
    what the team learns in the field into reusable
    integrations, tooling or core capabilities.
  - Track your team's delivery health, such as time to value,
    deployment quality and reuse, share it with FDE
    leadership, and champion good practices in development,
    DevOps and continuous improvement.

  What we're looking for

  - Strong experience as a fullstack or backend engineer
    building and owning complex, scalable systems end to end,
    with confidence across backend, frontend and
    infrastructure.
  - Experience leading and managing engineers, ideally in a
    customer-facing function such as forward deployed
    engineering.
  - Strong ability to stay hands-on while setting technical
    direction for a team.
  - Strong ability to communicate with empathy and clarity, and
    to earn the trust of senior technical and non-technical
    stakeholders, including reframing a request or resetting
    expectations when it's the right call.
  - Strong product judgment, including knowing when to build
    something bespoke, when to push back, and when a customer
    need should shape the core product.
  - Ability to take ownership, solve the most pressing problems
    independently, and make progress where the answers aren't
    clear and processes are few.
  - Familiarity with enterprise integrations, APIs,
    authentication and data flows across systems you don't
    control. Nice to have: forward deployed experience at a
    high-growth B2B or AI company, work in legal, financial
    services or other regulated environments, experience
    shipping LLM-powered products, or TypeScript (we use it
    extensively, but welcome strong engineers from other
    stacks).What’s In It For You

  - Global collaboration: Partner with teams and clients
    domestically and internationally.
  - Competitive package: Comprehensive salary, benefits, and
    tools for success.
  - Meaningful work: Your efforts shape how thousands of lawyers
    use AI daily.
  - In-person environment: Union Square office designed for
    ambitious builders.
  - Benefits & Perks: We invest in our people with a
    comprehensive, thoughtfully designed benefits
    package:Medical, Dental & Vision
    - Multiple medical plan options through Aetna and Kaiser
      Permanente
    - HSA or Healthcare FSA (based on plan selection)
    - Dental plans via MetLife
    - Vision plans via Vision Care

