description: |
  Zencore is a fast-growing company founded by former Google
  Cloud leaders, architects, and engineers. We are seeking
  candidates with significant experience in Google Cloud to
  join our team. Our engagements aim to eliminate obstacles,
  reduce risk, and accelerate timelines for customers
  transitioning to Google and seeking assistance with data and
  application modernization. We embed within customer teams to
  provide strategic guidance, facilitate technology decisions,
  and execute projects in a collaborative, co-development
  style.

  As a member of our Cloud Engineering team, you will be
  working with fast-paced innovative companies, leveraging
  Cloud as the key driver of their transformation. Our clients
  will look to you as their trusted advisor, someone they can
  rely on and who will be there to help them along their
  Google Cloud journey. You will be expected to work a large
  spectrum of technology and tools, including public cloud
  platforms, AI and LLMs, Kubernetes, data processing systems,
  databases, and more.

  Note: This will be a short-term contract. No expectation set
  that this will transition into a full time role

  What you will do...

  - Working with our clients to understand their requirements
    and technical challenges. Using this input you will
    develop a technical design for a solution and communicate
    the value of your solution to the client team.
  - You will work to develop delivery estimates and an estimated
    project plan.
  - You will act as the lead technical member of the
    implementation project team. You are responsible for
    making the key technical and keeping delivery on track.
    You should be able to unblock when things are stuck.
  - Utilize a broad range of technologies such as Kubernetes,
    AI, and Large Language Models (LLMs), to develop scalable
    and efficient cloud applications.
  - Stay abreast of industry trends and new technologies to
    drive continuous improvement in cloud solutions and
    practices.
  - Work closely with cross-functional teams to deliver end-to-
    end cloud solutions, from conceptualization to deployment
    and maintenance.
  - Engage in problem-solving and troubleshooting to address
    complex technical challenges in a cloud environment.

  What we need...

  - 5+ years of experience working in a Software Engineering
    capacity
  - Excellent knowledge and experience with Python, and
    preferably additional languages such as Go
  - Strong critical thinking skills, and a bias towards problem
    solving
  - Familiarity with implementing microservice architectures
  - Fundamental skills with Kubernetes. You should be familiar
    with packaging and deploying your applications to k8s
  - Experience building applications that work with data,
    databases, and other parts of the data ecosystem is
    preferred
  - Familiarity with Generative AI workflows, frameworks like
    Langchain, and experience with Streamlit are all highly
    desirable, but at a minimum you should have a willingness
    to learn
  - Experience deploying production workloads on the public
    cloud - either GCP or AWS
  - Experience using CI/CD tools such as GitHub Actions, GitLab,
    etc
  - Able to work with new tools and technologies where you may
    not have prior experience
  - Comfortable with being on video in meetings internally and
    with clients
  - Strong English communications skills

  Why work here...

  - We are professionals you can Trust. Our people have
    extensive experience to get the job done
  - We share unbiased opinions and are comfortable with the hard
    truths. You are the subject matter experts for our
    customers.
  - We are the Missing Link. You will connect our customers to
    Google and move quickly when others can’t
  - We remove uncertainty and risk by clearly outlining the
    process of cloud migration for our customers
  - We accelerate timelines and do not dwell on a challenge.
    You’ll move faster and expose “unknown unknowns” for our
    customers
  - We show empathy. Our customers believe in us because we can
    relate to their complexities.

  How to succeed...

  - First rule at Zencore - Be Kind
  - Own the process - own your customer’s success by proactive
    practices
  - Work hard to reach the destination, but make sure to enjoy
    the journey
  - Champion a consistent collaborative culture
  - Be receptive to all types of Feedback
  - Challenge the Status Quo

  We are a fully remote company and offer competitive
  compensation and benefits.

  Zencore is committed to a diverse and inclusive workplace.
  Zencore is an equal opportunity employer and does not
  discriminate on the basis of race, national origin, gender,
  gender identity, sexual orientation, protected veteran
  status, disability, age, or other legally protected status.
