description: |
  Company Description

  We are a "first of its kind" platform dreamed up by a couple
  of rabid live event fanatics to help fans like ourselves get
  to more of the events they love by swapping their tickets
  with other fans instead of scouring the "wild, wild, west"
  of the interwebs to find someone who is willing to take them
  off of their hands. It's our humble beginnings (having
  originally started from a coffee table in an NYU dorm room)
  and our passion for live events and building things for our
  fellow crazy, irrational, "stand outside for three hours in
  the driving snow" fans that sets us apart from other
  companies. People can say what they want about us but one
  thing they can't say is that we are disingenuous because we
  truly believe that we are taking up the proverbial mantel
  for the unwashed masses who understand the most important
  part about buying event tickets in the first place is "being
  there."

  Job Description

  The web's premier event ticket trading destination is
  looking for a pair of passionate and creative interns to
  work alongside our development team as we gear up for our
  1.0/Beta launch. Interns will get hands-on experience,
  working with a "first of its kind" product and be part of a
  team dedicated to building awesome things that people want
  to and enjoy using.

  Specifically, we are looking for someone who has experience
  working with PHP stacks (PHP myadmin, JavaScript, HTML,
  CSS), knowledge of and experience with Third-Party API's and
  RESTFUL programming principles is not a prerequisite but is
  definitely a plus. Aside from being technically sound, we
  are looking for someone who is also passionate about
  building things and who understands and wants to be a part
  of what we're trying to accomplish here. One thing we can
  guarantee you is that this will be unlike any other
  internship out there, in that we throw our interns into the
  "deep end" of the pool right away as we hit the ground
  running with projects that are both fun and challenging. We
  like to consider ourselves an "idea-centric" company so as
  much as we appreciate talent and ability we place as much
  (if not more) value on passion and the ability to bring new
  ideas and perspective to the table.

  This is an exciting time for us and we hope that if you
  choose to apply you are as excited about the project as we
  are. Love of sports, music, and live events is not a
  prerequisite but may be a by-product of this internship. If
  interested please send along a resume, links to relevant
  projects (GitHubs, etc), and an email that gives us a sense
  of you, specifically what you're good at and what you enjoy
  doing to info at seatswaptickets.com.


  Best of Luck.

  Qualifications

  Experience with PHP, PHP MyAdmin, HTML, CSS, JavaScript

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
