description: |
  Company Description

  Scalable Capital is a leading digital investment and banking
  platform with a full banking licence, empowering people
  across Europe to shape their own finances. Scalable Broker
  makes it easy and affordable for clients to invest
  professionally in stocks, ETFs, cryptocurrencies, and
  derivatives, as well as set up savings plans. Scalable
  Wealth, the digital wealth management service, offers
  clients professional investment in ETF portfolios, and is
  also adopted as a white-label solution by banks and other
  B2B partners. The company’s offerings are rounded off by
  attractive interest rates, loans, and private equity. With
  the European Investor Exchange, Scalable Capital offers an
  exchange specifically for retail investors. Over one million
  clients have already entrusted more than €50 billion to the
  platform.

  Founded in 2014, Scalable Capital now employs over 700
  people across Munich, Berlin, Vienna, Milan, and London.
  Together with the founding and management team, including
  Erik Podzuweit and Florian Prucker, they are working on a
  new generation of financial services.

  Visit our finance blog or check out our Social Media
  channels to find out what our Expert Teams have to say.

  Our Company Values guide us every day in how we work and
  collaborate. To learn more about them, you can find our
  values here (English).

  Job Description

  This role can be based in either Berlin or Munich.

  You will join the Client Technology Tribe which provides
  state-of-the-art security to our clients in all aspects of
  authentication and to maintain and enhance identification
  processes through KYC. We ensure a convenient and legally-
  secure T&C consent process, as well as GDPR-compliant data
  processing throughout the entire client journey. We are
  dedicated to developing and maintaining the Salesforce
  platform to improve our Marketing communication channels and
  client support process efficiency, and to maintaining and
  improving our public website.

  Client Technology aims to simplify complexity for our
  clients and continuously improve their experience in any
  interaction with us. Our ultimate goal is to ensure that
  Scalable is regarded as the most trusted brand in finance.


  - Work with highly motivated software engineers and academics
    implementing change in the financial industry
  - Work with cutting edge technologies and be part of modern
    software development practices (e.g. agile and self-
    managed teams, continuous integration and deployment, test
    automation, cloud-based infrastructure and tooling)
  - Engage with our cloud-native, DevOps-enabled infrastructure,
    utilizing AWS services like ECS, Fargate, and Lambda
  - Write clean, testable, maintainable and well-documented code
    and treat security as a first class citizen
  - Bring products to production and reveal real business value
  - Be able to improve engineering excellence in the team

  Qualifications

  - A university degree in a relevant field of study (Computer
    Science, Engineering, etc.) or a comparable practical
    experience
  - Extensive experience of backend experience in Java/Kotlin,
    JWT, Docker, Spring, AWS, Git, Docker,  GraphQL, RESTful
    API, Databases (SQL, NoSQL)
  - A passion for well architected, testable and documented code
    and an agile mindset
  - Strong analytical thinking, both in the technical and in the
    product domain.
  - Experience in complex software projects with end-to-end
    ownership building Microservices
  - Practical experience in AWS or another cloud provider
  - Good communication skills that are clear, open and concise,
    professional proficiency in English
  - Previous experience with security topics and/or DevOps
    experience is a big advantage
  - Background in the financial industry and financial software
    product development is an advantage

  Additional Information

  - Be part of one of the fastest-growing and most visible
    Fintech startups in Europe, creating innovative services
    that have a substantial impact on the lives of our
    customers
  - Work with an international, diverse, inclusive, and ever-
    growing team that loves creating the best products for our
    clients
  - Work from our centrally located offices in the heart of
    Munich or Berlin, nestled in lively neighborhoods filled
    with vibrant restaurants, cozy cafés, and a wide range of
    convenient amenities
  - Be productive with the latest hardware and tools
  - Learn and grow by joining our in-house knowledge sharing or
    career development sessions and spending your individual
    Education Budget
  - Learn and experience German culture first hand by joining
    our free German language classes
  - International relocation support is provided if required
  - Opportunity to work from abroad
  - Benefit from an attractive compensation package and from the
    company pension scheme
  - Monthly contribution of 50% for the ‘Deutschland Jobticket’
  - Say goodbye to order commissions and say hello to your
    complimentary subscription of Scalable Capital's PRIME+
    Broker
  - Enjoy flexible and discounted sports activities with Urban
    Sports Club
