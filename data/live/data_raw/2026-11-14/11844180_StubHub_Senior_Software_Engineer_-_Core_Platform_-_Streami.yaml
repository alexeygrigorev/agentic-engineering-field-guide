title: "Senior Software Engineer - Core Platform - Streaming & Storage"
company: StubHub
location: New York, USA
work_type: FULL_TIME
company_size: 1,000 Employees
description: |
  StubHub is on a mission to redefine the live event
  experience on a global scale. Whether someone is looking to
  attend their first event or their hundredth, we’re here to
  delight them all the way from the moment they start looking
  for a ticket until they step through the gate. The same goes
  for our sellers. From fans selling a single ticket to the
  promoters of a worldwide stadium tour, we want StubHub to be
  the safest, most convenient way to offer a ticket to the
  millions of fans who browse our platform around the world.

  About the Role:

  We are seeking a Senior Software Engineer to join our Core
  Platform - Streaming & Storage team. In this role, you will
  design, build, and evolve the streaming, messaging, and
  storage platforms that serve as critical infrastructure for
  StubHub’s engineering organization. As a Senior Software
  Engineer, you will lead the design and delivery of scalable
  platform capabilities, partner with engineering teams on
  their most complex performance and reliability challenges,
  and help modernize services that operate at the core of
  StubHub’s distributed systems. You will also play a key role
  in decomposing large monolithic SQL Server data stores into
  more purpose-built storage systems, supported by mature
  streaming solutions and reliable data access layers.



  About the Team:  The team owns foundational products
  including message queues, DQL, retry infrastructure, message
  versioning, messaging control planes, and storage platforms
  such as key-value databases, distributed caches, and blob
  storage. These systems are used across engineering to
  support high-scale, reliable, event-driven services and
  business-critical workflows across listings, transactions,
  fulfillment, and customer experiences. This role is ideal
  for an engineer who enjoys solving deep infrastructure and
  backend problems, setting technical direction, influencing
  architecture across teams, and delivering platform
  capabilities that create measurable business impact.



  Location: Hybrid (3 days in office/2 days remote) – Century
  City, CA or Aliso Viejo, CA or New York, NY

  What You'll Do:

  - Design and develop SDKs, services, shared packages, and
    tools to enhance engineering efficiency and productivity.
  - Develop an intuitive cross-language performant runtime
    environment that will serve as a "container" for
    business/customer-facing services
  - Architecting and implementing high-performance, scalable
    services actively used by internal customers.
  - Serve as a subject matter expert (SME) in distributed
    caching and messaging, with a deep understanding of
    associated design patterns.
  - Collaborate closely with engineering teams as your
    customers, identifying technical inefficiencies and
    proposing scalable solutions and engineering patterns.
  - Drive initiatives to improve performance and scalability
    across our platform.
  - Champion best practices in software development, ensuring
    high standards of quality and efficiency.
  - Ability to thrive in a fast-paced environment and manage
    multiple priorities effectively.
  - Commitment to fostering a positive and inclusive team
    culture where diverse perspectives are valued.

  What You've Done:

  - 5-6+ years of professional experience in software
    development
  - Experience with developing robust, mission-critical systems
    using one or multiple general-purpose programming
    languages (e.g., C/C++, Java, C# or any other OOP
    language)
  - Expertise in designing and optimizing distributed systems,
    including microservices architectures, caching strategies,
    and message queuing systems.
  - Demonstrated ability to analyze and enhance system
    scalability, reliability, and performance metrics.
  - Previous experience designing and developing solutions to
    complex problems with significant business impact
  - A strong understanding of how their systems interact with
    the broader production environment, including dependencies
    and platform primitives
  - Proven ability to learn other coding languages, platforms,
    frameworks, and tools
  - Strong communication skills and the ability to collaborate
    effectively with cross-functional teams.
  - Experience owning projects from the initial idea all the way
    to production
  - Experience mentoring junior engineers

  What We Offer:

  - Accelerated Growth Environment: An environment designed for
    swift skill and knowledge enhancement, where you have the
    autonomy to lead experiments and tests on a massive scale.
  - Top Tier Compensation Package: Competitive base, equity, and
    upside that tracks with your impact.
  - Flexible Time Off: Enjoy unlimited Flex Time Off, giving you
    the flexibility to manage your schedule and take time to
    recharge as needed.
  - Comprehensive Benefits Package: Prioritize your well-being
    with a comprehensive benefits package, featuring 401k, and
    premium Health, Vision, and Dental Insurance options.

  The anticipated gross base pay range is below for this role.
  Actual compensation will vary depending on factors such as a
  candidate’s qualifications, skills, experience, and
  competencies. Base annual salary is one component of
  StubHub’s total compensation and competitive benefits
  package, which includes equity, 401(k), paid time off, paid
  parental leave, and comprehensive health benefits.

  Salary Range

  $200,000—$250,000 USD

  About Us

  StubHub is the world’s leading marketplace to buy and sell
  tickets to any live event, anywhere. Through StubHub in
  North America and viagogo, our international platform, we
  service customers in 195 countries in 33 languages and 49
  available currencies. With more than 300 million tickets
  available annually on our platform to events around the
  world -- from sports to music, comedy to dance, festivals to
  theater -- StubHub offers the safest, most convenient way to
  buy or sell tickets to the most memorable live experiences.
  Come join our team for a front-row seat to the action.



