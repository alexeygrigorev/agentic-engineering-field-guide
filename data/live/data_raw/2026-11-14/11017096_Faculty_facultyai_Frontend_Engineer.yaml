description: |
  Why Faculty?

  We established Faculty in 2014 because we thought that AI
  would be the most important technology of our time. Since
  then, we’ve worked with over 350 global customers to
  transform their performance through human-centric AI. You
  can read about our real-world impact here.

  We don’t chase hype cycles. We innovate, build and deploy
  responsible AI which moves the needle - and we know a thing
  or two about doing it well. We bring an unparalleled depth
  of technical, product and delivery expertise to our clients
  who span government, finance, retail, energy, life sciences
  and defence.

  Our business, and reputation, is growing fast and we’re
  always on the lookout for individuals who share our
  intellectual curiosity and desire to build a positive legacy
  through technology.

  AI is an epoch-defining technology, join a company where
  you’ll be empowered to envision its most powerful
  applications, and to make them happen.



  About the team



  Our National Security and AI Safety business unit is
  dedicated to advancing the responsible development and
  deployment of AI in support of national security and global
  stability. From strengthening mission-critical capabilities
  across national security and intelligence, to working with
  frontier labs to provide robust AI safety red teaming and
  evaluation, we work at the frontier of high-stakes, high-
  impact missions.  We understand that powerful AI systems
  bring both transformative opportunities and complex risks
  and we are proud to partner with Government and the biggest
  tech organisations in the world to ensure AI is not just
  transformative but is also secure, trustworthy and safe for
  all. Because of the nature of the work we do with our
  Government clients, you may need to be eligible for UK
  Developed Vetting (DV) and willing to work on site with our
  clients from time to time.





  About the role



  As a Frontend Engineer, you'll be instrumental in
  visualising insights generated by our data scientists for
  our clients. Working closely with cross-functional delivery
  teams, especially within the Government & Public Services
  Business Unit, you will help solve unique challenges using
  AI and Machine Learning.



  We're looking for an entrepreneurial technologist to drive
  industry best practices and standards within our evolving
  frontend guild and bring Faculty's machine learning work to
  life.





  What you'll be doing:



  - Collaborating closely with data scientists, data engineers,
    and design specialists to build client-facing products
  - Prioritisation, planning, coordination, and communication of
    frontend features to internal and external stakeholders
  - Setting up and maintaining the development and deployment
    infrastructure for your dedicated frontend team
  - Maintaining and enforcing the technical best practices and
    standards across Faculty's entire frontend capacity
  - Creating and maintaining reusable component libraries for
    use in projects company-wide
  - Providing training, mentoring, and onboarding support for
    new frontend engineers
  - Acting as the go-to authority for frontend software
    engineering within your team





  Who we're looking for:



  - You have demonstrated experience in building scalable,
    maintainable, and well-tested web applications using React
  - You are highly proficient in foundational web technologies,
    including ES6 JavaScript, HTML, and CSS3
  - You have hands-on experience writing TypeScript or other
    typed languages, contributing to robust codebases
  - You are experienced in data visualisation techniques and
    implementations, such as d3, to bring data to life
  - You have exposure to deployment into the Cloud with
    platforms such as AWS, GCP, or Azure
  - You possess a strong focus on technical excellence, eager to
    set standards and mentor others to build a collaborative,
    high-performing culture



  Our Interview Process



  - Talent Team Screen (30 minutes)
  - Pair Programming Interview (90 minutes)
  - System Design (90 minutes)
  - Commercial Interview (60 minutes)

  Our Recruitment Ethos

  We aim to grow the best team - not the most similar one. We
  know that diversity of individuals fosters diversity of
  thought, and that strengthens our principle of seeking
  truth. And we know from experience that diverse teams
  deliver better work, relevant to the world in which we live.
  We’re united by a deep intellectual curiosity and desire to
  use our abilities for measurable positive impact. We
  strongly encourage applications from people of all
  backgrounds, ethnicities, genders, religions and sexual
  orientations.

  If you don’t feel you meet all the requirements, but are
  excited by the role and know you bring some key strengths,
  please don't hesitate in applying as you might be right for
  this role, or other roles. We are open to conversations
  about part-time hours.

  A note on AI: we're happy for you to use it for research and
  interview prep, but please don't use it to generate answers
  during live interviews. We also use an AI note-taker
  (Metaview) in interviews so interviewers can stay present
  (which you can opt out of just let us know,) and every
  application is reviewed by a human, never decided by AI.
