description: |
  YOUR ROLE Our mission involves constructing a cloud-native
  insurance infrastructure where human expertise and
  artificial intelligence synergize to develop, manage, and
  scale complex financial products. While legacy insurance
  environments are often hindered by rigidity, we aim to
  deliver a programmable, version-controlled architecture that
  empowers engineers and autonomous systems to operate with
  high efficiency and safety. In your capacity as an
  Engineering Manager (f/m/d/x), you will lead the development
  of our core platform and engineering culture. Your focus
  will be on building high-performing, autonomous teams,
  fostering technical excellence, and aligning engineering
  execution with strategic business goals to drive the
  delivery of our next-generation financial infrastructure.
  This position represents a unique nexus of platform
  engineering, sophisticated domain modeling, and the next
  generation of AI-driven software development. WHAT YOU WILL
  BE CHALLENGED WITH * Leading and developing a team of
  software engineers working on distributed microservices in a
  fast-paced SaaS environment * Promoting individual
  development and fostering a healthy, inclusive team culture
  * Partnering closely with Product, your Team Lead, Delivery
  Manager and other Engineering Managers to ensure alignment
  on priorities and roadmap delivery * Driving team delivery:
  designing and improving how the team plans, commits and
  ships; facilitating planning together with the Delivery
  Manager; unblocking the team and making delivery
  predictable. * Coaching, mentoring and supporting engineers
  in their growth through continuous feedback and structured
  development plans * Helping shape and steward long-term
  engineering practices in collaboration with Staff Engineers
  and senior leadership * Contributing to hiring efforts,
  onboarding programs and building a strong, diverse
  engineering organisation * Identifying and removing systemic
  bottlenecks in how your team works, and improving
  communication with the teams you depend on WHAT WE ARE
  LOOKING FOR * Proven experience leading and growing
  engineering teams through coaching, feedback and clear
  expectation-setting * Strong understanding of engineering
  fundamentals (software architecture, microservices, cloud-
  native systems) and the ability to support technical
  discussions * Experience with Agile delivery practices
  (Scrum or Kanban) and a track record of improving team
  effectiveness * A track record of changing how a team works,
  not just running the process it already has and the habit of
  knowing what you'd measure to tell whether the change worked
  * Ability to balance people leadership, delivery management
  and long-term strategic thinking * Strong communication
  skills with the ability to influence across teams and
  collaborate with product-oriented stakeholders * A great
  passion for enabling others to succeed, building teams and
  fostering a healthy engineering culture * Experience with
  Typescript, Python or Go are a plus * Fluency in English,
  both written and spoken; German is a plus WHAT WE OFFER * An
  attractive salary package based on your experience,
  qualifications and responsibilities * A hybrid working model
  with the option of working remotely or from our office in
  Berlin-Mitte * 30 days of holiday leave, plus extra half-
  days off on 24 and 31 December * A personal training budget
  of at least €500, or more if necessary, which we will invest
  together in your further development * Exciting
  opportunities for internal development through a fixed role
  development model, fixed feedback cycles and performance
  reviews. * A company subsidy for Urban Sports Club
  membership to support your well-being outside of work * A
  generously subsidised company pension scheme, which we use
  to work together to make optimal provisions for your future
  * A VSOP programme that lets you benefit from the company's
  success additionally * We provide you with modern hardware;
  you decide whether you want Windows or iOS * With weekly
  company lunches and a well-stocked snack bar, everything you
  need for a quick bite to eat is right there * As part of a
  dynamic and motivated team of experts, you benefit directly
  from the knowledge of your colleagues, because team spirit
  and mutual support are an essential part of our culture
