description: |
  🎯 The Role

  We're hiring a Software Engineering Intern! This is a short
  term placement for students or recent graduates who
  demonstrate outstanding intelligence, motivation, and work
  ethic. The kind of person who raises the bar just by being
  in the room, even this early in their career.

  You'll tackle real engineering problems, not busywork.
  Problems where creativity, first-principles thinking, and
  relentless iteration matter more than years of experience.
  You'll work alongside senior engineers who will mentor and
  challenge you, while contributing meaningfully from day one,
  with a dedicated engineering mentor for the length of the
  placement.

  AI is central to how we build. You'll use AI-assisted
  development tools (Cursor, Claude Code, GitHub Copilot)
  daily to accelerate your work, and you'll contribute to AI-
  powered product features that differentiate Fanvue in the
  market.

  🚀 What You'll Do

  - Own and deliver well-scoped features end-to-end across our
    TypeScript/Node.js/Go (nice to have) stack, with mentor
    support
  - Contribute to real, shipped product work, not a side project
    or sandbox
  - Build AI-powered features for creators (automated chat,
    content generation, personalization, moderation)
  - Leverage AI coding tools to ship faster. We expect you to be
    fluent in AI-assisted development, or fast to become so
  - Experiment with LLMs, embeddings, and vector databases as
    part of product development
  - Ship fast, iterate based on feedback, and learn from
    production
  - Collaborate closely with product, design, and senior
    engineers
  - Sit in on architecture discussions and technical decisions
    to learn how we think, not just how we code
  - Participate in code reviews and absorb our engineering best
    practices
  - Present your work at the end of the placement

  👀 Who You Are

  - Exceptionally intelligent and motivated: you learn fast and
    apply knowledge immediately
  - High agency: you don't wait to be told what to do; you
    identify problems and solve them
  - Solid fundamentals in software engineering (data structures,
    algorithms, basic system design) from your degree,
    projects, or self-study
  - Proficient in TypeScript/JavaScript, or a strong enough
    general programming foundation to get there fast;
    experience with Node.js, React, or Next.js is a plus
  - Comfortable using AI coding assistants (Cursor, Copilot,
    Claude) or eager to become fluent
  - Curious about LLMs, prompt engineering, and AI product
    development
  - Genuinely excited by hard problems: you'd rather work on
    something challenging than something easy
  - Relentless work ethic — you ship, you iterate, you improve
  - Humble and coachable — you seek feedback and act on it
  - Currently studying towards, or recently completed, a
    Computer Science or related degree (or equivalent via
    personal projects, open source, bootcamps, etc.), no
    professional experience required

  ✨ You'll Thrive Here If

  - You want to prove yourself fast and are hungry for real
    responsibility, not a token project
  - You prefer ambiguity and ownership over well-defined tasks
  - You're energized by working alongside exceptional people
  - You care about impact, not titles
  - You're excited about building AI-native products

  ⚠️ You'll Struggle Here If

  - You need detailed specifications before starting work
  - You prefer predictable, routine work
  - You're not comfortable with fast feedback and iteration
  - You're skeptical about AI tools or resistant to using them
  - You're looking for a purely observational or shadowing-style
    internship
