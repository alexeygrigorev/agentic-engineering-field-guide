description: |
  Company Description

  ABOUT CRATE.IO

  We are about building a new kind of data store: a zero
  administration data store that is massively scalable and
  dead simple to use.

  BE OPEN AND OPEN SOURCE

  We have a strong open source background, mainly through
  Plone and Zope. We believe that open software is better
  software, and we have seen time and time again how openness
  enables organizations to achieve extraordinary outcomes with
  their data. Crate's ability to rapidly build and ship
  innovative software owes a great deal to the availability of
  high-quality open-source software that is freely available
  to integrate as components of larger works.

  A few high profile modules power various pieces of our
  technology stack, namely Lucene, Netty, Elasticsearch and
  Facebook Presto. Crate.IO delivers its software as Open
  Source, accessible at public open source repository on
  GitHub. Going forward, we will continue to release open
  source components of our software and make them available to
  the public.

  WHY WE BUILT CRATE

  Crate.IO was founded in 2013 by Jodok Batlogg, Christian
  Lutz and Bernd Dorn. Our prior experience was all about
  working with large data sets and setting up the elements to
  support them. Our experience taught us to pay attention to
  ease of use, from simple installation to painless operation
  of huge clusters. Data stores should be simple for
  developers to use. Big Data mountains grow everywhere. Yet
  it is still difficult to design, develop and operate back-
  end services that truly scale. Underlying traditional
  databases don’t scale well; solutions are expensive.

  There is a human factor at play, too. Finding devops
  personnel with extended cluster management and big data
  experience is difficult and costly. We offer a cluster
  software stack for querying, storing and searching the
  world’s information. We support many kinds of data including
  structured, unstructured, relational, temporal and
  geospatial, and Crate Data REALLY scales well. Our product
  is built with a focus on scalability, ease of use,
  collaboration and integration.

  Crate is already deployed in e-commerce, startup, mobile
  app, automotive and internet of things companies, and is
  spreading rapidly. We are deeply passionate about building
  great software and a successful company.

  Job Description

  Crate’s software engineers develop this next-generation data
  store, a unique combination of a powerful distributed
  database that can be installed, operated and programmed very
  easily. Our ambitions reach out to allow any developer to
  run and maintain a highly available backend as simple as
  running an app server. As a software engineer, you work on a
  small team and directly impact the future of the product. We
  need our engineers to be versatile and always eager to
  tackle new problems as we continue to push technology
  forward.

  As a key member of a our team, you design, test, deploy and
  maintain software solutions in a fast paced startup based in
  Berlin, Dornbirn (Austria) and San Francisco.

  LOCATIONS:

  Berlin, Germany or Dornbirn, Austria

  YOUR RESPONSIBILITIES

  • Write code for the core of our new generation of
  distributed database

  • Implementation of high-performance “shared-nothing” Java
  components

  • Planning and development in the Scrum team

  Qualifications

  MUST HAVE

  • Extensive professional experience as developer

  • Solid knowledge and practical experience with Java

  • You have fun working on new and edgy stuff

  PREFERRED QUALIFICATIONS

  • A solid foundation in computer science, with strong
  competencies in data structures, algorithms, and software
  design

  • Experience with test driven development, asynchronous
  programming, Netty, Elasticsearch, Lucene, Big Data and Map
  Reduce (Hadoop, Hive, Presto, Pig), databases (Postgres,
  MySql, Oracle, …), Scrum

  • Open Source Contributions (if applicable, please send us
  your Github Account etc.)

  Additional Information

  OUR HIRING PROCESS

  1. We screen your profile to see if it has what we’re
  looking for

  2. If it does, we offer you a Skype interview (most likely
  with our Head of Development Bernd Dorn)

  3. After that we might do another Skype call with one of our
  CEOs (Christian Lutz and Jodok Batlogg)

  4. The third round consists of a face-to-face interview in
  one of our offices in Berlin, Dornbirn or San Francisco

  5. If all goes well and we think you’re a good fit we will
  make you an offer

  We try hard to make this process as quick and smooth as
  possible. After receiving an application we try to reply
  within 1 week. The entire process usually will not take
  longer than 1 month.
