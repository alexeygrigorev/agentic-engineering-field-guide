description: |
  QED (https://qed.ai) is a tech company focused on public
  health, agricultural security, and education in Sub-Saharan
  Africa. We build the digital infrastructure and AI used at
  the intersection of aid and scientific inquiry, including
  surveillance of HIV and malaria, and nutrient analysis of
  crops and soils, working at national-scale in multiple
  African countries. Our funding comes from philanthropic and
  governmental organizations, such as the Global Fund and the
  Gates Foundation.

  We are looking for a software engineer to join our
  Innovation Lab, a special projects division that focuses on
  rapid prototyping and R&D. We build new products to disrupt
  the status quo and remind everyone what tech was made for
  --- improving the lives of everyday people!

  Basic Requirements

  - Ability to conceive logical software architectures and
    express yourself clearly, both verbally and in writing
  - Highly preferred full-time employment of at least 40 hours
    per week.
  - +3 years of experience with software engineering in a
    professional environment requiring strict code review
  - +2 years of experience with modern software engineering with
    AI tools
  - Good fluency in English speaking and writing, or you can use
    AI to write it quick too.
  - Critical thinking skills, expressiveness, and team-oriented
    attitude.
  - Possession or pursuit of a degree in computer science or
    software engineering, or comparable professional
    experience.
  - Basics of efficient algorithms and data structures.
  - Willingness to participate in regular code reviews, using
    disciplined version control, and working in teams.
  - Development primarily on UNIX-based or OSX-Darwin platforms.
  - You have to care about the work that you do!

  Nice to haves

  - +10 years of experience with software engineering in a
    professional environment requiring strict code review
  - Willingness to travel and go on an adventure! By visiting
    Africa, you can better understand the context of the
    problems we aim to solve.
  - Experience with Django, React, Android, or PyTorch.
  - Proficiency with software design patterns.
  - Experience with programming and/or math competitions.
  - Genuine interest in positive applications of tech for
    medicine and agriculture and education.
  - Experience with ethical hacking and computer networking is
    useful
