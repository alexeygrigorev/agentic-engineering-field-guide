description: |
  About the Company

  Valon is the leading AI platform for mortgage servicing,
  building the AI-native operating system for regulated
  finance.

  Before providing the system of record that powers the entire
  industry, we built and ran our own mortgage servicer on it.
  That gave us a real regulated environment to prove our
  technology could replace the mainframe systems servicers
  have used for decades. Carrington acquired that servicer and
  adopted ValonOS as its core platform, allowing us to focus
  entirely on scaling our SaaS platform.

  ValonOS is now on track to power 1 in 6 U.S. mortgages
  across major mortgage servicers like Newrez, Carrington, and
  ServiceMac. Every process on the platform is structured and
  programmable, enabling our AI agents to perform core
  servicing work, like handling payments, escrow, and
  homeowner questions, directly within the system's controls.

  We recently raised a $150 million Series D at a $2.3 billion
  valuation by new investor Ribbit Capital, with continued
  support from existing backer a16z, amongst others.

  Engineering at Valon

  We are building a world-class engineering team to automate
  one of the most regulated spaces in the financial sector -
  the mortgage and housing industry. We come from companies
  like Google, Facebook, Spotify, Oscar Health, and Twilio.
  You’ll join a small, tight-knit group of engineers who are
  developing flexible backend architecture to accurately
  handle billions of dollars at scale. In addition, our team
  of engineers is fulfilling Valon’s mission by creating a
  great user experience to help homeowners manage their
  mortgages through a platform that delivers new features
  quickly and with quality. Our tech stack is built on Python,
  React, Docker, Kubernetes, and Google Cloud Platform.

  We have offices in New York City and San Francisco. Plus, we
  fully support remote work!

  Responsibilities

  - Learn new concepts and technologies quickly and apply them
    to challenging problems
  - Design and build robust and extensible infrastructure to
    handle evolving and complex federal, state, and agency
    regulations
  - Dive deep to understand the inner workings of a highly
    complex industry
  - Work with Product and Design to define the best experience
    for our customers

  Ideal Background

  - 7+ years of software engineering experience building quality
    software applications at scale
  - Strong communicator
  - Able to work cross-functionally to balance product and
    technical requirements
  - Great at building scalable systems from scratch with a fast
    turnaround
  - Experience with one or more of the following: web
    application development, mobile application development,
    building large-scale distributed systems, or
    infrastructure management
  - Time management skills that will maximize efficiency in a
    fast-paced startup environment

  Benefits

  - Compensation: competitive salary with a meaningful stake in
    the company via equity, and 401(k) plan. The base salary
    range reflects multiple levels. We assess level based on a
    combination of experience and interview performance.
  - Health & well-being: we’ll invest in your physical and
    mental well-being with comprehensive medical, dental, &
    vision benefits.
  - Free Food: daily lunch, and dinner provided through Forkable
    for in-office team members.
  - Commuter benefits: pre-tax deductions for public transit,
    rideshares, and parking to simplify your daily commute.
  - Grow together: company wide orientation for you to
    successfully onboard and other learning & development
    opportunities including regular review cycles that feature
    360-degree feedback.
  - Play together: quarterly budgets for team and company
    outings. Use it for team swag, cooking classes, or team
    dinners.
  - Generous time off: flexible paid time off with no annual
    limit, sick days, and 11 company holidays.
  - Baby bonding time: 12 weeks of fully paid leave for both
    birthing and non-birthing parents, so you can spend
    uninterrupted time welcoming and caring for your newest
    family member.

  Throughout the interview process, please remember that
  emails will only be from valon.com email addresses. We will
  never ask for any personally identifiable information during
  the interview process itself. Please reach out to
  talent@valon.com if you have any requests to verify the
  authenticity of an outreach.

  Valon is an equal opportunity employer that is committed to
  diversity and inclusion in the workplace. We prohibit
  discrimination and harassment of any kind based on race,
  color, sex, religion, sexual orientation, national origin,
  disability, genetic information, pregnancy, or any other
  protected characteristic as outlined by federal, state, or
  local laws. Valon makes hiring decisions based solely on
  qualifications, merit, and business needs at the time.
