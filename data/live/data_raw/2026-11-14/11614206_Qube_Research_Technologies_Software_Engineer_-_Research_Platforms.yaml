description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology- and
  data-driven group implementing a scientific approach to
  investing. Combining data, research, technology, and trading
  expertise has shaped our collaborative mindset, which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high-quality returns for our investors.

  You will join the Data Engineering team, which builds
  software that enables Quantitative Researchers to access and
  use data across cloud and on-premises computing
  environments. The team works with other engineering groups
  to support data-intensive research workloads.

  Your Future Role within QRT

  You will:

  - Design, build and operate distributed software that manages
    data across research environments.

  - Enable reliable and efficient data access for large-scale
    compute workloads.

  - Address challenges involving data movement, locality,
    performance and scale.

  - Develop services and tooling used by Quantitative
    Researchers and engineering teams.

  - Improve the security, observability and resilience of data
    systems.

  - Work with researchers and engineers to understand
    requirements and deliver practical solutions.

  - Own systems from design and implementation through
    production operation.

  Your Present Skillset

  - At least five years of experience building and operating
    production software systems.

  - Strong software engineering skills in Go, Python, C++, Rust,
    Java or a similar language.

  - Experience designing distributed systems at scale, with an
    understanding of performance, concurrency, fault tolerance
    and reliability.

  - Experience building services or platforms used by other
    engineers.

  - Knowledge of large-scale storage, data movement, or data-
    intensive computing workloads.

  - Understanding of how storage and networking affect
    distributed system performance.

  - Experience working across cloud and on-premises
    environments.

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
