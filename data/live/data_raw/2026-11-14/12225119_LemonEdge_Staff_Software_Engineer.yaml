description: |
  Application deadline: December 20, 2026. Applications will
  be reviewed on a rolling basis, and the deadline may be
  extended.

  About the role

  We're looking for a Staff Software Engineer to help shape
  the future of our platform and guide the technical decisions
  that will support its continued growth.

  This is a role for an experienced engineer who thrives on
  complexity, brings clarity to ambiguous problems and can
  translate business priorities into sound architectural
  decisions. You'll influence technical direction across
  teams, establish engineering standards and help others make
  better decisions, while remaining close enough to the
  technology to challenge assumptions and guide
  implementation.

  This is a full-stack position with a strong backend focus
  (approximately 75% server-side C#/.NET and 25% frontend
  across our WPF desktop and React web applications).

  What you'll be doing

  - Set technical direction: Establish architectural principles
    and guide the evolution of your team's systems, ensuring
    technical decisions support both immediate priorities and
    long-term business objectives.

  - Navigate complexity: Take ownership of ambiguous, high-
    impact problems, bring structure to competing priorities
    and make informed decisions even when information is
    incomplete.

  - Shape the architecture:Determine how systems and services
    should be structured, balancing scalability,
    maintainability, performance and operational cost. Know
    when to introduce new capabilities and when simpler
    solutions are better.

  - Protect financial integrity: Define and champion the
    standards that ensure critical calculations and financial
    processing are accurate, consistent, traceable and capable
    of standing up to audit and scrutiny.

  - Raise engineering capability: Mentor engineers across the
    team, encourage strong technical practices, lead by
    example in design discussions and code reviews, and
    contribute to hiring and developing engineering talent.

  - Influence beyond engineering: Partner with Product and
    senior leadership on technical strategy, roadmap
    priorities and trade-offs. Communicate architectural
    decisions clearly and represent engineering in client and
    business discussions.

  - Drive continuous improvement:Identify architectural risks,
    technical debt and opportunities to improve system
    reliability, performance and engineering efficiency.

  What makes you a great fit

  - Extensive experience designing, developing and operating
    production software, with a proven track record of
    influencing technical direction across engineering teams.

  - Deep backend engineering expertise, ideally with C#/.NET,
    alongside practical knowledge of another area such as data
    architecture, frontend development or cloud
    infrastructure.

  - Experience designing systems where data accuracy,
    consistency and traceability are critical, particularly in
    financial or similarly complex processing environments.

  - A strong understanding of distributed systems, software
    architecture, database design, scalability and system
    performance.

  - Demonstrated ability to mentor engineers, influence
    technical standards and contribute to recruitment and team
    development.

  - Confidence making complex technical decisions, explaining
    trade-offs and gaining alignment across engineering,
    product and business stakeholders.

  - Strong written and verbal communication skills, including
    the ability to document architectural decisions and
    present technical recommendations to senior leadership.

  - Sound judgment in balancing consistency across systems with
    the flexibility to choose the right solution for
    individual problems.

  Bonus points if you bring

  - Experience in private markets, fund administration, fund
    accounting, fintech or regulated financial services.

  - Experience leading significant architectural
    transformations, platform migrations or service
    extractions across multiple teams.

  - A track record of producing design documents, technical
    proposals and RFCs that drive meaningful decisions.

  - Experience participating in client-facing architecture
    discussions, technical due diligence or strategic
    technology reviews.

  - Frontend expertise, particularly WPF or React, enabling you
    to influence decisions across the full technology stack.

  - Experience designing agentic workflows or integrating AI-
    driven capabilities into products, including understanding
    where they deliver genuine value.

  - Previous experience in an early-stage or high-growth
    technology business, where you've helped establish
    engineering practices and technical foundations.

