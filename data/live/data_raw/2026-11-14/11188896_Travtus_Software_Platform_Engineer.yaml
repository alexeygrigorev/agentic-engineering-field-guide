  Software Engineer (Application platforms/AWS/Python)

  London (On-site, London Farringdon office)

  Full-time, salary: £60,000-80,000

  Job Summary

  Are you passionate about architecting the data and
  application platform that powers the next generation of AI
  products? Do you thrive on creating reusable frameworks and
  APIs that make entire engineering teams more productive? If
  you’re excited to help build the backbone of advanced AI-
  driven solutions in Multifamily real estate, read on…

  About Travtus

  Travtus is transforming the Housing Industry with our
  Everyday (AI)™ platform. We bring intelligence and
  automation together in one place so teams can move faster
  and work smarter. By delivering everyday AI decisions and
  workflows across the systems operators already use daily,
  our platform improves efficiency while enhancing the
  resident experience.

  About the Role

  As a Platform Software Engineer, you will focus on building
  the shared platform layer that underpins our entire AI
  solution suite. You will create frameworks, services, data
  pipelines and APIs that enable high-volume data products.

  Whether you are implementing business logic or enabling
  seamless integration with both internal and external
  systems, your work is critical to the success of the
  business. With direct impact on all products, your work
  helps to accelerate development and ensure reliability,
  scalability, and security of our common platform.

  You'll be collaborating closely with other engineers to
  evolve our core platform, introduce best practices, and
  mentor peers in building industrial-strength services.

  Most of all, you will enjoy working with a great team and be
  passionate about the work you do.

  Responsibilities

  Our Platform Software Engineers work across the technical
  stack, designing and implementing the solutions that enable
  Product Engineers to create new applications.

  Tasks include:

  - Architect, develop, and maintain shared services,
    frameworks, data pipelines, and APIs in Python, enabling
    reuse and speeding up feature delivery for product teams.
  - Design scalable systems for data ingestion, storage, and
    processing, supporting multi-tenant requirements and
    common analytics needs.
  - Build frameworks that streamline integration with third-
    party APIs and internal microservices, abstracting
    complexity from product engineers.
  - Lead initiatives to standardise and document platform
    interfaces, promoting consistency and discoverability for
    developers.
  - Embed security, observability, and compliance into all
    shared services and workflows.
  - Collaborate with application teams to identify gaps in the
    platform and prioritise new features or improvements.
  - Drive adoption of best practices in testing, CI/CD, and
    platform monitoring.
  - Mentor engineers in platform development, code quality, and
    the effective use of shared services.

  Requirements

  We are looking for an enthusiastic individual with a strong
  passion for technology who thrives on meeting challenges
  collaboratively and is passionate about using AI.

  Must-have experience

  - Extensive experience developing backend software, APIs, and
    reusable components in Python.
  - Experience architecting and scaling SaaS solutions using AWS
    components (Lambda, API Gateway, RDS, S3, Cognito, etc.).
  - Solid understanding of API security.
  - Enthusiasm for driving developer productivity through great
    platform and framework design and documentation.
  - Experience in data platform engineering (pipelines,
    transformation, real-time processing)
  - Familiarity with microservices and SOA, including event-
    driven architectures

  Nice to have experience

  - Whilst AI development or integration experience is not
    essential, you should have more than an interest in AI and
    how it can be applied effectively in your work.
  - TDD and/or contract testing for platform reliability, CI/CD,
    and platform monitoring.

  About the Team

  We are a dedicated team, working in a truly collaborative
  style, where everyone is heard and brings something valuable
  to the conversation. Constantly pushing boundaries to create
  groundbreaking solutions for our customers. We are
  fundamentally challenging the way one of the largest
  industries in the world operates, and our commercial success
  pays testament to the skill, commitment and passion that our
  team displays every day.

  Working together in person fuels our best ideas and
  innovations, which is why all team members work face to face
  in our London office.

  Benefits

  - Be part of a growing, mission-driven startup with global
    ambitions
  - Exposure to cutting-edge AI technology in a practical, high-
    demand sector
  - Collaborative, fast-paced team culture with space to
    innovate and grow
  - Full-time, salary: £60,000-80,000 (experience dependent)
  - In-office working model with a modern London office
    (Farringdon)
  - Private Healthcare
  - Pension
  - Deliveroo Allowance

  Help us shape the future of technology. Apply Now!
