description: |
  Who We Are

  Imagine Pediatrics is a tech enabled, pediatrician led
  medical group reimagining care for children with special
  health care needs. We deliver 24/7 virtual first and in home
  medical, behavioral, and social care, working alongside
  families, providers, and health plans to break down barriers
  to quality care. We do not replace existing care teams; we
  enhance them, providing an extra layer of support with
  compassion, creativity, and an unwavering commitment to
  children with medical complexity.

  What You'll Do

  As Principal Software Engineer with Imagine Pediatrics, you
  will shape technical strategy across engineering, serving as
  a trusted technical advisor to engineering leadership. You
  will operate cross-team, explore early-stage ideas before
  they’re resourced, and enable teams to raise the bar on how
  we build our digital product suite for our clinical team and
  our members. You will report to a Director-level or above
  engineering leader. You will:

  - Lead the solutioning, planning, and execution of long-term
    technical strategy, translating business and clinical
    goals into a technical vision for the organization
  - Define architectural standards and drive long-term
    architectural strategy across the organization
  - Act as a trusted technical advisor to engineering leadership
    and executives, shaping strategy and presenting
    recommendations to VPs and the CTO
  - Explore early-stage ideas and proofs of concept to de-risk
    future initiatives before they are staffed or scoped
  - Coach and support the design and development of complex
    systems and products used across teams, and mentor senior
    and staff+ engineers
  - Drive tech-wide collaboration, knowledge-sharing, and
    craftsmanship practices, modeling strong inter-team
    collaboration across the organization
  - Drive innovation in your technical domain and ensure the
    successful delivery of complex, cross-org projects with
    company-wide impact
  - Championing AI adoption across engineering and products
  - Advocate for engineers to leadership while aligning
    technical decisions with business priorities
  - Participate in an on-call rotation, providing senior
    technical support for production incidents across systems
  - Be an effective communicator, translating complex technical
    concepts for non-technical stakeholders, including
    clinical, product, and business leaders
  - Partner cross-functionally with product, clinical, and
    business stakeholders to understand goals and translate
    them into technical architecture and requirements
  - Have a data-driven, iterative approach to building products,
    and estimate technical scope and timelines for large,
    cross-team initiatives
  - Produce technical solutions that satisfy business
    requirements with a focus on scalability, stability,
    efficiency, maintainability and extensibility, using
    modern & stable technologies
  - Shape the organization's learning culture and long-term
    engineering process strategy, and demonstrate executive-
    level composure in high-stakes, ambiguous situations

  About You

  - A visionary technologist with deep experience in systems,
    architecture, and design; a systems thinker who
    specializes in solving highly technical and complex
    problems
  - A track record of setting technical strategy and driving
    alignment across multiple engineering teams
  - Experience defining architectural standards and mentoring
    engineers
  - Deep understanding and experience with front end
    applications, APIs, and back-end services
  - Strong hands-on experience with React
  - Experience delivering mobile, digital products to the Apple
    and Google Play app store; experience developing in React
    Native is a plus
  - Strong understanding of all layers of a Web and Mobile
    solution
  - Experience using AI as a transformative technology
  - Experience hosting application services on AWS
  - Experience in healthcare or another highly regulated
    industry
  - Strong collaboration and coaching skills, with demonstrated
    success developing other engineers
  - Excellent communication skills, with the ability to
    translate technical ideas for non-technical audiences,
    including executive stakeholders
  - Comfort operating in ambiguity, exploring early-stage ideas
    without well-defined requirements
  - Willingness to participate in an on-call rotation
  - Experience working in a fast-paced, hypergrowth,
    collaborative environment

  What We Offer (Benefits + Perks)

  The role offers a base salary range of $200,000 - $220,000
  in addition to an annual bonus incentive, competitive
  company benefits package, and eligibility to participate in
  an employee equity purchase program (as applicable). When
  determining compensation, we analyze and carefully consider
  several factors including job-related knowledge, skills and
  experience. These considerations may cause your compensation
  to vary.

  We provide these additional benefits and perks:

  - Competitive medical, dental, and vision insurance
  - Healthcare and Dependent Care FSA; Company-funded HSA
  - 401(k) with 4% match, vested 100% from day one
  - Employer-paid short and long-term disability
  - Life insurance at 1x annual salary
  - 20 days PTO + 10 Company Holidays & 2 Floating Holidays
  - Paid new parent leave
  - Additional benefits to be detailed in offer

  What We Live By

  We’re guided by our five core values:

  Our Values:

  - Children First. We put the best interests of children above
    all. We know that the right decision is always the one
    that creates more safe days at home for the children we
    serve today and in the future.
  - Earn Trust. We listen first, speak second. We build lasting
    relationships by creating shared understanding and
    consistently following through on our commitments.
  - Innovate Today. We believe that small improvements lead to
    big impact. We stay curious by asking questions and
    leveraging new ideas to learn and scale.
  - Embrace Humanity. We lead with empathy and authenticity,
    presuming competence and good intentions. When we stumble,
    we use the opportunity to grow and understand how we can
    improve.
  - One Team, Diverse Perspectives. We actively seek a range of
    viewpoints to achieve better outcomes. Even when we see
    things differently, we stay aligned on our shared mission
    and support one another to move forward — together.

  We Value Diversity, Equity, Inclusion and Belonging

  We believe that creating a world where every child with
  complex medical conditions gets the care and support, they
  deserve requires a diverse team with diverse perspectives.
  We're proud to be an equal opportunity employer. People
  seeking employment at Imagine Pediatrics are considered
  without regard to race, color, religion, sex, gender, gender
  identity, gender expression, sexual orientation, marital or
  veteran status, age, national origin, ancestry, citizenship,
  physical or mental disability, medical condition, genetic
  information, or characteristics (or those of a family
  member), pregnancy or other status protected by applicable
  law.
