description: |
  Join the company that’s building the telemetry
  infrastructure for the AI era. At Cribl, we partner with IT
  and Security teams at many of the world’s biggest
  enterprises, including half of the Fortune 100, to bridge
  the gap between AI ambition and infrastructure reality. As
  the AI Platform for Telemetry, we give customers the choice,
  control, and flexibility to manage and analyze telemetry for
  both humans and agents, so they can build what’s next.

  We’re one of the fastest‑growing private companies and a
  leading player in a massive, fast‑moving market. With a
  global workforce, we’re remote‑first and grounded in a
  simple idea: software is a people business. Cribl is the
  place where curious, collaborative people can do their best
  work, grow fast, and bring their full selves to the herd.

  Why You’ll Love This Role

  As a Backend Engineer at Cribl, you will help set the
  technical direction for Core Platform by working closely
  with an existing team of awesome engineers and product
  managers to help identify, design, develop, and deliver
  products that delight our customers.  Additionally, you will
  be empowered to influence our internal tools, technologies,
  and processes as we continue to grow. This role is equal
  parts research and development.  If you enjoy the challenges
  of building scalable, robust, and high performing
  distributed systems which process large data sets in real
  time, this position may be right for you.  In this role, you
  will join a team of skilled engineers committed to shipping
  the highest quality software and ensuring our customers’
  satisfaction.  This is a fully remote role and Cribl is a
  remote first company.  Our culture embraces the diversity of
  team members spread all across the globe.

  As An Active Member Of Our Team, You Will…

  - Develop software for projects and features with an emphasis
    on backend systems and APIs responsible for ingesting,
    processing, and routing data
  - Design, develop, test, and maintain clear, concise, and
    robust code that produces the desired outcomes for our
    customers
  - Partner with a cross functional team of engineers,
    designers, and product managers to translate feature
    specifications into product designs and implementable code
  - Ensure product features are working as expected by creating
    rich test plans paired with comprehensive automated tests
  - Have end-to-end ownership of the software you develop,
    regularly participating in your team’s on-call/support
    rotation
  - Be a driver, take the initiative to help the larger team
    reach desired outcomes even if it’s outside your job
    description
  - This position will require stand-by, on-call, or off-hours
    duties

  If You’ve Got It - We Want It

  - Bachelor’s degree in Computer Science or a related field, or
    equivalent practical experience
  - Solid CS fundamentals from coursework or experience: data
    structures, algorithms, basic networking and operating
    systems concepts, and an interest in distributed systems
    and scalability principles
  - Demonstrated experience building products that leverage
    large scale data sets (Node.js/Typescript)
  - Strong knowledge of data structures, algorithms, distributed
    systems, and scalability principles.
  - Knowledge of systems level debugging, networking,
    performance profiling and tuning.
  - Enjoy learning new technologies and ability to understand
    how to root cause complex problems
  - Experience with Agile processes and rapid iterative
    development
  - Strong sense of ownership with focus on high quality and
    high performing deliverables
  - Experience developing software or services for cloud based
    platforms
  - Applicants must be able to comply with U.S. government
    security requirements for access to FedRAMP-authorized
    systems, which may include U.S. citizenship

  #LI-JB1 #LI-Remote

  The salary for this role is dependent on geographic location
  and will be based on the individual candidate's job-related
  knowledge, skills, and experience. In addition to base
  salary, for sales and some sales-adjacent roles, employees
  are eligible to earn incentive compensation (commission).
  For all other roles, employees are eligible to participate
  in the Cribl Corporate Bonus Program. In addition to a
  competitive salary, Cribl also offers a generous benefits
  package which includes health, dental, vision, short-term
  disability, and life insurance, paid holidays and paid time
  off, a fertility treatment benefit, 401(k), and equity.

  Base Salary Range

  $150,000—$175,000 USD

  Bring Your Whole Self

  Diversity drives innovation, enables better decisions to
  support our customers, and inspires change for the better.
  We’re building a culture where differences are valued and
  welcomed, and we work together to bring out the best in each
  other. All qualified applicants will receive consideration
  for employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or any
  other applicable legally protected characteristics in the
  location in which the candidate is applying.

  Interested in joining the Cribl herd? Learn more about the
  smartest, funniest, most passionate goats you’ll ever meet
  at cribl.io/about-us.
