description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  CrowdStrike Falcon Host is a two-component security product.
  One component is a “sensor”: a driver installed on client
  machines that observes system activity and recognizes
  malicious behavior, then provides on-box prevention
  capability and remote telemetry to the Falcon Host cloud.
  The sensor processes thousands of events per second to
  provide deep visibility into operations on the endpoint, and
  performs rich correlation and computation to identify
  malicious events and blocks malicious activity.

  The cloud component aggregates sensor telemetry for each
  customer’s network, correlates malicious behavior across
  multiple machines, and presents our customers’ operations
  teams with a prioritized summary of the threats detected in
  their environments.

  This is a Sr. Engineering Manager role in the CTIO team. In
  this role you will build and lead a team that brings
  multiple AI-based strategies together into a cohesive,
  integrated capability on our next-generation sensor platform
  across Windows, macOS and Linux. You will own the roadmap
  for AI on the endpoint, from operationalizing machine
  learning models and building the data pipelines that feed
  them to delivering efficient on-device inference, and you
  will partner closely with data science, cloud and sensor
  platform teams to turn research into shipped product. As a
  Sr Engineering Manager, you will be expected to have
  ownership over all major components and development projects
  as well as hiring, training and growing your team. You will
  be required to assist with architecting solutions and
  support in implementing our core features. Features will
  cross-cut most core OS subsystems such as file system,
  memory and process, and networking. Many features are also
  built in a way that they will have shared components across
  multiple platforms. You need to be able to lead projects
  efficiently while maximizing performance and minimizing
  costs, making sure high standards are being followed when it
  comes to design, coding quality, and unit and component
  testing.

  The CTIO team at CrowdStrike is responsible for defining and
  executing the company's technology vision and strategy,
  driving innovation and overseeing the development and
  evolution of the Falcon platform. The CTIO ensures
  CrowdStrike maintains its position as a technology leader by
  fostering engineering excellence, aligning technical
  capabilities with business objectives, and anticipating
  emerging threats and market trends.

  What You'll Do:

  - Collaborate with all the sensor development teams, across
    the company, on architecture and strategic initiatives.
  - Conceptualize and develop new product features.
  - Provide guidance and support to development teams in
    designing and implementing software for cross-platform
    delivery (Windows, macOS, Linux).
  - Take ownership of features throughout the entire lifecycle,
    from initial design to final delivery, including
    presenting product demonstrations at the conclusion of
    each sprint.
  - Engage in cross-functional collaboration with teams situated
    in various locations.

  What You'll Need:

  - General knowledge and understanding of C++ and
    Windows/macOS/Linux Operating System internals
  - Hands-on experience operationalizing machine learning models
    on the endpoint, including building the data pipelines
    that collect, transform and deliver sensor telemetry for
    model training, evaluation and on-device inference.
  - Experience working with teams to ship major features and
    releases.
  - Previous experience as either a Sr. Manager or Engineering
    Manager with direct reports
  - Ability to lead, mentor, communicate, collaborate, and work
    effectively in a distributed team

  Bonus Points:

  - Strong background in scalable, light-weight and highly
    performing systems
  - OS system expertise for core concepts and subsystems
  - Familiarity and experience with Agile process
  - Knowledge and expertise in the Security landscape

