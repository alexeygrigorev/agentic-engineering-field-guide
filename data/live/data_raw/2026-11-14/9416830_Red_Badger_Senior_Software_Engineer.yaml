  What we offer

  We make sure our team is well looked after with generous
  salaries and a great benefits package which includes:

  - Annual £2,000 training budget
  - Enhanced pension with employer contribution of up to 5% of
    your salary
  - Group Life Insurance
  - Income Replacement Benefit
  - Critical Illness Cover
  - Private Medical Insurance
  - Your choice of hardware and mobile phone
  - £2,000 home-office set up budget and contribution to home
    broadband
  - Matched (pre-tax) charity GAYE donations
  - Cycle to work
  - Enhanced parental leave

  Diversity & Inclusion:



  Red Badger is committed to creating a diverse and inclusive
  environment, and is proud to be an equal opportunity
  employer. We hire, employ, train, promote and compensate
  regardless of gender, gender identity, race, disability,
  sexual orientation, age, creed and colour. We are fully
  focused on equality, and it is our fundamental belief that
  the fascinating characteristics that make us all different
  enable us to continue to do amazing work for our clients.
