  Job Description:

  GDIT is seeking an experienced Full Stack Engineer to
  support high‑impact customer initiatives in Washington, DC.
  This role is ideal for engineers who excel in building
  production-grade user interfaces, thrive in Agile
  environments, and are excited about solving complex problems
  at scale.

  About the Role

  You will work across the entire application stack with a
  strong emphasis on React and either Python or Java. You’ll
  architect and build performant microservices, tackle complex
  engineering challenges, and guide technical decision‑making.
  This role demands experience with high-throughput,
  low‑latency systems and modern cloud tooling.

  Key Responsibilities

  - Build and enhance core services supporting customer intake,
    screening, and data dissemination.
  - Identify and resolve performance bottlenecks and
    architectural issues.
  - Work end‑to‑end across the stack with full ownership of
    implementation.
  - Propose innovative, data‑driven solutions that operate
    effectively at scale.
  - Collaborate in a fast-paced, open, and highly technical
    environment.
  - Lead and mentor developers to engineers and deliver high-
    quality software solutions.

  Required Qualifications

  - 5+ years of full stack development experience.
  - 3+ years of hands-on React development.
  - Bachelors Degree
  - Strong background in Java-based web development and
    distributed systems.
  - Proven experience building production-grade React
    applications (components, routing, state management, APIs,
    optimization).
  - Experience using AI-assisted development tools for design,
    implementation, testing, and troubleshooting.
  - Solid understanding of application architecture and modern
    design patterns.
  - Proficiency with Git, branching strategies, code reviews,
    and CI/CD.
  - Experience leading engineering teams or mentoring
    developers.
  - Familiarity with AWS or other cloud platforms.
  - Experience working in Agile/Scrum environments.



  Preferred Certifications/Skills

  - AWS Certified Solutions Architect - Associate
  - Experience integrating with AWS SDKs (e.g., S3).
  - Developing scalable RESTful services in cloud environments.
  - Understanding of Section 508 accessibility standards and
    testing tools.
  - Familiarity with modern UI/UX principles.

  What We Offer

  - Flexible work schedule.
  - 401(k) with company match.
  - Opportunities for career growth and internal mobility.
  - A collaborative, innovative engineering culture.

  The chance to make a meaningful impact on mission-critical
