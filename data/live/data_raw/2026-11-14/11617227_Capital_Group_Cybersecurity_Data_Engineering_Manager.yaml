  “I can succeed as a Cybersecurity Data Engineering Manager
  at Capital Group.”

  The Cybersecurity Engineering / Data Science Manager is a
  leader responsible for defining and executing the
  cybersecurity analytics, security data engineering, and
  security intelligence strategy for the organization. This
  role combines deep expertise in cybersecurity, data
  engineering, analytics, and cloud-native data platforms with
  strong people leadership and program management
  capabilities.

  This role places significant emphasis on SIEM engineering
  and operating enterprise-scale security data pipelines, data
  models, dashboards, managing dta ingestion and integration
  frameworks, and building advanced analytics and reporting to
  reduce risk to the firm.

  The manager leads a team of cybersecurity data scientists,
  data engineers and security engineers responsible for
  transforming security telemetry, operational data, threat
  intelligence, vulnerability data, cloud security signals,
  identity data, and business context into actionable
  intelligence to enable data driven decisions.



  “I am the person Capital Group is looking for.”

  Leadership

  - You have proven leader of data scientists, data engineers,
    or security data professionals.

  - You have demonstrated ability to lead large, complex
    programs with significant organizational impact.

  - You have strong stakeholder influence and consensus-building
    with senior leadership

  Security Analytics and Data Science

  - You have deep knowledge of cybersecurity principles, cyber
    risk measurement, security operations, threat detection,
    vulnerability management, cloud security, and security
    telemetry.

  - You have expertise in statistical modeling, machine
    learning, predictive analytics, anomaly detection, and
    behavioral analytics.

  - You have strong understanding of cybersecurity KPIs, KRIs,
    operational metrics, and risk analytics frameworks.

  Security Data Architecture and Engineering

  - You have deep expertise building large-scale data pipelines,
    streaming architectures, and data integration platforms.

  - You have extensive experience designing security-focused
    data models and analytical data structures.

  - You have experience managing enterprise-scale security
    telemetry and observability platforms.

  - You have strong understanding of data governance, metadata
    management, lineage, quality management, and regulatory
    requirements.

  - You have expertise in cloud-native data architectures and
    modern data platform design.

  Technical Expertise

  - You have proficiency in Python and SQL.

  - You have experience with cloud native technologies AWS,
    Snowflake, Databricks, or similar.

  - You have experience with observability technologies like
    Cribl, Fluentd, OTEL or similar.

  - You have experience with dashboarding and visualization
    technologies.

  - You have strong understanding of cloud infrastructure,
    distributed computing, and enterprise-scale analytics
    environments.

  - You have experience with building and managing security data
    platforms such as SIEM, security data lakes, observability
    platforms, and threat intelligence systems.

  - You have 12+ years of experience in cybersecurity analytics,
    data science, data engineering, security operations, or
    related disciplines.

  - You have a Bachelor’s degree in Cybersecurity, Computer
    Science, or a related field.

  - You have 5+ years leading technical teams.

  - You have experience building security data lakes and
    enterprise-scale security analytics platforms.

  - You have experience supporting AI-enabled security
    initiatives and cyber risk measurement programs.

  - You have experience supporting executive reporting,
    regulatory examinations, and audit requirements.



