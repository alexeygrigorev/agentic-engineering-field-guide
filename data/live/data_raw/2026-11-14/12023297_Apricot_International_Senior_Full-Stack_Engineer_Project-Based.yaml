description: |
  This is a remote position.



   We are looking for an engineer who takes ownership, thinks
  critically, and can turn a fragmented technical environment
  into a reliable, connected solution.



  You should be comfortable working independently, challenging
  existing technical decisions when necessary, and explaining
  your recommendations clearly.



  This opportunity is particularly suited to someone who
  enjoys solving complex integration challenges and delivering
  practical solutions with meaningful humanitarian impact.






   About Our Client


  Our client is a humanitarian organization providing direct
  support to families and local communities in Gaza.



  The organization operates a virtual healing hotline that
  connects healthcare and mental-health professionals outside
  Gaza with individuals in Gaza who need support and
  counseling. It also supports community-based healing
  initiatives.



  Our client is seeking an experienced Senior Full-Stack
  Engineer to take ownership of integrating and improving its
  existing digital platforms, with an immediate focus on
  making its virtual support hotline fully operational as one
  connected system.

   The Opportunity


  This is a project-based opportunity for a highly independent
  and analytical engineer who can assess an existing technical
  environment, recommend the right architecture, and deliver a
  fully integrated end-to-end solution.



  You will work closely with the organization's founder,
  taking ownership of technical decisions and implementation
  while providing regular progress updates and clear
  architectural recommendations.



  The primary objective is to connect the existing patient
  communication platform, Admin Panel, Professional Portal,
  and website into one seamless workflow.

   What You'll Do


  1. Technical Assessment & Architecture



  - Review existing platforms, codebases, hosting environments,
    and technical architecture.
  - Evaluate the current setup and identify integration
    requirements, dependencies, and potential technical
    challenges.
  - Assess whether existing components can be integrated as they
    are or whether consolidation or architectural changes are
    necessary.
  - Provide a clear technical proposal, recommended approach,
    and realistic project delivery estimate.
  - Make and justify architecture and implementation decisions.



  2. Platform Integration & Development



  - Integrate the Telegram-based patient communication channel,
    Admin Panel, and Professional Portal into one connected
    workflow.
  - Ensure information flows accurately and consistently between
    different platforms.
  - Implement automatic registration confirmations.
  - Ensure patient registration information is properly shared
    with relevant healthcare professionals.
  - Connect the different components to support a seamless
    professional onboarding and patient support experience.








   3. Analytics & Reporting




   Develop analytics capabilities that provide the
  organization with meaningful insights, including:









  - Hotline Utilization: Number of patient requests, sessions
    delivered by subject area, and average consultation
    duration.
  - Patient Health Concerns: Statistics and rankings of patient
    concerns by health area, including analysis of the
    helpfulness of recommendations.
  - Quality Assurance: Implement a patient feedback mechanism to
    evaluate the quality and effectiveness of support
    sessions.
  - Healthcare Professional Feedback: Enable health workers to
    provide feedback and recommendations to help improve
    hotline operations.



  4. Website Integration



  - Connect the hotline workflow with the organization's
    existing website.
  - Ensure users can access the hotline through the website and
    that relevant workflows connect back to the website where
    needed.
  - Work with the existing website infrastructure while keeping
    a full website redesign outside the scope of this project.



  5. End-to-End Testing & Deployment



  - Test the complete workflow, from healthcare professional
    registration through administrative validation, review,
    and onboarding.
  - Verify the patient journey, including initial contact,
    registration, information sharing, and support sessions.
  - Identify and resolve integration issues before launch.
  - Ensure the complete system operates reliably across all
    connected platforms.



  6. Post-Launch Support



  - Provide technical support following deployment.
  - Address bugs, integration issues, and necessary adjustments
    during the post-launch stabilization period.
  - Ensure a smooth transition to the operational team.







    Requirements

  - Proven experience as a Senior Full-Stack Engineer, with the
    ability to independently own and deliver complex technical
    projects.
  - Strong hands-on experience with TypeScript and MongoDB.
  - Experience integrating multiple platforms, applications,
    APIs, and independently hosted systems.
  - Strong understanding of software architecture, system
    design, and application integration.
  - Experience working with existing codebases and assessing
    unfamiliar technical environments.
  - Ability to evaluate technical alternatives and make well-
    reasoned architectural recommendations.
  - Strong analytical, problem-solving, and debugging skills.
  - Excellent communication skills and the ability to work
    independently with minimal supervision.
  - Strong organizational skills and the ability to manage
    project deliverables and priorities.

   Nice to Have


  - Experience integrating Telegram bots or Telegram-based
    communication systems.
  - Experience building healthcare, telemedicine, or patient-
    management platforms.
  - Familiarity with analytics dashboards, reporting systems,
    and data visualization.
  - Experience implementing user registration, authentication,
    onboarding, and role-based access control.
  - Experience working with feedback collection and quality
    assurance mechanisms.
  - Experience deploying and maintaining applications across
    different hosting environments.
