description: |
  NewtonX (600+ clients like TikTok, Microsoft, Salesforce,
  Bain, Figma and many more) is a research intelligence
  company helping organizations make better business decisions
  and train better AI models through verified human
  intelligence.

  We turn specialized human expertise into reliable business
  decisions (e.g., product launches, marketing strategy, brand
  reputation tracking, M&A due diligence) and AI training data
  (frontier model improvements and evals).

  We have several million domain experts that we have sourced
  over the last few years (150+ industries including finance,
  legal, coding, tax & accounting, healthcare, semiconductors,
  cybersecurity, STEM and more).

  We have worked with AI Labs and Enterprises on topics
  ranging from sourcing senior electrical and SW engineers for
  a chip design benchmark to pediatricians and psychiatrists
  for clinical data to ML engineers and PhD-level
  statisticians proficient in 3D modeling.

  About The Role

  We are looking for a Senior Staff Software Engineer with
  deep expertise in React on the frontend and Python/Django on
  the backend. You’ll help build and scale high-performing
  applications used by global teams, with a strong focus on
  delivering an exceptional user experience. As a Senior Staff
  Engineer, you will own organization-wide technical
  initiatives.

  What We’re Looking For

  - 6+ years full-stack engineering experience
  - Strong React skills — modern React (hooks, Context API),
    reusable component libraries, building robust web apps
    across multiple projects
  - Strong Python/Django expertise — Django + Django Rest
    Framework, designing and consuming REST APIs
  - Solid experience in JavaScript (ES6+), TypeScript, HTML,
    CSS/SCSS
  - Experience building scalable systems (race conditions,
    idempotency, backpressure)
  - Strong SQL knowledge with relational databases (postgres)
  - Unit + integration testing mindset (Jest/React Testing
    Library, pytest/unittest)Comfortable with Git and Agile
    workflows
  - A strong, demonstrable commitment to developing secure
    software, including the ability to identify, defend
    against, and mitigate common application security
    vulnerabilities, especially those related to the OWASP Top
    10.

  Bonus Skills (Nice-to-Haves)

  - State management (Redux, Zustand, Thunk)Responsive design
    with Material-UI, Bootstrap, or Tailwind
  - Cloud + infra experience: GCP, Kubernetes, Docker,
    TerraformMessaging/queueing systems (Pub/Sub, Kafka,
    RabbitMQ, SQS)
  - SOLID design principles

  What You’ll Do

  - Lead development of React-based UIs that are performant,
    scalable, and user-friendly
  - Build and maintain Python/Django REST APIs and backend
    services
  - Collaborate on architecture, design decisions, and code
    reviews
  - Maintain and improve test coverage across the stack
  - Debug, resolve technical debt, and improve code quality
  - Contribute to technology/tooling choices and best
    practicesMentor teammates and help shape engineering
    processes

  What We Offer

  - Excellent medical, dental, and vision insurance.
  - 401k match with immediate vesting.
  - Generous Paid time off: vacation, holidays, sick, and
    parental leave.
  - A diverse, collaborative, and positive culture where we
    invest in and celebrate each other’s success.

  Flexible work environment where we work hard but have fun
  (happy hours, team projects, and retreats).

  NewtonX is proud to be an equal opportunity workplace. We do
  not discriminate based upon race, religion, color, national
  origin, sex, sexual orientation, gender identity/expression,
  age, status as a protected veteran, status as an individual
  with a disability, or any other applicable legally protected
  characteristics.
