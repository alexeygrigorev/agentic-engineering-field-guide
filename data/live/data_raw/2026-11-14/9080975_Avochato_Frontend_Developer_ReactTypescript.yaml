description: |
  Company Description

  Avochato is an AI-based messaging platform designed to help
  businesses improve customer communication through a unified
  inbox supporting SMS, MMS, RCS, Live Chat, and Voice. Over
  the past decade, Avochato has grown into a reliable and
  profitable platform that powers customer interactions and
  generates revenue for organizations of all sizes. With a
  commitment to solving high-impact problems and delivering
  seamless products across desktop and mobile, Avochato
  ensures businesses can communicate with their customers in
  the most rewarding ways.

  Avochato is a flat organization made up of builders who care
  deeply about product quality, customer satisfaction, and
  moving fast without breaking trust. It’s easy to launch
  something, but it’s much harder to make it last. That’s the
  work the team enjoys and the mindset that unifies the entire
  team. You'll join a high-autonomy team where engineers ship
  real features weekly for customers that perform millions of
  actions per day. If you want ownership, impact, and
  interesting technical challenges (real-time messaging, AI
  features, complex UX), we encourage you to apply for this
  role.

  Role Description

  This is a full-time remote role for a Frontend Developer
  located in the United States. As a React/TypeScript
  specialist, this role also serves as a technical resource
  for frontend best practices, code review standards, and
  provides the opportunity to mentor and shape frontend
  practices.

  The Frontend Developer will be responsible for designing,
  building, and improving user interfaces that enhance the
  customer experience. Key responsibilities include
  collaborating in cross-functional project teams, maintaining
  responsive web designs, debugging issues, ensuring high
  performance of web applications, and staying up-to-date with
  industry trends and technologies.

  Qualifications

  - 4+ years of professional experience with React with
    production TypeScript usage
  - Strong experience with React state management (Redux,
    Zustand, or similar)
  - Strong experience writing frontend tests (Jest, Vitest,
    Testing Library, or similar)
  - Experience with WebSockets
  - Familiarity with build tooling (Webpack, Vite)
  - Experience working with RESTful APIs and async data patterns
  - Experience in a Rails-backed environment is a plus
  - Experience using AWS services (S3, CloudFront) and web
    accessibility standards (WCAG) are a plus

  Benefits

  Base salary ~$150k, equity incentive plan,
  medical/vision/dental benefits for employees and dependents,
  401k with Guideline, 15 PTO days + 12 company holidays per
  year
