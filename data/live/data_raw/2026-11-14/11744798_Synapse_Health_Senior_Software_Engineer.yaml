description: |
  Who We Are:

  Synapse exists to make DME simpler and more connected for
  everyone involved, from patients and providers to health
  plans and suppliers. Through our technology platform, we
  make sure patients receive the right product, at the right
  time, in the right amount. We've reached real scale, but
  there's still a lot left to build, which means the work here
  has visible impact, not incremental polish.

  Technology is what makes our model possible. We're building
  the platform that connects patients, prescribers, health
  plans, and suppliers, replacing manual DME workflows with
  integrated, intelligent experiences. We're continuing to
  scale quickly, and in this role you'll help evolve our
  technology to keep pace with the growth of the business.

  Since 2016, with decades of industry and leadership
  experience, we've delivered tech-based solutions that help
  our partners to modernize operations, improve coordination,
  and reduce administrative burdens. By taking on operational
  and financial complexity, we're redefining how DME works for
  providers, prescribers, and patients. We are proud to
  offer work that matters, on a mission that matters. 

  Learn more at SynapseHealth.com and on Synapse Health’s
  LinkedIn. 

  What We Need: 

  We’re looking for a Senior Software Engineer who wants to
  own meaningful backend systems in a fast-moving, high-impact
  environment. This role goes beyond implementation. You’ll
  take ambiguous problems from concept to production, build
  reliable and secure software in a regulated healthcare
  environment, and make thoughtful technical tradeoffs that
  balance speed, simplicity, and long-term maintainability.

  We’re especially interested in engineers who exercise sound
  judgment, approach problems pragmatically, and choose the
  right tools and patterns for the problem at hand rather than
  defaulting to familiar approaches. If you’re energized by
  autonomy, technical ownership, and building software that
  directly impacts patients and partners, we’d love to talk.

  What You Will Do: 

  - Own backend services and technical solutions from design
    through production support.
  - Tackle ambiguous challenges, design pragmatic solutions, and
    break down complex work into high-quality deliverables for
    yourself and others.
  - Debug complex technical issues, improve system reliability,
    and proactively address engineering pain points.
  - Leverage modern engineering tooling, including AI-assisted
    development workflows, to improve productivity, problem
    solving, and software quality.
  - Build automation and internal tooling that reduce developer
    toil and accelerate engineering velocity.
  - Collaborate in architecture discussions, design reviews, and
    technical decision-making across teams.
  - Mentor fellow engineers, share knowledge, and advocate for
    thoughtful engineering practices and continuous
    improvement.

  What You Have:  

  At Synapse Health we’ve intentionally built a culture of
  kindness, collaboration, and creativity, and we consider
  those qualities to be table stakes for any new team member.
  In addition, this role requires:

  - Bachelor’s degree in Computer Science, Engineering,
    Information Systems, or a related field, or equivalent
    practical experience.
  - 5+ years building backend systems with object-oriented
    languages such as C#, Java, Python, Go or similar. Our
    production environment is primarily C#/.NET, but prior
    deep .NET experience is not required. Strong engineers
    with solid object-oriented fundamentals, sound technical
    judgment, and openness to working in C# are encouraged to
    apply.
  - Experience designing, building, and operating backend
    services, APIs, or distributed systems in production
    environments.
  - Strong understanding of data modeling, relational database
    design, query optimization, and working with ORMs (e.g.,
    Entity Framework, Hibernate, SQLAlchemy, or similar).
  - Experience writing automated tests and building reliable
    software with strong attention to correctness,
    maintainability, and edge cases.
  - Experience debugging complex technical issues and working
    through production challenges in real-world systems.
  - Exposure to cloud platforms such as Azure, AWS, or GCP
  - Familiarity with containerization, CI/CD workflows,
    observability, or deployment pipelines
  - Experience using modern engineering tooling, including AI-
    assisted development workflows

  What Sets You Apart: 

  - Diligent Execution: You think through consequences before
    shipping code. You prioritize correctness, security, and
    precision, and you take responsibility for outcomes
    without deflection.
  - Pragmatic Judgment: You build the right solution for the
    real problem. You avoid over-engineering, favor
    incremental delivery, and make sound tradeoffs that
    balance speed, simplicity, and long-term maintainability.
  - Proactive Ownership: You act early instead of reacting late.
    You take initiative in ambiguous situations, escalate
    risks appropriately, and drive problems to resolution
    without waiting for direction.
  - Collaborative Impact: You engage stakeholders to align on
    solutions, contribute meaningfully in design and code
    reviews, and elevate the engineers around you through
    thoughtful feedback and shared accountability.

  Compensation:

  The base salary range for this position is $160,000 -
  $185,000+ annually. This range reflects the anticipated
  compensation at the time of posting. Final compensation will
  be based on factors such as relevant experience,
  demonstrated skills, internal equity, and prevailing market
  conditions. Compensation discussions are encouraged
  throughout the hiring process.

  What Sets Us Apart: 

  Work is a part of life, but at Synapse Health, we believe it
  should be meaningful and enjoyable. We’re committed to
  helping our team members thrive personally and
  professionally, which is why our benefits include:

  - Professional growth opportunities with compelling career
    paths
  - Healthy work-life balance supported by flexible paid time
    off (PTO)
  - Comprehensive benefits package, including medical, dental,
    vision, STD & LTD insurance for full-time team members
  - 401(k) savings plan with employer matching contributions

  Synapse Health is an equal opportunity employer that is
  committed to diversity and inclusion in the workplace. We
  prohibit discrimination and harassment of any kind based on
  race, color, sex, religion, sexual orientation, national
  origin, disability, genetic information, pregnancy, or any
  other protected characteristic as outlined by federal,
  state, or local laws.

  Synapse Health, Inc will never request personal or sensitive
  information during the recruitment process. Please see our
  Careers Page for more information to protect yourself from
  scammers and to learn more about our recruitment process.

