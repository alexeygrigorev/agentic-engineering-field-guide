description: |
  About the role and team

  Uber has evolved from a ride-hailing service into an all-in-
  one platform, connecting users globally through various on-
  demand offerings across UberX and UberEats. To unite this
  ecosystem, we introduced Uber One—a paid membership program
  designed to elevate user experiences with priority service
  and exclusive perks. Under one unified membership, members
  unlock enhanced pricing, upgraded rides, dedicated customer
  support, premium partner benefits, and elevated service
  quality.

  With more than 50 million global Uber One members driving
  over half of our total company revenue, the program is a
  critical engine for company-wide growth across our core
  offerings while shaping how users interact with our
  expanding ecosystem and new company big bets. Join us as we
  drive Uber’s growth and shape expansion into new verticals.

  In this role on the Membership team, you will help shape the
  future of the program by architecting next-generation member
  experiences and benefits in close partnership with cross-
  functional teams. You will oversee our platform architecture
  and design highly reliable, scalable systems that power new
  initiatives across both UberEats and UberX. If you excel at
  tackling complex technical challenges, crafting impactful
  products through experimentation, and driving key business
  outcomes around conversion and engagement, the Membership
  team is the perfect fit for you.

  What you’ll do

  - Identify new impactful opportunities to evolve the Uber One
    program across UberEats and UberX
  - Develop high-QPS, low-latency services for benefits, offers,
    savings, and engagement.
  - Collaborate with talented engineers, PMs, Data Science and
    Designers from across the company to design, build, and
    optimize products used by millions of members globally
  - Architect robust, highly available, and scalable systems
    designed to resolve ambiguous technical challenges to
    serve millions of users. Align the org on complex
    tradeoffs between various different technical designs and
    solutions
  - Drive technical strategy for platform evolution,
    microservices architecture, and API design to simplify
    future program needs
  - Cultivate engineering culture and technical excellence to
    drive up engineering velocity and quality across the team

  Basic Qualifications

  - 5+ years work experience in software engineering building
    large scale systems
  - Bachelor's (or higher) in Computer Science, Engineering, or
    related field.
  - Strong hands-on technical skills, including proficiency in
    one or more programming languages (Go, Java, Python,
    Kotlin, Swift, C++) and code reviews.
  - Deep understanding of software engineering fundamentals,
    including algorithms, data structures, distributed
    systems, system design, and architecture.
  - Proven experience in owning critical and large-scale
    platforms, infra services. Proven experience in
    identifying architectural gaps and creating org-wide
    frameworks that improve developer velocity and reduce
    systemic technical debt.
  - Proven ability to lead technical projects end-to-end through
    all lifecycle stages, from inception through design
    through global deployment and productionization.
  - Expertise in defining standards for testing, monitoring, and
    alerting systems, while overseeing the execution of
    complex incident management at an organizational level.
  - Demonstrated leadership in building relationships with
    internal stakeholders and external partners to rally
    around a technical vision.

  Preferred Qualifications

  - Marketplace experience - Uber’s business model is
    marketplace heavy and prior experience creating 0 to 1
    features and optimizing marketplaces is preferred.
    Experience in real-time marketplace platforms requiring
    high consistency and global reliability.
  - Impact Mindset - (1) Ability to navigate complex org and
    company business needs (2) Ability to identify consumer
    needs through user research and data understand work (3)
    Bringing those together to build products and systems that
    bring value to our customers and deliver company impact
  - Strong Cross Company Technical Collaboration - (1) Strong
    ability to collaborate and communicate technically with
    multiple teams across the company (2) Strong ability to
    deep dive into complex technical systems owned by other
    organizations (3) Create clean technical solutions that
    factor in complexities across multiple systems &
    ultimately solve for multiple team goals

  Responsibilities

  For New York City, NY-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For San Francisco, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For Sunnyvale, CA-based roles: The base salary range for
  this role is USD $202,000 per year - USD $224,000 per year.

  For all US locations, you will be eligible to participate in
  Uber's bonus program, and may be offered an equity award &
  other types of comp. All full-time employees are eligible to
  participate in a 401(k) plan. You will also be eligible for
  various benefits.

  About Us

  Ready to Ride?



  This isn't the kind of place where you follow a playbook —
  it's where you help write one. If you're driven by impact,
  energized by challenge, and ready to shape how the world
  moves — we'd love to hear from you.

  You may be eligible for bonuses, equity, and other
  compensation, as well as a range of benefits. Explore our
  benefits.

