description: |
  Our Story



  Since 2023, our mission has been clear: to be the north star
  of patient equity.



  Every day, we strive to bridge the gaps in healthcare access
  and outcomes to ensure that every patient, regardless of
  background or circumstance, receives the care they deserve.
  As a member of our team, you'll be at the forefront of
  innovation, working alongside passionate individuals who
  share your dedication to creating best-in-class, patient-
  centric products in healthcare. Together, we're
  revolutionizing the way people understand their health and
  working with the world's top researchers to accelerate
  innovation.



  About Novellia

  Novellia is the first and only company that lets anyone in
  the U.S. gain access to nearly a decade of their health data
  in under 30 seconds — 100% free. All your health records,
  across every doctor, in one place, always up to date.

  We are the only patient-powered real-world data platform
  delivering comprehensive, patient-authorized longitudinal
  health insights to accelerate biopharma innovation. Unlike
  traditional RWD providers who deliver fragmented
  institutional data, we empower patients to access 20+ years
  of their health records, then transform these complete
  health journeys into fit-for-purpose datasets for evidence
  generation, regulatory submissions, and market access. We
  are growing 5x year over year, have raised close to $30M in
  funding, and are backed by tier-1 investors including Spark
  Capital, Khosla Ventures, and Bling Capital.

  Working with the world's top researchers, we turn health
  insights into life-changing action for millions of people
  around the world.

  We are seeking talented and experienced Backend Engineers to
  join our dynamic team. The ideal candidate will have
  expertise in building scalable distributed systems, with
  strong experience in modern backend technologies and cloud
  platforms. As a crucial member of our engineering team, you
  will play a key role in developing robust backend services
  and AI-powered features that process and analyze healthcare
  data at scale.

  Responsibilities:

  - Develop backend services and processing pipelines that
    handle large volumes of healthcare data efficiently
  - Integrate and optimize AI components, including Large
    Language Models (LLMs), to power intelligent features and
    insights
  - Collaborate with frontend, data, and AI teams to deliver
    seamless, data-rich user experiences
  - Take ownership of end-to-end feature development, from
    conception to deployment and maintenance
  - Implement observability for services and data pipelines to
    enable effective diagnostics and surface performance
    insights through monitoring, logging, alerting, and
    autoscaling
  - Implement best practices for coding, testing, and deployment
    to ensure high-quality deliverables
  - Work closely with product owners and designers to translate
    requirements into technical specifications
  - Stay up to date with backend best practices, emerging AI
    tools, and trends in healthcare interoperability and AI

  Requirements:

  - Bachelor's degree in Computer Science, Engineering, Math or
    equivalent
  - 5+ years of experience in backend development, with
    experience building scalable, distributed systems
  - Strong proficiency in one or more modern programming
    languages (e.g., Python, Node.js, Java)
  - Solid understanding of RESTful API design and microservices
    architectures
  - Experience with cloud platforms (AWS, GCP, or Azure)
  - Strong experience in system design, backend services, data
    processing, and analytics
  - Solid understanding of backend observability (monitoring,
    logging, alerting, autoscaling)
  - Hands-on experience with relational databases
  - A history of delivery on high impact organizational projects
  - Minimum of 2 years in a startup environment
  - Strong debugging, problem-solving, and communication skills
  - Passion for product development and a willingness to take
    initiative and ownership of projects
  - Commitment to following best practices and standards for
    software development
  - Wants to be part of building an engineering team from the
    ground up

  Preferred Skills:

  - Experience with message queues, data streaming platforms,
    and vector databases
  - Experience using LLMs to build real-world applications,
    leveraging tools like LangChain, LlamaIndex, and prompt
    engineering techniques
  - Experience with RAG systems and AI-driven similarity search
  - Familiarity with FHIR and healthcare interoperability
    standards
  - Passion for creating robust, scalable, AI-driven systems
    that impact healthcare

  Benefits and perks:

  - Equity in Novellia
  - Medical, dental, and vision coverage
  - 401k
  - Flexible Time off
  - Wellness stipend
  - Up to 12 weeks of parental leave

  Don't meet every single requirement? Studies have shown that
  women and people of color are less likely to apply to jobs
  unless they meet every single qualification. At Novellia, we
  are dedicated to building a diverse, inclusive and authentic
  workplace, so if you're excited about this role but your
  past experience doesn't align perfectly with every
  qualification in the job description, we encourage you to
  apply anyways. You may be just the right candidate for this
  or other roles.

  U.S. Applicants Only
