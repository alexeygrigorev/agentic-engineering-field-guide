description: |
  About the Role

  Sigma is transforming how businesses run by delivering a
  high performance platform on modern data architecture.
  Hence, we are growing the engineering team and looking for
  engineers who are excited to solve challenging problems,
  deliver impactful capabilities throughout our stack to build
  world-class technology. You will be part of a talented team
  of engineers with a shared mission to make data easily
  accessible for all users.

  What You Will Be Doing

  - You will be responsible for developing elegant and
    responsive user experience using the latest front-end
    technologies. You'll own substantial pieces of the
    product, from design to launch
  - Working with our product, UX design, and backend development
    teams, you will develop new features and technologies that
    make our product experience awesome and radically simplify
    the user experience for non-technical users
  - You will leverage your technical expertise in front-end
    application development in the creation of novel
    visualizations for structured and unstructured data and
    develop new techniques for improving the performance and
    interactivity of the application
  - Use modern frontend frameworks like React, GraphQL,
    TypeScript and Node.js

  Qualifications We Need

  - 5+ years industry experience building and maintaining high-
    quality software
  - An eye for great design and a passion for building products
    that provide a great user experience
  - The ability to make the right trade-offs between
    functionality and delivery speed that supports delivering
    value to customers, all the while iterating based on
    feedback and roadmap priorities
  - Desire to be a great teammate and have fun at work without
    compromising ownership towards your work
  - Strong sense of craftsmanship, and a healthy academic
    curiosity to solve challenges at sigma
  - Strong computer science fundamentals

  Qualifications We Want (also, skills you’ll learn!)

  - Experience building software capabilities for analyzing
    large scale data web applications
  - Prior experience working at high growth company solving
    technical problems to enable continued success

  Additional Job details

  The base salary range for this position is $170k - $240k
  annually.

  Compensation may vary outside of this range depending on a
  number of factors, including a candidate’s qualifications,
  skills, competencies and experience. Base pay is one part of
  the Total Package that is provided to compensate and
  recognize employees for their work at Sigma Computing. This
  role is eligible for stock options, as well as a
  comprehensive benefits package.

  About us:

  Sigma is the AI Apps and agentic analytics platform built on
  the cloud data warehouse. Business and technical teams use
  Sigma to explore live data, build intelligent applications,
  and automate critical workflows all without moving data or
  breaking governance. Sigma supports a spreadsheet interface,
  SQL, Python, and native AI in a single governed workspace,
  giving every team the speed to act and IT the control to
  scale. Sigma is trusted by more than 2,000 customers,
  including AMD, Duolingo, Colgate-Palmolive, and JPMorgan
  Chase.

  Sigma announced its $80M in Series E financing in May 2026.
  The round was led by Princeville Capital, with new strategic
  investors Databricks Ventures, ServiceNow Ventures, and
  Workday Ventures participating alongside returning investors
  Altimeter Capital, Avenir Growth Capital, D1 Capital
  Partners, K5 Global, NewView Capital, Spark Capital, Sutter
  Hill Ventures, and XN. This milestone follows Sigma reaching
  $200M in annual recurring revenue in April 2026, with more
  than 100% year-over-year growth and 1.1 million new active
  users added in the latest fiscal year.

  Come join us!

  Benefits For Our Full-Time Employees:

  - Equity
  - Generous health benefits
  - Flexible time off policy. Take the time off you need!
  - Paid bonding time for all new parents
  - Traditional and Roth 401k
  - Commuter and FSA benefits
  - Lunch Program
  - Dog friendly office

  Sigma is an equal opportunity employer. We are committed to
  building a smart and strong team regardless of race, color,
  ancestry, religion, sex, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  gender, gender identity or expression, veteran, or any other
  protected status. We look forward to learning how your
  experience can enable all of us to grow.

  Note: We have an in-office work environment in all our
  offices in SF, NYC, London and Sydney. All roles have a 25%
  travel expectation unless explicitly stated otherwise.

  Our Privacy Practices

  When you submit a job application on this site, Sigma
  processes your personal data for the purposes of evaluating
  your candidacy for employment at Sigma and as otherwise
  needed throughout the recruitment and hiring process. Please
  review Sigma’s Candidate Privacy Notice for more details.
  Please note that your personal data may be transferred to a
  country other than the one in which it was provided
  (including to the USA, the UK, and Canada, Australia).

  Sigma’s use of AI

  This hiring process utilizes artificial intelligence tools
  to assist in candidate screening and assessment. Our AI
  tools are designed to complement, not replace, human
  decision-making.
