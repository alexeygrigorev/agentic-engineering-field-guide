description: |
  The Platform team creates the technology that enables
  Spotify to learn quickly and scale easily, enabling rapid
  growth in our users and our business around the globe.
  Spanning many disciplines, we work to make the business
  work, creating the infrastructure, tooling, frameworks, and
  capabilities needed to welcome a billion customers.

  Our team builds Groove, a platform that helps thousands of
  employees plan, coordinate, and deliver work across Spotify.
  From initiative tracking to dependency management and
  collaborative planning, Groove helps teams stay aligned and
  execute with confidence.

  We're a small, cross-functional engineering team focused on
  building thoughtful tools that reduce friction and help
  people do their best work. We move quickly, learn from user
  feedback, and continuously improve the experiences we build.

