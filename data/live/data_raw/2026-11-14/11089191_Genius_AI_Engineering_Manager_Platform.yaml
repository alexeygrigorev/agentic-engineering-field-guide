description: |
  About Genius AI

  Genius AI is building technology to help local businesses
  run themselves. Genius AI products do the admin work that
  keeps practitioners from the work they love and the people
  they serve. From GlossGenius to Reception, its products work
  24/7 on busywork like booking, marketing, client management,
  finances, staff and inventory management, and more.

  Genius AI technology has saved businesses 106M in admin
  hours, earned them $2.0B in additional revenue, and
  facilitated more than 624M client touch points.

  About the Role Platform teams at Genius AI build the shared
  systems, services, and tooling that every product team
  relies on to build, ship, and scale with confidence. That
  leverage is what lets Genius AI's core product run as the
  daily operating system for 120,000+ service businesses. The
  platform is expanding, the agentic product is active and
  developing, and the standards for execution are increasing
  accordingly. As an Engineering Manager of a Platform team,
  you'll own end-to-end responsibility for engineering
  quality, team health, and the outcomes your team drives for
  the businesses we serve. This is a focused ownership role
  leading tier-zero systems, identity, permissions, session
  management, and messaging infrastructure, that every product
  on the platform depends on. You'll partner directly with
  Product and Design leaders across the teams that rely on
  your systems to be great.

  You must be commutable to our NYC headquarters or SF office
  and will operate in a hybrid environment. We default to
  being in-office 3-4 days per week with required attendance
  on Tuesdays and Thursdays.

  What You'll Do

  - Own execution for your team end-to-end: delivery, quality
    bar, scope trade-offs, and the decisions that get things
    shipped without accumulating technical debt
  - Embed AI tooling into how your team builds as a default, not
    a suggestion, identifying where it accelerates development
    cycles, improves code quality, and removes bottlenecks
    that previously required human intervention
  - Architect the layer of AI-powered systems and tooling that
    makes your team disproportionately productive, not just
    feature-shipping, but building the automation that
    multiplies output
  - Partner with Product and Design from early strategy through
    production, bringing engineering perspective into the room
    before decisions are made
  - Contribute to technical direction for your area: surface
    platform needs and scaling challenges early, and help your
    team make good architectural calls
  - Develop your team: invest in its growth, stretch the high-
    potential, and build a team where people get better
    because of working there
  - Partner with recruiting to hire strong engineers, hold a
    high bar on every candidate, and build a team culture that
    retains them

  What We're Looking For

  - 5+ years of software engineering experience, with at least 2
    years managing a software engineering team at a high-
    growth technology company
  - Fundamentally changed how you build software because of AI:
    you use it to architect, debug, write, and review code,
    and you have a clear point of view on where it accelerates
    your team's output versus where judgment still needs to be
    human
  - Make decisions and move: you don't wait for full
    information, you set a direction, ship something, and
    adjust based on what you learn
  - Strong enough technical judgment to earn the trust of your
    team, evaluate architectural trade-offs, and give
    meaningful input on what gets built and how
  - Track record of developing engineers: you've invested in
    people's growth and can point to what they went on to do
  - Customer-centric instincts: you connect engineering
    decisions to outcomes for the service businesses we serve,
    not just to technical correctness
  - Comfortable working in close collaboration with Product and
    Design to define what gets built, not just how

  Benefits & Perks

  - Competitive health & dental insurance options, effective on
    your first day of employment
  - Flexible PTO
  - In-office lunch twice per week for NYC and SF employees,
    plus late night dinner stipends
  - Access to Wellhub, a corporate wellness platform with
    discounted gym memberships, fitness classes, and mental
    health resources
  - Annual stipend for professional development and continued
    learning
  - High performers at 5 years receive a generous stipend to use
    however you recharge best
  - 401k benefit: employees are eligible to contribute starting
    day 1 of employment
  - Dependent Care FSA
  - Paid parental leave
  - Fertility and adoption benefits via Carrot and Kindbody

  At Genius AI, we celebrate our differences and are committed
  to creating a workplace where all employees feel supported
  and empowered to do their best work. We believe this
  benefits not only our employees but our product, customers,
  and community as well. Genius AI is proud to be an Equal
  Opportunity and Affirmative Action Employer.

  Personal Information: Notice at Collection for Employees and
  Applicants

  Agency Submissions If a resume or applicant is submitted to
  Genius AI by a third party without a signed search agreement
  in place, it will become the property of Genius AI and no
  fee will be paid, irrespective of whether the candidate is
  hired.

  Genius AI may use automated tools, including artificial
  intelligence and machine learning systems (AI Tools), to
  assist in evaluating applicants’ qualifications and fitness
  for the position. These AI Tools may be used alongside human
  review during one or more stages of the recruiting process,
  including application screening, skills assessments, and
  interviewing. No final hiring decision will be made solely
  by AI Tools without human oversight.
