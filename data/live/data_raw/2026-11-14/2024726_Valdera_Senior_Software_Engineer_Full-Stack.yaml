description: |
  About Us

  At Valdera, we help manufacturers bring their ideas to life
  by transforming how they source materials. Our platform
  makes it easy to find the best materials and suppliers,
  enabling them to build high-quality products at scale and
  deliver to millions worldwide.

  We are a fast-growing team with a proven track record of
  working with Fortune 500 industrial manufacturers, beauty
  brands, and chemical companies. We hire talented, driven
  individuals who thrive in high-performance environments and
  want to grow their careers quickly.

  Our culture empowers top talent to take on meaningful
  challenges, collaborate with industry leaders, and see the
  real impact of their work. If you’re looking for a fast-
  paced environment where your ideas drive change, Valdera is
  the place for you.

  Join us and help shape the future of manufacturing.

  Role Description

  We are looking for a talented Senior Software Engineer with
  startup experience. You’ll work very closely with our
  executive team to build end-to-end systems for our buyers,
  suppliers, and internal stakeholders. We prefer to use an
  open source stack with proven technologies. Since products
  like ours tend to acquire a lot of complexity over time we
  are looking for engineers who can make mature and principled
  decisions in the face of competing priorities.

  Role Responsibilities

  - Own end-to-end feature development – from design to
    deployment – ensuring quality, scalability, and business
    impact.
  - Build high-performance, maintainable systems that serve
    buyers, suppliers, and internal stakeholders.
  - Independently plan and execute technical designs that
    accommodate evolving business needs.
  - Write high-quality, well-tested code that prioritizes
    simplicity, changeability, and modularity.
  - Take full ownership to launch features efficiently without
    reliance on a dedicated QA team, ensuring every release
    meets its intended goals.
  - Proactively identify and resolve technical challenges before
    they become blockers.
  - Align technical solutions with business objectives by
    collaborating closely with leadership.
  - Prioritize work based on impact, ensuring the most valuable
    features are delivered first.
  - Communicate technical concepts clearly to both technical and
    non-technical stakeholders.
  - Adapt to global time zones when necessary to support
    critical business needs.
  - Show a commitment to putting in the necessary time and
    effort to exceed expectations and achieve ambitious
    startup goals
  - Adapt to global time zones to support customer needs and
    urgent internal priorities

  Experience & Qualifications

  - 5+ years of experience in software engineering, with a
    proven track record in startup environments
  - Experience building and maintaining complex web applications
    at scale
  - Track record of making mature technical decisions in fast-
    paced environments
  - Demonstrated ability to balance technical debt with business
    priorities
  - Experience collaborating closely with business executives
    and leaders
  - History of quickly learning new skills required to deliver
    value in (almost) any business situation
  - Track record of executing with a high attention to visual
    and written detail
  - Experience with a wide range of tools/technology products,
    and ability to pick up new ones easily
  - Excellent written and verbal communication skills
  - Experience successfully navigating ambiguous problems
  - Located in the greater New York area and willing to meet in
    person occasionally for team meetings
  - Eligible to work in the United States and live in the United
    States (we are unable to provide visa sponsorship at this
    time)

  Technology stack

  - Typescript
  - Python
  - Postgresql
  - Google Cloud
  - Terraform

  Benefits

  Valdera offers generous benefits to employees. Full time
  employees are eligible for premium healthcare, dental, and
  vision insurance coverage. You will be provided a more
  detailed breakdown of your options prior to joining Valdera.

  Equal Opportunity Employer Statement

  Valdera is an equal-opportunity employer committed to
  building a diverse and inclusive team. We are dedicated to
  maintaining a workplace free from discrimination, where
  everyone feels valued, respected, and empowered to
  contribute.

  Please note that Valdera uses E-Verify to confirm the
  identity and employment eligibility of all new hires.
