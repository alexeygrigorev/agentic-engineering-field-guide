description: |
  About the Role

  Abnormal AI empowers businesses of all sizes to combat
  cybercrime through our innovative cloud products. To achieve
  our mission, we're building a suite of interconnected
  security solutions on a unified platform, designed to
  operate flawlessly in global data centers.

  The Development Infrastructure team plays a critical role in
  multiplying the impact of our product teams. We create an
  environment that fosters high-quality software development,
  and engineering excellence. This team has become
  instrumental in the success of our engineering organization.

  You are someone who:

  - Thrives in a collaborative, fast-paced environment
  - Possesses a passion for helping others build world-class
    systems
  - Demonstrates exceptional teamwork skills
  - Embraces continuous learning and enjoys tackling complex
    problems

  What you will do

  - Lead the design and delivery of complex, multi-component
    features and systems of the Development Infrastructure
    team's offerings, and shape the roadmap for this area.
  - Develop and maintain CI/CD infrastructure and tools for
    Engineering to develop and ship their changes reliably
    with less effort.
  - Design and implement enhancements to GHA infrastructure,
    base Docker images and build/deploy pipelines with
    improvements in scalability, performance and costs.
  - Use AI tools to explore and compare solutions, and adapt the
    generated changes to real production constraints, weighing
    system complexity and long-term maintainability.
  - Take ownership of on-call issues, including complex issues
    where the root cause is unclear, and fix the systemic gaps
    behind them.
  - Participate in planning, code reviews, standups, and other
    aspects of the software development life cycle, and coach
    other engineers on the team.

  Must Haves

  - 3+ years of professional experience as a hands-on engineer
    building backend systems and/or platforms.
  - 2+ years of experience working with Python.
  - Experience delivering complex projects end-to-end in a cloud
    native environment.
  - Experience building or operating CI/CD, build, or deployment
    systems in production, including on-call and incident
    response.
  - Understanding of distributed systems, containerization and
    microservices.
  - Practical experience using Generative AI tools in day-to-day
    engineering workflows.

  Nice to Haves

  - Experience creating and maintaining CI/CD systems.
  - Experience with GitHub Actions.
  - Experience with Go.
  - Experience with Bazel.
  - Experience working on or with teams like “Engineering
    Effectiveness”, “Engineering Productivity”, “Development
    Experience”, “Development Infrastructure” or similar.
  - Knowledge of Docker, Kubernetes, or similar technologies.
  - Familiarity with Generative AI tools such as Codex and
    Claude, and experience driving AI-first workflows and
    solutions.

  #LI-ML1

