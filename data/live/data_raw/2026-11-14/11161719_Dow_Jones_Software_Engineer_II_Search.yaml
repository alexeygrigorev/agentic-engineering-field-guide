description: |
  Job Description:Evergreen pipelineAbout the Team:

  Our Technology team drives the evolution of our Engineering,
  Data, Product and User Experience functions. With a keen
  focus on delivering cutting-edge solutions, we shape the
  digital landscape for our customers, readers and users. From
  revolutionizing visuals to optimizing tools and harnessing
  the power of data, mobile, video and social platforms, our
  team is committed to providing a seamless and immersive
  experience across all touchpoints. Collaborating closely
  with our newsrooms and strategic partners, we spearhead the
  development of groundbreaking products and technologies.

  About the Role:

  We are looking for a Software Engineer to join our Search
  team in New York.

  You will design and build the search APIs, semantic and
  lexical search systems that connect millions of users with
  the most relevant content across our digital products.

  You Will:

  - Design & Build: Design, build, and own reliable, scalable
    backend services, APIs, and platform components, driving
    the delivery of projects from planning through release
    with minimal oversight.
  - Collaborate & Optimize: Partner closely with engineering,
    product, and QA stakeholders to translate requirements
    into technical solutions while improving monitoring,
    alerting, observability, and operational readiness for
    critical services.

  You Have:

  - 2-4 years of professional software engineering experience in
    backend or platform environments.
  - Experience designing and scaling search or information
    retrieval systems, including familiarity with semantic
    search, embeddings and vector databases.
  - Experience implementing RESTful APIs following industry
    standards.
  - Experience implementing, testing, deploying, troubleshooting
    and supporting multi-region, multi-environment systems
    with CI/CD, high availability and disaster recovery.
  - Experience with infrastructure-as-code tools (Terraform,
    Chef) and CI/CD pipelines (Jenkins).
  - Experience with Docker and Kubernetes for containerised
    deployments in production environments.
  - Comfort adopting AI-assisted development workflows.
  - Bachelor's degree in Computer Science or related field or
    equivalent work experience is preferred.

