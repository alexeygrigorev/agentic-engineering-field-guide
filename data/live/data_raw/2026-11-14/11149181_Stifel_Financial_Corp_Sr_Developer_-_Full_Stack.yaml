description: |
  Why Stifel

  Stifel strives for a culture that puts its clients and
  associates first: a culture where everyone belongs, everyone
  is welcome, and everyone contributes to the success of our
  clients, their careers, and the firm as a whole.

  Let’s talk about how you can find your place here at Stifel,
  where success meets success.

  What You'll Be Doing

  The Senior Developer will participate in all phases of the
  development process including complex design, integration
  and maintenance while observing proper behaviors, patterns,
  and standards. The Senior Developer will demonstrate
  leadership in mentoring and assisting all on the team, and
  will actively participate in all disciplines required in a
  full-stack environment. The Senior Developer will
  participate in defining Stifel's best practices and ensure
  they are used in all development projects and procedures.

  What We're Looking For

  • Facilitate the growth of other developers through code
  review and one-on-one interaction.• Document clearly and
  effectively within code as well as outside of code.•
  Coordinate with other team members when tackling
  developmental efforts.• Demonstrate a proactive,
  architecture-driven approach to problem resolution, with
  strong troubleshooting and problem-solving skills,
  especially in crisis situations.• Transform mockups and
  wireframes into usable front-end functionality through
  developing, testing, and revising web application code.•
  Create components based on user interface/user experience
  norms, including optimal accessibility, navigation, and
  cross-browser performance.

  What You'll Bring

  • Understanding of ETL (Extract, Transform, Load) processes
  to ensure efficient data movement and transformation •
  Familiarity with AWS/Cloud Technologies a strong plus.•
  Understanding of event-driven microservices architecture
  residing within the AWS cloud, including experience
  deploying applications within this type of environment.•
  Expertise with AWS services and implementation practices.•
  Experience using Infrastructure as Code tools such as
  Terraform for provisioning of public and private clouds.•
  Familiarity with CI/CD tooling for broad scope
  orchestration, including platforms such as GitLab, GitHub,
  and Azure DevOps.• Experience in serverless and container-
  based technologies within AWS such as Lambda, Fargate, and
  ECS.• Experience working in a financial services or
  broker/dealer environment preferred but not required.•
  Continue to stay on top of the latest technologies and see
  how they can be applied to Stifel’s needs throughout the
  organization.• Oral and Written Expression – Proven ability
  to communicate information and ideas in spoken or written
  form so that others will understand.• Judgment and Decision
  Making — Ability to deal with ambiguity and rapid change.•
  Time Management – Highly self-motivated and delivery
  focused.• Displays awareness of the impact of actions on the
  business and demonstrates understanding of the context of
  the company and acts in line with it.

  PREFERRED EXPERIENCE IN AI/ML Infrastructure and
  Development:

  • Hands-on experience or strong awareness of developing,
  deploying, and maintaining AI/ML models in production
  environments, ensuring reliability and performance.•
  Proficiency with AWS AI/ML services, including Amazon
  SageMaker (for building, training, and deploying models),
  AWS Glue (for data preparation and ETL workflows), Amazon
  Comprehend (for NLP and text analytics), Amazon Lex (for
  conversational interfaces), and Amazon Polly (for text-to-
  speech). Experience integrating these services into end-to-
  end AI/ML pipelines, managing model versioning and
  deployment, and optimizing performance and cost within AWS.•
  Experience designing, building, and maintaining scalable
  data pipelines for AI/ML.• Familiarity with distributed data
  processing frameworks for handling large-scale or real-time
  data.• Experience with containerization and orchestration
  for scalable• Knowledge of MLOps practices, including model
  orchestration, deployment, monitoring, and lifecycle
  management using platforms such as MLflow, Kubeflow, or
  Vertex AI.

  Education & Experience

  • Bachelor's degree in Computer Science or related field; or
  equivalent experience required.• 6+ years of progressive
  experience in software development.• Past education or
  interest in mathematics or financial modeling preferred but
  not required.

  Systems & Technology

  • High-level proficiency with fundamental front-end
  languages such as HTML, CSS, and JavaScript.• High-level
  proficiency with JavaScript frameworks such as Angular.•
  Previous experience with server-side languages such as C#.•
  Previous experience with database technology such as SQL
  Server, MySQL, or Oracle.• Previous experience with Git (or
  other version control systems).• Experience implementing
  testing platforms and unit tests.

