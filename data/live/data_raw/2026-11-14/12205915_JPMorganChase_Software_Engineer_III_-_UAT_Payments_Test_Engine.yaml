description: |
  J.P. Morgan is seeking a Sr Associate to provide Test
  Management and supervision for the Payments Technology LOB;
  in a cross business; in a cross business, cross functional
  project based environment.  Flexibility to provide Testing
  experience on other LOB’s and support transformational
  Global initiatives within Test Integration And
  Implementation(TII) Services. The successful candidate would
  also be expected to support the strategic roll out of an
  automated testing solution.

  Job responsibilities

  - Day-to-day responsibility of leading a test team which would
    involve daily supervision, allocation of duties, timely
    resolution of testing issues and regular communication
    with reporting manager Responsibility for the provision of
    accurate testing estimates within daily scrum calls.
  - Requirements planning against an End-to-End test strategy,
    including test data, environments, defect management and
    test automation.
  - Ability to effectively lead daily Scrum Calls and deputize
    for the Program Test Manager in fortnightly Delivery
    Working Group meetings.
  - Ability to manage expectations of both stakeholders and
    teams supporting E2E test execution.
  - Ability to manage expectations of both stakeholders and
    teams supporting E2E test execution.
  - Identification of testing automation opportunities and test
    synergies within the Project.
  - Responsible for completing a knowledge audit / matrix on
    each team member, documenting any gaps, taking steps to
    fill those gaps and ultimately ensuring that all UAT
    skills are transferable across the team.
  - Escalating daily issues to the Programme Test Manager and
    managing expectations regarding testing and project
    timeline.
  - Documentation and execution of test scenarios – identify
    specific scenarios and write test scripts using Business
    Driven Development for example Gherkin.
  - Partner closely with Operations, Product and Technology
    groups.
  - Taking responsibility for the monitoring and reporting of
    Testing defects and the re-testing process.
  - Validation and presentation of Test Results for internal
    Sign-off.
  - Strong organizational skills – ability to dynamically manage
    and oversee critical testing tasks accurately and to tight
    deadlines.
  - Expertise in Agile project delivery methodology and skills
    to learn and work with evolving methodologies.

  Required qualifications, capabilities, and skills

  - Bachelor’s degree with relevant  experience or equivalent
    expertise at troubleshooting, resolving, and maintaining
    Cucumber / Gherkin, Java, Selenium or a similar tool is
    required.
  - Functional knowledge of Payments domain and experienced in
    testing processes in order to define requirements,
    document user stories and test scripts through to test
    execution.
  - Utilization of test automation tools, to enable the
    efficient and timely E2E test execution, therefore
    previous experience of automated testing is required.
  - Experienced in testing processes in order to define
    requirements, document user stories and test scripts
    through to test execution.
  - Ability to work with the minimum of supervision on day-to-
    day activities.
  - Strong organizational skills – ability to dynamically manage
    and oversee critical testing tasks accurately and to tight
    deadlines.
  - Skilled at problem solving, ability to scope and provide
    structure to complex issues, rapidly learn unfamiliar
    processes and provide insightful and timely remediation.
  - Excellent attention to detail so errors can be prevented and
    redundancies / opportunities highlighted.
  - Ability to keep sight of the overall context and remain
    centered on the strategic picture, identify areas of
    opportunity for process improvement and build out
    recommendation to proceed.
  - Ability to use effective systemic data driven reporting to
    support program reporting.
  - Very strong communication skills with the ability to provide
    clear and succinct verbal updates on their work to team
    members, colleagues, senior leads, executives and clients.
  - Ability to liaise effectively between lines of business with
    empathy and understanding to achieve the common and
    strategic goal as a team.
  - Actively contributes to program updates, Project and team
    meetings.

  Preferred qualifications, capabilities, and skills

  - Experienced in using Business Driven Development / Test
    Driven Development test methodology or test case
    automation.
  - Experienced in using Cucumber / Gherkin, Java, Selenium or a
    similar tool is required.
  - Identifying opportunities to accelerate and synergies
    testing processes for assigned projects and syndicate the
    information to other team members to validate prior to
    implementation.
  - Relevant testing experience within the Financial Services
    industry supporting multiple LOB’s delivering in a highly
    complex, pressurized and high volume environment.
  - Advanced numeracy and Microsoft skills. PowerPoint / Pitch
    Pro skills - able to create professional slides and
    structure presentations with minimal input and need for
    secondary review.

