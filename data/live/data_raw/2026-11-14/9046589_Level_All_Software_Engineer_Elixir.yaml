description: |
  Company Description

  Level All is a fast-growing media and technology company
  that supports students, adults, and educators as they work
  together to create and implement a personalized plan for
  success from high school to postsecondary education to their
  career. The Level All platform pairs expert content with
  intuitive, personalized support and guidance so students can
  easily navigate their journey to a successful future.

  Job Description

  We’re looking for a Elixir Software Engineer to contribute
  to our core web platform and supporting applications built
  in Elixir, Phoenix, LiveView, Ash, TypeScript, and Tailwind
  backed with a Postgres database. You’ll work with
  Engineering, Product, and Design teammates to help ship new
  features to make our platform more engaging for students and
  other learners, and more useful and valuable for the schools
  and community organizations we partner with.

  Our Engineering team enjoys collaboration, and you’ll do a
  mix of pairing, code review, discuss new processes or
  improvements to our codebase, provide feedback on product
  and design requirements, and your own deep work on any given
  day. As a senior engineer, you’ll be leading projects and
  providing guidance and mentorship to other engineers on the
  team.

  As the number of students using our platform grows, you’ll
  also help fix any bugs that are found, improve the overall
  quality of our code through addressing tech debt and
  automated testing, and reducing complexity.

  This opportunity is for full-time regular employment. Hybrid
  or remote for the right candidate.

  Qualifications

  - Have at least five years of professional software
    engineering experience
  - Have worked with Elixir (or another functional language) in
    production for at least four years
  - Have a solid understanding of OTP
  - Have experience building web apps with Phoenix and LiveView
  - Have experience designing and consuming APIs
  - Have experience working with relational databases
    (preferably PostgreSQL)
  - Have a strong appreciation for automated tests and testing
    culture
  - A product mindset and driven by helping our users

  Additional Information

  The annual total compensation for this position is expected
  to be between $120,000 - $140,000. Salary levels are
  expected to change to reflect an employee’s job performance
  (results and impact) over time. Salaries at the time of hire
  are typically offered in the lower to middle of the
  indicated range in order to provide the opportunity to
  reflect performance-based increases over time. In addition
  to base salaries, employees at Level All are typically
  eligible for a comprehensive package of benefits, and
  successful candidates may also be eligible for stock-based
  compensation and/or variable pay programs based on
  performance relative to goals and targets.

  Level All does not provide work authorization and/or visa
  sponsorship.

  Level All is an Equal Opportunity Employer.
