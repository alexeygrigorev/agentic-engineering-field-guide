description: |
  As a Senior Software Engineer at Nokia, you'll be at the
  forefront of our software development efforts. Your
  expertise in Go development and distributed systems will be
  crucial in designing and implementing robust software
  solutions. You'll collaborate with a talented team,
  leveraging your skills in API design and Kubernetes
  internals to create high-performance, scalable systems. This
  role offers an opportunity to make a significant impact on
  our technology stack and drive innovation within the
  company.

  Responsibilities

  - Lead the design and development of a massively distributed
    edge compute platform, ensuring high availability and
    fault tolerance.
  - Utilize Kubernetes internals for resource management and
    container deployment.
  - Design and implement software microservices for scale,
    performance, and security.
  - Collaborate closely with cross-functional teams to gather
    requirements and deliver high-quality, maintainable code.
  - Conduct thorough code reviews, providing constructive
    feedback to enhance code quality and maintainability.
  - Troubleshoot and resolve complex software issues, employing
    your expertise in distributed systems and high-throughput
    networking.
  - Stay abreast of emerging technologies and industry trends,
    contributing to the team's knowledge and innovation.
  - Mentor and guide junior team members, fostering a culture of
    knowledge sharing and continuous improvement.
  - Participate in project planning and estimation, providing
    accurate timelines and resource allocation strategies.
  - Ensure software solutions meet performance, security, and
    scalability standards through rigorous testing and
    optimization.
  - Document and maintain comprehensive software documentation,
    ensuring clear and accessible records for future
    reference.
  - Actively contribute to the team's success by sharing your
    expertise and collaborating effectively with colleagues.

  Qualifications

  - Bachelors or Masters degree in Computer Science, Software
    Engineering, or a related field, with a strong academic
    background.
  - 7+ years of experience in software development, with a
    proven track record in Go development and distributed
    systems.
  - Proficiency in software design patterns and best practices,
    with a focus on creating clean, modular, and scalable
    code.
  - Expertise in API design, versioning, and customer portal
    interactions, ensuring seamless integration and user
    experience.
  - In-depth understanding  and experience with  Kubernetes
    internals, including resource management, deployment
    strategies, and containerization.
  - Strong problem-solving and analytical skills, with a
    demonstrated ability to tackle complex software
    challenges.
  - Excellent communication and collaboration skills, fostering
    effective teamwork and knowledge sharing.
  - Experience with cloud computing platforms (e.g., AWS, Azure)
    and their integration with software solutions.
  - Experience with agile development methodologies and a track
    record of working in fast-paced, dynamic environments.
  - A passion for software development and a commitment to
    staying updated with industry trends and emerging
    technologies.



