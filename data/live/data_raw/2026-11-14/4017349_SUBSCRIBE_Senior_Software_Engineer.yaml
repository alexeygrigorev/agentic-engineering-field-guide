description: |
  SUBSCRIBE is an enterprise software solution providing
  electronic subscription document technology and an order
  management system for alternative product transactions.



  Our technology allows allocators, sponsors, and service
  providers to digitize the entire onboarding, investment, and
  reporting process for alternative investments. Through our
  open-architecture platform, all stakeholders are easily
  connected to a central venue allowing for collaboration that
  reduces errors, saving time and money. Our mission is to
  give our clients control and reduce friction for a very
  painful investment process through the use of our platform.



  SUBSCRIBE has won the Benzinga Fintech Global Awards as the
  best alternative investment platform. The firm has doubled
  the size of its team for two years in a row and seek to
  continue the expansion to support the fast company growth.



  Responsibilities:



  SUBSCRIBE full stack engineers own the entire development in
  our system. You'll influence the initial specs for the
  feature, build/modify the backend APIs (mostly Rails), write
  the front-end code that consumes said APIs (mostly
  React.js), and be responsible for ongoing improvements once
  the feature is deployed. Daily responsibilities include:





  - Acts as Team Lead of major projects within one area of a
    product
  - Design, develop, modify, and implement software programming
    for our product
  - Working with development teams and product managers to come
    up with software solutions to concrete user problems
  - Writing clean, well-tested, functional code on the front and
    back-end



  Qualifications:



  We are looking for highly motivated, passionate, and self-
  driven engineers with the following skillset:



  - 3+ years of experience
  - Ability to work in a cross-functional team which touches
    many parts of core systems at SUBSCRIBE
  - Past experience and extensive knowledge using Ruby on Rails
    and React.js
  - Work closely with Product to deliver high-quality features
  - Able to respond to feedback constructively and provide high-
    quality, actionable feedback to peers



  Our Tech Stack:



  - Ruby on Rails for backend
  - React.js for frontend
  - Rspec for testing on the backend
  - Argo for CI
  - A variety of AWS services, including S3, RDS, ECS



  Benefits:



  - Competitive salary
  - Paid vacation
  - Flexible working hours
  - Medical, dental, and vision insurance (U.S. candidates only)
  - 401k with company match (U.S. candidates only)
