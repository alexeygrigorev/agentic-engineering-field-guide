description: |
  The Role:

  We are seeking a highly experienced Senior Engineer with a
  Construction Defect focus to join our team. The ideal
  candidate will have extensive experience in construction
  defect (CD) investigations, analysis, and litigation
  support. This role involves directing CD investigations,
  leading a team of experts, providing expert witness
  testimony, and developing new business opportunities for the
  CD service line. The position will serve as an expert for
  various clients, including large complex loss examiners for
  insurers, defense attorneys representing contractors accused
  of defective or non-conforming work, and plaintiff attorneys
  representing property owners.

  Who We Are:

  YA Group is an international professional services
  organization providing forensic consulting, engineering,
  risk mitigation, and related services. Founded over 25 years
  ago as a property damage consulting firm, YA has expanded
  through organic growth and strategic acquisitions. Today, YA
  has over 800 professionals dedicated to excellence,
  partnership, and driving innovation.

  YA Engineering Services (“YAES”) is a national forensic
  multi-disciplinary consulting firm. YAES provides immediate
  response to new assignments, performs investigations in a
  timely manner, and provides comprehensive reports that are
  clear, concise, and backed by reasonable analyses and
  recommendations. YAES offers a team of highly qualified,
  technically excellent engineering professionals who work
  seamlessly together to service the needs of our clients.

  In This Role, You Will:

  - Lead and conduct thorough construction defect investigations
    and analysis of residential, commercial, and industrial
    structures.
  - Identify the root cause and extent of damage by evaluating
    data, environmental factors, and material properties.
  - Prepare detailed and accurate reports on findings.
  - Provide expert testimony and support during litigation
    processes.
  - Develop and maintain client relationships within the
    construction defect service line.
  - Mentor and guide junior engineers and other team members.
  - Collaborate with multidisciplinary teams to deliver high-
    quality services.
  - Stay updated with industry standards and best practices
    related to CD claims and litigation.
  - Attend and coordinate meetings with clients.
  - Ensure job files, documentation, and deliverables are well-
    organized.
  - Performs other duties as assigned.

  What You Bring:

  - 5+ years of experience in the construction defect field.
  - In depth understanding of the CD claims and litigation
    processes.
  - PE or RA license preferred.
  - Strong client relationship management skills, with an
    existing client base in the CD service line (attorneys,
    insurers, examiners).
  - Excellent communication, writing, and analytical skills.
  - Strong organizational and time management skills.
  - Ability to travel with reliable transportation.
  - Ability to work independently and as part of a team.

  What We Offer:

  - Employee-focused culture
  - Strong commitment to work-life balance
  - 100% Remote work
  - Flexible vacation & Paid holidays
  - Paid family care/sick leave
  - Parental leave
  - Comprehensive benefits
  - 401k w/match

  Fraudulent Recruitment Alert:

  Please be vigilant against fraudulent recruitment attempts.
  YA will never ask for personal financial information (such
  as bank account numbers or identification numbers) via
  social media or chat-based apps. We also will not request
  money for the purchase of business equipment, post job
  opportunities on Craigslist or conduct interviews solely via
  text message.

  All official email communications regarding your application
  will come from notify@dayforce.com or directly from a member
  of our talent team using an @yagroup.com domain name.

  If you suspect any fraudulent activity, please contact us
  directly at careers@yagroup.com.

  Disclosures:

  As part of our recruitment process, we may use AI-assisted
  tools to support candidate screening and evaluation. These
  tools are designed to assist—rather than replace—human
  decision-making, and all employment decisions are made by
  our recruiting team in accordance with applicable laws and
  our commitment to equal employment opportunity.

  Where required by law, we will provide additional
  information about the use of these tools, including their
  purpose, and offer alternative processes or accommodations
  upon request.
