description: |
  Our mission at Duolingo is to develop the best education in
  the world and make it universally available. It’s a big
  mission, and that’s where you come in!

  At Duolingo, you’ll join a team that cares about finding
  innovative solutions to complex technical problems, running
  countless experiments (300+ at a time!) with our massive
  user base to make data-driven decisions, and educating our
  users and employees alike. You’ll have limitless learning
  opportunities, mentorship and collaboration with world-class
  minds, and a variety of projects with large scopes — while
  doing work that’s both fun and meaningful.

  Join our life-changing mission to develop education for our
  half a billion (and growing!) learners around the world.

  About the Role...

  We are hiring for Android Engineers at various levels, and
  below you can find more information about the teams we're
  hiring for:

  Math Progress:

  The Math Progress team builds the experiences that connect
  Duolingo's math lessons into a cohesive learning journey. We
  help learners find the right content by improving how they
  navigate topics, grades, and the course path, and we make
  their learning progress visible through mastery signals,
  scored reviews, and personalized practice. The team works
  cross-functionally and experiments rapidly to help learners
  build momentum and continually strengthen their math skills.

  Long-Form Learning:

  The Long-form Experience team owns Stories and DuoRadio,
  Duolingo’s immersive reading and listening experiences that
  help learners understand real-world conversations. You’ll
  build engaging, interactive experiences that help learners
  apply their language skills. We’re also building a brand new
  long-form session from 0 to 1, and you’ll play a key role in
  bringing it to Android

   🧠  You will...

  - Collaborate on software projects with product design and
    backend aspects
  - Develop, release, and maintain native Android application
    features in Kotlin
  - Mentor and set technical direction for junior engineers on
    the team

  ✅  You have...

  - A Bachelor’s degree in Computer Science or a related
    technical field
  - Programming experience in Kotlin on Android
  - The ability to communicate technical issues effectively to
    technical and non-technical stakeholders

  ⭐  Exceptional candidates will have...

  - Strong programming experience building reactive Android apps
  - Demonstrated self-direction, with a desire both to learn new
    techniques and mentor others
  - Experience designing clean and maintainable APIs
  - Experience writing unit tests and testable code

  The offered salary is dependent upon several factors,
  including work experience, skills, and internal peer
  comparisons. The posted range is subject to change in the
  future. For this role, base salary is supplemented by equity
  compensation. We encourage you to talk with your recruiter
  for more information related to compensation for this role!

  Salary Range:

  $153,000—$207,000 USD

