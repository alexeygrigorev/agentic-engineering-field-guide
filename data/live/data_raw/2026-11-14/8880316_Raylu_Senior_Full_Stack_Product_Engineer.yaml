description: |
  Position Summary

  Join us as a Senior Full-Stack Product Engineer to design,
  build, and iterate on ambitious product surfaces end-to-end.
  You’ll move fluidly between React/Next and Node/Typescript,
  owning features from rough idea to shipped outcome.

  What we’re looking for

  - Full-stack mastery: Typescript across the stack; React/Next
    on the front, Node on the back.
  - Product-driven: You prioritize user value, craft delightful
    UX, and design APIs that make the UI simple.
  - Architect at speed: Balance speed with reliability; make
    excellent now-vs-scale tradeoffs.
  - Ownership: You run projects end-to-end - requirements,
    design, implementation, launch, iteration.
  - Bonus: Familiarity with LLM integrations and cloud
    deployment.
  - Opinionated: Deep level of understanding of the
    technological landscape, making both high level system and
    granular code design decisions based on understanding
    rather than preference - diving deep on unknown patterns
    in order to build the best product.

  Responsibilities

  - Move rapidly from customer pain point to full feature
  - Ship features across frontend, backend, and infra; prototype
    rapidly then harden.
  - Improve developer ergonomics, code quality, and
    observability.
  - Contribute to the roadmap and shape the product direction
    with data and user feedback.

  Logistics:

  - Compensation: $165K - $250K salary, $100K-200K equivalent in
    new hire equity (4 year vest)
  - Location: New York City. We are a fully in-office team
    working out of Midtown Manhattan Monday through Friday. We
    allow for WFH days when anyone is traveling, but we do not
    allow for permanent remote work.
  - Benefits:
    - Generous health, dental, and vision insurance
    - 401k with 3% automatic contribution (no vesting)
    - Paid Lunches
    - Wellness and Citi Bike benefit
