description: |
  About Dutchie

  Founded in 2017, Dutchie is an all-in-one technology
  platform powering the cannabis industry with Point of Sale,
  E-commerce, Payments, and Loyalty & Marketing. Through our
  technology, we’re helping cannabis businesses start,
  operate, and grow with confidence.

  With software that simplifies their operations, our
  customers can focus on what matters most—bringing the
  benefits of cannabis safely to consumers.

  Dutchie aims to further support the positive societal change
  the cannabis industry brings to the world through wellness
  benefits, social justice, and empowering local communities
  through tax revenue. Powering thousands of dispensaries
  across 40+ markets throughout the United States and Canada,
  Dutchie is the leading technology company in the cannabis
  space and was named in Fast Company’s 10 Most Innovative
  Companies in North America and listed two years in a row on
  LinkedIn’s Top 50 Startups.

  Dutchie has raised over $600M in funding to date, backed by
  D1 Capital Partners, Tiger Global, Dragoneer, DFJ Growth,
  Thrive Capital, Howard Schultz, Snoop Dogg’s Casa Verde
  Capital, Gron Ventures, members of the founding team at
  DoorDash, Kevin Durant’s Thirty Five Ventures, and other
  notable angel investors.

  About This Job

  Dutchie is seeking a mission-driven Engineering Manager to
  serve as a cornerstone of our Engineering organization. You
  will lead a high-performing team of roughly four to eight
  engineers, fostering a culture of excellence, ownership, and
  psychological safety. As a manager, you are expected to be
  an active coach, a technical steward, and a strategic
  partner to Product and Design, ensuring we build high-
  quality, reliable, enterprise-grade software for our
  customers.

  What You'll Do…

  - Lead and coach a team of 4-8 engineers, providing timely
    feedback, performance management, and guidance to help
    them reach their full career potential.
  - Provide technical direction and oversight on technical
    proposals, rollout plans, and architecture to ensure
    setting up customers and products for success.
  - Stay hands-on by contributing code, adopting modern agentic
    coding practices and tooling, and driving overall
    technical improvements.
  - Drive high standards for system quality and stability, and
    serve as an Incident Commander for live incidents and
    post-mortems.
  - Partner directly with Product and Design stakeholders to co-
    author roadmaps, align product vision with technical
    strategy, and optimize delivery processes.
  - Collaborate with peer Engineering Managers and
    internal/external stakeholders to share knowledge, align
    timelines, and reduce cross-team dependencies.

  What You Bring

  - 2+ years of engineering management experience leading high-
    performing teams and delivering complex, ambiguous
    technical initiatives.
  - Strong foundation in software engineering with prior
    experience as a successful individual contributor and deep
    understanding of architectural best practices.
  - Strong ownership mindset spanning team delivery, technical
    health, customer-centric product alignment, and continuous
    improvement.

  You’ll Get…

  We are targeting a starting salary of $153,000 - 207,000
  based on the intended level for this role.

  In addition to cash compensation, our total rewards package
  includes:

  - Full medical benefits including dental and vision plans to
    ensure you always have the best care.
  - Equity packages in the form of stock options to all
    employees.
  - Technology (hardware, software, reading materials, etc..)
    allowance
  - Flexible vacation and sick days

  At Dutchie, we’re committed to providing an environment of
  mutual respect where equal employment opportunities are
  available to all applicants and teammates without regard to
  race, color, religion, sex, sexual orientation, gender
  identity or expression, pregnancy, age, national origin,
  disability status, genetic information, protected veteran
  status, or any other characteristic protected by law.
  Dutchie believes that diversity and inclusion among our
  teammates is critical to our success, and we seek to
  recruit, develop and retain the most talented people from a
  diverse candidate pool.
