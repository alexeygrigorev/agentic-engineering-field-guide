description: |
  The FreedomPay Commerce Platform is the technology of choice
  for many of the largest companies across the globe in
  retail, hospitality, lodging, gaming, sports and
  entertainment, foodservice, education, healthcare and
  financial services.  FreedomPay’s technology has been
  purposely built to deliver rock solid performance in the
  highly complex environment of global commerce. The company
  maintains a world-class security environment and was first
  to earn the coveted validation by the PCI Security Standards
  Council against Point-to-Point Encryption with EMV standard
  in North America. FreedomPay’s robust solutions across
  payments, security, identity and data analytics are
  available in-store, online and on-mobile and are supported
  by rapid API adoption. The award winning FreedomPay Commerce
  Platform operates on a single, unified technology stack
  across multiple continents allowing enterprises to deliver a
  consistent, repeatable experience on a global scale.
  FreedomPay is a fast paced, high growth company with a great
  culture with competitive benefits and compensation with a
  business casual atmosphere.

  Responsibilities

  - Work within the Agile Scrum team to create stories, tasks,
    estimates, and delivery each Sprint
  - Analyze requirements and translate specifications into
    system designs
  - Apply systems thinking to create solutions across
    environments and products
  - Collaborate in the selection of software development tools
    and frameworks
  - Influence product design by being the voice of
    maintainability
  - Ensure the delivery of high quality and rigorously
    consistent products
  - Contribute to the design of the company's software standard
  - Code application libraries for re-usability and test
    ability.
  - Define projects, tasks, and release deliverables
  - Contribute to software process improvement
  - Strive to become a subject matter expert in FreedomPay
    products and the payment industry
  - Interface with internal stakeholders
  - Learn and adapt to the ever-changing hardware and software
    environments of payment systems and processing
  - Update technical documentation
  - Work with the QA team to ensure proper test plan, test
    coverage, test execution

  Required Skills and Experience

  As the fastest growing commerce company in the industry, we
  offer the opportunity for tremendous upward mobility within
  the company as well as development and professional growth
  opportunities. FreedomPay's fulltime roles provide
  exceptional benefits including medical, prescription, dental
  and vision coverage, Life Insurance, Retirement Plans with
  company match, commission sharing plan, flexible hybrid
  working environment, and great parental and other leave
  programs. All positions must be able to successfully pass a
  background check as well as a credit check.



  FreedomPay is an Equal Opportunity Employer. All qualified
  applicants will receive consideration for employment without
  regard to race, color, religion, sex, sexual orientation,
  gender identity, national origin, disability, or status as a
  protected veteran.
