description: |
  Primary Skills

  Job requirements

  - Design, build, and maintain scalable full-stack applications
    end to end — from frontend UI to backend services, APIs,
    and databases — using React, TypeScript, Go, Java, Python,
    and Node.js.
  - Build and enhance RESTful APIs, gRPC/Thrift integrations,
    microservices, and distributed systems supporting
    business-critical workflows.
  - Participate in architecture reviews, technical design
    discussions, and code reviews; drive engineering practices
    across coding standards, automated testing (incl. Cypress
    UI regression), security, observability, and CI/CD.
  - Troubleshoot complex production issues and drive
    improvements to reliability, performance, and user
    experience.
  - Contribute to cloud infrastructure and deployment automation
    across AWS-based environments.
  - Mentor junior and mid-level engineers, and collaborate
    closely with product managers, architects, and designers
    to deliver high-quality software.
  - Communicate technical decisions, risks, and trade-offs
    clearly to stakeholders and team members.
  - Bachelor's degree in computer science, Software Engineering,
    or equivalent practical experience, with 5+ years of
    hands-on, production-grade full-stack experience.
  - Strong frontend (ReactJS, TypeScript, JavaScript, hooks,
    reusable UI components) and backend (Go, Java, Python, or
    Node.js) development building APIs, services, and
    integrations (REST, gRPC, Thrift; Koa).
  - Solid understanding of system design, distributed systems,
    scalability, and performance optimization.
  - Working knowledge of relational (PostgreSQL, MySQL, Aurora,
    RDS) and non-relational (MongoDB, DocumentDB, DynamoDB,
    Redis) databases.
  - Hands-on AWS experience (ECS, Lambda, API Gateway, S3,
    CloudWatch, and similar services).
  - Experience with Docker, CI/CD (CircleCI), Terraform, and
    modern DevOps practices.
  - Experience writing unit, integration, and UI tests (Jest,
    Cypress, or similar).
  - Agile/Scrum delivery experience with strong ownership across
    distributed, cross-time-zone teams.
  - Familiarity with AI-assisted engineering tools (Gemini,
    Claude Code, GitHub Copilot) to boost productivity and
    code quality.
  - Proven ability to independently own and deliver complex
    technical initiatives.
  - Experience collaborating effectively within distributed and
    agile teams.
  - Strong analytical and problem-solving skills.
  - Excellent communication and stakeholder management
    abilities.
  - Experience mentoring engineers and driving technical
    excellence across teams.
  - Experience with Elasticsearch for search, analytics, and
    large-scale data retrieval.
  - Knowledge of Thrift or similar RPC frameworks for service-
    to-service communication.
  - Experience working within monorepo environments and large-
    scale frontend codebases.
  - Familiarity with Bazel build systems.
  - Infrastructure-as-Code experience using Terraform, AWS CDK,
    or CloudFormation.
  - Experience contributing to shared UI component libraries and
    enterprise design systems.
  - Exposure to event-driven architectures and messaging
    technologies such as Kafka or AWS Event Bridge.
  - Experience in real estate technology, marketplace platforms,
    or customer-facing SaaS products.

