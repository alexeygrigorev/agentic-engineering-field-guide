description: |
  Job Description:

  Software Engineer III designs, codes, tests, and debugs
  scalable mobile applications using React Native and
  TypeScript; maintains and documents program changes with a
  focus on performance, usability, and reliability across iOS
  and Android. Works in complex areas of major CSI
  applications with emphasis on mobile architecture and third-
  party integrations, including banking core systems.
  Contributes to modernization of existing technologies and
  integration layers. Requires strong problem-solving,
  creativity, and high engineering standards to deliver
  intuitive, high-performing mobile experiences.
  Responsibilities:

  - Project Leadership: Own development and rollout of large
    mobile projects and cross-platform solutions integrated
    with backend systems.
  - Standards and Practices: Enforce best practices in React
    Native, TypeScript, mobile performance, and responsive
    design.
  - Project Management: Deliver high-quality mobile features
    efficiently and on time.
  - Technical Specifications: Define mobile architecture, APIs,
    and integration risks (performance, compatibility,
    dependencies).
  - Coaching and Mentorship: Promote Agile, CI/CD, and mobile
    best practices; mentor peers.
  - Expertise and Innovation: Apply modern mobile technologies
    and evolving TypeScript ecosystem.
  - Programming Knowledge: Strong in React Native and
    TypeScript; ability to collaborate across backend and
    integrations.
  - Thought Leadership: Drive mobile UX, architecture, and
    integration strategy in online banking domain.
  - Mentorship: Guide engineers in scalable mobile development.
  - Additional Duties: Support team effectiveness and cross-
    functional initiatives.

  Requirements:

  - Requires 5+ years of professional software engineering
    experience, with strong mobile development experience
    delivering scalable, reliable applications.
  - Must have 4–5 years of hands-on React Native and TypeScript
    experience, including API, backend service, and third-
    party system integrations.
  - Experience with financial systems, banking platforms, core
    integrations, or regulated technology environments
    preferred.
  - College degree in software engineering, or related field or
    equivalent industry experience required.
  - Strong engineering fundamentals, including clean code,
    maintainable architecture, performance, testing,
    reliability, security awareness, and documentation.
  - Clear communicator who can collaborate across engineering,
    product, design, QA, security, architecture, and business
    teams.
  - Ability to manage competing priorities in an Agile
    environment while balancing delivery, support, technical
    debt, and quality.

  As a forward-thinking software provider, Computer Services,
  Inc. (CSI) helps community and regional financial
  institutions solve their customers’ needs through open and
  flexible technologies. In addition to its award-winning core
  banking platform, these include the latest in lending,
  digital banking, payments, financial crime prevention and
  cybersecurity. Building on its 60-year track record of
  personalized service, CSI is shaping the future of banking
  and empowering its customers to rival their competition. For
  more information about CSI, visit www.csiweb.com

