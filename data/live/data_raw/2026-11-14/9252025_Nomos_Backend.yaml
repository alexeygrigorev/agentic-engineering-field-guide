description: |
  About Nomos

  Europe pays more than twice as much for electricity as the
  US or Asia. To reach competitive price levels, Europe has to
  lean on solar and deliver the flexibility that makes this
  feasible. Nomos is building a full-stack power company to
  unlock that flexibility by connecting millions of homes to
  Europe’s energy markets.

  At Nomos, we care about our craft and take full
  responsibility for what we build. We hire for spikes, not an
  absence of weaknesses, and look for exceptional ability
  backed by a record of achievement. This has brought together
  IMO and IOI medalists, former founders and Olympic athletes
  in a team whose individual strengths reinforce one another.



  What you’ll do

  Nomos OS runs our power company. You will build its core
  systems and set the engineering standard as we scale.

  - Build our billing, procurement, metering, market
    communication, and ledger systems.
  - Build the pipelines and integrations behind forecasting,
    partner connections, and asset steering.
  - Set engineering standards across architecture, code review,
    AI tooling, and hiring.



  Exciting challenges

  - Make the next feature easier to build. Understand the
    market’s exceptions well enough to create abstractions the
    whole team can rely on.
  - Keep the architecture ahead of growth. Work through how
    systems behave at 100x today’s load, including where
    correctness, performance, or recovery could break down.



  Who you are

  - You’ve operated systems at scale. You can explain where the
    limits were and how you changed the design.
  - You think through the whole system. You understand
    boundaries, data flow, and how failures spread. Your
    technical decisions account for all three.
  - You take responsibility before it is assigned. You
    investigate unclear problems, set a direction, and hold
    the implementation to the standard you expect from others.



  References

  Moritz Alkofer

  Alexandru Andrei

  Dennis Thanner



  Why join us?

  As an early member of Nomos, you’ll help shape the company
  and share in its financial upside. Backed by Index Ventures,
  we’re building a European category leader in one of the
  world’s largest industries, making electricity affordable
  and Europe more competitive.

  Building a power company from scratch brings complex,
  rewarding challenges and the chance to solve Europe’s energy
  crisis for the long term. You’ll learn from people with
  exceptional depth in their fields, challenge each other’s
  thinking and take responsibility from the start.
