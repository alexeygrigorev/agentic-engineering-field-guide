description: |
  Job Description

  Build technology that makes investing feel good.

  At AJ Bell, we believe investing should feel good. That
  means more than creating great customer experiences. It also
  means having the secure, reliable and resilient technology
  behind the scenes to support our customers, our people and
  the way we operate.

  We're looking for an experienced Senior Software Engineer to
  join our Operational and Regulatory Technology department.
  You'll help build and evolve the services and systems that
  underpin critical business operations, helping us deliver a
  secure, dependable investment platform at scale.

  This is a role for an engineer who enjoys solving complex
  problems, shaping technical solutions and helping others do
  their best work. You'll be part of a cross-functional
  development team where engineers work across our technology
  stack and propositions, with the autonomy to make a
  meaningful contribution and the support to keep developing
  your career.

  What you'll do

  Build technology we can rely on

  - Design, develop and deliver high-quality services, APIs and
    applications that support our operational and regulatory
    capabilities.
  - Work with the team to understand functional and non-
    functional requirements, including scalability,
    performance, availability, security and maintainability.
  - Make thoughtful architectural decisions and help shape
    solutions that are fit for the long term.
  - Develop scalable, highly available and high-performing
    middle-tier components.
  - Contribute to technical standards, engineering practices and
    continuous improvement across the team.
  - Help ensure the technology we build is robust, maintainable
    and ready to evolve as our business grows.

  Lead through engineering

  As a Senior Software Engineer, you'll have an important role
  in shaping how the team works. You'll combine hands-on
  development with technical leadership, helping engineers
  around you grow and raising the quality of what we deliver.

  - Guide and mentor engineers through technical challenges,
    code reviews and knowledge sharing.
  - Help the team make effective architectural and technical
    decisions.
  - Share best practice and encourage high standards across
    development, testing and delivery.
  - Contribute to a culture of continuous improvement and
    engineering excellence.
  - Support the team in delivering high-quality products through
    Agile ways of working.
  - Help create an environment where people can collaborate,
    learn and take ownership.

  How we build

  Our strategy is to have cross-functional development teams,
  with engineers working across different areas of our
  technology stack and propositions.

  You'll work in an Agile environment with a strong focus on
  continuous improvement, automation and engineering quality.
  We believe engineers should understand the wider problem
  they're solving, not simply the individual component they're
  building.

  Technical skills

  You'll bring significant commercial experience developing
  services and APIs, along with a strong understanding of
  modern software engineering practices.

  Essential

  - Significant commercial experience developing services and
    APIs using C# and .NET Core.
  - Strong experience working with MongoDB and/or SQL.
  - Experience applying software design approaches such as
    Domain-Driven Design and MVC.
  - Strong technical background in web development using
    technologies such as Angular, React or Vue.js.
  - Experience developing HTTP-based APIs and implementing
    RESTful services using JSON.
  - Thorough understanding of CI/CD pipelines and modern
    software delivery practices.
  - Experience with Test Driven Development and a good
    understanding of testing frameworks and concepts.
  - A proven track record of developing scalable, highly
    available and high-performing middle-tier components.
  - Experience with containerisation and technologies such as
    Docker and Kubernetes.
  - Experience developing, deploying and maintaining cloud-based
    solutions on AWS.
  - Understanding of the principles behind high-performing web
    pages and applications.
  - Experience or familiarity with Entity Framework Core.

  Desirable

  - Experience or familiarity with communication technologies
    such as Web API and Google Protocol Buffers.
  - Experience with message queues such as RabbitMQ or Amazon
    SQS.
  - Experience working in e-commerce or financial services.

  How you work

  Technical capability is important, but so is how you work
  with the people around you.

  We're looking for someone who:

  - Is comfortable working within Agile, Scrum or SAFe
    environments.
  - Communicates clearly and confidently with both technical and
    non-technical colleagues.
  - Can explain complex technical concepts and contribute
    constructively to architectural discussions.
  - Is motivated, enthusiastic and takes ownership of their
    work.
  - Enjoys helping others develop and sharing knowledge across
    the team.
  - Is curious about how things can be improved and looks for
    practical ways to make a difference.
  - Can balance technical quality with the needs of the product,
    customers and wider business.

  About us:

  At AJ Bell, we believe investing should feel good. Whether
  people are looking for an ISA, pension or dealing account,
  or prefer to invest with the help of a financial adviser or
  independently, we offer easy-to-use solutions to suit people
  from all walks of life.

  We're one of the UK's fastest-growing investment platform
  businesses, trusted by professional financial advisers and
  first-time investors alike.

  More than 762,000 customers trust us to manage over £121.5
  billion in assets. By continually striving to make investing
  simpler and more accessible, we're helping more people take
  control of their financial futures.

  Operational and regulatory technology plays an important
  role in making that possible. The systems and services you
  help build will support the operational foundations of our
  business, helping us deliver a reliable and trusted service
  as we continue to grow.

  We're proud to be recognised as a Great Place to Work® for
  the past two years, building on six consecutive years as one
  of the UK's Best 100 Companies to Work For. It's recognition
  we're proud of and a reflection of the supportive and
  collaborative culture we strive to create for our people.

  What we offer

  - 26 days holiday, increasing with service + buy/sell scheme +
    bank holidays
  - 7% Pension with matched contributions
  - Discretionary bonus scheme
  - Share schemes (including free shares and BAYE)
  - Health Cash Plan and discounted private healthcare
  - Free onsite gym
  - Enhanced family leave (subject to qualifying criteria)
  - Travel and bike loan schemes
  - Employee Assistance Programme

  Life at AJ Bell

  - Regular social events including summer and Christmas parties
  - Learning and development opportunities tailored to you
  - Casual dress code
  - Friendly, supportive team environment

  Our ways of working

  We offer hybrid working, with a minimum of 50% of your
  working time per month spent in the office.

  For new starters, there’s an initial period of full-time
  office working to help you settle in and build
  relationships.

  Inclusion & diversity

  We’re committed to creating an inclusive environment where
  everyone feels respected and able to be themselves at work.

  We welcome applications from all backgrounds and make hiring
  decisions based on skills, experience and potential.

  Your application, reviewed by people

  We believe great hiring starts with people. That's why every
  application is reviewed by a member of our Recruitment team,
  rather than screened by AI. It may take us a few days to get
  back to you, but please be assured that your application
  will be given the time and attention it deserves.
