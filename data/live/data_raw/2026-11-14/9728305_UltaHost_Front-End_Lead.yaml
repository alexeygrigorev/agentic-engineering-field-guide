description: |
  Location: RemoteCompany: UltahostType: Full-Time | Technical
  RoleLevel: Front-End LeadRole Overview

  Ultahost is looking for a skilled and experienced Front-End
  Lead to drive the development and leadership of our user-
  facing applications. This is a hands-on leadership role that
  combines advanced front-end development, team management,
  and technical architecture responsibilities.

  You’ll be working with the latest versions of React and
  Next.js, guiding a growing front-end team, and setting high
  standards for performance, design, and code quality across
  all web-based projects. If you're passionate about building
  high-performance interfaces and mentoring engineers, this
  role is for you.

  Key ResponsibilitiesTeam Leadership & Process Management

  - Lead the front-end team across multiple projects and ensure
    timely, high-quality delivery.
  - Break down product requirements into clear, actionable
    technical tasks.
  - Conduct code reviews and enforce coding best practices and
    maintainability standards.
  - Provide mentorship and technical guidance to junior and mid-
    level developers.

  Architecture & Technical Standards

  - Define and maintain the front-end architecture and
    scalability roadmap.
  - Establish and document UI development guidelines, reusable
    components, and styling conventions.
  - Work closely with product, backend, and design teams to
    ensure seamless implementation.

  Development & Testing

  - Develop, maintain, and optimize high-performance web
    interfaces using React (latest) and Next.js (latest).
  - Perform initial UI/UX testing to ensure visual and
    interactive consistency.
  - Collaborate in sprint planning, task estimation, and
    problem-solving discussions.

  Required Qualifications

  - 5+ years of professional experience in front-end
    development.
  - Strong hands-on experience with React.js and Next.js (latest
    versions).
  - Solid understanding of front-end architecture, performance
    optimization, and SSR (Server-Side Rendering).
  - Experience with modern tooling (TypeScript, Tailwind,
    Vite/Webpack, etc.).
  - Familiarity with RESTful APIs and integration with backend
    services.
  - Previous experience in a lead or senior role involving
    mentorship and code ownership.

  Preferred Skills & Experience

  - Experience working in SaaS or hosting/infrastructure-related
    platforms.
  - Understanding of accessibility, responsive design, and
    cross-browser compatibility.
  - Familiarity with component libraries or design systems
    (e.g., Chakra UI, Material UI).
  - Experience with front-end testing frameworks (e.g., Jest,
    React Testing Library).
