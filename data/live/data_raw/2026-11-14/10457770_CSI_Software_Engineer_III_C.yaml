description: |
  Job Description:

  Software Engineer III's design, code, test, and debug
  scalable applications and services using modern TypeScript
  and Node.js patterns; maintain and document program changes
  with a focus on reliability, performance, and integration
  quality. They competently perform work in complex sections
  of at least one major CSI application, with a strong
  emphasis on backend services and third-party integrations,
  including core systems within the online banking ecosystem.
  The role also includes working with and modernizing existing
  C++ codebases and services, helping to evolve legacy systems
  into more maintainable, service-oriented architectures. They
  maintain and document program changes while working on
  complex integrations and system migrations. This role
  requires use of imagination, originality, and ingenuity to
  uphold high programming standards and deliver resilient,
  secure, and high-performing integration solutions with
  significant business impact. Responsibilities:

  - Project Leadership: Take ownership of the development and
    rollout of entire products or large projects, particularly
    those involving backend services, C++ modernization
    efforts, and complex third-party integrations.
  - Standards and Practices: Enforce department coding standards
    and best practices, with a strong emphasis on TypeScript,
    Node.js, API design, and secure integration patterns,
    while contributing to the modernization of legacy C++
    systems.
  - Project Management: Demonstrate effective and efficient
    project management skills, ensuring successful delivery of
    integration-heavy initiatives and legacy-to-modern
    platform migrations.
  - Technical Specifications: Write technical specifications,
    including API contracts, integration patterns, and
    modernization approaches for legacy C++ systems; identify
    project and programming risks, particularly related to
    third-party dependencies and system interoperability.
  - Coaching and Mentorship: Champion processes and technologies
    (Agile, CI/CD, service-oriented architecture) while
    coaching colleagues on backend development, integration
    practices, and modernization strategies.
  - Expertise and Innovation: Showcase expertise in software
    engineering with a focus on backend systems, integration
    frameworks, and emerging Node.js and TypeScript
    technologies, while contributing to the evolution of
    legacy C++ platforms.
  - Programming Knowledge: Apply knowledge of TypeScript,
    Node.js, and related backend technologies effectively;
    demonstrate working familiarity with C++ and the ability
    to support, maintain, and modernize existing systems.
  - Thought Leadership: Provide proactive investigation,
    problem-solving, and thought leadership, particularly in
    integration design, system interoperability, and
    strategies for migrating legacy platforms to modern
    architectures within the online banking domain.
  - Mentorship: Offer coaching and mentorship to less
    experienced Software Engineers, especially in building
    scalable services, managing complex integrations, and
    navigating legacy-to-modern transitions.

  Requirements:

  - Accredited university, college, or trade school education
    and training in applicable technology; advanced degrees or
    relevant certifications preferred.
  - 7+ years of successful, relevant software engineering
    experience, with a strong focus on backend service
    development and complex system integrations.
  - Advanced proficiency with C++, experience with TypeScript
    and Node.js, including modern backend development
    patterns, scalable service design, and application
    performance considerations.
  - Experience designing, building, testing, debugging, and
    maintaining scalable applications and services in a
    production environment.
  - Experience with financial systems, core banking platforms,
    online banking ecosystems, APIs, or third-party vendor
    integrations strongly preferred.
  - Working familiarity with C++ codebases, including the
    ability to support, maintain, and contribute to
    modernization of legacy systems.
  - Experience with API design, API contracts, third-party
    integrations, vendor dependencies, and system
    interoperability.
  - Ability to work within complex sections of major
    applications, preferably within online banking, financial
    technology, or other highly integrated enterprise
    environments.
  - Experience contributing to legacy-to-modern platform
    migrations, service-oriented architectures, CI/CD
    practices, and Agile development environments.
  - Proven ability to take ownership of large projects or
    product rollouts and manage delivery effectively across
    technical and cross-functional stakeholders.
  - Ability to coach, mentor, and support less experienced
    engineers in backend development, integration practices,
    and modernization strategies.

