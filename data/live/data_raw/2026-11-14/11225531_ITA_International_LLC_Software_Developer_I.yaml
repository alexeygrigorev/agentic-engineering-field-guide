description: |
  Overview

  At ITA International, we’re a tech-enabled professional
  services company. Headquartered in Newport News, Virginia,
  we leverage subject matter expertise, data analytics and
  technology to challenge boundaries and transform
  possibilities.

  With a global presence and a passionate team of over 200
  ITAers, we’re driven by mission success for our customers,
  “In The Arena.” Our expertise spans Operations, Training,
  Engineering, Nanotechnology, Statistics, Machine Learning
  and Software Engineering – enabling data and tech-enabled
  solutions that deliver real value.

  Join our impactful journey at ITA International. As Theodore
  Roosevelt said, “The credit belongs to the man who is
  actually in the arena.” We’re here, standing beside our
  customers, ready to serve and succeed.

  We are looking for a detail-oriented Software Developer I to
  enhance our software offerings. This position focuses on
  writing high-quality code and contributing to the
  development of versatile applications that meet user needs.

  This opportunity is contingent upon successful contract
  award, expected Fall 2026.

  Responsibilities

  Responsibilities:

  - Create baseline software and/or database products

  - Collaborate with senior developers, project managers, and
    other stakeholders to design, develop, test, and deploy
    software solutions

  - Modify and enhance existing software and/or database
    products

  - Write and perform unit tests and peer reviews of technical
    products

  - Troubleshoot, correct, and test code defects

  - Develop and enhance software modules and features based on
    established requirements

  - Implement best practices for software coding and design.

  - Collaborate with team members during code reviews and
    contribute feedback.

  - Aid in the prototyping and testing phases of software
    development.

  - Produce technical documentation for software components and
    design decisions.

  - Participate actively in AGILE sprints and team meetings.

  Qualifications

  Required Experience:

  - 2+ years of experience as a Software Developer or in a
    similar role.

  - Strong programming skills in languages such as Python, Java,
    or comparable.

  Minimum Qualifications:

  - Bachelor’s degree in Computer Science, Information
    Technology, or a related field.

  - Understanding of software development principles and
    methodologies.

  - Capability to work independently as well as part of a team.

  - Ability to obtain and maintain an active Secret Clearance

  Desired Qualifications:

  - Experience with Microsoft Power Applications

  - Experience with structured and unstructured databases

  - Familiarity with version control systems like Git.

  Benefit and Compensation Transparency

  ITA International proudly complies with all federal and
  state benefit and pay transparency laws. Employees of ITA
  can expect a robust benefit package, including:

  - Medical, dental and vision plans
  - Life Insurance
  - Short Term Disability insurance (where applicable)
  - Voluntary ancillary benefit options
  - 401k retirement benefits with employer matching
    contributions

  Pay range for this position is $75,000 - $90,000 annually.

  This position has a broad compensation range due to the
  complexities of government contracting, including contract
  pricing, labor category requirements, funding parameters,
  and varying levels of candidate experience and
  qualifications.

  Application and Employment at ITA International

  ITA International is an Equal Opportunity Employer and all
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  national origin, disability status, protected veteran
  status, or any other characteristic protected by law.

  In compliance with the ADA Amendments Act (ADAAA), ITA
  International would like to ensure that your application
  process goes as smoothly as possible. If you would like to
  preview the physical requirements for this position, or if
  you have a disability and would like to request an
  accommodation in order to apply for a currently open
  position with ITA, please contact us by phone at
  757-246-6781 or email us at HR@ita-intl.com.
