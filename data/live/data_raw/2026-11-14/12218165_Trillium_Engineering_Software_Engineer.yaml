description: |
  Purpose of Position:  Develop, create, and modify general
  computer applications software or specialized utility
  programs.  Analyze user needs and develop software
  solutions. Design software or customize software for
  customers use with the aim of optimizing operational
  efficiency.

  Summary of Essential Job Functions:

  - Modify software programs to improve performance.
  - Monitor computer system performance to ensure proper
    operation.
  - Manage information technology projects or system activities.
  - Develop testing routines or procedures.
  - Collaborate with customers to resolve information technology
    issues.
  - Collaborate with others to determine design specifications
    or details.
  - Design software applications.
  - Apply mathematical principles or statistical approaches to
    solve problems.
  - Provide technical support for software maintenance or use.
  - Communicate project information to team and customers.
  - Assess database performance.
  - Prepare data for analysis.
  - Teach customers and technician how to use computer equipment
    or hardware.
  - Coordinate software or hardware installation.
  - Identify information technology project resource
    requirements.
  - Analyze project data to determine specifications or
    requirements.
  - Provide recommendations to others about computer hardware.
  - Other duties as assigned.

  Education and Experience Qualifications:

  - A BS in computing (Computer Science, Computer Engineering
    etc.) and at least 2 years programming experience.
  - Proficiency with C/C++.
  - Experience with the Qt framework, QML, and Widgets,
    preferred.
  - Experience with video encoding/decoding software (FFMPEG),
    preferred.
  - Experience with unmanned aircraft systems, preferred.

  Physical Demands of Position:

  - Physically able to lift up to 20 pounds
    (materials/equipment)
  - Effective use of computer, laptop, cell phone and other
    mobile device to exchange information.

  Competencies and Skills Requirements:

  - Excellent communication skills, both verbal and written.
  - Excellent team skills and team oriented.
  - Excellent time management skills and meets deadlines.
  - Flexible; able to multi-task in response to time-sensitive
    and changing situations.
  - Effective listening skills.
  - Objective, solution-oriented problem-solving skills.
  - Handles highly sensitive and confidential information.
  - Resourceful, able to network and connect people to
    appropriate resources.
  - Technology savvy, comfortable using MS software products.
  - Strong planning and organizational skills and follow
    through.
  - Resilient, stays positive and solution oriented.
  - Perceptive, discovers underlying issues in situations and
    re-states them in a helpful way.
  - Self-starter with a strong work ethic, able to work without
    direct supervision.

  Disclaimer: The above statements are intended to describe
  the general nature and level of work being performed by
  people assigned to this classification. They are not to be
  construed as an exhaustive list of all responsibilities,
  duties, and skills required of personnel so classified. All
  personnel may be required to perform duties outside of their
  normal responsibilities from time to time, as needed. All
  qualified applicants will receive consideration for
  employment and will not be discriminated against on the
  basis of disability or protected veteran status.
