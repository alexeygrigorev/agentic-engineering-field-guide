title: Software Developer
company: AM Specialty
location: New York, USA
work_type: FULL_TIME
company_size: 39 Employees
description: |
  What You'll Do

  - Build and maintain full-stack applications, including
    frontend, backend, APIs, and infrastructure.
  - Take end-to-end ownership of our Shopify app, from the
    customer checkout experience to the tools merchants use
    within Shopify Admin.
  - Design and develop integrations with Shopify, other
    e-commerce platforms, and external partners, including
    payment providers, banks, claims administrators, and
    insurance carriers.
  - Build reliable and secure systems for critical operations
    such as billing, payouts, claims processing, and customer
    data management.
  - Develop data models and workflows to support insurance
    products, claims processing, and merchant analytics.
  - Manage cloud infrastructure, including deployments,
    databases, background jobs, and monitoring.
  - Work directly with the CEO to translate business priorities
    into technical solutions.
  - Implement A/B testing, analytics tracking, and tools to
    improve customer conversion.
  - Establish engineering best practices for CI/CD, code
    reviews, testing, documentation, and monitoring.
  - Make architectural decisions that allow the platform to
    scale from dozens to thousands of merchants.

  What We're Looking For

  - 2–6 years of professional software engineering experience,
    including experience building and maintaining production
    applications.
  - Hands-on experience building on Shopify, including Shopify
    apps, checkout or theme extensions, or custom storefront
    integrations.
  - Strong full-stack development skills, with the ability to
    build both intuitive frontend interfaces and reliable
    backend systems.
  - Proficiency in JavaScript/TypeScript and modern frontend
    frameworks, preferably React.
  - Experience with Node.js, REST APIs, webhooks, and background
    processing.
  - Experience working with relational or NoSQL databases, such
    as PostgreSQL, Supabase, or DynamoDB.
  - Strong attention to reliability, security, and data
    accuracy, particularly in systems handling financial
    transactions and sensitive information.
  - Ability to work independently, navigate ambiguity, take
    ownership, and deliver solutions without extensive
    direction.
  - Strong communication skills and the ability to collaborate
    with business stakeholders and merchants.

  Preferred Qualifications

  - Experience with Shopify's APIs and extensibility tools,
    including the Admin API, Shopify Functions, checkout UI
    extensions, and theme app extensions.
  - Experience troubleshooting and supporting live e-commerce
    stores and merchant integrations.
  - Familiarity with checkout flows, post-purchase experiences,
    and e-commerce operations.
  - Experience with payment processing, billing, or financial
    reconciliation.
  - Background in insurtech, fintech, or other regulated
    industries.
  - Experience with Supabase and webhook-driven architectures.
  - Familiarity with AI-assisted development tools.
