description: |
  Company Description

  Depop is a peer-to-peer circular fashion marketplace where
  anyone can buy, sell and discover secondhand fashion. Our
  mission is simple: to make fashion circular by making
  secondhand as exciting and rewarding as buying new. Founded
  in 2011, Depop’s diverse community has helped move resale
  into the mainstream, where buying secondhand is no longer an
  alternative, but how people of different ages now engage
  with fashion. Today, more than 56 million registered users
  come to Depop to find great value, express their own
  personal style and give clothes a longer life. We believe
  that everything you want already exists, and our role is to
  help people discover it. Powered by a team of over 500
  people, our company is headquartered in London, with offices
  in New York. In 2021, Depop became a wholly-owned subsidiary
  of Etsy - the global marketplace for unique and creative
  goods - and continues to operate as a standalone company.
  For more information, visit www.depop.com We aim to create
  an inclusive environment where everyone is welcome, no
  matter who they are or where they’re from. Just as our
  platform connects people globally, we believe our workplace
  should reflect the diversity of the communities we serve. We
  thrive on the power of different perspectives and
  experiences, knowing they drive innovation and bring us
  closer to our users. We’re proud to be an equal opportunity
  employer, providing employment opportunities without regard
  to age, ethnicity, religion or belief, gender identity, sex,
  sexual orientation, disability, pregnancy or maternity,
  marriage and civil partnership, or any other protected
  status. We’re continuously evolving our recruitment
  processes to ensure fairness and are open to accommodating
  any needs you might have. AI Disclosure: We use AI tools
  (Google Gemini) to help our team source and review
  applications for roles with a high volume of applications.
  These tools assist our recruiters in identifying great
  talent but do not replace human decision-making. At Depop,
  every hiring decision is made by a human. If, due to a
  disability, you need adjustments to complete the
  application, please let us know by sending an email with
  your name, the role to which you would like to apply, and
  the type of support you need to complete the application to
  adjustments@depop.com.

  Engineering Manager, Pricing - Buyer ValueThe role

  We're looking for a UK-based Engineering Manager to lead our
  new Pricing - Buyer Value squad, part of our wider Pricing
  initiative within the Supply pillar. This is a brand-new
  team, working closely alongside an established Pricing team
  already in place.

  Pricing shapes the success of sellers on Depop, and this
  team's work will have a real, visible impact on the
  experience millions of people have on our marketplace.
  You'll focus on the buyer side of the price experience:
  offers, deals, and helping buyers feel confident they're
  getting great value on secondhand fashion.

  You'll partner closely with a Product Manager and Product
  Designer, collaborate with ML, and manage a cross-functional
  team of iOS and backend engineers. You'll be accountable for
  the squad's delivery, health, and effectiveness. We work
  with an experimentation culture and a data-driven approach,
  and you'll help the team learn and iterate quickly through
  measurement.

  This role suits an Engineering Manager who's excited to
  build a team from the early days, cares deeply about
  delivery and team effectiveness, and wants to do it in a
  high-performance, high-compassion environment.

  Responsibilities

  - Deliver value and drive results. Be accountable for the
    squad's day-to-day delivery, ensuring work is well-scoped,
    sequenced, and shipped with a strong quality bar. Drive a
    delivery cadence that balances impact, speed, and long-
    term maintainability, and that aligns clearly with
    business and product goals and metrics.
  - Collaborate across functions. Partner closely with Product,
    Design, Product Analytics, ML, and the wider Pricing
    initiative to align on priorities, define what matters,
    and keep work moving across differing perspectives.
    Communicate progress, risks, and outcomes clearly to
    stakeholders and leadership.
  - Help establish a new team. Partner with Product and
    Engineering leadership to plan against a roadmap,
    establish strong ways of working, and surface risks,
    dependencies, and trade-offs early.
  - Lead and support your engineers. Line manage a cross-
    functional team of iOS and backend engineers (typically 4
    to 6), creating an environment where people can do their
    best work. While you're encouraged to stay close to the
    technical detail, your primary focus is enabling the team
    to perform and deliver at their best.
  - Foster growth and feedback. Be accountable for your
    engineers' performance and career growth, providing
    regular feedback, coaching, and clear expectations through
    1:1s and continuous support.
  - Build an inclusive culture. Foster a respectful, inclusive
    team culture that supports learning, continuous
    improvement, and a sustainable pace, and that holds a high
    bar for performance and impact.

  Qualifications

  You'll be a strong fit if you:

  - Have experience as an Engineering Manager growing high-
    performing engineers, teams, and processes, and are
    excited by the chance to build a new team.
  - Care deeply about delivery and team effectiveness, and get
    satisfaction from helping teams ship high-quality work
    that drives measurable business impact.
  - Have a solid engineering background and can work across the
    full stack, leaning on your technical judgement to provide
    the connective tissue between backend and frontend and
    uphold high engineering standards.
  - Make strong decisions based on the data available in the
    face of ambiguous or shifting priorities, with a
    preference for simplicity and a bias towards delivery.
  - Build strong relationships across Product, Design, ML, and
    other stakeholders, and can navigate differing goals to
    reach results that work for everyone.
  - Lead with empathy and clarity, giving feedback, coaching,
    and support while maintaining a high bar for performance.
  - Have a healthy, curious approach to AI: comfortable
    introducing AI tools into the team's day-to-day, and able
    to lead the team in adopting them safely and well rather
    than shying away from them.
  - Align with our Depop values: showing up for the community,
    having each other's backs, acting with purpose, and
    thinking thrift with sustainability and cost in mind.

  Bonus points if you:

  - Are familiar with any of Swift (iOS), Scala, or TypeScript.
  - Have worked on commercially sensitive parts of a marketplace
    or e-commerce product.
  - Are comfortable with experimentation and impact validation,
    such as A/B testing.
  - Are familiar with observability, tracking, and data pipeline
    tools and methodologies.
  - Have previously worked in an app-first business.

  Additional Information

  Health + Mental Wellbeing

  - PMI and cash plan healthcare access with Bupa
  - Subsidised counselling and coaching with Self Space
  - Cycle to Work scheme with options from Evans or the Green
    Commute Initiative
  - Employee Assistance Programme (EAP) for 24/7 confidential
    support
  - Mental Health First Aiders across the business for support
    and signposting

  Work/Life Balance:

  - 25 days annual leave with option to carry over up to 5 days
  - 1 company-wide day off per quarter
  - Impact hours: Up to 2 days additional paid leave per year
    for volunteering
  - Fully paid 4 week sabbatical after completion of 5 years of
    consecutive service with Depop, to give you a chance to
    recharge or do something you love.
  - Flexible Working: MyMode hybrid-working model with Flex,
    Office Based, and Remote options *role dependant
  - All offices are dog-friendly
  - Ability to work abroad for 4 weeks per year in UK tax treaty
    countries

  Family Life:

  - 18 weeks of paid parental leave for full-time regular
    employees
  - IVF leave, shared parental leave, and paid emergency
    parent/carer leave

  Learn + Grow:

  - Budgets for conferences, learning subscriptions, and more
  - Mentorship and programmes to upskill employees

  Your Future:

  - Life Insurance (financial compensation of 3x your salary)
  - Pension matching up to 6% of qualifying earnings

  Depop Extras:

  - Employees enjoy free shipping on their Depop sales within
    the UK.
  - Special milestones are celebrated with gifts and rewards!
