  We value candidates who understand and connect with the
  experiences of students in public and access-focused higher
  education systems (CUNY), whether through their own academic
  background or professional work. The ideal candidate has a
  background in the training model we use (web development
  coding bootcamp flagship graduate or web development coding
  bootcamp flagship instructor) along with the specific
  technology stack that we train (PERN) and has held the role
  of a professional Junior Software Engineer with directly
  relevant hands-on work experience. If your experience
  doesn’t perfectly match but you believe you’d be a strong
  fit, we encourage you to apply.

  Examples of bugs you should be able to troubleshoot:

  1: A student says: “node -v isn't working” and you inform
  them that nodeJS is not yet installed.

  2: A student is running their client code on one local
  server (Port 3000) and their backend code on another local
  server (Port 1234). With respect to Port 3000, they make an
  AJAX request through their browser to the local server on
  Port 1234. The student receives a CORS error. They send the
  same request through Postman. The student does not receive a
  CORS error. They put in a help ticket to have a thorough
  understanding of why this is happening, as well as some
  possible solutions (forward proxy or whitelisting).

  3: A student puts in a help ticket to install postgres on a
  device running Mac OS. Another student puts in a help ticket
  to install postgres on a device running Windows OS.

  4: A student wants to practice responsive web design, so
  they take ownership of some open issues on their GitHub
  project management board for it. They accidentally use a
  media feature incorrectly such as using min-width versus
  max-width. You must be able to help them identify this mix
  up, and provide a solution as to why the style never applied
  to the intended screen, in a constructive and effective way.

  5: A student sets up Okta’s Auth0, however the first login
  fails despite it working upon refresh. It is up to you to
  discuss with the student, articulate the solution, and if
  necessary, share the working code.

  6: A student puts in a help ticket that just reads as
  “getting error: detached HEAD state, please help in breakout
  room 8”. You should be able to explain to them git’s
  provided auto-message describing what a detached HEAD state
  is, that it does not classify as an error, and what is
  actually happening. Further, you should be able to explain
  when it is useful and when it is not useful for a student’s
  immediate purposes, especially if they reached that point in
  the terminal inadvertently. Be able to explain to them that
  their pointer is pointing to a commit and not to a branch,
  how that differentiation is operationally relevant, and how
  to configure the pointer to point back to a branch if that
  is their intention.

  7: A student is making a POST request through Postman. Turns
  out, they are using “body -> raw -> Text” when they are in
  fact trying to send the JSON representation of their React
  Form stored on React State. This is confusing to them,
  because they are not getting an error, just a blank response
  displaying on Postman. Everything looks fine, nothing
  crashes, but it is a silent bug. Server-side, express is
  configured such that: “app.use(express.json())” for parsing
  request bodies. From here, you should be able to debug with
  them such that they instead use ““body -> raw -> JSON” in
  order for the request to be properly formatted for their
  purposes, resulting in what they initially anticipated to
  see from a successful request-response ‘cycle’ through
  Postman.

  8: A student understands how to use git stash and git stash
  apply as a tool, but they do not fully understand what’s
  happening under-the-hood. They just ‘have a feeling’ of when
  to use them, and have so far been right each time, but they
  would like to ‘have an understanding’ of it in a first-
  principles way. You should be able to explain to them that
  “git stash” takes a snapshot and hides it off-branch and
  then “git stash apply” replays that snapshot as a patch onto
  current code. You do not need to go into how the stash is a
  stack, but just provide the clear reasoning about its use
  case.

  9: Be able to extensively explain either during lecture, a
  help ticket, or an office hour about the distinct ‘zones’ in
  git such as: working directory, staging area, local
  repository, and remote repository, especially if a student
  either is trying to run a terminal command not applicable to
  that particular zone or if a student wonders why they have
  to still do “git pull” after pushing to the remote branch
  and merging onto main on the remote repository. They should
  be able to both execute the workflow and understand it,
  through you.

