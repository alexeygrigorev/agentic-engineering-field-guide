  About the NYC Tech Talent Pipeline (TTP)

  TTP is a public-private partnership, launched by the Mayor’s
  Office in May 2014 to support the growth of the NYC tech
  sector and prepare New Yorkers across the five boroughs for
  21st-century jobs. The Tech Talent Pipeline works with
  public and private partners to define employer needs,
  develop and test training and education solutions, and scale
  solutions throughout New York City, delivering quality
  talent for the City’s businesses and quality jobs for New
  Yorkers.

  The Tech Talent Pipeline Residency (TTPR), a training and
  internship placement program for a cohort of computer
  science undergraduates of CUNY BMCC, is seeking an
  experienced Fullstack Web Development Lead Teaching
  Assistant to deliver specialized software engineering
  support in the form of a software engineering coding
  bootcamp for TTPR. This role is ideal for individuals who
  possess a deep passion for teaching and a commitment to
  expanding access to the tech industry. This position is
  available as of April 2026, and will be terminated at the
  end of the funding period. We will also be hiring: 1 Lead
  Instructor, 4 Teaching Assistants, and 2 Peer Tutors.

  Anticipated Start: 1 June 2026

  Anticipated End: 21 August 2026

  Program Supported: TTP Residency @ BMCC

  Reports To: TTPR Program Manager

  Weeks (12)

  Week 1: Warp, Cursor, Claude Code + HTML/CSS/JS/Git (Solo
  Git)

  Week 2: Codex, Claude Cowork + HTML/CSS/JS/Git
  (Collaborative Git)

  Week 3: ReactJS + APIs

  Week 4: Server

  Week 5: Database

  Week 6: Client-Side Routing + Review

  Week 7: CRUD (Solo) + Deployment + Security

  Week 8: Capstone I (Groups of 4)

  Week 9: Capstone II (Groups of 4)

  Week 10: Capstone III (Groups of 4)

  Week 11: Capstone III (Groups of 4)

  Week 12: Capstone III (Groups of 4) + Demo Day

  Lead Teaching Assistant Duties

  • Lead or co-lead lecture if Instructor is out

  • Record attendance

  • Live code if lecture requires pair programming

  • Manage help ticket board

  • Function as scrum master for half of capstone projects per
