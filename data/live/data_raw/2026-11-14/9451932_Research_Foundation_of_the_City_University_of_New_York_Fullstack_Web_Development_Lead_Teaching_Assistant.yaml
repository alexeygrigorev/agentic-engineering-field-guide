  Philosophy:

  Everything aims toward the target of students becoming
  above-average or exceeding expectations of an early-career
  software engineer intern in the contemporary workforce.

  For example, we’re not looking for capstone projects that
  would have stood out years ago; we’re looking for original
  and intentional projects that will stand out in the present-
  day job market, where every moment, especially the project-
  building phase, has both instructive and industry value.

  With respect to the outcome, the target is not just to
  attend a bootcamp nor graduate from one, but to be
  internship-ready and be competitive candidates in the job
  market because of the training itself and the training
  environment co-created with them.

  With respect to training delivery, the pedagogical idea is
  to facilitate training that balances structured
  presentations with interactive discussions, emphasizing
  other methods such as two-way communication, flipped
  classrooms, and peer-to-peer collaboration (pair-programming
  via driver-navigator) as keys to learner success.

  With respect to agile ceremonies, students should receive
  training to actively communicate and actively listen,
  internalizing them as opportunities for a real dialogue,
  rather than as only a routine formality.

  With respect to technical documentation, students should
  receive training to diagram and document as if they were
  contributing to a professional runbook or participating in a
  sprint review.

  With respect to technical communication, students should
  receive training to talk with precision about a technical
  concept, and not talk around it nor talk past it.

  With respect to technical implementation, students should
  receive training to not just understand, observe, nor code-
  along, they should apply (so they know they know it) and
  demonstrate (so others know they know it).

  With respect to persistence, we believe in being able to
  promptly identify and address accordingly when a student is
  experiencing one of the following in their learner journey:
  unproductive struggle and productive struggle.

  With respect to a support system, the aim is to provide
  active support and guidance to students, adapting between
  standardized and personalized approaches as needed, with
  strong active listening skills.

  Final remark: We are committed to showing up for others,
  responding not only to what is asked, but to what is needed.
  If a trainee or staff member needs support, whether stated
  or unstated, expressed or not, we step forward to meet the
  need and act with care, awareness, and initiative.

