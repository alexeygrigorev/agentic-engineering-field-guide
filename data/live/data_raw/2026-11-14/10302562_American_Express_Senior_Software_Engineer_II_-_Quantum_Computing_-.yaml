description: |
  Joining Amex Tech means discovering and shaping your
  contribution to something big. Here, you can work alongside
  talented tech teams and build a unique career with the
  Powerful Backing of American Express. With a range of
  opportunities to work with the latest technologies, and a
  commitment to back the broader engineering community through
  open source, our mission is to power your success. Because
  Amex Tech is powered by our technology, our culture, and our
  colleagues.

  The Enterprise Data and AI organization unites the data
  governance, strategy, engineering, and product teams with
  those responsible for AI engineering, generative AI
  enablement, and automation product and engineering. This
  group plays a pivotal role in leveraging data as a core
  driver of innovation and integrating AI capabilities to
  transform products, operations, and customer experiences.
  The EDAI organization also incorporates technology Research
  & Development and experimentation with emerging
  capabilities, along with engineering support for Amex
  Digital Labs. This integration ensures that research
  breakthroughs seamlessly translate into business impact.

  Responsibilities

  - Design, prototype, and evaluate quantum algorithms to
    address complex computational problems in finance.
  - Collaborate with interdisciplinary teams—including quantum
    scientists, data scientists, and financial engineers—to
    integrate quantum solutions into real-world financial
    workflows.
  - Develop and maintain quantum software libraries, tools, and
    simulation environments.
  - Present technical findings internally and externally through
    presentations, seminars, and written documentation.
  - Publish high-quality research and represent the organization
    at leading conferences and industry forums.

  Qualifications

  - Ph.D. or Master’s degree in Engineering, Physics,
    Mathematics, Computer Science, or a related discipline; or
    equivalent industry experience.
  - Minimum of 2 years of hands-on experience in quantum
    computing (QC) or quantum information science (QIS).
  - Deep understanding of quantum information theory, including
    quantum algorithms, error correction, and entanglement.
  - Strong foundation in discrete mathematics, numerical
    methods, and scientific computing.
  - Proven track record of peer-reviewed publications in quantum
    computing or closely related fields.
  - Proficiency with one or more quantum programming frameworks:
    Qiskit (preferred), Cirq, Q#, or similar platforms.
  - Advanced programming skills in Python, with experience in
    developing robust, production-level software.
  - Strong analytical and problem-solving abilities with a high
    level of intellectual curiosity.
  - Excellent organizational, communication, and decision-making
    skills.



  Preferred Qualifications:

  - Familiarity with hybrid quantum-classical approaches and
    variational algorithms (e.g., VQE, QAOA).
  - Experience working with quantum simulators and quantum
    hardware platforms.
  - Exposure to financial modeling, portfolio optimization, or
    risk analytics is a strong plus.
  - Depending on factors such as business unit requirements, the
    nature of the position, cost and applicable laws, American
    Express may provide visa sponsorship for certain
    positions.

  About Us

  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. From delivering
  differentiated products to providing world-class customer
  service, we operate with a strong risk mindset, ensuring we
  continue to uphold our brand promise of trust, security, and
  service.

  As part of Team Amex, you’ll experience our powerful backing
  with comprehensive support for your holistic well-being and
  many opportunities to learn new skills, develop as a leader,
  and grow your career. Here, your voice and ideas matter,
  your work makes an impact, and together, you will help us
  define the future of American Express.

  About the Team

  We back you with benefits that support your holistic well-
  being so you can be and deliver your best. This means caring
  for you and your loved ones' physical, financial, and mental
  health, as well as providing the flexibility you need to
  thrive personally and professionally:

  - Competitive base salaries
  - Bonus incentives
  - 6% Company Match on retirement savings plan
  - Free financial coaching and financial well-being support
  - Comprehensive medical, dental, vision, life insurance, and
    disability benefits
  - Flexible working model with hybrid, onsite or virtual
    arrangements depending on role and business need
  - 20+ weeks paid parental leave for all parents, regardless of
    gender, offered for pregnancy, adoption or surrogacy
  - Free access to global on-site wellness centers staffed with
    nurses and doctors (depending on location)
  - Free and confidential counseling support through our Healthy
    Minds program
  - Career development and training opportunities

  For a full list of Team Amex benefits, visit our Colleague
  Benefits Site.

