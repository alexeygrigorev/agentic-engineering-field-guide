description: |
  Job Title

  Engineering Manager - Pricing Technology

  Job Description

  So, who are we?

  IG Group is a FTSE 100 fintech operating across five
  continents, serving over 1.4m customers and handling
  billions of dollars in transactions – built on scale, trust,
  and proof. We didn't pivot to innovation; it's how we've
  always operated. What that means for the people who work
  here is real: genuinely complex problems to solve, the
  technology and resources to tackle them properly, and the
  kind of scope that's rare in established businesses.



  The bar is high – bring a curious and forward-thinking
  mindset and we'll give you the platform to define what comes
  next.



  Join us at IG – the future gets built here.

  Your role in the team

  As a trusted business partner, the Engineering Manager will
  support the bridge between technology and the wider IG team
  and will need a commercial mindset and be comfortable
  working together across the business, partnering among
  others with Trading, Risk & Compliance stakeholders. You’ll
  support the Head of Core Trading in creating an ambitious
  technology and digital strategy that will inspire a vision
  for the art of the possible and support the creation of
  products and services that are loved by our clients.



  What you'll do

  - Contribute to designing a compelling vision for the future
    of Core Technology, enabling it to deliver on the needs of
    IG

  - Ensuring the day-to-day technology services within the
    Pricing Technology domain are fit for purpose and aligned
    to the overall IG risk appetite and are yielding the
    desired results for our clients

  - Translating commercial, business and technology strategy
    into actionable product and delivery outcomes whilst
    supporting the creation of a compelling experience for
    customers

  - Influencing for positive outcomes across the Core Technology
    leadership team and contributing to the Extended
    Leadership Team of IG Group Technology

  - Creating and championing a culture of innovation across Core
    Technology and more broadly in IG at every opportunity

  - Staying connected to the outside market, adopting future-
    forward technology for the benefit of IG

  - Supporting the communication of a vision that attracts great
    technology talent and inspires the team to achieve the art
    of the possible

  - Nurturing a leadership team to elevate energy and ambition

  - Acting as a role model for IG’s culture and behaviours with
    all stakeholders



  Who we’re looking for?

  You’re curious about things like the client experience, the
  rapid developments in tech, and the complex world of fintech
  regulation. You’re also a confident, creative thinker with a
  knack for innovating. We know that you know every problem
  has a solution. Here, you can try new ideas and lead the way
  in creating inspiring experiences for our clients and
  everyone around you.



  We don’t fit the corporate stereotype. If you want to work
  for a traditional, suit-and-tie corporation that just gives
  you a pay cheque at the end of the month, we might not be
  for you. But, if you have that IG Group energy and you can
  stand behind what we believe in, let’s raise the bar
  together.



  What you’ll need for this role



  - Experience leading at a senior level with a comprehensive
    understanding of the latest technology and platforms.

  - Hands-on experience creating and designing technology
    strategy and architectures, software engineering & IT
    leadership.

  - Demonstrable use of technical knowledge and commercial
    acumen to influence business strategy

  - Has experience in introducing and influencing change within
    organisations.

  - Experience managing teams globally and across IT
    disciplines, identifying and nurturing talent.

  - Has a clear understanding of what a modern and efficient,
    engineering-led Technology function looks like

  - Has experience with AI First Engineering practices including
    End to End AI Spec driven development

  - Demonstrable experience with building and scaling low
    latency market data pricing and distribution platforms.

  - Real-world experience in managing and modernising mission-
    critical complex, legacy systems an advantage

  - Experience in building and managing global shared technology
    platforms for use by multiple different functions an
    advantage







  The perks

  It really is more than a job. We’ll recognize your talent
  and make sure that you can still have a life – at work, and
  outside of it. Networks, committees, awards, sports and
  social clubs, mentorships, volunteering opportunities, extra
  time off… the list goes on.

  - Competitive salary

  - Flexible Benefits Package on top of your salary (12%)

  - Private medical cover

  - Life insurance

  - Contribution to gym memberships

  - 25 Days holiday, with 1 additional day off to celebrate your
    Birthday & 2 additional days off a year for voluntary work
    (28 in total

  - The option to buy or sell holiday days.

  - Unlimited access to the LinkedIn Learning Platform

  - A comprehensive global and local onboarding process

  - Employee-led LGBTQ+, Women’s, Black and Parents & Carers
    networks with an annual budget for organising events &
    projects that foster an open, diverse and inclusive
    culture

  - Option to participate and create ESG initiatives based on IG
    Brighter Future Fund



