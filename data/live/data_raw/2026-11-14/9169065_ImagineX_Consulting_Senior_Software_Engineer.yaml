description: |
  ImagineX is a tech company that deploys AI-assisted teams to
  build and secure mission-critical enterprise solutions with
  our clients – spanning software, data, and AI. Structured
  like a software company, not a traditional consultancy, we
  blend deep technical expertise with authentic values,
  achieving world-class satisfaction (NPS 91). Our dedicated
  teams specialize in software, data, and AI across the U.S.
  and LATAM, bridging the gap between boutique agility and
  enterprise scale.

  As a Software Engineer II specializing in Java full‑stack
  development with a strong focus on AI‑enabled engineering,
  you will design and deliver complex enterprise applications
  while shaping how AI accelerates our development lifecycle.
  With 7+ years of hands‑on experience, you’ll contribute to
  architecture, mentor junior engineers, and integrate
  AI‑powered capabilities into modern Java systems. This role
  is ideal for an engineer who thrives in full‑stack
  environments, understands scalable distributed systems, and
  is excited to apply AI to improve both product functionality
  and engineering velocity.

  Responsibilities

  - Design, develop, and maintain backend services using Java,
    Spring Boot, and modern architectural patterns
  - Build intuitive, performant front‑end experiences using
    React, Angular, or Vue
  - Lead technical design discussions and contribute to
    architectural decisions
  - Integrate AI/ML capabilities into applications (e.g.,
    embeddings, LLM‑powered features, intelligent automation)
  - Use AI‑assisted development tools to accelerate coding,
    testing, documentation, and refactoring
  - Mentor junior engineers and promote engineering best
    practices across the team
  - Collaborate closely with product, data, and AI teams to
    deliver end‑to‑end solutions
  - Contribute to CI/CD pipelines, cloud deployments,
    observability, and performance optimization
  - Ensure security, scalability, and maintainability across the
    full stack

  Qualifications

  - 7+ years of professional software engineering experience
  - Advanced proficiency in Java, Spring Boot, and microservices
    architectures
  - Strong experience with front‑end frameworks such as React,
    Angular, or Vue
  - Experience integrating AI/ML services or building
    AI‑enhanced features (LLMs, vector search, model
    inference, etc.)
  - Familiarity with cloud platforms (AWS, Azure, or GCP) and
    container orchestration (Docker, Kubernetes)
  - Strong understanding of distributed systems, API design, and
    modern DevOps practices
  - Experience with relational and NoSQL databases
  - Ability to lead technical initiatives and mentor
    less‑experienced engineers
  - Excellent communication skills and the ability to
    collaborate with cross‑functional teams

  This role is based in the US and only open to citizens and
  permanent residents of the US who do not require visa
  sponsorship.
