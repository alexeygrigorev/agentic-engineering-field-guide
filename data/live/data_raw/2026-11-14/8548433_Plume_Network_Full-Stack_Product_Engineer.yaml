description: |
  About Plume

  Plume is a public, EVM‑compatible blockchain built for Real
  World Assets (RWAs). We go beyond tokenization — enabling
  assets to be used like crypto: stake, swap, lend, borrow,
  loop, and more.

  By integrating institutional‑grade assets with DeFi tools,
  Plume makes private credit, ETFs, commodities, and other
  traditionally inaccessible assets permissionless,
  composable, and usable at a click. Our mission: bridge
  traditional finance and crypto through adoption without
  sacrificing transparency or user experience.

  - 180+ RWA companies building dapps and tokenizing assets on
    Plume’s testnet, ranging from collectibles and real estate
    to equities and private credit
  - 50+ technology partners working with Plume and offering
    special services to our ecosystem partners
  - Experienced team of 20+ crypto, finance, and tech
    professionals from:
    - Crypto: Coinbase, dYdX, LayerZero, Binance, Galaxy Digital,
      Kraken
    - Finance/Tech: JP Morgan, Robinhood, Google, Coupa, Affirm
  - Backed by great investors and operators including:
    - YZi Labs, Brevan Howard, Haun Ventures, Galaxy Digital,
      Lightspeed, Faction, Superscrypt, SV Angel, and more

  Highly motivated, independent Web3 engineer that thrives in
  uncertainty, believers in the startup ethos of shipping
  fast, constantly iterating, and not being afraid to pivot.
  As one of the first full time engineers at Plume, you will
  work directly with the CTO to build beautiful, responsive,
  and robust user experiences.

  Overall Responsibilities

  - Build full-stack product experiences like our end-to-end
    onboarding platform and testnet campaign dashboard
  - Work with smart contract engineers to integrate blockchain
    calls in Plume apps
  - Work with designers to create a beautiful, responsive
    frontend
  - Design and implement a resilient backend architecture to
    support API servers, databases, and indexers
  - Optimize backend and frontend code to reduce latency and
    increase reliability

  Within 1 month, you should expect to…

  - Onboard to the team and existing application code
  - Understand the product operating model at Plume and how we
    prioritize our core product areas
  - Ship at least 2 new features and make improvements on top of
    our end-to-end onboarding platform
  - Design the backend architecture to support the testnet
    campaign dashboard
  - First learn and then lead our weekly QA, and present product
    demos to the team

  Within 3 months, you should expect to…

  - Launch the incentivized testnet campaign dashboard
  - Integrate the Plume chain and all Plume products with robust
    monitoring and alerting infrastructure
  - Work directly with the CTO to propose and implement security
    policies
  - Brainstorm novel product experiences to build for Plume
    mainnet
  - Mentor and give guidance to junior product engineers
  - Interview prospective engineering hires and participate in
    the hiring committee

  Qualifications

  - Web3 Hands on Development Exp on apps/dapps that are in
    productions being used by 1000s of users. Project work is
    not considered as part of your experience or Web2. MUST
    have Web3 experience
  - 5+ years of experience in software engineering at a
    reputable startup or a large tech company
  - 3+ years of experience in frontend / full-stack development,
    with specific experience in React or a React-like
    framework, NodeJS, Express, Docker, AWS, Solidity, NOT
    JAVA!
  - 3+ years of experience in backend / full-stack development,
  - You must be based out of Canada or the US
  - Familiarity with AWS services or deep familiarity with other
    cloud providers
  - Candidates without a Bachelor’s degree in a computer science
    / engineering-related field must have an exceptional work
    history
