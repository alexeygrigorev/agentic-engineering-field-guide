  Senior Software Engineer, Infrastructure & Operations

  Our Technology team is the backbone of our company:
  constantly creating, testing, learning and iterating to
  better meet the needs of our customers. If you thrive in a
  fast-paced, ideas-led environment, you’re in the right
  place.

  Why this job’s a big deal:

  You will work on modernizing our development platform and
  have the opportunity to impact how hundreds of engineers
  build and deploy code.  The  Developer Platform Team is
  responsible for ensuring that Priceline’s software engineers
  can build, test, stage, and deploy their code changes with
  minimal friction and high confidence. We design, develop,
  and maintain these systems with developer experience in
  mind, focused on increasing engineering velocity while
  mitigating risk.

  Why this job’s a big deal:

  You will work on modernizing our development platform and
  have the opportunity to impact how hundreds of engineers
  build and deploy code.  The Developer Platform Team is
  responsible for ensuring that Priceline’s software engineers
  can build, test, stage, and deploy their code changes with
  minimal friction and high confidence. We design, develop,
  and maintain these systems with developer experience in
  mind, focused on increasing engineering velocity while
  mitigating risk.


  In this role you will get to:

  - Work with a team of software engineers to build and deploy
    software that orchestrates complex deployments,
    progressively rolls them out, and continuously monitors
    their health.
  - Design, implement, and maintain our internal build pipeline
    infrastructure and services.
  - Debug and resolve the issues developers encounter when
    attempting to use the services we maintain, with a focus
    on continuously improving the developer experience.
  - Collaborate with Security, Architecture, and SDET teams to
    ensure code meets security and quality requirements and is
    deployed in alignment with standards and governance
    processes.

  Who you are:

  - Advanced development skills in at least one of the following
    programming languages: Javascript/Typescript (Preferred),
    Go, Python, Java
  - Experience developing software to deploy infrastructure (as
    opposed to operations)
  - Experience with CD tools such as ArgoCD or Flux
  - Experience developing on top of Kubernetes or other
    distributed platforms
  - Strong troubleshooting skills for distributed systems and
    software
  - Experience engineering large systems with many stakeholders
    throughout the planning, execution, and operation phases
    of a project.
  - Five or more years of progressively complex related
    experience.
  - Passionate about automating and improving processes.
  - Illustrated history of living the values necessary to
    Priceline:  Customer, Innovation, Team, Accountability and
    Trust.
  - The Right Results, the Right Way is not just a motto at
    Priceline; it’s a way of life. Unquestionable integrity
    and ethics is essential.

  There are a variety of factors that go into determining a
  salary range, including but not limited to external market
  benchmark data, geographic location, and years of experience
  sought/required. In addition to a competitive base salary,
  certain roles may be eligible for an annual bonus and/or
  equity grant.

  The salary range for this position is $150,000- $185,000K
  USD.

