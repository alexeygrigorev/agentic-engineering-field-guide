  Who We Are

  WE ARE PRICELINE.

  Our success as one of the biggest players in online travel
  is all thanks to our incredible, dedicated team of talented
  employees. Priceliners are focused on being the best travel
  deal makers in the world, motivated by our passion to help
  everyone experience the moments that matter most in their
  lives. Whether it’s a dream vacation, your cousin’s
  graduation, or your best friend’s wedding - we make travel
  affordable and accessible to our customers.

  Our culture is unique and inspiring (that’s what our
  employees tell us). We’re a grown-up, startup. We deliver
  the excitement of a new venture, without the struggles and
  chaos that can come with a business that hasn’t stabilized.

  We’re on the cutting edge of innovative technologies. We
  keep the customer at the center of all that we do. Our
  ability to meet their needs relies on the strength of a
  workforce as diverse as the customers we serve. We bring
  together employees from all walks of life and we are proud
  to provide the kind of inclusive environment that stimulates
  innovation, creativity and collaboration.

  Priceline is part of the Booking Holdings, Inc. (Nasdaq:
  BKNG) family of companies, a highly profitable global online
  travel company with a market capitalization of over $80
  billion. Our sister companies include Booking.com,
  BookingGo, Agoda, Kayak and OpenTable.

  If you want to be part of something truly special, check us
  out!

  Flexible work at Priceline

  Priceline is following a hybrid working model, which
  includes two days onsite as determined by you and your
  manager (ideally selecting among Tuesday, Wednesday, or
  Thursday). On the remaining days, you can choose to be
  remote or in the office.

  Perks & Benefits at Priceline

  Our benefits are designed to support your health, wellbeing,
  and life inside and outside of work. Eligible Priceliners
  have access to:

  Health & wellness coverage including medical, dental,
  vision, and mental health resources

  Generous time off including PTO, holidays, a company-wide
  Priceline Pause reset week, and paid volunteer days

  Work/life support including the ability to work up to 4
  weeks per year from anywhere, parental leave, dependent care
  and family support resources, Summer Fridays, and office
  perks like stocked kitchens and catered meals (varies by
  location)

  Financial security programs such as retirement plans with
  company contributions, life and disability coverage, and
  tax-advantaged accounts

  Signature travel perks including employee-only discounts on
  hotels and flights, VIP deals, and Big Deal Bucks credits

  Additional perks & discounts like travel and partner
  discounts, tuition support, legal support, and pet benefits

  A people-first culture with Employee Resource Groups (ERGs),
  social events, recognition programs, and service awards that
  help you connect, grow, and celebrate together

  Specific benefits and programs vary by location.

  Inclusion is a Big Deal!

  To be the best travel dealmakers in the world, we believe
  our team should reflect the broad range of customers and
  communities we serve. We are committed to cultivating a
  culture where all employees have the freedom to bring their
  individual perspectives, life experiences, and passion to
  work.

  Priceline is a proud equal opportunity employer. We embrace
  and celebrate the unique lenses through which our employees
  see the world. We’d love for you to join us and help shape
  what makes our team extraordinary.

  Applying for this position

