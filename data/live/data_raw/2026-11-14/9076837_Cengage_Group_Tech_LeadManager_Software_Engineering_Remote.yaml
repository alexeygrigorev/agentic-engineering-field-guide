  Cengage is also committed to providing reasonable
  accommodations for qualified individuals with disabilities
  including during our job application process. If you are an
  applicant with a disability and require reasonable
  accommodation in our job application process, please contact
  us at accommodations.ta@cengage.com.

  About Cengage

  Cengage, a global education technology company serving
  millions of learners, provides affordable, quality digital
  products and services that equip students with the skills
  and competencies needed to be job ready. For more than 100
  years, we have enabled the power and joy of learning with
  trusted, engaging content, and now, integrated digital
  platforms. We serve the higher education, workforce skills,
  secondary education, English language teaching and research
  markets worldwide. Through our scalable technology,
  including MindTap and Cengage Unlimited, we support all
  learners who seek to improve their lives and achieve their
  dreams through education.

