description: |
  Our story:

  The widespread adoption of intelligent technologies powered
  by automation, AI, ML, and knowledge graphs is accelerating.
  As these technologies become increasingly accessible, our
  aim is to make their capabilities empowering, trustworthy,
  and useful to real people in the real world.

  Adapter was founded in 2022 by Adam Ghetti and Dr. David
  Bader, with the support of some of the most esteemed Tier 1
  Silicon Valley firms and individual entrepreneurs. We are a
  small but dedicated team, currently working towards solving
  a significant problem. We recognize the importance of being
  early movers in this field, and have assembled a well-
  supported and passionate team to do so.

  What we are looking for:

  We are seeking a full-stack engineer who will play a key
  role in shaping and creating the  product, which at its core
  aims to empower individuals through thoughtful collaboration
  with intelligent technology. You will partner with a
  brilliant team of engineers and innovators and will be at
  the cutting edge of some of the most interesting consumer
  use-cases for intelligent technologies.

  We have established a culture that promotes both remote work
  and in-person collaboration, with team members currently
  dispersed around the country with hubs in Austin, NYC, and
  the Bay Area. We believe that integrating these two elements
  allows for maximum productivity and creativity as we strive
  to achieve our goal.

  Responsibilities:

  - Architect, Implement and Maintain critical components of
    user facing applications
  - Design and build internal tooling to accelerate velocity of
    existing and new initiatives
  - Improve UX through implementation of highly secure and
    optimized applicationsCollaborate with a team of
    designers, researchers and other stakeholders to implement
    responsive and visually appealing user interfaces.Stay
    updated on emerging technologies and industry trends to
    continually improve our technology stack.

  Qualifications:

  - Proven expertise in full-stack engineering with a profound
    passion for creating and maintaining complex consumer-
    facing products from 0 to 1
  - Proficiency in modern front-end technologies and frameworks
    such as React, Angular, or Vue.js and in server-side
    languages such as Python, Go and Rust
  - Experience in designing microservice architecture and API
    models
  - Experience leading team initiatives.
  - Demonstrated ability to think strategically and to align
    design goals with key objectives and priorities.

  Desired:

  - Experience with GraphQL
  - Strong experience with cloud services and platforms, such as
    AWS, Azure or Google Cloud.
  - Experience with Kubernetes
  - Experience building training and inference pipelines for
    supporting ML models

  Work Experience:

  - 5+ years of experience as a full-stack engineer
  - Startup experience is a plus

  Benefits:

  - Early stage equity
  - Comprehensive health insurance
  - Generous PTO
  - Remote and in person cultures that promote collaboration

  Full compensation packages are based on candidate experience
  and certifications.

  United States - Remote Pay Range

  $180,000—$220,000 USD
