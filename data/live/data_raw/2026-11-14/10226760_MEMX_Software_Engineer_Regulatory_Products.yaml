description: |
  MEMX is seeking a Software Engineer with a strong passion
  for data and experience in business intelligence tools to
  join our regulatory software engineering team. In this role,
  you will design, develop, and maintain data pipelines,
  integrate data from various sources, and transform it into
  meaningful insights.

  This role requires a combination of strong Java programming
  skills and experience with Business Intelligence (BI) tools,
  data processing, and data integration.

  MEMX currently has a U.S. presence in these
  states: California, Colorado, Connecticut, Delaware,
  Florida, Georgia, Illinois, Kansas, Maine, Maryland,
  Michigan, Nevada, New Jersey, New York, North Carolina,
  Pennsylvania, South Carolina, & Utah.   

  *If you live outside of the above states, please list in
  your application and our team will evaluate.  

  What You'll Do

  - Design, build, and optimize data pipelines and workflows to
    process, clean, and transform data using Java

  - Work with various data sources (SQL, NoSQL, cloud data
    storage) and build integrations to unify data for
    reporting and analytics

  - Work closely with tech lead/product management to understand
    data needs, build dashboards, and develop automated
    reporting solutions

  - Design and optimize storage solutions for structured and
    unstructured data, enhancing data retrieval and
    performance for BI purposes

  - Maintain comprehensive documentation of processes, code, and
    data flows. Follow best practices in code design and
    deployment to production

  Requirements

  - Strong proficiency in Java (Java 8+ preferred) with a focus
    on data-related frameworks and libraries

  - Experience in handling large datasets, including data
    cleaning, transformation, and aggregation techniques

  - Proficiency in working with SQL and NoSQL databases and an
    understanding of database design principles

  - Familiarity with BI tools like Tableau, Power BI, or Looker
    to create and manage reports and visualizations

  - Experience working with cloud platforms for data storage and
    processing is a plus

  - Strong analytical and problem-solving skills to derive
    insights from data and enhance data processing workflows



  Preferred Qualifications

  - Familiarity with Python or Java for data processing

  - Understanding of data modeling and data warehousing concepts

  - Experience with REST APIs and microservices architecture

  - Knowledge of version control tools like Git and CI/CD
    pipelines

  Benefits

  At MEMX you will have the ability to work with a talented
  team of professionals who bring diversity of thought and
  background. You will have the opportunity to shape the
  future of our company and the impact MEMX will have on our
  clients and the broader markets. We offer competitive
  employee benefits and perks and will continue to make this a
  priority to attract the best.   

  - Work From Home

  - Health Care Plan (Medical, Dental & Vision)

  - Retirement Plan (401k)

  - Life Insurance (Basic, Voluntary & AD&D)

  - Unlimited Paid Time Off

  - Generous Paid Family Leave

  - Short Term & Long-Term Disability

  - Training & Development

  - Wellness Resources

  Pay Range: $120,000 - $150,000 

  *Pay ranges are a general guideline only and not a guarantee
  of compensation. Compensation may vary depending on a number
  of factors, including a candidate’s qualifications, skills,
  competencies and experience, and location.

  Equal Opportunity Statement  

  MEMX is an equal opportunity employer. We are committed to
  creating a diverse and inclusive environment for all
  employees. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, gender, gender identity or expression, sexual
  orientation, national origin, genetics, disability, age, or
  veteran status.  

  Diversity Inclusion Statement  

  At MEMX, we believe that diversity and inclusion are
  essential to driving innovation and success. We welcome and
  celebrate individuals from all backgrounds and perspectives,
  and we strive to create an inclusive culture where everyone
  can thrive.
