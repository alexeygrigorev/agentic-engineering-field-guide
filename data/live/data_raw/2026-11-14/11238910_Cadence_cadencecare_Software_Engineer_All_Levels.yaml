description: |
  Cadence is the clinical AI company automating the treatment
  of chronic disease. Its Clinical Intelligence takes on the
  routine, high-volume work of chronic care – monitoring
  patients, surfacing risks, and coordinating action – so
  clinicians can focus on the decisions that require them.
  Grounded in partnerships with more than 20 leading health
  systems, deep EMR integrations, dedicated medical group, and
  experience serving a population of more than 100,000
  patients, the system learns from real-world care delivery,
  improving as it scales. Cadence has been recognized by TIME
  as one of the Top 100 HealthTech Companies and by LinkedIn
  as a Top Startup (#4, 2025).

  The Role

  We're hiring a Software Engineer to play a central role in
  delivering our clinical care at scale. This person will be
  responsible for building within the core of Cadence's remote
  patient monitoring platform. Your role will allow medical
  professionals to monitor and interact with millions of
  patients across the U.S. in an effort to improve their
  medical outcomes.

  What You'll Do

  - Design, build, and maintain services for the Cadence
    platform.
  - Improve engineering standards, tooling, and processes on a
    rapidly growing team.
  - Collaborate with product owners, internal stakeholders, and
    customers to determine the right solutions for our
    product.
  - Work with other engineers throughout our 6-week delivery
    cycle process to ship well-designed and architected
    features.
  - Contribute to the continued development and scalability of
    Cadence's remote patient monitoring platform.

  What You Need

  - 2+ years experience as a Backend or Fullstack Software
    Engineer
  - Experience writing server applications (Golang a plus)
  - Experience in a high-growth, fast-paced startup environment
  - Experience working in a cloud environment such as AWS or
    Google Cloud.
  - Experience with relational databases such as Postgres or
    MySQL.

  Compensation

  Our job titles may span more than one career level. The base
  salary for this role typically ranges between $170,000 –
  $270,000 annual base salary, depending on experience,
  skills, seniority, and business needs. In addition to base
  salary, this role is eligible for equity as part of the
  total compensation package. Actual compensation may vary by
  location.

  Benefits & Perks

  - Competitive pay & equity*
  - Fully remote
  - Comprehensive health coverage: Medical, dental & vision
  - Paid time off
  - 401k plan + matching
  - Paid parental leave
  - Home office stipend

  *benefit offerings may vary depending on job profile, job
  level and worker type  Cadence is committed to equal
  opportunity and fairness regardless of race, color,
  religion, sex, gender identity, sexual orientation, nation
  of origin, ancestry, age, physical or mental disability,
  country of citizenship, medical condition, marital or
  domestic partner status, family status, family care status,
  military or veteran status or any other basis protected by
  local, state or federal laws.

  A notice to Cadence applicants: Our Talent team only directs
  candidates to apply through our official careers page at
  https://www.cadence.care/our-team.  Cadence will never refer
  you to external websites, ask for payment or personal
  information, or conduct interviews via messaging apps. We
  receive all applications through our website and anyone
  suggesting otherwise is not with Cadence. If you require a
  reasonable accommodation during the interview or hiring
  process, please notify your recruiter.
