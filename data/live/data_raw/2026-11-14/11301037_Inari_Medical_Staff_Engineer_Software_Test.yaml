title: Staff Engineer, Software Test
company: Inari Medical
location: Berlin, DEU
work_type: FULL_TIME
company_size: 956 Employees
description: |
  Work Flexibility: Hybrid or Onsite

  Are you a highly experience Software Test Engineer? Do you
  have strong experience in both manual and automated testing?
  If so, we want to hear from you!

  What you will do:

  We need a highly motivated and skilled Staff Engineer,
  Software Test who is passionate about using modern software
  engineering and testing principles to deliver robust
  applications to our global users. The Staff Engineer,
  Software Test will plan the schedule and manage test
  activities for features or projects as well as evaluate
  standards and special software. The Staff Engineer, Software
  Test may work with outsourced design partners, review and
  mentor less experienced engineers’ deliverables and have a
  holistic understanding of tests for modules, sub-systems,
  and the fully integrated system. This position will define,
  design, implement, and maintain engineering test equipment,
  test strategies, test software and specifications for sub-
  systems and complete software systems. This is a role
  responsible for carrying out various tasks to ensure our
  test approaches are effectively and efficiently designed,
  implemented, and maintained for both legacy and new
  development.

  Responsibilities:

  - Highly proficient in test methodologies, tools, and
    techniques.
  - Collaborate with team members across product, architecture,
    development, and testing teams in designing testing
    approaches.
  - Collaborate with product management teams in an Agile/Scrum
    environment to develop a comprehensive set of tests.
  - Able to provide in-depth analysis to resolve technical
    issues, anticipate risks and ensure timely management
    escalation
  - Provide test solutions for both functional and non-
    functional software quality.
  - Lead test effort estimation, test planning and risk analysis
    activities for features or projects.
  - Manage resources, testing schedules, and quality
    expectations for features or projects.
  - Develop manual/automation test strategy or design
    documentations.
  - Create manual/automation procedure and process documentation
    to enable end-users to successful operate system software.
  - Design and develop test platforms for new and existing
    complex products from concept to implementation.
  - Provide mentoring and trainings as needed
  - Participate in the software technical design reviews to
    mentor less experienced engineers as well as reinforce
    best design practices.
  - Optimize, improve & maintain best test process and practices
  - Liaise between less experienced Engineers and Sr. Staff and
    above Engineers.
  - Ensure all quality assurance and testing activities are
    conducted throughout the software life cycle and that the
    results are documented per the Quality Management System.

  What you need:

  - B.S. of Engineering in software engineering/computer science
    or related discipline with 4 or more years of software
    testing experience
  - Strong verbal and written communication skills in English
  - Knowledge of regulatory standards applicable to medical
    device and software development life cycle: 21 CFR part
    820, ISO 13485, ISO 14971, and IEC 62304.
  - Knowledge of Python preferred.
  - Demonstrated experience in software testing, both manual and
    automated testing.
  - Demonstrated experience in the following: test strategy,
    test case development, software testing methods, software
    risk analysis across the complete system and software
    development practices.
  - Demonstrated experience in leading complex product
    development initiatives from concept through release.
  - Demonstrated experience in influencing cross-functional
    teams beyond own group (Process/Project Stakeholder)
  - Demonstrated experience in developing and leading a well-
    defined strategy
  - Demonstrated experience in identifying process gaps and
    implementing improvements in respected zones and
    correct/improve processes
  - Demonstrated experience in proposing solutions rather than
    problems (local level)

  Who we want:

  - Dedicated achievers. People who thrive in a fast-paced
    environment and will stop at nothing to ensure a project
    is complete and meets regulations and expectations.
  - User-focused creators. Engineers who design with the user in
    mind, developing software that helps change patients’
    lives.
  - Teammates. Partners who listen to ideas, share thoughts and
    work together to move the business forward.
  - Analytical problem solvers. People who go beyond just fixing
    to identify root causes, evaluate optimal solutions, and
    recommend comprehensive upgrades to prevent future issues
  - Goal-oriented developers. Keeping the customer and
    requirements squarely in focus, people who deliver safe
    and robust solutions.



  Germany Pay Ranges:

  - Berlin/Duisburg/Waghäusel/field-based 40Std: €69.400 -
    €115.700 EUR Annual



