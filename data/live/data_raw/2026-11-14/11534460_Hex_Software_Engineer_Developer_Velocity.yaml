description: |
  About Hex

  Hex is growing our team of builders on a mission to make
  everyone a data person. Our platform solves key pain points
  with today’s data and analytics tooling, and empowers anyone
  to explore data using natural language, with or without
  code, on trusted context. Thousands of customers like Ramp,
  Figma, Stubhub, Anthropic, and Gamma love Hex for our
  beautiful UI, agentic superpowers, and boundless
  flexibility.

  Hex has raised over $100M from leading investors like
  Sequoia, a16z, Snowflake and Amplify. With office hubs in
  San Francisco and New York, as well as remote team members
  throughout the US and UK, we’re a high-agency team that
  ships fast and has fun doing it. Check out our Intro to Hex
  video and employee handbook to learn more about what it’s
  like to work at Hex.

  About the role

  Hex is an AI native company and we are constantly playing
  with the latest models and tools. We are looking for a new
  team member to help us drive our developer tooling and
  systems to the cutting edge.

  This role has two equally important halves. First, the
  classic developer-productivity foundation: fast builds,
  reliable CI/CD, reproducible dev environments, building the
  systems the whole engineering organization depends on every
  day. Second, the AI layer on top of it: as coding agents get
  more capable, the hard problems move beyond writing code to
  context, environments, validation, and safe integration into
  production. You'll build the systems that let coding agents
  operate with deep awareness of Hex's codebase,
  infrastructure, and development lifecycle.

  This is role that is intended to drive impact organization-
  wide. You'll partner with teams across engineering to
  understand how they work, build the shared systems that
  raise everyone's velocity, and establish the standards and
  guardrails that keep a fast-moving org safe. Success looks
  like shipping tools, measuring it, and teams adopting what
  you build.

  What You'll Do

  - Developer-productivity foundation
    - Own the internal developer platform end to end.
      Architecture, build, rollout, operation, and
      measurement.
    - Invest in build and CI/CD. Monorepo build tooling and
      local/remote caching, CI pipelines, merge queues, fast
      and reliable test suites, and safe rollout/deploy
      mechanics for the whole org.
    - Build great dev environments. Collaborate across teams to
      find the best patterns. Fast local builds and caching,
      reproducible multi-platform cloud development
      environments.
    - Raise org-wide velocity. Establish metrics and dashboards to
      help the teams steer the ship and partner with teams
      across engineering to find and remove the biggest
      bottlenecks. Examples such as cycle time, review
      latency, and change failure rate.

  AI developer experience

  - Build the agent context layer. Repo-level context
    infrastructure (agent guidance conventions, architecture
    and domain context), and shared skills/subagents/hooks
    that make agents competent in Hex's codebase.
  - Evaluate and integrate new third-party coding tools (the
    next Claude Code, the next Cursor Cloud Agent and future
    tools) and make them work against our codebase and other
    org tools (Slack, Notion, Linear, etc).
  - Across both
    - Drive adoption through developer experience. Set up good
      defaults, clear docs, low friction and embed with teams
      to generalize their wins into shared platform
      capabilities.
    - Own the safety layer. Work with our teams to create
      permissions, secrets handling and audit trails.

  What we're looking for

  - 5+ years in developer productivity, build/release
    engineering, or internal platforms. Experience building
    the tools and systems the whole engineering org depends on
    daily. This is the core of the role.
  - Deep build-systems and CI/CD expertise. Repo build tooling
    and caching, CI pipelines, and safe deployment workflows.
  - Breadth across the stack. You can reason from backend
    application code through infrastructure-as-code (e.g.
    Scalr / Terraform), deployment, and observability (e.g.
    Datadog), and follow a change all the way from a local
    build to production.
  - Strong proficiency in TypeScript/Node.js and SQL; Python a
    plus.
  - Comfortable working in backend systems, APIs, and
    distributed or asynchronous workflows that multiple teams
    rely on.
  - Hands-on experience with LLMs and agent frameworks — tool
    calling, MCP, context management, orchestration, failure
    handling.
  - Deep personal fluency with AI coding tools and well-formed
    opinions about where they break down.
  - Platform mindset: you build for adoption and self-service,
    treat internal engineers as customers, and would rather
    ship a good default than write a style guide.
  - Solid AWS / Docker / Kubernetes fundamentals.
  - Excellent written communication. Much of your leverage are
    docs, templates, and examples that scale beyond the
    conversations you're in.
  - Comfort with ambiguity; this space invalidates its own best
    practices every few months.

  Nice to have

  - Experience with agent systems or AI-assisted development at
    scale.
  - Background in large-scale system architecture.
  - Familiarity with repository tooling and practices.
  - Hands-on with Hex's stack: GraphQL, WebSockets, Postgres,
    Redis, BullMQ/Temporal, Turborepo and Terraform/Helm on
    AWS.
  - Observability tooling or data-platform experience.

  - Experience with Python
  - Hands-on experience with GraphQL, WebSockets, BullMQ, or
    Temporal
  - Familiarity with observability tooling (metrics, tracing,
    logging)
  - Background in data platforms, developer tools, or
    collaborative systems
  - Experience with frontend technologies (e.g. React,
    TypeScript) for end-to-end context
  - Open-source contributions, especially in backend or
    infrastructure projects

  Our stack

  Our product is a web-based notebook and app authoring
  platform. Our frontend is built with Typescript and React,
  using a combination of Apollo GraphQL and Redux for managing
  application state and data. On the backend, we also use
  Typescript to power an Express/Apollo GraphQL server that
  interacts with Postgres, Redis, and Kubernetes to manage our
  database and Python kernels. Our backend is tightly
  integrated with our infrastructure and CI/CD, where we use a
  combination of Terraform, Helm, and AWS to deploy and
  maintain our stack.

  About the team

  You'll be a member of Foundations, the team that builds and
  maintains the application level infrastructure that powers
  Hex: the shared backend systems, frameworks, and primitives
  other teams depend on, spanning APIs, real-time transport,
  storage, background processing, and internal tooling.
  Foundations' job is to build durable systems that scale with
  the company and to turn recurring needs across product teams
  into reusable abstractions. This developer-experience
  charter extends that same mission inward to the tools,
  environments, and workflows engineers use to build Hex
  itself.

  The salary range for this role is: $198,750 - $265,000

  In addition to our unique culture, Hex proudly offers a
  competitive total rewards package, including but not limited
  to, market-benched salary & equity, comprehensive health
  benefits, and flexible paid time off.

  The salary range shown may be a reflection of additional
  factors such as geographical location and skill
  ranges/levels we’re open to. Placement in the salary range
  will be decided upon completion of the interview process,
  taking into account factors like leaving room for growth,
  internal fairness & parity, your demonstrated skills, and
  the depth of your experience. Our Recruiting team will be
  able to provide more details during the interview process.

  By submitting an application the candidate consents to the
  use of their personal information in accordance with the Hex
  Privacy policy: https://learn.hex.tech/docs/trust/privacy-
  policy.
