description: |
  We are looking for a Principal Software Engineer (we call
  them Principal Software Craftspeople) who shares the same
  values of pragmatism, professionalism and transparency as us
  to join our team. You'd be utilising your expertise with
  clients, helping to shape Codurance, and being involved in
  coaching and mentoring across the company.

  We support our clients in many ways, and you will have the
  opportunity to work on a wide range of different internal
  and client projects. You’ll primarily work remotely as part
  of a collaborative team, with occasional travel to client
  sites or in-person sessions when it adds value to delivery
  or relationships. This may be a greenfield project for a
  startup or helping to build a mission-critical system for a
  large enterprise client. Perhaps you’ll work as an embedded
  Consultant, working within our client's existing team to
  help them tackle complex challenges within their own
  software. Or maybe you're more interested in helping to
  introduce the values of software craftsmanship and extreme
  programming practices to an organisation through coaching &
  mentoring.

  Location: We are open to this role being hybrid, with
  occasional travel to client sites. Please note that we are
  not able to offer visa sponsorship at this time.

  Requirements

  As someone performing this role, these are some of the
  things we are looking for:

  - You are able to actively build relationships with strategic
    stakeholders within the client, acting as an advisor and
    partner in helping them identify and solve problems. You
    are good at helping people come up with a vision and
    helping them get aligned behind it
  - You bring deep hands-on experience in software engineering,
    particularly modernisation, with a track record of guiding
    teams to build well-crafted, reliable, and maintainable
    systems.
  - You’re comfortable leading complex client engagements —
    shaping delivery through discovery, navigating ambiguity,
    and ensuring that technical decisions align with business
    goals.
  - You communicate with clarity and empathy, adapting your
    style to influence senior stakeholders, collaborate with
    peers, and support those you mentor.
  - You look beyond the code, identifying opportunities to add
    value, support account growth, and contribute to the
    broader success of our clients and Codurance.
  - You’re continuously learning and evolving, and you help
    others do the same, whether by fostering inclusive team
    environments, sharing knowledge, or challenging ideas
    constructively.

  It would be an added bonus if you have:

  - Experience working in consultancy, agency, or client-facing
    delivery environments, especially where you've helped
    shape solutions or build long-term relationships.
  - Exposure to commercial conversations such as proposals,
    pricing, or contract scoping, or a desire to develop
    confidence in this area.
  - Familiarity with platform thinking, service design, or
    systems architecture across complex domains.
  - Contributed to internal initiatives, technical communities,
    or mentoring programmes — within your organisation or
    externally.
  - Awareness of private equity-backed or mid-market tech
    environments, and how technology decisions can support
    business scaling or transformation.
  - Experience building or scaling AI-enabled products, bringing
    a pragmatic perspective on when and how to leverage AI
    tooling effectively.

  Benefits

  Everyone should have the right to bring their whole self to
  work and be celebrated for who they are. Our people are
  hired purely on their commitment to these values and their
  ambition to deliver outstanding results for our clients.
  Codurance is proud to be an Equal Opportunities Employer and
  is committed to fostering an inclusive workplace.
