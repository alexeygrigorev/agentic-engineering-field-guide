description: |
  Come join our Engineering team!

  High velocity, high intensity, high trust, high bar, high
  impact, and a will to win.

  If those words resonate deeply with you, this could be your
  next career move. We're seeking someone who leads with
  humility, pursues audacious goals, and is motivated by
  meaningful impact on people and the world.

  At FutureFit AI, our core mission is to help more people get
  to better jobs faster and cheaper, with a specific focus on
  those facing barriers to opportunity. Our work helps resolve
  the growing issue of economic inequality, ensuring that no
  one is left behind in the future of work. Our AI-powered
  platform brings efficiency and insight to workforce
  development, replacing outdated systems and unlocking human
  potential at scale.

  Ready to make an impact? Apply today.

  Important note: Data shows that men typically apply when
  meeting 3/10 requirements, while women often wait until it's
  10/10. We encourage you to apply if you see a strong (not
  necessarily perfect) fit.

  The Opportunity

  We're seeking a Software Engineer to join our Engineering
  team, working across the mid to senior range. You'll build
  the product that helps people get to better jobs faster and
  cheaper, with a focus on those facing the biggest barriers
  to opportunity, and you'll own features end to end across
  our full stack.

  Your Role

  You'll join one consolidated engineering team, reporting to
  an Engineering Manager, and own features end to end rather
  than working within narrowly segmented frontend or backend
  roles. We work with high velocity and a high bar, and we
  trust engineers to make calls and move independently,
  especially through ambiguity, in unfamiliar parts of the
  codebase, when requirements are incomplete.

  We're hiring across the mid to senior range. If you're mid-
  level, you'll grow quickly with meaningful ownership from
  day one. If you're senior, you'll set technical direction,
  raise the bar on quality, and lift the engineers around you.

  What You'll Own

  - End-to-end delivery: Design, build, test, and ship full-
    stack features across the frontend and backend, owning
    your work all the way to production.
  - Product partnership: Work closely with Product, Design, and
    Data to turn customer needs into well-built, reliable
    software.
  - Code quality: Write clean, maintainable, well-tested code,
    and help hold the team to a high bar through reviews and
    shared standards.
  - Technical judgment: Make sound technical decisions in your
    work and weigh tradeoffs as you build. At the senior end,
    this scales up to system design for larger initiatives,
    architectural calls, and mentoring other engineers.

  Your 30/60/90 Day Plan

  This role is hands-on and high-impact from week one. You
  won't sit on the sidelines learning for a quarter. You'll be
  shipping early and owning more as you go. Here's roughly
  what that looks like:

  By 30 days: Get oriented and ship

  - Get your environment set up and ship your first change to
    production in the first week, a real fix or small
    improvement, not a throwaway task
  - Build relationships across Engineering, Product, Design, and
    Data, and learn how work moves from idea to production
    here
  - Get to know the codebase and our stack (React/TypeScript,
    Node.js, PostgreSQL/MongoDB, AWS), and where the rough
    edges are
  - Understand who our users are, the barriers they face, and
    the problems we're solving for them

  By 60 days: Own your work end to end

  - Take a feature from design through to production on your
    own, owning quality the whole way
  - Become a dependable code reviewer and start holding the team
    to a high bar through shared standards
  - Develop real judgment about our patterns and tradeoffs, and
    bring that into planning and technical discussions
  - Partner closely with Product and Design to turn customer
    needs into reliable, well-built software

  By 90 days: Drive impact

  - Deliver a meaningful piece of product that customers
    actually feel
  - Spot something that slows us down, like tooling, testing,
    observability, or process, and improve it without being
    asked
  - Have a clear point of view on where we can move faster or
    raise the bar on quality
  - (At the senior end) take on system design for a larger
    initiative, make sound architectural calls, and lift the
    engineers around you

  Required Experience

  - Strong full-stack experience building and shipping
    production web applications, roughly 5+ years for senior-
    level candidates; strong mid-level candidates are also
    welcome
  - Strong, hands-on experience with React and TypeScript
  - Professional backend development experience; candidates who
    are stronger on the backend than the frontend are a
    particularly good fit here
  - Experience with PostgreSQL, MongoDB, or another comparable
    database technology
  - Proven ability to take an ambiguous problem and execute with
    limited direction, owning a feature end to end from design
    through production
  - Comfortable working in unfamiliar domains and independently
    finding solutions, without constant direction
  - Located in Canada or the United States, with Eastern time
    zone strongly preferred; candidates outside Eastern time
    should be able to maintain 5 to 6 hours of daily working
    overlap with the team

  Bonus Points

  - Node.js experience
  - Backend-leaning full-stack expertise
  - Experience at an early-stage or fast-scaling startup where
    you wore several hats
  - Exposure to data-intensive products, recommendation/matching
    systems, or AI/ML-backed features
  - Interest in workforce development, economic mobility, or
    other mission-driven work

  Our Tech Stack for Engineering

  - Frontend: React, TypeScript
  - Backend: Node.js, TypeScript
  - Data storage: PostgreSQL, MongoDB
  - Infrastructure: AWS ecosystem
  - Collaboration: Slack, Jira, Figma

  Your Education

  Your alma mater isn't our focus. Your grit, hunger, and
  drive are. If you learn continuously, tackle challenges
  head-on, and know your strengths and gaps intimately, you're
  our person.

  Location

  Remote across the US and Canada. We are open to candidates
  living anywhere in either country, with at least 5 to 6
  hours of daily overlap with our EST-based team required. For
  candidates living in Toronto, our office is conveniently
  located at 325 Front St West (a short walk from Union
  Station), and you are welcome to drop by, though it is
  entirely optional and not a hybrid requirement.

  Travel Expectations

  Approximately 2-3 trips per year to Toronto for team-
  building, our August all-hands, and an end-of-year event.

  Compensation

  Pay Range: USD $150,000-$185,000 (United States) / CAD
  $130,000-$175,000 (Canada).

  As a remote-first company, we benchmark compensation to the
  national market for comparable roles at institutionally-
  funded startups, targeting the middle of the market. Bands
  are designed for the lifecycle of the role, where you enter
  the band reflects your applied experience and other criteria
  established by the hiring committee, with room to grow
  through the band as you grow in the role.

  If you want real ownership over a product that moves people
  into better jobs, let's talk.

  Hiring Journey

  At FutureFit AI, our hiring process is designed to help you
  assess whether this role and our culture are the right fit
  based on your unique skills, mindset, and experiences. We
  move fast and work with intensity, so we want you to get a
  real sense of that from the start.

  Each journey includes a mix of interviews and a performance
  challenge. For this role, that might look like:

  - Online Application
  - Initial Screen with Talent Acquisition
  - Interview with Hiring Manager
  - Coding Challenge
  - Design Challenge
  - Final 1:1 Interviews
  - Final Decision

  Generally, this entire process takes around 6 weeks,
  although the timing can vary due to specific candidate
  circumstances.

  Ready to shape the future of work?

  At FutureFit AI, we're not just building a company—we're
  transforming how talent and opportunity connect. Join our
  driven team united by a commitment to job seekers and the
  workforce ecosystems we serve.

  Company Snapshot:

  - Team: 30-50 across US and Canada (hubs in NYC and Toronto)
  - Customers: Workforce development agencies and
    intermediaries, government agencies, employers
  - Industry: SaaS/AI technology
  - Funding: Bootstrapped 0-1, then raised funding led by JP
    Morgan
  - Structure: Growth, Customer Success, Product, Engineering,
    Data, People & Culture, Finance & Operations

  Our Core Principles

  - Be Curious
  - Drive to Outcomes
  - Raise the Bar
  - Speed Matters
  - Own It
  - We Over Me

  Use of AI in Hiring

  At FutureFit, we use artificial intelligence (AI) tools to
  make our hiring process more efficient, consistent, and
  equitable—never to replace human judgment. We use AI in the
  following ways:

  - Screening support: AI may help us compare applications
    against the skills and experience required for a specific
    role. These skills are defined by the hiring team for each
    position. A human reviews each application, with the AI
    assessment as just one input.
  - Interview support: In some interviews, we may use an AI
    notetaker to summarize the discussion so interviewers can
    focus on being present in the conversation.
  - Insights, not decisions: AI provides data points to support
    our team’s evaluation but does not make or recommend final
    hiring decisions. Every hiring decision is made by people.

