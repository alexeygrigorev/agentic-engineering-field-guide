description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the Team

  CoreWeave is hiring an Engineering Manager to lead the
  object storage control plane team, part of the distributed
  storage infrastructure behind CoreWeave's AI Object Storage
  produict. This team manages the systems that make
  CoreWeave's object storage trustworthy and efficient: data
  lifecycle, billing, durability auditing, performance and
  storage capacity management, data placement, and bucket
  metadata, along with upcoming investments into storage
  availability zones. The control plane is built in Go, the
  team sits at the center of how object storage scales, and we
  are actively growing it with a focus on the US.

  Key Responsibilities:

  - Lead the engineers who own object storage's control plane
    services: lifecycle, billing, durability auditing,
    capacity management, placement, and bucket metadata
  - Learn the architecture, service boundaries, and dependencies
    deeply in your first 30 days, and build relationships with
    engineers, product partners, and partner-team leads
  - Identify delivery risks, operational gaps, and unclear
    ownership, and fix them
  - Lead planning and execution as priorities shift, including
    the upcoming investment in storage availability zones
  - Keep the bar high on reliability and operational excellence
    for systems that customers bill against
  - Hire and grow the team

  Qualifications:

  - Years of Experience: 8+ years in software engineering with
    1+ years managing engineers building control plane,
    metadata, or distributed infrastructure systems
  - Education Experience (if applicable): BS or MS in Computer
    Science or equivalent practical experience
  - Your teams have built distributed control planes or metadata
    systems in production, not only run them
  - Technically credible in Go or a comparable systems language;
    you lead through design and code review
  - Experience with correctness-critical systems such as
    billing, auditing, or placement, where being wrong costs
    customers money or data
  - You have hired engineers and grown a team through change

  Preferred Skills:

  - Years of Experience (preferred): 5+ years building storage,
    metadata, or distributed control plane systems as an
    engineer before moving into management
  - Object storage, databases, or large-scale metadata systems
  - Capacity management or placement systems at cloud scale
  - Experience standing up a new team inside a growing
    organization

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast!  We’re
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We’re not afraid of a little chaos, and
  we’re constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $182,000 to $242,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

