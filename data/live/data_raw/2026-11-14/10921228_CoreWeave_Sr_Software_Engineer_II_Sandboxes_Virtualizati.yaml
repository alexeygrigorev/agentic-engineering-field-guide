description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You'll Do:

  The Runtime & GPU Systems team builds and operates secure,
  high-performance environments for multi-tenant Kubernetes
  platforms at scale. Our team sits at the intersection of
  container runtimes, lightweight virtualization, GPU
  infrastructure, and Linux systems engineering. We partner
  closely with security, platform, and GPU infrastructure
  teams to deliver robust, isolated, and efficient execution
  environments for AI-driven workloads.

  About the role:

  As a GPU & Runtime Systems Engineer, you will design, build,
  and evolve secure sandboxed runtime environments for
  Kubernetes workloads, focusing on runtime isolation,
  performance, and security. You will integrate container
  runtimes, lightweight VMs, and virtualization technologies
  to support GPU-accelerated workloads in multi-tenant
  environments. Day-to-day, you'll develop GPU-aware
  sandboxing and scheduling strategies, optimize
  containerization and I/O performance for latency-sensitive
  workloads, and influence architectural decisions across
  Linux internals, container runtimes, virtualization layers,
  and GPU drivers.

  Some of what you'll work on:

  - Design and implement secure execution environments for
    containerized and virtualized workloads.
  - Build GPU-aware scheduling, isolation, and resource
    management strategies for multi-tenant workloads.
  - Optimize container, VM, and I/O performance across GPU-
    accelerated workloads.
  - Conduct profiling, benchmarking, and performance tuning for
    runtime, virtualization, and GPU stacks.
  - Contribute to architectural decisions across Linux
    internals, container runtimes, virtualization layers, and
    GPU drivers.
  - Collaborate with security, platform, and infrastructure
    teams to define and implement runtime isolation and
    performance standards.

  Who You Are:

  - 3+ years of experience in systems, platform, infrastructure,
    or production engineering at scale.
  - Strong hands-on experience with Kubernetes, container
    orchestration, and cloud-native architectures, including
    controllers, operators, or scheduling extensions.
  - Experience designing, implementing, or operating secure
    execution environments (container runtimes, sandboxed
    workloads, or virtualized systems).
  - Practical experience with lightweight virtualization and
    sandboxing technologies (e.g., Kata Containers, gVisor,
    KubeVirt, QEMU).
  - Experience supporting GPU-accelerated workloads in multi-
    tenant environments, including GPU scheduling, isolation,
    device passthrough, mediated devices, or virtualization.
  - Proficient in systems-oriented programming (Go) with strong
    Linux internals knowledge.
  - Skilled at diagnosing and resolving complex performance,
    reliability, or isolation issues across containers, VMs,
    and infrastructure.
  - Experienced in profiling, benchmarking, and tuning
    performance across runtime, virtualization, and GPU
    stacks.

  Preferred:

  - Experience building systems for safely executing untrusted
    or sensitive workloads in shared environments.
  - Familiarity with GPU drivers and low-level virtualization or
    I/O optimization techniques.
  - Experience defining threat models and implementing runtime
    security policies in multi-tenant systems.

