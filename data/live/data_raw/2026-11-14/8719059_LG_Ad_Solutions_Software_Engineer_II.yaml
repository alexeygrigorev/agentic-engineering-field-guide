description: |
  We require people to be on-site, 4 days/week at our Denver
  or NYC office and are unable to offer relocation support.

  LG Ad Solutions is a global leader in connected TV (CTV) and
  cross-screen advertising. We pride ourselves on delivering
  state-of-the-art advertising solutions that integrate
  seamlessly with today's ever-evolving digital media
  landscape.

  The Opportunity:

  We are looking for a highly driven Software Engineer to join
  our Data & Platform Engineering team at LG Ad Solutions. In
  this role, your primary focus will be designing, building,
  and scaling robust, terabyte-scale data pipelines that power
  our core advertising (DSP/SSP) and Automatic Content
  Recognition (ACR) systems. Beyond just moving data, you will
  be instrumental in developing essential Data Platform-
  related tooling, establishing rigorous Data Governance
  frameworks, and ensuring strict Data Compliance across our
  massive data ecosystem. This role is designed for an
  engineer who thrives on ownership, possesses strong computer
  science fundamentals, and is ready to tackle the complex
  distributed systems challenges inherent in managing high-
  velocity, high-volume data that directly impacts company
  revenue.

  Responsibilities:

  - System Ownership: Build and maintain a comprehensive
    understanding across multiple complex data pipelines and
    platform projects owned by the team.
  - Core Data Engineering: Design, develop, test, and deploy
    robust backend services and data pipelines processing
    terabytes of advertising and ACR data.
  - Platform & Governance: Build and maintain internal platform
    tooling to enforce strict Data Governance, Data Quality,
    and Data Compliance standards across all data assets.
  - Task Definition & Scoping: Autonomously define the scope,
    technical enhancements, and deliverables for features of
    limited complexity, and provide accurate time estimates.
  - Feature Set Contribution: Effectively contribute to the
    planning and development of features affecting multiple
    components across our data ecosystem with minimal
    guidance.
  - Advanced Debugging: Independently troubleshoot, debug, and
    resolve somewhat complex bugs within distributed
    environments and massive-scale data processing workflows.
  - Technical Communication: Comprehend and clearly communicate
    complex technical concepts—including technical designs,
    system architecture, and key engineering decisions—to both
    technical and non-technical stakeholders.
  - Global Collaboration: Work closely with product managers,
    data scientists, and engineering counterparts in the US
    and India (requiring overlap with US time zones, typically
    aligning with core hours of 8 AM - 11 AM MST).

  Requirements:

  - Bachelor's Degree in Computer Science, Engineering, or a
    related technical field.
  - 1 to 2 years of relevant professional software development
    experience, with a strong preference for Backend or Data
    Engineering roles.
  - Strong proficiency in Data Structures and Algorithms.
  - Solid understanding of core Computer Science concepts,
    specifically Operating Systems, Computer Networks, and
    DBMS.
  - Exceptional problem-solving and analytical skills, with a
    proactive, self-starter attitude.
  - Clear and effective communication of technical challenges,
    both verbally and in writing.
  - Demonstrated ability to collaborate effectively across time
    zones.

  Preferred:

  - Experience with Big Data processing frameworks, specifically
    Apache Spark (PySpark or Scala-Spark).
  - Hands-on experience with modern data platforms like
    Databricks and orchestration tools like Apache Airflow.
  - Experience building, maintaining, and scaling complex ETL
    processes.
  - Familiarity with cloud computing platforms (AWS, GCP, or
    Azure) and related infrastructure.
  - Understanding of distributed systems concepts and
    proficiency in Low-Level Design (LLD).

  LG Ad Solutions provides equal work opportunities to all
  team members and applicants, and it prohibits discrimination
  and harassment of any type on the basis of race, color,
  ethnicity, caste, religion, age, sex (including pregnancy),
  national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by our
  policies or federal, state, or local laws.

  We want to ensure that our hiring process is accessible. If
  you need reasonable accommodation for any part of the
  application process because of a medical condition or
  disability, please send an email to careers@lgads.tv to let
  us know the nature of your request.

  Application Deadline: December 31, 2026

  Compensation & Benefits

  - Tier 1* (San Francisco Bay Area, New York City Tri-State
    Area, Los Angeles Metro Area, and Seattle Metro
    Area)$128,000 - $176,000/year
  - Tier 2* (all other U.S. Locations outside of Tier 1)$112,000
    – $154,000/yr
  - Offers Bonus
  - Benefits & Perks: 100% employer-paid medical, dental, and
    vision coverage for employees and eligible dependents.
    Company-paid life and AD&D, STD and LTD insurance, plus
    optional supplemental coverage. 401(k) with company match.
    Flexible Time Off (FTO). Paid parental leave.

  *Certain markets, including the San Francisco Bay Area, New
  York City Tri-State Area, Los Angeles Metro Area, and
  Seattle Metro Area, are aligned to Tier 1 compensation
  bands. All other U.S. locations are aligned to Tier 2
  compensation bands. The compensation offered will take into
  account internal equity and may vary depending on the
  candidate's geographic region, job-related knowledge,
  skills, and experience.
