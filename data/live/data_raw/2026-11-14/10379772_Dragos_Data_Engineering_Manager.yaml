description: |
  At Dragos, the mission is personal. The systems we protect
  deliver the water you drink, power your home, and keep the
  hospitals your community depends on running. Those critical
  infrastructure systems that power our civilization around
  the world are under attack every day by adversaries. When
  those systems fail, people are immediately at risk. We are
  the global leader in xOT cybersecurity, combining
  technology, threat intelligence, and expert services. The
  people here chose this work because they understand what is
  at stake. Here, you will find a remote-first mission-driven
  team across North America, Europe, the Middle East, and APAC
  built on authenticity, transparency, and trust. If
  safeguarding the systems that protect your family, friends,
  and community is the kind of work that matters to you, you
  are in the right place.

  About the Role:

  We are looking for a Data Engineering Manager to lead the
  engineering teams responsible for the detection engines,
  alerting, and case-management backbone that turns raw OT/ICS
  telemetry into something a SOC analyst can act on, along
  with the pipeline that ingests, baselines, and serves
  network-communications data. You'll take on a data platform
  that's actively consolidating and modernizing its datastore
  footprint, with real room to help shape what that
  architecture looks like going forward. The ideal candidate
  has deep technical knowledge of data-intensive systems,
  hands-on experience leading a team through a legacy-
  datastore migration, and a track record of championing AI-
  assisted engineering adoption.

  Responsibilities:

  - Lead and mentor a team of data engineers, driving their
    technical growth and professional development.
  - Drive hiring and team growth to scale with roadmap demands.
  - Own the technical strategy for the data platform: database
    version upgrades, migrating off legacy datastores, and
    shaping what powers heavy analytics going forward.
  - Collaborate with product and engineering to define data
    models, schemas, and analytics architecture.
  - Plan migration and reindex timing with product for customer-
    operated, on-prem deployments.
  - Drive performance optimization across the data platform
    these teams own.
  - Champion the adoption of AI-assisted development tools and
    workflows.
  - Own production support for fielded deployments, including
    incident response.

  Qualifications:

  - 7+ years of engineering management experience.
  - Management experience with Agile and working in cross-
    functional Product Teams.
  - Strong technical background in data-intensive systems,
    including production experience with PostgreSQL at scale.
  - Prior experience as an engineer with some combination of
    Elasticsearch, Airflow, Docker, Kubernetes, Python, and
    Rust.
  - Direct experience leading a team through migrating off a
    legacy datastore (MongoDB, MariaDB, or similar) into a
    modern architecture.
  - Experience shipping software onto customer-managed or on-
    prem infrastructure.
  - Hands-on daily use of AI-assisted development tools.
  - Comfortable reading code and debugging production issues
    directly.
  - Cybersecurity, SOC, or OT/ICS domain exposure is a plus.

  Compensation:

  - Salary: $220,000
  - Competitive Equity Package
  - Comprehensive Benefits Plan





