description: |
  Who we are:

  Sardine is the leading agentic risk platform for fighting
  financial crime. Our integrated solution unifies data across
  risk teams to help organizations stop fraud in real time,
  prevent AI-driven attacks, and automate fraud and AML
  operations. Sardine’s platform is strengthened by one of the
  fastest-growing fraud consortiums in the market, spanning
  more than 6 billion profiled devices, 800 million consumers,
  and 3 million businesses worldwide. Leading companies
  including FIS, GoDaddy, Intuit, Edward Jones, ZoomInfo, and
  Checkout.com rely on Sardine to secure and grow trust in
  their products.

  Our culture:

  - We hire talented, self-motivated individuals with extreme
    ownership and high growth orientation.
  - We value performance and not hours worked. We believe you
    shouldn't have to miss your family dinner, your kid's
    school play, friends get-together, or doctor's
    appointments for the sake of adhering to an arbitrary work
    schedule.
  - We're a remote-first team spread across time zones, so no
    office to report to - work from wherever helps you do your
    best work. Just a couple of things to keep in mind: pay is
    based on where you're located, and you'll need to keep a
    home base in the country you're hired in. So while we love
    the "coffee shop today, mountains tomorrow" life, this
    isn't a passport-optional, work-from-anywhere-on-Earth
    kind of remote - think flexible within your country, not
    borderless.

  Location:

  - Remote - United States

  About the Role

  As we grow into banks and expand globally, quality is
  becoming increasingly important. We're looking for a Senior
  Manager, Quality Engineering to own quality across our
  platform and our customer-facing delivery.

  You will lead a globally distributed QA team across web,
  mobile, and manual testing, and set the standards, strategy,
  and governance that make our quality credible to banks:
  documented test plans, coverage metrics, release gates, and
  audit-ready evidence. You'll partner closely with
  Engineering, Professional Services, and our customers to
  make sure every product change and every bank integration is
  correct, well-documented, and formally accepted.

  What you'll be doing

  - Own end-to-end QA strategy across the platform and customer-
    facing delivery, spanning a globally distributed team of
    QA engineers.
  - Establish and maintain quality governance appropriate for
    regulated financial institutions: test strategy standards,
    coverage metrics, release criteria, and audit-ready
    evidence.
  - Own incident response for quality-related issues: triage,
    root cause, future prevention, and clear post-incident
    communication.
  - Partner with engineers to strengthen test automation,
    CI/release gating, and regression coverage for a real-
    time, high-throughput platform.
  - Partner with Professional Services and Post-Sales team to
    support UAT, structured acceptance testing, and
    integration validation for bank and enterprise
    deployments.
  - Play a pivotal role in shaping our engineering culture,
    ensuring high quality standards are upheld across the
    organization.

  What you'll need

  - 8+ years in software quality, with 2+ years managing QA or
    Quality Engineering teams.
  - Experience owning quality for a regulated domain like
    banking, payments, or fintech. Familiar with audit, UAT,
    and documented test governance.
  - A strong quality engineering mindset: test automation, CI/CD
    gating, and coverage measurement, balanced with structured
    manual and exploratory testing.
  - Hands on experience building test automation using Cypress
    or similar tools
  - A track record of building high-performing, distributed
    teams across multiple time zones and cultures.
  - A metrics-driven approach: comfortable defining and
    reporting on quality KPIs

  Benefits we offer:

  - Generous compensation in cash and equity
  - Early exercise for all options, including pre-vested
  - Work from anywhere: Remote-first Culture
  - Flexible paid time off and Year-end break
  - Health insurance, dental, and vision coverage for employees
    and dependents - US and Canada specific
  - 4% matching in 401k / RRSP - US and Canada specific
  - MacBook Pro delivered to your door
  - One-time stipend to set up a home office — desk, chair,
    screen, etc.
  - Monthly meal stipend
  - Monthly social meet-up stipend
  - Annual health and wellness stipend
  - Annual Learning stipend

  Join a fast-growing company with world-class professionals
  from around the world. If you are seeking a meaningful
  career, you found the right place, and we would love to hear
  from you.

  To learn more about how we process your personal information
  and your rights in regards to your personal information as
  an applicant and Sardine employee, please visit our
  Applicant and Worker Privacy Notice.
