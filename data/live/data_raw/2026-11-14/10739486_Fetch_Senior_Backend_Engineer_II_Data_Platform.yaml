description: |
  What we’re building and why we’re building it.

  Fetch helps people live rewarded every day, with a vision to
  become the rewards destination for everyone. We turn
  everyday activities into meaningful rewards, whether it’s
  grocery shopping, grabbing a quick meal, or playing a
  favorite mobile game. To date, we’ve awarded more than $1
  billion in Fetch Points to our users.

  Each day, more than 13 million receipts are submitted on
  Fetch, providing visibility into over $212 billion in gross
  merchandise value. This creates the largest retail-agnostic,
  SKU-level view of household spending, powering Fetch as an
  outcomes-based advertising platform that helps brands
  acquire and retain lifelong consumers.

  The Fetch app is available on the App Store and Google Play,
  with more than 6 million five-star reviews from a highly
  engaged and loyal user base.

  It’s not just our users who believe in Fetch: with
  investments from Softbank, ICONIQ, DST, Greycroft, and
  partnerships ranging from challenger brands to Fortune 500
  companies, Fetch is reshaping how brands and consumers
  connect in the marketplace. When you work at Fetch, you play
  a vital role in a platform that drives brand loyalty and
  creates lifelong consumers with the power of Fetch points.
  User and partner success are at the heart of everything we
  do, and we extend that same commitment to our employees.

  At Fetch, we value curiosity, adaptability, and the
  confidence to explore new tools, especially AI, to drive
  smarter, faster work. You don’t need to be an expert, but
  you should be ready to learn quickly and think critically.
  We welcome learners who move fast, challenge the status quo,
  and shape what’s next, with us.  Ranked as one of America’s
  Best Startup Employers by Forbes for two years in a row,
  Fetch fosters a people-first culture rooted in trust,
  accountability, and innovation. We encourage our employees
  to challenge ideas, think bigger, and always bring the fun
  to Fetch.

  Meet Fetch Platform Engineering

  Platform engineering at Fetch is grounded in service to
  developers, strong ownership, and purposeful innovation.
  Rather than building end-user features, platform engineers
  focus on the foundations that other teams rely on, spanning
  core systems, architecture, automation, and developer
  workflows.

  This work lives in complex problem spaces where the right
  answer is rarely obvious. Our engineers navigate ambiguity
  with data and sound judgment, understand tradeoffs, and
  partner closely across product and engineering to solve
  problems that scale. We maintain a high technical bar and
  value practicality, curiosity, and continuous improvement.

  This is an environment for builders who enjoy shaping
  durable platforms, improving developer experience at scale,
  and enabling teams across Fetch to ship with confidence.

  About the Role:

  Fetch is entering its AI-first era, and we're looking for a
  Senior Backend Engineer II to join our Data Platform team.
  You'll help architect and evolve the systems that power how
  Fetch's data products are built, delivered, and made
  accessible - spanning areas like data pipelines, governed
  data access, delivery infrastructure, and partner-facing
  integrations. You'll operate at the problem level:
  identifying ambiguous, high-impact issues in your problem
  space and driving the technical solutions that resolve them.
  You'll be expected to bring strong technical ownership,
  proactively raise the bar on quality and reliability, and
  lead through influence across engineering and cross-
  functional stakeholders.

  This is a full-time role that can be held from one of our US
  offices or remotely in the United States.

  Role Responsibilities:

  - Own Technical Problems, Not Just Tasks: Proactively identify
    and solve ambiguous, complex problems within your team's
    problem space. Define the projects needed to address
    systemic issues rather than waiting to be assigned them.
  - Drive Reliability & Quality: Set and raise the technical
    quality bar for your team. Initiate refactoring or system
    health work without being told to. Solve problems few
    others can, improving reliability and efficiency through
    code review, thoughtful rollout practices, and proactive
    stability improvements.
  - Lead Multi-System Initiatives: Operate at the problem level
    - defining and driving solutions for high-ambiguity issues
    that span multiple projects or systems. Lead major
    initiatives or migrations that require coordination across
    teams or functions, ensuring complex or phased rollouts
    execute smoothly.
  - Improve Team Efficiency: Identify new tools, processes, or
    platform capabilities that meaningfully improve your
    team's velocity and reduce operational overhead.
  - Shape Technical Direction: Help define the direction and
    goals for your team, balancing project impact, product
    quality, and engineering efficiency. Guide decision-making
    through well-reasoned trade-offs, and communicate
    technical strategy clearly to both technical and non-
    technical stakeholders.
  - Build Trust Across Teams: Collaborate closely with Product,
    TPM, and partner engineering teams. Help clarify trade-
    offs and decision ownership when views diverge, and work
    toward resolution before disagreements become blockers.
  - Mentor & Grow Others: Coach peers and junior engineers,
    invest in their growth, and provide upward feedback to
    managers constructively. Model accountability,
    transparency, and strong engineering judgment, especially
    under pressure.

  Minimum Requirements:

  - 8+ years of professional software engineering experience,
    with a track record of increasing technical scope and
    ownership.
  - Strong platform or backend engineering background, with
    experience building reliable, scalable systems; experience
    with data pipelines, integrations, or delivery
    infrastructure is a plus.
  - Demonstrated ability to independently identify and scope
    ambiguous technical problems, then define and execute the
    work to solve them.
  - Experience owning systems or components used by multiple
    teams or consumers, with attention to reliability and
    predictable operation.
  - Track record of improving code quality, system health, or
    engineering practices within a team, often self-initiated.
  - Experience contributing to or leading cross-team technical
    initiatives, including migrations or phased rollouts.
  - Solid understanding of data infrastructure fundamentals —
    pipelines, governed data access, and delivery at scale.
  - Strong code review instincts and judgment on rollout safety,
    monitoring, and operational risk.
  - Mentorship experience with peer or junior engineers.
  - Fluency in modern software ecosystems such as Kubernetes,
    event streaming, CI/CD, observability tooling, and AI-
    assisted development workflows.
  - Ability to communicate technical trade-offs clearly, and to
    build alignment with stakeholders without relying on
    formal authority.
  - Comfortable operating in ambiguous, evolving environments
    with a focus on measurable outcomes.

  Preferred Requirements:

  - Experience with data delivery, connectors, clean rooms, DSP
    integrations, or similar partner-facing data
    infrastructure.
  - Familiarity with data governance and compliance-aware system
    design.
  - Experience modernizing legacy systems or migrating to newer
    architectures.
  - Exposure to AdTech, MarTech, or data-monetization
    ecosystems.
  - Track record of improving reliability, latency, or developer
    velocity on a data- or integration-heavy platform.
  - Experience giving upward feedback or informally mentoring
    across levels, even without formal management experience.

  Compensation: At Fetch, we offer competitive compensation
  packages including base, equity, and benefits to the
  exceptional folks we hire. The base salary range for this
  position is [$190,409 - $224,011]. Discover our benefits and
  how our employees live rewarded at
  https://fetch.com/careers.

  At Fetch, we'll give you the tools to feel healthy, happy
  and secure through:

  - Equity: We offer full-time employees equity in Fetch, so
    that everyone can benefit from Fetch’s growth.
  - 401(k): Fetch will match your contributions dollar for
    dollar, up to 4% of your eligible pay.
  - Benefits for humans and pets: We offer comprehensive
    medical, dental, and vision plans for everyone, including
    your pets.
  - Continuing Education: Fetch provides ten thousand per year
    in education reimbursement.
  - Employee Resource Groups: Take part in employee-led groups
    that are centered around fostering a diverse and inclusive
    workplace through events, dialogue, and advocacy. The ERGs
    participate in our Inclusion Council with members of
    executive leadership.
  - Paid Time Off: On top of our flexible PTO, Fetch observes 9
    paid holidays, as well as our year-end week-long break.
    (Holidays will vary for Canada-based roles)
  - Robust Leave Policies: 14 weeks of fully paid parental leave
    for all employees, plus 6 additional weeks of paid
    childbirth recovery leave for birthing parents, and a
    flexible return-to-work schedule.
  - Calvin Care Cash: Employees who are welcoming new family
    members will also receive a one-time $2,000 incentive to
    assist employees with covering the cost of childcare,
    clothing, diapers, and much more!
  - Flexible Work Environment: Collaborate with your team in one
    of our stunning offices, or you can work fully remotely
    from anywhere in the US for US-based roles. We’ll ensure
    you are equally equipped with the hardware and software
    you need to get your job done in the comfort of your home.
    (applicable for most roles)

