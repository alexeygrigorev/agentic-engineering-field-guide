  age, national origin, marital status, veteran status,
  disability, or any other characteristic protected by
  applicable law. Our commitment to inclusivity ensures that
  everyone is treated with dignity and has the opportunity to
  succeed based on their talent, skills, and potential.

  Fetch also provides reasonable accommodations to qualified
  individuals with disabilities or those with sincerely held
  religious beliefs, as required by law. If you need
  assistance with the application process or require an
  accommodation, please contact us at
  accommodations@fetch.com.
