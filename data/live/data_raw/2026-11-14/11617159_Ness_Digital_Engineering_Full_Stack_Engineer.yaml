description: |
  Job ID 9449

  Location: Dublin (Work from Office)

  Life at Ness

  At Ness, people come first. Here, you'll be part of a
  vibrant team that values curiosity, innovation, and growth.
  We work with industry-leading clients on projects that truly
  make an impact while supporting every team member in carving
  out their unique career path. With resources for learning,
  certifications, and hands-on experiences, Ness offers you
  more than just a job—it’s a place where your ideas,
  ambition, and well-being matter.

  The role

  We are looking for a Senior Full Stack Developer with strong
  Python and React expertise to build scalable, high-quality
  applications. The ideal candidate will have hands-on
  experience with AWS cloud services and AI-powered agentic
  coding tools to accelerate development and improve
  engineering productivity.

  Key Responsibilities

  - Design, develop, and maintain scalable full-stack
    applications using Python and React.
  - Build and integrate RESTful APIs, backend services, and
    third-party systems.
  - Develop, deploy, and manage cloud-based applications using
    AWS services.
  - Leverage AI-assisted coding tools such as Claude Code and
    Cursor to improve development efficiency and code quality.
  - Ensure application performance, security, scalability, and
    maintainability through best practices and automated
    testing.
  - Collaborate with cross-functional teams to translate
    business requirements into technical solutions.
  - Participate in code reviews, architecture decisions, CI/CD
    processes, and continuous improvement initiatives.
  - Troubleshoot technical issues and optimize application
    performance in production environments.

  Qualifications and Skills

  - Location: Dublin - work-from-the-office role;
  - Experience: 6–10 years in full-stack software development;
  - Backend: Strong hands-on experience with Python;
  - Frontend: Proficiency in React and modern frontend
    development;
  - Cloud: Practical experience with AWS services and cloud-
    based application development;
  - AI-Assisted Development: Experience using agentic coding
    tools such as Claude Code, Cursor, or equivalent.

  Other good-to-have Skills

  - Experience in the financial services industry.
  - Exposure to scalable, cloud-native application
    architectures.
  - Experience integrating AI-powered tools and workflows into
    software development practices.

  Why Join Us

  At Ness, you will work with diverse, talented professionals
  who are dedicated to making an impact through technology. We
  encourage applicants of all backgrounds to apply—even if you
  don’t meet every requirement, we’d love to connect with you
  if this role excites you. We’re committed to creating an
  inclusive workplace that celebrates each team member’s
  unique talents.

  With flexible remote options, diverse projects, and access
  to development resources, joining Ness means building a
  career that’s meaningful and impactful.

  What to Expect Next

  We believe great experiences start with transparency—and
  that includes our hiring process. Here’s what you can
  typically expect after you hit "Apply":

  1.      HR Interview – A conversation to get to know you
  better and align on expectations.

  2.      Technical Interview – A chance to showcase your
  skills and experience.

  3.      Client Interview – Ensuring mutual fit between you
  and the client team.

  4.      Offer Stage – If everything aligns, we’ll be happy
  to make it official.

  While many of our roles involve just 2–3 steps, some client
  processes may include additional conversations. Regardless
  of the path, we aim to keep every step transparent and
  respectful of your time.

  Ready to Start Your Journey?
