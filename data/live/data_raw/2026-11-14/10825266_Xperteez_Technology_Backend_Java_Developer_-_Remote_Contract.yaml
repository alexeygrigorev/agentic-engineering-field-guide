  - Expert proficiency in Java programming language.
  - Hands-on experience with Spring Boot framework for backend
    development.
  - Strong knowledge of microservices architecture and design
    principles.
  - Demonstrated ability to write clean, maintainable, and
    efficient code.
  - Exceptional written and verbal communication skills, with a
    keen attention to detail.
  - Experience collaborating with remote teams in a fast-paced
    environment.
  - Solid understanding of REST APIs, data structures, and
    backend best practices.

  Preferred Qualifications

  - Exposure to cloud platforms such as AWS, Azure, or Google
    Cloud.
  - Prior experience working on AI-driven or data-intensive
    projects.
  - Background in high-availability or distributed systems.
