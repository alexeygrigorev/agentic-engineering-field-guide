  - Design, develop, and maintain scalable backend systems using
    Java and Spring Boot.
  - Architect robust microservices solutions to support complex
    application requirements.
  - Collaborate with the customer's team to review technical
    specifications and deliver high-quality code.
  - Contribute expert insights to improve application
    performance, reliability, and security.
  - Participate in code reviews and provide constructive
    feedback to peers.
  - Document technical processes and solutions with clear,
    concise written communication.
  - Troubleshoot, debug, and optimize backend systems as needed.

