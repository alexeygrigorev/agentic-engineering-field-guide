description: |
  Senior Software Developer in Test

  Monday – Friday 8:00 am – 5:00 pm

  Remote

  We are seeking a Senior Software Developer in Test to design
  and build scalable automation solutions that support and
  elevate our Quality Engineering organization. This is a
  development-first role focused on creating tools,
  frameworks, and intelligent test systems that enable QA
  teams to deliver high-quality software with speed and
  confidence.

  In this role, you will partner closely with QA engineers,
  developers, and product teams to engineer robust automation
  frameworks, improve testing infrastructure, and leverage
  modern AI-driven techniques to enhance software quality.

  This position is ideal for someone who brings strong
  software engineering expertise, a passion for automation,
  and a drive to modernize testing through code and
  innovation.

  Some of the things you will be doing:

  - Design, develop, and maintain scalable test automation
    frameworks using Playwright.
  - Write high-quality, maintainable code in C# and
    JavaScript/TypeScript to support automated testing and QA
    tooling.
  - Build and enhance internal tools and utilities that improve
    QA team efficiency and test coverage.
  - Develop and maintain end-to-end, integration, and
    performance test solutions.
  - Integrate automation frameworks and tools into CI/CD
    pipelines to support continuous testing and quality gates.
  - Partner with QA engineers to enable adoption of automation
    tools and best practices.
  - Leverage AI tools and techniques to improve test generation,
    defect detection, root cause analysis, and test
    optimization.
  - Analyze system behavior, troubleshoot issues, and implement
    solutions to improve reliability and performance.
  - Contribute to test strategy by introducing scalable, code-
    driven approaches to quality engineering.
  - Mentor QA engineers and developers on automation, tooling,
    and modern testing practices.
  - Drive improvements in engineering quality, automation
    standards, and development practices.

  What technical skills, experience and qualifications do you
  need

  - 5+ years of experience in software development, SDET, or
    automation engineering roles.
  - Strong programming skills in C# and JavaScript/TypeScript.
  - Hands-on experience with Playwright for modern test
    automation.
  - Proven experience building automation frameworks, tools, or
    developer-centric testing solutions.
  - Solid understanding of software development principles,
    design patterns, and testability.
  - Experience integrating automated testing into CI/CD
    pipelines.
  - Experience applying AI/ML or AI-assisted development tools
    to improve testing or engineering workflows.
  - Strong debugging, analytical, and problem-solving skills.
  - Experience working in Agile or Scrum environments.
  - Strong communication skills and ability to collaborate
    across engineering and QA teams.
  - Working knowledge of SQL and ability to query and validate
    data.

  Preferred Qualifications:

  - Experience with .NET / ASP.NET and modern backend
    development practices.
  - Experience supporting or enabling QA teams through tooling
    and automation platforms.
  - Familiarity with cloud platforms such as Azure.
  - Experience with performance and load testing frameworks.
  - Exposure to front-end frameworks such as Angular.
  - Bachelor’s degree in Computer Science or a related technical
    field.

