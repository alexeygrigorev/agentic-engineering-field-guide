description: |
  About Northbeam

  Northbeam is building the world's most advanced marketing
  intelligence platform, providing top eCommerce brands a
  unified view of their business data through powerful
  attribution modeling and customizable dashboards. Our
  technology helps customers accurately track ad spend,
  understand the full customer journey, and drive profitable
  growth. Machine learning has been at the heart of Northbeam
  since day one: our full suite of measurement, spanning
  multi-touch attribution, MMM+, and incrementality, is built
  on it, along with laser-accurate first-party data. Now we're
  taking that foundation further, using AI to help brands
  operationalize their data and turn Northbeam insights into
  automated decisions.

  We're experiencing rapid growth, have strong product-market
  fit, and are looking for the right people to help us scale.
  This is a rare chance to make a meaningful impact at a fast-
  moving, high-growth company. At Northbeam, you'll join a
  team of driven, collaborative, and talented individuals who
  value personal growth and excellence. We'd love for you to
  be part of our journey.

  We're a remote-friendly company with physical offices in San
  Francisco and Los Angeles.

  About the Role

  We're looking for a mid-level software engineer who leans
  backend and enjoys building features end to end. You'll
  spend roughly 70% of your time on backend work and 20–30% on
  frontend, which gives you the ability to carry a feature
  across the stack rather than handing it off.

  You'll help build out new products and capabilities as they
  grow — implementing backend services alongside the frontend
  components needed to deliver complete product experiences.
  That work could include contributing to our new
  incrementality offering as it expands into a scalable
  experimentation platform, helping build near real-time data
  infrastructure, or bringing AI into our marketing users'
  workflows. You'll work day to day with a cross-functional
  team of data scientists, product managers, and designers,
  and with senior engineers who will help you grow into larger
  architectural decisions.

  Your Impact

  - Contribute to our new incrementality product as it grows
    into a reliable, repeatable experimentation platform.
  - Help build near-real-time ingestion and processing
    capabilities as we move beyond batch workflows.
  - Build AI-powered workflows that help marketers evaluate
    performance and act on insights.
  - Improve connection-state systems and help extend the partner
    ecosystem across data ingestion and exports.
  - Work on other product areas such as role-based access
    control (RBAC).
  - Contribute to frontend work when needed to deliver complete
    experiences.

  What You Bring

  - 3+ years of experience building backend services, APIs,
    and/or data processing systems in Python.
  - Exposure to distributed systems or microservices, and
    curiosity about how larger architectures fit together.
  - Experience working alongside product managers, designers,
    and data scientists, and owning your implementation
    through to production.
  - Comfort in a fast-moving or early-stage environment where
    priorities shift and engineers pick up whatever the
    product needs.
  - Experience taking defined product requirements and turning
    them into working, production-ready code.
  - The ability to work through unfamiliar datasets and
    interconnected tables to investigate issues and trace
    dependencies, with support when the path isn't obvious.
  - Working frontend experience with technologies such as React
    and TypeScript; deep frontend specialization is not
    required.
  - Strong coding fundamentals and real problem-solving
    instincts, with AI used as an accelerator rather than a
    substitute for core capabilities.
  - A generalist mindset and willingness to work across backend,
    frontend, pipelines, and infrastructure when the product
    requires it.

  You may be a strong fit if

  - Most of your experience is in data-intensive backend
    engineering, but you have also shipped frontend work.

  Base Salary Range

  $135,000—$170,000 USD

  Actual compensation may vary based on experience, skills,
  and location.

  In addition to your base salary, we offer an equity package,
  comprehensive healthcare benefits (medical, dental, and
  vision), and a 401(k) plan. Our team enjoys a flexible PTO
  policy, 12 company-paid holidays, and 12 weeks of paid
  parental leave. We also provide a $500 work-from-home
  stipend to support your remote setup.

  Interview Process The interview process varies by role but
  typically begins with a 30-minute interview with a Northbeam
  recruiter, followed by a video interview with the hiring
  manager. Next, candidates complete a role-specific video
  interview followed by video or onsite interviews with
  several team members. The final step is a video interview
  with our CEO/Co-founder. The entire interview process is
  usually 5-7 interviews total and requires around 5-8 hours
  of your time.

  We accept applications on an ongoing basis.
