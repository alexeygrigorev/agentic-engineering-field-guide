  • Proven technical skills as an individual contributor.



  • Able to be highly productive on an agile project delivery
  team.



  • Collaborate with DevOps engineering to implement
  continuous integration and deployment using Jenkins and
  uDeploy tools; analyzing code quality issues using Sonar;
  implementing application resiliency procedures using HP
  Operations Orchestration; and process management using HP
  Service Manager and ServiceNow.



  • Maintain trusted relationships with technical and business
  partners.



  • Ability to learn with minimal guidance. The Expertise
