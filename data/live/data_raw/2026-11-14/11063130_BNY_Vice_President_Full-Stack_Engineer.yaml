description: |
  We’re seeking a future team member for the role of Vice
  President, Full Stack Engineer to join our ETF Engineering
  team. This role is in New York City, NY.

  In this role, you’ll make an impact in the following ways:  

  - Participate in the technical design, development, and
    implementation of ETF application systems, writing well-
    structured, testable, and efficient code.
  - Design and develop automated test suites and quality-
    assurance procedures using standard testing frameworks.
  - Actively participate in code reviews and integrate software
    components into fully functional systems.
  - Ensure high-quality engineering outcomes using CI/CD,
    automation, and DevOps practices, delivering software via
    rapid iterations and frequent releases.
  - Collaborate effectively with multi-location teams across
    engineering, product, operations, and support functions.
  - Liaise with internal and external clients with a client-
    first mindset, translating business needs into clear
    technical solutions and support.
  - Participate in production release-day activities, including
    deployment validation, issue triage, and post-release
    support.
  - Champion an AI-first approach across the SDLC, including AI-
    assisted coding, automated testing, remediation, and code
    quality.

  To be successful in this role, we’re seeking the
  following:  

  - Bachelor’s degree in computer science, Engineering, or a
    related field, or an equivalent combination of
    professional experience and practical expertise.
  - 5 years of experience.
  - Strong back-end experience with Java 17 or later, Spring 6,
    and Spring Boot 4.
  - Strong Core Java, including multi-threading, memory usage,
    and large data transfer.
  - Front-end proficiency with Angular 18 or later, HTML, CSS,
    and JavaScript.
  - Experience designing, building, testing, and managing client
    facing RESTful web services and APIs for inter-process
    communication.
  - Experience with MSSQL or Oracle databases and caching
    frameworks such as Hazelcast.
  - Experience with messaging technologies such as Kafka, FIX
    (with QuickFixJ), or MQ.
  - Strong understanding of testing frameworks and utility
    libraries such as JUnit, TestContainers, Mockito,
    Playwright and Apache.
  - Experience working in Agile delivery environments.
  - Experience with LLMs, prompt engineering, MCP, or AI
    development tools such as Codex, Claude, or Windsurf is
    strongly preferred.
  - Familiarity with OAuth2/OIDC/JWT security models.
  - Familiarity working with and configuring GitLab CI/CD and
    DevOps is a plus.
  - Experience with container-based cloud frameworks or
    Docker/Podman is a plus.
  - Excellent communication and collaboration skills to work
    effectively with diverse stakeholders and external clients
  - Understanding of ETFs or a general financial-services
    background is preferred.

  About Us

  At BNY, our culture allows us to run our company better and
  enables employees’ growth and success. As a leading global
  financial services company at the heart of the global
  financial system, we influence nearly 20% of the world’s
  investible assets. Every day, our teams harness cutting-edge
  AI and breakthrough technologies to collaborate with
  clients, driving transformative solutions that redefine
  industries and uplift communities worldwide.

  Recognized as a top destination for innovators, BNY is where
  bold ideas meet advanced technology and exceptional talent.
  Together, we power the future of finance – and this is what
  #LifeAtBNY is all about. Join us and be part of something
  extraordinary.

