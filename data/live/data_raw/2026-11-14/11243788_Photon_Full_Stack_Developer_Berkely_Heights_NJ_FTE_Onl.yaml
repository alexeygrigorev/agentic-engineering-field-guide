  Experience writing unit and integration tests for UI code
  (Jest, React Testing Library, Vue Test Utils) • Strong CSS
  skills, including layout, responsive design and CSS
  methodologies (Sass/SCSS, CSS Modules, Styled Components,
  Tailwind). • Familiarity with CI/CD pipelines and automated
  build/deploy processes. • Good understanding of browser
  rendering, performance profiling and optimization
  techniques. • Strong collaboration and communication skills;
  experience working in Agile teams.

  Compensation, Benefits and Duration

  Minimum Compensation: USD 50,000 Maximum Compensation: USD
  175,000 Compensation is based on actual experience and
