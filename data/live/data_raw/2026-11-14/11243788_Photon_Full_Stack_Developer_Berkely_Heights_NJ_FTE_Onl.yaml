  using React or Vue.js • Strong Java experience (3+ years)
  with familiarity building and integrating with Java backends
  (Spring Boot preferred), knowledge in PHP will be
  beneficial. • Hands‑on experience with TypeScript
  (recommended) or modern JavaScript (ES6+). • Proven
  experience designing and implementing responsive,
  accessible, and performant user interfaces. • Solid
