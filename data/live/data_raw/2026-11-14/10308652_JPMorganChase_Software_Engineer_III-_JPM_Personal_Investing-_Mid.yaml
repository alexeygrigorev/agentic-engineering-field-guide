  About the Team

   The Cybersecurity & Technology Controls group at
  JPMorganChase aligns the firm’s cybersecurity, access
  management, controls and resiliency teams. The group
  proactively and strategically partners with all lines of
  business and functions to enable them to design, adopt and
  integrate appropriate controls; deliver processes and
  solutions efficiently and consistently; and drive automation
  of controls. The group’s number one priority is to enable
  the business by keeping the firm safe, stable and resilient.









  High Risk Roles (HRR) are sensitive roles within the
  technology organization that require high assurance of the
  integrity of staff by virtue of 1) sensitive cybersecurity
  and technology functions they perform within systems or 2)
  information they receive regarding sensitive cybersecurity
  or technology matters. Users in these roles are subject to
  enhanced pre-hire screening which includes both criminal and
  credit background checks (as allowed by law). The enhanced
  screening will need to be successfully completed prior to
  commencing employment or assignment.
