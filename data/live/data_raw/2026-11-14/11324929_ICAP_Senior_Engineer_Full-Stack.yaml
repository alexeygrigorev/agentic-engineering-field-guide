description: |
  The TP ICAP Group is a world leading provider of market
  infrastructure.

  Our purpose is to provide clients with access to global
  financial and commodities markets, improving price
  discovery, liquidity, and distribution of data, through
  responsible and innovative solutions.

  Through our people and technology, we connect clients to
  superior liquidity and data solutions.

  The Group is home to a stable of premium brands.
  Collectively, TP ICAP is the largest interdealer broker in
  the world by revenue, the number one Energy & Commodities
  broker in the world, the world’s leading provider of OTC
  data, and an award winning all-to-all trading platform.

  The Group operates from more than 60 offices in 27
  countries.  We are 5,300 people strong.  We work as one to
  achieve our vision of being the world’s most trusted,
  innovative, liquidity and data solutions specialist.

  Role Overview:

  TP ICAP has Partnered with Amazon Web Services (AWS) to
  build the Next Generation of the Fusion Platform and make it
  Global Market Infrastructure. This role will be working in a
  new team to build out a new Platform based on the latest
  technology and architecture. You will be working alongside
  AWS and learning from the best. As a Senior Engineer you
  will be responsible for demonstrating excellent technical
  competencies with a desire to improve and mentor junior
  members of the team. You will take responsibility for your
  assigned work by taking ownership of the design, development
  testing and deployment of software across the team, and work
  closely with the Principal Engineer, Architects and Leads to
  ensure the successful deployment into production
  environments.

  Role Responsibilities:

  - Be able to drive engineering improvements whilst
    communicating principles behind your work to other team
    members and the wider organisation.
  - Be proactive in supporting the team’s engagement in a well-
    defined SDLC that supports planning, prioritisation and
    delivery needs.
  - Support the team in leading conversations around estimation
    by leveraging previous experience, challenging
    requirements and fostering potential solutions.
  - Lead conversations around software systems to enable
    meaningful conversations about wider system architecture
    with Engineers.
  - Evolve systems towards target state architecture by
    refactoring and prioritisation of deliveries.

  Experience/Competencies

  Essential:

  - Demonstrable industry experience as a Full Stack or
    Front/Backend Engineer in Typescript in a professional
    environment.
  - Front-end skills
    - Proficient in HTML5, CSS3, and Typescript
    - Proficient in React, Redux, ReactQuery
    - Experience with modern JavaScript frameworks - React
    - Knowledge of version control systems (Git)
    - Understanding of cross-browser compatibility
    - Familiarity with RESTful APIs, GraphQL and Websockets
    - Experience with CSS pre-processors e.g. Tailwind
  - Back-end skills
    - Proficiency in backend programming languages (Typescript
      and/or other OOP language such as c#/Java)
    - Strong database knowledge (SQL and NoSQL)
    - Proficiency with RESTful APIs and GraphQL APIs and
      Websockets
    - Experience with microservices architecture
    - Knowledge of version control systems (Git)
    - Experience with Terraform
    - Experience with automated testing
    - Experience with AWS (AWS Lambda, AWS Fargate, Amazon API
      Gateway, AWS AppSync)
  - Worked within an Agile Cross-functional delivery team.

  - Developing well tested software into low latency event
    driven production environments.
  - Full software development lifecycle in a technical role.
  - Pub/Sub patterns with Messaging technologies (such as
    SOLACE/AMQP)
  - Worked within a technical platform team, delivering reusable
    services across multiple agile projects.
  - Microservice Architecture.
  - Containerization.
  - Maintaining code quality with Unit, Integration and e2e
    testing.
  - AWS cloud ecosystem and the AWS CLI (or industry
    equivalent).

  - Linux shell or Windows PowerShell.
  - CI and CD flows within an enterprise environment. Continuous
    Delivery
  - Agile tooling to support team delivery, such as JIRA and
    other project management systems.

  - Open to innovative ideas/ experiences and ability to create
    new ideas, approaches or insights.
  - Seeks opportunities for improvements.
  - Demonstrates high levels of energy in seeking out and
    achieving new goals.

  - Can work with BA’s/PO’s to demystify ambiguity, handle
    challenge, and is comfortable to challenge team mates
    constructively.
  - Adapts communication style to suit audience.
  - Works ethically and shows respect for both professional and
    company values.
  - Excellent attention to detail, highly organised with a
    proactive approach.
  - Strong analytical ability and innovative problem solving
    skills.
  - Software Design Patterns.
  - Source control (Git).

  Desired:

  - OOP \ SOLID Principles.
  - Demonstrable experience of C# (.Net 8+) in a professional
    environment.
  - Contribution to open-source projects.
  - Experience of regulatory driven projects.
  - Knowledge of Financial Markets, Systems and Over the Counter
    (OTC) products.

  The Fusion Platform Team Builds, Owns and Runs it’s own
  services all the way through to Production. The services are
  used 24/5 by several teams. As part of a global team, there
  may be times when you are asked to assist with production
  incidents or support outside regular hours to maintain
  operational stability.

  Band & Level – Manager, 6

  #LI-Hybrid #LI-MID

  Not The Perfect Fit?

  Concerned that you may not meet the criteria precisely? At
  TP ICAP, we wholeheartedly believe in fostering inclusivity
  and cultivating a work environment where everyone can
  flourish, regardless of your personal or professional
  background. If you are enthusiastic about this role but find
  that your experience doesn't align perfectly with every
  aspect of the job description, we strongly encourage you to
  apply. You may be the ideal candidate for this position or
  another opportunity within our organisation. Our dedicated
  Talent Acquisition team is here to assist you in recognising
  how your unique skills and abilities can be a valuable
  contribution. Don't hesitate to take the leap and explore
  the possibilities. Your potential is what truly matters to
  us.

  Company Statement

  We know that the best innovation happens when diverse people
  with different perspectives and skills work together in an
  inclusive atmosphere. That's why we're building a culture
  where everyone plays a part in making people feel welcome,
  ready and willing to contribute. TP ICAP Accord - our
  Employee Network - is a central to this. As well as
  representing specific groups, TP ICAP Accord helps increase
  awareness, collaboration, shares best practice, and holds
  our firm to account for driving continuous cultural
  improvement.

  Location

  UK - 135 Bishopsgate - London
