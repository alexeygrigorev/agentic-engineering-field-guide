description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You'll Do

  The Security Foundations organization at CoreWeave keeps
  CoreWeave Cloud secure by design, from data centers and GPU
  fleets to the platform layers powering our customers' AI
  workloads. The PKI & Secrets team owns the cryptographic
  infrastructure underpinning the confidentiality, integrity,
  and authenticity of CoreWeave's data and systems: PKI,
  secrets management, HSMs, key management, and code signing.

  We partner with teams across the company to deliver
  cryptographic services that are secure, reliable, and easy
  to use at scale.

  About the Role

  As a Senior Software Engineer on the PKI & Secrets team, you
  will shape how CoreWeave manages cryptographic
  infrastructure across its global fleet. You'll design and
  operate our attestation infrastructure in particular, which
  guarantees that every component in our cloud runs untampered
  and expected firmware software and its dependencies. This
  work is directly relevant to ensuring CoreWeave cloud is a
  trusted environment for our customers to use and is a
  critical part of our infrastructure.

  The team also broadly owns PKI hierarchies, secrets
  management platforms, HSM infrastructure, and key management
  systems.

  In this role, you will:

  - Contribute to the design, implementation, and operation of
    CoreWeave's Attestation Service that measures and
    validates our cloud infrastructure’s integrity backed by
    hardware root of trust.
  - Manage and evolve gathering verifiable data from our
    environment at scale, asserting trust and confidence that
    feeds into the lifecycle and governance of our
    infrastructure.
  - Do hands-on work in the Root of Trust and Identity space
    such as HSM Infrastructure, key management, PKI solutions
    and their integration with many platforms and products
    across CoreWeave.

  Who You Are

  - (5)+ years of experience in security engineering or
    infrastructure engineering.
  - Bachelor’s degree in Computer Science or related field
  - Strong understanding of PKI concepts including CA
    hierarchies, certificate profiles, issuance policies,
    revocation, and trust distribution.
  - Proficiency in Go, Python, or similar languages, with the
    ability to build production tooling and automation.
  - Experience with Kubernetes

  Preferred

  - Experience building Attestation Service to verify integrity
    of machines.

  Wondering if you're a good fit?

  We believe in investing in our people, and value candidates
  who can bring their own diversified experiences to our
  teams, even if you aren't a 100% skill or experience match.
  If some of this describes you, we'd love to talk.

  - You think deeply about how trust is established in complex
    distributed systems — and you enjoy making that
    infrastructure invisible to the teams that depend on it.
  - You're comfortable operating at multiple levels of
    abstraction, from HSM key ceremonies to Kubernetes
    operator design and developer experience.
  - You're a pragmatic builder who ships durable solutions in
    fast-moving environments.

  The base salary range for this role is $153,000 to $204,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

