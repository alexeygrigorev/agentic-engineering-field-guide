description: |
  Job Description Role Summary Options market making presents
  a unique challenge in combining scale with business
  complexity. With over a million of listed options at the
  heart of billions of messages, we handle internet-scale
  datasets while being constrained on hardware due to latency
  requirements necessitating exchange co-location. This forces
  us to both push the machines to their max as well as
  innovate in the space of algorithms and business. In our
  mission to be the most successful investment team in the
  world, we hire the brightest minds in technology, research,
  and finance, and empower them to collaborate. Treating the
  problems as "data-in, data-out" technical challenges is not
  enough. To succeed, you need to be willing to master the
  options trading domain and translate this mastery into
  cutting edge software solutions, collapsing data cardinality
  where possible. Opportunities may be available from time to
  time in any location in which the business is based for
  suitable candidates. If you are interested in a career with
  Citadel, please share your details and we will contact you
  if there is a vacancy available. Responsibilities

  - Build, maintain and support one of the world's most powerful
    trading platforms while continuously improving
    performance, functionality and stability of the system
  - Design, develop, test, and deploy elegant software solutions
    across the firm
  - Partner with business leaders to define priorities and
    deliver custom solutions
  - Analyze complex business and technical problems
  - Make sound decisions proactively and in a self-directed
    manner
  - Provide timely systems support for trading activities

  Qualifications

  - 5+ years of working experience
  - Experience working in C++
  - Experience working with distributed systems
  - Sound understanding of multi-threaded application design and
    development
  - Passion for technology and software development
  - Ambition to solve open-ended problems using analytical
    methods
  - Ability to work independently and prioritize high-impact
    projects
  - Strong communication and interpersonal skills applicable to
    a dynamic trading environment
  - Bachelor's degree (or equivalent experience) in Computer
    Science or related field

  In accordance with applicable law, the base salary range for
  this role is $175,000 to $325,000.  In addition, the
  employee who fills this role will be eligible to participate
  in a discretionary incentive compensation program, as well
  as a wide array of benefit programs, such as medical and
  life insurance, retirement and tax-free savings plans, and
  access to other healthcare programs. About Citadel
  Securities Citadel Securities is a technology-driven, next-
  generation global market maker. We provide institutional and
  retail investors with world-class liquidity, competitive
  pricing and seamless front-to-back execution in a broad
  array of financial products. Our teams of engineers, traders
  and researchers harness leading-edge quantitative research
  and the accelerating power of compute, machine learning and
  AI to power our analytics and tackle the market's and our
  clients' most critical challenges. Together, we are forging
  the future of capital markets. For more information, visit
  citadelsecurities.com .
