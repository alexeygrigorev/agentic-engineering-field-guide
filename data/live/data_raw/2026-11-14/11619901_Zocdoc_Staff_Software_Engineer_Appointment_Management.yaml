description: |
  Our Mission

  You call. You wait. You call again. In every other part of
  your life, you book in seconds. In healthcare, you’re
  blocked.

  We’re here to give power to the patient.

  For nearly 20 years, we’ve built the leading healthcare
  marketplace - helping tens of millions of people find and
  book the care they need. Now, we’re going further: building
  our infrastructure beyond Zocdoc’s marketplace to power
  access to care wherever patients search, from provider
  websites and insurance directories to search engines, AI
  platforms, and more.

  Healthcare still lacks something every other major consumer
  industry takes for granted: a seamless way to go from
  seeking to getting. We don’t want to own the front door to
  care; there isn't one. We want to make sure all of those
  doors open when patients are knocking.

  Fixing healthcare starts with fixing access to it. And we're
  still just getting started.

  Your Impact on our Mission:

  We are looking for a Staff Software Engineer to join the
  Appointment Management team at Zocdoc! This team owns the
  backend systems that determine when, where, and how
  appointments can be booked across Zocdoc's channels. We
  build the services, APIs, and data models that let practices
  express their real-world scheduling needs and ensure
  providers are accurately bookable for the patients they can
  serve. This foundational work supports the booking
  experience for millions of patients while enabling providers
  and practice staff to manage their schedules with
  confidence.

  As a Staff Engineer at Zocdoc, you'll balance deep
  individual contribution with technical leadership and
  mentorship. You'll shape the architecture of our scheduling
  and availability systems, drive cross-team technical
  initiatives, and raise the engineering bar through sound
  practices and operational ownership. You'll work primarily
  on backend systems, with opportunities to contribute across
  the stack when needed.

  You’ll enjoy this role if you are…

  - Excited by the challenge of building the backend systems
    that power scheduling across healthcare
  - Energized by designing services and data models that handle
    real-world complexity at scale
  - A product-minded engineer who loves working in a highly
    collaborative and supportive environment
  - Motivated by building foundational infrastructure that makes
    healthcare easier for patients and providers
  - Passionate about mentorship and leveling up the engineers
    around you.
  - Passionate about building diverse and inclusive teams and
    culture

   Your day to day is…

  - Owning the design and development of backend services, APIs,
    and data models that power Zocdoc's scheduling and
    availability systems, primarily using C#/.NET and AWS
    technologies (DynamoDB, Lambdas, SQS/SNS, Kinesis). We
    also use React/TypeScript on the frontend
  - Driving architectural decisions for complex scheduling
    logic, ensuring reliability, scalability, and correctness
    across millions of bookings
  - Leading cross-team technical initiatives and establishing
    patterns that improve engineering quality beyond your
    immediate team
  - Collaborating with our agile team of dedicated and brilliant
    engineers, product managers, and designers to deliver
    high-impact features
  - Championing a culture of engineering excellence, leading by
    example in code quality, performance, and operational
    ownership
  - Mentoring your peers, with the notion that helping others
    means learning and growing yourself
  - Working with cutting edge GenAI tools and technology

  You’ll be successful in this role if you have…

  - A track record of designing and delivering backend systems
    that handle complex domain logic at scale
  - A passion for technology and the ability to think critically
    about the performance, scalability, and reliability of the
    systems you build
  - The instinct to simplify: you break down ambiguous, loosely
    defined problems into clear technical direction
  - Successfully mentored other engineers and encouraged your
    peers to adopt engineering best practices
  - Integrated generative AI tools into daily workflows to
    automate tasks, foster innovation, and maximize
    productivity
  - The mentality of an owner: you drive initiatives from
    architectural design through production and take pride in
    operational excellence
  - Superb communication skills. You keep stakeholders in the
    loop and can dive into technical details at the right
    level for any audience
  - An unrelenting desire to build more equitable, inclusive,
    and diverse workplaces, and you view this role as an
    opportunity to create positive change
  - Humility. You treat all people with dignity and respect,
    regardless of title or tenure

  Benefits:

  - Flexible, hybrid work environment
  - Unlimited Vacation
  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - Commuter Benefits
  - 401(k) with employer funded match
  - Corporate wellness program with Wellhub
  - Sabbatical leave (for employees with 5+ years of service)
  - Competitive paid parental leave and fertility/family
    planning reimbursement
  - Cell phone reimbursement
  - Catered lunch everyday along with beverages and snacks
  - Employee Resource Groups and ZocClubs to promote shared
    community and belonging
  - Great Place to Work Certified

  Zocdoc is committed to fair and equitable compensation
  practices. Salary ranges are determined through alignment
  with market data. Base salary offered is determined by a
  number of factors including the candidate’s experience,
  qualifications, and skills. Certain positions are also
  eligible for variable pay and/or equity; your recruiter will
  discuss the full compensation package details.

  NYC Base Salary Range

  $180,000—$270,000 USD

  About us Zocdoc is the country’s leading digital health
  marketplace that helps patients easily find and book the
  care they need. Each month, millions of patients use our
  free service to find nearby, in-network providers, compare
  choices based on verified patient reviews, and instantly
  book in-person or video visits online. Providers participate
  in Zocdoc’s Marketplace to reach new patients to grow their
  practice, fill their last-minute openings, and deliver a
  better healthcare experience. Founded in 2007 with a mission
  to give power to the patient, our work each day in pursuit
  of that mission is guided by our six core values. Zocdoc is
  a private company backed by some of the world’s leading
  investors, and we believe we’re still only scratching the
  surface of what we plan to accomplish.

  Zocdoc is a mission-driven organization dedicated to
  building teams as diverse as the patients and providers we
  aim to serve. In the spirit of one of our core values -
  Together, Not Alone, we are a company that prides itself on
  being highly collaborative, and we believe that diverse
  perspectives, experiences and contributors make our
  community and our platform better.  We’re an equal
  opportunity employer committed to providing employees with a
  work environment free of discrimination and harassment.
