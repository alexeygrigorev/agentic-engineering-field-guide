description: |
  Senior Full Stack Engineer

  Location: Remote (Must accommodate US East Coast working
  hours). Preference for candidates based in Brazil.

  About Us

  Partnerships are the future of go-to-market. They drive
  30-50% of company revenue, yet most partner teams are stuck
  with spreadsheets, email chains, and outdated CRMs, tools
  never built for partnerships at scale. The result? Wasted
  time, lost deals, and inefficiencies that kill growth.

  EULER is the AI-native PRM for modern partnership teams,
  built to replace manual work, eliminate partner friction,
  and turn partner activity into repeatable revenue and
  measurable ROI. We are not iterating on legacy PRM software.
  We are redefining what the category even is, and the market
  is taking notice.

  We grew 600% YoY in 2025 and serve industry leaders,
  consistently winning against legacy solutions in competitive
  deals. We move fast, build intentionally, and lead the
  market on innovation and AI. If you're excited to solve big
  problems, work with smart teammates, and shape the future of
  partner tech, we'd be glad to meet you.

  Role Overview

  As a Senior Full Stack Engineer, you will help build and
  scale the platform behind Euler's AI-native PRM. You will
  work across the stack, building front-end applications and
  back-end services, designing integrations with the CRM and
  partner tools our customers already rely on, and shipping
  features alongside our engineering and AI team. This role
  combines the hands-on technical depth of our Software
  Engineer and QA Engineer roles with broader ownership across
  the full stack.

  Key Responsibilities

  - Build front-end applications using React and Next.js, and
    back-end services using Python and Node.js.
  - Design and implement integrations with CRM platforms, such
    as Salesforce and HubSpot, and other partner tools.
  - Build and maintain microservices on AWS and Cloudflare,
    ensuring scalability and reliability.
  - Ship features in close collaboration with our engineering
    and AI team.
  - Build and consume RESTful APIs across internal and customer-
    facing services.
  - Follow secure coding practices and maintain CI/CD pipelines
    and deployment workflows.

  What We're Looking For

  - Solid experience with JavaScript/TypeScript, React, and
    Python.
  - Experience building and consuming RESTful APIs.
  - Understanding of secure coding practices.
  - Familiarity with CI/CD pipelines and deployment workflows.
  - Basic English communication skills, written and verbal.
  - A proactive, problem-solving attitude, with ability to work
    independently and as part of a dynamic team.
  - Comfortable working within US East Coast hours. Strong
    preference for candidates based in Brazil.

  Nice to Have

  - Experience with AWS, particularly Lambda and related
    services.
  - HubSpot and/or Salesforce integration experience.
  - Experience with Cloudflare, including Workers and
    Containers.
  - Familiarity with Bubble.io or n8n.

  Why Join Us

  - Join a growing engineering team at a profitable, fast-
    scaling SaaS company.
  - Work on real infrastructure powering a product used by
    industry leaders
  - A collaborative, ownership-driven culture where your work
    directly impacts customers.
  - Opportunities for professional development and growth as the
    team scales.
