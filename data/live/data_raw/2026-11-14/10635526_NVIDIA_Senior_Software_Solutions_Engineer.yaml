description: |
  NVIDIA is widely considered to be one of the technology
  world’s most desirable employers. We have some of the most
  forward-thinking and hardworking people on the planet
  working for us. If you're creative, passionate, and self-
  motivated, we want to hear from you! We are looking for an
  experienced networking software engineer. An awesome
  candidate is highly technical who is also comfortable with
  dealing with enterprise customers. You will join a team of
  Solution Engineers focused on the Mellanox Networking, DGX
  Platforms, Container Orchestrators, Deep Learning
  containers, and other Enterprise related system software.

    SW Solution Engineers spend approximately 50% of their
  time helping customers with their most complex problems and
  50% of their time doing R&D related work. This individual
  should have proven grasp of datacenter and networking
  technologies, to provide comprehensive solutions for complex
  installations, maintenance, or operations for a broad scope
  of leading-edge networking products.

  What you'll be doing:

  - Take ownership and drive customer issues with Ethernet or
    InfiniBand network adapter/DPU deployments from inception
    to resolution.
  - Develop features and tools as part of solution engineering
    efforts to support all Enterprise Service offerings
    including but not limited to Networking products.
  - Work with NVIDIA Enterprise customers and internal users to
    improve the availability, reliability, and overall
    experience of working with NVIDIA Networking products.
  - Bring independent analysis, communication, and problem-
    solving to customer experience.
  - Collaborate with engineering to document, recreate and solve
    issues.

  What we need to see:

  - BSc in Computer Science, Electrical Engineering, Computer
    Engineering, or related field (or equivalent experience).
  - 8+ years system software development and troubleshooting
    experience, ideally with some customer facing.
  - Experience developing with C/C++ in kernel and/or
    application space and/or embedded software.
  - Strong understanding of GNU/Linux (tools, utilities, kernel,
    networking stack) and Linux-based virtualization
    (namespaces, containers, K8s)
  - Intellectual curiosity, positive attitude, flexibility,
    analytical ability, self-motivation, and team orientation.
  - Professional-level communication skills, interpersonal
    skills with a passion to solve problems.

  Ways to stand out from the crowd:

  - Familiarity with InfiniBand networks, RDMA protocol, RoCE,
    DPUs, DPDK, HPC applications (MPI/UCX), OVS
  - Hands-on experience in troubleshooting and analysis of the
    common datacenter networking protocols/technologies (e.g.:
    LACP, OSPF, BGP, EVPN, VXLAN)
  - Proven ability to deeply analyze IP / Layer 2 switching /
    Layer 3 routing networking protocols (ARP, STP, LACP,
    MLAG, IGMP, PIM, BGP, OSPF).
  - Contributions to networking related open-source projects.

  Your base salary will be determined based on your location,
  experience, and other objective job-related factors. The
  expected base salary ranges for this position are: Poland:
  230,250 PLN – 399,100 PLN for Level 4; and 281,250 PLN –
  487,500 PLN for Level 5. Germany: 99,825 EUR – 173,030 EUR
  for Level 4; and 116,325 EUR – 201,630 EUR for Level 5.
  Netherlands: 78,000 EUR – 135,200 EUR for Level 4; and
  97,500 EUR – 169,000 EUR for Level 5.
