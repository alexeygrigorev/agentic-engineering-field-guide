description: |
  About Invisible

  Invisible is an Applied AI research company closing the gap
  between frontier models and the enterprise. We provide the
  platform infrastructure that makes AI work in production at
  scale: unify fragmented data, map complex processes,
  orchestrate and evaluate agents, and stand up hyper-
  personalized workflow applications fast for companies like
  Grubhub, Alliance Global, and Thomson Reuters. Where models
  fall short, we build RL environments and data to fix them.
  The result: a virtuous cycle between enterprise deployment
  and model training. Recognized as Best Predictive Analytics
  Platform of the Year at the 2026 AI Breakthrough Awards,
  Invisible makes AI work.

  About The Role

  As a Software Engineer, Forward Deployed Engineer (FDE)
  you'll work directly with clients and our internal delivery
  teams to build and deploy AI-powered solutions that
  transform how work gets done. You’ll own projects end-to-
  end: scoping ambiguous problems, prototyping AI workflows,
  and deploying scalable systems on top of our products — all
  while interfacing with technical and non-technical
  stakeholders.

  This is a hybrid role: equal parts AI engineer, software
  builder, and technical consultant. It's perfect for someone
  who wants to be hands-on with models and close to the impact
  they generate.

  What You’ll Do

  - Collaborate with delivery leaders to scope technical
    solutions to operational problems
  - Identify workflow optimizations through deep engagement with
    customer problems and work to build into a stable and
    scalable solution
  - Design and implement AI-powered workflows using LLMs,
    embedding models, retrieval systems, and automation tools
  - Translate messy real-world constraints (e.g., inconsistent
    data, latency requirements) into elegant engineering
    solutions
  - Iterate quickly based on real-time feedback from operators
    and clients
  - Build reusable tooling and infrastructure that accelerates
    future deployments

  What We Need

  - Hands-on experience in software engineering or ML
    engineering — through professional roles, internships, or
    coursework/research projects
  - Strong Python skills and familiarity with libraries like
    PyTorch, Hugging Face, LangChain, or OpenAI APIs
  - Solid understanding of data pipelines, APIs, and production
    deployment (e.g., Docker, FastAPI, GCP/AWS)
  - Experience building usable systems from messy data and
    ambiguous requirements
  - Strong communication skills — you can explain technical
    decisions to delivery teams and client stakeholders
  - Entrepreneurial mindset and comfort working in fast-moving,
    unstructured environments
  - Be willing to be on-call for our customers when situations
    arise
  - Travel: Willingness to travel for on-site client engagements
    as needed
  - Onsite: Available to work from the office a few days per
    week, depending on team needs

  What’s In It For You

  Invisible is committed to fair and competitive pay, ensuring
  that compensation reflects both market conditions and the
  value each team member brings. Our salary structure accounts
  for regional differences in cost of living while maintaining
  internal equity. The annual salary range for this position,
  depending on level, is: £57,000 - £132,000 GBP

  Bonus and equity is included in all full-time, non
  commission offers. Final compensation is determined by a
  combination of factors, including location, job-related
  experience, skills, knowledge, internal pay equity, and
  overall market conditions. Because of this, every offer is
  unique. Additional details on total compensation and
  benefits will be discussed during the hiring process. You
  can find more information about our geographic pay tiers
  here. During the interview process, your Invisible Talent
  Acquisition Partner will confirm which tier applies to your
  location. For candidates outside the U.S., compensation is
  adjusted to reflect local market conditions and cost of
  living.

  What It's Like to Work at Invisible:

  At Invisible, we’re not just redefining work—we’re
  reinventing it. We operate at the intersection of advanced
  AI and human ingenuity, pushing the boundaries of what’s
  possible to unlock productivity and scale. Ownership is at
  the core of everything we do. Here, you won’t just execute
  tasks—you’ll build, innovate, and shape the future alongside
  world-class clients pushing the boundaries of AI.

  We expect bold ideas, relentless drive, and the ability to
  turn ambiguity into opportunity. The pace is fast, the
  challenges are big, and the growth is unmatched. We’re not
  for everyone, and we’re okay with that. If you’re looking
  for predictable routines, this isn’t the place for you. But
  if you’re driven to create, thrive in dynamic environments,
  and want a front-row seat to the AI revolution, you’ll fit
  right in.

  Country Hiring Guidelines: Invisible is a hybrid
  organization with offices and team members located around
  the world. While some roles may offer remote flexibility,
  most positions involve in-office collaboration and are tied
  to specific locations. Any location-based requirements or
  hybrid expectations will be communicated by our Talent
  Acquisition team during the recruiting process. AI
  Interviewing Guidelines: Our hiring team thoughtfully uses
  AI to support an efficient, engaging, and inclusive
  interview process. Since AI can also be a helpful tool for
  candidates, we've outlined expectations for using it
  ethically throughout your interview journey. Click here to
  learn more about how we use AI and our guidelines for
  candidates.

  Accessibility Statement: We are committed to providing
  reasonable accommodations for individuals with disabilities.
  If you require an accommodation to participate in the
  application or interview process, please submit your request
  using our accommodation request form. A member of our team
  will follow up to support your request.

  Equal Opportunity Statement: We’re an equal opportunity
  employer. All qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, sex, national origin, disability, or veteran
  status, or any other basis protected by law.
