description: |
  About Us:

  Live experiences help people cross today’s digital divide
  and focus on what truly connects us – the here, the now,
  this once-in-a-lifetime moment that’s bringing us together.
  To fulfill Gametime’s mission of uniting the world through
  shared experiences, we make it easy for people to discover
  and access the live experiences that matter most.



  With platforms on iOS, Android, mobile web and desktop
  supporting more than 60,000 events across the US and Canada,
  we are reimagining the event ticket industry in order to
  move at the speed of life.

  Engineering at Gametime

  Join a team where you can move fast, own meaningful
  problems, and see your work impact millions of users.

  At Gametime, engineers take end-to-end ownership across
  product, platform, and infrastructure. We value strong
  technical judgment, high standards and a collaborative
  culture built around shipping, learning, and continuous
  improvement.

  We're also investing heavily in AI. From internal
  engineering tools and agentic systems to building an AI-
  ready marketplace and platform. Engineers who are excited to
  experiment, automate, and help shape how AI transforms our
  products and workflows will have the opportunity to
  influence the future of the company.

  The Opportunity

  We're hiring Senior Full Stack Engineers to help build and
  scale the systems, applications, and experiences that power
  Gametime for millions of users.

  Whether you're an experienced engineer looking to deepen
  your impact or a technical leader who enjoys shaping
  architecture and strategy, you'll have the opportunity to
  solve complex problems, influence key technical decisions,
  and help drive AI adoption across our platform and
  engineering workflows.

  Level Expectations

  Senior Engineer – Typically 6+ years of experience. Delivers
  complex solutions independently and contributes to technical
  decisions.

  We hire based on impact and capability, not just years of
  experience. We encourage you to apply and your level will be
  fully determined and agreed in the interview process.

  What You’ll Do

  - Build and ship high quality full-stack features across web,
    mobile, backend services, and APIs.
  - Design scalable, reliable systems that support millions of
    users.
  - Develop and maintain high-performance services,
    integrations, and infrastructure.
  - Partner with Product, Design, and Data teams to solve
    customer and business problems.
  - Own projects from concept through deployment and ongoing
    optimization.
  - Write high-quality code, participate in code reviews, and
    contribute to engineering best practices.
  - Improve system performance, observability, and developer
    productivity.
  - Help drive AI adoption through intelligent automation,
    agentic tools, and AI-powered workflows.
  - Collaborate with a talented team in a culture focused on
    ownership, learning, and continuous improvement.

  What You’ll Bring

  - Experience building full-stack applications across frontend,
    backend, and APIs.
  - Strong backend development skills in Golang or similar
    languages (Python, Java, C#, Ruby, Rust, etc.).
  - Strong system design skills with a focus on scalability,
    reliability, and performance.
  - Experience designing and maintaining RESTful or GraphQL
    APIs.
  - Familiarity with cloud platforms such as AWS, GCP, or Azure.
  - Experience with relational and NoSQL databases.
  - Exposure to event-driven architectures and messaging
    systems.
  - Knowledge of workflow orchestration tooling like Temporal or
    AWS Step Functions
  - AI curiosity and fluency with tools like Cursor, Claude, or
    ChatGPT is a plus.
  - Experience building modern web applications with React.
  - Familiarity with mobile development concepts and/or React
    Native.
  - Collaborative mindset with a passion for solving problems
    and building great products.

  What We Offer:

  - Flexible PTO
  - Competitive salary & equity package
  - Monthly Gametime credits for any event ($1,200/yr)
  - Medical, dental, & vision insurance
  - Life insurance and disability benefits
  - Diverse Family-forming benefits through Carrot Fertility
  - 401k, HSA, pre-tax savings programs
  - Company off-sites and meet-ups
  - Wellness programs
  - Tenure recognition

  At Gametime pay ranges are subject to change and assigned to
  a job based on specific market median of similar jobs
  according to 3rd party salary benchmark surveys. Individual
  pay within that range can vary for several reasons including
  skills/capabilities, experience, and available budget.

  United States - Pay Range

  $187,000—$243,000 USD

