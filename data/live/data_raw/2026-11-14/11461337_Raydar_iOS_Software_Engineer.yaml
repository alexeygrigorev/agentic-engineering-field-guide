description: |
  About the company

  Our client is a fast-growing technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Act as a hands-on mobile engineer responsible for a consumer
  iOS app across its whole life, from early concept to App
  Store release. Partner daily with company leadership and
  cross-functional colleagues to deliver refined features,
  guide technical direction and set a high quality bar.

  What you'll do

  - Design, build and launch native iOS features in Swift,
    taking each one from first idea to release.

  - Shape the app's technical structure so it holds up as more
    engineers join.

  - Create smooth, visually refined screens and interactions.

  - Investigate live-app defects and tune stability and speed.

  - Introduce coding conventions and review habits for the
    mobile group.

  - Propose improvements, run experiments and iterate quickly
    instead of waiting for detailed specifications.

  Requirements

  What we're looking for

  - Roughly 1 to 5 or more years building iOS apps commercially,
    with Swift as your main language.

  - Experience launching a mobile app from scratch using MVVM or
    a comparable design pattern.

  - Working knowledge of the iOS platform, app design principles
    and consuming REST services.

  - Comfort managing asynchronous data flows.

  - History of making meaningful contributions to a widely used
    product, ideally on mobile.

  - Strong sense of ownership and ease with ambiguity in a
    startup setting.

  - Good product judgment and a keen eye for interface detail.

  - Practical experience using AI tools and agent-based
    workflows in day-to-day development.

  - Living in New York City or ready to relocate there.

  Bonus points

  - Exposure to a gamified consumer app or a marketplace
    business.

  - Time spent at a startup or design-focused company known for
    polished mobile products.

  Benefits

  Compensation and benefits

  - Base salary: USD 130,000 to 230,000 per year

  - Equity

  Location and work model

  - New York City, NY, United States

  - On-site, 5 days per week in office

  - Full-time
