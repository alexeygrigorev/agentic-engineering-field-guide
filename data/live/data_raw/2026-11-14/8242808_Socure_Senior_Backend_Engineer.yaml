description: |
  Why Socure?

  Socure is building the identity trust infrastructure for the
  digital economy — verifying 100% of good identities in real
  time and stopping fraud before it starts. The mission is
  big, the problems are complex, and the impact is felt by
  businesses, governments, and millions of people every day.

  We hire people who want that level of responsibility. People
  who move fast, think critically, act like owners, and care
  deeply about solving customer problems with precision. If
  you want predictability or narrow scope, this won’t be your
  place. If you want to help build the future of identity with
  a team that holds a high bar for itself — keep reading.

  Socure is seeking a highly skilled and experienced Senior
  Software Engineer to join our dynamic engineering team
  within the Technology Center of Excellence. In this critical
  role, you will be a technical leader, driving the design,
  development, and deployment of innovative software solutions
  that help eliminate identity fraud. You will work closely
  with cross-functional teams, mentor junior engineers, and
  ensure the delivery of high-quality, scalable, and secure
  products. At Socure, we value teamwork, outcome-driven
  development, and a commitment to best-in-class technology
  experiences.

  Key Responsibilities:

  - Design, develop, test, and debug components for distributed
    systems that operate at large scale and high speed
  - Own and drive nonfunctional requirements such as
    scalability, availability, and security
  - Develop and maintain unit and integration tests, achieving
    robust code and functional coverage
  - Produce enterprise-class documentation for internal and
    external collaboration
  - Break down complex tasks into manageable components, plan,
    and execute effectively
  - Collaborate with team members to elevate technology
    standards and consistently apply best practices
  - Participate actively in an agile environment to deliver
    high-quality software solutions

  Job Requirements:

  - 5-7 years of significant hands-on coding experience with
    Golang, preferably in a product development environment
  - Strong programming and design fundamentals, with excellent
    problem-solving and coding skills
  - Exceptional analytical and reasoning abilities, with a
    talent for visualizing processes and outcomes
  - Passion for continuous learning and growth while building
    high-performance systems, with a solid understanding of
    concurrency and multi-threading
  - Experience architecting microservices and developing RESTful
    APIs
  - Prior experience with high-throughput, low-latency storage,
    cloud computing, NoSQL databases, big data analytics,
    machine learning services, or large-scale systems is a
    plus

  Socure is an equal opportunity employer that values
  diversity in all its forms within our company. We do not
  discriminate based on race, religion, color, national
  origin, gender, sexual orientation, age, marital status,
  veteran status, or disability status. If you need an
  accommodation during any stage of the application or hiring
  process—including interview or onboarding support—please
  reach out to your Socure recruiting partner directly.

