description: |
  This role is based in the United Kingdom. You will be
  required to interview in person.

  Must have permanent residency in the UK (I.e. British
  Passport, Settled Status or ILR)

  About SailPoint

  SailPoint is defining the next era of identity security. Our
  unified, AI-powered platform seamlessly secures both the
  Human Fabric of your workforce and the Agentic Fabric of AI
  and non-human identities, completely eliminating
  organizational blind spots.

  Built on core principles like zero-standing privilege and
  contextualized risk, our platform transforms identity from a
  vulnerability into a strategic business advantage. Today, we
  are trusted by some of the largest, most complex
  organizations in the world to deliver intelligent,
  autonomous identity security at scale.

  About the role.

  As a Staff Software Engineer at SailPoint, you will
  architect, build, and deliver high-performance cloud
  services that form the core decision-making brain of our
  identity platform. In this role, your day-to-day will
  involve designing resilient full-stack solutions using
  Golang and Angular, engineering synchronous and event-driven
  microservices, and pioneering AI-assisted and agentic
  development workflows. You will collaborate closely with
  product managers, UX designers, architects, and global
  engineering peers to translate complex identity governance
  concepts into performant, elegant, and secure production
  systems. You will also take active ownership of technical
  excellence across our codebase through architecture reviews,
  system profiling, and developer mentorship.

  About the team

  You will join the UK Platform Engineering team, a
  collaborative, high-velocity group responsible for
  designing, building, and running foundational services for
  SailPoint. Our team currently features a strong mix of
  backend and frontend specialists transitioning to end-to-end
  full-stack development to support cutting-edge AI and
  identity initiatives. We value autonomy, continuous
  learning, and close teamwork, staying connected through day-
  to-day collaboration and meeting in person once per quarter
  for team offsites.

  Roadmap for success

  30 days:

  - Complete SailPoint engineering onboarding, development
    environment setup, and security compliance training.
  - Shadow team members to understand the architecture, API
    contracts, and deployment pipelines of the Policy Engine.
  - Deliver your first bug fix or minor feature contribution to
    production using Golang or Angular.

  60 days:

  - Partner with technical leads, architects, and product
    managers to define technical specifications and rough
    estimates for upcoming roadmap items.
  - Build, test, and deploy end-to-end features supporting real-
    time and batch policy evaluation workflows.
  - Conduct thorough code reviews and collaborate with peers on
    unit and integration testing strategies.

  6 months:

  - Lead the autonomous design, implementation, and deployment
    of complex features across the Policy Engine and SailPoint
    Agentic Fabric.
  - Establish debug and performance profiling benchmarks to
    improve service latency, throughput, and reliability.
  - Participate in the 24x7 engineering on-call support rotation
    (approximately 1 week in 20) and drive operational
    improvements.

  1 year:

  - Serve as a Subject Matter Expert (SME) on Policy Engine
    services and distributed system architecture.
  - Mentor and coach junior and mid-level software engineers on
    modern software design patterns, Golang, Angular, and AI-
    assisted tooling.
  - Drive cross-functional architectural initiatives in
    collaboration with engineering teams worldwide as the
    platform scales.

  Requirements

  - Bachelors degree in related field, or equivalent
    professional experience
  - 8+ years of professional software development experience
  - Proven expertise in backend microservice design and
    development, preferably using Golang
  - Strong experience developing modern web frontends,
    preferably using Angular
  - Solid foundation in automated testing and debugging,
    including unit, integration, and performance profiling
    tools
  - Experience designing and maintaining scalable microservices
    within a distributed SaaS cloud environment
  - Excellent collaboration, problem-solving, and communication
    skills

  Preferred Skills & Tech Stack

  - Tech Stack: Golang, Angular, Java, AWS, Docker, Kubernetes,
    Terraform, CloudBees/Jenkins
  - Hands-on experience with cloud databases such as Amazon
    DynamoDB, Aurora, or Snowflake
  - Experience building data streaming and event-driven
    architectures with Apache Kafka or Apache Flink
  - Experience or strong interest in AI-assisted software
    development and agentic engineering practices

  AI-assisted engineering: Our engineers are expected to use
  AI development tools as a core part of their daily workflow,
  not as a novelty. We expect you to use these tools to
  accelerate delivery, expand your scope, and raise the
  quality bar, while applying strong engineering judgment to
  review, validate, and own everything that ships under your
  name. Comfort with prompting, agentic workflows, and human-
  in-the-loop review of AI-generated code is a baseline
  expectation for this role. AI related Technology:

  - Cursor, Claude Code
  - Python-based AI/ML frameworks and libraries such as scikit-
    learn, pandas, and numpy
  - Deep Learning Frameworks such as PyTorch
  - LLMs and Foundation Models in Bedrock, VertexAI, or similar

  Benefits

  At SailPoint, we empower businesses to take control of
  identity security—and we do the same for our people. Whether
  you're engineering solutions, advising customers, or
  accelerating business growth, you’ll expand your skills,
  collaborate with top talent, and grow with purpose. Benefits
  are dependent upon your country location however SailPoint
  provides:

  - Competitive pay
  - Medical, dental and vision plans
  - Paid Holidays
  - Career and growth opportunities

  SailPoint is an equal opportunity employer and we welcome
  all qualified candidates to apply to join our team.  All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin,
  disability, protected veteran status, or any other category
  protected by applicable law.

  Alternative methods of applying for employment are available
  to individuals unable to submit an application through this
  site because of a disability. Contact
  applicationassistance@sailpoint.com or mail to 11120 Four
  Points Dr, Suite 100, Austin, TX 78726, to discuss
  reasonable accommodations.  NOTE: Any unsolicited resumes
  sent by candidates or agencies to this email will not be
  considered for current openings at SailPoint.
