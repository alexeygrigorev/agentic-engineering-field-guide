description: |
  Role responsibilities

  As a Bubble.io visual developer, you will mainly be
  concerned with the following responsibilities:

  - Building in Bubble accurately and fast.You'll be working
    with a product manager (PM) and a designer for the
    startups that we are developing for. The PM will do the
    initial scoping with the client, but you will be part of
    the process throughout and will have your say on the
    process without worrying about the responsibility of the
    process fully falling on you.Your role is not to just
    follow requirements blindly, but to focus on helping us
    refine them and building such refinements out well so that
    our clients can quickly test out and validate their
    products.
  - Testing and fixing assumptionsWe are continuously working to
    make sure we are making the tools work for us and not have
    us working for the tools. That means, we want to
    continuously re-evaluate how we are using the tools
    properly. You will have a great say on how projects are
    built and designed and what tools we use for that.For
    example, if we end up building something that does not
    work best when implemented with a certain no-code tool,
    you have the freedom to propose and go ahead with what you
    believe is the most efficient way to move forward with.
  - Sharing your wits to build our components libraryWhen a
    project is done, we would love to pick your brain and add
    your best findings in our library. This can be in the form
    of a tutorial or reusable components added to our library.
    You will be paid for this as well.

  Your day-to-day

  Usual tasks you would be taking care of:

  📋 Reviewing the technical scope with the assigned PM for a
  new project.

  🎨 Making designs into sleek responsive Bubble apps.

  🗨️ Checking in with a client weekly to discuss progress and
  priorities.

  🏗️ Building quick tests to decide on the best toolkit and
  approach for a product.

  📦 Add to our components library so that your future work is
  more efficient.

  Reasons to join us

  - We are looking for a self-starter, meaning we will fully
    trust you to craft your own responsibilities and job
    environment. You will be the 9th member of our team.
  - We are at a crucial but good phase where we are receiving
    more project requests than we can take on. That means that
    you will be able to have a say on what you want to work on
    — and we will listen to that.
  - We are all friendly and encouraging people. We can assure
    you that you will be working with understanding people.
  - Our clients want to keep working with us and we are having
    fun doing so. We are sure it will be the same for you and
    you will get to know and network with very accomplished,
    inspiring, and motivational people.
  - We are working to expand Revido into more than an
    agency/studio model and you will be encouraged to join
    such initiatives and have your own stake if you will want
    to.

  Earnings

  This is a full-time role and we will pay you in USD, with a
  base weekly salary of $300-$500 (depending on your
  expertise), which amounts to $1,322-$2,200 per month before
  bonuses. With bonuses, the salary can realistically increase
  by 45%-75% – amounting from $1,917 to $3,850.

  At Revido, it is not uncommon for developers to be promoted
  to Tech Lead or Product Management roles, and pay would
  increase accordingly in those cases.

  How to apply

  If you're interested, please fill out the form below. Please
  do not just send a resume, show us who you are day-to-day
  and share some actual work! Once we have received this
  information, we'll send you a little test challenge.

  🤝 We respect your time, so we expect you to respect ours.

  If you send a full application containing all the necessary
  info (text, Looms, work examples), we will provide a
  thorough reply. However, if you fail to follow the
  application requirements, do not expect us to get back to
  you.

  For any questions, feel free to email join@revido.io.
