  Job Description

  Building trusted markets – powered by our people.

  At Cboe Europe, we inspire our people to solve complex
  challenges together because what we do matters. We provide
  the financial infrastructure that powers the global economy.
  As a leading provider of market infrastructure and tradable
  products, Cboe delivers cutting-edge trading, clearing and
  investment solutions to market participants around the
  world.

  We’re building inclusive ways to support professional and
  personal development while strengthening the trust we’ve
  earned as a global market leader. Our teams are empowered to
  share ideas, actively pursue them and bring on a challenge.
  As champions of internal mobility and access to opportunity,
  we encourage our people to “go for it” and equip our
  managers with the training to coach their teams to the next
  level. Our Associate Resource Groups champion diversity,
  equity and inclusion, giving associates a safe space to
  network, share ideas and create opportunities.

  Sound like the place for you? Join us!

  The Software Engineering team is hiring for a Senior C++
  Software Engineer

  As a Senior Software Engineer within our European business
  at Cboe Europe, you will be part of the team that builds and
  operates the technology for one of the largest pan-European
  equities markets by value traded in Europe.

  Our development teams work closely with the business in
  Europe to develop a deep understanding of the domain, and
  development teams in the US to build innovative products and
  solutions. The team are responsible for all aspects of the
  real time trading system, from Order Handlers, through to
  Matching Engines, out to Market Data and everything in
  between. We pride ourselves on building high-quality, high-
  performance systems, giving our participants the edge they
  need to best execute their strategies.

  Our team is small, so knowledge is shared and there are
  opportunities for everyone to make a real difference. As a
  senior member of the team, you’ll take ownership of features
  end-to-end and help develop those around you, keeping us on
  the track to success.

  In this role you’ll be responsible for:

  - Design, implement and extend high-performance C++
    functionality across our five Equities Trading
    Environments
  - Build performant systems, with a strong focus on quality,
    testability and production readiness
  - Own features end-to-end, coordinating with other engineers
    and business stakeholders from design through to delivery
  - Mentor other software engineers, and act as subject matter
    expert for one or more of our systems
  - Take part in interviewing and evaluating software engineer
    candidates
  - Provide technical support, diagnosing and resolving complex
    production issues
  - Provide support outside of normal working hours as needed

  The ideal candidate has:

  - Significant experience working with modern C++ (C++11 at a
    minimum, C++20 is a plus), including implementing low-
    level, high-performance solutions
  - A track record of taking ownership of features or projects
    from design through to production
  - Experience mentoring or supporting the development of less
    experienced engineers
  - A proactive mindset, strong communication skills, and
    comfort working directly with stakeholders across the
    business
  - Experience working and developing for Linux environments

  You’ll really stand out with:

  - Experience with SQL and relational databases, and Python
  - Exposure to low-latency or real-time trading systems
  - Degree in Computer Science, Electrical Engineering or
    similar fields

  Benefits and Perks

  We value the total wellbeing of our people – including
  health, financial, personal and social wellness. We believe
  standard benefits like health insurance and fair pay are a
  given at any organization. Still, you should know we offer:

  - Fair and competitive salary and incentive compensation
    packages with an upside for overachievement
  - Comprehensive private medical insurance for employees and
    their families which includes dental cover (taxable
    benefit)
  - Cboe pays for employee access to a private GP service (face
    to face or phone call consultations) to make it easy and
    convenient for you to see a doctor
  - Life and long term illness insurance for stability and peace
    of mind
  - EAP - This service intends to help employees deal with
    personal problems that might adversely impact their work
    performance, health and well-being. This service includes
    short-term counselling and referral services for employees
    and their immediate family.
  - Enhanced paid parental and adoption leave to support parents
  - Cboe offers pensions contribution up to 7% of base salary.
    You don’t have to contribute yourself.
  - ClassPass Corporate Membership which provides access to on-
    demand classes, livestream classes, in-person classes and
    wellness sessions across different fitness genres.
    (taxable benefit)
  - 25 days holiday per year per holiday year for full time
    employees, increasing with length of service at a rate of
    one extra day per completed years’ service, up to a
    maximum of 30 days.
  - Discounted Employee Stock Purchase Plan
  - Employee referral bonus program
  - Complimentary lunch, snacks and drinks in any Cboe office
  - Paid tuition assistance and education opportunities
  - Generous charitable giving company match
  - Volunteer opportunities to help you give back to your
    communities

  More About Cboe Europe

  We’re reimagining the future of the workplace by focusing on
  what matters most, our people. Our journey is an inclusive
  one. We’re investing deeply in leadership programs and
  career development initiatives that ensure everyone has an
  equal chance to succeed. We celebrate the diversity in our
  communities, inside and out, and welcome new perspectives
  with equity, inclusion and belonging.

  We work with purpose, solving problems with ingenuity,
  collaboration, and a lot of passion. We’re an engaged and
  excited team connecting markets across borders and embracing
  growth in all its forms to achieve incredible outcomes.

  Learn more about life at Cboe on our website and LinkedIn.

