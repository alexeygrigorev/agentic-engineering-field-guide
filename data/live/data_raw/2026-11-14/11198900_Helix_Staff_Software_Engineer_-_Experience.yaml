description: |
  Who We Are & What We Do

  At Helix, our mission is simple: to help everyone improve
  their lives through their DNA.

  Ready to make a real-world impact with your skills? At
  Helix, we're transforming healthcare by making genomics a
  standard of care. We partner with health systems and life
  science companies to accelerate the integration of genomic
  data into clinical practice. Join us in building a future
  where healthcare is personalized, proactive, and powered by
  genomics.

  What is special about this role?

  The Helix Experience Team builds the software platform and
  user experiences that guide patients and providers through
  their entire genetics journey, from enrollment through
  results delivery. As a Staff Software Engineer, you will set
  the technical direction for this platform and shape
  engineering standards across the organization.

  As a Staff Software Engineer - Experience, you will:

  - Guide and define the strategic technical direction for the
    Experience platform and wider Engineering organization.
  - Shape how Helix Engineering utilizes AI and advance our AI
    development best practices.
  - Direct AI agents to automate entire engineering workflows,
    including codifying our prompt libraries and context
    frameworks.
  - Design, architect, and implement software systems for our
    genomic applications and services, with a focus on the
    patient and provider experience.
  - Drive complex, ambiguous projects from scoping to production
    with autonomy, owning the design, architecture and
    implementation strategy.
  - Collaborate and lead cross-functional work with product
    managers, designers, user experience researchers,
    scientists, and our business leaders to drive meaningful
    outcomes to the business.
  - Shape the engineering standards, delivery practices, and
    quality bars within all of Engineering.
  - Serve as a dedicated technical mentor, helping grow our next
    generation of technical leaders.
  - Champion durable solutions that eliminate entire categories
    of technical debt and raise reliability.

  About you:

  - 10+ years of equivalent professional experience as a
    Software Engineer, with a track record of impact at scale.
  - A strong product engineering mindset, with technical
    decisions anchored in customer and business outcomes.
  - Operates with a high degree of autonomy, identifies problems
    before they're escalated and drives them to resolution
    proactively.
  - Experience implementing and a passion for driving AI
    adoption in engineering workflows, with a proven ability
    to build automated safeguards and evaluations that
    validate AI-generated code at scale.
  - Proficiency with distributed systems built on cloud
    infrastructure such as AWS, GCP, or Azure.
  - Deep full-stack expertise, proficient in a backend language
    such as Go, Java, Python, Scala, or Rust.
  - Familiarity and experience developing and maintaining SPA’s
    on frameworks such as React, Next.js, Vue.js or similar
    using TypeScript/JavaScript.
  - A track record of raising the technical standards and
    practices of engineers beyond your immediate team or
    department.
  - Adaptable in a fast-paced startup environment where
    priorities may change quickly and frequently.

  Pluses:

  - Bachelor’s or Master’s degree in Computer Science or a
    related field.
  - Familiarity with regulated software systems in any industry,
    such as HIPAA, ISO, or FDA.
  - Experience designing and architecting event-driven
    architectures.
  - Experience with AWS serverless infrastructure.
  - Experience in the life sciences, healthcare, or genomics
    domain.

  Expected Interview Process:

  1) Initial Screen 2) Technical Interviews 3) Leadership
  Interviews 4) Offer

  Expected Pay For This Role:

  There are 3 distinct parts to your Helix offer: 1) Base
  Salary 2) Annual Bonus 3) Equity

  - Expected Helix Base:
    - US: $173,000 - $234,500 USD
    - CA: $173,000 - $218,000 CAD
  - Expected Helix Discretionary Annual Bonus: 15% of your
    annual salary
  - Equity: We offer generous equity at Helix. If you receive a
    Helix offer your recruiter will book dedicated time with
    you to educate you on our equity model.

  Aside from working alongside brilliant, dedicated,
  passionate, down-to-earth, curious, warm, and thoughtful
  people, we also provide great benefits:

  - Comprehensive Health Insurance with Date of Hire eligibility
    - Above average employer paid premium coverage
  - 12 weeks Helix Paid Parental Leave option
  - 401(k) with employer matching of up to 3% and 100% Vesting
    on the Date of Hire
  - Comprehensive Well-Being Benefits
  - Flexible PTO
  - Remote options for many roles and a home office stipend

  What To Expect During Your First 90 days:

  - First 5 days: You’ll spend time learning the Helix way,
    completing training and onboarding for your roles, and
    getting introduced to your team and relevant stakeholders.
    You’ll also gain a deeper understanding of our customers,
    our products, the impact we make in the lives of our
    communities, and how to thrive at Helix through
    participation in Helix U.
  - Day 5 - 30: You’ll spend time contributing to projects,
    deeply familiarizing yourself with team and company
    processes, and developing a deeper understanding of
    Helix’s products, services and capabilities.
  - Day 30 - 90: You’ll build your OKRs with your manager, start
    to take ownership of projects and initiatives on your
    team, and begin to demonstrate your impact on the Helix
    mission.

  To learn how Helix collects, uses, and protects your
  personal information during the recruitment process, please
  review our Privacy Notice.

  Helix is proud to be an equal opportunity employer, and
  committed to providing employment opportunities regardless
  of race, religious creed, color, national origin, ancestry,
  physical disability, mental disability, medical condition,
  genetic information, marital status, sex, gender, gender
  identity, gender expression, pregnancy, childbirth and
  breastfeeding, age, sexual orientation, military or veteran
  status, or any other protected classification, in accordance
  with applicable federal, state, and local laws.

