description: |
  About Wintermute

  Wintermute is one of the largest crypto native algorithmic
  trading companies in digital assets. We provide liquidity
  across most cryptocurrency exchanges and trading platforms,
  a broad range of OTC trading solutions as well as support
  high profile blockchain projects and traditional financial
  institutions moving into crypto. Wintermute also has a
  Wintermute Ventures arm that invests in early stage DeFi
  projects.  Wintermute was founded in 2017 and has
  successfully navigated industry cycles. Culturally, we
  combine the best of the two worlds: the technology standards
  of high-frequency trading firms in traditional markets and
  the innovative and entrepreneurial culture of technology
  startups. To Wintermute digital assets is not just another
  asset class, we believe in the innovative potential of
  blockchain, the fundamental innovations, we have a long-term
  view on the digital asset market and are taking a leadership
  position in building an innovative and compliant market. You
  can read more here.

  Working at Wintermute

  We are looking for a Full Stack Engineer who is passionate
  about building products and applications that people find
  useful and enjoy using. At Wintermute you will have an
  opportunity to grow and make a direct impact on trading by
  developing and improving all the parts of the trading
  applications for internal and external users — from the
  interfaces traders and clients work in to the services and
  APIs behind them — while also getting advice and guidance
  from very experienced developers and traders. You will get a
  lot of independence and responsibility right away, and
  you'll learn at an unprecedented speed.

  What will you work on

  This role will involve developing end-to-end applications
  for Wintermute's new trading products and client facing
  portals, as well as internal trading applications and
  oversight/project management of corporate website frontend
  development. You'll own features across the whole stack:
  designing and implementing backend services and APIs,
  modelling and exposing trading and market data, and building
  the frontends on top of them. A great advantage of this
  position is to be part of creating and driving the vision
  for a platform/portal from scratch as well as owning the
  experience across a range of customer lifecycle stages.
  You will work very closely across multiple teams at
  Wintermute, including product, marketing, trading and
  engineering. You’ll have an opportunity to improve your
  knowledge of building high-performance scalable
  applications, understand broader system architecture and to
  understand algorithmic crypto currency trading. We are open
  to experience from both personal and work-related projects.
  Interest in algorithmic trading is a plus.

  Hard Skills requirements:

  - 5+ years of software development experience across both
    backend and frontend.
  - Strong backend engineering skills, with Go and/or Python
    preferred; comfortable designing and implementing
    services, REST/WebSocket APIs and their data models.
  - Solid working knowledge of the frontend stack: JavaScript
    and TypeScript, the Node.js/npm ecosystem, and a modern
    framework — React.js ideally, though experience with a
    comparable one is fine (please feel free to share any
    available examples of applications you built).
  - Experience in client-facing financial or other professional
    services products is preferred but not mandatory (please
    mention products you worked on and their intended target
    users); fintech or crypto domain experience is a plus.
  - Good understanding of the infrastructure applications run
    on: CDN, Cloudflare or similar, web servers, containers,
    CI/CD, plus basic monitoring and logging.
  - Hands-on experience with a major cloud provider, AWS
    preferred (e.g. EC2/ECS, S3, IAM, VPC networking, load
    balancers); infrastructure-as-code such as Terraform is a
    plus.
  - Working knowledge of relational databases and caching,
    including schema design and writing efficient queries.
  - Experience developing secure code end to end: strong
    understanding of common vulnerabilities such as cross-site
    scripting, cross-site request forgery and other OWASP
    risks, along with authentication, authorisation and
    secrets handling, and best practices for testing and
    mitigating them.
  - Solid grasp of frontend-backend integration, including
    asynchronous request patterns and streaming real-time data
    to the browser.

  Here is why you should join our dynamic team:

  - Working at one of the most innovative trading firms
    globally.
  - Engaging projects offering accelerated responsibilities and
    ownership compared to traditional finance environments.
  - A vibrant working culture with frequent team meals, holiday
    celebrations, gaming events, and company-wide outings.
  - A Wintermute-inspired office in central London, featuring an
    array of amenities such as table tennis and foosball,
    personalized desk configurations, a cozy team breakout
    area with games and free food.
  - Great company culture: informal, non-hierarchical,
    ambitious, highly professional with a startup vibe,
    collaborative and entrepreneurial.
  - A performance-based compensation with a significant earning
    potential alongside standard perks like pension and
    private Health insurance.

  Note:

  - Although we are unable to accept fully remote candidates, we
    support significant flexibility in regards to working from
    home and working hours.
  - We offer UK work permits and help with relocation.
