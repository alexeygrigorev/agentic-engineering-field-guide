description: |
  Who We Are:

  At OPENLANE we make wholesale easy so our customers can be
  more successful.

  We’re a technology company building the world’s most
  advanced—and uncomplicated—digital marketplace for used
  vehicles.

  We’re a data company helping customers buy and sell smarter
  with clear, actionable insights they can understand and use.

  And we’re an innovation company accelerating the future of
  wholesale remarketing through curiosity, collaboration, and
  an entrepreneurial spirit.

  Our Values:

  Driven Waybuilders. We pursue challenges that inspire us to
  build, create, and innovate.

  Relentless Curiosity. We seek to understand and improve our
  customers’ experience.

  Smart Risk-Taking. We transform risk into progress through
  data, experience, and intuition.

  Fearless Ownership. We deliver what we promise and learn
  along the way.


  We’re Looking For:

  We are seeking a Software Engineer with strong front-end
  development experience in React and a solid foundation in
  Java Spring Boot backend development. You will be part of a
  high-performing engineering team responsible for building
  intuitive, performant, and scalable applications that help
  modernize inventory management for our customers.

  The ideal candidate is first and foremost a skilled front-
  end developer who cares about user experience, design
  systems, and clean, maintainable code—but also has the
  ability to contribute to backend APIs and services when
  needed.

  You Are:

  - UI/UX-minded. You care about building clean, responsive, and
    accessible interfaces that users love.
  - Full-stack capable. You’re most comfortable in React, but
    you can switch gears to Java Spring Boot when the project
    requires it.
  - Detail-oriented. You take pride in writing clean, efficient,
    and scalable code with a focus on performance and
    reliability.
  - Collaborative. You work seamlessly with designers, product
    managers, and backend engineers to deliver integrated
    solutions.
  - Pragmatic. You balance speed and quality, making thoughtful
    trade-offs to deliver business value quickly.

  You Will:

  - Develop and maintain backend services using Java Spring
    Boot, focusing on building scalable, high-performance APIs
    and microservices.
  - Develop and maintain modern frontend applications, focusing
    on responsive design, accessibility, and seamless user
    experience.

  - Design, implement, and optimize ETL pipelines to ingest,
    transform, and process data from multiple sources
    efficiently.
  - Architect and maintain data storage solutions in PostgreSQL
    or other SQL-based databases, ensuring high availability,
    integrity, and performance.
  - Leverage AWS cloud services to deploy and manage backend and
    data engineering workloads, implementing best practices
    for security, cost optimization, and scalability.
  - Collaborate with frontend and product teams to integrate
    backend services seamlessly with modern UI frameworks
    (React, Angular, Vue).
  - Partner with business stakeholders to identify success
    metrics, develop technical solutions, and support data-
    driven decision-making.
  - Implement monitoring, logging, and automation to improve
    system reliability and efficiency.
  - Troubleshoot and optimize backend performance, ensuring
    seamless data flows and API interactions.
  - Contribute to architecture discussions, best practices, and
    continuous product improvements.

  Who You Will Work With:

  - Reporting to the Software Engineering Manager, this role
    will collaborate closely with frontend developers, product
    managers, data analysts, and DevOps engineers on a regular
    basis.
  - Frequent cross-functional interaction to ensure alignment on
    product goals, performance metrics, and data requirements.

  Must Have’s:

  - 4+ years of hands-on experience with Java Spring Boot,
    including API development, microservices, and performance
    optimization.
  - 3+ years of hands-on experience in modern front-end
    frameworks (React, Angular or Vue), including building
    responsive, user-friendly interfaces.
  - Strong experience with SQL databases (PostgreSQL, MySQL, SQL
    Server), including writing complex queries and database
    optimization.
  - Proven experience building and maintaining ETL pipelines for
    data ingestion, transformation, and storage.
  - Proficiency in AWS cloud services (Lambda, EC2, S3, RDS,
    Athena) and cloud architecture best practices.
  - Strong programming skills in Java, Python, or other modern
    languages for backend and data processing.
  - Experience with CI/CD pipelines, Docker, Kubernetes, and
    DevOps workflows.
  - Excellent analytical and problem-solving skills, with the
    ability to break down complex technical challenges.
  - Strong communication skills and the ability to work
    collaboratively in a cross-functional team.

  Nice to Have’s:

  - Familiarity with data engineering principles such as big
    data, streaming, and event-driven architectures.
  - Experience with data orchestration tools (Airflow, Dagster)
    or real-time data frameworks (Kafka, Spark).
  - Knowledge of security best practices and compliance in
    cloud-based applications.

  Qualified candidates must be legally authorized to be
  employed in the United States. OPENLANE will not provide
  nonimmigrant or immigrant visa sponsorship for this
  employment position.

  What We Offer:

  - Competitive pay
  - Medical, dental, and vision benefits with employer HSA
    contributions (US) and FSA options (US)
  - Immediately vested 401K (US) or RRSP (Canada) with company
    match
  - Paid Vacation, Personal, and Sick Time
  - Paid maternity and paternity leave (US)
  - Employer-paid short-term disability, long-term disability,
    life insurance, and AD&D (US)
  - Robust Employee Assistance Program
  - Employer paid Leap into Service Day to volunteer
  - Tuition Reimbursement for eligible programs
  - Opportunities to expand your skill set and share your
    knowledge across a publicly traded, global organization
  - Company culture of internal promotions, diverse career
    paths, and meaningful advancement

  Sound like a match? Apply Now - We can't wait to hear from
  you!


  Compensation Range of

  Annual Salary: $90,000.00 - $125,000.00

  (Depending on experience, skill set, qualifications, and
  other relevant factors.)
