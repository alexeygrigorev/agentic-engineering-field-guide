  Join Pigment: The AI Platform Redefining Business Planning



  Pigment is the AI-powered business planning and performance
  management platform built for agility and scale. We connect
  people, data, and processes in one intuitive platform, with
  AI agents that work alongside every team, from Finance to
  HR, to build, adapt, and align strategic plans in real time.
  Founded in 2019, Pigment is one of the fastest-growing SaaS
  companies globally, passing $100M in ARR in 2026 and
  doubling revenue for the second year in a row. Industry
  leaders like Unilever, Uber, Anthropic, Snowflake, and
  Siemens use Pigment every day to make better-informed
  decisions and navigate any scenario with confidence. In
  October 2026, we raised a $250M Series E at a $2.3B
  valuation, bringing our total funding to $650M+. Today we’re
  a growing team of 700+ across Paris, London, New York,
  Toronto, San Francisco, and Austin, and we’ve been named a
  Visionary in the Gartner® Magic Quadrant™ for Financial
  Planning Software two years running. At Pigment, we take
  smart risks, celebrate bold ideas, and challenge the status
  quo - all while working as one team. If you’re driven by
  innovation and ready to make an impact at scale, we’d love
  to hear from you.

  We're hiring an Engineering Manager who wants to spend 80%
  of their time writing code, not attending management
  meetings.

  About the role

  Are you an experienced Software Engineer who loves writing
  code, solving complex technical problems and helping other
  engineers become better at what they do?

  At Pigment, our Engineering Managers are engineers first.

  Unlike traditional Engineering Manager positions, this role
  is designed for someone who wants to remain deeply involved
  in building software while taking on meaningful people-
  management responsibilities.

  You'll spend approximately 80% of your time designing,
  coding and shipping production features, with the remaining
  20% dedicated to coaching engineers, running regular 1:1s,
  providing feedback and supporting their development.

  We're particularly interested in Senior Software Engineers
  who have naturally taken on coaching, mentoring or technical
  leadership responsibilities and are ready to develop further
  as people managers.

  You don't necessarily need to have held an Engineering
  Manager title before. What matters most is your technical
  ability, your experience helping others grow and your
  motivation to combine engineering with people leadership.

  You'll join Pigment's Reporting & Collaboration community,
  building sophisticated frontend experiences that help
  customers interact with complex data, configure workflows
  and make better business decisions.



  What you'll do

  - Write, review, refactor and ship production code regularly
    using React, TypeScript and JavaScript.
  - Design and build sophisticated user interfaces for
    interacting with large datasets, including filtering,
    visualisation and complex configuration.
  - Take ownership of engineering tasks and features from
    technical design through implementation, testing and
    deployment.
  - Solve challenging problems involving frontend performance,
    scalability, state management and user experience.
  - Participate in technical discussions, code reviews,
    debugging and architectural decisions.
  - Collaborate closely with Product Managers, Designers, Tech
    Leads and Software Engineers to deliver high-quality
    features.
  - Contribute to AI-powered product experiences and use modern
    development tools where appropriate.
  - Maintain the same technical expectations and engineering
    standards as our Senior Software Engineers.
  - Coach and mentor engineers, sharing technical knowledge and
    helping them improve their problem-solving abilities.
  - Hold regular 1:1 meetings with your direct reports to
    discuss progress, challenges and career development.
  - Provide constructive feedback, recognise achievements and
    support individual development plans.
  - Help engineers establish clear goals and understand the
    skills required to progress.
  - Support performance reviews and development discussions,
    including more challenging conversations when necessary.
  - Work alongside Tech Leads to understand engineers' technical
    contributions and development needs.
  - Help foster a collaborative engineering culture where people
    continuously learn from one another.

