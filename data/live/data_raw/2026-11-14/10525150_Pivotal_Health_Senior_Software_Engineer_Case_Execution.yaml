description: |
  About Pivotal Health

  Pivotal Health is the leading technology platform that helps
  healthcare providers get paid fairly in an increasingly
  complex reimbursement landscape.

  Today, many providers face persistent underpayment from
  health insurance companies, despite delivering high-quality
  care. While processes like IDR (Independent Dispute
  Resolution) were designed to promote fairness, they’re often
  administrative-heavy, time-consuming, and difficult to
  navigate without the right tools.

  Pivotal Health combines software, data, and service into a
  seamlessly integrated, AI-driven platform that simplifies
  these complex reimbursement workflows. We help providers
  efficiently dispute underpaid claims, reduce administrative
  burden, and recover the reimbursement they’re entitled to;
  without adding more work to already stretched teams.

  Our full-service IDR solution is just the starting point.
  We’re building solutions that enable providers to operate
  with clarity, control, and confidence across the
  reimbursement journey.

  About the Role

  We're hiring a Senior Software Engineer to join Pivotal's
  Case Execution team. This team owns critical parts of the
  case execution workflow, including eligibility, batching,
  submissions, ops workflows, and claim orchestration. These
  systems sit at the operational core of how Pivotal delivers
  outcomes for providers.

  This is a strong fit for an engineer who enjoys solving
  complex, workflow-driven backend problems and working
  through data-heavy decision logic. The most technically
  demanding areas for this team are eligibility and batching,
  and the right person is energized by that kind of work
  rather than looking to avoid it.

  What You'll Do

  - Build and improve core case execution systems: Own backend
    development across eligibility, batching, submissions, ops
    workflows, and claim orchestration. These are the systems
    that determine how cases move through Pivotal's platform
    and reach resolution.
  - Tackle complex, data-driven backend problems: Work through
    the decision logic and data-heavy workflows that make
    eligibility and batching hard, understanding not just how
    individual systems work, but how they interact across the
    broader platform.
  - Contribute to workflow orchestration: Build and improve the
    systems that coordinate how cases are staged, routed, and
    executed end to end, with a clear eye toward correctness
    and reliability.
  - Collaborate cross-functionally: Work closely with the
    Integrations team, Case Strategy team, and other
    engineering and product partners to ensure systems are
    well-connected and aligned with how the broader platform
    operates.
  - Contribute to front-end and admin workflows where needed:
    The role is primarily backend-focused, but you'll
    contribute to internal-facing UI and ops tooling where the
    product requires it.

  Who You Are

  - 5+ years of software engineering experience with a strong
    backend focus
  - Strong engineering fundamentals with hands-on experience
    building data-heavy, workflow-oriented systems
  - Experience working on complex, data-driven decision logic or
    orchestration problems: you're comfortable with systems
    where correctness and sequencing both matter
  - Comfortable operating in a collaborative, fast-moving
    startup environment where ownership and requirements
    evolve
  - Python experience; able to work effectively in a Python-
    based backend environment
  - Self-directed and proactive: you identify problems and drive
    them to resolution without heavy oversight
  - Strong communicator who collaborates well across
    engineering, product, and adjacent teams

  Extra Credit If You Have

  - Experience with healthcare-specific data or HealthTech
    systems
  - Exposure to data-heavy architectures or problems adjacent to
    data engineering without being a pure data engineer
  - Familiarity with tools like Snowflake, dbt, or Databricks
  - Some front-end experience to support admin workflow
    contributions

  Why You’ll Love Working Here

  We’re a collaborative, low-ego team on a mission to make
  healthcare reimbursement fairer for providers. While we
  primarily hire around our core hubs–Los Angeles and New
  York–we remain open to exceptional talent outside those
  regions. Remote and hybrid flexibility varies by role and
  team, and is outlined in each job description.

  If you’re excited by solving complex problems and making a
  real-world impact, we’d love to hear from you.

  Benefits Include:

  - Competitive compensation, including equity
  - Full health, dental, and vision coverage
  - Retirement savings plan through 401(k)
  - Flexible time off
  - Opportunities for company-wide connection and events

  Ready to Make an Impact? We’re building something
  meaningful; and we want you on the team.

  Bring your ideas, curiosity, and drive, and let’s transform
  healthcare reimbursement together.

