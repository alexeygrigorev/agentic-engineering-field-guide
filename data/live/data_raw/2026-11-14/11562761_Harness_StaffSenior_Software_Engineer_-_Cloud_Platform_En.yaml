  Position Summary

  As a Staff/Senior Cloud Engineer at Harness, you will play a
  pivotal role in designing, building, and maintaining our
  cloud infrastructure. You will be responsible for ensuring
  the reliability, scalability, and performance of our
  systems, incorporating a blend of Cloud Engineering and Site
  Reliability Engineering (SRE) practices. This role requires
  a strong technical background, a passion for innovation, and
  the ability to work collaboratively in a fast-paced
  environment.

  Key Responsibilities

  Cloud Infrastructure Design & Implementation:

  - Design, build, and manage scalable, secure, and reliable
    cloud infrastructure using GCP, AWS or Azure.
  - Develop infrastructure-as-code using tools such as
    Terraform, CloudFormation, or similar.

  Site Reliability Engineering (SRE):

  - Implement SRE practices to ensure the reliability,
    availability, and performance of cloud services.
  - Develop and maintain monitoring, logging, and alerting
    systems to detect and address issues proactively.
  - Perform capacity planning and demand forecasting to ensure
    system scalability and performance.

  Automation & CI/CD:

  - Deploy, manage, and scale applications using Kubernetes
    (K8s).
  - Utilize Helm for packaging, deploying, and managing
    applications on Kubernetes.
  - Design and implement continuous integration and continuous
    deployment (CI/CD) pipelines to automate the delivery of
    applications and infrastructure.
  - Develop automation scripts and tools to streamline
    operations and improve efficiency.

  Security & Compliance:

  - Ensure cloud infrastructure and applications meet security
    and compliance standards.
  - Implement security best practices and perform regular
    security audits and assessments.

  Collaboration & Mentorship:

  - Collaborate with cross-functional teams including
    developers, product managers, and operations to deliver
    high-quality solutions.
  - Mentor and guide junior engineers, sharing best practices
    and fostering a culture of continuous improvement.

   About You

   Technical Expertise:

  - Bachelor’s degree in Computer Science, Engineering, or a
    related field, or equivalent experience.
  - 7+ years of experience in cloud engineering, site
    reliability engineering, or related roles.
  - Strong experience with cloud platforms (AWS, GCP, Azure) and
    cloud-native services.
  - Proficiency in infrastructure-as-code tools (Terraform),
    Helm package manager and configuration management tools
    (Ansible, Chef, Puppet)
  - Experience with AI-OPS

  SRE Practices:

  - Experience with SRE principles, including error budgets,
    SLIs, SLOs, and incident management.
  - Strong knowledge of monitoring and observability tools
    (Prometheus, Grafana, GCM).

  Automation & DevOps:

  - Expertise in building and managing CI/CD pipelines using
    tools like Jenkins, GitLab CI, CircleCI or Harness
  - Strong coding skills (Python, Go, etc.) and familiarity with
    version control systems (Git).

  Security & Compliance:

  - Understanding of security best practices for cloud
    infrastructure and applications.
  - Experience with compliance frameworks (ISO 27001, SOC 2, PCI
    DSS) is a plus.

  Soft Skills:

  - Excellent problem-solving skills and attention to detail.
  - Strong communication and collaboration skills, with a
    proactive and innovative approach.

