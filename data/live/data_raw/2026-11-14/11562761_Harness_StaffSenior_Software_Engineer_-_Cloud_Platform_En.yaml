  Note on Fraudulent Recruiting/Offers

  We have become aware that there may be fraudulent recruiting
  attempts being made by people posing as representatives of
  Harness. These scams may involve fake job postings,
  unsolicited emails, or messages claiming to be from our
  recruiters or hiring managers.

  Please note, we do not ask for sensitive or financial
  information via chat, text, or social media, and any email
  communications will come from the domain @harness.io.
  Additionally, Harness will never ask for any payment, fee to
  be paid, or purchases to be made by a job applicant. All
  applicants are encouraged to apply directly to our open jobs
  via our website. Interviews are generally conducted via Zoom
  video conference unless the candidate requests other
  accommodations.

  If you believe that you have been the target of an
  interview/offer scam by someone posing as a representative
  of Harness, please do not provide any personal or financial
  information and contact us immediately at
  security@harness.io. You can also find additional
  information about this type of scam and report any
  fraudulent employment offers via the Federal Trade
  Commission’s website (https://consumer.ftc.gov/articles/job-
  scams), or you can contact your local law enforcement
  agency.
