  Nokia Space Networks business focuses on creating customized
  solutions and developing LTE and 5G commercial RAN, Cloud
  and Core products for our customers operating in NTN. NTN
  project is Nokia co-operation with AST Space Mobile company
  that enables innovative, direct-to-mobile over-the-satellite
  communication in 3GPP LTE and 5G standard.

  Responsibilities

  - Work on prototyping and product development of 5G network
    solutions.
  - Support the automation and improvement of software
    development environment and tools.
  - Participate in the design, build, and maintenance of the
    development verification lab

  Qualifications

  You have:

  - BS or MS in computer science or related technical field
  - Programming skills in Python, JavaScript, Bash, C/C++,
    Go/Golang, git, and Linux.
  - Excellent problem-solving and debugging skills.
  - Knowledge of Agile/Scrum development lifecycle and tools.



  It would be nice if you also had:

  - Previous Nokia or Infinera co-op or internship experience.
