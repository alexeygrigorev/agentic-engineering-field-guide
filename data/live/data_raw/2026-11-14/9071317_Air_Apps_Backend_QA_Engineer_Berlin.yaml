description: |
  About Air Apps

  At Air Apps, we believe in thinking bigger and moving
  faster. We’re a family-founded company on a mission to
  create the world’s first AI-powered Personal &
  Entrepreneurial Resource Planner (PRP), and we need your
  passion and ambition to help us change how people plan,
  work, and live. Born in Lisbon, Portugal in 2018 and now
  with offices in both Lisbon and San Francisco we’ve remained
  self-funded while reaching over 100 million downloads
  worldwide.

  Our long-term focus drives us to challenge the status quo
  every day, pushing the boundaries of AI-driven solutions
  that truly make a difference. Here, you’ll be a creative
  force, shaping products that empower people across the
  globe.

  Join us on this journey to redefine resource management and
  change lives along the way.

  The Role

  We are looking for a Backend QA Engineer to help ensure the
  reliability, performance, and scalability of our backend
  systems. In this role, they will focus on testing APIs,
  databases, and backend services while collaborating closely
  with engineers to maintain high-quality standards across our
  infrastructure.

  This is a fully onsite position, based at our office in
  Lisbon, where you will collaborate closely with cross-
  functional teams in person and contribute to a dynamic and
  fast-paced environment. We are open to support with
  relocation efforts.

  The ideal candidate has approximately 2–3 years of
  experience working with backend technologies such as Node.js
  and TypeScript and enjoys combining software development
  practices with quality assurance. They will contribute to
  test design, automation, API validation, and infrastructure
  review while helping maintain a strong quality culture
  within the engineering team.

  Responsibilities

  - Design and execute tests for backend systems, including
    APIs, databases, and service integrations.
  - Validate API functionality and performance using tools such
    as Postman, Swagger, or similar platforms.
  - Test and verify database operations, queries, and data
    integrity in systems using PostgreSQL or similar
    relational databases.
  - Collaborate with engineering teams to review pull requests,
    ensuring code quality and test coverage.
  - Support the development and maintenance of automated tests
    for backend services.
  - Participate in reviewing backend infrastructure and
    identifying potential reliability or performance issues.
  - Document and track defects, test cases, and test results
    using test management tools such as TestRail or similar
    systems.
  - Work closely with developers and product teams to improve
    testing strategies and overall product quality.

  Requirements

  - Approximately 2–3 years of experience working with backend
    technologies, testing, or software development in test
    roles.
  - Experience with Node.js and TypeScript in backend
    environments.
  - Familiarity with SQL databases, particularly PostgreSQL, and
    experience validating database queries and data integrity.
  - Experience testing REST APIs using tools such as Postman,
    Swagger, or similar API testing tools.
  - Understanding of backend testing practices, including API
    testing, database testing, and integration testing.
  - Familiarity with test management tools such as TestRail or
    comparable platforms is beneficial.
  - Comfort reviewing pull requests and backend architecture
    changes to help ensure quality standards.
  - Strong attention to detail, problem-solving skills, and the
    ability to collaborate with cross-functional teams.

  Why Join Air Apps? (Lisbon)

  - Annual Bonus
  - Top-tier Health and Life Insurance for peace of mind.
  - Transportation Budget to support your commute needs.
  - Coverflex benefits package for meal allowances, well-being,
    and more.
  - Urban Sports Club membership to keep you active.
  - Meals 100% free at the office.
  - Pension Fund to support your long-term financial planning.
  - Annual Conference: an opportunity to meet the team,
    collaborate, and grow together.
  - Apple hardware ecosystem for work.

  Diversity & Inclusion

  At Air Apps, we are committed to fostering a diverse,
  inclusive, and equitable workplace. We enthusiastically
  welcome applicants from all backgrounds, experiences, and
  perspectives. We celebrate diversity in all its forms and
  believe that varied voices and experiences make us stronger.

  Application Disclaimer

  At Air Apps, we value transparency and integrity in our
  hiring process. Applicants must submit their own work
  without any AI-generated assistance. Any use of AI in
  application materials, assessments, or interviews will
  result in disqualification.

  Important Notice

  Air Apps does not partner with nor is represented by any
  recruiting agencies, staffing firms, or third-party
  recruiters in connection with our hiring efforts. All
  legitimate communication regarding Air Apps opportunities
  will come exclusively from an official @airapps.com email
  address. Additionally, all open positions are published only
  through our official careers platform, Ashby. If you are
  contacted by anyone claiming to represent Air Apps from a
  different email domain, through a recruiting agency, or via
  a job posting source other than Ashby, please exercise
  caution. We do not accept unsolicited candidate submissions
  from agencies, and any such submissions will not be
  considered.
