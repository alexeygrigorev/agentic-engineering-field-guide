  play.

  PUMA is a global sports brand creating footwear, apparel,
  and accessories that inspire athletes and everyday movers.
  The PUMA Group owns PUMA, Cobra Golf, and stichd, operates
  in 120+ countries, and has around 22,000

  employees worldwide.
