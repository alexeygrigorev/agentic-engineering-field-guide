description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  You will be part of the Consumer Intelligence & Engagement
  organisation responsible for delivering the intelligence and
  engagement capabilities that enable more relevant and
  personalised consumer experiences across digital channels.
  The organisation plays a key role in how consumers discover
  products, engage with content, and elevate experiences
  through membership & loyalty. Through capabilities such as
  personalisation, recommendations, consumer intelligence,
  experimentation, and AI-driven decisioning, the organisation
  helps deliver more contextual, data-driven interactions
  across the consumer journey.

  As a Senior Software Engineer (Full Stack), you will design,
  build, and maintain production-grade backend services and
  web applications that power personalisation and
  recommendation capabilities. You will work closely with Tech
  Leads, AI/ML Engineers, Product Owners, and Data Engineering
  teams to deliver reliable, scalable, and low-latency
  services.

  What you will do:

  - Develop production-grade APIs and service layers that expose
    personalisation and recommendations to consuming
    applications and digital experience layers.
  - Build and evolve web-based applications and user
    experiences.
  - Build model-serving and inference integration layers that
    support real-time and batch recommendation patterns.
  - Implement reliable, scalable, and low-latency services with
    strong focus on resiliency, observability, and
    performance.
  - Work with caching, event-driven processing and distributed
    systems patterns to support high-volume consumer use
    cases.
  - Collaborate with Tech Leads, AI/ML Engineers, Data
    Engineering and Product teams to deliver roadmap
    commitments.
  - Drive technical design discussions and contribute to
    architecture decisions within the team.
  - Ensure applications and services are production-ready
    through effective observability, monitoring, performance
    optimisation, reliability engineering, and operational
    readiness practices.
  - Mentor junior engineers, perform code reviews and help
    establish engineering standards and best practices.
  - Utilise AI-assisted engineering tools to accelerate
    development and strengthen code quality.

  YOUR TALENT

  - 7+ years of experience designing and building scalable,
    resilient, and maintainable microservices and web
    applications in modern cloud environments.
  - Strong hands-on experience with Java and Spring Boot for
    building production backend services.
  - Frontend development experience with React framework
    strongly preferred.
  - Strong understanding of system design and distributed
    architecture.
  - Solid understanding of distributed systems fundamentals
    including concurrency, asynchronous processing,
    idempotency, exception handling and circuit breakers.
  - Strong data structures and algorithms foundation with
    experience applying them to real-world use cases.
  - Experience with event-driven architecture using Kafka or
    similar technologies.
  - Experience with SQL/No-SQL databases with understanding of
    database architecture and distributed data management.
  - Experience integrating LLM APIs into production applications
    will be a strong advantage.
  - Understanding of embedding-based similarity search and
    vector databases is an advantage.
  - Strong ability to mentor engineers, review designs, and
    drive sound technical decisions.
  - Experience using coding agents, LLMs or AI-assisted
    engineering tools to improve software delivery and
    developer productivity.
  - Experience in eCommerce, retail, or consumer digital
    products is preferred.

