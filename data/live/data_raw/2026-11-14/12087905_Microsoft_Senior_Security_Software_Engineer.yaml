description: |
  Overview

  The Cloud & AI organization accelerates Microsoft’s mission
  and bold ambitions to ensure that our company and industry
  is securing digital technology platforms, devices, and
  clouds in our customers’ heterogeneous environments, as well
  as ensuring the security of our own internal estate. Our
  culture is centered on embracing a growth mindset, a theme
  of inspiring excellence, and encouraging teams and leaders
  to bring their best each day. In doing so, we create life-
  changing innovations that impact billions of lives around
  the world. Microsoft is one of the largest enterprise
  service companies in the world.

  Microsoft Red Team (MRT) helps Microsoft anticipate emerging
  threats and strengthen the security of products, services,
  and AI systems. AI is increasingly important to that mission
  as capabilities and threat models evolve. Within MRT, the
  Microsoft AI Red Team identifies risks in Microsoft’s AI
  systems. This role provides the infrastructure support that
  enables engineers, researchers, and red teamers to carry out
  their work.

  We are looking for a Senior Security Software Engineer to
  join the Microsoft AI Red Engineering Team. In this role,
  you will own building and operating secure and reliable
  Azure GPU infrastructure used by our engineers, researchers,
  and red teamers. You will apply hands-on AI engineering to
  deploy, operate, and troubleshoot secure distributed
  training and reinforcement-learning (RL) environments for
  long-running research workloads, working closely with
  stakeholders to understand their needs and translate them
  into scalable infrastructure capabilities.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  In alignment with our Microsoft values, we are committed to
  cultivating an inclusive work environment for all employees
  to positively impact our culture every day.

  Responsibilities

  - Design, deploy, operate, and troubleshoot secure distributed
    AI infrastructure in a reliable and scalable way,
    including multi-node, multi-GPU training and
    reinforcement-learning environments.
  - Build fleet-level automation and infrastructure-as-code for
    remediation, repeatable configuration, and drift
    detection. Turn recurring findings into durable
    engineering fixes that prevent recurrence.
  - Work independently from ambiguous research and
    infrastructure requirements to develop technical designs
    and production-ready solutions.
  - Partner closely with stakeholders to understand their needs,
    clarify requirements, and prioritize the highest-impact
    solutions
  - Drive alignment across engineers, researchers, and partner
    teams on infrastructure architecture, security and
    reliability tradeoffs, dependencies, and delivery.
  - Build and improve automation that enables rapid deployment
    and operation of AI models and supporting infrastructure
  - Build solid relationships with peers through design and code
    reviews, technical collaboration, and mentoring
  - Embody our Culture and Values

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 4+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python OR equivalent experience.

  Other Requirements:

  - - Citizenship & Citizenship Verification:
  - This position requires verification of citizenship due to
    citizenship-based legal restrictions. Specifically, this
    position supports United States federal, state, and/or
    local government agency customers and is subject to
    certain citizenship-based restrictions where required or
    permitted by applicable law. To meet this legal
    requirement, and as a condition of employment, the
    successful candidate’s citizenship will be verified with a
    valid passport.
  - This role will require access to information that is
    controlled for export under export control regulations,
    potentially under the U.S. International Traffic in Arms
    Regulations or Export Administration Regulations, the EU
    Dual Use Regulation, and/or other export control
    regulations. As a condition of employment, the successful
    candidate will be required to provide either proof of
    their country of citizenship or proof of their U.S.
    permanent residency or other protected status (e.g., under
    8 U.S.C. 1324b(a)(3)) for assessment of eligibility to
    access the export controlled information. To meet this
    legal requirement, and as a condition of employment, the
    successful candidate’s citizenship will be verified with a
    valid passport. Lawful permanent residents, refugees, and
    asylees may verify status using other documents, where
    applicable.
  - - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include, but are not limited to
    the following specialized security screenings:
  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft background and Microsoft
    Cloud background check upon hire/transfer and every two
    years thereafter.



  Preferred Qualifications:

  - Experience designing, deploying, and operating cloud
    infrastructure, including distributed, multi-node, multi-
    GPU training environments.
  - Experience developing software and automation for production
    systems.
  - Experience deploying and operating AI infrastructure in
    Azure, including GPU-backed compute, networking, model
    serving, and platforms such as Azure AI Foundry or Azure
    Machine Learning.
  - Experience integrating or operating RL training stacks such
    as SkyRL, verl, or OpenRLHF and agent environments or
    sandbox tooling such as Harbor.
  - Experience with containers, infrastructure-as-code, CI/CD,
    monitoring, and observability.
  - Experience diagnosing GPU, interconnect, or performance
    issues in GPU or high-performance computing (HPC)
    infrastructure.
  - Proficiency writing clean, efficient, and maintainable
    Python code.
  - Understanding of LLM inference, model deployment, and the
    performance, capacity, and reliability requirements of
    large AI models.
  - Experience driving technical projects from ambiguous
    requirements to production, including stakeholder
    alignment and architectural decisions.
  - Experience in cybersecurity, AI security, or red teaming.



