description: |
  At Snowflake, we are powering the era of the agentic
  enterprise. To usher in this new era, we seek AI-native
  thinkers across every function who are energized by the
  opportunity to reinvent how they work. You don’t just use
  tools; you possess an innate curiosity, treating AI as a
  high-trust collaborator that is core to how you solve
  problems and accelerate your impact. We look for low-ego
  individuals who thrive in dynamic and fast-moving
  environments and move with an experimental mindset — who
  rapidly test emerging capabilities to discover simpler, more
  powerful ways to deliver results. At Snowflake, your role
  isn't just to execute a function, but to help redefine the
  future of how work gets done.

  We’re hiring talented Senior Software Engineers for the
  Snowflake Dynamic Tables team in Berlin, Germany. Join us to
  build the next generation data platform that enables
  customers to transform data with declarative SQL while
  maintaining control over cost, latency, and throughput. We
  are looking for strong engineers who are enthusiastic about
  building new cutting-edge technologies, who look forward to
  tackling complex database problems and pick up and
  understand deep technical areas quickly.

  AS A SENIOR SOFTWARE ENGINEER AT SNOWFLAKE YOU WILL:

  - Work with a talented and collaborative team of engineers and
    Product Managers in our globally distributed team to
    define the capabilities and technical designs for Dynamic
    Tables
  - Interact with customers to understand their needs, and
    synthesize those into product and technical roadmaps
  - Have responsibility and authority for driving new
    capabilities and performance improvements from inception
    to landing
  - Build highly reliable and performant software that holds up
    under the reliability and scale demands of the largest
    enterprise customers
  - Analyze and solve performance, correctness, and fault-
    tolerance challenges at scale
  - Ensure operational readiness of the services and meet the
    commitments to our customers regarding reliability,
    availability and performance

  OUR IDEAL SENIOR SOFTWARE ENGINEER WILL HAVE:

  - 5+ years of industry experience designing and building
    distributed data systems
  - 3+ years of experience with internals of query compilers
  - Experience building enterprise-grade, reliable and
    trustworthy software or services
  - Degree in Computer Science or related field
  - Excellent problem-solving skills and strong CS fundamentals
    including data structures, algorithms, distributed
    systems, relational algebra or SQL
  - Adaptive and collaborative – would rather play in a band
    than be a soloist, and looks for opportunities to both
    mentor and learn
  - Strong English communication skills

  BONUS POINTS FOR EXPERIENCE WITH THE FOLLOWING:

  - Direct interactions with enterprise customers
  - Incremental view maintenance / materialized views

  Snowflake is growing fast, and we’re scaling our team to
  help enable and accelerate our growth. We are looking for
  people who share our values, challenge ordinary thinking,
  and push the pace of innovation while building a future for
  themselves and Snowflake.

  How do you want to make your impact?

  For jobs located in the United States, please visit the job
  posting on the Snowflake Careers Site for salary and
  benefits information: careers.snowflake.com
