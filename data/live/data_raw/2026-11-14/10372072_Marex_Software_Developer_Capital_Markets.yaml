description: |
  About Marex

  Marex Group plc (NASDAQ: MRX) is a diversified global
  financial services platform providing essential liquidity,
  market access and infrastructure services to clients across
  energy, commodities and financial markets. The group
  provides comprehensive breadth and depth of coverage across
  four core services: clearing, agency and execution, market
  making, and hedging and investment solutions. It has a
  leading franchise in many major metals, energy and
  agricultural products, with access to 60 exchanges. The
  group provides access to the world’s major commodity
  markets, covering a broad range of clients that include some
  of the largest commodity producers, consumers and traders,
  banks, hedge funds and asset managers. With more than 40
  offices worldwide, the group has over 3000 employees across
  Europe, Asia and the Americas.

  For more information visit https://www.marex.com/

  Job Reference: VN2961

  Overview of Marex / Department description

  Marex has unique access across markets with significant
  share globally both on and off exchange. The depth of
  knowledge amongst its teams and divisions provides its
  customers with clear advantage, and its technology-led
  service provides access to all major exchanges, order-flow
  management via screen, voice and DMA, plus award-winning
  data, insights and analytics.

  The Technology Department delivers differentiation,
  scalability and security for the business. Technology
  provides digital tools, software services and infrastructure
  globally to all business groups. Software development and
  support teams work in agile ‘streams’ aligned to specific
  business areas. Our other teams work enterprise-wide to
  provide critical services including our global service desk,
  network and system infrastructure, IT operations, security,
  enterprise architecture and design.

  The Software Development function creates and maintains
  applications, frameworks and other software components to
  deliver to business requirements. Developers conceive,
  specify, design, engineer, document, test, and deliver bug
  fixes as needed to provide high quality software solutions.
  Each Development team is aligned to one of Marex’s business
  divisions and works with a corresponding Business Technology
  and Application Support team.

  Role Summary As an experienced full-stack software engineer
  specializing in both front-end and back-end development,
  expert in React or C# .NET with React and/or WPF, you will
  take a hands-on and leading role in the ongoing development
  of the Marex Equity Market Making and Trading platform. As
  part of the platform modernisation programme, you will
  contribute to the creation and enhancement of on prem and
  cloud hosted, secure, responsive desktop and web
  applications tailored for front-to-back Market Making and
  Trading technology.

  Your coding expertise and your strong emphasis on quality
  will be instrumental in delivering robust and reliable
  applications. In this role, you will use your architectural
  and devOps experience to help build new solutions in support
  of strategic business initiatives, andinitiatives and mature
  our existing software and efficiently migrate and re-
  platform legacy systems to the cloud, using cloud native
  design patterns. Working closely with the enterprise
  architecture stream and platform engineering team to ensure
  alignment to organisational technology patterns and
  standards, and seamless integration and deployment. You will
  support and advocate for the Marex Agentic AI augmented
  development strategy.

  You will work in close collaboration with the Capital
  Markets – Equities development managers and business
  technology function to align with Marex’ agile ways of
  working; ensure the backlog is correctly prioritised,
  stories are aligned to our definition of ready, the team
  remains delivery focused, and impediments are closed out.

  Responsibilities

  Role specific:

  - Design, code and test all components of modern web
    applications.
  - Contribute to the overall architecture and design of the
    technology created/maintained by the development delivery
    team.
  - Develop solutions to a high standard that is maintainable,
    testable and meets the requirement’s acceptance criteria.
  - Adhere to development best practices and processes.
  - Design and code across proprietary applications and services
    that constitute the Capital Markets – Equities Market
    Making and Trading technology platform
  - Take accountability for the quality of deliverables, and
    assist the wider scrum team in taking accountability for
    theirs
  - Work with platform engineering to automate build and deploy
    of existing and new systems
  - Support the strategic goals of Capital Markets development;
    greenfield initiatives, replatforming and consolidating
    legacy systems, and adopting an automation-first approach
    to delivery and quality control

  All staff:

  - Ensure compliance with the company’s regulatory requirements
    under the FCA.
  - Adhere to the operational risk framework for your role
    ensuring that all regulatory or company determined
    parameters are complied with.
  - Role model for demonstrating highest level standards of
    integrity and conduct and reflecting Company Values.
  - At all times comply with the FCA’s Code of Conduct.
  - Ensure that you are fully aware of and adhere to internal
    policies that relate to you, your role or any other
    activities for which you have any level of responsibility.
  - Report any breaches of policy to Compliance and/ or your
    supervisor as required.
  - Escalate risk events immediately.
  - Provide input to risk management processes, as required.

  Competencies, Skills and Experience Skills and Experience:
  Essential:

  - Engineering: C#, .Net, ASP.Net, React, JS/TS, HTML, CSS,
    SQL, WPF, Linux
  - Tools / Technologies / Infra: NodeJS, cloud/AWS, RabbitMQ,
    AMQ, Mongo, Bitbucket (Git), SQL/Server, Jira
  - Design: API, HTTP/REST, JSON, micro-services and distributed
    systems
  - SDLC: Agile, Scrum, Kanban, DevOps, CI/CD, Automation First,
    BDD/TDD, DORA. Understanding of, and advocacy for, Agentic
    AI / Context Engineering

  Desirable:

  - Engineering: Java, Vue, Angular, .Net Core
  - Tools / Technologies / Infra: Docker, Kubernetes, Kafka,
    Azure, GCP, NoSQL, DNS
  - Design: Serverless, cloud-native/PaaS, event driven,
    pub/sub, real-time/websockets, architectural design
    records (ADRs)
  - SDLC: Agentic AI / Context Engineering; CoPilot, Claude,
    Codex, building custom agents across full SDLC
  - Experience working in a regulated environment and knowledge
    of the risk and compliance requirements associated with
    this.

  Competencies:

  - Excellent verbal and written communication skills
  - A collaborative team player, approachable, self-efficient
    and influences a positive work environment
  - Demonstrates curiosity
  - Resilient in a challenging, fast-paced environment
  - Ability to take a high level of responsibility in a fast
    pace and high-volume environment
  - Excels at building relationships, networking and influencing
    others

  Conduct Rules, You must:

  - Act with integrity
  - Act with due skill, care and diligence
  - Be open and cooperative with the FCA, the PRA and other
    regulators
  - Pay due regard to the interests of customers and treat them
    fairly
  - Observe proper standard of market conduct
  - Act to deliver good outcomes for retail customers

  Company Values

  Acting as a role model for the values of the Company:

  Be collaborative - by working together across the
  organisation, we foster teamwork, can better respond to
  challenges and successfully deliver for our clients

  Act with integrity - we pride ourselves on our honesty and
  high ethical standards. We apply these values when working
  with all our clients, colleagues and other stakeholders

  Be adaptable and entrepreneurial - we embrace change as
  markets evolve to constantly increase our efficiency and
  create innovative solutions for our clients. We are
  interested in the world around us and inquisitive about
  understanding the challenges and opportunities our clients
  face.

  Be respectful – how we treat each other, and our clients
  says everything about who we are. We always act respectfully
  and treat people fairly in everything we do.

  Nurture talent – we aim to grow our own talent and make
  Marex the place ambitious, hardworking and talented people
  choose to build their career. This means giving and taking
  stretch opportunities, taking risks, and committing to
  career development and support – for ourselves, and our
  teams.

  Marex is fully committed to being an inclusive employer and
  providing an inclusive and accessible recruitment process
  for all. We will provide reasonable adjustments to remove
  any disadvantage to you being considered for this role. We
  value the differences that a diverse workforce brings to the
  company.  We welcome applications from candidates returning
  to the workforce.  Also, Marex is committed to avoiding
  circumstances in which the appearance or possibility of
  conflicts of interest may exist within the hiring process.

  If you would like to receive any information in a different
  way or would like us to do anything differently to help you,
  please include it in your application.
