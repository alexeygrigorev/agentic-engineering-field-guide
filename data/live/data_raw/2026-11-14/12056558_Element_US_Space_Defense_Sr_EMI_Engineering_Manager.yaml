description: |
  About Company:

  Element U.S. Space & Defense stands at the forefront of
  testing innovation, serving as a trusted partner to NASA,
  the U.S. Department of Defense, government agencies, and
  prominent industry leaders across the space and defense
  sectors. Founded as NTS Technical Systems, our company
  brings over 60 years of experience and expertise in handling
  the most complex projects and programs in the world.

  From centrifuge testing for the latest Mars rover, vibration
  testing for the Space Launch System (SLS), to environmental
  simulations for next-generation missiles, we are the
  pioneering partner for highly custom, end-to-end testing
  design and implementation. By advancing our state-of-the-art
  testing technologies, subject matter expertise, and service
  to critical missions, Element U.S. Space & Defense has
  become the go-to partner for ground-breaking industries.



  What We Offer:

  Growth & Development:

  - Opportunities for professional development and career
    advancement.
  - A collaborative and innovative work environment.
  - The chance to work on groundbreaking projects that shape the
    future of space and defense.

  Benefits: Employees are eligible to participate in the
  benefits offered throughout their availability, including
  the following:

  - Medical, Dental, Vision, Short- and Long-Term Disability,
    Life Insurance, Flexible Spending Accounts
  - Seven (7) paid holidays and four (4) paid floating holidays,
    depending on your hire date
  - Paid Time Off (PTO), accrued biweekly
  - 401k with employer match
  - Twelve (12) hours of Paid Volunteer Time Off (PVTO) each
    year
  - Tuition reimbursement and other employee programs
  - Flexible schedules offered at some of our labs
  - Monthly Lab Bonus plans (Based on position)

  Salary: At EUSSD, compensation is determined through a
  comprehensive approach that considers candidate
  qualifications, role responsibilities, market benchmarks,
  and organizational needs. Pay may vary by location with
  potential eligibility for bonuses or commission depending on
  the role.

  Summary:

  Element U.S. Space & Defense is a premier provider of
  independent test and evaluation services to the US defense,
  aerospace, and space industries. We offer a comprehensive
  suite of electromagnetic environmental effects test and
  analysis services nationwide. We are seeking an EMI
  Engineering Manager to support our testing operations on a
  full-time basis, permanently located at an off-site location
  in Menomonee Falls, WI. The ideal candidate has extensive
  EMI/EMC testing experience including shipboard and submarine
  power systems qualifications in accordance with MIL-
  STD-461G, and MIL-STD-1399 Section 300.

  The EMI Engineering Manager will fill the role of EMI
  department manager while conducting EMI testing at the WI
  facility, including planning, resource management, test
  execution, and reporting. This role will act as the
  technical liaison between the customer, internal program
  management, and test department operations to ensure smooth
  program execution. It will also be responsible for business
  development and the growth of a new capability with a
  nationwide customer base. This is a senior level role,
  requiring extensive knowledge of EMI testing of high power,
  low and medium voltage conversion equipment including energy
  storage systems. Hands-on experience in developing tailored
  test procedures, and equipment/system level assessment
  methods is an essential skill set for this role. Travel and
  support of broader nationwide EMI initiatives may be
  required.

  Primary Responsibilities:

  - Review customer statements of work and project requirements,
    and develop project plans, schedules, and technical
    documentation as required.
  - Conduct and support EMI/EMC testing of Naval power systems
    and equipment at the high-power EMI facility located in
    Menomonee Falls, WI.
  - Work with customers to develop high technical EMI test
    plans, procedures, and qualification reports in accordance
    with DoD standards and EUSSD quality policies.
  - Manage EMI lab equipment calibration schedule, routine lab
    equipment maintenance, and maintain ISO17025 accreditation
    requirements.
  - Coordinate with cross-functional teams including program
    management, operations, and customer technical POCs to
    meet project objectives.
  - Monitor project progress and resolve issues impacting
    project cost and schedule.
  - Ensure compliance with safety, quality, regulatory, and
    industry standards.
  - Identify project resources, including personnel, equipment,
    and materials and work with program management and
    operations to source and allocate these resources.
  - Seek business development opportunities to grow EMI test
    services at the Menomonee Falls location, leveraging
    internal sales leads, as well as external sales
    opportunities.
  - Prepare and deliver project status reports to stakeholders.
  - Conduct risk assessments (e.g., safety, cost, technical,
    schedule) and implement mitigation strategies.
  - Conduct project close-out activities and post-project
    evaluations.
  - Perform other duties as may be required.

  Minimum Qualifications:

  - BS in electrical engineering or related field required from
    an ABET-accredited program.
  - 8 years of relevant EMI Test and analysis engineering
    experience in accordance with MIL-STD-461G, MIL-STD-464D,
    and MIL-STD-1399.
  - 5 years of experience in a production or technical setting
    with responsibility for guiding engineering activities and
    supporting team workflow.
  - Experience with Microsoft Office Products (Word, Excel,
    PowerPoint, Outlook, etc.)
  - Experience in working in a project team environment.

  Preferred Qualifications:

  - MS in electrical engineering, physics, or related field
    preferred.
  - Extensive experience with operating and developing EMI test
    profiles using EMI test automation software tools such as
    TILE! or BAT-EMC.
  - Extensive experience in writing EMI test procedures and test
    reports in accordance with MIL-STD-461, MIL-STD-1399
    section 300, and MIL-STD-464.
  - Experience in leading and managing a team to solve complex
    engineering problems within schedule and budget
    constraints.
  - Comprehensive understanding of high-power maritime power
    systems including energy storage equipment, including
    design and/or factory acceptance in a production or
    engineering lab setting.
  - 5+ years of experience managing an ISO17025 accredited EMI
    test laboratory.

  Knowledge and Skills:

  - Must be proficient in and compliant with established safety
    rules, code of conduct, and company policies and
    procedures.
  - Willingness and ability to travel as needed to support EUSSD
    test sites, customer interaction, technical meetings, etc.
  - Self-motivated, dependable, and responsible, with the
    ability to work with minimal supervision.
  - Proven track record of managing large-scale engineering
    projects.
  - Excellent problem-solving abilities and critical thinking
    skills.
  - Firm understanding of complex mathematical concepts.
  - Strong time management and analytical skills.
  - Excellent written and verbal communication skills.

  Physical Requirements:

  While performing the duties of this job, the employee is
  occasionally required to stand; walk; sit; climb stairs;
  balance; stoop; kneel; crouch or crawl; talk or hear; taste
  or smell. The employee may occasionally lift and/or move up
  to 25 pounds. Specific vision abilities required by the job
  include close vision, distance vision, color vision,
  peripheral vision, depth perception, and the ability to
  adjust focus.

