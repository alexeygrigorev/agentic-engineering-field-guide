description: |
  Company Description

  Ergodic AI is an AI startup based in London that is building
  an action-oriented AI platform to help enterprises move from
  analysis paralysis to rapid data-driven execution.

  Our AI platform identifies context, surfaces optimal actions
  and justifies the reasons for their execution. We're an
  early stage startup and are already working with multiple
  F500 enterprises.

  We’re supported by top VCs including early backers of
  HuggingFace, to help further our mission and are now on the
  hunt for the brightest and best to join us.

  Our Team

  The founding team is highly experienced across a range of AI
  and commercial work, with careers in world class
  organisations and experience building and exiting $multi-
  million startups previously.

  Process

  As you progress through the process, you’ll meet each of the
  3 founders who will probe you for your motivations,
  experiences and fit for the role.

  Steps:

  - Application / CV screening
  - Interview with CTO
  - Interview with CSO
  - Interview with CEO
  - Decision

  We aim to move quickly through the process and not waste
  your time.

  The Role:

  Founding Full-Stack Engineer – Funded early stage AI Startup
  We’re developing AI systems that go beyond insights – we
  create action.

  This is a rare opportunity to join as our first engineering
  hire. You’ll play a pivotal role in shaping our product,
  tech stack, and engineering culture. We’re looking for a 10x
  engineer – someone with the hands-on skills, creativity, and
  drive to build game-changing technology from the ground up.

  If you’ve built products that scaled to impact thousands (or
  millions) and want to do it again, this is the role for you.

  What You’ll Do

  - Build (very hands-on dev role) and own the full-stack
    architecture – from intuitive front-ends to rock-solid
    back-ends.
  - Drive technical decisions to create a scalable, secure, and
    reliable foundation.
  - Implement and integrate with APIs, webhooks, and third-party
    platforms.
  - Work closely with the founders to shape the product roadmap.
  - Innovate fast, build iteratively, and own your work end-to-
    end.
  - Grow with us – this role is a launchpad to VP of Engineering
    if that's your goal.

  About You

  - You’ve built and launched products at scale in a
    startup/scaleup environment – in enterprise or consumer
    tech.
  - You’re highly skilled in React, JavaScript, and modern
    front-end frameworks, with a design-eye
  - You’ve worked across cloud platforms like AWS, GCP, Azure,
    and Snowflake.
  - You understand database design, APIs, integrations, and the
    fundamentals of building robust systems.
  - You have experience building secure, high-performance
    backend services in Python.
  - You’re hands-on, but you also bring architectural and
    strategic thinking to the table.
  - You thrive in ambiguity and have the drive to build from
    scratch.

  Why Join Us

  - Impact: Be the founding engineer shaping a company and
    product that redefine’s how enterprises act on their data.
  - Growth: Build something from the ground up and grow into a
    VP of Engineering role or remain an expert IC – the choice
    is yours.
  - Collaboration: Work alongside technical founders and an
    ambitious team with deep expertise in AI and analytics.
  - Ownership: Your work will directly shape our success.
