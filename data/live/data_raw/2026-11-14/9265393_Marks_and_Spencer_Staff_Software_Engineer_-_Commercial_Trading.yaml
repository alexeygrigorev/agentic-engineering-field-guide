description: |
  As part of the M&S Software Engineering team, you’ll be
  joining a well-loved historic brand, working on solutions
  that serve millions of loyal customers and thousands of
  colleagues! With ethical values that run right through the
  company’s core and technology leaders that truly understand
  software engineers and engineering, it’s an exciting time as
  we’re redefining ourselves into a digital first and
  engineering-led organisation, with the quality of our
  engineering team being a key differentiator.

  As a Staff Software Engineer in Commercial Trading, your
  expertise will help us on this journey, creating solutions
  for the business that are robust and scalable, with good
  observability and metrics, following best-in-class
  engineering practice.

  Due to high interest, this role may close earlier than
  advertised. We recommend applying as soon as possible.

  Your key accountabilities will include:

  - Lead the architecture, design and delivery of scalable
    software solutions, distributed systems and modernisation
    initiatives that support critical store operations across
    M&S.
  - Provide technical leadership on complex, high-impact
    projects, driving engineering excellence through code
    reviews, deployment optimisation and adoption of
    engineering best practices.
  - Collaborate with stakeholders across Product, Delivery,
    Architecture, Infrastructure and senior leadership to
    deliver solutions aligned to business priorities,
    technology strategy and operational requirements.
  - Drive operational excellence by ensuring high availability,
    observability, resilience and continuous improvement
    across platforms and services.
  - Mentor and coach engineers at all levels, supporting
    capability development, knowledge sharing and fostering a
    high-performing engineering culture.

  Who you are

  Your skills and experience will include:

  - Strong hands-on experience developing enterprise
    applications using Java, Spring Boot, Micronaut, REST
    APIs, microservices architecture and event-driven
    technologies.
  - Proven expertise in modern software engineering practices
    including CI/CD, automated testing, source control and
    DevOps principles, with a strong ownership mindset.
  - Experience designing, deploying and supporting scalable
    cloud-native solutions using Azure, Kubernetes, Docker and
    modern platform technologies.
  - Strong understanding of operational excellence,
    observability, resilience and production support,
    including monitoring, performance optimisation and
    security best practices
  - Excellent leadership, stakeholder management and mentoring
    skills, with the ability to influence technical direction
    and drive continuous improvement across engineering teams.

  Desirable Experience

  Knowledge of the Retail domain, particularly around product
  lifecycle or merchandise and sales planning, is of interest,
  but not a necessity

  Tech stack

  The teams use a variety of technologies, including:

  - Java, Spring, SpringBOOT, Micronaut
  - React, Next.js, Typescript
  - Angular, Azure Cloud
  - Kubernetes, Dynatrace (observability)
  - SQL Server, MongoDB
  - Ignite, Redis

  What’s in it for you

  Working at M&S means being part of something bigger -
  helping to deliver quality, value and service to millions of
  customers every day. We’re inclusive, fast-moving and always
  evolving, with a strong sense of purpose and a focus on
  doing the right thing.

  Here are just a few of the benefits that make working here
  even more rewarding:

  - 20% colleague discount on all M&S products and many third-
    party brands for you and someone in your household,
    available once you’ve completed your probation
  - Competitive holiday allowance with the option to buy more
  - Discretionary bonus schemes linked to your performance and
    ours [*REMOVE THIS FOR RLA/B roles*]
  - Strong pension and life assurance to help plan for the
    future
  - Tailored induction and training to support your development
    from day one
  - Exclusive perks and savings through our M&S Choices portal
  - Market-leading family policies, including parental, adoption
    and neonatal leave
  - 24/7 wellbeing support, including virtual GP access and
    mental health services
  - One paid volunteer day a year to support a cause that
    matters to you

  Everyone’s welcome

  M&S is ready to push boundaries to lead the retail industry
  into a greener, speedier, more inspiring digital era. That’s
  why we’re revolutionising how we work and offering our most
  exciting opportunities yet. There’s never been a better time
  to be part of our team. Marks & Spencer aims to be an
  inclusive organisation, trusted and admired by our
  colleagues, customers and suppliers. Join us and make an
  immediate impact.

  We’re an in-person business and have core collaboration days
  in our Support Centre each week. For most teams, this is 3
  working days where we come together to collaborate,
  innovate, and serve our customers brilliantly.

  We are committed to an active Inclusion, Diversity and Equal
  Opportunities Policy, which starts with our recruitment and
  selection process, and we are happy to talk flexible
  working.

  If you consider yourself to require reasonable adjustments
  to any part of our recruitment process, we invite you to
  share those requirements with us when completing your
  application. We will make every effort to ensure your needs
  are met to provide a fair and transparent process of
  assessment.



