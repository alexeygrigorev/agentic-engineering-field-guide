description: |
  The ideal candidate will have good experience in web
  application UI development, developing backend
  microservices, and event-based architecture. We are happy to
  meet developers with a particular interest in a subset of
  the whole stack but as a cross-functional team we need you
  to have working knowledge of the whole stack.

  We have a microservice web application we use to manage an
  array of our front and middle office systems. This
  application is at the heart of our whole operation. Our
  engineering team works on a full development and operation
  model, we are seeking an experienced full stack developer to
  join that team.

  Key Responsibilities

  - Take ownership of GCP-hosted systems, including
    infrastructure decisions, resource usage and cloud costs.
  - Translate high-level business requirements into reliable
    systems, taking projects from initial scoping through
    development, deployment and ongoing support.
  - Balance business priorities and delivery deadlines with
    technical debt and long-term maintainability.
  - Build and maintain microservice APIs, event-driven services
    and scheduled background tasks.
  - Develop reusable, extensible React components to support a
    maintainable front-end architecture.
  - Write and optimise complex PostgreSQL queries, focusing on
    performance, efficiency and database load.
  - Communicate clearly with non-technical stakeholders to
    understand requirements and explain technical decisions.
  - Maintain system reliability through automated testing,
    logging and monitoring.
  - Use AI development tools to improve delivery speed while
    reviewing and validating generated code.

  Skills, Knowledge and Expertise

  - Strong development experience with TypeScript, JavaScript,
    Node.js, React and Python.
  - Hands-on GCP experience, particularly with Cloud Run,
    BigQuery and Pub/Sub, alongside experience using Airflow
    for workflow orchestration.
  - Strong PostgreSQL skills, including complex queries, query
    optimisation and database performance.
  - Experience delivering reliable applications independently
    from limited initial requirements.
  - A proactive, solutions-oriented approach, with sound
    judgement when balancing business needs and technical
    trade-offs.
  - Experience with version control, collaborative development
    and reliable deployment practices.
  - A Computer Science degree, a related technical qualification
    or equivalent practical experience.

  Desirable Skills:

  - Experience with SCSS.
  - Familiarity with Docker and containerised applications.
  - Experience building and maintaining CI/CD pipelines.
  - Experience developing mobile applications using React
    Native.

  Benefits

  - Salary depending on experience.
  - Annual discretionary performance bonus.
  - Opportunities for career growth in a dynamic and exciting
    industry.
  - Flexible working hours, particularly during the football
    calendar.
  - 25 days holiday per annum, plus UK bank holidays.
  - Private health & dental insurance.
  - Optical cover through Aviva.
  - Pension plan.
  - Gympass membership to over 1900 gyms and wellness
    businesses.
  - Breakfast bought in everyday and lunch bought in twice a
    week
  - Free coffee & snacks at the office.
  - Regular team events & socials.

  About Technology is at the heart of our business and has
  produced consistent and significant results. We are a small
  but rapidly growing team of mathematicians, data scientists
  and software engineers constantly striving to refine our
  world class statistical models while also researching and
  deploying new ones.Our work bridges three domains, each
  challenging in its own right - iGaming, quantitative
  research and software development. This convergence demands
  a rare blend of skills and creativity to identify and
  capitalise on inefficiencies across the iGaming landscape.
  The opportunities are vast, but we are only as good as the
  people we bring on board.As a startup, we offer a dynamic
  and entrepreneurial environment where you’ll work on
  impactful projects and have the autonomy to explore new
  ideas. In-person collaboration and innovation are at the
  heart of what we do, and we are always looking for
  individuals who can contribute their unique perspectives and
  talents to help us stay ahead in a constantly evolving
  industry.At White Swan Data, we recognise that building a
  diverse and inclusive workforce within a highly technical
  field presents both opportunities and challenges. We
  recognise the value that a variety of perspectives can bring
  to innovation, problem-solving, and business success. A team
  composed of individuals from different backgrounds,
  experiences, and ways of thinking fosters creativity,
  enhances decision-making, and ultimately strengthens our
  ability to tackle complex challenges.
