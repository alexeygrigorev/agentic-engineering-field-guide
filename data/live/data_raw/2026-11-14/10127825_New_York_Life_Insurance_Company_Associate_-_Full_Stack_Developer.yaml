description: |
  Location Designation: Hybrid - 3 days per week  We are
  looking for a Developer Engineer (Full-Stack) to join our
  Artificial Intelligence and Data (AI&D) group to implement
  integration solutions for the next generation of cloud-based
  insurance applications. You will be responsible for
  designing, developing, and supporting integration solutions
  across multiple areas of the insurance domain. The ideal
  candidate will have 1+ years of hands-on experience
  developing, testing, and operationalizing API and web
  service-based integration solutions using Agile
  methodologies. What You'll Do:

  - Develop integration solutions using MuleSoft Anypoint
    Platform, Spring Boot, Java, and Python
  - Design and build reusable integration components, services,
    and APIs that adhere to organizational standards and best
    practices
  - Develop and maintain integration flows, APIs, and connectors
    to enable reliable and efficient data exchange between
    systems
  - Integrate with various data sources, including databases,
    web services, messaging systems, and third-party
    applications
  - Develop and maintain microservices using Spring Boot,
    ensuring seamless integration with enterprise platforms
    and services
  - Collaborate with developers and cross-functional technical
    teams to deliver solutions aligned with architectural
    guidelines
  - Participate in code reviews, design discussions, and
    integration testing to ensure solution quality and
    performance

  What You'll Bring:

  - Experience as an Integration Developer or in a similar role,
    with at least 1 year of hands-on experience using MuleSoft
    Anypoint Platform, Java, and related integration
    technologies
  - Experience designing and implementing RESTful APIs
  - Hands-on experience with Java programming
  - Working knowledge of database technologies such as Oracle,
    DynamoDB, PostgreSQL, and AWS RDS
  - Working knowledge of GenAI technologies and LLM API (e.g.
    OpenAI, Claude)
  - Understanding of messaging technologies such as Kafka and
    Amazon MQ
  - Experience using source control and project management tools
    such as Git and JIRA
  - Ability to develop APIs, write unit test cases, and perform
    unit testing
  - Understanding of existing and emerging API standards and
    secure coding practices
  - Strong analytical and problem-solving abilities

  Desired Skills

  - Ability to learn new and emerging technologies and apply
    them to business solutions
  - Strong verbal and written communication skills
  - Detail-oriented with strong analytical and troubleshooting
    capabilities
  - Self-directed, collaborative team player with effective time
    management skills

  Education

  - Bachelor's degree in Computer Science, Information Systems,
    or a related field

  Pay Transparency Salary Range: $66,500-$95,500 Overtime
  eligible: Nonexempt Discretionary bonus eligible: Yes Sales
  bonus eligible: No Actual base salary will be determined
  based on several factors but not limited to individual's
  experience, skills, qualifications, and job location.
  Additionally, employees are eligible for an annual
  discretionary bonus. In addition to base salary, employees
  may also be eligible to participate in an incentive program.
