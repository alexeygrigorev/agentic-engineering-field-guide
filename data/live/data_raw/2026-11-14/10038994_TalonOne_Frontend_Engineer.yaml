description: |
  Talon.One, an Adyen company, is the most powerful incentives
  engine that unifies loyalty, personalized promotions and
  offer management into a single platform. Built for
  enterprise scale and security, Talon.One helps businesses
  design and deliver incentives that drive real customer
  behavior.

  Today, over 300 of the world’s most-loved brands including
  Sephora, Gymshark and Costa Coffee work with Talon.One to
  turn their incentives into a reliable growth engine.

  ABOUT THE TEAM:

  Our development team consists of specialists in frontend,
  backend, QA, product, and more. We work in small cross-
  functional teams that give everybody insight and hands-on
  experience of what everyone else is doing. Each team is
  self-sustained, autonomous, and responsible for a specific
  product area in our platform. We believe strongly in opening
  opportunities for developers to be mentored and grow their
  skills. We are working to make Talon.One an inclusive
  workplace, as we believe it is the right thing to do and we
  want to have a positive impact on the entire tech industry.

  We are looking for a Frontend Engineer to join our team and
  bring their FE expertise to the table. We currently have
  openings across our tribes. You'd be assigned to one of the
  squads within these tribes based on the best fit, and we'll
  walk you through the specifics during the panel.

  Please note that, due to proximity to the team, we are
  looking for professionals located in Berlin.

  ONCE YOU ARE HERE YOU WILL:

  - Be a part of a small cross-functional team where you build
    strong working relationships across the squad (PM,
    designer, fellow engineers)
  - Partner with stakeholders to flesh out requirements,
    translating product ideas into buildable frontend
    solutions and proactively contribute your own feature
    ideas
  - Participate in code reviews and ensure that quality
    standards are maintained, and contribute to frontend best
    practices within the guild
  - Collaborate with our UX team to improve the user experience
    and interface of our product
  - Develop the visual and functional designs at the heart of
    our ReactJS web application

  WHAT WE NEED YOU TO BRING TO THE TABLE:

  - Founded experience with modern web technologies (e.g. React,
    Vue.js, Angular)
  - Understanding REST APIs, and a passion for typed Javascript
    code (e.g. Typescript, Flow)
  - Interest in rich and friendly User Experience and Interfaces
  - Proactive attitude in improving the product, the team, its
    processes and our code base
  - A full-stack attitude. Everybody has their strengths, but no
    piece of the project stands alone
  - A team-first attitude; As a group we strive to leave egos at
    home
  - Big-picture thinking: You collaborate with non-developers to
    clarify requirements and help plan projects, with an eye
    on the overall impact to the business & product
  - Willingness to contribute to an inclusive and diverse team
    and foster open communication
  - Empathy for your colleagues and your customers

  ABOUT THE TECHNOLOGY:

  - TypeScript, React, Redux and CSS modules for our web
    application
  - Google Cloud Platform (Container Engine)
  - PostgreSQL
  - Go for our API & rule engine ("golang" for the search
    engines)
  - Cypress for automated end-to-end testing

  WHAT'S IN IT FOR YOU:

  - A product & engineering team, now part of Adyen, building
    the incentives engine behind some of the world’s biggest
    brands
  - Adyen+, a significant monthly allowance to spend on whatever
    matters most to you and your wellbeing
  - 28 days of paid annual leave
  - €115 monthly commuting allowance when you join us in the
    office 3 days per week
  - 25% employer contribution to your pension
  - Annual all-company gathering at Adyen’s headquarters in
    Amsterdam, plus regional team events throughout the year
  - Opportunity to connect in person at Adyen offices across 29
    locations worldwide
