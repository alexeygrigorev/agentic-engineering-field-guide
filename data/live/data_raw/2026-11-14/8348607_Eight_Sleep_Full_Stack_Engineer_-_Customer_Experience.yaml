description: |
  Join the Sleep Fitness Movement

  At Eight Sleep, we’re on a mission to fuel human potential
  through optimal sleep. As the world’s first sleep fitness
  company, we’re redefining what it means to be well-rested
  and building the most advanced hardware, software, and AI
  technology to make it possible. Our products power peak
  mental, physical, and emotional performance by transforming
  every night of sleep into a personalized, data-driven
  recovery experience.

  We are trusted by high performers, professional athletes,
  and health-conscious consumers in over 30 countries
  worldwide. Recognized as one of Fast Company's Most
  Innovative Companies in 2019, 2022, and 2023, and twice
  named to TIME's “Best Inventions of the Year.” We operate
  like a high-performance team: fast, focused, and motivated
  by impact. We don’t just ship; we iterate, refine, and
  obsess over the details that help our members sleep better
  and wake up stronger.

  Every role at Eight Sleep is a chance to create cutting-edge
  technology, collaborate with world-class talent, and help
  shape a future where sleep isn’t passive - it’s a powerful
  tool for living better. If you’re tired of the ordinary and
  driven to build at the edge of what’s possible, this is your
  moment. Join us and lead the movement that’s transforming
  how the world sleeps and what we’re all capable of when we
  wake up.

  High Standards. No Apologies

  We operate with intensity because our mission demands it. At
  Eight Sleep, we bring the same mindset as the world’s top
  performers: focused, relentless, and always pushing to be in
  the top 1% of our craft. Think Kobe Bryant’s mamba
  mentality, applied to bold ideas, next-gen tech, and
  flawless execution. This isn’t a 9-to-5. We’re a team that
  puts in the extra effort, not because it’s required, but
  because we care about the impact of our work. We’re here to
  build fast, push limits, and deliver without compromise. If
  you thrive under pressure and want to do the most meaningful
  work of your career, you’ll feel right at home. If you’re
  looking for something easier – this isn’t it.

  The Role We are looking for a Full Stack Engineer to be the
  technical backbone of our Customer Experience (CX)
  transformation. You will build tools, integrations, and
  monitoring systems that enable our AI agents and human
  support team to resolve customer issues faster and more
  effectively. This is a unique opportunity to work at the
  intersection of AI, customer experience, and software
  engineering - building solutions that directly impact
  hundreds of thousands of customers.

  How you’ll contribute

  - Create the integrations, AI tools, and MCP servers that give
    our AI agents secure, scope access to the tools needed to
    ensure customers have a world class experience
  - Own the design and development of AI systems and tools that
    find and fix issues for customers
  - Develop monitoring systems and dashboards to track AI
    performance and surface insights about customer issues
  - Identify automation opportunities across the support team's
    troubleshooting flows
  - Collaborate with Software, Hardware, ML, and Operations
    teams to reduce the time to root cause and resolve issues,
    as well as prevent issues from happening again

  What You'll Need to Succeed

  - 5+ years of full stack engineering experience (Python,
    TypeScript/JavaScript, SQL)
  - Strong ability to work independently and unblock yourself -
    you don't wait for others to solve problems
  - Experience building tools, integrations, or automation
    systems - you must have built systems that use AI and used
    AI to build systems.
  - Strong Product and UX sense - there’s nothing worse than
    lousy internal systems
  - Ability to leverage and orchestrate AI coding assistants
    effectively - you'll be expected to use Claude, Devin, and
    similar tools daily
  - Strong debugging skills and the ability to dive deep into
    complex technical issues
  - Excellent communication skills to work across engineering,
    product, operations, and CX teams
  - Comfort with ambiguity and the ability to define structure
    in a fast-moving environment
  - Experience with customer support, SRE, or building chatbots
    is a plus
  - Experience writing and implementing post mortems (or COEs)

  And...

  - You’re excited about the health and fitness technology space
    and the opportunity to measurably improve lives
  - You have the desire to make an outsized impact as part of a
    rapidly growing, dynamic team
  - You are willing to roll up your sleeves and use whatever
    language or framework will best help you get the job done
  - You love thinking about things from the customer’s
    perspective and trying to understand what motivates and
    drives decision making
  - You have side projects outside of work that you’re excited
    to tell us about

  Please note that applications will not be reviewed if you do
  not meet this criteria.

  Why join Eight Sleep?

  Innovation in a culture of excellence

  Join us in a workplace where innovation isn’t just
  encouraged - it’s a standard. Our flagship product, the Pod,
  is a testament to our culture of excellence, beloved by
  hundreds of thousands of customers worldwide. At Eight
  Sleep, you will be part of a team that continuously pushes
  the boundaries of technology in sleep fitness.

  Immediate responsibility and accelerated career growth

  From your first day, you’ll take on substantial
  responsibilities that have a direct impact on our core
  business and product success. We are a small team that
  empowers you to own your projects and see the tangible
  effects of your efforts, enhancing both your professional
  growth and our company’s trajectory. Your path will be
  challenging but rewarding, perfect for those who thrive in
  fast-paced environments aiming for high standards.

  Collaboration with exceptional talent

  Work alongside other bright minds like you: at Eight Sleep
  exceptional intelligence and a passion for breakthroughs are
  the norms. Our team members are not only experts in their
  fields but also avid innovators who thrive in our dynamic,
  fast-paced environment.

  Equitable compensation and continuous equity investment

  We extend equity participation to every full-time team
  member, recognizing and rewarding your direct contributions
  to our success. This includes periodic equity refreshments
  based on performance, ensuring that as Eight Sleep grows and
  succeeds, so do you – perfectly aligning your achievements
  with the broader triumphs of the company. Pay grows rapidly
  as you accumulate experience with Eight Sleep and translate
  it into concrete impact.

  Your own Pod - and other great benefits

  Every Eight Sleep employee receives the very product that
  defines our mission: a Pod of their own. If you join us
  you’ll get your own Pod, along with other benefits. Learn
  more at eightsleep.com/careers

  At Eight Sleep we continually celebrate the diverse
  community different individuals cultivate. As an equal
  opportunity employer, we stay true to our values by ensuring
  everyone feels they can flourish and grow. We are committed
  to equal employment opportunities regardless of race, color,
  ancestry, religion, sex, national origin, sexual
  orientation, age, citizenship, marital status, disability,
  gender identity or Veteran status.
