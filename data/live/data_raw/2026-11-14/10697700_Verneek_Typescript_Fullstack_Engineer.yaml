  of the company.

  RESPONSIBILITIES

  - Contribute to both front-end and back-end development
    projects

  Requirements

  MINIMUM QUALIFICATIONS

  - 3+ years of experience in building high-performance
    applications
  - Strong proficiency in TypeScript
  - Strong proficiency in React
  - Strong proficiency in NextJS
  - Portfolio of prior projects with a complex backend
  - Work authorization in the USA at the time of hire
    (continuing work authorization during employment can be
    sponsored by Verneek)

  PREFERRED QUALIFICATIONS

  - 4+ years of experience in designing, implementing, and
    maintaining complex software
  - Good grasp of computer science fundamentals, including
    algorithms
  - Experience with machine learning systems and working with AI
    teams

  At Verneek, we value diversity and believe that diverse
  perspectives lead to innovative solutions. We encourage
  candidates from all backgrounds, regardless of gender
  identity, race, color, religion, sexual orientation,
  national origin, veteran status, or disability, to apply.

  Benefits

  Stellar medical, dental, vision, disability, and life
  insurance

  Daily private Chef lunch, curated to personal diets

  Transportation Benefits

  401K matching contributions Flexible PTO

  Visa/Green Card Sponsorship Career growth support through
  sponsoring learning opportunities and mentorship

  Salary range: 80K-140K
