description: |
  - Create/update maps, guidelines and profiles using Edifecs
    tools such as EDIFECS SpecBuilder, Map Builder, EAM as per
    functional logic.
  - Create maps and guidelines (xml, DFF, PFF) for Healthcare
    EDI transactions like 837, 834, 835, 820 transactions.
  - Responsible for design, development, and implementation of
    Edifecs solution.
  - Excellent understanding of technical and business challenges
    relating to EDI product upgrades.
  - Able to configure the Edifecs tools, and understand systems
    integration, application, technical behavior, and business
    / technical requirements.
  - Experience with Edifecs Healthcare 9.x suite, and Healthcare
    Payer systems.
  - Detailed understanding of EDI Healthcare transaction sets,
    e.g. 270/271, 820, 834, 837 I/P/D, 835.
  - Knowledge of software development / implementation
    processes.
  - Able to explain technical solutions and fixes to
    stakeholders.
  - Responsible for any configuration changes in XEngine
    configuration files for any TP specific validation.
  - Responsible for monitoring and troubleshooting the
    transmissions in Edifecs Transaction manager.
  - Must fit in the Agile development environment.
  - Configure Severity files to perform custom error validation.
  - Coordinate with other application teams and provide needed
    support to QA team.
  - Experience with development of Groovy Script.

  This position services as an expert technical and industry
  resource to management, clients and development staff in new
  uses of information technology in all phases of major system
  and subsystem development. Provides consultation on internal
  and industry IT technical and business domain process
  capabilities including leadership in the identification and
  recommendation of new IT opportunities and business
  operations as it relates to application development.
  Formulates, contributes to, and directs task identification,
  work effort estimates, and work schedules for research,
  prototype, and proof-of-concept IT activities. Directs and
  participates in all aspects of development tasks including
  data management, application architecture and business
  architecture. Provides guidance to staff on complex
  assignments and mentors on new technologies.

  - Develops guidelines for other software engineers that helps
    them build and implement code that is scalable, stable and
    secure.
  - Acts as a hands-on software engineer who can write quality
    code, assists with problem solving, root cause analysis,
    trouble shooting and coaching.
  - Understands big picture from a business standpoint within
    the context of the application.
  - Writes technical blogs and be active in Open Source
    Community.
  - Agile, DevOPS and Cloud:
  - Applies Design Thinking techniques on application design.
  - Leads agile software development efforts as a Technical
    Leader.
  - Coaches other software engineers on practices such as TDD,
    ATDD and pair programming.
  - Understands advanced concepts of Containers, Micro-Services,
    Continuous Delivery and Continuous integration, and guide
    the team to setup a DevOps environment for the
    applications they build and support.
  - Designs and develops highly scalable applications in AWS
    cloud using tools like Cloud Formation Templates, EC2,
    SWF, ELB, Lambda, S3, RDS/Dynamo DB and others.
  - Reviews and takes actions based on application metrics,
    including but not limited to code quality, business
    metrics and performance metrics.
  - Creates load and performance testing strategy and perform
    advanced performance tuning.

