description: |
  The Senior Technical Consultant, participates in all aspects
  of the software development lifecycle - estimating,
  technical design, implementation, documentation, testing,
  deployment and support - and pairs hands-on engineering with
  team leadership. Working alongside solution architects and
  developers, the Senior Technical Consultant interprets
  wireframes and creative designs into functional requirements
  and subsequently into technical design, then builds the IVR,
  routing and agent-facing applications that carry the
  client's member and provider contact volume,.

  Responsibilities

  - Ensures deliverables are of highest quality to promote
    client satisfaction
  - Demonstrated contact center delivery experience - IVR,
    routing and agent-facing applications built and taken to
    production on a modern contact center platform
  - Independently manages assigned tasks; works on initial
    quality without requiring excessive reviews by other team
    members
  - Demonstrated ability to leverage AI tools to enhance
    productivity, streamline workflows, and support data-
    informed task execution. Familiarity with AI-enhanced
    platforms is a plus.
  - A solid understanding of AI capabilities and limitations
    including ethical considerations is expected.
  - Facilitates detailed design, development, and
    unit/integration testing utilizing appropriate
    methodologies, technology, and tools
  - Practices strong configuration management and version
    control
  - Produces client deliverables including detailed design
    documentation, unit test plans, and well-documented code
  - Takes on new technology concepts or proofs of concept with
    minimal oversight by using previous experience and self-
    managed learning
  - Actively mentors junior-level developers for delivery,
    quality, and accuracy of stories
  - Understands business and technical requirements on each
    engagement; facilitates communication and appropriate
    solution design
  - Uses AI code-assist tools to improve development velocity
    and quality; applies AI for automated testing,
    documentation generation, and code review
  - Mentors teammates on effective AI tool use within project
    delivery contexts

  Qualifications

  - 3-6 years experience in delivery
  - Understands the technical challenges and possible solutions
    associated with the pursuit
  - Demonstrates a broader understanding of the technologies
    required to get different projects into production
  - Expert in 2-3 different core technology areas
  - Has a broad understanding among all Software Development
    Lifecycle phases and technical depth on a few areas
  - Interactive Voice Response (IVR) systems - call flow design,
    prompts, DTMF and speech input, self-service containment
  - Contact center routing and queueing - skills-based routing,
    queue and priority design, overflow handling
  - Computer telephony integration (CTI) with CRM and case
    management systems
  - JavaScript (ES6+) and front-end services
  - React and Redux
  - Node.js
  - Cloud architecture on Amazon Web Services
  - AWS Lambda and serverless application design
  - Amazon DynamoDB
  - Amazon CloudWatch - logging, metrics, dashboards and
    alerting
  - RESTful API design, integration and documentation
  - Twilio: Studio, TaskRouter, Flex and Functions
  - Twilio Flex agent desktop customization and plugin
    development
  - TypeScript
  - Other cloud contact center platforms (Amazon Connect,
    Genesys Cloud, NICE CXone)
  - Conversational AI and natural language understanding (Amazon
    Lex, Google Dialogflow, or equivalent)
  - Contact center and speech analytics

