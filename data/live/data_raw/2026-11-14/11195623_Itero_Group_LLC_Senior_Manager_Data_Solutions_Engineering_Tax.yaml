description: |
  About us

  Itero Group is a Women-Owned Small Business focused on
  simplifying complex transformations. We empower clients in
  the private and government sectors to become more optimized,
  digitally enabled, and data-driven organizations through our
  comprehensive business consulting and innovative delivery
  solutions. Itero Group's dedicated team members are
  experienced thought leaders, tenacious workers, and creative
  thinkers. We hire people who are passionate about being
  catalysts for change - in our company, for our clients,
  throughout our career- and we empower people to express
  their ideas, create better practices, innovate better
  products, and become better professionals. We have been
  named a Great Place to Work for six years, and offer a
  competitive salary and benefits package.

  Itero Group is seeking an experienced Senior Manager, Data
  Solutions Engineering - Tax & Accounting to support
  enterprise data modernization initiatives for leading
  Financial Services clients. This individual will serve as a
  hands-on technical lead, designing and optimizing cloud-
  based data solutions while providing day-to-day leadership,
  mentoring engineers, and helping drive successful delivery
  across complex client engagements.

  The ideal candidate combines deep hands- on experience with
  Snowflake, Databricks, SQL, Python, and enterprise data
  engineering with the ability to lead and mentor technical
  teams, manage priorities and deliverables, and work directly
  with client stakeholders. Experience with accounting, tax,
  finance, or related enterprise platforms is highly
  desirable.

  Key Responsibilities

  - Lead the design, development, and implementation of client
    solutions using Snowflake and Databricks.
  - Serve as a hands-on technical lead, contributing directly to
    development while providing technical direction, guidance
    and mentoring to other team members including engineers.
  - Lead, mentor, and coach data engineers, providing guidance
    on solution design, development standards,
    troubleshooting, and engineering best practices.
  - Help manage team priorities, technical assignments,
    deliverables, and dependencies to ensure work is completed
    efficiently and on schedule.
  - Review code and technical designs and provide constructive
    feedback to improve quality, scalability, and
    maintainability.
  - Build and optimize ELT/ETL processes to ingest and transform
    data from multiple complex enterprise systems.
  - Work with large volumes of complex structured, semi-
    structured, and log data to identify patterns,
    troubleshoot issues, determine root causes, and develop
    faster and more efficient solutions.
  - Proactively identify performance bottlenecks and inefficient
    processes and recommend opportunities for automation,
    optimization, and improved processing speed.
  - Develop dimensional data models, data marts, and curated
    analytical datasets.
  - Optimize Snowflake and Databricks solutions for performance,
    scalability, reliability, and cost.
  - Implement data quality, lineage, governance, and security
    best practices.
  - Develop solutions utilizing Snowpark, stored procedures,
    streams, tasks, and dynamic tables where appropriate.
  - Partner directly with business and technology stakeholders
    to understand complex reporting, accounting, tax, and
    analytical requirements and translate them into scalable
    technical solutions.
  - Build reusable data frameworks supporting Accounting, Tax,
    Finance, Risk, Compliance, Treasury, and Regulatory
    Reporting.
  - Develop automated orchestration using Airflow, Azure Data
    Factory, AWS Glue, or similar technologies.
  - Lead or actively participate in solution design sessions,
    sprint planning, backlog grooming, technical reviews, and
    other Agile ceremonies.
  - Communicate technical issues, risks, recommendations, and
    delivery status clearly to both technical and non-
    technical stakeholders.

  Required Qualifications

  - 8+ years of Data Engineering experience, with demonstrated
    progression into a technical lead, team lead, or
    engineering management role.
  - 4+ years of hands-on Snowflake development experience.
  - Hands-on experience developing and supporting Databricks
    solutions.
  - Demonstrated experience leading and mentoring data engineers
    or technical delivery teams.
  - Experience managing technical workstreams, including
    priorities, assignments, dependencies, deliverables, and
    technical quality.
  - Ability to remain hands-on technically while providing
    leadership and oversight to a team.
  - Strong SQL expertise, including complex query development
    and optimization.
  - Strong Python development experience.
  - Experience building enterprise ELT/ETL pipelines.
  - Demonstrated experience analyzing and troubleshooting large,
    complex datasets and application/system logs.
  - Strong ability to identify root causes, performance
    bottlenecks, and opportunities to develop faster, more
    efficient data solutions.
  - Experience with cloud platforms including Azure and/or AWS;
    GCP experience is a plus.
  - Experience with dbt, Airflow, Git, and CI/CD; Terraform
    experience preferred.
  - Experience working with structured and semi-structured data.
  - Strong knowledge of data modeling, including Star Schema,
    Snowflake Schema, and Kimball methodologies.
  - Experience with REST APIs and enterprise data integration.
  - Strong troubleshooting, performance tuning, and problem-
    solving skills.
  - Experience working with accounting, tax, finance, or related
    enterprise platforms and datasets strongly preferred.

  Financial Services Experience

  Candidates should possess experience supporting one or more
  of the following:

  - Banking
  - Commercial or Investment Banking
  - Capital Markets
  - Asset or Wealth Management
  - Insurance
  - FinTech

  Experience supporting Accounting, Tax, Finance, Treasury,
  Risk, or Regulatory Reporting platforms and processeswithin
  complex enterprise environments is highly desirable.

  Leadership & Management Experience

  - Demonstrated experience leading, mentoring, and developing
    technical team members.
  - Ability to provide technical direction while empowering
    engineers to independently solve problems.
  - Experience managing multiple priorities and coordinating
    work across technical teams.
  - Ability to identify skills gaps, provide coaching, and raise
    the overall technical capabilities of the team.
  - Experience reviewing technical designs and code and
    establishing engineering standards and best practices.
  - Ability to manage delivery expectations, escalate risks
    appropriately, and help keep projects on schedule.
  - Comfortable operating as both a technical leader and hands-
    on engineer.

  Consulting Experience

  - Experience working within a Big Four or similar consulting
    environment strongly preferred.
  - Demonstrated ability to lead technical workstreams within
    complex client engagements.
  - Experience working directly with client stakeholders and
    senior leadership.
  - Ability to gather requirements from business stakeholders,
    including accounting, tax, finance, and technology teams.
  - Experience leading client workshops and solution design
    sessions.
  - Ability to translate complex business and data challenges
    into practical, scalable technology solutions.
  - Excellent verbal and written communication, presentation,
    and stakeholder management skills.

  If you are looking for a role where you will lead with
  integrity, create and innovate, inspire excellence, be a
  respected member of the team, drive results, and have fun,
  we look forward to connecting with you!

  Benefits at Itero Group At Itero Group, we’re proud to offer
  a comprehensive benefits package designed to support your
  health, financial well-being, and work-life balance:

  - Health & Wellness: Medical (BC-BS), dental, and vision plans
    to suit your needs.
  - Paid Time Off: Generous PTO, paid holidays, and increasing
    PTO based on years of service.
  - Retirement Savings: 401(k) plan with company match and auto-
    enrollment.
  - Company-Paid Coverage: Short-term and long-term disability,
    life insurance, and AD&D insurance.
  - Additional Options: Voluntary benefits including pet
    insurance and student loan assistance up to $1,000
    annually.
  - Perks: FSAs, HSAs, wellness programs, and more to enhance
    your work-life balance.

  Join us and enjoy a benefits package designed with you in
  mind!

  Itero Group is an equal opportunity employer and does not
  discriminate against any employee or applicant because of
  race, age, sex, color, physical or mental disability,
  religion, sexual orientation, marital status, national
  origin, veteran status or political affiliation.
