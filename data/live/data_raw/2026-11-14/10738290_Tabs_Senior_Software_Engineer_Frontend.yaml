description: |
  Tabs is the AI Operating System for Revenue, built for
  modern finance and accounting teams. It combines deep
  revenue and accounting expertise with the agents and
  applications needed to run revenue work end to end. Tabs
  understands customer and contract context, applies
  accounting logic, and executes critical workflows with built
  in controls, auditability, and human oversight. With Tabs,
  finance teams can move from manually managing revenue
  workflows to directing outcomes while the system executes
  the work.

  About the Role

  Tabs is seeking a Senior Software Engineer to join our
  Frontend Platform team. We’re building a design system and
  component-izing our library to define a simple and scalable
  way that teams and agents can build and add new features
  quickly. As a member of our early-stage startup, you’ll have
  the opportunity to shape the direction of the company and
  make a meaningful impact on our success. This team not only
  owns, but drives, the user and developer experience for our
  frontend platforms.

  How We Work

  - We work hard. Two-week sprints, weekly ship goals, short
    feedback cycles. Built around intra-month product
    releases.
  - We work smart. Get in front of the customer, use both data
    and customer feedback to drive decisions, while keeping
    the bigger picture in mind.
  - We work together. In-office culture with people you want to
    work with. Lots of whiteboard space. Expense coffee,
    lunch, and dinner when in the office.

  What You'll Do

  - Participate in full life-cycle software development from
    inception to maintenance in production
  - Work closely with other engineering teams and internal
    stakeholders to identify and drive improvements to the
    internal and external use experiences
  - Design and implement highly scalable and reliable systems
  - Contribute ideas for new features and identify areas for
    improvement proactively
  - Aid in building our engineering organization

  About You

  - 5-8 years of professional engineering experience
  - Experience building platform services from scratch, while
    being resourceful in a constrained-resource environment
  - Experience with TypeScript, JavaScript, React, Node.js,
    Next.js and other similar web development frameworks.
  - Strong desire for learning and staying up to date with the
    latest advancements in software engineering
  - Strong foundation in computer science and applied AI coding

  Location: NYC, 5 days onsite

  Perks and Benefits (Full-time Employees)

  - Competitive compensation and equity
  - Unlimited PTO
  - Up to 100% employer covered monthly healthcare premium
    (medical, dental, vision)
  - Lunch provided via Sharebite, plus dinner for any later in
    office days.
  - Parental leave up to 12 weeks
  - Tax free commuter and parking benefits
  - Voluntary insurances (Life, Hospital, Critical Illness,
    Accident)
  - Employee Assistance Program (Rightway)
  - Free One Medical Membership
  - 401k

  Tabs is an equal opportunity employer. We welcome teammates
  of all identities and do not discriminate on the basis of
  race, ethnicity, religion, gender identity, sexual
  orientation, age, disability, veteran status, or any other
  protected characteristic. We’re committed to creating an
  environment where everyone can grow, contribute, and feel
  comfortable being themselves.
