description: |
  Who we are 🚀

  Heritage is building the Modern Investment Office,
  supporting some of the most prominent families globally to
  achieve their capital enhancement and preservation goals.

  Our vision is to help clients build enduring wealth across
  generations by combining institutional-grade investment
  sourcing with personalized portfolio construction, cutting-
  edge technology, and deep sector expertise. We aim to make
  sophisticated private market opportunities and modern wealth
  solutions more transparent, connected, and actionable.

  Our team comprises of a diverse international group of
  individuals from leading organisations and with diverse
  backgrounds, including private equity, venture capital,
  banking, software development, law, and entrepreneurship. We
  are committed to attracting top-notch talent and providing
  opportunities for growth and development based on their
  individual strengths and interests.

  Your role 💻

  As a Senior Software Engineer, you will be part of the
  Engineering organization that is responsible for designing
  and developing all our user-facing products as well as the
  back-office tools and the automation and integration
  mechanisms that accelerates the efficiency and the scale of
  our business model.

  You will work closely with our CTO, Federico Feroldi, and
  other senior members of our internal engineering
  organization, to discuss ideas and solve complex multi-
  disciplinary problems with innovative technical solutions.
  (where we value innovative solutions)

  You will 🧰

  - Develop solutions in collaboration with stakeholder groups
    and other developers;
  - Implement a best-in-class experience for our users across
    stakeholder groups;
  - Empower advisors with stronger tools, data, and insights;
  - Develop automations for internal processes to enable
    efficiency and sustainable growth;
  - Enhance and extend the use of third party systems as part of
    a unified, scalable technology ecosystem.

  You may be fit for this role if you💪

  - Have 5+ years of industry front-end and/or back-end
    development experience, building, running, and debugging
    web applications using modern JS/TS frameworks (desired
    experiences: React, Node.js (Fastify), GraphQL, Functional
    Programming).
  - Have a passion for performance and API design.
  - See the advantages in functional programming and strive to
    use it in your everyday work.
  - Have an appreciation for the importance of good
    documentation – internal and external.
  - Have a high level of attention to detail, especially around
    performance, reliability, and security.
  - Prefer simple solutions and designs over complex ones.
  - Have previous experience in the FinTech field (but it’s not
    mandatory)
  - Enjoy working with a diverse group of people with different
    areas of expertise. Engineering works closely with a
    variety of teams: Sales and Operations to better
    understand our customers’ needs, Legal and Accounting to
    understand how global policies influence our financial
    infrastructure, etc...
  - Have a growth mindset and love learning.
  - Is fluent in English both written and verbally.

  Your Benefits & Compensation🔥

  - Heritage engineering team was born in a remote-only setting
    and, therefore, we remain a fully flexible organization.
    Join us remotely or in one of our offices in Milan and
    London.
  - Meet the team at fun off-sites once or twice a year.
  - Diversity is at our core: we represent 10+ nationalities and
    counting.

  Process 📅

  CV screening > Introductory call with HR > Interview with
  CPO > Technical assessments > Interview with CTO > Interview
  with COO > Offer

  At Heritage, we are proud to have a diverse team
  representing over 15 nationalities, with all communication
  conducted in English. We are deeply committed to providing
  equal opportunities and work actively to remove potential
  biases in our hiring process by involving a Hiring Committee
  in all decision-making.

  By applying to this job offer, you confirm that you have
  read and understood Heritage's privacy policy:
  http://bit.ly/privacypolicy121.
