description: |
  About Farsight AI

  Farsight is the agentic AI platform for financial services,
  currently helping investment banks and private equity firms
  fully automate entire, highly nuanced workflows. Today,
  institutions will spend 80% of their time gathering
  information for and creating first drafts of materials by
  hand before iterating on and refining their decks, models,
  and pitches.

  Farsight not only gives them that time back to focus on what
  is important, but we also bring new insights and knowledge
  to their materials that they wouldn’t be able to uncover
  without the help of our financial-focused AI.

  Our Team

  Our team has had a wide range of experience that uniquely
  equips us to capture this massive opportunity. Our team
  comes from leading financial institutions like Evercore,
  General Atlantic and Menlo Ventures, supercharged by
  scalable engineering and AI skills from companies including
  Amazon, Hugging Face and the MIT Media Lab. We've learned
  the ins and outs of building successful startups with a team
  of former founders and founding engineers. We focus on
  hiring the best so that we can become the best, so we hope
  you apply!

  We are entirely based in Manhattan, New York City, and are
  in-person 4 days a week (except Fridays, which are remote).

  Job Description

  Farsight operates at the cutting-edge of AI to deliver
  human-like work within some of the world’s largest, and most
  critical, financial organizations. We have an extensive
  backlog from customer demand along with immense
  opportunities for product innovation. As such, we require
  someone that will not only ship features but will also move
  the ball forward towards a unified and expansive platform
  offering.

  You will have full ownership of projects that you will have
  to design, implement, and deploy at scale in a highly fluid
  and fast-paced startup environment. While you will have to
  create clean, efficient, and ready-for-change software, you
  will also have to listen to customer feedback, prioritize
  work streams, and gauge quality of outputs with a critical
  lens. On the software side specifically, your work will
  range from longer-term research projects to bug fixes alike
  - all of which crucial to our company’s success.

  Farsight is a highly collaborative environment where you and
  your highly motivated, passionate team members will
  continuously be working together to create new technology
  and applications that deliver the robust, accurate, market-
  changing solutions that our customers have come to expect.

  Desired Qualifications

  - 4+ years of full-time software engineering experience
  - Deep knowledge and experience with building full-stack,
    user-friendly applications ready for scale
  - Experience with Typescript, Python, and cloud-based
    infrastructure like AWS
  - Strong interest in learning and understanding generative AI
    technology and the current, rapidly evolving landscape
  - Experience working in unstructured environments, where you
    took full autonomy in delivering projects from conception
    to deployment
  - You are intrinsically motivated and self-critical of your
    work, two aspects that are important for rapid innovation
    on a lean team
  - Are able to effectively communicate with and collaborate
    with a growing team
  - Bring a positive and fun attitude to the workplace!

  Above and Beyond Qualifications

  - Former early engineer or founder at a fast-growing startup
  - Previous AI research and/or interactions with AI systems,
    including utilizing closed-source models, fine-tuning and
    spinning up open-sourced models, etc.
  - Deep understanding of scalable system design, performance
    optimization, and resilience engineering
  - Extensive front-end experience in tandem with some
    experience in UI / UX design work
  - Previous experience interacting with customers and receiving
    customer feedback
  - Have leadership experience in a technical position

  Compensation & Benefits

  - Base salary ranges between $170,000 and $200,000 annually
    depending on level of experience of the applicant.
  - Equity: Meaningful early-stage package with standard vesting
    (4 year / 1-year cliff)
  - Comprehensive medical, dental and vision insurance
  - Unlimited PTO

  Equal Opportunity

  Farsight is proud to be an Equal Employment Opportunity and
  Affirmative Action employer. We do not discriminate based
  upon race, religion, color, national origin, sex (including
  pregnancy, childbirth, or related medical conditions),
  sexual orientation, gender, gender identity, gender
  expression, transgender status, sexual stereotypes, age,
  status as a protected veteran, status as an individual with
  a disability, or other applicable legally protected
  characteristics. We also consider qualified applicants with
  criminal histories, consistent with applicable federal,
  state and local law.
