description: |
  Alkami is the digital sales and service platform provider
  for U.S. banks and credit unions. Our unified Platform
  integrates onboarding, digital banking, and data and
  marketing—each solution can stand alone, but together they
  deliver more—to help institutions onboard, engage, and grow
  relationships. As the future shifts toward Anticipatory
  Banking, we help data-informed bankers meet the moment with
  technology that drives action.

  Founded in 2009, we continue to be recognized for our
  intentional culture and tremendous growth (Best Place to
  Work in Fintech; Best & Brightest to Work For Nationally;
  and Comparably’s Best Company Culture, Best Career Growth,
  Best Engineering Team, and Best Places to Work in Dallas,
  among others). We’re building a culture where each Alkamist
  can perform to their highest potential, and we’re always on
  the lookout for the best and brightest minds. If you’re
  ready to experience the power of alchemy - transforming the
  ordinary into the extraordinary - come join one of the
  fastest growing SaaS companies in the U.S.

  As a remote-first company, most of our positions can be
  remote in the US, except for key roles, which will be
  indicated in the Job Title.

  Follow us on Glassdoor and LinkedIn!

  Build the core experiences of both bank administrators and
  bank customers. The includes crafting streamlined user
  flows, building robust APIs, and integrating with third-
  party software like Plaid or Sendgrid.

  About You:

  ● You love writing clean, thoroughly documented, and well-
  tested code, with an eye for long term viability and
  performance.

  ● You measure twice and code once when writing features,
  placing an emphasis on error-handling, logging, and edge
  cases for every service you write.

  ● You enjoy the challenge of breaking down complex product
  asks into elegant solutions.

  ● You are comfortable and experienced with system design,
  and not only have architectural opinions but are comfortable
  writing, speaking, and advocating for them.

  ● You approach architectural challenges not with answers but
  with questions, and from those questions decide upon the
  best approach, knowing that there is no best solution, only
  different sets of tradeoffs to be made.

  ● You enjoy providing technical guidance, suggestions, and
  code reviews for your teammates, using your knowledge to
  raise the bar of their work as well.

  We Are Looking For:

  ● 6+ years professional experience with front end
  technologies (JavaScript, React, Vue, etc.)

  ● Exposure to backend services (NodeJS, NestJS)

  ● Well versed with REST APIs

  ● Experience working in an agile SCRUM environment

  ● Well versed with domain driven design

  ● Well versed with Microservice architecture

