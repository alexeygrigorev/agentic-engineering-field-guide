description: |
  Get to Know Us

  Horizon3 is a fast-growing, remote cybersecurity company
  dedicated to the mission of enabling organizations to
  proactively find, fix and verify exploitable attack vectors
  before criminals exploit them. Our flagship product, the
  NodeZeroTM platform, delivers production-safe autonomous
  pentests and other key assessment operations that scale
  across the largest internal, external, cloud, and hybrid
  cloud environments. NodeZero has been adopted by
  organizations of all sizes, from small educational
  institutions to government agencies and Global 100
  enterprises. It is used by IT Ops/SecOps teams, consulting
  pentesters, and MSSPs and MSPs.

  We are a fusion of former U.S. Special Operations cyber
  operators, startup engineers & operators, and formerly
  frustrated cybersecurity practitioners. We're committed to
  helping solve our common security problems: ineffective
  security tools and false positives, resulting in alert
  fatigue, blind spots, "checkbox” security culture,
  cybersecurity skills shortage, and the long lead time and
  expense of hiring outside consultants. Collectively, we are
  a team of learn it alls, committed to a culture of respect,
  collaboration, ownership, and results.

  What You’ll Do

  As a Senior Backend Engineer on the Admin Experience team,
  you’ll build the services and APIs that let NodeZero
  customers administer their organizations securely. The work
  spans user access, parent-child account relationships,
  account settings, and administration capabilities such as
  roles, access controls, and audit logs. You’ll own
  substantial features from technical design through rollout
  and production support, applying sound data modeling and
  authorization practices to multi-tenant workflows. You’ll
  collaborate with Product, frontend engineers, and partner
  teams to make administration capabilities reliable,
  understandable, and consistent across the platform.

  Responsibilities

  - Design, build, and operate backend services and APIs for
    user access, account hierarchies, settings, and
    administration workflows.
  - Own features from design and implementation through tests,
    safe rollout, observability, and production support.
  - Apply secure authorization and data-modeling practices to
    customer and parent-child account relationships.
  - Investigate production issues and improve service
    reliability, performance, and observability.
  - Write and review maintainable code, automated tests, design
    documentation, runbooks, and support guidance.
  - Partner with Product, frontend engineers, and adjacent
    platform teams to deliver cohesive customer workflows.
  - Mentor teammates through design discussions, code reviews,
    and collaborative problem solving.

  What You’ll Bring

  - Ability to own complex work end to end, manage competing
    priorities, and communicate risks and tradeoffs early.
  - A customer- and security-conscious approach to designing
    administration and access workflows.
  - Strong analytical and problem-solving skills, attention to
    detail, and commitment to high-quality production
    software.
  - Clear technical writing and effective collaboration with
    Product and engineering partners
  - Interest in sharing knowledge and helping other engineers
    grow.

  Required Education / Experience

  - Bachelor’s degree in Computer Science, Computer Engineering,
    or a related field, or equivalent practical experience.
  - 7+ years of professional software engineering experience
    building production software with a modern programming
    language.
  - Experience designing and operating backend services and
    APIs, and taking complex work from design through
    production.
  - Strong SQL and relational database experience, including
    data modeling and debugging or improving queries.
  - Experience building services on a cloud platform such as
    AWS, GCP, or Azure and working with Docker or other
    containerized applications.
  - Demonstrated focus on testing, production reliability,
    observability, and clear technical communication.
  - Experience with every listed language or framework is not
    required; depth in relevant areas and the ability to learn
    are important.

  What Sets You Apart?

  - Experience with multi-tenant SaaS, RBAC, SSO, audit logs,
    delegated administration, or account hierarchy models.
  - Experience with Python or Go, PostgreSQL, GraphQL,
    Kubernetes, and CI/CD.
  - Familiarity with feature flags, metrics, tracing, alerting,
    and tools such as Datadog, Prometheus, or OpenTelemetry.
  - Experience in cybersecurity or building customer-facing
    platform capabilities used by multiple

  Travel Required

  We are a fully remote company, and this job may require up
  to 5% of travel to be successful.

  Compensation and Values

  At Horizon3, we believe that our people are our greatest
  asset, and our compensation philosophy reflects this core
  value. We are committed to fostering an environment where
  all employees feel valued, respected, and rewarded for their
  contributions. Our compensation structure is designed to be
  fair, competitive, and transparent, ensuring that every team
  member is recognized and compensated equitably across roles,
  levels, and locations.

  In accordance with various State’s transparency regulations,
  we provide the following salary range information for this
  position:

  - Base salary range $199,000 - $235,000 annually. The exact
    salary will be determined based on the selected
    candidate’s location, qualifications, experience, and
    relevant skills.
  - Additional compensation: All full-time roles are eligible
    for an equity package in the form of stock options.

  Perks of Horizon3

  - Inclusive Team: We value diversity and promote an inclusive
    culture where everyone can thrive.
  - Growth Opportunities: Be part of a dynamic and growing team
    with numerous career development opportunities.
  - Innovative Culture: Work in a collaborative environment that
    encourages creativity and out-of-the-box thinking.
  - Hybrid & Remote Work: We embrace a mix of remote and hybrid
    work models depending on role and location, including our
    Chicago office, where some roles require regular in-office
    presence.
  - Competitive Compensation: We offer competitive salary,
    equity and benefits. Our benefits include health, vision &
    dental insurance for you and your family, a flexible
    vacation policy, and generous parental leave.

  You Belong Here

  Horizon3 is not just an equal opportunity employer - we are
  a community that values diversity, equity, and inclusion as
  fundamental principles of our culture and success. We are
  dedicated to fostering a workplace where everyone feels
  welcome and respected, regardless of race, color, religion,
  sex, national origin, age, disability, veteran status,
  sexual orientation, gender identity or expression, genetic
  information, marital status, hair length or any other
  legally protected status by law.

  Our commitment to diversity and inclusion means we strive to
  attract, develop, and retain a workforce that reflects the
  varied communities we serve. We believe that diverse
  perspectives drive innovation and strengthen our ability to
  create cutting-edge cybersecurity solutions. At Horizon3,
  every team member is valued and supported in an environment
  that encourages personal and professional growth.

  We welcome candidates from all backgrounds and experiences,
  and we encourage all qualified individuals to apply. Come be
  a part of Horizon3, where your unique contributions are
  recognized, and your potential is limitless.

  Other Duties

