description: |
  Company Description

  Experian is a global data and technology company, powering
  opportunities for people and businesses around the world. We
  operate across a range of markets, from financial services
  to healthcare, automotive, agribusiness, insurance, and many
  more. Experian invests in people and new advanced
  technologies to unlock the power of data. We have an amazing
  team of 25,200 people in 32 countries.

  Job Description

  We are looking for a Backend Senior Software Engineer to
  help design, build, and operate backend systems. Reporting
  into our Engineering Director, you will work on production
  software used by customers and partners, and your work will
  have an impact on the reliability, usability, and evolution
  of our platform.

  Responsibilities:

  - You will own the full Software Development Lifecycle, from
    understanding requirements and contributing to design
    decisions through to implementation, testing, deployment,
    monitoring, and production support.
  - Design, build, and operate backend services, including APIs,
    integrations, reporting, and data-focused systems.
  - Collaborate closely with Engineers, Product, and Data
    Scientists to shape solutions and support data-driven
    product capabilities.
  - Manage systems in production, including monitoring,
    debugging, and continuous improvement.
  - Deliver changes frequently and safely, balancing speed with
    high quality and reliability.
  - Communicate technical decisions and trade-offs clearly to
    both technical and non-technical stakeholders

  Qualifications

  - Solid backend experience using Python in production and
    experience building and running backend systems end to
    end.
  - Experience building and operating systems on AWS.
  - Experience practising Test Driven Development (TDD) and a
    strong appreciation for automated testing.
  - Experience with pair programming or other collaborative
    development practices.
  - The ability to explain technical concepts and trade-offs
    clearly to different audiences.

  Additional Information

  Benefits include

  - Hybrid-based role 40% office base
  - Great compensation package and discretionary bonus plan
  - Core benefits include pension, BUPA healthcare and more
  - 25 days annual leave plus bank holidays

  Our uniqueness is that we celebrate yours. Experian's people
  first, inclusive and purpose driven culture is multi award-
  winning; World's Best Workplaces™ 2025 (Fortune Global Top
  25), Great Place To Work™ in 26 countries to name a few.
  Check out Experian Life on social or explore our Careers
  Site to understand why. Experian is also proud to be an
  Equal Opportunity and Affirmative Action employer. If you
  have a disability or special need that requires
  accommodation, please let us know at the earliest
  opportunity.

