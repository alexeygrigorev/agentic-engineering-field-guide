description: |
  This is a remote position.



  Join a collaborative engineering team building and enhancing
  an active telemedicine platform that enables patients and
  clinicians to access, manage, and deliver healthcare
  services across the United States.



  Organization: Confidential client in digital health /
  telemedicine; the name will be shared with shortlisted
  candidates before the client interview unless the client has
  explicitly requested continued confidentiality













  Our client is looking for a Senior Software Engineer to help
  build, enhance, and scale its telemedicine platform. In this
  role, you will develop across the full technology stack,
  contribute to architectural and technical decisions,
  collaborate closely with Product, Design, and Quality
  Engineering, and help deliver reliable, accessible
  experiences for both patients and clinicians.



  You will work in a highly collaborative Scrum environment
  alongside Software Engineers, Quality Engineers, Product
  Managers, and other cross-functional partners.

   About the organization


  Our client is a digital health organization operating an
  active telemedicine platform serving patients across all 50
  U.S. states. The platform includes a Patient Dashboard,
  where patients interact with the care team, and a Clinician
  Dashboard, which enables the care team to view, manage, and
  communicate with patients.



  The engineering team is focused on continuously improving
  the platform, building new integrations, delivering
  intuitive user experiences, and maintaining a high standard
  of software quality and reliability.

   What you will do


  - Design, develop, and maintain high-quality software across
    the full technology stack using React, TypeScript, Python
    (Flask), and PostgreSQL.
  - Own features and technical work from development through
    deployment and launch.
  - Participate actively in the Scrum process, including
    planning, estimation, design, development, code reviews,
    testing, and defect resolution within two-week sprints.
  - Translate business requirements and product needs into well-
    defined technical tasks and implementation plans.
  - Build and maintain integrations with external platforms and
    partners.
  - Develop accessible, intuitive web components using React,
    with a strong understanding of HTML and CSS.
  - Write and maintain unit and integration tests to validate
    functionality and prevent regressions.
  - Review and improve existing code and technical designs to
    increase efficiency, maintainability, and reliability.
  - Identify and manage technical risks associated with larger
    projects and complex changes.
  - Apply appropriate software design patterns to organize and
    solve complex engineering problems.
  - Participate in and lead technical design reviews and peer
    code reviews.
  - Create technical specifications, documentation, and
    validation plans for new and modified functionality.
  - Collaborate with Product and Design teams to translate UI/UX
    concepts into intuitive, production-ready interfaces.
  - Partner with Quality Engineers to ensure product
    requirements are consistently validated and delivered.
  - Identify opportunities to improve engineering processes and
    establish repeatable software development patterns.
  - Break larger technical initiatives into manageable tasks and
    support team members in planning and execution.
  - Investigate and resolve significant software defects and
    production issues.
  - Mentor and support other engineers, helping to raise the
    technical capabilities of the wider team.
  - Explain complex technical concepts, trade-offs, and impacts
    clearly to non-technical stakeholders.













    Requirements

  - 5+ years of professional software engineering experience,
    preferably in a product-focused engineering environment.
  - Strong hands-on experience with React, TypeScript, Python,
    and PostgreSQL, or closely related technologies.
  - Demonstrated ability to take ownership of a feature or
    project through the full development → deployment → launch
    lifecycle.
  - Strong software engineering fundamentals, including design
    patterns, testing, debugging, code quality, and
    maintainability.
  - Experience designing and implementing integrations with
    external systems or platforms.
  - Experience conducting and contributing to code reviews and
    technical design reviews.
  - Ability to work effectively with larger areas of a codebase
    and make changes while maintaining system reliability.
  - Ability to break complex technical problems and larger
    initiatives into clear, manageable tasks.
  - Strong written and verbal communication skills, including
    the ability to explain technical concepts to non-technical
    stakeholders.
  - Ability to work collaboratively within a Scrum / Agile
    environment alongside Engineering, Product, Design, and
    Quality teams.
  - A strong ownership mindset and the ability to independently
    drive work from requirements through delivery.
  - Experience mentoring or supporting other software engineers.

   Helpful, but not essential


  - Experience working in healthcare, digital health,
    telemedicine, or other regulated technology environments.
  - Experience working with AWS.
  - Experience building applications that handle sensitive user
    or patient information.
  - Experience with accessibility-focused web development.
  - Experience working with distributed or remote engineering
    teams.
  - Experience contributing to engineering process improvements
    and establishing reusable development patterns.

   How the engagement works


  Contracting party: [You will contract directly with Apricot,
  which will manage contracting, invoicing/payroll, payments,
  and administrative support / You will contract directly with
  the client, which will manage these items]. Day to day, you
  will work with the client's engineering team and report to
  the designated engineering manager or team lead.



  For a consultant/contractor engagement, your work will be
  based on the agreed scope and deliverables. You are expected
  to provide your own laptop and basic equipment, maintain
  reliable connectivity and a secure working environment, and
  follow required security controls, including two-factor
  authentication.



  Any client-provided specialized equipment, leave, stipend,
  wellbeing benefit, or other support will be stated
  separately as an approved exception.



  If you contract through Apricot, planned check-ins are
  [month 1 and month 3 / other approved cadence] to see how
  the engagement is working and help address issues.

   About Apricot


  Apricot is a nonprofit sourcing firm connecting displaced
  and underserved professionals from Palestine and the wider
  MENA region with global employment opportunities. We combine
  a clear social-impact mission with fast, high-quality
  recruitment delivery for international clients.
