description: |
  Role Overview







  We are hiring Front-End Engineers to build fast, accessible,
  and consistent user experiences. You will work closely with
  designers and back-end teams to deliver polished interfaces
  backed by a shared design system.







  Key Responsibilities







  - Build and maintain responsive web interfaces using HTML,
    CSS, and React (Angular experience is also valued).







  - Integrate front-end applications with back-end services and
    REST APIs, handling CORS and authentication flows
    correctly.







  - Implement real-time features using WebSockets.







  - Optimize performance and meet Core Web Vitals targets (LCP,
    INP, CLS).







  - Contribute to and consume the company design system,
    building reusable, well-documented components.







  - Use Node.js tooling for builds, bundling, and lightweight
    services.







  - Ensure accessibility, cross-browser compatibility, and
    responsive behavior.







  - Participate in code reviews and collaborate with QA on
    testability.







  Required Qualifications







  - 5+ years of front-end development experience.







  - Strong HTML5, CSS3, and JavaScript/TypeScript skills.







  - Production experience with React; working knowledge of
    Angular.







  - Experience with API integration, CORS, and WebSockets.







  - Practical knowledge of web performance and Core Web Vitals.







  - Experience working within a design system or component
    library.







  Preferred Qualifications







  - Experience with Node.js and modern build tooling.







  - Knowledge of accessibility standards (WCAG).







  - Experience with front-end testing frameworks.




  Compensation, Benefits and Duration



  Minimum Compensation: USD 65,000 Maximum Compensation: USD
  165,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post.
