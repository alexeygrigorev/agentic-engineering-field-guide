description: |
  About Artian

  Artian AI is building agentic AI automation for financial
  services. Our platform enables reliable, autonomous AI
  agents to execute business-critical workflows across
  regulated enterprise environments.

  We are an in-person team in New York, building at the
  intersection of AI, enterprise software, workflow
  automation, and financial services. We move with urgency,
  take ownership, communicate transparently, and care deeply
  about doing excellent work. We are looking for people who
  are grounded under pressure, learn quickly, earn trust with
  teammates and customers, and want to help define how AI
  agents are deployed safely and effectively in the
  enterprise.

  About the Role

  Artian AI is looking for a Software Engineer - Backend to
  help build the platform infrastructure behind our agentic AI
  automation product. You will work on the services, APIs,
  data models, orchestration systems, integrations, and
  reliability foundations that enable AI agents to operate
  inside enterprise financial-services environments.

  This role is ideal for an engineer who enjoys building
  production software, cares about reliability and clean
  abstractions, and wants to work closely with AI, product,
  and customer-facing teams to ship meaningful functionality
  quickly.

  What You’ll Do

  - Build backend services, APIs, workflows, and platform
    primitives for Artian’s AI automation platform.
  - Design systems for orchestration, state management,
    permissions, observability, and integration with
    enterprise systems.
  - Work closely with AI/ML engineers to expose model and agent
    capabilities through robust production services.
  - Build secure, scalable data flows across customer workflows
    and internal platform components.
  - Improve platform reliability, performance, testing,
    deployment, and developer velocity.
  - Collaborate with product and solutions engineering to turn
    customer requirements into reusable platform capabilities.
  - Debug and resolve issues across the stack in a fast-moving
    production environment.

  What We’re Looking For

  - Strong Python engineering skills and experience building
    backend systems in production.
  - Experience designing APIs, services, data models, queues,
    jobs, workflow engines, or distributed systems.
  - Familiarity with databases, cloud infrastructure,
    observability, testing, and deployment practices.
  - Ability to write clean, maintainable, well-tested code.
  - Strong product sense and an interest in building systems
    that customers rely on.
  - High ownership, clear communication, and comfort operating
    in ambiguity.

  Nice to Have

  - BS in Computer Science or a closely related engineering
    discipline, or equivalent industry experience.
  - Experience building enterprise SaaS, workflow automation,
    developer platforms, or data-intensive systems.
  - Experience integrating with financial-services systems,
    document systems, CRMs, ERPs, or other enterprise tools.
  - Experience with AI/ML platforms, LLM applications, or agent
    orchestration systems.
  - Experience in security-conscious or regulated environments.

  Why Join Artian

  - Build the core platform for deploying autonomous agents in
    real enterprise workflows.
  - Work closely with AI engineers and customer-facing teams on
    high-impact product problems.
  - Join an in-person New York team with high ownership and
    direct customer feedback.
  - Help define the backend architecture for a new category of
    enterprise AI software.
