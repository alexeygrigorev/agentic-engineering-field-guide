description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.

  As a Lead Software Engineer at JPMorgan Chase within the
  Equity Derivatives Group you will join our agile team
  creating, transforming, and supporting our trusted market-
  leading technology products using modern technologies and
  industry best practices. You will join and collaborate with
  a global team of technologists at all stages software
  development pipeline creating high quality software
  solutions in an environment that encourages curiosity and
  innovation, grows talent, and applies and sharpens your
  multi-faceted software engineering skillset.

  With continuous learning, inclusivity, and developer
  experience a focus of our work culture you will work with
  closely with some of the best local and global software
  engineers, production management teams, traders, sales,
  Quants and product owners as well as find opportunities to
  enhance your skillset and interests by taking advantage of
  internal and external training opportunities, finding
  mentors, joining interest groups and communities, and
  learning from leaders at the firm and industry. Launch your
  career at JPMorgan as a software engineer for the Equity
  Derivatives Group joining a team tasked with creating and
  supporting innovative software solutions for our sales and
  trading platform that advance our industry-leading Equity
  Derivatives business, supporting our clients in a first-
  class way.



  Job responsibilities

  - Execute creative software solutions, design, development,
    and technical troubleshooting with ability to think beyond
    routine or conventional approaches to build solutions or
    break down technical problems
  - Collaborate with engineers, product owners, traders, sales
    and Quants to develop best in class software solutions for
    our Equity Derivatives platform
  - Drives team adoption of enterprise-authorized AI-assisted
    engineering practices within the work environment to
    improve code quality, delivery speed, and operational
    outcomes (e.g., AI-assisted code review/refactoring, test
    strategy acceleration, incident/root-cause analysis
    support), while establishing consistent validation
    standards (secure coding, peer review, automated testing)
    and promoting reuse of effective patterns across the team.
  - Applies knowledge of tools within the Software Development
    Life Cycle toolchain, including enterprise-authorized AI-
    assisted development and automation capabilities, to
    improve the value realized by automation.
  - Work within a team of software engineers analyzing and
    implementing business requirements within an Agile/Scrum
    environment
  - Work closely with production management applying technical
    knowledge to support business processes, changes, and end
    users
  - Lead and contribute to communities of practice across
    Software Engineering to drive awareness and use of new and
    leading-edge technologies
  - Add to team culture of diversity, opportunity, inclusion,
    and respect



  Required qualifications, capabilities, and skills

  - Formal training or certification on software engineering
    concepts and 3+ years applied experience.
  - Experience with Java/JVM and the Java/JVM ecosystem, Spring
    boot framework
  - Experience of TypeScript/React development
  - Demonstrated experience leading effective use of approved
    AI-assisted software development tools (e.g., for coding,
    code review, test acceleration, troubleshooting) with the
    ability to set team expectations for validating AI outputs
    for correctness, performance, and security.
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity considerations,
    secure handling of inputs/outputs, and adherence to
    resiliency and security expectations; experience coaching
    engineers on safe, compliant adoption within delivery
    practices
  - Experience with object-oriented design and micro-service
    architectures and best practices
  - Proficient in all aspects of the Software Development Life
    Cycle
  - Good understanding of software design patterns and clean
    code practices
  - Strong written and oral communication skills
  - Proficiency in automation and continuous delivery methods
  - Advanced understanding of agile methodologies, CI/CD,
    Application Resiliency, and Security
  - Experience partnering with product and engineering teams



  Preferred Qualifications, capabilities, and skills

  - Experience working on financial systems is a plus
  - Experience with finance / derivative products. Knowledge of
    Convertible Bonds is a plus
  - Experience of publish/subscribe messaging protocols such as
    Kafka , AMQP, AMPS
  - Experience with C#/WPF  desktop application programming
  - Exposure to Relational Database Management Systems (Sybase)
  - Experience of Cloud technologies
  - Exceptional client relationship skills including the ability
    to discover true requirements underlying feature requests,
    recommend alternative technical approaches, drive efforts
    to meet committed timelines with optimal solutions

