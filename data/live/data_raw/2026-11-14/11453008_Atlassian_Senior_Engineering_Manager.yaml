  control over supporting their family, personal goals, and
  other priorities. We can hire people in any country where we
  have a legal entity. About the role This is an opportunity
  to join a high-impact Growth team and learn how world-class
  experimentation works at scale. We're the Spark team - we
  light the fire for customer acquisition. We innovate,
  personalize, and run experiments on top-of-funnel Atlassian
  surfaces, and build AEO/SEO features that help millions
  discover and sign up for Atlassian products. People
  Leadership & Team Health

  - Lead and develop talent: Manage, mentor, and coach a team of
    engineers, supporting their individual career growth,
    skill development, and progression.
  - Build a high-performing culture: Foster an inclusive,
    collaborative, and psychologically safe environment where
    continuous learning, feedback, and high standards thrive.
  - Team composition & hiring: Partner with Talent Acquisition
    to attract, interview, and hire diverse engineering talent
    while maintaining balanced team capacity.
  - Monitor team health: Proactively track and support team
    well-being, engagement, and operational sustainability.

  Delivery & Outcome Ownership

  - Own team outcomes: Drive execution across multiple top-of--
    the-funnel workstreams, ensuring the team delivers
    measurable customer and business value with speed and
    consistency.
  - Prioritization & trade-offs: Make pragmatic delivery trade-
    offs between feature development, technical debt,
    reliability, and security.
  - Process & workflow optimization: Establish and refine agile
    practices to streamline execution, remove blockers, and
    improve developer velocity.

  Technical Leadership & Architecture

  - Technical direction: Deeply understand the team's
    architecture, systems, and dependencies to guide the
    medium-to-long-term technical strategy. Establish AEO
    methodologies that measure, influence, and simulate AEO
    Engines.
  - Engineering excellence: Champion best practices across
    design reviews, automated testing, CI/CD, documentation,
    code quality, and the effective use of AI.
  - System resilience: Partner with senior engineers to guide
    architectural decisions that ensure scalability,
    modularity, and maintainability.

  Why Spark?

  - Meaningful Impact Early: Your code ships to real users on
    Atlassian's acquisition surfaces from your first quarter
  - Learning and Collaboration: We partner with our teams and
    products to deliver the best personalized outcomes for our
    customers
  - A culture of measurement: We don't guess. We test,
    instrument, analyze, and decide based on data. Our metrics
    tie directly to the customer and the business.

  Your background:

  - 5+ years of experience managing software engineering teams.
  - Bachelor's or Master's degree (preferably a Computer Science
    degree or equivalent practical experience).
  - Strong foundational background in distributed systems,
    developer platforms, cloud infrastructure (AWS/GCP/Azure),
    or developer tooling.
  - Experience with applied AI/ML systems, LLMs, AI agents, MCP
    tooling, RAG, or AI evaluation frameworks.
  - Demonstrated experience partnering with product managers,
    TPMs, and designers to shape product and platform
    strategy.

