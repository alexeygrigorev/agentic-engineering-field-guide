description: |
  About OuterSignal

  We are building the customer intelligence and
  personalization layer for consumer businesses. Every
  business knows when an order comes in or a user signs up,
  but they only see 5% of the real story.

  We show them the other 95%: not just who’s buying, but who
  that person actually is. That includes the execs,
  influencers, journalists, retail buyers, investors, and
  everyday customers who become a brand’s best evangelists.
  Our platform enriches every customer in real time with
  professional and personal signals, builds personas, and
  powers everything from surprise-and-delight outreach to
  smarter email flows, analytics, and BD leads.

  We’re a small, high-performing team building the category-
  defining platform for customer intelligence, backed by a
  world-class investor base.



  The Opportunity

  We’re hiring a Senior Software Engineer to architect and own
  the core systems behind OuterSignal: the APIs, queues, and
  LLM pipelines that enrich millions of orders in real time.

  The surface area is big, from AI pipelines to Shopify apps
  to RAG and vector search infrastructure, and you’ll see your
  code directly impact customers, revenue, and growth. We’re
  past prototype with strong product-market fit, and the
  ceiling is wide open.

  You’ll work directly with the founding team on the roadmap
  and product direction, and help shape how we hire and build
  as the engineering team grows.



  What You’ll Do

  - Architect and own core systems that process millions of
    orders across APIs and LLM pipelines
  - Build queue-based microservices using Redis, Node.js,
    TypeScript, Postgres, Docker/K8s, and Vercel
  - Integrate vector databases and RAG pipelines to make
    customer profiles smarter, faster, and searchable in real
    time
  - Ship features end to end: APIs, dashboards, and integrations
    (Shopify, Klaviyo, Slack, Zapier, Gorgias)
  - Keep us ahead on privacy and compliance
  - Work directly with the founding team on the roadmap, product
    direction, and hiring future engineers



  What We’re Looking For

  - 5+ years of engineering experience, ideally with backend
    infrastructure and distributed systems
  - Experience at a fast-paced startup, or willingness to dive
    into a dynamic, changing environment
  - Fluent in JS/TS (Node), with some Python/ML exposure a plus
  - Experience with vector databases (Pinecone, Weaviate,
    pgvector, etc.) and RAG architectures
  - Comfortable designing schemas and scaling Postgres
  - Bonus: experience building around LLMs, Shopify apps, or
    data-privacy frameworks
  - Most importantly: you want ownership. You like to build
    quickly, solve “figure-it-out” problems, and aren’t afraid
    of messy early-stage work.



  What We Offer

  - Impact: Join at the ground floor where your work directly
    influences company trajectory
  - Growth: Real brands already rely on us and we’re scaling
    fast, which means exceptional learning opportunities and
    room to grow with the company
  - Upside: Meaningful equity in a venture-backed company
    defining a new category
  - Team: Work directly with the founders and experienced
    operators
  - Ownership: An early seat shaping the DNA of OuterSignal’s
    engineering org



  How to Apply

  Submit your resume along with responses to the application
  questions. We review applications on a rolling basis and
  will reach out to qualified candidates to discuss potential
  opportunities.

  OuterSignal is an equal opportunity employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees.
