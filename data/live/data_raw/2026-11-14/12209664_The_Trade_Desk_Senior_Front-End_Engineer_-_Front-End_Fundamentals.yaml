description: |
  The Trade Desk is a global technology company and the
  world’s leading independent platform for digital
  advertising, with over 3,000 employees across more than 30
  offices. Our technology helps advertisers reach the right
  audiences across the open internet — from streaming TV and
  podcasts to mobile apps, news, and more.   Advertising
  powers the content people love. By making it more
  transparent, effective, and responsible, we help support
  trusted journalism, quality entertainment, and creators
  worldwide. The world’s brands and agencies rely on us to
  reach their customers and grow their businesses responsibly.
  The scale of our platform brings unique technical challenges
  — from processing massive datasets in real time to building
  systems that operate reliably on a global scale. When you
  work here, your impact is worldwide. We welcome diverse
  perspectives, encourage curiosity, and build teams that
  learn from one another. If you’re driven to solve meaningful
  challenges, we’d love to meet you.

  What we do   At The Trade Desk, Front-end Software Engineers
  deliver complex and data-rich UIs to our internal users and
  external clients. User experience can make or break our
  business, and it’s crucial that we deliver a simple
  interface to our powerful and sophisticated platform, as
  well as rich insights mined from the petabytes of data
  streaming through our pipelines.

  The Front-End Fundamentals team owns the overall framework
  and high-level architecture patterns that our feature teams
  use to deliver powerful features to our users, from campaign
  creation and targeting to real-time performance monitoring
  and troubleshooting. Alongside our partners in product
  management, design, and UX research, we work up and down the
  stack to deliver world-class experiences.

  What you’ll do:  Some of the work that you will be doing to
  help us deliver on our mission is:

  - Own software delivery through the whole lifecycle: Design,
    build, and deploy software from inception to production

  - Drive complex changes involving multiple components or
    services

  - Ensure quality using automated tests, metrics, monitoring,
    and manual validation

  - Collaborate with teammates and stakeholders from other teams
    and departments

  - Deploy AI thoughtfully throughout the software development
    process

  - Build execution plans incorporating user data, observations,
    market insight , and product roadmaps

  - Implement and maintain product features

  - Build components and processes that are regularly used by
    others

  - Work on a distributed team and in a distributed system
    environment

  - Understand the business objectives behind the code

  - Understand system architecture fundamentals through self-
    directed learning

  - Create clarity out of ambiguity as you join or lead complex
    projects

  - Lead others through example, mentorship, and teaching

  - Participate in hiring to grow the team
  - Use data to analyze and communicate the impact of your work
    on operational efficiency

  We are a global team with different backgrounds,
  experiences, and perspectives. To complement this team, you
  will welcome ideas that are different from your own and be
  well-versed in building from common ground to value, seek
  out, and foster invisible and visible dimensions of
  diversity.

  Who you are:  We have a lot of fun together (especially on
  this team), but our culture is much deeper than that. Our UI
  engineers are passionate advocates for our users, both
  internal and external. We build trust by supporting each
  other generously; we approach problems with scrappy
  determination; and we pursue excellence unfailingly even
  when—especially when—it’s not the easy path. Oh, and we
  laugh a lot. We take the work seriously, but not ourselves.

  No list of requirements can capture the unique contribution
  of each individual team member. But we think that for a
  successful candidate, most of these will be true:

  - You have 7+ years of experience building and delivering
    front-end software.

  - You have a solid understanding of software engineering
    fundamentals.

  - You have deep experience in in JavaScript/TypeScript, React,
    and browser APIs

  - You are passionate about building beautiful and seamless
    user interfaces.

  - You have love for, and desire to advance, the state of the
    art of technology.

  - You can communicate effectively with both technical and non-
    technical audiences.

  - You are comfortable working on an agile, distributed team
    spanning multiple time zones—and sometimes multiple
    continents.

  - You have experience building enterprise level services.

  - You have credentials or solid experience equivalent to a
    bachelor’s degree in computer science. (Not every has the
    same educational opportunities; we look more at what you
    bring to the table than any specific degree.)
  - You might even have some experience in server-side
    technologies: SQL and GQL, and maybe also C#, Java, or
    NodeJS.

  There is no typical day at The Trade Desk or on this team,
  so we rely much more on your personal qualities and track
  record than on your experience with any single technology.
  We care about your attitude when approaching problems; your
  drive to learn and improve; your openness and generosity
  when you collaborate.

  In accordance with various US state laws, the range provided
  is the Trade Desk's reasonable estimate of the base
  compensation for this role. The actual amount may differ
  based on non-discriminatory factors such as experience,
  knowledge, skills, and location.  All employees may be
  eligible to become The Trade Desk shareholders through
  eligibility for stock-based compensation grants, which are
  awarded to employees based on company and individual
  performance. The Trade Desk also offers other compensation
  depending on the role such as variable compensation-based
  incentives and commissions. Plus, expected benefits for this
  role include comprehensive healthcare (medical, dental, and
  vision) with premiums paid in full for employees and
  dependents, retirement benefits such as a 401k plan and
  company match, short and long-term disability coverage,
  basic life insurance, well-being benefits, reimbursement for
  certain tuition expenses, parental leave, sick time of 1
  hour per 30 hours worked, vacation time for full-time
  employees up to 120 hours thru the first year and 160 hours
  thereafter, and around 13 paid holidays per year.  Employees
  can also purchase The Trade Desk stock at a discount through
  The Trade Desk’s Employee Stock Purchase Plan.

  The Trade Desk also offers a competitive benefits package.
  Click here to learn more.

  Note: Interns are not eligible for variable incentive awards
  such as stock-based compensation, retirement plan, vacation,
  tuition reimbursement or parental leave

  At the Trade Desk, Base Salary is one part of our
  competitive total compensation and benefits package and is
  determined using a salary range. The base salary range for
  this role is

  $124,900—$220,000 USD

