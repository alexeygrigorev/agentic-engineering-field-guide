description: |
  Applied Intuition, Inc. is powering the future of physical
  AI. Founded in 2017 and now valued at $15 billion, the
  Silicon Valley company is creating the digital
  infrastructure needed to bring intelligence to every moving
  machine on the planet. Applied Intuition services the
  automotive, defense, trucking, construction, mining and
  agriculture industries in three core areas: tools and
  infrastructure, operating systems, and autonomy. Eighteen of
  the top 20 global automakers, as well as the United States
  military and its allies, trust the company’s solutions to
  deliver physical intelligence. Applied Intuition is
  headquartered in Sunnyvale, California, with offices in
  Washington, D.C.; San Diego; Ft. Walton Beach, Florida; Ann
  Arbor, Michigan; London; Stuttgart; Munich; Stockholm;
  Bangalore; Seoul; and Tokyo. Learn more at applied.co.

  We are an in-office company, and our expectation is that
  full-time employees primarily work from their Applied
  Intuition office 5 days a week. However, we also recognize
  the importance of flexibility and trust our employees to
  manage their schedules responsibly. This may include
  occasional remote work, starting the day with morning
  meetings from home before heading to the office, or leaving
  earlier when needed to accommodate family commitments. This
  in-office expectation does not apply to contractor positions

  Senior Fullstack Engineer UK

  Full-time /London (Engineering)

  About Applied Intuition Defence

  Applied Intuition UK is a software and infrastructure
  supplier that accelerates the deployment of next-generation
  autonomous capabilities to the warfighter across air, land,
  sea, and space. A subsidiary of Applied Intuition, we
  deliver dual-use solutions to national security customers
  that build upon several years of product development and
  experience from commercial autonomy programs. Based in
  London, our seasoned defence team hails from Palantir,
  Anduril, SpaceX, Google, Lockheed Martin, and the UK and US
  Armed Services. Learn more at appliedintuitiondefense.com.

  About the role

  You would be the first fullstack engineer we hire onto the
  UK team, joining software and autonomy engineers whose tools
  are already relied on across live programmes. As that
  portfolio grows, we are bringing in dedicated fullstack
  expertise to shape how the user-facing products we ship are
  designed and built. Every day is different: designing an
  interface around how a customer actually operates, building
  the services and APIs behind it, working with our design
  team so what we ship in London is coherent with everything
  else Applied Intuition builds, or taking what we learn on a
  programme and landing it in the products of the teams we
  work alongside. You will move between languages and layers
  as the problem demands, and you will have a strong voice in
  how these products get built. You bring the judgement of a
  career spent shipping production software, and you watch the
  people you built it for take it into the field.

  At Applied Intuition, you will:

  - Take new products from concept through to production at the
    pace our programmes demand, owning the technical and
    product decisions along the way
  - Build features end to end, from the interface through the
    API to the services and data behind it
  - Set the front-end foundations for our UK products: shared
    components, sensible patterns, and a design language
    consistent with the rest of the company
  - Decide, with the team, when a new capability should stand
    alone and when it belongs in our core product offering
  - Get the improvements we identify on programmes into the
    products our other teams build, so what we learn in the
    field shapes the wider roadmap
  - Engineer security in from the first commit, and build
    software that holds up to the environments and the
    scrutiny our customers operate under
  - Help raise the bar for how user-facing software is built
    here, and build products people depend on and that you are
    proud of

  We’re looking for someone who has:

  - Bachelor's degree in computer science/related engineering
    field
  - 5+ years of hands-on fullstack experience shipping and
    supporting production web applications
  - Deep expertise in React and TypeScript, or another modern
    front-end framework, and strong, well-founded opinions
    about building interfaces for data-heavy workflows
  - Adaptability across languages and comfort owning the whole
    stack; our products span TypeScript, Go and Python, and we
    care more about your judgement than your syntax
  - Experience working closely with designers and product
    managers, and a track record of getting your requirements
    into products you don't own
  - Command of application security, and experience developing
    in Docker and containerised environments on Linux

  Travel Requirements:

  - General willingness to travel for company business between
    our offices, as well as to customer sites

  Security Requirements:

  - Must have ability to hold UK Security Clearance (current or
    previous preferred)

  Nice to have:

  - 7+ years of experience building fullstack applications,
    including time as the senior voice on front-end
    architecture
  - Hands-on experience with 3D or geospatial visualisation in
    the browser, such as CesiumJS, Three.js or WebGL
  - Experience building or extending a design system used across
    more than one team
  - Experience deploying and operating what you build, on
    Kubernetes or similar
  - Experience with autonomy, robotics, simulation or other
    systems that generate data at a scale browsers were never
    designed for
  - Experience working on projects related to national security
    for one or more government agencies
  - References who will describe them as low-ego, historically
    motivated, thoughtfully opinionated, strong communicators
    and curious listeners

  Don’t meet every single requirement? If you’re excited about
  this role but your past experience doesn’t align perfectly
  with every qualification in the job description, we
  encourage you to apply anyway. You may be just the right
  candidate for this or other roles.

