description: |
  About Candid

  At Candid Health, we're on a mission to revolutionize
  healthcare by solving one of its most complex and costly
  problems: the billing and revenue cycle management (RCM)
  process. The healthcare system has long been burdened by
  slow, inefficient workflows that waste valuable resources,
  leaving providers with less time and money to focus on
  patient care. With our cutting-edge revenue cycle automation
  platform, we are transforming this space through an
  intelligent, data-driven approach that simplifies billing,
  enhances claims processing, and eliminates administrative
  waste.

  The Opportunity

  We’re looking for a passionate and skilled Senior Software
  Engineer to join our fast growing engineering teams. In this
  role, you will be instrumental in revolutionizing healthcare
  billing products and systems that directly address the needs
  of our customers. You will contribute to the full software
  development lifecycle, ensure high scalable, reliable and
  performance of our products and customer experience. If you
  thrive in a fast-paced, collaborative environment, are
  driven by customer outcomes, and are committed to crafting
  robust and scalable solutions, we would like you to join us!

  What you’ll be doing

  - Conceptualize, design, development, and maintain complex
    services/platforms/features and develop ownership over
    large swaths of our product + infrastructure.
  - Collaborate closely with customers, product managers,
    designers, and cross-functional partners to understand
    customers’ needs and develop creative ways to address
    them.
  - Identify, propose and lead architecture and design
    improvements needed in our products and systems with
    scalability and reliability as core principles.
  - Contribute to our engineering + broader company culture and
    help make this the best place we’ve ever worked.

  Who you are

  - You have Bachelors of Science or Bachelors of Art in
    Computer Science, Computer Engineering, Math or other
    similar degree.
  - You have 8+ years of experience in a Software Engineering
    position.
  - Experience with programming languages, relevant frameworks,
    databases and cloud platforms. Familiar with the
    technologies we currently use is a bonus, but not
    required: Python, PostgreSQL, Docker, Kubernetes, React,
    Typescript, Google Cloud Platform, Auth0, Terraform.
  - Proven ability to build high-quality software, and is
    anchored on customer outcomes and have good intuition
    around which corners are worth cutting and which aren’t.
  - Proven ability to own features end-to-end and are
    comfortable learning new tools or moving across the stack
    to do so.
  - Customer-first and learner’s mindset, and value teaching
    others.
  - Strong communication and collaboration skills. Proven
    ability to explain complicated ideas in simple terms, both
    in-person and in writing.

  Pay Transparency

  The estimated starting annual salary range for this position
  is $195,000 to $250,000 USD. The listed range is a guideline
  from Pave data, and the actual base salary may be modified
  based on factors including job-related skills,
  experience/qualifications, interview performance, market
  data, etc. Total compensation for this position may also
  include equity, sales incentives (for sales roles), and
  employee benefits. Given Candid Health’s funding and size,
  we heavily value the potential upside from equity in our
  compensation package. Further note that Candid Health has
  minimal hierarchy and titles, but has broad ranges of
  experience represented within roles.

