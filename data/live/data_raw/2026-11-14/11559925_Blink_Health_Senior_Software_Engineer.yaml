description: |
  About BlinkRx:

  BlinkRx is rebuilding how Americans access life-changing
  medicines. Today, only one in five prescriptions for new
  branded therapies are ever filled. The problem isn't the
  medicine. It's insurance barriers, affordability challenges,
  fragmented pharmacy experiences, and inadequate support that
  keep patients from starting and staying on treatment. Our
  mission is to change that.

  We built RxOS, the first AI-powered prescription operating
  system. RxOS connects the largest network of doctors,
  patients, pharmacies, payers, and pharmaceutical
  manufacturers, intelligently orchestrating every step to
  guarantee a seamless prescription journey for every script.

  Our teams solve complex, high-stakes problems at the
  intersection of artificial intelligence, healthcare
  operations, logistics, payments, and regulation. The impact
  is transformative: BlinkRx more than doubles the rate at
  which patients take their medications and lowers their out-
  of-pocket expenses by hundreds of dollars every month.

  BlinkRx created and leads a rapidly growing $80+ billion
  category, with exceptional momentum:

  - Built for scale: Over the past decade, we have invested
    nearly $1 billion in building the technology and
    operational platform required to serve patients at scale.
  - Proven growth and economics: We have grown 100% annually for
    the past five years, are profitable, and support more than
    60 pharmaceutical brands.
  - Trusted with category-defining programs: Our technology
    powers a leading pharmaceutical manufacturer’s direct-to-
    patient platform for its GLP-1 portfolio, providing the
    infrastructure to expand patient access as demand for
    these therapies grows.

  We are a dynamic team of technologists and industry experts
  seeking to build a generational company that delivers a
  genuine step change in American health.

  The Opportunity:

  BlinkRx is opening its first Bay Area engineering office,
  and we are building the founding team now. This is not a
  lateral move into an established org. This is a chance to be
  one of the engineers who was there at the beginning, setting
  technical standards, shaping how AI gets embedded into an
  engineering culture from day one, and writing code that
  ships to production fast and reaches real patients
  immediately.

  We are looking for Full Stack Engineers who build with AI as
  a way of working, not as a feature. Engineers who experiment
  relentlessly, integrate it into everything they touch, and
  are done waiting for permission to do their best work. The
  founding team sets the culture and the trajectory. That
  opportunity does not come around often, and it is rarer
  still when the company is already proven at scale.

  Responsibilities:

  - Lead architecture and execution for complex features or
    systems across multiple teams or domains, with an emphasis
    on AI-integrated solutions.
  - Design and evolve backend and frontend architecture for
    scalable, high-performance systems.
  - Write clean, efficient, and maintainable code and lead code
    reviews that raise the bar for the entire team.
  - Actively integrate AI tooling into your development workflow
    and help establish that standard across the engineering
    organization.
  - Investigate and resolve complex performance and reliability
    issues end-to-end.
  - Drive the release of new features with testing,
    documentation, and monitoring from day one.
  - Partner cross-functionally with product, design, data, and
    operations to shape roadmaps and accelerate impact.
  - Rapidly prototype, test, and iterate with a learning mindset
    and a bias for action.
  - Communicate complex technical topics clearly to technical
    and non-technical audiences alike.

  Qualifications:

  - 5+ years of software engineering experience with increasing
    scope and impact.
  - Proven experience owning significant systems or product
    areas from design through launch.
  - Strong expertise in at least one modern language such as
    Python, JavaScript, or Go.
  - Active, hands-on use of AI tools as a core part of your
    engineering workflow.
  - Experience in distributed systems, API design, and
    performance optimization.
  - Excellent communication and collaboration skills.
  - Bachelor's degree in Computer Science or equivalent
    experience.

  Why Join Us: It is rare to have a company that both deeply
  impacts its customers and is able to provide its services
  across a massive population.  At Blink, we have a huge
  impact on people when they are most vulnerable: at the
  intersection of their healthcare and finances. We are also
  the fastest growing healthcare company in the country and
  are driving that impact across millions of new patients
  every year.  Our business model not only helps people, but
  drives economics that allow us to build a generational
  company. We are a relentlessly learning, constantly curious,
  and aggressively collaborative cross-functional team
  dedicated to inventing new ways to improve the lives of our
  customers. We are an equal opportunity employer and value
  diversity of all kinds. We do not discriminate on the basis
  of race, religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status. Applicants who provide their phone number
  and consent to receive text messages may receive SMS or MMS
  updates from Blink Health regarding their application.
