description: |
  About BLEN

  BLENers are passionate about using technology to solve real-
  world problems. For over 20 years, we've been helping
  government agencies and businesses transform their digital
  experience. We bring fresh perspectives to every project,
  from modernizing legacy systems to building cloud-native
  applications to experimenting with technology that’s just
  around the corner. We value building long and enduring
  partnerships to solve complex challenges by putting humans
  at the center of all the experiences. Our team thrives on
  turning tricky problems into solutions that are practical,
  accessible and performant.



  About this position

  As a Senior Software Developer II - Full Stack at BLEN, you
  will take on a highly strategic role in designing,
  architecting, and developing scalable, robust digital
  solutions. This role demands a combination of deep technical
  expertise in both front-end and back-end technologies and
  the ability to collaborate closely with tech leads and
  sometimes take on tech lead responsibilities. You will be
  expected to think strategically, mentor team members, and
  deliver high-impact solutions while embracing ownership and
  accountability. In addition, this position requires a strong
  background in cloud services, system architecture, AI
  toolings, and an eagerness to innovate by building
  prototypes and transforming proof of concepts into
  production-ready features.

  What we would like from you

  - Technical Leadership and Strategy
  - Collaborate closely with the tech lead, taking
    responsibility for the system's architecture and
    development strategy
  - Step in as the acting Tech Lead when required, making key
    technical decisions that ensure alignment with overall
    product and business goals
  - Design and implement scalable, efficient, and maintainable
    systems and architectures
  - Work on building prototypes and proof of concepts that later
    become major production features
  - Software Development and Problem-Solving
  - Leverage extensive full-stack development experience to lead
    high-complexity, outcome-driven projects
  - Proactively diagnose and solve architectural and technical
    issues, driving quality improvements in existing systems
  - Work hands-on with modern tech stacks, including advanced
    usage of cloud platforms, ensuring scalable system designs
  - Actively contribute to the development and deployment of AI-
    driven solutions and applications
  - Mentorship and Team Development
  - Mentor and support junior engineers, focusing on
    transferring skills in system design, cloud services, and
    AI technologies
  - Provide technical guidance across teams, fostering a culture
    of continuous learning and innovation
  - Engage in technical interviews, assessing candidates' skills
    and cultural fit
  - Communication and Stakeholder Engagement
  - Present design documents, architecture diagrams, and
    technical solutions to clients, stakeholders, and cross-
    functional teams
  - Communicate technical strategies and developments
    effectively across the team and external partners
  - Process Improvement and Innovation
  - Drive improvements in software development processes and
    practices, with a focus on high performance and
    scalability
  - Champion best practices in system design, architecture,
    cloud services, and AI development
  - Stay up to date with emerging technologies and trends in AI
    and cloud computing, applying this knowledge to drive
    innovation in the organization

  Basic qualifications

  - Essential Requirements
  - 10+ years of engineering experience, with a proven track
    record of designing and developing scalable, reliable, and
    maintainable systems and architectures
  - Extensive experience with full stack development using
    Python, React, Next.js, Node.js, Java or Ruby on Rails
  - Hands-on experience with Python and AI toolings, including
    familiarity with large language models (LLMs) and other
    modern AI frameworks
  - Strong expertise in containerization technologies like
    Docker and orchestration tools such as Kubernetes,
    ensuring systems are scalable and maintainable in a cloud-
    native environment
  - Experience working with both relational databases such as
    PostgreSQL, MySQL, and NoSQL databases like Firestore,
    MongoDB, ensuring effective database design, optimization,
    and scalability
  - Hands-on experience integrating external APIs and third-
    party services into applications
  - Strong cloud services management and configuration skills
    with AWS, Azure, or GCP, leveraging these platforms for
    high availability, scalability, and security
  - Proficiency in version control systems (e.g., Git), and
    experience managing large, complex codebases
  - Robust problem-solving skills, particularly in diagnosing
    and resolving complex system issues related to distributed
    systems, cloud infrastructure, and application performance
  - Preferred Skills and Experience
  - Prior experience leading engineering teams or acting as a
    Tech Lead
  - Experience building AI applications and their underlying
    infrastructure
  - Familiarity with DevOps tools and best practices
  - Ability to obtain a Public Trust Clearance

  Requirement

  - Must be a US Citizen or legal resident and able to work
    domestically
  - Must be located in the United States
  - Must be able to attain low-level security clearance

  Perks

  - Work from anywhere.
  - The chance to work on high-visibility projects and make a
    significant impact.
  - Competitive salary range ($130,000 - $200,000+) based on
    role requirements and your experience and impact.
  - Comprehensive medical, dental, vision, life, and disability
    insurance.
  - Up to 20+ days of PTO annually.
  - 401(k) retirement savings plan.
  - FSA/HSA and commuter benefit options.
  - Professional development opportunities, certifications, and
    continuous learning support.
  - Company-provided technology and access to productivity and
    AI tools.
  - Additional bonus based on performance.

  Get to know us

  - We are a small, creative and highly technical team.
  - Our heroes are the scrappy folks that dare to dream and do
    great things. We love people that care more about doing
    the right thing than taking a shortcut.
  - We believe in finishing projects and floor our clients by
    how much we cared about their project.
  - We believe in integrity and because we're small, we are very
    selective of our partners and clients.
  - We do not use phrases like 'human resource' because you are
    NOT a resource. You are a team member and we will treat
    you like one.

  What you should expect from us

  - We will treat you fairly.
  - We give you space to grow both personally and
    professionally.
  - We will hear your ideas even when we disagree -- especially
    when we disagree.
  - We will be equitable with our success and be honest with our
    challenges.
  - We will always tell you the truth. Even when the truth is
    difficult.

  BLEN's hiring process

  - Resume Review: Our team evaluates your resume and online
    profiles (LinkedIn, GitHub, etc.) to assess qualification
    fit.
  - Role-Specific Assessment (depending on role, due in 24 - 48
    hours): Complete a take-home assignment or live coding
    session to demonstrate technical skills. For this role,
    this will be the assessment:
    https://github.com/blencorp/blen-fullstack-engineer-take-
    home
  - Hiring Manager Screen (30 mins): Dive deeper into your
    experience and the role with the hiring manager.
  - Virtual Interviews (2 rounds, 30-45 min each): Technical and
    competency-based interviews aligned with Blen's values,
    conducted via Google Meet.
  - Decision & Offer: Post-interview, the hiring team decides.
    If selected, your recruiter will extend an offer and
    assist with logistics.
