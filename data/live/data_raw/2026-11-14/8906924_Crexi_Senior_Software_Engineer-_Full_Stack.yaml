description: |
  About Crexi

  Commercial real estate is one of the largest asset classes
  on earth and one of the last to go digital. Deals still get
  done over email threads, PDFs, and relationships nobody can
  search for. Crexi is the exchange betting that doesn't have
  to be true anymore: we're building the platform where an
  entire industry finds, evaluates, and closes deals, and
  we're betting hard on AI to get there faster than anyone
  thought this industry could move. There's no playbook for
  turning a trillion-dollar, relationship-driven industry into
  a modern marketplace which means the people building it get
  to write it.

  About the Role:

  As a Senior Software Engineer, Full Stack, you will design,
  build, test, and ship end-to-end product features across
  Crexi’s platform—owning work from UI through APIs and data.
  You’ll operate with a strong product mindset, partnering
  closely with Product and Design to turn customer needs into
  simple, scalable solutions. You’ll also leverage modern AI
  coding tools to accelerate delivery while maintaining a high
  bar for code quality, security, and maintainability.

  What You'll Do:

  A typical day may include:

  - Design, develop, deploy, and maintain full-stack web
    applications using TypeScript across front-end and back-
    end systems.

  - Build high-quality, customer-facing user interfaces with
    modern web frameworks (Angular preferred).

  - Translate designs into responsive, modern experiences across
    devices (desktop, tablet, mobile).

  - Build and maintain backend services and APIs
    (Node.js/TypeScript), including:
    - Scalable API design (REST and/or GraphQL)
    - Authentication/authorization patterns
    - Data modeling and database schema design
    - Performance, reliability, and concurrency considerations
  - Rapidly prototype, iterate, and ship user-facing
    features—balancing speed with long-term architectural
    integrity.

  - Leverage AI coding tools (e.g., Cursor, Copilot) for
    scaffolding, refactoring, test generation, and
    debugging—while critically reviewing AI output for
    correctness, security, and performance.

  - Participate in (and often lead) code reviews, raising the
    bar on quality, readability, and security across the
    stack.

  - Troubleshoot complex production issues with a focus on
    observability, performance tuning, and prevention.

  - Identify opportunities to improve developer/agentic
    experience, processes, and platform foundations (tooling,
    CI/CD, testing, architecture patterns).

  - Collaborate cross-functionally with Product, Design, and
    Engineering to drive measurable impact for customers.

  - Mentor junior engineers through pairing, feedback, and
    technical guidance; contribute to a culture of pragmatic,
    user-focused engineering.

  - Author and maintain clear technical documentation for
    features, APIs, and system behavior.

  Qualifications:

  - Bachelor’s degree in Computer Science or related field, or
    equivalent practical experience.

  - 5+ years of professional software development experience in
    production environments with meaningful scope/ownership.

  - 2+ years of hands-on TypeScript experience across front-end
    and back-end contexts (strong preference for deeper
    expertise).

  - Proven full-stack capability: you have shipped features end-
    to-end (UI → API → data) and can own production outcomes.

  - Strong experience building modern web UIs using TypeScript
    (Angular preferred; other modern frameworks acceptable).

  - Strong backend fundamentals, including API design, data
    modeling, and performance considerations.

  - Experience with source control and collaborative workflows
    (GitHub/GitLab), including code reviews and CI/CD basics.

  - Demonstrated use of AI coding assistants (e.g., Copilot,
    Cursor) in a professional workflow—without compromising
    quality.

  Who You Are:

  - Self-starter who independently drives outcomes, owns success
    metrics, and follows through.

  - Strong product thinking: you can balance customer
    experience, technical feasibility, and maintainability.

  - Excellent communication skills—able to explain tradeoffs and
    align stakeholders.

  - Strong debugging skills across the stack (UI, APIs, data),
    with a calm, structured approach to incident response.

  - Security- and privacy-minded engineering approach (safe
    defaults, least privilege, secure coding practices).

  - Comfortable in ambiguity and fast iteration cycles; startup
    / zero-to-one experience is a plus.

  Why Crexi?

  - Real impact, fast. Join a rapidly scaling startup where your
    work moves the needle from day one.
  - Real ownership. Equity in Crexi's growth story.
  - Built for growth. A flexible team structure designed for
    real career discretion.
  - Time that is yours. Discretionary PTO - take what you need,
    when you need it.
  - Health & Future covered. Medical, dental, and vision
    insurance, 401(k), FSA/HSA options, and Life & AD&D
    insurance.
  - Set up right. Home-office reimbursement for remote
    employees.
  - A winning team. A collaborative culture with team activities
    that bring people together.

  The anticipated base salary range for candidates who will
  work in our Playa Vista, California location is $160,000 to
  $214,000. The final salary offered to a successful candidate
  will depend on several factors, which may include, but are
  not limited to, the type and length of experience applicable
  to the role and within the industry, education, geographic
  location, etc. Commercial Real Estate Exchange, Inc
  (“Crexi”) is a multi-state employer, and this salary range
  may not reflect positions that work in other states.

  Crexi is an EEO Employer. Qualified applicants will receive
  consideration for employment without regard to race, color,
  religion, sex, national origin, sexual orientation, gender
  identity, disability or protected veteran status. Crexi will
  also consider for employment qualified applicants with
  criminal histories in a manner consistent with EEOC
  guidelines and applicable local law.
