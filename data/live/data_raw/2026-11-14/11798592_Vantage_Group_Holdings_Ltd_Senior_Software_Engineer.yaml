description: |
  About the Company


  Vantage Group Holdings Ltd. (Vantage) was established in
  late 2020 as a re/insurance partner designed for the future.
  Driven by relentless curiosity, our team of trusted experts
  provides a fresh perspective on our clients’ risks. We add
  creativity to tech-enabled efficiency and robust analytics
  to address risks others avoid. Vantage provides specialty
  re/insurance through its operating subsidiaries in Bermuda
  and the U.S.


  Vantage has approximately 365 colleagues in both the United
  States and Bermuda. We have offices in Chicago, IL, Norwalk,
  CT, West Hartford, CT, Washington, DC, Boston, MA, New York,
  NY, Atlanta, GA and Hamilton, Bermuda. Additionally, we are
  a highly geographically diverse workforce with colleagues
  based in 35 states and counting. We fully support work
  flexibility including remote and hybrid work arrangements.

  About the role:

  At Vantage, the Senior Software Engineer will be a part of
  an agile product team collaborating with the technology
  delivery manager (TDM), digital product managers (DPM), and
  other product team members on the Reinsurance team to
  accurately capture stakeholder requests and system
  specifications, translating them into high-quality systems
  solving real business problems within the organization. This
  position will report to the AVP, Software Engineering and
  will be an individual contributor.

  The base salary expectation for this role is between
  $170,000 and $210,000. Actual base salary for the selected
  candidate may be higher commensurate with candidate
  experience and expectations. Additionally, Vantage offers
  its colleagues performance-based bonus potential, strong
  health & welfare benefits, retirement plans with company
  match, competitive time off plans, a highly flexible work
  environment, and much more.

  Responsibilities & Accountabilities:

  The Senior Software Engineer consults with enterprise
  architects and senior technology leadership to ensure
  engineering work aligns with enterprise architecture
  principles and software development best practices. As part
  of an agile team, this colleague will collaborate with
  testers and other developers to develop creative, high-
  quality solutions.

  - Completes complex software development work involving
    creative application design, coding, and debugging methods
    and techniques.
  - Build user friendly and resilient applications and services
    with optimized user and developer experiences to
    accelerate the delivery of business solutions in a fast
    evolving and rapidly growing environment.
  - Proven ability to deliver business facing solutions in weeks
    rather than months.
  - Works with the testers to ensure that all software
    components are tested adequately and participates in
    quality assurance testing as the IT workload requires.
  - Provides guidance to stakeholders on devising effective and
    efficient approaches to achieve project and program
    objectives.
  - Manages engineering risks by proactively tracking and
    communicating issues and devising methods to mitigate
    them.
  - Leads architecture and design discussions. Interfaces with
    other project and program areas to coordinate
    interdependencies and resolve issues.
  - Provides input to the TDM and DPM in creation of the product
    roadmap with high level estimates.
  - Maintains a working knowledge of new technology and new
    software development best practices and trends.
  - Establish and advocate engineering and software development
    culture, standards, and processes across the company,
    coaching and mentoring newer members.

  Ideal Candidate Profile:

  - Bachelor’s Degree in Computer Science or related technical
    field or equivalent professional experience.
  - 8-10 years of software development experience as a hands-on
    experience as a full stack developer with a demonstrated
    ability to deliver high-quality software including front
    end development, backend/API development, data/database
    modeling and design, test driven development, automated
    testing.
  - Strong Javascript development experience with common
    frameworks like React and Node.
  - Strong Python development experience.
  - Experience using AI development techniques (Claude, Gemini,
    etc) with success to drive solutions quicker.
  - Knowledge in building serverless application components in
    either Azure or AWS.
  - Demonstrated ability and desire to learn new programming
    languages and frameworks required.
  - Experience in multiple infrastructure and application
    domains – cloud, network, storage, servers,
    containers/Kubernetes, databases, middleware, DevOps.
  - Broad knowledge of software development techniques,
    processes, methods, and best practices.
  - Experience with DevSecOps, and Continuous
    Integration/Delivery (CI/CD) solutions and tools – GIT,
    Jenkins, Artifactory/Nexus, code analysis, quality gates,
    etc.
  - Strong strategic decision making & long-term planning
    abilities to manage resources and develop efficient and
    effective solutions to diverse and complex business
    problems.
  - Strong understanding of Agile development methods and its
    application to company technology needs.
  - Ability to consult with business stakeholders and provide
    thoughtful, practical recommendations to meet their needs.
  - Expert collaboration skills, both within and outside of the
    direct team.
  - Strong management and leadership skills.
  - Strong work ethic with an eye towards continuous
    improvement, innovation, and efficiency.
  - Demonstrated success in behaviors consistent with the
    Vantage values.
  - Excellent interpersonal, written and oral communication
    skills.
  - Ability to process and adapt to change in a rapid growth
    company environment. Vantage associates are expected to be
    curious, thrifty, and resourceful to manage through the
    unknowns of growing a specialty (re)insurance business
    from the ground up.

  Our Vantage Values

  Do What’s Right – be a force for good, for our customers,
  shareholders, colleagues, industry and communities. Be
  Relentlessly Curious – ask questions, listen to understand,
  challenge the status quo, look for ways to say YES, drive
  innovation, be opportunistic and disciplined. We’re Better
  Together – collaborate, be inclusive, supportive, respectful
  and humble, be a trusted partner internally and externally.
  Be Transparent – in who you are, what you think, and how you
  work, seek and provide alternative points of view, be true
  to yourself. Make A Difference – focus on impact, embrace
  technology, leverage data and analytics as critical assets,
  act intentionally to deliver on our mission.

  We value diversity and are committed to creating an
  inclusive environment for all employees. At Vantage, we
  strive to build and foster a culture where inclusiveness is
  ingrained, not just an initiative. All colleagues support
  building an inclusive environment where employees feel
  empowered to share their experiences and ideas to foster an
  environment which encourages you to "Be You!" We are proud
  to be an equal opportunity employer.



  Vantage Risk Companies are engaged in the business of
  insurance. As a result, all employees are subject to
  employment eligibility requirements imposed by applicable
  federal and state laws governing insurers. Individuals who
  have been convicted of a felony may be prohibited from
  engaging in the business of insurance without prior written
  consent from the applicable regulatory authority. Possessing
  a criminal record free from felony offenses involving
  dishonesty, breach of trust, or violation of financial
  regulations is a bona fide occupational qualification for
  all roles at Vantage Risk Companies.



  In connection with our business, Vantage may collect and
  process your personal data. For further information
  regarding how we use this data, please see our online
  privacy notice at Vantage Recruiting Privacy Notice.


