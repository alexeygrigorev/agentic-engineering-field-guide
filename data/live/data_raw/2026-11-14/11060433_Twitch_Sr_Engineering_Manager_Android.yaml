description: |
  About Us

  Twitch is the world’s biggest live streaming service, with
  global communities built around gaming, entertainment,
  music, sports, cooking, and more. It is where thousands of
  communities come together for whatever, every day.

  We’re about community, inside and out. You’ll find coworkers
  who are eager to team up, collaborate, and smash (or
  elegantly solve) problems together. We’re on a quest to
  empower live communities, so if this sounds good to you, see
  what we’re up to on LinkedIn and X,  and discover the
  projects we’re solving on our Blog. Be sure to explore our
  Interviewing Guide to learn how to ace our interview
  process.

  About the Role

  Join Twitch's Product Core Engineering team and help power
  the future of our innovative, global platform. As a Sr.
  Engineering Manager for the Android Platform team, you'll
  play a pivotal role in shaping the strategic vision and
  execution for Twitch's cutting-edge mobile experiences.

  Our mission is to empower engineers to build delightful,
  secure, and reliable experiences for our passionate
  communities worldwide. You'll be a key driver of this
  vision, leading a talented team that delivers the core
  tools, services, and frameworks that Twitch Builders
  leverage to innovate on the Android platform. Collaborate
  cross-functionally to identify new opportunities, align on
  priorities, and deliver seamless mobile experiences that wow
  our users. Drive continuous improvement in the quality and
  performance of our Android apps and champion a culture of
  innovation that embraces diverse perspectives and moves
  boldly.

  This is an exciting opportunity to make a tangible impact on
  the Twitch platform and the millions of creators and
  communities we serve. If you're a seasoned Android expert
  with a passion for building game-changing mobile products,
  we want to hear from you!

  You can work from San Francisco, CA; Seattle, WA; or New
  York, NY.

  You Will:

  - Craft an inspiring strategic vision for your team and forge
    impactful partnerships - both with product management and
    the iOS Platform team - to shape Twitch's cutting-edge
    mobile platform strategy.
  - Architect a bold roadmap and deliver transformative software
    that brings your vision to life.
  - Increase the rate we launch features for our creators and
    viewers by providing a first class developer experience.
  - Drive relentless improvements to our software development
    processes, metrics, testing, and operational excellence -
    elevating the team to new heights of efficiency and
    impact.
  - Define insightful KPIs to track team progress, delight
    customers, and advance operational excellence.
  - Communicate your passion and ideas with eloquence,
    captivating audiences across the organization.
  - Foster a collaborative, innovative culture - harmonizing
    diverse viewpoints and adeptly resolving complex
    challenges.
  - Nurture the careers of your talented engineers, empowering
    them to reach new levels of growth and success.

  You Have:

  - 5+ years of professional mobile software development
    experience.
  - 3+ years as an engineering manager or team lead.
  - Experience shipping Android apps at scale.
  - Experience hiring and developing remote engineers under your
    guidance.
  - Experience collaborating with product managers, designers
    and other engineering leaders in cross-functional groups.

  Bonus Points

  - Familiarity with react-native or equivalent mobile web
    technology
  - B.S. or M.S. in Computer Science, Computer Engineering, or a
    related, technical discipline

  Perks

  - Medical, Dental, Vision & Disability Insurance
  - 401(k)
  - Maternity & Parental Leave
  - Flexible PTO
  - Amazon Employee Discount



  Pursuant to the San Francisco Fair Chance Ordinance, we will
  consider for employment qualified applicants with arrest and
  conviction records.

  Job ID: TW9281

