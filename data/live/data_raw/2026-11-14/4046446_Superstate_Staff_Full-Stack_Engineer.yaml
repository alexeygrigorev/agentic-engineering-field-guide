description: |
  Tired of the inefficiencies and complexities of traditional
  finance? We are too. At Superstate, we create investment
  products that benefit from the speed, programmability, and
  compliance advantages of blockchain tokenization.



  As a staff full stack engineer at Superstate, you will help
  lead our team in building well designed user experiences
  that are unique, trustworthy and scalable across all
  Superstate frontend properties. You will also be given the
  opportunity to influence the direction, design and execution
  of all future product experiences.

  What you'll do

  - Lead long term technical direction and vision for
    maintaining and scaling our web products
  - Build functional UI elements from design mocks, with an
    emphasis on performance, reliability and accessibility
  - Work with Product, Design and Engineering to implement a
    functional, user-friendly and delightful experience
  - Build a unified styles library for use across all products
  - Enthusiastically collaborate with a small team, owning and
    planning projects for long-term impact
  - Teach and mentor other engineers

  What you'll bring to the team

  - Bachelor’s degree in Computer Science or a related technical
    field
  - 9+ years of professional engineering experience
  - Proven track record in developing web applications and
    shipping user facing features
  - Familiarity with current trends and best practices in front-
    end architecture, including performance, security and
    usability
  - Familiarity with the current DeFi ecosystem
  - Exceptional judgment, strategic thinking and creative
    problem-solving skills with a strong analytical mindset

  Bonus points if you have experience with these technologies

  - TypeScript
  - Svelte
  - Frontend technologies like React, HTML, and CSS
  - Web3 frontend stack, such as web3.js, ethers.js, etc.
  - Experience creating component libraries
  - Functional programming language experience
  - Postgres or SQL
  - Rust
  - Experience with Solidity

  Benefits + Perks

  - Competitive compensation
  - Equity ownership
  - Flexible vacation policy
  - Paid parental leave
  - Full medical, dental, and vision insurance

  We are an equal opportunity employer and value diversity at
  our company. We welcome qualified candidates of all races,
  creeds, genders, age, veteran status and sexuality to apply.

  Founded in 2023, Superstate is backed by leading investors
  including Distributed Global, CoinFund, Breyer Capital,
  Galaxy, ParaFi, 1kx, and Cumberland.
