description: |
  Job Description:

  Lead the Future of Digital Commerce

  Are you passionate about building modern, high-performance
  front-end experiences at scale? Do you thrive in a role
  where you can shape architecture, write code, and mentor
  others? If so, this opportunity is for you.

  We’re looking for a Frontend Commerce Architect to help lead
  the design and delivery of cutting-edge, composable commerce
  solutions. In this role, you’ll combine hands-on development
  with technical leadership—working alongside cross-functional
  teams to create seamless, scalable, and engaging digital
  experiences.

  What You’ll DoShape Front-End Architecture

  - You’ll design and build modern, headless front-end
    architectures using React, Next.js, and Angular
  - You’ll define rendering strategies (SSR, SSG, ISR) to
    deliver fast, scalable applications
  - You’ll lead the development of reusable component libraries
    and design system integrations
  - You’ll guide the adoption of micro frontend and composable
    architecture approaches

  Drive Commerce Innovation

  - You’ll help design API-first, headless commerce solutions
    that integrate across platforms
  - You’ll partner with backend teams to ensure seamless
    performance and scalability
  - You’ll bring together commerce, content, and third-party
    services to create cohesive experiences

  Own Data & Integration Strategy

  - You’ll architect GraphQL-based data layers that connect
    front-end applications to multiple services
  - You’ll ensure performance through smart caching, query
    optimization, and type-safe integrations

  Deliver High-Performing Experiences

  - You’ll optimize Core Web Vitals and ensure fast, responsive
    user experiences
  - You’ll build accessible solutions aligned with WCAG
    standards
  - You’ll apply modern best practices for performance,
    security, and scalability

  Lead, Mentor, and Collaborate

  - You’ll mentor engineers and support team growth while
    staying hands-on
  - You’ll collaborate with product, design, and engineering
    partners
  - You’ll help solve complex technical challenges and guide
    teams through implementation

  What You Bring

  - You have strong experience building modern front-end
    applications with React, Next.js, Angular, and TypeScript
  - You’re comfortable designing scalable architectures and
    making technical decisions
  - You have experience working with GraphQL and API-driven
    systems
  - You’ve helped deliver high-performance digital experiences
    at scale
  - You enjoy mentoring others and contributing to a
    collaborative team environment
  - You understand or have worked with headless or composable
    commerce architectures

  Tech You’ll Work With

  - React, Next.js, Angular, JavaScript, TypeScript
  - GraphQL (Apollo or similar)
  - Webpack, Vite, monorepos
  - Headless CMS and composable commerce platforms
  - Modern performance, accessibility, and security standards

  Why You’ll Love This Role

  - You’ll work on high-impact, enterprise-scale commerce
    platforms
  - You’ll have a voice in defining technical direction and best
    practices
  - You’ll balance hands-on development with strategic
    leadership
  - You’ll collaborate with talented teams solving meaningful
    challenges

  Interested?

  If you’re excited about building modern commerce experiences
  and want to make a real impact, we’d love to talk!

  At dentsu, we believe great work happens when we’re
  connected. Our way of working combines flexibility with in-
  person collaboration to spark ideas and strengthen our
  teams. Employees who live within a commutable distance of
  one of our hub offices, currently located in Chicago, metro
  Detroit, Los Angeles, and New York City, are required and
  expected to work from the office three days per week (two
  days per week for employees based in Los Angeles). Dentsu
  may designate other Hub offices at any time. Those who live
  outside a commutable range may be designated as remote,
  depending on the role and business needs. Regardless of your
  work location, we expect our employees to be flexible to
  meet the needs of our Company and clients, which may include
  attendance in an office.



  The annual salary range for this position is $113,000 -
  $158,750. Placement within the salary range is based on a
  variety of factors, including relevant experience,
  knowledge, skills, and other factors permitted by law.



  Benefits available with this position include:

  • Medical, vision, and dental insurance,

  • Life insurance,

  • Short-term and long-term disability insurance,

  • 401k,

  • Flexible paid time off,

  • At least 15 paid holidays per year,

  • Paid sick and safe leave, and

  • Paid parental leave.

  Dentsu also complies with applicable state and local laws
  regarding employee leave benefits, including, but not
  limited to providing time off pursuant to the Colorado
  Healthy Families and Workplaces Act, in accordance with its
  plans and policies. For further details regarding Dentsu
  benefits, please visit www.dentsubenefitsplus.com.



  To begin the application process, please click on the
  “Apply” button at the top of this job posting. Applications
  will be reviewed on an ongoing basis, and qualified
  candidates will be contacted for next steps.

