  Lending Manager (Front End)

  About the role

  Knock is looking for an experienced mortgage leader to
  manage and grow our team of fully remote Loan Assistants.
  This is a 100% remote role, and you’ll lead a team
  distributed across the country. You enjoy building teams,
  finding efficiencies, and using technology to improve how
  work gets done. You’re approachable, open-minded, and
  adaptable. You know the work well enough to coach it and
  you’re willing to jump in and help. In this role you’ll own
  the Loan Assistant and post-closing pipelines, develop your
  team, and work with the Director of Lending Operations to
  make our processes better.

  What you’ll do:

  Lead and develop the team

  - Manage, lead, and scale the remote Loan Assistant team.
  - Share weekly, monthly, quarterly, and annual team and
    company goals, and make sure the team meets and exceeds
    expectations.Hold team members accountable for their
    performance.
  - Build camaraderie and teamwork in a virtual environment
    through team meetings and regular 1:1 check-ins.
  - Run virtual training for new Loan Assistants and serve as
    the team’s go-to for escalations, questions, and
    exceptions.
  - Mentor people inside and outside your team, and keep
    learning yourself.
  - Document conversations in our HRIS and build a sense of
    ownership across the team.

  Own the pipeline

  - Manage the bridge loan pipeline from setup through initial
    disclosure and submission, and through post-closing
  - Coach the team and give feedback along the way
  - Balance workloads across the team to meet company SLAs
  - Manage post-closing
  - Work loans that have findings with the team member
    responsible and get them resolved
  - Work closely with Sales, Underwriting, and Closing to give
    everyone timely, accurate service
  - Compile team scorecard data each quarter to track KPIs and
    quality

  Improve how we work

  - Help the Director of Lending Operations find gaps in process
    and policy across the Loan Assistant and post-closing
    functions
  - Write or update procedures for review, training, and
    rollout, then follow up to make sure the changes stick
  - Set best practices and change the workflow when needed so
    the team runs efficiently and meets company KPIs
  - Take on ad hoc projects and step in wherever your team needs
    support

  What you’ll bring

  - At least 10 years of relevant mortgage experience, including
    5 or more years directly managing a fully remote team
  - Experience managing mortgage loan processing and/or post-
    closing teams
  - A track record of coaching teams and helping them succeed
  - Working knowledge of federal, state, and local mortgage
    regulatory compliance
  - Strong written and virtual communication skills
  - You keep a distributed team aligned, engaged, and
    accountable using tools like Slack and video meetings
  - A strong focus on customer service. You go above and beyond
    to “wow” the people you serve
  - Close attention to detail. You check your work carefully and
    catch the small things, so your work is consistently
    accurate
  - A commitment to diverse, equitable, and inclusive practices
    that support Knock’s values of making an impact, learning,
    putting people first, being open, and being courageous
  - High school diploma or equivalent experience

  Physical Requirements:

  - Set up and constantly operate a computer
  - Communicate and exchange accurate information to others via
    telephone or internet video applications

  The candidate must be able to perform the essential
  functions of the job, with or without reasonable
  accommodation.

