description: |
  Daymark Health is a value-based oncology company redefining
  the cancer care experience for patients, providers, and
  health plans. Daymark’s comprehensive, personalized cancer
  care platform empowers patients with dedicated care
  navigation, symptom-focused support, behavioral health care,
  and social resources. Combined with evidence-based health
  interventions and a hybrid in-person + virtual care model,
  Daymark is improving the overall cancer experience for
  patients, providers, and health plans – and setting a new
  standard in cancer care.

  Daymark’s groundbreaking approach is led by CEO Dr. Justin
  Bekelman, a pioneer in transforming cancer care, alongside
  some of the nation’s foremost leaders in oncology and value-
  based care. Daymark Health is backed by Maverick Ventures,
  Yosemite, Oncology Ventures, Healthier Capital, Blue Venture
  Fund, and Healthcare Foundry.

  Be cautious of recruitment fraud, and always confirm that
  communications are coming from an official Daymark Health
  email.

  WHAT YOU'LL DO

  As a Software Engineer at Daymark Health, you will
  contribute to our technical strategy, build secure and
  scalable infrastructure, and play a key role in the
  development of our core product. You will work closely with
  our other engineers, product, and data teams, operational
  leadership, and external customers to shape a transformative
  cancer care experience across the stack. We expect you to
  hit the ground running and help bring our product to market:

  - Build alongside a strong team: Contribute to the development
    of our cancer care platform, with an emphasis on user
    experience, workflow integration, and security. You'll
    need to move fast, so comfort with tools like Claude,
    Cursor, and openness to experimentation will help our team
    build and operate more efficiently.
  - Technical execution: Collaborate with operations, product,
    data engineering, and analytics to build the core systems
    and tools that enable our care team to serve patients as
    efficiently and effectively as possible.
  - Security & compliance: Follow secure development practices
    and handle protected health information (PHI) with care,
    working within the HIPAA and SOC 2 controls our team
    maintains.

  WHAT WE ARE LOOKING FOR

  - Strong technical foundation: You have 2+ years of experience
    designing and building user-centric products, and you
    write code you're proud to have reviewed. You're
    comfortable working across the stack and picking up
    unfamiliar parts of a system. Our stack uses python and
    AWS managed services (EventBridge, Lambda, DynamoDB).
  - AI-native builder: You're fluent with AI coding tools (e.g.,
    Claude, Cursor, GitHub Copilot) and actively incorporate
    them into your workflow to move faster and write better
    code. You see AI-assisted development as a core skill, not
    a shortcut.
  - Healthcare experience: Familiarity with healthcare
    technology, including EHRs and interoperability standards
    (e.g., FHIR, HL7), is a plus.
  - Action-oriented: You move with purpose and urgency, thriving
    in environments where speed and adaptability are crucial.
    You know how to prioritize and execute effectively in a
    fast-paced setting. We’re early on in our journey and move
    quickly – we expect you to do the same.
  - Clear communicator: You can communicate effectively with
    both technical and non-technical stakeholders.
  - Customer-focused: You enjoy engaging directly with
    customers, understanding their challenges, and leveraging
    their feedback to improve the product. You’re comfortable
    explaining technical concepts to non-technical
    stakeholders and adjusting solutions based on real-world
    feedback.
  - Comfortable with ambiguity: Startups are unpredictable, and
    you're skilled at adapting to rapid changes, balancing
    competing priorities, and navigating evolving business
    landscapes.

  Additional Information

  The expected compensation for this role is $145,000 to
  $160,000 annually, depending on location & experience.

  This role is fully remote.

  Daymark Health is an equal opportunity employer, and all
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, age,
  sex, national origin, disability status, genetics, protected
  veteran status, sexual orientation, gender identity or
  expression, or any other characteristic protected by
  federal, state or local laws.

  All Daymark Health patient-facing roles require Basic Life
  Support (BLS) certification and compliance with Daymark's
  Employee Vaccination and Testing policy. Candidates without
  these at the time of hire should coordinate with their
  recruiter and hiring manager to ensure they meet the
  requirements by their start date.

  All roles that require in-home visits to patients must
  provide proof of a valid driver's license.
