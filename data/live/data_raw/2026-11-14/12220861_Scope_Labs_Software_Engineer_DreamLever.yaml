description: |
  DreamLever / MilesAI Inc. New York City preferred (Hybrid)



  About DreamLever



  DreamLever is the AI a company shares. It learns the
  business through meeting conversations, connects what's
  happening across people, teams, and goals, and uses AI
  agents to move work forward.



  Founded by Brandon Katz, a former Chief of Staff who helped
  scale a company from 35 to more than 250 people, DreamLever
  turns firsthand experience building and running a company's
  management system into software. The product is live with
  paying customers, including a company with roughly 145
  weekly active users across departments. Our external
  engineering partner, Scope Labs, helped build the product
  and continues to contribute, providing engineering support
  and knowledge of the existing system as we build our in-
  house team.



  The Role



  As a Software Engineer at DreamLever, you'll join our small
  in-house engineering team and help build and ship a live,
  customer-facing product. You'll write code every day, take
  features from idea to release, and grow quickly with hands-
  on support from DreamLever's founding engineer and founder.



  You'll collaborate closely with the founding team: the
  founder who leads the product vision and prototypes in
  detail, and the founding engineer who sets the technical
  direction. Expect regular working sessions, code reviews,
  and pairing, plus room to take real ownership of features as
  you ramp up.



  What You'll Do



  - Ship product improvements. Build across the full stack,
    using coding agents effectively to move faster and ship
    well-tested code regularly.
  - Turn product direction into working software. Take
    direction, prototypes, and feedback from the founder and
    founding engineer through implementation and polish, and
    confirm the finished experience does what customers need.
  - Collaborate with the founding team. Work side by side with
    the founder and founding engineer on planning, technical
    decisions, and code review, and bring your own ideas to
    the table.
  - Learn the existing system. Get to know the architecture,
    integrations, and data flows well enough to build
    confidently on a live codebase.
  - Help improve Miles's AI quality. Support work on how Miles,
    DreamLever's AI Chief of Staff agent, uses company context
    and takes action: evaluate its outputs, investigate
    failures, and iterate on reliability.
  - Keep the codebase healthy. Fix bugs, add tests, and keep
    code and documentation clear so the team can move faster
    and safer.



  Who You Are



  - A builder who ships. You love writing software, use coding
    agents fluently, and take responsibility for the quality
    of your work.
  - A fast learner. You get oriented in unfamiliar codebases,
    ask focused questions, and turn direction into working
    software without needing every step spelled out.
  - Focused on outcomes. You understand what a change is meant
    to do for the customer and follow through until it does.
  - Solid across the stack. You can work through backend
    systems, integrations, data models, and user-facing
    experiences, and you debug methodically.
  - Curious about AI. You're interested in how LLM-powered
    features work and how context, evaluation, and system
    design affect their quality.
  - Collaborative and open to feedback. You enjoy working
    closely with founders and teammates, take feedback well,
    and care more about a great result than whose idea wins.
  - Energized by an early-stage pace. You want real ownership
    and the drive to keep up a high level of output.



  Qualifications



  - Approximately 2–4 years of experience building and shipping
    production software, with ownership of features from
    implementation through release
  - Strong full-stack engineering skills, including experience
    with APIs, integrations, and asynchronous workflows
  - Demonstrated ability to learn, extend, and improve an
    existing production codebase
  - Hands-on experience using AI coding agents to accelerate
    development; experience shipping LLM-enabled features is a
    plus
  - Solid computer-science fundamentals, whether developed
    through formal study or practical experience
  - Experience working with founders, product leaders, or other
    non-engineering stakeholders is a plus
  - Clear written and verbal communication
  - US-based. New York City area strongly preferred; remote
    candidates will still be considered
  - Familiarity with our current stack: TypeScript (Next.js +
    React), Postgres (Supabase)



  We care more about demonstrated ability, judgment, passion,
  and ownership than exact years of experience or résumé
  shape. If this sounds like your kind of work, we'd love to
  hear from you.



  Compensation



  Base salary: $120,000 to $180,000, depending on experience
  and demonstrated ability.



  Americans with Disabilities Statement



  Must be able to perform all essential functions of this
  position with reasonable accommodation.



  EEO Statement

  We are an Equal Opportunity Employer. Our goal is to be a
  diverse workforce that is representative, at all job levels,
  of the communities we serve. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  gender expression, national origin, protected veterans'
  status, and will not be discriminated against on the basis
  of disability or any other applicable legally protected
  characteristic.
