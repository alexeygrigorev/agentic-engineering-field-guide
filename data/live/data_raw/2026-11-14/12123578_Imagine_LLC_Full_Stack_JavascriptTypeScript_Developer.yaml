description: |
  What You'll Build

  As a Full Stack JavaScript/TypeScript Developer, you'll
  architect and build the integration layer connecting HubSpot
  CRM to client business systems—ERPs, finance platforms,
  marketing tools, and custom applications. You'll own
  projects from requirements gathering through deployment,
  working directly with clients to translate business needs
  into technical solutions.

  You'll also contribute to our Product Development Team,
  building applications that make selling easier and more
  enjoyable. We develop products that help revenue teams
  operate better, faster, and cheaper by automating business
  processes, aligning data, and reducing technical debt.

  Our clients are mid-market to enterprise companies in
  manufacturing, construction materials, and distribution. The
  integrations you build will process real business data at
  scale.

  Our Stack

  JavaScript/TypeScript, Node.js (v20+), Express, React,
  Google Cloud Firestore, Heroku. You'll work extensively with
  HubSpot's custom coded actions, serverless functions, UI
  Extensions, APIs (CRM, Sequences, Conversations, Commerce,
  etc.), and more.

  Day-to-Day Responsibilities

  - Architect and build custom API integrations between HubSpot
    and client tech stacks
  - Build and maintain HubSpot Developer Projects including UI
    Extensions, App Cards, and serverless integrations
  - Write JavaScript/TypeScript automation actions using HubSpot
    Operations Hub custom coded workflows
  - Configure integration workflows, webhooks, and field
    mappings across platforms
  - Collaborate directly with clients to gather requirements and
    present technical solutions
  - Own code quality through testing, code review, and bug
    resolution
  - Contribute to internal product development alongside our
    product manager
  - Help define development standards and DevOps processes as
    our team grows

  What We're Looking For

  Required:

  - 2-5 years of professional development experience, or
    equivalent demonstrated work
  - Highly proficient in JavaScript/TypeScript
  - Strong experience with Node.js (v20+) and Express or modern
    alternatives (Fastify, Hono)
  - React experience required for HubSpot UI Extensions and App
    Cards
  - Experience with RESTful APIs, webhooks, and OAuth
    authentication flows
  - Proficiency with AI coding assistants (GitHub Copilot,
    Claude/Claude-Code, Cursor) and the ability to critically
    evaluate AI-generated code
  - Strong attention to detail and organizational skills
  - Comfortable making technical decisions with incomplete
    information
  - Clear written communication (we're async-first)
  - Sound business judgment—you can make tradeoffs and
    prioritization decisions that help the client

  Nice to Have:

  - Experience with HubSpot APIs (CRM, Sequences, Conversations,
    Commerce) or HubSpot certifications
  - Experience integrating with Salesforce, Microsoft Dynamics,
    NetSuite, etc.
  - Experience with e-commerce platforms or payment APIs
  - Experience integrating with ERP & CPQ platforms and
    homegrown ERP & CPQ systems
  - Familiarity with RevOps concepts: lead management, data
    pipelines, reporting
  - Experience shipping features in a SaaS product environment

  How We Work

  We use AI tools like Claude-Code as thinking accelerators,
  not replacements. You'll leverage these tools while
  maintaining the judgment to know when AI output needs human
  refinement. We value developers who think critically about
  their code, regardless of how it was initially generated.

  You'll lead integration projects across 3-5 active client
  engagements, balancing delivery timelines with code quality.
  We value direct communication and don't take ourselves too
  seriously.

  What We Offer

  - Remote: Fully remote with async-first communication.
  - Benefits: Health insurance (includes vision & dental),
    Unlimited PTO
  - Growth: Path to Senior Engineer role with increasing
    technical leadership and client ownership
  - Impact: Shape development standards and processes as we grow
    our technical services. Directly impact client operations
    and capabilities.

  Why Lift

  - We're a small team without big egos. We take our work
    seriously but never take ourselves too seriously.
  - You won't be micromanaged. We trust you to do your work
    well.
  - Our technical services are growing fast—lots of opportunity
    for growth.
  - We have a track record for being ahead of the curve. Master
    the strategies, tactics, and tools you'll need before most
    organizations are even aware of them.
  - This is a crucial role where your contributions will be
    vital to our success.
