description: |
  This role is for one of our clients

  Pay: 50–100/hour

  Location: Global, fully remote

  Job Type: Contractor (~15 hours per week)

  Schedule: Flexible — you choose the hours and days you work,
  including weekends if desired, as long as there is activity.

  Required Skills: Python, React, JavaScript, Java, Node.js,
  Rust, Golang, TypeScript

  We are looking for highly skilled Full-Stack Software
  Engineers to contribute to an AI training project involving
  software development, technical problem-solving, debugging,
  system architecture, and code evaluation.

  We are seeking an experienced Senior Full-Stack Software
  Engineer with strong hands-on expertise across both front-
  end and back-end development. The role involves creating,
  solving, reviewing, and validating complex software-
  engineering tasks across the application stack, as well as
  translating complete software implementations from one
  programming language to another.

  The ideal candidate should have substantial experience
  building and maintaining production-grade applications,
  working across multiple programming languages, and
  understanding end-to-end system architecture. You should be
  comfortable navigating unfamiliar codebases, debugging
  complex issues, evaluating technical solutions, and ensuring
  code quality, performance, security, and maintainability.

  Requirements

  Key Responsibilities

  - Full-Stack Development: Develop, enhance, and debug front-
    end and back-end components across production
    applications.
  - Feature Implementation: Build user-facing features and the
    supporting services, APIs, database structures, and data
    models.
  - End-to-End Troubleshooting: Trace requests and data flows
    across browsers, front-end applications, APIs, back-end
    services, databases, and third-party integrations.
  - Codebase Analysis: Navigate unfamiliar repositories,
    understand existing application architecture, and identify
    dependencies and implementation patterns.
  - Complex Debugging: Diagnose and resolve issues involving
    application state, API contracts, authentication, data
    persistence, network communication, and deployment.
  - Cross-Language Development: Evaluate, modify, translate, and
    improve software implementations across multiple
    programming languages while preserving functionality and
    correctness.
  - Code Review and Validation: Assess AI-generated and
    developer-written code for correctness, completeness,
    efficiency, security, scalability, and maintainability.
  - Technical Problem-Solving: Design reliable solutions to
    challenging engineering problems and validate
    implementations against defined requirements and
    specifications.

  Required Qualifications

  - Significant professional experience developing and
    maintaining production-grade full-stack applications.
  - Strong hands-on expertise in both front-end and back-end
    software engineering.
  - Professional experience working with multiple programming
    languages and adapting to different technology stacks.
  - Solid understanding of browser-based applications, APIs,
    application state management, databases, and service
    integrations.
  - Experience designing, understanding, and contributing to the
    architecture of complete software systems.
  - Ability to navigate unfamiliar codebases and quickly
    understand existing implementations.
  - Strong debugging, analytical thinking, and problem-solving
    capabilities.
  - Experience reviewing code and evaluating solutions for
    performance, reliability, security, and maintainability.
  - Ability to work independently, manage complex technical
    tasks, and deliver high-quality results.

  Selection Process

  - Submit an application and complete the initial screening
    questions.
  - Participate in an AI interview lasting approximately 30
    minutes.
  - Complete a technical assessment, if required.
  - Proceed through the hiring manager review.

  Compensation Structure

  Compensation is output-based, with payment provided for each
  task that meets the specified project requirements and
  quality standards. Task complexity and completion time may
  vary depending on the nature of the work, the engineer’s
  experience, and their workflow.

  Minimum submission requirements apply, and selected
  engineers must complete and submit a specified minimum
  number of tasks each week.

  Start Timeline and Availability

  The hiring process typically moves quickly, with roles often
  filled within 48 hours. Candidates should be available to
  begin immediately. Upon selection and completion of
  onboarding, engineers are expected to start their first
  tasks within 24–48 hours.
