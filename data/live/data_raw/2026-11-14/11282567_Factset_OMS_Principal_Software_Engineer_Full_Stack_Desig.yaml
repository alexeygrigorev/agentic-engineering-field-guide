description: |
  FactSet creates flexible, open data and software solutions
  for over 200,000 investment professionals worldwide,
  providing instant access to financial data and analytics
  that investors use to make crucial decisions.

  At FactSet, our values are the foundation of everything we
  do. They express how we act and operate, serve as a compass
  in our decision-making, and play a big role in how we treat
  each other, our clients, and our communities. We believe
  that the best ideas can come from anyone, anywhere, at any
  time, and that curiosity is the key to anticipating our
  clients’ needs and exceeding their expectations.

  We are seeking a talented and experienced Principal Software
  Engineer to join our engineering team. In this role, you
  will help design and develop financial trading applications.
  You will be part of a passionate team working on mission-
  critical systems, leveraging object-oriented programming,
  primarily in Java, to build scalable, robust trading
  applications.

  Responsibilities:

  - Design, develop, and maintain high-performance Order
    Management System (OMS) features across both backend
    (Java) and frontend components.

  - Collaborate with product managers and other engineers to
    translate requirements into effective technical solutions.

  - Participate in code reviews, mentor junior engineers, and
    uphold high standards for code quality, usability, and
    performance.

  - Optimize application performance for both backend processes
    and frontend user experience, focusing on scalability and
    low latency.

  - Troubleshoot and resolve complex technical issues spanning
    both frontend and backend systems within a fast-paced
    financial trading environment.

  - Contribute to feature planning, architectural discussions,
    and technical documentation.

  Job Requirements:

  - 10+ years of software engineering experience required

  - Excellent problem-solving and execution skills
  - Knowledge of the financial trading ecosystem
  - Full-stack engineering experience

  Education:

  - Bachelor’s degree in computer science or relevant

  The budgeted salary range for this position in the states of
  Connecticut and New York is $210,000.00 - 270,000.00

  Company Overview:

  FactSet (NYSE:FDS | NASDAQ:FDS) helps the financial
  community to see more, think bigger, and work better. Our
  digital platform and enterprise solutions deliver financial
  data, analytics, and open technology to more than 8,200
  global clients, including over 200,000 individual users.
  Clients across the buy-side and sell-side, as well as wealth
  managers, private equity firms, and corporations, achieve
  more every day with our comprehensive and connected content,
  flexible next-generation workflow solutions, and client-
  centric specialized support. As a member of the S&P 500, we
  are committed to sustainable growth and have been recognized
  among the Best Places to Work in 2023 by Glassdoor as a
  Glassdoor Employees’ Choice Award winner. Learn more
  at www.factset.com and follow us on X and LinkedIn.

  At FactSet, we celebrate difference of thought, experience,
  and perspective. Qualified applicants will be considered for
  employment without regard to race, color, religion, national
  origin, sex, sexual orientation, gender identity,
  disability, protected veteran status or other
  characteristics protected by law. FactSet participates in
  E-Verify
