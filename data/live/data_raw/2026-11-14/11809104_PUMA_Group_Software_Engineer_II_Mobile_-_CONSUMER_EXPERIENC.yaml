description: |
  SPEED & SPIRIT is what we look for in our candidates,
  defined by some simple values that inspire us to BE DRIVEN
  in our performance, BE VIBRANT in our sporting legacy, BE
  TOGETHER in our team spirit, and to let our individual
  talent and experience shine. Applying for a job at PUMA is
  easy.

  Simply click APPLY ONLINE and follow the steps to upload
  your application.

  YOUR MISSION

  About the Organisation & Role:

  You will be part of the Consumer Experience Engineering
  organisation responsible for building fast, intuitive,
  accessible and premium digital experiences across web and
  mobile. The organisation owns the web & mobile platforms,
  engineering delivery for consumer-facing journeys, shared
  design systems, performance, accessibility and AI-native
  engineering practices that help product teams deliver
  consistent, reusable, high-quality consumer experiences
  across the globe.

  The Software Engineer II (Mobile) is responsible for
  developing, testing, and maintaining high-quality consumer-
  facing mobile applications using modern mobile engineering
  practices. Working closely with Product Owners, Designers,
  Quality Engineers, and Engineering Leads, you will deliver
  scalable, performant, and user-centric mobile experiences
  across iOS and Android platforms.

  What you will do:

  ·       Develop and maintain cross-platform mobile
  applications using React Native, TypeScript, and JavaScript.

  ·       Build reusable, scalable, and maintainable
  components following modern mobile development practices.

  ·       Integrate REST and GraphQL APIs to deliver seamless
  and reliable user experiences.

  ·       Collaborate with Product, Design, QA, and
  Engineering teams to deliver business outcomes.

  ·       Implement state management solutions and application
  architecture patterns for scalable mobile applications.

  ·       Ensure application quality through unit testing,
  debugging, and proactive defect resolution.

  ·       Monitor, analyze, and resolve application crashes,
  performance issues, and production incidents.

  ·       Optimize mobile application performance,
  responsiveness, and reliability across devices and operating
  systems.

  ·       Participate in code reviews and contribute to
  engineering best practices, standards, and continuous
  improvement initiatives.

  ·       Support CI/CD pipelines and release activities to
  ensure efficient and reliable deployments.

  ·       Apply mobile accessibility and usability principles
  to create inclusive consumer experiences.

  ·       Contribute to Agile ceremonies including sprint
  planning, estimation, refinement, and retrospectives.

  ·       Collaborate with teams to validate experiments,
  feature rollouts, and A/B testing initiatives where
  applicable.

  YOUR TALENT

  - 4+ years of software engineering experience with a strong
    focus on mobile application development.
  - Strong hands-on experience with React Native and
    TypeScript/JavaScript development.
  - Solid understanding of iOS and Android fundamentals, mobile
    application lifecycle, and platform capabilities.
  - Experience building and maintaining consumer-facing mobile
    applications in production environments.
  - Strong knowledge of React fundamentals, component-based
    architecture, and reusable UI development.
  - Experience with state management solutions and modern
    frontend development practices.
  - Hands-on experience integrating RESTful APIs and/or GraphQL
    services into mobile applications.
  - Experience with mobile testing, debugging, troubleshooting,
    and quality engineering practices.
  - Strong understanding of mobile performance optimization,
    crash analysis, and application monitoring.
  - Experience using Git, code review processes, and
    collaborative software engineering workflows.
  - Familiarity with CI/CD fundamentals and mobile application
    release processes.
  - Experience working in Agile delivery environments using
    tools such as Jira, Confluence, or equivalent.
  - Understanding of mobile UX principles, accessibility
    standards, responsive design, design systems, component
    libraries and device compatibility considerations.
  - Strong problem-solving, communication, collaboration, and
    stakeholder engagement skills.
  - Experience with consumer, retail, eCommerce, or direct-to-
    consumer (DTC) digital products is preferred.

