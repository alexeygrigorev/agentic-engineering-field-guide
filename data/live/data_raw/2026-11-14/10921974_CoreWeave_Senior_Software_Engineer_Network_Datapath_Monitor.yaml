description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  What You'll Do:

  We are seeking a talented and experienced Senior Software
  Engineer to join our Network Datapath Team. As a Senior
  Software Engineer, you will play a critical role in
  designing, developing, and maintaining the networking
  software/hardware that underpins our GPU cloud services. As
  a Datapath Monitoring/Observability Engineer, you will focus
  on developing solutions and systems to provide high fidelity
  visibility into our services performance and fault detection
  through real time network telemetry and data analytic
  pipelines. You will collaborate closely with cross-
  functional teams to optimize network performance, enhance
  security, and ensure the overall scalability and reliability
  of our cloud platform.

  About the role:

  - Design, develop, and maintain the network datapath
    monitoring and observability infrastructure for our GPU
    cloud services, including host networking, smart NICs, and
    overlay/underlay networks.
  - Collaborate with cross-functional teams, including DevOps,
    Production and Data Platform Engineers, to ensure seamless
    integration of network datapath solutions.
  - Participate in an on-call rotation, troubleshoot and resolve
    network-related issues, and provide timely support to the
    operations team.
  - Stay up-to-date with the latest network telemetry and
    monitoring technologies, industry trends, and best
    practices to continually improve our networking
    infrastructure.
  - Participate in code reviews, design discussions, and
    architecture decisions to ensure high-quality software
    development practices.

  Who You Are:

  - Bachelor's or Master's degree in Computer Science, Computer
    Engineering, or a related field.
  - Proven experience (5+ years) as a Software Engineer, with a
    focus on networking and network observability.
  - Expertise in network protocols, routing, and security
    (TCP/IP, BGP, kernel networking, etc.) with a preference
    on cloud solutions.
  - Proficiency in programming languages such as Golang or
    Python for automation and scripting.
  - Experience with software-defined networking (SDN) and
    network virtualization technologies.
  - Experience in troubleshooting k8s networking and cloud
    infrastructure.
  - Excellent problem-solving skills and a proactive attitude
    towards troubleshooting and issue resolution.
  - Strong communication skills and the ability to collaborate
    effectively with cross-functional teams.
  - A passion for staying updated on emerging technologies and a
    commitment to continuous learning.

  Preferred:

  - Experience with k8s operators and controllers.

  Wondering if you're a good fit?

  We believe in investing in our people, and value candidates
  who can bring their own diversified experiences to our teams
  – even if you aren't a 100% skill or experience match.

  Why CoreWeave?

  At CoreWeave, we work hard, have fun, and move fast! We're
  in an exciting stage of hyper-growth that you will not want
  to miss out on. We're not afraid of a little chaos, and
  we're constantly learning. Our team cares deeply about how
  we build our product and how we work together, which is
  represented through our core values:

  - Be Curious at Your Core
  - Act Like an Owner
  - Empower Employees
  - Deliver Best-in-Class Client Experiences
  - Achieve More Together

  We support and encourage an entrepreneurial outlook and
  independent thinking. We foster an environment that
  encourages collaboration and enables the development of
  innovative solutions to complex problems. As we get set for
  takeoff, the organization's growth opportunities are
  constantly expanding. You will be surrounded by some of the
  best talent in the industry, who will want to learn from
  you, too. Come join us!

  The base salary range for this role is $153,000 to $204,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

