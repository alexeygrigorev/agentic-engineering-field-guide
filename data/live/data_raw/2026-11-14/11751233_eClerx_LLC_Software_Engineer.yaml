description: |
  Software Engineer

  Location: New York

  Type: Full-time, Hybrid

  Job Summary

  Help the eClerx US AI Organization build and deploy AI-
  enabled software for clients in financial services and other
  industries. Working with experienced engineers, domain
  specialists, and the product team, you will build agentic
  workflows and full-stack features, test them against real
  requirements, and help move promising demonstrations and
  MVPs into deployable software. This is an early-career role
  with room to develop your engineering judgment.

  Once you are integrated into the team, there might be
  client-facing work and opportunities depending on your team
  placement, such as joining client working sessions and
  presenting your work.

  Responsibilities

  - Build and improve agentic workflows, prototypes, application
    features, and APIs.
  - Implement authentication, authorization, secure
    configuration, and data integrations.
  - Test outputs and features against real requirements,
    investigate problems, and explain your findings.
  - Improve testing, logs, monitoring, and deployment, primarily
    on AWS and sometimes on GCP or Azure.
  - Contribute to work involving enterprise data platforms such
    as Databricks or Snowflake.
  - Learn from senior engineers and solution builders, and
    document changes for ongoing product ownership.
  - Follow developments in AI and in the industries you serve.

  Eligibility Requirements

  - Bachelor's or master's degree in computer science or
    software engineering.
  - 0–3 years of full-time experience building software products
    for customers or internal business users.
  - Proficiency in Python (or a comparable language), including
    writing, testing, and debugging code.
  - Experience with REST APIs, SQL, structured and unstructured
    data, and Git.
  - Hands-on experience building LLM-based applications or
    agentic workflows, through projects, internships, or work.
  - Ability to test AI outputs against requirements and identify
    failure modes.
  - Practical AWS experience and the ability to learn GCP or
    Azure.
  - An instinct to consider access, credentials, security, and
    reliability when designing a feature.
  - A proactive approach: you raise questions, flag issues
    early, and look for ways to improve the work without
    waiting to be asked.
  - Clear communication, collaboration, and ability to learn
    unfamiliar systems. Client-facing experience is welcome
    but not required.

  Preferred Qualifications

  - Familiarity with Docker and DevOps practices, including
    CI/CD pipelines, environments, and release processes.
  - Familiarity with fine-tuning models and with up-to-date AI
    models and their capabilities.
  - Exposure to Databricks, Snowflake, or a comparable platform.
  - Startup or early-stage product experience.
  - Exposure to financial services, including financial crime
    and compliance (FCC), know your customer (KYC), or anti-
    money laundering (AML); or to communications, media,
    telecommunications, finance and accounting industries.
  - Publications in top journals, teaching or mentoring
    experience, or open source contributions.

  In the US, the target base salary for this role is
  $75,000-$115,000. Compensation is based on a range of
  factors that include relevant experience, knowledge, skills,
  other job-related qualifications, and geography. We expect
  the majority of candidates who are offered roles at our
  company to fall throughout the range based on these factors

  About eClerx

  eClerx is a leading provider of productized services,
  bringing together people, technology and domain expertise to
  amplify business results. The firm provides business process
  management, automation, and analytics services to a number
  of Fortune 2000 enterprises, including some of the world’s
  leading financial services, communications, retail, fashion,
  media & entertainment, manufacturing, travel & leisure, and
  technology companies. Incorporated in 2000, eClerx is traded
  on both the Bombay and National Stock Exchanges of India.
  The firm employs more than 19,000 people across Australia,
  Canada, France, Germany, Switzerland, Egypt. India, Italy,
  Netherlands, Peru, Philippines, Singapore, Thailand, the UK,
  and the USA.

