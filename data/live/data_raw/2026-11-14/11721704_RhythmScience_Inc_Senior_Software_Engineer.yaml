description: |
  About the Role

  We’re looking for a Senior Software Engineer who thrives
  across the stack and has a passion for both infrastructure
  and automation. You’ll contribute to the development of core
  product features, improve system performance and
  scalability, and build automation workflows that support our
  internal team and customer needs.

  This is a high-impact role that involves direct
  collaboration with both technical and non-technical
  stakeholders. You’ll be helping scale infrastructure, ship
  features to production, and identify areas for workflow and
  test automation that support clinical operations and product
  delivery.

  This is a generalist, high-autonomy role where you’ll work
  across the full stack, infra, automation, and directly with
  users. Ideal for someone who thrives in a small, fast-paced
  environment and enjoys solving real-world problems across
  tech boundaries.

  What You’ll Do

  - Build and ship core product features across backend and
    frontend (Python, PostgreSQL, JavaScript/Vue.js)
  - Support and scale our Kubernetes infrastructure
  - Develop scalable test and workflow automation frameworks
    using Selenium and related tools
  - Collaborate directly with customers and internal
    stakeholders to understand business processes and identify
    automation opportunities
  - Design and integrate automation scripts into systems and
    pipelines (e.g., APIs, CI/CD, databases)
  - Conduct workflow analysis and propose efficient automation
    strategies that align with business goals
  - Contribute to system monitoring, alerting, and
    observabilityWrite clean, maintainable code with strong
    documentation and testing practices
  - Frequently interface with end users, clinical stakeholders,
    and internal ops to understand problems and ship
    practical, production-grade solutions fast
  - Stay current with industry best practices in test
    automation, DevOps, and healthcare tech

  What We’re Looking ForRequired Qualifications

  - Excellent communication and interpersonal skills, especially
    with non-technical stakeholders
  - 5+ years of experience in software engineering
  - Strong workflow/process mapping skills and attention to
    detail
  - Track record of delivering production-ready code and
    automation
  - Expert programming skills in Python and Django
  - Expertise in using Selenium and related tooling
  - Experience with Kubernetes (deployment, scaling, monitoring)
  - Experience working with AWS infrastructure
  - Proficiency with PostgreSQL
  - Experience with CI/CD tools (GitHub Actions, GitLab CI,
    etc.)
  - Comfortable working with REST APIs, browser dev tools, and
    debugging tools
  - Experience with observability tools (Datadog, Sentry,
    Grafana, Prometheus)
  - Prior exposure to health tech, PHI, or HIPAA-compliant
    systems

  Preferred Qualifications

  - JavaScript and VueJS experience
  - Knowledge of performance/load testing tools
  - Cloud experience with GCP or multi-cloud environments
  - Experience working directly with customers (consulting,
    customer success, or support roles)
  - Background in solution architecture, support engineering, or
    customer success
  - Familiarity with Agile/Scrum methodologies

  Why Join Us

  - Work across the full stack with high autonomy and ownership
  - Shape infrastructure, automation, and process from the
    ground up
  - Remote-first team with a kind, collaborative culture
  - Mission-driven work improving patient care in real time
  - Balanced, low-ego engineering environment with room to grow
  - As an early engineer, you’ll help shape our tech stack,
    processes, and culture. We value execution, empathy, and
    pragmatism over buzzwords or perfect
