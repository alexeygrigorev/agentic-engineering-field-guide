description: |
  👋 Welcome to Glide!

  At Glide we’re reimagining the banking experience for the
  modern world. Our embedded fintech platform empowers legacy
  financial institutions, like community banks and credit
  unions, to pioneer novel digital experiences for their
  customers.

  You’ll be joining an all-star team with engineering,
  product, and growth experience from Stripe, Google, and
  Amazon. We’re looking for a talented Fullstack Software
  Engineer to help us build our initial product. We’re
  bringing a new perspective to the decades-old financial
  world, and we’re hoping you can help us do that!

  Your Responsibilities

  - Lead and mentor a team of engineers, fostering growth,
    collaboration, and technical excellence.
  - Partner closely with product and design to define
    requirements, prioritize work, and translate business
    needs into scalable technical solutions.
  - Oversee development across frontend and backend, ensuring
    well-tested, secure, and performant code.
  - Establish and maintain best practices in engineering,
    including CI/CD, test automation, and code review.
  - Provide long-term technical vision for the evolution of
    Glide’s platform and infrastructure.
  - Help recruit and build a diverse, world-class engineering
    team.

  Need-to-Haves

  - Proven experience leading software engineering teams,
    including mentoring and performance management.
  - Strong technical foundation in fullstack development
    (JavaScript/TypeScript, React, Node.js, Next.js).
  - Experience designing and maintaining scalable, secure
    architectures.
  - Deep knowledge of modern frontend technologies (responsive
    HTML/CSS, state/data fetching libraries like React
    Query/TanStack or tRPC).
  - Familiarity with cloud infrastructure and DevOps practices
    (AWS, Docker, Git, CI/CD).
  - Excellent understanding of software engineering best
    practices: architecture, testing, and security.
  - Strong communication and collaboration skills, with the
    ability to partner effectively across functions.

  Nice-to-Haves

  - 7+ years of professional software engineering experience,
    with 2+ years in a management or team lead role.
  - Experience working in fintech or other highly regulated
    industries.
  - A passion for building products end-to-end, from concept to
    delivery.
  - An entrepreneurial, collaborative mindset and a desire to
    shape company culture.

  Perks and Benefits:💸 Competitive Compensation:

  You’ll receive a competitive salary and a generous equity
  package for joining us at Glide.

  ❤️ Wellbeing Credits (for US employees)

  Besides stellar health, dental, and vision insurance, we
  offer a generous health and wellness stipend, so you can
  stay healthy and active.

  🥗 Lunch on us (for US employees)

  We love food. Every member of the Glide team gets free
  lunch, every day. No one goes hungry around here :)

  💻 Best Tools

  We want you to be happy at work. You'll get a full equipment
  upgrade - from a top-of-the-line computer to your preference
  on keyboard, mouse, and accessories.
