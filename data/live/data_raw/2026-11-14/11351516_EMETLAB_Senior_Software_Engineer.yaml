description: |
  About the Job

  The Opportunity

  As a Senior Software Engineer at Emetlab, you will design
  and build the systems that power elite AI training data
  infrastructure serving frontier laboratories, Fortune 500
  enterprises, and sovereign AI programmes worldwide. Emetlab
  is an AI data infrastructure company delivering expert-
  produced, rigorously validated datasets and end-to-end AI
  solutions that transform good models into exceptional ones.

  In this role, you will take ownership of critical platform
  systems, from data pipeline architecture and contributor
  tooling to quality assurance automation and client delivery
  infrastructure. You will lead technical initiatives, mentor
  junior engineers, and make architectural decisions that
  scale with the demands of a global operation spanning 5,000+
  domain experts, 100+ languages, and 12 specialised dataset
  domains.

  This is an opportunity to do meaningful engineering work at
  the foundation of AI's most critical bottleneck, where the
  systems you architect and the code you write will directly
  determine the quality of training data behind the world's
  most advanced models.

  What You'll Do

  Design, build, and maintain scalable services, APIs, and
  data pipelines that power Emetlab's global data production
  and delivery infrastructure. Develop and optimise systems
  that support multi-stage quality assurance, expert
  contributor workflows, and high-throughput data processing
  across diverse domains. Own features and systems end-to-end,
  from technical design and implementation through to testing,
  deployment, and monitoring. Lead architectural decisions
  that ensure platform reliability, security, and scalability
  as our contributor network and client base grow. Mentor and
  elevate junior and mid-level engineers through code reviews,
  pairing, and architectural guidance. Collaborate cross-
  functionally with data operations, AI/ML, and product teams
  to deliver infrastructure that meets the precision demands
  of frontier AI development. Contribute to infrastructure and
  DevOps practices including CI/CD pipelines,
  containerisation, and cloud deployment at scale.

  What You'll Need to Succeed

  4+ years of professional software engineering experience,
  with strong proficiency in one or more languages such as
  Python, C#, Java, TypeScript, or Go. Proven experience
  designing and building production-grade APIs, services, and
  distributed systems that operate at scale. Familiarity with
  cloud platforms (AWS, GCP, or Azure), containerisation
  (Docker, Kubernetes), and modern deployment practices.
  Experience working with databases (relational and/or NoSQL),
  caching layers, messaging systems, and data pipeline
  tooling. A strong engineering mindset, comfortable
  navigating ambiguity, making pragmatic trade-offs, and
  delivering with quality under pace. Experience mentoring
  engineers and contributing to engineering culture through
  technical leadership and collaboration. A collaborative
  disposition, comfortable working cross-functionally with
  data operations, AI/ML, product, and engineering teams in a
  fast-paced environment. Genuine interest in AI, data
  systems, or machine learning infrastructure is highly
  valued.

  Role Details

  Employment Type: Full-Time and Part-Time positions available
  Location: Fully Remote Stage: Growth stage, operational

  About Emetlab

  Emetlab is an AI data infrastructure company built on a
  single conviction: the quality ceiling of any AI system is
  determined by its training data, not its architecture or
  compute. We produce expert-crafted, rigorously validated
  training datasets across 12 specialised domains, delivered
  by a global network of over 5,000 vetted domain specialists
  spanning 100+ languages and 50+ specialisations. Beyond
  datasets, we offer end-to-end AI solutions including Fine-
  Tuning, RLHF & Alignment, Red Teaming, Model Evaluation,
  Data Annotation, Synthetic Data Generation, and Pre-Training
  Data Pipelines.

  We are not a crowd-sourcing platform. We are the data
  partner that matches the ambition of the teams building the
  next generation of AI, delivering measurable results: 42%
  accuracy improvements, 3x faster time-to-production, and
  99.4% regulatory precision.

  Equal Opportunity

  Emetlab is an equal opportunity employer. We welcome
  dedicated individuals regardless of gender, race, ethnicity,
  national origin, age, disability, religion, sexual
  orientation, gender identity or expression, or veteran
  status. We believe that extraordinary products are built by
  extraordinary teams, and extraordinary teams are built on
  inclusion, respect, and the understanding that brilliance
  has no single origin.

  If you require accommodation during the application or
  interview process, please reach out to our team and we will
  ensure your needs are met with care.

  Let's build the future of AI training data, together.
