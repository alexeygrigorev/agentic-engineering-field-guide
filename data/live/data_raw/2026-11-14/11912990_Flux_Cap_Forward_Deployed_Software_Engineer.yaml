description: |
  Forward Deployed Software Engineer

  FluxCap | New York City | Hybrid | Full-time

  Build software that helps lawyers take on harder cases.

  About FluxCap

  Strong cases should get their day in court. FluxCap helps
  lawyers connect the law, evidence, and strategy of a case so
  they can take on bigger opponents and win on the merits,
  regardless of the size of their team. Our initial focus is
  antitrust, with expansions across complex litigation.

  Founded by Jonathan Kanter and Doha Mekki, former leaders of
  the Justice Department’s Antitrust Division, FluxCap brings
  together former DOJ lawyers and engineers from Palantir and
  Meta. We’re backed by Y Combinator, Bloomberg Beta, and
  other investors.

  The role

  You’ll work directly with lawyers using FluxCap to
  understand where they get stuck and build software that
  helps them move forward. You’ll follow projects from the
  first conversation through production and see how your work
  performs on real cases.

  That might mean bringing thousands of documents into a case,
  helping a lawyer trace an argument back to its evidence, or
  building a better way to review and correct AI-generated
  work. You’ll partner with our legal engineers and work
  closely with the CTO and experienced software engineers on
  scoping, technical decisions, and code review.

  We welcome earlier-career engineers with strong fundamentals
  and experience building working software. You’ll start with
  a focused project and take on more responsibility as you
  learn the product and domain.

  What you’ll do

  - Work with lawyers and legal engineers to understand a
    problem and choose a useful first step.
  - Build frontend and backend features, data integrations, and
    AI workflows.
  - Write tested, dependable software and handle sensitive case
    information with care.
  - Watch how lawyers use what you ship, troubleshoot problems,
    and improve it with their feedback.
  - Identify problems that come up across cases and build
    solutions other legal teams can use.

  What you’ll bring

  - Experience building working software through a job,
    internship, open-source contribution, or substantial
    project. There is no minimum years-of-experience
    requirement.
  - Strong programming fundamentals and familiarity with
    TypeScript or JavaScript and a frontend framework such as
    React.
  - Clear communication, curiosity about how people work, and a
    willingness to ask questions when something is unclear.
  - An ability to break a problem into manageable steps, seek
    feedback, and follow through.
  - A habit of checking your work and investigating unexpected
    results, including AI-generated output.

  Experience with LLMs, retrieval, or evaluation frameworks is
  a plus. Legal experience isn’t required.

  Your first few months

  You’ll learn how lawyers build a case, ship a focused
  improvement with support from the team, and use feedback to
  make it better. As you gain context, you’ll take
  responsibility for a larger workflow and help decide what to
  build next.

  Compensation and benefits

  - Annual base salary of $120,000–$190,000, depending on
    experience, plus equity
  - Medical, dental, and vision insurance
  - 401(k) with an employer match
  - Company-paid life insurance and short-term disability
  - Learning and professional development budget

  This is a hybrid role based in New York City and includes
  travel to customer sites.

  Interview process

  - Introductory conversation
  - Virtual technical interview covering system design and AI-
    assisted coding
  - One-day work trial with the team in NYC
  - Founder conversation
  - References

  You must be authorized to work in the United States. We are
  not currently able to sponsor visas.
