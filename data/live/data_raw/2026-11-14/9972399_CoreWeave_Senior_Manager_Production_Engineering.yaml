description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the Role

  As we continue to scale the CoreWeave Cloud Platform,
  ensuring reliability, performance, and operational
  efficiency in a live production environment is mission-
  critical. We’re seeking a Senior Manager of Production
  Engineering to lead and expand our SRE team and practices.
  This leader will play a key role in shaping the resilience
  and reliability of our platform, partnering closely with
  engineering and product teams to build systems and services
  that are secure, scalable, and highly efficient.

  You will champion a culture of operational excellence,
  automation, and ownership, empowering our cloud platform to
  scale confidently and operate with agility.

  What You’ll Do

  - Contribute and execute the SRE vision, strategy, and roadmap
    for a large-scale, distributed cloud infrastructure.
  - Lead and mentor a high-performing team of SREs, promoting a
    culture of ownership, collaboration, and continuous
    learning.
  - Champion automation-first practices, leveraging AI, tools
    like Terraform, Kubernetes, and Infrastructure-as-Code to
    minimize toil and manual interventions.
  - Establish and evolve Operational Excellence best practices
    ensuring the platform is proactive, and propagates
    organizational learning.
  - Drive initiatives for incident management, postmortem
    culture, root cause analysis, and system hardening.
  - Collaborate with engineering, product, and customer support
    teams to build scalable, resilient, and self-healing
    systems.
  - Evolve our on-call strategy and processes to support a 24x7,
    globally distributed platform with minimal disruptions.

  Who You Are

  We’re looking for a thoughtful leader who blends technical
  depth with strategic vision, and thrives in fast-moving,
  high-growth environments. If you value clarity over
  complexity, mentorship over management, and resilience over
  rigidity, you’ll fit right in.

  Minimum Qualifications

  - Bachelor’s degrees in Computer Science, Engineering, or
    related fields.
  - 10+ years in a leadership or senior management role at a
    cloud provider, hyperscaler, or high-growth tech company.
  - Experience hiring, developing, and managing geographically
    distributed 24x7 engineering teams.
  - Experience in designing and implementing incident management
    processes including on-call rotations, escalation paths,
    postmortems, and SLO/SLA framework.
  - Solid foundation in systems engineering, with a deep
    understanding of distributed systems, networking, and
    storage architecture.
  - Strong cross-functional collaboration skills, with the
    ability to influence product, platform, hardware, and
    security teams.

  Additional Qualifications

  - Experience building platform tooling and internal developer
    portals to improve engineering velocity and operational
    visibility.
  - Familiarity with GPU-accelerated workloads, including
    resource isolation, scheduling, and performance tuning.
  - Experience working in AI infrastructure environments
    supporting training or inference at scale.
  - Background in compliance, reliability risk modeling, or
    operational maturity assessments (e.g., RTO/RPO, chaos
    engineering).
  - Prior leadership experience in bare metal infrastructure
    environments (e.g., custom data centers, edge compute, HPC
    clusters).
  - Working knowledge of DPUs, service mesh architectures, and
    multi-tenant security models.

  The base salary range for this role is $207,000 to $275,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

