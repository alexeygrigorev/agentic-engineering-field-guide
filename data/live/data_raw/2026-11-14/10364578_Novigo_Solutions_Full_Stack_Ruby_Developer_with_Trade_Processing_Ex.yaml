description: |
  Company Description

  Novigo Solutions is an end-to-end IT Solutions provider,
  specialized in full cycle IT services and platform
  solutions. Novigo focuses mainly on latest technology
  platforms like Microsoft SharePoint , SalesForce , BI, RPA,
  E-Content Services, ERP Implementation & Support Services
  and Mobile Technologies. Novigo has over 200+ full time
  technical experts working on several leading technology
  platforms and serving Fortune 500 clients across the globe.
  Novigo aims to support clients business in a long-term
  relationship mode. With its unique delivery model, it helps
  the clients to achieve significant cost saving and business
  success. Novigo is headquartered in Dallas, Texas and has
  development centers in Bangalore and Mangalore. Novigo
  currently operates from India, US, UAE, Oman, KSA and
  Singapore.

  Job Description

  Experienced full stack Ruby developer to work within teams
  that are and delivery enterprise financial services middle
  office systems that transact a high volume of the diverse
  asset class. In this role, you will not only be designing
  and coding applications, but mentoring other developers to
  help build a world-class software engineering capability
  within the Middle Office Technology Group.

  Job responsibilities and opportunities:

  - Drive the design and implementation of scalable, high
    performing and robust applications.
  - Proactively manage changes in project scope, identify
    potential issues, and devise contingency plans.
  - Available to provide advice and assistance to teams on
    technical difficulties that arise in the course of doing
    their work
  - Provide technical mentorship and guidance to more junior
    engineers including code reviews and diving into coding
    assignments when necessary as well as defining and
    implementing best in class standards.
  - Identifying issues to teams that they might overlook, such
    as scalability, performance, or security.
  - Analyze and discuss potential risk/benefits involved in
    using the specified technology solution to address the
    business requirement

  Consults with internal business groups to provide high-level
  application software development services or technical
  support. Provides comprehensive senior-level technical
  consulting to IT management and senior technical staffs.
  Evaluates compliance with the organization's technology
  standards. Works with internal business groups on
  implementation opportunities, challenges, and requirements
  of various applications. Analyzes information and provides
  recommendations to address and resolve business issues for a
  specific business group. Guides and consults with IT
  management and technical staffs regarding use of emerging
  technologies and associated services. Participates in
  defining corporate implementation and integration strategies
  of new technologies. Advocates for innovative, creative
  technology solutions. Contributes to the achievement of area
  objectives.

  Qualifications

  Bachelor's degree in computer science engineering or a
  related discipline, or equivalent work experience required,
  10-12 years of experience in software development required,
  experience in the securities or financial services industry
  is a plus.

  - At least 7 years’ experience in financial services with
    experience in high volume trading systems.
  - Must have at least 1 year as a Ruby Full Stack Developer
    along with experience with Docker and 7 or more years of
    professional software development experience.
  - At least 3 years of experience with agile software
    development methodologies, tools, and processes.
  - At least 1 year of messaging development experience with
    Rabbit MQ or IBM MQ.

  Technical Skills / Attributes Required

  Our current stack includes Ruby, Rails, Active Records,
  RSpec, Cucumber, and Docker.  We use both Postgres and
  Oracle as our RDBMS and IBM WMQ and Kafka for messaging.
  For the UI were using AngularJS, React and Bootstrap CSS and
  our tool stack include GIT, Jenkins, JIRA, and Confluence.

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
