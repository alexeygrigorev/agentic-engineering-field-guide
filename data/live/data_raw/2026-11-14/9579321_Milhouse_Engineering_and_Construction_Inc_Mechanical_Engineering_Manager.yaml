  Why join the Aviation team? Here's why:

  The Aviation team is a collaborative and multidisciplinary
  group that strives for the best results daily. As a melting
  pot of mechanical, civil, and electrical engineers as well
  as architects this offers our team exposure to many
  different facets of engineering and the ability to see how
  it all comes together to support our clients. Our team
  prides themselves on mentorship and ensures team members are
  partnered with one another to foster an environment of
  learning and development. This team in particular likes to
  connect on a professional and social level; after all we
  spend 5 days a week at work, so a strong sense of
  camaraderie is important! If you want to be a part of this
  synergetic environment, apply today!

