description: |
  The Mechanical Engineering Manager provides technical
  leadership, plans, organizes, and implements the development
  of all projects within the Aviation (Design Build) group.
  The Manager utilizes the technical and managerial skills
  necessary to ensure successful project completion.



  You will be well versed in multiple engineering disciplines
  specific to Mechanical, Electrical, FP and Plumbing plus
  possess exceptional project management and leadership
  experience to provide supervision and guidance to the group
  to ensure all objectives, critical issues, new concepts and
  policy matters are met. You are leading a team that
  specializes in design work across our Aviation (Design
  Build) portfolio.

  What you will do:

  - Provide technical expertise to staff, clients, and peers
    within the organization.
  - Builds project teams by assigning group production
    employees/resources to project managers.
  - Assists project managers by developing and reviewing scopes,
    schedules and time budgets for work to be executed in
    their group.
  - Collaborate across the organization to ensure that staff
    utilization goals are met or exceeded.
  - Monitors team performance to ensure group’s adherence to
    agree upon scopes, schedules, and budgets.
  - Identify, analyze and resolve problems in a pro-active
    manner.
  - Cultivate effective relationships with clients, and
    employees.
  - Support proposal opportunities that are strategically
    aligned with your group.
  - Participates in the RFP/RFQ process including, site visits,
    client meetings, scope development, preparation of project
    approach, technical execution plans, schedules, and
    interviews.

  Your background:

  - Bachelor’s Degree in Mechanical Engineering required
  - P.E required
  - 10- 15 years MEP experience required
  - Informal or formal leadership experience preferred
  - HVAC design, Fire protection and associated calculations
    experience required
  - Hydronic systems design and flow /pressure calculations
    experience required
  - Sizing and specifying of mechanical equipment experience
    required

