  nexus between traditional and nontraditional threats across
  all domains: land, sea, space, air, and cyberspace. The
  company serves as a valued partner to essential government
  agencies and supports every branch of the U.S. armed forces.
  Each day, our employees do the can’t be done by solving the
  most daunting challenges facing our customers. Visit
  peraton.com to learn how we’re keeping people around the
  world safe and secure.

  Responsibilities

  The Peraton Health, State and Local Sector is seeking a
  COBOL Software Developer, to join us in supporting and
  maintaining the Medicare Fee For Service claims processing
  system. In this role, you will be a contributing member of
  an Agile team providing maintenance and operations support
  for the Durable Medical Equipment (DME) contract.

  As a COBOL Software Developer, you will work within a highly
  structured and rigorous development environment that follows
  the SAFe Agile/Scrum framework. This position offers an
  opportunity to build foundational engineering skills while
  supporting a critical healthcare platform. You will work
  primarily with mainframe technologies, including COBOL and
  JCL, to deliver reliable, high-quality solutions.

  You will assist in designing, developing, and enhancing
  software programs according to established procedures and
  coding standards. You will also build and execute unit test
  plans, test cases, and test data to ensure high-quality
  deliverables.

  You will collaborate closely with your team to plan and
  execute work assignments, ensuring all project due dates and
  sprint commitments are met. Additionally, you will help
  install software changes into internal testing regions,
  troubleshoot and resolve discovered defects, and assist in
  keeping technical documentation current.

  What you'll do:   

  - Designs, codes, unit tests, and debugs enhancements and
    fixes to the health claims processing system.

  - Participates as a member of a persistent Agile development
    team supporting maintenance and operations.

  - Completes development to implement components of moderate
    complexity under general direction within a legacy
    mainframe environment.

  - Participates in design activities related to maintenance
    solutions.

  - Demonstrates general use and application of concepts,
    practices, and techniques.

  - Designs, prepares and executes unit tests to validate
    changes prior to release, and represents team to clients.

  - Provides solutions to a variety of technical problems.

  - Applies technical knowledge to deliver maintenance solutions
    across one or more technology areas.

  - Applies company and 3rd party technologies solutions of
    moderate complexity with general direction.

  - With only general direction, implements end-user or
    enterprise solutions of moderate complexity with general
    direction provided.

  - Integrates technical expertise and business understanding to
    deliver stable, reliable solutions for clients.

  - Consults with team members and other organizations, clients,
    and vendors on technical issues.

  - Provides time and resource estimates for assigned tasks and
    projects.

  - Assists in developing solutions to complex business and
    technology problems in areas of proven expertise.

  Qualifications

  What you'll need:

  - Education & Experience: 2 years with BS/BA, or a High School
    diploma with 4 years of experience.
  - U.S. Citizenship
  - Must be able to achieve and maintain Public Trust clearance.

  - Experience with mainframe technologies such as COBOL, JCL,
    CICS, TSO and VSAM.

  - Ability to perform well in a highly rigorous structured
    development environment.

  - Demonstrated experience as a software developer in a
    mainframe environment, preferred.

  - Demonstrated ability to determine and decompose business and
    technical requirements.

  - Experience with application lifecycle methodology
    experience, specifically Agile/SCRUM.

  - Strong communication skills and technical writing ability.

  - Ability to develop application project solutions and provide
    accurate estimates.

  - Must be able to achieve and maintain Public Trust clearance.

  Preferred Qualifications:



  - Knowledge of health care claims processing, particularly
    Medicare Fee For Service.

  - Mainframe development experience.

  - Experience with Medicare Part A, Medicare Part B, DME or
    Medicare Common Working File (CWF) specific processing
    systems.

  - Experience working with or in support of CMS programs or
    contracts.

  - Experience with DevOps/DevSecOps tools and frameworks
    through plan, define, build, test, release and deploy
    processes.

  - SAFe Agile experience and/or certification.

  - Experience with Assembler language in a mainframe
    environment.

  - Familiarity with development and collaboration tools:
    GitHub, Jira, Confluence, Eclipse (IDz/RDz).

  - Familiarity with modern languages such as Java or Python.

