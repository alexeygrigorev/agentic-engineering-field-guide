description: |
  Job Title: Full Stack Developer

  Job Type: Permanent

  Base Office: London

  Working Structure: Hybrid

  About Us

  We are a growing digital team working with a wide range of
  clients to build, scale and maintain robust, high-quality
  web applications.

  Our culture is collaborative, innovative and focused on
  delivering solutions that make a real impact. We work
  together to solve interesting technical challenges,
  continuously improve how we work and build software that we
  can be proud of.

  We are looking for a Full Stack Developer to join our team
  and help deliver modern, scalable and maintainable web
  applications for a range of clients.

  What You’ll Be Doing

  In this role, you will:

  - Work closely with developers, testers, designers and project
    managers to deliver high-quality solutions for a range of
    clients.
  - Develop and maintain web applications using modern
    technologies, with a particular focus on PHP and Laravel.
  - Write clean, well-structured and maintainable code,
    following agreed coding standards and best practices.
  - Build and maintain automated tests to help ensure the
    quality and reliability of our applications.
  - Investigate and resolve technical issues, working with
    colleagues to identify effective solutions.
  - Participate in technical discussions, contributing ideas and
    recommendations while continuing to develop your own
    technical expertise.
  - Break down development work into clear, manageable tasks and
    provide input into estimates and delivery planning.
  - Work with QA and other developers to improve testing
    practices and increase automation where appropriate.
  - Take part in code reviews, both reviewing colleagues' work
    and using feedback to continually improve your own.
  - Participate in client and project meetings where required,
    communicating progress and raising technical issues or
    blockers clearly.
  - Use AI-assisted development tools appropriately to support
    activities such as coding, debugging, testing,
    documentation and research.
  - Apply good judgement when using AI-generated code, ensuring
    outputs are understood, reviewed, tested and meet
    appropriate security and quality standards before being
    used.





  What We’re Looking For

  Required Skills & Experience:

  - Commercial experience developing and maintaining web
    applications as part of a multidisciplinary development
    team.
  - Good experience with PHP and Laravel, including building
    APIs, working with databases and using common Laravel
    features such as queues, events and scheduled tasks.
  - A solid understanding of object-oriented programming,
    including principles such as SOLID and writing
    maintainable, reusable code.
  - Experience writing automated tests using tools such as
    PHPUnit and/or Pest.
  - Experience with modern front-end development and JavaScript
    frameworks such as React, Vue or similar.
  - A good understanding of HTML, CSS and responsive web
    development.
  - Experience using Git and working within structured
    development and deployment processes.
  - Familiarity with CI/CD pipelines and automated deployment
    practices.
  - Strong problem-solving skills and the ability to investigate
    and resolve technical issues independently, while knowing
    when to seek support.
  - Experience using AI tools to support software development,
    testing, documentation or technical research.
  - An understanding of the importance of reviewing and
    validating AI-generated code, including considerations
    around quality, security, accuracy and maintainability.
  - Good communication skills and the ability to work
    effectively with both technical and non-technical
    colleagues.



  Nice to Have:

  - Experience with Docker and containerised development
    environments.
  - Knowledge of cloud platforms such as AWS, Azure or similar.
  - Experience developing and consuming RESTful APIs.
  - Experience with application performance optimisation,
    including database queries and efficient application code.
  - Experience with modern JavaScript tooling and front-end
    build processes.
  - An interest in emerging AI technologies and how they can be
    applied responsibly to improve software development and
    digital products.
  - Experience with React Native or other mobile application
    development frameworks.



  Equal Opportunities:



  CACI is proud to be an equal opportunities employer.
  Embracing the diversity of our people, we are on a journey
  to build a truly inclusive work environment where no one is
  treated less favourably due to ethnic origin, age, sex,
  gender identity, veteran status, religion or belief, sexual
  orientation, marital status, and disability or health
  condition, actively working to prevent discrimination.



  As a Disability Confident employer, we will;



  - Provide reasonable adjustments in the recruitment process
    where requested (contact a member of the recruitment team
    on 020 7602 6000 to discuss individual requirements
    further).
  - Offer people with health conditions and disabilities,
    meeting the minimum criteria for a role, an interview.
  - Our people are unique and we encourage, and support them, to
    be confident in contributing to our inclusion journey.
