description: |
  Join US20 - Nokia of America Corp. as an Embedded Software
  Developer, where you'll play a crucial role in creating
  robust and high-performance embedded software for cutting-
  edge communication systems. Collaborate with diverse teams
  to integrate and optimize wireless communication modules,
  ensuring seamless operation across all subsystems.

  Responsibilities

  - Develop firmware and low-level embedded software using
    C/C++.
  - Integrate and control WiFi and 5G/LTE modules for real-time,
    deterministic tasks.
  - Work closely with hardware teams for board bring-up and low-
    level validation.
  - Optimize system performance, including CPU, DSP, FPGA, and
    power efficiency.
  - Support secure firmware updates, including OTA mechanisms.
  - Maintain detailed technical documentation and participate in
    code reviews.
  - Collaborate with cross-functional teams for seamless
    hardware-software integration.
  - Debug and troubleshoot hardware-software interactions using
    advanced tools.
  - Ensure robust and high-performance operation across all
    subsystems.

  Qualifications

  - Bachelor's or Master's degree in Electrical/Computer
    Engineering or related field.
  - 5+ years of embedded firmware/software development
    experience.
  - Proficiency in C and C++ programming.
  - Experience with ARM processors, MCUs, DSPs, and FPGA-based
    systems.
  - Strong understanding of Linux Kernel architecture and secure
    boot process.
  - Familiarity with real-time execution and deterministic
    scheduling.
  - Experience with embedded OS and RTOS environments, including
    FreeRTOS and Linux with PREEMPT_RT.
  - Proficiency in scripting languages (Python, Bash) for
    automation and development.
  - Ability to read and interpret hardware schematics and data
    sheets.
  - Excellent communication skills and a collaborative mindset.
