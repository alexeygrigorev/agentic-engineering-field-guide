description: |
  Full Stack Engineer

  We’re looking for a talented and motivated full-stack
  engineer with 3+ years of experience to join as an early
  member of our growing team. You will own end-to-end
  technology projects and influence product feature specs,
  build backend APIs, write front-end code, and oversee
  ongoing improvements for deployed features.

  About Givzey:

  Givzey is a Boston-based, rapidly growing digital
  fundraising solutions company, built by fundraisers for
  nonprofit organizations. Givzey created the first Gift
  Agreement Platform for fundraising, which empowers
  fundraisers to secure giving and bookable revenue with
  Digital Gift Agreements, while leadership gains intricate
  forecasting knowledge all year long. With Givzey,
  fundraisers can quickly and easily scale the gift agreement
  and gift pledge process to donors of all sizes to increase
  giving, hone predictability, and provide a world-class donor
  experience.

  At Givzey, our tech stack is Linux, Python, Flask, React,
  Javascript, PostgreSQL and AWS

  Full Stack Engineer responsibilities are:

  - Take part in the entire application lifecycle٫ focusing on
    coding and debugging
  - Write well designed, testable, efficient code
  - Prepare software verification plans and quality assurance
    procedures
  - Debug applications and detect and fix errors
  - Implement modern technologies to improve legacy applications
  - Collect٫ analyze and address technical and design
    requirements
  - Help to create reusable code and libraries for future use
  - Provide support / consulting on Givzey software systems to
    operations teams and /or clients

  Full Stack Engineer requirements are:

  - US Citizen
  - 5+ years' experience of working on a Computer Software
    Engineer or Back-End Developer position
  - Significant experience in developing web applications using
    at least one popular web framework, such as Flask or
    Django
  - Experience with front-end languages (such as HTML,
    JavaScript, CSS) and JavaScript frameworks (such as
    Angular, React, or Vue.js)
  - Knowledge of Python a must
  - Excellent knowledge of Relational Databases and SQL
  - Excellent understanding of the entire web development
    process (design٫ development and deployment) and
    application lifecycle
  - Strong analytical and time management skills
  - Good teamwork skills with a problem-solving attitude

  What you’ll do day-to-day:

  - Be a member of a world-class team focused on inventing
    solutions that have the ability to impact the world
  - Tackle a wide variety of technical problems throughout the
    stack and contribute daily to all parts of our product
    code base
  - Help build a simple, beautiful, intuitive product that
    revolutionizes the nonprofit industry
  - Work closely with our customers, founders, team members and
    Board to understand customer pain points, develop
    solutions, and prototype, iterate, and deploy code on
    regular cycles
