description: |
  ABOUT SPHINX

  Sphinx builds software to solve complex national security
  problems in Space. Founded by engineers and technologists
  with deep experience across commercial and defense
  technology, we were frustrated by the outdated and insecure
  technology America's service members are forced to rely on.
  We're here to do better.

  We’re focused on building modern, scalable products with an
  emphasis on using open source technologies. Expect talented,
  motivated, and interesting colleagues who emphasize
  collaboration, transparency, and individual responsibility.

  ABOUT THE ROLE

  Sphinx is hiring a Backend Engineer to join our Space
  Communications team building a ground communications and
  data-transport  platform for US government satellites. As a
  Backend Engineer you will lead the development of core
  platform services, designing and  building technology to
  support the operations of a wide variety of US  Government
  satellites. You'll work as both an individual contributor
  and a lead for more junior engineers.

  We’re looking for a track record of the following:

  - Experience working on  multi-tenant services on public cloud
    platforms like AWS, Azure, or GCP
  - Developing and consuming APIs and services as part of
    platform ecosystem
  - Developing with an emphasis on automation and security
  - Willingness to own a technical problem end-to-end
  - A habit of self-directed learning of new technologies
  - The ability to work well with a team
  - The ability to communicate clearly

  You might be a good fit if:

  - You have 3-5+ years’ of progressively responsible software
    engineering experience
  - You have extensive experience with Python, FastAPI,
    postgres, AWS, Docker, Kubernetes, Terraform
  - You have experience architecting and building APIs and
    backend services
  - You can demonstrate in-depth knowledge of at least one
    commercial cloud platform and its associated services
  - Are comfortable working with some ambiguity and able to
    self-direct your work
  - You’ve made enough mistakes and booked enough wins to know
    what not to build and know what good looks like

  Nice to have:

  - Prior experience working in space, satellite communications,
    or building ground systems.

  LOCATION

  While this role is remote, the potential for travel may
  occur such as client visits, company gatherings, and other
  project related travel as needed may be required.

  COMPENSATION

  - This role is between $138,000 - $167,000 base salary.
  - Quarterly bonus structure
  - Equity ownership in the company
  - 100% Premium coverage for medical, dental, and vision for
    you and dependents
  - Health Savings Accounts
  - Life Insurance
  - 401k employer contribution plan
  - Flexible paid time off policy
  - Flexible work/remote work policy

  BENEFITS

  Compensation includes competitive salary, meaningful equity
  ownership, profit sharing, employer 401(k) contribution, and
  100% employer covered medical, dental, and vision insurance
  for you and your dependents.

  At Sphinx Defense, we are devoted to building a team that
  represents a variety of backgrounds, perspectives, and
  skills. Sphinx Defense is committed to providing equal
  employment opportunities to all employees and applicants for
  employment without regard to race, color, religion, sex,
  sexual orientation, and gender identity.



  CLEARANCE ELIGIBILITY - This position requires eligibility
  to obtain and maintain a U.S. security clearance. For more
  information about U.S. Security Clearances: click here.



  To conform to U.S. Government export regulations, applicant
  must be a (i) U.S. citizen or national, (ii) U.S. lawful,
  permanent resident (aka green card holder), (iii) Refugee
  under 8 U.S.C. § 1157, or (iv) Asylee under 8 U.S.C. § 1158,
  or be eligible to obtain the required authorizations from
  the U.S. Department of State. Learn more about the ITAR
  here.
