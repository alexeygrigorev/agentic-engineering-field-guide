description: |
  Our missionMoney sitting idle is money lost. We're fixing
  that.

  Founded in 2023 by Antoine and Paul-Adrien, Spiko gives
  SMEs, non-profits, financial advisers and fintechs access to
  institutional-grade cash management, via app or API. We are
  building the full infrastructure: issuing, operating, and
  distributing the products ourselves.

  Today, we serve thousands of organizations across Europe and
  process hundreds of millions of euros in flows every month.

  Our ambition: become the world's leading treasury management
  infrastructure in a market worth trillions.

  We are backed by Index Ventures, the CEO of Revolut, the
  founder of Kyriba, and the CTO of Wise.

  Spiko runs on excellence, transparency, and straight talk.

  The role: Frontend Engineer

  We are looking for a Frontend Engineer to join Spiko's
  engineering team.

  You will own the architecture of our customer-facing web
  application and our landing page, set the standards for
  frontend development at Spiko, and ship delightful UI
  together with our designers and full-stack engineers.

  Key responsibilitiesWeb app

  - Own the architecture of our customer-facing web application
    (Next.js, React, Tailwind, Shadcn)
  - Define and enforce frontend standards: code quality,
    accessibility, performance, testing
  - Build and ship complex, data-rich UIs in close collaboration
    with the design team
  - Improve the developer experience: tooling, CI/CD
  - Set up the AI tooling for frontend development at Spiko
    (skills, generation workflows, design-to-code, etc.)

  Landing page

  - Own the technical setup of our marketing landing page
  - Enable the marketing team to safely iterate on the landing
    page
  - Note: the landing page is expected to take roughly 25% of
    the role's time, not full-time

  Our Tech Stack

  - Languages and frameworks: TypeScript, NX, Effect, React,
    Next.js, Tailwind
  - Infrastructure: Terraform, AWS, Kubernetes, Docker,
    PostgreSQL
  - External services: Ory, Datadog

  Who we're looking forRequirements (must-haves):

  - 3+ years of experience as a frontend or full-stack engineer,
    with deep expertise on React and Next.js
  - Strong TypeScript fundamentals and a high bar for code
    quality, accessibility, and performance
  - Experience defining frontend architecture, standards and
    tooling in a fast-moving environment
  - Strong product and design sensibility - you care about UX
    and pixel-perfect UI
  - Comfortable working in an English-speaking environment
  - Curious, pragmatic, and eager to learn

  Nice to have:

  - Experience setting up AI-assisted development workflows for
    a frontend team
  - Experience with Tailwind, Effect, or NX monorepos
  - Experience in fintech, capital markets, or other highly
    regulated environments
  - Some experience with React Native (helpful when
    collaborating with the mobile engineer)

  What we offer

  - 💰 Compensation: Competitive package depending on experience
    + stock options
  - A small and focused team: you will define and own Spiko's
    frontend architecture from the ground up
  - 📍 Office: in the heart of Paris
  - 🏡 Remote work: up to two days per week and one full remote
    week per month
  - 💻 The best tech for your job: latest-generation laptops and
    industry-leading software
  - 🏥 Health insurance: 100% covered by Spiko
  - 💳 Monthly budget to cover perks of your choice
  - 🚇 Transport: 50% of public transport pass covered or the
    Forfait Mobilités Durables (FMD)
  - 👥 Referral bonus
  - 🎊 Social life: regular after-work drinks and offsites twice
    a year

  Our hiring process

  - Screening Interview - 30 min with Talent Acquisition
  - 30 min general interview with Nicolas (Tech Lead)
  - Technical Interview - 45 min, focusing on Frontend with one
    member of the engineering team
  - Hands-on Technical Session - 2 hours with two engineers
    (frontend architecture, live coding) onsite
  - Final in-person interviews with the founders
  - Reference Check: we'll reach out to your references to
    gather further insights
  - Offer 🎉

  If something here doesn't match your résumé perfectly but
  you believe you'd thrive in this role, apply anyway. Tell us
  why.
