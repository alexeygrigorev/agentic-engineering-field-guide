description: |
  We design Spotify’s consumer experience—end to end, moment
  to moment, across every screen, platform, and partner
  integration. Our mission is to make listening feel
  effortless, personal, and joyful for billions of users
  around the world. That means turning complexity into clarity
  across hundreds of touchpoints—from our mobile and desktop
  apps to the smart speakers, TVs, cars, and integrations
  where Spotify shows up every day. If it touches a consumer,
  we shape it. We bring deep insight into human behavior,
  design, and technology to craft experiences that feel
  intuitive, expressive, and unmistakably Spotify.

  We own music content ingestion at Spotify, which is how
  music from labels, distributors and other partners gets onto
  the platform. We receive industry-standard deliveries,
  validate them, and turn them into the catalog data that
  teams across Spotify build on, including lyrics, rights and
  supply data. As we add new content types and partners, we’re
  building an ingestion platform that scales without a custom
  build every time.

