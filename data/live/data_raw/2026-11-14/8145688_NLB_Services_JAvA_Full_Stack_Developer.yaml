  Purpose of the Full Stack Developer:

  The Full Stack Developer is an opportunity to discover a
  large range of business cases as well as design, develop and
  implement solutions that results solving complex problems.
  As a Full Stack (Java) Developer you will design and develop
  technology based business solutions for our clients in the
  banking and financial services industry. Additionally, you
  will implement components of a work package / project as per
  client requirements; create a fault tolerant code and modify
  complex systems or develop new sub systems; develop
  comprehensive unit testing cases and plans.

  This role may require you to be a Lead Developer or take on
  the responsibility of that of a Tech Lead.

  Areas of Responsibility:

  The Full Stack Developer role will require you to be hands-
  on and may require you to lead the team. You will
  participate in requirement gathering JAD sessions and
  support documentation where applicable (business,
  functional, UI, usability, data, compliance, data migration,
  NFR, 3rd party tools & products). Also, resolve or raise
  queries and get query resolution on areas which are unclear,
  ambiguous and which need more information.

  Design and Analysis

  · Review all deliverables created by the development team.

  the database concepts and write efficient queries.

