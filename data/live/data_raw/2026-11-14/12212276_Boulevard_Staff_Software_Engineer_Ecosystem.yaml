description: |
  Who is Boulevard?

  Boulevard provides the first and only client experience
  platform for appointment-based, self-care businesses. We
  empower our customers to give their clients more of the
  magical moments that matter most.

  Before launching in 2016, our founders spent months
  interviewing salon managers and working behind front desks
  to understand their pain points so we could design a modern,
  user-friendly platform that meets the unique needs of their
  business. Our roots may be in hair salons, but we are built
  for the broader self-care industry, including many types of
  salons, spas, medspa, barbershops, and more. Our technology
  not only helps our customers survive but thrive. Take a look
  at how we (and YOU) can make that happen.

  We have an insatiable curiosity and embrace experimentation.
  We believe that simple solutions require the most
  sophistication, and we design each and every detail to
  maximize potential, power, and impact. Do our values match?
  Read through our story and what we value the most.

  Our team values and celebrates our diverse backgrounds.
  Being open about who we are and what we do allows us to do
  the best work of our lives. We believe in equal opportunity
  for all, and you should too.

  Come do the best work of your life at Boulevard.

  Boulevard customers are passionate about what they do. Their
  needs are nuanced and critical, and they rely on us to stand
  alongside them so they can focus on what they do best. As a
  Staff Software Engineer on the Ecosystem team, you’ll set
  the technical direction for Boulevard’s external developer
  platform and its app and integrations ecosystem, then work
  across teams to make it real.

  This is a green field opportunity. You’ll shape the API
  platform, the partner experience, and the foundations
  partners and customers depend on, including API security,
  identity and access, audit trails, and eventing
  infrastructure. It’s an individual contributor role with
  wide influence: you won’t manage people, you’ll lead through
  technical judgment, clear communication, and trust, working
  closely with Engineering, Product Management, Design,
  Partnerships, and Product Marketing. We’re small enough that
  your work is visible every day.

  What you’ll do here:

  - Set the technical strategy for Boulevard’s API and app
    ecosystem, making sure it supports company goals and
    partner needs.
  - Work across engineering teams to align on direction and
    drive the right implementation, without formal authority
    over those teams.
  - Lead platform-level changes that cross team boundaries: gain
    agreement, plan the rollout, and see the work through.
  - Find the gaps between what the platform provides and what
    business priorities require, and turn them into clear,
    scoped, prioritized proposals.
  - Learn what partners and integrators need and bring those
    needs into the platform roadmap.
  - Write and review design documents and architecture
    decisions, explaining trade-offs and risks to technical
    and non-technical audiences.
  - Write code and ship high-impact work, setting the standard
    for quality, observability, and security.
  - Mentor engineers through design reviews, code reviews, and
    coaching, and remove blockers so teammates can do their
    best work.
  - Define and monitor system health metrics for the API
    platform, address technical debt before it affects
    reliability or performance, and help guide incidents from
    response to resolution and improvement.

  What you’ll need to thrive:

  - Experience as a Staff-level or senior engineer who has led
    large, cross-team technical initiatives.
  - Experience building and scaling external-facing API
    products. GraphQL experience is strongly preferred.
  - Experience building and maintaining integrations with third-
    party APIs.
  - Experience designing and operating systems at scale,
    including enterprise-grade systems.
  - Strong proficiency in at least one programming language,
    such as Python, Java, Go, or Elixir. Elixir experience is
    a bonus, not a requirement.
  - Influence without authority and sound technical judgment:
    you gain alignment through clear reasoning and trust, and
    you anticipate scale, maintenance, and operational cost.
  - Business and partner awareness, and clear communication: you
    connect technical decisions to business priorities and
    partner needs, and adapt your message to your audience.
  - A mentor’s mindset, ownership, and forward thinking: you
    help other engineers grow, move work forward when the path
    is unclear, state risks openly, and set long-term
    direction while delivering value in the short term.
  - A plus: experience with multi-tenant SaaS platforms.

  How we’ll take care of you:

  At Boulevard, we work hard to structure compensation in a
  way that balances internal equity with local market
  competitiveness, and we're happy to share a good-faith
  estimate of the base salary range for this role. For U.S.
  based candidates, the anticipated base salary range is
  $193,900 - 225,000 per year. In addition to this base
  compensation, this role may be eligible to participate in a
  variable compensation program. Final compensation will vary
  based on a variety of factors which include but are not
  limited to applicable experience, location, and final
  leveling.

  How we take care of our team

  Our business is deeply immersed in an industry that’s
  centered around helping people feel their best, so we know
  that taking care of yourself isn’t selfish; it’s essential.
  That’s why our culture pairs high standards with genuine
  care. We don't glorify burnout or wear ‘always on’ as a
  badge of honor. Instead, we’ve created benefits designed to
  support you inside and outside of work, so you can bring
  your best self to both.

  Here’s how we support you:

  - Competitive base pay and performance bonus eligibility
    because you deserve to be rewarded for your impact.
  - Equity participation for all full-time employees because we
    believe the people helping build Boulevard should share in
    our long-term success.
  - Comprehensive medical coverage with up to 100% employee
    premium coverage and 75% dependent coverage to help take
    care of you and your loved ones.
  - An annual $1,200 HSA employer contribution for eligible
    plans to help support healthcare costs and future
    planning.
  - 100% covered dental, vision, life, and disability insurance,
    ensuring you stay healthy, protected, and ready for
    whatever life brings.
  - 12 weeks of fully paid U.S. parental leave supporting all
    new parents equally as they take the time to bond, adjust,
    and be present when welcoming a new family member.
  - Flexible paid time off, plus 10 U.S. company holidays, where
    you are encouraged to rest, recharge, and take the time
    you need, guilt-free.
  - Fully remote with support, including a $200 home office
    setup allowance and a $50 monthly WFH reimbursement so
    your workspace is set up for success.
  - $200 quarterly Boulevard Bucks to prioritize your well-being
    and stay connected to the industry we serve.
  - And other perks like One Medical membership and Employee
    Assistant Program.

  To learn how Boulevard collects, uses, and protects personal
  information related to candidates and employees, please
  review our Boulevard Employee & Personnel Privacy Notice.

  Boulevard Labs, Inc. is an Equal Opportunity Employer
  committed to hiring a diverse workforce and sustaining an
  inclusive culture. All employment decisions at Boulevard
  Labs, Inc. are based on business needs, job requirements,
  and individual qualifications, without regard to race,
  color, religion, marital status, age, national origin,
  ancestry, physical or mental disability, medical condition,
  pregnancy, gender, sexual orientation, gender identity or
  expression, veteran status, or any other status protected
  under federal, state, or local law.

  Outside Employment Disclosure Boulevard serves the beauty,
  wellness, and self-care industry, and many of our employees
  have access to our customers' business and client data.
  Because of that, we ask all candidates to disclose any
  concurrent employment, self-employment, ownership interest,
  or advisory role during the hiring process, including the
  company name and industry. Disclosure is a normal part of
  our process and is not by itself a barrier to being hired.
  Employees in Tier 1 Restricted Roles may not hold concurrent
  employment, ownership, or an advisory role with a beauty,
  wellness, self-care, or med-spa business, or with a company
  that competes with Boulevard. If you currently hold such a
  role, you are still welcome to apply — please raise it early
  with your recruiter so we can talk it through.
