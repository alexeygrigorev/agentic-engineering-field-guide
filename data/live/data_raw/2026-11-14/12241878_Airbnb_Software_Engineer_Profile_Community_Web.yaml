description: |
  Airbnb was born in 2007 when two hosts welcomed three guests
  to their San Francisco home, and has since grown to over 5
  million hosts who have welcomed over 2 billion guest
  arrivals in almost every country across the globe. Every
  day, hosts offer unique stays and experiences that make it
  possible for guests to connect with communities in a more
  authentic way.

  The Community You Will Join

  As a Web Engineer on the Profile & Community team within
  Airbnb’s Passport & Commerce organization, you’ll help build
  the social layer of Airbnb: a trusted social graph of real-
  world connections, the social features built on top of it,
  and the foundations that let people connect with the
  travelers they know and the people they meet along the way.
  The team is highly collaborative with its partners in
  design, product, data science, legal, and marketing to
  deliver features and experiences used by millions of people.
  We work closely with other engineering teams to ensure we
  build systems that are performant and configurable with
  architecture that's scalable and robust.

  A typical day

  - Collaborate with cross-functional partners such as Product
    Managers, Experience Designers and Engineers to design and
    deliver high-quality products on web
  - Deliver high-impact social initiatives end to end.
  - Build efficient and reusable web components and architect
    reliable, performant, and scalable solutions
  - Identify areas of improvement and drive web best practices
  - Working closely with Android and iOS engineers on the team
    to develop foundational, cross platform solutions

   Your Expertise

  - 3+ years’ experience developing Web applications at scale
    with a high volume of users
  - Strong expertise building and maintaining high-performance
    and scalable Web frontend experiences using
    Javascript/Typescript
  - Experience with modern JavaScript/Typescript libraries and
    tooling (e.g. React, graphql)
  - Fluency in HTML, CSS, and related web technologies
  - Love collaborating via code reviews and architecture
    discussions, and are motivated to improve their teammates’
    productivity
  - You possess strong product sense and a passion for UX
    product development
  - Demonstrated ability to collaborate with Product Management,
    Design, and other iOS, Android, and Web Engineers
  - [Bonus] Experience with animation libraries.

  How We'll Take Care of You:

  Our job titles may span more than one career level. The
  actual base pay is dependent upon many factors, such as:
  training, transferable skills, work experience, business
  needs and market demands. The base pay range is subject to
  change and may be modified in the future. This role may also
  be eligible for bonus, equity, benefits, and Employee Travel
  Credits.

  Pay Range

  $162,000—$186,000 USD

  Reasonable Accommodations: We are committed to providing
  reasonable accommodations throughout the recruitment process
  for applicants with disabilities. If you need assistance, or
  an accommodation, please let your recruiter know once you
  are contacted about a role.

  A Note on Recruiting Scams: Scammers sometimes pose as
  Airbnb recruiters to get money or personal information from
  candidates. A few things that will always be true for
  Airbnb’s hiring process: our open roles are posted on
  Airbnb’s Career’s Page at careers.airbnb.com, and our
  recruiters correspond only from @airbnb.com or
  @ext.airbnb.com email addresses. Our recruiters will never
  ask for your Social Security number, bank account details,
  passport, or payment app information while you are
  interviewing.  We’ll also never ask you to pay a fee, send
  money, deposit or cash a check, or purchase work-related
  equipment (such as a company laptop) during the interview
  process. We encourage candidates to remain vigilant of these
  recruiting scams and not share sensitive information if you
  do not believe an individual is actually affiliated with
  Airbnb.
