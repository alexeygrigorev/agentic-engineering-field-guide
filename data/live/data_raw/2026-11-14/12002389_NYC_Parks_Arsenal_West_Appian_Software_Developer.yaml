description: |
  Job Description

  NYC Department of Finance (DOF) is responsible for
  administering the tax revenue laws of the city fairly,
  efficiently, and transparently to instill public confidence
  and encourage compliance while providing exceptional
  customer service. DOF’s Finance Information Technology (FIT)
  Division designs, builds, and supports all facets of DOF’s
  computer systems, including hardware, software,
  applications, infrastructure, telephone, and data security.
  FIT delivers and administers tax-related payment programs
  for the City of New York by providing the information
  technology solutions needed to achieve its mission of
  collecting revenue while ensuring an efficient and improved
  customer experience. FIT is also responsible for the systems
  and websites which enable citywide payments, land records,
  property assessment, parking adjudications, customer
  service, and the Sheriff’s public safety work. FIT is
  seeking an experienced Appian Software Developer with a
  specialty in building feature rich internal and public
  facing applications using the Appian Platform to deliver
  exceptional user experiences. Once on board, the ideal
  candidate will become an integral part of a dedicated
  technology team, actively contributing to the overall
  development of high-quality software with hands-on
  designing, coding, and testing of new applications.
  Development and testing will take place in a collaborative
  environment that aligns technical efforts with business
  goals. Candidates will be responsible for ensuring the
  successful delivery of applications built on low-code
  platforms. Reporting to the Director of Parking &
  Collections, the selected candidate’s duties and
  responsibilities will include, but not be limited to:
  - Design, develop, and deploy enterprise-grade, highly
    integrated, complex web and mobile environment
    applications, harnessing your knowledge of data
    structures, algorithms, and design patterns to develop
    full stack and low-code platform solutions, utilizing
    frameworks such as process models, record actions, Rules,
    Expressions, custom web interfaces SAIL (Self-Assembling
    Interface Layer), custom plug-ins and other out of the box
    tools.
  - Identify opportunities to optimize development processes and
    enhance efficiency through the effective use of low-code
    Appian platform and automation for the Parking Ticket Life
    Cycle management.
  - Ensure developed applications adhere to the current and
    future Web Content Accessibility Guidelines (WCAG)
    standards.
  - Contribute to the architectural design and development of
    complex low-code applications, ensuring they are scalable,
    reliable, secure, and aligned with DOF’s business
    objectives. Ensure that applications have a strong
    emphasis on integration and fit in with DOF’s overall low-
    code product strategy.
  - Manage availability, latency, and efficiency of the product
    by engineering reliability into the solution. Trouble-
    shoot, investigate and diagnose incidents using advanced
    tracing, alerting, and log analysis.
  - Create and maintain comprehensive technical documentation.
  - Build automation to prevent problem recurrence and promote
    “quality-first” culture.
  - Crosstrain software developers on the team, sharing best
    practices. Foster a culture of learning and growth.
    Perform application and code reviews, providing
    constructive feedback on quality, design and
    implementation that help ensure that applications meet
    high standards of performance and reliability.
  - Test and debugging front-end applications to ensure cross-
    browser compatibility, responsiveness, and performance
    optimization.
  - Connect Appian applications with external enterprise systems
    and databases using REST/SOAP APIs and connected systems.
  Additional Information: In compliance with federal law, all
  persons hired will be required to verify identity and
  eligibility to work in the United States and to complete the
  required employment eligibility verification document form
  upon hire. This position may be eligible for remote work up
  to 2 days per week, pursuant to the Remote Work Pilot
  Program agreed between the City and the Collective
  Bargaining Unit representing employees serving in the civil
  service title. IT PROJECT SPECIALIST - 06797

  Qualifications

  1. A baccalaureate degree from an accredited college and
  four years of satisfactory full-time experience related to
  the area(s) required by the particular position; or,  2.
  Education and/or experience which is equivalent to "1"
  above.

  Additional Information

  The City of New York is an inclusive equal opportunity
  employer committed to recruiting and retaining a diverse
  workforce and providing a work environment that is free from
  discrimination and harassment based upon any legally
  protected status or protected characteristic, including but
  not limited to an individual's sex, race, color, ethnicity,
  national origin, age, religion, disability, sexual
  orientation, veteran status, gender identity, or pregnancy.
