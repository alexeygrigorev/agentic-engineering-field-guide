  our customers to be their best when it really matters–at the
  Moment of Service™. Our commitment to internal AI adoption
  has allowed us to stay at the forefront of technological
  advancements, ensuring our colleagues can unlock their
  creativity and productivity, and our solutions are always
  cutting-edge.

  At IFS, we’re flexible, we’re innovative, and we’re focused
  not only on how we can engage with our customers but on how
  we can make a real change and have a worldwide impact. We
  help solve some of society’s greatest challenges, fostering
  a better future through our agility, collaboration, and
  trust.

  We celebrate diversity and understand our responsibility to
  reflect the diverse world we work in. We are committed to
  promoting an inclusive workforce that fully represents the
  many different cultures, backgrounds, and viewpoints of our
  customers, our partners, and our communities. As a truly
  international company serving people from around the globe,
  we realize that our success is tantamount to the respect we
  have for those different points of view.

  By joining our team, you will have the opportunity to be
  part of a global, diverse environment; you will be joining a
  winning team with a commitment to sustainability; and a
  company where we get things done so that you can make a
  positive impact on the world.

  We’re looking for innovative and original thinkers to work
  in an environment where you can #MakeYourMoment so that we
  can help others make theirs. With the power of our AI-driven
  solutions, we empower our team to change the status quo and
  make a real difference.

  If you want to change the status quo, we’ll help you make
  your moment. Join Team Purple. Join IFS.

  Job Description

  Core Responsibilities

  - Lead the design, architecture, and implementation of
    scalable APIs, services, and accessibility-first user
    interfaces
  - Deliver AI-native features across both front-end and back-
    end, spanning carbon accounting, ESG data collection, and
    sustainability planning capabilities
  - Drive the evolution of the platform into modular, event-
    driven, API-first components
  - Provide technical direction and make sound engineering
    trade-offs around scalability, maintainability,
    performance, and product impact
  - Own reliability and operational excellence, including
    telemetry, SLOs, error budgets, on-call rotations,
    incident response, and continuous service improvement
  - Champion DevOps practices, including CI/CD, deployment
    automation, monitoring, and application-level operations
  - Collaborate with Platform Engineers as part of a lean DevOps
    shared service model, while taking responsibility for
    application-level DevOps within the team
  - Mentor engineers, promote engineering best practices, and
    help raise the technical bar across the team
  - Champion code quality, documentation, automated testing,
    performance, security, and maintainability
  - Take full ownership of the quality of deliverables,
    including test automation, continuous improvement, and
    production readiness
  - Partner closely with Product Management, Design, AI,
    Platform Engineering, and other engineering teams on
    product discovery, technical trade-offs, and delivery
  - Bring a product- and customer-led mindset to solving
    customer pain points with elegant, scalable engineering
    solutions
  - Identify technical risks, performance bottlenecks, and
    opportunities to improve the platform architecture and
    engineering ways of working

  Qualifications

  Qualifications

  Essential

  - Strong experience in full stack software engineering, with
    proven capability across both front-end and back-end
    development
  - Solid experience with modern front-end technologies,
    particularly React or similar frameworks
  - Strong back-end engineering experience, ideally including
    GoLang or comparable general-purpose programming languages
  - Experience designing and building scalable APIs, services,
    and cloud-native applications
  - Strong understanding of DevOps practices, including CI/CD,
    deployment, monitoring, automation, and incident response
  - Experience delivering secure, observable, high-quality
    production software
  - Strong focus on code quality, automated testing,
    documentation, performance, and maintainability
  - Ability to lead technical design discussions and influence
    architectural decisions
  - Effective collaboration and communication skills across
    Product, Design, Platform, and Engineering teams
  - Ownership mindset, with accountability for outcomes from
    design through to production

  Desirable

  - Experience with cloud platforms such as Azure, AWS, or GCP
  - Experience with event-driven architectures, distributed
    systems, or microservices
  - Experience with relational databases such as PostgreSQL
  - Experience working in cross-functional product teams
  - Experience mentoring engineers or contributing to
    engineering standards
  - Experience with AI-enabled, data-intensive, sustainability,
    carbon intelligence, ESG reporting, or enterprise SaaS
    products
  - Familiarity with sustainability frameworks and standards
    (e.g., GHG Protocol, CSRD, SBTi)
  - Familiarity with observability, reliability engineering,
    SLOs, error budgets, and production incident management

  What We're Looking For

  We are looking for a senior engineer who combines strong
  hands-on engineering with technical leadership. You should
  be comfortable building across the stack, making
  architectural decisions, improving engineering practices,
  and influencing how products are designed, delivered, and
  operated.

  You will be successful in this role if you enjoy solving
  complex customer problems, building scalable cloud-native
  systems, collaborating across disciplines, and helping teams
  deliver high-quality software that has real-world impact on
  industrial decarbonization.

  Additional Information

  We embrace flexibility and hybrid work opportunities to
  support diverse needs and lifestyles, while also valuing
  inclusive workplace experiences. By fostering a sense of
  community, we drive innovation, strengthen connections, and
  nurture belonging. Our commitment ensures you can work in a
  way that suits you best, while also engaging with colleagues
  to share ideas and build meaningful relationships.
