description: |
  The MongoDB Developer Tools team is a diverse group of
  contributors working together to help our users manage
  MongoDB at global scale. This includes building tools for
  MongoDB Atlas: our database as a service offering and
  fastest growing product which allows users to deploy fault-
  tolerant, globally distributed MongoDB clusters in just
  minutes.

  We're seeking an experienced Software Engineer to join our
  Developer Tools Team within the Database Experience
  department. The team is responsible for tools which allow
  users to interact with their data and to understand the
  health and performance of their MongoDB deployments. The
  Developer Tools Team works on a variety of APIs and
  customer-facing UIs empowering MongoDB users to interact
  with their stored data, whether that’s on desktop via
  MongoDB Compass or in the browser via Atlas Data Explorer.

  This role is fully remote for a candidate based in the
  United States with US citizenship.

  We're looking for someone who

  - Is a full stack engineer with a willingness to take on both
    frontend tasks and backend tasks
  - Experience working with TypeScript, React, and Node.js
  - Has experience with the design and architecture of a modern,
    scalable, high availability web application
  - Has experience working with databases
  - Enjoys collaboration and being part of a team
  - Is approachable, curious, and intellectually honest
  - Would enjoy chasing down difficult problems in a distributed
    environment
  - Always strives to expand their knowledge

  Nice to Haves

  - Knowledge of database internals and tuning mechanisms,
    particularly indexing
  - Experience working with websocket based client to server
    communication
  - Familiarity with developing and supporting microservice
    based architectures using Kubernetes

  About MongoDB

  MongoDB is built for change, empowering our customers and
  our people to innovate at the speed of the market. We have
  redefined the data platform for the AI era, enabling
  builders to create, transform, and disrupt industries with
  software. MongoDB’s unified data platform, the most widely
  available, globally distributed data platform on the market,
  helps organizations modernize legacy workloads, embrace
  innovation, and unleash AI. Our cloud-native platform,
  MongoDB Atlas, is the only globally distributed, multi-cloud
  data platform and is available across AWS, Google Cloud, and
  Microsoft Azure.

  With offices worldwide and over 67,000 customers, including
  75% of the Fortune 100 and AI-native startups, relying on
  MongoDB for their most important applications, we’re
  powering the next era of software.

  Our compass at MongoDB is our Leadership Commitment, guiding
  how and why we make decisions, show up for each other, and
  win. It’s what makes us MongoDB.

