description: |
  About

  We're rebuilding how logistics companies hire and retain
  drivers, using AI from the ground up. Trucking powers over
  70% of the nation's freight, but the systems that move
  drivers into seats are slow, manual, and outdated. In a
  world where AI is often replacing jobs, we're using it to
  connect real people to real ones. Our agentic recruiting
  software helps fleets hire faster and smarter so drivers
  actually get on the road.

  We're a small, fast-moving team that ships real product
  every week. We've grown 5x in the past year, and every
  feature we build has a direct line to someone getting hired.

  What you'll do

  You'll be one of the earliest senior engineers on the team,
  working directly with the CTO and CEO to define our
  technical direction. You'll own critical systems end to end,
  make architectural decisions that shape the product for
  years, and set the engineering standards as we scale the
  team.

  This isn't a role where you inherit a codebase and maintain
  it. You'll drive technical strategy, build core
  infrastructure, and mentor engineers as we grow. You'll have
  real influence over what we build, how we build it, and who
  we build it with.

  - Own and evolve core platform architecture across our full
    stack
  - Design and build AI-powered systems including multi-modal
    agents across voice, text, and email
  - Make key technical decisions on infrastructure, tooling, and
    system design
  - Shape engineering culture, processes, and hiring as we scale
    from 10 to 20+
  - Work directly with customers to understand problems and ship
    solutions fast

  What we're looking for

  - Technical leadership: You've been the person others look to
    for architectural guidance. You make systems simpler, not
    more complex.
  - Ownership mentality: You take full responsibility for
    problems, chart your own path, and see things through
    without waiting for direction.
  - Speed and judgment: You move quickly, make sound decisions
    with incomplete information, and know when to ship versus
    when to invest more.
  - Product instinct: You think about user impact first,
    prioritize outcomes over perfection, and care deeply about
    what the customer experiences.
  - Clear communication: You raise blockers early, ask sharp
    questions, and keep people aligned without being prompted.
  - Startup readiness: You're energized by ambiguity, limited
    resources, and the chance to build something that matters.

  Role Qualifications

  - 5+ years of professional software engineering experience,
    with depth in full-stack development
  - Strong proficiency in React, TypeScript, and Python
  - Experience designing and building AI-powered systems (LLMs,
    speech-to-text, workflow orchestration)
  - Track record of owning complex technical projects from
    design through production
  - A Bachelor's degree in Computer Science or a related STEM
    field

  Why Join Now

  You know how painful engineering recruiting is. Now imagine
  an industry where turnover exceeds 90% annually, compliance
  requirements are federally regulated, and most companies are
  still hiring through paper applications and phone tag.
  That's trucking. And it moves over 70% of the nation's
  freight.

  We're building the software that fixes this. We're already
  proving it works, and we're just getting started. You'll
  join at the stage where your technical decisions become the
  foundation, where you help build the team around you, and
  where your work directly shapes the trajectory of the
  company.
