description: |
  Why Sony Interactive Entertainment?

  Sony Interactive Entertainment isn’t just the Best Place to
  Play — it’s also the Best Place to Work. Sony Interactive
  Entertainment (SIE) is the company behind the PlayStation
  brand. As a subsidiary of Sony Group Corporation, we’re part
  of a proud legacy of innovation and excellence. SIE is a
  dynamic technology company, delivering cutting-edge hardware
  and network services to more than 100 million people and an
  entertainment leader, home to some of the most beloved and
  recognizable intellectual properties (IP) in the world. Our
  role at SIE is to create and nurture the experiences under
  the PlayStation brand, a name synonymous with entertainment
  excellence and creativity.

  What you’ll be doing

  - You will take partial ownership of the design and delivery
    of critical software components powering different types
    of runtime machine learning inference on the PlayStation
    consoles. This role demands strong technical leadership,
    driving innovation and advancing the underlying principles
    and architectures to shape the future of these systems.
    This also involves being hands-on with the code
    implementation of these systems.

  - You will be collaborating with internal and external groups
    across the globe to set company-level technology
    strategies and processes, as well as defining the scope of
    the project.

     This is a unique and highly senior position at the core
  of PlayStation technology. Your colleagues in ATG will
  include the engineers responsible for the rendering and ray
  tracing libraries, GPU tools, shader compiler, and
  contributors to the architecture of multiple generations of
  PlayStation consoles. The role also involves close
  collaboration with key hardware and software stakeholders,
  as well as strategic engagement with external vendors.
  Together, these partnerships enable us to provide system and
  game developers with the tools and capabilities to push the
  boundaries of our platforms.  

  What we are looking for

  - At least 10 years of experience in a senior engineering role

  - Sustained professional history of significant and successful
    technical contributions, including responsibility for the
    success of a larger engineering or game project throughout
    the entire development lifecycle
    (design/implementation/release/maintenance).

  - Excellent communication, organization and problem-solving
    skills

  - Experience with game console software development and tools.

  - At least 5 years of experience with GPU programming is
    essential, along with familiarity with GPUs. Fluency in
    C/C++ and shader languages, with a solid understanding of
    GPU programming and low-level computing to deliver
    technical excellence.

  - Familiarity with machine learning is considered an asset.

  Please note, Sony Interactive Entertainment conducts
  background checks at the offer stage for all new employees
  (which may include criminal background checks for some
  roles) and will need to process personal information to
  support these checks.

  Please refer to our Candidate Privacy Notice (where
  applicable) for more information about what personal
  information we collect, how we use it, who we share it with,
  and your data protection rights.

  Equal Opportunity Statement:

