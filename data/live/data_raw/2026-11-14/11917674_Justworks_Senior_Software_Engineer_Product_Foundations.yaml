description: |
  Who We Are

  At Justworks, you’ll enjoy a welcoming and casual
  environment, great benefits, wellness program offerings,
  company retreats, and the ability to interact with and learn
  from leaders in the startup community. We work hard and care
  about our most prized asset - our people.

  We’re helping businesses get off the ground by enabling them
  to focus on running their business. We solve HR issues.
  We’re data-driven and never stop iterating. If you’d like to
  work in a supportive, entrepreneurial environment, are
  interested in building something meaningful and having fun
  while doing it, we’d love to hear from you.

  We're united by shared goals and shared motivations at
  Justworks. These are best summed up in our company values,
  which are reflected in our product and in our team.

  Our Values

  If this sounds like you, you’ll fit right in.

  Product Foundations

  The Product Foundations team owns a set of core platform
  capabilities that support customers across the Justworks
  experience. Our scope includes reporting and analytics,
  document management, training, calendars, communications,
  and organizational data access, serving both administrators
  and employees.

  We focus on building intuitive, reliable, and scalable
  experiences that customers depend on to access information,
  complete critical workflows, and manage their organizations
  effectively. The team works at the intersection of user
  experience, platform capabilities, and operational
  efficiency, with a strong emphasis on usability, self-
  service, and reducing customer friction.

  As a member of Product Foundations, you'll work on products
  that have broad impact across the platform, balancing the
  stability and performance of mission-critical functionality
  with opportunities to introduce innovative solutions. The
  team also led the development of the company's first AI-
  powered product experience, reflecting our commitment to
  applying emerging technologies where they can meaningfully
  improve customer outcomes.

  Who You Are

  You are self-driven and like to work with others to remove
  roadblocks. You are curious, and love to explore and learn
  new technologies. You have demonstrated the ability to
  build, deploy and maintain large-scale, complex
  applications. You care more about solutions and impacting
  the customer experience than using a particular tool or
  framework.

  Your Success ProfileWhat You Will Work On

  - Independently own larged-scoped projects from initial
    discovery through launch with a focus on outcomes and
    customer impact
  - Collaborate with a cross functional team to find solutions
    to customer challenges
  - Improve the performance, reliability, and scalability of our
    existing systems
  - Promote engineering excellence through technical leadership,
    knowledge-sharing and mentorship
  - Add capabilities to our high-volume, fault-tolerant
    processing infrastructure
  - Enhance our testing, monitoring and continuous deployment
    infrastructure
  - Keep extremely sensitive data compartmentalized and secure

  How You Will Do Your Work

  As a Senior Software Engineer, how results are achieved is
  paramount for your success and ultimately result in our
  success as an organization. In this role, your foundational
  knowledge, skills, abilities and personal attributes are
  anchored in the following competencies:

  Good judgment - the exercise of critical thinking, analyzing
  and assessing problems and implications, identifying
  patterns, making connections of underlying issues,
  understanding risks and developing mitigation strategies,
  and taking ownership of the outcome.

  Resourcefulness - taking a can-do approach, even in the face
  of obstacles and constraints by assessing what’s in front of
  you and effectively and efficiently optimizing what you
  have, whether it's working on something new or thinking
  about how to do something better.

  Teamwork and communication - putting our collective best
  together through documentation, collaboration, relationship-
  building, listening, empathy, recruiting, and
  evangelism.Influence and leadership - fostering a community
  of knowledge-sharing, collaboration, mentorship, and
  forward-thinking.

  Skills and knowledge - the capacity to actively learn and
  apply specific domain knowledge, know-how, and best
  practices to continually enhance and improve.

  In addition, all Justworkers focus on aligning their
  behaviors to our core values known as COGIS. It stands for:

  - Camaraderie - Day to day you can be seen working together
    toward a higher purpose. You like to have fun. You’re an
    active listener, treat people respectfully, and have a
    strong desire to know and help others.
  - Openness - Your default is to be open. You're willing to
    share information, understand other perspectives, and
    consider new possibilities. You’re curious, ask open
    questions, and are receptive to thoughts and feedback from
    others.
  - Grit - You demonstrate grit by having the courage to commit
    and persevere. You’re committed, earnest, and dive in to
    get the job done well with a positive attitude.
  - Integrity - Simply put, do what you say and say what you'll
    do. You’re honest and forthright, have a strong moral
    compass, and strive to match your words with your actions
    while leading by example.
  - Simplicity - Be like Einstein: “Everything should be made as
    simple as possible, but no simpler.”

  Qualifications

  - Minimum of 5 years of professional hands-on experience
  - Mastery of modern server side languages, Golang is a plus
    but not required
  - Proficiency with SQL
  - Proficiency with cloud infrastructure management, preferably
    AWS
  - Experience supporting and mentoring other engineers and
    acting as a “force multiplier”
  - Experience working closely with designers and product
    managers

  Technologies Used

  - Golang, Ruby on Rails, Javascript, MySQL, Kafka, AWS, Git,
    Memcache, Redis, ElasticSearch, Docker, Terraform,
    Kubernetes, CircleCI, DataDog

  The base wage range for this position based in our New York
  City Office is targeted at $167,500.00 to $235,000.00 per
  year.

  #LI-PF1 #LI-Hybrid

  Actual compensation is based on multiple factors that are
  unique to each candidate, including and not limited to skill
  set, level of relevant experience, and specific work
  location.  Salary ranges for positions based in other
