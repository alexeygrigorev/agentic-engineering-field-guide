description: |
  About Atticus

  At any given time, 16 million Americans are experiencing a
  crisis that requires urgent help from our legal system or
  government. The right assistance could transform their
  lives. But today, most never get it.

  Atticus makes it easy for any sick or injured American to
  get life-changing aid. Our mission is to tear down barriers
  between people in crisis and the aid they deserve. In the
  last six years, we’ve become the leading platform connecting
  people with disabilities to government benefits.

  We also help victims of accidents, misconduct, and violence
  get compensation from insurance. So far, we’ve helped
  hundreds of thousands of people access over $10 billion in
  life-changing aid —and earned over 20,000 five-star reviews.
  And we’re just getting started.

  We've raised more than $100 million from top VC firms like
  Forerunner, Google Ventures, and True Ventures, and we’re on
  our way to creating a category defining business assisting
  Americans in need.

  The Job

  Engineering at Atticus is about 20 people working in small
  cross-functional pods. Each pod is 4-6 engineers with a PM
  and a designer, owns a piece of the business outright, and
  is accountable for whether that piece works well for our
  clients. Every engineer at Atticus leads projects, has a say
  in what gets built, and is asked to think carefully about
  product decisions, not just implementation. We’re a small
  team, so engineers here work with a lot of independence and
  minimal overhead.

  As an engineer on a product pod, you’ll work alongside your
  PM and design partners to help us faithfully translate messy
  real-world processes into delightful and scalable
  technology: how a disability claim actually moves through
  the system, what a lawyer needs at their fingertips to help
  someone win their case, and how to use our data to tell in
  the first few minutes if someone has a case worth fighting.

  As a Staff Engineer at Atticus, you’ll have an active hand
  in shaping company-spanning design decisions and developing
  other engineers, but Staff Engineers here still spend most
  of their time directly building and shipping our highest
  impact work themselves. You will partner closely with other
  product, design, and engineering leaders across the org to
  define our product and technical strategy, helping us move
  quickly to test new product ideas while making sure the
  technical bets we make now pay off later.

  Your contributions may span:

  - Consumer product experimentation. Building intuitive and
    informative consumer experiences to help people understand
    how Atticus can help them and keep them engaged throughout
    the process.
  - Getting clients to the right lawyer. Honing the intake
    experience for people in crisis and optimizing the ML
    matching systems underneath it.
  - Scaling our tools for attorneys. Delivering software for the
    firms in our network and for our own in-house law firm, so
    cases get handled consistently and well.
  - AI-native legal product. Early-stage product development to
    turn inefficient work lawyers and their staff do by hand
    today into scalable products and workflows.

  Qualifications

  Required

  - You have 6+ years of experience building full stack
    production systems using modern languages and frameworks
  - You have experience designing and operating reliable,
    scalable backend systems and APIs
  - You partner closely with product and design to clarify
    requirements and deliver user-focused solutions
  - You demonstrate good judgment around code quality, including
    when and how to test
  - You are comfortable owning services in production, including
    deployment, monitoring, & handling on-call.

  Bonus / Nice-to-Have

  - Experience with the core technologies in our stack: Go,
    Next.js/TypeScript, Temporal, GCP, and Terraform
  - You have experience building software for industries with
    complex workflows and long-standing practices, such as
    legal, healthcare, or financial services
  - You’re interested in improving internal tooling, developer
    experience, or team processes

  We are strongly committed to building a diverse team. If
  you’re from a background that’s underrepresented in tech,
  we’d love to meet you.

  Salary and Benefits

  This is a rare opportunity to join a startup that has strong
  traction (substantial funding, well-respected backers,
  tremendous growth, and many happy customers) but is still
  small enough that you can have a huge impact and play a role
  in shaping our culture.

  We’re a certified B Corporation tackling a critical social
  problem. Our mission to help people in need drives
  everything we do, and your work here will touch many lives.

  We offer competitive pay — including equity for all
  employees — and generous benefits:

  - Medical and dental insurance with 100% of premiums covered
    for employees and their families
  - 15 vacation days & ~20 paid holidays each year (including
    two weeks at end-of-year)
  - Free membership to OneMedical
  - $600/year internet stipend
  - $1,000/year reimbursable stipend for education and training
    outside of work
  - Up to $1,200/year student loan repayment assistance
  - 401(k) and optional HSA/FSA
  - Humble, thoughtful, smart, fun colleagues

  We anticipate the base salary band for this role will be
  between $245,000 and $300,000 in addition to equity and
  benefits. The salary at offer will be determined by a number
  of factors such as candidate’s experience, knowledge, skills
  and abilities, as well as internal equity among our team.

  Location

  This job is fully remote and we’re committed to empowering
  everyone with flexibility. Work remotely, and travel to LA
  (on the company dime) as needed to be with your colleagues –
  usually quarterly, plus offsites. We care a lot about
  building a great culture and we think some interactions need
  to happen in person, so we put a lot of thought into
  retreats, offsites, and other ways to gather.
