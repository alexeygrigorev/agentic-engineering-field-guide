description: |
  Responsibilities

  - Own the front-end architecture of a high-throughput, real-
    time trading application.
  - Design, build, and maintain production-grade applications
    using Next.js, React, and TypeScript.
  - Implement pixel-accurate, accessible, and responsive UI
    systems under strict performance budgets.
  - Lead complex feature development end-to-end, from technical
    design to production rollout.
  - Optimize rendering paths, state management, data flow, and
    bundle size for sub-second interactions.
  - Integrate deeply with REST and WebSocket APIs powering live
    market data and execution flows.
  - Collaborate tightly with product, design, and backend
    engineers on advanced trading workflows.
  - Set and uphold engineering standards around code quality,
    testing, performance, and maintainability.
  - Mentor other engineers and raise the bar for front-end
    execution across the team.
  - Contribute across the stack when needed (API design, data
    models, infra tradeoffs).

  Requirements

  - 6+ years of professional front-end engineering experience,
    with clear ownership of complex production systems.
  - Expert-level mastery of React, Next.js, and TypeScript in
    high-performance environments.
  - Deep understanding of front-end architecture, rendering
    behavior, and performance optimization.
  - Proven experience with real-time data systems (WebSockets,
    streaming updates, event-driven UI).
  - Strong instincts around state management, data consistency,
    and UI correctness under load.
  - Comfort reasoning about backend systems (Node.js, databases,
    cloud infrastructure); hands-on experience is a plus.
  - Track record of shipping and maintaining features that
    operate at scale.
  - Ability to make high-leverage technical decisions
    independently.

  Non-Negotiable

  - Speed — in execution, iteration, and UI responsiveness.
  - Obsession with performance, not just aesthetics.
  - High ownership, low ego, zero tolerance for sloppy systems.

  Preferred

  - Prior experience in fintech, trading platforms, or other
    latency-sensitive products.
  - Open-source contributions or technically substantial side
    projects.
  - Comfort operating in fast-moving, high-accountability
    startup environments.
