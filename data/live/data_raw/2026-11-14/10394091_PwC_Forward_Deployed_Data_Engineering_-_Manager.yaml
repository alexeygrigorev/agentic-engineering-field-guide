description: |
  The Opportunity As a Forward Deployed Data Engineering -
  Manager, you will play a pivotal role in developing
  innovative software solutions to drive digital
  transformation and enhance business performance. Within our
  Tax practice, you will leverage your technical experience
  and creative thinking to design, code, and test applications
  that revolutionize industries and deliver exceptional user
  experiences. As a Manager, you will motivate, develop, and
  inspire others to deliver quality. You are responsible for
  coaching, leveraging team members' unique strengths, and
  managing performance to meet client expectations. With your
  growing knowledge of how business works, you play an
  important role in identifying opportunities that contribute
  to the success of our firm. You are expected to lead with
  integrity and authenticity, articulating our purpose and
  values in a meaningful way. In this role, you will take
  ownership of projects, confirming their successful planning,
  budgeting, execution, and completion. You will also develop
  skills outside your comfort zone and encourage others to do
  the same. By embracing technology and innovation, you will
  enhance your delivery and inspire your team to achieve
  excellence. This is an opportunity to make a significant
  impact within our Tax practice, fostering a culture of
  continuous improvement and innovation. Responsibilities
  - Leading the development and deployment of innovative
    software solutions to drive digital transformation
  - Managing client relationships and expectations to deliver
    exceptional user experiences
  - Guiding teams in the design, coding, and testing of
    applications that enhance business performance
  - Utilizing technical skills in API management and software
    development methodologies to optimize project outcomes
  - Overseeing the integration of enterprise applications and
    confirming seamless functionality across systems
  - Conducting code reviews and maintaining coding standards to
    uphold software quality
  - Implementing continuous integration and delivery practices
    to streamline software development processes
  - Analyzing system components to identify linkages and
    interactions for improved software architecture
  - Mentoring team members to develop their skills and encourage
    professional growth
  - Addressing and resolving conflicts or issues with clients
    and stakeholders to maintain project alignment
  What You Must Have
  - At least a Bachelor's degree
  - At least 4 years of experience
  What Sets You Apart
  - Excelling in API Management and Application Development
  - Demonstrating proficiency in Continuous
    Integration/Continuous Delivery (CI/CD)
  - Utilizing Python and Scripting Languages for software
    solutions
  - Applying analytical thinking to complex data engineering
    challenges
  - Leading teams in software project management and planning
  - Embracing change and fostering innovation in client support
  - Mentoring junior staff in software engineering and
    development
  The salary range for this position is: $99,000 - $266,000.
  Actual compensation within the range will be dependent upon
  the individual's skills, experience, qualifications and
  location, and applicable employment laws. All hired
  individuals are eligible for an annual discretionary bonus.
