  About Us

  Quanata is on a mission to help ensure a better world
  through context-based insurance solutions. We are an
  exceptional, customer centered team with a passion for
  creating innovative technologies, digital products, and
  brands. We blend some of the best Silicon Valley talent and
  cutting-edge thinking with the long-term backing of leading
  insurer, State Farm.

  Learn more about us and our work at quanata.com



  Our Team



  Quanata, LLC is an insurance technology innovation company
  that engineers advanced risk prediction and prevention
  solutions, develops risk-focused acquisition capabilities,
  and builds/supports a full-stack, flexible, digital &
  increasingly AI-native insurance platform. This helps our
  primary clients, State Farm and HiRoad Assurance Company,
  adapt to evolving market needs. Quanata, LLC is wholly owned
  and funded by State Farm. As a company that prioritizes an
  inclusive and positive culture, we believe the core of our
  success is in hiring talented people — across disciplines —
  who want to help us make a quantifiable impact.

  The Role

  We’re looking for an accomplished, well-rounded Senior
  Software Development Engineer in Test (Sr SDET) to help
  improve the quality and reliability of services that support
  insurance products and business workflows.

  This hands-on role requires deep backend testing experience,
  strong programming ability, and ownership of scalable test
  automation.

  The individual will validate service behavior and cross-
  system interactions, strengthen automated delivery checks,
  and help teams identify defects early in cloud-hosted,
  distributed environments.

  Your Day-to-Day

  - Design, build, test, and maintain shared automation
    frameworks, internal services, and developer tools that
    serve multiple QA and engineering teams.
  - Own test strategy and execution for backend APIs,
    microservices, and end-to-end business workflows,
    balancing component, contract, integration, and system-
    level coverage.
  - Design and extend code-based automation frameworks with
    reusable setup and cleanup, data-driven scenarios,
    dependency isolation, and clear failure reporting.
  - Validate business rules, API contracts, data persistence,
    authorization, error handling, and compatibility across
    services.
  - Test asynchronous processing and distributed-system failure
    conditions, including retries, duplicate events, partial
    failures, and delayed consistency.
  - Establish reliable automated checks in continuous
    integration and delivery pipelines, improving feedback
    speed and reducing flaky tests.
  - Validate cloud-hosted services and deployment
    configurations; troubleshoot failures using application
    logs, service telemetry, and infrastructure evidence.
  - Assess performance and resilience risks, design targeted
    tests, and collaborate with engineers to address
    identified weaknesses.
  - Review requirements and architecture, communicate quality
    risks, and mentor engineers while independently driving
    complex testing work.
  - Perform other related duties as assigned.

  About You

  - Bachelor’s or Master’s degree in Computer Science,
    Engineering, or a related field, or equivalent relevant
    experience.
  - Typically 6–8 years of software testing or engineering
    experience, including at least 3 years focused on backend
    APIs and service-based architectures.
  - Substantial hands-on experience developing test automation
    frameworks and integrating them into automated delivery
    pipelines.
  - Strong proficiency in a general-purpose programming
    language, with the ability to design, review, and debug
    maintainable test code.
  - Deep understanding of API testing, microservice
    interactions, service contracts, and distributed
    application behavior.
  - Advanced automation design skills, including test lifecycle
    management, parameterized execution, mocking, shared
    utilities, and parallel execution.
  - Practical experience testing and troubleshooting public-
    cloud applications, including identity and permissions,
    networking, compute, storage, and messaging dependencies.
  - Experience with continuous integration and delivery, source
    control, automated quality checks, and environment
    configuration.
  - Strong database querying skills and the ability to trace
    data and failures across multiple services.
  - Ability to turn incomplete requirements into meaningful
    tests and communicate technical findings clearly.

  Bonus Points

  - Property and casualty insurance experience is preferred,
    including policy administration, billing, rating, claims,
    or related integrations.
  - Experience testing event-driven architectures and complex
    third-party integrations.
  - Experience with performance, resilience, and service-level
    security testing.
  - Demonstrated improvement of automation reliability,
    execution time, or defect detection.

  Salary: $198,000 to $281,000

  *Please note that the final salary offered will be
  determined based on the selected candidate's skills, and
  experience, as well as the internal salary structure at
  Quanata. Our aim is to offer a competitive and equitable
  compensation package that reflects the candidate's expertise
  and contributions to our organization.

  Additional Details:

  - Benefits: We provide a wide variety of health, wellness and
    other benefits.These include medical, dental, vision, life
    insurance and supplemental income plans for you and your
    dependents, a Headspace app subscription, monthly wellness
    allowance and a 401(k) Plan with a company match.
  - Work from Home Equipment: Given our virtual environment— in
    order to set you up for success at home, a one-time
    payment of $2K will be provided to cover the purchase of
    in-home office equipment and furniture at your discretion.
    Also, our teams work with MacBook Pros, which we will
    deliver to you fully provisioned prior to your first day.
  - Paid Time Off: All employees accrue four weeks of PTO in
    their first year of employment.  New parents receive
    twelve weeks of fully paid parental leave which may be
    taken within one year after the birth and/or adoption of a
    child. The twelve weeks is applicable to both birthing and
    non-birthing parent.
  - Personal and Professional Development: We’re committed to
    investing in and helping our people grow personally and
    professionally.  All employees receive up to $5000 each
    year for professional learning, continuing education and
    career development.  All team members also receive
    LinkedIn Learning subscriptions and access to multiple
    different coaching opportunities through BetterUp.
  - Location: We are a remote-first company for most positions
    so you may work from anywhere you like in the U.S,
    excluding U.S. territories. For most positions, occasional
    travel may be requested or encouraged but is not required.
    Some positions might require travel per the job
    description provided to the employee. Employees based in
    the San Francisco Bay Area or in Providence, Rhode Island
    may commute to one of our local offices as desired.
  - Hours: We maintain core meeting hours from 9AM - 2PM Pacific
    time for collaborating with team members across all time
    zones.

