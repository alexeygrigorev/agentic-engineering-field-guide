description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  About the role

  We at Wise Platform aim to be the infrastructure that powers
  the world's money by connecting banks, financial
  institutions, and enterprises to our next-generation payment
  solutions. You’ll own and shape critical API infrastructure
  that serves partners such as Google, Deel, Ramp, and Agoda.

  Within Wise Platform, the KYC Experience team owns the end-
  to-end onboarding and identity verification capabilities
  that make those partner integrations possible. We build the
  APIs and services that let our partners onboard their
  customers compliantly and seamlessly, setting the standard
  for what world-class embedded KYC looks like.

  We’re looking for a product-focused Senior Software Engineer
  to join our team in London, helping build seamless KYC and
  Onboarding products for our partners. You'll work in an
  autonomous cross-functional team alongside other engineers,
  product, analytics, compliance and operations, with full
  autonomy to shape the direction of the Wise Platform KYC
  experience.

  What will you be working on?

  - Design and build public-facing APIs for Wise Platform and
    our partners that are intuitive, consistent, and easy to
    use. We want to set the standard for seamless financial
    integrations
  - Own and drive technical roadmaps across your domain
    (squad/tribe level), ensuring technical debt, reliability,
    scalability, and security concerns are addressed and
    clearly connected to the product roadmap
  - Architect highly robust and scalable microservices using
    event-driven design patterns
  - Key influencer in product roadmapping and strategy sessions
    with product management and the rest of your cross-
    functional team
  - Lead impactful problems both within your team and beyond,
    driving high impact cross-team initiatives that unlock new
    features and value for our partners
  - Mentor and influence engineers and leads through code
    reviews and best practices, raising the bar for technical
    excellence across the discipline

  Qualifications

  - Strong foundation in modern Java or other JVM based
    language, experience with the Spring framework, with a
    commitment to clean, testable, and highly performant code
  - Deep experience building and operating microservices, with a
    solid understanding of event-driven architecture,
    distributed system and concurrency patterns
  - Hands-on experience with Kafka or similar messaging systems,
    including designing and owning robust, scalable event
    pipelines
  - Proficiency with relational and non-relational databases,
    including query optimization, schema design, and
    thoughtful data lifecycle management for sensitive
    information
  - Product-oriented thinking with a strong product mindset,
    prioritising customer needs and using data-driven
    decisions to shape roadmaps and fix partner problems
  - Experience leading cross-team and inter-disciplinary
    initiatives, coupled with a passion for clean, well-
    tested, performant code
  - Great communication skills and the ability to articulate
    complex, technical concepts to non-technical audiences,
    and to guide debates to a clear decision

