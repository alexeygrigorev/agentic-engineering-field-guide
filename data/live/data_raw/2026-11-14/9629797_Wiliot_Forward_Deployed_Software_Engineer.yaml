description: |
  Description

  Wiliot was founded by the team that invented one of the
  technologies at the heart of 5G. Their next vision was to
  develop an IoT sticker, a computing element that can power
  itself by harvesting radio frequency energy, bringing
  connectivity and intelligence to everyday products and
  packaging, things previously disconnect from the IoT. This
  revolutionary mixture of cloud and semiconductor technology
  is being used by some of the world’s largest consumer,
  retail, food and pharmaceutical

  companies to change the way we make, distribute, sell, use
  and recycle products.

  Our investors include Softbank, Amazon, Alibaba, Verizon,
  NTT DoCoMo, Qualcomm and PepsiCo.

  We’re looking for Forward Deployed Software Engineers to
  join our growing team and help build the next generation of
  data-driven applications that bring intelligence to
  individual cases across the supply chain. These applications
  will unlock insights at the granular level—tracking
  location, temperature, humidity, product freshness, and more
  help global enterprises act on them in real time.

  This is a hands-on engineering role focused on designing,
  building, and deploying applications that interface with
  Wiliot’s IoT cloud, device data, and enterprise systems.
  You’ll work closely with product managers, hardware teams,
  and customer-facing leads to deliver high-impact software at
  scale. This will also include direct interactions with
  customers to help support solving their use cases

  Responsibilities

  - Serve as a customer-facing technical expert, working
    directly with clients to understand their needs, address
    technical challenges, and deliver effective solutions.
  - Develop applications and microservices using modern Python.
  - Design APIs and backend services to process and expose
    ambient IoT sensor data.
  - Collaborate with data engineering and cloud platform teams
    to integrate real-time and batch data flows.
  - Participate in requirements gathering and product ideation.
  - Ensure scalability, security, and performance of software
    solutions.
  - Troubleshoot and resolve issues in production environments.
  - Write unit, integration, and E2E tests to maintain code
    quality.
  - Contribute to CI/CD pipelines and DevOps processes.
  - Document technical decisions and support internal
    stakeholders.

  Requirements

  - 3–6 years of software development experience in backend or
    full stack roles.
  - Proficiency in Python is a must.
  - Experience working with cloud platforms (AWS, Azure, or
    GCP).
  - Demonstrated experience with Apache Spark.
  - Familiarity with RESTful APIs, microservices, and event-
    driven architectures.
  - Solid understanding of relational and/or NoSQL databases
    (PostgreSQL, MongoDB, DynamoDB, etc.).
  - Comfortable in agile teams and fast-paced development
    environments.
  - Strong debugging, system design, and problem-solving skills.
  - Based in NYC or willing to work hybrid in the NYC office.

  Preferred Qualifications

  - Experience with data-heavy applications (IoT, telemetry,
    sensor networks, or analytics platforms).
  - Exposure to containerization (Docker, Kubernetes).
  - Familiarity with Databricks
  - Familiarity with edge/cloud integrations or device-cloud
    architectures.
  - Background in logistics, supply chain, cold chain, or RFID
    systems is a strong bonus.

