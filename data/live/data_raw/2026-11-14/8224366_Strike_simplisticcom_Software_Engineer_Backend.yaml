description: |
  Better Money

  Strike is the Bitcoin company. With Strike, you can buy and
  sell bitcoin, pay bills, and borrow against your holdings.
  From individuals to businesses, Strike is purpose-built for
  every step of the Bitcoin journey. Available in more than
  100 countries — including the U.S., Europe, Latin America,
  and Africa — Strike is building a better financial system
  powered by Bitcoin. Bitcoin is better money. Strike is how
  you use it.

  Role

  Strike is looking for developers who have experience in
  building robust, scalable and secure systems. You will be
  joining one of top engineering teams in the Bitcoin and
  fintech space focused on building the Backend orchestrating
  Strike’s high-scale, neo-payment network.

  The Backend team works on some of the most challenging,
  complex, and high-visibility areas of the company. You will
  work cross-functionally with our product, engineering, and
  operations department in order to deliver best in class
  solutions for infrastructure management.

  We’re looking for a hire that will grow with the company and
  is excited about Strike’s mission and potential. The person
  joining us must be comfortable with team-first approach in a
  remote work environment.

  This position is available to candidates located in European
  and U.S. time zones.

  Responsibilities:

  - Collaborate with other engineers and designers to develop
    and ship features
  - Design, build, and maintain our API’s
  - Write efficient, modular, and reusable libraries and
    abstractions
  - Design and build internal tooling to improve development
    efficiency
  - Find and solve performance issues
  - Participate in code reviews
  - Communicate best practices to the team

  Requirements:

  - You enjoy difficult engineering challenges and are
    passionate about programming
  - You have at least 5 years of recent experience with C#
  - You are self-driven and self-motivated
  - You enjoy working both collaboratively and independently
  - Experience with .NET Core, EF Core

  Additional Qualifications:

  - Bitcoin experience
  - xUnit, Moq, testing frameworks

  US-Based Positions

  - Salary range: $177,000 - $199,000
  - Equity in a high-growth startup
  - Health, dental, and vision insurance premium contributions;
    short & long-term disability insurance and basic life
    insurance
  - Cell phone and internet reimbursement
  - Flexible PTO, sick leave & parental leave
  - Access to a company 401k plan

  Non US-Based positions

  - Location Dependent

  We do not make hiring decisions based on educational history
  whatsoever. Our Founder is a college dropout. We employ high
  school dropouts, PHD candidates and everything in-between.
  We do not hire credentials. We simply hire talented,
  passionate individuals who are excited to be a part of our
  team.

  By clicking submit application below, you consent to our use
  and processing of your data as described in our Candidate
