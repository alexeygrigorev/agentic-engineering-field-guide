description: |
  About ENSEK ENSEK builds the cloud‑native SaaS software
  that’s transforming how energy retailers operate, innovate
  and manage at scale.

  We help retailers lower operating costs, improve billing
  accuracy for consumers, and enhance customer experience
  through automation and AI‑driven insight, all underpinned by
  modern, cloud‑native architecture.

  ENSEK is at an exciting inflection point as we scale at pace
  towards new international horizons. If you’re driven by
  solving complex, real‑world problems and want to build
  modern technology that accelerates the global energy
  transition, you’ll feel right at home with us.

  About the role

  As a Senior Software Engineer, this is a great opportunity
  to join at a pivotal moment; helping modernise architecture,
  influence engineering culture, and build products that will
  support customers across the UK, Europe, North America and
  beyond.

  You'll design, build and evolve scalable software while
  helping shape how we work, how we architect systems, and how
  we deliver value to our customers.

  Key responsibilities:

  - Build products, not just features: Partner closely with
    Product and Design to understand problems and shape
    solutions.
  - Driving platform modernisation and transformation: Design
    and build modular, API-first solutions and support strong
    domain boundaries and engineering standards.
  - Driving full-stack ownership: Taking solutions from design
    and build through to testing and deployment
  - Drive engineering excellence: Championing modern development
    practices including automated testing, peer review and
    continuous delivery.
  - Raise the bar around you: Mentor and support other engineers
    and contribute to engineering communities, guilds and
    knowledge-sharing initiatives

  Success in this role isn't measured by the number of tickets
  delivered. You will solve complex customer problems, build
  scalable products, and own meaningful outcomes that shape
  the future of our platform.

  Experience required:

  We're looking for engineers who combine strong technical
  capability with a product mindset. We would love to hear
  from you if you have:

  - Experience building and operating modern, cloud-native
    software products within a product-led SaaS environment,
    with strong full-stack engineering fundamentals and a
    focus on clean, maintainable code.
  - Proven ability to design and deliver scalable, resilient
    solutions using technologies such as C#, .NET, AWS, APIs,
    distributed systems, and SQL Server.
  - Comfortable contributing to architecture, technical
    strategy, and engineering best practices, with experience
    in microservices, event-driven systems, Domain Driven
    Design (DDD), and cloud-native patterns
  - A product mindset that goes beyond technical requirements to
    understand customer problems, deliver meaningful outcomes,
    and drive business impact.
  - Strong collaboration and communication skills, with
    experience working in Agile, cross-functional product
    teams and helping to raise engineering standards across
    the organisation.
  - Curious, adaptable, and growth-oriented, with a passion for
    continuous improvement, modern DevOps practices, CI/CD,
    observability, automation, and learning new technologies.

  Company Benefits

  - 25 days’ holiday + bank holidays
  - Option to buy or sell 5 extra annual leave days per year
  - Vitality Health Insurance, including private healthcare,
    virtual GP access, mental‑health support and wellbeing
    perks (50% off gym memberships -Virgin Active, Nuffield,
    PureGym)
  - Pension with 5% matched contribution
  - Regular team‑wide and company‑wide events
  - 2 volunteering days per year to give back
  - Remote‑first working environment with offices in London and
    Nottingham
