description: |
  About Dwelly

  Dwelly is building the AI operating system for residential
  lettings. Its growing network of agencies provides its AI
  with real-world data, continuous feedback, and control over
  complete workflows, making exceptional service the standard
  for landlords and tenants. Today, Dwelly operates more than
  15,000 properties and $470 million in GMV, making it one of
  the UK’s ten largest lettings operators. The company has
  raised $263 million. We’re a fast-growing, product-focused
  company, backed by top-tier investors and led by a team with
  deep experience in real estate, technology, and operations.

  Position Summary

  We’re looking for a Staff Software Engineer to join one of
  our core domain teams — Tenant Find, Property Management, or
  Payments. This is a high-impact role at the intersection of
  business, product, architecture, and hands-on execution. You
  will be expected to understand how the domain works in
  practice, identify the highest-leverage opportunities for
  automation, shape the solution, and drive it through to
  production. You will work in a small, high-ownership team
  where exceptional engineers can have disproportionate
  impact. This role requires advanced day-to-day use of AI and
  LLMs as part of exploring problems, evaluating solution
  paths, accelerating implementation, and designing automation
  systems.

  We’re hiring remotely across the UK, Ireland, and European
  time zones. Candidates should be based within these
  regions/time zones to enable effective collaboration with
  the wider team.

  Key Responsibilities

  - Deep domain understandingGain a deep understanding of your
    assigned domain (Tenant Find, Property Management, or
    Payments) and identify the highest-leverage opportunities
    for automation. Understand real operational workflows,
    including legacy processes, manual work, local exceptions,
    and agency-specific variations. Determine what should be
    standardized and what should remain flexible while
    designing robust, scalable solutions.
  - Automation and AI-driven systemsDesign, implement, and
    maintain systems that automate manual processes across
    acquired agencies. Apply advanced AI and agentic
    techniques pragmatically to improve decision quality,
    operational efficiency, and team leverage. Ensure
    automation reduces operational load, improves reliability,
    and enhances business margins.
  - Product and architectural collaborationPartner closely with
    product managers to frame problems, define solutions, and
    prioritize initiatives. Make architectural decisions
    grounded in operational reality rather than abstract
    models. Contribute to moving the system and the people
    around it toward better outcomes, balancing flexibility,
    scalability, and reliability.
  - End-to-end ownership and impactTake full responsibility for
    outcomes, not just implementation. Deliver projects from
    concept to production rollout, continuously improving
    processes. Influence the overall direction of your domain,
    shape automation strategy, and materially improve business
    economics.

  Qualifications and Preferred Background

  - Strong engineering background with experience independently
    delivering complex systems from idea to production
  - Solid experience with Node.js + TypeScript and React +
    TypeScript
  - Familiarity with modern TypeScript patterns, tRPC, Drizzle,
    and SQL (MySQL/Postgres), or ability to ramp up quickly
  - Ability to design architectures for fast-changing products
    with real operational constraints
  - High autonomy, ownership, and comfort making decisions under
    ambiguity
  - Product judgment and the ability to connect technical
    decisions to business outcomes
  - Strong understanding of the modern AI landscape and agentic
    workflows, with pragmatic application beyond hype
  - Experience in end-to-end delivery in domains with fragmented
    legacy workflows and operational complexity
  - Strong communication skills and fluency in English
  - Higher degree education
  - Startup mentality: resilience, adaptability, and ability to
    thrive in a fast-paced environment
  - Customer-centric mindset: focus on delivering value to end-
    users or clients
  - Strong problem-solving skills – ability to approach
    challenges logically and propose practical solutions

  Compensation and benefits

  - The role is fully remote, providing flexibility and enabling
    seamless collaboration with our geographically distributed
    team
  - Competitive salary with the potential for equity options
    based on performance, recognising exceptional
    contributions to our integration success

  What is it like being a Dwell-er

  Feel free to check out Dwelly Core Principles. That’s about
  what we believe in, how we operate and make decisions

  What we offer is not a fancy office or a static workplace.
  Instead, this is solving one of the world’s most complex
  problems in the largest consumer industry in the world
  (residential rentals), to improve the experience for over
  30% of households (more than 5 million in the UK, and over
  100 million including EU and US) that live in rental homes

  This is about disrupting the largest, most antiquated
  industry in the world, with one of the strongest operational
  and technical teams that exist in the UK and the EU. We work
  hard, and we shoot for extremely ambitious results. But we
  want people to be proud of what they’ve built and be able to
  look back and say one day “hell yeah, that was me that did
  it all”

  - Customer obsession rather than competitive focus
  - Passion for invention
  - Operational excellence
  - Long-term thinking

  By applying for this position, you consent to the processing
  and storage of your personal data for recruitment purposes
  for up to 365 days, in accordance with our data retention
  policy and applicable data protection laws.
