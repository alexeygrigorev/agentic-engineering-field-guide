description: |
  About Leap

  Leap is one of the fastest-growing benefits solutions and a
  category-defining pioneer in employer specialty pharmacy. We
  are reshaping how life-changing therapies are delivered and
  financed, ensuring patients get the treatment they need
  while employers finally get a fair deal.

  Specialty drugs and infusions represent nearly 10% of all
  healthcare spend and are the fastest-growing cost category
  for employers. Leap tackles this challenge with a novel
  approach: eliminating hidden markups, expanding access to
  high-quality infusion providers, and bringing clarity and
  fairness to how therapies are priced and paid for.

  We’re proud to partner with numerous Fortune 500 companies
  and leading TPAs. Each patient we serve creates immediate
  ROI: lower costs, improved access, and better care. Join us
  as we redefine what’s possible in specialty care.

  About the Role

  As a Senior Software Engineer, you will build the AI and
  automation systems that power Leap’s clinical and business
  operations. You will own large surface areas across product,
  data, infrastructure, and automation, helping scale the
  company’s operational platform as the business grows. This
  role partners closely with Clinical Operations, Business
  Operations, and company leadership to identify high-value
  automation opportunities and ship systems that improve care
  delivery and internal efficiency. Engineers here have real
  input into what we build, not just how.

  What You'll Do

  AI and Automation

  - Build LLM agents and automation pipelines that replace
    manual operational workflows
  - Design and ship AI-driven care orchestration systems that
    coordinate treatment journeys across patients, providers,
    pharmacies, and internal teams
  - Identify high-value automation opportunities by working
    directly with clinical and business operations teams

  Product Development

  - Own and ship both internal and external products used by
    clinical teams, growth teams, partners, and customers
  - Talk to users (often internal teams), instrument what you
    ship, and use the data to decide what to build next

  Platform and Infrastructure

  - Build and maintain shared services, identity/auth, and
    HIPAA-compliant data architecture
  - Ship integrations across CRM and external healthcare systems
  - Design PHI-safe LLM pipelines, agent orchestration
    frameworks, evaluation systems, and MCP integrations

  What You Bring

  - 5+ years of experience building with AI systems in
    production (LLM integrations, agents, AI-powered
    workflows)
  - TypeScript-native, full-stack generalist comfortable across
    frontend, backend, data, and infrastructure
  - Track record of shipping fast with high quality - your code,
    UI, and documentation hold up without a designer or QA
    team
  - Experience building 0-1 at an early stage startup
  - Use AI heavily in your own development workflow

  Bonus Points For

  - Healthcare or HIPAA experience, data pipelines (BigQuery,
    ETL), or CRM integrations (Salesforce, HubSpot)

  At Leap, we’re building an outlier company with real impact
  — and that takes focus, energy, and commitment. If that
  excites you, we’d love to hear from you. Leap is an equal
  opportunity employer and welcomes applicants from all
  backgrounds. We’re committed to building a team that
  reflects a diversity of perspectives, experiences, and
  identities.
