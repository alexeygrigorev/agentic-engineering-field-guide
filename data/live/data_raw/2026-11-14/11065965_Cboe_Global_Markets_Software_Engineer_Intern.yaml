description: |
  Job Description:

  Building trusted markets — powered by our people.

  At Cboe Global Markets, we inspire our people to solve
  complex challenges together because what we do matters. We
  provide the financial infrastructure that powers the global
  economy. As a leading provider of market infrastructure and
  tradable products, Cboe delivers cutting-edge trading,
  clearing and investment solutions to market participants
  around the world.

  Cboe interns work with a variety of staff across multiple
  departments and have the opportunity to put their skills to
  work in their field of interest, while learning about
  Exchange technology and operations through our robust
  Options Institute courses.

  The three main foundational pillars of our internship
  program are: develop, educate and network. We want to ensure
  each of our interns receive a real-world working experience
  that encourages academic, professional and personal growth.

  Candidates should be versatile, eager and able to work in a
  fast-paced, time-sensitive financial and technical
  environment. To be eligible for this internship, applicants
  must be enrolled in a university or college program and
  should not be scheduled to graduate before December of the
  internship year. Our internship program runs from June to
  August and you will wrap up your internship with a final
  presentation and retreat. Visit our student page for more
  information about our internship program!

  The Cboe Web team is hiring for a Software Engineer Intern.

  As a Software Engineering Intern at Cboe, you'll work on
  real applications and technologies that support our global
  markets and business operations. Interns contribute to
  projects that are intended for production use and
  collaborate with experienced engineers, product owners, and
  business stakeholders to solve meaningful challenges.

  Our software engineering teams work across a broad range of
  technologies and domains, from high-performance exchange
  systems and platform infrastructure to cloud applications,
  web development, user experiences, data platforms, and
  internal business tools.

  Technologies You May Work With

  Depending on your team assignment and project, you may have
  opportunities to work with technologies such as:

  - C++
  - Java
  - Python
  - C# / .NET
  - JavaScript / TypeScript
  - ReactJS and modern web frameworks
  - Cloud and distributed systems technologies
  - SQL and data platforms
  - Linux and containerized environments
  - APIs, microservices, and real-time systems

  You may contribute to projects ranging from low-latency
  platform and infrastructure engineering in C++ to modern
  web, UX, and full-stack application development using
  Python, ReactJS, and .NET technologies.

  Qualifications

  The ideal candidate:

  - Is currently pursuing a Bachelor's or Master's degree in
    Computer Science, Computer Engineering, Software
    Engineering, or a related field
  - Has experience programming in one or more languages such as
    C++, Java, Python, C#, or JavaScript
  - Demonstrates strong problem-solving and analytical skills
  - Has an interest in software design, development, and modern
    engineering practices
  - Works effectively in a collaborative team environment
  - Is eager to learn new technologies and contribute to real-
    world software projects

  Preferred Qualifications

  - Experience with object-oriented programming concepts
  - Familiarity with web development technologies and frameworks
  - Exposure to databases, APIs, or cloud technologies
  - Experience with Linux or Unix-like operating systems
  - Understanding of software testing, version control, and
    Agile development methodologies
  - Interest in financial technology, capital markets, or highly
    scalable distributed systems

  Benefits and Perks

  - Competitive compensation
  - 2:1 401(k) match, up to 8% match immediately upon hire.

  Some of our employees’ favorite benefits and perks include:

  - Daily complimentary in-office lunch from local restaurants
  - Endless free coffee and snacks to fuel your workday
  - Monthly in office networking events and happy hours
  - Associate Resource Groups (ARGs) and affinity groups for
    support and community building

  More About Cboe Global Markets

  We’re reimagining the future of the workplace by focusing on
  what matters most, our people.  Our journey is an inclusive
  one. We’re investing deeply in leadership programs and
  career development initiatives that ensure everyone has an
  equal chance to succeed. We celebrate the diversity in our
  communities, inside and out, and welcome new perspectives
  with equity, inclusion and belonging.

  We work with purpose, solving problems with ingenuity,
  collaboration, and a lot  of passion. We’re an engaged and
  excited team connecting markets across borders and embracing
  growth in all its forms to achieve incredible outcomes.

  Learn more about life at Cboe on our website, LinkedIn, and
  our student page for more information about our internship
  program!

  Equal Employment Opportunity

  We're proud to be an equal opportunity employer - and
  celebrate our employees’ differences, including race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, age, disability, and Veteran status.

  This position is not eligible for visa sponsorship.
  Candidates must be legally authorized to work in the United
  States without the need for employer sponsorship now or in
  the future.




  Our pay range for interns is determined by function and
  education level. The national new hire base pay range for
  this job in the United States is $22.00 - $42.00 per hour.
  This range represents the minimum and maximum base pay
  target for new hires working in the position full time.



  Within the range, individual pay is determined by years of
  education completed. In addition to base pay, eligibility
  for our total rewards program may include benefits such as
  401 (k) with a generous company match and paid sick time.
  Your recruiter will provide more details about the total
  compensation package during the hiring process



  Any communication from Cboe regarding this position will
  only come from a Cboe recruiter who has a @cboe.com email or
  via LinkedIn Recruiter. Cboe does not use any other third
  party communication tools for recruiting purposes.
