description: |
  We are Builders FirstSource, America’s largest supplier of
  building materials, value-added components and building
  services to the professional market. You’ll feel proud of
  the work you do here every day to transform the future of
  home building and help make the dream of home ownership more
  achievable. At BFS, we believe building a successful career
  is not solely defined by a degree. Your experience, skills,
  and passion are just as important, if not more so. As such,
  we are committed to creating a diverse and inclusive
  workplace that welcomes candidates from all backgrounds and
  experience levels.



  PURPOSE

  The Senior Manager, IT - Software Engineering and
  Development leads the teams and technology portfolio
  supporting OTC Sales Execution, OMS+, and the integrations
  connecting SAP S/4HANA with OMNI, myBLDR, AppWright,
  Salesforce, and related sales applications. The role is
  accountable for solution strategy, application lifecycle,
  engineering quality, service reliability, and business
  outcomes across quote-to-order and connected customer and
  sales experiences.



  This leader partners with Sales, Operations, Product,
  Enterprise Architecture, Integration, Security, Quality
  Assurance, Business Enablement, Organizational Change
  Management, and external providers to deliver scalable,
  secure, and supportable solutions. The role owns IT solution
  delivery while sharing accountability with the business for
  process alignment, requirements quality, prioritization,
  release readiness, capability outcomes, issue resolution,
  and training content.





  ESSENTIAL DUTIES AND RESPONSIBILITIES



  - Lead managers and professional staff responsible for OTC
    Sales Execution, OMS+, and integrations supporting OMNI,
    myBLDR, AppWright, Salesforce, Install, SAP S/4HANA, and
    related applications.
  - Own the solution strategy, system design, configuration
    approach, technical roadmap, lifecycle, and service model
    for the assigned application portfolio.
  - Partner with business leaders to align processes, controls,
    and technology solutions with strategic priorities,
    operational needs, and customer outcomes.
  - Translate business requirements into complete, testable,
    scalable, secure, supportable, and integrated solutions.
  - Direct solution delivery from requirements and design
    through development, integration, testing, deployment,
    hypercare, and transition to support.
  - Establish and enforce architecture, integration,
    engineering, security, testing, documentation, and
    release-management standards across internal and partner
    teams.
  - Coordinate application dependencies and data flows across
    SAP S/4HANA, OMS+, OMNI, myBLDR, AppWright, Salesforce,
    middleware, master data, and downstream systems.
  - Jointly prioritize and sequence enhancements, defects,
    technical debt, and change requests based on business
    value, customer impact, risk, urgency, dependencies, and
    available capacity.
  - Manage application backlogs, release plans, development
    capacity, resource allocation, delivery commitments, and
    cross-workstream dependencies.
  - Jointly confirm business and technology readiness, including
    testing completion, cutover planning, communications,
    training, support preparedness, and deployment approval.
  - Ensure delivered capabilities meet approved business
    objectives, process requirements, controls, customer
    expectations, and performance outcomes.
  - Own application stability, service performance,
    supportability, resilience, technical debt, incident
    management, problem resolution, and continuous
    improvement.
  - Lead the resolution and escalation of complex process,
    system, integration, data, vendor, and operational issues
    affecting business outcomes.
  - Balance modernization with effective use of existing
    platforms and integrations, clearly communicating
    technical trade-offs, risks, investment needs, and
    sequencing recommendations.
  - Coordinate delivery across BFS teams, system integrators,
    application management services providers, software
    vendors, and other technology partners.
  - Partner with business leaders to shape roadmaps, business
    cases, investment priorities, adoption plans, and long-
    term capability strategies.
  - Develop and maintain technical training content for new
    functionality and provide complete solution information to
    Business Enablement and Organizational Change Management
    teams for training delivery.
  - Define and monitor delivery, adoption, quality, stability,
    customer, operational, capacity, vendor, and financial
    measures; address gaps and drive measurable improvement.
  - Communicate portfolio performance, roadmaps, dependencies,
    risks, decisions, and investment recommendations to
    executive, business, and technical stakeholders.
  - Manage portfolio budgets, contracts, staffing, capacity,
    vendor performance, and resource allocation in alignment
    with organizational priorities.
  - Build a high-performing team through clear accountability,
    coaching, succession planning, skills development,
    recognition, and timely performance management.



  SUPERVISORY RESPONSIBILITIES



  This job has supervisory responsibilities, including but not
  limited to: supervises assigned team members (in-person and
  remote); talent selection and training; planning, assigning,
  and directing work; performance management, including
  conducting performance reviews; recognizing team members;
  addressing and resolve concerns timely, escalate for help
  when necessary.



  MINIMUM REQUIREMENTS

  To perform this job successfully, an individual must be able
  to perform each essential duty satisfactorily. The
  requirements listed below are representative of the
  knowledge, skill, and/or ability required.





  - Bachelor's degree in Computer Science, Information Systems,
    Engineering, Business, or a related field; or an
    equivalent combination of education and experience.
  - 10+ years of progressive experience in software engineering,
    application development, enterprise applications,
    integrations, or technology delivery.
  - Experience leading managers and professional teams
    accountable for multiple related applications or
    engineering capabilities.
  - Experience managing application strategy, roadmaps, budgets,
    capacity, delivery, operations, vendors, and service
    performance.
  - Experience delivering and supporting integrated order
    management, sales execution, CRM, digital commerce, ERP,
    or other business-critical enterprise solutions.
  - Experience with application and integration architecture,
    APIs, middleware, data flows, security, testing, release
    management, and production support.
  - Strong business acumen, financial management, stakeholder
    influence, communication, problem-solving, and talent-
    development skills.
  - Preferred Qualifications
  - Experience with SAP S/4HANA Sales and Distribution and
    integrations supporting customer, product, pricing, quote,
    order, invoice, and status data.
  - Experience with enterprise integration technologies such as
    MuleSoft, SAP Integration Suite, SAP BTP, APIs, event-
    driven integration, IDocs, REST, SOAP, or OData.
  - Experience leading enterprise transformation, platform
    modernization, deployment, cutover, hypercare, and
    adoption across distributed business locations.
  - Relevant leadership or technical certification in Agile,
    cloud, integration, SAP, Salesforce, IT service
    management, or software engineering is preferred.



  COMPETENCIES



  - Evaluates Problems: Evaluates and analyzes different types
    of information objectively to identify appropriate
    solutions; writes fluently, establishing the key facts
    clearly and interprets numerical data effectively.
  - Technical Communication/ Presentation: Communicates with
    clarity and precision, presenting complex information in a
    concise format that is audience appropriate.
  - Adjusting and Driving Change: Takes a positive approach to
    tackling work and embraces change; invites feedback
    relating to performance and deals constructively with
    criticism. Identifies the need for and drives change when
    required to achieve objectives.
  - Focuses on Customers: Understands and anticipates customer
    needs and takes action to provide high-quality products
    and services to exceed expectations.
  - Demonstrates Business Acumen: Demonstrates working knowledge
    of market, economic, legal, and regulatory environments
    and how they impact the business.
  - Agile Best Practices: Understands how agility is leveraged
    in IT ways of working. Adopts agile best practices as
    appropriate throughout the assigned work lifecycle.
    Responds to feedback quickly based on comments of internal
    and external customers and needs of the market.
  - Bias for Action: Takes initiative and identifies what needs
    to be done and acts without waiting to be asked. Executes
    work in a timely manner. Suggests improvements to current
    ways of working.
  - Provides Leadership: Makes decisions and takes
    responsibility; directs and leads others even in ambiguous
    circumstances, coordinating activities; provides
    encouragement and inspiration to help others succeed.
  - Builds Effective Teams: Builds high performing teams by
    integrating a diversity of skills and personalities and
    creating a deep sense of accountability and shared
    purpose.
  - Develops Talent: Focuses on developing, coaching, and
    mentoring talent to improve individual and organizational
    performance. Contributes to building talent that the
    industry, market, and BFS needs.
  - Manages Stakeholders: Builds relationships and takes account
    of the needs of multiple stakeholders to influence and
    drive decisions for beneficial business outcomes.
  - Drives Success: Takes action, initiates activity and seizes
    opportunities for new business; pursues goals with
    persistence and achieves outstanding results.





  BFS COMPETENCIES



  - Business and Financial Acumen
    - Demonstrates depth of understanding for the P&L and
      financial analysis
    - Teaches business and financial acumen to others.
    - Understands KPIs and how BFS makes money.
    - Knows the different business segments and how they relate to
      one another.
    - Understands customer sales and engagement.
    - Demonstrates functional and/or technical expertise.
    - Understands complex issues and demonstrates problem solving
      skills.
    - Understands how to maximize business results regardless of
      industry cycle.
  - Results Driven
    - Holds self and others accountable.
    - Communicates and sets clear goals with plans to deliver.
    - Manages competing priorities effectively.
    - Demonstrates appropriate urgency.
    - Drives to exceed expectations in alignment with our BFS
      SPICE values.
    - Embraces and follows best practices.
    - Demonstrates self-starter, can-do attitude.
  - Strategic Thinking and Decision Making
    - Leverages resources and teams around them to solve problems
      and create mutually beneficial outcomes.
    - Demonstrates willingness and courage to make tough decisions
      in a timely manner.
    - Balances short-and-long term priorities
    - Demonstrates proactive versus reactive thinking.
    - Asks questions to identify root cause and analyze situations
      more accurately.
  - Servant Leadership
    - Demonstrates humility by putting others first.
    - Builds trust-based relationships.
    - Leads by example with kindness and respect.
    - Collaborates well across all areas of the business.
    - Advocates for others
    - Actively listens to understand the meaning and intent of
      what the other person is communicating.
    - Demonstrates authenticity and encourages others to do the
      same.
  - Emotional Intelligence
    - Demonstrates situational awareness – knows when and how to
      adjust leadership style in different situations.
    - Demonstrates self-awareness – understands strengths and
      weaknesses.
    - Demonstrates empathy – puts themselves in other’s shoes.
    - Assumes positive intent.
  - Develops and Leads Others
    - Drives alignment through clear communication of vision,
      goals, and expectations.
    - Invests time on a regular basis in performance feedback and
      developmental conversations.
    - Fosters a respectful and inclusive environment.
    - Empowers, motivates, and inspires others.
    - Coaches and mentor others for their development.
    - Guides and persuades others to deliver positive outcomes.
  - Growth Mindset
    - Demonstrates a growth mindset; takes appropriate risks,
      fails fast and forward, learns from mistakes.
    - Perseveres and champions growth, even in the face of
      resistance, ambiguity, or possible failure.
    - Thinks like an owner with an entrepreneurial spirit.
    - Demonstrates and encourages intellectual curiosity.
    - Continuous learner; seeks opportunities and knowledge for
      personal and professional growth.
    - Sees possibilities over problems – actively seeks solutions.
  - Innovation
    - Encourages out-of-the box thinking to create new ways of
      doing things.
    - Continuously seeks to improve and simplify pain points in
      the business.
    - Anticipates, embraces, and leads change.
    - Develops and executes breakthrough strategies.
  - Integrity
    - Does the right thing even under challenging circumstances?
    - Communicates with honesty.
    - Consistently treats others fairly and equitably.
    - Demonstrates reliability and does what they say they will
      do.
    - Conducts tough conversations and delivers difficult messages
      with kindness and respect.



  WORK ENVIRONMENT / PHYSICAL ACTIVITY

  The physical demands described here are representative of
  those that must be met by an employee to successfully
  perform the essential functions of this job. Reasonable
  accommodations may be made to enable individuals with
  disabilities to perform the essential functions.



  - Subject to both typical office environment and outside
    locations with temperature and weather variations.
  - Must be able to lift and carry up to 25 pounds.
  - Occasional travel may be required.



  This position was posted on October 20, 2026 and we
  anticipate it will be open for a minimum of five days,
  though it may be open for a longer period. We encourage your
  prompt application.

  Successful, innovative, and fulfilling careers are built
  here, and your professional development is a high priority.
  We invest in your future through the latest training, tools,
  and technologies. Highly collaborative, we work together to
  solve problems and find better ways to continually grow our
  business and careers every day. You’ll be empowered to try
  new things, gain new experiences, and build a career with
  unlimited horizons. The scale and depth of resources that
  being the #1 building materials distributor in the nation
  provides a variety of opportunities for you to explore – all
  in a friendly, people-first environment. Join us to be more,
  do more, and build more, together at BFS.

  In addition to the base wage listed, this position is also
  eligible to earn an annual bonus subject to changes in plan
  design and documents and in accordance with applicable law.
  Eligibility and the amount of the bonus varies based on
  overall company success, thresholds met and other terms and
  conditions of the Company’s active bonus policy for the
  respective year.

  At Builders FirstSource, we offer competitive, affordable
