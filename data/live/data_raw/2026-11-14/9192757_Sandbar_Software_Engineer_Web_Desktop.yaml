description: |
  About Sandbar

  Sandbar is an interface company in New York City. We aim to
  expand human thinking. Our team has built software, ML,
  hardware, and consumer products across Meta, CTRL-labs,
  Apple, Peloton, and Equinox.

  Our first product is Stream, a private voice ring that
  extends your thinking. Stream has been featured in WSJ,
  Bloomberg, Wired, and Time's Best Inventions of the Year.

  Join us in creating technology that extends human thinking.

  About

  We’re looking for an experienced software product engineer
  to help build Stream, a new conversational interface. We
  aspire to make technology as easy as thinking—fast,
  intuitive, and always available. This role will extend
  Stream to new surfaces and use cases, and is perfect for
  someone who sits at the intersection of software
  engineering, interaction design, and consumer products.

  Responsibilities

  - Extend Stream into novel desktop, web, and other
    surfaces—owning the full stack from UI to backend
  - Design and build interaction patterns for novel input-output
    paradigms
  - Develop new features and integrations end-to-end, including
    backend services where needed
  - Collaborate with iOS, firmware, and backend engineers to
    maintain a seamless cross-platform experience
  - Work with product, design, and GTM to ship releases, gather
    insights, and iterate

  Qualifications

  - 5+ years building and shipping consumer-facing software
    products
  - Strong proficiency in modern web technologies (TypeScript,
    React or similar) and desktop frameworks (Swift, Electron)
  - Comfort working full stack—backend services, APIs, and
    frontend
  - Excellent attention to UI/UX details
  - Track record of building 0-to-1 products or features with
    ambiguity
  - Experience with real-time or interactive applications is a
    plus
  - Experience with audio/media APIs is a plus
  - Strong interdisciplinary communication
  - Strong ownership, comfort with ambiguity, and high technical
    output
  - Passion for human-computer interfaces

  FTE Benefits

  - Health, vision, and dental benefits
  - Company-sponsored 401(k)
  - Unlimited PTO and sick time
  - Early stage equity
