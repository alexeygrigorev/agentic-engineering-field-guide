description: |
  About the role

  We’re hiring a full stack software engineer to join our
  small, yet mighty team. We ship and maintain a ton of
  software. We do it with way less than the incumbents. That
  requires a builder culture, bias for action, and maniacal
  customer obsession.

  You’ll cover a lot of ground. Imagine building APIs that
  sync hundreds of thousands of products across multiple
  platforms in seconds one day, designing a model that
  pinpoints exactly when a store needs to reorder merchandise
  another day, and integrating our software with multiple
  hardware vendors the next. If that excites you, we invite
  you to apply.

  This role is in-person five days a week in our Williamsburg
  office.

  Key Responsibilities:

  - You’ll ship entire products end to end as well as building
    and maintaining features across mobile, web, and backend.
    No task too big or small.
  - Be your own product manager and deal with ambiguity,
    understand what we are building for customers, why, and
    build to that vision.
  - Talk to our users every chance you get. You’ll be frontline
    support and engage closely with customers on what they
    want and need
  - Have high standards, drive engineering excellence, introduce
    new ideas, and solve problems
  - Build a resilient, scalable foundation for growth. Design
    systems that last and document them well so others can
    build on your work.

  Our Stack:

  - Javascript (Typescript, React.js, React Native, Node.js,
    Next.js, Express)
  - Tailwind/Nativewind, Shadcn
  - MongoDB and PostgreSQL (Supabase)
  - AWS, GCP, Docker

  Nice-to-Have Experience:

  - Native development (Kotlin, Swift, C#), especially
    developing for Windows
  - LLM applications (using RAG, agent frameworks, etc.)
  - Machine Learning, specifically pytorch and open source
    models
  - DevOps (infrastructure as code, observability, monitoring,
    security)

  About Vendora

  Vendora is building a generational company in one of the
  largest industries out there - grocery. We build software to
  serve the $1 trillion dollar (over 3% of US GDP) grocery
  industry. This ranges from point of sale, payments,
  e-commerce, inventory management, loyalty, and advanced
  analytics with more on the horizon.

  We’re taking bleeding edge technology and an AI-focused
  approach to modernizing an industry stuck in legacy software
  and practices. Backed by Y Combinator and investors with
  deep expertise in retail, we are a team of operators from
  Amazon, Uber, Tesla, Figma and McKinsey transforming a
  sector that touches us all.

