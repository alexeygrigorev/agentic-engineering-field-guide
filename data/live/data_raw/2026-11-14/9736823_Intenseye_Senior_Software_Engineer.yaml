description: |
  At Intenseye, we believe protecting people at work is non-
  negotiable.

  That’s why we’re building the world’s most advanced AI-
  powered platform for industrial environments, designed to
  help organizations move from reactive programs to proactive
  risk prevention across safety, operations, and quality
  management. Our technology gives enterprises the ability to
  see risk and inefficiency as they emerge, take action in
  real time, and prevent incidents before they happen.

  Powered by cutting-edge AI and Intenseye’s proprietary
  Sentinel hardware, our platform delivers ethical, highly
  accurate intelligence across complex worksites. EHS,
  operations, and quality teams gain continuous leading
  indicators, deep operational insight, and unprecedented
  visibility into how work actually happens.

  Today, Intenseye helps protect hundreds of thousands of
  workers across 25+ countries—and we’re just getting started.

  The Role

  We’re looking for a Senior Software Engineer who can move
  fluidly across the stack—from performance-critical C++ and
  Python backend services to polished React/TypeScript
  frontends—and who brings the systems-level intuition to know
  when latency, throughput, and reliability are on the line.

  You’ll build the product features, data pipelines, and APIs
  that turn real-time computer vision output into life-saving
  alerts and insights for our customers. You care as much
  about the user experience as you do about the code powering
  it.

  This role is a strong fit for someone who is:

  - Commercially and product minded—you think about users,
    outcomes, and business value, not just technical
    correctness
  - A self-starter with a founder’s mentality: high ownership,
    high velocity, pragmatic judgment
  - Experienced shipping in fast-moving startup environments and
    comfortable with ambiguity
  - Equally at home in a backend pipeline and a React component,
    and proud of both
  - Motivated by mission—you want your work to have real-world
    impact

  What You’ll Do

  What We’re Looking For:

  Intenseye is proud to be an Equal Opportunity Employer. We
  are committed to building a diverse, inclusive, and
  equitable workplace where every team member feels valued and
  empowered. We recruit, hire, train, compensate, and promote
  without regard to race, color, age, sex, ancestry, marital
  status, religion, national origin, physical or mental
  disability, sexual orientation, gender identity or
  expression, medical condition, pregnancy, veteran status,
  genetic information, or any other characteristic protected
  by applicable law.

  We know that not everyone will meet 100% of the listed
  qualifications, and that’s OK. Research shows that
  individuals from underrepresented groups often hesitate to
  apply unless they meet every criterion. If you’re excited
  about our mission and believe you can have an impact in this
  role, we strongly encourage you to apply. Your experience,
  skills, and perspective may be exactly what we’re looking
  for.
