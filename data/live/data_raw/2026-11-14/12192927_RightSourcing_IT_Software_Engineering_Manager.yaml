  Engineering Manager – Banking (Rippling) Location: San
  Francisco, CA (Hybrid; 3+ days in office required) Work
  Authorization: Open to all qualified candidates
  Compensation: $180,000 – $315,000 per year (US Tier 1)
  Equity: Included Benefits: Comprehensive benefits package
  Security Clearance: Not required

  Job Description

  Rippling is seeking an Engineering Manager to lead the
  creation, launch, and scale of Rippling Banking—an entirely
  new, 0-to-1 product within our Spend platform. This is a
  hands-on technical leadership role where you will architect
  foundational systems, guide engineering standards, and
  actively contribute code while building and developing a
  high-performing team.

  Rippling unifies HR, IT, and Finance into a single operating
  system, allowing organizations to manage payroll, devices,
  expenses, benefits, and apps worldwide in minutes—not days.
  Backed by $1.4B+ from top-tier investors (Sequoia, Kleiner
  Perkins, Founders Fund, Greenoaks, Bedrock), Rippling is one
  of the fastest-growing SaaS companies in the U.S.

  As Engineering Manager for Banking, you will own core
  systems that will support transaction volume scaling from
  millions to billions each month. Your work will be integral
  to Rippling’s vision of becoming the operating system for
  employee spend.

  Primary Responsibilities

  - Build and launch a new banking product from initial concept
    to production.
  - Own the engineering roadmap, architecture decisions, and
    technical quality bar.
  - Write and ship production code while modeling engineering
    excellence.
  - Hire, mentor, and develop a high-performing engineering
    team.
  - Collaborate closely with Product, Design, and Finance
    Engineering leadership.
  - Lead cross-team initiatives that improve system reliability,
    scalability, and velocity.

  Basic Qualifications

  - 1+ years of engineering management experience (or
    demonstrated equivalent technical leadership).
  - 1+ years as a Staff-level or equivalent senior software
    engineer.
  - Proven experience building and launching products from
    scratch, not just maintaining existing systems.
  - Strong product intuition with a bias toward customer impact
    and speed.
  - Comfort mixing people leadership with hands-on engineering.

  Additional Information

  Rippling is an equal opportunity employer committed to
  diversity and inclusion across all teams

  Rippling maintains an in-office culture. Employees living
  within a designated radius of a Rippling office are expected
  to work onsite at least three days per week.

  Compensation: $180,000 – $315,000 per year (US Tier 1; final
  offer based on experience and location). Equity and
  comprehensive benefits included

