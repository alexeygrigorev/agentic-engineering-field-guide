description: |
  At Ripple, we’re building a world where value moves like
  information does today. It’s big, it’s bold, and we’re
  already doing it. Through our crypto solutions for financial
  institutions, businesses, governments and developers, we are
  improving the global financial system and creating greater
  economic fairness and opportunity for more people, in more
  places around the world. And we get to do the best work of
  our career and grow our skills surrounded by colleagues who
  have our backs.

  If you’re ready to see your impact and unlock incredible
  career growth opportunities, join us, and build real world
  value.

  Job Requisition Profile

  The mission, should you choose to accept it, is to pioneer
  and scale Ripple Treasury’s platform into the future. Do you
  want to work with a hardworking, fun loving, development
  team, whom will work together to feed the village? If you
  enjoy solving ambitious business problems in a fast-paced
  and collaborative environment this might be the role for
  you!

  At Ripple Treasury, you’ll be a part of makers, breakers,
  doers, and disruptors, who love to solve real problems and
  meet real customer needs. As an established FinTech leader
  in the SaaS treasury management space, our vision is to
  create the next-generation of technology tools for the
  global, corporate financial office.

  Our Liquidity team is seeking an innovative and forward-
  thinking Senior Software Developer passionate about building
  a world-class platform through a world-class team. Creating
  technical software excellence and spearheading application
  development in design, implementation, and maintenance to
  make magic happen.

  About the Liquidity Management Team

  The Liquidity Management team builds and maintains the core
  platform capabilities that give treasury professionals real-
  time transparency into their organization's cash and
  liquidity positions across banks, accounts, currencies, and
  legal entities worldwide. Our solutions help enterprise
  customers optimize how they fund operations, manage
  intercompany liquidity structures, and deploy idle cash. The
  team works at the intersection of complex financial
  workflows and modern software engineering, delivering
  scalable, reliable systems that process critical financial
  data for customers operating across 40+ countries.

  The Vision

  The Liquidity Management team is at the forefront of a major
  modernization initiative, reimagining how enterprise
  treasury teams manage liquidity across a global landscape.
  We're not just maintaining what exists — we're rebuilding
  from the ground up with a bold vision: a modern, intuitive
  user experience with fast, streamlined workflows that make
  sophisticated treasury operations feel effortless; a cloud-
  native architecture built on the latest technologies,
  designed for scalability, resilience, and speed; and first-
  class support for both traditional fiat currencies and
  digital assets, positioning Ripple Treasury at the
  groundbreaking of where treasury is headed.

  What You’ll Do:

  - Leverage Azure services to craft scalable, fault-tolerant,
    and highly resilient cloud-based solutions
  - Carry the banner of quality as a first class citizen by
    conducting rigorous unit, integration, and non-functional
    (performance, security) testing to guarantee our software
    is production-ready
  - Implement world class levels of Observability to derive deep
    application insights, performance and usage data, and
    solving problems before they become a problem
  - Share your enthusiasm for tech trends, explore and learn new
    technologies, engage with tech communities, mentor fellow
    engineers, and lead in technical design and code
    evaluations
  - Always seek ways to enhance team operations, processes,
    methodologies, and technology choices, striving for
    excellence in every practice
  - Participate in the team’s YBIYRI model (you-build-it-you-
    run-it), which includes participating in their on-call
    pager rotation

  Essential Knowledge / Experience:

  - Bachelor’s degree in Computer Science or equivalent
    experience, with at least 5 years of application
    development experience
  - Well versed in application development and modern practices
    for cloud architecture and deployment
  - Proven ability to influence and mentor developers within an
    agile team environment
  - Skilled at operating within an agile development environment
  - Experience with Azure Services
  - Deep knowledge and expertise in .NET and C#
  - Advanced knowledge of Microsoft SQL Server
  - Skilled in designing and implementing CI/CD pipelines within
    Azure DevOps

  Preferred Knowledge / Experience:

  - Experience in the financial industry, particularly with
    exposure to treasury systems, payments, FX, ERP, or
    financial platforms
  - Understanding of high-volume transactional processing
    architectures

  Abilities Required:

  - Excel in both verbal and written communication, and
    effectively collaborate with teammates and partners, both
    technical and non-technical
  - Exhibit a detailed commitment to quality and an
    understanding of customer needs, ensuring that every
    solution meets the highest standards
  - Be a self-starter who can prioritize tasks and accomplish
    assignments independently, driving projects forward
  - Demonstrate a quick learning capacity, staying up to date
    with standard methodologies and technologies in relevant
    areas, and applying this knowledge proactively
  - Apply your analysis and trouble shooting skills to identify
    and resolve issues efficiently, ensuring smooth and
    reliable software performance
  - Bring deep software engineering experience in distributed
    systems, ensuring robust and scalable solutions

  What You Will Get:

  - A high impact, high visibility role at a growing SaaS
    company that values personal growth, accountability, and
    the concept of “good work”
  - This is a great opportunity for someone who wants to make a
    big impact, work in a fast-paced and collaborative
    environment, and win as a team to scale a growing business
  - A culture of open collaboration and problem solving
  - An empowered role on the Engineering team, responsible for
    driving accurate financial result visibility
  - Great benefits, culture, and the ability to work remotely.

  WHO WE ARE:

  Do Your Best Work

  - The opportunity to build in a fast-paced start-up
    environment with experienced industry leaders
  - A learning environment where you can dive deep into the
    latest technologies and make an impact.  A professional
    development budget to support other modes of learning.
  - Thrive in an environment where no matter what race,
    ethnicity, gender, origin, or culture they identify with,
    every employee is a respected, valued, and empowered part
    of the team.
  - In-office collaboration for moments that matter is important
    to our culture, and we give managers and teams the
    flexibility to decide which 10+ days a month they come in.
  - Bi-weekly all-company meeting - business updates and ask me
    anything style discussion with our Leadership Team
  - We come together for moments that matter which include team
    offsites, team bonding activities, happy hours and more!

  Take Control of Your Finances

  - Competitive salary, bonuses, and equity
  - Competitive benefits that cover physical and mental
    healthcare, retirement, family forming, and family support
  - Employee giving match
  - Mobile phone stipend

  Take Care of Yourself

  - R&R days so you can rest and recharge
  - Generous wellness reimbursement and weekly onsite & virtual
    programming
  - Generous vacation policy - work with your manager to take
    time off when you need it
  - Industry-leading parental leave policies. Family planning
    benefits.
  - Catered lunches, fully-stocked kitchens with premium
    snacks/beverages, and plenty of fun events

  Benefits listed above are for full-time employees.

