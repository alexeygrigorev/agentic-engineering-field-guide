description: |
  This role offers an opportunity to work on innovative
  projects and drive the development of cutting-edge
  platforms. As a Software Engineer in Platform Services, you
  will be part of a dynamic team responsible for designing and
  developing scalable and robust software solutions. Your
  expertise will contribute to the creation of efficient and
  reliable platforms, ensuring optimal performance and user
  experience. This role provides an exciting opportunity to
  collaborate with a diverse range of teams and stakeholders,
  allowing you to make a significant impact on the company's
  technology landscape.


  Responsibilities

  - Collaborate with cross-functional teams to understand
    platform requirements and design efficient solutions.
  - Develop high-quality software components, ensuring code
    quality and maintainability.
  - Implement and integrate platform features, following best
    practices and industry standards.
  - Conduct thorough testing and debugging to ensure the
    stability and reliability of the platform.
  - Work closely with the architecture team to align with
    overall platform architecture and design principles.
  - Document and maintain technical specifications and provide
    support for platform-related queries.
  - Stay updated with emerging technologies and industry trends,
    proposing innovative solutions.
  - Participate in code reviews and provide constructive
    feedback to enhance team collaboration.
  - Assist in performance optimization and scalability efforts
    to meet growing demands.

  Qualifications

  - Bachelor's degree in Computer Science, Engineering, or a
    related field.
  - 5+ years of experience in software development, with a focus
    on platform engineering.
  - Proficiency in programming languages such as Go is a must;
    with a strong understanding of software design principles.
    Scripting experience in Python or Bash
  - Experience in cloud native technologies and Kubernetes is a
    must.
  - Experience with version control systems and continuous
    integration/continuous deployment (CI/CD) practices.
  - Experience with cloud computing platforms (e.g., AWS, Azure)
    and containerization technologies is a must.
  - Understanding of cloud networking, including L4/L7 load
    balancers.
  - Strong problem-solving and analytical skills, with the
    ability to troubleshoot and resolve complex issues.
  - Excellent communication and collaboration skills, with a
    team-oriented mindset.
  - Ability to work independently and manage multiple tasks in a
    fast-paced environment.
  - Passion for technology and a desire to stay updated with the
    latest industry advancements.

