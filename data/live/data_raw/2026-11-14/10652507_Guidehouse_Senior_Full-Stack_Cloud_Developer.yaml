description: |
  Job Family:

  Software Development & Support

  Travel Required:

  Up to 10%

  Clearance Required:

  Ability to Obtain Public Trust

  What You Will Do:

  - Design, develop, and test full‑stack components, including
    enterprise web service APIs, backend services, and user
    interfaces that consume REST APIs.
  - Collaborate with product management to translate
    requirements into technical designs and provide accurate
    estimates.
  - This role involves building internal and external interfaces
    using Microservices and automation patterns as part of a
    complete system modernization.
  - Define, implement, and maintain automated unit and
    integration tests.
  - Develop high‑quality, production‑ready code in short,
    iterative increments.
  - Work closely with engineering, QA and Systems teams to
    improve and manage the development pipeline.
  - The ideal candidate will contribute across the full stack
    design, development, and testing leveraging a cloud
    technology platform (GCP or similar) and industry‑standard
    tools, frameworks, and design patterns. In addition, the
    senior‑level role includes mentoring responsibilities,
    architectural influence, and technical leadership across
    teams.
  - Champion best practices development and cloud automation to
    continuously enhance development efficiency and
    reliability.
  - Leads cross‑functional modernization initiatives, ensuring
    alignment across multiple teams and driving cohesive
    technical execution on complex enterprise‑wide programs.
  - Provide technical leadership across feature teams, guiding
    architectural decisions and ensuring alignment with
    cloud‑native standards and microservices best practices.
  - Mentor junior and mid‑level engineers through code reviews,
    pair programming, and structured knowledge‑sharing.
  - Participate in solution architecture discussions,
    contributing to long‑term modernization strategy and
    technology selection.
  - Act as a senior technical point‑of‑contact for
    cross‑functional stakeholders, helping bridge product,
    engineering, and platform teams.
  - Subject matter expert. Demonstrates strategic thinking by
    anticipating future technical challenges and proactively
    proposing forward‑looking solutions that strengthen
    organizational readiness.
  - Identify system bottlenecks, architectural gaps, and
    improvement opportunities across distributed systems.

  What You Will Need:

  - US Citizenship with the ability to obtain and maintain a
    federal Public Trust clearance.
  - Bachelor's Degree or additional Four(4) years of exp in lieu
    of degree.
  - Minimum of 6 years of software engineering experience.
  - Expertise in enterprise software design, implementation, and
    deployment .
  - Proficiency with JavaScript and modern frontend frameworks
    such as Angular or React .
  - Strong programming experience in Java, including Spring Boot
    or similar frameworks .
  - Experience working in a Scrum‑based development environment
    .
  - Hands‑on experience with tools such as JIRA, Bamboo or
    Jenkins, Bitbucket (Git), and Confluence
  - Proficiency with JSON, YAML, and XML .
  - Experience developing distributed, modular system
    architectures (Microservices, SOA) .
  - Strong understanding of modern cloud networking concepts and
    enterprise security best practices, including GCP‑native
    security controls and SAST/DAST methodologies, or similar
    cloud environments .
  - Experience with Docker, Kubernetes, and OpenShift.
  - Cloud development experience .
  - Familiarity with web accessibility standards .
  - Experience using Postman or similar tools to test web
    services.
  - Experience with application servers or containers such as
    JBoss or Tomcat .
  - Extensive experience with continuous integration and
    deployment tools .
  - Experience working with relational and NoSQL data stores .
  - Must be US Citizen.
  - Must be able to OBTAIN and MAINTAIN a Federal or DoD "PUBLIC
    TRUST"; candidates must obtain approved adjudication of
    their PUBLIC TRUST prior to onboarding with Guidehouse.
    Candidates with an ACTIVE PUBLIC TRUST or SUITABILITY are
    preferred.

  What Would Be Nice To Have:

  - Ability to manage multiple tasks with varying priorities .
  - Strong communication skills across diverse formats .
  - Facilitates discussions with stakeholders to ensure
    alignment on approaches .
  - Adherence to Agile development methodologies .
  - Experience leading multiple projects or processes, with
    minimal guidance .
  - Experience with IDEs such as Eclipse, IntelliJ, or VS Code.
  - GCP certification or familiarity with Google Cloud Platform
    .
  - Experience with cloud‑based AI/ML services (GCP Vertex AI,
    Gemini Code Assist, AWS SageMaker, or Azure ML) and MLOps
    practices (CI/CD for ML, model monitoring) .
  - Proficiency in Python for developing, training, and
    deploying machine learning models .

  The annual salary range for this position is
  $102,000.00-$170,000.00. Compensation decisions depend on a
  wide range of factors, including but not limited to skill
  sets, experience and training, security clearances,
  licensure and certifications, and other business and
  organizational needs.

  What We Offer:

  Guidehouse offers a comprehensive, total rewards package
  that includes competitive compensation and a flexible
  benefits package that reflects our commitment to creating a
  diverse and supportive workplace.

  Benefits include:

  - Medical, Rx, Dental & Vision Insurance
  - Personal and Family Sick Time & Company Paid Holidays
  - Parental Leave
  - 401(k) Retirement Plan
  - Group Term Life and Travel Assistance
  - Voluntary Life and AD&D Insurance
  - Health Savings Account, Health Care & Dependent Care
    Flexible Spending Accounts
  - Transit and Parking Commuter Benefits
  - Short-Term & Long-Term Disability
  - Tuition Reimbursement, Personal Development, Certifications
    & Learning Opportunities
  - Employee Referral Program
  - Corporate Sponsored Events & Community Outreach
  - Care.com annual membership
  - Employee Assistance Program
  - Supplemental Benefits via Corestream (Critical Care,
    Hospital Indemnity, Accident Insurance, Legal Assistance
    and ID theft protection, etc.)
  - Position may be eligible for a discretionary variable
    incentive bonus

