description: |
  About the company

  Our client is a fast-growing technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build internal automation and agent-based systems that take
  over entire jobs from start to finish, embedding with
  business teams to improve how they work. This is a high-
  ownership engineering role that combines full stack
  development with product thinking and close collaboration
  with internal stakeholders.

  What you'll do

  - Design and build agent-powered systems that handle complete
    workflows with little or no human involvement.

  - Embed with internal teams to understand their processes and
    build intelligence directly into their daily work.

  - Develop new infrastructure, interfaces and tooling that let
    people and AI agents work together effectively.

  - Gather feedback from internal teams and clients, and iterate
    quickly on what you ship.

  - Take full ownership of projects, being accountable for
    whether they ship and whether they work.

  - Break down open-ended, novel problems and design solutions
    that compound over time.

  - Use coding agents and modern LLM tooling in your daily
    engineering work.

  Requirements

  What we're looking for

  - Hands-on experience building AI agents, with informed
    opinions on which models suit which use cases.

  - A history of owning significant projects in a small, quickly
    moving technology company, whether as a founder or as an
    early engineer.

  - Stable tenure of at least 2 years at each employer, with
    clear career progression.

  - Expertise in at least one full stack language, paired with a
    strong product mindset.

  - Experience working with agent SDKs and LLM tools beyond
    basic chatbots.

  - Product management skills, including working directly with
    clients and internal teams.

  - High tolerance for ambiguity and the autonomy to solve open-
    ended problems independently.

  - Willingness to work in person five days a week.

  Bonus points

  - Interest in becoming a founder in the future.

  - Undergraduate degree from a highly ranked global university.

  Benefits

  Compensation and benefits

  - Base salary: USD 150,000 to 300,000 per year

  - Equity

  - Health, dental and vision coverage

  - Life insurance

  - Flexible time off

  - Retirement plan

  - Parental leave

  - Commuter benefits

  Location and work model

  - New York, NY, United States

  - On-site, 5 days per week in office

  - Full-time
