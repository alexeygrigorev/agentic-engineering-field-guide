description: |
  Location: Remote (Central European Time zone ±2) Seniority:
  Mid-level Compensation: $45-55k depending on experience (27
  days holidays) Help unlock the world’s engineering potential
  by shaping the future of technical hiring! Check out our
  website: Codility.com You will join Codility’s Hire team
  that builds the tools and workflows behind how companies
  screen engineers, run technical interviews and manage
  hiring. You'll work on a complex, evolving platform that
  combines real-time coding environments, technical
  assessments, AI-powered capabilities and systems that
  protect assessment integrity, tackling challenging
  engineering problems across a modern tech stack. What you’ll
  do

  - Build product features end to end, with a strong focus on
    Python backend development (Django/FastAPI), while
    contributing to React and other parts of the stack where
    needed.
  - Work closely with Product, Design and engineers to turn
    problems into simple, effective solutions.
  - Make pragmatic technical decisions and build scalable,
    resilient and observable systems.
  - Contribute to cloud and infrastructure work where needed,
    with AWS being the main environment.
  - Use AI and LLM tools pragmatically where they add real
    value.

  How we work

  - Fully Remote, with a distributed engineering team.
  - One-team mindset: no silos and no “not my problem”. We win
    together.
  - Ownership & initiative: we expect everyone to move projects
    forward, not just execute tickets.
  - Balance: deliver impact without overengineering; know when
    “good” is good enough.

  What we’re looking for

  - Strong professional experience building production software
    with Python
  - Experience building and evolving a software product within a
    remote, distributed engineering team.
  - Comfortable working across the stack, including contributing
    to Frontend and Infrastructure when needed.
  - Strong English communication skills, both written and
    spoken.

  Interview Process

  We'll review your application against the key requirements
  of the role. If your profile is a good match, our
  recruitment team will reach out for a brief conversation and
  invite you to the interview process below:

  - Technical Assessment: A short Codility challenge to evaluate
    your coding skills and engineering fundamentals.
  - Hiring Manager Interview: Meet your future team leader to
    explore your motivation, working style and fit with the
    team.
  - Technical interview: Meet your colleagues for a pair-
    programming session to explore your technical skills and
    problem-solving approach.
  - Product Interview: Meet the Product team to discuss product
    thinking, collaboration and how you approach customer
    problems.

  We aim to keep the process straightforward, move quickly and
  keep you informed at every stage. You'll always hear back
  from us, regardless of the outcome. Looking forward to
  hearing from you!
