description: |
  Who We Are

  Imprint helps the world's best brands grow the lifetime
  value of their customers. We started with co-branded credit
  cards and rebuilt them to be smarter, more rewarding, and
  brand-first. We partner with companies like Crate & Barrel,
  Rakuten, Booking.com, H-E-B, Fetch, and Shell to launch
  modern credit programs that deepen loyalty, unlock savings,
  and drive growth. But the card is just the beginning. We
  combine advanced payments infrastructure, intelligent
  underwriting, and deep customer data to create delightful
  and personalized experiences for members as well as
  efficient and profitable relationships for our brand
  partners. Our robust technology and world-class operations
  allow us and our brand partners to offer powerful financial
  products without becoming a bank.  In the U.S., co-branded
  cards alone account for over $300 billion in annual spend,
  and most still run on decades-old legacy bank systems.
  Imprint is the modern alternative: flexible, embeddable, and
  built for how people actually pay today. Backed by Kleiner
  Perkins, Thrive Capital, Ribbit, and Khosla Ventures, we're
  building a world-class team to redefine how people pay and
  how brands grow. If you want to move fast, solve hard
  problems, and own real outcomes, we want to meet you.

  Engineering leadership is the lever for this next stage. As
  Imprint expands into new financial products, launches new
  brand partnerships, and scales the infrastructure underneath
  all of it, the quality of our engineering teams determines
  the quality of everything we ship. AI has made execution
  faster; the differentiator is the judgment to decide what to
  build, how to sequence it, and when to say no. That
  judgment, applied to how teams are built, how they make
  decisions, and how they're managed, is what Senior
  Engineering Managers own.

  The Opportunity

  - Bring structure to complex, ambiguous domains: Imprint's
    products sit at the intersection of payments, credit,
    compliance, and brand strategy. You'll lead a team through
    problems that aren't fully scoped, where the right answer
    requires synthesizing technical constraints with product,
    legal, and financial realities.
  - Operate as a true cross-functional partner: Not just "align
    with product." You'll work directly with product,
    compliance, legal, capital markets, and solutions
    engineering on decisions where the lanes overlap
    significantly. You will help represent Engineering in the
    room when strategy is set.
  - Lead with technical credibility, amplified by AI: AI has
    collapsed the distance between management and IC work.
    Managers at Imprint use AI tools to investigate codebases,
    assess the complexity and viability of work, and bring
    clarity to ambiguous asks. You don't need to be on the
    critical path writing code (though some managers are), but
    you need real technical judgment and the modern tools to
    exercise it.
  - Build and develop a team as a craft: You have a real
    philosophy on how to hire, develop, and retain strong
    engineers. You have opinions on how work is scoped and
    delivered, how to balance short and long-term priorities,
    and how to give feedback that actually changes outcomes.
    Clear communication, written and verbal, is key.
  - Operate in the details: This is not a role where technical
    context and project management are abstracted to other
    roles or organizational layers. You define the roadmap,
    scope the work, and manage individuals to outcomes. Even
    if you've led multiple teams before, the question is: can
    you take a new team and run it end-to-end?
  - Own outcomes at a company in a defining growth moment:
    Imprint is growing rapidly, launching new products, and
    deepening our platform. You'll have the scope and autonomy
    to shape how your team builds, and your work will be
    visible in the trajectory of the business.

  Your Profile

  - 5+ years of engineering management experience, with a track
    record of building, developing, and retaining strong
    engineering teams
  - You've managed through periods of rapid growth, ambiguity,
    or significant technical change, and your teams came out
    stronger
  - A strong technical foundation: you were a strong engineer
    before moving into management, and you've maintained
    technical credibility through hands-on engagement or
    modern AI tools
  - You've managed Staff-level ICs and helped senior engineers
    grow into bigger roles
  - Experience in domains with real complexity: financial
    systems, distributed infrastructure, regulated
    environments, or similarly demanding technical areas
  - You communicate with clarity and directness in writing, in
    1:1s, in rooms with executives, and in rooms with
    engineers
  - You drive delivery through your team, not around them. You
    know how to scope work, set priorities, and create the
    conditions for engineers to do their best work
  - Experience using AI tools to stay close to technical work
    (investigating codebases, assessing feasibility, bringing
    clarity to asks), or genuine enthusiasm to adopt them

  Some of our teams are full-stack (frontend, backend, and
  mobile); others are backend-focused. We're looking for
  strong engineering leaders regardless of your specific
  technical background.

  We don't expect every candidate to match every bullet. If
  you're excited about what we're building and confident you
  can contribute, we'd love to talk.

  Stack

  Our backend runs on Go, MySQL, DynamoDB, Temporal, Kafka,
  Kubernetes, and AWS.

  Read more about how we build at Imprint on our engineering
  blog.

  Perks & Benefits

  - Competitive compensation and equity packages
  - Leading configured work computers of your choice
  - Flexible paid time off
  - Fully covered, high-quality healthcare, including fully
    covered dependent coverage
  - Additional health coverage includes access to One Medical
    and the option to enroll in an FSA
  - 20 weeks of paid parental leave for the primary caregiver
    and 8 weeks for all new parents
  - Access to industry-leading technology across all of our
    business units, stemming from our philosophy that we
    should invest in resources for our team that foster
    innovation, optimization, and productivity

  Imprint is committed to a diverse and inclusive workplace.
  Imprint is an equal opportunity employer and does not
  discriminate on the basis of race, national origin, gender,
  gender identity, sexual orientation, protected veteran
  status, disability, age, or other legally protected status.
  Imprint welcomes talented individuals from all backgrounds
  who want to build the future of payments and rewards. If you
  are passionate about FinTech and eager to grow, let’s move
  the world forward, together.
