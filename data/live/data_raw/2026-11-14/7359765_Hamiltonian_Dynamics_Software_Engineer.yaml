description: |
  Hamiltonian Dynamics is a growing technology company working
  across Defence and Cyber Security, delivering software
  solutions that support critical national and enterprise
  systems. With teams based in Gloucestershire, Manchester,
  and London, we are entering an exciting new phase of
  expansion and are looking for Software Engineers to join us.

  This role offers the opportunity to work on meaningful,
  technically challenging projects while continuing to grow
  your skills in a supportive, flexible environment.

  Requirements

  As a Software Engineer at Hamiltonian Dynamics, you will
  design, build, and maintain secure, scalable software used
  by high-assurance customers. You’ll work across the full
  software development lifecycle, collaborating closely with
  engineers, architects, and stakeholders to deliver robust
  solutions.

  We’re open to engineers with different backgrounds and
  levels of experience - what matters most is strong
  engineering fundamentals, curiosity, and a willingness to
  learn.

  What You'll Do

  - Design, develop, test, and maintain high-quality software
    systems
  - Contribute to architectural decisions and technical
    direction
  - Collaborate within agile teams to deliver secure and
    reliable solutions
  - Work with modern cloud and containerised environments
  - Share knowledge, review code, and support continuous
    improvement

  Skills & Experience

  You will have experience in one or more of the following
  areas but you do not need experience in everything listed:

  - Java, Python, JavaScript, TypeScript
  - Angular, React, Vue
  - Docker, Kubernetes
  - AWS and/or Azure
  - MERN stack
  - Elasticsearch, Neo4J

  We value engineers who are open-minded, adaptable, and keen
  to learn new technologies as project needs evolve.

  Security & Location

  - You must be a UK citizen and have lived in the UK for the
    past 10 years
  - You must already hold high-level UK security clearance
  - Customer sites are based in Gloucestershire, Manchester, and
    London, so you must be willing to travel to one of these
    locations

  Benefits

  - Salary band: £40,000-85,000, depending on experience (we may
    consider more junior or more senior outside this range for
    the right candidate)
  - 10% clearance bonus

  - 25 days annual leave plus bank holidays
  - Buy or sell up to 5 days leave per year
  - 8% employer pension contribution
  - BUPA health cover
  - Life cover of 4× salary
  - EV car scheme via salary sacrifice
  - EMI share scheme
  - Flexible working and flexi-time
  - 10 days per year training allowance

  Every employee has an individual training and career
  development plan. We recognise that everyone learns
  differently and we actively support long-term growth.

  Our Process

  We keep things straightforward and human:

  - A 30-minute introductory chat with our recruiter, Sarah
  - A 1-hour Microsoft Teams interview or on-site interview with
    two members of the team
  - An informal conversation with two of our Founders

  We believe open, organic conversations are the best way for
  both sides to decide if the role is the right fit.
