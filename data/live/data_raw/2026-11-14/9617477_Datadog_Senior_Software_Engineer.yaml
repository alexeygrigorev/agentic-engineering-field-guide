description: |
  About Datadog:

  We're on a mission to build the best platform in the world
  for engineers to understand and scale their systems,
  applications, and teams.  We operate at high scale—trillions
  of data points per day—providing always-on alerting, metrics
  visualization, logs, and application tracing for tens of
  thousands of companies. Our engineering culture values
  pragmatism, honesty, and simplicity to solve hard problems
  the right way.

  You will:

  - Solve a scaling bottleneck in a critical service
  - Deploy a new feature to production, progressively rolling it
    out with feature flags
  - Investigate and fix a production issue from a service your
    team owns
  - Design a way to scale up a service for more traffic
  - With your team, plan the most important projects to work on
    next

  Who You Are:

  - You have significant experience in one or more languages
  - You value code simplicity and performance
  - You can design architecture to solve problems at high scale
  - You have a BS/MS/PhD in a scientific field or equivalent
    experience
  - You want to work in a fast, high-growth startup environment
    that respects its engineers and customers
  - You have demonstrated ability to use AI coding tools in day-
    to-day workflows and build, validate, and refine AI-
    generated output in products
  - You can design AI Backend systems, with awareness of
    quality, cost, and latency tradeoffs
  - 6+ years of experience

  Bonus points:

  - You've worked at high scale with systems like Redis,
    Cassandra, Kafka
  - You wrote your own data pipelines once or twice before
  - You have a strong background in statistics
  - You have significant experience with Go, C, or Python
  - You’re excited about leveraging AI tools to enhance how you
    code, solve problems, and build – or eager to learn how
  - You’re motivated to push the boundaries of how AI can
    improve software engineering best practices and contribute
    to building AI-enabled products

  Datadog values people from all walks of life. We understand
  not everyone will meet all the above qualifications on day
  one. That's okay. If you’re passionate about technology and
  want to grow your skills, we encourage you to apply.

  This job is available in various departments within our
  company; to conform to US export control regulations, some
  of these roles may require candidates to be eligible for any
  required authorizations from the US government.

  Benefits and Growth:

  - Product training to develop an in-depth understanding of our
    product and space
  - Continuous career development and pathing opportunities for
    internal mobility
  - Intra-departmental mentor and buddy program for in-house
    networking
  - An inclusive company culture, ability to join our Community
    Guilds
  - New hire stock equity (RSUs) and employee stock purchase
    plan
  - Free global mental health benefit through Spring Health
  - Generous global benefits

  Benefits and Growth listed above may vary based on the
  country of your employment and the nature of your employment
  with Datadog.

  #LI-MF3

  #LI-Hybrid

  Datadog offers a competitive salary and equity package, and
  may include variable compensation. Actual compensation is
  based on factors such as the candidate's skills,
  qualifications, and experience. In addition, Datadog offers
  a wide range of best in class, comprehensive and inclusive
  employee benefits for this role including healthcare,
  dental, parental planning, and mental health benefits, a
  401(k) plan and match, paid time off, fitness
  reimbursements, and a discounted employee stock purchase
  plan.

  The reasonably estimated yearly salary for this role at
  Datadog is:

  $192,000—$240,000 USD

  About Datadog:

  Datadog is the leading observability and security platform
  for the AI era, providing businesses with unified visibility
  across the technology stack to manage complexity at scale.
  It brings applications, infrastructure, data, models, and
  security into one place, using AI to detect and resolve
  issues before they impact customers. Trusted globally by
  Fortune 500 companies and high-growth AI leaders, Datadog
  enables businesses to move faster with clarity and
  confidence. Learn more about #DatadogLife on Instagram,
  LinkedIn, and Datadog Learning Center.

