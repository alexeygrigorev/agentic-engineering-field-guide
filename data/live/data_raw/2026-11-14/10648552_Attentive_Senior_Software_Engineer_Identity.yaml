  About the Role

  The Identity team owns Attentive's first-party data
  collection platform: the systems that capture ecommerce and
  user behavior events from customer storefronts, which form
  the core data that Attentive's marketing tools are built on.
  The surface area spans a JavaScript tag embedded on
  thousands of sites serving millions of consumers daily,
  Cloudflare Workers handling server-side tracking and edge
  compute, and backend ingestion services. The team is also
  heavily leaning into AI to improve the quality and volume of
  data collected on customer sites, with the goal of evergreen
  first-party data collection that can automatically measure
  its own performance, identify improvements, and ship them.

  This is a small team (3-4 engineers) with high autonomy and
  broad ownership. You'll work across the full stack as an AI-
  first generalist who moves between browser-side code, edge
  runtimes, and backend services depending on what the problem
  demands.

  This hybrid role is based in our New York office, with in-
  office collaboration Tuesday through Thursday each week.

  What You’ll Accomplish

  - Own data collection across the full stack. Work across the
    JS tag, Cloudflare Workers, and Java backend services to
    deliver reliable first-party data collection at scale.
  - Expand what we do at the edge with Cloudflare Workers.
    Extend our Workers infrastructure beyond server-side
    tracking and proxy endpoints into tag serving, A/B
    configuration, and compute for agentic systems and data
    analysis.
  - Build agentic AI systems for data collection quality. Use
    heuristics and models from the ML team to identify poor
    data collection for specific customers. Build workflows
    that automatically diagnose and fix gaps, reducing the
    manual work that eats up engineering time today.
  - Improve the event ingestion pipeline. Strengthen the backend
    services that receive, validate, and route events from the
    tag. Make the pipeline more reliable and observable so
    engineers can trace data from collection through ingestion
    without guesswork.
  - Help lead technical direction on a small, autonomous team.
    Write proposals, run design reviews, and mentor teammates.
    With a team this size, your judgment directly shapes what
    gets built and how.

  Your Expertise

  - 6+ years of professional software engineering experience,
    with a track record of working across multiple layers of a
    system, not just frontend or backend alone.
  - Backend experience building and operating services in Java,
    Kotlin, or a similar typed language, including API design,
    data modeling, and testing.
  - Comfortable with JavaScript/TypeScript beyond casual use.
    You can reason about browser runtime behavior, async
    patterns, and performance in production.
  - Experience with edge compute or serverless runtimes
    (Cloudflare Workers, Lambda@Edge, Fastly), or the ability
    to ramp quickly.
  - You've led projects from scoping through shipping, not just
    contributed to them.
  - Good debugging instincts across service boundaries. You
    design systems so issues surface clearly rather than
    hiding.
  - Active use of AI-assisted development tools (Claude Code,
    Cursor, Codex, or similar) in your day-to-day workflow.
    You've used them to build and ship production features,
    not just experiment.
  - Willingness to work across unfamiliar parts of the stack.

  What We Use

  - Our backend is Java / Kotlin / Spring Boot microservices,
    built with Gradle, coupled with things like DynamoDB,
    Aurora, AirFlow, Postgres, and Redis, hosted via AWS
  - Our infrastructure runs primarily in Kubernetes hosted in
    AWS’s EKS, using tooling like Istio, Datadog, Terraform,
    CloudFlare, and Helm
  - Our frontend is built with React and TypeScript, and uses
    best practices like GraphQL, Storybook, Radix UI, Vite,
    esbuild, and Playwright
  - Our automation is driven by custom and open source machine
    learning models, industry-leading LLMs, lots of data and
    tech like Python, Metaflow, HuggingFace, PyTorch,
    TensorFlow, and Pandas

  You'll get competitive perks and benefits, from health &
