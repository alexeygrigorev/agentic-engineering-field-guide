description: |
  Overview

  Amyx is looking to hire a Software Systems Engineer. The
  software systems engineer will formulate and define
  specifications for complex operating software programming
  applications or modifies/maintains complex existing
  applications using engineering releases and utilities from
  the manufacturer.

  Responsibilities

  - Formulates/defines specifications for complex operating
    software programming applications or modifies/maintains
    complex existing applications using engineering releases
    and utilities from the manufacturer.
  - Provides top-level technical expertise, including performing
    in-depth and complex software systems programming and
    analysis.
  - Designs architectures to include the software, hardware, and
    communications to support the total requirements as well
    as provide for present and future cross-functional
    requirements and interfaces.
  - Ensures these systems are compatible and in compliance with
    the standards for open systems and DoD architectures.
    Identifies, assesses, and presents options for meeting the
    functional and technical requirements including hardware
    and software updates or upgrades.
  - Formulates and defines specifications for operating system
    applications or modifies and maintains existing
    applications using engineering releases and utilities from
    the manufacturer.
  - Interacts with project management to plan project schedules
    and technical direction.
  - Responsible for developing high level system design diagrams
    and for program design, coding, testing, debugging and
    documentation.
  - Instructs, directs, and checks the work of other task
    personnel.
  - Responsible for quality assurance review and the evaluation
    of existing and new software products.
  - Provides overall operating system maintenance, such as
    sophisticated file maintenance routines, large
    telecommunications networks, computer accounting, and
    advanced mathematical/scientific software packages.
  - Assists all phases of software systems programming
    applications.
  - Evaluates new and existing software products.
  - Must have the ability to communicate accurate information

  Qualifications

  Required:

  - Ten (10) years of experience of experience with systems
    engineering and software development
  - Experience with MicroStrategy or Business Intelligence
    platforms, analytics, data modeling, and dashboard design.
  - Experience implementing modern security solutions (e.g.,
    Blockchain or related cryptographic research)
  - Relevant certification from a nationally recognized
    technical authority.
  - Must possess IT-II Non-Critical Sensitive security clearance
    or Tier 3 (T3) at time of proposal submission

  Salary: 100-160k

  Benefits include:

  - Medical, Dental, and Vision Plans (PPO & HSA options
    available)
  - Flexible Spending Accounts (Health Care & Dependent Care
    FSA)
  - Health Savings Account (HSA)
  - 401(k) with matching contributions
  - Roth
  - Qualified Transportation Expense with matching contributions
  - Short Term Disability
  - Long Term Disability
  - Life and Accidental Death & Dismemberment
  - Basic & Voluntary Life Insurance
  - Wellness Program
  - PTO
  - 11 Holidays
  - Professional Development Reimbursement

  Please contact talent@amyx.com with any questions!

  Amyx is proud to be an Equal Opportunity Employer.  All
  qualified candidates will be considered without regard to
  race, color, religion, national origin, age, disability,
  sexual orientation, gender identity, status as a protected
  veteran, or any other characteristic protected by law. Amyx
  is a VEVRAA federal contractor and we request priority
  referral of veterans.

  Physical DemandsEmployee needs to be able to sit at a
  workstation for extended periods; use hand(s) to handle or
  feel objects, tools, or controls; reach with hands and arms;
  talk and hear. Most positions require ability to work on
  desktop or laptop computer for extended periods of time
  reading, reviewing/analyzing information, and providing
  recommendations, summaries and/or reports in written format.
  Must be able to effectively communicate with others verbally
  and in writing. Employee may be required to occasionally
  lift and/or move moderate amounts of weight, typically less
  than 20 pounds. Regular and predictable attendance is
  essential.
