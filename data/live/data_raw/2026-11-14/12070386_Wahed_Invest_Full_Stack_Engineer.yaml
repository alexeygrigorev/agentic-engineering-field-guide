description: |
  About Wahed:

  The global financial system wasn't built for everyone. For
  millions of people, its reliance on interest (riba) creates
  a barrier to managing money and building wealth without
  compromising their values.

  At Wahed, we're changing that. We are a global fintech
  company on a mission to build a new financial system—one
  that is ethical, accessible, and entirely interest-free.
  From our offices across the globe, our team is building
  products that were once deemed impossible, from pioneering
  Shariah-compliant equity ETFs, creating riba-free
  alternatives to high yield savings accounts, to creating no-
  leverage real estate investments for truly interest-free
  income producing assets. If you're driven to solve complex
  problems and believe finance should empower, not exclude,
  join us in building a more equitable financial future.

  Job Brief:

  We are seeking a skilled and proactive Full Stack Engineer
  to join Wahed's Country Expansion team, supporting the
  development and launch of our investment platform across new
  international markets. You will play a key role in
  developing and adapting frontend and backend systems,
  building scalable technical solutions, and supporting
  localized customer onboarding, funding, and investment
  journeys across different markets.

  Working closely with Product Managers, Engineering,
  Operations, and Compliance teams, you will help translate
  business and regulatory requirements into secure, reliable,
  and scalable solutions. We are looking for a self-motivated
  engineer who enjoys solving complex technical challenges,
  takes ownership of delivery, and thrives in a collaborative,
  fast-paced environment.

  Job Responsibilities:

  - Design, develop, test, and maintain scalable frontend and
    backend solutions to support new country launches and
    existing market operations.
  - Build and enhance backend services, APIs, and microservices,
    preferably using Golang, while contributing to frontend
    applications using React, React Native, and TypeScript.
  - Develop and maintain third-party API integrations with KYC
    providers, payment gateways, banking partners, brokers,
    custodians, and other financial infrastructure providers.
  - Build and localize customer onboarding, identity
    verification, account funding, investment, and withdrawal
    workflows to meet country-specific requirements.
  - Collaborate with Product Managers, Engineering, Operations,
    and Compliance teams to translate business and regulatory
    requirements into effective technical solutions.
  - Support end-to-end technical delivery for new market
    launches, including development, integration testing,
    deployment, and post-launch troubleshooting.
  - Proactively identify and resolve defects, improve system
    architecture, and enhance application security,
    performance, and reliability.
  - Contribute to automated testing, technical documentation,
    and continuous improvements that enable efficient and
    scalable future country launches.

