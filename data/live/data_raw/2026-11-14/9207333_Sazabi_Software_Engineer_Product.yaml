description: |
  What we're building

  In 2026, we're on the verge of an "infinite software
  crisis." How will we support, maintain, and operate the
  explosion in application development?

  Our answer is Sazabi: the AI-native observability platform
  for fast-moving engineering teams.

  Sazabi gives teams a single place to ask questions about
  their production systems in plain language, automatically
  visualize what's happening, and get to the root cause 10x
  faster. No tedious instrumentation. No dashboard
  configuration. No alert tuning. Just answers.

  We're backed by tastemakers from the world's top AI
  companies: Vercel, Graphite, Daytona, Browserbase,
  LangChain, Mastra, Replit, and more.

  What you’ll do

  - Build the interface layer of an AI-native product: chat
    threads and streaming responses to dynamic visualizations
    that render themselves based on what you asked
  - Implement real-time multiplayer features so teammates can
    investigate incidents together, live
  - Craft data-dense UI components that make complex log data,
    error clusters, and timeseries feel simple and fast
  - Own the full slice: you'll touch the API, database queries,
    and React components to ship a feature end-to-end
  - Push the performance of a highly interactive application:
    streaming, virtualized log lists, live-updating charts
  - Build and extend our Slack integration as a first-class
    interface alongside the web app
  - Help define what great developer tooling looks like in an
    AI-first world, and set the bar for how we build it
  - Work directly with the founder to take new feature concepts
    from idea to shipped in days, not sprints

  What we're looking for

  - Strong fullstack experience (TypeScript-heavy stacks
    preferred)
  - Taste for product and design—you care about how things feel,
    not just how they work
  - Ability to move quickly from idea → prototype → production
  - Comfort working in ambiguity and defining problems yourself
  - Strong debugging skills and curiosity about how systems
    behave in production
  - Bonus: experience with developer tools, observability, or
    chat-based interfaces

  Our tech

  Our stack is TypeScript end-to-end. We use PostgreSQL for
  relational data, Temporal for durable execution, and the
  Vercel AI SDK to orchestrate our AI agents against the
  latest models. At the infrastructure layer, we use
  Terraform, Kubernetes, and AWS.

  Some of the most interesting engineering problems we grapple
  with are:

  - AI agents at production scale
  - Log processing at scale
  - Multi-region data architecture
  - Real-time streaming infrastructure
  - Evals and reinforcement learning
  - Zero-downtime deployments and fast rollbacks

  What we offer

  - Competitive salary and equity
  - Free lunches (in-office only)
  - Health, dental, and vision insurance
  - Unlimited paid time off
  - Paid parental leave

  Learn how we think and work

  Our team comes from Brex, Y Combinator, Rootly, Google,
  Doppel, and other top tech companies. We move fast and hold
  a high bar for both the product and each other.

  We operate according to six values:

  - Integrity. We say what we mean, do what we say, and own our
    mistakes.
  - Urgency. We treat every week like it matters, because it
    does.
  - Craftsmanship. We care deeply about the quality of our work.
  - Service. We're here to make developers’ and our teammates’
    lives easier.
  - Kindness. We're direct, and we move fast, but we treat each
    other well.
  - Fun. We genuinely enjoy working together. If you don't love
    what you're building and who you’re building it with,
    what's the point?

  You can find out more about us here:

  - Watch our launch video
  - Read the manifesto
  - Follow us on X and LinkedIn

  The Sazabi philosophy

  Sazabi is more than just a tool. It’s also a philosophy.
  We're taking a radically different approach to
  observability, centered on three big ideas:

  - Less is more. Most observability platforms drown you in
    dashboards and modules that you don’t need. We believe
    observability needs less UI, not more. Sazabi surfaces
    exactly the information you need in a simple, beautiful
    chat interface.
  - Logs are all you need. The “three pillars of observability”
    idea is outdated. Sazabi accepts only one kind of
    telemetry: logs. This simplifies the instrumentation and
    product experience dramatically.
  - Monitoring is dead. Creating and maintaining static alerts
    for a fast-evolving system is a fool’s errand. The future
    is agentic anomaly detection: AI agents that automatically
    check your app for issues 24-7.

  We came to these beliefs the hard way — after years of
  building infrastructure and responding to incidents with
  tools that offered plenty of bells and whistles, but no
  clear answers when it counted most.

  If this way of thinking resonates with you, come build with
  us.
