description: |
  Job Title: Senior Full Stack Engineer

  Location: Remote



  We are seeking a capable and mission-focused Senior Full
  Stack Engineer to support the deployment, configuration,
  integration, and ongoing operation of HUD’s data
  infrastructure, including Databricks, within HUD’s
  enterprise environment. This hands-on engineering role will
  work alongside cloud, data, security, and DevSecOps teams to
  establish secure and repeatable data, analytics, and AI/ML
  infrastructure to enable modern data engineering and
  governance. The ideal candidate combines practical
  Databricks deployment and operations experience with cloud
  engineering, automation, and troubleshooting skills and is
  comfortable learning and working across multiple
  technologies in a dynamic federal environment. As a senior
  member of the team, this individual will also work directly
  with HUD stakeholders, help guide technical approaches, and
  provide technical leadership to other engineers.

  Compensation & Benefits:

  Starting Salary Range for Senior Full Stack Engineer:
  $140,000 – $160,000

  Benefits That Set Us Apart

  When considering your next opportunity, compensation is only
  part of the picture. We offer a benefits package designed to
  invest in your future and support your life outside of work.

  Highlights include:

  • Up to a 6% 401(k) company match to help you build long-
  term financial security

  • Paid time off as part of our comprehensive benefits
  package, so you have the flexibility to rest, recharge, and
  enjoy what matters most

  • Medical, dental, and vision insurance, plus prescription
  drug coverage

  • Basic life and AD&D insurance, with supplemental life
  options

  • Short-term and long-term disability coverage

  • Paid holidays

  • Employee Assistance Program (EAP)

  • Flexible Spending Account (FSA) and Health Savings Account
  (HSA) options

  • Professional development, training, and certification
  support

  • Voluntary benefits including accident, critical illness,
  and identity theft protection

  Because taking care of our employees isn’t just a promise,
  it’s part of who we are.

  Benefits are subject to change and eligibility requirements
  apply.

  Essential Functions, Duties & Responsibilities:

  Includes the following:

  • Deploy, configure, and support enterprise data platform
  workspaces and associated cloud infrastructure.

  • Configure compute, storage, identity, access controls,
  Unity Catalog, and related platform services.

  • Automate deployments and configuration using
  Infrastructure as Code (IaC), scripting, APIs, and CI/CD
  tools.

  • Integrate data platform with enterprise data sources,
  cloud services, security capabilities, and development
  tools.

  • Support data engineering workloads, ingestion pipelines,
  and Databricks-based applications.

  • Monitor, troubleshoot, and resolve platform, integration,
  performance, and access issues.

  • Collaborate with data, cloud, cybersecurity, DevSecOps,
  and application teams to implement secure and reliable
  solutions.

  • Develop and maintain technical documentation, deployment
  procedures, and operational guidance.

  • Perform other job-related duties as assigned.

  Supervisory Responsibilities:

  No supervisory/management authority

  Basic Qualifications:

  • Bachelor’s degree in a technical discipline or equivalent
  relevant professional experience.

  • 10+ years of relevant cloud, data engineering, platform
  engineering, or DevOps experience.

  • Hands-on experience with Databricks deployments and
  operations.

  • Experience working with AWS, Azure, or another major cloud
  platform.

  • Experience with Infrastructure as Code and CI/CD tools and
  practices.

  • Working knowledge of Python, SQL, and/or scripting
  languages.

  • Understanding of cloud networking, identity and access
  management, security, and data integration concepts.

  • Strong troubleshooting, communication, and collaborative
  problem-solving skills.

  • Must be a US Citizen.

  • Prolonged periods of sitting at a desk and working on a
  computer; may occasionally require standing or moving about
  the office for extended periods.

  • Must pass pre-employment qualifications of Cherokee
  Federal.

  Preferred Qualifications:

  • Remote but desire someone in the Greater Washington DC
  Metro area or Huntsville, AL to support on-site meetings
  with the client as needed.

  • Databricks or relevant cloud certification.

  • Experience with Unity Catalog, Delta Lake, Apache Spark,
  and Databricks automation tools.

  • Experience with enterprise data pipelines, data
  governance, or modern lakehouse architectures.

  • Familiarity with federal cybersecurity requirements,
  including NIST, FedRAMP, or RMF.

  • Experience supporting federal government technology
  environments.

  Work Environment:

  Work is performed primarily in a climate-controlled
  environment.

  Company Information:

  Behind every government mission stands skilled, mission-
  driven talent: people whose expertise and dedication turn
  complex challenges into successful outcomes. Cherokee Nation
  Businesses Corp - CFED, part of Cherokee Federal, the
  federal contracting division of Cherokee Nation Businesses,
  is that team. We modernize aging systems, deliver care where
  it’s needed most, and keep missions supplied, staffed, and
  moving across defense, intelligence, and civilian agencies.
  For more than 60 federal clients, we take on the work others
  won’t, and deliver where it counts. If that’s the kind of
  work you’re looking for, you’ve found your team. Learn more
  at cherokee-federal.com.

