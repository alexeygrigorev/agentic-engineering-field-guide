description: |
  Role Overview

  As a Full Stack C# Engineer, you will play a key role in
  designing and delivering high-quality, scalable applications
  that power critical business functions. This position
  requires strong technical expertise across front-end and
  back-end technologies, a collaborative mindset, and the
  ability to influence architectural decisions. You will work
  closely with product owners, architects, and other engineers
  to build innovative solutions that meet business needs while
  adhering to best practices in security, performance, and
  maintainability.

  Role Responsibilities

  - Design, develop, and maintain scalable full-stack
    applications using modern frameworks and cloud
    technologies.
  - Collaborate with cross-functional teams to deliver high-
    quality software aligned with business objectives.
  - Implement and maintain microservices architecture and API
    integrations.
  - Ensure adherence to SDLC processes, including CI/CD
    pipelines and automated testing.
  - Optimize application performance and ensure security best
    practices.
  - Participate in architectural discussions and contribute to
    evolving systems toward target state architecture.
  - Troubleshoot and resolve complex technical issues in
    production environments.
  - Mentor junior engineers and promote engineering best
    practices.
  - Work within Agile delivery teams, contributing to planning,
    estimation, and retrospectives.
  - Stay current with emerging technologies and incorporate best
    practices into development.

  Experience / Competences

  Essential

  - Strong experience in full-stack development within
    enterprise environments.
  - Proficiency in front-end technologies: TypeScript, React (or
    similar frameworks).
  - Strong back-end experience with C# language.
  - SOLID principle.
  - Good understanding of RESTful APIs.
  - Experience with cloud platforms (AWS preferred) and
    containerization (Docker/Kubernetes).
  - Knowledge of CI/CD tools and practices (e.g., GitLab).
  - Familiarity with automated testing frameworks and
    maintaining code quality.
  - Strong database skills (SQL).
  - Excellent problem-solving, communication, and collaboration
    skills.

  Desired

  - Experience with microservices and event-driven
    architectures.
  - Experience with AI assisted design and coding.
  - GraphQL, and WebSockets.
  - Knowledge of observability tools (e.g., OpenTelemetry,
    Grafana).
  - Familiarity with Infrastructure as Code (Terraform).
  - Understanding of financial markets or trading systems.
  - Contribution to open-source projects.
  - Awareness of security principles and DevSecOps practices.

  Role Band & Level:

  - Professional/5

  #LI-Hybrid #LI-ASO #LI-CR1

  Not The Perfect Fit?

  Concerned that you may not meet the criteria precisely? At
  TP ICAP, we wholeheartedly believe in fostering inclusivity
  and cultivating a work environment where everyone can
  flourish, regardless of your personal or professional
  background. If you are enthusiastic about this role but find
  that your experience doesn't align perfectly with every
  aspect of the job description, we strongly encourage you to
  apply. You may be the ideal candidate for this position or
  another opportunity within our organisation. Our dedicated
  Talent Acquisition team is here to assist you in recognising
  how your unique skills and abilities can be a valuable
  contribution. Don't hesitate to take the leap and explore
  the possibilities. Your potential is what truly matters to
  us.

  Company Statement

  We know that the best innovation happens when diverse people
  with different perspectives and skills work together in an
  inclusive atmosphere. That's why we're building a culture
  where everyone plays a part in making people feel welcome,
  ready and willing to contribute. TP ICAP Accord - our
  Employee Network - is a central to this. As well as
  representing specific groups, TP ICAP Accord helps increase
  awareness, collaboration, shares best practice, and holds
  our firm to account for driving continuous cultural
  improvement.

  Location

  UK - 135 Bishopsgate - London
