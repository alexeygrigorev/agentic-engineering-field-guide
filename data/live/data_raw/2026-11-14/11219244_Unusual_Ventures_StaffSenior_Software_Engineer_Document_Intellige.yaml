  KEY RESPONSIBILITIES

  NICE TO HAVE

  WORKING AT HELIOS

  This is a full-time, in-person role based in our SoHo office
  in New York City. Team members are expected to work from the
  office five days per week when they are not deployed with
  customers.

  Certain customer engagements may require background checks,
  security reviews, access approvals, or eligibility for a
  U.S. government security clearance. Some projects may be
  subject to U.S. citizenship or other customer-specific
  access requirements.

  We're not looking for passengers; we want driven innovators
  with a hunger to build from the ground up - obsessed with
  pushing the boundaries of natural language understanding,
  document processing, and personalized relevance.

  Helios is a fast-moving startup with ambitious goals. This
  is not a conventional 9-to-5 role. We expect flexibility
  during critical deployment periods, customer incidents,
  product launches, and other company-critical work. In
  return, this role offers unusual ownership, direct access to
  consequential institutions, and the opportunity to build
  systems that affect how major decisions are made.

  HOW WE WORK

  - Own outcomes, not just assigned tasks. Identify what needs
    to happen and drive it through completion.
  - Move quickly without lowering the standard. Speed and rigor
    are complementary.
  - Stay close to the mission and the user. The best decisions
    begin with the real problem.
  - Work across boundaries. Everyone contributes beyond the
    narrow limits of a job title.
  - Communicate directly. We value clear thinking, honest
    feedback, and low-ego collaboration.
  - Build for the real world. Our systems must perform in
    complex, regulated, and high-stakes environments.

  EQUAL OPPORTUNITY

  Helios is an equal opportunity employer. We evaluate
  candidates based on their abilities, experience, and
  potential to contribute to our mission. We do not
  discriminate on the basis of race, color, religion, sex,
  gender identity or expression, sexual orientation, national
  origin, age, disability, veteran status, or any other status
  protected by applicable law.
