  Staff/Senior Software Engineer, Document Intelligence & Data
  Infrastructure

  New York City | Full-time | On-site in SoHo, five days per
  week

  Reports to the CTO and works directly with the founding team

  ABOUT HELIOS

  Helios is building a new kind of company to solve America’s
  hardest problems, starting with the government interaction
  layer.

  Government shapes every consequential market, but the
  infrastructure connecting public institutions and private
  organizations remains fragmented, manual, and difficult to
  navigate. Helios is rebuilding that layer.

  Our core platform, Proxi, gives organizations the
  intelligence they need to understand what government is
  doing, why it matters, and what to do next. From that
  foundation, we design and deploy secure, mission-specific
  systems for government agencies, enterprises, and
  institutions operating in complex and highly regulated
  environments.

  We bring together frontier AI, deep public-sector expertise,
  and forward-deployed execution. Our team includes leaders
  and builders from the White House, U.S. Department of State,
  Datadog, and Microsoft. We are backed by leading
  institutional investors and trusted by organizations working
  on high-stakes problems across government and industry.

  MISSION

  Build and operate the acquisition and processing
  infrastructure that turns global public-sector and open-
  source data into reliable, searchable intelligence. This
  role owns the path from source discovery and collection
  through normalization, extraction, enrichment, and
  publication. You will expand our platform to include new
  countries, languages, institutions, and source formats
  covering many additional areas of open source intelligence
  to advance Proxi’s natural capabilities. We are looking for
  a senior engineer who has built and operated large-scale
  acquisition or document-processing systems in production.

