description: |
  At Salas O’Brien we tell our clients that we’re engineered
  for impact. This passion for making a difference applies
  just as much to our team as it does to our projects. That’s
  why we’re committed to living our values every day:
  inspiring, achieving, and connecting as shared owners of our
  success with a focus on a sustainable future.

  Building for the long-term means that all of our team
  members can expect to work on amazing projects with a
  people-first approach to problem solving. It also means that
  each member of our team has truly limitless potential to
  build a unique, meaningful, and high-impact career—and
  they’ll receive great total rewards along the way.

  About Us

  Founded in 1975, Salas O’Brien is an employee-owned
  engineering and professional services firm focused on
  achieving impact for our clients, our team, and the world.
  We know that tomorrow’s requirements are today’s
  opportunities, and we are here to design lasting solutions
  for pressing challenges.

  We work across a variety of industries providing integrated
  engineering and consulting services. Our specialized
  experience includes design for data centers, healthcare,
  science and technology, high-rise buildings, clean energy,
  education, and other building types as well as structural
  and building sciences, infrastructure asset management,
  advanced robotics, and more.

  Our technical expertise is paired with an exceptional team
  of business development, human resources, finance and
  accounting, information technology, and marketing
  professionals, all of whom play a key role in bringing our
  commitments to life every day.

  Position Summary

  The Software Engineer serves to support the business by
  designing, developing, debugging, maintaining, and
  integrating various application modules. The position works
  closely with internal business units to understand
  requirements for developing applications to enhance
  companywide productivity and information sharing.  This
  includes development projects affecting workflow, reporting
  functions, data accuracy, application interfaces (APIs) and
  compliance.

  In this role, you will:

  - Directly contribute to internally developed applications,
    improving day-to-day business workflows in the civil
    engineering space.
  - Write unit and functional tests and perform manual testing
    for applications, to identify and solve problems with
    internal applications.
  - Deliver technical proposals for improving existing processes
    to a diverse audience, with work and cost savings
    estimates. Recommendations may include using features of
    existing services/applications, purchasing new
    services/applications, or a bespoke development solution.
  - Work with other regional IT team members and managers to
    collaborate on successful deployment of enterprise-wide
    initiatives.

  Requirements

  - Proficiency in object-oriented Python development –
    frameworks like FastAPI, Django or Flask preferred.
  - Experience with front-end JavaScript/TypeScript development
    - React experience a plus.
  - Proficiency in SQL and relational databases – working
    knowledge of Microsoft SQL server a plus.
  - Able to work with 3rd party APIs with little or no official
    documentation.
  - 3-5 Years of Python Experience

  Education            Bachelor's degree or AA in Computer
  Science, Software Engineering/Development, or other related
  discipline preferred

  Location: Remote

  Travel: None

  Compensation & Benefits:

  The expected base salary range for this role is $125,000 -
  $150,000 USD per year. Actual compensation will be
  determined based on a number of factors including skills,
  experience, qualifications, and location.

  This role is also eligible for performance-based bonuses and
  a comprehensive U.S. based benefits package, including:

  - Medical, dental, and vision insurance
  - 401(k) with company match
  - Paid time off and company holidays
  - Wellness programs and employee assistance resources
  - Professional development support

  For more information, visit our full benefits overview here.

