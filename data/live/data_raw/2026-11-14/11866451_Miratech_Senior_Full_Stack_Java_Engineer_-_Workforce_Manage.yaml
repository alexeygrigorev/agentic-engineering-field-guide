description: |
  Company Description

  Miratech helps visionaries change the world. We are a global
  IT services and consulting company that brings together
  enterprise and start-up innovation. Today, we support
  digital transformation for some of the world's largest
  enterprises. By partnering with both large and small
  players, we stay at the leading edge of technology, remain
  nimble even as a global leader, and create technology that
  helps our clients further enhance their business. We are a
  values-driven organization, and our culture of Relentless
  Performance has enabled over 99% of Miratech's engagements
  to succeed by meeting or exceeding our scope, schedule,
  and/or budget objectives since our inception in 1989.
  Miratech has coverage across  5 continents and operates in
  over 25 countries around the world. Miratech retains nearly
  1000 full-time professionals, and our annual growth rate
  exceeds 25%.

  Job Description

  We are looking for a Senior Full Stack Engineer to join the
  Workforce Management product stream and build enterprise-
  scale solution supporting forecasting, capacity planning,
  scheduling, real-time adherence, intraday management, and
  operational reporting in contact center environment. You
  will use Java and Spring Boot to deliver scalable services,
  React with TypeScript to create intuitive workforce
  applications, and Node.js where appropriate for integrations
  or supporting components. The role suits an engineer who can
  translate complex workforce rules and high-volume
  operational data into maintainable, auditable software.
  Experience with Customer Experience (CX) platforms is a
  strong advantage; practical knowledge of WFM processes or
  products is preferred.

  Responsibilities:

  - Design and implement workforce planning, forecasting,
    scheduling, and optimization capabilities using Java,
    Spring Boot, and established domain-driven design
    practices.
  - Build microservices for forecasting, staffing calculations,
    schedule generation, shift management, adherence,
    exceptions, and operational reporting.
  - Develop responsive workforce applications using TypeScript
    and React, with accessible workflows for planners,
    supervisors, and employees.
  - Design and consume REST APIs using an API-first approach;
    define and maintain clear OpenAPI/Swagger contracts and
    versioning standards.
  - Implement event-driven workflows that ingest and publish
    schedule changes, agent states, queue metrics, forecasts,
    and adherence events.
  - Integrate WFM capabilities with CX platforms, ACD and
    routing systems, HR systems, payroll, identity services,
    and enterprise data platforms.
  - Model workforce and operational data in PostgreSQL and other
    relational databases, with attention to integrity,
    history, time zones, and query performance.
  - Containerize services and contribute to cloud-native
    deployment patterns, configuration management, and
    environment consistency.
  - Build and maintain CI/CD pipelines, including Jenkins,
    automated tests, quality gates, and repeatable deployment
    processes.
  - Troubleshoot production issues and optimize application
    performance, batch processing, concurrency, scalability,
    and reliability.
  - Participate in code reviews, technical design sessions,
    architecture discussions, sprint planning, and continuous
    improvement activities.
  - Collaborate with Product, Operations Research, QA, DevOps,
    UX, and other stakeholders to convert needs into
    deliverable solutions.

  Qualifications

  - 8+ years of experience in full-stack software development,
    including ownership of production applications.
  - Strong understanding of workforce management concepts,
    including forecasting, staffing, scheduling, adherence,
    intraday management, shrinkage, occupancy, and service
    level management.
  - Experience working with complex business rules engines,
    optimization logic, scheduling algorithms, or workforce
    planning workflows.
  - Strong hands-on experience with Java and Spring
    technologies, particularly Spring Boot, REST services,
    security, and persistence
  - Solid frontend development experience with Angular or React,
    TypeScript, component-based design, state management, and
    modern testing practices.
  - Familiarity with Node.js for integrations, lightweight
    services, build tooling, or supporting components.
  - Experience integrating WFM with ACD, routing, HR, payroll,
    CRM, or data warehouse platforms.
  - Experience with AWS services and Amazon Connect is
    preferred.
  - Proven experience designing REST APIs, microservices, and
    event-driven services in distributed environments.
  - Strong SQL skills and experience designing efficient data
    models in PostgreSQL or comparable relational databases.
  - Experience developing, deploying, or supporting cloud-based
    and containerized applications.
  - Excellent communication skills, including the ability to
    produce clear technical documentation and lead client-
    facing workshops.

  Nice to have:

  - Experience building configurable rule engines for labor
    policies, scheduling constraints, or workforce
    optimization scenarios.
  - Exposure to workforce forecasting models, simulation
    techniques, optimization algorithms, or machine learning
    applications in workforce planning.
  - Experience with real-time operational data processing and
    event-driven architectures supporting workforce adherence
    and performance management.
  - Experience with Kafka, RabbitMQ, or similar messaging and
    event-streaming technologies.
  - Exposure to workforce analytics, optimization techniques, or
    operational research concepts.
  - Familiarity with Jenkins, Kubernetes, cloud platforms,
    observability tooling, and secure software delivery
    practices.
  - Practical experience with AI-assisted software development
    or AI-enabled solutions, including tools such as Claude or
    GitHub Copilot, is a plus.

  Additional Information

  We offer:

  - Culture of Relentless Performance: join an unstoppable
    technology development team with a 99% project success
    rate and more than 30% year-over-year revenue growth.
  - Competitive Pay and Benefits: enjoy a comprehensive
    compensation and benefits package, including health
    insurance, language courses, and a relocation program.
  - Growth Mindset: reap the benefits of a range of professional
    development opportunities, including certification
    programs, mentorship and talent investment programs,
    internal mobility and internship opportunities.
  - Global Impact: collaborate on impactful projects for top
    global clients and shape the future of industries.
  - Welcoming Multicultural Environment: be a part of a dynamic,
    global team and thrive in an inclusive and supportive work
    environment with open communication and regular team-
    building company social events.
  - Social Sustainability Values: join our sustainable business
    practices focused on five pillars, including IT education,
    community empowerment, fair operating practices,
    environmental sustainability, and gender equality.

