description: |
  Synthomer is a leading supplier of high-performance, highly
  specialised polymers and ingredients that play vital roles
  in key sectors such as coatings, construction, adhesives,
  and health and protection – growing markets that serve
  billions of end users worldwide. Headquartered in London, UK
  and publicly listed there since 1971, we employ c.3,500
  employees across our 5 innovation centres of excellence and
  more than 28 manufacturing sites across Europe, North
  America and Asia. Around 20% of our sales volumes are from
  new and patent protected products.



  At our innovation centres of excellence in the UK, Germany,
  China, Malaysia and Ohio, USA we collaborate closely with
  our customers to develop new products and enhance existing
  ones tailored to their needs, with an increasing range of
  sustainability benefits. Since 2021, we have been proud
  holders of the London Stock Exchange Green Economy Mark,
  which recognises green technology businesses making a
  significant contribution to a more sustainable, low-carbon
  economy.

  The Role

  We are looking for a Senior Project Manager to lead capital
  engineering projects of up to £2M across high-hazard
  chemical manufacturing sites. Working within a structured
  stage-gate process, you will be responsible for delivering
  projects safely, on time, within budget, and in full
  compliance with regulatory and quality standards.

  Based in Harlow, Essex, you will manage multidisciplinary
  teams and external contractors, with occasional travel
  across the UK and Europe.

  Key Responsibilities

  - Lead engineering and capital projects from concept through
    to completion.
  - Ensure compliance with SHE, COMAH, regulatory, and company
    standards.
  - Define project scope, requirements, budgets, schedules, and
    execution plans.
  - Coordinate internal stakeholders, engineering teams,
    contractors, and suppliers.
  - Manage project risks and implement mitigation strategies.
  - Control project costs, forecasts, timelines, and
    documentation.
  - Support contract and procurement activities to ensure
    successful project delivery.
  - Provide regular project updates, KPIs, and governance
    reporting.
  - Drive effective stakeholder engagement and communication.
  - Mentor and support colleagues managing smaller local
    projects.

  About You

  - Degree qualified in a relevant engineering discipline.
  - PMP, PRINCE2, or equivalent project management
    qualification.
  - 10+ years' experience within chemicals, manufacturing, or
    other high-hazard industries.
  - Proven track record delivering multidisciplinary engineering
    projects in brownfield environments.
  - Experience managing EPCM contractors and external
    engineering partners.
  - Strong leadership, communication, and stakeholder management
    skills.
  - Able to influence and coordinate diverse project teams
    without direct line management responsibility.
  - Additional European language skills would be advantageous.

  Location

  Harlow, Essex (site-based) with travel to UK and European
  locations as required.

  🌍 Global Benefits Overview

  - 💰 Competitive, market-aligned compensation
  - 🎯 Discretionary global bonus scheme
  - 📈 Discretionary Long-Term Incentive Plan (LTIP) – for senior
    positions
  - 🚗 Company car or car allowance – varies by region and role
  - 🩺 Healthcare – tailored to regional locations
  - 👶 Parental leave and family support – maternity, paternity,
    adoption (aligned with regional policies)

  - 🏡 Working options – flexibility where it matters, based on
    role and business needs

  - 📚 Learning & development opportunities – training, online
    platforms, buddy/mentorship programs, Internal Synthomer
    University with L&D offers
  - 💙 Wellbeing support – employee assistance program (EAP),
    mental health resources, wellbeing initiatives
  - 🌱 Retirement / pension contributions – plans vary by country
  - 🤝 Culture of Inclusion – where everyone can thrive
  - 🏆 Performance culture, global reward & recognition
    programmes
