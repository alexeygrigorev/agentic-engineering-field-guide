description: |
  Who We Are:

  Click Therapeutics, Inc., develops, validates, and
  commercializes software as prescription medical treatments
  for people with unmet medical needs. As a leading innovator
  of Digital Therapeutics™, Click delivers accessible,
  clinically proven, FDA-regulated prescription treatments to
  the smartphone in your hand. Click’s treatments are defined
  by a commitment to applying technical and scientific rigor
  and patient-centric design to the development process. This
  results in uniquely engaging experiences that achieve
  compelling clinical outcomes for patients seeking new
  treatment options. Click Therapeutics continuously expands
  and refines its platform with novel cognitive, behavioral
  and neuromodulatory mechanisms of action and advanced data-
  driven tools such as artificial intelligence and machine
  learning. The digital therapeutics under development on
  Click’s platform address diverse areas of therapeutic need,
  including indications in psychiatry, neurology, oncology,
  immunology, and cardiometabolic diseases. Consistently named
  a best place to work, Click fosters an inclusive, diverse
  workforce of innovators, clinicians, scientists,
  researchers, designers, technologists, engineers and more,
  united in a common mission to provide patients everywhere
  access to safe and effective prescription digital
  therapeutics. For more information, visit
  www.clicktherapeutics.com and connect with us on LinkedIn.

  About the Role:

  We are seeking a highly skilled Full Stack Engineer who
  thrives in a fast-paced environment and is passionate about
  leveraging cutting-edge technology to drive development
  efficiency. In this role, you will be responsible for
  building innovative mobile applications within a Digital
  Therapeutics (DTx) environment, utilizing a modern technical
  stack centered on React Native and Node.js. You possess
  extensive experience architecting and building robust
  solutions across the entire stack, with deep expertise in
  modern frontend frameworks and scalable backend services
  hosted on AWS. Beyond traditional coding, you are a pioneer
  in AI-augmented engineering; you actively design and manage
  multi-agent workflows that accelerate the software
  development lifecycle. You understand the nuances of
  orchestrating complex agentic pipelines and have the
  architectural intuition to determine when to rely on
  autonomous agents and when to apply human expertise. You
  also bring a strong background in collaboration and
  mentorship, helping to elevate the team around you.
  Furthermore, you will play a key role in evolving our
  engineering practices, not only utilizing but actively
  adding to and expanding our AI-driven workflows to
  continuously improve development velocity.

  This position can either be based out of Click’s
  headquarters located in Tribeca, NYC. We have a hybrid
  working model that consists of at least 4 days in office
  each week.

  Responsibilities:

  - Build and ship high-quality mobile applications within our
    Digital Therapeutics (DTx) environment, maintaining tight
    feedback loops and high development velocity.
  - Own end-to-end architecture and technical direction for our
    React Native and Node.js-based systems, from initial
    planning and estimation through to production and
    iterative improvement.
  - Design, implement, and expand our multi-agent AI engineering
    workflows, setting the organizational standard for how AI-
    augmented development is used to accelerate the software
    lifecycle.
  - Mentor and collaborate with engineers across the team to
    elevate technical proficiency, promote engineering
    excellence, and foster a culture of shared growth.
  - Partner directly with Product and Engineering leadership to
    define technical roadmaps, translating ambiguous product
    requirements into clear, actionable technical plans.
  - Triage and resolve complex, cross-cutting production issues
    that span mobile app, backend, and infrastructure
    boundaries.
  - Contribute to CI/CD practices and build/release
    infrastructure to ensure reliable and rapid delivery of
    our mobile and backend services.

  Qualifications:

  At Click, we aren't just looking for talent; we are looking
  for the next evolution of the modern professional. To us, AI
  is not a future possibility, it is a present-day
  prerequisite. We expect every Click colleague to have
  seamlessly integrated AI into their professional workflow
  and personal productivity, using it as a force multiplier to
  move faster, think deeper, and deliver superlative results
  that were previously out of reach. If you do not yet view AI
  as an essential partner in your daily pursuit of excellence,
  you will find it impossible to keep pace with our mission.
  High performers who harness AI technology to transcend
  traditional boundaries and set new benchmarks for
  professional excellence will thrive at Click.

  - 10+ years of professional full-stack software development
    experience, with a track record of shipping production-
    grade applications at scale.
  - Deep expertise in the React Native and TypeScript ecosystem,
    paired with robust backend development experience using
    Node.js.
  - Proven experience designing and managing cloud-native
    systems on AWS, including Kubernetes, CI/CD, and modern
    observability tools (e.g., Datadog).
  - Hands-on experience architecting multi-agent AI workflows.
    You go beyond basic code completion, demonstrating success
    in orchestrating agentic pipelines and defining clear
    boundaries for autonomous vs. human-in-the-loop
    development.
  - Strong architectural instincts: you have made high-impact
    technical decisions, can articulate the tradeoffs
    involved, and are comfortable driving long-term technical
    strategy.
  - Demonstrated ability to elevate engineering teams through
    mentorship, pairing, and fostering a culture of technical
    excellence.
  - Excellent communication skills; you can translate deep
    technical context into actionable insights for cross-
    functional partners and non-technical stakeholders.
  - Demonstrated ability to operate independently in ambiguous
    environments identifying, planning, and resolving complex
    problems from inception to production.

  Compensation:

  The base salary range for this position is between: $172,200
  - $266,514. The final base salary will be dependent upon
  skills, experience and location. In addition to the base
  salary, Click Therapeutics offers an annual performance-
  based cash bonus and a generous equity package.

  Benefits:

  The role includes great benefits and is an excellent wealth-
  building opportunity at a fast-growing pre-IPO company in a
  nascent and extremely exciting space.

