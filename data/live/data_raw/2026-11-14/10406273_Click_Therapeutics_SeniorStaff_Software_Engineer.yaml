  Recruitment Phishing Scams:

  Fake job advertisements and offers are increasingly
  appearing on the internet. If you have encountered a job
  posting or have been approached with a job offer that you
  suspect may be fraudulent, we strongly recommend you do not
  respond and report it to the Federal Trade Commission and
  the FBI at https://www.ic3.gov/Home/ComplaintChoice.

  Please be mindful of the following:

  - Click Therapeutics will only reach out to you through an
    “@clicktherapeutics.com” email address.Other than your
    email address or telephone number, which you may provide
    via a job application portal, Click Therapeutics will
    never ask you to provide personally identifiable
    information about yourself (such as a Social Security
    Number or Driver’s License Number) via a messaging
    application (like that used on the LinkedIn platform or
    Microsoft Teams).
  - Click Therapeutics will conduct interviews face-to-face over
    Zoom.
  - All job postings will be listed on the Click Therapeutics
    official career page.
