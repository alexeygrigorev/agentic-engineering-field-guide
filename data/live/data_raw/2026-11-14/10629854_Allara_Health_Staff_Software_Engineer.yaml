description: |
  Allara is a comprehensive women’s health provider that
  specializes in expert, longitudinal care that supports women
  through every life stage. Trusted by thousands of women
  nationwide, Allara makes expert healthcare accessible by
  connecting patients with multidisciplinary care teams that
  have a deep understanding of hormonal, metabolic, and
  reproductive care. Allara provides ongoing support for
  hormonal conditions like PCOS, chronic conditions like
  insulin resistance, and life stages like perimenopause,
  helping patients see improved health outcomes. As one of the
  fastest-growing women’s health platforms in the U.S., Allara
  is bridging long-overlooked gaps in healthcare for women.

  The Opportunity

  We're looking for a Staff Software Engineer to help build
  the technical foundation that will scale our platform and
  transform women's healthcare delivery. You'll design and
  build resilient, event-driven distributed systems, from AI-
  powered health companions that help women manage their
  conditions to complex integrations with healthcare systems
  nationwide.

  This is an opportunity to write code that matters: shaping
  engineering best practices, mentoring a growing team, and
  directly impacting how hundreds of thousands of women access
  personalized care.

  Location: Hybrid (NYC). We value in-person collaboration and
  aim for at least three days per week in our NYC office, with
  flexibility as needed.

  Your Impact

  - Design and implement scalable distributed architectures that
    support personalized care delivery for a rapidly growing
    patient base
  - Own technical initiatives across the stack, from AI/ML-
    powered health guidance tools to EMR, billing, and
    scheduling integrations
  - Help define engineering standards, architectural patterns,
    and best practices that enable the team to move fast
    without breaking things
  - Mentor and grow engineers across the team, fostering a
    culture of technical excellence and collaborative problem-
    solving
  - Partner with product, clinical, and data teams to translate
    complex healthcare requirements into elegant technical
    solutions
  - Drive build vs. buy decisions, technology selection, and
    infrastructure investments that balance current needs with
    future scale

  Required Qualifications

  - 7+ years of software engineering experience, with 2+ years
    in a Staff or Principal role
  - Proven track record designing and building distributed
    systems at scale, with a deep understanding of system
    design tradeoffs
  - Strong full-stack capabilities with expertise in modern
    backend technologies (Python, TypeScript, Go, or similar)
    and AWS
  - Experience architecting systems in regulated industries
    (healthcare, fintech) with considerations for security,
    compliance, and data privacy
  - Demonstrated ability to mentor engineers and elevate team
    technical capabilities through code review, design
    guidance, and knowledge sharing
  - Excellent communication skills; able to articulate complex
    technical concepts to both technical and non-technical
    stakeholders

  Bonus Points

  - Background in healthcare technology, including EMR
    integrations, HL7/FHIR standards, or telehealth platforms
  - Experience building AI agents or Model Context Protocol
    (MCP) integrations
  - Prior experience at a high-growth startup, particularly
    during scaling phases (Series B–D)
  - Familiarity with Next.js and CQRS

  What Allara Offers:

  Compensation & Career Growth

  - $201,000 - $250,500 with opportunities for advancement
  - Equity
  - Professional development & employee learning programs

  Actual compensation will be determined based on a variety of
  factors, including but not limited to: candidate experience,
  location, education, certifications, and skill set. In
  addition to base salary, our total compensation package
  includes equity, comprehensive health benefits (medical,
  dental, vision), generous paid time off, and additional
  wellness and professional development perks.

  Work Environment & Flexibility

  - 3-day hybrid in NYC
  - Unlimited PTO & 11 company holidays

  Health & Wellness

  - Medical, dental, and vision benefits
  - Health Savings Account (HSA) & Flexible Spending Account
    (FSA)
  - Long- and short-term disability coverage
  - Annual employee wellness stipend

  Family & Future Planning

  - 401(k) plan
  - Parental leave & family planning support benefits

  Additional Perks

  - Company-issued laptop
  - Annual work-from-home stipend
  - Commuter benefits (if applicable)
  - A collaborative, mission-driven culture focused on improving
    patient care

  At Allara, we believe in celebrating everything that makes
  us human and are proud to be an equal-opportunity workplace.
  We embrace diversity and are committed to building a team
  that represents a variety of backgrounds, perspectives, and
  skills. We believe that the more inclusive we are, the
  better we can serve our members. We’re an Equal Opportunity
  Employer and do not discriminate against candidates or
  patients based on race, color, gender, sexual orientation,
  gender identity or expression, age, religion, disability,
  national origin, protected veteran status, or any other
  status protected by applicable federal, state, or local law.
