description: |
  Senior Fullstack Software Engineer

  Location: Soho, NYC / Hybrid (an in-person interview may be
  required) Department: Engineering

  The Role

  We’re looking for a Senior Fullstack Software Engineer to
  help architect, build, and scale the next generation of our
  Flowcode 2 platform and consumer experiences. You will join
  our engineering team with a focus on creating amazing end
  user hub and landing page experiences that are dynamic and
  engaging, as well as the platform and management
  capabilities for creators on the platform. You’ll work
  across the stack — from contributing to backend services to
  building out dynamic end to end landing pages. Though this
  is a full stack position, we are looking for someone that
  has deep backend experience as well.

  As one of the senior engineers on a small but highly capable
  team, you’ll own medium to large sized features, drive
  technical execution, contribute to a delivery focused
  environment, and mentor others. You’ll balance hands-on
  engineering with architectural thinking, helping us move
  fast while maintaining reliability, performance, and code
  quality.

  This is an ideal role for a problem-solver who values
  simplicity over complexity, enjoys building dynamic and
  interactive applications and approaches engineering with
  pragmatism and curiosity.



  What You’ll Do

  - Design, build, and maintain scalable features across a
    modern front-end framework and backend services.
  - With support, own key features end-to-end, from data design
    to user-facing experiences.
  - Architect for growth — help drive your pods’s technical
    roadmap and shepherd established engineering best
    practices.
  - Collaborate across teams with product, design, and data to
    deliver measure, deliver and grows features quickly and
    iteratively.
  - Write clean, reliable, and maintainable code, with strong
    attention to performance, best practices and developer
    experience.
  - Mentor engineers and help elevate technical execution across
    you pod.
  - Stay pragmatic — balance ideal engineering with the
    realities of speed, customer needs, and startup resource
    constraints.

  What We’re Looking For

  - 5–7+ years of experience building and shipping production-
    quality software across the stack.
  - Proficiency in at least one modern backend language (e.g.,
    Go, Python, C#, Java).
  - Strong experience with React, Next.js, or other modern
    front-end frameworks. We use Svelte but any modern
    framework experience is welcome.
  - Deep understanding of web architecture, API design, and data
    modeling in relational and/or NoSQL databases.
  - Familiarity with cloud environments (AWS, GCP, or similar)
    and containerized deployment (Docker, Kubernetes).
  - Commitment to code quality, with solid grounding in design
    patterns, testing, and CI/CD.
  - Strong grasp of scalability and performance — able to make
    informed tradeoffs between speed and correctness.
  - Excellent communication skills and a collaborative mindset.
  - A builder’s mentality — comfortable taking initiative and
    owning outcomes from design through production.

  Nice to Have

  - Experience building consumer focused SaaS applications and
    experiences
  - Experience with form based, dynamic applications with rich
    user generated content.

  Flowcode is not for everyone. We hire with a pinhole lens —
  only those with the rare combination of intellectual
  horsepower, execution velocity, and uncompromising drive
  will thrive here. If you are seeking to operate at the
  highest levels of performance and impact, we want to meet
  you.

  How to Apply

  We are an equal opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  A successful candidate’s starting pay will be determined
  based on the role, job-related skills, experience,
  qualifications, work location, and market conditions. The
  current range for this role is up to $200-$220k plus equity.
