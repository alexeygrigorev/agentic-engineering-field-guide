description: |
  Build the software that makes autonomous flight work at
  scale

  At sees.ai, we're building autonomous drone technology to
  change how some of the world's most important infrastructure
  is inspected and managed.

  And this isn't technology waiting for a use case. We're
  already delivering large-scale autonomous inspection
  programmes for National Grid and gaining traction with major
  grid operators internationally.

  We're venture-backed and supported by Boeing, with a
  founding team whose backgrounds include Apple, CERN and
  McLaren F1.

  We've solved some exceptionally hard problems in autonomy,
  aviation and regulation.

  Now we're solving the problems that come with scale, which
  creates some fascinating software challenges.

  How do you turn autonomous flight into something that can
  operate at large scale?

  How do you plan and manage increasing numbers of missions?
  How do you give operators the right information at the right
  moment? How do you handle the imagery, telemetry and flight
  records generated by every mission? And how do you turn all
  of that into structured information that infrastructure
  companies can actually use?

  That's what our Cloud team is building.

  We're looking for a Senior Full Stack Engineer to take
  ownership of significant parts of that platform.

  The opportunity

  You'll work across the stack, from the APIs, services and
  data models behind the platform, through to the interfaces
  used to plan and manage operations, review missions and work
  with the data captured in flight.

  You'll be solving problems such as:

  - Design, build and ship full stack features in React and
    FastAPI, owning them from problem statement through to
    production and the feedback that comes back from
    operations.
  - Build the control room and customer-facing interfaces:
    mission planning, live operational views, post-process,
    review and sign-off of captured data.
  - Develop the services behind them: APIs, data pipelines and
    storage for large volumes of imagery, telemetry and flight
    records.
  - Make the platform scale to continuous, concurrent operations
    across a national and international asset base.
  - Work directly with flight operations, autonomy and customer
    teams to turn real operational problems into the simplest
    thing that solves them.
  - Raise the engineering bar: testing, observability, CI/CD,
    code review, and the pragmatic architectural decisions
    that keep a small team fast.
  - Make the best use of AI tooling, both for code development,
    review, but also in agentic data workflows

  We're looking for someone who is genuinely comfortable
  across the stack rather than strongly front-end or back-end
  with limited experience on the other side.

  You'll work directly with flight operations, autonomy
  engineers, inspection teams and customers. If you want to
  understand a problem, you can talk to the person
  experiencing it.

  Because we're a relatively small engineering team, you'll
  also have real influence over what gets built, how it gets
  built and the technical decisions we make as we scale.

  What we're looking for

  You'll have substantial commercial full-stack engineering
  experience and a track record of building high-quality
  production software.

  You'll bring:

  - Strong React and modern TypeScript
  - Strong Python, ideally FastAPI
  - Good API design and relational data modelling
  - Experience with asynchronous systems
  - Experience with cloud infrastructure, containers, CI/CD and
    monitoring
  - Experience building systems that have scaled
  - Good engineering judgement — knowing where rigour matters
    and where it's better to ship, learn and iterate
  - An ability to take an ambiguous problem, understand what
    users actually need and own the solution

  You'll also be comfortable working with people who aren't
  software engineers. Here, that could mean pilots, aviation
  specialists, autonomy engineers and asset engineers.

  Experience with robotics, aviation, IoT, geospatial systems,
  real-time telemetry, large image or sensor datasets, AI/ML
  pipelines or safety-critical technology would be useful, but
  isn't essential.

  Why sees.ai?

  - Competitive salary and share options, you'll own a piece of
    what you build.
  - A serious technical problem with a real-world result, in a
    company that has already proved the hard regulatory part.
  - A small, senior team where your work is visible and your
    opinion counts

  We offer competitive salary and share options, hybrid
  working across our London office and HQ near Chichester, and
  support for training, conferences and professional
  development.

  How we hire

  - An introductory conversation about the role, sees.ai and
    what you're looking for.
  - A technical conversation with the Cloud team about systems
    you've built and the decisions behind them.
  - A practical exercise close to the actual work, discussed
    together rather than marked in isolation.
  - A final conversation with the wider team and leadership.

  Interested?

  Click the “I’m interested” button to apply, or email our
  careers team on recruitment@sees.ai if you would like a
  discussion before applying.
