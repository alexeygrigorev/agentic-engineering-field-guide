description: |
  As part of the M&S Software Engineering team, you’ll be
  joining a well-loved historic brand, working on products and
  platforms that support millions of customers and thousands
  of colleagues. With a strong investment in becoming a
  digital-first, engineering-led organisation, M&S is
  transforming the way technology enables our business and
  customer experiences across the globe.

  We’re looking for a Software Engineering Manager who
  combines strong technical judgement with a passion for
  building high-performing teams. In this role, you’ll lead
  empowered, multidisciplinary engineers to design, build,
  release and run robust software solutions, working closely
  with Product and Delivery teams to solve meaningful customer
  and business problems.

  This role sits within the International Pricing domain team,
  supporting M&S’s International business across stores and
  online markets outside the UK and Ireland. You’ll lead a
  team that is central to M&S’s ambitious global expansion
  plans, building the platforms and services that enable
  flexible pricing models across different markets and
  partners. This is a key role in creating scalable, adaptable
  pricing capabilities that help M&S respond to local market
  needs, support partner propositions and operate more
  effectively across international markets.

  This is an opportunity to help shape a best-in-class
  engineering culture, environment and team. If you’re excited
  by modern technology, large-scale impact and the chance to
  influence how engineering is done at M&S, this is a place
  where you can do some of the best work of your career.

  Due to high interest, this role may close earlier than
  advertised. We recommend applying as soon as possible.

  What You'll Do

  Your key accountabilities will include:

  - Build, mentor and lead a high-performing software
    engineering team, fostering a culture of collaboration,
    inclusion, innovation and continuous improvement while
    balancing people, priorities and delivery outcomes.
  - Oversee the planning, execution and delivery of software
    initiatives, ensuring alignment with business goals,
    customer outcomes and strategic priorities while
    proactively managing risks and dependencies.
  - Drive engineering excellence through the adoption of modern
    engineering practices, technical standards, cloud-first
    approaches and robust build pipelines that support
    maintainability, extensibility and scalability.
  - Ensure operational stability, resilience, security,
    performance and reliability across team-owned solutions
    while supporting continuous improvement and progress
    towards Elite DORA standards.
  - Partner closely with Product, Delivery, Design and
    Architecture teams to shape technical roadmaps, solve
    complex business problems and maximise the value delivered
    through shared platforms and modern technology solutions.

  Who You Are

  Your skills and experience will include:

  - A strong software engineering background, with experience
    across modern architectures, cloud platforms and scalable
    backend systems.
  - A proven track record of building, leading and developing
    high-performing engineering teams, creating an inclusive
    environment where people can thrive and grow.
  - Strong technical judgement across system design, software
    architecture and modern engineering practices, with a
    focus on quality, testing, reliability and operational
    excellence.
  - Excellent leadership, communication, analytical and problem-
    solving skills, with the ability to influence senior
    stakeholders and lead engineers and technical partners
    towards clear outcomes without over-prescribing solutions.
  - A DevOps mindset with a strong belief in "you build it, you
    run it", coupled with a servant leadership approach,
    strong ownership and the ability to navigate complex
    technical and organisational challenges.

  Desirable Experience

  - Knowledge of the retail domain would be advantageous but is
    not essential.
  - Exposure to pricing platforms, pricing strategy,
    international commerce, or large-scale business systems
    supporting multiple markets would be beneficial.
  - Experience working with modern cloud-native architectures,
    event-driven systems and enterprise integration patterns.

  Tech Stack

  Our team uses a range of modern technologies, including:

  - Java, Spring, Spring Boot and Micronaut
  - React, Next.js, TypeScript and Angular
  - Azure Cloud and Kubernetes
  - Kafka and IBM MQ
  - SQL Server, MongoDB and Redis
  - OpenTelemetry and Dynatrace

  What’s in it for you?

  Working at M&S means being part of something bigger –
  helping to deliver quality, value and service to millions of
  customers every day. We’re inclusive, fast-moving and always
  evolving, with a strong sense of purpose and a focus on
  doing the right thing.

  Here are just a few of the benefits that make working here
  even more rewarding:

  - 20% colleague discount on all M&S products and many third-
    party brands for you and someone in your household,
    available once you’ve completed your probation.
  - Competitive holiday allowance with the option to buy more.
  - Discretionary bonus schemes linked to your performance and
    ours.
  - Strong pension and life assurance to help plan for the
    future.
  - Tailored induction and training to support your development
    from day one.
  - Exclusive perks and savings through our M&S Choices portal.
  - Market-leading family policies, including parental, adoption
    and neonatal leave.
  - 24/7 wellbeing support, including virtual GP access and
    mental health services.
  - One paid volunteer day a year to support a cause that
    matters to you.

  Everyone’s Welcome

  We are ambitious about the future of retail. We’re
  disrupting, innovating and leading the industry into a more
  conscientious, inspiring digital era. We’re transforming how
  we work together and offering our most exciting
  opportunities yet. Marks & Spencer strives to be an
  inclusive organisation, trusted and admired by our
  colleagues, customers and suppliers. Join us and make change
  happen.

  We are committed to building diverse and representative
  teams, where everyone can bring their whole selves to work
  and be at their best. We support each other and work
  together to win together.

  If you feel you'd benefit from any support or reasonable
  adjustments during any stage of the recruitment process,
  please don’t hesitate to let us know when completing your
  application. This information will be picked up by our team,
  so we can try and put steps in place to help you be at your
  best through this process

