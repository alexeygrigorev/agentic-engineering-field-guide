  About the Role

  We’re looking for an experienced Software Engineer to join
  our growing engineering team. You’ll play a key role in
  designing and building robust, scalable systems and products
  that serve thousands (and soon millions) of users. This is a
  remote-first role, but you must be available during standard
  business hours (9am–5pm PT).

  You’ll be joining a high-caliber, fast-moving team where
  your ideas, autonomy, and initiative will be valued. Whether
  you’re optimizing infrastructure, refining user experiences,
  or shipping new features, your contributions will have
  immediate, visible impact.

  What You’ll Do

  - Architect, develop, and maintain production-level code
    across our backend and/or frontend systems
  - Collaborate closely with product, design, and other
    engineering teams to turn ideas into elegant
    implementations
  - Own features end-to-end, from conception to deployment and
    iteration
  - Help improve system performance, reliability, and
    scalability
  - Conduct thoughtful, constructive code reviews and
    participate in technical discussions
  - Contribute to technical documentation and process
    improvements
  - Stay current with emerging technologies and recommend
    relevant tools or frameworks

  What We’re Looking For

  - (backend, full-stack, or infrastructure)
  - Strong proficiency in at least one modern language (e.g.,
    Python, Go, JavaScript/TypeScript)
  - Experience with cloud services (AWS, GCP, or Azure), CI/CD
    pipelines, and containerization (Docker, Kubernetes)
  - Solid understanding of system design, architecture, and
    performance tradeoffs
  - Excellent communication and collaboration skills —
    especially in a remote environment
  - Ability to work independently, manage priorities, and
    deliver high-quality work on time
  - Enthusiasm for learning, shipping, and contributing to a
    mission-driven team

  Bonus Points If You Have

  - Experience with distributed systems or real-time
    applications
  - Familiarity with React or other modern frontend frameworks
  - Worked in early-stage or high-growth environments
  - Interest in AI, infrastructure, or developer tools

  Compensation & Benefits

  - Base salary: $210,000 / year
  - Signing bonus: $15,000 paid upon start
  - Equity: Potential stock option (RSU) grant
  - Remote-first team (U.S. based, PST hours required)
  - Medical, dental, and vision benefits
  - Generous PTO and flexible work hours
  - Learning stipend and career development support
  - Regular offsites and optional in-person collaboration in San
    Francisco

