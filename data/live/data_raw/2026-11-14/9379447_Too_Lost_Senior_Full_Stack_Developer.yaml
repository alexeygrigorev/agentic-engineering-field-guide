title: Senior Full Stack Developer
company: Too Lost
location: New York, USA
work_type: FULL_TIME
company_size: 60 Employees
description: |
  This New York based role reports to our CTO who is based in
  Reykjavík. We work hybrid and collaborate across timezones
  with our international development team.

  Too Lost is a music distribution company building and
  operating systems that handle music delivery, reporting,
  payouts, and internal operational workflows. The company
  runs a data-heavy, transaction-heavy environment where
  reliability, correctness, and pragmatic engineering
  decisions matter.

  The role is intended for an experienced engineer who can
  contribute independently, lead technical execution, and take
  ownership of refactoring and modernizing key services while
  continuing to ship product improvements.

  What You’ll Do

  - Lead the technical execution of full stack development
    across internal tools and platform features
  - Contribute hands-on across backend and frontend development
  - Take ownership of refactoring and restructuring existing
    services and workflows
  - Drive improvements in architecture, maintainability, and
    development practices
  - Mentor developers and contribute to building a stronger
    engineering team in Reykjavik and New York
  - Collaborate across a distributed team and ensure smooth
    execution across time zones
  - Maintain high standards for performance, reliability, and
    security in production systems
  - Additional projects and responsibilities as assigned

  What We’re Looking For:

  - 7+ years of professional software development experience
  - Can demonstrate strong hands-on full stack ability and prior
    technical leadership through real work (commercial or
    open-source)
  - Strong professional experience in full stack web development
  - Strong backend experience with modern server-side frameworks
    (Laravel experience is a plus, not a requirement)
  - Strong frontend experience with modern JS frameworks (Vue
    experience is a plus, not a requirement)
  - Solid understanding of relational databases, data modeling,
    and backend performance
  - Experience working in production systems where correctness
    and stability are important
  - Experience leading technical projects or guiding other
    developers
  - Ability to work independently, make sound technical
    decisions, and take ownership of outcomes

  Additional Skills We'd Love:

  - Experience refactoring or modernizing legacy systems while
    maintaining ongoing delivery
  - Experience working with financial, transactional, or payout-
    related systems
  - Experience designing APIs and internal services used across
    teams
  - Familiarity with background jobs, queues, and scalable
    system patterns
  - Experience working with distributed development teams

  Why Join Us?

  - Make an impact in a company supporting thousands of artists
    worldwide
  - Own mission-critical systems that power our core platform
  - Work hybrid from New York, with flexibility across timezones
  - Small, collaborative team with strong product focus
  - Competitive salary and benefits

  Salary range

  - $130,000 - $140,000 per year
