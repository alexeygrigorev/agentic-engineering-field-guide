description: |
  Software Engineer, Front-End

  STLabs is an AI service management platform that resolves
  employee requests end-to-end, grounded in a living model of
  the enterprise. This matters because we're able to resolve
  requests with full context - the people, systems, services,
  and policies that define how an organization actually runs.
  Requests that used to take days of back-and-forth resolve in
  minutes, right where employees already work.

  About the Role

  We are seeking a talented Front-End Engineer to join our
  growing engineering team. In this role, you’ll own the user-
  facing product: deliver polished, high-performance
  interfaces, leverage AI-driven tools to accelerate
  development, and partner with product and design to turn
  complex enterprise workflows into intuitive front-end
  experiences.

  - Build responsive, accessible, and scalable UIs using modern
    front-end technologies.
  - Develop and maintain a shared component library or design
    system, supporting consistency across the product.
  - Use AI-first tooling (e.g. AI-assisted code generation,
    automated refactoring, AI-assisted testing / linting /
    code review) to boost developer productivity and maintain
    high code quality. (Given our AI-savvy culture — this is
    core to the role.)
  - Collaborate closely with Product and Design teams to
    translate UX/wireframes into production-ready, user-
    friendly features.

  What We’re Looking For

  - Experience with realtime, streaming AI-first components.
  - Good understanding of UI/UX principles, and comfort
    collaborating with designers to implement
    wireframes/mockups.
  - Desire to embrace AI-augmented engineering workflows —
    comfortable exploring / adopting AI tools to accelerate UI
    development, refactoring, testing, or component generation



  What Makes Candidates Stand Out

  - Experience building conversational or chat-based
    applications, including managing complex multi-turn
    conversation state and dynamic message flows, similar to
    ChatGPT-style interactions.
  - Experience building or contributing to design systems /
    component libraries
  - Familiarity with performance optimization, accessibility,
    cross-browser support, and responsive design at scale
  - Experience working in a fast-moving startup / AI-driven
    product environment
  - Strong communication skills — able to articulate UI
    constraints, tradeoffs, and collaborate across cross-
    functional teams

  What We Offer

  - Build foundational product features for an AI-first
    enterprise platform
  - The opportunity to take ownership of critical systems that
    scale to millions of users
  - A culture that values craftsmanship, autonomy, and user
    experience
  - Competitive compensation, equity, and benefits package
  - Work from our Midtown, Manhattan office, where you’ll be
    side-by-side with the founding team in a supportive,
    collaborative setting. Our team works on-site five days a
    week. The location is easy to reach with plenty of public
    transportation options.

  As an equal opportunity employer, we don’t tolerate
  discrimination or harassment of any kind. Whether that’s
  based on race, ethnicity, age, gender identity, citizenship,
  religion, sexual orientation, disability, pregnancy, veteran
  status or any other protected characteristic as outlined by
  federal, state or local laws. The reasonably estimated
  yearly salary for this role at is: 160,000—230,000 USD.
