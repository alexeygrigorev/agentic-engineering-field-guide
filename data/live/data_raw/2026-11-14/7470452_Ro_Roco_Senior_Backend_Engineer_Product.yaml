description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role



  We are looking for a Senior Software Engineer to join the
  Patient Experience team at Ro. This is a backend, product-
  focused role. You will partner closely with Product, Design,
  Data, and other teams to define, build, and iterate on
  features that directly impact patient onboarding, care
  delivery, and insurance workflows.



  You’ll own backend systems that power critical patient and
  provider experiences — not just from a technical
  perspective, but from a product and business outcomes lens.
  You’ll refine ambiguous problems through solution design,
  implementation, experimentation, and iteration while
  ensuring the backend is performant and monitoring for real-
  world feature engagement and adoption.



  While this role is highly focused on backend engineering, we
  value engineers who understand how their systems drive user-
  facing experiences and who enjoy collaborating cross-
  functionally to deliver meaningful product outcomes.

  What You’ll Do:

  - Design and build scalable, reliable, and resilient
    distributed services using Python with FastAPI or Django,
    supporting critical clinical and operational workflows
  - Partner closely with product teams to shape feature
    requirements, define success metrics, and translate
    business goals into scalable backend solutions.
  - Operate as a domain owner — accountable not only for system
    reliability and performance, but for how your systems
    drive measurable product and operational outcomes
  - Own features end-to-end from technical discovery through
    launch and iteration, using data and feedback to
    continuously improve outcomes
  - Drive engineering excellence through best practices in
    testing, monitoring, observability, and performance
    optimization
  - Actively contribute to building the team’s architectural
    vision and technical roadmap
  - Collaborate on code reviews and technical design documents
    to ensure the consistent application of best practices
    across relevant domains
  - Participate in on-call rotations to ensure reliability of
    production systems

  What You’ll Bring to the Team:

  - 5+ years of software engineering experience
  - Experience architecting, designing and building scalable web
    applications and distributed systems
  - Proficiency with Python, relational databases, and
    frameworks like FastAPI or Django, with hands-on
    experience in metrics instrumentation and data-driven
    performance tuning leveraging Ro’s load testing
    infrastructure and tools like Datadog
  - Experience partnering closely with Product to scope and
    deliver user-facing features that drive measurable
    business impact
  - Proven track record of scaling complex, data-intensive
    backend systems through rapid growth on a high-traffic
    engineering organization, ensuring high performance and
    availability
  - Strong intuition for product tradeoffs — balancing speed,
    scalability, and long-term architecture
  - Deep understanding of distributed systems-data consistency,
    communication patterns, and service boundaries, backed by
    hands-on experience building and maintaining data-
    intensive production systems
  - Strong sense of ownership with the ability + desire to own
    technical roadmaps and refine ambiguous problems
  - Demonstrated ability to collaborate with other engineers and
    cross-functional partners to create the best possible
    products

  Bonus Skills:

  - Experience in telehealth or other highly regulated
    industries
  - Experience with decoupling monolithic applications into
    distributed asynchronous services

  We’ve Got You Covered:

  - Full medical, dental, and vision insurance + OneMedical
    membership
  - Healthcare and Dependent Care FSA
  - 401(k) with company match
  - Flexible PTO
  - Wellbeing + Learning & Growth reimbursements
  - Paid parental leave + Fertility benefits
  - Pet insurance
  - Student loan refinancing
  - Virtual resources for mindfulness, counseling, and fitness

  The target for this position ranges from $190,800 to
  $234,500, in addition to a competitive equity and benefits
  package (as applicable). When determining compensation, we
  analyze and carefully consider several factors, including
  location, job-related knowledge, skills and experience.
  These considerations may cause your compensation to vary.

  Ro is consistently recognized as a top workplace in Health
  Care, in New York, and for Women and Parents—earning more
  than 20 honors from Fortune, Great Place to Work, and PEOPLE
  since 2021. In 2025 alone, we ranked top 5 among medium
  workplaces in Health Care and New York, and top 50
  nationwide.



  At Ro, we believe that our diverse perspectives are our
  biggest strengths — and that embracing them will create real
  change in healthcare. As an equal opportunity employer, we
