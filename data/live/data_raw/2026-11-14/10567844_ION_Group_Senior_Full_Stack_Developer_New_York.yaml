description: |
  Lab49 is an award-winning specialist consultancy
  that creates bespoke technology in partnership with the most
  important companies in finance.   We were founded in 2002 to
  bring Silicon Valley solutions to Wall Street’s door. Since
  then, we have worked on successive waves of technological
  change, including distributed computing, high-speed
  automation, enterprise UX and digital distribution (for
  which Lab49 was among the first significant practices
  established on Wall Street), DevOps, cloud and data
  science.   



  Today, we are an established partner in financial markets,
  having delivered hundreds of projects for clients including
  all the world’s tier-one investment banks and many of the
  largest buy-side firms globally.  



  Being part of Lab49 means bringing your drive and creativity
  into an environment where your contributions will make
  immediate impact. Engineers will work in cross functional
  teams, consulting directly with our clients, shaping not
  only technical solutions to business problems but delivering
  them into production.



  Currently LAB49 is looking for a Senior Full-Stack Developer
  will play a critical leadership role on a key project for a
  strategic Lab49 client - a global asset management
  powerhouse. Working in a collaborative cross functional
  project team, with direct client-facing interactions, you
  will have an opportunity to lead a team of engineers and
  build modern digital products.

  What you’ll be doing:  

  - Partnering with our client to lead the design and build of a
    structured products trading platform using modern
    development technology and techniques. You will be
    responsible for managing engineering deliverables, and the
    relationships with other key contributors to deliver great
    software.
  - Design, document, and plan for the technical implementation
    and delivery of working software into production.
  - Act as a hands-on engineer and architect to support ongoing
    project work. Lead and actively participate in projects,
    serving as a role model for project teams and
    collaborating with other practices to ensure successful
    outcomes.
  - Partner with client counterparts and stakeholders to
    maintain and build relationships, maintaining a commercial
    approach. Develop strong relationships with clients as a
    strategic partner and technical advisor, contributing to
    expanding our footprint and securing follow-on work.

  What you should have: 

  - 8+ years of solid hands-on experience with Python or C#
    development.
  - Hands-on experience with React and modern front-end state
    management.
  - Extensive experience architecting solutions on AWS,
    including Terraform and Docker.
  - Proven track record operating effectively inside large,
    complex organizations (e.g., Tier-1 Investment Banks or
    Global Asset Managers).
  - Deep understanding of SQL and data persistence strategies at
    scale.
  - BS in Computer Science or equivalent experience.
  - Expert-level knowledge of, and strong demonstrated interest
    in, global financial markets and financial products.

   Why Lab49?

  Lab49 is an established partner for most financial
  institutions on Wall Street. You will gain exposure into a
  variety of environments, business domains, technologies, and
  people. Your ability to bring drive and creativity to the
  role will be the key component to success at Lab49. The
  broad and intense exposure to a variety of challenges
  accelerates your career growth, and Lab49’s structure is
  designed to enable you to learn and grow as an engineer and
  consultant.  





  Lab49/ION is committed to maintaining a supportive and
  inclusive environment for people with diverse backgrounds
  and experiences. We respect the varied identities,
  abilities, cultures, and traditions of the individuals who
  comprise our organization and recognize the value that
  different backgrounds and points of view bring to our
  business.

  Lab49/ION adheres to an equal employment opportunity policy
  that prohibits discriminatory practices or harassment
  against applicants or employees based on any legally
  impermissible factor.
