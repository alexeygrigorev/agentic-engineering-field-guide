description: |
  About Us

  At Prenuvo, we are on a mission to flip the paradigm from
  reactive “sick-care” to proactive health care. Our award-
  winning whole body scan is fast (under 1 hour), safe (MRI
  has no ionizing radiation), and non-invasive (no contrast).
  Our unique integrated stack of optimized hardware, software,
  and increasingly AI, coupled with the patient-centric
  experience across our domestic and global clinics, have
  allowed us to lead the change against “we caught it too late
  again".

  The Senior Full Stack Engineer II role is a senior technical
  leadership position responsible for delivering complex
  software solutions, driving technical strategy, and
  elevating engineering quality across teams. In this role,
  the engineer is expected to independently lead large,
  ambiguous, or mission-critical initiatives and coordinate
  work across multiple engineering groups and stakeholders.

  This role does not provide visa sponsorship. Applicants must
  be legally authorized to work in the United States at the
  time of hire and must not require employer sponsorship for a
  work visa (current or future).

  Help reshape the world through proactive healthcare while
  working with cutting-edge technology and high performing
  teams with deep expertise - join us to make a difference in
  people’s lives!

  What You’ll Do

  - Develop complex software solutions: Lead end-to-end delivery
    of large or ambiguous initiatives that span multiple
    systems or teams, leveraging AI-assisted coding tools and
    autonomous development workflows where applicable.
  - Own and lead projects: Take full ownership of project
    execution, from design through rollout, integrating
    agentic workflows and automated guardrails to ensure
    technical and business goals are met.
  - Provide technical guidance: Offer deep expertise to team
    members, supporting them through code reviews,
    architectural decisions, and best practices for
    collaborating with AI coding agents.
  - Mentor junior engineers: Coach less-experienced colleagues,
    helping them grow their technical, design, and problem-
    solving capabilities while effectively utilizing agentic
    tools.
  - Contribute to strategic planning: Participate in high-level
    planning discussions, informing the technical direction of
    key initiatives including the adoption of agentic SDLC
    practices.
  - Solve complex engineering problems: Independently diagnose
    and resolve the hardest technical issues in the domain,
    utilizing agent-driven debugging and novel solutions.
  - Influence technical direction: Play a meaningful role in
    shaping project- and team-level technical decisions and
    long-term architectural evolution toward modern agentic
    development patterns.
  - Ensure system reliability: Lead improvements in reliability,
    scalability, observability, and incident response; help
    define standards and processes that support operational
    excellence in automated and agent-driven environments.
  - Raise engineering quality: Improve engineering patterns,
    tooling, documentation, and processes that increase
    productivity and code quality across multiple teams,
    incorporating automated code review and refactoring
    agents.
  - Communicate at a senior level: Clearly articulate complex
    technical concepts to engineers, product managers, and
    leadership; serve as a trusted technical voice on modern
    software practices.
  - Manage ambiguity: Operate effectively in undefined or
    rapidly evolving situations, bringing clarity, structure,
    and direction for others, particularly in the transition
    toward agentic SDLC.

  What You’ll Bring

  - 7+ years of experience delivering complex software systems
    and solving technical challenges.
  - Strong backend experience architecting and building robust
    services using Python, Flask, and/or FastAPI.
  - Experience writing comprehensive backend tests (e.g.,
    Pytest) and ensuring strong test coverage.
  - Familiarity or decent frontend experience with frameworks
    like React, Next.js, and Typescript is a plus.
  - Ability to break down complex projects into components or
    milestones that other engineers can easily pick up.
  - Motivation to influence our engineering organization to
    level up the quality, reliability, and performance of the
    services we ship.
  - Demonstrated collaboration with co-workers on cross-
    functional teams.
  - Experience building consumer-facing applications and
    internal tools.

  Our Values

  First: we are Pioneers

  - Transforming healthcare requires divergent thinking, bias
    for action, disciplined experimentation, and consistent
    grit and determination to maintain momentum. This journey
    is as challenging as it is rewarding.

  Second: we are Platform-Builders

  - We’re always building foundations that allow us to achieve
    tomorrow more than we did today. We never lose sight of
    what’s ahead – in a mindset of ownership and duty to our
    mission.

  Above all: we are Patients

  - We could all be the next person who walks through our very
    doors, seeking clarity or peace of mind. We are proud of
    our impact on our patients’ lives, and we won’t stop till
    everyone can benefit from our work.

  What We Offer

  - An avenue to make a positive impact on people's lives and
    their health
  - We believe in preventative healthcare for everyone,
    including our team - Prenuvo provides free, whole-body
    scans to each team member
  - Growth opportunities are at the heart of our people journey,
    we’re doing big things with bright minds - there is no
    single path to success, it can be shaped along the way
  - Building strong relationships is at the core of everything
    we do - our team gets together each week to connect,
    share, and socialize
  - Recognizing time away to restore is vital to our wellbeing -
    we have a flexible vacation policy and we will encourage
    you to use it
  - Prenuvo offers a 401(k) retirement savings plan to eligible
    employees, allowing team members to make pre-tax
    contributions toward their retirement. While Prenuvo
    facilitates access to the plan, the company does not
    currently offer matching contributions.
  - We offer a comprehensive benefits package including health,
    dental, vision, including Mental Health coverage, to
    support you and your family
  - The base salary for this role ranges from $170,000-$185,000
    in local currency, depending upon experience and
    geographic location

  We are an equal-opportunity employer and value diversity at
  our company. We do not discriminate on the basis of race,
  religion, color, national origin, gender, sexual
  orientation, age, marital status, veteran status, or
  disability status.

  As part of the hiring process, successful candidates will
  undergo a background check in compliance to applicable
  federal, provincial, and state rules.

  Please be advised that official communication from our
  recruitment team will only come from our authorized domain
  [prenuvo.com]. If you are contacted by a recruiter, please
  ensure their email address ends with @prenuvo.com. We do not
  use third-party recruitment services or any other email
  domains for hiring purposes. If you receive communication
  that you believe to be fraudulent, please report it
  immediately to jobs@prenuvo.com.
