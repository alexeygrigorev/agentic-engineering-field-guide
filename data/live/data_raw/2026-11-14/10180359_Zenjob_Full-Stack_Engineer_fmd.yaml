description: |
  Please note: For this position, we are unable to offer visa
  sponsorship or relocation support. Applicants must already
  hold the legal right to work in Germany (e.g., EU/EEA
  citizenship or a valid residence/work permit).



  About us

  Zenjob is an AI-powered flexible staffing platform that has
  efficiently connected companies and temporary workers since
  2015. Companies use our platform to book ready-to-work staff
  in real time, while students use our app to find part-time
  jobs that conveniently fit around their studies. Over 40,000
  students and 1,000 partner companies from logistics, retail,
  and hospitality in all major German cities share our belief
  that good work is not a coincidence. It is the result of
  innovative technology and genuine commitment. Good work
  starts here.



  About the role

  As a Fullstack Engineer (f/m/d) you'll play a key role in
  shaping and building our product at Zenjob. Working across
  the full stack, including event-driven backend services and
  polished user-facing interfaces, you'll collaborate closely
  with product managers and stakeholders, set engineering
  standards, and mentor others along the way. If you thrive in
  a fast-moving environment and want to make a real impact on
  a product used by thousands of workers and businesses, we'd
  love to hear from you.



  How you will contribute

  - Design, develop, and own end-to-end features-from ideation
    and technical proposal through to production deployment
    and ongoing maintenance.
  - Build and evolve backend services and frontend applications
    using TypeScript and Java, leveraging gRPC as our primary
    service communication protocol
  - Collaborate cross-functionally with business, product and
    data to deliver high-value, high-reliability features.
  - Champion continuous value delivery by advocating for quality
    and elevating engineering practices.
  - Help drive architectural and process decisions, bringing
    your experience to bear on choices that affect the whole
    engineering organisation.
  - Mentor and support other engineers, fostering a culture of
    learning, feedback, and continuous improvement.
  - Enable the organisation through tooling, documentation, and
    shared libraries that raise the bar for contributions
    across the codebase.



  Who you are



  - You have a history of consistently delivering complex, high-
    impact initiatives E2E – from shaping the business case to
    collaborating cross-functionally towards the finish line
    and measuring results
  - You have a strong appreciation for observability - you
    understand the value of structured logging and distributed
    tracing in production systems.
  - You are collaborative and communicative, with the ability to
    clearly articulate trade-offs, influence technical
    direction, and work effectively with both technical and
    non-technical stakeholders.
  - You are self-driven and outcome-oriented, capable of leading
    complex initiatives from ambiguity to delivery with
    minimal guidance.
  - You are empathetic and inclusive, with a broad understanding
    of the different roles and functions within a product
    engineering team.



  What we offer

  - Innovative mission: Together we create something new. Work
    in a dynamic set-up where you learn a lot and your every
    idea is heard.
  - Unique team spirit: We can rely on each other blindly and
    celebrate all successes together as a team.
  - Vacation: Recreation and further education is important,
    which is why we offer 28 days of paid vacation (increased
    by 1 day for every 2 calendar years of service with us, up
    to a maximum of 30 days), 1 day of special leave for
    community service, 5 days of paid educational leave, and
    the possibility of unpaid leave
  - Hybrid working model: We love our brand new office in
    Prenzlauer Berg. But sometimes you need a little more
    flexibility. Zenjob’s flexible working model combines the
    best of both worlds, so you can work remotely up to 2 days
    / week (1 day, during the first 6 months, so we can
    guarantee you the best onboarding).
  - Dog-lover: If you have a dog, feel free to bring it with
    you. We don’t bite and always have a bowl of water in our
    range of drinks
  - Personal growth: Ongoing focus on your personal development
    (annual training budget of EUR 750, mentoring
    opportunities, constant career development conversations)
  - Healthy mind in a healthy body: With us you will receive a
    30 EUR Urban Sports Club grant to keep you fit. In
    addition, we have a small sports room in the office
    ourselves.
  - Always mobile: You will receive EUR 40 credit per month for
    NAVIT, a sustainable mobility tool for public transport,
    bike sharing and much more.
  - Legendary Events: Quarterly team events, winter and summer
    parties, budget for birthdays and anniversaries of our
    employees

  If this sounds good, then we’d love to find out more about
  you! Apply and send in your application.



  🎥 Watch our Office Tour video.



  We invite you to visit our careers page, follow our LinkedIn
  page and connect with us on Instagram.



  We are proud to be an equal opportunity employer. We are
  committed to judging every qualified individual on their
  ability, regardless of age, gender identity, ethnicity,
  sexual orientation, disability status, or religion. There is
  no need to add your photo and age to the application.
