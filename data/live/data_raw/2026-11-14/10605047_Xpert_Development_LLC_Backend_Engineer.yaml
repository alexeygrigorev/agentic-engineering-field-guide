  - Act as a senior technical leader, providing guidance on
    complex engineering and architectural trade-offs and
    shaping the overall technical direction.
  - Develop high impact software solutions to address complex,
    mission critical business problems.

  Requirements:

  - Deep experience designing and operating large‑scale,
    production‑grade backend systems, with a strong
    understanding of distributed systems.
  - Strong proficiency in Python and Go, applied to building
    reliable, scalable backend services.
  - Demonstrated experience building and owning software from
    0‑to‑1, taking systems from initial concept through
    production and ongoing ownership.
  - Proven ability to influence technical direction and
    architecture at a senior or cross‑team level.
  - Ability to clearly connect engineering decisions to business
    and product outcomes.

