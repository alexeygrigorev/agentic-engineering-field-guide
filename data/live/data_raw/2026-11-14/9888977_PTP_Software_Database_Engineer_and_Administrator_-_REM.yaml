  organization and are looking for bright, passionate, and
  committed professionals who strive to be the best at what
  they do.

  Responsibilities

  - Design, develop and administer:
    - Databases that support analytics and runtime applications
    - Web applications for IVR and call center software
    - Integrations to stateful IVR applications
    - Integration to components engineered for the cloud
  - Write and maintain SQL to make configuration changes and
    application enhancements
  - Participate in development and integration of call center
    analytics systems

  Requirements

  - 2+ years experience as a Database Administrator (DBA)
  - SQL (MySQL, Aurora DB, Redshift)
  - NoSQL and RDBMS
  - Java, Python or Go
  - Shell scripting
  - AWS Cloud based database development
  - Flyway, Liquibase or comparable tools
  - Git
