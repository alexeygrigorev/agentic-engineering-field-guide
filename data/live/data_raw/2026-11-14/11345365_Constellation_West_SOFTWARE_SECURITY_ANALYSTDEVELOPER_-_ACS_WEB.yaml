description: |
  Job Description and Tasks:

  Serve as Software Security Analyst and developer
  overseeing/managing the scanning for and resolution of
  application security vulnerabilities, as needed, while also
  performing Operation and Maintenance (O&M) software
  development activities. Work with the team and IRS personnel
  to ensure that application vulnerabilities are resolved
  prior to any software release and create plan of action and
  milestones for vulnerabilities that will not be resolved
  until a later release. Must understand a large call center
  environment and the impact on agents processing customers
  issues and work to improve the agent experience. Strong
  communication skills to interface with IRS personnel and
  express complex concepts into manageable actions.
  Schedule/host developer technical meetings, address
  issues/propose solutions, provide technical advice, optimize
  processes, develop work proposals for review/approval, keep
  Project Manager/Task Lead informed, and develop software
  code changes/code updates as a productive member of the
  software development team.

  Job Requirements/Required Skills:

  Minimum 12 years of software/web
  development/engineering/optimization using Object Oriented
  Programming, specifically full-stack J2EE (Java17 & 21
  required), JavaScript, Spring framework, Spring Boot/Join
  Faces, PrimeFaces, JQuery, Java Beans, and JSF, or
  equivalent. Experience with software development in
  environments utilizing ECLIPSE (2022 or later), RedHat
  Linux, Tomcat, HTML5, or equivalent. Hands-on experience
  working with security scan software (e.g., Trivy, SonarCube,
  Qualys, Nexus IQ, etc.) and vulnerability mitigation
  processes and incident tracking/management, Maven, CI/CD
  Pipelines, GitHub Actions, and OpenShift projects and
  container management. Knowledge of IBM mainframe components,
  including Verastream Bridge Integrator (VBI), CICS, and have
  strong understanding of mainframe transaction processing.
  Hands-on experience in support services, such as conducting
  unit testing, peer reviews, code check-in/-out procedures,
  requirements analysis, assess/document level of effort
  (LOE), drafting system technical documents (e.g., system
  design specifications, software user guides, process
  documentation, etc.). Strong analytical mindset for defect
  identification and its resolution, proactively assist with
  troubleshooting development/production server problems,
  networking and environment configuration.

  Desired Skills:

  Hands-on experience using tools/guidance, or equivalent,
  such as: Jira, Service Now, Selenium test script
  development, open source logging and iText APIs, IRS
  Enterprise Life Cycle (ELC), OneSDLC, IRM/IRS Security
  regulations, IRM 2.5 System Development, and 508 Compliance.
  Experience with networking fundamentals, development
  environments, and change control processes. Familiarity with
  web interfaces to mainframes, such as IBM Liberty, and
  knowledge of IBM Assembler is a plus.

  Education: Bachelor of Science in Computer Science or
  related discipline with a primary focus on software
  development/engineering is highly desired. Software
  development, security, networking, system administration
  certifications a plus.

  Security Clearance:

  Dept. of Treasury/Internal Revenue Service (IRS) Active
  Public Trust/Minimum Background Investigation (MBI)
  clearance required for this position or eligibility to
  acquire is mandatory.

