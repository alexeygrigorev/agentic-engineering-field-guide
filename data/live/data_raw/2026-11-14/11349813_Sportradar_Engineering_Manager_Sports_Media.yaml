description: |
  Company Description

  We’re the world’s leading sports technology company, at the
  intersection between sports, media, and betting. More than
  1,700 sports federations, media outlets, betting operators,
  and consumer platforms across 120 countries rely on our
  know-how and technology to boost their business.

  Job Description

  ABOUT US

  The Sports Media Team at Sportradar builds platforms and
  products that collect, curate, distribute, analyze, and
  personalize sports data and content. We hold exclusive data
  rights with top leagues including MLB, NBA, NHL, and NASCAR
  and deliver the fastest and most accurate live game data on
  the market.

  Our APIs power products from Apple, Google, Amazon, and
  thousands of other customers globally. Our Analytics
  Products and Broadcast Solutions are behind the stats and
  storylines seen by millions of fans watching the World
  Series, Super Bowl, and every game in between.

  We are seeking an Engineering Manager to lead a team of
  talented engineers building enterprise-grade, high-uptime
  sports analytics and broadcast tooling. This role balances
  people leadership and deep technical engagement. You will
  manage and grow your team while remaining hands-on enough to
  shape architecture, guide technical decisions, and maintain
  the high standards of data accuracy and software quality
  that our enterprise customers depend on.

  THE CHALLENGE

  People Leadership & Team Development:

  - Manage a team of software engineers, providing consistent
    1:1s, team retros, clear performance feedback, and genuine
    investment in each engineer's career growth.
  - Set clear expectations, document goals, and conduct
    performance reviews; connect individual career aspirations
    with team and product backlogs.
  - Mentor engineers at all levels, helping them grow both
    technically and professionally.
  - Foster a strong engineering culture built on collaboration,
    ownership, and continuous improvement.
  - Empower engineers to be creative problem-solvers while
    maintaining high standards of quality, reliability, and
    uptime.

  Technical Leadership & Architecture:

  - Provide hands-on architectural direction across the team's
    systems, facilitating key decisions around system design,
    data modeling, and service boundaries.
  - Drive the reduction of technical debt by identifying
    systemic risks, prioritizing remediation efforts, and
    balancing those efforts with feature development.
  - Participate meaningfully in design reviews, merge request
    reviews, and technical discussions.
  - Advocate for engineering best practices including
    reliability, observability, security, performance, agentic
    development, and maintainability at scale.
  - Ensure systems meet the uptime and data accuracy standards
    expected by enterprise customers.
  - Lead post-mortems and drive incident follow-through.
  - Leverage agentic development tools to increase engineering
    velocity while maintaining high standards of quality,
    readability, and architectural consistency.
  - Product Collaboration & Delivery Partner closely with
    Product teams to translate business goals into well-scoped
    and well-sequenced engineering initiatives.
  - Organize and maintain delivery swim lanes that provide
    engineers with clear priorities and focused work.
  - Own team-level delivery commitments, forecast accurately,
    communicate risks early, and consistently deliver high-
    quality software.
  - Balance feature development, platform investment, and
    technical debt while making trade-offs transparent and
    defensible.
  - Participate in cross-functional planning with Product,
    Design, DevOps, and Architecture teams to ensure alignment
    and clear ownership boundaries.

  ABOUT YOU

  You are a people-first engineering leader who enjoys
  building high-performing teams while remaining technically
  engaged. You thrive in fast-paced environments, care deeply
  about software quality and reliability, and are comfortable
  balancing long-term engineering investments with day-to-day
  delivery needs.

  Required:

  Engineering Management:

  - 3+ years of engineering management experience, including
    direct line management of software engineers.
  - Proven track record of growing engineers through coaching,
    performance management, and career development.
  - Experience partnering with Product Managers to manage
    backlogs, facilitate sprint planning, and deliver
    commitments in an Agile environment.
  - Comfortable navigating performance discussions directly and
    constructively.

  Technical Depth:

  - 6+ years of professional software engineering experience,
    with sufficient hands-on depth to engage credibly on
    architecture and code quality.
  - Experience designing and operating data-driven, high-uptime
    production systems, including microservices, RESTful APIs,
    and event-driven architectures.
  - Proficiency with SQL and NoSQL databases.
  - Experience working with high-throughput, low-latency
    production systems. Strong understanding of CI/CD
    practices, software development workflows, and AWS cloud
    infrastructure.

  Nice to Have Experience:

  - Working with sports data or real-time data products.
  - Experience in enterprise SaaS environments. Understanding of
    uptime, data accuracy, and SLA commitments in customer-
    facing products.
  - Experience with serverless technologies, including AWS
    Lambda, SQS, and Step Functions.

  OUR OFFER

  - The opportunity to lead and develop a team building products
    used by some of the world's most recognized sports, media,
    and technology organizations.
  - A highly collaborative and international environment with
    colleagues across multiple regions and disciplines.
    Ownership and influence over both technical strategy and
    team development.
  - Exposure to large-scale, real-time sports data systems
    powering products used by millions of fans worldwide.
  - The opportunity to work within one of the fastest-growing
    sports technology companies in the world.
  - A culture built on innovation, teamwork, continuous
    learning, and high performance.
  - Career growth opportunities within a global organization
    operating at the intersection of sports, media, and
    technology.

  OUR RECRUITMENT PROCESS

  - Initial Screening: A conversation with our Talent
    Acquisition team to learn more about your background and
    career aspirations.
  - Hiring Manager Interview: An opportunity to discuss the
    role, team, and leadership expectations in more detail.
  - Technical and Leadership Interviews: Meet key stakeholders
    and engineering leaders to explore your technical
    expertise, leadership approach, and collaboration style.
  - Final Discussions: Review mutual expectations and next
    steps. We aim to keep the process straightforward,
    transparent, and efficient while ensuring both you and the
    team have the opportunity to assess long-term fit.

  Pay Range: $180,000 - $200,000 gross per annum

  Sportradar intends to offer the selected candidate base pay
  within this range, dependent on job-related, non-
  discriminatory factors including but not limited to
  experience, qualifications, and location. Base pay is just
  one component of the Total Rewards that Sportradar provides
  to compensate and recognize employees for their work.
  Sportradar offers best-in-class benefits such as a
  comprehensive benefits package, performance bonus program,
  equity stock purchase and 401k contribution. Please consult
  with your recruiter to learn more as all benefits are
  subject to eligibility requirements.

