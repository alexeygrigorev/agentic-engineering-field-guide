description: |
  Alpha Financial Markets Consulting (Alpha) is a leading
  global consultancy to the financial services industry. We
  are a boutique management consulting firm that offers the
  world’s top industry players a competitive edge through our
  expertise and industry insight. Our team is of a uniquely
  high calibre and works across regulated financial markets,
  bringing deep expertise in insurance, alternative asset
  markets — including private equity, private credit,
  infrastructure and real estate — and other specialised
  financial sectors. This focus enables us to bring relevant,
  hands-on experience to our clients’ most important
  challenges.  We have our headquarters located the United
  Kingdom, as well as offices in major global financial
  centres across the United States, France, Netherlands,
  Luxembourg, Switzerland, and Asia.

  About the role

  We're looking for a Consultant to deliver data integration,
  migration, and general development work for our clients,
  primarily in the UK financial services and alternative
  assets sectors. You'll work hands-on across the delivery
  lifecycle — from scoping and design through to build, test,
  and deployment — with growing ownership of workstreams and
  increasing client-facing responsibility.

  Key Responsibilities

  - Design, build, and test data integration and migration
    pipelines, primarily on the Azure platform.
  - Contribute to solution design and technical documentation,
    translating client requirements into working deliverables.
  - Perform data mapping, transformation, validation, and
    reconciliation across source and target systems.
  - Develop and maintain application and integration code
    following good engineering practices (version control,
    code review, testing).
  - Support deployment and environment management, including
    Infrastructure as Code where applicable.
  - Troubleshoot and resolve data quality, performance, and
    pipeline issues.
  - Work directly with client stakeholders to gather
    requirements and demonstrate progress.
  - Support Senior Consultants and Managers on estimation,
    planning, and risk identification.

  Essential Skills & Experience

  - Typically 2–4 years' experience in data engineering,
    integration, or software development (adjust to your
    banding).
  - Strong hands-on experience with the Microsoft Azure data
    stack (e.g. Data Factory, Synapse, Azure SQL, Storage,
    Functions).
  - Proficiency in SQL and at least one general-purpose language
    (Python, C#, or similar).
  - Solid understanding of ETL/ELT patterns, data modelling, and
    data migration methodologies.
  - Experience with source control (Git) and CI/CD workflows.
  - Ability to work in client-facing delivery environments and
    communicate clearly with technical and non-technical
    audiences.

  Desirable / Nice to Have

  - Experience with Databricks and/or Snowflake.
  - Cloud development experience, particularly Infrastructure as
    Code (Terraform, Bicep, ARM).
  - Exposure to data orchestration tools, APIs, and event-driven
    integration.
  - Financial services, private equity, or alternative assets
    domain experience.
  - Relevant certifications (e.g. Azure Data Engineer Associate,
    Azure Fundamentals).

  What We Offer

  - Competitive base salary
  - Annual performance bonus tied to individual and company
    outcomes.
  - Comprehensive benefits package including private medical
    insurance, life assurance, and income protection.
  - Hybrid working model with flexible arrangements to support
    work-life balance.
  - Generous pension scheme with enhanced employer
    contributions.
  - Continuous learning budget and access to industry
    conferences, certifications, and training programmes.
  - 25 days annual leave plus bank holidays, with option to buy
    additional days.
  - Employee assistance programme and wellbeing support.
