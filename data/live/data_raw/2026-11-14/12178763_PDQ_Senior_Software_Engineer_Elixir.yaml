  Work Authorization and Sponsorship

  The majority of PDQ's full-time roles do not qualify for
  sponsorship of employment visas such as the H-1B visa. This
  applies to scenarios where a candidate might possess
  temporary work authorization during their schooling or after
  graduation (e.g., CPT, OPT), but would require H-1B visa
  sponsorship within a few years of employment to retain
  eligibility for employment.
