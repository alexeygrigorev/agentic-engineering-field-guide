description: |
  About PDQ PDQ, founded in Salt Lake City, UT, USA, makes
  device management simple, secure, and Pretty Damn Quick. IT
  teams use our products to reduce complexity, improve
  efficiency, and enhance control in their unique
  environments. We are backed by TA Associates and Berkshire
  Partners, top-tier global private equity firms.



  Our Core Values:

  - Honesty: You communicate transparently and build trust
    through your actions.
  - Ownership: You take responsibility for outcomes and follow
    through on commitments.
  - Collaboration: You value diverse perspectives and work
    effectively across teams.
  - Improvement: You actively seek opportunities to learn, grow,
    and innovate.

  Location

  - Remote, US - This position is open to candidates residing in
    any of PDQ’s open states: AR, AZ, CO, CT, FL, GA, ID, IL,
    IN, KY, MD, MI, MN, MO, NC, NH, OK, OR, TN, TX, UT, VA,
    WA, WI.

  PDQ is seeking a Senior Software Engineer to help build and
  scale intelligent, autonomous systems that transform how
  users interact with our products. In this role, you will
  develop AI-powered agents and workflows that can reason,
  plan, execute tasks, and interact with tools and systems to
  solve complex problems with minimal human intervention. You
  will work across the full software development lifecycle,
  combining strong software engineering fundamentals with
  hands-on experience in LLMs, agentic architectures, and AI-
  driven application development to bring practical,
  production-ready AI capabilities to life.

  What you'll be doing:

  - Build new features in Elixir and React with TypeScript while
    designing and operating agentic AI systems that perform
    multi-step reasoning, planning, and tool execution for our
    cloud-native SaaS product.
  - Work in a CI/CD environment, shipping code to production
    frequently following agile principles.
  - Collaborate with engineering teammates in the US and Romania
    on shared priorities.
  - Troubleshoot technical issues, from bugs to outages and
    customer support cases.
  - Research, prototype, and contribute to technical decisions.
  - Participate in constructive code reviews and continuous
    learning.

  We're looking for people who have:

  - Bachelor's degree in Computer Science, a related degree, or
    equivalent experience
  - 5+ years experience developing Elixir or Erlang based
    applications, with much of this experience in a
    professional setting
  - Experience with AI fundamentals and agentic workflows,
    including:
    - Autonomous or semi-autonomous agents
    - Multi-step reasoning, planning, and tool use
    - Feedback loops, memory, and stateful agents
    - LLM orchestration frameworks (e.g., LangChain, semantic
      kernels, custom agent frameworks)
    - Experience integrating LLMs via APIs (OpenAI, Anthropic,
      etc.)
    - Understanding of prompt engineering vs. system design
      tradeoffs
    - Experience handling hallucinations, guardrails, evaluation,
      and observability
  - Proven experience building intuitive, scalable UI/UX for
    SaaS products
  - Experience with agent-based or end-point management SaaS
    products is a plus
  - Familiarity with agile development and CI/CD workflows.
  - Experience with GraphQL for building and consuming APIs
  - Familiarity with Google Cloud Platform (GCP) and PostgreSQL
  - Exposure to observability and monitoring tools such as
    Prometheus and Grafana
  - Exposure to open-source development is a plus.

  Who you are:

  - Ownership: You take responsibility for projects, drive
    results, and deliver on commitments
  - Honesty: You demonstrate integrity, transparency, and
    ethical behavior in all interactions
  - Collaboration: You work effectively with cross-functional
    teams and foster a culture of teamwork
  - Improvement: You continuously seek opportunities for growth,
    innovation, and personal development
  - Passionate about delivering business value by applying your
    engineering skills
  - Experience building clean and simple solutions at scale
  - Possess strong analytic, technical, and problem-solving
    skills
  - Ability to communicate effectively through written or verbal
    medium
  - Knowledge of Git version control and branching strategies
  - Defensive security strategies for both client and server-
    side web systems
  - Strong ability to create lightweight proposals, diagrams,
    specifications, and other analyses from user requirements
  - Excellent debugging skills and pragmatic design experience
  - Experience with test-driven development and automated
    testing frameworks
  - Ability to read code and quickly make sense of an unfamiliar
    codebase
  - Ability to understand a problem space and make code changes
    safely

  - Experience with internal quality validation marker PDQ-
    Elixir-SIGNAL-

  PDQ Perks & Benefits:

  PDQ offers all of the great perks and benefits you'd expect
  from working at a very cool tech company, and even some you
  might not expect, including:



  - 4-Day Work Week
  - Equity
  - Managers who champion professional development
  - 100% Premium Coverage for medical, dental and vision for you
    and your dependents
  - 100% Premium Coverage for Short Term Disability, Long Term
    Disability, Life, and AD&D Insurance
  - Company Match of the first 6% of your employee deferrals
  - Flexible Paid Time Off Policy that treats you like the adult
    that you are
  - Health Savings Account (HSA) and wellness incentives
  - Quarterly Company Values Award (team member nominated)

