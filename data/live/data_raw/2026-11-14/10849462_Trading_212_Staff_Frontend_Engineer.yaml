description: |
  Our mission is to enable everyone to build wealth

  We reinvent how trading and investing work by creating
  exceptional products people love.

  That takes high standards, high velocity and engineers who
  own what they ship.

  Today, we serve over 6 million clients, with more than €38
  billion in assets under management. At that scale, frontend
  architecture, performance and product quality have material
  business consequences.

  Our frontend platform spans web and mobile: TypeScript,
  React, React Native and React Native Web in an Nx and pnpm
  monorepo, with TanStack Query, Zustand, Playwright, Detox
  and Jest. Around 95% of our code is reused across web and
  mobile.

  About the role

  Staff Frontend Engineers shape architecture and engineering
  direction across product teams while remaining close to the
  code. Your scope will include shared libraries, platform
  capabilities, developer tooling and difficult product-system
  problems.

  This is not a people-management role. Its leverage comes
  from technical judgement, credible execution and making
  other engineers and teams more effective.

  What you’ll do

  - Set direction for frontend architecture across React, React
    Native and the shared monorepo.
  - Own cross-team problems in platform capabilities, shared
    libraries, design-system foundations, tooling and
    developer experience.
  - Lead decisions on boundaries, abstractions, state and data
    flow, performance, testing and migration strategy.
  - Diagnose systemic rendering, bundle, runtime and release-
    quality problems and create durable fixes.
  - Remain hands-on where implementation, prototyping or
    technical investigation is the fastest way to create
    clarity.
  - Partner with product, backend engineering and QA on risks
    and decisions that cross team boundaries.
  - Mentor senior engineers, raise review quality and make sound
    frontend judgement easier to reproduce across teams.
  - Balance standardisation with team autonomy, avoiding
    platform work that creates more friction than leverage.

  What you need to have

  - Evidence of architectural or platform impact across multiple
    frontend teams.
  - Deep ownership of complex production systems built with
    React or React Native and TypeScript.
  - Strong judgement in application boundaries, shared
    libraries, state management, performance and migration
    design.
  - A track record of improving developer effectiveness,
    reliability or product quality through durable mechanisms.
  - Practical experience diagnosing performance and correctness
    problems across web or mobile systems.
  - The ability to influence technical direction through
    evidence, clarity and trusted execution rather than title.
  - Clear communication that helps teams act on complex
    technical decisions.
  - Strong engineering and product judgement, including knowing
    when not to introduce a new abstraction.

  Staff scope is assessed through ownership, judgement and
  sustained organisational impact—not years of experience or
  familiarity with every technology listed.

  What to expect

  - Recruiter conversation
  - Code Review
  - Experience Deep Dive
  - Managerial interview

  Your recruiter will explain each stage clearly and follow up
  after every conversation.

  Bring your ambition to Europe’s fastest-growing mobile
  broker! We thank all applicants, but only candidates
  selected for interview will be contacted. All personal data
  of applicants is protected by law and treated with strict
  confidentiality.
