description: |
  About Kickoff

  Kickoff is on a mission to increase access to preventative
  health. We are the first to offer personal training covered
  by health insurance, democratizing access to life-changing
  coaching while reducing medical costs for our health
  insurance partners. We combine the best of AI with the best
  of highly credentialed human coaches to create something
  greater than the sum of the two parts.

  The Role

  We’re looking for a Product Engineer to help us build the
  future of personalized wellness. We’re looking for
  incredible full stack engineering skills, but we also want
  to see that you operate at the bleeding edge of technology.

  The recent advances in AI tools enable a single individual
  to make a much bigger impact than ever before. Consequently,
  we’re looking for someone with experience leveraging the
  latest cutting-edge AI tools to build delightful software,
  tackling product and design as well as engineering
  challenges.

  Sometimes we’ll look for you to solve ambiguous, tricky
  customer problems soup to nuts with the latest tools. Other
  times, you’ll tackle more traditional engineering
  challenges, leveraging AI developer tools and usually
  incorporating AI-powered features. It will never be dull,
  nor easy.

  This is an opportunity to own massive chunks of our product,
  ship things people love, and shape the direction of a
  mission-driven company at an inflection point.

  What you'll do:

  - Use AI tools (Cursor, Windsurf, Lovable, etc.) to design,
    build, and ship solutions faster than ever before
  - Leverage the tools to not only build but debug and improve
    our codebase over time
  - Evangelize cutting edge tools and AI across the company
  - Tackle challenging human problems like:
  - Recommending workouts that get more personalized over time
  - Suggesting meal log feedback for our coach to provide that
    actually drives sustained behavior change for the client
  - Identifying trends in wearable data that impact client
    sleep, workouts, and mood
  - Talk to customers and coaches to identify pain points and
    opportunities
  - Collaborate with our team to shape product strategy and user
    experience
  - Contribute to a tight-knit, in-person team obsessed with
    driving real impact for our users

  You might be a fit if you:

  - Are obsessed with fitness, nutrition, and preventative
    health
  - Are intrinsically motivated by the opportunity to help
    people improve their health
  - Have strong full stack engineering skills
  - Are especially skilled in in React
  - Have 3+ years in software engineering roles
  - Have shipped AI-powered features and know how to test &
    measure them
  - Have experience building solutions end to end with cutting
    edge AI tools (in side projects or your own startup, for
    example) and can show us what you’ve built
  - Think in systems, but care about pixels – product-minded and
    design-sensitive
  - Have a startup mindset: low ego, high agency, big vision
  - Are excited for an in-person role
  - Bonus: You’ve been a founder and/or are  active in the
    tech/startup community
industries:
