description: |
  About Humanloop

  Large Language Models and AI more generally are the next
  computing platform. Millions of developers will be building
  with this technology and at Humanloop you'll have a chance
  to work at the frontier and shape the future.

  You'll get the chance to work really hard on a problem that
  matters alongside super-smart people who are passionate
  about what they do. The environment is fast-paced with new
  features being shipped every week or even every day. The
  customers we get to work with are themselves inspiring AI
  startups who are also trying to use this amazing new
  technology to build products and services that were
  previously science fiction.

  About the role

  A Frontend Product Engineer is customer-obsessed, full stack
  software engineer who can delivery a full product experience
  with a focus on the frontend.

  We’re a small, smart and hard working team, working in a
  very fast moving space at the frontier of AI. It's crucial
  that you can quickly work throughout the stack to deliver
  product end-to-end while caring deeply about solving
  underlying customer needs. Meaningful impact is guaranteed.

  It doesn’t matter what languages and tools you know when you
  join us, but it does matter that you can write clean,
  effective code and craft elegant solutions. We aim for a
  clean, simple modern stack, which is currently:

  - Python backend (FastAPI, Postgres)
  - TypeScript frontend (Next.js, React, Tailwindcss)
  - AWS for most of our infrastructure

  About you

  - You care deeply about customer needs and solving them with
    product.
  - You're excited by our mission and the potential of machine
    learning and artificial intelligence.
  - You are able to, or want to be able to, work at every level
    of the stack.
  - You’re excited by being one of the first employees in an
    early-stage company where you can have autonomy and
    impact.
  - You want to grow. The success of our company is a function
    of the people in our team. Your growth rate will be
    directly causal to Humanloop's growth rate. We spend a lot
    of time thinking about each other’s success paths.
  - You get excited about learning new things, writing blog
    posts and going to conferences to talk about all things
    product and engineering.
  - You'll create components and design systems that scale
  - You'll have good taste for when we build something in house,
    and where existing tools are appropriate
  - You hold yourself and the rest of the team to a high bar and
    design experiences that are not just functional, but
    delightful to our users
  - You are a product leader who comes up with great initiatives
    and product ideas, and not just someone who takes a
    feature and make it "functional".
  - You communicate your thoughts and decisions clearly and
    proactively, and talk to users around the world
    constantly, knowing that their expectation may differ from
    your intuition.

  Experience

  We think that people with amazing ability can come from all
  sorts of backgrounds, not necessarily prestigious schools or
  companies. You primarily need to prove that you can write
  excellent, clean code and care deeply about building great
  product. You can demonstrate this through your own projects,
  OSS contributions or experience at other companies. When
  looking at your contributions, we value quality over
  quantity.

  Offices in London and San Francisco

  We find that in person time allows us to move faster, learn
  from each other and have more fun. Everyone is in the office
  on Tuesdays and Wednesdays. On other days you can choose to
  work from home or in the office. Our London office has most
  of product and engineering, and our new SF office is
  primarily focused on GTM.

  Technology

  Our current stack is

  - A Python backend with pytorch for our deep learning
    framework
  - Next/React for our frontend
  - AWS for most of our infrastructure

  We're building software tools to help developers and
  founders evaluate how well their LLM apps are working and
  improve them through finetuning and experiments. By using
  Humanloop, companies can build much more defensible products
  on top of models like GPT-3.
