description: |
  Our Mission:

  Omnea is the agentic operating system for procurement.

  Procurement touches every pound a business spends, yet
  requests still stall for weeks and approvals get lost in
  inboxes. Our AI-first platform changes that: our agents
  capture requests, route approvals, onboard suppliers, flag
  risk and track every renewal, while anyone in the business
  can ask a question and get an answer grounded in their own
  company’s data. Buying becomes painless for everyone,
  procurement gets a seat at the table, and our customers have
  saved more than 100,000 hours of manual work so far.

  Companies like Spotify, PayPal, T. Rowe Price, JustEat,
  Adyen and S&P Global run procurement on Omnea. We’re backed
  by $75M from Khosla Ventures, Insight Partners and Accel,
  and we’ve been named the UK’s number one startup in the
  Startups 100, ranked 11th on Sifted’s 2026 list of Europe’s
  fastest-growing companies, and recognised as one of Fast
  Company’s Most Innovative Companies.

  Talent density matters more to us than almost anything else.
  We keep the bar high in every team, so everyone here has
  real ownership and real impact. Our team is full of former
  founders and operators who’ve scaled unicorns, and we’re
  looking for people who want to do the best work of their
  careers alongside them.

  Find out more about the team and life at Omnea here.

  What we're looking for

  We're looking for an ambitious and talented Senior
  Engineering Manager to join Omnea, the UK's #1 Startup in
  2026, as part of our Engineering leadership team.

  As we grow from tens to hundreds of enterprise customers and
  through 10x revenue growth in the next 2-3 years, you'll
  play a crucial role in building and leading the best
  Engineering function in its category. You'll be responsible
  for multiple teams, ensuring we ship high-quality solutions
  while maintaining the velocity a fast-growing environment
  demands. You'll operate with high autonomy, collaborating
  closely with other EMs, Team Leads, and Product to drive
  real impact.

  What you’ll do

  Build and lead high-performing teams:

  - Lead multiple engineering teams, fostering a culture of
    technical excellence and continuous improvement
  - Drive engineering best practices, quality standards, and
    high performance
  - Mentor and develop engineers, helping them grow their
    careers and impact
  - Collaborate with Product, Design, Team Leads and other key
    stakeholders on team structures and deliveries to ensure
    optimal outcomes

  Drive technical excellence:

  - Implement and refine engineering processes that scale
  - Facilitate architectural decisions that impact multiple
    teams
  - Champion quality improvements across teams while maintaining
    high velocity
  - Ensure robust monitoring, observability, and incident
    response processes

  Shape technical product strategy:

  - Partner with Product leadership to define and execute our
    technical roadmap
  - Balance technical debt, feature development, and system
    reliability with other deliverables
  - Ensure customer feedback drives technical priorities

  Teams and products you might end up working on:

  - Accounting and Goods Receipting - ensuring procurement and
    finance teams have the right information and tools to
    operate accurately, automatically, and at scale
  - Insights and Reporting - deep, complex custom visualisations
    bringing together AI and data to surface meaningful
    insights and context across the platform
  - Sourcing - building the tools that find the right suppliers,
    shape the right deals, and make sure the best option is
    already in play before a request is even created
  - Workflow Orchestration - the configurable backbone of our
    systems that accurately model company operations,
    underpinning a single source of truth
  - And many more areas we’re actively starting or expanding
    upon!

  About You

  Leadership Experience:

  - You have 8+ years of software engineering experience, with
    3+ years managing engineering teams
  - You've successfully managed multiple teams simultaneously
    (typically 2-3 teams / 12-20 engineers)
  - You've demonstrated success in fast-moving, ambiguous
    environments, particularly in rapid-growth periods
  - Ideally, you have experience as an Engineering Manager at
    multiple companies, including at least one successful
    Series A+ SaaS company

  Technical Excellence:

  - Strong technical background with hands-on experience in
    modern web technologies
  - Deep understanding of distributed systems, cloud
    architecture (preferably AWS), and scalability challenges
  - Experience with our stack (TypeScript, React, AWS
    Serverless) is a plus, but not required

  Track Record of Impact:

  - Strong track record of successful project delivery in fast-
    paced environments
  - Proven history of improving team velocity and quality
  - Experience scaling engineering teams through rapid growth
  - Experience implementing engineering processes that scale
    effectively at pace
  - Experience working directly with customers and translating
    their needs into technical solutions

  Leadership Style:

  - You're data-driven but know when to trust intuition
  - You're comfortable making decisions with incomplete
    information
  - You excel at collaboration and influence across teams and
    stakeholders
  - You have a track record of growing and developing
    engineering talent

  Nice to haves that really stand out to us:

  - Track record of successful product launches in B2B SaaS
  - Experience with procurement / finance systems
  - History of contributions to engineering communities

  You can learn more about Engineering at Omnea and our hiring
  process via our R&D Candidate Hub here.

  At Omnea, we embrace diversity. To build a product that's
  loved by everyone, we're best served by a team with all
  sorts of backgrounds, experiences, and perspectives. We
  encourage you to apply even if your experience doesn't quite
  match the full job spec! And regardless of your race,
  religion, colour, gender, or anything else! If you think you
  could be a good fit for Omnea, please reach out.

  A few things to note:

  - We offer competitive geo-localised benefits, and you can
    check out our UK Benefits Package here and our US Benefits
    Package here.
  - We work Tuesdays, Wednesdays & Thursdays in-person at our
    offices. At this early stage of our company life-cycle
    it's important to us that we get this together-time, and
    you can read more about why we believe this is a winning
    move here
  - We're commercial, ambitious and we don't pretend otherwise!
    We're actively seeking folks looking to make the most of a
    career-defining opportunity, with the hunger to be part of
    building something really impressive. You can see our
    values here and our Omnea Future Founder's fund here!
  - We sometimes use AI note-takers to help us transcribe
    interview notes, so we can be more present in your
    interview. If you'd like to opt out of us using automatic
    transcribers, please note this in the free text field in
    your application, otherwise we'll take your application as
    confirmation that you're happy for us to use notetakers
    (whether added to video calls or in the background).

  We are proud to be recognised for both our culture and
  product, and we are just getting started. Join us as we
  grow!

