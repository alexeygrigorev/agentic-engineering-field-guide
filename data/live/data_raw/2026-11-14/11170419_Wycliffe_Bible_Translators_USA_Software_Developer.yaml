description: |
  Job Title

  Software Developer

  Location

  Global

  Position Type

  Volunteer

  Job Description

  A Software Developer is responsible for using their
  knowledge of programming languages to design software
  programs. Their duties include meeting with clients to
  determine their software needs, coding and testing software
  to ensure functionality, and updating software programs to
  refine components like cybersecurity measures and data
  storage capacities.

  Major Responsibilities:

  - Design, develop, and deploy software applications, new
    features, and defect fixes.
  - Design and develop unit tests and perform code reviews
  - Work with team leader to collaborate, review, and deliver
    high quality software applications
  - Participate as an integral and enthusiastic part of the
    team, exhibiting ownership, follow-through, initiative,
    awareness, and effective communication with peers and
    management.
  - Work with the team around a cohesive product roadmap

  Minor Responsibilities:

  - Analyze software requirements by consulting with the user
    community
  - Support user community with developer-level support
  - Write technical reference documentation for the new software
  - Participate in regular project status, planning,
    partnership, and strategic meetings
  - Be available to travel to meet with the larger development
    team at least once per year
  - Be available to travel biannually to the Language Technology
    Conference
  - Participate in professional conferences and meetings

  Knowledge, Skills, and Abilities:

  - A servant heart attitude
  - Demonstrated skills in software development and algorithms
  - Demonstrated passion for programming and solving complex
    problems
  - Demonstrated user interface design skills
  - Good interpersonal skills of communication
  - Good organizational skills
  - The ability to quickly analyze and learn a large existing
    codebase
  - The ability to make decisions in a timely manner
  - The ability to generate multiple solutions to the problem
  - The ability to quickly pick up technical concepts
  - The ability to work both with a team and independently, and
    to multitask effectively

  Education and Experience:

  Software Developers should have experience in software
  engineering and a good understanding of the software
  development lifecycle. Bachelor’s degree in computer science
  or equivalent work experience is preferred, but we care more
  for a heart and mind that are always learning.

  Training and Orientation:

  Will complete the initial IT Software Department training
  program and relevant portions of IT Orientation.

  Weekly Hours

  40
