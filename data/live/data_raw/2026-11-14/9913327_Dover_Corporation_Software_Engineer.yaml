description: |
  Company Overview

  Dover is building the marketplace for startup experts.

  We connect high-growth startups with experienced operators
  across recruiting, HR, legal, and more. These are leaders
  who know what great looks like and deliver real business
  outcomes. Experts are trusted business partners who work
  directly with founders to build and scale companies.

  As AI transforms how work gets done, the need for
  experienced operators who can drive execution, exercise
  judgment, and own outcomes has never been greater. Dover
  enables these experts to plug into the most ambitious
  startups exactly when they’re needed most.

  Dover isn’t an agency, a firm. or a consultancy. Dover is a
  marketplace where startups and expert operators meet,
  collaborate, and build lasting working relationships.

  Startups come to Dover to find and partner with exceptional
  operators through our marketplace.

  Since Dover launched the marketplace in mid-2024, it has
  grown to support over 300 of the strongest early-stage tech
  companies in the world.

  About the role

  We’re looking for a product-minded software engineer to join
  a small, fast-moving team building Dover’s core marketplace
  and ATS.

  This is not a role where you’ll simply be handed tickets.
  You’ll come up with product ideas and own problems end-to-
  end. Everything from shaping ideas to shipping and iterating
  in production. You’ll work closely with the rest of the team
  to move quickly, make decisions, and continuously improve
  the product.

  If you’re excited about autonomy, ownership, and building
  alongside a tight-knit team, this role is for you.

  Responsibilities

  - Own features end-to-end: from idea → design → implementation
    → launch → iteration
  - Work closely with teammates to make fast, high-quality
    product decisions
  - Bring strong product instincts and contribute to what we
    build
  - Ship quickly and continuously improve what’s in production
  - Push back on ideas and approaches when you have a better
    perspective
  - Collaborate deeply with a small, highly engaged engineering
    team
  - Constantly learn, upskill, and raise the bar for the team

  Requirements

  - You have a few years of experience building and shipping
    software
  - You have product taste and care about user experience and
    outcomes
  - You’re opinionated and willing to challenge ideas
    constructively
  - You’re autonomous and don’t need to be told exactly what to
    do
  - You’re excited to grind alongside a small, ambitious team
  - You’re open to feedback and value collaboration
  - You want to grow quickly and push your own limits

  How We Work

  We’re a small, highly collaborative team that operates with
  a lot of ownership and trust:

  - We stay in constant sync. We’re on Slack throughout the day:
    calling each other, sharing progress, and unblocking
    quickly.
  - We run a daily standup. Every day, we share what we shipped
    yesterday and what we’re driving forward today.
  - We work in a Kanban style. There’s always a clear view of
    what’s in progress, what’s next, and what needs attention.
  - We build the roadmap together. Anyone can propose ideas,
    shape them, and push them forward. The best ideas get
    prioritized.
  - We self-select into work. People raise their hand for
    projects they’re excited about and take full ownership of
    delivering them.
  - We move fast and expect quality. We ship quickly, but we
    care deeply about product quality. High throughput and low
    bugs are both non-negotiable.
  - We challenge each other. We push on ideas, give direct
    feedback, and aim for the best outcome.
