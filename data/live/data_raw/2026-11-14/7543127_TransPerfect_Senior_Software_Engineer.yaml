description: |
  TransPerfect Is More Than Just a Job… Our greatest asset is
  our people, and nothing is more important to us than
  ensuring that everyone knows that. Each of our 100+ offices
  has its own individual identity, and each also has its own
  unique rewards.

  Who We Are:

  TransPerfect is an established company with a start-up
  culture seeking creative entrepreneurial people like you to
  join our team. We’re

  seeking a Senior Software Engineer to join our global team
  to be responsible for ensuring the integrity, reliability
  and maintenance of

  our internally developed software products from conception
  to release. If you’re ready to join a growing company and
  make an

  immediate impact, we want to hear from you!

  What You Will Be Doing:

  - Perform responsive software development and integration,
    within an agile development process
  - Design, build, and maintain efficient, reusable, and
    reliable code
  - Support our software lifecycle, to include design,
    development and testing
  - Work closely with users to provide personalized software
    support as needed
  - Ensure the best possible performance, quality, and
    responsiveness of applications
  - Identify bottlenecks and bugs, and devise solutions to
    mitigate and address these issues
  - Help maintain code quality, organization, and automation
  - Testing and evaluating new development technologies
  - Documenting application support and operational procedures

  Who We Are Looking For:

  - 6-10 years of experience
  - Understanding of and ability to develop in DotNet.
  - Extensive knowledge of C#, LINQ, MS SQL, Entity Framework
    and related technologies
  - Ability to use version control software such as GIT.
  - Understanding of web service protocols such as Rest, API
    design for extensibility and integration
  - Experience debugging complex applications
  - Experience with Agile development project management
    methodologies
  - Azure/AWS knowledge a plus

  Where Your Career Is Going:

  At TransPerfect, there are a lot of growth opportunities.
  The successful candidate will be ambitious and motivated
  with the ability to

  learn quickly. If you’re ready to join a growing company and
  jumpstart your career, we want to hear from you! All
  departments offer

  career growth and development that can combine your skills,
  interest and experience. We encourage our employees to have
  a

  continuous dialogue with management about growth
  oppportuinties throughout your tenure with the company.

  End your job search and find your career at TransPerfect
  #careersNOTjobs.

  Why TransPerfect:

  For more than 30 years, we have honed a culture where all
  kinds of ideas are shared and new ventures are not only
  welcomed, but

  also encouraged. In this fast-paced environment, employees
  are intellectually stimulated so they can grow alongside the
  organization.

  From Intern to President, we believe that every single
  employee should have a voice and contribute to the amazing
  services we offer

  our clients.

  We also offer a comprehensive benefits package including
  medical, dental, and vision insurance, 401k matching,
  membership to child-

  care providers, and other TransPerks. You even get your
  birthday off because let's face it, we're stoked that you
  were born.

  TransPerfect provides equal employment opportunity to all
  individuals regardless of their race, color, creed,
  religion, gender, age,

  sexual orientation, national origin, disability, veteran
  status, or any other characteristic protected by state,
  federal, or local law

  For more information on the TransPerfect Family of
  Companies, please visit our website at www.transperfect.com.
