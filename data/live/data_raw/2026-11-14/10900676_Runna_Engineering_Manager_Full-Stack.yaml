description: |
  We're putting together a talented team to build the #1
  training platform for Runners

  We help everyday runners become outstanding by building an
  incredible app providing world-class training, coaching and
  community for everyone, whether you're improving your 5k
  time or training for your first marathon.

  We’re growing extremely fast! In November 2023 we closed a
  $6.5M funding round led by JamJar with participation from
  Eka Ventures, Venrex and Creator Ventures. In 2024, we were
  selected by Apple as one of three global finalists for the
  iPhone app of the year, reflecting the innovation and impact
  of what we’ve built & in 2025 we were acquired by Strava!

  Our ambition is huge: to become the go-to global leading
  training platform for millions of runners everywhere. We’re
  growing with purpose and looking for people who want to
  build something meaningful with lasting impact. With the
  recent acquisition by Strava accelerating our journey, now
  is a really magical time to join. 🚀

  What You’ll Be Doing

  We’re looking for an Engineering Manager to lead a high-
  performing team of engineers at Runna. You’ll be responsible
  for a medium-sized team of ICs (roughly 4–8+ engineers) and
  will independently guide that team to deliver meaningful
  business outcomes across a product or platform area.

  This is a people leadership role first, grounded in strong
  technical judgement. You’ll partner closely with Product,
  Design, and Engineering peers to align goals, navigate
  ambiguity, and ensure your team can deliver high-quality
  work at pace. You’ll be expected to independently manage all
  aspects of people leadership, while creating the conditions
  for engineers to grow, experiment, and do the best work of
  their careers.

  You’ll sit on the Train Team where you will work closely
  with our modelling teams to integrate features that are core
  to Runna’s mission (think adapting plans around holidays and
  B races, supporting new cutting edge plans, and building in-
  app experiences around our AI/ML tooling).

  - Lead, support, and grow a medium-sized team of engineers,
    creating the clarity, context, and accountability needed
    for the team to do its best work.
  - Own team delivery for a product or platform area, driving
    execution from planning through release and ensuring work
    is aligned to business goals.
  - Partner closely with Product, Design, and other Engineering
    teams to align priorities, manage dependencies, and
    coordinate work that affects other teams.
  - Independently lead through open-ended or ambiguous problems,
    identifying risks, proposing solutions, and driving
    resolutions without heavy guidance.
  - Encourage experimentation and thoughtful risk-taking,
    creating space for exploratory work and creative solutions
    where it adds value.
  - Hold engineers accountable for high-quality technical
    designs and implementations that result in performant,
    scalable, secure, and maintainable systems.
  - Coach engineers and emerging leaders, providing feedback,
    mentorship, and support while deliberately delegating
    opportunities for others to step into leadership.
  - Independently manage all aspects of people management,
    including goal setting, performance reviews, career
    development, promotions and more.
  - Create a team environment built on psychological safety and
    inclusion, where people feel supported, challenged, and
    able to contribute fully.
  - Communicate company context clearly and effectively, helping
    the team understand how their work connects to wider
    company strategy and goals.
  - Participate in and drive organisation-level initiatives that
    improve how we build, plan, hire, and collaborate across
    engineering.
  - Partner with Recruiting and interviewers to calibrate
    assessments, make strong hiring and levelling decisions,
    and build a diverse and talented team for the long term.
  - Track delivery, unblock work, and improve team effectiveness
    through healthy processes, strong planning, and continuous
    improvement.

  We follow a flexible hybrid model that translates to more
  than half of your time on-site - 3 days per week in Runna's
  office based in London, UK.

  What You’ll Bring To The Team

  - 5+ years of professional experience in software engineering,
    including meaningful experience in technical leadership
    and/or engineering management.
  - Experience leading and managing engineers in a fast-paced
    product environment, ideally owning a team through
    planning, delivery, and people development.
  - Strong track record of delivering complex projects end-to-
    end, especially in cross-functional environments with
    evolving priorities or ambiguity.
  - Ability to align stakeholders across engineering, product,
    and design, and to coordinate work effectively where
    multiple teams are involved.
  - Strong technical judgement, with the ability to raise the
    bar on architecture, design, and implementation quality
    without needing to be the primary coder on every project.
  - Excellent communication skills, with the ability to
    translate company context into clear team direction and
    surface risks early.
  - Comfortable working in a highly skilled, fast-paced
    engineering team. In 2024, we shipped:
    - 99 mobile app releases (iOS and Android)
    - 443 API releases
    - 237 modelling backend releases
  - Technical fluency across modern product engineering
    environments. Experience with TypeScript/JavaScript, React
    Native, AWS cloud environments, and serverless
    architectures would be especially valuable.
  - A strong advocate for modern engineering practices,
    including:
    - Iterative development, continuous deployment, and test
      automation
    - Knowledge sharing, pair programming, and collaborative
      design & development
    - Shared code ownership and cross-functional product team
      collaboration

  Bonus Points If You:

  - Have experience leading teams working on consumer mobile
    products, especially React Native apps at scale
  - Have delivered impactful work across the full stack, from
    mobile to backend services and cloud infrastructure
  - Are confident improving CI/CD pipelines, release processes,
    and developer productivity
  - Have experience with AWS services and serverless
    architecture patterns
  - Have hands-on experience with SwiftUI or native mobile
    development
  - Thrive in autonomous, high-growth environments and can bring
    clarity without heavy direction
  - Have a personal interest in health, fitness, or sports
    technology

  Our Tech Stack

  Check out our Tech Radar, which we are constantly iterating,
  and below you can find a small reflection of our current
  tech stack:

  Frontend:

  - React Native (iOS and Android)
  - Typescript
  - GraphQL (Apollo Client)
  - Fastlane
  - SwiftUI (Apple Watch)
  - Maestro E2E tests

  Backend:

  - Serverless (AWS)
  - Lambdas (NodeJS & Python)
  - AWS AppSync
  - DynamoDB, S3, SQS, SNS, EventBridge, SageMaker
  - Snowflake

  All the other good stuff:

  - Sentry
  - GitHub Actions
  - Intercom, Mixpanel
  - RevenueCat
  - App Store Connect / Play Store
  - Google Tag Manager

  Salary and Benefits

  We’re offering a salary of £110,000 - £122,000 per year,
  depending on experience, plus participation in Strava's
  long-term incentive (stock) programs.

  We’re also committed to continually evolving our benefits to
  support you as we grow. Here is a brief overview what we
  currently offer in the UK 🇬🇧

  - 🏢 Flexible working – we typically spend 3 days a week
    together in our Vauxhall office
  - 🏝️ 25 days holiday, plus bank holidays
  - 📱Free Runna & Strava subscriptions for you and 3 of your
    friends (get ready to be your friends fave person or save
    them for holiday presents!)
  - 🧘 Headspace membership
  - 💸 Money every year to spend on gear, events and the gym!
  - 🏥 Private health insurance with Bupa and workplace pension
    scheme
  - 💖Modern Health is a mental wellness platform and app that
    combines technology with professional support to improve
    mental well-being and reduce stress
  - 🥕Carrot fertility support - this benefits provider can
    provide inclusive fertility, hormonal health, and family-
    forming benefits to our global employee population and
    takes the burden off what we know can be a stressful
    process.

  Please see more info on our amazing benefits here: Benefits
  at Runna

   Please let us know if there’s anything we can do to better
  accommodate you throughout the interview process - this can
  be from scheduling interviews around childcare commitments
  to accessibility requirements. We want you to show your best
  self in the process, so please speak to your Talent Partner!
