job_id: 11505576
title: Senior Software Engineer II - Mobile, iOS
company: Compass
location: New York, USA
work_type: FULL_TIME
company_size: 4,000 Employees
description: |
  At Compass, our mission is to help everyone find their place
  in the world. Founded in 2012, we’re revolutionizing the
  real estate industry with our end-to-end platform that
  empowers residential real estate agents to deliver
  exceptional service to seller and buyer clients.

  We are looking for an experienced iOS engineer to help
  Compass build a platform that makes the home buying or
  selling experience delightful. You will be one of the
  technical leaders in your immediate team. You will work with
  other engineers and your Product and Design counterparts to
  take projects from idea to done with a high degree of
  autonomy and ownership. You will be responsible for
  understanding Product requirements and the customer problems
  they are aiming to solve, distilling them into manageable
  subparts that can be divided across other engineers on the
  project.

  During a project’s execution, you will act as a leader
  ensuring any technical questions and trade offs are
  considered pragmatically, with a well-reasoned and
  understood solution being executed upon. You will guide more
  junior engineers with technical problems, ensuring that they
  follow best practices from an engineering and operational
  excellence perspective. Your influence won’t end once a
  project ships: you will be relied upon by Product and Design
  to give an engineering perspective on how we can iteratively
  improve a product to better benefit our customers. Outside
  of product-driven projects, you will work with other
  engineers to determine how to push our platform forward,
  devising engineering-led initiatives that ensure we can work
  quickly and efficiently while maintaining a high standard of
  operational excellence. You will also act as a mentor for
  more junior engineers, helping them grow from both a
  technical and career perspective.

  What you will do:

  - Work in a startup-like environment building agile products
    and services
  - Collaborate closely with engineers on your team, engineers
    on other teams, as well as your product and design
    counterparts to successfully launch projects which solve
    real-world customer problems
  - Act as a strategic partner to Product and Design, using
    technical insights to influence the product roadmap and
    proactively suggesting architectural changes that enable
    new categories of user experiences
  - Guide the team to make technical trade offs necessary to
    bring product initiatives to fruition, weighing different
    approaches and arriving to a recommended solution,
    detailing its pros and cons
  - Independently define, decompose, and lead delivery of
    complex projects, may lead other engineers
  - Perform code reviews, design reviews, and write high quality
    tests
  - Have a strong stance and advocate for efficient, scalable,
    and extensible approaches that solve technical problems in
    a manner that stands the test of time
  - Hold yourself and the team to a high standard of code
    quality and operational rigor, ensuring that code is well-
    tested, and your systems have appropriate monitoring,
    alerting, and runbooks implemented
  - Become the subject matter expert for one or more services in
    your domain
  - Create clear and concise documentation (diagrams, service
    descriptions, decisions, runbooks)
  - Identify and remove bottlenecks to address inefficiencies in
    the developer experience
  - Oversee and mentor junior engineers on the team, building
    their technical skills and ensuring that they understand
    best practices around engineering and operational
    excellence

  What we look for:

  - BS in CS or equivalent practical experience
  - 8+ years of professional iOS development experience
    building, architecting, and maintaining production-grade
    applications shipped to the App Store. The ideal candidate
    possesses deep expertise in modern Swift practices,
    including SwiftUI and Swift Concurrency, along with a
    strong grasp of scalable mobile architecture and the Apple
    deployment ecosystem.
  - Ability to collaborate with Product, Design and Engineering
    stakeholders to implement solutions which surprise and
    delight our customers
  - Master Computer Science fundamentals and iOS design patterns
    and best practices
  - A sheer eye for design and attention to detail, the products
    you build should not merely be functional but should take
    in context and anticipate our customer’s needs in a
    beautiful way.
  - Experience leading the development of a project from
    planning to release, dispatching work among a team,
    mentoring and guiding junior engineers
  - Experience with AI tools
  - Experience integrating with RESTful server-side services
  - Experience with Scrum/Agile development methodologies
  - Excellent verbal and written communication skills
  - Passion about mentoring and helping more junior engineers to
    grow

  Compensation: The base pay range for this position is
  $176,000-$196,100; however, base pay offered may vary
  depending on job-related knowledge, skills, and experience.
  Bonuses and restricted stock units may be provided as part
  of the compensation package, in addition to a full range of
  benefits. Base pay is based on market location. Minimum wage
  for the position will always be met.

  Perks that You Need to Know About:

  Participation in our incentive programs (which may include
  eligible cash, equity, or commissions). Plus paid vacation,
  holidays, sick time, parental leave, and recharge leave;
  medical, tele-health, dental and vision benefits; 401(k)
  plan; flexible spending accounts (FSAs); commuter program;
  life and disability insurance; Maven (a support system for
  new parents); Carrot (fertility benefits); UrbanSitter
  (caregiver referral network); Employee Assistance Program;
  and pet insurance.



  Do your best work, be your authentic self.

  At Compass, we believe that everyone deserves to find their
  place in the world — a place where they feel like they
  belong, where they can be their authentic selves, where they
  can thrive.  Our collaborative, energetic culture is
  grounded in our Compass Entrepreneurship Principles and our
  commitment to diversity, equity, inclusion, growth and
  mobility. As an equal opportunity employer, we offer
  competitive compensation packages, robust benefits and
  professional growth opportunities aimed at helping to
  improve our employees' lives and careers.

  Notice for California Applicants

  Los Angeles County Fair Chance Notice
