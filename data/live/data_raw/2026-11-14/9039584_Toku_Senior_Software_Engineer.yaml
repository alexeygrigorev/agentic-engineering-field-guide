job_id: 9039584
title: Senior Software Engineer
company: Toku
location: New York, USA
work_type: FULL_TIME
company_size: 44 Employees
description: |
  About Toku

  Toku enables companies of any size to compliantly compensate
  their employees with any asset, through any payment rail,
  anywhere in the world. Toku is a global employment and
  payroll infrastructure for token compensation. We power
  stablecoin and token payroll for some of the largest
  companies in crypto, integrating with custody providers,
  enterprise HR/payroll systems, and blockchain networks
  across 100+ countries. We are a small team that ships fast,
  measures progress daily, and builds with AI agents as a
  default.

  The Role

  You will take ownership of entire product surfaces from day
  one. Not tickets. Not components. Whole products. You will
  talk to customers, identify problems, design solutions,
  build them with AI tools, ship them, and iterate based on
  what you learn. Every day.

  You have strong opinions about what makes software easy to
  use. You think about the product from the customer's
  perspective first, but you also understand system
  architecture well enough to build things that hold up in
  production. You carry both product taste and technical
  depth.

  You are already building with AI. Claude Code, Codex,
  Conductor, or whatever works for you. These are core to your
  workflow, not experiments. You direct agents, review their
  output, and take full responsibility for what ships.

  Ambiguity does not slow you down. When the problem is
  undefined and the path is unclear, you figure it out, make
  smart bets, and start building.

  You are not the only person shipping code on this team.
  Engineers and Non-engineers use AI tools to build alongside
  you. You will review their work, provide clear feedback,
  explain technical concepts in plain language, and help raise
  the quality of everything that goes out the door.

  What We Are Looking For

  - Demonstrated experience shipping full-stack production
    software with real users
  - Daily use of AI coding tools (Claude Code, Codex, Cursor, or
    similar) as your primary workflow, not supplementary
  - Strong product instincts and the ability to look at a
    feature from the customer's perspective
  - Solid understanding of system architecture: API design, data
    modeling, cloud infrastructure, and production tradeoffs
  - Track record of end-to-end ownership: finding problems,
    building solutions, shipping them, standing behind the
    result
  - Comfort in ambiguous environments where the problem,
    solution, and path forward are all undefined
  - Ability to explain highly technical concepts in plain
    language and review code from contributors with varying
    skill levels
  - Clear, direct communication in async and remote contexts
  - You must be able to come into Manhattan on any day to meet
    with our CEO, who is based there. The role is remote, but
    you must be physically located near the NYC metropolitan
    area.
  - Experience with TypeScript, Python, React, Node.js, or
    similar modern stacks
  - Familiarity with agentic workflows: orchestrating AI agents,
    agent-driven CI/CD, MCP integrations
  - Background in fintech, payroll, HR tech, or
    blockchain/crypto infrastructure
  - Experience on small, high-output teams where daily shipping
    is the norm
  - Experience engaging directly with enterprise customers

  What Sets This Role Apart

  - You own products, not tasks. The scope of your ownership is
    limited only by your ability to execute.
  - AI is how we build. Every engineer ships production code
    with AI agents daily. If you are already working this way
    and want a team that matches your pace, this is the place.
  - Progress is measured daily. We do not wait for sprint
    reviews or quarterly check-ins. You ship, demo, and
    iterate in a rhythm measured in days.
  - Everyone here builds. Non-engineers ship code alongside you.
    Your role is to elevate quality across the board. If you
    only want to work with other senior engineers, this is not
    the right fit.
  - Ambiguity is the default. There are no detailed playbooks
    for what we are doing. The people who succeed here are
    energized by that.

  How To Apply

  Toku is an equal opportunity employer. We encourage
  candidates from all backgrounds to apply, especially those
  who bring strong fundamentals, product instincts, curiosity,
  and a bias toward building.
