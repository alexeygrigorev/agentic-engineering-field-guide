description: |
  About Juniper Square

  Private markets are one of the largest, most complex, and
  most underserved corners of global finance. Our mission at
  Juniper Square is to unlock their full potential. We’re the
  Operations Partner trusted by 2,300+ GPs, unifying
  technology, data, and fund administration services into a
  single platform that helps GPs move faster, make better
  decisions, and scale with precision. With $300B+ under
  administration and 700,000+ LPs on platform, we’ve built the
  scale to match our ambition. And with JunieAI, our purpose-
  built AI platform, we’re reimagining how private markets
  operate, embedding intelligence across every workflow.
  Founder-led since 2014, backed by $350M+ in funding, and now
  1,000+ employees strong, we’re building a company designed
  to shape the future of private markets for decades to come.

  Our culture is built for people who want to do ambitious,
  meaningful work alongside exceptionally talented teammates.
  We think like owners, move with urgency, and take pride in
  solving hard problems that truly matter to our customers and
  the future of private markets. We believe the best ideas
  come from open debate, deep collaboration, and diverse
  perspectives, which is why we believe transparency is the
  default and feedback makes us stronger. If you’re energized
  by high standards, rapid growth, and the opportunity to help
  define a category at a pivotal moment, come join us!

  Juniper Square offers employees a variety of ways to work,
  ranging from a fully remote experience to working full-time
  in one of our physical offices. We invest heavily in
  digital-first operations, allowing our teams to collaborate
  effectively across 27 U.S. states, 2 Canadian Provinces,
  India, Luxembourg, and England. We also have physical
  offices in San Francisco, New York City, Mumbai and
  Bangalore for employees who prefer to work in an office some
  or all of the time.

  About your role

  As a Senior Software Engineer at Juniper Square, you're a
  hands-on individual contributor who designs, builds, and
  operates production systems powering core workflows for
  institutional financial clients. You bring deep technical
  expertise to your team, drive complex projects
  independently, and collaborate closely with Staff engineers,
  product, design, and QA to ship reliable, well-designed
  systems.

  You'll join the Platform team, building the foundational
  infrastructure layer that powers all AI work at Juniper
  Square, both customer-facing (GPX) and internal automation.
  Every AI initiative at JSQ runs on top of this platform,
  spanning AI Gateway & Infrastructure, Governance & Security,
  Retrieval & Data Access, and Agent Framework.

  What you'll do

  Build & Operate Production Systems

  - Design, build, and ship production-quality systems, APIs,
    and services - from foundational platform capabilities to
    customer-facing product experiences
  - Own projects end-to-end: translating requirements into
    technical designs, implementation, testing, deployment,
    and ongoing iteration
  - Build reliable, scalable, and observable systems that
    deliver value to customers and enable other engineering
    teams to move faster
  - Own the production health of the systems you build,
    including monitoring, troubleshooting, performance,
    reliability, and issue resolution
  - Build reusable infrastructure, frameworks, tooling, and
    developer experiences that enable teams across the
    organization
  - Improve engineering velocity and operational quality through
    automation, documentation, and continuous improvements

  Drive Technical Excellence

  - Contribute to technical design for complex projects,
    evaluating tradeoffs and proposing pragmatic
    implementation plans
  - Partner with product, design, and engineering to translate
    requirements into well-designed technical solutions
  - Help identify and reduce technical debt, reliability risks,
    and friction in the software development lifecycle
  - Collaborate with Staff and senior engineers to establish
    reusable patterns and raise engineering standards
  - Participate in code reviews, design reviews, debugging,
    incident response, and operational support

  AI Fluency & AI-Native SDLC

  - Use agentic coding tools and AI-assisted development as a
    primary part of your workflow, deliberately choosing where
    AI versus traditional software is the right tool
  - Critically evaluate AI-generated code for correctness, edge
    cases, and regressions, shipping quality output regardless
    of how it was produced
  - Build or integrate AI/LLM-powered capabilities in your
    domain where they add real value (e.g., evaluation
    frameworks, RAG pipelines, agentic workflows), with clear
    human-in-the-loop boundaries
  - Contribute to the team's evolving practices around AI-
    accelerated development, testing, and code review

  Collaborate Cross-Functionally

  - Work closely with product, design, QA, and cross-functional
    partners to meet timelines and align solutions to business
    goals
  - Provide clear, accessible technical context to both
    technical and non-technical stakeholders

  Domain Expertise

  - Grow into a subject-matter expert with a deep understanding
    of the data, workflows, and customer needs specific to
    that space

  Qualifications

  Required

  - 7+ years of experience in backend and/or full-stack software
    engineering
  - Strong backend engineering experience with Python and
    frameworks such as FastAPI, Flask, Pyramid, or Django
  - Experience with relational/NoSQL databases, including schema
    design, query optimization, and data modeling
  - Experience with cloud-native technologies such as AWS,
    Docker, and Kubernetes, and infrastructure as code
  - Strong understanding of CI/CD, observability, and operating
    services in production
  - Comfort working full-stack when the problem calls for it
    (TypeScript/React experience a plus)
  - Ability to break down complex technical problems and deliver
    pragmatic, maintainable solutions
  - Strong ownership mindset, with the ability to drive projects
    independently while collaborating effectively across teams
  - Clear communication skills, with the ability to explain
    technical tradeoffs to engineering and cross-functional
    partners
  - Hands-on experience with AI-native development tools (e.g.,
    Cursor, Augment), and demonstrated AI Fluency: a
    deliberate point of view on when AI is (and isn't) the
    right tool, adapted code review practices for AI-generated
    code, and safeguards against over-reliance on AI tooling
  - Bachelor's degree in Computer Science or equivalent work
    experience
  - Hands-on experience building or integrating AI/LLM-powered
    systems in production (e.g., RAG pipelines, agent
    frameworks, evaluation workflows, guardrails, prompt/tool
    orchestration, or model observability)
  - Comfort operating in ambiguous, fast-evolving technical
    territory where best practices and patterns are still
    being established

  Nice to Have

  - Background in financial services or fintech
  - Experience with API gateway/infrastructure, security &
    governance tooling, retrieval and data-access systems, or
    agent frameworks at production scale

  At Juniper Square, we believe building a diverse workforce
  and an inclusive culture makes us a better company. If you
  think this role sounds like a fit, we encourage you to apply
  even if you don't meet every qualification.

  Compensation

  Compensation for this position includes a base salary,
  equity, and a variety of benefits. The U.S. base salary
  range for this role is $175,000 - $220,000 and the Canadian
  base salary range for this role is $165,000 - $210,000 CAD.
  Actual base salaries will be based on candidate-specific
  factors, including experience, skillset, and location, and
  local minimum pay requirements as applicable.

  Benefits include:

  - Health, dental, and vision care for you and your family
  - Life insurance
  - Mental wellness coverage
  - Fertility and growing family support
  - Flex Time Off in addition to company-paid holidays
  - Paid family leave, medical leave, and bereavement leave
    policies
  - Retirement saving plans
  - Allowance to customize your work and technology setup at
    home
  - Annual professional development stipend

  Your recruiter can provide additional details about
  compensation and benefits.
