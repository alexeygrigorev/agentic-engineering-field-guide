description: |
  This is a remote position.

   Backend Engineer



  We are partnering with an exceptionally well-capitalized,
  early-stage AI infrastructure startup to find a foundational
  engineering leader. Backed by a syndicate of world-renowned
  venture capital firms and prominent industry angels, this
  team is building sophisticated AI memory systems that solve
  deep enterprise problems. This is not a thin wrapper
  application; you will be engineering novel infrastructure
  that allows large language models to securely reason over
  massive, complex, and unstructured corporate data.




  The product already has serious market traction. The
  platform is actively deployed with a major multinational
  enterprise counting tens of thousands of employees,
  alongside a rapidly expanding roster of massive design
  partners. You will join an elite, tight-knit group of
  roughly seven engineers, working directly with the founders
  to scale a live, incredibly complex system.


   Core Responsibilities



  - Drive product features completely end-to-end, taking high-
    level problem statements through architectural design,
    backend implementation, and production deployment.
  - Architect and deploy advanced AI agents capable of reliably
    parsing and reasoning over massive datasets from complex
    enterprise environments.
  - Establish the engineering standard for the company by making
    critical decisions regarding data modeling, API
    development, distributed systems architecture, and
    internal tooling.
  - Operate with unrestricted autonomy to own high-risk, high-
    reward initiatives without micromanagement or hand-
    holding.
  - Partner seamlessly with the founding team to translate
    complex customer requirements into robust technical
    infrastructure and directly influence the broader product
    roadmap.







    Requirements Ideal Candidate Profile



  - You possess over five years of dedicated experience in
    backend or platform engineering within high-performing,
    heavily scaled technical organizations.
  - You thrive in highly autonomous, early-stage environments
    where you set the technical direction rather than waiting
    for instructions.
  - You bring deep technical fluency in Python, SQL, API
    development, and designing distributed systems.
  - You have a proven track record of acting as a true owner of
    your domain, successfully steering ambiguous, high-impact
    projects from conception to successful launch.
  - Prior experience as a founder or proven success building RAG
    systems and LLM agents in a production environment is
    considered a massive advantage.








    Benefits Compensation and Benefits



  - Base salary ranges heavily from $150,000 to $280,000 USD,
    complemented by highly aggressive, founding-level equity
    grants.
  - Comprehensive health insurance coverage.
  - Fully paid premium fitness club membership.
  - Daily complimentary meals and a dedicated transportation
    stipend.
  - Highly flexible paid time off to ensure you can recharge
    when needed.
