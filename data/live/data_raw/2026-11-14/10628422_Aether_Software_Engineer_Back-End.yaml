description: |
  Software Engineer, Aether (London)

  About Aether

  Aether is building a comprehensive AI-driven platform for
  the built world. Our core software is used by solar ,
  roofing and heat pump companies to deliver advanced 3D
  modeling, simulation, quoting, and financing tools – all in
  one powerful interface. We combine deep technical rigor with
  real-world utility, leveraging physics-based modeling, AI,
  and scalable infrastructure.

  Founded by alumni of UC Berkeley, École Polytechnique, and
  ETH Zurich, we bring experience from leading energy and
  software companies.

  Aether is a recent graduate of YCombinator, and has raised
  over $6M in funding.

  Check us out: https://www.aethergtm.com

  About the Role

  We’re looking for an experienced Backend Engineer to take a
  lead role in developing our core platform. You’ll work
  closely with the founders and product team to architect and
  build high-performance APIs, structure complex business
  logic, and contribute to systems that simulate solar energy,
  manage 3D projects, and power customer proposals.

  This isn’t a feature-factory job – you’ll own major parts of
  the backend, help shape system design, and solve difficult
  problems from day one. Ideal candidates are scrappy, fast,
  and thoughtful: you write elegant code, fix problems at the
  root, and care about building software that lasts.

  Who You Are

  - You thrive in early-stage, fast-moving environments.
  - You are technically sharp, deeply curious, and own outcomes.
  - You know when to ship fast and when to be rigorous.
  - You love solving real-world problems and optimizing complex
    systems.

  Required Qualifications

  - 3+ years of backend experience in a production environment
  - Strong proficiency in Python and Django (or equivalent
    frameworks)
  - Deep understanding of relational databases and data modeling
    (PostgreSQL preferred)
  - Experience building and scaling REST APIs
  - Familiarity with cloud platforms (GCP preferred),
    containers, CI/CD
  - Fluent in English, with excellent written and verbal
    communication

  Nice to Have

  We don’t expect you to check every box, but the more of
  these you bring, the better:

  - Background in engineering, physics, math, or computational
    science
  - Experience with asynchronous tasks (Celery, task queues),
    Redis, and performance optimization
  - Familiarity with solar energy systems, CAD/3D modeling, or
    simulation software
  - Strong debugging skills and architectural instincts
  - Comfort working with modern frontend stacks (React/Next.js)
    or APIs consumed by them
  - Experience building B2B SaaS tools, quoting systems, or
    real-time apps
  - Contributions to infrastructure/DevOps, Pulumi, or
    observability tools

  Why Join Aether

  - You’ll work directly with experienced founders on ambitious
    technical challenges
  - You’ll be part of a mission-driven company shaping the
    future of energy and the built world
  - You’ll have autonomy and impact from day one – we ship fast
    and iterate constantly
  - London-based office, with flexibility for hybrid/remote if
    you're a strong independent operator

  How to Apply

  Send us your resume and a short note about why you're
  interested. Bonus if you include links to past work (GitHub,
  portfolio, blog, etc). We move quickly.
