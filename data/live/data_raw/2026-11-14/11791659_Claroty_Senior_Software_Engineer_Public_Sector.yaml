description: |
  Description

  We’re growing and looking to hire a Senior Software Engineer
  who embodies our core values: People First, Customer
  Obsession, Strive for Excellence, and Integrity.

  About the Company:

  Claroty Public Sector LLC is rapidly expanding to secure the
  mission-critical systems that our society’s safety and
  stability depend on. We are looking for mission-driven
  professionals who want to join a high-growth team dedicated
  to protecting critical infrastructure and ensuring essential
  services remain resilient and uninterrupted.

  About the Role

  We are seeking a Senior Software Engineer to join our
  dedicated Public Sector R&D organization. In this role, you
  will bridge the gap between complex Federal customer
  environments and our core engineering teams.

  You will be embedded directly within our Cyber-Physical
  Systems (CPS) Platform team, dividing your focus between
  high-priority incident troubleshooting/replication and core
  feature development for our flagship SaaS platform.

  This role requires a strong developer who thrives on deep-
  dive root cause analysis (RCA), reverse engineering
  production issues in staging environments, and writing high-
  quality backend code in modern languages like Python and Go.

  ﻿Location: Remote (US-Based) | EST Preferred | Travel:
  Minimal (<10%)

  Responsibilities

  As a Senior Software Engineer, Your impact will be:

  ﻿Feature & Platform Development (60%)

  - Backend and Frontend Engineering: Design, build, and
    maintain scalable services for the core SaaS CPS platform
    using Python, Go, React and other modern technologies.
  - Backlog Execution: Contribute directly to core feature
    delivery, performance optimizations, and backend
    architecture within the CPS Platform roadmap.
  - Federal Compliance: Ensure all platform code complies with
    FedRAMP, CMMC, and strict GovCloud operational boundaries.

  Incident Handling, Replication & RCA (40%)

  - Root Cause Analysis (RCA): Investigate complex production
    defects, system regressions, and performance bottlenecks
    originating in FedRAMP/GovCloud environments.
  - Staging Environment Replication: Re-create customer-reported
    issues within staging and sandbox environments to isolate
    bugs and validate fixes.
  - Technical Collaboration: Produce detailed technical bug
    reports, telemetry diagnostics, and actionable findings to
    collaborate seamlessly with core R&D teams in Israel and
    the US.

  Requirements

  What you need to succeed in this role:

  - US Citizenship Required (Mandatory for GovCloud access and
    Federal audit compliance).
  - 5+ years of professional software engineering experience
    building and maintaining distributed backend systems.
  - Strong Proficiency in Python and Go: Deep hands-on
    experience developing microservices, REST APIs, and event-
    driven backend components — Must.
  - Modern Development Stack: Familiarity with modern
    programming languages, backend frameworks, and cloud-
    native design patterns.
  - Linux & Infrastructure Diagnostics: Strong command of Linux
    environments (RHEL, Ubuntu, Amazon Linux),
    containerization (Docker, Kubernetes/EKS), CLI tools, log
    analysis, and system telemetry metrics — Must.
  - AI-Assisted Development: Proficiency in utilizing AI
    development tools to accelerate development workflows,
    code generation, and problem-solving- Must.
  - Troubleshooting Expertise: Proven ability to read, debug,
    and trace code written by other teams to identify root
    causes efficiently.
  - Collaborative Mindset: Excellent technical communication
    skills with a proven track record of working
    asynchronously across global development teams.

  Preferred Qualifications

  - Experience working on cyber-physical systems, IoT, OT
    security, or network instrumentation platforms.
  - Hands-on experience with message brokers and distributed
    data streaming platforms (e.g., Apache Kafka).
  - Experience with React or other modern frontend technologies.
  - Prior experience working within AWS GovCloud, FedRAMP
    High/Moderate, or CMMC-compliant environments and security
    frameworks.
  - Experience with database query execution and SQL.
  - Familiarity with CI/CD automation tools (GitLab CI, Jenkins)
    and Infrastructure-as-Code (Terraform, Helm).

  About Claroty

  Claroty has redefined cyber-physical systems (CPS)
  protection with an unrivaled industry-centric platform built
  to secure mission-critical infrastructure. The Claroty
  Platform provides the deepest asset visibility and the
  broadest, built-for-CPS solution set in the market
  comprising exposure management, network protection, secure
  access, and threat detection – on-premise with Claroty
  Continuous Threat Detection (CTD) or in the cloud with
  Claroty xDome for Government. Backed by award-winning threat
  research and a breadth of technology alliances, The Claroty
  Platform enables U.S. public sector agencies to effectively
  reduce CPS risk, with the fastest time-to-value and lower
  total cost of ownership. Claroty Public Sector LLC is
  headquartered in Arlington, Virginia. To learn more, visit
  clarotygov.us.

  Claroty is widely recognized as the industry leader in CPS
  protection, backed by the world’s largest investment firms
  and industrial automation vendors. The company has been
  named a Leader in 2026 Gartner® Magic Quadrant™ for CPS
  Protection Platforms two years in a row, a Customers’ Choice
  in the 2026 Gartner® Peer Insights™ Voice of the Customer
  for CPS Protection Platforms, and a Leader and a Customer
  Favorite in The Forrester Wave™: Operational Technology
  Security Solutions, Q3 2026. Claroty has also been named to
  the Forbes Cloud 100 and Deloitte Technology Fast 500
  multiple consecutive years..

  Expected compensation for the role is between $180,000 –
  $200,000. This is a good faith estimate but does not include
  equity, bonus, or other forms of payment. Pay will be
  determined by experience level, but those outside the salary
  band are welcome to apply.

  Claroty is an equal-opportunity employer committed to
  fostering a diverse and inclusive work environment for all.
  We encourage applications from candidates of ALL diverse
  backgrounds, and special accommodations are available upon
  request in all selection phases.

