description: |
  Ambrook helps American family-run businesses become more
  profitable and resilient. From volatile markets to climate
  shifts, independent operators face mounting pressure. While
  sustainable investments often yield the best long-term
  returns, they require financial clarity and capital that
  fragmented legacy systems can’t provide. We are rebuilding
  the financial infrastructure that real economy operators
  rely on. By replacing paperwork with modern tools for
  accounting, banking, and spending, Ambrook gives owners the
  data they need to prove viability to lenders and the next
  generation. We empower the stewards of land and labor to
  make confident investments in their future. We’re a Series B
  startup backed by Lachy Groom, Thrive Capital, Dylan Field,
  Thomson Reuters Ventures, Cameron Ventures, and leaders at
  Notion, Gusto, and Vercel. We’re looking for team members to
  help us untangle the intersection of American industry,
  climate, and the economy.

  The opportunity

  Ambrook is building a world-class team. As a member of our
  engineering team, you’ll help drive our technical decisions
  and influence our product direction for years to come, with
  the goal of making agriculture more sustainable and
  profitable.

  We’ve been taking advantage of AI dev tooling since the
  beginning and we keep up with the bleeding edge. Engineers
  have the budget to try new tools and we optimize for
  portability, knowing that the state of the art is changing
  every day. We have plenty of opportunities to allow every
  engineer to ship much more while focusing on the really hard
  problems. We talk regularly about the impact that AI is
  having on us as people and balance marvel with a respect for
  our craft.

  We’re looking for someone who we can count on to…

  - Own: Delivery of elegant, performant product experiences and
    infrastructure.
  - Teach: Best practices in engineering architecture, project
    management, and cross functional collaboration.
  - Learn: Ins and outs of building an fintech and climate tech
    company, including the nitty gritty of bookkeeping and the
    real challenges our customers face in running their
    business.
  - Improve: Existing full-stack architecture and API,
    engineering tooling, and development velocity.

  Our Tech Stack

  - Next.js / React application written in Typescript
  - Expo & React Native for mobile
  - Firestore, PostgreSQL & Google Cloud Storage at the data
    layer
  - Running on GCP
  - BigQuery & Hex for data insights

  Within 1 month you'll...

  - Learn how to use Ambrook’s tech stack to deliver a
    standalone feature to our customers.
  - Analyze Ambrook’s use of best practices and share a
    technical note with our team about where we have
    opportunities to improve.
  - Develop a deep intuition for our customers by joining
    discovery calls and feedback sessions with agricultural
    producers.
  - Contribute to Engineering team meetings and review code from
    peers.

  Within 3 months you'll...

  - Collaborate with our Product team to influence
    prioritization of feature ideas and requests with insights
    from our audience.
  - Work with other engineers as the owner for a full-stack
    feature built into our core bookkeeping product. As the
    engineering owner, you’ll break down your project into
    granular pieces and practice good project management
    hygiene, triaging and prioritizing new issues that come
    in.
  - Plan and execute improvements to our server infrastructure,
    databases, and CI/CD tooling.
  - Champion strong user data hygiene, operational security, and
    privacy practices.

  Within 6 months you'll...

  - Collaborate to design and execute improvements to our
    engineering stack, building new processes and onboarding
    our team to them.
  - Champion a culture of engineering excellence, connecting its
    value to the needs of our community and the broader team.
  - Get involved in hiring and growing the team by evaluating /
    interviewing candidates.
  - Write about your experience and how you improved Ambrook’s
    engineering culture and processes in a post on Inside
    Ambrook.

  About you

  - Experience shipping web applications.
  - You keep up to date with the latest changes in AI tooling
    and think critically about how to apply them to your day
    to day.
  - Excited to build software that makes industries like
    agriculture more sustainable and profitable.
  - Comfortable taking on ambiguous problems and creating
    elegant technical solutions
  - Bonus: Experience in agriculture.Bonus: Experience building
    financial products.Bonus: Experience with Typescript,
    React, React Native, and/or Next.js.

  Values

  - Real Talk – We create space for ourselves and others to be
    straightforward, vulnerable, and accountable.
  - Reach Understanding – We are driven by curiosity and empathy
    to learn about our customers, team, and world.
  - Be Proactively Resourceful – We are internally motivated and
    externally empowered to identify opportunities and solve
    problems.
  - Derisk Thoughtfully – We lean into the biggest risks we face
    as a company and put in the work to address them
    systematically.
  - Find the Positive-Sum – We believe in creating incentive
    structures that align the needs of our company, our
    customers, and our planet.

  Benefits

  - Competitive compensation
  - Health insurance401(k) with matching contribution
  - Paid parental leave
  - Flexible work hours and vacation time
  - Work-from-home/remote office stipend
  - Wellness stipend
  - Professional development stipend

  Ambrook is an equal opportunity employer. We are committed
  to building diversity and inclusion into our core company
  culture.
