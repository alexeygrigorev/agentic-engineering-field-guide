description: |
  ABOUT US



  At Vida, we help people get better- and we're helping the
  healthcare system get better, too.



  Vida is a virtual, personalized obesity care provider that
  uses evidence-based treatment to help patients manage
  obesity and related conditions like diabetes, high blood
  pressure, anxiety and depression. Vida's team of Obesity
  Medicine-Certified Physicians, Registered Dietitians, Expert
  Coaches and Licensed Therapists takes a whole-person
  approach to care, helping people lose weight, reduce stress
  and improve their overall health.



  By combining advanced technology with top-notch healthcare
  providers, Vida is breaking down the barriers that have
  historically kept people from getting the best care. It's
  trusted by Fortune 100 companies, major national payers and
  large providers to enable their employees to live their
  healthiest lives.

  Vida is looking for a Backend Software Engineer II to help
  build the data platform that supports much of Vida's
  business. Our team builds the systems that turn data from
  health plans, employers, and other partners into reliable
  information that Vida's products and operations can use.
  That includes member identity, eligibility, billing, partner
  integrations, and the data foundations behind reporting and
  analytics. You will work on backend services and data-
  intensive systems, primarily in Python, and take features
  from design through production. You will start with well-
  defined problems and grow toward owning services and
  technical decisions independently.

