title: Senior Full Stack Software Engineer
company: Raydar
location: New York, USA
work_type: FULL_TIME
company_size: 28 Employees
description: |
  About the company

  Our client is a fast-growing financial services company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Build and ship full-stack features for a payments-focused
  web platform, taking product work from undefined problems
  through to production with a high degree of independence.
  The role pairs hands-on engineering with input on system
  design and close daily work alongside non-technical
  colleagues.

  What you'll do

  - Scope loosely defined product problems, split them into
    deliverable pieces, and take them live.

  - Shape architectural and design choices that guide the
    direction of the platform.

  - Build features across a JavaScript front end and a Node.js
    back end.

  - Translate complicated operational processes into working
    software with product and non-technical teammates.

  - Use AI tools and automation to develop the product and the
    way the team builds it.

  Requirements

  What we're looking for

  - Experience shipping production software at a large,
    engineering-led technology company operating at scale.

  - A bachelor's or master's degree in computer science or a
    related engineering field, or an adjacent degree from a
    strong program.

  - Strong hands-on skill across both the client and server
    sides of a modern web application, working in a
    JavaScript-based toolchain.

  - Experience building systems that handle sensitive data and
    treating data integrity and security as a core concern.

  - Clear written and verbal communication with non-technical
    stakeholders.

  Bonus points

  - Familiarity with AI tooling as a default part of the
    development workflow.

  - Background in payments, billing, claims or electronic health
    records, or a clear interest in those areas.

  Benefits

  Compensation and benefits

  - Base salary: USD 175,000 to 225,000 per year

  - Equity

  - Health insurance premium coverage

  - Paid parental leave

  - Unlimited paid time off

  - Hybrid work schedule

  Location and work model

  - New York, NY or San Francisco, CA, United States

  - Hybrid, 3 days in-office per week with flexible day
    selection

  - Full-time
