description: |
  Liftoff is a leading AI-powered performance marketing
  platform for the mobile app economy. Our end-to-end
  technology stack helps app marketers acquire and retain
  high-value users, while enabling publishers to maximize
  revenue across programmatic and direct demand.

  Liftoff’s solutions, including Accelerate, Direct, Monetize,
  Intelligence, and Vungle Exchange, support over 6,600 mobile
  businesses across 74 countries in sectors such as gaming,
  social, finance, ecommerce, and entertainment. Founded in
  2012 and headquartered in Redwood City, CA, Liftoff has a
  diverse, global presence.

  About this team:

  At Liftoff, the View Master team plays a crucial role in the
  company's success. Our team builds mobile SDKs (iOS,
  Android, Windows), and systems that connect Liftoff’s
  publishers with advertisers, managing applications,
  campaigns, and creatives that feed into our ad serving
  pipeline. We create innovative advertisements viewed by
  millions daily, ensuring a seamless user experience and
  optimizing ad performance.  We're a group of innovative
  engineers who leverage the latest technology to develop
  efficient and scalable systems. If you're passionate about
  building and scaling low-latency, high-throughput systems,
  we'd be delighted to speak with you!

  Responsibilities:

  - Own the technical direction for new ad format development in
    the SDK, driving decisions on native/web architecture and
    cross-platform compatibility without needing detailed
    direction
  - Independently scope and lead ambiguous, cross-team
    initiatives from problem definition through rollout —
    e.g., overhauling automation quality and creative/SDK
    interoperability
  - Drive multi-quarter improvements to system efficiency,
    reliability, and rendering performance, owning tradeoffs
    between short- and long-term solutions
  - Set and evangelize testing strategy and standards (unit,
    integration, automated) across the team, not just execute
    against existing practices
  - Design and drive experimentation and canary-release strategy
    for ad unit performance, including recommending which
    approaches to pursue
  - Technically lead and mentor other engineers on the team,
    including guiding junior/mid-level engineers' project work
    and growth (not just informal mentorship)
  - Represent the team in cross-functional and roadmap
    discussions, influencing prioritization and scope rather
    than only attending for alignment
  - Uphold and help define the team's engineering bar for code
    quality, security/privacy, cost efficiency, and production
    hygiene (oncall, monitoring, documentation)
  - Contribute to hiring and leveling: participate in
    interviews, help hold the technical bar for the role

  Requirements:

  - Bachelor’s degree in Computer Science or related fields and
    6 years of relevant experience
  - Deep expertise in JavaScript (ES6+), CSS preprocessors, and
    HTML5, with demonstrated ability to make architectural
    decisions in this stack
  - Experience working in and helping shape Agile processes for
    a team
  - Strong communication skills, including the ability to
    influence technical direction across engineering and
    product without formal authority

  Nice to Have:

  - Previous AdTech experience is highly valued
  - Experience developing mobile applications
  - Advanced automated testing strategies using tools such as
    AWS Device Farm, iOS and Android simulators, Playwright,
    Selenium, etc.

  Location: This role is eligible for remote or hybrid work
  out of our London office.

  Travel Expectations: We offer several opportunities for in-
  person team gatherings, including but not limited to project
  meetings, regional meet-ups, and company-wide events. We
  expect our employees to attend these gatherings at least
  once per quarter. These gatherings provide essential
  opportunities for collaboration, communication, and team
  building.

  Compensation: Liftoff offers all employees a full
  compensation package that includes equity and
  health/vision/dental benefits associated with your country
  of residence. Base compensation will vary based on the
  candidate's location and experience.

  #LI-REMOTE

  #LI-NM1

  Liftoff offers a fast-paced, collaborative, and innovative
  work environment where employees are empowered to grow and
  make an impact. We’re shaping the future of the mobile app
  ecosystem—join us and help accelerate what’s next.

  Liftoff’s compensation strategy includes competitive
  salaries, equity, and benefits designed to support employee
  well-being and performance. We benchmark compensation based
  on role, level, and location to ensure fairness and market
  alignment. Benefits may include medical coverage, wellness
  stipends, and additional perks based on your country of
  residence.

  Liftoff is an equal opportunity employer. We are committed
  to creating an inclusive environment for all employees and
  applicants regardless of race, ethnicity, national origin,
  age, marital status, disability, sexual orientation, gender
  identity, religion, veteran status, or any other
  characteristic protected by applicable law.

  Agency and Third Party Recruiter Notice:

  Liftoff does not accept unsolicited resumes from individual
  recruiters or third-party recruiting agencies in response to
  job postings. No fee will be paid to third parties who
  submit unsolicited candidates directly to our hiring
  managers or Recruiting Team. All candidates must be
  submitted via our Applicant Tracking System by approved
  Liftoff vendors who have been expressly requested to make a
  submission by our Recruiting Team for a specific job
  opening. No placement fees will be paid to any firm unless
  such a request has been made by the Liftoff Recruiting Team
  and such a candidate was submitted to the Liftoff Recruiting
  Team via our Applicant Tracking System.
