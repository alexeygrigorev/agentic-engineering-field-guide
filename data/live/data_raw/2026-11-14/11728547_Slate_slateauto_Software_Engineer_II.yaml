description: |
  ABOUT SLATE

  At Slate, we’re building safe, reliable vehicles that people
  can afford, personalize and love—and doing it here in the
  USA as part of our commitment to reindustrialization. The
  spirit of DIY and customization runs throughout every
  element of a Slate, because people should have control over
  how their trucks look, feel, and represent them.

  Who we are looking for:

  Slate is looking for a Software Development Engineer II to
  build and ship features for our digital platform. We’re
  building a direct-to-consumer EV brand from the ground up,
  and our software connects customers to their Slate at every
  step, from discovering and customizing their vehicle to
  managing their ownership journey.

  You’ll design and deliver features, work with product, UX,
  and senior engineers, and see your work reach customers
  quickly.

  You work independently, enjoy solving a variety of problems,
  and are eager to grow in a fast-moving environment. At
  Slate, there is no distance between what you build and the
  impact it creates. Your work will help define how customers
  experience an entirely new automotive brand

  What you get to do:

  - You design, build, and deliver features and components
    independently, with little day-to-day direction.

  - You code and test your work and take part in code and design
    reviews.

  - You own the quality of what you ship, including unit and
    functional tests.

  - You solve a variety of problems creatively, weighing the
    relevant factors and choosing sound methods.

  - You work with UX and product teammates to understand
    customer needs and build the right thing.

  - You have a full working understanding of your area and make
    good decisions within it.

  - You take general direction on new assignments and ask for
    input when the trade-offs get larger.

  - You share what you know with teammates and help others get
    up to speed.

  What you bring to the team:

  - 3+ years of professional software development experience.

  - Experience building and shipping features in customer-facing
    software systems.

  - Working knowledge of web services, APIs, and modern software
    development practices, including testing and code review.

  - Ability to solve a variety of problems and work
    independently on day-to-day tasks.

  - Experience consuming or integrating third-party APIs.

  - Experience with ecommerce or marketplace systems is a plus.

  WORK AUTHORIZATION

  Applicants must be authorized to work in the United States
  on a permanent basis. We are unable to offer visa
  sponsorship at this time.

  SALARY RANGE

  The compensation for this position is the range Slate
  reasonably and in good faith expects to pay for the position
  taking into account the wide variety of factors that are
  considered in making compensation decisions, including job-
  related knowledge; skillset; experience, education and
  training; certifications; work location; and other relevant
  business and organizational factors.

  123,339.00 - 185,009.00 USD Annual

  ADDITIONAL COMPENSATION AND BENEFITS

  Slate offers a wide range of competitive benefits, including
  medical, dental, vision, life insurance, disability
  insurance, vacation, and 401k. The successful candidate may
  also be eligible to participate in the equity program and/or
  a discretionary annual incentive program, subject to the
  rules governing such programs.

  WHY JOIN TEAM SLATE?

  At Slate, we’re fueled by grit, determination, and attention
  to detail. The start-up spirit of ingenuity and
  resourcefulness move our business forward. Team Slate
  fosters a culture of excellence, innovation, and mutual
  respect, and is motivated by shared principles.

  - Safety First
  - Delight Customers
  - One Team
  - Relentless Improvement
  - Fast, Frugal, and Scrappy
  - Respectful Collaboration
  - Positive Legacy

  WE WANT TO WORK WITH PEOPLE THAT REFLECT THE COMMUNITIES IN
  WHICH WE OPERATE.

