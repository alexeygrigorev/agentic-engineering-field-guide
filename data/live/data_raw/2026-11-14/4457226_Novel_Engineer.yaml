description: |
  Novel is the no-code platform for NFT commerce backed by top
  angels and funds across e-commerce and web3. Novel’s first
  product is a Shopify plug-in that gives brands and creators
  the ability to create and sell NFTs within their existing
  store or a brand new one.

  At Novel, we are driven by a vision to accelerate the
  mainstream adoption of NFTs by reducing the sale and
  purchase of them to a trivial concern. The market cap for
  NFTs is already over $31bn; by eliminating large technical
  barriers for both creators and consumers, Novel will open
  the floodgates for NFT adoption.

  On our team, you will bring this vision to life alongside a
  world-class team backed by investors deeply integrated in
  the e-commerce ecosystems. Joining a company at the earliest
  and most dynamic stage— in a market that’s equally early and
  quickly evolving— means you must be both ambitious and
  resourceful, keen to solve problems with no set playbook.

  Technologies:

  - Typescript
  - React
  - Node
  - Postgres
  - Kubernetes
  - Shopify
  - Solidity
  - Hardhat

  Need to Have:

  - Experience working on a production development environment
  - Passion for software development
  - A mindset of ownership

  Nice to Have:

  - Experience working with smart contracts
  - Experience working in e-commerce
  - Experience working at a startup

  Perks

  - Comprehensive medical, vision and dental health plans
  - Competitive compensation and equity
  - Flexible vacation policy
