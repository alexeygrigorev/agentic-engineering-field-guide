description: |
  Ohme is on a mission to accelerate the global transition to
  clean, affordable energy. We do that by serving as an
  integrated hardware and software smart-grid platform,
  focused on the residential EV charging market.

  The worlds of energy, transport and artificial intelligence
  are colliding and Ohme is at the heart of this new era. By
  using technology and data integrations to connect cars,
  chargers, people, energy providers and more, Ohme has a
  powerful platform that puts the consumer at the core.

  Ohme has been selling its chargers to consumers since mid
  2019 and has had exponential growth since. We are now
  operating in multiple countries and have partnerships with
  the likes of VW Group, Hyundai, Volvo, Octopus Energy, and
  other innovative brands.

  We are scaling up the business and are building out the team
  for rapid growth. If you’re interested joining a fast-
  growing cleantech venture on a data and AI-first journey to
  speed up the global transition to clean, affordable energy,
  read on!

  We're looking for an Associate Product Manager for our Core
  Backend as we enter the next frontier in Ohme's journey. The
  Core Backend is the engine room for our charging experience
  - powering the Ohme Chargers and our Ohme Mobile App to
  easy, greener, cheaper energy. In this role you'll
  understand and improve how our systems get better outcomes
  for our customers every day. It's an incredible time to
  join. Hundreds of thousands of chargers are already live
  across nine markets. We're transforming how we work and
  deliver, leveraging the latest tools and technology to build
  better and faster. You'll use agentic AI daily to shape
  requirements, manage the backlog, build and collaborate with
  engineers and your role will evolve with the product.
  Responsibilities

  - Scope & Impact - Ship updates to hundreds of thousands of
    users. Improving reliability of integrations and unlocking
    new ways to help drivers meet their energy demands.
  - Strategy & Vision - Execute against an existing strategy and
    identify new opportunities tied to key goals.
  - Customer & Market Insight - Get close to how the backend
    shapes the customer experience - through the App, support
    and incident data, partner integration and market
    feedback.
  - Road mapping & Prioritisation - Maintain a feature backlog
    and prioritise within the team using simple frameworks.
  - Execution & Delivery - Build POCs and prototype with agentic
    AI, write PRDs, user stories and acceptance criteria,
    prototype and test in partnership with design and
    engineering to ship on time.
  - Product Quality Metrics - Define success metrics for
    performance, adoption and quality. Query logs and identify
    anomalies.
  - Stakeholder Management - Communicate proactively and
    maintaining visibility beyond your immediate team.
    Collaborating effectively interdependently.
  - Technical & Design Fluency - Build conversational fluency in
    Mobile Apps, System Architecture, Frmware, APIs, SQL and
    OCPP.

  About You

  - You've got 2+ years experience in the product domain.
  - You're a builder - you're excited about using the latest
    tools and mastering them to build and test things.
  - You're a self starter - you've taught yourself something
    hard because you wanted to and overcome challenges under
    your own steam.
  - You're customer obsessed - you think in personas, segments
    and Jobs To Be Done.
  - You're a problem solver - you focus on outcomes and finding
    solutions to unblock your path.
  - You love numbers - data and metrics are how you decide what
    to do next, and how you judge whether it worked.
  - You follow the money - you don't need to manage a budget,
    but you understand what costs are and what drives revenue.
  - You're technically astute - proficient with data querying
    (SQL) and API contracts (REST/JSON) and comfortable enough
    with system architecture and logs to ask sharp questions.
  - You're a team player - you want to win and help others in
    your squad be great.

  Our benefits:

  - Competitive salary and bonus
  - Hybrid office - 3 days in the office
  - Private Health Insurance
  - Aegon Pension Scheme
  - Life Assurance Scheme with death in service benefit of 4x
    salary
  - Income Protection Scheme for long term illness
  - Ride to Work Scheme
  - Payroll Giving Scheme
  - Season Ticket Loan to spread cost of travel over 12 months
  - Eye Test every 2 years

  Ohme is an equal opportunity employer. Diversity, Equity and
  Inclusion are at the heart of what we do and we encourage a
  culture where everyone can be themselves at work. We
  actively seek out a diverse range of talent and our policies
  ensure that every job application and employee is treated
  fairly, with equal opportunity to succeed and to feel
  included.
