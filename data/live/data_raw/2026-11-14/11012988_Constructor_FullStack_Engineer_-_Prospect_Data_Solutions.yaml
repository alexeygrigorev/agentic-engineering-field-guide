description: |
  About You

  You have a knack for solving intricate Software Development
  problems. You're driven by the idea of writing code that
  simplifies life for millions of users globally. You're
  committed to continuous learning and enjoy tackling new
  challenges. Pair programming, code reviews, and
  collaborative brainstorming with a team are activities you
  find fulfilling. You're eager to work alongside developers,
  prospective customers, account executives, product managers,
  data scientists, and data analysts. You're a disciplined
  professional who consistently delivers high-quality code
  that you take full ownership of, communicates technical
  solutions with clarity and empathy, and takes the initiative
  to streamline processes for your team and yourself.

  About Us

  Constructor is the next-generation platform for search and
  discovery in ecommerce, built on a unique GPT-based
  architecture made specifically for commerce. Constructor's
  AI-first solutions make it easier for shoppers to discover
  products they want to buy and for ecommerce teams to deliver
  highly personalized experiences, from search, to
  recommendations, to AI Shopping Agents and everything in
  between. Optimizing specifically for ecommerce metrics like
  revenue, conversion rate and profit, Constructor generates
  consistent $10M+ lifts for some of the biggest brands in
  ecommerce, such as Sephora, Petco, Under Armour, home24,
  Birkenstock and The Very Group. Constructor is a U.S. based
  company that has been in the market since 2019. It was
  founded by Eli Finkelshteyn and Dan McCormick who still lead
  the company today.

  We’re a passionate team who love solving problems and want
  to make our customers’ and coworkers’ lives better. We value
  empathy, openness, curiosity, continuous improvement, and
  are excited by metrics that matter. We believe that
  empowering everyone in a company to do what they think is
  best can lead to great things.

  About the Position

  As a Software Engineer on the Prospect UI Solutions team,
  you will play a pivotal role in proving how Constructor will
  enhance the website discovery experiences for prospects.
  You’ll work closely with internal Engineering, Product and
  Sales stakeholders to seamlessly integrate prospective
  customer data with our services, supporting them to create
  an optimized and accurate product discovery demo.

  In this role, you will:

  - Fuel our proprietary AI models: Write JavaScript code to
    collect data essential for training our AI.
  - Leverage Modern Tooling: Utilize AI as a tool to accelerate
    your fundamental capabilities and knowledge on how to
    solve problems with software; building solutions that you
    are proud to call your own
  - Seal the deal: Collaborate with Data Analysts and Account
    Executives to secure deals with prominent e-commerce
    brands.
  - Leverage your tech knowledge: Assist prospects in
    integrating their data and user interfaces with our
    services, focusing on ETL and front-end integrations.
  - Deliver excellence: Validate the data provided by prospects
    and ensure the quality of the results returned by our
    services.
  - Empower a sales force: Contribute to the development and
    scaling of demo infrastructure to enhance the demo
    capabilities of the Sales team.
  - Be a part of the answer: Assist Account Executives by
    addressing technical inquiries from prospects about our
    services.
  - Elevate the team: Provide support to your teammates through
    thoughtful code reviews and empathetic problem solving
    sessions.
  - Visualize brilliance: Develop dashboards and alerts using
    React, Redux, Node, Clickhouse and OpenSearch.
  - Innovate with purpose: Implement and test new features for
    our open-source JavaScript UI libraries and REST clients.
  - Collaborative contribution: Steer cross-team efforts to
    ensure our prospect's needs are at the forefront of our
    priorities, making you a key player in our strategic
    success.
  - Champion team culture: Actively foster our team’s sense of
    community by expanding our roster of Friday team-building
    games and promoting a culture of empathy, personal growth,
    and support for others.

  This role is ideal for any Software Engineer passionate
  about search technology, customer-focused solutions, and
  collaborative development.

  Requirements

  - A minimum of four years of professional experience or
    relevant academic experience
  - Excellent communication and interpersonal skills
  - English on C1 level (CEFR) or higher
  - Being able to attend regular meetings with teammates between
    1400 and 1800 UTC, with working hours ideally starting
    some time in the range of 0900 and 1200 UTC.
  - Strong foundation and experience with server-side and
    client-side programming languages
  - Enjoys interacting with customers and solving new problems
    daily
  - Able to pick up new technologies and design patterns quickly
    and loves learning them
  - Experience with building User Interfaces utilizing front-end
    frameworks like (but not limited to) React, Vue or Angular
  - Proven track record of building UIs with heavy consideration
    for friendly user experience
  - Experience with automated tests like (but not limited to)
    Cypress, Jest, or React Testing Library
  - Experience in JavaScript will be a strong asset for this
    role, but candidates with a proven Software Development
    background that demonstrate a willingness to quickly learn
    the language will also be considered
  - Nice to have - TypeScript, Next.js, Tailwind, Storybook,
    Python and web scraping experience

  Benefits

  - 🏝️ Unlimited vacation time - we strongly encourage all of
    our employees take at least 3 weeks per year
  - 🌎 Fully remote team - choose where you live
  - 🛋️ Work from home stipend! We want you to have the resources
    you need to set up your home office
  - 💻 Apple laptops provided for new employees
  - 🧑‍🎓 Training and development budget for every employee,
    refreshed each year
  - 👪 Maternity & Paternity leave for qualified employees
  - 🧠 Work with smart people who will help you grow and make a
    meaningful impact
  - 💵 This position has a base salary range between $80k and
    $120k USD. The offer varies on many factors including job
    related knowledge, skills, experience, and interview
    results.
  - 🎉 Regular team offsites to connect and collaborate

