description: |
  About the Role

  Intermedia is looking for a talented Fullstack Developer to
  join our DevEngineering team. In this role you will deliver
  features end-to-end—building backend services that compute
  and expose live operational metrics, and frontend
  experiences that visualize those metrics in real time for
  contact center supervisors and leaders. This is a great
  match if you are a motivated self-starter who’s able to dig
  into complex code across the stack, collaborate closely with
  team members, and ship solutions that directly impact our
  business and its customers.

  While primarily remote, this role requires occasional visits
  to the Bristol office or London.

  What You Will Be Doing:

  - Develop high-quality code that is scalable, readable, and
    adheres to company standards.
  - Build and evolve frontend dashboards and backend
    APIs/services that support live updates and near-real-time
    data.
  - Analyze and improve the efficiency, scalability, and
    stability of existing systems.
  - Collaborate with stakeholders to define system requirements,
    integrate business logic, and refine technical solutions.
  - Troubleshoot, debug, and upgrade existing software.
  - Document development processes, code changes and other
    technical information.

  What You Will Bring to the Role:

  - Bachelor’s Degree in Computer Science, or equivalent field
    and 4+ years of experience.
  - Frontend experience with JavaScript/TypeScript technologies
    such as NodeJS, Angular/AngularJS, React, etc.
  - Backend experience with .NET technologies, including C# and
    ASP.NET / ASP.NET Core.
  - Excellent communication, presentation and written skills.
  - A working understanding of Agile and some of its frameworks
    such as Scrum/SaFE/LeSS.
  - Passion for coaching those with less experience in areas of
    need and view that as a great opportunity

  Bonus Skills

  - Experience working on AI-powered products, assistants,
    virtual agents, or builder-style applications.
  - Familiarity with design systems, component libraries, and
    highly reusable frontend platforms.
  - Experience with cloud environments such as Azure or AWS in
    globally distributed products.

