description: |
  Cadence is the clinical AI company automating the treatment
  of chronic disease. Its Clinical Intelligence takes on the
  routine, high-volume work of chronic care – monitoring
  patients, surfacing risks, and coordinating action – so
  clinicians can focus on the decisions that require them.
  Grounded in partnerships with more than 20 leading health
  systems, deep EMR integrations, dedicated medical group, and
  experience serving a population of more than 100,000
  patients, the system learns from real-world care delivery,
  improving as it scales. Cadence has been recognized by TIME
  as one of the Top 100 HealthTech Companies and by LinkedIn
  as a Top Startup (#4, 2025).

  The Role

  We're hiring a Software Engineer - Platform to build and
  scale the infrastructure that embeds compliance and risk
  controls directly into the Cadence platform. You will have
  significant autonomy and broad scope to identify problems,
  set direction, and ship improvements across the platform.
  That autonomy requires sound judgment: you should be an
  independent self-starter who can move quickly, manage
  ambiguity, and operate safely in a high-stakes environment.
  For the right engineer, this is an opportunity to be
  unusually prolific.

  What You'll Do

  - Design and build systems across application, backend, data,
    and cloud infrastructure boundaries
  - Create secure defaults, reusable controls, and paved paths
    that help teams build quickly and safely
  - Strengthen identity, access, secrets, CI/CD, Kubernetes,
    observability, and other platform capabilities
  - Help define how Cadence evaluates, monitors, and governs AI
    used in patient care
  - Identify architectural risks and turn them into practical
    technical solutions
  - Partner with Product, Engineering, Clinical, Legal, and
    Security leaders to shape our approach to trust at scale
  - Independently take ambiguous, high-impact problems from
    initial design through production

  What You Need

  - 4 or more years of experience building and operating
    production software or infrastructure
  - Breadth across several areas such as frontend, backend,
    APIs, distributed systems, cloud infrastructure, data, or
    developer tooling
  - Strong architectural judgment and the ability to reason
    about reliability, security, operability, and speed
  - A track record of setting direction, acting without waiting
    for detailed instructions, and delivering across a broad
    scope
  - The judgment to move quickly without compromising patient
    safety, security, or operational rigor
  - Curiosity and confidence when working in unfamiliar
    codebases and technical domains
  - A tendency to think about failure modes, misuse,
    auditability, and safe defaults
  - Clear communication with both technical and non-technical
    partners
  - Interest in growing deeper expertise in security,
    responsible AI, and healthcare technology
  - Experience in security, healthcare, compliance, or AI
    governance is valuable, but not required. We care most
    about your ability to understand complex systems, learn
    quickly, exercise sound judgment, and build thoughtful
    solutions across traditional engineering boundaries.

  Compensation

  Our job titles may span more than one career level. The base
  salary for this role typically ranges between $150,000 -
  $250,000, depending on experience, skills, seniority, and
  business needs. In addition to base salary, this role is
  eligible for equity as part of the total compensation
  package. Actual compensation may vary by location.

  Benefits & Perks

  - Competitive pay & equity*
  - Fully remote
  - Comprehensive health coverage: Medical, dental & vision
  - Paid time off
  - 401k plan + matching
  - Paid parental leave
  - Home office stipend

  *benefit offerings may vary depending on job profile, job
  level and worker type  Cadence is committed to equal
  opportunity and fairness regardless of race, color,
  religion, sex, gender identity, sexual orientation, nation
  of origin, ancestry, age, physical or mental disability,
  country of citizenship, medical condition, marital or
  domestic partner status, family status, family care status,
  military or veteran status or any other basis protected by
  local, state or federal laws.

  A notice to Cadence applicants: Our Talent team only directs
  candidates to apply through our official careers page at
  https://www.cadence.care/our-team.  Cadence will never refer
  you to external websites, ask for payment or personal
  information, or conduct interviews via messaging apps. We
  receive all applications through our website and anyone
  suggesting otherwise is not with Cadence. If you require a
  reasonable accommodation during the interview or hiring
  process, please notify your recruiter.
