description: |
  Assured is on a mission to modernize insurance. Claims
  processing (i.e. should we pay this claim?), while often
  overlooked, is the foundation of the entire industry. It’s
  currently highly manual, involving phone calls, faxes, and
  gut instinct, costing tens of billions of dollars a year. We
  can do better.

  At Assured, we provide large insurers with the software
  solutions they need to win in a modern, technology-driven
  world. From self-service claim-filing software to backend
  fraud detection, we’re the engine that powers claims
  processing for some of the largest insurers in the world.

  The challenges we face are deep and diverse, from creating
  digital experiences that provide comfort and clarity to
  claimants at their most stressed and vulnerable to
  orchestrating large-scale ML-driven decision-making on
  billions of dollars of claims payments, life at Assured is
  dynamic, collaborative, and rewarding.

  We’re looking for a Software Engineering Manager to lead a
  talented team as we scale our platform and shape the next
  phase of our growth. You’ll help define how we build,
  collaborate, and deliver, driving technical excellence and
  empowering people to do their best work.

  What You’ll Do

  🧭 Lead and develop exceptional engineers through mentorship,
  regular feedback, and career growth conversations.

  🤝 Collaborate cross-functionally with product and design to
  deliver secure, scalable, and reliable features that make a
  real impact for users.

  ⚙️ Drive engineering excellence by guiding architectural
  decisions, promoting best practices, and ensuring
  performance and reliability.

  🌱 Scale the team and organization by refining processes,
  supporting hiring, and improving team velocity and
  execution.

  💬 Foster a culture of collaboration and learning, promoting
  transparency, adaptability, and shared ownership across
  teams.

  🔍 Anticipate and navigate growth challenges, evolving
  workflows and maintaining focus on delivering user and
  business value.

  What You Bring

  💻 8+ years of software engineering experience, including 3+
  years in a leadership or management role.

  🚀 Experience leading teams in a high-growth startup
  environment—comfortable staying hands-on when needed.

  🎯 A passion for building products that excel in usability,
  performance, reliability, and security.

  🗣️ Proven ability to set goals, communicate clearly, and
  deliver measurable results.

  🌟 A strong track record of attracting, developing, and
  retaining exceptional engineering talent.

  🧩 The ability to translate customer and business needs into
  cohesive technical roadmaps and execution plans.

  Bonus: 🧠 Familiarity with our stack: Node.js (TypeScript),
  React (TypeScript), GraphQL, Python, Docker, PostgreSQL,
  AWS.

  Benefits:

  🤑 Competitive Compensation: Competitive salary and equity
  packages for all employees

  🏥 Healthcare Plan: Platinum medical, dental, and vision

  🛡️ Free life insurance: Including long-term disability &
  short-term disability

  🏄 Unlimited PTO: Uncapped vacation days & paid holidays

  👶 Family Leave: Maternity & paternity

  📈 401(k) Contribution: Assured contributes 3% of your
  income, even if you don't contribute

  🏠 WFH Benefits: Lunch on us 2x/week, monthly phone stipend &
  other home office perks

  👪 Health FSAs & HSAs: Pre-tax accounts for out-of-pocket
  medical expenses

  🤝 Team events & Offsites: We're remote, but we regularly get
  together

