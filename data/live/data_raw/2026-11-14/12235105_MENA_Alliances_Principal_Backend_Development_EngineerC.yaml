description: |
  This is a remote position.



  We are hiring a Principal Backend Development Engineer in
  UAE & Saudi Arabia to design and lead the build of high-
  performance backend systems in C++. You will set technical
  direction, solve the hardest engineering problems, and raise
  the standard of the whole team. This is a hands-on senior
  role with wide influence.


   Key Responsibilities



  - Design and build scalable, low-latency backend services in
    modern C++ (C++17 or later).
  - Own the architecture of core backend systems and make clear,
    well-reasoned technical decisions.
  - Lead design and code reviews, and set engineering standards
    for quality, testing and performance.
  - Profile and optimise code for speed, memory use and
    concurrency.
  - Build and improve distributed systems, APIs and data
    pipelines that are reliable in production.
  - Mentor engineers and help grow the team's technical skills.
  - Work with product, infrastructure and other engineering
    teams to turn requirements into working systems.
  - Help keep production stable: investigate incidents, find
    root causes and prevent repeats.







    Requirements Required Qualifications



  - 10+ years of professional software development, with at
    least 7 years building backend systems in C++.
  - Strong command of modern C++: STL, templates, memory
    management, multithreading and concurrency.
  - Proven experience designing and delivering large-scale or
    high-performance backend systems.
  - Solid knowledge of Linux, network programming and
    distributed systems.
  - Experience with performance profiling and debugging tools.
  - Experience with databases and data storage design.
  - Track record of technical leadership, mentoring and
    influencing architecture.
  - Bachelor's degree in Computer Science, Engineering or a
    related field, or equivalent experience.
  - Strong written and spoken English.

   Preferred Qualifications



  - Experience with low-latency or high-throughput systems.
  - Familiarity with cloud platforms (AWS, Azure or GCP),
    containers and Kubernetes.
  - Experience with CI/CD pipelines and automated testing.
  - Working knowledge of another language such as Python, Go or
    Rust.
  - Arabic language skills.







    Benefits

  - Competitive salary: A package that reflects principal-level
    experience.
  - Great work environment: A supportive, professional team that
    values your expertise.
  - Room to grow: Opportunities to lead, learn and advance your
    career.
