description: |
  Vendelux is building the category-defining platform for
  event marketing intelligence.

  Events are one of the largest and most impactful marketing
  channels, yet historically one of the least measurable.
  Vendelux brings transparency and performance to this space —
  helping companies discover, evaluate, and optimize their
  event strategy with data.

  Our platform powers thousands of event decisions by
  delivering proprietary, AI-driven insights across hundreds
  of thousands of events globally. At the core of our platform
  is a robust ecosystem of event organizer partnerships —
  where organizers share first-party data, enabling richer
  insights for customers while receiving benchmarking and
  audience intelligence in return. From identifying the
  highest ROI conferences to enabling targeted meeting
  programs, Vendelux helps companies turn events into a
  predictable and scalable growth engine.

  In addition, Vendelux Meetings extends our platform by
  turning insights into pipeline — using AI to identify high-
  value attendees and proactively book 1:1 meetings between
  our customers and their ideal prospects at events. This
  enables go-to-market teams to drive measurable ROI and
  maximize every event interaction.

  Founded in 2021, Vendelux is a Series B SaaS company backed
  by top-tier investors including Tribeca Ventures, FirstMark
  and Hubspot Ventures. We partner with many of the fastest-
  growing companies in the world, and our team includes
  leaders from Bain, ZoomInfo, Shutterstock, FanDuel, Compass,
  Airbnb, Jet.com. and beyond.

  ________________

  Data-driven marketers have plenty of tools to optimize their
  digital ad spend and verify that their ads showed where they
  were supposed to. We build the same kinds of tools, but for
  data-driven event marketers, who’ve previously been limited
  to scanning conference badges at their booth.

  We're growing, and looking for Staff Software Engineers to
  ship critical features and drive key infrastructure changes.

  This is a full-time role based in NYC, reporting directly to
  our Head of Engineering. It's hybrid, 3–4 days a week in our
  NYC office depending on your location.

  As a Staff Engineer at Vendelux, you will help shape the
  technical strategy for our products and systems.

  What You'll Do

  - Be the technical owner for features end-to-end, including
    the systems that power our data platforms and best-in-
    class web application.
  - Ship high quality, secure, and well-tested software that
    scales as highly distributed systems, using incremental
    deliveries based on data driven prioritization and
    decisions.
  - Solve interesting and challenging technical problems,
    coordinating technical roadmap deliveries across our
    product team and front end engineers.
  - Collaborate with our operations and revenue teams, as well
    as our users to respond, react, and plan feature delivery
    based on user feedback and analytics.
  - Identify opportunities to work across our stack, and areas
    of the business, to help meet the needs of a quickly
    scaling business and product.
  - Work closely with our leadership team to define our product
    roadmap and technical strategy, and continuously improve
    our development process and engineering practices.
  - Be a technical leader and valued contributor in an
    autonomous, cross-functional agile team.
  - Mentor a growing team of engineers through pair programming
    and code reviews, on performant, scalable engineering
    principles, with a focus on iterative delivery.

  Who You Are

  - 10+ years of experience building complex applications using
    a modern language, like Python and/or Typescript.
  - Experience designing, deploying and operating distributed
    services on AWS or GCP in production, using the best
    components for the job.
  - Experience moving, ingesting, and transforming data at
    scale.
  - Track record of shaping and shipping valuable features.
  - Judgment to take on technical debt and risk where
    appropriate.
  - Comfort with modern AI tools to accelerate development.
  - Strong written, verbal, and presentation skills.
  - The humor and humility to maintain perspective during fast-
    paced work.
  - You are versed in infrastructure as code (IaC), preferably
    with Pulumi.
  - You know a thing or two about network security and
    protecting production applications.
  - Strong drive to proliferate best practices in your areas of
    expertise.
  - You build in the open, and encourage others who are
    interested in your areas of work.

  Our stack:

  - Frontend: Typescript, React, MUI/Shadcn, Node.js
  - Backend: Python, Django, Typescript, Node.js, MySQL,
    Postgres, AWS, GCP
  - Data: Python, Dagster, Snowflake
  - Other tools: Linear, GitHub, Datadog, Cursor / Claude Code

  Benefits

  - Competitive base salary and bonus
  - Equity
  - Healthcare covering medical, dental and vision
  - 401(k)
  - Catered lunch every day in our NYC office
  - Unlimited PTO plus two company-wide shutdowns during the
    July 4th week and the Christmas – New Year's week

  Not all candidates will check all of the requirements listed
  above and that’s ok! We are open to great people from non-
  traditional backgrounds.

  Vendelux is proud to be an equal opportunity workplace. We
  are committed to equal opportunity regardless of race,
  color, ancestry, religion, gender, gender identity, parental
  or pregnancy status, national origin, sexual orientation,
  age, citizenship, marital status, disability, or veteran
  status.
