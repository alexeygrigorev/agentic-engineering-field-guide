description: |
  About Amplify

  Amplify helps teachers bring delight and rigor to students
  every day. We have become a leader in K–12 literacy,
  biliteracy, math, and science by building inspiring teaching
  and learning experiences based on research. The Amplify
  Classroom platform combines curriculum, assessment, and
  supplemental learning into one coherent high-quality
  instructional system. A pioneer in education since 2000,
  Amplify has developed deep relationships in states and
  districts by partnering with educators to drive
  implementation quality and improved outcomes. Today, Amplify
  serves more than 18 million students and teachers across all
  50 states and on six continents. For more information, visit
  Amplify.com.

  Job Description Summary

  Amplify is where engineers build software that lands in real
  classrooms with real students and teachers, every day. What
  we build has to work reliably at scale, in schools with
  inconsistent connectivity, for users who don’t have time for
  things to break.

  We’re looking for a Senior Full-Stack Software Engineer
  who’s pragmatic about how software gets built, cares about
  the people who use it, and is comfortable operating across
  the stack. You’ll write and review both code and tests, own
  what you ship in production, and help the engineers around
  you get better. We expect you’ll use AI thoughtfully and
  pragmatically, knowing where it can help you be more
  productive and that it will never replace your own good
  judgment.

  Note: "We are considering candidates for both the Senior
  Full-Stack Software Engineer level and the Staff Full-Stack
  Software Engineer level. You’ll be considered for the level
  that best aligns with your relevant experience,
  qualifications, and interview performance."

  Essential Responsibilities

  - Writing, testing, and shipping code. You’ll work across the
    stack, primarily in React and TypeScript on the front end,
    with Node.js and AWS underneath. What you build will be
    used in real classrooms every day, so you care about
    getting it right, not just getting it done.
  - Owning what you ship. You’re responsible for the code you
    put into production, including monitoring, debugging, and
    incident response. You understand that blamelessness and
    responsibility are part of the same spectrum of ownership.
  - Improving the codebase. You bring a sharp eye for clarity,
    maintainability, and pragmatic tradeoffs. You catch the
    things that will cause problems down the line, and you’re
    proud of how much code you refactor and delete.
  - Helping the engineers around you to get better. Whether
    through code review, pairing, or mentorship, you raise the
    team's level, not just the codebase. You’re generous with
    what you know and direct about what you see.
  - Building with AI. AI is changing how software gets
    developed, and you’re actively engaged with that shift.
    You use these tools to work with more confidence, not to
    replace your own knowledge and judgment.
  - Collaborating across disciplines. You work with product
    managers, designers, and education experts to turn complex
    requirements into software that makes sense to the people
    who use it. You push back when a requirement doesn’t hold
    up technically, and you listen when someone who’s been in
    a classroom tells you your design doesn’t work there.

  Required Qualifications

  - Education & Experience: BS/MS in Computer Science or
    equivalent degree or training, with 5+ years of
    professional full-stack software development experience.
  - Software Design & Engineering Practices: Strong
    understanding of good software design principles and
    modern engineering practices, with experience working in
    complex systems and large codebases.
  - Frontend Development: 5+ years of hands-on experience with
    modern frontend frameworks, including React, to build
    production-grade user experiences.
  - Backend & Systems: 5+ years of hands-on experience with
    modern backend web technologies, including Node.js, and
    the ability to reason about scalable, maintainable service
    design.
  - Communication & Collaboration: Ability to articulate
    technical concepts clearly, verbally and in writing, and
    to thrive in a fast-paced, collaborative environment
    through self-driven learning.
  - Mission Alignment: A genuine passion for education products
    and a commitment to building tools that are more equitable
    and accessible for all learners.

  Preferred Qualifications

  - Data Stores: Experience with modern data stores such as
    PostgreSQL, DynamoDB, Mongo, and Snowflake.
  - Cloud Infrastructure: Hands-on experience managing cloud-
    based infrastructure using tools like Serverless, Datadog,
    Terraform, and Docker.
  - Testing: Proficiency in automated testing techniques using
    frameworks like Jest and WebdriverIO.
  - Languages and Frameworks: Experience with Java
  - Ed-Tech Experience: Prior experience in education or ed-tech
    environments.

  Don't let a missing qualification stop you from applying. We
  hire for potential and curiosity as much as experience. If
  this role sounds like you, we'd love to hear from you.

  Amplify is an Equal Opportunity Employer. Amplify makes
  employment decisions based on qualifications and merit, and
  does not discriminate based on race, color, religion, sex,
  sexual orientation, gender identity, national origin, age,
  disability status, veteran status, or any other legally
  protected characteristic or status.

  Amplify is committed to providing reasonable accommodations
  for qualified individuals with disabilities, including
  disabled veterans. If you have a disability and need an
  accommodation in connection with the application or hiring
  process, please email hiringaccommodations@amplify.com.

  If you are selected for employment, a background check will
  be required. As required by state and local laws and
  district policies, you may be required to provide additional
  documentation, such as proof of vaccination, or submit to
  enhanced background screening, such as fingerprinting.

  Amplify is an E-Verify participant.
