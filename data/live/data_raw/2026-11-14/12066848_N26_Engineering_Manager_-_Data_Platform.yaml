description: |
  About the opportunity

  We are seeking an experienced and visionary Engineering
  Manager to lead one of our Data Platform teams, currently
  undergoing a fundamental transformation from a traditional,
  service-oriented model into a product-oriented platform team
  focused on automation, scalability, integration, and
  developer enablement.

  As Engineering Manager, you will play a pivotal role in
  accelerating this transition, guiding the team through a
  challenging but high-potential journey.

  You will be responsible for shaping and executing long-term
  technical and organizational strategies that enable scalable
  ownership models across the company, allowing teams to
  safely and autonomously leverage platform capabilities. Your
  leadership will be key to evolving a team with strong
  operational foundations into a high-impact, autonomous group
  of engineers who deliver reliable and compliant platform
  solutions, empower development teams, and contribute to the
  broader platform ecosystem. You will have end to end
  ownership of the team’s scope, including strategy,
  execution, and organizational design.This role is an
  opportunity to shape the future of our Data Platform,
  defining how teams across the company build, operate, and
  scale data and AI-driven products in a compliant and
  reliable way.

  In this role, you will:

  - Define and drive the strategic evolution of the team towards
    building a modern, scalable data platform that enables
    advanced data and AI use cases by default, without
    requiring bespoke solutions or direct platform team
    involvement
  - Enable development teams to safely and autonomously leverage
    data and platform capabilities through robust tooling,
    guardrails, and well-defined interfaces.
  - Establish a long-term roadmap that aligns data platform
    capabilities with emerging AI use cases, product needs,
    and regulatory constraints.
  - Build and grow a high-performing, cross-functional team
    capable of delivering reliable, scalable, and compliant
    platform solutions
  - Shape the team’s culture by promoting initiative, critical
    thinking, technical leadership, and shared responsibility
    across the platform.
  - Coach and develop engineers to strengthen their skills
    across data, infrastructure, and platform engineering,
    while raising the bar on ownership and delivery.
  - Take a proactive role in performance management, ensuring
    the team continuously evolves towards autonomy, maturity,
    and impact.
  - Act as a key liaison between Engineering, Product, Security,
    and other stakeholders to represent the team’s roadmap and
    priorities.

  What you need to be successful

  Background

  - Proven experience leading high-impact engineering teams in a
    Platform, Infrastructure, Machine Learning Engineering
    context, ideally within regulated, complex technical
    environments.
  - Strong track record in transforming teams, developing both
    skills and mindset to support long-term strategic goals.
  - Experience with public cloud providers, ideally AWS, and an
    understanding of how cloud-native services impact data
    architecture and operations.
  - Prior exposure to or working knowledge of Machine Learning
    workflows or MLOps lifecycles is a definite plus, though
    not required.

  Skills

  - Strong understanding of data platform architectures and the
    trade-offs involved in building and operating them at
    scale.
  - Familiarity with platform engineering principles and
    practices, including automation, observability, IaC, and
    secure-by-default design.
  - Previous experience with AI/ML platform concepts (e.g.,
    feature stores, model deployment patterns, model training
    pipelines, generative AI) to effectively empathize with
    and support AI/ML stakeholder teams is advantageous.
  - Strong leadership in people and performance management, with
    experience coaching engineers and influencing team
    culture.
  - Ability to navigate complex environments, balancing speed,
    reliability, and risk, with an understanding of regulatory
    constraints as a plus.
  - Excellent communication and stakeholder management skills;
    able to create alignment across engineering, product, and
    business.
  - Strategic thinker with the ability to translate long-term
    vision into clear plans and team evolution.
  - Full professional proficiency in English.

  What’s in it for you

  - Accelerate your career growth by joining one of Europe’s
    most talked about disruptors 🚀.
  - Employee benefits that range from a competitive personal
    development budget, work from home budget, discounts to
    fitness & wellness memberships, language apps and public
    transportation.
  - As an N26 employee you will have access to a Premium
    subscription on your personal N26 bank account. As well as
    subscriptions for friends and family members.
  - Vacation days vary depending on your location of work.
    Additional day of annual leave for each year of service.
  - The opportunity to work on a data platform that enables real
    AI use cases at scale, with space to innovate and shape
    how these capabilities are built and adopted across the
    company..
  - A relocation package with visa support for those who need
    it.

  Who we are:

  N26 has reimagined banking for today’s digital world.
  Technology and design empower everything we do and it’s how
  we are building the global banking platform the world loves
  to use.

  We've eliminated physical branches, paperwork, and hidden
  fees for an elegant digital experience and supreme savings.
  Giving people the power to live and bank their way is what
  gets us out of bed in the morning and inspires the work that
  we do.

  Founded in 2013, N26 now has more than 8 million customers
  in 24 markets. We are headquartered in Berlin with offices
  in multiple cities across Europe, including Vienna and
  Barcelona, and a 1,500-strong team of more than 80
  nationalities.

  Equal Opportunities:

  We recognize that our strength lies in our people and the
  varied perspectives they bring to our workforce. We strive
  to build talented and diverse teams to drive our business
  success and empower our people to reach their full
  potential.

  We genuinely welcome and encourage applications from people
  of all backgrounds, cultures, genders, sexual orientations,
  abilities, neurodiversities, and ages. We're committed to
  creating an inclusive workspace where everyone feels valued
  and respected, free from harassment and discrimination. If
  there's anything you need to make the application process
  work for you, please let us know by reaching out to
  candidate.exp@n26.com.

  Visit our website to learn more about Diversity, Equity, &
  Inclusion at N26.
