description: |
  About FlexTrade Systems:

  FlexTrade Systems is a provider of customized multi-asset
  execution and order management trading solutions for buy-
  and sell-side financial institutions. Through deep client
  partnerships with some of the world's largest, most complex,
  and demanding capital markets firms, we develop the flexible
  tools, technology, and innovation that deliver our clients a
  competitive edge. Our globally distributed engineering teams
  focus on adaptable technology and open architecture to
  develop highly sophisticated trading solutions that can
  automate and scale with your business strategies.

  At FlexTrade, we hold our values close to heart, with pride
  and gratitude, as they guide us in everything that we do. We
  are dedicated to giving our clients a competitive edge,
  taking ownership of our responsibilities, being flexible to
  adapt to an ever-changing environment and technology,
  bringing integrity to every interaction, and continuing to
  improve, grow together, and collaborate as one team. All of
  these, while having fun, truly make FlexTrade a wonderful
  place to work.

  Job Summary:

  OMS Implementation and Support Engineers are responsible for
  all technical activities associated with the deployment and
  ongoing support of the FlexTrade Order Management System for
  Sell Side clients. Support Engineers design, configure,
  test, troubleshoot and develop solutions to provide best of
  breed functionality to our clients. Support Engineers work
  closely with internal and external resources throughout the
  Sell Side OMS vertical, including Product and Project
  Managers, Business Analysts, Quality Assurance Testers,
  Developers and Trading Desk personnel.

  Main Responsibilities:

  - Configure systems and workflows for new client deployments
    and upgrades.
  - Ensure the availability of systems and workflows for
    existing clients.
  - Troubleshoot and mitigate production system issues and
    outages.
  - Contribute technical expertise when working with internal
    and external resources to deliver value added
    functionality or to resolve production issues.

  - Bachelor’s degree in computer science
  - 3 to 5 years of technical work experience in a client
    implementation and/or support environment.
  - Strong problem-solving skills
  - Experience with UNIX based systems.
  - Experience with Database systems (SQL Server, Sybase)
  - Experience with scripting (Python, Perl/Shell)
  - Good understanding of the Software Development Life Cycle
  - Solid understanding of Broker Dealer workflows

  Desired Skills:

  - Good programming skills (C++, JAVA)
  - Strong work ethic
  - Strong organizational skills
  - Ability to work in a team environment
  - Good oral and written communication skills

  Does this sound like you? We would love to hear from you.
  Please use the link on this page to apply, and we will get
  back to you as soon as we are able. For more information
  visit http://flextrade.com or follow us on twitter and
  LinkedIn for the latest updates.



