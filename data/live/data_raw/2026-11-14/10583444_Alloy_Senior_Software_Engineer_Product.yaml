description: |
  Alloy is where you belong!

  Alloy is the AI-powered identity and fraud prevention
  platform that accelerates onboarding, stops fraud, and
  scales compliance across the customer lifecycle so financial
  organizations can grow without limits. More than 900 of the
  world's leading financial institutions and fintechs trust
  Alloy for smarter risk management that drives growth.
  Through our values: Be Bold, Go Fast, Collaborate, and
  Celebrate Our Differences, we are creating a workplace where
  you can grow, thrive, and belong. See how we’ve been
  continuously recognized and named one of Inc. Magazine’s
  Best Workplaces, Forbes America’s Best Startup Employers,
  Best Fintech to Work for by American Banker, year after
  year. Check out our investors and read more about us here.

  About the team

  The Decisioning vertical of our engineering department
  builds the engine that powers how financial institutions
  evaluate, approve, and act on risk. We own the core rules,
  workflows, and data pipelines that financial organizations
  rely on to make real-time decisions at scale.

  The Build - Oak team owns a central part of Decisioning: the
  core services institutions use to evaluate, approve, and act
  on risk in real time, at scale. We build tools that power
  the rules, workflows, and data pipelines behind those
  decisions: a flexible engine that teams extend across any
  kind of customer data, the lists clients use to flag, block,
  or approve accounts at scale, and the AI that explains why a
  case was flagged and what to do next.

  Alloy operates in a hybrid-work environment. We look to
  foster collaboration and community by having our local
  employees onsite three days a week.

  What you'll do

  You'll own core pieces of the systems Alloy uses to catch
  fraud and risk at onboarding and throughout a customer's
  lifecycle, and help shape where our newest AI feature goes
  next, with real room to define the work yourself.

  - Design and ship performant Postgres queries and Node.js APIs
    for our decision engine, which lets financial institutions
    build custom fraud and risk checks across any type of
    customer data, built to hold up under real-time SLA
    constraints
  - Own, end to end, the systems that let clients maintain their
    own lists of people, accounts, or countries to
    automatically flag, block, or approve, keeping them fast
    and reliable on OpenSearch as they scale to millions of
    records
  - Build and extend the AI feature that explains why a case was
    flagged for manual review and recommends a decision,
    working with AWS Bedrock and async tools like SQS and
    webhooks.
  - Talk directly with internal stakeholders and, at times,
    customers and channel partners, to turn ambiguous requests
    into scoped, generalizable features
  - Partner with the rest of the team on system design decisions
    as Decisioning's services expand to support new
    enterprise-scale rollouts

  Who we’re looking for

  Must-haves:

  - 5+ years of professional software engineering experience,
    with real ownership of backend services in production
  - Hands-on experience writing and optimizing SQL. You're
    comfortable reasoning about query plans, indexing, and
    performance under load, not just writing queries that work
  - Production experience with Node.js and TypeScript
  - Ability to gather requirements from an ambiguous ask, decide
    what to build, and iterate.
  - A track record of talking directly with internal
    stakeholders or customers to clarify scope, not just
    executing tickets handed down

  Nice-to-haves:

  - Experience with OpenSearch, Elasticsearch, or a similar
    search and indexing system at scale
  - Experience integrating LLMs into a production feature, using
    Bedrock or a similar platform
  - Fintech, banking, or other regulated industry experience
  - React or similar frontend experience. This team leans
    backend, but we still ship full-stack when needed

  We're a lean team, so your impact will be felt immediately,
  and opportunities will grow as the company scales up. If
  this all sounds like a good fit for you, why not join us?

  Alloy is committed to fair and equitable compensation
  practices. Below is the anticipated starting base
  compensation range for this role; however, pay may vary
  depending on job-related knowledge, in-demand skills,
  relevant experience, and/or geography. In addition to a
  competitive base salary, this position is also eligible for
  equity awards in the form of stock options (ISOs) as well as
  a competitive total benefits package. Your recruiter will be
  happy to walk you through the details and what compensation
  could look like for you specifically!

  This position has a base salary range of $166,000 -
  $209,000.

  Benefits and Perks

  We invest in your health, your financial future, and your
  growth. Here's what you can expect:

  - Medical, dental, and vision coverage from the first of the
    month after you join, including $0 employee-only premium
    options, plus FSA options and an Alloy-funded HSA with our
    high-deductible plan
  - Healia: if your spouse or partner has health insurance
    through their employer, Alloy may cover up to 100% of your
    family's costs on their plan
  - Alloy-paid One Medical membership, Spring Health therapy and
    coaching, Superpower advanced lab testing, and ClassPass
    credits
  - Stock options for every full-time employee
  - 401(k) with a 100% match up to 4% of pay, vested
    immediately, plus a mega backdoor Roth option
  - Free, unlimited 1:1 financial planning through Addition
    Wealth
  - Unlimited PTO plus company holidays
  - 16 weeks of fully paid parental leave for eligible birthing,
    non-birthing, adoptive, and foster parents
  - Annual learning and development stipend, plus a home office
    stipend to set up your workspace
  - Hybrid work environment: most team members work from our HQ
    in Union Square, Manhattan, Tuesday through Thursday, with
    in-office expectations that vary by role. Catered lunches
    from a variety of local restaurants and frequent employee-
    organized cultural events bring energy to the office. On
    Mondays and Fridays, many employees work remotely, while
    some take advantage of the quieter office.

