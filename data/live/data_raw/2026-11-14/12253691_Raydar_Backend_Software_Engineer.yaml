description: |
  About the company

  Our client is a fast-growing financial technology company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Design and run data pipelines and cloud infrastructure for a
  small engineering team, taking a senior hands-on role that
  spans building, shipping and supporting production systems
  end to end. The position also involves working directly with
  early customers to shape what gets built.

  What you'll do

  - Build pipelines that capture web data and turn it into
    dependable feeds for customers.

  - Design security-focused components that verify data
    integrity and protect confidential information during
    customer evaluation.

  - Help set up and evolve core cloud infrastructure and
    relational database architecture, including deployment.

  - Build language model features that improve communication
    between marketplace participants, using hosted model
    inference.

  - Partner with a small group of early customers to scope and
    deliver their first data feeds.

  Requirements

  What we're looking for

  - Strong backend and data engineering experience in Python.

  - A track record of owning a production system from design
    through launch and ongoing support.

  - Product judgment, comfort speaking with customers, and the
    ability to scope unclear problems and ship with a very
    small team.

  - Genuine interest in complex infrastructure, shown through
    direct experience or a history of learning new domains
    quickly.

  - At least 2 years of relevant experience.

  Benefits

  Compensation and benefits

  - Base salary: USD 150,000 to 215,000 per year

  - Health insurance

  - Commuter benefits

  - Tech equipment

  Location and work model

  - New York City, NY, United States

  - On-site, in person, 5 days a week in the office

  - Full-time
