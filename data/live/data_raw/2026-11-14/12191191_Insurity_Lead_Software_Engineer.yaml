  Who We Are

  Insurity empowers insurance organizations to quickly
  capitalize on new opportunities by delivering the world’s
  most configurable, cloud-native, easy-to-use, and
  intuitively analytical insurance software. Just as
  importantly, we empower our people—providing the tools,
  support, and opportunities they need to grow and succeed.

  We don’t just make bold promises—we deliver results. As the
  largest cloud-based software provider for the Property &
  Casualty market, Insurity is trusted by 22 of the top 25 P&C
  carriers and 7 of the top 10 wholesale brokers in the MGA
  space. Behind that trust is a team that delivers exceptional
  value and deep industry expertise.

  While our technology sets us apart, it’s our people who
  truly make the difference. At Insurity, you’ll collaborate
  with some of the most creative and knowledgeable minds in
  insurance tech—in a culture that fosters innovation,
  teamwork, and continuous learning. Our award-winning
  onboarding experience welcomes and supports you from the
  moment you accept our offer.

  Ready to grow your career with an industry leader? Apply
  today—we’re excited to welcome you. #UatInsurity

  Insurity’s Next Lead Software Engineer

  We are looking for an experienced software engineer that has
  experience with the Microsoft full stack (.net / Sql Server)
  who has the ability to work with others to create
  requirements, digest, plan and work through complex problems
  and has solid critical thinking skills.  They should also
  have excellent communication skills to work on a team with
  others and help refine and grow requests.  Being an
  experienced professional candidates should welcome the
  opportunity to begin mentoring, guiding and growing the next
  generation of developers.  Working collaboratively with
  other groups on multi-faceted projects and occasionally
  building out and working with third party vendors / API's is
  part of the adventure.

   What Our Lead Software Engineer Will Do

  Participate in SDLC estimation and development processes and
  providing light/general guidance to team members.

  Design

  - Determine & define technical solutions of any items
  - Review other developers' design solutions
  - Knowledge of common design patterns
  - Create designs to reduce or eliminate maintenance and
    ongoing manual testing validation
  - Work to reduce complexity in the code base
  - Create design proposals and prototyping support for new
    problem spaces and first- time development of highly
    complex solutions or new & emerging technology

  Development

  - Develop technical documentation for software solutions for
    targeted audience, which may include internal and external
    customers
  - Develop solutions for issues and enhancements
  - Helps to set coding standards
  - Follows Insurity standards for coding and documentation
  - Provide technical leadership and oversight to team members,
    including 3rd party partners
  - Responsible for the estimating and planning of projects &
    solutions
  - Provide peer-review of designs, code, and artifact delivery
  - Provides in-depth technical troubleshooting and defect
    investigation & remediation

  Test

  - Write code and unit tests according to Insurity standards,
    following an approved technical solution, for enhancements
    and bug fixes
  - Develop unit tests for code changes and assigned use cases

  Documentation

  - Documents code regularly
  - Create an impact assessment doc
  - Prepare and present a technical solution e.g. with
    PowerPoint / Lucid / etc

  Leadership

  - Provide leadership, coaching, mentorship and technical
    guidance to team members
  - Provide performance feedback on team members
  - Prepare and present to all stakeholders, including customers
  - Stay up to date on industry and job-related trends and best
    practices, including reading relevant publications,
    articles, blogs, etc.
  - Other duties as assigned

  Who We’re Looking For 

  - 6-8+ years of software development experience.
  - Bachelor’s degree in a related field; equivalent work
    experience may be considered.
  - Analytical and critical thinking are paramount.  Candidates
    must be able to learn, digest and make educated decisions.
  - Written and oral communication, including accurately
    presenting technical information to varied audiences.
  - Demonstrated ability to independently define technical
    solutions, review designs, and lead complex development
    work.
  - Strong development experience with the Microsoft full-stack
    technologies (.Net Framework, .Net, Sql Server).
  - Experience with Angular is strongly desired.
  - Insurance experience is helpful; a willingness to learn
    insurance is a must.
  - Work planning, prioritization, organization, and attention
    to detail.
  - Ability to work effectively both independently and
    collaboratively; self-direction and continuous learning.
  - Ability to give and receive feedback constructively,
    facilitate meetings, and support change.
  - Advanced use of development AI, multi-agent approaches, and
    multiple tools.  Must be able to understand when it is
    making proper suggestions and when it is not.
  - 0-25% travel

  What’s In It For U 

  Work Where You Thrive  Find the work environment that
  supports your best—whether that’s remote, in-office, or
  hybrid—depending on your role and location. Our Flex First
  Workforce approach offers many fully remote opportunities,
  while some teams follow hybrid or in-office schedules to
  stay connected and collaborative.

  Take Time When You Need It  We trust our team to manage
  their time with our Open PTO Policy, empowering you to
  recharge when it matters most.

  Benefits That Start on Day One  Enjoy comprehensive health
  coverage and employer-matched retirement savings right from
  your first day—because we know how important these are to
  you.

  Living Our Values Every Day  Our core values are more than
  words on a wall—they guide how we hire, grow, and retain the
  very best talent.

  Award-Winning Onboarding  From your first day to your first
  anniversary, our onboarding program is designed to set you
  up for success and help you make an immediate impact.

  Grow Your Career from Within  We believe in promoting from
  within. In fact, over 25% of our open roles are filled by
  internal candidates.

  Mentorship That Matters  Our mentorship program connects you
  with experienced leaders who are committed to helping you
  grow both personally and professionally.

  Insurity Podcasts  Explore podcasts from our Learning &
  Development team for deeper insight into Insurity products,
  company innovation, and the business as a whole.

  Keep Learning, Always  Fuel your growth with full access to
  LinkedIn Learning and Kaplan—because continuous development
  is key to success.

  Invest in Your Future—And Your Family’s  Through our
  partnership with the University of Arizona Global Campus,
  you and your family can access discounted tuition and pursue
  educational goals affordably.

  Earn When You Refer  Love where you work? Invite others to
  join us! Our Employee Referral Bonus program rewards you for
  bringing great people on board.

  Providing pay transparency helps you make the best decision
  for you.  We continuously analyze and update our salary
  ranges for our roles according to market trends to not only
  ensure our employees are paid fairly, but also help close
  gender, race, and disability wage gaps. Along with the
  benefits listed above, the career level salary range for
  this role is $84,000 to $165,000. We share a career level
  salary as a guideline; however, actual salary may vary based
  on your experience and qualifications. If your application
  advances, your recruiter will review these details with you
  during a video interview.

