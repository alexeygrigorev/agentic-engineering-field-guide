description: |
  Miller-Remick is a full-service MEP engineering firm looking
  for energetic, self-motivated, and innovative individuals to
  join our team. If you think you are a good fit for this
  role, we encourage you to apply.

  We are looking for a Project Manager that can demonstrate
  the successful delivery of multi-discipline design packages
  on capital projects ranging from $5M to $100M, coordinating
  teams that include structural, mechanical, and electrical
  engineers and designers. This position may be filled
  anywhere in the US.

  In addition to the basic qualifications listed, the
  successful candidate shall possess the skills required to
  successfully develop and execute project tasks and
  deliverables, be a collaborative team player, manage
  multiple complex tasks simultaneously, establish and manage
  priorities, and have a strong drive to deliver a quality
  project for customers.

  Our clients include federal agencies (e.g. Department of
  Veterans Affairs, Department of Defense, General Services
  Administration, and the Federal Bureau of Prisons), as well
  as state and local governments. Projects have varied degrees
  of complexity and a wide range of estimated construction
  costs and include new construction and renovations of
  hospitals, healthcare and military facilities, federal
  office buildings and courthouses, state and local government
  buildings, research laboratories, corrections facilities and
  site utility infrastructure projects.

  Responsibilities and Requirements:

  - Project management functions include scope responsibilities,
    client management, scheduling, and financials.
  - Lead and manage projects from planning through design and
    construction.
  - Lead project team meetings and report project status to
    executive management.
  - Complete internal peer reviews and provide input in multi-
    discipline page turns, across all offices, to assist in
    the development of a comprehensive design.
  - Perform page turns prior to all major project deliverables.
  - Work closely with subconsultants and department design
    managers.
  - Assist in developing client capture plans and pursuit plans,
    proposals, and other business development and client
    engagement activities.
  - Develop and enhance client relationships, serve as the
    primary company contact, and deliver quality projects on
    time, within budget, and to the satisfaction of the
    client.
  - Administer relevant aspects of a formal quality program.
  - Marketing and business development support to include the
    identification of potential business opportunities.
  - Work with the leadership team to develop fees on complex
    projects.
  - Develop and maintain client relationships.

  Qualifications:

  - Bachelor’s degree in Mechanical Engineering, Structural
    Engineering, or Electrical Engineering.
  - At least 10 years of engineering experience, including a
    minimum of 4 years of experience as a PM.
  - PE, PMP, and/or equivalent license is preferred.
  - Experience in the healthcare and/or government contracting
    markets preferred but not required.
  - Excellent verbal and written communication skills.
  - Ability to perform project management responsibilities,
    working independently and in coordination with other team
    members and Project Managers.
  - Ability to manage multiple projects with multiple clients at
    varying stages of design/construction completion.
  - Travel as required to client sites.

  Miller-Remick does not provide visa sponsorship or support.
  Candidates are required to successfully complete a federal
  background check for security clearance.

  The anticipated salary range for this position is $130,000 -
  $170,000 annually. Actual compensation will be determined
  based on several factors, including experience,
  qualifications, education, certifications and licensure.

  About Miller-Remick

  We are a Service-Disabled Veteran-Owned Small Business
  committed to supporting our brave military and veterans
  through a comprehensive array of consulting engineering and
  construction management services with a focus on leadership,
  quality, and responsiveness.

  In addition to a competitive salary, our employees enjoy a
  full benefit package including medical, dental, and vision
  coverage, 401k with matching, PTO, and 12 paid holidays. For
  a general overview of our benefits, please visit our careers
  page at https://miller-remick.com/career-page/.

  We are an equal opportunity employer. We provide reasonable
  accommodations in accordance with applicable law.
