description: |
  About Supabase

  Supabase is the Postgres development platform, built by
  developers for developers. We provide a complete backend
  solution including Database, Auth, Storage, Edge Functions,
  Realtime, and Vector Search. All services are deeply
  integrated and designed for growth.

  About the Role

  We’re looking for a Software Engineer to join our AI Tooling
  team and help shape how developers and agents build with
  Supabase. You'll build and own our AI tooling, including
  agents, the MCP server, agent skills and the dashboard
  assistant, and as the space moves you'll build the tooling
  for new technologies too. You'll build it all eval-first:
  every tool ships with evals and metrics, so we know, with
  evidence, that it makes agents better rather than worse.

  You'll work closely with the Docs, CLI, Frontend and SDK
  teams, and with the AI Tooling Infrastructure engineers who
  run these services in production. Other teams contribute to
  AI Tooling to improve Supabase's agentic capabilities, and
  you'll help them do that while keeping the quality bar high.

  This role is ideal for someone who thrives in async, fast-
  paced environments and is excited about building developer
  tools that scale to millions.

  What You’ll Be Responsible For

  - Build and improve the AI tooling we run today, including the
    MCP server, agent skills, agents and the Assistant.
  - Make new Supabase products usable by agents from day one:
    tools, skills and evals for new product surfaces. Also
    build tooling for new AI technologies as they emerge:
    prototype quickly, evaluate honestly, and decide with the
    team what is worth taking to production.
  - Drive an eval-first approach: build and improve evals,
    instrumentation and feedback loops, measure tools against
    a no-tool baseline, and help define the quality KPIs and
    gates that stop regressions shipping.
  - Understand how customers and agents actually use what we
    ship, and turn that into improvements to our tooling,
    interfaces and documentation.
  - Design how documentation and product knowledge are exposed
    to agents, and measure whether it works.
  - Build patterns and tools that help customers add AI to their
    own apps, such as MCP on Edge Functions, vector embeddings
    and agents running on Edge Functions.
  - Enable teams to improve Supabase's agentic capabilities
    through contributions to AI Tooling: clear contribution
    paths, templates, documentation and review practice.
  - Centralise shared AI logic so teams reuse it rather than
    duplicate it.
  - Ship tools that are battle-tested, with strong tests,
    benchmarking and stress testing where it counts.
  - Work with the AI Tooling Infrastructure engineers on
    reliability, auth and hosting.
  - Work across Docs, CLI, Frontend, SDK and other teams to
    deliver one coherent developer experience, and stay close
    to the fast-moving AI ecosystem.

  You Might Be a Good Fit If You Must have:

  - Have 5+ years of experience in professional software
    engineering experience.
  - Write strong TypeScript and know the JavaScript ecosystem
    well: npm, ES modules, bundlers, compatibility.
  - Are deeply familiar with the AI ecosystem: current tools,
    agent patterns and practical trade-offs. You can tell a
    durable pattern from hype.
  - Have built developer tools, product interfaces or platform
    primitives used by other engineers.
  - Have designed or used evaluation frameworks to measure AI
    quality, reliability and task success, and understand
    baselines, variance and cost.
  - Have strong judgement about where AI improves workflows and
    how to avoid fragile or gimmicky experiences.
  - Write tests and validate reliability in real-world
    conditions.
  - Know Postgres and relational database practice.
  - Communicate clearly in writing, work across product,
    engineering and docs, and thrive in async, globally
    distributed teams.
  - Are comfortable navigating ambiguity and moving quickly.

  Nice to have:

  - Experience with vector databases and embeddings, ideally
    pgvector.
  - Examples of customer-facing AI features or agents you've
    shipped.
  - Examples of documentation or structured knowledge designed
    for developers or agents.
  - Experience with Braintrust or a similar eval and tracing
    platform, or setting up CI quality gates.
  - Open-source contributions or developer tooling you've
    maintained.
  - Experience across several product surfaces or teams.

  What We Offer

  - Fully RemoteWe hire globally. We believe you can do your
    best work from anywhere. There are no Supabase offices,
    but we provide a WeWork membership or co-working allowance
    you can use anywhere in the world.
  - ESOPEvery team member receives ESOP (equity ownership) in
    the company. We want everyone to share in the upside of
    what we’re building together.
  - Tech AllowanceUse this budget to set up your ideal work
    environment—laptop, monitor, headphones, or whatever helps
    you do your best work.
  - Health BenefitsSupabase covers 100% of health insurance for
    employees and 80% for dependents, wherever you are. Your
    wellbeing and your family’s health are important to us.
  - Annual Off-SitesOnce a year, the entire company gathers in a
    new city for a week of connection, collaboration, and fun.
    It’s a highlight of our year.
  - Flexible WorkWe operate asynchronously and trust you to
    manage your own time. You know what needs to be done and
    when.
  - Professional DevelopmentEvery team member receives an annual
    education allowance to spend on learning—courses, books,
    conferences, or anything that supports your growth.

  About the Team

  Supabase was born-remote and open-source-first. We believe
  our globally distributed team is our secret weapon in
  building tools developers love.

  - ~400 team members
  - 60+ countries
  - 20+ languages spoken
  - Over $1B raised (including our $500M Series F)
  - 540,000+ community members

  We move fast, build in public, and use what we ship. If it’s
  in your project, we probably use it in ours too. We believe
  deeply in the open-source ecosystem and strive to
  support—not replace—existing tools and communities.
