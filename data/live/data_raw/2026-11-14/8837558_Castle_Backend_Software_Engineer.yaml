description: |
  Castle is the finance app that saves homeowners time and
  money.

  - Homeowners use Castle to pay for and track all of their home
    expenses in one place. Castle then monitors those
    transactions for opportunities to save. The average Castle
    customer saves more than $10,000 on their home.
  - Housing affordability is a major problem in the U.S. At
    Castle, we believe that homeowners deserve better data
    when it comes to managing their biggest asset. We’re
    building payments infrastructure for the largest consumer
    category in the U.S. — to help people automate,
    consolidate, and reduce their spend.

  In this role you’ll be a foundational and versatile member
  of our engineering team, focused on building a simpler,
  smarter, and more intuitive experience for homeowners.
  You’ll collaborate closely with our Head of Engineering,
  Head of Design, and fellow engineers to bring to life a
  user-friendly app that clarifies complex home expense
  management and builds long-term trust with our customers.
  This role is perfect for someone who is passionate about
  solving complex problems and shaping a powerful product
  experience at an early-stage, high-growth company.

  Core Responsibilities Include:

  - Developing and maintaining REST APIs using Django.
  - Managing and optimizing our cloud infrastructure.
  - Overseeing CI/CD pipelines, as well as monitoring, logging,
    and alerting systems.
  - Building mission-critical features including:
    - Bill payment system for processing ACH and check payments;
    - AI-powered system for recording payments made outside of
      Castle environment;
    - Data pipeline that transforms customer data into insights.

  What you'll need:

  - Expertise with Python and Django framework.
  - Expertise in RESTful API design.
  - Experience with distributed systems design.
  - Strong experience with cloud infrastructure and related
    tools
  - Experience with CI/CD tools and practices.

  Qualifications:

  - Bachelor’s degree in Computer Science or related field (or
    equivalent practical experience).
  - Experience building and shipping production applications.
  - Experience in consumer fintech preferred.

