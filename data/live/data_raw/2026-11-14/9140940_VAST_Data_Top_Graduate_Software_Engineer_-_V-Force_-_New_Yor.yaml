  Bachelor’s degree in Computer Science, Software Engineering,
  Computer Engineering, or a related field

  from a leading university

  Strong academic performance (high GPA, honors, Dean’s List,
  or equivalent)

  Solid proficiency in at least one programming language: C,
  C++

  Strong foundation in data structures and algorithms

  Ability to write clean, readable, and well-documented code

  Excellent English communication skills (written and verbal)

  What We Offer

  - Opportunity to work in a cutting-edge tech environment in
    the heart of NY
  - Close mentorship from senior engineers
  - Clear career development path
