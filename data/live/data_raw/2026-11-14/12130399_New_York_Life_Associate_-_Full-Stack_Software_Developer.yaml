description: |
  Location Designation: Hybrid - 3 days per week  Technology,
  Data, AI and Ventures: Within the Tech, Data, AI, Ventures
  (TDAV) organization, our work is guided by a shared vision:
  deploying the power of technology, data, AI and ventures to
  accelerate sustainable competitive advantage for New York
  Life's businesses. We build solutions that power how we
  serve policy owners, agents, advisors and employees while
  delivering measurable business outcomes. Across technology,
  data, AI, cyber, product, digital experience, architecture
  and infrastructure, TDAV combines the scale and investment
  of an industry leader, access to leading-edge technologies
  and the opportunity to help shape how a world-class
  financial services company competes in the AI era - all
  backed by the stability and purpose of a mutual company
  built to last. Full-Stack Software Developer Role Overview
  We are seeking a motivated Full-Stack Software Developer
  with 1-2 years of professional software development
  experience to contribute to the development, enhancement,
  and support of modern cloud-based web applications. The
  developer will work alongside experienced engineers and
  technical leads to build AWS-based backend services and
  responsive frontend applications using React and TypeScript.
  The role will also support applications and integrations
  involving the Varicent Incentive Compensation Management
  (ICM) platform. As part of Technology, you'll contribute to
  New York Life's ongoing digital transformation by
  collaborating with developers, QA engineers, product owners,
  and other technology partners to deliver reliable, secure,
  scalable, and high-quality solutions. This role provides an
  opportunity to expand your experience across cloud-native
  development, enterprise application integration, automated
  testing, and modern DevOps practices. What You'll Do

  - Develop and enhance web application features across frontend
    and backend components under the guidance of senior
    developers and technical leads.
  - Build responsive, reusable, and maintainable frontend
    components using React, TypeScript, and Vite.
  - Develop and enhance backend services and REST APIs using AWS
    technologies such as Lambda, API Gateway, DynamoDB, and
    S3.
  - Support application functionality, configurations, data
    flows, and integrations involving the Varicent ICM
    platform.
  - Write clean, maintainable, secure, and well-tested code
    following established engineering standards and best
    practices.
  - Develop unit tests and participate in integration,
    regression, and automated testing activities.
  - Troubleshoot application and integration issues, perform
    root-cause analysis, and work collaboratively to implement
    solutions.
  - Participate in code reviews, sprint planning, technical
    discussions, and other Agile development activities.
  - Collaborate with developers, QA engineers, technical leads,
    product owners, and other technology partners throughout
    the software development lifecycle.
  - Follow established GitHub workflows, branching strategies,
    and CI/CD processes.
  - Work with AWS and container technologies such as EC2, ECR,
    Route 53, Docker, and related services as needed.

  What You'll Bring You will bring a solid foundation in
  software development, strong problem-solving skills, and an
  interest in building modern cloud-based enterprise
  applications. You are comfortable working with frontend and
  backend technologies and are eager to continue expanding
  your skills across the full application stack. You
  collaborate effectively with team members, communicate
  clearly, and demonstrate curiosity and a willingness to
  learn from experienced engineers. You are interested in
  modern engineering practices, cloud technologies, enterprise
  platforms, automation, and continuously improving the
  quality and maintainability of the solutions you develop.
  Required Skills

  - Bachelor's degree in Computer Science, Software Engineering,
    Information Technology, or a related technical field.
  - 1-2 years of professional software development experience,
    including relevant internship or co-op experience where
    applicable.
  - Hands-on experience with JavaScript/TypeScript and modern
    web application development.
  - Experience or strong working knowledge of React, including
    components, hooks, state management, and REST API
    integration.
  - Experience with or working knowledge of the Varicent
    Incentive Compensation Management (ICM) platform,
    including Varicent configurations, data flows,
    integrations, and application functionality.
  - Familiarity with backend development, REST APIs, and AWS
    cloud services such as Lambda, API Gateway, DynamoDB, and
    S3.
  - Experience with Git/GitHub, including source control,
    branching, pull requests, and collaborative development.
  - Understanding of software engineering fundamentals,
    debugging, unit testing, error handling, and secure coding
    practices.
  - Strong analytical, problem-solving, communication, and
    collaboration skills.

  Preferred Skills

  - Experience with TypeScript and Vite for frontend application
    development.
  - Exposure to additional AWS services such as EC2, ECR, Route
    53, IAM, and CloudWatch.
  - Familiarity with Docker, containerization, and CI/CD
    pipelines.
  - Experience with automated testing frameworks and frontend or
    API testing.
  - Familiarity with Infrastructure as Code (IaC), preferably
    Terraform.
  - Exposure to Python or another backend programming language.
  - Understanding of cloud security, application monitoring,
    logging, and observability.
  - Interest in cloud-native development, DevOps practices,
    automation, and emerging technologies such as Generative
    AI.

