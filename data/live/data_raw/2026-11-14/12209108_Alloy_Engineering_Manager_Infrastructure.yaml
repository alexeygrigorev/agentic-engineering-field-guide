description: |
  Alloy is where you belong!

  Alloy is the AI-powered identity and fraud prevention
  platform that accelerates onboarding, stops fraud, and
  scales compliance across the customer lifecycle so financial
  organizations can grow without limits. More than 900 of the
  world's leading financial institutions and fintechs trust
  Alloy for smarter risk management that drives growth.
  Through our values: Be Bold, Go Fast, Collaborate, and
  Celebrate Our Differences, we are creating a workplace where
  you can grow, thrive, and belong. See how we’ve been
  continuously recognized and named one of Inc. Magazine’s
  Best Workplaces, Forbes America’s Best Startup Employers,
  Best Fintech to Work for by American Banker, year after
  year.

  Check out our investors and read more about us here.

  About the team

  Every identity check and fraud decision Alloy makes for more
  than 900 banks and fintechs runs on the infrastructure this
  team builds. The Infrastructure team is seven senior
  engineers running 15+ Kubernetes clusters, 100+ databases,
  and a cell-based architecture that hosts some of the largest
  banks and fintechs in the country. The job now is making
  that scale reliable, secure, and operable with far less
  manual work, moving from fielding requests to automated,
  self-service platforms that let product engineers provision
  and ship on their own.

  Alloy operates in a hybrid-work environment. We look to
  foster collaboration and community by having our local
  employees onsite three days a week.

  What you'll be doing

  This is a player-coach role. You'll lead and grow the team
  while staying close to the work, and you'll own the
  technical and strategic direction for how Alloy runs in
  production.

  - Lead, coach, and develop a team of seven infrastructure and
    site reliability engineers through 1:1s, career
    conversations, design reviews, and pairing. Hire and
    onboard the engineers who join it.
  - Write and review production code and Terraform, lead design
    discussions, and take on scoped technical projects without
    becoming the team's bottleneck.
  - Own the roadmap and delivery for Kubernetes, databases,
    networking, private connectivity for enterprise clients,
    CI/CD, and cloud accounts, built to meet audit controls
    and scale globally.
  - Drive the shift from manual operations to automated and AI-
    assisted operations, from provisioning, upgrades, and
    migrations to self-service tooling and AI agents for
    incident triage and routine infrastructure work.
  - Set the bar for reliability and resilience across SLOs,
    disaster recovery, multi-region failover, and capacity.
    Join the on-call rotation and lead incident response with
    a focus on preventing the next one.
  - Make the architecture calls across infrastructure,
    reliability, and security, including build-vs-buy and cost
    tradeoffs.
  - Protect the team's focus and keep stakeholders aligned.
    Manage competing priorities, remove blockers, surface
    risks early, and say no when it matters.

  Who we’re looking for

  Must-haves:

  - 10+ years in infrastructure, platform, DevOps, or SRE roles,
    including at least 3 years leading an infrastructure,
    platform, or SRE team.
  - Current hands-on skills. You still design, build, and ship
    infrastructure yourself, with strong Terraform or similar
    Infrastructure as Code experience and proficiency in
    Python, Go, or another language.
  - Expert-level AWS knowledge (a professional or specialty
    certification, or equivalent experience) and production
    Kubernetes experience, including managing clusters and
    building the systems that deploy applications onto them.
  - A track record of running on-call rotations, leading
    incident response, and fixing what incidents reveal.
  - Experience hiring, onboarding, and coaching engineers
    through feedback, pairing, and delegation.
  - Based in New York City and able to work from our Union
    Square office three days a week.

  Nice-to-haves:

  - Hands-on use of AI tooling in engineering and operations,
    such as coding agents, agent harnesses, or AI-assisted
    incident response, with good judgment about where
    automation is safe in production.
  - Familiarity with SOC 2, ISO 27001, and PCI, ideally from a
    high-growth company with strict security requirements.
  - Experience troubleshooting distributed systems at scale with
    Datadog, CloudWatch, ELK, or similar observability tools.

  Alloy is committed to fair and equitable compensation
  practices. Below is the anticipated starting base
  compensation range for this role; however, pay may vary
  depending on job-related knowledge, in-demand skills,
  relevant experience, and/or geography. In addition to a
  competitive base salary, this position is also eligible for
  equity awards in the form of stock options (ISOs) as well as
  a competitive total benefits package. Your recruiter will be
  happy to walk you through the details and what compensation
  could look like for you specifically!

  This position has a base salary range of $222,000 to
  $280,000.

  Benefits and Perks

  We invest in your health, your financial future, and your
  growth. Here's what you can expect:

  - Medical, dental, and vision coverage from the first of the
    month after you join, including $0 employee-only premium
    options, plus FSA options and an Alloy-funded HSA with our
    high-deductible plan
  - Healia: if your spouse or partner has health insurance
    through their employer, Alloy may cover up to 100% of your
    family's costs on their plan
  - Alloy-paid One Medical membership, Spring Health therapy and
    coaching, Superpower advanced lab testing, and ClassPass
    credits
  - Stock options for every full-time employee
  - 401(k) with a 100% match up to 4% of pay, vested
    immediately, plus a mega backdoor Roth option
  - Free, unlimited 1:1 financial planning through Addition
    Wealth
  - Unlimited PTO plus company holidays
  - 16 weeks of fully paid parental leave for eligible birthing,
    non-birthing, adoptive, and foster parents
  - Annual learning and development stipend, plus a home office
    stipend to set up your workspace
  - Hybrid work environment: most team members work from our HQ
    in Union Square, Manhattan, Tuesday through Thursday, with
    in-office expectations that vary by role. Catered lunches
    from a variety of local restaurants and frequent employee-
    organized cultural events bring energy to the office. On
    Mondays and Fridays, many employees work remotely, while
    some take advantage of the quieter office.

