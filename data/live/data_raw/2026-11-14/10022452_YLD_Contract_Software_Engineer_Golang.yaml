  About YLD:

  Our goal is to help our clients keep moving forward. We work
  with them to build the skills and capabilities they need to
  stay ahead of the competition, and we know our success only
  happens when they succeed. We’re a team of curious, talented
  people, and we’re committed to making YLD a place where
  great people want to work, grow, and stay.

  We’re a remote-first consultancy specialising in software
  engineering, product design, and data. Our teams are based
  across London, Lisbon, and Porto, and we create digital
  solutions that continue to deliver value long after our work
  is done.

  About the role:

  As a Senior Software Engineer at YLD, you’ll be part of a
  client team building innovative products. We’re looking for
  someone curious, passionate, driven, and enthusiastic. You
  should be skilled in problem-solving and experienced in
  designing scalable, resilient, and fault-tolerant
  architectures. You’re also an effective communicator and a
  strong team player. Together with your team, you’ll thrive
  in a fast-paced engineering environment, delivering
  outstanding results and exciting projects.

  Preferred Skills:

  - Strong backend engineering experience, with Go as a primary
    or preferred language;
  - Comfortable working in cloud environments such as AWS,
    Azure, or Google Cloud;
  - Experience building and maintaining APIs and backend
    services, including SaaS platforms;
  - Familiarity with modern infrastructure and distributed
    systems;
  - Solid understanding of modern deployment practices,
    including Docker, containers, and Kubernetes;
  - Strong background in testing strategies, including TDD,
    across the full system lifecycle, with a focus on
    performance optimization;
  - Use AI tools to augment your work, applying sound judgement
    to adopt emerging technologies where they genuinely add
    value and increase your impact as an engineer.

  You should apply if you are:

  - Self-motivated, proactive and always looking for ways to
    improve and develop yourself;
  - A good communicator, both in writing and verbally. You’ll be
    able to explain technical ideas and concepts in business-
    friendly language;
  - Detail-oriented;
  - Possess strong problem-solving skills that balance
    innovation with pragmatic technology choices to solve
    business needs;
  - Used to working in a team-oriented, collaborative
    environment;
  - Analytical and problem-solving-oriented;
  - A genuine believer in diversity and fairness.

  What you’ll get in return:

  - The chance to work with a forward-thinking, ethical, and fun
    group of people and to develop and grow your skills in a
    fast-moving business

  Our typical recruitment process:

  - 1st Interview with a Talent Partner (30/45 mins)
  - Technical Interview with our Senior Developers (1h30)
  - Final chat with our Client Partner (30/45 mins)

