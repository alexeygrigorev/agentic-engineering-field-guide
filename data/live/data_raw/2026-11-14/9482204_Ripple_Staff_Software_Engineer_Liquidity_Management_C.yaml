description: |
  At Ripple, we’re building a world where value moves like
  information does today. It’s big, it’s bold, and we’re
  already doing it. Through our crypto solutions for financial
  institutions, businesses, governments and developers, we are
  improving the global financial system and creating greater
  economic fairness and opportunity for more people, in more
  places around the world. And we get to do the best work of
  our career and grow our skills surrounded by colleagues who
  have our backs.

  If you’re ready to see your impact and unlock incredible
  career growth opportunities, join us, and build real world
  value.

  The mission, should you choose to accept it, is to pioneer
  and scale Ripple Treasury's liquidity platform into the
  future. If you enjoy solving complex business problems in a
  fast-paced, collaborative, and iterative environment this
  might be the right role for you!

  We are seeking an innovative and forward-thinking Staff
  Software Developer passionate about building a world-class
  platform through a world-class team. Creating technical
  software excellence and spearheading application development
  in design, implementation, and maintenance to make magic
  happen.

  About the Liquidity Management Team

  The Liquidity Management team is at the forefront of a major
  modernization initiative, reimagining how enterprise
  treasury teams manage liquidity across a global landscape.

  We're not just maintaining what exists — we're rebuilding
  from the ground up with a bold vision: a modern, intuitive
  user experience with fast, streamlined workflows that make
  complex treasury operations feel effortless; a cloud-native
  architecture built on the latest technologies, designed for
  scalability, resilience, and speed; and first-class support
  for both traditional fiat currencies and digital assets,
  positioning Ripple Treasury at the leading edge of where
  treasury is headed.

  What You’ll Do – Be a Force Multiplier:

  Technical Leadership & Architecture:

  - Drive architectural decisions for the platform, balancing
    scalability, maintainability, and rapid deployment goals
  - Establish technical standards and design patterns that
    enable the team to ship features faster with fewer defects
  - Lead technical design reviews and provide constructive
    feedback that elevates the team's architectural thinking
  - Identify and eliminate technical debt strategically,
    creating roadmaps that improve both developer velocity and
    system reliability

  Team Enablement & Mentorship:

  - Mentor mid-level and senior engineers, helping them grow
    into technical leadership roles
  - Break down complex, ambiguous problems into actionable work
    that distributes effectively across the team
  - Establish coding standards, review practices, and testing
    strategies that improve overall code quality
  - Champion engineering methodologies including observability,
    incident response, and production excellence
  - Share your enthusiasm for tech trends, explore and learn new
    technologies, engage with tech communities, mentor fellow
    engineers, and lead in technical design and code
    evaluations

  Enhance Agility:

  - Drive adoption of modern engineering practices that improve
    developer experience and productivity
  - Lead post-mortems and blameless retrospectives that turn
    incidents into learning opportunities

  Strategic Technical Vision:

  - Anticipate future scalability challenges before they become
    blockers (e.g., handling 10x growth in transaction volume)
  - Evaluate emerging technologies and recommend when/how to
    adopt them (e.g., new ML frameworks, database
    technologies)
  - Balance technical excellence with pragmatic delivery,
    knowing when "good enough now" beats "perfect later"

  Ownership & Accountability:

  - Own critical systems end-to-end, from design through
    production support
  - Take responsibility for production reliability and
    proactively prevent incidents
  - Step into ambiguous situations and drive them to resolution
    without needing explicit direction
  - Lead by example in code quality, documentation, and
    operational excellence
  - Make tough technical trade-off decisions and clearly
    communicate the reasoning

  What You’ll Work On:

  - Core platform modernization — the team is rebuilding the
    platform from the ground up: a modern, intuitive UX with
    fast workflows, and a cloud-native architecture designed
    for scalability, resilience, and speed
  - Real-time cash/liquidity data pipelines — building systems
    that give treasury professionals real-time transparency
    into cash and liquidity positions across banks, accounts,
    currencies, and legal entities worldwide
  - Digital asset support — engineering first-class support for
    both traditional fiat currencies and digital assets as
    part of the platform's forward-looking vision
  - AI features — developing and optimizing machine learning
    models for the GSmart AI engine that predicts cash flows
    and enables businesses to balance accounts in real time
    while making complex funding decisions

  Essential Knowledge / Experience:

  Years & Scope:

  - 8+ years of professional software engineering experience
  - 3+ years working on complex, business-critical systems in
    production
  - Experience working on products with significant scale
  - Strong communication skills with experience working in cross
    functional projects
  - Track record of delivering projects that span multiple
    quarters and require coordination across teams

  Technical Leadership:

  - Led technical designs that were implemented by teams of 3+
    engineers
  - Made architectural decisions that had lasting impact on
    system capabilities
  - Established technical patterns that were adopted across the
    team

  Cloud & Infrastructure:

  - Proficiency with at least one major cloud platform
    (preferably Azure)
  - Experience with containerization (Docker) and orchestration
    (Kubernetes)
  - Understanding of infrastructure as code and CI/CD pipeline
    design
  - Knowledge of observability: logging, metrics, tracing, and
    alerting strategies
  - Experience with microservices deployment patterns and
    service mesh concepts

  Core Technologies:

  - Deep expertise with C#/.NET
  - Expert in relational databases (SQL Server ideally),
    including query optimization, indexing strategies, and
    data modeling
  - Deep experience in building large scale multi-tenant
    enterprise applications
  - Experience building and maintaining RESTful APIs and
    understanding when to use alternative patterns (GraphQL,
    gRPC, webhooks)
  - Deep knowledge in building applications using React,
    TypeScript, JavaScript, and related technologies

  What You Will Get:

  - A high impact, high visibility role at a growing SaaS
    company that values personal growth, accountability, and
    the concept of “good work”
  - This is a great opportunity for someone who wants to make a
    big impact, work in a fast-paced and collaborative
    environment, and win as a team to scale a growing business
  - A culture of open collaboration and problem solving
  - An empowered role on the Engineering team, responsible for
    driving accurate financial result visibility
  - Great benefits, and culture

  For positions that will be based in NY, the annual salary
  range for this position is below. Actual salaries may vary
  based on numerous factors including, among other things, an
  individual applicant’s experience and qualifications for the
  position. This range does not include equity or additional
  compensation, such as bonuses or commissions.

  NY Annual Base Salary Range

  $196,000—$245,000 USD

  WHO WE ARE:

  Do Your Best Work

  - The opportunity to build in a fast-paced start-up
    environment with experienced industry leaders
  - A learning environment where you can dive deep into the
    latest technologies and make an impact.  A professional
    development budget to support other modes of learning.
  - Thrive in an environment where no matter what race,
    ethnicity, gender, origin, or culture they identify with,
    every employee is a respected, valued, and empowered part
    of the team.
  - In-office collaboration for moments that matter is important
    to our culture, and we give managers and teams the
    flexibility to decide which 10+ days a month they come in.
  - Bi-weekly all-company meeting - business updates and ask me
    anything style discussion with our Leadership Team
  - We come together for moments that matter which include team
    offsites, team bonding activities, happy hours and more!

  Take Control of Your Finances

  - Competitive salary, bonuses, and equity
  - Competitive benefits that cover physical and mental
    healthcare, retirement, family forming, and family support
  - Employee giving match
  - Mobile phone stipend

  Take Care of Yourself

  - R&R days so you can rest and recharge
  - Generous wellness reimbursement and weekly onsite & virtual
    programming
  - Generous vacation policy - work with your manager to take
    time off when you need it
  - Industry-leading parental leave policies. Family planning
    benefits.
  - Catered lunches, fully-stocked kitchens with premium
    snacks/beverages, and plenty of fun events

  Benefits listed above are for full-time employees.

