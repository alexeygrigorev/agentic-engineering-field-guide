description: |
  The Role

  As a Frontend Engineer at Fullstack, you will build and
  scale the core user experience for a retail trading platform
  designed for speed, clarity, and trust. You will own major
  frontend systems end to end, from architecture to
  performance, translating complex real time market data into
  interfaces that feel intuitive and empowering for everyday
  traders. You will work closely with designers and backend
  engineers to ship frequently, refine relentlessly, and
  deliver a trading experience for fast moving markets.

  What You’ll Build & Solve

  Core Interfaces: Design, build, and maintain full-featured
  web applications and reusable UI libraries that are fast,
  accessible, and scalable.

  Data Visualization: Develop high-performance, interactive
  charts and real-time visualizations that help users make
  informed trading decisions.

  Performance Engineering: Optimize application speed and
  reliability using advanced caching strategies to achieve
  sub-second load times.

  System Architecture: Integrate complex REST APIs and
  WebSocket streams while managing robust client-side cached
  state.

  DevOps & Quality: Configure and maintain CI/CD pipelines for
  automated builds, previews, testing, and seamless rollbacks.

  What You Bring

  Experience: 2+ years of professional experience building
  modern frontend applications.

  Tech Stack: Expert proficiency in TypeScript, JavaScript,
  and React.

  Design Sensibility: You are obsessed with user interaction
  and care deeply about the UI. You have an innate sense for
  making the complex feel intuitive, and have strong
  experience in CSS and WAAPI.

  Performance Mindset: Deep understanding of browser
  rendering, the DOM, and performance profiling tools (e.g.,
  Lighthouse, Chrome DevTools).

  Testing Culture: Experience writing maintainable test suites
  using tools like Jest, Vitest, or Cypress.

  In-Person Collaborator: Thrive in high-bandwidth, in-person
  engineering environments.

  Work Authorization: Must be authorized to work in the United
  States.
