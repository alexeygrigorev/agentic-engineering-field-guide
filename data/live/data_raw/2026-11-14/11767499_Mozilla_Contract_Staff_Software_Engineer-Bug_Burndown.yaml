title: Contract Staff Software Engineer-Bug Burndown
company: Mozilla
location: GBR
remote: true
work_type: FULL_TIME
company_size: 1,485 Employees
description: |
  You will help reduce Firefox’s WebCompat bug backlog by
  finishing or verifying the diagnosis of the long tail of
  site-breakage bugs, and by writing interventions or simple
  fixes (often with AI assistance). You turn a large queue of
  reported breakages into diagnosed, actionable, or fixed
  bugs.

  Responsibilities

  - Finish diagnosing, or verify the diagnosis of, long-tail
    WebCompat bugs.
  - Write WebCompat interventions where appropriate.
  - Write simple fixes (AI-assisted) and land them.
  - Reproduce and triage incoming site-breakage reports.

  Required qualifications

  - Solid web development (HTML, CSS, JavaScript) and comfort
    debugging real-world site breakage.
  - Fluent with browser devtools and cross-browser diagnosis.
  - Comfortable using AI tooling to speed up diagnosis and
    fixes.

  Preferred

  - Gecko knowledge is a strong plus (but can be taught).
  - Prior WebCompat or web-standards experience.
