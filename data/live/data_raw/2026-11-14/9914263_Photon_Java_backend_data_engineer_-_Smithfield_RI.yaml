description: |
  Looking for a highly motivated Java Backend Data Engineer
  responsible for designing, building, and maintaining the
  operational and analytical capability in FI's data
  platforms. The work involves solution design, data analysis,
  end to end development, production rollout, and production
  support activities using Java Spring Batch, Python, AWS,
  Oracle, and Snowflake. The role will be involved in projects
  centered around maintaining and improving the quality of
  financial product information brought into our data
  ecosystem that will provide value to our compensation,
  sales, and reporting users. The role will be positioned as a
  more senior developer within a single squad. The skillset
  aligns with a Java backend data engineer. Top 3 required
  skills are Spring Batch, AWS, and SQL (Oracle, Snowflake).

  The Expertise and Skills You Bring

  - Bachelor's or Master's Degree in a technology related field
    (e.g. Engineering, Computer Science, etc.) required with
    5+ years of working experience
  - 10+ years of Java development utilizing Spring frameworks.
    Experience writing batch jobs with Spring Batch is a must
  - 2+ years of experience developing batch / backend
    applications that run in AWS, with focus on AWS Batch and
    S3
  - 3+ years working with SQL (ANSI SQL, Oracle, Snowflake)
  - 1+ years of Python development
  - Experience with Unix shell scripting (bash, ksh) and
    scheduling / orchestration tools (Control-M)
  - Strong data modeling skills with experience working with 3NF
    and Star Schema data models
  - Proven data analysis skills; not afraid to work in a complex
    data ecosystem
  - Hands-on experience on SQL query optimization and tuning to
    improve performance is desirable
  - Experience with DevOps, Continuous Integration and
    Continuous Delivery (Jenkins, Terraform, CloudFormation)
  - Experience in Agile methodologies (SCRUM)
  - Experience building and deploying containerized applications
    using Docker
  - Work experience in the financial services industry is a plus
  - Proven track record to handle ambiguity and work in a fast-
    paced environment, either independently or in a
    collaborative manner
  - Good interpersonal skills to work with multiple teams within
    the business unit and across the organization

   The Value You Deliver

  - Passion and intellectually curiosity to learn new
    technologies and business areas
  - Working with our business partners to enhance their user
    experience and provide them curated data to help them
    drive business results more effectively
  - Enhancing data quality of financial product information in
    our systems that has large impact on sales, compensation,
    and reporting business users











  Compensation, Benefits and Duration



  Minimum Compensation: USD 40,000 Maximum Compensation: USD
  142,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
