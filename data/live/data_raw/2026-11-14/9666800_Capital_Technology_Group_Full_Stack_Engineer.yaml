description: |
  Capital Technology Group provides expert consulting services
  software development, digital transformation, human-centered
  design, data analytics and visualization, and cybersecurity.

  Our multidisciplinary teams use agile methodologies to
  rapidly and incrementally deliver value in close
  collaboration with our clients. For over a decade, we have
  been trusted by both federal and commercial clients to solve
  complex, mission-critical business challenges. The quality
  of our work has been recognized by our partners and peers
  through our inclusion in the Digital Services Coalition, a
  group of forward- thinking firms recognized for excellence
  in delivering IT services.

  Client Requirements: applicants MUST BE US Citizens and be
  able to obtain Public Trust clearance

  The CTG Experience

  At Capital Technology Group (CTG), our teams are passionate
  about modernizing how the federal government delivers
  software. We partner with federal agencies to build secure,
  scalable, and mission-driven solutions that make a
  meaningful impact on millions of people. Recognized by The
  Washington Post as a Top Workplace in 2025 and 2026. CTG
  fosters a culture rooted in our core values. Our values
  guide how we work together and support one another, creating
  an environment where employees feel trusted, empowered, and
  encouraged to grow both personally and professionally.

  About the Role

  CTG is seeking a Full Stack Engineer to design, develop, and
  deliver scalable, secure, mission-driven solutions
  supporting federal modernization initiatives. This role
  focuses on full-stack development across applications,
  integrations, cloud environments, APIs, and enterprise
  systems while partnering closely with engineering, product,
  infrastructure, and delivery teams.

  You Will Get To

  - Design, develop, test, and maintain end-to-end solutions
    across applications, integrations, cloud infrastructure,
    and enterprise platforms
  - Translate business and product requirements into scalable,
    maintainable technical solutions
  - Collaborate with engineering, DevSecOps, infrastructure, and
    product teams on solution design and delivery
  - Contribute to technical design discussions, code reviews,
    and architecture decisions
  - Develop backend services using Java, Spring Boot, and Ruby
    on Rails, and frontend applications using React,
    JavaScript, and TypeScript
  - Build APIs, integrations, and data flows using REST,
    GraphQL, Kafka, SQL, Python, and Databricks
  - Develop automated tests using JUnit, Jest, and Cypress,
    while supporting manual testing and quality assurance
  - Contribute to CI/CD and deployment processes
  - Build and deploy applications on AWS
  - Apply secure coding and engineering best practices, while
    identifying technical risks, performance considerations,
    and scalability needs

  Who You Are

  - A hands-on engineer who enjoys solving complex technical
    problems and building scalable, reliable systems
  - Strong in full-stack development, application integration,
    and cloud-based solutions
  - Comfortable translating business requirements into practical
    technical solutions and making thoughtful engineering
    tradeoffs
  - A strong communicator who collaborates effectively with
    technical and non-technical stakeholders
  - Collaborative, proactive, and comfortable navigating
    ambiguity in a mission-driven environment

  Qualifications

  - Bachelor’s degree in Computer Science, Engineering,
    Information Systems, or related field (or equivalent
    experience)
  - 5+ years of professional experience in software engineering,
    systems architecture, or solutions architecture roles
  - Strong experience designing enterprise application
    architectures and scalable distributed systems
  - Deep hands-on experience with Java, Groovy, Spring Boot,
    OpenJDK, GraphQL, REST APIs, MySQL, and PostgreSQL
  - Strong frontend architecture experience with Angular, React,
    TypeScript, and JavaScript
  - Strong understanding of application integration, API design,
    microservices, event-driven architecture, and enterprise
    solution patterns
  - Experience with cloud platforms such as AWS
  - Familiarity with DevSecOps workflows, CI/CD pipelines,
    infrastructure collaboration, and modern delivery
    practices
  - Knowledge of secure application architecture, API security,
    and enterprise design best practices
  - Strong documentation, architecture communication, and
    stakeholder leadership skills

  Nice to Have

  - Experience with DevOps practices, including CI/CD,
    containerization, Docker, Kubernetes, serverless
    architectures, or platform engineering
  - Experience supporting federal government agencies

  Salary

  We are committed to offering a competitive salary for this
  position, with an estimated range of $90k–$130k annually.
  Please note that this range is intended to provide a general
  idea of what to expect. The final offer may vary based on
  experience, skills, and other factors.

  Full Time Employee Benefits

  - Remote Work (Hybrid roles will be specified in the job post)
  - Competitive Compensation Package
  - Medical, Dental, and Vision
  - Life Insurance, Short/Long Term Disability
  - Employee Assistance Program
  - 401(k) with 4% matching
  - Liberal PTO vacation policy
  - Generous Annual Continuing Education
  - Annual Wellness Budget
  - Bonus Incentive Programs (Employee referrals and
    performance-based rewards)

  Thanks for your interest in Capital Technology Group!

  Capital Technology Group is an equal opportunity employer
  and all qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  national origin, disability status, protected veteran
  status, or any other characteristic protected by law.
