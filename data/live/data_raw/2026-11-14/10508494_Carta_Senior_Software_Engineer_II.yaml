title: Senior Software Engineer II
company: Carta
location: London, GBR
work_type: FULL_TIME
company_size: 1,902 Employees
description: |
  The Company You’ll Join

  Carta is the connected platform and AI-native ecosystem for
  private capital. Built to replace fragmented tools with a
  single system of record, Carta brings together the software,
  services, and legal infrastructure that founders use to
  manage equity, fund managers use to run administration and
  reporting, and legal teams use to close transactions.
  Trusted by 55,000 companies and 1.8M+ equity holders in 160+
  countries, and 10,000 funds and SPVs representing $250B+ in
  assets under management, Carta is transforming how private
  capital operates. Recognized by Fortune, Forbes, Fast
  Company, Inc. and Great Places to Work.

  For more information about our offices and culture, check
  out our Carta careers page.

  The Team You’ll Work With

  You’ll enter our engineering interview process as part of a
  pooled hiring model. We’re excited to meet people who are
  energized by complex, ambiguous problems. We look for owners
  and problem-solvers who are eager to dive into the details
  of their craft, and are motivated by building products and
  experiences that meaningfully expand access to ownership.

  As you move through our process, we’ll transition from the
  general pool to a team-matching phase, ensuring that by the
  final interview, you are aligned with a specific team that
  matches your strengths and career goals.

  High impact domains you might join include:

  - Carta Law: Building the foundational legal and compliance
    infrastructure for private capital. You'll help scale
    Carta Law as the enterprise system of record for General
    Counsels, CCOs, and Heads of Legal. As part of a lean,
    London-based team, you'll shape how legal, operations, and
    finance teams work together.

  The Problems You’ll Solve

  As a Senior Software Engineer II, you will lead technically
  complex projects and serve as a multiplier for your team.
  You’ll work to:

  - Drive Implementation: Lead the execution of complex
    technical projects, driving them from concept to
    production while maintaining high standards for
    performance and reliability.
  - Simplify Systems: Dig deep into our architecture to identify
    opportunities to simplify code and infrastructure,
    prioritizing changes that have a measurable business
    impact.
  - Leverage Modern Tooling: Use the best AI-assisted
    engineering tools to accelerate your workflow, improve
    code quality, and spend more of your time solving the
    high-level logic and unconventional problems
  - Foster Growth: Act as a mentor and coach, raising the
    technical bar for your peers through diligent PR reviews
    and architectural guidance.
  - Collaborate Cross-Functionally: Partner with product and
    design to ensure we are building the right solution for
    the user, not just following a specification.

  About You

  - The Tech Stack: You have experience with (or a desire to
    learn) our core technologies: Python, Django, React,
    Postgres, and Kafka. We also utilize Java, gRPC, and AWS.
  - Execution: You can break down complex user stories into
    actionable tasks and execute them with minimal guidance.
  - Strategic Mindset: You understand the "why" behind your code
    and can articulate technical trade-offs to stakeholders.
  - Experience: We recommend 8+ years of professional software
    engineering experience for this level.

  Disclosures:

  - We are an equal opportunity employer and are committed to
    providing a positive interview experience for every
    candidate. If accommodations due to a disability or
    medical condition are needed, please connect with the
    talent partner via email.
  - Carta uses E-Verify in the United States for employment
    authorization. See the E-Verify and Department of Justice
    websites for more details.
  - For information on our data privacy policies, see Privacy,
    CA Candidate Privacy, and Brazil Transparency Report.
  - Please note that all official communications from us will
    come from an @carta.com or @carta-external.com domain.
    Report any contact from unapproved domains to
    security@carta.com.
