  Staff/Principal Software Engineer - South America

  Hey there! We are Jumpapp.com, AI for Financial Advisors.
  Jump’s mission is to empower financial advisors, firms, and
  clients to thrive in the age of AI with smarter workflows,
  deeper insights, and enterprise-grade security and
  compliance.

  Jump leads its category in market share, customer
  satisfaction, and analyst rankings, and is rapidly growing
  Jump was launched in 2023 by repeat entrepreneurs and is led
  by a team with backgrounds from Harvard, Stanford, Google,
  Snowflake, Bill.com, JPMorgan, Fidelity, Bain, EY, Bain
  Capital Ventures, Auditboard, Nitrogen, and more.

  What is the job?

  To succeed in this role, you should have at least 6 years of
  professional software engineering experience. The details of
  your tech background don’t matter as much as your ability to
  approach problems with curiosity and good judgment. We want
  people who can adjust when priorities shift and who see
  every new challenge as a chance to learn. Just as
  importantly, we value clear and respectful communication —
  the kind that involves both listening to feedback and
  offering it thoughtfully to help the whole team grow. In our
  culture, setbacks aren’t about blame, they’re about
  collaboration, problem-solving, and moving forward together.

  If you don't have experience with everything in our tech
  stack still apply! We are willing to teach the right
  candidates and get them up to speed. Our tech stack is
  Elixir, Liveview, Postgres, Github, k8s & Terraform on
  Google Cloud.

  This role pays $70/hr and is for global software engineering
  contractors.

  You can work any hours from anywhere. Our code is clean,
  well tested, well architected and fun to work in. You’ll
  love how quickly you can ship stuff!

  What is the hiring process?

  We have a 4 step hiring process and it takes about a week.

  First, you’ll be invited to a quick screening call

  Second, you’ll be invited to a quick coding challenge

  Third, if your code looks good, our final step is a short
  chat with our CTO

  Finally, you'll be invited to a trial week to work with our
  team

  Our Culture

  We have a rigorous hiring process yet a kind and encouraging
  culture. We hire for a mix of experience, aptitude &
  attitude. We are a family-first company, so we work smart
  and hard but not round the clock at the expense of family.

  Other info:

  - We buy the subscriptions you need (Cursor.ai, ChatGPT, etc)
  - We’re a small and efficient dev team
  - We’re growing gangbusters. All revenue-backed, super low
    churn.
  - Raised a $80M Series-B
  - $30-$70/hour depending on experience
  - HQ based in SLC, Utah
  - You can work any hours (aiming for 3 hours overlapping HQ's
    hours) from anywhere outside of the United States



  About Jump

  Jump’s mission is to empower financial advisors and their
  clients to thrive in the age of AI. Jump’s primary product
  is an AI assistant helping financial advisors with their
  client meeting cycle and other workflows. Jump’s product is
  expanding to include many other advisor workflows, as well
  as into other finserv verticals.



  Jump leads its category in market share, customer
  satisfaction, and analyst rankings, and has grown rapidly.
  Jump customers include leading independent broker dealers
  such as LPL, Osaic, Raymond James, and Cetera, and leading
  RIAs including Focus Financial, Merit, Savant, Allworth,
  Sanctuary Wealth, Integrated Partners, and more.



  Jump was launched in 2023 by repeat entrepreneurs and is led
  by a team with backgrounds from Harvard, Stanford, Google,
  Snowflake, Bill.com, JPMorgan, Fidelity, Bain, Bain Capital
  Ventures, Auditboard, Nitrogen, and eMoney.



  Jump is a Series B company backed by top venture capital
  firms and industry strategics including Battery, Sorenson,
  Pelion, and Citi.



  Jump’s team values are High Velocity, World Class, and
  Direct + Kind + No Drama.



  Please consider joining us in our work to transform the
  client and advisor / rep experience in financial services by
  delivering cutting edge, practical, compliant AI technology
  to help those who help safeguard the financial future of
  everyday people everywhere



  *Note candidates must wait at least six months before re-
  applying for the same role. Candidates who apply sooner will
  be disqualified from the hiring process.
