description: |
  Job Summary: The Manager, Enterprise Engineering Solutions
  (EES) is responsible for leading a team of IT professionals
  and overseeing the design, delivery, support, and continuous
  improvement of enterprise technology solutions. This role
  ensures alignment of technology initiatives with business
  objectives, drives operational excellence, and promotes
  scalable, reliable, and secure systems across the
  organization. The Manager fosters a culture of innovation,
  collaboration, and continuous improvement while ensuring
  compliance with applicable regulatory and organizational
  standards. Essential Functions:

  - Lead, mentor, and develop a high-performing team; establish
    clear goals, expectations, and performance standards
  - Lead the team through process, tooling, or organizational
    change, communicating impact and expectations clearly.
  - Manage resource capacity, staffing, and vendor/partner
    relationships to support delivery and operational
    objectives
  - Develop and execute technology strategies and roadmaps
    aligned with business priorities
  - Oversee delivery of projects, enhancements, and ongoing
    production support across enterprise platforms
  - Drive adoption of best practices across the software
    development lifecycle (SDLC), including Agile and DevOps
    methodologies
  - Lead initiatives from concept through implementation,
    ensuring scalable, high-quality solutions
  - Ensure reliability, availability, security, and performance
    of systems through strong operational practices
  - Oversee incident management, production support, and service
    level agreement (SLA) adherence
  - Identify and mitigate risks, resolve issues, and optimize
    platform performance and resiliency
  - Establish and track metrics, KPIs, and reporting to drive
    performance and continuous improvement
  - Partner with business stakeholders and IT teams to translate
    business needs into effective technology solutions
  - Serve as a liaison between IT and business areas, ensuring
    alignment and clear communication
  - Ensure adherence to organizational standards, security
    requirements, and applicable healthcare regulations
  - Identify opportunities to enhance processes, tools, and
    delivery models, promoting automation, efficiency, and
    innovation
  - Continuously identify and implement opportunities to
    automate or agenticize production support, testing,
    documentation, monitoring, and repetitive engineering
    activities.
  - Establish and manage engineering outcomes focused on
    productivity, delivery flow, reliability, quality,
    automation, and cost efficiency.
  - Establish team-level guidelines for responsible, secure use
    of AI tools in the SDLC.
  - Drive AI adoption and business outcomes by identifying,
    prioritizing, and delivering AI-enabled capabilities that
    improve productivity, quality, customer experience, speed
    to market, risk management, or cost efficiency within
    their area of responsibility.
  - Build AI capability within their organization by ensuring
    their teams are equipped, trained, and expected to
    leverage AI tools and practices to improve effectiveness,
    accelerate delivery, and continuously evolve the way work
    is performed.
  - Perform any other job related duties as requested.

  Education and Experience:

  - Bachelor's degree in Computer Science, Information
    Technology, Business, or related field required
  - Equivalent years of relevant work experience may be accepted
    in lieu of required education
  - Five (5) years of experience in IT, application development,
    systems engineering, or related field required
  - Three (3) years of leadership or management experience
    required
  - Experience with SDLC methodologies (Agile, DevOps, or hybrid
    approaches) required
  - Experience in healthcare or managed care environment
    preferred

  Competencies, Knowledge and Skills:

  - Basic financial acumen, including budget tracking and cost
    awareness
  - Conflict resolution and difficult-conversation skills
  - Working knowledge of AI-assisted development and operations
    tools and their impact on team productivity
  - Understanding of AI governance, data privacy, and risk
    considerations in a regulated industry
  - Strong leadership, team development, and performance
    management capabilities
  - Ability to translate business requirements into technical
    solutions
  - Broad understanding of enterprise IT systems, architecture,
    and development practices
  - Knowledge of application development, integration, and
    infrastructure concepts
  - Strong analytical, problem-solving, and decision-making
    skills
  - Knowledge of SDLC, CI/CD, and modern engineering practices
  - Excellent communication, relationship management, and
    stakeholder engagement skills
  - Ability to manage multiple priorities in a fast-paced,
    dynamic environment
  - Knowledge of healthcare systems, regulatory requirements,
    and managed care preferred

  Licensure and Certification:

  - Relevant certifications (e.g., Agile, SAFe, ITIL, or
    technical certifications) preferred

  Working Conditions:

  - General office environment; may be required to sit or stand
    for extended periods of time
  - Ability to travel as required by the needs of the business.

  Compensation Range:

  $94,100.00 - $164,800.00

  CareSource takes into consideration a combination of a
  candidate’s education, training, and experience as well as
  the position’s scope and complexity, the discretion and
  latitude required for the role, and other external and
  internal data when establishing a salary level. In addition
  to base compensation, you may qualify for a bonus tied to
  company and individual performance. We are highly invested
  in every employee’s total well-being and offer a substantial
  and comprehensive total rewards package.

  Compensation Type (hourly/salary):

  Salary

  Organization Level Competencies

  - Fostering a Collaborative Workplace Culture
  - Cultivate Partnerships
  - Develop Self and Others
  - Drive Execution
  - Influence Others
  - Pursue Personal Excellence
  - Understand the Business



