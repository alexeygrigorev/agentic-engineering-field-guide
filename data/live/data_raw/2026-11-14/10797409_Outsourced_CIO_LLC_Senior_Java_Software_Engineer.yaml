description: |
  Company Description

  We work with growing companies to provide oversight of
  information technology strategy, systems, and processes
  required to support a company’s mission.  Because these
  companies are not ready to hire a full-time Chief
  Information Officer (CIO) to ensure the tech systems and
  procedures lead to outcomes in line with business goals,
  they outsource that to us.  Our clients say we help
  demystify technology by removing their fears and creating
  business value through technology, so they can focus on
  their business.

  Job Description

  The successful candidate will be part of a team which is
  responsible for all facets of the software development
  project’s life cycle. Responsibilities include but not
  limited to design, code, implementation, testing, reporting,
  documentation, deployment, and debug operations. The
  software development team is required to interface with
  users for requirements gathering and specification.

   Positions available in the following areas:

  - Brokerage platform development -- front and/or back-end,
    depending on experience.
  - Front end: Java Swing. End-user facing trading platform.
  - Back end: Core Java. Data model and transport layers. Multi-
    threaded/high throughput. XML.

  Qualifications

  VERY IMPORTANT:

  - Bachelor’s in EE, CS, Math, Physics or similar
    (Masters/Ph.D. a plus).
  - Technically oriented, proactive, and enthusiastic, with
    extreme attention to detail.
  - Ability to understand complex systems and offer new
    solutions.
  - Minimum of 4 years of Java experience.
  - Knowledge of core Java.
  - Knowledge of Java Swing and/or strong desire to learn Java
    Swing.
  - English written/verbal communication skills.
  - Mobile software development a plus.

  SCREENER QUESTIONS MUST ANSER:

  - Is the candidate a permanent employee or a consultant?
  - Does the candidate require sponsorship to work in the USA?
    If on a visa, which, when was the visa issued and how many
    years are left on the current visa before expiration?
  - What is the candidate’s current location?
  - If out of the area, is the candidate willing to relocate to
    the location of job position?
  - Each submission should have these questions answered. Please
    download and attach in the cover letter section.
    http://tinyurl.com/j8lx4k3
  - What is the desired base salary?
  - Is this an active or passive candidate?
  - Please confirm that the candidate name submitted AND the
    name on the resume are indeed the candidate’s legal name
    (no nicknames).

  Additional Information

  All your information will be kept confidential according to
  EEO guidelines.
