description: |
  Company Description

  Founded in 2015, 4DS Corp., parent of Inbulks.com is a NY
  based multi-asset e-commerce company with a large variety of
  products and brands under the portfolio. We are currently
  looking for a well-rounded front end/full stack developer to
  join the team and help with the expanding business. Work
  will be primarily around the development of our in-house
  inventory management system, order management system, and
  e-commerce platform. This role is a junior role and has
  flexible job type (contractor, full time, or intern).

  Job Description

  - Develop and maintain firm's inventory management system
    along with senior developers

  - Work with product manager to execute product requirements

  - Resolve bugs or defects related to the system

  - Ability to quickly shift gear between projects and
    multitasks when needed

  - Ability to communicate and escalate with senior management
    as issues arise

  Qualifications

  - Front end languages include HTML, CSS, Javascript, or more

  - Back end languages include Java, NodeJS, or more

  - Familiar with database languages such as SQL, MYSQL, MongoDB
    or more

  - Preferred Language: Chinese (Mandarin) & English

  Additional Information

  Job Type: Full-Time/Part-Time/Freelance

  Work Location: New York, NY / Long Island, NY

  Work Remotely: Yes (NYC area preferred)

  We offer CPT, OPT, H1B Sponsorship for International
  Applicants

  All your information will be kept confidential according to
  EEO guidelines.
