description: |
  Company Description

  We put subject matter experts in control of data analysis
  and remove dependency on technical personnel. Financial,
  brand, and public sector analysts use Minsky® (our ML/NLP
  platform) to get unique, actionable insights out of
  Internet-scale volumes of unstructured data - in mere hours,
  and without writing code.

  Our customers include financial, healthcare, and public
  institutions. Founded by two MIT PhDs, dMetrics includes
  some of the world's top authorities in machine learning and
  natural language processing, with 10,000+ citations of our
  team's work in the academic press.

  Job Description

  You are interested in large-scale content aggregation, data
  processing, and storage.

  We expect you to work closely with others and provide
  leadership, code discipline, and project design by example.
  You are extremely driven and want to assume ownership over
  an important part of our technology to build a solid product
  stack. You will use your expert Java skills to design and
  build high load web applications and service-oriented
  systems for collecting, storing, processing, searching, and
  visualizing very large volumes of unstructured text. In
  doing so, you will solve a wide variety of engineering
  challenges, ranging from data flow, to storage, to
  aggregation, to supporting APIs / presentation layer / data
  pipelines / web apps. You have experience developing in OSX
  and/or Linux.

  You are comfortable with change. You’ve had positive
  experience working for a startup before. US Citizens or
  Green Card holders only.

  Qualifications

  - Java (5+ yr)
  - Spring MVC (5+ yr)
  - NoSQL & relational DBs (3+ yr)
  - ElasticSearch or ClickHouse
  - Redis
  - Spark
  - AWS

  Additional Information

  Responsibilities:

  - Implement multi-tier scalable SaaS architectures
  - Design and consume RESTful web service APIs via
    microservices
  - Debug and troubleshoot existing codebase
  - Deploy to and manage apps in the cloud
  - Bonus - hands-on experience with:
    - NodeJS, Python, Scala
    - ML, NLP, statistics
    - Bash/unix tools, security, caching
    - Familiarity w/security patterns’ best practices
