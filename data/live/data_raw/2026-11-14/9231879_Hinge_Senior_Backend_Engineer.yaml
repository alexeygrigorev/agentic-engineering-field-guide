description: |
  Responsibilities

  - Design and build RESTful APIs for mobile clients.
  - Taking part in the backend On-Call rotation (1 whole week,
    every 8-11 weeks).
  - Design and build microservices that run on Kubernetes.
  - Design and build distributed systems in Go, using cloud
    infrastructure and platform service components.
  - Own the technical design, implementation, and success of
    their projects.
  - Collaborate across teams, promoting a culture of
    inclusivity, growth, and strong cross-functional
    communication.

  What We're Looking For

  - 5+ years of industry experience as a backend/service
    engineer
  - 4+ years of experience working in a cloud environment such
    as GCP, AWS, Azure.
  - Strong programming skills: Proficiency with Go and Python is
    a bonus!
  - System Design & Architecture: A deep understanding of
    distributed computing concepts, event based architecture,
    and cloud design patterns.
  - Collaboration and Communication skills: Solid writing skills
    paired with the ability to clearly communicate complex
    ideas to teammates from both technical and non-technical
    backgrounds.
  - Cloud Technologies: Proficiency with Kubernetes,
    OpenTelemetry, gRPC/Protobuf, Argo, Kafka, etc.

