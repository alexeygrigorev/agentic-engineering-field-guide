description: |
  Senior Full Stack Developer — Web3

  Remote — International | Full-time

  Salary - up to 90k USD

  About the opportunity

  G2i is recruiting a Senior Full Stack Developer for
  Moonberg, a Zug-based intelligence lab building proprietary
  market intelligence and infrastructure for decentralized
  markets.

  Moonberg processes more than 700 real-time data streams,
  from on-chain activity to market narratives, to generate
  actionable insights. Its consumer product, Obzidian, is an
  agentic trading terminal designed to research, monitor, and
  execute across markets around the clock.

  We’re looking for a highly experienced engineer who can own
  architecture and implementation across frontend, backend,
  and Web3 integrations. You should be comfortable scaling
  data-intensive systems, solving production problems, and
  making technical decisions with substantial autonomy.

  What you’ll do

  - Own full stack development across React interfaces, Node.js
    services, and Web3 integrations.
  - Build and scale decentralized applications integrating
    wallets, DeFi protocols, and on-chain data.
  - Integrate Web3 libraries, SDKs, packages, and APIs into
    reliable product workflows.
  - Design systems for performance, security, scalability, and
    interoperability.
  - Build and improve infrastructure supporting large volumes of
    real-time market and blockchain data.
  - Investigate production issues and improve system
    reliability.
  - Collaborate with experienced engineers on architecture and
    research into emerging technologies.
  - Take features from technical design through implementation,
    deployment, and production support.

  What you’ll bring

  - 10+ years of professional software development experience.
  - At least 3 years of full stack development experience with a
    strong Web3 focus.
  - Strong proficiency in TypeScript, React, and Node.js.
  - Hands-on experience shipping Web3 applications or
    integrations into production.
  - Experience integrating wallets, DeFi services, on-chain
    data, and third-party Web3 packages or APIs.
  - Experience designing and scaling data-intensive systems.
  - Strong architectural judgment and a practical approach to
    performance, security, and reliability.
  - Fluent English.
  - The ability to work independently, communicate clearly, and
    take ownership in a fast-moving startup.

  Nice to have

  - Multi-chain development experience, ideally across both
    Ethereum and Solana.
  - Experience with Prisma, Zod, tRPC, and Fastify.

  Working at Moonberg

  Moonberg operates with a fully senior team, few meetings,
  and a direct, execution-focused culture. Engineers have
  substantial ownership and are expected to move quickly while
  maintaining high technical standards.

  The pace is demanding, and this is not a conventional 9-to-5
  environment. The role suits someone comfortable with startup
  intensity, broad responsibility, and accountability for
  production outcomes.

  What’s offered

  - Fully remote work with flexible hours.
  - Competitive compensation based on experience.
  - Collaboration with highly experienced engineers.
  - Significant technical ownership and autonomy.
  - The opportunity to build core infrastructure and products in
    the Web3 space.

  How to apply

  Apply through G2i with your resume and links to your GitHub,
  portfolio, or relevant projects. Please highlight your
  production Web3 experience and your contributions across
  frontend, backend, and blockchain integrations.
