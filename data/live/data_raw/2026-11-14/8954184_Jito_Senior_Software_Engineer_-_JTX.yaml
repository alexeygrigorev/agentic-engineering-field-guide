description: |
  Jito builds the Market Layer of Solana, the infrastructure
  that powers real markets on-chain. We started by building
  foundational network infrastructure: execution systems,
  capital markets, and incentive mechanisms that process
  billions in daily transaction value. Our products (Jito
  Block Engine, BAM, and JitoSOL) are market leaders and core
  to how Solana's economy operates.

  Now we're moving up the stack. You’ll help build JTX, the
  trading app designed to capture the next generation of on-
  chain volume — not simply by adding more features or
  competing on fees, but by creating the platform serious
  traders genuinely want to use every day.

  This is a product challenge that goes far beyond shipping
  functionality. It requires deep attention to speed, trust,
  feel, workflow, and user obsession at every level of the
  experience. The hardest part isn’t measuring what traders
  want — it’s building a product so intuitive and powerful
  that they choose it instinctively.

  We're a small, profitable company with product-market fit.
  That means:

  - High ownership: Every team member drives significant
    technical decisions and shapes our product roadmap.
  - Fast execution: We ship rapidly and iterate based on real-
    world feedback. Progress, not motion.
  - Technical excellence: We tackle complex problems with
    elegant, scalable solutions.
  - Sustainable growth: Strong financials and proven market fit
    enable us to focus on long-term impact.

  We offer competitive compensation, significant equity, and
  the opportunity to work on problems that matter.

  About the Position

  We're building JTX, a next-generation trading app that
  brings the speed, power, and sophistication of Solana’s
  market infrastructure directly to traders. This is a true
  0-to-1 product effort focused on creating an experience that
  serious on-chain traders actually want to use — fast,
  intuitive, high-performance, and deeply connected to the
  mechanics of the market itself.

  You’ll work alongside the team behind some of the leading
  infrastructure powering billions in daily transaction value
  on Solana, translating complex systems and market behavior
  into a seamless trading experience for users. Whether it’s
  shaping workflows, refining interfaces, improving execution
  visibility, or helping define the product from the ground
  up, this role will have a direct hand in building what
  trading on Solana looks like next.

  If you've spent time thinking about how markets actually
  work on Solana and want to build the product layer on top of
  that, this is the role.

