description: |
  Senior Software Engineer

  About IEX

  At IEX, we’re passionate about building technology that
  moves industries forward. Our story began when we built a
  stock exchange designed to deliver high-performance results
  for all investors. Our belief is that technology should
  level the playing field so that opportunity is equitable. We
  are applying what we learned from building a high-
  performance stock exchange to build technology that solves
  for complexity and accelerates growth in other areas. We
  aspire to build a trusted, disciplined, and diversified
  business. Our goal is to build transformative technology
  without ever compromising our integrity - and we’re just
  getting started!

  What you'll do:

  - Work with technology and operations teams to make design and
    architecture decisions when developing solutions for the
    exchange
  - Oversee and contribute to the development and maintenance of
    Java application frameworks, messaging APIs, data
    structures (collections, etc.), application reliability,
    and recovery mechanisms
  - Manage and participate in the software development
    lifecycle, including the build, deployment, packaging, and
    dependency management stages
  - Contribute to developing systems including order entry,
    market data, post trade, system monitoring and reporting
  - Work closely with Market Operations and Technology
    Operations teams to provide help with troubleshooting
    production issues

  Your background:

  - Expert in Java development within a low latency environment
  - Experience with electronic trading systems specifically the
    FIX Protocol, market data (proprietary and SIP feeds), and
    post trade handling
  - Linux experience
  - Nice-to-haves:
    - C++ experience
    - KDB+ experience
    - Knowledge of Python, Shell or other scripting languages

  Why You Should Apply:

  - Comprehensive Benefits
  - New hire stock equity (RSUs)
  - 401K employer match
  - Unlimited PTO
  - 100% coverage for medical, dental, and vision
  - OneMedical membership
  - 16 weeks paid parental leave
  - Flexible workplace
  - Employer charity match
  - Learning stipend
  - Commuter benefits
  - Jump Start onboarding program
  - Internal mentor program cross-departmentally
  - Friendly and inclusive workplace culture

  Here at IEX, we are dedicated to an inclusive workplace and
  culture. We are an Equal Opportunity Employer that does not
  discriminate on the basis of actual or perceived race,
  color, creed, religion, alienage or national origin,
  ancestry, citizenship status, age, disability or handicap,
  sex, marital status, veteran status, sexual orientation,
  genetic information or any other characteristic protected by
  applicable federal, state or local laws. This policy not
  only complies with all applicable laws and protects workers'
  rights but is vital to IEX’s overall mission and values.

  Our job titles may span more than one career level. The
  starting annual base pay is between $200,000 and $250,000
  for this NY-based position. The actual base pay is dependent
  upon many factors, such as: training, transferable skills,
  work experience, business needs and market demands. The
  annual base pay range is subject to change and may be
  modified in the future. This role is eligible for bonus and
  equity.
