  features across all layers of web applications.

  Skills and Experience:

  Entefy is not your typical company; it’s a mission. So, if
  you’re creatively analytical, insatiably curious, fearless
  in tackling big problems, and love JavaScript, then you’ve
  earned yourself an interview with our team.

  Requirements:

  - 6+ years’ experience building web applications, not
    brochure-ware
  - Demonstrable experience building JavaScript SPAs
  - Proficiency in ReactJS, HTML5, CSS3, Object-oriented
    JavaScript, and jQuery
  - Good understanding of CSS preprocessors, such as LESS and
    SASS and responsive design
  - Expertise in activity state management architecture and
    libraries such as Redux
  - Strong experience dealing of asynchronous request handling,
    partial page updates, AJAX, RESTful services -and APIs
  - Good understanding of cross-browser compatibility issues and
    ways to work around them
  - Proficiency in code versioning tools, such as Git
  - Solid understanding of databases and data structures
  - Effective verbal and written communication skills

  Other Qualifications:

  - Full stack experience is a plus
  - Advanced data visualization is a plus

  Visit www.entefy.com and www.entefy.com/blog
