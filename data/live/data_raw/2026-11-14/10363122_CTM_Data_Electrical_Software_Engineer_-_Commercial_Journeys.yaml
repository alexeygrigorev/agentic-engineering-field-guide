description: |
  Software Engineer – Commercial Journeys

  Function: Technology

  Location: London

  Curious about what’s next?

  So are we. Join Compare the Market and help to make
  financial decision making a breeze for millions.

  At Compare the Market, we’re a purpose-driven business
  powered by tech and AI. We’re building high-performing,
  results-driven teams with the skills, mindset, and ambition
  to deliver outcomes at pace. Every role here plays a part in
  driving our mission forward, and we create an environment
  where you can bring your authentic self, grow a truly
  characterful career, and see the direct impact of your work
  on the lives of our customers.

  We’ve carved a meerkat-shaped niche and we’re looking for
  ambitious, curious thinkers who thrive in a fast-moving,
  high-impact environment. If you love accountability, embrace
  challenge, and want to make a real difference, you’ll fit
  right in.

  What you’ll be doing:

  - Work with Product Managers, Engineering Managers, and
    Engineering Leadership to design solutions and considering
    trading-off technical and operational considerations
  - Interacting with cross-functional engineering teams across
    the company to improve efficiency and reduce bottlenecks
  - Take responsibility for keys aspects of the development life
    cycle, from design to implementation, testing, security,
    and maintenance.
  - Ensure testing and security standards are well embedded into
    the software the team produces.
  - Active in a community of practice for engineering to develop
    and share knowledge.
  - Effectively participate in the team's software development
    methodologies, such as pairing, code and documentation
    reviewing and continuous delivery



  What we’re looking for:

  - Demonstratable experience with Node.js (backend focus),
    JavaScript/ TypeScript and if you have some experience
    with .NET that would be great too
  - Experience with Agentic AI workflows and integrations
  - Experience building scalable, highly available services and
    products
  - Experience designing and maintaining build, test, and
    deployment pipelines as part of delivering robust software
    systems
  - Knowledge of security engineering practices and methods
  - Creative problem solver who organises a team around a
    challenge
  - Work with agile methodologies and lean thinking methods
  - Active learner, both within your technical and professional
    area of expertise



  Why Compare the Market?

  We’re a business built for pace and performance. Here,
  you’ll be encouraged to think differently, act boldly, and
  deliver brilliantly in a culture that values results and
  rewards progress.

  We believe diverse teams make better decisions, and we’re
  committed to creating an inclusive workplace where everyone
  feels empowered to grow, contribute, and thrive.

  If you’re ready to stretch yourself, raise the bar, and grow
  with a team that’s serious about performance, innovation,
  and purpose, we’d love to hear from you.
