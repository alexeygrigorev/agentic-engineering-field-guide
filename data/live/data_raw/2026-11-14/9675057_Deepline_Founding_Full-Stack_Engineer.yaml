description: |
  New York City | In person | Full time

  TL;DR

  Deepline is hiring a Founding Full-Stack Engineer to build
  the product surfaces and systems that make bespoke GTM
  software practical. You will work directly with founders and
  customers across the stack, turning ambitious product ideas
  into reliable software people use every day.

  Why Deepline

  Deepline is the agent-first platform for teams to build
  bespoke GTM software.

  Agents are making it possible for anyone to build custom
  software around how a company sells. But turning a good idea
  into a production system still requires a fragmented stack
  of data providers, internal and external data, APIs,
  permissions, integrations, monitoring, and operational
  infrastructure.

  Deepline makes that layer practical. We give power users and
  agents the primitives to build and run the exact systems
  their company needs.

  We're already used by thousands of power users at several T1
  companies and have grown extremely quickly since we launched
  in the last six months. We are a lean, deeply technical team
  moving quickly to build the infrastructure for agent-built
  software.

  Software has never been built solely for agents. Come help
  shape what that looks like.

  The role

  Build product end to end: the interfaces, APIs, workflows,
  and integrations that let power users create and run bespoke
  GTM systems. You will work across product, data, and
  infrastructure, moving quickly from customer insight to
  software in production.

  What you’ll build

  • Product experiences that let users create, understand, and
  vibe code their own GTM systems.

  • APIs, data models, and integrations across CRMs,
  warehouses, enrichment providers, and other systems
  customers already rely on.

  • Run evals, identify inefficiencies in how agents currently
  use Deepline, and build new primitives that give them better
  capabilities.

  • Reusable primitives from customer work that make the next
  system faster to build.

  Who we’re looking for

  • Creativity in engineering is the single most important
  quality.

  • You have worked on a fast-moving team and care about
  speed, intensity, and craft.

  • You can turn messy customer reality into the right
  primitives.

  • You have worked on real production software, internal
  tools, CLIs, or devtools.

  • You are comfortable moving across TypeScript/JavaScript,
  Python, SQL, Rust, frontend, backend, and data systems. The
  boundaries are real; the ownership is yours.

  • You have product judgment: you know what to build, what to
  cut, and when a simple solution is better than a
  sophisticated one.

  • Experience with AI products, data infrastructure, CRMs,
  data warehouses, or enterprise integrations is useful, but
  not required.

  Why build with us

  • Shape an entirely new category of software, with a real
  role in defining both the product and the company.

  • Work in person in New York with experienced founders and a
  deeply technical, talent-dense team.

  • Build at the frontier of AI, on problems that change how
  products are created, shipped, and brought to market.

  • Work somewhere truth-seeking and creatively opinionated:
  we question inherited assumptions and choose fast learning
  over false certainty.

  • Competitive salary and meaningful equity.

  Early teams compound. We are looking for people who raise
  the ambition, clarity, and quality of the work around them.

  Compensation

  The base pay range for this role is $140,000 – $260,000 per
  year.
