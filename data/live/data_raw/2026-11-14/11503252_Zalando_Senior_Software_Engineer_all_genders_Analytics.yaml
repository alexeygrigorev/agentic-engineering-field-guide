title: "Senior Software Engineer (all genders) – Analytics & Forecasting Solutions"
company: Zalando
location: Berlin, DEU
work_type: FULL_TIME
company_size: 10,000 Employees
description: |
  THE ROLE & THE TEAM Join our dynamic Analytics & Forecasting
  Solutions team, a key part of the Logistics Network Planning
  department, where you’ll be at the forefront of shaping the
  future of Zalando’s logistics operations. In this senior
  role, you will take technical ownership of complex network
  systems, driving the architectural vision to optimize the
  smooth and efficient flow of millions of packages across
  Europe.

  Our team is committed to enhancing logistics forecasts that
  directly influence the efficiency and performance of all our
  warehouses and transport teams. By architecting, developing,
  and scaling forecasting and planning software, you will play
  a pivotal role in ensuring our logistics operations are not
  only efficient but highly adaptable to changing demands.
  Your work will have a massive, tangible impact on how we
  manage capacity, allocate resources, and maintain the
  seamless delivery experience our customers expect.

  WHAT WE’D LOVE YOU TO DO (AND LOVE DOING)

  - Drive the technical design and implementation of
    sophisticated forecasting and planning software to
    optimize complex capacity allocation.
  - Champion technical excellence by writing scalable, clean,
    and highly maintainable Python code, while establishing
    best practices for Logistics Network planning projects.
  - Take full responsibility for the development lifecycle of
    large-scale systems—from architectural solution design and
    rigorous testing to seamless implementation and
    monitoring.
  - Partner closely with subject matter experts to translate
    complex operational challenges into robust technical
    solutions.
  - Act as a technical multiplier by mentoring junior engineers,
    communicating complex technical concepts to cross-
    functional stakeholders, and driving project milestones.

  WE’D LOVE TO MEET YOU IF


  - You have 5+ years of professional experience as a Software
    Engineer, with a proven track record of delivering
    complex, large-scale systems.
  - You possess strong capabilities to design, architect, and
    ensure the delivery of robust, highly scalable, and high-
    performance distributed systems.
  - You have hands-on experience leveraging AI coding assistants
    (e.g., GitHub Copilot, Claude Code) to accelerate
    development workflows, combined with the critical thinking
    skills to rigorously review, debug, and refine AI-
    generated code to meet enterprise standards.
  - You bring deep experience deploying or interacting with
    machine learning models focused on forecasting,
    optimization, or advanced planning.
  - You have advanced proficiency in Python, SQL, relational
    data warehouses, ETL design, and data pipeline
    orchestration.
  - You have extensive experience with unit, integration, and
    end-to-end testing, alongside implementing robust CI/CD
    pipelines.
  - You can effortlessly translate business requirements into
    technical roadmaps and author clear, comprehensive
    technical documentation.

  OUR OFFER


  Zalando provides a range of benefits, here’s an overview of
  what you can expect. Ask your Talent Acquisition Partner to
  learn more about what we offer.

  - 27 days of holiday a year to start for full-time employees
    (+1 day for every calendar year up to 30 days)
  - 40% off fashion and beauty products sold and shipped by
    Zalando, 30% off Lounge by Zalando, discounts from
    external partners
  - Family support, including counselling and dedicated services
    for parents and carers
  - Company pension scheme
  - Employee shares programme
  - Health and wellbeing options, including Wellhub
  - Mental health support and coaching
  - Development through our training platform and biannual peer-
    to-peer review
  - 2 paid volunteering days a year
  - Relocation assistance (subject to prior agreement)

  INCLUSIVE BY DESIGN


  If you think you have what it takes, we encourage you to
  apply even if you don't meet every single requirement. You
  may just be the right candidate for this or other roles!

  At Zalando, our vision is to be the leading European
  technology platform for fashion and lifestyle – one that
  thrives on diversity and is truly inclusive by design. We
  believe that diverse teams fuel innovation and creativity,
  and we actively seek out talent from all backgrounds.

  We actively seek to reduce bias in our hiring and employment
  processes, focusing on your qualifications, skills, and
  contributions. To support this, we kindly ask that you
  refrain from including personal details such as your photo,
  age, or marital status in your CV, ensuring a fair and
  equitable evaluation based solely on your abilities and
  potential.

  We are committed to providing an exceptional and accessible
  candidate experience for everyone. If you require any
  accommodations to support you throughout the hiring process,
  please let us know – we are here to assist you.

  Discover more about our commitment to creating a diverse and
  inclusive workplace: https://jobs.zalando.com/en/our-
  culture/diversity-and-inclusion
