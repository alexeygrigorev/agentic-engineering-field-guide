description: |
  About Eve

  Eve is redefining legal technology for plaintiff law firms,
  and we're building the team that will take us there. We help
  firms handle more cases, recover more for clients, and grow
  with AI that works across every stage of a case, from intake
  through resolution. The next generation of great plaintiff
  firms will be AI-Native, and Eve is how they get there. But
  what makes Eve different isn't just the product. It's how we
  build it. If you're someone who takes ownership, stays
  curious, and wants to build AI that's already changing how
  law is practiced, this is where you belong.

  Product-market fit: Eve is trusted by over 1000+ law firms,
  and we’re growing fast. Backed by top investors: We’ve
  raised over $160M from world-class partners including Spark
  Capital, Andreessen Horowitz(A16z), Menlo Ventures, and
  Lightspeed. Built by a world-class team: Engineers,
  designers, and operators from places like Scale, Meta,
  Airbnb, Cruise, Square, Rubrik, and Lyft are building Eve
  from the ground up. AI-Native from day one: We’re on the
  bleeding edge of AI, collaborating directly with teams at
  OpenAI and Anthropic to build best-in-class AI workflows
  tailored for legal work. Explosive growth: We are growing 2X
  revenue Quarter over Quarter.

  About This Role:

  Eve Legal is a Series B legal AI platform reinventing how
  plaintiff law firms run their practice. As the dedicated
  enablement manager for our Customer Success and Solutions
  Engineering team, you'll build the skill and technical
  knowledge programs specific to CS and SE from the ground up,
  own technical launch and implementation readiness across the
  team, and build the muscle this team needs to turn strong
  customer relationships into real expansion and upsell within
  the book we already have.

  The CS and SE teams are not support functions, but rather a
  growth engine, and you'll be the person who makes sure the
  team can spot whitespace, build a credible business case,
  and walk into an expansion conversation with confidence, not
  just field technical questions when they come up. If you
  want to build a program from the ground up and watch it
  directly move revenue, this is the seat.

  What You Will Accomplish:

  - Design and run CS/SE upskilling and coaching programs
    covering technical discovery and value articulation for
    both net-new prospects and customer expansion
    opportunities
  - Listen to call recordings from the field to identify trends
    and diagnose skill and technical knowledge gaps that
    coaching and enablement can close
  - Build and deliver enablement across multiple formats
    (live/virtual facilitation, roleplay workshops, eLearning,
    etc.) to match the skill and the moment
  - Build and maintain CS/SE certification tracks covering
    product depth, technical troubleshooting, and
    implementation best practices
  - Own technical launch, implementation, and pilot readiness,
    from SE-led prospect pilots through CS-led customer
    implementations and new-product pilots, ensuring both
    teams can clearly demonstrate and deliver on Eve's value
  - Own the team's DAAT (Discover, Assess, Act, Track) process
    for closing customer-facing skill and technical knowledge
    gaps
  - Enable CS/SE on technical qualification, so both teams can
    accurately assess fit before a pilot or implementation
    begins
  - Partner with CS/SE leadership to build the enablement
    calendar and prioritize topics by proficiency stage and
    leadership's top priorities
  - Partner directly with top-performing CS/SE reps to co-build
    and co-present coaching content in the areas where they
    excel
  - Partner cross-functionally with Product, Marketing, Finance,
    RevOps, and Engineering to translate launches and
    recurring field themes into training

  What We Are Looking For:

  - Background in Customer Success, Sales/Solutions Engineering,
    or technical enablement at a B2B SaaS company
  - Strong technical aptitude, comfortable learning and
    explaining a technical product in depth
  - Experience teaching technical qualification frameworks
  - Strong instructional design and facilitation skills;
    comfortable running live coaching sessions
  - Ability to work independently and own a program end-to-end
  - A proactive problem-solver: someone who spots gaps or
    breakdowns in the program (or in rep performance) before
    being told, and moves to fix them without waiting for
    direction

  Nice to Have:

  - Prior hands-on experience as a CSM or Sales/Solutions
    Engineer
  - Experience with CS platforms (Gainsight, Vitally, ChurnZero)
  - Experience coaching or building content for QBRs
  - Familiarity with technical/API-level product concepts
  - Experience partnering with Product on beta/early-access
    programs
  - Experience with legal tech or another regulated/complex
    vertical

  For sales roles, the range provided is the role’s On Target
  Earnings ("OTE") range, meaning that the range includes both
  the sales commissions/sales bonuses target and annual base
  salary for the role. This salary range may be inclusive of
  several career levels at Eve and will be narrowed during the
  interview process based on a number of factors, including
  the candidate’s experience, qualifications, and location.

  US Salary Range

  $130,000—$186,000 USD

