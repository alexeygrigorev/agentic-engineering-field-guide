description: |
  About TollBit:

  We're pioneers in the AI infrastructure space, driven by a
  dual mission: to empower developers with cutting-edge
  technology to build groundbreaking AI applications and to
  create a thriving ecosystem where creators are compensated
  for their data.

  The future is AI-powered interfaces, where bots and agents
  become the primary way we navigate and access information.
  TollBit is building the key infrastructure that makes this
  possible, ensuring that these intelligent agents pay for the
  content they consume - a tollbooth on the internet. Our goal
  is to create a thriving content & AI ecosystem.

  We're a fast-paced, innovative team pushing the boundaries
  of what's possible and we’re backed by top VCs. If you share
  our vision for a data-fair AI future, we invite you to join
  us on this exciting journey. Find us on Linkedin!

  Who You Are:

  You are a backend engineer who can occasionally flex to the
  frontend with 6+ years of experience building and scaling
  systems. We are looking for quality of experience over
  quantity. You are comfortable taking ownership of projects
  from conception to launch and have a proven track record of
  delivering high-quality, reliable products. You thrive in a
  fast-paced environment and are not afraid to wear multiple
  hats, and do not hesitate to jump on problems on the
  business or product side.

  Responsibilities:

  - Design, develop, and maintain robust and scalable backend
    systems using Go and other modern technologies.
  - Be able to work across the stack to build an end to end
    feature.
  - Own the entire development lifecycle of assigned features,
    from initial design and implementation to testing,
    deployment, and monitoring.
  - Implement best practices for code quality, performance
    optimization, and security.
  - Interact directly with customers to gather feedback and
    understand their needs, incorporating this knowledge into
    technical solutions.
  - Participate in technical discussions and provide insights
    and solutions to complex problems.

