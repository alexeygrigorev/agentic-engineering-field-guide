description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  We're looking for an Engineering Manager to lead a product
  engineering team at ClickUp. This is an open team placement
  role: you'll join a product team based on your strengths and
  our business priorities, rather than being hired into a
  single predefined product area. Across teams, the mandate is
  the same: build a strong team, ship useful product
  improvements, and take ownership of the quality and
  reliability of what you deliver.



  Engineering Managers at ClickUp are hands-on. You'll lead
  from the front: reading and reviewing code daily, debugging
  production issues alongside your team, prototyping when it
  unblocks a decision, and shipping code yourself when the
  team needs it. Your technical credibility is how you earn
  trust, set the bar, and make good calls quickly.



  You'll also own people management, delivery, and team
  execution. Working closely with product, design, and
  technical leads, you'll turn customer problems into clear
  priorities and achievable milestones. You'll develop
  engineers, make trade-offs explicit, and keep work moving
  without letting quality or maintainability become someone
  else's problem.



  You'll also run an AI-native team. We structure work so AI
  agents can read it, route it, roll it up, and report on it.
  Progress and team health should be visible from real
  signals, with reporting available self-serve rather than
  dependent on status meetings. We want a manager who has used
  AI to remove busywork and improve how a team builds, and who
  can help engineers use it responsibly across planning,
  implementation, testing, and operations.

  Responsibilities

  - Lead and develop a product engineering team. Own hiring,
    onboarding, mentorship, performance, and career growth,
    and build a team where expectations are clear and feedback
    is direct.
  - Own delivery from planning through release and follow-
    through. Break work into clear milestones, manage
    dependencies, surface risks early, and make realistic
    commitments.
  - Set priorities with product, design, and engineering
    leadership. Connect engineering work to customer needs and
    business outcomes, and make deliberate trade-offs between
    new features, reliability, and technical debt.
  - Lead from the front technically. Stay close to the codebase:
    review PRs, dig into production issues, write code and
    prototypes when it unblocks the team, and know your
    systems well enough to spot risk before it ships.
  - Drive architecture and implementation decisions with your
    technical leads and senior engineers. Bring real depth to
    design discussions, challenge assumptions with specifics,
    and make the call when the team is stuck.
  - Run an AI-native team. Use AI tools and agentic workflows to
    improve planning, development, testing, triage, and
    reporting, while maintaining clear ownership and human
    review where it matters.
  - Uphold a high engineering bar across design and code review,
    automated testing, performance, security, and
    maintainability. Build quality into delivery rather than
    treating it as a final checkpoint.
  - Own the operational health of your team's product area.
    Establish appropriate monitoring, safe rollout practices,
    incident response, and on-call ownership, and turn
    production issues into lasting improvements.
  - Collaborate across product teams and shared platform teams
    to resolve dependencies and deliver coherent customer
    experiences.
  - Keep priorities, progress, risks, and decisions visible. Use
    evidence to improve team execution and product outcomes,
    rather than optimizing for activity counts.

  Requirements

  - 6+ years of professional software engineering experience
    building production software, including substantial time
    as a hands-on senior engineer, with 2+ years managing an
    engineering team.
  - You still code. You're comfortable working in a modern
    production codebase (TypeScript, Node.js, React, or
    similar), reviewing PRs with substance, and debugging
    across the stack.
  - A track record of delivering customer-facing SaaS products
    or services, with ownership extending beyond launch to
    reliability, maintenance, and customer outcomes.
  - Experience hiring, coaching, and developing engineers,
    including giving direct feedback, managing performance,
    and supporting career growth.
  - Deep technical judgment. You can lead architecture
    discussions, evaluate trade-offs from first-hand
    experience, and hold a high engineering bar because you
    know what good looks like in the code.
  - Experience partnering closely with product and design to
    define priorities, scope work, and deliver against clear
    milestones.
  - A demonstrated ability to use AI tools and agentic workflows
    to improve engineering work and reduce manual
    coordination, with attention to correctness, security, and
    review.
  - Comfort working through ambiguity, learning unfamiliar
    product areas, and making decisions with incomplete
    information.
  - Clear communication and effective cross-functional
    collaboration. You make ownership, trade-offs, risks, and
    next steps easy to understand.
  - Daily fluency with AI tools in your own workflow.

  Preferred Qualifications

  - Recent, meaningful code contributions as a manager:
    features, fixes, tooling, or prototypes you shipped
    yourself.
  - Experience managing engineers across frontend and backend,
    or leading delivery across multiple technical disciplines.
  - Experience building and operating software at scale,
    including performance, reliability, safe migrations, and
    incident management.
  - Experience in a fast-moving product organization, balancing
    customer-facing delivery with platform improvements and
    technical debt.
  - Experience introducing AI-native or agent-driven workflows
    to an engineering team, with measurable improvements in
    quality or execution.
  - Experience building collaboration, productivity, or workflow
    software, or products used by both individual users and
    enterprise customers.
  - Experience leading distributed teams across time zones.

