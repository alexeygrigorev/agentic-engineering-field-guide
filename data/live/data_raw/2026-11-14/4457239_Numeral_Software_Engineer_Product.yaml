description: |
  About Numeral:

  At Numeral, we're building the future of tax by bringing
  together AI agents, human expertise, and global compliance.

  We’re the largest and fastest-growing AI-native tax
  solution. Today, we serve more than 3,500 global businesses,
  including companies like Supabase, Eight Sleep, and Graza.
  We’ve grown quickly across our core e-commerce and software
  segments, more than tripled our revenue every year, and
  expanded into new industries, including manufacturing,
  distribution, and wholesale.

  Numeral has raised over $157M from Insight Partners,
  Salesforce Ventures, Benchmark, Mayfield, Y Combinator, and
  many others.

  About the role:

  We’re looking for a foundational Full-Stack Engineer who
  thrives in ambiguity, enjoys building complex distributed
  systems, and wants to define foundational architecture in a
  fast-growing early-stage startup. You’ll lead the design and
  implementation of APIs, services, and infrastructure that
  underpin our platform. You’ll also help drive engineering
  strategy, product execution, and cultural foundations
  alongside leadership.

  What you’ll do:

  - Design and build scalable, secure backend services and APIs
    from scratch.
  - Make architectural decisions that optimize for speed, data
    integrity, and long-term maintainability.
  - Collaborate closely with product, design, and data teams to
    develop performant systems that power key customer
    workflows.
  - Own infrastructure, observability, and performance for the
    services you build.
  - Help shape engineering best practices, code quality, and our
    overall backend culture.

  What you'll bring:

  - 7+ years of experience building backend systems in high-
    growth environments.
  - Fluency with backend technologies like Node.js, PostgreSQL,
    Redis, and cloud services (AWS preferred).
  - Experience designing robust APIs and distributed systems at
    scale.
  - Strong product sensibility—able to balance performance,
    flexibility, and speed.
  - Startup mindset: Not scared of ambiguity and hungry for
    rapid growth
  - Intensity & Ownership: This is not a 9-5 — we’re scaling
    rapidly and have a massive opportunity ahead of us.
  - Customer Obsession: You deeply care about the user
    experience and solving their problems

  Nice to haves:

  - Experience in payments, tax, accounting, or regulatory tech.
  - Infrastructure or platform engineering background (e.g.,
    CI/CD, observability).
  - Experience scaling monolith-to-service architectures or
    event-driven systems.
  - Familiarity with GraphQL, Kafka, Terraform, or container
    orchestration tools.

  Location:

  - This role is hybrid (3 days a week in our SF or NYC office)

  What we offer:

  - Competitive salary and equity - you'll share directly in the
    company's success
  - Full medical, dental, and vision coverage
  - Wellness perks like Headspace and the Peloton One App
  - 401(k) to help you build long-term financial security
  - Relocation assistance to NYC or SF (if needed)
  - Lunch and snacks when you're in the office
  - Regular team offsites and company events as we grow
  - A culture built on ownership - your work matters and people
    will see it!
