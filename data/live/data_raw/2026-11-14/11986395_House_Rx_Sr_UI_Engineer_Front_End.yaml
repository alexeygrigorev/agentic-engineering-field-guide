description: |
  We are looking for a Sr. UI Engineer to help us make
  specialty medications more accessible and affordable for
  patients. Keep reading to learn more about the role, our
  team and why House Rx is the right next step in your career.

  The Role

  Join our Product & Engineering team as a Senior UI Engineer,
  a technical leader who brings delightful, accessible, and
  high-performance user experiences to life. You’ll shape the
  front-end architecture of our pharmacy management platform,
  partner closely with product and design, and set the
  standard for UI engineering excellence across the team. This
  is a UI-focused role, but you'll regularly work across the
  stack.

  Our stack is React 18, TypeScript, Vite, Node.js/Express,
  Postgres, AWS, plus an in-house Storybook design system and
  TanStack Query/Zustand on the client.

  What You’ll Do

  - Build and ship UI. Build React applications, design-system
    components, and complex clinical workflows, owning
    performance, accessibility, and responsive behavior end to
    end.
  - Architect the front end. Design scalable client-side
    architecture (state management, routing, testing, CI/CD)
    and define API contracts with back-end engineers so both
    sides evolve together.
  - Raise the quality bar. Lead code reviews and automated
    testing, and champion semantic HTML, ARIA, modern CSS, and
    keyboard navigation.
  - Mentor. Help junior and mid-level engineers grow through
    pairing, reviews, and guidance on technical decisions.
  - Help shape how we build with AI. See below.

  What Success Looks Like

  - Day 1: You ship code to production. We release daily, and we
    want you in that flow from the start.
  - First 30 days: You own your first project, from scoping
    through delivery, working with product, design, and back-
    end engineers.
  - First 60 days: You’ve led a project end to end and are
    driving code reviews and raising the bar on accessibility,
    testing, or performance.
  - First 90 days: You’ve proposed and begun executing a plan
    for the design system, state management, or test coverage.

  Building With AI

  AI is a big part of how we build. Engineers here use AI
  coding tools daily — Claude Code, MCP integrations into our
  internal systems (Linear, Slack, Figma, our data warehouse),
  and agentic workflows for things like code review and
  research

  In this role you’ll:

  - Use AI development tools efficiently, proficiently, and
    responsibly in your daily work.
  - Help set practices for AI-assisted development: what to
    delegate, how to review generated code, and how to keep
    quality high at a fast release cadence.
  - Help shape how the broader team adopts and uses these tools
    well

  What We’re Looking For

  Required

  - 5+ years building production web applications with React and
    TypeScript
  - Experience building or contributing to component
    libraries/design systems in production
  - Strong responsive CSS and accessibility skills (WCAG 2.2)
  - Experience with front-end performance tooling (Lighthouse,
    Web Vitals)
  - Experience designing RESTful API interfaces and integrating
    them cleanly in the UI
  - Comfort working across the stack (Node.js, Postgres) as part
    of regular, not occasional, work
  - Experience using AI development tools in real work, with a
    clear view of their strengths and limits
  - Comfort working in a remote, fast-moving environment with
    daily releases

  Leadership & Ownership

  - Experience owning a system or project end-to-end — from
    scoping through long-term evolution, not just a single
    release
  - Experience leading or heavily influencing cross-functional
    work with product and design, including managing trade-
    offs between them
  - Experience communicating technical decisions and trade-offs
    to non-technical stakeholders

  Nice to have

  - Experience building UIs that handle sensitive data
    (HIPAA/PHI, audit trails, role-based views)
  - Experience leading a design-system build or migration
  - Experience writing RFCs or design docs that changed team
    direction
  - Experience with healthcare, pharmacy, or other regulated-
    industry software

  You don’t need a specific degree. A CS or engineering
  degree, or equivalent hands-on experience, works for us. If
  you meet most of the required list and are excited about the
  work, please apply.

  Why House Rx

  - Meaningful work. Your code directly affects whether patients
    can access life-saving medications.
  - Autonomy. You’ll have real influence over technical
    strategy.
  - A fast cadence. We release daily, so you’ll see your work
    reach users quickly.
  - A supportive team. We’re collaborative, curious, and down-
    to-earth. Our Slack emoji and GIF collection is
    legitimately impressive.

  Benefits

  - Flexible work hours and flexible paid time off
  - Generous parental leave
  - Comprehensive healthcare, vision and dental benefits
  - Competitive salary and equity stake

  We’re backed by forward-thinking investors committed to
  transforming healthcare, including Bessemer Venture
  Partners, First Round Capital, LRV Health, NEA, Town Hall
  Ventures, Khosla Ventures, Maverick Ventures, 1984.vc, and
  Character.

  More About House Rx: Our Team, Work, and Culture

  Here's our amazing PDE team that builds healthcare
  technology that matters:

  - Software Engineering: 10 engineers+ from early career to
    staff/architect level
  - Product & Design: 3 product managers, 1 designer
  - Infrastructure: 2 security engineers, 3 SREs
  - Quality & Support: 3 QA engineers, 2 support engineers, 3
    support specialists

  Together, we build and maintain impactful solutions through
  our pharmacy management system and data insights platform.
  These tools enable our internal teams, pharmacists, care
  coordinators, and clinical operations, to streamline
  medication access, while helping external healthcare
  providers and clinics deliver better patient care.

  💻 Our engineering work presents exciting technical
  challenges as we balance user-facing features with robust
  internal systems. We release updates daily, requiring
  thoughtful prioritization and technical excellence while
  maintaining high quality. This iterative approach means
  we're constantly innovating to deliver meaningful
  improvements to our healthcare platform.

  🎉 Our culture brings thoughtfulness to our daily work.
  You'll find us expressing ourselves through our extensive
  Slack emoji and GIF collection (seriously, it's
  impressive!), sharing gratitude circles on birthdays, and
  having conversations that range from foodie recommendations
  to discussions about AI tooling, developer experience, and
  architecture. While we take our mission seriously, we
  believe enjoying what you do and technical excellence go
  hand in hand.

  We're a fun, thoughtful, supportive, talented, and down-to-
  earth group focused on doing some of the best work of our
  lives. At the end of the day, we know software is built by
  people – and we're committed to taking care of both the
  people we work with and the patients whose lives we touch
  through our technology. We’re growing our team. There's no
  one else in the world like you, and hope you can join us for
  this ride! 🚀
