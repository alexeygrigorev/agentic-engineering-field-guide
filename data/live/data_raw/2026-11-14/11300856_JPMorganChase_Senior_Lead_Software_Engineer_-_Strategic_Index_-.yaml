title: Senior Lead Software Engineer - Strategic Index - Commodities - Front Office
company: JPMorganChase
location: London, GBR
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  Build technology that helps shape the future of strategic
  index trading. At JPMorganChase, you will collaborate with a
  global network of technologists and business partners to
  deliver solutions that drive growth and automation. You will
  have room to learn, develop your skills, and take on
  meaningful ownership. If you enjoy solving complex problems
  and improving how teams deliver software, you will feel at
  home here. We value curiosity, teamwork, and a culture where
  everyone can contribute. As a Senior Lead Software Engineer
  at JPMorgan Chase in the Strategic Index Technology team,
  you will lead key projects that support our cross-markets
  index platform. You will partner closely with colleagues
  across Quantitative Research, Structuring, Trading, Sales,
  and Middle Office to deliver high-quality software. You will
  help evolve our technology stack and engineering practices
  to keep the platform efficient, resilient, and innovative.
  You will bring a strong focus on testing, operational
  excellence, and secure delivery. Your work will directly
  impact how we run and grow our strategic index business.



  Job Responsibilities

  - Lead delivery of key projects within a global program of
    work
  - Collaborate with and influence technology teams to deliver
    user-focused solutions
  - Design, develop, and maintain applications and components
    supporting the Strategic Index desk
  - Partner with business users to understand requirements and
    prioritize deliverables
  - Apply Agile practices to take work from inception through
    production release
  - Drive adoption and governance of approved AI-assisted
    engineering practices, including validation standards for
    secure, correct, and performant outputs
  - Use approved software development toolchains and automation
    capabilities to improve delivery efficiency at scale
  - Champion testing and quality throughout the development
    lifecycle
  - Improve platform design and capabilities through continuous
    iteration and feedback
  - Take ownership of outcomes and drive work to completion with
    appropriate stakeholders
  - Communicate clearly with both technical and non-technical
    audiences

  Required Qualifications, Capabilities, and Skills

  - Proficiency in object-oriented or functional programming
    using Python, Java, C++, or C#
  - Willingness to become proficient and develop in Python
  - Demonstrated ability to deliver high-quality, well-tested
    software in a controlled environment
  - Strong interpersonal skills to partner effectively with
    business users and stakeholders
  - Working knowledge of Agile development methodologies
  - Demonstrated ability to lead effective, enterprise-
    authorized AI-assisted software development practices
    (coding, review, testing, troubleshooting) with clear
    expectations for validation
  - Strong understanding of responsible AI use in engineering
    workflows, including data sensitivity, secure handling of
    inputs and outputs, and adherence to resiliency and
    security expectations
  - Ability to take ownership of deliverables from requirements
    through production support
  - Commitment to building reliable, maintainable software with
    a strong testing mindset
  - Ability to collaborate effectively on a global, cross-
    functional team
  - Commitment to continuous learning and improving engineering
    practices

  Preferred Qualifications, Capabilities, and Skills

  - Experience developing applications in finance or investment
    banking, such as market risk, profit and loss, or
    financial modeling
  - Knowledge of Equities, Foreign Exchange, Credit, Rates,
    Commodities, or index and portfolio analytics

  At JPMorganChase, you will join a collaborative, inclusive
  team where your ideas and technical expertise help shape the
  platform and drive measurable business impact.

