description: |
  Job Title

  Senior Full Stack Software Engineer

  The Role

  Vanguard, one of the world's largest investment management
  companies, serves individual investors, institutions,
  employer-sponsored retirement plans, and financial
  professionals. We have a diverse and talented crew with a
  culture that promotes teamwork, along with an unwavering
  focus on serving our clients' best interests. We are seeking
  a highly experienced Senior Full Stack Engineer to
  contribute to the design, development and optimisation of
  front office applications within the GIFS team. This role
  works closely with the front office, as such the role will
  require collaborating directly with the portfolio managers
  as well as the product owners.

  In this role you will

  Core Responsibilities

  - Provides expert level system analysis, design, development,
    and implementation of applications and databases.
    Integrates third party products. Ensures that expected
    application performance levels are achieved
  - Ensures the viability of IT deliverables. Recommends
    development options, including design, build/buy, and
    vendor purchase. Conducts testing, including
    functionality, technical limitations, and security
  - Elevates code into the development, test, and production
    environments on schedule. Provides follow up production
    support. Submits change control requests and documents
  - Provides subject matter expertise in software development
    methodology and development architecture standards.
    Mentors and trains staff with less experience. Resolves
    elevated issues and recommends enterprise-wide
    improvements
  - Participates in design, code, and test inspections
    throughout the life cycle to identify issues. Explains
    technical considerations at related meetings, including
    those with internal clients. Performs systems analysis
    activities
  - Thoroughly understands client business functions and
    technology needs. Has a broad and deep understanding of
    Vanguard's technologies, tools, and applications,
    including those that interface with business area and
    systems. Is well versed on the latest technologies and
    tools supporting software development in the industry
  - Interfaces with cross functional team members and
    communicates systems issues at the appropriate technical
    level for each audience
  - Thoroughly understands and complies with Information
    Technology and Information Security policies and
    procedures and verifies that deliverables meet
    requirements
  - Participates in special projects and performs other duties
    as assigned

  What it takes

  Qualifications

  - Strong related work experience
  - Undergraduate degree or equivalent combination of training
    and experience. Graduate degree preferred

  Experience

  - Expertise in frontend technologies (e.g. Vue.js, React) with
    a strong sense for UI/UX
  - Proven backend experience with Java, ideally with Python and
    Node.js experience as well, including building distributed
    microservices based architectures
  - Strong understanding of system design principles, scalable
    architecture patterns and API

  designs

  - Experience with both relational and NoSQL databases
    (Postgres, MySQL, DynamoDB)
  - Proficiency in cloud platforms (AWS, Azure or GCP)
  - Familiarity with CI/CD pipelines and automated testing
    frameworks
  - Strong understanding of investment products, and trading
    workflows

  Special Factors

  - Vanguard is not offering visa sponsorship for this position
  - This is a hybrid position and would require you to work in
    the office 3 days per week (Tuesday, Wednesday & Thursday)
  - Please note that we review applications on a rolling basis
    and may close this role early if there is a high level of
    interest. To avoid missing out, we recommend applying as
    soon as possible

  Why Vanguard?

  Vanguard is a different kind of investment company. It was
  founded in the United States in 1975 on a simple but
  revolutionary idea: that an investment company should manage
  its funds solely in the interests of its clients.

  This is a philosophy that has helped millions of people
  around the world to achieve their goals with low-cost,
  uncomplicated investments.

  It's what we stand for: value to investors.

  Inclusion Statement 

  Vanguard’s continued commitment to diversity and inclusion
  is firmly rooted in our culture. Every decision we make to
  best serve our clients, crew (internally employees are
  referred to as crew), and communities is guided by one
  simple statement: “Do the right thing.” 

  We believe that a critical aspect of doing the right thing
  requires building diverse, inclusive, and highly effective
  teams of individuals who are as unique as the clients they
  serve. We empower our crew to contribute their distinct
  strengths to achieving Vanguard’s core purpose through our
  values. 

  When all crew members feel valued and included, our ability
  to collaborate and innovate is amplified, and we are united
  in delivering on Vanguard's core purpose: to take a stand
  for all investors, to treat them fairly, and to give them
  the best chance for investment success.

  How We Work

  Vanguard has implemented a hybrid working model for the
  majority of our crew members, designed to capture the
  benefits of enhanced flexibility while enabling in-person
  learning, collaboration, and connection. We believe our
  mission-driven and highly collaborative culture is a
  critical enabler to support long-term client outcomes and
  enrich the employee experience.
