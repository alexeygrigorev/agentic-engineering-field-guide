description: |
  Voop is building the global child-safe phone network —
  protecting millions of children and adults from digital
  harm.

  About Voop

  Awareness has never been higher about the damage smartphones
  can do to young people, yet almost no one is fixing it.

  Voop is building the world’s first safe mobile platform — a
  new kind of network that replaces traditional telcos and
  installs intelligent protection on any smartphone.

  By combining network-level controls, device-integrated
  safeguarding software, and AI-powered risk detection, Voop
  gives parents, carers, schools, and governments the ability
  to protect without over-restricting — all on the devices
  that children and adults already use and love.

  Our first product, Voop for Care, is live with leading care
  providers, protecting thousands of vulnerable children in
  the UK. Next, we’re expanding into consumer markets to make
  digital safety the default, not the exception.

  Backed by leading global investors and built by a world-
  class team of engineers, designers, and safeguarding
  experts, Voop is tackling one of the defining challenges of
  our time: creating a safer digital future at massive scale.

  Why Voop

  - Mission that matters: Build technology that directly
    protects children and saves lives.
  - Massive opportunity: A $50B+ global market for safe
    connectivity, with active customers and real revenue.
  - World-class team: Alumni from Google, Accenture, Vodafone,
    Barnardo’s, and law enforcement.
  - Momentum: Thousands of users onboarding, millions more in
    the pipeline.
  - Top-tier backing: Supported by global funds committed to
    fixing smartphones for good.

  The Opportunity

  As a Fullstack Engineer at Voop, you’ll play a pivotal role
  in developing and scaling our platform across web and
  mobile. You’ll work closely with Nick Pasha-Gubbins (Co-
  Founder & CTO) on:

  - Architectural decisions for the core Voop platform.
  - Feature development across Voop for Care, Voop for Schools,
    and Voop for Parents.
  - Frontend build-out of modern web applications and mobile
    apps for iOS and Android using React and Kotlin
    Multiplatform.
  - Deployment, optimisation, and real-world testing during
    pilots and large-scale rollouts.

  From day one, you’ll contribute to production code, shape
  product direction, and see the direct impact of your work
  through user outcomes and safeguarding results.

  This is a great time to join an early stage company with
  strong market traction, backing and momentum to go big.

  Key Responsibilities

  - Develop and maintain Voop’s full stack platform, including
    real-time web apps, mobile apps, and backend services.
  - Design and implement frontend experiences across web and
    mobile (React / React Native / Kotlin Multiplatform).
  - Build and optimise backend services (Hono, Postgres, AWS,
    Kamailio) powering the Voop network.
  - Work on systems for mobile network management, device
    control (MDM), and AI-driven safeguarding tools.
  - Collaborate with the CTO and engineering team on
    architecture, scalability, and security.
  - Ship fast, iterate quickly, and deliver measurable value to
    real users.
  - Engage with end-users to understand their challenges and
    ensure our technology delivers real-world impact.

  Current stack: Typescript, React / React Native, Kotlin
  Multiplatform, Hono, Postgres, Pulumi/SST, Docker, AWS,
  Kamailio.

  About You

  - You’re pragmatic, fast-moving, and technology-agnostic,
    focused on solving the right problems well.
  - You have several years of experience as a senior engineer or
    technical lead building quality products in lean teams.
  - You’re opinionated but collaborative, bringing scars from
    what hasn’t worked and empathy for working fast with
    others.
  - You care about the craft: clean architecture, reliability,
    and great user experience.
  - You take ownership from frontend to backend and DevOps,
    seeing features through end-to-end.
  - You’re driven by impact: building tech that matters, not
    just code that works.

  Bonus Points

  - Experience with voice/SMS platforms (e.g. Twilio, SIP
    Trunks).
  - Understanding of mobile network architecture or MDM
    frameworks.
  - Strong knowledge of networking (Layer 3+) or secure
    communications.
  - Passion for online safety, child protection, or social
    impact tech.
