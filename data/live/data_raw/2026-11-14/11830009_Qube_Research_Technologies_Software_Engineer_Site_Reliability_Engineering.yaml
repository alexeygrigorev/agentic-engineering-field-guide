description: |
  Qube Research & Technologies (QRT) is a global quantitative
  and systematic investment manager, operating in all liquid
  asset classes across the world. We are a technology and data
  driven group implementing a scientific approach to
  investing. Combining data, research, technology and trading
  expertise has shaped QRT’s collaborative mindset which
  enables us to solve the most complex challenges. QRT’s
  culture of innovation continuously drives our ambition to
  deliver high quality returns for our investors. 

  QRT is seeking a Software Engineer with a deep understanding
  of systems design and reliability principles. You will join
  a small, experienced team in the greenfield implementation
  of a bare-metal trading platform.

  Your future role within QRT:

  - While participating in the team on-call rota, you will have
    broad and deep responsibility for the system design,
    deployment, configuration and daily operation of:
  - You will be responsible for interfacing with traders,
    researchers, application developers and other internal
    teams, as well as external service providers
  - You will be comfortable solving complex issues in a critical
    production environment, applying pragmatic fixes in the
    moment, which then become engineered solutions

  Your Present Skillset:

  - Bachelors/Masters/PhD in Computer Science, Computer
    Engineering or Electrical Engineering
  - Strong problem-solving skills and deep understanding of
    computer-science fundamentals
  - Hands-on experience at with Linux systems
  - Proven track record designing and delivering scalable
    systems in production environments

  Nice to have:

  - Experience with infrastructure-as-code tools
  - Experience with monitoring and observability tools
  - Deep understanding of servers, switches and operating
    systems
  - Expertise in the synchronization and propagation of ultra-
    precise timing signals
  - Knowledge of low-latency systems, trading environments,
    market data, or exchange protocols

  QRT is an equal opportunity employer. We welcome diversity
  as essential to our success. QRT empowers employees to work
  openly and respectfully to achieve collective success. In
  addition to professional achievement, we are offering
  initiatives and programs to enable employees achieve a
  healthy work-life balance.
