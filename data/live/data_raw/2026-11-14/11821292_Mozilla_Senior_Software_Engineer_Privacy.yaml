description: |
  Why Mozilla?

  Mozilla Corporation is the non-profit-backed technology
  company that has shaped the internet for the better over the
  last 25 years. We make pioneering brands like Firefox, the
  privacy-minded web browser. Now, with more than 225 million
  people around the world using our products each month, we’re
  shaping the next 25 years of technology and helping to
  reclaim an internet built for people, not companies. Our
  work focuses on diverse areas including AI, social media,
  security and more. And we’re doing this while never losing
  our focus on our core mission – to make the internet better
  for people.

  The Mozilla Corporation is wholly owned by the non-profit
  501(c) Mozilla Foundation. This means we aren’t beholden to
  any shareholders — only to our mission. Along with thousands
  of volunteer contributors and collaborators all over the
  world, Mozillians design, build and distribute open-source
  software that enables people to enjoy the internet on their
  terms.

  About this team and role:

  Are you passionate about Privacy Protections and the Open
  Web? Do you want to ship software to a large user base? Do
  you want your contributions to have a positive impact on the
  world?  Do you want to advance current browser architecture
  to make the web a safer place for users?

  Mozilla exists to build the Internet as a public resource
  accessible to all because we believe that open and free is
  better than closed and restricted. We are looking for a
  Senior Software Engineer to support the Privacy Team to
  advance the Firefox Web Platform.

  What you'll do:

  - Implement Privacy-improving, anti-tracking and threat
    intelligence protection into the Firefox web browser to
    mitigate user tracking and phishing.
  - Implement architectural improvements into Gecko, the browser
    engine underlying Firefox.
  - Build performant, low-latency, and maintainable C++,
    JavaScript and Rust code
  - Work as part of a geographically distributed team in an
    asynchronous manner (mostly Europe and US-East).

  What you'll bring:

  - Bachelor's degree in computer science, engineering, or a
    related program; or equivalent work experience.
  - At least 4 years of experience with programming in C++ and
    Rust, with a strong background in memory safety, multi-
    threaded system architecture, or raw data stream
    manipulation.
  - Proven ability to onboard quickly, deliver and improve
    complex software projects.
  - Proven track record of independently scoping and landing
    complex features within tight release windows.
  - Excellent written and verbal communication skills. You can
    validate your progress and decisions and communicate them
    clearly.

  Bonus Points:

  - You have already contributed to the Mozilla mission and the
    codebase.
  - Experience working within the browser space (Gecko,
    Chromium, WebKit) or web engine runtime abstractions.
  - Experience or high interest in designing or leveraging ML
    pipelines to automate internal developer workflows.
  - Deep understanding of web architecture, the privacy/security
    model of the web, and client-side data structures.
  - Knowledge of basic statistical modeling.
  - Proficiency with Python and SQL.

  What you’ll get:

  - Generous performance-based bonus plans to all eligible
    employees - we share in our success as one team
  - Generous retirement contributions with 100% immediate
    vesting (regardless of whether you contribute)
  - Quarterly all-company wellness days where everyone takes a
    pause together
  - Country specific holidays plus a day off for your birthday
  - One-time home office stipend
  - Annual professional development budget
  - Quarterly well-being stipend
  - Considerable paid parental leave
  - Employee referral bonus program
  - Other benefits (life/AD&D, disability, EAP, etc. - varies by
    country)

  About Mozilla

  Mozilla exists to build the Internet as a public resource
  accessible to all because we believe that open and free is
  better than closed and controlled. When you work at Mozilla,
  you give yourself a chance to make a difference in the lives
  of Web users everywhere. And you give us a chance to make a
  difference in your life every single day. Join us to work on
  the Web as the platform and help create more opportunity and
  innovation for everyone online.

