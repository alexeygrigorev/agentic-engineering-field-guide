description: |
  CoreWeave is The Essential Cloud for AI™. Built for pioneers
  by pioneers, CoreWeave delivers a platform of technology,
  tools, and teams that enables innovators to build and scale
  AI with confidence. Trusted by leading AI labs, startups,
  and global enterprises, CoreWeave combines superior
  infrastructure performance with deep technical expertise to
  accelerate breakthroughs and turn compute into capability.
  Founded in 2017, CoreWeave became a publicly traded company
  (Nasdaq: CRWV) in March 2025. Learn more at
  www.coreweave.com.

  About the Team

  CoreWeave is The Essential Cloud for AI™ — the
  infrastructure that the world's leading AI labs,
  researchers, and enterprises depend on. The Developer
  Experience (DevEx) team owns the platform, services, and
  systems that enable every engineer at CoreWeave to build and
  ship software faster, more safely, and with greater
  confidence. Our scope spans the full developer lifecycle: CI
  (continuous integration) and build infrastructure, test
  experience, delivery systems, artifact storage and
  distribution, internal developer platforms, and the agentic
  AI tooling that is redefining how engineers move from idea
  to production.

  This is a role for a technical leader who operates across
  team boundaries. You'll own the hardest problems in
  developer productivity at CoreWeave, by setting the
  technical strategy for DevEx, removing systemic friction
  across the engineering org, and shaping the agentic
  developer platform that will define how engineers build
  software here for years to come.

  What You'll Do

  - Define and drive the technical strategy for the DevEx
    platform. Set the long-term architectural direction across
    CI pipeline infrastructure, test experience, delivery
    systems, artifact management, and agentic developer
    tooling, balancing engineering excellence with business
    priorities and org-wide scale.
  - Solve the highest-complexity developer productivity problems
    at CoreWeave. Identify systemic bottlenecks that span
    teams, design solutions that operate reliably across 40+
    data centers, and drive execution from architecture
    through production.
  - Lead the agentic developer platform from a technical
    standpoint. Evolve the architecture of MCP servers, tool
    integration, and agent-accessible DevEx APIs so that
    autonomous workflows become a first-class primitive for
    every engineer at CoreWeave.
  - Drive cross-team technical initiatives. Work across DevEx,
    infrastructure, security, SRE, and product engineering to
    align on platform direction, resolve deep architectural
    trade-offs, and establish engineering standards that raise
    the bar org-wide.
  - Mentor and develop Senior II engineers. Actively coach ICs,
    elevate technical decision-making across the team, and
    build the engineering depth needed to sustain DevEx as
    CoreWeave scales.
  - Proactively reduce systemic risk. Identify technical debt
    and reliability gaps before they become incidents, and
    drive durable improvements to platform resilience,
    efficiency, and developer trust.

  What We're Looking For

  - 10+ years of software engineering experience with
    significant time spent building and owning production
    developer platforms, build infrastructure, or large-scale
    distributed systems.
  - Bachelor's degree in Computer Science, Engineering, or a
    related technical field. Master's degree preferred.
  - Demonstrated ability to define and execute multi-year
    technical strategies across complex, cross-team domains.
  - Deep systems design expertise. You design for correctness,
    scalability, and long-term maintainability. You have
    strong opinions on API design, service architecture, and
    platform abstractions, and you can articulate why.
  - Proficiency in Go, Python, or similar languages with a track
    record of shipping large-scale production services in
    cloud-native environments.
  - Expertise in Kubernetes and IaaC (Infrastructure as Code) at
    the platform design level. You understand the scheduler,
    the API machinery, and the extension points.
  - Experience with or strong leadership interest in AI-native
    developer tooling, including agentic frameworks, LLM-
    integrated developer workflows, or autonomous software
    development agents.
  - Proven ability to influence technical decisions at the
    organization level, build alignment across teams with
    competing priorities, and communicate clearly with
    engineering leadership.
  - A track record of growing senior engineers and building
    technical strength in the teams around you. You are an
    inspiring leader.

  Nice to Have

  - Deep expertise in one or more DevEx domains, including
    large-scale CI, build and test systems (Bazel, Buildkite,
    remote execution, caching), deployment (GitOps, ArgoCD),
    artifact storage and distribution, or ephemeral
    development environment infrastructure.
  - Hands-on experience designing and operating progressive
    delivery systems at scale, including SLO-based quality
    gates, automated multi-stage pipeline orchestration, and
    custom Kubernetes operators, across heterogeneous
    deployment environments.
  - Experience architecting and landing agentic systems at
    scale, including designing MCP servers, agent governance
    models, or tool-augmented LLM workflows that operate
    reliably in production with consistent user-facing value-
    add.
  - Prior experience as a technical lead or system architect on
    a platform or infrastructure team with broad engineering
    org impact.

  The base salary range for this role is $188,000 to $275,000.
  The starting salary will be determined based on job-related
  knowledge, skills, experience, and market location. We
  strive for both market alignment and internal equity when
  determining compensation. In addition to base salary, our
  total rewards package includes a discretionary bonus, equity
  awards, and a comprehensive benefits program (all based on
  eligibility).

  What We Offer

  In addition to a competitive salary, we offer a variety of
  benefits to support your needs. The benefits below reflect
  our US-based offerings for full-time employees; for roles in
  other locations, benefits vary and are shared during the
  hiring process. These include:

  - Medical, dental, and vision insurance - 100% paid for by
    CoreWeave
  - Company-paid Life Insurance
  - Voluntary supplemental life insurance
  - Short and long-term disability insurance
  - Flexible Spending Account
  - Health Savings Account
  - Tuition Reimbursement
  - Ability to Participate in Employee Stock Purchase Program
    (ESPP)
  - Mental Wellness Benefits through Spring Health
  - Family-Forming support provided by Carrot
  - Paid Parental Leave
  - Flexible, full-service childcare support with Kinside
  - 401(k) with a generous employer match
  - Flexible PTO
  - Catered lunch each day in our office and data center
    locations
  - A casual work environment
  - A work culture focused on innovative disruption

