description: |
  This role sits at the heart of the fastest-growing segment
  of the AI engineering market and we are looking for
  engineers who can translate platform potential into
  measurable business value inside a live enterprise
  environment.


  Accenture offers breadth across every industry and
  enterprise technology stack, plus vendor fellowship access
  inside Anthropic, OpenAI, Microsoft, and Google engineering
  teams, and a direct pathway into our Forward Deployed
  Engineer programme.


  What you will do

  - Embed directly with client engineering and business teams to
    deploy, scale, and operationalise AI platforms, including
    Anthropic, OpenAI, Microsoft, Google, Salesforce, SAP, and
    Palantir, inside enterprise environments

  - Own production outcomes end-to-end: time-to-value,
    reliability, adoption velocity, and scalability

  - Move from ambiguous business problem to working production
    system through rapid experimentation: days to prototype,
    weeks to production-ready

  - Design and govern AI architectures across the full
    enterprise stack, spanning identity, data, security,
    governance, platform layer, and workflow integration

  - Build reusable patterns, playbooks, and accelerators that
    the client owns after you leave, and codify delivery
    learnings that scale across engagements

  What we are looking for

  - Hands-on engineering experience with cloud-native systems
    (APIs, microservices, containerization, serverless)

  - Demonstrated expertise in designing and deploying agentic
    solutions (agents, orchestration, context engineering,
    RAG, workflows)

  - Demonstrated end-to-end delivery ownership in a client-
    embedded environment, with experience building
    relationships with senior stakeholders



  We are hiring across Europe at multiple levels. If you are
  passionate about agentic AI and building systems that go
  beyond the pilot and into production at scale, we would love
  to hear from you.

  #LI-MP

  About Accenture

  Accenture is a leading global professional services company
  that helps the world’s leading businesses, governments and
  other organizations build their digital core, optimize their
  operations, accelerate revenue growth and enhance citizen
  services—creating tangible value at speed and scale. We are
  a talent- and innovation-led company with approximately
  791,000 people serving clients in more than 120 countries.
  Technology is at the core of change today, and we are one of
  the world’s leaders in helping drive that change, with
  strong ecosystem relationships. We combine our strength in
  technology and leadership in cloud, data and AI with
  unmatched industry experience, functional expertise and
  global delivery capability. Our broad range of services,
  solutions and assets across Strategy & Consulting,
  Technology, Operations, Industry X and Song, together with
  our culture of shared success and commitment to creating
  360° value, enable us to help our clients reinvent and build
  trusted, lasting relationships. We measure our success by
  the 360° value we create for our clients, each other, our
  shareholders, partners and communities.

  Visit us at www.accenture.com

