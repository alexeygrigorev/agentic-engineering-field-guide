description: |
  Meet Method

  Method has built the most modern way to connect to consumer
  financial accounts. Combining real-time liability
  connectivity with instant payment execution, Method’s API is
  designed to make it easy for people to connect their
  financial accounts to the apps and services they want to
  use. We have helped 45+ million users connect 350+ million
  liability accounts credential-less and processed over $2.5B
  in payments, helping users save millions in interest. One in
  every three credit cards in the United States is in the
  Method ecosystem and leading financial institutions like
  SoFi, Bilt, Cleo, Sezzle, Figure & Aven rely on our APIs to
  build magical experiences for millions of consumers. We’re a
  team of 50+ people spread across offices in Austin, SF, New
  York City, and Washington D.C! We’re excited to continue the
  momentum working alongside our investors and advisors from
  Andreessen Horowitz, Emergence Capital, Y Combinator, Avra,
  and Ardent. To learn more about us, check out our blog!

  The impact

  As a member of the engineering team, you will own projects
  from end-to-end, making decisions on technical and business
  implications. You will have autonomy over your projects with
  support from the team when you need it.

  What you'll do

  - Build and create with JavaScript across the platform. Build
    a reliable backend in Node and delightful user experiences
    in React.
  - Build and scale our core API to handle millions of requests
    per day
  - Investigate and debug any issues using our monitoring &
    logging tools as well as create clear action items to
    resolve them.
  - Help maintain our high technical bar by participating in
    code reviews and interviewing new team members.
  - Collaborate with the rest of the team to define the roadmap
    by thoroughly understanding customers’ needs.

  Who you are

  - 5+ years of full-time software engineering experience,
    ideally full-stack, but backend leaning is ok
  - Expert knowledge in JS, Python, Java or equivalent languages
  - Experience building scalable production-level applications.
    (A history of excellent projects is required)
  - You can clearly communicate the concepts or ideas behind
    your solutions, and cut big solutions into smaller bite-
    sized tasks
  - You can tow the line between moving fast and breaking things
    and moving slowly to get things right the first time.
  - Natural curiosity to stay up to date with new technologies
    and emerging Fintech trends

  Extra awesome

  - Experience in Finance / FinTech
  - Experience building data pipelines
  - Knowledge of payment rails such as ACH, RTP, etc.
  - DevOps experience with AWS, Cloudflare, and CI/CD tools

  --

  The annual US base salary range for this role is:
  $205,000-$240,000.

  Benefits available to full time employees

  - Medical, Dental, Vision; basic medical plans 100% covered
  - Flexible PTO
  - $30/day Lunch allowance when working from the office
  - 12 weeks parental leave
  - Commuter benefits; employer-sponsored
  - Phone/internet stipend
  - WFH stipend
  - Student loan repayment contribution
  - Lifestyle Spending stipend
  - Learning & Development stipend
  - Hybrid-office stocked with snacks
  - Quarterly team off-sites

  In-office Policy

  For most roles are Method, we expect a regular in-person
  presence at one of our hubs in NYC, Austin, SF or DC. We
  have embedded flexibility to work remotely for a week here
  and there, but the general expectation is a minimum 2-3
  days/week in office on average. What does not work is full-
  time remote.

  Accommodations

  Method provides reasonable accommodations to applicants with
  disabilities. If you need assistance with your application
  due to a disability, please contact us at
  talent@methodfi.com to request an accommodation.
