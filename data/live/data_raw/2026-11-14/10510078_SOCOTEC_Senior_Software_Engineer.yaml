description: |
  Company Description

  SOCOTEC company is a provider of niche consulting services
  within the architecture, engineering and construction
  industries focusing on high-performance buildings and
  specialty structures. Through an integrated, holistic
  approach, our professionals provide solutions for building
  envelope, energy efficiency, sustainability, code advisory
  and construction advisory projects

  SOCOTEC’s combination of expertise, experience and methods
  are increasingly recognized as best-in-class fueling
  significant growth.

  SOCOTEC is proud to announce that it has been officially
  certified as a Great Place to Work by the renowned global
  authority on workplace culture, Great Place to Work®.

  Job Description

  We're hiring a Software Engineer to join our US engineering
  team and contribute meaningfully across our AI platform and
  product portfolio. This is a full-stack role with
  significant exposure to applied AI, data infrastructure, and
  enterprise automation. You'll write production code, own
  components end-to-end, and have a direct line of sight from
  your work to its business impact.

  This role is a great fit for an engineer with a few years of
  full-stack experience who wants to grow into AI platform
  work and take on real ownership. You'll be one of a handful
  of engineers shipping software used across SOCOTEC's global
  business units.

  Responsibilities

  - Design and build features end-to-end across modern React
    frontends and Python (Django / FastAPI) backends
  - Own components and small services — from spec through
    deployment and operation
  - Contribute to AI-powered features: prompt engineering, agent
    workflows, RAG pipelines, and LLM integrations
  - Participate in architecture and design discussions;
    influence technical direction as you grow into the role
  - Write clean, tested, maintainable code and participate in
    code reviews
  - Collaborate closely with engineering lead, DevOps, and
    business stakeholders to translate requirements into
    shipped software
  - Help maintain and improve developer practices: CI/CD,
    testing, documentation, and operational excellence

  Qualifications

  Required

  - 5-8 years of professional full-stack software engineering
    experience
  - Strong proficiency with React (or comparable modern frontend
    framework) and Python (Django, FastAPI, or similar)
  - Solid understanding of REST APIs, relational databases, and
    modern web application architecture
  - Familiarity with containerized deployments (Docker)
  - Experience with cloud infrastructure (AWS/Azure) and CI/CD
    workflows (GitHub Actions or equivalent)
  - Excellent written and verbal communication; comfortable
    working across time zones and with non-technical
    stakeholders
  - Curiosity about AI/ML and a genuine interest in building AI-
    powered products

  Strongly Preferred

  - Experience integrating with LLM APIs (OpenAI, Anthropic, or
    similar) in production
  - Familiarity with one or more of: agent orchestration
    frameworks (LangGraph, LangChain), vector databases
    (Pinecone, Weaviate), or RAG architectures
  - Experience with modern data infrastructure (Databricks,
    Snowflake, Airbyte, or similar)
  - Experience with workflow automation platforms (n8n, Zapier,
    Temporal, or similar)

  Nice to Have

  - Experience working on small engineering teams where
    individual ownership is high
  - Exposure to enterprise SaaS or compliance-sensitive
    industries
  - Background in AEC, construction tech, or industrial
    software.

  Additional Information

  For more information, please visit www.socotec.us

  Job Type: Full-Time, 4 days a week in office with one
  hybrid/ remote day

  Salary: $137-180k

  All your information will be kept confidential according to
  EEO guidelines.

  SOCOTEC is an Equal Opportunity Employer.
