description: |
  An exciting opportunity to join an industry-leading company
  in the nonprofit software market.

  At Enthuse, we’re on a mission to transform digital
  fundraising by building the technology that empowers great
  causes. Our donations, event registration, and fundraising
  platform helps thousands of charities raise millions.

  Launched in 2012, we’ve come a long way — we’ve grown the
  team to over 70 people and now serve thousands of charities.
  Enthuse is headquartered in London, with operations in
  Scotland, Northern Ireland and the Republic of Ireland.
  What's more, Enthuse is the official online fundraising
  partner for London Marathon Events and Great Run. Reporting
  to the Engineering Manager, you’ll pioneer the development
  of innovative software solutions that align with our
  company's goals — and also help build and grow a company of
  smart and passionate people. And create a real impact.

  We’re looking for a fullstack engineer to push the
  boundaries of web development. You’ll be building highly-
  performant, scalable B2B(2C) applications on a modern
  TypeScript stack that runs at the edge. If you’re early in
  your career but already care deeply about performance, UX,
  and shipping things that matter to real users, this could be
  the perfect role for you.

  How you’ll contribute

  - Develop fast, secure, and scalable fullstack applications in
    TypeScript across web components, modern JS frameworks,
    and services running on edge compute.
  - Build and evolve event-driven services — writing the
    producers, consumers, and the data that flows between them
    — and help shape how we model domains across a service-
    oriented architecture.
  - Contribute to end-to-end product delivery, from design to
    implementation, iterating rapidly in a high-traffic, fast-
    paced environment.
  - Work close to the infrastructure: provisioning cloud
    resources through Infrastructure as Code, and
    understanding how your code is deployed, observed, and
    rolled back.
  - Provide valuable input to technical decisions and help us
    keep raising the bar on code quality, testing, and
    developer experience.
  - Collaborate closely with cross-functional teams to create
    products that are both technically brilliant and user-
    centric.
  - Obsess over performance, user experience, and Core Web
    Vitals to ensure products deliver delightful and
    frictionless experiences.

  About you

  - 1+ years of experience as a Software Engineer, building
    modern web applications.
  - Comfortable using Gen AI tools as part of your day-to-day
    workflow, coaching agents and verifying output.
  - Passion for shipping fast, iterating, and continuously
    delivering value to users.
  - Experience working in a high-growth, fast-paced startup
    environment is a plus.
  - Some exposure to Infrastructure as Code (Pulumi, Terraform,
    CDK, or similar) and cloud services (AWS, GCP, Azure, or
    Cloudflare). Interest in edge computing is a bonus.
  - An understanding of UX principles and Core Web Vitals.
  - Experience with build tools, CI/CD pipelines, and modern
    development workflows.

  What you’ll get

  - We celebrate together with an early Friday finish with
    optional team drinks, team incentives, and a variety of
    company socials
  - We believe work-life balance matters and have flexible
    hours, working from home, and support part-time work
  - We believe in giving back and give you one paid day to
    fundraise for a charity of your choice
  - We want you to travel well with the Cycle to Work scheme,
    season ticket loan, and a London-based office
  - We will support your journey through our learning and
    development program with an allowance for training each
    year and Personal Development Plans, as well as a mentor
    program that offers structured support from senior team
    members
  - Holiday allowance: 25 days holiday and bank holidays (33 in
    total). We increase holidays based on length of service,
    so for every year you’re with us, you’ll get an additional
    day’s holiday up to 28 days. We also offer an additional 5
    days of unpaid holiday
  - Your birthday off!
  - 1 month paid sabbatical after 5 years at Enthuse
  - Enthuse Wings! Work from abroad for up to 4 weeks of the
    year!
  - We offer a generous equity options scheme at a fast-growing,
    stable company backed by socially responsible investors.
    We give back to all our employees who get us closer to
    achieving our mission
  - Private health insurance coverage
  - Places for Races, as partners of London Marathon Events and
    Great Run, we get access to a number of participant places
    for major fundraising events. So if you're a keen runner,
    swimmer or cyclist - you could be in luck

  Come as you are. Love what you do.



  At Enthuse, we want to create a positive impact on a global
  scale. And to do that we know that the people at Enthuse
  have to reflect all global lives and identities.



  We work flexible hours, we support remote working, and if
  that doesn’t quite work, we will definitely listen to what
  will. We’re striving to create a place where all feel valued
  and welcome — and would love to hear how we could do that
  for you.

  No matter what your background, identity, or even if your
  experience doesn’t exactly match — we’d love to hear from
  you!
