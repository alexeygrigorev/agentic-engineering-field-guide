description: |
  Alkami is the digital sales and service platform provider
  for U.S. banks and credit unions. Our unified Platform
  integrates onboarding, digital banking, and data and
  marketing—each solution can stand alone, but together they
  deliver more—to help institutions onboard, engage, and grow
  relationships. As the future shifts toward Anticipatory
  Banking, we help data-informed bankers meet the moment with
  technology that drives action.

  Founded in 2009, we continue to be recognized for our
  intentional culture and tremendous growth (Best Place to
  Work in Fintech; Best & Brightest to Work For Nationally;
  and Comparably’s Best Company Culture, Best Career Growth,
  Best Engineering Team, and Best Places to Work in Dallas,
  among others). We’re building a culture where each Alkamist
  can perform to their highest potential, and we’re always on
  the lookout for the best and brightest minds. If you’re
  ready to experience the power of alchemy - transforming the
  ordinary into the extraordinary - come join one of the
  fastest growing SaaS companies in the U.S.

  As a remote-first company, most of our positions can be
  remote in the US, except for key roles, which will be
  indicated in the Job Title.

  Follow us on Glassdoor and LinkedIn!

  The Software Engineer will build computer software systems,
  participating in the design process from beginning to end.
  Demonstrates technical domain knowledge of the company,
  including apps, services, systems, or frameworks.

  Key Responsibilities & Duties:

  - Write clean code to develop functional web applications
    using object-oriented design, design patterns, data
    structures, relational databases
  - Participate in the entire application lifecycle, focusing on
    coding and debugging
  - Troubleshoot and debug applications
  - Perform UI tests to optimize performance
  - Build reusable code and libraries for future use
  - Gather and address technical and design requirements with
    little assistance
  - Follow development standards set within the team
  - Collaborates effectively within the agile framework with a
    problem-solving attitude and willing to take a variety of
    approaches
  - Demonstrates strong written and verbal communication skills
    within the team
  - Respond promptly to on-call incidents, including
    troubleshooting and resolving critical disruptions to
    ensure minimal downtime
  - Adhere and uphold Alkami’s core values.

  Recommended Experience & Education

  Minimum Years of Experience:

  Typically requires a minimum of 2 years of related
  experience; or an advanced degree without experience

  Education Level Bachelor’s degree in engineering, or another
  related field or equivalent work experience

  Knowledge, Skills, & Qualifications

  Required

  ● 2-4 years of experience in software development or a
  related field. ● Ability to show programming skills in an
  object-oriented language such as Java or C#, with proven
  work experience as a full-stack developer ● Experience with
  database frameworks such as NoSQL, SQL Databases, Object-
  Relational Mapping (ORM) frameworks ● Understanding the
  entire software development process (design, development and
  deployment) ● Experience developing and deploying
  applications for Cloud Native Infrastructure ● Experience
  working within Agile framework ● Good analytical and time
  management skills, with a proven ability to deliver value
  with some assistance ● Familiarity with monitoring and
  supporting production systems, proficiency in identifying
  and resolving issues, implementing proactive measures, and
  tracking measurements. ● Knowledge of performance
  measurements of applications ● Understanding and some
  practical application of REST API best practices.
  Proficiency in adhering to standards, ensuring security,
  scalability, and optimal performance ● Developing tests,
  including unit tests, UI automation tests, integration tests
  ● Teamwork skills with a problem-solving attitude and
  willing to take a variety of approaches ● Strong written and
  verbal communication skills, with demonstrated experience
