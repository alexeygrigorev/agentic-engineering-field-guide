description: |
  We’re building a large healthcare portal and the services
  behind it — a React web application, a suite of embeddable
  micro-frontend widgets, and a serverless Python API layer on
  AWS. You’ll own a significant area of this platform end to
  end: shaping the design, writing the code, securing it,
  shipping it through CI/CD, and operating it in production.

  This is a true full-stack role — frontend and backend are
  equally important, and you’re expected to be effective
  across both. You’ll move comfortably between a React UI, the
  serverless APIs behind it, and the infrastructure that runs
  it all.

  This is a senior role for someone who can take an ambiguous
  problem, drive it to a well-architected solution, and
  deliver with minimal oversight. You’ll set technical
  direction in your area, raise the quality bar, and mentor
  others — not wait to be handed tickets.

  Responsibilities

  - Own a domain end to end across the full stack — from the
    React UI through the serverless API to the data and
    infrastructure that backs it.
  - Build and maintain features in a React single-page
    application and a family of independently deployable
    micro-frontend widgets that embed into it.
  - Design and implement Python serverless APIs (AWS Lambda
    behind API Gateway), with typed request/response models
    and an OpenAPI contract as the source of truth.
  - Build and evolve identity and authorization — OAuth2/OIDC
    sign-in, MFA, token validation, and fine-grained,
    entitlement-based access control (including
    delegated/third-party access scenarios).
  - Integrate with upstream enterprise APIs: model their
    contracts defensively, handle partial/missing data
    gracefully, run calls concurrently, and keep changes
    backward-compatible.
  - Design data and caching layers (e.g., DynamoDB), manage
    secrets, and tune performance and reliability of your
    services.
  - Harden everything for a regulated, PII/PHI-sensitive
    environment — data masking, least-privilege access,
    secrets management, and secure handling of personal data
    by default.
  - Own your CI/CD: automated linting, type-checking, tests,
    security scans, and infrastructure changes through to
    production.
  - Define and evolve infrastructure as code, and participate in
    operational ownership of your services.

  Qualifications

  - 7+ years of professional software engineering experience,
    including significant experience delivering modern full-
    stack web applications in production environments.
  - Strong hands-on experience building frontend applications
    with React, TypeScript, and modern single-page application
    architectures.
  - Proven experience designing and developing backend services
    using Python, including RESTful APIs, service integration,
    and API contract-driven development.
  - Deep experience with AWS cloud services, including AWS
    Lambda, API Gateway, DynamoDB, IAM, CloudWatch, and
    related serverless technologies.
  - Strong understanding of authentication and authorization
    technologies, including OAuth 2.0, OpenID Connect (OIDC),
    MFA, token-based security, and role- or entitlement-based
    access controls.
  - Experience implementing secure software solutions in
    environments containing sensitive customer, healthcare,
    financial, or regulated data.
  - Demonstrated expertise with CI/CD pipelines, automated
    testing, code quality controls, security scanning, and
    release automation.
  - Hands-on experience with Infrastructure as Code (IaC) using
    tools such as Terraform, AWS CDK, CloudFormation, or
    similar technologies.
  - Experience designing scalable data solutions using NoSQL
    and/or relational databases, including performance
    optimization, caching strategies, and data modeling.
  - Strong understanding of software engineering best practices,
    including system design, automated testing, observability,
    resiliency, and production support.
  - Proven ability to lead technical initiatives, independently
    drive ambiguous requirements to implementation, and make
    architectural decisions with minimal oversight.
  - Experience mentoring engineers, conducting code reviews, and
    influencing engineering standards and technical direction
    across a team.
  - Excellent written and verbal communication skills, with the
    ability to collaborate effectively across product,
    engineering, architecture, security, and business
    stakeholders.

