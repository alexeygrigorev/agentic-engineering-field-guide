description: |
  Job Description

  Workhint is looking for a Full-Stack Engineer who can build
  across the entire product stack - from frontend interfaces
  to backend systems, APIs, databases, automations, and AI-
  powered workflows.

  This is not a narrow engineering role. We are looking for a
  builder who can take an idea, understand the product logic,
  design the technical approach, and ship working software
  quickly. You should be comfortable building full product
  flows, not just isolated features.

  You will work on Workhint’s agentic work orchestration
  platform, helping companies build and operate custom
  workforce systems using modular components, workflow
  engines, onboarding flows, payments, compliance, and AI-
  assisted configuration.

  The ideal candidate knows how to build modern web
  applications and also knows how to use AI tools effectively
  to move faster - including AI coding assistants, automation
  tools, prompt-based development, API integrations, and AI-
  powered product workflows.

  Responsibilities

  - Build and maintain full-stack product features across
    frontend, backend, and database layers
  - Develop clean, responsive, and scalable user interfaces
  - Build backend APIs, business logic, authentication flows,
    and integrations
  - Design and manage database schemas, data models, and
    platform configuration structures
  - Integrate third-party tools, APIs, webhooks, automation
    platforms, and AI services
  - Build AI-assisted workflows that help users configure
    platforms, generate outputs, and automate operations
  - Work with product and business requirements and turn them
    into working software
  - Debug issues across the full stack, from UI behavior to
    backend logic and data flow
  - Use AI development tools responsibly to accelerate coding,
    testing, documentation, and prototyping
  - Improve system reliability, performance, security, and
    maintainability
  - Contribute to product architecture decisions as the platform
    scales

  What We’re Looking For

  - Strong full-stack engineering experience
  - Ability to build complete product flows from idea to
    production
  - Experience with modern frontend frameworks such as React,
    Next.js, Vue, or similar
  - Experience with backend development using Node.js, Python,
    or similar technologies
  - Experience working with APIs, webhooks, authentication,
    databases, and cloud services
  - Understanding of relational databases such as PostgreSQL or
    MySQL
  - Comfortable working with AI coding tools and AI-assisted
    development workflows
  - Able to think like a product builder, not just a task
    executor
  - Strong problem-solving skills and ability to work
    independently
  - Comfortable in an early-stage startup environment where
    speed, ownership, and clarity matter

  Bonus Experience

  - Experience building SaaS platforms, marketplaces, HR tech,
    workforce management, or workflow automation tools
  - Experience with AI APIs such as OpenAI, Anthropic, Gemini,
    or similar
  - Experience with automation tools like n8n, Zapier, Make, or
    custom webhook systems
  - Experience with Supabase, Firebase, Azure, AWS, or similar
    cloud platforms
  - Experience with payments, invoicing, compliance, onboarding,
    or role-based access systems
  - Experience building internal tools, admin dashboards, or
    multi-tenant platforms

  What Success Looks Like

  You can take a product idea, break it into technical pieces,
  build the frontend, connect the backend, structure the data,
  integrate the right APIs, and ship a working system.

  You do not wait for every detail to be handed to you. You
  think through the product, ask the right questions, use AI
  tools to move faster, and deliver practical software that
  solves real customer problems
