description: |
  We are looking for a talented Senior Software Engineer to
  develop and maintain AI-powered consumer applications that
  help people understand, learn, communicate, and work more
  effectively. In this role, you will help creating practical
  software products that solve real-world problems through AI,
  automation, and intuitive user experiences. Rather than
  providing custom software development or consulting
  services, we build and operate our own software products for
  consumers worldwide. Our first product, CAPCUE, demonstrates
  our vision of creating software that enhances human
  productivity and accessibility through AI. As the company
  grows, we plan to develop additional consumer-focused
  software products across productivity, education,
  communication, accessibility, and other technology-driven
  categories.

  Responsibilities

  - Bridge the gap between high-scale system architecture and
    frontier AI.
  - Design, develop, and maintain high-quality software
    solutions using TypeScript, NodeJS, PostgreSQL, Redis,
    LLMs (GPT, Claude, etc), Docker, and other modern
    technologies.
  - Scale hybrid-cloud infrastructure by building multi-tenant
    platform capabilities for seamless agent and model
    execution across diverse cloud and on-prem environments.
  - Drive operational excellence through robust solutions for
    real-time monitoring, distributed tracing, and automated
    evaluation of agents & models in production.
  - Collaborate closely with cross-functional teams to translate
    product requirements into scalable and efficient code.
  - Participate in and influence code reviews, architectural
    discussions, and technical planning sessions to ensure
    code quality and scalability.
  - Take ownership of key components and features, from design
    to deployment, and drive them to completion with a focus
    on performance, reliability, and security.
  - Contribute to the evolution of our technical architecture
    and infrastructure, leveraging cloud services such as GCP
    to optimize performance and scalability.

  What You’ll Bring

  - 8+ years of experience as an engineer on a high-performing
    team at a B2B SaaS company.
  - Deep systems expertise with proven experience building
    scalable back-end systems, focusing on containerization
    and orchestration (4 years of in-depth Kubernetes is a
    must).
  - AI/ML fluency with a strong understanding of the lifecycle
    of LLMs and autonomous agents, including inference
    optimization and RAG architectures.
  - Operational rigor with a track record of implementing
    observability (logging, metrics, tracing) in complex,
    distributed environments.
  - Database expert. Strong understanding of database
    technologies, including PostgreSQL and Redis, and
    experience with designing and optimizing database schemas.
  - In-depth knowledge of software engineering with experience
    coding applications or services in a high-level
    programming language, preferably Python, and a basic
    knowledge of related fields.
  - Strong technical aptitude for designing and implementing
    software solutions.
  - Experience with modern application development frameworks.
  - Knowledge of professional software engineering practices and
    best practices for the full software development life
    cycle, including coding standards, code reviews, source
    control management, build processes, testing, and
    operations.
  - Deep hands-on technical expertise, excellent verbal and
    written communication skills.
  - Experience with Agile software development techniques.

  Preferred Qualifications

  - Experience writing software for hybrid cloud (Google Cloud
    Platform, AWS, Azure).
  - Ability to use a wide variety of open-source technologies
    and cloud-based services.
  - Experience building high-performance, highly available, and
    scalable distributed systems.

