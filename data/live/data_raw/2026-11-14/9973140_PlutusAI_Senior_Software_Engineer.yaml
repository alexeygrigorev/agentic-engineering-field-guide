  applicants, including those with criminal histories, in
  compliance with applicable Fair Chance laws. To comply with
  civil rights laws, we invite applicants to voluntarily self-
  identify their race, ethnicity, gender, and veteran status.
  This information is confidential, optional, and will not
  affect your application. Pursuant to pay transparency laws,
  salary ranges and benefits will be disclosed where required
  by law. Compensation is based on factors such as experience,
  skills, and qualifications.
