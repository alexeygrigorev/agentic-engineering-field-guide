description: |
  About Farsight AI

  Farsight is the agentic AI platform for financial services,
  currently helping investment banks and private equity firms
  fully automate entire, highly nuanced workflows. Farsight’s
  flagship product is our Office Add-in: a native integration
  inside PowerPoint, Excel, and Word. Rather than asking
  bankers to leave their existing workflow, we bring
  Farsight's full AI capabilities into the tools they already
  live in

  Farsight is also building the first system that learns the
  judgment, taste, and iteration that goes between a first and
  final draft for financial deliverables!

  Our Team

  We're a team built of top-tier ex-banking and engineering
  talent: Hugging Face, AWS, founding engineers of other
  startups, JPMorgan, Evercore, General Atlantic, and more.

  We are entirely based in Manhattan, New York City, and are
  in-person 4 days a week (except Fridays, which are remote).

  Job Description

  Farsight is building one of the most complex AI products in
  the market: agentic workflows, streaming outputs, non-
  deterministic systems, LLM orchestration, and enterprise-
  grade accuracy requirements.

  You will be responsible for designing and implementing
  complete technical systems, informed from business needs and
  often addressing customer feedback. All while upholding our
  standard of developing clean, efficient, and ready for
  change software. The scope of your projects will range from
  longer term swings to bug fixes alike, each of which crucial
  to our company's success.

  Desired Qualifications

  - 2+ years of non-internship software engineering experience
  - Production AI and LLM experience: someone who has shipped
    LLM-powered features to real users, understands how models
    fail in production, and can build reliable systems around
    non-deterministic outputs
  - Experience with Python and cloud-based infrastructure like
    AWS
  - Someone who reasons about failure modes, edge cases, and
    scale before writing code, comfortable making
    architectural decisions with incomplete information and
    adapting when they're wrong

  Above and Beyond Qualifications

  - Have previously worked at either an early-stage startup or
    big tech
  - Understanding of system design patterns and test-driven
    development techniques in order to create reliable, ready
    for change code
  - Previous experience interacting with customers and receiving
    customer feedback

  Compensation & Benefits

  - Salary ranges between $120,000 and $170,000, commensurate
    with experience
  - Equity: Meaningful early-stage package with standard vesting
    (4 year / 1-year cliff)
  - Comprehensive medical, dental and vision insurance
  - Unlimited PTO

  Equal Opportunity

  Farsight is proud to be an Equal Employment Opportunity and
  Affirmative Action employer. We do not discriminate based
  upon race, religion, color, national origin, sex (including
  pregnancy, childbirth, or related medical conditions),
  sexual orientation, gender, gender identity, gender
  expression, transgender status, sexual stereotypes, age,
  status as a protected veteran, status as an individual with
  a disability, or other applicable legally protected
  characteristics. We also consider qualified applicants with
  criminal histories, consistent with applicable federal,
  state and local law.
