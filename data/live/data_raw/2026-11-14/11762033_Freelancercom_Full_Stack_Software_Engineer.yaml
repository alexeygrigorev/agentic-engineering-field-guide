description: |
  We’re looking for a Full-Stack Software Engineer to join our
  Platform Performance team and help us deliver lightning-
  fast, scalable experiences to millions of users around the
  world.

  In this role, you’ll work across the stack-sharpening
  frontend speed, optimising backend services, and making our
  user interfaces more responsive, reliable, and delightful to
  use. You’ll collaborate with passionate engineers and
  product managers to identify performance bottlenecks,
  contribute to architectural improvements, and help evolve
  our design system.

  This is a fantastic opportunity for an ambitious engineer
  looking to build their skills in a fast-paced environment
  and make a meaningful impact at scale. Freelancer.com is the
  world's largest freelancing and crowdsourcing marketplace,
  connecting over 80 million users across 247 countries,
  regions, and territories. Our platform enables businesses,
  entrepreneurs, and individuals to collaborate with skilled
  professionals from anywhere in the world, turning ideas into
  reality faster than ever before.

  Our mission is bold: to create one billion jobs globally by
  empowering people to work for themselves and build
  sustainable careers online. Every feature we ship and every
  performance improvement we make brings us one step closer to
  enabling opportunity at an unprecedented scale.

  What You’ll Do

  - Identify and solve performance issues across both frontend
    (Angular) and backend (PHP, Python, Go).
  - Optimise page load speed, rendering performance, and API
    response times.
  - Contribute to our design system and build reusable UI
    components using Angular and TypeScript.
  - Help maintain and evolve scalable backend systems for high-
    performance APIs.
  - Collaborate with cross-functional teams to implement best
    practices in performance, usability, and accessibility.
  - Participate in architecture discussions and continuously
    improve our codebase and tooling.
  - Promote and support performance monitoring and testing
    practices.

  What We’re Looking For

  - Professional experience as a full-stack or frontend
    engineer.
  - Solid experience with Angular and TypeScript.
  - Comfort working with backend technologies like PHP, Python,
    or Go.
  - A good understanding of frontend performance optimisation
    techniques.
  - Familiarity with RESTful API design and backend performance
    considerations.
  - Experience building and maintaining reusable UI components.
  - Exposure to design systems or component libraries.
  - Strong communication skills and a collaborative mindset.
  - A proactive attitude, with the ability to take ownership and
    see tasks through.

  Bonus Points (Nice to have)

  - Understanding of accessibility and UI/UX design principles.
  - Familiarity with SEO and frontend performance metrics.
  - Experience with automated testing (Jest, Cypress, PHPUnit,
    etc.).
  - CI/CD or DevOps knowledge.
  - Open-source contributions or personal projects.

  Why Join us

  - Work on a platform with global impact - we’re on a mission
    to create one billion jobs.
  - A culture that values ownership, transparency, and
    meritocracy.
  - Fast-track your growth with mentorship, real ownership, and
    exposure to internet-scale challenges.
  - Weekly CEO town halls, quarterly hackathons, and team events
    to keep you engaged and inspired.
  - A chance to help build the tools and systems that power the
    next generation of our platform.
