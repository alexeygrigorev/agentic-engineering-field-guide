description: |
  About Watershed

  Watershed is the enterprise sustainability platform.
  Companies like Airbnb, Carlyle Group, FedEx, Visa, and Dr.
  Martens use Watershed to manage climate and ESG data,
  produce audit-ready metrics for voluntary and regulatory
  reporting including CSRD, and drive real decarbonization. We
  are looking for team members who love product-building, want
  to work hard at a mission-oriented startup, and will
  collaborate with us in shaping the culture of a growing
  team.

  We have offices in San Francisco, New York, Denver, London,
  Paris, Berlin, Sydney, Mexico City, and remote team members
  across the US and Europe. We hope that you'll be interested
  in joining us!

  The role

  Energy Management is a strategic bet on the next chapter of
  Watershed. We’re building software that helps companies turn
  complex energy data into better purchasing and investment
  decisions—reducing costs while delivering on sustainability
  goals.

  We’re looking for a software engineer who thrives in the
  earliest stages of product development. As an early engineer
  on a small, cross-functional team, you’ll help shape both
  the product and how we build it. You’ll write code, speak
  directly with customers, learn from our energy experts, and
  turn what you discover into products that deliver measurable
  business value.

  You will:

  - Build a product that powers Watershed’s next chapter,
    helping companies reduce energy costs and make better
    investment decisions.
  - Get close to the customer problem, building tools with
    decision-makers whose choices influence multi-million-
    dollar energy budgets and investments.
  - Shape a new product from zero to one, partnering with pilot
    customers to discover what delivers value and shape our
    path to product-market fit.
  - Move in fast learn → build → test cycles, shipping and
    refining product iterations in hours and days. You’ll be
    carving the marble block, not polishing a finished
    sculpture.
  - Develop AI-powered, agentic workflows that help customers
    understand their energy data, evaluate opportunities and
    make better decisions.
  - Apply strong engineering judgement, leveraging Watershed’s
    platform and expertise where they accelerate progress, and
    knowing when to prototype independently.
  - Learn the energy domain alongside in-house experts,
    collaborating across our New York and London team to turn
    that knowledge into useful products.

  You’ll likely be a good fit if you:

  - Have 3+ years building software products, with a track
    record of increasing ownership and delivering work that
    mattered to your company and its customers.
  - Have helped build an early-stage product or a new product
    line where the customer needs and solution weren’t fully
    defined.
  - Are autonomous and proactive: you ask good questions, find
    direction in ambiguity, and know when to seek help.
  - Are comfortable working across the stack and doing the
    engineering needed to deliver an outcome.
  - Bring strong product judgement and want direct customer
    contact—not just a list of features to implement.
  - Are excited to learn the energy domain and use AI to solve
    real customer problems.

  Useful, but not required:

  - Experience building customer-facing AI products or agentic
    workflows.
  - Exposure to energy-related products or businesses.
  - Experience with B2B software, financial modelling, or
    Node.js and TypeScript.





  Must be willing to work from an office 4 days per week
  (except for remote roles)

  Watershed has hub offices in San Francisco, New York,
  London, and Mexico City and satellite offices in Denver,
  Sydney, Paris, and Berlin. Where we have offices, employees
  are expected to be in office for 4 days per week. Certain
  jobs are open to being remote and will be specifically noted
  on the jobs page and in the job description if so.

  What’s the interview process like?

  It starts the same for every candidate: getting to know the
  team members through 1 to 2 conversations about Watershed,
  your experience, and your interests. Next steps can vary by
  role, but usual next steps are a skill or experience
  interview (e.g. a coding interview for an engineer, a
  portfolio review for a designer, deeper experience call for
  other roles) which leads to a virtual or in person interview
  panel. We prioritize transparency and lack of surprise
  throughout the process.

  What if I need accommodations for my interview?

  At Watershed, we are dedicated to ensuring an inclusive
  recruitment process. We provide reasonable accommodations
  for candidates with disabilities, long-term conditions,
  mental health needs, religious observances, neurodivergence,
  or pregnancy-related support requirements. If you need
  assistance during your process, please contact your
  recruiter.
