description: |
  At ClickUp, we're building the future of work: the first
  truly converged AI workspace unifying tasks, docs, chat,
  calendar, and enterprise search, all supercharged by
  context-driven AI. We are an AI-native company. Every team
  member is expected to leverage AI daily, and we evaluate AI
  fluency as part of our hiring process. Join us and help
  redefine what's possible. 🚀

  Role Overview

  We’re seeking a Principal Frontend Engineer to drive the
  long-term technical vision for frontend engineering at
  ClickUp. In this role, you will lead architectural strategy
  across major product surfaces, solve company-wide frontend
  challenges, and influence how teams build and ship at scale.
  You will partner deeply with engineering, product, design,
  backend, and integrations leadership to ensure ClickUp’s
  frontend systems remain fast, reliable, and adaptable as the
  business grows.



  This is a hands-on technical leadership role for someone who
  can operate at both strategic and implementation levels,
  especially in a high-growth, fast-paced environment.

  What You’ll Do

  - Define and drive frontend architecture strategy across
    product areas and platform investments
  - Lead the design of scalable, performant systems in Angular
    and React that support rapid product development
  - Solve complex cross-team technical challenges related to
    performance, state management, scalability, and developer
    productivity
  - Partner with backend and integrations teams to shape end-to-
    end architecture for major features and systems
  - Raise the bar for quality, testing, maintainability, and
    engineering rigor across the frontend organization
  - Provide technical leadership on the highest-impact
    initiatives and unblock teams working through ambiguous or
    difficult problems
  - Guide teams toward pragmatic decisions that support both
    speed and long-term product quality
  - Mentor senior and staff engineers, and help shape frontend
    engineering culture and standards
  - Influence roadmap and organizational decisions through
    strong technical judgment and product partnership



  Qualifications

  - 10+ years of frontend engineering experience, including deep
    expertise in large-scale web applications
  - Expert-level experience with Angular, React, TypeScript,
    RxJS, and NgRx or similar state management systems
  - Proven track record of architecting complex frontend systems
    used by large numbers of users
  - Deep expertise in performance optimization, frontend
    scalability, maintainable application design, and reusable
    component architecture
  - Experience driving technical strategy across multiple teams
    or product areas
  - Strong judgment in balancing speed, quality, and long-term
    architecture in fast-moving environments
  - Outstanding communication and collaboration skills, with the
    ability to influence across functions and levels
  - Strong mentoring background and passion for building high-
    performing engineering organizations
  - Experience with testing infrastructure and ability to define
    testing strategies for large scale features changes.

