description: |
  Datavant is a data platform company and the world’s leader
  in health data exchange. Our vision is that every healthcare
  decision is powered by the right data, at the right time, in
  the right format.

  Our platform is powered by the largest, most diverse health
  data network in the U.S., enabling data to be secure,
  accessible and usable to inform better health decisions.
  Datavant is trusted by the world’s leading life sciences
  companies, government agencies, and those who deliver and
  pay for care.

  By joining Datavant today, you’re stepping onto a high-
  performing, values-driven team. Together, we’re rising to
  the challenge of tackling some of healthcare’s most complex
  problems with technology-forward solutions. Datavanters
  bring a diversity of professional, educational and life
  experiences to realize our bold vision for healthcare.

  At Datavant we love Engineers who love to solve the whole
  problem, from understanding the business reasons, designing
  for the -ilities (scalability, supportability,
  maintainability, etc.), writing beautiful code and tests,
  automating deployment, and planning for operations.  As a
  member of the unified experience team, you’ll build the
  frameworks and tools that enable Datavant’s products to
  delight customers and meet our high security standards.  You
  will set the standard for the user experience across all of
  Datavant’s business units and products.  Our tech stack of
  choice is Typescript + React on the frontend and python on
  the backend.

  What You Will Bring to the Table:

  - 8+ years of experience writing production-ready code,
    performing code reviews, and working on design and
    architecture of applications
  - 4+ years of experience implementing identity and access
    controls for online applications
  - Exceptional ability to write production-ready libraries that
    developers want to use
  - Demonstrated experience owning projects and migrations,
    mentoring proactively, and getting stuff done
  - Readiness to thrive and communicate with your team and
    collaborate with others in a fast-paced environment
  - Excitement, passion, and curiosity about our mission of
    connecting the world’s health data and improving patient
    outcomes

  The Impact You Will Make:

  - Lead design, implementation, and overall development of your
    products
  - Guide and mentor other engineers while developing cutting-
    edge solutions for our health data ecosystem
  - Own substantial projects, take on more responsibility with
    fewer rules, and act like an owner
  - Drive innovation and deliver valuable data solutions for our
    clients
  - Work with our modern tech stack including Python,
    TypeScript, React, AWS, and more
  - Help contribute to our awesome tech blog - click here to
    check it out!

