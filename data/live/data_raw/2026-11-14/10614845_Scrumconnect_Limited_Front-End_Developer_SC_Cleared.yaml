description: |
  About Scrumconnect

  Scrumconnect is a leading digital transformation consultancy
  helping public and private sector organisations deliver
  innovative, user-centred digital services. We combine agile
  delivery, modern engineering practices, and deep domain
  expertise to create solutions that improve outcomes for
  millions of users. Our teams work collaboratively across
  multidisciplinary environments, supporting large-scale
  transformation programmes and enterprise initiatives.

  Role Overview

  We are seeking Frontend Engineers and Senior Frontend
  Engineers to design, build, and maintain modern digital
  services that are accessible, scalable, and user-focused.
  Working within multidisciplinary agile teams, you will
  collaborate closely with product managers, designers,
  architects, and engineers to deliver high-quality solutions.

  Senior Frontend Engineers will additionally provide
  technical leadership, mentor team members, and help
  establish frontend engineering standards and best practices
  across multiple teams.

  Key Responsibilities

  - Develop and maintain responsive, accessible, and scalable
    web applications.
  - Build reusable components and modern frontend architectures.
  - Collaborate with designers and product teams to deliver
    user-centred solutions.
  - Ensure applications meet performance, accessibility, and
    security standards.
  - Participate in code reviews and contribute to engineering
    best practices.
  - Troubleshoot and resolve complex technical issues.
  - Support continuous integration and continuous delivery
    practices.
  - Work effectively within agile delivery teams.

  Additional Responsibilities for Senior Frontend Engineers

  - Provide technical leadership and mentoring to engineers.
  - Drive frontend engineering standards and governance.
  - Lead technical design discussions and architecture
    decisions.
  - Promote component-driven development and reusable design
    patterns.
  - Support delivery planning and technical roadmap activities.

  Essential Skills & Experience

  - Strong experience with modern frontend development
    frameworks and architectures.
  - Proficiency in HTML, CSS, JavaScript, and TypeScript.
  - Experience building responsive and accessible web
    applications.
  - Understanding of frontend performance optimisation
    techniques.
  - Experience working within agile software delivery
    environments.
  - Strong communication and stakeholder engagement skills.

  Senior-Level Experience

  - Extensive experience delivering complex frontend solutions.
  - Proven experience mentoring engineers and leading technical
    initiatives.
  - Experience defining engineering standards and frontend
    strategy.
  - Ability to influence technical decisions across multiple
    teams.

  Additional Information

  - SFIA Level: 4 & 5
  - Location: Flexible (all UK locations considered except
    London)
  - Security Clearance: Active SC Clearance required
