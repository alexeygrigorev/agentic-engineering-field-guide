  Our Purpose  Mastercard powers economies and empowers people
  in 200+ countries and territories worldwide. Together with
  our customers, we're helping build a sustainable economy
  where everyone can prosper. We support a wide range of
  digital payments choices, making transactions secure,
  simple, smart and accessible. Our technology and innovation,
  partnerships and networks combine to deliver a unique set of
  products and services that help people, businesses and
  governments realize their greatest potential. Title and
  Summary Senior Software Engineer Job Overview You'll join
  the Real Time Payments (RTP) Platform, Tooling & Engineering
  Enablement team as a senior technical individual
  contributor. We uplift engineering across RTP and act as a
  force multiplier for the program. We align RTP to Mastercard
  standards across platform, CI/CD, and governance, while
  improving developer experience and supporting AI enablement.
  You'll apply strong engineering knowledge to technical
  problems, working with teams across RTP Engineering. How
  success is measured The team is measured on four key areas:•
  Developer Experience - DX improves across RTP and stays
  above the Mastercard benchmark• Innovation & Architecture -
  the right technology comes into RTP, and what works is
  shared back with the enterprise• AI Enablement - AI is
  adopted consistently and acts as a force multiplier across
  RTP• Standards & Governance - Mastercard and RTP standards
  embedded, with teams, including our own, held to them Major
  Accountabilities• Apply strong engineering expertise to
  improve how RTP builds, tests, and ships software•
  Contribute to the design and delivery of secure, resilient,
  and scalable solutions with clear, well-documented designs•
  Investigate technical problems, analysing data and areas of
  failure or inefficiency, and turn findings into practical
  recommendations• Evaluate approved engineering practices and
  technologies that could improve how RTP works• Support
  practical AI adoption across RTP Engineering teams using
  approved tools• Help embed standards and governance by
  supporting adoption, reviewing how we work, and helping turn
  gaps into owned actions or items for the program tech
  roadmap• Work with teams across RTP to support shared
  engineering outcomes• Communicate technical topics clearly
  to leadership through concise reporting and recommendations•
  Share engineering knowledge and provide guidance to
  engineers across cross-functional teams Education•
  Bachelor's degree in Computer Science, Information
  Technology, or Engineering, or equivalent experience
  Knowledge / Experience• Strong experience in software
  engineering and software design, with Java desired• Strong
  experience in CI/CD• Strong experience in platform
  engineering and cloud• Experience delivering complex
  technical work and contributing to solution design•
  Experience using AI in day-to-day engineering, such as AI
  coding assistants and agents, and supporting adoption across
  teams• Experience applying engineering standards, including
  design, secure coding, and testing• Experience presenting
  technical information clearly to business and technology
  audiences• Experience supporting and guiding other
  engineers• Experience working effectively across teams
  without direct authority• Knowledge of payments, or
  experience working in a regulated industry Corporate
  Security Responsibility All activities involving access to
  Mastercard assets, information, and networks comes with an
  inherent risk to the organization and, therefore, it is
  expected that every person working for, or on behalf of,
  Mastercard is responsible for information security and must:

  - Abide by Mastercard's security policies and practices;
  - Ensure the confidentiality and integrity of the information
    being accessed;
  - Report any suspected information security violation or
    breach, and
  - Complete all periodic mandatory security trainings in
    accordance with Mastercard's guidelines.
