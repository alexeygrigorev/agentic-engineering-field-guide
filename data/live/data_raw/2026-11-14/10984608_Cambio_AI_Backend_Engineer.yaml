description: |
  Cambio is a software platform for real estate
  decarbonization. We help commercial real estate owners bring
  their portfolios to net-zero with an AI-driven
  sustainability, asset, and investment management platform.
  We're backed by Y Combinator, Google, and Stanford — and
  we're the fastest-growing startup in our category.

  The role

  We're looking for a Backend Engineer to build, help
  teammates do their best work, and have fun doing it.

  What you'll be doing

  - Launch customer-facing features by building Django backend
    services
  - Improve the customer experience through performance
    optimizations
  - Improve the eng team's quality of life by committing to tech
    debt reduction
  - Support and collaborate with your teammates

  Who you are

  - An A-player: low ego, curious, and serious about your craft
  - You are outcome driven
  - Work isn't in opposition to life for you - it's part of your
    life because you genuinely enjoy it
  - You ship through obstacles — roadblocks are part of the
    problem to solve
  - You move with urgency and close the week with visible impact
  - You're relentlessly curious and treat truth-seeking as a
    discipline
  - You believe iteration speed is quality - the way to build
    great things is to build fast and learn faster
  - You show up for your teammates, in person. You unblock
    before being asked and never let someone stay stuck
  - You own your work end-to-end - proactive about visibility,
    proud of your progress, and you over-communicate until
    everyone is fully aligned

  What you bring

  - Independent problem simplification skills
  - Experienced in Python web development (Django & Ninja is a
    bonus)
  - Solid grasp of computer science and algorithm fundamentals
  - Exceptional research & debugging skills
  - Understanding of technical trade-offs and the YAGNI
    principle

  Our tech stack

  - Infra: AWS, Kubernetes, Redis, PostgreSQL, SQS, CDK, GitHub,
    Retool
  - Backend: Django REST/Ninja, Celery
  - Frontend: TypeScript, React, Next.js, Tailwind CSS
  - LLM: AWS Bedrock, OpenAI, Claude

  Logistics

  - Work authorization: authorized to work in the US or Canada,
    and able to travel to both
  - This is an in-person role based in Kitchener-Waterloo, New
    York, or San Francisco

  What we offer

  - Competitive compensation and startup equity
  - Flexible time off
  - $1,200 annual learning budget
  - Catered lunch
  - Best workstation in a beautiful office in Uptown Waterloo
  - Office gym
