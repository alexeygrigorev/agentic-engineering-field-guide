description: |
  This is a remote position.



  We're representing an early-stage, fully remote software
  company (headquartered in Canada) building tooling that
  helps organizations understand and control their cloud
  spend. The product gives teams clearer visibility into where
  cloud dollars go and how to use them more efficiently. The
  company has built a solid and expanding customer base on the
  back of a small, fast-moving engineering team that ships
  continuously.




  The Role



  You'll manage a compact, high-leverage group of product
  engineers whose focus is turning customer needs into shipped
  value quickly and deliberately. Areas the team owns and
  continues to build out include:




  - Spend-management functionality. Think forecasting, unusual-
    usage detection, and allocation logic that keeps customers
    in front of their cloud costs
  - Flexible, reusable interface components that make exploring
    spend intuitive
  - Visualization tools that expose usage patterns and query
    performance
  - Data pipelines and transformation models that turn raw usage
    into actionable insight
  - A dependable, performant application customers can rely on
    daily



  You'll work hand-in-hand with product and design so the
  team's effort lands where it matters most for customers.




  What You'll Own as a Leader



  - Coach, develop, and expand an engineering team while keeping
    the culture collaborative and high-output
  - Keep delivery on track by clarifying priorities, maintaining
    alignment, and clearing obstacles
  - Help the team weigh velocity against quality and make smart
    tradeoffs under time pressure
  - Enable engineers to carry features from first idea through
    to launch
  - Take part in recruiting, ramping new hires, and
    strengthening the broader org
  - Set and maintain sensible standards around design, testing,
    documentation, and how decisions get made
  - Keep collaboration tight across product, design, and
    leadership







    Requirements

  Markers of Success



  - Developing real fluency in the product, the customers, and
    the business
  - Consistently shipping quality outcomes through the people
    you lead
  - Growing engineers and clearing the path for their best work
  - Instilling ownership, accountability, and a habit of steady
    improvement
  - Keeping communication and decision-making crisp across
    functions



  Technology Environment (helpful to know, not mandatory)




  - Frontend: TypeScript, React, Next.js, Tailwind
  - Backend: Python, FastAPI, Postgres, Snowflake
  - Infra & data: Terraform, GCP, dbt, Dagster



  Bonus Points For



  - Having led engineers inside young startups
  - Exposure to FinOps, cloud infrastructure, cost optimization,
    or data-platform work
  - Hands-on time with a comparable stack
