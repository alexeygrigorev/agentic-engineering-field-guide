description: |
  Bounteous is a global AI Services firm where agentic
  engineering and human experience converge to deliver
  transformative business outcomes for the enterprise. We help
  organizations design, build, and scale AI-driven products,
  platforms, and processes. With more than 5,000 team members
  worldwide, Bounteous delivers AI that sticks, powering
  adoption and outcomes that move organizations from
  experimentation to true transformation. Bounteous is backed
  by New Mountain Capital, a New York-based growth-oriented
  investment firm that emphasizes business building.

  Job Role: Senior Java Developer Duration: Fulltime &
  Contract - 12 months plus Location: Glasgow, UK (Hybrid
  Model: 3 days per week in office) Experience level: Minimum
  4-12 yrs

  Mandatory skills:

  Java 8, Kafka, Collections, Multi-threading, problem solving
  as core skillset with knowledge of databases and design
  patterns, and some hands-on experience on UNIX. The
  candidate needs to be a self-starter, a confident
  personality with good communication skills who can work with
  minimum oversight and handholding.

  Key Responibilities:

  - Proactively contribute to enhancing our current applications
    that are written in Java 17.
  - Engage with senior stakeholders to break down complex and
    ambiguous problems/requirements into technical
    specifications.
  - Comfortable with working autonomously in a high trust
    environment, but equally important to be able to build
    collaboratively with members of the team.
  - Write unit, component, integration, end-to-end, and
    performance tests.
  - Core understanding of streaming in Java and how to leverage
    it with AWS proprietary services.
  - Extensive experience with Spring Boot framework.
  - Implement various architecture patterns (microservices,
    event-driven, CQRS, hexagonal, cloud-native).
  - Databases: Basic knowledge of SQL. Familiarity with non-
    relational databases.
  - Communication Skills: Good oral and written English
    communication skills are required for this role. A
    successful candidate must be able to work alongside the
    users and the wider developer community in the firm and
    should also be able to communicate effectively with them.

  Skills & Experience:

  - Bachelor or Master’s degree.
  - A deep understanding of AWS for cloud solutions.
  - A strong understanding of CI/CD pipelines.
  - Strong relational database skills using Postgres.
  - Proficient in using Kafka as the message broker.
  - Nurture, guide and mentor junior members of the team. Nice
    to Have:
  - Experience with Java 21.
  - Experience with Cloud Migration strategies.
  - Experience with Kafka Streaming.
  - Experience with Argo CD.
  - Experience with Gitlab for CI/CD processes.
  - Experience with Behaviour Driven Design writing automation
    test cases in Cucumber.

  Information Security Responsibilities

  - Promote and enforce awareness of key information security
    practices, including acceptable use of information assets,
    malware protection, and password security protocols
  - Identify, assess, and report security risks, focusing on how
    these risks impact the confidentiality, integrity, and
    availability of information assets
  - Understand and evaluate how data is stored, processed, or
    transmitted, ensuring compliance with data privacy and
    protection standards (GDPR, CCPA, etc.)
  - Ensure data protection measures are integrated throughout
    the information lifecycle to safeguard sensitive
    information

