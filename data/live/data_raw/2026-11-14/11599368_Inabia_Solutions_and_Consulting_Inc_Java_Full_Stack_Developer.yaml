description: |
  Java Full Stack Developer

  - Employer: Inabia Solutions & Consulting Inc.
  - Locations: New York City, NY | Plano, TX | Columbus, OH
  - Work Arrangement: 100% onsite
  - Employment Type: Long-term W-2 Contract
  - Compensation: $50- $55.00 per hr.

  About the Opportunity Inabia Solutions & Consulting Inc. is
  seeking experienced Java Full Stack Developers to build
  cloud-native applications and production-grade AI
  capabilities for a financial services client. You will
  develop end-to-end solutions using React and
  TypeScript/JavaScript, Java/Spring Boot microservices, and
  AWS. The role requires hands-on experience integrating
  agentic AI into applications, with a focus on secure,
  reliable operation in production. This engagement offers
  potential for direct full-time employment with the client
  after 9–12 months, based on performance and business needs.
  Conversion is not guaranteed. Key Responsibilities

  - Deliver production-grade solutions integrating agentic AI,
    large and small language models (LLMs/SLMs), Model Context
    Protocol (MCP), retrieval-augmented generation (RAG),
    agent orchestration frameworks, and automation.
  - Build end-to-end application capabilities using React with
    TypeScript/JavaScript on the front end and Java/Spring
    Boot microservices on the back end.
  - Design, deploy, and operate scalable, event-driven
    microservices on AWS using Docker, Kubernetes, serverless
    compute, and messaging patterns.
  - Build and maintain CI/CD pipelines using tools such as
    Jenkins and Spinnaker.
  - Develop automated tests, evaluate AI workflows, and conduct
    performance and load testing using tools such as
    BlazeMeter.
  - Implement production observability and monitoring using
    tools such as Splunk and Dynatrace to investigate issues
    and maintain application stability.
  - Partner with product, design, data, architecture, and
    risk/control stakeholders to deliver secure, stable, and
    scalable AI solutions that address business needs.
  - Participate in code reviews, troubleshoot production issues,
    and communicate technical decisions and delivery progress
    clearly.

  Required Qualifications

  - 8+ years of hands-on Java Full Stack development experience.
  - Strong expertise in Java, Spring Boot, microservices, and
    REST API development.
  - Hands-on React development experience using
    TypeScript/JavaScript, HTML, and CSS.
  - Practical experience integrating LLMs/SLMs, RAG, MCP, and
    agent orchestration frameworks into applications.
  - Experience developing and operating cloud-native
    applications on AWS.
  - Hands-on experience with Docker, Kubernetes, serverless
    compute, and event-driven messaging patterns.
  - Experience building or maintaining CI/CD pipelines using
    Jenkins, Spinnaker, or comparable tools.
  - Experience with automated testing, performance testing, and
    load testing.
  - Experience using production monitoring and observability
    tools such as Splunk and Dynatrace.
  - Ability to apply security, access controls, data protection,
    and operational reliability practices to AI-enabled
    applications.
  - Strong problem-solving and communication skills, including
    experience working with client stakeholders.
  - Ability to work 100% onsite in New York City, Plano, or
    Columbus.
  - U.S. citizen or Green Card holder. Visa sponsorship is not
    available.

  Preferred Qualifications

  - Python experience for LLM engineering and data processing,
    including small services, automation, and evaluation
    harnesses.
  - Experience delivering AI-enabled applications in financial
    services or other regulated environments.
