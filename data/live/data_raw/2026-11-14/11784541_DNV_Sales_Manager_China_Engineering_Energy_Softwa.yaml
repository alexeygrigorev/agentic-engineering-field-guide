description: |
  DNV’s Business Line Renewables develops engineering software
  that helps customers solve complex challenges across
  renewable energy and ocean industries. Our Renewables &
  Ocean Structures (ROS) portfolio includes trusted solutions
  such as Sesam, Bladed and Nauticus Machinery.

  As part of DNV Energy Systems, we bring together technical
  expertise, software and strong customer focus to support the
  energy transition and the sustainable use of the ocean. Our
  global teams work closely across Sales, Customer Success,
  Product Management, Software Engineering and Marketing.

  As Sales Manager, you will drive the growth of our software
  business in China, with a particular focus on offshore wind
  and offshore oil & gas. You will be responsible for winning
  new customers and growing existing accounts, building strong
  customer relationships and increasing recurring revenue.
  Reporting to the Global Head of Sales in Europe, you will
  work closely with our established China sales team and
  regional and global colleagues.

  Responsibilities:

  - Build and maintain a strong sales pipeline, identifying new
    prospects and developing new business, cross-sell, upsell
    and renewal opportunities.
  - Manage the full sales process, from prospecting and
    qualification through proposal, negotiation, closing and
    follow-up.
  - Develop priority customer accounts through clear account
    plans, building strong relationships with key decision-
    makers and identifying opportunities for further growth
  - Understand customer needs and clearly explain the business
    and technical value of DNV’s solutions, increasing
    adoption of Sesam, Bladed, Nauticus Machinery and other
    relevant solutions across the portfolio.
  - Identify renewal risks and growth opportunities early,
    working closely with Customer Success Commercial, Back
    Office, Product Management and other teams to support
    retention and ARR growth.
  - Maintain accurate account, opportunity, pipeline and
    forecast information in Salesforce, with clear next steps
    and realistic close dates.
  - Bring customer and market insight into the business,
    including competitor intelligence, and contribute actively
    to the China sales team and wider global organisation
    through coordinated customer engagement and participation
    in relevant industry events.

  This role offers the opportunity to combine technology,
  customer engagement and commercial impact in a fast-evolving
  market. You will have significant ownership of your market
  and the opportunity to work with customers on complex
  engineering challenges, supported by technical experts and
  colleagues across DNV’s global organization.

  Success means becoming a trusted commercial partner to our
  customers, developing a strong understanding of their
  business and technical needs, and turning that insight into
  sustainable business opportunities. You will be recognized
  for your commercial ownership, strong customer engagement
  and ability to turn opportunities into results.

  WE REQUEST YOU TO SUBMIT CV IN ENGLISH LANGUAGE WHILE
  APPLYING FOR THE ROLE

  Responsibilities

  - Flexible work arrangements for better work-life balance
  - Generous Paid Leaves (Sick leaves policy/ Annual leaves
    policy)
  - Medical benefits - Annual Health Check-up
  - Pension and Insurance Policies – (Pension Insurance, Medical
    Insurance, Unemployment Insurance, Work related injury
    insurance, Supplementary Pension)
  - Training and Development Assistance (Training Sponsorship,
    On-The-Job Training, Training Programme)
  - Additional Benefits (Long Service Awards, Mobile Phone
    Reimbursement, Housing Fund, Lunch Policy)
  - Profit Share/ Chinese New Year Bonus

  *Benefits may vary based on position, tenure/contract/grade
  level*

  DNV is an Equal Opportunity Employer and gives consideration
  for employment to qualified applicants without regard to
  gender, religion, race, national or ethnic origin, cultural
  background, social group, disability, sexual orientation,
  gender identity, marital status, age or political opinion.
  Diversity is fundamental to our culture and we invite you to
  be part of this diversity.


  Qualifications

  To thrive and succeed in this role, we expect you to bring:

  - Bachelor’s degree in engineering, business or another
    relevant subject.
  - 5-10 years of relevant sales experience within engineering,
    energy, industrial technology, software or another related
    B2B market.
  - A strong track record in developing new business and growing
    customer accounts, with experience managing the full sales
    cycle from opportunity identification and qualification
    through negotiation, closing and ongoing account
    development.
  - Strong consultative selling and communication skills, with
    the ability to articulate customer value clearly and
    present confidently to both small groups and larger
    audiences.
  - Ability to build trusted relationships with senior decision-
    makers, commercial stakeholders, technical specialists and
    end users, combined with strong commercial judgement and
    ownership of results.
  - A proactive, organized and disciplined approach to customer
    follow-up, pipeline and forecasting, with the ability to
    work effectively across teams, functions and cultures.
  - Willingness and ability to travel regularly within China,
    approximately 50% of the time.
  - Fluent Mandarin and English, both spoken and written.

  Preferred

  - Experience in the Chinese renewables, offshore energy and/or
    oil & gas market, ideally with an established network
    among energy operators, EPC contractors, developers,
    engineering companies, equipment manufacturers or other
    relevant customer groups.
  - Experience selling technical or engineering software,
    subscription-based solutions or other recurring-revenue
    services.

  Security and compliance with statutory requirements in the
  countries in which we operate is essential for DNV.
  Background checks will be conducted on all final candidates
  as part of the offer process, in accordance with applicable
  country-specific laws and practices.

  About Us

   About Energy Systems



  We help customers navigate the complex transition to a
  decarbonized and more sustainable energy future. We do this
  by assuring that energy systems work safely and effectively,
  using solutions that are increasingly digital. We also help
  industries and governments to navigate the many complex,
  interrelated transitions taking place globally and
  regionally, in the energy industry.
