description: |
  Overview

  Security represents one of the most critical priorities for
  our customers in a world shaped by digital threats,
  regulatory complexity, and evolving technology. Microsoft
  Security is committed to making the world safer for
  everyone. We aim to redefine security by empowering every
  individual, organization, and developer with a
  comprehensive, simplified security cloud. As part of this
  mission, we’re looking for a Software Engineer II to join
  our team and help build secure, scalable solutions that
  protect diverse environments and users. The Microsoft
  Security organization drives our company’s bold ambitions to
  secure platforms, devices, and clouds—both for our customers
  and within our own operations. Our culture embraces a growth
  mindset, encourages excellence, and supports every team
  member in bringing their best. Together, we create
  innovations that make a global impact.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others, and collaborate to realize our shared goals. Each
  day we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  We’re looking for individuals who are passionate about
  building reliable, high-scale, multi-tenant services. As a
  Software Engineer II you  will have the opportunity to
  leverage your experience in designing resilient components,
  writing clean and maintainable code, handling errors
  thoughtfully, and building with testability and long-term
  sustainability in mind.

  Key responsibilities include:

  - Collaborating closely with multiple teams to coordinate work
    and track progress toward shared goals
  - Participating in an on-call rotation to support service
    reliability
  - Partnering with stakeholders to develop technical solutions
    and automation (e.g., code, scripts)
  - Supporting live services operating in Azure’s air-gapped
    regions
  - Contributing to the buildout of new services as they are
    brought into scope

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 2+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR equivalent experience.

  Other Requirements:

  Security Clearance Requirements: Candidates must be able to
  meet Microsoft, customer and/or government security
  screening requirements are required for this role. These
  requirements include, but are not limited to the following
  specialized security screenings:


  - The successful candidate must have an active U.S. Government
    Top Secret Clearance with access to Sensitive
    Compartmented Information (SCI) based on a Single Scope
    Background Investigation (SSBI) with Polygraph. Ability to
    meet Microsoft, customer and/or government security
    screening requirements are required for this role. Failure
    to maintain or obtain the appropriate U.S. Government
    clearance and/or customer screening requirements may
    result in employment action up to and including
    termination.
  - Clearance Verification: This position requires successful
    verification of the stated security clearance to meet
    federal government customer requirements. You will be
    asked to provide clearance verification information prior
    to an offer of employment.
  - Microsoft Cloud Background Check: This position will be
    required to pass the Microsoft Cloud background check upon
    hire/transfer and every two years thereafter.

  Citizenship & Citizenship Verification: This position
  requires verification of U.S. citizenship due to
  citizenship-based legal restrictions. Specifically, this
  position supports United States federal, state, and/or local
  United States government agency customer and is subject to
  certain citizenship-based restrictions where required or
  permitted by applicable law. To meet this legal requirement,
  citizenship will be verified via a valid passport, or other
  approved documents, or verified US government Clearance

  Additional/Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 2+ years technical engineering experience with
    coding in languages including, but not limited to, C, C++,
    C#, Java, JavaScript, or Python
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 4+ years technical engineering
      experience with coding in languages including, but not
      limited to, C, C++, C#, Java, JavaScript, or Python
    - OR equivalent experience.
  - Cloud service experience (e.g. Azure, AWS, GCP, etc.)
  - Experience with Active Directory

