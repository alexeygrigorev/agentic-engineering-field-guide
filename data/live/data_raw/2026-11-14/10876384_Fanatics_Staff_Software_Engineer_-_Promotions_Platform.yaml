description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About the Team

  Overview

  Every time a fan places a bet, earns a reward, or checks out
  on Fanatics — Fanatics Core made that possible. We build the
  shared foundations — identity, payments, loyalty, wallet,
  data, and platform — that power sports betting, ecommerce,
  collectibles, and beyond. We supercharge the business by
  providing products and capabilities so that teams can focus
  on what matters most: building delightful experiences for
  the fans.

  As a Staff Software Engineer, you'll join the Promotions
  Platform team within FBG. Your duties will encompass the
  design, implementation, testing, and maintenance of software
  that enables customers to engage with FBG's promotional
  systems. Additionally, you will contribute to backend
  features that allow customers to earn rewards, which can be
  used throughout the entire Fanatics ecosystem. We are
  currently focused on developing the next generation of
  promotional tools.

  Responsibilities

  - Lead a team or teams that develops, tests, documents, and
    deploys high quality software into production, leading the
    delivery of solutions that are extensible and scalable
  - Clarify requirements and assists with coding/story estimates
  - Participate in the on-call rotation when needed to
    troubleshoot software issues
  - Quickly identify when to troubleshoot or escalate when tasks
    or projects hit roadblocks, find a path forward in
    difficult situations
  - Mitigate immediate risk, identify and resolve root causes
  - Remove bottlenecks and make technical and design approach
    trade-off decisions short term vs long-term
  - Contribute to team planning and design discussions, building
    more expertise around design approaches, driving best
    practices and improving the speed of delivery
  - Lead code reviews to provide constructive direction
  - Proactively simplifies code and resolves team architecture
    deficiencies
  - Impact software architecture, dependencies, performance, and
    business value
  - Improve testability, operational excellence metrics, and
    team documentation
  - Advise technology leaders, our product team, and other
    internal stakeholders to make technology decisions that
    grow and improve our products
  - Mentor and coach other engineers and actively work to reduce
    onboarding burden of future team members
  - Influence your team's adherence to the principles,
    guidelines, and best practices of our engineering strategy
  - Develop a solid understanding of our industry, product,
    feature set and roadmap
  - Remain current on the latest technologies and trends in
    software development
  - Must be open to occasional travel to Fanatics Betting &
    Gaming offices and other locations for conferences,
    events, meetings, and team-building activities

  Required Qualifications

  - 7+ years of experience building highly scalable and fault
    tolerant systems
  - Proven technical leadership at staff level: you’ve led the
    design and delivery of complex systems across multiple
    teams, set technical direction, and mentored engineers,
    whether as a tech lead or through other formal or informal
    leadership.
  - You understand a broad range of design approaches
  - You are able to triage and debug system-wide production
    issues
  - Demonstrated experience mentoring other engineers
  - Able to effectively communicate complex technical subjects
    to a variety of audiences (engineers, technical leaders,
    marketing and operations teams, non-technical functional
    leaders)
  - Familiar with Agile software product delivery and SCRUM
    methodology
  - Excellent analytical and problem solving skills
  - You have an agile mindset; able to embrace new initiatives
    in a fast-paced environment
  - Thrives in an entrepreneurial, hyper-growth environment
    where priorities evolve regularly and decisions are made
    quickly
  - Team-first mentality, with a willingness to do what it takes
    to get the job done and a desire to strive for better
  - Able to effectively work cross-functionally within an
    enterprise environment

  Preferred Qualifications

  - Experience working in a start-up environment
  - 1+ years of experience leading a development team
  - Experience with Java/Spring Boot
  - Experience with React
  - Experience with Apache Kafka
  - Experience with AWS
  - Experience with PostgreSQL

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connection and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

  For information about our benefits, please visit
  https://benefitsatfanatics.com/

  By submitting your application, you agree to our terms of
  service and acknowledge you have read our Candidate Privacy
  Policy.

  Fanatics will never ask candidates for money, banking
  information, or other sensitive personal information as part
  of the interview process. If you receive a suspicious
  message claiming to be from Fanatics recruiting, please do
  not respond and report it here.
