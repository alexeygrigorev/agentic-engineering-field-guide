description: |
  Company Description

  We are a Digital Product Engineering company that is scaling
  in a big way! We build products, services, and experiences
  that inspire, excite, and delight. We work at scale — across
  all devices and digital mediums, and our people exist
  everywhere in the world (18000+ experts across 29 countries,
  to be exact). Our work culture is dynamic and non-
  hierarchical. We are looking for great new colleagues. That
  is where you come in!

  Job Description

  Job Description

  As a .NET/C# Full Stack Developer, you will design and
  deliver scalable web applications that support our
  technology and operations teams. You will own features end
  to end, from database design and backend services to
  responsive React front ends, and contribute to code quality
  and cloud practices on Microsoft Azure.

  Key Responsibilities

  - Design and develop enterprise-grade full stack applications
    using .NET/C# and React
  - Build secure, high-performance RESTful APIs and integrate
    applications with internal and third-party systems
  - Develop responsive, accessible user interfaces using React,
    HTML, CSS, and JavaScript
  - Design and optimize MS SQL Server databases, including
    complex queries, stored procedures, indexing, and
    performance tuning
  - Deploy, scale, and monitor applications using Azure services
    (e.g., App Service, Azure Functions, Azure SQL, Key Vault,
    Application Insights)
  - Follow best practices in coding standards, design patterns,
    testing, and security
  - Participate in code reviews and support other developers on
    the team
  - Collaborate with stakeholders to translate business
    requirements into technical solutions and estimates
  - Troubleshoot production issues and perform root-cause
    analysis
  - Document technical designs, decisions, and deployment
    processes

  Qualifications

  Qualifications

  - Bachelor's degree in Computer Science, Engineering, or a
    related field (or equivalent experience)
  - 5+ years of professional experience in full stack
    development with C# and .NET / .NET Core
  - Strong expertise in ASP.NET Core Web API, dependency
    injection, and asynchronous programming
  - 3+ years of hands-on experience with React and modern
    JavaScript (ES6+)
  - Advanced knowledge of HTML5, CSS3, and responsive design
    principles
  - Proven experience designing and optimizing MS SQL Server
    databases (T-SQL, schema design, query tuning)
  - Strong hands-on experience with Entity Framework / Entity
    Framework Core, including code-first migrations, LINQ, and
    query performance optimization
  - Solid experience building and deploying applications on
    Azure
  - Strong understanding of design patterns, SOLID principles,
    and clean code practices
  - Proficiency with Git and branching strategies
  - Excellent problem-solving and communication skills
  - Ability to work independently and in a collaborative, fast-
    paced environment

  Preferred Skills

  - Hands-on experience with CI/CD pipelines (e.g., Azure
    DevOps)
  - Experience with authentication and authorization using Azure
    AD / Microsoft Entra ID, OAuth 2.0, and OpenID Connect
  - Knowledge of TypeScript and state management libraries
    (e.g., Redux, React Query)
  - Familiarity with microservices, containerization (Docker),
    or Azure Kubernetes Service
  - Experience with unit and integration testing frameworks
    (e.g., xUnit, NUnit, Jest)
  - Exposure to Agile/Scrum delivery practices

  Additional Information

  Salary Range: $120K - $135K Gross (base+bonuses) + standard
  Nagarro Benefits

