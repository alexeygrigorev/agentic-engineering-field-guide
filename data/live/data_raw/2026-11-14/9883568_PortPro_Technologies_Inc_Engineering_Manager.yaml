description: |
  At PortPro, we are revolutionizing the drayage industry with
  our premier web-based operating system. As a fast-growing
  company, we are building out the most comprehensive
  technology platform to optimize supply chains and make them
  more efficient. By joining our team at the ground level, you
  will have the opportunity to be a part of our company's
  growth and expansion as a global organization, while also
  making a significant impact on the world. Supply chains are
  a crucial part of the global economy, and by working to
  improve them, we are not only solving problems for our own
  benefit, but for the benefit of society as a whole.

  PortPro is seeking an experienced Engineering Manager to
  lead our development team in building and maintaining our
  SaaS products. As the Engineering Manager, you will be
  responsible for overseeing the development process from
  planning to deployment, ensuring that the team is meeting
  deadlines and producing high-quality code, including working
  with offshore teams. The ideal candidate must be willing to
  get hands-on and be a technical leader for one of our
  multiple SaaS products.

  What You'll Do

  - Lead and manage a team of software engineers, including
    offshore teams, to deliver high-quality, scalable, and
    maintainable code for multiple SaaS products
  - Collaborate with product and design teams to define, scope,
    and deliver new features and enhancements
  - Ensure that development processes are efficient and
    effective, and that best practices are followed
  - Identify, prioritize, and resolve technical issues and
    roadblocks
  - Mentor and coach team members to improve their skills and
    advance their careers
  - Keep abreast of new technologies and industry trends, and
    identify opportunities to incorporate them into the
    products
  - Experience working with offshore teams, managing remote
    teams and ensuring effective communication and
    collaboration
  - Willingness to get hands-on and be a technical leader for
    our multiple SaaS products.
  - At PortPro, protecting our customers’ data and maintaining
    compliance are core to everything we do. Every team member
    plays a role in safeguarding information. You’ll be
    expected to follow our information security policies and
    practices and to keep security top of mind in all aspects
    of your work.

  Who You Are

  - 5+ years of experience in software development, with at
    least 2 years in a management or lead role
  - Strong experience with Node.js, React, Express, and MongoDB
  - Experience leading and managing engineers, including
    offshore teams
  - Strong understanding of software development best practices,
    including Agile methodologies
  - Excellent communication and leadership skills
  - Bachelor's degree in Computer Science or a related field

  Our team is like family. Working at PortPro, we want you to
  feel like you are part of the bigger picture, not just
  working for yourself. We work in a no-drama, no-ego
  environment We work together and collaboratively to achieve
  the same goal. We are a team of smart, kind, hard working
  people. You’ll be surrounded by those that inspire you to
  bring your best self to work each day.

  We're an equal opportunity employer. All applicants will be
  considered for employment without attention to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, veteran or disability status.
