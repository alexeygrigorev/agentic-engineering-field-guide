description: |
  Join ShopMy - Powering the Future of Digital Marketing

  ShopMy is transforming e-commerce by building the
  infrastructure for human-led curation at scale. We help
  brands run performance-driven creator programs while
  enabling top creators to monetize their influence and
  partner directly with the brands they love—driving discovery
  through trusted tastemakers and authentic recommendations.
  ShopMy recently became a unicorn, raising at a $1.5B
  valuation with backing from Bessemer Venture Partners,
  Avenir Growth Capital, and Bain Capital Ventures. At ShopMy,
  you're building the future of human-led commerce for the
  world's best brands, tastemakers, and shoppers. You move
  fast and see immediate impact in your work, alongside
  accomplished teammates who are driven by helping find the
  world's best things. If you’re excited to help shape the
  future of curated commerce at the intersection of
  technology, culture, and taste, we’d love to meet you.

  About the Role:

  We’re looking for a talented and experienced Senior Full
  Stack Engineer to join our growing engineering team. In this
  role, you’ll collaborate closely with fellow engineers to
  build and scale a variety of full stack initiatives—from API
  design and UI development to data pipeline optimization and
  internal tooling.

  Your Impact to the Role:

  - Design and implement APIs using Node.js
  - Build and maintain user interfaces with React and Redux
  - Ensure platform performance, scalability, and long-term
    maintainability
  - Develop and optimize data pipelines and internal tools
  - Deploy production-ready applications on AWS using
    containerization, ALB, and ECS
  - Monitor system performance and proactively implement
    improvements
  - Maintain high standards for code quality, structure, and
    best practices

  You Are Energized By:

  - Having a significant impact on our innovative platform and
    shape the future of influencer and affiliate marketing
  - Collaborating with the CTO to develop and implement full
    stack projects
  - Solving complex technical challenges with clean, efficient,
    and scalable code

  - Making a meaningful impact on an innovative platform shaping
    the future of influencer and affiliate marketing
  - Collaborating closely with technical leadership to bring
    full stack projects to life
  - Solving complex problems with clean, efficient, and scalable
    solutions

  What We're Looking For:

  - Strong proficiency in React, NodeJS and Relational Databases
  - Deep understanding of JavaScript language nuances and best
    practices
  - Intermediate knowledge of UI design, including SCSS and
    animations
  - Experience deploying production-ready projects on AWS,
    including containerization, ALB, and ECS
  - Familiarity with logging and alerting using CloudWatch or
    alternative monitoring technologies
  - Keen attention to detail in code structure and style
  - Bachelor's Degree in Computer Science or Engineering
  - 5+ years of experience with JavaScript-based front-end
    languages
  - 3+ years of experience with React and Redux
  - 3+ years of experience developing APIs in NodeJS

  Bonus Points:

  - Experience working in high-growth startups or fast-paced
    product environments
  - Enjoy mentoring and helping shape engineering best practices
    and team culture

  We are hiring at multiple levels therefore the compensation
  for this role will fall be between $145,000-$225,000
  annually.

  In compliance with New York Pay Transparency Law, the salary
  range for this position is as shown. We note that salary
  information as a general guideline only, actual compensation
  may vary from posting based on the offer for this role,
  including the scope and responsibilities of the position,
  relevant work experience, key skills, education, training
  and business considerations.

  New York Pay Range

  $145,000—$225,000 USD

  The provided salary range is base salary, exclusive of bonus
  potential or commission, and is a good faith estimate of
  cash compensation. ShopMy is flexible pending candidate's
  experience and how our business needs evolve throughout the
  search. Every employee of ShopMy receives equity on top of
  cash compensation!

  Benefits & Perks

  ShopMy invests in more than compensation. We support your
  health, your growth, and your life outside of work.

  - Equity in ShopMy - Every employee is an owner; all roles
    receive equity
  - Monetize Your Influence - Every employee builds and grows
    their own ShopMy page
  - 401(k) with Company Match - 3% employer contribution, fully
    vested
  - Healthcare Coverage - Medical, dental & vision benefits,
    including a 100% employer-paid medical option and
    dependent coverage
  - Mental Health Support and More - We offer employees and
    their dependents virtual mental health support, urgent
    care, and primary care visits at no cost
  - Flexible PTO - Take the time you need, including your
    birthday off
  - 13 Company Holidays
  - 14 Weeks of Paid Parental Leave
  - Remote-First Culture with an NYC HQ - Some teams may have
    different location requirements
  - Workplace & Wellness Stipends - Support for wellness, home
    office needs, and a Wellhub membership
  - Disability & Life Insurance - 100% employer-paid
  - Health Care FSA/HSA
  - Annual Company Offsite
  - Quarterly Team Co-Locations

  ShopMy participates in E-Verify and will provide the federal
  government with your Form I-9 information to confirm work
  authorization upon hire.
