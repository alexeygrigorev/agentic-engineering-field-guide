description: |
  Description

  Keeper Security is hiring a Software Development Engineer in
  Test (SDET) to join our Keeper Secrets Manager (KSM) team.
  This is a 100% remote position, with an opportunity to work
  a hybrid schedule for candidates based in the El Dorado
  Hills, CA metro area. Keeper’s cybersecurity software is
  trusted by millions of people and thousands of
  organizations, globally. Keeper is published in 23 languages
  and is sold in over 150 countries. Join one of the fastest-
  growing cybersecurity companies and help ensure the quality,
  reliability, and security of Keeper’s secrets management
  platform.

  About Keeper

  Keeper Security is one of the fastest-growing cybersecurity
  software companies that protects thousands of organizations
  and millions of people in over 150 countries. Keeper is a
  pioneer of zero-knowledge and zero-trust security built for
  any IT environment. Its core offering, KeeperPAM®, is an AI-
  enabled, cloud-native platform that protects all users,
  devices and infrastructure from cyber attacks. Recognized
  for its innovation in the Gartner Magic Quadrant for
  Privileged Access Management (PAM), Keeper secures passwords
  and passkeys, infrastructure secrets, remote connections and
  endpoints with role-based enforcement policies, least
  privilege and just-in-time access. Learn why Keeper is
  trusted by leading organizations to defend against modern
  adversaries at KeeperSecurity.com.

  About the Job

  As a SDET on the KSM team, you will design, build, and scale
  automated test systems that validate the APIs, SDKs, and
  integrations powering Keeper Secrets Manager. You will focus
  on automation framework design, CI/CD integration, and
  system-level validation for secure, cloud-native services,
  rather than manual test execution. You will work closely
  with software engineers and DevOps teams, influence
  automation strategy, and help raise the bar for quality
  engineering across the KSM platform.

  Responsibilities

  - Design, develop, and maintain automation frameworks using
    tools such as Playwright and Pytest
  - Develop reusable automation libraries and custom tooling for
    API, integration, and end-to-end testing
  - Build automated tests for KSM APIs, SDKs, and cloud-hosted
    services
  - Integrate automated test execution into CI/CD pipelines
    (GitHub Actions or similar)
  - Manage containerized test environments using Docker and
    Kubernetes
  - Validate secure authentication and access workflows (SSO,
    OAuth, SAML)
  - Analyze automation failures and drive long-term stability
    improvements
  - Partner with engineering and DevOps teams to embed
    testability into system design
  - Use AI-assisted tools such as Claude, ChatGPT, GitHub
    Copilot or similar platforms to improve test development,
    debugging, root-cause analysis, documentation and workflow
    efficiency

  Requirements

  - 3+ years of experience in test automation or software
    development in test
  - Strong programming skills in one or more languages such as
    Python or JavaScript/TypeScript
  - Proven experience owning the design and evolution of
    automation frameworks or test systems
  - Hands-on experience with automation frameworks such as
    Playwright or Pytest
  - Experience testing APIs, SDKs, and backend services in cloud
    environments (AWS preferred)
  - Strong experience integrating automation into CI/CD
    pipelines
  - Familiarity with Docker and Kubernetes
  - Understanding of secure authentication concepts (SSO, OAuth,
    SAML)
  - Strong debugging, analytical, and cross-team collaboration
    skills
  - Due to this role’s involvement in FedRAMP-compliant
    environments, candidates must be a U.S. Person.

  Preferred Qualifications

  - Experience testing secrets management, security, or DevOps
    platforms
  - Familiarity with RESTful or GraphQL APIs
  - Exposure to performance or load testing
  - Bachelor’s degree in Computer Science, Engineering, or
    equivalent practical experience

  Benefits

  - Medical, Dental & Vision (inclusive of domestic partnerships
  - Employer Paid Life Insurance & Employee/Spouse/Child
    Supplemental life
  - Voluntary Short/Long Term Disability Insurance
  - 401K (Roth/Traditional)
  - A generous PTO plan that celebrates your commitment and
    seniority (including paid Bereavement/Jury Duty, etc)

  Keeper Security, Inc. is an equal opportunity employer and
  participant in the U.S. Federal E-Verify program. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees.

  Classification: Exempt

  Keeper Candidate Privacy Notice

  This notice explains how Keeper Security processes your
  personal data during recruitment. Depending on the role and
  location, the Controller of personal data (the organization
  responsible for determining why and how personal data is
  processed) will be Keeper Security Inc. (US), Keeper
  Security EMEA Ltd. (Ireland), or Keeper Security APAC K.K
  (Japan).

   1. Data We Collect

  Information You provide:

  - Contact details, CV/resume, cover letter
  - Employment history, qualifications, work eligibility
  - Application responses and uploaded documents

  Information We generate:

  - Interview notes, assessments, communications
  - Scheduling information

  Information From Others:

  - Recruiter/referral information who submit your profile
  - References (with your consent, before final offer)
  - Public professional profiles
  - Background verification (post offer)

   Voluntary Diversity and Equal Opportunity Information

  - We may ask you to voluntarily provide diversity information
    including race/ethnicity, gender, disability status and
    veteran status (US). Providing this information is
    optional and Keeper collects this data in order to comply
    with EEOC and similar requirements

   2. How We Use Your Data

  - Assess your application and suitability
  - Manage interviews and recruitment workflow
  - Consider you for other/future roles (we may seek your
    consent to keep your information on our systems beyond the
    retention period specified)
  - Comply with employment law obligations

   3. Legal Basis

  - Legitimate Interests (recruitment management, security and
    integrity of the hiring process)
  - Contracting steps (for progressed candidates)
  - Legal and regulatory compliance obligations; explicit
    consent where required

   4. Who We Share Information With

  Internal:

  - HR, hiring managers, interviewers*, IT support for system
    administration

  *Note - diversity and equal opportunity data is not shared
  with hiring managers.

  Third Parties:

  Service providers who assist with:

  - Applicant tracking, recruitment systems and assessment
    providers
  - Background verification vendors (post offer)
  - Recruitment agencies (where applicable)
  - Tools to support communication, collaboration and to
    securely store your data

  Keeper ensures that all our third parties are contractually
  bound to protect your personal data with adequate safeguards
  in place.

   5. International Transfers

  Your data may be accessed by Keeper entities globally as
  needed for the purposes of hiring and decision making. We
  protect any such data transfer between Keeper entities using
  appropriate safeguards under applicable data protection
  laws.

  6. Security

  We implement appropriate technical and organizational
  measures to protect your data, consistent with our industry
  leading security standards.

  7. Retention

  We keep your data for 24 months from your last application
  activity, then delete or anonymize it.

  Exceptions:

  - You opt into our talent database for further retention by
    providing consent (extended retention)
  - You're hired (transfers to employee records)

   8. Your Rights

  You have the following rights and can contact us at the
  email below to exercise them:

  - Access, correct, or delete your data, subject to applicable
    law and retention requirements
  - Object to or restrict processing
  - Withdraw consent (where applicable)
  - Request data portability
  - Lodge a complaint with your data protection authority

  If you become an employee, your rights regarding your
  employee record are governed by our internal Employee
  Privacy Notice and certain data will be retained as required
  under relevant laws such as employment or tax law.

  When you request access to your personal data, some
  information may be redacted if it includes the personal data
  of other individuals or information that we must protect in
  order to preserve their privacy rights.

   9. Automated Decisions

  Keeper does not make hiring decisions using solely automated
  processing.

  10. Contact - Candidates can send privacy questions to:
  privacy@keepersecurity.com
