description: |
  Company Description

  Wise is a global technology company, building the best way
  to move and manage the world’s money. Min fees. Max ease.
  Full speed.

  Whether people and businesses are sending money to another
  country, spending abroad, or making and receiving
  international payments, Wise is on a mission to make their
  lives easier and save them money.

  As part of our team, you will be helping us create an
  entirely new network for the world's money. For everyone,
  everywhere.

  More about our mission and what we offer.

  Job Description

  What will you be working on?

  We're looking for engineers who are passionate about
  designing scalable platforms and love solving real-world
  problems with technology. If you're excited by the idea of
  building infrastructure that empowers teams and accelerates
  product development without compromising on trust or safety,
  this role is for you.

  🌍 The Role: Senior Engineering in the Risk Domain

  As part of our Platform Engineering team, you’ll be at the
  intersection of Product and Risk – crafting systems that
  allow internal teams to ship faster, safer, and smarter. You
  won’t just be writing code. You’ll be building foundational
  services that other teams rely on to launch features across
  global markets.

  We're designing a centralised risk platform – a system that
  unifies data and decision-making across identity
  verification, fraud detection, compliance, and more. This
  platform acts as the connective tissue between teams working
  on money movement, regional expansion, and customer safety.

  Our team builds a unified platform for controlling
  customers’ product eligibility in accordance with regional
  compliance, risk and product functions.



  As a Senior Software Engineer, you will:

  - Take ownership of critical multiplier-type projects that
    significantly enhance our codebase management and
    automation capabilities.
  - Collaborate closely with platform and product teams,
    engineers, leads, and product managers to deliver
    impactful tooling solutions.
  - Prototype solutions quickly and efficiently, adopting a
    "quick and dirty" approach initially, and refine them into
    robust, scalable tools once the optimal approach is
    identified.
  - Work alongside other engineers in the team, fostering a
    collaborative culture..
  - Provide feedback on technical design decisions and approach,
    and help the team make data-driven decisions.

  Qualifications

  What do you need?

  We are fully aware that it is uncommon for a candidate to
  have all skills required and we fully support everyone in
  learning new skills with us. So if you have some of those
  listed below and are eager to learn more we do want to hear
  from you!

  - Strong proficiency in backend programming languages like
    Java, Python or Go.
  - Passion for building at scale – You've worked on high-
    throughput systems and know what it takes to keep services
    fast and reliable
  - Deep interest in system design – You think in terms of
    platforms, not just features
  - A desire to build meaningful infrastructure – You care about
    enabling others, not just shipping your own code
  - Excellent verbal and written communication skills, with the
    ability to convey technical concepts to both technical and
    non-technical audiences.

  Nice to Have:

  - Experience working in fintech or high-trust domains like
    risk, identity, or compliance
  - Experience in messaging systems such as Kafka is a plus.

  Additional Information

  For everyone, everywhere. We're people building money
  without borders  — without judgement or prejudice, too. We
  believe teams are strongest when they are diverse, equitable
  and inclusive.

  We're proud to have a truly international team, and we
  celebrate our differences. Inclusive teams help us live our
  values and make sure every Wiser feels respected, empowered
  to contribute towards our mission and able to progress in
  their careers.

  If you want to find out more about what it's like to work at
  Wise visit Wise.Jobs.

  Keep up to date with life at Wise by following us on
  LinkedIn and Instagram.
