description: |
  Ellipsis Labs is a profitable, venture-backed New York
  startup building performant DeFi protocols on high-
  throughput decentralized infrastructure. Our long-term
  mission is to build a more efficient, transparent, and fair
  financial system.

  Our flagship product, Phoenix Perpetuals, brings
  professional-grade perpetual futures to Solana. Phoenix has
  processed over $4 billion in trading volume and is growing
  20% month over month, adding to the more than $300 billion
  our products have facilitated to date. Behind Phoenix is a
  lean, high-caliber team with experience at top trading
  firms, blockchain companies, and tech companies.

  The Opportunity

  Ellipsis Labs is seeking a Senior Software Engineer to join
  our team. In this role, you will:

  - Contribute to critical software systems at all parts of the
    stack
  - Design, develop, and deploy programs on the Solana
    blockchain
  - Maintain a high bar of security, correctness, and
    thoughtfulness around the code
  - Write high-quality, maintainable, well-tested code with
    thorough documentation

  Qualifications Required

  - Experience building software systems (preferably in Rust,
    C++, C, or Golang), with high-quality and well-documented
    production code
  - A demonstrated track record of high agency, willingness to
    dive into unfamiliar technical and non-technical areas,
    and a team-first attitude
  - Passion for decentralized finance

  Preferred

  - Bachelor’s degree in Computer Science or related technical
    field or equivalent practical experience
  - Experience working with blockchain technology, preferably
    Solana
  - Experience working with Rust
