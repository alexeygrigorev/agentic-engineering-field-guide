description: |
  Core skills: computer engineering, problem-solving,
  teamwork, time management, critical thinking, adaptability,
  initiative  STARTING TIME: June 28th DURATION: 10 weeks

  Bitmovin is a global Series-C SaaS scale-up that provides
  award-winning video streaming technology to world-renowned
  brands including Discovery+, BBC, Red Bull Media House,
  Hulu, fuboTV, and The New York Times, to name just a few.

  Our solution suite consists of a Video Encoder, Player, and
  Analytics platform, enabling content owners to redefine the
  viewer experience through API-based workflow optimisation,
  fast turnaround, and scalability. Innovations include the
  first commercial HTML5 MPEG-DASH.

  “We are constantly seeking out forward-thinking individuals
  who want to shape the future of video… come and work with
  us!”

  Stefan Lederer, CEO

  At Bitmovin, we value cognitive diversity and the huge part
  this plays in not only creating a global culture second to
  none, but in how this underpins our ability to create truly
  representative, Emmy Award-winning products. Diversity in
  all its forms is encouraged and celebrated at Bitmovin;
  everyone has a role to play in helping us shape the future
  of video.

  Why us?

  Bitmovin wants to give top "computer science" and "software
  engineering" students from universities and technical
  schools like HTL valuable work experience and also support
  them in writing their diploma thesis during a paid
  internship.

  We are welcoming students from all backgrounds; however, it
  would be beneficial to have a passion for software
  engineering and knowledge of software development
  fundamentals.

  Your Impact

  Come and work on a range of cool projects, using state-of-
  the-art technology, that help shape products used by
  millions of customers worldwide and trusted by industry-
  leading players like DAZN and F1. You could get involved in:

  - Utilizing AI in Video Streaming
  - Analyzing Docker images for optimal size
  - Creating a player debugging user interface
  - Building a software-programmable Smart TV remote
  - Testing new CPU architectures… and much more!

  How to Apply:

  Via our careers page, submit your CV and your transcript of
  records (current overview of your university grades).

  Optional: Want to stand out? Add a short video (2–3 minutes)
  telling us:

  - Your goals for this internship.
  - A time you hacked a system (non-computer) to your advantage.
  - The AI or video project you’d love to work on and why.

  No video? No problem. Your application will be considered
  just the same. If you do record one, be real and show your
  passion!

  Application deadline: 31 December 2026. We review
  applications on a rolling basis, so we encourage you to
  apply early.

  We recommend a minimum of two months to ensure a truly
  rewarding learning experience.

  We look forward to hearing from you!

  Ready to make an impact? Apply now via our careers page!

  Life at Bitmovin

  Find out more about us on our Careers Page See what fellow
  Bitmovers are saying on LinkedIn Check the employee reviews
  on Glassdoor
