title: Engineering Manager - Millennium Hilton New York One UN Plaza
company: Hilton
location: New York, USA
work_type: FULL_TIME
company_size: 500,000 Employees
description: |
  Exceptional Hospitality Starts with You



  Picture yourself brightening someone’s day. When you join
  our Hotels team, that’s exactly what you’ll do every time
  you come to work! As an Engineering Manager, you’re not just
  overseeing physical building and systems maintenance and
  repairs – you’re spreading the light and warmth of
  hospitality by delivering memorable experiences that make
  the stay for every guest.

  Responsibilities

  Here's what you'll do during a typical day:

  - Ensure facility safety and compliance: Oversee maintenance
    of the hotel’s buildings, mechanical systems, electrical
    systems, HVAC, and life safety systems, ensuring
    compliance with local, state, and federal regulations
  - Manage maintenance operations: Ensure effective execution of
    maintenance activities by providing leadership, setting
    priorities, and verifying task completion through the
    property management system
  - Oversee contractor engagement: Manage and coordinate
    external contractors, liaise with city officials, and
    inspect work quality
  - Manage service requests: Ensure that maintenance requests,
    guest concerns, and emergency situations are handled in a
    timely manner
  - Lead and develop a high-performing team: Recruit, train,
    supervise, schedule, and evaluate engineering/maintenance
    team members to ensure high-quality work and performance

  Qualifications

  What It Takes to Make the Stay



  At Hilton, our core values define what it takes to succeed
  here and guide the qualities we look for in every team
  member:



  A passion for spreading the light and warmth of Hospitality.
  Acting with Integrity and always doing the right thing.
  Inspiring others through Leadership. A belief that Teamwork
  drives the best outcomes. A sense of Ownership and
  accountability. And a focus on the Now, bringing urgency and
  discipline to every moment, knowing it can make a lasting
  impact.

  About Us



   Join an Award-Winning Workplace Culture




    At Hilton, we don’t just deliver exceptional experiences
  for our guests—we build an exceptional workplace for the
  Team Members who make it all possible. As a global leader in
  hospitality, we’ve welcomed more than 3 billion guests
  worldwide, all while staying true to our founding vision: to
  fill the earth with the light and warmth of hospitality.




    Our award-winning culture has earned us repeated
  recognition on the World’s Best Workplaces list by Great
  Place to Work and Fortune. With our suite of world-class
  brands, and a company-wide commitment to providing the best
  stay for every guest, we’re setting new standards for the
  future of travel.




    Whether you’re starting your career or exploring something
  new, Hilton supports your journey every step of the way.
  Come for the job, stay for the career—and help us make every
  stay a little more magical.


   Curious about life at Hilton? Explore our Careers Blog to
  see why we’re more than a great place to stay—we’re a great
  place to work.
