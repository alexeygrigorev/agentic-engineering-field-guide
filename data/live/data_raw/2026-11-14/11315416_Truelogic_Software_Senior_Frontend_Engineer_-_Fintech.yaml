description: |
  About Truelogic

  At Truelogic we are a leading provider of nearshore staff
  augmentation services headquartered in New York. For over
  two decades, we’ve been delivering top-tier technology
  solutions to companies of all sizes, from innovative
  startups to industry leaders, helping them achieve their
  digital transformation goals.

  Our team of 600+ highly skilled tech professionals, based in
  Latin America, drives digital disruption by partnering with
  U.S. companies on their most impactful projects. Whether
  collaborating with Fortune 500 giants or scaling startups,
  we deliver results that make a difference.

  By applying for this position, you’re taking the first step
  in joining a dynamic team that values your expertise and
  aspirations. We aim to align your skills with opportunities
  that foster exceptional career growth and success while
  contributing to transformative projects that shape the
  future.

  Our Client

  A fast-growing fintech company building a technology-enabled
  private banking and lending platform for independent wealth
  advisors. They connect financial data with sophisticated
  banking and credit solutions, enabling advisors to deliver
  tailored liquidity strategies to their high-net-worth
  clients.

  Job Summary

  The engineering team is scaling its core platform to
  transform complex, data-heavy financial workflows into
  intuitive, high-performance web applications. The goal is to
  build robust frontend architectures, establish standardized
  design systems, and create seamless interfaces that allow
  advisors and clients to manage sensitive financial assets
  effortlessly.

  Responsibilities

  - Build and evolve modern, scalable web applications using
    React and TypeScript.
  - Develop, maintain, and expand reusable component libraries
    and design system patterns.
  - Translate complex financial datasets and workflows into
    clear, reliable user experiences.
  - Partner directly with Product and Design teams to turn
    business requirements into scalable product features.
  - Integrate frontend applications seamlessly with backend APIs
    and microservices.
  - Elevate engineering standards by optimizing frontend
    performance, code maintainability, and automated testing.
  - Drive technical direction and architecture decisions across
    the platform.

  Qualifications and Job Requirements

  - Location & Authorization: Physically located in or near New
    York City (NYC) with valid, existing U.S. work
    authorization.
  - Professional Experience: 5+ years of hands-on software
    engineering experience specializing in frontend
    development.
  - Core Tech Stack: Advanced proficiency with React, modern
    JavaScript (ES6+), and TypeScript.
  - Architecture & UI Systems: Deep experience in component-
    based architecture and building/maintaining reusable UI
    libraries or Design Systems.
  - API Integration: Proven track record of integrating client
    applications with complex, API-driven backends and
    handling complex data structures.
  - Quality & Testing: Strong testing practices (unit,
    integration, end-to-end) and commitment to code quality.
  - Product Mindset: Strong product intuition with the ability
    to navigate partially defined requirements in
    collaboration with Product and Design.
  - Communication: Exceptional verbal and written English
    communication skills.

  What We Offer

  - 100% Remote Work: Enjoy the freedom to work from the
    location that helps you thrive. All it takes is a laptop
    and a reliable internet connection.
  - Highly Competitive USD Pay: Earn an excellent, market-
    leading compensation in USD, that goes beyond typical
    market offerings.
  - Paid Time Off: We value your well-being. Our paid time off
    policies ensure you have the chance to unwind and recharge
    when needed.
  - Work with Autonomy: Enjoy the freedom to manage your time as
    long as the work gets done. Focus on results, not the
    clock.
  - Work with Top American Companies: Grow your expertise
    working on innovative, high-impact projects with Industry-
    Leading U.S. Companies.

  Why You’ll Like Working Here

  - A Culture That Values You: We prioritize well-being and
    work-life balance, offering engagement activities and
    fostering dynamic teams to ensure you thrive both
    personally and professionally.
  - Diverse, Global Network: Connect with over 600 professionals
    in 25+ countries, expand your network, and collaborate
    with a multicultural team from Latin America.
  - Team Up with Skilled Professionals: Join forces with senior
    talent. All of our team members are seasoned experts,
    ensuring you're working with the best in your field.

  Apply now!
