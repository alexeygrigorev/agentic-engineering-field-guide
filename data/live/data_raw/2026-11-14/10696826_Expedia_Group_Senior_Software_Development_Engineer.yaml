description: |
  At Expedia Group, we help travelers explore the world, one
  journey at a time. As a global travel company powered by
  passionate people, trusted partnerships, and leading
  technology, we connect travelers, partners, and advertisers
  through our consumer brands, B2B network, and travel
  advertising business.

  Here, you'll do meaningful work that helps millions of
  people discover, book, and experience travel with more ease,
  confidence, and joy. Our five Behaviors-Traveler First,
  Think Big, Operate with Excellence, Ownership Mindset, and
  Succeed Together-help foster a supportive environment where
  people can grow their careers and have the flexibility,
  benefits, and support to do their best work. Join us and
  build for travelers everywhere.

  Team Summary:

  Price is a key factor influencing traveler’s path to driving
  a choice leading to a purchase. In a world of infinite paths
  to purchase, travelers make multiple searches and find the
  ‘best trip’ and ‘best deal’. The Offers Domain team is
  tasked with giving the customer a simple, clear, accurate,
  transparent pricing throughout their shopping and booking
  journeys. We do this by putting the customer first, creating
  capabilities that can be shared and presented to the
  customer that meet the travelers’ expectations in locally
  relevant ways and adhere to regulatory norms. This is a
  great opportunity for you to play a pivotal role in shaping
  our technical domain with the goal of powering all Expedia
  Group’s brands and product lines.



  In this role, you will:

  - Design, build, and evolve robust, scalable, and secure
    backend services and applications, including clear low-
    level and high-level designs, APIs, data models, and
    explicit technical trade-offs that power high-traffic,
    customer-facing pricing and offers experiences across
    Expedia Group brands.
  - Lead end‑to‑end implementation of complex features and
    systems within the Offers Domain, from technical design
    and coding through testing, deployment, monitoring, and
    ongoing operational support, ensuring simple, accurate,
    and transparent pricing throughout the shopping and
    booking journey.
  - Partner closely with product, architecture, and
    cross‑functional engineering teams to translate business
    and regulatory requirements into technical solutions,
    shaping capabilities that support locally relevant
    customer expectations and can be reused across multiple
    brands and platforms.
  - Drive engineering excellence for the services you own by
    championing code quality, automated testing,
    observability, performance optimization, and
    simplification, taking technical responsibility for
    service health, scalability, resilience, and the ongoing
    reduction of technical debt and operational overhead.
  - Provide technical mentorship and guidance to other
    engineers, sharing domain and industry knowledge, guiding
    integrations across teams, and modeling best practices in
    system design, API design, and data modeling.
  - Safely integrate and operate AI/ML‑enabled solutions that
    improve outcomes, demonstrating familiarity with AI‑driven
    systems, tools, or workflows and applying AI/ML concepts
    to real world products while adhering to established
    patterns and guidelines.

  Minimum Qualifications:

  - Bachelor’s degree in Computer Science or a related technical
    field; or equivalent related professional experience.
  - 8+ years of relevant professional software development
    experience with a strong focus on backend development,
    using Java or Kotlin, building and operating
    high‑performance, high‑throughput, highly available, and
    scalable services on cloud platforms.
  - Proven experience owning one or more production services or
    components throughout their lifecycle, including system
    design (with low‑level design), API design, data modeling,
    implementation, deployment, monitoring, and ongoing
    operational responsibility.
  - Demonstrated ability to understand complex distributed
    systems, design moderately complex solutions, and make
    well‑reasoned technology choices that are easily testable
    and observable, with clear alignment to business outcomes
    and team goals.
  - Strong knowledge of integration patterns, testing and
    monitoring tools, and operational excellence practices
    (such as unit testing, SLAs, resiliency and scalability
    patterns, and alerting), with experience formally
    mentoring at least three engineers.

  Preferred Qualifications:

  - Experience designing and evolving distributed or
    multi‑service architectures for pricing, offers, or
    similarly high‑scale transactional domains, with a focus
    on reliability, fault tolerance, and performance
    optimizations driven by production metrics.
  - Demonstrated technical leadership in defining architectural
    direction for complex features or systems, influencing
    design patterns and frameworks, guiding cross‑team
    integrations, and communicating trade‑offs to both
    technical and non‑technical stakeholders.
  - Track record of improving operational excellence at the team
    level through enhanced observability, automation,
    performance tuning, and data‑driven analysis of incidents
    and customer impact.
  - Hands‑on experience integrating or consuming AI/ML‑enabled
    services or platforms in production, including designing
    safe interaction patterns, monitoring their impact on
    pricing or customer experience, and tuning models or
    policies to achieve better business outcomes.
  - Familiarity with applying AI‑assisted development or testing
    tools in everyday engineering workflows to enhance
    developer productivity, code quality, and time to market,
    particularly for backend services and platform
    capabilities in complex domains.In this role, you will:
  - Design, build, and evolve robust, scalable, and secure
