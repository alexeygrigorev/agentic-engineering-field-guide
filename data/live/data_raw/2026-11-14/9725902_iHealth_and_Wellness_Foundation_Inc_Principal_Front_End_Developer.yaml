  To protect yourself:

  - Ensure all emails are sent from domain name
    @ihealthwellness.org.

  - Verify the authenticity of emails and job postings.

  - Remember, we will never request payment, banking
    information, or sensitive personal details as part of the
    application process.

  If you come across suspicious communications or have
  concerns, please contact us immediately at .

  Thank you for helping us maintain a safe and trustworthy
  recruitment process.

