description: |
  Disclaimer and Fraud Alert:
  https://www.ihealthwellness.org/job-openings

  We are an 'early stage' pre-money nonprofit/ tech startup
  preparing for a proof-of-concept launch / seed-raise looking
  to recruit VOLUNTEERS (unpaid) as PRINCIPAL FRONT END
  ENGINEERS.

  Our tech stack includes ReactJS (website) and React Native
  (App) for the front-end, NodeJS for the back-end, and
  MongoDB for database management, with a focus on utilizing
  CSS Modules for styling.

  Future Salary would be promised for employees (after seed
  funding round).

  You’ll be helping to improve the healthcare experience for
  our users by making it simpler and more efficient for
  patients to book an appointment with and visit a doctor.

  Responsibilities:

  - Working with technologies like React/Redux building the
    libraries and frameworks that power our front-end
    development
  - You might build features or native mobile apps that help
    doctor’s visualize their value or develop core patient
    experiences that change the way patients interact with
    healthcare
  - Mentoring your peers, with the notion that helping others
    means learning and growing themselves
  - Successfully mentored other engineers in the past and have
    encouraged your peers to use software development best
    practices for code testing and deployment

  Required Experience:

  - 3+ years of full-time software engineering experience
  - Demonstrated ability to develop full-stack web and mobile
    applications and experience
  - Our tech stack includes ReactJS (website) and React Native
    (App) for the front-end, NodeJS for the back-end, and
    MongoDB for database management, with a focus on utilizing
    CSS Modules for styling.
  - A passion for building platforms and understanding what
    makes a great platform - infrastructure as code,
    automation, libraries, APIs, and standardization
  - Experience architecting and developing scalable distributed
    systems
  - Experience within AWS environments and a high emphasis on
    testing is a plus
  - Proficient with Git source control and effective branching
    and release management practices
  - Proficient creating user interfaces and resolving cross-
    browser and backward compatibility issues
  - Ability to debug, diagnose and resolve complex JavaScript
    bugs throughout the stack
  - Strong critical thinking skills; ability to devise
    innovative solutions
  - Ability to ramp up quickly and own features end-to-end
  - Familiarity with Agile frameworks is a plus
  - Ability to commit to a minimum of 4+ hour work weeks
  - Ability to attend weekly standup meeting (conference call
    with desktop/ laptop access for screen sharing)
  - HealthTech experience is a plus

  NOTE: Your first assignment will involve launching a
  fundraising campaign. iHealth will provide comprehensive
  guidance and resources to help ensure your fundraiser is
  both quick and successful.

  Please note that candidates actively seeking CPT/Internships
  are ineligible for this particular volunteer position.

  Join us, you win, we both win!!

  Disclaimer and Fraud Alert

  At iHealth and Wellness, we are deeply committed to
  transparency and integrity in our recruitment process.
  Please note that all current opportunities within our
  organization are volunteer roles.

  We ensure every volunteer candidate is thoroughly screened
  and personally reviewed by our Founder and CEO to align with
