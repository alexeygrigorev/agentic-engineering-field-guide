description: |
  Overview

  GuideSage, PBC is a venture-funded, pre-seed, stealth,
  agentic AI startup with a mission to responsibly help people
  reach their full potential through learning. We have a
  multi-product strategy to improve the way people learn using
  thoughtfully applied generative AI and ML. This year, we’re
  focused on building our first product, which will target the
  $400B corporate training market and define a new category.

  GuideSage was founded by Adam Berrey, who brings 28 years of
  experience building successful software companies, including
  several IPOs and exits. We're actively building our product
  development team and looking for a founding software
  engineer to lead development and help build the company. Our
  vision is to create a generational company that uses agentic
  AI to help everyone learn more.

  This is an opportunity to come in at the ground floor and
  shape every aspect of the product and business with the
  confidence that the company already has a clear business
  strategy and strong funding.

  Why GuideSage

  - ‍Mission-driven commitment to positively contribute to the
    world by helping people learn
  - Full competitive salary, benefits, and meaningful equity on
    day one
  - Freedom to craft great software and create a brand-new
    product from scratch
  - Flexibility to build a team you love working with
  - Clear business model, product strategy, and prospective
    customers
  - Opportunity to work at the cutting edge of applying GenAI
    and ML to solve real-world business problems in a $400
    billion market with an even larger impact on how people
    learn everywhere

  Key Responsibilities

  - Collaborate with co-founders, business stakeholders, and
    designers to iteratively create the product vision,
    strategy, and roadmap
  - Develop the software and lead the engineering work to create
    a product that users love and customers buy
  - Establish the technical foundation, including the
    architecture, infrastructure, and tech stack
  - Decide on the programming languages, frameworks, and tools
    based on the company’s needs, scalability, and product
    goals
  - Setup the necessary infrastructure to build and deploy the
    software, including cloud services, DevOps, CI/CD, and
    other tools and services
  - Ensure code quality, setting up best practices for the
    development process, and fostering a strong engineering
    culture
  - Hire and manage 1-2 engineers and shape the engineering
    team's culture, including communication norms, pace, and
    stage-appropriate work processes
  - Stay current with the latest developments in AI and bring
    insights to the business and product strategy
  - Help to define and shape the culture of the company

  Ideal Profile

  - Exceptional software engineering and coding skills
  - Proven ability to work in a fast-changing, high-uncertainty
    startup environment
  - Great at making technology stack, build/buy, and
    architecture choices
  - Experience building commercial B2B enterprise SaaS systems
  - Experience working in early-stage startups or teams building
    from zero to one
  - Experience building on LLM APIs and working with ML
  - Capable of building and leading a small engineering team
  - Interested in the mission
