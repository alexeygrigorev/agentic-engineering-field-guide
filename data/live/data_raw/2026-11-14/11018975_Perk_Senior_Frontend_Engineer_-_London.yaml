description: |
  About Us Perk (formerly TravelPerk) is the intelligent
  platform for travel and spend management. Built to tackle
  the time-consuming, manual work that gets in the way of real
  work, our tools automate everything from travel bookings to
  expenses, invoice processing, and more. By eliminating this
  shadow work that wastes hours, erodes morale, and saps
  innovation, we're on a mission to power real work, with real
  impact. We're trusted by more than 12,000 companies
  worldwide, including Bolt, GoCardless, and Fabletics, and
  we're tackling the 7 hours of lost productivity per employee
  each week, a $1.7 trillion problem. Founded in 2015, Perk
  has grown into a global company of more than 1,800 people
  across 12 offices globally, with headquarters in London and
  Boston. We combine innovation, control, and simplicity to
  transform how businesses work and how people feel at work.
  At Perk, we're driven by our values, like being an owner,
  delivering a 7-star experience, and working as one team. We
  value curiosity, purpose, and mindset, not just knowledge,
  to unlock the power in your potential. Our talent team
  brings together leading minds from the travel, fintech, and
  SaaS industries, representing over 70 countries. If you're
  excited about having a real impact and shaping how millions
  of people experience work, we'd love you on the team. Visit
  www.perk.com to learn more.

  What you'll do: You'll own building the experiences of our
  group travel and events product, an all-in-one platform
  helping companies book providers and coordinate their
  attendees. This is a complex, multi-sided offering spanning
  corporate event planners, event support specialists on the
  Perk side, suppliers and event participants. You'll be the
  design lead shaping how those experiences come together in
  the product and within the broader Perk platform (travel,
  spend). At Perk, we believe that real-life connections have
  greater value than ever. While the world has embraced hybrid
  work, the need for teams to gather, brainstorm, and
  celebrate in person has skyrocketed. That’s why we built
  Perk Events. Born from our internal innovation incubator,
  Perk Events is our newest vertical. We are moving from
  "start-up" to "scale-up," and we are looking for a Senior
  Front End Engineer. This isn't just an ordinary Engineering
  role; it’s an opportunity to disrupt a legacy industry with
  AI-driven tech, and lead a world-class team driving towards
  ambitious revenue goals. You'll own building the experiences
  of our group travel and events product, an all-in-one
  platform helping companies book providers and coordinate
  their attendees. This is a complex, multi-sided offering
  spanning corporate event planners, event support specialists
  on the Perk side, suppliers and event participants. You'll
  be the design lead shaping how those experiences come
  together in the product and within the broader Perk platform
  (travel, spend). Some examples of what it means to be a
  Senior at Perk

  - Shape the bigger picture. You won't just build features,
    you'll refine the what to build and why. At Perk, senior
    engineers are expected to go beyond the technical solution
    and focus on the problem itself. You'll contribute to your
    squad's quarterly goals and long-term vision alongside
    your Product Manager and Engineering Manager.
  - Architect for today and tomorrow. When a big change is
    needed in how our platform works, you'll be the one
    writing the design documents that lay the foundation.
    You'll become a guardian of your team's technical quality;
    spotting areas of investment, proactively managing
    technical debt, and making sure we don't let "busy work"
    crowd out the work that truly matters. At Perk, we believe
    in impact over effort: our customers see results, not the
    hours behind them. Your job is to make sure we're always
    investing our energy where it counts most.
  - Lead across boundaries. Your influence won't stop at your
    own squad. You'll communicate complex ideas across
    multiple teams, proactively identify who needs to be
    involved, and drive alignment across the broader
    organisation. Whether it's coordinating a cross-squad
    initiative, contributing to one of our engineering guilds
    (where engineers from different teams align on shared
    technical topics), or pairing with architects on solution
    discovery, you'll operate comfortably beyond your
    immediate team.
  - Raise the bar for everyone around you. Senior engineers at
    Perk are mentors, coaches, and bar raisers. You'll support
    less experienced colleagues through direct mentorship,
    thoughtful feedback during reviews, and by modelling what
    great engineering looks like in practice. You'll help
    Engineering Managers understand where the team needs to
    grow technically, and you'll use spaces like guild
    meetings, design doc reviews, and pairing sessions to lift
    the overall standard. At Perk, we are a team, the team's
    success is your success.

  AI at Perk AI is embedded in how we work across every
  function. The tools you'll use day-to-day are AI-enabled so
  you can move faster and spend more time on the work that
  matters. In practice, that means using AI to research and
  prioritise accounts, draft and refine outreach, handle
  customer interactions more effectively, synthesise
  information, and cut through shadow work - the invisible
  tasks that pull people away from the work only they can do -
  so you can focus on relationships and outcomes.

  How We Work

  At Perk, we take an IRL-first approach to work, where our
  team works together in-person 3 days a week. As such, this
  role requires you to be based within commuting distance of
  our hubs. We fundamentally believe in the value of meeting
  in real life to improve connectivity, productivity,
  creativity and ultimately making us a great place to work.

  For certain roles, we can help with relocation from anywhere
  in the world, English is the official language at the
  office. Please submit your resume in English if you choose
  to apply. Do not forget to submit an updated portfolio
  and/or resume.

  Perk is a global company with a diverse customer base, and
  we want to make sure the people behind our product reflect
  that. We’re an equal opportunity employer, which means
  you’re welcome at Perk regardless of how you look, where
  you’re from, or anything else that makes you, well, you.

  Protect Yourself from Recruitment Scams

  All official communication from Perk will always come from
  email addresses ending in @perk.com or @externalperk.com,
  our verified social media channels, or recruiters listed on
  our official LinkedIn page. We will never ask you to pay for
  equipment, training, or fees, request sensitive personal
  information such as bank details early in the process, or
  communicate through unofficial apps like WhatsApp, Telegram,
  or Signal. If you receive a message claiming to be from Perk
  that seems suspicious, please do not respond. Forward it to
  security [at] perk .com, and we will confirm whether it is
  legitimate. #LI-Hybrid
