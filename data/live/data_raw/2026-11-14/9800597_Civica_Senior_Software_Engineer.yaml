description: |
  Civica builds software that runs essential public services.
  Our systems support local government, the NHS, housing
  associations, and financial institutions - services that
  millions of people depend on every day. When our software
  works well, caseworkers make better decisions, clinicians
  access the right information, and councils deliver services
  that communities rely on.

  We're not a startup chasing the next hype cycle. We're a
  company with deep roots in the public sector, working on
  problems that matter - and we're investing seriously in how
  we build software to make sure we can keep doing that for
  the next decade.

  Why you will love this opportunity as Senior Software
  Engineer at Civica

  We're hiring Senior Software Engineers to work on business-
  critical products across our portfolio. You'll be embedded
  in a product team, working across legacy and greenfield
  environments, translating ambiguous business problems into
  production-grade solutions.

  We care about engineering judgement - the ability to
  decompose hard problems, design systems that last, and ship
  software that works in production. We expect you to use
  modern tooling, including AI-assisted development, as part
  of how you work. But the signal we're hiring on is your
  thinking, not your toolset.

  You'll work on systems with real users, real constraints,
  and real consequences. Some of that work will be modernising
  legacy codebases that have served public services for years.
  Some will be building new capabilities from scratch. All of
  it requires someone who thinks in systems, not just code.

  Responsibilities:

  - Decompose ambiguous problems into clear system designs,
    making architectural decisions that balance immediate
    needs with long-term maintainability

  - Design, build, and ship production-ready software across the
    full lifecycle. From specification through to deployment
    and operability

  - Work across mixed environments - legacy modernisation
    alongside greenfield development, often within the same
    product

  - Own technical decisions for complex system components,
    articulating trade-offs in terms your product manager and
    your principal engineer both understand

  - Define what "good" looks like for your area of the codebase
    - testing strategy, code quality, observability, and
    documentation

  - Collaborate with product, design, and other engineers to
    understand the real problem before building anything

  Requirements

  - A track record of building and shipping complex, real-world
    software systems - not just contributing to large
    codebases, but owning meaningful pieces end-to-end

  - System design and architectural reasoning - you think about
    how components interact, where the failure modes are, and
    what happens at boundaries

  - Problem decomposition under ambiguity - you ask 'why' before
    'how' and can translate a vague business need into a
    structured technical approach

  - Production-quality discipline - you care about testing,
    observability, error handling, and operational readiness,
    not just making things work locally

  - Communication that reaches beyond engineers - you can
    explain a technical trade-off to a product manager, write
    a clear specification, and build consensus on contentious
    decisions

  - Learning agility - you pick up new stacks, tools, and
    domains quickly. You've worked across more than one
    language or framework and you're comfortable in unfamiliar
    territory

  - Ownership and initiative - you identify problems before
    they're assigned to you and follow through until they're
    resolved in production

  Nice to have

  - Experience using AI-assisted development tools (Claude Code,
    Copilot, Cursor, or similar) as part of your daily
    workflow

  - Comfort evaluating and validating AI-generated code to the
    same standard as human-written code

  - Experience in the public sector, health, housing, or local
    government domains

  - Familiarity with .NET, Go, React/TypeScript, or similar
    modern stacks - we're polyglot, so language-specific depth
    matters less than the ability to learn

  - Experience with legacy modernisation - understanding the
    constraints, risks, and stakeholder dynamics of replacing
    systems that are still in production

  - Exposure to platform or product-led engineering environments

  Benefits

  Why You'll Love Working with Us

  As a company, we're passionate about what we do and the
  citizens we serve. If you, too, want to champion the use of
  technology in public services to improve outcomes for
  citizens and public sector organizations, then Civica is the
  right place for you. We will help you unlock the best
  version of yourself, achieve career growth, and make a real
  difference to people and communities.

  We know that when our people are happy, they work better and
  have greater job satisfaction. Here's what you can expect:

  Time Off & Work-Life Balance

  ✔ 25 Days Annual Leave + bank holidays – plus the option to
  buy up to 10 extra days!  ✔ Days of Difference – Up to 3
  extra days off for volunteering.


  Financial Well-being & Security

  ✔ Pension Contributions – 5% employer match to support your
  future.  ✔ Income Protection – Up to 75% salary cover for
  long-term illness. ✔ Life Assurance – 4x salary tax-free
  lump sum. ✔ Critical Illness Cover – £25,000 lump sum
  (extendable to dependents).



  Health & Perks

  ✔ Private Medical Insurance – Fast access to private
  healthcare.  ✔ Health Cash Plan – Claim back physio,
  therapies & more. ✔ Dental Insurance – Cover for routine &
  emergency care. ✔ Affinity Groups – Join employee-led
  communities. ✔ Bounty Bonus – Refer a friend & get rewarded.

  At Civica, we are committed to building an inclusive and
  diverse workplace where everyone feels valued and supported.
  We believe that a variety of perspectives drives innovation
  and excellence, and we welcome applicants from all
  backgrounds, cultures, and experiences.

  We are an equal opportunity employer. We do not discriminate
  based on race, ethnicity, religion, gender, sexual
  orientation, disability, age, or any other legally protected
  characteristic. Our recruitment process is designed to
  ensure fairness and transparency, so every candidate has an
  equal chance to contribute to our mission.

  If you need any adjustments or accommodations to participate
  in our recruitment process, please let us know. We are here
  to support you.
