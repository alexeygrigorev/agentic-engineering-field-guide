description: |
  Teravision Technologies is a Nearshore Software outsourcing
  company with offices in Colombia and USA and over 170
  professionals working remotely worldwide. With over 20 years
  of experience in design, development, and quality assurance,
  Teravision Technologies offers custom solutions for a wide
  range of industries in the USA, Europe, and Latin America.

  Why Teravision Technologies?

  Here at Teravision Technologies we are problem solvers, with
  detail and objective-oriented mindset and are first and
  foremost team players. We want to be the next big step in
  your career. We look for innovators, people hungry for
  challenges, and go getters to join our team.

  This is a remote position; candidates from all over Latin
  America are welcome to apply.

  General Details:

  - Fully remote position.
  - Working hours (40 hours/week any timezone)
  - Employment type: Contractor.
  - Compensation in USD.

  Key Requirements:

  - 3+ years of professional experience in software development
  - Proficiency in Go (Golang) and Node.js / TypeScript v5
    (primary for Wallet development)
  - Experience building frontend applications using Next.js,
    React, and TypeScript.
  - Experience with API development and integration
  - Strong knowledge of AWS environments and cloud-native tools
  - Experience with PostgreSQL and database design
  - Familiarity with Kubernetes, Terraform, and Helm
  - Experience with monitoring platforms (e.g., Grafana) and
    VSC/Cursor debugging
  - Understanding of multi-threading and goroutines (nice to
    have)
  - Baseline understanding of cryptocurrency concepts: tokens,
    fees, precision

  What's in it for you?

  - Paid time off.
  - Paid National Holidays of your country of residence.
  - Unlimited access to professional educational resources,
    through our growth partner Pluralsight and English
    Learning.
  - Enjoy benefits related to our AWS partnership.
  - Remote work laptop.
  - Career path development.
  - Challenging projects with international clients.
