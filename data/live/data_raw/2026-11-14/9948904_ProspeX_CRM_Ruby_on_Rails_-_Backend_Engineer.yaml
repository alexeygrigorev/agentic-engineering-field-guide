  The Role: Position Summary

  We are looking for a talented Ruby on Rails Engineer -
  Backend to help architect, build, and scale the services
  that power our coaching platform.

  In this role, you will be responsible for designing and
  developing backend systems that support our products

  and user experience. We are looking for a strong software
  engineer who is passionate about building large-

  scale systems and writing clean, elegant, maintainable,
  robust, and well-tested code.

  Key Responsibilities

  1. Design, build, and maintain backend services using Ruby
  on Rails

  2. Develop APIs for mobile apps, web platforms, and data
  ingestion systems

  3. Write clean, maintainable, and well-tested code

  4. Improve system performance, scalability, and reliability

  5. Collaborate with Product, Frontend, Data Engineering, and
  QA teams

  Qualifications & Skills

  Required (Must-Haves)

   Bachelor’s degree in computer science, Information
  Systems, or a related field

   3+ years of hands-on experience in a similar backend
  engineering role

   Strong hands-on experience with Ruby on Rails

   Strong SQL and database design skills

   Experience building APIs for web and mobile applications

   Solid understanding of backend system performance,
  scalability, and reliability

   Experience writing automated tests and delivering
  production-quality code

   Strong collaboration and communication skills.

  Preferred (Nice-to-Haves)

   Experience with PostgreSQL, Elasticsearch, RabbitMQ, and
  AWS

   Experience working with high availability, 24x7 production
  systems

   Experience in distributed systems or large-scale platform
  environments

  Work Arrangement

   Remote opportunity

   Open interested in relocation opportunities

