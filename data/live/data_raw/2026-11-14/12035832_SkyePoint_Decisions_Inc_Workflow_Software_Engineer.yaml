description: |
  SkyePoint Decisions is a leading Cybersecurity Architecture
  and Engineering, Critical Infrastructure and Operations, and
  Applications Development and Maintenance IT service provider
  headquartered in Dulles, Virginia with operations across the
  U.S. We provide innovative enterprise-wide solutions as well
  as targeted services addressing the complex challenges faced
  by our federal government clients. Our focus is on enabling
  our clients to deliver their mission most efficiently and
  effectively – anytime, anywhere, securely. We combine
  technical expertise, mission awareness, and an empowered
  workforce to produce meaningful results.

  This is a contingent position based upon contract win.

  SkyePoint Decisions is seeking a Workflow/Software Engineer
  to join our team supporting the Department of Education’s
  (DoED) Federal Student Aid (FSA) Cybersecurity and Privacy
  Support Services (CPSS) in Washington, DC.

  This person develops software and workflow automation that
  replaces manual or disconnected activities with integrated,
  traceable processes supporting evidence collection,
  assessments, approvals, policy enforcement, and operational
  decision support.

  This is a remote position.

  Responsibilities:

  - Analyze current processes, user needs, business rules,
    handoffs, data inputs, decisions, and exception paths to
    identify automation opportunities.
  - Design and develop workflow applications, services, scripts,
    rules, notifications, forms, and integrations using
    customer-approved technologies.
  - Automate evidence collection, task routing, status tracking,
    approvals, policy enforcement, and operational reporting
    where applicable.
  - Integrate workflows with APIs, data sources, security tools,
    ATO automation capabilities, and customer repositories.
  - Develop unit, integration, and end-to-end automated tests
    and support user/operational validation.
  - Maintain Launch Pad-aligned documentation including
    roadmaps, ADRs, runbooks, README content, change plans,
    and release notes.
  - Participate in code reviews, demonstrations, backlog
    refinement, defect correction, and continuous improvement.

  Required Qualifications:

  - Bachelor’s degree in Computer Science, Software Engineering,
    Information Systems, Engineering, or related field.
    Bachelor’s degree may be substituted for 4 years of within
    scope related work experience.
  - 5-10 years of relevant experience for mid-level assignments
    or equivalent demonstrated capability.
  - Senior industry professional certification such as CISSP or
    equivalent.
  - Experience developing software, workflow automation,
    scripts, services, or low-code/no-code automation in
    enterprise environments.
  - Experience translating process and user requirements into
    maintainable automated solutions.
  - Working knowledge of APIs, data integration, automated
    testing, source control, and CI/CD.
  - Ability to obtain a 6c Public Trust. At least an active
    Secret clearance is highly preferred.
  - U.S. Citizenship is required.

  Preferred Qualifications:

  - Python, Java, JavaScript/TypeScript, or comparable languages
  - Workflow/BPM platforms
  - REST APIs
  - Jira/Confluence
  - GitLab
  - AWS
  - Automated testing frameworks
  - Rules/policy automation

  Compensation:

  Salary Range: TBD

