description: |
  About Neo4j:

  Neo4j is the graph intelligence platform that transforms
  data into knowledge to power the next generation of
  intelligent applications and AI systems. It includes
  enterprise-ready knowledge graphs for accurate, explainable,
  and governed AI; the most comprehensive, trusted, and easy-
  to-deploy graph capabilities across any environment and data
  source; and an unmatched ecosystem trusted by 84 of the
  Fortune 100 and supported by the world’s largest graph
  community. Intelligence that works. Results that matter.

  Built to work everywhere and integrate with everything
  across every cloud for dynamic, personalized, and autonomous
  AI systems. We deliver quicker results, contextual
  knowledge, and solutions that impact customers and employees
  across the business.

  Our Vision:

  At Neo4j, we have always strived to help the world make
  sense of data.

  As business, society and knowledge become increasingly
  connected, our technology promotes innovation by helping
  organizations to find and understand data relationships. We
  created, drive and lead the graph database category, and
  we’re disrupting how organizations leverage their data to
  innovate and stay competitive.

  The Role

  Join the team behind Neo4j Graph Analytics for Snowflake,
  our Snowflake Native App that brings the full power of Neo4j
  Graph Data Science directly into customers' Snowflake
  accounts, with no data movement required.

  You'll work on a product that lives natively inside
  Snowflake: a containerized Java + Python runtime, a SQL-
  first API, and a release pipeline that ships graph analytics
  to enterprise data platforms. Our customers are data
  engineers and data scientists across financial services,
  supply chain, telco, and beyond, who use it to run PageRank,
  community detection, pathfinding, and node embeddings
  against the warehouses where their data already lives.

  This is a hands-on, mid-to-senior role at the intersection
  of graph analytics, cloud-native distribution, and DevOps,
  with a meaningful say in the platform's technical direction.

  What You'll Do

  - Build and evolve the Neo4j Graph Analytics for Snowflake
    application, embedding Neo4j Graph Data Science into the
    Snowflake platform.
  - Design and improve our SQL-facing API: stored procedures,
    UDFs, and the surface area customers call from their
    warehouses.
  - Own significant parts of the build, release, and deployment
    pipeline: Snowflake CLI, Gradle, container images, and the
    Java/Python runtimes that execute inside Snowpark
    Container Services.
  - Improve the platform's security posture: caller's rights vs.
    owner's rights stored procedures, restricted caller's
    rights (RCR), grants, and proactive image scanning.
  - Collaborate with customers and Solution Engineers to turn
    real-world requirements into scalable features.
  - Contribute to operational excellence: runbooks, release
    processes, observability, and reproducible dev
    environments.

  What You'll Bring

  - 4+ years of professional experience building and shipping
    production-quality software.
  - Strong SQL skills and real experience integrating with cloud
    data warehouses (Snowflake, BigQuery, Redshift,
    Databricks, or similar).
  - Solid grounding in at least one of Java or Python, and
    willingness to be effective in both.
  - A genuine DevOps mindset: comfortable owning build
    pipelines, container images, releases, and the operational
    side of a product.
  - Experience designing software for performance, scalability,
    and predictable cost on cloud infrastructure.

  Bonus Points

  - Hands-on experience with Snowflake, especially Native Apps,
    Snowpark Container Services, or building stored procedures
    and UDFs at scale.
  - Familiarity with Docker, OCI image registries, and security
    scanning tooling (Semgrep, Snyk, Trivy, etc.).
  - Understanding of graph theory and graph algorithms
    (centrality, community detection, pathfinding,
    embeddings), or strong curiosity to learn them.
  - Background in distributed systems, JVM performance tuning,
    or columnar/analytical query engines.

  Experience working in a distributed, remote-first team and
  shipping to enterprise customers.

  #Li-Hybrid

  Why Join Neo4j?

  Neo4j is, without question, the most popular graph
  intelligence platform in the world. We have customers in
  every industry globally, and our products are a proven
  product/market fit. Joining our team is an opportunity to
  shape the future of data and analytics. Below are just a few
  exciting facts about Neo4j.

  - Neo4j is one of the fastest-scaling technology companies in
    this industry. It recently surpassed $200M in annual
    recurring revenue (ARR), doubling its ARR over the past
    three years.
  - Raised the biggest funding round in database history ($325M
    Series F). Backed by world-class investors like Eurazeo,
    GV (formerly Google Ventures), and Inovia Capital, Neo4j
    has raised over $600M in funding and is currently valued
    at over $2Bn. This puts Neo4j among the most well-funded
    database companies in history.
  - 84% of the Fortune 100 and 58% of the Fortune 500 use Neo4j.
    Examples include Boston Scientific, BT Group, Caterpillar,
    Cisco, Comcast, Department for Education UK, eBay, NBC
    News, Novo Nordisk, Worldline, and others.
  - Co-founder and CEO Emil Eifrem has built an amazing culture
    that prides itself on relationships, inclusiveness,
    innovation, and customer success.
  - Countless industry awards. Massive enterprises and
    individual developers/data scientists love Neo4j. A strong
    sense of community and ecosystem is built around the
    platform.
  - A recent Forrester Total Economic Impact™ Study cited Neo4j
    as delivering 417% ROI to customers.

