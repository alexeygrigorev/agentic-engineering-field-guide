description: |
  *This position will have a focus on Sitecore GCI's Software
  Engineer III will apply principles and techniques of
  computer science, engineering, and mathematical analysis to
  design, develop, document, test, debug and support new and
  existing software systems and solutions which solve business
  problems and support the goals of the company.

  ESSENTIAL DUTIES AND RESPONSIBILITIES AT ALL LEVELS:



  Development and Design:



  - Design, develop/build and test applications, integrations,
    scripts, automations, and other software solutions that
    meet business objects and requirements, while adhering to
    the SDLC, security standards, development guidelines and
    best practices.  Define system performance standards and
    KPI’s.
  - Properly and accurately estimate, track, and document all
    development efforts to all departmental and team standards
    and specification requirements.  This might include, but
    is not limited to, detailed LOE estimates, technical
    specifications, flowcharts, architectural diagrams,
    administration instructions and end-user manuals,
  - Collaborate, as needed, with project managers, business
    analysts and other developers as well as other project
    resources during the scoping, requirements gathering and
    design phases of projects.        Comply with all project
    plans throughout the development process.



  Operational Support:



  - Provide exceptional customer, end-user, and stakeholder
    support always.
  - Troubleshoot and debug solutions to resolve incidents and
    ongoing problems.
  - Monitor systems performance and identify areas of
    improvement.
  - Upgrade, reconfigure and improve solutions, as needed, to
    achieve high usability, reliability, availability,
    accuracy, and performance and either reduce or eliminate
    technical debt.



  Web Applications Focus Addendum:



  Additional Engineer Job Duties & Disciplines

         Web Applications Systems Engineers are responsible
  for architecting and delivering high-performance, responsive
  web interfaces across both mobile and desktop platforms.
  Candidates must possess a strong foundational understanding
  of web UI/UX design principles, web server configurations,
  cross-browser and device compatibility, data encryption,
  database management, and core networking concepts.
  Additionally, this role requires comprehensive expertise in
  deploying and customizing diverse Content Management
  Systems, with specific proficiency across platforms such as
  Sitecore, Adobe Experience Manager, Drupal, WordPress, and
  Contentful. Crucially, candidates must bring hands-on
  development experience utilizing a robust stack of modern
  web application frameworks, libraries, and languages. This
  includes core competency in HTML, CSS, JavaScript,
  TypeScript, jQuery, PHP, C#, and ASP.NET, alongside
  specialized framework expertise in React, Next.js, and
  Node.js. Engineers will leverage this background to build
  and consume scalable web services and advanced APIs
  utilizing REST, GraphQL, and WebSocket protocols. Finally,
  qualified engineers are expected to actively champion modern
  web application engineering principles and development
  methodologies. This includes a proven track record of
  operating within Agile environments, leveraging practices
  like Test-Driven Development (TDD) and Peer Programming to
  deliver clean, maintainable code. Ultimately, the successful
  candidate will apply these workflows to advance cutting-edge
  system designs, specifically focusing on Composable
  Architecture, Serverless Compute, and fully automated CI/CD
  deployment pipelines.

  - ACCOUNTABILITY- Takes ownership for actions, decisions, and
    results; openly accepts feedback and demonstrates a
    willingness to improve. Take ownership and accountability
    of problems and facilitate finding a solution, involving
    other groups as necessary.  Own and manage priorities and
    individual tasks without direct supervision. Take
    initiative and seek out opportunities. Assess and accept
    risks and learn from mistakes.
  - BASIC PRINCIPLES - Interacts with people in a way that
    builds mutual trust, confidence, and respect; adheres to
    GCI’s Code of Conduct for Employees – the Basic
    Principles. Lead by example on all fronts.
  - COLLABORATION - Works effectively with others to accomplish
    common goals and objectives; maintains positive
    relationships even under difficult circumstances. Build
    and maintain effective working relationships with
    leadership, peers, customers, and vendors. Work to resolve
    problem relationships directly. Ability to work
    independently and within a team environment,
    professionally.
  - COMMUNICATION- Conveys thoughts and expresses ideas
    appropriately and professionally, including the ability to
    explain technical concepts to all audiences including
    software diagramming such as UML. Decision making, problem
    solving, both technical and procedural. Ability to
    facilitate strategic and tactical discussion between
    business users and stakeholders, technical teams, and IT
    leadership.  Take initiative to initiate communication
    amongst teams, including remote team members.
  - COMPLIANCE - Follows internal controls; protects company and
    customer confidential information; abides by GCI’s Code of
    Business Conduct & Ethics.
  - CUSTOMER FOCUS - Demonstrates commitment to service
    excellence; gives high priority to customer satisfaction.
    Provide a professional level of service to both external
    and internal customers.
  - RELIABILITY - Consistently follows through on assigned tasks
    as expected; demonstrates timely attendance at meetings,
    training, and other work obligations.
  - RESULTS - Uses a combination of knowledge, initiative, sound
    decision making, innovation, adaptability, and problem
    solving. Ability to provide training to team members on
    technology.
  - SAFETY & SECURITY - Supports a safe work environment by
    following all workplace safety rules and guidelines;
    complies with applicable Security policies and procedures.
  - MS Office knowledge (e.g., Outlook, Teams, Word, Excel).
    Knowledge of standard network engineering concepts.
    Ability to create and edit network diagrams.

   TECHNICAL COMPETENCIES:

  Demonstrated ability to:



  - Apply Engineering principles and techniques of Computer
    Science, Engineering, and mathematical analysis.
  - Ability to work with other developers and inter-disciplinary
    teams collaboratively and professionally.
  - Follow and enforce established procedures.
  - Research new configuration tools and methodologies.
  - Research new software development tools and methodologies,
    evaluating opportunities for efficiency or quality gains.



  In-depth knowledge of:



  - Software languages and platforms particularly needed for
    troubleshooting modern development platforms and
    frameworks.
    - Enterprise level integration technologies, tools, and
      patterns including but not limited to: J2EE application
      servers, Webservers, RESTful web services, ActiveMQ,
      Camel, etc.
    - Multiple software languages and tools such as Java, Ruby,
      Angular, JavaScript, C#, ASP.Net, HTML, XML, PHP, Perl,
      etc.
    - Applications and Service Monitoring and Telemetry such as
      Splunk, ELK (Elasticsearch / Logstash / Kibana),
      Prometheus, Grafana, Monit, etc.
    - Database solutions such as MySQL, MongoDB, Oracle, MS SQL,
      NoSQL, etc.
    - Operating systems such as Windows, UNIX, Linux, etc.
    - Configuration management, Agile processes, Continuous
      Integration, Continuous Delivery and build procedures,
      including source control and build tools such as SVN,
      Artifactory, GIT, Bamboo, Chef, Jenkins, etc.



  Understanding of:



  - TCP/IP and higher-level networking protocols such as HTTP,
    FTP.
  - Telecom and OSS concepts include order management,
    provisioning, service assurance, trouble management,
    billing, and invoicing.
  - Database concepts.
  - Enterprise software concepts such as transactional
    processing, clustering, high availability, and redundancy.
  - Software functionality and performance testing.



  Additional Job Requirements:



  Establishes standards for software "build" process used to
  organize/document artifacts from developer build requests.
  Materially participates in the Company’s adoption of
  continuous integration and development operations practices
  as well as applicable ITIL practices.



  Minimum Qualifications:



  Required: *A combination of relevant work experience and/or
  education sufficient to perform the duties of the job may
  substitute to meet the total years required on a year-for-
  year basis



  - High School diploma or equivalent.
  - Bachelor’s degree in Computer Science, Computer
    Technologies, Systems Analysis, Engineering, or relevant
    field. *
  - Minimum of six (6) years’ experience in software
    development, configuration engineering, or similar
    technical role. *
  - Experience with multiple OS scripting languages and Web
    based scripting technology.



  Preferred:



  - Experience within the telecommunications industry.
  - Other telecom industry or job specific certifications.



  DRIVING REQUIREMENTS:



  This position may require access to reliable transportation
  for occasional travel, such as between retail store
  locations, offices, worksites, or other locations as needed.

   PHYSICAL REQUIREMENTS and WORKING CONDITIONS:

  - Work is primarily sedentary, requiring daily routine
    computer usage.
  - Ability to work shifts as assigned, work in standard
    office/home office setting, and operate standard office
    equipment.
  - Ability to accurately communicate information and ideas to
    others effectively.
  - Physical agility and effort sufficient to perform job duties
    safely and effectively.
  - Ability to make valid judgments and decisions.
  - Available to work additional time on weekends, holidays,
    before or after normal work hours when necessary.
  - Must work well in a team environment and be able to work
    with a diverse group of people and customers.
  - Virtual workers must comply with remote work policies and
    agreements.

         The company and its subsidiaries operate in a 24/7
  environment providing critical services to Alaskans and may
