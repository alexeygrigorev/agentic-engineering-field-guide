description: |
  Condé Nast is one of the world's most renowned media
  publishing companies, creating and distributing every type
  of media today, spanning print and digital publishing in all
  formats. With a portfolio of some of today's most
  influential brands, the company continues to grow its
  audience through a global operational and content
  infrastructure across its 12 owned and operated markets.
  Headquartered in New York City, the company's owned and
  operated markets include China, France, Germany, India,
  Italy, Japan, Mexico & Latin America, Spain, Taiwan,
  UAE/Dubai, the U.K., and the U.S., with additional local
  license partners in over twenty additional markets across
  the globe. Lead brands include Vogue, The New Yorker, GQ,
  Architectural Digest, Condé Nast Traveler, Vanity Fair,
  Wired, Allure, Ars Technica, Bon Appétit, House & Garden,
  Pitchfork, Tatler, and Vogue Business.Job Description

  Location:

  London, GB

  Condé Nast is a global media company, home to iconic brands
  including Vogue, The New Yorker, GQ, Glamour, AD, Vanity
  Fair and Wired, among many others. The company's award-
  winning content reaches 84 million consumers in print, 367
  million in digital and 379 million across social platforms,
  and generates more than 1 billion video views each month.

  The company is headquartered in London and New York, and
  operates in 32 markets worldwide, including China, France,
  Germany, India, Italy, Japan, Mexico & Latin America,
  Russia, Spain, Taiwan, the U.K. and the U.S., with local
  license partners across the globe. Condé Nast is focused on
  diversifying the digital business models for our brands via
  video and streaming platforms, increasing subscriptions and
  memberships and growing our events business while
  maintaining high levels of engineering standards, and we are
  looking for exceptional engineers to join our in-house teams
  to help us execute on our vision.

  Condé Nast thrives on collaboration, and our teams come
  together in the office four days a week (Monday - Thursday).

  Please note that this is a 6 month fixed term contract.

  We value diversity of background, views and cultures. We
  celebrate people for their personal qualities, skills and
  contributions, recognising the power our brands have to
  influence and shape culture.

  About Condé Nast Engineering

  At Condé Nast we pride ourselves on diversity of thought,
  inclusivity and collaboration. Our shared goal is to solve
  problems creatively, learning and having fun in the process
  of building features that spark joy with our global
  audiences. Our in-house engineering teams are always working
  on something exciting.

  We work in an AI-native way. We treat AI tooling as a normal
  part of how we design, build and review software, and we
  expect you to use it well and with good judgement. You do
  not need to be an expert, but you should be familiar with
  AI-assisted development tools, curious about where they can
  improve our work, and thoughtful about code quality, review
  and data handling when you use them.

  Some practices we like

  - Pair-programming. We like knowledge sharing and learning
    from one another.
  - Global view. We work with peers in different geo-locations.
  - Mentoring and coaching. We care about each other.
  - Tapping into our creativity. Every first Friday of the month
    is a "What You Want" Day. We also participate in multi-day
    organisation-wide hackathons annually.
  - Continuous deployment.

  Our technology at a glance

  JavaScript, TypeScript, Node.JS, React and React ecosystem,
  Next.js, GraphQL, REST APIs, Postgres, MongoDB,
  Elasticsearch, Docker, Terraform, AWS, Kubernetes, Kibana,
  Datadog, Codex, Gemini, ChatGPT

  Key Duties & Responsibilities

  - Working within a cross-functional team that includes design,
    UX and product management.
  - Shipping features and services that impact a large audience
    worldwide.
  - Contributing to technical decision-making, problem-solving,
    and estimation.
  - Pairing with members of your team to identify the optimal
    solution. Regularly conducting code reviews to ensure high
    standards of engineering quality in the code that we
    write.
  - Using your own technical expertise to help guide Product and
    Design decisions.
  - Mentoring colleagues at every level, and a willingness to be
    mentored by them.
  - Looking at logs and monitoring metrics and responding to
    alerts; we use Kibana, ElasticSearch and Datadog
    extensively, but as long as you are aware of how important
    observability is, we do not mind what tools you may have
    used in the past.
  - Working in collaboration with Platform and Architecture
    teams as and when necessary.

  About you - Essential skills

  - Proficient in JavaScript, Node.js, good understanding of ES9
    and JavaScript testing frameworks (such as Jest, Mocha
    etc.)
  - Good understanding of Cloud Native architecture,
    containerisation, Docker, AWS, CI/CD, and DevOps culture.
    Kubernetes foundational knowledge would be a great bonus,
    as we use it extensively.
  - Practical experience in the use of leading engineering
    practices and principles.
  - Appreciation for the functions of Product and Design, and
    experience working in cross-functional teams.
  - You will try to make the codebase nicer for the next person
    that visits it.
  - You are someone who will own every step of the development
    process; from refining tickets to shipping the code to
    production.
  - You will do your best, and ask for help when it is needed.
  - You have an interest or desire to learn about every part of
    the stack; from the latest JavaScript standards, to
    GraphQL, to accessibility, and the infrastructure we
    deploy to.
  - Someone who can communicate in a variety of media (through
    Slack and in person) effectively within their team,
    outside of their team, and with people in our product and
    design families, and even with our users.
  - Able to effectively communicate technical concepts to
    different audiences.
  - Business proficiency in spoken and written English.

  About you - Desirable skills

  - Experience working with international teams across multiple
    time-zones.
  - Knowing about continuous integration, testing strategies,
    software architecture, user experience, accessibility,
    internationalisation and web performance.
  - Experience and/or interest in working in publishing.
  - Experience and/or interest in working across culture, music
    and lifestyle content.
  - Proficiency working with a variety of third-party APIs and
    developer tools.
  - Commercial experience using Kubernetes and GraphQL.

  What benefits do we offer?

  - 25 days holiday (plus bank holidays) and extra days of
    annual leave if you move house or want to volunteer.

  - You’ll have access to a competitive pension scheme, Bupa
    Private Healthcare, Season ticket loans and eye tests.

  - We offer a range of tools to support your wellbeing,
    including core hours, 10 remote days (from home or a
    country with a Condé Nast office location), access to our
    Employee Assistance Programme, corporate gym membership
    and cycle to work scheme.
  - We’re a dog-friendly office, plus you’ll enjoy discounts and
    magazine subscriptions, keeping you up to date with all
    things Condé Nast.

  - We encourage personal and professional growth through the
    Condé Nast Learning Hub, where you’ll find an extensive
    portfolio of learning courses and training available in
    local languages.
  - Our Employee Resource Groups provide a platform for
    employees to identify shared objectives, exchange ideas,
    and work on community priorities for our global workforce.

  What happens next?

  If you are interested in this opportunity, please apply
  below, and we will review your application as soon as
  possible. You can update your resume or upload a cover
  letter at any time by accessing your candidate profile.

  Condé Nast is an equal opportunity employer. We evaluate
  qualified applicants without regard to race, color,
  religion, sex, sexual orientation, gender identity, national
  origin, disability, veteran status, age, familial status and
  other legally protected characteristics.
