title: Software Development Engineer II – Payments
company: Seated
location: New York, USA
work_type: FULL_TIME
company_size: 72 Employees
description: |
  All About Us

  Seated is the first dynamic pricing platform for
  restaurants. We help fill their empty seats while providing
  consumers incredible rewards to top brands and unique
  experiences. We are quickly expanding our offerings to
  cities across the country and are looking for talented and
  ambitious people to embark on the journey with us!

  The Role

  We’re fast-paced, innovative, and metric-driven, with a team
  passionate about delighting our customers. We’re looking for
  a mid-level Software Development Engineer with a strong
  foundation in card payment processing and payments
  infrastructure. You’ll help build and scale the systems that
  manage Seated’s growing network of restaurants and their
  transactions. You’ll translate business needs into live
  features and partner directly with business owners who
  recognize the value of technology. You’ll have a strong
  voice in product design and ownership across coding, QA, and
  production support.

  Responsibilities

  - Design, build, and maintain scalable backend systems that
    reliably manage merchant accounts, transactions, and
    attribution logic
  - Partner with business stakeholders to translate requirements
    into well‑implemented, deterministic workflows and
    services
  - Build reliable, fault‑tolerant distributed systems with
    strong coding, testing, observability, performance, and
    reliability practices
  - Contribute to technical design for high‑performance,
    service‑oriented architectures
  - Scale backend services and microservices for high throughput
    and low latency across fast‑growing payment datasets

  Requirements

  - Bachelor’s in Computer Science or Engineering; 3+ years of
    experience shipping production payment/fintech systems
  - Deep understanding of payments infrastructure, including
    card network flows, authorization/settlement lifecycles,
    and payment processor/gateway integrations
  - Ability to quickly learn new payment technologies and apply
    them to real‑world solutions and product design
  - Proficiency in Java and the Spring Boot framework; or
    equivalent expertise in a similar object‑oriented
    language.
  - Experience building high‑availability systems, including
    low‑latency APIs and distributed RESTful/gRPC services;
    practiced in backward compatibility, deterministic
    behavior, and idempotency

  Preferred Experience

  - Solid knowledge of distributed databases and scalable,
    fault‑tolerant caching
  - Experience with AI agents and prompt engineering; able to
    build web features using agentic workflows and modern
    frontend frameworks
  - Cloud experience (AWS or GCP), containerization (Docker);
    familiarity with AWS services such as ECS, RDS, and
    Kinesis, plus observability tools like Datadog
  - Preferred: Experience with workflow orchestration engines
    (Temporal, Cadence, or AWS Step Functions)

  Compensation and Benefits

  - $160K - $180K plus stock options
  - 401k with company match
  - Medical, dental, and vision coverage
  - FSA, dependent care, and commuter benefits
  - Paid parental leave and unlimited PTO
  - TeleDoc, One Medical, Talkspace, and WellHub access
  - Citi Bike membership
  - $100 monthly Seated dining credit

  At Seated, we welcome passionate people from all
  backgrounds, helping us to make dining experiences more
  accessible & rewarding. If you have the curiosity & passion
  to drive our mission together, we would love to hear from
  you.

  Compensation

  The base pay range for this role is $165,000 – $180,000 per
  year.
