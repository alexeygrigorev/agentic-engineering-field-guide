description: |
  Courier Health is on a mission to solve one of the biggest
  and most meaningful opportunities in healthcare: reinvent
  how people living with chronic and rare diseases are
  supported.

  We are building the future of patient engagement for life
  sciences companies. Our software is leveraged by biopharma
  companies to support patients in their complex journey from
  diagnosis to initiating and remaining on therapy to achieve
  optimal health outcomes.

  We are looking for talented individuals who are motivated by
  the opportunity to have an outsized impact on not just their
  company, but the healthcare industry at large.

  What You'll Do

  - Play a lead role designing and building new features for our
    core products
  - Improve the speed and reliability of existing applications
  - Work with other employees to find new product opportunities
  - Help us scale the company, the culture, and our products

  Qualifications

  - BS or MS in computer science or related field
  - 12+ years professional experience
  - Strong experience with object oriented programming and a
    high bar for code quality
  - Experience with AWS services, such as DynamoDB, API Gateway,
    SES, Cognito
  - Passionate about solving technical challenges and
    architecting infrastructure that is both sustainable and
    scalable
  - Inspired by our mission to improve healthcare through
    technology
  - Seek simple approaches to complex problems
  - Proven track record of being an independent self-starter

  Bonus Points

  - Experience with serverless architecture (e.g. AWS Lambda)
  - Experience with Javascript, TypeScript, GraphQL, or Node.js
  - Experience building healthcare applications
  - Have taken a leading role in delivering complex software
    systems all the way to production

  Benefits

  - 100% paid employee health benefit options (including
    medical, dental, and vision)
  - 401(k) with employer funded match
  - Unlimited Vacation
  - Commuter Benefits
  - Paid parental leave
  - Catered lunch on Fridays
  - Wellness stipend
  - Great Place to Work Certified

  The annual salary range for the target level for this role
  is $200,000-$230,000 + equity + benefits, including medical,
  dental, and vision.

  Courier Health is proud to be an Equal Employment
  Opportunity employer.

  We do not discriminate based upon race, religion, color,
  national origin, gender (including pregnancy, childbirth, or
  related medical conditions), sexual orientation, gender
  identity, gender expression, age, status as a protected
  veteran, status as an individual with a disability, or other
  applicable legally protected characteristics.
