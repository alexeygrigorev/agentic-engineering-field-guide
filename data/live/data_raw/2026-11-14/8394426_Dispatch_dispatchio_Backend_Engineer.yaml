description: |
  About Us

  The financial advisory industry is a $80T market in the US,
  but has seen little technological innovation compared to the
  self-service market (Robinhood, Betterment, Wealthfront,
  SoFi). Client data management is a universally painful and
  expensive problem for financial advisors. Today, advisors
  manually collect, update, and utilize client data across the
  7-10 software tools that they use to run their business.
  Data transcription and translation across systems is time-
  consuming and error-prone, leading to costly inefficiencies
  and embarrassing client-facing problems. Managing data
  access control, audit logs, and compliance is a constant
  challenge, particularly in larger organizations.

  We are building the first wealth tech data orchestration
  company. We sync client data across a financial advisor's
  tech stack, unlocking the efficiency of a fully-integrated
  software suite with the choice of tools that best fit their
  business. We are laser-focused on enabling the best
  technology experiences for advisors and unlocking the
  potential of the entire wealth tech software ecosystem.
  We’re an experienced team of start-up operators with deep
  roots in both tech and advisory. You can learn more about us
  on our website.

  Role DetailsRole overview:

  We're looking for a backend engineer to help build and scale
  our integration infrastructure. You'll work closely with our
  staff backend engineer to tackle complex problems in data
  mapping, syncing, and platform reliability while expanding
  our integration capabilities across the wealth tech
  ecosystem.

  Where you'll make an impact:

  - Build and maintain integrations with third-party financial
    systems, expanding our platform's connectivity across the
    wealth tech landscape.
  - Solve complex data mapping and synchronization challenges,
    ensuring accurate and reliable data flow between disparate
    systems with different schemas and constraints.
  - Develop platform capabilities that enable seamless, scalable
    data orchestration for our customers' tech stacks.
  - Own end-to-end delivery of backend features and services,
    from design through deployment and monitoring.
  - Contribute to our integration infrastructure, building
    reusable patterns and tooling that make adding new
    integrations faster and more reliable.
  - Collaborate with frontend, product, and design teams to
    deliver high-quality customer experiences backed by robust
    backend systems.

  Requirements:

  - 4-6 years of backend engineering experience with a track
    record of shipping reliable, well-tested systems.
  - Strong fundamentals in backend development, including API
    design, data modeling, concurrent systems, and performance
    optimization.
  - Experience working with relational databases and distributed
    systems concepts.
  - Curious and eager to learn - you're excited to dig into
    unfamiliar systems, understand complex integrations, and
    grow your technical skills.
  - Bias toward action and ownership - you see a problem,
    propose solutions, and drive it to completion without
    needing constant direction.
  - Strong communication skills and comfort working cross-
    functionally with product, design, and other engineers.
  - Thrive in fast-paced environments with evolving priorities
    and high autonomy.
  - Interest and experience with AI tools and prompting - you
    leverage AI in your workflow and can help level up the
    team's capabilities.

  You'll stand out if you have:

  - Experience building integrations, ETL pipelines, or working
    with third-party APIs at scale.
  - Exposure to financial services, fintech, or B2B SaaS
    products.
  - Experience at seed/early-stage startups where you wore
    multiple hats and moved quickly.
  - Familiarity with event-driven architectures, message queues,
    or data synchronization patterns.
  - Previously built side projects or contributed to open source
    software.

  Our tech stack: Golang, Redis, PostgreSQL, AWS SQS, Amazon
  S3

  Why Dispatch?

  Why work at Dispatch?

  - We’re a highly experienced team with a track record of
    successfully building together. We’re well-versed in
    building for the best tech companies and asset managers.
  - We’re a well-funded company backed by top-tier investors.
  - We're laser-focused on customers and believe that a world-
    class user experience is critical for product and business
    success.
  - We move fast, iterate quickly, and have a high bar for what
    “excellent” looks like.

  What we offer:

  - Competitive salary and equity options
  - High-quality benefits package including 100% company-paid
    insurance premiums for family coverage (medical, vision,
    dental).
  - 401K, HSA & FSA plans
  - OneMedical, HealthAdvocate, TalkSpace, and Teladoc
    memberships
  - Technology stipend
  - Unlimited PTO
  - Paid parental leave
  - Office space in San Francisco and New York for in-person
    working

  Dispatch provides equal employment opportunities to all
  employees and applicants for employment and prohibits
