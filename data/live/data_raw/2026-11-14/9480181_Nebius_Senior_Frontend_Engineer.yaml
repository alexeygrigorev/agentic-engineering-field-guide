description: |
  About Nebius:

  Nebius is leading a new era in cloud infrastructure for the
  global AI economy. We are building a full-stack AI cloud
  platform that supports developers and enterprises from data
  and model training through to production deployment, without
  the cost and complexity of building large in-house AI/ML
  infrastructure.

  Built by engineers, for engineers. From large-scale GPU
  orchestration to inference optimization, we own the hard
  problems across compute, storage, networking and applied AI.

  Listed on Nasdaq (NBIS) and headquartered in Amsterdam, we
  have a global footprint with R&D hubs across Europe, the UK,
  North America and Israel. Our team of 1,500+ includes
  hundreds of engineers with deep expertise across hardware,
  software and AI R&D.

  Why work at Nebius

  Nebius is leading a new era in cloud computing to serve the
  global AI economy. We create the tools and resources our
  customers need to solve real-world challenges and transform
  industries, without massive infrastructure costs or the need
  to build large in-house AI/ML teams. Our employees work at
  the cutting edge of AI cloud infrastructure alongside some
  of the most experienced and innovative leaders and engineers
  in the field.

  Where we work

  Headquartered in Amsterdam and listed on Nasdaq, Nebius has
  a global footprint with R&D hubs across Europe, North
  America, and Israel. The team of over 1500 employees
  includes more than 400 highly skilled engineers with deep
  expertise across hardware and software engineering, as well
  as an in-house hardware R&D team.

  The team

  You will join a small, highly focused frontend engineering
  team responsible for building internal interfaces that power
  Nebius’s GPU cloud and data center operations. The team
  develops tools that automate infrastructure deployment,
  server operations, network management, and logistics
  workflows across global data center environments. This role
  is part of the wider infrastructure and operations
  organization and works closely with engineering teams
  responsible for cloud infrastructure, deployment automation,
  and production operations.

  The role

  We are seeking a Senior Frontend Engineer  to design and
  build internal platforms that support automation and
  operational management across Nebius data centers and GPU
  cloud infrastructure. This is a highly autonomous role
  focused on developing reliable, scalable user interfaces for
  infrastructure-heavy environments. You will work across
  systems related to server operations, network management,
  logistics, and deployment workflows while partnering closely
  with infrastructure and operations teams.

  Your responsibilities will include:

  - Designing and developing internal web applications that
    automate data center and infrastructure operations.
  - Building user interfaces that support server management,
    network operations, deployment workflows, and logistics
    processes.
  - Collaborating with infrastructure, operations, and platform
    engineering teams to translate operational requirements
    into scalable frontend solutions.
  - Improving reliability, usability, and operational efficiency
    across internal tooling platforms.
  - Working closely with European-based frontend engineers to
    align on architecture, standards, and development
    practices.
  - Supporting deployment and operational workflows across GPU
    cloud infrastructure environments.
  - Contributing to frontend architecture decisions, component
    design, and long-term maintainability of internal systems.
  - Participating in code reviews, technical discussions, and
    continuous improvement initiatives across the engineering
    organization.

  We expect you to have:

  - Strong experience with JavaScript and/or TypeScript.
  - Hands-on experience building modern frontend applications
    using React.
  - Experience working with Docker and containerized development
    environments.
  - Strong Linux knowledge and command-line proficiency.
  - Experience supporting, deploying, or troubleshooting
    applications in production infrastructure environments.
  - Strong problem-solving skills with the ability to operate
    independently in high-responsibility environments.
  - Ability to collaborate effectively across distributed teams
    and time zones.
  - A proactive, ownership-driven mindset with strong
    communication skills.

  Nice to have:

  - Experience with frontend state management libraries and
    patterns.
  - Background working in infrastructure, cloud, or data center
    environments.
  - Familiarity with deployment automation or operational
    tooling.
  - Experience building internal developer or operations-focused
    platforms.

  Pay Transparency

  We offer competitive compensation and benefits packages.
  Actual compensation will be determined based on job-related
  factors, including experience, skills, qualifications, the
  level at which the candidate is hired, and geographic
  location, consistent with applicable law.

  Base Compensation Range

  $122,880—$184,320 USD

  Benefits & Perks:

  - Competitive compensation
  - Career growth and learning opportunities
  - Flexibility and ownership
  - Collaborative and innovative culture
  - Opportunity to work on impactful AI projects
  - International environment and talented teams

  What's it like to work at Nebius:

  Fast moving - Bold thinking - Constant growth - Meaningful
  impact - Trust and real ownership - Opportunity to shape the
  future of AI

