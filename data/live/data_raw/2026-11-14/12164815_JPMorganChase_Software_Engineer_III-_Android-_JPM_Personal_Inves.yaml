description: |
  J.P. Morgan Personal Investing offers award-winning
  investments, products and digital wealth management services
  to over 275,000 investors in the UK. We built the business
  with innovation as a core part of our ethos to give
  consumers the confidence and clarity to make informed
  investment decisions and achieve their financial goals.

  As an Android Engineer in the Android team at J.P.Morgan
  Personal Investing, you will play a key role in advancing
  our mobile platform. You’ll drive architectural
  improvements, support our migration to MVVM and Hilt, and
  help modularise our app for white-labelling solutions.
  You’ll collaborate with cross-functional teams to deliver
  robust, scalable, and user-centric features. You’ll also
  contribute to our culture of continuous learning and
  innovation.

  Job Responsibilities:

  - Design, develop, and maintain Android applications using
    Kotlin and best engineering practices
  - Apply SOLID principles, design patterns, and architecture
    types to deliver scalable solutions
  - Lead and participate in the migration to MVVM and Hilt
  - Modularise and abstract the app to support white-labelling
  - Collaborate with cross-functional teams, including iOS and
    backend engineers
  - Write and maintain unit, integration, and UI tests
  - Implement and support CI/CD pipelines
  - Stay current with Android trends and share insights with the
    team
  - Integrate new features such as Google Pay, Google Assistant,
    and Android Widgets
  - Ensure app performance, reliability, and a crash-free user
    experience
  - Communicate effectively and proactively solve problems

  Required Qualifications, Capabilities, and Skills:

  - Proficiency with Kotlin, Android SDK, and Android Studio
  - Experience with RxJava or Coroutines, and Dagger or Hilt
  - Familiarity with Java/Android design patterns (MVP, MVVM)
  - Experience writing unit, integration, and UI tests
  - Understanding of mobile design best practices and human
    interface guidelines
  - Experience working in agile environments using Scrum
  - Experience with Git or similar distributed SCM systems
  - Knowledge of REST and messaging platforms
  - Experience with CI/CD processes
  - Strong communication and collaboration skills
  - Proactive approach to problem solving
  - Preferred Qualifications, Capabilities, and Skills:

  - Portfolio on Github, Stack Overflow, or published apps
  - Experience in fintech or financial services
  - Participation in tech meet-ups or communities
  - Experience with navigation libraries and multi-module apps
  - Experience with flavouring and whitelabelling
  - Experience using NodeJS
  - Experience working with Design Systems

