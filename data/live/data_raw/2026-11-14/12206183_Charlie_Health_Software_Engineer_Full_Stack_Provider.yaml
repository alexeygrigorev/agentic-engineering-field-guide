description: |
  Why Charlie Health?

  Millions of people across the country are navigating mental
  health conditions, substance use disorders, and eating
  disorders, but too often, they’re met with barriers to care.
  From limited local options and long wait times to treatment
  that lacks personalization, behavioral healthcare can leave
  people feeling unseen and unsupported.

  Charlie Health exists to change that. Our mission is to
  connect the world to life-saving behavioral health
  treatment. We deliver personalized, virtual care rooted in
  connection—between clients and clinicians, care teams, loved
  ones, and the communities that support them. By focusing on
  people with complex needs, we’re expanding access to
  meaningful care and driving better outcomes from the comfort
  of home.

  As a rapidly growing organization, we're reaching more
  communities every day and building a team that’s redefining
  what behavioral health treatment can look like. If you're
  ready to use your skills to drive lasting change and help
  more people access the care they deserve, we’d love to meet
  you.

  About the Role

  Charlie Health leads the nation in high-acuity virtual
  behavioral care, having delivered life-saving treatment to
  more than 100,000 clients nationwide. Our Clinical staff is
  composed of two core groups: Primary Therapists, who provide
  1:1 care, and Group Facilitators (GFs), who lead group-based
  sessions that are foundational to the care journey. GFs are
  our largest and most distributed clinical workforce, and
  enabling them to deliver consistent, high-quality care at
  scale is one of our most important and hardest problems. The
  Provider team builds the systems that power how this care is
  prepared, delivered, and improved over time. This is not
  just about internal tooling, it’s about shaping the
  operating system for group-based care.

  You’ll build products that help facilitators show up to
  every session informed, confident, and effective. That
  includes everything from making a client’s full care history
  and context accessible in the right moments, to generating
  structured session summaries, to developing playbooks and
  workflows that guide facilitators in real time. You’ll also
  tackle the challenge of making facilitator care quality more
  measurable to turn complex and often unstructured clinical
  interactions into signals that can drive feedback, coaching,
  and continuous improvement.

  If you care about building tools that empower clinical staff
  to focus on care, not clicks, this is the team for you.

  Responsibilities

  - Develop and deliver high quality, performant, maintainable
    features that drive meaningful business value using our
    core technology stack: React, Python, and PostgreSQL
  - Set strong patterns for our growing team to follow,
    supported by modern AI tools to develop quickly at scale
  - Partner with teammates across the organization to understand
    our business. Leverage that understanding to drive data
    modeling discussions and decisions
  - Be an owner. Collaborate with product and design to iterate
    to top notch product solutions
  - Identify bottlenecks and implement improvements to
    engineering processes, tools, and procedures. We’re early
    and the expectation of folks joining at this stage is that
    you’ll play a huge part in setting and improving how we
    work
  - Promote a culture of collaboration and learning across
    engineering, product, and design team via mentoring,
    documentation, presentations, or other knowledge sharing
    methods
  - Ensure our clients can always access the care they need by
    participating in our on-call rotation

  Requirements

  - 2+ years of professional experience developing user facing
    web applications that deliver meaningful business value
  - Expertise and hands on production experience with an
    application programming language, preferably Python and/or
    Javascript
  - Excellent at managing ambiguity. Masterful ability to break
    down big, messy problems (demanding requirements, bugs,
    etc) into smaller parts with tractable solutions and clear
    iterations
  - Meaningful scope within an application engineering team.
    Experience making or contributing to important technical
    tradeoff decisions with cross team implications
  - Experience developing high quality code leveraging modern AI
    tooling (ex: using Claude Code)
  - Growth mindset and a sense of humor. You welcome feedback
    and when you stumble you get back up. You adapt quickly in
    a fast-paced environment and you enjoy fostering an
    environment that prioritizes fun, learning, and growth

  Please note: Candidates must be located within a 75-minute
  commute of New York City and able to work 4 days a week out
  of our New York City office

  Benefits

  Charlie Health is pleased to offer comprehensive benefits to
  all full-time employees. Read more about our benefits here.

  Additional Information

  The total target base compensation for this role will be
  between $140,000 and $185,000 per year at the commencement
  of employment. Please note, pay will be determined on an
  individualized basis and will be impacted by location,
  experience, leveling, expertise, internal pay equity, and
  other relevant business considerations. Further, cash
  compensation is only part of the total compensation package,
  which, depending on the position, may include stock options
  and other Charlie Health-sponsored benefits.

