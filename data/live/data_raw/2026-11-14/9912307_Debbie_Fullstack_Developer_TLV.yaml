  Fullstack Developer @ Debbie (Tel Aviv)

  Looking for a motivated, fast-learning developer who wants
  to help build and scale an early-stage fintech product.

  🏅Who we are:

  Debbie is the first rewards platform for financial wellness,
  where users can earn cashback for paying off debt and
  saving. We partner with banks and credit unions to help them
  acquire new young consumers as well as engage their existing
  members. As featured in Forbes, American Banker, CNN and
  more.

  - We are a seed-stage company that has raised over $8m from
    leading VCs in the US.
  - We have 11 live bank customers and are growing quickly to
    onboard more
  - A team of 11 hustlers with deep industry experience
  - Today we have teams in NYC and Tel Aviv.
  - LinkedIn | Instagram | X | TikTok

  📆 Your typical day here:

  - You will work with an existing team of expert engineers to
    build a next-gen fintech platform Partner closely with our
    tech lead, product designer and 2 founders to define the
    technical requirements and implementation plan Brainstorm,
    architect, build and scale features, change real people’s
    lives and have fun doing it!

  💼 Qualities:

  - You are passionate about building next-gen consumer tech
    products
  - You hustle and are not afraid of responsibility
  - You enjoy learning and teaching new things
  - You enjoy getting constant love letters from users like 🔽

  🛠️ Requirements:

  - Minimum 4-5 years of industry experience
  - Experience or familiarity with React, TypeScript, and
    Node.js (NestJS is a plus!)
  - Basic knowledge of databases (SQL/PostgreSQL) and backend
    architecture
  - Willingness to learn about cloud services (AWS) and security
    best practices
  - Must be highly product-oriented (ie you should care about
    what you're building!)
  - Strong communication skills and a proactive mindset

  🛝 Benefits

  - Generous PTO / sick leave + mandatory PTO policy
  - Annual wellness stipend
  - And more!
