description: |
  At American Express, our culture is built on a 175-year
  history of innovation, shared values and Leadership
  Behaviors, and an unwavering commitment to back our
  customers, communities, and colleagues. As part of Team
  Amex, you'll experience this powerful backing with
  comprehensive support for your holistic well-being and many
  opportunities to learn new skills, develop as a leader, and
  grow your career.

  Here, your voice and ideas matter, your work makes an
  impact, and together, you will help us define the future of
  American Express.

  How will you make an impact in this role?

  American Express is looking for a hands-on Software Engineer
  in the Risk Decision Technologies (RDT) organization for the
  Data Engineering team. The RDT team is responsible for
  cross-domain, configurable platforms to enable best-in-class
  risk management and American Express growth with strong
  governance. The Data Engineering team is embarking on a
  journey to build Next-gen data platform to support critical
  Risk Business functions like payments authorization, new
  account fulfilment, credit collections and underwriting
  risk.

  Risk Data Management (RDM) platform is critical for
  Authorization Modernization Program (AMP) and powers the
  risk assessment engine with large volumes of data. The
  platform also includes cloud native applications to support
  low latency, scalable and modular architecture. This role of
  Senior Engineer will be an integral part of a team that
  designs and builds large-scale, cloud-native applications
  and drive us closer to the vision of a robust Risk data
  platform.

  As a Senior Java Software Engineer, you will:

  - Function as a member of an agile team and helps drive
    consistent development and test practices with respect to
    tools, common components, and documentation.
  - Have primary focus (80%+) on writing quality code, perform
    unit testing, test automation, quality assurance &
    automation testing in ongoing sprints.
  - Build new micro-services that help manages our rapidly
    growing data hub.
  - Improve efficiency, reliability, and scalability of our data
    pipelines.
  - Work on cross-functional initiatives and collaborate with
    Engineers across organizations.
  - Build CICD pipelines for continuous integration and
    delivery.
  - Build automation for application changes and deployment for
    faster time to market Develops deep understanding of tie-
    ins with other systems and platforms within the supported
    domains
  - Perform ongoing refactoring of code, quality assurance and
    testing, applying best practice methodologies and
    processes.
  - Identify opportunities to adopt innovative technologies &
    ideas in development / test area.
  - Provide continuous support for ongoing application
    availability
  - Collaborate/influence within and across teams to create
    successes with an innovative mindset and challenge the
    status quo.

  Minimum Qualifications:

  - Bachelor’s degree in computer science, Electronics, or other
    related field (or has equivalent work experience).
  - 10+ years of experience in software development and quality
    assurance.
  - 5+ years of experience in building large scale distributed
    applications with object-oriented design using backend
    Java related tech stack
  - Good knowledge of REST API development ,database
    technologies, Spring and Spring Boot.
  - Solid understanding of data structures and common
    algorithms.
  - Experience with Netty, gRPC, Junit and Oracle.
  - Good knowledge of REST API development and database
    technologies
  - Solid understanding of data structures and common
    algorithms.
  - Experience with Netty, gRPC, Junit and Oracle.
  - Experience with automated release management using Maven,
    Git

  Preferred Qualifications:

  - Proficient in identifying and applying software design
    patterns.
  - Looks proactively beyond the obvious for continuous
    improvement opportunities.
  - Willingness to learn new technologies and exploit them to
    their optimal potential.
  - Experience with Docker/Openshift based deployment

  Qualifications

  Salary Range: $123,000.00 to $215,250.00 annually + bonus +
  benefits

  The above represents the expected salary range for this job
  requisition. Ultimately, in determining your pay, we’ll
  consider your location, experience, and other job-related
  factors.

