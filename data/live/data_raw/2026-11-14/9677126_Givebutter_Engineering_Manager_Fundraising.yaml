description: |
  Company Description

  Givebutter is the most-loved nonprofit fundraising and CRM
  platform, empowering millions of changemakers to raise more,
  pay less, and give better. Nonprofits use Givebutter to
  replace multiple tools so they can launch fundraisers and
  events, use donation forms and donor management (CRM), send
  emails and text blasts—all in one place. Use of the
  Givebutter platform is completely free with a 100%
  transparent tip-or-fee model.

  Givebutter has been certified as a Great Place to Work®
  every year since 2021, and is the #1 rated nonprofit
  software company on G2 across multiple categories.

  Our mission is to empower the changemaker in all of us. We
  believe giving should be fun, so you’ll want to do it again,
  and we also believe that work should be fun, so that you’ll
  have the greatest impact. We are excited to hear from
  talented people who want to work with other talented people
  in making the world a butter place—and have fun along the
  way.

  Role Description

  Givebutter is hiring an Engineering Manager to oversee a
  full-stack engineering team and drive execution. You'll be
  directly responsible for delivering world-class fundraising
  features to our nonprofit users, maturing our engineering
  practices, and growing a team of skilled engineers.

  Engineering Managers at Givebutter are hands-on. You'll ship
  code, review PRs, make architectural decisions from a place
  of actual context, and stay close to production - monitoring
  systems, jumping into incidents, and understanding how your
  team's work actually behaves in the wild. We don't expect
  you to carry IC load like a senior engineer, but we do
  expect you to be in the editor regularly, pair when it helps
  the team, and prototype your way through ambiguity. If
  you've been completely out of the code for years and want to
  stay that way, this probably isn't the right fit. The
  managers who thrive here earn trust on both the people and
  technical sides.

  As an Engineering Manager, you will be directly responsible
  for delivering world-class software to our users, maturing
  our engineering practices, and growing & leading a team of
  skilled engineers. You will carry out our product vision
  while creating a scalable engineering culture that breeds
  innovation. You will ensure we deliver excellent user
  experiences on time and retain top-notch security, design,
  and performance.

  You will cultivate a culture of high performers by creating
  systems that eliminate roadblocks, processes that
  incentivize excellence, and by being an expert in all things
  React. We have already built a great foundation, powering
  hundreds of millions of donations to over 40k+
  organizations, and you will take this impact much further.

  Why join Givebutter's Engineering team?

  - Code Democracy – Every engineer has a voice. We value
    diverse perspectives and foster an environment for open
    discussion on architecture and technical ideas.
  - Autonomy & Focus – Our engineers enjoy flexibility with
    minimal meetings and uninterrupted time to dive deep into
    problem-solving.
  - Seamless CI/CD – Our deployment pipelines are fully
    automated, enabling engineers to focus on creating
    impactful code rather than managing deployments.
  - Mission-Driven Work – You’ll be part of a team that supports
    nonprofits, charities, and organizations making a real
    difference around the world.

  What You’ll Bring to the Team

  - An execution mindset with a strong bias toward delivering
    and iterating
  - A product-oriented approach with a keen eye for consistency
    and user impact
  - A passion for leadership and the ability to scale
    engineering practices in a high-growth environment
  - Expertise in React and a readiness to work alongside the
    team, leading by example in the codebase

  Responsibilities

  - Collaborate with the VP of Engineering to develop and
    execute the frontend engineering strategy
  - Lead, manage, and mentor a talented team of full-stack
    engineers, driving the development of beautiful and
    delightful user experiences
  - Own the frontend function, setting the technical direction,
    and ensuring alignment with company objectives
  - Bring technical expertise to the evolution of Givebutter’s
    software; ensure architecture and stack are optimized for
    growth
  - Improve internal engineering workflows, continually refining
    best practices
  - Champion code quality across the team and uphold a high
    standard for maintainable and scalable solutions
  - A passion for building beautiful, user-friendly, and
    accessible web applications
  - Evaluate and apply AI and machine learning tools – such as
    LLMs, recommendation systems, or predictive analytics – to
    drive innovation in product development

  Requirements

  - 7+ years of experience in frontend development with
    expertise in modern web technologies (e.g., React, React
    Native, JavaScript, TypeScript, PHP/Laravel)
  - At least 2+ years of experience managing a team of 5+
    engineers
  - Hands-on experience designing and building scalable, high-
    quality customer-facing software
  - Proven experience in people management, mentorship, and
    clear communication
  - Demonstrated success in hiring and developing remote
    engineering teams
  - Experience in a product-led growth environment is a strong
    plus

  More about Givebutter

  Benefits

  - Remote Work: Work remotely from one of our 10 hubs (Austin,
    Denver, Indianapolis, Los Angeles, San Francisco, New
    York, Salt Lake City, Minneapolis, Seattle, and
    Nashville).
  - Health Insurance: We offer Medical, Dental, and Vision
    insurance covered 100% for employees as well as HSA and
    FSA accounts.
  - Dependent Care Coverage: We offer coverage for dependents,
    with 50% of Medical, Dental, and Vision premiums covered
    for all eligible dependents.
  - Mental Health: Givebutter health insurance plans come with
    access to a TalkSpace membership.
  - 401k: We offer a 3% 401k match for all eligible employee's.
  - Vacation and Holidays: Givebutter offers a Flexible PTO
    policy with uncapped vacation days and company-recognized
    holidays.
  - Wellness Week: Givebutter closes for one week each summer to
    prioritize rest and recharge for the entire team.
  - Parental Leave: We offer 12 weeks of paid leave for all
    parents and comprehensive leave planning management
    through Aidora.
  - Family Care Support: Access a company-paid UrbanSitter
    membership plus care credits to book trusted, background-
    checked caregivers for childcare, senior care, pet care,
    and household support when you need it most.
  - Home Office Stipend: Upgrade your home office with company-
    sponsored expenses, including high-quality laptops,
    monitors, and modern technology.
  - Coworking Stipend: Enjoy a monthly stipend that gives you
    the freedom to work from coworking spaces or cafés
    whenever you need connection, community, or a change of
    scenery.
  - Charitable Giving: Employees are encouraged to donate up to
    $50/month to any verified nonprofit they wish to support
    on Givebutter.
  - Professional Development: We offer learning and development
    reimbursement opportunities.
  - Love What You Do: We are a mission-driven company serving
    the charitable sector. Feel good about the work you're
    doing and the company you work for.

  Interview Process

  Below is a high-level outline of our standard interview
  process

  - Recruiter Screen: A 30-minute conversation to learn more
    about your background, walk through the role, and ensure
    mutual alignment on expectations, values, and logistics.
  - Hiring Manager Interview: A deeper dive into your relevant
    experience, skillset, and working style. This is your
    first opportunity to connect directly with the person who
    may be your future manager.
  - Assessment (technical or non-technical): This stage will
    vary based on the role. It could involve a live coding
    session, case study, or take-home project. Some roles may
    include two parts to this stage to evaluate both practical
    skills and problem-solving approaches
  - Values Interview: A conversation with team members focused
    on how you align with our core values and leadership
    principles.
  - References: We connect with a few folks you’ve worked
    closely with to get a better picture of your working style
    and impact.
  - Offer: If all goes well, we’ll move to the offer stage!

  Please note, we will have an AI note-taking tool join most
  of our interviews.

  Hi potential new butterslice! A recent study from LinkedIn
  showed that most women apply to jobs only when they meet
  100% of the requirements, whereas men will hit the apply
  button if they hit 60%. Givebutter is committed to building
  a diverse and inclusive team. So to the women and nonbinary
  folks out there feeling unsure if you're a perfect fit, we
  strongly encourage you to apply!
