description: |
  Location: London or Ipswich, UK (Hybrid) Employment Type:
  Permanent, Full-Time

  About Mach:

  MACH is Delta Capita's proprietary Distributed Ledger
  Technology (DLT) and workflow orchestration platform,
  developed to help financial institutions modernise post-
  trade, collateral, regulatory and operational processes. As
  part of Delta Capita's Technology & Solutions business, MACH
  combines blockchain, workflow automation and enterprise
  integration capabilities to deliver scalable solutions to
  global financial services clients.

  Job Description:

  As a Full Stack Javascript Developer at MACH, you will play
  a leading role in developing innovative blockchain and DLT
  solutions for financial services clients. You will be
  responsible for architecting systems from frontend, backend
  and database, optimising performance, and mentoring junior
  developers while ensuring that MACH’s technology offerings
  deliver exceptional user experiences. This role requires
  deep expertise in frontend frameworks, Node.js backend
  libraries, API integrations, and UX best practices.



  Responsibilities include;

  - Architect, develop responsive, high-quality web applications
    primarily using React and Typescript combined with backend
    Node.js Typescript experience.
  - Lead the design and development of scalable, high-
    performance web applications.
  - Implement best practices in security, accessibility, and
    performance.
  - Develop reusable software components and libraries to
    improve efficiency.
  - Conduct thorough code reviews, testing, and debugging to
    maintain high-quality standards.
  - Staying abreast of emerging trends in software development
    and blockchain technologies.
  - Provide technical leadership and mentorship to junior
    developers.
  - Collaborate with product managers, UX designers and other
    teams to refine application usability.
  - Enhance software development processes, including tooling,
    CI/CD pipelines and testing.



  As an experienced Full Stack Developer, you will have:

  - Proven experience in software development ideally in React
    and backend frameworks such as Express/NestJS.
  - Strong expertise in JavaScript, Node.js, TypeScript, HTML5,
    CSS3, and responsive design.
  - Knowledge of SQL and database design using RDBMS, such as
    PostgreSQL.
  - Proven experience developing RESTful APIs.
  - Familiarity with frontend state management solutions e.g.
    Redux.
  - Experience working with Git, CI/CD pipelines, and testing
    frameworks.
  - Experience in containerisation systems e.g. Docker and/or
    Kubernetes
  - Strong understanding of software performance optimisation
    techniques.
  - Ability to lead technical discussions, mentor junior
    developers, and drive best practices.
  - Excellent problem-solving skills and ability to troubleshoot
    complex software issues.
  - Strong collaboration and communication skills.

  Desirable

  - Hands-on experience or knowledge of blockchain technologies
    (e.g. Ethereum, Algorand, Hedera).
  - Familiarity with Agile methodologies and best practices.
  - Experience using cloud services, especially AWS.
  - Knowledge of Kubernetes tooling, particularly Helm.

  How We Work:

  Delta Capita is an equal opportunity employer. We positively
  encourage applications from suitably qualified and eligible
  candidates regardless of age, colour, disability, national
  origin, ancestry, race, religion, gender, sexual
  orientation, gender identity and/or expression, veteran
  status, genetic information, or any other status protected
  by applicable law.

  We will ensure that individuals with disabilities are
  provided reasonable accommodation to participate in the job
  application or interview process, to perform essential job
  functions, and to receive other benefits and privileges of
  employment. If you require any reasonable adjustments
  through your interview process, please inform us.

  This is a permanent full-time position. As the selection and
  interview process is ongoing, please submit your application
  in English as soon as possible, if your profile is selected,
  a member of our team will contact you within 4 weeks.



  Who We Are:

  Delta Capita Group (a member of the Prytek Group) is a
  global managed services, consulting, and solutions provider
  with a unique combination of experience in Financial
  Services and technology innovation capability. Our mission
  is to reinvent the financial services value chain providing
  technology based mutualized services for financial
  institutions for non-differentiating services.
