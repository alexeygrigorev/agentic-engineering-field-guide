description: |
  About Fay

  At Fay, our mission is to make nutrition a foundational
  pillar of preventative care, improving outcomes,
  accessibility, and affordability at scale. We're building
  AI-powered infrastructure to transform preventative
  healthcare. Think that's bold? We're just getting started.

  Today, Fay is a three-sided marketplace connecting
  providers, patients, and payers to revolutionize
  preventative care delivery. Our b2b2c business-in-a-box
  solution empowers dietitians to deliver high-quality,
  affordable nutrition care, helps patients take control of
  their health, and enables payers to build healthier member
  populations. Nutrition is our starting point, not the finish
  line. The platform we're building will expand into new areas
  of preventative health and wellness as we grow.

  We're proud to be one of the fastest-growing companies in
  healthtech, backed by category-defining investors like
  General Catalyst, Forerunner, 1984, and Goldman Sachs.

  Ready to leverage AI-driven technology to transform
  preventative care and make a real-world impact on health?
  Let's talk.

  About this Role

  This role offers what many ambitious engineers are looking
  for:

  - 🌟 Top-tier teammates: We have an unusually talented and
    accomplished team of engineers who’ve held lead, staff,
    principal and director level roles in past jobs.
  - 🧑‍💻 A builder-centric culture: We’re a fast-moving team with
    high standards, supported by thoughtful processes that
    keep things running smoothly without getting in the way.
  - ⚒️ Modern tools & best practices: We use the best tool for
    the job at hand, and we’ve leaned into AI-driven
    development in all of the places it’s proven to be most
    effective.
  - 🤝 A tight-knit, high-output team: We’re a total of nine
    backend/full-stack engineers who collaborate closely, move
    quickly and have an unreasonable amount of fun together.
  - 🤲 An ever-important mission: We’re here to deliver high
    quality, convenient and affordable care to the hundreds of
    millions of Americans who need it.

  Our software platform is well established and our user base
  is already quite large, but we’re still in the very early
  innings of building the world’s hub for healthy living. It
  will take more world-class engineers to bring our ambitious
  vision for Fay to life, and that’s why we’re hiring!



  What You'll be Doing:

  - Building features end-to-end: All engineers lead projects
    and take ownership of their delivery and impact.
  - Contributing to the underlying platform: We all pitch in to
    keep the platform stable and the developer experience
    smooth.
  - Supporting engineering teammates: We have lively engineering
    Slack channels and huddles where we run ideas by each
    other and problem-solve together.
  - Teaming up with product & design: Every project is a team
    effort between engineering, product and design, and
    everyone involved pushes for the best outcome.
  - Maintaining a high standard: We have a culture of doing
    things thoughtfully and doing them right, which comes with
    a commitment to uphold team best practices.
  - Making the product your baby: We jump in to prototype our
    new feature ideas, remove developer pain points and fix
    nagging UI blemishes — all because we care about making
    things great!



  Your Skills & Experience:

  - Backend or full-stack — the more of a generalist, the better
  - At least two years of professional experience and no
    experience cap — we’re hiring across all levels of
    seniority
  - Enough familiarity with Python and TypeScript+React to
    confidently make code contributions on day one
  - Clear communication and an eagerness to collaborate
    effectively across engineering, product and design
  - Experience building user-facing products, with an eye for
    detail and a sense of what makes software feel intuitive
    and polished
  - Comfort working in fast-paced, dynamic startup environments
  - Strong ownership mindset: you care about the outcome, not
    just your piece of the implementation

  The best companies are made of the best people. There’s no
  shortage of work ahead, but we stay balanced and look
  forward to celebrating our wins as a team.

  See our careers page here to learn more about working on our
  team.

  Compensation Range

  $185,000—$250,000 USD

  Fay is an equal opportunity employer. We celebrate diversity
  and are committed to creating an inclusive environment for
  all employees.
