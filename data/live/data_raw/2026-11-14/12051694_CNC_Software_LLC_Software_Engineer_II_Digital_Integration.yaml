description: |
  Your Role at a Glance

  The Software Engineer II designs, develops, and supports
  Salesforce and MuleSoft solutions, leveraging API-led
  integrations to connect enterprise systems, streamline
  business processes, and drive digital transformation.

   How You’ll Drive Success

  Software Development & Enhancement

  - Design, develop, and test software to resolve defects and
    implement user stories.
  - Continuously work to develop a deep expertise in Mastercam’s
    critical business processes.
  - Proactively coordinate with other engineers to decide how
    best to implement requested changes.
  - Evaluate and recommend tools, technologies, and processes
    for software development.

  Agile Planning & Collaboration

  - Proactively work with the team in writing, correctly sizing,
    and accurately detailing and breaking down stories and
    defects.

  System Performance & Maintenance

  - Monitor system performance, conduct regular audits, and
    implement necessary updates to maintain optimal
    functionality.

  Technical Leadership & knowledge Sharing

  - Conduct code and/or technical reviews, sharing experiences
    and knowledge with others as appropriate.
  - Performs other duties as assigned.

   The Talents We’re Seeking

  - Bachelor’s Degree or higher in Computer Science,
    Mathematics, or Engineering, or equivalent experience.
  - 4 - 5 years of experience designing, developing, and
    supporting enterprise integrations and APIs using MuleSoft
    and Salesforce platforms.
  - Proficiency with MuleSoft Anypoint Platform, including API
    design, implementation, orchestration, monitoring, and
    troubleshooting.
  - Experience with Salesforce development technologies,
    including Apex, Lightning Web Components (LWC), and
    Salesforce APIs.
  - Experience creating and maintaining OpenAPI specifications
    and interactive API documentation using Swagger and
    Scalar, ensuring clear, standardized, and developer-
    friendly integration contracts across enterprise systems.
  - Strong understanding of system architecture, data modeling,
    and scalable integration patterns.
  - Experience with modern software development practices,
    including source control, CI/CD pipelines, code reviews,
    and automated testing.
  - Experience working within Agile development teams and
    delivering integration solutions in iterative release
    cycles.
  - Experience with Salesforce Sales Cloud, Service Cloud,
    Revenue Cloud/CPQ, and related ecosystem integrations.
  - Mulesoft and/or Salesforce certification(s) a plus.
  - Above average communication skills, both written and verbal,
    with the ability to provide accurate and timely
    information in a succinct and easy to understand manner.
  - Proven time management skills and a track record of working
    in a team environment successfully supporting others.
  - Well-organized, attention to detail and able to multi-task.

   Who We Are

  At Mastercam, we do not just keep pace with manufacturing—we
  set the pace. For over 40 years, we have been the name
  behind the breakthroughs, the partner for those who refuse
  to settle. When the industry says “too complex,” we say,
  “challenge accepted.”

  We are more than software. We are a movement of makers,
  innovators, and problem-solvers driving transformation
  across the globe.

  Backed by a network of 400 Channel Partners and a thriving
  developer community, Mastercam delivers the tools and
  expertise to turn ambitious ideas into flawless reality.
  From aerospace to automotive, medical to education, we
  empower manufacturers to push boundaries and redefine what
  is possible.

  As part of Intelligent Manufacturing and the Sandvik Group,
  we are leading the charge in digital transformation. Our
  team of 500+ professionals is united by a single mission: to
  help achieve precision, productivity, and performance
  without compromise.

  Our Core Values? They are not just words. They are how we
  win:

  - Winning Together: Collaboration is not optional—it is the
    engine that drives us.
  - Curiosity: We question, we explore, we innovate. Every day.
  - Responsibility: Safety, integrity, and sustainability aren’t
    boxes to check—they are the foundation of trust.
  - Customer-Focused: We listen. We adapt. We deliver. Always.

  Innovation. Collaboration. Growth. That is the Mastercam
  way. Explore more at www.mastercam.com, connect on LinkedIn,
  and join the conversation with #mastercam.

  The next big challenge is waiting—are you ready to accept?

