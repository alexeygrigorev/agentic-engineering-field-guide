description: |
  The Sarnova Family of companies includes Digitech Computer,
  Bound Tree Medical, Tri-anim Health Services and Cardio
  Partners.



  Digitech is a leading provider of advanced billing and
  technology services to the EMS transport industry. Since its
  founding in 1984, Digitech has refined its software platform
  to create a cloud-based billing and business intelligence
  solution that monitors and automates the entire EMS revenue
  lifecycle. Digitech leverages its proprietary technology to
  offer fully outsourced services that maximize collections,
  protect compliance, and deliver results for clients.



  Summary:



  The Software Engineer works closely with our development
  team and company leaders to deliver high-quality software to
  our users, using the latest and best coding strategies and
  practices.  As part of a small development team, the
  individual in this role will participate in program/site
  related development and user experience decisions and is
  expected to use their skills and experience to create
  innovative solutions.



  Essential Duties and Responsibilities:



  - Develop, test, and maintain software using established
    programming languages, technical standards, and
    development methodologies
  - Test, analyze, and debug solutions across development,
    testing, and production environments
  - Provide production support to ensure applications operate
    reliably by proactively identifying issues and
    implementing effective solutions
  - Develop Proofs of Concept to evaluate the feasibility and
    viability of proposed technical approaches
  - Evaluate, recommend, and adopt new technologies that enhance
    product development, performance, and user experience
  - Collaborate closely with developers, designers, and business
    stakeholders to ensure solutions align with functional and
    user requirements
  - Clearly present and justify technical decisions using sound
    engineering judgment and fundamental programming
    principles
  - Stay current with emerging technologies, tools, and industry
    trends
  - Promote high‑quality user experiences and adherence to
    development best practices
  - Contribute to individual, departmental, and organizational
    initiatives as needed
  - Additional job duties as assigned



  Skills/Experience Required:



  - Education: Bachelor's Degree in computer science, software
    engineering or related field is strongly preferred; High
    School Diploma and equivalent experience will be
    considered
  - 1-3 years of full-stack development experience preferred
  - Proficiency in either C#/SQL Server or Java/MySQL Server
    required; other languages are beneficial
  - Experience in usability/interface design
  - Familiarity with advanced SQL queries preferred
  - Healthcare experience a plus
  - Demonstrated strong attention to detail and delivering a
    high quality product the first time.
  - Effective communication skills (verbal and written)
  - Exceptional time management, organization, and planning
    skills with proven track record of managing multiple
    projects simultaneously, prioritizing key initiatives and
    hitting deadlines
  - Demonstrated ability to build relationships and work
    effectively with employees within and across departments
  - Highly self-motivated with a sense of urgency, bias for
    action and anticipatory qualities
  - Curious, driven to achieve and willingness to challenge the
    status quo
  - A desire to continually learn and grow in your career
  - Ability to independently manage all aspects of the job role
    including required goals and business practices in a
    remote environment



  Sarnova is an Equal Opportunity Employer. We offer a
  competitive salary, commensurate with experience, along with
  a comprehensive benefits package, including 401(k) Plan.
  EO/M/F/Veterans/Disabled. Our mission is to be the best
  partner for those who save and improve patients’ lives.
  Excellence in delivering upon our mission is dependent upon
  having a diverse team that is empowered to bring their full,
  authentic self to work each day.  We strive to create a
  workplace that reflects the communities we serve, and we are
  passionate about creating an inclusive workplace that
  promotes and values diversity.



