description: |
  About Vantage

  Vantage powers, cools, protects and connects the technology
  of the world’s well-known hyperscalers, cloud providers and
  large enterprises. Developing and operating across North
  America, EMEA and Asia Pacific, Vantage has evolved data
  center design in innovative ways to deliver dramatic gains
  in reliability, efficiency and sustainability in flexible
  environments that can scale as quickly as the market
  demands.

  Location Flexibility: We are open to candidates based in and
  around any of our Vantage locations across the EMEA region.

  Operations Engineering Department



  The Infrastructure Operations Engineering team provides the
  technical leadership and engineering expertise required to
  ensure our critical infrastructure is safe, resilient,
  reliable and operationally effective. Bringing together
  multidisciplinary expertise across Electrical, Mechanical,
  Controls and Permitting, the team supports the full asset
  lifecycle, from design and construction through
  commissioning, operational handover and ongoing site
  support. Working closely with Design, Delivery, Site
  Operations, Customer Experience, Procurement and global
  engineering teams, the team will drive consistent
  engineering standards and technical strategies across the
  operating fleet.

  The Operations Engineering Team is responsible for the
  overall health of critical systems across Vantage global
  operational facilities.  For each of the major systems
  Electrical, Mechanical, and Controls, the Operations
  Engineering team is responsible for ensuring success in the
  commissioning stages of new construction, evaluating and
  improving the reliability and performance of existing
  critical infrastructure, sustaining equipment operational
  availability through maintenance programming, providing
  technical support to the Site Operations Teams, and
  providing systems reliability and maintainability feedback
  to the Design Engineering teams for future design
  considerations.





  Position Description



  The Manager, Electrical Engineering is responsible for
  leading the execution of primary Operations Electrical
  Engineering Program objectives. The Manager is required to
  effectively coordinate Subject Matter Experts in balancing
  workload demands both within the Operations Engineering team
  and cross functionally to ensure critical system health.
  This responsibility includes Site Operations technical
  support, critical change management support, oversight of
  facility acceptance testing, critical system maintenance
  planning, remediation / retrofit projects and ensuring
  reliable system operations are sustained for the life of the
  facility. Requirements for this position include thorough
  understanding of critical electrical systems arrangements,
  potential system failures and extended effects of those
  failures, and appropriate failure response actions.  Also
  required is an understanding of data center design theory,
  equipment sequence of operation, and an ability to identify
  likely failure points in design. This position interfaces
  with peer Operations Engineering Teams in other geographies
  to ensure global alignment of Vantage’s processes worldwide.



  Essential Job Functions



  - Oversee and support continuous development of facility
    acceptance testing, remediation / retrofit projects, site
    asset performance, maintenance programming, and Site
    Operations best practices.

  - Serve as team leader for internal workload management,
    planning projects, and aligning Subject Matter Experts
    with site specific work demands.

  - Develop and provide status reports on health of systems,
    progress on team objectives, and Key Performance
    Indicators.

  - Thoroughly understand electrical, mechanical, and controls,
    systems and provide at request technical guidance to Site
    Operations Leads.

  - Ensure critical systems remain fully available for
    facilities across the EMEA region.



  Duties



  - Work with cross functionally with technical teams including
    Design Engineering and Construction teams to ensure the
    reliability and maintainability of new and modified
    installations.

  - Provide at request guidance and technical support to
    facility operators for issues that occur at our data
    centres.

  - Review construction equipment submittals, identify potential
    deficiencies, and evaluate maintenance feasibility.

  - Review commissioning plans and ensure the thoroughness of
    startup testing.

  - Facilitate the transition of commissioned spaces to site
    operations and coordinate acceptance of the facility.

  - Develop risk management plans that will anticipate
    reliability-related risks that could adversely impact
    plant operation.

  - Work with Site Operations to perform analyses of asset
    utilisation, overall equipment effectiveness, capacity
    planning and remaining useful life.

  - Prioritize work orders, and identify resources, and ensure
    ample supplies required to complete tasks.

  - Oversee site mitigation and system upgrade projects and/or
    collaborate with adjacent teams where design engineering
    and construction expertise is required.

  - Coordinate vendor activity and manage resources outside of
    the core team with consideration to budget where such
    additional resources are required.

  - Maintain site technical libraries, ensure drawings are up to
    date, and ensure site operations teams are well supported
    from a technical standpoint.

  - Ensure Site Teams are proficient system operation and
    maintenance techniques.

  - Oversee Root-Cause Failure Analysis and facilitation of
    corrective action.

  - Design maintenance programs to minimize maintenance
    complexity and reduce maintenance down time.

  - Validate maintenance performance by analysing trends,
    operational history, and maintenance data.

  - Oversee and approve appropriate site response procedures
    based on potential critical system failures.

  - Support the continuous development of critical training for
    Site Operations teams.

  - Lead complex electrical engineering programs / projects
    being completed by the Operations Engineering team.



  Job Requirements



  - Bachelor’s degree in engineering or related field, or
    equivalent work experience required

  - 5+ years of direct managerial experience and interpersonal
    skills

  - 10+ years of experience in facilities operations or
    maintenance engineering with expertise in mechanical,
    electrical, and controls systems.

  - Knowledge of key industry standards, building codes and
    safety standards within our operating regions.

  - Excellent time management and organizational skills and the
    ability to define these areas for other teams and team
    members.

  - Abiltiy to communicate complex Electrical Engineering issues
    to suitable audiences.

  - Ability to create teams from various departments and work in
    a high-level collaborative environment while promoting a
    teamwork mentality.

  - Ability to travel up to 25% of total work time.

  - Ability to travel internationally.

  #LI-AH1

