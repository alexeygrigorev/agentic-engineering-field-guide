description: |
  Software Engineer

  $200k – $260k • meaningful equity

  About Novig

  Novig is building America's #1 sports prediction market. Our
  mission is to financialize and democratize sports trading -
  taking a closed system run by casinos and turning it into a
  fair, efficient, two-sided market where the power sits with
  users.

  With Novig recently becoming a CFTC-designated market — the
  fastest designation of its kind in US history— we're
  bringing the prediction market built for sports fans
  nationwide.

  We're backed by some of Silicon Valley's top investors —
  Pantera, Forerunner, Lux, NFX, Paul Graham, and Joe Montana
  — who have collectively invested over $100M behind this
  vision.

  About the Role

  The infrastructure behind sports trading is broken and this
  role gives you the opportunity to fix it. Working across the
  stack, you'll borrow from the world of modern financial
  exchanges to build markets that are actually transparent and
  efficient, while keeping the experience seamless for the
  people using it. You'll own real-time data pipelines, shape
  the API that algorithmic traders live in, and have a real
  say in architecture decisions. One day you're deep in
  systems-level code, the next you're shipping a frontend
  component with Design. If sports, markets, and genuinely
  hard engineering problems get you out of bed in the morning,
  read on.

  Who you are and what you will do

  - Excited to work across the full stack to build the next
    generation of sports betting infrastructure
  - Apply technologies used in modern financial exchanges to
    enforce transparent, efficient market practices while
    delivering a seamless user experience
  - Play a key role shaping both the market engine and the
    interface through which users engage with it
  - Build and maintain a developer-first API experience for
    algorithmic trading and power users
  - Expand product features by extending modular backend
    services and contributing to frontend components
  - Scale real-time data ingestion, processing, and distribution
    pipelines
  - Collaborate closely with Design and Product teams to build
    performant, intuitive user interfaces
  - Contribute to architecture and system design decisions
    across the stack
  - Improve observability and reliability across backend and
    frontend systems
  - Bring a passion for sports, markets, and technology, with
    curiosity about complex computer science challenges
  - Hold a Bachelor’s or Master’s degree in Computer Science or
    a related technical field
  - Proficient in a systems programming language (e.g., Rust,
    Go, C++) and at least one modern frontend framework (e.g.,
    React, Vue)
  - Experienced developing distributed systems with cloud-based
    architecture
  - Strong product intuition with the ability to translate
    business needs into technical solutions
  - Communicate clearly, solve problems effectively, and thrive
    both independently and in fast-moving, cross-functional
    teams

  Why work here, in the words of the people who do

  “I work with extremely stellar people, I own real systems,
  and decisions happen fast. No politics, no waiting for
  needless red tape. If something's broken, I fix it. If I
  build something good, it ships.”

  “The people! So smart, thoughtful, fun to work with,
  passionate about their craft, etc”

  “I'm having the most fun I've had in my entire career.”

  If you want responsibility, trust, and the chance to help
  build the future of sports prediction markets - take your
  shot, we’d love to connect.

  Not for everyone

  - Our work is tied to live sports - that means potential
    nights, weekends, and pressure included.
  - If you need clear swim lanes, a heavy process, or someone to
    tell you what to do, this won’t be the right environment.

  Compensation & benefits

  - $200k – $260k base, benchmarked at top-tier tech companies
  - Meaningful equity for every employee, regardless of role

  - 100% health premiums covered
  - 99% dental & vision covered
  - 401(k) with 4% company match
  - HSA + $1,080 annual company contribution
  - $27/day lunch stipend when working from our NYC office
  - $35/day dinner stipend when working from the NYC office
    after 6:30pm

  Homebase

  Union Square, NYC
