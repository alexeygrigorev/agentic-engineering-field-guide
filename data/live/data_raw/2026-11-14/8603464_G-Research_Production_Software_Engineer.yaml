description: |
  We tackle the most complex problems in quantitative finance,
  by bringing scientific clarity to financial complexity.

  From our London HQ, we unite world-class researchers and
  engineers in an environment that values deep exploration and
  methodical execution - because the best ideas take time to
  evolve.  Together we’re building a world-class platform to
  amplify our teams’ most powerful ideas.

  As part of our engineering team, you’ll shape the platforms
  and tools that drive high-impact research - designing
  systems that scale, accelerate discovery and support
  innovation across the firm.

  Take the next step in your career.

  The role

  We are hiring Software Engineers to join our Trade
  Technology function, where we design, build and maintain our
  globally distributed trading system.

  You will design and implement the systems, tooling and
  workflows that ensure the distributed platform is robust,
  observable and engineered for speed and safety. This
  includes owning the engineering infrastructure that supports
  deployment automation, real-time diagnostics and fault-
  tolerant operations.

  Engineering underpins our continued growth and success, and
  we are committed to hiring and developing the world’s best
  Software Engineers.

  Key responsibilities of the role include:

  - Designing, building and evolving production-grade trading
    platforms and services end-to-end
  - Optimising software performance, throughput and efficiency
    at scale
  - Contributing to the reliability and operational excellence
    of critical systems, including participation in production
    support rotations
  - Applying strong software engineering practices across
    testing, code quality, automation and observability
  - Participating in a shared production support rotation,
    responding to incidents, troubleshooting runtime issues
    and driving improvements

  Who are we looking for?

  The ideal candidate will have the following skills and
  experience:

  - Strong background in software engineering, ideally in
    distributed, real-time systems
  - Experience in at least one typed language, such as Java,
    Kotlin, C#, C++ or Rust
  - Experience with containerisation and orchestration
    technologies, such as Kubernetes, in production
    environments
  - A passion for developing robust, maintainable software,
    that's well monitored in production

  Above all, we value clean, maintainable code, sound
  engineering judgement and a business-value mindset over
  specific toolkits.



  Why should you apply?

  - Highly competitive compensation plus annual discretionary
    bonus
  - Lunch provided (via Just Eat for Business) and dedicated
    barista bar
  - 30 days’ annual leave
  - 9% company pension contributions
  - Informal dress code and excellent work/life balance
  - Comprehensive healthcare and life assurance
  - Cycle-to-work scheme
  - Monthly company events

  G-Research is committed to cultivating and preserving an
  inclusive work environment. We are an ideas-driven business
  and we place great value on diversity of experience and
  opinions.

  We want to ensure that applicants receive a recruitment
  experience that enables them to perform at their best. If
  you have a disability or special need that requires
  accommodation please let us know in the relevant section
