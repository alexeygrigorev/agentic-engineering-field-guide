description: |
  We are looking for a skilled and experienced Sr. Java
  Developer to join our client’s development team. The ideal
  candidate will possess robust technical expertise in Java-
  based applications, RESTful services, and modern frontend
  frameworks like Angular, with proficiency in cloud platforms
  and agile methodologies.

  Responsibilities:

  - Develop, test, and implement high-quality Java applications.
  - Design and implement RESTful services using Java and Spring
    Boot.
  - Develop front-end applications using Angular 8+ and state
    management with NgRx.
  - Deploy and manage applications on cloud platforms such as
    Kubernetes, GCP, Azure, etc.
  - Practice Test Driven Development (TDD) across frontend and
    backend components.
  - Participate actively in agile practices (Scrum, Kanban).
  - Collaborate closely with cross-functional teams, including
    business analysts, QA engineers, and DevOps.
  - Utilize CI/CD tools such as Jenkins for continuous
    integration and deployment.
  - Maintain and interact with databases, including Oracle and
    PostgreSQL.
  - Provide mentorship and guidance to junior and mid-level
    engineering resources.
  - Lead technical initiatives and projects independently,
    ensuring timely delivery and quality.

  Required Qualifications:

  - 8+ years of overall IT experience.
  - 2+ years of hands-on experience with Angular 8+ and NgRx.
  - 4+ years of experience implementing REST services with Java
    and Spring Boot.
  - Demonstrated experience deploying applications to cloud
    platforms.
  - Proficiency with Test Driven Development (TDD)
    methodologies.
  - Experience with agile development methodologies.
  - Strong written and verbal communication skills.
  - Experience with CI/CD processes and tools, particularly
    Jenkins.
  - Familiarity with databases like Oracle and PostgreSQL.
  - Ability to lead feature track independently.
  - Proficiency with software release management tools (JIRA,
    Rally).

  Additional Information:

  - Experience listed without a specific Angular version will
    default to AngularJS and is not considered valid for this
    role.
