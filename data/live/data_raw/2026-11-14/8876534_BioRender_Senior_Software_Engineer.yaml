description: |
  At BioRender, we are accelerating the world’s ability to
  discover, learn, and communicate science faster through
  visuals. Today, BioRender empowers millions of scientists to
  create beautiful, accurate biological figures for
  communication within pharma companies and academic research.

  Our vision is to make BioRender the place where humans read
  biology—translating human and AI-generated data into
  scientifically accurate, human-understandable visuals. As AI
  automates large parts of research, BioRender will transform
  complex data, experimental results, and text inputs into
  clear, intuitive visuals that scientists, decision-makers,
  and broader audiences can quickly interpret. Visual
  communication will be critical to accelerating breakthroughs
  across academia and industry, and BioRender will bridge the
  gap between specialized knowledge domains.

  What you'll be doing:

  - Collaborate Across Teams: Work side-by-side with product
    managers, designers, and data scientists to shape a
    roadmap that empowers scientific leaders to collaborate
    safely and effectively together.
  - Own and Improve: Take end-to-end ownership of key components
    of our codebase, ensuring that features are robust,
    secure, scalable, and maintainable.
  - Drive Creative Problem-Solving: Embrace ambiguity,
    experiment boldly, and develop creative solutions that
    push the boundaries of what our product can do.
  - Collaborate cross-functionally: Work closely with designers,
    product managers, and other product engineers to deliver
    high-quality experiences.
  - Uphold engineering excellence: Write testable, well-
    documented code; participate in code reviews and design
    critiques; and help evolve best practices.
  - Elevate team impact: Bring thoughtful technical insights and
    a growth mindset to help us continuously improve as a
    team.

  Our ideal fit brings:

  - User Focused & Impact Driven: You prioritize delivering real
    value to users, thoughtfully balancing quality, speed, and
    the company’s broader goals
  - AI Passion: You’re genuinely curious about AI, continuously
    explore emerging tools, and love applying them in real-
    world projects.
  - Tech Expertise: Proficient in modern JavaScript frameworks
    (e.g., ReactJS), NodeJS/ExpressJS, cloud infrastructure
    (e.g., AWS). Experience with MongoDB/NoSQL databases for
    efficient data management
  - Strong Communicator & Collaborator: You thrive in a
    collaborative environment, working closely with others
    across disciplines to achieve shared objectives.
  - Crafting Quality User Experiences: You work closely with
    design and product to craft delightful user interfaces,
    leveraging the web platform and using UI frameworks such
    as React.
  - Builder Mentality: With 7+ years of full-stack development
    experience, you’ve built products from concept to
    production and are eager to prototype and iterate quickly.

  Nice to haves:

  - Background in science with an analytical and data-driven
    approach to problem-solving.
  - Passionate mentor with experience guiding and supporting
    team members.
  - Experience with observability and metrics-driven design,
    utilizing tools like Datadog.
  - Enterprise development experience, building scalable and
    robust systems in a complex environment.
  - Experience with AWS and Terraform for cloud infrastructure
    and automation.

  You could be working on problems like:

  - Scaling a highly interactive web application: Build and
    optimize performance for our complex, graphics-heavy
    canvas, ensuring a smooth and responsive experience.
  - Managing and visualizing large volumes of data: Work with
    rich scientific and usage data to enable insights, improve
    performance, and support new AI-driven features.
  - Evolving a distributed architecture: Design, build, and
    maintain systems across multiple backend and frontend
    services, ensuring reliability, scalability, and security
    as we grow.
  - Delivering delightful user experiences: Collaborate with
    design and product teams to craft intuitive interfaces
    that make advanced scientific visualization accessible to
    everyone.
  - Bridging human and AI collaboration: Help shape the next
    generation of tools that translate complex scientific
    research into human-understandable visuals using AI.
  - Building the next generation of BioRender products:
    Contribute to a growing suite of tools—including our
    Editor, Graphing, and Presentations products - that
    empower scientists to communicate and collaborate more
    effectively than ever before.

  Why join us?

  - We are mission-driven: we work collaboratively towards our
    shared vision of improving scientific communication and
    accelerating scientific discovery. BioRender figures have
    appeared in more than 54,000 publications!
  - BioRender is loved by millions! We have a world-class NPS
    and a community of loyal fans and users in 200+ countries!
  - Our company is backed by top investors and accelerators like
    Y Combinator, and we are on a growth trajectory comparable
    to many top-performing SaaS companies
  - We’re remote-first with team members across Canada and the
    U.S., offering you the flexibility to work from anywhere.

  BioRender is an Equal Opportunity Employer. We celebrate
  diversity and are committed to creating an inclusive
  environment for all employees. All qualified applicants will
  receive consideration for employment without regard to race,
  color, religion, sex, sexual orientation, gender identity,
  national origin, disability, or veteran status.
