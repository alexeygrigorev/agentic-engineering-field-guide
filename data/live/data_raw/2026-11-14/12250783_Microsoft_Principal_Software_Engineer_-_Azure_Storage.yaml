description: |
  Overview

  The Azure Storage team is chartered with building, managing,
  and operating the persistent cloud storage platform for
  Microsoft Azure. We are one of the foundational services in
  Azure and host data from some of the largest companies in
  the world, as well as Microsoft’s own major online
  businesses.

  We are looking for a Principal Software Engineer - Azure
  Storage, who has strong technical expertise in low-level
  storage systems, datapath, and kernel-mode programming, and
  is passionate about building the next-generation storage
  platform to support new workloads like AI training and
  inference. If you love large-scale distributed systems and
  enjoy working on projects where you can define the scope,
  direction, and architecture of solutions that make a massive
  impact on Azure Storage, this could be the role for you! You
  will have the opportunity to make high-impact contributions
  every day as you build a hyperscale storage system.

  You’ll be joining a talented, highly collaborative team
  responsible for engineering the lowest-level and most
  fundamental layers of Azure Storage. In this role, you will
  provide hands on technical leadership and help build the
  next generation of storage servers, ensuring high
  availability, durability, and cost efficiency, while
  resolving system bottlenecks, optimizing performance, and
  improving resiliency. This role offers exposure to cutting-
  edge storage AI workloads for our largest AI customers, and
  about how new hardware innovations like DPUs (Data
  Processing Units) can be leveraged in such systems.

  Microsoft’s mission is to empower every person and every
  organization on the planet to achieve more. As employees we
  come together with a growth mindset, innovate to empower
  others and collaborate to realize our shared goals. Each day
  we build on our values of respect, integrity, and
  accountability to create a culture of inclusion where
  everyone can thrive at work and beyond.

  Responsibilities

  - Provides technical leadership in designing and building
    high-performance, hyperscale storage servers using the
    latest cutting-edge technologies
  - Works with appropriate stakeholders to determine
    requirements for supporting next-generation hardware and
    emerging AI workloads
  - Contributes to the identification of dependencies and the
    development of design documents for a product area with
    little oversight
  - Helps identify opportunities for improvements in efficiency,
    scale, performance, and resiliency
  - Creates and implements code for storage services
  - Remains current in their skills by investing time and effort
    into staying abreast of current developments that will
    improve availability, reliability, efficiency,
    observability, and performance

  Qualifications

  Required Qualifications:

  - Bachelor's Degree in Computer Science or related technical
    field AND 6+ years technical engineering experience with
    coding in languages including, but not limited to, C or
    C++
    - OR equivalent experience

  Other Requirements:

  - Ability to meet Microsoft, customer and/or government
    security screening requirements are required for this
    role. These requirements include, but are not limited to
    the following specialized security screenings:
    - Microsoft Cloud Background Check: This position will be
      required to pass the Microsoft Cloud Background Check
      upon hire/transfer and every two years thereafter

  Preferred Qualifications:

  - Master's Degree in Computer Science or related technical
    field AND 8+ years technical engineering experience with
    coding in languages including, but not limited to, C or
    C++
    - OR Bachelor's Degree in Computer Science or related
      technical field AND 12+ years technical engineering
      experience with coding in languages including, but not
      limited to, C or C++
    - OR equivalent experience
  - Experience in building and operating storage services at
    scale
  - 6+ years of experience in software engineering practices,
    coding and solid foundation in data structures and
    algorithms, with problem solving, debugging, and
    analytical skills
  - 4+ years of experience in lower level storage or file-
    systems, datapath, kernel mode programming, distributed
    systems, and operating systems

