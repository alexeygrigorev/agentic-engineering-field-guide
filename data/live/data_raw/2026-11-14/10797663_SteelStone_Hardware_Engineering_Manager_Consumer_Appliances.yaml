description: |
  Company Description

  Gourmia stands as a trusted name in the world of kitchen
  appliances, focusing on innovative, quality-driven products
  that cater to modern culinary needs. Our diverse product
  range of air fryers, smokeless grills, and other kitchen
  innovations are prominently displayed on the shelves of
  major retailers like Walmart, Costco, and Target. We're not
  just about products, though; we're about people. Our team,
  drawn from diverse backgrounds, collaborates daily to design
  and produce appliances that make cooking simpler and more
  efficient. We value a culture of mutual respect, learning,
  and growth, ensuring that every member feels valued and has
  the resources they need to succeed. When you join Gourmia,
  you're not merely finding a place of work but an environment
  where your skills are nurtured, your efforts are recognized,
  and your professional growth is a shared priority. We
  believe in doing things the right way – not just in our
  products, but in our commitment to our team's well-being and
  development. Come be a part of a grounded, future-focused
  company that's dedicated to quality, innovation, and its
  people.

  Job Description

  Job Purpose: To lead and manage a small team of R&D
  Engineers and QC/QA technicians in designing and producing
  innovative small kitchen appliances. The Manager will
  utilize their engineering expertise to oversee resource and
  timeline management, ensuring efficient product development,
  market introduction, and ongoing quality management.

  Job Duties:

  - Lead the Engineering team in modeling, prototyping, and
    finalizing designs of new small kitchen appliances,
    ensuring designs align with requirements from R&D.
  - Develop standards and SOPs for QC/QA for new and existing
    products to ensure achievement of quality requirements.
  - Oversee project timelines within Engineering, ensuring
    timely delivery of products from conception to market.
  - Collaborate with cross-functional teams to integrate
    insights from market research and customer feedback into
    product engineering and ongoing QC/QA.
  - Drive innovation and continuous improvement in product
    technical parameters, testing processes, and quality
    standards.

  Qualifications

  - Proven experience in Engineering Management within the
    household appliance industry, or another industry driven
    by mechanical and electrical engineering.
  - Leadership skills with experience managing engineers.

  Education:

  - Bachelor’s degree in Engineering.

  Experience:

  - Minimum of 4 years of experience in electrical and
    mechanical engineering, with at least 3 years in a
    leadership role.

  Knowledge and Skills:

  - In-depth knowledge of small appliance design and
    development.
  - Excellent project management skills.
  - Strong problem-solving and analytical abilities.
  - Proficient in relevant software and engineering tools.

  Preferred Qualifications:

  - Experience in small kitchen appliance R&D.
  - Master’s Degree in Engineering.
  - Familiarity with the latest trends and technologies in the
    industry.
  - Bilingual English and Mandarin is a plus.

  Additional Information

  Working Conditions:

  - Office-based role with occasional travel to manufacturing
    sites or industry events.
  - Collaborative team environment with opportunities for
    professional growth.

  Compensation: $150,000 - $170,000
