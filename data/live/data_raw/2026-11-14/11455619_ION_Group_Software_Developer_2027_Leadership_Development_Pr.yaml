description: |
  Our Company



  ION is the world’s most progressive FinTech company
  providing pioneering software and consultancy services to
  customers around the globe. We serve large financial
  institutions, trading firms, central banks, and
  corporations. We are committed to automating processes that
  positively impact on our customers’ work and provide
  insights to enable more informed decision making. We provide
  software and data to our customers to simplify complex
  processes and digitize their businesses. Our products and
  services help the world's leading organizations do more, in
  a better and simpler way, than ever before.

  ION software underpins the global fixed income, foreign
  exchange, and derivatives markets, powers the world’s
  central banks, and enables the automation of workflows
  across critical treasury and commodities operations for
  thousands of companies worldwide. ION data and analytics are
  the golden source for M&A, equity, and leverage finance
  bankers worldwide. With a dynamic team of 13,000+ employees,
  40+ global offices, and 5,000+ customers worldwide, ION
  provides an unparalleled career experience for those who
  share our passion for growth and technology evolution.



  ION Group consists of the following divisions:



  - ION Analytics: Provider of investment banking M&A, equity
    and debt data, analytics, and content.
  - ION Corporates: Provider for the digital corporation,
    enabling automation of workflows across critical treasury
    and commodities operations.
  - ION Markets: Provider of trading automation, analytics, and
    infrastructure to the global financial markets.
  - ION Core Banking: Provider of core banking and financial
    software for financial institutions in Italy and
    internationally.
  - ION Insight Score: Provider of credit information and credit
    management in Italy.
  - ION Risk Metrics: Provider of credit servicing and asset
    management in Italy.



  Our Programme



  Our Leadership Development Program (LDP) is a foundational
  global initiative focused on developing talent for ION’s
  growing operations around the world. The program provides an
  opportunity for outstanding university graduates to start a
  career in a dynamic and fast paced global FinTech firm.



  Analysts will spend the first 3 years of their career in 3
  unique, 12-month rotations gaining experience across the
  product lifecycle. At the end of their 3 rotations analysts
  will transition to a deeper dive in one area of ION.





  What you'll do

  In the role of Software Developer, you will develop products
  for our global customers including Tier 1 banks and Fortune
  100 corporations. You will be part of an Agile team, who are
  responsible for end-to-end product development, including:

  - Analyzing business requirements and product solutioning.

  - Architecture and designs using the latest principles and
    patterns in software engineering.

  - Coding, testing, and continuous integration of solutions
    using the latest and upcoming technologies.



  Your Contribution

  - Build innovative products and solutions that:

    - Reduce business process complexity.
    - Increase organizational efficiency through automation.
    - Liberate people from performing repetitive manual tasks.
    - Help ION’s clients gain a competitive advantage by using our
      products.

  - Resolve complex technical and business issues and
    communicate effectively to Internal teams and ION clients.

  - Automate complex business workflows and processes and make a
    positive impact to client businesses.



  Basic Qualifications

  - 2027 graduation.

  - 2:1 or above.

  - Bachelor’s, or Master’s, in Computer Science or related STEM
    disciplines, such as Data Science, or Quantitative
    Finance, with experience in hands-on programming required.

  - Authorization to work in selected countries without
    restriction or need for sponsorship.

  - Demonstrated interest in finance and/or technology, ideally
    including work experience.

  - Passion for learning, self-improvement, and a questioning
    and challenging mindset.

  - Motivated self-starter who is proactive, enthusiastic, and
    passionate about what they do.

  - Strong problem-solving capabilities and the desire to
    understand the “why” behind each problem.



  How you'll grow



  Our 36-month Leadership Development Program (LDP) allows you
  to rotate through different areas of the product lifecycle.
  You will work closely with ION product teams, and clients,
  and grow, gaining:

  - Deep knowledge in:
    - Diverse set of technologies, development methodologies, and
      processes required to build complex mission-critical
      systems using distributed architectures.
    - Financial domain to build world class products.

  - E2E Software Product Development Lifecycle.

  - A mastery of foundational technologies, keeping on top of
    constant technological evolution through your work with
    subject matter experts.

  - Personality traits in an Imaginative and Positive culture:

    - Passionate.
    - Expressive.
    - Intelligent.

  - Exposure to:

    - Product Management.

    - Client Services.

    - Support.

    - Deployment.

  Application process



  Applicants that submit successful online applications will
  be required to complete online verbal and numerical
  reasoning assessments within 4 days of receiving the test
  link.



  Successful applicants will subsequently be invited to a
  video interview.



  The final part of the process is an assessment day
  consisting of interviews, a case study and a group exercise.



  We review applications on a rolling basis and encourage you
  to apply as soon as you are ready because initial video
  interviews can occur prior to the application period
  closing.



  We aim to notify you of your application status
  approximately one month after we receive your application.
