  La vie chez Unity

  Unity [NYSE : U] est le premier moteur de jeu au monde,
  propulsant les expériences de plus de 3 milliards
  d’utilisateurs(rices) chaque mois. Les plus grands jeux
  mobiles, les titres indépendants PC les plus populaires, des
  jeux console parmi les plus innovants, ainsi que la quasi-
  totalité des principales expériences XR et jeux Web sont
  développés, déployés et optimisés avec Unity.

  Unity accompagne également des équipes dans des secteurs
  tels que l’automobile, l’industrie manufacturière et la
  santé pour concevoir, simuler et collaborer en 3D - comblant
  ainsi l’écart entre les idées et la réalité. Pour plus
  d’informations, veuillez visiter www.unity.com.

  Unity est un employeur fier de garantir l’égalité des
  chances. Nous nous engageons à favoriser un environnement
  inclusif et innovateur et à célébrer nos employés à travers
  l’âge, l’éthinicité, la couleur, l’ascendance, l’origine
  nationale, la religion, le handicap, le sexe, l’identité ou
  l’expression de genre, l’orientation sexuelle ou tout autre
  statut protégé conformément à la loi applicable. Si vous
  êtes en situation de handicap ou avez des besoins
  spécifiques nécessitant des aménagements pour que votre
  entretien se déroule dans les meilleures conditions, nous
  vous invitons à remplir ce formulaire afin de nous en
  informer et que nous puissions faire le nécessaire.

  Ce poste exige que son ou sa titulaire possède une
  connaissance de l’anglais qui soit suffisante pour lui
  permettre d’avoir des échanges professionnels verbaux et
  écrits dans cette langue, puisque l’accomplissement des
  tâches liées à ce poste nécessite des communications
  fréquentes et régulières avec des collègues et partenaire
