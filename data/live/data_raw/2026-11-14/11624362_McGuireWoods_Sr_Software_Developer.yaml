description: |
  Overview

  McGuireWoods LLP is seeking an experienced and highly
  skilled Senior Software Developer to join our IT team. The
  Senior Software Developer is responsible for the analysis,
  design, development, integration, testing, deployment,
  maintenance and troubleshooting of the Firm’s internally
  developed software systems and solutions. The position works
  closely with business stakeholders and technology teams to
  translate business requirements into secure, scalable and
  maintainable software solutions, leveraging currently
  supported development platforms, cloud technologies, APIs,
  automation, and AI-assisted software development tools. The
  Senior Software Developer may also design and develop
  applications and integrations that leverage artificial
  intelligence and large language models (LLMs) to enhance
  business processes, capabilities and user experiences.

  The ideal candidate will have at least five years of hands-
  on software development experience across the Microsoft
  stack (.NET, C#, SQL Server and modern web technologies),
  proven experience building AI-enabled and generative AI
  solutions, and the communication skills to work with legal
  and business stakeholders and turn their needs into secure,
  scalable applications and integrations that support the
  Firm's core business systems.

  McGuireWoods, one of the world’s leading law firms, has
  provided legal solutions to corporate, individual and
  nonprofit clients since 1834. Along with excellent benefits,
  McGuireWoods offers most employees a hybrid remote option
  allowing flexibility and work-life balance. Our Applicant
  Disclosures describe your rights. Our Privacy Statement
  describes how we will process and safeguard your personal
  data.

  Responsibilities

  - Contributes to the planning, development, customization,
    integration, testing, deployment, maintenance and
    troubleshooting of major software systems and solutions
    supporting the Firm’s business operations, including
    Document Management, Financial/Billing, Matter Management,
    Customer Relationship Management, Docket Management,
    Collaboration and Content Management.
  - Designs, develops, maintains and tests custom web-based,
    desktop and cloud-based software solutions, features and
    components to support a variety of internal and external
    business requirements.
  - Develops and maintains custom solutions supporting Microsoft
    365 and Microsoft Office applications, including advanced
    VBA development, and other department, group and
    individual-specific applications within the Firm’s
    technology environment.
  - Develops and maintains integrations between Firm
    applications, systems and third-party services using APIs,
    web services, data interfaces and other currently
    supported integration technologies.
  - Works with legal and administrative staff to understand
    business needs, gather requirements, identify technical
    solutions and support the planning and implementation of
    software initiatives.
  - Works with third-party application and system vendors to
    assess and resolve software and integration issues and to
    develop integrations, customizations and other solutions.
  - Analyzes, organizes and documents software development,
    integration, testing, deployment, maintenance and
    troubleshooting requirements.
  - Participates in the evaluation and implementation of
    software development standards, practices, tools,
    architectures and methodologies within the Firm’s
    application environment.
  - Contributes to the maintenance of application and technology
    lifecycle roadmaps and makes recommendations regarding the
    maintenance, modernization, consolidation, replacement or
    retirement of software systems.
  - Consults with management, business analysts, stakeholders
    and project managers to identify and implement software
    development, integration and process improvements that
    achieve new capabilities and benefits for clients.
  - Acts as a technical lead on formal project initiatives and
    provides technical guidance to project teams and other
    developers as appropriate.
  - Interacts directly with internal clients and stakeholders on
    system development requests, enhancement requests and
    system-related issues, communicating technical information
    clearly and helping reconcile competing priorities.
  - Evaluates and utilizes AI-assisted software development
    tools and platforms to improve development productivity,
    code quality, testing, documentation, troubleshooting and
    other software development activities while following Firm
    security, privacy and development standards.
  - Designs, develops, integrates and supports software
    applications and solutions that leverage artificial
    intelligence, large language models (LLMs), generative AI
    APIs and related technologies to enhance business
    processes, automate workflows and deliver new capabilities
    to Firm users.
  - Participates in the development and implementation of
    enterprise-wide IT standards and policies as they relate
    to application development, integration, security and
    emerging technologies.
  - Keeps abreast of emerging software development practices, AI
    technologies, development platforms, security practices
    and industry innovations, and evaluates their potential
    application within the Firm.

  Qualifications

  Required:

  - Bachelor’s degree in Computer Information Systems, Computer
    Science, Information Technology, Business Administration,
    or a related field; equivalent combination of education
    and relevant experience may be considered.
  - Minimum of five years of professional experience in software
    development, with demonstrated experience designing,
    developing, testing, deploying, maintaining, and
    troubleshooting software applications and integrations.
  - Demonstrated hands-on experience developing, integrating, or
    implementing AI-enabled or generative AI solutions.
  - Proficiency with modern software development using currently
    supported Microsoft development platforms, including .NET,
    ASP.NET Core, C#, and/or other current Microsoft
    development technologies.
  - Experience with currently supported versions of Microsoft
    SQL Server, including SQL/T-SQL development, database
    design, querying, and troubleshooting.
  - Proficiency with modern web development technologies,
    including HTML, JavaScript/ECMAScript, CSS, XML, JSON, and
    REST APIs.
  - Experience using currently supported development tools and
    platforms, including Visual Studio, SQL Server Management
    Studio (SSMS), and Azure DevOps or Azure DevOps Server.
  - Working knowledge of source control, software development
    lifecycle (SDLC) practices, code review, application
    testing, deployment, and production support.
  - Working knowledge of application architecture, software
    design patterns, secure coding principles, and enterprise
    software development standards.
  - Experience gathering and analyzing business requirements and
    translating them into practical technical solutions.
  - Ability to work effectively with business stakeholders,
    technical teams, vendors, project managers, and other
    members of the organization.
  - Strong analytical, problem-solving, written, and verbal
    communication skills, with the ability to explain
    technical concepts to both technical and non-technical
    audiences.
  - Ability to manage multiple projects, priorities, and
    development activities with limited supervision.
  - Working knowledge of Microsoft Windows, Active Directory
    and/or Microsoft Entra ID, and enterprise application
    environments.
  - Ability to evaluate and appropriately use AI-assisted
    software development tools and platforms in accordance
    with Firm security, privacy, and development standards.

  Preferred:

  - Experience developing applications and integrations for
    Microsoft 365, SharePoint Online, and other Microsoft
    cloud services.
  - Experience with Microsoft Graph APIs, SharePoint Framework
    (SPFx), and other modern Microsoft 365 development and
    integration technologies.
  - Experience developing custom web-based, desktop, or cloud-
    based applications in an enterprise environment.
  - Experience with modern front-end development frameworks and
    libraries, such as React, Angular, TypeScript, jQuery,
    Bootstrap, or Sass.
  - Experience with Microsoft Office automation, including VBA,
    Office Scripts, or other current Office development and
    automation technologies.
  - Experience developing or integrating applications that
    leverage artificial intelligence, large language models
    (LLMs), generative AI services, AI APIs, AI agents,
    retrieval-augmented generation (RAG), or related
    technologies.
  - Experience with Microsoft Power Platform, including Power
    Apps and Power Automate, and integrating low-code
    solutions with custom-developed applications.
  - Experience integrating applications with third-party systems
    and services using APIs, web services, and other modern
    integration technologies.
  - Experience working with document management,
    financial/billing, matter management, CRM, docketing,
    collaboration, or other enterprise business systems,
    particularly in a legal or professional services
    environment.
  - Experience with automated testing, CI/CD, application
    monitoring, and other modern software engineering
    practices.
  - Experience working with Azure or other cloud platforms and
    services.
  - Experience with Agile or other iterative software
    development methodologies.
  - Experience in a law firm or other professional services
    environment.

  Have more questions?  Connect with a recruiter directly.
