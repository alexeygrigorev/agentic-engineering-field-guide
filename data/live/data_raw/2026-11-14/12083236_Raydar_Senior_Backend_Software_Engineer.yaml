description: |
  About the company

  Our client is a financial services company.

  The role

  Raydar is recruiting for this role on behalf of our client.
  Own backend engineering work from problem definition through
  production, working alongside product and operations
  colleagues to shape the technical direction of a platform
  that handles sensitive financial data. The role suits an
  experienced engineer who moves quickly, makes sound design
  decisions and works without heavy layers of support.

  What you'll do

  - Take ambiguous initiatives, break them into workable pieces
    and carry them to production with minimal oversight.

  - Make architecture and design decisions for the backend
    infrastructure.

  - Partner with product and non-technical colleagues to define
    features and set direction.

  - Build automation for transaction, billing and reimbursement
    workflows.

  - Improve engineering tooling and processes as one of the
    first members of a small team.

  Requirements

  What we're looking for

  - 6 to 12 years of experience in backend engineering.

  - A track record of shipping production backend systems at
    companies operating at scale.

  - Background in fintech or healthtech, such as payments,
    billing or claims systems.

  - A bachelor's or master's degree in computer science or a
    related engineering field, or an adjacent degree from a
    strong school.

  - Skilled at building server-side applications in Node.js or
    an equivalent web framework.

  - A history of delivering high-volume server-side software
    where data privacy and accuracy are critical, with
    relational database experience.

  - Clear verbal and written communication with non-technical
    colleagues.

  Bonus points

  - Demonstrated interest in healthcare or fintech.

  - Daily use of AI tooling in development work and comfort
    within an AI-first engineering culture.

  Benefits

  Compensation and benefits

  - Base salary: USD 175,000 to 225,000 per year

  - Equity

  - Medical coverage

  - Paid parental leave

  - Flexible time off

  Location and work model

  - New York, NY, United States

  - San Francisco, CA, United States

  - Hybrid, 3 days in-office per week with flexible choice of
    days

  - Full-time
