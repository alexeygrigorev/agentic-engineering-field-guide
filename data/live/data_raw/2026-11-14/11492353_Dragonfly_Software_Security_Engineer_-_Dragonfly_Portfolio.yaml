description: |
  About Dragonfly

  Dragonfly is a global investment firm focused on the future
  of money, markets, and intelligence. With origins in crypto
  and over $3.5 billion in assets under management, we invest
  in generational companies and protocols across the frontier
  of finance and technology. We're a team of seasoned VCs,
  technologists, and markets experts with deep roots in New
  York, Silicon Valley, and Asia. We've published some of the
  industry's most widely read research on stablecoins, market
  structure, decentralized finance, networks, protocol
  security, and increasingly, the intersection of finance and
  AI.

  This is not a listing for an internal role at Dragonfly.
  This posting is to connect you directly with one or more
  companies in our portfolio that are actively hiring for
  Security Engineers who can also code.

  Depending on the company and level, responsibilities may
  include:

  - Designing and operating security infrastructure across
    cloud, network, and production environments
  - Building and managing PKI, certificates, authentication, and
    key management systems
  - Designing secure network architecture, segmentation, private
    connectivity, and zero-trust systems
  - Owning IAM, secrets management, cloud KMS, HSMs, and access
    controls
  - Implementing secure API infrastructure, request signing,
    replay protection, and audit logging
  - Building security monitoring, anomaly detection, and
    incident response processes
  - Partnering with Engineering and Infrastructure teams to
    identify and address security risks
  - Managing penetration testing, vulnerability assessments, and
    remediation
  - Supporting security audits and compliance programs such as
    SOC 2 and ISO 27001
  - Building security processes and infrastructure from the
    ground up in early-stage environments
  - Collaborating on smart contract, blockchain, wallet,
    custody, or other crypto-specific security systems

  What portfolio companies are generally looking for

  - Strong experience building or operating production security
    systems
  - Deep understanding of network, infrastructure, cloud, or
    application security
  - Experience with areas such as PKI, IAM, secrets management,
    HSMs, KMS, network segmentation, or zero-trust
    architecture
  - Comfort owning security projects end-to-end and working
    directly with engineering teams
  - Ability to operate in fast-moving environments where
    security infrastructure is still being built
  - Strong attention to detail and understanding of how security
    decisions affect production systems
  - Experience responding to incidents, managing audits, or
    working with external security partners
  - Ability to work across technical and non-technical teams

  Nice to have

  - Experience at a crypto, fintech, payments, trading, custody,
    or financial infrastructure company
  - Experience working with regulated financial institutions or
    institutional counterparties
  - Familiarity with smart contract or blockchain security
  - Experience with cryptographic signing, attestation, or
    multi-party signing systems
  - Experience with SOC 2, ISO 27001, penetration testing, or
    security audits
  - Previous experience as an early or founding security
    engineer

  Even if you don't match every point above, we encourage you
  to apply. There may be other opportunities that fit your
  skill set.

  Process

  - We’ll confidentially match you with portfolio companies
    aligned with your background, skill set, and interests
  - If you and a team are interested, we’ll facilitate a warm
    introduction. If there isn’t a match today, we’ll keep you
    top of mind for future opportunities.

  Compensation

  - Early / Mid: $120,000–$175,000
  - Senior: $175,000–$225,000
  - Staff / Lead / Founding: $200,000–$300,000+

  The compensation range reflects variation by seniority,
  location, and hiring company. Final compensation and equity
  are confirmed with the specific hiring company.

  Submit your information below, and we’ll reach out if
  there’s a potential fit.
