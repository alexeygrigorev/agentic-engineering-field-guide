description: |
  About Judi Health

  Judi Health is a health technology company providing benefit
  administration solutions to employers, unions, health plans,
  and government entities. Judi Health replaces fragmented,
  outdated systems with the industry's first Unified Claims
  Processing™ architecture, seamlessly consolidating pharmacy
  and medical benefit administration on a single, secure
  platform. By delivering true price transparency, eliminating
  unnecessary middleman fees, and leveraging advanced AI-
  powered care delivery, Judi Health helps clients achieve
  unprecedented operational efficiency and service levels. At
  Judi Health, we're deploying the infrastructure our country
  needs to deliver the healthcare we all deserve. We are the
  intelligence platform powering benefits plans for millions
  of Americans and proudly leading the next generation of
  care. To learn more, visit www.judi.health.

  Location: Hybrid 3 days (offices in NYC, Denver, CO and
  Charlotte, NC area)

  Position Summary

  Join our mission to transform pharmacy benefits. In this
  development role, you will lead large, high-impact projects,
  working closely with product managers, designers, and
  clients to gather both business and technical requirements
  with a product mindset. You will be at the forefront of
  technical solutioning, driving enterprise API integrations,
  data migrations, data exchange, and prioritizing security.
  This role involves extensive client interactions, API
  development, and ensuring scalability. You will collaborate
  cross-functionally across internal teams and various
  departments within our client organizations to accelerate
  program technical deliveries. This is an exciting
  opportunity to redefine the pharmacy benefits landscape
  through collaboration and cutting-edge cloud technology.

  Why You’ll Love Working Here

  - Opportunity to lead high-impact, client-facing initiatives
    that directly influence key business metrics.
  - Hands-on exposure to architecture, system design, and
    solving complex scalability challenges in real-world
    environments.
  - Be a catalyst in accelerating client migration and new
    client onboarding with direct visibility into outcomes.
  - Work on a team that values quick, elegant solutions to
    complex problems where your contributions shape the future
    of pharmacy benefits.

  Position Responsibilities

  - Lead the development and deployment of cutting-edge
    solutions from design to production.
  - Collaborate with product managers and cross-functional teams
    to refine and implement requirements, ensuring seamless
    integration and user experience.
  - Engage with major clients and cross-functional teams to
    architect innovative solutions and enhance product
    functionality.
  - Establish and maintain consistent, enterprise-grade APIs
    across services, ensuring interoperability and scalability
    while employing best practices for interactions with both
    partner and internal systems.
  - Build robust backend applications in Python on AWS Lambda,
    API Gateway, SMS, ECS, and other cloud technologies.
  - Implement backend code in a serverless, cloud-native
    environment (Flask/AWS Lambda/ECS).
  - Design and implement scalable systems capable of handling
    high-volume transactions, ensuring robustness and
    reliability.
  - Ensure security best practices are followed in all aspects
    of development and deployment.
  - Conduct code reviews to maintain high code quality and
    standards.
  - Demonstrate technical leadership, driving timely execution
    and high-quality software delivery.
  - Make informed architectural decisions through careful
    evaluation and leveraging prior experience.
  - Self-manage tasks, collaborate effectively with both
    internal and external teams, and drive projects to
    successful completion.
  - Represent the software development team’s products to
    stakeholders, providing technical insights and solutions.

  Qualifications

  - 7+ years of related job experience with a broad range of
    technical skills.
  - Desire to work in a health technology company; previous
    Pharmacy Benefits Manager (PBM) experience is a plus.
  - Strong experience in Python (Flask/SQLAlchemy) and
    TypeScript (React).
  - Advanced PostgreSQL database knowledge, including common
    table expressions, windowing functions, views, stored
    procedures, and indexing techniques (full-text or
    geospatial).
  - Experience working with microservices, an API-based
    application paradigm, and distributed caching techniques.
  - Proven ability to deliver complex web applications to the
    cloud, targeting infrastructure as code with a security
    mindset (AWS, Terraform).
  - Demonstrated ability to improve scalability and
    observability of systems.
  - Proficiency in Linux using Bash, Zsh, Python, Node.js and
    similar tools.
  - Experience with Git code management, preferably in a mono
    repository.
  - Strong knowledge of unit testing across multiple paradigms
    and integration testing using frameworks like Playwright.
  - Strong problem-solving skills and a proactive approach to
    identifying and addressing potential issues.
  - Prior experience working as a technical lead collecting
    functional and non-functional requirements, or strong
    technical product management experience is a plus.

  Nothing in this position description restricts management’s
  right to assign or reassign duties and responsibilities to
  this job at any time.

