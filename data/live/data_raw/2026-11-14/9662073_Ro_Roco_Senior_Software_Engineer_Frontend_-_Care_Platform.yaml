description: |
  Join Tech @ Ro to build the future of healthcare, from the
  ground up!

  At Ro, we believe that when people achieve their health
  goals, they can achieve their life goals. The highest-
  leverage way to move society forward is to give people their
  health, and the current healthcare system isn’t built to do
  that. It was built to bill, not to serve patients.

  We’re building a new system. One where the patient is in
  control. One designed from scratch for the digital age.

  At Ro, technology isn’t just a function… It's core to how we
  deliver care. We’ve built a vertically integrated healthcare
  platform that connects telehealth, diagnostics, pharmacy,
  and logistics into a seamless, end-to-end experience for
  millions of patients.

  …and we’re just getting started.

  As part of Tech @ Ro, you’ll work on systems that operate at
  scale, with an opportunity to:

  - Solve complex, high-concurrency problems across a full-stack
    platform
  - Build and ship quickly with tight feedback loops and real-
    world impact
  - Own systems end-to-end, from architecture to production
    performance
  - Work alongside experienced operators, technical leaders, and
    clinicians
  - Help define how modern healthcare should be delivered

  We’re a performance-driven team with a strong sense of
  ownership and urgency. We move fast, learn quickly, and hold
  a high bar for what we build, and do so with a big heart —
  because patients depend on it.

  If you’re motivated by impact, scale, and the chance to help
  lead the patient revolution, come build with us.

  The Role

  We're looking for a Frontend Engineer to join the Care
  Platform Operations team at Ro.

  We build the products and workflows providers and care teams
  use to deliver care through Ro every day, including patient-
  provider messaging, appointment scheduling, task routing and
  queues, and operational tools for providers, pharmacists,
  care coordinators, and patient advocates. These are complex,
  data-dense workflows where strong frontend engineering
  directly affects how efficiently and safely care gets
  delivered.

  You'll be the frontend specialist on a full-stack product
  team, working closely with backend engineers, Product,
  Design, Data, Clinical, and Care Operations. You'll own
  problems end-to-end, helping shape the product and technical
  approach, making tradeoffs across the frontend and backend,
  shipping the experience, and learning from how it performs
  in production.

  We're looking for someone with deep frontend expertise who
  thinks beyond the UI and is comfortable navigating
  ambiguity, dependencies, and product decisions to deliver
  the right outcome.

  What You'll Do

  - Own complex frontend product areas from problem definition
    through architecture, implementation, rollout, and
    iteration.
  - Build accessible, reliable, high-performance applications in
    React and TypeScript for providers and care teams.
  - Partner closely with Product and Design to shape scope,
    sequencing, and product decisions rather than only
    implementing predefined requirements.
  - Translate complex clinical and operational workflows into
    intuitive interfaces that reduce friction and manual work
    for care teams.
  - Make deliberate frontend architecture decisions across
    component design, application state, data fetching, API
    contracts, error handling, and performance.
  - Work with backend engineers to design clear boundaries and
    contracts between frontend and backend systems.
  - Navigate cross-team dependencies and work through ambiguity
    with Engineering, Product, Design, Clinical, Data, and
    Operations partners.
  - Use qualitative user feedback and quantitative data to
    understand whether what we shipped worked and identify
    where to improve it.
  - Own quality after launch, including testing, accessibility,
    observability, reliability, performance, and production
    issues.
  - Contribute to our shared frontend architecture, design
    system, engineering standards, code reviews, and technical
    design docs.
  - Help other engineers make better technical decisions through
    mentorship, design feedback, and collaboration.
  - Participate in on-call rotations and take ownership of the
    health of the systems your team operates.

  What You'll Bring to the Team

  Bonus Skills

