description: |
  About Bask Health

  Bask Health is a software platform that enables
  entrepreneurs, doctors, and healthcare businesses to launch,
  manage, and grow direct-to-consumer telehealth businesses.

  Our platform brings together patient experiences, clinical
  workflows, pharmacy operations, and commerce tools in one
  place.

  We're an entrepreneurial, product-focused engineering team
  that values ownership, technical excellence, and building
  software that solves real problems. Engineers work closely
  with product teams and company leadership, take features
  from idea to production, and have a direct role in shaping
  the platform.

  Engineering at Bask is AI-first and builder-led. We use
  tools like Cursor and Claude Code throughout development
  while maintaining high standards for reliability, testing,
  and software quality.

  About the Role

  We're looking for an early-career Software Engineer to join
  Bask Health's engineering team and help build, maintain, and
  improve the applications that power our telehealth platform.

  You'll contribute to real product features across merchant
  tools, patient experiences, internal systems, and backend
  services. Depending on the project, your work may involve
  frontend interfaces, backend development, APIs, databases,
  or integrations.

  This role is ideal for someone who has a foundation in
  software development and is ready to grow through hands-on
  engineering work. Whether your experience comes from
  internships, coursework, personal projects, or an initial
  engineering role, we're interested in your ability to learn,
  solve problems, and build reliable software.

  You'll collaborate with experienced engineers, product
  managers, and designers while receiving technical guidance
  and gradually taking on more ownership.

  We're looking for someone who takes initiative, asks
  thoughtful questions, cares about the quality of their work,
  and enjoys turning ideas into functional software.

  What You'll Do

  - Build and maintain features across Bask's web applications.
  - Develop frontend functionality using JavaScript, TypeScript,
    and React.
  - Contribute to applications built with Next.js.
  - Implement backend features and services using Node.js and
    TypeScript.
  - Work with APIs to connect applications and backend systems.
  - Contribute to merchant-facing and patient-facing product
    experiences.
  - Help build internal tools and operational workflows.
  - Work with SQL databases to retrieve and manage application
    data.
  - Develop reusable frontend components and application
    functionality.
  - Collaborate with engineers to understand requirements and
    technical approaches.
  - Translate product specifications into working software.
  - Assist with integrating third-party services and existing
    platform APIs.
  - Investigate bugs and help troubleshoot production issues.
  - Write readable, maintainable, and well-tested code.
  - Participate in code reviews and incorporate technical
    feedback.
  - Learn and apply engineering best practices for reliability
    and security.
  - Contribute to application testing and quality assurance.
  - Improve existing features based on product feedback and
    technical requirements.
  - Help document implementation details and development
    processes.
  - Participate in technical planning and engineering
    discussions.
  - Collaborate with product managers and designers on feature
    development.
  - Learn Bask's application architecture and deployment
    workflows.
  - Use Git and collaborative development tools.
  - Use AI-assisted development tools while understanding and
    validating generated code.
  - Take increasing ownership of assigned engineering tasks and
    product features.

  Requirements

  - Foundational software engineering experience gained through
    coursework, internships, professional roles, freelance
    work, or personal projects.
  - Understanding of core programming concepts and software
    development fundamentals.
  - Familiarity with JavaScript or TypeScript.
  - Experience building web applications or software projects.
  - Basic knowledge of HTML, CSS, and modern web development.
  - Familiarity with React or another frontend framework.
  - Basic understanding of backend application development.
  - Familiarity with APIs and how applications exchange data.
  - Foundational knowledge of databases and data structures.
  - Understanding of asynchronous programming concepts.
  - Familiarity with Git and version control.
  - Ability to read, understand, and modify existing code.
  - Basic debugging and problem-solving skills.
  - Willingness to learn automated testing and software quality
    practices.
  - Ability to follow technical documentation and implementation
    guidance.
  - Interest in building production software and improving
    existing applications.
  - Strong attention to detail and code readability.
  - Ability to communicate progress, challenges, and questions
    clearly.
  - Willingness to collaborate with engineers and cross-
    functional teams.
  - Openness to mentorship, feedback, and continuous learning.
  - Ability to manage assigned tasks and take responsibility for
    deliverables.
  - Comfort working in a remote engineering environment.

  Nice to Have

  - Up to 2 years of professional software engineering
    experience.
  - Previous software engineering internship experience.
  - Personal or professional projects using React and Next.js.
  - Experience with TypeScript.
  - Familiarity with Node.js and backend JavaScript development.
  - Experience working with SQL databases.
  - Experience building or consuming REST APIs.
  - Familiarity with automated testing frameworks.
  - Exposure to AWS or another cloud platform.
  - Familiarity with serverless application development.
  - Experience using Prisma, Drizzle ORM, or similar database
    tools.
  - Experience contributing to open-source projects.
  - Familiarity with CI/CD pipelines and deployment processes.
  - Experience building SaaS applications or internal tools.
  - Interest in e-commerce, merchant platforms, or subscription
    software.
  - Interest in healthcare or telehealth technology.
  - Experience using AI-assisted development tools such as
    Cursor or Claude Code.
  - A GitHub profile or portfolio demonstrating software
    development projects.
