description: |
  Company Description

  We are a growing company with 7 years of experience and
  start-up character with a modern HQ in Grunewald, one of the
  greenest areas of Berlin. Our international team has
  a family atmosphere, great work-life balance and provides
  all what you need to become a champ. We provide tailor-made
  solutions for our customers; we offer optimal individual
  possibilities for the planning and realization of web and
  app projects. Due to the interdisciplinary fields of work,
  Bitlane offers an exciting work environment in various
  projects and tasks! We are searching for hands-on developers
  to join our growing team, who will have fun while accepting
  new challenges and elevate each-other to successfully reach
  company goals. We want to develop awesome projects alongside
  other talented developers and be a part of digitalization. 

  Job Description

  We have an immediate need for a senior WordPress developer.
  The ideal candidate has a thorough understanding of
  WordPress development standards and best practices. We are
  looking for someone that has deep understanding of how to
  build themes and plugins utilizing both industry and
  WordPress development best practices. Also, plugin research
  and customization are a significant part of this job. You
  will be responsible for backend and frontend development of
  a wide range of projects. The complexity of these projects
  can vary from small one-pager sites to product catalogs,
  e-commerce websites and gated company portals. If this
  sounds like you, we would be happy to receive your
  application!

  Responsibilities include:

  - Creating responsive WordPress themes using our environment,
    coding standards and workflows
  - Creating extendable WordPress plugins based on
    specifications
  - Plugin research and customization
  - Defining a project scope together with a project manager
  - Communicating the status of your work and meeting deadlines
    defined by you and a project manager

  Qualifications

  - At least 2 years experience of Wordpress development
  - Developing custom themes
  - Responsive design fundamentals and frameworks (Foundation,
    Bootstrap)
  - Solid understanding of WordPress and PHP development best
    practices
  - Strong knowledge of PHP (Laravel is an advantage)
  - Skilled in frontend development with a focus on cross
    browser support
  - Fixing bugs in existing projects
  - Experience using CSS preprocessors like SASS, Less or Stylus
  - Foundational - Intermediate knowledge of JavaScript
  - Experience utilizing the WordPress REST API
  - Experience with integrating third-party APIs with WordPress
  - Experience using a version control system like git or
    subversion
  - Experience using NPM and task runners like Gulp or Grunt
  - Angular, React, Ionic framework is a big advantage
  - Exceptional ability (and desire) to dive-in and learn
    unfamiliar systems and tools
  - Fluent in English - German is a plus, but not necessary

  Additional Information

  - Detailed training with professional support
  - Permanent employment contract with home office options
  - Flat hierarchies and flexible working hours
  - Attractive remuneration
  - Regular further education offers
  - Coordinated team events
  - Fresh fruit, ice-cream, coffee, tea and cold drinks
  - High-quality office in the heart of the Grunewald

  Sounds like you? Great, we would love to hear from you!
  Please include your CV and a short cover letter explaining
  who you are, what is your superpower and your salary
  expectations. Feel free to send us something that shows us a
  little more about what you’re interested in - be it your
  account on GitHub, Twitter, Instagram, Medium or your blog.
