description: |
  About Doit

  We are focused on reinventing how people spend, save,
  invest, exchange, travel, and more. Our objective is to
  build tools that will help people get more from their money
  and and become an expert at ease. We believe AI will help
  make finance smart, assessible and safe.

  We are looking for the most talented and driven people we
  can find. We are looking for people who work for their
  passion, not counting hours. Who loves building great next-
  generation products, not status quo. Who cares about
  redefining how everyone around us can get the best financial
  applications, not for an exclusive few. We have teams
  working around the world, with over 20 nationalities and
  growing from our offices and remotely. Join us and build a
  better future for our society.

  In 2019, we built the first mobile-first, insurance
  platform, enabling insurance to be accessible online by
  millions in the region. Today, it's the leading insurance
  platform in Southeast Asia. The Role

  We are looking for full stack engineers to build fast across
  Doit's AI Neobank app. This role is for product-minded
  engineers who can move across frontend, backend, internal
  tools and customer journeys to turn ideas into working
  products quickly.



  What You'll Own

  - Build and ship full product features across frontend,
    backend, APIs and databases.
  - Create customer and internal workflows for onboarding,
    accounts, payments, rewards, travel, FX, support
    automation, KYC and risk.
  - Turn ambiguous product problems into working systems with
    clean UX and reliable backend logic.
  - Work closely with product, design, mobile, backend and AI
    engineers to launch fast and improve after release.
  - Build internal tools and automation that reduce manual work
    and help teams operate at scale.
  - Own your work beyond release: monitor, debug, learn and
    improve.



  What We're Looking For

  - Strong full stack engineering experience with real shipped
    products.
  - Comfortable across frontend, backend, APIs, databases and
    production debugging.
  - Good frontend execution using React, Next.js, Vue or similar
    modern stack.
  - Good backend fundamentals around APIs, data models,
    authentication, integrations and reliability.
  - Strong product sense and ability to simplify messy
    workflows.
  - Able to work fast with ambiguity and own outcomes end-to-
    end.



  This Role Is Not For

  - Engineers who only want to work on one narrow layer.
  - People who need complete specs before starting.
  - Developers who ship UI without understanding backend or
    operations impact.
  - Candidates who avoid production support.
  - People who make vague claims without showing real shipped
    work.



  The Bar

  We are looking for engineers with real technology career
  highlights. A strong highlight is not just working at a
  famous company. A strong highlight means you personally
  helped build, ship or scale a serious product, platform or
  system.



  Location

  This role is based in UK. This is a hybrid role. You are
  expected to work from our UK office at least 3 days per
  week.



  Language

  English is our main working language across global teams.
  Strong English communication is required.



  Interview Process

  Our process is designed to move fast:

  1. Online assessment or practical task

  2. Technical interview

  3. CEO / final round



  For strong candidates, we aim to complete the process and
  make an offer within 1 week from the start of the interview
  process. Candidates who complete assessments quickly will be
  prioritized.
