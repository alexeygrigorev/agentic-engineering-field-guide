description: |
  We have an opportunity to impact your career and provide an
  adventure where you can push the limits of what's possible.

  As a Lead Software Engineer at JPMorgan Chase within the
  Neovest team, you are an integral part of an agile team that
  works to enhance, build, and deliver trusted market-leading
  technology products in a secure, stable, and scalable way.
  As a core technical contributor, you are responsible for
  conducting critical technology solutions across multiple
  technical areas within various business functions in support
  of the firm’s business objectives.

  Job responsibilities

  •        Designs and delivers innovative software solutions,
  including architecture, development, and technical
  troubleshooting, applying creative problem-solving beyond
  routine approaches to build solutions and decompose complex
  technical issues. •        Develops secure, high-quality
  production code; reviews, debugs, and provides constructive
  feedback on code written by others. •        Identifies
  recurring issues and drives automation and remediation to
  improve the operational stability and resilience of
  applications and systems. •        Leads evaluation sessions
  with external vendors, startups, and internal teams,
  assessing architectural designs, technical capabilities, and
  fit within existing systems and enterprise information
  architecture. •        Builds and leads communities of
  practice across Software Engineering to promote adoption of
  emerging and leading-edge technologies. •        Contributes
  to an inclusive team culture that values diversity,
  opportunity, respect, and collaboration. •        Drives
  team adoption of enterprise-authorized AI-assisted
  engineering practices within the work environment to improve
  code quality, delivery speed, and operational outcomes
  (e.g., AI-assisted code review/refactoring, test strategy
  acceleration, incident/root-cause analysis support), while
  establishing consistent validation standards (secure coding,
  peer review, automated testing) and promoting reuse of
  effective patterns across the team. •        Applies
  knowledge of tools within the Software Development Life
  Cycle toolchain, including enterprise-authorized AI-assisted
  development and automation capabilities, to improve the
  value realized by automation.

  Required qualifications, capabilities, and skills

  •         Formal training or certification in software
  engineering concepts, plus 5+ years of applied experience •
  Hands-on software development experience with proven team
  leadership skills •         Advanced knowledge and
  experience with C#/.NET •         In-depth knowledge of the
  Capital markets and trading industry and their IT systems,
  plus practical cloud-native experience •         Advanced
  experience developing multi-threaded applications •
  Experience building middle-tier services at scale •
  Hands-on delivery across system design, application
  development, testing, and operational stability •
  Advanced understanding of Agile methodologies, including
  CI/CD, application resiliency, and security •
  Experience with message distribution technologies (e.g.,
  RabbitMQ, Kafka) •         Demonstrated experience leading
  effective use of approved AI-assisted software development
  tools (e.g., for coding, code review, test acceleration,
  troubleshooting) with the ability to set team expectations
  for validating AI outputs for correctness, performance, and
  security. •         Strong understanding of responsible AI
  use in engineering workflows, including data sensitivity
  considerations, secure handling of inputs/outputs, and
  adherence to resiliency and security expectations;
  experience coaching engineers on safe, compliant adoption
  within delivery practices

  Preferred qualifications, capabilities, and skills

  •         Experience working with Portfolio Management
  systems •         Ability to work in an Agile environment •
  Understanding of modern User Interface architecture and
  design •         English skills: advance

