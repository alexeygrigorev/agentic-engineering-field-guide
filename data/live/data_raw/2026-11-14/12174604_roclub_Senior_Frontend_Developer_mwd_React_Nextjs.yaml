description: |
  Senior Frontend Developer (m/w/d) React, Next.js &
  TypeScript

  HealthTech Startup in Berlin

  FULL-TIME | EMPLOYMENT CONTRACT

  LOCATION EUROPE | REMOTE

  WHO WE ARE

  We are a team of serial entrepreneurs and investors who have
  joint forces to build and scale roclub (top funded but still
  in stealth mode). roclub is a Teleoperation Platform for
  Medical Technology disrupting the way how MedTech is
  operated:

  - Health Organizations will be able to ensure the operation of
    their medical technology anywhere, anytime and for any
    exam.
  - Medical Technicians will be able to organize their jobs more
    flexibly, more independently and from anywhere in the
    world.
  - Patients will never again miss an exam or receive it late
    due to lack of medical technical staff and expertise.

  We build an international scalable SaaS platform with strong
  IoT focus.

  Being part of our team, you will get firsthand insights and
  sparring with experienced founders and get connected to the
  exciting HealthTech startup ecosystem.

  WHAT YOU'LL DO

  As an experienced developer (>5 years), you will work
  closely with the team and founders to further develop the
  teleoperation platform. You bring a wide range of experience
  with state-of-the-art frontend frameworks. You will be
  responsible for advancing the applications of roclub with a
  high standard of quality. You will also collaborate with the
  team to shape the technological roadmap, select and
  integrate tools, develop best practices, continuously
  improve and embed third-party tools into our existing app,
  and introduce new features—all with a keen eye for design.

  YOU'RE GOOD AT

  - Developing complex frontend apps with high demands on UX/UI
  - Approaching your tasks in a structured manner, Asking the
    questions, dig into details, take initiatives.
  - You are conscientious, reliable, and like to take on
    responsibility
  - People are impressed with your strong teamwork and
    communication skills. You’re friendly and kind
  - You are flexible and love to work from remote
  - Absolute trustworthiness and discretion are a matter of
    course for you

  YOU BRING (EXPERIENCE & QUALIFICATIONS)

  - Extensive experience in frontend development, particularly
    with TypeScript, React, Next.js and Tailwind CSS
  - Working knowledge of NextAuth.js / OAuth / OIDC, REST and
    Docker
  - Proficient in using Git and Git workflows for version
    control and CI/CD development processes
  - Migration experience in integrating a new backend API is a
    big plus
  - You enjoy working agile: hands-on mentality and pragmatism
  - Very good written and spoken English language skills
    complete your profile. German language skills are a plus
    as well as experience in vibrant start/scale up
    environments

  WHAT WE OFFER

  - Flexible working time
  - Remote or hybrid work in Berlin or Cologne
  - Attractive remuneration incl. company VSOP
