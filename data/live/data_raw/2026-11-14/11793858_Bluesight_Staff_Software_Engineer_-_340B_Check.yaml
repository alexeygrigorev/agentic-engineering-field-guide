description: |
  At Bluesight, our mission is to create groundbreaking
  solutions that increase efficiency, safety and visibility
  for health systems, hospital pharmacy, and pharmaceutical
  manufacturers.  We empower our customers to deliver the
  right medicine to the right patient at the right time, every
  time.  We are a high growth healthcare information
  technology company with a start-up 'vibe' but over 3,000
  customers using our proven solutions.



  Bluesight is looking for a Staff Software Engineer to help
  us redefine and grow our suite of healthcare data products
  in support of the company's mission of powering hospital and
  pharmacy operations. Our hospital and pharmacy customers
  rely on us to keep their patients safe and their pharmacies
  running smoothly while delighting them with every release.
  Through our controlled substance tracking platform, we're
  committed to improving medication management and compliance
  for our nation's healthcare providers; and our data
  operations and products are the backbone of that mission. On
  the 340BCheck team, you’ll be helping our customers ensure
  complete and continuous 340B program compliance through
  automated auditing across multiple data sources,
  comprehensive documentation, and centralized communication
  and collaboration.

  As a Staff Software Engineer on the 340BCheck team, you'll
  help lead technical direction; contributing to critical
  architectural decisions, elevating the team's collective
  technical execution, and driving cross-team initiatives that
  extend beyond any single feature or sprint. This is a
  technical leadership role, not a people-management one: your
  impact is measured by how much you help multiply the team
  around you, not just what you personally ship.

  You Can Expect To

  - Set technical direction for the 340BCheck team, designing
    work that spans multiple domains (front-end, back-end,
    data, ci/cd, infrastructure) over months, not sprints
  - Own critical architectural decisions for apps and services
    built on React & Typescript, Python & FastAPI, Terraform,
    built and deployed by CodeBuild; and guide the team on
    architectural choices.
  - Make critical technical and architectural calls within the
    timelines the team needs.
  - Drive proactive refactoring of services and application to
    help support 340BCheck as it scales.
  - Identify and resolve the hardest technical problems in the
    codebase; expert-level debugging across distributed
    systems and complex applications
  - Elevate the whole team's technical ability and execution;
    the goal is doubling (or more) the team's collective
    output, not just personal 5–10x contributions
  - Lead cross-team dependency management and coordinate cross-
    discipline efforts with Product, QA, and adjacent
    engineering teams while maintaining productive
    relationships across the organization.
  - Communicate large systems and technical tradeoffs clearly to
    both engineering and non-technical stakeholders, including
    in roadmap and planning conversations
  - Drive improvements in team culture
  - Influence at the Engineering Manager level; partner closely
    with your EM and fellow technical leads on team execution,
    hiring signal, technical roadmap, and provide technical
    guidance across the broader engineering team, not just
    direct collaborators.
  - Mentor senior engineers and serve as an escalation point for
    the team's most difficult technical challenges
  - Maintain a "customer service" mentality toward the rest of
    the team; your job is to help make everyone else's work
    better

  Required Qualifications & Skills

  - 9+ years of professional software engineering experience,
    with demonstrated depth across the full stack
  - Acute specialization in one or more areas (front-end, back-
    end, or infrastructure) combined with working knowledge
    across the rest of the stack
  - Track record of contributing to technical direction for a
    team and driving multi-month, cross-domain initiatives to
    completion
  - Strong understanding of relational database systems (MySQL),
    with experience designing for scale
  - Experience with Infrastructure as Code (Terraform) and
    owning production services end-to-end and driving
    observability (DataDog)
  - Demonstrated ability to influence architectural decisions
    across multiple teams, not just your own including long-
    term architectural direction.
  - Excellent communication skills; able to describe large
    systems and complex tradeoffs to non-technical
    stakeholders and drive alignment across teams
  - A leadership style rooted in service and collaboration: you
    measure your success by the team's output, not just your
    own
  - Experience using gen AI in your own work, and advising a
    team with a gen AI assisted workflow (implementation,
    reviews with a human in the loop, etc)
  - Experience mentoring senior engineers and building technical
    judgment in others
  - Comfortable co-leading technical direction alongside other
    senior technical voices on the team
  - Database administration experience, preferably AWS Aurora
    MySQL
  - Experience integrating Electronic Health Record (EHR) data
    into enterprise software
  - Prior experience in a regulated/compliance-driven healthcare
    or controlled-substance domain

  What You'll Get From Us

  - Ownership of problems of scale, technical debt, and security
    that shape what's possible in medication intelligence
  - Room to be creative and choose your own path
  - Trust in your sense of ownership
  - Dedicated budget for training and career development
  - Coworkers who you'll learn from, who will push you, and who
    are looking to learn from you

  This position is open to applicants in the continental
  United States.



  Why Bluesight?

  Bluesight’s culture is built on innovation and teamwork.
  There’s room to grow and opportunities to take initiative.
  You will partner with sharp, motivated teammates looking to
  disrupt a massive industry—and have fun doing it.  We truly
  believe that where you work and what you do matters.  Join
  us as we revolutionize the hospital pharmacy landscape!

  -Competitive salary

  -Time off when you need it – unlimited vacation days!

  -Generous insurance coverage

  -401k program with a company match

  -Fun, collaborative culture!



  EOE AA M/F/VET/Disability



