description: |
  Job Description

    Out of the successful launch of Chase in 2021, we're a new
  team, with a new mission. We're creating products that solve
  real world problems and put customers at the center - all in
  an environment that nurtures skills and helps you realize
  your potential. Our team is key to our success. We're
  people-first. We value collaboration, curiosity and
  commitment. As a Lead Engineer - Platform SDLC at JPMorgan
  Chase within the Platform SDLC team, you are the heart of
  this venture, focused on getting smart ideas into the hands
  of our customers. You have a curious mindset, thrive in
  collaborative squads, and are passionate about new
  technology. By your nature, you are also solution-oriented,
  commercially savvy and have a head for fintech. You thrive
  in working in tribes and squads that focus on specific
  products and projects - and depending on your strengths and
  interests, you'll have the opportunity to move between them.
  While we're looking for professional skills, culture is just
  as important to us. We understand that everyone's unique -
  and that diversity of thought, experience and background is
  what makes a good team great. By bringing people with
  different points of view together, we can represent everyone
  and truly reflect the communities we serve. This way,
  there's scope for you to make a huge difference - on us as a
  company, and on our clients and business partners around the
  world. As a Platform SDLC Engineer you will play a crucial
  role in designing, implementing, and maintaining automation
  solutions for software development processes. You will
  collaborate closely with cross-functional teams to identify
  automation opportunities, build out custom workflows, and
  develop utility tools to enhance productivity and efficiency
  across the organization. Building secure SDLC pipelines
  which perform Vulnerability scanning , ensuring an immutable
  artifact signed and testing evidence is validated. Working
  towards the long term aim of developing an Internal
  Developer Platform (IDP) building golden paths and enabling
  developer self-service.



  Job Responsibilities:

  - Design and implement automation workflows tailored to
    project requirements using GitHub Actions
  - Develop utility tools with Golang to automate tasks and
    streamline SDLC processes
  - Architect, configure, and manage CI/CD pipelines for
    reproducible builds and deployments
  - Monitor and optimize performance of automation workflows and
    tools
  - Create comprehensive documentation and provide training for
    development teams
  - Stay updated with emerging technologies in automation,
    CI/CD, DevOps, and DevSecOps
  - Integrate services, tools, and components to enhance systems
    thinking
  - Build secure SDLC pipelines with vulnerability scanning and
    artifact validation
  - Collaborate with software development teams to identify
    automation opportunities
  - Facilitate developer self-service through golden paths and
    custom solutions
  - Evaluate and recommend new tools and technologies for
    continuous improvement

  Required Qualifications, Capabilities, and Skills:

  - Demonstrated proficiency in building software build
    pipelines, ideally with GitHub Actions
  - Strong software engineering skills, with experience
    designing and coding services and utilities using Golang
  - Focus on automated testing and familiarity with TDD best
    practices
  - Proficient in using git SCM
  - Passion for working with cloud-based infrastructure systems
  - Enjoy integrating diverse services, tools, and components
  - Value systems thinking and collaborative problem-solving
  - Ability to create and maintain comprehensive documentation
  - Commitment to continuous learning and improvement
  - Strong communication and teamwork skills
  - Willingness to learn new technologies and adapt to changing
    environments

  Preferred Qualifications, Capabilities, and Skills:

  - Experience with Python, Java, or Kotlin in addition to
    Golang
  - Familiarity with Docker containers and Kubernetes
    environments
  - Knowledge of Google Cloud Platform (GCP) and Cloud Key
    Management services
  - Experience with infrastructure as code development pipelines
  - Understanding of DevOps and DevSecOps practices
  - Ability to build custom solutions when open-source options
    do not meet requirements
  - Comfort with innovation and selecting the best technology
    for each task

