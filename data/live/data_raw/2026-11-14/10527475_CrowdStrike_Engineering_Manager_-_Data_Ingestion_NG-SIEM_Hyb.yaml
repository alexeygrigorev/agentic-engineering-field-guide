description: |
  As a global leader in cybersecurity, CrowdStrike protects
  the people, processes and technologies that drive modern
  organizations. Since 2011, our mission hasn’t changed —
  we’re here to stop breaches, and we’ve redefined modern
  security with the world’s most advanced AI-native platform.
  We work on large scale distributed systems, processing
  almost 3 trillion events per day and this traffic is growing
  daily. Our customers span all industries, and they count on
  CrowdStrike to keep their businesses running, their
  communities safe and their lives moving forward. We're proud
  to work for a mission-driven company leveraging AI to
  transform the way we work. CrowdStrikers drive their careers
  through flexibility and autonomy while also being expected
  to contribute to a culture of responsible AI adoption,
  experimentation, and innovation. We use an AI-first mindset
  as a force multiplier to proactively and continuously
  accelerate execution, build expertise, uncover insights, and
  solve complex problems. We’re always looking to add talented
  CrowdStrikers to the team who have limitless passion, a
  relentless focus on innovation and a fanatical commitment to
  our customers, our community and each other. Ready to join a
  mission that matters? The future of cybersecurity starts
  with you.

  About the Role:

  We are seeking an Engineer Manager to be part of the GDI
  (Getting Data In) group under NG-SIEM with a focus on data
  ingestion at petabyte-scale. The group focuses on the data
  ingestion and onboarding experience for NG-SIEM customers,
  ingesting several petabytes of data per day across multiple
  regions from 300+ 1st party and 3rd party data sources.

  You will be driving our goal to scale to 100s of PB of data
  ingest per day at sub-second latencies. You will be leading
  a team of 6+ engineers focused on a building petabyte scale
  ingestion platform. You will have a chance to work on large-
  scale distributed systems. You will be leading key product
  initiatives that will require you to collaborate cross-team
  across other data platforms and product teams in
  CrowdStrike.

  This role is hybrid, requiring 2-3 days per week on-site
  from our NYC Office.  What You'll Do:

  - Lead a group of 6+ engineers to solve hard problems in
    distributed systems, including high availability,
    reliability, performance and cost optimizations to build
    an industry leading data ingestion platform.
  - Own the team’s roadmap and quarterly OKRs.
  - Instill and maintain a culture of operational excellence in
    the team to support globally available, multi-region
    systems in production. Help define and uphold the teams
    SLOs
  - Regularly engage with stakeholders such as product
    management, customer success and support.
  - Lead by example with customer and product focus.
  - Maintain a high bar for talent and accountability for the
    engineers in the team
  - Our systems and customers are operating globally and 24/7 so
    you must bring your excellent verbal and written
    communication skills to bear when you are working with
    teams across the globe. You’ll also travel a few times
    every year to meet with your teams and peers.

  What You'll Need:

  - Must be a U.S. Citizen or US Permanent Resident.
  - A strong technical background, including experience
    architecting, designing, and developing distributed
    systems products/releases, preferably in a large-scale
    cloud environment, across all phases of the development
    lifecycle.
  - 2+ years of experience managing teams of 6+ individual
    contributors and delivering multiple major milestones of
    products. Demonstrated track record of building strong
    engineering teams.
  - Demonstrated track record of operational excellence when
    operating services that span many components across
    several geographical regions.
  - History of positive impact on customer experience and
    business results.
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

  Bonus Points:

  - Experience in large-scale (distributed) system architecture,
    high scalability and availability, and optimization
  - Experience with Stream Processing, Kafka or similar
    technologies

