description: |
  About FlexTrade

  FlexTrade Systems is a provider of customized multi-asset
  execution and order management trading solutions for buy-
  and sell-side financial institutions. Through deep client
  partnerships with some of the world's largest, most complex
  and demanding capital markets firms, we develop flexible
  tools, technology and innovation that deliver our clients a
  competitive edge. Our globally distributed engineering teams
  focus on adaptable technology and open architecture to
  develop highly sophisticated trading solutions that can
  automate and scale with your business strategies.

  At FlexTrade, we hold our values close to heart, with pride
  and gratitude, as they guide us in everything that we do. We
  are dedicated to giving our clients a competitive edge,
  taking ownership of our responsibilities, being flexible to
  adapt to ever changing environment and technology, bringing
  integrity to every interaction and we continue to improve,
  grow together and collaborate as one team. All of these
  while having fun truly makes FlexTrade a wonderful place to
  work.

  The Team

  We are looking for a mid-level, skilled C++ developer to
  join our team. The ideal candidate will have experience
  working with low-latency products and trading workflows. The
  successful candidate will be passionate about finance and
  technology. You approach problems not only from a technical
  point of view, but also from the business aspect. As a C++
  developer, you will be responsible for designing, building,
  and maintaining a critical component in the middle office
  system and integrate with counterparties with this system.
  You will also be responsible for delivering continuous
  optimization for latency, scale, and resiliency
  improvements. We use agile scrum methodology to plan and
  manage our projects. We believe a great developer will pick
  up skills as needed.

  About You

  You will be part of a small close-knit team of engineers
  that work in an Agile and collaborative fashion to build
  performant software that sits at the core of FlexTrade's
  business. Working in close collaboration with client-facing
  teams, you will design and develop solutions for middle
  office enhancements & issues and assist teams in rollout to
  production.

  Responsibilities

  - C++ Development: Enhance and improve the middle office
    system
  - C++ Development: Integrate with third parties to the middle
    office system
  - Take ownership of specific modules within the system and
    work on bug fixes and enhancements.

  - Bachelors or Master’s Degree in Computer Science (or related
    field).

  - Minimum 3-4 years of professional software development
    experience using C++.

  - Proficient in C++ (Concurrent programming techniques: Shared
    memory, Atomics and lock-free data structures)

  - Strong understanding of data structures, algorithms, and
    software design principles.

  - Excellent problem-solving and analytical skills.

  - Working knowledge of Linux C++ development environment: vim,
    gdb, make, valgrind etc.

  - Experience working in Linux Environments with good command
    of shell, python, awk, sed

  - Motivation to understand/develop an understanding of various
    financial data elements and how they are used for trading
  - Ability to work collaboratively with a team and demonstrate
    passion for developing high-quality software.
  - Proven experience in hands-on development and deployment of
    significant components into production environments.
  - Strong analytical and debugging skills to support active
    production systems.
  - Excellent written and verbal communication skills, enabling
    effective internal and external client communication.
  - Ability to manage multiple initiatives concurrently.
  - Proficiency in collaborating with distributed users and
    development teams across different time zones.Does this
    sound like you? We would love to hear from you. Please use
    the link on this page to apply, and we will get back to
    you as soon as we are able. For more information visit
    http://flextrade.com or follow us on twitter and LinkedIn
    for the latest updates.

