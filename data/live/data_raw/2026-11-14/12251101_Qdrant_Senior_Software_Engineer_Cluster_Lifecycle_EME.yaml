description: |
  Qdrant is an open-source vector search engine powering the
  next generation of AI applications, from semantic search and
  retrieval-augmented generation (RAG) to AI agents and real-
  time recommendations.

  Trusted by global leaders like Canva, HubSpot, Tripadvisor,
  Bosch, and Deutsche Telekom, we’re building the retrieval
  infrastructure layer for modern AI. Recently raising $50M in
  Series B funding, we are growing rapidly and committed to
  transforming how AI understands and interacts with data.

  As a remote-first company, we believe diverse backgrounds,
  perspectives, and experiences fuel innovation. Here, you’ll
  own meaningful work, tackle challenges, and grow alongside
  passionate individuals dedicated to shaping the future of
  AI.

  The Team and Your Impact

  Qdrant Cloud is growing fast, and most of the new product
  features on our 2027 roadmap land with this team. That means
  a lot of new work: cross-region replication, disaster
  recovery and new ways to manage clusters.

  This role is for engineers who like hard distributed systems
  problems, write Go every day, and want their code to manage
  real customer databases in production.

  What You Will Own

  - Design and build features in our Kubernetes operator and
    control-plane services, in Go.
  - Own the full cluster lifecycle: provisioning, scaling,
    upgrades, configuration changes, backups and restores.
  - Design APIs and integrations that let people, and more and
    more AI agents, manage Qdrant Cloud.
  - Close the feature gaps between Hybrid Cloud and our managed
    cloud, and extend Private Cloud.
  - Make cluster operations safe by default: controlled
    rollouts, minimal disruption to customers and clear
    failure handling.
  - Take part in on-call for the services you build, including
    incident response and root cause analysis.
  - Work closely with other teams (Operations, Platform, and
    Billing & IAM teams, Product and Support).

  Who you are

  - 5+ years of software engineering experience, with a good
    part of it on infrastructure, platform or distributed
    systems.
  - Strong proficiency in Go.
  - Experience building Kubernetes operators, controllers or
    similar orchestration services (reconciliation loops,
    retries, recovering from partial failures).
  - Strong understanding of distributed systems: consistency,
    failure handling, replication.
  - Hands-on experience with at least one major cloud provider
    (AWS, GCP or Azure).
  - Experience designing APIs (gRPC or REST) and with CI/CD and
    automated testing.
  - Comfortable participating in on-call rotations and handling
    production incidents.
  - Ownership mindset and clear communication skills.

  Nice to have

  - Experience running stateful workloads or databases on
    Kubernetes.
  - Background in database, storage or DBaaS products.
  - Experience with backup, replication or disaster recovery
    systems.
  - Experience with Prometheus, Grafana, OpenTelemetry or
    similar tooling.
  - Contributions to open-source projects, especially in the
    Kubernetes ecosystem.

  Why join us

  - A remote-first, international team working on cutting-edge
    AI infrastructure.
  - A competitive salary with additional perks.
  - Flexible working hours and async-friendly culture.
  - High ownership and real impact.
  - Open-source, engineering-driven culture.
  - Choose your own laptop equipment.

  For US-based full-time employees, we also offer a
  comprehensive benefits package including 401k match, health,
  dental, and vision insurance, plus flexible PTO policy.

  Qdrant is an equal-opportunity employer. We believe the best
  ideas come from diverse teams, and we actively welcome
  applicants from all backgrounds. If this role excites you
  but you don't check every single box, we'd still love to
  hear from you! We don't want to miss out on great people
  because of a checklist.

  Come build with us!

  For information on how we handle your personal data, please
  refer to our Recruitment Privacy Policy #LI-REMOTE
