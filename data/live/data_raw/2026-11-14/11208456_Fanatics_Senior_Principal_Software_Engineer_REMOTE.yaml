description: |
  About Us

  Fanatics is a leading global sports platform redefining how
  fans connect with the teams, players and moments they love.
  Our businesses — Fanatics Commerce, Fanatics Collectibles,
  Fanatics Betting & Gaming, Fanatics Events, Fanatics
  Advertising, Fanatics Markets and Fanatics Studios —
  maximize the presence and reach for hundreds of partners
  globally and create a one-stop experience that allows fans
  to buy, bet, collect, and earn, while engaging with sports
  in deeper, more immersive ways. This includes licensed fan
  gear and lifestyle products, sportsbook and iGaming,
  physical and digital trading cards, live events, premium
  sports entertainment content, credit card offerings and
  more. Together, they form a powerful, integrated ecosystem —
  connected by the Fanatics ONE loyalty program and FanCash,
  the currency of sport — delivering personalized experiences
  to over 100 million fans worldwide. Fanatics holds
  partnerships with over 900 sports properties, from
  professional leagues and players’ associations to teams,
  colleges and retail partners; over 7,000 athletes and
  celebrities; and over 2,000 retail locations, including all
  Lids stores. Backed by a team of more than 22,000 employees,
  Fanatics is committed to relentlessly enhancing the fan
  experience.

  About the Team

  Launched in 2021, Fanatics Betting and Gaming is the online
  and retail sports betting subsidiary of Fanatics, a global
  digital sports platform. The Fanatics Sportsbook is
  available to 95% of the addressable online sports bettor
  market in the U.S. Fanatics Casino is currently available
  online in Michigan, New Jersey, Pennsylvania and West
  Virginia. Fanatics Betting and Gaming operates twenty-two
  retail sports betting locations, including the only
  sportsbook inside an NFL stadium at Northwest Stadium.
  Fanatics Betting and Gaming is headquartered in New York
  with offices in Denver, Leeds and Dublin.

  We’re hiring a Senior Principal Software Engineer to own the
  technical strategy and architecture for the Fanatics Betting
  and Gaming engineering team, driving the design and
  development of a highly scalable, fault-tolerant online
  platform. You'll work on critical areas such as Betting and
  Gaming market integration, risk management, tooling and
  other mobile/backed systems that deliver seamless customer
  experiences.. This leader will drive complex cross-team
  initiatives, establish scalable technical patterns, improve
  reliability and operational excellence, and partner across
  Engineering, Product, and Security to ensure our most
  critical services are reusable, compliant, high-performing,
  and built to support rapid innovation.

  Responsibilities

  - Set the technical direction for driving the design and
    development of a highly scalable, fault-tolerant online
    Betting and Gaming platform. You'll work on critical areas
    such as sportsbook market integration, risk management,
    tooling and other backed systems that deliver seamless
    customer experiences..
  - Lead architecture for critical, cross-cutting systems,
    ensuring solutions are scalable, resilient, secure, and
    built for long-term reuse.
  - Partner with Engineering, Product, and Platform leaders to
    shape priorities, sequencing, and technical trade-offs
    across multiple teams and domains.
  - Drive the design and execution of the organization’s most
    complex technical initiatives, especially those spanning
    teams, systems, and regulatory constraints.
  - Establish and elevate engineering standards, design
    principles, and review practices that improve quality,
    maintainability, and operational readiness.
  - Identify and resolve systemic technical risks, performance
    bottlenecks, and architectural contention, guiding teams
    toward pragmatic, durable solutions.
  - Mentor senior engineers and influence technical decision-
    making across the organization, serving as a trusted
    technical leader to executives and cross-functional
    stakeholders.

  Required Qualifications

  - 15+ years of software engineering experience, with deep
    expertise in backend and distributed systems.
  - Proven ability to set technical direction and influence
    architecture across multiple teams or domains.
  - Outstanding system design and architectural judgment,
    especially in complex, high-scale environments.
  - Deep experience building secure, reliable, and performant
    production systems.
  - Track record of leading large, cross-cutting technical
    initiatives from design through adoption.
  - Strong engineering judgment across scalability, operability,
    maintainability, and technical trade-offs.
  - Experience building platforms, services, or frameworks that
    create leverage across an engineering organization.
  - Excellent communicator with the ability to influence at both
    the technical and executive level
  - Must be open to occasional travel to Fanatics Betting &
    Gaming offices and other locations for conferences,
    events, meetings, and team-building activities

  Preferred Qualifications

  - Experience in one or more core platform domains such as
    identity and account systems, payments and transactions,
    loyalty and promotions, platform engineering, or developer
    productivity.
  - Experience with mobile cross-platform technologies eg Kotlin
    Multiplatform
  - Experience thriving in fast-paced, high-growth startup
    environments.

  If you possess some of these qualifications but not all of
  them, we still encourage you to apply!

  Depending on the role, your interview and onboarding
  experience may include in-person components, such as onsite
  interviews or Launching into Better: LIVE—a multi-day
  cultural immersion in New York City for full-time, non-
  seasonal hires. These sessions are designed to build
  connections and bring our culture to life, though specific
  travel and participation requirements will be confirmed
  based on your role and location. Your recruiter will provide
  clear guidance at each stage of the process.

  For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Ranges will change based on country and state of residence,
  which are reflected in Geographical Zones defined by
  Fanatics Betting and Gaming. The range incorporates all of
  our Geographical Compensation Zones and is subject to change
  as the Zone associated with the actual offer is confirmed.
  In addition to the base and bonus, full-time employment, and
  more. For information about our benefits, please visit
  https://benefitsatfanatics.com/

  Salary Range

  $230,000—$330,000 USD

  By submitting your application, you agree to our terms of
  service and acknowledge you have read our Candidate Privacy
  Policy.

  Fanatics will never ask candidates for money, banking
  information, or other sensitive personal information as part
  of the interview process. If you receive a suspicious
  message claiming to be from Fanatics recruiting, please do
  not respond and report it here.
