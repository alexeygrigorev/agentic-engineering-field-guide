description: |
  About Prove

  As the world moves to a mobile-first economy, businesses
  need to modernize how they acquire, engage with and enable
  consumers. Prove’s phone-centric identity tokenization and
  passive cryptographic authentication solutions reduce
  friction, enhance security and privacy across all digital
  channels, and accelerate revenues while reducing operating
  expenses and fraud losses. Over 1,000 enterprise customers
  use Prove’s platform to process 20 billion customer requests
  annually across industries, including banking, lending,
  healthcare, gaming, crypto, e-commerce, marketplaces, and
  payments. For the latest updates from Prove, follow us on
  LinkedIn.

  Prove is driving the future of digital identity. We are
  looking for Provers who know how to make an impact. We’re
  talking self-starting professionals who thrive in a fast-
  paced environment, process information quickly, and make
  intelligent decisions. The work is challenging and requires
  not only smart but natural curiosity and tenacity. Teamwork
  is also important to us – we work together and play
  together.

  Prove has big plans, and we’re excited about the future. If
  this sounds like the place for you – come join our team!

  Title: Senior Software Engineer, Knowledge Graph

  Department: Technology

  Reports To: Senior Manager, Engineering

  Location(s): East Coast, United States (Remote)

  Job Summary: We are looking for a Go and/or Java Senior
  Software Engineer to join our Identity Graph & Identity
  Manager team. Leveraging your knowledge and passion for
  excellence you will deliver well-thought-out software
  solutions as part of a fault-tolerant, scalable platform
  utilizing a variety of cutting-edge technologies. This is a
  hands-on role where you will need to demonstrate the skills,
  experience, and confidence to work with other engineers and
  product management team members to deliver solutions that
  will delight our customers.

  Key Responsibilities:

  - Engineering Excellence: Write high-quality, maintainable
    code, develop detailed technical documentation, and
    champion strong engineering principles within the team.
  - System Development: Design and develop microservices within
    a cloud-native, distributed architecture.
  - Problem Solving: Analyze, debug, and resolve production
    issues. Proactively engage in technical design
    discussions, including writing and reviewing RFCs for new
    solutions.
  - Technical Leadership: Mentor team members, participate in
    code reviews, and drive technical decisions. Own end-to-
    end features—from initial design and RFC creation to
    implementation and maintenance.
  - Collaborative development: Participate in the "Owner/Helper"
    project model; contribute as a lead owner for major
    milestones and actively support team members on their own
    initiatives.
  - Production Ownership: Participate in the team's on-call
    rotation to ensure operational stability and system
    reliability.

  Qualifications and Experience:

  - Software Development: 6+ years of professional software
    development experience, with a deep understanding of
    object-oriented programming (Java highly preferred).
  - System Design: Experience designing event-driven, robust,
    and scalable solutions for complex technical problems.
  - Cloud Proficiency: Hands-on experience with public cloud
    platforms (AWS, GCP, or Azure).
  - Data & Database Expertise: Proficiency in SQL (Postgres) and
    NoSQL (DynamoDB) with strong knowledge of design
    principles for both.
  - Education: Bachelor’s degree in Computer Science, a
    quantitative field, or equivalent practical experience.
  - Growth Mindset: A strong sense of curiosity and an ongoing
    commitment to evolving your technical and domain
    expertise.

  Preferred Qualifications

  - Streaming Technologies: Practical experience with Kafka and
    Flink.
  - Technical Leadership: Proven ability to influence team
    direction and long-term architectural decisions.
  - CI/CD & Testing: Ability to build automated test frameworks
    and CI/CD pipelines.
  - Modern Tech: Familiarity with AI and machine learning
    integrations.

  The anticipated base salary range for this role is:

  Metro 2: $190,000- 210,000

  Metro 3: $170,000-190,000

  Plus company bonus. Offered salary will be determined by the
  applicant’s education, experience, knowledge, skills, geo-
  location and abilities, as well as internal equity and
  alignment with market data.

  Prove follows a market driven compensation philosophy based
  on geographic location and respective market rates. Job
  offers will be aligned to location. Please speak with your
  recruiter if you have questions. Prove defines:

  - Metro 2 - NYC metro area, Seattle metro area, Los Angeles
    metro area, and the Miami metro area.
  - Metro 3 - all other cities across the domestic United
    States, with the exception of the San Francisco Bay Area.

  Benefits & Perks for FTE Provers:

  - Competitive salaries & Bonus Plan (for eligible roles) and
    Equity Plan
  - Modern Health for financial, mental, and physical wellness
  - 401(k) Retirement Plan & Match (US Offices) and Local
    Country Pension (International Offices)
  - Unlimited Vacation and Flexible hours
  - Comprehensive medical benefits for you and your family ❤️
  - Emotional & Physical Wellness – Access to wellness services
    (EAP & Prove Well-Being Reimbursement)
  - Bottomless snacks & beverages for certain office locations
  - Daily GrubHub stipend for lunch if coming into the office
    (US Offices)
  - A great place to work and connect with other talented
    Provers like yourself!

  Don’t meet every single requirement? Studies have shown that
  women and people of color are less likely to apply to jobs
  unless they meet every single qualification. At Prove we are
  dedicated to building a diverse, inclusive and authentic
  workplace, so if you’re excited about this role but your
  past experience doesn’t align perfectly with every
  qualification in the job description, we encourage you to
  apply anyways. You may be just the right candidate for this
  or other roles.

  Equal Opportunity Employment: Prove is an equal opportunity
  employer committed to providing equal employment opportunity
  for all people regardless of race, color, religion, gender
  or sexual orientation, age, marital status, national origin,
  citizenship status, disability, veteran status or other
  personal characteristics

  Privacy & Data Protection: When you are applying for a job
  at Prove, we collect and use your personal information in
  the job application process. To understand more about how
  Prove uses your personal information, please see our
  Recruitment Privacy Policy on our website.
