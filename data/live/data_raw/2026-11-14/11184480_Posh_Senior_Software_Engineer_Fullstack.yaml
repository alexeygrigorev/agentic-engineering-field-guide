description: |
  About Posh

  We are all social creatures, but the dominant “social”
  companies today have evolved into digital loneliness
  machines, driving isolation, anxiety, and mental health
  challenges around the world.

  Human connection is lost. Posh is a beacon guiding us back.

  Posh enables anyone to build an IRL community based on
  shared interests, while connecting consumers with the
  communities of people just like them. Founded by event
  organizers who were frustrated with the growing loneliness
  epidemic and the tools available to build their own event
  brand, we’ve built the ultimate platform for launching,
  monetizing, and finding IRL communities of people just like
  you. In just 6 years, Posh has grown to a team of 70,
  expanded to 10M+ users, secured $70m in venture funding, and
  facilitated over $400M in transactions.

  About The Role

  At Posh, you'll help shape our platform that brings people
  together through live events. Your work will directly impact
  how event organizers create experiences and how attendees
  discover and enjoy them.

  We're looking for someone who excels in both technical
  skills and leadership. You'll tackle exciting projects that
  push our platform forward. Some recent work includes
  building a system for users to follow each other, creating
  curated event playlists, and tools for affiliate event
  promotion. If you enjoy solving real-world problems and
  working in a fast-paced environment, you'll fit right in.

  This is an in-person position at our New York City office
  located in the heart of SoHo, where you'll be part of a team
  that's revolutionizing how people connect in the real world.

  Key Responsibilities:

  - Lead the architecture design and implementation of complex
    features.
  - Demonstrate full stack experience with specialization in
    either frontend, backend, or infrastructure while
    contributing to broader projects.
  - Collaborate on architecture and technical decisions that
    influence the direction of the platform, ensuring
    scalability, performance, and user-focused improvements.
  - Focus on performance optimization and system reliability,
    especially as our user base grows.
  - Build with data and analytics in mind which provides
    actionable insights for business leaders and event
    organizers.
  - Drive experimentation with MVPs, balancing rapid iteration
    with long-term sustainable growth and developer
    experience.
  - Contribute to either frontend design systems, database
    design, or dev ops/infrastructure to ensure scalable,
    secure, and maintainable systems.
  - Provide mentorship to engineers, fostering a culture of
    growth and collaboration.

  Ideal Candidate:

  - 5+ years of experience leading complex technical projects
    with significant business impact.
  - Strong expertise in a specific area (e.g., frontend,
    backend, or infrastructure) while maintaining broad
    knowledge of the full stack.
  - Proficiency in relevant technologies (e.g., React, React
    Native, Typescript, AWS or similar cloud providers), with
    experience in either mobile app development or backend
    systems.
  - Experience with scalability, performance optimization, and
    building tools that support data-driven decision-making.
  - Strong problem-solving skills and a passion for creating
    products that connect people in the real world.
  - Ability to lead initiatives, mentor others, and communicate
    effectively across technical and non-technical teams.
  - Experience working at consumer, social, or marketplace
    companies is a plus, as it speaks to our user-centric
    values at Posh.

  When applying, please include links to your GitHub profile
  or a portfolio of past projects.

