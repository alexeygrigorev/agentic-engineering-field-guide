  About the Role:

  CrowdStrike is looking for an engineering manager with a
  solid track record of building and operating large-scale
  backbone and cloud connectivity for hybrid infrastructure to
  join our Network Engineering team. In this role, you will be
  responsible for optimizing and evolving our backbone and
  cloud network infrastructure for scale.

  What You’ll Do:

  - Lead network engineering team and drive initiatives to scale
    our IP and Optical backbone while maintaining consistency
    and stability
  - Drive technical roadmap, cloud connectivity strategy and
    budget
  - Collaborate with internal service partners and advance the
    IP and Optical network architecture to meet our evolving
    service requirements
  - Actively engage with external vendors to discuss roadmap
    alignment, validate new designs or platforms, and lead
    post-mortem discussions on recent issues
  - Drive operational excellence and best practices in operating
    and scaling infrastructure
  - Drive backbone network automation strategy and development
  - Develop tools to enhance consistency across multiple hybrid
    clouds
  - Drive the development, testing and integration of new
    hardware and software platforms.
  - Participate in 24x7 on-call rotations

  What You Need:

  - 7+ years of experience in operating multi-vendor hyper-scale
    IP and Optical backbone, data center networks and public
    cloud networks (AWS, GCP, OCI, or equivalent)
  - Proven track record in managing global engineering teams and
    leading initiatives independently with minimal supervision
  - Expert in large scale backbone networking technologies and
    protocols such as DWDM, ROADM, MP-BGP, MPLS, RSVP, Segment
    Routing, IS-IS, QoS, MACsec
  - Experience with optical networks, core backbone routing,
    DDoS mitigation and other edge network services
  - Experience in managing network configs using scripts (bash,
    python) or automation frameworks (Ansible, Chef,
    Terraform)
  - Experience operating in FedRAMP or other regulated
    environments
  - Must be eligible for CJIS clearance (requires U.S.
    citizenship or Green Card/permanent resident status)
  - A strong track record of developing and improving tools,
    platforms, and infrastructure.
  - Experience with network simulation and testing tools
  - Experience in the automation of systems to reduce
    operational toil
  - Proven experience utilizing AI technologies to enhance
    decision-making, streamline workflows and processes,
    improve efficiency and drive business outcomes.

