description: |
  About Us:



  Waterfall is a prediction market-esque trading and pricing
  protocol. Waterfall allows users to trade chips to predict
  product prices, providing instant price discovery for both
  liquid and illiquid assets.



  Backed by Electric Capital and Pantera Capital, we are a
  lean, fast-paced team that cares about building an inclusive
  culture: beyond creating an impact in the space, we want to
  work together to make Waterfall the best choice for you and
  your future.

  Requirements:



  • Ability to build out interface in TypeScript, React, and
  NextJS

  • Knowledge in databases, DevOps, and backend development

  • Solid portfolio and/or extensive experience at a notable
  company

  • Strong user flow intuition

  • Great communication skills between team members

  • Passion about DeFi, financial derivatives markets



  Bonuses:



  • Interface design intuition

  • Knowledge in full-stack and/or protocol engineering

  • Understanding of solidity



  Responsibilities:



  • Design technical implementations of the Web-app

  • Work with product designer to translate prototyping to
  interface using TypeScript, React, and NextJS

  • Advocate for user experience ideas within the company

  • Write code with good practice and clear documentation

  • Advocate for ideas and improvements on potential features

  • Debug and test frontend code

  • Be flexible with schedule and duties; wear many hats

  • Collaborate with team members

  • Serve as a frontend lead or technical PM when necessary

  • Research and be caught up with new blockchain technologies



  Benefits:



  Our compensation package includes a base annual salary ($75k
  - $160k) and stock. Here are some benefits that we currently
  offer:



  • Health Insurance (Medical, Dental, Eye, Life)

  • Stipend to set-up work environment (e.g. any work gear)

  • Monthly co-working office pass

  • Paid travel for conferences and company off-sites

  • Unlimited paid time off



  If you are motivated and eager to take on the novel and
  challenging problem of pricing NFTs, we'd love to hear from
  you. Even if you are unconfident about certain skillsets but
  are passionate about the problem and willing to learn, apply
  anyway!
