description: |
  Why We Exist

  The future of healthcare will happen in the home. Home care
  providers today are drowning in chaos - spreadsheets, late-
  night calls, missed visits, caregivers churning at 80% a
  year. If no one fixes this, our parents will suffer and
  their children will burn out.

  Zingage is building the infrastructure so our parents can
  age with dignity, and their children can live without
  sacrificing everything. Every line of code here serves that
  mission. Learn more about out vision on:
  https://ArmTheHomeFront.com.

  Who We Are

  We are Francis Drake — pirates with responsibility. We move
  fast, bend convention, and take risks others won’t.

  We’ve already lived this problem: we went door to door with
  boxes of donuts to win our first customers. We literally sat
  inside agencies and became schedulers ourselves to feel the
  pain. At our first conference, we hired an actress off
  Craigslist to hustle leads — $200K in pipeline came out of
  it. We won our biggest partnership by sneaking into a
  WellSky user conference posing as customers, then backing it
  up with an SDK that outpaced every competitor.

  That’s who we are: scrappy enough to break through, serious
  enough to stand behind what we ship.

  About the Role

  We already power hundreds of healthcare sites and coordinate
  thousands of caregiver visits every week. Our system ingests
  breakdowns in real time — missed visits, caregiver no-shows,
  last-minute call-offs — and drives resolution loops with AI
  + human operators. The stakes are real: if our system fails,
  patients go without care.

  As an early-career engineer, you’ll work directly on these
  systems. This is not a training program — you’ll be writing
  code that reaches caregivers and patients within weeks of
  joining. You’ll be learning side by side with founding
  engineers who previously built at Uber, Datadog, Ramp, and
  Tennr — and who are now applying that experience to one of
  the most important problems in healthcare.

  What You’ll Do

  - Build AI agents that resolve care incidents — from missed
    clock-ins to caregiver no-shows — efficiently and
    accurately.
  - Work on voice AI where failure isn’t cosmetic: if it breaks,
    someone’s parent could be left alone.
  - Engineer deep EMR integrations (WellSky, AxisCare,
    AlayaCare), solving problems in data integrity, indexing,
    and real-time search.
  - Build closed-loop human + AI systems where operators and
    models collaborate to keep care running.
  - Ship into production fast, with stakes and leverage most
    engineers never see this early in their career.

  Who You Are

  - You’ve hacked projects from 0→1 — a weird app, a robot, a
    compiler, whatever — because you couldn’t not build.
  - You get excited by multi-agent systems, coordination under
    uncertainty, or voice AI where failure has real stakes.
  - You’ve gone deep on something unusual (research, side
    project, hobby) and obsessed until it worked.
  - You care about what happens if no one fixes home care — the
    weight of real impact motivates you.

  Why Zingage

  - Mission with weight. Every line of code you ship affects
    whether someone’s parent gets care.
  - Ownership from day one. You’ll work on core product — no
    training wheels.
  - Velocity. You’ll learn in months what would take years at a
    big company.
  - Trajectory. Backed by Bessemer and Ramp's Founder, scaling
    fast, defining the next decade of care.
  - Founder launchpad. When you’re ready to start your own
    company, we’ll invest up to $50K to help you launch.
