description: |
  This is a Senior Full Stack Engineer with an API focus in
  Data Solution. Looking for a hardworking, highly motivated
  Senior Engineer with strong expertise in analyzing existing
  solutions, designing new solutions and helping team members
  in building robust and scalable solutions using the best
  software design & development practices.

  In this role, you will be responsible for leading,
  engineering, & developing quality software components and
  applications for brokerage products. You will help drive and
  build our API strategy within the firm-wide Modernization
  initiatives. You will also apply and adopt a variety of
  cloud-native technologies for the products. In addition to
  building software, you will have an opportunity to help
  define and implement development practices, standards, and
  strategies.

  The Expertise and Skills You Bring

  - Specialization in crafting and developing solutions with
    matured languages like Java using frameworks like Spring
    Boot.
  - Proven track record as a Lead Engineer, crafting new
    solutions and maintaining the applications both on prem
    and in cloud (AWS).
  - Ability to work autonomously and engage with business
    partners in multiple aspects of solution.
  - 5+ years of Application using Java & Angular
  - 5+ years’ experience with REST API Design & Development
    using Java or NodeJS
  - 5+ years’ experience working with backend databases like
    Oracle, Cockroach as a part of API development
  - Expertise is bootstrapping new projects and setting up
    guidelines for the team.
  - Experience in Authenticating & Authorizing application &
    APIs using OAuth2 patterns
  - Expertise in following Agile SDLC
  - Demonstrable ability to develop solutions using TDD (Test
    driven development) & BDD (Behavior driven development)
    using Junit5, Cypress, Mockito & others.
  - Mastered in developing highly secure, scalable, readable and
    maintainable code quality adhering to the guidelines of
    OWASP using code styles, find bugs, SonarQube and secure
    code validation with Veracode and others.

  DevOps

  - Experience with Source code management using Git (Bitbucket)
  - Develop full stack applications using AWS cloud-platforms
    like R53, CloudFront, WAF, EC2, Lambda, CloudFormation,
    S3, IAM Roles, KMS, EKS, CloudWatch, SNS, SQS, Elastic
    Search and AWS NoSql database like DynamoDB.
  - Experience in writing and maintaining Kubernetes deployment
    files or helm charts.
  - Experience in IaC (Infrastructure as code) using cloud
    formation & terraform
  - Experience in Jenkins / uDeploy / Concourse
  - Expertise in using Docker & building docker images
  - Knowledge about in Unix/Linux operating systems and shell
    scripting
  - Knowledge in developing & deploying applications to
    Kubernetes cluster
  - Experience with building and maintaining CI/CD pipelines
    including software configuration management, test
    automation, version control, static code analysis.

  The Value You Deliver

  - Partnering with other technology collaborators to understand
    requirements to provide solutions
  - Designing scalable technical solutions, keeping in mind
    business requirements and architecture roadmap
  - Implementing Test Driven Design & Development in a CICD mode
    in support of DevOps
  - Prioritizing and functioning in a fast-paced environment
    with focus on quality
  - Willingness to seamlessly adapt to changing technology
    landscape
  - Identify technical debts, make remediation recommendations,
    and lead the efforts
  - Communicate effectively with extended teams

  Compensation, Benefits and Duration

  Minimum Compensation: USD 35,000 Maximum Compensation: USD
  123,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
