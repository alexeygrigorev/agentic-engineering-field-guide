description: |
  WorldQuant develops and deploys systematic financial
  strategies across a broad range of asset classes and global
  markets. We seek to produce high-quality predictive signals
  (alphas) through our proprietary research platform to employ
  financial strategies focused on market inefficiencies. Our
  teams work collaboratively to drive the production of alphas
  and financial strategies – the foundation of a balanced,
  global investment platform.

  WorldQuant is built on a culture that pairs academic
  sensibility with accountability for results. Employees are
  encouraged to think openly about problems, balancing
  intellectualism and practicality. Excellent ideas come from
  anyone, anywhere. Employees are encouraged to challenge
  conventional thinking and possess an attitude of continuous
  improvement.

  Our goal is to hire the best and the brightest. We value
  intellectual horsepower first and foremost, and people who
  demonstrate an outstanding talent. There is no roadmap to
  future success, so we need people who can help us build it.

  The Role: WorldQuant is seeking exceptional C++ developers
  to join our front office development team to further enhance
  and build our next generation trading platforms.



  What You'll Do:

  - Write low latency, high throughput C++ code
  - Implement mission critical trading infrastructure
  - Work with portfolio managers to implement new trading
    systems
  - Adapt existing systems to our next generation trading
    platform



  What You'll Bring:

  - A minimum of 4 years of writing high performance  C++
  - Modern C++ knowledge (C++17/20, etc)
  - C++ template meta programming knowledge
  - Possess in-depth knowledge of network programming and
    distributed computing
  - Strong knowledge of Unix/Linux fundamentals
  - Strong understanding of data structures and algorithms
  - Finance experience is preferred but not required

  Locations: Chicago, NYC, CT, or  Austin



  Our Benefits:

  Core Benefits:

  - Fully paid medical and dental insurance for employees and
    dependents, flexible spending account, 401k, fully paid
    parental leave, generous PTO (paid time off) that consists
    of:

  - Perks: Employee discounts for gym memberships, wellness
    activities, healthy snacks, casual dress code
  - Training: learning and development courses, speakers, team-
    building off-site
  - Employee resource groups

  Pay Transparency:

  WorldQuant is a total compensation organization where you
  will be eligible for a base salary, discretionary
  performance bonus, and benefits.

  To provide greater transparency to candidates, we share base
  pay ranges for all US-based job postings regardless of
  state.  We set standard base pay ranges for all roles based
  on job function and level, benchmarked against similar stage
  organizations.  When finalizing an offer, we will take into
  consideration an individual’s experience level and the
  qualifications they bring to the role to formulate a
  competitive total compensation package.

  The Base Pay Range For This Position Is $150,000 – $250,000
  USD.

  At WorldQuant, we are committed to providing candidates with
  all necessary information in compliance with pay
  transparency laws.  If you believe any required details are
  missing from this job posting, please notify us at
  WQHR_US@WorldQuant.com, and we will address your concerns
  promptly.

