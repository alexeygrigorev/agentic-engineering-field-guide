title: Senior Lead Software Engineer - FICC Electronic Trading Application Developer
company: JPMorganChase
location: London, GBR
work_type: FULL_TIME
company_size: 289,097 Employees
description: |
  Join a global electronic trading technology team building
  strategic, greenfield platforms used by markets businesses
  worldwide. You will help deliver a flagship next-generation
  trading application spanning pricing, execution, and risk
  management. You will work closely with business users and a
  geographically diverse team to solve complex problems end to
  end. If you enjoy modern architectures, performance-focused
  systems, and building reliable software at scale, you will
  find strong opportunities to grow here.

  As a Sr Lead Software Engineer, Electronic Trading
  Application Developer at JPMorgan Chase in the Fixed Income,
  Currencies and Commodities Electronic Trading technology
  team, you will design and build software that supports
  electronic trading across multiple products and venues. You
  will work with partners across product, project management,
  and analysis to translate requirements into complete
  technical solutions. You will develop and test software
  following standard SDLC practices and help define non-
  functional requirements. You will contribute to improving
  system reliability, performance, and development processes
  across the team.

  Job Responsibilities

  - Understand requirements, solve technical problems, and
    propose complete solutions
  - Design, develop, and test software following standard SDLC
    practices
  - Partner with project managers, business analysts, and
    management as a technical subject matter expert
  - Define and implement non-functional requirements, including
    performance and reliability considerations
  - Identify and drive improvements to systems and development
    processes

  Required Qualifications, Capabilities, and Skills

  - Proficiency in Core Java or C++ development
  - Working knowledge of Spring and SQL
  - Experience developing on Unix or Linux environments
  - Knowledge of unit testing practices and test automation
    fundamentals
  - Understanding of multi-threading, threading models, and
    messaging concepts
  - Understanding of low-latency, event-driven system concepts
  - Strong analytical and problem-solving skills
  - Ability to work effectively with globally distributed teams
    and stakeholders

  Preferred Qualifications, Capabilities, and Skills

  - Experience building trading applications in fixed income,
    macro, equities, or credit domains
  - Familiarity with front-end technologies such as C#,
    JavaScript, HTML5, or Angular
  - Knowledge of modern software architecture patterns and
    frameworks
  - Interest or experience in cloud computing, machine learning,
    or data science
  - Understanding of core computer science fundamentals,
    including operating systems, networks, data structures,
    and algorithms
  - Experience partnering with traders, sales, and operations
    teams

  Fixed Income, Currencies and Commodities Electronic Trading
  partners with global markets businesses to deliver
  electronic trading solutions across client and dealer
  markets. The team supports a broad product set, including
  rates, foreign exchange, commodities, and credit, and
  contributes across front-end tooling, pricing, low-latency
  market making, algorithmic execution, automated hedging,
  connectivity, risk management, and straight-through
  processing.

