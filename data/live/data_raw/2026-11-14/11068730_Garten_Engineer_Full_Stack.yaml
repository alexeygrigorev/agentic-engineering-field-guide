description: |
  At Garten, we are pioneering a modern approach to health and
  wellbeing in the workplace, because we know that a team that
  is filled with inspiration and equipped to face the day can
  change the world.

  Born from a desire to democratize wellness, we set the
  standard for healthier living in today’s workplace. Through
  curated nutrition to proprietary data analysis, we transform
  the way our client partners support their most important
  asset, their employees.

  In many areas of Garten, engineers have developed a deep
  understanding of the field operations and management it
  takes to deliver healthy food and beverage to our clients’
  offices. In this next era, we're at a much earlier stage in
  the evolution of our products. That means unprecedented
  challenges — and abundant opportunities to make far-reaching
  impact with our clients nationwide. Our vision is to set a
  new benchmark for the industry—driving innovation beyond the
  breakroom.

  Garten is looking for a senior full stack engineer with
  experience building web and mobile applications for
  enterprise and consumers.  You will help design, build and
  maintain scalable applications.  You have experience working
  closely with third party vendors, engineering teams and
  business stakeholders to understand the use cases and build
  end-to-end solutions.

  If you enjoy solving difficult problems with elegant and
  practical code or working closely with front-line team
  members to optimize workflows, this team is ready for you.

  Specifically, you will

  - Create simple and intuitive web and mobile applications
  - Design, develop and deploy integrated solutions
  - Own front-end and back-end development for your application
  - Own and manage all phases of the software development
    lifecycle (planning, design, implementation, deployment
    and support)
  - Design, build and maintain API infrastructure that allows
    for standard integration methodology between applications
    and third party/Netflix services
  - Collaborate effectively with product managers, designers,
    engineers and stakeholders on the projects
  - Communicate technical ideas and set direction on projects
    with a focus on solving business challenges
  - Being a champion for the customer and ensuring their needs
    always come first.
  - Mentor and support other members of the engineering team on
    a technical level

  About you

  - Senior-level full stack engineer with 5+ years of experience
  - Strong in Javascript, CSS, HTML, React, Node.js or other
    Javascript frameworks
  - You are self motivated and can work independently or partner
    closely with other engineers on a project.
  - You are passionate about building quality products and want
    to own product development end-to-end leading with the
    right design and development principles.
  - You have strong communication and collaboration skills.
  - You are a problem solver and like to challenge yourself with
    building the right scalable and high performing
    applications.
  - Experience integrating with internal and third party
    services
  - Strong knowledge of building restful APIs for internal and
    external products
  - You have knowledge of cloud computing platforms like AWS
  - Ability to work closely with internal stakeholders and
    vendors to understand their systems, build custom
    solutions, integrate with these systems and deploy the
    solution
  - Strong data structures, algorithms and design patterns
    knowledge
  - Demonstrable ability to work across multiple teams to
    deliver an end product Garten’s  mission is to empower
    people to live healthful and blissful lives.  Through our
    platform and services, we're building a different kind of
    company that connects employers to their employees. We
    focus on three core beliefs:
    - Work is changing, so must the workplace
    - Food is the foundation
    - Inspired employees radiate energy and drive creativity
