description: |
  | About us: Foodsmart is the leading telenutrition and
  foodcare solution, backed by a robust network of Registered
  Dietitians. Our platform is designed to foster healthier
  food choices, drive lasting behavior change, and deliver
  long-term health outcomes. Through our highly personalized,
  digital platform, we guide our 2.2 million members—including
  those in employer-sponsored health plans, regional and
  national Medicaid managed care organizations, Medicare
  Advantage plans, and commercial insurers—on a tailored
  journey to eating well while saving time and money.

  Foodsmart seamlessly integrates dietary assessments and
  nutrition counseling with online food ordering and cost-
  effective meal planning for the entire family, optimizing
  ingredients both at home and on the go. We partner with
  national and regional retailers across the U.S., many of
  whom accept SNAP/EBT, making healthier food more accessible.
  Additionally, we assist members with SNAP enrollment and
  management, providing tangible access to nutritious food. In
  2024, Foodsmart secured a $200 million investment from TPG’s
  Rise Fund, which supports entrepreneurs dedicated to
  achieving the United Nations’ Sustainable Development Goals.
  This investment will help us expand our reach, particularly
  to low-income workers who are disproportionately affected by
  diet-related diseases.

  At Foodsmart, our mission is to make nutritious food
  accessible and affordable for everyone, regardless of
  economic status. We are committed to a set of core values
  that shape our culture and work environment:

  👥 Customer First - You start with the member and work
  backwards. 🚀 Make It Happen - You act with urgency, use
  data, and hold high standards. 🤝 One Team - You collaborate
  with respect and commit as a group.

  Whether you're a dietitian, a commercial leader, or a
  technologist, working at Foodsmart means being part of a
  team that is passionate, supportive, and driven by a shared
  purpose. Join us in transforming the way people access and
  enjoy healthy food.

  | About the role: As a Staff Engineer at Foodsmart, you are
  a senior technical leader responsible for designing and
  scaling critical backend and data systems that power our
  consumer experiences, clinical workflows, and partner
  integrations. This is not a people-manager role. You will
  lead through technical excellence, architecture ownership,
  and influence across teams. You will partner closely with
  product, data, and engineering leadership to build
  resilient, secure, and scalable systems that meet enterprise
  and healthcare-grade requirements. You are expected to
  operate beyond a single team’s scope, drive cross-team
  technical initiatives, and elevate engineering quality and
  standards across the organization.

