description: |
  Standard Metrics is an AI-driven financial data platform
  that helps investors and their portfolio companies make more
  informed, forward-looking decisions with automated reporting
  and benchmarking tools. We’re a team of optimistic product
  builders on a mission to accelerate innovation in the
  private markets. Standard Metrics is backed by 8VC and Spark
  Capital, along with other leading VCs and angels, and is
  currently a trusted partner for many of the top VC/PE firms
  in the world.

  Come Build With Us

  We're looking to add a backend engineer to our team. You'll
  have an opportunity to have a big impact at this early
  stage, not only on the core product but also on the culture
  and direction of the company. We're looking for someone
  who's comfortable going outside their comfort zone and
  wearing many different hats. Strong experience building web
  applications is essential; if you've built them from
  scratch, that's even better.

  What You'll Do

  - Design, architect, and build Standard Metrics’ core product
    as a member of the engineering team
  - Take ownership of entire outcomes, and continue to support
    and grow them through iteration, documentation, and bug
    fixes (we do not have a QA team)
  - Collaborate with the product team in scoping and defining
    the features that will best help the company achieve the
    outcomes aligned with our goals and the values we believe
    in
  - Be an active contributor to the company culture and future
    hiring efforts

  What You'll Bring

  - 6+ years of backend development experience
  - Expertise in Python (with Django framework experience
    preferred)
  - Strong record of building and delivering web applications
  - Expertise in modern infrastructure (Kubernetes, Terraform,
    AWS, CircleCI, etc.) preferred, but not required
  - Understanding and adherence to modern software development
    practices (Gitflow, continuous integration, peer reviews,
    etc.)

  For our employees located in the USA, we aim to pay at or
  above the market rate of US-based tech hubs like San
  Francisco or NYC. For international roles, we aim to pay top
  of market for your country. Depending on experience, the
  estimated annual salary for this role is between
  $180,000-$225,000, plus a competitive equity package. Actual
  compensation will be determined based on experience and
  qualifications.

  Health and dental insurance: We cover you and your
  dependents' medical/dental/vision insurance 100% in the USA.
  Internationally we match local health coverage for you and
  your family.

  Flexible vacation: Take time off when you need it! We find
  most employees take 3-4 weeks in addition to holidays, but
  there are no firm rules. We trust our employees to know
  what's best for them.

  Paid parental leave: 12 weeks of paid leave for all new
  parents in the USA. Internationally we match parental leave
  standards in your area.

  Complete transparency: Everyone has full access to business
  metrics and financial information about the company.

  Regular offsites: While we are a remote-first company and
  build our communication, processes, and structures with a
  dispersed workforce in mind, we also love getting the team
  together. On a recurring basis, we fly the whole team out to
  an exciting destination to plan, bond, and innovate.



  We encourage you to apply even if your experience doesn't
  perfectly align with the job description as we seek out
  diverse and creative perspectives. Team members who love to
  learn and collaborate in an inclusive environment will
  thrive with us. We are an equal opportunity employer and do
  not discriminate on the basis of race, religion, color,
  national origin, gender, sexual orientation, age, marital
  status, veteran status, or disability status. If you need
  additional accommodations to feel comfortable during your
  interview process, reach out at
  recruiting@standardmetrics.io.
