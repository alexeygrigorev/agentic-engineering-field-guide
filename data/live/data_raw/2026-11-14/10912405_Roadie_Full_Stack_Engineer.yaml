description: |
  Roadie, a UPS company, is a leading logistics and delivery
  platform that helps businesses tackle the complexities of
  modern retail with unmatched delivery coverage, flexibility
  and visibility. Reaching 97% of U.S. households across more
  than 30,000 zip codes — from urban hubs to rural communities
  — Roadie provides seamless, scalable solutions that meet a
  variety of delivery needs.

  With a network of more than 310,000 independent drivers
  nationwide, Roadie offers flexible delivery solutions that
  make complex logistics challenges easy, including solutions
  for local same-day delivery, delivery of big and bulky
  items, ship-from-store and DC-to-door. For more information,
  visit www.roadie.com.

  This Full Stack Software Engineer will help build and evolve
  the web applications that power the driver experience at
  Roadie, while also contributing to RoadieXD™, our cross-dock
  solution, geospatial capabilities, and other foundational
  platform services. You’ll partner across Engineering,
  Product, and Operations to create intuitive, reliable
  experiences, solve complex logistics challenges, and build
  scalable systems that support millions of deliveries. If you
  enjoy owning features end to end, tackling challenging full-
  stack problems, and seeing your work make a meaningful
  impact, you’ll thrive in this role.

  What You’ll Do

  - Design, build, and test full-stack features that improve the
    experience of drivers on the road
  - Develop the APIs and services that support RoadieXD,
    geospatial capabilities, and other areas of the Roadie
    platform
  - Build internal and customer-facing tools, primarily in
    React, that help our operations scale efficiently
  - Partner with Engineering, Product, and Operations to solve
    complex logistics challenges and deliver high-impact
    features
  - Contribute to architecture and technical design decisions
    that improve platform scalability, reliability, and
    performance
  - Write clean, maintainable code supported by automated
    testing, thoughtful code reviews, and modern engineering
    practices
  - Improve existing systems by identifying opportunities to
    enhance performance, developer experience, and long-term
    maintainability

  Technologies

  - Frontend: TypeScript, JavaScript, React
  - Backend: Go and Ruby on Rails, with experience in other
    backend technologies welcomed
  - Data: PostgreSQL, Redis, Kafka
  - Infrastructure and DevOps: AWS, GitHub, Docker, Kubernetes,
    CircleCI

  What You Bring

  - 3+ years of professional software engineering experience
    building and shipping production applications
  - Experience developing scalable systems and APIs in
    production environments
  - Proficiency in at least one backend language, such as Go,
    Ruby, Java, C#, or Python
  - Experience working with a modern frontend framework, ideally
    React
  - A track record of building reliable, maintainable, and well-
    tested software
  - Strong problem-solving skills and the ability to navigate
    complex technical challenges
  - Sound technical judgment, with the ability to balance
    immediate needs and long-term maintainability
  - Strong communication and collaboration skills, with
    experience working across Engineering, Product, and other
    teams
  - Curiosity, ownership, and the ability to learn new
    technologies quickly

  Why Roadie?

  - Competitive compensation packages
  - 100% covered health insurance premiums for yourself
  - 401k with company match
  - Tuition and student loan repayment assistance (that’s right
    - Roadie will contribute directly to your existing student
    loans!)
  - Flexible work schedule with unlimited PTO
  - Monthly 3-day weekends
  - Monthly WFH stipend
  - Paid sabbatical leave - tenured team members are given time
    to rest, relax, and explore
  - The technology you need to get the job done

  This role is not eligible for visa sponsorship. Applicants
  must be authorized to work for any employer in the U.S.
