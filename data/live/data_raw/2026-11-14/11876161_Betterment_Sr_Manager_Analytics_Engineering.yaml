description: |
  About the Role

  Betterment’s Analytics Engineering team turns complex
  company data into reliable, well-modeled data products that
  support analytics, finance, marketing and other business
  needs across Betterment. The team works across the data
  lifecycle—from transforming and testing warehouse data to
  operating pipelines and enabling trusted data to flow into
  downstream systems.

  As Senior Manager, you will set the direction for this work
  and lead the people and operating model that make it
  reliable at company scale. You will grow a high-performing
  team of analytics engineers, shape a roadmap that balances
  shared foundations with business needs, and ensure our data
  products are accurate, understandable, observable, and
  useful. You will partner closely with Analytics, Data
  Platform, Product Engineering, Finance, Marketing, CRM, and
  Revenue Operations to turn business problems into scalable
  data capabilities.

  This role combines strategic leadership with technical
  judgment. You will stay close enough to the architecture and
  work to guide important decisions, while empowering your
  team to own implementation and outcomes. You will help
  Betterment build trusted data foundations for both decision-
  making and operational workflows. This role is based out of
  our NYC office. Below we've reflected the base salary range
  for this position. Actual salaries may vary depending on
  factors including but not limited to location, experience,
  and performance. The range listed is just one component of
  Betterment’s total compensation package for employees.

  - New York City: $180,000-$210,000

  This job may also be eligible for variable compensation in
  the form of a company incentive bonus.

  A Day in the Life

  - Set and communicate the Analytics Engineering vision,
    roadmap, and priorities, connecting data investments to
    business outcomes.
  - Lead, coach, and grow individual contributors; set clear
    expectations, support career development, and build a
    healthy, inclusive team culture.
  - Partner with Analytics and cross functional leaders to
    understand where trusted datasets, and self-service
    capabilities can improve workflows and reduce repeated
    work.
  - Work with Data Platform and Product Engineering to shape
    data contracts, upstream changes, warehouse models, and
    reliable pathways from source data to business-ready
    products.
  - Guide the design and evolution of dbt models, Airflow
    pipelines, data quality, documentation, monitoring, and
    deployment practices.
  - Balance roadmap delivery, incoming requests, operational
    support, and technical health; make tradeoffs visible and
    align stakeholders on sequencing and scope.

  What We’re Looking For

  - 8+ years of experience as an analytics and / or data
    engineer
  - 3+ years of experience directly managing a team of 4 or more
    analytics / data engineers
  - The ability to set technical direction for analytics
    engineering and coach engineers to lead execution.
  - Strong expertise in SQL, ETL/ELT using dbt,  data modeling,
    modern data warehousing, and the practices needed to
    deliver production-quality analytical data products.
  - An understanding of software engineering practices and
    workflows, including testing, version control, code
    review, deployment, monitoring, documentation, and
    incident management.
  - Experience working across data, product, engineering, and
    business teams, and can translate between stakeholder
    needs and technical requirements.
  - Experience making prioritization decisions across planned
    work, and urgent requests; communicating tradeoffs and
    keeping partners aligned.
  - A willingness to bring curiosity, sound judgment, and a
    continuous-improvement mindset to a changing data and
    technology landscape.
  - Experience with Airflow, cloud data warehouses, and reverse-
    ETL and CRM integrations is preferred; experience with
    equivalent technologies is also valuable.

  Join a team built on these core values

  We change lives

  Be a part of a community of innovators working to transform
  financial outcomes for real people. Your work will make an
  impact, always laddering up to our mission; to empower
  people to build wealth with confidence and ease.

  We set audacious goals

  We set them for the company, our customers, and ourselves,
  and we won’t stop until we reach them. We don’t just show
  up; we give our all, then celebrate our wins.

  We value all perspectives

  When we collaborate, we're at our best. We believe diverse
  perspectives lead to better outcomes and strive to uphold
  our supportive and inclusive community.

  We simplify financial services

  We’re financial services pioneers, always finding new ways
  to improve, optimize, and enhance. Constant improvement is
  in our DNA.

   Our Commitment to Your Total Well-being:

  - We offer a competitive suite of benefits, including medical,
    dental, and vision coverage; life and AD&D insurance;
    short- and long-term disability; infertility support and
    WPATH-aligned transgender health benefits; an Employee
    Assistance Program (EAP); transit benefits and FSA and HSA
    options
  - Ownership: Equity for all employees, including new hire and
    refresher grants.
  - Time: Flexible paid time off, paid parental leave, and a
    fully paid four-week sabbatical in your sixth year.
  - Growth: Company-paid professional coaching for all
    employees.
  - Wealth: Day-one 401(k) match plus matching on qualified
    student loan payments.

  What happens next

  We’ll take a few weeks to review all applications. If we’d
  like to spend more time with you, we’ll reach out to arrange
  next steps, which will include 3-4 sets of meetings with
  your future colleagues.

  In the interview process, we’ll look to learn more about
  your skills, experiences, capabilities, and motivators. Many
  of our questions will be aimed at understanding how you
  might operate here at Betterment. Depending on the role, we
  may ask you to complete a case study exercise or technical
  assessments, as we want to collect a robust set of data
  points to better inform our decisions.

  On average, it takes us around 3-5 weeks to make a hiring
  decision, depending on your availability and sense of
  urgency. As a best practice, we aim to interview at least
  2-3 final round candidates before making a hiring decision.
  Please note that, as we usually receive an overwhelming
  number of  applications for open positions, we’re unable to
  offer individual feedback during the interview process.

  We recognize that interviewing for a new role is a big deal.
  We appreciate you considering Betterment as the next step in
  your career, and our Recruiting Team is here to support and
  advocate for you through the interview process!

  Betterment is dedicated to providing accommodations to
  candidates upon request. If you need accommodations at any
  point throughout the interview process, please reach out to
  your recruiter.

  Please note that in any materials you submit, you may redact
  or remove age-identifying information such as age, date of
  birth, or dates of school attendance or graduation. You will
  not be penalized for redacting or removing this information.

