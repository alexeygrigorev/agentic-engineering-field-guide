description: |
  Company Description

  Blackbird Collective is an HR organization that helps
  startups and established companies find employees that match
  their current needs. We work on freelance and interim
  recruitment projects for clients based in Germany, most of
  which are located in Berlin.

  Our client is the leading online marketplace for top
  independent management consultants and industry experts in
  Europe.

  They are looking for an experienced Software Engineer to
  help the company transition from Meteor.js to a more modern
  architecture based on Typescript and React.js

  Job Description

  - Implementing new features using the latest JavaScript
    (ES2015), React and Meteor
  - Active participation in code reviews
  - Optimizing/refactoring parts of source code
  - Helping us automate testing by implementing a combination
    unit- and integration-tests
  - Contributing to continual improvement by suggesting
    improvements to code architecture, processes or
    development tools
  - Communicating and coordinating with other team members

  Qualifications

  - Advanced knowledge of Meteor, Blaze, and MongoDB
  - At least 5 years of experience in software development, and
    a minimum of 2 years with JavaScript
  - Experience working with at least one long term (2+ years)
    Meteor + Blaze production project
  - Proven ability and drive to navigate in foreign codebase
  - High focus on quality standards
  - Strong sense of ownership
  - React experience is an advantage (not a requirement)

  Additional Information

  We offer:

  - Proven business model with strong potential growth and the
    chance to fundamentally change the consulting industry
  - Autonomy and decision-making capabilities from day one
  - Great opportunities for personal development and focused
    career training
  - An ambitious and motivated team, working in a professional
    and fun environment
  - Flexible working models and an attractive salary package
  - Fresh fruit, drinks, and perks like gym memberships and
    product discounts
  - Amazing office space in Berlin and unforgettable team events
