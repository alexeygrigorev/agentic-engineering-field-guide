description: |
  About ko-br

  We give robots the ability to reliably perform mundane
  manufacturing work. We gather physical AI and embodied AI
  data from robots doing real factory tasks through human-in-
  the-loop teleoperation, reducing factory OPEX by 50% from
  day one. Today we sell the data, later, we will use that
  data to build our own foundation models so robots can do the
  work autonomously.

  The role

  You will build the software that makes it happen. Full
  stack. Whatever the mission needs.

  - Build teleoperation interfaces, robot data pipelines,
    backend services, and factory-facing tools.
  - Own the whole loop: talk to users, build it, deploy it, fix
    it.
  - Make software that holds up in real factories, not just
    demos.

  We want you if you solve problems like an owner. No ego, no
  blockers. Don’t say "it won’t work." Try it. Validate it.
  Ship it.

  Experienced engineer? Great. Recent grad? Apply if you’re
  itching to ship real products.

  Why join?

  - Generous base + equity.
  - Build from the ground up with real robots and real users.
  - Solve valuable problems today.

  Our team comes from Amazon, Meta, Microsoft, Universal
  Robots, Siemens, and the University of Cambridge.
