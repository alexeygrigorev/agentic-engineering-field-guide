  Senior Staff Software Engineer (Rails)

  The role

  BDG Media is seeking a Senior Staff Software Engineer with
  expertise in Ruby on Rails to lead, architect and build our
  Enterprise Resource Planning software, a key driver in
  automating and optimizing our internal operations and
  finance and delivering hundreds of millions of dollars in
  revenue annually.

  As the ideal candidate, you possess a forward-thinking
  mindset coupled with a hands-on approach, demonstrating
  strong ownership and a commitment to delivering impactful
  results.

  In this role, you will engage actively in the entire product
  lifecycle of our enterprise software - from the initial
  ideation phase through building, deployment, and ongoing
  enhancement and evolution. This process will involve close
  collaboration with various stakeholders, including planning,
  sales, ad ops, and marketing, to ensure that the system
  aligns perfectly with the operational and financial
  objectives of the company. Your role is crucial in
  transforming stakeholder requirements into functional,
  efficient, and user-friendly solutions.

  Responsibilities

  - Lead the architecture and development of our Rails-based
    internal Enterprise Resource Planning software, a
    cornerstone in our business infrastructure.
  - Collaborate with peers to build systems that are modern,
    intuitive, responsive, and visually appealing.
  - Participate in the entire product lifecycle, from concept to
    deployment, and ongoing enhancement.
  - Implement new functionalities while improving and
    refactoring existing code.
  - Drive architectural and solution design discussions,
    ensuring our infrastructure is efficient, fault-tolerant,
    and maintainable.
  - Work closely with a variety of stakeholders, including teams
    from planning, sales, ad ops, and marketing, to ensure the
    software aligns with the company's operational and
    financial goals.
  - Transform stakeholder requirements into functional,
    efficient, and user-friendly solutions.

  Qualifications

  - Minimum 5 years of software engineering experience, with a
    strong focus on Rails.
  - Demonstrated experience in building and scaling complex
    applications.
  - Proficient in designing robust and scalable database schemas
    and applications.
  - Adept at making strategic decisions that align with company
    goals and software development.
  - Exceptional problem-solving and analytical skills.
  - Well-versed in software engineering best practices and
    industry standards.
  - Excellent ability to collaborate effectively with various
    teams, including non-technical stakeholders.

  Disclaimer: It’s come to our attention that scammers are
  pretending to recruit and hire on behalf of Bustle Digital
