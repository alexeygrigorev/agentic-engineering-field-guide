  BDG is aware of individuals attempting to perpetrate scams
  by falsely representing themselves as BDG recruiters.  In
  some instances, the person may ask candidates to pay a fee
  to submit an application, pay for equipment, or share bank
  account information in order to receive a gift. BDG will
  never ask for financial information of any kind or for any
  payment during the job application process. BDG will never
  ask for personal information during the interview process
  such as passport number, bank account number, social
  security number. BDG will never ask you to receive and ship
  packages or goods during our interview process. Our
  recruitment process takes place by phone, via zoom, or in
  person.

  We urge everyone to exercise caution. If something feels off
  about your interactions, we encourage you to suspend or
  cease communications. If you are unsure of the legitimacy of
  a communication you have received, please reach out to
  hr@bustle.com and we will let you know if it’s legitimate or
  not.

