description: |
  Praia Health is a trailblazer in the health platform sector,
  committed to transforming the consumer health experience.
  Our mission is to revolutionize the way individuals engage
  with their health and well-being through cutting-edge
  technologies and user-centric digital solutions. By unifying
  disjointed touchpoints into an intuitive channel, we create
  trust and loyalty through digital engagement and believe
  that consumers and patients will more actively participate
  in their health outcomes.



  At Praia Health, you will join a team of seasoned
  professionals and technology enthusiasts dedicated to
  reshaping healthcare. Our dynamic includes:

  - Leadership with a rich background in technology and
    healthcare innovation.
  - Engineering and product teams comprised of industry veterans
    with a history of building impactful digital solutions.
  - A culture that values bold ideas, user-centric design, and
    the power of technology to improve lives.



  As we continue to grow and capture the market with our
  cutting-edge platform, we are expanding our team across
  various departments, including engineering, to further our
  mission and impact.

  Our team’s focus is managing the patient’s identity within
  the healthcare system and ensuring they have access to their
  medical records when they need them. We prioritize security
  and simplicity to remove barriers for patients when
  interacting with healthcare software. Join us and help us
  improve the patient's experience without compromising the
  security of their health records.





  We are looking for a strong technical engineer who wants to
  contribute to the long-term growth of a patient identity and
  access management solution. We’re a growth-stage startup and
  are looking for self-directed individuals to help us grow.



  Key Responsibilities:

  ·       Lead the design and implementation of features
  within an identity and access management solution, including
  both front end and back end.

  ·       Collaborate with other senior team members to build
  an architecture that can securely support millions of
  patients.

  ·       Work within an agile development process. Provide
  estimates, ensure that team deliverables are met on time and
  to a high standard.

  ·       Provide technical leadership and guidance to the
  team. Help mentor team members to create a culture of
  professional growth.

  ·       Conduct code reviews to ensure code quality,
  maintainability, security, scalability, and performance.

  ·       Bring recommendations for tooling, developer
  experience improvements and product improvements based on
  new technology trends and past experience.

  ·       Create and maintain technical documentation.

  ·       Other responsibilities as required.



  Qualifications:

  ·       Ability to work collaboratively in a cross-
  functional environment.

  ·       Excellent communication and collaboration skills,
  with the ability to work closely with cross-functional
  teams.

  ·       Strong understanding of software engineering
  principles, including design patterns, data structures, and
  algorithms.

  ·       Experience working in a fast-paced startup
  environment, with a focus on agile development and
  continuous delivery.

  ·       Experience with Typescript/JavaScript, NodeJS and
  React.

  ·       Experience with building services that maintain a
  high-level of reliability, security, and scalability.

  ·       Experience with Azure, Kubernetes, and Flux.

  ·       Experience with OpenID Connect, OAuth 2.0 and SAML
  specifications.

  ·       Experience with electronic health record systems.



  Benefits:



  ·       Competitive salary and performance-based bonuses.

  ·       Full medical, dental, and vision benefits.

  ·       Company-paid life insurance; company-paid short-term
  & long-term disability.

  ·       Retirement savings plans with company matching.

  ·       A supportive and inclusive work environment.

  ·       Employee wellness programs and resources.

  ·       Flexible PTO.





  If you are someone who enjoys taking ownership of a code
  base and collaborating with team members to build a secure
  and scalable solution, apply now and be part of a
  transformative journey at Praia Health.



  Praia Health is an equal opportunity employer and welcomes
  candidates from all backgrounds to apply.
