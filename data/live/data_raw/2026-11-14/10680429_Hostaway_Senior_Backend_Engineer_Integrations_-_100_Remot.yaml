description: |
  NOTE: This is a FULLY remote role, but the candidate must be
  within Europe to collaborate with their team, peers, and
  internal customers. You do not have to be in the specific
  country or city shown in this listing, but please only apply
  if you are physically based within Europe.

  Trusted by 20,000+ property managers worldwide, Hostaway is
  an industry leading, AI-powered vacation rental management
  platform designed for professional short-term rental
  operators. Hostaway brings everything together for greater
  efficiency and faster growth.

  Profitable, high-growth, and the first short-term rental
  property management software unicorn 🦄. Join us at our most
  exciting stage yet! Learn more about our recent valuation
  and story here.

  About the role

  Hostaway is seeking a highly motivated Senior Backend
  Engineer to join the Core team. This team is responsible for
  the integrations with our key partners (Online Travel
  Agencies). These integrations are critical to our customers’
  daily workflows, powering seamless connectivity between
  their properties and major booking platforms. If you’ve
  worked on similar tools that handle huge volumes and
  interact with a variety of complex APIs, you’ll be a great
  fit!

  What you'll do

  - Design, build, and operate backend services in PHP and Go.
  - Drive the extraction of services out of our monolith,
    defining clean boundaries, ownership, and migration paths.
  - Collaborate closely with the Product Manager to shape the
    technical direction and ensure our backend services
    deliver maximum value.
  - Design and ship APIs built for agentic interfaces — making
    our guest-facing domain consumable by AI agents and
    automated workflows.
  - Improve page speed and end-to-end performance, working
    closely with frontend peers since conversion depends on
    it.
  - Contribute to high-level architectural decisions and help us
    move quickly without accumulating regret.
  - Leverage AI to accelerate code delivery — we provide a
    Claude Team Premium subscription and expect engineers to
    use it well.

  - 6+ years of experience as a Backend Engineer, with a strong
    foundation in software engineering,
  - Strong-level proficiency in PHP and/or Golang, with a strong
    willingness to dive into both.
  - Proven experience designing and operating high-traffic,
    customer-facing systems.
  - Experience decomposing monoliths or extracting services,
    with a pragmatic view on when to do it (and when not to).
  - Solid experience designing APIs — REST, GraphQL, or similar
    — with an eye on clarity, versioning, and consumability
    (bonus if you've built APIs for AI agents or LLM-driven
    clients).
  - Familiarity with transitioning event-driven service-oriented
    architectures by applying Domain Driven Design (DDD)
    principles
  - Comfortable using AI coding tools (Claude Code, Cursor,
    Copilot, etc.) as part of your daily workflow, and able to
    get real leverage out of them.
  - Experience working in a Cloud environment (AWS is a plus).
  - Experience with message queues (e.g., AWS SQS) is a plus.

  What success looks like

  - Services are progressively extracted from the monolith with
    clear ownership and minimal disruption to delivery.
  - Performance (page speed, latency, uptime) becomes a
    measurable strength of the products.
  - Our domain is accessible through clean, well-designed APIs
    that agentic clients can consume reliably.
  - The team gets real productivity gains from AI-assisted
    development, without sacrificing code quality or
    ownership.
  - Cross-functional collaboration with Product and Design runs
    smoothly, with engineering contributing meaningfully to
    product direction.

  What we offer

  - Competitive Compensation: We offer competitive pay based on
    market rates in the country of the applicant.
  - 100% Remote: We have no physical offices. Work from your
    home office, a co-working space, or a dining room table
    anywhere in your country of residence. Visiting family or
    travelling? You can work from another country for a
    temporary stay with your lead’s approval. All of this is
    set out in our Remote Working Policy.
  - Yearly Team Offsite: Once a year, every department gets
    together in person to connect, build closer bonds, sharpen
    our strategy, and improve how we work together; often
    exploring a new location every year!
  - Equity: Every role in our company comes with valuable stock
    options in a fast-growing and profitable company. This
    ensures we all share in the company’s success.
  - Values-Driven Leadership: Our Core Values are not just words
    we’ve written to make us feel good. We leverage them daily
    when making strategic and tactical decisions.
  - Professional Growth: Our rapid growth offers unparalleled
    learning and development opportunities, along with a
    multitude of career advancement opportunities.
  - Annual Paid Leave: The specific amounts vary by country and
    are aligned with country and/or contract-specific norms.
  - Geographic Specific Benefits: As an international employer,
    we offer different country-specific benefits such as
    Health Insurance and Pensions in countries where these
    perks are customary. The specifics depend on the country
    of residence.
  - Dynamic Team Culture: As a global company with team members
    in over 40 countries, our diverse and international
    culture fuels our innovation and creativity, providing a
    key pillar to our success (and making it a lot of fun to
    work here).

  Thank you for your interest. If you apply for this role, you
  will receive an email from our Talent Acquisition team after
  your application has been reviewed alongside the
  qualifications for this role and the qualifications of
  others who have applied.
