description: |
  🚀 Overview

  Awarded is looking for a senior full-stack engineer to join
  our lean & elite team.

  🎯 What Will You Do In Your First 3 Months

  - Redesign fundamental data models to meet new product
    requirements
  - Expand our powerful reporting system to be even more user-
    friendly and configurable
  - Introduce novel automation to users to execute repeated
    workflows with just a few clicks

  💪 What Skills Do You Need To Succeed

  - Autonomy: You can take a problem from inception to complete
    solution, engaging the right people at the right times
    where needed.
  - Problem Solving: When faced with nebulous problems, you are
    able to discover, define, and strategize to deliver the
    best solutions for all of higher ed
  - Bias to Action: There is no such thing as "not your
    problem"; when you see something wrong, you own the
    problem

  ⭐️ Bonus

  - Startup Experience: We love to see people who are already
    familiar with the dynamics of a small team
  - Technology Experience: If you already have deep experience
    with technologies like Next.js, GraphQL, Postgres, etc,
    that's one less thing for you to learn! Plus you can help
    raise our internal standards to build the best software
    possible

  👥 Meet the Engineering Team

  We're builders at heart. At Awarded, our engineering team
  comes from schools like UPenn, Brown, and Carnegie Mellon,
  with experience scaling products at Bloomberg and high-
  growth startups like Dandy, Pinwheel, and Nextdoor. We move
  fast, ship smart, and stay close to the mission. No
  bureaucracy, no big-company bloat — just a team that cares
  about doing great work and having fun along the way.
