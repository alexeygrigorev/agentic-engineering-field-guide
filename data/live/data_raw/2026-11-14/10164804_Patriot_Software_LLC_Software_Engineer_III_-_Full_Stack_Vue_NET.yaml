description: |
  Let Us Introduce Ourselves

  We’re Patriot Software - a remote-first, product-led tech
  company on a mission to make accounting and payroll fast,
  simple, and affordable for millions of American businesses.
  With 175+ team members across the U.S. and a collaborative
  office hub in Canton, Ohio, we’re building software that
  empowers the backbone of the American economy.

  What We Believe In

  Creating great products starts with creating an environment
  where people thrive. That means connection, clarity, growth,
  high trust, and a culture where ideas move quickly and
  quality matters.

  Our team lives by six core values that guide how we work,
  build, and serve:

  - Be Customer Obsessed: We start with our customers and work
    backward to deliver exceptional value.
  - Lead With Speed: We move fast, take smart risks, and stay
    ahead by acting boldly.
  - Don’t Cut Corners: We own our technologies and operations to
    deliver a high-quality, end-to-end experience.
  - Create a Better Us: We simplify, automate, spend wisely, and
    continuously improve.
  - Follow the Golden Rule: We treat others with respect, invite
    feedback, and commit even when we disagree.
  - Grow, Be a Leader: We expect leadership at all levels and
    pursue excellence as a high-accountability, high-trust
    team.

  If this sounds like a place where you’d thrive, keep
  reading—your next opportunity might be here.

  Summary:

  - Job Title: Software Engineer III - Full Stack Vue & .NET
  - Job Status: Full-time
  - Location: Remote, with annual travel to HQ (Canton, OH)
  - Compensation: Salaried (Exempt)
  - Position Type: Direct Hire; note, this is not a contract
    role
  - Pay Range: $105K - $125K based on experience
  - Shift: Monday through Friday, 8 am - 5 pm ET
  - Travel: This role may include an on-site interview at our
    headquarters in Canton, Ohio, as well as annual travel to
    headquarters. Travel expenses are covered by Patriot
    Software.

  What You’ll Be Doing:

  As a Software Engineer III at Patriot, you'll design, build,
  and enhance the web applications that power our payroll and
  accounting software for business owners across the country.
  You'll collaborate closely with engineers and product
  partners, take ownership of increasingly complex features,
  and contribute to technical decisions within a modern,
  tested, and scalable environment. In this role, you'll be
  responsible for:

  - Designing, developing, and maintaining scalable web-based
    applications
  - Collaborating with other engineers and cross-functional team
    members to deliver business value
  - Participating in code reviews and technical discussions
  - Writing clean, tested, and well-documented code
  - Contributing to architecture and design conversations
  - Supporting and improving development practices (e.g., CI/CD,
    testing, monitoring)
  - Supporting production systems, including participating in
    on-call rotations as needed
  - Engaging in continuous learning and knowledge sharing within
    the team
  - Communicating progress, blockers, and risks in a timely and
    transparent way
  - Supporting Patriot's values through positive interactions
    with internal and external stakeholders

  Please note this is a sample of what you’ll be doing. This
  job requires you to be able to adapt to change quickly in
  order to deliver an exceptional customer experience. Your
  duties, responsibilities, and activities may change at any
  time with or without notice.

  What You’ll Need:

  - Bachelor’s degree in Computer Science or a related field, or
    equivalent practical experience
  - 4–7 years of professional software development experience
  - Professional experience with modern JavaScript Frameworks
    (preferably Vue.js)
  - Proficient in .NET Core, C#, and Entity Framework
  - Experience with databases (especially Postgres) and
    experience building transactional systems
  - Understanding of microservice architecture and cloud
    infrastructure (e.g., AWS)
  - A focus on performance, scalability, and reliability
  - Ability to work through requirements in a fast-paced
    environment, with support from senior engineers when
    needed
  - Strong communication and teamwork skills
  - Passion for continuous learning and improvement

  Work Requirements

  - This role requires sitting or standing for extended periods
    (8+ hours) while working on a computer, including
    prolonged screen time and extended, repetitive use of a
    keyboard and mouse.
  - To deliver a professional customer experience, this role
    requires a workspace that supports focused, distraction-
    free work and clear, quiet audio during scheduled hours.
    If you require a reasonable accommodation to meet this
    need, please let us know.
  - Maintain reliable, high-speed internet access sufficient to
    support phone, chat, and email-based work

  Nice to Have:

  - Experience with API Integration and Event-Driven
    Architecture.
  - Familiarity with financial technology or regulated
    industries
  - Prior experience contributing to large-scale or high-
    transaction systems

  Patriot Software is committed to providing reasonable
  accommodations to qualified individuals with disabilities.
  If you require an accommodation during the application or
  interview process, or to perform the essential functions of
  this role, please note this on your application, and a
  member of our People Operations team will follow up with
  you.

  Location & Commitments

  - Full-time, direct-hire, remote role. Note: This role may
    include an on-site interview at our headquarters in
    Canton, Ohio, as well as annual travel to headquarters.
    Travel expenses are covered by Patriot Software.
  - Open to candidates residing in and legally authorized to
    work in the United States
  - Not open to applicants residing in: Alaska, California,
    Hawaii, Washington D.C.
  - Core hours: 8 am–5 pm EST, Monday–Friday
  - Some flexibility is required during busy seasons or critical
    “right-now” moments

  Equal Opportunity

  Patriot Software is an equal opportunity employer. We make
  employment decisions based on qualifications, merit, and
  business needs. We do not discriminate against any employee
  or applicant on the basis of race, color, religion, creed,
  sex (including pregnancy, childbirth, and related medical
  conditions), sexual orientation, gender identity or
  expression, national origin, ancestry, age, disability,
  genetic information, military or veteran status, or any
  other characteristic protected by federal, state, or local
  law.

  We are committed to providing reasonable accommodations to
  qualified individuals with disabilities and to applicants
  and employees with pregnancy-related limitations. If you
  need an accommodation during the application or interview
  process, please contact People Operations.

  More Reasons to Love Patriot

  Great products start with great people—which is why we
  invest in our team so they can do their best work. In
  addition to a culture that encourages innovation and
  ownership, our full-time employees enjoy a comprehensive
  suite of benefits designed to help our team thrive inside
  and outside of work.

  - Paid time off, inclusive of vacation and sick time
  - Paid holidays
  - Medical, dental, and vision insurance
  - Section 125 HSA and FSA accounts
  - Benefits beginning the first of the month following hire
  - Company-paid life, short-term, and long-term disability
    insurance
  - 401(k) with company match
  - Up-to-date hardware and equipment provided
  - Flexible scheduling and opportunities for advancement
  - Engaging and collaborative company culture
  - Education reimbursement
  - Home office setup stipend after introductory period

  Are you ready to take the next step in your career?

  --

  Privacy Notice To protect the privacy of our customers and
  employees, please do not include sensitive Personally
  Identifiable Information (PII)—such as Social Security
  Numbers, Dates of Birth, or W-2s—when submitting your
  application.

  Use of AI in the Hiring Process Thank you for your interest
  in Patriot Software! To support a fair and efficient hiring
  process, we use AI-powered tools to assist with resume
  screening, note-taking, and interview insights. These tools
  help us evaluate candidates consistently and in compliance
  with EEOC and all applicable laws.

  AI tools do not make hiring decisions—all decisions are made
  by our human hiring team. All applicants are evaluated based
  on their qualifications, skills, and experience.

  By submitting your application, you acknowledge the
  following:

  AI Usage

  - AI may analyze an applicant's video, including facial
    expressions, as part of assessing position fit.
  - AI tools may be used during interviews for note-taking,
    evaluating responses, and generating interview summaries.

  On-Camera Video Interviews

  - All interviews are conducted via video with cameras on to
    maintain compliance and security standards.
  - Patriot is a camera-on company for all video interactions.

  Photo Capture for Security

  - If selected to interview, you may be asked to provide or
    have a photo captured.
  - This photo is used only to verify that the same candidate is
    present throughout all interview stages.
  - Photos are not shared externally, used for any other
    purpose, or stored after the interview process. They are
    securely disposed of once the process is complete.

  Privacy & Data Use

  - Any photos are used solely for candidate verification.
  - Geolocation tools may be used only to verify your location
    and ensure interview integrity.
  - All geolocation use is limited to security and compliance
    needs and follows all applicable privacy laws.
