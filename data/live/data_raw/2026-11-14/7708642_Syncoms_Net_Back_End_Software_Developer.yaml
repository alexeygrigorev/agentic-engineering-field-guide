description: |
  Job Description

  What’s in it for you?

  Within a year of working with us, you will be
  entrepreneurial, confident in your area of expertise, be
  amongst the top of your game and the envy of your peers.
  Many of our colleagues have moved onto exceptional
  leadership positions leading innovative tech projects. Our
  people are always considered elitist in any social
  environment and represent their craft in the most
  exceptional way. We will train you in every aspect of your
  field and give you the autonomy to take risk, venture and
  create and challenge yourself. You’ll learn, grow and
  develop every day.

  We have a fun and inspiring work environment. With offices
  in Quintessential Ruislip, Opulent Moorgate, Sunny Orlando
  (Florida) and Seasoned Bangalore (India) – we provide
  exceptional opportunities to the best of our staff in all
  locations. This opportunity exists in our London UK offices.

  We have a tech oriented, relaxed and dynamic culture. In our
  games area, our teams get to engage with VR, IOT, AI, Big
  Data and other technologies that we are incubating. You’ll
  have the opportunity to work on any of these internal
  projects.

  CANDIDATE PROFILE:

  We are looking for leaders with a passion for success,
  experts who are masters of their craft. Individuals with a
  desire to be excellent with an unyielding attitude. People
  who welcome new and more demanding challenges each and every
  single day. A dynamic, young and “hungry to learn” spirit
  exists, coupled with a positive, unstoppable, winning
  attitude.

  We are looking for a C# .Net back end developer to work with
  our team of .Net developers working on our global ecommerce
  web sites, portals and administrative tools.

  Technical Skills:

  · 3 years+ experience coding in .Net | C# | ASP.Net (Ideally
  5+ years)

  · Good working knowledge of SQL Server 2012 DB

  · SQL mid-level query structuring and refactoring knowledge

  · Knowledge about IIS (Internet Information Server)

  · MVC and TDD (Test Driven Development) experience is a
  preferred

  · Strong skills in JavaScript with experience with JQuery
  |Knockout.js | Angular.js |Node.js preferable & AJAX.

  · Experience in using Agile & Scrum software frameworks

  · Some knowledge is ideal in CSS 3 & HTML 5

  · Knowledge of good coding practices and standards

  · REST or Web Services experience

  · A foundation in Object Oriented Programming and
  Development (i.e. polymorphism, inheritance, inversion of
  control, etc...)

  · Unit level testing with Jasmine or any related

  · Understanding of high-transaction, online websites

  · Experience with Azure Cloud and Amazon AWS Cloud will be
  added advantage

  · Experience with Mobile App (Objective-C) and General App
  will be added advantage

  · E-commerce background preferred

  · Microsoft Certification is Desirable

  The role is primarily responsible for building MVC Web
  technologies using Microsoft .Net 4.5 | C# |ASP.NET | MVC |
  SQL Server 2012 | WCF Web Services | WCF Data.

  Languages / Libraries: .Net |C# | ASP.Net | JavaScript| XML
  | Augular.js | Node.js

  API’s: Various Web Services

  Cloud: Amazon S3 / EC2 & Microsoft Azure

  Frameworks: ASP.Net 4-6, MVC, HTML and Bootstrap

  DB’s: Ms SQL Server 2012

  Testing: Jasmine

  Tools: Jira, Git and GitHub, Bitbucket, Stack Overflow,
  Visual Studio Team

  Practices: Agile Software Development, Scrum

  Other areas of knowledge:

  Apache

  OpenStack

  SQL Server Reporting Services

  Network Security

  Hadoop

  What you'll be doing:

  · Working on a state of the art Object Oriented applications
  providing products and services to both B2B and B2C locally
  and internationally.

  · The key job role of the back-end developer is to ensure
  that the data or services requested by our front-end systems
  are delivered through programmatic means. You will be part
  of a team who are responsible to develop, enhance, optimise
  and maintain our back-end systems, which consists of the
  core application logic, databases, data and application
  integration, API and other back-end processes.

  · Develop software that operates within a highly scalable
  distributed multi-tiered system.

  · Participate and influence the technical aspects of our
  products and technical services.

  · Gain experience working in ecommerce, m-commerce, cloud
  architecture and train as a full stack developer. You’ll
  gain exposure to our iOS and Android Apps and you’ll have an
  opportunity to work on innovative VR, IOT and AI Projects.



  Personal Skills Essential

  · The ability to present complex technical topics to a non-
  technical audience.

  · Experience and a willingness to work in a fast-paced Agile
  software development environment.

  · Demonstrates self-motivation, ability to learn quickly and
  to apply learnings to solutions.

  · Proven track record of being able to solve complex
  problems independently and to seek out and generate
  innovative solutions.

  · Bachelor’s degree of higher in Computer Science or
  Engineering Background – Preferred Self-taught also welcome.

  Desired Personal Skills

  1. A high degree of coachability, flexibility and dynamism.

  2. A problem solver, which is challenged and driven by
  intricate problems

  3. Creative and Innovative mindset.

  4. A risk taker, wanting to break out and be heard. Someone
  who always stands out from the crowd.

  5. Strategic Thinker, always looking years ahead and
  focusing on a bigger game

  6. Someone who wants to make a difference and wants to
  contribute to the transformation of life. A value giver and
  a generous Human Being.

  7. A team player who wants to be part of a global company
  comprising over 300 global staff - working collaboratively
  to transform life.

  8. A fast-paced individual who is keen to learn and hungry
  to contribute.

  9. Analytical, energetic and passionate every day - driven
  by challenges and outcomes.

  10. Opportunistic and competitive yet always emphatic to the
  needs of others.

  About our Global Companies:

  Printerpix is part of a group of companies representing
  several eCommerce brands spanning USA and Europe. Our other
  international brands include Printerinks, Print Express and
  Clickinks. Our passion for technology has allowed us to take
  the eCommerce, photo-gifting, and print management markets
  by storm. We come to work to have fun and exert high energy
  and ambition each day, experimenting, being dynamic and
  fuelling our start-up culture.

   As a challenger brand, we act different and think
  different. Our success is driven by a collaborative culture
  that allows us to learn, take risks and try new things. We
  seek out innovative, creative people who desire to make an
  impact, belong, achieve and connect.
