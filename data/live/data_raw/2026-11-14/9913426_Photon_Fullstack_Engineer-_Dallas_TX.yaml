description: |
  Full Stack Engineer Role Overview

  We are seeking a versatile and highly skilled Full Stack
  Engineer to join our engineering team. This role is designed
  for a developer who excels in polyglot programming and is
  capable of building sophisticated, AI-driven applications.
  You will be responsible for the end-to-end lifecycle of
  complex systems—from architecting scalable Microservices and
  implementing cutting-edge Agentic AI workflows to crafting
  seamless user experiences across multiple modern front-end
  frameworks.

  Key Responsibilities

  - Polyglot Backend Development: Design and maintain high-
    performance server-side applications using Java (Spring
    Boot), Python (FastAPI/Django), and Node.js.
  - Modern Frontend Engineering: Develop intuitive, high-
    performance web interfaces using Angular, React, and
    Next.js, ensuring SEO optimization and efficient server-
    side rendering where applicable.
  - Cloud & Infrastructure: Build and manage cloud-native
    environments on AWS, focusing on serverless architectures,
    containerization (Docker/Kubernetes), and CI/CD
    automation.
  - Microservices Architecture: Deconstruct monolithic
    requirements into scalable, resilient microservices with
    robust inter-service communication (REST, gRPC, or Message
    Queues).
  - Data Analysis & Tooling: Utilize DB Analyst tools to monitor
    database performance, perform complex data modeling, and
    ensure data integrity across relational and NoSQL systems.
  - Full Lifecycle Ownership: Participate in the entire software
    development lifecycle, from initial requirements gathering
    and technical design to deployment and production
    monitoring.

  Technical Skill Set

  Backend: Java, Python, Node.js, Spring Boot, Express.

  Frontend: Angular, React, Next.js, TypeScript, Tailwind CSS

  Cloud(AWS): Lamda, EC2,S3, RDS, DynamoDB, API Gateway,
  Sagemaker

  Architecture: Microservices, Event-Driven Design, RESTful
  APIs

  Data & Analysis: DB Analyst Tools (e.g., DBeaver, SQL
  Profiler, Tableau), PostgreSQL, MongoDB

  DevOps: Git, Docker, Kubernetes, Terraform, Jenkins/GitHub
  Actions

  Qualifications

  - Extensive experience in full-stack development with a proven
    track record of shipping production-grade software.
  - Deep understanding of the trade-offs between different
    programming languages and frameworks.
  - Experience building and deploying autonomous AI agents or
    integrating LLMs into existing workflows.
  - Strong proficiency in managing complex AWS environments and
    distributed system patterns.
  - Ability to analyze database health and optimize queries
    using specialized analytical tooling.
  - Excellent communication skills and the ability to lead
    technical discussions across diverse tech stacks.

  Compensation, Benefits and Duration

  Minimum Compensation: USD 40,000 Maximum Compensation: USD
  142,000 Compensation is based on actual experience and
  qualifications of the candidate. The above is a reasonable
  and a good faith estimate for the role. Medical, vision, and
  dental benefits, 401k retirement plan, variable
  pay/incentives, paid time off, and paid holidays are
  available for full time employees. This position is not
  available for independent contractors No applications will
  be considered if received more than 120 days after the date
  of this post
