description: |
  What we do

  Adaptive is a vertical AI company of 50, building the
  agentic operating system for the $2 trillion U.S.
  construction industry. We work with over 1,000 customers,
  partner with over 50 accounting firms, and have raised $26m
  from Emergence, a16z, and other top funds.

  Why join us?

  Win a massive category that's up for grabs. Construction is
  among the least digitized industries left, and no AI king
  has been crowned. With our momentum, team, and backing, we
  are in position to be that company

  Build a moat that compounds. We orchestrate multi-
  stakeholder workflows across an industry that today runs on
  paper, email, and phone calls. Every process we manage
  generates data no one else has. That data makes each new use
  case easier to expand to, while building a compounding moat

  Work with the rare team that can pull this off. Winning here
  takes deep construction knowledge and deep AI fluency in the
  same room. That intersection is rare, and we have it with
  backgrounds across finance, technology, and construction

  Serve the people building the world around you. Your
  favorite local café. The new house on the corner. The
  massive new skyscraper at Central Park South. All built by
  our customers: skilled, creative people who have spent their
  lives bringing neighborhoods to life



  About the role

  We are excited to share this opportunity to join our growing
  team at Adaptive! Your technical expertise will be
  instrumental in guiding the direction of our engineering
  efforts and ensuring the delivery of high-quality software.

  Reporting to the VP of Engineering, you will work closely
  with our engineering and product team of 20, playing a key
  role in the architectural design, development, and
  optimization of our products.

  Responsibilities

  - Own the execution and delivery of backend- and
    infrastructure-focused projects in collaboration with the
    product and design team
  - Ensure backend systems are secure, scalable, resilient, and
    performant as we grow
  - Align technical solutions with business needs and product
    vision
  - Drive technical discussions and decision-making processes,
    ensuring alignment with overall company goals and
    technology strategy
  - Lead by example in writing high-quality, maintainable, and
    robust code

  Qualifications

  - 5+ years of experience in software engineering, with a
    proven track record in SaaS, fintech or related fields
  - Deep expertise in backend development, including service
    architectures, API design, data modeling, and modern
    software development practices
  - Demonstrated problem-solving skills and a passion for
    tackling complex technical challenges

  What we offer

  - Competitive salary plus meaningful equity
  - Comprehensive health, dental, and vision insurance
  - 401(k) match and flexible PTO policy
  - A seat at the table in a rapidly scaling vertical AI startup
  - Unlimited opportunities for professional growth and
    leadership

  In-office mandate

  - This role requires you to work Monday - Thursday in our
    sunny Union Square office.
