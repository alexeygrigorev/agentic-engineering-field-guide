description: |
  About Augment

  Augment is making private markets simple. We're a FINRA-
  registered marketplace where accredited investors can buy
  and sell shares in top pre-IPO companies, and where
  shareholders can get real liquidity before a public
  offering. With $1B+ in assets under management, we're
  building real financial infrastructure for a market that's
  long overdue for it. We're a profitable, fast-growing Series
  A company with a 10+ person engineering team.

  The Role

  We're expanding our web platform and this is a chance to
  join our frontend team and own meaningful work from day one:
  new features, new surfaces, and all the things that go into
  making an app people genuinely love to use. You'll
  collaborate closely with product, design, and backend
  engineers, working directly with people who want to invest
  in your growth. The codebase is modern, well-structured, and
  designed to make doing the right thing the easy thing.

  What you'll work on

  - Build new features end-to-end, from early design
    conversations through to shipping
  - Pair closely with teammates on hard problems, talk through
    strategy up front, and do real-time review when it counts
  - Work cross-functionally with product, design, and backend
    engineers on a daily basis
  - Develop and act on opinions about architecture, code
    quality, component design, and tooling
  - Contribute to and improve our component library, ensuring
    consistency across our platform
  - Taking ownership of your work end-to-end, with an eye toward
    the long-term health of the product and codebase, not just
    the next PR

  You'd be a great fit if you

  - Have a strong foundation in React and TypeScript, enough
    that you can hit the ground running even if you're still
    growing
  - Are comfortable working with a modern component library
    ecosystem (Storybook, shadcn, Radix, Tailwind)
  - Takes feedback gracefully yet is confident enough to
    vocalize when they think they're right
  - Ask thoughtful questions and are unafraid to make and learn
    from mistakes
  - Take genuine pride in what you ship, because the details
    matter to you
  - Embrace hard problems and dig in rather than looking for the
    easy path out
  - Thrive when working closely with others: you like thinking
    out loud, pairing, and building shared understanding
  - Want to grow fast in an environment that will challenge and
    support you

  How we think about AI-assisted development We use AI tools
  throughout our workflow, including Claude Code for
  development, AI-assisted code review, and various
  integrations across the company. We want all of our
  engineers to become comfortable with these tools and develop
  real opinions on how to use them most effectively. What we
  care about is judgment. AI can accelerate great engineers
  significantly, but it can also produce convincing-looking
  code that's subtly wrong. We want someone who knows the
  difference: who uses these tools to go faster, not to think
  less.

  Our Web Frontend stack

  - React with Next.js for modern, performant web applications
  - TypeScript for type safety and developer experience
  - Storybook as our component development environment
  - Home-grown component library built with shadcn/ui and Radix
    primitives
  - Tailwind CSS for styling
  - Modern build tooling and testing practices

  Our interview process

  A hiring manager intro call, a live frontend coding session,
  a virtual onsite with the team, and a final conversation
  with leadership. We aim to make the process straightforward
  and respectful of your time.

  Benefits

  - Competitive salary
  - 100% employer-paid medical, dental, and vision
  - Flexible PTO
  - Remote-first with offices in Austin and New York
  - 3 team offsites per year
