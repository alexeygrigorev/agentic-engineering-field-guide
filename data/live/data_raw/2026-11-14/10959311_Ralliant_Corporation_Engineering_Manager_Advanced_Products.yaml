description: |
  The Engineering Manager, Advanced Products leads a
  multidisciplinary team of experienced electrical and
  mechanical engineers focused on translating customer and
  market opportunities into product concepts and enabling
  technologies. This role is well suited for an accomplished
  electrical engineering leader ready to expand their impact
  from individual technical contribution to full-time team
  leadership. The manager guides requirements, technology
  evaluation, concept development, and technical risk
  reduction while developing a team capable of solving
  increasingly complex problems with greater rigor and
  independence.

  Essential Functions:

  - Lead advanced product development from opportunity through
    concept design freeze, translating customer needs into
    technically sound, well-defined product concepts ready for
    Product Realization.
  - Build and lead a high-performing multidisciplinary
    engineering team, developing Senior and Principal
    engineers into stronger technical owners and independent
    problem solvers.
  - Guide sensing, electronic, and electromechanical product
    development, bringing strong electrical engineering
    judgment while leveraging specialized expertise across the
    team.
  - Drive technical discovery and risk reduction through
    requirements development, architecture, analysis,
    experimentation, prototyping, and early validation.
  - Shape technology roadmaps and product architectures by
    identifying capability gaps, reusable technologies,
    platform opportunities, and paths to develop or acquire
    needed capability.
  - Partner with Product Management to connect customer and
    market opportunities with technical possibilities,
    feasibility, and readiness.
  - Lead through technical judgment rather than individual
    heroics, challenging assumptions, facilitating tradeoffs,
    and raising engineering rigor while maintaining ownership
    within the team.
  - Ensure strong transition to Product Realization through
    clear requirements, technical direction, understood risks,
    and mature product definitions.
  - Extend technical capability through external awareness and
    partnerships, selectively engaging customers, suppliers,
    universities, and emerging technologies.

  Critical Success Factors:

  - Creates stronger product concepts through clearer
    requirements, better technical definition, disciplined
    learning, and earlier risk identification that improve
    downstream execution.
  - Builds deeper technical capability throughout the team,
    developing strong technical owners while reducing
    dependency on individual experts.



  Education & Experience Required:

    * Bachelor’s degree in Electrical Engineering or closely
  related engineering discipline, with 7+ years of progressive
  experience developing electronic, electromechanical,
  sensing, instrumentation, or similarly complex products.
  Master's degree preferred.

  - Demonstrated progression from strong individual contributor
    into technical or team leadership, such as Lead, Senior,
    Principal, Chief, Project, or supervisory
    responsibilities. Prior formal people-management
    experience is not required.
  - Strong electrical engineering foundation with sufficient
    multidisciplinary breadth to lead experienced electrical
    and mechanical engineers and engage credibly in system-
    level technical decisions.
  - Demonstrated experience developing products from early
    requirements and concept development through design,
    validation, and execution.
  - Experience translating customer or market needs into
    requirements, evaluating technical alternatives, and
    maturing early ideas into credible product concepts.
  - Demonstrated ability to reduce technical uncertainty through
    analysis, experimentation, prototyping, testing, and
    structured engineering problem solving.
  - Experience developing others through technical leadership,
    mentoring, coaching, design reviews, or team leadership
    while enabling engineers to maintain ownership of their
    work.
  - Strong cross-functional collaboration skills with experience
    working across Product Management and other functions
    involved in bringing engineered products to market.



  Additional experience considered a plus:

  - Experience with sensor, instrumentation, embedded
    electronics, measurement, or controls technologies.
  - Exposure to technology roadmapping, product architecture,
    platform development, or external technology partnerships.
  - Familiarity with electrical and mechanical engineering
    design environments; Altium and SolidWorks experience
    preferred.



