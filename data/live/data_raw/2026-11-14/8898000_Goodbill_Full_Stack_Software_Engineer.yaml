description: |
  About Goodbill

  At Goodbill, our mission is simple: drive down the cost of
  hospital care for everyone.

  Americans and their employers spend nearly half a trillion
  dollars every year on hospital care, with a meaningful
  portion wasted on unnecessary services, billing errors, and
  administrative friction. Goodbill uses AI and software to
  remove those costs, identify overspending, and empower
  patients to actively participate in their care.

  Our approach has been recognized widely. TIME Magazine named
  Goodbill one of the Best Inventions of 2023, highlighting
  our ability to flag unnecessary services and negotiate waste
  out of hospital bills. Since then, we’ve expanded to serve
  over 5,000 employers and 250,000 patients, partnering deeply
  with TPAs to deliver savings upstream for self-funded plans.

  Along the way, we’ve earned accolades like the BBB Spark
  Award and the Front CSAT Award (2025) for outstanding
  customer satisfaction, while drawing attention from national
  press. Backed by top venture firms including Eniac, Maveron,
  Founders’ Co-op, Reach Capital, and Liquid2, we’re building
  the trusted infrastructure to make hospital care cost less.

  About the role

  We’re hiring a Full Stack Software Engineer to build and
  scale the systems that power Goodbill — from massive
  healthcare data pipelines to seamless, consumer-grade member
  experiences.

  You’ll ship across the stack daily, working on everything
  from backend automation and agentic AI workflows to pixel-
  perfect frontend interfaces. You’ll make our data
  infrastructure smarter and more automated, integrate with
  diverse sources like regulatory filings, APIs, and EHRs, and
  craft member-facing products that feel as delightful as any
  top consumer app. You’ll also be a key partner across
  Goodbill, working closely with Product, Client Success, and
  Operations to ensure what you build moves real dollars in
  the healthcare system and delivers immediate value to
  patients and employers.

  You will:

  - Build across the stack. Write both frontend and backend code
    daily. Our stack is Ruby, HTML, CSS, and JavaScript with
    Rails, SCSS, and Hotwire. Experience in these is great,
    but not required — what matters is excitement to work in
    this environment.
  - Ship agentic AI features. Design and build AI-driven
    products and workflows with autonomous/agentic behavior.
    Bonus if you’ve built agentic AI products in production;
    barring that, you’ve played with personal projects and can
    show the spark.
  - Work with diverse data sources. Maintain and further
    automate our existing hospital price data pipeline, and
    extend it with other sources: regulatory filings,
    government datasets, third-party APIs, EHR integrations,
    and even web scraping.
  - Build consumer-grade experiences. Any member-facing software
    you touch needs to be seamless, fast, and delightful —
    because healthcare users deserve consumer-quality design.
  - Own what you build. We believe no engineer should support
    code they can’t change. You’ll maintain the systems you
    write, and your teammates will do the same.

  You are:

  - Equally fluent in product and architecture. You sweat the
    details on pixels and abstractions — your code and your
    design decisions are elegant, intentional, and durable.
  - Fast and fearless. Startups are a sprint and a marathon. You
    know when to hack, when to harden, and how to keep
    velocity high without sacrificing long-term quality.
  - Agentic AI curious (and capable). You’ve built, or want to
    build, products that go beyond prompt-response —
    orchestration, planning loops, autonomous flows.
  - Ground-floor ready. You’re energized by the idea that
    nothing exists until you build it. The hard parts don’t
    scare you; they motivate you.
  - Collaborative. You’ll work closely with Product, Operations,
    Sales, and Client Success to ship features that move real
    dollars in the healthcare system.

  Bonus

  - You’ve built and shipped agentic AI products in production
    (personal projects also count).
  - Experience with EDI (Electronic Data Interchange) standards
    — X12, 837s/835s — is a plus, but not required.
  - You’ve built in healthcare, fintech, or other regulated
    domains.
  - You’ve worked in an early-stage startup (pre-
    seed/seed/Series A).

  Why Goodbill

  - Massive problem, huge upside. Americans and employers spend
    nearly half a trillion dollars a year on hospital care —
    much of it wasted. We’re fixing that with AI and software.
  - Recognition + traction. Named one of TIME’s Best Inventions
    of 2023; serving 5,000+ employers and 250,000 patients;
    backed by top VCs (Eniac, Maveron, Founders’ Co-op, Reach
    Capital, Liquid2).
  - Technical challenge. At Goodbill, you’ll work at two
    extremes: massive, messy data ingestion and automation and
    consumer-grade, member-facing software that must feel
    seamless and delightful.
  - Ground-floor opportunity. As an early engineer, you’ll have
    outsized impact — shaping architecture, culture, and
    product direction.
  - Mission-driven team. We live our values: do it for the
    patient, lead without ego, be transparent, own it, move
    quickly, sweat the details.

  We offer

  - Competitive pay (cash and equity)
  - Unlimited PTO (Seriously — it’s not an empty benefit. We
    work too hard for anything else.)
  - Health, dental, and vision plans covered 100% for you and
    50% for dependents
  - A monthly personal trainer through Future
  - Internet or co-working space stipend
  - Primary care membership stipend
  - Remote office equipment stipend
  - Quarterly team retreats

  Visit our About Us page to learn more about Goodbill, our
  mission, and what it’s like to work with us.

  Goodbill, Inc. is an Equal Opportunity Employer. All
  qualified applicants will receive consideration for
  employment without regard to race, color, religion, sex,
  sexual orientation, gender identity, national origin, or
  protected veteran status and will not be discriminated
  against on the basis of disability.
