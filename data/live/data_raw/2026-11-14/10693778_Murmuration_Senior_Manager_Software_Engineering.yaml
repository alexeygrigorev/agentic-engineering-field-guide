description: |
  Who We Are

  At Murmuration, we believe that America's promise is shaped
  and reshaped by the best ideas and ideals of its
  communities, and the dreams of the people who believe in a
  better life for themselves, their families, and each other.

  We help organizations build power in their communities in
  four key ways: We organize a network of values-aligned
  partners; we provide deep, data-driven insights into people,
  places, and perspectives; we develop tools that make
  organizing and engagement easy and more effective; and we
  offer services that strengthen our partners' capacity to
  lead change in their communities.

  We envision an America where every community has what it
  needs to help people lead healthy, free, and dignified
  lives. We work to redesign the systems and structures we all
  depend on — how we learn, live, govern, and solve problems —
  so that they are just, equitable, resilient, and rooted in
  shared responsibility. By strengthening the ties that hold
  communities together, we aim for civic life defined by
  collective action and care, with effective leadership that
  truly represents everyone.

  We are a collaborative, curious, and creative team of
  organizers, scientists, teachers, technologists, campaign
  veterans, and more who share the unwavering belief that we
  can use our gifts in service of transforming America —
  together.

  We've built our team guided by the belief that the whole is
  greater than the sum of its parts. And so we support each
  other relentlessly — rallying together to face challenges
  the same way we celebrate each other's wins.

  About the Position

  Do you see yourself as a mission-driven Senior Manager,
  Software Engineering who believes that great products emerge
  from strong teams? Do you have a curiosity and passion for
  bringing related areas together and coaching people of
  different backgrounds and technical expertise into a
  cohesive, collaborative team? Do you thrive in inclusive,
  thoughtful environments where engineers hold themselves to
  high standards of technical excellence, ownership, and
  impact at scale?

  The Murmuration Engineering Team is seeking an experienced
  Senior Manager, Software Engineering to grow and develop the
  multidisciplinary team (DevOps, App Security, SRE, and
  FinOps) that builds and maintains the shared systems that
  all of our teams depend on. Your guidance and influence on
  this team will raise the bar across the engineering
  organization.

  Murmuration builds technology that helps our partner
  organizations strengthen civic engagement and organize more
  effectively in their communities. Our products weave
  together engagement, outreach, demographic, and voter data
  into intuitive applications that help partners better
  understand and act within the communities they serve. Our
  team is intentionally multidisciplinary and partner-focused.
  We succeed together by aligning planning, execution, and
  learning across engineering, product, design, research,
  data, and partner success. We build complex, data-driven
  systems that need to work reliably during critical moments,
  scale as our partners grow, and remain understandable and
  maintainable as communities and their needs evolve.

  As a Senior Manager, Software Engineering, you'll join the
  Platform Team to support both production and prototype
  applications and the services they're built upon. You'll
  coach and grow a small, cross-discipline team that owns the
  outcomes for the org's build/deploy/run systems, with
  accountability for other teams' ability to ship fast,
  safely, and reliably. The team’s disciplines span DevOps,
  App Security, SRE, and FinOps domains.

  Your leadership actively shapes the team's operating model,
  evolving it to serve the Engineering organization's current
  and future needs. Your strategic thinking turns vision into
  sequenced deliverables and adapts as priorities shift
  without losing sight of where the team is headed. Your
  commitment to high-quality documentation improves knowledge
  sharing, onboarding, and long-term product maintainability
  across Murmuration.

  Your ability to work across engineering teams, understanding
  their goals and shaping the org's engineering roadmap around
  them, is key to making the Platform Team successful.

  This role suits a deeply experienced Senior Manager,
  Software Engineering who can evaluate where we are today,
  absorb shifts in direction, and keep us on track. Your
  commitment to building inclusive, high-trust, high-
  performing teams is visible across the technology
  organization. And you believe, as we do, that how we build
  is just as important as what we build.

  Job Level: M4

  Drive & Model

  - Shape technical strategy for the team: Build an engineering
    roadmap that keeps the team focused on big-picture
    objectives and that reflects tradeoffs among competing
    priorities, dependencies, and complexities across DevOps,
    App Security, SRE, and FinOps. Propose clear
    recommendations and plans, and present well-reasoned
    documentation of tradeoffs and alternatives.
  - Manage technical debt and process health: Maintain a steady
    cadence of debt paydown, prioritizing which debt to tackle
    and communicating the reasoning behind those choices. Own
    the schedule of dependency and application updates so end-
    of-life deadlines are handled proactively rather than as
    last-minute fire drills.
  - Deliver production-ready platforms: Own the platforms and
    tooling that give other teams a stable, observable
    foundation of reliability, performance, and operational
    excellence so they can focus on building and testing their
    own applications on top of it.
  - Strengthen application security: Introspect codebases to
    identify vulnerabilities early, and own data privacy and
    access control as first-class concerns; deliver solutions
    that support secure coding practices across the org
    without owning how other teams write their code.
  - Enable FinOps visibility: Build and own the single panes of
    glass that give engineering leadership and the C-suite a
    clear, trusted view of cloud and infrastructure costs,
    supporting both short-term budget decisions and long-term
    cost strategy.
  - Architect for the long term: Design and build systems and
    architectures that will serve Murmuration for years with
    scale, reliability, security, and maintainability as
    first-class concerns.

  Elevate the Team

  - Coach and empower emerging leaders: Coach leaders to lead at
    every level: Within their own teams, as good,
    collaborative, and experienced peers, and through
    mentoring ICs around them.
  - Resolve ambiguity: Actively shape and bring structure and
    clarity (not perfection) to specs.
  - Listen and elevate: Stay closely attuned to how other teams
    approach test strategy, code quality, and system design,
    and use that insight to ensure that what our team builds
    and delivers elevates their developer journey.
  - Be like Ted Lasso: Believe, coach the whole team, build
    trust, and demonstrate kindness, empathy, optimism,
    curiosity, and vulnerability.

  Lead Beyond Platform

  - Lead beyond the Platform team: Own objectives that span
    multiple teams and align with division and organizational
    goals.
  - Be the voice: Lead with ownership and accountability on
    behalf of DevOps, App Security, SRE, and FinOps; seek
    opportunities to add clarity, make high-quality
    recommendations, and be a decision-maker in discussions
    with product and leadership.
  - Identify risk: Identify, document, and follow-up in a timely
    manner on vulnerabilities and operational risk across the
    full platform, including applications built by other
    teams.
  - Lead incident response: Involve the right people across
    DevOps, App Security, SRE and FinOps, lead the response,
    conduct root cause analysis, and follow through until
    learnings are shared, incorporated, and remediation is
    complete.

  Build with Vision

  - Build one internal engineering system, not four Platform
    teams: Treat DevOps, App Security, SRE, and FinOps as
    interdependent subsystems where the outcome depends on how
    well they integrate, not how well each performs alone.
  - Present a cohesive voice and narrative externally: Lead with
    expertise and a cohesive single voice about the Platform
    Team’s mission and deliverables to our peer teams.
  - Be curious about people, not just systems: Identify
    opportunities to foster curiosity and ease communication
    between people who come from different backgrounds,
    experiences, and technical lenses.
  - Use AI to amplify: Surface risks and gaps that manual review
    would miss, and measure team progress together towards
    shared goals.

  Requirements

  Technical Depth and Judgement

  - Deep, hands-on expertise across DevOps and SRE: Your direct
    prior experience informs your approach to prioritizing
    competing work, communicating tradeoffs clearly, and
    explaining how a decision in DevOps, SRE, AppSec, or
    FinOps supports the organization as a whole.
  - Sound judgment under imperfect information: Make tradeoff
    calls to generate clarity in ambiguous situations.
  - Communicates effectively: Explain to non-technical
    leadership why an architecture decision is sound without
    needing the original author in the room.
  - Champions team decisions: Advocate for the team's technical
    decisions to peers, product, and leadership.

  Scope, Initiative, and Execution

  - Lead execution at scale: Lead technical execution for
    initiatives spanning multiple teams or systems, balancing
    quality, performance, and cost while keeping stakeholders
    aligned on tradeoffs and risks.
  - Turn strategy into shipped deliverables: Translate
    objectives aligned with division and organizational goals
    into clear epics, stories, and tickets, anticipating
    technical challenges and proposing solutions before they
    become blockers.
  - Plan through ambiguity: Estimate large, cross-team projects
    with unknowns, building mitigation plans for what’s
    unresolved, and breaking work into milestones and
    iterations to reduce risk and deliver incremental value.
  - Drive to completion: Involve decision makers, delegate
    clearly, communicate consistently, and follow through as
    an owner, in a timely manner, until an outcome is
    delivered.
  - Multiply team effectiveness: Use technical leadership,
    tooling, infrastructure, and process improvements to
    multiply the impact of both the Platform Team and the
    Engineering organization.

  Organizational Impact

  - Influence beyond the team: Shape outcomes beyond your own
    team through role modeling, documentation, and advocacy.
  - Mentor future leaders: Develop future technical leaders,
    building their judgment, ownership, and skills through 1:1
    guidance and small-group knowledge sharing.
  - Raise the engineering bar: Drive the standards and best
    practices that raise the bar across the organization,
    creating processes that instill ownership behavior in
    others.
  - Lead by example: Proactively share context and learnings
    with an eye to creating the kind of high-trust, high-
    performing team culture that makes everyone better.

  What You Bring to the Table

  Foundations

  - 10+ years of professional software manager engineering
    experience with demonstrated fluency across
    infrastructure, systems, and application layers, and a
    track record of delivering in production across a variety
    of languages, tools, and technology stacks.
  - A quality-driven mindset with experience writing,
    maintaining, and driving infrastructure and deployment
    safety checks at the team or product level.
  - A track record of effective collaboration with product, data
    science, and R&D teams, bridging technical and domain-
    specific perspectives across disciplines.

  DevOps

  - Working knowledge of CI/CD pipelines and release engineering
    practices.
  - Production experience with AWS, including compute, storage,
    and networking services.
  - Proficiency with Docker, Make, or similar build tools, as
    well as environment scripting.
  - Fluency with infrastructure-as-code (Terraform or
    equivalent) across AWS, GCP, and Azure providers
    sufficient to evaluate design decisions, not just approve
    them.

  App Security

  - Experience driving secure coding practices, data privacy
    principles, and access control patterns as applied in
    production systems.
  - Familiarity with security practices such as vulnerability
    scanning, secrets management, and secure SDLC.
  - Knowledge of compliance and regulatory frameworks (e.g., SOC
    2, NIST CSF) and how they shape engineering decisions.

  SRE

  - Deep experience with cloud-native architectures, distributed
    systems, and production-grade software at scale.
  - Direct experience with observability tooling (logging,
    metrics, and tracing) using tools such as Datadog, New
    Relic, Prometheus, or Grafana.
  - Working knowledge of incident management practices: On-call
    rotations, escalation, and postmortem processes.

  FinOps

  - Familiarity with cloud cost and billing platforms sufficient
    to build tooling that supports both short- and long-term
    budget decisions.

  Nice to Haves

  - Familiarity with Voter File Data;
  - Experience with or interest in political data; and/or
  - A background in political tech, civic tech, advocacy, or
    mission-driven organizations.

  Talented Senior Manager, Software Engineering come from all
  walks of life and career. If you are passionate about civic
  engagement and technology, please apply, even if you do not
  check every box!

  Benefits

  Location and Compensation

  This is a full-time, salaried position with a comprehensive
  benefits package, open

  to candidates anywhere in the United States.

  The starting salary for this position is $228,497. We set
  compensation using market data and apply it consistently
  across the organization to ensure fairness and transparency
  for everyone in similar roles.

  Our Culture of Care

  We work hard to create a culture of care to ensure that our
  staff are best equipped to lead happy, healthy, and balanced
  lives. To that end, we offer a comprehensive benefits
  package which includes:

  - Health, vision, and dental insurance with 100% of premiums
    covered for you and qualifying family members;
  - Retirement benefits with a 5% employer match;
  - A flexible unlimited PTO plan;
  - Generous paid parental leave;
  - Pre-tax commuter benefits;
  - A company laptop;
  - A flexible remote work environment;
  - A home office setup stipend for all new employees;
  - Monthly reimbursement for remote work expenses;
  - A yearly professional development fund;
  - Mental health and wellness benefits through Calm and Better
    Help;
  - Yearly in-person staff retreats; and
  - A welcoming culture that celebrates diversity, equity,
    inclusion, and belonging.

  At Murmuration, we believe a vibrant, representative
  democracy depends on the inclusion of diverse voices, lived
  experiences, and perspectives. The best ideas don’t come
  from a single person or ideology — they emerge at the
  intersection of different backgrounds, identities, and
  viewpoints. We are proud of our commitment to building an
  organization and culture shaped by respect, empathy, and
  collaboration, where our team’s diversity fuels innovation,
  civic engagement, and meaningful change. We welcome new
  colleagues who will help us nurture this collective effort.
  Join us.

  An Equal-Opportunity Employer with a Commitment to Diversity

  Murmuration is proud to be an equal opportunity employer,
  and as an organization committed to diversity and the
  perspective of all voices, we consider applicants equally of
  race, gender, color, sexual orientation, religion, marital
  status, disability, political affiliation and national
  origin. We reasonably accommodate staff members and/or
  applicants with disabilities, provided they are otherwise
  able to perform the essential functions of the job.

  Note: Murmuration is two organizations working together to
  pursue our mission of amplifying the power of civic
  engagement: Murmuration Research Institute, a 501(c)(3) that
  conducts research to identify, design, and create the data,
  tools, and insights that build healthier and more equitable
  communities; and Murmuration, Inc., a 501(c)(4) that
  supports organizations working across the country on the
  nation’s most challenging issues with access to data, tools,
  and research that build healthier and more equitable
  communities.
