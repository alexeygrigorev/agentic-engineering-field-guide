title: Software Engineer, Enterprise Platform Engineering
company: Two Sigma
location: New York, USA
work_type: FULL_TIME
company_size: 1,700 Employees
description: |
  Position Summary  Two Sigma is a leading quantitative
  investment management and trading firm. The company applies
  a scientific approach to investing, combining cutting-edge
  technology, artificial intelligence, data science, and
  quantitative research with rigorous human inquiry to
  capitalize on market opportunities and deliver alpha for
  investors. Our team of engineers, quantitative researchers
  and data scientists looks beyond the traditional to test
  hypotheses and develop creative solutions to some of the
  world's most complex economic problems. Enterprise Platform
  Engineering (EPE) delivers the technical platform that
  empowers Two Sigma's people and trading businesses to
  rapidly scale, collaborate, and innovate while minimizing
  risk. Our team is responsible for massively scaled
  infrastructure and systems that power workflows across
  research, simulation and live-trading. We develop frameworks
  and applications that enable other engineering teams and
  business users to accomplish business critical goals, with a
  focus on robust design and high-quality code. You will take
  on the following responsibilities:

  - Design, build, and maintain scalable, distributed
    infrastructure platforms across on-premise and the public
    cloud that enable engineers and data scientists to deploy
    and operate workloads efficiently.
  - Evaluate and integrate new technologies (such as Gen AI) and
    open-source tools into the platform ecosystem, conducting
    proof-of-concepts and making data-driven recommendations
    for adoption.
  - Participate in on-call rotations and lead incident response
    efforts, conducting thorough post-mortems and implementing
    preventive measures to improve system resilience.
  - Define and promote platform engineering best practices,
    architectural patterns, and technology standards across
    the organization through documentation, training sessions,
    and hands-on support.
  - Lead cross-functional platform initiatives from conception
    to delivery, coordinating with multiple engineering teams,
    product managers, and collaborators to define
    requirements, establish timelines, and ensure successful
    adoption of new platform capabilities.

  You should possess the following qualifications:

  - Minimum 1 year of experience required; 5-12 years of
    experience in software engineering preferred
  - BS or MS degree in Computer Science, Engineering, or a
    related field
  - In-depth knowledge of Linux operating system and network
    fundamentals. Good understanding of system performance
  - Experience of working on large distributed system
  - Experience with Python, Java, or C++
  - Background in GenAI-driven systems development is a plus

  You will enjoy the following benefits:

  - Core Benefits: Fully paid medical and dental insurance
    premiums for employees and dependents, competitive 401k
    match, employer-paid life & disability insurance
  - Perks: Onsite gyms with laundry service, wellness
    activities, casual dress, snacks, game rooms
  - Learning: Tuition reimbursement, conference and training
    sponsorship
  - Time Off: Generous vacation and unlimited sick days,
    competitive paid caregiver leaves
  - Hybrid Work Policy: Flexible in-office days with budget for
    home office setup

  The base pay for this role will be between $165,000 and
  $250,000. This role may also be eligible for other forms of
  compensation and benefits, such as a discretionary bonus,
  health, dental and other wellness plans and 401(k)
  contributions. Discretionary bonus can be a significant
  portion of total compensation. Actual compensation for
  successful candidates will be carefully determined based on
  a number of factors, including their skills, qualifications
  and experience. We are proud to be an equal opportunity
  workplace. We do not discriminate based upon race, religion,
  color, national origin, sex, sexual orientation, gender
  identity/expression, age, status as a protected veteran,
  status as an individual with a disability, or any other
  applicable legally protected characteristics. Two Sigma is
  committed to providing reasonable accommodations to
  qualified individuals in accordance with applicable federal,
  state, and local laws. If you believe you need an
  accommodation, please visit our website for additional
  information.
