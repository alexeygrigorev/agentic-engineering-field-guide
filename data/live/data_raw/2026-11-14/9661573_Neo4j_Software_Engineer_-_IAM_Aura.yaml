description: |
  About Neo4j:

  Neo4j is the graph intelligence platform that transforms
  data into knowledge to power the next generation of
  intelligent applications and AI systems. It includes
  enterprise-ready knowledge graphs for accurate, explainable,
  and governed AI; the most comprehensive, trusted, and easy-
  to-deploy graph capabilities across any environment and data
  source; and an unmatched ecosystem trusted by 84 of the
  Fortune 100 and supported by the world’s largest graph
  community. Intelligence that works. Results that matter.

  Built to work everywhere and integrate with everything
  across every cloud for dynamic, personalized, and autonomous
  AI systems. We deliver quicker results, contextual
  knowledge, and solutions that impact customers and employees
  across the business.

  Our Vision:

  At Neo4j, we have always strived to help the world make
  sense of data.

  As business, society and knowledge become increasingly
  connected, our technology promotes innovation by helping
  organizations to find and understand data relationships. We
  created, drive and lead the graph database category, and
  we’re disrupting how organizations leverage their data to
  innovate and stay competitive.

  The Team:

  The IAM team is responsible for owning authentication and
  authorisation throughout Aura, right from the time you click
  sign up in the Console, all the way to the access controls
  on the cloud-hosted databases. Additionally, we often help
  unblock other teams by guiding them and building tools and
  solutions for their IAM-related challenges.

  We're evolving our existing IAM implementation into a
  dedicated architecture while continuing to support our
  current platform and deliver new features. This allows us to
  solve interesting engineering challenges around
  architecture, security, and scalability, with opportunities
  to contribute ideas and take ownership.

  The Role:

  We are looking for software engineers who are comfortable
  working on both frontend and backend features, solving
  problems and delivering features end to end. You'll have
  opportunities to take ownership of meaningful technical
  challenges, collaborate with other engineers and help shape
  how IAM capabilities are designed and delivered across Neo4j
  Aura.

  Previous IAM experience is highly desirable but not
  essential. If concepts such as JWT, OAuth 2.0, OIDC, RBAC,
  ABAC, SSO, and zero-trust authentication are familiar to
  you, that's a plus. If not, curiosity and a willingness to
  learn are what matter most.

  What You'll Do:

  - Improve Neo4j Aura’s identity and access management
    platform.
  - Build new features, both user facing and engineering driven.
  - Write Python, Go and Typescript code with a strong focus on
    usability, scalability and efficiency.
  - Work in a highly collaborative team of skilled engineers.
  - Partner with members of other teams in Neo4j.

  What You'll Bring:

  - Experience with either Go or Python with a willingness to
    work in any of our other programming languages.
  - Solid software engineering fundamentals, including writing
    maintainable, well-tested code and taking features from
    planning through to delivery.
  - Some familiarity with authentication and authorization
    concepts, whether through professional experience or
    personal projects. Deeper IAM expertise is welcome but not
    required.
  - Experience or strengths in at least one area relevant to the
    role, such as IAM, cloud platforms, distributed systems,
    evolving legacy systems or breaking down monolithic
    architectures.
  - A collaborative approach to engineering, including
    communicating ideas, asking questions, sharing knowledge
    and working with other teams to solve problems.
  - Initiative and curiosity, with the ability to identify
    opportunities for improvement, contribute ideas and take
    ownership of delivering solutions.

  Technologies We Use:

  - Frontend: React and Typescript
  - Backend: Python (legacy services) and Go (new services)
  - IdP: Auth0
  - Infrastructure: Kubernetes and Docker
  - GCP, Azure and AWS

  Production experience with several of the technologies we
  use is desirable but not essential.

  #Li-Hybrid

  Why Join Neo4j?

  Neo4j is, without question, the most popular graph
  intelligence platform in the world. We have customers in
  every industry globally, and our products are a proven
  product/market fit. Joining our team is an opportunity to
  shape the future of data and analytics. Below are just a few
  exciting facts about Neo4j.

  - Neo4j is one of the fastest-scaling technology companies in
    this industry. It recently surpassed $200M in annual
    recurring revenue (ARR), doubling its ARR over the past
    three years.
  - Raised the biggest funding round in database history ($325M
    Series F). Backed by world-class investors like Eurazeo,
    GV (formerly Google Ventures), and Inovia Capital, Neo4j
    has raised over $600M in funding and is currently valued
    at over $2Bn. This puts Neo4j among the most well-funded
    database companies in history.
  - 84% of the Fortune 100 and 58% of the Fortune 500 use Neo4j.
    Examples include Boston Scientific, BT Group, Caterpillar,
    Cisco, Comcast, Department for Education UK, eBay, NBC
    News, Novo Nordisk, Worldline, and others.
  - Co-founder and CEO Emil Eifrem has built an amazing culture
    that prides itself on relationships, inclusiveness,
    innovation, and customer success.
  - Countless industry awards. Massive enterprises and
    individual developers/data scientists love Neo4j. A strong
    sense of community and ecosystem is built around the
    platform.
  - A recent Forrester Total Economic Impact™ Study cited Neo4j
    as delivering 417% ROI to customers.

