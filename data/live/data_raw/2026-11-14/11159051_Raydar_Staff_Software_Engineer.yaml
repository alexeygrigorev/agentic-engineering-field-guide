description: |
  About the company

  Our client is a YC-backed, Series A AI company building
  autonomous voice agents for trades and field-services
  businesses. Its product integrates with industry CRMs to
  automate customer calls, booking, scheduling, invoicing, and
  urgent service workflows. The company recently raised a $13M
  Series A led by a leading venture firm and is growing from a
  focused 14-person team in London's Old Street technology
  hub.

  The role and why it matters

  This is a staff-level product engineering role and one of
  the final founding engineering hires. You will shape both
  the technical foundations and the way the company works
  directly with customers. The role combines hands-on full-
  stack development, applied AI, infrastructure, integrations,
  and technical leadership in a fast-moving early-stage
  environment.

  What you'll do

  • Build and ship core product features across Python,
  TypeScript, cloud infrastructure, event-driven systems, and
  third-party integrations.

  • Own customer problems from discovery and scoping through
  implementation and measurable outcomes.

  • Build and improve AI voice-agent workflows that interact
  reliably with real-world service operations.

  • Decide when a fast MVP is appropriate and when the product
  needs scalable, reliable foundations.

  • Raise engineering standards for testing, documentation,
  reliability, security, and operational quality.

  • Help a small engineering team make sound architecture
  decisions while continuing to write production code.

  Requirements

  What we're looking for

  • 5 to 10 years of full-stack software engineering
  experience with a backend emphasis.

  • Meaningful experience building and shipping AI products
  end to end, especially agentic systems.

  • Strong production experience with Python or TypeScript.

  • Deep experience with asynchronous Python, including
  coroutines, HTTP clients, asynchronous model APIs, and
  robust error handling.

  • Early-stage startup experience, ideally at Series A or
  earlier.

  • Experience with Kubernetes, serverless systems,
  distributed infrastructure, or event-driven architecture.

  • Ability to scope and deliver technical solutions directly
  with customers and non-technical stakeholders.

  • A computer science degree or equivalent technical
  foundation.

  Bonus points

  • Experience with voice AI, speech-to-text, text-to-speech,
  or telephony platforms.

  • Experience building CRM or other complex third-party
  integrations.

  • Previous founder experience or a strong customer-facing
  engineering background.

  • Experience in fintech, trades software, or operationally
  complex vertical software.

  Location and work model

  • Full-time role based in London, United Kingdom.

  • Five days per week in the Old Street office.

  • Visa sponsorship is available.

  • The team operates with a high-intensity, office-centric
  startup culture.

  Benefits

  • £150,000 to £250,000 base salary.

  • Competitive and meaningful equity.

  • Staff-level scope with substantial influence over product
  and engineering direction.

  • Opportunity to join a well-funded team at a formative
  stage.
