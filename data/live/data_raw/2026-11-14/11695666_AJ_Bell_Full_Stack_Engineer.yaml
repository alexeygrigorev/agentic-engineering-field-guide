description: |
  Job Description

  Build the technology behind Feel Good Investing.

  At AJ Bell, we believe investing should feel good. Behind
  every simple, intuitive customer experience is technology
  that needs to be reliable, scalable and built to last.

  We're looking for an experienced Full Stack Engineer to help
  build the services that power our apps and websites. You'll
  join a growing, cross-functional engineering team focused on
  creating the APIs, web applications, data layers and
  integrations that underpin our investment products and
  services.

  This is a hands-on role where you'll work across the stack,
  using technologies including Node.js, TypeScript, React,
  MongoDB and AWS. You'll help architect and deliver solutions
  that make it easier for our customers to access and manage
  their investments, while working closely with Product, UX
  and Business colleagues to solve real customer problems.

  You'll be joining a team with a strong focus on engineering
  excellence, continuous improvement and ownership. We believe
  in building things well, learning from what we do and giving
  engineers the autonomy to make a meaningful difference.

  What you'll do

  Build services customers can rely on

  - Develop full stack features across APIs, web applications,
    data layers and third-party integrations.
  - Design, build and deploy secure, scalable and maintainable
    solutions across the technology stack.
  - Work with other engineers across different disciplines
    within a dedicated, product-aligned squad.
  - Contribute to architectural decisions and help shape the
    technical direction of the products you work on.
  - Build solutions that are performant, reliable and designed
    with the customer experience in mind.

  Work closely with Product and Design

  - Collaborate with Product, UX and Business colleagues to
    understand problems and turn them into effective technical
    solutions.
  - Work alongside mobile and web engineers to create joined-up
    customer experiences.
  - Propose new solutions, experiment with ideas and help pilot
    improvements.
  - Bring an interest in user experience and a genuine desire to
    understand and solve the problems customers have.

  Own what you build

  - Embrace a "build it, run it, own it" DevOps mentality.
  - Take responsibility for your code from initial idea and
    development through to deployment, monitoring and ongoing
    improvement.
  - Contribute to a culture of continuous improvement,
    identifying opportunities to make our technology,
    processes and ways of working better.
  - Share knowledge, support other engineers and contribute to
    engineering standards and best practice.

  The technology

  You'll work across a modern full stack environment,
  including:

  - Node.js and TypeScript
  - React and JavaScript frameworks
  - MongoDB and SQL
  - RESTful HTTP APIs and GraphQL
  - AWS and cloud-native solutions
  - Jenkins and/or AWS CodePipeline
  - Docker, ECS and/or Kubernetes
  - Automated testing and Test Driven Development

  We care about strong engineering fundamentals and how you
  approach problems. You don't need to have worked with every
  technology listed, but you'll need the experience and
  curiosity to work effectively across the stack.

  What we're looking for

  Technical skills

  - 5+ years' commercial experience developing web applications
    and APIs.
  - Strong experience with some combination of Node.js,
    TypeScript, React, PHP, .NET Core, MongoDB and SQL.
  - Experience developing HTTP-based APIs and implementing
    RESTful services, as well as GraphQL.
  - Thorough understanding of CI/CD pipelines, with experience
    using Jenkins and/or AWS CodePipeline.
  - Experience with Test Driven Development and a good
    understanding of automated testing frameworks and
    practices.
  - Familiarity with containerisation and technologies such as
    Docker, ECS or Kubernetes.
  - Experience developing, deploying and maintaining cloud-based
    solutions on AWS.
  - A strong technical background in web development, ideally
    including modern JavaScript frameworks.
  - A good understanding of the principles that contribute to
    high-performing web pages and applications.

  How you work

  - Experience working with Product and other business
    stakeholders to understand requirements, shape solutions
    and deliver outcomes.
  - An interest in user experience and an appreciation of the
    problems customers are trying to solve.
  - A keen eye for detail and a commitment to producing high-
    quality work.
  - The ability to understand and communicate technical and non-
    technical requirements clearly.
  - Comfortable working collaboratively within a cross-
    functional Agile team.
  - A continuous improvement mindset, with the curiosity to
    question how things are done and find better approaches.
  - The ownership and autonomy to make decisions, take action
    and see work through to completion.

  About AJ Bell

  At AJ Bell, we believe investing should feel good. Whether
  people are looking for an ISA, pension or dealing account,
  or prefer to invest with the help of a financial adviser or
  independently, we offer easy-to-use solutions to suit people
  from all walks of life.

  We're one of the UK's fastest-growing investment platform
  businesses, trusted by professional financial advisers and
  first-time investors alike.

  More than 762,000 customers trust us to manage over £121.5
  billion in assets. By continually striving to make investing
  simpler and more accessible, we're helping more people take
  control of their financial futures.

  Our technology plays a huge part in that. The services you
  build will sit behind the apps and websites our customers
  use to manage their investments, helping us deliver
  experiences that are reliable, accessible and easy to use.

  We're proud to be recognised as a Great Place to Work® for
  the past two years, building on six consecutive years as one
  of the UK's Best 100 Companies to Work For. It's recognition
  we're proud of and a reflection of the supportive and
  collaborative culture we strive to create for our people.

  What we offer

  - 25 days holiday, increasing with service + buy/sell scheme +
    bank holidays
  - 6% Pension with matched contributions
  - Share schemes (including free shares and BAYE)
  - Health Cash Plan and discounted private healthcare
  - Free onsite gym
  - Enhanced family leave (subject to qualifying criteria)
  - Travel and bike loan schemes  Employee Assistance Programme

  Life at AJ Bell 

  - Regular social events including summer and Christmas parties
  - Learning and development opportunities tailored to you
  - Casual dress code
  - Friendly, supportive team environment

  Our ways of working 

  We offer hybrid working, with a minimum of 50% of your
  working time per month spent in the office. 

  For new starters, there’s an initial period of full-time
  office working to help you settle in and build
  relationships. 

  Inclusion & diversity 

  We’re committed to creating an inclusive environment where
  everyone feels respected and able to be themselves at work. 

  We welcome applications from all backgrounds and make hiring
  decisions based on skills, experience and potential. 

  Your application, reviewed by people

  We believe great hiring starts with people. That's why every
  application is reviewed by a member of our Recruitment team,
  rather than screened by AI. It may take us a few days to get
  back to you, but please be assured that your application
  will be given the time and attention it deserves.
