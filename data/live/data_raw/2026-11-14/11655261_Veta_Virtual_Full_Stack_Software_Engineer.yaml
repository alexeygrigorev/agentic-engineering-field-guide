description: |
  Launch Your Next Successful Chapter with Veta Virtual! 🚀 💸
  Competitive Pay | 🌍 100% Remote | 💻 Golang, Java, React,
  TypeScript | 🪙 Fintech & Cryptocurrency Industry

  Veta Virtual is hiring a Full Stack Software Engineer for
  one of our high growth clients in the fintech and
  cryptocurrency industry. This is not a single layer coding
  role. This is a hands on engineering position for someone
  who can build both the backend services and the frontend
  experiences behind secure, high volume financial
  transactions, and who takes pride in owning a feature from
  idea to production.

  🔑 Your Role:

  Our client is a leading digital currency platform operating
  at the intersection of crypto and traditional finance,
  enabling customers to buy, sell, and manage cryptocurrency
  through kiosks, a consumer portal, and enterprise products.
  Their engineering teams build secure, scalable systems that
  handle high-volume financial transactions and support
  heavily regulated, compliance-driven workflows.

  Your day-to-day responsibilities will include:

  - Designing, building, and maintaining full-stack features
    across frontend applications and backend services.
  - Developing and maintaining backend APIs that support
    onboarding, authentication, transaction lifecycles, and
    operational workflows.
  - Building and enhancing front-end experiences in customer-
    facing and internal web applications.
  - Integrating systems with third-party services and external
    providers.
  - Implementing secure authentication and authorization using
    OAuth 2.0 flows.
  - Working within a microservices environment to deliver
    scalable backend capabilities.
  - Ensuring applications meet high standards for security,
    performance, reliability, and observability, including
    monitoring.
  - Participating in code reviews, technical design discussions,
    and architecture decisions.
  - Writing and maintaining clear technical documentation.

  ✅ What You'll Need:

  Core Technical Requirements

  - 3+ years of experience as a software engineer working across
    frontend and backend systems.
  - Strong experience building backend services in Golang and/or
    Java.
  - Proficiency with Node.js / TypeScript v5.
  - Experience building frontend applications using Next.js,
    React, and TypeScript.
  - Solid understanding of RESTful API design.
  - Strong SQL skills and experience with PostgreSQL.
  - Experience working in an AWS environment.
  - Familiarity with microservices and distributed backend
    systems.

  Tech Stack Proficiency

  - Backend: Golang, Java
  - Frontend: Next.js, React, TypeScript (v5), Node.js
  - APIs: RESTful APIs
  - Databases: SQL, PostgreSQL
  - Infrastructure & Cloud: AWS (including S3), containerized
    services, Kubernetes, Helm, Terraform
  - Authentication & Identity: OAuth 2.0 flows
  - Monitoring/Observability: Grafana (or similar platforms)
  - Version Control & CI/CD: Git-based workflows with CI/CD
    pipelines
  - Developer Workflow: VS Code / Cursor debugging

  Nice to Have

  - Understanding of multi-threading and goroutines.
  - Webhooks and/or WebSocket experience.
  - Architecture and system design experience.
  - Comfort using AI-assisted development tools.
  - Experience in fintech, crypto, payments, or other regulated
    industries.
  - Experience building internal dashboards or operational
    tooling.
  - Familiarity with authentication, authorization, and secure
    system design.

  💼 What We Offer:

  - 💸 Competitive salary in USD, based on experience.
  - 🌴 15 paid vacation days per year, plus all U.S. national
    holidays.
  - 💻 100% remote, work from anywhere in LATAM or Europe with a
    professional home setup.
  - 📈 A fast paced, high growth environment at the forefront of
    the global fintech and cryptocurrency industry, where your
    code directly powers high volume financial transactions
  - 🤝 A collaborative, high trust culture through Veta Virtual
    and our client, where your ownership and engineering
    judgment are valued from day one.

  Ready to Apply?

  If you are ready to build secure, scalable products across
  the full stack and own your work from design to production,
  apply now and launch your next chapter with Veta Virtual.

  Once you apply, you will be invited to complete a short two
  minute video question as part of our screening process. It
  is your first opportunity to show us your thinking and what
  makes you the right person for this role. We can’t wait to
  meet you!
