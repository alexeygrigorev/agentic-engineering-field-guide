description: |
  About The Opportunity

  Become part of the Contentful Personalization Team and help
  shape how leading businesses deliver personalized digital
  user experiences.

  As a Senior Software Engineer, you will solve complex
  customer problems and deliver value through end-to-end
  personalization solutions. You will work across high-
  performance backend services, developer-facing frontend
  tools and SDKs, infrastructure, and observability to help
  customers deliver personalized content experiences in a
  performant, reliable, and developer-friendly way.

  You will bring a proactive approach to problem-solving, a
  high sense of ownership, and a continuous improvement
  mindset. You will use modern AI tools, including agentic
  coding workflows, thoughtfully to improve how you explore,
  build, test, and maintain software. You will also contribute
  actively to the team's Agile ways of working, understanding
  how planning, refinement, delivery, reviews, retrospectives,
  and continuous improvement fit together.

  What To Expect?

  - Design, develop, and maintain high-performance backend
    services and APIs with a focus on reliability,
    scalability, and low latency.
  - Deliver end-to-end solutions across backend services, React-
    based frontend experiences, and developer-facing SDKs,
    libraries, and tools.
  - Implement complex CDN and edge-based caching solutions that
    allow users to retrieve personalized content in the most
    performant way.
  - Solve technical challenges in creative ways, balancing the
    trade-off between performance and elegant software
    architecture.
  - Continuously monitor and optimize system performance through
    benchmarking, while making sure systems are well
    instrumented for observability.
  - Implement defensive coding practices and guarantee
    correctness and maintainable code through automated
    testing.
  - Use AI-assisted and agentic coding tools responsibly to
    improve engineering workflows, while maintaining high
    standards for code quality, security, testing, and review.
  - Participate actively in Agile ceremonies, including
    planning, refinement, reviews, and retrospectives, to help
    the team deliver customer value and continuously improve.
  - Stay up to date with the latest technologies and constantly
    evaluate their potential use at Contentful.

  What You Need To Be Successful?

  - Proven experience building APIs and services that
    efficiently handle large volumes of traffic.
  - Strong proficiency with server-side TypeScript and API
    protocol design.
  - Experience delivering full-stack solutions, including React-
    based frontend experiences and SDKs, libraries, or tools
    for developers.
  - Experience with serverless architectures, ideally edge
    compute environments such as Cloudflare Workers.
  - Experience with CDN operations and caching strategies to
    optimize system performance.
  - Hands-on experience with benchmarking, instrumenting code
    for observability, and performance optimization for large-
    scale systems.
  - Expertise in defensive coding practices, ensuring system
    robustness and fault tolerance.
  - Proficiency in using CI/CD pipelines and maintaining
    automated tests, including unit and end-to-end tests.
  - Experience using AI tools, including agentic coding
    workflows, to improve software delivery while applying
    sound engineering judgment.
  - A practical understanding of Agile delivery and how
    planning, refinement, implementation, reviews, and
    retrospectives support sustainable delivery and continuous
    improvement.
  - A proactive approach with a strong sense of ownership.
  - Great communication skills in English, especially when
    explaining complex technical concepts.

