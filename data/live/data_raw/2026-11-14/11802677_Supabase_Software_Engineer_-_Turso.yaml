description: |
  About Supabase

  Supabase is the Postgres development platform, built by
  developers for developers. We provide a complete backend
  solution including Database, Auth, Storage, Edge Functions,
  Realtime, and Vector Search. All services are deeply
  integrated and designed for growth.

  About the Role

  We’re looking for a Software Engineer to join our Turso core
  database team and help bring forward the future of agentic
  databases. Turso is both an Open Source database that
  replaces SQLite—with an ongoing project to also support the
  Postgres interface—and a Cloud offering where users can
  create databases on demand. You’ll work closely with
  customers and other teams at Supabase to build the future of
  what databases look like in a world where users and agents
  are creating millions of databases a day.

  This role is ideal for someone who thrives in async, fast-
  paced environments and is excited about building database
  technology tools that scale to billions.

  What You’ll Be Responsible For

  - Driving the progress of the Turso Open Source database, in
    particular the Postgres compatibility layer.
  - Making sure code works, and never breaks, and putting the
    systems and guarantees in place for that to happen.
  - Maintaining the Turso Cloud operations, including the Cloud
    API and data plane operations.
  - Improving the scalability of the Turso Cloud operations to
    support a 100x larger number of databases

  You Might Be a Good Fit If You

  - Have written databases before, and/or other high-stakes low-
    level systems like Hypervisors, OS Kernels, storage
    devices, etc.
  - Have experience working with remote teams and Open Source
    communities.
  - Have a passion and experience for correct systems that work,
    and have the experience in the tools to make that happen:
    Deterministic Simulation Testing, formal verification
    methods, fuzz and differential testing, etc.
  - Have experience deploying, operating and debugging large
    scale software systems in production in cloud environments
    such as AWS & Kubernetes
  - Have experience improving the observability, reliability and
    performance of complex cloud systems.
  - Are comfortable working in Rust.
  - Are comfortable with LLM-assisted development and evals.
  - Are comfortable working with Embedded databases.
  - Communicate clearly across both technical and non-technical
    audiences.
  - Are energized by solving real-world problems for developers
  - Are comfortable navigating ambiguity and moving quickly

  What We Offer

  - Fully RemoteWe hire globally. We believe you can do your
    best work from anywhere. There are no Supabase offices,
    but we provide a WeWork membership or co-working allowance
    you can use anywhere in the world.
  - ESOPEvery team member receives ESOP (equity ownership) in
    the company. We want everyone to share in the upside of
    what we’re building together.
  - Tech AllowanceUse this budget to set up your ideal work
    environment—laptop, monitor, headphones, or whatever helps
    you do your best work.
  - Health BenefitsSupabase covers 100% of health insurance for
    employees and 80% for dependents, wherever you are. Your
    wellbeing and your family’s health are important to us.
  - Annual Off-SitesOnce a year, the entire company gathers in a
    new city for a week of connection, collaboration, and fun.
    It’s a highlight of our year.
  - Flexible WorkWe operate asynchronously and trust you to
    manage your own time. You know what needs to be done and
    when.
  - Professional DevelopmentEvery team member receives an annual
    education allowance to spend on learning—courses, books,
    conferences, or anything that supports your growth.

  About the Team

  Supabase was born-remote and open-source-first. We believe
  our globally distributed team is our secret weapon in
  building tools developers love.

  - ~400 team members
  - 60+ countries
  - 20+ languages spoken
  - Over $1B raised (including our $500M Series F)
  - 540,000+ community members

  We move fast, build in public, and use what we ship. If it’s
  in your project, we probably use it in ours too. We believe
  deeply in the open-source ecosystem and strive to
  support—not replace—existing tools and communities.
