description: |
  Senior Software Engineer, Internal Tools

  Location: Remote, USA

  About Syllo

  Syllo is defining the Litigation AI category. We are the
  first unified platform designed to autonomously manage the
  entire litigation lifecycle end to end. Founded in 2019 by a
  team of litigators and engineers, Syllo enables legal teams
  to securely harness the power of AI across any matter,
  regardless of complexity or scale. Our technology supports
  Fortune 500 companies and AmLaw 200 firms in managing their
  most complex litigation portfolios. Awarded ILTA
  Transformative Project of the Year and ALM eDiscovery
  Technology of the Year for 2026, we are the market leader in
  enterprise grade litigation AI. Backed by top tier VCs, we
  empower enterprise legal departments to move faster,
  mitigate risk, and push the boundaries of what technology
  can achieve.

  About the role

  Amplify internal productivity through flexible, AI-first
  internal tools.

  This role is centered on building and expanding the internal
  software that allows Syllo to scale smoothly. You’ll take
  ownership of internally built custom tools that keep our
  operations running efficiently across every department.

  At Syllo, AI is integral to how we engineer solutions. You
  will leverage modern AI coding agents and automated testing
  toolsets as primary capabilities in your workflow,
  maintaining a high velocity while upholding high standards
  for system design, code clarity, and reliability.

  We are looking for an engineer who loves building high-
  leverage tools, actively refines their AI-assisted
  engineering methodology, and enjoys crafting thoughtful
  solutions to unique internal operational challenges.

  What you will do

  - Drive internal tool evolution: Build, maintain, and scale
    internal software tools, including document/contract
    parsing engines, interactive Slack applications, and
    custom operational utilities.
  - Build with AI-first workflows: Utilize AI coding agents and
    assistants to supercharge your execution, writing clean,
    well-architected code while applying strong engineering
    discernment to agent output.
  - Pioneer AI-assisted testing: Implement automated testing
    strategies and evaluation pipelines using AI tooling to
    ensure test coverage keeps pace with product releases.
  - Evaluate AI systems: Build scoring frameworks and evaluation
    harnesses to assess and improve the reliability and
    accuracy of LLM-backed workflows over time.
  - Design smart team workflows: Partner with teams across
    Finance, Legal, Customer Success, and Revenue Operations
    to engineer tools tailored to their evolving processes.
  - Help set AI engineering practices: Collaborate on best
    practices for integrating AI-generated code into the
    codebase, sharing methodologies that elevate velocity
    across the wider engineering team.

  What you bring

  - Modern AI development habits: Daily experience using AI
    coding agents to accelerate development, paired with a
    sharp eye for code quality, security, and architecture.
  - Testing & evaluation rigor: Hands-on experience creating
    robust automated tests and developing benchmarking tools
    for non-deterministic model outputs.
  - Production LLM experience: Practical knowledge building on
    LLM APIs, including prompt design, output parsing,
    performance tuning, and cost management.
  - Full-stack problem solving: Ability to take open-ended
    business needs and turn them into fully functional, user-
    friendly internal tools.
  - Maintainable engineering: Dedication to writing readable,
    modular, and well-instrumented code that remains easy for
    others to collaborate on.
  - Agile, evolving mindset: Excitement to try new tooling,
    adapt to changing requirements, and continuously improve
    how internal tools are delivered.

  Experience and qualifications

  - 5+ years of professional software engineering experience,
    including ownership of production software systems.
  - Consistent experience using AI coding agents or assistants
    as part of a modern software development workflow.
  - Experience building automated testing workflows or
    evaluation systems for AI/LLM applications.
  - Hands-on experience integrating large language model APIs
    into user-facing applications or internal platforms.
  - Experience building internal applications, workflow
    automation, or platform services used daily by non-
    technical teams.
  - Proficiency in Python and modern frontend frameworks (e.g.,
    React), alongside practical experience with web APIs and
    cloud integrations.
  - Experience with document processing, contract workflows, or
    legal technology is a strong plus.
  - Bachelor's degree in computer science or a technical field,
    or equivalent practical experience.

  Total rewards and benefits

  At Syllo, we believe in taking care of our team so they can
  focus on building the future of legal tech.

  - Compensation: Competitive base salary + equity options.
    Range: $160k to $200k
  - Benefits: Medical, dental, vision, and voluntary insurance
    options. Vacation, sick leave, and paid holidays. Access
    to benefit counselors and fitness class reimbursements.
  - Growth: Annual learning and development budget and real
    career growth in a fast-scaling organization.

  Equal opportunity employer

  We celebrate diversity and are committed to creating an
  inclusive environment for all employees. We provide a fair
  and accessible hiring process. If you require accommodations
  during the application or interview stage, please let us
  know.

  United States - Remote Pay Range

  $160,000—$200,000 USD
