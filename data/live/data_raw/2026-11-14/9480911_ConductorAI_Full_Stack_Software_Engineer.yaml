description: |
  Introduction

  We value candidates who have significant experience with
  managing complexity, working independently, and are
  motivated by hard problems.

  What We Offer

  - The ability to have real impact on mission-critical
    workflows
  - The chance to use state-of-the-art tech to solve novel
    problems with mission partners
  - The opportunity to define your role through time as we grow
  - Competitive salary and equity upside with annual merit
    refreshes based on impact

  Position Overview

  As an early full-stack engineer, you’ll help build
  Conductor’s core application: a user-facing web platform for
  large scale document search and review. You’ll work on
  document-processing pipelines, an agentic workflow execution
  system, database scaling problems, and generally pushing
  SOTA LLMs to their limits. Our tech stack is
  TypeScript/React, Python/FastAPI, and Postgres.

  This is a product engineering role as much as a systems
  role. You’ll design and craft interfaces to make complex
  document-centric workflows intuitive and joyful to interact
  with. You’ll partner closely with users in defense,
  government, and regulated commercial environments to empower
  them to move faster without sacrificing accuracy or
  security.

  We are seeking an engineer with a generalist skillset and
  attitude, diverse technical background, and a willingness
  and ability to learn new technologies on the job. You'll be
  working on a small, tight-knit technical team, with the
  opportunity to help define and mature our architecture and
  processes as we grow. You'll be expected to communicate
  complex technical concepts with all members of the team and
  lead product efforts involving multiple team members with
  varying levels of technical literacy.

  Location This role is open to fully remote candidates within
  the US. East Coast and especially NYC/DC preferred.

  Key Responsibilities

  - Optimize search and review agents for accuracy and
    consistency
  - Build polished, reliable user-facing features in a
    Next.js/React application
  - Design backend APIs, data models, and workflow execution
    paths that support responsive frontend experiences
  - Write high quality code within a small team that cares about
    implementation quality, maintainability, and performance
  - Help design and improve the architecture of the system
  - Work with users and other team members to help define and
    refine product direction
  - Contribute to company strategy, nurture and shape our
    growing culture, and take on diverse responsibilities as
    we evolve.

  Qualifications

  - US citizenship required; this role supports work subject to
    US government contract obligations and export control
    regulations (ITAR/EAR)
  - 3+ years as a professional software engineer
  - Strong communication skills, both written and verbal
  - Strong product sense and care for usable interfaces
  - Proactive mindset, with a knack for identifying
    opportunities and taking initiative and ownership
  - Experience with system design
  - Proficiency in Python and TypeScript/React
  - Experience with LLMs and AI engineering techniques

  Nice to Haves

  - Experience in defense, intelligence, national security, or
    other regulated operational domains
  - Experience interacting with end-users
  - Familiarity with document processing pipelines
  - Experience at an early-stage startup
  - Active or current security clearance

  The base salary range for this role is $160,000–$250,000,
  with the opportunity for significant equity commensurate
  with a Series A stage opportunity. Starting pay will be
  based on a number of factors including qualifications,
  experience, and location. This range reflects base salary
  only and does not include equity or other compensation
  components.

  In accordance with New York pay transparency law, the base
  salary range listed above applies to candidates in New York
  state. Compensation for candidates in other locations may
  vary based on local market conditions and will fall within
  the range stated above.

  ConductorAI is an equal opportunity employer. We do not
  discriminate on the basis of race, color, religion, sex,
  national origin, age, disability, veteran status, genetic
  information, sexual orientation, gender identity, or any
  other characteristic protected by applicable law.
