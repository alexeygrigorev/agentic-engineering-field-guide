description: |
  At T-Mobile, we invest in YOU!  Our Total Rewards Package
  ensures that employees get the same big love we give our
  customers.  All team members receive a competitive base
  salary and compensation package - this is Total Rewards.
  Employees enjoy multiple wealth-building opportunities
  through our annual stock grant, employee stock purchase
  plan, 401(k), and access to free, year-round money coaches.
  That’s how we’re UNSTOPPABLE for our employees!

  This role is essential for designing, implementing, and
  deploying scalable software solutions that meet customer
  requirements and support high availability environments. The
  role involves collaborating with engineers to develop
  software components using technologies such as
  virtualization, microservices, software-defined networking,
  network functions virtualization, and big data. It requires
  independent judgment to resolve technical issues and make
  recommendations for software design and implementation.
  Success is measured by the ability to deliver effective
  software solutions that integrate with system protocols and
  meet business and technical requirements. The work impacts
  organizational capabilities by enabling advanced software
  systems that improve operational efficiency and customer
  experience.

  MAIN RESPONSIBILITIES:

  Develop software solutions and conduct tests to drive
  engineering projects and ensure quality deliverables

  Contribute to design innovations that improve systems,
  processes, or services using new frameworks and industry
  best practices

  Collaborate with technical teams to deliver solutions and
  mentor others through knowledge sharing and training
  sessions

  Support technology strategy by evaluating and applying
  current technologies that align with business goals

  Create clear documentation for software code, system
  designs, and business requirements to support knowledge
  sharing

  Also responsible for other duties/projects as assigned by
  business management as needed

  Education Level

  Bachelor's Degree

  plus 5 years of related work experience OR Advanced degree
  with 3 years of related experience

  Acceptable areas of study include Computer Science, Software
  Engineering, Information Management or equivalent experience
  in field

  • At least 18 years of age

  • Legally authorized to work in the United States

