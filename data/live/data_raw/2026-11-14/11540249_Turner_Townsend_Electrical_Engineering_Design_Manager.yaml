description: |
  Company Description

  Turner & Townsend is a global professional services company
  with over 22,000 people in more than 60 countries.

  Working with our clients across real estate, infrastructure,
  energy and natural resources, we transform together
  delivering outcomes that improve people’s lives. Working in
  partnership makes it possible to deliver the world’s most
  impactful projects and programmes as we turn challenge into
  opportunity and complexity into success.

  Our capabilities include programme, project, cost, asset and
  commercial management, controls and performance, procurement
  and supply chain, net zero and digital solutions.

  We are majority-owned by CBRE Group, Inc., the world’s
  largest commercial real estate services and investment firm,
  with our partners holding a significant minority interest.
  Turner & Townsend and CBRE work together to provide clients
  with the premier programme, project and cost management
  offering in markets around the world.


  Please visit our website: www.turnerandtownsend.com

  Job Description

  Are you passionate about creating smarter, safer, and more
  efficient design solutions? Are you ready to work on
  critical national infrastructure with a fantastic team? Then
  this could be the opportunity you've been waiting for. The
  Real Estate team are undergoing an exciting period of
  growth, due to increased client demand we are looking for
  experienced and aspiring Engineering Design Managers to join
  an experienced and supportive team.

  Our Design Managers are more than just technical leads —
  they're strategic thinkers, collaborators, and problem
  solvers. You'll work closely with our clients ensuring that
  the final project is fit for purpose. Your focus: ensuring
  designs are buildable, compliant, innovative and efficient.
  You will be leading design input on multi-disciplinary
  projects, from early concepts through to delivery.

  Working across a range of prestigious infrastructure
  projects, stemming from sectors including data centres,
  advanced manufacturing, defence, heavy industrial, rail,
  aviation and through all main real estate and industrial
  sectors we are confident you will diversify your project
  experience with us. Our clients are at the fore-front of
  industry leading change and we are keen to speak to like-
  minded individuals at various stages within their career to
  see what Turner & Townsend can offer you.

  - Work with the Project Manager to manage the agreed contract
    with external design consultants and contractors, ensuring
    that duties are discharged under the contract and if not,
    that appropriate action is taken.
  - To lead technical assurance, review constructability, and
    manage design interfaces – not to accept, approve, or
    amend designs but to manage, evaluate and guide the design
    the process.
  - Management of multi-disciplinary teams of Engineers from
    consultants, and partner companies in the production of
    project solutions to the required level of design.
  - Collaboration with other technical, operational,
    maintenance, and strategic stakeholders and design
    coordinators.
  - Liaison with Clients, Engineering Managers, Project
    Managers, Contractors and Consultants concerning project
    issues, scope changes, risks, etc.
  - Drive the development of innovative, practical and
    sustainable engineering solutions that meet client,
    operational and regulatory requirements.
  - Embed health, safety and environmental considerations into
    all engineering and design solutions
  - Ensure effective integration across civil, structural,
    geotechnical, mechanical and Electrical functions.
  - Ensure constructability, maintainability and reliability
    across the whole asset lifecycle.

  Qualifications

  - Strong experience managing design through the full project
    lifecycle - ideally across a range of sectors and
    procurement routes.
  - A strong understanding of integrated design delivery and
    managing consultant performance.
  - Knowledge and experience of Building Information Modelling
    (BIM) and common data environments
  - Degree qualified, or equivalent, in engineering discipline
    Electrical Engineering
  - Chartered Engineer (Preferred) Status with CIBSE, IET or
    similar
  - Passionate about construction and customer satisfaction,
    with a focus on high standards and excellence.
  - Strong practical knowledge of construction work types,
    methods and design solutions.
  - Experience with CAD (AutoCAD or Revit)
  - Excellent communication skills with the ability to liaise
    effectively with both clients and staff
  - Self-driven and results-oriented with a positive outlook
  - People management, time management, and project design
    management skills

  Additional Information

  Our inspired people share our vision and mission. We provide
  a great place to work, where each person has the opportunity
  and voice to affect change.

  We want our people to succeed both in work and life. To
  support this we promote a healthy, productive and flexible
  working environment that respects work-life balance. 

  Turner & Townsend is an equal opportunity employer. We
  celebrate diversity and are committed to creating an
  inclusive environment for all employees and actively
  encourage applications from all sectors of the community.

  Please find out more about us at www.turnerandtownsend.com/

