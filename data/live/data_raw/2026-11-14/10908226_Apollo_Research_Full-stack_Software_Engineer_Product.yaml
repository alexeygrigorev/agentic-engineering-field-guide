description: |
  THE OPPORTUNITY

  We are building Watcher, a coding agent security product.
  Watcher is deployed in production and monitors billions of
  agent tokens per month across engineering teams at agent-
  building scale-ups and enterprises. We are looking for a
  product engineer to build and scale Watcher end to end.

  This role includes backend and frontend components. You will
  own features across the full stack, from agent hooks and
  ingestion pipelines to monitoring dashboards and enterprise
  integrations. You can expect to  own features from customer
  conversation to production deployment.

  This is truly a “start-up role”: you will own big chunks of
  the product, make decisions fast, and ship at high volume.
  You will join a small team with significant ability to shape
  the product and tech, and you can earn more responsibility
  quickly. This is an individual contributor role but could
  lead to management responsibilities eventually, if desired.

  KEY RESPONSIBILITIES

  - Design, build, and ship Watcher features across the stack:
    agent-side hooks and CLI tooling, ingestion and grading
    pipelines, real-time monitoring UI (Watcher Live), and the
    organization-wide Analyzer dashboard.
  - Own features end to end, from ambiguous requirements to
    production: talk to users, scope the work, make the
    technical decisions, put that into production, and iterate
    based on usage.
  - Build Watcher integrations:  We currently support Claude
    Code and Codex, but we’re planning on increasing our
    coverage to other coding agents, LLM gateways, and
    anywhere that could benefit from agent monitoring.
  - Build the policy and configuration layer that lets security
    teams set org-wide guardrails for  engineers to operate
    safely within.
  - Turn monitoring research (new monitors, grading strategies,
    backtesting results) into production-ready product
    features. We are "our own customer": You will use the
    product you build every day.
  - Design and operate backend systems that process large
    volumes of agent logs in real time.
  - Own reliability: robust error handling, graceful
    degradation, and observability (logging, metrics, tracing,
    alerting). We should catch issues before customers do.
  - Architect data models and storage that handle both high-
    throughput writes and complex analytical queries over
    historical trajectories. Retention policies have to fit
    highly sensitive customer data.
  - Make sure Watcher is safe to deploy: Work with our AI
    Security & Control Engineer on tenant isolation,
    encryption, and access controls. Watcher touches some of
    the most sensitive data our customers have.
  - Build and maintain integrations with the enterprise security
    stack, e.g. streaming monitoring alerts into SIEM systems
    and existing security operations workflows.
  - Support flexible deployment models: cloud-hosted, on-prem,
    and local backends, so sensitive agent logs never have to
    leave customer control.
  - Talk to customers, debug issues in their environments, and
    feed what you learn back into the roadmap.

