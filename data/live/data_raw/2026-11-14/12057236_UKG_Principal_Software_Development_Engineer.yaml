  Engineer - Enterprise Finance Solutions

  Position Summary

  We are seeking a seasoned Principal Software Development
  Engineer to lead the design, implementation, integration,
  and optimization of enterprise Finance solutions within a
  global environment. The ideal candidate will bring deep
  expertise in Finance business processes, ERP platforms (SAP
  S/4HANA or Microsoft Dynamics 365), system integrations,
  finance data management, quality engineering, and AI-enabled
  automation. This individual will partner closely with
  Finance stakeholders, Product Owners, architects, and
  engineering teams to translate business requirements into
  scalable, secure, and high-quality solutions that support
  global Finance transformation initiatives.

  Key Responsibilities

  Finance Solution Leadership • Lead the design and
  implementation of end-to-end Finance solutions across core
  Finance processes, including Record-to-Report (R2R), Order-
  to-Cash (O2C), General Ledger, Accounts Receivable, Asset
  Accounting, Tax, and Intercompany Accounting. • Partner with
  Finance stakeholders to define business requirements and
  deliver scalable ERP solutions that improve efficiency,
  controls, and global process standardization. • Provide
  functional leadership through solution design reviews,
  process harmonization initiatives, and Finance
  transformation programs. Solution Engineering & Integration
  • Translate Finance requirements into functional, technical,
  integration, and data specifications. • Collaborate with
  engineering, architecture, integration, and external
  implementation teams to deliver robust enterprise solutions.
  • Lead analysis and resolution of complex process,
  configuration, integration, and data issues across
  enterprise platforms. Data Migration, Quality & Deployment •
  Lead Finance data migration, validation, reconciliation, and
  cutover activities for global ERP programs. • Establish
  controls to ensure data integrity, compliance, and
  successful transitions from legacy systems. • Drive end-to-
  end testing, SIT/UAT governance, business acceptance, go-
  live readiness, and post-production stabilization.

  AI Automation & Innovation • Identify and implement AI-
  driven automation opportunities across Finance processes. •
  Design AI-enabled solutions that integrate ERP systems,
  enterprise data platforms, APIs, and workflow technologies.
  • Ensure appropriate AI governance, security controls,
  observability, and human-in-the-loop validation frameworks.
  Stakeholder Management • Act as a trusted advisor to Finance
  leadership, Product Owners, architects, and engineering
  teams. • Drive alignment across global and regional
  stakeholders and facilitate solution decisions in complex
  organizational environments.

  Basic Qualifications • 10+ years of experience delivering
  enterprise Finance technology solutions, ERP
  implementations, and Finance transformation initiatives. •
  Hands-on experience with SAP S/4HANA and/or Microsoft
  Dynamics 365. • Strong understanding of Finance processes,
  ERP architecture, system integrations, and financial data
  management. • Experience leading data migration,
  reconciliation, testing, and quality assurance efforts for
  large-scale ERP programs. • Proven ability to work across
  Finance, Product, Architecture, and Engineering
  organizations to deliver business outcomes. • Strong
  analytical, troubleshooting, and problem-solving skills
  across application, integration, data, and workflow layers.
  • Advanced degree in Business, Finance, Accounting,
  Information Systems, or a related field; MBA or CPA
  preferred. • Demonstrated experience leading global Finance
  transformation programs across multiple regions (Americas,
  EMEA, and APAC).

  Preferred AI Experience Experience with one or more of the
  following: • Generative AI and Large Language Models (LLMs)
  • Agentic AI and tool-calling architectures • Retrieval-
  Augmented Generation (RAG) • AI evaluation and automated
  quality testing • AI governance, guardrails, and human-in-
  the-loop workflows • Model and agent observability •
  Enterprise AI security and compliance frameworks Company
