description: |
  About Us

  Health is the most important thing in life, and the American
  healthcare system is completely broken - poor outcomes, high
  cost, bad patient experience. We're building a new system
  from the ground up. Our mission is to improve people’s
  health by making it easy to live a healthy lifestyle.
  Nourish is the country's largest dietitian-led metabolic
  health clinic. We’re an AI-native digital health system
  matching patients with 10,000+ Registered Dietitians,
  physicians, medications, lab testing, and AI agents to
  deliver insurance-covered care across all 50 states. Founded
  four years ago, we've completed millions of appointments,
  tripled year-over-year, and partnered with health plans
  covering 200M+ Americans across 250+ health systems. In 2026
  we raised a $100M Series C, bringing total funding to $215M.
  The round was led by Menlo Ventures, with participation from
  Thrive Capital, Index Ventures, J.P. Morgan Growth Equity
  Partners, Maverick Ventures, Y Combinator, BoxGroup,
  Atomico, Daybreak, and Operator Partners. Learn more about
  our Series C here: Nourish Blog, Bloomberg, Fierce
  Healthcare, Digital Native, The Pulse Podcast. This is not a
  job for everyone. We hold an extremely high bar because we
  believe talent density is our biggest competitive advantage.
  We're looking for people who actively choose hard, ambiguous
  problems, who run toward unglamorous work, give and receive
  candid feedback, and bring relentless resilience without the
  ego. Our work is important, but we are not self-important.
  We do this because we’re solving one of the hardest problems
  in the world, and the problem matters. If that's you, we
  disproportionately reward it.

  About the Role

  Nourish is seeking a hands-on Engineering Manager to lead
  Provider Quality. Reporting to our Director of Engineering,
  you’ll own the team responsible for helping every Nourish
  clinician deliver exceptional and personalized care that
  helps their patient achieve their desired health outcomes —
  the foundation of patient retention and Nourish’s mission.

  This team is taking one of Nourish’s biggest product and
  technical swings: evolving the clinician experience from a
  traditional chart into an intelligent, data-driven, real-
  time care platform. During a session, our platform
  transcribes the conversation and surfaces relevant,
  condition-specific guidance while keeping clinical judgment
  front and center with the provider. Afterward, the same
  intelligence layer will power chart notes, personalized
  coaching, and provider development.

  This is a hands-on leadership role for someone who enjoys
  developing engineers, shaping products, and remaining close
  to architecture and implementation. You’ll work closely with
  clinical leadership, product, design, and data to define
  what high-quality care looks like, translate it into useful
  products, and measure its effect on patient and provider
  outcomes.

  This is a full-time role. We strongly prefer candidates
  based in New York City or San Francisco, with exceptions for
  truly exceptional candidates. Check out Engineering at
  Nourish to learn more about our team and what we’ve already
  built.

  Key Responsibilities

  - Build, lead, and develop a high-performing team of 4–5
    engineers with strong technical ownership.
  - Coach engineers through regular feedback, career
    development, calibration, and performance management.
  - Scale the team through recruiting, interviewing, hiring, and
    onboarding.
  - Stay hands-on through architecture, pair programming,
    coding, code reviews, and on-call.
  - Partner with product and design to write requirements, shape
    roadmaps, scope work, plan sprints, and deliver measurable
    outcomes.
  - Drive thoughtful decisions around system design, code
    quality, observability, reliability, and scalability.
  - Establish effective team rituals, including sprint planning,
    OKR planning and reporting, quarterly planning, and
    retrospectives.
  - Operate with urgency and sound judgment in a fast-paced,
    ambiguous environment.
  - Set the technical and product direction for the clinician-
    facing quality platform.
  - Build AI-assisted workflows that transform session
    transcripts into accurate chart notes, coaching insights,
    and useful quality signals.
  - Create prescriptive experiences that help clinicians
    identify and take the optimal next action for each
    patient.
  - Partner closely with clinical leadership, providers,
    product, design, data, and compliance to define and
    measure care quality.
  - Design human-in-the-loop systems with strong evaluation,
    observability, privacy, and safety practices.
  - Connect quality improvements to patient outcomes, retention,
    and clinician effectiveness.

  We’d Love to Hear from You If You:

  - Have 6+ years of professional software engineering
    experience with modern full-stack technologies and 2+
    years of hands-on engineering management experience.
  - Have hired engineers and managed performance, promotions,
    and career development.
  - Remain technical enough to pair program with your team and
    contribute directly when needed.
  - Bring exceptional product judgment: you can write a PRD,
    critique or mock a design, size an opportunity, and make
    progress without waiting on a PM.
  - Are highly proficient with React, TypeScript, Node.js,
    PostgreSQL, or similar modern stacks.
  - Have shipped and owned production systems in a fast-moving,
    ambiguous environment.
  - Balance people leadership with technical depth, delivery
    focus, and clear communication.
  - Are energized by Nourish’s mission to improve people’s
    health by making it easy to eat well.

  Nice to Have:

  - AI/ML product experience, especially LLM evaluation or
    human-in-the-loop systems
  - Clinician-facing products.
  - Privacy-sensitive workflows.
  - Regulated technology.

