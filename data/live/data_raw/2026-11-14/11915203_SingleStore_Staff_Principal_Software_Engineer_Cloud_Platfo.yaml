description: |
  We are looking for a high-impact Staff or Principal Software
  Engineer to drive the architecture, reliability, and scaling
  of our managed cloud offering, SingleStore Helios. In this
  role, you will lead the evolution of our multi-cloud SaaS
  control and data planes, manage high-density Kubernetes
  deployments across major hyperscalers, and partner directly
  with our AI Platform initiatives.

  As a senior technical leader, you will balance greenfield
  architecture with hands-on systems programming and
  operational resilience. You will also allocate approximately
  10–20% of your bandwidth toward high-priority Tier-3
  operational escalations, identifying root causes in
  production distributed systems to inform durable platform
  architecture.

  What You’ll Do

  - Architect Distributed SaaS Infrastructure: Design,
    implement, and scale multi-tenant Kubernetes operators,
    custom controllers, and orchestration workflows managing
    thousands of customer database clusters globally.
  - Write Resilient Systems Code: Develop performant, fault-
    tolerant backend services and control planes using modern
    Go language & Python.
  - Lead Cloud Networking Design: Own cross-cloud networking
    topology, ingress/egress controls, multi-region routing,
    VPC peering/PrivateLink topologies, DNS architectures, and
    service mesh performance (Envoy, Cilium, or Istio) across
    AWS, Azure, and GCP.
  - Support AI Platform Capabilities: Collaborate across
    business units to build scalable compute, vector indexing
    pipelines, and ingestion infrastructure supporting real-
    time GenAI and vector workloads on Helios.
  - Production Operations & Tier-3 Escalations: Dedicate 10–20%
    of your bandwidth to diagnosing complex production issues,
    acting as the final escalation point for deep
    infrastructure failures, performance bottlenecks, and
    kernel/networking anomalies.
  - Security & Compliance by Design: Build infrastructure that
    upholds our strict enterprise compliance posture,
    maintaining automated controls for SOC 2 Type II, ISO
    27001, HIPAA, and PCI-DSS environments.
  - Technical Force Multiplier: Author clear RFCs/architectural
    design records (ADRs), mentor senior engineers, lead
    cross-functional reviews, and partner with Product and SRE
    teams to align roadmap priorities.

  What We’re Looking For

  - 8–12+ years of professional software engineering experience
    designing, deploying, and operating distributed enterprise
    SaaS platforms at scale.
  - Deep Kubernetes Expertise: Hands-on mastery of Kubernetes
    internals, CRDs, custom controller development (client-
    go/controller-runtime), scheduling dynamics, and container
    networking/runtime internals.
  - Strong OO / Systems Proficiency: Expert proficiency in Go
    and Python with an emphasis on concurrent programming,
    low-latency I/O, and distributed state management.
  - Cloud Provider Networking: Deep operational literacy in
    cloud networking constructs (e.g., Transit Gateways,
    DirectConnect/ExpressRoute, Private Service Connect, CIDR
    subnetting, MTLS, and load balancing).
  - AI Platform Awareness: Practical familiarity with the
    compute, caching, and storage dynamics needed for real-
    time AI/ML pipelines, retrieval-augmented generation
    (RAG), and vector embeddings.
  - Diagnostic Acumen: Proven ability to debug complex, non-
    deterministic bugs in production across network layers,
    memory allocations, and distributed consensus.
  - Communication & Collaboration: Outstanding written and oral
    communication skills, with a track record of driving
    cross-team alignment and influencing executive-level
    technical strategy.

  Preferred Qualifications

  - Prior experience building managed database-as-a-service
    (DBaaS) or data-intensive streaming infrastructure.
  - Active open-source contributions within the CNCF or cloud-
    native container ecosystem.
  - Familiarity with Infrastructure-as-Code tooling (Terraform,
    Pulumi, Crossplane).

  SingleStore delivers our cloud-native database with the
  speed and scale to power the world’s data-intensive
  applications. With a distributed SQL database that
  introduces simplicity to your data architecture by unifying
  transactions and analytics, SingleStore empowers digital
  leaders to deliver exceptional, real-time data experiences
  to their customers. SingleStore is venture-backed and
  headquartered in San Francisco with offices in Sunnyvale,
  Raleigh, Seattle, Boston, London, Lisbon, Bangalore, Dublin
  and Kyiv.

  Consistent with our commitment to diversity & inclusion, we
  value individuals with the ability to work on diverse teams
  and with a diverse range of people.

  To all recruitment agencies: SingleStore does not accept
  agency resumes. Please do not forward resumes to SingleStore
  employees. SingleStore is not responsible for any fees
  related to unsolicited resumes and will not pay fees to any
  third-party agency or company that does not have a signed
  agreement with the Company.

  SingleStore values individuals for their unique skills and
  experiences, and we’re proud to offer roles in a variety of
  locations across the United States. Salary is based on
  permissible, non-discriminatory factors such as skills,
  experience, and geographic location, and is just one part of
  our total compensation and benefits package. Certain roles
  are also eligible for additional rewards, including merit
  increases and annual bonuses.

  For candidates residing in California, please see our
  California Recruitment Privacy Notice. For candidates
  residing in the EEA, UK, and Switzerland, please see our
  EEA, UK, and Swiss Recruitment Privacy Notice.

  SingleStore’s total salary range for this role, if based in
  Boston, Chicago, New York, Austin, Phoenix, Las Vegas,
  Seattle, Washington, or Dallas is: $140,000 - $215,000 USD
  per year

