description: |
  Thank you for your interest in Uncountable Implementations
  Engineering!

  About Uncountable

  Science moves slowly — not because researchers aren't
  brilliant, but because their tools haven't kept up.
  Uncountable is changing that. We build a unified R&D
  platform used by the world's leading chemists, material
  scientists, and biologists to dramatically accelerate how
  new products are discovered, developed, and brought to
  market.

  Founded by engineers from MIT and Stanford, and trusted by
  enterprise R&D organizations across chemicals,
  pharmaceuticals, advanced materials, and food & beverage,
  Uncountable is on a mission to accelerate industrial R&D by
  an order of magnitude. Implementations Engineering is a
  small, high-velocity team — and every person here makes a
  real difference.

  The Role

  We're looking for a scientifically-minded software engineer
  to join our Implementations Engineering team. This is a rare
  hybrid role that sits at the intersection of software
  development and scientific domain expertise, where you'll
  spend your time building real, production-grade software
  that connects Uncountable's platform to the actual
  instruments, systems, and workflows used in R&D labs around
  the world.

  When a biotechnology company wants their HPLC instrument to
  automatically push results into Uncountable, or a materials
  company needs their legacy LIMS data migrated and mapped
  into a structured format, you're the engineer who makes that
  happen. You'll write Python scripts, design data pipelines,
  connect to APIs, and work directly with customers to
  understand their data environments and deliver solutions
  that save their scientists hours every week.

  This isn't a support role — it's an engineering role with a
  domain twist. You'll have real ownership over your work,
  interact directly with customers, and see the direct impact
  of what you build.

  What You'll Do

  - Build data integrations that ingest outputs from lab
    instruments (spectrometers, rheometers, HPLCs, and more)
    into Uncountable's platform
  - Design and implement automated data transfer pipelines that
    connect customer systems — ELNs, LIMS, spreadsheets,
    databases — to Uncountable
  - Write Python scripts and tooling to parse, validate, and
    transform scientific data files in a wide variety of
    formats
  - Work directly with customer technical teams to understand
    their data environments, map their schemas, and deliver
    clean, well-documented integrations
  - Collaborate with Uncountable's core engineering team to
    identify integration patterns that can be built into the
    product itself
  - Debug and maintain existing integrations as customer needs
    evolve and data sources change
  - Contribute to internal tooling and shared libraries that
    make future integrations faster and more reliable

  Requirements

  - Programming experience: Coursework or professional
    experience equivalent to 4 university-level CS courses;
    comfort writing Python or another scripting language to
    process data files
  - Scientific background: Meaningful knowledge of chemistry,
    materials science, biology, or a related life/physical
    science — enough to understand what a researcher means
    when they talk about their data
  - Genuine curiosity about software engineering and how
    technology can transform scientific workflows
  - Problem-solving mindset: Comfortable diving into unfamiliar
    file formats, APIs, and data structures to figure things
    out

  Preferred Qualifications

  - B.S. in Computer Science, Chemical Engineering, Materials
    Science, Chemistry, Bioengineering, or a related field
  - Experience working with APIs (REST), SQL databases, or
    Excel/CSV data pipelines
  - Exposure to lab environments, scientific instrumentation, or
    research data workflows
  - Prior experience at a startup or in a fast-paced technical
    environment

  Why This Role Is Exciting

  - Real-world impact: You'll directly accelerate the work of
    PhD scientists at major companies — what you build makes
    their research faster and more reproducible
  - Domain depth: You'll develop rare expertise at the
    intersection of software engineering and industrial R&D —
    a skillset that opens doors across biotech, materials,
    chemicals, and beyond
  - Customer exposure: Unlike most engineering roles, you'll
    interact directly with the people using your software,
    getting fast feedback and building relationships with R&D
    leaders at world-class organizations
  - Ownership from day one: At a company of our size, you won't
    be a cog. You'll scope, build, and ship your own
    integrations, and your ideas will shape how we approach
    future work
  - Engineering-first culture: We're a team that takes pride in
    writing high-quality code quickly. You'll learn from
    strong engineers and be develop quickly

  Benefits

  - Competitive salary and equity
  - Health and dental insurance
  - 401(k) with employer contribution (US locations)
  - Direct mentorship and fast career growth on a small, high-
    caliber team

